    query: "baseline_entity = profile(user/host) ; baseline_peers = profile(dynamic_peer_group)\nFOR each\
      \ activity (auth/access):\n  score = anomaly(activity vs baseline_entity, vs baseline_peers)\n \
      \ factors = [new_geo, new_asn, unusual_time, first_resource_access, enumeration]\nWHERE score >\
      \ threshold -> ALERT emit(entity, contributing_factors)"
