name: 'D3-ANET: Authentication Event Thresholding'
id: 80977db2-ab81-44d8-8378-727b307560f9
description: Investigate authentication telemetry to determine whether successful or failed logon events
  deviate from per-user and peer-group baselines for source location, host affinity, timing, concurrency,
  fan-out, and failure-to-success patterns. This playbook layers deterministic floor rules (known-hostile
  origins, concurrent accounts on a host, single-account fan-out, failure-burst-then-success, password-spray
  distinct-user counts, structurally invalid logins), statistical baselining (per-user deviation scores,
  failed-auth drift and bursts, authentication-graph edge rarity and footprint growth, structural-anomaly
  scoring), and explainable machine learning (graph link prediction, supervised graph-feature classifiers,
  sequence/language models, login-path rarity ranking, and UEBA peer-group scoring) over first-party identity
  telemetry. It helps an analyst surface compromised credentials, lateral movement, brute-force/password-spray
  success, and anomalous authentication origins while profiling failure rates (failed logons / lockouts)
  as distinct signals.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
