name: 'D3-ANAA: Administrative Network Activity Analysis'
id: 800740bd-43e0-4d17-a94d-8c001fefd840
description: Investigate possible unauthorized or anomalous use of administrative network protocols (SSH,
  RDP, WinRM, VNC, SNMP, remote registry/named-pipe administration) by comparing observed remote-management
  activity against a baseline of approved administrator behavior. This playbook helps an analyst determine
  whether management-protocol sessions originate from approved sources, reach approved destinations, occur
  in expected time windows, and behave consistently with a known per-user and per-segment baseline. It
  combines deterministic allow-list checks (approved access matrix, explicit-credential correlation, remote
  registry/named-pipe abuse), statistical baselining (failure-rate profiling, per-user behavioral drift,
  seasonal protocol-volume modeling), and machine learning (graph-based rare-edge scoring, credential-switching
  path inference, unsupervised session clustering) so the analyst can distinguish legitimate administration
  from an adversary abusing valid credentials and administrative protocols for initial access, lateral
  movement, persistence, or discovery.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are administrative remote-management protocols (SSH on 22, RDP on 3389, WinRM on 5985/5986,
    VNC on 5900-5901, SNMP on 161) being used between host pairs or over ports that are not present in
    our approved administrator access matrix?
  context: 'Detection objective: catch unauthorized administrative protocol use that tries to blend in
    with normal system-administration traffic. Parse Zeek conn.log for management-protocol sessions and
    require each (source, destination) pair to exist in an approved administrator access matrix. Alert
    when an admin protocol is used between unapproved host roles (workstation-to-workstation, an internet
    source reaching a server management interface) following the approved-source/destination allow-list
    pattern of the [Publicly Accessible RDP Service Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/network/zeek/zeek_rdp_public_listener.yml)
    and the per-host baselining in the [Vectra suspicious administrative activity patent](https://patents.google.com/patent/US20180077186A1).
    Also alert on admin protocols on non-standard ports (e.g., RDP not on 3389) per [Atomic Red Team T1021.001](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.001/T1021.001.md).
    A positive result (an off-matrix path or non-standard port) is a strong lead for adversary use of
    valid accounts under the Detect tactic; a negative result indicates the path matches approved administration.
    Tune the matrix against an inventory/CMDB to suppress false alarms.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Windows Event ID 4648
  - 'NAI: Domain Controllers, Critical servers (e.g., database, application servers), Network management
    interfaces, Cloud administration consoles'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "admin_ports = {22:'SSH',3389:'RDP',5985:'WinRM',5986:'WinRM',5900:'VNC',5901:'VNC',161:'SNMP'}\n\
      for s in conn.log where id.resp_p in admin_ports:\n  proto = admin_ports[s.id.resp_p]\n  if (s.id.orig_h,\
      \ s.id.resp_h, proto) not in approved_admin_matrix:\n    alert('off-matrix admin protocol', s)\n\
      \  // non-standard port: service classified as RDP/SSH but port not canonical\n  if s.service in\
      \ {'rdp','ssh','winrm'} and s.id.resp_p != canonical_port[s.service]:\n    alert('admin protocol\
      \ on non-standard port', s)"
- question: Is explicit-credential use for remote administration (Windows Event ID 4648 correlated with
    4624 Logon Types 3 and 10, plus 4672 privileged logons and 7045 service installs) originating from
    unmanaged jump hosts or from subnets not assigned to administration teams?
  context: 'Detection objective: identify abuse of explicit credentials (runas / alternate credentials)
    for remote administration that signals credential theft or lateral movement. Correlate Windows Event
    ID 4648 (logon with explicit credentials) with 4624 Logon Type 3 (network) and 10 (RemoteInteractive/RDP),
    and pull 4672 (special privileges assigned) and 7045 (service installed) using the Event-ID mapping
    in [JPCERT/CC Detecting Lateral Movement through Tracking Event Logs](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
    Trigger high-priority alerts when privileged or service accounts authenticate from unmanaged jump
    hosts or from subnets not assigned to admin teams. A positive result ties an explicit-credential admin
    logon to an unexpected source, a hallmark of adversaries reusing stolen credentials; a negative result
    confirms admin logons originate from sanctioned jump boxes. This directly supports the Detect tactic
    by exposing unauthorized administrative authentication.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join e4648 (explicit cred logon) with e4624 where LogonType in (3,10)\n  on (TargetLogonId\
      \ / time-window correlation)\nenrich with e4672 (privileged) and e7045 (service install)\nwhere\
      \ Account in privileged_accounts or service_accounts\n  and SourceIP not in admin_team_subnets\n\
      \  and SourceHost not in approved_jump_hosts\n=> high_priority_alert('explicit-credential admin\
      \ logon from unmanaged source')"
- question: Is the WINREG named pipe over SMB (TCP/445), or the svcctl/atsvc pipes, being accessed from
    sources outside the approved administration set, indicating remote registry or remote service/scheduled-task
    abuse?
  context: 'Detection objective: detect remote registry and named-pipe administrative abuse used for lateral
    movement, persistence, or host discovery. Decode the WINREG named pipe over SMB (TCP/445) in Zeek
    smb_files.log / dce_rpc.log and correlate with the RemoteRegistry service to flag remote registry
    manipulation per [MITRE CAR-2014-11-005: Remote Registry](https://car.mitre.org/analytics/CAR-2014-11-005/).
    Alert when remote registry, svcctl (service control), or atsvc (scheduled tasks) pipes are accessed
    by sources outside the approved administration set, and enumerate the pre-existing legitimate baseline
    first to control false positives. A positive result shows a host remotely manipulating another host''s
    registry/services from an unapproved source, a strong lateral movement or persistence signal; a negative
    result reflects sanctioned remote management. This advances the Detect tactic by surfacing covert
    admin-protocol abuse riding on SMB.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "admin_pipes = {'winreg','svcctl','atsvc'}\nfor r in dce_rpc.log where r.named_pipe in admin_pipes\
      \ or r.endpoint in admin_pipes:\n  if r.id.orig_h not in approved_admin_sources:\n    alert('remote\
      \ '+r.endpoint+' pipe access from unapproved source', r)\n// corroborate with smb_files.log path\
      \ containing winreg/svcctl/atsvc"
- question: Does any source show an abnormal rate or ratio of failed administrative authentications -
    Windows Event ID 4625 and Zeek conn.log sessions in S0/REJ/RSTO states against admin ports - consistent
    with brute force or credential spraying preceding admin access?
  context: 'Detection objective: profile admin-protocol failure rates as a distinct state signal that
    often precedes successful unauthorized access. Count Windows Event ID 4625 (failed logon) and Zeek
    conn.log sessions with conn_state of S0/REJ/RSTO targeting admin ports. Baseline normal failure ratios
    per source using failure distributions like the [LANL authentication dataset](https://csr.lanl.gov/data/cyber1/),
    and alert when a source''s failed:successful admin-auth ratio or absolute 4625 count over 10 minutes
    exceeds a tuned threshold (e.g., >5 failures followed by a success). A positive result (a burst of
    failures then a success) indicates brute force or spraying that may have culminated in admin access;
    a negative result shows failure rates within the source''s normal envelope. This supports the Detect
    tactic by catching the noisy precursor to credentialed admin-protocol abuse.'
  answer_sources: *id001
  range: Last 90 days, evaluated over rolling 10-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// per source, rolling 10-minute window

      fail = count(e4625) + count(conn.log where resp_p in admin_ports and conn_state in {S0,REJ,RSTO})

      succ = count(e4624 LogonType in (3,10)) + count(conn.log established to admin_ports)

      ratio = fail / max(succ,1)

      baseline = per_source_failure_baseline(source)

      if fail > 5 and succ >= 1: alert(''brute-force then success'', source)

      if ratio > tuned_threshold(baseline): alert(''anomalous admin-auth failure ratio'', source)'
- question: For each administrative account, does a new SSH/RDP/WinRM session deviate significantly from
    the account's 30-day baseline of source subnet, destination asset class, login hour, session duration,
    and edge rarity?
  context: 'Detection objective: score per-user behavioral drift to catch a compromised admin account
    behaving unlike its owner. Build a 30-day baseline per administrative account using source subnet,
    destination asset class, login hour, session duration, and edge rarity from Zeek ssh.log, Zeek rdp.log,
    and Windows Event ID 4624, using the per-user/per-edge statistical features defined by [Bian et al.](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf)
    Compute robust z-scores (median/MAD) and percentile ranks for each new session and alert when cumulative
    deviation exceeds a tuned threshold; surface the top-3 contributing features (e.g., new destination,
    off-hours, rare source) in the alert. A positive result flags a session that breaks the account''s
    habits - a common sign of credential abuse; a negative result confirms the session fits the user''s
    pattern. This deepens the Detect tactic with behavior-aware anomaly scoring rather than static rules
    alone.'
  answer_sources: *id001
  range: Last 90 days, scored against a trailing 30-day per-account baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[account] = features over last 30d: {src_subnet, dst_asset_class, login_hour,\n  session_duration,\
      \ edge_rarity} from ssh.log, rdp.log, e4624\nfor new_session s by account:\n  for f in features:\
      \ z[f] = (s[f] - median(baseline[account][f])) / (1.4826*MAD)\n  drift = sum(|z[f]|)  // cumulative\
      \ deviation\n  if drift > tuned_threshold:\n    alert('per-user admin behavioral drift', account,\
      \ top3(z))"
- question: Do hourly session counts and transferred byte volumes for SSH, RDP, or WinRM in a given network
    segment exceed seasonal (daily/weekly) prediction intervals, or breach static guardrails such as a
    single admin session moving more than 500 MB or 1 GB?
  context: 'Detection objective: track protocol volume anomalies by segment to catch bulk data movement
    or unusual admin activity surges. Aggregate hourly session counts (frequency) and transferred byte
    volume and ratios for SSH, RDP, and WinRM by network segment from Zeek conn.log, ssh.log, and rdp.log.
    Fit seasonal (daily/weekly) baselines with prediction intervals per [Mack et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf),
    and apply a robust outlier ensemble (PCA + k-means + Median Absolute Deviation) as in [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf);
    raise alerts when observed values exceed prediction intervals for two or more consecutive windows.
    Keep static guardrail thresholds (a single admin session moving >500 MB or >1 GB) in parallel with
    the seasonal model. A positive result indicates abnormal admin-channel volume - possible staging/exfiltration
    over admin protocols; a negative result reflects normal seasonal usage. This serves the Detect tactic
    by catching volumetric abuse that per-session rules miss.'
  answer_sources: *id001
  range: Last 90 days for training; evaluate hourly windows requiring two consecutive breaches
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for segment, proto in {SSH,RDP,WinRM}:\n  hourly = aggregate(conn.log/ssh.log/rdp.log) ->\
      \ {sessions, bytes, byte_ratio}\n  model = seasonal_fit(hourly, period=daily+weekly)  // prediction\
      \ intervals\n  if observed outside PI for >=2 consecutive windows: alert('volume anomaly', segment,\
      \ proto)\n  ensemble = PCA + kmeans + MAD outlier_score(hourly)\n  if ensemble flags outlier: alert('robust\
      \ outlier', segment, proto)\n  // static guardrail\n  if any session.bytes > 500MB: alert('large\
      \ admin transfer', session)"
- question: When administrative authentications are modeled as an account-to-host graph, does any new
    edge receive a low predicted probability (rare/novel) from an unsupervised graph-ML model, indicating
    an admin connection that has not been seen before?
  context: 'Detection objective: score rare authentication edges with graph ML to detect novel admin connections
    that allow-lists may not yet cover. Model administrative authentications as an account-to-host graph
    and score each new edge''s predicted probability with an unsupervised graph neural network as in [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf),
    or with scalable temporal link prediction as in [Euler](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf)
    ([code](https://github.com/iHeartGraph/Euler)); flag low-probability (rare/novel) admin edges for
    triage. Run in parallel with the deterministic allow-list (do not replace it) and include the rarest
    contributing edge features in the alert. A positive result (a low-probability edge) highlights an
    account reaching a host it has never administered - a lateral-movement indicator; a negative result
    means the edge is consistent with learned graph structure. This strengthens the Detect tactic with
    relationship-aware anomaly detection.'
  answer_sources: *id001
  range: Last 90 days for graph training; score new edges continuously
  queries:
  - technology: ML/pseudocode
    query: "G = build_graph(nodes=accounts+hosts, edges=admin_auths from ssh.log,rdp.log,e4624)\nmodel\
      \ = train_unsupervised_gnn(G)  // CyberGraph / Euler temporal link prediction\nfor new_edge (account\
      \ -> host):\n  p = model.predict_edge_prob(account, host)\n  if p < tuned_low_prob_threshold:\n\
      \    alert('rare/novel admin edge', account, host, rarest_features)"
- question: Are there reconstructed login paths across SSH/RDP/WinRM hops that switch credentials mid-path
    and reach destinations the originating account does not normally access?
  context: 'Detection objective: infer credential-switching movement paths to expose multi-hop lateral
    movement that single-session analysis cannot see. Reconstruct causal login paths across SSH/RDP/WinRM
    hops and flag paths that switch credentials and reach destinations the account does not normally access,
    ranking by rarity to bound analyst load (~1 alert/day) as in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).
    Output the path (source, intermediate hosts, credential switch, destination) and the rarity score
    driving the alert. A positive result reveals an adversary chaining hosts and pivoting to new credentials
    to reach sensitive targets; a negative result shows admin sessions are direct and credential-consistent.
    This advances the Detect tactic by reconstructing the attacker''s movement narrative across administrative
    protocols.'
  answer_sources: *id001
  range: Last 90 days, correlated into multi-hop login paths
  queries:
  - technology: ML/pseudocode
    query: "events = login events from ssh.log,rdp.log,e4624/e4648 (with credential identity)\npaths =\
      \ reconstruct_causal_login_paths(events)  // Hopper\nfor path in paths:\n  if path has credential_switch\
      \ and path.destination not in normal_dest(path.start_account):\n    score = rarity(path)\n    rank\
      \ by score; emit top paths (~1/day)\n    alert('credential-switching movement path', path, score)"
- question: When admin sessions are clustered by protocol, source ASN, source subnet, destination role,
    session duration, and byte ratio, do any sessions fall outside learned clusters or produce high autoencoder
    reconstruction error, marking them as novel/anomalous?
  context: 'Detection objective: model novel admin session clusters to catch sessions that do not match
    any known behavior profile. Train an unsupervised model (DBSCAN or Isolation Forest) on features including
    protocol, source ASN, source subnet, destination role, session duration, and byte ratio. For online
    line-rate monitoring, complement with an autoencoder ensemble over incremental volume/rate/jitter
    statistics as in [Kitsune](https://arxiv.org/abs/1802.09089) ([code](https://github.com/ymirsky/Kitsune-py)).
    Classify sessions outside learned clusters or with high reconstruction error as anomalous and surface
    the top-3 contributing features in the alert text for analyst triage. A positive result flags a session
    unlike any normal cluster - potential novel attacker tooling or behavior; a negative result places
    the session within established norms. This completes the Detect tactic with unsupervised, online anomaly
    detection layered over the deterministic and statistical checks.'
  answer_sources: *id001
  range: Last 90 days for model training; score sessions online/near real-time
  queries:
  - technology: ML/pseudocode
    query: "features = {protocol, src_asn, src_subnet, dst_role, session_duration, byte_ratio}\nmodel\
      \ = DBSCAN_or_IsolationForest(features over training window)\nfor s in sessions:\n  if model.is_outlier(s):\
      \ alert('novel admin session', s, top3_features(s))\n// online line-rate: Kitsune autoencoder ensemble\
      \ over volume/rate/jitter stats\nif kitsune.recon_error(s) > threshold: alert('high reconstruction\
      \ error', s, top3)"
