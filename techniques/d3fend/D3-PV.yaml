    query: "log_keys = parse(security_mitigations + defender_events)\n  extra_features = [crash_count,\
      \ blocked_conn_count]\n  model = DeepLog(seq_model, online_retrain=true)\n  IF model.is_anomalous(next_key\
      \ | history) OR param_anomaly:\n    emit alert(host, top_contributing_log_keys, anomaly_score)"
- question: Does a time-series forecast of exploit-mitigation/ASR/crash event volume per subnet show significant
    upward deviation from expected, indicating a large-scale coordinated campaign against memory-safety
    controls?
  context: 'Under the Harden tactic, a fleet-wide or subnet-wide rise in mitigation, ASR-block, and crash
    events can signal a coordinated campaign rather than isolated attempts. Train a time-series model
    (ARIMA/EWMA, or the incremental autoencoder statistics of Kitsune) on historical event volume per
    subnet, forecast expected volume, and flag significant upward deviations. The output must list the
    top-3 drivers (host group, process, exception/mitigation type) and the expected-vs-observed delta,
    not merely an anomaly score, so the analyst can immediately scope the affected population. A positive
    result is a candidate campaign that should be corroborated with the symbolic-logic block and crash
    signals above. References: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
