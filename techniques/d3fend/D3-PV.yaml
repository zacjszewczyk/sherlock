    CI/build systems'
  range: Last 90 days; re-baseline monthly
  queries:
  - technology: SIEM/Stats pseudocode
    query: "inventory = Get-ProcessMitigation + Get-MpPreference per host\n  | stats\n      pct_cfg =\
      \ avg(cfg_enabled), pct_dep=avg(dep_enabled),\n      pct_aslr=avg(aslr_enabled), pct_acg=avg(acg_enabled),\n\
      \      pct_asr_block=avg(asr_mode==\"block\")\n    by subnet, ou, department\n  | eval p10 = percentile(pct_*,\
      \ 10) over fleet\n  | WHERE any(pct_*) < p10\n  | alert remediation_target"
- question: Has the daily/hourly volume of exploit-mitigation and ASR-block events for any host group
    or process spiked above its own 95th percentile or 3-sigma baseline, suggesting a targeted campaign
    against memory-safety controls?
  context: 'Under the Harden tactic, a sustained surge of mitigation/ASR-block events is a strong signal
    of an active, possibly coordinated, campaign probing memory-safety defenses. Baseline the count/min
    of these events per host group and per process over a 30-day rolling window, then alert when current
    volume exceeds the 95th percentile or 3 sigma. The frequency-profiling approach follows Warrender
    et al. Use group-specific thresholds derived from each cohort''s own history, not a single global
    value, to avoid drowning noisy server groups while still catching anomalies on quiet endpoints. A
    positive result warrants pivoting to the specific processes and source flows driving the spike. References:
    [Warrender et al.](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/KernelMode and UserMode operational log
