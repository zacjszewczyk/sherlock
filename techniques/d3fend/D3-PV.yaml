name: 'D3-PV: Pointer Validation'
id: fa67cc87-d215-4baa-bea8-2e6a1e5aeb7e
description: 'Investigate the implementation and runtime effectiveness of pointer-validation and related
  memory-safety exploit mitigations across critical applications and systems. This playbook helps an analyst
  answer two intertwined questions: (1) posture - which pointer-validation/exploit-mitigation controls
  (Control Flow Guard, DEP, ASLR, Arbitrary Code Guard, SEHOP, EAF/IAF, ASR rules, CFI/CPI/PAC/ASan in
  builds) are actually enabled on which processes and hosts, and (2) runtime - what those controls emit
  when an exploitation attempt is blocked or when memory-corruption probing occurs (Security-Mitigations
  fast-fails, Defender ASR block/audit events, access-violation and STATUS_STACK_BUFFER_OVERRUN crash
  codes, and ROP/control-flow anomalies visible in CPU branch traces such as Last Branch Record and Intel
  Processor Trace). It combines deterministic symbolic-logic floors (block-event monitoring, ret-after-call
  legality, gadget-chain thresholds, build/CI gating) with statistical baselining (fleet compliance percentiles,
  event-frequency spikes, crash-rate profiling) and machine-learning layers (control-flow anomaly classifiers,
  log-sequence models, volume forecasting) so analysts can surface blocked exploits, exploit probing,
  and hosts left unhardened against a sophisticated external actor as well as routine threats.'
type: technique
