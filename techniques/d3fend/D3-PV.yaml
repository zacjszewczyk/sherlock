  range: Last 90 days; model retrained periodically on benign traces
  queries:
  - technology: ML/pseudocode
    query: "features = encode(intel_pt_branch_sequence)  // image rendering (HeNet) / gadget seq (ROPNN)\n\
      \  model = CNN_transfer_learn(trained_on=benign_traces)\n  score = model.predict(features)\n  IF\
      \ score > threshold:\n    emit alert(host, pid, process,\n               top3_features=[trace_offset,\
      \ gadget_chain_len, faulting_module])"
- question: Does a log-sequence model flag abnormal bursts or orderings of Security-Mitigations and Defender
    events that simple volume thresholds miss - including suppression or staged probing patterns?
  context: 'Under the Harden tactic, attackers may produce mitigation-event patterns that are abnormal
    in sequence or timing rather than raw count. Apply a log-sequence model (DeepLog, Du et al.) to the
    Security-Mitigations and Defender event streams to learn normal log-key sequences and parameter values
    with online retraining, surfacing the top contributing log keys for explainability. Include failure-rate
    features (crash counts, blocked-connection counts) as distinct inputs so that suppression of expected
    events or staged probing is modeled explicitly. A positive result is an anomalous event ordering an
    analyst should investigate as potential evasion or a multi-stage exploitation attempt. References:
    [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
