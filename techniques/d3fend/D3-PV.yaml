questions:
- question: Which processes triggered a Windows exploit-mitigation fast-fail (Control Flow Guard, Arbitrary
    Code Guard, SEHOP, stack-pivot, EAF/IAF, validate-handle, or heap-integrity), and what were the process,
    parent, faulting module, and any correlated outbound network flows?
  context: 'Under the Harden tactic, every triggered mitigation in the Microsoft-Windows-Security-Mitigations
    log or Defender exploit-protection stream represents a memory-corruption exploitation attempt that
    the pointer-validation controls actively blocked (State=blocked). An analyst should treat each occurrence
    on an internet-facing or critical process as a high-fidelity signal of attempted code-execution, not
    noise. Pull the process, parent process, faulting module name/offset, and mitigation name, then correlate
    the same PID to outbound Zeek conn.log flows to identify command-and-control or attacker origin. A
    positive result means an exploit was stopped (and the targeting should be hunted); the floor rule
    is to never auto-suppress single events on internet-facing processes because a blocked attempt often
    precedes a successful bypass. References: [Exploit Protection Reference](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference)
    and [Control Flow Guard](https://learn.microsoft.com/en-us/windows/win32/secbp/control-flow-guard).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/KernelMode and UserMode operational log
  - Microsoft-Windows-Windows Defender/Operational (Event ID 1121 block, 1122 audit)
  - Windows Application Error / Windows Error Reporting (Event ID 1000, 1001)
  - Get-ProcessMitigation / Get-MpPreference inventory
  - Sysmon Event ID 1 (Process Create), Event ID 10 (Process Access)
  - Windows Event ID 4688 (Process Creation)
  - Intel Processor Trace / Last Branch Record
  - Zeek conn.log
  - 'NAI: Critical application servers, Internet-facing application hosts, User endpoints, Domain Controllers,
    CI/build systems'
  range: Last 90 days; pivot +/- 1 hour around each block event for correlation
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (\"Security-Mitigations/KernelMode\", \"Security-Mitigations/UserMode\", \"Windows\
      \ Defender/Operational\")\n  WHERE mitigation IN (\"CFG\",\"ACG\",\"SEHOP\",\"StackPivot\",\"EAF\"\
      ,\"IAF\",\"ValidateHandle\",\"HeapIntegrity\")\n  | set state=\"blocked\"\n  | table host, process,\
      \ parent_process, faulting_module, mitigation, pid\n  | alert priority=high if process IN internet_facing_list"
  - technology: Zeek/pseudocode
    query: "# correlate blocked PID to outbound flows\n  conn.log WHERE host==block.host AND ts within\
      \ [block.ts-1h, block.ts+1h]\n  | join on src_pid==block.pid\n  | table id.orig_h, id.resp_h, id.resp_p,\
      \ service, duration, orig_bytes, resp_bytes"
- question: Which Defender Attack Surface Reduction rules fired in block mode (Event ID 1121), and which
    fired only in audit mode (Event ID 1122) - revealing rules that are mapped but not actually enforcing?
  context: 'ASR rules are a key memory-safety hardening layer under the Harden tactic. Event ID 1121 means
    the rule actively blocked an action (e.g., block process injection, block credential stealing from
    LSASS, block Win32 API calls from Office macros, block executable code from dynamic content); Event
    ID 1122 means the rule would have blocked but is only in audit mode, proving the control is mapped
    but leaving the host exposed. The analyst should alert on every 1121 with the rule ID, triggering
    process, and target, and separately track 1122 as a coverage gap that an attacker could exploit. A
    high 1122-to-1121 ratio on critical hosts is a remediation priority. References: [Attack Surface Reduction
    rules](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/KernelMode and UserMode operational log
  - Microsoft-Windows-Windows Defender/Operational (Event ID 1121 block, 1122 audit)
  - Windows Application Error / Windows Error Reporting (Event ID 1000, 1001)
  - Get-ProcessMitigation / Get-MpPreference inventory
  - Sysmon Event ID 1 (Process Create), Event ID 10 (Process Access)
  - Windows Event ID 4688 (Process Creation)
  - Intel Processor Trace / Last Branch Record
  - Zeek conn.log
  - 'NAI: Critical application servers, Internet-facing application hosts, User endpoints, Domain Controllers,
    CI/build systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=\"Windows Defender/Operational\" EventID IN (1121,1122)\n  | eval mode = if(EventID==1121,\"\
      block\",\"audit\")\n  | table host, mode, asr_rule_id, triggering_process, target, parent\n  | alert\
      \ if mode==\"block\"\n  | summarize audit_count=count() by host, asr_rule_id where mode==\"audit\"\
      \  // coverage gaps"
- question: Which critical, internet-facing applications (e.g., chrome.exe, msedge.exe, outlook.exe, winword.exe,
    w3wp.exe) were executed WITHOUT the expected pointer-validation hardening (CFG, DEP, mandatory/bottom-up
    ASLR, ACG) enabled, despite running on hardware capable of it?
  context: 'This is a posture-gap hunt central to the Harden tactic: even if no exploit has fired yet,
    an unhardened high-value process is an open door. Join the per-process mitigation inventory from Get-ProcessMitigation
    against process-execution telemetry (Windows Event ID 4688 / Sysmon Event ID 1) to find launches of
    named critical applications where one or more expected controls (CFG, DEP, ASLR mandatory+bottom-up,
    ACG) are missing. The authoritative control set comes from the Microsoft Exploit Protection Reference
    and Control Flow Guard documentation. A positive result is an actionable misconfiguration to remediate
    before it is exploited; pay special attention to internet-facing servers and user endpoints that browse
    and open external content. References: [Exploit Protection Reference](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference)
    and [Control Flow Guard](https://learn.microsoft.com/en-us/windows/win32/secbp/control-flow-guard).'
  answer_sources:
