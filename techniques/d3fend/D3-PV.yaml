    CI/build systems'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source IN (\"Security-Mitigations\",\"Windows Defender/Operational\")\n  | bin _time span=1h\
      \ | stats count as events by host_group, process, _time\n  | eventstats avg(events) as mu, stdev(events)\
      \ as sd, perc95(events) as p95\n      by host_group, process  // 30d window\n  | WHERE events >\
      \ p95 OR events > mu + 3*sd\n  | alert reason=\"mitigation/ASR event spike\""
- question: Are any internet-facing processes showing spikes in access-violation crashes (0xC0000005)
    or fast-fail/STATUS_STACK_BUFFER_OVERRUN terminations (0xC0000409) in Windows Error Reporting, indicating
    exploit probing before a successful bypass?
  context: 'This failure-mode signal under the Harden tactic catches exploitation attempts that crash
    a process rather than getting cleanly blocked. Baseline per-process crash counts and exception codes
    from Windows Error Reporting (Event ID 1000/1001). Repeated access-violation crashes (0xC0000005)
    and fast-fail terminations (0xC0000409 / STATUS_STACK_BUFFER_OVERRUN) on the same faulting module
    of an internet-facing process (State=failed/crashed) are characteristic of an attacker fuzzing or
    refining an exploit before it succeeds. Tie the crashing module name and offset into the alert so
    the analyst can correlate to the vulnerable component and any subsequent successful compromise. References:
    [Exploit Protection Reference](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference).'
  answer_sources:
