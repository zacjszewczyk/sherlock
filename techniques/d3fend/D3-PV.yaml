  queries:
  - technology: SIEM/Rule pseudocode
    query: "let inv = Get-ProcessMitigation_inventory  // per host+image: cfg,dep,aslr,acg flags\n  |\
      \ EventID IN (4688, 1) WHERE new_process IN critical_internet_facing_apps\n  | join (image,host)\
      \ inv\n  | WHERE cfg==false OR dep==false OR aslr_mandatory==false OR aslr_bottomup==false OR acg==false\n\
      \  | table host, new_process, missing=[cfg,dep,aslr,acg], hardware_capable\n  | alert priority=high"
- question: Do our first-party C/C++ release artifacts ship with pointer-validation and control-flow-integrity
    build controls (a centralized pointer-validation function per SEI CERT MEM10-C, /guard:cf or clang
    CFI, Code-Pointer Integrity, ARM Pointer Authentication where available, and AddressSanitizer in test/fuzz
    pipelines), or are builds escaping CI without them?
  context: 'Hardening starts in the build pipeline. Under the Harden tactic, the analyst (working with
    the build/CI team) should gate releases so that compiled artifacts carry the expected memory-safety
    flags: a single defined pointer-validation function (SEI CERT MEM10-C), Control-Flow Integrity (MSVC
    /guard:cf or clang -fsanitize=cfi), Code-Pointer Integrity, ARM PAC on capable targets, and AddressSanitizer
    in test/fuzz stages. Inspect build manifests and linker flags on CI/build systems; fail the pipeline
    and alert when a release artifact lacks these. Use the SoK: Eternal War in Memory taxonomy to confirm
    coverage across read/write/execute exploit stages. A negative result (missing flags) means shipped
    binaries are exploitable regardless of host runtime mitigations. References: [SEI CERT MEM10-C](https://wiki.sei.cmu.edu/confluence/display/c/MEM10-C.+Define+and+use+a+pointer+validation+function),
    [Burow et al.](https://nebelwelt.net/publications/files/17CSUR.pdf) (CFI survey), [Kuznetsov et al.](https://www.usenix.org/system/files/conference/osdi14/osdi14-paper-kuznetsov.pdf)
    (Code-Pointer Integrity), [Liljestrand et al.](https://www.usenix.org/system/files/sec19fall_liljestrand_prepub.pdf)
    (ARM Pointer Authentication), [Serebryany et al.](https://www.usenix.org/system/files/conference/atc12/atc12-final39.pdf)
    (AddressSanitizer), and [SoK: Eternal War in Memory](https://people.eecs.berkeley.edu/~dawnsong/papers/Oakland13-SoK-CR.pdf).'
