    query: "source=\"Intel PT / LBR\" AT sensitive_syscall\n  | segment branch_trace into gadgets where\
      \ insns_between_branches <= 20\n  | compute max_consecutive_gadget_chain\n  | WHERE max_consecutive_gadget_chain\
      \ >= 8\n  | alert reason=\"ROP gadget-chain threshold exceeded\" host, pid, process, chain_len"
- question: Do machine-learning classifiers trained on CPU control-flow telemetry (Intel Processor Trace
    branch sequences) detect novel control-flow-hijacking exploits that bypass the deterministic CFI/kBouncer
    mitigations?
  context: 'Under the Harden tactic, sophisticated actors craft exploits specifically to evade deterministic
    mitigations. ML models close that gap: HeNet (Chen et al.) renders Intel PT branch sequences as images
    and uses CNN transfer learning to detect anomalies and localize the offending trace segment, while
    ROPNN (Li et al.) classifies chained gadget instruction sequences with high detection and very low
    false-positive rates and generalizes to unseen payloads. Run these in parallel with the kBouncer/CFI
    floor. Alerts must surface the top-3 contributing features (anomalous trace offset, gadget-chain length,
    faulting module) so an analyst can validate and pivot. A positive result is a suspected novel exploit
    warranting deep investigation of the implicated process. References: [HeNet, Chen et al.](https://arxiv.org/abs/1801.02318)
    and [ROPNN, Li et al.](https://arxiv.org/abs/1807.11110).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/KernelMode and UserMode operational log
