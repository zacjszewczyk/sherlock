    query: "source=ci_build_logs OR artifact_manifest\n  | parse compiler_flags, linker_flags\n  | eval\
      \ has_cfi = flags contains (\"/guard:cf\" OR \"-fsanitize=cfi\")\n  | eval has_ptr_validation =\
      \ uses_central_pointer_validation_fn\n  | eval has_asan_in_test = test_stage_flags contains \"-fsanitize=address\"\
      \n  | WHERE stage==\"release\" AND (has_cfi==false OR has_ptr_validation==false)\n  | action=fail_pipeline,\
      \ alert(team=appsec)"
- question: At security-sensitive system calls, do all returns observed in the Last Branch Record land
    on an instruction immediately preceded by a CALL (ret-after-call legality), or are there illegal returns
    indicating return-oriented programming?
  context: 'This is a deterministic ROP-detection floor under the Harden tactic, derived from kBouncer
    (Pappas et al.). Legitimate RET instructions return to the instruction right after a CALL; ROP gadget
    chains hijack control flow so returns land on arbitrary gadget addresses not preceded by a CALL. By
    inspecting the LBR at sensitive syscalls, any illegal return is a hard, source-free indicator of control-flow
    hijacking on first-party CPU branch telemetry. A positive result is a high-confidence exploitation
    signal; because it is deterministic, it complements the ML control-flow classifiers running in parallel.
    References: [kBouncer, Pappas et al.](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_pappas.pdf).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/KernelMode and UserMode operational log
  - Microsoft-Windows-Windows Defender/Operational (Event ID 1121 block, 1122 audit)
  - Windows Application Error / Windows Error Reporting (Event ID 1000, 1001)
  - Get-ProcessMitigation / Get-MpPreference inventory
  - Sysmon Event ID 1 (Process Create), Event ID 10 (Process Access)
  - Windows Event ID 4688 (Process Creation)
  - Intel Processor Trace / Last Branch Record
  - Zeek conn.log
  - 'NAI: Critical application servers, Internet-facing application hosts, User endpoints, Domain Controllers,
    CI/build systems'
  range: Last 90 days; evaluate at each security-sensitive syscall
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=\"Intel PT / LBR\" AT sensitive_syscall_entry\n  | foreach return_branch in lbr:\n\
      \      eval target_prev_insn = decode(target_addr - len_prev)\n      eval legal = (target_prev_insn.opcode\
      \ == CALL)\n  | WHERE legal == false\n  | alert priority=high reason=\"illegal ret-after-call (ROP)\"\
      \ host, pid, process, target_addr"
- question: Across the fleet, what percentage of endpoints have each pointer-validation/exploit-mitigation
    control enabled (CFG, DEP, ASLR, ACG, ASR rule mode), and which subnets, departments, or OUs fall
    below the 10th percentile of enablement?
  context: 'This statistical posture metric under the Harden tactic measures how consistently memory-safety
    controls are deployed. Periodically inventory each host''s mitigation state via Get-ProcessMitigation/Get-MpPreference,
    compute per-control compliance percentages (a Volume metric), and flag the lowest-enablement cohorts
    (below the 10th percentile of your own fleet distribution) for remediation. Derive the percentile
    threshold from your fleet rather than a global constant, and re-baseline monthly. Cohorts in the bottom
    decile are the soft targets an attacker will prefer; closing the gap shrinks the exploitable surface.
    References: [Exploit Protection Reference](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference)
    and [Attack Surface Reduction rules](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction).'
  answer_sources:
