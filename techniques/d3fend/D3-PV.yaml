  - technology: ML/pseudocode
    query: "series = volume(mitigation+asr+crash events) per subnet, bin=1h\n  model = ARIMA_or_EWMA_or_Kitsune_autoencoder(train=history)\n\
      \  forecast = model.predict(next)\n  delta = observed - forecast\n  IF delta > deviation_threshold:\n\
      \    emit alert(subnet, delta,\n               top3_drivers=[host_group, process, exception_or_mitigation_type])"
