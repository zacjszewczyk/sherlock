  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=\"Windows Error Reporting\" EventID IN (1000,1001)\n  | WHERE exception_code IN (\"\
      0xC0000005\",\"0xC0000409\")\n    AND process IN internet_facing_list\n  | stats count by host,\
      \ process, faulting_module, module_offset, exception_code, bin(_time,1d)\n  | eventstats avg(count)\
      \ as mu, stdev(count) as sd by process, faulting_module\n  | WHERE count > mu + 3*sd | alert reason=\"\
      crash/fast-fail spike (exploit probing)\""
- question: At sensitive syscalls, are there consecutive short gadget-like branch chains in the LBR/Intel
    PT exceeding the ROP threshold of >=8 gadgets of <=20 instructions each?
  context: 'This statistical ROP-detection floor under the Harden tactic implements the canonical kBouncer
    count-threshold. Return-oriented programming strings together many short instruction sequences (gadgets)
    each ending in a branch; a chain of >=8 consecutive gadgets of <=20 instructions is highly anomalous
    for benign code. Count such chains in the LBR/Intel PT at sensitive syscalls and flag when the threshold
    is crossed. Tune the gadget-length and chain-count parameters against benign-process branch traces
    to control false positives, and keep this deterministic floor running alongside the ML classifiers.
    A positive result is a strong ROP indicator localized to a host, process, and trace segment. References:
    [kBouncer, Pappas et al.](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_pappas.pdf).'
  answer_sources:
