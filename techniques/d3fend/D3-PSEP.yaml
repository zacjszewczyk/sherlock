name: 'D3-PSEP: Process Segment Execution Prevention'
id: a709b5be-1411-4321-a98c-2c425df7a945
description: 'Process Segment Execution Prevention (PSEP), implemented on Windows primarily as Data Execution
  Prevention (DEP) backed by the CPU NX/XD bit, blocks the processor from executing code that resides
  in non-code memory regions (stack, heap, data). This playbook helps an analyst answer two related investigative
  concerns. First, posture: to what extent is DEP/PSEP actually enabled and at the approved enforcement
  level (AlwaysOn/OptOut) across the Windows fleet, where has it drifted from the corporate baseline (AlwaysOff/OptIn),
  and is any drift the result of active tampering, a malicious GPO/MDM change, or a faulty update versus
  a never-configured device. Second, efficacy and attack evidence: where has PSEP actively blocked a code-injection
  attempt (surfaced as a DEP/execute-access violation crash, exception code 0xc0000005, in Windows Error
  Reporting / Event ID 1001), and where have attackers attempted to bypass DEP using code-reuse techniques
  (ROP/ret2libc) that trigger no DEP fault but can be caught through control-flow integrity (CFG/CET)
  violations, hardware branch-trace gadget-chain analysis, payload-delivery anomalies, and post-exploitation
  system-call deviations. The questions combine deterministic configuration audits, statistical trending
  of compliance and crash buckets, and machine-learning models for forecasting posture and triaging exploit
  attempts.'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
