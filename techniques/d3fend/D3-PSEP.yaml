questions:
- question: On which Windows endpoints does the Data Execution Prevention (DEP) system policy deviate
    from the approved corporate baseline of AlwaysOn or OptOut (i.e., is it set to AlwaysOff or OptIn)?
  context: 'DEP is the Windows implementation of PSEP and is only protective when enforced fleet-wide.
    This deterministic audit reads the system-wide NX policy via `bcdedit /enum {current}` (the `nx` value)
    and/or the GetSystemDEPPolicy/GetProcessDEPPolicy APIs and alerts on any host where the policy is
    not OptOut or AlwaysOn. AlwaysOff disables DEP entirely; OptIn protects only system binaries, leaving
    most third-party and custom processes exposed to code-injection exploits. Because this maps to the
    Harden tactic, the goal is preventive coverage: a host below baseline is a soft target where an attacker''s
    data-as-code payload could execute. Treat any change from the approved baseline as security-relevant
    configuration drift requiring remediation (NIST SP 800-128). A positive result (non-compliant host)
    is an actionable remediation item; do not weaken this floor — instead tune the allowlist of legitimately
    approved per-process DEP exemptions. References: [Data Execution Prevention (Win32)](https://learn.microsoft.com/en-us/windows/win32/memory/data-execution-prevention);
    [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf).'
  answer_sources:
  - Windows Security Event Logs
  - Windows System Event Logs
  - Endpoint configuration inventory (bcdedit / GetSystemDEPPolicy output)
  - 'NAI: All Windows endpoints, particularly servers hosting critical applications and workstations of
    privileged users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'config = collect(bcdedit_nx_value OR GetSystemDEPPolicy_result) per host

      ALERT where config NOT IN (''OptOut'',''AlwaysOn'')   // i.e. AlwaysOff or OptIn

      exclude host/process pairs on approved_DEP_exemption_allowlist

      emit {host, current_policy, expected_baseline, last_seen}'
  - technology: PowerShell/pseudocode
    query: '$p = Get-CimInstance Win32_OperatingSystem | Select DataExecutionPrevention_SupportPolicy

      if ($p.DataExecutionPrevention_SupportPolicy -in 0,1) { report-noncompliant $env:COMPUTERNAME $p
      }'
- question: What is the enterprise DEP compliance rate, and which OS versions, organizational units, or
    device roles have a compliance rate more than one standard deviation below the fleet mean?
  context: 'Beyond per-host pass/fail, leadership and remediation teams need to know where the gaps cluster.
    Periodically ingest DEP status from all endpoints and compute the enterprise compliance rate (compliant
    / non-compliant). Use descriptive statistics to segment by OS version, organizational unit (OU), and
    device role, then flag any group whose compliance rate is more than 1 standard deviation below the
    fleet mean for targeted remediation (NIST SP 800-128 configuration-monitoring and metrics guidance).
    Under the Harden tactic, this prioritizes where preventive coverage is weakest. Critically, separately
    count and trend hosts where a baseline-enforcement push (GPO/MDM) FAILED or where DEP was REVERTED
    after enforcement — this failure-mode signal distinguishes active tampering (attacker disabling a
    defense) from devices that were simply never configured. References: [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf).'
  answer_sources:
  - Windows Security Event Logs
  - Windows System Event Logs
  - Endpoint configuration inventory (bcdedit / GetSystemDEPPolicy output)
  - 'NAI: All Windows endpoints, particularly servers hosting critical applications and workstations of
    privileged users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats count, sum(compliant) by os_version, ou, device_role

      compliance_rate = sum(compliant)/count

      fleet_mean = avg(compliance_rate); fleet_sd = stdev(compliance_rate)

      ALERT group where compliance_rate < fleet_mean - 1*fleet_sd'
  - technology: SIEM/Stats pseudocode
    query: '// failure-mode signal

      count hosts where enforcement_push_status=''FAILED''

      count hosts where dep_state transitioned enforced->disabled (reverted)

      trend both over time; alert on upticks'
- question: Is there a sudden, unexpected drop in the percentage of DEP-compliant devices within any organizational
    unit that deviates from its forecasted posture, and what GPO, OS build, or update is driving it?
  context: 'A gradual posture decline differs sharply from an abrupt cliff. Develop a time-series model
    per OU tracking the percentage of compliant devices, forecast the 30-day posture, and apply anomaly
    detection to flag sudden unexpected drops. Such a drop could indicate a widespread misconfiguration,
    a malicious GPO change pushing AlwaysOff/OptIn, or a faulty update disabling DEP — all of which erode
    the Harden tactic''s preventive baseline at scale. The alert MUST surface the top-3 contributing factors
    (e.g., the specific OU, OS build, and the GPO or update correlated with the drop), not just the deviation
    magnitude, so responders can act immediately. A true positive is a fleet-wide defense regression;
    investigate change-management records and GPO history for the same window. References: [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf).'
  answer_sources:
  - Windows Security Event Logs
  - Windows System Event Logs
  - Endpoint configuration inventory (bcdedit / GetSystemDEPPolicy output)
  - 'NAI: All Windows endpoints, particularly servers hosting critical applications and workstations of
    privileged users.'
  range: Last 180 days
  queries:
  - technology: Python/ML pseudocode
    query: "for ou in org_units:\n    series = daily_compliant_pct[ou]\n    model = fit_timeseries(series)\
      \          # e.g. SARIMA/Prophet\n    forecast, lower, upper = model.forecast(30)\n    if observed\
      \ < lower: \n        drivers = top3_feature_attribution(ou_build_gpo_update)\n        alert(ou,\
      \ drop_magnitude, drivers)"
- question: Are there Windows Error Reporting / System Event ID 1001 records containing exception code
    0xc0000005 (Access Violation) with an execute-access fault, indicating PSEP actively blocked an attempt
    to run data as code?
  context: 'When DEP/PSEP stops code from executing in a non-code segment, the process faults with a 0xc0000005
    access violation, captured by Windows Error Reporting and Event ID 1001. Create a rule to alert on
    these events, correlating the faulting process name, faulting module, and fault offset. A DEP/execute
    violation is direct evidence that an injected payload tried — and was prevented — from executing as
    code (a real attack attempt against an internet-facing service, browser, or document reader is the
    prime suspect). Under the Harden tactic this confirms PSEP is doing its job, but each hit warrants
    investigation: repeated faults in the same module/offset across hosts suggest an active exploit campaign
    rather than a benign software bug. A negative result does not mean safety — code-reuse bypasses produce
    no DEP fault (see the ROP/CFG questions). References: [Windows Error Reporting](https://www.sigops.org/s/conferences/sosp/2009/papers/glerum-sosp09.pdf);
    [Data Execution Prevention (Win32)](https://learn.microsoft.com/en-us/windows/win32/memory/data-execution-prevention).'
  answer_sources:
  - Windows System Event ID 1001
  - Windows Error Reporting (WER) reports
  - ETW / hardware branch-trace (LBR) and Control Flow Guard (CFG)/CET violation events
  - Network payload telemetry (Zeek/IDS)
  - EDR system-call / API telemetry
  - 'NAI: Application servers and user workstations running commercial or custom software, especially
    internet-facing services and browsers/document readers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WindowsSystem EventID=1001

      WHERE exception_code=''0xc0000005'' AND fault_type=''execute_access_violation''

      ALERT with {faulting_process, faulting_module, fault_offset, host, time}'
- question: Are there control-flow anomalies in hardware branch traces (returns not preceded by a call,
    long chains of short gadget sequences) or Control Flow Guard (CFG)/Intel CET-IBT violation events
    that indicate a code-reuse (ROP/ret2libc) bypass of DEP?
  context: 'Attackers defeat W^X/DEP with code reuse that executes only legitimate code already in the
    .text segment, so no DEP fault ever fires. To catch these, add a parallel deterministic rule over
    hardware branch traces / ETW: flag returns targeting instructions NOT preceded by a `call`, and chains
    of more than ~N (start N=10-20, tune per environment) consecutive short (<20-instruction) gadget sequences
    (kBouncer methodology). Any Control Flow Guard or Intel CET-IBT control-flow violation event should
    be treated as a high-fidelity exploit hit (Control-Flow Integrity). For the Harden tactic this closes
    the most important gap in PSEP coverage: code-reuse is precisely the class of attack DEP cannot stop
    on its own, so these CFI signals are the compensating detection. A positive CFG/CET event is rarely
    benign and should drive immediate response on the affected host. References: [The Geometry of Innocent
    Flesh on the Bone (ROP)](https://hovav.net/ucsd/dist/geometry.pdf); [Q: Exploit Hardening Made Easy](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Schwartz.pdf);
    [kBouncer](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_pappas.pdf);
    [Control-Flow Integrity](https://users.soe.ucsc.edu/~abadi/Papers/cfi-tissec-revised.pdf).'
  answer_sources:
  - Windows System Event ID 1001
  - Windows Error Reporting (WER) reports
  - ETW / hardware branch-trace (LBR) and Control Flow Guard (CFG)/CET violation events
  - Network payload telemetry (Zeek/IDS)
  - EDR system-call / API telemetry
  - 'NAI: Application servers and user workstations running commercial or custom software, especially
    internet-facing services and browsers/document readers.'
  range: Last 90 days
  queries:
  - technology: ETW/Branch-trace pseudocode
    query: "// gadget-chain heuristic over LBR/branch trace\nfor ret in returns:\n    if instruction_before(ret.target)\
      \ != 'call': mark bad_return\nif count(consecutive short_sequences <20 instr) > N(10-20): ALERT\
      \ rop_chain\n"
  - technology: SIEM/Rule pseudocode
    query: "source IN (CFG_violation, CET_IBT_violation) \nALERT high_fidelity {process, host, time} \
      \  // control-flow integrity hit"
- question: Which faulting module+offset+exception-code crash buckets exceed their 95th-percentile historical
    daily rate or appear across an abnormal number of distinct hosts, signaling a possible exploit campaign
    rather than an isolated bug?
  context: 'Isolated DEP crashes are often benign software bugs; clustered, repeated ones are an exploit
    signature. Bucket DEP/access-violation crashes by faulting module + offset + exception code and baseline
    per-bucket daily rates (Windows Error Reporting bucketing methodology). Alert when a bucket''s count
    in a 24-hour window exceeds its 95th-percentile historical value (Frequency = crashes/24h), or when
    it appears across an abnormal number of distinct hosts (Spread = host count) — a strong exploit-campaign
    signal versus a one-off crash. Also track Volume (crashes per host) and the State/failure signal (crash-then-restart
    loops, repeated blocked executions) as distinct indicators of repeated attempts. Under the Harden
    tactic this turns PSEP''s blocking faults into a scalable campaign-detection feed. A spike across
    many hosts on the same module/offset is a high-priority lead pointing at a vulnerable component under
    active targeting. References: [Windows Error Reporting](https://www.sigops.org/s/conferences/sosp/2009/papers/glerum-sosp09.pdf);
    [Q: Exploit Hardening Made Easy](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Schwartz.pdf).'
  answer_sources:
  - Windows System Event ID 1001
  - Windows Error Reporting (WER) reports
  - ETW / hardware branch-trace (LBR) and Control Flow Guard (CFG)/CET violation events
  - Network payload telemetry (Zeek/IDS)
  - EDR system-call / API telemetry
  - 'NAI: Application servers and user workstations running commercial or custom software, especially
    internet-facing services and browsers/document readers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'bucket = faulting_module + '':'' + fault_offset + '':'' + exception_code

      stats count as freq_24h, dc(host) as spread by bucket, day

      baseline p95 per bucket over history

      ALERT where freq_24h > p95 OR spread > host_anomaly_threshold'
- question: Do network payloads delivered to a service immediately before a 0xc0000005 execute fault show
    byte-frequency anomalies (NOP sleds, high-entropy or non-text shellcode) consistent with code-injection
    delivery?
  context: 'A DEP fault tells you something tried to execute as code; correlating it with the delivery
    vector raises confidence that it was an attack, not a bug. Model normal per-port / per-length payload
    byte-frequency distributions and flag Mahalanobis-distance outliers (NOP sleds, high-entropy or non-text
    shellcode) on traffic to the faulting service (PAYL methodology). A payload anomaly immediately preceding
    a 0xc0000005 execute fault sharply raises exploit confidence. For the Harden tactic, this links the
    network-side injection attempt to the endpoint-side PSEP block, giving a complete attack narrative.
    Pursue by joining Zeek/IDS payload-anomaly alerts to WER faults on the same host within a tight time
    window; a matched pair is strong evidence of an exploitation attempt against an internet-facing service.
    References: [PAYL](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Windows System Event ID 1001
  - Windows Error Reporting (WER) reports
  - ETW / hardware branch-trace (LBR) and Control Flow Guard (CFG)/CET violation events
  - Network payload telemetry (Zeek/IDS)
  - EDR system-call / API telemetry
  - 'NAI: Application servers and user workstations running commercial or custom software, especially
    internet-facing services and browsers/document readers.'
  range: Last 90 days; correlate within +/- 5 minutes of each DEP fault
  queries:
  - technology: Zeek/pseudocode
    query: 'model byte_freq_dist per (dest_port, payload_len_bucket)

      score = mahalanobis(observed_byte_freq, baseline)

      flag payload where score > threshold  // NOP sled / shellcode-like

      JOIN flagged_payload TO WER_fault(0xc0000005) ON host AND time within 5m'
- question: When an Event ID 1001 / WER crash is triaged by a classifier, is it labeled 'Potential Exploit
    Attempt' (versus 'Benign Software Bug' or 'Known Incompatible Application'), and what are the top-3
    exploitability features driving that label?
  context: 'Manual triage of crash floods does not scale, and exploitable crashes have distinguishing
    characteristics. Train a classifier on Event ID 1001 / WER features (faulting application, faulting
    module + reputation, exception sub-type, fault offset, time-of-day, and exploitability features such
    as instruction-pointer control, controllable registers, write-what-where) to label each crash ''Benign
    Software Bug'', ''Potential Exploit Attempt'', or ''Known Incompatible Application''. Ground exploitability
    features in AEG (Automatic Exploit Generation) and use statistically discriminating state predicates
    from Aurora. The alert MUST surface the top-3 contributing features (e.g., controlled EIP, low-reputation
    faulting module, anomalous fault offset), not just a score, so the analyst can validate quickly. Under
    the Harden tactic this prioritizes which PSEP-blocked crashes represent real adversary activity worth
    deep investigation versus routine application instability. References: [AEG: Automatic Exploit Generation](https://users.ece.cmu.edu/~dbrumley/pdf/Avgerinos%20et%20al._2011_AEG%20Automatic%20Exploit%20Generation.pdf);
    [Aurora](https://www.usenix.org/system/files/sec20-blazytko.pdf) (code: https://github.com/RUB-SysSec/aurora).'
  answer_sources:
  - Windows System Event ID 1001
  - Windows Error Reporting (WER) reports
  - ETW / hardware branch-trace (LBR) and Control Flow Guard (CFG)/CET violation events
  - Network payload telemetry (Zeek/IDS)
  - EDR system-call / API telemetry
  - 'NAI: Application servers and user workstations running commercial or custom software, especially
    internet-facing services and browsers/document readers.'
  range: Last 90 days
  queries:
  - technology: Python/ML pseudocode
    query: "features = [faulting_app, module_reputation, exception_subtype, fault_offset,\n          \
      \  time_of_day, controlled_eip, controllable_regs, write_what_where]\nlabel = clf.predict(features)\
      \  # {Benign, PotentialExploit, IncompatibleApp}\nif label=='PotentialExploit': alert(crash, top3_feature_importance(features))"
- question: Does the affected process exhibit anomalous short system-call sequences after a suspected
    exploitation event, indicating successful code-reuse (ROP) execution that left no DEP fault?
  context: 'The most dangerous bypasses succeed silently: a ROP chain executes legitimate code, never
    triggers a DEP fault, and may not crash. To catch successful exploitation that leaves no DEP fault,
    baseline each program''s normal short system-call sequences and flag deviations on the affected process
    (the ''Sense of Self for Unix Processes'' / sequence-of-system-calls method). Run this in parallel
    with the deterministic DEP/branch-trace rules so an evasive code-reuse chain is still caught via anomalous
    post-exploitation behavior (unexpected process spawns, network connections, file writes, or syscall
    n-grams the program never normally issues). For the Harden tactic, this is the last-line behavioral
    net for attacks that defeat PSEP outright. A positive result — a process suddenly issuing syscall
    patterns far outside its learned profile — warrants immediate containment and forensic review. References:
    [A Sense of Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - Windows System Event ID 1001
  - Windows Error Reporting (WER) reports
  - ETW / hardware branch-trace (LBR) and Control Flow Guard (CFG)/CET violation events
  - Network payload telemetry (Zeek/IDS)
  - EDR system-call / API telemetry
  - 'NAI: Application servers and user workstations running commercial or custom software, especially
    internet-facing services and browsers/document readers.'
  range: Last 90 days
  queries:
  - technology: EDR/ML pseudocode
    query: "profile = learn_syscall_ngrams(process_image) over baseline_window\nfor live syscall_seq in\
      \ process:\n    if ngram_anomaly_score(seq, profile) > threshold:\n        alert(process, host,\
      \ anomalous_sequence)  # possible ROP post-exploit"
