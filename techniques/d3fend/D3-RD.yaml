questions:
- question: Did each database RESTORE operation complete successfully, emit the expected success message,
    and transition the target database to the ONLINE state - or did any restore start without a corresponding
    success, leaving a database stuck in RESTORING or SUSPECT?
  context: 'A successful restore leaves a deterministic trail: SQL Server writes ''RESTORE DATABASE successfully
    processed N pages'' plus the WITH RECOVERY/NORECOVERY end-state to the error log and Windows Application
    Event Log, and the database transitions ONLINE. Match those success strings to each RESTORE start,
    and treat any restore start with no matching success - or a database left in RESTORING/SUSPECT state
    - as a failure signal worth investigating. Correlate with Zeek conn.log to confirm that large inbound
    data transfers to the database server originate only from authorized backup sources, not unexpected
    hosts. In the Restore mission this confirms the organization can actually return a database to a known-good
    state and exposes failed, incomplete, or out-of-band recovery attempts. Sources: [RESTORE Statements
    (Transact-SQL), Microsoft](https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-transact-sql?view=sql-server-ver16).'
  answer_sources:
  - Windows Application Event Logs (from DBMS)
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - msdb restorehistory / restorefile tables
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=dbms (source=sql_error_log OR source=win_app_event)

      | search msg="RESTORE DATABASE*"

      | transaction database startswith="RESTORE...starting" endswith="successfully processed * pages"

      | where success_msg=NULL OR db_state IN ("RESTORING","SUSPECT")

      | eval signal="restore_failed_or_incomplete"'
  - technology: Zeek/pseudocode
    query: "for conn in conn.log where id.resp_h in db_server_ips and orig_bytes > LARGE_XFER:\n  if id.orig_h\
      \ not in authorized_backup_sources:\n    alert(\"restore data transfer from unauthorized source\"\
      , conn)"
- question: Was every completed RESTORE DATABASE preceded or accompanied by a successful integrity check
    - RESTORE VERIFYONLY, CHECKSUM verification, and/or a post-restore DBCC CHECKDB - before the database
    was returned to production?
  context: 'NIST SP 800-184 requires cryptographic integrity verification of restored data before it returns
    to production. The analyst should require that each restore workflow includes a successful RESTORE
    VERIFYONLY and CHECKSUM (and ideally a post-restore DBCC CHECKDB), and alert when a RESTORE DATABASE
    completes with no preceding or accompanying verification event. A restore that skips verification
    could silently reintroduce corrupted, incomplete, or tampered data into production - undermining the
    very purpose of recovery. A positive finding (verification present and passed) confirms a trustworthy
    restore; a negative finding (no verification) flags an unsafe recovery path that must be remediated.
    This directly supports the Restore mission''s goal of returning to a known-good, integrity-assured
    state. Sources: [RESTORE Statements (Transact-SQL), Microsoft](https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-transact-sql?view=sql-server-ver16);
    [Guide for Cybersecurity Event Recovery (NIST SP 800-184)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf).'
  answer_sources:
  - Windows Application Event Logs (from DBMS)
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - msdb restorehistory / restorefile tables
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "restores = events where action=\"RESTORE DATABASE\" status=success\nverifies = events where\
      \ action in (\"RESTORE VERIFYONLY\",\"CHECKSUM\",\"DBCC CHECKDB\") status=success\nfor r in restores:\n\
      \  if not verifies.matching(database=r.database, time within [r.start-1h, r.end+6h]):\n    alert(\"\
      restore completed without integrity verification\", r)"
- question: For every backup/restore operation, can we attribute it to a specific principal and confirm
    that principal is an approved DBA acting within an approved change window - and were any restores
    issued by unauthorized roles or outside change control?
  context: 'Enabling SQL Server Audit BACKUP_RESTORE_GROUP captures the principal, statement, and target
    database for every backup/restore and writes it to the Windows Security/Application log. The analyst
    should reconcile each restore against the approved DBA roster and the approved change-window schedule,
    alerting whenever the issuing principal or role is not an authorized DBA or the restore falls outside
    an approved change window. Restores must be authorized and change-controlled per NIST SP 800-34. A
    restore by an unexpected account, or one occurring off-schedule, is a strong indicator of compromise,
    insider misuse, or out-of-band recovery and warrants immediate triage in the Restore mission. Sources:
    [SQL Server Audit Action Groups and Actions, Microsoft](https://learn.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions?view=sql-server-ver16);
    [Contingency Planning Guide (NIST SP 800-34 Rev. 1)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf).'
  answer_sources:
  - Windows Application Event Logs (from DBMS)
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - msdb restorehistory / restorefile tables
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=sql_audit action_group=BACKUP_RESTORE_GROUP statement="RESTORE*"

      | lookup approved_dbas principal OUTPUT is_dba

      | lookup change_windows database, _time OUTPUT in_window

      | where is_dba!="true" OR in_window!="true"

      | eval signal="unauthorized_or_offwindow_restore"'
- question: Does every restore observed in the SQL Server Audit and error log have a matching row in the
    msdb restorehistory/restorefile tables - and are there any restores present in one source but missing
    from the other?
  context: 'The msdb restorehistory/restorefile tables (restore_date, user_name, destination_database_name,
    restore_type, and linked backupset.backup_size) provide queryable ground truth for restore activity.
    The analyst should reconcile every audited or error-log restore against a corresponding restorehistory
    row. A restore observed in audit but missing from restorehistory - or a restorehistory row with no
    matching audit/error-log entry - indicates log tampering, audit silencing, or out-of-band recovery.
    This cross-source reconciliation makes it much harder for an adversary to hide a restore by manipulating
    a single log, and supports the Restore mission by ensuring the recovery record is complete and trustworthy.
    Sources: [Backup and Restore Tables (Transact-SQL), Microsoft](https://learn.microsoft.com/en-us/sql/relational-databases/system-tables/backup-and-restore-tables-transact-sql?view=sql-server-ver16).'
  answer_sources:
  - Windows Application Event Logs (from DBMS)
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - msdb restorehistory / restorefile tables
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "audit = restores from sql_audit + sql_error_log\nhistory = rows from msdb.restorehistory join\
      \ restorefile join backupset\nfor a in audit:\n  if not history.match(database=a.database, time~=a.time):\
      \ alert(\"restore in audit, missing from restorehistory\", a)\nfor h in history:\n  if not audit.match(database=h.destination_database_name,\
      \ time~=h.restore_date): alert(\"restorehistory row with no audit trail\", h)"
- question: Were any database management or recovery utilities (sqlcmd.exe, mysqldump.exe, mysql.exe,
    psql.exe, the SMO/SqlServer PowerShell module, etc.) launched by accounts that are not database administrators
    or from hosts that are not DBA workstations?
  context: 'Monitoring process-creation events (Windows Event ID 4688) for DBMS and recovery utilities
    reveals who is invoking restore-capable tooling and from where. The analyst should flag execution
    of these utilities by non-DBA accounts or from non-DBA hosts as potential unauthorized restore, data
    exfiltration, or destructive activity. Legitimate restores are performed by known DBAs from known
    administrative hosts; an unexpected principal or host running these tools is a high-value lead. In
    the Restore mission this catches out-of-band or adversary-driven manipulation of databases that bypasses
    normal, change-controlled recovery procedures. Sources: [RESTORE Statements (Transact-SQL), Microsoft](https://learn.microsoft.com/en-us/sql/t-sql/statements/restore-statements-transact-sql?view=sql-server-ver16).'
  answer_sources:
  - Windows Application Event Logs (from DBMS)
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - msdb restorehistory / restorefile tables
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=win source="WinEventLog:Security" EventCode=4688

      | where match(NewProcessName, "(?i)(sqlcmd|mysqldump|mysql|psql)\.exe$") OR match(CommandLine,"(?i)(SqlServer|SMO)
      module")

      | lookup approved_dbas account OUTPUT is_dba

      | lookup dba_hosts Computer OUTPUT is_dba_host

      | where is_dba!="true" OR is_dba_host!="true"

      | eval signal="unauthorized_db_tool_execution"'
- question: Is the restore audit trail tamper-evident, and have we seen any broken hash chains, missing
    sequence numbers, log gaps, or a silenced/disabled SQL Server Audit specification that could indicate
    someone is hiding restore activity?
  context: 'Applying tamper-evident logging (a forward-secure hash chain or per-entry MAC) to the restore
    audit trail lets the analyst treat integrity violations as alerts in their own right. Look for broken
    hash chains, missing or out-of-order sequence numbers, unexplained gaps, or a SQL Server Audit specification
    that has been disabled or silenced. Sophisticated actors routinely tamper with or disable logging
    to conceal unauthorized restores or destructive actions, so the absence or corruption of expected
    audit data is itself a strong signal - not merely a gap to ignore. This protects the integrity of
    the recovery record central to the Restore mission. Sources: [Secure Audit Logs to Support Computer
    Forensics, Schneier and Kelsey](https://www.schneier.com/wp-content/uploads/2016/02/paper-secure-logs.pdf).'
  answer_sources:
  - Windows Application Event Logs (from DBMS)
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - msdb restorehistory / restorefile tables
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for entry in restore_audit_chain (ordered by seq):\n  if MAC(entry) != stored_mac(entry) OR\
      \ entry.seq != prev.seq+1:\n    alert(\"audit chain broken / sequence gap\", entry)\nif sql_audit_spec.state==\"\
      DISABLED\" or no audit events for > expected_gap:\n  alert(\"SQL Server Audit silenced or missing\"\
      )"
- question: Does any live restore exceed the established baseline for that specific database's normal
    restore data volume or duration - for example beyond the 95th percentile or a robust z-score/IQR fence
    of the trailing 90+ days?
  context: 'From msdb restorehistory and backupset, build per-database distributions of restore duration
    (restore_date deltas) and data volume (backup_size), then alert when a live restore exceeds the 95th
    percentile or a robust z-score/IQR fence of the trailing >=90-day baseline. Thresholds must be derived
    per database, because small reference databases and large warehouses differ by orders of magnitude
    and a single global threshold would be useless. An abnormally large or long restore can indicate restoration
    of unexpected data, a corrupted/oversized backup, or adversary manipulation. In the Restore mission
    this statistical layer surfaces restores that are technically successful but physically anomalous
    relative to history. Sources: [Backup and Restore Tables (Transact-SQL), Microsoft](https://learn.microsoft.com/en-us/sql/relational-databases/system-tables/backup-and-restore-tables-transact-sql?view=sql-server-ver16).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = stats over restorehistory join backupset by database (trailing 90d):\n  p95_dur, p95_vol,\
      \ median, iqr per database\nfor live_restore r:\n  if r.duration > base[r.db].p95_dur OR r.volume\
      \ > base[r.db].p95_vol\n     OR robust_z(r.volume, base[r.db]) > 3.5:\n    alert(\"restore exceeds\
      \ per-db baseline\", r)"
- question: Has the daily restore count for any database, account, or source IP shown an abrupt change-point
    - a sudden spike or a newly appearing source - that could indicate coordinated activity or a failing
    system?
  context: 'Model the per-database, per-account, and per-source-IP daily restore count as a time series
    and apply change-point detection (CUSUM, PELT, or Bayesian online) to flag abrupt increases or entirely
    new sources. A sudden burst of restores, or restores from a source never seen before, can indicate
    coordinated adversary activity, ransomware-driven recovery churn, or an underlying failing system.
    Unlike a fixed threshold, change-point detection adapts to each entity''s historical rhythm and catches
    shifts relative to its own normal. This complements the Restore mission by distinguishing routine
    recovery cadence from sudden, suspicious changes in restore behavior. Sources: [A Survey of Methods
    for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = daily_count(restores) by {database, account, source_ip}\nfor each entity series:\n\
      \  cp = changepoint_detect(series, method=\"PELT\"|\"CUSUM\"|\"BOCPD\")\n  if cp.recent and (cp.direction==\"\
      increase\" or entity is new_source):\n    alert(\"restore frequency change-point / new source\"\
      , entity, cp)"
- question: Is the rate of failed restores - RESTORE errors, VERIFYONLY/CHECKDB integrity failures, databases
    left SUSPECT/RESTORING, and failed or blocked logons to the DB server - showing a statistically significant
    spike?
  context: 'Failure is its own signal. Separately baseline the rate of failed restores: RESTORE errors,
    RESTORE VERIFYONLY/CHECKDB integrity failures, databases left in SUSPECT/RESTORING state, and failed
    or blocked logons to the database server. Alert on statistically significant spikes, which can indicate
    corrupted backups, deliberate sabotage, or repeated unauthorized attempts to restore. A rising failure
    rate may be the earliest sign that the organization''s recovery capability is degraded or under attack
    - exactly what the Restore mission must surface before a real recovery is needed. Tracking failures
    separately from successes prevents a healthy success count from masking a growing failure problem.
    Sources: [Guide for Cybersecurity Event Recovery (NIST SP 800-184)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "fail_events = restore_errors + verifyonly_fail + checkdb_fail + (db_state in SUSPECT,RESTORING)\
      \ + failed_db_logons\nbase_rate = baseline(daily fail_events, trailing 90d)\nif poisson_or_z_test(today_fail_count,\
      \ base_rate) significant:\n  alert(\"restore failure rate spike\", details)"
- question: Does any restore or administrative command come from a principal acting outside their established
    profile of normal frequency, target databases, and working hours - or outside the expected scheduled/authorized
    restore envelope?
  context: 'Build per-role and per-user profiles of who normally issues administrative and restore commands
    - their frequency, the databases they target, and the hours they work - then flag restores from principals
    that fall outside their established profile. Compare against the expected scheduled and authorized
    restore envelope from change management. A DBA suddenly restoring a database they never touch, at
    an unusual hour, or far more often than usual, is a behavioral anomaly worth investigating even if
    technically authorized. This per-principal baselining, drawn from research on detecting anomalous
    database access patterns, strengthens the Restore mission by catching credential misuse and insider
    abuse that pass simple authorization checks. Sources: [Detecting Anomalous Access Patterns in Relational
    Databases, Kamra, Terzi, and Bertino](https://link.springer.com/article/10.1007/s00778-007-0051-4);
    [Contingency Planning Guide (NIST SP 800-34 Rev. 1)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "profile[principal] = {freq, typical_dbs, typical_hours} over trailing 90d\nfor restore r:\n\
      \  dev = 0\n  if r.database not in profile[r.principal].typical_dbs: dev+=1\n  if r.hour not in\
      \ profile[r.principal].typical_hours: dev+=1\n  if r.freq_today >> profile[r.principal].freq: dev+=1\n\
      \  if dev>=2 or r outside scheduled_restore_envelope: alert(\"out-of-profile restore issuer\", r)"
- question: When restore events are scored by a multivariate anomaly model, which events emerge as outliers
    across the combined features (volume, duration, hour-of-day, principal, source host/IP, restore_type,
    success/fail), and what top features explain each alert?
  context: 'Train an Isolation Forest on multivariate restore-event features - data volume, duration,
    hour-of-day, principal, source host/IP, restore_type, and success/fail - to flag anomalous combinations
    that a single-feature threshold would miss. Critically, surface the top-3 contributing features via
    SHAP in the alert text rather than presenting a bare anomaly score, so analysts can triage quickly
    and trust the result. This ML layer runs in parallel with the deterministic floor, catching subtle,
    multi-dimensional anomalies (e.g., a normal-sized restore by an unusual principal at an odd hour from
    a new host) that individual rules overlook. In the Restore mission it adds depth without replacing
    the auditable rule-based detections. Sources: [Isolation Forest, Liu, Ting, and Zhou](https://doi.org/10.1145/2133360.2133363);
    [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: Python/sklearn pseudocode
    query: "X = features(restore_events)[volume,duration,hour,principal_enc,src_host_enc,restore_type,success]\n\
      model = IsolationForest(contamination=\"auto\").fit(X_baseline)\nscores = model.decision_function(X_live)\n\
      for e where score < anomaly_threshold:\n  top3 = shap_top_features(model, e, k=3)\n  alert(\"anomalous\
      \ restore event\", event=e, drivers=top3)"
- question: Does the sequence of restore-workflow and error-log keys for any restore deviate from the
    normal learned order, or contain steps with anomalous parameters, indicating an out-of-order or manipulated
    restore?
  context: 'Apply DeepLog (an LSTM-based log-sequence model) to the DBMS restore workflow and error-log
    key sequences to detect steps occurring out of expected order or carrying anomalous parameters. The
    model learns the normal sequence of log keys for a healthy restore; deviations - a skipped verification
    step, an unexpected ordering, or anomalous parameter values - are flagged with the specific offending
    log key to pinpoint triage. This catches restores that complete but follow an abnormal path, which
    deterministic rules keyed on individual events may miss. For the Restore mission, sequence modeling
    validates that recoveries follow the expected, integrity-preserving workflow rather than a manipulated
    or out-of-band one. Sources: [DeepLog: Anomaly Detection and Diagnosis from System Logs, Du et al.](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: Python/DeepLog pseudocode
    query: "seq = parse_log_keys(restore_workflow + sql_error_log) per restore_session\nmodel = DeepLog_LSTM.train(normal_sequences)\n\
      for session in live_sessions:\n  preds = model.next_key_topk(session)\n  if observed_key not in\
      \ preds or param_anomaly(session):\n    alert(\"restore workflow sequence anomaly\", offending_key,\
      \ session)"
- question: For each restore or administrative command, does a role classifier predict a different role
    than the issuing principal actually holds - suggesting the command was issued by an unexpected or
    misused account?
  context: 'Use a Naive Bayes or similar role classifier over command and target features to predict the
    expected role of each restore/administrative command, then flag commands whose predicted role differs
    from the issuing principal''s actual role. The model learns, from history, what kinds of commands
    each role typically issues; a mismatch (e.g., a command pattern that looks like a senior DBA''s but
    issued by a low-privilege account, or vice versa) indicates credential misuse, privilege confusion,
    or an adversary masquerading. Drawn from research on detecting anomalous relational-database access,
    this approach catches role-inconsistent restores that pure authorization checks pass. It reinforces
    the Restore mission by ensuring recovery actions come from the right hands. Sources: [Detecting Anomalous
    Access Patterns in Relational Databases, Kamra, Terzi, and Bertino](https://link.springer.com/article/10.1007/s00778-007-0051-4).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: Python/sklearn pseudocode
    query: "clf = NaiveBayes.fit(features(historical_cmds) -> role_label)\nfor cmd in restore_commands:\n\
      \  predicted_role = clf.predict(features(cmd))\n  if predicted_role != actual_role(cmd.principal):\n\
      \    alert(\"role mismatch on restore command\", cmd, predicted_role, actual_role)"
- question: For an in-progress restore, does its predicted completion time or volume fall outside the
    forecast prediction interval derived from historical restore metrics - flagging an operation that
    is running abnormally long or large?
  context: 'Develop a time-series forecasting model (e.g., ARIMA) using historical restore metrics to
    predict the expected completion time and volume for an in-progress restore, then proactively flag
    operations that fall outside the prediction interval. A restore that runs far longer or moves far
    more data than the forecast suggests may indicate corruption, contention, sabotage, or restoration
    of unexpected content - and flagging it while it is still running enables intervention before bad
    data reaches production. This forward-looking ML layer complements the retrospective baselines and
    rules, giving the Restore mission an early-warning capability for recovery operations that are going
    wrong in real time. Sources: [Online Forecasting and Anomaly Detection Based on ARIMA, Peña et al.](https://www.mdpi.com/2076-3417/11/7/3194).'
  answer_sources:
  - msdb restorehistory / backupset tables
  - SQL Server Audit (BACKUP_RESTORE_GROUP)
  - SQL Server error log
  - Windows Application Event Logs (from DBMS)
  - 'NAI: Production and staging database servers; Backup infrastructure (servers, NAS); Cloud storage
    gateways.'
  range: Last 90 days
  queries:
  - technology: Python/ARIMA pseudocode
    query: "model = ARIMA.fit(historical_restore_metrics[duration,volume] per database)\nfor inprogress\
      \ r:\n  yhat, lo, hi = model.forecast(r.database)\n  if r.elapsed > hi or projected(r.volume) >\
      \ hi:\n    alert(\"in-progress restore outside forecast interval\", r, interval=(lo,hi))"
