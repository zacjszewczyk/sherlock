name: 'D3-PSMD: Process Self-Modification Detection'
id: 1e7c864e-3478-4597-a76a-058f60abf463
description: 'Investigate evidence that a process is modifying, replacing, or injecting its own (or another
  process''s) executable code at runtime — the core behavior behind process hollowing, reflective DLL/shellcode
  injection, and runtime unpacking. This playbook helps an analyst hunt for and confirm self-modification
  across Windows endpoints by: (1) alerting on direct memory-tampering telemetry (Sysmon Event ID 25 ProcessTampering)
  and the canonical ordered, address-linked API chain allocate -> write -> protect-to-RWX -> execute within
  a single source process; (2) inspecting suspicious cross-process access masks (PROCESS_VM_WRITE / PROCESS_VM_OPERATION
  / PROCESS_CREATE_THREAD) and unbacked CallTrace return frames that indicate code executing from memory
  not backed by any file on disk; (3) flagging high-frequency memory-protection changes, high-entropy
  RWX segments from runtime unpacking, anomalous executable-memory growth, and hollowed processes (empty/zero-length
  command lines, broken lineage such as lsass.exe spawning children) that begin making network connections;
  and (4) layering statistical baselining and machine-learning sequence models with explainable feature
  attribution OVER, never replacing, the deterministic Sysmon/ETW-TI detection floor. Named areas of interest
  are critical servers (domain controllers, database servers) and privileged-user workstations.'
type: technique
