name: 'D3-USICA: User Session Init Config Analysis'
id: a29dfd56-aa99-470f-b66f-da70c9c7e8d1
description: Investigate suspicious modifications to user session initialization configuration files abused
  for persistence and privilege escalation. On Windows this covers PowerShell profile scripts (Microsoft.PowerShell_profile.ps1,
  profile.ps1, the ISE and PowerShell Core variants, and $PSHOME\profile.ps1) per T1546.013; on Unix/macOS
  it covers shell init and logout scripts such as /etc/profile, /etc/profile.d/*, /etc/bashrc, ~/.bashrc,
  ~/.bash_profile, ~/.profile, ~/.bash_logout, ~/.zshrc, ~/.zprofile, ~/.zlogin, and ~/.zlogout per T1546.004.
  These rarely-changed init files are weaponized so adversary code runs automatically on the next interactive
  or remote login. This playbook helps an analyst establish WHO/WHAT modified an init file, WHETHER the
  change is anomalous (untrusted modifying process or parent, off-hours or rapid-repeat edits, rare process/content
  prevalence, or deviation from a cryptographic file-integrity baseline), and WHETHER the change produced
  malicious downstream effects when the next session started (anomalous child processes or outbound connections
  to rare ASNs/countries/ports, plus failure-mode tells like NXDOMAIN, blocked egress, and failed logons).
  It combines deterministic file-integrity and Sigma/TTP-graph rules with statistical baselining and machine-learning
  causal-path and sequence anomaly scoring, where model output augments but never suppresses a deterministic
  detection.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
