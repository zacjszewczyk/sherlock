- question: After a shell config was modified, did the next interactive/SSH login spawn an anomalous child
    process, make a rare outbound connection, or show login/egress failures?
  context: 'Detect (D3-D): The payoff of T1546.004 persistence appears on the next login. Correlate a
    shell-config modification with the next interactive/SSH login from the same host and alert when, within
    30 minutes, the login spawns a new child process (auditd EXECVE / Sysmon-for-Linux EID 1) or a Zeek
    conn.log outbound connection to a rare ASN/country/port. Profile failure-mode signals as distinct
    evidence that raises suspicion: NXDOMAIN, blocked egress, and failed SSH logons preceding the edit.
    A positive result is a config edit causally linked to anomalous login-time execution or egress; a
    negative is a clean login.'
  answer_sources:
