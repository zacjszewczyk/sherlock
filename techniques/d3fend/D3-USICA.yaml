questions:
- question: Which processes are writing to Windows PowerShell profile scripts, and is the modifying or
    parent process atypical for a legitimate edit?
  context: 'Detect (D3-D): PowerShell profiles execute automatically on every session start, making them
    a prime persistence and privilege-escalation foothold (T1546.013). Monitor Windows/Sysmon Event ID
    11 file-create/write events across the full set of profile paths (*\WindowsPowerShell\Microsoft.PowerShell_profile.ps1,
    *\WindowsPowerShell\profile.ps1, Microsoft.PowerShellISE_profile.ps1, PowerShell Core *\PowerShell\Microsoft.PowerShell_profile.ps1,
    and $PSHOME\profile.ps1). Alert when the modifying process is NOT a known shell/editor (powershell.exe,
    pwsh.exe, code.exe, notepad.exe) or when the parent is a scripting host (wscript.exe, cscript.exe,
    mshta.exe), which signals scripted, non-interactive tampering. A positive result is a profile write
    from unexpected process lineage; a negative is an interactive edit by a developer''s editor. Validate
    coverage with Atomic Red Team T1546.013. References: [PowerShell Profile (T1546.013), MITRE ATT&CK](https://attack.mitre.org/techniques/T1546/013/);
    [Atomic Red Team T1546.013](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1546.013/T1546.013.md).'
  answer_sources:
  - Windows Event ID 11
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 7
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "profile_paths = ['*\\\\WindowsPowerShell\\\\Microsoft.PowerShell_profile.ps1',\n  '*\\\\WindowsPowerShell\\\
      \\profile.ps1', '*Microsoft.PowerShellISE_profile.ps1',\n  '*\\\\PowerShell\\\\Microsoft.PowerShell_profile.ps1',\
      \ '*\\\\PowerShell\\\\profile.ps1']\nknown_editors = ['powershell.exe','pwsh.exe','code.exe','notepad.exe']\n\
      script_hosts  = ['wscript.exe','cscript.exe','mshta.exe']\nFROM EventID=11 (Sysmon FileCreate) WHERE\
      \ TargetFilename MATCHES profile_paths\n  AND (lower(Image) NOT IN known_editors OR lower(ParentImage)\
      \ IN script_hosts)\n=> alert(user, Image, ParentImage, TargetFilename, Computer)"
- question: Has any PowerShell profile script deviated from its cryptographic file-integrity baseline,
    and who made the change?
  context: 'Detect (D3-D): Maintain a cryptographic-hash plus attribute baseline of every PowerShell profile
    path and alert on ANY deviation, capturing who-data (user, process, PID) for the change, per Wazuh
    FIM and the NIST file-integrity-checking standard. Because legitimate profile changes are rare, any
    hash deviation is investigable. Treat the first-ever creation of a previously absent profile as high
    severity, since it is a common way to silently establish persistence on hosts that never had a profile
    before. A positive result is a hash/attribute change or new-file creation with attribution; a negative
    is a stable baseline. References: [Wazuh File Integrity Monitoring](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html);
    [NIST File Integrity Checking](https://csrc.nist.gov/glossary/term/file_integrity_checking).'
  answer_sources:
  - Windows Event ID 11
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 7
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: FIM/Rule pseudocode
    query: "FOR EACH path IN powershell_profile_paths:\n  current = hash(path) + attributes(path)\n  IF\
      \ path NOT IN baseline:        alert(severity=HIGH, reason='first-ever profile created', whodata)\n\
      \  ELIF current != baseline[path]: alert(severity=MED, reason='profile changed', whodata)\nwhodata\
      \ = (user, process_image, pid)"
- question: Are PowerShell profile files being modified at an unusual frequency, volume, time, or from
    an unusual host relative to each user's baseline?
  context: 'Detect (D3-D): Init files change rarely, so statistical outliers are strong signals of T1546.013
    abuse. Build per-user/per-host baselines of profile modification frequency, content-change volume
    (bytes/lines added), and modification time windows from 30-90 days of first-party Event ID 11 history.
    Flag changes where inter-arrival time is below the user''s 5th percentile (rapid repeat editing),
    where added bytes exceed the user''s 95th percentile (large injected payload), or where the change
    occurs outside normal working hours or from a host not previously associated with that user. A positive
    result is a statistical outlier on any axis; a negative is a change consistent with the user''s normal
    editing rhythm. References: [PowerShell Profile (T1546.013)](https://attack.mitre.org/techniques/T1546/013/).'
  answer_sources:
  - Windows Event ID 11
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 7
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per (user,host) over 30-90d FROM EventID=11 on profile_paths:\n  p5_interarrival,\
      \ p95_added_bytes, normal_hours, known_hosts\nFOR each new profile write:\n  IF interarrival < p5_interarrival\
      \ OR added_bytes > p95_added_bytes\n     OR hour NOT IN normal_hours OR host NOT IN known_hosts:\n\
      \       alert(user, host, TargetFilename, deltas)"
- question: Is the process that modified a PowerShell profile, or the command content it introduced, rare
    across the fleet?
  context: 'Detect (D3-D): Prevalence is a powerful heuristic - legitimate profile edits come from a small,
    common set of tools, while attacker tooling and injected payloads are rare. Score the modifying process
    and any introduced command strings by fleet-wide rarity and escalate when the process or content sits
    in the 99th rarity percentile across the host population (per F-Secure Labs prevalence guidance).
    A positive result is a profile written by a process seen on only a handful of hosts, or content that
    appears almost nowhere else; a negative is a common editor writing common content. References: [What''s
    the deal with prevalence?, F-Secure Labs](https://blog.f-secure.com/whats-the-deal-with-prevalence/).'
  answer_sources:
  - Windows Event ID 11
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 7
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "fleet_proc_count[Image]   = COUNT(distinct hosts) over fleet\nfleet_content_count[hash] =\
      \ COUNT(distinct hosts) for introduced command strings\nFOR each profile write:\n  proc_rarity \
      \   = percentile_rank_desc(fleet_proc_count[Image])\n  content_rarity = percentile_rank_desc(fleet_content_count[hash])\n\
      \  IF proc_rarity >= 99 OR content_rarity >= 99: alert(Image, content, host)"
- question: After a PowerShell profile was modified, did the next session spawn an anomalous child process,
    make a rare outbound connection, or produce telltale failure signals?
  context: 'Detect (D3-D): The payoff of T1546.013 persistence shows up on the NEXT session. Correlate
    a profile modification with the subsequent PowerShell start (Event ID 4104) and alert when, within
    30 minutes from the same host, that session yields a new child process or a Zeek conn.log outbound
    connection to a rare ASN/country/port. Crucially, profile failure-mode signals are distinct evidence
    that RAISES suspicion: blocked outbound connections, NXDOMAIN responses, or HTTP 404s from the spawned
    child. Use Sysmon Event ID 7 module-load logic (Palantir ADS-004) to catch profile-triggered code
    running in an abnormal host process. A positive result is a profile edit causally linked to anomalous
    execution or egress; a negative is a clean subsequent session. References: [Unusual PowerShell Host
    Process (ADS-004), Palantir](https://github.com/palantir/alerting-detection-strategy-framework/blob/master/ADS-Examples/004-Unusual-Powershell-Host-Process.md).'
  answer_sources:
  - Windows Event ID 11
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 7
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, and Critical application servers'
  range: Last 90 days; pivot to a 30-minute window after each profile modification
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each profile_mod (EventID=11) on host H at time T:\n  sessions = EventID=4104 on H WHERE\
      \ start_time IN [T, T+30m]\n  children = EventID=4688/Sysmon EID 7 child of those sessions\n  net\
      \      = Zeek conn.log from H IN [T, T+30m]\n  IF new_child(children) OR net.dest IN rare(ASN|country|port)\n\
      \     OR net.blocked OR dns.NXDOMAIN OR http.status==404:\n       alert(reason='profile-triggered\
      \ session anomaly', H, child, net)"
- question: Do causal-path or sequence anomaly models flag the init-file edit to child-process to network
    chain, with explainable top contributing features?
  context: 'Detect (D3-D): Run ML anomaly models IN PARALLEL with the deterministic FIM rules - never
    as a replacement. Use rare-causal-path scoring (init-file edit -> child process -> network) with Local
    Outlier Factor (ProvDetector), an LSTM over Event ID 11/4688/4104 log-key sequences (DeepLog), and/or
    a temporal provenance GNN (KAIROS) to reconstruct an explainable attack subgraph. Every alert must
    surface the top-3 contributing features (profile path, modifying process/parent, downstream child
    process or outbound connection). Model output must NEVER suppress a deterministic FIM hit. A positive
    result is a low-probability provenance path or log-key sequence with clear feature attribution; a
    negative is a high-likelihood, in-distribution sequence. References: [ProvDetector, Wang et al.](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf);
    [DeepLog, Du et al.](https://acmccs.github.io/papers/p1285-duA.pdf); [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 11
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 7
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'graph = provenance(EventID=11 -> 4688 -> conn.log) per host

      lof_score   = LocalOutlierFactor(rare_causal_paths(graph))   # ProvDetector

      seq_score   = LSTM_logkey_anomaly([EID11, EID4688, EID4104]) # DeepLog

      gnn_subgraph= KAIROS_temporal_gnn(graph)                     # explainable subgraph

      IF lof_score>thr OR seq_score>thr: alert(top3_features, subgraph)

      # parallel to FIM; never suppress deterministic hits'
- question: Which processes are writing to Unix/macOS shell init or logout scripts, and is the modifying
    or parent process atypical?
  context: 'Detect (D3-D): Shell init/logout scripts are sourced on each interactive or remote login,
    making them a durable persistence vector (T1546.004). Monitor Sysmon-for-Linux Event ID 11 / auditd
    file-write events across the enumerable config set: system-wide /etc/profile, /etc/profile.d/*, /etc/bashrc,
    /etc/zprofile, /etc/zshenv, /etc/zlogin, /etc/zlogout; and per-user ~/.bashrc, ~/.bash_profile, ~/.bash_login,
    ~/.profile, ~/.bash_logout, ~/.zshrc, ~/.zprofile, ~/.zlogin, ~/.zlogout. Encode these with the SigmaHQ
    shell-persistence file_event rule. Alert when the modifying process is not a known editor/installer
    (vim, nano, vi, code, package managers) or when the parent is a downloader/interpreter (curl, wget,
    python, perl), which signals scripted drive-by persistence. Validate with Atomic Red Team T1546.004.
    References: [Unix Shell Configuration Modification (T1546.004), MITRE ATT&CK](https://attack.mitre.org/techniques/T1546/004/);
    [SigmaHQ shell-persistence file_event rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/file_event/file_event_lnx_persistence_shell_profile.yml);
    [Atomic Red Team T1546.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1546.004/T1546.004.md).'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - auditd PATH/SYSCALL (file write)
  - Sysmon for Linux Event ID 1
  - auditd EXECVE
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, Bastion/SSH jump hosts, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "shell_paths = ['/etc/profile','/etc/profile.d/*','/etc/bashrc','/etc/zprofile','/etc/zshenv',\n\
      \  '/etc/zlogin','/etc/zlogout','*/.bashrc','*/.bash_profile','*/.bash_login','*/.profile',\n  '*/.bash_logout','*/.zshrc','*/.zprofile','*/.zlogin','*/.zlogout']\n\
      known_editors    = ['vim','nano','vi','code','apt','dpkg','yum','dnf','rpm','brew']\ndownloader_interp=\
      \ ['curl','wget','python','python3','perl']\nFROM (Sysmon-Linux EID 11 OR auditd PATH/SYSCALL write)\
      \ WHERE path MATCHES shell_paths\n  AND (comm NOT IN known_editors OR parent_comm IN downloader_interp)\n\
      => alert(user, comm, parent_comm, path, host)"
- question: Has any Unix/macOS shell init or logout file deviated from its cryptographic file-integrity
    baseline, and who made the change?
  context: 'Detect (D3-D): Keep a cryptographic-hash plus attribute baseline of all shell init/logout
    files and alert on any deviation with who-data (user, process, PID) attribution, per Wazuh FIM and
    the NIST file-integrity-checking standard. Treat writes to root-owned system-wide files (/etc/profile,
    /etc/profile.d) and the creation of new sourced-helper files (e.g., .zshrc_aliases) as high severity,
    since these affect all users or hide payloads in indirectly-sourced files. A positive result is a
    hash/attribute change or new helper file with attribution; a negative is a stable baseline. References:
    [Wazuh File Integrity Monitoring](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html);
    [NIST File Integrity Checking](https://csrc.nist.gov/glossary/term/file_integrity_checking).'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - auditd PATH/SYSCALL (file write)
  - Sysmon for Linux Event ID 1
  - auditd EXECVE
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, Bastion/SSH jump hosts, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: FIM/Rule pseudocode
    query: "FOR EACH path IN shell_init_logout_paths:\n  current = hash(path) + attributes(path)\n  IF\
      \ path NOT IN baseline:\n     sev = HIGH if path startswith '/etc/' or is_sourced_helper(path) else\
      \ MED\n     alert(sev, reason='new init/helper file', whodata)\n  ELIF current != baseline[path]:\n\
      \     sev = HIGH if path startswith '/etc/' else MED\n     alert(sev, reason='init file changed',\
      \ whodata)"
- question: Does the shell-init persistence chain (config write to sourced-at-login to payload exec/outbound)
    match a known TTP provenance graph pattern?
  context: 'Detect (D3-D): Encode the shell-init persistence chain as a TTP query graph - config write
    -> file sourced at next login -> payload exec or outbound connection - and match it against kernel-audit
    provenance, per POIROT (Milajerdi et al.). Graph matching means detection survives single-event evasion:
    even if one step is obfuscated, the overall causal pattern still matches. A positive result is a provenance
    subgraph matching the persistence TTP across write/source/exec/network stages; a negative is no matching
    multi-stage pattern. References: [POIROT, Milajerdi et al.](https://dl.acm.org/doi/10.1145/3319535.3363217).'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - auditd PATH/SYSCALL (file write)
  - Sysmon for Linux Event ID 1
  - auditd EXECVE
  - Zeek conn.log
  - 'NAI: User workstations, Developer endpoints, Bastion/SSH jump hosts, and Critical application servers'
  range: Last 90 days
  queries:
  - technology: Graph/pseudocode
    query: 'ttp_query = (write(shell_config) -> source_at_login(config) -> exec(payload) -> net_outbound)

      provenance = build_graph(auditd PATH/SYSCALL, EXECVE, conn.log)

      matches = subgraph_match(provenance, ttp_query)   # POIROT-style

      FOR m IN matches: alert(host, m.config, m.payload, m.net)'
