name: 'D3-FV: Firmware Verification'
id: cd6071ee-485c-436d-bc25-74d128834590
description: Investigate potential unauthorized firmware modification and pre-boot tampering by verifying
  the cryptographic integrity of platform and peripheral firmware against approved baselines. This playbook
  helps an analyst detect measured-boot and remote-attestation values diverging from golden baselines
  (TPM PCR / firmware-hash mismatches), Secure Boot and Windows Code Integrity validation failures (events
  3004/3033/3037/3077), unsigned or out-of-band firmware/SPI/EFI System Partition writes, boot-component
  downgrades and dbx-revoked binaries, MOK enrollment, and bcdedit weakening. Because a tampered platform
  cannot be trusted to report on itself, the guidance emphasizes primary measurements rooted in a hardware
  root of trust (TPM/BMC/coprocessor) and out-of-band cross-checks. It layers deterministic hash/PCR matching
  with statistical fleet-wide anomaly detection (rare firmware states, write volume/frequency baselining,
  boot-timing drift, failure-rate profiling) and machine-learning approaches (boot event-sequence modeling,
  cross-fleet divergence detection, unsupervised isolation) to surface bootkit and UEFI-rootkit activity
  such as BlackLotus and LoJax.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do the measured firmware hashes and critical TPM Platform Configuration Register (PCR) values
    on each host exactly match the approved golden baseline for that host's specific model and firmware
    revision?
  context: This is the deterministic floor for firmware verification. Compare measured firmware hashes
    and critical PCR values (especially PCR0-PCR7, which cover firmware code/data and Secure Boot state)
    against precomputed golden baselines for the exact host model and firmware revision, following the
    Root of Trust for Detection model in [Platform Firmware Resiliency Guidelines (NIST SP 800-193)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).
    The underlying hash-extend-into-PCR mechanism ([Design and Implementation of a TCG-based Integrity
    Measurement Architecture, Sailer et al](https://www.usenix.org/legacy/event/sec04/tech/full_papers/sailer/sailer.pdf))
    means any deviation in the boot chain produces a different PCR value. A direct mismatch indicates
    the firmware or boot components may have been tampered with, or the host is running a non-approved
    firmware revision (a misconfiguration). Under the Detect tactic, treat any mismatch as potential tampering
    and open an immediate investigation; this deterministic comparison must never be deleted or downgraded
    in favor of probabilistic methods. A negative result (exact match) is strong evidence the measured
    boot chain is trustworthy for that host.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each host:\n  JOIN measured_firmware_hash, PCR[0..7] WITH golden_baseline[model, firmware_rev]\n\
      \  IF measured_hash != baseline_hash OR PCR[i] != baseline_PCR[i] FOR any i in 0..7\n    THEN ALERT\
      \ priority=critical reason=\"firmware/PCR mismatch vs golden baseline\""
- question: Are there explicit host-native firmware integrity failures - Secure Boot violations, false
    remote-attestation status, or Windows Code Integrity events 3004/3033/3037/3077 - on any endpoint
    or server?
  context: 'These are first-party failure indicators that require no external API lookup and are highly
    reliable. Raise high-priority alerts on Secure Boot violations, false/failed remote attestation status,
    and Windows Code Integrity / Application Control events: 3004 and 3033 (signature validation failed),
    3037 (unsigned image loaded), and 3077 (image blocked by policy), per [Application Control / Code
    Integrity Event ID Explanations, Microsoft](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/operations/event-id-explanations).
    In the Detect tactic, these events directly indicate that an image or boot component failed cryptographic
    validation - a hallmark of attempts to load tampered firmware, unsigned drivers, or bootkits. A positive
    result warrants immediate triage of the offending image hash and loading process; absence across the
    fleet supports a clean code-integrity posture.'
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WHERE log=CodeIntegrity AND event_id IN (3004, 3033, 3037, 3077)\n   OR event=\"SecureBoot\
      \ violation\"\n   OR remote_attestation_status=\"failed\"\nALERT priority=high include=(host, image_path,\
      \ image_hash, signer, event_id)"
- question: Is every firmware/SPI write on each host accompanied by a valid, authenticated signed-update
    transaction, and are there any firmware writes not tied to a signed image?
  context: Following [BIOS Protection Guidelines (NIST SP 800-147)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf),
    the Root of Trust for Update should permit firmware changes only via authenticated signed-update transactions.
    Require every firmware write to be matched to a valid signed-update event verified by the platform's
    RoT for Update; flag any firmware or SPI flash write that is NOT tied to an authenticated signed image
    as suspicious. In the Detect tactic, an unsigned or unauthenticated firmware write is a strong indicator
    of malicious reflashing (e.g., LoJax-style SPI tooling). A positive result (firmware write without
    a corresponding signed transaction) should trigger immediate isolation and forensic capture; matched
    signed updates during maintenance are expected and benign.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each firmware_write_event(host, region=SPI|BIOS|EFI):\n  IF NOT EXISTS signed_update_transaction(host)\
      \ WITHIN +/-5m AND signature_valid=true\n    THEN ALERT priority=high reason=\"firmware write without\
      \ authenticated signed image\""
- question: Do any observed boot binaries match revoked (dbx) hashes, or show bootloader downgrade, EFI
    System Partition writes, MOK enrollment, or bcdedit security weakening?
  context: 'This targets concrete UEFI-bootkit observables documented in [BlackLotus UEFI Bootkit: Myth
    Confirmed, ESET](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/)
    and [LoJax: First UEFI Rootkit Found in the Wild, ESET](https://www.welivesecurity.com/2018/09/27/lojax-first-uefi-rootkit-found-wild-courtesy-sednit-group/).
    Match observed boot binaries against the dbx revoked/old hash list, and alert on: bootmgfw/bootmgr
    version downgrade (rollback to a vulnerable signed loader), writes to the EFI System Partition, MOK
    (Machine Owner Key) enrollment, and bcdedit weakening such as ''/set testsigning on'', ''nointegritychecks
    on'', or ''bootstatuspolicy ignoreallfailures''. Under the Detect tactic these are the actions an
    adversary takes to install a persistent pre-OS implant or disable integrity enforcement. A positive
    match indicates active bootkit installation or staging; clean hosts will show none of these binaries
    or bcdedit changes.'
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT IF boot_binary_hash IN dbx_revoked_list\n   OR (image IN [bootmgfw.efi, bootmgr] AND\
      \ version < approved_min_version)\n   OR write_target = \"EFI System Partition\"\n   OR event=\"\
      MOK enrollment\"\n   OR cmdline MATCHES \"bcdedit.*(testsigning on|nointegritychecks on|bootstatuspolicy\
      \ ignoreallfailures)\""
- question: Does the host-reported firmware state agree with an independent out-of-band measurement (TPM
    quote, BMC, or coprocessor), or is there any disagreement indicating the host is misreporting?
  context: Because a compromised host cannot be trusted to report on itself, compare host-reported firmware
    state against an independent out-of-band measurement - a signed TPM quote, BMC, or coprocessor reading
    - and alert on any disagreement. This applies the out-of-band integrity monitoring principle of [Copilot
    - a Coprocessor-based Kernel Runtime Integrity Monitor, Petroni et al](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf),
    operationalized as centralized firmware measurement collection and known-good comparison per [Methods
    and systems for hardware and firmware security monitoring, Eclypsium](https://patents.google.com/patent/US20200074086A1/en).
    In the Detect tactic, a discrepancy between what the OS reports and what the hardware root of trust
    measures is a powerful indicator that an implant is hiding itself by falsifying in-band telemetry.
    A positive result (disagreement) is high-confidence evidence of tampering; agreement between in-band
    and out-of-band measurements increases trust in the platform.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host:\n  oob = out_of_band_measurement(TPM_quote|BMC|coprocessor)\n  inband = host_reported_firmware_state\n\
      \  IF hash(oob) != hash(inband) THEN ALERT priority=critical reason=\"in-band vs out-of-band firmware\
      \ disagreement\""
- question: Which hosts report firmware hashes or versions that fall outside the 99th percentile of the
    expected distribution for their hardware model, and do entropy/fuzzy-hash comparisons place them near
    known-bad firmware?
  context: This statistical method finds rare firmware states across the fleet. Aggregate reported firmware
    hashes and versions by hardware model and flag values outside the 99th percentile of the expected
    fleet distribution as anomalous. Triage exact-hash failures using Shannon-entropy analysis and fuzzy-hash
    (ssdeep) similarity against known-good and known-bad corpora, per [A Large-Scale Analysis of the Security
    of Embedded Firmwares, Costin et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf);
    specification/statistical layering on rare scheduled firmware management follows [A Survey of Intrusion
    Detection Techniques for Cyber-Physical Systems, Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).
    In the Detect tactic, a firmware image that is unique or near-unique within an otherwise homogeneous
    fleet is suspicious even without a baseline match. A positive result (rare hash with low similarity
    to known-good) prioritizes deep inspection; common, widely-shared firmware states are lower risk.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'GROUP firmware_hash, firmware_version BY hardware_model

      COMPUTE frequency_distribution per model

      FLAG hosts WHERE firmware_state OUTSIDE 99th percentile

      FOR flagged: COMPUTE shannon_entropy(image), ssdeep_similarity(image, known_good/known_bad)

      ALERT IF similarity_to_known_bad high OR similarity_to_known_good low'
- question: Are there firmware writes (EFI System Partition / SPI flash byte volume or flash/update event
    counts) occurring outside approved maintenance windows or beyond the fleet's steady-state distribution?
  context: This tracks the physics of firmware writes per host. Measure byte Volume of EFI System Partition
    / SPI flash writes and the Frequency (count) of flash/update events per host per period. The baseline
    is typically zero outside approved maintenance windows. Alert on any firmware write outside a scheduled
    window, or on byte/frequency outliers beyond the fleet's steady-state distribution, with maintenance-window
    and authorized-tool framing per [A Survey of Intrusion Detection Techniques for Cyber-Physical Systems,
    Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf). Under the Detect tactic,
    firmware writes are rare, controlled events; unscheduled or high-volume writes strongly suggest unauthorized
    reflashing. A positive result (write outside a window or a volume/frequency outlier) warrants investigation
    of the responsible process and change record; writes confined to approved maintenance windows are
    expected.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "PER host PER period:\n  vol = bytes_written(ESP|SPI_flash)\n  freq = count(firmware_update_events)\n\
      \  IF (vol > 0 OR freq > 0) AND NOT within_maintenance_window THEN ALERT\n  IF vol > fleet_baseline_mean\
      \ + 3*stddev OR freq > fleet_baseline_freq_outlier THEN ALERT"
- question: Has any host's boot-stage timing or attestation-report latency drifted sustainedly from its
    own baseline (for example, beyond 2 standard deviations)?
  context: This statistical method models normal-then-flags-deviation, after [Detecting Cyberattacks in
    Industrial Control Systems Using Convolutional Neural Networks, Kravchik and Shabtai](https://arxiv.org/abs/1806.08110).
    Track boot-stage timing and attestation-report latency per host and alert on sustained deviation from
    baseline (e.g., greater than 2 standard deviations). In the Detect tactic, additional or manipulated
    boot-chain components (a bootkit hooking the boot flow) can introduce measurable timing changes or
    attestation latency, even when individual integrity checks pass. A positive result (sustained timing/latency
    drift) is a soft indicator that should be correlated with hash/PCR and write-event signals; transient
    single-boot variation is normal and should not alert on its own.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "PER host: model baseline_mean, baseline_stddev of boot_stage_time and attestation_latency\n\
      IF observed > baseline_mean + 2*baseline_stddev FOR sustained N boots\n  THEN ALERT priority=medium\
      \ reason=\"boot-timing/attestation-latency drift\""
- question: Is any host's (or the fleet's) rate of failed remote attestation, Secure Boot violations,
    or Code Integrity failures (events 3004/3033/3077) rising above its own baseline or the fleet median?
  context: This profiles failure-mode signals as distinct statistical indicators. Compute per-host and
    fleet-wide rates of failed remote attestation, Secure Boot violations, and Code Integrity validation
    failures (events 3004/3033/3077, per [Application Control / Code Integrity Event ID Explanations,
    Microsoft](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/operations/event-id-explanations)).
    A host whose failure rate climbs above its own historical baseline or the fleet median is anomalous
    even when no single event is conclusive, following the statistical IDS framing of [A Survey of Intrusion
    Detection Techniques for Cyber-Physical Systems, Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).
    Under the Detect tactic, a rising failure rate can reveal slow or stealthy tampering attempts, repeated
    load attempts of unsigned components, or a degrading trust posture before a hard failure occurs. A
    positive result (elevated failure rate) prioritizes the host for inspection; stable, low failure rates
    are expected.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'PER host PER day: rate = count(attestation_fail, secureboot_violation, CI_event in {3004,3033,3077})

      fleet_median = median(rate across hosts)

      IF rate > host_baseline_rate OR rate > fleet_median THEN ALERT priority=medium'
- question: Does the ordering of boot and firmware events on a host (measured-boot, TPM PCR-extend, driver-load,
    Code Integrity, shutdown) deviate from learned-normal sequences in a way consistent with bootkit or
    pre-OS compromise?
  context: 'This machine-learning method uses sequence-aware models (e.g., LSTM) trained on normal orderings
    of boot/firmware events - measured-boot, TPM PCR-extend, driver-load, Code Integrity, and shutdown
    - to flag improbable sequence order or transitions, surfacing the specific offending log key in the
    alert, per [DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep Learning, Du et
    al](https://doi.org/10.1145/3133956.3134015). In the Detect tactic, bootkits and pre-OS implants often
    perturb the order or presence of boot events even when individual measurements are subverted; modeling
    the sequence catches structural anomalies. This must run in parallel with the deterministic hash/PCR
    floor and never replace it. A positive result (improbable event sequence) names the offending step
    for analyst triage; expected boot sequences produce no alert.'
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "TRAIN LSTM on normal boot/firmware event sequences per host class\n  events = [measured_boot,\
      \ TPM_PCR_extend, driver_load, code_integrity, shutdown]\nSCORE each new boot sequence; IF next-event\
      \ probability < threshold\n  THEN ALERT include=offending_log_key  # runs alongside, not instead\
      \ of, hash/PCR check"
- question: Within a fleet of identical hardware/firmware, does any single unit's firmware-hash/PCR profile
    or boot-error distribution diverge from its peers?
  context: 'This training-less machine-learning method (after [ReplicaWatcher: Training-less Anomaly Detection
    in Containerized Microservices](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf))
    compares each unit''s firmware-hash/PCR profile and boot-error distribution against its peers in a
    homogeneous fleet and flags the divergent unit, naturally exposing the divergent features for triage
    - no training phase required. In the Detect tactic, when many machines are provisioned identically,
    the one that differs is inherently suspicious and likely tampered. A positive result (one unit diverging
    from its identical peers) directs the analyst to the specific differing features (a hash, a PCR, an
    error pattern); uniform fleets produce no alert.'
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'GROUP hosts BY identical(hardware_model, firmware_rev)

      FOR each group: build peer_profile of {firmware_hash, PCR_set, boot_error_dist}

      FLAG unit WHERE profile diverges from peer consensus

      ALERT include=divergent_features  # no training phase'
- question: Across the fleet, which hosts have rare firmware feature vectors (vendor/model/version/hash
    novelty, PCR set, boot time, update-tool process attributes) that an Isolation Forest isolates as
    anomalous?
  context: This unsupervised machine-learning method applies [Isolation Forest, Liu Ting and Zhou](https://doi.org/10.1109/ICDM.2008.17)
    to per-host firmware feature vectors - vendor, model, firmware-version, hash novelty, PCR set, boot
    time, and firmware-update-tool process attributes - to isolate rare firmware states fleet-wide without
    labels, reporting the top-3 contributing features (by path-length attribution) in the alert text.
    In the Detect tactic, this catches novel or rare firmware configurations that no signature or baseline
    anticipated, including subtle multi-feature combinations. A positive result (a host isolated quickly
    by the forest) surfaces the most anomalous features for triage; states common across the fleet receive
    normal anomaly scores and do not alert.
  answer_sources:
  - Windows Measured Boot logs
  - UEFI Secure Boot logs
  - Windows Code Integrity / AppControl event logs (3004/3033/3037/3077)
  - Trusted Platform Module (TPM) Platform Configuration Register (PCR) values
  - Logs from remote attestation tools (e.g., Microsoft Intune)
  - Out-of-band attestation (BMC/coprocessor) measurements
  - 'NAI: Endpoint and server boot partitions, BIOS/UEFI firmware chips, and Trusted Platform Modules
    (TPMs).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FEATURES per host = [vendor, model, firmware_version, hash_novelty, PCR_set, boot_time, update_tool_proc_attrs]

      FIT IsolationForest on fleet feature matrix

      score = anomaly_score(host)

      IF score > threshold THEN ALERT include=top_3_features(by path_length attribution)'
