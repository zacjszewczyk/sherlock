questions:
- question: Can each observed network connection involving a critical service be bound to both its source
    (parent) process and its destination listening process to build a directed process-to-service dependency
    graph?
  context: 'This is the foundational mapping step for the Model tactic: before anomalies can be judged,
    the analyst must reconstruct who actually talks to whom. Correlate Zeek conn.log records with Windows
    Event ID 4688 (new process creation), Sysmon Event ID 3 (network connection), and Event ID 5156 (Windows
    Filtering Platform connection) so that each flow''s 4-tuple binds the initiating parent process on
    the source host to the listening process on the destination host. Where service-mesh sidecars or API
    gateways emit distributed traces, prefer propagated trace-context (trace id + span ids) to reconstruct
    exact causal parent->child call trees rather than merely inferring correlation from timing. Where
    uniform instrumentation is absent, derive causal happens-before/pipeline edges from heterogeneous
    first-party logs by hypothesizing relationships and refuting any contradicted by observed traces.
    Treat provenance causal events (process->socket->process) as explicit dependency edges. A complete,
    accurate graph is the baseline against which all subsequent new-edge, strength, failure, and ML scoring
    is measured. Supporting references for these methods: [Dapper](https://research.google/pubs/pub36356/)
    (propagated trace-context to reconstruct exact causal call trees), [The Mystery Machine](https://www.usenix.org/system/files/conference/osdi14/osdi14-paper-chow.pdf)
    (hypothesize-and-refute causal edges from heterogeneous first-party logs), and [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)
    (provenance causal events as explicit dependency edges for localization).'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Distributed tracing spans (OpenTelemetry/Jaeger/Zipkin)
  - EDR/Sysmon Event ID 3 (Network Connection)
  - 'NAI: Core network switches and server subnets where critical applications are hosted; service-mesh
    sidecars and API gateways emitting distributed traces; container/microservice clusters.'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: "JOIN zeek_conn (src_ip,src_port,dst_ip,dst_port,proto,ts)\n  WITH win_4688 ON src_ip=host\
      \ AND ts WITHIN [proc_start, proc_end]  -> source_process\n  WITH sysmon_id3 OR win_5156 ON dst_ip=host\
      \ AND dst_port=listen_port -> dest_process\nEMIT edge(source_process -> dest_process:dst_port, proto,\
      \ first_seen=min(ts))\nPREFER trace_context (trace_id, parent_span_id, span_id) WHEN distributed_trace\
      \ present"
  - technology: Distributed tracing/pseudocode
    query: 'FROM spans GROUP BY trace_id ORDER BY start_time

      BUILD call_tree via parent_span_id -> span_id

      EMIT causal_edge(caller_service -> callee_service) FOR each parent/child span pair'
- question: Has a critical server initiated or received a connection on a service/port/protocol tuple
    that is absent from the established 30-day baseline dependency map?
  context: Maintain a baselined dependency map (default 30-day rolling window) of observed source-service
    -> destination-service:port tuples. Alert whenever a critical server participates in a (src, dst,
    port) edge not previously observed. New edges are a high-fidelity signal of lateral movement, unauthorized
    service proliferation, C2 beaconing to internal pivots, or misconfiguration. This deterministic new-edge
    rule mirrors learned low-probability-edge detection on enterprise communication graphs and must be
    kept as a floor even when ML scoring is enabled; tune the window per environment rather than deleting
    it. A positive result (a never-before-seen edge on a critical host) warrants triage against change-management
    records; a negative result means the dependency conforms to baseline. Alert text must name the new
    (src, dst, port) tuple and the first-seen timestamp so the analyst can immediately pivot. This deterministic
    new-edge rule mirrors learned low-probability-edge detection on enterprise communication graphs ([CyberGraph](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf)).
  answer_sources: *id001
  range: Last 90 days (baseline 30-day rolling window; alert on edges first-seen outside baseline)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "baseline := DISTINCT (src_service, dst_service, dst_port, proto)\n            FROM edges WHERE\
      \ ts IN last_30_days AND host IN critical_servers\nFOR each new_edge IN today.edges WHERE host IN\
      \ critical_servers:\n  IF (new_edge.src,new_edge.dst,new_edge.dst_port,new_edge.proto) NOT IN baseline:\n\
      \     ALERT 'New service dependency', tuple=(src,dst,port,proto), first_seen=new_edge.ts"
- question: For each service dependency pair, what is its strength in terms of total bytes, send:receive
    byte ratio, connections per minute, and session duration, and which pairs qualify as 'strong dependencies'
    at or above the 95th percentile?
  context: For each unique process/service dependency pair, compute Volume (total bytes sent/received
    and the send:receive byte ratio), Frequency (connections per minute), and Duration (session length)
    from Zeek conn.log. Flag 'strong dependencies' at the >=95th percentile for volume or frequency, and
    score deviations using median-absolute-deviation (MAD) and PCA residuals over graph degree/volume/frequency
    features. Derive percentile and MAD thresholds per subnet from your own 30-day baseline rather than
    fixed global constants, because traffic profiles differ sharply between, e.g., a database tier and
    a logging tier. Quantifying strength supports the Model tactic by ranking which dependencies are essential
    (and therefore highest-priority for supply-chain risk analysis) and by exposing edges whose strength
    deviates abnormally from peers, which may indicate exfiltration (skewed byte ratio) or beaconing (regular
    frequency). Score deviation with median-absolute-deviation and PCA residuals over graph degree/volume/frequency
    features ([Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn GROUP BY (src_service, dst_service, dst_port):\n  vol      = sum(orig_bytes)+sum(resp_bytes)\n\
      \  ratio    = sum(orig_bytes)/nullif(sum(resp_bytes),0)\n  freq_pm  = count(*)/minutes_observed\n\
      \  duration = avg(conn_duration)\nthr_vol  = percentile(vol, 95) PER subnet (from 30d baseline)\n\
      thr_freq = percentile(freq_pm, 95) PER subnet\nFLAG strong WHERE vol>=thr_vol OR freq_pm>=thr_freq\n\
      SCORE deviation = MAD_zscore(features) ; PCA_residual(degree,vol,freq)"
- question: Does any service dependency show a failed-to-successful ratio (refused/reset connections,
    DNS NXDOMAIN/SERVFAIL, HTTP 4xx/5xx, failed logons) that exceeds the 99th percentile of its historical
    variance?
  context: Track per-edge failure state as a signal distinct from volume. Aggregate failed/refused/reset
    connections (Zeek conn_state S0/REJ/RSTO), DNS NXDOMAIN/SERVFAIL rate from dns.log, HTTP 4xx/5xx rate
    from http.log, and failed logons. Establish a baseline failure ratio per dependency and alert when
    the failed:successful ratio exceeds the 99th percentile of historical variance. A spike can indicate
    a broken or removed dependency (operational), but also scanning, service impersonation, brute-forcing,
    or a dependency that has been redirected to an attacker-controlled endpoint. Failure-rate spikes frequently
    precede or accompany dependency churn, so this signal is an early warning for the Model tactic. A
    positive result should be correlated with the new-edge and churn questions; a clean failure profile
    increases confidence that the dependency is healthy and intended. Failure-rate spikes precede or accompany
    dependency churn ([Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn_fail = count(conn_state IN {S0,REJ,RSTO})  GROUP BY (src,dst,dst_port)

      conn_ok   = count(conn_state IN {SF,S1,RSTR})   GROUP BY (src,dst,dst_port)

      dns_fail  = count(rcode IN {NXDOMAIN,SERVFAIL}) FROM dns.log GROUP BY query_dst

      http_fail = count(status_code >= 400)           FROM http.log GROUP BY host

      fail_ratio = conn_fail / nullif(conn_ok,0)

      ALERT WHERE fail_ratio > percentile(historical_fail_ratio, 99)'
- question: Is the daily rate of new and expired dependency edges across the server farm exceeding the
    99th percentile of historical variance, or has the communication graph's community structure (modularity
    Q) sharply shifted?
  context: 'Compute the daily rate of new and expired dependency edges across the server farm and alert
    when churn exceeds the 99th percentile of historical variance, which can indicate mass misconfiguration
    or large-scale compromise. Corroborate structural change with the modularity quality function Q computed
    over the communication graph: a sharp drop or jump in Q signals that community structure has materially
    shifted (e.g., a host suddenly bridging previously separate service groups). In microservice fleets,
    compare an edge''s call-frequency distribution against peer replicas and flag the divergent replica,
    a drift-resistant statistic. For the Model tactic, churn tracking distinguishes gradual, expected
    architectural evolution from abrupt, suspicious topology changes that warrant investigation. Corroborate
    structural change with the modularity quality function Q over the communication graph ([Newman](https://arxiv.org/pdf/physics/0602124));
    in microservice fleets, compare an edge''s call-frequency distribution against peer replicas and flag
    the divergent replica, a drift-resistant statistic ([ReplicaWatcher](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf)).'
  answer_sources: *id001
  range: Last 90 days (daily aggregation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each day d:\n  new_edges[d]     = edges(d) - edges(d-1)\n  expired_edges[d] = edges(d-1)\
      \ - edges(d)\n  churn[d]         = |new_edges[d]| + |expired_edges[d]|\nALERT WHERE churn[d] > percentile(churn_history,\
      \ 99)\nQ[d] = modularity(communication_graph(d))\nALERT WHERE abs(Q[d] - moving_avg(Q)) > k*stddev(Q)\n\
      MICRO: KL_divergence(replica.freq_dist, peer_replicas.freq_dist) -> flag outlier replica"
- question: When hosts/services are modeled as a weighted graph and community detection (Louvain) is applied,
    what tightly-coupled logical service groups emerge, and which observed edges cross those discovered
    community boundaries?
  context: Represent hosts/services as nodes and connections as weighted edges (weight = volume or frequency),
    then apply greedy modularity-optimization community detection (Louvain) to discover tightly-coupled
    logical service groups in near-linear time, producing a data-driven architectural baseline for the
    Model tactic. Score partition significance with modularity Q. Alert on cross-cluster edges that violate
    the discovered grouping, since a connection bridging two otherwise-separate communities (e.g., a workstation
    segment reaching the database community directly) is a strong lateral-movement indicator. Surface
    the source/destination communities and edge weight in the alert so the analyst can judge whether the
    bridge is architecturally justified or anomalous. A stable, high-Q partition gives confidence in the
    service-group model; frequent cross-cluster violations suggest either poor segmentation or active
    compromise. Apply greedy modularity-optimization community detection ([Louvain](https://arxiv.org/pdf/0803.0476))
    and score partition significance with modularity Q ([Newman](https://arxiv.org/pdf/physics/0602124)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Graph analytics/pseudocode
    query: "G = build_graph(nodes=services, edges=connections, weight=volume_or_frequency)\ncommunities\
      \ = louvain(G)            # greedy modularity optimization\nQ = modularity(G, communities)\nFOR\
      \ each edge(u,v) IN G:\n  IF community(u) != community(v):\n     ALERT 'cross-cluster edge', src_comm=community(u),\
      \ dst_comm=community(v), weight=edge.weight"
- question: When an unsupervised graph model is trained on the normal dependency graph, which observed
    edges or service nodes receive the highest improbability/anomaly scores, and what top contributing
    features explain each anomaly?
  context: Train an unsupervised graph model on the normal dependency graph and rank each observed edge
    by improbability/anomaly score. Use node-embedding edge-probability estimation to flag rare/new edges,
    inductive GraphSAGE node-role learning to localize the specific anomalous service node, and temporal
    graph-autoencoders that learn normal edge-formation over time and emit compact explainable subgraphs;
    scale provenance embedding via semantic-encoding + GNN. The model must surface the top-3 contributing
    features (e.g., edge novelty probability, byte-ratio z-score, fan-out delta) in alert text, and must
    run in parallel with the deterministic new-edge rule, never replacing it. For the Model tactic, ML
    scoring catches subtle anomalies that fixed rules miss (e.g., an edge that exists in baseline but
    at abnormal volume/timing), while the explainability requirement keeps alerts triageable and defensible.
    Treat high-scoring edges as leads to corroborate against new-edge, churn, and failure-rate findings.
    Use node-embedding edge-probability estimation to flag rare/new edges ([CyberGraph](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf)),
    inductive GraphSAGE node-role learning to localize the specific anomalous service node ([ThreaTrace](https://arxiv.org/pdf/2111.04333)),
    temporal graph-autoencoders that learn normal edge-formation over time and emit compact explainable
    subgraphs ([KAIROS](https://tfjmp.org/publications/2024-sp.pdf)), and scale provenance embedding via
    semantic-encoding + GNN ([FLASH](https://dartlab.org/assets/pdf/flash.pdf)).
  answer_sources: *id001
  range: Last 90 days (train on baseline window; score rolling)
  queries:
  - technology: ML/Graph learning pseudocode
    query: "model = train_unsupervised(normal_dependency_graph)   # node embeddings / GraphSAGE / temporal\
      \ GAE\nFOR each observed_edge e:\n  score = anomaly_score(model, e)        # 1 - edge_probability\n\
      \  feats = top3_contributions(model, e)   # novelty_prob, byte_ratio_z, fan_out_delta\n  IF score\
      \ > threshold:\n     ALERT edge=e, node=localize(model,e), score=score, explain=feats\nRUN IN PARALLEL\
      \ WITH deterministic new-edge rule (do not replace)"
- question: Using distributed traces, can a causal Bayesian network over the service dependency graph
    (with per-edge latency distributions) attribute anomalous behavior to a specific dependency edge and
    validate which dependencies are intended versus essential?
  context: 'From distributed traces, learn a causal Bayesian network over the service dependency graph
    with per-edge latency distributions, enabling counterfactual attribution of which dependency edge
    drives anomalous behavior and providing explainable, label-free deviation detection. Use this probabilistic
    topology to validate intended vs. essential dependencies and to prioritize critical-path edges for
    supply-chain risk analysis. For the Model tactic, this is the most architecturally rich representation:
    rather than only flagging that something is wrong, the Bayesian model can answer ''which edge, if
    changed, best explains the observed deviation'', supporting root-cause localization and informing
    where defenders should concentrate hardening and monitoring. A well-fit model with stable per-edge
    latency distributions confirms the topology; large posterior shifts on a critical-path edge are an
    actionable anomaly. This causal Bayesian network over the service dependency graph with per-edge latency
    distributions enables counterfactual attribution and explainable, label-free deviation detection ([Sage](https://arxiv.org/pdf/2101.00267)).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Bayesian pseudocode
    query: "traces = load_distributed_traces()\nbn = learn_causal_bayesian_network(service_graph, per_edge_latency_dist=traces)\n\
      FOR each anomalous_observation o:\n  attribution = counterfactual_attribution(bn, o)   # which edge\
      \ best explains o\n  ALERT root_cause_edge=argmax(attribution), posterior_shift=delta\nRANK critical_path_edges\
      \ BY centrality FOR supply-chain risk review"
