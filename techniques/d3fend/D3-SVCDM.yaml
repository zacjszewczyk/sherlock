name: 'D3-SVCDM: Service Dependency Mapping'
id: d9d94ea9-3c17-4a5f-9755-375c30d2f864
description: Investigate and validate the observed communication dependencies between services on the
  network to distinguish legitimate, intended service-to-service relationships from anomalous, unauthorized,
  or malicious ones. This playbook helps an analyst (1) deterministically construct causal dependency
  edges by binding network flows to the source and destination processes (correlating Zeek conn.log with
  Windows Event ID 4688, Sysmon Event ID 3, Event ID 5156, and distributed-trace context); (2) detect
  newly appearing service dependencies that deviate from a baselined dependency map, which can reveal
  lateral movement or unauthorized service proliferation; (3) quantify dependency strength using volume,
  frequency, and duration metrics; (4) profile per-edge failure and error rates (refused/reset connections,
  NXDOMAIN, HTTP 4xx/5xx, failed logons) as a signal distinct from volume; (5) track day-over-day dependency
  churn and community-structure shifts; and (6) apply graph and machine-learning models (community detection,
  node-embedding edge-probability scoring, temporal graph autoencoders, and causal Bayesian networks)
  to learn the normal dependency graph and rank novel or anomalous edges with per-entity explainability.
  Together these methods build a data-driven architectural baseline that supports supply-chain risk analysis
  and prioritization of critical-path service dependencies.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
