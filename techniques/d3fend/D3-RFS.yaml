questions:
- question: Which Critical or Sensitive assets are NOT currently located inside a certified RF-shielded
    enclosure or SCIF space?
  context: 'Under the Harden tactic, the foundational countermeasure for RF attack is the zoning principle:
    place emanating equipment inside a certified attenuating boundary. By cross-referencing the asset
    inventory against physical security audit reports, the analyst enumerates every Critical or Sensitive
    asset that sits outside a certified shielded zone. Each such asset is an unmitigated emanation and
    ingress risk. A positive result (assets found outside shielding) is a hardening gap requiring engineering
    review; a clean result means all sensitive equipment is within an attenuating boundary. References:
    [Compromising Emanations, Kuhn](https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-577.pdf).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM asset_inventory AS a\nLEFT JOIN shielding_certifications AS s ON a.location_id = s.location_id\n\
      WHERE a.criticality IN ('Critical','Sensitive')\n  AND (s.location_id IS NULL OR s.zone_type NOT\
      \ IN ('SCIF','Certified_RF_Enclosure'))\nRETURN a.asset_id, a.criticality, a.location_id, a.mission_function"
- question: Does every shielded location have current, valid shielding certification evidence, or are
    any attestations absent, expired, or failed?
  context: 'A barrier without a current certification proves nothing: certification must verify measured
    shielding effectiveness, not merely the presence of a shield. For the Harden tactic, the analyst validates
    that each shielded location carries certification evidence that is present, unexpired, and passing.
    Assets whose certification is missing, expired, or marked failed must be flagged for immediate engineering
    review because their attenuation can no longer be assumed. A positive result indicates a control whose
    effectiveness is unverified or known-degraded. References: [EMI shielding review](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12566414/).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM shielding_certifications AS s\nWHERE s.cert_status IS NULL\n   OR s.cert_status = 'FAILED'\n\
      \   OR s.cert_expiry_date < NOW()\nRETURN s.location_id, s.cert_status, s.cert_expiry_date, s.last_test_date"
- question: For each shielded zone, does the measured shielding effectiveness (SE) meet or exceed the
    engineering attenuation floor in EVERY in-use frequency band?
  context: 'Shielding effectiveness SE = 10*log10(P_in/P_out) and is strongly frequency-dependent, decomposing
    into reflection, absorption, and multiple-reflection terms. The Harden tactic requires a hard, non-deletable
    attenuation floor per band: SCIF/TEMPEST zones commonly require ~80-100 dB while general EMI enclosures
    require 20-60 dB. The analyst tests the full in-use band and treats any measured band falling below
    its band-specific threshold as a deterministic FAIL. This catches apertures, gasket faults, and waveguide-vent
    leaks that only manifest in specific bands. A FAIL means the zone cannot be relied on to contain emanations
    or exclude external signals. References: [EMI shielding review](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12566414/),
    [Compromising Emanations, Kuhn](https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-577.pdf).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM rf_spectrum_sweeps AS m

      JOIN band_thresholds AS t ON m.band = t.band AND m.zone_class = t.zone_class

      LET se_db = 10*LOG10(m.power_in_mw / m.power_out_mw)

      WHERE se_db < t.required_se_db

      RETURN m.location_id, m.band, se_db AS measured_se, t.required_se_db, ''FAIL'' AS verdict'
- question: Is any decodable, repetitive, or periodic in-band RF/EM emission present inside a zone that
    is supposed to be RF-quiet?
  context: 'Covert channels exploit even weak leakage from displays, cabling, and unmodified USB devices
    (AirHopper, USBee). Under the Harden tactic, any decodable or periodic in-band emission inside a supposedly
    RF-quiet shielded zone is treated as a control failure, combined with a deny-by-default rule on unauthorized
    transmitters/receivers carried into the zone. The analyst looks for structured (non-noise) energy
    and recurring periodicity in the in-zone spectrum. A positive result suggests either an active covert
    channel or shielding leakage admitting/exfiltrating signal, both of which defeat the zone''s purpose.
    References: [AirHopper, Guri et al.](https://arxiv.org/abs/1411.0237), [USBee, Guri et al.](https://arxiv.org/abs/1608.08397).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM sdr_sensor_telemetry AS r\nWHERE r.zone_state = 'RF_QUIET'\n  AND (r.decodable = TRUE\
      \ OR r.periodicity_score > periodicity_threshold)\nRETURN r.location_id, r.frequency_mhz, r.power_dbm,\
      \ r.decodable, r.periodicity_score, 'CONTROL_FAILURE' AS verdict"
- question: Are any radios operating inside or adjacent to the shielded zone whose PHY-layer RF fingerprint
    or MAC/BSSID is NOT on the authorized allowlist?
  context: 'The Harden tactic maintains an allowlist of authorized radios identified by PHY-layer RF fingerprint
    and/or MAC/BSSID permitted to operate inside or adjacent to the shielded zone. Any unknown fingerprint
    indicates either an unauthorized emitter brought into the zone or shielding leakage admitting an external
    signal. The analyst compares each observed emitter against the allowlist; deny-by-default means anything
    not explicitly authorized is suspect. A positive result (unknown fingerprint) demands physical investigation
    of the zone and its boundary. References: [RF Fingerprinting of Bluetooth, Rusins and Nesenbergs](https://arxiv.org/abs/2402.06250),
    [RadIoT, Roux et al.](https://arxiv.org/abs/1811.03934).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM rf_observations AS o\nLEFT JOIN device_allowlist AS w ON o.rf_fingerprint = w.rf_fingerprint\
      \ OR o.bssid = w.bssid\nWHERE w.rf_fingerprint IS NULL AND w.bssid IS NULL\n  AND o.zone_proximity\
      \ IN ('INSIDE','ADJACENT')\nRETURN o.location_id, o.rf_fingerprint, o.bssid, o.frequency_mhz, o.first_seen"
- question: From paired inside/outside spectrum sweeps, which frequency bands show mean, 95th-percentile,
    or worst-case attenuation below the engineering threshold?
  context: 'For the Harden tactic, the analyst computes attenuation statistics (mean, 95th percentile,
    and worst case) by frequency band - cellular, Wi-Fi, Bluetooth, and broadband - from paired inside/outside
    spectrum sweeps. Any band falling below its engineering threshold (for example <80 dB for a SCIF)
    signals likely shielding degradation. Aperture, gasket, or waveguide-vent faults appear as frequency-localized
    SE loss, so band-resolved statistics expose problems that a single aggregate number would hide. A
    flagged band indicates measurable degradation of the shielding boundary. References: [EMI shielding
    review](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12566414/), [Compromising Emanations, Kuhn](https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-577.pdf).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM paired_sweeps AS p

      LET atten = p.power_outside_dbm - p.power_inside_dbm

      GROUP BY p.location_id, p.band

      STATS mean(atten) AS mean_att, percentile(atten,95) AS p95_att, min(atten) AS worst_att

      JOIN band_thresholds AS t ON band = t.band

      WHERE mean_att < t.required_se_db OR worst_att < t.required_se_db

      RETURN location_id, band, mean_att, p95_att, worst_att, t.required_se_db'
- question: Has the in-zone received-power distribution per band excursed above its rolling baseline,
    indicating leakage or an intermittent emitter?
  context: 'A single SE certification test is a point-in-time snapshot; intermittent emitters and transient
    leakage slip between tests. Under the Harden tactic, the analyst profiles the in-zone received-power
    distribution per band (Volume: power/energy in dBm; Frequency: emissions per minute; State: decodable
    vs. noise) and alerts on excursions above a rolling baseline. A site-specific threshold (start at
    mean + 3 sigma, or >6-10 dB above the noise floor) flags abnormal power. An excursion suggests new
    leakage or an emitter that periodic certification would miss. References: [RadIoT, Roux et al.](https://arxiv.org/abs/1811.03934).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM sdr_sensor_telemetry AS r\nGROUP BY r.location_id, r.band\nLET baseline_mean = rolling_mean(r.power_dbm,\
      \ window=30d)\nLET baseline_sd = rolling_stddev(r.power_dbm, window=30d)\nWHERE r.power_dbm > baseline_mean\
      \ + 3*baseline_sd\n   OR r.power_dbm > r.noise_floor_dbm + 8\nRETURN r.location_id, r.band, r.power_dbm,\
      \ baseline_mean, r.timestamp"
- question: Are RF leakage incidents, spectrum-anomaly events, and failed/overdue re-certification tests
    trending upward (or measured SE trending downward) at any facility?
  context: 'Physical shielding degrades over time as gaskets age, penetrations are added, and new high-power
    external sources appear nearby. For the Harden tactic, the analyst tracks per-facility counts of RF
    leakage incidents, spectrum-anomaly events, and failed/overdue shielding re-certifications over time,
    and tests for a statistically significant upward trend in leakage or downward trend in measured SE.
    Failed re-tests and overdue certifications are themselves a distinct primary failure-mode signal.
    A significant adverse trend indicates progressive shielding failure that warrants engineering intervention
    before it becomes exploitable. References: [EMI shielding review](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12566414/).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 365 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM facility_rf_events AS e\nGROUP BY e.facility_id, time_bucket(e.timestamp, 30d)\nSTATS\
      \ count_where(e.type IN ('leakage','spectrum_anomaly')) AS incident_ct,\n      count_where(e.type\
      \ IN ('failed_recert','overdue_cert')) AS cert_fail_ct,\n      mean(e.measured_se_db) AS avg_se\n\
      LET trend = mann_kendall(incident_ct) , se_trend = mann_kendall(avg_se)\nWHERE trend.p_value < 0.05\
      \ AND (trend.direction = 'up' OR se_trend.direction = 'down')\nRETURN e.facility_id, incident_ct,\
      \ cert_fail_ct, avg_se, trend"
- question: Do higher-order-moment / cumulant features of the in-zone spectrum indicate signal presence
    in a band where only noise should exist?
  context: 'When learned models are unavailable, expert higher-order-moment and cumulant features provide
    a robust, explainable statistical comparator for signal presence. Pure thermal noise has characteristic
    higher-order statistics; the presence of a modulated signal perturbs cumulants (e.g., fourth-order
    C40/C42). Under the Harden tactic, the analyst computes these features per band as a deterministic
    fallback for detecting that ''something is transmitting'' inside a quiet zone. A deviation from the
    noise-only cumulant profile flags signal presence even without a trained classifier. References: [Over
    the Air Deep Learning Based Radio Signal Classification, O''Shea et al.](https://arxiv.org/abs/1712.04578).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM iq_captures AS c\nGROUP BY c.location_id, c.band\nLET c40 = fourth_order_cumulant(c.iq_samples)\n\
      LET c42 = normalized_cumulant_C42(c.iq_samples)\nWHERE abs(c40 - noise_reference_c40) > cumulant_threshold\n\
      \   OR abs(c42 - noise_reference_c42) > cumulant_threshold\nRETURN c.location_id, c.band, c40, c42,\
      \ 'SIGNAL_PRESENT' AS verdict"
- question: Does a learned baseline model of the zone's normal spectrum flag novel emissions, power excursions,
    or leakage without a known signature?
  context: 'Signature-based detection misses novel covert channels. For the Harden tactic, an autoencoder
    / predictive-coding model is trained over spectrograms of the shielded zone to learn its normal near-noise-floor
    spectrum, then flags reconstruction errors corresponding to novel emissions, power excursions, or
    leakage. Critically, the alert must surface the top-3 contributing features (offending frequency band,
    power delta vs. baseline in dB, time/duration) rather than only an opaque anomaly score, so an engineer
    can act. A high anomaly score localized to a band indicates an unexpected emission inside the supposedly
    quiet zone. References: [Deep Predictive Coding Neural Network for RF Anomaly Detection, Tandiya et
    al.](https://arxiv.org/abs/1803.06054), [RadIoT, Roux et al.](https://arxiv.org/abs/1811.03934).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "spec = spectrogram(sdr_sensor_telemetry[location_id])\nrecon = autoencoder.reconstruct(spec)\n\
      anomaly_score = mse(spec, recon)\nIF anomaly_score > learned_threshold:\n    top3 = rank_feature_contributions(spec\
      \ - recon)  # band, power_delta_db, time/duration\n    EMIT alert(location_id, anomaly_score, top3)"
- question: What is the modulation/source type of any signal observed inside the zone, and is it benign
    ingress or a covert channel?
  context: 'Detecting energy is not enough; triage requires knowing what is emitting. Under the Harden
    tactic, a deep IQ signal classifier identifies the modulation/source type of any signal inside the
    zone, enabling explainable triage that distinguishes benign ingress (e.g., a known cellular band bleeding
    through) from a covert channel. The classifier''s predicted class and confidence are included in the
    alert. A confident classification of an unexpected modulation inside a shielded zone is strong evidence
    of either leakage or an unauthorized transmitter. References: [Over the Air Deep Learning Based Radio
    Signal Classification, O''Shea et al.](https://arxiv.org/abs/1712.04578).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR signal IN detected_signals[zone]:\n    iq = capture_iq(signal)\n    pred_class, confidence\
      \ = deep_iq_classifier.predict(iq)\n    EMIT triage(location_id, signal.frequency_mhz, pred_class,\
      \ confidence,\n                category = benign_ingress_or_covert(pred_class))"
- question: Does any transmitter near a shielded asset present a PHY-layer fingerprint inconsistent with
    the legitimate device (rogue emitter or evil-twin spoofing)?
  context: 'Hardware imperfections give each transmitter a PHY-layer fingerprint (transient phase, IQ-imbalance,
    preamble shape). For the Harden tactic, a CNN binds transmitters to their hardware-specific fingerprint
    to flag rogue/unknown emitters near shielded assets and to detect evil-twin spoofing whose preamble
    is inconsistent with the legitimate device''s. The analyst compares the observed fingerprint to the
    enrolled fingerprint for that identity; a mismatch on a claimed-legitimate MAC/BSSID indicates spoofing,
    while an unenrolled fingerprint indicates a rogue emitter. Either is a hardening failure near sensitive
    assets. References: [Convolutional neural network based evil twin attack detection](https://doi.org/10.1051/matecconf/202133608006),
    [RF Fingerprinting of Bluetooth, Rusins and Nesenbergs](https://arxiv.org/abs/2402.06250).'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR tx IN emitters_near(shielded_assets):\n    fp = cnn_phy_fingerprint(tx.preamble_iq)\n\
      \    enrolled = fingerprint_db.lookup(tx.claimed_identity)\n    IF enrolled IS NULL:\n        EMIT\
      \ alert('ROGUE_EMITTER', tx.location_id, fp)\n    ELIF cosine_distance(fp, enrolled) > spoof_threshold:\n\
      \        EMIT alert('EVIL_TWIN_SPOOF', tx.location_id, tx.claimed_identity, fp)"
- question: Which assets should be prioritized for shielding upgrades according to a risk-based Shielding
    Priority Score, and what drives each score?
  context: 'Remediation resources are finite, so the Harden tactic uses a classification or ranking model
    trained on asset criticality, mission function, location, and measured RF-threat exposure to produce
    a Shielding Priority Score that ranks assets for upgrades. The score must list its top-3 contributing
    features (for example: criticality tier, measured SE shortfall in dB, leakage-event rate) so engineers
    can act on it rather than trust a black box. The analyst uses the ranked list to sequence shielding
    work; high-scoring assets combine high mission value with measurable RF exposure and should be remediated
    first.'
  answer_sources:
  - Asset Inventory Database
  - Physical Security Audit Reports
  - RF Spectrum Analysis Reports
  - RF Spectrum Analyzer / SDR Sensor Telemetry
  - Shielding Certification Records
  - 'NAI: Data centers, Sensitive Compartmented Information Facilities (SCIFs), and wireless communication
    hubs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR asset IN critical_assets:\n    features = [asset.criticality_tier, asset.mission_function,\
      \ asset.location,\n               asset.measured_se_shortfall_db, asset.leakage_event_rate]\n  \
      \  score = shielding_priority_model.predict(features)\n    top3 = explain_top_features(shielding_priority_model,\
      \ features)\n    EMIT ranking(asset.asset_id, score, top3)\nORDER BY score DESC"
