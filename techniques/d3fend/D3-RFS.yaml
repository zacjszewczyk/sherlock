name: 'D3-RFS: RF Shielding'
id: 74925086-b5da-4964-acca-ffc8c7fffc17
description: Investigate whether critical assets are adequately protected by certified RF shielding and
  whether that shielding still performs to standard. This playbook helps an analyst enumerate Critical
  and Sensitive assets that lack certified RF-shielded enclosures or SCIF spaces, validate that shielding
  certifications are current and based on measured shielding effectiveness, and enforce band-specific
  attenuation floors. It guides the analyst through detecting signal leakage into or out of a supposedly
  RF-quiet zone, identifying decodable or periodic in-band emissions that indicate covert channels, maintaining
  a PHY-layer device allowlist for the zone, and quantifying attenuation performance from paired inside/outside
  spectrum sweeps. It also covers statistical baselining of the in-zone noise floor, trending of leakage
  incidents and failed re-certifications, and machine-learning approaches to spectrum anomaly detection,
  signal classification/attribution, rogue-emitter PHY fingerprinting, and risk-based remediation prioritization.
  The goal is to surface where RF-based attack surface exists and where remediation priority is highest,
  against both sophisticated external actors exploiting compromising emanations and routine threats.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
