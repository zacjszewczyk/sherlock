questions:
- question: Has any Windows Event 4670 (permissions on an object were changed) recorded a new ACE that
    grants write, modify, or full-control rights to a broad principal (Everyone S-1-1-0, Users S-1-5-32-545,
    Authenticated Users S-1-5-11) on a sensitive file, directory, registry key, service, or directory
    object?
  context: 'This is the deterministic floor for the Harden tactic: it directly measures whether configuration
    permissions are being weakened. Parse Windows Event ID 4670 and diff the Original vs. New Security
    Descriptor (SDDL), per the 4670 field schema in [4670(S): Permissions on an object were changed](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4670).
    Alert when a newly added ACE carries dangerous tokens (FA full-access, GA generic-all, GW generic-write,
    WD/WDAC=WriteDAC, WO=WRITE_OWNER) granted to a broad SID on a sensitive object. A positive result
    means a control surface was opened to non-privileged users, a precursor to tampering or escalation;
    this hardens against [File and Directory Permissions Modification (T1222)](https://attack.mitre.org/techniques/T1222/).
    Keep this rule deterministic; tune with an allowlist of known installer/admin principals rather than
    removing it. A negative result across the fleet supports that sensitive object permissions remain
    restricted.'
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nEVENTID=4670\n| parse OldSd, NewSd as SDDL\n| diff = NewSd - OldSd\n| where diff.ace.right\
      \ in (FA,GA,GW,WD,WDAC,WO)\n  AND diff.ace.trustee in (S-1-1-0, S-1-5-32-545, S-1-5-11)\n  AND ObjectName\
      \ in sensitive_object_list\n  AND diff.ace.trustee NOT in installer_admin_allowlist\n| alert"
- question: Do the current ACLs, ownership, and attributes of objects on the sensitive-object list deviate
    from their authorized known-good baseline security descriptor such that an unauthorized principal
    now holds write or modify rights?
  context: Hardening depends on a maintained, authorized baseline per the SecCM baseline and change-control
    doctrine of [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-128.pdf).
    Maintain an approved baseline security descriptor for each object on a predefined sensitive list, then
    periodically and in real time recompute current ACLs/ownership/attributes and alert on any deviation
    where an unauthorized principal holds write/modify. Use ACL-aware file-integrity monitoring such as
    [Wazuh syscheck](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html)
    to report who/what/when. A positive result reveals configuration drift away from the secured baseline;
    a negative result confirms enforced restriction. This catches changes missed by event-time detection
    (e.g., offline edits or events not logged).
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: FIM/Baseline pseudocode
    query: ">-\nfor obj in sensitive_object_list:\n  current = get_security_descriptor(obj)  # ACL, owner,\
      \ attributes\n  if current != baseline[obj]:\n    drift = diff(baseline[obj], current)\n    if any(ace.principal\
      \ NOT in authorized_principals AND ace.right in (write,modify,full)\n           for ace in drift.added):\n\
      \      alert(obj, drift, who, what, when)"
- question: Were any permission-weakening utilities executed (icacls/cacls/net/net1 with /grant, /setowner,
    or /inheritance:r; attrib -r; takeown; recursive takeown.exe /f /r; icacls /deny Everyone; or PowerShell
    Set-Acl) — especially against System32/Program Files paths by a non-admin SID?
  context: 'Adversaries frequently weaken permissions with living-off-the-land binaries rather than API
    calls. On Sysmon EID 1 / Windows 4688 process creation and PowerShell ScriptBlock (4104), alert on
    permission-modification LOLBins per the relevant Sigma rules: icacls/cacls/net with /grant, /setowner,
    /inheritance:r, attrib -r, and takeown per [File or Folder Permissions Modifications (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules-threat-hunting/windows/process_creation/proc_creation_win_susp_file_permission_modifications.yml);
    recursive takeown.exe /f /r per [Suspicious Recursive Takeown (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_takeown_recursive_own.yml);
    icacls /deny Everyone per [Use Icacls to Hide File to Everyone (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_icacls_deny.yml);
    and PowerShell Set-Acl -AclObject -Path per [Change Permission Via Set-Acl (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_set_acl.yml).
    Prioritize when the working path is System32 or Program Files and the actor is a non-admin SID, indicating
    likely defense weakening or persistence setup. A positive hit gives the exact command line and account
    for rapid triage.'
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      (EVENTID=1 OR EVENTID=4688 OR EVENTID=4104)

      | where Image in (icacls.exe,cacls.exe,net.exe,net1.exe,attrib.exe,takeown.exe,powershell.exe)

      | where CommandLine matches /(\/grant|\/setowner|\/inheritance:r|takeown|\/f \/r|\/deny.*Everyone|attrib.*-r|Set-Acl)/i

      | where TargetPath matches /(System32|Program Files)/ AND User NOT in admin_sids

      | alert'
- question: Has a service DACL or Active Directory directory-object DACL been rewritten to grant over-permissive
    rights (SERVICE_CHANGE_CONFIG/write to Everyone or Authenticated Users via Set-Service -SecurityDescriptorSddl,
    over-permissive AD rights via dsacls.exe, or service-registry-key permission probing under HKLM\SYSTEM\CurrentControlSet\Services)?
  context: Service and directory-object permissions are high-value escalation targets. Alert on Set-Service
    -SecurityDescriptorSddl rewriting a service DACL to grant SERVICE_CHANGE_CONFIG/write to Everyone
    or Authenticated Users per [Suspicious Service DACL Modification Via Set-Service (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_susp_service_dacl_modification_set_service.yml),
    on dsacls.exe granting over-permissive AD rights per [Over Permissive Permissions Granted Using Dsacls (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_dsacls_abuse_permissions.yml),
    and on read/permission probing of service registry keys under HKLM\SYSTEM\CurrentControlSet\Services\*
    per [Service Registry Key Permission Weakness Check (Sigma)](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_registry_permissions_weakness_check.yml).
    A weakened service DACL lets a low-privileged user reconfigure a service binary path for SYSTEM-level
    execution; over-permissive AD ACLs enable domain persistence/escalation. Positive results in the Harden
    context indicate the protective restriction on services or directory objects has been deliberately
    loosened.
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n(EVENTID=4104 AND ScriptBlock matches /Set-Service.*-SecurityDescriptorSddl/i\n   AND\
      \ ScriptBlock matches /(S-1-1-0|S-1-5-11).*(CC|WP|DC|RP)/)\nOR (Image=dsacls.exe AND CommandLine\
      \ matches /\\/G .*(GA|GW|WP|WD)/i)\nOR (EVENTID=4663 AND ObjectName matches /CurrentControlSet\\\
      \\Services/ AND AccessMask in (WriteDAC,WRITE_OWNER,ReadControl))\n| alert"
- question: Is the rate or volume of permission-change events (4670 and registry 4657) for any user, host,
    or object exceeding the statistical baseline (mean + k*sigma), indicating a bulk or campaign-style
    weakening of permissions?
  context: 'Beyond single events, bulk permission changes signal a campaign to weaken defenses or enable
    lateral movement. Aggregate permission-change events (4670 and registry 4657 per [4657(S): A registry
    value was modified](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4657))
    into time windows per user, host, and object; compute mean and standard deviation and alert on windows
    exceeding mean + k*sigma (start k=3, derive per-environment from a 30-90 day baseline), following [Finding
    Anomalies in Windows Event Logs Using Standard Deviation (Dwyer & Truta)](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    Capture the physics: Volume = count of ACE grants/full-control additions; Frequency = changes/min.
    A spike of broad-group grants in a short window is a strong indicator of automated or scripted defense
    weakening. A flat, within-baseline profile supports healthy restriction.'
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      EVENTID in (4670,4657)

      | bin time span=10m by User, Host, ObjectName

      | stats count as changes by bin, User, Host, ObjectName

      | eventstats mean(changes) as mu, stdev(changes) as sd by User, Host

      | where changes > mu + 3*sd

      | alert'
- question: Across the fleet, has a permission grant occurred that is first-seen or rare for its (object,
    granted-principal, granted-right) tuple — for example a Full-Control ACE for Users on a key that never
    previously held one?
  context: Rare or novel grants are strong anomaly signals against an established secure state. Maintain
    a fleet prevalence table of (object, granted-principal, granted-right) tuples over a rolling 90-day
    window and flag bottom-percentile or first-seen grants, using the SecCM continuous-monitoring baseline
    of [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-128.pdf)
    and ACL drift reporting from [Wazuh FIM](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html)
    as the reference state. A first-seen Full-Control grant to a broad principal on a previously locked-down
    object is exactly the kind of stealthy weakening that volume-based methods may miss. A positive result
    warrants verifying against change tickets; a negative result indicates the grant matches established
    norms.
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      EVENTID in (4670,4657)

      | eval tuple = ObjectName + "|" + GrantedPrincipal + "|" + GrantedRight

      | lookup prevalence_table tuple as seen_count window=90d

      | where seen_count == 0 OR percentile(seen_count) < 1

      | alert'
- question: Are there spikes in access-denied object-access attempts (Windows 4663 with WriteDAC/WRITE_OWNER
    masks) or failed registry writes (4657) that suggest an actor is probing for weak permissions before
    a successful change?
  context: 'Failures are distinct, valuable signals. Treat access-denied and failed-write events separately:
    baseline and alert on spikes in access-denied object-access attempts (Windows 4663 with WriteDAC/WRITE_OWNER
    masks, documented in [4663(S): An attempt was made to access an object](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663))
    and failed registry writes (4657). A burst of failures (State = fail) commonly precedes a successful
    permission change as an actor enumerates which objects they can rewrite. Correlate failure spikes
    with any subsequent success events from the same account/host. In the Harden context, repeated failures
    show the restriction is currently holding but is being actively tested.'
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      (EVENTID=4663 AND AccessMask in (WriteDAC,WRITE_OWNER) AND Status=fail)

      OR (EVENTID=4657 AND Status=fail)

      | bin time span=10m by SubjectUser, Host

      | stats count as fails by bin, SubjectUser, Host

      | eventstats mean(fails) as mu, stdev(fails) as sd by SubjectUser, Host

      | where fails > mu + 3*sd

      | alert + correlate with subsequent success(4670/4657) same actor/host'
- question: Which hosts or objects have a configuration-permission posture that is a statistical outlier
    from the fleet, based on features such as count of non-admin ACEs, Everyone/Users full-control flags,
    removed inherited ACEs, change frequency, and granted-principal rarity?
  context: Posture-level anomaly detection catches systems whose overall permission state has drifted,
    even without a single obvious event. Build a feature vector per host/object (count of non-admin ACEs,
    Everyone/Users full-control flags, inherited-ACE-removed flag, change frequency, granted-principal
    rarity) and score with an [Extended Isolation Forest](https://arxiv.org/pdf/1811.02141) to flag systems
    deviating from the fleet; this is more robust than brittle K-Means. The alert MUST surface the top-3 contributing features (e.g.,
    granted principal SID, object path, writing process) so an analyst can act. A high anomaly score identifies
    hosts whose hardening posture should be reviewed against baseline.
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: ML/Extended Isolation Forest pseudocode
    query: ">-\nfeatures = per_host_object_vector(\n  nonadmin_ace_count, everyone_users_fullcontrol_flag,\n\
      \  inherited_ace_removed_flag, change_frequency, granted_principal_rarity)\nmodel = ExtendedIsolationForest().fit(fleet_features)\n\
      scores = model.score(features)\nalert where score > threshold\n  include top_3_contributing_features(granted_sid,\
      \ object_path, writing_process)"
- question: Do the ordered per-host/session permission and registry change events contain operations that
    fall outside the top-g predicted next events of a learned sequence model, indicating out-of-order
    or novel ACL changes?
  context: 'Sequence modeling detects anomalous ordering and novel operations that point-in-time rules
    miss. Train an LSTM on ordered per-host/session permission and registry change events and flag operations
    outside the top-g predicted next events as out-of-order or novel ACL changes, per [DeepLog: Anomaly
    Detection from System Logs (Du et al.)](https://acmccs.github.io/papers/p1285-duA.pdf). Support online
    updates with operator feedback. Run this in parallel with the deterministic SDDL floor, never
    replacing it. A positive result highlights permission changes that break the host''s normal operational
    rhythm (e.g., an ACL edit with no preceding install activity), which often accompanies adversary tampering.
    Confirm with the underlying 4670/4657/4663 records.'
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: ML/LSTM sequence pseudocode
    query: ">-\nseq = ordered_events_per(host_or_session)  # 4670,4657,4663 tokens\nmodel = LSTM().train(historical_sequences)\n\
      for event in seq:\n  pred = model.predict_next(context)\n  if event NOT in top_g(pred):\n    alert(event,\
      \ context)  # out-of-order/novel ACL change\nmodel.update(operator_feedback)"
- question: Are there rare process->object WriteDAC/SetOwner provenance subgraphs (e.g., a non-admin or
    LOLBin process editing System32, registry, or service ACLs) when modeled as a provenance graph?
  context: 'Provenance-graph learning reconstructs the causal path of a permission-weakening attack. Apply
    provenance-graph learning to flag rare process->object WriteDAC/SetOwner subgraphs: edge-level temporal
    GNN scoring with attack-graph reconstruction via [KAIROS](https://tfjmp.org/publications/2024-sp.pdf),
    node-level GraphSAGE attribution of the offending entity via [ThreaTrace](https://arxiv.org/pdf/2111.04333),
    and self-supervised drift-tolerant masked graph autoencoders via [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).
    Surface
    the causal path (originating account -> process -> modified object) and top contributing nodes in
    the alert. A flagged subgraph showing a non-admin or LOLBin process editing a sensitive object''s
    ACL gives the analyst an end-to-end attack narrative for triage and scoping. This complements, not
    replaces, the deterministic detections.'
  answer_sources:
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - PowerShell ScriptBlock (Event ID 4104)
  - File Integrity Monitoring (ACL/attribute baseline)
  - 'NAI: Domain Controllers, critical application servers, and standard endpoint workstations; SACLs
    applied to sensitive file paths (System32, Program Files), policy/service registry hives (HKLM\SYSTEM\CurrentControlSet,
    HKLM\SOFTWARE\Policies), and privileged Active Directory objects.'
  range: Last 90 days
  queries:
  - technology: ML/Provenance-GNN pseudocode
    query: ">-\nG = build_provenance_graph(process_object_events)  # nodes=acct,proc,object\nedge_scores\
      \ = KAIROS_temporal_gnn(G)\nnode_attr = ThreaTrace_graphsage(G)\nrecon = MAGIC_masked_autoencoder(G)\n\
      for sg in rare_subgraphs(G, WriteDAC|SetOwner):\n  if anomalous(sg, edge_scores, recon):\n    alert(causal_path(account->process->object),\
      \ top_nodes(node_attr))"
