name: 'D3-SCP: System Configuration Permissions'
id: 6b20701e-0af0-45fb-afda-f32cf0642148
description: Investigate unauthorized or weakening changes to system configuration permissions across
  Windows endpoints, servers, Domain Controllers, and Active Directory objects. This playbook helps an
  analyst detect modifications to security descriptors (DACL/SACL) of sensitive files, directories, registry
  keys, services, and directory objects that grant write/modify/full-control rights to broad or non-administrative
  principals (Everyone S-1-1-0, Users S-1-5-32-545, Authenticated Users S-1-5-11), remove inherited ACEs,
  or seize ownership. It combines deterministic detection (SDDL diffing of Windows Event 4670, registry
  value tampering in 4657, WriteDAC/WRITE_OWNER access masks in 4663, permission-weakening LOLBin command
  lines, and known-good ACL baseline deviation) with statistical anomaly detection (change rate/volume,
  first-seen/rare grants, access-failure spikes) and machine-learning approaches (host posture outlier
  scoring, permission-change sequence modeling, and provenance-graph subgraph detection). Use it to assess
  how effectively system configuration permissions are restricted and to surface adversary attempts to
  weaken defenses, enable persistence, or facilitate privilege escalation and lateral movement.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
