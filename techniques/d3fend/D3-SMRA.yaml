name: 'D3-SMRA: Sender MTA Reputation Analysis'
id: 11b477c2-5791-4ff0-8bc9-aaf36a93e1f0
description: Investigate inbound mail infrastructure to characterize the reputation and trust level of
  sender Mail Transfer Agents (MTAs) and detect malicious email. This playbook helps an analyst examine
  inbound SMTP sessions and mail-gateway logs that expose sender-MTA identity (connecting IP, HELO/EHLO,
  envelope MAIL FROM, the Received relay chain), authentication verdicts (SPF/DKIM/DMARC), first-seen
  status, and anomalous behavior such as sending-volume spikes, byte ratios, recipient breadth, geographic
  spread, and failure rates that indicate risky mail infrastructure. It combines deterministic floors
  (blocklist hits, authentication failure and identifier misalignment, first-seen MTAs with risky SMTP
  traits) with statistical baselining (volume, recipient breadth, failure-rate, spatio-temporal, and directed
  anomaly scoring) and machine-learning approaches (supervised reputation scoring, behavioral reputation
  for relayed/internal mail, unsupervised outlier detection, and an LLM rationale layer) so an analyst
  can rate each sender MTA as unrated, neutral, trusted, suspicious, or malicious and act accordingly.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any inbound SMTP session connect from, or relay through, an IP that appears on an approved
    deny list or threat-intelligence blocklist?
  context: This is the deterministic detection floor for the Detect tactic. For every inbound SMTP session,
    extract the connecting MTA IP and every relay IP found in the Received chain (RFC 5321) and compare
    them against curated deny lists and threat-intelligence blocklists. An exact match is a high-confidence
    indicator that the sender MTA is malicious, so the alert should include the HELO string, the sending
    domain, and which specific hop matched. Treat blocklist hits as a non-deletable deterministic floor
    and run statistical/ML scoring in parallel rather than as a replacement, since blocklists give low
    false positives but incomplete coverage. A positive result warrants blocking/quarantine and message
    review; a negative result does not clear the sender and should fall through to behavioral scoring.
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for each smtp_session in smtp.log:
        ips = [session.orig_h] + parse_received_chain_ips(session.headers)
        for ip in ips:
          if ip in denylist or ip in ti_blocklist:
            alert(severity=high, mta_ip=ip, helo=session.helo, sender_domain=session.mailfrom_domain, matched_hop=ip)
  - technology: SIEM/Rule pseudocode
    query: |-
      INDEX=mail_gateway OR sourcetype=smtp
      | eval ip_list = mvappend(connecting_ip, received_chain_ips)
      | mvexpand ip_list
      | lookup threat_blocklist ip AS ip_list OUTPUT verdict
      | where verdict="blocklisted"
      | table _time, ip_list, helo, sender_domain, recipient
- question: Is any sender MTA delivering mail that fails SPF/DMARC for the domain it claims, or whose
    envelope MAIL FROM/HELO does not align with the header From?
  context: 'Authentication and alignment checks deterministically expose spoofing in support of the Detect
    tactic. Evaluate the connecting MTA against published policy: the SPF result for the connecting IP
    (RFC 7208) and DMARC identifier alignment/policy (RFC 7489). Alert when an MTA sends mail claiming
    a domain it is not authorized for (SPF fail combined with DMARC p=quarantine/reject), or when the
    envelope MAIL FROM/HELO (RFC 5321) does not align with the header From (RFC 5322). Normalize and re-parse
    headers to flag multiple or ambiguous From headers and trace-chain inconsistencies, since header-parsing
    discrepancies are routinely abused to bypass authentication. Because SPF/DKIM/DMARC are widely under-enforced,
    spoofed mail still gets delivered, so a fail/misalignment is a strong but not sole indicator; pair
    it with reputation scoring.'
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      INDEX=mail_gateway
      | eval spf_fail = (spf_result IN ("fail","softfail"))
      | eval dmarc_enforced = (dmarc_policy IN ("quarantine","reject"))
      | eval misaligned = (mailfrom_domain != header_from_domain) OR (helo_domain != mailfrom_domain)
      | eval ambiguous_from = (mvcount(header_from) > 1)
      | where (spf_fail AND dmarc_enforced AND dmarc_result="fail") OR misaligned OR ambiguous_from
      | table _time, connecting_ip, helo_domain, mailfrom_domain, header_from_domain, spf_result, dmarc_result
  - technology: Zeek/pseudocode
    query: |-
      for each smtp_session in smtp.log:
        if spf_lookup(session.orig_h, session.mailfrom_domain)=="fail" and dmarc_policy(session.mailfrom_domain) in ("quarantine","reject"):
          alert("auth_fail", session)
        if normalize(session.helo) != normalize(session.mailfrom_domain) or count_from_headers(session)>1:
          alert("identifier_misalignment", session)
- question: Are there MTAs first seen within the last 30 days that also exhibit risky SMTP traits such
    as missing/malformed HELO, no PTR/FCrDNS, or repeated SMTP negotiation errors?
  context: 'Newly observed senders with poor SMTP hygiene are low-trust and a priority for the Detect
    tactic. Flag MTAs first seen within the last 30 days that also display risky traits: missing or malformed
    HELO/EHLO, a HELO domain not aligning with MAIL FROM, no PTR record or no forward-confirmed reverse
    DNS (FCrDNS), or repeated SMTP errors during negotiation (RFC 5321). Reputation features such as length
    of interaction with the enterprise and number of sending domains drive trust, so short-history MTAs
    should be weighted as lower trust. A positive result (recent first-seen plus multiple risky traits)
    marks the MTA as suspicious and warrants tighter scrutiny or quarantine; an established MTA with clean
    traits is lower risk.'
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      INDEX=mail_gateway earliest=-90d
      | stats min(_time) AS first_seen, count AS sessions, values(helo) AS helos by connecting_ip
      | eval is_first_seen = (first_seen > relative_time(now(),"-30d"))
      | eval risky = (helo_missing OR helo_malformed OR no_ptr OR no_fcrdns OR smtp_error_count>3)
      | where is_first_seen AND risky
      | table connecting_ip, first_seen, helos, no_ptr, smtp_error_count
  - technology: Zeek/pseudocode
    query: |-
      for each mta in seen_mtas:
        if first_seen(mta) > now()-30d:
          traits = check(helo_missing_or_malformed(mta), !ptr_exists(mta), !fcrdns_ok(mta), smtp_errors(mta)>3, helo!=mailfrom)
          if count_true(traits) >= 1: alert("first_seen_risky_mta", mta, traits)
- question: Has any sender MTA's inbound message count or byte volume spiked above its own 30-day baseline?
  context: Sudden volume spikes from a single MTA can indicate spam campaigns or compromised infrastructure,
    a key behavioral signal for the Detect tactic. Maintain a 30-day rolling per-MTA baseline of both
    inbound message count and total byte volume. Alert when the daily message count or total bytes exceeds
    the 95th percentile of that sender's history, or when a robust median/MAD-based modified Z-score exceeds
    3.5 (which resists distortion from naturally bursty senders). Derive dataset-specific thresholds from
    your own gateway logs and recompute weekly so the baseline tracks legitimate growth. A spike on a
    low-trust or first-seen MTA is more concerning than on a long-established trusted sender.
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      INDEX=mail_gateway earliest=-30d
      | bin _time span=1d
      | stats count AS msgs, sum(bytes) AS total_bytes by connecting_ip, _time
      | eventstats median(msgs) AS med, p95(msgs) AS p95 by connecting_ip
      | eval mad = abs(msgs-med)
      | eventstats median(mad) AS mad_med by connecting_ip
      | eval mod_z = 0.6745*(msgs-med)/mad_med
      | where msgs > p95 OR mod_z > 3.5
      | table _time, connecting_ip, msgs, total_bytes, mod_z
- question: Is any sender MTA contacting an unusually large number of distinct enterprise recipients within
    a short window compared to its history?
  context: Recipient breadth (fan-out) is among the strongest network-level predictors of malicious senders
    for the Detect tactic. Track the number of distinct recipients each MTA contacts per 1-hour window.
    Alert when an MTA exceeds the 99th percentile (or a modified Z-score > 3.5) of its historical recipient
    breadth, which indicates spam bursts or compromised infrastructure blasting the enterprise. Co-recipient
    spread and recipient count are available at connection time without content inspection. A sharp breadth
    anomaly on a first-seen or low-trust MTA strongly suggests a campaign; established newsletters and
    legitimate bulk senders should be baselined to avoid false positives.
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      INDEX=mail_gateway earliest=-30d
      | bin _time span=1h
      | stats dc(recipient) AS distinct_rcpts by connecting_ip, _time
      | eventstats median(distinct_rcpts) AS med, p99(distinct_rcpts) AS p99 by connecting_ip
      | eventstats median(abs(distinct_rcpts-med)) AS mad by connecting_ip
      | eval mod_z = 0.6745*(distinct_rcpts-med)/mad
      | where distinct_rcpts > p99 OR mod_z > 3.5
      | table _time, connecting_ip, distinct_rcpts, mod_z
- question: Has any sender MTA's authentication or delivery failure ratio risen above its rolling baseline?
  context: Failure-mode awareness treats error rates as a distinct reputation signal for the Detect tactic.
    Profile each MTA's SPF softfail/fail ratio (RFC 7208), DMARC fail ratio (RFC 7489), NXDOMAIN/no-PTR
    on HELO or reverse DNS, and 4xx/5xx/blocked-connection counts. Alert when an MTA's failure ratio exceeds
    its rolling baseline using median/MAD with a modified Z-score > 3.5. Seed domain/MTA trust priors
    from population authentication-adoption baselines so MTAs from well-configured domains start higher.
    A rising failure ratio suggests spoofing attempts, misconfiguration, or compromise; a consistently
    clean ratio supports a higher trust rating.
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      INDEX=mail_gateway earliest=-30d
      | bin _time span=1d
      | stats count AS total, count(eval(spf_result IN("fail","softfail"))) AS spf_fail, count(eval(dmarc_result="fail")) AS dmarc_fail, count(eval(smtp_code>=400)) AS smtp_err by connecting_ip, _time
      | eval fail_ratio = (spf_fail+dmarc_fail+smtp_err)/total
      | eventstats median(fail_ratio) AS med, median(abs(fail_ratio-med)) AS mad by connecting_ip
      | eval mod_z = 0.6745*(fail_ratio-med)/mad
      | where mod_z > 3.5
      | table _time, connecting_ip, fail_ratio, mod_z
- question: Do any messages show anomalous spatio-temporal features such as large geodesic distance between
    sender IP and recipient, unusual co-recipient distance, off-hours arrival, or atypical size/recipient
    count?
  context: 'Lightweight spatio-temporal features support reputation scoring for the Detect tactic without
    content inspection. For each message compute: geodesic distance between the sender IP geolocation
    and the recipient, distance to the k nearest co-recipients of the same IP, time-of-day of arrival,
    message size, and recipient count. Alert on MTAs deviating from both their own and population baselines.
    These features are available at connection time and are strong network-level predictors of malicious
    mail. Anomalies across several axes (e.g., distant geography plus off-hours plus high recipient count)
    raise confidence that the sending MTA is suspicious.'
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      INDEX=mail_gateway earliest=-90d
      | iplocation connecting_ip
      | eval geo_dist = geodist(sender_lat,sender_lon,recipient_lat,recipient_lon)
      | eval hour = strftime(_time,"%H")
      | stats avg(geo_dist) AS avg_dist, values(hour) AS hours, avg(bytes) AS avg_size, avg(recipient_count) AS avg_rcpt by connecting_ip
      | eventstats avg(avg_dist) AS pop_dist, stdev(avg_dist) AS pop_sd
      | eval z = (avg_dist-pop_dist)/pop_sd
      | where z > 3.5 OR avg_rcpt > pop_rcpt_threshold
      | table connecting_ip, avg_dist, hours, avg_size, avg_rcpt, z
- question: When first-seen sender MTAs and domains are ranked by Directed Anomaly Scoring at a fixed
    daily alert budget, which rise to the top?
  context: Directed Anomaly Scoring (DAS) produces operator-tractable alert volume at high recall for
    the Detect tactic. DAS flags events that are more suspicious than all benign events along chosen axes
    (first-seen age, recipient unlikelihood, URL-click reputation) and selects the most suspicious events
    up to a fixed daily alert budget. Apply it to first-seen or previously-unknown sender MTAs and sender
    domains on first-party mail logs. This keeps the alert queue bounded while surfacing the riskiest
    new senders. Top-ranked first-seen senders should be triaged first; the fixed budget makes the workload
    predictable for the SOC.
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      INDEX=mail_gateway earliest=-90d
      | where is_first_seen="true"
      | eval susp_score = w1*first_seen_recency + w2*recipient_unlikelihood + w3*url_click_reputation
      | sort - susp_score
      | head DAILY_ALERT_BUDGET
      | table connecting_ip, sender_domain, susp_score, first_seen_recency, recipient_unlikelihood
- question: What risk score does a supervised reputation model assign to each sender MTA, and which features
    drive that score?
  context: 'A supervised classifier operationalizes MTA reputation rating for the Detect tactic. Train
    a model (e.g., RuleFit or random forest) on first-party features: first-seen age, HELO/MAIL FROM consistency,
    SPF/DMARC fail ratio, historical volume/byte deviation, recipient breadth, spatio-temporal features,
    and blocklist hits, to score new MTAs in near real time. Surface the top-3 contributing features in
    each alert for explainability and fuse interpretable per-module scores adapted per organization. Keep
    the deterministic blocklist and authentication-failure rules in parallel as the floor. A high model
    score with intelligible contributing features (e.g., new MTA + high fail ratio + volume spike) is
    strong evidence the sender should be rated suspicious or malicious.'
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [first_seen_age, helo_mailfrom_consistency, spf_dmarc_fail_ratio,
                  volume_byte_deviation, recipient_breadth, spatio_temporal, blocklist_hits]
      model = RandomForest.train(labeled_mta_history)
      for mta in inbound_mtas:
        score = model.predict_proba(features(mta))
        if score > THRESHOLD:
          alert(mta, score, top3=model.feature_importance(features(mta)))
- question: For relayed/forwarded and internally-originated mail that bypasses SPF/DKIM, what behavioral
    model risk emerges from recipient-profile and URL-reputation anomalies?
  context: Relayed, forwarded, and internally-originated mail bypasses SPF/DKIM, leaving a gap the Detect
    tactic must close with behavior. Train a behavioral model (random forest) on recipient-profile anomaly
    (how far the recipient set deviates from the sender's historical contacts), local and global URL reputation,
    and identity features computed entirely from internal mail logs, to score sender/relay-MTA risk at
    a very low false-positive rate. This catches compromised internal accounts and abused relays that
    authentication cannot. A high behavioral score where a sender suddenly contacts an unusual recipient
    set or includes low-reputation URLs indicates likely compromise or lateral phishing.
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      for mail in relayed_or_internal_mail:
        rcpt_anomaly = deviation(mail.recipients, sender_historical_contacts(mail.sender))
        url_rep = min(local_url_reputation(mail.urls), global_url_reputation(mail.urls))
        ident = identity_features(mail.sender)
        score = rf_behavioral.predict([rcpt_anomaly, url_rep, ident])
        if score > THRESHOLD: alert(mail.sender, score)
- question: Where spam labels are scarce, which sender MTAs rank as outliers under an Extended Isolation
    Forest over per-MTA feature vectors?
  context: When labeled spam data is scarce, unsupervised outlier detection still supports the Detect
    tactic. Score per-MTA feature vectors (first-seen age, daily volume/byte deviation, recipient breadth,
    SPF/DMARC fail ratio, geographic spread, message-size variance) with an Extended Isolation Forest
    to rank anomalous sending MTAs without labels. Path-length-based scores order the alerts, and the
    most-deviating features are reported for triage. This complements supervised scoring and catches novel
    campaigns. MTAs with the shortest isolation path lengths (most anomalous) should be reviewed first,
    with the reported deviating features guiding the analyst.
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = per_mta_features(first_seen_age, volume_byte_deviation, recipient_breadth,
                           spf_dmarc_fail_ratio, geo_spread, msg_size_variance)
      eif = ExtendedIsolationForest.fit(X)
      scores = eif.anomaly_score(X)
      for mta, s in sort_desc(scores):
        if s > THRESHOLD: alert(mta, s, deviating_features=top_features(mta))
- question: For high-scoring messages, what natural-language rationale does an LLM produce naming the
    specific suspicious indicators in the headers and body?
  context: 'An LLM rationale layer improves analyst triage and explainability for the Detect tactic. For
    messages that score high under the rules/statistics/ML pipeline, pass the parsed headers (sending
    MTA, HELO, auth results, Received chain) and the body to an LLM that emits a natural-language rationale
    naming the specific indicators: suspicious sending domain/MTA, authentication misalignment, lookalike
    domain, or urgency/brand impersonation, rather than an opaque score. This supports explainable review
    and faster, more confident analyst decisions. The rationale should corroborate the deterministic and
    statistical findings; if the LLM cannot name concrete indicators, the alert may warrant downgrading.'
  answer_sources:
  - Zeek smtp.log
  - Mail Gateway Logs
  - SPF/DKIM/DMARC Verdicts
  - DMARC Aggregate Reports
  - Threat Intelligence Blocklists
  - 'NAI: Email Gateway and Network Perimeter'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      for msg in high_scoring_messages:
        context = parse(msg.headers: sending_mta, helo, auth_results, received_chain) + msg.body
        rationale = LLM.explain(context, ask="name suspicious indicators: domain/MTA, auth misalignment, lookalike domain, impersonation")
        attach_to_alert(msg, rationale)
