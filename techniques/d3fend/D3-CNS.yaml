name: 'D3-CNS: Content Substitution'
id: e00bbb71-a1d4-41c3-a731-422cfbef335d
description: Investigate the effectiveness and integrity of Content Substitution (Content Disarm and Reconstruction)
  controls that isolate endpoints from malicious content by replacing risky inbound/outbound artifacts
  in transit with approved benign substitutes. This playbook helps an analyst confirm that gateway telemetry
  shows risky content was actually replaced (new distinct hash, policy tag, per-item disarm decisions),
  that the original risky payload never executed on the endpoint, that delivered substitutes are structurally
  clean against a known-good baseline, and that pre-substitution inspection correctly identifies dangerous
  embedded code. It surfaces both failure modes — missed detections / substitution bypass (false negatives)
  and over-blocking (false positives) — using deterministic structural rules, statistical byte/entropy
  and volume models, and explainable ML classifiers across email gateways, secure web proxies, file-transfer
  gateways, CDR/sanitization services, and endpoints.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: When risky content (high-risk extensions/MIME types such as application/x-msdownload, application/x-dosexec,
    macro-enabled Office, PDF, or ZIP) traverses SMTP/HTTP, does the original transferred object ever
    execute on the destination endpoint within minutes of delivery?
  context: 'Tied to the Isolate tactic, Content Substitution is supposed to neutralize risky artifacts
    in transit so the original never reaches or runs on an endpoint. Monitor Zeek files.log for high-risk
    extensions/MIME types over SMTP/HTTP and record the original object''s md5/sha256, then correlate
    the destination host and timestamp with process-creation telemetry (Windows Event ID 4688). A process
    name, file path, or hash matching the original transferred object executing within ~5 minutes of delivery
    indicates the substitution control failed or was bypassed — a critical negative result. No matching
    execution after delivery is the expected positive (isolated) outcome. Sources: [Zeek files.log](https://docs.zeek.org/en/master/logs/files.html);
    [Windows Event ID 4688 / NSA Mitigating Web Shells](https://github.com/nsacyber/Mitigating-Web-Shells).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Email security gateway logs
  - Secure web proxy logs
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, Email security gateways, Secure web proxies, User endpoints'
  range: 'Last 90 days (event-centered: ±10 minutes around each delivery to catch fast execution)'
  queries:
  - technology: Zeek/pseudocode
    query: '>-

      FROM files.log WHERE mime_type IN (''application/x-msdownload'',''application/x-dosexec'',

      ''application/vnd.ms-office'',''application/pdf'',''application/zip'')

      AND proto IN (''smtp'',''http'') EMIT (dst_host, ts, md5, sha256, filename)'
  - technology: SIEM/Rule pseudocode
    query: '>-

      JOIN zeek_files f WITH win_4688 p ON p.host = f.dst_host

      WHERE (p.image_hash = f.sha256 OR p.image_name = f.filename)

      AND p.ts BETWEEN f.ts AND f.ts + 5m

      ALERT ''Original risky object executed post-delivery — substitution bypass'''
- question: For every blocked/quarantined risky transfer, is there a corresponding benign substitute artifact
    with a NEW distinct hash, a policy identifier, and per-item disarm decisions recorded in gateway telemetry?
  context: 'Following the disarm-and-rebuild model in the OPSWAT CDR patent, a genuine substitution must
    produce (a) a benign replacement event whose hash differs from the original risky object, (b) a policy/rule
    identifier explaining why, and (c) per-item disarm decisions. The analyst is verifying that blocking
    is paired with actual substitution rather than silent dropping or, worse, passing the original through.
    Alert on any blocked/quarantined content lacking a substitution artifact, lacking a policy tag, or
    where the delivered hash EQUALS the original risky-object hash (meaning no real substitution happened).
    A clean pairing of original→distinct substitute with policy tag is the positive result. Sources: [OPSWAT
    CDR patent — Method For Content Disarm and Reconstruction](https://patentimages.storage.googleapis.com/a9/40/78/713c8deb2c4c7a/US20190268352A1.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Email security gateway logs
  - Secure web proxy logs
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, Email security gateways, Secure web proxies, User endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nFROM gateway_logs WHERE action IN ('block','quarantine')\nWHERE missing(substitute_hash)\
      \ OR missing(policy_id)\n   OR substitute_hash == original_hash\nALERT 'Blocked transfer without\
      \ valid substitution (no artifact/policy or identical hash)'"
- question: 'Do delivered/substituted artifacts match the approved sanitized baseline for their file type,
    and are they free of dangerous residual structures (e.g., for PDFs: /JavaScript, /OpenAction, /Launch,
    /EmbeddedFile)?'
  context: 'Applying the known-good file-comparison approach from NSA Mitigating Web Shells, compare each
    served/substituted artifact against the approved sanitized baseline for its type. The analyst confirms
    the reconstructed file is structurally clean: any divergence from the known-good baseline, or any
    remaining dangerous structure detectable via PDFInspect tag analysis, means the disarm step left exploitable
    content behind. A delivered substitute that exactly conforms to the sanitized baseline and contains
    none of the dangerous tags is the positive result; presence of /JavaScript, /OpenAction, /Launch,
    or /EmbeddedFile after substitution is a failure. Sources: [NSA Mitigating Web Shells](https://github.com/nsacyber/Mitigating-Web-Shells);
    [PDFInspect](https://arxiv.org/abs/2601.12866).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Email security gateway logs
  - Secure web proxy logs
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, Email security gateways, Secure web proxies, User endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nFOR EACH delivered_file d:\n  baseline = known_good_baseline[d.type]\n  IF structural_diff(d,\
      \ baseline) != EMPTY\n     OR contains_tags(d, ['/JavaScript','/OpenAction','/Launch','/EmbeddedFile'])\n\
      \  THEN ALERT 'Substitute diverges from sanitized baseline or retains dangerous structure'"
- question: Has the diversity of content types delivered after substitution dropped sharply, suggesting
    over-substitution that is disrupting legitimate workflows?
  context: 'Over a rolling 30-day window, model the MIME-type distribution by protocol from Zeek files.log
    and compute daily Shannon entropy of that distribution. A drop greater than 2 standard deviations
    below the per-protocol baseline mean indicates the control may be over-substituting legitimate content
    (a false-positive / availability failure). Derive the baseline mean and sigma from your own 30-day
    history per protocol rather than a fixed global value. Stable entropy within bounds is the positive
    result; a sudden collapse in type diversity warrants reviewing recently tightened substitution policies.
    Sources: [Zeek files.log](https://docs.zeek.org/en/master/logs/files.html).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Email security gateway logs
  - Secure web proxy logs
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, Email security gateways, Secure web proxies, User endpoints'
  range: Last 30 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      FROM files.log BUCKET by day, proto

      COMPUTE H = shannon_entropy(mime_type_distribution)

      baseline_mu, baseline_sigma = mean,std of H over prior 30d per proto

      ALERT WHEN H < baseline_mu - 2*baseline_sigma  // over-substitution'
- question: What are the per-channel substitution coverage, downstream endpoint execution-residual rate,
    and explicit failure rates (blocked transfers, quarantine errors, CDR parser failures, 4xx/5xx on
    proxy delivery), and are any degrading over time?
  context: 'Following the per-item accept/neutralize accounting in the OPSWAT CDR patent, compute by business
    unit and channel: substitution coverage (risky transfers replaced / risky transfers observed), the
    residual rate of original payloads that still executed on endpoints, and explicit failure rates including
    parser/CDR-engine failures and proxy 4xx/5xx errors — each with confidence intervals. Sustained coverage
    degradation, a rising parser-failure rate (which creates silent-bypass exposure), or unusually high
    post-substitution execution residuals all signal control regression. High coverage with low residual
    and stable failure rates is the healthy positive state. Sources: [OPSWAT CDR patent — Method For Content
    Disarm and Reconstruction](https://patentimages.storage.googleapis.com/a9/40/78/713c8deb2c4c7a/US20190268352A1.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Email security gateway logs
  - Secure web proxy logs
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, Email security gateways, Secure web proxies, User endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nGROUP BY channel, business_unit:\n  coverage = replaced / observed_risky\n  residual =\
      \ post_sub_executions / replaced\n  failure  = (blocked_err + quarantine_err + parser_fail + http_4xx_5xx)\
      \ / total\n  emit each with 95% CI\nALERT on coverage downtrend OR parser_fail uptrend OR residual\
      \ spike"
- question: Do the byte/entropy fingerprints of delivered substitutes match the clean-substitute baseline
    for their file type and CDR template, or do they show residual payload / failed reconstruction?
  context: 'Using signal/statistical features from HAPSSA (byte n-gram statistics, file entropy, byte-histogram
    texture), build a clean-substitute fingerprint per file type and per CDR template, then compare each
    delivered substitute against it. A substitute whose entropy exceeds the 99th percentile of known-clean
    substitutes, or whose byte-histogram texture deviates from the template, indicates residual payload
    survived or reconstruction failed. Fingerprints within the clean envelope are the positive result;
    outliers should be quarantined and the CDR template reviewed. Sources: [HAPSSA](https://arxiv.org/abs/2111.04703).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Email security gateway logs
  - Secure web proxy logs
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, Email security gateways, Secure web proxies, User endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nFOR EACH substitute s:\n  feat = [byte_ngram_stats(s), entropy(s), byte_histogram_texture(s)]\n\
      \  clean = baseline[s.type][s.cdr_template]\n  IF entropy(s) > p99(clean.entropy) OR distance(feat,\
      \ clean.centroid) > threshold\n  THEN ALERT 'Substitute byte/entropy fingerprint deviates from clean\
      \ baseline'"
- question: After deploying substitution policy, does observed traffic volume, frequency, or periodicity
    toward known-malicious / low-reputation destinations exceed forecast bounds, signaling control regression
    or bypass?
  context: 'Train a time-series forecasting model on Zeek conn.log byte counts (orig_bytes/resp_bytes)
    and connection frequency toward known-malicious or low-reputation destinations, complemented by beaconing/long-connection
    scoring from RITA and temporal per-flow features (Single Flow Time Series). When observed volume/frequency/periodicity
    exceeds the forecast confidence band after the substitution control was deployed, it suggests the
    control regressed or is being bypassed (e.g., content reaching the endpoint and beaconing out). Include
    the top-3 contributing features (destination, byte volume, inter-arrival regularity) in the alert.
    Traffic staying within forecast is the positive result. Sources: [Zeek conn.log](https://docs.zeek.org/en/master/logs/files.html);
    [RITA](https://github.com/activecm/rita); [Single Flow Time Series](https://dl.acm.org/doi/abs/10.5555/3581644.3581681)
    ([code](https://github.com/koumajos/ClassificationBasedOnSFTS), [data](https://zenodo.org/records/8035724)).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Email security gateway logs
  - Secure web proxy logs
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, Email security gateways, Secure web proxies, User endpoints'
  range: Last 90 days (compare pre/post substitution-policy deployment)
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      model = forecast_timeseries(conn.log[orig_bytes,resp_bytes,conn_freq] -> bad_dst)

      score = beacon_score(RITA) + sfts_features(flow)

      ALERT WHEN observed > model.upper_ci OR periodicity_anomaly

      INCLUDE top3_features(destination, byte_volume, inter_arrival_regularity)'
- question: Does any PDF/Office/image/model artifact bypass substitution while containing dangerous embedded
    code reachable by sound static analysis (e.g., embedded JavaScript reaching dangerous sinks, appended/steganographic
    image data, or serialized model payloads)?
  context: 'Tied to the Isolate tactic''s inspection step, apply sound static analysis to every artifact
    entering the substitution pipeline. Use SAFE-PDF abstract interpretation to detect embedded JavaScript
    that reaches dangerous sinks without executing it, and Open Image CDR / Zero-Trust AI CDR checks for
    appended/steganographic data in images and serialization payloads in model files. The analyst verifies
    the inspector flags these for disarm BEFORE delivery. Alert if any artifact bypasses substitution
    while still containing these structures — a missed-detection (false negative). Correct flagging and
    disarm of such artifacts is the positive result. Sources: [SAFE-PDF](https://arxiv.org/abs/1810.12490);
    [Open Image CDR](https://arxiv.org/abs/2307.14057); [Zero-Trust AI CDR](https://arxiv.org/abs/2503.01758).'
  answer_sources:
  - Zeek files.log
  - CDR/sanitization engine logs
  - Email security gateway logs
  - Secure web proxy logs
  - 'NAI: Email security gateways, Secure web proxies, File upload/transfer gateways, CDR/sanitization
    services'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nFOR EACH artifact a IN substitution_pipeline:\n  IF (a.type=='pdf' AND safe_pdf_reaches_dangerous_sink(a))\n\
      \     OR (a.type=='image' AND appended_or_stego_data(a))\n     OR (a.type=='model' AND serialized_payload(a))\n\
      \  AND a.substituted == FALSE\n  THEN ALERT 'Dangerous embedded code bypassed substitution'"
- question: Are high-risk structural paths and dangerous tags (any /OpenAction, /Launch, /AA, /JavaScript,
    /EmbeddedFile, OLE/OOXML macro streams, or object-count inconsistencies) reliably triggering disarm
    whenever present above zero?
  context: 'Apply Hidost structural-path rules and PDFInspect tag counts as a deterministic floor: treat
    presence above zero of any high-risk structure as a mandatory disarm trigger, cross-referencing the
    abused-object catalog in the PDF-Malware overview. The analyst confirms the control never lets such
    structures pass. A positive result is that every artifact containing these tags/macros/inconsistencies
    was disarmed; any passthrough above the zero threshold is a deterministic failure that must be alerted.
    Sources: [Hidost](https://jis-eurasipjournals.springeropen.com/articles/10.1186/s13635-016-0045-0)
    ([code](https://github.com/srndic/hidost)); [PDFInspect](https://arxiv.org/abs/2601.12866); [PDF-Malware
    overview](https://arxiv.org/abs/2107.12873).'
  answer_sources:
  - Zeek files.log
  - CDR/sanitization engine logs
  - Email security gateway logs
  - Secure web proxy logs
  - 'NAI: Email security gateways, Secure web proxies, File upload/transfer gateways, CDR/sanitization
    services'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nFOR EACH artifact a:\n  tags = count_structural_paths(a, ['/OpenAction','/Launch','/AA','/JavaScript','/EmbeddedFile'])\n\
      \         + macro_streams(a) + object_count_inconsistencies(a)\n  IF tags > 0 AND a.disarmed ==\
      \ FALSE\n  THEN ALERT 'High-risk structure passed without disarm (deterministic trigger)'"
- question: Has the arrival volume of risky-typed artifacts spiked, or have CDR parser-failure / unsupported-format
    passthrough rates risen, in a way that could overwhelm the substitution control or create silent-bypass
    exposure?
  context: From Zeek files.log and CDR engine logs, baseline the per-channel count/minute of risky-typed
    artifacts and the rate of CDR parser failures or unsupported-format passthroughs. Alert on volume
    spikes greater than 3σ over the rolling baseline that may overwhelm the substitution control, and
    on rising passthrough/parser-failure rates that let risky content slip through un-disarmed (silent
    bypass). Stable arrival volume and low, flat parser-failure/passthrough rates are the positive result;
    surges or rising failure rates demand capacity and engine-health review.
  answer_sources:
  - Zeek files.log
  - CDR/sanitization engine logs
  - Email security gateway logs
  - Secure web proxy logs
  - 'NAI: Email security gateways, Secure web proxies, File upload/transfer gateways, CDR/sanitization
    services'
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nFROM files.log + cdr_logs GROUP BY channel, minute:\n  risky_rate = count(risky_typed)\n\
      \  fail_rate  = (parser_failures + unsupported_passthrough) / total\n  baseline = rolling mean,std\n\
      ALERT WHEN risky_rate > mu + 3*sigma OR fail_rate trending up"
- question: Do explainable structural/byte-level ML classifiers flag any artifact as malicious that was
    NOT substituted, and what are the top contributing features?
  context: 'Run interpretable structural classifiers in parallel with the deterministic rules to catch
    novel/obfuscated payloads. Use MLPdf (MLP over object/stream counts and dangerous keywords) and Hidost
    for explainable structural scoring, plus byte-level detectors (Detecting Malicious PDF Using CNN,
    PDFInspect) for signature-independent coverage. Surface the top-3 contributing features (e.g., /JS
    count, stream entropy, object density) in the alert and escalate any artifact scored malicious that
    was NOT substituted — a missed detection. Keep the deterministic floor rules in parallel to counter
    mimicry/reverse-mimicry evasion noted in the PDF-Malware overview. The positive result is that ML-flagged
    malicious artifacts were all disarmed. Sources: [MLPdf](https://arxiv.org/abs/1808.06991); [Hidost](https://jis-eurasipjournals.springeropen.com/articles/10.1186/s13635-016-0045-0);
    [Detecting Malicious PDF Using CNN](https://arxiv.org/abs/2007.12729); [PDFInspect](https://arxiv.org/abs/2601.12866);
    [PDF-Malware overview](https://arxiv.org/abs/2107.12873).'
  answer_sources:
  - Zeek files.log
  - CDR/sanitization engine logs
  - Email security gateway logs
  - Secure web proxy logs
  - 'NAI: Email security gateways, Secure web proxies, File upload/transfer gateways, CDR/sanitization
    services'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nFOR EACH artifact a:\n  score = ensemble(MLPdf(a), Hidost(a), pdf_cnn(a), pdfinspect(a))\n\
      \  IF score == MALICIOUS AND a.substituted == FALSE\n  THEN ALERT 'ML flagged malicious artifact\
      \ not substituted'\n       INCLUDE top3_features(/JS_count, stream_entropy, object_density)"
