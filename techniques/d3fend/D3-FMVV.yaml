name: 'D3-FMVV: File Metadata Value Verification'
id: 10c2a6e4-95ff-4231-9262-f62012650a10
description: Investigate files whose declared identity (filename extension and/or MIME type) conflicts
  with their actual content as determined by leading magic-byte signatures and internal format structure.
  This playbook helps an analyst detect masquerading — for example an executable or script hiding behind
  a user-trusted extension such as .jpg, .docx, or .txt — by combining deterministic signature/hash verification
  (the non-negotiable floor) with statistical rarity scoring and content-based machine-learning classifiers
  running in parallel. It correlates on-the-wire telemetry (Zeek files.log/conn.log) with endpoint write
  and process-creation events (Sysmon Event ID 11 and 1), tracks Capture Volume (byte counts, seen-vs-missing
  ratios), Frequency (mismatches per minute per source), and State (transfer success/blocked, validation
  pass/fail) so that failed, blocked, and partial artifacts are treated as distinct evasion signals and
  isolated before execution.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there files crossing the network or written to disk whose declared filename extension
    or MIME type contradicts the file type inferred from its leading magic bytes (for example, a .jpg
    or .docx name carrying a PE / application/x-dosexec signature)?
  context: This is the deterministic floor of the playbook. Zeek derives files.log `mime_type` from leading
    bytes independent of the filename, so any disagreement between the on-the-wire/declared extension
    and the content-sniffed type is a strong masquerade indicator. Validate the expected header (and trailer
    where applicable) bytes against an authoritative file-signature table (filesig.search.org). A positive
    result — name/extension says one thing, magic bytes say another — is a classic sign of a spoofed file
    disguised to evade user and tool trust. Keep this magic-byte lookup as the non-negotiable baseline;
    tune the allowlist rather than disabling it. This directly supports the Isolate tactic by enabling
    pre-execution quarantine of mismatched files.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log | for each file:\n  declared = ext_from(filename or url)\n  sniffed  = mime_type\
      \   # from leading magic bytes\n  if NOT consistent(declared, sniffed): alert 'extension-vs-mime\
      \ mismatch'\n  # cross-check header/trailer against authoritative signature table"
- question: For files that present a valid magic header, do they actually pass a format-specific structural
    validator (JPEG/MSOLE/ZIP object validation), and does a deep content classifier (Magika) confirm
    the inferred type with high confidence rather than returning an unrecognized, low-confidence, or high-entropy
    class?
  context: A correct leading magic number is necessary but not sufficient — attackers prepend a trusted
    header to an otherwise malformed or encrypted payload. Run Garfinkel-style fast object validation
    to confirm the bytes conform to the full format specification, and corroborate with Magika's content-based
    type prediction. Escalate when bytes carry a valid magic header but fail structural/spec validation,
    or when Magika returns an unrecognized/low-confidence or high-entropy result — both are hallmarks
    of a spoofed header or an encrypted/self-extracting payload hiding behind a trusted extension. Supports
    Isolate by catching disguised content the simple magic-byte check would pass.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each file with valid magic header:\n  if NOT structural_validate(file, format)       \
      \  -> alert 'valid header, failed spec'\n  pred, conf = magika(file_bytes)\n  if pred in {unknown,\
      \ low_confidence} OR entropy(file) high -> alert 'spoofed/encrypted payload'"
- question: Where executable or script signatures are hiding behind common user-trust extensions, can
    we correlate the Zeek file hash/MIME with the endpoint write event (Sysmon Event ID 11) to pinpoint
    the on-disk write path for rapid quarantine — including partial or aborted drops?
  context: This is the action-on-detection rule. When content sniffing shows an executable/script masquerading
    behind a benign extension, join the network observation (Zeek file SHA256 / mime_type) to the corresponding
    Sysmon Event ID 11 file-create event so you know exactly which host and path received the file and
    can quarantine it. Capture Volume (`total_bytes`) and transfer State (complete vs `missing_bytes`>0)
    so partial or aborted downloads are still flagged — an interrupted drop is still evidence. Maintain
    a SHA256 allowlist of known-good files per type as a deterministic suppressor to keep noise down.
    Directly enables the Isolate objective.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join Zeek files.log (mime_type in exec/script set) with Sysmon EID 11 on sha256/filename\n\
      \  if matched: record write_path, host; emit 'masquerading executable' -> quarantine\n  capture\
      \ total_bytes, state = (missing_bytes>0 ? partial : complete)\n  suppress if sha256 in known_good_allowlist[type]"
- question: On endpoints, does a running binary's authoritative embedded PE metadata (OriginalFileName
    / InternalName) disagree with its on-disk process name or extension, or does a trusted-named binary
    execute from a non-standard path?
  context: The PE header carries embedded OriginalFileName/InternalName values set at compile time that
    are far harder to alter than the on-disk filename. Using Sysmon Event ID 1 (process creation), alert
    when the embedded name disagrees with process.name/extension (a renamed utility), or when a trusted-named
    binary runs from an unusual directory (e.g., a system tool launching from a user temp folder), mirroring
    Elastic renamed-utility / masquerade rules. The embedded metadata is a reliable cross-check against
    a spoofed filename. A positive result indicates defense-evasion via renaming; supports Isolate by
    flagging the masqueraded process for containment.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "Sysmon EID 1 | for each process:\n  if OriginalFileName != process.name OR InternalName mismatches\
      \ extension -> alert 'renamed binary'\n  if process.name in trusted_set AND path NOT in standard_paths[process.name]\
      \ -> alert 'masquerade path'"
- question: Which extension-to-inferred-type pairings are statistically rare for a given host or directory
    when measured against a 30-day baseline, prioritizing externally sourced files?
  context: Some mismatches are benign and environment-specific; rather than a fixed rule, build a 30-day
    baseline of extension-to-inferred-type pair frequencies per host/directory and flag observations below
    the 1st percentile as anomalous. Use a robust median/MAD modified Z-score (flag where |Mi| > 3.5)
    to set the cutoff so a few contaminated samples don't skew the threshold, and derive dataset-specific
    thresholds rather than reusing fixed values. Prioritize externally sourced files, which are the more
    likely delivery vector. This statistical layer surfaces unusual disguises that deterministic rules
    miss and supports Isolate by ranking rare pairs for review.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline[host,dir][ (ext, inferred_type) ] = count over last 30d

      for new file: f = freq(ext,inferred_type)

      Mi = 0.6745*(f - median)/MAD

      if f < p1 OR |Mi| > 3.5: flag (boost if source=external)'
- question: Do files declared as low-entropy benign types (.txt, .csv, .docx body, .log) actually contain
    high-entropy content (Shannon entropy > ~7.0) indicating packed, encrypted, or compressed data?
  context: 'Declared-benign text/document types should have relatively low Shannon entropy; a value above
    ~7.0 inside such a file signals packed/encrypted/compressed payload hidden under a harmless extension.
    Follow the magic-byte + entropy triage of Costin et al.: compute content entropy and flag high-entropy
    bodies carried by low-entropy declared types. Combine with exact and fuzzy (ssdeep) hashing to correlate
    the artifact against known-good and known-bad corpora and suppress known content. A positive result
    is a strong indicator of a concealed payload; supports Isolate by quarantining suspected encrypted/SFX
    content before it executes.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for file where declared_type in {txt,csv,docx_body,log}:\n  H = shannon_entropy(content)\n\
      \  if H > 7.0: alert 'high-entropy payload in benign type'\n  correlate sha256 + ssdeep against\
      \ known_good/known_bad; suppress if known_good"
- question: Which network sources (domain/IP) are producing mismatched files at a rate, fan-out, or byte
    volume exceeding their historical norms, and are any sources showing a spike in blocked/aborted transfers
    or validator failures?
  context: 'Track mismatch Volume and Frequency per source from Zeek conn.log: mismatches per minute,
    distinct destination-host fan-out, and total mismatched bytes — escalating sources that exceed historical
    norms. Separately profile the failure/State signal: blocked/aborted transfers, validator-failure rate,
    and `missing_bytes` ratio per source. A spike in failed validations is itself a distinct indicator
    of evasion attempts (the attacker probing/retrying). This source-centric view supports Isolate by
    letting you block at the source or proxy when a single origin is repeatedly delivering disguised files.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'join files.log mismatches with conn.log on uid -> source ip/domain

      per source over window: rate = mismatches/min, fanout = distinct dst, bytes = sum(total_bytes)

      if any > historical_norm: escalate

      per source: failure_rate = blocked_or_failed / total; missing_ratio = avg(missing_bytes/total_bytes)

      if failure_rate spikes: alert ''evasion attempts'''
- question: When each file event is scored by an unsupervised Extended Isolation Forest over its metadata
    vector {mismatch flag, content entropy, file size, extension rarity, source reputation, recurrence
    count}, which events isolate quickly (short path length) as anomalies?
  context: Label-free anomaly detection surfaces novel disguised files that no rule or signature anticipates.
    Build a feature vector per file event — mismatch flag, content entropy, file size, extension rarity,
    source reputation, recurrence count — and score it with an Extended Isolation Forest; a short isolation
    path means the point is easily separated and therefore anomalous. This ranking runs in parallel with
    the deterministic rules rather than replacing them. A high anomaly score warrants analyst triage;
    supports Isolate by prioritizing the most unusual files for containment even absent a known signature.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'X = [mismatch_flag, entropy, size, ext_rarity, source_rep, recurrence] per file event

      model = ExtendedIsolationForest().fit(history)

      score = model.anomaly_score(X)   # short path = anomaly

      rank descending; triage top scores (does not replace deterministic rules)'
- question: When a supervised Random Forest classifier scores files for disguise risk using mismatch indicator,
    content-vs-extension confidence delta, filename entropy, extension rarity, file size, content entropy,
    source reputation, and recurrence history, which files receive the highest risk scores and what top-3
    features drive them?
  context: A trained Random Forest can prioritize quarantine and analyst review by combining many weak
    signals into a single risk score. Features include the mismatch indicator, the content-vs-extension
    confidence delta, filename entropy, extension rarity, file size, content entropy, source reputation,
    and recurrence history. Surface the top-3 contributing features in every alert (e.g., 'extension/content
    mismatch; entropy 7.9; source seen 1x in 30d') using feature-attribution so analysts can act on the
    reasoning, not just a number. Keep deterministic mismatch isolation independent of model availability.
    Supports Isolate by ordering containment effort toward the highest-risk disguised files.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'features = [mismatch, conf_delta, fname_entropy, ext_rarity, size, content_entropy, source_rep,
      recurrence]

      risk = RandomForest.predict_proba(features)

      alert top-risk files with top3 = feature_attribution(features)

      fallback: deterministic mismatch isolation always runs regardless of model'
- question: What does a deep content-type classifier (Magika for whole files, FiFTy for embedded/carved
    fragments lacking headers) say the file's true type is from raw bytes alone, and does that predicted
    type feed back into the mismatch logic and risk model?
  context: To catch masquerade even when headers are absent or spoofed, classify the true type directly
    from raw bytes independent of name/extension. Use Magika for whole files and FiFTy for embedded or
    carved fragments that lack headers. Feed the predicted type and its confidence into the extension-vs-type
    mismatch logic and into the ML risk model, so a disguised file is caught from its content even when
    the magic bytes have been forged or stripped. This closes the gap left by signature-only checks and
    supports Isolate by providing an authoritative content-derived type for the isolation decision.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - 'NAI: User workstations, critical servers, network egress points, mail/web proxies, and file-share
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'true_type, conf = magika(file_bytes)                 # whole files

      frag_type, conf = fifty(fragment_bytes)              # embedded/carved, no header

      feed (true_type, conf) into mismatch_logic and risk_model

      if true_type != declared_type: flag masquerade (header-independent)'
