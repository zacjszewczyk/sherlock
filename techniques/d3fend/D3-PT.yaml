name: 'D3-PT: Process Termination'
id: 733bfad3-ff44-443e-ad81-caf75736f6c4
description: Investigate and validate candidate processes for termination as an eviction action against
  an adversary, while avoiding disruption to critical operations. This playbook helps a SOC analyst (1)
  identify malicious or anomalous processes that warrant termination by combining deterministic process-lineage
  and IOC/behavior-chain rules, statistical baselining of process volume, frequency, and state, and explainable
  ML classifiers over first-party endpoint telemetry (Sysmon, Windows Security EventLog, Linux auditd/eBPF,
  Zeek), and (2) detect adversary abuse of process termination itself, including unauthorized use of termination
  utilities, Bring-Your-Own-Vulnerable-Driver (BYOVD) EDR-killer activity, and ransomware-style mass termination
  of services and processes. Primary logic runs on native endpoint and network telemetry without mandatory
  external lookups, and every detection method is designed to yield an explainable, defensible justification
  before an analyst confirms or an automation executes the kill.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
