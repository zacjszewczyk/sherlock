  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source IN (auditd kill, WinEventID=4688/access_denied)
      WHERE target IN protected_processes AND status IN ("denied","failed")
      | timechart span=10m count BY host, source_principal
      WHERE rising_trend(count) | emit alert(host, principal, reason="edr_tamper_attempts")
