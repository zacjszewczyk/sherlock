    terminating the correct process(es) evicts running adversary code without taking down business-critical
    services. Sequence anomalies (e.g., kills in an order no normal workflow produces) catch destabilization
    patterns that simple rate thresholds miss; surface anomaly diagnostics for triage so analysts can
    pinpoint and evict the orchestrating process.
