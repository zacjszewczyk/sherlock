questions:
- question: Do any running or newly created processes match curated threat IOCs (executable name, path,
    SHA256 hash) or YARA signatures for malware, hacktools, or abused drivers?
  context: Continuously compare process-create telemetry (Windows Event ID 4688 / Sysmon EID 1) and on-disk/in-memory
    images against curated IOC and YARA corpora (e.g., Neo23x0 signature-base), scanning the process image,
    loaded modules, and memory. Within the Evict tactic, the objective is to remove the adversary's active
    foothold; confidently and surgically terminating the correct process(es) evicts running adversary
    code without taking down business-critical services. A high-confidence IOC/YARA hit is among the strongest
    and most explainable justifications for terminating a process to evict the adversary. A clean result
    lowers but does not eliminate suspicion, so pair it with the behavioral checks below; beware hash-only
    evasion via recompilation and benign tools matching loose rules.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN (WinEventID=4688, Sysmon=1)
      | lookup ioc_table ON (Image, ImagePath, SHA256)
      WHERE match=true OR yara_scan(Image, ProcessMemory) IN (malware, hacktool, abused_driver)
      | emit alert(host, pid, Image, SHA256, rule_name, confidence="high")
  - technology: YARA/pseudocode
    query: |-
      yara -r signature-base/ /proc/<pid>/exe ; yarascan loaded_modules, process_memory
      -> if rule_match: flag pid for analyst-confirmed termination
- question: Does any process violate expected parent-child lineage invariants (e.g., svchost.exe not spawned
    by services.exe, lsass.exe spawning a child, or rundll32/regsvr32 launched by a user process)?
  context: Alert when a process violates an allow-list of expected parent processes. Within the Evict
    tactic, the objective is to remove the adversary's active foothold; confidently and surgically terminating
    the correct process(es) evicts running adversary code without taking down business-critical services.
    These deviations (per Elastic unusual parent-child and Red Canary T1055) are high-fidelity eviction
    targets because legitimate system binaries have very predictable parentage; an anomalous parent provides
    an explainable, defensible justification for the kill. Tune the allow-list to your environment to
    avoid false positives from legitimate management tooling and installers.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN (WinEventID=4688, Sysmon=1)
      | eval bad = (Image="svchost.exe" AND ParentImage!="services.exe")
                 OR (ParentImage="lsass.exe")
                 OR (Image IN ("rundll32.exe","regsvr32.exe") AND ParentImage NOT IN system_binaries)
      WHERE bad=true
      | emit alert(host, pid, Image, ParentImage, reason="lineage_violation")
- question: Are there markers of process injection or hollowing, such as cross-process remote thread creation
    into security/system processes, image replacement/process tampering, or system processes making network
    connections with empty command lines?
  context: Flag cross-process thread creation (Sysmon EID 8) into security/system processes and image-replacement/process-tampering
    (Sysmon EID 25), plus core system processes making outbound network connections with empty command
    lines. Within the Evict tactic, the objective is to remove the adversary's active foothold; confidently
    and surgically terminating the correct process(es) evicts running adversary code without taking down
    business-critical services. These are concrete indicators that adversary code is executing inside
    an otherwise-trusted process; terminating the injected host process (or the injector) evicts the adversary,
    though analysts must weigh impact since the host process may be critical (e.g., lsass, services).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (Sysmon=8 AND TargetImage IN (security_procs, system_procs))
      OR (Sysmon=25)
      OR (Sysmon=1 AND Image IN system_procs AND CommandLine="" AND has_netconn(pid))
      | emit alert(host, SourceImage, TargetImage, reason="injection_marker")
- question: Did any process execute a known-malicious API-call behavior chain such as VirtualAllocEx ->
    WriteProcessMemory -> CreateRemoteThread?
  context: Confirm a process executed a known-malicious API behavior chain using sequence alignment over
    collected API traces; such chains occur almost exclusively in malware. Within the Evict tactic, the
    objective is to remove the adversary's active foothold; confidently and surgically terminating the
    correct process(es) evicts running adversary code without taking down business-critical services.
    Express explainable verdicts with logic-programming rules over process/service/registry/driver state
    (per MalpMiner) so the kill decision is auditable. A positive match is high-confidence; absence may
    simply mean API tracing was unavailable or the chain used direct syscalls.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      collect api_trace BY pid
      | seq_align(api_trace, pattern=[VirtualAllocEx, WriteProcessMemory, CreateRemoteThread])
      WHERE align_score >= threshold
      | emit alert(host, pid, matched_chain, justification=rule_trace)
- question: Which processes carry an elevated behavioral risk score based on anomalous parentage, destination
    geography, per-process network byte volume, connection frequency, or child-spawn rate?
  context: For each running process, baseline normal parentage, destination geography, per-process network
    byte volume (Zeek conn.log), and connection frequency (count/min). Within the Evict tactic, the objective
    is to remove the adversary's active foothold; confidently and surgically terminating the correct process(es)
    evicts running adversary code without taking down business-critical services. Assign a risk score
    elevated for processes connecting to 99th-percentile-rare countries, transferring anomalous byte volumes,
    or exhibiting unusual child-spawn rates; rank rare feature vectors with Isolation Forest and surface
    the top-3 contributing features in the alert so the analyst can validate the eviction rationale. High
    scores indicate candidates for closer scrutiny rather than automatic kill.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      join process_create WITH zeek_conn ON pid/host
      | stats bytes=sum(orig_bytes+resp_bytes), conns=count, dst_geo=values(country) BY pid
      | eval rare_geo = pctl_rank(dst_geo) >= 0.99
      | score = isolation_forest(features=[parentage, bytes, conns, child_spawn_rate, rare_geo])
      | where score high | emit alert(pid, score, top3_features)
- question: Do any process image sections exhibit high Shannon entropy (>7.2) indicative of packing, encryption,
    or obfuscation?
  context: Compute Shannon entropy of process image sections; native code typically falls in 5.0-6.5,
    so sections above ~7.2 are candidates for packing/encryption. Within the Evict tactic, the objective
    is to remove the adversary's active foothold; confidently and surgically terminating the correct process(es)
    evicts running adversary code without taking down business-critical services. Packed images warrant
    closer scrutiny before termination because legitimate compressed/installer binaries also exhibit high
    entropy. Tune the cutoff to your software baseline to control false positives. A high-entropy finding
    alone is not a kill justification but escalates priority for the other checks.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for each process image section:
        H = shannon_entropy(section_bytes)
        if H > 7.2: flag(pid, section, H, label="packed_candidate")
      baseline_cutoff tuned per software inventory
- question: Does any running process show a system-call sequence (n-gram) deviation from its per-program
    baseline that exceeds a tuned mismatch threshold?
  context: Build per-program baselines of normal short system-call n-gram sequences (Linux auditd/eBPF)
    and alert when a running process's mismatch rate exceeds a tuned threshold (Forrest 'sense of self').
    Within the Evict tactic, the objective is to remove the adversary's active foothold; confidently and
    surgically terminating the correct process(es) evicts running adversary code without taking down business-critical
    services. Use HMM/frequency models (76-99% detection) and add call-stack context for higher accuracy.
    A high mismatch rate suggests the process is doing something outside its normal behavioral profile,
    which on a critical host is a strong, defensible reason to investigate for eviction.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: auditd/Stats pseudocode
    query: |-
      baseline[program] = freq(ngrams(syscall_seq, n=6))
      for proc in running:
        mismatch = 1 - overlap(ngrams(proc.syscalls), baseline[proc.program])
        if mismatch > tuned_threshold: alert(host, pid, program, mismatch)
      optional: HMM score + call-stack context
- question: Does a supervised real-time classifier predict any process to be malicious based on command-line
    entropy, parent lineage, network volume/frequency, and API/opcode N-grams?
  context: Run a supervised classifier (e.g., LSTM over API calls ~95%, hybrid CNN-LSTM ~99.91%, or EarlyMalDetect
    predicting from the first few API calls) in parallel with the deterministic rules. Within the Evict
    tactic, the objective is to remove the adversary's active foothold; confidently and surgically terminating
    the correct process(es) evicts running adversary code without taking down business-critical services.
    Fast first-few-API prediction supports rapid eviction. Treat the ML verdict as one weighted signal
    alongside the rules; require feature attribution (below) before acting so the kill is explainable
    and defensible.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [cmdline_entropy, parent_lineage, net_volume, net_freq, api_ngrams, opcode_ngrams]
      pred = supervised_model.predict(features)   # LSTM / CNN-LSTM
      if pred.label=="malicious" and pred.prob>=tau: alert(pid, prob, model_version)
- question: Where labeled malware is scarce, do benign-only (one-class) models flag any process as a novel
    deviation from normal behavior?
  context: Train one-class models (Isolation Forest, deep autoencoder) on benign process behavior and
    flag deviations, achieving up to 100% recall on malicious activity in some studies. Within the Evict
    tactic, the objective is to remove the adversary's active foothold; confidently and surgically terminating
    the correct process(es) evicts running adversary code without taking down business-critical services.
    This catches novel/unseen threats that signature and supervised approaches miss. Retain deterministic
    thresholds underneath as a floor of determinism so a kill is never based solely on an unexplained
    anomaly. Expect higher false-positive rates than supervised models; route to analyst review.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = OneClass(IsolationForest | Autoencoder).fit(benign_process_behavior)
      recon_err / anomaly_score = model.score(proc_features)
      if score > deviation_threshold: alert(pid, score, label="novel_deviation")
- question: For every model-driven termination recommendation, are the top-3 contributing features surfaced
    (via SHAP/LIME) so an analyst can validate the kill is justified?
  context: Require model outputs to surface the top-3 contributing features (e.g., VirtualAllocEx, WriteProcessMemory,
    rare parent) in alert text using SHAP/LIME. Within the Evict tactic, the objective is to remove the
    adversary's active foothold; confidently and surgically terminating the correct process(es) evicts
    running adversary code without taking down business-critical services. Feature attribution makes automated
    or analyst-confirmed termination auditable and defensible, and lets the analyst confirm the model
    is keying on genuinely malicious behavior rather than spurious correlations before or after the action.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 25 (Process Tampering)
  - Linux auditd / eBPF syscall traces
  - Zeek conn.log
  - 'NAI: Critical servers (e.g., Domain Controllers, application servers), endpoint devices, and network
    egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      attribution = SHAP(model, features)   # or LIME
      top3 = sort(attribution, desc)[:3]
      alert.append(explanation=top3)  # block auto-kill if explanation missing
- question: Did a non-privileged account or an unexpected principal execute a process-management utility
    (taskkill /F, PowerShell Stop-Process/kill, wmic process terminate, Linux kill -9), especially targeting
    protected security, backup, or logging services?
  context: Alert on execution of termination utilities by non-privileged accounts or when targeting protected
    services (AV/EDR, backup, logging). Within the Evict tactic, the objective is to remove the adversary's
    active foothold; confidently and surgically terminating the correct process(es) evicts running adversary
    code without taking down business-critical services. Adversaries abuse legitimate kill utilities to
    disable defenses (defense impairment) before further action; maintain a hard list of protected process
    names that must never be killed by non-system principals. A hit here may itself be the adversary action
    you need to evict, and the killing process is a prime termination candidate.
  answer_sources:
  - Windows Event ID 4689 (Process Exit)
  - Windows Event ID 4688
  - Sysmon Event ID 5 (Process Terminated)
  - Windows Service Control Manager events (7034/7036)
  - Linux auditd (kill/syscall)
  - 'NAI: Endpoints and servers running security agents; hosts with critical services (databases, backup,
    AV/EDR).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source IN (WinEventID=4688, auditd_execve)
      | eval tool = Image IN ("taskkill.exe","powershell.exe Stop-Process","wmic.exe","kill")
      WHERE tool AND (Account NOT IN privileged_admins OR TargetService IN protected_services)
      | emit alert(host, user, tool, target, reason="unauthorized_termination_tool")
- question: Did a process load a known-vulnerable or abused kernel driver (BYOVD) immediately before security-agent
    telemetry stopped?
  context: Match newly loaded kernel drivers against vulnerable/abused-driver IOC and YARA sets and alert
    when a process loads such a driver immediately before security-agent telemetry ceases. Within the
    Evict tactic, the objective is to remove the adversary's active foothold; confidently and surgically
    terminating the correct process(es) evicts running adversary code without taking down business-critical
    services. BYOVD EDR-killers are a hallmark of sophisticated actors disabling defenses; correlating
    driver load with a telemetry gap is a high-fidelity signal. The loader process and the driver are
    eviction targets, but expect that kernel-level compromise may require host isolation/reimage rather
    than a simple process kill.
  answer_sources:
  - Windows Event ID 4689 (Process Exit)
  - Windows Event ID 4688
  - Sysmon Event ID 5 (Process Terminated)
  - Windows Service Control Manager events (7034/7036)
  - Linux auditd (kill/syscall)
  - 'NAI: Endpoints and servers running security agents; hosts with critical services (databases, backup,
    AV/EDR).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      driver_load events | lookup vulnerable_driver_ioc/yara ON (driver_hash, driver_name)
      | join telemetry_heartbeat ON host
      WHERE driver_match=true AND heartbeat_gap_after_load < 5min
      | emit alert(host, loader_pid, driver, reason="BYOVD_edr_killer")
- question: Is any host experiencing an anomalous spike in process-termination rate (e.g., >3 sigma above
    host mean or >20 kills/min), potentially indicating ransomware or coordinated destabilization?
  context: Baseline per-host hourly process-termination rate (Event ID 4689 / Sysmon EID 5) and alert
    on spikes above a statistical (3-sigma) or hard (>20 kills/min) floor. Within the Evict tactic, the
    objective is to remove the adversary's active foothold; confidently and surgically terminating the
    correct process(es) evicts running adversary code without taking down business-critical services.
    Combine with Service Control Manager stop events (7034/7036) to capture mass Service Stop behavior.
    A mass-kill cascade is a strong precursor/companion to ransomware encryption; rapid identification
    of the orchestrating process enables eviction before more damage occurs.
  answer_sources:
  - Windows Event ID 4689 (Process Exit)
  - Windows Event ID 4688
  - Sysmon Event ID 5 (Process Terminated)
  - Windows Service Control Manager events (7034/7036)
  - Linux auditd (kill/syscall)
  - 'NAI: Endpoints and servers running security agents; hosts with critical services (databases, backup,
    AV/EDR).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      source IN (WinEventID=4689, Sysmon=5, SCM=7034/7036)
      | timechart span=1m count AS kills BY host
      | eval mean=avg(kills), sd=stdev(kills)
      WHERE kills > mean+3*sd OR kills > 20
      | emit alert(host, kills, window, reason="mass_termination")
- question: Is there a rising rate of access-denied or failed process-termination attempts targeting protected
    security processes (EDR-tamper attempts)?
  context: Track access-denied / failed-kill events against protected processes as a distinct signal of
    EDR-tamper attempts. Within the Evict tactic, the objective is to remove the adversary's active foothold;
    confidently and surgically terminating the correct process(es) evicts running adversary code without
    taking down business-critical services. A rising rate of failed terminations targeting security agents
    is a strong precursor to successful defense impairment, so it gives early warning before the adversary
    finds a working method (e.g., BYOVD). The principal generating these failed attempts is a prime eviction
    candidate; investigate it before it escalates privileges.
  answer_sources:
