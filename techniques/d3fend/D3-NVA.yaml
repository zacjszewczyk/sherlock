name: 'D3-NVA: Network Vulnerability Assessment'
id: b2d8c8cf-3e74-4719-a34c-ed92a06146b3
description: Investigate the vulnerability and compliance posture of our network infrastructure (routers,
  switches, firewalls, VPN concentrators, and the management plane) to find weaknesses a sophisticated
  external actor, commodity malware, or an insider could exploit to reach sensitive data. This playbook
  helps an analyst correlate ACAS vulnerability and configuration scan results with the network device
  inventory, deterministically flag Critical CVEs (CVSS >= 9.0), CISA KEV entries, and CAT I/CAT II STIG
  deviations, and escalate findings that lie on an attack/reachability path from an untrusted segment
  to a crown-jewel asset. It layers symbolic-logic rules and reachability/invariant verification (MulVAL,
  Batfish, Header Space Analysis, VeriFlow), statistical baselining of CVSS distributions, patch SLAs,
  scan coverage, and observed insecure-protocol usage from Zeek conn.log, and explainable machine learning
  (exploit-likelihood classification and STIG-compliance clustering) to prioritize remediation. Use it
  to surface unpatched critical network vulnerabilities, blind spots in scan coverage, insecure management-plane
  exposure, and systemic configuration drift across network segments.
type: technique
related:
- tactic_id: D3-NM
  tactic_name: Network Mapping
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which network infrastructure devices have ACAS-reported vulnerabilities marked 'Critical'
    (CVSS v3.1 base score >= 9.0), or any CVE listed in the CISA Known Exploited Vulnerabilities (KEV)
    catalog regardless of CVSS, when their ACAS findings are correlated against the network device inventory
    (CMDB) - and how do those priorities shift when re-scored with CVSS v4.0 environmental/threat metrics
    that weight asset criticality and deployed mitigations?
  context: 'This deterministic correlation is the detection floor for Network Mapping: it answers whether
    any router, switch, firewall, or VPN concentrator is carrying a known-severe, immediately actionable
    weakness. Join each ACAS finding to the CMDB so every CVE is tied to a real, owned asset with a known
    location (DMZ, core, internal). Flag CVSS v3.1 base >= 9.0 (the Critical band of 9.0-10.0) and, independently,
    any CVE present in the CISA KEV catalog - KEV membership means real-world exploitation is occurring,
    so it overrides CVSS. Optionally re-score with CVSS v4.0 environmental/threat metrics to reprioritize
    by where the device sits and what mitigations exist. A positive result on a DMZ or core device is
    an emergency remediation item; a negative result means no known-critical exposure was observed this
    cycle, not that the device is safe. These hard thresholds must never be removed; the statistical and
    ML layers run in parallel, not instead of them.'
  answer_sources:
  - ACAS Scan Results
  - Network Device Inventory (CMDB)
  - Zeek conn.log
  - EPSS scores (optional enrichment)
  - CISA KEV catalog (optional enrichment)
  - 'NAI: DMZ Firewalls, Network Core Routers, VPN Concentrators, Internal Switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      JOIN acas_scan a WITH cmdb c ON a.host_ip = c.host_ip
      WHERE (a.severity = 'Critical' OR a.cvss_v31_base >= 9.0 OR a.cve IN cisa_kev_catalog)
      | ENRICH location = c.network_zone   -- DMZ | core | internal
      | EVAL cvss4 = rescore_v40(a.cve, c.asset_criticality, c.mitigations)
      | ALERT severity = CASE WHEN location IN ('DMZ','core') OR a.cve IN cisa_kev_catalog THEN 'critical' ELSE 'high' END,
              reason = CASE WHEN a.cve IN cisa_kev_catalog THEN 'KEV' ELSE 'CVSS>=9.0' END
- question: Beyond per-device severity, do any ACAS vulnerabilities - even sub-Critical ones - lie on
    a reachability path from an untrusted/DMZ segment to a crown-jewel asset (Domain Controller, core
    router, management plane) when an attack/reachability graph is built from ACAS findings plus first-party
    reachability facts (firewall ACLs, routing tables, and Zeek conn.log observed flows)?
  context: A vulnerability's true risk depends on whether an attacker can actually reach it and pivot
    through it toward sensitive data - the central idea of Network Vulnerability Assessment. Build an
    attack/reachability graph using MulVAL-style logic reasoning over ACAS findings combined with config-derived
    data-plane facts (Batfish, Header Space Analysis) and observed flows from Zeek conn.log. Escalate
    any vulnerability, even one below the Critical band, if it sits on a path from an untrusted segment
    to a crown jewel. Crucially, emit the explicit path (source segment -> intermediate hops -> target
    asset) in the alert so the analyst can validate the chain and choose a safe remediation. A positive
    result reveals an exploitable pivot route that per-node scoring would miss; a negative result means
    no untrusted-to-crown-jewel path currently traverses the finding. This directly supports prioritizing
    remediation that protects sensitive data from an external actor.
  answer_sources:
  - ACAS Scan Results
  - Network Device Inventory (CMDB)
  - Zeek conn.log
  - EPSS scores (optional enrichment)
  - CISA KEV catalog (optional enrichment)
  - 'NAI: DMZ Firewalls, Network Core Routers, VPN Concentrators, Internal Switches'
  range: Last 90 days
  queries:
  - technology: Graph/MulVAL pseudocode
    query: |-
      facts = ACAS_vulns + firewall_ACLs + routing_tables + zeek_conn_flows
      graph = build_attack_graph(facts)   # MulVAL-style derivation
      crown_jewels = {domain_controllers, core_routers, management_plane}
      FOR v IN ACAS_vulns:
        paths = reachable_paths(graph, source=untrusted_or_dmz_segments, through=v.host, target=crown_jewels)
        IF paths NOT EMPTY:
          ALERT 'reachable_to_crown_jewel' WITH path = shortest(paths), vuln = v.cve, severity = escalate(v)
- question: What does the distribution of CVSS scores across all scanned network devices look like (after
    de-duplication and field-quality cleaning), and which devices exceed a dynamic 95th-percentile 'critical
    risk' threshold, carry critical vulnerabilities unpatched longer than 14 days, or exceed the mean
    network-device time-to-patch by more than two standard deviations?
  context: 'Static thresholds miss environment-specific risk concentration and aging, so this statistical
    view profiles the whole fleet. First de-duplicate findings and clean CVSS/CWE fields, because missing
    or inconsistent fields (per ''Cleaning the NVD'') skew severity distributions. Set the 95th percentile
    of the cleaned CVSS distribution as a dynamic critical-risk threshold for network gear, and track
    per-device Volume (count of open Critical/High CVEs) and Frequency (new criticals per week). Then
    enforce age/SLA logic: flag any critical network vulnerability unpatched beyond 14 days, or whose
    dwell time exceeds the mean time-to-patch by two standard deviations. Ground SLA tightening in empirical
    exploit timelines (per Householder et al.): only ~4.1% of CVEs ever gain public exploit code, so those
    that do warrant aggressive SLAs. A device persistently above the 95th percentile or with stale critical
    findings is a remediation priority and a possible sign of a neglected or unmanaged asset.'
  answer_sources:
  - ACAS Scan Results
  - Network Device Inventory (CMDB)
  - Zeek conn.log
  - EPSS scores (optional enrichment)
  - CISA KEV catalog (optional enrichment)
  - 'NAI: DMZ Firewalls, Network Core Routers, VPN Concentrators, Internal Switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FROM acas_scan | DEDUP cve, host_ip | CLEAN cvss_base, cwe
      | STATS p95 = percentile(cvss_base, 95)
      FROM acas_scan a
      | EVAL age_days = now() - a.first_seen
      | STATS open_crit = count(cvss_base>=9.0), new_crit_wk = rate(cvss_base>=9.0, 7d) BY host_ip
      | WHERE a.cvss_base >= p95
           OR (a.cvss_base >= 9.0 AND age_days > 14)
           OR age_days > mean(ttp) + 2*stddev(ttp)
      | ALERT 'network_vuln_risk_or_sla_breach'
- question: Per scan cycle, how many target devices failed to scan, returned credentialed-scan authentication
    failures, or were unreachable/timed out - and has scan coverage of the NAI device set dropped below
    baseline (e.g., < 95% of inventory) or has a device class's authentication-failure rate exceeded its
    3-sigma baseline, leaving core/DMZ gear as unmeasured risk?
  context: 'Findings only describe what was actually scanned; blind spots are risk you cannot see, which
    is exactly where a sophisticated actor prefers to hide. Profile failure/blind-spot signals separately
    from vulnerability findings: count devices that failed to scan, credentialed-scan authentication failures,
    and unreachable/timeout hosts each cycle. Alert when coverage of the NAI device set falls below a
    baseline (e.g., < 95% of inventory) or when a device class''s authentication-failure rate exceeds
    its 3-sigma baseline - a sudden rise in auth failures can indicate changed credentials, tampering,
    or an attacker locking out the scanner. Corroborate device exposure with Zeek conn.log State metrics
    (successful vs. rejected/blocked connections to management ports) to confirm whether an unscanned
    device is nonetheless reachable. A positive result means measurement gaps on critical gear that must
    be closed before the posture can be trusted.'
  answer_sources:
  - ACAS Scan Results
  - Network Device Inventory (CMDB)
  - Zeek conn.log
  - EPSS scores (optional enrichment)
  - CISA KEV catalog (optional enrichment)
  - 'NAI: DMZ Firewalls, Network Core Routers, VPN Concentrators, Internal Switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FROM acas_scan_cycle
      | STATS failed = count(status='scan_failed'),
              auth_fail = count(status='cred_auth_failure'),
              unreachable = count(status IN ('timeout','unreachable')),
              scanned = count_distinct(host_ip) BY cycle, device_class
      | EVAL coverage = scanned / inventory_count(nai_device_set)
      | WHERE coverage < 0.95
           OR auth_fail > baseline_mean(device_class) + 3*stddev(device_class)
      | JOIN zeek_conn z ON z.dest_ip = host_ip AND z.dest_port IN mgmt_ports
      | ALERT 'scan_coverage_gap_or_authfail_spike'
- question: When a gradient-boosted classifier scores each network vulnerability for likelihood of exploitation
    using first-party features (ACAS CVSS vector, vulnerability age, device type, device location, and
    Zeek conn.log exposure metrics) optionally enriched with EPSS and Expected Exploitability, which findings
    receive the highest prioritized patch-risk scores, and what top-3 contributing features explain each?
  context: 'CVSS measures severity, not probability of exploitation; this ML layer prioritizes what is
    most likely to actually be attacked, following ''Beyond Heuristics'' and the operational EPSS v3 model.
    Train a gradient-boosted classifier on first-party features: the CVSS vector from ACAS, vulnerability
    age, device type (router/firewall/switch), device location (DMZ/internal), and Zeek conn.log exposure
    metrics (byte Volume, connection Frequency, protocol diversity, success/fail ratios to the device
    IP). Optionally enrich with EPSS probability and Expected Exploitability as features. Output a prioritized
    patch-risk score and, critically, surface the top-3 contributing features in the alert text (e.g.,
    ''EPSS=0.74; DMZ-exposed; age=41d'') so analysts can validate and triage rather than trust a bare
    number. A high score with interpretable drivers - especially exposure plus age plus DMZ location -
    is a strong, defensible remediation priority that runs in parallel with the deterministic rules.'
  answer_sources:
  - ACAS Scan Results
  - Network Device Inventory (CMDB)
  - Zeek conn.log
  - EPSS scores (optional enrichment)
  - CISA KEV catalog (optional enrichment)
  - 'NAI: DMZ Firewalls, Network Core Routers, VPN Concentrators, Internal Switches'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = features(acas_scan, cmdb, zeek_conn:
          cvss_vector, vuln_age, device_type, device_location,
          byte_volume, conn_frequency, protocol_diversity, success_fail_ratio)
      X = enrich(X, epss_probability, expected_exploitability)   # optional
      model = GradientBoostedClassifier().fit(history_labeled)
      scores = model.predict_proba(X)
      FOR row WHERE score in top_risk:
          emit alert WITH patch_risk = score, top3 = SHAP(model, row)
- question: Do any ACAS configuration scan results show CAT I or CAT II deviations from the relevant network
    device STIG baseline (e.g., Cisco IOS STIG, Juniper STIG) on internal switches, core routers, DMZ
    firewalls, or Domain Controller network interfaces?
  context: Configuration weaknesses are as exploitable as software CVEs, and STIG compliance is the deterministic
    floor for hardening the network. Ingest ACAS configuration (compliance) scan results and create high-priority
    alerts for any CAT I (high) or CAT II (medium) deviation from the device's STIG baseline. CAT I findings
    can directly enable compromise (e.g., default credentials, unauthenticated management), while CAT
    II findings materially weaken posture. Tie each finding to the device's role and zone so DMZ and core/management-plane
    deviations are escalated first. A positive result is a concrete hardening gap to remediate; retain
    these CAT-severity rules as the detection floor regardless of what the statistical and ML layers report,
    because they encode authoritative DoD baselines.
  answer_sources:
  - ACAS Configuration Scan Results
  - Device Configuration Snapshots
  - Zeek conn.log
  - 'NAI: Internal Switches, Domain Controllers'' network interfaces, Network Core Routers, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM acas_config_scan a JOIN cmdb c ON a.host_ip = c.host_ip
      WHERE a.stig_severity IN ('CAT I','CAT II')
      | ENRICH baseline = stig_for(c.platform)   -- Cisco IOS STIG | Juniper STIG | ...
      | ALERT severity = CASE WHEN a.stig_severity='CAT I' OR c.network_zone IN ('DMZ','core') THEN 'critical' ELSE 'high' END,
              finding = a.rule_id, device = c.hostname
- question: Does any current or newly committed device configuration permit a forbidden segment-to-segment
    path - for example Telnet/SNMP/HTTP management reachable from a user or DMZ segment - and does any
    committed change violate a segmentation/isolation invariant that protects the management plane, as
    verified by data-plane reasoning (Batfish, Header Space Analysis) and real-time invariant checking
    (VeriFlow)?
  context: Insecure-management findings are design risk, not just per-device settings; what matters is
    whether the network as a whole permits a forbidden path to the management plane. Use Batfish and Header
    Space Analysis to reason over device configs and determine whether a forbidden segment-to-segment
    reachability exists (e.g., management protocols reachable from a user or DMZ segment). Add VeriFlow-style
    real-time invariant checking so that the moment a committed change violates a segmentation/isolation
    invariant, an alert fires. Emit the violated invariant and the newly reachable tuple (src segment,
    dst, port/protocol) so the analyst sees exactly what broke. A positive result indicates the management
    plane has become reachable from an untrusted area - a prime target for an external actor seeking control
    of the network - and should be treated as a high-priority change to revert or remediate.
  answer_sources:
  - ACAS Configuration Scan Results
  - Device Configuration Snapshots
  - Zeek conn.log
  - 'NAI: Internal Switches, Domain Controllers'' network interfaces, Network Core Routers, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: Batfish/pseudocode
    query: |-
      snapshot = parse_configs(device_config_snapshots)
      invariants = {
        'mgmt_plane_isolated': forbid(reach(src=user_or_dmz_segments, dst=mgmt_plane, ports={23,161,80,443})),
        'no_telnet_from_user': forbid(reach(src=user_segments, proto='telnet'))
      }
      FOR inv IN invariants:
        violation = batfish_reachability_check(snapshot, inv)
        IF violation: ALERT 'segmentation_invariant_violated' WITH inv, reachable_tuple = violation.flow
      -- on every commit:
      VeriFlow.on_change(delta): IF breaks_invariant(delta, invariants): ALERT 'realtime_invariant_violation'
- question: For key STIG settings (enabled insecure management protocols like Telnet, weak SNMP community
    strings, HTTP management), which devices show a deviation count greater than three standard deviations
    from their peer-group mean (e.g., across all access-layer switches), and which devices show bursts
    of configuration changes exceeding the peer baseline?
  context: Outliers within a peer group reveal misconfigured, neglected, or tampered devices that uniform
    thresholds would miss. For key STIG settings - insecure management protocols (Telnet), weak SNMP community
    strings, HTTP management - establish a baseline deviation count across groups of similar devices (e.g.,
    all access-layer switches) and use descriptive statistics to flag any device more than three standard
    deviations above its peer-group mean. Separately track the Frequency of configuration changes per
    device and flag bursts exceeding the peer baseline, since rapid or unusual change activity can indicate
    unauthorized modification. A positive result points to a systemically weaker device or an anomalous
    change pattern that warrants investigation against change-management records before deciding whether
    it is misconfiguration or malicious activity.
  answer_sources:
  - ACAS Configuration Scan Results
  - Device Configuration Snapshots
  - Zeek conn.log
  - 'NAI: Internal Switches, Domain Controllers'' network interfaces, Network Core Routers, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FROM acas_config_scan
      | EVAL insecure = count(finding IN ('telnet_enabled','weak_snmp_community','http_mgmt'))
      | STATS dev_count = insecure, change_freq = count(config_change) BY host_ip, peer_group
      | EVAL pg_mean = mean(dev_count) BY peer_group, pg_std = stddev(dev_count) BY peer_group
      | WHERE dev_count > pg_mean + 3*pg_std
           OR change_freq > baseline_change_freq(peer_group)
      | ALERT 'stig_deviation_outlier_or_change_burst'
- question: Are static STIG findings corroborated by observed behavior in Zeek conn.log - specifically,
    how many actual Telnet/SNMP/HTTP management connections (Volume and Frequency) reach each device and
    what is their State (successful vs. rejected/blocked), so that an insecure protocol that is actively
    used is escalated above a latent one, and a spike in blocked/failed management connections is alerted
    separately as attack-surface probing?
  context: 'A configuration weakness that is actively exercised is materially riskier than one that merely
    exists on paper, and observed failures are their own signal. Corroborate static STIG findings with
    first-party network behavior from Zeek conn.log: count actual Telnet/SNMP/HTTP management connections
    to each device (Volume and Frequency) and classify their State (successful sessions vs. rejected/blocked
    attempts). A STIG deviation that coincides with successful Telnet sessions is a high-priority, in-use
    exposure; a latent deviation with no observed use is lower priority. Independently, a spike in blocked
    or failed management connections is a distinct attack-surface-probing signal - an adversary or scanner
    testing the management plane - and warrants its own alert. A positive result on actively used insecure
    management is a strong lead that the device is both exposed and reachable to an attacker.'
  answer_sources:
  - ACAS Configuration Scan Results
  - Device Configuration Snapshots
  - Zeek conn.log
  - 'NAI: Internal Switches, Domain Controllers'' network interfaces, Network Core Routers, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      FROM zeek_conn WHERE dest_port IN {23, 161, 80, 443} AND service IN ('telnet','snmp','http')
      | STATS volume = count(*), freq = rate(*, 1d),
              success = count(conn_state IN ('SF','S1')),
              blocked = count(conn_state IN ('REJ','RSTR','S0')) BY dest_ip, service
      | JOIN acas_config_scan a ON a.host_ip = dest_ip AND a.finding = service+'_enabled'
      | ALERT 'insecure_mgmt_in_use' WHEN success > 0   severity='high'
      | ALERT 'mgmt_probing_spike' WHEN blocked > baseline_mean(dest_ip) + 3*stddev(dest_ip)
- question: When a clustering algorithm (e.g., K-Means) groups network devices by their STIG compliance
    profiles derived from ACAS scans, which devices have drifted into a less-compliant cluster over time,
    and what are the top-3 STIG findings/features driving each device's cluster reassignment?
  context: Systemic misconfiguration and unauthorized change often manifest as a device's compliance profile
    shifting relative to its peers - something individual rules miss. Cluster network devices (e.g., K-Means)
    on STIG compliance features derived from ACAS scans, then analyze cluster membership over time. Investigate
    any device that migrates to a less-compliant cluster, which can indicate systemic misconfiguration,
    configuration drift, or unauthorized changes across segments. For each flagged device, surface the
    top-3 STIG findings/features driving the cluster reassignment - not just the cluster label - so the
    analyst has concrete, triageable detail. A positive result (a device drifting toward non-compliance
    with identifiable drivers) is an actionable lead under Network Mapping; confirm against change-management
    records to distinguish authorized changes from tampering or neglect.
  answer_sources:
  - ACAS Configuration Scan Results
  - Device Configuration Snapshots
  - Zeek conn.log
  - 'NAI: Internal Switches, Domain Controllers'' network interfaces, Network Core Routers, DMZ Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = stig_compliance_features(acas_config_scan)   # per-device finding vector
      clusters_t0 = KMeans(k).fit_predict(X_history)
      clusters_t1 = KMeans(k).predict(X_current)
      FOR dev WHERE cluster_compliance(clusters_t1[dev]) < cluster_compliance(clusters_t0[dev]):
          drivers = top3_feature_delta(X_history[dev], X_current[dev])
          emit alert WITH from=clusters_t0[dev], to=clusters_t1[dev], top3=drivers
