name: 'D3-HR: Host Reboot'
id: 904a087d-8072-4ee0-9176-ea1bbf860540
description: Investigate whether a Host Reboot (D3-HR) intended to evict an adversary actually achieved
  its goal, and detect cases where the reboot was unplanned, failed, weaponized, or insufficient. This
  playbook helps an analyst (1) validate that an eviction reboot was deliberately initiated by an approved
  actor/tool and completed into a NORMAL (non-Safe-Mode) boot with all expected services and security
  agents started; (2) baseline reboot frequency, timing, and dirty-shutdown rates per host/role so anomalous
  patterns - excessive reboots, off-hours reboots, repeated unexpected shutdowns - are surfaced; (3) compare
  pre- vs post-reboot network behavior to confirm that memory-resident C2 was actually suppressed and
  did not return via surviving persistence; (4) hunt reboot-surviving persistence and re-compromise through
  host provenance/causal-graph analysis of services, scheduled tasks, autostarts, and drivers; and (5)
  confirm fileless/memory-resident eviction through pre/post-reboot memory scanning. It combines deterministic
  symbolic-logic checks, statistical baselining, and machine-learning models so the analyst can distinguish
  a clean, successful eviction from a reboot that disabled defenses, crashed the host, or merely paused
  an implant that persistence re-launched.
type: technique
related:
- tactic_id: D3-EVC
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: For every host targeted for eviction, did a complete and correctly ordered reboot event-chain
    occur - an initiation Event ID 1074 attributing the action to an authorized initiator account/process
    with a valid reason code, followed by a clean shutdown 6006, then the event-log start 6005 and OS-version
    6009 at the next boot - and are there any reboots missing the 1074 initiator, showing a dirty/unexpected
    shutdown 6008 instead of 6006, or initiated by an account/tool not on the eviction allowlist?
  context: 'Within the Evict (D3-EVC) tactic, the first proof that a host reboot was a deliberate eviction
    (and not an adversary action, a crash, or an unplanned outage) is a complete, ordered shutdown/reboot
    event chain. Event ID 1074 records who/what initiated the shutdown and why; a clean shutdown emits
    6006, and the next boot emits 6005 (Event Log service started) and 6009 (OS version at boot). A missing
    1074 means there is no recorded initiator - the reboot was not driven by your approved tooling; a
    6008 (unexpected/dirty shutdown) in place of 6006 means the box went down hard, which can indicate
    crash-on-eviction or attacker tampering; and an initiator outside the approved-tool/account allowlist
    means an unauthorized party drove the reboot. A positive (clean, authorized, ordered) chain is evidence
    of a successful, deliberate eviction; any deviation should be treated as an unplanned, failed, or
    weaponized reboot and escalated. Track the shutdown success(6006)/failure(6008) state per host as
    an eviction-readiness metric. Reference for the shutdown/reboot Event IDs and unexpected-shutdown
    semantics: [Windows shutdown/reboot Event IDs, Microsoft Learn](https://learn.microsoft.com/en-us/troubleshoot/windows-client/performance/event-id-6008-unexpected-shutdown).'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6005
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 6009
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 13
  - Windows Registry (BCD / SafeBoot keys)
  - 'NAI: All managed Windows endpoints, particularly critical servers and high-value user workstations
    targeted for eviction.'
  range: Last 90 days; pivot to a +/- 15 minute window around each eviction action
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from windows_system_log where EventID in (1074,6005,6006,6008,6009)\n| sort by host, _time\n\
      | sequence per host: init=1074 -> shutdown=6006 -> logstart=6005 -> osver=6009\n| eval authorized\
      \ = init.initiator_account in approved_eviction_accounts\n    AND init.process in approved_eviction_tools\
      \ AND init.reason_code != null\n| alert if init is MISSING\n    OR EventID==6008 seen in place of\
      \ 6006 (dirty shutdown)\n    OR authorized == false"
  - technology: SIEM/Stats pseudocode
    query: 'from windows_system_log where EventID in (6006,6008)

      | stats count(EventID==6006) as clean, count(EventID==6008) as dirty by host

      | eval shutdown_state = if(dirty>0,"FAILURE","SUCCESS")

      | output per-host eviction readiness metric'
- question: Did any eviction reboot land the host in Safe Mode rather than a normal boot - evidenced by
    bcdedit command lines setting safeboot (minimal/network), writes to the SafeBoot registry keys or
    asterisk-prefixed Run values, or a post-reboot session in which third-party security drivers/services
    failed to start?
  context: 'Still under Evict (D3-EVC), a reboot that boots into Safe Mode is a failed or weaponized eviction:
    Safe Mode loads only core Microsoft drivers, so EDR, AV, and host-firewall agents typically do NOT
    start, giving an adversary an unmonitored environment - the technique behind MITRE ATT&CK T1688 (Safe
    Mode Boot). Deterministically detect the precursors and the outcome: Sysmon EID 1 command lines running
    ''bcdedit /set ... safeboot minimal|network'', Sysmon EID 13 registry writes to HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot
    or asterisk-prefixed Run values (which force a program to run even in Safe Mode), and a post-reboot
    state where expected security drivers/services did not load. A positive finding means the reboot did
    not produce the clean, fully-monitored boot eviction requires - treat it as adversary preparation
    to operate undefended and escalate immediately. Reference: [Safe Mode Boot, MITRE ATT&CK T1688](https://attack.mitre.org/techniques/T1688/).'
  answer_sources:
  - Windows Event ID 6005
  - Sysmon Event ID 1
  - Sysmon Event ID 13
  - Windows Registry (BCD / SafeBoot keys)
  - 'NAI: All managed Windows endpoints, particularly critical servers and high-value user workstations
    targeted for eviction.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from process_creation (Sysmon EID 1)\n| where CommandLine matches /bcdedit.*\\/set.*safeboot.*(minimal|network)/i\n\
      | union (from registry_set (Sysmon EID 13)\n    where TargetObject contains 'CurrentControlSet\\\
      \\Control\\\\SafeBoot'\n       OR (TargetObject contains '\\\\Run\\\\' AND Details startswith '*'))\n\
      | alert: Safe Mode persistence/boot manipulation (T1688)"
  - technology: SIEM/Rule pseudocode
    query: 'from windows_system_log where EventID==6005 (boot)

      | join post_boot security_service_start within 10m

      | eval safe_mode = (expected_security_drivers_started == false)

      | alert if safe_mode == true'
- question: After each post-reboot 6005, did every security service/driver on the host's expected manifest
    (EDR agent, Sysmon, AV, host firewall) actually start, and did any NEW kernel service appear (Event
    ID 7045) - especially a driver matching the LOLDrivers/BYOVD vulnerable-driver feed?
  context: Within Evict (D3-EVC), a successful eviction reboot must come back with full defensive coverage.
    Maintain a per-host manifest of the security services/drivers expected to start at boot and require
    their start events after every 6005. If an expected agent fails to start, the reboot left the host
    blind - possibly because the adversary disabled defenses through the reboot rather than being evicted
    by it. Equally important, a new kernel service (Event ID 7045) appearing around the reboot can indicate
    the reboot was abused to load a vulnerable or malicious driver (Bring-Your-Own-Vulnerable-Driver);
    cross-reference loaded drivers against the LOLDrivers feed. A positive finding (missing expected agent
    OR a known-bad/unknown new driver) means the reboot did not achieve clean eviction and may have made
    the host less defended - escalate. Cross-reference loaded drivers against the [LOLDrivers (BYOVD)
    feed](https://www.loldrivers.io/).
  answer_sources:
  - Windows Event ID 6005
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - 'NAI: All managed Windows endpoints, particularly critical servers and high-value user workstations
    targeted for eviction.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from windows_system_log EventID==6005 as boot

      | lookup expected_security_manifest[host] as expected

      | join service_start events within 10m of boot as started

      | eval missing = expected - started

      | alert if missing is non-empty'
  - technology: SIEM/Rule pseudocode
    query: 'from windows_system_log EventID==7045 (new service install)

      | where _time within +/- 15m of boot

      | lookup loldrivers_feed on ImagePath_hash

      | alert if hash in loldrivers OR ImagePath unsigned OR service unseen_before'
- question: Which critical assets lack a verified remote reboot capability through an approved management
    channel (EDR, WinRM, or out-of-band/IPMI), leaving an eviction-readiness coverage gap if the host
    must be rebooted without physical access?
  context: 'Eviction (D3-EVC) depends on being able to actually trigger the reboot. Maintain an inventory
    of assets that can be remotely rebooted through approved management channels and reconcile it against
    your critical-asset list. A critical system that has no verified remote-reboot path is a readiness
    gap: if it is compromised and unresponsive, responders may be unable to evict without physical intervention,
    slowing containment. This is a proactive coverage check rather than an incident detection - a positive
    finding is a high-value host missing a tested remote-reboot capability, which should be remediated
    before an incident forces the issue.'
  answer_sources:
  - Windows Event ID 1074
  - 'NAI: All managed Windows endpoints, particularly critical servers and high-value user workstations
    targeted for eviction.'
  range: Current state (point-in-time inventory)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from asset_inventory where criticality in (high, critical)

      | lookup remote_reboot_capability (EDR_managed OR WinRM_enabled OR IPMI_OOB)

      | eval gap = NOT (EDR_managed OR WinRM_enabled OR IPMI_OOB)

      | where gap == true

      | output coverage_gap report for eviction readiness'
- question: Over a 30-90 day rolling baseline, which hosts exceed the 95th-percentile reboot frequency
    (count/day) or show reboot-cycle durations (6006 -> 6005 delta) beyond mean + 2 standard deviations
    for their role, after excluding scheduled patch-cycle days?
  context: 'Within Evict (D3-EVC), abnormal reboot behavior can reveal instability, repeated failed eviction
    attempts, or attacker action. Compute per-host reboot frequency and reboot-cycle duration (time from
    clean shutdown 6006 to next boot 6005) over a rolling 30-90 day window and flag hosts above the 95th-percentile
    frequency or with cycle durations exceeding mean + 2*sigma, using the per-host rolling mean + k*sigma
    method (Dwyer & Truta). Derive role-specific thresholds - servers typically reboot less than once
    a week, so excluding planned patch days, a server rebooting repeatedly is anomalous. A positive finding
    is a host whose reboot rhythm departs sharply from its own and its role''s norm, which warrants checking
    whether eviction succeeded or the host is being repeatedly cycled. Method reference (per-host rolling
    mean + k*sigma): [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6005
  - Windows Event ID 6006
  - Windows Event ID 6008
  - 'NAI: All managed Windows endpoints grouped by role (servers vs. workstations vs. kiosks).'
  range: Last 90 days (30-90 day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from windows_system_log EventID in (6005,6006,1074)

      | eval cycle_dur = next(6005).time - 6006.time

      | where NOT day in patch_cycle_days

      | stats count as reboots_per_day, mean(cycle_dur) m, stdev(cycle_dur) s by host, role, day

      | eval freq_p95 = percentile95(reboots_per_day) over role

      | alert if reboots_per_day > freq_p95 OR cycle_dur > m + 2*s'
- question: Has any host shown an unexpected shutdown (Event ID 6008) on a normally-stable server, a greater-than-3-sigma
    spike in its 6008 rate, or a reboot occurring outside its normal maintenance window / time-of-day
    distribution?
  context: 'Continuing the baselining under Evict (D3-EVC), profile the failure mode explicitly. Baseline
    each host''s rate of unexpected (dirty) shutdowns (Event ID 6008) and the time-of-day distribution
    of its reboots, then alert on any 6008 on a stable server, a >3-sigma spike in 6008 rate, or a reboot
    outside the host''s normal maintenance window (Dwyer & Truta). Dirty shutdowns matter because eviction
    reboots should be clean; a cluster of 6008 events can indicate crash-on-eviction (e.g., a buggy implant
    or BYOVD driver), or an attacker tampering with the host. Off-hours reboots can signal an adversary
    triggering reboots to load Safe Mode or to re-launch persistence. A positive finding is anomalous
    failure-mode or timing behavior that contradicts a clean, scheduled eviction. Method reference: [Finding
    Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6005
  - Windows Event ID 6006
  - Windows Event ID 6008
  - 'NAI: All managed Windows endpoints grouped by role (servers vs. workstations vs. kiosks).'
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from windows_system_log EventID==6008

      | stats count as dirty by host, day

      | eval base_mean=mean(dirty), base_sd=stdev(dirty) over baseline window per host

      | alert if (role==server AND dirty>0) OR dirty > base_mean + 3*base_sd'
  - technology: SIEM/Stats pseudocode
    query: 'from windows_system_log EventID in (1074,6005)

      | eval hour = hour_of(_time)

      | baseline maintenance_window[host] from historical reboot hour distribution

      | alert if hour NOT in maintenance_window[host]'
- question: For each evicted host, comparing pre- vs post-reboot egress, did a regular beacon to a specific
    destination (coefficient of variation of inter-arrival times < 0.1) reappear within minutes of the
    boot 6005, and how do outbound byte volume and connection frequency change across the reboot boundary?
  context: 'Within Evict (D3-EVC), the clearest network proof of a successful eviction of a memory-resident
    implant is that its C2 beacon stops. Compare per-host outbound volume (bytes), connection frequency
    (conns/min), and per-destination periodicity in Zeek conn.log before and after the reboot, applying
    FFT/periodicity scoring (BAYWATCH; operationally RITA). If a destination with a tight, regular beacon
    (CV of inter-arrival times < 0.1) reappears within minutes of the 6005 boot event, the implant was
    almost certainly re-launched by surviving persistence - a failed eviction. A clean result (beacon
    gone, volume/frequency dropped to a benign baseline) supports successful eviction. Correlate strictly
    by host IP across the reboot boundary so pre/post comparison is apples-to-apples. References: FFT/periodicity
    scoring per [BAYWATCH, Hu et al.](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    operational implementation via [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Firewall connection logs
  - 'NAI: Egress for evicted hosts; correlate by host IP across the reboot boundary.'
  range: Last 30 days; centered on each reboot (compare 24h pre vs 24h post)
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log split by host_ip into pre(<boot) and post(>=boot 6005)

      | per dest: inter_arrival = diff(ts); cv = stdev(inter_arrival)/mean(inter_arrival)

      | fft_periodicity_score(dest)

      | alert if dest has cv < 0.1 AND first_post_conn within 5m of boot AND dest present in pre'
  - technology: SIEM/Stats pseudocode
    query: 'stats sum(bytes) as vol, count as conns by host, period(pre|post), dest

      | eval delta_vol = post.vol - pre.vol

      | flag dest where post beacon resumed despite reboot'
- question: After suppressing the host's known-benign periodic flows (OS/app update checks, telemetry,
    NTP), are there any NEW periodic destinations or known-bad destinations appearing post-reboot, and
    is there a surge in post-reboot NXDOMAIN/refused-connection rates consistent with a re-launched implant
    cycling dead DGA C2?
  context: 'To keep the post-reboot beacon assessment (Evict, D3-EVC) actionable, allowlist the host''s
    known-benign periodic flows - update checks, telemetry, NTP - using periodic-traffic characterization
    (Mack et al.) so that only NEW periodic destinations appearing after the reboot, or known-bad destinations,
    escalate. Add a failure-mode signal: profile post-reboot NXDOMAIN and refused-connection rates in
    Zeek dns.log/conn.log. A surge of failed resolutions - especially to algorithmically-generated (DGA)
    domains - shortly after the boot indicates a re-launched implant cycling through dead C2 domains,
    i.e., persistence survived the reboot. A positive finding is a new periodic/known-bad destination
    or a DGA-like NXDOMAIN spike that was not present pre-reboot. Reference for periodic-traffic characterization:
    [Mack et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Firewall connection logs
  - 'NAI: Egress for evicted hosts; correlate by host IP across the reboot boundary.'
  range: Last 30 days; centered on each reboot
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log post-reboot periodic destinations

      | anti-join benign_periodic_allowlist[host]

      | union known_bad_destinations

      | alert on NEW periodic dest OR known-bad dest not seen pre-reboot'
  - technology: Zeek/pseudocode
    query: 'from dns.log post-reboot

      | stats count(rcode==NXDOMAIN) as nx, count as total by host

      | eval nx_rate = nx/total, dga_score = entropy(queried_names)

      | alert if nx_rate >> pre_reboot_rate AND dga_score high'
- question: For implants that randomize beacon intervals to defeat FFT periodicity, does an LSTM/transformer
    time-series model scoring post-reboot inter-arrival sequences flag a returning, jittered-but-regular
    cadence to a prior C2 destination - and what are the top-3 contributing features?
  context: 'Some implants deliberately jitter their callback intervals to evade the deterministic periodicity
    checks. Under Evict (D3-EVC), run an ML time-series model (LSTM/transformer, Gupta et al.) over post-reboot
    connection inter-arrival sequences IN PARALLEL with - not as a replacement for - the FFT/CV checks
    above. The model can recognize a beacon whose intervals are randomized but statistically regular,
    especially when it returns to a destination seen pre-reboot with asymmetric byte ratios. A positive
    score after the reboot is strong evidence the implant was re-launched by surviving persistence (failed
    eviction). The alert must surface the top-3 contributing features (e.g., returning destination, jittered-but-regular
    cadence, byte-ratio asymmetry) so an analyst can validate the model''s reasoning rather than trust
    a black box. Reference: [C2 Beaconing Detection via AI-Based Time-Series Analysis, Gupta et al.](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Firewall connection logs
  - 'NAI: Egress for evicted hosts; correlate by host IP across the reboot boundary.'
  range: Last 30 days; centered on each reboot
  queries:
  - technology: ML/pseudocode
    query: 'model = LSTM/transformer trained on benign vs C2 inter-arrival sequences

      X = post_reboot_conn_series[host] (inter_arrival, bytes_ratio, dest)

      score = model.predict(X)

      | run in parallel with FFT/CV periodicity checks

      | alert if score > threshold; emit top3 SHAP features (returning_dest, jittered_cadence, byte_asymmetry)'
- question: Does the post-reboot host provenance graph contain a known reboot-surviving attack pattern
    - e.g., a boot-config/registry autostart write -> service install (Event ID 7045) -> post-boot process
    spawn -> outbound C2 - when matched inexactly against kernel-audit/Sysmon provenance?
  context: 'A reboot only evicts non-persistent, memory-resident code; persistence mechanisms re-launch
    malicious activity at boot. Under Evict (D3-EVC), encode known reboot-surviving attack patterns as
    provenance query graphs and perform inexact subgraph matching against Sysmon/auditd provenance (POIROT).
    A canonical pattern is: a write to a boot-config or registry autostart location, followed by a service
    install (Event ID 7045), followed by a post-boot process spawn, followed by an outbound C2 connection.
    Inexact (approximate) subgraph matching resists single-event evasion because the adversary must avoid
    the whole causal structure, not just one indicator. A match on the post-reboot graph confirms that
    persistence survived the reboot - a failed eviction requiring deeper eradication. Reference: [POIROT,
    Milajerdi et al.](https://dl.acm.org/doi/10.1145/3319535.3363217).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Windows Event ID 7045
  - Linux auditd execve
  - 'NAI: Endpoints under eviction; whole-host process/file/registry/network provenance across the reboot
    boundary.'
  range: Last 90 days; correlate across the reboot boundary
  queries:
  - technology: Graph/pseudocode
    query: 'build provenance_graph from (Sysmon EID 1,3,11,13; Win EID 7045; auditd execve) post-reboot

      query_graph Q = autostart_write -> service_install(7045) -> process_spawn -> outbound_c2(EID 3)

      | inexact_subgraph_match(Q, provenance_graph)  // POIROT

      | alert if match_score >= threshold => persistence survived reboot'
- question: Among post-reboot process causal paths weighted by IDF-style rarity, does a rare causal chain
    that also existed pre-reboot re-emerge (the same anomalous parent->child sequence auto-started at
    boot), and did any autostart/service/scheduled-task get created with a binary hash unseen before the
    incident?
  context: 'Continuing reboot-surviving persistence hunting under Evict (D3-EVC), extract post-reboot
    process causal paths, weight them by IDF-style rarity, and score with Local Outlier Factor (ProvDetector).
    The high-confidence failed-eviction signal is a rare causal chain that existed before the reboot and
    re-emerges afterward - the same anomalous parent->child sequence being auto-started at boot - because
    that is exactly what surviving persistence looks like. Keep a deterministic floor regardless of the
    statistical score: always alert on the creation of any autostart entry, service, or scheduled task
    whose binary hash was never seen before the incident. A positive finding is a re-emergent rare chain
    or a brand-new persistence binary, both indicating the reboot did not fully evict. Reference: [ProvDetector,
    Wang et al.](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Windows Event ID 7045
  - Linux auditd execve
  - 'NAI: Endpoints under eviction; whole-host process/file/registry/network provenance across the reboot
    boundary.'
  range: Last 90 days; correlate across the reboot boundary
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'extract causal_paths from provenance pre & post reboot

      | weight each edge by IDF rarity; score path with LocalOutlierFactor  // ProvDetector

      | alert if rare_path present pre AND re-emerges post (same anomalous parent->child auto-started
      at boot)

      | FLOOR: always alert on new autostart/service/scheduled-task where binary_hash unseen_before_incident'
- question: Do node-level GNN and whole-system temporal/masked-graph models flag re-emergent malicious
    nodes or subgraphs in the post-reboot provenance, and can they identify the specific surviving persistence
    node for analyst triage?
  context: 'As the ML complement to the symbolic/statistical persistence checks under Evict (D3-EVC),
    score post-reboot provenance at the node level with a GNN (ThreaTrace) and with whole-system temporal/masked-graph
    models (KAIROS, MAGIC) to flag re-emergent malicious nodes/subgraphs and pinpoint the surviving persistence
    node. Run these in parallel with the POIROT-style matching and ProvDetector scoring rather than as
    a replacement, so deterministic and learned methods cross-validate. The value of the graph models
    is localization: they can reconstruct the attack subgraph and rank anomalous nodes. The alert must
    surface the reconstructed subgraph and the top-3 anomalous nodes so the analyst can confirm which
    persistence mechanism survived the reboot and target it for eradication. References: node-level GNN
    [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333) (code: [GitHub](https://github.com/threaTrace-detector/threaTrace));
    whole-system temporal/masked-graph models [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf)
    and [MAGIC, Jia et al.](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Windows Event ID 7045
  - Linux auditd execve
  - 'NAI: Endpoints under eviction; whole-host process/file/registry/network provenance across the reboot
    boundary.'
  range: Last 90 days; correlate across the reboot boundary
  queries:
  - technology: ML/pseudocode
    query: 'node_scores = ThreaTrace_GNN(post_reboot_provenance)

      subgraph_anom = KAIROS/MAGIC(temporal masked graph)

      | run parallel to POIROT + ProvDetector

      | alert on re-emergent malicious nodes/subgraphs

      | emit reconstructed attack subgraph + top3 anomalous nodes (surviving persistence node)'
- question: After the reboot, did the host's EDR heartbeat and event volume (process/registry/network/driver
    telemetry) drop by a statistically significant amount, or did service-stop/driver-load events spike
    around the reboot - indicating the reboot disabled defenses rather than evicting the adversary?
  context: 'An adversary may use (or co-opt) a reboot to disable defenses rather than be evicted by it.
    Under Evict (D3-EVC), baseline each host''s normal post-boot EDR heartbeat and event volume, then
    look for a statistically significant drop (z-score/percentile) in process/registry/network/driver
    telemetry after the reboot, or a spike in service-stop and driver-load events around it (CardinalOps
    EDR-killer method). A telemetry collapse after the reboot means the host came back blind - the reboot
    likely disabled monitoring (an EDR-killer or BYOVD) instead of removing the threat. A positive finding
    is a significant post-reboot telemetry deviation, which inverts the assumption of successful eviction
    and should be escalated, since you can no longer trust the host''s own logs. Reference: [Detecting
    EDR Killers Using Statistical Deviations, CardinalOps](https://www.cardinalops.com/blog/detecting-edr-killers-using-statistical-deviations/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Sysmon Event ID 13
  - Windows Event ID 7045
  - Linux auditd execve
  - 'NAI: Endpoints under eviction; whole-host process/file/registry/network provenance across the reboot
    boundary.'
  range: Last 90 days (rolling baseline); centered on each reboot
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per host: mean/sd of EDR heartbeat + event_volume(process,registry,network,driver)
      post-boot

      | compute z = (post_reboot_volume - mean)/sd

      | alert if z < -2 (telemetry drop) OR spike in service_stop/driver_load events near reboot'
- question: Comparing memory scans taken immediately before and after the reboot, is the malicious signature/pattern
    that was present pre-reboot now absent - and are there re-injection markers (Sysmon EID 8 CreateRemoteThread
    or EID 10 ProcessAccess into sensitive processes) appearing shortly after boot?
  context: 'For threats the reboot is specifically meant to remove - code that lives only in volatile
    memory - the definitive eviction proof is a memory diff. Under Evict (D3-EVC), scan resident memory
    for malicious patterns immediately before and after the reboot (MINI-ME approach). A signature present
    pre-reboot and absent post-reboot confirms the fileless implant was cleared by the power cycle. If
    the pattern persists, or re-injection markers appear shortly after boot - Sysmon EID 8 (CreateRemoteThread)
    or EID 10 (ProcessAccess) into sensitive processes like lsass.exe - the eviction failed and the implant
    was re-launched. A positive (failure) finding is persistence of the memory signature or fresh injection
    activity into sensitive processes right after the reboot. Reference for the memory-scanning / signature-matching
    approach: [Near-Memory & In-Memory Detection of Fileless Malware (MINI-ME), Botacin et al.](https://web.inf.ufpr.br/mazalves/wp-content/uploads/sites/13/2021/03/memsys2020.pdf).'
  answer_sources:
  - Memory scan results (EDR/AV)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 10 (ProcessAccess)
  - 'NAI: Hosts evicted specifically for suspected fileless/injected malware.'
  range: Last 90 days; centered on each reboot (immediate pre/post scans)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'diff = memory_scan(pre_reboot) vs memory_scan(post_reboot)

      | eval evicted = signature in pre AND signature NOT in post

      | eval failed  = signature in post OR re-injection

      | re-injection = Sysmon EID 8/10 targeting sensitive_process within 15m of boot

      | alert if failed == true'
- question: Modeling the normal ordered sequence of boot/service-start log keys with an LSTM (DeepLog),
    does the host's post-reboot log-key sequence fall outside the top-g predicted keys - e.g., a missing
    EDR service-start key, an unexpected post-boot process key, or a Safe-Mode boot ordering - and which
    deviating log key(s) triggered the alert?
  context: 'A clean eviction reboot produces a stable, predictable sequence of boot and service-start
    log events. Under Evict (D3-EVC), model that normal ordered sequence of log keys with an LSTM (DeepLog):
    a benign clean boot yields a sequence whose next key is always within the model''s top-g predictions,
    whereas a missing EDR service-start key, an unexpected post-boot process key, or a Safe-Mode boot
    ordering falls outside the predictions and flags an incomplete or abnormal eviction. This catches
    deviations that simple per-event rules miss because it reasons about ordering and context. For explainability,
    the alert must include the specific deviating log key(s) so the analyst knows exactly what was missing
    or unexpected in the boot sequence. Reference: [DeepLog, Du et al.](https://acmccs.github.io/papers/p1285-duA.pdf).'
  answer_sources:
  - Memory scan results (EDR/AV)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 10 (ProcessAccess)
  - 'NAI: Hosts evicted specifically for suspected fileless/injected malware.'
  range: Last 90 days; per reboot
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered boot/service-start log keys post-reboot (6005,7045,service_start,Sysmon EID1)

      model = DeepLog LSTM trained on normal clean-boot key sequences

      | for each key: if key NOT in model.top_g(predicted) -> anomaly

      | alert on missing EDR-start key / unexpected process key / safe-mode ordering

      | emit deviating log key(s) for explainability'
- question: Using reboot metadata, host role, pre/post network behavior, telemetry-health delta, and prior
    incident outcomes, what is the predicted probability that the reboot alone was insufficient to evict
    the adversary, and which hosts should be routed to deeper eradication playbooks?
  context: 'To prioritize response under Evict (D3-EVC), train a model that fuses the signals from the
    other checks - reboot metadata, host role, pre/post network behavior (Gupta et al.), telemetry-health
    delta, and prior incident outcomes, plus provenance signals (ThreaTrace) - to predict the probability
    that a reboot alone was insufficient. Hosts with a high predicted risk are automatically routed to
    deeper eradication playbooks (reimage, credential reset, full forensics) rather than being assumed
    clean. The model is a triage/routing aid layered on top of the deterministic and statistical detections,
    not a replacement. The alert must output the top-3 contributing features (e.g., returning beacon destination,
    surviving service, EDR-heartbeat drop) so the analyst understands why a host was flagged high-risk
    and can validate the recommendation. References: combine network signals [Gupta et al.](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20)
    and provenance signals [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Memory scan results (EDR/AV)
  - Sysmon Event ID 8 (CreateRemoteThread)
  - Sysmon Event ID 10 (ProcessAccess)
  - 'NAI: Hosts evicted specifically for suspected fileless/injected malware.'
  range: Last 90 days; per reboot
  queries:
  - technology: ML/pseudocode
    query: "features = [reboot_metadata, host_role, pre_post_network_delta, telemetry_health_delta, prior_incident_outcome,\n\
      \            provenance_signal(ThreaTrace), beacon_signal(Gupta)]\np_insufficient = risk_model.predict_proba(features)\n\
      | if p_insufficient > threshold -> route host to deeper eradication playbook\n| emit top3 contributing\
      \ features (returning_beacon_dest, surviving_service, EDR_heartbeat_drop)"
