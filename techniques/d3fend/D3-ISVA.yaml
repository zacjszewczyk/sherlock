name: 'D3-ISVA: Inbound Session Volume Analysis'
id: 19b74fce-bf7b-4c15-8625-efff00e06532
description: Investigate abnormal inbound network session-volume conditions across our internet-facing
  perimeter so an analyst can determine whether exposed services are under reconnaissance, resource-exhaustion,
  or volumetric/distributed denial-of-service (DoS/DDoS) attack. This playbook helps establish per-service
  baselines for inbound connection telemetry (Zeek conn.log, firewall logs, Suricata/IDS alerts) and then
  hunt for sudden surges, sustained excess traffic, coordinated activity from suspicious or known-bad
  source sets, asymmetric inbound/outbound volume ratios, concurrent-connection saturation, and abnormal
  connection-state or failed-handshake mixes (SYN-only S0, REJ, RST) versus expected behavior. It layers
  deterministic symbolic-logic rules (threat-intel matching, per-source rate thresholds, connection-state
  ratios, asymmetric volume ratios, concurrency ceilings), statistical baselining (sigma/MAD/percentile
  surge detection, ARIMA/Prophet forecasting, CUSUM/change-point onset detection, entropy and wavelet
  signal analysis), and explainable machine-learning scoring (Isolation Forest, online autoencoder reconstruction,
  PCA subspace residuals, supervised flow classification) to catch both high-volume floods and low-and-slow
  resource-exhaustion attacks like Slowloris. Use it to detect flood onset early, attribute the targeted
  service, and triage suspect source clusters before availability is lost.
type: technique
