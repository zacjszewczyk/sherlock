    Escalate sensors whose predicted retention horizon or continuity falls outside acceptable bounds,
    surfacing the top-3 drivers in the alert (volume growth, gap rate, storage limit) so remediation is
    targeted. The deterministic policy-floor rule remains the baseline. Because network capture volume
    tends to grow with the environment, this forecast is the early warning that storage will soon be outpaced;
