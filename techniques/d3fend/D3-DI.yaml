name: 'D3-DI: Data Inventory'
id: 1dfc588f-1bfb-4136-ac11-49a838f96b9a
description: Investigate the completeness, freshness, retention, and coverage of the security telemetry
  and data repositories that constitute our asset and data inventory, so an analyst can confirm we actually
  have the visibility we assume we have. This playbook helps catalog every host and network log source
  (Windows Event Logs, Sysmon, Unix auditd, antivirus, EDR, NetFlow, Zeek, PCAP, network appliances) against
  the asset inventory, measure ingest volume and event baselines, track earliest/latest event timestamps
  and retention spans, and discover high-volume data repositories and heavily accessed shares along with
  the general data types they hold. It layers deterministic coverage/retention rules (hard gaps, stopped
  collection, policy-floor violations), statistical baselining and change-point detection of volumes,
  continuity, and failure-state rates, and explainable unsupervised/forecasting models that surface telemetry
  drift, blind spots, and repository clusters. Use it to find silent collection loss, monitoring blind
  spots, retention degradation, and unclassified or duplicated copies of sensitive data before an adversary
  exploits the gap.
type: technique
related:
- tactic_id: D3-AI
  tactic_name: Asset Inventory
contributors:
- Zachary Szewczyk
