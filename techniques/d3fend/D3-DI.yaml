questions:
- question: Which hosts in the asset inventory are missing one or more expected host telemetry sources
    (Windows Event Logs, Sysmon, Unix auditd, antivirus, EDR), which assets have produced zero events
    in the last 24 hours, and which critical servers lack Sysmon/Security process-creation events (Event
    ID 1 / 4688)?
  context: 'This question establishes deterministic ground truth for host visibility under the Asset Inventory
    tactic. Catalog every host log type and build a coverage matrix by joining each source against the
    authoritative asset inventory, recording each source''s schema (event-ID set, fields), format, and
    owner per CIS Critical Security Controls v8 Control 3 data-inventory/data-flow guidance and deterministic
    relational-profiling rules. Any asset reporting zero events in the last 24h is a hard coverage GAP,
    and any critical server missing process-creation telemetry (Sysmon Event ID 1 or Security 4688) is
    a deterministic failure that blinds most downstream detection. Tune the 24h gap threshold per host
    role from observed reporting cadence. A positive result means detections on that asset cannot be trusted
    until collection is restored. Sources: [CIS Critical Security Controls v8 Control 3: Data Protection](https://www.cisecurity.org/controls/data-protection);
    [Profiling Relational Data](https://hpi.de/fileadmin/user_upload/fachgebiete/naumann/publications/PDFs/2015_abedjan_profiling.pdf).'
  answer_sources: &id001
  - Windows Event logs
  - Sysmon events
  - Unix auditd logs
  - antivirus alerts
  - EDR logs
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM asset_inventory a

      LEFT JOIN host_logs h ON a.host = h.host AND h.ts > now()-24h

      STATS sources = set(h.source), evt_count = count() BY a.host, a.role

      | EVAL gap = (evt_count == 0)

      | EVAL missing_proc = a.role==''critical_server'' AND NOT (1 IN h.event_id OR 4688 IN h.event_id)

      | WHERE gap OR missing_proc OR expected_sources(a.role) - sources != {}

      | ALERT ''host_telemetry_coverage_gap'''
- question: For each host log source, does the current hourly ingest volume (events/min and bytes/min)
    or key event-type rate (e.g., process creation) fall below mean-3*stddev or above mean+3*stddev of
    its 30+ day per-host-role baseline, is there a change-point/structural break in the collection series,
    and is the forwarder-error or log-clear (Event ID 1100/1102) rate elevated?
  context: 'This question detects silent telemetry loss and abnormal surges under the Asset Inventory
    tactic by baselining host log volume statistically. For each source compute time-series of ingest
    volume over at least 30 days and per-host-role descriptive statistics (mean, median, p95, stddev)
    for key event types. A drop below mean-3*stddev is a silent-loss FAILURE mode (collection degraded
    without an outright outage); a spike above mean+3*stddev can indicate flooding, noisy redeployment,
    or attacker activity. Apply change-point detection (CUSUM / Bayesian online CPD) to flag structural
    breaks in collection, and profile the failed/dropped-event rate (forwarder errors, EventID 1100/1102
    log-clear) as a distinct state signal because log clearing is itself an anti-forensics indicator.
    A positive result warrants investigating whether visibility was lost accidentally or deliberately.
    Sources: [the Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518); [Profiling Relational
    Data](https://hpi.de/fileadmin/user_upload/fachgebiete/naumann/publications/PDFs/2015_abedjan_profiling.pdf);
    [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM host_logs WHERE ts > now()-30d

      BIN time SPAN=1h | STATS vol=count(), bytes=sum(size) BY host, role, source, bin

      | EVAL mu=mean(vol) OVER(host,source), sd=stddev(vol) OVER(host,source)

      | WHERE vol < mu-3*sd OR vol > mu+3*sd

      | APPEND changepoint(vol_series) AS cp

      | APPEND clear_rate = rate(event_id IN (1100,1102))

      | ALERT ''host_volume_anomaly_or_logclear'''
- question: When host telemetry is scored with an unsupervised anomaly model over per-host features (ingest
    volume, event-type mix, source presence, mean inter-event interval), which hosts diverge from their
    learned benign baseline, and what are the top-3 contributing features behind each alert?
  context: 'This question applies explainable machine learning to catch multivariate host-visibility drift
    that single-metric rules miss, supporting the Asset Inventory tactic. Train an unsupervised model
    (Isolation Forest or autoencoder) on benign per-host features and flag hosts whose current pattern
    diverges from baseline, indicating degraded visibility or a behavioral change. Every alert should
    surface the top-3 contributing features (e.g., ''process-creation rate -80%, auditd absent, byte volume
    -65%'') via LIME/SHAP-style attribution so analysts can validate and triage rather than chase a bare
    score. The deterministic gap and 3-sigma rules remain the non-negotiable floor; the ML runs in parallel
    to surface subtle, correlated degradation. A high score with interpretable drivers is an actionable
    lead to investigate whether a host''s collection or behavior has meaningfully changed. Sources: [Malware
    Detection for IoT Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/);
    [Robust IoT security using isolation forest and one class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(host_logs:\n  ingest_volume, event_type_mix, source_presence, mean_inter_event_interval)\n\
      model = IsolationForest().fit(benign_history)\nscores = model.decision_function(X)\nFOR host WHERE\
      \ score in top_outliers:\n  emit alert WITH top3 = SHAP(model, host)\n# deterministic gap + 3-sigma\
      \ rules continue to run as the floor"
- question: For each cataloged host log source, what are the earliest and latest event timestamps and
    retention Span_Days across all reporting hosts, which sources fall below the policy retention floor
    (e.g., <90 days for security telemetry), and which have a max timestamp older than 24h (collection
    STOPPED)?
  context: 'This question builds the deterministic host retention picture for the Asset Inventory tactic.
    For each source query the min and max event timestamps across all reporting hosts and build a retention
    table (Log Source, Earliest Event, Latest Event, Span_Days), enriched with retention-policy targets
    from CIS Control 3. Deterministically flag any source whose Span_Days is below the policy floor (insufficient
    history for investigations and threat hunting) and any source whose max timestamp is older than 24h,
    which signals a STOPPED collection state. Use automated schema/metadata extraction so the table stays
    current without manual upkeep. A positive result means either an incident may fall outside the retained
    window or that a feed has silently stopped reporting. Sources: [CIS Critical Security Controls v8
    Control 3: Data Protection](https://www.cisecurity.org/controls/data-protection); [Goods](https://static.googleusercontent.com/media/research.google.com/en//pubs/archive/45390.pdf).'
  answer_sources: &id002
  - Windows Event logs
  - Sysmon events
  - Unix auditd logs
  - antivirus alerts
  - EDR logs
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM host_logs

      STATS earliest=min(ts), latest=max(ts) BY source

      | EVAL span_days = (latest - earliest)/1d

      | EVAL stopped = (now() - latest) > 24h

      | EVAL below_floor = span_days < retention_floor(source)

      | WHERE stopped OR below_floor

      | ALERT ''host_retention_shortfall_or_stopped'''
- question: Which host log sources fall below the 10th percentile of their peer-group retention or have
    daily event continuity below 0.95 (repeated daily gaps), and what is the count and longest run of
    zero-event days per source?
  context: 'This question statistically ranks host sources to expose retention and continuity outliers
    under the Asset Inventory tactic. Compute retention Span_Days and daily event continuity (days with
    >0 events / total days) per source, then compare across hosts and source types using descriptive statistics
    and percentile thresholds. Sources below the 10th percentile of peer-group retention or with continuity
    <0.95 indicate repeated daily GAPS. Quantify the failure mode explicitly by reporting the count and
    longest consecutive run of zero-event days per source as a distinct silent-loss metric, because a
    long unbroken gap is far more damaging to an investigation than scattered single-day misses. A positive
    result identifies the least reliable feeds that should be prioritized for remediation. Sources: [Profiling
    Relational Data](https://hpi.de/fileadmin/user_upload/fachgebiete/naumann/publications/PDFs/2015_abedjan_profiling.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM host_logs WHERE ts > now()-90d\nBIN time SPAN=1d | STATS day_count=count() BY source,\
      \ peer_group, bin\n| STATS span_days=count(distinct bin), continuity=avg(day_count>0),\n       \
      \ zero_days=count(day_count==0), longest_zero_run=max_run(day_count==0) BY source, peer_group\n\
      | EVAL p10 = percentile(span_days,10) OVER(peer_group)\n| WHERE span_days < p10 OR continuity <\
      \ 0.95\n| ALERT 'host_retention_outlier'"
- question: Based on time-series forecasting of daily ingest volume and gap frequency, which host log
    sources have a predicted retention horizon shrinking faster than historical norms, and what are the
    top-3 drivers (declining volume, rising gap rate, storage pressure)?
  context: 'This question forward-looks at host retention so degradation can be prevented rather than
    discovered after evidence is gone, supporting the Asset Inventory tactic. Train a time-series forecasting
    model on daily ingest volume and gap frequency to predict upcoming retention degradation, validating
    structural breaks with established change-point methods. Prioritize sources whose predicted retention
    horizon shrinks faster than historical norms, and surface the top-3 drivers in the alert (declining
    volume, rising gap rate, storage pressure) so the fix is obvious. The deterministic policy-floor rule
    remains the non-negotiable baseline; the forecast adds early warning. A positive result lets the team
    add capacity or fix a failing forwarder before the retention floor is breached. Sources: [Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); [Robust IoT security using isolation
    forest and one class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "series = daily(host_logs: volume, gap_frequency) BY source\nmodel = Forecast(series)  # e.g.,\
      \ Prophet/ARIMA with changepoint detection\nhorizon = model.predict_retention_horizon()\nFOR source\
      \ WHERE horizon.shrink_rate > historical_norm:\n  emit alert WITH top3_drivers = attribute(volume_trend,\
      \ gap_trend, storage)\n# deterministic policy-floor rule remains the baseline"
- question: Which network log sources (network appliances, NetFlow, Zeek, PCAP) are mapped to each collection
    point and storage location, which monitored segments have had no flows in the last hour (BLIND SPOT),
    and which expected Zeek log types (conn/dns/http/ssl/files) have been absent for more than an hour
    (feed failure)?
  context: 'This question establishes deterministic network visibility ground truth for the Asset Inventory
    tactic. Inventory all network log sources, map each to its collection point and storage location,
    and record each feed''s schema/fields per relational-profiling rules and the documented-data-flow
    safeguard of CIS Control 3. Compare inventoried sensors against expected segment coverage: any monitored
    segment with no flows in 1h is a BLIND SPOT, and any expected Zeek log type absent for >1h is a feed
    failure. These deterministic checks catch sensors that are powered off, mis-tapped, or silently dropping
    a log stream. A positive result means traffic on that segment or of that protocol is currently uninspected,
    an exploitable gap for an adversary moving laterally or exfiltrating data. Sources: [Profiling Relational
    Data](https://hpi.de/fileadmin/user_upload/fachgebiete/naumann/publications/PDFs/2015_abedjan_profiling.pdf);
    [CIS Critical Security Controls v8 Control 3: Data Protection](https://www.cisecurity.org/controls/data-protection).'
  answer_sources: &id003
  - Network appliance logs
  - NetFlow logs
  - Zeek logs
  - full packet capture (PCAP)
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM expected_segments s

      LEFT JOIN net_flows f ON s.segment=f.segment AND f.ts > now()-1h

      STATS flows=count(), logs=set(f.zeek_log) BY s.segment

      | EVAL blind_spot = (flows == 0)

      | EVAL missing_feed = {conn,dns,http,ssl,files} - logs != {}

      | WHERE blind_spot OR missing_feed

      | ALERT ''network_blind_spot_or_feed_failure'''
- question: For each network source, does per-sensor volume (flows/min, bytes/min) fall below mean-3*stddev
    of its 30+ day baseline, are there change-points in the ingest series, and are the failure-state signals
    elevated (Zeek conn.log S0/REJ conn_state rate and dns.log NXDOMAIN proportion)?
  context: 'This question statistically baselines network telemetry to detect sensor degradation and abnormal
    traffic states under the Asset Inventory tactic. For each source compute at least 30 days of volume
    and frequency baselines, and summarize protocol distribution in Zeek conn.log and top-requested domain
    frequency in dns.log with descriptive statistics. Alert on per-sensor volume below mean-3*stddev (sensor
    degradation or partial tap loss) and apply change-point detection to the ingest series. Track the
    FAILURE state explicitly: the rate of conn.log entries with conn_state S0/REJ (no response / rejected)
    and the dns.log NXDOMAIN proportion are distinct signals that can reveal scanning, misconfiguration,
    or DGA-style activity as well as collection problems. A positive result distinguishes a degraded sensor
    from a genuine shift in network behavior. Sources: [the Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518);
    [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM net_logs WHERE ts > now()-30d

      BIN time SPAN=1m | STATS vol=count(), bytes=sum(orig_bytes+resp_bytes) BY sensor, bin

      | EVAL mu=mean(vol) OVER(sensor), sd=stddev(vol) OVER(sensor)

      | WHERE vol < mu-3*sd

      | APPEND changepoint(vol_series)

      | APPEND s0_rej_rate = rate(conn_state IN (''S0'',''REJ'')), nxdomain_pct = ratio(dns.rcode==''NXDOMAIN'')

      | ALERT ''network_sensor_degradation_or_state_anomaly'''
- question: When network sensors are scored with an unsupervised model over per-sensor features (volume,
    protocol mix, DNS diversity, flow cardinality), which sensors diverge from expected patterns (degradation,
    missing feeds, unmodeled segments), and what are the top-3 contributing features?
  context: 'This question applies explainable machine learning to surface network blind spots and drift
    that single-metric thresholds miss, supporting the Asset Inventory tactic. Train an unsupervised model
    (Isolation Forest / autoencoder) on benign per-sensor features and flag sensors diverging from expected
    patterns, whether from degradation, a missing feed, or an unmodeled/new segment. Report the top-3
    contributing features per alert via LIME/SHAP-style attribution so analysts can act on the specific
    anomaly rather than a bare score. The deterministic blind-spot and 3-sigma rules continue running
    in parallel as the floor. A high score with interpretable drivers (e.g., ''protocol mix shifted, DNS
    diversity collapsed, flow cardinality -70%'') is an actionable lead that network visibility has changed
    in a way worth investigating. Sources: [Malware Detection for IoT Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/);
    [Robust IoT security using isolation forest and one class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(net_logs:\n  volume, protocol_mix, dns_diversity, flow_cardinality) BY sensor\n\
      model = IsolationForest().fit(benign_history)\nscores = model.decision_function(X)\nFOR sensor WHERE\
      \ score in top_outliers:\n  emit alert WITH top3 = SHAP(model, sensor)\n# deterministic blind-spot\
      \ + 3-sigma rules run in parallel as the floor"
- question: For each network source, what are the earliest and latest event timestamps and Span_Days,
    which sources have a latest event older than 1 hour (collection stopped), and which spans fall below
    the PCAP/flow retention policy floor?
  context: 'This question builds the deterministic network retention picture for the Asset Inventory tactic.
    For each network source retrieve earliest/latest event timestamps and compile a retention report (Log
    Source, Earliest Event, Latest Event, Span_Days) using automated metadata extraction, and compare
    each span to retention targets from CIS Control 3. Deterministically flag sources whose latest event
    is older than 1h (collection stopped) or whose span is below the PCAP/flow retention policy floor.
    Network retention is especially fragile because high-volume captures roll over quickly, so a short
    span can mean investigative evidence is already gone. A positive result indicates either a halted
    feed or insufficient history to investigate an incident that occurred outside the retained window.
    Sources: [Goods](https://static.googleusercontent.com/media/research.google.com/en//pubs/archive/45390.pdf);
    [CIS Critical Security Controls v8 Control 3: Data Protection](https://www.cisecurity.org/controls/data-protection).'
