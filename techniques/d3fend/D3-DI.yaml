- question: Which data stores, shares, and feeds hold regulated or sensitive data, what are their schemas,
    formats, volumes, and locations, and which stores match deterministic PII/PCI recognizers (Luhn-valid
    card numbers, SSNs, IBANs) or document fingerprints?
  context: 'This question performs deterministic discovery and classification of data repositories for
    the Asset Inventory / Data Inventory tactic. Identify and record the schemas, formats, volumes, and
    locations of stored and used data, applying single- and multi-column profiling (data type, value patterns,
    keys, inclusion dependencies) and the maintained inventory/classification safeguards of CIS Control
    3. Classify which stores hold regulated data using deterministic regex + checksum recognizers (payment
    cards via the Luhn algorithm, SSNs, IBANs) and exact/partial document fingerprinting, and map each
    feed from sensor through transport to its storage location. The goal is an authoritative inventory
    of where sensitive data actually lives, which is the prerequisite for protecting it. A positive match
    on an unexpected or unclassified store is a high-priority finding: sensitive data is sitting somewhere
    it was not known to be. Sources: [Profiling Relational Data](https://hpi.de/fileadmin/user_upload/fachgebiete/naumann/publications/PDFs/2015_abedjan_profiling.pdf);
    [CIS Critical Security Controls v8 Control 3: Data Protection](https://www.cisecurity.org/controls/data-protection);
    [Microsoft Presidio](https://microsoft.github.io/presidio/); [A Survey on Data Leakage Prevention
    Systems](https://www.sciencedirect.com/science/article/abs/pii/S1084804515002714).'
  answer_sources: &id005
  - Zeek
  - Windows Event Logs
  - Network Appliance Logs
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM data_stores st\nPROFILE columns(st) -> data_type, value_patterns, keys, inclusion_deps\n\
      | EVAL pii = match_recognizers(st.content,\n      [luhn_card, ssn_regex, iban_checksum]) OR doc_fingerprint(st.content)\
      \ IN sensitive_corpus\n| EVAL feed_path = map(sensor -> transport -> storage_location)\n| WHERE\
      \ pii AND st NOT IN classified_inventory\n| ALERT 'unclassified_sensitive_data_store'"
- question: Which internal hosts rank in the 99th percentile of total bytes transferred in Zeek conn.log
    (candidate data stores), which file types (Zeek files.log MIME/extension) and share paths (Windows
    Event ID 5145 access frequency) are most heavily used, and what is the failed/denied access count
    (5145 access-mask denials)?
  context: 'This question statistically discovers high-volume data repositories and heavily accessed shares
    under the Asset Inventory tactic. Analyze Zeek conn.log to rank internal hosts by total bytes transferred
    and flag the 99th percentile as candidate data stores (heavy-hitter volume baseline). Correlate with
    Zeek files.log MIME types/extensions and rank Windows Event ID 5145 share-access frequency to prioritize
    critical paths, and estimate sensitive-content volume per store using statistical content analysis
    (term-frequency / similarity thresholds). Report failed/denied access counts (5145 access-mask denials)
    as a distinct state signal, since a burst of denials can indicate reconnaissance or probing against
    a sensitive share. A positive result both enriches the data inventory with the busiest stores and
    flags shares experiencing abnormal access pressure. Sources: [the Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518);
    [A Survey on Data Leakage Prevention Systems](https://www.sciencedirect.com/science/article/abs/pii/S1084804515002714).'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek.conn WHERE local_orig OR local_resp

      STATS bytes=sum(orig_bytes+resp_bytes) BY host

      | EVAL p99 = percentile(bytes,99) | WHERE bytes >= p99   # candidate data stores

      JOIN zeek.files ON host -> STATS by mime_type, extension

      JOIN win_evt(5145) -> STATS access_freq=count(), denials=count(access_mask_denied) BY share_path

      | ALERT ''high_volume_repo_or_share_access_pressure'''
- question: When repositories are clustered on transfer volume, file-type distribution, share-access frequency,
    and observable-schema features, which hosts group together by data function, which duplicated or unclassified
    copies of sensitive data appear across stores (via MinHash/LSH content-similarity and NER classification),
    and what are the top-3 features placing each host in its cluster?
  context: 'This question applies machine learning to discover related and duplicated data repositories
    for the Data Inventory tactic. Cluster hosts on transfer volume, file-type distribution, share-access
    frequency, and observable-schema features to group repositories by data function, then use content-similarity
    signatures (MinHash/LSH) and enterprise-knowledge-graph discovery plus similarity/provenance inference
    to find duplicated or unclassified sensitive-data copies across stores. Augment field classification
    with ML named-entity recognition. Surface the top-3 features that placed a host in a repository cluster
