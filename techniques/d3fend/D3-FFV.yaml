name: 'D3-FFV: File Format Verification'
id: 1516e4b1-c5ce-4a45-9a54-bd58a99c0a28
description: 'Investigate File Format Verification (D3-FFV) as it manifests under Isolate. This playbook
  helps analysts confirm or refute the technique by examining: File format verification surfaces files
  whose declared type (filename extension and transport MIME header) and actual internal structure (magic
  bytes, parseable body) diverge, revealing masquerade used to bypass filtering and increase delivery
  success of malicious content. Primary signal works on first-party Zeek files.log (content-sniffed mime_type,
  byte counts, hashes) without external API lookups. Validates that a file''s byte-distribution physics
  match its claimed type, catching masquerade and embedded payloads that pass extension/MIME checks but
  whose content bytes (entropy, n-gram histogram) are inconsistent with the declared format. Operates
  on first-party file content captured at ingress; requires no external lookups. Detects polyglot and
  multi-format files that are simultaneously valid as more than one type, defeating single-signature extension/MIME
  validation, upload filters, and AV. Robust detection parses for co-present format structures and scores
  byte-level features; pairs naturally with content-disarm-and-reconstruction for isolation.'
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
