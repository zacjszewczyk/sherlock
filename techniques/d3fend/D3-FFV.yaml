    all three to agree. Alert when description vs magic, magic vs content, or description vs content disagree,
    or when the declared format fails to fully parse (structural malformation / truncation). Magic-byte
    signature typing follows [Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).
