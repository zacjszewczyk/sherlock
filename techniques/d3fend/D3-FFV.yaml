name: 'D3-FFV: File Format Verification'
id: 1516e4b1-c5ce-4a45-9a54-bd58a99c0a28
description: Investigate whether files crossing network ingress points (web proxies, email gateways) actually
  conform to their declared formats, or whether an adversary has masqueraded malicious content as a benign
  document, image, or archive to bypass filtering and reach endpoints. This playbook helps an analyst
  hunt for divergence between a file's declared type (filename extension and transport MIME header) and
  its true internal structure (magic bytes, parseable body, byte-distribution physics), for double extensions
  and trailing data past logical EOF, for polyglot and multi-format files that are simultaneously valid
  as more than one type, and for embedded executable or script payloads hidden inside otherwise valid
  containers. It combines deterministic symbolic-logic rules (extension/MIME comparison, three-way header/magic/content
  consistency, double-extension and trailing-data checks, multi-format co-presence parsing), statistical
  baselining (rarity of (extension, mime_type) pairs, mismatch and parse-failure burst detection, byte-frequency
  fileprints, entropy thresholding, size and completeness ratio anomalies), and machine-learning classification
  (content-only true-type detection, fragment-type recovery, polyglot byte-feature models, and unsupervised
  metadata anomaly scoring) to surface masquerade for isolation and content-disarm-and-reconstruction.
  Primary signal is drawn from first-party Zeek files.log and extracted file content, requiring no external
  API lookups, and is correlated with follow-on endpoint file access (Windows Event ID 4663).
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which files crossing network ingress points carry a filename extension that disagrees with
    their content-sniffed MIME type, especially benign-looking document or image extensions (.pdf, .docx,
    .jpg) that actually resolve to executable or script content?
  context: This is the deterministic floor for File Format Verification under the Isolate tactic. Zeek
    content-sniffs the true MIME type of each transferred file independently of the name the sender chose,
    so comparing the filename extension against the sniffed mime_type via an approved extension-to-type
    mapping table reveals masquerade. A direct mismatch where a .pdf/.docx/.jpg resolves to application/x-dosexec,
    application/x-executable, or text/x-shellscript is a high-confidence sign that an adversary disguised
    executable or script content to slip past name-based filtering and increase delivery success. A positive
    result should drive isolation of the file before it reaches an endpoint; a clean result still leaves
    room for the deeper structural and statistical checks below.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "load approved_map[extension] -> {allowed_mime_types}\nfor rec in files.log:\n  ext = lower(extract_extension(rec.filename))\n\
      \  if ext in approved_map and rec.mime_type not in approved_map[ext]:\n    if rec.mime_type in {application/x-dosexec,\
      \ application/x-executable, text/x-shellscript}\n       and ext in {pdf, docx, doc, xlsx, jpg, jpeg,\
      \ png, gif}:\n      emit ALERT severity=high reason=\"extension/MIME masquerade\" rec.fuid rec.tx_hosts\
      \ rec.rx_hosts"
- question: For each ingress file, do the header/description block, the leading magic bytes, and the actual
    parsed content all agree, or does the declared format fail to fully parse (structural malformation
    or truncation)?
  context: 'This applies the canonical multi-layer OPSWAT File Format Validation approach: parse the header
    description, the leading (magic) bytes, and the actual body, then require all three to be consistent.
    Sophisticated actors often fix one layer (e.g., a correct magic number) while the body or header description
    tells a different story, or they truncate/corrupt the structure so parsers fall back to lenient handling.
    Alerting when description-vs-magic, magic-vs-content, or description-vs-content disagree, or when
    the declared format will not fully parse, catches masquerade that survives a simple extension/MIME
    check. Magic-byte signature typing should follow established signature corpora. A positive result
    indicates a crafted or corrupted carrier that warrants isolation; a negative result raises confidence
    the file is what it claims to be.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for file in ingress_files:\n  desc = parse_header_description(file)\n  magic = type_from_magic_bytes(file.leading_bytes)\n\
      \  content = type_from_full_parse(file.body)\n  if content == PARSE_FAIL or is_truncated(file):\n\
      \    emit ALERT reason=\"structural malformation/truncation\"\n  elif not (desc == magic == content):\n\
      \    emit ALERT reason=\"header/magic/content disagreement\" desc magic content"
- question: Which ingress files use multiple type-bearing extensions (e.g., invoice.pdf.exe, photo.jpg.scr)
    or contain significant bytes after the format's logical end-of-file marker (PDF %%EOF, PNG IEND, ZIP
    end-of-central-directory)?
  context: Double extensions and trailing data past the logical EOF are classic masquerade and polyglot
    carriers. A second, type-bearing extension is designed to trick users and naive filters into seeing
    a benign type while the OS executes the final extension. Significant bytes appended after the format's
    logical terminator are a common way to smuggle a second payload or a co-present format without breaking
    the primary parser. Flagging both gives the analyst cheap, high-signal indicators of intentional concealment.
    Under the Isolate tactic, matches should be quarantined and, where the trailing data is non-trivial,
    routed to content-disarm-and-reconstruction before any release.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for rec in files.log:\n  exts = type_bearing_extensions(rec.filename)\n  if len(exts) >= 2:\
      \ emit ALERT reason=\"double extension\" rec.filename\n  eof = logical_eof_offset(rec)  # %%EOF\
      \ / IEND / EOCD by type\n  if eof != null and (rec.seen_bytes - eof) > TRAILING_THRESHOLD:\n   \
      \ emit ALERT reason=\"trailing data past EOF\" rec.fuid bytes=(rec.seen_bytes-eof)"
- question: When a mismatch involves executable or script-capable content disguised under an office or
    image extension, is that same file accessed on an endpoint shortly after transfer, and should it be
    escalated and isolated?
  context: 'This is the highest-risk masquerade scenario for the Isolate tactic: executable-capable content
    delivered under a benign extension and then touched on an endpoint indicates the masquerade succeeded
    at reaching execution surface. Correlating the ingress mismatch (Zeek files.log) with follow-on file
    access on the host (Windows Event ID 4663) within a short window converts a suspicious transfer into
    an actionable incident. The analyst should escalate, isolate the file and potentially the host, and
    validate the true type with content-only classification before any release. A positive correlation
    strongly suggests active delivery toward execution; absence of follow-on access still warrants quarantine
    of the file.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: 'Last 7 days (event-centered: correlate Event ID 4663 within +/- 24h of the ingress transfer)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'mismatch = files.log where mime_type in {executable, script} and ext in {office, image}

      access = win_event(4663) on object_name matching transferred filename/hash

      join mismatch->access on filename|hash where access.time within 24h after mismatch.time

      emit ALERT severity=critical action=isolate fuid host=access.computer'
- question: Which (extension, mime_type) combinations are statistically rare for this environment over
    the trailing 30 days, and do rare mismatches also originate from previously unseen external sources?
  context: Deterministic rules cannot enumerate every bad pairing, so this statistical baseline catches
    novel or unusual masquerade. By maintaining 30-day frequencies of (extension, mime_type) combinations
    and flagging pairs below the 5th percentile, the analyst surfaces format pairings that are abnormal
    for the organization even if not on a blocklist. Per-environment cutoffs should use the MAD-based
    modified Z-score (flag when 0.6745*(x-median)/MAD > 3.5) for robustness against outliers. Weighting
    alerts higher when a rare mismatch also comes from a previously unseen external source captures the
    combination of format anomaly and source novelty that characterizes targeted delivery. A positive
    result is a candidate for review; persistently rare-but-benign pairs can be allowlisted to reduce
    noise.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: 'Last 90 days (baseline window: trailing 30 days)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = count(files.log) group by (extension, mime_type) over last 30d\npctl5 = percentile(baseline.freq,\
      \ 5)\nfor rec in files.log:\n  freq = baseline[(rec.ext, rec.mime_type)]\n  mz = 0.6745*(freq -\
      \ median(baseline.freq))/MAD(baseline.freq)\n  if freq <= pctl5 or mz < -3.5:\n    score = base;\
      \ if rec.src not in known_external_sources: score += weight\n    emit ALERT rarity=freq pair=(rec.ext,\
      \ rec.mime_type) src=rec.src score=score"
- question: Are there bursts of format mismatches concentrated by source host/domain or destination segment
    that exceed historical baselines, indicating a campaign rather than isolated noise?
  context: Individual mismatches may be benign, but a spike in mismatch rate (count per minute) or mismatch
    byte volume (sum of Zeek seen_bytes) from a single source or toward a single destination segment is
    a campaign-level signal. Measuring rate per source host/domain and per destination segment, then triggering
    when rates exceed historical baselines by more than 2-3 standard deviations (or the robust MAD equivalent),
    helps the analyst distinguish a coordinated delivery push from background variance. For the Isolate
    tactic this supports proactive segment-level containment. A positive result should pivot the investigation
    to the offending source/segment and the full set of files transferred in the window.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (rolling per-minute rate windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stream mismatches from files.log (rule outputs)\nper source_host/domain and per dest_segment\
      \ compute rate=count/min and vol=sum(seen_bytes)/min\nbase_mean, base_sd = rolling_stats(rate, 30d)\n\
      if rate > base_mean + 3*base_sd  (or modified_z(rate) > 3.5):\n  emit ALERT scope=campaign key=source|segment\
      \ rate vol window"
- question: Is there a surge in parse-failure or gateway-block rates from a particular source, indicating
    probing or evasion attempts against the format-validation controls themselves?
  context: Beyond confirmed mismatches, the rate of malformed/unparseable uploads and blocked transfers
    per source is its own signal, analogous to NXDOMAIN or HTTP 404 failure-rate profiling. An adversary
    testing how to evade format validation will generate an above-baseline stream of failed validations
    from one source before finding a working bypass. Tracking failed-validation count per minute per source
    and baselining with robust thresholds lets the analyst spot this reconnaissance early. A positive
    result suggests an actor iterating on evasion and should heighten scrutiny of any subsequently successful
    transfer from that source; it also helps validate that the ingress controls are functioning.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (per-source rate windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = parse_failures + gateway_blocks tagged by source\nper source compute fail_rate =\
      \ count/min\nbase = robust_baseline(fail_rate per source, 30d)\nif modified_z(fail_rate, base) >\
      \ 3.5:\n  emit ALERT reason=\"validation failure surge / evasion probing\" source fail_rate"
- question: Can a supervised model combining mismatch class, size, byte-completeness ratio, transfer direction,
    source reputation, byte entropy, and follow-on access reliably rank file transfers by maliciousness,
    with explainable top contributing features for triage?
  context: When deterministic and single-statistic checks are individually weak, a Random Forest trained
    on labeled benign and malicious file-transfer records can fuse them into a calibrated risk score.
    Useful features include extension/type mismatch class, file size, the seen_bytes/total_bytes ratio,
    transfer direction, source reputation, byte entropy, and follow-on access patterns. Surfacing the
    top-3 contributing features (e.g., mismatch class, entropy, source novelty) in the alert text gives
    the analyst explainable triage rather than an opaque verdict, which is essential for defensible isolation
    decisions. A high score with coherent contributing features warrants quarantine; the model should
    be periodically retrained as formats and adversary tradecraft drift.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (scored continuously; retrain on rolling labeled set)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [mismatch_class, file_size, seen/total_ratio, direction,\n            src_reputation,\
      \ byte_entropy, followon_access_count]\nscore, contribs = random_forest_model.predict_proba_with_importance(features)\n\
      if score >= THRESHOLD:\n  emit ALERT risk=score top3=contribs[:3] fuid src dest"
- question: Does each file's byte-frequency distribution match the statistical fileprint of its declared
    type, or does an object show, for example, an executable-like byte histogram inside a declared .pdf
    or .docx?
  context: Extension and MIME checks can be defeated, but the byte-distribution physics of a real file
    type are hard to fully fake. By building per-type 1-gram byte-frequency profiles and scoring each
    file's histogram against its declared type's centroid using Mahalanobis distance (the PAYL approach),
    the analyst can flag objects whose content statistically does not belong to the type they claim. An
    executable-like distribution inside a declared document is a strong masquerade indicator. Alerting
    beyond the type's calibrated threshold supports isolation at ingress. Thresholds must be calibrated
    per type because legitimate formats differ widely in their byte profiles; a near-centroid score raises
    confidence in the declared type.
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (profiles rebuilt on a rolling 30-day corpus per type)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for type t: centroid[t], cov[t] = fit_1gram_profile(benign_corpus[t])\nfor file in ingress_files:\n\
      \  h = byte_histogram(file.body)\n  d = mahalanobis(h, centroid[file.declared_type], cov[file.declared_type])\n\
      \  if d > threshold[file.declared_type]:\n    emit ALERT reason=\"byte fileprint mismatch\" declared=file.declared_type\
      \ dist=d"
- question: Do any declared text, document, or image files exhibit body entropy approaching the compressed/encrypted
    ceiling (~7.9 bits/byte) outside their normal embedded-stream regions, suggesting hidden encrypted
    or packed content?
  context: Shannon entropy reveals concealment that distribution-matching may miss. Computing entropy
    over the whole body and over sliding windows lets the analyst find regions that are near-maximal entropy
    where the declared format would not expect them. A declared plaintext, document, or image whose body
    approaches ~7.9 bits/byte outside its legitimate compressed-stream regions likely hides encrypted,
    packed, or otherwise obfuscated payload. Profiling the size and position of the high-entropy region
    gives an explainable feature for triage and isolation. A positive result is a candidate for content-disarm-and-reconstruction;
    benign formats with large legitimate compressed streams (e.g., JPEG, modern office XML) must be modeled
    so they are not over-flagged.
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for file in ingress_files:\n  E = shannon_entropy(file.body)\n  windows = [shannon_entropy(w)\
      \ for w in sliding(file.body, 4096)]\n  hi = regions where window_entropy >= 7.9 and not in expected_stream_regions(file.declared_type)\n\
      \  if file.declared_type in {text, document, image} and (E near 7.9 or hi non-empty):\n    emit\
      \ ALERT reason=\"hidden encrypted/packed content\" hi_size=size(hi) hi_pos=pos(hi)"
- question: Does the file's size or its seen_bytes/total_bytes (missing-bytes) completeness ratio fall
    outside the per-type interquartile range, indicating a truncated or padded masquerade carrier?
  context: Truncated or padded files are tell-tale signs of carriers built to smuggle or to break lenient
    parsers. Zeek files.log records seen_bytes and total_bytes, from which a completeness ratio can be
    derived, alongside the overall size. By tracking size and completeness ratio per declared type and
    flagging values outside the per-type interquartile range, the analyst catches objects that are abnormally
    small (truncated), abnormally large (padded), or incompletely transferred for their claimed type.
    This is a lightweight check that complements distribution and entropy analysis. A positive result
    warrants isolation and a full structural parse; benign edge cases (very large legitimate archives,
    intentionally tiny stubs) should be modeled per type.
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (IQR baselines per declared type)
  queries:
  - technology: Zeek/pseudocode
    query: "per declared_type compute Q1,Q3,IQR of size and ratio over baseline\nfor rec in files.log:\n\
      \  ratio = rec.seen_bytes / max(rec.total_bytes,1)\n  t = rec.declared_type\n  if rec.size < Q1.size[t]-1.5*IQR.size[t]\
      \ or rec.size > Q3.size[t]+1.5*IQR.size[t]\n     or ratio < Q1.ratio[t]-1.5*IQR.ratio[t]:\n    emit\
      \ ALERT reason=\"size/completeness anomaly\" size=rec.size ratio=ratio"
- question: When a content-only deep-learning type classifier (e.g., Magika) is run on each ingress file,
    does its predicted true type disagree with the declared extension/MIME, or is the file classified
    as an unrecognized/high-entropy (encrypted/encoded) class?
  context: A content-only classifier ignores the name and transport metadata entirely and predicts type
    from the bytes, making it a strong arbiter of true type. Running such a classifier on each ingress
    file and comparing its prediction against the declared extension/MIME directly surfaces masquerade;
    a result of an unrecognized or high-entropy class flags encrypted/encoded content that should not
    pass without inspection. Reporting the classifier's top-3 candidate types and confidences gives the
    analyst an explainable basis for the isolation decision. A confident disagreement is a high-value
    masquerade indicator; low-confidence or genuinely ambiguous formats should be triaged with the structural
    and statistical checks above.
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (scored per file at ingress)
  queries:
  - technology: SIEM/ML pseudocode
    query: "for file in ingress_files:\n  pred, top3 = magika.classify(file.body)\n  if pred != normalize(file.declared_type)\
      \ or pred in {unknown, high_entropy, encrypted}:\n    emit ALERT reason=\"content-only true-type\
      \ mismatch\" declared=file.declared_type\n          predicted=pred candidates=top3"
- question: Does any ingress file contain the structural markers of two or more complete formats simultaneously
    (e.g., a valid PDF header/trailer co-located with a ZIP/PK central directory, or a GIF/JPEG header
    followed by embedded HTML/JS or PE headers), making it a polyglot?
  context: Polyglots are simultaneously valid as more than one type, which defeats single-signature extension/MIME
    validation, upload filters, and AV that stop at the first recognized structure. Parsing each file
    for the structural markers of multiple formats at once, and alerting when two or more complete format
    structures co-exist, catches these multi-format carriers that other checks miss. For the Isolate tactic,
    such files should be routed to content-disarm-and-reconstruction before any release, because even
    partial inspection cannot guarantee which interpretation a downstream parser will take. A positive
    result is a strong intentional-evasion indicator; legitimate container formats with nested objects
    (e.g., office XML, which is a ZIP) must be modeled so they are not misread as polyglots.
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for file in ingress_files:\n  sigs = detect_all_format_structures(file)  # headers+trailers\
      \ per format\n  complete = [f for f in sigs if has_header_and_trailer(f)]\n  if count(complete)\
      \ >= 2:\n    emit ALERT reason=\"polyglot: multiple complete formats\" formats=complete\n      \
      \    action=route_to_CDR"
- question: Do declared document, image, or archive files contain embedded PE/ELF/Mach-O headers, OLE/macro
    streams, or script blocks within their parsed object tree?
  context: 'Even when a file is not a full polyglot, an embedded executable or active-content object inside
    a declared benign container is a direct delivery mechanism. Parsing the object tree of each declared
    document/image/archive and flagging embedded PE/ELF/Mach-O headers, OLE or macro streams, or script
    blocks surfaces these hidden payloads. This is a targeted complement to whole-file statistics: it
    pinpoints the specific object that carries risk, which aids both triage and disarm. For the Isolate
    tactic a match warrants quarantine and content-disarm-and-reconstruction. A positive result is high-confidence
    when the embedded object is executable or macro-bearing; benign embedded media must be distinguished
    from active content.'
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for file in ingress_files where declared_type in {document, image, archive}:\n  tree = parse_object_tree(file)\n\
      \  bad = find(tree, {PE_header, ELF_header, MachO_header, OLE_stream, macro_stream, script_block})\n\
      \  if bad non-empty:\n    emit ALERT reason=\"embedded executable/script object\" objects=bad action=isolate"
- question: Can a byte-feature classifier over whole-file content (byte histograms, entropy, structural
    markers, embedded-object counts) flag polyglot files, with the top contributing features surfaced
    for analyst triage?
  context: Rule-based polyglot parsing can be evaded by novel or malformed combinations, so a gradient-boosted
    or neural classifier trained on whole-file byte-content features generalizes detection. Features such
    as byte histograms, entropy, structural markers, and embedded-object counts let the model recognize
    polyglot signatures that explicit parsers may miss. Surfacing the top-3 contributing features (e.g.,
    co-present signatures, entropy, trailing-data size) in alert text makes the verdict explainable and
    defensible for an isolation decision. A high classifier score with coherent feature attribution is
    a strong reason to route the file to content-disarm-and-reconstruction; the model should be retrained
    as new polyglot techniques appear.
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (scored per file; retrain periodically)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [byte_histogram, entropy, structural_markers, embedded_object_count, trailing_data_size]\n\
      score, contribs = polyglot_gbm.predict_with_importance(features)\nif score >= THRESHOLD:\n  emit\
      \ ALERT reason=\"polyglot byte-feature classifier\" risk=score top3=contribs[:3]"
- question: When per-file metadata vectors (declared type, size, entropy, MIME-vs-magic mismatch flag,
    source reputation, follow-on access) are scored by an unsupervised anomaly detector such as Extended
    Isolation Forest, which files are statistical outliers warranting low-latency isolation review?
  context: Labeled malicious samples are scarce, so an unsupervised detector catches novel masquerade
    without prior examples. Scoring per-file metadata vectors (declared type, size, entropy, MIME-vs-magic
    mismatch flag, source reputation, follow-on access) with Extended Isolation Forest identifies files
    that are statistical outliers relative to normal ingress traffic. Isolation Forest is favored for
    low-latency ingress screening, while autoencoders suit richer structure; reporting path-length or
    reconstruction-error feature contributions gives the analyst a triage explanation. A strong outlier
    score is a candidate for isolation and deeper inspection even if no single rule fired; the detector
    should be tuned to the environment's normal file mix to keep false positives manageable.
  answer_sources:
  - Zeek files.log
  - Zeek extract-files (file content)
  - Email gateway file store
  - 'NAI: Network ingress points (e.g., web proxies, email gateways)'
  range: Last 90 days (model fit on rolling normal traffic)
  queries:
  - technology: SIEM/ML pseudocode
    query: "vec = [declared_type, size, entropy, mime_vs_magic_mismatch, src_reputation, followon_access]\n\
      model = ExtendedIsolationForest.fit(rolling_normal_ingress_vectors)\nscore, contribs = model.anomaly_score_with_contributions(vec)\n\
      if score >= OUTLIER_THRESHOLD:\n  emit ALERT reason=\"unsupervised metadata anomaly\" score=score\
      \ top_features=contribs[:3]"
