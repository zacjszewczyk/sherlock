questions:
- question: Using deterministic detection logic, can analysts identify extension and MIME mismatch detection
    as it would manifest during Isolate?
  context: 'Under the Isolate tactic, the analyst is looking for the following evidence: File format verification
    surfaces files whose declared type (filename extension and transport MIME header) and actual internal
    structure (magic bytes, parseable body) diverge, revealing masquerade used to bypass filtering and
    increase delivery success of malicious content. Primary signal works on first-party Zeek files.log
    (content-sniffed mime_type, byte counts, hashes) without external API lookups. This symbolic logic
    approach proceeds as follows: Compare filename extension against the content-sniffed mime_type for
    each [Zeek files.log](https://docs.zeek.org/en/master/frameworks/file-analysis.html) record using
    an approved extension-to-type mapping table. Alert on direct mismatches such as declared document/image
    extensions (.pdf, .docx, .jpg) that resolve to executable or script content types (application/x-dosexec,
    application/x-executable, text/x-shellscript). Keep this hard rule as the deterministic floor. A positive
    result strengthens the case that File Format Verification is in use for isolate; a negative result
    helps rule it out or redirect the investigation.'
