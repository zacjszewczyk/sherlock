name: 'D3-PWA: Password Authentication'
id: 3cbbbb5e-dab0-4ec6-93a6-59c18dc9d77c
description: Investigate the strength and enforcement of password authentication across the enterprise
  and detect attacks against it. This playbook helps an analyst determine whether deterministic password
  controls (account lockout, throttling, breached-credential screening) are working as intended, and whether
  observed authentication telemetry shows the failure-state and success/fail-transition signatures of
  brute force, password spraying, or credential stuffing. It treats failed logons (Windows Event ID 4625),
  Kerberos pre-auth failures (4771), and lockouts (4740) as first-class indicators distinct from successful-logon
  volume. The playbook combines deterministic policy/threshold rules (lockout alerting, spray pattern
  detection, breached-password screening, success-after-failures transitions, multi-protocol/logon-type
  coverage), statistical baselining (per-user failure ratios, per-host failure spikes, change-point detection,
  rare-edge scoring), and machine learning (lockout-volume forecasting, low-and-slow distributed spray
  clustering, sequence-anomaly detection) so an analyst can confirm whether password policy is effectively
  enforced and whether an account has been compromised through guessing or replay of stolen credentials.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
