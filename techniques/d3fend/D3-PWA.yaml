questions:
- question: Are account lockout events (Windows Event ID 4740) firing, and when they do, are they preceded
    by a burst of failed logons (Event ID 4625) and traceable to suspicious source IPs in Zeek conn.log
    rather than to ordinary user typos?
  context: 'Tactic context (Harden): lockouts are the deterministic failure-state signal that [NIST SP
    800-63B](https://pages.nist.gov/800-63-3/sp800-63b.html) verifier limits (throttle/limit consecutive
    failed attempts) are actually engaging. Alert on any occurrence of Event ID 4740 (Account Locked Out)
    and immediately correlate it with the preceding 4625 failed logons for the same account and with the
    originating source IPs in Zeek conn.log. A lockout from one host with a few wrong passwords is likely
    user error; a lockout preceded by many failures from an unfamiliar or external IP, or many accounts
    locking out together, is the failure-state signature of the brute-force and spraying campaigns in
    [MITRE ATT&CK T1110](https://attack.mitre.org/techniques/T1110/). A positive result (lockout bursts
    tied to anomalous sources) confirms an active credential attack and exercised throttling; a negative
    result indicates isolated benign lockouts.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for evt in events where EventID == 4740:\n  acct = evt.TargetUserName\n  fails = count(events\
      \ where EventID==4625 and TargetUserName==acct\n                and time in [evt.time-15m, evt.time])\n\
      \  src_ips = distinct(conn.log src where time in [evt.time-15m, evt.time])\n  if fails >= lockout_threshold\
      \ or any(src_ip not in known_internal):\n    alert('account lockout w/ preceding failures', acct,\
      \ fails, src_ips)"
- question: Is any single source IP generating failed logons (Event ID 4625) against an unusually high
    number of distinct user accounts in a short window, or are many source IPs targeting the same set
    of accounts (distributed spray)?
  context: 'Tactic context (Harden): password spraying tries one or a few common passwords against many
    accounts to stay under per-account lockout thresholds, so the tell is breadth across distinct users
    rather than depth against one. Following [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html),
    alert when one source IP produces 4625 failures against a high count of unique accounts (start at
    >10 distinct users per 5-minute window, then derive the real threshold from your own per-source distinct-user
    baseline). Add a distributed variant that counts unique source IPs hitting the same account set, and
    filter by Logon Type while excluding known service/automation accounts to control false positives.
    A positive result is a strong spray indicator; tune thresholds to your environment to avoid alerting
    on vulnerability scanners and misconfigured service accounts.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// classic single-source spray\nbucket = window(5m)\nstats distinct_count(TargetUserName)\
      \ as users by SourceIP, bucket\n  where EventID==4625 and LogonType in (3,10) and TargetUserName\
      \ not in service_accounts\nalert where users > spray_threshold  // baseline default >10\n// distributed\
      \ variant\nstats distinct_count(SourceIP) as src by TargetUserName, bucket where EventID==4625\n\
      alert where src > distributed_threshold"
- question: Did any account successfully authenticate (Event ID 4624) using a password that matches a
    known breached-credential blocklist, indicating a likely credential-stuffing success?
  context: 'Tactic context (Harden): [NIST SP 800-63B](https://pages.nist.gov/800-63-3/sp800-63b.html)
    requires screening chosen/used passwords against corpora of known compromised credentials. Block and
    alert on authentication using passwords present in a breached-credential blocklist, performing the
    comparison with privacy-preserving matching (e.g., k-anonymity / blinded hashes as in [Thomas et al.](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas))
    so plaintext passwords are never exposed during screening. A successful logon (Event ID 4624) by an
    account whose password matches the breach corpus is a high-fidelity credential-stuffing indicator,
    because it means a previously leaked secret is still valid. A positive result should force a credential
    reset and session review; a negative result confirms screening coverage. This is primarily a control-validation
    and preventive check, so the relevant window is the current/recent password state.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Current password state (re-screen on each change)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// screening service compares blinded password hash to breach corpus\non auth_attempt(account,\
      \ password):\n  h = blinded_prefix_hash(password)  // k-anonymity range query, no plaintext sent\n\
      \  if breach_corpus.contains(h, password):\n    block_and_alert('breached credential used', account)\n\
      // retro-hunt successful logons by flagged accounts\nalert where EventID==4624 and TargetUserName\
      \ in breached_match_accounts"
- question: Did a source IP or account transition from a large number of failed logons (4625) to a successful
    logon (4624) within a short window, signaling that a spray or stuffing attempt finally guessed valid
    credentials?
  context: 'Tactic context (Harden): the highest-value confirmation of a credential attack is the state
    transition from sustained failure to success. Following the [OWASP Credential Stuffing Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html)
    guidance, alert when a source IP or account shows many failed logons (4625) immediately followed by
    a successful logon (4624) in a short window (e.g., >=20 failures then a success within 10 minutes).
    This success/fail transition strongly indicates that an automated guessing or replay campaign has
    compromised an account, and it should trigger immediate response (session kill, credential reset,
    hunt for follow-on activity). A positive result is near-confirmation of compromise; a negative result
    means failures did not resolve into access. Center the correlation on the successful-logon event and
    look backward.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for succ in events where EventID==4624 and LogonType in (3,10):\n  fails = count(events where\
      \ EventID==4625\n        and (SourceIP==succ.SourceIP or TargetUserName==succ.TargetUserName)\n\
      \        and time in [succ.time-10m, succ.time])\n  if fails >= 20:\n    alert('success-after-failures\
      \ (likely spray/stuffing success)',\n          succ.TargetUserName, succ.SourceIP, fails)"
- question: Are failed-authentication detections applied across all relevant protocols and logon types
    - Kerberos pre-auth failures (Event ID 4771), NTLM/SMB (Logon Type 3), RDP (Logon Type 10), and Azure
    AD/Entra SigninLogs error codes - so brute force against non-interactive endpoints is not missed?
  context: 'Tactic context (Harden): adversaries ([MITRE ATT&CK T1110](https://attack.mitre.org/techniques/T1110/))
    attack whichever authentication surface is least monitored, so coverage must span protocols, not just
    interactive logons. Extend failed-logon thresholds to Kerberos pre-authentication failures (4771),
    NTLM/SMB network logons (Type 3), RDP (Type 10), and cloud sign-in errors in Azure AD/Entra SigninLogs,
    applying per-protocol failure-count thresholds because baseline failure rates differ widely by protocol.
    A positive result is anomalous failure volume on any single surface (e.g., a spike of 4771 with failure
    code 0x18 ''bad password''); a negative result indicates failures are within each protocol''s normal
    range. This question validates that the harden controls and detections cover the full authentication
    attack surface.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// per-protocol failure thresholds

      kerb = count(EventID==4771 and FailureCode==''0x18'') by SourceIP, window(5m)

      ntlm = count(EventID==4625 and LogonType==3) by SourceIP, window(5m)

      rdp  = count(EventID==4625 and LogonType==10) by SourceIP, window(5m)

      cloud = count(SigninLogs where ResultType in spray_error_codes) by IPAddress, window(5m)

      alert where kerb>kerb_thr or ntlm>ntlm_thr or rdp>rdp_thr or cloud>cloud_thr'
- question: For each user, is the daily ratio of failed to successful logons in the 95th percentile, indicating
    sustained targeted credential stuffing against that account?
  context: 'Tactic context (Harden): a healthy account fails occasionally and succeeds routinely; an account
    under credential stuffing shows a persistently elevated failure-to-success ratio. For each user, compute
    the daily ratio of failed (4625) to successful (4624) logons and flag users in the 95th percentile,
    since sustained high ratios indicate targeted stuffing per [OWASP Credential Stuffing Prevention](https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html)
    guidance. Derive per-environment baselines from your own history or from public enterprise telemetry
    such as the [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518) or the [LANL authentication
    dataset](https://csr.lanl.gov/data/auth/) to set a defensible cutoff. A positive result (a user sitting
    in the top percentile day over day) is a strong targeted-attack lead; a negative result means failure
    activity is proportionate to legitimate use.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per_user_day:\n  fail = count(EventID==4625) by TargetUserName, day\n  succ = count(EventID==4624)\
      \ by TargetUserName, day\n  ratio = fail / max(succ,1)\np95 = percentile(ratio, 95) across users\
      \ for day\nalert where ratio >= p95 and fail >= min_volume"
- question: Is the hourly count of failed logons (Event ID 4625) on any workstation or server spiking
    more than 3 standard deviations above its own baseline mean, signifying automated local brute-forcing?
  context: 'Tactic context (Harden): local/host-targeted brute forcing shows up as an abrupt rise in failures
    on a single machine relative to that machine''s own quiet baseline. Baseline the hourly count of 4625
    events per workstation/server and alert when the count exceeds the mean by more than 3 standard deviations,
    which signifies automated guessing against that host. The alert should report the contributing source
    IP(s) and the number of distinct accounts targeted so triage can immediately judge breadth vs depth.
    A positive result (a 3-sigma spike) is a focused brute-force lead; a negative result means the host''s
    failure volume is within normal variation. Per-host baselining avoids the noise of a single global
    threshold.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per_host_hour = count(EventID==4625) by Computer, hour\nmean,std = rolling_stats(per_host_hour,\
      \ baseline=30d) by Computer\nalert where per_host_hour > mean + 3*std\n  enrich with distinct(SourceIP),\
      \ distinct_count(TargetUserName)"
- question: Do the enterprise-wide or per-host time-series of failed logons (4625) and lockouts (4740)
    show an abrupt regime shift (change-point) marking the onset of a credential-attack campaign?
  context: 'Tactic context (Harden): campaign onset often appears as a step change in failure/lockout
    rates rather than a single outlier, and fixed thresholds miss slow ramps or shifting baselines. Apply
    change-point detection (CUSUM, PELT, or Bayesian online CPD per [Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/))
    to the enterprise and per-host 4625 and 4740 time-series to flag abrupt shifts without hand-tuned
    thresholds. The alert should emit the detected change-point timestamp and the pre/post failure rates
    so an analyst can scope what changed and when. A positive result (a detected change-point with a large
    pre/post delta) marks likely campaign start and bounds the investigation window; a negative result
    means the series is stationary.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days (time-series; report detected change-point window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = timeseries(count(EventID in (4625,4740)), bin=1h, scope=[enterprise, per_host])\n\
      cps = change_point_detect(series, method='PELT'|'CUSUM'|'BOCPD')\nfor cp in cps where (post_rate/pre_rate)\
      \ > shift_factor:\n  alert('failure/lockout regime shift', cp.timestamp, cp.pre_rate, cp.post_rate)"
- question: Is a successful credentialed logon occurring over a (user, source host, destination host,
    logon type) tuple that has never or rarely been seen before, especially one that immediately follows
    a burst of failed logons?
  context: 'Tactic context (Harden): compromised credentials are frequently used from new places to reach
    new targets, so a first-time or rare authentication edge is a strong anomaly signal. Maintain historical
    (user, source host, destination host, logon type) associations and score new or rare tuples for credentialed
    access, following the rarity-based causal-path scoring in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).
    Prioritize rare logons that also follow a failed-logon burst, since rare-edge plus prior failures
    is a high-confidence post-compromise pattern; benchmark on the [LANL authentication dataset](https://csr.lanl.gov/data/auth/).
    A positive result (a rare edge after failures) is a strong lateral-movement/compromise lead; a negative
    result means the logon matches established access patterns.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "key = (TargetUserName, SourceHost, DestHost, LogonType)\nfreq = historical_count(key, baseline=90d)\n\
      for evt in events where EventID==4624:\n  if freq[key] == 0 or rarity_score(key) > rare_thr:\n \
      \   recent_fails = count(EventID==4625 same user/src in [evt.time-15m, evt.time])\n    alert('rare\
      \ logon edge', key, freq[key], recent_fails)"
- question: Does the observed aggregate enterprise volume of lockouts (4740) and failed logons (4625)
    exceed the upper bound of a time-series forecast, signaling a systemic, enterprise-wide credential
    attack?
  context: 'Tactic context (Harden): a coordinated campaign drives total failure/lockout volume above
    what normal business rhythms predict. Train a time-series model (e.g., ARIMA) on the aggregate enterprise
    count of 4740 lockouts and 4625 failures, then trigger an alert when observed volume exceeds the 99%
    prediction interval. To keep the alert actionable and explainable, surface the top-3 contributing
    hosts, accounts, and source IPs in the alert text. A positive result (observed above the 99% band)
    indicates a systemic attack rather than a localized one; a negative result means aggregate volume
    is within forecast. This is an enterprise-level early-warning complement to the per-host and per-user
    detections.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "train ARIMA on hourly enterprise count(EventID in (4625,4740)) over baseline\nyhat, pi99 =\
      \ forecast(model, horizon=1h)\nif observed > pi99.upper:\n  top = top_k(contributors by host, account,\
      \ source_ip, k=3)\n  alert('enterprise lockout/failure volume above 99% PI', observed, yhat, top)"
- question: Are failed sign-ins, when clustered by behavioral features (user-agent, ASN/geolocation, targeted
    account set, timing), revealing a coordinated low-and-slow spray distributed across many source IPs
    that stays under per-source thresholds?
  context: 'Tactic context (Harden): sophisticated actors distribute a spray across many IPs at a low
    rate per IP to evade per-source thresholds, so detection must group by shared behavior rather than
    per-IP volume. Cluster failed sign-ins by features such as user-agent, ASN/geolocation, target-account
    set, and timing to surface low-and-slow sprays, as in [Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052)''s
    approach. Each cluster alert must list the top-3 features driving it (e.g., a shared user-agent string,
    a common ASN, overlapping target accounts) so an analyst can validate coordination. A positive result
    (a tight behavioral cluster spanning many IPs) is strong evidence of an orchestrated distributed spray;
    a negative result means failures lack common structure. This catches the campaigns that per-source
    rules miss.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [user_agent, asn, geo, target_account_set, hour_of_day]\nX = build_feature_matrix(SigninLogs|4625\
      \ failures, features)\nclusters = cluster(X, method='DBSCAN'|'HDBSCAN')\nfor c in clusters where\
      \ distinct_source_ips(c) > N and rate_per_ip(c) low:\n  alert('low-and-slow distributed spray',\
      \ cluster=c.id,\n        top3_features=feature_importance(c)[:3])"
- question: Do per-user or per-host authentication-event sequences contain events that fall outside the
    top-k predictions of a learned sequence model (LSTM/DeepLog), indicating anomalous authentication
    behavior?
  context: 'Tactic context (Harden): normal authentication unfolds as predictable sequences (logon, access,
    logoff patterns), and credential abuse perturbs that order in ways thresholds cannot capture. Model
    per-user/per-host authentication-event sequences with an LSTM language model and flag events that
    fall outside the top-k predicted next-events, per [DeepLog](https://doi.org/10.1145/3133956.3134015);
    use attention weights ([Brown et al.](https://arxiv.org/abs/1803.04967)) to surface the top-3 contributing
    fields for explainability. Run this in parallel with - never as a replacement for - the deterministic
    spray/lockout rules, and train/benchmark on the [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518).
    A positive result (a sequence anomaly) is a lead warranting correlation with the deterministic detections;
    a negative result means the sequence matches learned normal behavior. This is a breadth detector for
    novel patterns the rules do not encode.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4740
  - Windows Event ID 4771
  - Zeek conn.log
  - Azure AD/Entra SigninLogs
  - 'NAI: Domain Controllers, Authentication Servers, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_LSTM(next_event | per_user/per_host auth sequences)\nfor evt in stream:\n  topk\
      \ = model.predict(prev_window)\n  if evt.type not in topk:\n    fields = attention_top3(model, evt)\n\
      \    alert('auth sequence anomaly', user=evt.user, host=evt.host, top3=fields)\n// run alongside\
      \ deterministic spray/lockout rules, not instead of them"
