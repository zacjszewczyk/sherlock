- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which functions in our codebase call known-unsafe integer parsing/arithmetic routines (e.g.,
    atoi(), strtol() without an errno check) or contain the canonical CWE-190 dangerous arithmetic patterns
    (a*b, len+1, count-1, malloc(n*sizeof)) whose result feeds a memory allocation, array index, or loop
    bound with no preceding bounds conditional?
  context: 'This Harden question drives a deterministic, grep/semgrep-style sweep of first-party source
    for insecure integer handling. The analyst is hunting for arithmetic whose result reaches a sensitive
    sink (allocation, indexing, loop bound) without a guard, because that is exactly where attacker-controlled
    integers cause overflow/wraparound. Enforce the SEI CERT C INT rules as build-breaking checks: INT30-C
    (unsigned wrap), INT31-C (value-preserving conversion), INT32-C (signed overflow), and INT04-C (validate
    untrusted integer inputs). A positive result is any matching pattern lacking a range/bounds check;
    treat it as a hardening defect and fail the build. A clean result means the scanned patterns are guarded,
    though it does not prove all paths are safe. References: [CWE-190: Integer Overflow or Wraparound](https://cwe.mitre.org/data/definitions/190.html);
    [SEI CERT C Coding Standard](https://resources.sei.cmu.edu/downloads/secure-coding/assets/sei-cert-c-coding-standard-2016-v01.pdf).'
  answer_sources:
  - SAST Reports
  - Source Code Repositories
  - Compiler/Sanitizer Logs (UBSan -fsanitize=integer)
  - Fuzzing Crash Reports
  - 'NAI: Application source code repositories and CI/CD pipelines (build, SAST, fuzzing, and sanitizer
    stages).'
  range: Last 90 days
  queries:
  - technology: SAST/Semgrep pseudocode
    query: "scan source_repo for:\n  unsafe_calls = atoi() OR strtol()|strtoul() WITHOUT errno check\n\
      \  arith_patterns = (a*b) OR (len+1) OR (count-1) OR malloc(n*sizeof(...))\nWHERE result FLOWS_TO\
      \ {malloc/alloc | array_index | loop_bound}\n  AND NO preceding bounds_conditional (e.g., if (n\
      \ > MAX) ...)\nTHEN report finding; CI: fail_build = true\nenforce SEI CERT INT30-C, INT31-C, INT32-C,\
      \ INT04-C"
- question: Can constraint-based static analysis or taint-aware symbolic execution prove that an attacker-controlled
    integer can reach a sensitive sink with an out-of-range value, and do debug/test builds with a runtime
    integer checker confirm overflow or wraparound at execution time?
  context: 'This deepens the source-hardening review beyond pattern matching into provable reachability.
    For first-party source, run constraint-based analysis over LLVM IR to generate integer range constraints
    and let an SMT solver decide whether any operation can produce an out-of-range value (KINT approach).
    For binaries/third-party objects, use taint-aware symbolic execution to prove an attacker-controlled
    integer reaches a sensitive sink out-of-range (IntScope approach). Compile debug/test builds with
    IOC / Clang -fsanitize=integer so overflow and wraparound trip deterministically during execution.
    A positive result is a solver-confirmed out-of-range path or a sanitizer trap, both high-confidence
    hardening targets. This is tactic-specific to Harden: it tells engineers exactly which operation needs
    an explicit range check. References: [KINT](https://pdos.csail.mit.edu/papers/kint:osdi12.pdf); [IntScope](https://www.ndss-symposium.org/wp-content/uploads/2017/09/Automatically-Detecting-Integer-Overflow-Vulnerability-In-X86-Binary-Using-Symbolic-Execution-Tielei-Wang.pdf);
    [Understanding Integer Overflow in C/C++](https://users.cs.utah.edu/~regehr/papers/overflow12.pdf).'
  answer_sources:
  - SAST Reports
  - Source Code Repositories
  - Compiler/Sanitizer Logs (UBSan -fsanitize=integer)
  - Fuzzing Crash Reports
  - 'NAI: Application source code repositories and CI/CD pipelines (build, SAST, fuzzing, and sanitizer
    stages).'
  range: Last 90 days
  queries:
  - technology: Symbolic-execution/SMT pseudocode
    query: '// constraint-based static analysis (first-party LLVM IR)

      emit integer_range_constraints over IR ops

      solve with SMT: EXISTS input s.t. op_result OUT_OF_RANGE -> report path

      // binaries/third-party: taint symbolic execution

      taint(attacker_input) -> if reaches sink (alloc/index/loop) OUT_OF_RANGE -> report'
  - technology: Sanitizer/build pseudocode
    query: '// runtime confirmation

      build debug/test with clang -fsanitize=integer (IOC)

      run test/fuzz corpus

      on UBSan integer trap -> capture function, op, operands -> report'
- question: Which applications have an abnormally high frequency or density of integer-related weakness
    classes (CWE-190/191/197) per KLOC compared to the organizational baseline, and which exceed the org
    mean by more than two standard deviations?
  context: 'This statistical view prioritizes hardening effort across a portfolio. Parse SAST reports
    to compute the frequency and density of integer weakness classes per thousand lines of code per application,
    establish an organizational baseline, and flag any application whose CWE-190 density exceeds the org
    mean by >2 standard deviations. Cross-reference empirical prevalence studies (e.g., 200+ overflow
    sites in SPEC CINT2000) to set realistic per-codebase baselines and to distinguish intentional wraparound
    from likely-unintentional anomalies. A positive result is an outlier application that warrants focused
    review; a negative result means density is within normal variation. For Harden, this turns scattered
    findings into a ranked remediation queue. References: [IOC empirical prevalence study](https://users.cs.utah.edu/~regehr/papers/overflow12.pdf).'
  answer_sources:
  - SAST Reports
  - Source Code Repositories
  - 'NAI: Application source code repositories and CI/CD pipelines (build, SAST, fuzzing, and sanitizer
    stages).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "parse SAST_reports\nfor each app:\n  density_190 = count(CWE-190) / KLOC\nbaseline_mean, baseline_std\
      \ = stats(density_190 over all apps)\nalert if app.density_190 > baseline_mean + 2*baseline_std\n\
      note: separate intentional wraparound from anomalies"
- question: Which components cluster (by import/call-pattern similarity) with historically vulnerable
    integer-handling modules, and which surface unvalidated arithmetic under coverage-guided fuzzing or
    dynamic test generation (e.g., high crash/hang yield per million executions)?
  context: 'This combines static clustering with dynamic discovery. Rank components by import/call-pattern
    similarity to modules that were vulnerable in the past (Vulture approach) to focus review where integer-handling
    APIs cluster. In parallel, run dynamic test generation and coverage-guided fuzzing: SmartFuzz negates
    comparison/cast constraints to force out-of-range integers and ranks targets by bug-yield and cost-per-bug,
    while AFL flags under-exercised integer paths via edge hit-count histograms and crash/hang rates.
    Track crash/hang count per million executions as a distinct failure-mode signal of missing range checks.
    A positive result is a high-similarity or high-yield component; it pinpoints where to add Harden range
    checks first. References: [Vulture / Predicting Vulnerable Software Components](https://www.st.cs.uni-saarland.de/publications/files/neuhaus-ccs-2007.pdf);
    [Dynamic Test Generation to Find Integer Bugs](https://www.usenix.org/legacy/event/sec09/tech/full_papers/molnar.pdf);
    [AFL coverage-guided fuzzing](https://lcamtuf.coredump.cx/afl/technical_details.txt).'
  answer_sources:
  - SAST Reports
  - Source Code Repositories
  - Fuzzing Crash Reports
  - 'NAI: Application source code repositories and CI/CD pipelines (build, SAST, fuzzing, and sanitizer
    stages).'
  range: Last 90 days
  queries:
  - technology: Stats/Fuzzing pseudocode
    query: '// static clustering

      score(component) = import_call_similarity(component, known_vulnerable_modules)

      rank components by score desc

      // dynamic fuzzing

      run AFL/SmartFuzz on integer-handling targets

      metric crash_hang_per_Mexec = (crashes+hangs) / (execs/1e6)

      rank by bug_yield and crash_hang_per_Mexec; review top targets'
- question: Do code-representation ML models (BLSTM code gadgets, AST+CFG+DFG graph neural networks, or
    token CNN/RNN+random-forest) flag new or modified functions in the CI/CD pipeline as likely containing
    integer-validation flaws?
  context: 'This question applies learned classifiers to changed code so integer-validation defects are
    caught at review time. Options include VulDeePecker (code-gadget BLSTM over data-dependent slices
    around arithmetic/allocation calls), Devign (joint AST+CFG+DFG graph neural networks), and CNN/RNN+random-forest
    token models trained on the Draper VDISC corpus (~1.27M functions including CWE-190 labels). Follow
    ReVeal guidance — de-duplicate samples and resample class imbalance — to avoid inflated accuracy.
    A positive result is a model-flagged function that a reviewer should inspect for a missing range check;
    a negative result lowers but does not eliminate suspicion. For Harden, this scales expert review to
    every commit. References: [VulDeePecker](https://arxiv.org/abs/1801.01681); [Devign](https://arxiv.org/abs/1909.03496);
    [Russell et al.](https://arxiv.org/abs/1807.04320); [ReVeal](https://arxiv.org/abs/2009.07235).'
  answer_sources:
  - SAST Reports
  - Source Code Repositories
  - 'NAI: Application source code repositories and CI/CD pipelines (build, SAST, fuzzing, and sanitizer
    stages).'
  range: Last 90 days
  queries:
  - technology: ML/CI-CD pseudocode
    query: "on CI/CD pull_request:\n  for each new_or_modified function:\n    feats = code_repr(function)\
      \  // gadget-BLSTM | AST+CFG+DFG GNN | token CNN/RNN+RF\n    score = model.predict(feats)\n    if\
      \ score > threshold: flag for review (likely integer-validation flaw)\npreprocess: de-duplicate,\
      \ resample class imbalance (ReVeal)"
- question: When an ML model flags a function, which specific arithmetic or allocation lines drive the
    prediction, and does an explainable line-level predictor (e.g., CodeBERT/LineVul attention) surface
    the exact multiplication, unchecked cast, or malloc sink behind the missing range check?
  context: 'This is the triage companion to the classifier question: it demands explainability so reviewers
    act on evidence, not an opaque score. Run a CodeBERT-based line-level predictor that uses attention
    to localize the arithmetic/allocation lines driving each prediction (LineVul approach). The alert
    must surface the top-3 contributing lines/tokens (e.g., the a*b multiplication, the unchecked cast,
    the malloc sink) and the model score so a reviewer can confirm the missing range check. A positive,
    well-localized result lets an engineer add the correct bounds check quickly; poorly localized output
    should be treated with caution. For Harden, explainable localization converts ML signals into concrete
    code fixes. References: [LineVul](https://arxiv.org/abs/2203.05181).'
  answer_sources:
  - SAST Reports
  - Source Code Repositories
  - 'NAI: Application source code repositories and CI/CD pipelines (build, SAST, fuzzing, and sanitizer
    stages).'
  range: Last 90 days
  queries:
  - technology: ML/Explainability pseudocode
    query: 'input flagged_function

      pred = linevul_codebert.predict(flagged_function)

      lines = attention_topk(pred, k=3)   // e.g., a*b mult, unchecked cast, malloc sink

      emit alert{score: pred.score, top_lines: lines}

      reviewer confirms missing range check'
- question: Are incoming HTTP requests carrying integer parameters (e.g., ?id=, ?quantity=, ?offset=,
    ?count=) with values outside a predefined safe range — negative, non-numeric, or greater than the
    type/logical maximum (e.g., > 2147483647 for int32, or > 1,000,000 per business rule)?
  context: 'This deterministic runtime rule operationalizes SEI CERT INT04-C input validation and the
    CWE-190 attacker-controlled-operand patterns at the network/application tier. Scan Zeek http.log and
    app access logs for parameters expected to be integers and alert on each request whose value is <
    0, non-numeric, or exceeds a type or business maximum. Keep these hard thresholds as the detection
    floor regardless of statistical models. A positive result is a request supplying out-of-range integers
    — a strong indicator of integer-range probing or attempted exploitation of missing validation; a negative
    result means observed integer parameters stayed within safe bounds. For Harden, repeated hits also
    reveal which endpoints lack server-side range checks and should be fixed. References: [SEI CERT INT04-C](https://resources.sei.cmu.edu/downloads/secure-coding/assets/sei-cert-c-coding-standard-2016-v01.pdf);
    [CWE-190: Integer Overflow or Wraparound](https://cwe.mitre.org/data/definitions/190.html).'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 5156
  - Web/Application Server Access Logs
  - WAF Logs
  - 'NAI: Public-facing web servers, API gateways, and the application/WAF tier.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Zeek http.log boundary rule\nfor req in http.log:\n  for p in int_params(uri):   // id,\
      \ quantity, offset, count, ...\n    v = value(req, p)\n    if NOT is_integer(v) OR v < 0 OR v >\
      \ 2147483647 OR v > business_max(p):\n      alert(req.id, src_ip=req.id_orig_h, param=p, value=v)"
- question: For each integer parameter, does a request fall outside its learned normal value distribution
    (e.g., beyond the 1st/99th percentile or median +/- 3*IQR), and what are the attack physics — parameter
    magnitude/byte size, out-of-range requests per source IP per minute, and resulting HTTP status?
  context: 'Hard thresholds miss endpoint-specific abuse, so this question learns each integer parameter''s
    normal distribution from historical first-party logs and flags deviations (per-parameter length, character/value,
    and structure models, per Kruegel & Vigna). Establish a baseline with 1st/99th percentiles or median
    +/- 3*IQR and alert when a new request falls outside it. Capture the physics of the attack: Volume
    (parameter magnitude and request byte size), Frequency (out-of-range requests per source IP per minute),
    and State (HTTP status). Derive dataset-specific thresholds per endpoint rather than global constants.
    A positive result is a statistically anomalous integer value for that endpoint, suggesting probing
    or exploitation against a parameter that may lack range validation. References: [Kruegel & Vigna,
    Anomaly Detection of Web-based Attacks](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 5156
  - Web/Application Server Access Logs
  - WAF Logs
  - 'NAI: Public-facing web servers, API gateways, and the application/WAF tier.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each endpoint, param:\n  baseline = percentiles(historical_values, [1,99]) // or median\
      \ +/- 3*IQR\n  if req.value < baseline.p1 OR req.value > baseline.p99: anomaly=true\nphysics:\n\
      \  volume = max(param_magnitude, request_bytes)\n  frequency = count(out_of_range) by src_ip per\
      \ 1m\n  state = http.status_code\nalert if anomaly"
- question: Is a source IP or specific integer parameter driving a statistically significant spike in
    HTTP 400/422 (validation rejects), 404, or 5xx responses for an endpoint (e.g., 4xx/5xx rate > baseline
    mean + 3 sigma over a 5-minute window)?
  context: This treats error/failure rate as a distinct detection signal. Baseline the per-endpoint rate
    of HTTP 400/422, 404, and 5xx responses, then alert when a source IP or parameter drives a significant
    spike. A burst of validation rejects (400/422) indicates an attacker iterating boundary/overflow values
    — probing. A burst of 5xx after large integer inputs indicates the application is mishandling out-of-range
    values and likely lacks range checks — a stronger sign of an exploitable Harden gap. A positive result
    is a 3-sigma spike correlated to a source or parameter; a negative result means error rates are nominal.
    Pair with the boundary-value rule to confirm intent.
  answer_sources:
  - Zeek http.log
  - Windows Event ID 5156
  - Web/Application Server Access Logs
  - WAF Logs
  - 'NAI: Public-facing web servers, API gateways, and the application/WAF tier.'
  range: Last 90 days; evaluate over rolling 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each endpoint, window=5m:\n  for class in [400,422,404,5xx]:\n    rate = count(class)/count(all)\n\
      \    base_mean, base_std = baseline(rate)\n    if rate > base_mean + 3*base_std: spike=true\n  attribute\
      \ spike to src_ip / param\n  4xx burst => probing; 5xx burst after large int => missing range check"
- question: For a critical application endpoint, does an anomaly/time-series model (isolation forest or
    ARIMA/Prophet) trained on Zeek http.log integer-parameter values flag a request as a significant anomaly
    versus the forecast/learned distribution, and do the top-3 contributing features support the alert?
  context: 'For high-value endpoints, train an anomaly or time-series model on integer-parameter values
    and request features so subtle, slow, or distributed probing surfaces that static thresholds miss.
    Flag requests whose integer values deviate significantly from the forecast/learned distribution for
    investigation and potential blocking. Follow ReVeal-style evaluation hygiene (de-duplicate, address
    class imbalance) to avoid inflated accuracy. The alert must surface the top-3 contributing features
    — e.g., parameter value vs. learned 99th percentile, source-IP out-of-range rate, and resulting HTTP
    status — alongside the score for explainable triage (LineVul-style attribution). A positive, well-attributed
    result is an anomalous integer request worth blocking/escalating; opaque high scores should be validated
    against the deterministic rule. References: [ReVeal](https://arxiv.org/abs/2009.07235); [LineVul](https://arxiv.org/abs/2203.05181).'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 5156
  - Web/Application Server Access Logs
  - WAF Logs
  - 'NAI: Public-facing web servers, API gateways, and the application/WAF tier.'
  range: Last 90 days
  queries:
  - technology: ML/Anomaly pseudocode
    query: "train model on http.log[endpoint] integer features (isolation_forest | ARIMA/Prophet)\nfor\
      \ req:\n  score = model.anomaly_score(req.features)\n  if score > threshold:\n    top3 = feature_attribution(req,\
      \ k=3) // value vs p99, src oor_rate, http.status\n    alert{score, top3}; consider block\neval:\
      \ de-duplicate, handle imbalance (ReVeal)"
