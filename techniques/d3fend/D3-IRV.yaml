name: 'D3-IRV: Integer Range Validation'
id: c65e60a4-4c78-42dd-88bf-811dcc2aa2a9
description: 'This playbook helps an analyst investigate where systems are vulnerable to integer-based
  attacks and how Integer Range Validation can be applied to harden them. Integer Range Validation ensures
  an integer is within a valid range before or after an operation, preventing integer overflow/wraparound
  (CWE-190), underflow (CWE-191), and signedness/truncation errors (CWE-197). It supports two investigative
  fronts: (1) source-code and build-pipeline hardening, where SAST, runtime integer sanitizers (UBSan/IOC,
  Clang -fsanitize=integer), symbolic execution, statistical baselining of weakness density, fuzzing yield,
  and ML code classifiers identify functions that consume integer inputs (quantity, user ID, buffer/allocation
  size, loop bound, array index) in sensitive operations without range checks; and (2) runtime detection
  at the network/application tier, where Zeek http.log, web/app access logs, WAF logs, and Windows filtering-platform
  events reveal requests carrying integer parameters that are abnormally large, small, negative, or that
  drive elevated error/failure rates indicative of integer-range probing or exploitation of missing validation.'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
