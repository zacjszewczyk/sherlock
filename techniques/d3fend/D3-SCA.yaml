name: 'D3-SCA: System Call Analysis'
id: c1888a0a-2670-4b4c-b460-130d2ef61d3b
description: 'Investigate whether a process is exhibiting unauthorized behavior by analyzing its system
  calls and the host telemetry that proxies for them (Windows process-creation/Sysmon events, Linux auditd
  SYSCALL records, and eBPF syscall events from Falco/Tracee). This playbook helps an analyst confirm
  that detailed process/system-call telemetry is being collected and is of sufficient quality, then hunt
  for malicious behavior across five complementary methods: deterministic argument-aware syscall signatures
  (process injection, credential dumping, privilege escalation, sensitive-file access); statistical anomaly
  detection over short syscall sequences (sliding-window n-grams, t-stide, and HMMs); volume/frequency/failure-rate
  profiling that captures the physics of an attack (byte and call volume, calls-per-minute, and success/failure
  state, including ransomware-style tight file loops); and machine-learning sequence and whole-system
  provenance-graph models that surface novel, multi-stage intrusions with explainable feature attribution
  for triage. Use it to find rare processes, anomalous parent-child relationships, conserved malicious
  API/syscall chains, and deviations from a program''s normal execution path on critical servers, high-value
  workstations, container hosts, and credential-bearing systems such as Domain Controllers and LSASS hosts.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
