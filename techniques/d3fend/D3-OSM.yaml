name: 'D3-OSM: Operating System Monitoring'
id: 10e6c2ba-bea3-48ee-b2e2-ec1a2593f956
description: 'Investigate what operating system telemetry reveals about adversary activity and OS-log
  tampering, and turn that telemetry into detection. This playbook helps an analyst work three complementary
  OS data streams: (1) full process-creation telemetry (Windows Event ID 4688 / Sysmon Event ID 1) including
  parent-child lineage and command lines, hunting known-bad tooling and LOLBins, masquerading, obfuscated/encoded
  command lines, rare lineages, volume bursts, and provenance-graph anomalies; (2) service-installation
  events (Event ID 7045/4697) for suspicious paths, unsigned binaries, service-name masquerade, remote-exec
  service artifacts (PsExec), enterprise rarity, and per-host install-rate anomalies; and (3) event-log
  integrity and telemetry continuity (log clears 1102/104, audit-policy changes 4719, and missing/dropped
  streams) so that anti-forensics and OS-log tampering are caught even when local logs are altered. It
  layers a deterministic detection floor (Sigma-style symbolic rules) with statistical baselining (entropy,
  rarity, per-host rate sigma-thresholds) and machine-learning approaches (time-series forecasting, content
  classifiers, provenance GNNs, and sequence models) so the analyst can detect, triage, and explain malicious
  OS activity across Windows endpoints, servers, and domain controllers.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any process-creation events (Windows Event ID 4688 / Sysmon Event ID 1) contain command
    lines or image names matching known offensive tooling, LOLBin abuse patterns, or encoding/obfuscation
    markers such as 'whoami', 'net user', 'mimikatz', 'rundll32', Base64 blobs, '-enc', or 'IEX'?
  context: 'In the Detect (D3-D) tactic this is the deterministic detection floor for process telemetry.
    Scan every 4688/Sysmon EID 1 command line and image for known-bad tooling and living-off-the-land
    binary patterns rather than relying on ad-hoc strings, and deploy the maintained process_creation
    rule corpus from SigmaHQ. A positive match means a process was launched using tooling or syntax strongly
    associated with discovery, credential theft, or fileless execution; a negative result across a host
    still leaves the statistical and ML layers to catch novel tradecraft. Keep these deterministic string/path
    rules as the floor and tune them rather than deleting them, because they provide cheap, explainable,
    high-confidence signal that anchors the rest of the playbook. References: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from process_creation (Windows EID 4688 OR Sysmon EID 1)\n| eval cmd = lower(CommandLine),\
      \ img = lower(Image)\n| where match(cmd, \"(whoami|net user|net group|mimikatz|-enc |frombase64|iex\
      \ |invoke-expression)\")\n   OR match(img, \"(mimikatz|rundll32|regsvr32|mshta|certutil)\")\n| lookup\
      \ sigma_process_creation_rules\n| table host, ParentImage, Image, CommandLine, User, rule_name"
- question: Which process-creation events show a parent-child image lineage that is impossible or rare
    for the environment (for example winword.exe or outlook.exe spawning powershell.exe, cmd.exe, or wscript.exe),
    or where the image name, OriginalFileName, signer, and hash disagree, or where a signed-looking system
    binary runs from a user-writable path?
  context: 'Within Detect (D3-D), parent-child lineage is one of the strongest deterministic signals of
    malicious execution. Build an allowlist of normal ParentImage->Image pairs and alert on rare or impossible
    lineages — Office applications spawning script interpreters is a classic phishing payload pattern.
    Using the rich fields in Sysmon EID 1, also flag masquerading (T1036.004): where the Image name, OriginalFileName,
    Signature/Signer, and hash disagree, or where a binary that looks like a signed system file executes
    from C:\Users, %TEMP%, or %PUBLIC%. A positive finding is a lineage or naming inconsistency that legitimate
    software does not produce, making it a high-confidence pivot for triage. References: [Sysmon Community
    Guide process-creation chapter](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/process-creation.md);
    [Masquerade Task or Service, T1036.004](https://attack.mitre.org/techniques/T1036/004/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from process_creation (Sysmon EID 1)\n| eval pair = ParentImage + \"->\" + Image\n| lookup\
      \ parent_child_allowlist on pair\n| eval masquerade = (Image_basename != OriginalFileName)\n   OR\
      \ (Signature==\"signed\" AND Image_path matches \"(C:/Users/|/Temp/|/AppData/|PUBLIC)\")\n| where\
      \ (pair NOT in allowlist) OR masquerade\n| table host, ParentImage, Image, OriginalFileName, Signer,\
      \ Hashes, CommandLine"
- question: Are there spikes in process creation followed by failed child launches, or audit-policy changes
    (Event ID 4719) and security-log clears (Event ID 1102) occurring immediately before or after bursts
    of process creation, or has the expected 4688 volume on an active host suddenly dropped to zero?
  context: 'For Detect (D3-D), failure-mode and telemetry-loss signals are distinct evidence that adversaries
    generate while operating or covering tracks. Profile access-denied and failed child launches as their
    own signal, and correlate process-creation bursts with audit-policy changes (4719) and log-clear events
    (1102) per CAR-2016-04-002 and JPCERT/CC''s lateral-movement artifact mappings. Critically, a drop
    to zero in expected 4688 volume on a host that is otherwise active is itself an alertable telemetry-loss
    signal that may indicate logging was disabled or the host was tampered with. A positive result correlates
    anti-forensic actions with execution activity, tightening the timeline of an intrusion. References:
    [CAR-2016-04-002](https://car.mitre.org/analytics/CAR-2016-04-002/); [JPCERT/CC''s lateral-movement
    report](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days; correlate events within a +/- 30 minute window around clears/policy changes
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from os_events

      | where EventID in (4688, 4719, 1102)

      | bin time span=30m by host

      | stats count(4688) as procs, count(4719) as policy_chg, count(1102) as log_clear by host, bin

      | where (policy_chg>0 OR log_clear>0) AND procs>0

      | append [ from process_creation | timechart per_host_count span=1h | where current_count==0 AND
      host_active==true ]

      | table host, bin, procs, policy_chg, log_clear'
- question: For each parent process, do command-line length, Shannon entropy, or special-character ratio
    exceed the host/role 95th percentile or reach values indicative of obfuscation?
  context: 'In Detect (D3-D), obfuscated command lines evade string-matching rules, so statistical scoring
    of the command line itself catches what the symbolic floor misses. Compute command-line length (bytes),
    Shannon entropy, and special-character ratio per process, using the feature families validated in
    Revoke-Obfuscation, and flag command lines above the host/role 95th percentile or with entropy consistent
    with encoding/packing. Derive thresholds per environment from your own 4688/Sysmon corpus (LANL/Turcotte-style
    baselining) rather than fixed global values. A positive result is a command line statistically unlike
    what that host or role normally runs, a strong indicator of encoded PowerShell, packed payloads, or
    scripted obfuscation worth manual review. References: [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    [Turcotte et al.](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from process_creation (Sysmon EID 1)\n| eval len = length(CommandLine), ent = shannon_entropy(CommandLine),\n\
      \       spc = special_char_ratio(CommandLine)\n| stats p95(len) as len95, p95(ent) as ent95 by host_role\n\
      | where len > len95 OR ent > ent95 OR spc > 0.30\n| table host, ParentImage, Image, len, ent, spc,\
      \ CommandLine"
- question: Which ParentImage->Image lineages are first-seen or appear on fewer than 0.1% of hosts, and
    which hosts exceed their rolling per-host/role process-creation rate by more than 3 sigma or execute
    short command/syscall sequences absent from the program's normal profile?
  context: 'Detect (D3-D) benefits from enterprise-wide rarity statistics: maintain frequency tables for
    ParentImage->Image pairs and per-host process-creation rates, and alert on first-seen lineages (present
    on <0.1% of hosts) and on rates exceeding mean + 3*sigma using rolling per-host means and standard
    deviations, as in Dwyer and Truta. Following Forrest et al., treat short syscall/command sequences
    absent from the per-program normal profile as anomalies, and add call-stack/HMM context where available.
    Track success versus failed launches as a state dimension. A positive result surfaces rare or novel
    execution behavior — the kind produced by new tooling or hands-on-keyboard activity — that deterministic
    rules would not flag. References: [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf); [Hoang et al.](https://link.springer.com/chapter/10.1007/11596981_47).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from process_creation (Sysmon EID 1)\n| eval pair = ParentImage + \"->\" + Image\n| stats\
      \ dc(host) as host_count by pair ; eval prevalence = host_count / total_hosts\n| where prevalence\
      \ < 0.001 OR first_seen(pair) within range\n| join [ from process_creation | stats rolling_mean(rate)\
      \ as mu, rolling_std(rate) as sd by host\n         | where current_rate > mu + 3*sd ]\n| table host,\
      \ pair, prevalence, current_rate, mu, sd, launch_state"
- question: Does any host's process-creation frequency show a positive deviation from its forecasted baseline
    that indicates a burst consistent with ransomware or lateral-movement scripting?
  context: 'In Detect (D3-D), time-series forecasting of per-host process-creation volume catches the
    high-velocity execution bursts characteristic of ransomware encryption loops and scripted lateral
    movement. Build the benign baseline from datasets such as the Unified Host and Network Data Set, forecast
    expected per-host frequency, and flag positive deviations from the forecast. To make alerts actionable,
    surface the top-3 contributing features (host, parent process, and delta-from-forecast) in the alert
    text. A positive result is a statistically significant burst above the model''s expectation, prompting
    immediate investigation before mass file encryption or wide-spread spawning completes. References:
    [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days; forecast on rolling hourly windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation (Sysmon EID 1)

      | timechart span=1h count as obs by host

      | eval forecast = ts_forecast(obs, model="holtwinters")

      | eval delta = obs - forecast

      | where delta > forecast_upper_band

      | eval top_features = top3(host, ParentImage, delta)

      | table host, _time, obs, forecast, delta, top_features'
- question: When a content classifier scores tokenized command lines and script blocks, which new processes
    are scored malicious, and what are the top driving tokens or features behind each score?
  context: 'Detect (D3-D) is strengthened by a learned content classifier that complements the deterministic
    floor. Train a model over tokenized command lines and script blocks (CNN/LSTM with PowerShell-aware
    embeddings, as in Microsoft''s deep-learning PowerShell research) to score each new process as benign
    or malicious, and run it in parallel with the symbolic rules. Emit the top-3 driving tokens/features
    per alert so an analyst can validate the model''s reasoning. A positive (malicious) score on a process
    not caught by string rules indicates obfuscated or novel malicious scripting; the feature attribution
    lets the analyst confirm whether the flagged tokens represent genuine tradecraft or a benign edge
    case to tune out. References: [Microsoft''s deep-learning PowerShell research](https://www.microsoft.com/en-us/security/blog/2019/09/03/deep-learning-rises-new-methods-for-detecting-malicious-powershell/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'from process_creation (Sysmon EID 1)

      | eval tokens = tokenize(CommandLine + ScriptBlockText)

      | eval score = ml_predict(model="cmdline_cnn_lstm", tokens)

      | where score > 0.8

      | eval drivers = explain_top3(model, tokens)

      | table host, Image, CommandLine, score, drivers'
- question: When process, file, and network edges from 4688/Sysmon are assembled into a whole-system provenance
    graph, which nodes or edges are scored anomalous by GNN models trained only on benign data, and what
    compact attack subgraph explains each detection?
  context: 'For Detect (D3-D), provenance-graph anomaly detection captures multi-stage attacks that no
    single event reveals. Assemble process/file/network edges from 4688/Sysmon into a whole-system provenance
    graph and score anomalous nodes and edges with GNN models trained only on benign data — graph temporal
    autoencoders (KAIROS) and GraphSAGE node-level detection (ThreaTrace), benchmarked on DARPA TC E3.
    KAIROS reconstructs a compact attack subgraph to satisfy explainability, and attention weights surface
    the top contributing events. A positive result is an anomalous subgraph linking, for example, a phishing
    parent to credential access and lateral movement, giving the analyst an end-to-end narrative rather
    than isolated alerts. References: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf); [ThreaTrace](https://arxiv.org/pdf/2111.04333);
    [DARPA TC E3 dataset](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md);
    [Brown et al.](https://arxiv.org/abs/1803.04967).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'build_provenance_graph from (Windows EID 4688, Sysmon EID 1) edges=(process,file,network)

      | score nodes,edges with gnn_model in {kairos_temporal_autoencoder, threatrace_graphsage}

      | where anomaly_score > threshold

      | reconstruct compact_attack_subgraph

      | eval top_events = attention_top3(subgraph)

      | table host, anomalous_node, anomalous_edge, anomaly_score, top_events'
- question: Are any new services being installed (Event ID 7045/4697) whose ImagePath points to user-writable
    or temp locations (C:\Users\, C:\Temp\, C:\Windows\Temp\, \AppData\, %PUBLIC%) or whose binary is
    unsigned?
  context: 'Within Detect (D3-D), service installation is a common persistence and privilege/lateral-movement
    mechanism, and a path/signature watchlist is the deterministic floor for it. Alert on new service
    installs whose ImagePath sits in user-writable or temp locations or whose binary is unsigned, and
    deploy the service_creation rule corpus from SigmaHQ. Legitimate services almost always run signed
    binaries from protected system directories, so a service pointing at a user profile or temp folder,
    or running unsigned, is high-fidelity evidence of malicious persistence. Keep this deterministic watchlist
    as the floor and tune it rather than deleting it. References: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: Domain Controllers, Critical Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from service_install (Windows EID 7045 OR EID 4697)\n| eval p = lower(ImagePath)\n| where\
      \ match(p, \"(c:/users/|c:/temp/|c:/windows/temp/|/appdata/|public)\")\n   OR Signature != \"signed\"\
      \n| lookup sigma_service_creation_rules\n| table host, ServiceName, ImagePath, Signature, AccountName,\
      \ rule_name"
- question: Do any installed services use a display name that mimics a legitimate Windows service while
    the binary path or signature disagrees, or match known remote-execution service artifacts such as
    PSEXESVC or randomly-named PsExec services?
  context: 'For Detect (D3-D), service-name masquerade and remote-exec service artifacts are deterministic
    tells of lateral movement and persistence. Flag services whose display name imitates a legitimate
    Windows service but whose binary path or signature disagree (Masquerade Task or Service, T1036.004),
    and match known remote-exec service artifacts — PSEXESVC and randomly-named PsExec services — using
    the exact event mappings in JPCERT/CC''s lateral-movement report. A positive result is a service masquerading
    as system software or matching a known remote-admin tool signature, both strong indicators that an
    adversary executed code on the host from elsewhere in the network. References: [Masquerade Task or
    Service, T1036.004](https://attack.mitre.org/techniques/T1036/004/); [JPCERT/CC''s lateral-movement
    report](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: Domain Controllers, Critical Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from service_install (Windows EID 7045 OR EID 4697)

      | eval name = lower(ServiceName)

      | eval mimic = lookalike(DisplayName, known_windows_services) AND (ImagePath NOT matches expected_path)

      | eval psexec = match(name, "(psexesvc|^[a-z]{8,16}$)") AND ImagePath matches "(ADMIN\\$|/temp/)"

      | where mimic OR psexec

      | table host, ServiceName, DisplayName, ImagePath, Signature'
- question: Which service executable names, paths, or hashes are statistically rare across the enterprise
    (present on fewer than 0.1% of hosts or first-seen), and do any ImagePath strings have high entropy
    or length consistent with randomly-generated names?
  context: 'In Detect (D3-D), enterprise rarity is a powerful unlabeled signal for malicious services.
    Build a frequency distribution of service executable names, paths, and hashes across the enterprise
    and investigate statistical rarities — binaries present on fewer than 0.1% of hosts or first-seen
    names — using a benign baseline such as the Unified Host and Network Data Set. Additionally score
    ImagePath string entropy and length to catch randomly-generated service/binary names favored by malware
    and lateral-movement frameworks. A positive result is a service binary that is essentially unique
    in the environment or whose name looks machine-generated, both of which deserve investigation as possible
    attacker tooling. References: [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: Domain Controllers, Critical Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from service_install (Windows EID 7045 OR EID 4697)

      | stats dc(host) as hosts by ImagePath, Hash

      | eval prevalence = hosts / total_hosts

      | eval name_entropy = shannon_entropy(basename(ImagePath)), name_len = length(basename(ImagePath))

      | where prevalence < 0.001 OR first_seen(Hash) OR name_entropy > 3.5

      | table host, ServiceName, ImagePath, Hash, prevalence, name_entropy, name_len'
- question: On hosts or roles where service installs are rare, does any single install constitute a multi-sigma
    event, and are there failed service starts (Event ID 7000/7009/7011) or installs co-occurring with
    log clears (1102) or audit-policy changes (4719)?
  context: 'Detect (D3-D) leverages the fact that most workstations install services very rarely, so any
    install is a multi-sigma deviation. Compute rolling per-host/role means and standard deviations of
    service-install rate and alert above mean + 3*sigma (Dwyer and Truta). Profile failure and state signals
    distinctly: failed service starts (Event ID 7000/7009/7011) often accompany broken or misconfigured
    malicious services, and installs occurring alongside log clears (1102) or audit-policy changes (4719)
    per CAR-2016-04-002 indicate anti-forensic activity bracketing persistence. A positive result ties
    an unusual install to either failure noise or evidence tampering, both of which raise its priority.
    References: [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [CAR-2016-04-002](https://car.mitre.org/analytics/CAR-2016-04-002/).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: Domain Controllers, Critical Servers, Standard User Endpoints'
  range: Last 90 days; correlate service installs within +/- 30 minutes of log-integrity events
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from service_install (Windows EID 7045 OR EID 4697)

      | stats rolling_mean(installs) as mu, rolling_std(installs) as sd by host_role

      | where current_installs > mu + 3*sd

      | join [ from os_events where EventID in (7000,7009,7011,1102,4719) ] on host within 30m

      | table host, ServiceName, ImagePath, current_installs, mu, sd, correlated_event'
- question: When a supervised classifier scores service-install events using features such as path entropy,
    name length/character profile, signer status, account context, install hour, and parent process, which
    installs are predicted malicious and which features drove each prediction?
  context: For Detect (D3-D), a supervised classifier learns the multidimensional signature of malicious
    service installs that no single rule captures. Train a model (for example a Random Forest) on features
    extracted from install events — ImagePath entropy, service-name length and character profile, signer
    status, user/account context, install hour, and parent process — using historical known-good and known-bad
    installs. Emit the top-3 contributing features in each alert for triage. A positive prediction flags
    an install whose combined characteristics resemble past malicious persistence; the feature attribution
    lets the analyst quickly judge whether, say, high path entropy plus an off-hours install by an unusual
    account is genuinely suspicious.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: Domain Controllers, Critical Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'from service_install (Windows EID 7045 OR EID 4697)

      | eval feats = features(path_entropy, name_len, name_charprofile, signer, account, install_hour,
      parent)

      | eval score = ml_predict(model="svc_install_rf", feats)

      | where score > 0.7

      | eval drivers = feature_importance_top3(model, feats)

      | table host, ServiceName, ImagePath, score, drivers'
- question: When unsupervised anomaly detection (Isolation Forest) runs over service-install feature vectors,
    which installs are flagged as outliers, and where provenance is available, do GNN models score the
    surrounding subgraph anomalous?
  context: 'Detect (D3-D) also benefits from label-free anomaly detection that complements the supervised
    model. Run Isolation Forest over service-install feature vectors to flag outliers without labels (it
    runs in linear time with a tunable anomaly score), catching novel malicious installs the supervised
    model has not seen. Where provenance is collected, score the install''s surrounding subgraph with
    GNN provenance models (KAIROS, ThreaTrace) benchmarked on DARPA TC E3 to confirm whether the install
    sits within a broader anomalous activity chain. A positive result is a service install that is an
    outlier in feature space and/or embedded in an anomalous provenance subgraph, indicating attacker
    persistence even absent matching labels. References: [Isolation Forest](https://ieeexplore.ieee.org/document/4781136);
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf); [ThreaTrace](https://arxiv.org/pdf/2111.04333);
    [DARPA TC E3 dataset](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md).'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: Domain Controllers, Critical Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'from service_install (Windows EID 7045 OR EID 4697)

      | eval feats = features(path_entropy, name_len, signer, account, install_hour, parent)

      | eval iforest_score = isolation_forest(feats)

      | where iforest_score > anomaly_threshold

      | join provenance_subgraph_score(gnn={kairos, threatrace}) on (host, ServiceName)

      | table host, ServiceName, ImagePath, iforest_score, subgraph_score'
- question: Has any Security-log clear (Event ID 1102), other-log clear (Event ID 104), or audit-policy
    change (Event ID 4719) occurred, and to which SubjectUserName can each be attributed?
  context: 'Within Detect (D3-D), log clears and audit-policy changes are rare in normal operations and
    therefore high-fidelity anti-forensic indicators. Alert on every Security-log clear (1102), other-log
    clear (104), and audit-policy change (4719) per CAR-2016-04-002, and attribute each to its SubjectUserName.
    Crucially, forward these events via Windows Event Forwarding to a central collector so that clearing
    a local log cannot hide the very act of clearing it — the central copy survives. A positive result
    is a near-certain sign of an adversary attempting to destroy evidence or disable auditing, and the
    attributed account and host become an immediate investigative pivot. References: [CAR-2016-04-002](https://car.mitre.org/analytics/CAR-2016-04-002/).'
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 104
  - Windows Event ID 4719
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers; Domain Controllers; central WEF/SIEM collector'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from forwarded_events (central WEF collector)

      | where EventID in (1102, 104, 4719)

      | eval action = case(EventID==1102,"security_log_clear", EventID==104,"log_clear", EventID==4719,"audit_policy_change")

      | table _time, host, EventID, action, SubjectUserName'
- question: Does any active host's 4688/Sysmon event stream drop to zero or fall below mean - 3*sigma,
    and is any non-zero count of log-clear or audit-policy-change events occurring relative to a host's
    normal history?
  context: 'For Detect (D3-D), telemetry continuity is itself a security signal. Model expected per-host
    event volume and alert when an active host''s 4688/Sysmon stream drops to zero or below mean - 3*sigma
    using rolling per-host baselines (Dwyer and Truta) — a gap can mean logging was disabled, an agent
    was killed, or the host was isolated by an attacker. Likewise treat any non-zero count of clear or
    policy-change events as a multi-sigma anomaly relative to the host''s history, since their baseline
    is essentially zero. A positive result is either a suspicious silence from a host that should be reporting
    or the appearance of normally-absent tampering events, both warranting investigation as possible anti-forensics.
    References: [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 104
  - Windows Event ID 4719
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers; Domain Controllers; central WEF/SIEM collector'
  range: Last 90 days; evaluate continuity on rolling hourly/daily windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from telemetry_stream (Windows EID 4688, Sysmon EID 1)

      | timechart span=1h count as obs by host

      | stats rolling_mean(obs) as mu, rolling_std(obs) as sd by host

      | where host_active==true AND (obs==0 OR obs < mu - 3*sd)

      | append [ from os_events where EventID in (1102,104,4719) | stats count by host | where count >
      0 ]

      | table host, _time, obs, mu, sd, tamper_event_count'
- question: When the central event-log key stream is modeled with an LSTM next-key predictor, which missing-expected-key
    or out-of-vocabulary anomalies appear, and what are the top contributing log events behind each?
  context: 'In Detect (D3-D), sequence modeling of the log-key stream catches subtle tampering that volume
    thresholds miss. Model the central event-log key stream with an LSTM next-key predictor and flag both
    missing-expected-key anomalies (an event that should follow a sequence but does not, suggesting selective
    deletion) and out-of-vocabulary anomalies (unexpected event types), as in DeepLog. Use attention to
    surface the top-3 contributing log events for analyst review. A positive result indicates the observed
    log sequence deviates from learned normal patterns — for example an expected logon/logoff or service-start
    key never arrives — which can reveal fine-grained log manipulation or stealthy activity even when
    overall volumes look normal. References: [DeepLog](https://doi.org/10.1145/3133956.3134015); [Brown
    et al.](https://arxiv.org/abs/1803.04967).'
  answer_sources:
  - Windows Event ID 1102
  - Windows Event ID 104
  - Windows Event ID 4719
  - Sysmon Event ID 1
  - 'NAI: All Windows endpoints and servers; Domain Controllers; central WEF/SIEM collector'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'from central_eventlog_keystream

      | eval predicted = lstm_next_key(model="deeplog", recent_keys)

      | eval anomaly = (observed_key NOT in predicted_topk) OR (expected_key missing)

      | where anomaly

      | eval top_events = attention_top3(model, recent_keys)

      | table host, _time, observed_key, predicted, anomaly_type, top_events'
