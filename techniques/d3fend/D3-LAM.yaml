name: 'D3-LAM: Local Account Monitoring'
id: 4699ca25-423c-4e5b-8b05-9f8ca599aabe
description: Investigate local user account activity for signs of unauthorized use, persistence, privilege
  escalation, lateral movement, and credential abuse. This playbook helps an analyst examine local account
  lifecycle telemetry (creation, enablement, password reset, and rapid elevation into local Administrators),
  local-account logon behavior (remote first-use of new accounts, default-account remote use, Pass-the-Hash,
  and rare account-to-host edges), and authentication-failure dynamics (brute-force success, password
  spray, and distributed low-and-slow credential attacks). It combines deterministic detection rules,
  statistical baselining and change-point/anomaly methods, and machine-learning sequence and graph models
  so that anomalous local account activity on critical servers, workstations, and domain controllers can
  be detected, scored, and triaged.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has any local account been created (Windows Event ID 4720) and then added to the local Administrators
    group (Event ID 4732) within a very short window (e.g., 5 minutes), optionally chained with enablement
    (4722), password reset (4724), or account change (4738) on the same SID?
  context: 'Supports the Detect tactic by surfacing high-confidence privilege escalation and persistence.
    A legitimate admin rarely creates an account and immediately grants it local administrator rights
    within minutes; attackers do this to stand up a durable, privileged foothold. Correlate by SID across
    the account-management event chain (4720 -> 4722 -> 4724 -> 4738 -> 4732) and enrich each alert with
    the actor (subject) account, target host, parent process, and command line so triage can immediately
    determine whether the activity was sanctioned. A positive result (tight create-to-admin chain) is
    a strong escalation indicator; a negative result means account creation followed normal provisioning
    timelines. Reference(s): [Audit User Account Management, Microsoft](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/audit-user-account-management)'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4722
  - Windows Event ID 4724
  - Windows Event ID 4725
  - Windows Event ID 4726
  - Windows Event ID 4732
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days; correlate the 4720->4732 chain within a 5-minute event-centered window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule create_to_admin:\n  e1 = event(EventID=4720) // account created\n  e2 = event(EventID=4732)\
      \ // added to local Administrators\n  where e2.MemberSid == e1.TargetSid\n    and e2.time - e1.time\
      \ <= 5m\n  optional chain on same Sid: 4722(enabled), 4724(pwd reset), 4738(changed)\n  emit alert(actor=SubjectUserName,\
      \ host=Computer, target_sid=e1.TargetSid,\n             parent_process, command_line) severity=high"
- question: Are there successful logons (Event ID 4624) to the built-in Administrator or Guest accounts
    (SIDs ending in -500 / -501) on hosts where local policy requires those accounts to be disabled, especially
    via remote logon types (3 or 10) or NTLM?
  context: 'Supports the Detect tactic by catching use of accounts that should be dormant. The built-in
    Administrator (-500) and Guest (-501) accounts are common targets because they exist on every host
    and are often overlooked. Any successful interactive or network logon to these accounts where policy
    mandates disablement warrants review. Raise priority when LogonType is 3 (network) or 10 (RemoteInteractive/RDP)
    or when NTLM is used, as these patterns indicate remote abuse rather than local console maintenance.
    A hit means a supposedly disabled high-value account authenticated successfully; absence indicates
    default accounts remain dormant as expected. Reference(s): [CAR-2016-04-004: Successful Local Account
    Login, MITRE](https://car.mitre.org/analytics/CAR-2016-04-004/)'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4722
  - Windows Event ID 4724
  - Windows Event ID 4725
  - Windows Event ID 4726
  - Windows Event ID 4732
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule default_account_logon:\n  e = event(EventID=4624)\n  where e.TargetSid ends_with '-500'\
      \ or e.TargetSid ends_with '-501'\n    and policy_requires_disabled(e.Computer)\n  priority = high\
      \ if e.LogonType in (3,10) or e.AuthenticationPackage=='NTLM'\n  emit alert(account, host=Computer,\
      \ source_ip=IpAddress, logon_type=LogonType)"
- question: Do daily/weekly counts of local account creation (4720) and local-admin group modifications
    (4732) per business unit deviate sharply from their historical baseline, e.g., a modified z-score
    above 3.5 or an abrupt change-point in the time series?
  context: 'Supports the Detect tactic via statistical baselining. Mass or bursty account provisioning
    can indicate automated attacker tooling, compromised provisioning systems, or unauthorized scripting.
    Build a 28-day rolling baseline per business unit and compute the median/MAD modified z-score (flag
    |0.6745*(x-median)/MAD| > 3.5) alongside the historical 95th percentile, then apply CUSUM/PELT/EWMA
    change-point detection to catch abrupt regime shifts. A flagged day means provisioning volume is anomalously
    high (or shifted regime); a normal score means volume is within expected operational range. Reference(s):
    [Modified Z-Score for Anomaly Detection, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4722
  - Windows Event ID 4724
  - Windows Event ID 4725
  - Windows Event ID 4726
  - Windows Event ID 4732
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days; 28-day rolling baseline window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats daily_counts by business_unit, day of count(4720), count(4732)\n  baseline = rolling(28d)\n\
      \  mz = 0.6745*(x - median(baseline)) / MAD(baseline)\n  flag if abs(mz) > 3.5 or x > p95(baseline)\n\
      \  also run CUSUM/PELT/EWMA change_point(series) -> flag regime shift"
- question: Within per-host account-management event-key sequences (e.g., 4720->4722->4724->4732), do
    any events fall outside the model's top-g predicted next keys or exhibit numeric parameter anomalies?
  context: 'Supports the Detect tactic with an ML sequence model that complements (does not replace) the
    deterministic rules. Train an LSTM (DeepLog-style) over ordered account-management event keys per
    host so that the normal grammar of provisioning operations is learned; events that are improbable
    given recent history, or whose numeric parameters deviate, are flagged. Run this in parallel with
    the rule-based chains so novel attacker sequences that evade fixed rules are still caught. Surface
    the top-3 contributing event keys/parameters and the deviating host, and update the model online from
    analyst feedback. A positive result is an out-of-grammar sequence on a host; a negative result is
    a sequence matching learned-normal provisioning. Reference(s): [DeepLog: Anomaly Detection from System
    Logs, Du et al](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4722
  - Windows Event ID 4724
  - Windows Event ID 4725
  - Windows Event ID 4726
  - Windows Event ID 4732
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days (rolling for online model updates).
  queries:
  - technology: ML pipeline/pseudocode
    query: "model deeplog_lstm:\n  input = per_host ordered sequence of account_mgmt event_keys\n  predict\
      \ next_key distribution\n  flag if observed_key not in top_g predicted or param_anomaly(numeric)\n\
      \  output top3 contributing keys/params, host\n  feedback_loop: online_update(analyst_label)"
- question: Is a newly created local account (Event ID 4720) first used via a remote logon (LogonType
    3 or 10) or from an unusual source host/subnet, as seen by correlating its first 4624 logon and matching
    Zeek conn.log sessions?
  context: Supports the Detect tactic by exposing lateral-movement staging. Legitimately provisioned accounts
    usually have their first use locally or from an expected management host; an account whose very first
    logon is remote, or comes from an atypical subnet, suggests it was created to move laterally or to
    provide remote access. Correlate the 4720 creation event with the account's first 4624 logon and align
    with Zeek conn.log sessions to confirm the network origin. A positive result is a brand-new account
    immediately used remotely from an unusual source; a negative result is first-use that matches normal
    provisioning patterns.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4720
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days; window first logon relative to account creation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join e_create=event(4720) with e_first=first(event(4624) by TargetUser)\n  where e_first follows\
      \ e_create\n    and (e_first.LogonType in (3,10) or unusual(e_first.IpAddress))\n  enrich with zeek.conn\
      \ where src_ip==e_first.IpAddress\n  emit alert(account, src_host/subnet, logon_type)"
- question: Are there 4624 logons where the authentication package is NTLM, LogonType is 3, the account
    is not ANONYMOUS LOGON, and it is not a domain logon - indicating local-credential Pass-the-Hash between
    hosts?
  context: 'Supports the Detect tactic with a high-fidelity Pass-the-Hash (PtH) indicator (per CAR-2016-04-004).
    When local credentials are reused across workstations via stolen hashes, the resulting network logon
    authenticates with NTLM (LogonType 3) using a local (non-domain) account, excluding anonymous logons.
    This pattern is rarely benign for local accounts and strongly suggests credential theft and lateral
    movement. Enrich with source/destination hosts and the local account to map spread. A positive result
    is an NTLM type-3 local logon; absence indicates local accounts are not being used for PtH-style network
    authentication. Reference(s): [CAR-2016-04-004: Successful Local Account Login, MITRE](https://car.mitre.org/analytics/CAR-2016-04-004/)'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4720
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule local_pth:\n  e = event(4624)\n  where e.AuthenticationPackage=='NTLM'\n    and e.LogonType==3\n\
      \    and e.TargetUser != 'ANONYMOUS LOGON'\n    and not is_domain_logon(e)\n  emit alert(account,\
      \ src_host=WorkstationName/IpAddress, dst_host=Computer)"
- question: For the same local account, do consecutive 4624 logons imply a physically impossible travel
    velocity between their geo-enriched source IPs (excluding known VPN/egress ranges)?
  context: 'Supports the Detect tactic via impossible-travel analytics. By geo-enriching the source IP
    of each 4624 logon and computing the implied travel speed between consecutive logons for the same
    local account, you can flag pairs that no human could traverse in the elapsed time - a signal of credential
    sharing or compromise. Exclude known VPN/egress ranges and apply a confidence radius to reduce false
    positives from geolocation imprecision. A positive result is an impossible-velocity logon pair; a
    negative result is geographically/temporally plausible logon sequences. Reference(s): [Impossible
    Travel Detection (WO2018085161A1), Microsoft](https://patents.google.com/patent/WO2018085161A1/en)'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4720
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days; evaluate consecutive logon pairs per account.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats per local_account:\n  for consecutive 4624 logons (t1,ip1),(t2,ip2):\n    geo1=geoip(ip1);\
      \ geo2=geoip(ip2)\n    velocity = distance(geo1,geo2)/(t2-t1)\n  flag if velocity > max_human_speed\n\
      \    and ip1,ip2 not in known_vpn/egress\n    and distance > confidence_radius"
- question: Within the local-account->host authentication graph, are there low-probability or first-time
    user->host logon edges, or causal login paths showing credential switching, that score as anomalous?
  context: 'Supports the Detect tactic with unsupervised graph analytics. Learn embeddings of the normal
    local-account->host authentication graph (CyberGraph-style) so that new, low-probability edges - a
    user logging into a host they have never touched - stand out, and infer causal login paths (Hopper-style)
    to highlight credential switching or rare edges along a movement chain. Tune to an operational alert
    budget (~9-15/day) and emit the contributing edge, path, and rarity score. A positive result is a
    rare/novel account-to-host edge or suspicious path; a negative result is logons confined to historically
    normal edges. Reference(s): [CyberGraph: Detecting Lateral Movement with Unsupervised Graph AI, Bowman
    et al](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf) [Hopper: Modeling and
    Detecting Lateral Movement, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf)'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4720
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days; build graph over rolling history.
  queries:
  - technology: ML pipeline/pseudocode
    query: "model auth_graph:\n  build graph(local_account -> host) from 4624\n  learn unsupervised embeddings\n\
      \  score new_edge probability; flag low-prob/first-time edges\n  infer login paths; anomaly_score(path)\
      \ for credential switching\n  tune alert_budget ~9-15/day; emit edge, path, rarity_score"
- question: When a local-account logon sequence is scored anomalous, which fields (account, source host/IP,
    destination, auth type, hour) contribute most, and does the score agree with UEBA peer-group/blast-radius
    scoring?
  context: 'Supports the Detect tactic by making ML alerts explainable and corroborated. Score local-account
    logon sequences with an attention-augmented RNN language model and surface the top-3 contributing
    fields so analysts understand why a sequence was flagged, then cross-validate against UEBA peer-group/blast-radius
    scoring before escalating. This reduces alert fatigue and improves triage confidence. A positive result
    is a high anomaly score with coherent contributing fields confirmed by UEBA; a negative or low-confidence
    result (model and UEBA disagree) tempers escalation. Reference(s): [RNN Attention for Interpretable
    System Log Anomaly Detection, Brown et al](https://arxiv.org/abs/1803.04967) [Entity Behavior Analytics
    (UEBA), Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4720
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: "model attn_rnn_logon:\n  score local_account logon sequences\n  emit top3 contributing fields\
      \ (account, src_host/ip, dst, auth_type, hour)\n  cross_validate with UEBA peer_group/blast_radius\
      \ score\n  escalate only if both concur"
- question: For each local account, does the ratio of failed (4625) to successful (4624) logons and the
    login-hour distribution change abruptly - e.g., a sudden drop in failure rate paired with a new successful
    remote logon (probable brute-force success)?
  context: 'Supports the Detect tactic by treating the failure stream as a distinct signal. A burst of
    failures that suddenly ceases and is followed by a successful remote logon is the classic signature
    of a brute-force attempt that finally succeeded or of unauthorized account enablement. Monitor the
    4625->4624 transition ratio and login-hour distribution per account and apply change-point detection
    (CUSUM/EWMA) to flag the regime shift. A positive result is a failure-rate collapse coincident with
    new successful remote access; a negative result is stable failure/success dynamics. Reference(s):
    [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats per local_account:\n  series = ratio(count_4625, count_4624) over time; login_hour_dist\n\
      \  apply CUSUM/EWMA change_point(series)\n  flag if failure_rate drops sharply AND new successful\
      \ remote 4624 appears\n  treat 4625 stream as distinct signal"
- question: Does a single source host generate 4625 failures against N or more distinct local accounts
    within a rolling window (start N>=10 per 30 min), especially targeting default/service accounts?
  context: 'Supports the Detect tactic by tracking distinct-account fan-out rather than raw failure count,
    the defining feature of password spraying. Attackers try one or a few passwords across many accounts
    to avoid lockouts, so the key signal is one source touching many distinct local accounts. Start with
    N>=10 distinct accounts per 30 minutes and tune to the environment, and raise priority when default/service
    accounts are targeted. A positive result is high distinct-account fan-out from one source; a negative
    result is failures concentrated on few accounts (more consistent with mistyped passwords or targeted
    brute force). Reference(s): [Detecting Password Spraying Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days; rolling 30-minute window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "stats by source_host, window(30m):\n  distinct_accounts = dcount(TargetUser where EventID=4625)\n\
      \  flag if distinct_accounts >= 10  // tune N\n  boost if any target in default/service accounts\n\
      \  emit alert(source_host, account_fanout)"
- question: Across many source IPs and accounts, do clustered authentication events (using distinct-source,
    distinct-account, and failure-ratio features) reveal distributed low-volume password spray that evades
    per-source thresholds?
  context: 'Supports the Detect tactic with ML clustering for low-and-slow attacks. Sophisticated actors
    distribute spray across many IPs so that no single source crosses a threshold; clustering authentication
    events on distinct-source, distinct-account, and failure-ratio features surfaces the aggregate campaign.
    Report the cluster''s contributing sources/accounts and aggregate failure ratio so analysts can act
    on the campaign rather than isolated events. A positive result is a coherent cluster of low-volume
    failures spanning many sources/accounts; a negative result is no such aggregate structure. Reference(s):
    [Hunting Low and Slow Password Sprays Using ML, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052)'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days
  queries:
  - technology: ML pipeline/pseudocode
    query: "model lowslow_spray_cluster:\n  features per auth event: distinct_source, distinct_account,\
      \ failure_ratio\n  cluster across source_ips and accounts\n  flag clusters with broad source/account\
      \ spread + elevated failure_ratio\n  emit contributing sources/accounts, aggregate failure_ratio"
- question: Do per-account and peer-group baselines of logon volume, success/failure counts, distinct
    destinations, bytes transferred (Zeek conn.log), and active hours show deviations beyond the peer-group
    distribution for any local account?
  context: 'Supports the Detect tactic via UEBA peer-group analytics. By baselining each local account
    against itself and its peer group across logon volume, success/failure counts, distinct destinations,
    transferred bytes, and active hours, you can detect subtle behavioral shifts - an account suddenly
    touching many destinations, transferring unusual volumes, or active at odd hours - that point-rules
    miss. Include the deviating features and an investigation-priority score for triage. A positive result
    is an account whose behavior departs sharply from its peer group; a negative result is behavior consistent
    with peers. Reference(s): [Entity Behavior Analytics (UEBA), Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Critical servers, workstations, and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats build baseline per local_account and peer_group:\n  features = logon_volume, success_count,\
      \ failure_count,\n            distinct_destinations, bytes (zeek.conn), active_hours\n  flag account\
      \ where features deviate beyond peer_group distribution\n  emit deviating_features, investigation_priority_score"
