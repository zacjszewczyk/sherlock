name: 'D3-DPR: Decoy Public Release'
id: 0e127d44-9ea7-4472-a646-30295808906f
description: >-
  Investigate adversary engagement with decoy public-release media (press releases, videos, marketing
  collateral) that intentionally embed enticing artifacts -- decoy URLs, DNS names, API paths, points
  of contact, credential canaries, web bugs, and other tripwire identifiers that have no legitimate purpose.
  This playbook helps an analyst determine whether an external source that consumed decoy content went
  on to probe, connect to, authenticate against, or otherwise interact with decoy-only infrastructure
  and identifiers, distinguishing genuine adversary interest from benign internet background traffic and
  legitimate consumers of the release. It combines deterministic high-fidelity rules (any contact with
  decoy-only assets or first touch of an embedded canary is near-zero-false-positive), correlation of
  release viewers to downstream probing, statistical profiling of failure-state behavior, port/path entropy
  and concentration scoring, volume/frequency baselining of decoy hits and canary triggers, and machine-learning
  classification, ranking, and session/sequence modeling to prioritize and attribute candidate adversary
  interactions for containment and intelligence collection.
type: technique
related:
- tactic_id: D3
  tactic_name: Deceive
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any external source made inbound contact -- via connection attempts, DNS resolutions,
    HTTP requests, or failed logons -- with hostnames, IP addresses, API paths, or credential canaries
    that exist ONLY in decoy public-release content and have no legitimate business use?
  context: 'This is the deterministic detection floor in support of the Deceive tactic: decoy-only assets
    and identifiers have no legitimate purpose, so any inbound Zeek conn.log/dns.log/http.log event or
    Windows Event ID 4625 against them is a high-fidelity, near-zero-false-positive signal of adversary
    engagement with the deception. Maintain a watchlist of every decoy hostname, IP, API path, and credential
    canary published only in decoy releases and match all inbound activity against it. For each hit, record
    source IP, user agent, timestamp, referrer, and exactly which identifier was touched to support attribution
    and campaign tracking. A positive result confirms the deception worked and an adversary is interacting
    with the decoy; absence of hits simply means no engagement yet and does not invalidate the decoy.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      DECOY = watchlist(decoy_hostnames, decoy_ips, decoy_api_paths, credential_canaries)

      for ev in (zeek_conn.log + zeek_dns.log + zeek_http.log + EventID==4625):
        if ev.dest in DECOY or ev.query in DECOY or ev.uri in DECOY or ev.account in DECOY:
          alert(HIGH, src_ip=ev.src, ua=ev.user_agent, ts=ev.ts, referrer=ev.referrer, hit=ev.identifier)
  - technology: Zeek/pseudocode
    query: >-
      event dns_request / http_request / connection_attempt:
        if matches_decoy_watchlist(target): log decoy_touch(src_ip, target, ts, user_agent, referrer)
- question: For source addresses that requested decoy-release content in Zeek http.log, did the SAME source
    subsequently perform DNS lookups, connection attempts, or failed logons against decoy infrastructure
    within a defined follow-on window (e.g., 24-72 hours)?
  context: Correlating release viewers to downstream probing establishes campaign continuity and elevates
    confidence that interaction is adversarial rather than incidental, supporting the Deceive tactic's
    goal of confirming and characterizing adversary engagement. Link source IPs seen fetching decoy public-release
    pages in http.log to follow-on decoy DNS resolutions, decoy service connections, or Windows Event
    ID 4625 logons within the chosen window. A matched chain (viewed the release -> acted on its decoy
    artifacts) is a strong indicator of a single actor working through the deception lifecycle; an isolated
    page view with no follow-on is likely a benign reader.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days (correlate per-source over a 24-72h follow-on window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      viewers = http.log where uri in decoy_release_pages | fields src_ip, view_ts

      probes = (dns.log + conn.log + EventID==4625) where target in DECOY | fields src_ip, probe_ts

      join viewers, probes on src_ip

      where 0 <= (probe_ts - view_ts) <= 72h

      | stats min(view_ts), values(target), count by src_ip -> alert(campaign_continuity)
- question: For each external source touching decoy or non-existent services, does sequential hypothesis
    testing (Threshold Random Walk) over connection outcomes -- success vs. failed/blocked/no-response,
    plus NXDOMAIN and HTTP 404 against decoy paths -- cross the malicious threshold within a few attempts?
  context: Targeted probing produces a high ratio of failed/unanswered attempts to decoy or non-existent
    services, which a Threshold Random Walk distinguishes from benign access typically within ~4-5 attempts.
    In support of the Deceive tactic, profiling the failure-state of each source separates deliberate
    reconnaissance against the deception from accidental or background access. Derive site-specific thresholds
    from observed benign failure baselines. A source that quickly accumulates failed/NXDOMAIN/404 outcomes
    against decoy targets crosses into the malicious region and warrants alerting; a source that mostly
    succeeds against real services does not.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      for src in sources_touching(DECOY or nonexistent):
        for each attempt in time_order(src):
          outcome = success ? theta1 : theta0  # failed/blocked/no-response/NXDOMAIN/404
          LLR += log( P(outcome|malicious) / P(outcome|benign) )
          if LLR >= upper_threshold: alert(src, 'TRW malicious'); break
          if LLR <= lower_threshold: mark benign; break
- question: For each source IP interacting with honeynet targets, is its 1-hour destination-port entropy
    abnormally LOW and its per-asset connection concentration abnormally HIGH (e.g., below the 10th percentile
    entropy and above 3 standard deviations concentration), indicating focused targeting rather than broad
    scanning?
  context: 'Focused interaction with decoy assets looks different from indiscriminate internet-wide scanning:
    it concentrates on a small set of ports/paths on specific decoy targets, producing low destination-port
    entropy and high connection concentration. Supporting the Deceive tactic, this scoring identifies
    adversaries who singled out the decoy infrastructure -- evidence the deception drew specific interest.
    Compute per-source hourly port entropy and per-asset concentration, and use KL divergence against
    an expected port/path distribution for sharper, tunable separation. Low-entropy, high-concentration
    behavior flags targeted engagement; high-entropy spray is generic scanning.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days (1-hour scoring windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      for src in sources hitting honeynet (1h windows):
        H = shannon_entropy(dest_ports)
        C = max_connections_to_single_asset / total_connections
        KL = kl_divergence(observed_port_dist, expected_port_dist)
        if H < p10(entropy_baseline) and C > mean+3*std(conc_baseline):
          alert(src, 'targeted decoy interaction', H, C, KL)
- question: Do daily baselines for decoy-hit volume, per-source byte counts/ratios, request frequency,
    unique source count, and repeat-touch ratio (by source ASN or geography) show significant deviations
    (e.g., >3 sigma) indicating a surge in adversary interest in the decoy releases?
  context: Sustained or sudden increases in interaction with decoy assets signal heightened adversary
    attention, which directly answers the Deceive tactic's question of how effective the decoys are at
    engaging adversaries. Build daily baselines for decoy-hit volume, per-source byte counts/ratios, request
    frequency (count/min), unique source count, and repeat-touch ratio, segmented by source ASN or geography
    per honeypot data-analysis practice. Alert on deviations beyond ~3 sigma. A spike -- especially concentrated
    in a particular ASN/geo or repeat sources -- indicates an active campaign; stable low-level activity
    is the background baseline.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days (daily baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      daily = decoy_touches | bin(1d) | stats count, sum(bytes), avg(byte_ratio),
        rate(req_per_min), dc(src_ip), repeat_touch_ratio by day, src_asn, src_geo
      baseline = rolling_mean_std(daily, window=30d)

      where metric > baseline.mean + 3*baseline.std -> alert(surge, metric, src_asn, src_geo)
- question: Does a supervised classifier (Logistic Regression or Gradient Boosting) trained on confirmed
    decoy touches flag a given interaction as a targeted adversary engagement, using features such as
    connection duration, byte counts/ratios, request-path rarity, source reputation, failed-attempt ratio,
    and prior decoy-page access?
  context: Layered on top of (never replacing) the deterministic decoy-touch rules, a supervised model
    catches subtler adversary interactions and prioritizes them in support of the Deceive tactic. Train
    on labels derived from confirmed decoy touches using features like connection duration, byte counts/ratios,
    request-path rarity, source reputation, failed-attempt ratio, and prior decoy-page access. Emit the
    top-3 contributing features with each alert so analysts can triage and validate. A high-probability
    classification with sensible feature attributions warrants investigation; the deterministic rules
    remain the source of ground truth.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [conn_duration, byte_count, byte_ratio, path_rarity, src_reputation,
        failed_attempt_ratio, prior_decoy_page_access]
      model = GradientBoosting().fit(X_confirmed_touches, y_labels)

      score = model.predict_proba(event.features)

      if score > threshold: alert(event, score, top3_features=shap(model, event))
- question: When unsupervised outlier ranking over decoy-related web/firewall logs is fused with a supervised
    model retrained on analyst feedback, which candidate adversary interactions rise to the top of the
    priority queue while false positives are suppressed?
  context: An analyst-in-the-loop design (as in AI^2) combines unsupervised anomaly ranking with a supervised
    model that learns from analyst dispositions, continuously improving precision over decoy-related web
    and firewall logs. Supporting the Deceive tactic, this surfaces and prioritizes the most likely adversary
    interactions with the decoys while reducing alert fatigue. Feed daily analyst feedback back into retraining.
    Events that both the outlier detector and the feedback-trained model rank highly are the strongest
    candidates for deeper investigation and containment.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      unsup_score = outlier_rank(decoy_web_fw_logs)

      sup_score = supervised_model.predict(event)  # retrained on analyst labels

      rank = combine(unsup_score, sup_score)

      present top_k(rank) to analyst -> collect feedback -> retrain supervised_model nightly
- question: Do clustered attacker sessions modeled as event chains (decoy page fetch -> DNS resolve ->
    service probe -> authentication attempt) reveal high-confidence malicious timelines that should be
    grouped into campaigns and escalated for containment and collection?
  context: A sequence/session model trained on event chains captures the order and structure of adversary
    interaction with the deception, enabling clustering of attacker sessions to assign risk and group
    related campaigns. In support of the Deceive tactic, modeling intent across the kill-chain of decoy
    interaction (page fetch -> DNS resolve -> service probe -> auth attempt) lets analysts escalate coherent,
    high-confidence malicious timelines for containment and intelligence collection. Sessions that follow
    the full decoy-engagement progression carry the highest risk; fragmentary or benign sequences cluster
    separately.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Honeynet segment hosting decoy assets and web server logs for the public release page.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      sessions = sessionize(decoy_events by src_ip, gap=30m)

      seq = [page_fetch, dns_resolve, service_probe, auth_attempt]

      model = sequence_model().fit(session_event_chains)

      clusters = cluster(session_embeddings)

      risk = score(clusters)

      if risk high: group_campaign(sessions); escalate(containment, collection)
- question: Has a unique tripwire identifier embedded only in decoy public-release media -- a decoy URL,
    DNS name, cloud API key, decoy document, web bug, or QR code -- been accessed, resolved, or used for
    the first time, and if so from what source IP, user agent, timestamp, and referrer?
  context: Embedded canary/honeytoken identifiers have no legitimate use, so the very first access, resolution,
    or use deterministically signals that an adversary acted on the decoy content rather than a legitimate
    consumer of the release -- a near-zero-false-positive detection supporting the Deceive tactic. Embed
    unique tripwires (URLs, DNS names, cloud API keys, decoy documents, web bugs, QR codes) in published
    media and alert on first touch, capturing source IP, user agent, timestamp, and referrer to attribute
    which specific release artifact was hit. Any trigger is actionable; the canary trigger log plus web/DNS
    logs provide corroboration and attribution.
  answer_sources:
  - Canarytoken trigger log
  - Zeek http.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Canary/honeytoken alerting service and web/DNS logs covering the decoy-release identifiers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      CANARIES = embedded_identifiers(decoy_urls, decoy_dns, api_keys, web_bugs, qr_codes)

      for ev in (canarytoken_trigger.log + zeek_http.log + zeek_dns.log):
        if ev.identifier in CANARIES:
          alert(HIGH, token=ev.identifier, src_ip=ev.src, ua=ev.user_agent, ts=ev.ts, referrer=ev.referrer)
- question: Has any authentication or API call presented a decoy credential or API key that is referenced
    ONLY in decoy releases -- for example a Windows Event ID 4625 against a decoy account or a cloud control-plane
    call using a canary key?
  context: Decoy credentials and API keys planted exclusively in decoy releases are unauthorized by construction,
    so any attempt to use them is malicious. Supporting the Deceive tactic, this catches adversaries who
    harvested credentials from the decoy media and tried to reuse them. Alert on any logon attempt against
    a decoy account (Windows 4625) or any cloud control-plane / API call presenting a canary key. A single
    use is a definitive indicator of compromise of the deception artifact and should trigger immediate
    triage and attribution; record the presenting source for tracking.
  answer_sources:
  - Canarytoken trigger log
  - Zeek http.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Canary/honeytoken alerting service and web/DNS logs covering the decoy-release identifiers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      DECOY_CREDS = decoy_accounts + canary_api_keys

      for ev in (EventID==4625 + cloud_control_plane.log + api_gateway.log):
        if ev.account in DECOY_CREDS or ev.api_key in DECOY_CREDS:
          alert(HIGH, 'decoy credential reuse', src_ip=ev.src, cred=ev.identifier, ts=ev.ts)
- question: Do per-token trigger counts, unique source counts, and inter-arrival frequency show bursts
    or sustained increases beyond a per-token baseline (e.g., >3 sigma), signaling active adversary engagement
    with the released decoys?
  context: Beyond first-touch alerting, baselining each canary token's trigger volume and source diversity
    reveals when engagement intensifies -- directly measuring decoy effectiveness for the Deceive tactic.
    Track per-token trigger counts, unique sources, and inter-arrival times, then alert on bursts or sustained
    increases beyond the token's baseline (~3 sigma). A spike in triggers or a sudden rise in distinct
    sources hitting the same token indicates the decoy has drawn active adversary attention and may mark
    a coordinated campaign; steady low rates are the background baseline.
  answer_sources:
  - Canarytoken trigger log
  - Zeek http.log
  - Zeek dns.log
  - Windows Event ID 4625
  - 'NAI: Canary/honeytoken alerting service and web/DNS logs covering the decoy-release identifiers.'
  range: Last 90 days (per-token baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per_token = canarytoken_trigger.log | stats count, dc(src_ip), avg(inter_arrival) by token, bin(1d)

      baseline = rolling_mean_std(per_token, window=30d) by token

      where count > baseline.mean + 3*baseline.std or dc(src_ip) spikes -> alert(token, 'engagement surge')
