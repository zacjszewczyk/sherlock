name: 'D3-SAOR: Segment Address Offset Randomization'
id: 91823c71-2701-42d9-a70e-447b2fd4a85d
description: 'Investigate whether Segment Address Offset Randomization (D3-SAOR) — better known as Address
  Space Layout Randomization (ASLR) and its complementary exploit mitigations (DEP, High-Entropy ASLR,
  CFG) — is actually enabled, high-entropy, and comprehensively applied across every loaded module on
  critical Windows and Linux assets, and detect active attempts to bypass or defeat that randomization
  at runtime. This playbook helps an analyst (1) audit configuration and coverage: confirm processes launch
  with Mandatory/Bottom-up/High-entropy ASLR, that the system-wide policy and registry/sysctl settings
  match the hardening standard, that PE DllCharacteristics and Linux ELF headers (PIE/ET_DYN) indicate
  every module participates in randomization, and that the effective entropy budget meets the 64-bit high-entropy
  bar; and (2) hunt for in-progress exploitation that tries to defeat ASLR: return/jump-oriented programming
  (code-reuse) gadget chains, triggered exploit-mitigation violations, brute-force derandomization crash
  bursts, heap-spray address occupancy, memory-disclosure/info-leak primitives, and microarchitectural
  side-channel probing. It combines deterministic symbolic-logic rules, statistical baselining and outlier
  detection, and machine-learning anomaly/classification scoring with feature attribution, so the analyst
  can both measure ASLR coverage gaps on high-value targets (Domain Controllers, database servers, external-facing
  web/application servers, browsers and document readers) and catch adversaries actively working to bypass
  memory randomization.'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which processes on critical assets are launching WITHOUT their required exploit mitigations
    — specifically without Mandatory ASLR (Force Relocation), Bottom-up ASLR, or High-entropy ASLR — as
    reported by Windows Defender Exploit Guard and Microsoft-Windows-Security-Mitigations events, particularly
    high-value images such as lsass.exe, sqlservr.exe, and w3wp.exe?
  context: 'Under the Harden (D3-H) tactic, the first measure of ASLR coverage is whether sensitive processes
    actually start with randomization enforced. Query host logs (Windows Defender Exploit Guard / Microsoft-Windows-Security-Mitigations)
    for process-creation events that lack the required mitigations and alert on any process on a critical
    asset launched without Mandatory ASLR (force relocation), Bottom-up ASLR, or High-entropy ASLR. Run
    Exploit Protection in audit mode so non-compliant launches are logged without blocking production
    workloads. A positive finding is a high-value process (lsass.exe, sqlservr.exe, w3wp.exe) running
    with a predictable memory layout an attacker can target; a negative result confirms the process inherits
    the hardening standard. Source: [Exploit Protection Reference](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference).'
  answer_sources: &id001
  - Windows Defender Exploit Guard Event Logs
  - Microsoft-Windows-Security-Mitigations/Kernel Mode and User Mode
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Windows Registry
  - PE Optional Header DllCharacteristics
  - Linux /proc/sys/kernel/randomize_va_space
  - Linux ELF headers (readelf/checksec)
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and external-facing
    web/application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from exploit_guard_or_security_mitigations (process_create)

      | where host in critical_assets

      | eval missing = NOT (mandatory_aslr AND bottom_up_aslr AND high_entropy_aslr)

      | where missing OR image in ("lsass.exe","sqlservr.exe","w3wp.exe")

      | table host, image, mandatory_aslr, bottom_up_aslr, high_entropy_aslr, audit_mode'
- question: Is ASLR enforced system-wide on critical assets according to the registry (HKLM\SYSTEM\CurrentControlSet\Control\Session
    Manager\Memory Management\MoveImages and the Exploit Guard mitigation policy) and Get-ProcessMitigation
    -System, and does any host's effective configuration deviate from the hardening standard or contain
    a per-process override that silently disables ASLR?
  context: 'Supporting the Harden (D3-H) tactic, this verifies the system-wide ASLR policy rather than
    individual launches. Confirm ASLR is enforced via the registry (MoveImages value and the Exploit Guard
    mitigation policy) or Get-ProcessMitigation -System, then compare each host''s effective configuration
    against the documented hardening standard. Alert if the system policy is weaker than the baseline
    or if a per-process override silently disables ASLR for a sensitive image. A positive finding indicates
    a configuration drift or deliberate weakening of the mitigation baseline that leaves processes with
    predictable layouts; a negative result confirms policy parity with the standard. Source: [Exploit
    Protection Reference](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from host_config (registry MoveImages, exploit_guard_policy, get_processmitigation_system)

      | eval system_aslr_ok = (MoveImages==1 AND policy.ForceRelocateImages==ON AND policy.BottomUp==ON)

      | eval override = exists(per_process_override where aslr_disabled)

      | where NOT system_aslr_ok OR override OR effective_config != hardening_standard

      | table host, MoveImages, policy, override, deviation'
- question: For every module loaded into a sensitive process (Sysmon Event ID 7), does the PE Optional
    Header DllCharacteristics field have the DYNAMIC_BASE bit (0x0040) and, on 64-bit, the HIGH_ENTROPY_VA
    bit (0x0020) set — or is there a non-ASLR image creating an exploitable coverage gap inside an otherwise
    randomized process?
  context: 'Within the Harden (D3-H) tactic, ASLR is only as strong as its weakest module: a single non-randomized
    DLL gives an attacker a fixed island of code/data to pivot from. For modules loaded into sensitive
    processes (Sysmon Event ID 7), statically inspect the PE Optional Header DllCharacteristics (e.g.,
    dumpbin /headers or a PE parser) and alert when the DYNAMIC_BASE bit (0x0040) is unset, or on 64-bit
    when HIGH_ENTROPY_VA (0x0020) is unset. A positive finding is a non-ASLR image loaded into a process
    that is otherwise randomized — a coverage gap; a negative result confirms all loaded modules opt into
    randomization. Sources: [/DYNAMICBASE (Use address space layout randomization)](https://learn.microsoft.com/en-us/cpp/build/reference/dynamicbase-use-address-space-layout-randomization);
    [SoK: Automated Software Diversity](https://www.ieee-security.org/TC/SP2014/papers/SoK_c_AutomatedSoftwareDiversity.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from image_load (Sysmon EID 7) where target_image in sensitive_processes

      | lookup pe_headers on loaded_module -> DllCharacteristics

      | eval dynamic_base = (DllCharacteristics & 0x0040)

      | eval high_entropy = (DllCharacteristics & 0x0020)

      | where NOT dynamic_base OR (arch=="x64" AND NOT high_entropy)

      | table host, target_image, loaded_module, DllCharacteristics, signer'
- question: On Linux NAIs, is kernel.randomize_va_space set to 2 (full ASLR including the heap), are critical
    executables position-independent (ET_DYN per readelf -h / checksec), and has anything written 0 or
    1 to /proc/sys/kernel/randomize_va_space or persisted a weakening in /etc/sysctl.conf or boot parameters?
  context: 'For Linux assets under the Harden (D3-H) tactic, full ASLR requires both the kernel sysctl
    and PIE-built binaries. Assert kernel.randomize_va_space == 2 (full ASLR incl. heap) and that critical
    executables are position-independent (ET_DYN via readelf -h / checksec). Alert on any write of 0 (disabled)
    or 1 (partial) to /proc/sys/kernel/randomize_va_space, on persisted changes in /etc/sysctl.conf or
    kernel boot parameters, and on non-PIE (ET_EXEC) critical binaries. A positive finding is a downgraded
    sysctl or a fixed-base ET_EXEC critical binary — both restore predictability to an attacker; a negative
    result confirms full randomization with PIE coverage. Source: [kernel.org sysctl: randomize_va_space](https://www.kernel.org/doc/html/latest/admin-guide/sysctl/kernel.html).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from linux_telemetry (auditd, sysctl, file_writes, elf_inventory)

      | eval sysctl_ok = (randomize_va_space == 2)

      | eval downgrade = write_to("/proc/sys/kernel/randomize_va_space") AND value in (0,1)

      | eval persisted = change_in("/etc/sysctl.conf") OR change_in(boot_params)

      | eval non_pie = (critical_binary.elf_type == "ET_EXEC")

      | where NOT sysctl_ok OR downgrade OR persisted OR non_pie

      | table host, randomize_va_space, downgrade, persisted, non_pie, binary'
- question: Across all process-creation events (Sysmon Event ID 1), which hosts have a rate of processes
    launched without ASLR that exceeds the 95th percentile of their peer group, indicating misconfiguration
    or targeted disabling of mitigations?
  context: 'Supporting the Harden (D3-H) tactic, this statistical view turns ASLR coverage into a comparative
    metric. For all process-creation events (Sysmon Event ID 1), compute the percentage and count of processes
    launched without ASLR per host, then rank hosts within their peer group (role, OS, image family).
    Alert on any host whose non-ASLR rate exceeds the 95th percentile of its peers. A high outlier indicates
    either broad misconfiguration or deliberate, targeted disabling of mitigations on that host; a host
    near the peer median is behaving as expected. Derive the threshold from each peer group''s own distribution
    rather than a global constant. Source: [SoK: Automated Software Diversity](https://www.ieee-security.org/TC/SP2014/papers/SoK_c_AutomatedSoftwareDiversity.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation (Sysmon EID 1)

      | eval non_aslr = NOT aslr_enabled

      | stats sum(non_aslr) as non_aslr_count, count as total by host, peer_group

      | eval non_aslr_rate = non_aslr_count / total

      | eventstats perc95(non_aslr_rate) as p95 by peer_group

      | where non_aslr_rate > p95

      | sort non_aslr_rate desc'
- question: Which assets have measured or declared ASLR entropy below the 64-bit high-entropy standard
    — for example brute-forceable ~16-bit 32-bit/mmap randomization — or insufficient module coverage,
    given that increasing re-randomization frequency adds at most ~1 bit and cannot compensate?
  context: 'Under the Harden (D3-H) tactic, the quality of randomization matters as much as its presence:
    low entropy is brute-forceable. Track the effective entropy (bits) of segment randomization per platform
    — 32-bit/mmap ASLR (~16 bits) can be defeated by brute force, while 64-bit high-entropy ASLR raises
    entropy by one to two-plus orders of magnitude. Alert on assets where measured or declared entropy
    or module coverage falls below the 64-bit high-entropy standard. Note that increasing re-randomization
    frequency adds at most ~1 bit and cannot make up for a weak entropy budget. A positive finding is
    a critical asset stuck at low entropy or partial coverage; a negative result confirms it meets the
    high-entropy bar. Source: [On the Effectiveness of Address-Space Randomization](https://hovav.net/ucsd/dist/asrandom.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from asset_inventory join aslr_entropy_measurements

      | eval entropy_bits = measured_entropy ?? declared_entropy

      | eval below_standard = (entropy_bits < high_entropy_64bit_min) OR (module_coverage < coverage_target)

      | where below_standard

      | table host, arch, entropy_bits, module_coverage, rerandomization_freq'
- question: Does a time-series model of non-ASLR-enabled process creations per hour for each critical
    NAI forecast normal counts, and are there statistically significant spikes that indicate widespread
    policy failure or deliberate disabling of the security feature — with the top-3 contributing host,
    image, and mitigation surfaced in the alert?
  context: 'This machine-learning method supports the Harden (D3-H) tactic by anticipating ASLR coverage
    regression before it becomes an incident. Build a time-series model of the count of non-ASLR-enabled
    process creations per hour for each critical NAI, forecast expected counts, and flag statistically
    significant deviations above the predicted band. A sudden, sustained spike indicates widespread policy
    failure (a botched GPO/patch) or deliberate disabling of mitigations during an intrusion. Every alert
    should surface the top-3 contributing factors — host, image, and mitigation — so the analyst can act
    immediately. A positive result is a forecasted-vs-actual breach in non-ASLR launches; normal seasonality
    stays within band. Source: [SoK: Automated Software Diversity](https://www.ieee-security.org/TC/SP2014/papers/SoK_c_AutomatedSoftwareDiversity.pdf).'
  answer_sources: *id001
  range: Last 90 days (train on a longer clean baseline; score hourly)
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_counts(non_aslr_process_creations) by critical_nai\nmodel = train_timeseries_forecast(series)\n\
      for nai, t in recent_hours:\n    expected = model.predict(nai, t)\n    if actual(nai,t) > expected\
      \ + k*sigma:\n        emit_alert(nai, t, top3=model.top_contributors(['host','image','mitigation'],\
      \ k=3))"
- question: At critical system-call gates, does the Intel Last Branch Record (LBR) show (a) returns not
    preceded by a matching call instruction ('illegal returns') or (b) a chain of N consecutive short
    gadgets — each a run of roughly 20 or fewer instructions ending in an indirect branch — indicating
    return/jump-oriented code-reuse that survived an ASLR coverage gap or info-leak?
  context: 'Under the Harden (D3-H) tactic, when an attacker defeats ASLR they typically chain existing
    code via ROP/JOP rather than inject new code. At critical system-call gates, inspect the Intel Last
    Branch Record (LBR) and alert on illegal returns (a return not preceded by a matching call) and on
    a chain of N consecutive short gadgets, each a run of <= ~20 instructions ending in an indirect branch
    — the deterministic kBouncer thresholds. These signatures catch code-reuse that survives an ASLR coverage
    gap or info-leak. Tune N and the gadget length per workload to control false positives. A positive
    finding is a gadget-chain/illegal-return pattern at a syscall gate on an exposed process; benign code
    rarely exhibits long runs of short indirect-branch-terminated sequences. Source: [kBouncer: Transparent
    ROP Exploit Mitigation Using Indirect Branch Tracing](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_pappas.pdf).'
  answer_sources: &id002
  - Intel Last Branch Record / Processor Trace (via EDR)
  - Windows Error Reporting
  - Microsoft-Windows-Security-Mitigations/Kernel Mode and User Mode
  - Windows Defender Exploit Guard Event Logs
  - Sysmon Event ID 1
  - Linux kernel segfault logs (dmesg/journald)
  - Application crash logs
  - 'NAI: External-facing web/application servers, browsers and document readers on user endpoints, and
    other processes exposed to untrusted input.'
  range: Last 90 days (event-centered around syscall-gate traces)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from lbr_traces (via EDR) at syscall_gates where process in exposed_set

      | eval illegal_return = (branch_type=="ret" AND NOT preceded_by_matching_call)

      | eval short_gadget = (instr_count <= 20 AND ends_in_indirect_branch)

      | eval gadget_chain = consecutive(short_gadget) >= N

      | where illegal_return OR gadget_chain

      | table host, process, syscall, branch_sequence, gadget_count'
- question: Has any Exploit Guard / Microsoft-Windows-Security-Mitigations event reported a triggered
    or violated mitigation (DEP, CFG, SEHOP, ACG) on an Internet-exposed process — high-fidelity evidence
    of an in-progress exploit attempting to bypass ASLR/DEP — and can it be correlated to the offending
    module and call site?
  context: 'Supporting the Harden (D3-H) tactic, a triggered mitigation is one of the highest-fidelity
    exploit signals available. Treat any Exploit Guard / Microsoft-Windows-Security-Mitigations event
    reporting a triggered or violated mitigation (DEP, CFG, SEHOP, ACG) on an Internet-exposed process
    as evidence of an in-progress exploit attempting to bypass ASLR/DEP. Correlate the event with the
    offending module and call site to localize the vulnerability and confirm the target. A positive finding
    is a mitigation violation on an exposed process — the boundary held but was actively attacked; a negative
    result is the steady-state absence of such violations. These should be escalated immediately given
    their low false-positive rate. Source: [Exploit Protection Reference](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from (exploit_guard_events OR security_mitigations_events)

      | where event_type == "mitigation_triggered" AND mitigation in ("DEP","CFG","SEHOP","ACG")

      | where process in internet_exposed_set

      | eval offending = lookup_module_and_callsite(process, fault_address)

      | table host, process, mitigation, offending.module, offending.callsite'
- question: For Internet-exposed processes, do crash/segfault rates (Windows Error Reporting; Linux dmesg/journald
    segfault entries) exceed a calibrated rate — for example mean + 3 sigma or a sustained crash-restart
    loop — the hallmark of low-entropy ASLR brute force where each wrong guess crashes the target (~2^16
    attempts on 32-bit)?
  context: 'Within the Harden (D3-H) tactic, brute-forcing low-entropy ASLR produces a distinctive failure
    signature: each wrong address guess crashes the target, so an attack on 32-bit ASLR can generate on
    the order of 2^16 crashes. Baseline per-process crash/segfault frequency from Windows Error Reporting
    and Linux dmesg/journald segfault entries, then alert when an exposed process exceeds a calibrated
    rate (e.g., > mean + 3 sigma) or enters a sustained crash-restart loop. This failure-rate signal is
    distinct from a single benign crash. A positive finding is a burst or loop of crashes against an exposed
    service; isolated crashes stay within the baseline. Source: [On the Effectiveness of Address-Space
    Randomization](https://hovav.net/ucsd/dist/asrandom.pdf).'
  answer_sources: *id002
  range: 'Last 90 days (event-centered: detect bursts within minutes/hours)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (windows_error_reporting OR linux_segfault_logs)

      | bin _time span=5m

      | stats count as crashes by process, host, _time

      | eventstats avg(crashes) as mu, stdev(crashes) as sd by process, host

      | eval z = (crashes - mu) / sd

      | where (z > 3 OR sustained_crash_restart_loop) AND process in exposed_set

      | sort z desc'
- question: For browser and document-reader processes, does a per-object NOP-sled/landing-instruction
    surface-area metric or a global normalized-attack-surface-area (NSA) score over the heap cross a calibrated
    threshold, or does heap allocation volume/object-count spike far above baseline — the byte-volume
    signature of a heap spray defeating ASLR by occupying many addresses?
  context: 'Supporting the Harden (D3-H) tactic, heap spraying defeats ASLR not by predicting an address
    but by occupying so many addresses that a guess lands in attacker-controlled memory. For browser/reader
    processes, compute a per-object NOP-sled/landing-instruction surface-area metric and a global normalized-attack-surface-area
    (NSA) score over the heap, following NOZZLE. Alert when the NSA crosses a calibrated threshold or
    when heap allocation volume/object-count spikes far above baseline. Byte-volume and surface-area ratios
    are the key signals. A positive finding is an exposed renderer/reader whose heap is saturated with
    sled-like objects; normal browsing stays below the surface-area and volume thresholds. Source: [NOZZLE:
    A Defense Against Heap-spraying Code Injection Attacks](https://www.usenix.org/legacy/event/sec09/tech/full_papers/ratanaworabhan.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from heap_telemetry where process in (browsers, document_readers)

      | eval object_surface = nop_sled_or_landing_ratio(object)

      | stats max(object_surface) as nsa, sum(alloc_bytes) as heap_bytes, count as obj_count by process,
      host

      | eventstats avg(heap_bytes) as base_bytes, avg(obj_count) as base_objs by process_family

      | where nsa > nsa_threshold OR heap_bytes > base_bytes*spike OR obj_count > base_objs*spike

      | sort nsa desc'
- question: On exposed processes, are there anomalous high-frequency timing/cache-probe loops or unexpected
    large in-process memory reads/scripted scans that could derandomize ASLR stealthily (branch-predictor/timing
    side channels with no crashes) or feed JIT-ROP via memory-disclosure leaks?
  context: 'Under the Harden (D3-H) tactic, the stealthiest ASLR bypasses leave no crashes: timing and
    branch-predictor side channels (e.g., Jump Over ASLR) and memory-disclosure leaks that feed JIT-ROP
    (Just-In-Time Code Reuse) recover address layout silently. Baseline anomalous high-frequency timing/cache-probe
    loops and unexpected large in-process memory reads or scripted memory scans on exposed processes,
    and alert on deviations as bypass precursors. A positive finding is an exposed process exhibiting
    tight probe loops or scanning its own address space far beyond its norm — behavior consistent with
    leak/side-channel derandomization; normal workloads do not repeatedly probe cache timing or bulk-read
    process memory. Sources: [Jump Over ASLR: Attacking Branch Predictors to Bypass ASLR](https://www.cs.binghamton.edu/~dima/micro16.pdf);
    [Just-In-Time Code Reuse](https://www.cs.unc.edu/~fabian/papers/oakland2013.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_behavior where process in exposed_set

      | eval probe_loops = high_freq_timing_or_cache_probe_rate

      | eval mem_reads = large_in_process_read_bytes + scripted_scan_count

      | eventstats avg(probe_loops) as mu_p, stdev(probe_loops) as sd_p, avg(mem_reads) as mu_m, stdev(mem_reads)
      as sd_m by process

      | where (probe_loops > mu_p+3*sd_p) OR (mem_reads > mu_m+3*sd_m)

      | table host, process, probe_loops, mem_reads'
- question: Can a model trained on first-party control-flow telemetry (Intel Processor Trace / LBR) distinguish
    benign from exploited execution of exposed applications — for example by rendering PT traces into
    images for a transfer-learned CNN — and report per-segment localization plus the top-3 contributing
    features (gadget-chain length, indirect-branch density, mispredict rate)?
  context: 'This machine-learning method complements the deterministic kBouncer rules under the Harden
    (D3-H) tactic by learning the difference between benign and exploited execution. Train a model on
    first-party control-flow telemetry (Intel Processor Trace / LBR) to classify exposed-application execution,
    for example by rendering PT traces into images for a transfer-learned CNN (HeNet). Report per-segment
    localization and the top-3 contributing features — gadget-chain length, indirect-branch density, mispredict
    rate — so the analyst understands why a trace was flagged. Run this in parallel with the deterministic
    gadget-chain thresholds so learned and rule-based signals reinforce one another. A positive result
    is a trace classified as exploited with localized segments; benign execution scores below threshold.
    Source: [HeNet: A Deep Learning Approach on Intel Processor Trace for Effective Exploit Detection](https://arxiv.org/pdf/1801.02318).'
  answer_sources: *id002
  range: Last 90 days (train on labeled benign/exploited traces; score recent execution)
  queries:
  - technology: SIEM/ML pseudocode
    query: "traces = collect_pt_lbr(exposed_apps)\nmodel = train_cnn(render_to_images(labeled_traces))\n\
      for tr in recent_traces:\n    p = model.predict(render_to_image(tr))\n    if p == \"exploited\"\
      :\n        emit_alert(host, app, segments=model.localize(tr), top3=model.feature_attribution(tr,\
      \ k=3))"
- question: Does a sequence/anomaly model over indirect-branch (LBR) streams flag abnormal runs of short
    indirect-branch-terminated sequences — generalizing hard-coded gadget-chain rules to learned code-reuse
    signatures — while surfacing the contributing branch addresses, with the deterministic call-return
    and gadget-count rules retained as a floor?
  context: 'Under the Harden (D3-H) tactic, this method generalizes the fixed kBouncer gadget rules to
    learned signatures so novel code-reuse chains are still caught. Build a sequence/anomaly model over
    indirect-branch (LBR) streams that flags abnormal runs of short indirect-branch-terminated sequences,
    surfacing the contributing branch addresses for triage. Retain the deterministic call-return matching
    and gadget-count rules as a floor so the learned model only adds coverage and never removes the guaranteed
    detections. A positive result is an LBR stream whose short-sequence structure deviates from learned
    normal control flow — a candidate ROP/JOP chain; benign control flow matches the learned envelope.
    Source: [kBouncer: Transparent ROP Exploit Mitigation Using Indirect Branch Tracing](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_pappas.pdf).'
  answer_sources: *id002
  range: Last 90 days (train on clean LBR baselines; score recent streams)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_sequence_anomaly(lbr_indirect_branch_streams[exposed_apps])\nfor stream in recent_lbr_streams:\n\
      \    score = model.anomaly_score(stream)\n    deterministic = illegal_return(stream) OR short_gadget_run(stream)\
      \ >= N\n    if score > threshold OR deterministic:\n        emit_alert(host, app, branch_addrs=model.contributing_branches(stream))"
