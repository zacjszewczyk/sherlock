name: 'D3-TL: Trusted Library'
id: 7b1af7aa-d4e5-4ad3-aded-9f58cb28266f
description: 'This playbook helps an analyst investigate whether the software libraries and dependencies
  loaded and executed across endpoints and servers are trusted, vetted, and free of known vulnerabilities,
  or whether an adversary has subverted them. It covers two related evidence domains. First, untrusted
  or hijacked library-load activity: trusted, signed processes loading unsigned, rare, or anomalously
  located modules; classic DLL search-order hijacking and side-loading; dynamic-linker hijacking via LD_PRELOAD/LD_LIBRARY_PATH
  and DYLD_* on Linux/macOS; and trusted runtime libraries (PowerShell automation, the .NET CLR) being
  reflectively loaded into host processes that should never carry them. Second, vulnerable or unauthorized
  applications and dependencies: execution of software matching a CVE-derived deny-list or carrying known-vulnerable
  libraries, unauthorized library search paths in process arguments, renamed or relocated trusted (LOLBAS-class)
  utilities, and the introduction of unapproved or outright malicious packages into the trusted inventory.
  Across both domains the playbook layers a deterministic symbolic-logic floor (path/signature/allow-list
  and deny-list rules) beneath fleet-wide prevalence and frequency statistics and machine-learning scoring
  (static PE features, provenance-graph anomaly detection, malicious-package classification, code-clone
  matching, and process-creation forecasting). Use it to confirm that only trusted libraries run, and
  to surface the specific process, module, path, and signer when they do not.'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
