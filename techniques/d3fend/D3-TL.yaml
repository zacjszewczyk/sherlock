questions:
- question: Are any trusted, validly signed processes loading DLLs or modules that are unsigned, carry
    an invalid/absent signature, or resolve from user-writable locations (AppData, Temp, Downloads, %PUBLIC%,
    or world-writable directories) that fall outside that process's expected per-process module allow-list?
  context: 'This is the deterministic floor of the Trusted Library defense for the Harden mission: only
    pre-vetted, signed library code should execute inside trusted processes. On Sysmon Event ID 7 and
    Windows Code Integrity Operational Event ID 3037, evaluate each module load against a maintained per-process
    allow-list of expected modules keyed by path+hash, and alert when the loaded image is unsigned, has
    an invalid signature, or loads from a user-writable path. A positive hit means a trusted process executed
    code that was never vetted - a hallmark of DLL hijacking, side-loading, or injected payloads. This
    rule must be tuned (extend the allow-list) rather than removed. The alert must include the image name,
    signer status, load path, and parent process so an analyst can immediately triage provenance. Sources:
    [4 Ways Adversaries Hijack DLLs, CrowdStrike](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/);
    [SigmaHQ Code Integrity / Unsigned Image Detection Rules](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from sysmon WHERE EventID==7 OR (source=='CodeIntegrity' AND EventID==3037)\nprocess_signed\
      \ = signer_status(Image) in ('Valid','Trusted')\nmodule_bad = (Signed==false OR SignatureStatus!='Valid')\n\
      userwritable = ImageLoaded matches /(AppData|\\\\Temp|\\\\Downloads|\\\\PUBLIC|/tmp|world_writable)/i\n\
      expected = allowlist[Image]  # path+hash of known-good modules\nif process_signed and (module_bad\
      \ or userwritable) and hash(ImageLoaded) not in expected:\n    alert(image=Image, loaded=ImageLoaded,\
      \ signer=SignatureStatus, path=ImageLoaded, parent=ParentImage)"
- question: Is a known system DLL name being resolved from a non-system directory (the application folder
    or current working directory rather than System32/SysWOW64), or is a signed EXE loading an unsigned
    same-named DLL co-located beside it, indicating DLL search-order hijacking or side-loading?
  context: 'Search-order hijacking and side-loading abuse Windows'' module resolution so that a malicious
    DLL placed in a writable application directory is loaded in place of the legitimate system library.
    For the Harden mission this defeats the trust placed in signed applications. On Sysmon Event ID 7,
    flag loads where a system DLL name resolves outside System32/SysWOW64, or where a signed EXE loads
    an unsigned DLL of the same base name from its own directory. Maintain a watchlist of LOLBAS trusted-but-abusable
    binaries and libraries and alert on hash, OriginalFileName, or path mismatch. A positive result strongly
    suggests an adversary planted a proxy DLL next to a trusted host binary. Sources: [Hijack Execution
    Flow: DLL (T1574.001), MITRE ATT&CK](https://attack.mitre.org/techniques/T1574/001/); [LOLBAS Project](https://lolbas-project.github.io/).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from sysmon WHERE EventID==7\nis_system_dll = ImageLoaded.basename in known_system_dlls\n\
      from_nonsystem = not ImageLoaded.startswith(('C\\\\:\\\\Windows\\\\System32','C\\\\:\\\\Windows\\\
      \\SysWOW64'))\nsideload = Signed(Image)==true and Signed(ImageLoaded)==false and same_dir(Image,ImageLoaded)\
      \ and same_basename(Image,ImageLoaded)\nlolbas_mismatch = Image.basename in LOLBAS and (OriginalFileName!=expected\
      \ or hash mismatch or path mismatch)\nif (is_system_dll and from_nonsystem) or sideload or lolbas_mismatch:\n\
      \    alert(image=Image, loaded=ImageLoaded, path=ImageLoaded, parent=ParentImage)"
- question: On Linux and macOS, are any processes being launched with dynamic-linker injection environment
    variables (LD_PRELOAD, LD_LIBRARY_PATH, DYLD_INSERT_LIBRARIES, DYLD_LIBRARY_PATH), or is /etc/ld.so.preload
    being modified or unapproved .so paths added to ld.so.conf?
  context: 'Dynamic-linker hijacking lets an attacker force arbitrary shared objects into the address
    space of otherwise trusted programs, subverting the Trusted Library guarantee at process startup.
    Monitor auditd execve records and macOS Unified Log/ESF for processes whose environment sets LD_PRELOAD,
    LD_LIBRARY_PATH, or any DYLD_* variable, and watch for any write to /etc/ld.so.preload or addition
    of unapproved paths to ld.so.conf. Treat preload of objects from user-writable paths as high severity.
    A positive result means a trusted binary is being made to load attacker-controlled code without modifying
    the binary itself - a common persistence and defense-evasion technique. Sources: [Hijack Execution
    Flow: Dynamic Linker Hijacking (T1574.006), MITRE ATT&CK](https://attack.mitre.org/techniques/T1574/006/).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: 'from auditd WHERE syscall==''execve''

      env = parse_env(record)

      inject = any(v in env for v in [''LD_PRELOAD'',''LD_LIBRARY_PATH'',''DYLD_INSERT_LIBRARIES'',''DYLD_LIBRARY_PATH''])

      userwritable = preload_path(env) matches /^(\/tmp|\/home|\/var\/tmp|world_writable)/

      if inject: alert(severity=''high'' if userwritable else ''med'', proc=exe, env=env)

      # also: from auditd file-watch on /etc/ld.so.preload, /etc/ld.so.conf*

      if write_to(''/etc/ld.so.preload'') or unapproved_so_added(''ld.so.conf''): alert()'
- question: Are trusted runtime libraries - System.Management.Automation (PowerShell) or the .NET CLR
    (clr.dll, mscoree.dll, clrjit.dll) - being loaded into processes other than their sanctioned hosts,
    such as Office applications, rundll32, or script hosts?
  context: 'Adversaries reflectively load trusted runtimes into unexpected host processes to execute managed/unmanaged
    payloads while hiding behind a legitimate library (e.g., PowerShell-without-powershell.exe, or unmanaged
    CLR hosting). For the Harden mission this is an abuse of an otherwise trusted library. On Sysmon Event
    ID 7, alert when System.Management.Automation loads into anything but powershell.exe/pwsh.exe, or
    when CLR modules load into a process not on the managed-app allow-list - particularly Office apps,
    rundll32, or script hosts. A positive result indicates reflective hosting of a trusted library and
    warrants immediate investigation of the host process lineage. Sources: [PowerShell Core DLL Loaded
    By Non PowerShell Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/image_load/image_load_dll_system_management_automation_susp_load/);
    [Suspicious .NET/CLR DLL Loaded By Unusual Process, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_dll_dotnet_loaded_by_susp_process.yml).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from sysmon WHERE EventID==7\nsma = ImageLoaded.basename =~ /System.Management.Automation(.ni)?.dll/\n\
      clr = ImageLoaded.basename in ('clr.dll','mscoree.dll','clrjit.dll')\nif sma and Image.basename\
      \ not in ('powershell.exe','pwsh.exe'):\n    alert('SMA loaded by non-PowerShell', host=Image, parent=ParentImage)\n\
      if clr and Image.basename not in managed_app_allowlist and Image.basename in ('winword.exe','excel.exe','rundll32.exe','wscript.exe','cscript.exe','mshta.exe'):\n\
      \    alert('CLR hosted by unusual process', host=Image, parent=ParentImage)"
- question: Across the entire fleet, which loaded modules (by path+hash) are extremely rare - in the bottom
    1st-5th percentile of prevalence or never-before-seen - or show a per-host load rate that suddenly
    exceeds its 30-day mean by more than three standard deviations?
  context: 'Legitimate trusted libraries are widely deployed and common across a fleet; attacker-introduced
    modules are rare and clustered on a few hosts. For the Harden mission, inventory every loaded module
    by path+hash across all endpoints and compute per-module prevalence. Derive percentile cutoffs per
    environment from a rolling 30-day baseline and flag modules in the bottom 1st-5th percentile or never
    seen before, plus any module whose load rate on a host spikes >3 sigma over its mean. Corroborate
    with process-lineage prevalence to suppress benign rare-but-known software. A positive result surfaces
    uncommon code that merits the deterministic and ML checks - rare-and-new is the strongest lead. Sources:
    [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [Process Injection (T1055), Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "module_loads = from sysmon WHERE EventID==7 | fields host, ImageLoaded, Hashes\nprevalence[mod]\
      \ = distinct_count(host) where mod=(path,hash) over baseline_30d\np05 = percentile(prevalence.values,\
      \ 5)\nfor mod in module_loads.unique:\n    if prevalence[mod] <= p05 or prevalence[mod]==0: flag_rare(mod)\n\
      rate[host,mod] = count_per_interval; if rate > mean+3*std: flag_spike(host,mod)\nrank by (rare AND\
      \ new) first"
- question: On which hosts are Code Integrity signature-validation failures (Event ID 3037), failed or
    phantom DLL load attempts, and blocked loads spiking - for example more than five distinct unsigned
    modules per host per hour against a near-zero baseline - even when some loads ultimately succeed?
  context: 'State signals - the rate of integrity failures and failed loads - are first-class indicators
    of hijack attempts and untrusted-library probing, because adversaries often trigger many invalid-signature
    or missing-dependency events while searching for a working load path. For the Harden mission, count
    Code Integrity validation failures (EID 3037), loader errors/missing-dependency events, and blocked
    loads per host per hour, and alert when the count jumps above a baseline-derived threshold (e.g.,
    >5 distinct unsigned modules/host/hour vs near-zero normal). A spike signals active hijack/probing
    activity worth investigating, independent of whether any single load succeeded. Sources: [SigmaHQ
    Code Integrity / Unsigned Image Detection Rules](https://github.com/SigmaHQ/sigma); [4 Ways Adversaries
    Hijack DLLs, CrowdStrike](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from (CodeIntegrity EID 3037) OR (loader_errors) OR (blocked_loads)\nby host, bin=1h:\n  unsigned_distinct\
      \ = distinct_count(ImageLoaded where Signed==false)\n  fail_count = count(signature_validation_failed\
      \ OR load_failed)\nbaseline = mean over 30d (typically ~0)\nif unsigned_distinct > 5 or fail_count\
      \ > baseline+3*std:\n    alert(host, unsigned_distinct, fail_count, sample_modules)"
- question: For modules that are not on the trusted allow-list, does a static-PE feature classifier (import
    table, exported functions, section entropy, header anomalies) score them as likely malicious above
    a tuned probability threshold?
  context: 'Allow-listing alone cannot judge brand-new or unknown libraries; a static-feature ML classifier
    can rank their risk so analysts focus on the most suspicious. For the Harden mission, extract static
    PE features from any non-allow-listed module and score them with a gradient-boosted classifier trained
    on a labeled corpus such as EMBER. Alert above a tuned probability threshold and surface the top-3
    contributing features (e.g., suspicious imports, high section entropy, unsigned) so triage is explainable.
    This runs in parallel with - never replacing - the deterministic allow-list floor; a high score means
    the unknown module resembles known-malicious code and should be quarantined and analyzed. Sources:
    [EMBER: An Open Dataset for Training Static PE Malware ML Models, Anderson & Roth](https://arxiv.org/pdf/1804.04637).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "candidates = modules from sysmon EID 7 where hash not in trusted_allowlist\nfor m in candidates:\n\
      \    feats = extract_pe_features(m)  # imports, exports, section_entropy, header_anomalies\n   \
      \ p = gbdt_model.predict_proba(feats)\n    if p > threshold:\n        alert(module=m, score=p, top_features=top3(shap(feats)))"
- question: When whole-system provenance graphs (process -> module -> file) are built from Sysmon/auditd
    telemetry, does a graph-neural-network anomaly detector flag any trusted process node that loads an
    anomalous module or any library-file node with unusual fan-in or parentage?
  context: 'Individual rules and prevalence stats can miss subtle, structurally anomalous load chains.
    For the Harden mission, build provenance graphs from Sysmon and auditd (nodes = processes, modules,
    files; edges = load/spawn/write relationships) and apply node-level GNN anomaly detection (e.g., ThreaTrace)
    to identify a trusted process that loads an anomalous module or a library file with unusual fan-in/parentage.
    The model returns the specific anomalous node for explainable triage - report the implicated process,
    module, and neighbor edges, not just a score. A positive result reveals load relationships that look
    normal in isolation but are anomalous in graph context. Sources: [ThreaTrace: Detecting Host-based
    Threats via Provenance Graph Learning, Wang et al.](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Sysmon Event ID 7 (Image/DLL Load)
  - Windows Code Integrity Operational Event ID 3037 (unsigned image loaded)
  - Sysmon Event ID 1 / Windows Event ID 4688 (process creation, command line, environment)
  - Linux auditd (execve, environment, /etc/ld.so.preload writes)
  - macOS Unified Log / ESF (dyld environment, library load)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_provenance_graph(sysmon, auditd)  # process->module->file\nscores = gnn_node_anomaly(G)\n\
      for node, s in scores:\n    if s > threshold and node.type in ('process','module'):\n        alert(node=node,\
      \ neighbors=G.edges(node), score=s)  # explainable"
- question: Are any process-creation events executing application images (by name+hash) that match a curated
    deny-list of unauthorized applications or applications known to bundle vulnerable libraries derived
    from SCA/SBOM CVE-CPE mappings?
  context: 'The Trusted Library defense requires that vulnerable or unauthorized software never run. For
    the Harden mission, continuously refresh a deny-list from Software Composition Analysis / SBOM output
    that maps installed library versions to CVEs via CPE, then scan every Windows Event ID 4688 / Sysmon
    Event ID 1 process creation for an image name+hash match. Alert immediately on any match and include
    the matched CVE(s) so responders understand the exposure. A positive result means known-vulnerable
    or explicitly banned software executed and needs remediation; this deterministic deny-list is a floor
    that the statistical and ML methods complement, not replace. Sources: [OWASP Dependency-Check](https://owasp.org/www-project-dependency-check/);
    [LOLBAS Project](https://lolbas-project.github.io/).'
  answer_sources:
  - Windows Event ID 4688 / Sysmon Event ID 1 (process creation, command line)
  - Software Composition Analysis / SBOM reports (CVE-CPE matches)
  - Package manager and install logs (npm, pip, apt/dpkg, MSI)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "denylist = build_from_SCA_SBOM(cpe_to_cve)  # {image_name/hash -> [CVE...]}\nfrom (WinEventID\
      \ 4688 OR sysmon EID 1)\nif (NewProcessName.basename in denylist) or (hash(Image) in denylist):\n\
      \    alert(image=NewProcessName, host=host, user=user, cves=denylist[match])"
- question: Are processes being created with command-line arguments or environment that set non-standard
    library search paths (LD_LIBRARY_PATH, LD_PRELOAD, DYLD_*) or that load DLLs from world-writable directories?
  context: 'Non-standard library search paths in process arguments are a deterministic indicator of attempted
    library hijacking against the Trusted Library defense. For the Harden mission, inspect command line
    and environment in Windows Event ID 4688 / Sysmon Event ID 1 for LD_LIBRARY_PATH, LD_PRELOAD, or DYLD_*
    settings and for DLL references that resolve to world-writable directories. Keep these concrete path/variable
    rules as a deterministic floor. A positive result means a process was steered to load code from an
    attacker-controllable location rather than the vetted system path, which should be triaged alongside
    the linker-hijacking checks. Sources: [Hijack Execution Flow: Dynamic Linker Hijacking (T1574.006),
    MITRE ATT&CK](https://attack.mitre.org/techniques/T1574/006/).'
  answer_sources:
  - Windows Event ID 4688 / Sysmon Event ID 1 (process creation, command line)
  - Software Composition Analysis / SBOM reports (CVE-CPE matches)
  - Package manager and install logs (npm, pip, apt/dpkg, MSI)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from (WinEventID 4688 OR sysmon EID 1)\ncl = CommandLine + ' ' + Environment\nif cl matches\
      \ /(LD_LIBRARY_PATH|LD_PRELOAD|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH)=/i\n   or references_dll_in(world_writable_dirs):\n\
      \    alert(image=NewProcessName, cmdline=CommandLine, host=host)"
- question: Are any binaries executing whose PE OriginalFileName or hash corresponds to a sanctioned LOLBAS-class
    library/utility (rundll32, regsvr32, comsvcs.dll, certutil) but whose on-disk path or filename differs
    from the approved location?
  context: 'Name-based trust is defeated when an adversary renames or relocates a trusted utility to evade
    path-based rules while keeping its trusted identity. For the Harden mission, compare each execution/load''s
    PE OriginalFileName and hash against the catalog of sanctioned LOLBAS-class libraries and utilities,
    and flag any case where the on-disk filename or path differs from the approved location. A positive
    result - e.g., rundll32''s binary running as svchost-update.exe from a temp folder - indicates an
    attempt to smuggle a trusted-but-abusable binary past name-based allow-lists and should be investigated
    immediately. Sources: [LOLBAS Project](https://lolbas-project.github.io/).'
  answer_sources:
  - Windows Event ID 4688 / Sysmon Event ID 1 (process creation, command line)
  - Software Composition Analysis / SBOM reports (CVE-CPE matches)
  - Package manager and install logs (npm, pip, apt/dpkg, MSI)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from (sysmon EID 1 OR EID 7)\nofn = OriginalFileName(Image)\nif ofn in LOLBAS_catalog:\n \
      \   approved = LOLBAS_catalog[ofn].approved_paths\n    if Image.path not in approved or Image.basename\
      \ != ofn:\n        alert(original=ofn, actual_path=Image.path, actual_name=Image.basename, hash=hash(Image))"
- question: For each newly installed or updated dependency, how many malicious-package behavioral indicators
    does it exhibit - install-time scripts, outbound network callbacks during install, filesystem/credential
    access, and metadata anomalies (author registered <30 days, very low download count, large version
    jump)?
  context: 'Malicious packages introduced into the trusted inventory tend to share measurable behaviors
    at install time. For the Harden mission, profile each newly installed/updated dependency from package-manager
    and install logs across Volume/Frequency/State dimensions: presence of install hooks, outbound callbacks
    during install, filesystem and credential access, and suspicious package metadata. Derive thresholds
    from labeled malicious-package corpora and flag installs whose indicator count exceeds the tuned cutoff.
    A positive result means a dependency behaved like known supply-chain malware as it entered the environment
    and should be blocked/quarantined before it becomes part of the trusted library set. Sources: [Backstabber''s
    Knife Collection, Ohm et al.](https://arxiv.org/pdf/2005.09535); [Towards Measuring Supply Chain Attacks
    on Package Managers, Duan et al.](https://arxiv.org/abs/2002.01139).'
  answer_sources:
  - Windows Event ID 4688 / Sysmon Event ID 1 (process creation, command line)
  - Software Composition Analysis / SBOM reports (CVE-CPE matches)
  - Package manager and install logs (npm, pip, apt/dpkg, MSI)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from package_install_logs (npm/pip/apt/dpkg/MSI)\nfor pkg in new_or_updated:\n    ind = 0\n\
      \    ind += has_install_scripts(pkg)\n    ind += outbound_callback_during_install(pkg)\n    ind\
      \ += accessed(filesystem_sensitive or credentials)\n    ind += metadata_anomaly(author_age<30d or\
      \ downloads<low or version_jump_large)\n    if ind >= threshold: alert(pkg, indicators=ind, detail=...)"
- question: Per host role, has the software diversity index (count of unique binaries/loaded modules)
    increased suddenly and significantly - more than three standard deviations above the role's 30-day
    mean - suggesting introduction of unapproved tools or libraries?
  context: 'Hosts performing the same role should run a similar, stable set of software; a sudden jump
    in unique binaries/modules can indicate that unapproved tools or libraries were introduced. For the
    Harden mission, compute a software diversity index per host role from a 30-day baseline and alert
    when a host''s diversity rises >3 sigma above its role mean. Corroborate with fleet prevalence so
    that rare-and-new software wins over rare-but-known. A positive result flags a host that abruptly
    diverged from its peers - a useful lead toward newly planted libraries or attacker tooling that should
    be reconciled against change records. Sources: [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Windows Event ID 4688 / Sysmon Event ID 1 (process creation, command line)
  - Software Composition Analysis / SBOM reports (CVE-CPE matches)
  - Package manager and install logs (npm, pip, apt/dpkg, MSI)
  - 'NAI: Application Servers and Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "diversity[host] = distinct_count(binaries + loaded_modules) per day\nby role: mean_r, std_r\
      \ = baseline_30d(diversity for hosts in role)\nfor host in role:\n    if diversity[host] > mean_r\
      \ + 3*std_r:\n        new_items = diversity[host] - baseline_set[host]\n        alert(host, role,\
      \ delta=..., new_items, corroborate=fleet_prevalence(new_items))"
- question: Does the per-host volume of process-creation events deviate beyond the prediction interval
    of a time-series forecasting model, signaling mass execution of new software?
  context: A burst of process creation beyond normal seasonal patterns can indicate mass deployment or
