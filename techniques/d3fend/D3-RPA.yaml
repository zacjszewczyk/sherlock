name: 'D3-RPA: Relay Pattern Analysis'
id: 32229cbe-51a7-40fb-b929-1c12de8310cd
description: Hunt for internal hosts acting as relays (stepping-stones / pivots) that bridge the internal
  network to external networks. This playbook helps an analyst investigate network-flow evidence showing
  hosts that ingest external traffic and rapidly fan out to internal systems, and whose ingress and egress
  flows are correlated in timing and volume in ways inconsistent with the host's historical role. It layers
  deterministic relay-chain and protocol-bridging detection rules, statistical timing/volume correlation,
  packet-count divergence bounding, and connection-failure profiling, and machine-learning flow-correlation,
  graph, and sequence models over first-party logs (Zeek conn.log/dns.log/notice.log, NetFlow/IPFIX, firewall
  connection logs). Use it to determine whether an internal host is relaying traffic for an external actor
  seeking lateral movement, command-and-control tunneling, or data exfiltration.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are there internal hosts where an inbound connection from an external source is immediately
    followed (within seconds) by a fan-out of outbound connections to multiple distinct internal destinations,
    indicating relay-chain staging?
  context: This is the core deterministic relay-chain signal for the Detect tactic. In Zeek conn.log or
    NetFlow, look for an inbound external->internal connection to a host that is followed within ~5 seconds
    by outbound connections from that same host to >=3 distinct internal destinations. Derive the fan-out
    count and the correlation time window from each host's own 30-day baseline rather than a fixed global
    threshold, because a busy server may legitimately fan out. Elevate severity when the external source
    IP matches threat intelligence. A positive result accumulates relay metadata per host (per the Vectra
    patent [Malicious relay detection on networks](https://patents.google.com/patent/US20150264083A1));
    a host that repeatedly exhibits ingress-then-fanout
    chains is a strong stepping-stone candidate. A negative result (no temporally-linked fan-out) argues
    against active relaying.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days; correlate ingress/egress within a 5s event-centered window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each internal host H:\n  ingress = conn WHERE dst=H AND src is_external\n  FOR each ingress\
      \ event e at time t:\n    egress = conn WHERE src=H AND dst is_internal AND ts BETWEEN t AND t+5s\n\
      \    distinct_dst = COUNT(DISTINCT egress.dst)\n    IF distinct_dst >= max(3, baseline_fanout_30d(H))\
      \ THEN\n      sev = HIGH IF e.src IN threat_intel ELSE MEDIUM\n      ALERT relay_chain(H, e.src,\
      \ distinct_dst, sev)"
  - technology: Zeek/pseudocode
    query: '# join conn.log inbound external sessions to outbound internal sessions on orig/resp host

      in = conn WHERE id.resp_h in local AND id.orig_h not in local

      out = conn WHERE id.orig_h in local AND id.resp_h in local

      GROUP out BY id.orig_h, 5s window -> fanout=uniq(id.resp_h)

      EMIT where fanout>=3 AND time_aligned(in.resp_h==out.orig_h)'
- question: Are hosts outside approved proxy or gateway roles brokering unexpected protocol transitions
    (e.g., an external TLS session followed by internal SMB or RDP fan-out) that indicate relay staging?
  context: Supports the Detect tactic by catching protocol-bridging relays even when timing fan-out is
    subtle. Maintain an allow-list of hosts authorized to act as proxies/gateways. Alert when a non-gateway
    host receives an external session in one protocol and then originates internal sessions in a different,
    relay-capable protocol (external TLS/HTTP -> internal SMB/RDP/WinRM). Per the Vectra patent [Malicious relay detection
    on networks](https://patents.google.com/patent/US20150264083A1), any external-to-internal protocol
    bridge from a non-gateway host should be treated as a relay session. A positive result indicates
    a host is acting as an unauthorized application-layer pivot; a negative result means observed protocol
    transitions stay within approved gateway hosts.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "approved = lookup(gateway_proxy_roles)\nFOR each internal host H NOT IN approved:\n  has_ext_in\
      \ = EXISTS conn WHERE dst=H AND src is_external AND proto IN (TLS,HTTP,HTTPS)\n  has_int_out = EXISTS\
      \ conn WHERE src=H AND dst is_internal AND proto IN (SMB,RDP,WinRM,SSH)\n  IF has_ext_in AND has_int_out\
      \ THEN\n    ALERT protocol_bridge_relay(H, ext_proto, int_proto)"
- question: Do any hosts show ON/OFF activity-period coincidence between their inbound and outbound connections,
    where idle-to-active transitions on ingress and egress align within tens of milliseconds?
  context: This applies the content-independent Zhang-Paxson stepping-stone ON/OFF coincidence rule of
    [Detecting Stepping Stones](https://www.usenix.org/legacy/events/sec2000/full_papers/zhangstepping/zhangstepping.pdf),
    which works even on encrypted relays. Split each connection into ON bursts and OFF idle gaps (idle
    gap Tidle ~= 0.5s) and flag a host whose inbound and outbound connections share OFF-to-ON transitions
    within a ~80ms window, above a false-positive-bounded count threshold. Because a relay forwards data,
    when an external client resumes activity the relay's outbound connection also resumes almost simultaneously,
    producing coincident ON transitions. Reduce false positives from periodic legitimate forwarding using
    [RITA](https://github.com/activecm/rita) and [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks)
    cadence filtering. A high count of coincident transitions strongly implies relaying;
    few/none argues the flows are independent.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "Tidle = 0.5s; win = 0.08s\nFOR each host H:\n  in_on  = off_to_on_transitions(inbound_conns(H),\
      \ Tidle)\n  out_on = off_to_on_transitions(outbound_conns(H), Tidle)\n  coincident = COUNT(o in\
      \ out_on WHERE exists i in in_on, |o-i| <= win)\n  IF coincident > fp_bounded_threshold(H) AND NOT\
      \ periodic(RITA,BAYWATCH) THEN\n    ALERT stepping_stone_oncoincidence(H, coincident)"
- question: For suspected relay hosts, is there high correlation (e.g., > 0.9) between inbound packet
    arrival times and outbound packet departure times across different connections, including at coarse
    time scales?
  context: 'Statistical timing correlation for the Detect tactic. For a candidate relay, compute the correlation
    between inbound packet/flow arrival times and outbound packet/flow departure times on its different
    connections; a correlation above ~0.9 suggests active relaying (per [Detecting Stepping
    Stones](https://www.usenix.org/legacy/events/sec2000/full_papers/zhangstepping/zhangstepping.pdf))
    because a relay re-emits what it receives with bounded delay. Compute the correlation at coarse time
    scales as well: [Multiscale Stepping-Stone Detection](https://link.springer.com/chapter/10.1007/3-540-36084-0_2)
    proves that bounded-delay relays remain correlated at coarse scales even when an attacker injects jitter
    and chaff to evade fine-grained timing analysis. A persistently high correlation across
    scales is strong evidence of relaying; low correlation at all scales argues against it.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each candidate host H, each (in_conn, out_conn) pair:\n  for scale in [fine, medium, coarse]:\n\
      \    a = bin_arrival_times(in_conn, scale)\n    b = bin_departure_times(out_conn, scale)\n    r\
      \ = pearson_corr(a, b)\n    IF r > 0.9 THEN ALERT timing_correlated_relay(H, scale, r)"
- question: Does the cumulative packet/byte count difference between a candidate ingress flow and its
    paired egress flow stay within a bounded envelope, consistent with a relay forwarding the same stream?
  context: Implements the Blum-Song-Venkataraman random-walk packet-count bound for interactive stepping
    stones, per [Detection of Interactive Stepping Stones](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_14).
    Track the running difference |packets_in - packets_out| (and bytes) between a candidate ingress flow
    and its egress flow as a random walk; if the difference stays within a bounded envelope delta over
    the monitoring window, the pair is flagged as a relay, with provable false-positive/false-negative
    confidence bounds. Derive delta and the minimum required packet count from the chaff/jitter tolerance
    observed in your environment. A genuine relay forwards nearly every packet, so its in/out counts track
    closely; unrelated flows diverge without bound. Staying within the envelope is a positive relay indicator.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "delta = env_chaff_tolerance(); min_pkts = env_min_count()\nFOR each candidate (in_flow, out_flow)\
      \ on host H:\n  diff = 0; bounded = TRUE\n  FOR each tick: diff += pkts_in(tick) - pkts_out(tick)\n\
      \    IF abs(diff) > delta THEN bounded = FALSE; BREAK\n  IF bounded AND total_pkts >= min_pkts THEN\n\
      \    ALERT packet_count_walk_relay(H, in_flow, out_flow)"
- question: For each host, do sliding-window internal-to-external flow ratios, connection frequency, and
    bytes-in/bytes-out volume symmetry show z-score outliers (>3 sigma) above a 30-day baseline, indicating
    role deviation toward relay behavior?
  context: Statistical role-deviation baselining for the Detect tactic. For each host compute, over sliding
    windows, the internal-to-external flow ratio, per-minute connection frequency, and volume symmetry
    (bytes-in vs bytes-out; relays forward near-equal volume in both directions). Flag z-score outliers
    more than three standard deviations above the host's 30-day baseline. Use the single-flow temporal feature
    set of [Classification of Network Traffic Based on Single Flow Time Series Analysis](https://dl.acm.org/doi/abs/10.5555/3581644.3581681)
    ([dataset](https://zenodo.org/records/8035724)) and the relay-metadata categories in [Malicious relay
    detection on networks](https://patents.google.com/patent/US20150264083A1). A host whose flow profile
    suddenly becomes symmetric and
    high-frequency, bridging internal and external, has deviated from its normal role toward relaying.
    Hosts within their baseline envelope are unlikely relays.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host H, each window w:\n  int_ext_ratio = internal_flows(H,w)/external_flows(H,w)\n\
      \  conn_freq = conns(H,w)/minutes(w)\n  vol_sym = min(bytes_in,bytes_out)/max(bytes_in,bytes_out)\n\
      \  FOR f in [int_ext_ratio, conn_freq, vol_sym]:\n    z = (f - mean_30d(H,f)) / std_30d(H,f)\n \
      \   IF z > 3 THEN ALERT relay_role_deviation(H, f, z)"
- question: Is a host's rate of failed/half-open connections (S0/REJ/RSTO/RSTRH, firewall blocked/denied)
    and forwarded-DNS error rate (NXDOMAIN/SERVFAIL) elevated above its normal envelope, as expected when
    servicing external relay clients?
  context: A distinct failure-mode statistical signal for the Detect tactic. Baseline per host the rate
    of failed or half-open connections (Zeek conn_state S0/REJ/RSTO/RSTRH and firewall blocked/denied
    events) and forwarded-DNS error rates (NXDOMAIN/SERVFAIL in dns.log). A relay servicing external clients
    typically drives these failure/reset and resolution-error rates above the host's normal envelope,
    because it attempts connections and lookups on behalf of others to destinations it would not normally
    reach. Alert on >3 sigma deviation. Track success/fail state alongside volume and frequency. Elevated
    failure rates combined with other relay signals strengthen the case; normal failure rates weaken it.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host H, each window w:\n  fail_rate = count(conn_state IN (S0,REJ,RSTO,RSTRH) OR\
      \ fw_action IN (blocked,denied)) / total_conns\n  dns_err   = count(dns.rcode IN (NXDOMAIN,SERVFAIL))\
      \ / total_dns\n  FOR m in [fail_rate, dns_err]:\n    z = (m - mean_30d(H,m)) / std_30d(H,m)\n  \
      \  IF z > 3 THEN ALERT relay_failure_profile(H, m, z)"
- question: Do multivariate sequence forecasts of per-host connection count, unique destination count,
    and per-minute data volume show deviations outside prediction intervals consistent with emergent relay
    activity?
  context: Machine-learning forecasting for the Detect tactic. Train multivariate sequence models (e.g.,
    LSTM/temporal) on each host's connection count, unique destination count, and per-minute data volume
    using the temporal features from [Classification of Network Traffic Based on Single Flow Time Series
    Analysis](https://dl.acm.org/doi/abs/10.5555/3581644.3581681). When observed values fall outside the
    model's prediction intervals in a way consistent with relaying (spike in unique internal destinations,
    bytes-out symmetry, abnormal cadence), raise an alert. Surface the top-3 contributing features via
    [SHAP explainability](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    in the alert text so analysts see why the host scored as a relay, not just a score. Sustained out-of-interval deviation
    across relay-relevant features is a positive indicator; values within prediction intervals are not.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days (train on rolling history)
  queries:
  - technology: ML/pseudocode
    query: "model = train_multivariate_seq(host_features=[conn_count, uniq_dst, vol_per_min])\nFOR each\
      \ host H, each step t:\n  pred, lo, hi = model.predict(H, t)\n  obs = observe(H, t)\n  IF any(obs[f]\
      \ < lo[f] OR obs[f] > hi[f]) THEN\n    feats = shap_top3(model, H, t)\n    ALERT relay_forecast_anomaly(H,\
      \ obs, feats)"
- question: Do a host's inbound and outbound flows carry the same logical stream according to a learned
    flow-correlation model (CNN over inter-packet delays and packet sizes), even when relayed traffic
    is reframed or encrypted?
  context: Machine-learning flow correlation for the Detect tactic, complementing the deterministic Zhang-Paxson
    timing rule. Use a learned correlation function such as [DeepCorr](https://arxiv.org/pdf/1808.07285)
    ([code/data](https://github.com/SPIN-UMass/DeepCorr)), a CNN trained on inter-packet delays and packet
    sizes, to score whether a host's inbound and outbound flows are the same logical stream.
    This links reframed/encrypted relay flows that defeat byte-equality and naive timing checks, which
    is important against a sophisticated actor using tunneling. A high correlation score for an ingress/egress
    pair on a host is strong evidence the host is relaying that stream; a low score across all candidate
    pairs argues against relaying. It parallels but does not replace deterministic timing rules - use
    both.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "corr = load_deepcorr_model()\nFOR each host H, each (in_flow, out_flow) candidate pair:\n\
      \  fin  = features(in_flow:  inter_pkt_delays, pkt_sizes)\n  fout = features(out_flow: inter_pkt_delays,\
      \ pkt_sizes)\n  score = corr.predict(fin, fout)\n  IF score > threshold THEN ALERT learned_flow_correlation_relay(H,\
      \ in_flow, out_flow, score)"
- question: Does the host-to-host communication graph reveal a host newly bridging external sources to
    many internal destinations, scored as an anomalous edge/structure by graph models?
  context: Graph-based machine learning for the Detect tactic. Model the host-to-host communication graph
    and score anomalous edges and structure to flag a host that newly bridges external sources and many
    internal destinations - the structural signature of a relay/pivot. Use the unsupervised GNN edge scoring
    of [CyberGraph](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf) and a host-communication-graph
    ensemble (PCA, k-means, MAD) as in [An Unsupervised Multi-Detector Approach for Identifying Malicious
    Lateral Movement](https://doi.org/10.1109/SRDS.2017.31). A node whose new edges connect an external-facing region to a previously
    unconnected internal cluster is a strong relay candidate, especially when corroborated by timing or
    volume signals. Nodes that fit established graph structure are unlikely relays.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_host_comm_graph(conn.log, netflow)\nedge_scores = gnn_edge_anomaly(G)          \
      \  # CyberGraph\nstruct_scores = ensemble(PCA, kmeans, MAD)(G) # multi-detector\nFOR each host H:\n\
      \  IF bridges_external_to_internal(H, G) AND (edge_scores[H] high OR struct_scores[H] high) THEN\n\
      \    ALERT relay_graph_anomaly(H)"
- question: Are there per-host flow profiles never previously seen for that host, flagged by unsupervised
    outlier models (Isolation Forest, or self-supervised detection for TLS-wrapped traffic without decryption)?
  context: Unsupervised outlier detection for the Detect tactic, providing broad coverage for novel relay
    behavior. Run Isolation Forest as a low-latency baseline over per-host flow features to flag flow
    profiles never seen before for that host, per [Isolation Forest vs. Autoencoders for Zero-Day Network
    Attack Detection](https://ieeexplore.ieee.org/document/10143005/). Where relay traffic is TLS-wrapped,
    apply self-supervised anomaly detection that operates without decryption as in [Anomaly Detection in
    Encrypted Network Traffic Using Self-Supervised Learning](https://www.nature.com/articles/s41598-025-08568-0),
    so encrypted tunnels are still scored. A host
    suddenly exhibiting a flow profile far outside its historical distribution - new destinations, symmetry,
    cadence, volume - is a candidate relay worth correlating with the deterministic and statistical signals
    above. Profiles consistent with the host's history are low priority.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek notice.log
  - NetFlow/IPFIX
  - Firewall connection logs
  - 'NAI: Internet Gateway, Core Network Switches, DMZ'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "iforest = IsolationForest(per_host_flow_features)\nFOR each host H, each flow f:\n  score\
      \ = iforest.score(host_features(H, f))\n  IF score indicates outlier THEN ALERT novel_flow_profile(H,\
      \ f)\n# for TLS-wrapped flows:\nss = self_supervised_encrypted_model()\nIF ss.anomaly(encrypted_flow(H))\
      \ THEN ALERT encrypted_relay_anomaly(H)"
