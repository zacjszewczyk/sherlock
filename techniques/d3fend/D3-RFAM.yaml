name: 'D3-RFAM: Remote File Access Mediation'
id: 725d7a25-805c-472c-b5de-a0504ed18c16
description: Investigate how effectively remote file access is being mediated to enforce isolation of
  sensitive data, and hunt for adversaries bypassing or abusing those controls. This playbook helps a
  SOC analyst use SMB access telemetry (Windows Security Event IDs 5145, 5140, 4624, 4625 and Zeek smb_files.log
  / smb_mapping.log) to confirm that mediated access controls actually hold, profiling both successful
  (granted) and denied operations as distinct signals so credential abuse, unauthorized source-to-share
  access, share enumeration, and anomalous remote file-access volume all surface. It layers network flow
  telemetry (Zeek conn.log / dce_rpc.log) to profile held-open, automated, or beaconing file-access sessions,
  rare named-pipe and admin-share usage, and blocked-connection (REJ/S0) enforcement signals where endpoint
  logging is incomplete. Finally it adds graph- and sequence-based machine-learning models that rank rare
  source->share/host access edges, temporally novel relationships, low-likelihood event chains, and outlier
  SMB sessions, running in parallel with the deterministic rules (never replacing them) and always surfacing
  the top contributing features. Together these methods let the analyst measure remote-file-access mediation
  coverage and catch lateral movement, credential switching, admin-share write-then-execute chains, and
  data theft against file servers and domain controllers hosting sensitive HR, Finance, and R&D data.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Within a short window (about 5 minutes), do we see a source IP that was DENIED file-share
    access (Windows Event ID 5145 with an access-check 'denied' result, or a failed logon 4625) then succeed
    with a Network logon (Event ID 4624, logon type 3) from the SAME source IP but using a DIFFERENT account,
    indicating an attacker switched credentials to defeat access mediation?
  context: 'Under the Isolate (D3-I) tactic, remote file access mediation is supposed to deny unauthorized
    principals at the share. A high-fidelity bypass pattern is denied-then-success credential switching:
    an actor fails a share access check or logon from a host, then re-attempts from the same source with
    a different (often more privileged or freshly compromised) account and succeeds. Correlate failed
    share access (5145 with a ''denied'' access-check result, or 4625) from a source IP seen in Zeek conn.log
    with a subsequent successful 4624 logon type 3 from that same source using a different account within
    5 minutes. The 5145 access-mask and granted/denied result fields disambiguate the exact operation.
    A positive result is a same-source account swap that converts a denial into success - strong evidence
    of credential testing against the mediation boundary; a negative result is isolated failures or successes
    with no account change. Map artifacts to events per JPCERT/CC''s lateral-movement event-log research.
    References: [5145(S,F): network share access check, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5145);
    [Detecting Lateral Movement through Tracking Event Logs, JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources: &id001
  - Windows Security Event ID 5145
  - Windows Security Event ID 5140
  - Windows Security Event ID 4624
  - Windows Security Event ID 4625
  - Zeek smb_files.log
  - Zeek smb_mapping.log
  - Zeek conn.log
  - 'NAI: File servers hosting sensitive departmental data (e.g., HR, Finance, R&D), Domain Controllers'
  range: 'Last 90 days (event-centered: correlate denial and success within 5 minutes)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from (Windows EID 5145 result=denied OR Windows EID 4625) as fail

      | join (Windows EID 4624 logon_type=3) as ok on fail.src_ip == ok.src_ip

      | where ok._time - fail._time <= 5m AND fail.account != ok.account

      | lookup zeek_conn on src_ip to confirm session

      | table host, src_ip, fail.account, ok.account, fail.access_mask, fail._time, ok._time'
- question: Did any user account SUCCESSFULLY access a sensitive share (Windows Event ID 5145/5140) from
    a source subnet or host class that is NOT on the approved allowlist for that share - even when both
    authentication and the SMB access check succeeded?
  context: 'Even fully successful, authenticated access can violate isolation if it originates from an
    unapproved location. Supporting the Isolate (D3-I) tactic, this deterministic ''suspicious path''
    predicate (from Hopper, Ho et al.) flags credential use that reaches a never-before-seen or non-approved
    destination for that account. Maintain a per-share allowlist of approved source subnets / host classes
    and alert when a successful 5145/5140 access to a sensitive share comes from outside that allowlist.
    This catches compromised-but-valid credentials being used from an attacker foothold or an unexpected
    jump host. A positive result is successful sensitive-share access from an off-allowlist source; a
    negative result is access confined to approved pathways. Because auth and access both succeed, this
    signal is invisible to failure-only monitoring, which is why it must be enforced explicitly. References:
    [Hopper: Modeling and Detecting Lateral Movement, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from (Windows EID 5145 OR 5140) result=granted where share in sensitive_shares

      | lookup share_source_allowlist on share, src_subnet

      | where src_subnet not in approved_sources_for(share)

      | table host, account, src_ip, src_subnet, share, relative_target_name, _time'
- question: Is there a remote WRITE to an administrative share (ADMIN$/C$/IPC$) - seen in Windows Event
    ID 5145 Relative Target Name or Zeek smb_files.log - followed within about 10 minutes by a service
    creation (Event ID 7045), a scheduled task, or a process execution on the SAME target host?
  context: 'The classic SMB lateral-movement chain is to write a payload to an admin share and then execute
    it via a new service, scheduled task, or remote process - a direct breach of the isolation the Isolate
    (D3-I) tactic enforces. Correlate a remote write to ADMIN$/C$/IPC$ (5145 Relative Target Name, or
    smb_files.log action=write) with a follow-on 7045 service install, scheduled task, or process execution
    on the same target within 10 minutes, per MITRE DET0530 and the BZAR SMB/DCE-RPC rule set. A positive
    result is a write-then-execute pair on the same host inside the window - a high-confidence remote-execution
    / lateral-movement indicator; a negative result is admin-share writes from legitimate management tooling
    with no anomalous follow-on execution (allowlist known admin/EDR tooling to reduce noise). References:
    [Zeek smb_files.log, Zeek Project](https://docs.zeek.org/en/master/reference/logs/smb.html); [Multi-Event
    Detection for SMB Admin Share Lateral Movement, MITRE DET0530](https://attack.mitre.org/detectionstrategies/DET0530/);
    [BZAR, MITRE](https://github.com/mitre-attack/bzar).'
  answer_sources: *id001
  range: 'Last 90 days (event-centered: write and execution within 10 minutes on the same target)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from (Windows EID 5145 OR Zeek smb_files.log) where rel_target_name in (ADMIN$,C$,IPC$) AND
      action=write as w

      | join (Windows EID 7045 OR scheduled_task_create OR process_creation) as x on w.target_host ==
      x.host

      | where x._time - w._time <= 10m

      | where w.src_account not in admin_tooling_allowlist

      | table w.target_host, w.src_ip, w.src_account, w.rel_target_name, x.event_type, x.image, w._time,
      x._time'
- question: For each source IP and account, is the count or ratio of DENIED file-access checks (Windows
    Event ID 5145 'denied', plus 4625) spiking over rolling 5-minute and 1-hour windows - for example
    more than 20 denied checks in 5 minutes, or a denied:granted ratio above that account's 99th-percentile
    baseline?
  context: 'Failure bursts are a distinct signal of probing or access-control evasion under the Isolate
    (D3-I) tactic, separate from successful enumeration. Track the count and ratio of denied 5145 results
    (and 4625 failed logons) per source IP / account over rolling 5-minute and 1-hour windows and alert
    when failures burst (e.g., >20 denied file-access checks in 5 minutes) or when the denied:granted
    ratio exceeds the per-account 99th-percentile baseline. This surfaces an actor hammering shares they
    cannot reach - the mediation boundary is doing its job but is under attack. A positive result is a
    denial burst or abnormally high denial ratio for a source/account; a negative result is failures within
    normal baseline. Derive thresholds from each account''s own history per JPCERT/CC. References: [Detecting
    Lateral Movement through Tracking Event Logs, JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources: *id001
  range: Last 90 days (rolling 5-minute and 1-hour windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (Windows EID 5145 result=denied OR Windows EID 4625)

      | bin _time span=5m

      | stats count as denials by src_ip, account, _time

      | join (stats count as grants by src_ip, account from EID 5145 result=granted)

      | eval ratio = denials / (grants+1)

      | eventstats perc99(ratio) as p99_ratio by account

      | where denials > 20 OR ratio > p99_ratio

      | sort denials desc'
- question: For each user-share pair, does the number of unique files accessed per hour or the total bytes
    read/written exceed that pair's 95th-percentile baseline (built from 30+ days of history), and which
    features - file count, byte volume, off-hours timing - drive the anomaly?
  context: 'Mass file access or bulk read/write against sensitive shares is a hallmark of staging and
    exfiltration, directly threatening the data isolation the Isolate (D3-I) tactic protects. For each
    user-share pair, compute the distribution of unique files accessed per hour and total bytes read/written
    from Zeek smb_files.log and Windows Event ID 5145, and alert when activity exceeds the per-pair 95th-percentile
    baseline in volume or frequency. Use 30+ days of history and score outliers via PCA reconstruction
    error and Median Absolute Deviation per Bohara et al. Crucially the alert must name the top contributing
    features (file count, byte volume, off-hours) so the analyst can triage. A positive result is a user-share
    pair far above its own normal access envelope; a negative result is access within learned bounds.
    References: [An Unsupervised Multi-Detector Approach for Identifying Malicious Lateral Movement, Bohara
    et al](https://mnoureddine.com/files/17BOH01.pdf).'
  answer_sources: *id001
  range: Last 90 days (baseline 30+ days, score recent windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (Zeek smb_files.log OR Windows EID 5145)

      | bin _time span=1h

      | stats dc(file) as uniq_files, sum(bytes_rw) as bytes by account, share, _time

      | eventstats perc95(uniq_files) as p95_files, perc95(bytes) as p95_bytes by account, share

      | eval anomaly = uniq_files > p95_files OR bytes > p95_bytes

      | where anomaly

      | eval top_features = rank([uniq_files, bytes, off_hours_flag])  # PCA/MAD attribution

      | table account, share, uniq_files, bytes, off_hours_flag, top_features'
- question: Within a 5-minute window, did a single source IP or user account request an unusually high
    number of DISTINCT share names (Windows Event ID 5140 or 5145) - for example more than 10 unique shares
    - indicating horizontal scanning or automated share discovery?
  context: 'Share enumeration is reconnaissance that precedes lateral movement and data theft, undermining
    the Isolate (D3-I) tactic. Monitor the number of distinct share names requested by a single source
    IP or account within a 5-minute window and alert when it exceeds a threshold (e.g., >10 unique shares),
    which indicates horizontal scanning or automated discovery rather than normal targeted access. Layer
    association-rule baselining to score structurally anomalous access (unusual user->source->share triples)
    per Siadati and Memon. A positive result is one actor touching many shares in a short burst, or a
    triple that has never co-occurred before; a negative result is access to a small, consistent set of
    shares. Distinguish this from authorized backup/scanning service accounts via allowlist. References:
    [Detecting Structurally Anomalous Logins Within Enterprise Networks, Siadati and Memon](https://doi.org/10.1145/3133956.3134003).'
  answer_sources: *id001
  range: Last 90 days (5-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (Windows EID 5140 OR 5145)

      | bin _time span=5m

      | stats dc(share) as uniq_shares, values(share) as shares by src_ip, account, _time

      | where uniq_shares > 10 AND account not in scanner_allowlist

      | lookup assoc_rule_baseline on (account, src_ip, share) to flag rare triples

      | sort uniq_shares desc'
- question: Are we seeing SMB named-pipe access to remote-execution pipes (svcctl, atsvc, winreg, srvsvc)
    or administrative-share mappings in Zeek smb_mapping.log / dce_rpc.log that match known lateral-movement
    tradecraft?
  context: 'Network telemetry catches remote-execution tradecraft even where host audit logs are incomplete,
    supporting the Isolate (D3-I) tactic. Alert on SMB named-pipe access to pipes used for remote service
    control and task scheduling - svcctl (service control), atsvc (scheduled tasks), winreg (remote registry),
    srvsvc (share enumeration) - and on administrative-share mappings in Zeek smb_mapping.log / dce_rpc.log,
    using the BZAR rule set and the MITRE DET0530 correlation template. These pipes are the DCE-RPC backbone
    of tools like PsExec and remote WMI. A positive result is access to these high-risk pipes or admin-share
    mappings from a non-administrative or unexpected source; a negative result is ordinary client SMB
    with no sensitive pipe usage. Allowlist legitimate management hosts to reduce noise. References: [Zeek
    smb_mapping.log/dce_rpc.log, Zeek Project](https://docs.zeek.org/en/master/reference/logs/smb.html);
    [BZAR, MITRE](https://github.com/mitre-attack/bzar); [Multi-Event Detection for SMB Admin Share Lateral
    Movement, MITRE DET0530](https://attack.mitre.org/detectionstrategies/DET0530/).'
  answer_sources: &id002
  - Zeek conn.log
  - Zeek smb_files.log
  - Zeek smb_mapping.log
  - Zeek dce_rpc.log
  - 'NAI: File servers, network egress/segmentation boundaries, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from smb_mapping.log, dce_rpc.log

      | where named_pipe in (svcctl, atsvc, winreg, srvsvc) OR share in (ADMIN$, C$, IPC$)

      | where src_ip not in mgmt_host_allowlist

      | table ts, src_ip, dst_ip, named_pipe, share, endpoint, operation'
- question: Which SMB sessions (ports 445/139) or other file-transfer flows in Zeek conn.log show long
    duration, low bytes-per-second, and highly regular inter-arrival timing (low coefficient of variation)
    - the signature of automated/scripted access or beaconing held-open sessions?
  context: 'Automated or scripted remote file access and beaconing C2 over SMB defeat the intent of the
    Isolate (D3-I) tactic by maintaining persistent, low-and-slow access. Score SMB sessions and other
    file-transfer flows in Zeek conn.log for long duration, low byte-per-second throughput, and highly
    regular inter-arrival timing (low coefficient of variation, MAD timing) indicative of automation rather
    than interactive human use, using a RITA-style beacon analysis. Profile failure states (conn_state
    REJ/S0) separately as blocked-connection signals. A positive result is a session that is unusually
    long-lived, trickle-rate, and metronomically regular - classic beaconing or scripted polling; a negative
    result is bursty, variable, human-paced sessions. Report duration, bytes/sec, and timing regularity
    in the alert. References: [RITA, Active Countermeasures](https://github.com/activecm/rita).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log where service=smb OR id.resp_p in (445,139)

      | stats by src_ip, dst_ip: duration, sum(orig_bytes+resp_bytes) as bytes, list(ts_deltas)

      | eval bps = bytes / duration, cv = stdev(ts_deltas)/mean(ts_deltas)

      | where duration > long_session_thresh AND bps < low_rate_thresh AND cv < 0.1

      | sort cv asc'
- question: For each source, is the rate of REJECTED or ABORTED SMB connections (Zeek conn.log conn_state
    in S0/REJ/RSTO) over rolling windows exceeding that source's historical 99th percentile - surfacing
    access-mediation enforcement and scanning distinct from successful sessions?
  context: Blocked connections are direct evidence the mediation/segmentation boundary is rejecting traffic,
    and a spike in them points to scanning or probing under the Isolate (D3-I) tactic. Track per-source
    counts of rejected/aborted SMB connections (conn_state S0 = no reply, REJ = rejected, RSTO = reset)
    over rolling windows and alert when the blocked-connection rate exceeds the source's own historical
    99th percentile. Profiling failures separately from successful sessions lets the analyst see enforcement
    and reconnaissance that would otherwise be lost among normal traffic. A positive result is a source
    generating an abnormal burst of rejected/aborted SMB attempts - host or port scanning against file
    infrastructure; a negative result is failure counts within baseline.
  answer_sources: *id002
  range: Last 90 days (rolling windows)
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log where service=smb OR id.resp_p in (445,139)

      | where conn_state in (S0, REJ, RSTO)

      | bin ts span=1h

      | stats count as blocked by src_ip, ts

      | eventstats perc99(blocked) as p99 by src_ip

      | where blocked > p99

      | sort blocked desc'
- question: When we build an access graph linking accounts, source hosts, and shares from Windows 5145/4624
    and Zeek smb_files.log and link-predict the probability of each access edge, which source->share relationships
    are LOW-probability (rare), and what are the top-3 features (rare edge, novelty, time-of-day) explaining
    each alert?
  context: 'Layered in parallel with the deterministic rules (never replacing them) under the Isolate
    (D3-I) tactic, graph ML surfaces rare access relationships a human would miss. Build an access graph
    from Windows 5145/4624 and Zeek smb_files.log linking accounts, source hosts, and shares; learn node
    embeddings and link-predict the probability of each access edge, alerting on low-probability source->share
    relationships per CyberGraph (Bowman et al.). Surface the rare edge, novelty, and time-of-day as the
    top-3 features so the analyst understands why it fired. A positive result is an account reaching a
    share it (and its peers) essentially never touch - a candidate for compromised-credential lateral
    movement; a negative result is an edge consistent with learned, high-probability access. Treat as
    a ranking signal to prioritize review, corroborated by the rule-based findings. References: [Detecting
    Lateral Movement in Enterprise Computer Networks with Unsupervised Graph AI (CyberGraph), Bowman et
    al](https://www.usenix.org/system/files/raid20-bowman.pdf).'
  answer_sources: &id003
  - Windows Security Event ID 5145
  - Windows Security Event ID 4624
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: File servers hosting sensitive data, Domain Controllers, enterprise authentication graph'
  range: Last 90 days (train on longer history, score recent edges)
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_access_graph(Windows_5145_4624, zeek_smb_files)  # nodes: account, src_host, share\n\
      emb = learn_node_embeddings(G)\nfor edge in recent_access_edges:\n    p = link_predict(emb, edge.src,\
      \ edge.share)\n    if p < threshold:\n        emit_alert(edge, top3=['rare_edge_score','novelty','time_of_day'])"
- question: Applying temporal link prediction over the evolving access graph, which access edges are newly-appearing
    or low-probability over time - including edges involving hosts/accounts unseen at training time?
  context: 'Adversary lateral movement creates new edges in the authentication/access graph over time,
    so temporal modeling catches relationships that are anomalous specifically because they are new, supporting
    the Isolate (D3-I) tactic. Apply temporal link prediction over the evolving access graph to flag newly-appearing
    or low-probability edges using a GNN-plus-recurrent model (Euler, King and Huang) and inductive continuous-time
    learning that can score hosts/accounts unseen at training time (Jbeil, Khoury et al.). The inductive
    capability is important: real environments constantly add new hosts and accounts, and an attacker''s
    pivot may involve nodes the model never saw. A positive result is a temporally novel, low-probability
    edge - a relationship that emerged abruptly and against the graph''s learned dynamics; a negative
    result is edges consistent with the evolving normal structure. Use as a ranked, explainable signal
    alongside deterministic rules. References: [Euler, King and Huang](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf),
    [code](https://github.com/iHeartGraph/Euler); [Jbeil, Khoury et al](https://doi.org/10.1109/SP54263.2024.00009).'
  answer_sources: *id003
  range: Last 90 days (continuous-time / temporal scoring)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_temporal_linkpred(access_graph_snapshots)  # GNN + recurrent, inductive\nfor\
      \ t, edge in evolving_edges:\n    p = model.predict(edge, t)  # scores unseen hosts/accounts too\n\
      \    if p < threshold OR edge.is_new:\n        emit_alert(edge, t, features=['edge_novelty','temporal_prob','node_inductive'])"
- question: Training a self-supervised sequence model on per-account authentication and file-access event
    sequences, which SMB/file-access CHAINS are low-likelihood relative to that account's learned behavior,
    and what engineered features (edge novelty, time deltas) corroborate them?
  context: 'Lateral movement and data theft produce unusual sequences of authentication and file-access
    events, which sequence modeling can flag even when each individual event looks benign - reinforcing
    the Isolate (D3-I) tactic. Train a self-supervised transformer on per-account authentication and file-access
    event sequences and flag low-likelihood SMB/file-access chains per Gokstorp et al., supplemented with
    engineered sequence/structure features (edge novelty, time deltas) from Bian et al. The model learns
    what a normal account''s day-to-day access flow looks like; an injected lateral-movement sequence
    diverges from that learned grammar. A positive result is an account whose recent event chain is highly
    improbable under the model; a negative result is sequences within the learned distribution. Surface
    the most surprising events in the chain so the analyst can triage, and correlate with the deterministic
    findings. References: [Anomaly Detection in Security Logs using Sequence Modeling, Gokstorp et al](https://people.kth.se/~gyuri/Pub/GokstorpNKJD_LogAnomaly_NOMS24.pdf);
    [Uncovering Lateral Movement Using Authentication Logs, Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).'
  answer_sources: *id003
  range: Last 90 days (train on longer clean baseline; score recent sequences)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_sequence_model(per_account_auth_and_file_access_seqs)  # self-supervised transformer\n\
      for acct, window in recent_windows:\n    ll = model.sequence_loglikelihood(window.events)\n    if\
      \ ll < threshold:\n        emit_alert(acct, low_prob_chain=window.events,\n                   features=['edge_novelty','time_deltas'])"
- question: When we build session feature vectors from Zeek conn.log (duration, bytes), smb_files.log
    (path/action, file count), and Windows Event ID 4624 (logon type), then cluster them (e.g., DBSCAN
    or k-means with PCA), which sparse/outlier clusters represent likely unauthorized remote file access,
    and what features define them?
  context: 'Unsupervised clustering groups remote file-access sessions by behavior so that rare, outlier
    sessions - which do not fit any dense cluster of normal activity - stand out for investigation under
    the Isolate (D3-I) tactic. Build session feature vectors from Zeek conn.log (duration, bytes), smb_files.log
    (path/action, file count), and Windows Event ID 4624 (logon type), apply unsupervised clustering (DBSCAN
    or k-means with PCA), and investigate sparse/outlier clusters as likely unauthorized remote file access
    per Bohara et al. Report the top contributing features for each flagged cluster. A positive result
    is a session in a tiny or noise cluster whose feature profile (e.g., off-hours network logon with
    mass file reads) looks like exfiltration or lateral movement; a negative result is a session sitting
    comfortably inside a large, normal-behavior cluster. Use as a ranked, explainable triage signal alongside
    the deterministic rules. References: [An Unsupervised Multi-Detector Approach for Identifying Malicious
    Lateral Movement, Bohara et al](https://mnoureddine.com/files/17BOH01.pdf).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = [conn.duration, conn.bytes, smb.path_action, smb.file_count, win4624.logon_type]\n\
      X = build_session_vectors(feats); Xr = PCA(X)\nlabels = DBSCAN().fit_predict(Xr)  # or kmeans\n\
      for s in sessions where label in sparse_or_noise_clusters:\n    emit_alert(s, top_features=feature_attribution(s))"
