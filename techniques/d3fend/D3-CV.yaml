name: 'D3-CV: Content Validation'
id: 3927f916-2fa5-4901-8c88-81c9d26a87ff
description: Investigate how file content is verified and validated against policy at network ingress
  and egress points. This playbook helps an analyst review content-validation telemetry to determine whether
  transferred files were matched against threat indicators, checked for format consistency (declared extension
  vs. sniffed MIME vs. magic bytes), scanned for active-content/HTML-smuggling signatures, and isolated
  (quarantine/block) before reaching endpoints. It guides statistical baselining of filename entropy,
  file size, MIME rarity, content entropy, and validation outcome rates, and applies machine-learning
  approaches (byte-level type classification, polyglot detection, unsupervised metadata outlier scoring,
  and time-series forecasting) to surface masked executables, encrypted/encoded payloads, polyglots, and
  high-risk content surges indicative of malware delivery or data exfiltration.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any file transferred across an ingress/egress sensor match a known-bad hash or a disallowed
    MIME type or extension, and was it quarantined before reaching an endpoint?
  context: 'Under the Isolate tactic, the goal is to stop malicious content at the boundary. Zeek''s File
    Analysis Framework content-sniffs files and computes MD5/SHA hashes independent of the filename, so
    an analyst can correlate those hashes against threat-intelligence and known-bad hash feeds and alert
    on any match. Maintaining per-file-type known-good allowlists lets you triage unknown content by similarity.
    Policy rules should quarantine disallowed MIME types or extensions (for example application/x-msdownload,
    .scr, .hta, and script-bearing archives) seen in HTTP/SMTP transfers. A positive match means a known
    threat reached the boundary and you must confirm it was isolated and check for prior/successful deliveries;
    a negative result still warrants review of allowlist coverage. Source references: [Zeek File Analysis
    Framework](https://docs.zeek.org/en/master/frameworks/file-analysis.html); [Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).'
  answer_sources: &id001
  - Zeek files.log
  - Zeek http.log
  - Zeek smtp.log
  - 'NAI: Network security monitoring sensors at key ingress/egress points (e.g., internet gateways, VPN
    terminators).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'files = read(''files.log'')

      bad = load_threat_intel_hashes()

      alert files where md5 in bad or sha1 in bad or sha256 in bad

      alert files where mime_type in DISALLOWED_MIME or filename =~ /\.(scr|hta|exe|js|vbs)$/

      triage files where md5 not in known_good_allowlist[mime_type]'
- question: Were any files released whose declared extension, sniffed MIME type, header description, and
    leading magic bytes disagreed with one another, indicating disguised or polyglot content?
  context: 'To safely isolate malicious content, enforce mutual-consistency rules across the declared
    extension, the sniffed MIME type, the header block description, and the leading magic bytes; isolate
    files whose structure disagrees (for example executable content masked as a document), following the
    multi-layer cross-check in the OPSWAT file-format validation patent. Single-signature checks (libmagic/file,
    TrID) are insufficient against polyglots, so additionally scan for co-present multiple format structures
    and trailing embedded objects and route such files to content disarm and reconstruction. A mismatch
    is a strong masking indicator; the analyst should determine whether the file passed validation, where
    it was destined, and whether CDR/quarantine fired. Source references: [OPSWAT file-format validation
    patent](https://patentimages.storage.googleapis.com/ba/10/83/968a6345eee505/US20200104494A1.pdf);
    [Where the Polyglots Are](https://arxiv.org/abs/2407.01529).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for f in file_events:\n  declared = f.extension\n  sniffed  = f.mime_sniffed\n  header   =\
      \ f.header_desc\n  magic    = f.leading_bytes\n  if not consistent(declared, sniffed, header, magic):\n\
      \      isolate(f); alert('format mismatch', f)\n  if count_format_signatures(f) > 1 or has_trailing_embedded_object(f):\n\
      \      route_to_CDR(f); alert('possible polyglot', f)"
- question: Do any HTML or script attachments contain the co-occurring keyword patterns characteristic
    of HTML smuggling that reconstruct binaries client-side and evade byte/MIME inspection?
  context: 'HTML smuggling delivers payloads that are assembled in the browser, so byte/MIME inspection
    at the boundary sees only benign HTML. For HTML/script attachments, alert on keyword co-occurrence
    of Blob/msSaveOrOpenBlob, large base64/data-URI strings, and an auto-clicked download anchor that
    together reconstruct a binary client-side. Because isolation must happen before the user opens the
    file, matching these signatures lets you quarantine the active-content file at ingress. A positive
    hit warrants pulling the full attachment, identifying recipients, and checking whether the reconstructed
    payload was executed on the endpoint. Source reference: [HTML Smuggling Explained](https://www.outflank.nl/blog/2018/08/14/html-smuggling-explained/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "html = files where mime_type in ('text/html','application/javascript')\nalert html where body\
      \ contains ('Blob' or 'msSaveOrOpenBlob')\n             and body matches /base64|data:[^;]+;base64,/\
      \ with len > THRESH\n             and body contains auto_click_anchor_pattern"
- question: Which transferred files show filename entropy, file size, or MIME-type frequency far outside
    the normal per-file-type baseline, or which minutes show spikes in rare/high-risk MIME classes?
  context: 'Statistical baselining helps surface content that does not fit normal traffic for isolation
    review. Compute per-file-type distributions of filename entropy, file size (Zeek total_bytes), and
    MIME-type frequency, and flag values beyond robust outlier bounds using the MAD-based modified Z-score
    (start at modified Z > 3.5; derive per-segment thresholds from 30 days of local data). Also track
    byte-count volume and high-risk MIME counts per minute and alert on sudden spikes in rare or unexpected
    classes. Outliers may be randomized malware filenames, oversized exfiltration archives, or unusual
    document types; investigate the source segment and destination. Source reference: [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources: *id001
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_mime_stats(last_30d): median, MAD of {filename_entropy, total_bytes}\nfor f\
      \ in files:\n  mz = 0.6745*(x - median)/MAD   # per feature\n  if mz > 3.5: alert('metadata outlier',\
      \ f, feature)\nper_minute = count(files) by mime_type\nalert per_minute where mime_type in HIGH_RISK\
      \ and count > spike_threshold"
- question: Do any files contain encrypted or encoded payloads detectable via type-specific entropy thresholds
    combined with chi-square, serial-correlation, and compression tests rather than raw Shannon entropy
    alone?
  context: 'Raw Shannon entropy false-positives on legitimately compressed formats (zip, jpeg, docx),
    so to isolate truly suspicious content use type-specific entropy thresholds combined with chi-square,
    serial-correlation, and compression tests to detect encrypted/encoded payloads embedded in or appended
    to files. For data smuggled in filenames or content fields, add lexical/n-gram entropy features. A
    region of anomalously high, structureless entropy inside a document type that should not contain it
    suggests a packed/encrypted payload or appended object; isolate and route to deeper analysis. Source
    references: [Davies et al.](https://arxiv.org/abs/2210.13376); [Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf);
    [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for f in files:\n  H = shannon(f.bytes); chi = chi_square(f.bytes)\n  sc = serial_correlation(f.bytes);\
      \ cr = compression_ratio(f.bytes)\n  if H > entropy_threshold[f.type] and chi outside expected and\
      \ sc ~ 0 and cr ~ 1:\n      alert('encrypted/encoded payload', f)\nadd ngram_entropy(filename) as\
      \ feature"
- question: Are pass, quarantine, block, and validation-error/parse-failure rates by source segment and
    file type shifting in ways that signal adversary probing or degraded detection?
  context: 'Tracking the validation pipeline''s own outcomes is a detection signal. Track pass, quarantine,
    block, and validation-error/parse-failure rates by source segment and file type, plus the analyst-confirmed
    true-positive rate. Rising parse failures or blocked-transfer bursts can be distinct adversary signals
    (probing parsers, malformed-file attacks). Escalate when high-risk classes show rising pass rates
    or declining detection precision, which may mean evasion is succeeding. This directly supports the
    Isolate mission by revealing whether the boundary control is still effective. Source reference: [Nadler
    et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'rates = count(files) by (source_segment, file_type, outcome) over time

      outcome in {pass, quarantine, block, parse_error}

      alert where parse_error_rate rising vs baseline

      alert where high_risk_type pass_rate increasing or analyst_TP_precision declining'
- question: Does a byte-level content-type classifier (e.g., Magika) disagree with a file's declared extension/MIME,
    or return an unrecognized or high-confidence-encrypted class?
  context: 'A learned byte-level classifier such as Magika determines the true content type independent
    of the filename, catching masked executables and mislabeled content that rule-based checks miss. Alert
    when the predicted type disagrees with the declared extension/MIME or returns an unrecognized/high-confidence-encrypted
    class, and surface the top-3 contributing type probabilities in the alert for triage. For the Isolate
    tactic this gives an independent verdict to quarantine on; a disagreement means the file is likely
    disguised and should be held and investigated for its true nature and destination. Source reference:
    [Magika](https://arxiv.org/pdf/2409.13768) (code: https://github.com/google/magika).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "pred, probs = magika.classify(f.bytes)\nif pred != map_type(f.extension) or pred != map_type(f.mime_type):\n\
      \    alert('true-type mismatch', f, top3=probs[:3])\nif pred in ('unknown','encrypted') and confidence\
      \ high:\n    alert('unrecognized/encrypted content', f)"
- question: Do any files score as polyglot or multi-format under a learned classifier of whole-file byte
    distributions, indicating content that defeats magic-byte file-type identification?
  context: 'Polyglots are valid as multiple file types simultaneously and defeat magic-byte file-type
    identification, making them ideal for boundary evasion. Score whole-file byte distributions with gradient-boosted
    or neural polyglot classifiers to catch multi-format files, and report the contributing format markers
    in the alert. Files flagged as polyglot should be isolated and routed to disarmament/reconstruction.
    A positive result means the file can be interpreted as more than one format (e.g., a valid image that
    is also a valid archive/executable); the analyst should examine the embedded format markers and determine
    intended execution path. Source references: [Toward the Detection of Polyglot Files](https://arxiv.org/abs/2203.07561);
    [Where the Polyglots Are](https://arxiv.org/abs/2407.01529).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "score, markers = polyglot_model.predict(byte_histogram(f))\nif score > polyglot_threshold:\n\
      \    isolate(f); alert('polyglot/multi-format', f, format_markers=markers)\n    route_to_CDR(f)"
- question: Which file transfers are flagged as rare anomalies by label-free outlier scoring of their
    metadata feature vectors (size, entropy, MIME, extension, source reputation, byte ratio)?
  context: 'When labeled data is unavailable, unsupervised scoring surfaces unusual transfers for isolation
    review. Score file-transfer feature vectors (size, entropy, sniffed MIME, extension, source reputation,
    byte ratio) with Isolation Forest or its axis-bias-corrected Extended Isolation Forest to surface
    rare oversized, high-entropy, or MIME-mismatched transfers, and emit the top-3 features driving each
    anomaly score. High anomaly scores indicate transfers unlike the bulk of normal traffic; the analyst
    reviews the driving features to decide whether the file warrants quarantine and deeper inspection.
    Source references: [Isolation Forest](https://doi.org/10.1145/2133360.2133363); [Extended Isolation
    Forest](https://arxiv.org/pdf/1811.02141) (code: https://github.com/sahandha/eif).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(files): [size, entropy, mime, extension, src_reputation, byte_ratio]\nmodel =\
      \ ExtendedIsolationForest().fit(X_baseline)\nscores = model.anomaly_score(X)\nfor f where score\
      \ > anomaly_threshold:\n    alert('metadata anomaly', f, top3_features=explain(f))"
- question: Does the observed hourly volume of high-risk MIME classes or suspicious file traits exceed
    a forecasting model's confidence intervals, indicating a malware campaign or exfiltration surge?
  context: Time-series forecasting detects abnormal surges that point-in-time rules miss. Train a forecasting
    model on hourly counts of high-risk MIME classes and suspicious file traits, and alert when observed
    volume exceeds the model's confidence intervals, annotating which file types and source segments drove
    the deviation. A breach of the upper bound for inbound high-risk types can indicate a malware delivery
    campaign, while a surge in outbound high-entropy or oversized transfers can indicate exfiltration.
    This supports proactive isolation by flagging the surge so the analyst can scope the campaign and
    tighten boundary controls.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_count(files where mime_type in HIGH_RISK or trait in SUSPICIOUS)\nforecast,\
      \ lo, hi = ts_model.predict(series)\nfor t where observed[t] > hi[t]:\n    alert('high-risk content\
      \ surge', t, drivers=top_types_and_segments(t))"
