questions:
- question: Did any user successfully authenticate from a country that is on a high-risk or sanctioned-country
    blocklist, or from a country never before seen for that user and not on an approved-travel allowlist?
  context: This is a deterministic (Detect) check that fires regardless of any statistical or ML model.
    Correlate successful logons (Windows Event ID 4624, Azure AD/Entra sign-ins, VPN/RADIUS) with their
    source IP from network flow data (Zeek conn.log) and enrich with geolocation. A logon from a sanctioned
    or high-risk country, or from a country where the enterprise has no users, is treated as a deterministic
    hit because legitimate users should not originate there. A positive result is a strong indicator of
    stolen-credential abuse or remote-attacker access and warrants immediate session review and possible
    account containment; a negative result means the logon origin is within expected geography. Tune by
    maintaining an organizational allowlist of countries where employees legitimately operate or travel.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - VPN/RADIUS authentication logs
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  for logon in auth_events(result='success'):\n    geo = geoip(logon.src_ip)  # country,\
      \ city, asn\n    if geo.country in HIGH_RISK_OR_SANCTIONED\n       or (geo.country not in user_allowlist[logon.user]\n\
      \           and geo.country not in enterprise_user_countries):\n      alert(user=logon.user, src_ip=logon.src_ip,\
      \ country=geo.country, reason='high-risk/never-seen country')"
- question: Are there user logons whose source IP belongs to a commercial VPN/proxy range, a Tor exit
    node, or a hosting/anonymizer ASN that obscures the true origin of the connection?
  context: Anonymizing infrastructure hides an attacker's real location and is rarely needed for legitimate
    corporate access, so for the Detect tactic these logons are treated as standalone deterministic detections.
    Compare the source IP of external logons against curated lists of VPN/proxy ranges, Tor exit nodes,
    and hosting/anonymizer ASNs (enriched from Zeek conn.log and identity-provider sign-in data). A positive
    result means a user authenticated through infrastructure designed to defeat geolocation — common in
    credential-theft and account-takeover scenarios — and should be correlated with other risk signals;
    a negative result means the origin IP maps to an ISP/eyeball network consistent with normal user access.
    Exclude sanctioned corporate VPN egress IPs to avoid false positives.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - VPN/RADIUS authentication logs
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  for logon in auth_events(scope='external'):\n    asn = geoip(logon.src_ip).asn\n   \
      \ if logon.src_ip in TOR_EXIT_NODES\n       or logon.src_ip in COMMERCIAL_VPN_PROXY_RANGES\n   \
      \    or asn in HOSTING_ANONYMIZER_ASNS:\n      if logon.src_ip not in CORP_VPN_EGRESS:\n       \
      \ alert(user=logon.user, src_ip=logon.src_ip, asn=asn, reason='anonymizer/Tor/VPN')"
- question: For consecutive logons by the same account, does the implied travel velocity between the two
    source locations exceed what is physically possible (e.g., faster than a commercial flight), or imply
    simultaneous presence in two distant places?
  context: Impossible-travel detection is a deterministic (Detect) feasibility test. For each pair of
    consecutive logons of the same account, resolve the source IPs to coordinates and compute implied
    velocity = great-circle distance / elapsed time. Alert when velocity exceeds ~500 mph or implies the
    account is in two disparate locations at once, which strongly suggests concurrent use of stolen credentials.
    Suppress alerts when either endpoint is a trusted/named location or a known corporate VPN egress,
    and account for the geolocation confidence radius (city-level imprecision) to limit false positives.
    A positive result is high-confidence evidence of account compromise; keep this rule running as a deterministic
    floor beneath any ML travel model.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - VPN/RADIUS authentication logs
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days; correlate consecutive logon pairs per user
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  for user in users:\n    for (a, b) in consecutive_logons(user):\n      d = great_circle(geoip(a.src_ip).coords,\
      \ geoip(b.src_ip).coords)\n      t_hrs = (b.time - a.time).hours\n      velocity = d / max(t_hrs,\
      \ epsilon)\n      if velocity > 500_mph and not trusted_or_corp_vpn(a, b):\n        if d > geo_confidence_radius(a)\
      \ + geo_confidence_radius(b):\n          alert(user, a, b, velocity, reason='impossible travel')"
- question: Is this the first time a given user has ever authenticated from a particular country or ASN,
    modeling the logon source as a new edge in the user's authentication graph that is also rare across
    the peer group?
  context: This deterministic (Detect) new-edge rule maintains a per-user set of previously-observed (country,
    ASN) logon edges and alerts the first time an account authenticates from a country or ASN never before
    associated with it. Treating each logon source as a graph edge lets the analyst spot novel origins
    that often accompany credential theft. To suppress benign business travel, require the new edge to
    also be rare across the user's peer group (e.g., department/role). A positive result flags a genuinely
    novel logon origin worth verifying with the user; a negative result means the (country, ASN) pair
    is already part of the user's established footprint.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - VPN/RADIUS authentication logs
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  seen = per_user_edges[user]  # set of (country, asn)\n  for logon in auth_events(result='success'):\n\
      \    geo = geoip(logon.src_ip)\n    edge = (geo.country, geo.asn)\n    if edge not in seen[logon.user]:\n\
      \      if rare_in_peer_group(edge, peers_of(logon.user)):\n        alert(user=logon.user, edge=edge,\
      \ reason='first-seen country/ASN')\n      seen[logon.user].add(edge)"
- question: Based on each user's 90-day historical baseline of login source countries and ASNs, did a
    login occur from a location below the 5th percentile of that user's frequency distribution?
  context: This statistical (Detect) method builds a per-user 90-day baseline frequency distribution of
    login source countries and ASNs, then flags logins from locations in the rare tail (below the 5th
    percentile for that user). Unlike a binary blocklist, it quantifies how unusual a location is for
    the specific individual, catching subtle deviations. Derive the percentile cutoff per environment
    from the false-positive budget. A positive result indicates a login from a location the user almost
    never uses — a possible takeover; a negative result means the location is within the user's normal
    distribution. This per-user histogram-with-threshold design typically requires a ~90-day training
    window before scoring begins.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, and Identity Providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for user in users:\n    hist = freq_distribution(logins(user, window=90d), key=['country','asn'])\n\
      \    cutoff = percentile(hist.frequencies, 5)\n    for logon in todays_logins(user):\n      f =\
      \ hist.frequency_of((logon.country, logon.asn))\n      if f < cutoff or f == 0:\n        alert(user,\
      \ logon, freq=f, reason='rare login location')"
- question: When each login is scored by the likelihood ratio of its features (country, ASN, time-of-day,
    user-agent) under the user's history versus the global/attacker population, does any login exceed
    the calibrated risk threshold?
  context: This statistical (Detect) scoring computes risk = product over features of p(feature | user
    history) / p(feature | global/attacker population), with additive smoothing so a first-seen country
    or ASN yields high suspicion. Country and ASN are empirically the most discriminative features for
    authenticity. The likelihood ratio formally balances how typical a feature is for the legitimate user
    against how typical it is for attackers, producing a calibrated score. Alert above the threshold and
    emit the per-feature contributions so analysts can see which attributes drove the score. A positive
    result is a login whose feature profile resembles attacker behavior more than the user's own history.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, and Identity Providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for logon in auth_events:\n    score = 1.0\n    for feat in [country, asn, tod, user_agent]:\n\
      \      p_user = smoothed_p(feat, user_history[logon.user])\n      p_pop  = smoothed_p(feat, global_population)\n\
      \      score *= p_user / p_pop  # likelihood ratio (higher=more user-like)\n    risk = 1/score\n\
      \    if risk > calibrated_threshold:\n      alert(logon, risk=risk, contributions=per_feature_ratios)"
- question: Is there a statistically significant spike in failed logons (Windows Event ID 4625) from a
    new geography or ASN, or a successful logon immediately preceded by a burst of failures from the same
    source (credential stuffing/spray reaching success)?
  context: 'This statistical (Detect) method baselines the failure mode independently of successful-logon
    anomalies: it profiles failed-logon volume per source IP, ASN, and country, and the success-after-failure
    ratio per account. A spike in failures from a new geo signals credential stuffing or password spraying,
    and a success that immediately follows a burst of failures from the same source is strong evidence
    the attack broke through. A positive result should trigger account lockout review and credential reset;
    a negative result means failed-logon volumes are within normal bounds. This catches brute-force tradecraft
    that pure successful-logon analysis would miss.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, and Identity Providers'
  range: Last 90 days; tighten to hours/minutes for burst correlation
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline_failed_logons(window=90d, key=['src_ip','asn','country'])\n  for geo\
      \ in current_window:\n    if failed_count(geo) > base.mean(geo) + 3*base.std(geo):\n      alert(geo,\
      \ reason='failed-logon spike from new geo')\n  for s in successes:\n    if burst_of_failures_before(s,\
      \ same_source, lookback='15m'):\n      alert(s, reason='success after failure burst (stuffing/spray)')"
- question: When the enterprise authentication graph (users, hosts, source-geos as nodes; logons as edges)
    is scored by edge rarity, do any logon edges fall in the lowest rarity quantile by historical and
    peer-group frequency?
  context: This statistical (Detect) approach constructs an authentication graph and scores each logon
    edge by how rarely it appears historically and within the user's peer group, alerting on edges in
    the lowest rarity quantile. Causal-path rarity scoring is effective at detecting first-time or improbable
    logon destinations while staying within a small alert budget. A positive result identifies a logon
    connection (e.g., this user from this geo) that is anomalously uncommon across the organization; a
    negative result means the edge is well-trodden. This complements per-user baselining by adding enterprise-
    and peer-level context to judge rarity.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - 'NAI: Domain Controllers, VPN Concentrators, and Identity Providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  G = build_auth_graph(nodes={users,hosts,src_geos}, edges=logons)\n  for e in G.edges:\n\
      \    rarity = 1 / (historical_freq(e) + peer_group_freq(e) + 1)\n    e.score = rarity\n  cutoff\
      \ = quantile([e.score for e in G.edges], 0.99)\n  for e in G.edges:\n    if e.score >= cutoff:\n\
      \      alert(edge=e, reason='rare logon edge')"
- question: Using a per-user time-series/Markov model of location transitions, does the next login occur
    at a very-low-probability location given the user's prior location sequence?
  context: This machine-learning (Detect) method models each user's sequence of login locations over time
    (e.g., a per-user Markov or time-series model of location transitions) to predict the probability
    that the next login is geographically proximate to the last. It learns realistic movement patterns
    (commute, recurring travel) rather than applying a fixed velocity rule, catching anomalies a static
    threshold would miss. Alert when a login lands at a very-low-probability location, and include the
    implied velocity and prior/next location in the alert text. Keep the deterministic impossible-travel
    rule running in parallel as a floor. A positive result is a transition the model considers highly
    improbable for that user.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - VPN/RADIUS authentication logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days; sequence-aware over consecutive logons
  queries:
  - technology: ML/pseudocode
    query: ">-\n  model = per_user_location_transition_model(history=90d)  # Markov/time-series\n  for\
      \ user in users:\n    prev = last_login_location(user)\n    for logon in new_logins(user):\n   \
      \   p = model[user].prob(next=logon.location | prev)\n      if p < low_prob_threshold:\n       \
      \ v = implied_velocity(prev, logon)\n        alert(user, prev, logon.location, prob=p, velocity=v)\n\
      \      prev = logon.location"
- question: Do node embeddings over the enterprise authentication graph and a link predictor estimate
    any (user, source-host/geo) logon edge as having a probability below the anomaly cutoff?
  context: This unsupervised machine-learning (Detect) method learns node embeddings over the authentication
    graph and trains a logistic-regression link predictor to estimate the probability of each (user, source-host/geo)
    logon edge, flagging edges below a probability cutoff. The approach achieves roughly 85% true-positive
    rate at ~0.9% false-positive rate on enterprise auth data and yields link-level explanations (which
    entity/edge and its probability) for triage. Surface the top-3 contributing features in the alert.
    A positive result is a logon relationship the model finds improbable given learned structure; a negative
    result means the edge is consistent with the graph's normal connectivity.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - VPN/RADIUS authentication logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  emb = learn_node_embeddings(auth_graph)  # unsupervised\n  clf = train_link_predictor(emb,\
      \ observed_edges)  # logistic regression\n  for e in candidate_logon_edges:\n    p = clf.predict_proba((e.user,\
      \ e.src_host_geo))\n    if p < prob_cutoff:\n      alert(edge=e, prob=p, top_features=top_3(clf,\
      \ e))"
- question: Does a UEBA baseline of each user and their peer group flag this logon as anomalous (uncommon
    geo/ASN, unfamiliar location, unusual sign-in time) and is it tagged 'uncommon for user / uncommon
    for peers / first time seen' with an investigation-priority score?
  context: This machine-learning (Detect) UEBA method baselines each user and their peer group over a
    learning window and scores logon deviations such as anomalous geo/ASN, unfamiliar location, and unusual
    sign-in time. It tags each anomaly as 'uncommon for user', 'uncommon for peers', or 'first time seen'
    and produces an investigation-priority score plus the contributing features, which serve as the explainability
    surface for triage. A positive result is a logon that deviates from both the individual's and the
    peer group's norms — a strong analyst-actionable signal; a negative result means behavior aligns with
    the user and peers. Peer-group context reduces false positives from individuals with naturally varied
    behavior.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - VPN/RADIUS authentication logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/UEBA pseudocode
    query: ">-\n  baseline = ueba_baseline(user, peer_group, window=learning_window)\n  for logon in auth_events:\n\
      \    dev = score_deviation(logon, baseline)  # geo, asn, location, sign-in time\n    tags = classify(logon,\
      \ baseline)  # uncommon_for_user / uncommon_for_peers / first_time_seen\n    if dev > threshold:\n\
      \      alert(user, logon, priority=dev, tags=tags, features=contributing_features)"
- question: Does real-time profiling of each entity's login conditions (times, locations, devices) and
    post-login behavior produce a risk score and confidence high enough to warrant step-up authentication
    at logon or session termination/privilege curtailment afterward?
  context: This machine-learning (Detect) method profiles each entity's login conditions and post-login
    behavior in real time, producing a risk score and a confidence level. When an anomalous-location logon
    scores high, it triggers step-up authentication before access proceeds; when risky behavior is detected
    after login, it can terminate the session or curtail privileges. Each decision emits the top contributing
    features and confidence for transparency. A positive (high-risk, high-confidence) result drives an
    adaptive control rather than just an alert, shrinking the attacker's window; a negative result allows
    normal access. This ties geolocation anomaly detection directly to automated, graduated response.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - VPN/RADIUS authentication logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days; real-time scoring at logon
  queries:
  - technology: ML/Risk-scoring pseudocode
    query: ">-\n  profile = entity_profile(times, locations, devices, post_login_behavior)\n  for logon\
      \ in auth_events_realtime:\n    risk, conf = model.score(logon, profile[logon.entity])\n    if anomalous_location(logon)\
      \ and risk > step_up_threshold:\n      require_step_up_auth(logon, explain=top_features(logon))\n\
      \    if post_login_risk(logon) > terminate_threshold:\n      terminate_session_or_curtail(logon.entity,\
      \ confidence=conf)"
- question: Do unsupervised population/anomaly jobs over logon and cloud-control-plane logs flag any source
    geography or ASN that is rare for an identity relative to the broader population, with feature attribution
    in the results?
  context: This machine-learning (Detect) method runs unsupervised population/anomaly jobs over logon
    and cloud-control-plane logs to flag source geographies or ASNs that are rare for an identity relative
    to the population, returning feature attribution for each finding. It applies the rare-for-this-user-versus-population
    principle on first-party telemetry without mandatory external API lookups, making it resilient and
    scalable. A positive result is an identity logging in from a geo/ASN that is anomalous compared to
    how the population behaves, with the contributing features shown for triage; a negative result means
    the origin is unremarkable population-wide. This complements per-user baselining by leveraging cross-identity
    population structure.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Azure AD/Entra sign-in logs
  - VPN/RADIUS authentication logs
  - 'NAI: Domain Controllers, VPN Concentrators, Identity Providers, and Internet Gateway Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/Anomaly-job pseudocode
    query: ">-\n  job = unsupervised_population_anomaly(\n          source=union(logon_logs, cloud_control_plane_logs),\n\
      \          fields=['identity','src_country','asn'])\n  for record in job.results:\n    if record.anomaly_score\
      \ > threshold:\n      alert(identity=record.identity, geo=record.src_country, asn=record.asn,\n\
      \            attribution=record.feature_influence)"
