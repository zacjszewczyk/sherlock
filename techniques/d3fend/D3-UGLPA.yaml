name: 'D3-UGLPA: User Geolocation Logon Pattern Analysis'
id: 6fdc05f3-0e56-4c41-82ea-90d5c8fa72b5
description: 'Investigate anomalous user logons by analyzing the geolocation of authentication attempts
  against per-user behavioral baselines. This playbook helps an analyst detect remote attackers using
  stolen credentials by correlating successful and failed logons with their source IPs and enriching them
  with geolocation (country, city, ASN) and IP reputation. It spans three complementary layers: deterministic
  symbolic-logic rules (high-risk/sanctioned-country logons, VPN/Tor/anonymizer usage, impossible-travel
  velocity, and first-seen country/ASN per user), statistical baselining and scoring (rare-location percentiles,
  likelihood-ratio risk scoring, failed-logon geolocation spikes, and authentication-graph edge rarity),
  and machine-learning models (impossible-travel forecasting, link-probability graph anomalies, UEBA peer-group
  deviations, real-time adaptive risk scoring, and population/ASN anomaly jobs). Each method emphasizes
  explainability — surfacing the top contributing features (country, ASN, implied velocity, time-of-day)
  — so a SOC analyst can triage logons that are physically impossible, reputationally bad, rare for the
  user, or anomalous relative to peers and the broader population.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
