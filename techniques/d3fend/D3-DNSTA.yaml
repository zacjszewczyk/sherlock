name: 'D3-DNSTA: DNS Traffic Analysis'
id: 0fa01652-4c91-4f79-b9f5-8142ab0b4823
description: This playbook helps an analyst investigate DNS query and response telemetry for evidence
  of malicious infrastructure and command-and-control communication. It correlates DNS activity against
  threat-intelligence and sinkhole feeds, enforces RFC 1035 structural and record-type rules, hunts suspicious
  usage primitives with process context, and measures information-theoretic, lexical, volumetric, TTL/answer-diversity,
  and timing/failure-rate statistics. It then layers unsupervised anomaly detection and supervised character-level
  and interpretable tree classifiers to surface DGA C2 domains, fast-flux infrastructure, DNS tunneling/exfiltration,
  and beacon-like command-and-control - giving the SOC concrete, explainable evidence across DNS, network,
  and endpoint sources.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any DNS queries or resolved answers in our DNS telemetry matching curated threat-intelligence
    indicators for malicious domains, known C2 infrastructure, or sinkhole IP addresses?
  context: Symbolic Logic. Continuously compare Zeek dns.log query values and resolved answers against
    curated threat-intelligence feeds of malicious domains, known command-and-control (C2) infrastructure,
    and sinkhole IPs, generating immediate high-severity alerts on any direct match. This is the highest-confidence,
    lowest-false-positive DNS detection and directly supports the Detect tactic by surfacing confirmed-bad
    domains as they are queried. A host resolving and then connecting to a sinkholed IP is strong confirmation
    that the host is already infected, because legitimate software has no reason to reach sinkhole infrastructure.
    Align rule coverage and DNS-to-network/process correlation to MITRE ATT&CK T1071.004 (DNS application-layer
    protocol) and MITRE DET0400. A positive result warrants immediate host isolation and investigation;
    a negative result does not clear the host, since novel or DGA domains will not appear in feeds and
    require the statistical/ML checks below.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Match DNS queries/answers against threat-intel + sinkhole feeds\nfor each dns event in\
      \ zeek_dns:\n  if dns.query in TI_malicious_domains or dns.answer_ip in (TI_c2_ips or SINKHOLE_ips):\n\
      \    alert(severity=HIGH, host=dns.src, domain=dns.query, ip=dns.answer_ip)"
  - technology: SIEM/Rule pseudocode
    query: 'index=dns (query IN [ti_domains] OR answer IN [ti_c2_ips,sinkhole_ips])

      | eval confirm=if(answer IN [sinkhole_ips],"infected","suspicious")

      | table _time src_host query answer confirm'
- question: Do any DNS messages violate RFC 1035 structural limits or show bursts of rare/abusable record
    types (TXT, NULL, CNAME) directed at a single registered domain?
  context: 'Symbolic Logic. Apply hard RFC 1035 structural thresholds as deterministic anomaly rules:
    any single label longer than 63 octets, any total name longer than 255 octets, or any UDP response
    larger than 512 octets is structurally illegal or abnormal and should be flagged. In parallel, flag
    bursts of rare or abusable record types (TXT, NULL, CNAME) repeatedly directed at one registered domain.
    This is the same RR-type and label-structure filter Tatang et al. used to uncover real-world DNS tunnels
    among 2B+ newly observed hostnames. Supports Detect by catching DNS tunneling and covert-channel setups
    that abuse protocol fields to carry data. A positive result indicates probable tunneling/exfiltration
    over DNS; benign edge cases (some CDNs, DNSSEC) should be baselined out, but the structural counts
    should never be deleted.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for each dns event:\n  if any(len(label) > 63 for label in dns.query.split(\".\")) or len(dns.query)\
      \ > 255\n     or (dns.proto==\"udp\" and dns.resp_len > 512):\n    alert(\"RFC1035 violation\",\
      \ host=dns.src, name=dns.query)\n// rare/abusable record-type bursts to one registered domain\n\
      group dns by reg_domain, qtype over 5m\nif qtype in (TXT,NULL,CNAME) and count > baseline_p99: alert(\"\
      rare RR burst\", reg_domain)"
- question: Which hosts exhibit suspicious DNS usage primitives - repeated TXT/NULL lookups to rare domains,
    excessive NXDOMAIN bursts, sudden resolver changes, or non-browser processes issuing DNS - and are
    those followed by external communications?
  context: 'Symbolic Logic. Build deterministic rules for suspicious DNS usage patterns: repeated TXT/NULL
    lookups to rare domains, excessive NXDOMAIN bursts per host (e.g., more than 50 NXDOMAIN per host
    per minute, a hallmark of DGA rendezvous failures), sudden resolver changes (possible resolver hijack
    or evasion), and non-browser processes issuing DNS as seen in Sysmon Event ID 22. Correlate these
    with Zeek conn.log to confirm whether the suspicious DNS activity is followed by actual external communications,
    per MITRE DET0400. Supports Detect by tying DNS anomalies to process and network context so an analyst
    can distinguish noise from real C2. Tune thresholds to environment baselines but preserve the concrete
    counts. A positive result - rare-domain lookups from an unexpected process followed by an outbound
    connection - is a strong C2/exfil indicator.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days; for correlation, pivot +/- 5 minutes around each suspicious DNS event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// per host per minute\nstats count(eval(rcode=\"NXDOMAIN\")) as nxd,\n      count(eval(qtype\
      \ IN (\"TXT\",\"NULL\") AND domain_rarity>0.99)) as rare_q,\n      dc(resolver) as resolvers by\
      \ src_host, bin_1m\nwhere nxd > 50 OR rare_q > 0 OR resolvers > 1\n| join src_host [ conn.log where\
      \ ts within +/-5m and direction=outbound ]\n| table src_host nxd rare_q resolvers dest_ip"
  - technology: Sysmon/pseudocode
    query: '// non-browser process issuing DNS

      index=sysmon EventID=22

      | where Image NOT IN (browser_allowlist) AND domain_rarity(QueryName) > 0.95

      | table _time Computer Image QueryName QueryResults'
- question: For each registered domain, does the residual information content of its concatenated subdomain
    labels exceed a benign-baseline threshold, indicating an encoded covert channel?
  context: 'Symbolic Logic / information theory. For each registered domain, deterministically score the
    residual information in concatenated subdomain labels using lossless compression: legitimate hostnames
    are repetitive and compress well, whereas junk or encoded covert payloads compress poorly and carry
    high free information. This follows the information-theoretic bounds of Paxson et al. Alert when per-domain
    free information exceeds a low-overhead threshold derived from benign baselines. This complements
    the open-source unique-subdomain and NXDOMAIN thresholds shipped in RITA. Supports Detect by catching
    DNS tunneling/exfiltration even when each individual query looks structurally legal. A positive result
    (poorly compressible, high-information subdomains to one domain) indicates likely covert data transfer;
    a negative result means observed subdomains are consistent with normal, repetitive naming.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each reg_domain over window:\n  blob = concat(sorted(unique(subdomain_labels)))\n  free_info\
      \ = len(blob) - len(lossless_compress(blob))   // residual information\n  if free_info > benign_baseline_threshold(reg_domain):\n\
      \    alert(\"covert channel: high free information\", reg_domain, free_info)"
- question: Which newly observed domains have high Shannon entropy, abnormal length or character-class
    ratios, and poor character-bigram fit against a legitimate-domain language model, marking them as
    probable DGA artifacts?
  context: Statistical Method. For each newly observed domain, compute Shannon entropy, length, character-class
    ratios, and character-bigram (n-gram) fit against a legitimate-domain Zipf/language model (NgViz,
    Dusi et al.). Establish environment baselines and flag domains above the 98th percentile entropy or
    below the n-gram-fit floor that also have low prevalence as probable domain-generation-algorithm (DGA)
    artifacts. Validate thresholds against benign corpora such as Alexa/Tranco to control false positives.
    Supports Detect by surfacing algorithmically generated C2 rendezvous domains that will not appear
    in threat-intel feeds. A positive result is a high-entropy, low-fit, rarely-seen domain - the lexical
    signature of DGA malware; pronounceable, popular domains will pass.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each newly_observed_domain d:\n  H = shannon_entropy(d); L = len(d); cc = char_class_ratios(d)\n\
      \  ngram_fit = bigram_loglik(d, legit_zipf_model)\n  if (H >= p98(entropy_baseline) or ngram_fit\
      \ < fit_floor) and prevalence(d) < low:\n    flag(d, \"probable DGA\", H, ngram_fit, prevalence(d))"
- question: Which registered domains are information heavy-hitters by distinct-subdomain count, total/longest
    subdomain length, byte volume, or unique/total query ratio over a sliding window, indicating DNS exfiltration?
  context: Statistical Method. Per registered domain over a sliding window, measure volume metrics - distinct-subdomain
    count, total and longest subdomain length, byte volume, and unique-to-total query ratio - as in Nadler
    et al., and rank domains by cumulative subdomain information content using the bounded-memory streaming
    heavy-hitter method of Chhabra/Ozery et al. to catch stealthy low-rate exfiltration without storing
    all traffic. Supports Detect by quantifying the high subdomain fan-out and data volume characteristic
    of DNS tunneling/exfiltration. Alert when a domain's fan-out or information content exceeds environment-derived
    percentiles. A positive result is a single registered domain receiving many unique, high-information
    subdomains - the structural fingerprint of data smuggled over DNS - while CDNs and analytics domains
    should be baselined as known heavy-hitters.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days; evaluate over sliding windows (e.g., hourly and daily)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats dc(subdomain) as fanout, sum(len(subdomain)) as tot_len,\n      max(len(subdomain))\
      \ as max_len, sum(bytes) as vol,\n      dc(query)/count as uniq_ratio by reg_domain, sliding_window\n\
      | eval info_content = streaming_heavy_hitter_score(reg_domain)\n| where fanout > p99(fanout) OR\
      \ info_content > p99(info)\n| sort -info_content"
- question: Do any domains show fast-flux statistics - low/rapidly-changing TTLs, many distinct resolved
    IPs across diverse ASNs and countries, and regularly-repeating access - when scored against passive-DNS
    baselines?
  context: 'Statistical Method. Compute passive-DNS statistics per domain: mean and standard deviation
    of TTL, low-TTL usage, number of TTL changes, distinct resolved IPs/ASNs/countries, and regularly-repeating
    access patterns; risk-score them per EXPOSURE (Bilge et al.). Rapidly changing low-TTL answers with
    high IP/AS scatter indicate fast-flux infrastructure per FluxBuster (Perdisci et al.). Supports Detect
    by exposing resilient C2/phishing hosting that rotates IPs to evade blocking. A positive result is
    a domain whose answers churn across many unrelated networks with short TTLs and periodic re-resolution
    - classic fast-flux; stable, single-AS domains with normal TTLs score low.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats avg(ttl) mean_ttl, stdev(ttl) sd_ttl, count(eval(ttl<60)) low_ttl,\n      dc(answer_ip)\
      \ ips, dc(asn) asns, dc(country) countries by domain over 90d\n| eval risk = score_exposure(mean_ttl,sd_ttl,low_ttl,ips,asns,countries)\n\
      | where risk > threshold  // rapid low-TTL churn + high IP/AS scatter = fast-flux\n| sort -risk"
- question: Which source IPs or domains show beacon-like query timing (regular inter-arrival periodicity)
    or elevated NXDOMAIN/SERVFAIL failure rates indicative of automated C2 or DGA rendezvous failures?
  context: Statistical Method. Apply time-series analytics to per-source-IP and per-domain query inter-arrival
    times using FFT periodicity, autocorrelation, and inter-arrival regularity measures (coefficient of
    variation, median absolute deviation, Bowley skewness) as in BAYWATCH and RITA. Trigger alerts on
    statistically significant heartbeat regularity (the Frequency signal), and separately profile NXDOMAIN/SERVFAIL
    failure rates per host (the State signal) as a distinct indicator of DGA rendezvous failures. Supports
    Detect by identifying the machine-driven, clock-like communication rhythm of beaconing malware and
    the burst of failed lookups when a DGA cycles through candidate domains. A positive result is a host
    that queries a domain at near-constant intervals or generates abnormal failed-resolution bursts; human
    browsing is irregular by comparison.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days; analyze per-host time series with at least multi-day windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each (src_ip, domain) time series of query timestamps:\n  ia = diff(timestamps)\n  freq\
      \ = fft_dominant_peak(ia); cv = stdev(ia)/mean(ia)\n  reg = autocorr_peak(ia); skew = bowley_skew(ia)\n\
      \  if freq significant and cv < cv_floor and reg > reg_thr: alert(\"beaconing\", src_ip, domain)\n\
      // State signal\nstats count(eval(rcode IN (\"NXDOMAIN\",\"SERVFAIL\"))) fails by src_host\nwhere\
      \ fails > host_baseline_p99: alert(\"DGA rendezvous failures\", src_host)"
- question: Which hosts are behavioral outliers in their DNS activity when an unsupervised anomaly model
    is trained on per-host DNS features, and what features drive each outlier?
  context: Machine Learning. Train unsupervised anomaly models - for example an Isolation Forest on per-host/per-domain
    DNS features such as unique-domain count, NXDOMAIN rate, average subdomain entropy, record-type mix,
    and periodicity score - as in Nadler et al., to identify hosts whose DNS behavior is inconsistent
    with peer baselines. Crucially, the alert text must surface the top-3 contributing features (e.g.,
    entropy, subdomain count, NXDOMAIN rate) so analysts can triage explainably. Supports Detect by catching
    novel or blended malicious DNS behavior that no single deterministic rule anticipated. A positive
    result is a host that sits far from the peer distribution across several DNS features; analysts should
    review the surfaced features to decide whether it reflects DGA, tunneling, or benign anomaly (e.g.,
    a misconfigured service).
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features per host = [unique_domains, nxdomain_rate, avg_subdomain_entropy,\n             \
      \       rectype_mix_vector, periodicity_score]\nmodel = IsolationForest().fit(peer_baseline_features)\n\
      for host in hosts:\n  s = model.score(features[host])\n  if s < anomaly_threshold:\n    top3 = top_contributing_features(model,\
      \ features[host], k=3)\n    alert(host, anomaly_score=s, drivers=top3)"
- question: When a character-level deep-learning classifier scores raw DNS query strings, which domains
    are predicted as DGA-generated and to which malware family are they attributed?
  context: Machine Learning. Deploy a contextless character-level classifier (LSTM or CNN) on raw query
    strings for DGA binary detection and family attribution following Woodbridge et al. (0.9993 AUC, ~90%
    detection at a 1:10000 false-positive rate). These models need no a-priori feature engineering and
    read the domain string directly. Validate generalization on real enterprise DNS rather than synthetic
    data alone, per Lambion et al., and retain the deterministic IOC/threshold floor in parallel so the
    ML model never becomes a single point of failure. Supports Detect by flagging algorithmically generated
    C2 domains and naming the likely malware family to accelerate response. A positive result is a high-confidence
    DGA prediction, ideally with a family label; corroborate with the lexical/statistical signals before
    action.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = load_char_lstm()   // trained per Woodbridge et al.\nfor each query d:\n  p_dga, family\
      \ = model.predict(raw_string(d))\n  if p_dga > 0.5:\n    alert(domain=d, p_dga=p_dga, family=family)\n\
      // keep deterministic IOC/threshold rules running in parallel"
- question: When interpretable tree-based classifiers score domains on lexical, TTL, prevalence, answer-diversity,
    and resolved-IP-overlap features, which domains are flagged as malicious or fast-flux, and what decision
    path explains each?
  context: 'Machine Learning. Train interpretable tree classifiers to prioritize analyst triage: a J48/decision-tree
    domain-risk model on lexical, TTL, prevalence, and answer-diversity features (EXPOSURE, Bilge et al.),
    and a C4.5 fast-flux classifier on resolved-IP-set overlap, IP/AS diversity, and growth rate (FluxBuster,
    Perdisci et al.). Expose the contributing decision-path features in the alert to satisfy explainability.
    Supports Detect by combining many weak DNS signals into a ranked, human-readable verdict an analyst
    can quickly validate. A positive result is a domain the model classifies as malicious or fast-flux
    along with the rule path (e.g., low TTL + high AS diversity + low prevalence); the transparent path
    lets the analyst confirm or dismiss the finding rather than trusting an opaque score.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Sysmon Event ID 22 (DNSQuery)
  - Threat intelligence and sinkhole feeds
  - 'NAI: Corporate DNS resolvers and forwarders'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "j48 = DecisionTree(features=[lexical, ttl_stats, prevalence, answer_diversity])\nc45 = DecisionTree(features=[ip_set_overlap,\
      \ ip_as_diversity, growth_rate])\nfor domain d:\n  verdict_mal, path_mal = j48.predict_with_path(d)\n\
      \  verdict_flux, path_flux = c45.predict_with_path(d)\n  if verdict_mal==\"malicious\" or verdict_flux==\"\
      fast-flux\":\n    alert(d, verdicts=[verdict_mal,verdict_flux], decision_path=path_mal+path_flux)"
