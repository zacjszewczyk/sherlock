name: 'D3-RAM: Routing Access Mediation'
id: 0a0f3593-3033-490d-87f1-d603436cf3bc
description: 'Investigate potential bypass or subversion of network routing and segmentation controls
  for the Routing Access Mediation defensive technique. This playbook helps an analyst hunt for evidence
  that an adversary has crossed network segment boundaries that segmentation policy forbids, manipulated
  routing infrastructure, or ridden permitted inter-segment paths to move laterally. It covers three lines
  of inquiry: (1) direct isolation-bypass detection using first-party Zeek/firewall logs to find forbidden
  inter-segment flows and anomalous inter-segment volume, frequency, and allow/block state; (2) unauthorized
  routing-control activity such as routing-protocol traffic from non-infrastructure hosts and route advertisements
  (route injection, rogue gateway, prefix hijack) that violate the authoritative routing configuration;
  and (3) authentication-borne lateral movement that rides allowed inter-segment paths, including structurally
  anomalous cross-segment logins, credential-switch paths, failed-logon bursts, and improbable movement
  paths. Detection methods span deterministic symbolic logic (deny-by-default allow-lists, beacon thresholds,
  authoritative-config validation), statistical methods (subspace residual analysis, entropy, Bayesian
  surprise, robust outlier scoring), and machine learning (community detection, GNN link prediction, autoencoder
  ensembles) so the analyst can confirm or rule out compromise of the network layer''s isolation guarantees.'
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there any network connections crossing between segments that the segmentation policy explicitly
    forbids, and which source/destination subnet pairs, 5-tuples, byte counts, and connection states are
    involved?
  context: 'Under a Zero Trust posture (NIST SP 800-207) inter-segment traffic should be deny-by-default:
    only source/destination subnet pairs explicitly permitted by segmentation policy are legitimate. Any
    Zeek conn.log record whose (orig_h subnet, resp_h subnet) pair is not on the allow-list is a direct
    isolation bypass and supports the Isolate tactic objective of confining critical assets. The analyst
    should compare observed flows against an authoritative allow-list derived from segmentation policy;
    a positive result (a forbidden pair) is strong evidence of mis-segmentation or an adversary tunneling
    between zones, and the matched 5-tuple, byte counts, and connection state help triage whether it was
    a successful transfer or a blocked probe.'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  load segmentation_allow_list  // set of permitted (src_subnet, dst_subnet) pairs\n \
      \ for rec in conn.log:\n      src_net = subnet_of(rec.orig_h); dst_net = subnet_of(rec.resp_h)\n\
      \      if (src_net, dst_net) not in segmentation_allow_list and src_net != dst_net:\n          alert(rec.orig_h,\
      \ rec.resp_h, rec.id.resp_p, rec.proto,\n                rec.orig_bytes, rec.resp_bytes, rec.conn_state)"
- question: Is any single host generating an unusually high rate of BLOCKED cross-segment connection attempts,
    or has a previously-denied source/destination pair suddenly started succeeding?
  context: 'Failure state is itself a signal. Firewall/ACL deny logs reveal segment reconnaissance: a
    host probing many destination subnets that policy blocks (e.g. >20 distinct denied dst subnets in
    5 minutes) is likely mapping the network ahead of movement. Conversely, a src/dst pair that was consistently
    denied and now succeeds may indicate a new permit rule or misconfiguration that weakens isolation.
    Both directly threaten the Isolate tactic. Thresholds should be tuned from a 30-day deny-log baseline;
    a positive result is either reconnaissance (many denies) or a control gap (a deny turning into an
    allow).'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  // segment reconnaissance via denied attempts\n  from firewall_deny_logs\n  bin 5m by\
      \ src_ip\n  count distinct dst_subnet as denied_subnets\n  where denied_subnets > 20 -> alert('segment\
      \ recon', src_ip)\n  // deny->allow transition\n  join prior_denied_pairs on (src_subnet,dst_subnet)\n\
      \  where action == 'ALLOW' and pair in prior_denied_pairs -> alert('deny->allow flip')"
- question: Is there periodic, low-jitter beaconing riding an allowed inter-segment path that could indicate
    command-and-control traffic using a permitted route?
  context: 'Adversaries hide C2 on routes that segmentation permits. Deterministic beacon analytics over
    Zeek conn.log catch this: a DFFT periodicity score, consistent payload size, high connection count,
    and low timing jitter together indicate automated beaconing rather than human activity. A concrete
    floor (e.g. >=24 connections/day with <10% interval variance) provides a defensible deterministic
    trigger. For the Isolate tactic this matters because the flow itself is policy-allowed, so only behavioral
    periodicity reveals the abuse. A positive result should report the period, count, and consistent byte
    size for the suspect inter-segment path.'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days; correlate around first-seen beacon onset
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for (src,dst,dport) group in conn.log where path is allowed inter-segment:\n      intervals\
      \ = diff(sorted(ts))\n      if count(intervals) >= 24 and stdev(intervals)/mean(intervals) < 0.10\n\
      \         and stdev(orig_bytes)/mean(orig_bytes) < 0.10:\n          period = mean(intervals)\n \
      \         alert('cross-segment beacon', src, dst, dport, period, count, mean(orig_bytes))"
- question: Does the volume of bytes or packets exchanged between any segment pair deviate from its normal
    low-rank traffic subspace, suggesting unauthorized bulk transfer across isolated segments?
  context: Network-wide traffic anomaly detection (Lakhina et al.) models the per-segment-pair byte/packet
    matrix and separates a normal low-rank subspace from an anomalous residual. When the residual energy
    (SPE / Q-statistic) exceeds a confidence limit, it captures a deviation such as bulk exfiltration
    or staging across segments that should be isolated. A deterministic floor (daily inter-segment bytes/connection
    count exceeding the 95th-99.9th percentile of a 30-day per-path baseline) backs the statistical detector.
    For the Isolate tactic this finds large unauthorized data movement even on otherwise-quiet boundaries;
    a positive result flags the offending segment pair and time window.
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  build matrix M[segment_pair, time_bin] = bytes (and packets)\n  decompose: M = normal_subspace\
      \ + residual   // PCA / low-rank\n  spe = ||residual||^2\n  if spe > Q_confidence_limit: alert(segment_pair,\
      \ time_bin, spe)\n  // deterministic floor\n  if daily_bytes(pair) > p99(30d_baseline(pair)): alert('volume\
      \ floor', pair)"
- question: Has the Shannon entropy of destination subnets or ports per source host risen sharply, indicating
    fan-out scanning or horizontal movement that barely changes traffic volume?
  context: 'Some lateral movement and scanning changes the distribution of destinations without large
    volume changes, so volume-based detectors miss it. Computing the Shannon entropy of destination subnets/ports
    per source host per time window (Lakhina et al., feature distributions) exposes fan-out: a host that
    suddenly touches many distinct destinations shows an entropy spike. For the Isolate tactic, a host
    fanning out across segments is a hallmark of reconnaissance or worm-like spread. Alert when entropy
    exceeds the host''s 30-day mean by more than 3 robust standard deviations; a positive result points
    to a scanning or pivoting host.'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for src in hosts, window W:\n      H = shannon_entropy(distribution of dst_subnet (and\
      \ dst_port) for src in W)\n      mu, rsd = robust_mean_std(H over 30d for src)\n      if H > mu\
      \ + 3*rsd: alert('dst entropy spike', src, H, mu)"
- question: Are there first-seen or abnormally frequent (source host -> destination segment) edges whose
    occurrence is statistically surprising under a calibrated prior?
  context: Bayesian surprise scoring (Heard et al.) models each (src host, dst segment) edge as a counting
    process with a conjugate prior, producing a calibrated p-value for how unexpected a new or unusually
    frequent cross-segment edge is. This gives false-positive control superior to fixed thresholds. For
    the Isolate tactic, a never-before-seen edge into an isolated segment, or one occurring far more often
    than expected, is suspicious. Alert on edges whose p-value < 0.001, including the first-seen timestamp
    and observed vs expected count so the analyst can judge novelty and intensity.
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for edge (src_host, dst_segment):\n      prior = Gamma(alpha, beta)        // conjugate\
      \ to Poisson counts\n      posterior_pred = NegBinom from updated prior\n      p = P(count >= observed\
      \ | posterior_pred)\n      if p < 0.001: alert(src_host, dst_segment, first_seen_ts, observed, expected)"
- question: Which hosts are statistical outliers in their inter-segment connection behavior when scored
    with robust (non-Gaussian) methods such as Median Absolute Deviation and cluster distance?
  context: Stealthy outliers can hide from mean/standard-deviation detectors. Over Host Communication
    Graphs derived from conn.log, robust scoring with Median Absolute Deviation and k-means cluster distance
    (Bohara et al.) flags hosts whose inter-segment connection metrics deviate without assuming a Gaussian
    distribution. For the Isolate tactic this surfaces hosts behaving unlike their peers in crossing segment
    boundaries. Alert on hosts beyond 3.5 MAD and list the contributing metrics (distinct dst segments,
    connection counts, bytes) so the analyst can see why the host stands out.
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  build per-host inter-segment metrics from conn.log (HCG)\n  for metric m: score = |x\
      \ - median(m)| / MAD(m)\n  also: dist = k_means_cluster_distance(host_vector)\n  if max(score) >\
      \ 3.5 or dist > cluster_threshold:\n      alert(host, contributing_metrics, scores)"
- question: Which hosts act as bridges between otherwise-isolated network communities when the host-to-host
    communication graph is decomposed into natural clusters?
  context: Louvain modularity community detection (Blondel et al.) recovers the natural community structure
    of the host-to-host communication graph. Nodes with strong edges into multiple otherwise-isolated
    communities stand out as pivot points or mis-segmented assets - exactly what undermines the Isolate
    tactic. A positive result is a host bridging communities that should be separate, which may be a deliberate
    pivot or a configuration error. Alert text must list the top-3 bridging edges (peer, community, weight)
    so the analyst can validate whether the bridge is sanctioned.
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days
  queries:
  - technology: Graph analytics/pseudocode
    query: ">-\n  G = build_graph(conn.log host-to-host, weight=connection_count)\n  communities = louvain(G)\n\
      \  for node in G:\n      ext = edges of node spanning >1 community\n      if strength(ext) high\
      \ across multiple communities:\n          alert(node, top3_bridging_edges(peer, community, weight))"
- question: Are there improbable host-to-host edges crossing segment boundaries that an unsupervised link-prediction
    model assigns very low probability to?
  context: An unsupervised GNN link-prediction baseline (CyberGraph, Bowman et al.; Euler temporal link
    prediction, King & Huang) learns who-normally-talks-to-whom, including time-of-day patterns, and flags
    low-probability host-to-host edges that cross segment boundaries. This complements deterministic deny-list
    rules by catching novel connections that are technically allowed or not yet enumerated. For the Isolate
    tactic, a low-probability cross-segment edge is a candidate pivot. Run in parallel with deny-list
    rules and surface the top-3 features driving the low edge probability for explainability.
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Last 90 days; use temporal windows to respect time-of-day
  queries:
  - technology: ML/pseudocode
    query: ">-\n  train temporal GNN link-prediction on historical conn.log edges\n  for new edge (h_i,\
      \ h_j) crossing segment boundary:\n      p = model.edge_probability(h_i, h_j, time)\n      if p\
      \ < low_threshold:\n          alert(h_i, h_j, p, top3_features)"
- question: Do online per-channel flow statistics at firewall/switch boundaries produce high autoencoder
    reconstruction error, indicating deviating inter-segment flows detectable at line rate without labels?
  context: Kitsune (Mirsky et al.) extracts damped per-channel statistics (bandwidth, packet rate, jitter
    over multiple time windows) at network NAIs and scores an ensemble of autoencoders by reconstruction
    error, flagging anomalous inter-segment flows in real time without requiring labels. For the Isolate
    tactic this provides line-rate detection of flows that deviate from learned normal behavior at the
    very boundaries meant to enforce isolation. A high reconstruction error indicates a flow unlike anything
    in training; emit the top-3 features with highest reconstruction error in the alert so the analyst
    understands the deviation.
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: Core network switches and firewall interfaces separating critical network segments (e.g., User
    VLANs, Server VLANs, DMZ).'
  range: Streaming / Last 90 days for baseline training
  queries:
  - technology: ML/pseudocode
    query: ">-\n  for packet stream at firewall/switch NAI:\n      feats = damped_stats(bandwidth, packet_rate,\
      \ jitter; windows=[100ms..1min])\n      rmse = autoencoder_ensemble.reconstruction_error(feats)\n\
      \      if rmse > anomaly_threshold:\n          alert(flow_5tuple, rmse, top3_error_features)"
- question: Is routing-protocol traffic (OSPF, BGP, RIP, EIGRP, HSRP/VRRP) being sourced from any host
    that is not on the authoritative network-infrastructure allow-list, indicating possible route injection
    or a rogue gateway?
  context: Routing protocols should only originate from known infrastructure devices. Inspecting Zeek
    conn.log/notice.log for OSPF (proto 89), BGP (tcp/179), RIP (udp/520), EIGRP, and HSRP/VRRP traffic
    sourced from an IP not on the authoritative infrastructure allow-list immediately reveals a host attempting
    to participate in routing - a classic route-injection or rogue-gateway attack (ARTEMIS, Sermpezis
    et al.). For the Isolate tactic, manipulating routing lets an adversary redirect or bridge traffic
    around segmentation. Maintain the infrastructure IP/neighbor list as ground truth; any non-listed
    source emitting routing traffic is a high-confidence alert.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Core routers and Layer-3 switches; routing-protocol adjacencies (OSPF/BGP/RIP) and the device
    routing/forwarding tables.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  routing_ports = {OSPF:proto89, BGP:tcp179, RIP:udp520, EIGRP:proto88, VRRP:proto112}\n\
      \  load infra_allow_list  // authoritative router/switch IPs\n  for rec in conn.log + notice.log:\n\
      \      if rec matches routing_ports and rec.orig_h not in infra_allow_list:\n          alert('unauthorized\
      \ routing protocol', rec.orig_h, rec.proto, rec.id.resp_p)"
- question: Do observed route advertisements announce prefixes from an unauthorized origin or via an unexpected
    path/neighbor when matched against the authoritative routing configuration?
  context: For each observed route advertisement, the announced prefix and its origin/neighbor should
    match a local ground-truth configuration of legitimate prefixes and origins (ARTEMIS, Sermpezis et
    al.). Any prefix announced from an unauthorized origin, or reaching via an unexpected path/neighbor,
    indicates prefix hijack or route manipulation. Newly-appearing more-specific prefixes that cover protected
    subnets are especially dangerous because longest-prefix-match will steer traffic to the attacker,
    defeating the Isolate tactic. Treat such more-specific announcements as high severity; a positive
    result is a prefix/origin mismatch against authoritative config.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Core routers and Layer-3 switches; routing-protocol adjacencies (OSPF/BGP/RIP) and the device
    routing/forwarding tables.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  load authoritative_routes  // {prefix -> {legit_origins, expected_neighbors}}\n  for\
      \ adv in observed_route_advertisements:\n      if adv.origin not in authoritative_routes[adv.prefix].legit_origins\n\
      \         or adv.neighbor not in expected_neighbors:\n          sev = 'high' if is_more_specific_of_protected(adv.prefix)\
      \ else 'medium'\n          alert('route origin/path violation', adv.prefix, adv.origin, sev)"
- question: Are there logins that violate learned permitted login structures - for example a workstation-segment
    account authenticating into a server segment it never normally reaches?
  context: Lateral movement can ride authentication over allowed paths, evading raw flow rules. Learning
    permitted login structures (source-segment, destination-segment, user role, time-of-day) from historical
    authentication logs and alerting on logins that violate these templates (Siadati & Memon) catches
    structurally anomalous access. For the Isolate tactic, an account crossing a segment boundary it has
    never historically reached is a strong lateral-movement signal even when the underlying network path
    is permitted. A positive result is a login whose (src-segment, dst-segment, role, time) combination
    is outside the learned norm.
  answer_sources:
  - Authentication Logs
  - Windows Security Event Logs
  - 'NAI: Domain controllers and segment-spanning servers; authentication/login events crossing segment
    boundaries.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  learn login_templates = frequent (src_segment, dst_segment, user_role, tod_bucket)\n\
      \  for evt in auth_logs (e.g. 4624):\n      key = (segment(evt.src), segment(evt.dst), role(evt.user),\
      \ tod(evt.time))\n      if key not in login_templates:\n          alert('structurally anomalous\
      \ login', evt.user, evt.src, evt.dst)"
- question: Are there login paths exhibiting a credential switch followed by access to a system that credential
    has never used before - the core lateral-movement signature?
  context: Hopper (Ho et al.) models login-path graphs and deterministically flags paths where a credential
    switch (one user logging in then operating as another) is followed by access to a system the switched-to
    credential has never used. This sequence is the defining signature of hands-on-keyboard lateral movement.
    For the Isolate tactic, such movement defeats segmentation by chaining authenticated hops across boundaries.
    Include the full path and the switching host in the alert so the analyst can reconstruct the movement
    chain; a positive result is a credential-switch-to-new-system path.
  answer_sources:
  - Authentication Logs
  - Windows Security Event Logs
  - 'NAI: Domain controllers and segment-spanning servers; authentication/login events crossing segment
    boundaries.'
  range: Last 90 days; correlate path hops within a session window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  build login_path_graph from auth_logs (logon/logoff, account used)\n  for path in graph:\n\
      \      if path contains credential_switch(u1 -> u2)\n         and next_access(u2) is system never\
      \ used by u2 before:\n          alert('credential-switch new-system path', path, switching_host)"
- question: Is any account or source segment producing bursts of failed cross-segment logons against multiple
    destination hosts, indicating credential spraying that often precedes lateral movement?
  context: Authentication failure is a distinct signal. Baselining per-account and per-source-segment
    failed-logon rates (e.g. Windows Event ID 4625) and alerting on bursts of failures against multiple
    destination-segment hosts (Hopper, Ho et al.) catches credential spraying or brute forcing that typically
    precedes movement. For the Isolate tactic, a spray crossing segment boundaries shows an adversary
    probing for footholds in protected zones. Derive the burst threshold from a 30-day baseline; a positive
    result is an account/source-segment exceeding its normal failure rate against many destinations.
  answer_sources:
  - Authentication Logs
  - Windows Security Event Logs
  - 'NAI: Domain controllers and segment-spanning servers; authentication/login events crossing segment
    boundaries.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  from windows_security 4625 (failed logon)\n  bin per (account, src_segment), window\
      \ 10m\n  count distinct dst_host as failed_targets, count(*) as fails\n  base = 30d_baseline(account,\
      \ src_segment)\n  if fails > base.mean + k*base.std or failed_targets > spray_threshold:\n     \
      \ alert('failed cross-segment logon burst', account, src_segment, failed_targets)"
- question: Which cross-segment authentication edges does a temporal link-prediction model assign low
    probability to, accounting for legitimate time-of-day behavior, that could indicate out-of-pattern
    lateral movement?
  context: Modeling the authentication graph with a GNN plus recurrent temporal link prediction (Euler,
    King & Huang) assigns low probability to out-of-pattern cross-segment authentication edges while respecting
    legitimate time-of-day behavior, and combines well with Hopper's probabilistic path scoring. For the
    Isolate tactic this surfaces stealthy movement that deterministic rules miss because the individual
    hop looks plausible. Run it in parallel with the deterministic rules and surface the top-3 contributing
    edges/features in the alert. A positive result is a low-probability cross-segment auth edge that warrants
    path reconstruction.
  answer_sources:
  - Authentication Logs
  - Windows Security Event Logs
  - 'NAI: Domain controllers and segment-spanning servers; authentication/login events crossing segment
    boundaries.'
  range: Last 90 days; temporal windows respecting time-of-day
  queries:
  - technology: ML/pseudocode
    query: ">-\n  train Euler (GNN + RNN) temporal link-prediction on auth graph\n  for cross-segment\
      \ auth edge (u, host, t):\n      p = model.edge_probability(u, host, t)\n      p_path = hopper_path_score(path_containing(edge))\n\
      \      if p < low_threshold or p_path < path_threshold:\n          alert('anomalous lateral movement\
      \ edge', u, host, top3_features)"
