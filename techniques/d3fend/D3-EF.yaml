name: 'D3-EF: Email Filtering'
id: dd9f02c7-a3ca-4bd5-a666-98ed78163833
description: Measure and investigate how effectively Email Filtering (D3-EF) controls isolate malicious
  messages before they reach user inboxes, and surface the gaps where threats slipped through. This playbook
  helps an analyst (1) correlate inbound sender infrastructure, embedded URLs, and attachments against
  threat intelligence and authentication standards (SPF/DKIM/DMARC) to find messages that should have
  been quarantined or rejected; (2) statistically baseline attachment rarity/entropy, authentication-failure
  rates, campaign volume surges, and click-through/link-failure rates to detect active phishing, spam,
  and BEC campaigns; and (3) apply machine-learning classifiers and sequence/graph models to score malicious-email
  likelihood, BEC/spearphishing body intent, URL maliciousness, and evolving campaigns with explainable,
  top-feature output. Throughout, every inbound message's gateway disposition (quarantined / rejected
  / delivered) is tracked as a first-class success/fail state so the analyst can quantify control efficacy
  and feed newly clustered indicators back into gateway filter updates. Primary data sources are Zeek
  smtp/files/http/dns logs, email gateway delivery, URL-rewrite/click, and DMARC aggregate reports.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which inbound messages originate from sender infrastructure (source IP, EHLO/HELO name, envelope-from
    or header-from domain, reply-path) that matches internal or external malicious-infrastructure threat
    intelligence, and what disposition (quarantined, rejected, or delivered) did the gateway assign to
    each match?
  context: 'Supporting the Isolate (D3-I) tactic, sender/domain reputation is the single most dominant
    deterministic signal for catching malicious mail. Extract sender IPs, EHLO/HELO names, envelope (RFC5321)
    and header (RFC5322) From domains, and reply-path artifacts from Zeek smtp.log and correlate them
    against curated malicious-infrastructure feeds, weighting senders whose authorized-IP set is violated
    under RFC 7208 SPF. For every direct match, record the gateway disposition state so the analyst can
    see whether filtering actually held: a match that was still delivered is a control gap demanding remediation,
    while a match that was quarantined/rejected confirms the control worked. A positive result is an inbound
    message from known-bad infrastructure; the disposition tells you whether the threat reached an inbox.
    References: [RFC 7208 SPF](https://www.rfc-editor.org/rfc/rfc7208); [Detecting Credential Spearphishing
    in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: &id001
  - Zeek smtp.log
  - Zeek files.log
  - Email Gateway delivery logs
  - 'NAI: Email Security Gateway and network ingress/egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from smtp_log (Zeek smtp.log)

      | eval indicators = [src_ip, helo, mailfrom_domain, header_from_domain, reply_to_domain]

      | lookup threat_intel_infra on indicators -> ti_match

      | eval spf_violation = (spf_result in ("fail","softfail"))

      | where ti_match == true OR spf_violation

      | eval disposition = gateway.disposition  // quarantined|rejected|delivered

      | where disposition == "delivered"  // gap: bad sender still reached inbox

      | table ts, src_ip, mailfrom_domain, header_from_domain, ti_match, spf_result, disposition'
- question: Which inbound messages carry attachments that violate filtering policy — disallowed executable/script
    MIME types, extension-versus-magic-byte mismatches, double extensions, or archive-to-executable chains
    — and were any of these messages delivered rather than isolated at ingress?
  context: 'Malware-bearing attachments remain a primary attacker delivery vector under the Isolate (D3-I)
    tactic. Inspect SMTP-sourced attachments in Zeek files.log for deterministic policy violations: disallowed
    executable/script MIME types, a declared extension that does not match the file''s magic bytes, double
    extensions (e.g., invoice.pdf.exe), and archives that unpack to executables. Count violations per
    message and flag any message that should have been quarantined or rejected at the gateway but was
    instead delivered. A positive finding is a message bearing a policy-violating attachment; cross-referencing
    the disposition reveals whether the filtering control isolated the threat or let it through to the
    recipient. References: [Who is Targeted by Email-Based Phishing and Malware?](https://research.google/pubs/who-is-targeted-by-email-based-phishing-and-malware-measuring-factors-that-differentiate-risk/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from files_log (Zeek files.log) where source == "SMTP"

      | eval bad_mime = mime_type in disallowed_exec_script_mimes

      | eval magic_mismatch = (declared_ext != magic_byte_type)

      | eval double_ext = regex(filename, "\\.[a-z]{2,4}\\.(exe|scr|js|vbs|hta|cmd|bat)$")

      | eval archive_to_exec = (is_archive AND contains_executable)

      | eval violations = bad_mime + magic_mismatch + double_ext + archive_to_exec

      | where violations > 0

      | join gateway_delivery on message_id

      | table message_id, filename, mime_type, declared_ext, violations, disposition'
- question: Which inbound messages carry attachments whose MIME type, byte-size, filename entropy, or
    per-message attachment count fall in the rare tail of the sending domain's own historical baseline
    (for example a MIME type seen in under 1% of that domain's history or a high-entropy outlier)?
  context: 'Under the Isolate (D3-I) tactic, per-sender structural and MIME baselining is an effective,
    content-agnostic way to catch evasive payloads that evade signature-based filtering. Build rolling
    per-sender-domain baselines of attachment MIME-type frequency, byte-size distribution, filename entropy,
    and attachment count per message. Flag messages whose attachments fall in rare type percentiles (e.g.,
    a MIME type appearing in fewer than 1% of that domain''s history) or in the high-entropy tail, which
    can indicate packed or encrypted payload delivery. Derive thresholds from each tenant''s own 30-90
    day history rather than fixed global values. A positive result is a structurally anomalous attachment
    from a sender that normally sends very different content - a strong lead for evasive malware delivery.
    References: [That Ain''t You / Reading Between the Lines](https://seclab.bu.edu/people/gianluca/papers/spearphishing-dimva2015.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from files_log (Zeek files.log) where source == "SMTP"

      | join smtp_log on fuid -> mailfrom_domain

      | stats count as type_count by mailfrom_domain, mime_type

      | eventstats sum(type_count) as domain_total by mailfrom_domain

      | eval mime_freq = type_count / domain_total

      | eval entropy = filename_shannon_entropy

      | eventstats perc99(entropy) as ent_hi, avg(file_size) as sz_mu, stdev(file_size) as sz_sd by mailfrom_domain

      | where mime_freq < 0.01 OR entropy > ent_hi OR abs(file_size - sz_mu) > 3*sz_sd

      | table mailfrom_domain, filename, mime_type, mime_freq, entropy, file_size'
- question: Are there statistically significant spikes in hourly inbound message volume grouped by sender
    TLD, ASN, or domain-age cohort (for example greater than 3 sigma or 5x the median for that hour-of-week)
    that indicate an active phishing or spam campaign?
  context: 'Targeted phishing and spam campaigns exhibit strong temporal clustering and burstiness, which
    supports the Isolate (D3-I) tactic by exposing coordinated delivery pressure. Model hourly inbound
    message volume by sender TLD, ASN, and domain-age cohort, then alert on statistically significant
    spikes - for example exceeding 3 standard deviations or 5x the median for the hour-of-week. Newly-registered
    or low-age domain cohorts surging in volume are especially suspicious. Derive thresholds from each
    tenant''s own 30-90 day volume history so the baseline reflects normal mail flow. A positive result
    is a sender cohort whose volume suddenly departs from its seasonal norm, indicating an active campaign
    worth correlating with attachment, URL, and authentication signals. References: [Who is Targeted by
    Email-Based Phishing and Malware?](https://research.google/pubs/who-is-targeted-by-email-based-phishing-and-malware-measuring-factors-that-differentiate-risk/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from smtp_log (Zeek smtp.log)

      | eval cohort = coalesce(sender_tld, sender_asn, domain_age_bucket)

      | bin _time span=1h

      | stats count as msgs by cohort, _time, hour_of_week

      | eventstats median(msgs) as med, avg(msgs) as mu, stdev(msgs) as sd by cohort, hour_of_week

      | eval z = (msgs - mu) / sd

      | where z > 3 OR msgs > 5*med

      | sort z desc'
- question: When a supervised classifier scores inbound messages using sender reputation, SMTP/header
    metadata, attachment traits, body stylometry, and campaign features, which messages score as likely-malicious,
    and what are the top-3 contributing features (e.g., never-before-seen From domain, executable in archive,
    urgency/wire-transfer language) for each?
  context: 'Supporting the Isolate (D3-I) tactic, a supervised classifier fuses many weak signals into
    a high-accuracy malicious-email score - stylometric/social features alone reach roughly 97.8% accuracy,
    and modular per-signal fusion adapts thresholds per organization. Train on sender reputation, SMTP/header
    metadata, attachment traits, body stylometry, and campaign features. Critically, the alert MUST surface
    the top-3 contributing features rather than only a bare score, so an analyst can triage why a message
    was flagged (for example ''never-before-seen From domain'', ''executable in archive'', ''urgency/wire-transfer
    language''). A positive result is a high-scoring message whose attributions point to concrete deception
    indicators; record the gateway disposition to confirm whether filtering isolated it. References: [Analyzing
    Social and Stylometric Features](https://arxiv.org/abs/1406.3692); [A Modular and Adaptive System
    for BEC Detection](https://arxiv.org/abs/2308.10776).'
  answer_sources: *id001
  range: Last 90 days (train on a longer clean-labeled baseline; score recent mail)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [sender_reputation, smtp_header_meta, attachment_traits, body_stylometry, campaign_feats]\n\
      X = build_vectors(inbound_messages, features)\nclf = load_or_train_supervised(labeled_mail)\nscores\
      \ = clf.predict_proba(X)\nfor m in where(scores > threshold):\n    emit_alert(message_id, score=scores[m],\n\
      \               top3=feature_attribution(clf, m, k=3),\n               disposition=gateway.disposition[m])"
- question: Do temporal or graph models over sender, recipient-set, subject-line, and URL evolution reveal
    coordinated campaign shifts (including lateral/internal phishing that passes authentication) that
    static rules miss, and which newly clustered indicators were blocked versus delivered?
  context: 'Under the Isolate (D3-I) tactic, sophisticated and lateral phishing campaigns shift their
    senders, subjects, and URLs over time to evade static rules; recipient-profile anomalies plus URL
    and language features detect lateral/internal campaigns that bypass authentication entirely. Apply
    temporal/graph models to the evolution of sender, recipient-set, subject-line, and URL features to
    identify coordinated campaign shifts. Feed newly clustered indicators back into gateway filter updates,
    and record which clusters were blocked versus delivered to quantify control efficacy. A positive result
    is a cluster of related messages evolving in a coordinated way - especially internal-to-internal mail
    that authenticated successfully but targets anomalous recipient profiles. References: [Detecting and
    Characterizing Lateral Phishing at Scale](https://www.usenix.org/conference/usenixsecurity19/presentation/ho).'
  answer_sources: *id001
  range: Last 90 days (model evolution over rolling windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph = build_campaign_graph(nodes=[sender, recipient_set, subject, url], edges=temporal_cooccur)\n\
      clusters = temporal_graph_cluster(graph, window=rolling)\nfor c in clusters:\n    if recipient_profile_anomaly(c)\
      \ OR coordinated_shift(c):\n        block_status = {b: gateway.disposition[b] for b in c.messages}\n\
      \        push_indicators_to_gateway(c.indicators)\n        emit_alert(cluster=c.id, blocked_vs_delivered=block_status)"
- question: Which inbound messages claim a DMARC-enforcing internal or partner domain in the visible RFC5322.From
    but fail DMARC identifier alignment with the SPF/DKIM-authenticated domain, and did the published
    policy (none/quarantine/reject) actually cause isolation?
  context: 'Email authentication is the deterministic floor for impersonation detection under the Isolate
    (D3-I) tactic and must never be removed in favor of ML - layer ML in parallel. For every inbound message,
    evaluate DMARC identifier alignment (RFC 7489) between the visible RFC5322.From domain and the SPF-authenticated
    (RFC 7208) or DKIM-authenticated (RFC 6376, signature and body-hash validity) domain. Deterministically
    flag any message that claims a DMARC-enforcing internal or partner domain yet fails alignment, and
    record whether the published policy (none/quarantine/reject) caused isolation. A positive result is
    a spoofed-domain message; if its domain publishes p=none, alignment failed but nothing was isolated
    - a direct control gap to escalate. References: [RFC 7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489);
    [RFC 7208 SPF](https://www.rfc-editor.org/rfc/rfc7208); [RFC 6376 DKIM](https://www.rfc-editor.org/rfc/rfc6376).'
  answer_sources: &id002
  - Zeek smtp.log
  - Email Gateway delivery logs
  - DMARC aggregate reports
  - 'NAI: Email Security Gateway and inbound MTA.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from smtp_log (Zeek smtp.log) join gateway_delivery on message_id

      | eval spf_pass = (spf_result == "pass")

      | eval dkim_pass = (dkim_result == "pass")

      | eval aligned = (header_from_domain == spf_domain AND spf_pass) OR (header_from_domain == dkim_d
      AND dkim_pass)

      | lookup enforcing_domains on header_from_domain -> dmarc_policy

      | where dmarc_policy in ("quarantine","reject","none") AND aligned == false

      | eval isolated = disposition in ("quarantined","rejected")

      | table message_id, header_from_domain, spf_result, dkim_result, dmarc_policy, isolated'
- question: Which inbound messages contain header-parsing evasions - multiple or ambiguous From headers,
    RFC5321 envelope versus RFC5322 header From mismatches, malformed addresses, or DKIM-bypass primitives
    - that defeat authentication verdicts even when those verdicts report pass?
  context: 'Authentication verdicts alone are insufficient under the Isolate (D3-I) tactic because providers
    still deliver spoofed mail that exploits parser inconsistencies. Re-parse and normalize raw headers
    to detect multiple/ambiguous From headers, envelope (RFC5321) versus header (RFC5322) From mismatches,
    malformed addresses, and DKIM-bypass primitives that defeat authentication (''Composition Kills''-style
    attacks). These evasions let an attacker pass one parser''s checks while a different parser shows
    the victim a forged sender. A positive result is a message whose header structure is ambiguous or
    inconsistent in a way that decouples the authenticated identity from the displayed identity - investigate
    even if SPF/DKIM/DMARC reported pass. References: [Composition Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun);
    [End-to-End Measurements of Email Spoofing Attacks](https://www.usenix.org/conference/usenixsecurity18/presentation/hu).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from raw_headers (Zeek smtp.log / gateway)

      | eval multi_from = count_header("From") > 1

      | eval env_hdr_mismatch = (envelope_from_domain != header_from_domain)

      | eval malformed = NOT rfc5322_valid(from_address)

      | eval dkim_bypass = has_dup_signed_headers OR header_injection_chars(from)

      | where multi_from OR env_hdr_mismatch OR malformed OR dkim_bypass

      | table message_id, envelope_from_domain, header_from_domain, multi_from, malformed, dkim_bypass'
- question: Which sender domains or source IPs show spikes in SPF fail/softfail, DKIM fail/missing, or
    DMARC fail rates against their established baseline - distinguishing spoofing pressure on normally-aligned
    domains from misconfiguration or compromise on partner domains?
  context: 'Per-domain authentication-failure rate is a distinct first-class signal under the Isolate
    (D3-I) tactic: weak or absent policies materially raise forgery risk. Track per-sender-domain and
    per-source-IP rates of SPF fail/softfail, DKIM fail/missing, and DMARC fail (frequency and success/fail
    state), establishing baselines from DMARC aggregate reports and gateway logs. Alert on two distinct
    conditions: a spike in failures for a normally-aligned domain (indicating spoofing pressure), and
    a newly elevated failure rate on a partner domain (indicating misconfiguration or compromise). A positive
    result is a statistically significant departure from a domain''s normal authentication pass rate -
    the interpretation depends on whether that domain is yours/trusted (spoofing) or external partner
    (config/compromise). References: [End-to-End Measurements of Email Spoofing Attacks](https://www.usenix.org/conference/usenixsecurity18/presentation/hu).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (smtp_log + dmarc_aggregate_reports)

      | eval fail = (spf_result in ("fail","softfail")) OR (dkim_result in ("fail","none")) OR (dmarc_result
      == "fail")

      | bin _time span=1d

      | stats sum(fail) as fails, count as total by sender_domain, src_ip, _time

      | eval fail_rate = fails / total

      | eventstats avg(fail_rate) as base_rate, stdev(fail_rate) as sd by sender_domain

      | where (fail_rate - base_rate) > 3*sd

      | eval interpretation = if(sender_domain in trusted_domains, "spoofing_pressure", "partner_misconfig_or_compromise")

      | table sender_domain, src_ip, fail_rate, base_rate, interpretation'
- question: Which inbound messages pair a known or trusted display name with a never-before-seen From
    address or sending domain, ranked by non-parametric Directed Anomaly Scoring to bound daily alert
    volume?
  context: 'Display-name impersonation - a trusted name attached to a new address - is a hallmark of credential
    spearphishing under the Isolate (D3-I) tactic. Rank messages where a known/trusted display name is
    paired with a never-before-seen From address or sending domain using non-parametric Directed Anomaly
    Scoring (DAS), which bounds the daily alert budget by surfacing only the most anomalous senders. Derive
    the per-sender ''seen-before'' baseline from 30-90 days of internal mail history so that a genuinely
    new pairing stands out. A positive result is a message where, for example, the CEO''s display name
    appears over an external or newly-registered address that has never been seen sending as that identity
    - a strong spearphishing lead. References: [Detecting Credential Spearphishing in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: *id002
  range: Last 90 days (baseline 'seen-before' from 30-90 days of internal mail history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from smtp_log (Zeek smtp.log)

      | lookup display_name_history on display_name -> known_addresses

      | eval novel = (from_address not in known_addresses) AND (display_name in trusted_display_names)

      | where novel

      | eval das_score = directed_anomaly_score(display_name, from_address, sender_domain)

      | sort das_score desc

      | head daily_alert_budget

      | table message_id, display_name, from_address, sender_domain, das_score'
- question: Which inbound message bodies an explainable model classifies as carrying fraudulent intent
    (payment/wire/urgency/credential lures), and what are the top-3 contributing phrases or features driving
    each classification?
  context: 'Business Email Compromise and spearphishing often pass authentication and carry no attachment,
    so body-text intent is the decisive signal under the Isolate (D3-I) tactic. Classify message body
    for fraudulent intent - payment/wire/urgency/credential lures - with an explainable model; LLM approaches
    reach roughly 99.7% accuracy while emitting a natural-language rationale naming the deception indicators,
    and LIME/SHAP-style attributions expose the driving tokens. The alert text MUST list the top-3 contributing
    phrases/features for triage rather than a bare score. A positive result is a body flagged for fraudulent
    intent with concrete phrases highlighted (e.g., ''urgent wire transfer'', ''update your credentials'',
    ''gift card request''), letting an analyst quickly confirm a BEC attempt. References: [ChatSpamDetector](https://arxiv.org/abs/2402.18093);
    [Novel Interpretable and Robust Web-based AI Platform for Phishing Email Detection](https://arxiv.org/abs/2405.11619).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load_explainable_bec_classifier()  // LLM or transformer + LIME/SHAP\nfor m in inbound_messages:\n\
      \    pred, rationale = model.classify_with_explanation(m.body)\n    if pred == \"fraudulent_intent\"\
      \ and pred.score > threshold:\n        emit_alert(message_id=m.id, intent=pred,\n              \
      \     top3_phrases=model.top_features(m, k=3),\n                   rationale=rationale)"
- question: Which inbound messages contain embedded URLs or domains (including rewritten click-tracking
    links) that match malicious-URL/domain feeds or newly-registered/lookalike-domain lists, and what
    disposition (blocked, rewritten, or delivered) did each receive?
  context: 'Embedded URLs are a primary phishing delivery mechanism, and URL reputation is a core discriminative
    feature for enterprise spearphishing under the Isolate (D3-I) tactic. Extract URLs and domains from
    message bodies and rewritten click-tracking links, correlate against malicious-URL/domain feeds and
    newly-registered/lookalike-domain lists, and record the disposition state (blocked/rewritten/delivered).
    A positive result is a message containing a known-bad or lookalike URL; the disposition reveals whether
    the gateway and URL-rewrite controls isolated the link or delivered it intact. Pair this with web-proxy
    and DNS telemetry to see if any recipient actually reached the malicious destination. References:
    [Detecting Credential Spearphishing in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: &id003
  - Zeek smtp.log
  - Zeek http.log
  - Zeek dns.log
  - Email Gateway URL-rewrite/click logs
  - 'NAI: Email Security Gateway, web proxy, and DNS resolver.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from smtp_log + gateway_url_rewrite_log

      | eval urls = extract_urls(body) ++ extract_urls(rewritten_links)

      | mvexpand urls | eval domain = url_to_domain(urls)

      | lookup threat_intel_urls on urls -> url_match

      | lookup newly_registered_lookalike on domain -> nrd_match

      | where url_match OR nrd_match

      | table message_id, urls, domain, url_match, nrd_match, disposition'
- question: When a character/word-level deep model scores never-before-seen embedded URLs, which URLs
    score as likely-malicious, and what are the top contributing URL tokens or substrings driving the
    score?
  context: 'Threat-intel lookups cannot cover never-before-seen URLs, so a lexical deep model layered
    underneath (not replacing) those lookups extends coverage under the Isolate (D3-I) tactic - a character/word-level
    model such as URLNet reaches AUC > 0.99 on ~7M URLs. Score embedded URLs that have no threat-intel
    hit using the lexical model, and surface the top contributing URL tokens/substrings (e.g., suspicious
    subdomains, brand keywords in the path, random-looking strings) in the alert text. A positive result
    is a high-scoring novel URL whose token attribution explains the suspicion, giving the analyst a concrete
    reason to detonate or block it. References: [URLNet](https://arxiv.org/abs/1802.03162).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "urlnet = load_lexical_url_model()  // char + word level, AUC>0.99\nfor u in embedded_urls\
      \ where u not in threat_intel:\n    score = urlnet.predict(u)\n    if score > threshold:\n     \
      \   emit_alert(url=u, score=score,\n                   top_tokens=urlnet.token_attribution(u))"
- question: For high-risk embedded links, does detonation and visual matching of the landing page logo/layout
    against a brand reference set reveal a brand-domain mismatch (a page impersonating a brand on a non-brand
    domain) with interpretable matched-logo evidence?
  context: 'Visual brand impersonation is how credential-phishing landing pages deceive users, so detonation
    plus visual verification closes a gap that static analysis misses under the Isolate (D3-I) tactic.
    For high-risk links, detonate the URL in a sandbox and visually match the landing page logo/layout
    against a brand reference set (Phishpedia-style), flagging brand-domain mismatches with interpretable
    matched-logo evidence. A positive result is a page that displays a known brand''s logo/layout while
    hosted on a domain that does not belong to that brand - high-fidelity evidence of a phishing landing
    page. The matched-logo evidence lets an analyst confirm the brand being impersonated and prioritize
    takedown and gateway blocking. References: [Phishpedia](https://www.usenix.org/conference/usenixsecurity21/presentation/lin).'
  answer_sources: *id003
  range: Last 90 days (detonate high-risk links on detection; correlate event-centered)
  queries:
  - technology: SIEM/ML pseudocode
    query: "for u in high_risk_links:\n    page = detonate(u)  // sandboxed render\n    logo, layout =\
      \ visual_features(page.screenshot)\n    brand, conf = brand_match(logo, layout, brand_reference_set)\n\
      \    if brand and url_to_domain(u) not in brand.legit_domains:\n        emit_alert(url=u, impersonated_brand=brand,\n\
      \                   evidence=matched_logo_bbox, confidence=conf)"
- question: Per campaign or sender, what are the recipient click-through rates to embedded links and the
    rates of NXDOMAIN, 404, TLS errors, and proxy-blocked connections - and does a burst of clicks to
    a newly-seen domain or a cluster of dead/blocked links indicate an active phishing campaign that filtering
    and web controls did or did not isolate?
  context: 'Click-through and link-failure rates are distinct measurement signals under the Isolate (D3-I)
    tactic that quantify both threat activity and control efficacy. Join gateway click logs with Zeek
    http.log and dns.log to measure, per campaign/sender, recipient click-through frequency and the rate
    of NXDOMAIN, 404, TLS errors, and proxy-blocked connections to embedded links (failure-mode awareness).
    A burst of clicks to a newly-seen domain indicates an active campaign with real user engagement, while
    a cluster of dead/blocked links to the same sender shows web controls isolating the threat. A positive
    result is a campaign with rising clicks to a fresh domain (urgent - users are reaching attacker infrastructure)
    or a high block/dead-link rate (the control is working but the campaign is live). References: [Detecting
    Credential Spearphishing in Enterprise Settings](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
  answer_sources: *id003
  range: Last 90 days (correlate click events with proxy/DNS within campaign window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from gateway_click_log

      | join http_log (Zeek) and dns_log (Zeek) on clicked_url/domain

      | eval failed = http_status==404 OR dns_rcode=="NXDOMAIN" OR tls_error OR proxy_blocked

      | stats count as clicks, sum(failed) as fails, dc(recipient) as clickers by campaign, sender, dest_domain

      | eval click_rate = clickers / campaign_recipients

      | eval fail_rate = fails / clicks

      | eventstats min(domain_first_seen) as dom_age by dest_domain

      | where (click_rate high AND dom_age < 7d) OR fail_rate > 0.5

      | table campaign, sender, dest_domain, clicks, click_rate, fail_rate, dom_age'
