name: 'D3-PLM: Physical Link Mapping'
id: 6fd98143-3ae2-4f07-aca8-aaed90356dbf
description: 'This playbook helps an analyst build and continuously validate the physical link topology
  of the network using discovery-protocol telemetry (LLDP/CDP/FDP) and learned MAC/FDB tables, modeled
  as the canonical PTOPO-MIB connection tuple (localChassisId/localPortId <-> remChassisId/remPortId).
  It supports the Model tactic by establishing a daily ground-truth device-to-device and port-to-port
  adjacency map and then detecting deviations from it: missing expected links (severed/removed), newly
  introduced or explicitly forbidden adjacencies, rogue or relayed (fabricated) links from forged/spoofed
  LLDP advertisements, and unstable topology churn. Detection methods range from symbolic-logic allowlist
  comparison, TopoGuard-style integrity rules, Sigma rules over switch/router syslog and unauthorized-device
  protocol signatures (e.g., Cisco Smart Install on TCP 4786), through statistical link-stability/flap
  scoring, change-point detection and forecasting of topology deltas, and adjacency-latency tests for
  relayed links, to machine-learning graph link-prediction and community/segmentation outlier detection.
  The goal is to surface unauthorized physical modifications, topology poisoning, and misconfiguration
  that deviate from the approved physical design.'
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Can you parse LLDP/CDP discovery telemetry and SNMP LLDP/CDP neighbor and MAC/FDB tables to
    build a canonical PTOPO-MIB-style physical edge list (localChassisId/localPortId <-> remChassisId/remPortId),
    and persist it as a daily observed physical-link map keyed by device identity?
  context: 'This is the foundational mapping step for the Model tactic: before any deviation can be detected,
    the analyst must reconstruct the true physical topology from discovery-protocol telemetry. By parsing
    Zeek lldp.log and SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable) and correlating with learned
    MAC/FDB forwarding tables, each observed device-to-device and port-to-port adjacency is normalized
    into the canonical PTOPO-MIB connection tuple and persisted as a daily snapshot. This daily observed
    map is the baseline that every subsequent question compares against. A complete, stable edge list
    means the physical layer is fully observed; gaps or unresolved chassis/port identities indicate either
    incomplete sensor coverage or devices that are evading discovery and warrant follow-up.'
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_lldp, snmp_lldp_cdp_neighbors, mac_fdb_tables

      | EXTRACT local_chassis_id, local_port_id, rem_chassis_id, rem_port_id

      | NORMALIZE edge = (local_chassis_id:local_port_id) <-> (rem_chassis_id:rem_port_id)

      | DEDUP edge BY day

      | PERSIST observed_physical_map[today] = SET(edge)

      | OUTPUT daily edge list keyed by device identity'
- question: Do any observed LLDP/CDP neighbor pairs represent first-seen or explicitly forbidden device/port
    adjacencies when compared against the approved-topology allowlist, and are PTOPO-MIB topology-change
    traps corroborating those changes?
  context: Within the Model tactic, an approved-topology allowlist defines which physical adjacencies
    are sanctioned. Comparing each observed LLDP/CDP neighbor pair against that allowlist surfaces edges
    that are first-seen (not previously approved) or that match an explicit deny rule. PTOPO-MIB topology-change
    traps are consumed as a corroborating signal that the device itself detected a connectivity change
    at roughly the same time. A positive finding -- a new switch-to-switch link, an unexpected device
    plugged into a core/distribution port, or a forbidden adjacency -- indicates a possible unauthorized
    physical modification and should trigger physical verification. A negative result confirms the observed
    adjacencies remain within the approved design.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM observed_physical_map\n| JOIN approved_topology_allowlist ON edge\n| WHERE edge NOT IN\
      \ approved_topology_allowlist\n   OR edge IN forbidden_adjacency_list\n| ENRICH WITH ptopo_mib_topology_change_traps\
      \ NEAR event_time\n| ALERT 'First-seen or forbidden physical adjacency'"
- question: Are there discovery frames whose claimed origin is a host-facing/access port, port device-type
    changes (HOST<->SWITCH) that occurred without a preceding Port-Down then Port-Up sequence, or advertisements
    that fail integrity checks -- any of which would indicate phantom inter-switch links from forged or
    relayed LLDP?
  context: TopoGuard-style hard rules protect the integrity of the topology baseline in the Model tactic.
    An adversary poisoning network visibility injects or relays LLDP/CDP frames to fabricate inter-switch
    links. The rules drop or flag discovery frames whose claimed origin is a host-facing/access port (switches
    should not appear on access ports), require an observed Port-Down then Port-Up sequence before any
    port is allowed to change device type (HOST<->SWITCH), and verify advertisement integrity. A positive
    result -- a switch advertisement on an access port, a device-type flip with no physical port-cycle,
    or an integrity failure -- strongly indicates LLDP spoofing/relay and a phantom link. A negative result
    means observed link changes are physically consistent and trustworthy.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_lldp, switch_port_events\n| FOR EACH discovery_frame:\n    FLAG IF claimed_origin_port\
      \ IN host_facing_access_ports\n    FLAG IF device_type_change(HOST<->SWITCH) AND NO preceding (PortDown->PortUp)\n\
      \    FLAG IF advertisement_integrity_check == FAIL\n| ALERT 'Fabricated/relayed LLDP advertisement\
      \ (phantom link)'"
- question: Is any baselined physical edge absent from the current observed map (a removed or severed
    link), and are there stale PTOPO RowStatus entries, repeated port up/down flaps, or gaps in the expected
    LLDP advertisement cadence that should be treated as distinct discovery failure modes rather than
    benign silence?
  context: Silence on a link is not the same as a healthy link, so in the Model tactic missing edges must
    be detected as positively as new edges. Any edge present in the baselined observed map but absent
    from the current map is flagged as link removed/severed. Separately, stale PTOPO RowStatus, repeated
    port up/down flaps, and gaps in expected LLDP advertisement cadence are each treated as distinct failure-mode
    signals. A positive finding could indicate a cable pulled for a tap insertion, a downed uplink, or
    a device that has stopped advertising to evade mapping; correlating which failure mode appears helps
    triage between maintenance, fault, and tampering. A negative result confirms all expected links are
    present and advertising on cadence.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM observed_physical_map[today], baseline_physical_map

      | missing = baseline_physical_map - observed_physical_map[today]

      | ALERT missing AS ''Baselined link absent (removed/severed)''

      | ALSO FLAG ptopo_rowstatus == stale

      | ALSO FLAG port_up_down_flaps repeated WITHIN window

      | ALSO FLAG lldp_advertisement_gap > expected_cadence'
- question: Do switch/router syslog and config-change events (port-state changes, LLDP/CDP toggles, image/boot/config
    writes) match Sigma rules for unauthorized activity, and are there unauthorized-device protocol signatures
    such as Cisco Smart Install/SMI on TCP 4786 or rogue SNMP/TFTP that often accompany illicit topology
    manipulation?
  context: Topology tampering is frequently preceded or accompanied by device-management activity. In
    the Model tactic the analyst applies portable Sigma rules to switch/router syslog and config-change
    events -- port-state changes, LLDP/CDP enable/disable toggles, and image/boot/config writes -- and
    watches for protocol signatures of unauthorized device control. Cisco Smart Install (SMI) on TCP 4786
    and rogue SNMP/TFTP are well-documented (CISA TA18-106A) indicators of state-sponsored actors targeting
    network infrastructure. A positive finding -- an unexpected config write, an LLDP/CDP toggle on a
    core link, or SMI/TFTP traffic to a switch -- ties a topology change to a concrete administrative
    or attacker action and is high-fidelity. A negative result means no suspicious management-plane activity
    coincides with observed topology changes.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM switch_router_syslog, config_change_events, zeek_conn

      | APPLY sigma_rules(port_state_change, lldp_cdp_toggle, image_boot_config_write)

      | FLAG conn WHERE dest_port == 4786  // Cisco Smart Install/SMI

      | FLAG rogue snmp/tftp to network_devices

      | CORRELATE WITH observed topology_change NEAR event_time

      | ALERT ''Unauthorized device/config activity near topology change'''
- question: Which physical links fall in the low-percentile stability band or high-percentile churn band
    based on per-link stability scores, flap rates (flaps/min), advertisement-gap counts, and up/down
    state ratios computed over rolling 30-day windows, with percentile cutoffs derived per-fabric from
    maintenance history?
  context: Some unauthorized physical modifications manifest not as a single event but as persistent instability.
    In the Model tactic the analyst computes, over rolling 30-day windows, per-link stability scores,
    flap rates (Frequency, flaps/min), advertisement-gap counts, and up/down State ratios, then flags
    links in the low-percentile stability or high-percentile churn bands. Critically, the percentile cutoffs
    are derived per-fabric from each fabric's own maintenance-window history so that normally noisy lab/edge
    fabrics are not over-alerted and stable core links are held to a tighter bar. A positive finding --
    a normally rock-stable core uplink suddenly in the top churn percentile -- points to a loose tap,
    failing cable, or repeated unauthorized reconnection. A negative result means link behavior is within
    each fabric's normal stability envelope.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM port_up_down_events, lldp_advertisements

      | WINDOW rolling 30d PER link

      | COMPUTE flap_rate = flaps/min, adv_gap_count, up_down_state_ratio, stability_score

      | cutoffs = PERCENTILE bands PER fabric FROM maintenance_window_history

      | FLAG link WHERE stability_score < low_pct OR churn > high_pct

      | ALERT ''Abnormal link stability/churn'''
- question: Do CUSUM, Bayesian online change-point, or PELT detectors over per-device neighbor counts,
    flap rates, and LLDP cadence reveal abrupt regime shifts marking topology tampering, and do daily
    added/removed-link totals exceed ARIMA/Prophet prediction intervals tuned to expected maintenance
    activity?
  context: Gradual baselining can miss a sudden structural change, so in the Model tactic the analyst
    runs change-point detectors (CUSUM, Bayesian online change-point, PELT) over per-device neighbor counts,
    flap rates, and LLDP cadence to catch abrupt regime shifts -- the statistical fingerprint of a topology
    being reshaped. In parallel, daily added/removed-link totals (Volume) are forecast with ARIMA/Prophet,
    and alerts fire when the actual topology delta exceeds the prediction interval, which is tuned to
    expected maintenance activity. A positive finding -- a device whose neighbor count jumps to a new
    regime, or a day with far more link changes than forecast -- indicates coordinated topology modification
    beyond routine churn. A negative result means topology metrics remain within their established regimes
    and forecast bounds.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM per_device_neighbor_counts, flap_rates, lldp_cadence

      | RUN CUSUM / BOCPD / PELT PER device metric

      | FLAG abrupt regime_shift AS topology_tampering_candidate

      | FORECAST daily_added_removed_links WITH ARIMA/Prophet (tuned to maintenance)

      | ALERT WHEN |observed_delta| > prediction_interval'
- question: Do any adjacencies exhibit control/probe round-trip latency above a learned high percentile
    of their per-link baseline, consistent with relayed or fabricated links that insert extra hops between
    what should be a direct port-to-port connection?
  context: 'A genuine physical port-to-port link has very low, stable round-trip latency; a relayed or
    fabricated link inserts an extra device/hop and therefore exhibits abnormally high latency. In the
    Model tactic the analyst baselines per-link control/probe RTT and flags adjacencies whose RTT exceeds
    a learned high percentile of their own history. This is a powerful corroborator for suspected LLDP
    spoofing/relay: a link that appears valid by name but is physically a relay will betray itself through
    latency. A positive finding -- an adjacency whose RTT sits well above its baseline percentile -- suggests
    an inserted hop/tap or a software-relayed phantom link. A negative result means measured latencies
    are consistent with direct physical connectivity.'
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM control_probe_rtt PER adjacency

      | BASELINE rtt_distribution PER link OVER history

      | FLAG adjacency WHERE current_rtt > learned_high_percentile(rtt)

      | ALERT ''Abnormal adjacency latency (possible relayed/fabricated link)'''
- question: When node embeddings / link-prediction are learned over the LLDP-derived topology graph (with
    temporal and inductive variants), which newly observed edges score as improbable, and does the alert
    surface the top-3 contributing features (endpoint pair, port-type mismatch, latency percentile) so
    legitimately new switches are not flagged?
  context: Not every new link is malicious -- legitimate growth adds switches and ports -- so in the Model
    tactic the analyst uses graph machine learning to distinguish plausible new edges from genuinely improbable
    ones. Node embeddings and link-prediction (CyberGraph, with temporal/inductive variants such as Euler
    and Jbeil) are learned over the LLDP-derived topology graph, and each newly observed edge is scored
    by its probability under the learned model. Inductive/temporal handling ensures freshly added but
    structurally consistent switches/ports are not penalized, while structurally improbable adjacencies
    score low. To keep findings actionable and explainable, alert text surfaces the top-3 contributing
    features (endpoint pair, port-type mismatch, latency percentile). A positive finding is a low-probability
    edge an analyst can quickly adjudicate from the surfaced features; a negative result means new edges
    are consistent with learned topology structure.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'TRAIN link_prediction(node_embeddings) ON lldp_topology_graph (temporal/inductive: Euler,
      Jbeil)

      | FOR EACH new_edge: score = P(edge | model)

      | FLAG edge WHERE score < improbability_threshold

      | EXPLAIN top3_features = [endpoint_pair, port_type_mismatch, latency_percentile]

      | ALERT ''Improbable physical link'' WITH top3_features'
- question: Does graph community detection and self-supervised/heterogeneous node-embedding outlier detection
    over the LLDP-derived topology reveal links or nodes that violate learned physical segmentation structure
    or bridge communities that should remain separate, with the offending node/edge localized for explainable
    triage?
  context: Physical segmentation (zones that should never be directly bridged) is a security control whose
    violation can be subtle. In the Model tactic the analyst applies graph community detection and self-supervised/heterogeneous
    node-embedding outlier detection (Hercule, MAGIC, Log2vec techniques) to the LLDP-derived topology
    to learn the expected physical zones, then highlights links or nodes that violate that learned segmentation
    or bridge communities that should stay isolated. The method localizes the specific offending node/edge
    so triage is explainable rather than a vague anomaly score. A positive finding -- a new link that
    bridges two previously separate communities (e.g., an OT zone now connected to corporate) -- is a
    high-severity segmentation breach warranting immediate investigation. A negative result means the
    topology continues to respect learned segmentation boundaries.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - SNMP LLDP/CDP neighbor tables (PTOPO-MIB / lldpRemTable)
  - Switch/router syslog (port up/down, config change)
  - MAC/FDB tables
  - 'NAI: Core network switches, Distribution and access layer switches, Data center network fabric'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'BUILD graph FROM lldp_topology

      | RUN community_detection + self_supervised/heterogeneous node_embedding outlier_detection

      | LEARN expected_physical_zones

      | FLAG node/edge violating segmentation OR bridging separate communities

      | LOCALIZE offending node/edge FOR triage

      | ALERT ''Physical segmentation violation'''
