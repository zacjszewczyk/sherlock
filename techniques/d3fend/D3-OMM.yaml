name: 'D3-OMM: Operating Mode Monitoring'
id: 3070c467-cabd-45c3-b776-4c7516542cfd
description: Investigate operating-mode changes on ICS/OT controllers (PLCs and Safety Instrumented Systems)
  to distinguish authorized engineering and maintenance activity from unauthorized or malicious manipulation.
  This playbook helps an analyst detect and baseline transitions between device operating modes (Run,
  Program, Remote, Stop) by correlating ICS protocol commands seen on the wire (Modbus, S7comm, EtherNet/IP-CIP)
  in Zeek logs with controller key-switch/diagnostic status blocks and host-based activity on Engineering
  Workstations (EWS) and Human-Machine Interfaces (HMI). It combines deterministic symbolic-logic rules
  (allow-listing engineering sources, alarming non-RUN key-switch states, flagging Stop and program-download
  commands, and correlating network mode changes with EWS logon/process activity), robust statistical
  methods (per-device behavioral baselines, failed/rejected control-attempt profiling, and scan-cycle
  timing fingerprints), and machine-learning models (time-series anomaly detection on state sequences
  and explainable command-anomaly classification) to surface unauthorized reprogramming such as the TRITON
  SIS attack. The ML and statistical methods run in parallel with the deterministic key-switch and protocol
  rules, never replacing them.
type: technique
