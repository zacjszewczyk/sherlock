questions:
- question: Were any ICS protocol commands that alter a controller's operating mode (Modbus diagnostic/control
    register writes, S7comm STOP or PLC-download, EtherNet/IP-CIP forward-open program services) sent
    outside an approved maintenance window or from a host that is not on the engineering allow-list?
  context: 'This is the foundational deterministic detection for unauthorized mode changes. Inspect Zeek
    modbus.log, s7comm.log, and conn.log for protocol commands that change device operating state, then
    correlate each command against a master schedule of authorized maintenance windows and an allow-list
    of legitimate engineering source hosts. Generate a high-priority alert for any mode-change command
    that falls outside an approved window or originates from a non-engineering source. NIST SP 800-82r3
    recommends allow-listing engineering commands and segmenting EWS-to-PLC paths; in the TRITON attack,
    controllers left out of the RUN position enabled SIS reprogramming. A positive result names the offending
    command, source host, and target controller; a negative result confirms all observed mode changes
    were scheduled and from authorized engineering stations. (Method: Symbolic Logic; tactic: Detect.)
    Sources: [Guide to OT Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    [TRITON Malware Remains Threat to Critical Infrastructure ICS](https://www.ic3.gov/CSA/2022/220325.pdf)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Firewall deny logs
  - PLC diagnostic/key-switch status block
  - 'NAI: The OT network segment, specifically traffic between Engineering Workstations (EWS) / Human-Machine
    Interfaces (HMI) and Programmable Logic Controllers (PLCs). The EWS and HMI endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "MODE_CMDS = {modbus.write_register(diag/control), s7comm.STOP, s7comm.plc_download, cip.forward_open(program_service)}\n\
      FOR cmd IN (modbus.log, s7comm.log, conn.log) WHERE cmd.type IN MODE_CMDS:\n    in_window = cmd.ts\
      \ WITHIN maintenance_schedule[cmd.dst]\n    authorized_src = cmd.src IN engineering_allowlist\n\
      \    IF NOT in_window OR NOT authorized_src:\n        ALERT(priority=high, cmd.type, cmd.src, cmd.dst,\
      \ cmd.ts)"
- question: Has any controller that exposes its key-switch/mode position via a diagnostic function block
    reported a state other than RUN (Program, Remote, or Stop), particularly outside a scheduled maintenance
    window?
  context: 'Where a controller exposes its key-switch or mode position through a diagnostic function block,
    poll that value on a fixed interval and alarm any state other than RUN. PROGRAM or REMOTE outside
    a scheduled maintenance window should be treated as high severity because it is the direct precondition
    for unauthorized logic downloads. This provides an authoritative, device-sourced ground truth that
    complements network-based detection: even if an attacker manipulates the controller without generating
    recognizable protocol traffic, the diagnostic block reveals the resulting state. A positive result
    identifies the controller and the non-RUN state with its timestamp; a negative result confirms all
    polled controllers are in RUN or are in a non-RUN state explained by an approved maintenance window.
    (Method: Symbolic Logic; tactic: Detect.) Sources: [Value of PLC Key Switch Monitoring](https://www.dragos.com/blog/industry-news/value-of-plc-key-switch-monitoring/)
    [TRITON Malware Remains Threat to Critical Infrastructure ICS](https://www.ic3.gov/CSA/2022/220325.pdf)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Firewall deny logs
  - PLC diagnostic/key-switch status block
  - 'NAI: The OT network segment, specifically traffic between Engineering Workstations (EWS) / Human-Machine
    Interfaces (HMI) and Programmable Logic Controllers (PLCs). The EWS and HMI endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each poll_sample IN plc_keyswitch_status_block (interval=fixed):\n    IF poll_sample.mode\
      \ != \"RUN\":\n        sev = (poll_sample.mode IN (\"PROGRAM\",\"REMOTE\")\n               AND poll_sample.ts\
      \ NOT WITHIN maintenance_schedule[poll_sample.device])\n              ? \"high\" : \"medium\"\n\
      \        ALARM(device=poll_sample.device, mode=poll_sample.mode, severity=sev, ts=poll_sample.ts)"
- question: Were any explicit 'Stop' or program-download/transfer commands sent to a PLC or SIS from a
    source that is not a known safety system or authorized engineering station, and do any observed state
    transitions violate the controller's set of legal states?
  context: 'Stop and program-download/transfer commands can halt or alter the physical process and are
    the hallmark of destructive ICS attacks. Inspect Zeek modbus.log (and S7comm/CIP logs) for these commands
    and alert immediately when the source is not a known safety system or authorized engineering station.
    A specification or formal-verification runtime monitor can further assert the legal set of device
    states and transitions and flag illegal downloads or impossible transitions. This matters because
    a Stop issued to a controller running a critical process, or a logic download outside change control,
    can cause downtime, equipment damage, or safety failure as seen with TRITON. A positive result names
    the command, source, and target SIS/PLC; a negative result confirms no unauthorized Stop or download
    occurred. (Method: Symbolic Logic; tactic: Detect.) Sources: [SoK Attacks on Industrial Control Logic
    and Formal Verification-Based Defenses](https://arxiv.org/abs/2006.04806)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Firewall deny logs
  - PLC diagnostic/key-switch status block
  - 'NAI: The OT network segment, specifically traffic between Engineering Workstations (EWS) / Human-Machine
    Interfaces (HMI) and Programmable Logic Controllers (PLCs). The EWS and HMI endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR cmd IN (modbus.log, s7comm.log, cip.log) WHERE cmd.type IN {STOP, program_download, program_transfer}:\n\
      \    IF cmd.src NOT IN (known_safety_systems UNION engineering_allowlist):\n        ALERT(priority=critical,\
      \ cmd.type, cmd.src, cmd.dst)\n# runtime spec monitor\nIF transition(prev_state[device] -> new_state[device])\
      \ NOT IN legal_transitions:\n    ALERT(illegal_transition, device, prev_state, new_state)"
- question: When a PLC mode change is observed on the network, is there a corresponding interactive logon
    (Windows Event ID 4624) and engineering-software process execution (Event ID 4688) on the designated
    Engineering Workstation within a short correlation window?
  context: 'A legitimate mode change is normally driven by an engineer at the designated EWS, producing
    an interactive logon and the execution of engineering software. Trigger an investigation when a PLC
    mode change appears on the network but no matching 4624 logon or 4688 engineering-process execution
    is seen on the expected EWS within a short correlation window (for example, a few minutes). The absence
    indicates a rogue device, a direct implant on the controller, or a spoofed source. Validate source
    authenticity with passive device and timing fingerprints to distinguish a legitimate EWS/PLC from
    a spoofed device. A positive result is a mode change with no human-attributable EWS activity; a negative
    result ties the change to a genuine engineering session. (Method: Symbolic Logic; tactic: Detect.)
    Sources: [Who''s in Control of Your Control System Device Fingerprinting for CPS](https://www.ndss-symposium.org/wp-content/uploads/2017/09/who-control-your-control-system-device-fingerprinting-cyber-physical-systems.pdf)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Firewall deny logs
  - PLC diagnostic/key-switch status block
  - 'NAI: The OT network segment, specifically traffic between Engineering Workstations (EWS) / Human-Machine
    Interfaces (HMI) and Programmable Logic Controllers (PLCs). The EWS and HMI endpoints themselves.'
  range: 'Last 90 days; event-centered: correlate host events within +/- 5 minutes of the network mode-change
    command.'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "net_changes = Zeek mode_change commands (modbus/s7comm/cip)\nhost_acts = windows WHERE EventID\
      \ IN (4624 interactive, 4688 engineering_sw)\nFOR mc IN net_changes:\n    match = host_acts WHERE\
      \ host=designated_ews[mc.dst]\n                       AND ts BETWEEN mc.ts-5m AND mc.ts+5m\n   \
      \ IF match IS EMPTY:\n        ALERT(rogue_or_implant, mc.dst, mc.src, mc.ts)\n        verify(device_fingerprint(mc.src))"
- question: For each OT device, does the daily count, frequency, source IP, user account, or hour-of-day
    of mode-change events deviate from its established steady-state baseline (e.g., exceeding the 99th
    percentile, a first-seen source/user, or more than 3 mode changes per minute)?
  context: 'OT command behavior is far more stationary than IT traffic, so tight per-device baselines
    are achievable and powerful. For each controller, baseline mode-change events by Volume (bytes written
    during program downloads), Frequency (mode-change commands per minute and per day), source IP, user
    account, and hour-of-day, using at least 30 days of steady-state operation. Alert when the daily count
    exceeds the 99th percentile of the per-device baseline, when a first-seen source or user appears,
    or on a frequency spike such as more than 3 mode changes per minute. This catches subtle abuse that
    individually-permitted commands would not trip. A positive result identifies the device and the over-baseline
    dimension; a negative result confirms activity is within normal envelopes. (Method: Statistical Method;
    tactic: Detect.) Sources: [Guide to OT Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
