  queries:
  - technology: ML/pseudocode
    query: "features = [function_code, target_register_coil, source_host, inter_arrival_time, payload_size]\n\
      features += physical_process_measurements  # sensor/actuator readings\nmodel = RandomForest_or_SVM.fit(labeled_ics_commands)\n\
      FOR cmd IN ics_commands:\n    pred = model.predict(cmd)\n    IF pred == \"malicious\":\n       \
      \ ALERT(cmd, top3=model.feature_importances(cmd), nl_explanation=llm_explain(cmd))"
