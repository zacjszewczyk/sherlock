  range: Last 90 days; baseline derived from 30+ days of steady-state operation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_device_stats(mode_changes, window=30d):\n    p99_daily_count, known_sources,\
      \ known_users, freq_dist\nFOR device, day:\n    daily = count(mode_changes[device, day])\n    IF\
      \ daily > baseline.p99_daily_count[device]\n       OR src NOT IN baseline.known_sources[device]\n\
      \       OR user NOT IN baseline.known_users[device]\n       OR rate_per_min(mode_changes[device])\
      \ > 3:\n        ALERT(device, dimension, value, baseline)"
- question: Are there bursts of Modbus/S7/CIP exception responses, denied or blocked control writes (firewall
    deny logs), or rejected mode-change attempts against a controller, and is the ratio of rejected-to-accepted
    control commands rising?
  context: 'Failure rates are a distinct and often earlier signal than successful commands. Baseline and
    alert on bursts of Modbus/S7/CIP exception responses, denied or blocked control writes (from firewall
    deny logs), and rejected mode-change attempts. A rising ratio of rejected-to-accepted control commands,
    or repeated exceptions against a single controller, indicates brute-forcing of registers, mis-addressed
    commands from a rogue device, or reconnaissance preceding a mode change. Because legitimate engineering
    rarely generates sustained protocol exceptions, a spike is high-fidelity. A positive result reports
    the controller, the failure burst, and the rejected/accepted ratio; a negative result confirms control
    commands are succeeding cleanly within baseline. (Method: Statistical Method; tactic: Detect.) Sources:
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Firewall deny logs
  - PLC diagnostic/key-switch status block
  - 'NAI: The OT network segment, specifically traffic between Engineering Workstations (EWS) / Human-Machine
    Interfaces (HMI) and Programmable Logic Controllers (PLCs). The EWS and HMI endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'failures = (modbus/s7/cip exception_responses) UNION (firewall deny control_write) UNION (rejected
      mode_change)

      | bin _time span=5m

      | stats count AS fails BY device, _time

      | join device [ stats count AS accepts BY device ]

      | eval reject_ratio = fails/(fails+accepts)

      | eventstats avg(fails) AS base_avg stdev(fails) AS base_sd BY device

      | where fails > base_avg + 3*base_sd OR reject_ratio > baseline_ratio[device]

      | table device _time fails accepts reject_ratio'
- question: Has any PLC's scan-cycle or response-timing distribution shifted significantly (e.g., > 3-sigma)
    from its learned baseline, indicating a logic download or mode change that may not be visible in protocol
    logs?
  context: 'A logic download or mode change measurably shifts a PLC''s scan-cycle and response-timing
    distribution, giving a protocol-independent detector for unauthorized reprogramming and a way to verify
    whether a claimed mode change actually altered the device''s behavior. Passively fingerprint each
    PLC''s timing distribution during steady-state operation, then alert on statistically significant
    deviation, for example beyond 3 sigma from the learned baseline. This is valuable against an adversary
    who reprograms a controller through covert or non-standard channels that evade protocol parsers, and
    it serves as a State check confirming whether a mode change had real effect. A positive result flags
    the device and the magnitude of the timing shift; a negative result confirms timing is consistent
    with the established baseline. (Method: Statistical Method; tactic: Detect.) Sources: [Scanning the
    Cycle Timing-based Authentication on PLCs](https://arxiv.org/abs/2102.08985) [Who''s in Control of
    Your Control System Device Fingerprinting for CPS](https://www.ndss-symposium.org/wp-content/uploads/2017/09/who-control-your-control-system-device-fingerprinting-cyber-physical-systems.pdf)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Firewall deny logs
  - PLC diagnostic/key-switch status block
  - 'NAI: The OT network segment, specifically traffic between Engineering Workstations (EWS) / Human-Machine
    Interfaces (HMI) and Programmable Logic Controllers (PLCs). The EWS and HMI endpoints themselves.'
  range: Last 90 days; timing baseline learned over a steady-state window of several days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline_timing = learn_distribution(plc_scan_cycle_response_times, window=steady_state)\n\
      FOR device, sample_window:\n    mu, sigma = baseline_timing[device]\n    obs = current_timing(device,\
      \ sample_window)\n    z = (obs.mean - mu) / sigma\n    IF abs(z) > 3:\n        ALERT(device, timing_shift=z,\
      \ baseline=mu, observed=obs.mean)"
- question: Does the sequence of operating-mode states for any critical OT device deviate from learned
    normal patterns, such as rapid repeated Run<->Stop toggling indicative of process disruption or denial
    of service?
  context: 'Some attacks manifest not in a single command but in an abnormal sequence of state transitions.
    Implement a time-series anomaly model, such as an LSTM autoencoder, over the sequence of operating-mode
    states for critical OT devices and flag deviations from learned normal patterns, for example rapid
    repeated Run<->Stop toggling that signals process-disruption or DoS. Train and validate on CPS benchmark
    datasets (SWaT, WADI, gas-pipeline) and run the model in parallel with the deterministic key-switch
    and protocol rules, never replacing them, because autoregressive ICS IDS models are evadable via adversarial
    examples. A positive result returns the anomalous state sequence with a high reconstruction error;
    a negative result indicates the state sequence matches learned normal operation. (Method: Machine
    Learning; tactic: Detect.) Sources: [Deep Learning-Based Anomaly Detection in Cyber-Physical Systems](https://arxiv.org/abs/2003.13213)
    [Adversarial Attacks on Time-Series Intrusion Detection for ICS](https://arxiv.org/abs/1911.04278)'
  answer_sources:
  - Zeek modbus.log
  - Zeek conn.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Firewall deny logs
  - PLC diagnostic/key-switch status block
  - 'NAI: The OT network segment, specifically traffic between Engineering Workstations (EWS) / Human-Machine
    Interfaces (HMI) and Programmable Logic Controllers (PLCs). The EWS and HMI endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = ordered_state_sequence(device, modes=[Run,Program,Remote,Stop])\nmodel = LSTM_autoencoder.fit(benign_sequences)\
      \  # SWaT/WADI/gas-pipeline\nFOR window IN seq:\n    err = reconstruction_error(model, window)\n\
      \    IF err > threshold OR rapid_toggle(window, Run<->Stop):\n        ALERT(device, anomalous_sequence=window,\
      \ recon_error=err)\n# run in parallel with deterministic rules; do not replace them"
- question: Can a supervised classifier on ICS command features (function code, target register/coil,
    source host, inter-arrival time, payload size) distinguish malicious mode/command manipulation from
    legitimate engineering, and what are the top contributing features for each flagged command?
  context: 'Explainable supervised models add a classification layer that fuses many command attributes
    an analyst would otherwise weigh manually. Train a Random Forest or SVM on ICS command features (function
    code, target register/coil, source host, inter-arrival time, payload size) to classify mode and command
    manipulation, and surface the top-3 contributing features (for example, function code, source host,
    register) in the alert text using model feature importances. Fusing network metadata with physical
    process measurements better separates legitimate from malicious commands, and an LLM-based detector
    can additionally emit a natural-language explanation of the contributing signals. This gives the SOC
    actionable, interpretable verdicts rather than opaque scores. A positive result classifies a command
    as malicious with its explanatory features; a negative result classifies observed commands as benign
    engineering activity. (Method: Machine Learning; tactic: Detect.) Sources: [Anomaly-based Intrusion
    Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374) [Assessment
    of Cyber-Physical Intrusion Detection and Classification for Industrial Control Systems](https://arxiv.org/abs/2202.09352)
    [Large Language Models as Explainable Cyberattack Detectors for Energy Industrial Control Systems](https://arxiv.org/abs/2604.26079)'
