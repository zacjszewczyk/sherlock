name: 'D3-OM: Organization Mapping'
id: b5e52ef6-0aec-4ef9-8e3f-79f6ef8e905b
description: Investigate identities and assets that behave outside the organization's normal structure
  of user roles, group/department affiliations, RBAC permissions, and typical host-to-host and network
  communication patterns. This playbook helps an analyst build a time-bound baseline model that maps user
  accounts to the hosts they log into, the assets they access, the network footprint they generate, and
  their success/failure access states, then continuously reconciles observed behavior against that organizational
  model. It combines deterministic symbolic-logic rules (first-ever logon edges, cross-departmental pivoting,
  failed/denied-access profiling), robust statistical methods (per-user network footprint baselining with
  median-absolute-deviation, peer-group role-deviation scoring), and graph/ML techniques (Louvain community
  detection, node2vec/struc2vec/RolX structural embeddings, and unsupervised/temporal link prediction
  over the authentication graph) to surface lateral movement, account compromise, insider misuse, and
  improbable cross-department access that violates the learned structure of the enterprise.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: For every successful interactive or network logon, which user account connected to which host,
    from which source IP, and is this the first time that user has ever been observed logging into that
    target host?
  context: 'This question establishes the deterministic ground truth of the organizational access model.
    By mapping each successful logon (Windows Event ID 4624) to a User Account -> Machine Name edge and
    correlating the logon timestamp with Zeek conn.log to link the user''s source IP at that moment (user
    -> IP -> time), you build a host-account graph and track session counts per user/host, as in [LogonTracer](https://github.com/JPCERTCC/LogonTracer)
    and the causal login-path model of [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf). Maintaining
    a per-user set of historically-seen target hosts lets you flag the FIRST-EVER logon to a host as a
    new edge for review. A new edge is not inherently malicious, but unexplained new edges are the raw
    material of lateral movement and credential abuse; a negative result (the edge has been seen before)
    lowers priority, while a positive result (a brand-new user->host relationship) warrants correlation
    with tickets, role, and the user''s normal footprint. This builds the model against which all later
    anomaly checks are measured. (Method: Symbolic Logic; tactic: Model.)'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Active Directory / LDAP (user-role-department)
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=windows EventID=4624 LogonType IN (2,3,10)

      | eval edge=UserName."->".ComputerName

      | join type=left _time, IpAddress [ search INDEX=zeek sourcetype=conn ]

      | stats min(_time) AS first_seen max(_time) AS last_seen count AS sessions BY UserName, ComputerName,
      IpAddress

      | eventstats values(ComputerName) AS hosts_seen BY UserName

      | where NOT (ComputerName IN hosts_seen_history)

      | eval new_edge=if(first_seen==last_seen,"first-ever","recurring")

      | table UserName ComputerName IpAddress first_seen last_seen sessions new_edge'
- question: Has any user interactively logged into a workstation or server assigned exclusively to a different
    department, or exercised a permission outside their inferred role, without a prior ticket or change
    request?
  context: 'Cross-departmental pivoting is a strong indicator of lateral movement or insider misuse. Maintain
    a map of user-department affiliations and the RBAC roles inferred from a first-party user-permission/access
    matrix using [Role Mining with Probabilistic Models](https://arxiv.org/abs/1212.3873), then alert
    when a user from one department (e.g., HR) logs into a host exclusively assigned to a disparate department
    (e.g., Engineering), or accesses a permission outside any inferred role, with no corresponding ticket
    or change request. Where Active Directory department attributes are incomplete, use deterministic
    [Louvain community detection](https://arxiv.org/abs/0803.0476) over the connection graph to define
    department boundaries. A positive result - an HR user authenticating to an Engineering-only server
    - is high-value because it crosses a logical organizational boundary that legitimate workflows rarely
    require; a negative result confirms the access stayed within the user''s department. Tie the alert
    back to whether a change request exists to separate authorized administrative crossing from compromise.
    (Method: Symbolic Logic; tactic: Model.)'
  answer_sources:
  - Windows Event ID 4624
  - Active Directory / LDAP (user-role-department)
  - Windows Event ID 5145
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=windows EventID IN (4624,5145)

      | lookup user_dept UserName OUTPUT department AS user_dept

      | lookup host_dept ComputerName OUTPUT department AS host_dept

      | where user_dept != host_dept

      | lookup change_tickets UserName host_dept OUTPUT ticket_id

      | where isnull(ticket_id)

      | stats count BY UserName user_dept ComputerName host_dept _time

      | table _time UserName user_dept ComputerName host_dept count'
- question: Which users or hosts are generating bursts of failed logons across multiple distinct targets,
    or access-denied attempts against department shares they have never legitimately accessed?
  context: 'Failure and denied states are an explicit, distinct signal of credential spraying, role probing,
    and reconnaissance against the organizational structure. Per user and per host, count failed logons
    (Windows Event ID 4625) and access-denied network-share checks (Event ID 5145 failure) per 5-minute
    window. Alert on more than 5 failed logons across 3 or more distinct target hosts within 10 minutes
    (credential spraying / role probing), or any access-denied to a department share the user has never
    legitimately accessed. [LogonTracer](https://github.com/JPCERTCC/LogonTracer)-style graphs and [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf)
    rarity rules treat such first-time and failed cross-boundary attempts as high-value. A positive result
    - a single account failing against many hosts in a short window - suggests an attacker enumerating
    where stolen credentials are valid; an isolated failure is likely a benign typo or expired password.
    Tune the count thresholds to your environment''s per-host baseline failed-logon rate so legitimate
    noise does not drown the signal. (Method: Symbolic Logic; tactic: Model.)'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 5145
  - Active Directory / LDAP (user-role-department)
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX=windows (EventID=4625) OR (EventID=5145 AccessResult=\"denied\")\n| bin _time span=5m\n\
      | stats dc(ComputerName) AS distinct_hosts count AS fails values(ShareName) AS shares BY UserName,\
      \ _time\n| where (fails>5 AND distinct_hosts>=3)\n| append [ search INDEX=windows EventID=5145 AccessResult=\"\
      denied\"\n          | lookup user_known_shares UserName ShareName OUTPUT known\n          | where\
      \ isnull(known) ]\n| table _time UserName distinct_hosts fails shares"
- question: What is each user's normal daily network footprint - bytes sent/received, connection frequency,
    distinct destinations, top ports, and rejected-connection ratio - and does today's footprint exceed
    that robust baseline?
  context: 'Modeling each user''s network footprint lets you detect data staging, scanning, and beaconing
    that deviates from normal behavior. For each user, compute descriptive statistics from Zeek conn.log
    capturing Volume (total bytes sent/received per day, sent:received ratio), Frequency (connections/min,
    distinct destination IPs/day), and State (fraction of attempted connections rejected/RST). Profile
    the top 10 destination ports and total data volume, and establish a per-user baseline using the 95th
    percentile over a 30-day period to define the typical footprint. Use robust median-absolute-deviation
    (MAD) rather than mean/standard-deviation to resist outliers, following the host-communication-graph
    approach of [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf) Alert when current-day Volume,
    Frequency, or rejected-connection ratio exceeds baseline by a tunable MAD multiple. A positive result
    - a user whose outbound volume or distinct-destination count spikes far above their own robust baseline
    - may indicate exfiltration or compromise; a negative result keeps the user within their modeled footprint.
    (Method: Statistical; tactic: Model.)'
  answer_sources:
  - Zeek conn.log
  - Active Directory / LDAP (user-role-department)
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 30 days (baseline) compared against current day
  queries:
  - technology: Zeek/pseudocode
    query: "INDEX=zeek sourcetype=conn earliest=-30d\n| lookup ip_user src_ip OUTPUT UserName\n| bin _time\
      \ span=1d\n| stats sum(orig_bytes) AS sent sum(resp_bytes) AS recv count AS conns dc(dst_ip) AS\
      \ distinct_dst\n        count(eval(conn_state IN (\"REJ\",\"RSTR\",\"RSTO\"))) AS rejected BY UserName,\
      \ _time\n| eval reject_ratio=rejected/conns\n| eventstats median(sent) AS med_sent median(distinct_dst)\
      \ AS med_dst\n             p50(reject_ratio) AS med_rej BY UserName\n| eval mad_sent=abs(sent-med_sent)\n\
      | where sent > med_sent + (k * mad_sent) OR reject_ratio > med_rej * k\n| table UserName _time sent\
      \ recv conns distinct_dst reject_ratio"
- question: Does any individual's behavior vector (ports used, distinct destinations, byte volume, logon-host
    set) diverge from both their directory-role peer-group centroid and their own history?
  context: 'Peer-group analysis catches accounts that drift away from the people who share their role
    - a classic signature of compromise or misuse. Build dynamic peer groups from Directory Roles (e.g.,
    ''Sales'', ''IT'') as in [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics),
    and compute the centroid of each role''s behavior vector (ports, distinct destinations, byte volume,
    logon-host set). Alert when an individual''s vector diverges from BOTH its role centroid AND its own
    history (e.g., more than 3 standard deviations, or a robust-MAD equivalent per [Bohara et al.](https://mnoureddine.com/files/17BOH01.pdf)),
    which may indicate account compromise or misuse. Requiring divergence from both references reduces
    false positives from a whole role shifting together (e.g., a new business tool) versus a single account
    going rogue. The alert MUST surface the top-3 contributing features (e.g., distinct-destination count,
    new ports, off-hours volume) for triage so the analyst immediately knows what drove the deviation.
    (Method: Statistical; tactic: Model.)'
  answer_sources:
  - Zeek conn.log
  - Active Directory / LDAP (user-role-department)
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=zeek sourcetype=conn

      | lookup ip_user src_ip OUTPUT UserName

      | lookup user_role UserName OUTPUT role

      | stats sum(orig_bytes) AS vol dc(dst_port) AS ports dc(dst_ip) AS dst BY UserName role _time

      | eventstats mean(vol) AS role_vol stdev(vol) AS role_sd mean(dst) AS role_dst stdev(dst) AS role_dst_sd
      BY role

      | eventstats mean(vol) AS self_vol stdev(vol) AS self_sd BY UserName

      | where (abs(vol-role_vol)>3*role_sd) AND (abs(vol-self_vol)>3*self_sd)

      | eval top_features=mvappend("distinct_dst","ports","volume")

      | table UserName role vol dst ports top_features'
- question: When the user/asset connection graph is partitioned into functional communities, which users
    have changed cluster assignment or formed edges spanning two clusters without a change ticket?
  context: 'Community detection reconstructs the organization''s de facto functional groups from observed
    behavior, exposing relationships that cross department lines. Construct a graph where nodes are users
    and assets (IPs/hosts) and edges are observed connections from Zeek conn.log weighted by frequency
    and byte volume, then apply [Louvain modularity community detection](https://arxiv.org/abs/0803.0476)
    to identify clusters representing functional groups/departments. Use these clusters as features and
    review any user whose cluster assignment changes or who forms edges spanning two clusters without
    a change ticket. Re-run on a rolling window and surface the cross-cluster edges contributing to the
    change for explainability. A positive result - a user suddenly bridging two previously separate communities
    - is suspicious because lateral movement and pivoting create exactly these inter-community edges;
    a negative result means the user stayed within their established functional group. (Method: Machine
    Learning; tactic: Model.)'
  answer_sources:
  - Zeek conn.log
  - Active Directory / LDAP (user-role-department)
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 90 days (rolling window, re-run weekly)
  queries:
  - technology: Graph/pseudocode
    query: "G = build_graph(nodes=users+hosts,\n                edges=zeek_conn(weight=freq*bytes))\n\
      communities_t0 = louvain(G_prev_window)\ncommunities_t1 = louvain(G_current_window)\nfor user in\
      \ users:\n    if communities_t1[user] != communities_t0[user]:\n        emit(user, change=\"cluster_reassignment\"\
      )\n    cross = [e for e in edges(user) if comm(src)!=comm(dst)]\n    if cross and not change_ticket(user):\n\
      \        emit(user, cross_cluster_edges=cross)"
- question: Does any user's learned structural role in the graph (hub, bridge, peripheral) mismatch their
    assigned AD/HR role - for example, a finance clerk suddenly embedding as a network hub or bridge?
  context: 'Structural-identity embeddings reveal when an account starts playing a network role inconsistent
    with its business function, even if the specific hosts are new. Learn node embeddings of the user/asset
    graph with [node2vec](https://arxiv.org/abs/1607.00653) (peer-group/homophily) and structural-identity
    embeddings with [struc2vec](https://arxiv.org/abs/1704.03165), or extract explainable structural roles
    (hub, bridge, peripheral) with [RolX](https://eliassi.org/papers/henderson-kdd2012.pdf). Cluster the
    embeddings and alert when a user''s structural role or cluster mismatches their AD/HR role (e.g.,
    a finance clerk suddenly embedding as a network hub/bridge, which is typical of a pivot point). Surface
    the top-3 contributing structural features (degree, bridging score, neighbor-role mix) in the alert
    for triage, and validate the pipeline on the [CERT Insider Threat dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/),
    which ships an LDAP org model. A positive result - a low-degree clerical account acquiring hub/bridge
    structure - strongly suggests the account is being used for lateral movement; a negative result means
    structural role matches business role. (Method: Machine Learning; tactic: Model.)'
  answer_sources:
  - Zeek conn.log
  - Active Directory / LDAP (user-role-department)
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 90 days
  queries:
  - technology: Graph/ML pseudocode
    query: "G = build_graph(users, hosts, zeek_conn_edges)\nemb = struc2vec(G)            # structural\
      \ identity\nroles = rolx(G)              # hub / bridge / peripheral + features\nclusters = kmeans(emb)\n\
      for user in users:\n    ad_role = ldap_role(user)\n    if structural_role_mismatch(roles[user],\
      \ ad_role):\n        emit(user,\n             struct_role=roles[user],\n             ad_role=ad_role,\n\
      \             top_features=[degree, bridging_score, neighbor_role_mix])"
- question: Across the authentication graph, which user-host access edges have the lowest predicted probability,
    and which improbable NEW cross-department edges appear over time?
  context: 'Link-prediction scoring quantifies how improbable each access is given the learned organizational
    structure, ranking the strongest violations for review. Train an unsupervised link-prediction model
    over the authentication graph to score the probability of each user-host edge and rank low-probability
    edges as anomalous access that violates the learned structure, following [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf)
    (node2vec + logistic regression, reported >85% TPR at ~0.0004% FPR on LANL). For time-evolving access,
    use temporal link prediction per [Euler](https://arxiv.org/abs/2104.13442) to flag improbable NEW
    cross-department edges. Keep the deterministic first-time-edge and role-exception rules running in
    parallel so high-confidence rule hits are never missed, and report the edge probability and the top
    contributing features as the explanation. A positive result - a very low-probability edge, especially
    a new cross-department one - indicates access the model considers structurally implausible and merits
    investigation; a negative result (high probability) reflects expected organizational behavior. (Method:
    Machine Learning; tactic: Model.)'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Active Directory / LDAP (user-role-department)
  - 'NAI: Domain Controllers, core network switches, file servers, and critical/departmental servers.'
  range: Last 90 days
  queries:
  - technology: Graph/ML pseudocode
    query: "auth_graph = build_from(EventID_4624 + zeek_conn)\nemb = node2vec(auth_graph)\nmodel = logistic_regression.train(positive=observed_edges,\n\
      \                                  negative=sampled_nonedges)\nfor edge(user,host) in observed_edges:\n\
      \    p = model.predict_proba(emb[user], emb[host])\n    if p < threshold:\n        emit(user, host,\
      \ prob=p, top_features=explain(edge))\n# temporal: Euler over snapshots -> flag improbable NEW cross-dept\
      \ edges"
