questions:
- question: After correlating ACAS/SCAP vulnerability scan results with the authoritative asset inventory,
    which critical systems carry vulnerabilities marked 'Critical'/'High' or any CVE whose CVSS v3.1 base
    score is >= 7.0, and have CVSS Environmental metrics been applied so internet-facing and Tier-0 assets
    are scored in deployment context rather than on base score alone?
  context: 'This is the deterministic foundation of system vulnerability assessment for the System Mapping
    mission: tying each detected CVE back to a known asset so posture can be measured against the systems
    that actually matter. Join ACAS/SCAP findings to the asset inventory on hostname/IP, then apply the
    CVSS v3.1 severity bands (High = 7.0-8.9, Critical = 9.0-10.0) to flag remediation candidates. Use
    OVAL/XCCDF state tests (via OpenSCAP per NIST SP 800-126 SCAP) for reproducible, vendor-neutral detection
    of installed vulnerable package/file versions rather than version-string guessing. Set Environmental
    metrics per deployment so an internet-facing web server or a domain controller is scored in context.
    A positive result is a confirmed High/Critical exposure on a tracked asset; a clean result still requires
    checking scan coverage so absence of findings is not absence of scanning. Authoritative references:
    [CVSS v3.1 Specification](https://www.first.org/cvss/v3.1/specification-document); [NIST SP 800-126
    SCAP](https://csrc.nist.gov/pubs/sp/800/126/r3/final); [OpenSCAP](https://www.open-scap.org/features/).'
  answer_sources:
  - ACAS Scan Results
  - OpenSCAP/SCAP ARF results (OVAL CVE)
  - CISA KEV catalog (JSON feed)
  - EPSS API scores
  - Windows Event ID 11707
  - Zeek software.log
  - 'NAI: Production Web Servers, Critical Database Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for finding in acas_scap_results[last_90d]:\n  asset = inventory.lookup(finding.host_or_ip)\n\
      \  if asset is None: emit('uninventoried_asset', finding); continue\n  cvss = oval_xccdf_state_test(finding)\
      \  # reproducible installed-version check\n  env = cvss.apply_environmental(asset.exposure, asset.tier)\n\
      \  if finding.severity in ('Critical','High') or env.base_score >= 7.0:\n    emit('remediate', asset,\
      \ finding.cve, env.base_score)"
- question: Independent of CVSS severity, do any CVEs found by the vulnerability scans match a CVE listed
    in the CISA Known Exploited Vulnerabilities (KEV) catalog, and have those matches been escalated to
    top priority with the BOD 22-01 remediation deadline regardless of their base score?
  context: 'Severity-only triage misses actively weaponized low- and medium-CVSS vulnerabilities, so for
    the System Mapping mission every scanned CVE must be checked against the machine-readable CISA KEV
    catalog. A KEV match is a confirmed in-the-wild exploited signal (a State signal about real attacker
    activity) and establishes a deterministic floor that does not depend on the calculated score. Any
    match should be escalated to top priority and bound to the BOD 22-01 / KEV due date. A positive result
    is a must-fix-now finding; the absence of KEV matches does not lower priority for High/Critical CVSS
    items handled by the severity rule. Authoritative references: [CISA Known Exploited Vulnerabilities
    (KEV) catalog](https://www.cisa.gov/known-exploited-vulnerabilities-catalog).'
  answer_sources:
  - ACAS Scan Results
  - OpenSCAP/SCAP ARF results (OVAL CVE)
  - CISA KEV catalog (JSON feed)
  - EPSS API scores
  - Windows Event ID 11707
  - Zeek software.log
  - 'NAI: Production Web Servers, Critical Database Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "kev = load_json('cisa_kev_catalog.json')\nkev_ids = { e.cveID: e.dueDate for e in kev.vulnerabilities\
      \ }\nfor finding in acas_scap_results[last_90d]:\n  if finding.cve in kev_ids:\n    emit('KEV_TOP_PRIORITY',\
      \ finding.host, finding.cve, due=kev_ids[finding.cve])"
- question: When individual CVEs are composed into multi-step attack paths using host configuration, network
    reachability, privileges, and per-CVE effects, do any systems' vulnerabilities yield a logical derivation
    that reaches a Tier-0 or crown-jewel asset?
  context: 'The vulnerability posture of a system is more than the sum of its component CVEs; emergent,
    design-level risk arises when a chain of individually unremarkable weaknesses produces a path to a
    critical asset. For the System Mapping mission, encode each host''s configuration, network reachability
    (from Zeek/firewall data), privilege relationships, and per-CVE preconditions/effects as Datalog facts
    and run a logic-based analyzer such as MulVAL. Flag any system whose vulnerabilities, in context,
    yield a derivation reaching a Tier-0/crown-jewel target. A positive result is a reachable attack path
    that should reprioritize remediation of the cheapest cut in the chain even if no single CVE is Critical;
    a negative result increases confidence that current exposures are contained. Authoritative references:
    [MulVAL](https://www.usenix.org/legacy/event/sec05/tech/full_papers/ou/ou.pdf); [MulVAL code](https://github.com/risksense/mulval).'
  answer_sources:
  - ACAS Scan Results
  - OpenSCAP/SCAP ARF results (OVAL CVE)
  - CISA KEV catalog (JSON feed)
  - EPSS API scores
  - Windows Event ID 11707
  - Zeek software.log
  - 'NAI: Production Web Servers, Critical Database Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Datalog/MulVAL pseudocode
    query: 'facts = []

      facts += [ vulExists(h, cve, prog) for (h,cve,prog) in scan_findings ]

      facts += [ hacl(src, dst, proto, port) for flow in reachability(zeek, firewall) ]

      facts += [ networkServiceInfo(...), localPriv(...), hasAccount(...) ]

      goal = execCode(asset) where asset in tier0_crown_jewels

      derivations = mulval_solve(facts, goal)

      for d in derivations: emit(''attack_path_to_tier0'', path=d)'
- question: Across the enterprise distribution of CVSS scores from ACAS reports, which assets exceed a
    dynamic 'critical risk' threshold (e.g., the 95th percentile), and which Critical findings have remained
    unpatched for more than 30 days or beyond the mean time-to-patch by more than two standard deviations?
  context: 'Because CVSS base scores conflate severity with risk and a flat CVSS>=7 cutoff floods the
    queue, the System Mapping mission benefits from a statistical view of the whole backlog. Compute the
    enterprise distribution of CVSS scores and set a dynamic critical-risk threshold at the 95th percentile.
    Track Volume (open criticals per asset), Frequency (new criticals introduced per scan cycle), and
    vulnerability age. Flag criticals unpatched longer than 30 days, or whose age exceeds the mean time-to-patch
    by more than two standard deviations - these are SLA breaches and accumulation hotspots. A positive
    result identifies assets and findings that are statistical outliers in risk or aging, directing limited
    remediation capacity to where the backlog is worst. Authoritative references: [Towards Improving CVSS](https://insights.sei.cmu.edu/library/towards-improving-cvss/).'
  answer_sources:
  - ACAS Scan Results
  - OpenSCAP/SCAP ARF results (OVAL CVE)
  - CISA KEV catalog (JSON feed)
  - EPSS API scores
  - Windows Event ID 11707
  - Zeek software.log
  - 'NAI: Production Web Servers, Critical Database Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "scores = [ f.cvss for f in acas_results[last_90d] ]\np95 = percentile(scores, 95)\nttp_mean,\
      \ ttp_sd = mean_std(patch_times_history)\nfor f in open_findings:\n  age = now - f.first_seen\n\
      \  if f.cvss >= p95: emit('dynamic_critical', f.host, f.cve)\n  if f.severity=='Critical' and age\
      \ > 30d: emit('sla_breach', f)\n  if age > ttp_mean + 2*ttp_sd: emit('aging_outlier', f)"
- question: After enriching each CVE with its EPSS 30-day exploitation probability and percentile, which
    vulnerabilities fall above a capacity-tuned probability cutoff or within the top 1-5% percentile and
    should be prioritized ahead of a flat CVSS-based ranking?
  context: 'EPSS estimates the probability that a CVE will be exploited in the next 30 days and yields
    far better coverage/efficiency than a flat CVSS>=7 cutoff. For the System Mapping mission, enrich
    every scanned CVE with its EPSS probability and percentile from the EPSS API, then prioritize CVEs
    above a tuned probability cutoff (start ~>=0.1, raise toward >=0.5 to reduce volume) or in the top
    1-5% percentile, deriving the exact threshold from your own backlog size and SLA capacity. A positive
    result is a short, high-yield remediation list weighted toward vulnerabilities most likely to be exploited
    soon; this ranking layers on top of - never replaces - the deterministic CVSS/KEV floor. Authoritative
    references: [EPSS](https://arxiv.org/pdf/1908.04856); [Understanding EPSS Probabilities and Percentiles](https://www.first.org/epss/articles/prob_percentile_bins);
    [The Evolution of EPSS](https://www.first.org/epss/articles/the_evolution_of_epss).'
  answer_sources:
  - ACAS Scan Results
  - OpenSCAP/SCAP ARF results (OVAL CVE)
  - CISA KEV catalog (JSON feed)
  - EPSS API scores
  - Windows Event ID 11707
  - Zeek software.log
  - 'NAI: Production Web Servers, Critical Database Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for f in acas_results[last_90d]:\n  epss = epss_api.lookup(f.cve)  # {probability, percentile}\n\
      \  f.epss_prob = epss.probability; f.epss_pct = epss.percentile\nprob_cut = tune_threshold(backlog_size,\
      \ sla_capacity)  # e.g. 0.1..0.5\nfor f in acas_results:\n  if f.epss_prob >= prob_cut or f.epss_pct\
      \ >= 0.95:\n    emit('epss_priority', f.host, f.cve, f.epss_prob, f.epss_pct)"
- question: Are there coverage and data-quality gaps in the vulnerability assessment itself - assets in
    inventory with no recent scan, OVAL/SCAP tests returning 'error'/'unknown', credentialed scans that
    failed authentication, or CVEs with missing/invalid CVSS vectors or mislabeled CPE - and is the rate
    of these failures rising?
  context: 'A vulnerability posture is only as trustworthy as the scans behind it; unscanned or error-laden
    assets silently understate true risk. For the System Mapping mission, profile assessment failure modes
    as distinct signals separate from the vulnerability findings: inventory assets with no recent scan
    result, OVAL/SCAP tests returning ''error''/''unknown'', authentication-failed credentialed scans
    (which downgrade to shallow uncredentialed results), and CVEs with missing/invalid CVSS vectors or
    mislabeled CPE in NVD. A rising rate of unscanned or error assets is a coverage gap that must alert
    on its own. A positive result is a blind spot in the assessment program; a clean result raises confidence
    that posture metrics reflect reality. Authoritative references: [Cleaning the NVD](https://arxiv.org/pdf/2006.15074).'
  answer_sources:
  - ACAS Scan Results
  - OpenSCAP/SCAP ARF results (OVAL CVE)
  - CISA KEV catalog (JSON feed)
  - EPSS API scores
  - Windows Event ID 11707
  - Zeek software.log
  - 'NAI: Production Web Servers, Critical Database Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "scanned = { r.host for r in acas_results[last_14d] }\nfor asset in inventory:\n  if asset.id\
      \ not in scanned: emit('no_recent_scan', asset)\nfor r in acas_results[last_90d]:\n  if r.oval_result\
      \ in ('error','unknown'): emit('scan_error', r)\n  if r.auth_status == 'failed': emit('cred_scan_failed',\
      \ r)\n  if not valid_cvss_vector(r.cvss_vector) or mislabeled_cpe(r.cpe):\n    emit('data_quality',\
      \ r)\nalert_if_rate_increasing(['no_recent_scan','scan_error','cred_scan_failed'])"
- question: Using an exploitation-likelihood classifier (the production EPSS XGBoost model or a locally
    trained gradient-boosting/logistic model that adds asset criticality and software prevalence), which
    CVEs rank highest for likely exploitation, and what are the top-3 contributing features behind each
    prediction?
  context: 'Ranking purely by CVSS over- and under-prioritizes; a model trained on exploitation outcomes
    predicts real risk far better. For the System Mapping mission, score each CVE with the production
    EPSS XGBoost model (~1,400 features: CVE age, public exploit code in Exploit-DB/Metasploit, vendor/product,
    CWE/reference tags, CVSS metrics, observed exploitation), or train a local gradient-boosting/logistic
    model that adds asset criticality (from the NAI) and software prevalence (Zeek software.log). Optionally
    layer Expected Exploitability to model exploit development over time and handle label noise/drift.
    Emit the top-3 contributing features in every alert (e.g., ''KEV-listed'', ''public exploit available'',
    ''EPSS=0.84'') for analyst trust, and always layer this ranking on top of - never replacing - the
    deterministic CVSS/KEV floor. A high model score on a reachable, critical asset is the strongest single
    remediation signal. Authoritative references: [EPSS XGBoost model](https://www.first.org/epss/model);
    [Expected Exploitability](https://www.usenix.org/system/files/sec22-suciu.pdf); [Sabottke et al.](https://www.usenix.org/system/files/conference/usenixsecurity15/sec15-paper-sabottke.pdf).'
  answer_sources:
  - ACAS Scan Results
  - OpenSCAP/SCAP ARF results (OVAL CVE)
  - CISA KEV catalog (JSON feed)
  - EPSS API scores
  - Windows Event ID 11707
  - Zeek software.log
  - 'NAI: Production Web Servers, Critical Database Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feats = build_features(cve, exploitdb, metasploit, cwe, cvss,\n                       asset_criticality=nai,\
      \ prevalence=zeek_software_log)\nmodel = load('epss_xgboost')  # or local gradient_boosting/logistic\n\
      for f in acas_results[last_90d]:\n  score = model.predict_proba(feats[f.cve])\n  top3 = model.explain(feats[f.cve],\
      \ k=3)\n  ranked.append((f.host, f.cve, score, top3))\nemit(sort_desc(ranked))  # layered above\
      \ CVSS/KEV floor, never replacing it"
- question: Which systems show DISA STIG CAT I or CAT II deviations from the XCCDF baseline in ACAS/SCAP
    configuration scans, and are there security-log events (Windows Event ID 4738/4704) indicating a configuration
    change that moved a required STIG setting out of compliance?
  context: 'Misconfiguration is a primary, often-overlooked component of system vulnerability. For the
    System Mapping mission, ingest ACAS/SCAP configuration scan results and raise high-priority alerts
    for any DISA STIG CAT I (direct/immediate compromise) or CAT II (potential compromise) deviation from
    the XCCDF baseline, evaluated deterministically with SCAP Compliance Checker or OpenSCAP (XCCDF rules
    bound to OVAL state tests per NIST SP 800-126). Additionally monitor security logs for configuration
    changes - Event ID 4738 (user account changed) and 4704 (user right assigned) - that move a required
    STIG setting out of compliance (a State change signal). A positive result is a non-compliant or newly
    drifted control on a sensitive asset; CAT I findings on Tier-0 systems are the highest priority. Authoritative
    references: [DISA STIG](https://public.cyber.mil/stigs/); [OpenSCAP](https://www.open-scap.org/features/);
    [NIST SP 800-126](https://csrc.nist.gov/pubs/sp/800/126/r3/final).'
  answer_sources:
  - ACAS Configuration Scan Results
  - SCAP Compliance Checker / OpenSCAP XCCDF results
  - Windows Event ID 4738
  - Windows Event ID 4704
  - 'NAI: Domain Controllers, Privileged user workstations, Tier 0 servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for r in scap_xccdf_results[last_90d]:\n  if r.result == 'fail' and r.severity in ('CAT I','CAT\
      \ II'):\n    emit('stig_deviation', r.host, r.rule_id, r.severity)\nfor ev in winlog where EventID\
      \ in (4738, 4704):\n  if changes_required_stig_setting(ev):\n    emit('stig_drift_change', ev.host,\
      \ ev.subject, ev.EventID)"
- question: When configuration and vulnerability findings are run through an auditable decision tree (SSVC)
    that maps Exploitation status, Automatable, Technical Impact, and Mission & Exposure, what Track/Track*/Attend/Act
    decision results for each STIG deviation on exposed or Tier-0 assets?
  context: 'A bare severity label does not explain why a finding should be acted on; the System Mapping
    mission benefits from an explainable prioritization path. Triage configuration and vulnerability findings
    with an SSVC decision tree: map Exploitation status (None/PoC/Active, aligned to the KEV catalog),
    Automatable, Technical Impact, and Mission & Exposure to a Track / Track* / Attend / Act outcome.
    This yields an auditable rationale for prioritizing STIG deviations on exposed or Tier-0 assets rather
    than a single number. A positive result (''Act'' or ''Attend'') is a defensible, documented reason
    to remediate now; ''Track'' findings can be batched. The recorded decision path supports later review
    and consistency. Authoritative references: [SSVC](https://www.cisa.gov/stakeholder-specific-vulnerability-categorization-ssvc).'
  answer_sources:
  - ACAS Configuration Scan Results
  - SCAP Compliance Checker / OpenSCAP XCCDF results
  - Windows Event ID 4738
  - Windows Event ID 4704
  - 'NAI: Domain Controllers, Privileged user workstations, Tier 0 servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for f in (stig_deviations + vuln_findings):\n  expl = 'Active' if f.cve in kev else ('PoC'\
      \ if has_poc(f) else 'None')\n  d = ssvc(exploitation=expl,\n           automatable=is_automatable(f),\n\
      \           technical_impact=tech_impact(f),\n           mission_exposure=mission_and_exposure(f.host))\n\
      \  emit('ssvc_decision', f.host, f.rule_or_cve, decision=d, path=d.trace)"
- question: For quantifiable STIG settings (password-complexity failures, number of local administrators,
    count of open CAT I/II findings), which systems are statistical outliers against their peer group
    - exceeding the peer-group mean by more than three standard deviations or dropping below the peer
    5th-percentile compliance score?
  context: Some STIG settings are countable and lend themselves to peer-relative baselining, which catches
    outliers a fixed rule misses. For the System Mapping mission, establish baseline deviation counts
    (Volume) across peer groups of similar systems from SCAP scans - e.g., all domain controllers, all
    Tier-0 web servers - and track new deviations per scan cycle (Frequency). Use descriptive statistics
    to flag systems whose deviation count exceeds the peer-group mean by more than three standard deviations,
    or whose compliance score falls below the peer 5th percentile. A positive result is a system that
    is meaningfully worse-configured than its true peers, often indicating neglected hardening or unauthorized
    change; a result within the peer band suggests configuration is consistent with policy.
  answer_sources:
  - ACAS Configuration Scan Results
  - SCAP Compliance Checker / OpenSCAP XCCDF results
  - Windows Event ID 4738
  - Windows Event ID 4704
  - 'NAI: Domain Controllers, Privileged user workstations, Tier 0 servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for group in peer_groups(role):  # e.g. domain_controllers, tier0_web\n  vals = { h: count_open_cat_findings(h)\
      \ for h in group }\n  m, sd = mean_std(vals.values())\n  p5 = percentile([compliance_score(h) for\
      \ h in group], 5)\n  for h in group:\n    if vals[h] > m + 3*sd: emit('config_outlier_high', h,\
      \ vals[h])\n    if compliance_score(h) < p5: emit('config_outlier_low', h)"
- question: When systems are clustered on STIG-compliance feature vectors derived from SCAP scans and
    security logs, which systems have drifted into a less-compliant cluster or become outliers over time,
    and what top-3 features drove that assignment (e.g., 'audit policy disabled', 'SMBv1 enabled', '+4
    local admins')?
  context: Configuration drift is gradual and multidimensional, so clustering reveals unauthorized or
    insecure changes that single-rule checks miss. For the System Mapping mission, build STIG-compliance
    feature vectors from SCAP scans and security logs and cluster systems with K-Means or DBSCAN. Track
    each system's cluster membership over time and investigate any that migrate to a less-compliant cluster
    or become outliers - a signal of unauthorized or insecure change. Surface the top-3 features driving
    the cluster assignment or anomaly so analysts can act immediately, and retain the deterministic CAT
    I/II rule alerts as the floor beneath the model. A positive result is a system whose configuration
    profile has diverged toward insecurity; a stable, compliant cluster membership raises confidence in
    the host's hardening.
  answer_sources:
  - ACAS Configuration Scan Results
  - SCAP Compliance Checker / OpenSCAP XCCDF results
  - Windows Event ID 4738
  - Windows Event ID 4704
  - 'NAI: Domain Controllers, Privileged user workstations, Tier 0 servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = stig_feature_vectors(scap_results, security_logs)  # per host\nlabels = dbscan(X)  # or\
      \ kmeans(X, k)\nfor h in hosts:\n  if cluster_now(h) != cluster_prev(h) and less_compliant(cluster_now(h)):\n\
      \    top3 = feature_importance(h, X)\n    emit('compliance_drift', h, from_=cluster_prev(h), to=cluster_now(h),\
      \ top3)\n  if is_outlier(h, labels):\n    emit('compliance_outlier', h, feature_importance(h, X))\n\
      # deterministic CAT I/II rule alerts remain the floor"
