name: 'D3-SYSVA: System Vulnerability Assessment'
id: d0626122-4251-4e93-b7b8-12379afcae80
description: This playbook helps an analyst assess the vulnerability posture of critical systems by relating
  the vulnerabilities of a system's components to their configuration, internal dependencies, and design-level
  risk - not just the sum of individual component weaknesses. It correlates authenticated ACAS/SCAP vulnerability
  scan results with asset inventory to flag Critical/High CVEs (CVSS v3.1 >= 7.0), matches every scanned
  CVE against the CISA Known Exploited Vulnerabilities (KEV) catalog as a deterministic exploited-in-the-wild
  floor, and composes individual CVEs into multi-step attack paths (e.g., MulVAL Datalog reachability)
  that reveal emergent paths to Tier-0/crown-jewel assets. It layers statistical analysis - enterprise
  CVSS distribution thresholds, EPSS exploitation probability/percentile, vulnerability age and patch-SLA
  outliers, and scan coverage/failure-rate profiling - and machine learning (EPSS XGBoost or local exploitation-likelihood
  classifiers) to prioritize remediation by real exploit risk. It further detects configuration drift
  from DISA STIG baselines, raising alerts on CAT I/II XCCDF deviations, triaging findings with auditable
  decision trees (SSVC), profiling per-peer-group deviation outliers, and clustering systems to surface
  unauthorized or insecure configuration changes. Use it to answer what the current vulnerability posture
  of critical systems is and to drive defensible, exploit-aware remediation priorities.
type: technique
related:
- tactic_id: D3-SYSM
  tactic_name: System Mapping
