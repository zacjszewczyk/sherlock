name: 'D3-SEA: Script Execution Analysis'
id: cb397f99-17f7-4a61-bf2d-998178c4c716
description: 'Investigate potentially malicious script execution across the enterprise by analyzing interpreter
  activity without relying on a single signal. This playbook helps an analyst establish visibility into
  script execution and baseline normal activity to surface anomalies. It correlates three complementary
  evidence layers: (1) process-creation telemetry, which exposes interpreter command lines, encoded launch
  arguments, and parent-child lineage to enable deterministic and statistical detection of malicious script
  invocation even without script content; (2) de-obfuscated script-block and AMSI content, which reveals
  post-decoding intent for content signatures, obfuscation scoring, and structural machine learning even
  when the command line was encoded; and (3) per-host aggregation of script-execution events, which exposes
  anomalous volume, frequency, sequence, and failure rates that individual commands do not, catching slow
  or novel campaigns. Together these support detection of known-bad tokens, encoded loaders, download-and-execute
  cradles, reflective/unmanaged hosting, AMSI tampering, and behavioral deviations consistent with both
  sophisticated external actors and commodity malware.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any process-creation command lines containing known-malicious script tokens (for example
    Invoke-Mimikatz, DownloadString, or FromBase64String) being executed on endpoints or domain controllers?
  context: This is the deterministic detection floor for script-based attacks under the Detect tactic.
    Process-creation telemetry (Windows Event ID 4688 and Sysmon Event ID 1) captures the full interpreter
    command line, so even without the script body you can match against a curated keyword/token list of
    offensive tooling and well-known malicious primitives. A match is high-confidence and should alert
    immediately; the absence of matches does not clear the host because attackers obfuscate or encode.
    Maintain and tune the keyword list rather than removing it, and align it to public rule sets such
    as SigmaHQ so coverage tracks emerging tradecraft.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID IN (4688,1) AND CommandLine MATCHES_ANY(['Invoke-Mimikatz','DownloadString','FromBase64String','Invoke-Expression','IEX',...known_bad_tokens])
      -> alert(severity=high)
- question: Is PowerShell being launched with an encoded-command argument (-EncodedCommand, -enc, -e,
    or case/abbreviation variants) carrying a Base64 blob?
  context: Encoded command launches are a hallmark of obfuscated loaders and droppers (for example Emotet)
    that hide intent from simple keyword matching. Under the Detect tactic, alerting on PowerShell invoked
    with -EncodedCommand / -enc / -e plus a Base64 payload gives an early, content-independent signal
    of script-based delivery. Be deliberate about case-insensitivity and PowerShell's parameter-abbreviation
    behavior (any unambiguous prefix of -EncodedCommand works). A hit warrants decoding the blob and pivoting
    to script-block logs; benign administrative use exists, so corroborate with parent process and entropy.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID IN (4688,1) AND Image ENDSWITH ('powershell.exe','pwsh.exe') AND CommandLine MATCHES_REGEX('(?i)\s-e(nc(odedcommand)?)?\s+[A-Za-z0-9+/=]{20,}')
      -> alert
- question: Does any command line combine a download primitive with immediate in-memory execution (a download-and-execute
    cradle)?
  context: 'Download cradles are the staging step of script-based payload delivery: a download primitive
    (WebClient, DownloadString/DownloadFile, Invoke-WebRequest, iwr, curl) co-occurring with an execution
    primitive (IEX, Invoke-Expression, the call operator &, or dot-sourcing .). Detecting the co-occurrence
    in a single command line is far stronger than either token alone and directly serves the Detect tactic
    by catching fileless retrieval-and-run behavior. A positive result should trigger network pivots to
    identify the remote host; a negative result is expected for benign scripts that do not fetch and execute
    remote code.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID IN (4688,1) AND CommandLine MATCHES_ANY(download=['DownloadString','DownloadFile','Invoke-WebRequest','iwr','WebClient','Net.WebClient'])
      AND CommandLine MATCHES_ANY(exec=['IEX','Invoke-Expression','&','. ']) -> alert(severity=high)
- question: Is the PowerShell automation engine (System.Management.Automation.dll or related DLLs) loading
    into a process other than powershell.exe or pwsh.exe?
  context: Unmanaged or reflective PowerShell hosting lets an attacker run PowerShell logic without launching
    powershell.exe, evading command-line and script-block monitoring tied to the normal host. Using Sysmon
    Event ID 7 image-load telemetry, alert when System.Management.Automation.dll (or System.Management.Automation.ni.dll)
    loads into an unexpected process. This is a defense-evasion failure-mode for content-based controls
    and is a strong Detect-tactic signal of tooling like custom runspaces or implants. Maintain an allowlist
    of legitimate hosts (for example some management agents) to manage false positives.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID=7 (Sysmon ImageLoad) AND ImageLoaded MATCHES('System.Management.Automation*.dll') AND
      Image NOT IN ('powershell.exe','pwsh.exe', allowlisted_hosts) -> alert
- question: Do interpreter command-line arguments or embedded encoded blobs exhibit abnormally high Shannon
    entropy relative to the per-host or per-role baseline?
  context: Encoded, encrypted, or packed payloads carry far higher Shannon entropy than human-written
    commands (typically >7.2 versus 5.0-6.5 for plain text). Computing entropy over the command line and
    any embedded blob gives a statistical, signature-independent way to flag obfuscation under the Detect
    tactic. Alert both on an absolute high-entropy threshold and when entropy exceeds the 99th percentile
    of a 30-day per-host/per-role baseline, since 'normal' entropy varies by administrative role. High
    entropy alone is suggestive, not conclusive; pair it with parent lineage and encoded-flag detection
    to raise confidence.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each proc in EventID(4688,1): e = shannon_entropy(CommandLine + extract_blob(CommandLine));
      if e > 7.2 OR e > percentile_99(baseline[host,role], window=30d): alert(features={entropy:e})'
- question: Are there rare parent-child process relationships involving script interpreters, such as Office
    applications spawning PowerShell?
  context: Lineage anomalies expose script execution that originates from an unusual ancestor. Baselining
    parent-child pairings (for example winword.exe or excel.exe spawning powershell.exe, or w3wp.exe spawning
    cmd.exe) per host and user role lets you flag pairings that occur in under 1% of historical executions.
    Under the Detect tactic this catches macro-borne and exploitation-driven script launches that may
    use otherwise-clean command lines. A rare pairing is an investigative lead, not proof; corroborate
    with the command line, user, and timing, and remember legitimate-but-infrequent automation can appear
    rare.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq[parent->child] = count(pairing) / total per (host,role) over 30d; for new proc: if child
      IN interpreters AND freq[parent->child] < 0.01: alert'
- question: Can a machine-learning classifier flag malicious command lines, and which features (entropy,
    encoded flag, rare parent) drove each alert?
  context: 'When deterministic rules and single statistics miss novel obfuscation, a supervised model
    trained on command-line text plus hybrid features (length, entropy, special-character ratios, token
    categories) generalizes better. Under the Detect tactic this provides a probabilistic catch-all that
    complements the rules above. Critically, the model must be explainable: surface the top-3 contributing
    features (for example entropy, the encoded flag, a rare parent) so an analyst can validate or dismiss
    the alert quickly. Treat high-probability, high-explanation alerts as priority leads; low-confidence
    outputs feed triage rather than auto-alerting.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(CommandLine: length, entropy, special_char_ratio, token_categories, encoded_flag,
      parent_rarity); p = tree_ensemble.predict_proba(X); if p > threshold: alert(top3=explain(model,
      X))'
- question: Do de-obfuscated PowerShell script blocks (Event ID 4104) or AMSI content contain high-risk
    APIs or keywords such as VirtualAlloc, WriteProcessMemory, CreateThread, Reflection.Assembly, or [char]
    casting chains?
  context: Script Block Logging (Event ID 4104) and AMSI capture the script AFTER PowerShell decodes and
    de-obfuscates it, exposing the true intent even when the original command line was Base64-encoded.
    Scanning this decoded content for memory-injection and reflective-loading APIs gives content-level
    detection under the Detect tactic that command-line monitoring cannot. This requires Script Block
    Logging, Module Logging, and AMSI to be enabled. A match on these high-risk APIs in script content
    is a strong malicious-execution signal; absence means either benign code or that logging/AMSI was
    tampered with (check the AMSI-tampering question).
  answer_sources:
  - Windows Event ID 4104
  - Windows AMSI
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID IN (4104) OR source=AMSI: if ScriptBlockText MATCHES_ANY([''VirtualAlloc'',''WriteProcessMemory'',''CreateThread'',''Reflection.Assembly'',''[char]'',''GetDelegateForFunctionPointer''])
      -> alert'
- question: Does decoded script-block text show obfuscation indicators such as -replace/-join/-f chains,
    backtick escaping, format-operator reordering, or character-array casting?
  context: 'Even without a known-bad API, structural obfuscation in decoded content is itself a strong
    signal under the Detect tactic. Applying YARA/regex obfuscation rules to script-block text catches
    the techniques attackers use to defeat keyword matching: -replace/-join/-f string-building chains,
    backtick escape spam, format-operator index reordering, and [char]/character-array casting. Heavily
    obfuscated benign code is rare in most environments, so these matches deserve investigation. Pair
    with statistical obfuscation scoring to reduce noise from legitimately complex scripts.'
  answer_sources:
  - Windows Event ID 4104
  - Windows AMSI
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4104: apply yara/regex obfuscation_rules(ScriptBlockText): backtick_density, join_replace_f_chains,
      format_operator_reorder, char_casting -> if matched: alert'
- question: Is there evidence of AMSI tampering, such as reflection against System.Management.Automation.AmsiUtils,
    amsiInitFailed, amsiContext, or in-memory patching of amsi.dll?
  context: AMSI (Antimalware Scan Interface) is what feeds decoded content to detection engines; disabling
    it blinds content-based controls. Under the Detect tactic, an AMSI bypass is a distinct failure-mode
    signal that typically PRECEDES content-blind malicious execution. Alert on script content referencing
    AmsiUtils, the amsiInitFailed/amsiContext fields, or behaviors consistent with in-memory patching
    of amsi.dll. A positive result is high priority because it indicates deliberate evasion and means
    subsequent content logging may be unreliable; investigate everything that ran afterward on that host.
  answer_sources:
  - Windows Event ID 4104
  - Windows AMSI
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID IN (4104,4103) OR AMSI: if content MATCHES_ANY([''AmsiUtils'',''amsiInitFailed'',''amsiContext'',''[Ref].Assembly.GetType'',''amsi.dll''])
      -> alert(severity=high)'
- question: Does decoded script text deviate statistically from a known-good script corpus by character-frequency
    distribution, non-alphanumeric ratio, or low cosine similarity?
  context: Some malicious or obfuscated scripts evade both keyword and structural rules but still look
    statistically unlike legitimate code. Computing character-frequency distribution, non-alphanumeric
    ratio, and cosine similarity of decoded script text against a curated known-good corpus gives a learned,
    distribution-based detector under the Detect tactic. Alert when similarity falls below a learned threshold
    or when feature vectors deviate from the baseline. This complements the deterministic obfuscation
    rules by catching novel obfuscators; tune thresholds against your own approved-script baseline to
    control false positives.
  answer_sources:
  - Windows Event ID 4104
  - Windows AMSI
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'v = features(decoded_text: char_freq_dist, nonalnum_ratio); sim = cosine(v, known_good_centroid);
      if sim < learned_threshold OR z_score(v) > k: alert'
- question: Can an AMSI-fed machine-learning classifier identify malicious script content while resisting
    surface obfuscation, and what features and AMSI verdict explain each alert?
  context: Deep models trained on AMSI/script-block content using contextual embeddings (Word2Vec/FastText)
    with CNN/LSTM, or AST/subtree-structural models, learn semantics that survive surface-level obfuscation
    that defeats regex. Under the Detect tactic this is the content-aware counterpart to the command-line
    ML model. The classifier should surface the top-3 contributing features/tokens and the AMSI verdict
    so analysts can validate the call. Because it consumes decoded content, it pairs naturally with AMSI;
    if AMSI was bypassed, this detector loses input, which is why the AMSI-tampering check remains essential.
  answer_sources:
  - Windows Event ID 4104
  - Windows AMSI
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'tokens = embed(ScriptBlockText, model=word2vec/fasttext); p = cnn_lstm.predict(tokens); if
      p > threshold: alert(top3_tokens=explain(...), amsi_verdict=verdict)'
- question: After normalizing heavily obfuscated scripts via AST deobfuscation, do they exhibit objective-oriented
    semantic attack signatures?
  context: Surface string matching fails against layered obfuscation, but subtree-based AST deobfuscation
    can normalize even heavily obfuscated PowerShell back toward its semantic form. Once normalized, mining
    objective-oriented semantic attack signatures detects intent (for example credential theft, injection,
    persistence) regardless of how the original was disguised, enabling near-real-time detection under
    the Detect tactic. A semantic-signature hit on deobfuscated code is high-confidence because it reflects
    what the script actually does; this method is the strongest defense against obfuscation-heavy tradecraft
    when AMSI/script-block content is available.
  answer_sources:
  - Windows Event ID 4104
  - Windows AMSI
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ast = parse(ScriptBlockText); norm = subtree_deobfuscate(ast); sig = match_semantic_signatures(norm,
      objective_oriented_rules); if sig: alert(behavior=sig)'
- question: Are per-host PowerShell/script error and failure rates (terminating exceptions, blocked executions,
    constrained-language-mode violations) spiking above their baseline?
  context: 'Attackers iterate: failed commands, blocked executions, and constrained-language-mode (CLM)
    violations cluster during trial-and-error tradecraft and guardrail evasion. Baselining per-host script-execution
    failure signals from Event ID 4103/4104 error and terminating-exception counts, plus blocked-execution
    and CLM-violation events, lets you alert on bursts that diverge from the host''s normal failure rate.
    Under the Detect tactic this catches hands-on-keyboard activity and tooling being tuned against your
    defenses. A spike is an investigative trigger; correlate the failing commands with the same host''s
    successful executions to reconstruct the operator''s attempts.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fail_count[host,hour] = count(EventID(4103,4104) where error/terminating OR blocked OR CLM_violation);
      if fail_count > baseline_mean[host] + k*stddev: alert'
- question: Does the volume of PowerShell/script executions on a host deviate significantly from its forecasted
    hourly rate?
  context: Individual commands can look benign while their aggregate volume betrays a campaign. Building
    a per-host time-series model (for example ARIMA) of expected script executions per hour and alerting
    on significant deviation from the forecast interval catches both bursts (mass execution) and unusual
    off-hours activity under the Detect tactic. Retain this as a deterministic baseline floor alongside
    the ML sequence model. A forecast breach is a lead, not a verdict; legitimate patching or deployment
    windows cause spikes, so enrich with change-management context and the executing user.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'model = ARIMA(history[host].executions_per_hour); forecast,ci = model.predict(next_hour);
      if observed > ci.upper OR observed < ci.lower: alert(deviation=observed-forecast)'
- question: Are there improbable per-host sequences of script-execution events (process spawns and cmdlet/log-key
    orderings) flagged by a sequence model?
  context: 'Order matters: a benign set of commands run in an unusual sequence can indicate an attack
    chain that volume and content checks miss. Treating per-host script-execution streams (process spawns,
    cmdlet/log-key sequences) as ordered log keys and training an LSTM (DeepLog-style) to predict the
    next event lets you flag improbable sequences in real time, complementing volume baselining under
    the Detect tactic. The model should surface the diverging sequence step so the analyst sees exactly
    where behavior went off-script. A flagged sequence is an anomaly to investigate, valuable for catching
    slow or novel campaigns that evade per-event detection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4103
  - 'NAI: Endpoints (workstations and servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered_log_keys[host]; for each step t: pred = lstm.predict(seq[:t]); if seq[t] NOT
      IN top_k(pred): alert(diverging_step=seq[t])'
