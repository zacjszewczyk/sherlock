name: 'D3-CS: Credential Scrubbing'
id: 005a908a-8cdb-4965-af9a-e37c84aecfdc
description: This playbook helps an analyst investigate the presence and remediation of hard-coded credentials
  in source code and version-control history. It guides the hunt for usernames, passwords, API keys, tokens,
  and private keys that may have been committed to repositories, using deterministic pattern matching,
  entropy-based statistical detection, and machine-learning classification. It also covers verifying whether
  exposed secrets are still active, blocking new exposures at commit time, and tracking control-health
  metrics such as secret density, time to revoke/rotate, and rates of bypass or suppression. The goal
  is to surface high-confidence credential leaks that could grant an external actor or insider unauthorized
  access to sensitive systems, and to confirm that scrubbing controls are functioning rather than being
  routed around.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there any strings in the working tree or full commit history that match known fixed-format
    credential patterns such as AWS access keys (AKIA[0-9A-Z]{16}), Google API keys (AIza...), Stripe
    live keys (sk_live_), Slack tokens (xox[baprs]-), JWTs (eyJ...), or PEM private-key headers?
  context: Deterministic regex matching against both the current working tree and the entire commit history
    catches fixed-format secrets with very high precision; tuned per-platform regex reportedly captures
    ~99% of new secret-bearing files (Meli et al.). Tools like Gitleaks and detect-secrets ship maintainable
    rule libraries. A direct match is a high-confidence finding that demands immediate triage, revocation,
    and rotation, because in the Harden tactic the goal is to eliminate hard-coded credentials before
    an external actor or insider can harvest them. Never retire these deterministic rules; run statistics
    and ML in parallel as additional layers. A negative result across history is reassuring but should
    be corroborated by entropy and ML checks since custom or obfuscated secrets evade fixed patterns.
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (scan full commit history for initial baseline)
  queries:
  - technology: SAST/Secret-scanner pseudocode
    query: "FOR each blob in (working_tree UNION git_rev_list --all):\n  IF blob MATCHES regex(AWS=AKIA[0-9A-Z]{16},\
      \ GOOGLE=AIza[0-9A-Za-z_-]{35},\n     STRIPE=sk_live_[0-9a-zA-Z]{24}, SLACK=xox[baprs]-[0-9A-Za-z-]+,\n\
      \     JWT=eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+,\n     PEM=-----BEGIN (RSA|EC|OPENSSH|PRIVATE)\
      \ KEY-----)\n  THEN emit finding{repo, path, commit, author, pattern_class, confidence=HIGH}"
- question: Which commits or merge requests were blocked (or should have been blocked) by pre-commit hooks
    and CI/CD push-protection gates for introducing high-confidence secrets, and is each blocked commit
    attributable to an author, branch, and timestamp?
  context: Enforcing a pre-commit hook plus a CI/CD merge gate (push protection) prevents new high-confidence
    findings from entering the repository unless an audited false-positive baseline/suppression entry
    exists. GitHub Secret Scanning push protection offers the highest precision (~75%) and detect-secrets
    provides a baseline model. Correlating each scanner hit with Git commit metadata (author, branch,
    timestamp) makes every blocked or bypassed commit attributable, which is essential for the Harden
    tactic so that controls demonstrably stop credential exposure at the source. A positive result (commits
    being blocked) shows the control is working; absence of any blocks combined with later findings indicates
    the gate is missing or disabled.
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (event-centered on commit/merge events)
  queries:
  - technology: CI/CD pipeline pseudocode
    query: "ON (pre_commit_hook OR ci_merge_gate):\n  hits = scan(diff)\n  FOR h in hits WHERE h.confidence\
      \ == HIGH AND h NOT IN baseline_suppressions:\n    BLOCK commit/merge\n    log{action=BLOCKED, author,\
      \ branch, timestamp, repo, pattern_class}\n  emit attributable_record per blocked commit"
- question: For each detected secret, is the credential still ACTIVE at the issuing provider, or has it
    already been revoked, so that active leaked credentials can be escalated as higher-severity incidents?
  context: After a finding, classifying the secret's state by querying the issuing provider (active vs.
    revoked) where supported (e.g., GitHub Secret Scanning validity checks) distinguishes a benign already-dead
    key from a live, exploitable credential. An ACTIVE leaked credential is a distinct higher-severity
    case requiring immediate revoke-then-rotate per OWASP guidance. Because validity checks require external
    lookups, keep primary detection on first-party repo/CI logs and treat the provider API result strictly
    as enrichment. In the Harden tactic, confirming a credential is still usable prioritizes remediation
    effort toward the leaks that actually expose sensitive systems to an external actor.
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (re-validate on each new finding)
  queries:
  - technology: Enrichment/Validity-check pseudocode
    query: "FOR each finding f:\n  state = provider_validity_lookup(f.secret)   // active | revoked |\
      \ unknown\n  enrich f with state\n  IF state == ACTIVE: severity = HIGH; action = REVOKE_THEN_ROTATE\n\
      \  ELSE: severity = MEDIUM\n  NOTE: detection stays on repo/CI logs; provider result is enrichment\
      \ only"
- question: Which candidate strings longer than 20 characters exhibit anomalously high Shannon entropy
    (Base64 above ~4.5 bits/char, Hex above ~3.0 bits/char relative to a per-repository/language 95th-percentile
    baseline), especially when assigned near terms like password, key, secret, or token?
  context: Computing Shannon entropy for long candidate strings and baselining the cutoff per repository/language
    (recomputed as a 95th-percentile threshold) surfaces random-looking secrets that no fixed regex covers,
    while avoiding generic-string noise. Boosting the score when the string sits near lexical context
    such as password, key, secret, or token improves precision. Entropy alone is the top false-positive
    source (comparative study), so length plus lexical-context co-signals are required. This statistical
    layer complements deterministic rules in the Harden tactic by catching custom or rotated secrets before
    they leak; a high-entropy hit near a credential keyword is a strong prioritization signal, whereas
    entropy without context should be deprioritized.
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (scan full history for baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each token len>20 in repo:\n  e = shannon_entropy(token)\n  charset = classify(token)\
      \  // base64 | hex | other\n  thr = percentile95(entropy_baseline[repo][language][charset])\n  IF\
      \ (charset==base64 AND e>=4.5) OR (charset==hex AND e>=3.0) OR e>=thr:\n    score = base\n    IF\
      \ token assigned near {password,key,secret,token}: score += boost\n    IF context_keyword_present:\
      \ flag(token, score) ELSE deprioritize"
- question: What are the trends in secret-density and remediation metrics — findings per KLOC, confirmed-true
    rate (baseline ~15%), new findings per day, reopened findings, and mean time to revoke/rotate exposed
    credentials — broken down by team and repository, and are any of these trending adversely?
  context: Measuring volume and frequency control-health metrics quantifies whether the credential-scrubbing
    program is improving or degrading. Tracking findings per KLOC, the confirmed-true rate (SecretBench
    baseline ~15% true), new findings/day, reopened findings, and mean time to revoke/rotate by team and
    repository lets an analyst alert on adverse trends that indicate a control breakdown. In the Harden
    tactic, a rising density or slowing time-to-rotate means exposure windows are widening, increasing
    the chance an external actor harvests a live credential. A stable or improving trend confirms scrubbing
    is effective; an adverse spike warrants investigation into the responsible team or repository.
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (weekly trend windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "GROUP findings BY team, repo, week:\n  metrics = {\n    findings_per_kloc = count/ (loc/1000),\n\
      \    confirmed_true_rate,            // baseline ~0.15\n    new_findings_per_day,\n    reopened_findings,\n\
      \    mean_time_to_revoke_rotate }\n  ALERT IF any metric trends adverse vs prior windows (e.g. density\
      \ up, MTTR up)"
- question: Which authors or pipelines show unusual counts or rates of commits blocked by push protection,
    suppression/allowlist additions, or findings that bypassed gates (committed despite a rule), suggesting
    they are routing around scrubbing controls?
  context: Explicitly tracking failure-mode signals — the count and rate of commits blocked by push protection,
    suppression/allowlist additions per author, and findings that bypass gates — surfaces developers or
    pipelines that circumvent scrubbing controls. Spikes in suppressions or bypasses are a distinct alert
    because they represent a deliberate or accidental weakening of the Harden control surface, the kind
    of gap an insider could exploit or an external actor could benefit from. A positive result (one author
    repeatedly suppressing or bypassing) warrants direct follow-up and possible policy enforcement; flat,
    low rates indicate the control is being respected.
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (per-author/per-pipeline aggregation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "GROUP BY author, pipeline:\n  blocked = count(action==BLOCKED)\n  suppressions = count(allowlist_or_baseline_add)\n\
      \  bypasses = count(finding committed despite rule)\n  ALERT IF suppressions OR bypasses spike above\
      \ author/pipeline baseline"
- question: When a supervised classifier scores new commits using length, character-set mix, n-grams,
    entropy, and lexical context, which commits are predicted to contain true credentials, and what are
    the top-3 contributing features for each high-scoring finding?
  context: 'A supervised classifier trained on labeled credential/non-credential snippets (e.g., SecretBench:
    97,479 candidates, 15,084 true) using length, charset mix, n-grams, entropy, and lexical context can
    score new commits in near real time and prioritize likely true positives beyond what regex and entropy
    alone catch. Alert text must surface the top-3 contributing features (e.g., the entropy value, the
    neighboring identifier, the matched pattern class) so triage is explainable. In the Harden tactic
    this ML layer reduces the analyst''s workload by ranking findings, ensuring the most probable live
    secrets are revoked first. A high model score with strong contributing features is a priority finding;
    a low score with weak features can be deprioritized but not ignored.'
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (score on each new commit)
  queries:
  - technology: ML/Classifier pseudocode
    query: "model = supervised_clf(features=[length, charset_mix, ngrams, entropy, lexical_context])\n\
      FOR each new commit snippet s:\n  p = model.predict_proba(s)\n  IF p >= threshold:\n    emit finding{score=p,\
      \ top3_features=model.explain(s)}"
- question: After regex and entropy detectors produce candidate secrets, does a locally-deployed fine-tuned
    LLM confirm each candidate as a true secret while citing the specific context span that justifies
    its decision, thereby reducing false positives without losing recall?
  context: Feeding regex/entropy candidates to a fine-tuned, locally-deployed LLM for context-aware binary
    or multiclass classification cuts false positives while maintaining high recall (Rahman et al. report
    fine-tuned LLaMA-3.1 8B F1 = 0.9852 on an 818-repo benchmark). Running small fine-tuned models on
    first-party data offline avoids any mandatory external API and keeps sensitive code in-house. Requiring
    the model to output the contributing context span that justifies each decision makes the triage explainable
    and auditable. In the Harden tactic, this final triage stage ensures analysts spend remediation effort
    on genuine credential leaks rather than chasing noise; a model confirmation with a clear justifying
    span is actionable, while a rejection with a coherent rationale safely closes a candidate.
  answer_sources:
  - Source code repositories (e.g., Git, SVN)
  - SAST/Secret scanner tool logs
  - Git commit history
  - 'NAI: Enterprise Git servers, Developer workstations, and CI/CD pipeline environments'
  range: Last 90 days (triage queue of candidate findings)
  queries:
  - technology: ML/LLM-triage pseudocode
    query: "candidates = regex_hits UNION entropy_hits\nFOR c in candidates:\n  verdict, span = local_finetuned_llm.classify(c,\
      \ context_window)\n  IF verdict == SECRET: confirm finding, attach justifying_span = span\n  ELSE:\
      \ close candidate with rationale = span\n  // model runs offline on first-party data, no external\
      \ API"
