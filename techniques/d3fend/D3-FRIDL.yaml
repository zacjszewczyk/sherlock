name: 'D3-FRIDL: Forward Resolution IP Denylisting'
id: 27a6feae-8380-4f7a-b379-cbdd837bc4ec
description: Investigate the effectiveness of Forward Resolution IP Denylisting - the control that blocks
  a DNS lookup answer's IP address value when that address is deemed malicious. This playbook helps an
  analyst verify that resolved A/AAAA answer IPs are extracted, evaluated against curated malicious IP/CIDR/ASN
  feeds, and rewritten or dropped (e.g., via RPZ IP-trigger policies), and that no successful follow-on
  communication reaches denied IPs (an enforcement gap, often caused by DoH/DoT, cached IPs, or proxy
  networks). Because public IP/domain denylists cover under 20% of malicious infrastructure and decay
  within hours to days, deterministic matching is layered with sinkhole/parked-domain false-positive filtering,
  stale-entry aging, statistical trend and surge profiling, resolution-failure (NXDOMAIN/SERVFAIL/RPZ-block)
  rate analysis, and machine-learning approaches (interpretable IP-risk scoring, shared-infrastructure
  clustering, and unsupervised anomaly detection) to expand coverage and prioritize likely active C2 or
  campaign infrastructure for review and remediation.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are we extracting every answer A/AAAA IP from each DNS response and deterministically matching
    it against a curated malicious IP/CIDR/ASN denylist, and is each match being alerted with full context
    (the matched IP, the CIDR/ASN, the feed/rule that fired, and the resolving client)?
  context: 'This is the core enforcement primitive of Forward Resolution IP Denylisting under the Isolate
    tactic: the resolver must inspect the IP value(s) returned in forward-resolution responses and block
    or rewrite them when they fall in a known-bad range. The analyst should pull every answer IP from
    Zeek dns.log, confirm the resolver rewrite occurred via Windows DNS Server Analytic Event 257 or the
    RPZ policy-hit log, and match against a low-false-positive curated feed such as Spamhaus DROP/EDROP/ASN-DROP.
    RPZ IP-trigger policies are the standard enforcement mechanism. A positive result (a match that fired
    a rule) confirms the control engaged; a match present in dns.log with no corresponding rewrite/policy-hit
    is a coverage gap where the resolver failed to enforce. Alert text must carry enough context for an
    analyst to triage the resolving client immediately. References: [DNS Response Policy Zones, Vixie
    & Schryver](https://datatracker.ietf.org/doc/html/draft-vixie-dnsop-dns-rpz-00); [Spamhaus DROP/EDROP/ASN-DROP](https://www.spamhaus.org/blocklists/do-not-route-or-peer/).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for resp in zeek_dns_log:\n  for ip in resp.answers where ip is A or AAAA:\n    if ip in denylist(IP|CIDR|ASN):\
      \  # e.g. Spamhaus DROP/EDROP/ASN-DROP\n      verify_rewrite = lookup(win_dns_event_257 OR rpz_policy_hit,\
      \ ip)\n      alert(matched_ip=ip, cidr_or_asn=denylist.match,\n            feed_or_rule=denylist.source,\
      \ client=resp.id_orig_h,\n            enforced=verify_rewrite)"
- question: Before treating a denylist hit as confirmed-malicious, are we suppressing the two well-documented
    false-positive classes - security-organization sinkhole IPs and parked domains - by tagging (not deleting)
    hits that resolve to known sinkhole ranges or parking name servers so analysts can see why severity
    was downgraded?
  context: 'Denylist hits are noisy: many flagged IPs are security-research sinkholes (which are benign
    re-pointing of malicious domains) or parked domains, both of which inflate false positives and erode
    analyst trust in the Isolate control. Using graph-based sinkhole identification and parked-domain
    heuristics, maintain an allowlist of known sinkhole netblocks and parking name servers. When a denylist
    hit resolves into one of those, tag it and downgrade severity rather than deleting it, preserving
    the audit trail. A positive result here means a hit was correctly reclassified as low-severity; failure
    to filter these classes will bury genuine C2 isolation events under noise. References: [Paint it Black,
    Kührer et al.](https://christian-rossow.de/publications/blacklists-raid2014.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for hit in denylist_hits:\n  if hit.answer_ip in known_sinkhole_ranges\n     or hit.query.ns\
      \ in parking_nameservers:\n    hit.severity = downgrade\n    hit.tag = 'sinkhole/parked - FP-suppressed'\n\
      \  else:\n    hit.tag = 'confirmed-malicious-candidate'\n  keep(hit)  # never delete; preserve audit\
      \ trail"
- question: After a malicious-IP DNS match, did the client still successfully connect to that denied IP
    - i.e., is there a Zeek conn.log session on the (client, answer IP) tuple within ~60s with a success
    conn_state and bytes transferred - indicating an enforcement failure that needs immediate remediation?
  context: 'Denylisting only prevents the client from learning the IP via DNS; it does not stop a client
    that already has the IP (cached, hardcoded, or obtained via DoH/DoT or a proxy network). To validate
    the Isolate control end-to-end, correlate each malicious-IP DNS match with conn.log on the (client,
    answer IP) tuple inside a short window (e.g., 60s). Record Volume (orig/resp bytes), Frequency (connections/min),
    and State (conn_state: SF/S1/OTH with bytes = success vs. REJ/RSTO = blocked). Any successful session
    to an IP that should be denied is an enforcement failure and corroborates static-list evasion via
    DoH/DoT or cached IPs - escalate for immediate correction. Blocked/rejected sessions to denied IPs
    confirm the control is working downstream. References: [Defending Against ORB Proxy Networks, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days; correlate conn.log within 60s of each DNS match
  queries:
  - technology: Zeek/pseudocode
    query: "for match in denylist_hits:\n  sessions = zeek_conn_log where id_orig_h==match.client\n  \
      \           and id_resp_h==match.answer_ip\n             and ts within [match.ts, match.ts+60s]\n\
      \  for s in sessions:\n    if s.conn_state in {SF,S1,OTH} and (s.orig_bytes+s.resp_bytes)>0:\n \
      \     escalate(ENFORCEMENT_FAILURE, volume=s.orig_bytes+s.resp_bytes,\n               freq=count/min,\
      \ state=s.conn_state)  # likely DoH/DoT/cached IP\n    elif s.conn_state in {REJ,RSTO,RSTR}:\n \
      \     record(BLOCKED_OK)"
- question: Are denylist entries aged out by last-confirmed-malicious timestamp and observed answer TTL
    (flagging entries unrefreshed for >30 days for review), and are we also flagging denylist misses -
    known-bad answer IPs that appear in no feed - given that public lists cover under 20% of malicious
    infrastructure?
  context: 'Adversary IP infrastructure decays within hours to days, so stale denylist entries cause false
    positives on reassigned ranges while gaps cause missed isolation. This question addresses both failure
    modes for the Isolate tactic. Age entries by their last-confirmed-malicious timestamp and observed
    TTL; flag any unrefreshed for more than 30 days for analyst review to prevent blocking legitimately
    re-allocated netblocks. Simultaneously, hunt denylist misses - answer IPs corroborated as malicious
    by other signals but absent from every feed - because the union of public lists is incomplete. A positive
    result is a healthy, fresh feed with no detectable misses; stale entries or frequent misses indicate
    the feed needs refresh or augmentation. References: [Defending Against ORB Proxy Networks, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies);
    [Paint it Black, Kührer et al.](https://christian-rossow.de/publications/blacklists-raid2014.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for e in denylist_entries:\n  if now - e.last_confirmed_malicious > 30d:\n    flag(e, 'STALE\
      \ - review for reassignment')\nfor ip in observed_answer_ips:\n  if ip corroborated_malicious(other_signals)\
      \ and ip not in any_feed:\n    flag(ip, 'DENYLIST_MISS - public lists cover <20%')"
- question: What do 30-day denylist hit ratios look like when blocked/answer IPs are summarized by ASN,
    country, and recurrence - which IPs/ASNs rank highest by answer-IP overlap across many domains/clients
    and by ASN/geo dispersion, and do site-specific thresholds (e.g., top 5th percentile of hit frequency)
    surface likely active C2 or campaign infrastructure?
  context: 'Shared infrastructure is a robust indicator: malicious answer IPs reused across many domains
    or clients, and dispersed across ASNs/geographies, signal active campaign or C2 infrastructure that
    the Isolate control should prioritize. Compute 30-day hit ratios and aggregate blocked/answer IPs
    by ASN, country, and recurrence; rank by answer-IP overlap (an IP seen for many distinct domains)
    and by ASN/geo dispersion. Derive thresholds from your own baseline rather than absolutes - e.g.,
    flag IPs/ASNs in the top 5th percentile of hit frequency. A positive result is a small set of high-overlap,
    high-dispersion IPs/ASNs that merit denylist prioritization and proactive blocking. References: [FluxBuster,
    Perdisci et al.](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf);
    [EXPOSURE, Bilge et al.](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "window = last_30d\nstats = group blocked_answer_ips by ASN, country:\n  hit_ratio, recurrence,\n\
      \  domain_overlap = distinct_domains_per_ip,\n  geo_asn_dispersion = distinct_asn_or_geo_per_ip\n\
      rank by domain_overlap desc, dispersion desc\np95 = percentile(hit_frequency, 95)\nflag ips/asns\
      \ where hit_frequency >= p95  # likely active C2/campaign"
- question: Are daily and per-client blocked-resolution volumes monitored with control limits or forecast
    intervals (e.g., mean + 3-sigma or seasonal forecast bands) to detect spikes indicating broad scanning
    waves or new campaigns, with alert text naming the top-3 contributing clients/ASNs/domains driving
    the surge?
  context: 'A sudden surge in blocked resolutions often marks a new campaign, a scanning wave, or a newly
    infected host beating against C2 - all directly relevant to the Isolate tactic. Track daily and per-client
    blocked-resolution counts and apply real-time control limits (mean + 3-sigma) or seasonal forecast
    bands; a value breaching the upper band is a spike worth investigating. To make alerts actionable,
    decompose each surge into its top-3 contributing clients, ASNs, and domains. A positive result is
    a statistically anomalous spike attributable to specific clients/infrastructure; steady-state volume
    within bands indicates normal background blocking. References: [Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = daily and per_client blocked_resolution_count\nucl = mean(series) + 3*stddev(series)\
      \   # or seasonal forecast band\nfor day,client in series:\n  if count > ucl:\n    top3 = top_n(contributors(day,client),\
      \ by=count,\n                 dims=[client,asn,domain], n=3)\n    alert(SURGE, value=count, limit=ucl,\
      \ top3=top3)"
- question: Are per-client NXDOMAIN, SERVFAIL, and RPZ-blocked (NXDOMAIN/NODATA rewrite) ratios and per-minute
    rates tracked as distinct signals, and do we alert when a client's failed-resolution ratio exceeds
    its baseline by a tunable factor (e.g., >3x or >30% of that client's queries), indicating DGA churn
    or denylist-evasion attempts?
  context: 'Error and failure responses are discriminative signals, not noise: sustained elevated NXDOMAIN
    suggests DGA churn (malware cycling through algorithmically generated domains), elevated SERVFAIL
    can indicate resolution problems or evasion, and RPZ-blocked rewrites directly count Isolate-control
    actions. Track these per client as ratios and per-minute rates, build a per-client baseline, and alert
    when the failed-resolution ratio exceeds baseline by a tunable factor (e.g., >3x or >30% of that client''s
    total queries). A positive result is a host whose failure profile spikes well above its own norm -
    a strong lead for DGA-based C2 or denylist-evasion behavior. References: [Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per client, per minute:\n  nxdomain_ratio  = nxdomain / total_queries\n  servfail_ratio  =\
      \ servfail / total_queries\n  rpz_block_ratio = rpz_rewrite(NXDOMAIN|NODATA) / total_queries\nbaseline\
      \ = rolling_baseline(client.failed_ratio)\nif client.failed_ratio > max(3*baseline, 0.30):\n  alert('DGA\
      \ churn / denylist-evasion', client, ratios)"
- question: Have we trained an interpretable IP-risk model (decision tree / gradient boosting) on first-party
    passive-DNS features - ASN/CIDR/country dispersion of the resolved answer-IP set, IP churn, prior
    block frequency, requester dispersion, domain age, and passive reputation - to pre-stage candidate
    IPs for denylist review before confirmed abuse, surfacing the top-3 contributing features in each
    alert?
  context: 'Because static feeds are incomplete and lag adversary infrastructure, an interpretable supervised
    model can predict the maliciousness of newly seen answer IPs from your own passive-DNS telemetry,
    expanding Isolate coverage proactively. Features mirror proven research (Notos: 96.8% TPR / 0.38%
    FPR; Kopis: works with first-party visibility and no prior IP reputation; EXPOSURE J48 features):
    answer-IP set dispersion across ASN/CIDR/country, IP churn, prior block frequency, client/requester
    dispersion, domain age, and passive reputation. Use a decision tree or gradient boosting so the tree
    path / feature importances are explainable. Outputs pre-stage candidate IPs for analyst-driven denylist
    addition before abuse is confirmed; always surface the top-3 contributing features so the analyst
    can validate the prediction rather than trust a black box. References: [Notos, Antonakakis et al.](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf);
    [Kopis, Antonakakis et al.](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Antonakakis.pdf);
    [EXPOSURE, Bilge et al.](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = {answer_ip_asn_cidr_country_dispersion, ip_churn,\n            prior_block_freq,\
      \ requester_dispersion, domain_age,\n            passive_reputation}\nmodel = GradientBoosting()/DecisionTree()\
      \  # interpretable\nmodel.fit(historical_passive_dns_labeled)\nfor ip in newly_seen_answer_ips:\n\
      \  risk = model.predict_proba(features(ip))\n  if risk > threshold:\n    prestage(ip, denylist_review,\
      \ top3=feature_importances(ip))"
- question: Are we clustering domains by their shared resolved-IP sets and classifying fast-flux / shared
    malicious infrastructure (e.g., a C4.5 approach using IP-set growth and ASN/geo spread features),
    and do alerts name the cluster's most-shared IPs/ASNs so we can expand denylist coverage where static
    feeds miss rotating infrastructure?
  context: 'Fast-flux and shared malicious infrastructure rotate IPs rapidly, defeating static feeds but
    exhibiting structure: many domains map to overlapping resolved-IP sets that grow and spread across
    ASNs/geographies. Clustering domains by their shared answer-IP sets (a C4.5 / FluxBuster-style approach)
    identifies this rotating infrastructure weeks before public blacklists, directly extending the Isolate
    control to coverage gaps. Alerts must name the cluster''s most-shared IPs and ASNs so an analyst can
    act on the highest-value block targets. A positive result is a coherent cluster of domains sharing
    rotating IPs - a fast-flux / shared-infrastructure campaign worth denylisting at the IP/ASN level.
    References: [FluxBuster, Perdisci et al.](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "build bipartite graph(domain <-> resolved_ip_set)\nclusters = cluster_domains_by_shared_ip_sets()\n\
      for c in clusters:\n  feats = {ip_set_growth, asn_spread, geo_spread}\n  label = C45_classify(feats)\
      \  # fast-flux / shared-infra\n  if label == malicious:\n    alert(cluster=c, most_shared=top_ips_asns(c))"
- question: For unlabeled, low-latency operation, are we scoring per-response feature vectors (answer-IP
    dispersion, TTL behavior, query lexical/volume features, failure-rate context) with an Isolation Forest
    baselined on benign top-rank resolutions - running in parallel with (never replacing) the deterministic
    denylist and surfacing the top-3 features driving each anomaly score?
  context: 'Labeled data is scarce and adversaries adapt, so an unsupervised anomaly detector complements
    the deterministic Isolate control by flagging novel suspicious resolutions the feeds have never seen.
    Train an Isolation Forest on benign top-rank resolutions and score per-response feature vectors: answer-IP
    dispersion, TTL behavior, query lexical and volume features, and failure-rate context. It must run
    in parallel with the deterministic denylist, never replacing it, so confirmed-bad matching still fires
    reliably. Surface the top-3 features driving each anomaly score so analysts can triage. A positive
    result is a high-anomaly resolution with explainable feature drivers - a candidate for IP-risk review
    and possible denylist addition. References: [Ahmed et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Event Log ID 257
  - Zeek conn.log
  - RPZ / DNS-firewall policy-hit log
  - Curated IP/CIDR/ASN denylist feed (e.g., Spamhaus DROP)
  - 'NAI: Internal DNS Resolvers, Network Egress Points/Firewalls'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "iforest = IsolationForest().fit(benign_top_rank_resolutions)\nfor resp in dns_responses:\n\
      \  fv = features(answer_ip_dispersion, ttl_behavior,\n                query_lexical, query_volume,\
      \ failure_rate_ctx)\n  score = iforest.anomaly_score(fv)\n  if score > threshold:\n    surface(resp,\
      \ score, top3=feature_contributions(fv))\n  # runs in PARALLEL with deterministic denylist, never\
      \ replaces it"
