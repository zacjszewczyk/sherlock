name: 'D3-MAN: Message Authentication'
id: c50d3b58-e1d8-4d17-9366-e34ca1ffa83c
description: 'Investigate the implementation status, coverage, and effectiveness of cryptographic message
  authentication and integrity controls across key services. This playbook helps an analyst verify that
  sender-authentication and message-integrity mechanisms are present, enforced, and not being downgraded
  or bypassed: SPF/DKIM/DMARC and STARTTLS/MTA-STS for email, DNSSEC validation for DNS, SMB signing for
  file shares and domain controllers, and TLS/SSL certificate validation, cipher strength, and IPsec integrity
  for transport. It combines deterministic verdict rules (e.g., DNSSEC AD-flag and SERVFAIL inspection,
  email authentication failures, unsigned SMB sessions, weak-cipher and certificate-validation failures),
  statistical baselines of pass/fail rates and coverage, and machine-learning detectors (DMARC forecasting,
  lateral-phishing and BEC detection, authenticated-traffic clustering) to surface spoofing campaigns,
  machine-in-the-middle/relay attempts, configuration gaps, and active tampering against the organization''s
  authentication posture.'
type: technique
related:
- tactic_id: D3-MH
  tactic_name: Message Hardening
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are responses for internal or high-value DNS zones being returned WITHOUT the DNSSEC Authenticated
    Data (AD) flag set, and are validation SERVFAILs occurring on zones that are normally signed?
  context: Supports Message Hardening by confirming DNS responses are cryptographically validated. Per
    RFC 4033, a validating resolver only sets the AD flag when the full DNSSEC chain verifies; the absence
    of AD on critical zones means validation is disabled or broken (a configuration gap), while a SERVFAIL
    on a zone that is normally signed is a tamper or misconfiguration signal. As Chung et al. show, merely
    publishing DNSSEC records is insufficient without resolver-side validation, so a high count of non-AD
    responses for critical domains should be treated as a weakened-authentication condition. A positive
    finding indicates DNS answers cannot be trusted to be authentic and may have been spoofed or manipulated;
    a negative finding confirms validation is active for those zones.
  answer_sources:
  - Zeek dns.log
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '>-

      from dns.log

      where query in CRITICAL_ZONES

      and (AA_or_AD_flag == false)

      | join validation_servfail = (rcode == SERVFAIL and query in NORMALLY_SIGNED_ZONES)

      | count by query, resolver

      | alert when non_AD_count > threshold or servfail_count > 0'
- question: Is inbound email failing SPF, DKIM, or DMARC authentication, or arriving with ambiguous/multiple
    From headers and RFC5321-vs-RFC5322 mismatches that bypass authentication?
  context: 'Supports Message Hardening by deterministically flagging mail whose sender authentication
    fails. From Zeek smtp.log or mail-gateway logs, flag inbound mail where SPF returns fail/softfail
    from an unauthorized IP (RFC 7208), DKIM verification fails on a normally-signing partner domain (RFC
    6376), or DMARC identifier alignment fails or the published policy is p=none (RFC 7489). A single
    pass should not be trusted: re-parse and normalize headers and flag multiple or ambiguous From headers
    and RFC5321-vs-RFC5322 mismatches that bypass authentication checks (Chen et al.; Shen et al.). A
    positive result is a likely spoofing or impersonation attempt; a negative result indicates the message
    is properly authenticated and aligned.'
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      from smtp.log

      where spf_result in (fail, softfail) and src_ip not in authorized_senders(from_domain)

      or (dkim_result == fail and from_domain in normally_signing_domains)

      or dmarc_alignment == fail or dmarc_policy == ''none''

      or count(from_headers) > 1

      or rfc5321_from != rfc5322_from

      | alert'
- question: Are SMB sessions to domain controllers or critical file servers being negotiated WITHOUT SMB
    signing, especially any new unsigned session to a tier-0 asset?
  context: Supports Message Hardening by verifying message integrity on the file-sharing channel. From
    Zeek smb_mapping.log or Windows events, flag SMB sessions to domain controllers and critical file
    servers negotiated without signing. Unsigned SMB allows captured NTLM authentication to be relayed
    to internal services, defeating message integrity/authentication (MITRE T1557.001). Maintain an explicit
    allowlist of legacy hosts that cannot sign, and alert on any new unsigned session to a tier-0 asset.
    A positive finding exposes a relay/MITM opportunity that an attacker can abuse for lateral movement
    and privilege escalation; a negative finding confirms signing is enforced.
  answer_sources:
  - Zeek smb_mapping.log
  - Windows Security Event Logs
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '>-

      from smb_mapping.log

      where dst in (domain_controllers, critical_file_servers)

      and signing == false

      and src not in legacy_unsigned_allowlist

      | alert on new (src,dst) pairs'
- question: Has the daily SPF/DKIM/DMARC authentication-failure rate for any sending domain exceeded its
    own historical 95th percentile over a rolling 30-day window?
  context: Supports Message Hardening with a statistical baseline of email authentication health. Over
    a rolling 30-day window, compute the percentage of inbound mail passing SPF, DKIM, and DMARC versus
    fail/none, decomposed per sending domain (Volume + State metrics). Establish a per-domain baseline
    and alert when the daily authentication-failure rate for a domain exceeds its 95th percentile, indicating
    a spoofing campaign or a sudden misconfiguration (RFC 7489; Durumeric et al.). Thresholds are derived
    from each domain's own history rather than a global constant, so a positive finding is a meaningful
    deviation from that domain's normal behavior.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      from smtp.log

      | bin by day, sending_domain

      | compute fail_rate = fails / total for spf, dkim, dmarc

      | baseline p95 = percentile(fail_rate, 95) over trailing 30d per domain

      | alert when fail_rate_today > p95'
- question: Has the proportion of AD-flagged (validated) DNS responses for critical zones dropped below
    baseline, or have validation SERVFAILs exceeded the 90th-percentile daily value?
  context: Supports Message Hardening by trending DNSSEC validation coverage over time. Baseline the proportion
    of AD-flagged (validated) responses among all responses for critical zones and the rate of validation
    SERVFAILs (Frequency + Failure-mode metrics). Alert when the validated-response ratio drops below
    baseline or the SERVFAIL count exceeds the 90th-percentile daily value, which exposes disabled validation
    or active tampering (Chung et al.). A positive finding indicates DNS authenticity coverage has regressed
    or is being attacked; a negative finding confirms stable validation.
  answer_sources:
  - Zeek dns.log
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      from dns.log

      where query in CRITICAL_ZONES

      | bin by day

      | compute ad_ratio = ad_true / total, servfail_count

      | baseline mean(ad_ratio), p90(servfail_count)

      | alert when ad_ratio < baseline or servfail_count > p90'
- question: Is there a spike in unsigned SMB sessions or in failed/looped NTLM authentications for a host
    beyond its historical 95th percentile, consistent with LLMNR/NBT-NS poisoning or relay attempts?
  context: Supports Message Hardening by detecting active attacks against the SMB/NTLM authentication
    channel. Baseline the signed-vs-unsigned SMB session ratio and the NTLM authentication failure rate
    per host. A spike in unsigned sessions or in failed/looped NTLM authentications (Failure-mode metric)
    is consistent with LLMNR/NBT-NS poisoning and relay attempts (MITRE T1557.001); alert when either
    metric exceeds the host's historical 95th percentile. A positive finding suggests an in-progress credential-relay
    or poisoning attack; a negative finding indicates normal authentication patterns.
  answer_sources:
  - Zeek smb_mapping.log
  - Windows Security Event Logs
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      from smb_mapping.log, windows_security(EventID 4625, 4776)

      | bin by day, host

      | compute unsigned_ratio, ntlm_fail_rate

      | baseline p95 per host

      | alert when unsigned_ratio > p95 or ntlm_fail_rate > p95'
- question: Does the observed volume of DMARC aggregate-report (rua) unauthenticated mail or per-domain
    authentication failures significantly exceed a time-series forecast of expected volume?
  context: Supports Message Hardening by forecasting expected authentication-failure volume to catch large-scale
    spoofing. Build a time-series forecast (ARIMA/Prophet) of DMARC aggregate-report (rua) volume of unauthenticated
    mail purporting to use your domains, and of per-domain authentication-failure counts. Observed volume
    significantly above the predicted range indicates a large-scale spoofing campaign abusing the organization's
    domain (Hu & Wang; RFC 7489). Alert text must surface the top-3 contributing factors (source domain/ASN,
    From domain, deviation magnitude). A positive finding is a probable spoofing campaign; a negative
    finding indicates volumes are within forecast.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      series = daily DMARC rua unauthenticated_volume per from_domain

      model = Prophet/ARIMA.fit(series)

      forecast = model.predict(today)

      alert when observed > forecast.upper_bound

      explain top3(source_asn, from_domain, deviation)'
- question: Is internally-originated email from a (potentially compromised) account exhibiting lateral-phishing
    characteristics despite passing SPF/DKIM/DMARC?
  context: Supports Message Hardening by catching abuse that passes authentication. Mail from a compromised
    internal account passes SPF/DKIM/DMARC because it is genuinely from your domain, so authentication
    verdicts alone miss it. Train a random forest on first-party mail-log features - recipient-set deviation
    from the sender's historical contacts, global and local URL reputation, and phishing-intent text -
    to catch lateral phishing at fewer than four false positives per million (Ho et al.). Surface the
    top-3 features driving each alert. A positive finding indicates a likely account compromise being
    used for internal phishing; a negative finding indicates normal internal mail.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      features = [recipient_set_deviation, url_global_reputation, url_local_reputation, phishing_text_score]

      model = RandomForest.train(historical first-party mail)

      score = model.predict(message)

      alert when score > threshold (FP < 4/million)

      explain top3 features'
- question: Do fused header/authentication-anomaly, behavioral sender-recipient, and intent-classification
    signals indicate a business email compromise (BEC) attempt?
  context: Supports Message Hardening by detecting BEC via complementary, explainable detectors. Fuse
    a header/authentication-anomaly detector (SPF/DKIM/DMARC results, display-name vs. address mismatch,
    lookalike domains), behavioral sender-recipient profiling, and an NLU intent classifier (payment/wire/urgency
    lures) into explainable per-signal scores with per-organization adaptive thresholds, reporting which
    module fired (Brabec et al.). A positive finding flags a probable BEC/wire-fraud attempt and identifies
    the contributing modules; a negative finding indicates no anomalous combination of signals.
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Mail Transfer Agents (MTAs), internal DNS resolvers, critical file servers/domain controllers,
    and hosts authenticating over SMB.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      s1 = header_auth_anomaly(spf,dkim,dmarc, displayname_mismatch, lookalike_domain)

      s2 = behavioral_profile(sender, recipient)

      s3 = intent_classifier(body) # payment/wire/urgency

      fused = combine(s1,s2,s3) with per_org adaptive thresholds

      alert when fused > threshold; report firing modules'
- question: Are connections to internal critical services using non-AEAD/legacy cipher suites or failing
    certificate validation, and is STARTTLS being stripped or MTA-STS missing for partners that should
    enforce it?
  context: Supports Message Hardening by deterministically flagging weakened transport cryptography. Monitor
    Zeek ssl.log for connections to internal critical services using non-AEAD/legacy cipher suites or
    with a validation_status of 'unable to get local issuer certificate' or other certificate failures
    (Holz et al.). For mail, flag STARTTLS stripping/downgrade in smtp.log and the absence of MTA-STS
    enforcement on partners that should support it (RFC 8461; Durumeric et al.). A positive finding exposes
    a downgrade or interception opportunity that defeats message authentication/integrity in transit;
    a negative finding confirms strong, validated transport security.
  answer_sources:
  - Zeek ssl.log
  - Zeek smtp.log
  - 'NAI: Internal web servers, MTAs, VPN/IPsec gateways, Domain Controllers, and critical administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '>-

      from ssl.log

      where dst in CRITICAL_SERVICES

      and (cipher in LEGACY_NON_AEAD or validation_status != ''ok'')

      | alert

      from smtp.log where starttls_offered == false on partner expected_tls

      or mta_sts_enforced == false

      | alert'
- question: Has the percentage of TLS traffic using older versions (TLS 1.0/1.1) or non-AEAD ciphers to
    a critical service exceeded a small threshold or the 90th-percentile monthly average?
  context: Supports Message Hardening with a statistical baseline of negotiated TLS quality. Establish
    a baseline of TLS versions and cipher suites from Zeek ssl.log (Volume metric). Calculate the percentage
    of traffic using older versions (TLS 1.0/1.1) or non-AEAD ciphers and alert when it exceeds a small
    threshold (e.g., 5% of TLS traffic) or the daily count exceeds the 90th-percentile monthly average
    to a critical service (Holz et al.). A positive finding indicates a regression toward weak cryptography
    that undermines message authentication; a negative finding confirms modern, strong negotiation.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Internal web servers, MTAs, VPN/IPsec gateways, Domain Controllers, and critical administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      from ssl.log

      where dst in CRITICAL_SERVICES

      | bin by day

      | compute weak_pct = (tls10+tls11+non_aead) / total

      | baseline p90 monthly

      | alert when weak_pct > 0.05 or daily_count > p90'
- question: Is there a spike in failed/aborted TLS handshakes, fatal alerts, or certificate-validation
    errors to a critical endpoint beyond its historical 95th percentile?
  context: Supports Message Hardening by detecting downgrade, certificate-substitution, and MITM attempts.
    Baseline the rate of failed/aborted TLS handshakes and fatal alerts per service (Failure-mode + Frequency
    metrics). A spike in handshake failures or certificate-validation errors to a critical endpoint can
    indicate downgrade attempts, certificate substitution, or machine-in-the-middle; alert when the failure
    rate exceeds the service's historical 95th percentile (Durumeric et al.; Holz et al.). A positive
    finding warrants investigation for active interception; a negative finding indicates normal handshake
    behavior.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Internal web servers, MTAs, VPN/IPsec gateways, Domain Controllers, and critical administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      from ssl.log, conn.log

      where dst in CRITICAL_SERVICES

      | bin by day, service

      | compute handshake_fail_rate, fatal_alert_count, cert_error_count

      | baseline p95 per service

      | alert when any metric > p95'
- question: Do any TLS/encrypted connections fall outside the clusters that model normal authenticated
    traffic per application, indicating unauthorized services or weakened cryptography?
  context: Supports Message Hardening by modeling normal authenticated traffic and surfacing outliers.
    Cluster (e.g., DBSCAN) Zeek conn.log and ssl.log data using features such as source/destination IP,
    port, protocol, TLS version, cipher suite, and certificate status to model normal authenticated traffic
    per application; treat out-of-cluster connections as anomalies indicating unauthorized services or
    weakened cryptography (Holz et al.). Alert text must surface the top-3 features (e.g., cipher, TLS
    version, destination) that placed the connection outside its cluster. A positive finding flags a connection
    that deviates from established authenticated norms; a negative finding indicates the connection fits
    a known-good profile.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internal web servers, MTAs, VPN/IPsec gateways, Domain Controllers, and critical administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      features = [src_ip, dst_ip, port, proto, tls_version, cipher, cert_status]

      model = DBSCAN.fit(conn.log + ssl.log)

      alert on points labeled noise/outlier

      explain top3 features placing connection outside cluster'
