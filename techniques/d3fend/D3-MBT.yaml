name: 'D3-MBT: Memory Boundary Tracking'
id: c11e48e5-e7d9-40e7-8bb7-8ea92f6db27a
description: 'Investigate potential memory-corruption and code-reuse exploitation by analyzing call stacks
  and control-flow telemetry for return addresses and indirect branch targets that point to unexpected
  memory locations. This playbook helps an analyst hunt for the canonical signals of ROP/JOP exploitation
  and injected shellcode: returns/indirect branches whose targets fall outside the memory allocated for
  the relevant object (function, module, process, or thread), execution from regions carrying conflicting
  (two or more of read/write/execute) permissions or one-page-sized regions, return addresses that do
  not immediately follow a legal call site, call stacks originating in unbacked (MEM_PRIVATE, non-image)
  memory, and remote-thread injection precursors. It combines deterministic boundary and control-flow
  checks (symbolic logic), statistical baselining of return-address provenance, call-stack sequences,
  gadget-chain length, allocation/remote-thread rates, and failed/blocked exploit attempts, and machine-learning
  classification of host and hardware control-flow telemetry to score exploitation likelihood when deterministic
  rules and statistical baselines are inconclusive.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
