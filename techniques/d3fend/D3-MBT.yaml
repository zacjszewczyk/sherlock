questions:
- question: Are there any return addresses or indirect branch targets that point outside the memory previously
    allocated for the relevant object (function, module, process, or thread), or that resolve to a memory
    region holding two or more of read/write/execute permissions or that is exactly one page in length?
  context: 'This is the core Memory Boundary Tracking check for the Detect tactic. A legitimate return
    or indirect call should always land inside the bounds of a known, legally allocated and signed object.
    When a backward-edge transfer (including ret) reaches a destination outside the legal target set,
    or the destination page is RWX/RW->X or a lone one-page allocation, it is a strong indicator of code-reuse
    exploitation (ROP/JOP) or injected shellcode. Implement as a backward-edge control-flow integrity
    check: enumerate the legal target set for each transfer and flag any destination outside it. A positive
    result (target outside object boundary, or anomalous page permissions/size) should be treated as malicious
    code execution; a negative result means observed transfers stayed within expected bounds.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (Threat-Intelligence provider, stack walks)
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), User workstations, Application
    servers handling sensitive data, Internet-facing processes (browsers, document readers, web/app servers)'
  range: Last 90 days
  queries:
  - technology: EDR/Memory-protection pseudocode
    query: ">-\n  for each control_transfer (ret OR indirect_branch):\n    if target_addr NOT in allocated_object_bounds(function|module|process|thread)\n\
      \       OR page_perms(target_addr) has >=2 of {READ,WRITE,EXECUTE}\n       OR region_size(target_addr)\
      \ == 1_page:\n      raise alert(severity=high, reason=\"return/branch outside object boundary\")"
- question: For privileged or internet-facing processes, do any return addresses target an instruction
    that does NOT immediately follow a legal call instruction (i.e., returns into the middle of code or
    to gadget starts)?
  context: Legitimate returns always transfer to the instruction immediately after the call that invoked
    the function. ROP/JOP gadget chains, by contrast, redirect returns into the middle of code sequences
    or to gadget starting points that are not preceded by a call. Validating returns against legal call
    sites - using Last-Branch-Record data (kBouncer approach) or, preferably, a hardware/software shadow
    stack for backward-edge enforcement - catches these violations. Focus on privileged and internet-facing
    processes (browsers, document readers, web/app servers) where exploitation risk is highest. A violation
    (return not preceded by a call) indicates likely code-reuse exploitation; clean call-preceded returns
    indicate normal control flow.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (Threat-Intelligence provider, stack walks)
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), User workstations, Application
    servers handling sensitive data, Internet-facing processes (browsers, document readers, web/app servers)'
  range: Last 90 days
  queries:
  - technology: EDR/LBR or shadow-stack pseudocode
    query: ">-\n  for each ret in privileged_or_internet_facing_process:\n    prev = instruction_before(ret.target_addr)\n\
      \    if prev.mnemonic != CALL:\n      raise alert(reason=\"return not to call-preceded site (gadget\
      \ start)\")\n    if shadow_stack_available and ret.target_addr != shadow_stack.top():\n      raise\
      \ alert(reason=\"backward-edge shadow-stack mismatch\")"
- question: Do any call stacks contain frames whose return addresses originate from UNKNOWN or private
    (MEM_PRIVATE, non-image) memory rather than from a signed, loaded module?
  context: When you parse the Sysmon Event ID 10 (ProcessAccess) CallTrace and ETW stack walks, every
    frame in a healthy call stack should map to a signed loaded module (an image-backed region). Frames
    whose return addresses resolve to UNKNOWN or MEM_PRIVATE (non-image) memory indicate execution from
    unbacked memory - the hallmark of injected or ROP-staged code. This is a high-fidelity signal of process
    injection or shellcode execution. A positive result (UNKNOWN/private frame in the CallTrace) warrants
    immediate investigation of the source process and the unbacked region; a fully image-backed stack
    is benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (Threat-Intelligence provider, stack walks)
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), User workstations, Application
    servers handling sensitive data, Internet-facing processes (browsers, document readers, web/app servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source = Sysmon EID 10 (CallTrace) UNION ETW stack_walks\n  for each frame in call_stack:\n\
      \    if frame.region_type in {UNKNOWN, MEM_PRIVATE} and not frame.image_backed:\n      raise alert(reason=\"\
      call stack frame from unbacked memory\",\n                  pid=process.pid, region=frame.base_addr)"
- question: Has the EDR memory-protection subsystem reported any known ROP or JOP gadget-chain signatures,
    or return targets that fall outside valid module boundaries, particularly within privileged or internet-facing
    processes?
  context: EDR memory-protection engines emit detections for recognized gadget-chain signatures and for
    return targets that land outside valid module boundaries. These are direct evidence of code-reuse
    exploitation attempts. Monitoring these detections and raising high-severity incidents when they occur
    in privileged or internet-facing processes ensures the most consequential exploitation attempts are
    not lost in noise. A signature match in a sensitive process is a high-confidence exploitation indicator
    requiring containment; absence means no gadget-chain pattern was recognized in this window.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (Threat-Intelligence provider, stack walks)
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), User workstations, Application
    servers handling sensitive data, Internet-facing processes (browsers, document readers, web/app servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source = EDR Memory Protection Alerts\n  filter alert.type in {ROP_chain, JOP_chain,\
      \ return_outside_module}\n  if process in {privileged, internet_facing}:\n    set severity = critical\n\
      \  raise incident(alert, severity)"
- question: Can memory-boundary alerts be correlated with process lineage and module-load history to reveal
    that unsigned or newly loaded modules immediately preceded a boundary violation?
  context: Boundary violations rarely occur in isolation - they are usually the culmination of a payload
    delivery chain. Joining memory-boundary alerts with Windows Event ID 4688 process ancestry and Sysmon
    Event ID 7 image/module loads lets you reconstruct that chain. When an unsigned or newly loaded module
    appears just before a boundary violation, it likely represents the delivered payload that staged the
    exploitation. Escalating these cases helps distinguish opportunistic noise from a coherent attack
    sequence. A positive correlation (unsigned/new module -> boundary violation in the same process lineage)
    is a strong delivery-chain indicator; no correlation suggests an isolated or false event.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (Threat-Intelligence provider, stack walks)
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), User workstations, Application
    servers handling sensitive data, Internet-facing processes (browsers, document readers, web/app servers)'
  range: Last 90 days; pivot +/- 10 minutes around each boundary alert
  queries:
  - technology: SIEM/Correlation pseudocode
    query: ">-\n  boundary = memory_boundary_alerts\n  join Sysmon EID 7 (module_load) ON pid WHERE load_time\
      \ < boundary.time AND load_time > boundary.time-10m\n  join Windows EID 4688 (process_create) ON\
      \ pid for ancestry\n  if module.signed == false OR module.first_seen_recent:\n    escalate(reason=\"\
      unsigned/new module precedes boundary violation\", chain=ancestry)"
- question: Did any process create a remote thread in another process (Sysmon Event ID 8), especially
    where the source is not a known system process or debugger, or where the remote thread's start address
    points into RWX or MEM_PRIVATE memory?
  context: Remote thread creation is a classic process-injection precursor to memory-boundary violations.
    Sysmon Event ID 8 (CreateRemoteThread) captures these events. Legitimate remote-thread creation is
    limited to a small set of system processes (e.g., lsass.exe) and debuggers; anything else is suspicious.
    The strongest signal is a remote thread whose start address points into an RWX or MEM_PRIVATE region,
    which indicates the injecting process placed executable shellcode in the target. Alerting on these
    establishes the injection that later manifests as boundary violations or unbacked call stacks. A positive
    result (anomalous source or RWX/private start address) is a strong injection indicator; benign system-to-system
    thread creation can be tuned out.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (Threat-Intelligence provider, stack walks)
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), User workstations, Application
    servers handling sensitive data, Internet-facing processes (browsers, document readers, web/app servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source = Sysmon EID 8 (CreateRemoteThread)\n  if SourceImage NOT in known_system_or_debugger_allowlist\n\
      \     OR start_address.region in {RWX, MEM_PRIVATE}:\n    raise alert(reason=\"remote thread injection\
      \ precursor\",\n                src=SourceImage, dst=TargetImage, start=StartAddress)"
- question: After baselining your environment's distribution of consecutive short gadget runs (instruction
    sequences ending in indirect branches) observed at API/syscall entry, are any sequences exceeding
    the tuned gadget-length and chain-count thresholds?
  context: 'ROP/JOP exploitation strings together short instruction sequences (gadgets) that each end
    in an indirect branch. By baselining the benign distribution of consecutive short gadget runs at API/syscall
    entry points, you can derive an environment-specific cutoff and alert above it. A reasonable starting
    point is gadget length <= 5 instructions and chains >= 3-8 gadgets, then refine from your own data.
    Importantly, this threshold is tunable, not fixed: attackers can craft long-instruction and call-preceded
    gadgets that evade static thresholds, so this check must be layered with the symbolic-logic and ML
    checks rather than relied on alone. Exceeding the tuned threshold suggests a gadget chain; staying
    within baseline suggests normal call patterns.'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - Windows Event ID 1000/1001 (Application Error / WER)
  - ETW (stack walks)
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days for baseline; alert on current window
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = distribution(consecutive_short_gadget_runs at API/syscall_entry) over 90d\n\
      \  threshold = derive_cutoff(baseline)   # seed: gadget_len<=5, chain>=3..8\n  for each candidate_chain:\n\
      \    if chain.gadget_count >= threshold.chain and chain.avg_len <= threshold.len:\n      raise alert(reason=\"\
      gadget-chain length above tuned threshold\")\n  # layer with symbolic + ML checks; do not rely on\
      \ length alone"
- question: Does any critical program's current system-call and call-stack/return-address sequence deviate
    from its learned sliding-window n-gram model, or score as a low-probability transition under a call-stack-aware
    Hidden Markov Model?
  context: Normal program execution produces a predictable stream of system calls and call-stack/return-address
    states. Building a sliding-window n-gram model of these sequences per critical program (the 'Sense
    of Self' approach) lets you alert when the mismatch rate exceeds a learned threshold. Augmenting with
    a Hidden Markov Model over system-call plus call-stack return-address states scores low-probability
    transitions that simple n-grams miss. Control-flow hijacking and code reuse perturb these sequences,
    producing anomalous transitions. A high mismatch rate or low-probability HMM transition indicates
    anomalous control flow worth investigating; sequences matching the model indicate normal behavior.
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - Windows Event ID 1000/1001 (Application Error / WER)
  - ETW (stack walks)
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days for model training; score current window
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  model = ngram_sliding_window(syscall + callstack_return_seq) per critical_program\n\
      \  hmm = HMM(states = syscall x callstack_return_addr)\n  for each window:\n    if model.mismatch_rate(window)\
      \ > learned_threshold\n       OR hmm.transition_prob(window) < low_prob_cutoff:\n      raise alert(reason=\"\
      anomalous call-stack/syscall sequence\")"
- question: For critical processes, do current DLL/module sets, load order, boundary-alert frequency,
    or allocation sizes fall outside the 95th-99th percentile of modeled norms - for example a sudden
    increase in rare-module usage before a violation or unusually large RWX/MEM_PRIVATE allocations preceding
    execution?
  context: Each critical process has a characteristic profile of loaded modules, the order in which they
    load, how often boundary alerts fire, and the size and type of its memory allocations. Modeling these
    and flagging events beyond the 95th-99th percentile surfaces injection and exploitation that perturb
    the process's normal memory behavior. Of particular interest are sudden spikes in rare-module usage
    just before a violation and unusually large RWX or MEM_PRIVATE allocations preceding execution - both
    are consistent with payload staging. Values outside the percentile bands warrant investigation; values
    within them reflect the process's normal footprint.
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - Windows Event ID 1000/1001 (Application Error / WER)
  - ETW (stack walks)
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days for baseline; evaluate current window
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each critical_process:\n    profile = model(dll_set, load_order, boundary_alert_freq,\
      \ alloc_size_type) over 90d\n    if current.rare_module_usage > p95(profile)\n       OR current.alloc_size\
      \ > p99(profile.alloc and region in {RWX,MEM_PRIVATE})\n       OR current.boundary_alert_freq >\
      \ p99(profile):\n      raise alert(reason=\"module/allocation behavior outside norm\")"
- question: Are the hourly rates of memory-boundary detections, remote-thread creations, and UNKNOWN-CallTrace
    executions sustained at elevated levels (high rolling z-scores) for any process family, as opposed
    to one-off spikes?
  context: A single boundary detection or crash may be a benign one-off, but sustained elevation indicates
    an active exploitation campaign. Tracking hourly rates of memory-boundary detections, remote-thread
    creations, and UNKNOWN-CallTrace executions and computing rolling z-scores by process family (the
    Frequency dimension) lets you distinguish persistent attack activity from noise. Escalating sustained
    high z-scores focuses analyst attention on ongoing campaigns. A persistently elevated rate (high rolling
    z-score over multiple intervals) indicates active exploitation; transient single-interval spikes are
    more likely benign.
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - Windows Event ID 1000/1001 (Application Error / WER)
  - ETW (stack walks)
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days, hourly buckets
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  metrics = hourly_count({boundary_detections, remote_threads, unknown_calltrace_exec})\n\
      \  for each process_family:\n    z = rolling_zscore(metrics[process_family], window=24h)\n    if\
      \ z > threshold and sustained(z, intervals>=3):\n      escalate(reason=\"sustained elevated control-flow\
      \ anomaly rate\")"
- question: Are there spikes in application crashes (Windows Application Error EID 1000 / WER EID 1001,
    DEP/CFG access violations) or EDR-blocked memory-protection events for any internet-facing process,
    indicating repeated failed exploit attempts?
  context: Failure is itself a signal. Unreliable ROP/JOP and ASLR-defeat attempts frequently crash the
    target process before they succeed, so a spike in application crashes or blocked memory-protection
    events (the State dimension) often precedes or accompanies an eventual successful exploit. Baselining
    and alerting on these crash and block rates for internet-facing processes - especially DEP/CFG access
    violations captured by Windows Application Error EID 1000 / WER EID 1001 - surfaces exploitation attempts
    in progress. A crash/block spike for an internet-facing process suggests an active, iterating attacker;
    stable rates suggest normal operation.
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - Windows Event ID 1000/1001 (Application Error / WER)
  - ETW (stack walks)
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source = Windows EID 1000 (App Error) + EID 1001 (WER) + EDR blocked_memory_protection\n\
      \  filter reason in {DEP_violation, CFG_violation, access_violation}\n  baseline = rate per internet_facing_process\
      \ over 90d\n  if current.crash_or_block_rate > baseline + k*stddev:\n    raise alert(reason=\"spike\
      \ in failed/blocked exploit attempts\")"
- question: When deterministic boundary rules and statistical baselines are inconclusive, does a supervised
    model scoring host and EDR features (call-stack origin class, return-target class, write-execute page
    indicators, RWX/MEM_PRIVATE region size, module trust, process ancestry) classify any event as high
    exploit-likelihood - and what are the top contributing features?
  context: Deterministic checks and statistical baselines do not catch everything, especially novel or
    evasive techniques. A supervised model trained on first-party Sysmon/ETW host and EDR features - call-stack
    origin class, return-target class, write-execute page indicators, RWX/MEM_PRIVATE region size, module
    trust, and process ancestry - can score each event's exploit likelihood to fill that gap. Crucially,
    the alert must surface the top-3 contributing features (e.g., return target in unbacked memory, RWX
    region, untrusted parent) alongside the score so analysts can triage quickly and the model remains
    explainable. A high score with interpretable contributing features warrants investigation; a low score
    deprioritizes the event.
  answer_sources:
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (stack walks)
  - Intel Processor Trace / hardware control-flow traces
  - Windows Event ID 4688
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days
  queries:
  - technology: ML/Supervised classifier pseudocode
    query: ">-\n  features = [callstack_origin_class, return_target_class, write_execute_page,\n     \
      \        rwx_or_private_region_size, module_trust, process_ancestry]\n  score = model.predict_proba(features)\n\
      \  if score > alert_threshold:\n    top3 = explain(model, features)   # e.g., SHAP top contributors\n\
      \    raise alert(exploit_likelihood=score, contributing_features=top3)"
- question: Where hardware tracing is available, does a neural model classifying Intel Processor Trace
    / branch traces detect control-flow hijacking?
  context: Hardware control-flow telemetry (Intel Processor Trace, branch traces) is difficult for attackers
    to obfuscate because it is recorded by the CPU itself, making it a powerful complement to software-based
    boundary checks. Classifying these traces with a neural model (the HeNet approach) detects control-flow
    hijacking that software instrumentation might miss or that an attacker has tampered with at the software
    layer. This applies wherever hardware tracing is deployed. A positive classification on the hardware
    trace is strong, hard-to-evade evidence of control-flow hijacking; a negative classification adds
    confidence that the observed control flow was legitimate.
  answer_sources:
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (stack walks)
  - Intel Processor Trace / hardware control-flow traces
  - Windows Event ID 4688
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days
  queries:
  - technology: ML/Deep-learning pseudocode
    query: ">-\n  source = Intel Processor Trace / hardware branch_traces\n  trace_tensor = encode(branch_trace_sequence)\n\
      \  pred = neural_model.classify(trace_tensor)   # HeNet-style\n  if pred == control_flow_hijack:\n\
      \    raise alert(reason=\"hardware trace classified as control-flow hijack\")"
- question: When a return or indirect branch target lands in unexpected memory, does disassembling the
    downstream bytes into a candidate gadget chain and classifying it with a deep neural network identify
    it as ROP rather than benign code?
  context: Once a return/indirect target is found to land in unexpected memory, the downstream bytes can
    be disassembled into a candidate gadget chain and classified as ROP vs benign by a deep neural network
    (the ROPNN approach). This confirms whether the unexpected target is actually a weaponized gadget
    chain or a false positive. The alert should report the matched gadget sequence for explainability,
    and low-confidence cases should be routed back to the statistical baselines for corroboration. A ROP
    classification confirms code-reuse exploitation at that target; a benign classification helps clear
    false positives from the boundary checks.
  answer_sources:
  - Sysmon Event ID 10
  - EDR Memory Protection Alerts
  - ETW (stack walks)
  - Intel Processor Trace / hardware control-flow traces
  - Windows Event ID 4688
  - 'NAI: Critical servers, User workstations, Application servers, Internet-facing processes'
  range: Last 90 days
  queries:
  - technology: ML/Deep-learning pseudocode
    query: ">-\n  on target_in_unexpected_memory(addr):\n    bytes = read_downstream(addr)\n    candidate_chain\
      \ = disassemble(bytes)\n    pred, conf = ropnn.classify(candidate_chain)   # ROP vs benign\n   \
      \ if pred == ROP:\n      raise alert(reason=\"disassembled target classified as ROP chain\",\n \
      \                 matched_gadgets=candidate_chain)\n    elif conf < low_conf:\n      route_to_statistical_baselines(addr)"
