name: 'D3-RNA: Restore Network Access'
id: d7089409-7b98-4191-a418-2652471d9b59
description: Investigate the restoration of network access to systems that were isolated or quarantined
  during incident response. This playbook helps an analyst confirm that hosts are truly isolated before
  reconnection, gate reconnection on completed containment, eradication, and known-good baseline validation,
  verify that access was actually re-enabled at both the host and network layers, prioritize reconnection
  by business impact and predicted recovery effort, and continuously monitor restored hosts for re-isolation
  churn, failed/incomplete restores, and re-compromise. Detection logic favors Volume (bytes/host), Frequency
  (connections/min), and State (success/fail, blocked) metrics drawn from first-party telemetry such as
  Zeek conn.log, Windows filtering-platform events, firewall/switch logs, asset inventory, and incident/case-management
  records.
type: technique
related:
- tactic_id: D3-RESTORE
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Before any host is returned to the network, can you confirm from case-management records that
    containment is complete, eradication is complete, AND a known-good baseline or golden-image validation
    has passed for that host?
  context: Restoration doctrine (NIST SP 800-184, NIST SP 800-61r2, CISA Cybersecurity Incident & Vulnerability
    Response Playbooks) requires that a host only become eligible for reconnection after all three gates
    are satisfied. Reconnecting a host that has not been fully eradicated or validated against a known-good
    baseline risks re-introducing an active adversary onto the network. The analyst should cross-reference
    each candidate host against incident/case records and flag any reconnection that occurred before all
    three conditions were met, since premature restoration is a common path back to re-compromise within
    the Restore tactic.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each host h with a restore/reconnect action:
        containment = case_records[h].containment_complete
        eradication = case_records[h].eradication_complete
        baseline   = case_records[h].baseline_validated
        IF NOT (containment AND eradication AND baseline):
          ALERT 'Premature restoration: host reconnected before all gates satisfied'
        ELSE:
          MARK h eligible_for_restore_queue
- question: Which hosts are marked isolated or quarantined in the asset inventory, and can their isolation
    be independently confirmed by the absence of expected network traffic before they are added to the
    restoration queue?
  context: An authoritative restoration queue must start from hosts that are genuinely isolated. The analyst
    queries the asset inventory for quarantined/isolated state, then cross-checks Zeek conn.log and firewall
    logs to confirm the host is emitting zero non-management flows over the prior 24 hours. This matches
    CISA's phased, verified reconnection guidance. A host labeled isolated but still emitting traffic
    indicates incomplete isolation, must not be queued as 'restore', and should be re-examined as a containment
    failure.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      isolated = SELECT host FROM asset_inventory WHERE state IN ('isolated','quarantined')
      FOR each host h in isolated:
        flows = COUNT(zeek.conn WHERE (orig_h=h OR resp_h=h)
                     AND service NOT IN ('mgmt') AND ts > now-24h)
        IF flows = 0:
          ADD h TO restoration_queue
        ELSE:
          ALERT 'Incomplete isolation: host marked isolated but still emitting traffic'
- question: After a restoration action is recorded as done, is there corresponding host or firewall allow
    telemetry within the change window proving network access was actually re-enabled rather than merely
    requested?
  context: A restore marked 'done' in a ticket does not prove that access was technically re-enabled.
    Per NIST SP 800-61r2, the analyst should require host or firewall allow telemetry (e.g., Windows Event
    ID 5156 permitted-connection events or approved network-policy change records) occurring after the
    restoration action. A restore with no matching allow event inside the change window is a failed or
    unverified restore and should be flagged so it can be reworked, preventing silent gaps where a host
    appears restored but remains cut off.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each restore_action r (host=h, time=t, window=w):
        allow = EXISTS(EventID=5156 WHERE host=h AND ts BETWEEN t AND t+w)
                OR EXISTS(fw_policy_change WHERE host=h AND action='allow' AND ts BETWEEN t AND t+w)
        IF NOT allow:
          ALERT 'Unverified restore: no allow telemetry within change window'
- question: After firewall/ACL/switch rules are re-enabled for a restored host, does the host's reachable
    set match policy, and do paths into still-quarantined segments remain denied?
  context: Restoration edits can accidentally open paths that violate isolation invariants. Using header-space
    / invariant checking (VeriFlow, Header Space Analysis) on the committed firewall, ACL, and switch
    configuration, the analyst statically or in real time verifies the restored host can only reach what
    policy permits and that routes into still-quarantined segments stay blocked. An alert fires if a restoration
    edit opens a previously denied path into an isolated segment, which would let a partially recovered
    host bridge into segments that are still under containment.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      snapshot = committed_config(firewall, acl, switch)
      reachable = header_space_reachability(snapshot, src=restored_host)
      FOR each seg in quarantined_segments:
        IF path_exists(reachable, restored_host -> seg):
          ALERT 'Isolation invariant violated: restore opened path into quarantined segment'
      IF reachable != policy_allowed_set(restored_host):
          ALERT 'Reachable set deviates from policy after restore'
- question: How should isolated hosts be prioritized for reconnection based on system criticality and
    business impact, and where is restoration performance lagging against recovery objectives?
  context: Reconnection order should reflect mission impact, not arbitrary sequence. The analyst categorizes
    each isolated host's impact (Low/Moderate/High using the C/I/A high-water mark per FIPS 199), enriches
    it with BIA RTO and dependency data (NIST SP 800-34r1), computes the 90th-percentile criticality threshold
    to define the high-priority cohort, and compares MTTR distributions and MTTR-vs-RTO breach rates between
    high-priority and other cohorts. This surfaces process drag where the most important systems are not
    being restored fast enough, focusing recovery effort where it matters most.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each isolated host h:
        impact[h] = max(C,I,A categorization per FIPS 199)
        enrich(h, BIA.RTO, dependency_count)
      threshold = percentile(impact, 90)
      high = hosts WHERE impact >= threshold
      COMPARE distribution(MTTR[high]) VS distribution(MTTR[others])
      breach_rate = fraction(MTTR > RTO) per cohort
      REPORT cohorts where high-priority MTTR or breach_rate indicates process drag
- question: Are restored hosts being re-isolated shortly after reconnection, and is the per-day re-isolation
    rate or restoration throughput drifting in a way that signals ineffective remediation?
  context: Restoration churn is a strong signal of failed remediation or persistent compromise. The analyst
    applies a deterministic floor (flag any host re-isolated within 48 hours of restore) and additionally
    runs change-point detection (CUSUM, Bayesian online CPD, or PELT) on the per-day re-isolation rate
    and restoration throughput to catch gradual drift that static thresholds miss. A rising re-isolation
    rate indicates the underlying issue was not eradicated, that adversary persistence remains, or that
    the restore process itself is unstable.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each host h restored at t_r:
        IF re_isolated(h) within 48h of t_r:
          ALERT 'Restoration churn: host re-isolated within 48h'
      re_iso_rate = daily_count(re_isolations)
      throughput = daily_count(restores)
      cp1 = change_point(re_iso_rate)   # CUSUM/BOCPD/PELT
      cp2 = change_point(throughput)
      IF cp1 indicates upward shift: ALERT 'Rising re-isolation rate'
- question: After reconnection, does each restored host's traffic resume as expected, or does it show
    flat-at-zero traffic (restore never took effect) or a spike in blocked/failed connections indicating
    a misconfigured restore?
  context: 'A successful restore should produce an upward level-shift in the host''s conns/min and bytes
    time series as normal traffic resumes. The analyst alerts on two failure modes distinct from re-compromise:
    (a) flat-at-zero traffic, meaning the restore did not actually take effect; and (b) a spike in blocked/failed
    connections — Zeek conn states S0/REJ/RSTO, firewall denies, Windows Event ID 5157 drops — meaning
    the restore is misconfigured. Change-point detection on the failure-rate series surfaces these, with
    per-environment baselines derived from each host''s pre-isolation Volume/Frequency/State profile.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each restored host h:
        conns = timeseries(conns_per_min[h]); bytes = timeseries(bytes[h])
        IF level(conns, post_restore) ~ 0 AND level(bytes) ~ 0:
          ALERT 'Restore did not take effect: flat-at-zero traffic'
        fail = rate(zeek.conn_state IN ('S0','REJ','RSTO')[h])
               + rate(fw_deny[h]) + rate(EventID=5157 drops[h])
        IF change_point(fail) indicates spike vs pre-isolation baseline:
          ALERT 'Misconfigured restore: blocked/failed connection spike'
- question: How long is each host likely to take to restore, accounting for hosts not yet restored, and
    what order minimizes mission impact?
  context: Schedule optimization benefits from predicting time-to-restore. The analyst models restore
    duration with survival regression that handles right-censoring (hosts not yet restored) over features
    such as system role, isolation cause, dependency count, and historical remediation outcomes (Random
    Survival Forests), then ranks restoration order to minimize mission impact. Rather than presenting
    a bare estimate, each queue entry surfaces the top-3 features driving its predicted duration via Shapley
    attribution (SHAP), giving responders explainable, actionable scheduling guidance.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = [system_role, isolation_cause, dependency_count, hist_remediation_outcome]
      model = RandomSurvivalForest.fit(features, time_to_restore, event_observed)
      FOR each queued host h:
        pred = model.predict_median_time(h)
        top3 = SHAP_top_features(model, h, n=3)
        ANNOTATE queue[h] WITH pred, top3
      ORDER queue BY mission_impact_minimizing(pred, criticality)
- question: After reconnection, does any restored host exhibit behavior anomalous relative to its own
    known-good pre-isolation profile, suggesting re-compromise rather than normal recovery?
  context: The highest-stakes risk during restoration is silently reconnecting a still-compromised host.
    The analyst trains on each host's known-good pre-isolation behavior and scores post-reconnection per-host
    feature vectors (bytes/host, conns/min, distinct destinations, failed-connection ratio, service-state)
    using Extended Isolation Forest and a robust one-class model (Isolation Forest / One-Class SVM). Anomalous
    scores indicate possible re-compromise. To make alerts actionable, the top-3 contributing features
    (via LIME/SHAP) are included so responders can immediately see what drove the anomaly and whether
    it warrants re-isolation.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      FOR each restored host h:
        baseline = pre_isolation_behavior[h]
        model = ExtendedIsolationForest.fit(baseline)  # + OneClassSVM
        fv = [bytes_per_host, conns_per_min, distinct_dst, failed_conn_ratio, service_state]
        score = model.anomaly_score(fv_post_restore)
        IF score > threshold:
          top3 = SHAP_or_LIME(model, fv, n=3)
          ALERT 'Possible re-compromise of restored host' WITH top3
- question: Are recurring incidents and alerts on a recently restored host genuinely new issues, or duplicates
    of an unresolved root cause that is driving re-isolation churn?
  context: When a restored host keeps generating incidents, responders must distinguish truly new problems
    from repeated symptoms of one unresolved root cause. The analyst aggregates duplicate/related incidents
    and alerts from a recently restored host to the same underlying incident (incident-aware duplicate
    ticket aggregation, Chen et al., ICSE 2023). If many tickets collapse to a single root cause, the
    restoration was premature or eradication was incomplete; resolving the root cause should stop the
    churn rather than treating each recurrence in isolation.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      recent = incidents WHERE host IN recently_restored
      cluster = duplicate_ticket_aggregation(recent)  # incident-aware
      FOR each cluster c:
        IF size(c) > 1 AND spans_multiple_reisolations(c):
          LINK c TO underlying_incident
          ALERT 'Recurring incidents trace to single unresolved root cause'
