name: 'D3-RNA: Restore Network Access'
id: d7089409-7b98-4191-a418-2652471d9b59
description: Investigate the restoration of network access to systems that were isolated or quarantined
  during incident response. This playbook helps an analyst confirm that hosts are truly isolated before
  reconnection, gate reconnection on completed containment, eradication, and known-good baseline validation,
  verify that access was actually re-enabled at both the host and network layers, prioritize reconnection
  by business impact and predicted recovery effort, and continuously monitor restored hosts for re-isolation
  churn, failed/incomplete restores, and re-compromise. Detection logic favors Volume (bytes/host), Frequency
  (connections/min), and State (success/fail, blocked) metrics drawn from first-party telemetry such as
  Zeek conn.log, Windows filtering-platform events, firewall/switch logs, asset inventory, and incident/case-management
  records.
type: technique
related:
- tactic_id: D3-RESTORE
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Before any host is returned to the network, can you confirm from case-management records that
    containment is complete, eradication is complete, AND a known-good baseline or golden-image validation
    has passed for that host?
  context: Restoration doctrine ([NIST SP 800-184](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf);
    [NIST SP 800-61r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf); [CISA
    Cybersecurity Incident & Vulnerability Response Playbooks](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf))
    requires that a host only become eligible for reconnection after all three gates are satisfied. Reconnecting
    a host that has not been fully eradicated or validated against a known-good baseline risks re-introducing
    an active adversary onto the network. The analyst should cross-reference each candidate host against
    incident/case records and flag any reconnection that occurred before all three conditions were met,
    since premature restoration is a common path back to re-compromise within the Restore tactic.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each host h with a restore/reconnect action:\n  containment = case_records[h].containment_complete\n\
      \  eradication = case_records[h].eradication_complete\n  baseline   = case_records[h].baseline_validated\n\
      \  IF NOT (containment AND eradication AND baseline):\n    ALERT 'Premature restoration: host reconnected\
      \ before all gates satisfied'\n  ELSE:\n    MARK h eligible_for_restore_queue"
- question: Which hosts are marked isolated or quarantined in the asset inventory, and can their isolation
    be independently confirmed by the absence of expected network traffic before they are added to the
    restoration queue?
  context: An authoritative restoration queue must start from hosts that are genuinely isolated. The analyst
    queries the asset inventory for quarantined/isolated state, then cross-checks Zeek conn.log and firewall
    logs to confirm the host is emitting zero non-management flows over the prior 24 hours. This matches
    CISA's phased, verified reconnection guidance ([CISA Cybersecurity Incident & Vulnerability Response
    Playbooks](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf)).
    A host labeled isolated but still emitting traffic indicates incomplete isolation, must not be queued
    as 'restore', and should be re-examined as a containment failure.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "isolated = SELECT host FROM asset_inventory WHERE state IN ('isolated','quarantined')\nFOR\
      \ each host h in isolated:\n  flows = COUNT(zeek.conn WHERE (orig_h=h OR resp_h=h)\n           \
      \    AND service NOT IN ('mgmt') AND ts > now-24h)\n  IF flows = 0:\n    ADD h TO restoration_queue\n\
      \  ELSE:\n    ALERT 'Incomplete isolation: host marked isolated but still emitting traffic'"
- question: After a restoration action is recorded as done, is there corresponding host or firewall allow
    telemetry within the change window proving network access was actually re-enabled rather than merely
    requested?
  context: A restore marked 'done' in a ticket does not prove that access was technically re-enabled.
    Per [NIST SP 800-61r2](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf),
    the analyst should require host or firewall allow telemetry (e.g., Windows Event ID 5156 permitted-connection
    events or approved network-policy change records) occurring after the restoration action. A restore
    with no matching allow event inside the change window is a failed or unverified restore and should
    be flagged so it can be reworked, preventing silent gaps where a host appears restored but remains
    cut off.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each restore_action r (host=h, time=t, window=w):\n  allow = EXISTS(EventID=5156 WHERE\
      \ host=h AND ts BETWEEN t AND t+w)\n          OR EXISTS(fw_policy_change WHERE host=h AND action='allow'\
      \ AND ts BETWEEN t AND t+w)\n  IF NOT allow:\n    ALERT 'Unverified restore: no allow telemetry\
      \ within change window'"
- question: After firewall/ACL/switch rules are re-enabled for a restored host, does the host's reachable
    set match policy, and do paths into still-quarantined segments remain denied?
  context: Restoration edits can accidentally open paths that violate isolation invariants. Using header-space
    / invariant checking ([VeriFlow](https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final100.pdf);
    [Header Space Analysis](https://www.usenix.org/system/files/conference/nsdi12/nsdi12-final8.pdf))
    on the committed firewall, ACL, and switch configuration, the analyst statically or in real time verifies
    the restored host can only reach what policy permits and that routes into still-quarantined segments
    stay blocked. An alert fires if a restoration edit opens a previously denied path into an isolated
    segment, which would let a partially recovered host bridge into segments that are still under containment.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "snapshot = committed_config(firewall, acl, switch)\nreachable = header_space_reachability(snapshot,\
      \ src=restored_host)\nFOR each seg in quarantined_segments:\n  IF path_exists(reachable, restored_host\
      \ -> seg):\n    ALERT 'Isolation invariant violated: restore opened path into quarantined segment'\n\
      IF reachable != policy_allowed_set(restored_host):\n    ALERT 'Reachable set deviates from policy\
      \ after restore'"
- question: How should isolated hosts be prioritized for reconnection based on system criticality and
    business impact, and where is restoration performance lagging against recovery objectives?
  context: Reconnection order should reflect mission impact, not arbitrary sequence. The analyst categorizes
    each isolated host's impact (Low/Moderate/High using the C/I/A high-water mark per [FIPS 199](https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.199.pdf)),
    enriches it with BIA RTO and dependency data ([NIST SP 800-34r1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf)),
    computes the 90th-percentile criticality threshold to define the high-priority cohort, and compares
    MTTR distributions and MTTR-vs-RTO breach rates between high-priority and other cohorts. This surfaces
    process drag where the most important systems are not being restored fast enough, focusing recovery
    effort where it matters most.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each isolated host h:\n  impact[h] = max(C,I,A categorization per FIPS 199)\n  enrich(h,\
      \ BIA.RTO, dependency_count)\nthreshold = percentile(impact, 90)\nhigh = hosts WHERE impact >= threshold\n\
      COMPARE distribution(MTTR[high]) VS distribution(MTTR[others])\nbreach_rate = fraction(MTTR > RTO)\
      \ per cohort\nREPORT cohorts where high-priority MTTR or breach_rate indicates process drag"
- question: Are restored hosts being re-isolated shortly after reconnection, and is the per-day re-isolation
    rate or restoration throughput drifting in a way that signals ineffective remediation?
  context: Restoration churn is a strong signal of failed remediation or persistent compromise. The analyst
    applies a deterministic floor (flag any host re-isolated within 48 hours of restore) and additionally
    runs change-point detection (CUSUM, Bayesian online CPD, or PELT) on the per-day re-isolation rate
    and restoration throughput to catch gradual drift that static thresholds miss ([A Survey of Methods
    for Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).
    A rising re-isolation rate indicates the underlying issue was not eradicated, that adversary persistence
    remains, or that the restore process itself is unstable.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host h restored at t_r:\n  IF re_isolated(h) within 48h of t_r:\n    ALERT 'Restoration\
      \ churn: host re-isolated within 48h'\nre_iso_rate = daily_count(re_isolations)\nthroughput = daily_count(restores)\n\
      cp1 = change_point(re_iso_rate)   # CUSUM/BOCPD/PELT\ncp2 = change_point(throughput)\nIF cp1 indicates\
      \ upward shift: ALERT 'Rising re-isolation rate'"
- question: After reconnection, does each restored host's traffic resume as expected, or does it show
    flat-at-zero traffic (restore never took effect) or a spike in blocked/failed connections indicating
    a misconfigured restore?
  context: 'A successful restore should produce an upward level-shift in the host''s conns/min and bytes
    time series as normal traffic resumes. The analyst alerts on two failure modes distinct from re-compromise:
    (a) flat-at-zero traffic, meaning the restore did not actually take effect; and (b) a spike in blocked/failed
    connections — Zeek conn states S0/REJ/RSTO, firewall denies, Windows Event ID 5157 drops — meaning
    the restore is misconfigured. Change-point detection on the failure-rate series surfaces these ([A
    Survey of Methods for Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)),
    with per-environment baselines derived from each host''s pre-isolation Volume/Frequency/State profile.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each restored host h:\n  conns = timeseries(conns_per_min[h]); bytes = timeseries(bytes[h])\n\
      \  IF level(conns, post_restore) ~ 0 AND level(bytes) ~ 0:\n    ALERT 'Restore did not take effect:\
      \ flat-at-zero traffic'\n  fail = rate(zeek.conn_state IN ('S0','REJ','RSTO')[h])\n         + rate(fw_deny[h])\
      \ + rate(EventID=5157 drops[h])\n  IF change_point(fail) indicates spike vs pre-isolation baseline:\n\
      \    ALERT 'Misconfigured restore: blocked/failed connection spike'"
- question: How long is each host likely to take to restore, accounting for hosts not yet restored, and
    what order minimizes mission impact?
  context: Schedule optimization benefits from predicting time-to-restore. The analyst models restore
    duration with survival regression that handles right-censoring (hosts not yet restored) over features
    such as system role, isolation cause, dependency count, and historical remediation outcomes ([Random
    Survival Forests, Ishwaran et al.](https://arxiv.org/abs/0811.1645)), then ranks restoration order
    to minimize mission impact. Rather than presenting a bare estimate, each queue entry surfaces the
    top-3 features driving its predicted duration via Shapley attribution ([SHAP, Lundberg & Lee](https://arxiv.org/abs/1705.07874)),
    giving responders explainable, actionable scheduling guidance.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [system_role, isolation_cause, dependency_count, hist_remediation_outcome]\nmodel\
      \ = RandomSurvivalForest.fit(features, time_to_restore, event_observed)\nFOR each queued host h:\n\
      \  pred = model.predict_median_time(h)\n  top3 = SHAP_top_features(model, h, n=3)\n  ANNOTATE queue[h]\
      \ WITH pred, top3\nORDER queue BY mission_impact_minimizing(pred, criticality)"
- question: After reconnection, does any restored host exhibit behavior anomalous relative to its own
    known-good pre-isolation profile, suggesting re-compromise rather than normal recovery?
  context: The highest-stakes risk during restoration is silently reconnecting a still-compromised host.
    The analyst trains on each host's known-good pre-isolation behavior and scores post-reconnection per-host
    feature vectors (bytes/host, conns/min, distinct destinations, failed-connection ratio, service-state)
    using Extended Isolation Forest ([Hariri et al.](https://arxiv.org/abs/1811.02141), code [eif](https://github.com/sahandha/eif))
    and a robust one-class model (Isolation Forest / One-Class SVM) ([Robust IoT Security Using Isolation
    Forest and One-Class SVM, Scientific Reports 2025](https://www.nature.com/articles/s41598-025-20445-4)).
    Anomalous scores indicate possible re-compromise. To make alerts actionable, the top-3 contributing
    features (via LIME/SHAP ([Scientific Reports 2025](https://www.nature.com/articles/s41598-025-20445-4);
    [SHAP](https://arxiv.org/abs/1705.07874))) are included so responders can immediately see what drove
    the anomaly and whether it warrants re-isolation.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FOR each restored host h:\n  baseline = pre_isolation_behavior[h]\n  model = ExtendedIsolationForest.fit(baseline)\
      \  # + OneClassSVM\n  fv = [bytes_per_host, conns_per_min, distinct_dst, failed_conn_ratio, service_state]\n\
      \  score = model.anomaly_score(fv_post_restore)\n  IF score > threshold:\n    top3 = SHAP_or_LIME(model,\
      \ fv, n=3)\n    ALERT 'Possible re-compromise of restored host' WITH top3"
- question: Are recurring incidents and alerts on a recently restored host genuinely new issues, or duplicates
    of an unresolved root cause that is driving re-isolation churn?
  context: When a restored host keeps generating incidents, responders must distinguish truly new problems
    from repeated symptoms of one unresolved root cause. The analyst aggregates duplicate/related incidents
    and alerts from a recently restored host to the same underlying incident ([Incident-aware Duplicate
    Ticket Aggregation for Cloud Systems, Chen et al., ICSE 2023](https://arxiv.org/abs/2302.09520)).
    If many tickets collapse to a single root cause, the restoration was premature or eradication was
    incomplete; resolving the root cause should stop the churn rather than treating each recurrence in
    isolation.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset Inventory Database
  - Windows Event ID 5156
  - Windows Event ID 5157
  - Network Device Logs (e.g., Firewall, Switch)
  - Incident/Case Management Records (containment, eradication, restore actions)
  - 'NAI: Network infrastructure, affected endpoints and servers, and IT asset management systems'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "recent = incidents WHERE host IN recently_restored\ncluster = duplicate_ticket_aggregation(recent)\
      \  # incident-aware\nFOR each cluster c:\n  IF size(c) > 1 AND spans_multiple_reisolations(c):\n\
      \    LINK c TO underlying_incident\n    ALERT 'Recurring incidents trace to single unresolved root\
      \ cause'"
