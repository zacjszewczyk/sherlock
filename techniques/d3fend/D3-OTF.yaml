questions:
- question: Are any internal hosts establishing successful outbound sessions to domains or IP addresses
    that match curated threat-intelligence blocklists, and what host, destination, ports, and transferred
    byte volumes are involved?
  context: Under the Isolate tactic the objective is to confirm that egress filtering is actually blocking
    known-bad destinations rather than letting them through. Correlate successful outbound flows in Zeek
    conn.log against the destinations resolved in Zeek dns.log, then match those domains/IPs to threat-intelligence
    blocklists. Every alert should carry the source host, destination, ports, and orig_bytes/resp_bytes
    so an analyst can judge whether data left the network. Maintain the blocklists and matching logic
    in a portable signature format such as [Sigma](https://github.com/SigmaHQ/sigma) so detections are
    reproducible. A positive hit means filtering failed to stop a known-malicious destination and warrants
    immediate containment; a clean result still validates the control.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_conn JOIN zeek_dns ON conn.id.resp_h = dns.answer

      | WHERE conn.conn_state IN (''SF'',''S1'',''RSTO'',''OTH'')

      | ENRICH resp_h, query WITH threat_intel_blocklist

      | WHERE resp_h IN ti_ip OR query IN ti_domain

      | EMIT alert(src=orig_h, dst=resp_h, dst_port=resp_p, orig_bytes, resp_bytes, ti_source)'
  - technology: Zeek/pseudocode
    query: 'LOAD conn.log, dns.log, Intel framework hits

      | MATCH id.resp_h against Intel::ADDR AND query against Intel::DOMAIN

      | WHERE conn_state == ''SF''

      | EMIT alert(orig_h, resp_h, resp_p, orig_bytes, resp_bytes)'
- question: Do any successful outbound connections violate the approved egress matrix, meaning a permitted
    flow (source subnet, destination class, protocol, port) that is not represented in sanctioned policy?
  context: 'This is a deterministic policy-conformance check central to the Isolate tactic: compare every
    external connection against the approved egress matrix of (source subnet, destination class, protocol,
    port). Any successful flow recorded as a Windows Event ID 5156 (Filtering Platform allowed connection)
    or a firewall allow that is not represented in the matrix is a policy violation and should raise an
    incident. Codify the matrix as deterministic rules (e.g., [Sigma](https://github.com/SigmaHQ/sigma)
    egress rules) and align it with the connection-security policy model in the technique KB. A positive
    result reveals a gap where unauthorized external communication is permitted; tune the matrix to reflect
    approved business workflows to limit false positives.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM egress_events (WinEventID=5156 OR firewall_action=''allow'')

      | LOOKUP approved_egress_matrix BY (src_subnet, dst_class, protocol, dst_port)

      | WHERE matrix_match == FALSE

      | EMIT incident(src, dst, protocol, dst_port, reason=''not_in_egress_policy'')'
- question: Are any outbound TLS sessions presenting JA3/JA3S client/server fingerprints that match known
    implant or offensive-framework fingerprints (e.g., Cobalt Strike, Meterpreter) leaving the network?
  context: Encrypted C2 frequently leaves the network as TLS, so fingerprinting the TLS handshake catches
    malicious clients without decryption. Compute JA3 (Client Hello) and JA3S (Server Hello) fingerprints
    from Zeek ssl.log handshake fields and match them against curated lists of known implant/framework
    fingerprints. Under the Isolate tactic this confirms whether egress filtering is letting recognized
    malicious TLS clients communicate outbound. A match is high-confidence evidence of an implant beaconing
    out; because fingerprints can collide with benign software, corroborate with destination reputation
    and beaconing cadence before containment. See [JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3).
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LOAD ssl.log

      | COMPUTE ja3 = hash(client_hello fields), ja3s = hash(server_hello fields)

      | WHERE ja3 IN malicious_ja3_list OR ja3s IN malicious_ja3s_list

      | EMIT alert(orig_h, resp_h, server_name, ja3, ja3s, matched_framework)'
- question: Do any outbound HTTP requests fail to match any learned benign per-application fingerprint
    (User-Agent, header set and order, Host, constant header values, average outbound byte volume), and
    which header dimensions deviate?
  context: Malware often mimics browsers imperfectly, so per-application outbound-HTTP fingerprinting
    (the [DECANTeR](https://doi.org/10.1145/3134600.3134605) approach) detects clients whose header composition
    does not match any known benign application. Build fingerprints from proxy/Zeek http.log capturing
    User-Agent, the set and ordering of headers, Host, constant header values, and average outbound byte
    volume; flag any outbound request matching no learned benign fingerprint and surface the deviating
    dimensions. Under the Isolate tactic this catches unauthorized applications and disguised malware
    egressing over HTTP. A positive result points to a non-sanctioned or malicious client; periodically
    retrain fingerprints as legitimate applications update.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM http_log

      | BUILD app_fp = {user_agent, header_set, header_order, host, const_headers, avg_orig_bytes}

      | COMPARE app_fp AGAINST learned_benign_fingerprints

      | WHERE best_match_score < threshold

      | EMIT alert(orig_h, host, user_agent, deviating_dimensions)'
- question: For each (host, registered-domain) pair, does the residual information content of concatenated
    outbound DNS query labels, after lossless compression, exceed a derived byte threshold indicating
    a DNS covert channel?
  context: DNS tunneling encodes data into query labels, which raises the information content of the traffic.
    For each (host, registered-domain) pair, concatenate the outbound query labels over a window and apply
    lossless compression (gzip/bzip2); the compressed residual size is an information-theoretic proxy
    for encoded data. Alert when residual content exceeds a derived byte threshold. This [Born, Gustafson
    & Paxson](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf)
    method confirms DNS tunneling with low analyst overhead and complements the lexical and Isolation-Forest
    DNS analytics. Under the Isolate tactic it verifies whether DNS-based egress is being abused to bypass
    filtering. A positive result strongly indicates tunneling; baseline benign high-volume domains to
    set the threshold.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM dns_log

      | GROUP BY (orig_h, registered_domain) OVER window=1h

      | labels = concat(query_labels)

      | residual = len(compress(labels))  // gzip/bzip2

      | WHERE residual > derived_byte_threshold

      | EMIT alert(orig_h, registered_domain, residual_bytes)'
- question: Which outbound connections use destination ports outside the normal service set for their
    subnet, or exceed the 99th percentile of outbound byte volume relative to a 30-day per-subnet baseline?
  context: Sophisticated actors often egress over non-standard ports or move atypically large volumes.
    Build 30-day per-subnet distributions of destination-port usage, connection duration, and outbound
    byte volume, then flag connections on ports outside the normal service set or above the 99th percentile
    for bytes. Derive thresholds from your own baselines and tune against benign auto-generated traffic
    profiles, as profiled in [Mack & Williamson](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).
    Under the Isolate tactic this measures whether traffic is escaping on channels the egress policy did
    not anticipate. A flagged connection is a candidate for unauthorized egress; rare-but-legitimate services
    (rare admin tools, partner integrations) should be allow-listed after review.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 30 days for baseline; evaluate current connections
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM conn_log LAST 30d

      | BASELINE per subnet: port_set, p99(orig_bytes), duration_dist

      | FROM conn_log NOW

      | WHERE dst_port NOT IN subnet.port_set OR orig_bytes > subnet.p99_bytes

      | EMIT alert(orig_h, resp_h, dst_port, orig_bytes, reason)'
- question: Are any hosts or subnets showing hourly outbound byte totals or outbound/inbound byte ratios
    that exceed 3 standard deviations over rolling baselines, or abrupt step changes after business hours?
  context: Bulk exfiltration manifests as volume and directionality anomalies. Compute hourly outbound
    byte totals and outbound/inbound byte ratios by host and subnet, then trigger when values exceed 3
    standard deviations over rolling baselines or show abrupt step changes after business hours. This
    Volume/State signal complements rare-service detection and the lexical DNS analytics. Under the Isolate
    tactic it detects unusually large data transfers not explained by approved business workflows. A positive
    result, especially off-hours, suggests staged exfiltration; corroborate with destination reputation
    and the exfiltration risk-score before escalating.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM conn_log

      | BUCKET by host, hour: sum_orig_bytes, ratio = sum_orig_bytes / nullif(sum_resp_bytes,0)

      | ROLLING baseline mean,std per host

      | WHERE sum_orig_bytes > mean + 3*std OR ratio > mean_ratio + 3*std_ratio OR step_change(after_hours)

      | EMIT alert(host, hour, sum_orig_bytes, ratio)'
- question: Do any (source, destination) pairs exhibit regular connection intervals (low coefficient of
    variation), consistent data sizes, and sustained connection counts characteristic of C2 beaconing?
  context: 'C2 channels typically check in on a regular cadence. Score each (src,dst) pair on connection-interval
    regularity (low coefficient of variation), data-size consistency, connection count, and time span
    on first-party Zeek conn.log, as in [RITA](https://github.com/activecm/rita). Strengthen this with
    the [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks)
    noise-robust multi-stage pipeline: a coarse interval filter, FFT periodicity detection, autocorrelation
    verification, and benign-destination downweighting; set period thresholds from benign-periodicity
    baselines in [Mack & Williamson](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).
    Under the Isolate tactic this surfaces beaconing escaping egress filtering. A high-regularity pair
    to a low-reputation destination is strong C2 evidence; legitimate periodic services (updates, telemetry)
    should be downweighted.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM conn_log\n| GROUP BY (orig_h, resp_h): intervals=diff(ts), cv=std(intervals)/mean(intervals),\n\
      \         size_consistency=std(orig_bytes), conn_count, span\n| FFT(intervals) -> dominant_period;\
      \ autocorrelation_verify\n| WHERE cv < cv_threshold AND conn_count > min_count AND resp_h NOT IN\
      \ benign_periodic\n| EMIT alert(orig_h, resp_h, period, cv, conn_count)"
- question: Which parent domains show elevated DNS lexical statistics, such as high Shannon entropy of
    subdomain labels, large counts of unique subdomains, high fractions of TXT/NULL/CNAME query types,
    and long labels, over short windows?
  context: 'DNS exfiltration and tunneling produce lexically abnormal queries. Aggregate per-parent-domain
    DNS features over short windows: Shannon entropy of subdomain labels, count of unique subdomains,
    fraction of non-IP query types (TXT/NULL/CNAME), and label length; flag domains exceeding learned
    thresholds (per [Nadler et al. (real-time)](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)).
    Profile benign high-volume services (CDNs, AV, telemetry) to suppress false positives. Under the Isolate
    tactic this checks whether DNS is being used to bypass egress controls. A positive result indicates
    encoded data in DNS; corroborate with the compression-based bound and Isolation-Forest detector.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days (aggregate over short 5-15 minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM dns_log\n| GROUP BY registered_domain OVER window=10m:\n     entropy=shannon(subdomain_labels),\
      \ uniq_subdomains=count_distinct(subdomain),\n     txt_null_cname_frac, avg_label_len\n| WHERE entropy>e_thr\
      \ AND uniq_subdomains>u_thr AND domain NOT IN benign_high_volume\n| EMIT alert(registered_domain,\
      \ entropy, uniq_subdomains, txt_null_cname_frac)"
- question: Are any hosts showing sudden spikes in DNS resolution failures (NXDOMAIN/SERVFAIL) or blocked
    outbound connections (Windows Event ID 5157 / firewall deny) that indicate tunneling, C2, or policy
    probing?
  context: 'Tunneling/C2 and policy probing produce abnormal resolution-failure and blocked-egress bursts
    that benign traffic does not. Track per-host failure-mode signals as distinct features: NXDOMAIN/SERVFAIL
    rates in Zeek dns.log and blocked outbound connections (Windows Event ID 5157 or firewall deny), and
    alert on sudden spikes. Under the Isolate tactic, blocked-connection spikes are direct evidence the
    egress filter is being tested or that malware is repeatedly trying disallowed destinations. A positive
    result warrants investigating the originating host for compromise; baseline normal failure rates to
    avoid alerting on transient outages.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM dns_log, blocked_egress (WinEventID=5157 OR firewall_action=''deny'')

      | PER host PER hour: nxdomain_rate, servfail_rate, blocked_conn_count

      | ROLLING baseline; WHERE any_metric > mean + 3*std

      | EMIT alert(host, nxdomain_rate, servfail_rate, blocked_conn_count)'
- question: Can a supervised classifier risk-score outbound flows for likely exfiltration or C2 using
    destination reputation, port rarity, session timing, byte volumes/ratios, and DNS lexical features,
    and surface the top-3 contributing features per alert?
  context: 'To prioritize the highest-confidence egress violations, train a classifier on flow features:
    destination reputation, rarity of port, session timing, bytes and out/in ratios, and DNS lexical characteristics.
    Require each alert to surface the top-3 contributing features (e.g., bytes_out, dst_port rarity, beacon
    CV) via Shapley (SHAP) attribution per [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    so analysts can act on explainable evidence. Under the Isolate tactic this concentrates analyst attention
    on flows most likely to represent unauthorized external communication. A high score with intelligible
    attribution should drive triage; calibrate the threshold to your alert budget and retrain as traffic
    evolves.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL exfil_clf trained on [dst_reputation, port_rarity, session_timing, bytes_out, byte_ratio,
      dns_lexical]

      | SCORE each outbound flow -> p_exfil

      | EXPLAIN via SHAP -> top3_features

      | WHERE p_exfil > threshold

      | EMIT alert(orig_h, resp_h, p_exfil, top3_features)'
- question: Does an unsupervised online autoencoder ensemble over incremental per-channel flow statistics
    (bandwidth, packet rate, jitter) produce reconstruction-error spikes indicating novel egress or C2
    behavior?
  context: Novel or label-free egress channels evade signature and supervised methods. Run an unsupervised
    online autoencoder ensemble ([Kitsune/KitNET](https://arxiv.org/abs/1802.09089)) over incremental
    per-channel flow statistics such as bandwidth, packet rate, and jitter, alerting on reconstruction-error
    spikes and using per-feature reconstruction error for explainability. Under the Isolate tactic this
    catches previously unseen egress/C2 behaviors that policy-based and baseline detectors miss. A reconstruction-error
    spike marks a flow that deviates from all learned normal behavior; review the contributing features
    and corroborate with reputation and beaconing signals, as autoencoders can flag benign novelty.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL kitnet_ensemble (online autoencoders) over [bandwidth, packet_rate, jitter] per channel

      | UPDATE incrementally; COMPUTE reconstruction_error

      | WHERE recon_error > dynamic_threshold

      | EMIT alert(channel, recon_error, per_feature_error)'
- question: Can encrypted outbound flows be classified as C2 using version-agnostic features (packet sizes,
    directionality, inter-arrival timing, byte ratios) so detection survives migration to TLS 1.3 and
    no decryption is required?
  context: As C2 frameworks adopt TLS 1.3, payload- and certificate-based detection degrades, but traffic
    shape persists. Classify encrypted outbound flows using version-agnostic features (packet sizes, directionality,
    inter-arrival timing, byte ratios) per [Novo & Morla (RAID 2024)](https://dl.acm.org/doi/10.1145/3678890.3678921),
    optionally augmented with self-supervised representations ([ET-SSL](https://www.nature.com/articles/s41598-025-08568-0))
    that detect anomalies without decryption. Under the Isolate tactic this preserves C2 detection across
    encryption changes without requiring TLS interception. A positive classification flags an encrypted
    channel behaving like C2; combine with JA3 fingerprints and beaconing cadence to raise confidence
    and reduce false positives from benign encrypted apps.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL enc_c2_clf trained on [packet_size_seq, directionality, inter_arrival_timing, byte_ratio]

      | SCORE encrypted outbound flows (TLS any version)

      | OPTIONAL augment with ET-SSL self-supervised embeddings

      | WHERE p_c2 > threshold

      | EMIT alert(orig_h, resp_h, p_c2, top_features)'
- question: Do deep time-series models (LSTM or transformer) over connection-interval patterns reveal
    high-jitter or randomized beaconing that defeats FFT and coefficient-of-variation detectors?
  context: Advanced implants randomize check-in intervals (jitter) to defeat periodicity detectors. Apply
    deep time-series models (LSTM or transformer) to learn connection-interval patterns and flag high-jitter/randomized
    beaconing per [Gupta et al. (ARES 2025)](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20),
    running in parallel with the deterministic periodicity scoring rather than replacing it. Under the
    Isolate tactic this closes the gap left by FFT/CV methods when an actor deliberately irregularizes
    cadence. A positive result identifies a destination whose temporal pattern is learned-anomalous despite
    lacking simple periodicity; corroborate with destination reputation and volume signals before containment.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL ts_beacon (LSTM/transformer) over interval_sequence per (orig_h,resp_h)

      | PREDICT next-interval distribution; SCORE anomaly of jittered cadence

      | WHERE anomaly_score > threshold

      | RUN in parallel with deterministic FFT/CV beacon scoring

      | EMIT alert(orig_h, resp_h, anomaly_score)'
- question: Does an Isolation Forest trained on per-domain behavioral feature vectors (distinct subdomain
    count, entropy, query-type mix, label length, inter-query gaps) reveal stealthy low-bandwidth DNS
    exfiltration that evades volume thresholds?
  context: 'Low-and-slow DNS exfiltration deliberately stays under volume thresholds. Train an Isolation
    Forest on per-domain behavioral feature vectors over sliding windows: distinct subdomain count, entropy,
    query-type mix, label length, and inter-query gaps, to isolate stealthy low-bandwidth DNS exfiltration
    ([Nadler et al.](https://arxiv.org/abs/1709.08395)). Under the Isolate tactic this catches DNS abuse
    that the compression bound and lexical-threshold rules might miss at low rates. A domain isolated
    as anomalous warrants investigation of the querying hosts; profile benign high-volume DNS services
    so they are not isolated as outliers.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - Windows Event ID 5156 (Filtering Platform allowed connection)
  - Windows Event ID 5157 (Filtering Platform blocked connection)
  - 'NAI: Network egress points, including internet gateways and corporate DNS resolvers where network
    traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL iforest trained on per-domain [distinct_subdomains, entropy, query_type_mix, label_len,
      inter_query_gap] over sliding windows

      | SCORE anomaly per registered_domain

      | WHERE iforest_score indicates outlier AND domain NOT IN benign_high_volume

      | EMIT alert(registered_domain, anomaly_score, contributing_features)'
