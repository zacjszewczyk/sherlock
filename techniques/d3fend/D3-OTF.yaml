name: 'D3-OTF: Outbound Traffic Filtering'
id: b46f98a0-1cd8-4347-9807-28b750cc24cf
description: Investigate outbound (egress) network traffic to determine how effectively current filtering
  rules prevent unauthorized external communication, and to surface successful outbound sessions from
  internal hosts that violate egress policy. This playbook helps an analyst hunt for connections to non-approved
  destination ports, forbidden domains or IPs, and unusually large data transfers not explained by approved
  business workflows. It layers deterministic symbolic-logic rules (threat-intel blocklist matches, explicit
  egress-matrix policy violations, malicious JA3/JA3S TLS client fingerprints, anomalous outbound HTTP
  application fingerprints, and compression-based DNS covert-channel bounding), statistical baselining
  (rare destination-port and byte-volume percentiles, abnormal data-transfer bursts and out/in ratios,
  periodic beaconing cadence, DNS exfiltration lexical statistics, and egress failure/blocked-connection
  rates), and explainable machine learning (exfiltration risk-scoring with feature attribution, online
  autoencoder novelty detection, encrypted-C2 flow classification, jittered-beacon time-series modeling,
  and Isolation-Forest low-throughput DNS exfiltration detection) over Zeek conn/dns/ssl/http logs, firewall
  allow/deny logs, and Windows Filtering Platform events. It is tuned to catch a sophisticated external
  actor exfiltrating sensitive data or operating C2 channels, as well as commodity malware and insider
  abuse.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
