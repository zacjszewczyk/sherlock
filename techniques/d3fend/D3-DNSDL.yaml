name: 'D3-DNSDL: DNS Denylisting'
id: 2e181ebe-cbcf-4660-aae2-c7349503583b
description: Investigate the effectiveness of DNS denylisting at isolating malicious infrastructure. This
  playbook helps an analyst confirm that denylisted malicious domains are actually blocked at the resolver
  (via RPZ NXDOMAIN/NODATA, DROP, or sinkhole redirect) and that enforcement is not being bypassed through
  direct-IP, hosts-file, or encrypted-DNS (DoH/DoT) resolution. It surfaces denylist misses that still
  reach attacker infrastructure, NXDOMAIN failure bursts that betray unlisted DGA command-and-control,
  and DNS tunneling/exfiltration through attacker-controlled but otherwise allowed domains. It also measures
  denylist coverage, drift, and feed quality over time, and proactively scores newly observed, low-prevalence,
  young, fast-flux, or lexically suspicious domains so they can be added to the denylist before they are
  publicly listed.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: For every domain on the denylist, did the resolver actually return a policy-enforced block
    outcome (RPZ NXDOMAIN/NODATA by policy, DROP, or redirect to a sinkhole/walled-garden IP), and are
    there any denylisted domains that instead returned a NOERROR answer pointing at a non-sinkhole IP?
  context: 'This question validates that the DNS policy engine is doing what it claims for the Isolate
    objective: blocking known-bad domains. For each denylisted FQDN, confirm the resolver returned an
    RPZ-defined block (NXDOMAIN/NODATA by policy, DROP, or sinkhole/walled-garden redirect) in Windows
    DNS Server Analytic Logs or Zeek dns.log. Any denylisted domain that returns rcode NOERROR with a
    real, non-sinkhole answer is an enforcement failure that lets the client reach malicious infrastructure.
    You must also reconcile PASSTHRU/allowlist exceptions so that an over-broad override has not silently
    disabled enforcement for a domain that should be blocked. A positive result (block confirmed) means
    isolation is working; a negative result (real answer returned) is an actionable gap.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall connection logs
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nFOR each dns_query WHERE qname IN denylist:\n  IF rcode == NOERROR AND answer_ip NOT IN\
      \ sinkhole_ips AND policy_action NOT IN (NXDOMAIN_POLICY, NODATA_POLICY, DROP, REDIRECT):\n    ALERT\
      \ \"denylisted domain not blocked\"\n  IF policy_action == PASSTHRU: ALERT \"allowlist override\
      \ on denylisted domain\""
  - technology: Zeek/pseudocode
    query: ">-\ndns.log | where qname in denylist\n  | where rcode_name == \"NOERROR\" and answers not\
      \ in sinkhole_set\n  | select ts, id.orig_h, qname, answers"
- question: Are there DNS queries for known-bad domains (matched against the UNION of all subscribed threat-intel
    feeds, not any single feed) that returned a real answer and were followed within ~5 seconds by an
    established outbound session to the resolved IP, indicating the denylist missed the domain and the
    client reached the infrastructure?
  context: Single threat-intel feeds are highly disjoint and individually cover under 20% of malicious
    domains, so coverage gaps are the norm. By cross-referencing all dns.log queries against the UNION
    of feeds and then correlating a known-bad resolution with a subsequent established conn.log session
    to the same resolved IP (within ~5s), you catch denylist enforcement failures where the domain should
    have been blocked but the host actually connected. Exclude known sinkhole/parked IPs to avoid false
    positives. A match means the isolation control let real C2/malicious traffic through and the domain
    must be added/enforced.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall connection logs
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\ndns = dns.log | where qname in union(feeds) and rcode_name==\"NOERROR\"\njoin conn.log\
      \ on (dns.answers == conn.id.resp_h)\n  where conn.ts between dns.ts and dns.ts+5s and conn.conn_state\
      \ startswith \"S\" or \"established\"\n  and conn.id.resp_h not in sinkhole_parked\n| select dns.ts,\
      \ id.orig_h, qname, answers"
  - technology: SIEM/Rule pseudocode
    query: ">-\nALERT WHEN dns_answer(domain IN feed_union) THEN established_session(dst==resolved_ip)\
      \ WITHIN 5s\n  AND resolved_ip NOT IN sinkhole_parked_ips"
- question: Are hosts establishing outbound sessions to external IPs that had NO preceding internal DNS
    resolution within ~60 seconds (suggesting hosts-file or hard-coded-IP bypass), or sending traffic
    to public DNS-over-HTTPS/DoT endpoints that move name resolution off the monitored recursive resolver
    and defeat RPZ denylisting entirely?
  context: 'DNS denylisting only works if name resolution flows through the monitored recursive resolver.
    Two bypasses break this: (1) direct-IP / hosts-file connections, visible as established outbound sessions
    to external IPs with no preceding dns.log lookup within ~60s; and (2) encrypted DNS (DoH over HTTPS
    or DoT on TCP/853) to public resolvers, which relocates resolution off-box so RPZ never sees the query.
    Detecting both is essential because each completely circumvents the Isolate control. A hit means the
    denylist can be evaded and may indicate either misconfiguration or deliberate evasion by an actor.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall connection logs
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n# direct-IP / hosts-file bypass\nconn.log | where id.resp_h is external and conn established\n\
      \  | where NOT exists(dns.log where answers==conn.id.resp_h and ts in [conn.ts-60s, conn.ts])\n\
      # encrypted DNS bypass\nconn.log | where id.resp_p==853 OR id.resp_h in public_doh_resolver_ips"
  - technology: SIEM/Rule pseudocode
    query: '>-

      ALERT established_egress(dst external) WHERE no_dns_resolution(dst) WITHIN 60s

      ALERT egress WHERE dst_port==853 OR dst_host IN known_DoH_resolvers'
- question: Is any single client exceeding a tuned NXDOMAIN failure threshold (start at >50 NXDOMAIN/minute,
    or an NXDOMAIN-to-total ratio above the per-environment baseline), which signals Domain Generation
    Algorithm command-and-control whose domains no static denylist can enumerate?
  context: 'DGA-based malware cycles through many algorithmically generated domains, most of which do
    not exist, producing characteristic bursts of NXDOMAIN responses. Because these domains are ephemeral
    and never appear on static denylists, failed resolutions are a leading, denylist-independent signal
    of C2. Profile NXDOMAIN as a distinct signal: alert when a client exceeds a tuned rate (start ~>50
    NXDOMAIN/min) or an NXDOMAIN-to-total ratio above the resolver''s baseline. Derive the threshold from
    each resolver''s 30-day NXDOMAIN distribution to avoid noisy false positives. A sustained burst from
    one host warrants endpoint investigation for DGA malware.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall connection logs
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days; pivot to a tight window around the burst for correlation
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats count(rcode==NXDOMAIN) as nx, count(*) as tot by client, bin(1m)

      | where nx > 50 OR (nx/tot) > baseline_ratio[resolver]

      | sort by nx desc'
  - technology: Zeek/pseudocode
    query: '>-

      dns.log | where rcode_name=="NXDOMAIN"

      | summarize nx=count() by id.orig_h, bin(ts,1m)

      | where nx > tuned_threshold'
- question: What is the weekly ratio of blocked versus attempted malicious-domain queries per resolver
    and network segment, and has it dropped in a statistically significant way (e.g., >2 sigma) that would
    indicate stale intelligence or a policy regression?
  context: Denylist coverage erodes quickly because public lists cover under 20% of malicious domains
    for most malware families, and policies can silently regress. Computing the weekly blocked-versus-attempted
    ratio with confidence bounds, per resolver and segment, turns coverage into a measurable, trendable
    metric. A statistically significant drop (>2 sigma below the established mean) flags stale feeds or
    a broken policy before attackers exploit the gap. This directly measures how well the Isolate control
    is keeping up over time. A negative trend should trigger feed refresh and policy review.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days; weekly aggregation
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats blocked=count(policy_block), attempted=count(malicious_domain_query) by resolver, segment,
      week

      | eval ratio = blocked/attempted

      | eval z = (ratio - mean(ratio))/stdev(ratio)

      | where z < -2'
- question: For each subscribed threat-intel feed, what is its exclusive contribution, differential contribution,
    and median listing latency (time from first internal observation of a confirmed-bad domain to its
    appearance on the feed), and is any feed redundant or too slow to reduce risk?
  context: 'Not all feeds add value: many overlap heavily, and some list domains only after hosts have
    already connected. Using the Reading the Tea Leaves methodology, compute per-feed exclusive contribution
    (domains only that feed provides), differential contribution, and median listing latency. Alert when
    a feed''s exclusive contribution trends toward zero (redundant, can be deprioritized) or when its
    latency exceeds the time-to-first-contact window (it lists domains too late to prevent compromise).
    This optimizes which feeds drive the denylist so the Isolate control is fed by timely, non-redundant
    intelligence.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfor each feed:\n  exclusive = count(domains only in this feed)\n  differential = count(domains\
      \ in this feed not in union(other feeds))\n  latency = median(feed_list_time - first_internal_observation_time)\n\
      ALERT WHEN exclusive ~ 0 OR latency > time_to_first_contact_window"
- question: Which second-level domains are in the lowest 5th percentile of 30-day query frequency and
    unique-client prevalence, and when enriched with young domain age (<30 days), high resolved-IP/ASN
    fan-out, short TTL, and high Shannon entropy, which of them are suspicious enough to prioritize for
    denylist expansion?
  context: 'Attacker domains are typically low-prevalence (few clients, few queries) and exhibit passive-DNS
    hallmarks: recent registration, agile/fast-flux IP fan-out, short TTLs, and high lexical entropy.
    Following EXPOSURE and Notos feature families, isolate the long-tail (lowest 5th percentile) of domains
    and enrich/score them so analysts can review and proactively denylist malicious infrastructure before
    it is publicly listed. This expands the Isolate control''s coverage ahead of the threat. High-scoring
    candidates feed analyst review and denylist additions.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days; 30-day feature window
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats freq=count(), clients=dcount(client) by sld over 30d

      | where percentile_rank(freq) <= 5 OR percentile_rank(clients) <= 5

      | enrich domain_age, dcount(resolved_ip), dcount(asn), min(ttl), shannon_entropy(sld)

      | where domain_age < 30d AND ttl_short AND (fanout high OR entropy high)

      | sort score desc'
- question: Which domains show abnormal growth in their resolved-IP set cardinality or ASN diversity over
    a rolling window combined with short TTLs, identifying fast-flux/agile infrastructure that static
    denylists miss for weeks?
  context: Fast-flux infrastructure rapidly rotates the IPs and ASNs behind a domain with very short TTLs
    to evade takedown and static blocking. Tracking each domain's resolved-IP set, ASN count, and IP-set
    growth rate over a rolling window (per FluxBuster) lets you flag domains whose IP/ASN diversity grows
    abnormally with short TTLs. These churning domains are precisely the ones static denylists fail to
    keep up with, so surfacing them lets the Isolate control catch agile C2/CDN-abuse infrastructure early.
    Flagged domains are strong denylist candidates.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days; rolling window scoring
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfor each domain over rolling_window:\n  ip_card = dcount(resolved_ip); asn_div = dcount(asn)\n\
      \  growth = delta(ip_card)/time; ttl = min(ttl)\nALERT WHEN (ip_card high OR asn_div high) AND growth\
      \ abnormal AND ttl < short_threshold"
- question: Does any host deviate from its own 30-day NXDOMAIN-rate and unique-failed-domain baseline
    (via EWMA or robust z-score), signaling DGA command-and-control whose domains the denylist cannot
    enumerate?
  context: Beyond a static threshold, a per-host adaptive baseline catches DGA activity relative to each
    host's normal behavior. Maintain a 30-day baseline of NXDOMAIN rate and unique-failed-domain count
    using EWMA or robust z-score and alert on excursions. Failed-resolution bursts are a leading indicator
    of DGA C2 because the algorithm produces far more non-existent than existent domains, and none can
    be pre-listed. This complements the denylist with a behavioral, host-centric failure signal supporting
    the Isolate objective. An excursion warrants endpoint triage for DGA malware.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days; 30-day baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      baseline ewma(nx_rate) and ewma(unique_failed_domains) per host over 30d

      | eval z = robust_zscore(current_nx_rate, baseline)

      | where z > threshold OR unique_failed_domains >> baseline'
- question: When a newly observed domain that is absent from both allow and deny lists is scored by a
    logistic-regression/decision-tree model on lexical and passive-DNS features (length, Shannon entropy,
    numeric ratio, n-grams, TLD, prevalence, TTL), is it predicted malicious with high confidence and
    what top-3 features drove that prediction?
  context: Many malicious domains are never on any list when first seen. A supervised model (logistic
    regression or decision tree) trained on known-good/known-bad domains using lexical and passive-DNS
    features can classify newly observed, unlisted domains and flag high-confidence malicious predictions
    for denylist action, per EXPOSURE and Notos. Crucially, the model must surface the top-3 contributing
    features in the alert so the analyst can triage and justify a denylist addition. This proactively
    extends the Isolate control to domains before they appear on public feeds.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nfeatures = [length, shannon_entropy, numeric_ratio, ngrams, tld, prevalence, ttl]\npred\
      \ = logreg.predict_proba(features)\nWHEN domain NOT IN allowlist+denylist AND pred.malicious > 0.9:\n\
      \  ALERT domain, score, top3_features(pred)"
- question: When a Random Forest over 21 lexical/statistical features is applied to NXDOMAIN responses
    in first-party resolver logs, which failed lookups are classified as DGA-related (versus benign),
    and what are the top contributing features per alert?
  context: Not every NXDOMAIN burst is malicious; distinguishing benign typos/misconfig from DGA failures
    sharpens detection. FANCI's Random Forest over 21 lexical/statistical features classifies NXDOMAIN
    responses as benign vs DGA with very high F1 (>99.7%) and generalizes to unseen DGA families. Apply
    it to first-party resolver NXDOMAIN logs, feed confirmed DGA domains into the denylist, and emit the
    top contributing features per alert for analyst justification. This converts the denylist-independent
    failure signal into concrete, automatable denylist additions supporting Isolate.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nfor each NXDOMAIN_response in resolver_logs:\n  features = extract_21_lexical_stat_features(qname)\n\
      \  label = random_forest.predict(features)\n  IF label == DGA: add qname to denylist_candidates;\
      \ ALERT qname, top_features(features)"
- question: When newly observed domains that successfully resolve (NOERROR) are scored by a character-level
    LSTM, which are classified as DGA (and to what family) in real time without feature engineering, and
    what character n-grams drove the decision?
  context: Some DGA domains resolve successfully and thus evade NXDOMAIN-based detection. A character-level
    LSTM classifies a single domain string in real time and can attribute the DGA family without feature
    engineering or external lookups, per Predicting Domain Generation Algorithms with LSTM. Score newly
    observed resolving (NOERROR) domains with it, and wrap the model to surface the highest-contribution
    character n-grams so analysts can justify each denylist addition. This catches resolving DGA C2 the
    denylist would otherwise miss, extending the Isolate control.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nfor each newly_observed_domain WHERE rcode==NOERROR:\n  score, family = char_lstm.predict(domain_string)\n\
      \  IF score > threshold: ALERT domain, family, top_char_ngrams(domain, score)"
- question: When candidate denylist additions are ranked by an ensemble combining lexical features, first-seen
    recency, query burstiness, host spread, and resolved-IP-set dynamism, which domains rank highest for
    analyst action and what top-3 features drive each score?
  context: Analysts can only review so many candidates, so prioritization matters. An ensemble ranker
    combining lexical features, first-seen recency, query burstiness, host spread, and resolved-IP-set
    dynamism (per FluxBuster and Notos) ranks candidate denylist additions so the highest-impact malicious
    domains are actioned first. The ranker must expose the top-3 features driving each domain's score
    for transparency and triage. This focuses denylist expansion effort where it most strengthens the
    Isolate control.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nscore = ensemble.rank(features=[lexical, first_seen_recency, query_burstiness, host_spread,\
      \ ip_set_dynamism])\nfor each candidate_domain:\n  emit rank, score, top3_features(score)\noutput\
      \ sorted desc for analyst review"
- question: When an Isolation Forest scores stateless per-query lexical and volume features (Shannon entropy,
    total and longest label length, unique-character count, label count, query rate per domain) on dns.log,
    which queries are anomalous in a way consistent with DNS exfiltration/tunneling through attacker-controlled
    registered domains?
  context: DNS tunneling/exfiltration through a domain the attacker legitimately controls is a denylist
    evasion the list can never cover by definition. An Isolation Forest over stateless per-query lexical
    and volume features (Shannon entropy, total/longest label length, unique-character count, label count,
    query rate per domain) on Zeek dns.log catches the anomalous, data-bearing queries characteristic
    of tunneling, per Real-Time Detection of DNS Exfiltration and Tunneling. Surface the top anomalous
    features in the alert. This closes the gap where Isolate via denylisting alone cannot help, by detecting
    the abuse behaviorally.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, network egress points, endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      features = [shannon_entropy(qname), total_len, longest_label_len, unique_chars, label_count, query_rate_per_domain]

      score = isolation_forest.decision_function(features)

      WHEN score < anomaly_threshold: ALERT qname, domain, top_anomalous_features(features)'
  - technology: Zeek/pseudocode
    query: '>-

      dns.log | extend per-query features | score via isolation_forest | where anomaly'
