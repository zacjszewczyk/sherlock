name: 'D3-NPC: Null Pointer Checking'
id: 5834ac3b-c0a5-42e2-8980-a1e0b62c0618
description: Investigate the degree to which first-party (in-house developed) applications are hardened
  against NULL pointer dereference defects (CWE-476). This playbook helps an analyst confirm whether code
  paths validate pointers before dereference, surface modules with recurring null-pointer defects, identify
  risky code-change patterns and uninitialized/allocator-return usage, and tie each finding to the exact
  source path and call stack proving a NULL reaches a dereference. It also covers runtime evidence — SIGSEGV/access-violation
  crash signatures at or near a null address, sanitizer (ASan/UBSan) reports, fuzzing/DAST reproductions
  — and the correlation of static findings with dynamic crashes to prioritize exploitable, reachable defects.
  Methods span path-sensitive static analysis, statistical defect-density and concentration tracking,
  and machine-learning risk/recall models, all anchored to a deterministic SAST floor.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
