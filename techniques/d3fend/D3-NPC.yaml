questions:
- question: Does path-sensitive static analysis flag any pointer dereference that is reachable while the
    pointer can be NULL in our first-party CI builds, and is each finding recorded with exact file, function,
    line, and feasible source path/call stack?
  context: 'This is the core hardening check against CWE-476 / SEI CERT EXP34-C. Path-sensitive analysis
    models feasible execution paths and reports a dereference only when a NULL value can actually reach
    it, reducing noise versus naive grep. Enforce in CI using compiler-native checkers: GCC -fanalyzer
    / -Wanalyzer-null-dereference and the Clang Static Analyzer core.NullDereference / core.NonNullParamChecker.
    A positive (finding) means a concrete, reproducible code path can dereference NULL and must be remediated
    or formally risk-accepted; a clean result raises assurance. For the Harden tactic the gate threshold
    is zero new high-confidence findings permitted to merge.'
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SAST/CI pseudocode
    query: ">-\n  for build in ci_builds(scope=first_party):\n    findings = run(['gcc -fanalyzer -Wanalyzer-null-dereference',\n\
      \                    'clang --analyze -Xclang -analyzer-checker=core.NullDereference,core.NonNullParamChecker'])\n\
      \    for f in findings where f.confidence == high:\n      record(file, function, line, feasible_path,\
      \ call_stack)\n      if f.is_new: FAIL_MERGE()  # threshold: zero new high-confidence findings"
- question: Are return values from allocators (malloc/calloc/realloc) or other nullable APIs dereferenced
    without an intervening NULL test on any code path?
  context: Allocators and many library calls can legitimately return NULL; dereferencing the result without
    checking is a classic CWE-476 / EXP34-C violation that crashes or, worse, becomes exploitable. Use
    interprocedural compositional analysis such as Infer:Pulse, which reports a null deref only when it
    holds for all inputs on a path, keeping false positives low on diff/PR scans. A finding here means
    an allocation or nullable-API result is used unguarded; the fix is to add a NULL check before use.
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SAST/Infer pseudocode
    query: ">-\n  infer run --pulse -- <build_cmd>\n  for issue in pulse.report where issue.type == 'NULLPTR_DEREFERENCE':\n\
      \    if source(issue) in {malloc,calloc,realloc,nullable_api}\n       and not has_null_check_between(source,\
      \ deref):\n      alert(file, function, line, trace)"
- question: Are any pointers used before being assigned a valid address or NULL (uninitialized pointer
    usage)?
  context: 'Uninitialized pointer use is high risk: the pointer holds indeterminate (possibly attacker-influenced)
    memory, which can lead to arbitrary code execution rather than a clean crash. Configure the Clang
    Static Analyzer core.uninitialized / core.CallAndMessage checkers to detect pointers read before assignment.
    A positive result identifies a variable that must be initialized (to NULL or a valid object) before
    any use; for the Harden goal these should be treated as elevated severity.'
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SAST/Clang pseudocode
    query: ">-\n  clang --analyze -Xclang -analyzer-checker=core.uninitialized,core.CallAndMessage <src>\n\
      \  for f in findings where f.kind in ('UninitializedPointer','CallToUninitialized'):\n    alert(file,\
      \ function, line, severity='high')  # potential ACE if attacker-controlled"
- question: Are there inconsistencies where a pointer is null-checked on some paths but dereferenced without
    a check on others (check-then-unchecked-deref or deref-then-null-check contradictions)?
  context: 'Following Engler et al. ''Bugs as Deviant Behavior'', the code itself implies beliefs: if
    a pointer is null-checked anywhere, the belief is that it can be NULL and must be checked before every
    dereference. Belief/specification inference flags contradictions — a dereference that precedes a later
    null-check (implying the author knew it could be NULL), or a checked pointer dereferenced unchecked
    elsewhere. These deviations are strong signals of latent CWE-476 bugs derived from the codebase''s
    own conventions rather than an external spec.'
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SAST/Inference pseudocode
    query: ">-\n  beliefs = infer_null_checked_pointers(codebase)\n  for ptr in beliefs.checked_somewhere:\n\
      \    for deref in dereferences(ptr):\n      if not dominated_by_null_check(deref): flag('check-then-unchecked-deref',\
      \ deref)\n    for chk in null_checks(ptr):\n      if exists deref before chk on same path: flag('deref-then-null-check',\
      \ chk)\n  rank by belief_consistency"
- question: What is the null-pointer defect density (findings per 1,000 lines of code) per application/repository
    over recent release cycles, and which modules exceed the per-repo 75th percentile or show a worsening
    trend?
  context: Defect density normalizes raw finding counts by code size so teams can be compared and trends
    tracked across release cycles. Computing a per-repository percentile cutoff (rather than a global
    default) accounts for differing baselines. Modules above the 75th percentile or trending worse are
    prioritized for remediation. Calibrate detector precision/recall against the labeled CWE-476 flawed/fixed
    cases in the NIST Juliet/SARD suite so the density metric is trustworthy. Rising density signals eroding
    hardening posture.
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  metric density = count(null_findings) / (KLOC) per repo per release\n  cutoff = percentile(density_by_module[repo],\
      \ 75)\n  for module in repo:\n    if density(module) > cutoff or trend(density, releases) > 0:\n\
      \      prioritize(module)\n  calibrate detector against NIST_Juliet_SARD_CWE476"
- question: Have detection thresholds been tuned per project for the highly imbalanced defect-label distribution,
    and are recall and false-alarm rates reported (not just accuracy) at each release?
  context: Defect data is heavily imbalanced (few buggy modules among many clean ones), so accuracy is
    misleading. Per Agrawal & Menzies, tune the decision threshold and apply class-imbalance handling
    (e.g., SMOTE) per project, and explicitly profile and report recall and false-alarm rate — Failure
    Mode Awareness. Re-tune each release because code and label distributions drift. Alert on density
    breaches at the project-specific operating point. This ensures the program neither floods analysts
    with false positives nor silently misses real null-deref defects.
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for project in projects:\n    train_set = resample(labels, method='SMOTE')\n    thr\
      \ = tune_threshold(maximize=recall, constrain=false_alarm_rate)\n    report(recall, false_alarm_rate,\
      \ operating_point=thr)\n    if density_breach(project, thr): alert(project)\n  schedule: re-tune每\
      \ release"
- question: When ranked by how consistently the underlying null-check belief holds across the codebase
    (z-ranking), which candidate null-deref violations are highest confidence?
  context: Not all flagged patterns are equally trustworthy. The z-ranking from Engler et al. scores each
    candidate violation by how strongly the codebase supports the belief it breaks — violations of widely-held
    conventions rank above coincidental patterns. Triaging high-confidence (high-z) findings first focuses
    analyst effort and suppresses noise, which is essential when the Harden program must clear findings
    efficiently before merge.
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for v in candidate_null_deref_violations:\n    n = times_belief_held; e = times_belief_violated\n\
      \    v.z = (n - e) / sqrt(n + e)\n  triage order = sort(violations by z desc)"
- question: How are null-pointer findings (and their fixed/unfixed state) distributed across teams, components,
    and code-churn hotspots, and does any concentration exceed historical control limits?
  context: State analysis locates systemic risk by mapping where defects cluster — specific teams, components,
    or high-churn files — and whether they get fixed. Concentrations beyond historical control limits
    indicate a process or ownership problem warranting engineering review, not just individual bug fixes.
    For Harden, this drives targeted training, refactoring, or added review on the riskiest components.
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  pivot null_findings by {team, component, churn_bucket}, state in {fixed, unfixed}\n\
      \  for group in pivot:\n    if concentration(group) > control_limit(history(group)):\n      trigger_engineering_review(group)"
- question: Do commit/module-level ML risk models predict any incoming change as having an elevated probability
    of introducing a null-pointer defect, and are the top contributing features surfaced for review?
  context: Predictive gating catches risk before merge. Train commit/module models using learned code-structure
    features that outperform hand-crafted metrics — e.g., an AST Tree-LSTM and LSTM+random-forest features
    for vulnerability prediction — over inputs like code-complexity delta, pointer-operation frequency,
    author history, and touched-module prior-defect rate. When predicted introduction probability exceeds
    the project threshold, gate enhanced review and surface the top-3 contributing features (e.g., 'pointer-deref
    count +N', 'module prior-defect rate', 'churn') for Explainability so reviewers understand why.
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: ML/Risk-model pseudocode
    query: ">-\n  feats = [complexity_delta, pointer_op_freq, author_history, module_prior_defect_rate,\
      \ churn]\n  p = model.predict_proba(commit, feats)  # AST Tree-LSTM / LSTM+RF\n  if p > project_threshold:\n\
      \    require_enhanced_review(commit)\n    explain(top_3_features(commit))"
- question: Do function/slice-level deep learning detectors layered over deterministic SAST raise additional
    null-deref-prone code that the SAST gate missed, with the contributing slice/tokens surfaced?
  context: ML detectors act as a parallel recall layer above the deterministic SAST floor (they do not
    replace it). Code-gadget BiLSTM (VulDeePecker), dependence-slice models (SySeVR) covering null deref,
    the AST/CFG/DFG graph model (Devign), and the large-scale token model (Russell et al., Draper VDISC)
    can catch patterns rule-based analysis misses. Each prediction should emit the top contributing slice/tokens
    (Explainability) so analysts can verify. A hit warrants manual review even if SAST was clean.
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: ML/Detector pseudocode
    query: ">-\n  for fn in functions:\n    slices = extract_code_gadgets_and_dependence_slices(fn)\n\
      \    score = ensemble([VulDeePecker, SySeVR, Devign, Draper_VDISC]).predict(slices)\n    if score\
      \ > recall_threshold and not flagged_by_SAST(fn):\n      review(fn); explain(top_contributing_slice_tokens)"
- question: Are ML vulnerability detectors trained and evaluated on realistic code corpora (not synthetic
    artifacts), and is the deterministic null-check SAST gate preserved as the authoritative floor?
  context: 'Per Chakraborty et al. ''Are We There Yet?'', ML vulnerability detectors collapse and learn
    dataset artifacts unless trained/evaluated on realistic code (e.g., ReVeal). Therefore ML must never
    replace deterministic null-check SAST gates — it serves only as a parallel recall layer, validated
    on realistic corpora, with name/usage anomaly detectors (e.g., DeepBugs) as an explainable complement.
    This question audits the program''s methodology: a negative answer (ML used as sole gate, or validated
    only on synthetic data) is itself a finding that undermines hardening assurance.'
  answer_sources:
  - SAST Scan Results
  - DAST Scan Results
  - Source Code Repository
  - Compiler Warning Logs
  - 'NAI: Source code repositories, application build servers, and application testing environments.'
  range: Last 90 days
  queries:
  - technology: ML/Validation pseudocode
    query: ">-\n  assert training_corpus.is_realistic()  # e.g., ReVeal, not synthetic-only\n  report(metrics_on_realistic_holdout)\n\
      \  assert SAST_null_gate.enforced == True   # deterministic floor stays authoritative\n  ml_role\
      \ = 'parallel_recall_layer'        # never sole gate\n  complement = DeepBugs_name_usage_anomaly(explainable=True)"
- question: Do crash dumps or sanitizer reports show access-violation/SIGSEGV faults at or near a null
    address (faulting address 0x0 / low page) during test or production execution?
  context: 'This is the runtime manifestation of CWE-476: a NULL pointer was actually dereferenced. Alert
    on access-violation/SIGSEGV faults at or near address 0x0 (low memory page) in crash dumps and on
    ASan/UBSan reports flagging null dereference. Fuzzing and DAST that reproduce these are recognized
    detection methods for the weakness. A positive is concrete proof of a reachable null-deref defect
    — far stronger than a static-only finding — and should be prioritized for fix and exploitability assessment.'
  answer_sources:
  - Application Crash Logs
  - DAST Scan Results
  - Compiler Warning Logs
  - 'NAI: Application test environments, fuzzing harnesses, crash-reporting pipelines, and CI build logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  for event in {crash_dumps, asan_ubsan_reports}:\n    if event.signal in ('SIGSEGV','ACCESS_VIOLATION')\n\
      \       and event.fault_addr <= LOW_PAGE_LIMIT  # ~0x0..0x1000\n       or event.sanitizer == 'null-dereference':\n\
      \      alert(module, function, fault_addr, stack)"
- question: Which SAST null-pointer findings also appear as compiler warnings, DAST outcomes, or runtime
    crash signatures — i.e., are confirmed reachable across both static and dynamic streams?
  context: Correlating static findings (GCC/Clang/Infer:Pulse) with compiler warnings, DAST results, and
    crash signatures from test runs escalates defects that appear in BOTH streams as confirmed-reachable
    and therefore highest priority. A static finding alone may be infeasible; a matching runtime crash
    proves feasibility. This cross-stream correlation lets the Harden program focus remediation on defects
    with demonstrated exploit reachability.
  answer_sources:
  - Application Crash Logs
  - DAST Scan Results
  - Compiler Warning Logs
  - 'NAI: Application test environments, fuzzing harnesses, crash-reporting pipelines, and CI build logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: ">-\n  static = sast_findings(file, function, line)  # GCC/Clang/Infer:Pulse\n  dynamic = union(compiler_warnings,\
      \ dast_results, crash_signatures)\n  for s in static:\n    if match(s, dynamic by {file, function,\
      \ near_line}):\n      escalate(s, status='confirmed-reachable', priority='high')"
- question: What is each module's null-deref crash rate (count per test-hour or per release) and the pass/fail
    state of guarded vs unguarded paths, and does any module exceed its historical control limit?
  context: Failure-mode profiling tracks how often null-deref faults occur per module and contrasts guarded
    versus unguarded code paths, revealing where defenses are missing or regressing. Alert when a module's
    null-fault rate exceeds its historical control limit. Benchmark detector recall against the NIST Juliet/SARD
    CWE-476 corpus so the rate metric is credible. A breach indicates a module whose hardening is degrading
    and needs review.
  answer_sources:
  - Application Crash Logs
  - DAST Scan Results
  - Compiler Warning Logs
  - 'NAI: Application test environments, fuzzing harnesses, crash-reporting pipelines, and CI build logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for module in modules:\n    rate = null_deref_crashes(module) / (test_hours or releases)\n\
      \    compare(guarded_path.fail_rate, unguarded_path.fail_rate)\n    if rate > control_limit(history(module)):\
      \ alert(module)\n  benchmark recall vs NIST_Juliet_SARD_CWE476"
- question: Among reproduced null-deref crashes, which are most exploitable when ranked by learned function-level
    vulnerability detectors, and what are the top contributing code features for each?
  context: Not every null-deref crash is equally dangerous; some are merely denial-of-service while others
    enable code execution. Restricting learned function-level detectors (Devign, SySeVR) to crash-implicated
    functions ranks reproduced crashes by exploitability so analysts triage the riskiest first. Surface
    the top-3 contributing code features per ranking (Explainability) to justify the priority. This directs
    limited remediation capacity toward the crashes most useful to a sophisticated attacker.
  answer_sources:
  - Application Crash Logs
  - DAST Scan Results
  - Compiler Warning Logs
  - 'NAI: Application test environments, fuzzing harnesses, crash-reporting pipelines, and CI build logs.'
  range: Last 90 days
  queries:
  - technology: ML/Triage pseudocode
    query: ">-\n  crash_fns = functions_implicated_by(reproduced_null_deref_crashes)\n  for fn in crash_fns:\n\
      \    score = ensemble([Devign, SySeVR]).exploitability(fn)\n    explain(top_3_features(fn))\n  triage\
      \ = sort(crash_fns by score desc)"
