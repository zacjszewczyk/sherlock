  queries:
  - technology: SIEM/Rule pseudocode
    query: 'lookup ti_feed BY conn.id_orig_h AS ip_match

      lookup ti_feed BY dns.query, http.host AS domain_match

      IF ip_match OR domain_match THEN ENRICH existing_interaction_alert (do not gate)'
- question: Are any honey-DNS queries lexically consistent with DNS tunneling or exfiltration from a compromised
    decoy?
  context: On honey-DNS queries (Zeek dns.log), apply deterministic lexical thresholds — fully-qualified
    name length > 52 characters, label count > 5, or unique-character ratio > 0.5 — to flag tunneling/exfiltration
    cradles emanating from a compromised decoy. Tune the thresholds to the decoy's own minimal baseline
    DNS, which is naturally sparse. Within the Deceive tactic this catches an adversary using the honeynet
    as a launch point to smuggle data out over DNS. A positive result warrants immediate isolation and
    capture of the full query stream; a negative result means observed DNS resembles normal lookups.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM dns.log

      fqdn_len = length(query); labels = count(split(query,''.''))

      uniq_ratio = distinct_chars(query)/length(query)

      IF fqdn_len>52 OR labels>5 OR uniq_ratio>0.5 THEN ALERT ''possible_dns_tunneling'''
- question: Has inbound connection volume or unique-source-IP count to the honeynet spiked above its quiescent
    baseline?
  context: Baseline the daily/hourly volume of inbound connections and the count of unique source IPs
    to the honeynet (Zeek conn.log, firewall logs), then alert on spikes exceeding median + 3*MAD (robust
    to outliers) or > 3 standard deviations. A surge indicates a new scanning campaign or worm propagation
    reaching the decoy. Derive per-environment thresholds from a 14-30 day baseline of the decoy's quiescent
    traffic. For the Deceive tactic this characterizes the scale and timing of adversary reconnaissance
    against the decoy and helps distinguish broad internet background noise from a targeted push.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
