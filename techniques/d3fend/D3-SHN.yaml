    infrastructure.'
  range: Last 90 days (baseline over 14-30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'failed_logons = count(EventID=4625) per src per min

      nxdomain_rate = count(dns.rcode=NXDOMAIN) per min

      blocked = count(conn RST/blocked) per min

      FOR each metric: IF value > baseline_med + 3*MAD THEN ALERT (brute-force / DGA / probing)'
- question: Do attempted credentials, DNS names, or command-line arguments show entropy or length consistent
    with automation or obfuscation?
  context: Compute Shannon entropy of attempted usernames/passwords (Cowrie JSON) and of honey-DNS query
    names; high entropy over a short window suggests automated credential stuffing or domain-generation-algorithm
    activity. Separately, flag command-line arguments (Event ID 4688 / Cowrie input) whose length falls
    in the 99th percentile, which is indicative of obfuscated or encoded payloads. For the Deceive tactic
    this distinguishes machine-driven brute force and DGA from deliberate human interaction and surfaces
    likely obfuscated tooling for deeper analysis. Baseline entropy/length distributions against the decoy's
    own sparse activity.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR cred IN cowrie(username,password): e=shannon_entropy(cred)

      FOR q IN dns.query: e=shannon_entropy(q)

      IF e > entropy_threshold over short_window THEN FLAG ''automation/DGA''

      IF length(cmdline 4688/cowrie) >= p99 THEN FLAG ''obfuscated_payload'''
- question: Does any outbound connection from a decoy exhibit periodic, low-jitter beaconing characteristic
    of C2?
  context: For any outbound connection from a compromised decoy (Zeek conn.log/ssl.log), score inter-arrival-time
    regularity using a discrete Fourier transform, coefficient of variation (CV < 0.1), and MAD dispersion,
    plus data-size consistency, to separate low-jitter automated C2 from human activity; alert on a beacon
    score > 0.9. Tune against benign-periodicity baselines so that update, NTP, and keep-alive automation
    does not false-positive. In the Deceive tactic, any egress from a decoy is already suspicious, and
    confirmed beaconing periodicity strongly indicates the decoy has been compromised and is calling home
    to a controller.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each outbound conn (conn.log/ssl.log) grouped by (src,dst):\n  iat = inter_arrival_times();\
      \ cv = std(iat)/mean(iat)\n  fft_score = dominant_frequency_power(iat); size_consistency = 1-cv(bytes)\n\
      \  beacon_score = combine(fft_score, cv<0.1, MAD, size_consistency)\n  IF beacon_score > 0.9 THEN\
      \ ALERT 'c2_beaconing'"
- question: When clustering connection-log behavior, do any outbound flows group into low-jitter C2 clusters
    distinct from interactive activity?
  context: Apply a clustering algorithm (DBSCAN/HDBSCAN) to Zeek conn.log features (duration, bytes_in/bytes_out,
    inter-arrival interval, port) to differentiate regular low-jitter C2 from interactive human activity,
    treating sparse outliers as novel campaigns. Surface the top-3 contributing features (for example
    interval CV, bytes_out, duration) in the alert text via SHAP rather than presenting only a score,
    so analysts can understand why a flow was grouped. For the Deceive tactic this helps catalog the families
    of automated C2 reaching out from compromised decoys and isolates rare, possibly hands-on-keyboard,
    behavior for review.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(conn.log)[duration, bytes_in, bytes_out, iat_interval, port]

      labels = HDBSCAN(X)

      FOR cluster: IF low_jitter_c2_profile OR sparse_outlier THEN ALERT

      explain top-3 features via SHAP in alert text'
- question: Do one-class anomaly models trained on the decoy's own baseline flag any anomalous outbound
    or lateral flows?
  context: 'Because a honeynet''s benign ''normal'' is narrow and well-bounded, train Isolation Forest,
    One-Class SVM, or a deep autoencoder on the decoy''s own baseline NetFlow/Zeek features and flag anomalous
    outbound/lateral flows as compromise indicators without needing labeled attack data. Report the top
    contributing features per alert via SHAP for explainability. This fits the Deceive tactic perfectly:
    the decoy''s tightly constrained normal makes deviations highly informative, so an anomaly is a strong
    compromise indicator. A positive result should trigger flow capture and host investigation; a negative
    result confirms the decoy is behaving within its learned baseline.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days (baseline over 14-30 days)
  queries:
  - technology: ML/pseudocode
    query: 'model = IsolationForest|OneClassSVM|Autoencoder fit on baseline(NetFlow/Zeek decoy features)

      score = model.anomaly_score(new_flow)

      IF score > threshold THEN ALERT ''anomalous_egress'' WITH shap_top_features'
- question: Is there evidence of C2 hidden in TLS-encrypted egress from a decoy, detectable without decryption?
  context: For TLS-encrypted outbound traffic from a compromised decoy, use self-supervised contrastive
    learning on flow-level metadata (packet sizes, timing, TLS handshake/JA3 features) to detect C2 and
    anomalies without decryption, generalizing to unseen frameworks. Run this in parallel with the deterministic
    'any egress from a decoy is suspicious' rule so encrypted channels are not a blind spot. Within the
    Deceive tactic this ensures adversaries using TLS to mask C2 from a decoy are still caught, and JA3/metadata
    signatures help fingerprint the tooling in use.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'feats = flow_metadata(packet_sizes, timing, tls_handshake, ja3) for TLS egress

      z = contrastive_encoder(feats)

      IF anomaly(z) THEN ALERT ''encrypted_c2_suspected''  # runs parallel to deterministic egress rule'
- question: When attacker session transcripts are clustered, which sessions represent automated campaigns
    and which are rare novel tradecraft?
  context: Cluster attacker sessions by command sequences, downloaded payload hashes, and targeted services/ports
    (from Cowrie JSON and Event ID 4688) to group automated/scripted campaigns and isolate novel interactive
    tradecraft as outliers for analyst review. Most captured activity clusters tightly into known automated
    behavior; the analytic value is in the rare clusters, which should be prioritized. This is the core
    payoff of the Deceive tactic — the honeynet's whole purpose is to elicit and characterize attacker
    behavior — so surfacing the unusual sessions yields the highest-value intelligence on emerging TTPs.
