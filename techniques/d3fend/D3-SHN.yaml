  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days (baseline over 14-30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = stats over 14-30d of count(conn) and dcount(src_ip) per hour

      med=median(baseline); mad=MAD(baseline)

      IF current_hour_volume > med + 3*mad THEN ALERT ''honeynet_scan_spike'''
- question: Are failure and error rates — failed logons, NXDOMAIN responses, and blocked/RST connections
    — bursting beyond baseline?
  context: Treat failure/error rates as distinct signals. Count failed logons (Event ID 4625) per source,
    NXDOMAIN responses on honey-DNS, and blocked/RST connections per minute. A burst of failed logons
    (for example, > 10/min from one source) indicates brute-forcing; a high NXDOMAIN rate indicates DGA
    or scanning; spikes in blocked connections indicate probing. Baseline each rate and alert on > 3*MAD
    deviations. Within the Deceive tactic these failure modes reveal the adversary's automated tooling
    and access attempts against the decoy before any successful interaction, giving early warning of escalation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
