name: 'D3-SHN: Standalone Honeynet'
id: 94875bd0-6cd8-474f-8b6c-4f7e5c102f0a
description: Investigate adversary interactions within a standalone honeynet — an isolated decoy environment
  with no legitimate users that exists solely to attract and observe attacker behavior. Because nothing
  legitimate should ever touch this environment, any inbound connection, shell login or command, file
  access, authentication attempt, honeytoken/canary trigger, or outbound (C2/exfiltration) traffic is
  unauthorized by construction. This playbook helps an analyst surface and triage those interactions across
  endpoint logs (Windows Event IDs, Cowrie shell decoys), network logs (Zeek conn/dns/http/ssl, firewall),
  and threat intelligence; it combines deterministic 'alert on any interaction' rules with statistical
  baselining (scan-volume spikes, failure-rate bursts, entropy, beaconing periodicity) and machine-learning
  methods (clustering, one-class anomaly detection, encrypted-traffic C2 detection, attacker session clustering)
  to characterize the TTPs being observed and prioritize novel tradecraft for review.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Deceive
contributors:
- Zachary Szewczyk
created: '2026-05-31'
