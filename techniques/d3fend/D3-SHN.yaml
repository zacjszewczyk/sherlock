questions:
- question: Did any inbound connection, shell login, command execution, or file access occur anywhere
    within the standalone honeynet?
  context: 'A standalone honeynet has no legitimate users, so this is the deterministic floor of detection:
    ANY inbound connection to a honeynet IP/service (Zeek conn.log), ANY login attempt or command in a
    shell decoy (Cowrie JSON; Windows Event ID 4688/4624/4625), and ANY file access (Event ID 4663) is
    unauthorized by construction and must raise a high-fidelity alert with near-zero false positives.
    In support of the Deceive tactic, the decoy exists to elicit attacker behavior, so alert first and
    enrich/triage second. Capture source IP, source/destination ports, username, the full command line,
    and bytes transferred so responders can immediately characterize the interaction. A positive result
    confirms adversary presence; a clean result is the expected steady state for a properly isolated decoy.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "IF conn.log inbound_to_honeynet OR cowrie.login OR EventID IN (4688,4624,4625) OR EventID=4663\n\
      \  THEN ALERT severity=high\n  FIELDS src_ip, src_port, dst_port, username, command_line, bytes_transferred"
- question: Was any pre-seeded honey credential, honey token, honey-DNS name, or honey-URL ever used or
    accessed?
  context: Canary tokens and honey credentials are tripwires planted solely within the honeynet. Alert
    immediately on any authentication attempt (Windows Event ID 4624/4625) or file access (Event ID 4663)
    using these pre-seeded identities, and on any resolution of a honey-DNS name or HTTP request to a
    honey-URL. Because these artifacts have no legitimate use, a trigger confirms adversary presence with
    effectively zero false positives and often reveals that an attacker has already harvested credentials
    elsewhere. This directly advances the Deceive tactic by turning planted bait into a confirmed-compromise
    signal. Include the accessing source, the token identity, and the timestamp in the alert.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Cowrie JSON session log
  - Firewall connection logs
  - 'NAI: The standalone honeynet environment, including all virtual machines, network segments, and logging
    infrastructure.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "IF (EventID IN (4624,4625) AND account IN honey_credentials)\n   OR (EventID=4663 AND object_path\
      \ IN honey_token_files)\n   OR (dns.query IN honey_dns_names) OR (http.uri IN honey_urls)\n  THEN\
      \ ALERT severity=critical FIELDS src, token_id, timestamp"
- question: Do any source IPs or domains observed in the honeynet match known-malicious threat-intelligence
    indicators?
  context: 'Correlate source IP addresses from Zeek conn.log and domain names from Zeek dns.log/http.log
    against a threat-intelligence feed of known malicious indicators. A match enriches — it does not gate
    — the deterministic interaction alert: the first-party ''any interaction is unauthorized'' logic must
    still fire even with no TI hit. For the Deceive tactic, a TI match helps attribute the observed TTPs
    to known campaigns, infrastructure, or actor sets, accelerating triage and reporting. Treat a non-match
    as uninformative rather than exculpatory, since novel infrastructure is common.'
  answer_sources:
