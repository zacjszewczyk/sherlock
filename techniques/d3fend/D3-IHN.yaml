questions:
- question: Did any network flow (Zeek conn.log or firewall connection log) have a source or destination
    that matches a designated integrated-honeynet asset, and is that source a real production host or
    external actor rather than a sanctioned health-check/scanner?
  context: 'On an integrated honeynet no production system should ever legitimately communicate with the
    deception infrastructure, so any flow touching a honeynet asset is suspicious by construction and
    should generate a high-priority alert. This directly measures the Deceive objective: the decoys are
    working only if interaction is rare and attributable to an adversary. The analyst matches flow src/dst
    against the authoritative honeynet asset inventory, then subtracts an explicit allowlist of sanctioned
    vulnerability scanners and monitoring/health-check IPs so their routine probes do not mask a real
    intrusion. A positive result (a non-allowlisted internal host or external IP touching the honeynet)
    is strong evidence an adversary has discovered and engaged the decoy; a negative result over time
    validates honeynet isolation. Pivot on the source IP/host to find what else it touched and whether
    the contact preceded authentication or command-execution events. References: [Demystifying Deception
    Technology: A Survey](https://arxiv.org/abs/1804.06196) [Application Layer Cyber Deception without
    Developer Interaction](https://arxiv.org/abs/2405.12852).'
  answer_sources: &id001
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - Firewall connection logs
  - Honeytoken/Canarytoken trigger logs
  - 'NAI: The dedicated network segment hosting the integrated honeynet — all high-interaction decoy endpoints,
    servers, the data-control gateway/firewall, and the network monitoring sensors observing traffic to/from
    and within the honeynet subnet — plus the egress path between the honeynet and production.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "honeynet = lookup(honeynet_asset_inventory);\nallow = lookup(sanctioned_scanner_healthcheck_ips);\n\
      flows = zeek_conn UNION firewall_conn\n  where src_ip in honeynet OR dst_ip in honeynet;\nalert\
      \ HIGH when flows.peer_ip not in allow;\noutput ts, src_ip, dst_ip, dst_port, proto, bytes, matched_honeynet_asset."
- question: Did any successful logon (Windows Event ID 4624) to a decoy host use canary/decoy-only credentials,
    or was any planted honeyword, fake AWS key, honeytoken, or Canarytoken (URL, DNS name, document, or
    executable) submitted or triggered — and what attacker source IP and user-agent context fired with
    it?
  context: 'Canary credentials, honeywords, and honeytokens are zero-false-positive tripwires: the accounts
    and tokens have no legitimate use, so a single hit conclusively proves hands-on adversary interaction
    and that stolen/planted material is being exercised. This is among the most decisive evidence for
    the Deceive objective. Verify decoy logons out-of-band via a honeychecker so one detection is treated
    as conclusive rather than waiting for corroboration. Embeddable Canarytokens fire on first interaction
    and carry the attacker''s source IP and user-agent, giving immediate attribution context. A positive
    result should trigger immediate incident response — identify where the credential/token was originally
    staged to understand the adversary''s path, and hunt for reuse of the same credential against real
    assets. There is effectively no benign explanation, so tuning is unnecessary. References: [Honeywords:
    Making Password-Cracking Detectable](https://people.csail.mit.edu/rivest/pubs/JR13.pdf) [Tripwire:
    Inferring Internet Site Compromise](https://cseweb.ucsd.edu/~voelker/pubs/tripwire-imc17.pdf) [Canarytokens](https://docs.canarytokens.org/guide/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "canary_accts = lookup(decoy_only_accounts);\ntokens = honeytoken_canarytoken_trigger_logs;\n\
      logons = win_event(4624) where account in canary_accts;\nalert CRITICAL when logons present\n  AND\
      \ honeychecker.verify(account)=true;\nalert CRITICAL when tokens.fired=true;\noutput account, src_ip,\
      \ user_agent, host, token_type, ts."
- question: Was any SACL-audited decoy honeyfile on an integrated-honeynet host opened or read (Windows
    Event ID 4663), and which account, process, and source performed the access?
  context: 'Honeyfiles are decoy documents placed on honeynet hosts with object-access auditing (SACL)
    enabled; because they contain no real data and serve no business function, any read/open is a deterministic,
    near-zero-false-positive signal of adversary collection or reconnaissance. Enticing content (credential-looking
    files, ''passwords.xlsx'', ''finance_backup'') is tuned so attackers reliably engage. For the Deceive
    objective this confirms not just presence but intent to collect. The analyst reviews Event ID 4663
    for the accessing account and process, then correlates back to the logon (4624) and forward to any
    subsequent process creation (4688) or outbound flow to reconstruct the collection chain. A positive
    result indicates an actor browsing for sensitive data; correlate with the honeyfile name to gauge
    what lure was effective. References: [TSM: Measuring the Enticement of Honeyfiles with NLP](https://arxiv.org/abs/2203.07580).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "honeyfiles = lookup(sacl_audited_decoy_files);\nreads = win_event(4663)\n  where object_name\
      \ in honeyfiles\n  and access_mask in [ReadData, ReadEA, Execute];\nalert HIGH when reads present;\n\
      output ts, subject_account, process_name, object_name, host."
- question: On decoy systems, did process creation (Windows Event ID 4688) show known attacker tooling,
    reconnaissance commands, or credential-dumping patterns, and can a logon (4624) be linked to subsequent
    process starts (4688) and file-access (4663) as a multi-step engagement chain rather than opportunistic
    scanning?
  context: 'Once an adversary has hands-on access to a high-interaction decoy, their tooling and commands
    appear in process-creation telemetry. Monitoring Event ID 4688 for recon commands (whoami, net, nltest,
    systeminfo), credential-dumping (mimikatz, lsass access, comsvcs.dll), and known offensive tooling
    reveals tradecraft. Critically, linking 4624 -> 4688 -> 4663 into a chain distinguishes a sustained,
    multi-step engagement (active hands-on-keyboard adversary worth deep collection) from a one-off scan.
    The observed protocol/host/asset attributes are compared against the expected decoy policy to confirm
    a rogue interactor. For the Deceive objective this characterizes WHAT the adversary does once inside.
    A positive multi-step chain warrants full session capture and IoC extraction; escalate accordingly.
    References: [A Survey on Honeypot Software and Data Analysis](https://arxiv.org/abs/1608.06249) [Wireless
    Rogue Access Point Detection Using Shadow Honeynet](https://doi.org/10.1007/s11277-015-2408-0).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = win_event(4688) on decoy_hosts;\nsuspicious = proc where cmdline matches\n  [recon_cmds,\
      \ cred_dump_patterns, known_attacker_tools];\nchain = correlate win_event(4624)->4688->4663\n  by\
      \ host, logon_id within session;\nalert when suspicious OR chain.steps>=2;\ndeviation = compare(observed_attrs,\
      \ expected_decoy_policy);\noutput host, account, parent_proc, cmdline, chain_steps."
- question: Did any decoy initiate an OUTBOUND connection toward a non-decoy production host, an internal
    subnet, or the Internet (Zeek conn.log/firewall), or did expected logging/sensor heartbeats from a
    decoy cease — both indicating a data-control/containment breach?
  context: 'An integrated honeynet deliberately hands the adversary real, high-interaction systems, which
    creates containment risk: the adversary may attempt to pivot, eavesdrop, or move laterally from the
    honeynet toward genuine production. Therefore ANY outbound connection from a decoy toward a non-decoy
    production host, internal subnet, or the Internet must be treated as a data-control breach — alert
    immediately and rate-limit/block per honeywall policy. Equally important, the cessation of expected
    logging or sensor heartbeats from a decoy may indicate the adversary stopped the capture process to
    operate undetected (a known integrated-honeynet risk). For the Deceive objective this is the safety
    boundary: the deployment is only acceptable while containment holds. A positive result is a potential
    live compromise of production via the honeynet and demands immediate containment and IR; do not treat
    as routine. References: [Demystifying Deception Technology: A Survey](https://arxiv.org/abs/1804.06196)
    [Application Layer Cyber Deception without Developer Interaction](https://arxiv.org/abs/2405.12852).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "honeynet = lookup(honeynet_asset_inventory);\noutbound = zeek_conn UNION firewall_conn\n \
      \ where src_ip in honeynet\n  and dst_ip not in honeynet;\nalert CRITICAL when outbound present\
      \ -> rate_limit/block;\nheartbeat = expected_sensor_heartbeats(decoy);\nalert HIGH when heartbeat.missing=true\
      \ (possible log tamper);\noutput src_decoy, dst_ip, dst_class, bytes_out, last_heartbeat."
- question: For each honeynet session, do the Volume (bytes in/out, count of touched objects), Frequency
    (connections/min, commands/min, session duration), or State (ratio of successful vs failed 4624/4625
    logons, TCP resets) metrics exceed the deployment's historical percentile bands (e.g., >P95 command
    rate or byte volume)?
  context: 'Not every honeynet touch is equal: a brief scripted probe differs sharply from a sustained
    hands-on-keyboard session. Computing per-session Volume, Frequency, and State metrics and alerting
    when they exceed per-deployment percentile bands (derived from the honeynet''s own history) prioritizes
    the most engaged, highest-value adversary sessions. For the Deceive objective this triages where to
    focus analyst attention and deception resources. A session above P95 command rate or byte volume suggests
    interactive, intent-driven activity; low-volume high-frequency connection bursts suggest scripted
    scanning. The analyst uses these bands to rank sessions and feed downstream clustering and engagement
    decisions. Thresholds must be deployment-specific because honeynet baselines vary widely. References:
    [A Survey on Honeypot Software and Data Analysis](https://arxiv.org/abs/1608.06249).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "sess = sessionize(zeek_conn, win_event(4624,4625,4663,4688)) by honeynet_host, peer;\nmetrics\
      \ = sess.compute(\n  volume=bytes_in+bytes_out+touched_objects,\n  freq=conns_per_min+cmds_per_min+duration,\n\
      \  state=success_logons/failed_logons, tcp_resets);\nband = percentile(history.metrics, [95]);\n\
      alert when metrics.cmd_rate>band.p95 OR metrics.volume>band.p95;\noutput session_id, host, peer,\
      \ volume, freq, state."
- question: What is the failure/error telemetry per honeynet session — failed logons (4625), connection
    resets, blocked firewall attempts, NXDOMAIN responses (dns.log), and 404/error responses from emulated
    services — and does the pattern indicate brute-force/credential stuffing (high failure, low success)
    versus interactive compromise (a success after failures)?
  context: 'Failure and error telemetry is a distinct adversary signal, not just noise. A high ratio of
    failed logons (4625), TCP resets, blocked firewall attempts, NXDOMAIN lookups, and service error responses
    with little success indicates automated brute-force or credential-stuffing. A burst of failures FOLLOWED
    by a success (4624) indicates the adversary cracked or guessed valid decoy credentials and transitioned
    to interactive compromise — a more serious state. For the Deceive objective, separating these modes
    tells the analyst whether they are watching commodity automation or a deliberate intrusion. Baseline
    the failure rates per decoy and emulated service, then flag both the high-failure brute-force pattern
    and the failure-then-success transition as distinct, named adversary behaviors. References: [Tripwire:
    Inferring Internet Site Compromise](https://cseweb.ucsd.edu/~voelker/pubs/tripwire-imc17.pdf) [Honeywords:
    Making Password-Cracking Detectable](https://people.csail.mit.edu/rivest/pubs/JR13.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "fails = aggregate by session:\n  failed_logons=win_event(4625), resets=zeek_conn.conn_state\
      \ in [REJ,RSTO],\n  blocked=firewall.deny, nx=zeek_dns.rcode='NXDOMAIN', svc_errs=http.status>=400;\n\
      ratio = failed/(failed+success);\nalert 'brute_force' when ratio>P90 and success_count low;\nalert\
      \ 'interactive_compromise' when failures precede success_logon;\noutput session_id, host, fail_counts,\
      \ ratio, first_success_ts."
- question: Does any decoy session's outbound byte volume or connection rate exceed the tuned near-zero
    baseline expected from deception assets, indicating the honeynet is being weaponized to scan/attack
    production or exfiltrate data?
  context: 'Decoys should produce essentially no legitimate outbound traffic, so the expected outbound
    byte volume and connection rate baseline is near zero. Statistically baselining this and alerting
    when a session exceeds tuned thresholds detects the honeynet being turned against the enterprise —
    outbound scanning of production, lateral-movement attempts, or data exfiltration. This complements
    the deterministic outbound-touch rule by catching volumetric abuse and slow-and-low patterns that
    static rules miss. Pair static rate limits with percentile-band anomaly detection so both sudden spikes
    and sustained elevated egress are caught. For the Deceive objective this is a data-control safeguard:
    a positive result means containment may be failing and the high-interaction deployment is becoming
    a liability — escalate to containment immediately. References: [Application Layer Cyber Deception
    without Developer Interaction](https://arxiv.org/abs/2405.12852) [A Survey on Honeypot Software and
    Data Analysis](https://arxiv.org/abs/1608.06249).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline(decoy.outbound_bytes, decoy.outbound_conn_rate);  # near-zero\ncur = per_session(zeek_conn\
      \ where src in honeynet, dst not in honeynet);\nalert when cur.bytes_out > static_limit\n  OR cur.bytes_out\
      \ > percentile(base,95)\n  OR cur.conn_rate > percentile(base,95);\noutput decoy, dst_ip, bytes_out,\
      \ conn_rate, baseline_p95."
- question: Do per-session command-line entropy, argument length, and process-diversity distributions
    (from Event ID 4688) exceed historical percentile bands for expected lure-service behavior, and what
    do modeled attacker state transitions and per-state sojourn times (Semi-Markov) reveal about engagement
    depth?
  context: 'Engagement depth distinguishes a transient scan from a sustained, sophisticated intrusion.
    Computing command-line entropy, argument length, and process diversity from Event ID 4688 quantifies
    how complex and varied an adversary''s actions are; sessions exceeding historical percentile bands
    indicate richer hands-on activity than the decoy''s expected lure behavior. Layering a Semi-Markov
    model over attacker state transitions and per-state sojourn times characterizes how the adversary
    moves through phases (recon, credential access, lateral attempts) and how long they dwell in each,
    quantifying engagement depth and the implicit reward/risk. For the Deceive objective this measures
    how effectively the honeynet sustains and reveals adversary behavior. A high-complexity, deep-state-transition
    session is a high-value collection opportunity worth extended, carefully contained engagement. References:
    [A Survey on Honeypot Software and Data Analysis](https://arxiv.org/abs/1608.06249) [Adaptive Honeypot
    Engagement through RL of SMDP](https://arxiv.org/abs/1906.12182).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "feat = per_session(win_event(4688)).compute(\n  cmd_entropy=shannon(cmdline_tokens),\n  arg_len=mean(len(args)),\
      \ proc_diversity=distinct(image));\nalert when feat > percentile(history.feat, 95);\nsmdp = fit_semi_markov(state_transitions,\
      \ sojourn_times);\ndepth = smdp.engagement_depth_score(session);\noutput session_id, cmd_entropy,\
      \ proc_diversity, depth, state_path."
- question: When honeynet sessions are clustered on combined network+host features (byte volume, command
    count/rate, process diversity, touched decoys, failure ratio, outbound attempts), which sessions fall
    into advanced post-exploitation archetypes versus scanner or credential-tester clusters, and what
    top-3 features drive each assignment?
  context: 'Unsupervised clustering organizes the flood of honeynet sessions into interpretable archetypes
    — scanners/bots, credential testers, and hands-on post-exploitation actors — without needing labeled
    data, which is ideal because attacker behavior evolves. Features span both network (byte volume, outbound
    attempts) and host (command count/rate, process diversity, touched decoys, failure ratio). For the
    Deceive objective this prioritizes the advanced clusters that merit deep analyst attention and deception
    investment. Surfacing the top-3 contributing features (e.g., command count, byte volume, decoy-token
    type) in alert text makes triage explainable. The analyst reviews the advanced-cluster members first,
    confirms the defining features make sense, and routes commodity-scanner clusters to lower priority.
    Re-fit periodically as new behavior appears. References: [What are Attackers after on IoT Devices?
    A multi-phased multi-faceted IoT honeypot ecosystem and data clustering](https://arxiv.org/abs/2112.10974)
    [A Survey on Honeypot Software and Data Analysis](https://arxiv.org/abs/1608.06249).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = sessions.features([byte_volume, cmd_count, cmd_rate, proc_diversity,\n  touched_decoys,\
      \ failure_ratio, outbound_attempts]);\nlabels = cluster(X, algo=HDBSCAN/KMeans);\narchetype = map(labels\
      \ -> {scanner, cred_tester, post_exploitation});\nexplain = top3_feature_contributions(X, labels);\n\
      alert on archetype in [post_exploitation];\noutput session_id, archetype, cluster_id, top3_features."
- question: Can a supervised classifier (e.g., SVM) trained on decoy-captured behavioral and content features
    recognize attacker tooling and generalize to previously unseen actors at high precision, with per-prediction
    feature contributions exported for explainable triage?
  context: 'Every byte of honeynet telemetry is attacker-generated, which provides a clean, high-quality
    labeled corpus for supervised learning — a rare advantage. Training a classifier (such as an SVM)
    on captured behavioral and content features lets defenders recognize known attacker tooling and generalize
    to new, previously unseen actors at high precision. For the Deceive objective this converts honeynet
    observations into a reusable detection capability that can also be applied to production telemetry.
    Exporting per-prediction feature contributions makes each alert explainable so the analyst understands
    why a session was flagged (which commands, which content, which network traits). The analyst validates
    high-confidence predictions, feeds confirmed detections back as training data, and watches precision/recall
    drift to schedule retraining. References: [Uncovering Social Spammers: Social Honeypots + Machine
    Learning](https://faculty.cse.tamu.edu/caverlee/pubs/lee10sigir.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'train = labeled_decoy_sessions.features(behavioral + content);

      model = SVM.fit(train.X, train.y=''attacker'');

      pred = model.predict_proba(new_session.features);

      explain = per_prediction_feature_contributions(model, new_session);

      alert when pred.attacker_prob > 0.9;

      output session_id, attacker_prob, top_features, matched_tooling.'
- question: Does a reinforcement-learning policy over the honeynet's Semi-Markov decision process recommend
    risk-averse, cost-effective engagement actions that keep adversaries interacting long enough to collect
    IoCs while bounding the probability of penetration/containment failure inherent to a high-interaction
    integrated deployment?
  context: 'A high-interaction integrated honeynet trades richer intelligence for higher containment risk.
    Reinforcement learning over the honeynet''s SMDP state transitions derives engagement policies that
    maximize collection (keeping the adversary interacting to gather IoCs and tradecraft) while explicitly
    bounding penetration probability — i.e., risk-averse, cost-effective actions per state. For the Deceive
    objective this is the optimization layer: it tells operators when to keep engaging versus when to
    constrain or cut off an adversary as containment risk rises. The learned per-state features also double
    as inputs for the session-classification models above. The analyst uses the policy''s recommended
    actions and risk estimates to make defensible, real-time engagement decisions, and reviews any state
    where the model recommends termination because penetration risk has crossed the acceptable bound.
    References: [Adaptive Honeypot Engagement through Reinforcement Learning of Semi-Markov Decision Processes](https://arxiv.org/abs/1906.12182).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "smdp = build_smdp(honeynet.state_transitions, sojourn_times);\npolicy = RL.train(smdp, reward=ioc_collection,\n\
      \  penalty=penetration_probability, objective=risk_averse);\naction = policy.recommend(current_session.state);\n\
      alert when action='terminate/contain' (risk bound exceeded);\noutput session_id, state, recommended_action,\
      \ est_penetration_risk, ioc_value."
