name: 'D3-IHN: Integrated Honeynet'
id: 6bc64cde-e05a-4d2c-9fda-6fe31004e9dd
description: 'Investigate adversary interaction with an integrated (high-interaction) honeynet — full,
  production-grade decoy systems connected to the enterprise network. Because no legitimate production
  workflow should ever touch the deception infrastructure, ANY authentication, command execution, file
  access, or network flow involving the honeynet is high-confidence adversary evidence. This playbook
  helps an analyst confirm and triage that interaction: deterministic tripwires (any network touch, canary-credential/honeytoken
  use, honeyfile reads, decoy process execution, and — most critically — any outbound/data-control containment
  breach where the adversary pivots from the honeynet toward real production hosts); statistical profiling
  of session volume, frequency, state, failure/error rates, outbound rates, and command complexity to
  separate scanners and bots from hands-on-keyboard actors; and machine-learning approaches that cluster
  sessions into archetypes, train classifiers on decoy-captured attacker behavior, and learn adaptive
  engagement policies that keep adversaries interacting while bounding containment risk. The goal is to
  validate honeynet effectiveness, characterize adversary intent and tradecraft, and detect data-control
  failures before the high-interaction decoys are weaponized against production.'
type: technique
related:
- tactic_id: D3-DC
  tactic_name: Deceive
