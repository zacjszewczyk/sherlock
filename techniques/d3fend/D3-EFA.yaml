name: 'D3-EFA: Emulated File Analysis'
id: cd1e52dd-0d35-4ed0-bc0c-514896d91c65
description: Investigate whether a candidate file is malicious by analyzing its behavior under CPU/sandbox
  emulation rather than relying on static signatures alone. This playbook helps an analyst hunt for deterministic
  execution-behavior signatures (self-decrypting shellcode via GetPC seeds and self-payload reads, malware-exclusive
  API chains such as the VirtualAllocEx -> WriteProcessMemory -> CreateRemoteThread injection sequence,
  anti-analysis/evasion checks, and known family motifs like ransomware shadow-copy deletion and crypto
  loops); statistical profiles of emulation traces (TF-IDF API n-gram rarity, behavioral volume/frequency
  spikes, failure-mode profiles, and cross-environment behavioral divergence that betrays evasive samples);
  and machine-learning classification, sequence modeling, early prediction, explainability, and clustering
  over emulation feature vectors. Evidence is drawn primarily from emulation/sandbox API-call reports
  correlated with files observed in Zeek files.log and Sysmon Event ID 11 (FileCreate) at network ingress/egress,
  mail/web gateways, endpoints, file servers, and the malware-analysis pipeline.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which files traversing the network or written to endpoints, when run on a CPU emulator, exhibit
    self-decrypting shellcode behavior - that is, a GetPC seed instruction (call/fnstenv/jmp-call-pop)
    followed by a large number of unique self-payload byte reads and a long chain of valid executed instructions?
  context: Polymorphic and encrypted shellcode defeats static signatures because the payload bytes change
    on every instance, but the decryption stub must still run on a real CPU - and that execution leaves
    a deterministic, signature-free footprint. Emulating each file/stream from Zeek files.log on a CPU
    emulator and flagging a sample only when (a) a GetPC seed instruction executes (the stub locates its
    own address), (b) the count of unique self-payload byte reads exceeds a tuned threshold (start around
    a few dozen bytes and derive the threshold per-environment against benign payloads to control false
    positives), and (c) the valid executed-instruction chain length exceeds a minimum, isolates self-decrypting
    code with very low false positives. This is the core polymorphic-shellcode-detection heuristic and
    supports the Detect tactic by catching obfuscated payloads at ingress before they ever execute on
    a host. A positive result is strong evidence of malicious self-modifying code; a negative result means
    no self-decryption behavior was observed (but does not clear the file against the other methods).
  answer_sources:
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Emulation/Sandbox API-call report
  - File Content
  - 'NAI: Network ingress/egress points, mail/web gateways, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: Emulation/pseudocode
    query: "for file in zeek_files_log.extracted:\n    trace = cpu_emulate(file)\n    getpc = trace.has_instruction(['call','fnstenv','jmp_call_pop'])\
      \ and trace.self_addr_resolved\n    self_reads = count_unique(trace.reads where addr in payload_region)\n\
      \    chain = trace.max_valid_instruction_chain_len\n    if getpc and self_reads > READ_THRESHOLD\
      \ and chain > MIN_CHAIN:\n        alert('self-decrypting shellcode', file, self_reads, chain)"
- question: Do the API-call sequences captured during emulation match high-fidelity, malware-exclusive
    chains such as process hollowing / DLL injection (VirtualAllocEx -> WriteProcessMemory -> CreateRemoteThread),
    persistence writes, or ransomware crypto setup - and do curated YARA rules over the emulated memory
    dumps hit on shellcode or unpacker patterns?
  context: 'Some API-call sequences appear essentially only in malware: the classic injection chain VirtualAllocEx
    -> WriteProcessMemory -> CreateRemoteThread, autorun/persistence registry writes, and ransomware crypto-context
    setup are rare-to-nonexistent in benign software. Matching emulated API sequences against a curated
    library of these chains (Smith-Waterman sequence alignment tolerates insertions/reordering used for
    evasion) gives high-confidence detections, and running curated YARA rules over the emulated memory
    dumps catches unpacked shellcode and unpacker stubs that only become visible after the file decrypts
    itself in the emulator. This deterministic matching is a detection floor for the Detect tactic. A
    hit on an exclusive chain or a YARA rule over post-emulation memory is a strong, defensible malicious
    verdict.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Emulation/Sandbox API-call report
  - File Content
  - 'NAI: Network ingress/egress points, mail/web gateways, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: Emulation/pseudocode
    query: "MALICIOUS_CHAINS = [['VirtualAllocEx','WriteProcessMemory','CreateRemoteThread'],\n      \
      \              ['RegSetValueEx@Run'], ['CryptAcquireContext','CryptEncrypt']]\ntrace = emulate(file).api_sequence\n\
      for chain in MALICIOUS_CHAINS:\n    if smith_waterman(trace, chain).score >= MATCH_THRESHOLD:\n\
      \        alert('malware-exclusive API chain', file, chain)\nif yara_scan(emulate(file).memory_dumps).matched:\n\
      \    alert('YARA hit on emulated memory', file)"
- question: Does the emulation trace contain anti-analysis or evasion behavior - sleep-jitter loops, timing
    checks (RDTSC / QueryPerformanceCounter deltas), CPUID or hypervisor-artifact probes, debugger checks,
    or locale/keyboard-layout bail-outs - especially when the sample then exhibits no further malicious
    behavior?
  context: 'Sophisticated malware checks its environment and refuses to detonate if it suspects a sandbox
    or analysis host. Detecting these checks - RDTSC/QueryPerformanceCounter timing deltas, CPUID and
    hypervisor-artifact probes, debugger-present checks, long sleep/jitter loops, and locale/keyboard
    bail-outs (e.g., Avaddon''s CIS-region language check) - is itself a high-value signal. MalGene shows
    the exact branching API check that triggers evasion can be extracted. The key inversion: a sample
    that performs these checks and then does nothing malicious should be treated as suspicious, not benign,
    because the absence of behavior is likely deliberate. This supports the Detect tactic by preventing
    evasive samples from being silently cleared. A positive result flags a sample for deeper/instrumented
    analysis.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Emulation/Sandbox API-call report
  - File Content
  - 'NAI: Network ingress/egress points, mail/web gateways, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: Emulation/pseudocode
    query: "EVASION = ['RDTSC','QueryPerformanceCounter','CPUID','IsDebuggerPresent',\n           'GetSystemTime+Sleep','GetKeyboardLayout','GetUserDefaultLangID']\n\
      trace = emulate(file)\nevasion_hits = [a for a in trace.api if a in EVASION]\nif evasion_hits and\
      \ not trace.has_malicious_behavior:\n    alert('evasion checks + dormant payload', file, evasion_hits)"
- question: Does the emulated execution reproduce a known malware-family motif sequence - for example
    the ransomware pattern of vssadmin/wmic shadow-copy deletion followed by a CreateFile -> WriteFile
    -> CryptEncrypt loop?
  context: Malware families have signature behavioral motifs that persist across variants even when code
    is repacked. Alerting on these family-defining sequences observed under emulation - such as the Avaddon
    ransomware motif of deleting volume shadow copies via vssadmin/wmic and then entering a CreateFile/WriteFile/CryptEncrypt
    encryption loop - lets the analyst attribute a sample to a family and apply known response playbooks
    immediately. This supports the Detect tactic with high-confidence, behavior-based family identification.
    A motif hit is strong evidence of family membership and intent (e.g., destructive ransomware) regardless
    of static obfuscation.
  answer_sources:
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Emulation/Sandbox API-call report
  - File Content
  - 'NAI: Network ingress/egress points, mail/web gateways, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: Emulation/pseudocode
    query: "trace = emulate(file)\nshadow_delete = trace.cmdline_matches(['vssadmin delete shadows','wmic\
      \ shadowcopy delete'])\ncrypto_loop = trace.api_loop(['CreateFile','WriteFile','CryptEncrypt'],\
      \ min_iters=N)\nif shadow_delete and crypto_loop:\n    alert('ransomware family motif (Avaddon-like)',\
      \ file)"
- question: For each emulated file, do its TF-IDF-weighted API n-gram features (plus uncommon-API ratio
    and privileged-operation density) exceed a high-percentile benign baseline, marking the API behavior
    as statistically rare relative to normal software?
  context: 'TF-IDF over API n-grams is consistently the strongest single feature separating malware from
    benign software: it up-weights API subsequences that are rare across the benign corpus but characteristic
    of a given sample. Computing TF-IDF-weighted API n-gram features for each emulated file - augmented
    with an uncommon-API ratio and privileged-operation density - and flagging values above a high benign
    baseline (start at the 99th percentile and tune per corpus) surfaces files whose behavior is statistically
    anomalous even when no single hard rule fires. This statistical layer runs in parallel with the deterministic
    floor and supports the Detect tactic by catching novel/obfuscated samples. A high score is a triage
    signal warranting deterministic and ML follow-up.'
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "corpus_idf = load_benign_idf()\nfor file in emulated_files:\n    ng = api_ngrams(file.api_sequence,\
      \ n=[1,2,3])\n    score = tfidf(ng, corpus_idf)\n    score += uncommon_api_ratio(file) + privileged_op_density(file)\n\
      \    if score > percentile(benign_scores, 99):\n        alert('rare API n-gram profile', file, score)"
- question: During emulation, do per-sample volume and rate metrics - bytes written/encrypted, files touched
    per second, memory-write plus remote-thread events, and beacon network calls - show statistically
    significant spikes consistent with malicious activity such as a ransomware encryption loop?
  context: 'The ''physics'' of an attack is measurable: ransomware encrypts a high volume of files per
    second, injectors generate bursts of memory-write and remote-thread events, and beacons emit periodic
    network calls. Tracking these volume and frequency metrics per emulation and flagging statistically
    significant spikes (for example a sustained CryptEncrypt/WriteFile rate matching the Avaddon ransomware
    loop) detects malicious intent by its operational tempo rather than by code. Rolling motif frequencies
    over time also surfaces emerging malware waves across many samples. This supports the Detect tactic.
    A significant spike is evidence of high-impact behavior and should raise quarantine priority.'
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for file in emulated_files:\n    m = file.metrics  # bytes_written, files_per_sec, mem_writes,\
      \ remote_threads, beacons\n    for k,v in m.items():\n        if v > mean(baseline[k]) + 3*std(baseline[k]):\n\
      \            alert('behavioral volume/rate spike', file, k, v)\nrollup_motif_frequency(emulated_files,\
      \ window='7d')  # surface emerging waves"
- question: Across an emulation run, do failure signals - failed/error API return ratios, blocked outbound
    connections, and NXDOMAIN/404 responses during emulated C2 resolution - form a characteristic failure
    profile indicating a dormant, evasive, or broken-C2 sample?
  context: Failures are evidence, not noise. Dormant or evasive samples that detect the sandbox abort
    their payloads, producing high failed/error API return ratios; samples with dead or sinkholed C2 generate
    NXDOMAIN/404 responses and blocked outbound attempts. Profiling these failure modes - and combining
    them with cross-environment behavioral deviation scoring from MalGene and BareCloud - distinguishes
    benign inert files from malware that is merely hiding or whose infrastructure is down. This supports
    the Detect tactic by ensuring evasive/broken samples are not mistaken for clean. A distinctive failure
    profile flags a sample for instrumented re-analysis.
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for file in emulated_files:\n    fail_ratio = file.api_errors / max(file.api_total,1)\n  \
      \  net_fail = file.blocked_conns + file.nxdomain + file.http_404\n    if fail_ratio > FAIL_THRESHOLD\
      \ or net_fail > NET_FAIL_THRESHOLD:\n        dev = cross_env_deviation(file)\n        alert('evasive/broken-C2\
      \ failure profile', file, fail_ratio, net_fail, dev)"
- question: When the same sample is run in multiple environments (emulator, hypervisor, and bare-metal
    where available), does its behavioral deviation score over filesystem, registry, and network actions
    diverge substantially from a reference - indicating environment-aware evasion?
  context: 'The most reliable way to catch sandbox-evasive malware is to compare its behavior across environments:
    a sample that acts benign in an instrumented emulator/hypervisor but detonates on bare-metal is, by
    definition, evading analysis. Computing a behavioral deviation score over filesystem, registry, and
    network actions across environments and flagging samples whose instrumented behavior diverges substantially
    from a reference (the BareCloud approach, which found ~5.3% of 110k samples evasive) directly exposes
    this evasion. This supports the Detect tactic by neutralizing the primary defense of advanced malware.
    A high divergence score is strong evidence of deliberate evasion and warrants treating the sample
    as malicious-until-cleared.'
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for file in samples:\n    b_emu = behavior_vector(run(file,'emulator'))\n    b_hyp = behavior_vector(run(file,'hypervisor'))\n\
      \    b_bare = behavior_vector(run(file,'baremetal'))  # where available\n    dev = max(distance(b_emu,b_bare),\
      \ distance(b_hyp,b_bare))\n    if dev > DIVERGENCE_THRESHOLD:\n        alert('cross-environment\
      \ behavioral divergence (evasive)', file, dev)"
- question: When emulation feature vectors (TF-IDF API n-grams and behavior counts) are scored by a trained
    ensemble classifier (Random Forest / XGBoost), which files receive a high malicious probability for
    quarantine prioritization?
  context: Ensemble tree models lead the Mal-API-2019 benchmark for malware/benign classification on API-based
    features. Training Random Forest / XGBoost on TF-IDF API n-gram and behavior-count features produces
    a calibrated maliciousness score that ranks files for quarantine and analyst attention. Critically,
    the deterministic rules remain authoritative - ML is used to prioritize and surface unknowns, not
    to override hard detections or clear files. This supports the Detect tactic by efficiently triaging
    large volumes of emulated files. A high model score elevates a file for review even when no single
    rule fired.
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, file servers, and the malware-analysis pipeline.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(emulated_file)  # tfidf api n-grams + behavior counts\np = ensemble_model.predict_proba(X)[malicious]\n\
      if p > SCORE_THRESHOLD:\n    queue_for_quarantine(emulated_file, priority=p)\n# deterministic rules\
      \ stay authoritative; ML only prioritizes"
- question: Do sequence models that capture API-call order and arguments (gated-CNN + BiLSTM with argument
    feature hashing, or an LSTM over API sequences) classify the emulated trace as malicious - especially
    for metamorphic or obfuscated samples that defeat plain n-gram counts?
  context: N-gram counts lose the ordering and argument context that distinguish metamorphic/obfuscated
    malware. Sequence models - a gated-CNN + BiLSTM with argument feature hashing (Zhang et al., AAAI
    2020) or an LSTM over API sequences (reported ~95% across families) - learn the order and parameters
    of API calls, catching samples that reorder or pad their calls to evade counting-based detection.
    This supports the Detect tactic by closing the gap on advanced obfuscation. A malicious verdict here,
    especially when n-gram methods are silent, points to deliberate evasion via code transformation.
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, file servers, and the malware-analysis pipeline.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = tokenize_api_with_args(emulated_file.api_sequence)\np = seq_model.predict(seq)  # gated-CNN+BiLSTM\
      \ or LSTM\nif p > SEQ_THRESHOLD:\n    alert('sequence-model malicious verdict', emulated_file, p)"
- question: Using an early-prediction model (transformer/attention-RNN such as EarlyMalDetect) over the
    first API calls of an emulation trace, can a malicious verdict be reached before the full payload
    executes, enabling pre-emptive quarantine?
  context: Waiting for a full emulation run wastes time and risks letting a payload complete in less controlled
    environments. Early-prediction models (EarlyMalDetect-style transformer/attention-RNN architectures)
    predict a malicious verdict from just the first API calls of a trace, allowing the pipeline to quarantine
    a file before its payload fully executes. This supports the Detect tactic by shortening time-to-verdict
    and reducing exposure. An early malicious prediction should trigger immediate containment with the
    full trace completing in the background for confirmation.
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, file servers, and the malware-analysis pipeline.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "partial = emulated_file.api_sequence[:K]  # first K calls\np = early_model.predict(partial)\n\
      if p > EARLY_THRESHOLD:\n    quarantine_now(emulated_file)\n    continue_full_emulation(emulated_file)\
      \  # confirm in background"
- question: Does every ML-generated verdict carry SHAP/LIME feature attributions so the analyst can see
    the top-3 driving features (e.g., VirtualAllocEx, WriteProcessMemory) behind the score rather than
    a bare number?
  context: An opaque ML score is not actionable; analysts need to know why a file was flagged to validate
    and respond. Attaching SHAP/LIME feature attributions to each model verdict and surfacing the top-3
    contributing features (for example VirtualAllocEx and WriteProcessMemory dominating an injection classification)
    turns a score into an investigable lead and exposes false positives driven by spurious features. This
    supports the Detect tactic by making ML output defensible and triage-ready. The presence and content
    of the top-3 features lets the analyst quickly confirm whether the model's reasoning aligns with genuine
    malicious behavior.
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, file servers, and the malware-analysis pipeline.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'p = model.predict_proba(X)

      att_ = shap_explain(model, X)  # or lime_explain

      top3 = top_features(attr, k=3)

      emit_alert(emulated_file, score=p, top_features=top3)

      # every ML alert MUST include top-3 contributing features'
- question: When unsupervised clustering (k-means / DBSCAN) is applied to emulation fingerprints (API
    n-gram / behavior vectors), do previously unknown files group into behavioral families that map to
    known clusters or form new ones requiring detection-rule expansion?
  context: Not every malicious file matches an existing rule or label, but behaviorally similar samples
    cluster together. Applying k-means/DBSCAN to emulation fingerprints groups unseen files into behavioral
    families, letting analysts triage a whole cluster at once, attribute new samples to known families,
    and identify novel clusters that justify writing new deterministic rules (closing the loop back to
    the detection floor). Validated against labeled families in the Mal-API-2019 dataset, this supports
    the Detect tactic by scaling triage and continuously expanding coverage. A new dense cluster of unknowns
    is a signal of an emerging family worth dedicated analysis.
  answer_sources:
  - Emulation/Sandbox API-call report
  - Zeek files.log
  - Windows Event ID 11 (Sysmon - FileCreate)
  - 'NAI: Network ingress/egress points, user endpoints, file servers, and the malware-analysis pipeline.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "fps = [emulation_fingerprint(f) for f in unknown_files]  # api n-gram / behavior vectors\n\
      labels = dbscan(fps, eps=EPS, min_samples=M)  # or kmeans(fps,k)\nfor cluster in groups(labels):\n\
      \    fam = nearest_known_family(cluster)\n    if fam is None:\n        flag_new_family(cluster);\
      \ propose_detection_rules(cluster)\n    else:\n        triage_as(cluster, fam)"
