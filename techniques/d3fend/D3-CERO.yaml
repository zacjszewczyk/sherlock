name: 'D3-CERO: Certificate Rotation'
id: 72ced386-eb39-4b51-acf9-e64c4b95ea2f
description: >-
  Investigate the health, compliance, and integrity of the enterprise certificate-rotation control. This
  playbook helps an analyst answer whether digital certificates and their private keys are being replaced
  on policy by fusing three evidence streams: (1) passive certificate inventory and usage telemetry from
  network and host logs (Zeek x509/ssl, Windows Schannel) to surface overdue/expired, over-validity, over-age,
  weak-crypto, and fail-to-rotate certificates as well as impending-expiry concentrations; (2) reconciliation
  of externally observable Certificate Transparency issuance against the authoritative internal inventory
  to uncover certificates issued outside the sanctioned process, from unapproved CAs, or for shadow/forgotten
  endpoints; and (3) automated certificate-management (ACME) telemetry that profiles rotation reliability
  through missing or failed renewals and recurring challenge/authorization or rate-limit failures. Volume
  (non-compliant certs per segment), Frequency (renewals per cryptoperiod), and State (expired vs valid,
  rotated vs stale, reconciled vs orphaned) are all measured so the analyst can detect cryptographic-hygiene
  gaps, broken automation, and possible rogue or mis-issued certificates that could enable interception
  of sensitive communications.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which certificates observed on the network are already expired or fall within escalating near-expiry
    warning windows (e.g., 30/14/7/0 days), and does every such certificate have an assigned owner who
    can drive immediate replacement?
  context: >-
    Tactic Harden: an expired or about-to-expire certificate is a direct rotation-control failure that
    breaks secure communications and erodes trust. Compute remaining validity = not_valid_after - now
    from Zeek x509.log and alert when State=expired or when the certificate enters tiered warning windows
    tuned to your remediation lead time. Maintain a continuously updated inventory and assign every certificate
    an owner (per NIST SP 1800-16) so alerts route to a responsible party. A positive result means certificates
    are slipping past rotation deadlines; a negative result confirms the renewal pipeline keeps validity
    comfortably ahead of expiry.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      from x509.log compute days_left = (not_valid_after - now)/86400

      if days_left <= 0 -> alert State=expired severity=critical

      elif days_left in {<=7,<=14,<=30} -> alert near_expiry tier=days_left owner=lookup(subject)
- question: Are any certificates in use built on disallowed key sizes (RSA/DH/DSA < 2048 bits, ECC < 224
    bits) or deprecated signature algorithms (MD5, SHA-1), or signed by unapproved issuers, and which
    of those are actively exposed in live TLS sessions?
  context: >-
    Tactic Harden: weak cryptographic artifacts undermine the integrity the rotation control is meant
    to preserve and are exploitable by a sophisticated actor. Flag certificates whose key size or signature
    algorithm falls below NIST SP 800-57 Part 1 strength tables, or whose issuer is not on the approved
    list, then correlate with Zeek ssl.log usage to prioritize violations that are actively serving traffic.
    Treat a key in use past its cryptoperiod as a violation regardless of expiry date. A positive result
    identifies concrete crypto-hygiene debt requiring re-issuance with stronger parameters.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      from x509.log

      weak = (key_alg in {RSA,DSA,DH} and key_len<2048) or (key_alg==EC and curve_bits<224)

      weak = weak or sig_alg matches /(md5|sha1)/i or issuer not in approved_issuers

      if weak -> join ssl.log on cert_chain_fps to mark actively_exposed; alert
- question: Do any certificates have a total validity span (not_valid_after - not_valid_before) exceeding
    the current CA/Browser Forum maximum on the shrinking schedule, or an age exceeding the organization's
    rotation policy?
  context: >-
    Tactic Harden: as the CA/B Forum ceilings shrink (<=398 days today; 200 days from 2026-03-15; 100
    days from 2027-03-15; 47 days from 2029-03-15), long-lived certificates become an increasingly reliable
    non-compliance signal. Compute the validity span from Zeek x509.log and compare against the effective
    ceiling for the observation date, and separately compare certificate age against internal policy.
    A positive result flags certificates issued with non-compliant lifetimes that should be re-issued
    under shorter, auto-renewed terms.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      ceiling = effective_cab_max(today)  # 398/200/100/47 by date schedule

      from x509.log span_days = (not_valid_after - not_valid_before)/86400

      if span_days > ceiling or (now - not_valid_before) > policy_max_age -> alert over_validity
- question: Is the same certificate serial or Subject Public Key Info fingerprint persisting on a host
    beyond its expected rotation window, indicating the certificate never rotated or a private key is
    being reused across renewals?
  context: >-
    Tactic Harden: against the modern short-lifetime, auto-renewed norm (e.g., Let's Encrypt 90-day certs),
    a static fingerprint and unchanged not_valid_before across a window is a deterministic 'did not rotate'
    indicator and frequently signals private-key reuse across renewals - a serious hygiene and compromise-containment
    concern. Track per-host certificate serial / SPKI fingerprint over time from Zeek x509.log and alert
    when it remains constant past the expected rotation interval. A positive result means rotation is
    stalled even if the certificate has not yet expired.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      group x509.log by host, subject

      if distinct(spki_fingerprint) == 1 and unchanged(not_valid_before) over window > expected_rotation
        -> alert fail_to_rotate (possible key reuse)
- question: How do certificate age and remaining-validity distributions look across each business unit
    and service tier, and does any segment's 95th-percentile age, expired-certificate prevalence, or weak-crypto
    prevalence exceed policy tolerance?
  context: >-
    Tactic Harden: aggregate compliance posture reveals systemic rotation weakness that single-certificate
    alerts miss. Build inventory from Zeek x509.log, compute age and remaining-validity distributions
    per business unit and service tier, and alert when the 95th-percentile age, expired prevalence, or
    weak-crypto prevalence breaches tolerance. Derive baselines from your own fleet's history, contextualized
    by ecosystem norms (Durumeric et al.). A positive result points to organizational units whose rotation
    program needs investment.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      stats by business_unit, service_tier:
        p95_age = percentile(cert_age,95), expired_rate = avg(state==expired), weak_rate = avg(weak_crypto)
      alert where p95_age>policy or expired_rate>tol or weak_rate>tol
- question: What is the renewal interval per certificate (time between successive not_valid_before values
    for the same subject/SAN), and which certificates renew far above the fleet median or show no renewal
    event before expiry?
  context: >-
    Tactic Harden: the short-lifetime automated-renewal norm makes long, irregular, or absent renewal
    cadence a statistical Frequency outlier. Measure successive not_valid_before deltas per subject/SAN
    from x509.log inventory and flag intervals far above the fleet median or certificates with no renewal
    before expiry. A positive result identifies certificates whose rotation cadence diverges from the
    managed population, often because automation is absent or manual processes are lagging.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per subject/SAN: intervals = diff(sorted(not_valid_before))

      fleet_median = median(all intervals)

      alert where interval > k*fleet_median or no_renewal_before(expiry)
- question: Based on certificates entering the expiration window each day, is the projected rotation backlog
    forecast to exceed the team's remediation capacity?
  context: >-
    Tactic Harden: continuous monitoring and capacity planning (NIST SP 1800-16) require anticipating
    future load, not just reacting to today's expirations. Build a daily time-series forecast of certificates
    entering the expiry window from inventory and compare observed counts against predicted baselines,
    raising risk when projected backlog exceeds remediation capacity. A positive result warns that the
    rotation pipeline will be overwhelmed, enabling pre-emptive staffing or automation before outages
    occur.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      ts = daily count(certs entering expiry window)

      forecast = timeseries_forecast(ts, horizon=30d)

      alert where forecast.backlog > team_remediation_capacity
- question: What is the prevalence of issuers, key sizes, and signature algorithms across the certificate
    population, and which rare or never-before-seen issuers or atypical key sizes appear on a given segment?
  context: >-
    Tactic Harden: rare attribute combinations often indicate certificates provisioned outside the sanctioned
    process - shadow IT or, worse, rogue issuance. Compute prevalence of issuers, key sizes, and signature
    algorithms across the population (per Durumeric et al. baselines) and flag rare/unseen issuers or
    atypical key sizes on a segment as review candidates. A positive result surfaces outlier certificates
    worth manual validation against the approved issuance pipeline.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      stats count by issuer, key_size, sig_alg over population -> prevalence

      alert where prevalence(issuer)<rarity_floor or never_seen(issuer)
             or atypical(key_size) for segment
- question: Which certificates does an unsupervised outlier model (Isolation Forest / One-Class SVM) flag
    as deviating from the managed population, and what are the top-3 contributing features for each?
  context: >-
    Tactic Harden: deterministic rules cannot capture every off-population pattern. Train an Isolation
    Forest or One-Class SVM on per-certificate feature vectors (remaining validity, age at observation,
    key size, signature algorithm, issuer rarity, renewal interval, owner team, service criticality) to
    flag deviations, running in parallel with the rules. Surface the top-3 contributing features via LIME/SHAP
    in the alert rather than only a score. A positive result identifies certificates that are statistically
    unmanaged and warrant review even if no single rule fired.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      X = features[remaining_validity,age,key_size,sig_alg,issuer_rarity,renewal_interval,owner,criticality]

      model = IsolationForest().fit(managed_population)

      score = model.decision_function(X); if anomaly -> alert + shap_top3(X)
- question: Which certificates produce high autoencoder reconstruction error against the compliant managed-certificate
    population, and which features drive that error?
  context: >-
    Tactic Harden: an autoencoder trained only on the compliant population learns 'normal' and flags off-population
    certificates by reconstruction error, complementing the Isolation Forest baseline. Train on the managed-certificate
    feature set and alert when reconstruction error exceeds threshold, reporting the features with the
    largest per-feature residuals so analysts see why a certificate was flagged. A positive result indicates
    a certificate that does not resemble the sanctioned fleet and needs reconciliation.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      ae = Autoencoder().fit(compliant_population_features)

      err = reconstruction_error(ae, cert_features)

      if err > threshold -> alert + top_residual_features(ae, cert)
- question: Which certificates does a supervised model predict are likely to miss rotation deadlines based
    on issuer, owner team, service criticality, prior renewal delay, and ACME failure history, and what
    drives each prediction?
  context: >-
    Tactic Harden: predicting failure before it happens lets the team pre-emptively assign remediation.
    Train a supervised model on historical rotation outcomes and certificate metadata (issuer, owner team,
    service criticality, prior renewal delay, ACME failure history) to predict deadline-miss likelihood,
    and use SHAP attributions to surface the top-3 drivers of each prediction in the alert. A positive
    result is a ranked list of at-risk certificates enabling proactive rather than reactive rotation management.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Windows Schannel Event ID 36887
  - 'NAI: Public-facing web servers, Internal application servers, Domain Controllers (for LDAPS), Network
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      clf = GradientBoosting().fit(history[features], label=missed_deadline)

      p = clf.predict_proba(cert_features)

      if p > risk_threshold -> alert hotspot + shap_top3(cert)
- question: Are there certificates present in Certificate Transparency logs for our owned domains/SANs
    that are absent from the internal inventory, or issued by a CA not on the approved-issuer allowlist?
  context: >-
    Tactic Harden: CT logs (RFC 6962) provide an external, append-only view of every certificate issued
    for your domains. Continuously pull CT entries for owned domains/SANs and alert on any certificate
    missing from the internal inventory or issued by an unapproved CA (per Scheitle et al.). A positive
    result reveals unmanaged, mis-issued, or rogue certificates - including those an external actor might
    use to impersonate your services - shortly after issuance, enabling rapid revocation and investigation.
  answer_sources:
  - Certificate Transparency logs (crt.sh / Censys feeds)
  - Internal certificate inventory
  - Zeek x509.log
  - 'NAI: All organization-owned domains and subdomains, Public-facing web servers, CDN/cloud-hosted endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      for entry in CT_feed(owned_domains):
        if entry.fingerprint not in internal_inventory -> alert orphaned_issuance
        if entry.issuer not in approved_issuer_allowlist -> alert unapproved_ca
- question: What is the weekly count of unreconciled CT certificates per domain, and is the rate or backlog
    of unreconciled certificates exceeding baseline?
  context: >-
    Tactic Harden: a persistent reconciliation gap is itself a distinct failure-mode signal that issuance
    or rotation is happening outside sanctioned tooling. Count unreconciled CT certificates per domain
    per week and alert when the rate or backlog exceeds baseline (per Scheitle et al.). A positive result
    means shadow issuance is recurring and the inventory/reconciliation process is not keeping pace, warranting
    process remediation rather than only per-certificate cleanup.
  answer_sources:
  - Certificate Transparency logs (crt.sh / Censys feeds)
  - Internal certificate inventory
  - Zeek x509.log
  - 'NAI: All organization-owned domains and subdomains, Public-facing web servers, CDN/cloud-hosted endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      weekly gap[domain] = count(CT certs not in inventory)

      alert where gap[domain] > baseline or backlog_trend rising
- question: For every certificate within its renewal window, is there an observed successful ACME order/issuance
    event, and have any ACME authorizations failed (failed HTTP-01/DNS-01/TLS-ALPN-01 challenges)?
  context: >-
    Tactic Harden: a near-expiry certificate with no successful renewal event is a deterministic broken-automation
    indicator, not a routine near-expiry alert. For each certificate in its renewal window require a successful
    ACME (RFC 8555) order/issuance, and alert when none is present or when an authorization fails (failed
    HTTP-01/DNS-01/TLS-ALPN-01 challenge). A positive result pinpoints exactly where automated rotation
    is silently broken so it can be fixed before an outage.
  answer_sources:
  - ACME client logs (Certbot/acme.sh/lego)
  - Certificate-manager / CA issuance logs
  - 'NAI: Hosts and load balancers enrolled in automated certificate management, Internal CA / ACME endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      for cert in renewal_window:
        events = acme_logs(cert.account, cert.identifier)
        if no successful order/issuance -> alert missing_renewal
        if any challenge_status==invalid -> alert failed_authorization type=challenge
- question: Are failed-authorization counts and rate-limit rejections per ACME host or account trending
    above baseline over time?
  context: >-
    Tactic Harden: failed renewals are a distinct State signal of rotation reliability. Track failed-authorization
    counts and rate-limit rejections per host/account over time using the order/authorization/error outcomes
    defined by ACME (RFC 8555), and alert on rates above baseline. A positive result indicates systemic
    automation problems (misconfiguration, DNS issues, or hitting CA rate limits) that will eventually
    cause certificates to lapse if left unaddressed.
  answer_sources:
  - ACME client logs (Certbot/acme.sh/lego)
  - Certificate-manager / CA issuance logs
  - 'NAI: Hosts and load balancers enrolled in automated certificate management, Internal CA / ACME endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      stats by host, acme_account over time:
        fail_rate = count(status==invalid), ratelimit = count(error==rateLimited)
      alert where fail_rate>baseline or ratelimit>baseline
