name: 'D3-UBA: User Behavior Analysis'
id: 92041209-b3b1-4ce5-a386-b050ef671bd0
description: 'This playbook helps an analyst investigate whether a user account should be locked to evict
  a suspected adversary, in support of the information requirement: under what conditions should an account
  be locked to effectively evict a suspected adversary? It applies User Behavior Analysis (D3-UBA) to
  two evidentiary patterns. First, it examines accounts that exhibit a combination of anomalous authentication
  and host behaviors that, aggregated, exceed a per-user risk threshold and indicate probable compromise:
  watchlisted source logins, impossible travel, explicit-credential fan-out, concurrent sessions, multi-factor
  behavioral anomalies, robust per-metric outliers, authentication time-series change-points, rare authentication
  graph edges, and combined one-class behavioral risk scoring. Second, it examines accounts or sources
  that generate an abnormal volume or rate of authentication failures (password spraying, brute force,
  or credential stuffing), optionally followed by a success, that justify a temporary lock and forced
  credential reset. Each question maps a concrete detection method to the data sources and named areas
  of interest where the analyst should hunt, so the lock-or-not decision is defensible and grounded in
  evidence.'
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
