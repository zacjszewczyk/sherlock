name: 'D3-PCA: Passive Certificate Analysis'
id: bd3c64fa-14f0-4e44-bd2c-1d7ad6891e59
description: Investigate SSL/TLS certificates collected passively from network traffic at the egress and
  from Certificate Transparency (CT) log streams to detect adversary-controlled, phishing, and impersonation
  infrastructure. This playbook helps an analyst hunt certificates that match threat-intel thumbprints/issuers/serials,
  carry structural fingerprints (JA4X) of known C2 tooling, violate cryptographic policy (weak keys, deprecated
  signature algorithms, abnormal validity windows), exhibit elevated validation-failure rates, show high-entropy
  subjects, or change issuer/chain abruptly for previously stable destinations. It layers deterministic
  threat-intel and policy rules, statistical baselining of certificate attribute distributions and failure
  rates, connection-physics correlation against Zeek conn.log, and explainable ML scoring. It also monitors
  public CT logs for organization- and partner-brand lookalikes, typosquats, homoglyph/IDN impersonation,
  and algorithmically generated phishing hostnames—often free-CA Domain-Validated certs—so that malicious
  certificates can be caught at issuance, frequently before the malicious site is served to users.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any certificates observed in our network traffic match known-bad indicators from threat
    intelligence—exact or approved-fuzzy matches on certificate thumbprints, issuer names, serial numbers,
    or subject patterns—or cluster with known C2 tooling such as default/self-signed Cobalt Strike beacon
    certificate fields or shared JA4X structural fingerprints even when serial/subject values are randomized?
  context: Under the Detect tactic, the fastest, highest-confidence way to surface adversary infrastructure
    is to compare each newly observed certificate against curated threat-intel. Match Zeek x509.log fields
    against known thumbprints, issuer DNs, serials, and subject patterns, and include default/self-signed
    C2 beacon certificate fields (issuer/subject organization, serial, thumbprint) from the Cobalt Strike
    YARA signature base. Because attackers randomize serial and subject values, also cluster certificates
    by JA4X fingerprint, which hashes the ordered issuer/subject RDNs and extensions so tool-generated
    certificates match by structure. A hit on a curated indicator or a known tooling JA4X cluster is a
    strong, deterministic signal of C2 or malicious infrastructure and should be escalated immediately;
    a clean result lowers but does not eliminate suspicion, so keep the statistical and ML layers running.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Our organization''s internet gateway and key internal network choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "x509.log\n| compute ja4x = hash(ordered_issuer_RDNs + ordered_subject_RDNs + extensions)\n\
      | WHERE fingerprint IN ti_thumbprints\n   OR issuer IN ti_issuers OR serial IN ti_serials\n   OR\
      \ fuzzy_match(subject, ti_subject_patterns)\n   OR (issuer_org, serial, fingerprint) IN cobaltstrike_default_certs\n\
      \   OR ja4x IN known_tooling_ja4x_clusters\n| ALERT severity='critical', reason='known-bad certificate\
      \ match'"
- question: Are any certificates for external destinations violating cryptographic policy—using prohibited
    key sizes (RSA <2048), deprecated signature algorithms (MD5/SHA-1), self-signed chains where a trusted
    public CA is required, free-CA Domain-Validated certs presenting protected-brand keywords, or abnormal
    validity windows (under ~30 days or over ~398 days)?
  context: 'This question codifies deterministic, portable policy rules over Zeek x509.log to flag certificates
    that no legitimately administered external service should present. Weak keys and deprecated signature
    algorithms indicate old, cheap, or attacker-generated certs; self-signed chains to external destinations
    that should use trusted public CAs indicate interception or C2; free-CA Domain-Validated certs carrying
    a protected-brand keyword indicate phishing; and abnormal validity windows separate phishing/C2 certs
    from legitimate ones. Thresholds (validity <30 or >398 days, DV-for-brand, RSA<2048, MD5/SHA-1) are
    grounded in measured phishing-vs-benign attribute differences. These are hard rules under the Detect
    tactic: a positive result is a defensible policy violation worth investigation; tune the brand keyword
    and allowlist only, never remove the cryptographic floors.'
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Our organization''s internet gateway and key internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM x509.log\nWHERE (key_type='rsa' AND key_length<2048)\n   OR sig_alg IN ('md5WithRSA','sha1WithRSA')\n\
      \   OR (is_self_signed AND dest_requires_public_ca)\n   OR (is_free_ca AND validation_type='DV'\
      \ AND subject CONTAINS_ANY protected_brand_keywords)\n   OR validity_days < 30 OR validity_days\
      \ > 398\n| ALERT severity='high', reason='certificate cryptographic/policy violation'"
- question: Is the rate of certificate-validation failures—self-signed, expired, name-mismatch, untrusted-chain,
    or revoked validation_status values—abnormally elevated for any destination or /24 relative to its
    rolling baseline?
  context: Certificate validation failures are a distinct, high-value signal because self-signed, expired,
    and otherwise invalid certificates concentrate on phishing and C2 infrastructure. Rather than alerting
    on every failure, track per-destination and per-/24 proportions and counts/minute of each failure
    type in Zeek x509.log/ssl.log and alert when the failure proportion or rate exceeds a rolling baseline
    (derive thresholds per environment from a 30-day baseline and alert above roughly the p99 of historical
    failure rate). Under the Detect tactic this surfaces destinations whose TLS hygiene suddenly degrades—often
    new attacker infrastructure or a compromised endpoint reaching out. A spike against baseline warrants
    investigation of the destination's certificates and the connecting hosts; a stable, low rate is normal.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Our organization''s internet gateway and key internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM x509.log JOIN ssl.log

      | WHERE validation_status IN (''self-signed'',''expired'',''name-mismatch'',''untrusted-chain'',''revoked'')

      | STATS fail_rate=count()/window, fail_prop=count()/total_conns BY dest, dest_slash24, bin(time,5m)

      | JOIN baseline_p99 ON dest

      | WHERE fail_rate > baseline_p99 OR fail_prop > baseline_fail_prop_p99

      | ALERT reason=''certificate validation-failure spike'''
- question: Do any newly observed certificates fall outside the established normal ranges for subject/SAN
    string entropy, validity period, key length, SAN count, or issuer prevalence—for example a subject-entropy
    z-score over 3 or an issuer seen on under 0.1% of prior certificates?
  context: This statistical baseline catches anomalous certificates that no static rule anticipates. Compute
    rolling distributions of subject/SAN string entropy, validity period, key length, SAN count, and issuer
    prevalence broken down by destination class, then alert when a new certificate falls beyond percentile-based
    normal ranges (e.g., subject entropy z-score >3, or an issuer appearing on <0.1% of prior certs).
    High subject/SAN entropy points to algorithmically generated hostnames, rare issuers point to unusual
    or attacker-chosen CAs, and outlier validity/SAN counts separate tool-generated certs from legitimate
    ones; entropy and character-distribution features are validated for hostname anomaly scoring. Under
    the Detect tactic a strong outlier flags a certificate for analyst review and correlation; values
    within baseline are expected for normal services.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Our organization''s internet gateway and key internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM x509.log\n| compute subj_entropy, san_count, validity_days, key_length, issuer_prevalence\n\
      | JOIN dist_baseline BY dest_class\n| WHERE zscore(subj_entropy) > 3\n   OR issuer_prevalence <\
      \ 0.001\n   OR validity_days outside p1..p99\n   OR san_count outside p1..p99\n| ALERT reason='certificate\
      \ attribute outlier'"
- question: For any external destination, has the certificate issuer, chain depth, JA4X cluster, or certificate
    turnover rate (changes per day) shifted significantly compared to that destination's prior baseline?
  context: 'Legitimate services keep a stable issuer, chain depth, and certificate fingerprint over time.
    Tracking the historical certificate fingerprints, issuers, and chain depth per destination and raising
    an anomaly when the issuer, chain depth, JA4X cluster, or turnover rate (changes/day) changes abruptly
    surfaces rare-issuer/rare-destination signals characteristic of interception, infrastructure rotation,
    or hijack. Under the Detect tactic, an abrupt issuer change for a previously stable destination, a
    sudden JA4X cluster change, or rapid certificate churn is a meaningful pivot point: investigate whether
    the destination was re-keyed legitimately (CA migration, renewal) or whether the change reflects adversary
    activity. No change against a long stable baseline is normal.'
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Our organization''s internet gateway and key internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM x509.log JOIN ssl.log\n| STATS issuers=set(issuer), chain_depths=set(chain_depth), ja4x=set(ja4x),\
      \ turnover=distinct_count(fingerprint)/days BY dest\n| JOIN dest_baseline ON dest\n| WHERE issuer\
      \ NOT IN baseline.issuers OR chain_depth != baseline.chain_depth\n   OR ja4x NOT IN baseline.ja4x\
      \ OR turnover > baseline.turnover * 3\n| ALERT reason='abrupt certificate change for stable destination'"
- question: When a suspicious or rare certificate appears, does the associated connection in Zeek conn.log
    show beaconing physics—low coefficient-of-variation inter-arrival timing, anomalous out/in byte ratios,
    or abnormal connection state—indicating command-and-control rather than benign browsing?
  context: A flagged certificate is far more actionable when joined to its connection physics. Join suspicious
    or rare certificates to Zeek conn.log and profile Volume (total bytes in/out and the out/in byte ratio),
    Frequency (connection count per minute and inter-arrival regularity / coefficient of variation), and
    State (connection success/failure). Alert when a suspicious or rare certificate co-occurs with low-CoV
    beaconing or anomalous byte ratios. Under the Detect tactic this distinguishes automated C2 channels—which
    beacon at regular intervals with small, asymmetric payloads—from human-driven traffic. A suspicious
    cert riding a low-jitter, asymmetric session is a strong C2 indicator; the same cert on bursty, human-paced
    browsing is more likely benign and can be deprioritized.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Our organization''s internet gateway and key internal network choke points.'
  range: 'Last 90 days (event-centered: pivot ±24h around each flagged certificate)'
  queries:
  - technology: Zeek/pseudocode
    query: 'flagged_certs = x509.log WHERE suspicious OR rare

      JOIN conn.log ON cert.dest

      | STATS bytes_in, bytes_out, ratio=orig_bytes/resp_bytes, conn_per_min, iat_cov=stddev(iat)/mean(iat),
      conn_state BY dest, cert.fingerprint

      | WHERE iat_cov < 0.1 OR ratio outside normal_band

      | ALERT reason=''suspicious certificate co-occurs with beaconing/anomalous flow'''
- question: What is the supervised-ML maliciousness risk score for each observed certificate, and which
    top-3 features (issuer rarity, validity z-score, subject entropy, edit-distance to brand, JA4X cluster)
    drove a high score?
  context: This question applies a supervised model trained on labeled benign/malware/phishing certificate
    features from Zeek x509.log plus conn.log context to produce a risk score, catching combinations of
    weak signals that individual rules miss. Passive certificate metadata—subject/issuer character-level
    patterns, validity, key usage, SAN counts—yields high-accuracy maliciousness scoring (published work
    reaches >95% precision). To keep the alert defensible for a SOC analyst, surface the top-3 contributing
    features per prediction using Shapley attributions (e.g., issuer rarity, validity z-score, subject
    entropy, edit-distance to brand, JA4X cluster), and keep the deterministic threat-intel and policy
    rules running in parallel as a floor of determinism. Under the Detect tactic, a high score with coherent
    explanatory features is a strong lead; the explanation lets the analyst confirm or dismiss the result
    quickly rather than trusting an opaque score.
  answer_sources:
  - Zeek x509.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Our organization''s internet gateway and key internal network choke points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = extract(x509.log + conn.log context)

      score = supervised_model.predict_proba(features)

      top3 = shap_top_features(model, features, k=3)

      WHERE score > threshold

      | ALERT risk=score, top_features=top3, reason=''ML certificate maliciousness''

      # deterministic TI + policy rules run in parallel as a floor'
- question: Are any newly issued certificates appearing in the Certificate Transparency firehose whose
    subject or SAN values match our protected brand and partner domains by brand-keyword rules or by Levenshtein/Damerau
    edit-distance within 1–2 edits (typosquats)?
  context: CT logs publish nearly every issued certificate, often before the malicious site is served,
    making them an early-warning source for impersonation. Subscribe to the CT firehose (RFC 6962 precertificate/log
    entries) and deterministically match each newly issued certificate's subject/SAN against an inventory
    of protected brand and partner domains using brand-keyword rules and edit-distance within 1–2 edits,
    applying known typosquatting generation models. Under the Detect tactic this catches phishing and
    impersonation infrastructure at issuance time. A match against a protected brand or a close typosquat
    is a high-priority lead—pivot to the issuer, hosting, and any internal traffic to the domain, and
    consider takedown/blocklisting. Maintain the brand/partner inventory carefully to balance precision
    and recall.
  answer_sources:
  - Certificate Transparency logs (Certstream/crt.sh)
  - Internal protected-brand and partner-domain inventory
  - Zeek x509.log
  - 'NAI: Public Certificate Transparency log streams monitored for our organization''s brands, partner
    domains, and their lookalikes.'
  range: Last 90 days (near-real-time CT stream monitor)
  queries:
  - technology: CT-stream/pseudocode
    query: "ON ct_stream new_cert:\n  for name in new_cert.subject + new_cert.SAN:\n    if contains_brand_keyword(name,\
      \ protected_brands)\n       or min_edit_distance(name, brand_partner_domains) <= 2:\n       ALERT\
      \ brand=matched_brand, name=name, issuer=new_cert.issuer,\n             reason='protected-brand\
      \ lookalike certificate issued'"
- question: Do any certificate Common Names or SANs in CT logs visually impersonate our protected brands
    through homoglyph or Unicode/IDN substitution (e.g., Cyrillic look-alikes, paypa1.com) that character
    edit-distance would miss?
  context: Attackers defeat lexical edit-distance checks by using characters that look identical but differ
    in code point (IDN homoglyphs) or visually similar ASCII (1 for l, 0 for o). Render certificate Common
    Names/SANs to images and score visual similarity to protected brands with a Siamese convolutional
    network, emitting the matched brand and a visual-distance score. Under the Detect tactic this catches
    high-deception impersonation domains that pure-text matching cannot, which are among the most effective
    phishing lures. A high visual-similarity score to a protected brand is a strong indicator of a deliberate
    impersonation campaign; surface the matched brand and score so an analyst can confirm and escalate
    to blocking/takedown. Legitimate brand variations should be allowlisted to reduce noise.
  answer_sources:
  - Certificate Transparency logs (Certstream/crt.sh)
  - Internal protected-brand and partner-domain inventory
  - Zeek x509.log
  - 'NAI: Public Certificate Transparency log streams monitored for our organization''s brands, partner
    domains, and their lookalikes.'
  range: Last 90 days (near-real-time CT stream monitor)
  queries:
  - technology: ML/pseudocode
    query: "ON ct_stream new_cert:\n  for name in new_cert.subject + new_cert.SAN:\n    img = render_to_image(name)\n\
      \    brand, vdist = siamese_cnn.nearest(img, protected_brand_images)\n    if vdist < visual_threshold:\n\
      \       ALERT brand=brand, name=name, visual_distance=vdist,\n             reason='homoglyph/IDN\
      \ visual impersonation'"
- question: Do certificate Common Names observed in CT logs cluster into recurring phishing templates—regular
    patterns of brand-keyword subdomains issued on free CAs—that reveal previously unknown phishing certificates
    and shared issuance/hosting infrastructure?
  context: Phishing operations issue certificates at scale using templated naming (e.g., brand-keyword
    subdomains on free CAs), so clustering Common Names observed in CT logs into templates discovers previously
    unknown phishing certificates at low false-positive rates and exposes shared issuance/hosting infrastructure.
    Run this as a near-real-time monitor over the CT stream. Under the Detect tactic, a new certificate
    matching an established phishing template, or a newly emerging cluster of similar brand-themed names,
    indicates an active or staging campaign. The shared-infrastructure view lets an analyst pivot from
    one phishing cert to the whole cluster (issuer, IP, registrar) for bulk blocking and takedown rather
    than chasing certificates one at a time.
  answer_sources:
  - Certificate Transparency logs (Certstream/crt.sh)
  - Internal protected-brand and partner-domain inventory
  - Zeek x509.log
  - 'NAI: Public Certificate Transparency log streams monitored for our organization''s brands, partner
    domains, and their lookalikes.'
  range: Last 90 days (near-real-time CT stream monitor)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM ct_stream certificates\n| tokenize common_name into (brand_keyword, subdomain_pattern,\
      \ tld, ca)\n| CLUSTER by name_template + issuing_ca\n| WHERE cluster matches free_ca_brand_template\n\
      \   OR cluster is newly_emerging\n| ALERT cluster_id, members, shared_infra, reason='phishing certificate\
      \ template cluster'"
- question: What lexical phishing score does each CT-logged certificate domain receive based on Shannon
    entropy, n-gram improbability, suspicious-TLD flags, deceptive-subdomain depth, free-CA Domain-Validated
    flag, and Levenshtein distance to protected brands, and which exceed the tuned alerting threshold?
  context: This statistical scorer computes per-domain lexical features—Shannon entropy, n-gram improbability,
    suspicious-TLD flags, deceptive-subdomain depth, free-CA Domain-Validated flag, and edit-distance
    to protected brands—and alerts above a threshold tuned to balance precision and recall. These features
    are validated for hostname anomaly scoring and underpin operational CT-stream phishing detectors.
    Under the Detect tactic this catches algorithmically generated and deceptive hostnames that brand-keyword
    rules alone miss, while remaining transparent and tunable. A domain scoring above threshold—especially
    with high entropy plus a free-CA DV cert and small edit-distance to a brand—is a strong phishing lead;
    tune the threshold against your own benign baseline to control noise.
  answer_sources:
  - Certificate Transparency logs (Certstream/crt.sh)
  - Internal protected-brand and partner-domain inventory
  - Zeek x509.log
  - 'NAI: Public Certificate Transparency log streams monitored for our organization''s brands, partner
    domains, and their lookalikes.'
  range: Last 90 days (near-real-time CT stream monitor)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM ct_stream certificates\n| compute entropy, ngram_improbability, suspicious_tld, subdomain_depth,\n\
      \          free_ca_dv_flag, min_edit_distance(name, protected_brands)\n| score = weighted_sum(features)\n\
      | WHERE score > tuned_threshold\n| ALERT name, score, reason='lexical phishing certificate'"
- question: What supervised-ML phishing classification does each newly logged CT certificate receive over
    its lexical and structural features, and which top-3 features (brand keyword, edit-distance, entropy,
    free-CA flag) explain a positive classification?
  context: This question scores each newly logged certificate with a supervised tree-ensemble or deep
    model over lexical and structural certificate features to flag phishing certs at issuance, following
    published CT-log phishing pipelines with released code and datasets. To keep alerts defensible, surface
    the top-3 contributing features (brand keyword, edit-distance, entropy, free-CA flag) via Shapley
    attributions, and keep the deterministic brand/edit-distance rules running in parallel. Under the
    Detect tactic this catches phishing certificates that combine several weak lexical/structural signals
    no single rule would trip, while the explanation lets an analyst validate the call. A high phishing
    probability with coherent contributing features is a strong, early lead for blocking and takedown;
    a low score with the deterministic rules also clear lowers priority.
  answer_sources:
  - Certificate Transparency logs (Certstream/crt.sh)
  - Internal protected-brand and partner-domain inventory
  - Zeek x509.log
  - 'NAI: Public Certificate Transparency log streams monitored for our organization''s brands, partner
    domains, and their lookalikes.'
  range: Last 90 days (near-real-time CT stream monitor)
  queries:
  - technology: ML/pseudocode
    query: "ON ct_stream new_cert:\n  features = lexical_and_structural(new_cert)\n  p = phishing_model.predict_proba(features)\n\
      \  top3 = shap_top_features(phishing_model, features, k=3)\n  if p > threshold:\n     ALERT prob=p,\
      \ top_features=top3, reason='ML CT phishing certificate'\n  # deterministic brand/edit-distance\
      \ rules run in parallel"
