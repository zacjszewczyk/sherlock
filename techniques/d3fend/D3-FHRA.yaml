name: 'D3-FHRA: File Hash Reputation Analysis'
id: 15f7990d-ad44-44a9-987f-adf7da4bacc7
description: 'This playbook helps an analyst measure and improve how effectively file hash reputation
  analysis detects malicious files across the enterprise, and to surface coverage gaps. It builds an executable/file
  inventory annotated with malicious, suspicious, benign, and unknown reputation states enriched with
  prevalence, content-similarity, and behavioral context so analysts can prioritize risky unknowns. Detection
  is layered: deterministic cryptographic-hash and content-derived/fuzzy-hash matching against curated
  deny-lists; statistical prevalence/rarity, concentration, and reputation-dynamics scoring; and explainable
  machine learning on static features over first-party endpoint and network telemetry (Sysmon, Zeek, EDR).
  Lookup failures and label transitions are treated as first-class signals rather than silently assumed
  benign, because anti-malware engine verdicts are highly dynamic and attacker-built binaries are disproportionately
  rare or unknown.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: For every SHA256/SHA1/MD5 file hash observed in Zeek files.log and Windows Sysmon Event IDs
    1, 6, and 7, what does internal and external reputation lookup return, and which hashes are confidently
    labeled malicious by multiple independent sources?
  context: 'This question drives the core detection layer of file hash reputation analysis. For each observed
    hash, query both first-party (internal) reputation feeds and external multi-engine services. A single-engine
    ''malicious'' verdict is unreliable and labels flip over time, so require a corroboration threshold
    before raising a high-severity alert: at least three distinct engines agreeing, or any single high-trust
    internal feed. Capture confidence score, engine count, source feed, and first-seen timestamps in the
    alert so the analyst can judge label maturity and stability. A positive result (corroborated malicious
    verdict) is a high-confidence detection in the Detect tactic; a negative or single-engine result should
    not be treated as clean but instead routed to the prevalence and ML layers.'
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from sysmon(event_id in [1,6,7]) or zeek_files

      extract hash in {sha256, sha1, md5, imphash}

      enrich with reputation_lookup(hash) -> {verdict, engine_count, feeds, first_seen, confidence}

      where verdict == ''malicious'' and (engine_count >= 3 or any(feed in high_trust_internal_feeds))

      alert severity=high fields={hash, engine_count, feeds, first_seen, confidence, host, process}'
- question: Do any observed file or driver hashes match a curated first-party deny-list of known-malicious
    binaries, vulnerable/blocked drivers (BYOVD), or signer metadata, as seen in Sysmon Event IDs 6/7
    and Windows Security Event IDs 4697/7045?
  context: Deny-list matching is deterministic and works even when external reputation APIs are unavailable,
    making it resilient and fast. Maintain first-party hash deny-lists from curated feeds (e.g., LOLDrivers
    BYOVD hashes and signer metadata, the Microsoft Recommended Driver Block Rules WDAC/HVCI deny-list,
    and the SigmaHQ vulnerable-driver load rule containing thousands of MD5/SHA1/SHA256/IMPHASH values).
    Match these against Sysmon Event ID 6 (DriverLoad) and Event ID 7 (ImageLoad) hashes plus Windows
    Security Event IDs 4697/7045 (service/driver install). Any match is a deterministic high-severity
    hit independent of external API availability, and is especially important for catching bring-your-own-vulnerable-driver
    attacks that enable privilege escalation and defense evasion. A negative result still leaves novel/unknown
    binaries for the downstream statistical and ML layers.
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from sysmon(event_id in [6,7]) union win_security(event_id in [4697,7045])\nextract {hash_set,\
      \ signer, image_path}\nwhere hash_set intersects denylist(loldrivers, ms_driver_block, sigma_vuln_drivers)\n\
      \   or signer in denylist_signers\nalert severity=high fields={matched_hash, signer, image_path,\
      \ host, source_event}"
- question: After computing content-derived identifiers (IMPHASH) and fuzzy hashes (ssdeep, TLSH) for
    observed files, do any fall within a similarity threshold of known-malicious samples even though their
    cryptographic hashes do not match?
  context: 'Cryptographic hashes break on any single byte change, so attackers easily evade exact-match
    detection by repacking or recompiling malware. To catch these variants, compute IMPHASH (the MD5 of
    the ordered PE import table) and alert on matches to known-malicious IMPHASH clusters, and compute
    fuzzy/locality-sensitive hashes and flag files within a similarity threshold of any known-bad sample:
    ssdeep score >= 70, or TLSH distance <= 30. These thresholds must be tuned against your benign corpus
    to bound false positives, since legitimate software families can share imports or structure. A positive
    result indicates a likely repacked or related malicious variant warranting investigation; this layer
    extends detection coverage beyond exact-hash deny lists in the Detect tactic.'
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from sysmon(event_id in [1,7])

      compute {imphash, ssdeep_digest, tlsh_digest} per file

      alert if imphash in known_bad_imphash_clusters

      alert if max(ssdeep_score(ssdeep_digest, known_bad_ssdeep)) >= 70

      alert if min(tlsh_distance(tlsh_digest, known_bad_tlsh)) <= 30

      fields={hash, imphash, best_match_sample, similarity_metric, host}'
- question: Which hashes already present in our environment have transitioned in reputation state (unknown/benign/suspicious
    -> malicious, or malicious -> benign retraction), and where were they previously observed?
  context: 'Anti-malware engine labels are highly dynamic: a hash benign today may be labeled malicious
    tomorrow once analysts catch up to a new threat. This question monitors reputation state transitions
    for hashes already seen in the environment. On an unknown->malicious transition, immediately re-open
    historical Sysmon and Zeek sightings and identify all affected hosts so prior compromise can be scoped
    retroactively. Record the prior label, new label, engine-count delta, and the time-since-first-seen
    in the alert. Malicious->benign retractions matter too, as they can reduce false-positive load or
    reveal contested verdicts. This is a key Detect-tactic mechanism for catching threats that slipped
    past initial lookups because they were not yet known-bad.'
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from reputation_history(hash)\ndetect transition where prior_label in [unknown,benign,suspicious]\
      \ and new_label == malicious\n   or prior_label == malicious and new_label == benign\njoin historical_sightings(sysmon,\
      \ zeek) on hash\nalert fields={hash, prior_label, new_label, engine_count_delta, first_seen, time_since_first_seen,\
      \ affected_hosts}"
- question: Which suspicious or unknown hashes are extremely rare across the enterprise (bottom 1st percentile
    of 30-day prevalence), and are any of them exhibiting volume or frequency anomalies?
  context: 'Rarity is a strong prior for malice: roughly 99.7% of real threats are rare in user populations,
    while legitimate software tends to be widespread. Compute 30-day enterprise prevalence per hash from
    first-party Sysmon/Zeek inventories and flag hashes in the bottom 1st percentile that remain suspicious
    or unknown. Derive percentile thresholds per host group so a rare hash on a tightly-managed server
    stands out more than on a varied workstation fleet, and suppress high-prevalence (common, likely-benign)
    hashes. Increase priority for volume/frequency anomalies such as a rare hash spawning more than five
    child processes per minute or driving abnormal outbound byte volume in Zeek conn.log. A positive result
    yields a prioritized queue of risky unknowns for the Detect tactic without depending on any external
    verdict.'
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from sysmon(event_id 1) union zeek_files | last 30d

      stats dcount(host) as prevalence by hash, host_group

      compute percentile(prevalence) within host_group

      where reputation in [suspicious, unknown] and percentile <= 1

      enrich child_proc_rate, zeek_outbound_bytes

      boost if child_proc_rate > 5/min or outbound_bytes > baseline

      alert fields={hash, prevalence, host_group, anomaly_flags}'
- question: Are suspicious or unknown hashes abnormally concentrated on particular hosts, user roles,
    or ingress sources relative to historical baselines, suggesting localized compromise?
  context: Beyond individual rare hashes, the distribution of risky hashes across the fleet is informative.
    Profile the count and rate of suspicious/unknown hashes by host group, user role, and ingress source,
    then escalate concentrations above historical baselines, for example a cluster density above the 95th
    percentile or a host's unknown-hash rate exceeding mean + 3*sigma. Such concentrations can indicate
    a localized compromise, a staging host, or an ingress point being abused to introduce attacker tooling.
    Report the contributing hosts and hashes and the baseline used so the analyst can validate the anomaly.
    This statistical view complements per-hash detection by revealing patterns that single-hash analysis
    misses in the Detect tactic.
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from file_inventory

      stats count(hash where reputation in [suspicious,unknown]) as risky, count(hash) as total by host,
      user_role, ingress_source

      compute rate = risky/total; baseline = mean+3*sigma per group historically

      where rate > baseline or cluster_density > p95

      alert fields={host, user_role, ingress_source, risky, rate, baseline, top_hashes}'
- question: What are the per-feed rates of failed or 'not found' reputation lookups, timeouts, and rate-limit
    errors, and is any host or ingress point experiencing an abnormal spike in unknown/failed lookups?
  context: Lookup failures are a distinct and meaningful signal, not noise to be ignored. Track per-feed
    rates of 'not found'/unknown verdicts, timeouts, and rate-limit errors, plus the share of hashes whose
    verdicts are still unstable in their early post-submission window. Alert when the unknown/failed-lookup
    rate for a host or ingress point spikes above baseline (e.g., more than twice the 7-day median), because
    attacker-built binaries are disproportionately unknown to reputation services. Critically, a failed
    or unknown lookup must never be silently treated as benign; doing so creates a coverage gap that adversaries
    exploit with bespoke tooling. This question directly measures the effectiveness and gaps of the reputation
    pipeline itself in the Detect tactic.
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from reputation_lookup_log

      stats count by feed, result(not_found|timeout|rate_limit|unstable), host, ingress_source

      compute unknown_failed_rate per host; baseline = 7d_median

      where unknown_failed_rate > 2 * baseline

      alert fields={host, ingress_source, feed, failure_breakdown, rate, baseline}'
- question: For hashes lacking reliable reputation, what maliciousness likelihood does an explainable
    static-feature classifier assign, and which top contributing features drive each score?
  context: 'When no reliable reputation exists, score maliciousness from static file features: PE header
    fields, imports/IMPHASH traits, section and byte-entropy histograms, string statistics, signer status,
    and parent-process lineage. Train a gradient-boosted tree model (LightGBM/XGBoost) using the EMBER
    and multi-format EMBER2024 feature schemas with temporal splits to resist concept drift. With every
    score, emit the top-3 contributing features via TreeSHAP so analysts can understand and trust the
    verdict, and use the ranked score to order reverse-engineering and detonation queues. This ML layer
    never overrides deterministic deny-list hits; it triages the long tail of unknowns the deterministic
    and prevalence layers cannot resolve, closing coverage gaps in the Detect tactic. A high score with
    suspicious explanatory features warrants escalation; a low score deprioritizes but does not clear
    the file.'
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for hash in unknown_hashes:\n  feats = extract_static_features(file)  # PE header, imports/imphash,\
      \ entropy, strings, signer, lineage\n  score = gbm_model.predict(feats)       # LightGBM/XGBoost\
      \ trained on EMBER/EMBER2024, temporal split\n  shap = treeshap_top_features(model, feats, k=3)\n\
      \  if score >= threshold: queue_for_RE(hash, score, shap)\n  emit fields={hash, score, top3_features,\
      \ signer, imphash}"
- question: Among unknown hashes, which ones are flagged as novel anomalies by one-class models trained
    on benign-only static features, exceeding the 99th-percentile anomaly threshold?
  context: Where labeled malware is scarce, supervised models struggle on truly novel samples. Train one-class
    novelty detectors (Isolation Forest, deep autoencoder) on benign-only static features and flag unknown
    hashes with high anomaly or reconstruction-error scores; this approach achieves high recall on novel
    samples. Threshold on the 99th-percentile anomaly score from a held-out benign set, and surface the
    most deviant features in the alert so analysts know why a file looks abnormal. Run this in parallel
    with, never replacing, the deterministic deny-list and prevalence layers. A positive result identifies
    files that deviate sharply from known-good software and merit deeper analysis, addressing the zero-day
    / novel-malware coverage gap central to the Detect tactic.
  answer_sources:
  - Windows Sysmon Event ID 1 (ProcessCreate Hashes/IMPHASH)
  - Windows Sysmon Event ID 6 (DriverLoad Hashes)
  - Windows Sysmon Event ID 7 (ImageLoad Hashes)
  - Zeek files.log (sha256/md5)
  - Zeek conn.log
  - Windows Security Event ID 4697/7045 (service/driver install)
  - EDR file prevalence/reputation (e.g., Defender FileProfile)
  - 'NAI: Endpoint devices, critical servers (e.g., domain controllers, web servers), and network egress
    points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "train oneclass(IsolationForest|autoencoder) on benign_only_static_features\nthreshold = p99(anomaly_score\
      \ on held_out_benign)\nfor hash in unknown_hashes:\n  a = anomaly_score(model, static_features(file))\n\
      \  if a >= threshold: alert fields={hash, anomaly_score, most_deviant_features}\n# run alongside\
      \ deterministic + prevalence layers"
