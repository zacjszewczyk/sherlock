name: 'D3-UAP: User Account Permissions'
id: 78cc1b68-a031-4202-90a7-c2cb83a868ca
description: Investigate whether user account permissions adhere to the principle of least privilege and
  properly isolate critical resources. This playbook helps an analyst identify accounts whose effective
  permissions exceed their documented role, detect privileged-group sprawl, separation-of-duties (toxic)
  combinations, tier-crossing logons, permission creep over time, and bursts of access-denied events that
  signal permission enumeration by a compromised or mis-provisioned account. It combines deterministic
  RBAC/SoD rules, statistical peer-group and outlier baselining, and machine-learning role mining, clustering,
  and sequence modeling to surface over-broad access across Active Directory/Entra ID, Windows endpoints
  and servers, and cloud (IAM) control planes.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which accounts are members of highly privileged groups (Domain Admins, Enterprise Admins,
    Schema Admins, Global Administrators), and is every member present on the curated, approved administrator
    list and re-attested within the current review cycle?
  context: Supports the Isolate tactic by enforcing static RBAC constraints on user-to-role assignment.
    Enumerate all members of highly privileged groups from Active Directory/Entra ID or audit logs and
    diff that list against an approved administrator allowlist. Any member not on the allowlist is a direct
    RBAC policy violation and a candidate for revocation. Re-run on a fixed cadence; any privileged assignment
    not re-attested within the access-review cycle should be treated as a finding. A positive result (unapproved
    or un-attested member) indicates privilege sprawl that undermines resource isolation; a clean result
    confirms the privileged tier matches the approved baseline. The RBAC reference model of constraining
    user-to-role assignment is described in [Role-Based Access Control Models, Sandhu et al](https://profsandhu.com/journals/computer/i94rbac(org).pdf),
    and the recertification/attestation control in [Microsoft Entra Access Reviews, Microsoft](https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview).
  answer_sources: &id001
  - Windows Event ID 4663
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4672
  - Active Directory / Entra ID role and group assignments
  - AWS CloudTrail
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity Providers (AD/Entra ID), Critical File Servers, Database Servers,
    Cloud control plane (IAM), Endpoint devices'
  range: Last 90 days
  queries:
  - technology: Directory/Rule pseudocode
    query: "members = enumerate_group_members([Domain Admins, Enterprise Admins, Schema Admins, Global\
      \ Administrators])\nfor m in members:\n  if m not in approved_admin_list OR last_attestation(m)\
      \ < (now - review_cycle):\n    alert('Unapproved/un-attested privileged group member', m)"
- question: Do any users hold or activate mutually exclusive role/permission pairs that violate Separation
    of Duties (e.g., 'Accounts Payable' + 'Vendor Management'), either statically assigned or active within
    the same session?
  context: Supports Isolate by enforcing NIST RBAC Static (SSD) and Dynamic (DSD) Separation of Duties
    constraints. Encode the set of conflicting role/permission pairs, then evaluate each user's assigned
    roles for SSD violations (must not be assigned both) and each session for DSD violations (conflicting
    roles must not be active together). Alert immediately on any held or activated conflicting pair. A
    positive result reveals a toxic combination that allows a single principal to execute and conceal
    fraudulent or unauthorized actions; a negative result confirms duties remain properly segregated.
    The SSD/DSD constraint formalism is defined in the NIST RBAC standard ([Proposed NIST Standard for
    Role-Based Access Control, Ferraiolo et al](https://profsandhu.com/journals/tissec/p224-ferraiolo.pdf)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Directory/Rule pseudocode
    query: "ssd_pairs = load_mutually_exclusive_pairs()\nfor user in all_users:\n  roles = assigned_roles(user)\n\
      \  for (a,b) in ssd_pairs:\n    if a in roles and b in roles: alert('SSD violation', user, a, b)\n\
      for session in active_sessions:\n  for (a,b) in ssd_pairs:\n    if a in active_roles(session) and\
      \ b in active_roles(session): alert('DSD violation', session.user, a, b)"
- question: Are there any tier-crossing logons or cross-tier privilege grants, such as a Tier 0 (control-plane)
    account interactively logging on to a management- or data-plane host, or a lower-tier account being
    granted control-plane privileges?
  context: Supports Isolate by applying the enterprise/tiered access model. Correlate Windows Event ID
    4624 (logon type and target host) and 4672 (special privileges assigned) against an asset-to-tier
    map. Tier 0 accounts must not interactively log on to lower-tier hosts, and lower-tier accounts must
    not receive control-plane privileges. Alert on any tier-crossing logon or cross-tier privilege grant.
    A positive result indicates an administrative isolation breakdown that exposes high-value credentials
    to lower-trust hosts where they can be harvested; a negative result confirms tier boundaries are intact.
    This applies the tiered administration model in [The Enterprise Access Model (Tiered Administration),
    Microsoft](https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-access-model).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for ev in events(EventID in [4624,4672]):\n  acct_tier = tier_of_account(ev.account)\n  host_tier\
      \ = tier_of_host(ev.target_host)\n  if ev.EventID == 4624 and ev.logon_type in [2,10] and acct_tier\
      \ == 0 and host_tier > 0:\n    alert('Tier-0 interactive logon to lower-tier host', ev)\n  if ev.EventID\
      \ == 4672 and acct_tier > 0 and grants_control_plane_priv(ev):\n    alert('Control-plane privilege\
      \ granted to lower-tier account', ev)"
- question: For each account, which granted permissions or group memberships were never exercised over
    the last 90 days (candidate over-privilege), and were there exercised-but-ungranted attempts (denials)
    indicating mis-provisioning?
  context: Supports Isolate through least-privilege gap analysis. For each account, diff granted permissions/groups
    against permissions actually exercised over a 90-day window using Windows Event ID 4663 object-access
    and AWS CloudTrail successful API calls. Grants never exercised are candidate over-privilege for removal;
    exercised-but-ungranted attempts surfacing as denials indicate mis-provisioning. Periodic recertification
    of unused access is the governing control. A positive result (unused grants or denied-but-needed access)
    drives right-sizing of permissions; a clean result confirms granted access matches actual need. Periodic
    recertification of unused access is the governing control ([Microsoft Entra Access Reviews, Microsoft](https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for acct in all_accounts:\n  granted = granted_permissions(acct)\n  exercised = distinct(object_perms\
      \ from EventID 4663 success + CloudTrail success where principal==acct, 90d)\n  unused = granted\
      \ - exercised\n  if unused: report('Candidate over-privilege', acct, unused)\n  denied = distinct(perms\
      \ from EventID 4663 failure + CloudTrail AccessDenied where principal==acct)\n  if denied - granted:\
      \ report('Mis-provisioning / ungranted attempts', acct, denied - granted)"
- question: Which users access more distinct servers, shares, or object types than the 95th percentile
    for their job role, or perform actions rare for themselves or their peer cohort when measured by volume,
    frequency, and success/fail state?
  context: Supports Isolate via statistical peer-group baselining. For each user, aggregate resource-access
    events (Windows Event ID 4663) and network connections (Zeek conn.log) over 30 days. For each role
    compute the 95th percentile of distinct servers, shares, and object types accessed, and flag users
    exceeding their role's percentile as over-broad access. Augment with peer-group baselining that flags
    actions rare for the user or the role cohort, and surface contributing factors. Include Volume (bytes
    read per share), Frequency (accesses/hour), and State (success/fail ratio), not access style alone.
    Derive thresholds per environment from 30-90 days of history. A positive result highlights accounts
    whose access footprint is anomalously broad for their role and warrants a permissions review. Peer-group
    baselining that surfaces actions rare for the user or role cohort is described in [Identify advanced
    threats with UEBA in Microsoft Sentinel, Microsoft](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    the Volume/Frequency/State metric framing draws on [Insight into Insiders and IT, Homoliak et al](https://arxiv.org/abs/1805.01612).
  answer_sources: *id001
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "agg = aggregate(EventID 4663, Zeek conn.log) by user over 30d:\n  distinct_servers, distinct_shares,\
      \ distinct_object_types, bytes_read, accesses_per_hour, fail_ratio\nfor role in roles:\n  p95 =\
      \ percentile(agg[users in role].distinct_servers + shares + object_types, 95)\nfor user in users:\n\
      \  if agg[user].metrics > p95[role_of(user)] or rare_for_peer_cohort(user):\n    alert('Over-broad\
      \ access vs role peers', user, contributing_metrics)"
- question: Which users show a sustained, monotonic increase in distinct security groups, roles, or effective
    permissions over the past six months without a corresponding HR or job-role change?
  context: Supports Isolate by detecting permission creep. Track the count of distinct security groups,
    roles, and effective permissions per user over time. Alert on a sustained monotonic increase over
    six months that is not matched by a documented job-role or HR change, which indicates failure to revoke
    legacy access as users change duties. Tie alerts to the recertification cycle so un-attested growth
    is actioned. A positive result identifies accounts accumulating standing privilege that erodes isolation;
    a negative result confirms permissions are being revoked appropriately as roles change. Tie alerts
    to the recertification cycle so un-attested growth is actioned ([Microsoft Entra Access Reviews, Microsoft](https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview)).
  answer_sources: *id001
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for user in users:\n  series = monthly_counts(distinct groups+roles+effective_perms for user,\
      \ 6 months)\n  if is_monotonic_increase(series) and not hr_role_change(user, 6 months):\n    alert('Permission\
      \ creep without role change', user, series)"
- question: Which principals generated bursts of access-denied events (Windows Event ID 4663 failure audits,
    Windows Event ID 4625 failed logons, cloud AccessDenied/UnauthorizedOperation responses), such as
    15 or more denials in 10 minutes above their baseline?
  context: Supports Isolate by profiling permission-failure bursts as a distinct signal. Count AccessDenied
    object-access failures (Windows Event ID 4663 failure audits), failed logons (Windows Event ID 4625),
    and cloud AccessDenied/UnauthorizedOperation responses per principal. Alert on bursts (for example,
    >=15 denials in 10 minutes, tuned per-principal baseline) that indicate permission enumeration by
    a compromised credential or a mis-provisioned account whose granted rights diverge from attempted
    actions. A positive result is a strong indicator of active discovery/enumeration or broken provisioning;
    a negative result indicates access attempts align with granted permissions. The cloud AccessDenied
    enumeration pattern is detailed in [AWS IAM AccessDenied Discovery Events, Splunk](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "denials = events(EventID 4663 failure OR EventID 4625 OR cloud AccessDenied/UnauthorizedOperation)\n\
      by principal in sliding_window(10m):\n  count = len(denials)\n  if count >= max(15, baseline(principal)*k):\n\
      \    alert('Permission-failure burst (enumeration / mis-provisioning)', principal, count)"
- question: When an RBAC role structure is inferred from the user-permission assignment matrix using probabilistic
    role mining, which permission assignments are not explained by any inferred role (low likelihood)
    and therefore likely represent over-privilege or permission creep?
  context: Supports Isolate using machine-learning role mining. Infer an RBAC role structure from the
    user-permission assignment matrix via probabilistic role mining (Boolean matrix factorization with
    model-order selection), then flag assignments that no inferred role explains as low-likelihood over-privilege
    or permission creep. Output the specific unexplained permissions in the alert for review. Run this
    in parallel to the deterministic RBAC/SoD rules, never as a replacement. A positive result surfaces
    grants that do not fit any natural role pattern, pinpointing likely excess permissions for cleanup.
    The probabilistic role-mining approach (Boolean matrix factorization with model-order selection) is
    from [Role Mining with Probabilistic Models, Frank, Buhmann, Basin](https://arxiv.org/abs/1212.4775).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "M = user_permission_matrix()\nroles = boolean_matrix_factorization(M, model_order_selection=True)\n\
      for (user, perm) where M[user,perm]==1:\n  if likelihood_explained(user, perm, roles) < threshold:\n\
      \    alert('Unexplained permission (over-privilege/creep)', user, perm)"
- question: When users are clustered by their access-pattern feature vectors, which users fall into a
    cluster that mismatches their documented role (for example, a marketing user clustered with administrators)?
  context: 'Supports Isolate via unsupervised clustering of permission profiles. Build a feature vector
    per user from access patterns: binned counts of access to server subnets (Zeek conn.log), object types
    (Windows Event ID 4663), distinct shares, off-hours ratio, and permission counts. Cluster users (e.g.,
    K-Means) and flag any user whose cluster mismatches their documented role for a permissions review.
    Validate cluster-to-role alignment against the organizational role catalog. A positive result (role/cluster
    mismatch) reveals accounts behaving like a different, often more privileged, population than their
    assigned role implies. Validate cluster-to-role alignment against the organizational role catalog;
    benchmark on [CERT Insider Threat Test Dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for user in users:\n  fv = features(subnet_access_bins(Zeek), object_type_bins(4663), distinct_shares,\
      \ offhours_ratio, perm_count)\nclusters = KMeans(fit(all_user_fv))\nfor user in users:\n  if dominant_role(cluster_of(user))\
      \ != documented_role(user):\n    alert('User clustered against role peers', user, cluster_of(user))"
- question: When an unsupervised outlier model (Isolation Forest / Extended Isolation Forest or One-Class
    SVM) scores per-user access behavior, which users are flagged as over-broad-access outliers, and what
    are the top contributing features behind each score?
  context: Supports Isolate via explainable unsupervised outlier scoring. Train an Isolation Forest /
    Extended Isolation Forest or One-Class SVM on benign per-user access feature vectors (distinct servers/shares,
    permission counts, access volume, success/fail ratio, off-hours ratio) and score new behavior for
    over-broad-access outliers. Surface the top-3 contributing features (e.g., via LIME) in the alert
    text rather than an opaque score so analysts can triage quickly. A positive result identifies accounts
    whose access profile deviates sharply from the learned benign baseline, with explainable drivers for
    review. The isolation-forest/one-class-SVM outlier methods draw on [Robust IoT security using isolation
    forest and one class SVM algorithms, Scientific Reports](https://www.nature.com/articles/s41598-025-20445-4)
    and [Extended Isolation Forest, Hariri et al](https://arxiv.org/abs/1811.02141).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = benign_user_feature_vectors(distinct_servers, distinct_shares, perm_count, access_volume,\
      \ fail_ratio, offhours_ratio)\nmodel = IsolationForest().fit(X)  # or OneClassSVM\nfor user in users:\n\
      \  score = model.anomaly_score(features(user))\n  if score > threshold:\n    alert('Over-broad-access\
      \ outlier', user, top3_features=LIME(model, user))"
- question: When per-user activity sequences are modeled with LSTM/autoencoder networks, which users show
    reconstruction error or next-event surprise above the learned threshold, indicating drift toward privilege
    misuse or off-hours access bursts?
  context: Supports Isolate via temporal sequence modeling. Model per-user activity sequences with LSTM/autoencoder
    networks to detect drift toward privilege misuse and off-hours access bursts that static features
    miss. Reconstruction error or next-event surprise above a learned threshold flags the user for review,
    with the deviating events surfaced for triage. Benchmark and tune on labeled insider scenarios. A
    positive result captures behavioral drift over time, such as an account gradually expanding its access
    pattern or acting at unusual hours, that point-in-time checks would overlook. The sequence-modeling
    approach is from [Deep Learning for Insider Threat Detection, Yuan and Wu](https://arxiv.org/abs/2005.12433);
    benchmark and tune on [CERT Insider Threat Test Dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = train_lstm_autoencoder(per_user_event_sequences(benign))\nfor user in users:\n  seq\
      \ = recent_event_sequence(user)\n  err = reconstruction_error(model, seq)  # or next_event_surprise\n\
      \  if err > learned_threshold:\n    alert('Temporal drift toward privilege misuse', user, deviating_events(seq))"
