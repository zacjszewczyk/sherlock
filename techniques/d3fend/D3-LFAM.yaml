name: 'D3-LFAM: Local File Access Mediation'
id: 0fefa4b9-e33d-4912-b1a8-80be71894e86
description: Investigate the effectiveness of local file access mediation (D3-LFAM) on hosts holding sensitive
  data, and detect attempts to probe, bypass, or abuse file permissions. Local file access mediation is
  the operating system's allow/deny decision on each request to open or modify a local file, and the denied-access
  (failure) decisions it produces are a first-class detection signal. This playbook helps an analyst (1)
  alert deterministically on denied or unexpected access to curated sensitive paths and decoy honeyfiles
  using object-access auditing (SACL), (2) detect distributed permission probing where a single account
  is denied across many folders, shares, and hosts in a short window, (3) catch file-type header/magic-number
  tampering and the high-velocity, high-entropy read->encrypt->delete modification pattern characteristic
  of ransomware, (4) baseline per-user and per-server denial and modification rates with robust median/MAD
  and EWMA control limits to surface anomalous failure bursts, and (5) model file-access sequences and
  process->file provenance chains with machine learning to separate benign misconfiguration noise from
  malicious probing. It combines deterministic SACL/honeyfile rules, robust statistical baselining of
  denial and modification rates, and sequence/provenance ML across Windows object-access events, Linux
  auditd, Sysmon, and EDR file telemetry, so the analyst can measure how well file access controls actually
  prevent unauthorized access to sensitive files.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
