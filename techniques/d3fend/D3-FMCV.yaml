name: 'D3-FMCV: File Metadata Consistency Validation'
id: be9515a1-31a9-4bc2-a8fa-87c3d438e8ca
description: 'Investigate files whose declared structural metadata is inconsistent with their actual content
  in order to detect and isolate malformed, smuggled, or weaponized files. This playbook helps an analyst
  validate the consistency between a file''s metadata (magic bytes, declared block/section lengths, offsets/pointers,
  checksums/CRCs, PE/header fields, document structural paths) and its real bytes, and to isolate files
  that disagree. It layers three independent detection approaches: a deterministic floor that validates
  every extracted file against declarative file-format grammars and structural rules (Derric, PE-Probe,
  PolyFile, Hidost, magic-byte/hash allowlists); a statistical layer that scores content-vs-metadata deviation
  via byte-frequency distance (PAYL), per-section Shannon entropy, declared-vs-actual size deltas/overlay
  volume, and malformed-file rate and concentration monitoring; and a machine-learning layer (EMBER-style
  gradient-boosted/Random Forest classifiers and Hidost structural-path classifiers) with explainable,
  top-feature alerting via TreeSHAP. Use it to automatically isolate inconsistent files at network egress/ingress,
  email gateways, proxies, and file shares, and to escalate when a malformed file is executed or loaded
  shortly after arrival.'
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any extracted or newly written files failing declarative file-format grammar validation,
    where a declared block/segment length does not equal the actual byte length, a pointer or offset resolves
    outside the file bounds, the magic bytes do not match the declared or observed type, or a recomputed
    CRC/checksum does not equal the stored value?
  context: This is the floor-of-determinism check that runs on every extracted file (Zeek files.log) or
    newly written file (Sysmon Event ID 11) regardless of ML availability. Following the Derric model-driven
    approach, each file is parsed against a declarative grammar describing its fields, declared lengths,
    pointers/offsets, magic markers, sequence constraints, and checksums. A deterministic mismatch between
    declared metadata and actual content is a strong, low-false-positive signal of a malformed or tampered
    file used to smuggle content past type-based controls. Because the Isolate tactic seeks to erect logical
    barriers, any file that fails grammar validation should be quarantined deterministically rather than
    allowed to traverse the boundary. A positive result (any of the four conditions) warrants immediate
    isolation; a clean parse moves the file to the statistical and ML layers.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each file in (zeek_files.log OR sysmon_eid=11):\n  g = grammar_for(file.declared_type)\n\
      \  if g.declared_length != file.actual_byte_length\n     or any(pointer/offset resolves outside\
      \ [0, file_size])\n     or file.magic_bytes != g.expected_magic\n     or recompute_crc(file) !=\
      \ file.stored_crc:\n       alert('FMCV grammar fail'); quarantine(file)"
- question: Do any PE or executable files have header metadata that is internally inconsistent with their
    observed structure - for example SizeOfImage not equal to the sum of aligned sections, NumberOfSections
    disagreeing with the section-table entry count, a section whose raw size exceeds its virtual size,
    an EntryPoint that falls outside any defined section, or a declared checksum mismatch?
  context: For PE/executable cohorts this applies the structural-consistency approach of PE-Probe to detect
    headers that have been hand-edited or corrupted to evade type-based or signature controls. Such inconsistencies
    frequently accompany packing, manual section injection, or crafted loaders. Under the Isolate tactic,
    deterministic PE inconsistencies (raw size greater than virtual size, entry point outside any section,
    declared SizeOfImage mismatch) justify immediate quarantine because a well-formed benign PE produced
    by a normal toolchain will not exhibit them. A positive finding should isolate the binary and trigger
    correlation with execution telemetry.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each pe_file in (zeek_files.log mime=application/x-dosexec OR sysmon_eid=11 ext in [exe,dll,sys]):\n\
      \  h = parse_pe_header(pe_file)\n  if h.SizeOfImage != sum(align(section.virtual_size)) for section\
      \ in h.sections\n     or h.NumberOfSections != count(h.section_table)\n     or any(section.SizeOfRawData\
      \ > section.VirtualSize) \n     or not in_any_section(h.EntryPoint)\n     or h.declared_checksum\
      \ != recompute_checksum(pe_file):\n       alert('PE header inconsistency'); quarantine(pe_file)"
- question: Does any file's true type, determined by magic bytes / file signature, disagree with its claimed
    type, extension, or MIME, and does it fail to match any allowlisted known-good hash (exact or fuzzy/ssdeep)
    for its declared application or model - i.e., is it an unknown or mistyped blob?
  context: Following Costin et al., this verifies the real file type against the claimed type/extension/MIME
    and compares exact and fuzzy (ssdeep) hashes against per-application known-good/known-bad corpora.
    Extension or type spoofing (e.g., an executable presented as a document, or a renamed archive) is
    a classic delivery trick; unknown blobs that match no allowlisted hash for their declared application
    are candidates for isolation. For the Isolate tactic, type/extension mismatches and unknown-hash files
    should be held at the boundary. A positive result is a mismatch or an unknown blob; a negative result
    is a confirmed allowlist match for the correct declared type.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each file in (zeek_files.log OR sysmon_eid=11):\n  true_type = magic_signature(file)\n\
      \  if true_type != file.claimed_type or mime(true_type) != file.declared_mime:\n       alert('type/extension\
      \ mismatch'); quarantine(file)\n  if sha256(file) not in goodhash[file.declared_app] and \n    \
      \ max(ssdeep_match(file, goodhash[file.declared_app])) < 50:\n       alert('unknown blob / no allowlist\
      \ match'); quarantine(file)"
- question: Are any files polyglots (valid as more than one format), or do they contain overlapping objects,
    content located past the declared end-of-file, or byte regions never consumed by the legitimate parser
    (appended/unparsed payloads)?
  context: Using a recursive parser such as PolyFile, this maps the file's internal structure and measures
    byte coverage. Polyglots and appended payloads are a common way to smuggle executable or scripted
    content past type-based controls because the file remains 'valid' for its declared type while carrying
    a second hidden format or trailing data. Multi-format ambiguity and unparsed byte regions are strong
    isolation signals. Under the Isolate tactic, quarantine files containing appended/unparsed payloads
    or multi-format ambiguity. A positive result is unparsed coverage gaps or multiple format matches;
    a negative result is full byte coverage by a single legitimate parser.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each file in (zeek_files.log OR sysmon_eid=11):\n  m = polyfile_map(file)\n  if count(m.format_matches)\
      \ > 1\n     or m.has_overlapping_objects\n     or m.bytes_past_declared_eof > 0\n     or m.uncovered_byte_ratio\
      \ > 0:\n       alert('polyglot/overlay/uncovered bytes'); quarantine(file)"
- question: For hierarchical documents (PDF, Office/OLE, SWF), do any documents contain structural paths
    that are known-malicious or structurally impossible for a valid document of the declared type - such
    as embedded executable/launch objects, or broken xref/trailer references?
  context: Following Hidost, hierarchical documents are parsed into structural paths and evaluated against
    allow/deny rules over known-malicious or structurally-impossible path combinations. Malicious documents
    frequently embed launch actions, executable objects, or have corrupted cross-reference/trailer structures
    inconsistent with a benign document of that type. For the Isolate tactic, these are logical barriers
    that hold weaponized documents at the boundary. A positive result is the presence of a denied or impossible
    structural path; a negative result is a structure consistent with benign documents of the declared
    type.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each doc in (zeek_files.log OR sysmon_eid=11 type in [pdf,ole,office,swf]):\n  paths =\
      \ structural_paths(doc)\n  if any(p in DENY_PATHS for p in paths)        # e.g. /OpenAction/Launch,\
      \ embedded EXE\n     or has_broken_xref_or_trailer(doc)\n     or any(p is impossible_for(doc.declared_type)\
      \ for p in paths):\n       alert('document structural-path anomaly'); quarantine(doc)"
- question: When a file fails any of the above metadata-consistency validations, was that same malformed
    or inconsistent file subsequently executed or loaded from the same host or path shortly after arrival
    (Sysmon Event ID 1 process creation or Event ID 7 image load following the Event ID 11 file write)?
  context: 'This correlates a deterministic validation failure with downstream execution or module load
    on the same host/path to distinguish a quarantined-but-inert artifact from an active compromise. A
    malformed file that is then run or loaded indicates the logical barrier was bypassed or applied too
    late, and should be escalated to incident priority. For the Isolate tactic this is the escalation
    trigger: validation failure plus execution equals high-confidence active intrusion. A positive result
    is execution/load within a short window after a flagged write; a negative result is a flagged file
    with no subsequent execution.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 7
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days; correlate within 24 hours of the file write event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let flagged = FMCV_validation_failures (Event ID 11 writes that failed any grammar/header/type\
      \ check)\njoin (sysmon_eid in [1,7]) as exec on exec.image_path == flagged.target_path\nwhere exec._time\
      \ between flagged._time and flagged._time + 24h\n  | emit alert('malformed file executed/loaded'),\
      \ priority=incident"
- question: Do any files or sections exhibit a 1-gram byte-frequency distribution that deviates significantly
    from the expected distribution for their declared type and length bucket - for example a region declared
    as text or code that shows near-uniform binary byte frequency?
  context: Following PAYL, build per-(declared-type, length-bucket) models of the 1-gram byte-frequency
    distribution and score each file/section by a simplified Mahalanobis distance from the type centroid.
    This catches content that is inconsistent with its declared type even when it parses 'well enough'
    to pass strict grammar checks - the statistical physics of the malformation. Derive the per-type alert
    threshold from the in-environment 99th percentile of benign Mahalanobis scores. For the Isolate tactic,
    high-distance files are candidates for quarantine. A positive result is a Mahalanobis score above
    the type-specific threshold; a negative result is a distribution consistent with the type centroid.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each file/section f in (zeek_files.log OR sysmon_eid=11):\n  dist = byte_freq_1gram(f)\n\
      \  centroid, var = model[(f.declared_type, length_bucket(f))]\n  score = mahalanobis_simplified(dist,\
      \ centroid, var)\n  thr = p99(benign_scores[f.declared_type])\n  if score > thr: alert('byte-distribution\
      \ outlier'); quarantine(f)"
- question: Are there any file sections whose Shannon entropy is abnormally high for their software family/cohort
    (roughly above 7.0-7.2) in a region declared as code or text, indicating packing or encryption inconsistent
    with the declared structure?
  context: Compute per-section Shannon entropy and maintain baselines per software family/cohort, per
    Costin et al. and the packed/non-packed entropy heuristics of PE-Probe. High entropy in a region declared
    as code/text signals packing or encryption that contradicts the declared structure. Use the 256-bin
    byte histogram and 2-D byte-entropy histogram features from EMBER to compute these statistics consistently
    across formats, and flag sections above the 99th percentile entropy for their cohort. For the Isolate
    tactic, high-entropy mismatched sections are quarantine candidates. A positive result is a section
    above the cohort 99th-percentile entropy; a negative result is entropy within the benign cohort range.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each section s in parsed_files(zeek_files.log, sysmon_eid=11):\n  H = shannon_entropy(s.bytes)\
      \            # via EMBER 256-bin + byte-entropy histogram\n  thr = p99(cohort_entropy[s.software_family])\n\
      \  if s.declared_kind in [code,text] and (H > 7.1 or H > thr):\n       alert('section entropy outlier\
      \ (packing/encryption)'); quarantine(s.file)"
- question: How large is the discrepancy between each file's declared total/section length and its actual
    length, and how many overlay or appended bytes exist past the declared structure - are any files in
    the upper tail of these size-delta/overlay distributions for their cohort?
  context: Measure the byte volume and ratio of (a) declared total/section length versus actual length
    and (b) any PE overlay or appended bytes past the declared structure, then track these deltas per
    cohort. This captures the Volume dimension of malformation directly from first-party structural parsing.
    Files with overlay bytes above the cohort 95th percentile, or with a declared-vs-actual size ratio
    outside the benign range, are likely carrying smuggled data. For the Isolate tactic, upper-tail files
    should be quarantined. A positive result is a delta/overlay in the upper tail; a negative result is
    a size profile within the benign cohort range.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each file f in parsed_files(zeek_files.log, sysmon_eid=11):\n  overlay = f.actual_size\
      \ - f.declared_structure_end\n  ratio = abs(f.declared_total_len - f.actual_size) / f.actual_size\n\
      \  if overlay > p95(cohort_overlay[f.cohort]) or ratio outside benign_range[f.cohort]:\n       alert('size\
      \ delta / overlay volume outlier'); quarantine(f)"
- question: Is there an abnormal rate or concentration of malformed/parse-failing files associated with
    a particular source domain/IP, destination subnet, or host group - i.e., signs of coordinated delivery
    rather than isolated corruption?
  context: Measure validation/parse failure rates (Frequency, counts per minute) and concentrations by
    source domain/IP, destination subnet, and host group using Zeek conn.log enrichment. A spike in malformed-file
    concentration for a source or destination above the historical 95th percentile distinguishes a coordinated
    campaign from random isolated corruption. For the Isolate tactic, a concentrated burst should both
    isolate the affected files and trigger a campaign investigation and possible source/destination blocking.
    A positive result is a concentration above the historical 95th percentile; a negative result is failure
    rates within normal baseline.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats count(FMCV_validation_failures) as malformed by bin(_time,1m), src_domain, src_ip, dst_subnet,\
      \ host_group\n  enrich with zeek_conn.log (src/dst, bytes, duration)\n  thr = p95(historical_malformed_concentration\
      \ per entity)\n  where malformed > thr | alert('coordinated malformed-file delivery'); investigate_campaign"
- question: Does a trained malformed-content classifier flag any files as malformed/suspicious based on
    structural and statistical features (header fields, section virtual-vs-raw size mismatches, declared
    SizeOfImage delta, byte histogram, byte-entropy histogram) across PE/ELF/Mach-O/PDF/Office, and are
    any high-confidence malicious-malformed scores present?
  context: Train a gradient-boosted (LightGBM) or Random Forest classifier on structural and statistical
    features using the EMBER feature representation/datasets and the multi-format extractors of EMBER2024
    to classify files as valid versus malformed/suspicious across PE/ELF/Mach-O/PDF/Office. This layer
    runs in parallel with the deterministic floor and the statistical layer; high-confidence malicious-malformed
    scores can automate isolation and analyst prioritization while the deterministic checks remain an
    independent layer. For the Isolate tactic, high-confidence model hits drive automated quarantine.
    A positive result is a high-confidence malicious-malformed score; a negative result is a confident
    valid classification.
  answer_sources:
  - Zeek files.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = ember_extract(file)   # header fields, vsize-vs-rawsize, SizeOfImage delta, byte/entropy\
      \ histograms\nscore = lgbm_model.predict_proba(features)\nif score >= high_confidence_threshold:\n\
      \    alert('ML: malformed/suspicious file', score); quarantine(file)\n# deterministic grammar/header\
      \ checks still run independently"
- question: For hierarchical documents, does a structural-path classifier flag any PDF/SWF/Office files
    whose structure is inconsistent with benign documents of the same type, based on structural-path frequency
    vectors?
  context: Following Hidost, train an SVM or Random Forest over structural-path frequency vectors to flag
    documents whose structure is inconsistent with benign documents of the same type (published evaluations
    show >99% TPR at low FPR). Calibrate the decision threshold against in-environment benign documents
    to control false positives. This complements the deterministic structural-path rules with a learned
    model of benign document structure. For the Isolate tactic, model-flagged documents are quarantine
    candidates. A positive result is a classifier score above the calibrated threshold; a negative result
    is a structure consistent with benign documents.
  answer_sources:
  - Zeek files.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'vec = structural_path_frequency_vector(doc)   # Hidost feature space

      score = doc_model.decision_function(vec)

      thr = calibrate_against(benign_docs[doc.type])

      if score > thr: alert(''ML: anomalous document structure''); quarantine(doc)'
- question: For every machine-learning alert, are the top-3 contributing features and their contribution
    magnitudes surfaced in the alert text (e.g., SizeOfImage delta, section-entropy percentile, byte-histogram
    deviation, structural-path rarity), rather than just a bare score?
  context: Using TreeSHAP, surface the top-3 contributing features and their contribution magnitudes for
    every model alert, following rule-extraction/interaction-aware explainability work and the SHAP-in-IDS
    systematic review. Explainable alerting lets the analyst triage why a file was flagged, validate the
    model's reasoning, and tune thresholds, instead of trusting an opaque score. For the Isolate tactic,
    explainability supports defensible automated isolation decisions and faster human review. A positive
    result is an alert enriched with named top-3 features and magnitudes; a negative result (a score-only
    alert) indicates the explainability requirement is not met and should be remediated.
  answer_sources:
  - Zeek files.log
  - Windows Sysmon Event ID 11
  - 'NAI: Network egress/ingress points, email gateways, proxies, and file shares.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for each model_alert a:\n  shap_vals = treeshap(model, a.features)\n  top3 = top_n(shap_vals,\
      \ 3)   # e.g. SizeOfImage_delta, section_entropy_pctile, structural_path_rarity\n  a.text = format('score=%s;\
      \ top features: %s', a.score, top3)\n  require(len(top3) == 3)  # alert must include features, not\
      \ just score"
