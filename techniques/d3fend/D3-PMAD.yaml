questions:
- question: Do any TLS sessions present JA3/JA3S client/server fingerprints that match curated malicious
    or prohibited fingerprint lists associated with known implant, proxy, or RAT TLS stacks (e.g., Cobalt
    Strike, meek)?
  context: 'Detection objective: catch malware and tooling whose TLS library produces a distinctive handshake
    even though the payload is encrypted. Compute JA3/JA3S MD5 fingerprints over the ClientHello/ServerHello
    fields (version, cipher list, extensions, elliptic curves) and compare the ssl.log ja3/ja3s values
    against curated malicious/prohibited fingerprint lists per the JA3 TLS client fingerprinting project.
    A positive match (a client fingerprint that lines up with a known implant stack talking to an external
    host) is a high-confidence command-and-control lead under the Detect tactic; a negative result means
    the observed TLS clients resemble known-good software. Maintain and regularly refresh the malicious
    fingerprint set and pivot any hit to the full conn.log session for scope. References: [JA3 TLS Client
    Fingerprinting](https://github.com/salesforce/ja3).'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Internet gateways, server farm ingress/egress points, internal network core switches.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ja3, ja3s = compute_ja3(ClientHello), compute_ja3s(ServerHello)\nfor s in ssl.log:\n  if s.ja3\
      \ in malicious_ja3 or s.ja3s in malicious_ja3s:\n    alert('malicious JA3/JA3S match', s)"
- question: Do any TLS sessions match version-resilient JA4/JA4S/JA4X fingerprints on implant or prohibited
    TLS, server, or certificate stacks that would evade JA3 because of GREASE or extension shuffling?
  context: 'Detection objective: detect implant TLS that defeats JA3 matching through GREASE values and
    randomized extension ordering. Compute JA4/JA4S/JA4X fingerprints, which sort extensions before hashing
    so they survive shuffling, and run the results through allow/deny lists of implant client, server,
    and certificate stacks per the JA4+ network fingerprinting suite. A positive result is a deny-listed
    JA4 fingerprint or one that appears nowhere in the benign allow list; a negative result means the
    handshake matches expected software. JA4 should be the preferred stable identifier where browser TLS
    randomization makes JA3 noisy, supporting the Detect tactic''s goal of reliable covert-channel identification.
    References: [JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Internet gateways, server farm ingress/egress points, internal network core switches.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for s in ssl.log:\n  j4 = compute_ja4(s); j4s = compute_ja4s(s); j4x = compute_ja4x(x509[s.cert])\n\
      \  if j4 in deny_ja4 or j4s in deny_ja4s or j4x in deny_ja4x:\n    alert('deny-listed JA4 stack',\
      \ s)\n  if j4 not in allow_ja4 and is_external(s.id.resp_h):\n    alert('unknown JA4 to external',\
      \ s)"
- question: Are there TLS sessions that violate explicit protocol policy — negotiating TLS below 1.2,
    using forbidden or export-grade cipher suites, presenting self-signed or expired certificates, running
    JA3-bearing TLS on a non-standard port, or where the SNI is absent or mismatched against the resolved
    destination?
  context: 'Detection objective: surface policy-violating TLS that legitimate enterprise services should
    never produce. Raise alerts for the denied conditions (TLS < 1.2, forbidden/export ciphers, self-signed
    or expired certificates, TLS on a non-standard port, SNI absent or inconsistent with the resolved
    destination), mirroring the threshold-on-metadata alarming described in the Vectra metadata-vectors
    patent. A positive result flags either misconfiguration or deliberate evasion such as a malicious
    server using a self-signed certificate; a negative result confirms TLS hygiene. Under the Detect tactic
    these deterministic rules are cheap, explainable tripwires that complement fingerprint and ML scoring;
    tune SNI checks against known CDN/SAN behavior to limit false positives. References: [Vectra metadata-vectors
    patent](https://patents.google.com/patent/US20160191551A1).'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Internet gateways, server farm ingress/egress points, internal network core switches.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for s in ssl.log:\n  if s.version < 'TLS1.2' or s.cipher in forbidden_ciphers:\n    alert('weak\
      \ TLS policy', s)\n  c = x509[s.cert]\n  if c.self_signed or c.not_after < now:\n    alert('bad\
      \ certificate', s)\n  if s.ja3 and s.id.resp_p not in {443,8443}:\n    alert('TLS on non-standard\
      \ port', s)\n  if not s.server_name or s.server_name != resolved_name(s.id.resp_h):\n    alert('SNI\
      \ absent/mismatch', s)"
- question: Which clients exhibit high per-connection JA3 instability (many unique JA3 values from one
    host), and are JA3 deny-list hits being driven by benign browser TLS extension randomization rather
    than real implants?
  context: 'Detection objective: reduce JA3 false positives while turning fingerprint instability itself
    into a signal. Modern browsers randomize TLS extensions, so a single benign client can emit many JA3
    values; recognize this per the Stamus Networks analysis and prefer JA4 for stable matching when suppressing
    deny-list noise. Separately, profile the rate of unique JA3 values per client over time — an unusually
    high churn of fingerprints from one source can indicate tooling that rotates its TLS stack. A positive
    result is a host whose JA3 variance is anomalous relative to peers; a negative result is normal browser
    variance. This tuning step keeps the Detect tactic precise by separating randomization artifacts from
    adversary behavior. References: [Stamus Networks](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization).'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Internet gateways, server farm ingress/egress points, internal network core switches.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "by client over window:\n  uniq_ja3 = distinct(ssl.ja3)\n  if uniq_ja3 > p99(uniq_ja3 across\
      \ clients):\n    alert('high JA3 churn', client)\nfor hit in ja3_denylist_hits:\n  if browser_randomized(hit)\
      \ and ja4_stable(hit) not in deny_ja4:\n    suppress(hit)  // prefer JA4"
- question: Which TLS fingerprints, certificate validity periods, and cipher selections are rare relative
    to a rolling prevalence baseline per host role — for example singleton JA3/JA4 fingerprints seen talking
    to external IPs, or certificate lifetimes below the 1st percentile?
  context: 'Detection objective: find rare-by-prevalence TLS metadata that rarely appears in benign traffic
    but is common to bespoke C2. Maintain rolling prevalence baselines of JA3/JA4 fingerprints, certificate
    validity periods, and cipher selections per host role, and flag fingerprints seen on fewer than N
    hosts (e.g., a singleton JA3 reaching an external IP) plus certificate-lifetime outliers below the
    1st percentile, following the prevalence/rarity scoring approach in RITA. A positive result is a rare
    fingerprint or short-lived certificate concentrated on a single host-to-external pair; a negative
    result is metadata that is common across the fleet. This statistical layer supports the Detect tactic
    by catching never-before-seen stacks that no deny list would yet contain. References: [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Internet gateways, server farm ingress/egress points, internal network core switches.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling_prevalence(ssl.ja3, ssl.ja4, x509.validity, ssl.cipher) by host_role\n\
      for s in ssl.log:\n  if count_hosts(s.ja3) < N and is_external(s.id.resp_h):\n    alert('singleton\
      \ JA3 to external', s)\n  if x509[s.cert].validity_days < p01(baseline.validity):\n    alert('short-lived\
      \ cert outlier', s)"
- question: Which encrypted TLS sessions score as anomalous from flow metadata alone (packet sizes, directionality,
    timing) even when handshake fields are hidden by TLS 1.3 or Encrypted Client Hello?
  context: 'Detection objective: detect covert TLS channels under TLS 1.3/ECH where JA3/JA4 and SNI are
    unavailable. Apply self-supervised or contrastive scoring to encrypted-session flow metadata (sizes,
    directionality, inter-packet timing) to flag anomalous TLS sessions without decryption, per ET-SSL
    and the version-agnostic flow features described in research on extending C2 to TLS 1.3. Surface the
    top-3 contributing features in the alert text via SHAP attribution so analysts can triage quickly.
    A positive result is a high-anomaly encrypted session whose size/timing profile diverges from learned
    benign behavior; a negative result fits the baseline. This ML layer preserves Detect-tactic coverage
    exactly where deterministic handshake inspection goes blind. References: [ET-SSL](https://www.nature.com/articles/s41598-025-08568-0);
    [Extending C2 to TLS 1.3](https://dl.acm.org/doi/10.1145/3678890.3678921); [SHAP in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - 'NAI: Internet gateways, server farm ingress/egress points, internal network core switches.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = flow_features(sizes, direction, inter_pkt_timing)  // no decryption\nscore = ssl_anomaly_model.score(feats)\n\
      if score > threshold:\n  alert('anomalous encrypted TLS session', top3=shap(feats))"
- question: Are there DNS queries matching tunneling or abuse indicators — excessive TXT/NULL record requests,
    query names longer than a fixed threshold (e.g., > 52 characters), label counts above baseline, or
    DNS issued by non-resolver processes/hosts?
  context: 'Detection objective: catch DNS tunneling and DNS-based C2/staging via deterministic shape
    rules. Flag DNS metadata matching tunneling/abuse indicators — heavy TXT/NULL record usage, query
    name length above a fixed threshold, label counts above baseline, and DNS originating from processes
    or hosts that are not sanctioned resolvers — per MITRE detection strategy DET0400. A positive result
    (e.g., a workstation issuing long TXT queries directly to an external nameserver) is a strong tunneling
    lead under the Detect tactic; a negative result is ordinary resolver traffic. Pair internal resolver
    logs with Zeek to confirm which endpoint actually generated the query and to spot clients bypassing
    approved resolvers. References: [MITRE DET0400](https://attack.mitre.org/detectionstrategies/DET0400/).'
  answer_sources:
  - Zeek dns.log
  - Firewall DNS logs
  - Windows DNS Server logs
  - 'NAI: Internal DNS resolvers, internet gateways, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for q in dns.log:\n  if q.qtype in {'TXT','NULL'} and q.qtype_count > baseline:\n    alert('excessive\
      \ TXT/NULL', q)\n  if len(q.query) > 52 or label_count(q.query) > baseline_labels:\n    alert('long/abnormal\
      \ DNS name', q)\n  if q.orig_h not in approved_resolvers:\n    alert('DNS from non-resolver host',\
      \ q)"
- question: Which parent domains or hosts deviate from rolling baselines of query length, label count,
    and unique-subdomain rate, or show n-gram/Zipfian deviation in their query names consistent with encoded
    payloads?
  context: 'Detection objective: detect encoded-payload DNS by comparing query-shape distributions to
    a learned baseline. Maintain rolling per-parent-domain baselines of query length, label count, and
    unique-subdomain rate, flagging percentile outliers (e.g., > 99th percentile query length, or > 50
    unique subdomains per parent per hour), and compute n-gram/Zipfian deviation of query names to catch
    encoded data per NgViz. A positive result is a domain with an abnormal burst of unique high-length
    subdomains or query text that does not follow natural-language n-gram frequencies; a negative result
    matches normal name distributions. This statistical layer supports the Detect tactic by catching tunnels
    and DGAs that no static signature lists. References: [NgViz](https://arxiv.org/pdf/1004.4359).'
  answer_sources:
  - Zeek dns.log
  - Firewall DNS logs
  - Windows DNS Server logs
  - 'NAI: Internal DNS resolvers, internet gateways, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling(query_len, label_count, uniq_subdomains) by parent_domain\nfor pd in parent_domains\
      \ over window:\n  if pd.query_len > p99(baseline) or pd.uniq_subdomains_per_hour > 50:\n    alert('DNS\
      \ shape outlier', pd)\n  if ngram_divergence(pd.names) > zipf_threshold:\n    alert('encoded query\
      \ names', pd)"
- question: Do any DNS subdomain labels exceed an empirically derived Shannon-entropy threshold (~> 4.0
    bits/char for labels, with payload entropy baselines > 7.0 bits/byte), indicating encoded or encrypted
    tunnel data?
  context: 'Detection objective: identify encrypted/encoded DNS tunnel content using character entropy.
    Compute Shannon entropy of subdomain labels and alert when it exceeds an empirically derived threshold
    (~> 4.0 bits/char for labels, with payload entropy baselines above 7.0 bits/byte for raw payloads)
    per the baseline payload entropy research. High entropy means the label looks random rather than dictionary-like,
    a hallmark of base32/base64 or ciphertext smuggled in DNS names. A positive result is a host emitting
    consistently high-entropy labels to a single parent domain; a negative result reflects readable, low-entropy
    hostnames. Calibrate the threshold on benign traffic (some CDNs use hashed names) to keep this Detect-tactic
    check precise. References: [Baseline Payload Entropy](https://www.mdpi.com/1999-5903/16/12/470).'
  answer_sources:
  - Zeek dns.log
  - Firewall DNS logs
  - Windows DNS Server logs
  - 'NAI: Internal DNS resolvers, internet gateways, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for q in dns.log:\n  e = shannon_entropy(subdomain_labels(q.query))\n  if e > 4.0:  // bits/char;\
      \ payload baseline >7.0 bits/byte\n    alert('high-entropy DNS label (tunnel)', q)"
- question: Which hosts show an NXDOMAIN ratio or rcode distribution that breaks from their tuned baseline
    over a sliding window (e.g., > 30% NXDOMAIN, or a CUSUM/change-point shift), indicating DGA beacon-out
    or tunnel control traffic?
  context: 'Detection objective: use DNS failure behavior as an independent detection signal. Track per-host
    NXDOMAIN ratio and rcode distribution over a sliding window and alert when the NXDOMAIN fraction exceeds
    a tuned baseline (e.g., > 30%) or shows a CUSUM/change-point break, using the change-point methods
    of Aminikhanghahi and Cook. DGA malware generates many non-existent domains while searching for its
    live C2, producing an NXDOMAIN spike; tunnels can also show abnormal rcode mixes. A positive result
    is a host whose failure ratio abruptly climbs above baseline; a negative result is stable, low failure
    rates. This failure-mode signal complements success-oriented metrics and strengthens Detect-tactic
    coverage of beaconing. References: [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek dns.log
  - Firewall DNS logs
  - Windows DNS Server logs
  - 'NAI: Internal DNS resolvers, internet gateways, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "by host over sliding_window:\n  nx_ratio = count(rcode=NXDOMAIN)/count(*)\n  if nx_ratio >\
      \ 0.30 or cusum_break(nx_ratio):\n    alert('NXDOMAIN spike (DGA/tunnel)', host)"
- question: Which DNS domains score highest from an unsupervised model (autoencoder or Isolation Forest)
    trained on engineered dns.log features such as query length, entropy, record-type mix, unique-subdomain
    rate, and NXDOMAIN ratio?
  context: 'Detection objective: prioritize the most anomalous DNS metadata when no single rule fires.
    Train an unsupervised autoencoder or Isolation Forest on engineered dns.log features (query length,
    entropy, record-type mix, unique-subdomain rate, NXDOMAIN ratio) and prioritize domains with high
    reconstruction error or high isolation score, per Kitsune and the Isolation Forest vs autoencoders
    comparison, reporting the top-3 driving features per SHAP-in-IDS. A positive result is a domain whose
    combined feature vector is far from learned normal even if each individual feature is borderline;
    a negative result fits the model''s normal manifold. This ML layer rounds out the Detect tactic by
    catching multivariate anomalies that escape per-feature thresholds. References: [Kitsune](https://arxiv.org/abs/1802.09089);
    [Isolation Forest vs Autoencoders](https://ieeexplore.ieee.org/document/10143005/); [SHAP in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek dns.log
  - Firewall DNS logs
  - Windows DNS Server logs
  - 'NAI: Internal DNS resolvers, internet gateways, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = engineer(query_len, entropy, rtype_mix, uniq_subdomain_rate, nxdomain_ratio)\nscore\
      \ = iforest.score(feats)  // or autoencoder reconstruction error\nif score > threshold:\n  alert('anomalous\
      \ DNS metadata', domain, top3=shap(feats))"
- question: Do any HTTP transactions match malicious or prohibited metadata signatures — known-bad User-Agent
    strings, deny-listed JA4H HTTP fingerprints, or policy-violating method-header combinations such as
    non-browser User-Agents to external hosts or requests missing a Host header?
  context: 'Detection objective: catch malicious HTTP clients via deterministic metadata matching. Match
    User-Agent strings, JA4H HTTP fingerprints, and method-header combinations against curated malicious/prohibited
    indicator sets and explicit policy (e.g., non-browser User-Agents reaching external hosts, missing
    Host header) per JA4+ and MITRE DET0400. A positive result is a transaction whose client metadata
    matches a known-bad signature or breaks an explicit policy rule; a negative result looks like sanctioned
    browser/application traffic. Under the Detect tactic these signatures provide fast, explainable hits
    on commodity malware and tooling; keep the indicator and policy sets current and pivot matches to
    the full session for scope. References: [JA4+](https://github.com/FoxIO-LLC/ja4); [MITRE DET0400](https://attack.mitre.org/detectionstrategies/DET0400/).'
  answer_sources:
  - Zeek http.log
  - Proxy logs
  - Web server access logs
  - 'NAI: Internet gateways, web proxy chokepoints, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for t in http.log:\n  if t.user_agent in malicious_ua or compute_ja4h(t) in deny_ja4h:\n \
      \   alert('malicious HTTP metadata', t)\n  if t.user_agent not in browser_uas and is_external(t.id.resp_h):\n\
      \    alert('non-browser UA to external', t)\n  if not t.host:\n    alert('missing Host header',\
      \ t)"
- question: Which outbound HTTP requests match no learned benign per-host application fingerprint built
    from header metadata (User-Agent, header set/order, constant header values, byte volume)?
  context: 'Detection objective: detect novel outbound HTTP clients by fingerprinting known-good applications
    and flagging anything that fits none of them. Build per-host application fingerprints from HTTP header
    metadata (User-Agent, header set and order, constant header values, byte volume) and flag outbound
    requests that match no learned benign fingerprint, per DECANTeR. A positive result is an outbound
    request whose header structure does not correspond to any profiled legitimate application on that
    host — a strong indicator of injected malware or a custom HTTP C2 agent; a negative result matches
    an established application profile. This positive-model approach supports the Detect tactic by catching
    unknown clients without needing prior knowledge of the specific malware. References: [DECANTeR](https://doi.org/10.1145/3134600.3134605).'
  answer_sources:
  - Zeek http.log
  - Proxy logs
  - Web server access logs
  - 'NAI: Internet gateways, web proxy chokepoints, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "profiles = learn_app_fingerprints(user_agent, header_set, header_order, const_headers, byte_volume)\
      \ by host\nfor t in http.log where is_external(t.id.resp_h):\n  if no_match(t, profiles[t.id.orig_h]):\n\
      \    alert('unknown outbound HTTP client', t)"
- question: Which hosts show HTTP feature distributions that break from rolling baselines — request/response
    byte ratios, transaction depth, URI length, content-type mix — for example > 99th percentile request
    size paired with tiny responses indicating upload/exfil?
  context: 'Detection objective: surface anomalous HTTP volume/shape relative to a learned per-role baseline.
    Maintain rolling baselines of request/response byte ratios, transaction depth, URI length, and content-type
    mix by host role, and flag percentile-level outliers (e.g., > 99th percentile request size with tiny
    responses, indicating exfiltration or upload), following RITA and the per-flow temporal features of
    the Single Flow Time Series research. A positive result is a host whose HTTP shape diverges sharply
    from peers in its role, such as large uploads to an external endpoint; a negative result tracks the
    baseline. This statistical layer helps the Detect tactic spot exfiltration and dead-drop polling that
    signature matching alone would miss. References: [RITA](https://github.com/activecm/rita); [Single
    Flow Time Series](https://dl.acm.org/doi/abs/10.5555/3581644.3581681).'
  answer_sources:
  - Zeek http.log
  - Proxy logs
  - Web server access logs
  - 'NAI: Internet gateways, web proxy chokepoints, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling(req_resp_byte_ratio, txn_depth, uri_len, content_type_mix) by host_role\n\
      for host over window:\n  if host.req_bytes > p99(baseline) and host.resp_bytes small:\n    alert('large\
      \ upload / exfil', host)\n  if outlier(host, baseline):\n    alert('HTTP feature outlier', host)"
- question: Which hosts show sudden spikes in their HTTP 4xx/5xx failure ratio or status-code distribution
    over a sliding window (a change-point break), indicating scanning, brute-forcing, or dead-drop polling?
  context: 'Detection objective: use HTTP failure rates as an independent signal of malicious activity.
    Track per-host 4xx/5xx ratio and status-code distribution over a sliding window and alert on sudden
    spikes detected via change-point methods per Aminikhanghahi and Cook. A burst of 404s can indicate
    content discovery/scanning, a burst of 401/403 can indicate brute-forcing, and repeated polling of
    a missing resource can indicate dead-drop C2 checking for tasking. A positive result is an abrupt
    rise in failure ratio above the host''s baseline; a negative result is a stable status mix. This failure-mode
    signal complements success-oriented HTTP metrics and broadens Detect-tactic coverage. References:
    [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek http.log
  - Proxy logs
  - Web server access logs
  - 'NAI: Internet gateways, web proxy chokepoints, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "by host over sliding_window:\n  fail_ratio = count(status in 4xx,5xx)/count(*)\n  if change_point(fail_ratio):\n\
      \    alert('HTTP failure spike (scan/brute/deaddrop)', host)"
- question: Which HTTP transactions score highest from an autoencoder/ensemble anomaly model trained on
    engineered http.log metadata features, and what are the top-3 contributing features for each high-scoring
    transaction?
  context: 'Detection objective: prioritize the most anomalous HTTP transactions using multivariate ML.
    Train an autoencoder or ensemble anomaly model on engineered http.log metadata features and prioritize
    high-anomaly-score transactions, per Kitsune, reporting the top-3 contributing features in alert text
    via SHAP-in-IDS. A positive result is a transaction whose combined metadata vector is far from learned
    normal even when each feature is individually unremarkable; a negative result lies within the normal
    manifold. This ML layer completes the Detect-tactic coverage for HTTP by catching subtle combinations
    of header, volume, and timing anomalies, with feature attribution to speed analyst triage. References:
    [Kitsune](https://arxiv.org/abs/1802.09089); [SHAP in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek http.log
  - Proxy logs
  - Web server access logs
  - 'NAI: Internet gateways, web proxy chokepoints, server farm egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = engineer(http.log metadata)\nscore = autoencoder_or_ensemble.score(feats)\nif score\
      \ > threshold:\n  alert('anomalous HTTP transaction', t, top3=shap(feats))"
- question: Are there clusters of sessions sharing metadata (source, destination, destination port, size)
    that exceed a configured instance threshold or violate explicit policy — for example more than 10
    identical requests to one external port, or traffic on prohibited ports?
  context: 'Detection objective: catch automated/repetitive communication and policy-violating flows via
    clustering and thresholds. Cluster sessions by shared metadata (source, destination, destination port,
    size) and alarm when a cluster exceeds a configured instance threshold or violates explicit policy
    (e.g., > 10 identical requests to a single external port, or traffic on prohibited ports), per the
    Vectra metadata-vectors patent. A positive result is a tight cluster of repeated identical sessions
    to one destination — typical of automated payload delivery or beaconing — or a flow on a banned port;
