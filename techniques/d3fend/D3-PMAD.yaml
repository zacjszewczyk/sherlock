name: 'D3-PMAD: Protocol Metadata Anomaly Detection'
id: c828b8bb-cc23-4b11-9614-5ddf4e947e6f
description: 'Investigate anomalies in network protocol metadata to surface unauthorized activity that
  hides inside otherwise normal-looking traffic. This playbook helps an analyst hunt for command-and-control,
  tunneling, exfiltration, staging, and scanning by examining metadata from four protocol layers without
  relying on payload decryption: TLS handshake metadata (JA3/JA4 fingerprints, protocol versions, cipher
  suites, certificate features, SNI/destination consistency); DNS request shapes (query length and entropy,
  record-type mix, unique-subdomain rate, NXDOMAIN failure rates); HTTP transaction metadata (User-Agent
  and header sets, method-header combinations, byte ratios, 4xx/5xx rates); and transport/flow metadata
  (beaconing cadence, byte volume and ratios, port usage, rare external destinations, connection-failure
  states). For each layer it combines deterministic symbolic-logic matching against malicious/policy indicator
  sets, statistical baselining and change-point/percentile outlier detection, and unsupervised machine-learning
  scoring (autoencoders, Isolation Forest) with feature attribution, so the analyst can distinguish benign
  protocol variance from a sophisticated adversary abusing standard protocols for covert communication.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
