name: 'D3-CQ: Content Quarantine'
id: bdd95f09-abe8-4de7-8216-e5dd75e87166
description: Assess the effectiveness and coverage of inbound-file content quarantine controls (CDR, AV/EDR
  quarantine, gateway content filtering). This playbook helps an analyst confirm that files violating
  policy are actually transferred to quarantine, and — more importantly — hunt for the gaps where they
  are not. It correlates network file carving (Zeek files.log) with endpoint quarantine and disarm events
  to confirm controls fired against known-bad content, applies deterministic structural/entropy/active-content
  screens to find files that SHOULD have been quarantined but were not, watches for MOTW-bypassing containers
  and inspection failure modes (encrypted archives, scan errors, oversize skips), profiles per-file-type
  quarantine-rate divergence, and chains un-quarantined downloads to subsequent process execution to surface
  real control failures and quarantine-evasion campaigns.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: When a file whose hash matches a malicious threat-intelligence indicator was delivered into
    the environment, did a corresponding quarantine (Windows Defender Event ID 1117) or Content Disarm
    and Reconstruction (CDR) disarm event actually fire on the destination host or gateway?
  context: 'This is the primary confirmation that the Isolate control worked: a known-bad file should
    never reach a host without a quarantine or disarm record. Correlate file hashes carved from Zeek files.log
    against a threat-intel feed of malicious hashes. A match accompanied by a Defender 1117 quarantine
    on the destination endpoint OR a gateway CDR disarm event confirms a successful, deterministic quarantine/sanitization.
    A known-bad hash delivered with NO 1117 and NO CDR event is a confirmed coverage gap requiring immediate
    triage of that delivery path. Faithful to the source symbolic-logic method. References: [Method For
    Content Disarm and Reconstruction](https://patentimages.storage.googleapis.com/a9/40/78/713c8deb2c4c7a/US20190268352A1.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek notice.log
  - Microsoft-Windows-Windows Defender/Operational Event ID 1117
  - Email/Web Gateway CDR logs
  - Windows Security Event ID 4663
  - 'NAI: Email Gateway, Web Proxy/Gateway, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'files = Zeek.files.log

      bad = files WHERE sha256 IN ThreatIntel.malicious_hashes

      q = WinDefender(EventID=1117) OR Gateway.CDR_disarm

      ALERT bad WHERE NOT EXISTS (q ON host==dest_host AND hash==file_hash)

      // match present + quarantine = confirmed control; match present + no quarantine = coverage gap'
- question: Independent of any hash reputation, were files exhibiting deterministic policy-violating traits
    — high Shannon entropy (>7.2 packing/encryption), abnormal PE structure, or embedded active script
    content (Office macros, JS in HTML/SVG/PDF) — delivered WITHOUT a quarantine or CDR disarm event?
  context: 'Hash-based confirmation misses novel/repacked malware, so this screen applies deterministic
    rules to every carved file regardless of reputation. Score section/file Shannon entropy (>7.2 indicates
    packing/encryption), inspect PE structure for non-standard section names, section-count outliers,
    virtual/raw size mismatches and sparse import tables, and detect active script via AST signatures.
    Any file matching these high-risk rules that lacks a quarantine (Defender 1117) or CDR disarm event
    is a deterministic policy gap — content that should have been isolated but was allowed through. Faithful
    to the source symbolic-logic method. References: [Using Entropy Analysis to Find Encrypted and Packed
    Malware](https://ieeexplore.ieee.org/document/4140989), [PE-Probe](https://web.cs.ucdavis.edu/~zubair/files/vb09-zubair.pdf),
    [EMBER](https://arxiv.org/abs/1804.04637), [ZOZZLE](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Curtsinger.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek notice.log
  - Microsoft-Windows-Windows Defender/Operational Event ID 1117
  - Email/Web Gateway CDR logs
  - Windows Security Event ID 4663
  - 'NAI: Email Gateway, Web Proxy/Gateway, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for f in Zeek.files.log:\n  risky = (entropy(f) > 7.2)\n       OR abnormal_PE(f)   // odd\
      \ section names, count outliers, vsize!=rawsize, sparse imports\n       OR active_script(f) // Office\
      \ macro, JS in HTML/SVG/PDF (AST signatures)\n  if risky AND NOT (WinDefender(1117, f) OR Gateway.CDR_disarm(f)):\n\
      \    ALERT 'deterministic policy gap'"
- question: Did an inbound opaque container file (.iso/.img/.vhd) reach an endpoint and get mounted (Windows
    Security Event ID 4663 on \Device\CdRom*) without any prior gateway CDR/quarantine record for it or
    its contents?
  context: 'Containers strip the Mark-of-the-Web from the files inside them and routinely bypass gateway
    content inspection and quarantine. Flag inbound .iso/.img/.vhd files that reach an endpoint and are
    mounted (Security Event ID 4663 targeting \Device\CdRom*). A mounted inbound container with no preceding
    CDR or quarantine record indicates the inspection layer passed an un-scanned payload — an isolation
    bypass that frequently precedes execution of MOTW-evading malware. Faithful to the source symbolic-logic
    tripwire. References: [ISO Image Mounted, Sigma](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_iso_mount.yml).'
  answer_sources:
  - Zeek files.log
  - Zeek notice.log
  - Microsoft-Windows-Windows Defender/Operational Event ID 1117
  - Email/Web Gateway CDR logs
  - Windows Security Event ID 4663
  - 'NAI: Email Gateway, Web Proxy/Gateway, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "containers = Zeek.files.log WHERE mime IN ('iso','img','vhd') AND direction=inbound\nmounts\
      \ = WinSecurity(EventID=4663) WHERE object LIKE '\\\\Device\\\\CdRom*'\nALERT mounts JOIN containers\
      \ ON host\n  WHERE NOT EXISTS Gateway.CDR_or_quarantine(container)"
- question: Does the distribution of file types that are quarantined diverge significantly from the distribution
    of file types actually transferred — for example a high quarantine rate for executables but a near-zero
    rate for macro-bearing Office documents?
  context: 'A coverage gap often hides not in absolute counts but in the SHAPE of what gets quarantined
    versus what flows in. For each mime_type from Zeek files.log compute Volume (total bytes), Frequency
    (files/min) and State (quarantine rate = files quarantined via Defender 1117 or Zeek notice.log divided
    by files transferred). Compare the quarantined-type distribution against the transferred-type distribution
    (e.g., KL divergence). A high executable quarantine rate alongside a near-zero rate for Office documents
    that carry macros is a significant divergence exposing a policy-coverage gap. Derive per-type rate
    floors from a 30-day baseline of your own traffic. Faithful to the source statistical method. References:
    [EMBER](https://arxiv.org/abs/1804.04637), [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Zeek files.log
  - Zeek notice.log
  - Microsoft-Windows-Windows Defender/Operational Event ID 1117
  - Email/Web Gateway CDR logs
  - Windows Security Event ID 4663
  - 'NAI: Email Gateway, Web Proxy/Gateway, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per_type = STATS by mime_type: bytes=sum(len), freq=count/min,\n           q_rate = count(quarantine)/count(transferred)\n\
      transferred_dist = normalize(count by mime_type)\nquarantined_dist = normalize(quarantine_count\
      \ by mime_type)\nALERT WHERE KL(quarantined_dist || transferred_dist) > threshold\n   OR q_rate[type]\
      \ < baseline_floor_30d[type]"
- question: Are inspection FAILURE rates — scan errors/timeouts, encrypted/password-protected archives
    that cannot be inspected, and oversize-skip events — rising per mime_type, meaning files are passing
    un-inspected so quarantine cannot apply?
  context: 'Quarantine can only act on what gets inspected; inspection failures are therefore silent coverage
    holes, not benign noise. Profile, as distinct signals per mime_type, the scan-error/timeout rate,
    the encrypted/password-protected-archive rate (inspection-impossible), and the oversize-skip rate.
    A rising encrypted-archive or scan-error rate means files are flowing past inspection. Alert when
    any failure-class rate exceeds its baseline mean + 3 sigma, and pair with per-file entropy outliers
    scored as unlabeled anomalies via Extended Isolation Forest. Faithful to the source statistical method.
    References: [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989),
    [Extended Isolation Forest](https://arxiv.org/pdf/1811.02141).'
  answer_sources:
  - Zeek files.log
  - Zeek notice.log
  - Microsoft-Windows-Windows Defender/Operational Event ID 1117
  - Email/Web Gateway CDR logs
  - Windows Security Event ID 4663
  - 'NAI: Email Gateway, Web Proxy/Gateway, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for type in mime_types:\n  scan_err = rate(scan_error|timeout)\n  enc_arch = rate(encrypted_or_password_archive)\n\
      \  oversize = rate(oversize_skip)\n  for r in (scan_err, enc_arch, oversize):\n    if r > baseline_mean[type]\
      \ + 3*baseline_std[type]: ALERT\nExtendedIsolationForest(per_file_entropy_features) -> flag anomalies"
- question: Among files that were NOT quarantined, which ones does a static malware classifier (EMBER/LightGBM
    or raw-byte CNN) and a one-class benign model predict to be high-risk, and what are the top-3 explanatory
    features behind each prediction?
  context: 'To prioritize policy tuning, train a static classifier (LightGBM/XGBoost/Random Forest on
    EMBER parse-only features, or a raw-byte CNN) on carved files labeled quarantined/not-quarantined
    from endpoint and gateway logs, then score newly observed NON-quarantined files to surface high-probability-malicious
    ones into a prioritized policy-tuning queue. Run a train-on-benign one-class model (Isolation Forest/autoencoder/OC-SVM)
    in parallel to catch structurally anomalous files without labels. Every alert MUST surface the top-3
    contributing features (section entropy, suspicious imports, mime-type/source-ASN rarity) via SHAP/LIME,
    not a bare score. Keep the deterministic entropy/structural floors as a parallel layer because byte-level
    ML is evadable by overlay/slack padding. Faithful to the source ML method. References: [EMBER](https://arxiv.org/abs/1804.04637),
    [Malware Detection by Eating a Whole EXE](https://arxiv.org/pdf/1710.09435), [Malware Detection for
    IoT Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/), [Explainable
    AI (XAI) for Malware Analysis: A Survey](https://arxiv.org/html/2409.13723v2), [SHAP Integration in
    IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full),
    [Adversarial EXEmples](https://arxiv.org/pdf/2008.07125).'
  answer_sources:
  - Zeek files.log
  - Zeek notice.log
  - Microsoft-Windows-Windows Defender/Operational Event ID 1117
  - Email/Web Gateway CDR logs
  - Windows Security Event ID 4663
  - 'NAI: Email Gateway, Web Proxy/Gateway, User Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = EMBER_parse_only_features(carved_files)

      clf = LightGBM.fit(X_train, y=quarantined?)

      oc = IsolationForest.fit(X_benign)

      cand = files WHERE not_quarantined AND (clf.proba_mal > t OR oc.anomaly)

      for a in cand: a.explain = SHAP.top3(clf, a)

      emit prioritized_policy_tuning_queue(cand sorted by proba)'
- question: Did a newly created process (Windows Event ID 4688 / Sysmon EID 1) execute an image whose
    filename matches a file recently downloaded (within 5 minutes) from a blocklisted domain, with NO
    corresponding quarantine or CDR disarm event?
  context: 'This is the clearest evidence of a quarantine failure: a network-delivered file from a known-bad
    source was written to disk and executed without being isolated. Join Windows Event ID 4688 / Sysmon
    EID 1 against Zeek files.log on endpoint IP within a short window (<5 minutes), flagging a new process
    whose image name matches a file downloaded from a blocklisted domain with no Defender 1117 or CDR
    disarm event. Strengthen with Sysmon EID 11 (FileCreate) to confirm the network file was written to
    disk and then executed. This deterministic network-write -> execute chain with no quarantine confirms
    a control failure for a known-bad source. Faithful to the source symbolic-logic method. References:
    [EMBER](https://arxiv.org/abs/1804.04637).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User Endpoints, Internal Servers'
  range: Last 90 days; correlate process events within 5 minutes of the download
  queries:
  - technology: SIEM/Rule pseudocode
    query: "dl = Zeek.files.log WHERE domain IN blocklist\nproc = Win(4688) OR Sysmon(1)\nwrite = Sysmon(11)\n\
      ALERT proc JOIN dl ON host AND image_name==dl.filename AND |proc.t - dl.t| < 5m\n  AND EXISTS write(dl.filename)\n\
      \  AND NOT (WinDefender(1117, dl) OR Gateway.CDR_disarm(dl))"
- question: Is a statistically rare process (enterprise prevalence <1%) being executed from an image that
    corresponds to a recently downloaded file for which no quarantine event exists?
  context: 'Quarantine evasion often manifests as the execution of an unusual binary that just arrived
    over the network. For all process creations (Event ID 4688) compute enterprise prevalence; for rare
    process names (prevalence <1%) check whether the image corresponds to a file recently downloaded (Zeek
    files.log) and whether a quarantine event exists. Track Volume (download bytes), Frequency (executions/min)
    and State (quarantined vs not). A statistically rare execution of a freshly-downloaded, NON-quarantined
    file is a suspected quarantine evasion; score per-host feature vectors as unlabeled outliers via Extended
    Isolation Forest. Faithful to the source statistical method. References: [Extended Isolation Forest](https://arxiv.org/pdf/1811.02141).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User Endpoints, Internal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prev = prevalence(process_name) over enterprise\nrare = Win(4688) WHERE prev < 0.01\nALERT\
      \ rare WHERE image MATCHES recent Zeek.files.log download\n  AND NOT EXISTS quarantine(file)\nExtendedIsolationForest(per_host_feature_vectors)\
      \ -> outliers"
- question: For carved executables that reached an endpoint without quarantine, are appended-overlay byte
    volume, inter-section slack byte count, or the entropy of those regions abnormally large — the documented
    surfaces adversaries pad to evade ML quarantine?
  context: 'Adversaries pad overlays and inter-section slack to evade byte-level ML detection while preserving
    functionality, so these regions are a distinct failure-mode signal. For carved executables that reached
    an endpoint without quarantine, measure appended-overlay byte volume, inter-section slack byte count,
    and the entropy of those regions as separate signals. Alert when overlay size or slack volume exceeds
    the per-file-type baseline mean + 3 sigma, even when the byte-level classifier score looks benign.
    This catches evasive payloads that slipped through ML-based quarantine. Faithful to the source statistical
    method. References: [Exploring Adversarial Examples in Malware Detection](https://arxiv.org/pdf/1810.08280),
    [Adversarial EXEmples](https://arxiv.org/pdf/2008.07125).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User Endpoints, Internal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for exe in carved_executables WHERE not_quarantined:\n  ov = overlay_bytes(exe); sl = sum(section_slack_bytes(exe));\
      \ en = entropy(ov, sl)\n  if ov > base_mean[type]+3*base_std[type] OR sl > base_mean[type]+3*base_std[type]:\n\
      \    ALERT 'overlay/slack padding evasion'  // even if byte-score benign"
- question: Is there a temporal correlation between a spike in downloads of a given file type (.zip/.js/.iso)
    and a subsequent spike in anomalous process creations (e.g., long PowerShell command lines), or post-delivery
    API-call sequences (decode->allocate->write->execute), indicating a campaign bypassing quarantine?
  context: 'Campaigns that bypass quarantine show up as coordinated behavior over time, not single events.
    Apply a time-series model to the volume of downloads (Zeek files.log grouped by extension) and the
    volume of anomalous process creations (e.g., PowerShell command-line length above baseline, Event
    ID 4688); a download spike of .zip/.js/.iso temporally correlated with a subsequent anomalous-process
    spike indicates a quarantine-bypassing campaign. In parallel classify post-delivery API-call sequences
    (decode->allocate->write->execute) to catch payloads that unpack at runtime after evading quarantine,
    and apply a train-on-benign one-class detector to host process feature vectors. Alerts MUST list the
    top-3 contributing features via SHAP/LIME. Faithful to the source ML method. References: [Comprehensive
    evaluation of Mal-API-2019](https://arxiv.org/abs/2403.02232), [Malware Detection for IoT Using One-Class
    Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/), [Explainable AI (XAI) for Malware
    Analysis: A Survey](https://arxiv.org/html/2409.13723v2), [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User Endpoints, Internal Servers'
  range: Last 90 days; event-centered correlation across the campaign window
  queries:
  - technology: ML/pseudocode
    query: 'ts_dl = timeseries(count(Zeek.files.log) by extension)

      ts_proc = timeseries(count(anomalous Win(4688), e.g. long PS cmdline))

      ALERT WHERE spike(ts_dl[ext]) precedes spike(ts_proc) within window

      apiseq_clf.predict(decode->allocate->write->execute)

      OneClass(host_proc_features) -> anomalies; each alert.explain = SHAP.top3'
