name: 'D3-DKP: Disk Partitioning'
id: 699a376c-ddca-4c08-b028-1c8ac3aedc9e
description: Investigate the use of Disk Partitioning as a defensive control to isolate and evict an adversary
  from a compromised host. This playbook helps an analyst verify that partition-layout changes were authorized,
  executed as intended for containment, and that post-action partition behavior aligns with eviction objectives.
  It guides detection of unauthorized disk-subsystem tampering, partition-baseline drift, and incomplete
  eviction using first-party Windows telemetry (partmgr/VDS/disk events, PowerShell Storage module, process-creation
  and RawAccessRead events), combining deterministic symbolic-logic rules, statistical Volume/Frequency/State
  and failure-rate profiling, change-point detection, and explainable machine-learning models. The goal
  is to confirm containment completion, surface residual adversary artifacts that survive incomplete re-partition/format,
  and detect destructive bulk writes or persistence on partitions expected to be quiesced.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are partition-management events (partmgr/VDS/disk) and PowerShell Storage-module logging present
    on all critical assets, and do they correlate with authorized disk-management command executions during
    the change window?
  context: 'For the Evict tactic, missing telemetry is itself a control failure: if a Domain Controller
    or Database Server produces zero partition-management events during an authorized containment change
    window, you cannot prove the eviction occurred or that unauthorized tampering did not happen in the
    blind spot. Confirm partmgr/VDS/disk partition events and Get-Partition/Storage-module logging are
    being generated on critical assets, and correlate them with disk-management binaries (diskpart/diskmgmt/fsutil)
    visible in Sysmon Event ID 1 or Windows Event ID 4688. A positive result (telemetry present and correlated)
    gives confidence the containment action is observable; a negative result (zero telemetry on a critical
    asset during the change window) must be alerted and treated as a logging/control gap per [Guide to
    Computer Security Log Management (NIST SP 800-92)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf),
    and confirm process-creation telemetry from [Sysmon](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon)
    is available on the asset.'
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "critical = assets WHERE role IN (DomainController, DatabaseServer)\nFOR each host IN critical:\n\
      \  telem = COUNT(events WHERE source IN (partmgr, VDS, disk, PowerShell/Storage)\n             \
      \   AND host=host AND time IN change_window)\n  cmds  = COUNT(EventID IN (4688, Sysmon:1) WHERE\
      \ Image IN (diskpart.exe, diskmgmt.msc, fsutil.exe))\n  IF telem == 0 OR (cmds > 0 AND telem ==\
      \ 0): ALERT 'partition telemetry gap on critical asset'"
- question: Was any disk-subsystem binary (diskpart.exe, fsutil.exe, diskshadow.exe, format.com, bcdedit.exe)
    or raw volume/partition-table access executed outside the approved change window or by an unexpected
    parent process?
  context: Adversaries and incomplete evictions both manifest as disk-management command execution. During
    Evict, you want to confirm that the only disk-subsystem activity corresponds to the authorized containment
    action and that no rogue tampering occurred. Match process-creation telemetry (Sysmon Event ID 1 /
    Windows Event ID 4688) for diskpart.exe, fsutil.exe, diskshadow.exe, format.com, and bcdedit.exe,
    and raw volume/partition-table access via Sysmon Event ID 9 (RawAccessRead). Apply the SigmaHQ rules
    [Fsutil Drive Enumeration, SCYTHE](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_fsutil_drive_enumeration.yml),
    [Diskshadow Script Mode, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules-threat-hunting/windows/process_creation/proc_creation_win_diskshadow_script_mode.yml),
    and [Boot Configuration Tampering Via Bcdedit, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml).
    A positive match outside the change window, or with a non-administrative/unexpected parent (e.g.,
    a browser or office process spawning diskpart), indicates adversary action or unsanctioned change
    and should alert.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "disk_bins = [diskpart.exe, fsutil.exe, diskshadow.exe, format.com, bcdedit.exe]\nproc = EventID\
      \ IN (4688, Sysmon:1) WHERE Image IN disk_bins\nraw  = Sysmon EventID 9 (RawAccessRead) WHERE Device\
      \ LIKE '\\\\\\\\.\\\\PhysicalDrive*' OR '\\\\\\\\.\\\\C:'\nALERT WHEN (proc OR raw)\n  AND ( time\
      \ NOT IN approved_change_window\n        OR ParentImage NOT IN (cmd.exe, powershell.exe, mmc.exe,\
      \ services.exe)\n        OR User NOT IN authorized_admins )"
- question: Does the current partition layout of each host match its approved per-role baseline, and are
    any deviations backed by an approved change record?
  context: Containment via Disk Partitioning produces an intended, documented end-state. Drift from the
    approved per-role baseline without a matching change ticket signals either an unauthorized adversary
    change or an eviction that did not land as planned. Run standardized [Get-Partition](https://learn.microsoft.com/en-us/powershell/module/storage/get-partition)
    snapshots capturing DriveLetter, Offset, Size, Type, GptType, IsActive, and IsHidden, normalize and
    hash the output, and compare each host's hash to the approved baseline for its role. A deviation with
    no corresponding approved change record (per [Guide for Security-Focused Configuration Management
    (NIST SP 800-128)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf) secure-baseline
    change control) should alert. A hidden or newly active partition is especially noteworthy as a potential
    adversary hiding place.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host:\n  snap = Get-Partition | select DriveLetter,Offset,Size,Type,GptType,IsActive,IsHidden\n\
      \  h = SHA256(normalize(snap))\n  IF h != approved_baseline_hash[host.role]\n     AND NOT exists(change_record\
      \ WHERE host=host AND time recent):\n       ALERT 'partition layout drift vs approved baseline',\
      \ detail=diff(snap, baseline)"
- question: Was each eviction/containment partition action reconciled against the documented containment
    plan and change ticket, and was residual-artifact removal explicitly verified before return-to-service?
  context: 'The core of the Evict tactic is proving the adversary is gone. Residual adversary artifacts
    can survive an incomplete re-partition or format ([Remembrance of Data Passed, Garfinkel & Shelat](https://ieeexplore.ieee.org/document/1176998)),
    so removal must be verified, not assumed. Reconcile the executed partition/isolation action against
    the documented containment plan and change ticket per [Computer Security Incident Handling Guide (NIST
    SP 800-61r2)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf), confirming
    the intended isolation state is reached before the host returns to service. Any host returned to service
    without a verification record should be flagged. A positive result is a closed loop: plan, execution,
    and verified end-state all agree; a negative result is a host back in production with no proof of
    clean state.'
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each containment_action:\n  plan_ok   = action MATCHES documented_containment_plan\n \
      \ ticket_ok = exists(change_ticket FOR action)\n  verify_ok = exists(verification_record WHERE residual_check=PASS)\n\
      \  IF host.returned_to_service AND NOT (plan_ok AND ticket_ok AND verify_ok):\n     ALERT 'host\
      \ returned to service without verified eviction'"
- question: Across each role cohort, which partition-layout hashes are statistically rare or newly emergent,
    and which hosts exceed the role-mean rate of disk-management events?
  context: Beyond exact baseline matching, statistical prevalence reveals subtle drift and tampering.
    Within a role cohort, an approved layout hash should be common; a rare or brand-new layout hash, or
    a host generating disk-management events far above the cohort norm, suggests unauthorized change or
    an adversary fighting containment. Monitor prevalence of each partition-layout hash across role cohorts
    and the per-host rate of disk-management events using standard-deviation thresholds (e.g., >3 sigma
    above the role mean) per [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer
    & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf), deriving thresholds
    from a 30-day rolling baseline. Flag statistically rare/emergent layouts and rate outliers for review.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = 30d rolling per role\nFOR each role cohort:\n  prevalence[hash] = COUNT(hosts WITH\
      \ hash) / COUNT(hosts in role)\n  mean,std = stats(disk_mgmt_events_per_host)\nFOR each host:\n\
      \  IF prevalence[host.hash] < rare_threshold OR host.hash is new:\n     FLAG 'rare/emergent partition\
      \ layout'\n  IF host.disk_mgmt_rate > mean + 3*std: FLAG 'disk-mgmt event-rate outlier'"
- question: After the containment action, do per-partition Volume (write/read bytes/min), Frequency (IOPS,
    file-write events/min), and State (write success vs failure) metrics deviate from a partition that
    should be isolated/quiesced?
  context: A successfully isolated or quiesced partition should be quiet. Sustained post-action I/O inconsistent
    with that expectation indicates the eviction failed or an adversary is still active. Establish expected
    per-partition Volume, Frequency, and State using rolling windows, then alert on sustained post-action
    deviation ([Guide to IDPS (NIST SP 800-94)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf)
    anomaly profiling). Use concrete destructive-write thresholds such as sustained high write-rate and
    high write-entropy ([RWGuard, Mehnaz et al.](https://link.springer.com/chapter/10.1007/978-3-030-00470-5_5)
    and [ShieldFS, Continella et al.](https://dl.acm.org/doi/10.1145/2991079.2991110)) to catch wiping;
    tune per environment but do not remove the threshold. High write-entropy plus high write-rate on a
    supposedly quiesced partition is a strong destructive-activity signal.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days; center on the containment action timestamp and analyze the post-action window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each partition POST containment:\n  vol  = rolling(write_bytes_min, read_bytes_min)\n\
      \  freq = rolling(IOPS, file_write_events_min)\n  state= rolling(write_success, write_fail)\n  expected\
      \ = quiesced_baseline[partition]\n  IF sustained(vol > expected*k) OR sustained(write_entropy >\
      \ 0.9 AND write_rate high):\n     ALERT 'active I/O / possible wipe on partition expected quiesced'"
- question: Does online change-point detection on per-partition I/O time series reveal a regime change
    (renewed write activity) after the eviction on a partition expected to remain quiesced?
  context: Threshold alarms can miss gradual or delayed re-activation. Change-point detection finds the
    moment a time series shifts regime. Apply online change-point detection (CUSUM/PELT/Bayesian online,
    per [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/))
    to per-partition I/O time series. An unexpected post-eviction regime change, such as renewed write
    activity on a partition expected to be quiesced, indicates persistence or incomplete isolation. A
    detected change-point shortly after return-to-service is a high-value signal that the adversary survived
    containment.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days; evaluate the time series spanning before and after the containment action
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ts = per_partition_io_series(write_bytes_min)\ncps = CUSUM_or_PELT(ts)\nFOR cp IN cps:\n \
      \ IF cp.time > eviction_time AND partition.expected_state == quiesced\n     AND cp.direction ==\
      \ increase:\n       ALERT 'post-eviction I/O regime change: possible persistence'"
- question: Is there a spike in failed disk-management operations (failed format/partition ops, access-denied
    on volume/disk handles, RawAccessRead failures) per host or role?
  context: Failures are signals in their own right. An adversary probing or fighting containment may generate
    many failed disk-management attempts even when no successful change lands. Treat failed format/partition
    operations, access-denied results on volume/disk handles, and RawAccessRead failures (Sysmon Event
    ID 9) as distinct events and baseline their rate per host/role ([Guide to IDPS (NIST SP 800-94)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-94.pdf)).
    A spike above the baseline indicates an actor attempting unauthorized disk changes or an automated
    retry loop; investigate the source process and account. A positive result warrants escalation even
    absent a successful partition change.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "fails = events WHERE (op IN (format, partition) AND result=FAIL)\n             OR (volume/disk\
      \ handle open result=ACCESS_DENIED)\n             OR (Sysmon EventID 9 result=FAIL)\nrate = COUNT(fails)\
      \ per host per hour\nmean,std = baseline(rate per role)\nIF rate > mean + 3*std: ALERT 'disk-management\
      \ failure spike: possible containment probing'"
- question: Do unsupervised per-host disk-management feature vectors score as rare outliers, and what
    are the top contributing features driving each anomaly?
  context: Deterministic rules miss novel behavior; an explainable unsupervised model adds coverage. Train
    an [Isolation Forest, Liu et al.](https://ieeexplore.ieee.org/document/4781136) on per-host feature
    vectors (disk-mgmt events/hr, write bytes/min, partition-count delta, RawAccessRead count, fail-count)
    to score rare behavior in linear time, and surface the top-3 contributing features via path-length
    attribution in the alert text rather than just a bare score. Isolation Forest is validated as a strong
    low-latency unsupervised baseline by [Isolation Forest vs. Autoencoders, Ramaswamy & Palanisamy](https://ieeexplore.ieee.org/document/10143005/).
    Run this in parallel to the deterministic rules, not as a replacement. For Evict, a host scoring as
    an outlier with high RawAccessRead and partition-count delta is a candidate for unauthorized tampering
    or failed containment; the explainability makes the alert actionable for the analyst.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = per_host_features[disk_mgmt_per_hr, write_bytes_min, partition_count_delta,\n        \
      \               rawaccessread_count, fail_count]\nmodel = IsolationForest().fit(X_baseline)\nscore\
      \ = model.decision_function(X)\ntop3  = path_length_attribution(model, x)  # explainability\nIF\
      \ score < anomaly_cutoff: ALERT 'rare disk-mgmt behavior', features=top3"
- question: Does the observed sequence of disk/partition-management log events fall outside the top-g
    predicted next events from a learned model of normal sequences?
  context: 'Order matters: tampering and incomplete eviction often appear as out-of-pattern event sequences
    even when each individual event looks benign. Model the normal sequence of disk/partition-management
    log keys with the DeepLog LSTM approach ([DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015),
    [implementation](https://github.com/Thijsvanede/DeepLog)) and flag executions whose next event falls
    outside the top-g predicted candidates. For Evict, a sequence that diverges from the learned containment
    workflow (e.g., a format not followed by the expected verification steps, or unexpected interleaving
    of RawAccessRead) indicates out-of-pattern tampering or an eviction that did not follow procedure.'
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = ordered_log_keys(disk_partition_mgmt_events per host)\nmodel = DeepLog_LSTM.train(normal_sequences)\n\
      FOR k_t IN seq:\n  pred = model.predict_next(window before k_t)\n  IF k_t NOT IN top_g(pred): ALERT\
      \ 'out-of-pattern disk-mgmt sequence', event=k_t"
- question: Do the process/file provenance chains that culminate in disk-management activity originate
    from anomalous lineage, such as disk binaries spawned by unexpected ancestors?
  context: Legitimate disk-management has predictable provenance (admin tool -> shell -> diskpart). Adversary-driven
    partition changes often have anomalous lineage. Model host process/file provenance chains that end
    in disk-management activity with [MAGIC, Jia et al.](https://www.usenix.org/conference/usenixsecurity24/presentation/jia-zian)
    ([code](https://github.com/FDUDSDE/MAGIC)), which handles concept drift, to flag partition changes
    originating from unexpected ancestors (e.g., diskpart.exe spawned by a document viewer, script interpreter,
    or service implanted by the adversary). For Evict, this distinguishes authorized containment provenance
    from adversary-driven tampering and surfaces persistence mechanisms that drive disk activity.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = provenance_graph(process+file lineage -> disk_mgmt nodes)\nmodel = MAGIC.train(benign_graphs)\n\
      FOR node IN disk_mgmt_nodes:\n  s = model.anomaly_score(lineage(node))\n  IF s > cutoff: ALERT 'anomalous\
      \ provenance for partition change', chain=lineage(node)"
- question: Is post-eviction disk behavior benign, or do per-process I/O features indicate destructive
    bulk writes or an active wipe against partitions?
  context: Confirming benign post-eviction disk behavior is the validation step that closes out containment.
    An active wipe or destructive bulk write would corrupt evidence and signal ongoing adversary action.
    Apply the [ShieldFS, Continella et al.](https://dl.acm.org/doi/10.1145/2991079.2991110) per-process
    I/O random-forest design using folder-listing, read/write/rename frequency, and file-type write-entropy
    features to detect destructive bulk writes against partitions. A classification of destructive/ransomware-like
    behavior after the eviction means the disk is not safely quiesced; a benign classification supports
    return-to-service. Run alongside the statistical Volume/Frequency/State checks for corroboration.
  answer_sources:
  - Windows System Event Log (partmgr/VDS/disk)
  - Windows PowerShell (Get-Partition / Storage module)
  - Windows Security Event ID 4688 / Sysmon Event ID 1 (process create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Change-management / CMDB records
  - 'NAI: Critical servers (e.g., Domain Controllers, Database Servers) and standard employee workstations.'
  range: Last 90 days; focus on the window after the containment action
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = per_process[folder_listing_rate, read_freq, write_freq, rename_freq,\n            \
      \        file_type_write_entropy]\nclf = RandomForest_ShieldFS.train(benign_vs_destructive)\nFOR\
      \ proc touching partitions POST eviction:\n  IF clf.predict(feat[proc]) == DESTRUCTIVE:\n     ALERT\
      \ 'destructive bulk write / active wipe post-eviction', proc=proc"
