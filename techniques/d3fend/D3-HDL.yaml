name: 'D3-HDL: Homoglyph Denylisting'
id: 72801bb8-5f73-4552-b86e-f1b24be0752e
description: 'Investigate homoglyph and look-alike domain abuse used to phish users and host command-and-control
  (C2) infrastructure. This playbook helps an analyst detect DNS queries and web requests for visually
  deceptive domains: IDN homographs built from confusable Unicode characters, ASCII typosquats, and combosquats
  that imitate trusted organizational brands. It layers deterministic detection (denylist enforcement,
  Unicode-skeleton/confusable matching, Punycode/IDNA validation, and confusable-domain-to-unauthorized-IP
  correlation) with statistical scoring (edit distance, entropy/KL divergence, prevalence and dynamism
  features, burst and failure-rate analytics) and machine-learning visual-similarity and risk-classification
  models. The goal is to identify and isolate users from homoglyph-based phishing and C2 domains, especially
  when confusable names resolve to unauthorized or low-reputation infrastructure instead of expected destinations.'
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any internal hosts querying domains that exactly match a maintained denylist of known
    malicious homoglyph domains or generated typosquat/confusable variants of our critical organizational
    domains?
  context: 'This is the first, highest-confidence layer. Build and maintain a denylist that combines confirmed
    malicious homoglyph domains with proactively generated variants of your protected domains. Generate
    variants using the typosquatting taxonomy (omission, substitution, insertion, transposition, homophone,
    TLD swap) and confusable-character expansion, then validate each candidate with active DNS so only
    registered/resolving variants stay on the list (this keeps the list bounded and current). Any exact
    match between a queried name and a denylist entry is a strong indicator of phishing or C2 staging
    against your brand and warrants immediate isolation. A negative result simply means no listed variant
    was queried; it does not rule out novel look-alikes (covered by later questions). This supports the
    Isolate tactic by enabling deterministic blocking of users from known deceptive domains. References:
    [The Landscape of Domain Name Typosquatting](https://arxiv.org/abs/1603.02767), [ShamFinder/SimChar](https://arxiv.org/abs/1909.07539),
    and [Yazdani - Detection of Malicious IDN Homoglyph Domains Using Active DNS Measurements](http://essay.utwente.nl/79263/1/Yazdani_MA_EEMCS.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'load denylist = set(known_malicious_homoglyphs + generated_variants_of_protected_domains)

      from dns.log where query in denylist -> alert(severity=high, host=id.orig_h, domain=query)'
  - technology: SIEM/Rule pseudocode
    query: 'lookup dns_query against homoglyph_denylist

      where match -> raise_alert(''Denylisted homoglyph domain queried'', src_host, query)'
- question: For every queried domain label, does its Unicode confusable skeleton match a protected brand/organization
    label while its actual code points differ, or does it use mixed scripts or a disallowed Unicode restriction
    level?
  context: 'Per UTS #39, two strings are confusable if and only if their confusable skeletons are equal.
    Precompute the skeletons of your protected brand/org labels, then for each observed label compute
    its skeleton and exact-match it against that set. A skeleton match combined with differing code points
    means the queried name was crafted to look identical to a trusted brand but is a distinct domain -
    a high-fidelity homograph signal. Additionally flag labels that mix scripts (e.g., Latin + Cyrillic)
    or fail the Moderately/Highly Restrictive restriction levels, since legitimate brand domains rarely
    mix scripts. Treat confusable mixed-script labels as a distinct threat class. A positive result is
    strong evidence of a deliberate look-alike; investigate resolution and connection follow-through.
    This advances the Isolate tactic by detecting deceptive names even when never seen before. References:
    [UTS #39 - Unicode Security Mechanisms](https://www.unicode.org/reports/tr39/) and [Holgers et al.
    - Cutting Through the Confusion](https://www.usenix.org/legacy/event/usenix06/tech/full_papers/holgers/holgers.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "protected = {skeleton(b) for b in protected_brands}\nfor label in dns_query.labels:\n  sk\
      \ = uts39_skeleton(label)\n  if sk in protected and label not in protected_brands: alert('Confusable\
      \ skeleton match', label)\n  if mixed_script(label) or restriction_level(label) > moderate: alert('Mixed-script/disallowed\
      \ label', label)"
- question: Are there any DNS or proxy labels beginning with the Punycode ACE prefix 'xn--', and when
    decoded to their Unicode form do they contain disallowed scripts/code points or match a protected-brand
    skeleton?
  context: 'Any label starting with ''xn--'' is an internationalized A-label. Decode it to its U-label
    and validate against IDNA2008 permitted/disallowed/contextual code points before trusting it. This
    is the cheapest deterministic first-party IDN signal: surface all xn-- traffic for confusable and
    mixed-script evaluation, and alert when a decoded label contains disallowed scripts or matches a protected-brand
    skeleton. Because attackers register IDN homographs as Punycode, simply enumerating and decoding xn--
    traffic quickly reveals candidate homoglyph domains. A positive result (disallowed code points or
    a brand-skeleton match after decoding) is high-confidence; benign xn-- traffic to legitimate internationalized
    sites should be allowlisted. This supports Isolate by catching encoded IDN homographs at the resolver/proxy
    boundary. References: [Punycode (RFC 3492)](https://www.rfc-editor.org/rfc/rfc3492.txt) and [IDNA2008
    (RFC 5890)](https://www.rfc-editor.org/rfc/rfc5890.txt).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from dns.log where query startswith 'xn--' or any_label startswith 'xn--':\n  u = punycode_decode(label);\
      \ validate_idna2008(u)\n  if has_disallowed_scripts(u) or uts39_skeleton(u) in protected_skeletons:\
      \ alert('IDN homograph', query, u)"
  - technology: SIEM/Rule pseudocode
    query: "where dns_query like 'xn--%' -> decode_punycode -> validate_idna\n  if disallowed or skeleton_match(protected)\
      \ -> alert('Punycode homograph', src_host, dns_query)"
- question: When a near-match or skeleton-matched confusable domain is observed, do its resolved IPs or
    actual connections go to unauthorized infrastructure (newly-seen ASN, low-reputation hosting) rather
    than approved destination ranges?
  context: 'For domains already flagged as near-matches or skeleton matches, correlate the DNS answer
    and subsequent connection (Zeek conn.log) against your approved destination ranges. The highest-fidelity
    signal of live homograph C2 or phishing is a confusable name that actually resolves or connects to
    unauthorized infrastructure - especially a newly-seen ASN or low-reputation hosting provider rather
    than your real CDN/brand ranges. A positive result means the deceptive domain is operational and being
    used, which justifies immediate isolation of the affected host. A negative result (resolves to expected/benign
    ranges) lowers priority. This is central to the Isolate tactic because it confirms the user is actually
    being directed to attacker-controlled infrastructure. References: [Yazdani - Detection of Malicious
    IDN Homoglyph Domains Using Active DNS Measurements](http://essay.utwente.nl/79263/1/Yazdani_MA_EEMCS.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join dns.log (confusable_flagged) with conn.log on answer_ip\nwhere resolved_ip not in approved_ranges\
      \ and (asn in newly_seen_asns or hosting_reputation == low):\n  alert(severity=high, host=id.orig_h,\
      \ domain=query, ip=resolved_ip, asn=asn)"
- question: Which observed domains are within an edit distance of 1-2 of a trusted domain, have anomalous
    character entropy/KL divergence, and are historically rare (below the 5th percentile of query frequency)?
  context: 'Compute Damerau-Levenshtein distance between observed queries and trusted domains and flag
    distances of 1-2 (single character omission/substitution/insertion/transposition). Combine this with
    Shannon entropy and Kullback-Leibler divergence against a natural-language character distribution;
    entropy plus Levenshtein together separate algorithmic/look-alike labels from benign high-entropy
    CDNs far better than raw entropy alone. Then score the low-distance candidates by historical query
    rarity and flag those that are both low-distance and low-frequency (below the 5th percentile) for
    analyst review. Derive your percentile and entropy thresholds from 30-90 days of your own dns.log
    so the baseline reflects your environment. A positive result identifies likely typosquats actively
    being queried. This supports Isolate by surfacing deceptive near-match domains that deterministic
    skeletons may miss. References: [Downing/Red Canary - Threat Hunting Entropy](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)
    and [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = freq_distribution(dns.log, last_30_90d)\nfor q in queries:\n  d = damerau_levenshtein(q,\
      \ nearest(trusted_domains))\n  if d in [1,2] and (entropy(q) anomalous or kl_divergence(q, natural_lang)\
      \ high) and freq(q) < pct5(baseline):\n    alert('Low-distance rare near-match', q, d)"
- question: How do confusable/near-match domains rank by passive-DNS prevalence and dynamism - first-seen
    recency, querying-host fan-out, distinct-IP/ASN churn, and short TTLs - and which score highest as
    freshly-stood-up look-alikes?
  context: 'Rank confusable and near-match domains using prevalence and dynamism features from passive
    DNS: how recently the domain was first seen, how many internal hosts query it (fan-out), how many
    distinct IPs/ASNs it churns through, and whether it uses short TTLs. Newly-registered, low-prevalence
    look-alike domains that are contacted by only a few internal hosts and resolve to changing infrastructure
    score the highest - this profile matches throwaway phishing/C2 domains. A high score concentrates
    analyst attention on the riskiest candidates; established, widely-used domains with stable infrastructure
    score low and can be deprioritized. This supports Isolate by prioritizing the freshest, most evasive
    deceptive domains for blocking. References: [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for d in confusable_candidates:\n  score = w1*recency(first_seen[d]) + w2*host_fanout[d] +\
      \ w3*distinct_ip_asn_churn[d] + w4*short_ttl[d]\n  if score >= threshold: alert('High-risk look-alike\
      \ (prevalence/dynamism)', d, score)"
- question: Are there spikes above baseline in confusable-domain queries per host/user segment, or elevated
    NXDOMAIN/SERVFAIL ratios and unusual subdomain counts that accompany confusable-domain probing?
  context: 'Track time-bucketed counts of confusable-domain queries per host or user segment and alert
    when they spike above baseline control limits (mean+3-sigma or EWMA), which indicates an active phishing
    or redirection campaign hitting a population of users. Separately profile failure-mode signals: elevated
    NXDOMAIN/SERVFAIL ratios and unusual subdomain counts accompanying confusable-domain probing are distinct
    indicators of look-alike enumeration or failing C2. Report query Volume (count/min), State (resolved
    vs NXDOMAIN/SERVFAIL), and Frequency per host. A burst tied to a campaign or a host generating many
    failed confusable lookups both warrant investigation. This supports Isolate by detecting campaign-scale
    exposure and active probing across the user base. References: [Nadler et al. - Detection of Malicious
    and Low Throughput Data Exfiltration Over the DNS Protocol](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'bucket confusable_query_count by host, time_window

      baseline = mean+3*sigma (or EWMA) per host

      if count > baseline: alert(''Confusable query burst'', host)

      if nxdomain_servfail_ratio(host) high or distinct_subdomains(host) anomalous: alert(''Look-alike
      probing/failure spike'', host)'
- question: When observed domain labels are rendered to images and compared against protected-brand embeddings
    with a visual-similarity model, which labels are visually near-identical to a protected brand despite
    differing code points?
  context: 'Render each observed domain label to an image and compare it against protected-brand embeddings
    using a Siamese convolutional network that learns visual distance. This catches unseen Unicode glyph
    substitutions that edit distance misses - glyphs that render almost identically but are different
    code points. Auto-expand confusable coverage with confusable-character generators. The alert must
    surface the top-3 contributing features: the matched legitimate brand, the visual distance, and the
    differing code points/script. A small visual distance to a protected brand with differing code points
    is strong evidence of an intentional homograph. This ML layer complements the deterministic skeleton
    matching and supports Isolate by catching novel glyph tricks rendering as trusted brands. References:
    [Woodbridge et al. - Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738)
    (code/data: endgameinc/homoglyph) and [ShamFinder/SimChar](https://arxiv.org/abs/1909.07539).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for label in observed_labels:\n  emb = siamese_cnn(render_image(label))\n  brand, vdist =\
      \ nearest(emb, protected_brand_embeddings)\n  if vdist < threshold and codepoints(label) != codepoints(brand):\n\
      \    alert('Visual homoglyph match', label, brand, vdist, differing_codepoints(label, brand))"
- question: Does a supervised (or unsupervised Isolation Forest) domain classifier trained on lexical/Unicode
    and contextual-behavior features flag observed domains as high-risk homoglyphs, and what top-3 features
    drive each score?
  context: 'Train a supervised domain classifier on lexical/Unicode features (entropy, KL divergence,
    script mix, non-ASCII count, n-gram divergence, length) and contextual behavior (host dispersion,
    connection follow-through). In label-scarce environments, run an Isolation Forest on benign lexical
    baselines to flag outliers without labels. Use high-risk scores to drive denylist EXPANSION - never
    to suppress the deterministic rules above, which remain authoritative. Each alert must surface the
    top-3 contributing features so the analyst can validate the decision. A high-risk classification,
    especially with corroborating context (queried by few hosts, follow-through connections), is a candidate
    for the denylist and isolation workflow. This supports Isolate by continuously broadening coverage
    of deceptive domains beyond hand-maintained rules. References: [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf),
    [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500), and [Nadler et al.
    - Detection of Malicious and Low Throughput Data Exfiltration Over the DNS Protocol](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS Resolver Logs
  - Web Proxy Logs
  - 'NAI: DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [entropy, kl_divergence, script_mix, non_ascii_count, ngram_divergence, length,
      host_dispersion, conn_followthrough]

      score = classifier.predict(features)   # or isolation_forest.score for unlabeled

      if score >= high_risk: emit(''Homoglyph risk'', domain, top3_features(score)); propose_denylist_add(domain)'
