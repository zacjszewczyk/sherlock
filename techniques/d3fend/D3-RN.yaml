name: 'D3-RN: Reference Nullification'
id: 396a854c-c364-408e-a731-316298763a8c
description: Investigate the implementation status and runtime effectiveness of memory-corruption mitigations
  (Reference Nullification and related use-after-free defenses) across the environment. This playbook
  helps an analyst confirm that exploit-protection mitigations are firing on protected processes, detect
  heap-corruption and use-after-free crash signatures, identify coverage gaps where crashes occur without
  mitigation context, trend the ratio of protected to unprotected crashes, baseline crash and mitigation
  event rates per application and host, profile post-exploitation process behavior via system-call sequence
  analysis, and proactively surface dangling-pointer / use-after-free defects in first-party source and
  binaries. Together these questions measure control effectiveness and surface attempted control-flow
  hijacks driven by reference misuse or use-after-free conditions on critical servers, user endpoints,
  and domain controllers.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
