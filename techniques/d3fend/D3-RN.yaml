questions:
- question: Are runtime exploit-protection mitigations (Microsoft-Windows-Security-Mitigations kernel/user-mode
    events, Control Flow Guard / Intel CET enforcement aborts) actually firing on our critical, protected
    processes?
  context: 'Supports the Harden tactic by confirming that runtime memory-safety hardening is active and
    observable. Query the mitigation telemetry channels for events showing exploit protections fired on
    critical processes (web servers, database servers, browsers, office suites, domain controllers). An
    enforcement abort downstream of a corrupted (e.g., use-after-free) indirect transfer is high-confidence
    evidence of an attempted control-flow hijack that hardening stopped. A positive result (confirmed
    trigger events) is positive evidence that the control is deployed and working; an absence of any such
    events on processes you expect to be protected may indicate the mitigation is not enabled or not logging,
    which is itself a coverage gap to chase. Per [Control-Flow Integrity, Abadi et al.](https://users.soe.ucsc.edu/~abadi/Papers/cfi-tissec-revised.pdf),
    an enforcement abort downstream of a corrupted (e.g., use-after-free) indirect transfer is high-confidence
    evidence of attempted control-flow hijack; the layered-policy model in [SoK: Eternal War in Memory,
    Szekeres et al.](https://nebelwelt.net/publications/files/13Oakland.pdf) frames why these aborts are
    the observable evidence that a hardening policy stopped an exploit stage.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search source IN (Microsoft-Windows-Security-Mitigations/KernelMode, Microsoft-Windows-Security-Mitigations/UserMode,
      CFG_abort, IntelCET_abort)

      where process_name IN (critical_process_list)

      | eval mitigation_fired=true

      | stats count by host, process_name, mitigation_type'
- question: Are we seeing repeated heap-corruption exceptions (Exception Code 0xC0000374) in any specific
    application that would indicate a memory-management bug exploitable via use-after-free or heap overflow?
  context: Supports the Harden tactic by surfacing memory-management defects that reference nullification
    is meant to neutralize. Monitor Windows Error Reporting (WER) and Application logs for Exception Code
    0xC0000374 (heap corruption). Repeated occurrences (tune to >=2 in 24h per application against baseline)
    in a specific application indicate heap-metadata corruption often produced by use-after-free or heap
    overflow. A positive result is a cluster of heap-corruption faults in one application/module; correlate
    with alloc/free context where available. Isolated single events are likely benign defects, but recurrence
    points to an exploitable bug needing remediation. [AddressSanitizer, Serebryany et al.](https://www.usenix.org/system/files/conference/atc12/atc12-final39.pdf)
    confirms these classes manifest as heap-metadata corruption and labels them with alloc/free stacks,
    and [DangSan, van der Kouwe et al.](https://download.vusec.net/papers/dangsan_eurosys17.pdf) ties
    them to dangling-pointer writes.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (source=WER OR source=Application) exception_code=0xC0000374

      | bin _time span=24h

      | stats count by application, host, _time

      | where count >= 2'
- question: Do we have access-violation crashes (Exception Code 0xC0000005) whose faulting address is
    near-null or inside a recently-freed region, with the faulting module repeating across crashes — the
    deterministic signature of a dereferenced dangling pointer?
  context: 'Supports the Harden tactic by detecting the exact observable that reference nullification
    produces: it converts dangling-pointer use into a null/low-page dereference. Flag access-violation
    crashes (0xC0000005) where the faulting address is near-null (low page) or inside a recently-freed
    region and the faulting module repeats across crashes. A positive result is a repeating module + near-null
    faulting address pattern, which is high-confidence use-after-free evidence; pull allocation/free stack
    traces to confirm. Random, non-repeating faulting addresses across many modules are more consistent
    with general instability than targeted dangling-pointer misuse. Reference nullification converts
    dangling-pointer use into exactly this null-dereference per [Preventing Use-after-free with Dangling
    Pointers Nullification (DangNull), Lee et al.](https://taesoo.kim/pubs/2015/lee:dangnull.pdf), and
    [AddressSanitizer, Serebryany et al.](https://www.usenix.org/system/files/conference/atc12/atc12-final39.pdf)
    classifies the same condition as use-after-free with allocation/free stack traces for confirmation.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search exception_code=0xC0000005

      | eval near_null = (faulting_address < 0x10000)

      | where near_null==true

      | stats count, dc(host) by faulting_module, application

      | where count > 1'
- question: Are repeated access-violation crashes (Windows Event ID 1000/1001) occurring on protected
    applications WITHOUT corresponding mitigation-trigger logs, indicating a hardening coverage gap?
  context: 'Supports the Harden tactic by isolating coverage failures: crashes that should have produced
    a mitigation event but did not. Alert when repeated access-violation crashes (EID 1000 and 1001) occur
    on protected applications without any matching Security-Mitigations / CFG / CET trigger logs. Profile
    per application the count of 0xC0000005 crashes that carry no mitigation evidence as a distinct coverage-failure
    signal. A positive result means the application is crashing in memory-unsafe ways but hardening is
    not engaging — either it is misconfigured, bypassed, or absent — and that host/app should be prioritized
    for remediation. This coverage-failure signal is consistent with the staged exploit model and bypassability
    analysis in [SoK: Eternal War in Memory, Szekeres et al.](https://nebelwelt.net/publications/files/13Oakland.pdf).'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (EventID=1000 OR EventID=1001) exception_code=0xC0000005 process_name IN (protected_apps)

      | join type=left host, process_name [search source=Security-Mitigations | eval mitig=1]

      | where isnull(mitig)

      | stats count by host, process_name'
- question: For memory-access-violation crashes (0xC0000005), what is the ratio of crashes WITH mitigation
    evidence to crashes WITHOUT it, and is that ratio trending downward by application tier?
  context: Supports the Harden tactic by quantifying control effectiveness over time. For 0xC0000005 crashes,
    calculate the ratio of crashes that carry mitigation evidence to those that do not, and trend it by
    application tier. Use cheap, explainable per-app baselines and name the deviating tier/metric in the
    alert. A falling ratio (proportionally more unmitigated crashes) signals eroding coverage — perhaps
    a mitigation was disabled, a new unprotected build deployed, or attackers found a bypass. A stable
    or rising ratio indicates hardening is keeping pace with crash activity. Use cheap, explainable per-app
    baselines as in [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    and name the deviating tier/metric in the alert.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search exception_code=0xC0000005

      | eval mitigated = if(mitigation_present, 1, 0)

      | bin _time span=1d

      | stats sum(mitigated) as mit, count as total by app_tier, _time

      | eval ratio = mit/total

      | trendline sma5(ratio) | where ratio < prior_ratio'
- question: Do per-application, per-host crash and mitigation event counts deviate from their statistical
    baseline — a burst above mean+3sigma (exploit/fuzzing-driven) or a flatline (WER/audit suppression)?
  context: Supports the Harden tactic by detecting both exploitation bursts and evidence tampering. Build
    per-application, per-host baselines (mean and standard deviation) of crash (EID 1000/1001), heap-corruption
    (0xC0000374), and access-violation (0xC0000005) counts per hour. Alert when a bucket exceeds mean+3*sigma
    (an exploit- or fuzzing-driven crash burst) or collapses to a flatline (suppression of WER/auditing).
    Deduplicate crashes by faulting-instruction / stack-hash / exception-code to count distinct crashes
    and measure crash-and-restart cadence that distinguishes exploitation from normal use. Derive thresholds
    from 30-day per-application history. A positive result is a statistically significant spike or an
    unexpected silence in a normally-noisy app. Thresholds and the mean+3*sigma / flatline logic follow
    [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    and the crash-deduplication and crash-and-restart cadence that distinguishes exploitation from normal
    use follow [The Art, Science, and Engineering of Fuzzing, Manes et al.](https://arxiv.org/pdf/1812.00140).
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search (EventID IN (1000,1001) OR exception_code IN (0xC0000374,0xC0000005))

      | eval crash_id = hash(faulting_instruction, stack_hash, exception_code)

      | bin _time span=1h

      | stats dc(crash_id) as crashes by application, host, _time

      | eventstats mean(crashes) as mu, stdev(crashes) as sd by application, host

      | where crashes > mu+3*sd OR crashes == 0'
- question: For high-value protected processes, do short system-call / ETW n-gram sequences show a spike
    in rare or unseen sequences consistent with a successful use-after-free redirecting execution?
  context: Supports the Harden tactic by detecting post-exploitation behavior even when the crash itself
    is suppressed or absent. Baseline normal short system-call / ETW n-gram sequences and their frequencies
    for high-value protected processes; a successful use-after-free that redirects execution surfaces
    as a spike in rare or unseen sequences. Use an explainable n-gram mismatch count and a cheap frequency-based
    sequence model as thresholds (e.g., alert when the anomalous-n-gram fraction exceeds the per-process
    baseline mean+3*sigma). A positive result is a measurable rise in never-before-seen call sequences
    for a process, suggesting hijacked control flow rather than normal operation. Use the explainable
    n-gram mismatch count from [A Sense of Self for Unix Processes, Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf)
    and the cheap frequency-based t-stide model from [Detecting Intrusions Using System Calls, Warrender
    et al.](https://www.cs.unm.edu/~forrest/publications/oakland-with-cite.pdf) as thresholds (e.g., alert
    when the anomalous-n-gram fraction exceeds the per-process baseline mean+3*sigma).
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search source IN (ETW, syscall_trace) process_name IN (high_value_protected)

      | ngram(syscall_seq, n=6)

      | lookup baseline_ngrams ngram OUTPUT seen

      | eval anomalous = if(isnull(seen),1,0)

      | stats sum(anomalous) as anom, count as total by process, host

      | eval frac = anom/total | where frac > baseline_mean + 3*baseline_sd'
- question: Can we classify which crash/mitigation events are likely exploit attempts versus benign software
    defects, and which hosts therefore need hardening remediation first?
  context: Supports the Harden tactic by prioritizing remediation using exploitability signals. Train
    a classifier on crash and mitigation features (faulting module, exception code 0xC0000374/0xC0000005,
    write-vs-read fault, near-null vs controlled faulting address, mitigation-present flag, process identity,
    vulnerability context) to separate benign defects from likely exploit attempts. The alert MUST surface
    the top-3 contributing features (e.g., exception_code=0xC0000374, faulting_module=X, mitigation_present=false).
    Keep the deterministic crash rules above as the floor. A positive result is a high exploit-likelihood
    score with explainable drivers, directing analysts to the riskiest hosts. Feature design and exploitability
    labeling follow the ML-assisted crash-triage discussion in [The Art, Science, and Engineering of Fuzzing,
    Manes et al.](https://arxiv.org/pdf/1812.00140).
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [faulting_module, exception_code, write_vs_read, near_null,\n            mitigation_present,\
      \ process_identity, vuln_context]\nscore = exploit_classifier.predict_proba(features)\nif score\
      \ > threshold: alert(host, top3_features(features), score)"
- question: Does the ordered sequence of per-host application / Security-Mitigations / WER log keys deviate
    from the learned normal pattern, such as crash bursts or abnormal mitigation-event ordering?
  context: Supports the Harden tactic by detecting exploit-driven deviations in the temporal structure
    of host logging. Model the normal ordered sequence of per-host application / Security-Mitigations
    / WER log keys with a stacked LSTM and a tunable top-g prediction threshold (start g so >99% of benign
    events are predicted). Flag exploit-driven deviations such as crash bursts or abnormal mitigation-event
    ordering, and report the violating log key as the contributing feature. Retain the deterministic crash
    rules underneath. A positive result is a log key that the model did not predict in the top-g, indicating
    an out-of-pattern sequence worth investigating. The stacked-LSTM log-key modeling and top-g prediction
    threshold follow [DeepLog, Du et al.](https://acmccs.github.io/papers/p1285-duA.pdf).
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ordered_log_keys(host, window)  # app / Security-Mitigations / WER

      pred = lstm.predict_next(seq[:-1])

      if seq[-1] not in topg(pred, g): alert(host, violating_key=seq[-1])'
- question: Are there use-after-free / dangling-pointer resource-management defects (CWE-399) in our first-party
    source or binaries where reference nullification is missing?
  context: 'Supports the Harden tactic by proactively eliminating the defects that runtime mitigations
    only contain at runtime. Apply a code-gadget bidirectional-LSTM detector to internal source/binary
    to flag resource-management defects (CWE-399, including use-after-free) where reference nullification
    is missing, prioritizing remediation before exploitation. Integrate with the SAST / source-and-binary
    vulnerability-scanning pipeline. A positive result is a code location flagged as a likely use-after-free
    gadget lacking pointer nullification after free; route it to developers to add the missing nullification
    and close the underlying vulnerability. The code-gadget bidirectional-LSTM approach for resource-management
    defects (CWE-399, including use-after-free) follows [VulDeePecker, Li et al.](https://arxiv.org/pdf/1801.01681)
    (dataset/code: https://github.com/CGCL-codes/VulDeePecker).'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Microsoft-Windows-Security-Mitigations KernelMode/UserMode logs
  - Windows Error Reporting (WER)
  - Microsoft Control Flow Guard / Intel CET enforcement telemetry
  - Sysmon Event ID 1 (process create)
  - ETW / system-call traces
  - SAST / source-and-binary vulnerability-scanning pipeline
  - 'NAI: Critical application servers (e.g., web servers, database servers), user endpoints running common
    software (browsers, office suites), and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SAST/ML pseudocode
    query: "for gadget in extract_code_gadgets(internal_source_and_binaries):\n    vec = embed(gadget)\n\
      \    if biLSTM.predict(vec) == 'CWE-399_use_after_free':\n        report(gadget.location, reason='missing\
      \ reference nullification')"
