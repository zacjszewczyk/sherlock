name: 'D3-DF: Decoy File'
id: 9e608316-9ce0-4519-b661-0313a3a582dd
description: Investigate interactions with decoy files (honeyfiles) and canary tokens to detect adversary
  reconnaissance, data staging, collection, lateral movement, and exfiltration. Because decoy files map
  to no legitimate workflow, this playbook helps an analyst triage any host-level access (read, write,
  rename, delete, or open-for-delete) to a decoy path, the appearance of a decoy file's hash or filename
  in network traffic, rapid bulk modification/deletion of decoys (e.g., ransomware encrypting bait files),
  and off-host callbacks from embedded canary tokens (DNS/HTTP beacons or use of decoy credentials). It
  combines deterministic tripwire logic, statistical baselining of file access, transfer volume, entropy,
  and DNS first-seen behavior, and explainable machine-learning models for egress and I/O anomaly detection
  to distinguish benign noise from high-fidelity intrusion evidence.
type: technique
related:
- tactic_id: D3-DO
  tactic_name: Decoy Object
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has any account or process accessed a decoy file (read, open, copy, list, or open-for-delete)
    on a monitored host, and if so, what account, process image, access mask, and host generated the event?
  context: Decoy files are seeded where they have no legitimate business purpose, so under the Decoy Object
    strategy a single access is unambiguous, high-fidelity evidence of an adversary enumerating, staging,
    or collecting data. Fire immediately on ANY access event matching a decoy path (Windows Event ID 4663
    with an Object Name matching the decoy file's SACL, Sysmon Event ID 11/23, or a Linux auditd watch
    hit), excluding only an explicitly enumerated allowlist of canary-test service accounts. A FIFO/read-blocking
    trap that never returns EOF is both signal and active containment. A positive result means an actor
    (or malware) touched bait that real users never would; capture the account, process image, access
    mask, and host to scope the intrusion. This deterministic floor must hold regardless of any statistical
    or ML layer. Single-access certainty and the FIFO/read-blocking trap concept follow [Honeyfiles](https://faculty.nps.edu/dedennin/publications/honeyfiles.pdf)
    and [R-Locker](https://digibug.ugr.es/handle/10481/55284).
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)/23 (FileDelete)
  - Linux auditd (watch rule)
  - Zeek files.log
  - 'NAI: User home directories (Documents, Desktop), shared network drives holding business-critical/financial
    data, software-deployment staging folders, and developer directories (e.g., C:\dev\, source repositories).
    Place a SACL/auditd watch on every decoy path.'
  range: Last 90 days (alert in real time; pivot +/- 1 hour around the access for correlation)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=security (EventCode=4663 OR sourcetype=sysmon EventCode IN (11,23) OR sourcetype=auditd
      key=decoy_watch)

      | where match(Object_Name, DECOY_PATH_REGEX)

      | where NOT(SubjectUserName IN (CANARY_TEST_ACCOUNTS))

      | table _time, host, SubjectUserName, ProcessName, AccessMask, Object_Name

      | alert severity=critical'
  - technology: Linux/auditd pseudocode
    query: 'auditctl -w /path/to/decoy -p rwxa -k decoy_watch

      ausearch -k decoy_watch | aureport -f  # any hit => critical alert'
- question: What do legitimate file-access patterns on production shares look like, and are our decoys
    named, typed, and positioned in the 75th-95th percentile of normalcy so they are enticing while any
    access to them remains anomalous?
  context: 'To make decoys effective under the Decoy Object strategy, profile legitimate access on production
    shares (Event ID 4663) to compute descriptive statistics on file types, naming conventions, and access
    frequency, then create decoys whose names/types fall in the 75th-95th percentile of normalcy to maximize
    enticement. Score candidate decoys with topic/embedding similarity to surrounding real files, apply
    filename-distribution camouflage, and use corpus-matched content. Track Frequency (accesses/min per
    account) and State: an Event ID 4663 with a FAILURE/access-denied result on a decoy is a distinct
    reconnaissance signal because enumerating an unreadable decoy still betrays an actor. This baselining
    both improves decoy credibility and establishes the normal access surface so deviations stand out.
    Decoy scoring uses topic/embedding similarity per [TSM](https://arxiv.org/abs/2203.07580), filename-distribution
    camouflage per [Honeyfile Camouflage](https://arxiv.org/abs/2405.04758), and corpus-matched content
    per [automated enticing-content generation](https://scholarspace.manoa.hawaii.edu/bitstream/10125/41897/1/paper0748.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)/23 (FileDelete)
  - Linux auditd (watch rule)
  - Zeek files.log
  - 'NAI: User home directories (Documents, Desktop), shared network drives holding business-critical/financial
    data, software-deployment staging folders, and developer directories (e.g., C:\dev\, source repositories).
    Place a SACL/auditd watch on every decoy path.'
  range: Last 90 days (baseline window); recompute monthly
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=security EventCode=4663 Object_Name IN (PRODUCTION_SHARES)

      | stats count by file_type, naming_pattern, SubjectUserName

      | eventstats perc75(count) as p75 perc95(count) as p95

      | eval decoy_candidate = (count>=p75 AND count<=p95)

      | table file_type, naming_pattern, decoy_candidate'
  - technology: SIEM/Rule pseudocode
    query: 'EventCode=4663 Object_Name IN (DECOY_PATHS) (AccessResult=FAILURE OR Keywords="Audit Failure")

      | stats count as denied_recon by SubjectUserName, host | where denied_recon>0 | alert'
- question: After a decoy access alert on a host, does that host's outbound network egress spike beyond
    its established baseline (>3 standard deviations), suggesting the decoy or related data is being exfiltrated?
  context: Once a decoy on a host has been touched under the Decoy Object strategy, the next adversary
    step is often exfiltration. Run a per-host time-series anomaly model on network egress (Zeek conn.log
    orig_bytes) and escalate if outbound volume exceeds the host's established baseline by more than 3
    standard deviations (Volume). Optionally model the surrounding file-operation sequence with an attention
    LSTM. Crucially, the alert must surface the top-3 contributing features (e.g., bytes_out z-score,
    destination novelty, access-burst rate) rather than only a raw score, preserving explainability so
    the SOC can confirm whether the egress reflects true exfiltration versus benign bulk transfer. The
    optional file-operation sequence model (attention LSTM) and top-3 feature explainability follow [Nayak
    et al.](https://arxiv.org/abs/2604.17522).
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)/23 (FileDelete)
  - Linux auditd (watch rule)
  - Zeek files.log
  - 'NAI: User home directories (Documents, Desktop), shared network drives holding business-critical/financial
    data, software-deployment staging folders, and developer directories (e.g., C:\dev\, source repositories).
    Place a SACL/auditd watch on every decoy path.'
  range: Last 90 days for baseline; evaluate the 24 hours following each decoy access
  queries:
  - technology: SIEM/ML pseudocode
    query: 'from zeek_conn where ts > decoy_access_time and src_ip = alert_host

      model = timeseries_anomaly(orig_bytes, baseline=host_30d)

      if zscore(orig_bytes) > 3: escalate with top3_features=[bytes_out_z, dst_novelty, access_burst_rate]'
  - technology: Zeek/pseudocode
    query: 'conn.log | filter id.orig_h==host | bin 5min sum(orig_bytes) -> egress

      compare egress to rolling baseline mean+3*std -> anomaly flag'
- question: Does any decoy file's hash (MD5/SHA1) or unique filename appear in network traffic crossing
    a monitored segment, indicating the decoy is being moved laterally or exfiltrated?
  context: Maintain a watchlist of all decoy file hashes (MD5, SHA1) and unique filenames. Under the Decoy
    Object strategy, fire a high-fidelity alert immediately if a watchlisted hash appears in the md5/sha1
    fields of Zeek files.log or a decoy filename appears in smb_files.log, because any decoy interaction
    on the wire is inherently suspicious. A match means the bait traversed a monitored choke point or
    egress path, confirming lateral movement or exfiltration; record source/destination, segment, and
    timestamp to scope the spread. Any decoy interaction being inherently suspicious follows the deception
    taxonomy in [Han et al.](https://www.eurecom.fr/publication/5474/download/sec-publi-5474.pdf).
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek smb_files.log
  - 'NAI: Network egress points, internal choke points (core switches/routers), SMB/file-server uplinks,
    and server-farm uplinks.'
  range: Last 90 days (real-time matching)
  queries:
  - technology: Zeek/pseudocode
    query: 'files.log | where md5 in DECOY_HASHES or sha1 in DECOY_HASHES -> critical alert

      smb_files.log | where name in DECOY_FILENAMES -> critical alert

      emit tx_hosts, rx_hosts, conn_uid, ts'
  - technology: SIEM/Rule pseudocode
    query: 'sourcetype=zeek_files (md5 IN(DECOY_HASHES) OR sha1 IN(DECOY_HASHES))

      | table _time, tx_hosts, rx_hosts, md5, sha1 | alert severity=critical'
- question: For any connection carrying a decoy, how does the total transferred volume, transfer frequency,
    and connection state compare to the historical baseline for that destination, distinguishing staging
    from completed exfiltration?
  context: 'When a decoy hash matches in files.log under the Decoy Object strategy, join the corresponding
    Zeek conn.log entry and compare total bytes (orig_bytes + resp_bytes) against the historical distribution
    for that destination IP/subnet, flagging transfers above the 98th percentile (Volume). Add Frequency
    (decoy-bearing transfers/hour to a destination) and profile conn_state: S0/REJ/RSTO failed or reset
    connections and repeated blocked attempts are distinct signals of staging attempts versus completed
    exfiltration. This statistical context tells the analyst whether the actor merely probed or successfully
    moved data, and to where. The volume/frequency/connection-state profiling is consistent with behavior
    monitoring described in [CryptoLock](https://doi.org/10.1109/ICDCS.2016.46) and [Han et al.](https://www.eurecom.fr/publication/5474/download/sec-publi-5474.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek smb_files.log
  - 'NAI: Network egress points, internal choke points (core switches/routers), SMB/file-server uplinks,
    and server-farm uplinks.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'files.log(decoy match) | join conn.log on conn_uid

      | eval total_bytes = orig_bytes + resp_bytes

      | compare total_bytes to perc98(dst_ip baseline) -> flag

      | stats count by conn_state, id.resp_h  # S0/REJ/RSTO = staging signal'
  - technology: SIEM/Stats pseudocode
    query: 'decoy_conn | stats sum(total_bytes) as vol count as freq by dst_subnet, conn_state

      | eventstats perc98(vol) as p98 by dst_subnet | where vol>p98 OR conn_state IN(S0,REJ,RSTO)'
- question: When a decoy hash is detected on the network, does a supervised exfiltration classifier score
    the carrying connection as malicious, and what top-3 features drove that score?
  context: Train a supervised classifier (logistic regression or gradient boosting) on Zeek conn.log features
    (src/dst IP, dst port, duration, orig/resp bytes, protocol, dst ASN, connection state) to score malicious
    exfiltration when a decoy hash is detected, escalating on high probability. Under the Decoy Object
    strategy this adds nuance beyond a raw watchlist hit by weighing destination and timing context. The
    alert must list the top-3 contributing features (e.g., dst ASN novelty, byte ratio, off-hours timing)
    so the SOC gets immediate, explainable context to confirm or dismiss the exfiltration hypothesis.
    The top-3 feature attribution follows the explainability approach of [Nayak et al.](https://arxiv.org/abs/2604.17522).
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek smb_files.log
  - 'NAI: Network egress points, internal choke points (core switches/routers), SMB/file-server uplinks,
    and server-farm uplinks.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = conn_features(src_ip,dst_ip,dst_port,duration,orig_bytes,resp_bytes,proto,dst_asn,conn_state)

      p = exfil_model.predict_proba(X) for connections with decoy hash

      if p > 0.8: escalate with top3_features=explain(model, X)'
- question: Has any process written to, renamed, or deleted a decoy file, and given that legitimate workflows
    never modify decoys, should this fire as a malicious event immediately?
  context: 'Because legitimate workflows never write to decoys, under the Decoy Object strategy fire immediately
    on ANY write, rename, or delete of a decoy path (Windows Event ID 4663 with a WriteData/Delete access
    mask, Sysmon Event ID 23, or Linux auditd). Read-blocking trap files additionally stall the attacker,
    and single-access certainty applies. This is a deterministic floor independent of entropy thresholds:
    a modify/rename/delete on bait is strong evidence of ransomware encryption, destructive action, or
    bulk staging. Capture the process image, mask, and affected paths to identify the offending process.
    Read-blocking trap files stalling the attacker follow [R-Locker](https://digibug.ugr.es/handle/10481/55284);
    single-access certainty follows [Honeyfiles](https://faculty.nps.edu/dedennin/publications/honeyfiles.pdf).'
  answer_sources:
  - Windows Event ID 4663 (WriteData/Delete)
  - Sysmon Event ID 11/23
  - Linux auditd
  - Minifilter/FS driver telemetry
  - 'NAI: Decoy files seeded throughout user home directories, shares, and high-value folders; choose
    traversal-early names so an enumerator/encryptor reaches a decoy before real data.'
  range: Last 90 days (real-time)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventCode=4663 AccessMask IN(WriteData,Delete,0x2,0x10000) OR sysmon EventCode=23 OR auditd
      key=decoy_watch perm=wa)

      | where match(Object_Name, DECOY_PATH_REGEX)

      | table _time, host, ProcessName, AccessMask, Object_Name | alert severity=critical'
- question: Do writes to decoy files show high Shannon entropy (~8 bits/byte), file-type/magic-number
    mismatch, similarity collapse, or a high modification/deletion rate consistent with ransomware encrypting
    bait?
  context: Compute, per decoy write under the Decoy Object strategy, the Shannon entropy of written content
    and alert when it approaches ~8 bits/byte (>7.99); detect file-type/magic-number mismatch versus the
    extension; and measure sdhash similarity collapse between the original and new version. Combine with
    Frequency (files modified/min by one process) and deletion counts, alerting after as few as ~10 affected
    files. Derive dataset-specific entropy and rate thresholds from a benign baseline of the protected
    corpus. High entropy plus type mismatch plus similarity collapse across many files in seconds is the
    classic ransomware signature, distinguishing encryption from ordinary edits. Alerting after as few
    as ~10 affected files follows [CryptoLock](https://doi.org/10.1109/ICDCS.2016.46).
  answer_sources:
  - Windows Event ID 4663 (WriteData/Delete)
  - Sysmon Event ID 11/23
  - Linux auditd
  - Minifilter/FS driver telemetry
  - 'NAI: Decoy files seeded throughout user home directories, shares, and high-value folders; choose
    traversal-early names so an enumerator/encryptor reaches a decoy before real data.'
  range: Last 90 days; evaluate in tight (per-minute) windows during an event
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per decoy_write: entropy = shannon(content)

      flag = (entropy>7.99) OR magic_mismatch(extension,header) OR sdhash_sim(orig,new)<THRESH

      | stats dc(file) as affected count by process within 60s

      | where affected>=10 OR flag -> alert'
  - technology: Linux/auditd pseudocode
    query: monitor decoy writes; for each, sample content entropy; if >7.99 and rate>10/min by pid ->
      alert
- question: Does any process exhibit an I/O behavior profile (folder-listing rate, read/write/rename counts,
    overwrite fraction, write entropy) matching a ransomware encryptor, and which top-3 features drive
    that classification?
  context: Train a random-forest (or attention-LSTM) classifier on first-party I/O features per process
    - folder-listing rate, read/write/rename counts, fraction of files overwritten, and write entropy
    - to flag a process exhibiting the encryption profile, then enable rollback via copy-on-write. Under
    the Decoy Object strategy this catches the encrypting process holistically rather than per-file. Surface
    the top-3 driving features (e.g., overwrite fraction, write entropy, rename rate) in the alert so
    the analyst can validate the malicious-process determination and trigger containment/rollback quickly.
    The random-forest/attention-LSTM I/O classifier with copy-on-write rollback follows [ShieldFS](https://re.public.polimi.it/retrieve/e0c31c0c-16af-4599-e053-1705fe0aef77/continella-shieldfs-2016.pdf);
    the top-3 feature surfacing follows [Nayak et al.](https://arxiv.org/abs/2604.17522).
  answer_sources:
  - Windows Event ID 4663 (WriteData/Delete)
  - Sysmon Event ID 11/23
  - Linux auditd
  - Minifilter/FS driver telemetry
  - 'NAI: Decoy files seeded throughout user home directories, shares, and high-value folders; choose
    traversal-early names so an enumerator/encryptor reaches a decoy before real data.'
  range: Last 90 days; per-process windows during suspected activity
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feats = per_process(listing_rate, read_cnt, write_cnt, rename_cnt, overwrite_frac, write_entropy)

      p = ransomware_io_model.predict(feats)

      if p==malicious: rollback_cow(process); alert top3=explain(model,feats)'
- question: Has any unique per-token callback domain/URL been queried via DNS or requested via HTTP, or
    have any decoy credentials/API keys been used in an authentication attempt, indicating a canary token
    was triggered off-host?
  context: Register unique per-token callback domains/URLs and, under the Decoy Object strategy, fire
    immediately on any DNS query (Zeek dns.log) or HTTP request (Zeek http.log/proxy) to a token domain,
    or any authentication attempt using decoy credentials/API keys. Because tokens map to no legitimate
    use, a callback is high-fidelity evidence that an adversary opened a decoy document or harvested decoy
    secrets off the monitored filesystem. The event carries token identity, source IP, and timestamp -
    pivot on these to identify the compromised host or external infrastructure. Token-callback fidelity
    follows [canarytokens](https://blog.thinkst.com/p/canarytokensorg-quick-free-detection.html) and the
    decoy-credential model in [Han et al.](https://www.eurecom.fr/publication/5474/download/sec-publi-5474.pdf).
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Proxy/web gateway logs
  - Firewall logs
  - Canary token callback service
  - 'NAI: Egress DNS and HTTP/S paths; unique per-token callback domains/URLs; authentication logs for
    decoy credentials/API keys.'
  range: Last 90 days (real-time)
  queries:
  - technology: Zeek/pseudocode
    query: 'dns.log | where query in TOKEN_DOMAINS -> critical alert (token_id, src_ip, ts)

      http.log | where host in TOKEN_DOMAINS or uri in TOKEN_URLS -> critical alert'
  - technology: SIEM/Rule pseudocode
    query: '(auth logs) | where username IN(DECOY_CREDS) OR api_key IN(DECOY_KEYS) -> critical alert

      (proxy/firewall) | where dest_host IN(TOKEN_DOMAINS) -> critical alert'
- question: Do token callback domains - which should have zero prior resolution history - show any nonzero
    query count, and do DNS/HTTP response states (NXDOMAIN/SERVFAIL, 4xx/404) distinguish a successful
    beacon from mere probing?
  context: 'Token callback domains should have zero prior resolution history, so under the Decoy Object
    strategy baseline DNS first-seen and treat any nonzero query count as anomalous (Volume/Frequency).
    Profile DNS State explicitly: NXDOMAIN/SERVFAIL responses and HTTP 4xx/404 responses to token URLs
    are distinct failure-mode signals of probing or sinkholed callbacks, distinguishing a curious open
    that did not complete from a successful beacon that reached the token service. This separation tells
    the analyst whether the token was merely brushed against or genuinely fired, calibrating response
    urgency. This first-seen/failure-mode baselining is consistent with monitoring practice in [Han et
    al.](https://www.eurecom.fr/publication/5474/download/sec-publi-5474.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Proxy/web gateway logs
  - Firewall logs
  - Canary token callback service
  - 'NAI: Egress DNS and HTTP/S paths; unique per-token callback domains/URLs; authentication logs for
    decoy credentials/API keys.'
  range: Last 90 days (first-seen analysis)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns.log | stats earliest(ts) as first_seen count as q by query where query IN(TOKEN_DOMAINS)

      | where q>0 -> anomalous (no history expected)

      | stats count by rcode  # NXDOMAIN/SERVFAIL = probing/sinkhole vs NOERROR=beacon'
  - technology: Zeek/pseudocode
    query: 'http.log token requests | stats count by status_code  # 200=beacon, 404/4xx=probe

      dns.log token queries | breakdown by rcode (NOERROR vs NXDOMAIN/SERVFAIL)'
