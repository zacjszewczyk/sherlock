questions:
- question: Did every production build job complete with all required dead-code-elimination and debloating
    compiler/linker flags enabled (e.g., -O2/-O3 or MSVC /O2, -fdce/-fdce-elim, -ffunction-sections -fdata-sections
    with linker --gc-sections, or MSVC /OPT:REF /OPT:ICF), and are any production builds finishing without
    them?
  context: 'This Harden check parses compiler and linker logs to confirm that the optimizations responsible
    for removing unreachable code were configured for every production build. Missing flags mean dead
    code is shipped intact, enlarging the attack and gadget surface. A positive result (a production build
    lacking one or more required settings) is a hardening gap to remediate. Because merely enabling a
    flag does not prove a safe or complete outcome (the correctness-security gap), treat this as a necessary-but-insufficient
    gate and always pair it with the reachable-set diff and stub-hit verifications; never trust the flag
    presence alone. References: [The Correctness-Security Gap in Compiler Optimization](https://nebelwelt.net/files/15LangSec.pdf).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'required = {O2_or_O3, fdce, ffunction_sections, fdata_sections, gc_sections}

      FROM compiler_build_logs, linker_map_files

      WHERE build.environment == ''production''

      flags = parse_flags(build.command_line)

      IF NOT required.issubset(flags) THEN alert(''missing DCE flags'', build.job_id, required - flags)'
- question: Does the shipped binary's actual symbol/import table and seccomp/syscall surface match the
    reachable function/syscall superset computed from a precise call graph, with no retained functions/syscalls
    outside the reachable set (dead code not eliminated) and no reachable symbols missing (over-elimination)?
  context: 'This Harden verification computes the reachable set from a precise call graph that resolves
    function pointers (or via dependency-closure analysis) and diffs it against what the binary actually
    exports/imports and the syscalls it permits. Functions or syscalls present beyond the reachable set
    indicate dead code that DCE failed to remove; a reachable symbol that is missing indicates over-elimination
    that may break functionality or strip security-relevant code. Prefer static reachability over dynamic-trace
    training, which misses rare paths and under-reports needed code. A clean diff is the strongest single
    signal that elimination achieved its intended outcome. References: [Temporal System Call Specialization](https://www.usenix.org/conference/usenixsecurity20/presentation/ghavamnia)
    (code: https://github.com/shamedgh/temporal-specialization); [Confine](https://www3.cs.stonybrook.edu/~mikepo/papers/confine.raid20.pdf)
    (code: https://github.com/shamedgh/confine).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'reachable = callgraph_closure(entrypoints, resolve_fn_ptrs=true)

      shipped = symbols(binary) UNION imports(binary) UNION syscalls(seccomp_profile)

      extra = shipped - reachable      // dead code retained

      missing = reachable - shipped    // over-elimination

      IF extra THEN alert(''dead code not eliminated'', binary, extra)

      IF missing THEN alert(''over-elimination'', binary, missing)'
- question: Did each build publish the required static-analysis or compiler reports containing unreachable-function
    / unreachable-code (CWE-561) metrics plus a feature-to-code map, and are any pipeline stages running
    without these mandatory reports?
  context: 'This Harden gate enforces that dead-code analysis output exists and is well-formed for every
    build, so removal decisions are auditable. Builds that omit or emit malformed unreachable-code reports
    must fail the pipeline because they leave hardening unverifiable. Auditable feature/source mapping
    with safe-stub replacement ensures removed paths fail safely, and a region flagged removable-but-still-present
    should be treated as a deterministic violation rather than a warning. A positive result here is a
    missing/invalid report or a removable region left in the binary. References: [CARVE](https://arxiv.org/abs/1907.02180).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM static_analysis_reports, compiler_build_logs\nIF report.missing OR report.malformed THEN\
      \ fail_stage(build, 'missing CWE-561 report')\nIF report.has_field('unreachable_functions') == false\
      \ THEN fail_stage(build)\nFOR region IN report.removable_regions:\n  IF region.present_in_binary\
      \ THEN alert('removable-but-present', region)"
- question: What is the percentage size reduction of code sections (.text) before versus after the elimination/debloating
    passes for each application, what is the enterprise 90th-percentile effectiveness, and which applications
    fall below the minimum expected reduction?
  context: 'This Harden measurement quantifies how much code each pass actually removed. Compute (.text
    size before - after)/before per application, track the enterprise 90th-percentile, and flag applications
    below a tunable floor (start at <5%, tune per codebase). Calibrate against published baselines: piece-wise
    loading removed >79% of coreutils and 86% of SPEC CPU2006 code, and Razor removed >70% from real binaries;
    on average only ~5% of libc is used, so a per-library expected reachable fraction helps flag under-elimination.
    Low reduction suggests dead code remains and the attack surface was not meaningfully shrunk. References:
    [Quach et al.](https://www.usenix.org/conference/usenixsecurity18/presentation/quach); [Razor](https://www.usenix.org/conference/usenixsecurity19/presentation/qian).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "reduction = (text_before - text_after) / text_before * 100\np90 = percentile(reduction over\
      \ all apps, 90)\nFOR app IN apps:\n  IF reduction[app] < min_expected(app, default=5) THEN alert('under-elimination',\
      \ app, reduction[app])"
- question: By how much did the attacker-relevant surface shrink across passes -- measured as ROP/JOP/COP
    gadget counts, reusable basic blocks, and the number of historical CVEs whose code was removed --
    and are size, gadget, and CVE metrics being tracked together rather than relying on size alone?
  context: 'This Harden measurement focuses on attacker utility rather than byte size. Count ROP/JOP/COP
    gadgets and reusable basic blocks before vs. after (residual reachable blocks remain exploitable even
    under CFI) and count historical CVEs whose code was eliminated. Gadget reduction of >71% is achievable.
    Because size and gadget reduction are only weakly correlated, tracking a single metric misleads; report
    all three together. A weak gadget/CVE reduction despite size reduction (or vice versa) reveals that
    the hardening benefit is smaller than it appears. References: [Block Oriented Programming](https://nebelwelt.net/publications/files/18CCS.pdf)
    (code: https://github.com/HexHive/BOPC); [Less is More](https://www.usenix.org/conference/usenixsecurity19/presentation/azad);
    [Quach et al.](https://www.usenix.org/conference/usenixsecurity18/presentation/quach); [A Broad Comparative
    Evaluation of Software Debloating Tools](https://arxiv.org/abs/2312.13274) (harness: https://github.com/trailofbits/debloating-benchmark).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'gadget_delta = gadgets(before) - gadgets(after)

      gadget_pct = gadget_delta / gadgets(before) * 100

      cve_removed = count(historical_cves where code_removed(after))

      emit(app, size_pct, gadget_pct, cve_removed)

      IF gadget_pct < threshold OR cve_removed == 0 THEN alert(''weak surface reduction'', app)'
- question: Are reachable function counts, code-section sizes, and cyclomatic complexity per application
    branch and release train drifting upward in a way that is inconsistent with commit/churn volume, indicating
    a hardening regression?
  context: 'This Harden trend check baselines reachable function counts, .text sizes, and complexity by
    branch/release train, then detects upward drift that commit churn does not explain. Function-level
    debloating typically yields ~46% smaller code and ~50% lower complexity, so a reachable-count increase
    without commensurate feature additions signals that elimination effectiveness has regressed between
    releases. Use churn as the explanatory covariate: drift far above what churn predicts is the alarm
    condition and warrants investigating recent pipeline/config changes. References: [Less is More](https://www.usenix.org/conference/usenixsecurity19/presentation/azad).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = rolling_baseline(reachable_funcs, text_size, complexity) by branch, release_train

      expected = model(churn)  // commits/lines changed

      drift = current - baseline

      IF drift > expected + k*stddev THEN alert(''hardening regression drift'', app, branch, drift)'
- question: After elimination passes, are build/test-suite pass rates holding and are runtime safe-stub
    hits (a removed-but-reachable path being executed) occurring, which would indicate over-aggressive
    or incorrect debloating?
  context: 'This Harden failure-mode signal is distinct from under-elimination alarms: it watches for
    elimination that went too far or was unsound. Monitor build and test-suite pass rates after passes
    and count safe-stub hits at runtime, where a stub hit means a path that was removed was actually reached.
    Rising test-failure or stub-hit rates flag over-aggressive or incorrect elimination (including silently
    stripping security-relevant code). Treat these as separate alarms from the size/reachability under-elimination
    checks so both directions of failure are visible. References: [Brown et al.](https://arxiv.org/abs/2312.13274);
    [CARVE](https://arxiv.org/abs/1907.02180).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'test_pass_rate = passed / total per build

      stub_hits = count(runtime_events where type == ''safe_stub_hit'') per app

      IF test_pass_rate < baseline_pass_rate - delta THEN alert(''soundness regression'', build)

      IF stub_hits > 0 THEN alert(''over-elimination at runtime'', app, stub_hits)'
- question: Do weekly artifact metrics (binary size, reachable-function count, gadget count, complexity)
    stay within a forecast band given code churn, and when an artifact exceeds the forecast, what are
    the top contributing features driving the suspected hardening regression?
  context: This Harden machine-learning check trains time-series/forecasting models on weekly binary-size,
    reachable-function, gadget-count, and complexity metrics with code churn as a covariate, and alerts
    when an artifact breaches the forecast band. The alert should surface the top-3 contributing features
    (e.g., .text size delta, gadget-count delta, churn) for triage. Critically, validate forecasts against
    the deterministic reachable-set ground truth so the model never overrides the flag-enforcement and
    reachability floors -- ML augments, it does not replace, the symbolic checks.
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = forecast(metrics_weekly, covariate=churn)  // size, reach_funcs, gadgets, complexity

      band = model.predict_interval(next_week)

      IF actual NOT IN band THEN alert(''footprint anomaly'', artifact, top3_features(actual, band))

      assert reconcile_with(reachable_set_ground_truth)  // never override deterministic floors'
- question: Which code/functions are predicted safely removable by learning-guided reduction, do those
    removal decisions agree with the static reachability ground truth, and are the per-statement/per-function
    decisions emitted as explainable evidence for audit?
  context: 'This Harden machine-learning audit uses learning-guided reduction to predict and verify which
    code is safely removable. Reinforcement-learning search can reduce programs to a functionality spec
    up to 7.1x faster than search baselines while shrinking gadgets, and control-flow path-completion
    infers complementary reachable code to avoid falsely labeling live code as ''dead''. Emit per-statement/per-function
    removal decisions with their top-3 contributors as explainable evidence, and gate every decision against
    the static reachability ground truth to bound false negatives -- so the model helps prioritize removals
    without risking removal of needed (security-relevant) code. References: [CHISEL](https://www.cis.upenn.edu/~mhnaik/papers/ccs18.pdf)
    (code: https://github.com/aspire-project/chisel); [Razor](https://www.usenix.org/conference/usenixsecurity19/presentation/qian)
    (code: https://github.com/cxreet/razor).'
  answer_sources:
  - Compiler build logs
  - Linker map files
  - Static Analysis Tool reports
  - Build artifact manifests
  - Binary symbol/import tables
  - Call-graph / reachability analysis output
  - Gadget analysis reports (ROP/JOP/COP)
  - Software composition (SBOM)
  - Windows Event ID 4688
  - 'NAI: CI/CD pipelines and build servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "removable = rl_reduce(program, functionality_spec)         // CHISEL-style\ncompleted = path_completion(control_flow)\
      \                  // Razor-style, avoid false-dead\nFOR decision IN removable:\n  IF decision.target\
      \ IN reachable_set THEN reject(decision, 'reachable - do not remove')\n  ELSE emit_explainable(decision,\
      \ top3_contributors)"
