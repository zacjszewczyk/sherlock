name: 'D3-DCE: Dead Code Elimination'
id: 48bc8a40-01cd-424d-8bd4-269e7d7bff95
description: Dead Code Elimination (DCE) is an application-hardening countermeasure that removes unreachable
  or 'dead' code from compiled software so it cannot be accidentally or maliciously forced to execute.
  This playbook helps an analyst verify that dead-code-elimination and debloating passes are actually
  doing their job across the software supply chain. Drawing on build, link, and binary-analysis telemetry
  (CI/CD logs, linker maps, symbol/import tables, static-analysis and call-graph reports, gadget analysis,
  and SBOMs), it lets you confirm that optimizer flags were enforced in every production build, that the
  shipped binary's reachable function/syscall surface matches a precise call-graph-derived reachable set,
  that required unreachable-code (CWE-561) reports were produced, and that passes measurably shrank the
  reachable code, ROP/JOP/COP gadget surface, and historical-CVE exposure rather than just byte size.
  It also watches for the 'correctness-security gap' in which an optimization preserves functionality
  but silently strips security-relevant code, for over-elimination that breaks needed paths (safe-stub
  hits, test-suite regressions), and for hardening regressions that drift upward across releases. The
  questions below cover symbolic-logic enforcement, statistical effectiveness/trend measurement, and machine-learning
  forecasting and learning-guided removal auditing, each gated against deterministic reachability ground
  truth.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
