name: 'D3-ODM: Operational Dependency Mapping'
id: 4974903a-b257-4da3-b533-55950a5dc2dc
description: >-
  This playbook helps an analyst discover, validate, and monitor the operational dependencies between
  critical business services and the IT infrastructure that supports them. It builds a directed dependency
  graph from observed network and host communication telemetry (Zeek conn.log and Windows Filtering Platform
  connection events), normalizes flows obscured by NAT, reverse proxies, and load balancers, and enforces
  deterministic invariants for known-critical edges. It then layers statistical analysis to rank high-volume
  critical paths, profile per-edge failure and blocked rates, and detect dependency drift, and finally
  applies machine learning - community detection, graph embeddings/link prediction, and time-series forecasting
  - to reveal undocumented service boundaries, infer latent or anomalous edges, and validate dependency
  stability. Use it to understand which assets a given business service relies on, detect unauthorized
  redirection or rogue dependencies introduced by an attacker, and assess downstream mission impact when
  an asset fails or is compromised.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: For a known set of servers hosting a specific critical business service, what outbound connections
    do they make, and what does the resulting first-hop dependency graph (nodes = hosts, edges = confirmed
    connections labeled by destination port/service) look like?
  context: 'This is the foundational step of operational dependency mapping for the Model mission: establishing
    a static, rule-based map of which assets a business service actually talks to. Start from an authoritative
    list of servers that host a service (e.g., ''Customer Billing''), then query Zeek conn.log (id.orig_h,
    id.resp_h, id.resp_p, service, proto) and Windows Event ID 5156 for all outbound connections over
    the last 30 days. Build a directed graph in which nodes are IP addresses and each edge is a confirmed
    connection labeled with its destination port/service. The result is the activity -> performer -> asset
    layering at the heart of D3FEND Operational Dependency Mapping. A complete graph means you understand
    the service''s first-hop reliance; gaps or unexpected edges are leads for further investigation.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 30 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      servers = service_inventory['Customer Billing']
      edges = {}
      for conn in zeek_conn_log[last_30d]:
        if conn.id_orig_h in servers:
          edges[(conn.id_orig_h, conn.id_resp_h, conn.id_resp_p, conn.service)] += 1
      # also include WinEventID 5156 outbound where source_address in servers
      graph = build_directed_graph(nodes=ips, edges=edges, label=port/service)
      emit graph  # activity -> performer -> asset dependency map
- question: When flows traverse NAT devices, reverse proxies, or load balancers, are the dependency edges
    being attributed to the true logical source and destination rather than to the intermediary's VIP/proxy
    address?
  context: 'Naive IP:port edges misattribute dependencies whenever traffic passes through an intermediary,
    making the graph reflect the proxy or virtual IP instead of the real service-to-service relationship.
    Before drawing edges, normalize these flows: on each intermediary host correlate inbound and outbound
    socket pairs (matching ports and timestamps across Zeek conn.log and Windows Event ID 5156) to stitch
    together the genuine source and destination. This is essential for the Model mission because an inaccurate
    dependency map leads to wrong impact analysis and missed unauthorized redirections. A correctly stitched
    graph shows true logical dependencies; failure to stitch produces phantom hubs centered on load balancers
    and proxies.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 30 days
  queries:
  - technology: Zeek/pseudocode
    query: "intermediaries = {nat_gw, reverse_proxies, load_balancers}\nfor host in intermediaries:\n\
      \  for inbound in flows(dst=host): \n    for outbound in flows(src=host):\n      if abs(inbound.ts\
      \ - outbound.ts) < window and ports_match(inbound, outbound):\n        true_edge = (inbound.id_orig_h,\
      \ outbound.id_resp_h, outbound.id_resp_p)\n        graph.add_edge(true_edge)  # logical, not VIP/proxy"
- question: Are all known-critical dependency edges (for example, app-tier to database VIP on tcp/1433)
    currently carrying successful traffic, and has any new edge to or from a critical asset just appeared?
  context: This deterministic floor catches dependency outages and unauthorized redirection independent
    of any statistical or ML model. Maintain a watchlist of must-exist critical edges and alert when a
    watchlisted edge yields zero successful connections (Zeek conn_state in {SF, S1, RSTO with data};
    not S0/REJ) over a defined window such as 15 minutes during business hours - this signals a broken
    dependency. Also alert when a NEW edge to or from a critical asset first appears, which can indicate
    misconfiguration or attacker-introduced redirection. For the Model mission this guarantees an auditable,
    always-on check on the integrity of the dependency model regardless of baseline drift.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 5157
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 24 hours (sliding 15-minute windows during business hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      critical_edges = watchlist  # e.g., (app_tier -> db_vip, tcp/1433)
      for edge in critical_edges:
        ok = count(zeek_conn where edge and conn_state in {SF,S1,RSTO_with_data})
        if ok == 0 over last 15min (business hours): alert('CRITICAL_DEPENDENCY_DOWN', edge)
      for conn in stream:
        if (conn involves critical_asset) and edge not in known_edges:
          alert('NEW_EDGE_TO_CRITICAL_ASSET', conn)
- question: Given a failing or compromised node, which downstream business services depend on it, and
    what is the ranked impact-propagation path from that asset to the affected service?
  context: Once the directed dependency graph exists, you can answer the mission-critical question 'if
    this asset fails, what breaks?' by traversing edges from a failing/compromised node to its dependents,
    ranking candidate root causes and downstream impact in the style of service-call-graph traversal (MicroHECL).
    Surface the resolved path during triage so responders immediately see which business service is affected
    by a given asset and which upstream asset most likely caused an observed service degradation. For
    the Model mission this turns a raw graph into actionable impact analysis and root-cause prioritization.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      def impact_paths(failed_node, graph):
        visited = []; queue = dependents(failed_node)
        while queue:
          n = queue.pop(); visited.append(n); queue += dependents(n)
        rank by edge_weight / criticality
        return ranked paths failed_node -> business_service
      emit resolved_path in triage
- question: Which dependency edges between application and database servers are the highest-volume and
    highest-frequency, and should therefore be marked high-priority critical paths in the operational
    model?
  context: Not all dependencies matter equally; the busiest edges usually carry the core business transaction
    flow. Analyze Zeek conn.log connections between application and database servers and, for each source-destination
    pair, compute connection frequency (count/min), total volume (sum of orig_bytes + resp_bytes), and
    the orig:resp byte ratio. Flag dependencies above the 95th percentile for BOTH frequency and volume
    as high-priority edges. Derive percentile thresholds per-environment from a 30-day baseline, and use
    the byte ratio to distinguish client vs. server roles (asymmetric ratios reveal request/response direction).
    For the Model mission this prioritizes monitoring and protection effort on the edges whose loss would
    most affect the business.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = percentiles(conn_log[last_30d], by=(src,dst))
      for (src,dst) in app_to_db_pairs:
        freq = count/min; vol = sum(orig_bytes+resp_bytes); ratio = orig_bytes/resp_bytes
        if freq > p95(freq) and vol > p95(vol):
          mark_edge(src,dst, priority='HIGH', role=infer_from(ratio))
- question: For each dependency edge, what is the rate of failed or blocked connections, and does any
    edge's failed-to-successful ratio exceed its normal baseline by a robust margin?
  context: Failure and block rates are a distinct signal from new-edge detection and reveal degraded or
    broken dependencies and misconfigurations rather than genuinely new ones. For each edge compute failed/blocked
    connection rate using Zeek conn_state in {S0 (no reply), REJ (rejected), RSTO/RSTR (resets)} plus
    Windows Event ID 5157 (WFP blocked) and firewall deny logs. Baseline the normal failure ratio per
    edge and alert when an edge's failed:successful ratio exceeds baseline by a robust threshold (e.g.,
    modified z-score |score| > 3.5). A spike implies a dependency that is breaking, a host that is down,
    or a firewall change blocking required traffic - all material to keeping the Model accurate and the
    service healthy.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 5157
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 90 days (baseline 30 days, evaluate per-day)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for edge in edges:
        failed = count(conn_state in {S0,REJ,RSTO,RSTR}) + count(WinEventID 5157 block) + fw_deny
        succ = count(conn_state in {SF,S1})
        ratio = failed/(succ+1)
        mz = 0.6745*(ratio - median_base)/MAD_base
        if abs(mz) > 3.5: alert('DEGRADED_DEPENDENCY', edge, ratio)
- question: Has the stable set of downstream dependencies (destination IPs/ports) for each critical service
    changed - has a new edge appeared or a previously stable edge disappeared?
  context: Dependency drift detection keeps the operational model current and flags suspicious change.
    Track the stable set of downstream dependencies for each critical service over a rolling window and
    alert when a new edge appears or a previously stable edge vanishes, using a robust change measure
    (modified z-score / MAD over per-day edge sets) to suppress noise. Drift may indicate a legitimate
    architecture change, unauthorized redirection by an attacker, or simply a stale model. Include the
    added/removed edge and its first-seen/last-seen timestamps in the alert so an analyst can quickly
    judge whether the change is expected. For the Model mission this is the early-warning mechanism for
    both model decay and adversary tampering.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 90 days (rolling per-day edge sets)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for service in critical_services:\n  daily_edges = {day: set(downstream(dst_ip,dst_port))\
      \ for day in window}\n  stable = intersection_over_window(daily_edges)\n  today = daily_edges[today]\n\
      \  added = today - stable; removed = stable - today\n  if robust_change(added,removed via MAD):\
      \ \n    alert('DEPENDENCY_DRIFT', service, added, removed, first_seen, last_seen)"
- question: When servers are clustered by their weighted communication graph, do the resulting functional
    service groups match documented application boundaries, and which hosts fall outside any cluster as
    candidate rogue or undocumented dependencies?
  context: Community detection reveals undocumented application/service boundaries that no inventory captures.
    Build a weighted graph where edge weight combines connection frequency and data volume between server
    pairs, then apply Louvain modularity optimization or DBSCAN density clustering to group servers into
    functional clusters. DBSCAN noise points - hosts fitting no group - are candidate rogue or undocumented
    dependencies worth investigating. Validate cluster quality with modularity and stability metrics and
    be aware of resolution limits noted in the community-detection literature. Every alert must list the
    top-3 features driving membership or outlier status (e.g., dominant destination port, byte volume,
    edge rarity) so the result is explainable. For the Model mission this surfaces hidden structure and
    shadow IT that the explicit map misses.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      W = weighted_graph(edge_weight = f(freq, volume))
      clusters = louvain(W)   # or DBSCAN(distance=1/weight)
      for host in noise_points(DBSCAN):
        alert('ROGUE_UNDOCUMENTED_DEPENDENCY', host, top3_features=[dominant_port, byte_volume, edge_rarity])
      validate(modularity, stability)
- question: Using unsupervised node embeddings of the host/service communication graph, which latent/indirect
    dependencies are missing from the explicit graph, and which newly observed edges have low link-prediction
    probability (i.e., are anomalous)?
  context: Graph embeddings extend the map beyond directly observed edges and score the plausibility of
    new ones. Compute unsupervised node embeddings of the communication graph with DeepWalk or node2vec
    and use link prediction to (a) infer latent/indirect dependencies missing from the explicit graph
    and (b) rarity-score newly observed edges, flagging low link-probability new edges as anomalous. For
    dynamic environments use inductive GraphSAGE to embed newly observed hosts without retraining and
    classify them into an existing service cluster or as anomalous dependency growth. Report the top-3
    contributing features (nearest cluster, edge rarity score, destination service) in the alert. For
    the Model mission this both completes the dependency picture and detects an attacker quietly establishing
    new, improbable connections.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      emb = node2vec(comm_graph)   # or DeepWalk
      for new_edge in newly_observed_edges:
        p = link_prediction(emb, new_edge)
        if p < threshold: alert('ANOMALOUS_EDGE', new_edge, rarity=1-p, top3=[nearest_cluster, rarity, dst_service])
      latent = [e for e in all_pairs if link_prob(e)>high and e not in explicit_graph]  # inferred deps
      # dynamic: GraphSAGE.embed(new_host) -> classify cluster or 'anomalous growth'
- question: When each service is forecast as a multivariate time series (CPU/memory/network plus per-edge
    volume), which edges show large forecast residuals indicating an unstable or spurious dependency?
  context: Time-series forecasting validates that mapped dependency edges are stable and real rather than
    transient or spurious. Treat each service as a graph node emitting CPU/memory/network and per-edge
    volume time series and forecast them with a graph/temporal model; large forecast residuals on an edge
    indicate an unstable or spurious dependency. Use the ChronoGraph dataset and methodology (production
    microservice dependency graph + multivariate metrics + annotated anomalies) as a template. Surface
    the top-3 residual-driving signals (edge, metric, deviation magnitude) in the alert for explainability.
    For the Model mission this distinguishes durable structural dependencies from noise and flags edges
    whose behavior suddenly deviates from learned norms.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Core network switches, Application server subnets, Database server subnets'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      for node in services:
        ts = multivariate(cpu, mem, net, per_edge_volume)
        pred = graph_temporal_forecast(ts)   # ChronoGraph-style
        resid = abs(actual - pred)
        for edge in node.edges:
          if resid[edge] > dynamic_threshold:
            alert('UNSTABLE_DEPENDENCY', edge, top3=[edge, metric, deviation_magnitude])
