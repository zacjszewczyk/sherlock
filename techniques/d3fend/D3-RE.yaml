name: 'D3-RE: Restore Email'
id: 3a964013-ec5c-4154-8ed9-d750c4decd0b
description: Investigate whether email restoration activity in your Exchange (on-premises and Online)
  and Microsoft 365 environment is a controlled, authorized, logged, and verifiable process, and detect
  abuse of restore capability by an adversary. Within the Restore (D3-RST) tactic this playbook helps
  an analyst confirm that each mailbox or message recovery was (1) invoked by an authorized responder
  holding the rarely-assigned Mailbox Import Export RBAC role, from an admin workstation, inside an approved/ticketed
  change window; (2) targeted the legitimate mailbox owner rather than an attacker-controlled destination;
  (3) transferred expected data volumes and completed within RTO/SLA recovery targets; and (4) that the
  recovered content was subsequently accessed only by the intended entity and not read, copied, exported,
  or deleted by a non-owner. It combines deterministic detection rules over process, PowerShell, authentication,
  and Exchange/Microsoft 365 audit logs with statistical baselining of transfer volume, duration, time-to-recovery,
  and failure rates, and machine-learning sequence/anomaly/forecasting models, so the analyst can both
  measure restoration effectiveness and catch misuse of the restore process per NIST SP 800-184 and CISA
  incident/vulnerability response playbooks.
type: technique
related:
- tactic_id: D3-RST
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Can we confirm that each email restoration command (New-MailboxRestoreRequest, Restore-Mailbox,
    or a restore workflow targeting a recovery database) was invoked by an account that actually holds
    the Mailbox Import Export RBAC role, ran from an approved admin workstation, and is corroborated by
    both a successful interactive/network logon and a matching change-making record in the admin/unified
    audit log?
  context: 'Within the Restore (D3-RST) tactic, the foundational question is whether a given restore was
    authorized at all. Monitor execution of email restoration tooling in Windows Event ID 4688 and PowerShell
    Event ID 4104 (for example New-MailboxRestoreRequest, Restore-Mailbox, or workflows targeting a recovery
    database) and correlate it with a successful Windows Event ID 4624 logon by an account holding the
    rarely-assigned Mailbox Import Export RBAC role, within an approved/ticketed change window. Because
    the cmdlet requires this role and it is unassigned to any role group by default, every legitimate
    invocation is a high-signal, low-volume event. Corroborate the same action against the change-making
    entry in the Exchange admin audit log (Search-AdminAuditLog) or Microsoft 365 Unified Audit Log (Search-UnifiedAuditLog).
    A positive match across process, authentication, and audit logs is the expected, authorized path;
    a missing corroboration is the first sign the restore was not a sanctioned recovery. References: [Microsoft
    New-MailboxRestoreRequest](https://learn.microsoft.com/en-us/powershell/module/exchange/new-mailboxrestorerequest)
    and [Microsoft admin audit log](https://learn.microsoft.com/en-us/exchange/security-and-compliance/exchange-auditing-reports/view-administrator-audit-log).'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Zeek conn.log
  - Exchange admin audit log (Search-AdminAuditLog)
  - Microsoft 365 Unified Audit Log (Search-UnifiedAuditLog)
  - Exchange mailbox audit log
  - 'NAI: Email servers (Exchange on-premises/Online), backup and recovery infrastructure (on-premise
    or cloud), recovery databases, and administrator workstations from which restore tooling is invoked.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_creation (Windows EID 4688) OR powershell (Windows EID 4104)

      | where cmdline matches (New-MailboxRestoreRequest|Restore-Mailbox|TargetDatabase=recovery_db)

      | join auth (Windows EID 4624 success) on account, host within 1h

      | lookup rbac_roles on account | eval has_role = role contains "Mailbox Import Export"

      | join audit (Search-AdminAuditLog OR Search-UnifiedAuditLog) on operation, actor

      | eval authorized = has_role AND in_change_window(_time) AND host in admin_workstations AND audit_record_present

      | table _time, account, host, cmdline, has_role, audit_record_present, authorized'
- question: Are there email restoration commands that ran from non-approved accounts, from accounts lacking
    the Mailbox Import Export role, from non-admin workstations, or outside ticketed maintenance windows
    — even when the authentication itself succeeded?
  context: 'Still under the Restore (D3-RST) tactic, this question hunts for misuse of an otherwise-legitimate
    capability. Alert when restoration commands execute under any of these conditions: a non-approved
    account, an account without the Mailbox Import Export role, a non-admin workstation, or a time outside
    an approved change window — regardless of whether authentication succeeded, because a successful logon
    does not imply an authorized restore. This catches an adversary (or insider) who has obtained valid
    credentials or elevated a role specifically to recover and read someone else''s mail. The detection
    depends on correlating process, authentication, and audit logs, which in turn requires centralized,
    integrity-protected logging per NIST SP 800-92. A positive result is a successful-but-unsanctioned
    restore; a negative result confirms restores are confined to approved actors, hosts, and windows.
    References: [NIST SP 800-184](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf)
    and [NIST SP 800-92](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-92.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from restore_invocations (Windows EID 4688/4104 + admin/unified audit log)\n| lookup rbac_roles\
      \ on account | lookup approved_responders on account\n| eval unauthorized = (account not in approved_responders)\
      \ OR (NOT role contains \"Mailbox Import Export\")\n    OR (host not in admin_workstations) OR (NOT\
      \ in_change_window(_time))\n| where unauthorized\n| table _time, account, host, cmdline, role, in_change_window(_time)"
- question: For each restore job, does the destination (TargetMailbox / TargetRootFolder) match the original
    source mailbox owner — or was the recovered mail redirected into a different mailbox, or were flags
    like AllowLegacyDNMismatch or cross-mailbox redirection used that could route a victim's mail to an
    attacker-controlled mailbox?
  context: 'Under the Restore (D3-RST) tactic, verifying the restore target is critical because the most
    damaging abuse of a restore is recovering a victim''s mailbox into an attacker-controlled destination.
    Parse restore-job parameters from PowerShell Event ID 4104 and the admin audit log and alert when
    the TargetMailbox or TargetRootFolder differs from the source mailbox owner, or when AllowLegacyDNMismatch
    or cross-mailbox redirection options are present. These parameters legitimately exist for edge cases
    but are strong indicators of malicious recovery when the target identity does not equal the source
    identity. A positive finding is a restore whose destination owner differs from the source owner; a
    negative result confirms recovered mail was returned to its rightful owner. References: [Microsoft
    New-MailboxRestoreRequest](https://learn.microsoft.com/en-us/powershell/module/exchange/new-mailboxrestorerequest).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from restore_jobs (Windows EID 4104 OR admin audit log Search-AdminAuditLog)

      | eval src_owner = SourceMailbox.owner, dst_owner = TargetMailbox.owner

      | eval mismatch = (dst_owner != src_owner) OR AllowLegacyDNMismatch == true OR cross_mailbox_redirect
      == true

      | where mismatch

      | table _time, actor, SourceMailbox, TargetMailbox, TargetRootFolder, AllowLegacyDNMismatch'
- question: After a mailbox restore completes, is the recovered content accessed only by its legitimate
    owner — or does a non-owner principal read (FolderBind/MessageBind), move, copy, export (New-MailboxExportRequest),
    or delete (SoftDelete/HardDelete) the restored data?
  context: 'Completing the Restore (D3-RST) verification chain, this question confirms restored data reaches
    only the intended entity. Once a restore finishes, monitor mailbox audit events for the recovered
    mailbox (FolderBind, MessageBind, Move, Copy, SoftDelete, HardDelete, and admin/delegate actions)
    and alert when a non-owner principal reads, copies, exports, or deletes the restored content. A New-MailboxExportRequest
    against freshly restored content is especially suspicious because it stages the data for removal from
    the environment. This is the post-restore counterpart to confirming the target owner: even a correctly-targeted
    restore can be abused if a delegate or admin then accesses it. A positive result is non-owner access
    to restored content; a negative result confirms only the owner touched the recovered mail. References:
    [Microsoft Purview mailbox auditing](https://learn.microsoft.com/en-us/purview/audit-mailboxes).'
  answer_sources: *id001
  range: 'Last 90 days (event-centered: monitor from restore-completion time forward)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from mailbox_audit (Exchange mailbox audit log / Search-UnifiedAuditLog)

      | where mailbox in recently_restored_mailboxes

      | where operation in (FolderBind, MessageBind, Move, Copy, SoftDelete, HardDelete, New-MailboxExportRequest)

      | eval non_owner = (logon_user != mailbox_owner)

      | where non_owner

      | table _time, mailbox, logon_user, logon_type, operation'
- question: For each restoration job between backup and email servers, do the connection duration and
    bytes transferred (and the bytes-in/bytes-out ratio) fall within the historical norm for that backup/mail-server
    pair — or does a job exceed mean +/- 3 standard deviations, signaling a failure, throttling, or anomalous
    data movement?
  context: 'Supporting the Restore (D3-RST) tactic with a statistical lens, this method baselines the
    physical data movement of restores. From Zeek conn.log, derive connection duration and bytes transferred
    (and the bytes-in/bytes-out ratio) for each restoration job between backup and email servers. Compute
    the mean and standard deviation per backup/mail-server pair from historical jobs (recompute monthly)
    and apply Shewhart 3-sigma control limits, flagging jobs beyond mean +/- 3 standard deviations. Dataset-specific
    limits are essential rather than a fixed byte threshold, because normal restore sizes vary widely
    by mailbox. An out-of-control job may indicate a failed/throttled transfer or anomalous data movement
    such as a much larger-than-expected recovery. A positive result is a job outside the control limits;
    a negative result confirms the transfer matched historical behavior. References: [NIST/SEMATECH control
    charts](https://www.itl.nist.gov/div898/handbook/pmc/section3/pmc31.htm).'
  answer_sources: *id001
  range: Last 90 days (recompute baseline monthly)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from zeek conn.log

      | where orig_h in backup_servers AND resp_h in mail_servers (or vice versa)

      | eval bytes = orig_bytes + resp_bytes, ratio = orig_bytes / (resp_bytes+1)

      | stats by backup_mail_pair: mean(duration) mu_d, stdev(duration) sd_d, mean(bytes) mu_b, stdev(bytes)
      sd_b

      | eval z_dur = (duration-mu_d)/sd_d, z_bytes = (bytes-mu_b)/sd_b

      | where abs(z_dur) > 3 OR abs(z_bytes) > 3

      | table _time, backup_mail_pair, duration, bytes, ratio, z_dur, z_bytes'
- question: What is the Time-To-Recovery (TTR) for each email restoration — the duration between the restore
    start and completion events — and is the rolling TTR series drifting toward or exceeding the RTO/SLA
    target (e.g., 4 hours) defined by contingency planning?
  context: 'This question operationalizes the FFIR about restoration effectiveness under the Restore (D3-RST)
    tactic. Calculate the duration between the restoration start event and the completion event for email
    services and compare against the RTO/SLA target (for example, 4 hours) defined by contingency planning
    per NIST SP 800-34 Rev 1. Rather than only checking a static threshold, apply EWMA or CUSUM control
    charts to the rolling TTR series so small, persistent drift toward the SLA limit is detected earlier
    than a hard cutoff would allow, and alert when the rolling average approaches or exceeds the target.
    A positive result is a rising TTR trend or an SLA breach indicating recovery capability is degrading;
    a negative result confirms restores are completing within recovery objectives. References: [NIST SP
    800-34 Rev 1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf) and
    [NIST/SEMATECH control charts](https://www.itl.nist.gov/div898/handbook/pmc/section3/pmc31.htm).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from restore_events (admin/unified audit log)

      | transaction by restore_request_id startswith=Created endswith=Completed

      | eval ttr_hours = (completion_time - start_time)/3600

      | timechart ewma(ttr_hours) as ttr_ewma, cusum(ttr_hours) as ttr_cusum

      | eval rto = 4

      | where ttr_ewma >= rto*0.8 OR ttr_hours > rto

      | table _time, restore_request_id, ttr_hours, ttr_ewma, rto'
- question: Are restore failure-mode signals — failed/blocked restore connections, failed logons by restore
    accounts (Event ID 4625), and failed/suspended/resumed restore-request states or low partial-completion
    percentages — spiking above their baseline rate, indicating corruption, throttling, or evasive activity?
  context: 'Under the Restore (D3-RST) tactic, failure modes are tracked as distinct first-class metrics
    rather than buried in success telemetry. Capture failed/blocked restore connections (Zeek conn.log
    conn_state) and failed logons by restore accounts (Windows Event ID 4625), alongside failed, suspended,
    or resumed restore-request states (Set-MailboxRestoreRequest / Resume-MailboxRestoreRequest and partial-completion
    percentage) from the admin audit log. Baseline the normal failure rate and alert on spikes. A surge
    can indicate data corruption, infrastructure throttling, or an adversary repeatedly probing or interfering
    with the restore process. A positive result is an abnormal cluster of restore failures or repeated
    suspend/resume cycles; a negative result confirms restores are completing cleanly at the expected
    rate. References: [Microsoft admin audit log](https://learn.microsoft.com/en-us/exchange/security-and-compliance/exchange-auditing-reports/view-administrator-audit-log).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from (zeek conn.log where conn_state in (REJ,RSTO,S0) AND pair in backup_mail_pairs)\n  OR\
      \ (Windows EID 4625 where account in restore_accounts)\n  OR (admin audit log where operation in\
      \ (Set-MailboxRestoreRequest, Resume-MailboxRestoreRequest) OR status=Failed OR percent_complete\
      \ < 100)\n| stats count as failures by signal_type, _day\n| eventstats avg(failures) as base, stdev(failures)\
      \ as sd by signal_type\n| where failures > base + 3*sd\n| table _day, signal_type, failures, base"
- question: Does the sequence of log events for a restore job follow the normal restore workflow, or are
    there out-of-order steps or abnormal numeric parameters (duration, bytes) that an LSTM sequence model
    flags as deviating — and which specific log key or parameter is responsible?
  context: 'Adding a machine-learning layer to the Restore (D3-RST) tactic, this method models the normal
    ordering and parameter distribution of restore-job log events. Train an LSTM (DeepLog-style) on the
    normal sequence of restore-job log events and on the numeric parameter distributions (duration, bytes)
    so it can flag out-of-order steps or abnormal transfer sizes, surfacing the offending log key or parameter
    for explainable triage rather than an opaque score. It runs in parallel with the deterministic rules
    above, which remain the detection floor. A positive result is a restore whose event sequence or parameters
    fall outside the learned model — for example a skipped authorization step or an anomalously large
    transfer; a negative result confirms the workflow matched its learned normal shape. References: [DeepLog,
    Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources: *id001
  range: Last 90 days (train on a longer clean baseline; score recent jobs)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_lstm_logkey(restore_job_event_sequences + numeric_params[duration,bytes])\n\
      for job in recent_restore_jobs:\n    pred = model.next_key_distribution(job.sequence)\n    if observed_key\
      \ not in pred.topk OR param_outlier(job, duration, bytes):\n        emit_alert(job_id, offending_logkey=model.explain(job),\
      \ params=[duration,bytes])"
- question: When an Isolation Forest scores each restore job over engineered features (bytes transferred,
    duration, hour-of-day, initiating actor, number of target mailboxes/items, success/failure state),
    which jobs are rare outliers, and what are the top-3 contributing features (e.g., off-hours, unusually
    large volume, unfamiliar actor) for each?
  context: 'This machine-learning method gives the Restore (D3-RST) tactic an explainable per-job outlier
    score. Engineer features for each restore job — bytes transferred, duration, hour-of-day, initiating
    actor, number of target mailboxes/items, and success/failure state — and run an Isolation Forest to
    surface rare jobs. Critically, each alert must include the top-3 contributing features (for example
    off-hours execution, unusually large volume, an unfamiliar actor) so the analyst understands why a
    job was flagged rather than receiving a bare anomaly score. This complements the deterministic rules
    by catching combinations of mildly-unusual attributes that no single rule would trip. A positive result
    is a restore job whose feature combination looks rare relative to the fleet; a negative result confirms
    the job resembles routine recoveries. References: [Isolation Forest, Liu et al.](https://ieeexplore.ieee.org/document/4781136)
    and methodological guidance in [Chalapathy & Chandola](https://arxiv.org/abs/1901.03407).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [bytes, duration, hour_of_day, initiating_actor, num_target_mailboxes, num_items,\
      \ success_state]\nX = build_vectors(restore_jobs, features)\niso = IsolationForest().fit(X_baseline)\n\
      scores = iso.score_samples(X)\nfor j in where(scores < threshold):\n    emit_alert(j.job_id, top3=feature_attribution(iso,\
      \ j, k=3))"
- question: Across the restore telemetry as a whole (concurrent jobs, aggregate restored volume, throughput,
    error counts over time), does an LSTM encoder-decoder's reconstruction error exceed the normal-data
    threshold — flagging mass-restore events, throttling, or failure storms — and which dimension drives
    the error?
  context: 'This method detects collective anomalies in multivariate restore telemetry under the Restore
    (D3-RST) tactic, where no single job looks abnormal but the aggregate pattern does. Train an LSTM
    encoder-decoder on normal multivariate restore telemetry — concurrent job count, aggregate restored
    volume, throughput, and error counts over time — and alert when reconstruction error exceeds a threshold
    learned from normal data, reporting per-dimension error for attribution. This catches mass-restore
    events (e.g., an adversary bulk-recovering many mailboxes), system-wide throttling, or failure storms
    that only manifest at the fleet level. A positive result is a window whose reconstruction error spikes
    with, say, concurrent-jobs and aggregate-volume as the dominant contributing dimensions; a negative
    result confirms overall restore activity matched learned normal behavior. References: [Malhotra et
    al.](https://arxiv.org/abs/1607.00148).'
  answer_sources: *id001
  range: Last 90 days (train on a longer clean baseline; score recent windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = multivariate([concurrent_jobs, aggregate_volume, throughput, error_count]) per time_window\n\
      ae = train_lstm_encoder_decoder(series_baseline)\nfor w in recent_windows:\n    err = reconstruction_error(ae,\
      \ w)\n    if err > normal_threshold:\n        emit_alert(w, per_dimension_error=ae.dimension_errors(w))"
- question: Based on a Holt-Winters/ETS forecast of restore job count and restored volume, are upcoming
    demand spikes predicted to fall outside the confidence bounds, and where must capacity be adjusted
    to keep restorations within RTO targets?
  context: 'Closing the Restore (D3-RST) tactic with a forward-looking view, this method forecasts restore
    demand and infrastructure load. Use a Holt-Winters / ETS time-series model on restoration job count
    and restored volume to predict near-term workload with prediction intervals, identify demand spikes
    that fall outside the confidence bounds, and then prioritize the capacity adjustments needed to maintain
    RTO targets. This directly supports the FFIR about restoring email services effectively and efficiently:
    if demand is projected to exceed capacity, recovery objectives are at risk before the surge even arrives.
    A positive result is a forecasted spike beyond the prediction interval that warrants pre-emptive capacity
    planning; a negative result confirms predicted demand stays within sustainable bounds. An unexpected
    real-time spike beyond the forecast can also itself indicate a mass-restore incident. References:
    [Hyndman & Athanasopoulos, Forecasting: Principles and Practice](https://otexts.com/fpp3/holt-winters.html).'
  answer_sources: *id001
  range: Last 90 days (forecast near-term horizon)
  queries:
  - technology: SIEM/ML pseudocode
    query: "ts_jobs = timeseries(restore_job_count), ts_vol = timeseries(restored_volume)\nmodel = HoltWinters_ETS().fit(ts_jobs,\
      \ ts_vol)\nforecast, pi = model.predict(horizon=near_term, interval=0.95)\nfor t in forecast:\n\
      \    if observed[t] > pi.upper[t] OR forecast[t] > capacity_for_rto:\n        emit_alert(t, predicted=forecast[t],\
      \ upper=pi.upper[t], action=\"adjust_capacity\")"
