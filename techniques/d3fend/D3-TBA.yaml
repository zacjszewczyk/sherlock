  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days; correlate failure bursts to the next success within 1h
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (EventCode=4771 OR EventCode=4768 OR EventCode=4769) Result!=success

      | append [search index=signin status IN (401,403)]

      | bin _time span=5m

      | stats count AS failures BY src_ip, _time

      | where failures > threshold

      | join src_ip [search success_events]  // success following the burst'
- question: For successful Kerberos ticket requests, do any principals exhibit median ticket lifetimes
    exceeding the enterprise 95th-percentile, or RC4 issuance once an AES baseline is established?
  context: 'Statistical baselining of ticket attributes reveals anomalous issuance posture without hard-coded
    thresholds. Extract encryption types, ticket options, and lifetimes per principal from 4769/4768 success
    events, compute the enterprise 95th-percentile lifetime, and flag accounts whose median lifetime exceeds
    it (a sign of forged long-lived tickets) and any RC4 issuance after the AES baseline rate is known.
    A positive result identifies accounts deviating from the organization''s normal ticket policy. Source
    citations: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days (establish baseline over the full window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (EventCode=4769 OR EventCode=4768) Result=success

      | stats median(TicketLifetime) AS med_life BY Account, TicketEncryptionType

      | eventstats perc95(TicketLifetime) AS ent_p95

      | where med_life > ent_p95 OR TicketEncryptionType="0x17"'
- question: Are any users generating TGS requests, distinct-SPN counts, or cloud token-issuance/API-call
    volumes that exceed their baseline (mean + 3·σ, or modified Z-score |0.6745·(x−median)/MAD| > 3.5),
    indicating Kerberoasting fan-out or abnormal token use?
  context: 'Service-discovery and Kerberoasting produce a fan-out: one account suddenly requesting tickets
    for many distinct SPNs. Baseline TGS requests per user per hour, distinct-SPN count per user, and
    cloud token-issuance/API-call volume per token. Alert above mean + 3·σ, or use the MAD-based modified
    Z-score (more robust when automation skews the mean) with a threshold of 3.5. A positive result flags
    abnormal breadth or volume of token requests characteristic of reconnaissance or harvesting. Source
    citations: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf); [Modified
    Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows EventCode=4769

      | bin _time span=1h

      | stats count AS tgs_count, dc(ServiceName) AS distinct_spn BY Account, _time

      | eventstats median(tgs_count) AS med, mad(tgs_count) AS mad_v BY Account

      | eval mod_z = abs(0.6745*(tgs_count-med)/mad_v)

      | where mod_z > 3.5 OR distinct_spn > spn_threshold'
- question: For each token use, does the IP/ASN/geolocation/user-agent context yield a high anomaly score
    against the principal's historical distribution, indicating a valid (possibly stolen or forged) token
    used from an improbable context?
  context: 'A stolen or forged token is still cryptographically valid, so context is the discriminator.
    Compute a smoothed likelihood ratio over IP/ASN/geolocation/user-agent for each token use against
    the principal''s historical distribution; a high score with explainable per-feature contributions
    indicates the token is being used from an improbable context. Surface the contributing features in
    the alert. A positive result means the authentication came from a context the user has effectively
    never used, suggesting theft. Source citations: [Freeman et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/who-are-you-statistical-approach-measuring-user-authenticity.pdf).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days (historical distribution baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=signin OR index=zeek_kerberos

      | lookup user_context_baseline principal OUTPUT prob_ip prob_asn prob_geo prob_ua

      | eval score = -1*(log(prob_ip)+log(prob_asn)+log(prob_geo)+log(prob_ua))

      | where score > anomaly_threshold

      | table _time, principal, src_ip, asn, geo, user_agent, score'
- question: When building user/host authentication graphs, are there rare user→host edges where a ticket
    or token reaches a resource the account has never legitimately used?
  context: 'Authentication-graph analysis quantifies how unusual a given access is. Build user/host authentication
    graphs from ticket/token events, compute per-host in/out-degree and edge rarity, and flag rare user→host
    triples where a credential reaches resources the account never legitimately uses. Report the rare
    edge and its historical frequency for triage. A positive result highlights lateral movement or token
    misuse reaching atypical resources — a key Harden-posture gap. Source citations: [Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001);
    [Siadati & Memon](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days (graph baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=windows (EventCode=4769 OR EventCode=4624)

      | stats count AS edge_count BY user, dest_host

      | eventstats sum(edge_count) AS user_total BY user

      | eval edge_freq = edge_count/user_total

      | where edge_freq < rarity_threshold  // rare/first-time user->host edge

      | table user, dest_host, edge_count, edge_freq'
- question: Do causal login-path models (Hopper) reveal authentication paths that switch credentials mid-chain
    or reach first-time destinations lacking a benign causal source, indicating pass-the-ticket or stolen-token
    reuse?
  context: 'Causal login-path modeling reconstructs the chain of authentications and identifies paths
    where the authenticating credential changes mid-chain or reaches a first-time destination with no
    benign causal source — a direct signature of pass-the-ticket and stolen-token reuse. Apply Hopper-style
    modeling over authentication logs with rarity scoring and surface the no-causal-source path and rarity
    factors in the alert. A positive result indicates a credential was used outside its legitimate origin,
    strongly suggesting theft and lateral movement. Source citations: [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/Hopper pseudocode
    query: "model = HopperCausalPaths(auth_logs)\nfor path in model.login_paths():\n    if path.switches_credential_midchain()\n\
      \       or (path.dest_is_first_time() and not path.has_benign_causal_source()):\n        alert(path,\
      \ rarity=model.rarity(path))"
- question: When scoring new logon/Kerberos edges with node2vec embeddings and logistic-regression link
    prediction, which novel low-probability (principal, resource) edges rank as the most suspicious for
    second-stage triage?
  context: 'Graph link prediction provides a learned second-stage triage layer after deterministic ticket
    rules. Learn node2vec embeddings of the authentication graph and score new logon/Kerberos edges with
    logistic-regression link prediction; rank novel low-probability (principal, resource) edges and report
    edge-level explanations. Supervised graph/behavioral feature models (new edges, logon-type mixes,
    fan-out) are an alternative where labeled data exists. A high-ranked novel edge indicates an access
    pattern the model considers improbable, warranting analyst review. Source citations: [Bowman et al.](https://www.usenix.org/system/files/raid20-bowman.pdf);
    [Bian et al.](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/Link-prediction pseudocode
    query: "emb = node2vec(auth_graph)\nclf = LogisticRegression().fit(known_edges, labels)\nfor edge\
      \ in new_edges:\n    p = clf.predict_proba(concat(emb[edge.src], emb[edge.dst]))\n    if p < edge_prob_threshold:\n\
      \        rank_for_triage(edge, score=1-p, explain=edge_features(edge))"
- question: Does an LSTM log-key sequence model trained on normal Kerberos/sign-in ordering (4768 TGT
    → 4769 TGS → 4624 logon; IdP auth → SP/SaaS auth → resource access) flag out-of-context events such
    as a TGS or SaaS logon without the preceding TGT or IdP authentication?
  context: 'Forged tickets and token replay break the expected ordering of authentication events. Train
    an LSTM log-key sequence model (DeepLog-style) on normal Kerberos/sign-in ordering and flag events
    that violate the learned sequence — e.g., a TGS (4769) or SaaS logon appearing without the preceding
    TGT (4768) or IdP authentication. Report the violated expected event for diagnosis. A positive result
    indicates an authentication appeared without its prerequisite, consistent with forgery or replay.
    Source citations: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/DeepLog pseudocode
    query: "model = LSTMLogKey(train=normal_auth_sequences)\nfor seq in per_principal_sequences(auth_logs):\n\
      \    expected = model.predict_next(seq.prefix)\n    if seq.actual not in expected.top_k:\n     \
      \   alert(principal=seq.principal, observed=seq.actual, expected=expected.top_k)"
- question: When building per-principal token-usage feature vectors (encryption type, distinct-SPN count,
    source ASN/subnet, user-agent, hour, request volume, success/fail ratio) and scoring with an unsupervised
    Extended Isolation Forest, which principals are flagged as outliers not fitting established usage?
  context: 'Unsupervised clustering catches anomalous token usage that does not match any pre-defined
    rule. Build per-principal token-usage feature vectors (encryption type, distinct-SPN count, source
    ASN/subnet, user-agent, hour, request volume, success/fail ratio) and score with an Extended Isolation
    Forest. Flag outliers and surface the top-3 contributing features in the alert text. A positive result
    identifies principals whose overall token behavior deviates from established norms, providing a broad
    anomaly net complementing the deterministic and graph-based detections. Source citations: [Hariri
    et al.](https://arxiv.org/abs/1811.02141).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/Extended-Isolation-Forest pseudocode
    query: "X = build_feature_vectors(per_principal_token_usage)\nmodel = ExtendedIsolationForest().fit(X)\n\
      scores = model.anomaly_score(X)\nfor p in principals where scores[p] > outlier_threshold:\n    alert(principal=p,\
      \ score=scores[p], top_features=top3_contributions(model, X[p]))"
