name: 'D3-TBA: Token-based Authentication'
id: 02557477-d58b-4595-ab66-2e33476a4d3b
description: Investigate the security posture and abuse of token-based authentication across both on-premises
  Kerberos (Event 4768/4769/4624/4771, Zeek kerberos.log) and cloud/federation bearer tokens (OAuth refresh/access
  tokens, SAML assertions). This playbook helps an analyst assess issuance posture (weak encryption types,
  excessive ticket/token lifetimes, missing pre-auth or interactive MFA) and usage posture (multi-source
  token reuse, anomalous request volume, out-of-sequence issue/use, and elevated failure rates). It combines
  deterministic ticket/assertion rules with statistical baselining (lifetimes, request volume, context
  likelihood, graph edge rarity) and machine-learning approaches (causal path modeling, link prediction,
  log-sequence modeling, and unsupervised clustering) to surface Golden/Silver Ticket forgery, Golden
  SAML, pass-the-ticket, token theft/replay, and Kerberoasting fan-out using first-party identity logs.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
