questions:
- question: Are any user-account service tickets (TGS/TGT) being issued with weak Kerberos encryption
    types (RC4-HMAC 0x17, RC4-HMAC-EXP 0x18, or DES 0x1/0x3) in a domain that is otherwise AES-capable?
  context: 'As a Harden-tactic posture check, weak encryption types at ticket issuance create offline-crackable
    tickets (the basis of Kerberoasting and downgrade attacks). Query Windows Event ID 4769/4768 for the
    ''Ticket Encryption Type'' field and flag user SPNs (exclude computer-account `$` SPNs) negotiating
    RC4 or DES while the domain supports AES. Correlate with Zeek kerberos.log etype fields to confirm
    the client actually negotiated weak crypto on the wire. A positive result means an attacker can request
    a ticket for the SPN and crack the service account''s password offline; a negative result confirms
    AES enforcement for that principal. Source citations: [4769, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769);
    [Metcalf](https://adsecurity.org/?p=1515).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=windows (EventCode=4769 OR EventCode=4768)

      | where TicketEncryptionType IN ("0x17","0x18","0x1","0x3")

      | where NOT match(ServiceName, "\$$")  // exclude computer-account SPNs

      | stats count by Account, ServiceName, TicketEncryptionType, src_ip'
  - technology: Zeek/pseudocode
    query: 'from kerberos.log

      | where success == true and request_type in ("AS","TGS")

      | where cipher in ("rc4-hmac","rc4-hmac-exp","des-cbc-md5","des-cbc-crc")

      | select ts, id.orig_h, client, service, cipher'
- question: Are there service-ticket requests (4769) without a preceding TGT (4768), tickets exceeding
    the domain Kerberos lifetime policy, RC4 downgrades in an AES domain, or mismatched/non-existent account-domain
    and SID values across 4769/4624/4672 that indicate Golden or Silver Ticket forgery?
  context: 'Forged Kerberos tickets (Golden/Silver) are crafted offline and presented to services without
    the normal authentication handshake, so they leave tell-tale inconsistencies. For Harden posture,
    alert on a TGS-REQ (4769) with no matching prior TGT (4768) for the same account, ticket lifetimes
    exceeding the domain policy (default 10h/7d), RC4 (0x17) downgrade in an AES domain, or blank/mismatched
    account-domain and non-existent or inconsistent SIDs across 4769/4624/4672. A positive correlation
    strongly suggests ticket forgery and warrants immediate credential and KRBTGT review. Source citations:
    [Grippo & Kholidy](https://arxiv.org/abs/2301.00044); [Metcalf](https://adsecurity.org/?p=1515).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days; pivot to event-centered correlation (±10m) around a suspect 4769
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=windows EventCode=4769\n| join type=left Account [search index=windows EventCode=4768\
      \ earliest=-10h]\n| where isnull(matched_4768)\n   OR TicketLifetime > domain_max_lifetime\n   OR\
      \ (TicketEncryptionType=\"0x17\" AND domain_aes_enabled=true)\n   OR AccountDomain==\"\" OR SID\
      \ NOT IN known_sids\n| table _time, Account, ServiceName, src_ip, TicketEncryptionType, SID"
- question: Is the same Kerberos ticket/session token or cloud OAuth session/refresh token being presented
    from multiple distinct source IPs, ASNs, or devices within its valid lifetime, or is a refresh token
    being replayed without an MFA claim or interactive-auth event?
  context: 'Bearer tokens grant access to whoever holds them, so the same token appearing from geographically
    or network-disparate sources within its lifetime is a hallmark of pass-the-ticket or cloud token theft.
    Correlate Zeek kerberos.log ticket identifiers and cloud sign-in logs by token/session id and count
    distinct source IP/ASN/device. Flag a refresh-token use that lacks a corresponding MFA claim or interactive
    authentication event. A positive result indicates the token was likely stolen and replayed from attacker
    infrastructure. Source citations: [MS Token Theft Playbook](https://learn.microsoft.com/en-us/security/operations/token-theft-playbook);
    [Grippo & Kholidy](https://arxiv.org/abs/2301.00044).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=signin OR index=zeek_kerberos\n| stats dc(src_ip) AS ip_count, dc(asn) AS asn_count,\
      \ dc(device_id) AS dev_count,\n        values(mfa_claim) AS mfa BY token_id, principal\n| where\
      \ ip_count>1 OR asn_count>1 OR dev_count>1\n   OR (token_type=\"refresh\" AND mfa==\"none\")"
- question: Do incoming SAML responses contain multiple Assertion/Response nodes, mismatched Reference/ID
    values, unexpected Issuer/IssuerUri, deprecated signature algorithms, or recipient/audience mismatches
    that indicate XML Signature Wrapping or a forged (Golden SAML) assertion?
  context: 'Golden SAML and XML Signature Wrapping attacks let an adversary mint or tamper with federation
    assertions to impersonate any user. For Harden posture, enforce that the signed XML element equals
    the consumed element and reject assertions with multiple Assertion/Response nodes, mismatched Reference/ID
    values, unexpected Issuer/IssuerUri, deprecated signature algorithms (e.g., SHA-1), or recipient/audience
    mismatches. A positive finding means the assertion cannot be trusted and federation signing keys (ADFS
    token-signing certificate) may be compromised. Source citations: [Somorovsky et al.](https://www.usenix.org/system/files/conference/usenixsecurity12/sec12-final91.pdf).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4768
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Zeek kerberos.log
  - Zeek conn.log
  - Entra ID / Cloud Sign-in Logs
  - AD FS / SAML IdP Logs
  - 'NAI: Authentication Servers (Domain Controllers, KDCs), Federation/IdP servers (AD FS, Entra ID),
    Application/API Servers consuming tokens, and key Endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=adfs OR index=saml_idp\n| where assertion_count>1 OR response_count>1\n   OR signed_element_id\
      \ != consumed_element_id\n   OR Issuer NOT IN trusted_issuers\n   OR signature_algorithm IN (\"\
      sha1\",\"deprecated\")\n   OR audience != expected_audience\n| table _time, Issuer, NameID, signature_algorithm,\
      \ src_ip"
- question: Is there a burst of token-issuance or token-use failures (Kerberos 4771/4768 pre-auth failures,
    4769 failure Status codes, or cloud 401/403 token-validation failures) from a single source, especially
    one immediately preceding a success?
  context: 'Failure-state events are a distinct and high-value signal: ticket manipulation, replay, and
    token probing generate failures before an attacker finds a working path. Track Kerberos 4771/4768
    pre-auth failures and 4769 failure Status codes alongside cloud 401/403 token-validation/authorization
    failures. A spike of failures from one source followed by a success often indicates probing or brute-force
    of the token layer. A positive result should be triaged together with the subsequent successful authentication.
    Source citations: [4769, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769);
    [MS Token Theft Playbook](https://learn.microsoft.com/en-us/security/operations/token-theft-playbook).'
  answer_sources:
