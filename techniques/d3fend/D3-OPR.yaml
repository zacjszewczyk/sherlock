name: 'D3-OPR: Operating Mode Restriction'
id: c4eddd47-57e7-4497-8330-8b246fa07364
description: Investigate unauthorized or anomalous operating-mode changes against industrial control system
  (ICS) PLCs and controllers. This playbook helps an analyst assess the current state of operating-mode
  restrictions on critical controllers and detect attempts to switch devices into inappropriate or vulnerable
  states (for example RUN to PROGRAM, REMOTE to STOP, or vendor lock/unlock). It correlates mode-affecting
  protocol operations (CIP, Modbus, S7comm) seen in network logs with privileged operator logons and approved
  engineering-tool execution on the host, baselines normal per-workstation and per-PLC mode-change behavior,
  and surfaces campaign-style or stealthy reconfiguration. It also treats rejected, denied, or exception
  mode-write attempts (blocked by a protected key-switch position, RBAC, or a protocol exception) as first-class
  probing signals indicating an unauthorized actor. Detection methods span deterministic symbolic-logic
  rules, statistical baselining and change-point analysis, and machine-learning anomaly scoring, aligned
  to the D3-I (Isolate) tactic and the D3FEND Operating Mode Restriction countermeasure.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are mode-affecting protocol operations targeting PLC/controller mode attributes (CIP SetAttribute/forward-open
    to identity or mode objects, Modbus write function codes 05/06/15/16, S7comm stop/start) originating
    from any source host that is NOT on the approved engineering-workstation allowlist?
  context: Under the Isolate (D3-I) tactic, operating-mode restriction depends on only sanctioned engineering
    workstations being able to reconfigure controllers. Any host outside the maintained host/protocol
    allowlist issuing a mode-change command is a strong indicator of an unauthorized reconfiguration attempt
    (cf. ATT&CK T0858 Change Operating Mode). Parse Zeek cip.log (and Modbus/S7comm equivalents) for services
    that write or set controller mode/identity objects, resolve the source IP against the control-segment
    allowlist, and raise a high-severity alert enriched with source IP, PLC asset ID, and requested mode
    value. A positive result (mode write from a non-allowlisted host) warrants immediate containment;
    a negative result confirms mode writes are confined to approved engineering hosts. Maintain the allowlist
    per NIST SP 800-82r3.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Rule pseudocode
    query: 'cip_mode = filter(cip.log, service in {SetAttributeSingle, ForwardOpen} and object in {Identity,
      Mode})

      modbus_mode = filter(modbus.log, func_code in {05,06,15,16})

      s7_mode = filter(s7comm.log, function in {stop, start})

      mode_writes = union(cip_mode, modbus_mode, s7_mode)

      alert = filter(mode_writes where src_ip not in engineering_ws_allowlist)

      emit HIGH alert with src_ip, plc_asset_id, requested_mode'
- question: For each PLC mode-change command, is there a matching privileged operator logon (Windows Event
    ID 4624) and the expected engineering-tool process creation (Windows Event ID 4688) on the initiating
    host within a 10-minute window, and which mode changes lack this RBAC/least-privilege context?
  context: Isolation of control functions requires that mode changes be tied to an authenticated, authorized
    human using sanctioned tooling. Correlate each mode-change command in Zeek cip.log with a privileged
    interactive/network logon (4624) and the expected engineering-tool process creation (4688) on the
    source host within a 10-minute window. Mode changes lacking this context suggest automated, scripted,
    or unauthorized activity bypassing normal RBAC. A flagged command (no logon + no expected tool process)
    should be triaged as a potential unauthorized reconfiguration; a clean correlation supports legitimate,
    attributed maintenance. Aligns to NIST SP 800-82r3 access-control guidance.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: "for cmd in cip_mode_changes:\n  host = resolve(cmd.src_ip)\n  logon = lookup(EID==4624, host,\
      \ privileged=true, window=[cmd.time-10m, cmd.time])\n  proc  = lookup(EID==4688, host, image in\
      \ engineering_tools, window=[cmd.time-10m, cmd.time])\n  if not logon or not proc:\n    emit alert(cmd,\
      \ reason='mode change without operator/tool context')"
- question: Do any mode-change commands appear out-of-sequence, unpaired (no valid response), outside
    the learned timing phase, or do they drive the controller into a state that violates an always-true
    operational invariant?
  context: Specification- and invariant-based detection isolates illegitimate control by modeling what
    normal per-PLC traffic and physical state must look like. Model normal control traffic as a phase-aware
    deterministic finite automaton (DFA) and flag mode-change commands that are out-of-sequence, unpaired,
    or outside the learned timing phase. Encode valid function codes and command/response pairing as semantic
    rules, and assert always-true operational predicates (invariants) so a mode transition that violates
    a physical/logical invariant is alerted. Positive results indicate protocol abuse or attacks that
    bypass simple allowlists; this is resilient where signature/allowlist rules fail.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days
  queries:
  - technology: Zeek/Specification-rule pseudocode
    query: "dfa = load_per_plc_phase_dfa()\nfor cmd in mode_changes(plc):\n  if not dfa.valid_transition(cmd)\
      \ or cmd.out_of_phase or not paired_response(cmd):\n    emit alert(cmd, reason='sequence/timing/pairing\
      \ violation')\nfor inv in operational_invariants(plc):\n  if not inv.holds(post_state(cmd)):\n \
      \   emit alert(cmd, reason='invariant violation: '+inv.name)"
- question: For each engineering workstation, do the daily count of distinct PLCs touched, the mode-change
    count, or active hours exceed the workstation's 30-day 99th-percentile baseline or shift into historically
    unused time bands?
  context: Behavioral baselining isolates compromised or misused engineering workstations even when individual
    commands look protocol-valid. Compute a 30-day per-workstation baseline of (a) distinct PLCs touched/day,
    (b) mode-change count/day, and (c) active hours, then alert when any metric exceeds the 99th percentile
    or moves into a time band the host never used. Use change-point methods (CUSUM/PELT/Bayesian online)
    to detect abrupt baseline shifts rather than relying on static thresholds. A breach (e.g., a host
    that normally touches 2 PLCs in business hours suddenly touching 20 at 03:00) is high-fidelity evidence
    of takeover or insider misuse.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; baseline over preceding 30 days, evaluate in rolling windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_ws_30d_stats(plc_count_day, mode_change_count_day, active_hours)\nfor ws, day\
      \ in current:\n  for metric in [plc_count, mode_changes, active_hours]:\n    if metric > baseline[ws].p99[metric]\
      \ or hour not in baseline[ws].active_bands:\n      emit alert(ws, metric)\n# change-point\ncp =\
      \ cusum_pelt(series[ws][metric]); if cp.detected: emit shift_alert(ws, metric)"
- question: Is a single source host sending mode-change commands to an unusually large number of unique
    PLCs within a rolling 1-hour window (>3 standard deviations above baseline), or does a stateful CUSUM
    test reveal slow accumulating reconfiguration across many controllers?
  context: Campaign-style or stealthy reconfiguration is a hallmark of ICS attacks (e.g., mass mode changes
    preceding disruption). Track rolling 1-hour counts of unique PLCs receiving mode-change commands per
    source and trigger when the count exceeds 3 standard deviations above baseline. Run a parallel stateful
    CUSUM test that accumulates small per-window deviations to catch slow, low-and-slow reconfiguration
    a single-sample threshold would miss. A spike in fan-out from one host indicates a coordinated reconfiguration
    sweep; sustained low-level CUSUM growth indicates patient, stealthy manipulation.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; baseline over preceding 30 days, evaluate in rolling windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'win = rolling_1h

      fan_out[src] = distinct_count(plc | mode_change, win)

      if fan_out[src] > mean_baseline + 3*std_baseline: emit burst_alert(src, fan_out)

      cusum[src] += max(0, fan_out[src] - (mean_baseline + k))

      if cusum[src] > H: emit stealthy_campaign_alert(src)'
- question: Per source-PLC pair, do the Volume (mode/write-service byte counts and request size) and Frequency
    (mode-write requests per minute) of control traffic show discords versus the learned norm, indicating
    a burst of write/mode function codes or an abnormal byte ratio?
  context: The physical regularity of OT traffic lets us isolate anomalies by traffic shape. For each
    source-PLC pair, baseline the Volume (write/mode-service byte counts, request size) and Frequency
    (mode-write requests per minute) of control traffic, then detect discords versus the learned norm
    using Matrix Profile / flow-feature analytics. A sudden burst of write/mode function codes or an abnormal
    byte ratio strongly indicates unauthorized reconfiguration even when source identity looks normal.
    Positive discords should be correlated with the symbolic-logic allowlist and operator-context checks
    for confirmation.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; baseline over preceding 30 days, evaluate in rolling windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (src,plc) in pairs:\n  vol = bytes_of(mode_write_services, src, plc, win=1m)\n  freq =\
      \ count(mode_write_reqs, src, plc, win=1m)\n  mp_vol = matrix_profile(vol_series[src,plc]); mp_freq\
      \ = matrix_profile(freq_series[src,plc])\n  if mp_vol.discord > T or mp_freq.discord > T:\n    emit\
      \ alert(src, plc, vol, freq, reason='volume/frequency discord')"
- question: When scored by a sequence/forecasting anomaly model trained on normal ordered mode transitions,
    source identities, command cadence, and maintenance-window labels, which new mode-transition chains
    receive anomaly scores above the tuned high-risk threshold?
  context: 'Sequence-aware ML can flag novel-but-suspicious mode-transition chains that rule sets miss.
    Train a 1D-CNN/autoencoder (predict-then-threshold-residual) on normal ordered mode transitions, source
    identities, command cadence, and maintenance-window labels; score new transition chains and prioritize
    those above a tuned high-risk threshold. Surface the top-3 contributing features (e.g., source host,
    requested mode, time-of-day) via SHAP attribution so analysts can triage explainably. Run strictly
    in parallel with the deterministic rules: ML detection rates collapse on unseen attacks, so a low
    ML score must never suppress a rule-based alert.'
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; train on preceding 90+ days of normal-only traffic
  queries:
  - technology: ML/pseudocode
    query: "model = train_cnn_autoencoder(normal_transition_sequences[features=source,mode,cadence,maint_window])\n\
      for chain in live_transition_chains:\n  resid = model.residual(chain)\n  if resid > high_risk_threshold:\n\
      \    top = shap_topk(model, chain, k=3)\n    emit alert(chain, score=resid, contributors=top)\n\
      # parallel to symbolic rules; do not suppress rule alerts"
- question: Where labeled attacks are unavailable, which live mode-change commands deviate from the learned
    normal manifold when scored by a one-class model (OCSVM/DNN) trained on normal-only feature vectors
    (source, target PLC, requested mode, hour, preceding state)?
  context: Labeled ICS attack data is scarce, so a normal-only one-class model provides anomaly coverage
    without attack samples. Train an OCSVM or DNN on normal-only mode-change feature vectors (source,
    target PLC, requested mode, hour, preceding-state) and score live commands for deviation from the
    learned normal manifold. Tune the decision boundary toward higher recall (favoring catch-rate over
    false-positive minimization for safety-critical mode changes) and triage results with explainable
    feature attribution. A high deviation score flags a command unlike anything seen in normal operation;
    combine with rule-based context before acting.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; train on preceding 90+ days of normal-only traffic
  queries:
  - technology: ML/pseudocode
    query: "feats = [source, target_plc, requested_mode, hour, preceding_state]\noc = train_ocsvm_or_dnn(normal_only_vectors[feats])\n\
      for cmd in live_mode_changes:\n  s = oc.decision_function(vector(cmd))\n  if s < boundary_high_recall:\n\
      \    emit alert(cmd, score=s, features=explain(oc, cmd))"
- question: Do Windows authentication logs (Event ID 4624) reveal causal login paths consistent with lateral
    movement to the engineering workstation that subsequently issues mode-change commands?
  context: Sophisticated actors rarely start on the engineering workstation; they pivot to it. Build causal
    login paths from Windows Event ID 4624 authentication logs and score them for lateral movement that
    terminates on the engineering workstation which then issues mode-change commands, using a path-based,
    low-alert-volume approach (Hopper). A suspicious path (e.g., remote logon chain ending at an engineering
    host immediately before a mode write) ties IT-side compromise to OT-side impact and should elevate
    any associated mode-change alert. This bridges the Isolate tactic across the IT/OT boundary.
  answer_sources:
  - Zeek cip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Controller diagnostic/audit logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; train on preceding 90+ days of normal-only traffic
  queries:
  - technology: SIEM/Graph pseudocode
    query: "paths = build_login_paths(EID==4624)  # node=host, edge=auth\nfor p in paths ending_at engineering_ws:\n\
      \  if p.is_lateral_movement (new edge / cred switch / no benign cause) and\n     mode_change_from(p.terminal_host,\
      \ window=[p.end, p.end+30m]):\n    emit alert(path=p, terminal=engineering_ws)"
- question: Are mode-affecting services returning non-success status (CIP general status != 0x00, Modbus
    exception codes 0x01-0x04, or controller audit-log denials) from ANY source host, indicating a key-switch-
    or RBAC-protected controller rejecting a mode-write attempt?
  context: 'A protected controller rejecting a mode write is itself evidence of an unauthorized attempt:
    under the Isolate tactic, the key-switch position or RBAC has done its job, but the attempt still
    signals a hostile or misconfigured actor. Alert on mode-affecting services that return failure: CIP
    general status != 0x00, Modbus exception codes 0x01-0x04, or a controller audit-log denial, from any
    source host. Even a single denied mode write to a safety-relevant controller deserves investigation;
    repeated denials indicate active probing. Correlate the rejecting controller, source host, exception
    code, and requested mode (cf. ATT&CK T0858).'
  answer_sources:
  - Zeek cip.log
  - Windows Event ID 4625
  - Controller diagnostic/audit logs
  - Firewall deny logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Rule pseudocode
    query: 'denied = filter(cip.log where service in mode_services and general_status != 0x00)

      denied += filter(modbus.log where exception_code in {0x01,0x02,0x03,0x04})

      denied += filter(controller_audit where action==''mode_write'' and result==''denied'')

      for d in denied: emit alert(d.src_ip, d.plc_asset_id, d.exception, d.requested_mode)'
- question: Does the per-source failed/denied mode-write rate over rolling 10-minute windows show bursts
    exceeding 3 standard deviations above baseline or breach a CUSUM cumulative-deviation threshold, treating
    failure rate as a probing signal?
  context: 'Failure rate is a first-class probing indicator: an unauthorized actor testing a protected
    controller generates a distinct burst of denied mode writes. Baseline the per-source failed/denied
    mode-write rate over rolling 10-minute windows and trigger on bursts exceeding 3 standard deviations,
    or use a CUSUM cumulative-deviation test to catch slow, persistent probing below a single-window threshold.
    A spike or sustained CUSUM growth in failures from one host points to reconnaissance or repeated reconfiguration
    attempts against key-switch/RBAC-protected controllers, even when no write succeeds.'
  answer_sources:
  - Zeek cip.log
  - Windows Event ID 4625
  - Controller diagnostic/audit logs
  - Firewall deny logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; baseline over preceding 30 days, evaluate in rolling windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'win = rolling_10m

      fail_rate[src] = count(failed_mode_writes, src, win)

      if fail_rate[src] > mean_base + 3*std_base: emit burst_alert(src, fail_rate)

      cusum[src] += max(0, fail_rate[src] - (mean_base + k))

      if cusum[src] > H: emit persistent_probe_alert(src)'
- question: When failed-mode-write bursts are clustered/classified by interpretable flow and command features
    (source, target, exception code, inter-arrival timing), which bursts are flagged as suspicious, and
    what are the explaining features?
  context: Not all failures are malicious; ML triage separates benign misconfiguration from deliberate
    probing. Cluster or classify failed-mode-write bursts using interpretable flow/command features (source,
    target, exception code, inter-arrival timing) with Random-Forest feature-importance output for explainable
    triage. Validate the detector against novel/unseen attacks rather than only known patterns, since
    ML can give a false sense of security on ICS data. A burst flagged with, e.g., high feature importance
    on a rare exception code from an unexpected source warrants escalation; the importance ranking guides
    the analyst's investigation.
  answer_sources:
  - Zeek cip.log
  - Windows Event ID 4625
  - Controller diagnostic/audit logs
  - Firewall deny logs
  - 'NAI: OT Network Segment containing PLCs and Engineering Workstations'
  range: Last 90 days; train on preceding 90+ days of normal-only traffic
  queries:
  - technology: ML/pseudocode
    query: "feats = [source, target, exception_code, inter_arrival_timing]\nclf = random_forest(labeled_or_clustered_bursts[feats])\n\
      for burst in failed_write_bursts:\n  pred, importance = clf.predict_with_importance(features(burst))\n\
      \  if pred == 'suspicious': emit alert(burst, top_features=importance)\n# evaluate against novel\
      \ attacks, not just known patterns"
