name: 'D3-RKD: Registry Key Deletion'
id: f9691f41-e1c3-4749-afcc-9fbd0d85ab77
description: Investigate and validate the eviction of adversary persistence mechanisms from the Windows
  Registry. This playbook helps an analyst confirm that targeted malicious registry keys were actually
  deleted on every intended host, verify deletion at fleet scale, defeat hidden or null-byte keys that
  can fake remediation success, treat deletion failures and re-creation attempts as first-class detection
  signals, and confirm that the suspicious follow-on behavior the key drove (malicious process spawns,
  beaconing) genuinely subsided and did not return. It combines deterministic command/telemetry correlation,
  statistical baselining and change-point detection, and machine-learning log-sequence and provenance-graph
  methods to support an eradicate-validate-monitor eviction campaign that cannot close until 100% confirmed
  deletion is achieved.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did the registry-key deletion command actually execute on each scoped endpoint, and did its
    command line target the exact malicious persistence path we intended to remove?
  context: 'To evict (Evict) a Registry-based persistence mechanism you must first prove the remediation
    command ran where it was supposed to. Match Windows Event ID 4688 / Sysmon Event ID 1 command-line
    details (reg.exe delete, regini, or PowerShell Remove-Item against the targeted persistence path)
    to the intended key path on every scoped host. Scope the path set against the full persistence-location
    inventory (Hexacorn''s ''Beyond Good Ol'' Run Key'' series) and the abuse taxonomy in MITRE ATT&CK
    T1112: Modify Registry. A positive result is a command-line match for the intended path on each host;
    a negative result (no matching command line) means the host was never actioned and must be re-tasked.
    This is the precondition for trusting any downstream deletion telemetry. Citations: [Beyond Good Ol''
    Run Key, Hexacorn](https://www.hexacorn.com/blog/2017/01/13/beyond-good-ol-run-key-part-55/); [MITRE
    ATT&CK T1112: Modify Registry](https://attack.mitre.org/techniques/T1112/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'events = EventLogs where (EventID==4688 OR (source==''Sysmon'' AND EventID==1))

      filter CommandLine matches /(reg(\.exe)?\s+delete|regini|Remove-Item)/i

      filter CommandLine contains target_persistence_path

      join scoped_host_inventory on Host

      for host in scoped_hosts: assert exists(matching command) else FLAG ''command never executed'''
- question: For every host that ran the deletion command, is there a corresponding registry DeleteKey/DeleteValue
    telemetry event for the same target object — and is any 'success' actually a rename-based evasion
    instead of a true deletion?
  context: 'Command execution alone does not prove the key is gone. Require a matching Sysmon Event ID
    12 (DeleteKey/DeleteValue) record for the same TargetObject on every targeted host, per Sysmon event
    semantics. Treat a Sysmon Event ID 14 (key/value rename) as evasion, NOT deletion — an adversary or
    a flawed remediation may rename rather than remove. Flag any host that ran the command but produced
    no deletion event, or produced no registry event at all, for manual remediation. In an eviction context
    a clean deletion event on every host is the goal; a command with no deletion event is a silent failure
    that leaves persistence intact. Citations: [System Monitor (Sysmon), Microsoft Sysinternals](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "del = Sysmon where EventID==12 AND EventType=='DeleteKey'|'DeleteValue' AND TargetObject==target_path\n\
      rename = Sysmon where EventID==14 AND TargetObject==target_path\nfor host in hosts_that_ran_command:\n\
      \  if exists(del[host]): mark DELETED\n  elif exists(rename[host]): FLAG 'rename evasion - not deletion'\n\
      \  else: FLAG 'no deletion telemetry -> manual remediation'"
- question: After deletion, is the targeted registry key truly absent when enumerated through multiple
    independent access methods, or do hidden/null-byte keys remain that standard tools cannot see?
  context: 'Adversaries can plant null-byte hidden keys via NtSetValueKey that are invisible to standard
    tools (see ''Hiding Registry Keys with PSReflect''). To confirm true absence and complete eviction,
    enumerate the path through at least two independent access methods — reg.exe/Win32 RegEnumKey vs.
    WMI StdRegProv vs. native NtEnumerateKey — and treat ANY discrepancy between methods as incomplete
    eviction. If one method reports the key gone but another still resolves it, a hidden key persists
    and the host is not evicted. Consistent absence across all methods is required before closing the
    key. Citations: [Hiding Registry Keys with PSReflect, Will Schroeder](https://posts.specterops.io/hiding-registry-keys-with-psreflect-b18ec5ac8353).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days
  queries:
  - technology: Endpoint/pseudocode
    query: 'm1 = enumerate(target_path via reg.exe/RegEnumKey)

      m2 = enumerate(target_path via WMI StdRegProv)

      m3 = enumerate(target_path via Nt EnumerateKey)

      if m1==m2==m3==ABSENT: mark TRULY_ABSENT

      else: FLAG ''discrepancy -> hidden/null-byte key, incomplete eviction'''
- question: Have we verified deletion across ALL related persistence paths the actor could have planted
    (Run/RunOnce, Winlogon, IFEO, services, COM/CLSID) rather than closing on a single key?
  context: 'An eviction campaign that removes one key but ignores parallel persistence will fail. Verify
    deletion across every related persistence path — Run/RunOnce, Winlogon, Image File Execution Options,
    services, COM/CLSID — using the collection scope of the SwiftOnSecurity Sysmon config and re-creation
    rules adapted from SigmaHQ. Critically, a key OUTSIDE the collected telemetry scope cannot be confirmed
    deleted from logs alone and must be checked directly on host. A positive result is confirmed clearance
    across the full inventory; any uncovered path is a gap that may let the adversary re-establish. Citations:
    [SwiftOnSecurity Sysmon Configuration](https://github.com/SwiftOnSecurity/sysmon-config); [Sigma,
    SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "persistence_paths = [Run, RunOnce, Winlogon, IFEO, Services, COM/CLSID, ...full inventory]\n\
      for p in persistence_paths:\n  if p in collected_telemetry_scope:\n    assert deletion_confirmed(p)\n\
      \  else:\n    FLAG p 'outside scope -> verify directly on host'"
- question: What percentage of targeted endpoints emitted the expected key-deletion event, and is any
    business-unit cohort lagging far enough behind the fleet to indicate a stalled eviction?
  context: 'Measure fleet-wide eviction success: compute the percentage of targeted endpoints that emitted
    the expected Sysmon Event ID 12 key-deletion event, track campaign-completion distribution by business
    unit/cohort, and alert on any cohort whose completion count falls more than k (start k=3) standard
    deviations below the expected fleet count using explainable z-score baselining (Dwyer & Truta). Per
    CISA''s eradicate-validate-monitor procedure, require 100% confirmed deletion before closing the eviction
    campaign. A lagging cohort signals systemic remediation failure (access, tooling, connectivity) in
    that segment that must be resolved before closure. Citations: [Finding Anomalies in Windows Event
    Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Cybersecurity Incident & Vulnerability Response Playbooks, CISA](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "expected = count(targeted_endpoints)\nconfirmed = count(hosts emitting Sysmon EventID==12\
      \ DeleteKey for target)\nrate = confirmed/expected\nfor cohort in business_units:\n  z = (cohort.confirmed\
      \ - mean_fleet)/std_fleet\n  if z < -3: ALERT cohort 'lagging eviction'\nif rate < 1.0: KEEP campaign\
      \ OPEN"
- question: Are deletion failures and re-creation ATTEMPTS on the evicted path rising in a way that indicates
    active adversary resistance, even where the deletion itself held?
  context: 'Treat failure as a first-class signal. Count and trend (a) failed deletions — reg.exe non-zero
    exit codes, ACCESS_DENIED/privilege errors in Windows Event ID 4657 registry-audit — and (b) re-creation
    ATTEMPTS on the evicted path (volume of write/create events per host per hour and the success/fail
    ratio), baselining with z-scores (Dwyer & Truta). A rising blocked-attempt rate means the adversary
    is actively trying to reinstate persistence even if your deletion currently holds; surface the host,
    path, and attempting process in the alert. This distinguishes a quiet, truly-evicted environment from
    one under sustained pressure. Citations: [Finding Anomalies in Windows Event Logs Using Standard Deviation,
    Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = Win EventID==4657 where Result in (ACCESS_DENIED, privilege_error) OR reg_exit_code!=0

      attempts = create/write events per host per hour on evicted_path; ratio=success/fail

      baseline z-score(fails), z-score(attempts)

      if z(attempts) > 3: ALERT host,path,process ''active re-creation resistance'''
- question: Has any registry key deleted during the eviction campaign been re-created — and does a change-point
    in the per-path write time series reveal a return of activity even outside a fixed window?
  context: 'Monitor for persistence re-creation: track registry key/value creation events (Sysmon Event
    ID 12 CreateKey / Event ID 13 SetValue) for any path deleted during an eviction campaign and alert
    immediately if a deleted key is re-created within 24 hours. Reinforce the hard 24-hour rule with change-point
    detection (CUSUM/PELT/BOCPD) on the per-path write time series so the return of activity after the
    deletion-time drop to zero fires even outside the fixed window (Aminikhanghahi & Cook). Re-creation
    is the clearest evidence that eviction failed or the adversary retains access; it should re-open the
    remediation ticket. Citations: [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days; center correlation on each key's deletion timestamp and watch the following 24+
    hours
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for path in deleted_paths:\n  recreate = Sysmon EventID==12 CreateKey OR EventID==13 SetValue\
      \ on path\n  if recreate within 24h of deletion: ALERT 'persistence re-created'\n  cp = changepoint(writes_timeseries[path],\
      \ method=CUSUM|PELT|BOCPD)\n  if cp after deletion_drop_to_zero: ALERT 'return of activity'"
- question: Did the malicious behavior the deleted key drove (malicious process spawns, Zeek beacons)
    actually stop after remediation, and does any later change-point indicate reversion?
  context: 'Confirm post-remediation behavior cessation: verify the malicious behavior the key drove actually
    stopped by applying change-point detection to the time series of associated malicious-process spawns
    and Zeek conn.log beacons around the deletion timestamp. A sustained drop to baseline confirms eviction;
    a subsequent change point (return of beacons or spawns) indicates reversion (Aminikhanghahi & Cook).
    This closes the loop: deletion telemetry tells you the key is gone, but behavioral cessation tells
    you the persistence it enabled is truly neutralized and the host is no longer acting on adversary
    instructions. Citations: [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days; center on deletion timestamp, comparing pre- and post-deletion windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ts_spawns = timeseries(malicious_process_spawns linked to key)

      cp = changepoint(ts_spawns around deletion_ts)

      if sustained_drop_to_baseline: CONFIRM cessation

      if later_changepoint_up: ALERT ''reversion'''
  - technology: Zeek/pseudocode
    query: 'ts_beacons = timeseries(conn.log periodic conns to C2 from host)

      cp = changepoint(ts_beacons around deletion_ts)

      if drop_sustained: CONFIRM beacon stopped

      else: ALERT ''beaconing resumed -> reversion'''
- question: Do post-remediation registry/process event streams contain low-probability re-creation bursts
    or anomalous follow-on chains that a learned log-sequence model flags as abnormal?
  context: 'Model post-remediation Sysmon registry/process event streams as log-key sequences and flag
    re-creation bursts or anomalous follow-on chains as low-probability events using the LSTM top-g next-key
    approach (DeepLog) or the Transformer masked-key/hypersphere approach (LogBERT). Surface the top-3
    contributing log keys (predicted-vs-observed) in the alert text for analyst triage. Run this in PARALLEL
    with — never replacing — the deterministic 24-hour re-creation rule. This catches novel re-establishment
    patterns that do not match a known signature but deviate from the host''s learned normal sequence,
    supporting the monitor phase of eviction. Citations: [DeepLog, Du et al](https://acmccs.github.io/papers/p1285-duA.pdf)
    ([code](https://github.com/wuyifan18/DeepLog)); [LogBERT, Guo et al](https://arxiv.org/abs/2103.04475)
    ([code](https://github.com/HelenGuohx/logbert)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = parse Sysmon registry+process stream -> log_keys per host\nmodel = DeepLog(LSTM top-g)\
      \ OR LogBERT(masked-key/hypersphere)\nfor window in post_remediation:\n  if observed_key not in\
      \ model.topg(predicted): FLAG anomaly\n  emit top3 (predicted vs observed) log_keys\n# runs in parallel\
      \ with deterministic 24h rule"
- question: When re-creation is suspected, which process/parent/path is causally responsible, as identified
    by provenance-graph attribution of the rarest causal path to the re-created key?
  context: 'When re-creation is suspected, attribute the offending entity with provenance-graph models:
    extract the rarest causal path to the re-created key (e.g., scripting host -> reg.exe -> Run key)
    via IDF+LOF (ProvDetector), pinpoint the specific process node with the node-level GraphSAGE detector
    (ThreaTrace), or flag the anomalous process->registry edge and reconstruct a compact attack graph
    (KAIROS). Each surfaces the contributing process/parent/path for triage and remediation re-open decisions.
    This answers WHO/WHAT re-established persistence so the analyst can act on the root cause rather than
    just re-deleting the key, which is essential for durable eviction. Citations: [ProvDetector, Wang
    et al](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf); [ThreaTrace, Wang
    et al](https://arxiv.org/pdf/2111.04333) ([code](https://github.com/threaTrace-detector/threaTrace));
    [KAIROS, Cheng et al](https://tfjmp.org/publications/2024-sp.pdf) ([code](https://github.com/ProvenanceAnalytics/kairos)).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 12
  - Sysmon Event ID 14
  - Zeek conn.log
  - Windows Event ID 4657
  - 'NAI: Compromised endpoint systems and critical servers with identified malicious persistence mechanisms.'
  range: Last 90 days; center on the suspected re-creation event
  queries:
  - technology: ML/pseudocode
    query: 'graph = build_provenance_graph(processes,parents,registry_edges)

      path = ProvDetector(IDF+LOF).rarest_causal_path(to=recreated_key)

      node = ThreaTrace(GraphSAGE).anomalous_node(graph)

      edge,attack_graph = KAIROS(graph).flag(process->registry)

      emit contributing process/parent/path for triage'
