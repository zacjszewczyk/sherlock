name: 'D3-HD: Homoglyph Detection'
id: a8222742-8d72-4231-a00c-c621e416ca8f
description: 'Investigate potential homoglyph and look-alike-string abuse across domain names, file and
  process names, command lines, account names, and email sender domains. Homoglyph attacks present a deceptive
  string that visually resembles a trusted name (for example goooogle.com vs google.com, or a Cyrillic
  character substituted for a Latin one) to fool users in phishing, typosquatting, and social-engineering
  campaigns. This playbook layers four complementary detection approaches: (1) a deterministic floor that
  Unicode-normalizes observed strings and computes the UTS #39 confusable skeleton, flags mixed-script
  and non-ASCII identifiers, and scans for invisible/Bidi control characters; (2) edit-distance and URL/Punycode
  normalization rules plus DMARC alignment checks that catch ASCII typosquats and IDN homographs of protected
  brand, partner, and internal names; (3) statistical lexical scoring and campaign/burst detection capturing
  the volume, frequency, and success/failure state of confusable strings; and (4) machine-learning visual-similarity
  and supervised scoring (with mandatory input sanitization) that catches glyph substitutions which defeat
  raw code-point comparison. The deterministic layers are always-on and portable; ML augments but never
  replaces them.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any observed domain, process, file, or account names normalize to the same Unicode confusable
    skeleton as a protected canonical name while their raw code points differ?
  context: 'This is the deterministic floor for homoglyph detection and supports the Detect tactic by
    catching look-alike strings using only first-party logs and no external API. For every observed name
    compute the UTS #39 skeleton: apply NFD normalization, drop Default_Ignorable code points, map characters
    via the offline confusables.txt table, then re-normalize. If the resulting skeleton equals a protected
    canonical name (a brand, internal domain, privileged/service account, or trusted process) but the
    raw code points differ, the string is almost certainly a deliberate visual impersonation. A positive
    match is high-signal and rarely a false positive; a negative result only means code-point-level confusables
    were not found, so the ML visual layer still applies. Maintain the protected-name list as ground truth.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4720/4624
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each name in (dns.query, http.host, process_name, account_name):\n  s = skeleton(NFD(name),\
      \ drop_default_ignorable=true, map=confusables.txt, renormalize=true)\n  if s in protected_skeletons\
      \ and codepoints(name) != codepoints(protected_name_for(s)):\n    alert('confusable skeleton match',\
      \ name, looks_like=protected_name_for(s))"
- question: Are any identifiers mixing Unicode scripts, containing non-ASCII characters in expected-ASCII
    contexts, or falling below the Highly-Restrictive Unicode restriction level?
  context: 'Supporting the Detect tactic, this rule flags structurally suspicious identifiers per UTR
    #36 and UTS #39. Process names, internal domains, and account names are normally pure ASCII; the appearance
    of a mixed-script name (e.g., Latin combined with Cyrillic or Greek) or non-ASCII characters where
    ASCII is expected is a strong indicator of homograph abuse. Compute the set of Unicode scripts present
    in each identifier and its restriction level; mixed-script=true on a name that is also confusable
    with a known brand is high-signal and should be escalated. A clean (single-script ASCII) result lowers
    suspicion but does not rule out pure-ASCII typosquatting, which other questions cover.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4720/4624
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each name in observed_identifiers:\n  scripts = unicode_scripts(name)\n  if count(scripts)\
      \ > 1 or (context_expects_ascii(name) and has_non_ascii(name))\n     or restriction_level(name)\
      \ < HIGHLY_RESTRICTIVE:\n    sev = HIGH if confusable_with_brand(name) else MEDIUM\n    alert('mixed-script/non-ASCII\
      \ identifier', name, severity=sev)"
- question: Do any file names, command lines, registry values, or process arguments contain invisible
    or bidirectional control characters such as zero-width spaces or right-to-left overrides?
  context: This deterministic scan supports the Detect tactic by surfacing 'Trojan Source'-style attacks
    (CVE-2021-42574/42694) and filename-spoofing tricks. Default-ignorable/invisible code points (ZWSP
    U+200B, ZWNJ/ZWJ) and bidirectional override controls (RLO U+202E, isolates U+2066-U+2069) let an
    attacker hide or visually reorder text so a malicious executable or command appears benign (e.g.,
    RLO flips 'exe.txt' to read as 'txt.exe'). Scan Windows Event ID 4688 and Sysmon Event ID 1 command
    lines and process arguments, plus file names and registry values, for these code points. Any occurrence
    in an executable or command context is anomalous and warrants investigation; legitimate use in business
    data is rare and contextually distinguishable.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4720/4624
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INVISIBLE = {U+200B,U+200C,U+200D,U+00AD,U+FEFF}\nBIDI = {U+202A..U+202E, U+2066..U+2069}\n\
      for each event in (4688, sysmon_1):\n  text = event.CommandLine + event.Image + event.process_args\n\
      \  if any(cp in INVISIBLE|BIDI for cp in codepoints(text)):\n    alert('invisible/bidi control char\
      \ in command/file', event)"
- question: Are observed domain, sender, process, or account names within an edit distance of 1-2 of any
    protected name on the canonical list?
  context: Supporting the Detect tactic, this is the deterministic ASCII-typosquat layer. Compute the
    Levenshtein/Damerau edit distance from each observed name (registrable label, case-folded) to every
    protected name; alert when the distance is 1 or 2. This catches character omissions, insertions, transpositions,
    and substitutions that produce names like 'micrsoft.com' or 'paypa1.com'. Keep distance<=2 as a hard
    rule and tune per environment to manage false positives from legitimately similar names. A low-distance
    hit against a high-value protected name is actionable; distance 0 is the legitimate name itself and
    should be excluded.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Proxy logs
  - Email gateway logs
  - 'NAI: DNS resolvers, Web proxy, Email gateway, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each name in (dns.query_label, email.from_domain, process_name, account_name):\n  for\
      \ p in protected_names:\n    d = damerau_levenshtein(casefold(registrable_label(name)), casefold(p))\n\
      \    if 1 <= d <= 2:\n      alert('edit-distance typosquat', name, looks_like=p, distance=d)"
- question: Do any URLs or domains, after Punycode expansion and full normalization, resolve to a look-alike
    of a protected brand?
  context: 'This rule supports the Detect tactic by defeating URL obfuscation and IDN homographs. Before
    any comparison, fully normalize the URL/domain: expand Punycode (xn-- labels) back to Unicode and
    skeleton-compare to protected brands, strip userinfo (anything before ''@'', a classic deception trick),
    and decode integer/hex/octal host encodings. Any xn-- label that decodes to a brand look-alike, or
    a host whose obfuscated encoding hides a known-bad or look-alike destination, should be flagged. A
    positive result indicates deliberate evasion; benign internationalized domains will still resolve
    to their own legitimate skeletons rather than a protected brand''s.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Proxy logs
  - Email gateway logs
  - 'NAI: DNS resolvers, Web proxy, Email gateway, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each url in (http.uri, proxy.url, dns.query):\n  host = strip_userinfo(parse_host(url))\n\
      \  host = decode_int_hex_octal(host)\n  if host has 'xn--' label: host = punycode_to_unicode(host)\n\
      \  if skeleton(host) in protected_skeletons and host != protected_name:\n    alert('punycode/obfuscated\
      \ look-alike host', url, looks_like=protected_name)"
- question: Did any inbound email fail DMARC identifier alignment while its visible From-domain is a look-alike
    of a protected brand?
  context: 'Supporting the Detect tactic for email-borne homoglyph phishing, DMARC (RFC 7489) is the floor:
    an enforcing protected domain cannot be exactly spoofed, so adversaries fall back to look-alike domains.
    Treat DMARC identifier-alignment failure (the visible From not aligned with the SPF/DKIM-authenticated
    domain) as the trigger, then escalate sharply when the From-domain is within edit-distance 2 of, or
    skeleton-equal to, a protected brand. This combination strongly indicates a targeted impersonation
    attempt. Alignment failures against random unrelated domains are lower priority; the look-alike correlation
    is what makes this high-confidence.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Proxy logs
  - Email gateway logs
  - 'NAI: DNS resolvers, Web proxy, Email gateway, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each msg in email_gateway_logs:\n  if msg.dmarc_alignment == 'fail':\n    fd = msg.header_from_domain\n\
      \    if any(damerau_levenshtein(fd,p) <= 2 or skeleton(fd)==skeleton(p) for p in protected_brands):\n\
      \      alert('DMARC fail + lookalike From-domain', msg, looks_like=p)"
- question: Which observed strings score as lexical anomalies based on entropy, n-gram likelihood, character-class
    composition, script count, and minimum distance to protected names?
  context: Supporting the Detect tactic, this statistical layer scores each observed string with Shannon
    entropy, n-gram likelihood, character-class counts (non-ASCII count, digit/letter ratio), script count,
    and minimum edit distance to the protected-name list. Strings that combine low distance to a protected
    name with high non-ASCII content and mixed scripts, above per-environment percentile thresholds, are
    likely homoglyph/typosquat artifacts. This feature set is validated at 16M+ domains (NIOM-DGA). Derive
    thresholds from your own baseline distribution rather than fixed constants so the scoring stays portable;
    treat strings above the high percentile as candidates for the deterministic and ML checks to confirm.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4625/4624
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each name in observed_strings:\n  f.entropy = shannon(name); f.ngram = ngram_loglik(name)\n\
      \  f.nonascii = count_non_ascii(name); f.scripts = count_scripts(name)\n  f.mindist = min(edit_distance(name,p)\
      \ for p in protected_names)\n  score = weighted_sum(f)\n  if score > percentile(score_baseline,\
      \ 99) and f.mindist <= 2 and f.nonascii > 0:\n    alert('lexical anomaly', name, score, features=f)"
- question: Does observed traffic match any pre-generated, popularity-weighted distance-1 look-alike variant
    of the organization's most-used canonical names?
  context: This statistical approach supports the Detect tactic by bounding false positives. Pre-generate
    the set of distance-1 look-alike variants (substitutions, insertions, deletions, transpositions, plus
    common homoglyph swaps) of the organization's most-visited and most-used canonical names, weighting
    by popularity so the highest-value targets get the broadest coverage. Then match observed DNS/proxy/process
    traffic against this candidate set. Because the candidate list is anchored to real, popular org assets,
    a match is high-confidence and immediately triageable. Names not in the candidate set still pass through
    the other layers, so this is a precision-oriented complement, not a sole detector.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4625/4624
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "candidates = {}\nfor p in top_canonical_names_by_popularity:\n  for v in generate_distance1_variants(p):\n\
      \    candidates[v] = p\nfor each name in (dns.query, proxy.host, process_name):\n  if name in candidates:\n\
      \    alert('matched pre-generated lookalike', name, looks_like=candidates[name])"
- question: Are there bursts of distinct confusable strings or confusable-domain queries/connections per
    host, subnet, or user cohort that exceed baseline?
  context: Supporting the Detect tactic, this captures the volume and frequency physics of a homoglyph/typosquat
    campaign. Track, per host/subnet/user cohort and per minute, the count of distinct confusable strings
    and the rate of confusable-domain queries or connection attempts; also include byte-volume ratios
    for connections to look-alike hosts. Alert when these exceed baseline (e.g., >3 sigma or a tuned absolute
    floor). A sudden burst of many distinct look-alike domains from one source suggests an automated campaign
    or beaconing to a fast-rotating look-alike infrastructure, whereas isolated single hits may be user
    typos. Baseline per cohort to avoid penalizing naturally chatty hosts.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4625/4624
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: 'Last 7 days (event-centered: pivot +/- 1 hour around any burst)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: "bin events by (src_host|subnet|user, minute)\nmetric = distinct_count(confusable_string) +\
      \ count(confusable_domain_query)\nbaseline = mean+3*stddev(metric over trailing 7d for cohort)\n\
      if metric > max(baseline, absolute_floor):\n  alert('confusable campaign burst', cohort, metric,\
      \ byte_ratio=bytes_to_lookalike/total_bytes)"
- question: Are there bursts of NXDOMAIN responses, failed logons, or blocked/reset connections involving
    look-alike domains or accounts confusable with privileged identities?
  context: 'This failure-mode profiling supports the Detect tactic by treating error/failure state as
    a distinct signal, because reconnaissance and spraying frequently fail before they succeed. Profile
    three failure streams against look-alike targets: bursts of NXDOMAIN responses to look-alike domains
    (Zeek dns.log rcode), failed logons (Windows Event ID 4625) by accounts confusable with privileged
    or service accounts, and blocked/reset connections to look-alike hosts. A spike in any of these tied
    to confusable names suggests an actor probing infrastructure or guessing against impersonated accounts.
    Correlate failures that later turn into successes (4624) on the same confusable account for the highest-priority
    escalation.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4625/4624
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "nx = count(dns.log where rcode==NXDOMAIN and is_lookalike(query)) per minute\nfl = count(EventID\
      \ 4625 where confusable_with_privileged(account)) per user\nbr = count(conn.log where conn_state\
      \ in {REJ,RST} and is_lookalike(dest)) per host\nif nx>baseline or fl>baseline or br>baseline:\n\
      \  alert('failure-mode burst (recon/spray)', target, streams={nx,fl,br})\nescalate if same confusable\
      \ account later has EventID 4624 success"
- question: When rendered as images, do any observed strings score as visually similar to a protected
    name using a Siamese convolutional neural network?
  context: Supporting the Detect tactic, this ML layer catches glyph substitutions that defeat code-point
    comparison (visually identical or near-identical characters not captured by confusables.txt). Render
    both observed and protected strings to images and score visual similarity with a Siamese CNN. When
    similarity exceeds the threshold, emit the nearest legitimate name as an explainable 'looks like <legit>'
    output so analysts can prioritize triage and blocking. This runs in parallel with, and never replaces,
    the deterministic skeleton/edit-distance floor. A high visual-similarity score on a string that is
    NOT the legitimate name is strong evidence of intentional impersonation even when raw code points
    appear unrelated.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: ML/Scoring pseudocode
    query: "for each name in observed_strings:\n  img = render_to_image(name)\n  legit, sim = siamese_cnn.nearest(img,\
      \ protected_image_index)\n  if sim >= visual_threshold and name != legit:\n    alert('visual-similarity\
      \ homoglyph', name, looks_like=legit, similarity=sim)"
- question: Does a supervised classifier flag any observed look-alike strings as malicious, and does the
    alert surface the top-3 contributing features?
  context: 'Supporting the Detect tactic, this is a supervised classifier trained on benign vs malicious
    look-alike strings using the lexical/Unicode/contextual features ranked by NIOM-DGA: length, non-ASCII
    count, script count, entropy, nearest-trusted distance, and query/connection frequency. Crucially,
    the alert MUST surface the top-3 contributing features alongside the score, not just the score, so
    analysts can validate and act on the model''s reasoning (e.g., ''flagged because nearest-trusted distance=1,
    script count=2, non-ASCII count=3''). This explainability requirement makes the ML output defensible
    and triageable; a black-box score alone is insufficient for SOC action.'
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: ML/Scoring pseudocode
    query: "for each name in observed_strings:\n  x = features(name)  # length, nonascii, scripts, entropy,\
      \ nearest_dist, freq\n  score = classifier.predict_proba(x)\n  if score >= malicious_threshold:\n\
      \    top3 = explain(classifier, x).top(3)\n    alert('supervised lookalike classifier', name, score,\
      \ top_features=top3)"
- question: Are model inputs sanitized to strip non-rendering code points and restricted to expected scripts
    before any ML inference?
  context: This control underpins the Detect tactic's ML layer by ensuring the models cannot be evaded
    by imperceptible Unicode perturbations (Bad Characters / imperceptible NLP attacks). Before any model
    inference, strip and normalize non-rendering code points (invisibles, soft hyphen U+00AD, zero-width
    characters) and restrict input to expected scripts. Without sanitization, an adversary can inject
    characters that are invisible to a human but shift the model's tokenization or feature vector, defeating
    both the Siamese and supervised classifiers. Verify the sanitization stage exists and is applied to
    100% of inputs; any unsanitized inference path is a detection gap. ML augments, never replaces, the
    deterministic skeleton/edit-distance floor.
  answer_sources:
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: DNS resolvers, User endpoints, Domain Controllers, Network egress points'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: "def sanitize(name):\n  name = strip(name, INVISIBLE | SOFT_HYPHEN | ZERO_WIDTH)\n  name =\
      \ NFC(name)\n  name = restrict_to_expected_scripts(name)\n  return name\nassert every inference\
      \ path calls sanitize() before model.predict()\naudit: count inferences where input != sanitize(input)\
      \  # must be 0"
