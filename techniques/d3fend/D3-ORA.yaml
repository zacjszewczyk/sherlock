name: 'D3-ORA: Operational Risk Assessment'
id: c5a422c0-f029-497f-9b59-0f466e0e04de
description: Investigate and validate the organization's operational risk posture by building a defensible,
  evidence-driven model of which assets matter most and how exposed they are. This playbook helps an analyst
  map business-critical processes to their supporting IT assets, quantify and explain each asset's risk
  based on its criticality (centrality in observed network dependencies), utilization (volume and frequency
  baselines), and vulnerability/exposure posture, and surface failure-state signals such as failed logons
  and blocked connections. It further guides the analyst through maintaining a current and historical
  inventory of vulnerabilities on those assets - intrinsic severity (CVSS), asset-context-adjusted severity
  (CVSS Environmental), data-driven exploitation probability (EPSS), patch status, and remediation-coverage/latency
  failure metrics - derived primarily from first-party observable data so that remediation effort is prioritized
  toward risks that are severe, on highly utilized crown-jewel assets, and genuinely likely to be exploited.
  Deterministic, explainable rules form the authoritative floor; statistical and machine-learning methods
  are advisory and must remain interpretable.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which internal servers act as dependency hubs - receiving connections from an outsized number
    of distinct internal clients - and therefore behave like crown-jewel assets whose compromise would
    have outsized operational impact?
  context: Under the Model tactic the analyst needs a data-driven view of which assets are structurally
    central to the enterprise. By mapping every internal-to-internal flow in Zeek conn.log and ranking
    servers by in-degree (the number of distinct internal source IPs that connect to them), assets in
    the top 5% or with more than ~50 distinct internal clients per day stand out as candidate critical
    assets. Where host/network configuration and scanner facts exist, encode them and use logic-based
    attack-graph reasoning (MulVAL-style) to derive multi-host reachability to the highest-ranked targets.
    A positive result is a small set of high-fan-in servers that should receive priority hardening, monitoring,
    and business-impact analysis; a negative result (flat in-degree distribution) suggests dependencies
    are diffuse and centrality is a weaker risk signal.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Core network segments containing business-critical servers (e.g., database, application, authentication
    servers).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: FROM zeek.conn WHERE orig_h IN internal AND resp_h IN internal | GROUP BY resp_h | COUNT distinct(orig_h)
      AS in_degree | RANK desc | FLAG WHERE in_degree >= percentile(in_degree, 95) OR in_degree > 50
  - technology: SIEM/Rule pseudocode
    query: facts(host_config, open_services, scanner_findings) -> derive reachable(attacker, crown_jewel)
      via attack_graph; output paths terminating at top in-degree assets
- question: When each asset's criticality tier (Low/Moderate/High) is crossed with its exposure tier (from
    observed reachability and open services), what operational risk rating does the deterministic NIST
    SP 800-30 likelihood-by-impact matrix assign to each asset?
  context: This is the deterministic, auditable backbone of the risk model. Assign each asset an ordinal
    criticality tier from its business-process mapping and an exposure tier from observed reachability/open
    services, then look up the operational risk rating in the NIST SP 800-30 Rev 1 likelihood-by-impact
    matrix and asset-impact taxonomies. These hard tier rules are the deterministic floor and must override
    any statistical or ML output that would downgrade a High/High asset. A positive result is a ranked
    register of assets at High operational risk that demands authorizing-official attention; the method
    is reproducible and defensible for governance and audit purposes.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Core network segments containing business-critical servers (e.g., database, application, authentication
    servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each asset: crit_tier = map(business_process); expo_tier = map(reachability, open_services);
      risk = NIST_80030_matrix[likelihood(expo_tier)][impact(crit_tier)] | EMIT asset, crit_tier, expo_tier,
      risk | SORT risk desc'
- question: Which assets exceed high-percentile baselines for both data volume and authentication frequency
    (marking them as heavily relied-upon), and which show an abnormally high ratio of failed to successful
    logons that signals an exposure or attack condition?
  context: Utilization is a measurable proxy for operational importance. For each asset compute Volume
    (95th percentile of daily orig_bytes+resp_bytes from Zeek conn.log), Frequency (95th percentile of
    daily unique user authentications from Windows Event ID 4624), and State (ratio of failed Event ID
    4625 to successful 4624 logons). Assets exceeding a high-percentile threshold in BOTH volume and frequency
    are flagged for formal business-impact analysis. Independently, an unusually high 4625:4624 failure
    ratio is a distinct exposure/attack signal (password spraying, brute force, or a broken dependency).
    Thresholds must be derived from your own 30-90 day distributions, not fixed constants, so the model
    adapts to your fleet. A positive volume+frequency result confirms a high-utilization asset; a high
    failure ratio warrants immediate authentication-abuse investigation.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Core network segments containing business-critical servers (e.g., database, application, authentication
    servers).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM zeek.conn | per asset, per day: bytes=sum(orig_bytes+resp_bytes) | volume_p95 = percentile(daily
      bytes,95)'
  - technology: SIEM/Stats pseudocode
    query: freq_p95 = percentile(daily distinct_user count from EventID 4624, 95); fail_ratio = count(4625)/count(4624)
      per asset | FLAG asset WHERE volume_p95>=thr AND freq_p95>=thr; FLAG asset WHERE fail_ratio > baseline_mean
      + 3*baseline_std
- question: When assets and the vulnerabilities/privileges on them are ranked by eigenvector (PageRank-style)
    centrality over the dependency/attack graph - with edges weighted by CVSS exploitability - which choke-point
    assets emerge as the most attack-critical regardless of raw connection counts?
  context: Raw in-degree can overstate the importance of noisy but harmless hosts. AssetRank applies eigenvector/PageRank-style
    centrality over the dependency/attack graph, weighting edges by CVSS exploitability, so an asset's
    score reflects its structural role in feasible attack paths rather than mere connection volume. The
    resulting ranks identify choke-point assets and the specific vulnerabilities/privileges that make
    them pivotal, letting the analyst prioritize hardening where it most reduces realizable attack potential.
    A positive result is a ranked list of attack-critical assets that frequently differs from the naive
    connection-count ranking - those differences are the most valuable, since they highlight quietly pivotal
    infrastructure.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Core network segments containing business-critical servers (e.g., database, application, authentication
    servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: G = dependency_attack_graph; weight(edge) = cvss_exploitability; rank = pagerank(G, weights)
      | JOIN asset_vulns | EMIT asset, rank, top_contributing_vulns | SORT rank desc
- question: Into what functional roles (web, database, authentication, IoT, etc.) do assets cluster based
    on their observed network and authentication behavior, and do those data-driven roles match the documented
    asset inventory?
  context: 'An accurate, behavior-derived asset inventory underpins all downstream risk modeling. Cluster
    or classify assets into functional roles using features extracted from Zeek conn.log and authentication
    logs - distinct peers, port/protocol diversity, packet sizes, inter-arrival timing, and bytes transferred.
    Report the top-3 discriminative features behind each role assignment so analysts can validate it.
    Cluster membership is advisory: the deterministic in-degree/criticality rules remain authoritative,
    consistent with the interpretability and base-rate cautions in ''Outside the Closed World.'' A positive
    result is a clustering that cleanly separates roles and matches reality; mismatches - a host classed
    as a database server but absent from the CMDB, or an IoT cluster on a sensitive segment - are high-value
    leads for inventory correction or rogue-device detection.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Core network segments containing business-critical servers (e.g., database, application, authentication
    servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: features = [distinct_peers, port_proto_diversity, pkt_size_stats, inter_arrival, bytes] per
      asset; model = cluster(features) | LABEL clusters as roles; EMIT asset, role, top3_features | COMPARE
      role vs cmdb_role -> FLAG mismatches
- question: Which assets carry critical (CVSS base > 9.0) vulnerabilities based on the software names
    and versions observed in network and install logs, and which of those vulnerabilities are actually
    reachable/exploitable in your network context rather than merely present?
  context: Vulnerability inventory must start from observable first-party data. Extract all software names
    and versions from Zeek software.log and Windows Event ID 11707 (MSI install logs), cross-reference
    against NVD/CVE to find assets carrying critical vulnerabilities (CVSS base > 9.0), and - where configuration
    and scanner facts exist - apply logic-based reachability (MulVAL-style) to confirm which of those
    vulnerabilities an attacker could actually exploit given network position and controls. This separates
    the large set of 'present' vulnerabilities from the smaller, urgent set of 'exploitable in context'
    ones. A positive result is a prioritized list of reachable critical CVEs; a present-but-unreachable
    finding can be deprioritized but documented.
  answer_sources:
  - Zeek software.log
  - Windows Event ID 11707
  - Vulnerability Scanner Logs
  - 'NAI: Enterprise-wide endpoint devices and servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: FROM zeek.software UNION EventID 11707 | EXTRACT (software, version) | JOIN nvd_cve ON software,version
      WHERE cvss_base > 9.0 | EMIT asset, cve, cvss_base
  - technology: SIEM/Rule pseudocode
    query: facts(config, scanner, network_topology) -> derive exploitable(cve, asset) via reachability;
      FLAG critical cves WHERE exploitable=true
- question: After re-scoring each vulnerability with the CVSS v3.1 Environmental metric group - setting
    CR/IR/AR from the asset's criticality tier and applying local mitigations via modified base metrics
    - how does the asset-context-adjusted severity differ from the raw base score?
  context: 'A raw CVSS base score ignores where the vulnerability lives. Re-score each vulnerability deterministically
    with the CVSS v3.1 Environmental metric group: set Confidentiality/Integrity/Availability Requirements
    (CR/IR/AR) from the asset''s criticality tier and apply any local mitigations through modified base
    metrics, producing a reproducible, context-adjusted severity. This raises the effective severity of
    vulnerabilities on crown-jewel assets and lowers it where compensating controls exist. The method
    is deterministic and auditable, making it the authoritative input to remediation prioritization. A
    positive result is a recomputed severity register where high-criticality assets surface to the top
    even when their raw CVSS scores were moderate.'
  answer_sources:
  - Zeek software.log
  - Windows Event ID 11707
  - Vulnerability Scanner Logs
  - 'NAI: Enterprise-wide endpoint devices and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each (asset, cve): CR,IR,AR = map(asset.criticality_tier); modified_base = apply(local_mitigations);
      env_score = cvss31_environmental(base_metrics, modified_base, CR, IR, AR) | EMIT asset, cve, base_score,
      env_score | SORT env_score desc'
- question: When intrinsic severity, asset utilization, and exploitation likelihood are combined into
    a single composite score (environmental_severity x EPSS), which vulnerabilities rise to the top of
    the remediation queue, and what do the coverage/latency failure metrics say about remediation health?
  context: 'Effective remediation targets risks that are severe, on highly utilized assets, AND likely
    to be exploited. For each vulnerability compute a composite: environmental_severity (CVSS base x a
    criticality factor derived from the asset''s 95th-percentile connection volume) x EPSS exploitation
    probability, then rank remediation by this score. Separately track failure/coverage metrics as distinct
    signals: percentage of assets not scanned in N days, count of overdue critical patches, and the patch-latency
    (time-to-remediate) distribution. A positive result is a defensible remediation order plus a dashboard
    of program health; rising scan gaps or lengthening patch latency indicate the remediation pipeline
    itself is a growing operational risk.'
  answer_sources:
  - Zeek software.log
  - Windows Event ID 11707
  - Vulnerability Scanner Logs
  - 'NAI: Enterprise-wide endpoint devices and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: score = (cvss_base * crit_factor(asset.volume_p95)) * epss(cve) | RANK desc; ALSO compute pct_assets_unscanned(N
      days), count(overdue_critical_patches), distribution(time_to_remediate)
- question: Based on the weekly count of newly discovered critical vulnerabilities, what is the forecasted
    patching workload, and do residual anomalies reveal a sudden discovery spike that could signal a new
    widespread flaw?
  context: Resource planning and early warning both benefit from time-series modeling. Fit a model (e.g.,
    ARIMA) to the weekly count of newly discovered critical vulnerabilities to forecast upcoming patching
    workload and staffing needs, then run anomaly detection on the residuals to flag sudden spikes that
    may indicate a newly disclosed, widely applicable flaw in your environment. Validate against realistic
    historical data and surface the contributing window/seasonality so the forecast is interpretable.
    A positive forecast lets the team pre-stage remediation capacity; a residual anomaly is an actionable
    lead to investigate what new vulnerability class just appeared en masse.
  answer_sources:
  - Zeek software.log
  - Windows Event ID 11707
  - Vulnerability Scanner Logs
  - 'NAI: Enterprise-wide endpoint devices and servers.'
  range: Last 365 days
  queries:
  - technology: SIEM/ML pseudocode
    query: series = weekly count(new critical vulns); model = ARIMA(series); forecast = predict(model,
      horizon=8w); resid = series - fitted; FLAG WHERE |resid| > k*sigma | REPORT window, seasonality,
      forecast
- question: Using a data-driven exploit-prediction model (e.g., EPSS v3 gradient-boosted trees over CVE
    text, CWE/ATT&CK tags, exploit-code availability, reference counts, and daily exploitation telemetry),
    which vulnerabilities are most likely to be exploited, and what top features drive each prediction?
  context: 'Because only a small fraction of CVEs are ever exploited, prioritization should be weighted
    toward the high-probability tail. Use a gradient-boosted exploit-prediction model (EPSS v3-style)
    over CVE text, CWE/ATT&CK tags, exploit-code availability, reference counts, and daily exploitation
    telemetry to rank which vulnerabilities are most likely to be exploited, and include the top-3 contributing
    features (e.g., public exploit available, vendor/product, CWE class) in each alert for triage. Respect
    the low base rate: most CVEs are never exploited, so concentrate remediation on the few high-probability
    items. A positive result is a short, well-justified list of likely-exploited vulnerabilities; the
    feature explanations let an analyst sanity-check each ranking before committing effort.'
  answer_sources:
  - Zeek software.log
  - Windows Event ID 11707
  - Vulnerability Scanner Logs
  - 'NAI: Enterprise-wide endpoint devices and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: score = epss_v3.predict(features=[cve_text, cwe_attack_tags, exploit_code_avail, ref_count,
      daily_telemetry]) | RANK desc | EMIT cve, prob, top3_features | FOCUS on high-probability tail (low
      base-rate aware)
