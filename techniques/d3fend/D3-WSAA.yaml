name: 'D3-WSAA: Web Session Activity Analysis'
id: 95207e15-b4c4-47f6-8e06-8d202b6f034c
description: Investigate web session activity for behavior that deviates from per-application and per-principal
  baselines or matches known-malicious patterns. This playbook helps an analyst hunt for session hijacking,
  credential stuffing/account takeover, automated scraping and scanning, command-and-control beaconing
  over HTTP(S), forced browsing/enumeration, injection/parameter tampering, and man-in-the-browser activity
  by examining user agents, session duration, request frequency, navigation sequences, request and parameter
  structure, HTTP status/error ratios, byte volumes, geo/IP novelty, and session reuse across sources.
  Because all client-reported identity fields (User-Agent, client hints, cookies) are forgeable, the questions
  emphasize corroborating client claims with server-side behavioral evidence and transport-layer fingerprints
  (JA3/JA3S). It spans deterministic watchlists, statistical baselining, and machine-learning anomaly
  scoring so that novel automation is caught even before learned baselines stabilize.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any web sessions presenting User-Agent strings that match known scanner, automation, recon-tool,
    or malleable-C2 signatures (e.g., curl, wget, python-requests/urllib, Go-http-client, nikto, sqlmap,
    masscan, Nmap NSE, or fixed-UA/header-order/cookie patterns)?
  context: 'In the Detect tactic this is the cheapest, highest-confidence floor: a deterministic watchlist
    of known-bad User-Agent substrings matched against the user_agent field in Zeek http.log and web/proxy
    access logs. Seed and maintain it from the SigmaHQ ''Suspicious User-Agents Related To Recon Tools''
    rule and from the persistent fixed-UA / header-order / cookie regex signatures documented for Cobalt
    Strike Malleable C2 profiles. A match strongly suggests automated scanning, vulnerability probing,
    scraping, or C2 traffic rather than a human browser. Treat the User-Agent as forgeable: a match is
    a strong lead, but absence of a match does not clear a session. Alert with the source IP/ASN, the
    requested host, and the specific matched indicator so an analyst can triage quickly.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "watchlist = [\"curl\",\"wget\",\"python-requests\",\"urllib\",\"Go-http-client\",\"nikto\"\
      ,\"sqlmap\",\"masscan\",\"Nmap NSE\"]\nfor rec in zeek.http:\n  if any(s.lower() in rec.user_agent.lower()\
      \ for s in watchlist) or matches_malleable_c2(rec.user_agent, rec.header_order, rec.cookie):\n \
      \   alert(src=rec.id_orig_h, host=rec.host, indicator=matched, ua=rec.user_agent)"
  - technology: SIEM/Rule pseudocode
    query: 'index=web (sourcetype=zeek_http OR sourcetype=access_log)

      | eval ua=lower(user_agent)

      | where match(ua, "curl|wget|python-requests|urllib|go-http-client|nikto|sqlmap|masscan|nmap")

      | table _time src_ip host uri user_agent | sort -_time'
- question: Is the same web session token or cookie being used from more than one source IP, JA3 fingerprint,
    or User-Agent within a short window, indicating session hijacking or credential replay?
  context: 'Within Detect, this targets session hijacking and stolen-cookie replay. Extract session identifiers/cookies
    from Zeek http.log and alert when one token appears from >1 source IP, >1 JA3, or >1 User-Agent inside
    a short window (default 15 minutes) — a legitimate user normally holds one token from one client.
    Rank by edge rarity: a token first seen from a new (user, source-IP) pair not observed in the prior
    30 days is high severity, mirroring the rare-edge authentication-graph baselining of Kent et al. A
    positive result (one token, multiple distinct sources) is a strong indicator of compromise; include
    both source IPs/ASNs and both User-Agents in the alert to speed scoping.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=web sourcetype=zeek_http session_token=*

      | bin _time span=15m

      | stats dc(src_ip) as ips dc(ja3) as ja3s dc(user_agent) as uas values(src_ip) as src_ips values(user_agent)
      as agents by session_token _time

      | where ips>1 OR ja3s>1 OR uas>1

      | lookup known_token_edges_30d session_token src_ip OUTPUT seen

      | eval severity=if(isnull(seen),"high","medium")'
- question: Do any sessions declare a browser/OS in their User-Agent that is inconsistent with the TLS
    JA3/JA3S handshake fingerprint observed for that connection (e.g., UA claims Chrome/Firefox but JA3
    maps to a scripting runtime or no known browser)?
  context: For Detect, this cross-checks a forgeable client claim against a harder-to-forge transport-layer
    fingerprint. Join the Zeek http.log User-Agent to the session's TLS JA3/JA3S fingerprint from ssl.log
    and flag mismatches using per-browser handshake heuristics. Real browsers produce characteristic JA3
    fingerprints; a session whose UA claims a mainstream browser but whose JA3 maps to python/Go/curl
    or to no known browser is likely spoofed automation or tooling masquerading as a browser. Surface
    the declared UA and observed JA3 so the analyst can confirm the inconsistency and pivot to other sessions
    sharing the anomalous JA3.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join http.log and ssl.log on connection uid\nfor sess in joined:\n  declared = parse_browser(sess.user_agent)\n\
      \  expected_ja3 = browser_ja3_profile.get(declared)\n  if sess.ja3 not in expected_ja3 or declared\
      \ in (\"Chrome\",\"Firefox\",\"Safari\",\"Edge\") and is_script_stack(sess.ja3):\n    alert(uid=sess.uid,\
      \ declared_ua=sess.user_agent, observed_ja3=sess.ja3)"
- question: Are there web sessions whose duration, total request count, or requests-per-minute exceed
    the rolling per-IP / per-principal baseline (p99) or a deterministic high-volume floor, indicating
    automation, scraping, or credential stuffing?
  context: In Detect, volumetric profiling catches non-human pacing. For each source IP and authenticated
    principal compute rolling 30-day baselines (mean, p95, p99) of session duration, HTTP requests per
    session, and requests/min, then alert on sessions exceeding p99. Keep a hard deterministic floor (e.g.,
    >120 requests/min from a single session, or >1000 requests/session to a non-API host) so novel high-volume
    automation is caught before baselines stabilize. This per-application access-frequency/inter-request-time
    profiling follows Kruegel and Vigna. A positive result suggests scripted traversal, brute force, or
    scraping; a benign explanation may be a legitimate API client or sync job, so correlate with the host
    and principal.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=web sourcetype=zeek_http

      | stats count as reqs dc(uri) as urls range(_time) as dur by session_id src_ip user

      | eval rpm=reqs/(dur/60)

      | eventstats p99(rpm) as p99_rpm p99(dur) as p99_dur by user

      | where rpm>p99_rpm OR dur>p99_dur OR rpm>120 OR (reqs>1000 AND NOT match(host,"api"))'
- question: Do any HTTP requests contain query parameters whose length, character distribution, or structure
    deviates from the learned benign profile for that URL and parameter, indicating injection, tampering,
    or oversized/encoded payloads?
  context: Under Detect, this finds injection and parameter-tampering attempts inside otherwise normal-looking
    sessions. Per URL and per query parameter, learn benign baselines for attribute length (Chebyshev
    bound), character distribution (chi-square against the learned descending-frequency profile), and
    structure (a Markov / probabilistic-grammar model), then flag requests exceeding the learned thresholds,
    per Kruegel and Vigna. This captures SQLi/XSS/command-injection payloads, tampered parameters, and
    oversized or Base64-encoded values. Surface the offending parameter and which model (length, character
    distribution, or structure) fired so the analyst can confirm the payload and assess exploitation.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each (url,param) baseline: mean_len,std_len, char_freq_profile, structure_model\nfor req\
      \ in http:\n  for p in req.params:\n    if chebyshev_len(p.value, baseline) OR chi2_charfreq(p.value,\
      \ baseline)>thr OR markov_structure(p.value)<thr:\n      alert(url=req.url, param=p.name, model=which_fired,\
      \ value=p.value)"
- question: Are there sessions whose page/endpoint navigation order is implausible for a human — low joint
    transition probability or abnormally high navigation entropy — consistent with scraping, credential
    stuffing, or replay?
  context: For Detect, navigation modeling separates scripted traversal from human browsing. Build a per-application
    Markov / variable-order Markov model of normal page/endpoint transition probabilities and flag sessions
    whose joint transition probability falls below a learned threshold or whose navigation entropy is
    abnormally high. Higher-order chains better separate scripted from human flows (Huang et al.; Cloudflare
    variable-order Markov chains with Bayesian credible intervals). Bots often hit endpoints out of the
    normal UI flow (deep-linking, skipping forms, hammering an API). Report the lowest-probability transition
    in the alert so the analyst can see exactly where the session diverged from expected behavior.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model = variable_order_markov(per_app_transitions_30d)\nfor sess in sessions:\n  jp = joint_transition_prob(sess.page_sequence,\
      \ model)\n  ent = nav_entropy(sess.page_sequence)\n  if jp < learned_threshold OR ent > entropy_threshold:\n\
      \    alert(session=sess.id, lowest_prob_transition=argmin(sess.transitions))"
- question: Do any sessions or source IPs show elevated HTTP failure ratios broken out by type — 401/403
    (auth failures / credential stuffing), 404 (forced browsing / enumeration), or 5xx (fuzzing)?
  context: 'In Detect, error-ratio profiling distinguishes attack types that pure success-volume metrics
    miss. Profile per-session and per-IP rates of HTTP failures as distinct signals: 401/403 point to
    credential stuffing / account takeover, repeated 404s point to forced browsing and content enumeration,
    and bursts of 5xx point to fuzzing. Alert when the failed-request ratio exceeds baseline (default:
    >30% 4xx over >=20 requests, or >10 consecutive 401/403), and combine with geo/IP novelty and impossible-travel
    baselining (Microsoft Defender for Cloud Apps). Include the failure breakdown (counts by status code)
    in the alert so the analyst can tell brute force from scanning from fuzzing.'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=web sourcetype=zeek_http

      | stats count as reqs count(eval(status>=400 AND status<500)) as c4xx count(eval(status IN(401,403)))
      as auth_fail count(eval(status>=500)) as c5xx by session_id src_ip

      | eval ratio4xx=c4xx/reqs

      | where (ratio4xx>0.30 AND reqs>=20) OR auth_fail>10 OR c5xx>20'
- question: Is any authenticated principal accessing the application from a new country/ASN, an anonymizing
    service (Tor/VPN/hosting), or an impossible-travel pair of sessions?
  context: For Detect, location novelty surfaces account takeover and credential theft. For each authenticated
    principal, baseline the set of source countries/ASNs and flag sessions from a new country, an anonymizing
    or hosting-provider IP, or impossible-travel pairs (two sessions whose geographic distance over elapsed
    time implies infeasible velocity), per Microsoft Defender for Cloud Apps and the rare-edge model of
    Kent et al. A positive result is a strong account-takeover indicator, though VPN use and travel produce
    false positives — surface the prior vs. new location/ASN and the time delta so the analyst can judge
    feasibility.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=web sourcetype=zeek_http user=*

      | iplocation src_ip | lookup asn_db src_ip OUTPUT asn anon_flag

      | stats earliest(_time) as t values(Country) as ctry values(asn) as asns by user src_ip

      | lookup user_geo_baseline_30d user OUTPUT known_countries known_asns

      | where NOT match(ctry,known_countries) OR anon_flag=1 OR impossible_travel(user, _time, src_ip)'
- question: When User-Agent strings are clustered by similarity, do any small, isolated clusters represent
    rare or nonsensical UAs consistent with custom tooling or malformed automation?
  context: Within Detect, unsupervised clustering catches bespoke tooling that no watchlist anticipates.
    Vectorize User-Agent strings (TF-IDF / character n-grams) and apply density clustering (DBSCAN); investigate
    small, isolated clusters representing rare or nonsensical UAs. Custom malware and scrapers frequently
    use unique or malformed UA strings that fall outside the dense clusters of mainstream browsers. Report
    the nearest-known-good UA and the cluster size for explainability, and pair this with the deterministic
    UA watchlist as the floor so both known and novel anomalous UAs are covered.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = tfidf_char_ngrams(distinct_user_agents)\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      for cluster in small_or_noise_clusters(labels):\n  report(uas=cluster.members, size=len(cluster),\
      \ nearest_known_good=nn(cluster, known_good_uas))"
- question: When each session is reduced to a multi-feature vector and scored by an unsupervised anomaly
    model, which sessions exceed the p99 anomaly threshold, and which features drove the score?
  context: For Detect, holistic per-session scoring catches combinations of weak signals that no single
    rule flags. Assemble a per-session feature vector (requests/min, total bytes in/out and out:in ratio,
    duration, distinct URLs, 4xx/5xx ratio, UA rarity, JA3 rarity, navigation entropy) and score it with
    an unsupervised Isolation Forest or an online autoencoder ensemble (Kitsune). Alert on scores above
    the p99 path-length / reconstruction-error threshold and surface the top-3 contributing features in
    the alert text for explainability. Keep the deterministic and statistical detections running in parallel
    as the floor so the ML layer augments rather than replaces them.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = [rpm, bytes_in, bytes_out, out_in_ratio, duration, distinct_urls, ratio_4xx, ratio_5xx,\
      \ ua_rarity, ja3_rarity, nav_entropy]\nscore = IsolationForest().score(feat)   # or autoencoder\
      \ reconstruction error (Kitsune)\nif score > p99_threshold:\n  alert(session=id, score=score, top3=top_features(feat,\
      \ score))"
- question: Using a sequence model trained on each application's request stream, are there session steps
    where the observed next request is not among the top-g most probable predictions, indicating anomalous
    longer-range navigation?
  context: In Detect, deep sequence modeling complements the Markov model by capturing longer-range dependencies.
    Treat each application's page/endpoint stream as a language and train an LSTM to predict the next
    request given session history; flag a session step when the observed next request is not among the
    top-g most probable predictions, per DeepLog (Du et al.). This catches anomalous traversal patterns
    that span many steps and that order-1 Markov models miss. Surface the specific deviating step and
    its predicted alternatives so the analyst can see what the model expected versus what the session
    actually did.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = LSTM_next_request(trained_per_app)\nfor step in session.sequence:\n  preds = model.topk(history,\
      \ g)\n  if step.next_request not in preds:\n    alert(session=session.id, deviating_step=step, predicted=preds)"
- question: Where labeled training data exists, does a supervised classifier flag individual HTTP requests
    as attacks, and which lexical/structural features (via SHAP-style attribution) drove each verdict?
  context: For Detect, a supervised classifier adds precision where labels exist. Train a classifier on
    HTTP request lexical/structural features and emit per-request SHAP-style feature attributions so analysts
    see which features drove the verdict, per Akyon et al. Train and validate against the Web Attack subset
    of CIC-IDS2017 and derive dataset-specific thresholds before deployment to control false positives.
    The model classifies requests as benign or attack; reporting the top-3 contributing features per alert
    lets the analyst confirm the classification and understand the attack class (injection, XSS, etc.).
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Web server access logs
  - Proxy logs
  - 'NAI: Our organization''s internet gateway and proxy servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "clf = train_supervised(features=lexical_structural, data=CICIDS2017_webattack)\nfor req in\
      \ http:\n  y, p = clf.predict(req)\n  if y==\"attack\" and p>dataset_threshold:\n    alert(req=req.url,\
      \ verdict=y, top3=shap_top_features(clf, req))"
