name: 'D3-NTF: Network Traffic Filtering'
id: cae5ff74-7cfb-44af-96fb-ad16e9509896
description: Investigate the effectiveness and integrity of network traffic filtering at key ingress/egress
  chokepoints and on host-based firewalls. This playbook helps an analyst confirm that filtering rules
  are actually enforced (deny logs present, blocked connections to known-bad indicators), detect default-allow
  or any-any permits that violate least-privilege/default-deny posture, statically verify policy reachability
  and isolation against exported firewall/ACL configurations, and surface shadowed, redundant, or never-matched
  rules. It further guides hunting for filtering bypass and egress gaps using statistical profiling (RFC1918/bogon
  leakage, outbound volume heavy-hitters, beaconing cadence, rejection-volume health, and per-source failure
  ratios) and machine-learning approaches (unsupervised egress flow anomaly detection, rare client-stack/JA4
  fingerprints, and encrypted-egress anomaly detection). Together these questions let a SOC analyst prove
  the filter blocks what policy requires rather than waiting for malicious traffic, and detect when a
  filtering device fails, is disabled, or is bypassed.
type: technique
related:
- tactic_id: D3-IS
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
