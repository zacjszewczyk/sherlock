questions:
- question: Are host-based and perimeter firewall block rules actually firing for known-bad indicators
    and the source/destination pairs policy requires us to drop, and does any matching ALLOW exist for
    the same tuple proving the rule failed or was bypassed?
  context: This validates that filtering rules are enforced, not merely configured. Query Windows Event
    ID 5157 (Filtering Platform Blocked Connection) and host/perimeter firewall deny logs for connections
    involving known-bad indicators and the tuples a default-deny least-privilege policy ([NIST SP 800-41
    Rev. 1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-41r1.pdf)) must drop.
    A matching deny confirms the rule is active; a corresponding ALLOW (Event ID 5156) for the same 5-tuple
    shows the rule failed, was reordered, or was bypassed. Reuse [SigmaHQ](https://github.com/SigmaHQ/sigma)
    firewall/Zeek content. Under Isolate, this measures whether filtering actually restricts prohibited
    communications.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '  index=firewall (EventID=5157 OR action=deny)

      | where dest_ip IN known_bad OR (src_ip,dest_ip,dest_port) IN policy_deny_list

      | stats count AS denies by src_ip,dest_ip,dest_port

      | join src_ip,dest_ip,dest_port [ search index=firewall (EventID=5156 OR action=allow) | stats count
      AS allows by src_ip,dest_ip,dest_port ]

      | where allows>0  // ALLOW for a tuple that must be denied = rule failed/bypassed'
  - technology: Zeek/pseudocode
    query: '  conn.log

      | where id.resp_h IN known_bad_indicators

      | select ts,id.orig_h,id.resp_h,id.resp_p,conn_state

      // conn_state SF to a known-bad dest indicates filter did not block'
- question: Is any firewall or host generating broad 'Allow' events (e.g., to 0.0.0.0/0 or Any) on non-standard
    ports, contradicting our least-privilege default-deny posture?
  context: Default-allow behavior undermines isolation. Alert when Windows Event ID 5156 (or perimeter
    allow logs) record permits for broad destination ranges (0.0.0.0/0, Any) on non-standard ports. Per
    [NIST SP 800-41 Rev. 1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-41r1.pdf)
    the posture must be default-deny/least-privilege, so any observed 'any-any' permit is a deterministic
    finding warranting rule review. This is tactic-relevant to Isolate because an overly broad permit
    is functionally a hole in the filter.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '  index=firewall (EventID=5156 OR action=allow)

      | where dest_cidr IN ("0.0.0.0/0","any") AND dest_port NOT IN (80,443,53)

      | stats count by host,src_ip,dest_cidr,dest_port,rule_id

      | where count>0  // any-any permit on non-standard port = deterministic finding'
- question: Does static reachability analysis of our exported firewall and ACL configurations show that
    any path policy requires to be blocked (e.g., user subnet to sensitive enclave, internal to arbitrary
    external port) is actually reachable?
  context: This proves the filter blocks what it should without waiting for malicious traffic. Periodically
    and on every ruleset change, compute reachability/isolation over exported firewall and ACL configs
    using header-space reachability checks ([Header Space Analysis](https://www.usenix.org/system/files/conference/nsdi12/nsdi12-final8.pdf))
    and incremental real-time verification ([NetPlumber](https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final8.pdf)).
    Alert when a path that policy mandates be blocked becomes reachable. A positive finding means a configuration
    gap exists in the isolation boundary; a clean result confirms enforced segmentation. This is central
    to Isolate, which depends on verifiable segmentation between zones.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: On every ruleset change (and weekly baseline)
  queries:
  - technology: Config-analysis/pseudocode
    query: "  configs = load_exports(firewall_rulesets, acls)\nmodel = header_space_build(configs)\nfor\
      \ (src,dst,port) in policy.must_block:\n    if reachable(model, src, dst, port):\n        alert(\"\
      isolation violation\", src, dst, port)\nrun on schedule AND on every ruleset change diff"
- question: Are there shadowed, redundant, or never-matched firewall rules where a deny is silently overridden
    by an earlier broad allow, permitting traffic that should be filtered?
  context: Shadowed rules silently defeat isolation. Analyze exported rulesets with model-finding/change-impact
    analysis ([The Margrave Tool for Firewall Analysis](https://www.usenix.org/legacy/event/lisa10/tech/full_papers/Nelson.pdf))
    to flag shadowed, redundant, or never-matched rules and compute the exact permit/deny diff after each
    edit. A deny rule shadowed by an earlier broad allow permits traffic that should be blocked; the alert
    should surface the offending rule IDs. Under Isolate, eliminating shadowed/redundant rules ensures
    the intended deny actually takes effect.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: On every ruleset change (and weekly baseline)
  queries:
  - technology: Config-analysis/pseudocode
    query: "  ruleset = load_export(firewall)\nfor deny in ruleset.denies:\n    earlier_allows = [a for\
      \ a in ruleset.allows if a.index<deny.index and overlaps(a,deny)]\n    if earlier_allows: alert(\"\
      shadowed deny\", deny.id, [a.id for a in earlier_allows])\nreport never_matched(ruleset) using hit-counters;\
      \ diff permit/deny set after each edit"
- question: Do we see RFC1918/bogon leakage at the internet gateway (inbound private/bogon sources or
    outbound private destinations), or any 5-tuple that produced a deny followed shortly by an allow for
    the same flow indicating a rule change or bypass?
  context: Anti-spoofing and egress hygiene ([NIST SP 800-41 Rev. 1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-41r1.pdf))
    require that RFC1918/bogon addresses never traverse the internet gateway. Alert on any inbound RFC1918/bogon
    source or outbound RFC1918 destination in Zeek conn.log, and on any 5-tuple that produced a deny (5157)
    followed within a short window by an allow (5156) for the same flow, which indicates a rule change
    or bypass. Use [SigmaHQ](https://github.com/SigmaHQ/sigma) network rules as a starting corpus. Block-then-allow
    sequences are strong evidence the filter's enforcement changed mid-stream, directly relevant to Isolate.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '  conn.log

      | where (is_bogon(id.orig_h) AND at_gateway_inbound) OR (is_rfc1918(id.resp_h) AND at_gateway_outbound)

      | alert "bogon/RFC1918 leakage"'
  - technology: SIEM/Rule pseudocode
    query: '  index=firewall (EventID=5157 OR EventID=5156)

      | sort _time | streamstats current=f last(EventID) AS prev by src_ip,dest_ip,dest_port

      | where prev=5157 AND EventID=5156 AND time_delta<300s  // block-then-allow for same flow'
- question: What percentage of connections at each chokepoint violate filtering policy (RFC1918 at the
    gateway, restricted enclaves, non-standard ports), and is that percentage greater than zero?
  context: This statistically quantifies filtering gaps. Analyze Zeek conn.log for traffic to/from ranges
    policy should block and compute the share of total connections that violate policy; any value greater
    than 0% indicates a filtering gap. Derive per-NAI thresholds from a clean baseline (the [Unified Host
    and Network Data Set](https://arxiv.org/abs/1708.07518) is a reference for per-subnet destination/port
    distributions). A non-zero violation rate at an enforcement point under Isolate means prohibited traffic
    is crossing the boundary.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '  zeek:conn

      | eval violation = policy_violates(id.orig_h,id.resp_h,id.resp_p)

      | stats count AS total, sum(violation) AS bad by chokepoint

      | eval pct = 100.0*bad/total

      | where pct>0  // any policy-violating fraction = filtering gap'
- question: Are there sustained outbound flows on non-standard ports from user subnets, or heavy-hitter
    external destinations carrying a disproportionate share of outbound bytes, that would indicate an
    egress filtering gap?
  context: Egress gaps often manifest as volume anomalies. Profile outbound Zeek conn.log/NetFlow by destination
    port and per-destination egress byte volume (orig_bytes). Alert on sustained outbound flows on non-standard
    ports (not 80/443/53) from user subnets and on heavy-hitter destinations carrying disproportionate
    outbound bytes ([Information-Based Heavy Hitters, Ozery et al.](https://www.ndss-symposium.org/wp-content/uploads/2024-388-paper.pdf)).
    Rank by total bytes and bytes-out/bytes-in ratio; tune the byte threshold to the 99th percentile of
    the local baseline. Reuse [RITA](https://github.com/activecm/rita) for first-party Zeek-only scoring.
    Large unsanctioned egress is a hallmark of exfiltration bypassing the filter, the core concern of
    Isolate.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '  zeek:conn where direction=outbound AND src_subnet IN user_subnets

      | stats sum(orig_bytes) AS out_bytes, sum(resp_bytes) AS in_bytes, count by id.resp_h,id.resp_p

      | eval ratio = out_bytes/(in_bytes+1)

      | where (id.resp_p NOT IN (80,443,53)) OR out_bytes>p99_baseline

      | sort -out_bytes'
- question: For each internal-to-external destination, is the connection cadence regular or periodic (low
    coefficient of variation, MAD, Bowley skewness, or FFT periodicity) in a way consistent with C2 beaconing
    that filtering should have restricted?
  context: Beaconing past the filter reveals an egress gap and likely C2. For each internal->external
    destination tuple, score connection-interval regularity (low coefficient of variation, MAD, Bowley
    skewness) and frequency-domain periodicity via FFT to find jittered cadence ([RITA](https://github.com/activecm/rita);
    [BAYWATCH, Hu et al.](https://dsail.kaist.ac.kr/files/WWW17.pdf)). Suppress benign automation using
    campus/edge periodic-traffic baselines and whitelists ([Mack et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf)).
    The alert should list destination, observed period, and connections/min. Detecting periodic egress
    that filtering nominally restricts directly supports the Isolate mission.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '  zeek:conn where direction=outbound

      | sort _time | streamstats range(_time) AS deltas by id.orig_h,id.resp_h

      | stats cv(deltas) AS cov, mad(deltas) AS mad, count AS conns by id.orig_h,id.resp_h

      | eval fft_peak = fft_periodicity(deltas)

      | where (cov<0.1 OR fft_peak>threshold) AND NOT in_whitelist(id.resp_h)

      | table id.orig_h,id.resp_h,period,conns_per_min'
- question: Has the volume of rejected/blocked connections deviated significantly from its forecast —
    dropping below the expected lower bound (filter failed/disabled) or spiking above the upper bound
    (scanning/bypass attempts)?
  context: Rejection-volume health is a sentinel for filter availability. Build a time-series model (e.g.,
    ARIMA) on hourly counts of conn_state='REJ' in Zeek conn.log and of Windows Event ID 5157 blocked
    connections. Forecast expected volumes; alert when actual rejections drop significantly below the
    forecast lower bound (a filtering device failed or was disabled) or spike above the upper bound (scanning/bypass
    attempts). Establish seasonal baselines from local history and references such as [Mack et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf)
    A collapse in denies at an Isolate chokepoint means the boundary is no longer enforcing.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '  union [zeek:conn where conn_state="REJ"] [siem:fw where EventID=5157]

      | timechart span=1h count AS rejections by chokepoint

      | forecast rejections method=ARIMA -> yhat,lower,upper

      | where rejections<lower OR rejections>upper  // failure (drop) or scan/bypass (spike)'
- question: For each internal source, is the ratio of failed/blocked connection states (REJ, S0, RSTO,
    5157 deny) to established (SF) connections spiking (outbound scanning/probing for gaps) or collapsing
    to near zero on a chokepoint that historically blocked traffic (filter no longer enforcing)?
  context: Per-source failure ratios reveal both probing and enforcement loss. For each internal source
    compute the ratio of failed/blocked states (REJ, S0, RSTO, 5157 deny) to successfully established
    (SF) connections per interval. A sudden ratio spike indicates outbound scanning or probing for filtering
    gaps; a ratio collapsing to ~0 on a chokepoint that historically blocked traffic indicates the filter
    is no longer enforcing. Derive per-role thresholds from baseline distributions ([Unified Host and
    Network Data Set](https://arxiv.org/abs/1708.07518)). Both failure modes are direct threats to the
    Isolate posture.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '  zeek:conn

      | eval failed = conn_state IN ("REJ","S0","RSTO") , est = conn_state="SF"

      | bin _time span=15m

      | stats sum(failed) AS f, sum(est) AS s by id.orig_h,_time

      | eval ratio = f/(s+1)

      | where ratio>spike_thr OR (was_blocking(id.orig_h) AND ratio~0)'
- question: Which outbound flows violate the learned benign egress baseline according to an unsupervised
    model (Isolation Forest / autoencoder) over flow features such as bytes, duration, port, destination
    rarity, and packet counts?
  context: Unsupervised modeling catches novel egress that rules miss. Train an unsupervised model on
    benign Zeek conn.log/NetFlow features (bytes, duration, port, dest rarity, packet counts) to flag
    flows that violate the learned egress baseline — Isolation Forest / deep autoencoders ([Malware Detection
    for IoT Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)), or an
    online autoencoder ensemble ([Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089), code https://github.com/ymirsky/Kitsune-py)
    for real-time scoring. Keep the deterministic policy rules as the floor and run ML in parallel. Each
    alert must surface the top-3 contributing features (e.g., destination rarity, outbound bytes, port)
    via SHAP/feature attribution ([XAI-in-IDS systematic review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    Anomalous egress that the filter passed is exactly what Isolate aims to surface.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  X = features(zeek_conn|netflow, [orig_bytes,duration,resp_p,dest_rarity,orig_pkts,resp_pkts])\n\
      model = IsolationForest().fit(benign_baseline(X))\nscores = model.decision_function(X_live)\nfor\
      \ f in X_live where anomaly(scores):\n    alert(flow=f, top3=shap_top_features(model,f))"
- question: Are rare or never-before-seen TLS client fingerprints (JA4/JA3) on outbound connections reaching
    external destinations that egress policy should constrain — evidence of a non-approved client or implant
    bypassing the filter?
  context: Rare client stacks on egress are high-signal. Compute JA4/JA3 fingerprints on outbound TLS
    (Zeek ssl.log) and score prevalence; a rare or never-before-seen client fingerprint reaching an external
    destination that egress policy should constrain is strong evidence of a non-approved client/implant
    bypassing filtering ([JA4+, FoxIO](https://github.com/FoxIO-LLC/ja4)). The alert should include the
    fingerprint, its global rarity, and the destination. Under Isolate, an unapproved client reaching
    out past the filter indicates the egress boundary is not constraining the host stack.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '  ssl.log

      | eval ja4 = ja4_fingerprint(client_hello)

      | stats count by ja4

      | eval rarity = prevalence(ja4)

      | join ja4 [ search ssl.log | table ja4,id.resp_h ]

      | where rarity<rare_thr AND egress_constrained(id.resp_h)

      | table ja4,rarity,id.resp_h'
- question: Where the filter passes TLS (port 443) and payloads cannot be inspected, do flow-metadata
    representations reveal anomalous encrypted egress without decryption?
  context: Encrypted egress can still be profiled by metadata. Where the filter passes TLS (443) and payloads
    cannot be inspected, apply self-supervised/contrastive representation learning on flow metadata to
    detect anomalous encrypted egress without decryption ([Anomaly Detection in Encrypted Network Traffic
    Using Self-Supervised Learning](https://www.nature.com/articles/s41598-025-08568-0)). Pair with explainable
    feature attribution ([XAI-in-IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full))
    so analysts see which flow features (size sequence, duration, SNI rarity) drove the score. This lets
    Isolate enforcement be validated even on opaque encrypted channels that a filter allows through.
  answer_sources:
  - Windows Event ID 5156 (Filtering Platform Connection)
  - Windows Event ID 5157 (Filtering Platform Blocked Connection)
  - Zeek conn.log
  - Zeek ssl.log
  - Firewall allow/deny logs
  - NetFlow/IPFIX
  - Firewall ruleset/configuration exports
  - 'NAI: Network egress/ingress points (internet gateways, proxies), host-based firewalls on critical
    servers and user endpoints, segmentation boundaries (VLAN/ACL) around sensitive data enclaves, and
    the firewall configuration/management plane where rulesets are authored and changed.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  X = flow_metadata(zeek_conn+ssl, [packet_size_seq,duration,sni_rarity,interarrival])\nenc\
      \ = selfsupervised_encoder.fit(benign_tls_flows)\nz = enc.transform(X_live_443)\nfor f where anomaly_score(z)\
      \ > thr:\n    alert(flow=f, drivers=feature_attribution(enc,f))"
