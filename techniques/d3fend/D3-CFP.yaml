  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = attention_LSTM.train(per_account_auth_sequences)

      p = model.score(new_sequence)

      alert where p < low_prob_threshold

      attach top3_attention_fields(account, src_host, auth_type)'
- question: Do per-session authentication/connection feature vectors score as anomalous under robust outlier
    models with attribution?
  context: 'Score per-session authentication/connection feature vectors (failed-login count, distinct-destination
    count, byte ratio, attempt rate) with Isolation Forest and One-Class SVM, using LIME to surface the
    top-3 contributing features in each alert. Prefer OCSVM where adversarial robustness matters (it is
    most robust under data poisoning). A positive result flags a session whose feature profile resembles
    automated default-credential abuse; the attribution tells the analyst which features drove the score.
    Use as a parallel layer to deterministic and statistical detections. This maps to the Harden tactic
    (D3-H): the analyst is validating that the Change Default Password control has been enforced, so any
    hit is a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(failed_login_count, distinct_dest_count, byte_ratio, attempt_rate) per session

      iso = IsolationForest.fit(X); ocsvm = OneClassSVM.fit(X)

      flag = iso.anomaly OR ocsvm.anomaly

      alert(flag) with LIME.top3(X)

      prefer ocsvm score where poisoning risk high'
- question: Can low-and-slow distributed credential guessing be surfaced by clustering authentication
    failures across many sources and target accounts?
  context: 'Cluster authentication failures across many source IPs and target accounts to surface low-volume
    default-credential probing that evades static thresholds. This catches distributed, patient campaigns
    where each source stays below per-source alerting limits. Run as a parallel layer to the deterministic
    4625 thresholds. A positive result is a cluster of coordinated low-rate failures worth investigating
    as a single campaign; a negative result indicates no coherent low-and-slow pattern. This maps to the
    Harden tactic (D3-H): the analyst is validating that the Change Default Password control has been
    enforced, so any hit is a hardening failure to remediate.'
