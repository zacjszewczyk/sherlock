name: 'D3-CFP: Change Default Password'
id: 5a5fde7d-8242-4757-95ee-0f160fb83362
description: Investigate the use of vendor or product default credentials across network devices, servers,
  applications, and management interfaces, and verify whether the hardening control of changing default
  passwords has actually been enforced. This playbook helps an analyst detect authentication attempts
  and successful logons that use known default/vendor account names and passwords, distinguish default-credential
  guessing from misconfiguration, and surface assets that likely still retain unchanged defaults. It combines
  deterministic matching against a curated vendor default-credential corpus, statistical baselining of
  authentication volume, frequency, and success/failure state, and explainable machine learning over authentication
  graphs and log sequences. The goal is to expose hardening failures (default credentials in use on critical
  assets such as PLCs, RTUs, IEDs, engineering workstations, network devices, and management interfaces)
  before a sophisticated external actor, commodity malware (e.g., Mirai-style botnets), or an insider
  can leverage them for unauthorized access to sensitive data.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
