- question: Which assets are most likely to still retain default credentials according to a predictive
    classification model?
  context: 'Train a classification model on device metadata, protocol exposure, historical login outcomes
    (success/fail counts), and vendor patterns to estimate the probability that an asset still uses default
    credentials. Output the top-3 contributing features per asset and prioritize high-scoring assets for
    targeted password-change verification. This proactively directs hardening effort to the riskiest assets
    before they are exploited. A high score is a candidate for verification; a low score deprioritizes
    the asset. This maps to the Harden tactic (D3-H): the analyst is validating that the Change Default
    Password control has been enforced, so any hit is a hardening failure to remediate.'
  answer_sources:
