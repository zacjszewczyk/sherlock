questions:
- question: Are any authentication attempts using usernames or credential pairs that match a curated vendor
    default-credential dictionary?
  context: 'Compare usernames and authentication context from Windows Event IDs 4624/4625/4648 and Zeek
    ssh.log/http.log against a curated vendor default-credential corpus (e.g., the ~62 vendor default
    pairs such as root/xc3511 and admin/admin brute-forced by the Mirai botnet). Alert on any direct match
    attempt and immediately escalate (P1) successful authentications. A positive result means a default
    credential is actively in use or being probed; a negative result raises confidence that known defaults
    are absent. Maintain and version the corpus using a safe known-bad credential matching pattern so
    the dictionary stays current and false negatives stay low. This maps to the Harden tactic (D3-H):
    the analyst is validating that the Change Default Password control has been enforced, so any hit is
    a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'events = auth(EventID in [4624,4625,4648]) OR zeek(ssh.log, http.log)

      let default_corpus = lookup(''vendor_default_credentials'')

      match = events where lower(account_name) in default_corpus.username

      alert(severity=''HIGH'') on match

      escalate(severity=''P1'') on (match AND logon_result==''success'')'
  - technology: Zeek/pseudocode
    query: 'ssh.log | where auth_success==true AND user in default_corpus.username

      => emit p1_alert(uid, id.orig_h, id.resp_h, user)'
- question: Has any successful SSH/HTTP/SMB authentication used a known default or vendor account name
    on a critical asset?
  context: 'Treat any successful authentication with a known default/vendor account name (root, admin,
    administrator, manager, and device-specific defaults) on a PLC, RTU, IED, engineering workstation,
    network device, or management interface as a hardening failure. Build an allow-list of expected management
    protocols/ports and account names from the asset inventory/CMDB and alert on deviations. A positive
    result is direct evidence that the change-default-credential and least-privilege mandates were not
    applied to that asset; a negative result helps confirm critical assets are hardened. Prioritize OT
    and management-plane assets where default credentials are most damaging. This maps to the Harden tactic
    (D3-H): the analyst is validating that the Change Default Password control has been enforced, so any
    hit is a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let critical = cmdb(asset_class in [''PLC'',''RTU'',''IED'',''EWS'',''network_device'',''mgmt_interface''])

      let allow = cmdb.expected_accounts join cmdb.expected_ports

      events = success_auth(4624) OR zeek(ssh.log[success], http.log[200 admin], smb)

      alert on events where dest in critical AND (account in default_account_names OR account NOT in allow.accounts
      OR dport NOT in allow.ports)'
- question: Is there a first-time (previously-unseen) access edge involving an administrative or default
    account between a source and destination host?
  context: 'Over a rolling 30-90 day window of Windows 4624/4648 and Zeek ssh.log, flag the first observed
    (account, source-host, destination-host) triplet for administrative or default accounts. A reused
    default credential creates previously-unseen access edges, so a new edge is a strong lead for credential
    reuse and lateral movement. A positive result (new edge) merits investigation of the source and the
    account''s legitimacy; a negative result indicates the access follows established patterns. Tune the
    lookback window to your asset churn rate to limit benign new edges. This maps to the Harden tactic
    (D3-H): the analyst is validating that the Change Default Password control has been enforced, so any
    hit is a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days (rolling 30-90 day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stream = auth(4624,4648) OR zeek(ssh.log)

      filter account in (admin_accounts UNION default_account_names)

      key = (account, src_host, dst_host)

      seen = state_table(window=30..90d)

      if key not in seen: alert(''new admin/default access edge'', key); seen.add(key)'
- question: Is a single source producing a burst of failed logons followed by a success, consistent with
    default-credential guessing?
  context: 'On Windows Event ID 4625 (and Zeek ssh.log failed auths), alert when a single source produces
    >=30 failed logons against >=30 distinct target accounts within 5 minutes, or any source with >=N
    (default 5) failures followed by a success on the same account/host. Analyze 4625 sub-status failure
    codes (0xC000006A bad password, 0xC0000064 no such user) to distinguish default-credential guessing
    from misconfiguration. A failed-then-success pattern is high-fidelity evidence of guessing that landed;
    broad failure fan-out indicates spraying. Derive site-specific thresholds from your own 4625 baseline.
    This maps to the Harden tactic (D3-H): the analyst is validating that the Change Default Password
    control has been enforced, so any hit is a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days (5-minute correlation windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'fails = events(4625) OR zeek(ssh.log[auth_fail])

      // spray

      alert when count_distinct(target_account) by src >= 30 AND count(fails) by src >=30 within 5m

      // guess-then-success

      seq = fails(>=5 same account/host) THEN success(4624 same account/host)

      alert on seq; annotate(sub_status in [0xC000006A,0xC0000064])'
- question: Which sources show authentication volume or frequency exceeding the per-asset baseline, indicating
    automated default-credential abuse?
  context: 'Per source IP/host, baseline connection count, login attempts per minute, and bytes per session
    from Zeek conn.log/ssh.log; alert on sources whose login-attempt rate and connection volume exceed
    the per-asset 99th-percentile baseline. This scan-then-login signature is characteristic of automated
    default-credential abuse such as Mirai. Track both successful and failed-connection (state) counts
    as distinct signals. A positive result flags a source behaving like an automated brute-forcer; a negative
    result indicates volume within normal bounds. This maps to the Harden tactic (D3-H): the analyst is
    validating that the Change Default Password control has been enforced, so any hit is a hardening failure
    to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = percentile(conn_count, login_rate, bytes_per_session, 99) by asset over 90d

      now = stats(zeek conn.log, ssh.log) by src,asset over 5m..1h

      alert where now.login_rate > base.login_rate OR now.conn_count > base.conn_count

      emit separate counters for state=success vs state=failed'
- question: Are per-account or per-source failed-logon rates and failure-to-success ratios spiking in
    a way that signals credential guessing or distributed probing?
  context: 'Compute per-account and per-source failed-logon (4625 / Zeek auth-failure) rates and failure-to-success
    ratios over rolling windows. A spike in failures immediately preceding a success indicates default-credential
    guessing that succeeded, while sustained low-rate failures across many accounts indicate distributed
    probing. Maintain success/fail state distributions to derive defensible thresholds. A positive result
    identifies the account/source pair to investigate; a negative result confirms failure rates are within
    baseline. This maps to the Harden tactic (D3-H): the analyst is validating that the Change Default
    Password control has been enforced, so any hit is a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'win = rolling(1h)

      f2s = count(fail)/max(count(success),1) by account, by src over win

      baseline = ewma(f2s, span=30d)

      alert where f2s > baseline + k*stddev OR (fail_burst THEN success same account)

      classify: low_rate_many_accounts => distributed_probing'
- question: Is an administrative or default username reaching an unusually large number of unique hosts,
    indicating broad reuse of an unchanged default?
  context: 'Measure the daily number of unique hosts reached by each administrative or default username
    and compare to user-specific and peer-group baselines using authentication-graph edge-rarity statistics.
    Broad fan-out from one default account suggests the same unchanged credential is reused across many
    assets. A positive result (outlier fan-out) points to systemic default-credential reuse worth a coordinated
    password-change campaign; a negative result indicates normal account-to-host spread. Baseline normal
    fan-out from historical authentication data. This maps to the Harden tactic (D3-H): the analyst is
    validating that the Change Default Password control has been enforced, so any hit is a hardening failure
    to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days (daily aggregation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fanout = count_distinct(dst_host) by account, day

      filter account in (admin_accounts UNION default_account_names)

      base = percentile(fanout, 99) by account and by peer_group

      alert where fanout(account, today) > base'
- question: Are default-credential event rates trending upward for any particular asset vendor or device
    family?
  context: 'Aggregate default-credential match attempts and successes by asset vendor and device family
    (joined from asset inventory/CMDB and conn.log context). Detect persistent or rising trends that indicate
    systemic hardening gaps. Report per-vendor counts and trend slope, not just point alerts. A positive
    result (rising trend for a vendor/family) directs remediation toward a whole class of misconfigured
    devices; a flat/declining trend indicates hardening is taking hold. This maps to the Harden tactic
    (D3-H): the analyst is validating that the Change Default Password control has been enforced, so any
    hit is a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days (weekly trend)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'join default_cred_events with cmdb on host => vendor, device_family

      series = count(events) by vendor, device_family, week

      slope = linreg(series).slope

      report top vendors by count AND slope > 0 (rising hardening gap)'
- question: Do any authentication edges score as improbable when modeled with an explainable authentication-graph
    ML model?
  context: 'Build an authentication graph from 4624/4648 and Zeek ssh.log and score improbable new edges
    with unsupervised node2vec embeddings plus link prediction (>85% TPR at ~0.0004% FPR on LANL in published
    work). Surface the top-3 contributing edge features (source host, destination host, account rarity)
    in the alert text. Run this in PARALLEL with the deterministic dictionary and new-edge rules; it complements
    but does not replace them. A high anomaly score with default/admin accounts is a strong lead for default-credential
    abuse and lateral movement. This maps to the Harden tactic (D3-H): the analyst is validating that
    the Change Default Password control has been enforced, so any hit is a hardening failure to remediate.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4648
  - Zeek ssh.log
  - Zeek http.log
  - Zeek conn.log
  - Asset inventory / CMDB (vendor, model, default-account metadata)
  - 'NAI: Authentication servers, network ingress/egress points, and critical server subnets.'
  range: Last 90 days
  queries:
  - technology: GraphML/pseudocode
    query: 'G = build_auth_graph(events 4624,4648, zeek ssh.log)

      emb = node2vec(G); scores = link_prediction(emb, observed_edges)

      alert where score < threshold (improbable edge)

      include top3_features(src_host, dst_host, account_rarity) in alert'
- question: Do any per-account authentication sequences register as low-probability under an interpretable
    log-language model?
  context: 'Train an attention-augmented LSTM log-language model on per-account authentication sequences
    and flag low-probability sequences, exposing the top contributing fields (account, source host, auth
    type) per alert. Include the top-3 attention-weighted fields in each alert for analyst triage. A low-probability
    sequence involving a default/admin account suggests anomalous use of that credential. A positive result
    identifies the account/session to review; a negative result indicates the sequence matches learned-normal
    behavior. This maps to the Harden tactic (D3-H): the analyst is validating that the Change Default
    Password control has been enforced, so any hit is a hardening failure to remediate.'
  answer_sources:
