name: 'D3-URA: URL Reputation Analysis'
id: 62a8853d-ade6-4519-89d4-816ba66f0d54
description: 'Investigate whether a requested URL or domain is potentially malicious by combining three
  complementary detection layers: deterministic blocklist and lexical rules, statistical scoring of first-party
  DNS/HTTP behavior (volume, frequency, dynamism, TTL volatility, and failure rates), and machine-learning
  classification of the raw URL string and page content. This playbook helps a SOC analyst confirm or
  refute URL/domain reputation findings across network egress points and DNS resolvers, separating benign
  rare browsing from beaconing, fast-flux, DGA, typosquatting, and drive-by infrastructure. Use it to
  triage reputation alerts, enrich domains with passive DNS/WHOIS context, and prioritize the lowest-reputation,
  newly-observed destinations contacted by internal hosts.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any requested domain or URL match a high-confidence, curated blocklist of known malicious
    indicators?
  context: 'Tactic: Detect. Continuously match every requested domain and full URL (from Zeek dns.log/http.log
    and proxy logs) against a curated, high-confidence blocklist of known-bad indicators and alert on
    any match. Blocklists are precise for known-bad infrastructure even though they miss agile/ephemeral
    infrastructure, so this is the deterministic floor that runs in parallel with statistical and ML scoring.
    A positive match is a strong, immediately actionable signal warranting host isolation and scoping;
    a negative result does NOT clear the destination, since fresh malicious domains will not yet be listed.
    Sources: [Notos, Antonakakis et al.](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf);
    [Beyond Blacklists, Ma et al.](https://cseweb.ucsd.edu/~savage/papers/KDD09.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each request IN (dns.log, http.log, proxy.log):
        domain = extract_registered_domain(request)
        url = request.url
        IF domain IN blocklist_domains OR url IN blocklist_urls:
          ALERT severity=high "Reputation blocklist hit" host=request.src_ip ioc=domain
- question: Are internal hosts contacting lookalike, typosquatted, or homoglyph/punycode domains that
    impersonate protected brands or partners?
  context: 'Tactic: Detect. For each requested registered domain, compute Levenshtein/Damerau-Levenshtein
    edit distance and apply homoglyph and punycode (xn--) normalization against a curated list of protected
    brand and partner domains. Alert when the edit distance is 1-2 edits from a protected asset but the
    domain is not the legitimate asset. This deterministically catches typosquatting and brand-impersonation
    infrastructure often used for phishing and credential theft. A positive result indicates likely impersonation;
    verify the registered domain is not a legitimate alias before escalating. Sources: [Landscape of
    Typosquatting, Spaulding et al.](https://arxiv.org/abs/1603.02767).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each domain IN requested_domains:
        norm = punycode_decode(homoglyph_normalize(domain))
        FOR each brand IN protected_domains:
          d = damerau_levenshtein(norm, brand)
          IF 1 <= d <= 2 AND norm != brand:
            ALERT "Lookalike/typosquat domain" observed=domain target=brand edits=d
- question: Do any requested URLs exhibit hard structural red-flags such as IP-literal hosts, excessive
    length, many subdomains, '@' in the authority, abused TLDs, or punycode hostnames?
  context: 'Tactic: Detect. Alert on deterministic URL structural anomalies derived from malicious-page
    filter feature sets: an IP literal in the host, URL length greater than 150 characters, more than
    4 subdomain labels, presence of ''@'' in the authority component, rare or abused TLDs, and punycode
    hostnames. Tune thresholds to your environment''s benign 99th percentile but keep the rules. These
    lexical red-flags are cheap to evaluate and catch obfuscated phishing/malware URLs; a positive indicates
    a URL worth deeper inspection rather than definitive malice. Sources: [Prophiler, Canali et al.](https://www.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf);
    [EXPOSURE, Bilge et al.](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each url IN (http.log, proxy.log):
        host = url.authority_host
        IF is_ip_literal(host)
           OR length(url) > 150
           OR subdomain_label_count(host) > 4
           OR '@' IN url.authority
           OR tld(host) IN abused_tlds
           OR startswith(host_label, 'xn--'):
          ALERT "Lexical URL red-flag" url=url host=host
- question: Are multiple internal hosts accessing domains that were registered or first-observed within
    the last 30 days (Newly Registered Domains)?
  context: 'Tactic: Detect. Query WHOIS and passive DNS and alert when a domain registered or first-observed
    within the last 30 days is accessed by multiple internal hosts. Domain age is among the strongest
    reputation features, and access to very young domains by several hosts is a deterministic indicator
    of ephemeral C2 or phishing infrastructure. A positive result should be enriched with the registrant
    and resolution history; legitimate newly-launched services exist, so corroborate with reputation scoring
    and behavior. Sources: [Beyond Blacklists, Ma et al.](https://cseweb.ucsd.edu/~savage/papers/KDD09.pdf);
    [Malicious URL Detection Survey, Sahoo et al.](https://arxiv.org/abs/1701.07179).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each domain IN requested_domains:
        age_days = now - min(whois_creation_date(domain), first_seen_passive_dns(domain))
        IF age_days <= 30:
          host_count = distinct_count(src_ip WHERE domain accessed)
          IF host_count >= 2:
            ALERT "NRD accessed by multiple hosts" domain=domain age_days=age_days hosts=host_count
- question: Which external domains fall in the bottom reputation percentile when scored on age, resolved-IP/ASN/country
    diversity, TTL volatility, access regularity, and lexical numeric ratio?
  context: 'Tactic: Detect. For each external domain, enrich from first-party passive DNS with features
    such as domain age, resolved-IP/ASN/country diversity, TTL volatility, access regularity, and lexical
    numeric ratio; compute a composite reputation score and flag domains in the bottom 10th percentile.
    Surface the top-3 contributing features (e.g., age, IP diversity, TTL) in the alert for triage. This
    statistical scoring catches suspicious infrastructure missed by blocklists; a low score is a prioritization
    signal, not proof, and the contributing features guide the analyst''s investigation. Sources: [EXPOSURE,
    Bilge et al.](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf); [Notos, Antonakakis
    et al.](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each domain IN external_domains:
        f.age = domain_age(domain)
        f.ip_div = distinct_count(resolved_ip)
        f.asn_div = distinct_count(resolved_asn)
        f.country_div = distinct_count(resolved_country)
        f.ttl_var = variance(ttl)
        f.access_reg = regularity(access_times)
        f.num_ratio = digit_chars / total_chars(domain)
        score = weighted_composite(f)
      flag domains WHERE score <= percentile(score, 10)
      emit top3_features(f) per flagged domain
- question: Are there domain clusters sharing resolved-IP sets that exhibit fast-flux behavior (high IP/ASN
    diversity, rapid IP-set growth, short TTLs)?
  context: 'Tactic: Detect. Cluster domains by their shared resolved-IP sets and score fast-flux behavior
    using the number and diversity of resolved IPs and ASNs, growth of the IP set over time, and short
    TTLs; alert on clusters exceeding baseline diversity and growth. Fast-flux is a hallmark of resilient
    botnet/C2 infrastructure and can be caught weeks before blocklists update. A positive cluster should
    be scoped against all internal hosts touching any member domain. Sources: [FluxBuster, Perdisci et
    al.](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      cluster domains BY shared_resolved_ip_set
      FOR each cluster:
        ip_div = distinct_count(resolved_ip)
        asn_div = distinct_count(resolved_asn)
        growth = ip_set_size(t_end) - ip_set_size(t_start)
        min_ttl = min(ttl)
        IF ip_div > baseline_ip AND asn_div > baseline_asn
           AND growth > baseline_growth AND min_ttl < 300:
          ALERT "Fast-flux cluster" domains=cluster ips=ip_div asns=asn_div
- question: Do any external domain suffixes show high Shannon entropy and lexical n-gram anomalies combined
    with a high resolved-to-NXDOMAIN failure ratio (DGA indicators)?
  context: 'Tactic: Detect. Per external domain suffix, compute Shannon entropy and lexical n-gram statistics
    and monitor the resolved-to-NXDOMAIN ratio; alert on high entropy combined with high NXDOMAIN failure
    rates, indicative of Domain Generation Algorithms. Also profile HTTP 404 and blocked-connection bursts
    as a distinct failure-mode signal. Derive entropy and NXDOMAIN thresholds from your benign baseline.
    DGA-beaconing malware cycles through many algorithmically-generated names, most of which fail to resolve;
    a positive result indicates probable DGA C2 and should be correlated to the originating host process.
    Sources: [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500); [Beyond
    Blacklists, Ma et al.](https://cseweb.ucsd.edu/~savage/papers/KDD09.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each host:
        nx_ratio = count(rcode=NXDOMAIN) / count(all_dns)
        FOR each queried domain:
          H = shannon_entropy(domain_label)
          ng = ngram_anomaly_score(domain_label)
        IF mean(H) > entropy_baseline AND nx_ratio > nx_baseline:
          ALERT "DGA failure-rate anomaly" host=host nx_ratio=nx_ratio
        // also flag bursts of HTTP 404 / blocked connections
- question: For low-reputation or first-seen domains, does the volume and frequency of contact resemble
    automated beaconing rather than benign rare browsing?
  context: 'Tactic: Detect. For each low-reputation or first-seen domain, track Volume (bytes sent/received)
    and Frequency (requests per minute per host) and compare to host and role baselines. Regular high-frequency,
    low-volume contact to a rare destination separates beaconing from benign rare browsing. Combine with
    the reputation score to prioritize. A positive result -- periodic, low-jitter, small-payload contact
    -- strongly suggests C2 beaconing and warrants endpoint process correlation; bursty, high-volume human
    browsing is typically benign. Sources: [Malicious URL Detection Survey, Sahoo et al.](https://arxiv.org/abs/1701.07179).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each (host, domain) WHERE reputation_low OR first_seen:
        freq = requests_per_min(host, domain)
        vol = bytes_sent + bytes_recv
        jitter = stddev(inter_request_interval)
        IF freq > role_baseline.freq AND vol < role_baseline.vol
           AND jitter < beacon_jitter_threshold:
          ALERT "Beacon-like contact to rare destination" host=host domain=domain
- question: When scored in real time by ML on the raw URL string and lexical/host-based features, which
    URLs return a high malicious probability?
  context: 'Tactic: Detect. Score every new URL in real time with a character- and word-level CNN trained
    on raw URL strings (no external lookup required), alerting on high malicious probability; this runs
    directly on first-party proxy and Zeek http.log. Maintain a parallel logistic-regression/random-forest
    model over lexical and host-based features (URL length, entropy, domain age, ASN) for 95-99% accuracy
    on fresh URLs, and surface the top-3 contributing features in each alert. ML closes the gap on never-before-seen
    URLs that blocklists miss; treat a high score as a prioritized lead and review the contributing features
    to confirm. Sources: [URLNet, Le et al.](https://arxiv.org/abs/1802.03162); [Beyond Blacklists, Ma
    et al.](https://cseweb.ucsd.edu/~savage/papers/KDD09.pdf); [Malicious URL Detection Survey, Sahoo
    et al.](https://arxiv.org/abs/1701.07179).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: ML/Scoring pseudocode
    query: |-
      FOR each url IN (proxy.log, http.log):
        p_cnn = URLNet_charword_cnn.predict(url)        // raw string model
        feats = [length, entropy, domain_age, asn, num_ratio]
        p_lr = logreg_rf.predict(feats)                 // lexical+host model
        IF p_cnn >= 0.9 OR p_lr >= 0.9:
          ALERT "ML malicious URL" url=url p=max(p_cnn,p_lr) top3=top3_features(feats)
- question: For URLs passing deterministic rules, do ML pre-filters over HTML, JavaScript, and URL/host
    features flag likely-malicious or drive-by pages?
  context: 'Tactic: Detect. For URLs that pass deterministic rules, apply an ML pre-filter over HTML,
    JavaScript, and URL/host features to triage likely-malicious pages, and use inline q-gram SVM scoring
    at the proxy boundary to block drive-by content. Both reduce analyst load while preserving the deterministic
    floor. This stage catches malicious page content (exploit kits, obfuscated JS, drive-by downloads)
    that URL-only signals miss; a positive indicates the fetched page itself is suspicious and should
    be detonated/analyzed and the requesting host scoped. Sources: [Prophiler, Canali et al.](https://www.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf);
    [Cujo, Rieck et al.](https://mlsec.org/docs/2010-acsac.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: ML/Scoring pseudocode
    query: |-
      FOR each url WHERE passed_deterministic_rules:
        page = fetch_or_capture(url)
        feats = extract(html_features, js_features, url_host_features)
        p_page = prophiler_prefilter.predict(feats)
        p_qgram = qgram_svm.score(page.content)          // inline at proxy
        IF p_page >= threshold OR p_qgram >= block_threshold:
          ALERT/BLOCK "ML drive-by/malicious page" url=url p=max(p_page,p_qgram)
