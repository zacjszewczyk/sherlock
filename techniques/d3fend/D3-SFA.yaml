name: 'D3-SFA: System File Analysis'
id: ec5fce77-dff6-456d-bba1-1866de302f1b
description: Investigate unauthorized creation, modification, deletion, or tampering of critical system
  files and the auditing subsystem itself. This playbook helps an analyst detect changes to authentication
  databases (SAM/ntds.dit, /etc/shadow), configuration files (sshd_config, sudoers, hosts), system executables,
  and web/app content, as well as attempts to cover tracks by clearing or truncating logs. It combines
  cryptographic file-integrity baselining and symbolic-logic alerting on deviations and failure-mode events
  with statistical baselining (entropy, frequency, change-point, leverage scoring) and machine-learning
  approaches (forecasting, provenance-graph and log-sequence anomaly detection) to surface tampering on
  Domain Controllers, critical application/web servers, and administrator workstations across Windows,
  Linux, and macOS.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has any critical system file on a watchlist (hosts, SAM/ntds.dit, /etc/shadow, sshd_config,
    sudoers, system binaries, or web/app content) deviated from its established cryptographic baseline,
    and which user and process performed the write?
  context: 'Supports the Detect tactic by enforcing integrity of system-owned resources whose modification
    can change behavior below the user level. Establish a cryptographic baseline (SHA-256 plus size, owner,
    permissions, inode, mtime) for an explicit watchlist of critical files and alert on ANY deviation,
    attributing the writing user/process via FIM who-data and suppressing only an allow-list of legitimate
    writers (patch/installer accounts). For web/app content, diff live files against a known-good baseline
    to surface added or modified executables (e.g., web shells). A positive result is any unexplained
    hash/metadata change by a non-allow-listed actor; a negative result is changes fully attributable
    to sanctioned maintenance. Sources: [File Integrity Monitoring (FIM), Wazuh](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html);
    [Mitigating Web Shells, NSA/ASD](https://github.com/nsacyber/Mitigating-Web-Shells).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "LET watch = critical_file_watchlist\nFOR each file IN watch:\n  current = hash(file, fields=[sha256,size,owner,perms,inode,mtime])\n\
      \  IF current != baseline[file]\n     AND writer_account NOT IN allow_list(patch,installer):\n \
      \      ALERT 'system file baseline deviation', file, writer_user, writer_process\n# correlate Windows\
      \ Event ID 4663 / Sysmon Event ID 11 for who-data\n# web content: diff live tree vs known-good baseline\
      \ -> added/modified executables"
- question: Are there bursts of file-integrity-check failures, denied or failed object-access attempts
    against watched system files, or a sudden stop in expected FIM heartbeat/scan events?
  context: 'Supports Detect by treating failure-mode events as distinct tamper signals rather than benign
    change. Alert on bursts of FIM integrity-check failures, denied/failed object-access (Windows Event
    ID 4663 with a failure result) against watched files, and a sudden absence of expected FIM heartbeat/scan
    events, which indicate tampering or agent disablement. A positive result is a cluster of failures
    or a silenced agent on a sensitive host; a negative result is steady successful scans with no access
    denials. Source: [File Integrity Monitoring (FIM), Wazuh](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# failure-mode signals against watched system files

      EVENT 4663 WHERE result == ''failure'' AND object IN watchlist

      OR fim_integrity_check == ''failed''

      GROUP BY host, 5m

      HAVING count > burst_threshold

      ALERT ''protected-file access failures / FIM tamper''

      # also: ALERT IF expected fim_heartbeat absent for host > interval'
- question: Do filenames newly created in critical system directories show abnormally high Shannon entropy,
    suggesting randomly named malicious files?
  context: Supports Detect by catching dropped malware that uses randomized filenames. Baseline file-creation
    events for critical directories and compute the Shannon entropy of filenames; alert when entropy exceeds
    the 99th percentile of the baseline. A positive result is high-entropy filenames appearing where naming
    is normally stable; a negative result is filenames consistent with the established distribution.
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each new_file IN critical_dirs:\n  e = shannon_entropy(filename)\n  IF e > percentile(baseline_entropy,\
      \ 99):\n     ALERT 'high-entropy filename', file, host, creating_process"
- question: Is the daily or hourly frequency of file-modification events in sensitive directories spiking
    far above the normal baseline for that host's role?
  context: 'Supports Detect by surfacing mass file changes characteristic of wipers, ransomware, log clearing,
    or bulk account changes. Baseline the per-host-role frequency of modification events in sensitive
    directories and alert on spikes greater than 3 standard deviations (z-score) above the mean. A positive
    result is a sharp rate increase inconsistent with maintenance windows; a negative result is rates
    within normal variance. Source: [Finding Anomalies in Windows Event Logs Using Standard Deviation,
    Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'rate = count(file_mod_events) PER host_role PER hour IN sensitive_dirs

      z = (rate - mean_baseline) / stddev_baseline

      IF z > 3: ALERT ''file-modification frequency spike'', host, rate, z'
- question: Has the per-host file-modification volume time series undergone a change-point - a sustained
    sharp rise (ransomware/wiper onset) or a drop to zero (logging/FIM tamper)?
  context: 'Supports Detect by detecting regime shifts rather than single-point spikes. Apply change-point
    detection (CUSUM, PELT, or Bayesian online CPD) to per-host modification-volume series; report the
    change time and magnitude as explainable evidence, deriving sensitivity per host from each host''s
    own baseline variance. A positive result is a detected change point with a sustained rise or drop-to-zero;
    a negative result is a stationary series. Source: [A Survey of Methods for Time Series Change Point
    Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = file_mod_volume PER host PER interval\ncp = change_point_detect(series, method=PELT|CUSUM|BOCPD,\n\
      \                         penalty=f(host_baseline_variance))\nIF cp.detected:\n   ALERT 'modification-volume\
      \ regime shift', host, cp.time, cp.magnitude, cp.direction"
- question: Do short ordered event traces (file write -> config/registry change -> permission change ->
    log clear) rank as disproportionately influential outliers versus normal administrative activity?
  context: 'Supports Detect by identifying rare attack-like sequences that deviate from routine admin
    behavior. Assemble short ordered traces and rank them with statistical leverage to surface disproportionately
    influential outlier sequences against a baseline of normal activity - an unsupervised, interpretable
    scoring suitable for per-environment tuning. A positive result is a high-leverage rare trace combining
    tamper actions; a negative result is traces matching common admin patterns. Source: [Business Process
    Event Log Anomaly Detection based on Statistical Leverage](https://ceur-ws.org/Vol-2952/paper_291a.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "traces = build_ordered_traces(events=[file_write, config_change,\n          perm_change, log_clear],\
      \ window=session)\nFOR t IN traces:\n  lev = statistical_leverage(t, baseline=normal_admin_traces)\n\
      \  IF lev > leverage_threshold:\n     ALERT 'rare high-leverage tamper trace', t, lev"
- question: Do observed counts of file-modification events on critical servers significantly exceed a
    time-series forecast that accounts for patching cycles?
  context: Supports Detect by modeling expected change cadence and flagging deviations. Develop a time-series
    model (e.g., SARIMA) for the frequency of file-modification events on critical servers, incorporating
    seasonality from patching cycles, and alert when observed counts deviate significantly from the forecast.
    A positive result is observed volume outside the forecast confidence interval not explained by a scheduled
    patch; a negative result is counts within the predicted band.
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = SARIMA(fit=file_mod_counts_history, seasonality=patch_cycle)\nforecast, ci = model.predict(next_interval)\n\
      IF observed_count NOT IN ci:\n   ALERT 'file-change count deviates from forecast', host, observed_count,\
      \ forecast"
- question: Can a host provenance graph localize the specific tampered system file or executable and reconstruct
    the responsible process chain via anomalous node/edge or rare causal path scoring?
  context: 'Supports Detect by providing explainable, node-level localization of tampering. Build host
    provenance graphs from first-party audit telemetry (Sysmon/auditd) and score nodes/edges for anomalous
    behavior (ThreaTrace, KAIROS) to localize the tampered file/executable and reconstruct an explainable
    subgraph of the responsible process chain; path-rarity scoring (doc2vec + Local Outlier Factor, ProvDetector)
    catches living-off-the-land binaries modifying config/auth files. A positive result is an anomalous
    subgraph touching a watched system file; a negative result is provenance consistent with known-good
    behavior. Sources: [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333); [KAIROS, Cheng et
    al.](https://tfjmp.org/publications/2024-sp.pdf); [ProvDetector, Wang et al.](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Sysmon Event ID 11
  - Linux auditd (SYSCALL/PATH)
  - Wazuh syscheck (FIM)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_provenance_graph(sysmon|auditd)\nscores = anomaly_score(nodes(G), edges(G))    \
      \       # ThreaTrace/KAIROS\nrare = path_rarity(G, embed=doc2vec, detector=LOF)    # ProvDetector\n\
      IF any(scores > thr) OR rare.found:\n   ALERT subgraph(top_contributing_nodes), tampered_file, process_chain"
- question: Has a Windows Security or System event log been cleared (Event ID 1102 / 104) or have command
    lines invoked wevtutil cl or Clear-EventLog?
  context: 'Supports Detect by flagging a high-fidelity indicator of an attacker covering their tracks.
    Monitor for Windows Security Event ID 1102 and System Event ID 104 (audit/event log cleared) and command-line
    patterns (wevtutil cl, PowerShell Clear-EventLog), and forward all events centrally (WEF) so cleared
    local logs survive on a collector. A positive result is a log-clear event or matching command line
    outside sanctioned maintenance; a negative result is no clearing activity. Source: [CAR-2016-04-002:
    User Activity from Clearing Event Logs, MITRE](https://car.mitre.org/analytics/CAR-2016-04-002/).'
  answer_sources:
  - Windows Event ID 1102
  - Windows System Event ID 104
  - Windows Sysmon Event ID 1
  - Linux auditd (execve)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EVENT (Security 1102 OR System 104)

      OR process_command_line MATCHES (''wevtutil cl*'' OR ''Clear-EventLog*'')

      ALERT ''event log cleared'', host, user, command_line

      # ensure WEF forwarding so cleared local logs persist on collector'
- question: Have destructive utilities (rm, rmdir, shred, unlink, truncate) been executed against files
    or directories under /var/log/?
  context: 'Supports Detect by catching Linux log destruction. Flag destructive utilities whose command
    line targets /var/log/ files or directories via Sysmon-for-Linux EID 1 or auditd execve telemetry.
    A positive result is a destructive command targeting log paths by a non-sanctioned actor; a negative
    result is normal log rotation by authorized tooling. Source: [Linux Logs Clearing Attempts, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml).'
  answer_sources:
  - Windows Event ID 1102
  - Windows System Event ID 104
  - Windows Sysmon Event ID 1
  - Linux auditd (execve)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EVENT (sysmon_linux EID 1 OR auditd execve)\nWHERE exe IN (rm,rmdir,shred,unlink,truncate)\n\
      \  AND command_line CONTAINS '/var/log/'\nALERT 'linux log deletion/truncation', host, user, command_line"
- question: Has a host that normally forwards events gone silent or shown gaps in its log sequence numbers,
    indicating absence-of-logs tampering?
  context: 'Supports Detect by treating the absence of logs as a distinct tamper signal complementing
    explicit clearing events. Profile the expected steady-state rate of forwarded events per host and
    alert when a normally-reporting host goes silent or its sequence numbers gap. A positive result is
    an unexpected reporting gap on a host that is still online; a negative result is continuous expected
    forwarding. Source: [CAR-2016-04-002: User Activity from Clearing Event Logs, MITRE](https://car.mitre.org/analytics/CAR-2016-04-002/).'
  answer_sources:
  - Windows Event ID 1102
  - Windows System Event ID 104
  - Windows Sysmon Event ID 1
  - Linux auditd (execve)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "baseline_rate = expected_forward_rate PER host\nIF forwarded_event_rate(host) drops_to ~0\
      \ while host_online\n   OR sequence_numbers(host) have_gap:\n      ALERT 'log forwarding gap / silent\
      \ host', host, last_seen"
- question: Does a host's log-key sequence show discontinuities or missing expected keys when scored against
    a learned model of normal ordering?
  context: 'Supports Detect by catching deletion/truncation that produces sequence discontinuities. Train
    a log-sequence model on normal host log-key ordering (DeepLog); deletion or truncation produces missing
    expected keys flagged when the observed key falls outside the top-g predictions, with per-event diagnosis
    of which keys were expected. A self-supervised Transformer variant (LogBERT, Masked Log Key Prediction)
    gives a stronger context-aware baseline. A positive result is an observed key outside the predicted
    set or a missing expected key; a negative result is sequences matching learned ordering. Sources:
    [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [LogBERT, Guo et al.](https://arxiv.org/abs/2103.04475).'
  answer_sources:
  - Windows Event ID 1102
  - Windows System Event ID 104
  - Windows Sysmon Event ID 1
  - Linux auditd (execve)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_log_sequence_model(normal_log_keys)   # DeepLog / LogBERT\nFOR window IN host_log_stream:\n\
      \  pred = model.topg(window.context)\n  IF window.observed_key NOT IN pred OR expected_key missing:\n\
      \     ALERT 'log sequence discontinuity', host, expected_keys, observed_key"
- question: When an abnormal log or system-file event sequence is scored, which specific log fields or
    tokens contributed most to the anomaly?
  context: 'Supports Detect by making anomaly alerts interpretable and actionable. Use attention-augmented
    RNN log-language models so each anomaly score carries per-field/per-token weights, surfacing the top
    contributing log fields behind an alert rather than emitting a bare score. A positive result is an
    anomalous sequence with clear high-weight fields pointing to the suspicious activity; a negative result
    is normal sequences with low scores. Source: [Recurrent Neural Network Attention Mechanisms for Interpretable
    System Log Anomaly Detection, Brown et al.](https://arxiv.org/pdf/1803.04967).'
  answer_sources:
  - Windows Event ID 1102
  - Windows System Event ID 104
  - Windows Sysmon Event ID 1
  - Linux auditd (execve)
  - 'NAI: Domain Controllers, Critical application servers, Web servers, Administrator workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = attention_rnn_log_lm(train=normal_sequences)\nscore, weights = model.score(sequence)\n\
      IF score > thr:\n   ALERT 'log anomaly', sequence, top_contributing_fields=topk(weights)"
