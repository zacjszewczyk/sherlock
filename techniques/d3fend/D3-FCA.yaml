name: 'D3-FCA: File Creation Analysis'
id: 64061a92-7948-48fb-b19a-d4b958e7bec8
description: Investigate anomalous file-creation activity on endpoints, servers, and across the network
  to uncover malware staging, credential-access dumping, persistence installation, collection staging,
  and ransomware encryption. This playbook analyzes file-create system call telemetry (Windows Sysmon
  Event ID 11 and Security 4663/4656 object-access events including access-denied, Linux auditd/eBPF via
  Falco or Sysmon-for-Linux, and Zeek files.log) to surface process-to-path, extension, content-entropy,
  and rate behavior that deviates from established norms. It layers deterministic process/path/content
  rules (threat-intel and suspicious-path matching, process-to-path allowlists, persistence-path writes,
  high-entropy and type-mismatched output, dump/staging correlation, canary tripwires), statistical Volume/Frequency/State
  baselines (path-extension rarity, creation-burst anomalies, content-similarity drops, failed/blocked-create
  profiling, unsupervised feature scoring), and ML provenance/sequence models (rhythm forecasting, explainable
  per-process malice scoring, supervised classification, and provenance-graph node anomaly detection).
  Failed and blocked creates are profiled as a distinct signal.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which file-creation events match known-bad file hashes or filenames from threat intelligence,
    or write into suspicious/public/temp locations (e.g., %PUBLIC%, %TEMP%, C:\Users\Public, /tmp, /dev/shm,
    web roots) or protected system directories under an unexpected parent process?
  context: Supports the Detect tactic by catching the moment malicious payloads land on disk. The analyst
    joins every file-create event against threat-intel indicators (file hash, filename) and against a
    curated list of suspicious write locations, then evaluates whether the writing parent process is expected
    for that path. A positive result — a flagged hash, or an unexpected parent dropping into a public/temp
    path or system directory — is a high-fidelity lead worthy of immediate triage; the alert should carry
    the writing process, full path, and hash. A negative result still narrows the search space. This mirrors
    the Sysmon Community Guide File Create (EID 11) guidance and Falco 'Write below binary dir/etc/root'
    default rules.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FileCreate = source IN ("Sysmon EID 11","Security 4663/4656 write","auditd/Falco FileCreate")
      SUSPICIOUS_PATHS = ["%PUBLIC%","%TEMP%","C:\\Users\\Public","/tmp","/dev/shm","<web_roots>","<system_dirs>"]
      FOR each create:
        IF create.hash IN ThreatIntel.hashes OR create.filename IN ThreatIntel.filenames
           OR (create.target_path MATCHES SUSPICIOUS_PATHS AND create.parent NOT IN expected_parents[path]):
              ALERT(process=create.image, parent=create.parent, path=create.target_path, hash=create.hash)
- question: Which file creations violate the expected parent-process-to-destination-path-and-extension
    allowlists (for example, a server worker such as w3wp.exe writing .aspx or .php into a web root)?
  context: Supports Detect by encoding known-good writer behavior and alerting only on deviations. The
    analyst maintains allowlists pairing expected parent processes with the destination paths and extensions
    they legitimately produce, then triggers when an observed creation breaks the pairing — a classic
    webshell-drop indicator. The method follows the SigmaHQ file_event process-to-extension pattern and
    Sysmon Community Guide allowlisting guidance. A violation (e.g., a web server process writing executable
    script into the web root) strongly suggests webshell deployment or code injection. Tune exclusions
    to known-good writers; narrow the rule rather than deleting it to avoid blind spots.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ALLOWLIST = {(parent_image, dest_path_glob): [allowed_ext,...]}
      FOR each create:
        key = (create.parent_image, glob_match(create.target_path))
        IF key NOT IN ALLOWLIST OR ext(create.target_path) NOT IN ALLOWLIST[key]:
           IF NOT in_known_good_exclusions(create):
              ALERT("process-to-path violation", parent=create.parent_image,
                    path=create.target_path, ext=ext(create.target_path))
      // e.g. w3wp.exe -> webroot writing .aspx/.php
- question: Which files were created in persistence locations (scheduled-task XML in C:\Windows\Tasks
    and C:\Windows\System32\Tasks, Startup folders, service binaries, Linux init/cron/systemd/shell-config
    paths) by a process that is not their legitimate owner?
  context: Supports Detect by spotting persistence installation as it happens. The analyst watches the
    canonical persistence directories and alerts when a write originates from something other than the
    legitimate owning process (e.g., schtasks/svchost for tasks, package managers for service binaries).
    Per CAR-2020-09-001, task files appear in C:\Windows\Tasks and C:\Windows\System32\Tasks; Falco's
    'Modify shell configuration file' covers Linux shell-config tampering. A positive result indicates
    an adversary establishing persistence, privilege escalation, or remote execution footholds.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      PERSIST_PATHS = ["C:\\Windows\\Tasks","C:\\Windows\\System32\\Tasks","<Startup>",
                       "<service_bin_dirs>","/etc/init.d","/etc/cron*","/etc/systemd","<shell_config>"]
      LEGIT_OWNER = {path: [allowed_writer_process,...]}
      FOR each create WHERE create.target_path MATCHES PERSIST_PATHS:
        IF create.parent_image NOT IN LEGIT_OWNER[create.target_path]:
           ALERT("persistence write by non-owner", path=create.target_path, process=create.image)
- question: Which newly created files have content Shannon entropy above ~7.2 bits/byte (encrypted/compressed/packed),
    or a magic-byte signature that does not match their file extension after a write?
  context: Supports Detect by surfacing encrypted/packed payloads and ransomware output. The analyst computes
    Shannon entropy of new file content; values above ~7.2 bits/byte (per Lyda & Hamrock) indicate encryption,
    compression, or packing. Separately, when a file's magic-byte signature stops matching its extension
    after a write, that file-type change is a CryptoDrop ransomware indicator. Derive the entropy cutoff
    per file class from a benign corpus so that legitimately compressed file types do not generate noise.
    A positive result points to packed malware, exfil archives, or ransomware encryption.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each created/modified file f with content sample:
        H = shannon_entropy(f.bytes)
        cutoff = entropy_cutoff[file_class(f)]   // calibrate from benign corpus, ~7.2 default
        IF H > cutoff: ALERT("high-entropy write", path=f.path, entropy=H)
        IF magic_bytes(f) != expected_for_ext(ext(f.path)):
           ALERT("file-type mismatch", path=f.path, magic=magic_bytes(f), ext=ext(f.path))
- question: Which large memory-dump (.dmp) or staged archive (.7z/.rar) files were created, and what was
    the producing process command line and parent process context?
  context: Supports Detect by tying credential-access and collection staging writes to their producing
    process. The analyst correlates creation of large dump or archive output with the full command line
    and parent of the writing process — for example, a .dmp produced by a procdump-like tool targeting
    lsass.exe (CAR-2019-07-002), or staged .7z/.rar archives ahead of exfiltration. A positive result
    links on-disk artifacts to a credential-dumping or collection action, providing strong context for
    incident scoping.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      STAGING_EXT = [".dmp",".7z",".rar",".zip"]
      FOR each create WHERE ext(create.target_path) IN STAGING_EXT AND create.size > LARGE_THRESHOLD:
        ctx = process_lookup(create.pid)   // cmdline, parent, image
        IF ctx.image ~ /procdump|comsvcs|rundll32/ OR ctx.cmdline ~ /lsass|-ma /:
           ALERT("credential/collection staging", file=create.target_path,
                 cmdline=ctx.cmdline, parent=ctx.parent)
- question: Have any decoy/canary files planted in monitored user directories been modified, encrypted,
    or deleted?
  context: Supports Detect with a deterministic, near-zero-false-positive ransomware tripwire. The analyst
    plants decoy/canary files throughout monitored user directories and alerts immediately on any modify/encrypt/delete
    touching them. Because no legitimate user or process should ever alter a canary, any interaction is
    a high-confidence ransomware or mass-file-tampering signal — it exploits the read-original then write-high-entropy
    then delete/replace sequence that defines ransomware in UNVEIL. A positive result warrants immediate
    containment.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      CANARIES = registered_decoy_paths()   // planted across user dirs
      FOR each event IN (modify, write, rename, delete):
        IF event.target_path IN CANARIES:
           ALERT(severity=CRITICAL, "canary touched", path=event.target_path,
                 process=event.image, parent=event.parent, action=event.op)
- question: For each parent process, which created path-extension pairs fall into low-prevalence tails
    (e.g., below the 1st percentile of enterprise-wide frequency) and are therefore anomalous?
  context: Supports Detect via statistical behavioral baselining. The analyst computes, per parent process,
    the enterprise-wide frequency of each created path-extension pair, then flags creations that fall
    into the rare tail (e.g., below the 1st percentile), consistent with the per-process baselining in
    ShieldFS. The alert should name the rare path, extension, and parent. Rarity does not equal malice,
    but a process suddenly producing an extension it has essentially never created before is a strong
    anomaly worth review — especially for system or service processes with normally narrow behavior.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      // Baseline window: enterprise-wide
      freq[(parent, dir, ext)] = count over baseline / total creates by parent
      p1[parent] = 1st_percentile(freq[parent, *, *])
      FOR each create:
        f = freq[(create.parent, dirof(create.path), ext(create.path))]
        IF f < p1[create.parent] OR f == 0:
           ALERT("rare path-ext for parent", parent=create.parent,
                 dir=dirof(create.path), ext=ext(create.path), freq=f)
- question: Which hosts or processes show statistically significant positive deviations in per-minute
    file-creation rate (including concentrated bursts of executable, DLL, or rename operations outside
    maintenance windows)?
  context: Supports Detect by quantifying volume/frequency anomalies. The analyst models per-host and
    per-process per-minute file-creation rates and applies a modified z-score / MAD test to detect significant
    positive spikes, mirroring the sliding-window syscall-frequency approach of Bag of System Calls and
    the creation/rename-rate features of ShieldFS. Concentrated bursts of executable/DLL writes or mass
    renames outside maintenance windows are hallmarks of malware deployment or ransomware encryption.
    A high modified z-score concentrated in a short window is a strong lead.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days; evaluate in sliding 1-minute windows and correlate around the burst
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      bucket = creates per (host, process) per 1-min window
      med = median(bucket_baseline); mad = MAD(bucket_baseline)
      FOR each current window w:
        mz = 0.6745 * (w.count - med) / mad
        IF mz > 3.5 AND outside_maintenance_window(w):
           ALERT("file-create burst", host=w.host, process=w.process,
                 count=w.count, modified_zscore=mz,
                 detail=breakdown_by_optype(w))   // exe/dll/rename
- question: Which modified files show large pre/post content-similarity drops (sdhash/ssdeep) or magic-byte-vs-extension
    inconsistency, and across how many files does this type-funnel occur?
  context: Supports Detect by combining CryptoDrop's union indicators. The analyst compares each modified
    file's pre/post content similarity (sdhash/ssdeep) and magic-byte-vs-extension consistency, alerting
    on large similarity drops or a 'type funnel' (many files converging to one output type) across many
    files. The alert should report the count of files converted and the median similarity drop. A sharp
    similarity drop across many files at once strongly indicates ransomware encryption or mass tampering.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each modified file f with pre/post snapshots:
        sim = ssdeep_compare(f.pre, f.post)   // or sdhash
        type_change = magic(f.pre) != magic(f.post)
      FOR each process p in window:
        funnel = files where (sim < SIM_DROP_THRESHOLD) OR type_change
        IF count(funnel) > N:
           ALERT("type-funnel/similarity-drop", process=p,
                 files_converted=count(funnel), median_sim_drop=median(funnel.sim_drop))
- question: Which hosts or processes show spikes in access-denied/blocked file-creation attempts (Windows
    Security 4656/4663 access-denied writes, Falco/auditd EPERM file-write denials) indicating ACL probing,
    EDR-protected-path tampering, or partially blocked ransomware?
  context: 'Supports Detect by treating failure as a distinct signal. The analyst baselines per-host and
    per-process rates of access-denied write attempts (Windows Security 4656/4663 with access-denied,
    Falco/auditd EPERM denials) and alerts on spikes. Failed creates are often invisible to success-only
    monitoring yet reveal adversary behavior: probing ACLs, attempting to tamper with EDR-protected paths,
    or a ransomware run partially blocked by permissions. A spike in blocked writes is itself an attack
    indicator.'
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      DENIED = events WHERE (Security 4656/4663 AND access_denied)
                          OR (auditd/Falco AND result==EPERM AND op==write)
      base[(host,proc)] = median+MAD of DENIED per window over baseline
      FOR each current window:
        IF denied_count > base.median + k*base.mad:
           ALERT("blocked-create spike (ACL probe / protected-path tamper / blocked ransomware)",
                 host=host, process=proc, denied=denied_count)
- question: Which per-process file-creation feature vectors (creation rate, path/extension rarity, write-content
    entropy, overwrite fraction, distinct-directory coverage, file-type diversity, deletion count) receive
    high anomaly scores from an Extended Isolation Forest, and what are the top-3 contributing features?
  context: Supports Detect with unsupervised multivariate anomaly detection. The analyst builds per-process
    feature vectors capturing creation rate, path/extension rarity, write-content entropy, overwrite fraction,
    distinct-directory coverage, file-type diversity, and deletion count, then scores them with an Extended
    Isolation Forest. The alert must surface the top-3 features driving each anomaly score so the analyst
    understands why a process is flagged. This catches multivariate anomalies no single rule would; high-scoring
    processes combining high entropy, broad directory coverage, and many deletions resemble ransomware.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      FOR each process p, build vector:
        v = [creation_rate, path_ext_rarity, write_entropy, overwrite_fraction,
             distinct_dir_coverage, file_type_diversity, deletion_count]
      model = ExtendedIsolationForest(trained on benign vectors)
      score = model.anomaly_score(v)
      IF score > THRESHOLD:
        top3 = top_contributing_features(model, v)
        ALERT(process=p, anomaly_score=score, top_features=top3)
- question: Which ordered file-creation event streams fall outside the top-k prediction interval of a
    sequence model (DeepLog-style) that forecasts the expected next events/rate?
  context: Supports Detect by learning temporal rhythm. The analyst models ordered file-creation event
    streams with a sequence model (e.g., DeepLog LSTM) that predicts the expected next events and rate,
    then alerts when observed events fall outside the top-k prediction interval. The system should support
    online retraining from analyst feedback and report which deviating events drove the alert. A deviation
    from the learned rhythm indicates anomalous activity — novel sequences of file operations that legitimate
    workflows never produce.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      seq = ordered file-create events per (host/process)
      model = DeepLog_LSTM(trained on benign sequences)
      FOR each event e in seq:
        pred = model.predict_next(context_before(e))
        IF e NOT IN topk(pred):
           ALERT("rhythm deviation", host=e.host, process=e.process,
                 deviating_event=e)
      // support online retrain from analyst feedback
- question: Which processes receive a high malice score from a per-process classifier over file-write
    features (write-content entropy ratio, overwrite fraction, directory-traversal coverage, file-type
    diversity, write frequency), and what are the top-3 contributing features?
  context: Supports Detect with an explainable per-process malice model. The analyst trains a classifier
    or weighted score over file-write features following Redemption and the multi-scale random forests
    of ShieldFS. The alert must list the top-3 contributing features, not just the score, so triage is
    grounded in observable behavior. A high score driven by high entropy ratio, large overwrite fraction,
    and broad directory traversal is the behavioral fingerprint of ransomware or destructive malware.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      FOR each process p, features:
        f = [write_entropy_ratio, overwrite_fraction, directory_traversal_coverage,
             file_type_diversity, write_frequency]
      score = malice_model.predict(f)   // Redemption-style weighted / RF
      IF score > THRESHOLD:
        top3 = feature_importance(malice_model, f)
        ALERT(process=p, malice_score=score, top_features=top3)
- question: Which file-creation events does a supervised classifier (gradient boosting / random forest)
    using parent process, signer status, destination path, extension, content entropy, and Zeek network-delivery
    context predict to be likely-malicious drops?
  context: Supports Detect by prioritizing likely-malicious drops with supervised learning. The analyst
    trains gradient boosting / random forest classifiers on labeled features including parent process,
    signer status, destination path, extension, content entropy, and network-delivery context from Zeek
    files.log (was the file delivered over the network?). SHAP/feature-importance must surface the top-3
    drivers per alert. This ranks the highest-risk creations for analyst attention, fusing endpoint and
    network context to catch downloaded-then-dropped payloads.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      FOR each file-create event:
        feat = [parent_process, signer_status, dest_path, ext, content_entropy,
                zeek_network_delivery_context(event.hash)]
      prob = gbm_or_rf.predict_proba(feat)
      IF prob > THRESHOLD:
        drivers = shap_top3(gbm_or_rf, feat)
        ALERT("likely-malicious drop", path=event.path, prob=prob, top_drivers=drivers)
- question: Which individual file-create nodes/edges in the whole-system provenance graph are flagged
    as anomalous by node-level graph learning (GraphSAGE / ThreaTrace) or a temporal graph autoencoder
    (KAIROS)?
  context: Supports Detect with provenance-graph anomaly detection. The analyst builds whole-system provenance
    graphs (process/file/socket nodes connected by file-create edges) and flags anomalous file nodes/edges
    using node-level GraphSAGE learning (ThreaTrace) or a temporal graph autoencoder that also reconstructs
    the surrounding attack graph for context (KAIROS). This catches stealthy creations that are anomalous
    only in their graph context — a file created by an unusual process lineage — and provides the surrounding
    attack subgraph, which is invaluable for understanding the full intrusion.
  answer_sources:
  - Windows Event ID 11 (Sysmon FileCreate)
  - Windows Security Event ID 4663/4656 (object access, incl. access-denied)
  - Linux auditd / Falco / Sysmon-for-Linux FileCreate
  - Zeek files.log
  - 'NAI: Critical servers (Domain Controllers, database/web servers), User endpoints, File shares, Network
    egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      G = provenance_graph(nodes={process,file,socket}, edges={file_create,...})
      // node-level model
      scores = ThreaTrace_GraphSAGE.score_nodes(G)   // or KAIROS temporal GAE
      FOR node n WHERE n.type==file AND scores[n] > THRESHOLD:
        subgraph = reconstruct_attack_context(G, n)   // KAIROS
        ALERT("anomalous file-create node", file=n.path,
              creating_process=parent_in_graph(n), context=subgraph)
