name: 'D3-DQSA: Database Query String Analysis'
id: 4b24d2b2-469d-4a66-82f8-ebd68cbdba06
description: Investigate suspected SQL injection (SQLi) against application and database tiers by analyzing
  database query strings captured from network traffic, host process telemetry, database error/audit logs,
  and WAF logs. This playbook helps an analyst determine whether observed queries contain malicious SQL
  patterns (tautologies, UNION SELECT, stacked statements, comment injection, encoding tricks, dangerous
  stored-procedure abuse), whether queries are statistically anomalous in shape, token-transition, volume,
  or frequency relative to per-application and per-user-role baselines, whether a session or source is
  generating abnormal rates of database syntax/permission errors indicative of blind or error-based enumeration,
  and whether host/process context corroborates an injection attempt. It spans deterministic signature
  matching, role-based policy enforcement, statistical baselining, sequence/transition modeling, Bayesian
  signal fusion, and supervised/unsupervised machine learning so the analyst can detect both known and
  novel SQLi with explainable, low-false-positive results.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any captured database query strings match known SQL injection payload signatures, such
    as tautologies (OR 1=1), inline comment injection (/**/), UNION SELECT, stacked semicolon-separated
    statements, hex or CHAR()-based encoding, or abuse of dangerous procedures like xp_cmdshell?
  context: This deterministic signature floor is the first and most defensible detector for SQL injection.
    Inspect Zeek sql.log query strings with grammar-aware token fingerprinting (libinjection) plus curated
    regex from the OWASP Core Rule Set for canonical injection constructs, accumulate a per-query anomaly
    score, and alert above a tuned threshold. A positive result strongly suggests an in-progress or successful
    injection attempt; correlate each hit with Windows Event ID 4688 parent processes and Zeek conn.log
    session metadata for triage to confirm the originating application and source. Continuously close
    rule gaps and tune thresholds since attackers obfuscate payloads to evade static patterns. Supports
    the Detect mission of measuring and exercising our ability to catch SQLi from query strings.
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for q in sql.log:
        score = libinjection_sqli(q.query) ? weight_high : 0
        for rx in OWASP_CRS_SQLI_REGEX:   # OR 1=1, /**/ , UNION SELECT, ; stacked, 0x.. , CHAR(), xp_cmdshell
          if regex_match(rx, q.query): score += rx.weight
        if score >= TUNED_THRESHOLD:
          join Windows EID 4688 on host/pid, conn.log on uid
          alert("SQLi signature", q.id, q.client, score)
- question: Are any low-privilege application identities or roles issuing dangerous SQL verbs (ALTER,
    DROP, GRANT, EXEC), enumerating schema (information_schema, sys.*), exceeding a hard query-length
    ceiling, or containing known-dangerous substrings that fall outside their approved allowlist?
  context: Legitimate application workflows use a narrow, predictable set of SQL verbs. Parse query tokens
    by application identity/role and alert (or sanitize/reject inline) when a low-privilege workflow issues
    prohibited statements absent from approved allowlists, performs schema enumeration, exceeds a hard
    length ceiling, or carries known-dangerous substrings. A positive result indicates either a compromised
    credential or successful injection that escalated the query's capability beyond the application's
    normal behavior. Build the allowlist from observed first-party traffic per role. This role-inconsistency
    detector aligns with the Cylance US20120117644A1 method and supports the Detect mission.
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      tokens = parse_sql(query)
      role = lookup_role(app_identity)
      if any(v in tokens for v in [ALTER,DROP,GRANT,EXEC]) and v not in allowlist[role]
         or matches(query, /information_schema|sys\./i)
         or len(query) > LENGTH_CEILING
         or contains_dangerous_substring(query):
        alert("role-inconsistent SQL", app_identity, role, query)
- question: Is any single database session or source IP generating an abnormal spike of SQL syntax or
    permission errors (for example MySQL 1064/1142, MSSQL 105/156, Oracle ORA- codes), exceeding 5 errors/min
    or 3x its rolling baseline error ratio?
  context: 'Database error responses are a distinct injection-probing signal: healthy applications emit
    near-zero SQL syntax errors because their queries are parameterized and tested. From database error/audit
    logs, count syntax and permission errors per session and source, then alert when a single session
    triggers more than 5 SQL errors per minute or its error ratio exceeds 3x its rolling baseline. A spike
    is a strong indicator of blind or error-based SQLi enumeration where the attacker iterates over payloads.
    First profile normal per-path error rates to derive thresholds, since false positives arise from buggy-but-benign
    code paths. Supports the Detect mission.'
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      err = filter(db_logs, code in [1064,1142,105,156] or code like 'ORA-%')
      by session, src over 1m window:
        cnt = count(err); ratio = cnt / total_queries
        base = rolling_baseline(ratio, session)
        if cnt > 5 or ratio > 3*base:
          alert("DB error spike / blind-SQLi probing", session, src, cnt)
- question: For each application-to-database path, are any query strings statistically anomalous in byte
    length, character/byte-frequency distribution, comment density, special-character ratio, or query
    rate relative to the rolling workload baseline (above the 99th percentile or mean+3sigma)?
  context: 'SQL injection frequently distorts the statistical shape of queries: payloads are longer, denser
    in special characters and comments, and skew the character distribution. For each app-to-database
    path compute rolling distributions for query byte length, 1-gram character/byte-frequency distribution
    (scored via Mahalanobis distance as in PAYL), comment density, special-character ratio, and query
    rate, then flag events above the 99th percentile or mean+3sigma. This mirrors the per-parameter length
    (Chebyshev) and character-distribution (Chi-square) models of Kruegel & Vigna. Derive thresholds per
    path from labeled corpora such as CIC-IDS2017 and the Mendeley web-attack dataset. A positive result
    flags a query that does not look like normal traffic for that workload and warrants signature/context
    review. Supports the Detect mission.'
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for path in app_to_db_paths:
        feats = {len, char_freq_1gram, comment_density, special_char_ratio, rate}
        base = rolling_distribution(path, last=30d)
        md = mahalanobis(char_freq_1gram, base)            # PAYL
        if len > p99(base.len) or md > base.len_mean+3*sigma
           or special_char_ratio > p99 or rate > mean+3*sigma:
          alert("query-shape anomaly", path, query)
- question: Do any queries exhibit improbable SQL verb/token transition sequences for the issuing user
    role, such as appended UNION or subquery structure, where the token-transition likelihood falls below
    the learned per-role floor?
  context: Beyond individual token shape, the order in which SQL verbs and tokens appear encodes the query's
    structure. Build Markov/HMM transition probabilities of SQL verb and token sequences per user role
    (the structural-inference model of Kruegel & Vigna) and alert when an observed query's token-transition
    likelihood falls below a learned per-role floor. Injected control flow, such as an appended UNION
    or nested subquery grafted onto an otherwise normal statement, produces low-probability transitions
    that this model surfaces even when individual tokens look benign. A positive result indicates structurally
    anomalous query composition consistent with injection. Supports the Detect mission.
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      model = markov_hmm_transitions(per=role)            # trained on benign
      seq = token_sequence(query)
      loglik = model.score(seq, role)
      if loglik < per_role_floor[role]:
        alert("anomalous SQL token-transition (injected control flow)", role, query)
- question: When multiple weak indicators co-occur on the same query or session (signature hit, shape/volume
    deviation, transition improbability, role inconsistency, error-rate spike), does the calibrated Bayesian
    posterior cross the alert threshold, and which evidence nodes drove the verdict?
  context: Simple OR-ing of independent detectors produces excessive false positives and opaque alerts.
    Combine signature hits, shape/volume deviations, transition improbability, role inconsistency, and
    error-rate spikes into a single calibrated posterior using a Bayesian event classifier (Kruegel et
    al.) rather than logical OR. This lowers false positives by weighting corroborating evidence and lets
    each alert list which evidence nodes drove the verdict, accelerating triage. A high posterior with
    several contributing nodes is a high-confidence SQLi finding; a marginal posterior driven by a single
    weak node can be deprioritized. Supports the Detect mission.
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days; correlate signals within a sliding per-session window
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      nodes = {sig_hit, shape_dev, transition_improb, role_inconsistent, error_spike}
      posterior = bayes_classifier(nodes)                  # calibrated, not OR
      if posterior > ALERT_P:
        alert("SQLi (fused)", session, posterior,
              top_contributing_nodes(nodes))
- question: After vectorizing SQL strings with token TF-IDF and structural features (length, entropy,
    special-character ratio), do any queries fall in low-density regions or outside the stable benign
    clusters learned by unsupervised models (DBSCAN/Isolation Forest), marking them as candidate novel
    injection?
  context: Unsupervised modeling catches novel SQLi that no signature describes yet. Vectorize SQL strings
    with token TF-IDF plus structural features (length, entropy, special-character ratio) and train DBSCAN
    or Isolation Forest models to learn stable benign query clusters, then elevate low-density/outlier
    queries as candidates for novel injection. Calibrate the false-positive rate against labeled CIC-IDS2017
    and the Mendeley web-attack dataset, and always run this in parallel with, never replacing, the deterministic
    signature floor. A positive result is a query unlike any normal cluster and merits manual review and
    possible signature creation. Supports the Detect mission.
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = tfidf(tokens) + [length, entropy, special_char_ratio]
      model = DBSCAN_or_IsolationForest.fit(benign_X)      # unsupervised
      for q in live:
        if model.is_outlier(vec(q)) or low_density(vec(q)):
          alert("novel SQLi candidate (outlier)", q)
      # run alongside signature floor; calibrate FPR vs CIC-IDS2017 / Mendeley
- question: Does a supervised classifier trained on labeled benign vs. malicious queries score any live
    query as malicious for prioritization or inline enforcement, and does each alert surface the top-3
    contributing features (specific tokens, query length, entropy) that drove the decision?
  context: A supervised model provides high-precision scoring for prioritization and enforcement. Train
    a classifier (Random Forest/Gradient Boosting, or a cascaded lightweight-NLP-plus-transformer pipeline
    for line-rate throughput as in Tasdemir et al.) on labeled benign vs. malicious queries using lexical,
    structural, and session-context features, then score live queries. Per xNIDS (Feng et al.), each alert
    must surface the top-3 contributing features, not just a score, so the analyst can validate the verdict
    and avoid black-box trust. Retrain periodically against captured first-party sql.log to counter drift.
    A high-confidence malicious classification with intuitive contributing features is an actionable SQLi
    finding suitable for inline response. Supports the Detect mission.
  answer_sources:
  - Zeek sql.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Database error/audit logs (MySQL error log, MSSQL trace, Oracle audit)
  - WAF/ModSecurity audit log
  - 'NAI: Database servers, Application servers, Database server network segments'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      clf = RandomForest_or_GBM.fit(labeled[benign,malicious],
              feats=lexical+structural+session_context)
      p, contrib = clf.predict_with_explain(vec(query))
      if p > MAL_THRESHOLD:
        alert("SQLi (supervised)", query, p, top3(contrib))  # xNIDS-style
      # retrain periodically on captured first-party sql.log
