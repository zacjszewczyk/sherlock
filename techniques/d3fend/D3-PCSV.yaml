name: 'D3-PCSV: Process Code Segment Verification'
id: 7700fff5-7a2c-4a85-a270-6a851cd7b291
description: 'Investigate evidence that a running process''s in-memory executable code (its .text/code
  segment) no longer matches its trusted on-disk image — the core of D3-PCSV: Process Code Segment Verification.
  This playbook helps a SOC analyst hunt for code injection, process hollowing, herpaderping, and module
  stomping by (1) alerting on deterministic process-tampering signals (Sysmon Event ID 25 image replacement/lock,
  in-memory vs on-disk byte/hash mismatches, execution from unbacked private RX memory, and the ordered
  allocate->write->execute injection primitives linked by a shared target address); (2) detecting impossible
  process lineage and hollowing tells such as system binaries launched with empty command lines; and (3)
  surfacing the behavioral and network consequences of tampering, where normally-silent system processes
  begin new outbound communication or diverge from their learned system-call baseline. It blends deterministic
  detection rules, statistical baselining of tampering and egress rates, coverage-health measurement,
  and explainable machine-learning scoring so the analyst can both measure verification coverage gaps
  and catch active in-memory tampering against high-value processes on critical servers, workstations,
  and privileged-user endpoints.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
