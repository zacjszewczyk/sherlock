name: 'D3-AVE: Asset Vulnerability Enumeration'
id: 7a5bcea5-9ded-4fde-914d-30cd5578c545
description: 'This playbook helps an analyst assess the current state of the asset inventory by enumerating
  asset vulnerabilities and surfacing the weaknesses that an external actor, commodity malware, or insider
  could exploit. It guides investigation across three complementary evidence streams: authenticated vulnerability
  scans (which produce a host-level inventory of confirmed software and configuration weaknesses, critical
  CVEs, exploit-likely findings, and assets that were unreachable, unauthenticated, or unscanned during
  the scan window — a distinct blind-spot signal); passive and active service discovery (mapping observed
  open ports and service banners to software versions to identify externally reachable services with likely
  vulnerable versions or unexpected exposure, including services seen on the wire but absent from the
  authenticated inventory); and encrypted-traffic analysis (identifying deprecated protocols, weak cryptographic
  settings, downgrade behavior, and certificate-validation failures that demonstrate assets still allowing
  insecure communication paths). For each stream it provides deterministic detection logic, statistical
  baselining of coverage and risk density, and machine-learning prioritization so a SOC analyst can find,
  rank, and remediate vulnerable assets and close visibility gaps in the inventory.'
type: technique
related:
- tactic_id: D3-AI
  tactic_name: Asset Inventory
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which authenticated-scan results contain critical or known-exploitable vulnerabilities, and
    which expected assets returned no scan data at all (indicating a coverage blind spot)?
  context: 'As part of Asset Inventory, authenticated ACAS/Nessus/OpenVAS scans give the most reliable
    host-level view of confirmed weaknesses. Parse each authorized subnet''s results for critical and
    high findings and apply deterministic [CVSS v3.1](https://www.first.org/cvss/specification-document)
    / [CVSS v4.0](https://www.first.org/cvss/v4-0/specification-document) thresholds: alert when Base
    score >= 9.0 with
    Attack Vector = Network, or on any finding listed in the CISA KEV catalog, then re-weight by the CVSS
    Environmental group using local asset-criticality. Equally important, any expected asset that returns
    no scan data is a blind spot a sophisticated actor could hide behind, so it must alert too. A positive
    result is a host carrying an exploitable network-reachable CVE or an expected host missing from results
    entirely; a negative result is full coverage with no critical findings.'
  answer_sources:
  - ACAS authenticated scan results
  - Nessus/OpenVAS plugin output
  - EPSS daily score feed
  - Zeek conn.log
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each finding IN acas_scan_results:\n  IF (cvss_base >= 9.0 AND attack_vector == \"Network\"\
      )\n     OR cve_id IN cisa_kev_catalog:\n    severity = reweight(cvss_environmental, asset_criticality)\n\
      \    ALERT \"Critical exploitable finding\" host, cve_id, severity\n# blind spots\nexpected = asset_inventory.hosts\n\
      scanned  = acas_scan_results.hosts\nFOR host IN (expected - scanned):\n  ALERT \"Expected asset\
      \ missing from scan results\" host"
- question: What scan failure modes occurred this cycle — authentication-failed hosts, unreachable/timed-out
    hosts, plugin errors, or expected assets entirely absent — and which of those failures are on hosts
    that were actually live on the network?
  context: 'Under Asset Inventory, each scan failure mode is a distinct visibility signal, not noise.
    Classify and alert separately on authentication-failed hosts, unreachable/timed-out hosts, plugins
    that errored, and expected assets absent from results. Cross-check unreachable hosts against [Zeek
    conn.log](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html): a host that
    was live on the wire but returned zero authenticated findings is a higher-priority
    coverage gap than one that was simply offline, because it means the scanner could not see what an
    attacker could. A positive result is a live host with no successful authenticated assessment; resolving
    these closes the gaps an adversary would exploit.'
  answer_sources:
  - ACAS authenticated scan results
  - Nessus/OpenVAS plugin output
  - EPSS daily score feed
  - Zeek conn.log
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR host IN expected_assets:\n  state = scan_result_state(host)   # AUTH_FAILED | UNREACHABLE\
      \ | PLUGIN_ERROR | ABSENT | OK\n  IF state != OK:\n    live = host IN zeek_conn_log.seen_hosts(window=scan_window)\n\
      \    priority = HIGH if (state IN [UNREACHABLE, ABSENT] AND live) else MEDIUM\n    ALERT \"Scan\
      \ coverage failure\" host, state, live, priority"
  - technology: Zeek/pseudocode
    query: 'conn.log

      | filter ts within scan_window

      | group by id.orig_h, id.resp_h

      | output live_hosts  # join against scan failures to confirm liveness'
- question: How does this cycle's per-subnet scan coverage, vulnerabilities-per-host, critical-vulnerability
    density, and authentication-success rate compare to the trailing 30-day baseline, and where has it
    degraded?
  context: For Asset Inventory, trends matter as much as point-in-time findings. Each scan cycle, compute
    per-subnet coverage %, vulnerability counts per host, critical-vulnerability density, and authentication-success
    rate, then compare to a rolling 30-day baseline. Alert when coverage drops, auth-success rate falls,
    or critical density exceeds site-specific historical percentile thresholds (derive cutoffs from your
    own scan history rather than fixed numbers). A positive result is a statistically significant regression
    in coverage or a spike in critical density — both indicate growing risk or shrinking visibility that
    an attacker could leverage.
  answer_sources:
  - ACAS authenticated scan results
  - Nessus/OpenVAS plugin output
  - EPSS daily score feed
  - Zeek conn.log
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days (compare each cycle to trailing 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "PER subnet, PER scan_cycle:\n  coverage_pct   = scanned_hosts / expected_hosts\n  vulns_per_host\
      \ = total_findings / scanned_hosts\n  crit_density   = critical_findings / scanned_hosts\n  auth_rate\
      \      = auth_success_hosts / attempted_hosts\nbaseline = rolling_30d(metric)\nIF coverage_pct <\
      \ baseline.p10\n   OR auth_rate  < baseline.p10\n   OR crit_density > baseline.p90:\n  ALERT \"\
      Coverage/risk-density regression\" subnet, metric, value, baseline"
- question: After enriching each finding with its EPSS exploitation probability (and optional local risk-ranking
    model), which vulnerabilities should be remediated first, and what top features drove each ranking?
  context: Within Asset Inventory, raw CVSS over-counts; exploit likelihood focuses remediation where
    it matters. Enrich every finding with its [EPSS](https://www.first.org/epss/model) probability and
    prioritize using a tuned threshold (e.g., EPSS >= 0.1 per [EPSS percentile guidance](https://www.first.org/epss/articles/prob_percentile_bins)).
    Optionally train a local supervised risk-ranking model on ACAS features — CVSS sub-vectors, asset
    criticality, exposure, vulnerability age, public-exploit availability — following [Jacobs et al. (EPSS
    v3)](https://arxiv.org/pdf/2302.14172), [Bozorgi et al.](https://cseweb.ucsd.edu/~savage/papers/KDD10.pdf),
    and [Sabottke et al.](https://www.usenix.org/system/files/conference/usenixsecurity15/sec15-paper-sabottke.pdf).
    Surface the
    top-3 contributing features in each prioritized alert (e.g., public exploit available, AV:N, EPSS=0.94)
    so analysts can triage the ranking, not just a number. A positive result is a high-probability, high-impact
    finding on a reachable asset that warrants immediate action.
  answer_sources:
  - ACAS authenticated scan results
  - Nessus/OpenVAS plugin output
  - EPSS daily score feed
  - Zeek conn.log
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days (EPSS feed refreshed daily)
  queries:
  - technology: SIEM/ML pseudocode
    query: "FOR finding IN acas_scan_results:\n  finding.epss = epss_feed.lookup(finding.cve_id).probability\n\
      \  features = [cvss_subvectors, asset_criticality, exposure,\n             vuln_age, public_exploit_available,\
      \ finding.epss]\n  finding.risk = risk_rank_model.score(features)   # optional local model\n  IF\
      \ finding.epss >= 0.10 OR finding.risk >= threshold:\n    top3 = explain(features)[:3]\n    ALERT\
      \ \"Prioritized remediation\" host, cve_id, finding.risk, finding.epss, top3\nORDER BY finding.risk\
      \ DESC"
- question: Which host-port-service-version combinations on the network run software versions in known-vulnerable
    ranges or outside the approved baseline, and which services appear on the wire but are missing from
    the authenticated scan inventory?
  context: For Asset Inventory, build a Host-Port-Service-Version inventory by joining [Zeek conn.log](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html)
    listener data with Zeek software.log banners and active [Nmap service/version detection](https://nmap.org/book/vscan.html).
    Match discovered versions
    against approved software baselines and known-vulnerable version ranges / CVE feeds to generate actionable
    findings. Critically, flag any service observed on the wire but absent from the authenticated scan
    inventory as an unmanaged-exposure finding — these are exactly the shadow services an external actor
    probes first. A positive result is an exposed service running a vulnerable version or an unmanaged
    listener; a negative result is all listeners accounted for and within baseline.
  answer_sources:
  - Zeek conn.log
  - Zeek software.log
  - Nmap service/version scan results
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "inv = join(conn.log[listeners] , software.log[banners] , nmap_results)\n        on (host,\
      \ port)\nFOR svc IN inv:\n  IF svc.version IN known_vulnerable_ranges(svc.product)\n     OR svc.product\
      \ NOT IN approved_baseline:\n    ALERT \"Vulnerable/unapproved exposed service\" svc.host, svc.port,\
      \ svc.product, svc.version\n  IF svc NOT IN authenticated_scan_inventory:\n    ALERT \"Unmanaged\
      \ exposure (on wire, not in scan)\" svc.host, svc.port, svc.product"
- question: Which hosts are exposing uncommon services or showing abrupt increases in externally reachable
    listeners relative to their peer group, and which show elevated connection-refused/reset ratios indicating
    half-open or transient services?
  context: Within Asset Inventory, measure service prevalence by port and asset class over rolling windows,
    capturing Volume (distinct listeners per host), Frequency (new-listener rate per day), and State (established
    vs. reset/refused connections from conn.log). Flag hosts exposing uncommon services or sudden increases
    in reachable services beyond peer-group percentile bands. Track connection-refused/reset ratios as
    a distinct failure-mode signal of half-open or transient services that may evade snapshot scans. A
    positive result is a host deviating from its peer group's normal exposure profile — a candidate for
    unexpected or unauthorized exposure.
  answer_sources:
  - Zeek conn.log
  - Zeek software.log
  - Nmap service/version scan results
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days (rolling peer-group windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "PER host (grouped by asset_class):\n  volume     = distinct(listener_ports)\n  new_rate  \
      \ = count(new_listeners) / day\n  reset_ratio= reset_or_refused_conns / total_conns\npeer = percentile_bands(metric\
      \ BY asset_class)\nIF volume > peer.p95 OR new_rate > peer.p95\n   OR reset_ratio > peer.p95:\n\
      \  ALERT \"Anomalous service exposure\" host, metric, value, peer_band"
- question: Which newly observed services are most likely to be vulnerable based on a model trained on
    historical service observations and remediation outcomes (or, for unlabeled estates, flagged as rare
    by an unsupervised model)?
  context: For Asset Inventory, train a classifier on historical service observations and remediation
    outcomes using features such as banner string, port, host role, exposure path, and protocol, then
    score newly observed services for likelihood of being vulnerable to prioritize validation. For unlabeled
    estates, use an unsupervised [Isolation Forest](https://ieeexplore.ieee.org/document/10143005/) /
    [One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4) over the same Zeek flow features
    to isolate rare host-port-role combinations. Surface the top-3 contributing features in each alert
    (e.g.,
    rare port for role, new banner, high byte-out) for explainability. A positive result is a high-scoring
    or anomalous service instance that should be validated before an attacker finds it.
  answer_sources:
  - Zeek conn.log
  - Zeek software.log
  - Nmap service/version scan results
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [banner, port, host_role, exposure_path, protocol, bytes_out]\nIF labels_available:\n\
      \  score = vuln_service_classifier.predict_proba(features)\nELSE:\n  score = isolation_forest.anomaly_score(features)\
      \   # or one-class SVM\nIF score >= threshold:\n  top3 = explain(features)[:3]\n  ALERT \"Likely-vulnerable\
      \ service\" host, port, banner, score, top3"
- question: Which sessions use deprecated/insecure protocols (SSLv2/3, TLS 1.0/1.1, weak ciphers, plaintext
    Telnet/FTP), exhibit failed certificate validation, or show active TLS downgrade behavior — especially
    involving high-value or administrative assets?
  context: Under Asset Inventory, query [Zeek ssl.log](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html)
    for SSLv2/SSLv3, TLSv1.0/1.1, weak ciphers (RC4, NULL, EXPORT, anonymous DH), and validation_status
    != ok, and query conn.log for Telnet/FTP plaintext sessions. The mere offer of a deprecated protocol
    is measurable risk (per [DROWN](https://drownattack.com/drown-attack-paper.pdf)); detect active downgrades
    via the [RFC 7507 TLS Fallback SCSV](https://www.rfc-editor.org/rfc/rfc7507.txt) marker (cipher 0x5600)
    and inappropriate_fallback alerts. Escalate
    when insecure sessions involve high-value assets or administrative subnets, since those are the paths
    an interceptor would target. A positive result is an asset still permitting insecure communication.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek x509.log
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ssl.log\n| filter version IN [SSLv2,SSLv3,TLSv10,TLSv11]\n      OR cipher MATCHES (RC4|NULL|EXPORT|anon_DH)\n\
      \      OR validation_status != \"ok\"\n      OR cipher == 0x5600   # TLS_FALLBACK_SCSV\n| join conn.log\
      \ on uid\nUNION conn.log | filter service IN [telnet, ftp]\n| eval high_value = resp_h IN admin_subnets\
      \ OR resp_h IN crown_jewels\n| ALERT \"Insecure protocol use\" host, version, cipher, validation_status,\
      \ high_value"
- question: How is the ratio of insecure-to-total encrypted sessions trending by business unit and asset
    tier, and which segments exceed their statistical control limits or fail to decline against remediation
    targets?
  context: For Asset Inventory, compute daily ratios of insecure-to-total encrypted sessions by business
    unit and asset tier, plus absolute counts (Volume) and per-host failure states (TLS handshake/validation
    failures). Trigger alerts when ratios exceed statistical control limits or fail to decline against
    remediation targets, and track certificate-validation-failure rate as a distinct failure-mode signal.
    Derive control limits from each segment's own 30-day baseline. A positive result is a segment whose
    insecure-protocol adoption is rising or stuck, indicating remediation is failing and insecure paths
    remain available to an attacker.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek x509.log
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days (daily ratios vs. 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "PER business_unit, asset_tier, day:\n  insecure_ratio = insecure_sessions / total_encrypted_sessions\n\
      \  cert_fail_rate = validation_failures / total_handshakes\nctrl = control_limits(rolling_30d(insecure_ratio))\n\
      IF insecure_ratio > ctrl.upper\n   OR insecure_ratio NOT declining vs remediation_target\n   OR\
      \ cert_fail_rate > ctrl.upper:\n  ALERT \"Insecure protocol adoption out of control\" segment, insecure_ratio,\
      \ cert_fail_rate"
- question: Which assets deviate from their group's normal protocol and cipher-suite distribution in a
    way that suggests downgrade attacks, legacy fallback, or unauthorized services, and what features
    drove the anomaly?
  context: Within Asset Inventory, train an unsupervised model on normal protocol and cipher-suite distributions
    per asset group using Zeek ssl.log and ssh.log (e.g., self-supervised encrypted-traffic anomaly detection
    ([ET-SSL](https://www.nature.com/articles/s41598-025-08568-0)) or [Isolation Forest / One-Class SVM
    with LIME explainability](https://www.nature.com/articles/s41598-025-20445-4)). Flag deviations suggesting
    downgrade attacks, legacy fallback, or unauthorized services, and surface the top-3 contributing features
    per alert (e.g., unexpected TLS1.0 offer, anomalous cipher, peer rarity). Account for model drift
    and adversarial poisoning when retraining on operational logs. A positive result is an asset whose
    crypto behavior departs from its learned baseline, warranting investigation.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek x509.log
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "PER asset_group: model = train_unsupervised(ssl.log+ssh.log\n    features=[tls_version, cipher_suite,\
      \ ja3, peer_rarity, fallback_marker])\nFOR session IN new_sessions:\n  score = model.anomaly_score(session.features)\n\
      \  IF score >= threshold:\n    top3 = LIME_explain(session.features)[:3]\n    ALERT \"Protocol/cipher\
      \ anomaly\" host, asset_group, score, top3\n# guard against drift/poisoning when retraining"
