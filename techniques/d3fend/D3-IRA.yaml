name: 'D3-IRA: Identifier Reputation Analysis'
id: 46baad9f-eadb-413b-9ae8-758b9ad1116d
description: This playbook helps an analyst investigate the coverage and efficacy of identifier reputation
  analysis for threat detection. It guides examination of identifier telemetry (IPs, domains, URLs, file
  hashes, user agents) to confirm potentially malicious infrastructure use when internal hosts interact
  with known-bad identifiers, execute files tied to malicious hashes, present anomalous user agents, or
  show correlated rare-identifier behavior preceding outbound communications. It also covers reputation-evasion
  and failure-mode telemetry — domain fronting, lookalike/typosquat domains, NXDOMAIN bursts, blocked
  connections, and fast-flux resolution — where an internal host borrows a high-reputation identifier
  or generates abnormal identifier failure patterns that diverge from the identifier's expected reputation.
  The methods span deterministic feed matching and correlation, statistical rarity/entropy/anomaly scoring,
  and machine-learning models over host-identifier graphs and feature vectors.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any internal host connect to, resolve, or execute an identifier (IP, domain, URL, or file
    hash) that matches a maintained threat-intelligence watch list, and what host, user, and process lineage
    is associated with each confirmed match?
  context: 'This is the deterministic detection floor for the Detect tactic. Maintain synchronized feeds
    of malicious IPs, domains, URLs, and file hashes and compare them against Zeek conn.log destinations,
    dns.log queries, http.log hosts/URIs, and process hashes from Windows Event ID 4688. Every confirmed
    match is a high-confidence indicator of malicious infrastructure use and should alert with full host/user/process
    context. A positive result means an internal asset interacted with known-bad infrastructure and warrants
    immediate triage and containment; a negative result does not clear the host because novel/unlisted
    identifiers are handled by the statistical and ML methods. Treat rarity as an additional prior, not
    a replacement for this floor — this rule must never be removed. [Symbolic Logic] Source method: Maintain
    synchronized feeds for malicious IPs, domains, URLs, and file hashes (e.g., labels of the type used
    by [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)). Compare Zeek
    conn.log destinations, Zeek dns.log queries, Zeek http.log hosts/URIs, and process hashes from Windows
    Security Event ID 4688 to this watch list, and alert on every confirmed match with host, user, and
    process lineage. This deterministic floor must never be removed; treat rarity as an additional prior,
    not a replacement ([Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Network egress points and critical host endpoints (Domain Controllers, user workstations)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "feeds = load_threatfeeds(types=[ip,domain,url,hash])\nevents = union(zeek_conn.dest_ip, zeek_dns.query,\
      \ zeek_http.host+uri, win4688.process_hash)\nfor e in events:\n  if e.identifier in feeds:\n   \
      \ alert(match=e.identifier, host=e.host, user=e.user, process_lineage=e.parent_chain, feed=feeds[e.identifier].label)"
- question: On any single host, did a rare or malicious domain query precede an outbound connection and
    suspicious process execution within a short correlation window, indicating an aligned multi-identifier
    attack chain?
  context: 'Single indicators can be noisy; correlating across identifier categories raises confidence
    for analyst response, supporting the Detect tactic. Within a 10-minute window on the same host, link
    rare/malicious DNS queries to subsequent outbound connections and suspicious process execution, escalating
    only when at least two identifier categories align. This entity-relationship correlation across users,
    hosts, processes, and identifiers follows a heterogeneous-graph rationale. A positive result (e.g.,
    rare domain -> outbound conn -> new process) strongly suggests an active compromise sequence; a single
    category alone may be benign and is deprioritized. [Symbolic Logic] Source method: Within a 10-minute
    window, correlate rare or malicious domain queries with subsequent outbound connections and suspicious
    process execution on the same host. Escalate only when at least two identifier categories align, improving
    confidence for analyst response. Entity-relationship correlation across users, hosts, processes, and
    identifiers follows the heterogeneous-graph rationale of [Log2vec](https://doi.org/10.1145/3319535.3363749).'
  answer_sources: *id001
  range: Last 90 days (correlate within 10-minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "window = 10m\nfor host in hosts:\n  ev = events(host, last=window)\n  cats = set()\n  if any(ev.dns\
      \ where rare_or_malicious): cats.add('dns')\n  if any(ev.conn where outbound_suspicious): cats.add('conn')\n\
      \  if any(ev.win4688 where suspicious_proc): cats.add('proc')\n  if len(cats) >= 2:\n    alert(host=host,\
      \ categories=cats, timeline=ev.sorted_by_time)"
- question: Which queried domains, resolved IPs, or file hashes are first-seen or fall below the 5th percentile
    of enterprise frequency on critical assets, and do they coincide with suspicious process activity?
  context: 'Rarity is a powerful prior for malicious infrastructure that has not yet been listed in feeds.
    Compute a rolling 30-day enterprise frequency for domains, resolved IPs, and hashes, and flag first-seen
    or sub-5th-percentile identifiers appearing on critical assets such as Domain Controllers and user
    workstations. Use the MAD-based modified Z-score (flag |z| > 3.5) to set robust bounds so batch jobs
    do not inflate thresholds. Prioritize by burst size, number of affected hosts, and overlap with suspicious
    process activity. A positive result highlights novel identifiers concentrated on sensitive hosts;
    benign new business domains will typically spread across many hosts and rank lower. [Statistical Method]
    Source method: Compute rolling 30-day enterprise frequency for queried domains, resolved IPs, and
    file hashes and flag first-seen or sub-5th-percentile identifiers on critical assets ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf);
    rarity-as-prior per [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    Set bounds with the MAD-based modified Z-score (flag |z| > 3.5) so batch jobs do not inflate thresholds
    ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Prioritize alerts by burst size, number of affected hosts, and overlap with suspicious process activity.'
  answer_sources: *id001
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "freq = rolling_count(identifier, window=30d, scope=enterprise)\nfor id in identifiers_on_critical_assets:\n\
      \  if first_seen(id) or percentile(freq[id]) < 5:\n    z = (freq[id] - median(freq)) / (1.4826*MAD(freq))\n\
      \    if abs(z) > 3.5:\n      alert(identifier=id, hosts=affected, burst=count, overlap=suspicious_proc)"
- question: Are any HTTP user-agent strings unique (seen fewer than five times) or matching known malicious
    tooling signatures, particularly when originating from user workstations?
  context: 'Anomalous user agents reveal non-standard clients (custom malware, scanners, PowerShell defaults)
    used for C2 or tooling, supporting Detect. Ingest Zeek http.log, extract user_agent strings, compute
    daily enterprise prevalence, and alert on UAs that are unique (seen < 5 times) or match known malicious
    tool signatures when sourced from user workstations. Apply the modified Z-score to per-host UA-diversity
    counts to avoid mean distortion from automation. A positive result flags a workstation presenting
    rare or tool-like UAs that merit endpoint inspection; high-diversity automation hosts are baselined
    separately. [Statistical Method] Source method: Ingest Zeek http.log and extract user_agent strings.
    Compute the daily prevalence of each UA string across the enterprise and alert on UAs that are unique
    (seen < 5 times) or match known malicious tools (PowerShell defaults, scanner signatures) when originating
    from user workstations ([Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    Use the modified Z-score on per-host UA-diversity counts to avoid mean-distortion from automation
    ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ua_count = daily_prevalence(zeek_http.user_agent)\nfor rec in zeek_http where src in workstations:\n\
      \  if ua_count[rec.user_agent] < 5 or rec.user_agent matches malicious_signatures:\n    alert(host=rec.src,\
      \ ua=rec.user_agent)\n# per-host UA diversity anomaly\nz = modified_zscore(per_host_ua_diversity)\n\
      flag hosts where abs(z) > 3.5"
- question: Has any host's daily reputation score, derived from weighted identifier risk, degraded beyond
    historical variance for two consecutive days?
  context: 'A gradual or sudden reputation decline can reveal a slowly-compromising host that no single
    event would flag, supporting Detect. Derive daily host reputation scores from weighted identifier
    risk and monitor each host with EWMA or Seasonal-Hybrid ESD plus the MAD-based modified Z-score for
    robust change detection. Trigger an investigation when score degradation exceeds historical variance
    thresholds for two consecutive days, with baselines derived per dataset from historical percentiles.
    A positive result indicates sustained reputation drift on a host warranting investigation; transient
    single-day dips are filtered by the two-day persistence requirement. [Statistical Method] Source method:
    Derive daily host reputation scores from weighted identifier risk and monitor each host with EWMA
    or Seasonal-Hybrid ESD, plus the MAD-based modified Z-score for robust change detection ([Modified
    Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Trigger investigations when score degradation exceeds historical variance thresholds for two consecutive
    days; derive baselines per dataset from historical percentiles (e.g., on the [Unified Host and Network
    Data Set](https://arxiv.org/abs/1708.07518)).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for host in hosts:\n  score[host][day] = sum(weight(id)*risk(id) for id in identifiers(host,\
      \ day))\n  baseline = ewma(score[host], halflife=14) ; resid = score - baseline\n  z = modified_zscore(resid)\n\
      \  if degradation(z) beyond historical_threshold for 2 consecutive days:\n    alert(host=host, scores=score[host][-2:])"
- question: When host-identifier associations are embedded in a heterogeneous graph, which hosts cluster
    apart from benign baselines as anomalous, and what top features drive that score?
  context: 'Graph-based learning captures relational anomalies (unusual host<->domain/IP/hash associations)
    that flat rules miss, supporting Detect. Build a host-identifier bipartite/heterogeneous graph, learn
    embeddings so anomalous associations cluster apart from benign baselines, then score with Isolation
    Forest as a low-latency unsupervised baseline. Train on benign and incident data and surface the top-3
    contributing features (rare-domain count, byte ratio, UA novelty) via SHAP/LIME rather than a bare
    score. A positive result is a host whose identifier relationships deviate structurally from peers;
    explainable features let the analyst validate or dismiss. [Machine Learning] Source method: Build
    a host-identifier bipartite/heterogeneous graph and learn embeddings so anomalous host↔domain/IP/hash
    associations cluster apart from benign baselines ([Log2vec](https://doi.org/10.1145/3319535.3363749)),
    then score with Isolation Forest as a low-latency unsupervised baseline ([Isolation Forest, Liu et
    al.](https://ieeexplore.ieee.org/document/4781136)). Train on benign and incident data (e.g., the
    [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518)) and surface the top-3 contributing
    features (rare-domain count, byte ratio, UA novelty) in the alert via SHAP/LIME attribution rather
    than a bare score ([SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_graph(nodes=[hosts,domains,ips,hashes], edges=observed_assoc)\nemb = node2vec_or_hetero_embed(G)\n\
      scores = IsolationForest().fit(emb[benign]).score(emb[hosts])\nfor host in hosts where scores[host]\
      \ anomalous:\n  feats = shap_top3(host)  # rare_domain_count, byte_ratio, ua_novelty\n  alert(host=host,\
      \ score=scores[host], top_features=feats)"
- question: For domains, URLs, and IPs not present in threat feeds, do supervised classifiers (URL character/word
    CNN and passive-DNS decision-tree features) score them as likely malicious before they are formally
    listed?
  context: 'Novel malicious identifiers often appear before feeds list them; supervised scoring on first-party
    telemetry catches them early, supporting Detect. Score feed-missing domains/URLs/IPs with a character/word
    CNN over raw URLs and passive-DNS decision-tree features such as IP fan-out, TTL, and lexical n-grams.
    Run this in parallel with feed matching so novel malicious identifiers are caught before listing,
    and emit the top contributing features. A positive high-confidence score should be triaged like a
    feed hit; explainable features distinguish genuine malice from benign-but-unusual domains. [Machine
    Learning] Source method: Score domains/URLs/IPs that miss the feeds using supervised classifiers on
    first-party telemetry — a character/word CNN over raw URLs (AUC > 0.99, [URLNet](https://arxiv.org/abs/1802.03162))
    and passive-DNS decision-tree features such as IP fan-out, TTL, and lexical n-grams ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    Run in parallel with feed matching so novel malicious identifiers are caught before listing; emit
    the top contributing features per [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "candidates = identifiers not in feeds\nfor c in candidates:\n  p_url = urlnet_cnn(c.url)\n\
      \  p_pdns = decision_tree(features=[ip_fanout, ttl, lexical_ngrams])(c)\n  p = ensemble(p_url, p_pdns)\n\
      \  if p > threshold:\n    alert(identifier=c, score=p, top_features=shap(c))"
- question: Which queried domains exhibit high Shannon entropy, poor n-gram scores, abnormal digit/length
    ratios, or many unique subdomains, indicating DGA or DNS-tunneling/exfiltration?
  context: 'Algorithmically-generated domains and DNS tunneling carry distinctive lexical and information-content
    signatures, supporting Detect. For each queried domain compute Shannon entropy, n-gram score, digit/length
    ratios, and unique-subdomain counts to surface DGA and tunneling identifiers; rank registered domains
    by disproportionate information content with a streaming heavy-hitter method for real-time exfiltration
    scoring. Threshold entropy at the enterprise 99th percentile and validate against benign baselines.
    A positive result flags domains whose structure resembles DGA/tunneling and warrants DNS and host
    inspection; CDNs and legitimate high-cardinality services are validated against baselines. [Statistical
    Method] Source method: For each queried domain compute Shannon entropy, n-gram score, digit/length
    ratios, and unique-subdomain counts to surface algorithmically-generated (DGA) and tunneling identifiers
    ([NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500)); rank registered
    domains by disproportionate information content with a streaming heavy-hitter method for real-time
    exfiltration scoring ([Information-Based Heavy Hitters, Chhabra et al.](https://www.ndss-symposium.org/wp-content/uploads/2024-388-paper.pdf)).
    Threshold entropy at the enterprise 99th percentile and validate against benign baselines.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for d in zeek_dns.query:\n  h = shannon_entropy(d) ; ng = ngram_score(d)\n  ratios = digit_len_ratio(d)\
      \ ; subs = unique_subdomain_count(parent(d))\n  ic = information_content(d)  # streaming heavy-hitter\n\
      \  if h > p99(entropy) or ng low or subs high or ic top_hitter:\n    alert(domain=d, entropy=h,\
      \ ngram=ng, subdomains=subs)"
- question: Among trusted-name / anomalous-reputation events (e.g., a known display name paired with a
    never-before-seen sender domain, or a host reaching a high-reputation brand via an unseen URL), which
    rank highest under Directed Anomaly Scoring within the daily alert budget?
  context: 'Reputation mismatches between a trusted name and an anomalous backing identifier are classic
    phishing/impersonation signals, supporting Detect. Rank candidate events with non-parametric Directed
    Anomaly Scoring to keep daily alert volume budget-bounded while preserving recall, and surface the
    specific feature axes that made an event more suspicious than all benign events. A positive result
    is a top-ranked event whose trusted name is backed by a rare/never-seen identifier; the explicit feature
    axes let the analyst confirm the impersonation quickly. [Statistical Method] Source method: For trusted-name
    / anomalous-reputation events (e.g., known display name with a never-before-seen sender domain, or
    a host contacting a high-reputation brand domain via an unseen URL), rank candidates with non-parametric
    Directed Anomaly Scoring to keep daily alert volume budget-bounded while preserving recall ([Detecting
    Credential Spearphishing, Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    Surface the specific feature axes that made an event more suspicious than all benign events.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = trusted_name_with_anomalous_reputation()  # known display name + new sender domain,\
      \ brand + unseen url\nfor e in events:\n  e.score = directed_anomaly_score(e, benign_set)\nrank(events\
      \ by score desc)\nalert(top_N within daily_budget, with distinguishing_feature_axes)"
- question: On any TLS connection, does the SNI/server_name name a high-reputation CDN while the inner
    HTTP Host header names a different or rare backend, indicating domain fronting?
  context: 'Domain fronting lets C2 borrow a trusted CDN''s reputation by mismatching the outer SNI and
    inner Host, supporting Detect. Join Zeek ssl.log (TLS SNI/server_name) with the corresponding http.log
    Host header on the same connection and alert when the front names a high-reputation CDN but the inner
    Host names a different/rare backend — the deterministic signature of domain fronting. Also flag rare
    inner hosts behind a common front. A positive result is strong evidence of evasive C2 and should be
    triaged urgently; legitimate CDN usage normally aligns SNI and Host. [Symbolic Logic] Source method:
    Join Zeek ssl.log (TLS SNI/server_name) with the corresponding http.log Host header on the same connection
    and alert when the front (SNI) names a high-reputation CDN but the inner Host names a different/rare
    backend — the deterministic signature of domain fronting that lets C2 borrow a trusted identifier''s
    reputation ([Blocking-resistant communication through domain fronting, Fifield et al.](https://www.petsymposium.org/2015/papers/03_Fifield.pdf)).
    Also flag rare inner hosts behind a common front.'
  answer_sources: &id002
  - Zeek ssl.log
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network egress points (TLS/HTTP proxies, recursive DNS resolvers) and perimeter firewalls'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join ssl on http by connection_uid\nfor c in joined:\n  if c.ssl.server_name in high_rep_cdns\
      \ and c.http.host != c.ssl.server_name:\n    alert(front=c.ssl.server_name, inner=c.http.host, host=c.src)\n\
      \  if rare(c.http.host) behind common_front(c.ssl.server_name):\n    alert(rare_inner=c.http.host,\
      \ front=c.ssl.server_name)"
- question: Are internal hosts resolving or connecting to domains within 1-2 edits of, or visually confusable
    with, a protected brand or partner allowlist (typosquats, homoglyphs, TLD swaps)?
  context: 'Lookalike/typosquat domains impersonate trusted brands to harvest credentials or deliver payloads,
    supporting Detect. Compute Levenshtein/Damerau edit distance and homoglyph/TLD-swap variants of observed
    domains (from Zeek dns.log/http.log/ssl.log) against a protected brand and partner allowlist, and
    alert on identifiers within 1-2 edits or visually confusable with a protected name. Keep this deterministic
    rule even where ML scoring is deployed. A positive result flags a likely impersonation domain in use;
    the protected list keeps false positives low. [Symbolic Logic] Source method: Compute Levenshtein/Damerau
    edit distance and homoglyph/TLD-swap variants of observed domains (from Zeek dns.log/http.log/ssl.log)
    against a protected brand and partner allowlist; alert on identifiers within 1–2 edits or visually-confusable
    to a protected name ([The Landscape of Domain Name Typosquatting, Spaulding et al.](https://arxiv.org/abs/1603.02767)).
    Keep this deterministic rule even where ML scoring is deployed.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "protected = brand_and_partner_allowlist\nfor d in observed_domains(zeek_dns, zeek_http, zeek_ssl):\n\
      \  for p in protected:\n    if damerau_levenshtein(d, p) in [1,2] or homoglyph_or_tldswap(d, p):\n\
      \      alert(lookalike=d, target=p, host=src)"
- question: Do per-host or per-domain failure signals — NXDOMAIN responses, blocked/failed connections
    (Windows 5156 denies), and TLS handshake failures — burst beyond robust thresholds, and do high-NXDOMAIN
    bursts coincide with high-entropy subdomains?
  context: 'Abnormal identifier failure patterns reveal DGA beaconing, scanning, and tunneling that diverge
    from expected reputation, supporting Detect. Baseline per-host and per-domain failure rates (NXDOMAIN,
    blocked/failed connections, TLS handshake failures) as distinct signals and alert on bursts exceeding
    the MAD-based modified Z-score (|z| > 3.5). High NXDOMAIN combined with high-entropy subdomains under
    one parent indicates DGA/tunneling. A positive result is a host generating anomalous failure bursts;
    correlating with entropy distinguishes DGA from benign misconfiguration. [Statistical Method] Source
    method: Baseline per-host and per-domain failure rates — NXDOMAIN responses, blocked/failed connections
    (Windows 5156 denies), and TLS handshake failures — as distinct signals, and alert on bursts that
    exceed the MAD-based modified Z-score (|z| > 3.5) ([Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    High NXDOMAIN with high-entropy subdomains under one parent indicates DGA/tunneling ([Detection of
    Malicious and Low-Throughput Data Exfiltration Over DNS, Nadler et al.](https://arxiv.org/abs/1709.08395)).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for entity in hosts+domains:\n  for sig in [nxdomain, blocked_conn(win5156_deny), tls_handshake_fail]:\n\
      \    z = modified_zscore(rate[entity][sig])\n    if abs(z) > 3.5:\n      alert(entity=entity, signal=sig,\
      \ rate=rate[entity][sig])\nif high_nxdomain and high_entropy_subdomains(parent):\n  alert(dga_tunneling_suspected=parent)"
- question: Do any domains show fast-flux characteristics — many distinct resolved IPs/ASNs, rapid IP-set
    growth, and low TTLs — indicating resilient C2 or phishing infrastructure?
  context: 'Fast-flux rotates many IPs behind a domain to resist blacklisting, supporting Detect. Cluster
    domains by their resolved IP sets and score the number of distinct IPs/ASNs, IP-set growth over time,
    and low TTLs to detect fast-flux infrastructure before it is blacklisted, surfacing the top contributing
    resolution features. A positive result flags a domain with flux-like dynamism that should be blocked
    and investigated; CDNs are distinguished by stable ASN ownership and baselines. [Machine Learning]
    Source method: Cluster domains by their resolved IP sets and score number of distinct IPs/ASNs, IP-set
    growth over time, and low TTLs to detect fast-flux C2/phishing infrastructure before it is blacklisted
    ([FluxBuster, Perdisci et al.](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf);
    passive-DNS dynamism features per [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    Surface the top contributing resolution features in the alert ([SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_domain(distinct_ips, distinct_asns, ipset_growth_rate, min_ttl)\nclusters =\
      \ cluster(domains by resolved_ip_sets)\nfor d in domains:\n  score = fastflux_score(features[d])\n\
      \  if score high:\n    alert(domain=d, score=score, top_features=shap(features[d]))"
- question: When each host is represented by an identifier feature vector (rare-domain count, resolved-IP
    fan-out, byte upload/download ratio, UA novelty, failure-rate features), which hosts are scored anomalous
    by Isolation Forest, and what top features explain each?
  context: 'An unsupervised baseline catches novel identifier-abuse patterns running in parallel with
    deterministic rules, supporting Detect. Build per-host identifier feature vectors (rare-domain count,
    resolved-IP fan-out, byte upload/download ratio, UA novelty, failure-rate features) and score with
    Isolation Forest as a low-latency baseline. Train/validate on a representative dataset and report
    the top-3 features per alert. A positive result is a host whose combined identifier behavior is statistically
    anomalous; the explainable features let the analyst judge whether it reflects compromise or benign
    automation. [Machine Learning] Source method: Build per-host identifier feature vectors (rare-domain
    count, resolved-IP fan-out, byte upload/download ratio, UA novelty, failure-rate features) and score
    with Isolation Forest as a low-latency unsupervised baseline running in parallel with deterministic
    rules ([Isolation Forest, Liu et al.](https://ieeexplore.ieee.org/document/4781136); low-throughput
    DNS application in [Nadler et al.](https://arxiv.org/abs/1709.08395)). Train/validate on the [Unified
    Host and Network Data Set](https://arxiv.org/abs/1708.07518) and report the top-3 features per alert
    ([SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
