name: 'D3-DEM: Data Exchange Mapping'
id: 5d6442da-9f20-4f4c-bd9b-39c54b02bc0d
description: This playbook helps an analyst validate that the data exchanges observed on the network match
  the organization's intended application-layer design for Data Exchange Mapping (D3-DEM). It guides comparison
  of internal network telemetry (Zeek conn.log, Sysmon Event ID 3, NetFlow, firewall logs) against an
  explicit default-deny allow-list of approved source-destination-port-protocol flows so that any communication
  outside the documented architecture is surfaced as drift or compromise. It also covers deterministic
  profiling of failed and blocked connections as a reconnaissance signal, statistical baselining of per-channel
  volume, directionality, peer diversity, cadence/periodicity, and single-flow time-series traffic class,
  and machine-learning approaches (behavioral clustering, graph link prediction, and online autoencoder
  scoring) that rank unexpected exchanges with explainable features. The intent is to detect both sophisticated
  external actors establishing covert or unauthorized data channels and routine misconfiguration or insider
  activity, while keeping probabilistic models layered in parallel with hard allow-list rules rather than
  replacing them.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are there any established system-to-system flows that do not match an approved source-destination-port-protocol
    allow rule in the documented architecture?
  context: 'Model: This question implements Data Exchange Mapping as a default-deny allow-list. Render
    the documented architecture as the set of expected source-destination-port-protocol flows per [Guidelines
    on Firewalls and Firewall Policy (NIST SP 800-41r1)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-41r1.pdf)
    and the per-session policy model of [Zero Trust Architecture (NIST SP 800-207)](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-207.pdf),
    then alert whenever [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html) or Sysmon Event
    ID 3 shows an established flow that matches no allow rule. A positive result (a flow with no matching
    rule) indicates either architecture drift (an undocumented but legitimate change) or compromise (an
    attacker establishing an unauthorized channel for lateral movement or exfiltration); a negative result
    confirms observed exchanges stay within the intended design. Where the intended model is unknown,
    bootstrap it automatically from observed dependencies using delay-spike correlation ([Orion](https://www.usenix.org/legacy/event/osdi08/tech/full_papers/chen_xu/chen_xu.pdf))
    and convert the discovered dependency set into the allow-list. This is the core deterministic control
    against unintended data exchange between critical systems.'
  answer_sources:
  - Zeek conn.log
  - Windows Sysmon Event ID 3
  - Firewall logs
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '>-

      load conn.log where conn_state=="SF"

      | lookup allowlist on (id.orig_h, id.resp_h, id.resp_p, proto, service)

      | where allow_match == false

      | emit alert(orig_h, resp_h, resp_p, proto, "flow not in approved architecture")'
  - technology: SIEM/Rule pseudocode
    query: '>-

      source IN (Sysmon EID 3, Zeek conn.log)

      | join expected_flows on src_ip, dst_ip, dst_port, protocol

      | where expected_flows IS NULL

      | alert "non-approved inter-system communication"'
- question: Is any host using a protocol or port that is disallowed for its architectural role (for example
    a Domain Controller making outbound web sessions or a database server speaking SMB to a workstation)?
  context: 'Model: Beyond raw allow-list matching, role-based policy scripts (in the manner of [Bro/Zeek](https://www.icir.org/vern/papers/bro-CN99.pdf))
    prohibit protocols and ports that are unexpected for a host''s documented role. Key on [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html)
    proto, service, and id.resp_p fields and evaluate each flow against the role assigned to the originating
    or responding host. A Domain Controller initiating outbound TCP/443 to the internet, or a database
    server initiating SMB to a user workstation, are classic examples of architecture drift that can indicate
    credential theft, tooling staging, or lateral movement by an external actor. A violation flags the
    host and the offending protocol/port for investigation; absence of violations confirms hosts are speaking
    only the protocols their role permits.'
  answer_sources:
  - Zeek conn.log
  - Windows Sysmon Event ID 3
  - Firewall logs
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nload conn.log\n| lookup host_role on id.orig_h\n| where service NOT IN allowed_services[host_role]\n\
      \   OR id.resp_p NOT IN allowed_ports[host_role]\n| emit alert(orig_h, host_role, service, id.resp_p,\
      \ \"disallowed protocol/port for role\")"
- question: Has any host begun generating bursts of failed or blocked connections (S0, REJ, RSTO/RSTR,
    or firewall denies) that deviate from its established per-channel failure baseline?
  context: 'Model: Connection-failure state is treated as a first-class signal for mapping reconnaissance
    against the data-exchange architecture. Count [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html)
    conn_state values S0 (no reply), REJ (rejected), and RSTO/RSTR (reset), plus firewall denies, per
    source-destination-port over 5-minute windows. Alert when a host that normally completes (SF) flows
    suddenly produces bursts of S0/REJ to many distinct destinations (more than ~20 distinct failed destinations
    in 5 minutes suggests scanning/discovery), or when a previously silent allowed channel shows sustained
    denies. The former indicates an actor probing the exchange map for reachable services; the latter
    indicates either reconnaissance or a misconfigured/blocked legitimate flow. Baselines must be derived
    from ~30 days of per-channel history rather than a global constant so that normally noisy channels
    do not drown the signal.'
  answer_sources:
  - Zeek conn.log
  - Windows Sysmon Event ID 3
  - Firewall logs
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days (per-channel failure baseline from prior 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source IN (Zeek conn.log, Firewall logs)

      | where conn_state IN ("S0","REJ","RSTO","RSTR") OR action=="deny"

      | bin 5min by src_ip

      | stats distinct_count(dst_ip) as failed_dsts, count as fails by src_ip, bin

      | where failed_dsts > 20 OR fails > baseline_mean[src_ip,channel] + 3*baseline_std

      | alert "failed/blocked connection burst — possible recon or drift"'
- question: Does the byte volume on any source-destination-port channel exceed its statistical baseline
    (3 standard deviations or the 99th percentile), or does the network-wide flow matrix show an anomalous
    residual?
  context: 'Model: For each source-destination-port channel, compute 7-day and 30-day baselines of orig_bytes
    + resp_bytes from [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html) (or NetFlow) and
    flag hourly values beyond 3 standard deviations, or beyond the channel''s 99th percentile for skewed
    distributions, from channel norms. For network-wide context, model the origin-destination flow matrix
    with PCA and alert on flows with large residual-subspace projection (Q-statistic), as in [Diagnosing
    Network-Wide Traffic Anomalies, Lakhina et al](https://www.cs.bu.edu/fac/crovella/paper-archive/sigc04-network-wide-anomalies.pdf).
    A volume spike on an exchange channel can indicate bulk staging/exfiltration or a sudden change in
    application behavior; a network-wide residual catches distributed shifts a single-channel threshold
    would miss. Derive site-specific thresholds from a representative baseline corpus (e.g., the [Unified
    Host and Network Data Set, Turcotte et al](https://arxiv.org/abs/1708.07518)).'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - Windows Sysmon Event ID 3
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days (baselines over trailing 7 and 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source IN (Zeek conn.log, NetFlow)

      | eval bytes = orig_bytes + resp_bytes

      | bin 1h by (src_ip, dst_ip, dst_port)

      | stats sum(bytes) as vol by channel, hour

      | join baseline(mean, std, p99) on channel

      | where vol > mean + 3*std OR vol > p99

      | alert "channel volume anomaly"'
  - technology: Statistical/PCA pseudocode
    query: '>-

      build OD flow matrix from conn.log over time bins

      | PCA -> normal subspace + residual subspace

      | compute Q-statistic per bin

      | where Q > threshold

      | alert "network-wide traffic anomaly (residual projection)"'
- question: Has the directionality (inbound-to-outbound byte ratio) or peer diversity of any host inverted
    or grown beyond its historical range?
  context: 'Model: Monitor inbound-to-outbound byte ratios (resp_bytes/orig_bytes) and unique-peer counts
    per host from [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html). Alert on sustained
    inversions — for example a file server that normally receives data now bulk-uploading, or a database
    normally queried by a few app servers now talking to many new peers — or on peer-count growth beyond
    the host''s historical range observed in baselines like the [Unified Host and Network Data Set, Turcotte
    et al](https://arxiv.org/abs/1708.07518). Directional inversion is a strong exfiltration indicator,
    and peer-diversity growth can reveal lateral movement or a host repurposed as a pivot/distribution
    point, both of which violate the intended exchange design. The alert should name the specific changed
    ratio and the new peers so an analyst can triage quickly.'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - Windows Sysmon Event ID 3
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source = Zeek conn.log

      | stats sum(resp_bytes) as in, sum(orig_bytes) as out, distinct_count(dst_ip) as peers by src_ip,
      day

      | eval ratio = in/out

      | join host_baseline on src_ip

      | where sign(ratio) inverted vs baseline OR peers > baseline_peers_max

      | alert "directional / peer-diversity drift", list(new_peers)'
- question: Has a previously irregular channel become machine-like periodic (possible covert exchange),
    or has an expected scheduled flow lost its periodicity (possible disruption or tampering)?
  context: 'Model: Many legitimate machine-to-machine exchanges are strongly periodic, so characterize
    the expected cadence per channel ([Modeling and Characterization of Periodic Traffic, Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf))
    and apply discrete-Fourier-transform beaconing analysis over connection inter-arrival times and data-size
    consistency, as implemented in [RITA](https://github.com/activecm/rita). Alert when a previously irregular
    channel becomes machine-like periodic — a hallmark of C2 beaconing or covert data exchange — or when
    an expected scheduled flow loses its period, which can indicate service disruption or tampering with
    a legitimate exchange. Both outcomes mean the observed cadence no longer matches the intended design
    of the data exchange.'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - Windows Sysmon Event ID 3
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nsource = Zeek conn.log\n| group by (src_ip, dst_ip, dst_port)\n| collect inter_arrival_times,\
      \ byte_sizes\n| FFT(inter_arrival_times) -> dominant_frequency, periodicity_score\n| where (periodicity_score\
      \ high AND channel previously irregular)\n     OR (periodicity_score lost AND channel previously\
      \ scheduled)\n| alert \"cadence/periodicity change\""
- question: Has the single-flow time-series signature of a channel shifted away from its expected traffic
    class (for example a DB-replication channel now resembling interactive shell or bulk file transfer)?
  context: 'Model: Fingerprint each per-flow time series — packet sizes, inter-arrival times, and directionality
    over time — using the ~69 single-flow time-series (SFTS) features of [Classification of Network Traffic
    Based on Single Flow Time Series, Koumar et al](https://github.com/koumajos/ClassificationBasedOnSFTS)
    (dataset: https://zenodo.org/records/8035724), then alert when a channel''s signature shifts away
    from its expected traffic class. For instance, a database-replication channel whose flow signature
    begins to look like an interactive shell or bulk file transfer indicates the exchange no longer matches
    its intended design, even if the source, destination, and port are unchanged. This catches protocol
    tunneling and application-layer abuse that allow-list matching alone would miss.'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - Windows Sysmon Event ID 3
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '>-

      for each flow: extract ~69 SFTS features (pkt sizes, IAT, directionality)

      | classify -> traffic_class

      | join expected_class on channel

      | where traffic_class != expected_class

      | alert "flow signature shifted from expected traffic class"'
- question: Which hosts have migrated between behavioral communication clusters, indicating an unplanned
    change in their architectural role?
  context: 'Model: Vectorize each host with features such as peer count, destination-port entropy, directionality,
    failure ratio, and average volume, then apply an ensemble of unsupervised detectors (PCA, K-Means/DBSCAN,
    Median Absolute Deviation) over Host Communication Graphs, as in [An Unsupervised Multi-Detector Approach,
    Bohara et al](https://doi.org/10.1109/SRDS.2017.31). Flag hosts that migrate between behavioral clusters
    as unplanned role changes — a workstation that starts behaving like a server, or a server that starts
    behaving like a scanner, signals deviation from intended design and possible compromise. Alert text
    must list the top-3 features driving the cluster shift so analysts understand what changed.'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - Windows Sysmon Event ID 3
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '>-

      build host feature vectors [peer_count, dport_entropy, directionality, failure_ratio, avg_volume]

      | ensemble(PCA, KMeans/DBSCAN, MAD) over Host Communication Graph

      | compare cluster assignment vs prior period

      | where cluster_changed

      | alert "host role change", top3_features'
- question: Are there first-time or low-probability source-destination edges in the data-exchange graph
    that violate the modeled normal design?
  context: 'Model: Learn the organization''s normal data-exchange graph with unsupervised GNN embeddings
    ([CyberGraph, Bowman et al](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf))
    and temporal link prediction ([Euler, King and Huang](https://www2.seas.gwu.edu/~howie/publications/Euler-NDSS22.pdf);
    code https://github.com/iHeartGraph/Euler), then alert on first-time or low-probability source-destination
    edges that violate the modeled design. For host and data-handling provenance, inductive node embeddings
    ([ThreaTrace, Wang et al](https://arxiv.org/pdf/2111.04333)) generalize to unseen nodes. A newly appearing
    or improbable edge between critical systems is a strong indicator of lateral movement or an unauthorized
    exchange path. Surface the contributing peers/edges in the alert, and keep these probabilistic scores
    layered in parallel with the deterministic allow-list rather than as a replacement.'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - Windows Sysmon Event ID 3
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '>-

      train GNN embeddings on historical exchange graph (nodes=hosts, edges=flows)

      | temporal link prediction (Euler) -> P(edge) per new flow

      | where edge is first-time OR P(edge) < threshold

      | alert "improbable new edge", contributing_peers'
- question: Which communication channels show real-time deviations in bandwidth, packet rate, or jitter
    according to an online unsupervised autoencoder, and which features drive the anomaly?
  context: 'Model: Run an unsupervised online autoencoder ensemble (KitNET / [Kitsune, Mirsky et al](https://arxiv.org/abs/1802.09089);
    code https://github.com/ymirsky/Kitsune-py) with incremental per-channel statistics of bandwidth,
    packet rate, and jitter to score real-time deviations in channel volume and rate without labels. Because
    it is online and label-free, it complements the batch statistical baselines by catching emerging deviations
    as they happen. Emit the top-3 features by reconstruction-error contribution in each alert so analysts
    can immediately triage which aspect of the exchange changed. High reconstruction error on a critical-system
    channel warrants investigation against the intended design; low error confirms the channel is behaving
    normally.'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - Windows Sysmon Event ID 3
  - 'NAI: Core network switches, servers hosting critical applications (e.g., databases, file servers),
    and Domain Controllers.'
  range: Last 90 days (online/streaming scoring)
  queries:
  - technology: ML/pseudocode
    query: '>-

      stream per-channel stats [bandwidth, packet_rate, jitter]

      | KitNET online autoencoder ensemble -> reconstruction_error (RMSE)

      | where RMSE > adaptive_threshold

      | alert "online channel anomaly", top3_features_by_recon_error'
