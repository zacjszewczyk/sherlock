name: 'D3-LFP: Local File Permissions'
id: 048727f8-c886-4ae4-8693-9b5a9d64e6e4
description: 'This playbook helps an analyst assess whether local file permissions are configured to prevent
  unauthorized access to sensitive data, and to detect attempts to weaken or abuse those permissions.
  It guides investigation of file ACL telemetry that reveals potentially unsafe states: broad write or
  full-control grants to non-specific principals (Everyone, Authenticated Users, Domain Users), weaponizable
  ACE grants (WriteDACL, WriteOwner, GenericAll/GenericWrite) and inheritance changes, file ownership
  changes, execution of permission-modifying utilities (icacls, takeown, Set-Acl, chmod/chown/chattr/setfacl),
  and ACL structures that diverge from hardened least-privilege baselines for sensitive repositories.
  It combines symbolic-logic rules, statistical baselining and drift/peer analysis, and machine-learning
  outlier and provenance-graph detection to surface adversaries modifying permissions for stealthy persistence,
  privilege escalation, or data access across Windows, Linux, and macOS endpoints.'
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Were write (WD/AD) or full-control (FA/GA) rights granted to broad, non-specific principals
    such as Everyone (S-1-1-0), Authenticated Users (S-1-5-11), Domain Users, or Users on any protected
    file or directory, or did a Linux chmod grant world-write/exec (e.g. 0777/0666) on a sensitive file?
  context: Granting broad principals write or full-control over sensitive repositories is one of the fastest
    ways to expose PII/PHI, source code, or domain controller data to unauthorized access, supporting
    the Isolate objective of confining sensitive data behind least-privilege ACLs. Parse the Original
    and New SDDL security descriptor in Windows Event ID 4670 and compare the ACE sets to find newly added
    grants of WD/AD (write) or FA/GA (full/generic control) to the broad SIDs above on protected paths.
    On Linux, inspect auditd chmod records for modes ending in 2, 6, or 7 (world-writable/executable).
    A positive result means a control was just loosened; escalate immediately with a before/after ACL
    diff and the modifying identity, then verify whether the change was authorized. A negative result
    across the window suggests broad-grant exposure is not currently being introduced (maps to T1222).
  answer_sources: &id001
  - Windows Event ID 4670
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Windows Event ID 4688 / Sysmon Event ID 1 (Process Creation)
  - Linux auditd PATH/SYSCALL (chmod/chown/chattr, setfacl)
  - 'NAI: File servers containing PII/PHI, Domain Controllers, Source code repositories, Endpoints of
    privileged users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog EventID=4670 ObjectName IN (protected_paths)\n| parse_sddl(OldSd) as old_aces,\
      \ parse_sddl(NewSd) as new_aces\n| added = new_aces - old_aces\n| where any(added.principal IN [\"\
      S-1-1-0\",\"S-1-5-11\",\"Domain Users\",\"Users\"]\n           and added.rights MATCHES /WD|AD|FA|GA/)\n\
      | emit alert(severity=high, actor=SubjectUserName, diff=old_aces->new_aces)"
  - technology: auditd/pseudocode
    query: 'type=SYSCALL comm=chmod OR comm=chmod-equiv key=perm_change

      | join PATH where name IN (sensitive_files)

      | where mode_octal matches /[2367]$/   # world write/exec

      | emit alert(actor=auid, file=name, mode=mode_octal)'
- question: Did any permission change add explicit ACEs granting WriteDACL, WriteOwner, GenericAll, or
    GenericWrite, or disable ACL inheritance, on a sensitive directory, performed by a principal outside
    approved admin groups?
  context: 'WriteDACL, WriteOwner, GenericAll, and GenericWrite are weaponizable rights: they let an actor
    rewrite the object''s DACL or seize ownership, enabling stealthy persistence and privilege escalation
    while looking like a benign ACL edit. Disabling inheritance can quietly strip protective parent ACLs.
    For the Isolate tactic this directly undermines the boundary intended to keep sensitive data isolated.
    Trigger on Event ID 4670 records whose New SDDL adds these ACE rights, or that clear the inheritance
    flag, when the actor is not a member of an approved admin group (per CIS Control 6). A positive hit
    is high fidelity; correlate with nearby Event ID 4656/4663 within the same window to determine whether
    the change was immediately followed by data access (which would indicate active abuse rather than
    misconfiguration).'
  answer_sources: *id001
  range: Last 90 days; correlate +/- 1 hour around the change event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog EventID=4670 ObjectName IN (sensitive_dirs)\n| added = parse_sddl(NewSd)\
      \ - parse_sddl(OldSd)\n| where (added.rights MATCHES /WDAC|WO|GA|GW/   # WriteDACL,WriteOwner,GenericAll,GenericWrite\n\
      \         OR inheritance_disabled(OldSd,NewSd))\n      AND SubjectUserSid NOT IN approved_admin_sids\n\
      | join (EventID IN (4656,4663)) on ObjectName within 1h\n| emit alert(severity=high, followed_by_access=joined)"
- question: Did file ownership change to a non-admin user account, especially on system files or shared
    resources, and was takeown.exe or icacls /setowner executed nearby?
  context: Ownership confers the implicit ability to rewrite an object's ACL, so attackers frequently
    take ownership of a file or directory before modifying its permissions to bypass existing controls.
    An ownership change to a non-admin account on system files or shared resources is abnormal and supports
    the Isolate objective by signalling an attempt to break the access boundary. Detect the owner-field
    delta between Original and New SDDL in Windows Event ID 4670, and Linux chown events via auditd. Treat
    execution of takeown.exe or 'icacls /setowner' as corroborating process evidence. A positive result
    warrants checking whether an ACL rewrite or sensitive read followed (maps to T1222); a negative result
    indicates ownership of protected objects remains stable.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog EventID=4670 ObjectName IN (system_files, shared_resources)\n| where owner(NewSd)\
      \ != owner(OldSd) AND owner(NewSd) NOT IN admin_sids\n| union (EventID IN (4688,1) Image IN [\"\
      takeown.exe\",\"icacls.exe\"]\n         CommandLine MATCHES /setowner/)\n| emit alert(actor=SubjectUserName,\
      \ old_owner=owner(OldSd), new_owner=owner(NewSd))"
  - technology: auditd/pseudocode
    query: 'type=SYSCALL comm=chown key=owner_change

      | join PATH where name IN (system_files, shared_resources)

      | where new_owner NOT IN admin_uids

      | emit alert(actor=auid, file=name)'
- question: Was any permission-changing utility executed (icacls/cacls with /grant or /setowner, PowerShell
    Set-Acl, takeown, attrib, or chmod/chown/chattr/setfacl), particularly by service or non-admin accounts,
    against sensitive paths, or with recursive flags?
  context: Permission changes are often made with command-line utilities, and their execution is a direct,
    observable signal of intent to alter access control. Monitoring process-creation telemetry (Windows
    Event ID 4688 / Sysmon Event ID 1; Linux auditd execve) for these utilities lets you catch permission
    tampering even when object-level ACL auditing is incomplete. For the Isolate tactic, recursive operations
    (/T, -R) are especially dangerous because they can flatten permissions across an entire sensitive
    tree at once. Prioritize invocations by service or non-admin accounts, those targeting sensitive paths,
    and those using recursive flags. A positive result should be cross-checked against change-management
    and the resulting ACL state (maps to T1222).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog EventID IN (4688,1)\n| where (Image IN [\"icacls.exe\",\"cacls.exe\",\"\
      takeown.exe\",\"attrib.exe\"]\n         OR CommandLine MATCHES /Set-Acl/)\n      AND (CommandLine\
      \ MATCHES /\\/grant|\\/setowner/ OR Image MATCHES /takeown/)\n| set risk = high if (SubjectUser\
      \ IN service_or_nonadmin\n                      OR CommandLine MATCHES /\\/T|-R/\n             \
      \         OR TargetPath IN sensitive_paths)\n| emit alert(cmd=CommandLine, actor=SubjectUserName,\
      \ risk)"
  - technology: auditd/pseudocode
    query: 'type=EXECVE exe IN ["/bin/chmod","/bin/chown","/usr/bin/chattr","/usr/bin/setfacl"]

      | set risk=high if (auid IN nonadmin OR args MATCHES /-R/ OR target IN sensitive_paths)

      | emit alert(cmd=args, actor=auid, risk)'
- question: After a permission change on a protected object, did the newly granted principal access that
    object within a short window, and are there bursts of access-denied results or failed permission-change
    attempts indicating probing for weak ACLs?
  context: 'A permission change is most meaningful when it is immediately exercised. Correlating a 4670
    change on a protected object with subsequent Event ID 4663 access attempts by the granted/new principal
    within roughly one hour distinguishes opportunistic abuse from benign administration, reinforcing
    the Isolate goal of detecting boundary violations in progress. Separately, profiling the failure state
    - bursts of 4663/4656 access-denied results or failed permission-change attempts - reveals reconnaissance:
    an actor probing many objects to find weak ACLs. A positive correlation (change then access by same
    new principal) is strong evidence of intentional access; a burst of denials is a distinct early-warning
    signal even when no change succeeds.'
  answer_sources: *id001
  range: Last 90 days; event-centered correlation window of 1 hour after each 4670 change
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'changes = search EventID=4670 ObjectName IN protected_objects

      | granted_principal = added_ace_principal(changes)

      access = search EventID=4663 within 1h after each change

      | join changes on ObjectName where access.SubjectUserSid == granted_principal

      | emit alert(type="change_then_access", object=ObjectName, principal=granted_principal)'
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog EventID IN (4663,4656) result=access_denied

      | bin time span=10m | stats count by SubjectUserName, bin

      | where count > denial_burst_threshold

      | emit alert(type="acl_probing", actor=SubjectUserName, denials=count)'
- question: Does any administrator's volume or timing of ACL changes deviate sharply from their own 90-day
    baseline or from their peer group - for example a modified Z-score above 3.5 or off-hours change counts
    above the per-entity 99th percentile?
  context: Legitimate administrators have stable, learnable patterns of how many ACL changes they make,
    on which hosts, and at what times. Fixed thresholds are brittle, so model the 90-day distribution
    of ACL changes per administrator, host, and time window and use robust median/MAD scoring (modified
    Z-score) rather than mean/stddev. Alert when the modified Z-score exceeds 3.5 or when off-hours change
    counts exceed the per-entity 99th percentile, and enrich with peer-group comparison to flag admins
    deviating from peers. For the Isolate tactic, a spike in permission changes - especially off-hours
    - can indicate a compromised admin account loosening controls at scale. Derive thresholds from each
    environment's own history to minimize false positives.
  answer_sources: *id001
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog EventID=4670

      | stats count as changes by SubjectUserName, host, hour, day over 90d

      | per SubjectUserName: med=median(changes), mad=mad(changes)

      | mz = 0.6745*(changes-med)/mad

      | where mz > 3.5 OR (is_offhours(hour) AND changes > p99(changes))

      | enrich peer_group_deviation(SubjectUserName)

      | emit alert(actor=SubjectUserName, modified_zscore=mz)'
- question: How far have current ACLs on sensitive repositories drifted from their least-privilege gold
    baselines - measured by principal overlap, added-principal count, and rights-weight delta - and which
    objects exceed the drift threshold?
  context: Over time, ACLs accrete extra principals and elevated rights through routine changes, eroding
    the least-privilege posture the Isolate tactic depends on. Compare each sensitive object's current
    ACL to a repository-specific gold baseline built on NIST 800-53 AC-6 (least privilege) and CM-6 (baseline
    configuration) for data classified per CIS Control 3. Compute a drift score from principal overlap,
    the count of added principals, and a rights-weight delta (weighting FullControl > Write > Read), then
    flag objects above threshold. Reporting Volume (the count of excess principals or rights) makes triage
    quantitative rather than stylistic. A high drift score points to objects whose permissions should
    be remediated back to baseline; near-zero drift confirms the repository remains hardened.
  answer_sources: *id001
  range: Last 90 days (point-in-time ACL snapshot vs. baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for object in sensitive_repositories:\n  cur = current_acl(object); base = gold_baseline(object)\
      \  # AC-6 / CM-6\n  added_principals = cur.principals - base.principals\n  overlap = jaccard(cur.principals,\
      \ base.principals)\n  rights_weight = sum(weight(r) for r in cur.rights) - sum(weight(r) for r in\
      \ base.rights)\n    # weight: FullControl=3, Write=2, Read=1\n  drift = f(len(added_principals),\
      \ 1-overlap, rights_weight)\n| where drift > drift_threshold\n| emit report(object, drift, volume=len(added_principals))"
- question: Which files have permission grants inconsistent with otherwise-uniform peer groups - that
    is, single objects that are over-permissioned relative to similar files - ranked by the number of
    inconsistent (user, right) cells?
  context: Many over-permissioning problems are invisible to fixed rules because the granted right is
    individually plausible; what makes it suspicious is that it deviates from peers. Build a user x resource
    permission matrix and apply group-mapping / object-clustering (the Baaz approach) to surface files
    whose grants are inconsistent with otherwise-uniform peer groups, ranking deviations by the number
    of inconsistent (user, right) cells. This supports the Isolate tactic by catching the single mis-permissioned
    object that exposes sensitive data among thousands of correctly configured ones. Validate detector
    tuning against labeled scenarios in the CERT Insider Threat Test Dataset. A high-ranking deviation
    is a candidate misconfiguration or deliberate backdoor for review.
  answer_sources: *id001
  range: Last 90 days (permission-matrix snapshot)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "M = build_matrix(rows=users, cols=resources, cells=rights)\ngroups = cluster_objects(M)  #\
      \ Baaz group-mapping\nfor object in resources:\n  peer = groups[object]\n  inconsistent = {(u,r)\
      \ in M[object] if (u,r) not in mode(peer)}\n| rank by len(inconsistent) desc\n| emit report(object,\
      \ inconsistent_cells=len(inconsistent))"
- question: When ACL principal-right structures are vectorized and scored with an unsupervised outlier
    detector (Isolation Forest or One-Class SVM), which files or principals diverge from their same-data-class
    peers, and what features explain the anomaly?
  context: Latent over-permissioning often has no single obvious indicator but emerges from the overall
    shape of an ACL relative to its peers. Periodically vectorize ACL features - per-principal rights
    bitmask, inheritance flags, owner SID class, path/data-class - and score them with Isolation Forest
    or One-Class SVM, using LIME to surface the top-3 contributing features in the alert text so analysts
    can act on it. Investigating files and principals that diverge from same-data-class peers helps find
    over-permissioning that rules and simple stats miss, strengthening the Isolate boundary. OCSVM is
    preferred where robustness to training-data poisoning matters. Each flagged outlier should be triaged
    against the expected access model for that data class.
  answer_sources: *id001
  range: Last 90 days (periodic ACL vectorization)
  queries:
  - technology: ML/pseudocode
    query: "X = vectorize_acls(features=[rights_bitmask, inheritance_flags, owner_sid_class, data_class])\n\
      model = IsolationForest().fit(X)   # or OneClassSVM for poisoning robustness\nscores = model.decision_function(X)\n\
      for f in where(scores < anomaly_cutoff):\n  top3 = LIME(model, f).top_features(3)\n  emit alert(object=f.path,\
      \ principal=f.principal, score, explanation=top3)"
- question: Do whole-system provenance graphs reveal multi-step permission-abuse chains - for example
    ownership change -> ACL rewrite -> sensitive read - that a temporal graph model flags as anomalous?
  context: Sophisticated actors execute permission abuse as a chain of small, individually-benign steps.
    Modeling whole-system provenance (process -> file -> ACL-change -> access) with a temporal graph autoencoder
    (KAIROS) lets you detect and reconstruct these multi-step chains, and self-supervised masked graph
    representation learning (MAGIC) flags anomalous file/permission interactions without labels while
    adapting to drift. This is the strongest support for the Isolate tactic against advanced adversaries
    because it links the takeover, the ACL rewrite, and the eventual sensitive read into one detectable
    narrative. Surface the contributing nodes and edges with each alert for explainability so analysts
    can confirm the chain and scope the incident.
  answer_sources: *id001
  range: Last 90 days (continuous provenance ingestion)
  queries:
  - technology: ML/pseudocode
    query: "G = build_provenance_graph(events: process->file->acl_change->access)\nmodel = TemporalGraphAutoencoder()\
      \   # KAIROS; or MAGIC masked-graph self-supervised\nanomaly = model.reconstruction_error(G)\nchains\
      \ = reconstruct_paths(G, where anomaly > tau,\n                           pattern=\"ownership_change\
      \ -> acl_rewrite -> sensitive_read\")\n| emit alert(chain=chains, nodes_edges=contributing_subgraph)"
