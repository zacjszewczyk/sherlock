questions:
- question: When a service is installed or its configuration changes (Windows Event ID 7045/7040) or a
    service-binary file is written (Sysmon Event ID 11), does the SHA256 hash of the ImagePath binary
    match the curated 'golden image' allowlist of approved service hashes, and can every observed change
    be reconciled against an approved change record?
  context: 'In the Detect context, adversaries achieve persistence and defense evasion by replacing or
    modifying the executable that backs an existing or newly created service. Comparing the on-disk SHA256
    of each service''s ImagePath against an authoritative golden-image baseline ([CAR-2014-02-001: Service
    Binary Modifications](https://car.mitre.org/analytics/CAR-2014-02-001/)) deterministically surfaces
    any binary that does not match a known-good hash or that is not present in the baseline at all. The
    baseline itself must be protected and managed per [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf)
    configuration-management controls, because if the source of truth is corrupted the check is meaningless.
    A hash mismatch or an un-baselined service hash is a strong positive signal; service binaries legitimately
    change during OS or software updates, so reconcile every expected change against approved change/patch
    records to suppress benign updates. A clean match against the baseline is a negative result.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON (EventID==7045 OR EventID==7040 OR (source==Sysmon AND EventID==11))\n  let h = sha256(ImagePath_binary)\n\
      \  if h NOT IN golden_image_hash_allowlist\n     AND change_record_lookup(host, service_name, h)\
      \ == none\n  then ALERT 'Service binary hash mismatch / un-baselined service'\n       fields=host,\
      \ service_name, ImagePath, h"
- question: For every running or installed service binary, does the Authenticode signature validate cleanly,
    or does it fail with a specific, named defect such as an unsigned image, a broken signature chain,
    an expired or revoked certificate, a hash/certificate mismatch, or an unknown/untrusted publisher
    — especially for binaries located in system directories?
  context: 'Supporting Detect, signature validation is a deterministic integrity check that complements
    hashing. Using Sysmon Event ID 1/6/7 signature status, verify the Authenticode signature of each service
    binary and alert on unsigned binaries, invalid or broken signature chains, expired or revoked certificates,
    hash-to-certificate mismatches, and unknown or untrusted publishers. Critically, ''signed'' must not
    be equated with ''trusted'': research on [Certified Malware (Kim, Kwon & Dumitras, CCS 2017)](https://users.umiacs.umd.edu/~tdumitra/papers/CCS-2017.pdf)
    shows malformed, expired, revoked, and stolen-key signatures routinely bypass naive checks. Always
    name the specific failure (e.g., ''revoked cert'', ''unknown CA'') in the alert so the analyst can
    triage. A failure in a system directory is high priority; a valid, trusted publisher chain is a negative
    result but does not by itself clear a hash mismatch.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON (source==Sysmon AND EventID IN (1,6,7))\n  s = signature_status(Image)\n  if s IN ('Unsigned','Invalid','Expired','Revoked','HashMismatch')\n\
      \     OR publisher NOT IN trusted_publishers\n  then ALERT 'Service signature failure: ' + s + '\
      \ / ' + publisher\n       priority = (Image LIKE '%\\\\System32\\\\%') ? HIGH : MED"
- question: Does a newly installed service (Windows Event ID 7045) point to an ImagePath outside the set
    of approved service-binary directories — for example \AppData\, %TEMP%, user-writable folders, or
    UNC paths to 127.0.0.1/localhost — and is that path absent from the approved vendor allowlist?
  context: For Detect, legitimate services almost always run from a small set of protected, system-owned
    directories. Adversaries frequently register services whose binaries live in user-writable or temporary
    locations because they cannot or will not place files in protected paths. Following the deterministic
    pattern in the [Service Installation in Suspicious Folder Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/system/service_control_manager/win_system_susp_service_installation_folder.yml),
    alert when a new service's ImagePath resolves outside approved directories. Maintain an explicit benign-filter
    allowlist of approved vendor service paths to suppress known false positives. A service binary in
    %TEMP% or \AppData\ is a strong positive; a path within an approved vendor directory is a negative
    result.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON (EventID==7045)\n  p = normalize_path(ImagePath)\n  if p MATCHES ('*\\\\AppData\\\\*','*\\\
      \\Temp\\\\*','\\\\\\\\127.0.0.1\\\\*','\\\\\\\\localhost\\\\*', user_writable_dirs)\n     AND p\
      \ NOT IN approved_vendor_service_paths\n  then ALERT 'Service installed from suspicious folder'\n\
      \       fields=host, ServiceName, ImagePath"
- question: For kernel-mode services, does the loaded driver image name or hash (Sysmon Event ID 6) match
    the known-vulnerable/abusable driver deny-list (LOLDrivers), even when the driver carries a valid
    digital signature?
  context: 'In the Detect phase, adversaries load legitimately-signed but vulnerable drivers (bring-your-own-vulnerable-driver)
    to gain kernel execution and disable defenses. Following the [Vulnerable Driver Load By Name Sigma
    rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/driver_load/driver_load_win_vuln_drivers_names.yml)
    and the LOLDrivers project, match each loaded driver''s image name and hash (Sysmon Event ID 6) against
    the deny-list. Binary identity (hash/name) overrides signature trust here: alert even when the driver
    is validly signed, because the signature is real but the driver is abusable. Ensure first-party Sysmon
    coverage (e.g., [SwiftOnSecurity Sysmon configuration](https://github.com/SwiftOnSecurity/sysmon-config))
    so driver loads are actually captured. A deny-list match is a strong positive regardless of signature.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON (source==Sysmon AND EventID==6)\n  if (ImageLoaded_name IN vuln_driver_denylist_names)\n\
      \     OR (sha256(ImageLoaded) IN vuln_driver_denylist_hashes)\n  then ALERT 'Known-vulnerable driver\
      \ loaded (BYOVD)'\n       fields=host, ImageLoaded, Signed, Signature, sha256"
- question: Per host, does the count of new service installations (Windows Event ID 7045) or service-binary
    modifications (Sysmon Event ID 11) in an interval exceed the historical baseline (mean + k*sigma,
    starting at k=3), and is any single un-baselined service install present regardless of frequency?
  context: For Detect, a sudden surge in service installs or binary modifications on a host can indicate
    adversary persistence or lateral movement, while critical infrastructure hosts normally see very few
    service changes. Build per-host historical baselines (mean and standard deviation) of new service
    installs and binary modifications per interval and alert when an observation exceeds mean + k*sigma,
    starting with k=3 and deriving a dataset-specific k from each host role's distribution ([Finding Anomalies
    in Windows Event Logs Using Standard Deviation (Dwyer & Truta)](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
    Surface the observed count, baseline mean, and sigma in the alert. Always retain the deterministic
    rule of alerting on ANY single un-baselined service install regardless of frequency, so a low-and-slow
    single install is not lost. A spike above threshold or a novel service is a positive.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM events WHERE EventID==7045 OR (source==Sysmon AND EventID==11)\n  BIN by host, interval=1h\
      \  -> count c\n  JOIN baseline(host) -> mean mu, stddev sigma\n  ALERT if c > mu + 3*sigma  -> emit\
      \ c, mu, sigma\n  ALSO ALERT if service_hash NOT IN baseline (any single install)"
- question: Does a service binary's section or whole-file Shannon entropy exceed a packing threshold (commonly
    >7.0 on a 0-8 scale) or deviate from that service's historical entropy baseline by more than 3 standard
    deviations, indicating packing or encryption of a modified binary?
  context: Supporting Detect, packed or encrypted payloads exhibit high byte entropy. Compute section
    and whole-file Shannon entropy for each service binary and alert when entropy exceeds a packing threshold
    (commonly >7.0/8.0) OR deviates from that service's known-good baseline by more than 3 standard deviations.
    Section/file entropy is among the strongest packing discriminators ([Analysis of Machine Learning
    Approaches to Packing Detection (Bertrand Van Ouytsel et al.)](https://arxiv.org/pdf/2105.00473)),
    and the byte-entropy-histogram features in [EMBER (Anderson & Roth)](https://arxiv.org/abs/1804.04637)
    formalize the distribution to compare against a known-good profile. Derive the exact threshold from
    your own benign service-binary corpus to control false positives (some legitimate compressed/encrypted
    resources are high entropy). High or anomalous entropy on a service binary is a positive worth correlating
    with hash/signature failures.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each service_binary write/observation\n  e = shannon_entropy(file); e_sec = max(section_entropy(file))\n\
      \  JOIN baseline(service) -> mu_e, sigma_e\n  ALERT if e > 7.0 OR e_sec > 7.0\n        OR e > mu_e\
      \ + 3*sigma_e  -> emit e, e_sec, mu_e, sigma_e"
- question: Per host, has the rate of unsigned, invalid, expired, or revoked service-binary signatures
    (Sysmon Event ID 7) increased to a statistically significant degree above the established baseline?
  context: In Detect, treating signature/integrity FAILURES as a first-class, continuously monitored metric
    catches campaigns that rely on malformed or stolen-key signatures. Baseline the per-host rate of unsigned,
    invalid, expired, and revoked service-binary signatures (Sysmon Event ID 7) and alert on statistically
    significant increases, motivated by the abuse patterns measured in [Certified Malware (Kim et al.)](https://users.umiacs.umd.edu/~tdumitra/papers/CCS-2017.pdf).
    Track baseline-deviation counts as the continuous-monitoring metric prescribed by [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf).
    A meaningful uptick in failure rate on a host that normally has zero or near-zero failures is a positive
    that should drive deeper per-binary inspection.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM events WHERE source==Sysmon AND EventID==7\n  WHERE signature_status IN ('Unsigned','Invalid','Expired','Revoked')\n\
      \  BIN by host, interval=1d -> fail_count f\n  JOIN baseline(host) -> mu_f, sigma_f\n  ALERT if\
      \ f > mu_f + 3*sigma_f -> emit f, mu_f, sigma_f"
- question: Does a gradient-boosted classifier trained on static PE features (byte and byte-entropy histograms,
    section info, imports/exports, headers) score a new or changed service binary as malicious, and what
    are the top contributing features driving that score?
  context: As a parallel triage layer for Detect, score each new or changed service binary with a gradient-boosted
    classifier trained on static PE features using the [EMBER dataset and LightGBM baseline (Anderson
    & Roth)](https://arxiv.org/abs/1804.04637) ([code](https://github.com/elastic/ember)); feature/algorithm
    guidance from [Bertrand Van Ouytsel et al.](https://arxiv.org/pdf/2105.00473) informs feature selection.
    Surface the top-3 contributing features (e.g., high section entropy, suspicious imports, missing version
    info) in the alert so analysts understand the score. The deterministic hash/signature checks remain
    the authoritative floor — use the ML score only to prioritize and triage, never as a replacement.
    A high malicious probability on a freshly written service binary warrants escalation and correlation
    with the deterministic checks.
  answer_sources:
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: "FOR each new/changed service_binary\n  feats = extract_pe_features(file)  # EMBER feature\
      \ set\n  score = lightgbm_model.predict(feats)\n  if score >= threshold\n  then ALERT 'Service binary\
      \ classified malicious'\n       emit score, top3_shap(feats), host, ImagePath"
- question: Does a graph-based provenance model flag the causal chain that produced a service binary —
    which process downloaded it, wrote it, its parentage, and the subsequent service start — as anomalous,
    and which nodes/edges in the download->write->service-start chain contribute to the score?
  context: 'For Detect, scoring the causal context of a service-binary write rather than the artifact
    alone catches tampering even when the binary itself looks clean. Model whole-system provenance graphs:
    [MAGIC (Jia et al., USENIX Security 2024)](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf)
    ([code](https://github.com/FDUDSDE/MAGIC)) uses masked graph representation learning with concept-drift
    handling; [ThreaTrace (Wang et al., IEEE TIFS 2022)](https://arxiv.org/pdf/2111.04333) ([code](https://github.com/threaTrace-detector/threaTrace))
    is an inductive GraphSAGE GNN that localizes the anomalous node (the tampered binary or the writing
    process) without prior attack knowledge; and [KAIROS (Cheng et al., IEEE S&P 2024)](https://tfjmp.org/publications/2024-sp.pdf)
    ([code](https://github.com/ProvenanceAnalytics/kairos)) emits a compact attack-reconstruction graph
    of the download->write->service-start chain. Present the contributing nodes and edges in the alert
    so the analyst can triage the causal path. An anomalous provenance chain ending in a service start
    is a strong lead even when hash and signature checks pass.'
  answer_sources:
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Sysmon Event ID 7
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Application Servers, Web Servers, and other critical infrastructure hosts.'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: "BUILD provenance_graph from (Sysmon 1 process, 11 file-write, 7045 service-create, 4688)\n\
      \  nodes=processes,files,services ; edges=wrote,spawned,started\n  score = gnn_anomaly(graph)  #\
      \ ThreaTrace / MAGIC / KAIROS\n  if anomalous_node detected on download->write->service-start path\n\
      \  then ALERT emit anomalous_nodes, edges, reconstructed_subgraph"
