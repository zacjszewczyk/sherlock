name: 'D3-SBV: Service Binary Verification'
id: a1c8d7f5-2a2d-4ab2-926e-8f22836c297d
description: Investigate the integrity of service binaries to detect unauthorized modifications used by
  adversaries for persistence and defense evasion. This playbook helps an analyst verify that service
  executables on disk match a trusted source of truth and have not been tampered with. It covers deterministic
  checks (comparing the cryptographic hash of a service's ImagePath binary against a curated golden-image
  baseline, validating Authenticode digital signatures and certificate chains, allowlisting approved service-binary
  directories, and deny-listing known-vulnerable kernel drivers), statistical anomaly detection (baselining
  service-install/modification volume and frequency, monitoring binary entropy for packing, and tracking
  signature-validation failure rates), and machine-learning approaches (static PE classification of service
  binaries and graph-based provenance scoring of the download->write->service-start chain). The deterministic
  hash/signature checks remain the authoritative floor; statistical and ML methods are parallel layers
  used to prioritize and triage. Focus is on Domain Controllers, application servers, web servers, and
  other critical infrastructure hosts.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
