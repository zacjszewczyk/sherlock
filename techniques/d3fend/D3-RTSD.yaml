questions:
- question: Are any remote terminal sessions on remote-access ports (22, 3389, 5985, 5986) originating
    from or destined to IP addresses that appear on known-malicious infrastructure lists?
  context: 'Supports the Detect tactic by giving a high-confidence, deterministic first-pass filter on
    remote interactive access. Correlate source/destination IPs observed in Zeek conn.log, ssh.log, and
    rdp.log on remote-access ports against curated threat-intelligence indicators (C2, scanner, bulletproof-hosting,
    TOR/anonymizer ranges). Run the logic on first-party network logs so detection still works when external
    lookups are unavailable, treating intel matches as enrichment rather than a dependency. A positive
    match against a session reaching a critical server is a strong indicator of external manual control
    and warrants immediate triage; a negative result does not clear the session and should be combined
    with the behavioral checks below. Reference: [CAR-2013-07-002 RDP Connection Detection](https://car.mitre.org/analytics/CAR-2013-07-002).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "sessions = read(conn.log, ssh.log, rdp.log) where dest_port in (22,3389,5985,5986)\nfor s\
      \ in sessions:\n  if s.src_ip in ThreatIntel.malicious or s.dst_ip in ThreatIntel.malicious:\n \
      \   alert(severity=HIGH, reason='remote-access session matches malicious infra', session=s)"
  - technology: Zeek/pseudocode
    query: "# enrich, do not depend on, intel\nconn |> filter id.resp_p in {22,3389,5985,5986}\n     |>\
      \ join intel_set on (id.orig_h, id.resp_h)\n     |> where intel_hit == true |> emit alert"
- question: Do any remote terminal sessions to Tier 0 or critical systems originate from jump hosts, geographies,
    or account-role combinations that are not on the approved-administrator baseline, even when the logon
    succeeds?
  context: 'Supports the Detect tactic by catching credential abuse and lateral movement that uses valid
    accounts. Baseline the approved source workstations/jump hosts, source geographies, and account-to-role
    mappings for each administrator, using Windows Event 4624 LogonType=10 (RemoteInteractive/RDP) and
    equivalent remote-logon telemetry. Alert when a successful remote terminal session to a Domain Controller
    or other Tier 0 asset comes from an unapproved source or an account operating outside its normal role/host
    pairing. A successful logon from an unexpected origin is exactly the signature of an adversary reusing
    stolen credentials; a match to the approved baseline lowers (but does not eliminate) suspicion. Reference:
    [CAR-2016-04-005 Remote Desktop Logon](https://car.mitre.org/analytics/CAR-2016-04-005/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "baseline = approved_admin_sources  # account -> {jump_hosts, geos, roles}\nfor e in EventID(4624)\
      \ where LogonType==10 and TargetAsset in Tier0:\n  if e.src_host not in baseline[e.account].jump_hosts\n\
      \     or geo(e.src_ip) not in baseline[e.account].geos\n     or e.account.role not in baseline[e.account].roles:\n\
      \    alert('unapproved admin source/account to Tier0 (logon succeeded)', e)"
- question: Are there interactive remote-console sessions running on non-standard ports that are not covered
    by an explicit, sanctioned policy allowlist?
  context: 'Supports the Detect tactic by surfacing surreptitious backdoors that deliberately avoid well-known
    ports. Identify interactive sessions by protocol-signature and traffic behavior regardless of port,
    then separate sanctioned administrative services (recorded in an explicit policy allowlist of host+port+service)
    from unlisted interactive services. Alert on any interactive service that is not on the allowlist.
    This implements the protocol-signature plus policy-component approach to backdoor detection. A hit
    on an unlisted port carrying keystroke-like interactive traffic is a strong unauthorized-access indicator;
    allowlisted services are expected administrative backdoors. Reference: [Detecting Backdoors](https://www.icir.org/vern/papers/backdoor/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "interactive = detect_interactive(conn)  # protocol-signature + small-packet behavior\nallow\
      \ = policy_allowlist  # {host, port, service}\nfor f in interactive:\n  if (f.resp_h, f.resp_p,\
      \ f.service) not in allow and f.resp_p not in standard_ports:\n    alert('interactive service on\
      \ non-standard port not in policy allowlist', f)"
- question: Which sources or accounts show abnormal rates of failed logons or firewall-blocked connections
    to remote-access ports, including burst attempts or low-and-slow probing, and were any followed by
    a successful session?
  context: 'Supports the Detect tactic by treating pre-compromise reconnaissance and brute-force/password-spray
    as a distinct early-warning signal. Track per-source and per-account rates of failed logons (Windows
    Event 4625, especially LogonType=10) and firewall-blocked connections to remote-access ports. Alert
    on bursts (e.g., >10 failed 4625 LogonType=10 from one source in 10 minutes) and on low-and-slow patterns
    exceeding a tuned threshold, and prioritize any blocked-then-successful or failed-then-successful
    sequence using edge-rarity context from authentication-graph analysis. A spike or a blocked-then-successful
    sequence indicates an attacker probing for remote access and possibly succeeding; isolated failures
    are likely benign mistakes. Reference: [Authentication graphs](https://doi.org/10.1016/j.cose.2014.09.001).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days; pivot to a tight window (10-minute buckets) around any successful logon for blocked-then-successful
    correlation
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# bursts\nfor (src,acct), grp in EventID(4625, LogonType=10).bucket(10min):\n  if count(grp)\
      \ > 10: alert('remote-access logon failure burst', src, acct)\n# low-and-slow\nif rolling_count(failed,\
      \ window=24h) > slow_threshold: alert('low-and-slow probing', src)\n# blocked-then-success\nfor\
      \ src in firewall_blocked(remote_ports):\n  if exists success(4624,LogonType=10, same src) within\
      \ 1h after block:\n    alert('blocked-then-successful remote logon', src)"
- question: Do any encrypted SSH/RDP/WinRM flows exhibit the physics of human keystroke typing, small
    single-keystroke-sized packets, request/echo pairing, and human inter-keystroke cadence, especially
    to servers not intended for interactive use?
  context: 'Supports the Detect tactic by detecting interactive control inside encrypted traffic without
    decryption. For each encrypted flow, compute the small-packet ratio (payloads near a single 8-byte-padded
    keystroke), the bidirectional request/echo pairing, and the inter-packet-gap variance. Flag flows
    dominated by small packets at human typing cadence (inter-arrival roughly 50-500 ms) heading to servers
    that should not host interactive sessions. Derive the cadence/size thresholds from 30+ days of per-server
    baselines. Interactive keystroke physics on a non-interactive destination strongly suggests hands-on-keyboard
    control of that host; bulk-transfer or automated flows will show a very different packet-size/timing
    profile. References: [Timing Analysis of Keystrokes and Timing Attacks on SSH](https://www.usenix.org/legacy/events/sec01/full_papers/song/song.pdf);
    [Detecting Backdoors](https://www.icir.org/vern/papers/backdoor/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days; baseline derived from 30+ days of per-server history
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for f in encrypted_flows(ssh,rdp,winrm):\n  small_ratio = pkts(payload<=baseline_keystroke_size)/total_pkts\n\
      \  echo_pairs  = bidir_request_echo_fraction(f)\n  gap_var     = variance(inter_packet_gaps(f))\n\
      \  median_gap  = median(inter_packet_gaps(f))\n  base = per_server_baseline[f.resp_h]  # 30+ days\n\
      \  if small_ratio > base.small_hi and 0.05s <= median_gap <= 0.5s and echo_pairs high\n     and\
      \ f.resp_h not in interactive_servers:\n    alert('keystroke-cadence interactive traffic to non-interactive\
      \ server', f)"
- question: Are there hosts where the ON/OFF (active-typing vs idle) timing structure of an inbound interactive
    session correlates with that of an outbound interactive session, indicating relayed control through
    a stepping stone?
  context: 'Supports the Detect tactic by exposing stepping-stone/relay chains used to obscure the true
    origin of remote control. Segment interactive flows into ON periods (active typing) and OFF periods
    (idle), then correlate the ON/OFF timing structure of inbound versus outbound sessions on the same
    host. A strong correlation indicates that traffic entering the host is being relayed out to another
    destination, i.e., the host is an intermediary in a manual remote-control chain, and this holds even
    under encryption because it relies on timing rather than content. Correlated ON/OFF pairs are a high-fidelity
    indicator of relayed interactive control; uncorrelated sessions are independent. Reference: [Detecting
    Stepping Stones](https://www.usenix.org/legacy/events/sec2000/full_papers/zhangstepping/zhangstepping.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days; correlate inbound/outbound sessions within overlapping time windows per host
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for host in hosts:\n  for (inb, outb) in pairs(inbound_interactive(host), outbound_interactive(host)):\n\
      \    on_off_in  = segment_on_off(inb)\n    on_off_out = segment_on_off(outb)\n    if correlation(on_off_in,\
      \ on_off_out) > corr_threshold:\n      alert('relayed/stepping-stone interactive control', host,\
      \ inb, outb)"
- question: Are any internal hosts producing connections with highly regular inter-arrival timing and
    consistent data sizes that look like automated keep-alive or check-in beaconing preceding interactive
    remote control?
  context: 'Supports the Detect tactic by catching the automated check-in channel that often precedes
    hands-on-keyboard activity. On Zeek conn.log flows, score inter-arrival-time regularity (coefficient
    of variation, dispersion) and the dominant period (via FFT/autocorrelation) together with data-size
    consistency. Flag low CV (e.g., <0.1) over many connections after suppressing known benign periodic
    services (update checks, monitoring agents, NTP). Beaconing with a tight period and uniform sizes
    is characteristic of implant keep-alive/C2 polling; high variance and varied sizes are typical of
    legitimate interactive or bulk traffic. References: [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    [Active Countermeasures RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (src,dst,port), conns in conn.log.group():\n  ia = inter_arrival_times(conns)\n  cv =\
      \ stdev(ia)/mean(ia)\n  period, power = dominant_period(fft/autocorr(ia))\n  size_consistency =\
      \ 1 - stdev(bytes)/mean(bytes)\n  if cv < 0.1 and len(conns) >= many and size_consistency high\n\
      \     and (src,dst,port) not in benign_periodic:\n    alert('periodic keep-alive beaconing', src,\
      \ dst, port, period)"
- question: Do any users' remote sessions exceed their expected duration, total bytes, or internal-to-external
    byte ratio, or originate from a new subnet/country, or traverse rare user-to-host edges?
  context: 'Supports the Detect tactic by anchoring detection in per-user behavioral baselines and graph
    rarity. For each user and destination class, compute 95th-percentile thresholds for session duration
    and total bytes (including the internal-to-external byte ratio, which rises during exfil or reverse
    control). Alert when a session exceeds those bounds, comes from a previously unseen subnet/country,
    or traverses a rare user-to-host authentication edge as quantified by authentication-graph and structurally-anomalous-login
    analysis. Outsized data flow toward an external controller, a novel origin, or a rare edge each indicate
    possible unauthorized remote control; sessions within the user''s normal envelope are likely benign.
    References: [Authentication graphs](https://doi.org/10.1016/j.cose.2014.09.001); [Detecting Structurally
    Anomalous Logins](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days; build per-user/destination percentile baselines over the full window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (user,dstclass), s in sessions.group():\n  p95_dur = pct(baseline[user,dstclass].duration,95)\n\
      \  p95_byt = pct(baseline[user,dstclass].bytes,95)\n  if s.duration>p95_dur or s.bytes>p95_byt\n\
      \     or s.int_to_ext_ratio>ratio_hi\n     or subnet(s.src) not in seen_subnets[user]\n     or country(s.src)\
      \ not in seen_countries[user]\n     or edge_rarity(user, s.dst) high:\n    alert('anomalous remote\
      \ session vs per-user baseline/graph', user, s)"
- question: Which encrypted SSH/RDP/TLS sessions are flagged as anomalous by a self-supervised flow-representation
    model based on packet-size/direction/timing sequences, independent of TLS version?
  context: 'Supports the Detect tactic by detecting anomalous encrypted remote sessions and TLS-based
    C2 without decryption. Learn flow representations from packet-size/direction/timing sequences using
    self-supervised contrastive models, and score live SSH/RDP/TLS flows for anomaly. Use version-agnostic
    flow features so detection survives the TLS 1.3 migration, where handshake metadata is reduced. Surface
    the top-3 contributing features (e.g., small-packet ratio, inter-arrival CV, byte ratio) in the alert
    so analysts can reason about it. A high anomaly score with interactive-looking contributing features
    points to covert remote control; low scores reflect traffic resembling the learned benign distribution.
    References: [ET-SSL](https://www.nature.com/articles/s41598-025-08568-0); [Extending C2 to TLS 1.3](https://dl.acm.org/doi/10.1145/3678890.3678921).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days; model trained on a longer benign baseline window
  queries:
  - technology: ML/pseudocode
    query: "model = SelfSupervisedContrastiveFlowEncoder()  # trained on benign pkt size/dir/timing seqs\n\
      for f in ssh_rdp_tls_flows:\n  feats = version_agnostic_flow_features(f)  # survives TLS1.3\n  score\
      \ = model.anomaly(feats)\n  if score > tau:\n    alert('anomalous encrypted remote session', f,\
      \ top3=feats.contributions(3))"
- question: After rule-based filtering, which remote logon edges or lateral-movement paths are the lowest-probability
    (rarest) when scored against an authentication graph or login-path model?
  context: 'Supports the Detect tactic by ranking the residual remote sessions that deterministic rules
    cannot fully resolve. Build authentication graphs and reconstruct login paths, then score low-probability
    remote-logon edges and causal lateral-movement paths to prioritize the most suspicious remote terminal
    sessions. Include the specific rare edge or path in the alert for explainability. A rare edge (a user/host
    pair almost never seen) or a long causal login chain is characteristic of an adversary pivoting through
    the environment; common, well-trodden edges are routine administration. References: [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf);
    [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_auth_graph(remote_logons)  # after rule-based filtering\nfor edge in residual_remote_edges:\n\
      \  p = edge_probability(G, edge)\n  if p < p_min: alert('rare remote-logon edge', edge)\nfor path\
      \ in causal_login_paths(G):\n  if path.score > path_thr: alert('suspicious lateral-movement path',\
      \ path)"
- question: Within established remote terminal sessions, do the command-shell sequences deviate from administrative
    baselines toward discovery, credential access, or defense-evasion behavior?
  context: 'Supports the Detect tactic by analyzing what the operator actually does once inside the session.
    Model command-shell sequences with a transformer-based (e.g., DistilBERT) one-class detector trained
    on normal administrative activity, and flag commands that deviate from that baseline, such as host/network
    discovery, credential dumping, or log-clearing/defense evasion. Use Windows Event 4104 (PowerShell
    ScriptBlock) and Linux shell auditing as input. A session whose command sequence diverges sharply
    from administrative norms indicates hands-on-keyboard adversary activity; sequences resembling routine
    maintenance are expected. Reference: [Anomaly Detection of Command Shell Sessions](https://arxiv.org/abs/2310.13247).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days; analyze per established session
  queries:
  - technology: ML/pseudocode
    query: "detector = OneClassTransformer(DistilBERT)  # trained on admin command baselines\nfor session\
      \ in remote_sessions:\n  seq = command_sequence(session)  # Win 4104 / linux shell audit\n  if detector.anomaly(seq)\
      \ > theta:\n    alert('anomalous in-session command sequence', session, seq.outliers())"
- question: When interactive sessions are represented as multi-feature vectors and clustered without supervision,
    do any sparse/outlier clusters reveal unauthorized remote-control behavior?
  context: 'Supports the Detect tactic by isolating unusual interactive sessions that individual rules
    miss. Build session feature vectors combining duration, transfer volume, small-packet ratio, inter-arrival
    CV, client fingerprint, time of day, and command-activity context, then apply unsupervised clustering.
    Sparse clusters separated from the dense mass of normal administrative sessions tend to capture unauthorized
    remote control. Report the top contributing features per cluster so analysts can validate. Membership
    in a small outlier cluster with interactive/exfil-like features warrants investigation; membership
    in large dense clusters reflects normal behavior. Reference: [Timing Analysis of Keystrokes and Timing
    Attacks on SSH](https://www.usenix.org/legacy/events/sec01/full_papers/song/song.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - Zeek x509/ssl.log
  - Windows Event ID 4624 (LogonType 10)
  - Windows Event ID 4625
  - Windows Event ID 4104
  - Sysmon Event ID 3 (Network Connection)
  - Firewall/NetFlow logs
  - 'NAI: Internal network sensor grid, critical servers (e.g., Domain Controllers, Tier 0 assets), and
    network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "vectors = [features(s) for s in interactive_sessions]\n# features: duration, bytes, small_pkt_ratio,\
      \ inter_arrival_cv, client_fp, time_of_day, cmd_context\nlabels = cluster_unsupervised(vectors)\
      \  # e.g., HDBSCAN\nfor c in clusters where size(c) sparse and separated:\n  alert('outlier interactive\
      \ session cluster', members(c), top_features(c))"
