name: 'D3-RTSD: Remote Terminal Session Detection'
id: 315428ec-47bb-49f2-a536-36b3c15f59f8
description: Investigate whether interactive remote terminal sessions (SSH, RDP, WinRM/PowerShell Remoting,
  and other remote-console protocols) reaching internal hosts represent authorized administration or an
  external/insider actor manually controlling a compromised system. This playbook correlates network telemetry
  (Zeek conn/ssh/rdp/ssl logs, firewall/NetFlow) with host authentication and command activity (Windows
  4624 LogonType 10, 4625, 4104; Sysmon Event ID 3; Linux shell auditing) to distinguish expected administrative
  access from suspicious interactive remote control. It layers deterministic allowlists (threat-intel
  matches, approved admin source/account combinations, non-standard-port policy), statistical characterization
  of interactive-traffic physics (keystroke-cadence small packets, ON/OFF stepping-stone correlation,
  periodic keep-alive beaconing, per-user session volume/duration/rarity, failed/blocked attempt rates),
  and machine-learning detection over encrypted-flow representations, authentication graphs/login paths,
  and in-session command sequences. The goal is to detect unauthorized remote terminal control even under
  encryption while suppressing benign administrative noise.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
