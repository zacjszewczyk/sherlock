questions:
- question: Are there any active Active Directory accounts whose credential age, calculated from PasswordLastSet,
    exceeds the maximum permitted by policy for their identity class (for example 365 days for standard
    users with strong controls, or 60-90 days for privileged identities), and do any compromise-flagged
    accounts lack a password reset after their compromise timestamp?
  context: 'This deterministic check is the foundation of credential-rotation assurance under the Harden
    tactic: it confirms that rotation intervals are actually enforced rather than merely defined on paper.
    Query AD for all enabled accounts, compute credential age from PasswordLastSet, and compare against
    per-class policy maximums. Treat rotation as event-driven per NIST SP 800-63B, which discourages arbitrary
    periodic change for human users but REQUIRES forced rotation on evidence of compromise; therefore
    any account previously flagged as compromised must show a PasswordLastSet after the compromise timestamp.
    A positive result (overdue or compromised-but-unrotated credential) indicates a hardening gap and
    possible lingering adversary access; a negative result confirms rotation enforcement for that account
    class.'
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days, with point-in-time age computed against current PasswordLastSet.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'accounts = query_AD(enabled=true); FOR a IN accounts: age_days = now - a.PasswordLastSet;
      max = policy_max(a.class); ALERT when age_days > max; IF a.compromise_flag: ALERT when a.PasswordLastSet
      <= a.compromise_time; OUTPUT account, class, age_days, max, PasswordLastSet.'
- question: Do the domain and any fine-grained password policies enforce PasswordHistoryLength of at least
    24 and MinimumPasswordAge of at least 1 day, and are there any accounts or policies that permit a
    recorded rotation to immediately revert to a guessable predecessor?
  context: A rotation is only effective if the new credential cannot be cycled straight back to the old
    one. This anti-cycling check verifies that PasswordHistoryLength >= 24 and MinimumPasswordAge >= 1
    day across the domain and all fine-grained policies, so that a password change cannot be undone within
    the same window. This directly counters the predictable-transform weakness empirically demonstrated
    by Zhang et al., where roughly 41% of successor passwords were crackable from the prior value. Under
    the Harden tactic, a policy or account that allows cycling renders rotation cosmetic; alert on any
    such gap so it can be corrected before an adversary exploits predictable credential transforms.
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days, re-evaluated whenever password policy objects change.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'policies = get_domain_and_FGPP(); FOR p IN policies: ALERT when p.PasswordHistoryLength <
      24 OR p.MinimumPasswordAge < 1d; FOR a IN accounts: ALERT when effective_policy(a) permits cycling;
      OUTPUT policy_name, scope, PasswordHistoryLength, MinimumPasswordAge.'
- question: Does every non-rotating or extended-interval account map to an approved, owned, and unexpired
    exception record, and are there gMSA-eligible service accounts still using static manually-set passwords
    or orphaned SSH keys that have never been rotated?
  context: Exception governance ensures that accounts deliberately exempted from rotation remain accountable.
    Each such account should map to an approved exception record carrying an owner and an expiration date.
    Under the Harden tactic, alert when exceptions are missing, expired, or attached to privileged groups,
    since those represent ungoverned standing risk. Additionally flag service accounts that are gMSA-eligible
    (and could rotate automatically within msDS-ManagedPasswordInterval) but still rely on a static, manually-set
    password, plus orphaned or never-rotated SSH keys. A positive result reveals stale, ungoverned credentials
    an external actor could harvest and reuse indefinitely.
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days, reconciled against the exception register.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR a IN non_rotating_or_extended_accounts: rec = exception_register[a]; ALERT when rec missing
      OR rec.expired OR a IN privileged_groups; ALERT when a.gMSA_eligible AND a.password_static; ALERT
      when ssh_key_orphaned(a) OR ssh_key_never_rotated(a); OUTPUT account, owner, exception_status, expiry.'
- question: Following any suspected domain compromise, was the krbtgt account password reset twice with
    replication completed between resets, and were SAML token-signing certificates and service/application
    secrets also rotated, and is routine krbtgt age kept under 180 days?
  context: Incident-driven privileged rotation is the decisive eviction step after a domain compromise.
    Per CISA AR21-134A, the krbtgt password must be reset twice with replication completing between the
    two resets to invalidate any Golden Tickets, and SAML token-signing certificates plus service/application
    secrets must be rotated to deny forged-token and stolen-secret persistence. Under the Harden tactic,
    alert when only a single krbtgt reset is observed (which leaves Golden Tickets valid) or when routine
    krbtgt age exceeds 180 days. A positive result indicates incomplete eviction and likely persistent
    adversary access to the directory.
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days, with focused review during and after any incident-response window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: resets = events(4724) WHERE target='krbtgt'; ALERT when count(resets within incident_window)
      < 2 OR replication_not_complete_between(resets); ALERT when (now - krbtgt.PasswordLastSet) > 180d;
      VERIFY SAML_token_signing_cert_rotated AND service_secrets_rotated; OUTPUT reset_count, reset_times,
      replication_status.
- question: What do the credential-age distributions and their 90th/95th percentiles look like across
    the enterprise and within key organizational units (Domain Admins, developers, service accounts),
    and which OUs or roles show systemic non-compliance or tail risk?
  context: Distributional analysis exposes systemic rotation problems that per-account rules can miss.
    Compute credential-age distributions and the 90th/95th percentiles enterprise-wide and per key OU,
    following Florencio et al., to reveal both broad non-compliance and the long-tail of very old credentials
    concentrated in high-value roles. Under the Harden tactic, derive dataset-specific thresholds from
    the observed distribution (for example, alert above the 95th-percentile age for each account class)
    rather than relying on a single fixed number. A heavy upper tail in privileged OUs is a strong signal
    that the most sensitive credentials are also the least rotated.
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days, recomputed weekly across the account population.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR class IN [DomainAdmins, developers, service_accounts, users]: dist = age_days distribution
      for class; report p50,p90,p95; ALERT accounts where age_days > p95(class); OUTPUT class, percentiles,
      tail_accounts.'
- question: What are the rolling weekly rates of rotation-compliant accounts, overdue accounts, and median
    days-to-rotation by account class, and are any of these metrics trending downward or spiking in overdue
    credentials beyond control-chart limits?
  context: Tracking reset cadence over time catches degradation in rotation hygiene before it becomes
    systemic. Calculate rolling weekly rates of compliant accounts, overdue accounts, and median days-to-rotation
    by account class (a Frequency signal). Under the Harden tactic, escalate sustained downward compliance
    trends or spikes in overdue credentials using a control chart (for example, more than 3 sigma from
    the trailing 12-week mean). A sustained negative trend often indicates an automation breakage or process
    abandonment that quietly widens the window of exposure for stolen credentials.
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days, with rolling weekly aggregation and a trailing 12-week control baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR week, class: compute compliant_rate, overdue_count, median_days_to_rotate; baseline =
      trailing_12week_mean_std(metric, class); ALERT when metric > mean+3sigma (overdue) OR sustained
      downward trend in compliant_rate; OUTPUT class, week, metrics, baseline.'
- question: After each password reset (Event ID 4723/4724/4738), is there a subsequent spike in failed
    logons (Event ID 4625) for the same account within 24-48 hours indicating a broken service, and are
    there 'theater' rotations where a change is immediately reverted within the minimum-age window?
  context: 'This is a distinct failure-mode signal (State) that separates effective rotations from harmful
    or cosmetic ones. Correlate each 4723/4724/4738 reset with the same account''s 4625 failed-logon volume
    in the following 24-48 hours to catch rotations that silently broke a dependent service (a common
    reason operators avoid rotating). Separately, measure the rate of theater rotations: a PasswordLastSet
    change immediately followed by another change reverting within the minimum-age window, or accounts
    with abnormally short history. The diminishing-returns and breach-response framing from Chiasson and
    van Oorschot and Bhagavatula et al. underpins this. Under the Harden tactic, both patterns indicate
    rotation that is operationally fragile or merely cosmetic.'
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days, with a 24-48 hour post-reset correlation window per account.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: 'FOR reset IN events(4723,4724,4738): fails = count(4625 for reset.account within 48h after
      reset); ALERT when fails > account_baseline; ALERT when next_reset(account) reverts within MinimumPasswordAge
      OR history_length(account) abnormally_short; OUTPUT account, reset_time, post_reset_failures, revert_flag.'
- question: Does a time-series forecast of expected rotation windows for privileged identities (trained
    on historical 4723/4724/4738 events) predict any rotations that then fail to occur, and what are the
    top contributing features for each predicted miss?
  context: Forecasting anticipates missed rotations for the highest-value accounts before the credential
    becomes dangerously stale. Train a time-series model on historical reset events (4723/4724/4738) for
    privileged identities to learn each account's expected rotation cadence, then alert when a forecasted
    rotation does not materialize, consistent with the new-edge/forecasting baseline of Metelli and Heard.
    Under the Harden tactic, alert text must surface the top-3 contributing features (for example account
    class, days overdue versus forecast, recent failed-rotation count) so an analyst can triage quickly.
    A predicted-but-missed rotation on a privileged account is a leading indicator of both a hardening
    lapse and potential lingering compromise.
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days for features, with forward forecasting of next-rotation windows.
  queries:
  - technology: ML pipeline pseudocode
    query: series = reset_events(4723,4724,4738) per privileged_account; model = forecast_cadence(series);
      expected = model.next_window(account); ALERT when no reset observed by expected.upper_bound; OUTPUT
      account, expected_window, days_overdue, top_shap_3.
- question: Is any long-unrotated credential being used from never-before-seen hosts or along authentication
    paths inconsistent with its account class, and which edges or features drive that anomaly?
  context: 'Running in parallel with the deterministic rules, this model catches abuse of stale credentials
    that compliance metrics alone would miss. Score whether a long-unrotated credential is authenticating
    from never-seen hosts or in paths inconsistent with its account class, using path-based (Hopper, Ho
    et al.) and structural login-anomaly (Siadati and Memon) models over first-party authentication logs.
    Under the Harden tactic this links rotation hygiene to active threat detection: a stale credential
    suddenly used from anomalous infrastructure is a classic sign of an external actor leveraging harvested
    secrets. Surface the contributing edges/features in the alert so the analyst can judge whether the
    path is plausible.'
  answer_sources:
  - Active Directory User Object Attributes (e.g., PasswordLastSet, pwdLastSet, msDS-ManagedPasswordInterval)
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4738
  - Windows Event ID 4625
  - Domain/Fine-Grained Password Policy (PasswordHistoryLength, MinimumPasswordAge)
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days for path/structure baselines, with scoring of current authentications.
  queries:
  - technology: ML pipeline pseudocode
    query: 'graph = build_auth_graph(first_party_logs); FOR auth WHERE credential_age(auth.account) >
      threshold: score = path_and_structure_model.score(auth, graph); ALERT when score high AND (src_host
      first_seen OR path inconsistent_with_class); OUTPUT account, src_host, contributing_edges.'
- question: Are any certificates approaching expiry (within tiered 30/14/7-day thresholds) without an
    observed renewal, or any cryptographic keys whose age exceeds their authorized cryptoperiod?
  context: This deterministic check prevents both expiry-driven outages and stale-key exposure. Alert
    when a certificate's notAfter minus current time falls below tiered thresholds (for example 30/14/7
    days) with no observed renewal event, or when a key's age exceeds its authorized cryptoperiod per
    NIST SP 800-57. Maintain per-key-type maximum ages derived from the SP 800-57 recommendations. Under
    the Harden tactic, an unrenewed near-expiry certificate is both an availability risk and a sign that
    lifecycle automation has failed; a key past its cryptoperiod represents accumulated cryptographic
    exposure that an adversary could exploit if the key is compromised.
  answer_sources:
  - Certificate inventory (notBefore/notAfter, key type/size, SAN)
  - Certificate Authority issuance/renewal logs (AD CS Event ID 4886/4887; ACME/CA audit logs)
  - TLS endpoint scan results
  - Key management / HSM key-age metadata
  - 'NAI: Certificate Authority servers, load balancers, web/application servers, HSM/key stores'
  range: Last 90 days, with continuous evaluation against tiered expiry thresholds.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR c IN cert_inventory: ttl = c.notAfter - now; ALERT when ttl < 30d AND no_renewal_observed(c)
      (escalate at 14d,7d); FOR k IN key_inventory: ALERT when key_age(k) > cryptoperiod(k.type); OUTPUT
      cert/key id, ttl_or_age, threshold, last_renewal.'
- question: For endpoints under automated certificate lifecycle management, did the expected ACME or CA
    renewal/issuance event occur before the expiry threshold window, and where is an expected renewal
    event absent even though the certificate has not yet expired?
  context: Verifying that automated renewals actually fire is a distinct rotation-failure signal that
    should alert even before any certificate expires. For endpoints under automated lifecycle management,
    an issuance/renewal event is expected before expiry; the absence of an expected ACME (RFC 8555) or
    CA renewal event prior to the threshold window indicates the automation broke. Under the Harden tactic,
    catching the missing renewal event early gives operators time to intervene before an outage and before
    a key lingers past its intended life. A positive result (expected-but-missing renewal) points to a
    failed renewal pipeline, expired ACME account, or CA connectivity problem.
  answer_sources:
  - Certificate inventory (notBefore/notAfter, key type/size, SAN)
  - Certificate Authority issuance/renewal logs (AD CS Event ID 4886/4887; ACME/CA audit logs)
  - TLS endpoint scan results
  - Key management / HSM key-age metadata
  - 'NAI: Certificate Authority servers, load balancers, web/application servers, HSM/key stores'
  range: Last 90 days, evaluated against each endpoint's expected renewal schedule.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: 'FOR e IN automated_lifecycle_endpoints: expected = renewal_due(e) - threshold_window; renewal
      = events(ACME_or_CA_issuance for e); ALERT when renewal absent by expected AND not yet expired;
      OUTPUT endpoint, cert, expected_renewal, last_event.'
- question: What is the distribution and percentile spread of days-to-expiry and key age across the certificate/key
    fleet, and how many items sit inside the critical window per service tier?
  context: Fleet-level distribution analysis exposes systemic renewal backlog that individual alerts cannot
    summarize. Compute the distribution and percentiles of days-to-expiry and key age across the entire
    certificate/key fleet, and count items inside the critical window per service tier, to reveal whether
    renewal is keeping pace and to derive fleet-specific alert thresholds. Under the Harden tactic, a
    growing cluster of items in the critical window for a given tier signals an overloaded or failing
    renewal process. This view also helps prioritize remediation toward the tiers carrying the most sensitive
    services.
  answer_sources:
  - Certificate inventory (notBefore/notAfter, key type/size, SAN)
  - Certificate Authority issuance/renewal logs (AD CS Event ID 4886/4887; ACME/CA audit logs)
  - TLS endpoint scan results
  - Key management / HSM key-age metadata
  - 'NAI: Certificate Authority servers, load balancers, web/application servers, HSM/key stores'
  range: Last 90 days, recomputed regularly across the certificate/key fleet.
  queries:
  - technology: SIEM/Stats pseudocode
    query: dist = distribution(days_to_expiry, key_age) over fleet; report p10,p50,p90 per service_tier;
      count items where days_to_expiry < critical_window per tier; ALERT when critical_count(tier) rising
      vs baseline; OUTPUT tier, percentiles, critical_count.
- question: Based on each service's historical issuance/renewal cadence, when is the next renewal expected,
    and which services are forecast to miss renewal before their expiry threshold?
  context: Forecasting renewal misses gives lead time to prevent outages and stale keys across the PKI
    fleet. Model the historical issuance/renewal cadence per service to forecast the expected next renewal,
    then alert when that renewal is not observed before the expiry threshold. Under the Harden tactic,
    surface the top-3 contributing features (service, days-to-expiry, last successful renewal age) so
    an analyst can quickly judge urgency. A forecasted miss on a high-tier service is a leading indicator
    of an imminent certificate-expiry outage and of key material living beyond its intended cryptoperiod.
  answer_sources:
  - Certificate inventory (notBefore/notAfter, key type/size, SAN)
  - Certificate Authority issuance/renewal logs (AD CS Event ID 4886/4887; ACME/CA audit logs)
  - TLS endpoint scan results
  - Key management / HSM key-age metadata
  - 'NAI: Certificate Authority servers, load balancers, web/application servers, HSM/key stores'
  range: Last 90 days for cadence features, with forward forecasting per service.
  queries:
  - technology: ML pipeline pseudocode
    query: 'FOR svc: series = issuance_renewal_events(svc); model = forecast_cadence(series); expected
      = model.next_renewal(svc); ALERT when expected > expiry_threshold(svc) OR renewal not observed by
      expected; OUTPUT svc, days_to_expiry, last_renewal_age, top_features_3.'
- question: Are any managed secrets older than their configured rotation interval, are there RotationFailed
    events requiring triage, are gMSA-managed passwords rotating within msDS-ManagedPasswordInterval,
    and are long-lived or orphaned SSH keys inventoried and rotated?
  context: This deterministic check confirms that machine credentials and application secrets actually
    rotate and that rotation jobs succeed. Alert when a managed secret's age exceeds its configured rotation
    interval, and treat RotationFailed events as a distinct failure-mode signal requiring immediate triage.
    Verify that gMSA-managed passwords rotate within msDS-ManagedPasswordInterval (per Microsoft gMSA
    guidance) and that long-lived or orphaned SSH keys are inventoried and rotated (per SSH Academy).
    Under the Harden tactic, an overdue secret or a failed rotation job leaves a static, potentially-harvested
    credential in place, which is exactly what an external actor needs for durable access to cloud and
    application infrastructure.
  answer_sources:
  - Secrets manager audit logs (e.g., AWS Secrets Manager RotationSucceeded/RotationFailed, Azure Key
    Vault, HashiCorp Vault audit log)
  - Cloud control-plane logs (CloudTrail/Activity logs)
  - gMSA attributes (msDS-ManagedPasswordInterval, PasswordLastSet)
  - SSH authorized_keys / key inventory metadata
  - 'NAI: Secrets-management services, cloud control plane, application/service hosts'
  range: Last 90 days, with immediate triage of RotationFailed events.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR s IN managed_secrets: ALERT when secret_age(s) > rotation_interval(s); ALERT on events(RotationFailed);
      FOR g IN gMSA: ALERT when (now - g.PasswordLastSet) > g.msDS_ManagedPasswordInterval; FOR k IN ssh_keys:
      ALERT when k.long_lived OR k.orphaned; OUTPUT secret/key id, age, interval, status.'
- question: What is the rolling ratio of RotationSucceeded to RotationFailed events and the count of secrets
    overdue for rotation, and are either of these trending beyond control-chart limits?
  context: Trend monitoring catches a deteriorating rotation pipeline before it leaves many secrets stale.
    Compute the rolling ratio of RotationSucceeded to RotationFailed and the count of overdue secrets
    (a combined State + Frequency signal); escalate sustained increases in the failure rate or overdue
    counts beyond a control-chart limit. As Chiasson and van Oorschot note, failed rotation is the operational
    cost that ultimately suppresses rotation altogether. Under the Harden tactic, a rising failure ratio
    is an early warning that automation is breaking and that static credentials are accumulating across
    the secrets-management estate and cloud control plane.
  answer_sources:
  - Secrets manager audit logs (e.g., AWS Secrets Manager RotationSucceeded/RotationFailed, Azure Key
    Vault, HashiCorp Vault audit log)
  - Cloud control-plane logs (CloudTrail/Activity logs)
  - gMSA attributes (msDS-ManagedPasswordInterval, PasswordLastSet)
  - SSH authorized_keys / key inventory metadata
  - 'NAI: Secrets-management services, cloud control plane, application/service hosts'
  range: Last 90 days, with rolling aggregation and a control-chart baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR window: ratio = count(RotationSucceeded)/count(RotationFailed); overdue = count(secrets
      where age > interval); baseline = control_chart(ratio, overdue); ALERT when failure_rate rising
      > limit OR overdue > mean+3sigma; OUTPUT window, ratio, overdue_count, baseline.'
- question: Is any never-rotated or overdue machine credential being used from previously-unseen hosts
    or services, or along rare authentication paths, and which features drive that anomaly?
  context: This model ties secrets-rotation hygiene to active threat detection for machine identities.
    Score whether a never-rotated or overdue machine credential is used from previously-unseen hosts/services
    or in rare paths, using new-edge (Metelli and Heard) and path-based (Hopper, Ho et al.) models on
    first-party logs. Under the Harden tactic, a stale machine credential suddenly authenticating from
    anomalous infrastructure is a strong indicator that an external actor has harvested a long-lived secret
    and is exercising it. The alert must surface the contributing features (credential, source, days overdue)
    so an analyst can confirm whether the use is legitimate automation or credential abuse.
  answer_sources:
  - Secrets manager audit logs (e.g., AWS Secrets Manager RotationSucceeded/RotationFailed, Azure Key
    Vault, HashiCorp Vault audit log)
  - Cloud control-plane logs (CloudTrail/Activity logs)
  - gMSA attributes (msDS-ManagedPasswordInterval, PasswordLastSet)
  - SSH authorized_keys / key inventory metadata
  - 'NAI: Secrets-management services, cloud control plane, application/service hosts'
  range: Last 90 days for path/edge baselines, with scoring of current machine-credential use.
  queries:
  - technology: ML pipeline pseudocode
    query: 'graph = build_machine_auth_graph(first_party_logs); FOR auth WHERE credential_overdue_or_never_rotated(auth.cred):
      score = new_edge_and_path_model.score(auth, graph); ALERT when score high AND (src first_seen OR
      rare_path); OUTPUT credential, source, days_overdue, contributing_features.'
