name: 'D3-CRO: Credential Rotation'
id: 08e71001-dd9d-4c8c-ae0f-db666544cece
description: 'Assess whether authentication credentials across the enterprise are being rotated effectively,
  on policy, and without breaking dependent services. This playbook helps an analyst verify three intertwined
  domains of credential rotation: (1) account credentials in Active Directory (user, privileged, and service
  accounts) where credential age, anti-cycling controls, exception governance, and incident-driven resets
  such as the krbtgt double-reset must be confirmed; (2) PKI certificates and cryptographic keys, where
  time-to-expiry, key age versus authorized cryptoperiod, and expected automated renewals must be tracked
  to prevent both expiry-driven outages and stale-key exposure; and (3) secrets-management and machine
  credentials (API keys, application secrets, gMSA, SSH keys) where rotation success/failure state, secret
  age, and abnormal credential use are monitored. Beyond pure compliance, the playbook surfaces rotation
  theater (cosmetic resets that revert to predictable predecessors), rotation-induced service failures,
  missed rotations forecast from historical cadence, and anomalous use of stale credentials from never-seen
  hosts or paths that can indicate an adversary abusing long-lived secrets. The threat model centers on
  a sophisticated external actor seeking persistent access to sensitive data, while also accounting for
  commodity malware and insiders.'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
