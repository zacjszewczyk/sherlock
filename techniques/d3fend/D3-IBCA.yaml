name: 'D3-IBCA: Indirect Branch Call Analysis'
id: b5798191-c94f-4d7a-9a3c-0bdd28530533
description: 'This playbook helps an analyst investigate Return-Oriented Programming (ROP) and related
  code-reuse (JOP/COOP) exploitation by analyzing indirect branch call telemetry from CPU hardware features.
  It draws on Intel Processor Trace (PT) and Last Branch Record (LBR) control-flow traces, Hardware Performance
  Counter (HPC) side effects, and process-start events (Windows Event ID 4688). The questions guide the
  analyst to detect control-flow deviations characteristic of ROP/JOP: returns that are not call-preceded,
  indirect branches to out-of-graph or invalid vtable targets, long gadget-like chains, elevated Return-Address-Stack
  mispredictions, abnormal branch density/entropy, failure-mode counter spikes, and learned control-flow
  anomalies. It combines deterministic symbolic-logic rules (the detection floor), statistical baselining
  of branch behavior, and machine-learning sequence/feature models to surface high-confidence code-reuse
  exploitation against critical servers and privileged-user endpoints.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: When a sensitive system call is made, does the Intel LBR (16 entries) or Intel PT trace show
    any return (`ret`) whose target is NOT the instruction immediately following a `call` site (i.e.,
    a non-call-preceded return on the path to the syscall)?
  context: This is kBouncer's core deterministic check and serves as the detection floor for ROP. In legitimate
    execution every `ret` returns control to the instruction right after the matching `call`. ROP gadget
    chains splice together code fragments ending in `ret`, so returns land at gadget addresses that are
    NOT preceded by a `call`. At each sensitive syscall, inspect the recorded branch history and require
    that every `ret` is call-preceded. A single non-call-preceded return on a path to a syscall is high-confidence
    ROP and should alert. Because this is a hard symbolic-logic rule under the Detect (D3-D) tactic, a
    positive result is strongly indicative of code-reuse exploitation; a negative (all rets call-preceded)
    does not by itself clear the host but satisfies the deterministic floor.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: EDR/Branch-trace pseudocode
    query: |-
      on syscall_enter(critical_process):
          for ret in LBR_or_PT.returns_on_path_to_syscall():
            if memory[ret.target - len_of_prev_call] is not a CALL instruction:
              alert("non-call-preceded return -> ROP", pid, ret.target)
- question: On any path leading to a syscall, is there a chain of consecutive call-preceded gadgets (instruction
    sequences of <=20 instructions ending in an indirect branch) whose length exceeds the threshold (default
    >=8)?
  context: A gadget is any short instruction sequence (<=20 instructions) ending in an indirect branch
    (`ret`, indirect `jmp`, or indirect `call`). Benign code rarely chains short gadgets together (average
    gadget length ~2.25, only ~6.4% of gadgets begin right after call sites), whereas real ROP exploits
    chain roughly 8-34 gadgets. Counting consecutive call-preceded gadgets and flagging chains at or above
    a tuned threshold (default >=8) catches exploit chains while limiting false positives. Tune the threshold
    per application. Under the Detect tactic this complements the hard call-preceded rule by catching
    chained reuse that individually passes call-preceded checks.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: EDR/Branch-trace pseudocode
    query: |-
      chain = 0
        for gadget in walk_branch_trace():
          if gadget.len <= 20 and gadget.ends_in_indirect_branch and gadget.call_preceded:
            chain += 1
            if chain >= 8: alert("long gadget chain", pid, chain)
          else:
            chain = 0
- question: Does any indirect branch violate Control-Flow Integrity — i.e., does a return fail to match
    the shadow/call stack (backward edge) or does an indirect call/jmp target an address that is not a
    valid function entry (forward edge)?
  context: Control-Flow Integrity restricts each indirect branch to its control-flow-graph-permitted target
    set. Backward edges (returns) must match the shadow/call stack; forward edges (indirect calls and
    jmps) must land on valid function entries within the approved module layout. Branch targets outside
    these approved sets indicate hijacked control flow typical of ROP/JOP. The analyst reconstructs permitted
    target sets from the binary/CFG and compares observed branch targets. A target outside the approved
    set is flagged. This deterministic check under Detect catches both backward-edge ROP and forward-edge
    code-reuse.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: EDR/Branch-trace pseudocode
    query: |-
      for br in indirect_branches():
          if br.type == RET and br.target not in shadow_stack.top_valid():
            alert("backward-edge CFI violation", pid, br.target)
          if br.type in (ICALL, IJMP) and br.target not in valid_function_entries:
            alert("forward-edge CFI violation", pid, br.target)
- question: For indirect calls made through C++ vtables, does the call target a legitimate virtual-function/vtable
    entry recovered from the binary, or does it land outside the valid target set (indicating vtable/COOP
    hijacking)?
  context: Counterfeit-Object-Oriented Programming (COOP) and vtable hijacking abuse C++ virtual dispatch
    by corrupting object vtable pointers so indirect calls reach attacker-chosen code. By recovering the
    legitimate virtual-function/vtable entries from the binary (as in vfGuard) and validating each indirect
    virtual-call target against that set, calls landing outside valid entries are flagged. This forward-edge
    check complements the backward-edge ROP rules and is important for exploits that pivot through object
    dispatch rather than returns. Under Detect, an out-of-set virtual-call target is high-confidence forward-edge
    code reuse.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: EDR/Branch-trace pseudocode
    query: |-
      vtable_entries = recover_vtable_targets(binary)
        for call in indirect_virtual_calls():
          if call.target not in vtable_entries:
            alert("vtable/COOP hijack", pid, call.target)
- question: Do PT/LBR traces tied to process starts (Windows Event ID 4688) match any known malicious
    ROP/JOP gadget-chain signature, and is the style backward-edge (ret-based) or forward-edge (indirect
    jmp/call-based)?
  context: Maintain a library of signatures for known malicious ROP/JOP gadget sequences and compare them
    against PT/LBR traces correlated to process-start events (Event ID 4688). Exact or near-exact chain
    matches generate high-confidence alerts. Distinguishing backward-edge (ret) versus forward-edge (indirect
    jmp/call) gadget styles per the code-reuse taxonomy helps classify the exploit and informs response.
    This signature approach under Detect is fast and low-false-positive for known exploits but must be
    paired with the behavioral rules for novel chains.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      on EventID==4688 (process_start):
          trace = collect_PT_LBR(pid)
          for sig in known_rop_jop_signatures:
            if near_match(trace.gadget_chain, sig):
              alert("known gadget-chain signature", pid, sig.id, sig.edge_style)
- question: Has any process exceeded the 99th-percentile baseline rate (count and count/min) of indirect
    branches landing outside CFG-permitted target sets?
  context: Build per-process baselines of indirect branches that land outside CFG-permitted target sets,
    tracking Volume (count) and Frequency (count/min), and alert when observed rates exceed the 99th percentile
    of normal control-flow behavior. Thresholds are derived per application using AIR-style target-cardinality
    baselines so that applications with naturally larger valid-target sets are not over-flagged. Under
    the Detect tactic, a statistically anomalous burst of out-of-graph branches indicates probable code-reuse
    execution even absent an exact signature; a result within baseline is normal control flow.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = per_process_pct(out_of_graph_branch_rate, p=99)
        for proc in processes:
          rate = count(out_of_graph_branches[proc]) / window_minutes
          if rate > baseline[proc]:
            alert("out-of-graph branch rate anomaly", proc, rate)
- question: Do Hardware Performance Counters jointly show elevated mispredicted-return rate, high ret/indirect-branch
    density per instruction, and abnormally short average basic-block length consistent with ROP execution?
  context: 'ROP execution has a measurable micro-architectural signature: each gadget''s stack-popped
    `ret` mispredicts the Return Address Stack (RAS), gadgets are short so ret/indirect-branch density
    per instruction rises, and average basic-block length drops. Sample HPCs and profile these three SIGDROP-style
    features jointly, alerting only when they cross baselines together to reduce noise. IMPORTANT: HPCs
    are non-deterministic and overcount, so use multi-run averaged, variance-aware, per-platform thresholds
    rather than fixed values. Under Detect, a joint crossing is suggestive of ROP; single-counter spikes
    are too noisy alone.'
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      hpc = sample_HPC(proc)  # averaged over runs, variance-aware
        if hpc.mispredicted_ret_rate > base.mr and \
           hpc.indirect_branch_density > base.dens and \
           hpc.avg_basic_block_len < base.bbl:
          alert("ROP micro-arch signature", proc)
- question: Treating call-preceded gadget-chain length as a per-application distribution, is the observed
    chain length above the 99th percentile of the benign baseline?
  context: Beyond the hard >=8 chain rule, treat call-preceded gadget-chain length as a per-application
    statistical distribution. Baseline benign chain lengths (which are short and tightly distributed)
    and alert on lengths above the 99th percentile. This catches application-specific long-tail chains
    that may sit below or near the fixed threshold and makes unusually long chains statistically conspicuous.
    Under Detect, this complements the deterministic chain rule and reduces both false negatives (apps
    with longer benign chains) and false positives by adapting to each application's normal behavior.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      dist = baseline_chain_lengths(app)
        p99 = percentile(dist, 99)
        for chain in observed_gadget_chains(app):
          if chain.length > p99:
            alert("gadget-chain length above benign p99", app, chain.length)
- question: Over short time windows, does the entropy or burstiness of branch-target sequences spike unusually
    high versus the historical profile for that process?
  context: Compute the entropy and burstiness of branch-target sequences over short windows. ROP/JOP execution
    phases tend to produce unusually high-entropy bursts of branch targets relative to a process's historical
    profile. Pair entropy (a style/shape feature) with the Volume/Frequency counters from the other statistical
    methods so detection does not rely on entropy alone, which can be noisy. Under the Detect tactic,
    an entropy burst coincident with elevated branch volume strengthens confidence that an exploit execution
    phase is underway; entropy within historical norms is benign.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for window in sliding_windows(branch_targets[proc]):
          H = entropy(window); B = burstiness(window)
          if H > hist_H_p99[proc] and B > hist_B_p99[proc] and volume(window) > vol_base[proc]:
            alert("branch entropy/burst anomaly", proc, H, B)
- question: Are there spikes in failure-mode counters — RAS-misprediction rate, aborted/blocked indirect
    transfers, faulting branch targets, or exception/crash rates immediately following anomalous branches?
  context: Exploit attempts, including failed ones, leave failure signals distinct from clean execution.
    Explicitly profile RAS-misprediction rate, aborted or blocked indirect transfers, faulting branch
    targets, and exception/crash rates that follow anomalous branches as their own features. Spikes in
    these failure counters distinguish exploitation attempts (even unsuccessful ones) from normal workloads.
    Account for benign HPC variance to avoid false positives. Under Detect, a cluster of failure-mode
    spikes around anomalous branches — especially preceding a crash — is a strong tell of attempted code
    reuse and can catch attacks that did not complete.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      f = failure_counters(proc)  # variance-aware baselines
        if f.ras_mispredict_spike or f.aborted_transfers_spike or \
           f.faulting_targets_spike or f.exception_rate_spike_after_anomalous_branch:
          alert("failure-mode counter spike (possible failed exploit)", proc)
- question: Does a per-application deep-learning model scoring live Intel PT control-flow packets (TNT/TIP
    converted to a time series) flag a deviation from learned benign control flow?
  context: Convert Intel PT control-flow packets (TNT/TIP) into a time series and train a per-application
    deep model (a transfer-learned CNN feature extractor feeding a sequence classifier, as in HeNet) on
    benign control flow. Score live PT traces and alert on deviations. HeNet reports 100% detection /
    0% false positives on PDF-reader exploits. When alerting, surface the top-3 contributing features
    (dominant anomalous branch sites, chain length, packet-window score) so the analyst can triage quickly.
    Under Detect, a model deviation indicates anomalous control flow consistent with code reuse; pair
    with the deterministic rules for confirmation.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: |-
      ts = pt_packets_to_timeseries(live_PT[app])  # TNT/TIP
        score = henet_model[app].predict(ts)
        if score > anomaly_threshold[app]:
          alert("PT control-flow DL anomaly", app, top3_features(ts))
- question: Does an RNN/LSTM or transformer sequence model trained on benign branch traces assign a high
    anomaly probability to a live PT/LBR sequence consistent with ROP-like execution?
  context: Train RNN/LSTM or transformer sequence models on benign branch traces for critical applications,
    using CFG valid-target sets as the labeling oracle. Score live PT/LBR sequences and alert on high
    anomaly probabilities consistent with ROP-like execution. Output the top-3 anomalous branch transitions
    for triage. This learned approach captures sequential structure that fixed rules miss and generalizes
    across gadget variants. Under the Detect tactic, a high anomaly probability flags suspected code reuse;
    using CFG-derived labels keeps the model grounded in legitimate control flow so deviations are meaningful.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: |-
      seq = encode(live_PT_LBR[app])
        p = seq_model[app].anomaly_prob(seq)  # trained on benign, CFG-labeled
        if p > thr[app]:
          alert("branch-sequence anomaly (ROP-like)", app, top3_transitions(seq))
- question: Does a supervised classifier trained on SIGDROP-style HPC features (mispredicted-return rate,
    indirect-branch density, basic-block length) classify the current workload as ROP rather than benign?
  context: Train a supervised classifier on SIGDROP-style HPC features — mispredicted-return rate, indirect-branch
    density, and basic-block length — to discriminate ROP from benign workloads. Use variance-aware features
    and per-platform retraining because HPC non-determinism degrades model stability across hardware.
    Report the top-3 contributing counters per alert for triage. Under Detect, a ROP classification flags
    probable code-reuse execution from micro-architectural side effects without needing a full trace;
    because HPC measurements are noisy, treat results as corroborating evidence alongside the deterministic
    and trace-based checks.
  answer_sources:
  - Intel Processor Trace (PT) logs
  - Intel Last Branch Record (LBR) logs
  - Hardware Performance Counter (HPC) telemetry
  - Windows Event ID 4688
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), Endpoint devices of privileged
    users'
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: |-
      feats = variance_aware(hpc_features(proc))  # mispred-ret, ib-density, bbl
        label = rop_clf[platform].predict(feats)
        if label == "ROP":
          alert("HPC classifier: ROP workload", proc, top3_counters(feats))
