name: 'D3-DP: Decoy Persona'
id: aeaadc97-7cd5-4545-a6e6-15bbb8667428
description: Investigate interactions with decoy personas - fabricated online identities (accounts, credentials,
  mailboxes, social tokens, and the domains/hosts/URLs they reference) deployed to misdirect and detect
  adversaries. This playbook helps an analyst (1) treat ANY authentication, login, message reply, file
  access, or network connection touching decoy persona assets as a high-confidence compromise indicator,
  because no legitimate user or process should ever interact with them, and (2) continuously validate
  that the decoy persona remains credible - exhibiting consistent, role-appropriate logon, process, DNS,
  and network behavior over time - so that genuine-vs-decoy leakage does not expose the deception and
  controlled adversary engagement can proceed. It spans deterministic honeytoken/honey-x interaction triggers,
  allowlist/watchlist enforcement on persona management hosts, statistical baselining of persona circadian
  rhythm and realism drift, and machine-learning forecasting, sequence scoring, and graph modeling of
  persona behavior.
type: technique
related:
- tactic_id: D3-DE
  tactic_name: Deceive
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any Windows logon - successful (Event ID 4624) or failed (Event ID 4625) - referenced
    a username, credential, or token that belongs to a decoy persona on our authoritative watchlist?
  context: 'Decoy persona credentials are honeytokens: they are never issued to real users or services,
    so by construction any logon attempt referencing them is malicious and requires no statistical model
    to interpret (Deceive tactic). Maintain an authoritative watchlist of decoy-persona usernames, credentials,
    and tokens and raise a high-severity alert on ANY 4624 (success) or 4625 (failure) that references
    them. A success means an adversary has obtained and used the planted secret (likely after harvesting/phishing);
    a failure means they are guessing or replaying it. Record success/fail state, source IP, and count
    per source as triage context so an analyst can immediately judge whether this is a single probe or
    active credential abuse.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Decoy persona accounts and credentials, decoy mailboxes/social tokens, and the decoy infrastructure
    (domains, hosts, URLs) they reference.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'decoy_accounts = watchlist(''decoy_personas'')

      FROM win_security WHERE EventID IN (4624,4625) AND lower(TargetUserName) IN decoy_accounts

      | EVAL state = if(EventID==4624,''SUCCESS'',''FAIL'')

      | STATS attempts=count(), successes=countif(state==''SUCCESS'') BY TargetUserName, IpAddress, state

      | ALERT severity=HIGH msg=''Decoy persona credential used'''
- question: Has any host initiated a network connection, HTTP request, or DNS lookup whose destination
    matches the domains, hosts, or beacon URLs referenced by a decoy persona?
  context: A credible honey-x asset should be indistinguishable to, and untouched by, legitimate users,
    so any interaction is a separating, high-confidence signal of adversary engagement (Deceive tactic).
    Treat every Zeek conn.log/http.log/dns.log event whose destination matches decoy-persona infrastructure
    as malicious. Capture byte volume (orig/resp bytes) and request count to distinguish a single reconnaissance
    probe from sustained engagement - the latter indicates the adversary has taken the bait and is actively
    interacting, which is the desired condition for controlled engagement but must be tracked closely.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Decoy persona accounts and credentials, decoy mailboxes/social tokens, and the decoy infrastructure
    (domains, hosts, URLs) they reference.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'decoy_infra = watchlist(''decoy_domains_hosts_urls'')

      (conn.log: id.resp_h IN decoy_infra) OR (dns.log: query IN decoy_infra) OR (http.log: host+uri IN
      decoy_infra)

      | STATS sessions=count(), orig_bytes=sum(orig_bytes), resp_bytes=sum(resp_bytes), requests=count()
      BY id.orig_h, dest

      | ALERT severity=HIGH msg=''Connection to decoy persona infrastructure'''
- question: Are there elevated rates of FAILED interactions with decoy assets - failed logons (Event ID
    4625) to decoy accounts, NXDOMAIN responses for decoy domains, or HTTP 404/401/403 to decoy URLs -
    from a single source?
  context: Reconnaissance and credential-guessing against a persona surface as elevated failure rates
    before any success, so failed interactions are a distinct early-warning signal (Deceive tactic). Separately
    track and alert on failed decoy interactions across identity (4625), DNS (NXDOMAIN in dns.log), and
    web (404/401/403 in http.log) telemetry. Alert when failed-interaction count from a single source
    exceeds 5 in 10 minutes (tune to local baseline). A burst of failures indicates active probing/enumeration
    of the decoy persona surface, giving defenders lead time before a credential is successfully used.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Decoy persona accounts and credentials, decoy mailboxes/social tokens, and the decoy infrastructure
    (domains, hosts, URLs) they reference.'
  range: Last 90 days; evaluate in 10-minute sliding windows per source
  queries:
  - technology: SIEM/Stats pseudocode
    query: "failures = UNION(\n  win_security WHERE EventID==4625 AND TargetUserName IN decoy_accounts\
      \ -> src=IpAddress,\n  dns.log WHERE query IN decoy_domains AND rcode_name=='NXDOMAIN' -> src=id.orig_h,\n\
      \  http.log WHERE host+uri IN decoy_urls AND status_code IN (401,403,404) -> src=id.orig_h)\n| BIN\
      \ time SPAN=10m\n| STATS fail_count=count() BY src, time_bin\n| WHERE fail_count > 5\n| ALERT severity=HIGH\
      \ msg='Decoy persona enumeration/recon (failed interactions)'"
- question: Did a persona management host execute a process or initiate a network connection to a destination
    that falls OUTSIDE the approved application and domain profile defined for that decoy persona?
  context: 'Each decoy persona is given an approved character profile - a watchlist of expected domains
    and applications. When the persona management host (mapped by Event ID 4688 host identity and Zeek
    conn.log source IP) runs an off-profile process or reaches an off-profile destination, it is a deception-leakage
    signal: either an operator mistake or an adversary who has taken control and is driving the persona
    inconsistently (Deceive tactic). Allowlist/watchlist mechanics over first-party logs flag anything
    outside the character profile. A positive result threatens credibility and may expose the deception,
    so it must be reviewed and remediated quickly.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dedicated persona management workstations and their network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'approved_apps = profile(persona).apps ; approved_dest = profile(persona).domains

      proc = win_security WHERE EventID==4688 AND Host==persona_host AND NewProcessName NOT IN approved_apps

      net  = conn.log WHERE id.orig_h==persona_ip AND resolved_dest NOT IN approved_dest

      | ALERT severity=MEDIUM msg=''Off-profile process/destination on persona host (deception leakage)'''
- question: Do the persona's correlated logon, process, DNS, and network events form an impossible or
    contradictory sequence - violating the expected event-ordering invariants (logon -> expected process
    -> expected egress)?
  context: 'A real user produces a consistent ordering of events; a hijacked or poorly-scripted persona
    produces out-of-order or never-seen sequences (Deceive tactic). Correlate Event ID 4624 logons, 4688
    process launches, Zeek dns.log queries, and conn.log sessions to detect persona behavior that is inconsistent
    with expected location, role, or tooling, and enforce the persona''s allowed event-ordering invariants
    so out-of-order or impossible sequences alert. This applies self/non-self and log-sequence anomaly
    detection: deviations from the learned normal sequence indicate the persona is being driven contrary
    to its established pattern, a strong leakage or compromise signal.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dedicated persona management workstations and their network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per persona, ORDER events BY time -> seq = [4624 logon, 4688 proc, dns query, conn session]

      expected = invariants(persona): logon -> approved_process -> approved_egress

      | DETECT seq NOT MATCH expected (out-of-order, missing logon, never-seen transition)

      | ALSO FLAG logon context (geo/role/tooling) inconsistent with persona

      | ALERT severity=MEDIUM msg=''Contradictory persona event sequence'''
- question: Does the persona's activity deviate from its established circadian rhythm and session shape
    - active hours, session duration, interaction cadence, egress byte volume, or failed-logon rate -
    by more than 3 standard deviations or the 99th-percentile control limit?
  context: A credible human persona shows a stable temporal and volumetric signature; sudden deviations
    (such as sustained off-hours activity inconsistent with the intended timezone) suggest the deception
    is degrading or an adversary is operating the account (Deceive tactic). Ingest process and network
    activity per persona and baseline active hours, session duration, events/min cadence, egress bytes,
    and failed-logon rate, then alert when activity exceeds 3 sigma or the empirical 99th-percentile control
    limit. Derive thresholds from local first-party distributions rather than fixed constants, and surface
    contributing factors so the analyst can see which metric drove the alert.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dedicated persona management workstations and their network egress points.'
  range: Last 90 days; baseline over 30-60 days, evaluate daily
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each persona, FROM 4624/4625/4688, conn.log

      | METRICS active_hours, session_duration, events_per_min, egress_bytes, fail_logon_rate

      | BASELINE mean,std,p99 per metric over trailing 30-60d

      | WHERE current > mean+3*std OR current > p99

      | ANNOTATE driving_metric

      | ALERT severity=MEDIUM msg=''Persona circadian/session-shape anomaly'''
- question: Is there significant week-over-week drift in the persona's realism indicators - domain diversity,
    task-timing regularity, session burstiness, login frequency, and content variety - that breaches control
    thresholds?
  context: Non-human regularity, low content diversity, and co-temporal bursts are the documented statistical
    tells that expose a fabricated identity as unnaturally static or scripted (Deceive tactic). Measure
    week-over-week drift in realism indicators and trigger review when cumulative drift breaches control
    thresholds. Rising regularity or falling diversity means the persona is collapsing toward a detectable
    script that an adversary could fingerprint; catching drift early lets operators refresh the persona
    before it becomes stale and outed, preserving the deception.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dedicated persona management workstations and their network egress points.'
  range: Last 180 days; compute weekly drift
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each persona, BIN time SPAN=1w

      | METRICS domain_diversity, timing_regularity, session_burstiness, login_freq, content_variety

      | drift = cumulative |week_t - week_(t-1)| per metric

      | WHERE drift > control_threshold (e.g. EWMA control limit)

      | ALERT severity=LOW msg=''Persona realism drift - schedule refresh/review'''
- question: Does the persona host's actual 24-hour process-execution and network-session volume diverge
    sharply from an ARIMA/LSTM forecast of its expected activity?
  context: A persona whose activity has become implausible - too much, too little, or wrongly timed -
    risks exposing the deception (Deceive tactic). Train an ARIMA or LSTM model on historical process-execution
    and network-session frequency and byte volume per persona host to predict expected 24-hour activity,
    then flag high forecast error as a sign the pattern has become implausible. Persona activity should
    be scheduled as a randomized-yet-plausible policy so it never collapses into a detectable static script.
    Alert text must list the top-3 metrics (e.g., session count, off-hours fraction, egress bytes) driving
    the forecast error so the analyst can act on it.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dedicated persona management workstations and their network egress points.'
  range: Last 90 days; forecast in 24-hour horizons
  queries:
  - technology: ML/forecasting pseudocode
    query: 'model = ARIMA_or_LSTM.fit(history[persona_host]: proc_freq, session_freq, byte_volume)

      yhat = model.predict(next_24h)

      error = |actual - yhat| / sigma

      | WHERE error > threshold

      | REPORT top3_metrics_by_error_contribution

      | ALERT severity=MEDIUM msg=''Persona activity volume implausible vs forecast'''
- question: Does a new persona activity sequence score as low-realism or out-of-prediction when evaluated
    by a sequence model trained on historically accepted persona workflows?
  context: Before an adversary can detect the deception, defenders need to catch persona activity that
    no longer looks like the real, accepted workflow (Deceive tactic). Train a sequence model on historically
    accepted persona workflows to score new activity sequences and escalate low-realism or out-of-prediction
    events, surfacing the specific offending event for the analyst. Complement with a feature-based human-likeness
    classifier whose feature-importance output names the top-3 contributing realism features in the alert.
    A low-realism score means the persona is behaving in a way the model has not seen, indicating leakage,
    hijack, or script staleness.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dedicated persona management workstations and their network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/sequence-model pseudocode
    query: 'seq_model = train(accepted_persona_workflows)  # e.g. DeepLog-style LSTM

      for event in new_sequence: if event NOT IN seq_model.topk_predictions(context): flag(event)

      realism = human_likeness_classifier.score(features(persona_activity))

      | WHERE realism < threshold OR flagged_events>0

      | REPORT offending_event, top3_feature_importance

      | ALERT severity=MEDIUM msg=''Low-realism persona activity'''
- question: When the persona is modeled as a node in a dynamic user-service-activity graph, has its learned
    embedding shifted to indicate it suddenly touches services or relationships outside its established
    neighborhood?
  context: An adversary driving a captured persona, or a persona drifting off-script, will begin interacting
    with services and relationships outside the persona's established graph neighborhood (Deceive tactic).
    Model the persona as a node in a dynamic user-service-activity graph and score temporal change in
    its learned embedding to detect sudden neighborhood departures at low false-positive rates, with the
    contributing graph edges available as explanation. A large embedding shift means the persona's service/relationship
    pattern has changed abruptly - a high-value signal of compromise or deception leakage that the graph
    edges make explainable to the analyst.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dedicated persona management workstations and their network egress points.'
  range: Last 90 days; score embedding change over rolling windows
  queries:
  - technology: ML/graph-model pseudocode
    query: 'G = dynamic_graph(nodes=users+services, edges=activity over time)

      emb_t = DGNN.embed(persona_node, window_t)

      delta = distance(emb_t, emb_(t-1))

      | WHERE delta > anomaly_threshold (low-FP calibrated)

      | REPORT contributing_edges (new services/relationships)

      | ALERT severity=MEDIUM msg=''Persona embedding shift - off-neighborhood service/relationship use'''
