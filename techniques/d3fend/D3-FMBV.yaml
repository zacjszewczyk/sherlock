name: 'D3-FMBV: File Magic Byte Verification'
id: 86ffab2c-bb34-45ad-8f67-6c59590ad26a
description: Investigate files whose true content type — derived from leading magic bytes and deeper structural
  signatures — conflicts with their declared extension or MIME type. Such mismatches indicate masquerading,
  polyglot/chimera, or malformed content that bypasses user trust and static allow/deny controls (MITRE
  ATT&CK T1036.008 Masquerade File Type). This playbook helps an analyst confirm and prioritize file-type
  masquerade by combining a deterministic magic-byte and deep structural validation floor with statistical
  baselining (mismatch-rate, surge, byte-frequency/entropy, and validation-failure monitoring) and machine-learning
  content-type classification and risk scoring. It is oriented toward hardening the enterprise capability
  to validate file types by content rather than extension across endpoints, network transfer points, and
  mail/upload gateways where files cross a trust boundary.
type: technique
related:
- tactic_id: D3-HD
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any files have a true content type, computed from their leading magic bytes, that conflicts
    with their declared file extension or MIME type — including document/image/archive-named files that
    are actually executables, scripts, or shortcuts?
  context: 'This is the deterministic floor for detecting file-type masquerade (T1036.008). For each file
    seen in Zeek files.log/http.log and Sysmon Event ID 11 (FileCreate), compute the content type from
    leading magic bytes using a curated signature database such as libmagic/file, then compare the result
    against an approved extension-to-signature map. Use concrete deterministic signatures (PK\x03\x04
    = zip/OOXML, %PDF = pdf, MZ = PE, \x7fELF = elf, \xFF\xD8\xFF = jpg, \x89PNG = png, \xD0\xCF\x11\xE0
    = MSOLE/legacy Office, #! = script shebang). Alert deterministically on any mismatch and on files
    that carry a declared executable/document extension but have missing or forged magic bytes. A positive
    result (mismatch) is strong evidence of masquerading and supports the Harden goal of validating file
    types by content rather than extension; a clean match lowers but does not eliminate suspicion, since
    polyglots can present a valid header.'
  answer_sources: &id001
  - Zeek files.log
  - Zeek conn.log
  - Zeek http.log
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 15 (FileCreateStreamHash)
  - EDR file-write/file-create telemetry
  - Mail/proxy/upload gateway logs
  - 'NAI: User workstations, network file-transfer points, mail/upload gateways, and download directories
    where files cross a trust boundary.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from file_events (sysmon_id=11 OR zeek_files OR zeek_http)\nlet computed_type = magic_lookup(read_bytes(file,\
      \ 0, 16))   // libmagic/file signatures\nlet declared = ext_to_signature(declared_extension)\nwhere\
      \ computed_type != declared\n   OR (declared in {exe,dll,doc,docx,pdf,...} AND computed_type ==\
      \ 'missing/forged')\nemit alert(file, declared_extension, computed_type, host, user)"
  - technology: Zeek/pseudocode
    query: 'files.log: for each f -> sig = match_signature(f.bof_seen_bytes)

      join http.log on f.fuid for mime_type, uri, filename

      if sig != mime_to_sig(mime_type) or sig != ext_to_sig(filename): notice("MagicByteMismatch", f)'
- question: For declared container, document, and image files, does full structural object validation
    succeed, or do any files validate as more than one format (polyglot/chimera) or present a valid header
    but fail full-structure parsing?
  context: 'Header-only checks are defeated by polyglots and by files that fake a valid magic number.
    Following Garfinkel''s fast object validation, go beyond the header for declared container/document/image
    types: verify magic numbers, length/marker fields, and a successful decode/decompress for ZIP/OOXML,
    MSOLE, JPEG/PNG, and PDF xref structures. Deterministically flag files that validate as MORE THAN
    ONE format (polyglot/chimera) or that present a valid header but fail full-structure parsing. A file
    that parses cleanly as two formats is a classic evasion that hides executable or script payloads inside
    benign-looking containers; a header-valid but structure-invalid file often signals forged or truncated
    content. This deepens the Harden capability beyond simple magic-byte matching to true content validation.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from files where declared in {zip,ooxml,msole,jpg,png,pdf}\nlet v = deep_validate(file)  \
      \ // verify markers, length fields, decode/decompress, pdf xref\nlet formats = all_formats_that_fully_parse(file)\n\
      where count(formats) > 1                      // polyglot/chimera\n   OR (header_valid(file) AND\
      \ v.full_parse == FAIL)\nemit alert(file, formats, v.failure_reason)"
- question: Are there mismatches where executable, script, or LNK/shortcut signatures are hidden behind
    document/image/archive extensions, especially files arriving from new, rare, or first-seen external
    sources or using double extensions or right-to-left-override filenames?
  context: 'Not every mismatch carries equal risk. Escalate any mismatch where executable, script, or
    LNK/shortcut content is concealed behind a document/image/archive extension, and prioritize containment
    when Zeek conn.log context shows the source is external (new or rare external IP, first-seen domain).
    Treat double extensions (e.g., invoice.pdf.exe) and right-to-left-override (U+202E) filenames as deterministic
    escalators because both are deliberate user-deception techniques. A positive here should drive immediate
    containment/quarantine decisions, tying the Harden objective to active defense: an externally delivered
    masquerading executable is a likely initial-access or execution attempt under T1036.008.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from mismatches\nlet hidden_exec = computed_type in {PE,ELF,script,lnk}\n                \
      \  AND declared_extension in {pdf,doc,docx,jpg,png,zip,...}\nlet dbl_ext = filename matches /\\\
      .[a-z0-9]{2,4}\\.(exe|scr|js|lnk|bat|ps1)$/i\nlet rtlo = filename contains U+202E\nwhere hidden_exec\
      \ OR dbl_ext OR rtlo\nset severity = (source_is_external ? CRITICAL : HIGH)\nemit containment_trigger(file,\
      \ host, user, src_ip)"
  - technology: Zeek/pseudocode
    query: "join conn.log on file transfer -> resp_h/orig_h, src_domain\nif src_ip in rare_or_first_seen\
      \ OR domain in first_seen_24h:\n   escalate(file) ; priority = CONTAIN"
- question: Does each file's exact (SHA-256) or fuzzy (ssdeep) hash match a per-declared-type allowlist
    of known-good content, a denylist of known-bad samples, or neither — and how should unknown content
    be routed for further triage?
  context: To reduce noise and surface real threats, maintain per-declared-type allowlists of exact (SHA-256)
    and fuzzy (ssdeep) hashes of known-good content and a denylist of known-bad samples, as operationalized
    at scale by Costin et al. Deterministically clear files matching the known-good allowlist, alert immediately
    on known-bad matches, and route unknown content (no allowlist match) to the statistical and ML layers
    for further triage. Fuzzy hashing catches near-duplicate variants that exact hashing misses. This
    supports the Harden mission by letting analysts trust validated content while concentrating scrutiny
    on novel or known-malicious files.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from files

      let sha = sha256(file); let fz = ssdeep(file)

      if sha in allowlist[declared_type] OR fz ~= allowlist_fuzzy[declared_type]: verdict=CLEARED

      elif sha in denylist OR fz ~= denylist_fuzzy: emit alert(KNOWN_BAD, file)

      else: route_to(statistical_and_ml_triage, file)'
- question: Which users, hosts, or source domains/IPs show a daily magic-byte mismatch rate that exceeds
    the 95th percentile of their own rolling 30-day history?
  context: Statistical baselining catches slow or distributed masquerade activity that single-event rules
    miss. Aggregate magic-byte mismatch counts (mismatches per minute and per day) and validation outcomes
    (pass/fail state) by user, host, and source domain/IP over rolling 30-day baselines. Flag entities
    whose daily mismatch rate exceeds the 95th percentile of their own history, deriving the per-dataset
    percentile threshold from a 30-day learning window. A user or source suddenly producing far more type
    mismatches than their own norm may indicate compromise, a staging point, or a delivery channel for
    masqueraded files — directly informing the Harden capability assessment.
  answer_sources: *id001
  range: Last 90 days (rolling 30-day baseline per entity)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from mismatches by entity in {user,host,source_domain_ip}

      baseline = rolling_30d(daily_mismatch_count per entity)

      p95 = percentile(baseline, 95)

      where today.mismatch_count[entity] > p95

      emit anomaly(entity, today.count, p95)'
- question: Is the enterprise-wide volume of magic-byte mismatches (count and bytes transferred) or the
    concentration of mismatched files toward specific destinations spiking beyond forecasted bands or
    2-sigma control limits?
  context: Campaign-level masquerade activity shows up as enterprise surges rather than per-entity outliers.
    Track total mismatch volume (count and bytes transferred for mismatched files) and destination concentration
    over time. Trigger a campaign-level investigation when volume spikes exceed forecasted bands or 2-sigma
    statistical process-control limits, recalibrating those control limits weekly from first-party Zeek/Sysmon
    history. A coordinated spike, or sudden concentration of mismatched files toward one destination,
    suggests a broad delivery campaign or exfiltration staging and elevates the urgency of the Harden
    response.
  answer_sources: *id001
  range: Last 90 days (weekly control-limit recalibration)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'timeseries = daily(sum(mismatch_count), sum(mismatch_bytes), dest_concentration)

      control_limits = recompute_weekly(mean +/- 2*sigma) from zeek/sysmon history

      forecast = expected_band(timeseries)

      where today > forecast.upper OR today > mean + 2*sigma

      emit campaign_investigation(spike_metric, top_destinations)'
- question: For files without a clean header match, does their per-byte-value frequency distribution or
    Shannon entropy deviate from the baseline for their declared type — for example high-entropy content
    (>7.5 bits/byte) carried under a .txt/.doc/.csv extension?
  context: 'When the header is missing or ambiguous, content statistics provide corroborating evidence.
    For files without a clean header match, compute per-byte-value frequency (binary frequency distribution)
    and Shannon entropy and compare them to per-declared-type baselines, following Masoumi et al. and
    the 22 statistical feature families in Fragments-Expert. Flag high-entropy content (>7.5 bits/byte)
    carried under a non-archive/non-media/non-encrypted extension (e.g., .txt/.doc/.csv) as likely packed
    or encrypted masquerade. CRITICAL caveat: entropy and NIST-style randomness tests cannot by themselves
    separate encrypted from legitimately compressed bytes, so use entropy ONLY as a corroborating signal
    alongside the deterministic and ML layers. A high-entropy file masquerading as plain text strengthens
    the masquerade hypothesis but is not conclusive on its own.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from files where header_match == none\nent = shannon_entropy(file); bfd = byte_freq_distribution(file)\n\
      base = per_declared_type_baseline(declared_extension)\nwhere ent > 7.5 AND declared_extension in\
      \ {txt,doc,csv,...non-archive/media/encrypted}\n   OR bfd_distance(bfd, base) > threshold\nemit\
      \ corroborating_signal(file, ent, bfd)   // NOTE: corroborate only, not standalone"
- question: Are per-host or per-source rates of structural-validation failures and 'unknown' content-type
    verdicts exceeding historical norms (e.g., greater than 3x the median or above the 99th percentile)?
  context: Adversary tooling that forges magic bytes tends to produce elevated parse-failure and unknown-type
    rates rather than clean type matches, so treat these as first-class signals (failure-mode awareness).
    Baseline per-host and per-source rates of structural-validation failures and 'unknown' content-type
    results, then alert when the failure/unknown rate exceeds historical norms — for example more than
    3x the median or above the 99th percentile. A host or source suddenly generating many unparsable or
    unidentifiable files may be running forging tooling or staging crafted payloads. Monitoring these
    failure modes closes a blind spot in the Harden capability, ensuring that 'we could not validate this'
    is itself actionable rather than ignored.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from validation_results by entity in {host, source}

      fail_rate = (parse_fail + unknown_type) / total over window

      base = historical(fail_rate per entity)

      where fail_rate > 3*median(base) OR fail_rate > percentile(base,99)

      emit alert(entity, fail_rate, base.median)'
- question: When a learned byte-content classifier predicts a file's content type, does its calibrated
    top class disagree with the declared extension above a tuned confidence threshold — and what are the
    top-3 contributing byte segments, the competing predicted type, and the calibrated probability?
  context: Machine learning extends content validation to cases deterministic signatures and statistics
    miss, including header-less fragments. Run a learned byte-content classifier inline at transfer/upload
    points and compare its predicted content type to the declared extension. Use Magika (a calibrated
    200+ type CNN) for whole files and FiFTy or a lightweight depthwise-separable CNN for header-less
    fragments. Alert when the classifier's calibrated top class disagrees with the declared type above
    a tuned confidence threshold, and ALWAYS surface in the alert the top-3 contributing byte-segments/features,
    the competing predicted type, and the calibrated probability (explainability) so analysts can validate
    rather than trust an opaque verdict. Run this in parallel with — never replacing — the deterministic
    magic-byte floor. This rounds out the Harden capability with probabilistic content typing for ambiguous
    or fragmented files.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Inference pseudocode
    query: "model = Magika()  // whole files; FiFTy/depthwise-CNN for headerless fragments\npred = model.predict(file_bytes)\
      \   // calibrated top class + probability\nwhere pred.top_class != declared_type AND pred.prob >=\
      \ tuned_threshold\nemit alert(file, declared_type, pred.top_class, pred.prob,\n           top3_byte_segments=pred.explain(),\
      \ competing_type=pred.second)\n// runs in parallel with deterministic magic-byte floor, never replacing\
      \ it"
- question: Using a supervised model trained on labeled mismatch events, which files receive the highest
    masquerade-risk scores for triage and quarantine, and what are the top-3 contributing features behind
    each score?
  context: To prioritize finite analyst effort, train a supervised model on labeled mismatch events using
    features such as signature-mismatch class, source reputation, file size, byte-frequency/entropy descriptors,
    transfer path, and recurrence patterns (feature families per Fragments-Expert; MLP/SVM/KNN comparison
    per Masoumi et al.). Use the model's scores to prioritize triage and quarantine decisions, and emit
    the top-3 contributing features in each alert so analysts can validate the reasoning rather than chase
    an opaque score. High-scoring files concentrate investigative attention on the most likely masquerade
    attempts, directly supporting the Harden mission of efficiently validating file types by content across
    the enterprise.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Inference pseudocode
    query: "features = [mismatch_class, source_reputation, file_size, entropy, byte_freq,\n          \
      \  transfer_path, recurrence]\nscore = supervised_model.predict_proba(features)   // MLP/SVM/KNN\n\
      rank files by score desc\nemit triage_queue(file, score, top3_features=explain(features))\nif score\
      \ >= quarantine_threshold: quarantine(file)"
