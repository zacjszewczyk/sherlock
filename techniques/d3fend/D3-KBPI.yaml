name: 'D3-SCA: System Configuration Analysis'
id: 5d18b0ea-06c7-4012-991d-5ccbe54a8154
description: Investigate the deployment, integrity, and operational effectiveness of kernel-based process
  isolation (D3-KBPI) across the enterprise. This playbook helps an analyst verify that virtualization-based
  security (VBS) and Hypervisor-enforced Code Integrity (HVCI / memory integrity) are enabled and running
  on Windows endpoints, detect bypass or disablement of kernel isolation (e.g., bring-your-own-vulnerable-driver
  loads that pierce HVCI and bootkit tampering that silently flips VBS/HVCI off), and confirm that isolated
  processes and containerized workloads are actually constrained by analyzing their system-call behavior.
  It combines deterministic configuration checks, statistical coverage and failure-rate baselining, and
  machine-learning anomaly scoring to surface coverage gaps, tampering, and processes that escape or misbehave
  within the isolation boundary.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is virtualization-based security (VBS) and Hypervisor-enforced Code Integrity (HVCI/memory
    integrity) verifiably enabled AND running on every Windows endpoint, and which hosts represent coverage
    gaps?
  context: Tactic D3-I (Isolate) depends on VBS/HVCI being not just configured but actively running in
    the kernel. Deterministically assert per host that Win32_DeviceGuard.VirtualizationBasedSecurityStatus
    == 2 (VBS enabled and running) and that SecurityServicesRunning contains 2 (memory integrity/HVCI),
    collected via Get-CimInstance -ClassName Win32_DeviceGuard. Cross-check against the registry value
    HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\EnableVirtualizationBasedSecurity == 1 and Microsoft-Windows-DeviceGuard/Operational
    Event ID 7000. Build an asset-inventory report classifying each host as Enabled-Running / Enabled-Not-Running
    (status 1) / Disabled (status 0) / Unsupported-hardware; any host not at status 2 is a coverage gap
    and an opening for code-integrity bypass and credential theft. A positive result (status 2 plus registry/event
    corroboration) confirms isolation is effective; a negative result is a remediation target. Treat absent
    WDAG Microsoft-Windows-WDAG-PolicyEvaluator-CSP/Operational Event ID 1 as expected on Windows 11 24H2+
    where WDAG is deprecated/removed, not as a failure.
  answer_sources:
  - Win32_DeviceGuard WMI class (Get-CimInstance)
  - HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard registry
  - Microsoft-Windows-DeviceGuard/Operational Event ID 7000
  - Microsoft-Windows-WDAG-PolicyEvaluator-CSP/Operational Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Windows 10/11 Enterprise Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each endpoint:\n  vbs = Win32_DeviceGuard.VirtualizationBasedSecurityStatus\n  hvci =\
      \ (2 IN Win32_DeviceGuard.SecurityServicesRunning)\n  reg = registry[HKLM\\SYSTEM\\CurrentControlSet\\\
      Control\\DeviceGuard\\EnableVirtualizationBasedSecurity]\n  evt = exists(DeviceGuard/Operational\
      \ EventID=7000)\n  IF NOT (vbs == 2 AND hvci AND reg == 1 AND evt):\n    classify host as COVERAGE_GAP\n\
      \    emit asset_report(host, vbs, hvci, reg, evt)"
  - technology: PowerShell/pseudocode
    query: "Get-CimInstance -ClassName Win32_DeviceGuard |\n  Select VirtualizationBasedSecurityStatus,\
      \ SecurityServicesRunning |\n  Where { $_.VirtualizationBasedSecurityStatus -ne 2 -or 2 -notin $_.SecurityServicesRunning\
      \ }"
- question: Has there been an abrupt drop in the percentage of hosts running VBS/HVCI, or do specific
    users route an anomalously low share of their browsing through isolated (WDAG) containers, indicating
    a bad update, mass-disable event, or isolation bypass?
  context: For the Isolate tactic, a sudden fleet-wide decline in protection coverage is a strong signal
    of a problematic update or an attacker mass-disabling isolation. Maintain a daily enterprise time
    series of the count/percentage of hosts at VBS status 2 and apply change-point detection (CUSUM/PELT/Bayesian
    online CPD) to flag abrupt drops. In parallel, for WDAG-capable fleets correlate Windows Event ID
    4688 for msedge.exe launched with --wdag-container-id against Zeek conn.log flows from that host,
    and compute per user the ratio of byte volume from isolated vs non-isolated processes; flag users
    below the organization's 25th percentile (Volume metric) as possible bypass or training gaps. Derive
    both thresholds from 30 days of your own baseline. A detected change point or low-ratio user warrants
    investigation into recent KBs, GPO changes, or deliberate tampering.
  answer_sources:
  - Win32_DeviceGuard WMI class (Get-CimInstance)
  - HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard registry
  - Microsoft-Windows-DeviceGuard/Operational Event ID 7000
  - Microsoft-Windows-WDAG-PolicyEvaluator-CSP/Operational Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Windows 10/11 Enterprise Endpoints'
  range: Last 90 days (daily time series; baseline from 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = daily_count(hosts WHERE VBS_status == 2) / daily_count(all_hosts)

      cp = change_point_detect(series, method=PELT)   // or CUSUM / Bayesian online CPD

      ALERT IF cp.detected AND series[after] < series[before]'
  - technology: SIEM/Stats pseudocode
    query: "FOR each user:\n  iso_bytes  = SUM(conn.log bytes WHERE host launched msedge.exe with --wdag-container-id\
      \ [EID 4688])\n  total_bytes= SUM(conn.log bytes for user host)\n  ratio = iso_bytes / total_bytes\n\
      ALERT IF ratio < percentile(all_user_ratios, 25)"
- question: Is the daily count of VBS/HVCI error events exceeding its forecast upper confidence bound,
    signalling a systemic misconfiguration or a problematic build/KB rollout?
  context: Within the Isolate tactic, a rising tide of code-integrity/VBS error events often precedes
    or accompanies widespread loss of protection. Fit a time-series forecasting model (ARIMA/Prophet)
    to the daily count of VBS/HVCI error events (e.g., Microsoft-Windows-DeviceGuard/Operational failures
    and crash/WHEA hardware-error events) and alert when the observed count exceeds the predicted upper
    confidence interval. The alert MUST surface the top-3 contributing factors (the specific build/KB
    correlated with the spike, the OU/hardware model most affected, and the dominant error code) so responders
    can triage without re-querying. Exceedance indicates a systemic problem worth correlating to a recent
    change; staying within the band indicates normal noise.
  answer_sources:
  - Win32_DeviceGuard WMI class (Get-CimInstance)
  - HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard registry
  - Microsoft-Windows-DeviceGuard/Operational Event ID 7000
  - Microsoft-Windows-WDAG-PolicyEvaluator-CSP/Operational Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Windows 10/11 Enterprise Endpoints'
  range: Last 90 days (daily aggregation for forecasting)
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = daily_count(DeviceGuard/Operational failures + WHEA crash events)\nmodel = fit(ARIMA\
      \ or Prophet, series[train_window])\nforecast, upper_ci = predict(model, today)\nIF observed_today\
      \ > upper_ci:\n  ALERT with top3_factors = rank_by_contribution([build_KB, OU/hardware_model, error_code])"
- question: Are vulnerable/blocklisted drivers being loaded, or is a host's VBS/HVCI status transitioning
    from running (2) to disabled/not-running (0/1), indicating a BYOVD bypass or bootkit tampering that
    defeats kernel isolation?
  context: Under the Isolate tactic, the two principal ways isolation fails are bring-your-own-vulnerable-driver
    (BYOVD) loads that pierce HVCI and outright disablement of VBS/HVCI by bootkits. Enforce the Microsoft
    recommended driver block rules (Vulnerable Driver Blocklist) under HVCI and alert on Microsoft-Windows-CodeIntegrity/Operational
    block events (3077) and on Sysmon Event ID 6 driver loads whose hash/signer matches the blocklist
    or that load from user-writable paths. Separately, raise a high-severity alert whenever a host's Win32_DeviceGuard.VirtualizationBasedSecurityStatus
    transitions from 2 to 0/1 between consecutive polls, or HVCI stops running — the bypass pattern used
    by bootkits (e.g., BlackLotus) that disable HVCI/BitLocker/Defender. Where a hardware root of trust
    is available, compare kernel text/syscall-table hashes against a known-good baseline. A status transition
    or blocklisted-driver load is a strong tampering indicator demanding immediate triage.
  answer_sources:
  - Sysmon Event ID 6 (Driver Load)
  - Sysmon Event ID 7045 / System log (kernel service install)
  - Win32_DeviceGuard WMI class (Get-CimInstance)
  - Microsoft-Windows-CodeIntegrity/Operational Event ID 3077/3033
  - Microsoft-Windows-DeviceGuard/Operational
  - 'NAI: Windows 10/11 Enterprise Endpoints and Servers'
  range: Last 90 days (poll VBS status at least daily)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// BYOVD / blocklisted driver load\nALERT IF (Sysmon EID=6 OR CodeIntegrity EID=3077)\n  AND\
      \ (driver.hash IN VulnerableDriverBlocklist\n       OR driver.signer IN VulnerableDriverBlocklist\n\
      \       OR driver.path MATCHES user_writable_path)"
  - technology: SIEM/Rule pseudocode
    query: '// Isolation status transition (bootkit disable)

      FOR each host: prev = last_poll.VBS_status; cur = this_poll.VBS_status

      ALERT severity=HIGH IF prev == 2 AND cur IN (0,1)

      ALERT severity=HIGH IF HVCI was running AND now not running

      // optional: compare kernel_text_hash vs known_good_baseline'
- question: Is a host or the fleet experiencing a statistically abnormal burst of blocked driver loads,
    rare kernel-service installs, or VBS-disable transitions relative to the learned-normal failure baseline?
  context: For the Isolate tactic, isolated bursts of failure events are leading indicators of active
    bypass attempts. Track per-host and enterprise counts/min of blocked driver loads (CodeIntegrity 3077),
    new kernel-service installs (Event ID 7045) pointing to rare driver paths, and VBS-disable transitions;
    apply change-point detection to flag bursts that deviate from the learned-normal failure baseline.
    A host that suddenly produces blocked-load failures, or a fleet-wide spike in disable events, is prioritized
    for investigation. Negative result (counts within baseline) suggests normal patch/driver churn; positive
    result suggests coordinated tampering or a campaign exploiting a specific vulnerable driver.
  answer_sources:
  - Sysmon Event ID 6 (Driver Load)
  - Sysmon Event ID 7045 / System log (kernel service install)
  - Win32_DeviceGuard WMI class (Get-CimInstance)
  - Microsoft-Windows-CodeIntegrity/Operational Event ID 3077/3033
  - Microsoft-Windows-DeviceGuard/Operational
  - 'NAI: Windows 10/11 Enterprise Endpoints and Servers'
  range: Last 90 days (per-minute counts; baseline from history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host AND enterprise:\n  blocked = count_per_min(CodeIntegrity EID=3077)\n  newsvc\
      \  = count_per_min(EID=7045 WHERE driver.path IS rare)\n  disables= count_per_min(VBS transition\
      \ 2 -> 0/1)\n  cp = change_point_detect(blocked + newsvc + disables)\n  ALERT IF cp.detected AND\
      \ level > learned_normal_baseline"
- question: Does a host's whole-system provenance graph drift outside its benign evolution envelope in
    a way consistent with kernel-isolation tampering (e.g., a boot/driver-install subgraph that disables
    security services)?
  context: For the Isolate tactic, sophisticated actors chain low-level actions (driver install, service
    disable, VBS status change) that individually look benign but together form a tampering subgraph.
    Build streaming whole-system provenance graphs from kernel audit/Sysmon events and compute Weisfeiler-Lehman
    subtree-kernel sketches; flag a host whose graph sketch drifts outside its benign evolution envelope,
    e.g., a boot/driver-install subgraph that disables security services (the UNICORN APT-detection approach).
    The alert must list the top-3 contributing subgraph features (new kernel service, blocked driver,
    VBS status edge) for explainability so responders can act without re-deriving the graph. Drift beyond
    the envelope indicates likely tampering; staying inside indicates normal system evolution.
  answer_sources:
  - Sysmon Event ID 6 (Driver Load)
  - Sysmon Event ID 7045 / System log (kernel service install)
  - Win32_DeviceGuard WMI class (Get-CimInstance)
  - Microsoft-Windows-CodeIntegrity/Operational Event ID 3077/3033
  - Microsoft-Windows-DeviceGuard/Operational
  - 'NAI: Windows 10/11 Enterprise Endpoints and Servers'
  range: Last 90 days (streaming provenance, sliding evolution window)
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph = build_provenance_graph(kernel_audit + Sysmon events)  // streaming\nsketch = weisfeiler_lehman_subtree_kernel(graph)\n\
      IF sketch OUTSIDE benign_evolution_envelope(host):\n  ALERT top3_features = rank([new_kernel_service,\
      \ blocked_driver, VBS_status_edge])"
- question: Are isolated processes making API/system calls outside their expected allow-list (target,
    return address, instruction type), indicating the process is escaping or misbehaving within the isolation
    boundary?
  context: Within the Isolate tactic, isolation is only effective if isolated processes/containers stay
    within their expected behavior. For each isolated process establish an allow-list of expected API/system
    calls (target, return address, instruction type) by disassembly/profiling, and deny or alert on out-of-policy
    privileged calls. Capture syscall type, parameters, calling-thread context, target path, memory range,
    and socket info at the kernel boundary and match against known-bad sequences. An out-of-policy privileged
    call (e.g., an unexpected ptrace, mprotect to RWX, or a socket call from a process that should never
    network) is a strong sign of exploitation, injection, or sandbox escape. This deterministic allow-list
    serves as the floor beneath the statistical and ML layers.
  answer_sources:
  - Linux auditd / eBPF syscall traces
  - Sysmon / ETW process and call telemetry
  - Container runtime syscall logs (sysdig/Falco)
  - 'NAI: Isolated processes and containerized workloads'
  range: Last 90 days
  queries:
  - technology: Falco/auditd pseudocode
    query: "FOR each isolated process P:\n  allow = profile(P).expected_calls   // {target, return_addr,\
      \ instr_type}\n  ON syscall s FROM P:\n    record(type, params, thread_ctx, target_path, mem_range,\
      \ socket)\n    IF s NOT IN allow OR s MATCHES known_bad_sequence:\n      ALERT/DENY out_of_policy_call(P,\
      \ s)"
- question: Does an isolated process or container's syscall-frequency distribution deviate from its learned-normal
    baseline, or diverge from identically-configured replicas, beyond a statistical threshold?
  context: For the Isolate tactic, behavioral drift in syscall usage reveals processes that have been
    compromised or are escaping isolation even when individual calls look legitimate. Represent each isolated
    process/container's behavior as sliding-window syscall-frequency vectors (Bag of System Calls) and
    alert when the distribution deviates from the learned-normal bag beyond a chi-square/cosine threshold;
    use frequency-weighted sequence models (t-stide) on the same stream. For identically-configured fleets,
    compare live kernel-event distributions across replicas and flag the diverging instance without a
    trained model (the ReplicaWatcher approach). Track Volume (syscalls/window), Frequency (syscalls/min),
    and State (failed/blocked syscall return codes) metrics. A divergent replica or out-of-envelope distribution
    warrants inspection; consistent distributions across replicas indicate healthy isolation.
  answer_sources:
  - Linux auditd / eBPF syscall traces
  - Sysmon / ETW process and call telemetry
  - Container runtime syscall logs (sysdig/Falco)
  - 'NAI: Isolated processes and containerized workloads'
  range: Last 90 days (sliding windows; baseline from learned-normal)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each isolated process/container:\n  vec = bag_of_system_calls(sliding_window)\n  dist\
      \ = chi_square_or_cosine(vec, learned_normal_bag)\n  ALERT IF dist > threshold\n  // also t-stide\
      \ frequency-weighted sequence score\n  metrics = {Volume: calls/window, Frequency: calls/min, State:\
      \ failed/blocked returns}"
  - technology: SIEM/Stats pseudocode
    query: "// training-less cross-replica comparison (ReplicaWatcher)\nFOR each replica set R (identically\
      \ configured):\n  dists = {r: syscall_distribution(r) for r in R}\n  ALERT replica r IF dists[r]\
      \ diverges from median(dists) beyond threshold"
- question: Do syscall sequences from isolated processes score as low-probability/anomalous under sequence
    models (HMM, call-stack-enriched HMM, or n-gram/embedding classifiers), indicating intrusion within
    the isolation boundary?
  context: For the Isolate tactic, machine-learning sequence models catch novel attack patterns that allow-lists
    and frequency checks miss. Score syscall sequences from isolated processes with HMMs and call-stack-enriched
    HMMs, emitting low-probability-sequence anomalies; for containers use modern n-gram/frequency/embedding
    representations with a supervised classifier. Layer ML in parallel with the allow-list floor (so the
    deterministic guarantees remain) and surface the top-3 contributing syscall features in each alert
    for explainability. A low-probability sequence flags a process behaving unlike its trained-normal
    model — a candidate for injection, exploitation, or escape; high-probability sequences indicate normal
    operation.
  answer_sources:
  - Linux auditd / eBPF syscall traces
  - Sysmon / ETW process and call telemetry
  - Container runtime syscall logs (sysdig/Falco)
  - 'NAI: Isolated processes and containerized workloads'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FOR each isolated process:\n  seq = syscall_sequence(+ call_stack)\n  p = hmm_score(seq) \
      \           // or call-stack-enriched HMM\n  // containers: classifier(ngram/freq/embedding(seq))\n\
      \  IF p < low_prob_threshold:\n    ALERT anomaly with top3_syscall_features(seq)"
