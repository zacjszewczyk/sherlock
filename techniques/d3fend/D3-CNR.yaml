name: 'D3-CNR: Content Rebuild'
id: 999a3c8e-84f4-4244-916b-8027eceee447
description: Investigate the effectiveness and integrity of Content Disarm and Reconstruction (CDR) controls
  that rebuild inbound documents to spec so that any unreferenced, active, or malicious components are
  removed. This playbook helps an analyst confirm that every high-risk inbound file (Office macro-enabled
  documents, script-bearing archives, PDFs with active actions, images with appended/steganographic data)
  is decomposed and reconstructed into a sanitized, spec-conformant artifact with intact transaction lineage;
  that the rebuilt output truly contains zero active content; and that reconstructions are not failing,
  partially completing, or silently bypassing into pass-through delivery. It guides the analyst through
  correlating file intake with rebuilt output, verifying active-content removal, alerting on failed/partial/bypassed
  reconstruction, flagging parser-confusion, polyglots and format mismatches, baselining rebuild latency
  and volume/size-ratio deviations, profiling active-content prevalence and strip rates, and applying
  explainable machine-learning scoring and pipeline log-sequence anomaly detection to surface evasion
  of the CDR control.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: For every high-risk inbound document, is there exactly one matching CDR reconstruction record,
    and are any files being delivered with no corresponding rebuild event (a CDR bypass)?
  context: 'CDR is a spec-driven rebuild that reassembles only allow-listed objects, so in the Isolate
    context every high-risk intake must map to exactly one rebuild record. Correlate inbound files in
    Zeek files.log (joining on fuid, tx_hosts, mime_type, and seen_bytes) with Windows Event ID 4663 access
    events in the CDR input and output paths, and require a matching rebuilt-artifact event before marking
    the transaction complete. A delivered file with no reconstruction record is the primary bypass signal:
    the payload reached the user without ever being disarmed. A positive result (every intake mapped to
    one rebuild) confirms the control is engaged; orphaned deliveries indicate the isolation control was
    skipped and the file must be retrospectively re-scanned and quarantined. References: [Content Disarm
    and Reconstruction of PDF Files](https://ieeexplore.ieee.org/document/10103531).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'intake = Zeek.files.log | fields fuid, tx_hosts, mime_type, seen_bytes

      rebuild = WinEvent(4663) where ObjectPath in (CDR_input_paths, CDR_output_paths)

      join intake to rebuild on (fuid | filename | hash)

      alert where count(rebuild_output_event) == 0  // delivered with no reconstruction record'
  - technology: Zeek/pseudocode
    query: "for f in files.log:\n  if f.mime_type in HIGH_RISK_TYPES and not exists(cdr_rebuild_record[f.fuid]):\n\
      \    emit bypass_alert(f.fuid, f.tx_hosts, f.mime_type)"
- question: Does each sanitized CDR output artifact contain ZERO active-content indicators before it is
    delivered, or did the rebuild leak active content (macros, JavaScript, OpenAction, DDE, embedded objects)?
  context: 'After reconstruction, re-scan each sanitized output and require zero active-content indicators
    before delivery; any surviving indicator means the rebuild leaked active content and the Isolate control
    failed. For PDFs assert pdfid counts of /JS, /JavaScript, /OpenAction, /AA, /Launch, /EmbeddedFile,
    /RichMedia, and /ObjStm are all 0. For Office documents assert olevba/mraptor find no VBA auto-exec
    (AutoOpen/Document_Open/Workbook_Open), no Shell/CreateObject/URLDownloadToFile, no DDE, and no remaining
    embedded objects. A positive (clean) result confirms the artifact is safe; any non-zero indicator
    should trigger an immediate alert and quarantine because active content survived disarming. References:
    [PDF Tools, pdfid/pdf-parser](https://blog.didierstevens.com/programs/pdf-tools/), [oletools](https://github.com/decalage2/oletools),
    [Content Disarm and Reconstruction of PDF Files](https://ieeexplore.ieee.org/document/10103531).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: CDR/Verification pseudocode
    query: "for out in rebuilt_outputs:\n  if mime(out) == PDF:\n    c = pdfid(out)\n    assert c[/JS]+c[/JavaScript]+c[/OpenAction]+c[/AA]+c[/Launch]+c[/EmbeddedFile]+c[/RichMedia]+c[/ObjStm]\
      \ == 0\n  elif mime(out) in OFFICE:\n    r = olevba(out)\n    assert no(AutoOpen|Document_Open|Workbook_Open|Shell|CreateObject|URLDownloadToFile|DDE|embedded_object)\n\
      \  on assertion_fail: alert + quarantine(out)"
- question: Is the CDR reconstruction failure/bypass rate exceeding tolerance, or are high-risk file types
    being delivered without a reconstruction record?
  context: 'Maintain per-gateway and per-file-type counters for successful, failed, partial, and bypassed
    (passed-through) rebuilds. In the Isolate context, failure or fallback to pass-through is a distinct,
    high-severity signal because detection-by-parsing is fragile and attackers deliberately target parser
    edge cases to force the engine to give up and deliver the original file. Generate an alert when the
    failure+bypass rate exceeds 5% in one hour, or when any high-risk file type (Office macro-enabled,
    script-bearing archive, PDF with /OpenAction) is delivered without a corresponding reconstruction
    record. Spec-conformant rebuild should otherwise neutralize active content near-completely, so elevated
    failure/bypass means evasion or engine breakage is underway. References: [Abusing File Processing
    in Malware Detectors](https://www.ieee-security.org/TC/SP2012/papers/4681a080.pdf), [Content Disarm
    and Reconstruction of PDF Files](https://ieeexplore.ieee.org/document/10103531).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 30 days (1-hour tumbling windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'bucket = tumbling_window(1h) by gateway, file_type

      rate = (count(status in [failed, bypassed])) / count(all)

      alert where rate > 0.05

      alert where file_type in HIGH_RISK and status == delivered and rebuild_record is null'
- question: Do any inbound files show parser confusion, polyglot structure, or declared-vs-resolved format
    mismatch that CDR is designed to drop?
  context: 'Compare the declared MIME/magic of each intake (Zeek files.log mime_type) against the structure
    the CDR parser actually resolved, and alert when they disagree, when a file validly parses as two
    formats (polyglot), or when the engine logs structural exceptions such as mismatched xref, trailing
    bytes after the image EOI marker, or oversized/malformed metadata chunks. These format-confusion conditions
    are the core CDR evasion vector and the class of hidden payloads (appended/steganographic data, polyglots)
    that spec-driven rebuild is meant to remove in the Isolate context. A mismatch or structural exception
    is a strong indicator of a crafted file attempting to smuggle a payload past the parser. References:
    [Abusing File Processing in Malware Detectors](https://www.ieee-security.org/TC/SP2012/papers/4681a080.pdf),
    [Open Image Content Disarm And Reconstruction](https://arxiv.org/abs/2307.14057).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for f in intake:\n  declared = zeek.mime_type[f]\n  resolved = cdr.parser_resolved_format[f]\n\
      \  if declared != resolved or cdr.polyglot[f] or cdr.struct_exception[f] in (xref_mismatch, trailing_bytes_after_EOI,\
      \ malformed_metadata):\n    alert(f, declared, resolved)"
- question: Is CDR rebuild latency for any document class breaching its established p99 baseline, indicating
    engine degradation or crafted inputs forcing expensive parser paths?
  context: 'For each successfully rebuilt file compute processing latency from the first Zeek file sighting
    to the sanitized-output write event. Track mean, median, 95th, and 99th percentile by MIME type and
    gateway, and alert on sustained breaches of the p99 baseline. In the Isolate context a latency surge
    indicates either engine degradation or, more concerning, crafted inputs deliberately forcing expensive
    parser paths (algorithmic-complexity abuse) as a precursor to evasion or denial. Compare against the
    file''s own document-class baseline rather than a global value. References: [Content Disarm and Reconstruction
    of PDF Files](https://ieeexplore.ieee.org/document/10103531).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'latency = ts(output_write_event) - ts(first_zeek_sighting)

      baseline = percentile(latency, 99) by mime_type, gateway over trailing 30d

      alert where rolling_median(latency, 15m) > baseline sustained'
- question: Are reconstructed-file volume, output/input size-ratio, or carrier entropy deviating from
    baseline in ways that suggest outage, bypass, or hidden embedded data?
  context: 'Build hourly throughput baselines for reconstructed files with rolling confidence intervals;
    escalate sustained under-volume (potential outage/bypass) and over-volume (delivery campaign). For
    each file compute the output/input byte-size ratio and carrier entropy. Because rebuild normally shrinks
    files by removing active content in the Isolate context, a near-1.0 or >1.0 size ratio, or high carrier
    entropy (commonly >7.0, indicating encrypted/embedded data), is an outlier worth review. Image re-encoding
    size/quality deltas similarly localize tampering. These statistics catch both control outages and
    crafted carriers smuggling hidden payloads. References: [Baseline Payload Entropy Values for Common
    Internet Services](https://www.mdpi.com/1999-5903/16/12/470), [Open Image Content Disarm And Reconstruction](https://arxiv.org/abs/2307.14057).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hourly = count(rebuilt) by hour

      alert where hourly < lower_CI or hourly > upper_CI

      ratio = out_bytes / in_bytes ; entropy = shannon(carrier_bytes)

      alert where ratio >= 1.0 or entropy > 7.0'
- question: What fraction of inbound documents carry active content (macros, JavaScript, DDE, embedded
    objects), and are strip rates or failure/bypass rates surging in ways that precede a campaign or reveal
    evasion?
  context: 'Establish baselines for the fraction of inbound documents carrying macros, JavaScript, DDE,
    or embedded objects (the strip rate) and for the rebuild failure/bypass rate, per gateway and per
    sender population. In the Isolate context, surges in active-content prevalence frequently precede
    campaigns, while shifts in failure rate reveal evasion attempts or engine breakage. Derive thresholds
    with standard-deviation/percentile methods over your own event aggregates rather than fixed global
    values, so the alert reflects your environment''s normal traffic. References: [Invoice #31415 attached:
    Automated analysis of malicious Microsoft Office documents](https://doi.org/10.1016/j.cose.2021.102582),
    [Hidost](https://jis-eurasipjournals.springeropen.com/articles/10.1186/s13635-016-0045-0), [Finding
    Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'strip_rate = count(active_content_present) / count(all) by gateway, sender_pop

      fail_rate = count(status in [failed, bypassed]) / count(all)

      baseline = mean +/- 3*stddev over trailing 30d

      alert where strip_rate or fail_rate exceeds baseline'
- question: Which rebuilt files are most likely to have carried a malicious embedded payload, according
    to an explainable classifier, and what features drove that score?
  context: 'Train a classifier on file metadata and reconstruction outcomes to rank rebuilt files most
    likely to have carried a malicious payload for analyst review in the Isolate context. Use structural-path
    features (e.g., /Catalog/OpenAction/JS presence) plus VBA/document features: auto-exec keywords, suspicious
    APIs (Shell/CreateObject/URLDownloadToFile), string entropy, and obfuscated-string and nested-object
    counts. Emit the top-3 contributing features in each alert for explainability. Keep this advisory
    and parallel to the deterministic verification floor, because such classifiers are evadable and should
    never replace the zero-active-content assertion. References: [Hidost](https://jis-eurasipjournals.springeropen.com/articles/10.1186/s13635-016-0045-0),
    [Macro Malware Detection using Machine Learning Techniques](https://www.scitepress.org/papers/2017/61322/61322.pdf),
    [Invoice #31415 attached: Automated analysis of malicious Microsoft Office documents](https://doi.org/10.1016/j.cose.2021.102582),
    [Towards Adversarial Malware Detection](https://arxiv.org/abs/1811.00830).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [struct_paths(/Catalog/OpenAction/JS,...), vba_autoexec_kw, suspicious_api_count,\n\
      \           string_entropy, obfuscated_string_count, nested_object_count, rebuild_outcome]\nscore\
      \ = classifier.predict_proba(features)\nrank desc; for top scores emit alert with top-3 SHAP features\
      \ (advisory only)"
- question: Do the CDR pipeline log sequences deviate from the normal parse -> decompose -> strip -> rebuild
    -> verify -> deliver order, indicating retries, skipped verification, or unexpected fallback paths?
  context: 'Model the normal sequence of CDR engine log keys per document (parse -> decompose -> strip
    -> rebuild -> verify -> deliver) and flag out-of-distribution sequences such as repeated parser retries,
    skipped verify steps, or unexpected fallback paths. In the Isolate context these sequence anomalies
    reveal an engine being pushed off its happy path, which is exactly how evasion of a rebuild control
    manifests. Complement with autoencoder/ensemble reconstruction-error scoring over per-hour pipeline
    feature vectors (volume, latency, strip-rate, size-ratio), alerting above the 99th-percentile error
    and surfacing the top contributing features for explainability. References: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf),
    [Practical Autoencoder-Based Anomaly Detection by Using Vector Reconstruction Error](https://link.springer.com/article/10.1186/s42400-022-00134-9),
    [Kitsune](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - CDR engine application logs
  - 'NAI: Email and web gateways; dedicated Content Disarm and Reconstruction (CDR) servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered_log_keys_per_document

      flag where seq not in learned_normal_sequences  // e.g., skipped verify, repeated retries, fallback

      vec = per_hour[volume, latency, strip_rate, size_ratio]

      err = autoencoder.reconstruction_error(vec)

      alert where err > p99; report top contributing features'
