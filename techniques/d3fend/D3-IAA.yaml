name: 'D3-IAA: Identifier Activity Analysis'
id: 9e0d92fd-36b7-4105-ae15-82aaa5b0f8e7
description: 'Investigate the presence and impact of known malicious identifiers — file/driver hashes,
  IP addresses, domains, URLs, and durable TLS/JA fingerprints — across network, endpoint, and cloud telemetry,
  and measure how effective our identifier-detection process actually is. This playbook helps an analyst
  (1) perform deterministic indicator-of-compromise matching of curated threat intelligence (STIX/TAXII
  feeds, YARA/IOC rule bases, LOLDrivers, JA3/JA3S/JA4+ fingerprints) against Zeek conn/dns/ssl logs,
  Sysmon (EID 3/6/7), and Windows security/firewall events; (2) corroborate hits across multiple telemetry
  sources within a tight time window and curate out noise from parked domains and security sinkholes;
  (3) monitor telemetry collection coverage, per-feed quality, IOC decay, and indicator failure-modes
  (NXDOMAIN, blocked/RST connections, HTTP errors, failed logons) so blind sensors and stale feeds do
  not create silent false negatives; and (4) layer statistical and machine-learning scoring — multi-engine
  label stabilization, DNS prevalence/novelty/fast-flux features, passive-DNS reputation models, and IOC
  relevance ranking — in parallel with the non-negotiable deterministic match floor, so agile adversary
  infrastructure can be flagged before it ever lands on a blacklist. It is grounded in David Bianco''s
  Pyramid of Pain: deterministic hash/IP/domain matching is the floor, while durable fingerprints and
  behavioral scoring push detection higher up the pyramid where adversaries pay a greater cost to evade.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
