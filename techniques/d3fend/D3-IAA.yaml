questions:
- question: Which network connections, DNS queries, and process/firewall events directly match known-malicious
    IP addresses, domains, URLs, or hashes from our normalized threat-intelligence feeds, and what host
    and user context surrounds each confirmed match?
  context: Within the Detect (D3-D) tactic, deterministic indicator-of-compromise matching is the non-negotiable
    floor of identifier activity analysis. Ingest malicious IP/domain/URL/hash intelligence as normalized
    STIX patterns from your STIX/TAXII feeds and perform direct joins against Zeek conn.log destination
    IPs, Zeek dns.log queries, Sysmon Event ID 3 network connections, and Windows Event ID 5156 source/destination
    addresses. A positive result is a confirmed contact between an internal asset and a known-bad identifier,
    which should be treated as a potential incident and immediately enriched with the host, user, process,
    and timeline around the hit. This sits at the base of David Bianco's Pyramid of Pain — easy for adversaries
    to rotate — so it must remain the deterministic floor regardless of any scoring layered on top; a
    negative result never proves cleanliness, only that this specific identifier was not seen.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from (zeek_conn OR zeek_dns OR sysmon_eid3 OR win_eid_5156)

      | normalize identifiers: dest_ip, query_domain, url, dest_addr

      | lookup ti_iocs (from STIX/TAXII, normalized STIX patterns) on identifier

      | where ioc_match == true

      | enrich host, user, process_image, parent_process, geo

      | eval severity = "potential_incident"

      | output match, identifier, feed_source, host, user, first_seen, last_seen'
- question: Do any loaded images, drivers, or newly installed services on our endpoints have file or driver
    hashes (SHA256/SHA1/MD5) that match curated YARA/IOC rule bases or known-vulnerable/malicious driver
    lists, and what is the signer metadata on those binaries?
  context: Within the Detect (D3-D) tactic, hash matching catches known-malicious executables, DLLs, and
    kernel drivers as they execute. Match file/process hashes against curated IOC rule bases such as Neo23x0
    Signature-Base and driver hashes from LOLDrivers against Sysmon Event ID 7 (image load), Sysmon Event
    ID 6 / Code Integrity (driver load), and Windows Event ID 7045 (service install). A positive finding
    is any hash match on an executable, DLL, or kernel driver — surface the signer/publisher metadata
    alongside it, because a signed but known-vulnerable driver (BYOVD) is a high-value abuse path. Like
    all hash IOCs this sits low on the Pyramid of Pain and is trivially changed by recompilation, so absence
    of a match is not evidence of safety, but a match is high-precision and warrants immediate triage.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from (sysmon_eid7 image_load OR sysmon_eid6 driver_load OR win_eid_7045 service_install)

      | normalize hashes: sha256, sha1, md5

      | lookup ioc_hashes (Signature-Base, LOLDrivers) on (sha256 OR sha1 OR md5)

      | where hash_match == true

      | eval type = case(driver_load, "kernel_driver", service_install, "service", "image")

      | output match, file_path, type, signer, signature_status, host, user'
- question: Are any TLS sessions presenting JA3/JA3S or JA4+ fingerprints that match known-malicious C2
    framework signatures (e.g., Cobalt Strike, Metasploit), even when the destination IP, domain, and
    certificate have rotated?
  context: Within the Detect (D3-D) tactic, TLS/JA fingerprint matching pushes detection higher on the
    Pyramid of Pain toward durable network identifiers that adversaries cannot cheaply change. Compute
    and match JA3/JA3S and randomization-resilient JA4+ fingerprints from Zeek ssl.log against a library
    of known-bad C2 framework fingerprints. A positive result is a TLS handshake whose client/server fingerprint
    matches a known malicious tool even though the IP/domain/certificate have all changed — this is far
    more resilient than IP or domain matching because the fingerprint reflects the TLS stack/library behavior
    of the malware itself. Treat matches to known C2 frameworks as high-confidence beaconing candidates
    and pivot to the conn.log flow for volume and periodicity.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from zeek_ssl

      | compute ja3, ja3s, ja4, ja4s

      | lookup c2_fingerprints (Cobalt Strike, Metasploit, etc.) on (ja3 OR ja3s OR ja4)

      | where fp_match == true

      | join zeek_conn on uid -> bytes, duration, periodicity

      | output match, fp, framework, src, dest, server_name, cert_subject'
- question: Which IOC matches appear across multiple independent telemetry sources — for example a DNS
    query plus an outbound network connection plus a firewall event — for the same identifier within a
    short correlation window, indicating stronger evidence of genuine malicious activity?
  context: Within the Detect (D3-D) tactic, multi-source corroboration raises confidence above a single
    isolated hit and helps separate true activity from feed noise. Escalate matches that appear across
    multiple telemetry sources (for example, a Zeek dns.log query, a Zeek conn.log/Sysmon EID 3 network
    connection, and a Windows 5156 firewall event) for the same identifier within a short time window
    — default 5 minutes, tuned per environment. A positive result is the same malicious identifier observed
    through several lenses nearly simultaneously, which strongly indicates a real resolve-then-connect
    chain rather than a stray log artifact. A single-source hit is still worth reviewing but a corroborated
    hit should be prioritized for analyst triage and incident escalation.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days; correlate events within a 5-minute window per identifier (tune per environment)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from ioc_matches (all sources)

      | bin _time span=5m, group by identifier, host

      | stats dc(source) as source_count, values(source) as sources by identifier, host, window

      | where source_count >= 2

      | eval confidence = "corroborated"

      | sort -source_count'
- question: Of the domain/IP IOC hits we have generated, which ones actually resolve to parked domains
    or security-organization sinkholes and should therefore be suppressed or downgraded before being treated
    as malicious activity?
  context: Within the Detect (D3-D) tactic, curation prevents wasted triage on misleading hits. Research
    such as 'Paint it Black' shows parked domains and sinkholes constitute a large fraction of blacklist
    entries and produce hits that look like contact with bad infrastructure but actually represent benign/neutralized
    destinations. Before treating a domain/IP IOC hit as malicious, check it against a deterministic allow/known-sinkhole
    list (parking name servers, common sinkhole IP ranges) and tag affected matches so they are suppressed
    or downgraded. A positive result here means a hit that should NOT be escalated as live adversary activity
    — though a host repeatedly contacting a sinkhole for a domain that was previously its C2 is itself
    a strong infection signal worth investigating separately.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from domain_ip_ioc_matches

      | lookup parked_ns_list on name_server

      | lookup sinkhole_ranges on resolved_ip

      | eval curated = if(is_parked OR is_sinkhole, "suppress/downgrade", "keep")

      | where curated == "keep"  // suppressed hits tagged separately for review

      | output match, domain, resolved_ip, curated, reason'
- question: Are any of our telemetry sources showing ingestion gaps or volume drops below baseline — for
    example below the 10th percentile of expected events or a greater-than-50% hour-over-hour decline
    — that would blind our identifier matching and create silent false negatives?
  context: 'Within the Detect (D3-D) tactic, identifier matching is only as good as the telemetry feeding
    it; a blind sensor produces silent false negatives. Track hourly ingestion volume (events/min) and
    unique-identifier counts per source (Zeek conn/dns/ssl, Sysmon, Windows events, threat-intel feed
    updates) and flag collection gaps or drops below baseline thresholds — for example below the 10th
    percentile of expected volume or a >50% hour-over-hour drop. A positive result is a sensor or log
    source that has gone quiet or degraded, meaning matches that would have fired are simply not being
    evaluated. This is a coverage/effectiveness question (the FFIR driving this playbook) as much as a
    detection question: a gap directly answers how complete our known-malicious identifier detection process
    really is.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days; evaluate hourly buckets against trailing baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from log_ingestion

      | timechart span=1h count as volume, dc(identifier) as unique_ids by source

      | eval baseline_p10 = percentile(volume, 10) over trailing_30d by source

      | eval hoh_drop = (prev_hour_volume - volume) / prev_hour_volume

      | where volume < baseline_p10 OR hoh_drop > 0.5

      | output source, hour, volume, baseline_p10, hoh_drop'
- question: Which threat-intelligence feeds are actually contributing unique, high-yield indicators with
    low latency and good accuracy, and which feeds have a sustained internal hit-rate near zero (or decaying
    with indicator age) such that they should be retired or deprioritized?
  context: Within the Detect (D3-D) tactic, feed quality analytics directly answer the coverage-and-effectiveness
    FFIR behind this playbook. Following 'Reading the Tea Leaves' and 'Paint it Black', measure per-feed
    differential contribution (unique IOCs added beyond what other feeds provide), accuracy, latency,
    and internal hit-rate broken out by indicator type and age. Track hit-rate decay over indicator age,
    and derive thresholds from your own historical hit-rate distribution rather than vendor claims. A
    positive result is a feed whose sustained internal hit-rate has fallen to near zero — a candidate
    for retirement — or, conversely, a complementary high-yield feed that should be prioritized. This
    optimizes both detection efficacy and analyst attention by ensuring matching pipelines run against
    intelligence that actually fires in your environment.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days; trend hit-rate over indicator age (cohorts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from ti_feeds JOIN ioc_matches on identifier\n| stats dc(identifier) as unique_iocs, count(match)\
      \ as hits, avg(ingest_latency) as latency,\n        sum(false_positive)/count(match) as fp_rate\
      \ by feed, indicator_type\n| eval hit_rate = hits / unique_iocs\n| eval decay = corr(hit_rate, indicator_age)\n\
      | eval action = if(hit_rate < hist_p05, \"retire/deprioritize\", \"keep\")\n| sort hit_rate"
- question: Are matched identifiers generating bursts of failure outcomes — NXDOMAIN responses for matched
    domains, blocked/RST outbound connections to matched IPs, HTTP 404/error spikes on matched URLs, or
    failed logons (Windows 4625) on matched hosts — that signal active beaconing despite controls enforcing
    blocks?
  context: Within the Detect (D3-D) tactic, treating error/failure outcomes as first-class signals reveals
    activity that successful-connection logic alone would miss. Count NXDOMAIN responses for matched domains,
    blocked/RST outbound connections to matched IPs, HTTP 404/error rates on matched URLs, and failed
    logons (Windows Event ID 4625) associated with matched hosts. A positive result — for example a spike
    in NXDOMAIN against a DGA-style matched indicator, or a burst of blocked connections to a matched
    IP — indicates the endpoint is still actively trying to reach adversary infrastructure even though
    a control is blocking it. That means an infection persists and the host needs remediation, not just
    a blocked-event acknowledgment. Failure spikes are also early warning that controls are the only thing
    standing between the host and the C2.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days; alert on short-window spikes in failure outcomes
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (zeek_dns rcode=NXDOMAIN OR zeek_conn conn_state in (REJ,RSTO,S0) OR http status>=400
      OR win_eid_4625)

      | join ioc_matches on (domain OR dest_ip OR url OR host)

      | timechart span=10m count as failures by identifier, failure_type

      | eval spike = failures > (avg_trailing + 3*stdev_trailing)

      | where spike

      | output identifier, failure_type, failures, host'
- question: When we enrich a matched hash or URL with multi-engine reputation (e.g., VirusTotal), does
    the verdict hold up across a stabilization window and a tuned vote threshold, or is it a volatile
    point-in-time score that has not yet settled?
  context: Within the Detect (D3-D) tactic, label stabilization avoids both false alarms and premature
    dismissals from unstable multi-engine verdicts. Label-dynamics research shows engine verdicts flip
    and can take weeks to stabilize, so a single point-in-time multi-engine score is unreliable. Instead
    apply a stabilization window and a tuned vote threshold — require at least N engines sustained over
    a re-query interval — and re-query borderline indicators while recording verdict volatility. A positive
    (stable, above-threshold) result supports treating the match as confirmed malicious; high volatility
    means the indicator should be held in a watch state and re-evaluated rather than actioned or discarded
    outright. This makes enrichment of hash/URL matches defensible and reduces churn in analyst triage.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days; re-query borderline indicators across a multi-day stabilization window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from ioc_matches (hash OR url)

      | enrich multi_engine_reputation (e.g., VirusTotal) at t0, t1, t2 (re-query interval)

      | stats min(positives) as min_votes, max(positives) as max_votes, stdev(positives) as volatility
      by identifier

      | eval verdict = if(min_votes >= N, "stable_malicious", "watch/re-query")

      | output identifier, min_votes, max_votes, volatility, verdict'
- question: Which domains/IPs seen in our first-party DNS exhibit prevalence, novelty, and fast-flux characteristics
    — first-seen/short-lived domains, low or changing TTL, high distinct resolved-IP and country fan-out
    — that flag agile adversary infrastructure even though they match no current IOC?
  context: Within the Detect (D3-D) tactic, behavioral DNS scoring detects malicious infrastructure before
    it reaches any blacklist, complementing deterministic matching. Using prevalence and dynamism features
    from EXPOSURE (short-lived/first-seen domains, low/changing TTL, distinct resolved-IP and country
    fan-out) and resolved-IP-set dispersion from FluxBuster, score domain/IP identifiers seen in first-party
    DNS. Compute Volume (queries/min, distinct IPs), Frequency, and State metrics per domain. A positive
    result is a domain with agile/fast-flux behavior — e.g., a newly seen domain resolving to many IPs
    across many countries with a rapidly changing low TTL — which is characteristic of DGA/fast-flux C2
    and warrants investigation despite no IOC match. This pushes detection up the Pyramid of Pain toward
    adversary tooling and infrastructure behavior.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from zeek_dns\n| stats first_seen, dc(answers) as ip_fanout, dc(geo(answers)) as country_fanout,\n\
      \        min(ttl) as min_ttl, stdev(ttl) as ttl_var, count as queries by query\n| eval novelty =\
      \ (now - first_seen) < 7d\n| eval fastflux = ip_fanout > thresh AND ttl_var > thresh AND country_fanout\
      \ > thresh\n| where novelty OR fastflux\n| output query, ip_fanout, country_fanout, min_ttl, queries,\
      \ score"
- question: When a passive-DNS reputation model scores a domain as malicious before it appears on any
    blacklist, which network/zone/evidence features (e.g., low TTL, high IP fan-out, DGA-like n-grams)
    drive that score, and does it corroborate with our deterministic matching?
  context: Within the Detect (D3-D) tactic, an ML reputation model provides early, pre-blacklist detection
    that runs in parallel with — never replacing — deterministic matching. Train a passive-DNS reputation
    classifier on network, zone, and evidence-based features as in Notos (reported ~96.8% TPR / 0.38%
    FPR), or a J48/decision tree over EXPOSURE's 15 time/answer/TTL/lexical features, to score domains
    as malicious before they hit any blacklist. A positive result is a high-reputation-risk domain flagged
    by the model; surface the top-3 contributing features (e.g., low TTL, high IP fan-out, DGA-like n-grams)
    in the alert so the analyst can judge it. Because models drift and can be evaded, keep the deterministic
    match as the floor and use the model to widen coverage and prioritize, not to gate, detection.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days; retrain/evaluate model on a rolling basis
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = passive_dns_reputation(features = Notos network/zone/evidence OR EXPOSURE 15 features)

      score domains from zeek_dns

      | where reputation_score > threshold

      | eval top_features = explain(model, domain)  // e.g., low_ttl, ip_fanout, dga_ngrams

      | correlate with deterministic ioc_matches

      | output domain, reputation_score, top_features, corroborated'
- question: Which matched indicators does our IOC-relevance model rank as highest priority based on indicator
    age, source reliability, prior internal hit outcomes, campaign recency, and verdict volatility, and
    what features explain that ranking for analyst triage?
  context: Within the Detect (D3-D) tactic, IOC relevance scoring prioritizes scarce matching and analyst
    resources toward the indicators most likely to matter. Train a model to predict IOC relevance using
    features such as indicator age, source reliability, prior internal hit outcomes, campaign recency,
    and verdict volatility (informed by 'Reading the Tea Leaves' and label-dynamics research). Use the
    scores to order matching pipelines and analyst triage queues, and surface the top-3 contributing features
    in the alert text so analysts understand why an indicator was ranked high. A positive result is a
    high-relevance indicator that should be matched/triaged first; a low-relevance one can be deprioritized
    but still matched deterministically. This directly supports the coverage-and-effectiveness FFIR by
    focusing the detection process where it yields the most value.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - Sysmon Event ID 6
  - Sysmon Event ID 7
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Windows Event ID 7045
  - Threat intelligence feeds (STIX/TAXII)
  - 'NAI: Network egress points, DNS resolvers, domain controllers, and critical endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = ioc_relevance(features = [indicator_age, source_reliability, prior_internal_hits,\n\
      \        campaign_recency, verdict_volatility])\nscore all active iocs\n| eval rank = relevance_score,\
      \ top_features = explain(model, ioc)\n| sort -relevance_score\n| output ioc, relevance_score, top_features,\
      \ recommended_priority"
