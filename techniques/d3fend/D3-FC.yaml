name: 'D3-FC: File Carving'
id: 4f1eef98-d44f-4aba-b09e-cce42427036f
description: 'Investigate files transferred over the network that have been reconstructed via protocol
  stream reassembly (HTTP, SMTP, FTP, HTTP/2, TLS) and carved out for analysis. This playbook helps an
  analyst verify that network-transferred files are reliably extracted and analyzed: carved objects are
  hashed and matched against known-bad indicators and signatures, their actual (magic-byte / model-inferred)
  content type is reconciled against the declared MIME, extension, and transport protocol, byte composition
  and entropy are screened for packing/encryption, and transfer volume, frequency, and success/failure
  state are baselined. The goal is to surface suspicious hashes, file-type masquerades, anomalous transfer
  surges and beaconing rhythms, packed/encrypted payloads, and incomplete or failed carves so that content
  warranting containment or deeper inspection is flagged for review.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Have any files carved from network traffic matched a known-bad hash (MD5/SHA1/SHA256) on threat-intel
    or internal blocklists?
  context: This is the deterministic floor for file-carving detection. For every object Zeek extracts
    (files.log) the File Analysis Framework hash analyzer computes MD5/SHA1/SHA256, and each hash is exact-matched
    against curated threat-intelligence feeds and internal blocklists; the bundled detect-MHR policy demonstrates
    submitting each carved file's SHA1 to the Team Cymru Malware Hash Registry and alerting on hits. Run
    this on first-party logs so an exact match is high-confidence evidence that known-malicious content
    traversed the network at the internet gateway or an internal choke point. A positive result (any exact
    match) warrants immediate containment of the involved hosts; a negative result does not clear the
    file, since novel or repacked payloads will not match and must be caught by the content, type, entropy,
    and ML methods in this playbook. This supports the Detect tactic by giving an unambiguous, low-false-positive
    trigger.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nload files.log\nfor each file: h = {md5, sha1, sha256}\nif h.md5 in threatintel_hashes\
      \ or h.sha1 in threatintel_hashes\n   or h.sha256 in threatintel_hashes or h.* in internal_blocklist:\n\
      \     alert(\"known-bad carved file\", fuid, tx_hosts, h)"
  - technology: SIEM/Rule pseudocode
    query: '>-

      index=zeek sourcetype=files

      | eval bad=if(md5 IN(blocklist) OR sha1 IN(blocklist) OR sha256 IN(blocklist),1,0)

      | where bad=1

      | table _time fuid id.orig_h id.resp_h mime_type md5 sha1 sha256'
- question: Do any carved file objects match known-bad content signatures (e.g., YARA rules for Cobalt
    Strike beacons or other malware byte/config patterns)?
  context: Hash matching only catches previously seen samples, so run YARA content rules over each extracted
    object to catch the substance of a payload regardless of declared MIME, extension, or hash novelty.
    High-confidence rules (for example Cobalt Strike beacon byte and config patterns from the signature-base
    ruleset) flag a carved file as malicious even when it is freshly built or repacked. This is essential
    against a sophisticated external actor who recompiles tooling to evade hash blocklists. A rule hit
    is strong evidence warranting containment and deeper file analysis; an absence of hits, like with
    hashing, does not clear the object. This supports the Detect tactic by adding a signature layer that
    operates on file content rather than identity.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nload files.log + extracted file bytes\nfor each carved object O:\n  for rule R in yara_ruleset\
      \ (apt_cobaltstrike.yar, malware sigs):\n    if yara_match(O, R):\n      alert(\"YARA content match\"\
      , fuid, R.name, tx_hosts)"
  - technology: SIEM/Rule pseudocode
    query: '>-

      index=yara_scan source=carved_files

      | where rule_match="true"

      | stats values(rule_name) by fuid id.orig_h id.resp_h mime_type'
- question: Are there carved objects whose true (magic-byte / validated) file type disagrees with the
    declared MIME type, file extension, or transport protocol?
  context: 'Adversaries routinely masquerade file types to slip executables or scripts past content filters.
    Identify each carved object''s true type from header/footer magic bytes plus a fast format validator
    that confirms the object is well-formed, then alert when the validated type disagrees with the declared
    MIME/extension or the transport protocol that carried it. Classic positives: a body advertised as
    a document whose magic bytes and validator resolve to PE or ELF, or an executable/script MIME delivered
    over an unusual protocol. Magic-byte signature unpacking (as used in large-scale firmware identification)
    also helps triage unknown blobs. A confirmed mismatch is a high-value lead for staged malware delivery
    and supports the Detect tactic by exposing type-confusion evasion that hashing and signatures may
    miss.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nload files.log\nfor each file F:\n  true_type = magic_bytes(F) validated by fast_object_validator(F)\n\
      \  if true_type != F.mime_type or extension_of(F.filename) mismatches true_type\n     or (true_type\
      \ in {PE,ELF,script} and F.proto unusual):\n       alert(\"declared-vs-actual type mismatch\", fuid,\
      \ F.mime_type, true_type)"
  - technology: SIEM/Rule pseudocode
    query: '>-

      index=zeek sourcetype=files

      | eval true_type=magic_lookup(file_head)

      | where true_type!=mime_type OR NOT match(filename, ext_for(true_type))

      | table _time fuid mime_type true_type filename id.orig_h id.resp_h'
- question: Are there incomplete, truncated, or failed carves (non-zero missing/overflow bytes, seen_bytes
    far below total_bytes, or validator failures) that indicate reassembly evasion or covert chunking?
  context: Reassembly failure should be treated as a detection, not just noise. In files.log, flag objects
    with non-zero missing_bytes or overflow_bytes, seen_bytes far below total_bytes, validator failures,
    or repeated truncated transfers. These conditions indicate either the inherently error-prone reassembly
    process or deliberate evasion such as covert chunking, fragmentation, or out-of-order delivery designed
    to defeat the carver. Object validation is the basis for separating malformed/evasive carves from
    benign ones. A cluster of failed carves between the same hosts is a strong lead for an actor trying
    to move data below the inspection layer, supporting the Detect tactic by capturing evasion attempts
    that would otherwise yield no analyzable file.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nload files.log\nfor each file F:\n  if F.missing_bytes>0 or F.overflow_bytes>0\n     or\
      \ F.seen_bytes < 0.9*F.total_bytes\n     or validator_failed(F):\n       alert(\"incomplete/failed\
      \ carve\", fuid, F.missing_bytes, F.seen_bytes, F.total_bytes)"
  - technology: SIEM/Stats pseudocode
    query: '>-

      index=zeek sourcetype=files

      | eval frac=seen_bytes/total_bytes

      | where missing_bytes>0 OR overflow_bytes>0 OR frac<0.9

      | stats count by id.orig_h id.resp_h

      | where count>=3'
- question: Does the Shannon entropy of a carved object indicate packing or encryption inconsistent with
    its declared file type?
  context: Compute Shannon entropy of each carved object (and of fixed-size blocks within it) and flag
    values inconsistent with the declared type using protocol/MIME-aware thresholds rather than a single
    global cutoff. As reference points, native code averages roughly 4.7-6.5 bits/byte, packed code around
    6.8, and encrypted/compressed content exceeds about 7.2 toward 8.0. Derive per-service baselines (often
    >7.0, and ~7.5-8.0 for genuine encryption) from your own captures to avoid false positives on legitimately
    compressed media, and combine entropy with exact and fuzzy (ssdeep) hashing to correlate unknown blobs
    against known-good/bad corpora. High entropy on something declared as a plaintext document or script
    is a strong indicator of obfuscated or encrypted payload delivery, supporting the Detect tactic against
    packed/polymorphic malware and encrypted exfiltration.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nload files.log + bytes\nfor each file F:\n  H = shannon_entropy(F.bytes); Hblocks = block_entropy(F.bytes,256)\n\
      \  thr = entropy_threshold_for(F.mime_type)   # MIME-aware baseline\n  if H > thr and F.mime_type\
      \ in {text, document, script}:\n     alert(\"high entropy vs declared type\", fuid, H, F.mime_type,\
      \ ssdeep(F))"
  - technology: SIEM/Stats pseudocode
    query: '>-

      index=file_entropy

      | lookup mime_entropy_baseline mime_type OUTPUT base_thr

      | where entropy > base_thr

      | table _time fuid mime_type entropy base_thr id.orig_h id.resp_h'
- question: Do any carved objects have a byte-frequency (1-gram) distribution that is anomalous for their
    protocol/MIME class, size, and direction?
  context: Build per-(protocol/MIME, size-bin, direction) byte-frequency (1-gram) baselines from normal
    carved traffic and score each new object by a simplified Mahalanobis distance against the matching
    class model (PAYL approach). Objects whose byte composition is statistically abnormal for their class
    are flagged, and the most-deviating byte values are surfaced for analyst review. This catches payloads
    that look structurally wrong for what they claim to be even when entropy is normal and no signature
    fires. A high-distance result is a lead for embedded shellcode, encoded payloads, or content smuggled
    into an unexpected format, supporting the Detect tactic with a statistical content-anomaly layer.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfor each carved object O:\n  class = (proto_or_mime(O), size_bin(O), direction(O))\n \
      \ v = byte_freq_1gram(O)\n  d = simplified_mahalanobis(v, baseline_mean[class], baseline_var[class])\n\
      \  if d > threshold[class]:\n     alert(\"anomalous byte distribution\", O.fuid, d, top_deviating_bytes(v,class))"
  - technology: Zeek/pseudocode
    query: '>-

      load files.log; compute 1-gram histogram per object

      join baseline_model on (mime_type,size_bin,direction)

      emit objects with mahalanobis_distance above per-class cutoff'
- question: Are there file transfers that are rare or oversized outliers relative to MIME-specific baselines
    for size, transfer count, and filename entropy?
  context: Build MIME-specific baseline distributions for file size, transfer count, and filename entropy,
    then flag files outside high-risk percentile thresholds (for example above the 95th percentile in
    size, or in the tails of the filename-entropy distribution). Keep concrete derived cutoffs and tune
    them per dataset rather than removing them. An unusually large PDF, an executable far bigger than
    any seen before for its class, or a randomly named archive are all leads for staged exfiltration or
    tooling delivery. This supports the Detect tactic by isolating statistically rare transfers from the
    high volume of routine ones so analysts can focus on the long tail where malicious activity often
    hides.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      index=zeek sourcetype=files

      | eval fn_ent=filename_entropy(filename)

      | eventstats p95(total_bytes) as p95sz by mime_type

      | eventstats perc95(fn_ent) as p95ent by mime_type

      | where total_bytes>p95sz OR fn_ent>p95ent

      | table _time fuid mime_type total_bytes fn_ent id.orig_h id.resp_h'
  - technology: Zeek/pseudocode
    query: ">-\nload files.log\nbaseline = per-mime distribution(total_bytes, count, filename_entropy)\n\
      flag F where F.total_bytes > p95(baseline[F.mime].size)\n            or F.filename_entropy in tail(baseline[F.mime].fn_ent)"
- question: Are there anomalous file-transfer bursts (volume/count spikes) or regular beaconing rhythms
    in repeated similarly sized transfers between host pairs?
  context: Monitor per-hour file-transfer volume (bytes and counts) by MIME type and source-destination
    pair and alert on statistically significant deviations, for example more than 3 MAD above baseline,
    which can indicate malware propagation or staged exfiltration. Additionally score the frequency and
    regularity of repeated similarly sized transfers using inter-arrival regularity metrics (low coefficient
    of variation, MAD, Bowley skewness) over first-party Zeek conn/files logs, as RITA does for beacon
    detection. A volume surge is a lead for bulk staging or worm-like spread; a highly regular low-jitter
    transfer cadence is a lead for C2 beaconing or scheduled exfiltration. Both support the Detect tactic
    by tying file carving to temporal behavior rather than single-object inspection.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      index=zeek sourcetype=files

      | bin _time span=1h

      | stats sum(total_bytes) as bytes count as cnt by _time mime_type id.orig_h id.resp_h

      | eventstats median(bytes) as med mad(bytes) as mad by mime_type id.orig_h id.resp_h

      | where bytes > med + 3*mad'
  - technology: Zeek/pseudocode
    query: ">-\nload conn.log + files.log\nfor each (orig_h,resp_h) pair:\n  ia = inter_arrival_times(transfers)\n\
      \  if cv(ia) low and MAD(ia) low and bowley_skew(size) ~0:\n     alert(\"regular beaconing rhythm\"\
      , pair, period_estimate(ia))"
- question: When reassembly is incomplete, can the true content type of the available fragments be inferred
    from raw bytes, and does it contradict the declared type?
  context: When reassembly is incomplete due to out-of-order, missing, or truncated transfers, a full
    validator cannot run, so classify the true type of the available fragments directly from raw bytes
    using a CNN fragment classifier (such as FiFTy, trained on the FFT-75 dataset, which supports local
    retraining). This keeps type tagging and declared-vs-actual mismatch detection working even when the
    carve fails, and the alert should report the inferred type and confidence. This is important because
    sophisticated actors deliberately fragment transfers to evade carving; recovering type information
    from fragments denies them that blind spot. A fragment inferred as executable when the transfer was
    declared as a document is a strong lead, supporting the Detect tactic by extending coverage to partial
    carves.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfor each incomplete carve C (missing/out-of-order/truncated):\n  for fragment f in C.available_fragments:\n\
      \    (type, conf) = fifty_cnn_classify(f.raw_bytes)\n  inferred = aggregate(types, conf)\n  if inferred\
      \ != C.declared_type:\n     alert(\"fragment type vs declared\", C.fuid, inferred, conf)"
  - technology: Zeek/pseudocode
    query: '>-

      load files.log where missing_bytes>0 or overflow_bytes>0

      export available fragment bytes -> fragment_type_classifier

      emit (fuid, inferred_type, confidence, declared_mime)'
- question: For fully carved objects, does a byte-based content-type classifier infer a type that disagrees
    with the declared MIME, extension, or protocol?
  context: 'Run a byte-based content-type classifier (such as Magika) on each fully carved object and
    alert when the model-inferred type disagrees with the declared MIME, extension, or transport protocol,
    for example a body claimed as PDF but inferred as PE. Unlike pure magic-byte checks, an ML classifier
    generalizes to obfuscated or unusual headers and provides explainable output: cite the top inferred
    types and their confidence scores in the alert. This is a complementary layer to the deterministic
    magic-byte/validator mismatch check and catches cases where headers are crafted to fool simple checks.
    A confident disagreement is a high-value masquerade lead, supporting the Detect tactic with model-based
    type reconciliation.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfor each fully carved object O:\n  (inferred_type, scores) = magika_classify(O.bytes)\n\
      \  if inferred_type != O.declared_mime and top_score(scores) >= conf_thr:\n     alert(\"model type\
      \ vs declared\", O.fuid, inferred_type, top3(scores))"
  - technology: Zeek/pseudocode
    query: '>-

      load files.log (complete carves)

      classify bytes with content_type_model

      emit objects where inferred_type != mime_type with confidence'
- question: Do carved executables score as likely malicious under supervised static/behavioral ML models,
    even if they evade hash and signature checks?
  context: For carved executables, apply supervised deep models over static/opcode and API-call features
    to estimate malicious likelihood beyond hash matching, catching novel or polymorphic payloads (for
    example CNN-LSTM and transfer-learning malware classifiers). Surface the top-3 contributing features
    alongside the score so an analyst can triage why the model flagged the object. This closes the gap
    left by hash and signature methods, which only catch known samples. A high maliciousness score on
    an executable extracted at the gateway is a lead for in-flight malware delivery and warrants sandboxing
    and host containment. This supports the Detect tactic by scoring the actual carved binary rather than
    its identity.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfor each carved object O where true_type in {PE,ELF,Mach-O}:\n  feats = static_opcode_api_features(O)\n\
      \  score = malware_classifier.predict(feats)\n  if score >= maliciousness_thr:\n     alert(\"executable\
      \ scored malicious\", O.fuid, score, top3_features(feats))"
  - technology: Zeek/pseudocode
    query: '>-

      load files.log; filter executable carves

      export bytes -> ml_malware_scorer

      emit (fuid, malicious_score, contributing_features, tx_hosts)'
- question: Do transfer-flow features reveal novel file-transfer behavior (size/rate/completeness/inter-arrival
    anomalies) when scored by an unsupervised online anomaly model?
  context: 'Score transfer-flow features (object sizes, transfer rates, completeness, inter-arrival times)
    with an unsupervised online autoencoder ensemble such as Kitsune. Reconstruction-error spikes flag
    novel file-transfer behavior that signatures miss: transfer surges, unusual size/rate combinations,
    or staging patterns. The largest-error features are reported for explanation so analysts know what
    drove the anomaly. This is valuable because it requires no labeled malware and adapts online to your
    environment, catching first-of-its-kind behavior from a sophisticated actor. A sustained high reconstruction
    error for a host pair is a lead for emerging exfiltration or C2 file movement, supporting the Detect
    tactic with behavior-based anomaly detection over carved-file flows.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfor each transfer flow T:\n  feats = [size, rate, completeness, inter_arrival, mime]\n\
      \  err = autoencoder_ensemble.reconstruction_error(feats)\n  if err > dynamic_threshold:\n     alert(\"\
      novel transfer behavior\", T.flow_id, err, top_error_features(feats))"
  - technology: Zeek/pseudocode
    query: '>-

      load conn.log + files.log -> flow feature vectors

      stream into online_autoencoder (Kitsune-style)

      emit flows with reconstruction_error above adaptive cutoff'
- question: Do cross-host file-transfer graphs reveal campaign structure such as coordinated staging of
    a payload family or hub-and-spoke/relay topologies?
  context: 'Represent hosts as nodes and file transfers as edges, then apply graph neural networks (as
    in GNN-MTC for malware traffic classification) to detect campaign structure that per-flow features
    miss: coordinated staging of a single payload family across many hosts, or hub-and-spoke and relay
    topologies indicative of distribution or exfiltration infrastructure. This elevates analysis from
    individual transfers to the relationships among them, which is how coordinated intrusions actually
    look. A detected cluster where one source pushes the same carved payload family to many internal hosts,
    or many hosts relay through a single hub, is a strong campaign lead. This supports the Detect tactic
    by exposing the structure of multi-host file-movement operations.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: The organization''s internet gateway and internal network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nbuild graph: nodes=hosts, edges=file_transfers(weight=count,payload_family)\nembeddings\
      \ = gnn_model(graph)\nfor each component / node:\n  if topology in {hub_and_spoke, relay} or shared_payload_family\
      \ across many nodes:\n     alert(\"transfer-graph campaign\", subgraph, payload_family, hosts)"
  - technology: Zeek/pseudocode
    query: '>-

      load files.log + conn.log over window

      edge(orig_h,resp_h,fuid_hash,mime)

      run graph analytics -> detect coordinated staging / hub topologies'
