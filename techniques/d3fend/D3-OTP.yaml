name: 'D3-OTP: One-time Password'
id: 95eae7e9-913a-4345-a45b-e73b7bfa3939
description: 'Investigate the coverage, enforcement, and integrity of One-Time Password (OTP) and MFA
  controls protecting interactive and remote authentication to critical systems. This playbook helps an
  analyst confirm that every successful logon to an OTP-protected resource binds to exactly one single-use
  authenticator event, and surface MFA enforcement gaps and bypass conditions: logons succeeding without
  a corresponding OTP validation, successes following repeated OTP failures, OTP-secret replay, TOTP/HOTP
  counter desynchronization, brute-force OTP guessing, push-bombing / MFA fatigue, and OTP delivery to
  a recently changed number or device (SIM-swap / authenticator-rebind). It also addresses the harder
  case where a valid OTP succeeds yet contextual signals (novel device/geo, impossible travel, credential
  exposure, real-time/AiTM phishing relay) reveal the second factor was phished or relayed rather than
  legitimately presented. It layers deterministic policy correlation, statistical baselining and change-point
  detection of OTP failure/push volume and enforcement drift, and explainable ML scoring of authentication
  sequences and graph edges, drawing on endpoint logon events, identity-provider and TOTP/HOTP verifier
  logs, push-notification service logs, VPN/SSO session logs, and network flow records.'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: For every successful interactive (Type 2) or remote (Type 10) logon to a critical system,
    is there exactly one corresponding successful single-use OTP/MFA validation event for the same account
    from the identity provider within roughly 120 seconds, or do some logons succeed with no matching
    OTP linkage?
  context: Under the Harden tactic, NIST SP 800-63B requires that every successful authentication to an
    OTP-protected resource bind to one single-use authenticator event. Correlate each successful Windows
    Event ID 4624 (logon types 2 and 10) on critical systems with the IdP's OTP/MFA success event for
    the same account, matching within a tight 120-second window. A logon that succeeds with no corresponding
    OTP event indicates an MFA enforcement gap, a bypass path, or a legacy/basic-auth protocol that skips
    the second factor — exactly the conditions a sophisticated actor exploits to ride a stolen primary
    credential. A clean one-to-one binding is the expected (negative) result; any unmatched privileged
    logon should be escalated and the resource's MFA policy reviewed.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each logon L in WinEventID=4624 WHERE LogonType IN (2,10) AND host IN critical_systems:\n\
      \  M = COUNT(idp_mfa_logs WHERE account=L.account AND result='success'\n            AND ts BETWEEN\
      \ L.ts-120s AND L.ts+120s)\n  IF M != 1: ALERT('logon without single OTP binding', account=L.account,\
      \ host=L.host, mfa_events=M)"
- question: Are there sequences where multiple OTP denials or failed logons (Windows Event ID 4625) for
    an account are immediately followed by a successful logon that has no OTP confirmation event?
  context: 'This failed-then-success-without-OTP transition is a distinct state signal called out by NIST
    SP 800-63B and is a hallmark of MFA fatigue, an OTP bypass, or a policy misconfiguration that drops
    the second factor after repeated failures. Profile the explicit transition: a burst of 4625 failures
    or IdP OTP denials for one account, then a 4624 success lacking a paired OTP success within the correlation
    window. A positive result suggests the attacker wore down the control or found a fallback path; a
    clean result means failures were followed only by properly OTP-backed successes. Escalate any privileged
    account exhibiting this pattern and inspect the authenticating host and the conditional-access policy
    in force.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WINDOW per account, ordered by ts:\n  IF COUNT(WinEventID=4625 OR mfa_result='deny') >= 3\
      \ within 15m\n     AND NEXT event is WinEventID=4624 success\n     AND NO idp_mfa_logs success linked\
      \ to that 4624 within 120s:\n       ALERT('OTP bypass after repeated failures', account, host)"
- question: Is any OTP value being accepted more than once within its validity window (replay), are TOTP
    codes being accepted outside a tight look-back/look-ahead skew window, or are HOTP counter resynchronizations
    exceeding the configured look-ahead?
  context: RFC 6238 (TOTP) and RFC 4226 (HOTP) require that each OTP validate exactly once and only within
    bounded time/counter limits. Inspect the verifier logs for the same OTP value (or counter) accepted
    twice for an account — a replay that should be impossible for a single-use authenticator — and for
    TOTP acceptances whose time-step delta exceeds a tight skew window (default 30s step, keep the window
    narrow) or HOTP resyncs beyond the look-ahead. Replay or excessive skew widens the attacker's guessing/interception
    window and can indicate a tampered verifier or a man-in-the-middle reusing a captured code. A clean
    result shows every OTP consumed once within bounds; any reuse or out-of-bounds acceptance is a control-integrity
    failure and should be alerted.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM totp_hotp_verifier_logs:\n  IF otp_value seen >1 time per (account, validity_window):\
      \ ALERT('OTP replay')\n  IF type='TOTP' AND abs(accepted_step - server_step) > skew_window_steps:\
      \ ALERT('TOTP skew exceeded')\n  IF type='HOTP' AND (accepted_counter - last_counter) > lookahead:\
      \ ALERT('HOTP resync beyond lookahead')"
- question: 'Has any authenticator exceeded a hard ceiling of consecutive failed OTP attempts (NIST: no
    more than 100), and are there rapid bursts of OTP failures consistent with brute-force guessing?'
  context: Because OTP brute-force success probability is bounded only by digit length and the number
    of attempts allowed, NIST SP 800-63B and RFC 4226's throttling parameter mandate a hard failed-attempt
    ceiling (no more than 100 consecutive failures) per authenticator. Track consecutive OTP failures
    per authenticator and alert when the ceiling is breached, and treat rapid failure bursts as a frequency
    signal even below the absolute ceiling. A breach means throttling is missing or disabled, leaving
    the OTP open to exhaustion; rapid bursts indicate an active guessing attempt. A healthy account rarely
    strings together more than a couple of failures, so any sustained climb toward the ceiling warrants
    lockout review and investigation of the source host.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM totp_hotp_verifier_logs GROUP BY authenticator_id:\n  consec_fail = running count of\
      \ failures since last success\n  IF consec_fail > 100: ALERT('hard failed-attempt ceiling breached',\
      \ authenticator_id)\n  IF COUNT(failures) >= 10 within 5m: ALERT('OTP brute-force burst (frequency)',\
      \ authenticator_id)"
- question: Is any account receiving an abnormal volume of MFA push prompts in a short window, or showing
    multiple consecutive denials followed by an approval, and is number matching actually being enforced?
  context: 'Push-bombing / MFA fatigue is a volume + frequency + state signature: the attacker, holding
    a valid primary credential, spams push prompts until the user approves one out of annoyance or confusion.
    From push-notification service logs, alert when an account receives more than N prompts in a short
    window (e.g., >5 in 10 minutes) or shows M consecutive denials followed by an approval, and verify
    that number matching (CISA guidance) is enforced so a blind tap cannot approve. A positive result
    is a strong account-takeover precursor; without number matching the risk is acute. Correlate the approval
    timestamp with the resulting logon and the originating host/geo to confirm whether the attacker gained
    a session.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM push_mfa_logs GROUP BY account, sliding 10m:\n  IF COUNT(prompt) > 5: ALERT('push-bombing\
      \ volume', account)\n  IF pattern = (deny){2,} THEN approve: ALERT('MFA fatigue: denials then approval',\
      \ account)\n  IF approve AND number_matching_enforced = false: ALERT('approval without number matching',\
      \ account)"
- question: Was any SMS/voice or push OTP delivered to a phone number or registered device that was changed
    within the prior 24-72 hours, and did an authentication then succeed using that channel?
  context: SIM-swap and authenticator-rebind attacks redirect the OTP delivery channel to attacker-controlled
    hardware shortly before logging in. Alert when an SMS/voice or push OTP is delivered to a number or
    device whose registration changed in the prior 24-72 hours, and treat the subsequent authentication
    as high risk. This is a known interception precursor (Lee et al., wireless-carrier SIM-swap study),
    and NIST SP 800-63B deprecates SMS/PSTN as a restricted channel for exactly this reason. A recent
    rebind immediately followed by a successful OTP login is a strong takeover indicator; confirm the
    change request's origin and whether the legitimate user initiated it before treating the session as
    benign.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each otp_delivery D (channel IN sms,voice,push):\n  chg = lookup last device/number registration\
      \ change for D.account\n  IF D.ts - chg.ts <= 72h:\n    ALERT('OTP delivered to recently changed\
      \ number/device (SIM-swap risk)', account=D.account)\n    flag subsequent auth success as high_risk"
- question: Did any privileged or high-value logon complete with an authentication factor weaker than
    the account's required assurance tier, or with no second factor at all?
  context: 'Phishing-resistant assurance is tiered (CISA): FIDO2/PIV is strongest, app OTP/push with number
    matching is mid, and SMS/voice OTP is weakest. Maintain a per-account required-assurance tier and
    alert when a privileged or high-value logon completes with a factor below that tier — for example
    a domain admin authenticating with SMS OTP when policy mandates FIDO2. Such weak-factor privileged
    logons are downgrade opportunities a sophisticated actor will exploit. The expected result is that
    every privileged logon meets or exceeds its tier; any shortfall signals policy drift or a deliberate
    downgrade and should be escalated with review of the conditional-access configuration.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each successful logon L on high-value resource:\n  required = account_assurance_tier[L.account]\
      \   # FIDO2/PIV > app-OTP/push+NM > SMS/voice\n  used = factor_strength(L.mfa_method)\n  IF used\
      \ < required OR used = none: ALERT('weak-factor privileged logon', account=L.account, used, required)"
- question: For each account and privilege tier, what is the 30-day MFA-coverage ratio (OTP-backed successful
    logons / total successful logons), and which accounts fall below policy thresholds or have dropped
    more than two standard deviations from their baseline?
  context: 'Enforcement drift is gradual and invisible to per-event rules: an account slowly accrues OTP-less
    logons as exceptions or legacy protocols creep in. Compute a 30-day MFA-coverage ratio per account
    and tier and flag accounts below the policy floor or dropping more than 2 standard deviations from
    their own baseline, treating sustained drops as drift (change-point literature, Aminikhanghahi & Cook).
    A low or declining ratio for a privileged account is a systemic gap that materially weakens the OTP
    control. A stable ratio at or near 1.0 is healthy; investigate any sustained decline to find the bypass
    path (service accounts, basic auth, excluded apps) before an adversary does.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days (compute 30-day rolling coverage ratios)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each account over trailing 30d:\n  ratio = otp_backed_success / total_success\n  baseline_mean,\
      \ baseline_sd = stats(ratio over prior periods)\n  IF ratio < policy_threshold[tier] OR ratio <\
      \ baseline_mean - 2*baseline_sd:\n    ALERT('MFA enforcement drift', account, ratio)"
- question: Which hosts show upper-percentile deviations in OTP failures, successful OTP completions,
    or post-authentication connection volume (bytes/connections from Zeek conn.log) relative to the host
    population?
  context: Some abuse is only visible at the host level rather than the account level — a single compromised
    host driving many OTP attempts or exfiltrating after a successful OTP login. Build per-host distributions
    of OTP failures, OTP successes, and post-authentication connection volume from conn.log, and investigate
    hosts at the upper percentiles, setting thresholds against labeled enterprise authentication distributions
    (Kent/LANL). A host sitting in the tail for failures may be running a guessing tool; one in the tail
    for post-auth bytes/conns may be staging exfiltration after a valid OTP session. Hosts near the population
    norm are uninteresting; the tail is where to focus triage.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each host:\n  f = otp_failures; s = otp_success; v = post_auth_bytes+conns (from conn.log)\n\
      build population percentiles for f, s, v\nIF host.f >= p99 OR host.s >= p99 OR host.v >= p99:\n\
      \  INVESTIGATE(host, metrics=[f,s,v])"
- question: Are there step-changes in per-account or per-tenant OTP failure rate, push-prompt count per
    minute, or counter-resync events that indicate the onset of a brute-force or push-bombing campaign?
  context: Static thresholds miss slow-ramping or tenant-wide campaigns. Apply CUSUM or PELT change-point
    detection to time series of OTP failure rate, push-prompt count/min, and HOTP counter-resync events
    per account and per tenant, alerting on abrupt step-changes rather than fixed cutoffs (Aminikhanghahi
    & Cook). A detected change-point marks the moment an attack campaign began — a sudden rise in tenant-wide
    failures, a spike in pushes per minute, or a cluster of resyncs. No change-point means the series
    is stable; a clear step-change should trigger campaign-scoped investigation across all affected accounts
    to scope the blast radius.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR series in [otp_failure_rate, push_per_min, counter_resyncs] per account and per tenant:\n\
      \  cp = PELT_or_CUSUM(series)\n  IF cp detected AND post_cp_mean >> pre_cp_mean:\n    ALERT('change-point:\
      \ possible brute-force / push-bombing campaign', scope, series)"
- question: Which authentication sessions involve improbable new account-host or account-device edges
    that should have triggered step-up OTP, and what are the top contributing features for each?
  context: An authentication-graph link-prediction model (node2vec/logistic regression or a temporal GNN
    like Euler, per Bowman et al.) learns the normal topology of who authenticates to what. Score sessions
    over first-party logs to flag improbable new account-host/device edges that, by policy, should have
    demanded step-up OTP but did not — a likely enforcement gap and a lateral-movement indicator. Crucially,
    surface the top-3 contributing features (new edge, off-hours, weak factor) so an analyst can triage
    the alert quickly. Low-probability edges around privileged accounts deserve priority; expected (high-probability)
    edges are routine. Validate thresholds against labeled enterprise authentication data before trusting
    the scores.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = link_predict(node2vec/GNN+temporal, trained on first-party auth graph)\nFOR each session\
      \ edge (account -> host/device):\n  p = model.edge_probability(edge)\n  IF p < tau AND policy_required_stepup(edge)\
      \ AND NOT stepup_observed:\n    ALERT('improbable edge missing step-up OTP', edge, top3_features=explain(edge))"
- question: Which logon sequences lack a preceding OTP/MFA event or show failed-then-success second-factor
    bursts, as flagged by a self-supervised sequence model over authentication-log event chains?
  context: A self-supervised sequence model trained on normal authentication-log event chains (Gokstorp
    et al.) learns the expected ordering of events and can flag chains where a logon is not preceded by
    an OTP/MFA event or where a failed-then-success second-factor burst appears — both bypass/fatigue
    signatures that rule logic may miss when events are spread across systems. Use attention weights (Brown
    et al.) to expose the top-3 per-field contributors for explainable triage. Anomalous chains around
    privileged accounts are high priority; normal chains score low. This ML layer complements the deterministic
    correlation rules by catching novel orderings and partial-coverage gaps without hand-written signatures.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Identity Provider MFA audit logs
  - TOTP/HOTP verifier logs
  - Push notification (MFA) service logs
  - 'NAI: Domain Controllers, VPN Concentrators, Cloud Identity Provider Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = seq_model(self_supervised, trained on normal auth event chains)\nFOR each account\
      \ session chain C:\n  score = model.anomaly(C)\n  IF score > tau AND (no OTP/MFA event precedes\
      \ logon OR failed_then_success_burst):\n    ALERT('auth chain missing/anomalous MFA', account, top3=attention_contributors(C))"
- question: Did any OTP-backed authentication succeed from a device fingerprint, ASN, or geolocation that
    has never been seen for that account within the baseline window?
  context: 'Even a valid OTP does not prove legitimacy: real-time phishing kits capture and relay the
    OTP, device, and geo signals in the moment, so a successful OTP from a wholly novel context is a takeover
    indicator rather than a benign event (Thomas et al.). Under the Harden tactic this validates whether
    the second factor was actually presented by the legitimate user. Alert when an OTP-backed success
    originates from a never-before-seen device fingerprint, ASN, or geolocation for that account. A novel-context
    success on a privileged account warrants immediate session review and possible revocation; a success
    from a known device/ASN/geo is expected. Tune the baseline window to the account''s normal travel
    and device patterns to limit noise.'
  answer_sources:
  - Identity Provider MFA audit logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN/SSO session logs
  - 'NAI: Cloud Identity Provider Gateways, VPN Concentrators, Web Application SSO'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each otp_backed_success S in idp_mfa_logs:\n  IF S.device_fp NOT IN baseline_devices[S.account]\n\
      \     OR S.asn NOT IN baseline_asns[S.account]\n     OR S.geo NOT IN baseline_geos[S.account]:\n\
      \       ALERT('OTP success from novel device/ASN/geo (possible AiTM relay)', account=S.account)"
- question: Between consecutive successful OTP-backed sessions for an account, is the implied geo-velocity
    physically impossible, indicating concurrent legitimate-user and attacker sessions sharing one phished
    factor?
  context: Impossible travel exposes a phished second factor being used in parallel with the real user.
    Compute geo-velocity between consecutive successful OTP-backed sessions from IdP/VPN logs and alert
    when the implied travel speed cannot be achieved (e.g., two logins hundreds of miles apart within
    minutes), which surfaces an attacker session riding the same relayed OTP as the legitimate one (Doerfler
    et al.). A positive result strongly indicates account takeover despite MFA success; a plausible velocity
    is benign. Account for VPN egress and corporate proxies to avoid false positives, and prioritize privileged
    accounts where a parallel attacker session is most damaging.
  answer_sources:
  - Identity Provider MFA audit logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN/SSO session logs
  - 'NAI: Cloud Identity Provider Gateways, VPN Concentrators, Web Application SSO'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR consecutive otp_backed sessions (S1,S2) per account ordered by ts:\n  v = haversine(S1.geo,\
      \ S2.geo) / (S2.ts - S1.ts)\n  IF v > max_feasible_speed:\n    ALERT('impossible travel between\
      \ OTP-backed sessions', account, S1, S2)"
- question: What is the per-session risk score derived from device knowledge, geolocation, ASN, and behavioral
    features, and which completed OTP-backed sessions score high enough to warrant step-up or escalation?
  context: Login challenges (OTP) empirically block 76-100% of attacks depending on sophistication, but
    real-time phishing leaves residual risk that risk-based scoring must escalate (Doerfler et al.). Maintain
    a per-session risk score from device knowledge, geolocation, ASN, and behavioral features both to
    decide when to require step-up OTP and to grade completed sessions after the fact. High-scoring sessions
    — especially those completed without step-up — should be escalated for review even though MFA succeeded.
    Low-scoring, well-known sessions are routine. This statistical layer turns binary MFA success/failure
    into a graded signal that catches the sophisticated relay attacks OTP alone cannot stop.
  answer_sources:
  - Identity Provider MFA audit logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN/SSO session logs
  - 'NAI: Cloud Identity Provider Gateways, VPN Concentrators, Web Application SSO'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each session:\n  risk = w1*device_unknown + w2*geo_anomaly + w3*asn_rarity + w4*behavior_deviation\n\
      \  IF risk >= stepup_threshold AND NOT stepup_performed:\n    ALERT('high-risk OTP-backed session\
      \ lacking step-up', account, risk)"
- question: Are accounts with known credential exposure showing elevated novel-context OTP success rates,
    and are there OTP failure/denial spikes immediately preceding a success?
  context: Primary logic runs on first-party IdP logs by computing the novel-context OTP success rate
    per account; optionally enrich with credential-exposure status to raise the takeover prior, because
    phished accounts are far more likely to be hijacked since the same kit harvests the second factor
    (Thomas et al.). Treat OTP failure/denial spikes that precede a success as a distinct failure-mode
    signal — the attacker fumbling before relaying a working code. An exposed-credential account with
    rising novel-context successes (especially after a denial spike) is a high-confidence takeover candidate;
    an account with no exposure and stable context is low priority. Use exposure only to adjust priors,
    keeping detection grounded in your own logs.
  answer_sources:
  - Identity Provider MFA audit logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN/SSO session logs
  - 'NAI: Cloud Identity Provider Gateways, VPN Concentrators, Web Application SSO'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each account:\n  novel_rate = novel_context_otp_success / total_otp_success\n  prior =\
      \ base + (credential_exposed ? boost : 0)\n  IF novel_rate elevated AND prior high: ALERT('exposed\
      \ account with anomalous OTP success', account)\n  IF denial_spike immediately_before success: flag\
      \ failure_mode_signal(account)"
- question: Which OTP-backed sessions deviate from the account's own behavioral history (login frequency,
    distinct destinations, new edges, temporal patterns), and what are the top contributing features?
  context: A per-account behavioral model built over authentication features — login frequency, distinct
    destinations, new-edge presence, temporal patterns (Bian et al.) — flags OTP-backed sessions that
    diverge from the user's established history, catching takeovers that pass MFA but behave unlike the
    real user. Expose the top-3 contributing features (Brown et al.) so the analyst sees why a session
    was flagged (e.g., new destination + off-hours + unusual frequency). Sessions matching the user's
    baseline score low; sharp deviations on privileged accounts deserve priority triage. This per-entity
    model adapts to each user rather than a global threshold, reducing noise while surfacing behavioral
    takeovers behind a valid OTP.
  answer_sources:
  - Identity Provider MFA audit logs
  - Windows Event ID 4624
  - Zeek conn.log
  - VPN/SSO session logs
  - 'NAI: Cloud Identity Provider Gateways, VPN Concentrators, Web Application SSO'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model[account] = behavior_model(login_freq, distinct_dests, new_edge, temporal)\nFOR each\
      \ otp_backed session S:\n  score = model[S.account].anomaly(S)\n  IF score > tau: ALERT('behavioral\
      \ deviation despite valid OTP', account=S.account, top3=explain(S))"
- question: Which OTP-backed account-to-resource edges have low (novel) link-prediction probability and
