name: 'D3-RUAA: Restore User Account Access'
id: 26c047e0-c302-4ec5-aef9-25358a09c122
description: Investigate how effectively compromised user accounts are being restored to a known-good
  state under the Restore (D3-RS) tactic, and verify that restored accounts do not remain under adversary
  control. This playbook helps an analyst (1) confirm that the full remediation chain executed for every
  compromised account — administrative or user password reset, OAuth/refresh-token and sign-in session
  revocation, MFA reset where applicable, breached/reused-password rejection, and validated re-enable
  in the correct workflow order — using deterministic symbolic-logic checks against identity and authentication
  telemetry; (2) quantify restoration timeliness (time-to-restore percentiles) and statistically baseline
  each restored account against its own pre-compromise behavior to catch post-restoration drift, unexpected
  change points, rare authentication-graph edges, and abnormal failure-state rates that indicate the attacker
  still has access or the wrong account was restored; and (3) apply behavioral machine-learning (UEBA,
  impossible-travel/anonymizing-source policies, structural login modeling, and LSTM log-key sequence
  validation) to compare restored accounts against self and peer baselines and to validate the restoration
  and post-restore event sequences, surfacing the top contributing features for analyst triage. It draws
  on Windows authentication and account-management events, Entra ID / Azure AD audit and sign-in logs,
  cloud audit logs, IR ticketing/SOAR timestamps, and Zeek network flows.
type: technique
related:
- tactic_id: D3-RS
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: For every user account flagged as compromised and marked for restoration, did a password-reset
    event (Windows Event ID 4724 administrative reset or 4723 user-initiated change) occur with a timestamp
    AFTER the compromise-declaration time, and which restoration-listed accounts are missing this reset?
  context: Under the Restore (D3-RS) tactic, the most basic precondition for complete remediation is that
    the compromised credential was actually changed after the incident was declared. Join the list of
    accounts marked for restoration (IR ticket/SOAR) against account-management events on domain controllers
    and IAM systems, requiring a 4724 (admin reset) or 4723 (user-initiated change) event timestamped
    strictly after the compromise-declaration time. Accounts with no qualifying reset — or only a reset
    that predates the declaration — represent incomplete remediation and must be escalated back to the
    IR team, per the Containment/Eradication/Recovery requirements of [Computer Security Incident Handling
    Guide (NIST SP 800-61r2)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf)
    and the [CISA Cybersecurity Incident & Vulnerability Response Playbooks](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf).
    A good result is a matching post-declaration reset for every account; a finding is any restoration-listed
    account lacking one.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4723
  - Windows Event ID 4647
  - Windows Event ID 4634
  - Windows Event ID 4625
  - Entra ID / Azure AD AuditLogs (Revoke sign-in sessions)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each account in restoration_list:\n  resets = events where EventID in (4724, 4723)\n \
      \         and target_account == account\n          and event_time > compromise_declared_time[account]\n\
      \  if count(resets) == 0:\n    alert(account, \"incomplete remediation: no post-compromise password\
      \ reset\")"
- question: Is each account treated as fully restored ONLY when BOTH a password reset AND an explicit
    token/session-revocation event (e.g., Entra ID 'Revoke sign-in sessions' / Revoke-MgUserSignInSession,
    refresh-token invalidation) are present, and which accounts were reset WITHOUT a matching revocation?
  context: A password reset alone does not invalidate already-issued OAuth refresh/access tokens or live
    sign-in sessions, so an adversary holding a stolen token can retain access even after the password
    changes. Within the Restore tactic, this check requires that for each restored account there exists
    both a reset event AND an explicit revocation event (Entra ID / Azure AD AuditLogs 'Revoke sign-in
    sessions', Revoke-MgUserSignInSession, refresh-token invalidation) after the compromise-declaration
    time. Accounts showing reset-without-revocation are flagged as incomplete remediation, per Microsoft's
    guidance on [Revoke user access in an emergency in Microsoft Entra ID](https://learn.microsoft.com/en-us/entra/identity/users/users-revoke-access).
    A finding here is a high-priority gap because the attacker's session may still be valid.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4723
  - Windows Event ID 4647
  - Windows Event ID 4634
  - Windows Event ID 4625
  - Entra ID / Azure AD AuditLogs (Revoke sign-in sessions)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each account in restoration_list:\n  has_reset  = exists event(EventID in (4724,4723),\
      \ target==account, time>declared)\n  has_revoke = exists AuditLog(activity in (\"Revoke sign-in\
      \ sessions\",\n               \"Revoke-MgUserSignInSession\", \"refresh token invalidation\"),\n\
      \               target==account, time>declared)\n  if not (has_reset and has_revoke):\n    alert(account,\
      \ \"incomplete: reset present but session/token not revoked\")"
- question: Before any compromised account is re-enabled, is the newly-set credential verified to NOT
    match a known-breached or reused-password corpus, and were any accounts re-enabled on a credential
    that appears in that corpus?
  context: 'Re-enabling an account on a password that is already in a breach/reuse corpus invites immediate
    re-compromise via credential stuffing. Under the Restore tactic, this check asserts a state condition:
    before re-enable, the new credential''s hash/prefix must be checked against a known-breached/reused
    password set (k-anonymity breach-alerting, per [Protecting accounts from credential stuffing with
    password breach alerting, Thomas et al](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas)).
    If a match is found, the re-enable must be blocked and a fresh reset required. A finding is any account
    that was re-enabled when its new credential matched the breached corpus, indicating the remediation
    set the account up for repeat compromise.'
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4723
  - Windows Event ID 4647
  - Windows Event ID 4634
  - Windows Event ID 4625
  - Entra ID / Azure AD AuditLogs (Revoke sign-in sessions)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each account in restoration_list:\n  new_cred_hash = credential_set_at_reset[account]\n\
      \  if new_cred_hash in breached_or_reused_corpus:\n    block_reenable(account)\n    alert(account,\
      \ \"re-enable rejected: credential matches breached/reused corpus\")"
- question: After each account's reset completed, were user-session termination events (Windows Event
    ID 4647 user-initiated logoff, 4634 session logoff) observed, and is there any continued Zeek conn.log
    activity from the previously-compromised session endpoints indicating a non-invalidated session?
  context: Confirming that sessions were actually torn down is distinct from confirming a revocation command
    was issued. Within the Restore tactic, validate that for each restored account the prior sessions
    ended (4647/4634) and that there are NO continued network flows in [Zeek conn.log](https://learn.microsoft.com/en-us/entra/identity/users/users-revoke-access)
    from the previously-compromised session source IPs after the reset-completion time. Persisting flows
    from a prior session IP after reset indicate a session that was never invalidated — strong evidence
    the attacker still holds access. A good result is logoff events plus silence from the old endpoints;
    a finding is continued post-reset activity from a known-compromised session source.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4723
  - Windows Event ID 4647
  - Windows Event ID 4634
  - Windows Event ID 4625
  - Entra ID / Azure AD AuditLogs (Revoke sign-in sessions)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days; correlate around each account's reset-completion timestamp
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each account in restoration_list:\n  logoffs = events(EventID in (4647,4634), target==account,\
      \ time>reset_complete)\n  residual = zeek_conn where src_ip in compromised_session_ips[account]\n\
      \             and ts > reset_complete[account]\n  if residual not empty:\n    alert(account, \"\
      non-invalidated session: flows from prior compromised IP after reset\")"
- question: Does each restored account's remediation follow the canonical event ordering (reset -> token/session
    revocation -> MFA reset -> validated re-enable), and which accounts have missing or out-of-order steps?
  context: Even when all remediation steps eventually occur, performing them out of order can leave windows
    of exposure — for example, re-enabling before revoking tokens. Under the Restore tactic, assert the
    fixed canonical sequence (reset -> token/session revocation -> MFA reset -> validated re-enable) for
    each account and flag any account whose events are missing or appear out of order, using fixed-sequence
    verification consistent with workflow-ordering anomaly detection ([DeepLog, Du et al](https://dl.acm.org/doi/10.1145/3133956.3134015))
    and the staged eradication/recovery steps of the [CISA IR/VR Playbooks](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf).
    A finding is any account whose remediation events deviate from this ordering, indicating a procedural
    gap that may have left the account exploitable.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4723
  - Windows Event ID 4647
  - Windows Event ID 4634
  - Windows Event ID 4625
  - Entra ID / Azure AD AuditLogs (Revoke sign-in sessions)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "expected = [reset, revoke_token_session, mfa_reset, validated_reenable]\nfor each account\
      \ in restoration_list:\n  seq = ordered_remediation_events(account) by event_time\n  if seq != subsequence_matching(expected)\
      \ or any(step missing):\n    alert(account, \"remediation steps missing or out of canonical order\"\
      , detail=seq)"
- question: What is the time-to-restore (from IR ticket creation to confirmed reset AND session invalidation)
    for each compromised account, and which restorations exceed the established percentile baseline so
    badly that they signal a broken process?
  context: Restoration timeliness is a direct measure of how effectively the Restore (D3-RS) tactic is
    executing. Compute time-to-restore as the delta from incident-ticket creation to confirmed reset plus
    session invalidation for each account, maintain percentile baselines (e.g., 90th percentile), and
    flag prolonged restorations for process correction. Because bulk-remediation events can skew the mean,
    harden the threshold using a robust median/MAD [modified Z-score (|Z| > 3.5)](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    rather than a simple average. A finding is an account whose restoration took dramatically longer than
    the robust baseline, indicating a stuck workflow or a remediation that fell through the cracks.
  answer_sources:
  - IR ticketing/SOAR timestamps
  - Windows Event ID 4724
  - Windows Event ID 4647
  - Windows Event ID 4625
  - Windows Security 4624/4768/4769 (authentication)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ttr = restore_confirmed_time - ticket_created_time   // per account\nmed = median(ttr_population);\
      \ madv = MAD(ttr_population)\nmod_z = 0.6745 * (ttr - med) / madv\nif mod_z > 3.5:\n  alert(account,\
      \ \"prolonged restoration\", ttr=ttr, mod_z=mod_z)"
- question: Does each restored account's post-restoration activity (login times, source IPs, accessed
    resources, byte volumes) deviate significantly from its own pre-compromise baseline, which would suggest
    the attacker still has control or the wrong account was restored?
  context: Restoring an account is only successful if the account thereafter behaves like its legitimate
    owner. Within the Restore tactic, build a per-user baseline of normal activity from the pre-compromise
    window (login times, source IPs, accessed resources, byte volumes) and compare post-restoration activity
    against it using robust [median/MAD thresholds](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    Significant deviation immediately after restoration may mean the attacker retained control or that
    remediation was applied to the wrong account. A good result is post-restoration behavior that falls
    within the user's historical envelope; a finding is a sharp departure during the heightened-monitoring
    window.
  answer_sources:
  - IR ticketing/SOAR timestamps
  - Windows Event ID 4724
  - Windows Event ID 4647
  - Windows Event ID 4625
  - Windows Security 4624/4768/4769 (authentication)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days; baseline = 30-day pre-compromise window, compare against heightened-monitoring
    window post-restore
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = profile(account, window=pre_compromise) // login_hr, src_ips, resources, bytes\n\
      for feature in [login_hour, src_ip_entropy, resources, bytes]:\n  med, madv = baseline[feature].median,\
      \ baseline[feature].mad\n  mod_z = 0.6745 * (post_value - med) / madv\n  if abs(mod_z) > 3.5:\n\
      \    alert(account, \"post-restoration drift\", feature=feature, mod_z=mod_z)"
- question: Applying online change-point detection to each restored account's authentication/event-rate
    and byte-volume series, is the EXPECTED behavioral break present at the restoration timestamp, and
    are there any UNEXPECTED post-restoration change points that signal candidate re-compromise?
  context: A correct restoration should itself produce a behavioral change point at the restoration time
    (sessions cut, new credential, monitoring on). Under the Restore tactic, apply online change-point
    detection (CUSUM, Bayesian online CPD, or PELT) to per-account authentication/event-rate and byte-volume
    time series. Confirm the expected break at the restoration timestamp and flag any additional, unexpected
    change point AFTER restoration as a candidate re-compromise, per [A Survey of Methods for Time Series
    Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    A finding is an unexplained post-restoration change point, indicating the account's behavior shifted
    again after it was supposedly secured.
  answer_sources:
  - IR ticketing/SOAR timestamps
  - Windows Event ID 4724
  - Windows Event ID 4647
  - Windows Event ID 4625
  - Windows Security 4624/4768/4769 (authentication)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days; center detection on restoration timestamp
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = per_account_rate(auth_events, bytes) bucketed hourly\ncps = changepoints(series,\
      \ method=PELT|CUSUM|BOCPD)\nif not any(cp ~= restoration_time):\n  alert(account, \"expected restoration\
      \ change-point missing\")\nfor cp in cps where cp > restoration_time + epsilon:\n  alert(account,\
      \ \"unexpected post-restoration change-point\", at=cp)"
- question: Do post-restoration logins by a restored account traverse host/service edges that lie OUTSIDE
    its pre-compromise authentication-graph footprint, and how rare are any previously-unseen host-to-host
    edges?
  context: Attackers who retain access often pivot to hosts the legitimate user never touched. Within
    the Restore tactic, build the restored account's pre-compromise authentication-graph footprint (the
    set of hosts/services it logged into and the frequency of each edge), then score post-restoration
    logins by edge rarity, flagging connections outside the known-good footprint ([Authentication graphs,
    Kent et al](https://doi.org/10.1016/j.cose.2014.09.001)). Rank previously-unseen host-to-host edges
    using [Bayesian new-edge prediction, Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)
    so genuinely novel pivots rise to the top. A good result is post-restoration logins confined to the
    historical footprint; a finding is logins traversing rare or never-seen edges.
  answer_sources:
  - IR ticketing/SOAR timestamps
  - Windows Event ID 4724
  - Windows Event ID 4647
  - Windows Event ID 4625
  - Windows Security 4624/4768/4769 (authentication)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days; baseline graph from pre-compromise window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "footprint = edges(account, window=pre_compromise) with frequencies\nfor login in post_restoration_logins(account):\n\
      \  edge = (src_host, dst_host_or_service)\n  if edge not in footprint:\n    score = bayesian_new_edge_prob(edge)\n\
      \    alert(account, \"login outside known-good auth-graph footprint\", edge=edge, rarity=score)"
- question: What are the failed-logon (Windows Event ID 4625), Kerberos pre-auth failure, NXDOMAIN, and
    blocked-connection rates for each restored account after re-enable — is there a failure spike (password
    guessing / stale automation) or an anomalous zero-failure perfect-success pattern from a new source
    (token replay)?
  context: Failure-state telemetry is a sensitive early indicator of re-compromise of a freshly restored
    account. Under the Restore tactic, monitor failed-logon (4625), Kerberos pre-auth failures, NXDOMAIN,
    and blocked-connection rates for the restored account as a distinct signal. A spike in authentication
    failures right after re-enable can indicate password-guessing against the restored account or stale
    automation still using the old credential; conversely, a sudden zero-failure perfect-success pattern
    from a NEW source can indicate token replay, where the attacker already holds valid material. Apply
    failure-rate baselining per [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/). A finding is either anomalous tail —
    too many failures, or implausibly clean success from an unfamiliar source.
  answer_sources:
  - IR ticketing/SOAR timestamps
  - Windows Event ID 4724
  - Windows Event ID 4647
  - Windows Event ID 4625
  - Windows Security 4624/4768/4769 (authentication)
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways'
  range: Last 90 days; focus on heightened-monitoring window after re-enable
  queries:
  - technology: SIEM/Stats pseudocode
    query: "fail_rate = rate(EventID 4625, kerb_preauth_fail, NXDOMAIN, blocked_conn | account)\nbase\
      \ = baseline(fail_rate, pre_compromise)\nif fail_rate >> base:   alert(account, \"post-reenable\
      \ failure spike: guessing/stale automation\")\nif fail_rate == 0 and success_from_new_source(account):\n\
      \  alert(account, \"zero-failure perfect success from new source: possible token replay\")"
- question: Do hourly restoration-event counts contain spikes or drops outside the predicted bounds of
    a time-series anomaly model, indicating either broad compromise activity driving mass restorations
    or a breakdown in the restoration workflow?
  context: The volume of restoration events over time is itself a health signal for the Restore (D3-RS)
    tactic. Apply time-series anomaly detection to hourly restoration-event counts and identify spikes
    (a surge of restorations implies a broad compromise) or drops (a stall implies workflow breakdown).
    The alert should surface the contributing time window and the magnitude of deviation so the analyst
    can quickly scope the event. A finding is any hour whose restoration count falls outside the model's
    predicted band.
  answer_sources:
  - Windows Security 4624/4625/4768/4769
  - Entra ID / Azure AD SigninLogs
  - Cloud audit logs (Defender for Cloud Apps)
  - IR ticketing/SOAR restoration events
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways, Cloud Identity Providers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = fit_timeseries(hourly_restoration_counts)   // e.g., STL/ESD or Prophet\nfor hour,\
      \ count in hourly_restoration_counts:\n  lo, hi = model.predict_interval(hour)\n  if count < lo\
      \ or count > hi:\n    alert(\"restoration-volume anomaly\", window=hour, deviation=count-(hi or\
      \ lo))"
- question: When each restored account is scored by UEBA against its own pre-compromise baseline and its
    peer group (login times, locations, source IPs, devices, accessed resources), which accounts surface
    as behavioral-drift anomalies, and what are the top-3 contributing factors?
  context: Behavioral analytics that combine self-history and peer-group context are well-suited to detecting
    an attacker who continues to use a restored account. Within the Restore tactic, score each restored
    account against its own pre-compromise baseline and its peer group across login times, locations,
    source IPs, devices, and accessed resources, emitting a prioritized alert that lists the top-3 contributing
    anomalies for analyst triage, per [Identify advanced threats with UEBA, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)
    and the [Microsoft Sentinel Anomalies Reference](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).
    A good result is a restored account scoring within self/peer norms; a finding is a high anomaly score
    with the contributing features (e.g., new device + new geo + off-hours) surfaced for rapid triage.
  answer_sources:
  - Windows Security 4624/4625/4768/4769
  - Entra ID / Azure AD SigninLogs
  - Cloud audit logs (Defender for Cloud Apps)
  - IR ticketing/SOAR restoration events
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways, Cloud Identity Providers'
  range: Last 90 days; heightened-monitoring window post-restoration
  queries:
  - technology: SIEM/ML pseudocode
    query: "score, features = ueba_score(account, baselines=[self_pre_compromise, peer_group],\n     \
      \          dims=[login_time, location, src_ip, device, resources])\nif score > threshold:\n  alert(account,\
      \ \"post-restoration behavioral drift\", top3=features.sort_desc()[:3])"
- question: During the heightened-monitoring window, do restored accounts trigger behavioral cloud-identity
    policies — impossible travel, infrequent country, anonymous/Tor IP, or unusual sign-in volume — built
    on per-user baselines, and which specific anomaly fired?
  context: Cloud identity providers are a common target for attackers who retain stolen tokens. Under
    the Restore tactic, apply behavioral cloud-identity anomaly policies (impossible travel, infrequent
    country, anonymous/Tor IP, unusual sign-in volume) built on per-user baselines to restored accounts
    during the heightened-monitoring window, and alert with the specific triggering anomaly, per [Anomaly
    detection policies, Microsoft Defender for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).
    A finding — for example a sign-in from a Tor exit node or an impossible-travel pair — for a recently
    restored account is a strong indicator the restoration did not actually evict the adversary.
  answer_sources:
  - Windows Security 4624/4625/4768/4769
  - Entra ID / Azure AD SigninLogs
  - Cloud audit logs (Defender for Cloud Apps)
  - IR ticketing/SOAR restoration events
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways, Cloud Identity Providers'
  range: Last 90 days; heightened-monitoring window post-restoration
  queries:
  - technology: SIEM/ML pseudocode
    query: "for signin in restored_account_signins(window=heightened_monitoring):\n  for policy in [impossible_travel,\
      \ infrequent_country, anon_tor_ip, unusual_volume]:\n    if policy.eval(signin, baseline=per_user):\n\
      \      alert(account, \"cloud-identity anomaly post-reset\", policy=policy.name, signin=signin)"
- question: Do post-restoration logins by a restored account violate the learned normal (user, source-host,
    destination-host, time) login structure, indicating continued abuse or a mis-issued credential?
  context: Structural login modeling captures the relational pattern of who logs in from where to where
    and when, which is harder for an attacker to mimic than any single attribute. Within the Restore tactic,
    learn each user's normal (user, source-host, destination-host, time) login structures and flag structure-violating
    logins by a restored account as continued abuse or mis-issuance, surfacing the specific violated structural
    attribute in the alert, per [Detecting Structurally Anomalous Logins Within Enterprise Networks, Siadati
    and Memon](https://doi.org/10.1145/3133956.3134003). A finding is a restored-account login whose structure
    (e.g., an unusual source-to-destination pairing at an unusual time) does not fit the learned model.
  answer_sources:
  - Windows Security 4624/4625/4768/4769
  - Entra ID / Azure AD SigninLogs
  - Cloud audit logs (Defender for Cloud Apps)
  - IR ticketing/SOAR restoration events
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, VPN Concentrators, Network
    Gateways, Cloud Identity Providers'
  range: Last 90 days; train on pre-compromise logins
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = learn_login_structure(history) over (user, src_host, dst_host, time)\nfor login in\
      \ post_restoration_logins(account):\n  p, violated_attr = model.score(login)\n  if p < threshold:\n\
      \    alert(account, \"structurally anomalous login post-restore\", attribute=violated_attr)"
- question: Using LSTM log-key sequence modeling, do the restoration workflow and the restored account's
    subsequent event stream follow expected orderings, or are there low-probability next-events (missing
    revocation, out-of-order re-enable, anomalous post-login command sequences)?
  context: Sequence modeling validates not just that the right events happened but that they happened
    in a plausible order and that nothing unexpected followed. Under the Restore tactic, use LSTM log-key
    sequence modeling to verify the restoration workflow and the restored account's subsequent event stream
    follow expected orderings, flagging low-probability next-events — a missing revocation, an out-of-order
    re-enable, or anomalous post-login command sequences — with the deviating event surfaced for triage,
    per [DeepLog, Du et al](https://dl.acm.org/doi/10.1145/3133956.3134015). A good result is a high-probability
    event sequence throughout remediation and post-restore activity; a finding is a low-probability next-event
    that points either to a remediation gap or to attacker activity on the restored account.
