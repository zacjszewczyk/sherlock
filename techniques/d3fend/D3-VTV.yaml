name: 'D3-VTV: Variable Type Validation'
id: f258ecbd-945a-4a1a-8a60-f4d38f0e2939
description: This playbook helps an analyst assess and monitor how effectively Variable Type Validation
  has been implemented across critical web applications, and to detect input-based attacks that exploit
  weak or missing type checking. It correlates first-party application and runtime telemetry - crash/exception
  events and runtime type-invariant (type-confusion) violations on web/app servers - with network-side
  HTTP request parameter analysis from Zeek, WAF/ModSecurity, and web access logs. It layers deterministic
  signatures (known type-conversion exceptions, runtime downcast checks, and per-parameter WAF type/format
  rules) with statistical baselining (per-endpoint and per-parameter error rates, rare data types, value
  length and character-distribution anomalies, payload byte-frequency analysis, and failed-validation
  request ratios) and machine learning (explainable supervised type-abuse classifiers and unsupervised
  novel-anomaly detection). Use it to verify that applications actually enforce expected variable types
  before sinks, to distinguish scripted type-fuzzing and exploit attempts from ordinary user error, and
  to surface zero-day malformed-input campaigns against sensitive applications.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are critical web/application servers logging type-conversion or type-mismatch exceptions (e.g.,
    FormatException, InvalidCastException, TypeMismatchException, ValueError, java.lang.NumberFormatException,
    or 'Input string was not in a correct format'), and which applications, faulting modules, and requests
    are generating them?
  context: Under the Harden mission, this question measures whether applications actually fail safely
    when a variable receives the wrong type, and surfaces inputs that drive a variable into undefined
    or erroring behavior. Build portable signatures (Sigma-style) that match known type-conversion failure
    strings in Windows Event ID 1000 and application logs, and enrich each alert with the application
    name, faulting module, and request correlation ID where available. A cluster of these exceptions tied
    to one endpoint or source can indicate an attacker probing for inputs that the type-validation layer
    fails to handle; the absence of such exceptions during malformed input suggests validation is catching
    and rejecting bad types before they reach runtime. Use the matched signatures both as a detection
    feed and as evidence of where type validation is (or is not) enforced.
  answer_sources:
  - Windows Event ID 1000
  - Application logs
  - Sysmon Event ID 1
  - 'NAI: Web servers hosting critical applications and their application-level and OS crash/exception
    logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "sig = [\"FormatException\",\"InvalidCastException\",\"TypeMismatchException\",\n       \"\
      ValueError\",\"java.lang.NumberFormatException\",\n       \"Input string was not in a correct format\"\
      ]\nfor evt in (winlog.event_id==1000 OR source==\"application_log\"):\n  if any(s in evt.message\
      \ for s in sig):\n    alert(app=evt.app_name, faulting_module=evt.faulting_module,\n          request_id=evt.correlation_id,\
      \ host=evt.host)"
- question: For C/C++ services, are runtime type-confusion checks detecting cases where an object's actual
    runtime type does not match the expected type on a downcast, and are those violations being forwarded
    as high-severity alerts with the faulting binary and component/CVE context?
  context: 'For the Harden mission this is a deterministic, high-confidence signal: a runtime type-invariant
    (type-confusion) violation on a downcast in a compiled service is almost always either an exploit
    attempt or a memory-safety bug, not benign behavior. Deploy HexType-style instrumentation that compares
    an object''s true runtime type to the expected type on every downcast and emits a violation event.
    Treat each violation as a high-severity alert and forward it to the SIEM alongside the faulting binary,
    the implicated component, and any associated CVE. A positive result warrants immediate triage of the
    affected service for exploitation; a sustained pattern from one source indicates an active type-confusion
    exploitation campaign against the application.'
  answer_sources:
  - Windows Event ID 1000
  - Application logs
  - Sysmon Event ID 1
  - 'NAI: Web servers hosting critical applications and their application-level and OS crash/exception
    logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for v in runtime_typecheck_violations:   # HexType-style downcast checks\n  alert(severity=\"\
      high\",\n        binary=v.faulting_binary, expected_type=v.expected,\n        actual_type=v.actual,\
      \ component=v.component, cve=v.cve_context)"
- question: Has the per-endpoint or per-parameter rate of type errors and exceptions risen significantly
    above its forecasted normal level (e.g., by 3 or more standard deviations), which would indicate automated
    probing or fuzzing of input types?
  context: This treats type-error/exception volume as an explicit failure-mode signal for the Harden mission.
    Profile each endpoint and parameter's normal type-error rate using a time-series model fitted on 14-30
    days of history, then alert when the observed rate exceeds the forecast by at least 3 standard deviations
    (or a tuned per-endpoint threshold, with 3 sigma as the floor). A sudden spike in type errors against
    a specific endpoint is a strong indicator of scripted fuzzing or an attacker enumerating inputs that
    bypass type validation, whereas a flat rate near baseline indicates normal usage. Report the endpoint,
    parameter, observed vs. expected rate, and the window so an analyst can confirm whether the spike
    correlates with a single source or campaign.
  answer_sources:
  - Windows Event ID 1000
  - Application logs
  - Sysmon Event ID 1
  - 'NAI: Web servers hosting critical applications and their application-level and OS crash/exception
    logs.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (endpoint,param) in groups:\n  hist = type_error_rate[endpoint,param][last_14_30d]\n \
      \ forecast, sigma = timeseries_model(hist)\n  observed = type_error_rate_now[endpoint,param]\n \
      \ if observed > forecast + 3*sigma:\n    alert(endpoint, param, observed, forecast, window)"
- question: Do the timing and dependencies between type-error events form bursty patterns that diverge
    from the normal continuous-time process, suggesting a concentrated malformed-input campaign even when
    overall counts stay modest?
  context: Fixed time-bin counting can miss short, intense bursts of malformed input. For the Harden mission,
    model type-error events as a continuous-time process (e.g., a continuous-time Bayesian network) and
    score the likelihood of the observed timing and event-to-event dependencies without fixed bins. Low-likelihood
    bursts indicate coordinated malformed-input campaigns or fuzzing runs that probe type-validation weaknesses.
    Surface the contributing event sequence (ordered timestamps and the parameters/exceptions involved)
    in the alert so an analyst can reconstruct the attack pattern and decide whether the burst maps to
    a single source, tool, or exploit chain.
  answer_sources:
  - Windows Event ID 1000
  - Application logs
  - Sysmon Event ID 1
  - 'NAI: Web servers hosting critical applications and their application-level and OS crash/exception
    logs.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = type_error_events[ordered_by_time]\nmodel = continuous_time_bayes_net(train=benign_window)\n\
      score = model.loglikelihood(events_recent)\nif score < anomaly_threshold:\n  alert(sequence=events_recent[contributing],\
      \ score=score)"
- question: Is the WAF enforcing per-parameter type/format/length constraints and rejecting inputs that
    violate them or match known type-abuse payloads (e.g., OWASP CRS inbound anomaly score 5 or higher),
    and does the application's own validation enforce the expected type before sinks?
  context: 'This deterministic rule layer is the floor for the Harden mission: declare expected numeric/format/length
    constraints per parameter at the WAF and reject inputs that violate them or match known type-abuse
    signatures, using OWASP ModSecurity CRS anomaly scoring (alert/block at inbound anomaly score >= 5).
    In parallel, verify - using a static-plus-dynamic approach like Saner - that the application''s own
    validation routines actually enforce the intended type/format before the value reaches a sink (query,
    exec, deserializer). A blocked request at the WAF confirms the perimeter caught a type violation;
    a value that passes the WAF but still triggers downstream type errors reveals a gap between declared
    and enforced validation. Keep these rules running alongside statistical and ML detectors rather than
    relying on them alone.'
  answer_sources:
  - Zeek http.log
  - WAF/ModSecurity audit log
  - Web server access log
  - 'NAI: Network sensors and reverse proxies/WAFs in front of critical web applications, and their HTTP
    request logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for req in waf_audit_log:\n  for param in req.params:\n    if violates(param.value, declared_type_format_length[param.name])\
      \ \\\n       or matches_crs_type_abuse(param.value):\n      if req.crs_inbound_anomaly_score >=\
      \ 5:\n        alert(action=\"block\", endpoint=req.uri, param=param.name,\n              value=param.value,\
      \ score=req.crs_inbound_anomaly_score)"
- question: For each critical HTTP parameter, is a request supplying a data type or structure (integer,
    float, string, boolean) that historically occurs in fewer than 1% of requests for that parameter,
    based on a learned 30-day profile?
  context: Under the Harden mission, this detects type confusion at the parameter level by learning what
    each parameter normally receives. For every critical parameter in Zeek http.log, infer the expected
    data type and structure and build a 30-day frequency distribution; alert when a parameter receives
    a type or structure that appears in fewer than 1% of historical requests. Derive both the <1% threshold
    and the per-parameter token sets from your own access logs so the model reflects real usage. A numeric
    parameter suddenly receiving strings or structured payloads is a classic precursor to injection or
    type-abuse; a request matching the learned type profile is benign. Report the parameter, the observed
    type/structure, and its historical frequency.
  answer_sources:
  - Zeek http.log
  - WAF/ModSecurity audit log
  - Web server access log
  - 'NAI: Network sensors and reverse proxies/WAFs in front of critical web applications, and their HTTP
    request logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "profile = learn_param_type_profile(zeek_http_log[last_30d])  # type+structure freq\nfor req\
      \ in zeek_http_log[recent]:\n  for param in req.params:\n    t = infer_type(param.value)\n    if\
      \ profile[param.name].freq(t) < 0.01:\n      alert(param=param.name, observed_type=t,\n        \
      \    freq=profile[param.name].freq(t), endpoint=req.uri)"
- question: For each parameter, does an input value exceed the learned length bound (Chebyshev) or show
    a character-class distribution that diverges from its learned profile (chi-square), such as non-numeric
    characters appearing in a numeric field?
  context: 'This statistical check for the Harden mission baselines two properties of each parameter''s
    values: length (mean/variance with a Chebyshev bound) and character-class distribution (chi-square
    against the learned idealized distribution). Flag values that exceed the length bound or whose character
    mix diverges sharply - for example, a sudden appearance of letters or punctuation in a field that
    is normally all digits. Such deviations indicate an attacker substituting a different type or smuggling
    payload bytes into a parameter the developer assumed was constrained. Report the offending parameter,
    the observed length, and the top deviating character classes so an analyst can judge whether the value
    is malformed input, an injection attempt, or a legitimate edge case.'
  answer_sources:
  - Zeek http.log
  - WAF/ModSecurity audit log
  - Web server access log
  - 'NAI: Network sensors and reverse proxies/WAFs in front of critical web applications, and their HTTP
    request logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "base = baseline_param_stats(http_logs[last_30d])  # mean,var,charclass dist\nfor req in http_logs[recent]:\n\
      \  for p in req.params:\n    if len(p.value) > chebyshev_bound(base[p.name].len) \\\n       or chisquare(charclass_dist(p.value),\
      \ base[p.name].chardist) > thr:\n      alert(param=p.name, length=len(p.value),\n            top_deviating_classes=top_charclass_dev(p.value,\
      \ base[p.name]))"
- question: Do request bodies show a byte composition (1-gram frequency) that diverges, by Mahalanobis
    distance, from the normal profile for that endpoint and length bucket, or an absolute body size well
    above baseline, indicating oversized or malformed type-abuse payloads?
  context: For the Harden mission, build per-(endpoint, length-bucket) 1-gram byte-frequency models of
    request bodies (PAYL-style) and score each new payload by Mahalanobis distance from the learned distribution.
    Bodies whose byte composition diverges from the service's normal type profile - or whose absolute
    byte count greatly exceeds baseline - signal type-abuse payloads, embedded binary/encoded content,
    or buffer-stuffing attempts against inputs the application expects to be small and well-typed. A high
    Mahalanobis score on a parameter or endpoint that normally carries simple typed values is suspicious;
    a score near the benign distribution is normal traffic. Track both the distance and the raw body size,
    and list the most anomalous byte features in the alert.
  answer_sources:
  - Zeek http.log
  - WAF/ModSecurity audit log
  - Web server access log
  - 'NAI: Network sensors and reverse proxies/WAFs in front of critical web applications, and their HTTP
    request logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model = payl_models_by(endpoint, length_bucket)  # 1-gram byte freq + cov\nfor req in http_logs[recent]:\n\
      \  m = mahalanobis(bytefreq(req.body), model[req.endpoint, bucket(len(req.body))])\n  if m > threshold\
      \ or len(req.body) > size_baseline[req.endpoint]*k:\n    alert(endpoint=req.endpoint, mahalanobis=m,\
      \ body_size=len(req.body))"
- question: For each endpoint and source IP, does the ratio of rejected requests (HTTP 400/422 and WAF-rejected)
    to total requests exceed the baseline by 3 or more standard deviations, distinguishing scripted type-fuzzing
    from normal user error?
  context: This treats failed-validation responses as an explicit failure-mode/State signal for the Harden
    mission. Compute, per endpoint and per source IP, the ratio of rejected requests (HTTP 400/422 and
    WAF rejections) to total requests, and alert when that ratio exceeds the established baseline by at
    least 3 standard deviations. A normal user occasionally fumbles input, producing a low, stable rejection
    ratio; a scripted fuzzer or attacker enumerating type-validation gaps produces a sustained high rejection
    ratio from a single source or against a single endpoint. Report success vs. fail counts and the top
    rejected parameters so the analyst can confirm whether the source is methodically probing types and
    which inputs it is targeting.
  answer_sources:
  - Zeek http.log
  - WAF/ModSecurity audit log
  - Web server access log
  - 'NAI: Network sensors and reverse proxies/WAFs in front of critical web applications, and their HTTP
    request logs.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for key in [endpoint, src_ip]:\n  rej = count(status in [400,422] or waf_rejected)[key]\n\
      \  tot = count(all_requests)[key]\n  ratio = rej/tot\n  if ratio > baseline_ratio[key] + 3*sigma[key]:\n\
      \    alert(key=key, rejected=rej, total=tot, top_rejected_params=topN(key))"
- question: Does a supervised classifier trained on HTTP/WAF features (value length, byte/char-class ratios,
    inferred type, parameter name, request-body size, response code) score a request as a likely type-validation
    failure, and what top contributing features explain that score?
  context: For the Harden mission, train a supervised model on Zeek http.log and WAF features to score
    requests for likely type-validation failure, validating and deriving thresholds against labeled HTTP
    attack data such as CIC-IDS2017. Use cascaded NLP/transformer stages so a cheap stage screens most
    traffic and only ambiguous inputs escalate to heavier models, preserving throughput. Critically, emit
    the top-3 contributing features for every alert via SHAP-style explanations so analysts can see why
    a request scored high (e.g., non-numeric characters in a numeric field, anomalous body size). A high
    score with explainable type-related features indicates an attack worth triage; an explanation pointing
    to benign features signals a likely false positive. Periodically retrain to track drift in legitimate
    parameter usage.
  answer_sources:
  - Zeek http.log
  - WAF/ModSecurity audit log
  - Web server access log
  - 'NAI: Network sensors and reverse proxies/WAFs in front of critical web applications, and their HTTP
    request logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = extract(value_len, byte_ratios, charclass_ratios, inferred_type,\n               param_name,\
      \ body_size, response_code)\nscore = cascade([cheap_nlp_stage, transformer_stage]).predict(feat)\n\
      if score > threshold:        # threshold tuned on CIC-IDS2017\n  alert(request=req, score=score,\
      \ top_features=shap_top3(feat))"
- question: Does an unsupervised online model (an ensemble of autoencoders with incremental statistics)
    flag never-before-seen malformed inputs by high reconstruction error on per-parameter/flow features,
    catching zero-day type abuse the supervised classifier was not trained on?
  context: Supervised models only catch what they were trained on, so for the Harden mission run an unsupervised
    online detector (Kitsune-style ensemble of autoencoders with incremental damped statistics) over per-parameter
    and per-flow features. Train the reconstruction-error threshold from a benign-only window, then flag
    inputs whose reconstruction error exceeds that threshold as novel, never-before-seen malformed inputs
    - complementing the supervised classifier for zero-day type abuse. A high reconstruction error indicates
    a request that does not resemble any normal traffic the model has seen, which warrants investigation
    as a possible novel type-validation attack; errors near the benign threshold are routine. List the
    highest-error features in the alert so the analyst can interpret which aspects of the input were anomalous.
  answer_sources:
  - Zeek http.log
  - WAF/ModSecurity audit log
  - Web server access log
  - 'NAI: Network sensors and reverse proxies/WAFs in front of critical web applications, and their HTTP
    request logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = kitsune_autoencoder_ensemble(train=benign_window)  # incremental stats\nfor req in\
      \ http_flows[recent]:\n  err = model.reconstruction_error(features(req))\n  if err > benign_threshold:\n\
      \    alert(request=req, recon_error=err, top_error_features=model.top_features(req))"
