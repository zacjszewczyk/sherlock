questions:
- question: Has any account that is not on the narrow pre-approved decoy allowlist opened, read, or copied
    a seeded honeytoken or decoy document in any sensitive share, where by construction the resource is
    never legitimately touched?
  context: 'Under the Detect tactic, decoy/honeytoken files provide a deterministic, baseline-free tripwire:
    because these documents are seeded into sensitive shares precisely to never be touched by legitimate
    workflows, any access is unauthorized by construction. Seed rarely-touched decoy documents and honeytoken
    files throughout sensitive shares, then alert on every successful object-access (Windows Event ID
    4663) or SMB file access (Event ID 5145 / Zeek smb_files.log) by any account not on a tightly scoped
    allowlist (e.g., the security team that maintains the decoys). A positive result is high-confidence
    evidence of a masquerader, malicious insider, or external actor with stolen credentials performing
    reconnaissance or collection; it warrants immediate triage of the accessing account and host. A negative
    result simply means the trap was not sprung. Keep this rule permanently and never widen the allowlist
    without review.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Critical asset servers (file/database servers), sensitive file shares, and decoy directories
    seeded across the enterprise.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      EVENTS WHERE (event_id IN (4663,5145) OR source='zeek:smb_files')
        AND object_path IN decoy_honeytoken_set
        AND account NOT IN decoy_access_allowlist
      | ALERT severity='critical', reason='decoy/honeytoken access' , fields=[account,host,object_path,access_mask]
  - technology: Zeek/pseudocode
    query: |-
      FROM smb_files.log
      WHERE name IN decoy_honeytoken_set AND action IN ('SMB::FILE_OPEN','SMB::FILE_READ')
        AND id.orig_h NOT IN decoy_admin_hosts
      | EMIT alert(uid, id.orig_h, name)
- question: Has any account outside the approved access set successfully read (Event ID 4663) or deleted
    (Event ID 4660) a file or directory on the SACL-audited watchlist of highly critical, rarely-accessed
    objects?
  context: This is a hard, permanent rule that complements the statistical and ML detectors for the Detect
    tactic. Maintain a SACL (System Access Control List) audit on a curated watchlist of highly critical,
    rarely-accessed files and directories (e.g., crown-jewel databases, key material, executive or M&A
    folders) so the OS emits object-access events. Alert on any successful access (4663 with a read/write
    access mask) or delete (4660) performed by accounts not in the explicitly approved set for that object.
    Because these objects are sensitive and seldom touched legitimately, a hit is a strong signal of unauthorized
    collection, tampering, or destruction. A positive result should trigger account/host investigation
    and confirmation against change-management records; a negative result is expected during normal operations.
    Run this rule alongside, not instead of, the statistical/ML detectors below.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Critical asset servers (file/database servers), sensitive file shares, and decoy directories
    seeded across the enterprise.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      EVENTS WHERE event_id IN (4663,4660)
        AND object_path IN critical_object_watchlist
        AND account NOT IN approved_set[object_path]
        AND access_status='success'
      | ALERT severity='high', action=event_id_to_verb(event_id), fields=[account,host,object_path,access_mask]
- question: Is any single account touching an abnormally large number of distinct shares or paths in a
    short window (for example more than 20 unique shares or more than 100 unique paths within 5 minutes),
    consistent with SMB share crawling or reconnaissance?
  context: Share enumeration/crawling is a hallmark of reconnaissance and pre-collection staging in the
    Detect tactic. Inspect Zeek smb_files.log and Windows Event ID 5145 (network share object checked)
    for one account or source host fanning out across many distinct shares or paths in a tight time window.
    Count distinct shares and distinct paths per account per sliding 5-minute window and alert when they
    exceed tuned thresholds (e.g., >20 unique shares or >100 unique paths). Legitimate users rarely traverse
    many shares rapidly, while automated tooling and human operators mapping the environment do. A positive
    result indicates discovery activity that often precedes lateral movement or bulk collection; correlate
    the source host and account, and check whether the same account subsequently reads large volumes.
    A negative result is normal interactive usage.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Critical asset servers (file/database servers), sensitive file shares, and decoy directories
    seeded across the enterprise.'
  range: Last 90 days, evaluated over sliding 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      EVENTS WHERE event_id=5145 OR source='zeek:smb_files'
      | BIN time INTO 5m WINDOWS BY account
      | STATS dcount(share) AS shares, dcount(path) AS paths BY account, window
      | WHERE shares>20 OR paths>100
      | ALERT severity='high', reason='share crawling / SMB discovery'
  - technology: Zeek/pseudocode
    query: |-
      FROM smb_files.log EVERY 5min
      | GROUP BY id.orig_h
      | COMPUTE unique_shares=distinct(path share), unique_paths=distinct(name)
      | WHERE unique_shares>20 OR unique_paths>100
      | EMIT alert
- question: Did any account authenticate to or read from a server/share it has never accessed before,
    where that resource is also rare for the account's peer group (a new edge on the access graph)?
  context: First-time access is a foundational anomaly signal for the Detect tactic and a strong correlate
    of lateral resource access and credential abuse. For each (user -> server/share) pair, maintain a
    first-seen table built from historical logs; when an account touches a resource it has never used
    before AND that resource is uncommon among the account's peers, raise a new-edge alert. This mirrors
    new-edge anomaly detection on access graphs (Bayesian new-edge prediction; Hopper lateral-movement
    modeling). A single benign new edge is normal as roles evolve, so weight the alert by peer-group rarity
    and by whether the resource is sensitive; bursts of new edges from one account are especially suspicious.
    A positive result on a sensitive resource warrants investigating how the account obtained access and
    whether the credential is compromised. A negative result means the access fits established history.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: Critical asset servers (file/database servers), sensitive file shares, and decoy directories
    seeded across the enterprise.'
  range: Last 90 days for first-seen baseline; alert on new edges in the most recent day
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each event (account, resource) IN (4663,4624,5145, zeek:smb_files, zeek:conn)
        LOOKUP firstseen[account, resource]
        IF not exists:
          rarity = peergroup_fraction_using(resource, peer_group(account))
          IF rarity < 0.05 OR resource IN sensitive_set:
            ALERT severity='medium-high', reason='first-time (new-edge) access', fields=[account,resource,rarity]
        UPSERT firstseen[account, resource] = now()
- question: For each user, does the count of unique files and unique servers/shares accessed in the current
    rolling 24-hour window exceed their historical 95th percentile or a robust threshold of median + 3.5*MAD
    (modified Z-score), suggesting staging or reconnaissance?
  context: This statistical detector for the Detect tactic baselines the breadth of resource exploration
    per user, which spikes during reconnaissance and pre-exfiltration staging. For each user, compute
    the number of unique files and unique servers/shares accessed per rolling 24-hour window from 30-90
    days of history, then alert when current breadth exceeds the user's own 95th percentile or a robust
    threshold of median + 3.5*MAD. Using the median absolute deviation (MAD) rather than mean/standard
    deviation prevents heavy batch users from inflating the baseline and masking real anomalies. A positive
    result indicates the account is reaching into far more distinct resources than is normal for it, consistent
    with masquerade or collection behavior; correlate with first-time access and denial rates. A negative
    result means breadth is within the user's normal envelope.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4625
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User accounts and service accounts accessing file servers, database servers, and sensitive network
    segments.'
  range: Last 90 days for baseline; alert on the latest rolling 24h window
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      EVENTS WHERE event_id IN (4663,5145) OR source IN ('zeek:smb_files')
      | BIN time INTO 24h WINDOWS BY user
      | STATS dcount(object) AS uniq_files, dcount(server_or_share) AS uniq_srv BY user, day
      | JOIN baseline (per user: p95, median, mad) OVER last 30-90d
      | WHERE uniq_files > max(p95_files, median_files+3.5*mad_files)
           OR uniq_srv   > max(p95_srv,   median_srv  +3.5*mad_srv)
      | ALERT severity='medium', reason='anomalous access breadth'
- question: Has a user's daily bytes read or object count for a resource class unrelated to their role
    (for example Finance or Engineering) suddenly spiked above median + 3*MAD, including bulk-read byte
    ratios consistent with collection?
  context: Beyond breadth, the volume of data pulled from a given class of resources is a direct collection
    signal for the Detect tactic. Categorize resources into business classes (Finance, Engineering, HR,
    etc.), then baseline daily bytes read and object count per user per class. Alert when a user's volume
    to a class unrelated to their role spikes (e.g., bytes/day > median + 3*MAD for that user/class),
    and incorporate byte ratios that flag bulk sequential reads typical of mass collection rather than
    interactive use. A positive result indicates the account is hauling unusual volumes from a sensitive
    domain it does not normally serve, a strong precursor to exfiltration; correlate with the user's role/department
    and recent share-crawling. A negative result means volume per class is within normal bounds.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4625
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User accounts and service accounts accessing file servers, database servers, and sensitive network
    segments.'
  range: Last 90 days for baseline; alert on the latest day
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      EVENTS WHERE event_id=4663 OR source='zeek:smb_files'
      | ENRICH resource_class = classify(object_path)
      | STATS sum(bytes) AS bytes_day, dcount(object) AS objs BY user, resource_class, day
      | JOIN baseline (median,mad) BY user, resource_class
      | WHERE bytes_day > median+3*mad
           AND resource_class NOT IN role_classes(user)
      | ALERT severity='high', reason='volume spike to off-role resource class'
- question: Does any user's short-window access rate (accesses per minute to monitored shares) exceed
    their own baseline by a robust multiple, indicating automated crawling that humans do not produce?
  context: Access frequency (rate) distinguishes machine-speed activity from human interaction, a useful
    statistical signal for the Detect tactic. Compute per-user accesses/minute to monitored shares and
    alert when the short-window rate exceeds the user's baseline by a robust multiple (e.g., several MADs
    above the user's typical peak rate). Automated crawlers, scripted collectors, and malware generate
    sustained high-rate access that interactive users do not. A positive result suggests tooling is operating
    under the account, consistent with reconnaissance or bulk collection; correlate with breadth, volume,
    and process telemetry on the source host. A negative result means access cadence is human-plausible.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4625
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User accounts and service accounts accessing file servers, database servers, and sensitive network
    segments.'
  range: Last 90 days for baseline; evaluate per-minute rates continuously
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      EVENTS WHERE event_id IN (4663,5145) OR source='zeek:smb_files'
      | BIN time INTO 1m WINDOWS BY user
      | STATS count() AS rate BY user, minute
      | JOIN baseline (median_rate, mad_rate) BY user
      | WHERE rate > median_rate + k*mad_rate   // k tuned per env, e.g. 6
      | ALERT severity='medium-high', reason='automated access rate'
- question: Is any account generating a surge of access-denied object events (4663 with denied access
    mask / SMB STATUS_ACCESS_DENIED) or failed logons (4625) relative to its baseline, with denial counts
    above median + 3*MAD or a spiking denial-to-success ratio?
  context: Denials are a distinct and valuable signal for the Detect tactic because they reveal an account
    probing resources it is not entitled to, even when no read succeeds. Track per-user access-denied
    events (Event ID 4663 with a denied access mask, or SMB STATUS_ACCESS_DENIED in Zeek smb_files.log)
    and failed logons (Event ID 4625) separately from successful access, and alert when denial counts
    exceed median + 3*MAD or when the denial-to-success ratio spikes versus the user's baseline. A surge
    of denials indicates enumeration/probing or credential misuse where the actor lacks authorization
    for many targets. A positive result warrants checking which resources were probed and whether any
    subsequent access succeeded; a negative result reflects normal, mostly-authorized activity.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4625
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User accounts and service accounts accessing file servers, database servers, and sensitive network
    segments.'
  range: Last 90 days for baseline; alert on the latest day
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      EVENTS WHERE (event_id=4663 AND access_status='denied')
           OR (source='zeek:smb_files' AND status='STATUS_ACCESS_DENIED')
           OR event_id=4625
      | STATS count() AS denials, sum(success) AS successes BY user, day
      | JOIN baseline (median_denials, mad_denials) BY user
      | WHERE denials > median_denials+3*mad_denials
           OR (denials/nullif(successes,0)) > baseline_ratio*spike_factor
      | ALERT severity='medium-high', reason='resource probing / denial surge'
- question: When each accessed resource is scored by how uncommon it is for the user, the peer group (same
    department/role), and the organization, which accesses rank highest by a composite rarity/priority
    score rather than by raw counts?
  context: Raw counts over-alert on busy users; rarity scoring against dynamic peer groups sharpens precision
    for the Detect tactic. Build peer groups from department/role and, for each accessed resource, compute
    how uncommon it is for the user, for the peer group, and for the whole organization. Combine these
    into a composite rarity/priority score and rank alerts by that score so analysts see the genuinely
    unusual accesses first (the approach used by UEBA platforms such as Microsoft Sentinel). A high composite
    score means the user accessed something neither they nor their peers normally touch, which is far
    more suspicious than a high count of routine accesses. A positive (high-rank) result should be triaged
    with first-time-access and volume context; a low score indicates the access is common for the cohort.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4625
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User accounts and service accounts accessing file servers, database servers, and sensitive network
    segments.'
  range: Last 90 days for peer baselines; score the latest day's accesses
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      DEFINE peer_group(user) = users WITH same(dept, role)
      FOR each access (user, resource):
        r_user = 1 - freq(resource | user)
        r_peer = 1 - freq(resource | peer_group(user))
        r_org  = 1 - freq(resource | org)
        score  = w1*r_user + w2*r_peer + w3*r_org
      | RANK accesses DESC BY score
      | ALERT top-N WHERE score > threshold, fields=[user,resource,score,r_user,r_peer,r_org]
- question: For each newly observed (user/host -> resource) connection, what is its probability of forming
    under the learned model, and does its surprise score fall below the low-probability threshold that
    flags suspicious first-time access?
  context: This statistical method formalizes new-edge detection for the Detect tactic using a probabilistic
    model of which connections are expected to form. Model the probability that a given (user/host ->
    resource) edge appears based on historical access structure, then score each newly observed edge by
    its surprise (low probability = high surprise) and alert on low-probability first-time accesses. The
    approach is validated on LANL authentication data and Bayesian new-edge prediction research. Unlike
    a flat first-seen rule, surprise scoring accounts for how predictable the new edge was given the entity's
    and resource's connectivity, reducing false positives from organically expanding-but-expected access.
    A positive (high-surprise) result indicates an access the model strongly did not expect, consistent
    with credential abuse or lateral resource access; a low-surprise new edge is likely benign growth.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4625
  - Windows Event ID 5145
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User accounts and service accounts accessing file servers, database servers, and sensitive network
    segments.'
  range: Last 90 days to fit the edge model; score new edges daily
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FIT edge_model ON historical (src -> dst) graph from 4624/4663/zeek:conn (last 90d)
      FOR each new edge e=(src,dst) NOT in graph:
        p = edge_model.prob_form(src,dst)
        surprise = -log(p)
        IF surprise > tau:  // low probability
          ALERT severity='medium-high', reason='Bayesian new-edge surprise', fields=[src,dst,p,surprise]
- question: When per-user feature vectors (unique objects, bytes read, accesses/min, denial rate, time-of-day,
    resource-class entropy) are fed to unsupervised detectors (Isolation Forest, k-means, PCA reconstruction
    error, MAD), which users are flagged as outliers, and which per-feature contributions drove each flag?
  context: This ML detector for the Detect tactic learns the multidimensional shape of normal resource
    access and flags entities that fall outside it, with explainability built in. Construct per-user feature
    vectors capturing unique objects accessed, bytes read, accesses/minute, denial rate, time-of-day distribution,
    and resource-class entropy, then apply unsupervised models (Isolation Forest, k-means distance, PCA
    reconstruction error, MAD) to identify outliers. Crucially, include the per-feature contribution (e.g.,
    reconstruction error per dimension) in each alert so analysts immediately see which behavior drove
    the score rather than receiving a bare number. Validate against labeled scenarios such as the CERT
    Insider Threat dataset. A positive result identifies a user whose combined access behavior is anomalous;
    the contributing features guide triage (e.g., high bytes + high denial rate). A negative result means
    the user sits within the learned normal cluster.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User and host entities accessing critical asset servers and sensitive network segments.'
  range: Last 90 days to train; score the latest day
  queries:
  - technology: ML/pseudocode
    query: |-
      X = features_per_user[unique_objects,bytes,acc_per_min,denial_rate,tod,resclass_entropy] (90d)
      model = IsolationForest() ; model.fit(X_baseline)
      scores, contribs = model.score_with_attribution(X_today)
      WHERE scores > anomaly_threshold:
        ALERT user, score, top_features=top_k(contribs)
- question: Does any live session score as inconsistent with the legitimate user's footprint under a per-user
    one-class model (e.g., one-class SVM) trained on file-search/access-breadth features, and which features
    deviate?
  context: 'Masquerade detection for the Detect tactic targets the case where an attacker operates under
    a legitimate user''s account: their file-search and access-breadth behavior differs from the real
    user''s even when credentials are valid. Train a per-user one-class model (such as a one-class SVM)
    on file-search/access-breadth features from the user''s own history, then score live sessions and
    flag those that fall outside the user''s normal footprint, reporting the deviating features in the
    alert. This is grounded in research modeling user search behavior for masquerade detection. A positive
    result indicates the session does not look like the account''s true owner, suggesting account takeover
    or insider impersonation; the deviating features (e.g., unusual search breadth, atypical directories)
    focus the investigation. A negative result means the session is consistent with the legitimate user.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User and host entities accessing critical asset servers and sensitive network segments.'
  range: Last 90 days to train per-user models; score sessions in near real time
  queries:
  - technology: ML/pseudocode
    query: |-
      FOR each user u:
        m_u = OneClassSVM().fit(search_access_features(u, 90d))
      FOR each live session s of user u:
        d = m_u.decision_function(features(s))
        IF d < 0:  // outside learned footprint
          ALERT user=u, session=s, deviating_features=explain(m_u, s)
- question: Using an LSTM (DeepLog-style) model of normal access/log event sequences, which accesses fall
    outside the top-g predicted next events or carry anomalous parameters such as an unexpected object
    or volume?
  context: Sequence modeling for the Detect tactic captures the order and parameters of access events,
    not just their aggregate counts, exposing attacks that disrupt normal workflow sequences. Train an
    LSTM (DeepLog-style) on normal sequences of access/log events; at inference, flag any event that is
    not among the top-g most probable next events, or whose parameters (object accessed, volume, etc.)
    deviate from the learned distribution. Support online retraining so the model tracks legitimate role
    drift. A positive result indicates an access that breaks the user's or host's normal procedural pattern,
    consistent with injected adversary actions; inspect the surrounding sequence and the anomalous parameter.
    A negative result means the event was an expected continuation of normal behavior.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User and host entities accessing critical asset servers and sensitive network segments.'
  range: Last 90 days to train; score events as they stream, retrain periodically
  queries:
  - technology: ML/pseudocode
    query: |-
      model = LSTM_DeepLog().fit(normal_event_sequences(90d))
      FOR each event e in stream:
        preds = model.predict_next(context_window)
        IF e.key NOT IN top_g(preds) OR anomalous_param(e, model):
          ALERT entity, event=e, reason='sequence/parameter anomaly'
- question: When an attention-augmented RNN language model scores sessions over authentication/access
    tokens (user, source, destination, object), which sessions are anomalous, and what are the top-3 contributing
    fields revealed by the attention weights?
  context: 'This ML method for the Detect tactic prioritizes explainability: an attention-augmented RNN
    language model is trained over authentication/access tokens (user, source, destination, object) so
    each anomaly comes with the fields that drove it. Score sessions with the model and expose the attention
    weights as the top-3 contributing fields in the alert text, satisfying analyst explainability requirements.
    A positive (high anomaly score) result identifies a session that the language model finds improbable,
    and the surfaced fields (e.g., an unexpected destination or object for that user/source) tell the
    analyst why. This is far more actionable than a bare score. A negative result means the token sequence
    is consistent with learned normal authentication/access language.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User and host entities accessing critical asset servers and sensitive network segments.'
  range: Last 90 days to train; score sessions in near real time
  queries:
  - technology: ML/pseudocode
    query: |-
      model = AttentionRNN_LM().fit(token_seqs[user,src,dst,object] (90d))
      FOR each session s:
        score, attn = model.score_with_attention(s)
        IF score > tau:
          ALERT session=s, score, top_fields=top3_by_attention(attn)
- question: Using a user/host-to-resource authentication graph and an unsupervised GNN trained to predict
    normal edges, which accesses have low link probability indicating credential abuse or lateral resource
    access, and what are the implicated edge and nearest normal neighbors?
  context: Graph-based detection for the Detect tactic models the whole access topology and flags edges
    that the graph structure says should not exist, a strong indicator of lateral resource access and
    credential abuse. Construct a user/host-to-resource authentication graph and train an unsupervised
    GNN to predict normal edges; alert on accesses with low predicted link probability, surfacing the
    implicated edge and its nearest normal neighbors for triage (per CyberGraph and Hopper lateral-movement
    research). A positive (low-probability) result identifies an access that is structurally anomalous
    relative to how the entity and resource connect to the rest of the graph, consistent with an attacker
    pivoting using stolen credentials; the nearest-neighbor context helps the analyst judge whether it
    is benign expansion or malicious. A negative result means the edge is well-supported by the learned
    graph.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4624
  - Zeek smb_files.log
  - Zeek conn.log
  - 'NAI: User and host entities accessing critical asset servers and sensitive network segments.'
  range: Last 90 days to build/train the graph; score new edges daily
  queries:
  - technology: ML/pseudocode
    query: |-
      G = build_auth_graph(4624/4663/zeek:conn, 90d)  // nodes=users,hosts,resources
      gnn = UnsupervisedGNN().fit(G)
      FOR each new edge e=(src,dst):
        p = gnn.link_probability(src,dst)
        IF p < tau:
          ALERT edge=e, p, nearest_normal=knn(e, G), reason='graph access anomaly'
