name: 'D3-RAPA: Resource Access Pattern Analysis'
id: b6f2a57d-0c24-4093-b328-24cfbb70e20c
description: 'Investigate how users, service accounts, and hosts access enterprise resources (file shares,
  file/database servers, and sensitive network segments) to surface unauthorized activity that deviates
  from established baselines. This playbook helps an analyst hunt for masqueraders, insiders, and external
  actors who have obtained valid credentials and are now reading, copying, staging, or probing data they
  should not touch. It layers three complementary detection styles: deterministic tripwires (honeytoken/decoy
  access, watchlisted critical-object access, share-crawling discovery, and first-time/new-edge access)
  that fire at high confidence with no baseline; statistical baselining of the physics of resource access
  (volume of bytes and unique objects, access frequency, success-versus-denied state, peer-group rarity,
  and Bayesian new-edge surprise) using robust dispersion measures resistant to heavy batch users; and
  explainable machine-learning detectors (clustering/outlier models, one-class masquerade models, sequence/LSTM
  log models, interpretable attention RNNs, and graph-based access-anomaly detection) that learn each
  entity''s normal behavior and surface the top contributing features for analyst triage. Use it to detect
  reconnaissance, collection, staging, and lateral resource access across Windows object-access auditing
  and Zeek SMB/connection telemetry.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
