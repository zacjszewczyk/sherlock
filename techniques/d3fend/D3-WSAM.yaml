name: 'D3-WSAM: Web Session Access Mediation'
id: d2a88a7b-1a3e-491d-8ea0-c755375b2a6f
description: This playbook helps an analyst investigate the security and integrity of web application
  user sessions and identify where Web Session Access Mediation controls are weak or absent. It guides
  analysis of session creation and termination logs (session identifiers, source IPs, User-Agents, and
  associated authentication events) to detect session hijacking, session fixation, pass-the-cookie replay,
  credential stuffing, and brute-force activity. It combines deterministic symbolic-logic checks (token
  reuse across IPs, sessions without recent authentication, lifetime/idle-timeout enforcement, weak or
  non-regenerated identifiers, and WAF payload signatures), statistical baselining (session characteristics,
  creation-rate change-point detection, and authentication failure-rate profiling), and machine-learning
  approaches (risk-based session-initiation scoring, request-sequence anomaly detection, explainable request
  classification, and session behavior clustering) to validate that access to web resources is authorized
  and protected from session-related attacks.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any single web session identifier or cookie being presented from multiple distinct source
    IPs, ASNs, or User-Agent strings within a short time window, indicating session hijacking or pass-the-cookie
    reuse?
  context: Under the Isolate tactic, mediating web session access means each session token should remain
    bound to a single client. Extract session identifiers/cookies from Zeek http.log and look for the
    same token observed from 2+ distinct /24 networks, 2+ ASNs, or 2+ User-Agent strings inside roughly
    a 5-minute window. A positive result strongly suggests an attacker has stolen and replayed a valid
    cookie (session hijacking / pass-the-cookie) while the legitimate user is still active. A negative
    result (one token, one client context) is consistent with a properly isolated session. Tune the window
    and distance thresholds to your environment to avoid flagging legitimate mobile/Wi-Fi-to-cellular
    handoffs.
  answer_sources: &id001
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Reverse proxy/WAF access logs
  - 'NAI: Public-facing web servers, web application firewalls, reverse proxies, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM http.log\nEXTRACT session_cookie FROM Cookie header\nGROUP BY session_cookie OVER sliding_window(5m)\n\
      WHERE distinct_count(source_ip /24) >= 2\n   OR distinct_count(asn) >= 2\n   OR distinct_count(user_agent)\
      \ >= 2\nALERT 'session token reused across clients'"
- question: Are new web session identifiers being created without a corresponding recent successful authentication
    event for the same user and host?
  context: Proper session isolation requires that a new session be anchored to a fresh, successful authentication.
    Correlate new session identifiers with Windows Event ID 4624 (successful logon) for the same user/host
    within a defined window (e.g., 5 minutes). Sessions appearing without a recent successful logon may
    indicate replay of a captured token, session fixation (a pre-set identifier accepted by the server),
    or an authentication bypass. A positive result (session with no backing 4624) warrants investigation
    of how the session was minted; a negative result confirms sessions are tied to legitimate logons.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let sessions = http.log NEW session_id with user, host, time\nlet auth = WinEvent EventID=4624\
      \ with user, host, time\nFOR each session\n  IF NOT EXISTS auth WHERE auth.user=session.user\n \
      \    AND auth.host=session.host\n     AND session.time - auth.time <= 5m\n  THEN ALERT 'session\
      \ created without recent authentication'"
- question: Are any web sessions remaining active beyond standards-based absolute-lifetime or idle-timeout
    ceilings, or being used after a logout/invalidation event for the same token?
  context: 'Session access mediation includes enforcing maximum session lifetimes and idle timeouts so
    that stale or abandoned sessions cannot be reused. Deterministically flag sessions that exceed the
    absolute lifetime or survive past idle-timeout thresholds (e.g., NIST SP 800-63B AAL2: reauthenticate
    after >12h of use or >30 min inactivity; AAL3: >12h or >15 min) and any session whose token is used
    after a logout/invalidation event. A positive result indicates a control gap that lengthens an attacker''s
    window to ride a hijacked session; it directly maps to the Isolate goal of bounding session validity.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each session_id\n  age = last_seen - created\n  idle = current_request_time - prev_request_time\n\
      \  IF age > 12h\n     OR idle > idle_ceiling(AAL2=30m, AAL3=15m)\n     OR request_seen_after logout_event(session_id)\n\
      \  THEN ALERT 'session lifetime / idle / post-logout violation'"
- question: Are any session identifiers too weak (insufficient length/entropy), failing to regenerate
    on privilege change, or missing required Secure/HttpOnly/SameSite cookie attributes?
  context: Strong, properly attributed session identifiers are foundational to session isolation. Flag
    session IDs below recommended strength (length <128 bits / effective entropy <64 bits) and sessions
    where the identifier is NOT regenerated upon login or role/privilege elevation, which enables session
    fixation. Also verify that Set-Cookie responses in http.log carry the Secure, HttpOnly, and SameSite
    attributes. A positive finding (short/low-entropy tokens, no regeneration, or missing flags) reveals
    a structural weakness an attacker can exploit to fixate or steal a session, undermining the Isolate
    objective.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM http.log Set-Cookie events\nFOR each session_cookie\n  IF length_bits(session_id) < 128\
      \ OR entropy_bits(session_id) < 64\n     OR session_id unchanged across login/role-elevation\n \
      \    OR NOT (has Secure AND has HttpOnly AND has SameSite)\n  THEN ALERT 'weak or non-regenerated\
      \ session identifier / missing cookie flags'"
- question: Do any HTTP requests match WAF signatures for XSS cookie exfiltration, session-fixation injection
    of attacker-chosen IDs, or parameter tampering targeting session tokens?
  context: Mediating session access also means inspecting request content for active attempts to steal
    or fixate tokens. Apply tuned WAF signatures (e.g., OWASP CRS anomaly scoring) to detect XSS payloads
    that exfiltrate document.cookie, injection of attacker-chosen session IDs (fixation), and parameter
    tampering against session-token parameters. Rule tuning materially improves precision over default
    rule sets. A positive match indicates an in-progress session-targeting attack; correlate with the
    affected session and source to scope impact. This directly supports the Isolate tactic by blocking
    the mechanisms that break session boundaries.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: WAF/Rule pseudocode
    query: "MATCH request against OWASP CRS (anomaly scoring)\n  rules: XSS cookie-exfiltration (document.cookie)\n\
      \         session-fixation (client-supplied session id in URL/body)\n         parameter tampering\
      \ of session token params\nIF anomaly_score >= tuned_threshold\nTHEN ALERT 'session-fixation / token-theft\
      \ payload detected'"
- question: Do any sessions exceed established per-application and per-user baselines for duration, unique
    URLs, request count, or byte volume, indicating automation or abuse?
  context: Statistical baselining helps distinguish normal human sessions from automated abuse that evades
    simple rules. Establish per-application and per-user baselines for session duration, number of unique
    URLs, requests per session, and request/response byte volume using Zeek http.log/conn.log, deriving
    thresholds from trailing 30-day distributions. Alert when a session exceeds the 95th/99th percentile
    for these volume metrics. A positive result suggests scripted scraping, abuse, or a hijacked session
    being driven by automation; validate thresholds against labeled web-attack corpora to control false
    positives. Supports Isolate by surfacing sessions whose behavior is inconsistent with the legitimate
    principal.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM http.log, conn.log over trailing 30d\nPER (application, user) COMPUTE p95/p99 of\n  session_duration,\
      \ distinct_urls, request_count, byte_volume\nFOR each new session\n  IF metric > p99_baseline(application,user)\n\
      \  THEN ALERT 'session exceeds volume baseline (possible automation/abuse)'"
- question: Are new-session creation rates per application deviating significantly from expected time-series
    behavior, indicating credential stuffing or service disruption?
  context: Mediating session access includes watching the aggregate rate at which sessions are minted.
    Build a per-hour, per-application time series of new session counts (Frequency) and apply change-point
    detection (CUSUM/PELT/Bayesian online) to alert on deviations beyond expected confidence intervals.
    Combine with per-entity Bayesian profiling for adaptive per-user thresholds. A sudden spike can indicate
    credential stuffing or a scripted login flood; a sharp drop can indicate service disruption. Positive
    change-points should be triaged alongside authentication failure data to confirm attack vs. legitimate
    traffic surge, supporting the Isolate goal of protecting session establishment.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM session_creation events

      BUILD time_series new_sessions per hour per application

      APPLY change_point_detection (CUSUM | PELT | Bayesian_online)

      IF deviation beyond confidence_interval

      THEN ALERT ''anomalous session creation rate (credential stuffing / disruption)'''
- question: Is a burst of failed authentications followed by successful session creation, or does the
    failed-auth rate per source or account exceed a tuned baseline?
  context: Profiling the ratio of failed-to-successful authentications and error responses (401/403/404,
    blocked WAF events) per source and per account provides a distinct signal of brute-force and credential-stuffing
    activity. Alert when a burst of Windows Event ID 4625 (failed logons) is followed by a successful
    session creation for the same account/source, or when the failed-auth rate per IP exceeds a tuned
    baseline. A positive result (many failures then a success) suggests a guessed/stuffed credential leading
    to a now-authenticated session that should be scrutinized; this supports Isolate by catching compromised-but-valid
    sessions at the moment of creation.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM WinEvent 4625 (fail), 4624 (success), http 401/403/404, WAF blocks\nPER (source_ip, account)\n\
      \  fail_rate = count(failures)/window\n  IF fail_rate > tuned_baseline\n     OR (burst_of_failures\
      \ THEN successful_session_creation)\n  THEN ALERT 'auth failure burst preceding session (brute force\
      \ / stuffing)'"
- question: What is the risk score for each session-initiation event based on source IP/ASN, geolocation,
    device/User-Agent fingerprint, and time-of-day, and which sessions warrant step-up authentication
    or alerting?
  context: Risk-based scoring operationalizes adaptive threat mitigation for session access. Score each
    session-initiation event using first-party features (source IP/ASN, geolocation, device/User-Agent
    fingerprint, time-of-day) by combining per-feature likelihood ratios into a global risk score; trigger
    step-up authentication or alert above a tuned threshold and surface the top-3 contributing features
    (e.g., new ASN, new device, impossible-travel geo). New-IP/new-device/new-geo combinations are the
    dominant operational risk features. A high-scoring session-initiation that bypassed step-up auth deserves
    review. This directly implements the Isolate tactic by mediating risky session establishment before
    access is granted.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR each session_initiation event\n  features = {ip, asn, geo, device_fp, user_agent, time_of_day}\n\
      \  score = combine(per_feature_likelihood_ratio(features))\n  IF score > tuned_threshold\n  THEN\
      \ require_step_up_auth OR ALERT with top_3_contributing_features"
- question: Does any session's ordered request stream or lifecycle event chain (auth->create->requests->logout)
    follow an implausible sequence for the principal?
  context: Modeling the ordered per-session request stream catches attacks that look normal request-by-request
    but follow an abnormal path. Use variable-order Markov chains or an LSTM sequence model on the URL
    path sequence and the session-lifecycle event chain (auth->create->requests->logout), flagging sessions
    whose sequence is implausible for the principal. Run this in parallel to deterministic rules and emit
    the lowest-probability transitions as explanation. A positive result (e.g., requests appearing before
    authentication, or an unusual navigation path) suggests automation or a hijacked session; this supports
    Isolate by validating that session activity follows expected, authorized flows.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "TRAIN variable_order_markov | LSTM on per-session request sequences\n  (url_path order, lifecycle:\
      \ auth->create->requests->logout)\nFOR each session\n  seq_prob = model.score(session.sequence)\n\
      \  IF seq_prob < threshold\n  THEN ALERT 'implausible session request sequence' WITH lowest_prob_transitions"
- question: Do any HTTP requests classify as session-targeting attacks under an explainable supervised
    model, and what features drive each classification?
  context: An explainable supervised classifier trained on labeled HTTP requests (protocol, frequency,
    and content features) can flag session-targeting attacks while giving analysts the top contributing
    features per alert for triage. Validate the model on labeled corpora. A positive classification highlights
    requests likely to be part of a session attack (e.g., fixation, hijacking attempt, token tampering);
    the surfaced features let an analyst quickly confirm or dismiss the alert. This complements rule-
    and statistics-based detection and supports the Isolate tactic by adding content-aware mediation of
    session-related requests.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "TRAIN explainable_classifier on labeled HTTP requests\n  features = {protocol, frequency,\
      \ content}\nFOR each request\n  pred, feature_attributions = model.predict_explain(request)\n  IF\
      \ pred == 'session-targeting attack'\n  THEN ALERT WITH top_contributing_features"
- question: When clustering sessions by behavioral features, do any sessions fall into clusters characteristic
    of automated or suspicious activity rather than normal user behavior?
  context: Unsupervised clustering groups sessions by behavior so anomalous automated activity separates
    from normal human use. Train a clustering model (e.g., K-Means) on session features such as duration,
    request rate, URL diversity, User-Agent, and source IP, then use cluster assignments to distinguish
    normal user behavior from suspicious automated sessions, reporting the features driving cluster membership
    for triage. A positive result is a session assigned to a cluster dominated by automation/abuse signatures;
    analysts review the driving features to confirm. This supports Isolate by exposing sessions whose
    behavioral profile is inconsistent with legitimate, mediated access.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FEATURES per session = {duration, request_rate, url_diversity, user_agent, source_ip}\nMODEL\
      \ = KMeans.fit(historical_sessions)\nFOR each session\n  cluster = MODEL.predict(session.features)\n\
      \  IF cluster in suspicious_automation_clusters\n  THEN ALERT WITH features_driving_cluster_membership"
