name: 'D3-DRT: Domain Registration Takedown'
id: 273d7399-91a1-4d85-8948-355ccc0d895a
description: This playbook helps an analyst build and defend a domain-registration takedown (D3FEND D3-DRT)
  request against domains used maliciously against the organization. It walks the analyst through corroborating
  a domain's malicious use with DNS-query behavior (Zeek dns.log), connection telemetry (Zeek conn.log),
  and endpoint process context (Windows Event ID 4688), then compiling registration/infrastructure characteristics,
  volume/frequency/state metrics, and failure-mode signals (NXDOMAIN, SERVFAIL, blocked connections) into
  evidence sufficient to submit and defend a takedown to the registrar, nameserver host, or TLD. The questions
  span deterministic symbolic-logic matching (threat-intel correlation, typosquat/homoglyph edit-distance
  rules, registration-time abuse rules, and evidence-packet assembly), statistical scoring (lexical entropy/KL
  divergence, prevalence/dynamism/fast-flux, activation surges, and DNS failure-mode signals), and machine-learning
  approaches (passive-DNS reputation classification, deep DGA/homoglyph models, and graph-based campaign
  clustering) so the resulting takedown packet is granular, explainable, and defensible.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which domains queried by our hosts match known-malicious, newly registered (NRD), parked,
    or abuse-reported entries in our threat-intelligence and reputation feeds, and what session and process
    context can we bind to each match for a takedown packet?
  context: This is the deterministic floor of the takedown investigation. Correlate every domain seen
    in Zeek dns.log against curated threat-intelligence and reputation feeds (known-malicious, NRD, parked,
    abuse-reported). On a match, pivot to the linked Zeek conn.log sessions and the Windows Event ID 4688
    process that initiated the resolution so the takedown evidence package shows which internal host and
    process contacted the domain. Under the Evict tactic this provides the clearest, least-disputable
    justification for a registrar/nameserver/TLD abuse request. A positive match is high-confidence evidence;
    layer it beneath statistical/ML scoring rather than treating its absence as exoneration, consistent
    with passive-DNS reputation evidence ([EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf)).
  answer_sources: &id001
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Our organization''s internet gateway and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_dns AS d JOIN threat_intel AS ti ON d.query == ti.domain

      WHERE ti.category IN (''malicious'',''NRD'',''parked'',''abuse_reported'')

      JOIN zeek_conn AS c ON c.uid == d.uid

      JOIN win_4688 AS p ON p.host == c.orig_host AND p.time NEAR c.ts

      EMIT {domain, host, process_name, process_cmdline, conn.id, ti.category} AS takedown_evidence'
- question: Do any queried or resolved domains fall within edit-distance-1 typosquat or homoglyph variants
    of our protected brand, partner, or executive domains?
  context: Attackers register look-alike domains for phishing and brand abuse. Enumerate Damerau-Levenshtein
    distance-1 variants (omission, insertion, substitution, transposition, homophone, bitsquatting, TLD
    swap) of protected brand/partner domains and alert when any of those variants appears as a query or
    resolved answer in dns.log. Weight candidates by brand popularity to suppress false positives. For
    the Evict tactic, a confirmed look-alike domain actively resolved by our users is strong trademark-infringement
    evidence that registrars and TLDs act on quickly. A hit means a spoof domain is in play; expand to
    homoglyph/IDN cases the deep model covers (typo models per [The Long "Taile" of Typosquatting](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-szurdi.pdf);
    catalog per [The Many Faces of Typosquatting](https://arxiv.org/abs/2005.07930)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "DEFINE variants = generate_typo_variants(protected_domains,\n  ops=[omit,insert,substitute,transpose,homophone,bitsquat,tld_swap],\
      \ distance<=1)\nFROM zeek_dns AS d\nWHERE d.query IN variants OR d.answer_domain IN variants\nRANK\
      \ BY brand_popularity_weight(matched_brand) DESC\nEMIT {d.query, matched_brand, variant_op, host}"
- question: Which observed domains carry registration-time abuse indicators -- newly registered, bulk/batch-registered,
    re-registered after a prior drop, or hosted by abuse-prone registrars or name servers?
  context: Registration-time signals predict abuse before any malicious payload is seen. From WHOIS/RDAP
    and passive DNS, flag domains with age < ~30 days (tune per dataset), bulk/batch registration bursts,
    re-registration after a prior drop, or origination from abuse-prone registrars/name servers. Under
    the Evict tactic these features both prioritize early takedown and strengthen the abuse argument,
    since they demonstrate the registrar's terms were likely breached. A positive result flags emerging
    infrastructure worth pre-emptive action; absence of these signals does not clear an otherwise-malicious
    domain ([PREDATOR](https://doi.org/10.1145/2976749.2978317); [Understanding the Domain Registration
    Behavior of Spammers](https://citeseerx.ist.psu.edu/document?repid=rep1&type=pdf&doi=bf4d34a6f9d0168bb07433e84c1567bbe1ba8188)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM observed_domains AS d ENRICH whois_rdap, passive_dns\nWHERE d.age_days < 30\n   OR d.registration_burst_size\
      \ > bulk_threshold\n   OR d.reregistered_after_drop == true\n   OR d.registrar IN abuse_prone_registrars\n\
      \   OR d.nameserver IN abuse_prone_nameservers\nEMIT {domain, age_days, registrar, nameserver, abuse_flags}"
- question: For each candidate domain, can we assemble a complete, standardized abuse evidence packet
    (first/last seen, affected hosts, resolved infrastructure, connection volumes, registration metadata,
    and sample indicators) in the format the registrar/nameserver/TLD workflow requires?
  context: 'A takedown succeeds or fails on the quality of its evidence packet. For each candidate domain,
    compile first-seen/last-seen timestamps, affected internal hosts, resolved infrastructure (IPs/ASNs/name
    servers), connection destinations and byte volumes, registration metadata, and sample malicious indicators
    -- including any matched brand-impersonation logo/domain-mismatch evidence ([Phishpedia](https://www.usenix.org/system/files/sec21-lin.pdf))
    -- in the standardized format the abuse workflow expects. Under the Evict tactic this is the deliverable
    that operationalizes everything else: it must clearly demonstrate, with evidence, that the registrar/nameserver
    terms and conditions were breached. A complete packet shortens the notoriously slow takedown cycle.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns d, zeek_conn c, win_4688 p WHERE c.uid==d.uid AND p.host==c.orig_host\nGROUP\
      \ BY d.query\nAGGREGATE first_seen=min(ts), last_seen=max(ts),\n  affected_hosts=set(c.orig_host),\
      \ resolved_ips=set(d.answer_ip),\n  asns=set(asn(d.answer_ip)), nameservers=set(rdap.ns),\n  total_bytes=sum(c.orig_bytes+c.resp_bytes),\
      \ sample_indicators=collect(top_iocs)\nFORMAT AS registrar_abuse_template"
- question: Which domains exhibit high lexical randomness -- elevated Shannon entropy, rare n-grams, or
    high KL divergence from an English character-frequency model -- marking them as likely DGA or algorithmically
    generated infrastructure?
  context: Algorithmically generated domains used for C2 and evasion have non-linguistic character distributions.
    Compute per-domain Shannon entropy, n-gram rarity, and Kullback-Leibler divergence against an English
    character-frequency model from dns.log; KL divergence discriminates generated strings better than
    raw entropy. Prioritize domains above the 95th percentile of a rolling 30-day baseline and surface
    the contributing lexical scores in the alert. For the Evict tactic, a cluster of high-randomness domains
    hitting one host justifies a coordinated takedown and supports the DGA-family story. False positives
    include legitimate CDNs/hashed subdomains, so corroborate with reputation and resolution behavior
    ([Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns AS d\nCOMPUTE entropy=shannon(d.query), ngram_rarity=mean_rare_ngram(d.query),\n\
      \        kl=kl_divergence(char_freq(d.query), english_model)\nBASELINE rolling_30d PERCENTILE 95\
      \ ON kl\nWHERE kl > p95 OR entropy > entropy_p95\nEMIT {domain, entropy, ngram_rarity, kl, host}"
- question: Which domains show prevalence-and-dynamism or fast-flux characteristics -- short lifetime,
    access bursts, many distinct resolved IPs/countries, unusual TTLs, or rapidly growing resolved-IP
    sets across /16s and ASes?
  context: Fast-flux and highly dynamic resolution betray resilient malicious infrastructure. From dns.log/conn.log
    derive features such as domain lifetime, daily-change and access-burst patterns, count of distinct
    resolved IPs/countries, TTL mean/variance/cardinality, and resolved-IP-set overlap and growth-ratio
    across /16s and ASes, then threshold against baselines. Under the Evict tactic, flux behavior is both
    a strong takedown justification (the domain is built for abuse) and a reason to escalate to the TLD
    when single-registrar action is insufficient. High dynamism with broad IP spread is a positive signal;
    stable single-IP hosting is less suspicious ([EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf);
    [FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns d JOIN zeek_conn c ON c.uid==d.uid\nGROUP BY d.query\nCOMPUTE lifetime=last_seen-first_seen,\
      \ distinct_ips=card(d.answer_ip),\n  distinct_countries=card(geo(d.answer_ip)), ttl_mean=avg(d.ttl),\
      \ ttl_var=var(d.ttl),\n  ttl_card=card(d.ttl), ip_set_growth=growth_ratio(d.answer_ip over time),\n\
      \  prefix_spread=card(slash16(d.answer_ip)), as_spread=card(asn(d.answer_ip))\nWHERE distinct_ips>flux_thr\
      \ AND (as_spread>1 OR ip_set_growth>growth_thr)\nEMIT {domain, flux_features}"
- question: Which domains show abnormal activation surges in volume, frequency, or resolution state --
    significant positive residuals against forecast query counts or abrupt changepoints indicating active
    C2?
  context: A dormant-then-active domain often marks the start of a C2 campaign. Track Volume (bytes and
    query counts per domain), Frequency (queries/min and connection fan-out), and State (resolution success
    vs failure) over time; forecast expected per-domain DNS request counts and flag domains with significant
    positive residuals or abrupt slope/changepoint shifts. Under the Evict tactic, an activation surge
    timestamps the onset of abuse for the takedown packet and corroborates registration-burst statistics
    linking newly registered domains to imminent campaigns. A clear surge is a positive signal of active
    malicious infrastructure; steady low-volume traffic is less urgent ([Understanding the Domain Registration
    Behavior of Spammers](https://citeseerx.ist.psu.edu/document?repid=rep1&type=pdf&doi=bf4d34a6f9d0168bb07433e84c1567bbe1ba8188)).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns d JOIN zeek_conn c ON c.uid==d.uid\nBUCKET ts BY 1h GROUP BY d.query\nCOMPUTE\
      \ qcount=count(*), bytes=sum(c.orig_bytes+c.resp_bytes),\n  fanout=card(c.resp_host), success_ratio=count(d.rcode==NOERROR)/count(*)\n\
      FORECAST expected_qcount = ts_model(qcount history)\nWHERE residual(qcount, expected_qcount) > k*sigma\
      \ OR changepoint(qcount)\nEMIT {domain, qcount, expected_qcount, residual, changepoint_ts}"
- question: Which hosts or domains show DNS failure-mode signals -- sustained NXDOMAIN/SERVFAIL bursts
    or a high ratio of failed-to-successful resolutions and connections -- indicating DGA beaconing, sinkholing,
    or disrupted malicious infrastructure?
  context: 'Failure signals are independently diagnostic. Treat NXDOMAIN rate, SERVFAIL, and blocked/failed
    connection counts as distinct signals: sustained NXDOMAIN bursts from a host indicate DGA beaconing
    against unregistered or sinkholed infrastructure, while a high failed-to-successful resolution-and-connection
    ratio for a domain flags emerging or already-disrupted malicious infrastructure. Baseline per host
    and per domain. Under the Evict tactic, NXDOMAIN bursts help enumerate the DGA''s candidate domain
    space for proactive takedown/registration-lock, and disrupted-infrastructure ratios confirm prior
    mitigation. A spike above baseline is positive; normal failure rates are background noise ([EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf)).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_dns d LEFT JOIN zeek_conn c ON c.uid==d.uid\nBUCKET ts BY 1h GROUP BY d.orig_host,\
      \ d.query\nCOMPUTE nxdomain=count(d.rcode==NXDOMAIN), servfail=count(d.rcode==SERVFAIL),\n  failed_conn=count(c.conn_state\
      \ IN failed_states), success=count(d.rcode==NOERROR),\n  fail_ratio=(nxdomain+servfail+failed_conn)/max(success,1)\n\
      BASELINE per host, per domain\nWHERE nxdomain > nx_baseline*k OR fail_ratio > ratio_thr\nEMIT {host,\
      \ domain, nxdomain, servfail, fail_ratio}"
- question: How do candidate domains rank when scored by a supervised passive-DNS reputation model on
    network-, zone-, and evidence-based features, and what are the top contributing features for each?
  context: To prioritize takedown effort, train a supervised domain-risk classifier (decision-tree/random-forest)
    on network-based features (IP/BGP/AS/registrar diversity), zone-based lexical features, and evidence-based
    features computed from first-party resolver logs ([Notos](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf);
    [Kopis](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Antonakakis.pdf)). Use explainable
    tree splits ([EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf)) to rank
    candidate domains by likelihood of malicious use and takedown urgency, and surface the top-3 contributing
    features in the alert text for triage and the takedown packet. Under the Evict tactic this converts
    noisy telemetry into a defensible, ranked queue and gives reviewers human-readable justification.
    A high score plus interpretable features supports action; a low score deprioritizes without hard exclusion.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL domain_risk = random_forest(label=malicious)\nFEATURES network=[ip_div, bgp_div, as_div,\
      \ registrar_div],\n         zone=[entropy, ngram, length, kl],\n         evidence=[first_party_query_count,\
      \ distinct_hosts, ttl_stats]\nSCORE observed_domains -> risk\nEXPLAIN top3_features per domain\n\
      RANK BY risk DESC EMIT {domain, risk, top3_features}"
- question: Do deep models (character-level LSTM for DGA family attribution, Siamese-CNN for visual/IDN-homoglyph
    spoofs) flag domains that rule-based and statistical methods miss, and what predicted family or matched
    brand do they report?
  context: Some malicious domains evade lexical rules and edit-distance checks. Run a character-level
    LSTM that classifies and family-attributes DGA domains directly from raw characters without WHOIS/NXDOMAIN
    context, resisting dictionary-DGA evasion ([Predicting Domain Generation Algorithms with LSTM](https://arxiv.org/abs/1611.00791)),
    and a Siamese-CNN visual-similarity model to catch IDN-homograph/homoglyph brand spoofs that edit-distance
    rules miss ([Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738)).
    Report the predicted family or matched brand as explainable evidence. For the Evict tactic, family
    attribution links multiple domains to one campaign for a consolidated takedown, and visual-match evidence
    is compelling for trademark abuse claims. A model hit warrants review even absent other signals.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL dga_lstm = char_lstm(input=domain_string) -> {is_dga, family}

      MODEL homoglyph = siamese_cnn(rendered(domain), rendered(brand_set)) -> {match, brand}

      FROM zeek_dns AS d

      PREDICT dga_lstm(d.query), homoglyph(d.query)

      WHERE is_dga==true OR homoglyph.match==true

      EMIT {domain, predicted_family, matched_brand}'
- question: When we build a bipartite graph of domains, resolved IPs, certificates, and internal victims
    and run community detection, which coordinated infrastructure clusters emerge that justify a single
    multi-domain takedown request?
  context: Individual domains are easy to replace; campaign infrastructure is not. Build a bipartite graph
    linking domains, resolved IPs, certificates, and internal victims, then cluster by resolved-IP-set
    overlap and run community detection to identify coordinated infrastructure ([FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf)
    flux-network clustering). The resulting multi-indicator cluster provides stronger justification across
    multiple domains in a single takedown request. Under the Evict tactic this maximizes disruption per
    takedown action and reveals related domains not yet observed in our own telemetry. A dense, multi-domain/multi-IP
    community is a strong positive signal of a campaign; isolated single-edge nodes are weaker candidates.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Graph pseudocode
    query: "BUILD graph G nodes={domain, ip, cert, victim_host}\n  edges={domain-resolves->ip, domain-uses->cert,\
      \ victim-queries->domain}\nCLUSTER by shared_resolved_ip_overlap\nRUN community_detection(G) ->\
      \ communities\nWHERE community.size > 1 AND community.distinct_domains > 1\nEMIT {community_id,\
      \ domains, ips, certs, victims} AS multi_domain_takedown"
