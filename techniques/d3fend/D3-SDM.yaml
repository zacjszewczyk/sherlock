name: 'D3-SDM: System Daemon Monitoring'
id: 5d4c2934-b119-4b31-8fca-84dca7c9894a
description: Investigate changes to the state and configuration of critical system services and daemons
  across Windows, Linux, and macOS hosts to detect adversary tampering with logging, security tooling,
  and persistence mechanisms. This playbook helps an analyst (1) deterministically catch malicious or
  suspicious service/daemon installation, security-service stop/disable/mask actions, service start-type
  downgrades, ImagePath binary swaps, and registry-based weakening of security controls; (2) apply statistical
  baselining of service prevalence, crash/start-failure spikes, registry-write bursts, restart loops,
  and multi-feature anomaly scoring to surface rare and anomalous service behavior; and (3) run sequence,
  provenance-graph, language-model, and HMM-based machine-learning detectors to flag tamper chains, anomalous
  admin service-control sessions, and deviating daemon runtime behavior. It draws telemetry from Windows
  System/Security and Sysmon logs (Event IDs 4697, 7045, 7036, 7040, 7031, 7034, 4688, 13, 12, 4657),
  Linux auditd and the systemd journal, and the macOS Endpoint Security Framework / Unified Log, supporting
  the Detect mission of establishing baseline behavior of critical system services to enable anomaly detection.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
