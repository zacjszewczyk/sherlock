questions:
- question: Has any Windows service been installed (Event ID 4697/7045) whose service binary (ImagePath)
    matches a known persistence/lateral-movement tool name, or whose binary is rooted in a user-writable
    directory such as Temp, AppData, Users\Public, or ProgramData?
  context: Adversaries frequently install services to gain persistence or execute code with SYSTEM privileges,
    often using well-known tools (psexesvc.exe, paexec) or dropping the service binary into user-writable
    paths that legitimate services rarely use. Monitor Event ID 4697 (Security log) and 7045 (System log)
    for service installation, extract the ImagePath, compare it against a curated threat-intel feed of
    known persistence-tool names, and flag any ImagePath rooted under \Temp\, \AppData\, \Users\Public,
    or \ProgramData. A match is a high-confidence indicator of a malicious service install supporting
    the Detect mission's goal of catching deviations from known-good service behavior; a clean result
    means the install matches neither known-bad names nor suspicious paths but should still be retained
    for statistical review. Validate detection coverage with Atomic Red Team T1543.003.
  answer_sources: &id001
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Windows Event ID 7036
  - Windows Event ID 7040
  - Windows Event ID 7031
  - Windows Event ID 7034
  - Windows Event ID 4688
  - 'NAI: Windows Event Logs (System and Security) on all domain-joined endpoints and servers, with focus
    on Domain Controllers and critical application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for event in (win_eventid_4697, win_eventid_7045):\n  img = lower(event.ImagePath)\n  if basename(img)\
      \ in threat_intel_service_tool_names\n     or img matches '\\\\temp\\\\|\\\\appdata\\\\|\\\\users\\\
      \\public|\\\\programdata':\n    alert(severity=HIGH, host, user, service_name=event.ServiceName,\
      \ image_path=img)"
- question: Did any critical Windows security service (WinDefend, MpsSvc, EventLog, Sense, MsSecFlt, Sysmon)
    transition to a 'stopped' state (Event ID 7036) outside an approved maintenance window?
  context: Disabling defensive services is a primary precursor to attacker activity going unnoticed, as
    it blinds antivirus, firewall, and logging. Monitor Event ID 7036 (Service Control Manager state changes)
    for the named security services entering the 'stopped' state and alert immediately when this occurs
    outside a documented maintenance window. This directly supports the Detect mission by treating loss
    of security-service availability as a tamper signal rather than benign noise. A positive result warrants
    urgent investigation into who or what stopped the service (crash vs. deliberate manipulation), aligned
    with MITRE CAR-2016-04-003. A negative result confirms continued security-service coverage.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "critical_sec_services = {WinDefend, MpsSvc, EventLog, Sense, MsSecFlt, Sysmon}\nfor event\
      \ in win_eventid_7036:\n  if event.service in critical_sec_services and event.state == 'stopped'\n\
      \     and not within_maintenance_window(event.time, event.host):\n    alert(severity=HIGH, host,\
      \ service=event.service, time=event.time)"
- question: Was the start type of any Windows security service changed to Disabled (4) or Demand (Event
    ID 7040 or registry Start value), which commonly precedes stopping the service?
  context: Before stopping a security service, adversaries often downgrade its start type to Disabled
    or Demand so it will not restart after reboot. Monitor Event ID 7040 (service start type changed)
    and the registry Start value under the service key; alert when a security service's Start is set to
    4 (Disabled) or to Demand. This catches the tamper attempt earlier in the kill chain than a stop event,
    supporting proactive detection. A positive result indicates intent to persistently disable defenses;
    a negative result means start types remain at their hardened defaults. Reproduce and validate with
    Atomic Red Team T1543.003.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for event in win_eventid_7040:\n  if event.service in critical_sec_services\n     and event.new_start_type\
      \ in ('Disabled'/4, 'Demand'):\n    alert(severity=HIGH, host, service=event.service, new_start_type=event.new_start_type)"
- question: Across the enterprise, which service installations (Event ID 4697/7045) are rare anomalies,
    appearing on fewer than ~1% of hosts (bottom 5th percentile of prevalence) over a rolling 30-day window?
  context: Malicious services are typically rare across a fleet, whereas legitimate services are widely
    and consistently deployed. Aggregate Event ID 4697/7045 fleet-wide over a 30-day rolling window, compute
    the prevalence of each ImagePath/service name, and flag those below ~1% prevalence (bottom 5th percentile)
    for analyst review, deriving the exact cutoff from your own environment's baseline. This statistical
    prevalence approach (per EXPOSURE, Bilge et al.) surfaces low-and-slow persistence that exact-match
    rules miss. A positive result is a rare service worth triage; a negative result means the service
    is common and likely benign.
  answer_sources: *id001
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'window = 30d

      counts = count_distinct_hosts(by service_name, image_path) over window

      total_hosts = count_distinct(host)

      prevalence = counts / total_hosts

      flag service where prevalence < 0.01  // bottom ~5th percentile, tune per env

      review(flagged, host, service_name, image_path)'
- question: Are there statistically significant spikes in service crashes/restarts (Event ID 7031/7034)
    or start failures (Event ID 7000/7009/7011) for any service on any host, exceeding 3 robust z-scores
    or breaching an EWMA control chart?
  context: 'Repeated service crashes, restarts, and blocked starts can be a distinct tamper signal: an
    attacker may be killing a security service or its binary may have been corrupted/replaced. Baseline
    crash/restart counts (Event ID 7031/7034) and start failures (7000/7009/7011) per service per host,
    then alert on spikes greater than 3 robust z-scores (median/MAD) or an EWMA control-chart breach.
    Treat repeated failures as a tamper indicator, not noise, and feed the counts as features into an
    Isolation Forest. A positive result indicates abnormal instability worth correlating with stop/disable
    events; a negative result reflects normal service stability.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (host, service):\n  baseline = robust_stats(count(7031,7034,7000,7009,7011) per day)\n\
      \  z = (today_count - baseline.median) / baseline.mad\n  if z > 3 or ewma_control_breach(series):\n\
      \    alert(host, service, count=today_count, z=z)\nexport counts as features -> isolation_forest"
- question: When scoring a per-service/per-host feature vector (install count, start/stop frequency, off-hours
    start ratio, crash rate, start-failure rate, account, path-rarity) with an unsupervised Isolation
    Forest, which services are the top anomalies and what features drive their scores?
  context: Single-metric thresholds miss multivariate anomalies where each feature is individually normal
    but the combination is suspicious. Build a per-service/host feature vector covering install count,
    start/stop frequency per hour, off-hours start ratio, crash rate, start-failure rate, executing account,
    and path-rarity, then score with an unsupervised Isolation Forest (Liu et al.). Surface the top-3
    contributing features in the alert text so analysts can quickly judge why the service was flagged.
    This supports the Detect mission's anomaly-detection goal against subtle service tampering. A high
    anomaly score with explanatory features warrants investigation; a low score indicates the service
    behaves like the learned norm.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = vector(install_count, start_stop_freq_per_hr, offhours_start_ratio,\n         \
      \        crash_rate, start_failure_rate, account, path_rarity)\nmodel = IsolationForest(features\
      \ over baseline)\nscore = model.decision_function(current)\nif score in top_anomalies:\n  alert(host,\
      \ service, score, top3_features=explain(score))"
- question: Do any Windows service start/stop log-key sequences (Event ID 7036/7045) deviate from the
    benign sequences a DeepLog LSTM model has learned, for example a security service stopping without
    its normal preceding maintenance sequence?
  context: Legitimate service lifecycle events follow predictable orderings; attacker tampering often
    breaks the expected sequence (e.g., a defensive service stopping without the usual update/maintenance
    precursors). Train DeepLog (Du et al.), an LSTM over log-key sequences, on benign Event ID 7036/7045
    streams, then flag entries that fall outside the top-g predicted next keys and emit the deviating
    log key plus the expected sequence as explanation. The model supports online feedback updates as baselines
    evolve. A flagged deviation indicates an out-of-order or unexpected service event worth review; conformance
    to predictions indicates normal service behavior.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DeepLog(LSTM).train(benign_logkeys(7036,7045))\nfor entry in service_event_stream:\n\
      \  if entry.logkey not in model.predict_topg(entry.context):\n    alert(host, service, deviating_key=entry.logkey,\
      \ expected=model.predict_topg(entry.context))"
- question: Does whole-system provenance analysis (KAIROS) reveal rare process->service/registry subgraphs,
    such as an unusual parent process stopping WinDefend/EventLog or replacing a service binary?
  context: Service tampering rarely happens in isolation; it sits within a process/file/registry provenance
    graph whose structure can reveal the attack even when individual events look benign. Apply KAIROS
    (Cheng et al.) whole-system provenance anomaly detection to flag rare process->service or process->registry
    subgraphs, for example an unexpected parent process stopping a defensive service or swapping a service
    binary, and reconstruct the attack graph with edge-level explanation. A flagged subgraph provides
    analysts a ready-made causal narrative for investigation; absence of rare subgraphs indicates service
    interactions match learned benign provenance.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph = build_provenance(process, service, registry, file edges)\nmodel = KAIROS.train(benign_provenance)\n\
      for subgraph in graph.windows():\n  if model.anomaly(subgraph) and subgraph.touches(security_service\
      \ or service_binary):\n    alert(reconstruct_attack_graph(subgraph), edge_explanation)"
- question: When combined service and authentication event streams are scored with an attention-augmented
    RNN language model, which host/service/time fields receive the highest attention weights as drivers
    of anomalous events?
  context: Explainability is essential for analyst trust and rapid triage. Score combined service/auth
    event streams with an attention-augmented RNN language model (Brown et al.), using the attention weights
    to surface the contributing host, service, and time fields per alert, satisfying the top-3 feature
    explainability requirement. This complements sequence and graph detectors by attributing anomaly to
    specific fields. A high-attention anomalous event tells the analyst exactly which host/service/time
    combination is unusual; low anomaly scores indicate event streams consistent with learned norms.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = AttentionRNN_LM.train(benign(service_events + auth_events))\nfor event in combined_stream:\n\
      \  p, attn = model.score(event)\n  if p < anomaly_threshold:\n    alert(host, service, time, top_fields=topk(attn,3))"
- question: Have any Linux systemd .service unit files been created or modified under /etc/systemd/system,
    /usr/lib/systemd/system, /run/systemd/system, or ~/.config/systemd/user, or were systemctl enable/start/daemon-reload
    commands run, outside change-management?
  context: Creating or editing systemd unit files is a common Linux persistence and tampering technique.
    Use auditd file watches on the systemd unit directories plus EXECVE monitoring of 'systemctl enable/start/daemon-reload'
    to detect new or modified .service units, alerting on any change outside approved change-management
    (per the Sigma auditd systemd service creation rule). A positive result indicates a potentially unauthorized
    service definition that should be inspected for malicious ExecStart commands; a negative result means
    unit files match the approved baseline. This supports the Detect mission across Linux endpoints and
    servers.
  answer_sources: &id002
  - Linux auditd (SERVICE_START/SERVICE_STOP, EXECVE, file watches)
  - systemd journal
  - macOS Endpoint Security Framework / Unified Log
  - 'NAI: auditd and systemd-journald on Linux servers/endpoints; ESF and Unified Log on macOS hosts;
    centralized in the SIEM.'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: "watch_paths = [/etc/systemd/system, /usr/lib/systemd/system, /run/systemd/system, ~/.config/systemd/user]\n\
      for e in auditd:\n  if (e.type==PATH and e.path in watch_paths and e.op in (create,write))\n   \
      \  or (e.type==EXECVE and e.cmd matches 'systemctl (enable|start|daemon-reload)'):\n    if not in_change_management(e):\n\
      \      alert(host, user, unit=e.path, cmd=e.cmd)"
- question: Was any Linux or macOS security daemon (auditd, falcon-sensor, osqueryd, ufw/firewalld, sshd
    hardening agents) stopped, disabled, masked, or unloaded via systemctl/launchctl, or did its unit
    transition to Failed/inactive?
  context: As on Windows, disabling security daemons blinds defenders. Alert on 'systemctl stop/disable/mask'
    and 'launchctl unload/bootout' targeting security daemons, and on systemd Failed/inactive transitions
    for those units, derived from auditd, the systemd journal, and the macOS ESF/Unified Log. A positive
    result is a high-priority tamper indicator requiring investigation of the actor and intent; a negative
    result confirms continued daemon coverage. Masking is especially serious because it prevents the unit
    from being started at all, so it deserves elevated severity.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: "sec_daemons = {auditd, falcon-sensor, osqueryd, ufw, firewalld, sshd}\nfor e in (auditd_execve,\
      \ journal, macos_esf):\n  if e.cmd matches 'systemctl (stop|disable|mask)' or 'launchctl (unload|bootout)'\
      \ on sec_daemons\n     or e.unit in sec_daemons and e.state in (failed, inactive):\n    alert(severity=HIGH,\
      \ host, user, daemon=e.unit, action=e.cmd)"
- question: Which systemd units show restart-loop or Failed counts above their per-unit 99th percentile
    or a sustained Failed state, indicating possible tampering?
  context: Repeated daemon restart loops or sustained Failed states can signal that an attacker is killing
    a daemon, or that a tampered binary/config prevents it from starting. Baseline systemd restart-loop
    and Failed counts per unit, then alert on restart counts above the per-unit 99th percentile or on
    sustained Failed state, treating failure/blocked-start as a distinct tamper signal. When combining
    multiple units, score with an Isolation Forest (Liu et al.). A positive result warrants correlation
    with stop/disable/mask events and config changes; a negative result reflects normal daemon stability.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for unit:\n  p99 = percentile(restart_count_per_day, 99)\n  if today_restarts > p99 or sustained_failed(unit):\n\
      \    alert(host, unit, restarts=today_restarts)\nif multi_unit: IsolationForest(features=[restarts,\
      \ failed_duration, ...])"
- question: Do any administrator service-control shell sessions (systemctl/launchctl/service stop/disable/mask
    sequences) deviate from learned admin baselines when scored with a DistilBERT session model?
  context: Exact-string rules miss novel or obfuscated service-control sequences. Apply a DistilBERT-based
    shell-session anomaly detector (Liu and Buford) over admin shell sessions to flag service-control
    command sequences (systemctl/launchctl/service stop/disable/mask) that deviate from learned administrator
    baselines, catching variants that signature rules miss. A flagged session indicates unusual admin
    behavior around service control that warrants review of the full session and the operator; a low anomaly
    score indicates the session resembles normal administration. This complements deterministic rules
    on Linux/macOS hosts.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DistilBERT.train(benign_admin_shell_sessions)\nfor session in shell_sessions_with(systemctl|launchctl|service):\n\
      \  if model.anomaly_score(session) > threshold:\n    alert(host, user, session_excerpt, score)"
- question: Does the system-call (and call-stack) sequence likelihood of any monitored daemon drop below
    the threshold learned by an HMM model, indicating injected or tampered runtime behavior?
  context: A daemon whose binary or memory has been tampered with will execute system calls in patterns
    that differ from its benign runtime behavior, even if it remains 'running'. Build an HMM (Hoang et
    al.) over the system-call and call-stack sequence of each monitored daemon, then alert when a per-sequence
    likelihood drops below the learned threshold, indicating injected or tampered behavior in the running
    service. A low-likelihood sequence is a strong indicator of in-memory tampering or code injection
    that other layers may miss; normal likelihoods indicate the daemon is behaving as trained. This supports
    deep runtime detection on critical Linux/macOS daemons.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: EDR/ML pseudocode
    query: "model = HMM.train(syscall+callstack sequences of daemon under benign ops)\nfor seq in live_daemon_syscalls:\n\
      \  if model.loglikelihood(seq) < learned_threshold:\n    alert(host, daemon, likelihood, suspect='injected/tampered\
      \ runtime')"
- question: Are there registry writes (Sysmon Event ID 13 / Windows Event ID 4657) to security-control
    keys that disable protections, such as Windows Defender DisableAntiSpyware=1, Real-Time Protection
    disables, or AutoLogger Start=0?
  context: Adversaries weaken endpoint defenses by editing registry settings rather than stopping services
    directly. Alert on Sysmon Event ID 13 and Windows Event ID 4657 writes to security-control keys, for
    example HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\DisableAntiSpyware=1, Real-Time Protection
    disables, and AutoLogger ...\Start=0, using a registry watch baseline such as the SwiftOnSecurity
    Sysmon configuration. A positive result indicates deliberate weakening of security telemetry/protection
    and should be high severity; a negative result means monitored security keys are unchanged. This directly
    serves the Detect mission of catching configuration tampering.
  answer_sources: &id003
  - Sysmon Event ID 13 (RegistryValueSet)
  - Sysmon Event ID 12 (Registry key create/delete)
  - Windows Event ID 4657
  - 'NAI: Sysmon Operational log and Security log on all Windows hosts; registry auditing enabled on service
    and security-tool keys.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "watch_keys = security_control_keys()  // Defender DisableAntiSpyware, RTP disables, AutoLogger\
      \ Start\nfor e in (sysmon_id13, win_eventid_4657):\n  if e.key in watch_keys and e.value in (disable_values):\n\
      \    alert(severity=HIGH, host, user, key=e.key, value=e.value, process=e.image)"
- question: Were any service registry keys modified to swap/hijack the binary (HKLM\SYSTEM\CurrentControlSet\Services\*\ImagePath)
    or to disable a security service (Start set to 4)?
  context: The registry is the authoritative source for service configuration, so editing ImagePath can
    hijack a service to run attacker code, and setting Start to 4 disables it. Alert on Sysmon Event ID
    13 / Windows Event ID 4657 modifications to HKLM\SYSTEM\CurrentControlSet\Services\*\ImagePath (binary
    swap/hijack) or to \Start set to 4 (Disabled) for security services. A positive result is a strong
    tamper/persistence indicator that should be correlated with service-stop and process-creation events;
    a negative result means service registry definitions are intact. Reproduce and validate with Atomic
    Red Team T1543.003.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for e in (sysmon_id13, win_eventid_4657):\n  if e.key matches 'HKLM\\\\SYSTEM\\\\CurrentControlSet\\\
      \\Services\\\\*\\\\ImagePath':\n    alert(severity=HIGH, host, service=service_of(e.key), new=e.value,\
      \ type='binary swap')\n  if e.key matches '...\\\\Services\\\\<sec_service>\\\\Start' and e.value\
      \ == 4:\n    alert(severity=HIGH, host, service, type='disabled')"
- question: Are there bursts in the per-host rate of writes to monitored service/security registry keys
    (above 3 robust z-scores from the host median), or first-ever writers of a given key?
  context: An attacker reconfiguring multiple security/service keys at once produces a burst that differs
    from a host's normal slow registry churn, and a never-before-seen actor writing a sensitive key is
    a rare-actor anomaly. Baseline the per-host rate of writes to monitored service/security registry
    keys, alert on bursts above 3 robust z-scores from the host's median, and alert on first-ever writers
    of a given key (rare-actor prevalence), following EXPOSURE (Bilge et al.). A positive result flags
    abnormal registry activity for triage; a negative result indicates registry write patterns are within
    historical norms.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for host:\n  base = robust_stats(writes_to_monitored_keys per hour)\n  z = (current - base.median)/base.mad\n\
      \  if z > 3: alert(host, burst=current, z=z)\nfor (key, writer):\n  if writer not in historical_writers(key):\
      \ alert(host, key, first_seen_writer=writer)"
- question: Do registry-modification events form tamper chains (disable -> stop -> binary swap) that deviate
    from the learned benign baseline when fed into DeepLog (sequence) and KAIROS (provenance-graph) models?
  context: 'Service-tampering attacks often unfold as a sequence: disable protection, stop the service,
    then swap the binary. Feed registry-modification events into DeepLog (Du et al.) for sequence modeling
    and KAIROS (Cheng et al.) for provenance-graph modeling to flag tamper chains that deviate from learned
    benign behavior, emitting the deviating step or subgraph as explanation. A flagged chain gives analysts
    a causal sequence to investigate and respond to before the attack completes; conformance to baseline
    indicates registry changes are part of normal operations. This ML layer catches multi-step tampering
    that single-event rules miss.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq_model = DeepLog.train(benign registry_event_keys)\ngraph_model = KAIROS.train(benign provenance)\n\
      for stream in registry_mod_events:\n  if seq_model.deviates(stream) or graph_model.anomaly(subgraph(stream)):\n\
      \    alert(host, deviating_step, subgraph, chain='disable->stop->binary swap')"
