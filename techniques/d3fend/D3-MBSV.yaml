  queries:
  - technology: ML/pseudocode
    query: "ON crash_or_mitigation_event(host, process):\n  graph = build_provenance(host, window=post_event)\n\
      \  anomaly = autoencoder_or_graph_model.score(graph)\n  ALERT WHERE anomaly > threshold\n    AND\
      \ (new_child_process OR unbacked_mem_exec OR anomalous_egress)\n    EMIT anomaly, top_nodes_edges,\
      \ host, process"
