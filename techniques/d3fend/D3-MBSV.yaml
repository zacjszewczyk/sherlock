name: 'D3-MBSV: Memory Block Start Validation'
id: 479f4612-3e48-470c-b2ee-1fb25c263413
description: 'This playbook helps an analyst assess and investigate the memory-block protection posture
  of Windows endpoints and servers, with a focus on Memory Block Start Validation (ensuring pointers reference
  the start of their intended memory block). It guides verification of exploit-mitigation coverage (CFG/DEP/ASLR/CET,
  pointer and control-flow target validation) on critical processes, and measurement of memory-corruption
  exploitation pressure: the volume, frequency, and success/fail state of access-violation crashes (exception
  0xc0000005), WerFault loops, and mitigation-block events. Use it to detect exploitation attempts, unsafe
  code changes, regressed safeguards, heap-spray activity, and anomalous post-crash behavior across crown-jewel
  applications (browsers, Office, PDF readers, web servers, and database servers).'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
