    web servers, and database servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [exception_code, faulting_module, faulting_offset,\n            process_lineage,\
      \ host_role, patch_level]\nscore = exploit_crash_classifier.predict(dedup(crash).features)\nALERT\
      \ WHERE score > 0.8\n  EMIT score, top3_features, host, process; ROUTE to threat-hunt"
- question: Does a Bayesian/AST or sequence classifier flag any browser- or Office-delivered script/content
    as containing heap-spray or exploit payloads, and which suspicious API constructs (e.g., VirtualAllocEx,
    WriteProcessMemory) or AST features explain the flag?
  context: 'Exploit delivery often arrives as malicious script or document content. For the Harden tactic,
    apply a Bayesian/AST or sequence classifier (ZOZZLE-style static AST classification, plus API-sequence
    models with SHAP/LIME explainability) to browser/Office-delivered content to flag heap-spray and exploit
    payloads. Surface the top contributing features in the alert -- suspicious APIs such as VirtualAllocEx
    and WriteProcessMemory, or telltale AST constructs -- so the analyst can confirm intent. A positive
    classification on delivered content is an early-stage warning before the memory-corruption attempt
    executes; explainable features make it triageable. References: [ZOZZLE, Curtsinger et al.](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Curtsinger.pdf),
    [a hybrid CNN-GRU with explainability, PeerJ 2025](https://peerj.com/articles/cs-3258/), and [Deep
    LSTM Malware Analysis, Ocatak](https://github.com/ocatak/lstm_malware_detection).'
