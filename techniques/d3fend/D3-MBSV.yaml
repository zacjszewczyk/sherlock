questions:
- question: Which critical executables (browsers, Office, PDF readers, web servers, and database servers)
    are running WITHOUT a required memory-protection mitigation such as Control Flow Guard (CFG), DEP,
    mandatory or bottom-up ASLR, or CET shadow stack, when compared against the approved hardening baseline?
  context: 'In the Harden tactic, the deterministic floor of protection is whether each crown-jewel process
    actually runs with the memory-corruption mitigations it should. Parse Microsoft-Windows-Security-Mitigations/Operational
    Event ID 1 to map per-process which mitigations are enabled (CFG, DEP, mandatory/bottom-up ASLR, CET
    shadow stack) and compare against the approved baseline. A process missing a required mitigation is
    an exploitable gap that a sophisticated actor can leverage for memory-corruption attacks; report missing
    controls by host owner so they can be remediated. A negative result (full coverage) confirms the host
    is hardened; a positive result identifies a concrete, actionable hardening deficiency. References:
    [Exploit Protection Reference, Microsoft](https://learn.microsoft.com/en-us/defender-endpoint/exploit-protection-reference)
    and [Control Flow Guard, Microsoft](https://learn.microsoft.com/en-us/windows/win32/secbp/control-flow-guard).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM Microsoft-Windows-Security-Mitigations/Operational EventID=1\nJOIN baseline ON process_name\n\
      WHERE process_name IN crown_jewel_list\n  AND (CFG_enabled=false OR DEP_enabled=false OR ASLR_enabled=false\
      \ OR CET_enabled=false)\nEMIT host, owner, process_name, missing_mitigations"
- question: Are critical binaries loading without Control Flow Guard (/guard:cf) or CET shadow-stack coverage,
    and are any CFG/CFI violation events firing that indicate a blocked control-flow hijack or pointer-validation
    failure?
  context: 'Memory Block Start Validation is enforced at runtime in part by control-flow integrity: indirect
    call/return targets must be validated so a corrupted pointer cannot redirect execution. For the Harden
    tactic, require /guard:cf coverage and shadow-stack precision matching the baseline. Alert when a
    critical binary loads without CFG/CET (a coverage gap), or when a CFG-violation event fires in Security-Mitigations
    (a blocked control-flow hijack attempt, i.e. active exploitation that was stopped). A violation event
    is a high-fidelity signal of an attempted pointer/control-flow attack against that process and should
    be triaged immediately. References: [Control-Flow Integrity, Abadi et al.](https://users.soe.ucsc.edu/~abadi/Papers/cfi-tissec-revised.pdf),
    [CFI survey, Burow et al.](https://arxiv.org/abs/1602.04056), and [SoK: Eternal War in Memory, Szekeres
    et al.](https://people.eecs.berkeley.edu/~dawnsong/papers/Oakland13-SoK-CR.pdf).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM Microsoft-Windows-Security-Mitigations/Operational\nWHERE EventID IN (1,2)\n  AND (mitigation='CFG'\
      \ OR mitigation='CET' OR event_type='ControlFlowGuard_violation')\n  AND process_name IN crown_jewel_list\n\
      EMIT host, process_name, mitigation, event_type, timestamp"
- question: Do in-house and high-risk parser builds destined for production pass a deterministic memory-safety
    canary/fuzzing fleet (AddressSanitizer) with zero out-of-bounds or use-after-free reports, validating
    the block-start/bounds checks the technique requires?
  context: 'This is a pre-deployment hardening gate. Build in-house and high-risk parsers with AddressSanitizer
    (ASan) and run them against a canary/fuzzing fleet to deterministically catch out-of-bounds reads/writes
    and use-after-free at the exact point of occurrence before code ships. Any ASan report on a production-bound
    build must be treated as a hard block, because it represents precisely the kind of memory-block boundary
    violation that Memory Block Start Validation aims to prevent. A clean run validates the bounds checks;
    a positive ASan finding identifies a memory-safety defect that must be fixed before deployment. References:
    [AddressSanitizer, Serebryany et al.](https://www.usenix.org/system/files/conference/atc12/atc12-final39.pdf).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Per build / CI pipeline run
  queries:
  - technology: CI/Rule pseudocode
    query: "FOR build IN production_bound_builds:\n  result = run_fuzz_fleet(build, sanitizer=ASan)\n\
      \  IF result.asan_reports > 0:\n    BLOCK build; EMIT build_id, defect_type(oob|uaf), module, stack"
- question: Did any protected critical process LOSE a required memory-protection mitigation after a patch
    or software update compared to the prior daily snapshot, and can the regression be tied to a changed
    binary (hash/signer)?
  context: 'Patching and software updates are a known source of residual attack surface: an update can
    silently drop a mitigation a process previously had. For the Harden tactic, compare daily mitigation
    inventories against prior snapshots and flag any protected process that regresses (loses CFG, CET,
    DEP, ASLR, etc.). Correlate the regression with Windows Event ID 4688 / Sysmon Event ID 1 process-execution
    metadata (image hash, signer) to identify the changed binary that introduced the weakening. A positive
    result is a newly opened exploitation window that needs immediate remediation; a negative result confirms
    hardening held through the change. References: [SoK: Eternal War in Memory, Szekeres et al.](https://people.eecs.berkeley.edu/~dawnsong/papers/Oakland13-SoK-CR.pdf).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Last 90 days (daily snapshot comparison)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "today = mitigations_inventory(date=now)\nprev  = mitigations_inventory(date=now-1d)\nregressed\
      \ = today JOIN prev ON (host,process)\n  WHERE prev.mitigations - today.mitigations != {}\nENRICH\
      \ with EventID 4688 / Sysmon EventID 1 (hash, signer)\nEMIT host, process, lost_mitigations, new_hash,\
      \ signer"
- question: Is Windows Error Reporting (WerFault.exe) being spawned repeatedly (e.g., 3 or more times
    in 5 minutes) by an exploit-targeted process such as a browser, PDF reader, or Office application,
    indicating a heap-spray attempt or repeated exploit failure?
  context: 'Repeated crashes of an exploit-targeted application produce a tell-tale loop of WerFault.exe
    spawns. In the Harden tactic, alert when WerFault.exe is spawned by a browser, PDF reader, or Office
    process more than N times in a short window (start at N=3 in 5 minutes, then tune per app). Such a
    loop is consistent with heap-spray pressure or an attacker iterating an unreliable exploit. Track
    WerFault.exe process lineage so the parent (the targeted app) is clear. A burst is a strong indicator
    of in-progress exploitation attempts; isolated, unrelated crashes are benign. References: [NOZZLE,
    Ratanaworabhan et al.](https://www.usenix.org/legacy/event/sec09/tech/full_papers/ratanaworabhan.pdf).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: 'Last 7 days (event-centered: pivot +/- 10 minutes around each burst)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM (EventID 4688 OR Sysmon EventID 1)\nWHERE child_image='WerFault.exe'\n  AND parent_image\
      \ IN (browser, pdf_reader, office)\nBUCKET 5min BY host, parent_image\nWHERE count(WerFault_spawns)\
      \ >= 3\nEMIT host, parent_image, count, window_start"
- question: Has the weekly proportion of Application Log Event ID 1000 crashes carrying exception code
    0xc0000005 (access violation) for a given application or host class exceeded its historical 90th-95th
    percentile baseline, after de-duplicating by stack-hash/faulting-module?
  context: 'Access-violation crashes (0xc0000005) are the physical signature of memory-corruption activity.
    For the Harden tactic, measure the weekly proportion of Event ID 1000 crashes with this exception
    code, broken down by application and host class, and alert when rates exceed the historical 90th-95th
    percentile. Crucially, de-duplicate crashes first by stack-hash/faulting-module bucketing so a single
    recurring bug does not inflate the count and mask a real anomaly. Derive thresholds per dataset from
    at least 4 weeks of baseline. A rate spike suggests exploitation attempts, an unsafe code change,
    or a disabled safeguard; a stable rate indicates posture is holding. References: [Evaluating Fuzz
    Testing, Klees et al.](https://arxiv.org/abs/1808.09700).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Last 90 days (weekly aggregation, >= 4 weeks baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM Windows Application Log EventID=1000 WHERE exception_code=0xc0000005

      DEDUP BY stack_hash, faulting_module

      BUCKET 1week BY app, host_class

      rate = av_crashes / total_crashes

      ALERT WHERE rate > percentile(historical_rate, 90..95)'
- question: Are elevated daily access-violation crash counts persisting across multiple consecutive time
    windows (per rolling z-score or EWMA monitoring), especially for crown-jewel applications, rather
    than appearing as a single transient spike?
  context: 'A single crash spike may be noise, but sustained elevation is a stronger exploitation signal.
    For the Harden tactic, apply rolling z-score or EWMA monitoring to daily access-violation counts and
    escalate when elevated values persist across multiple windows, using forecasting baselines (ARIMA-style)
    to distinguish real trend shifts from normal variance. Prioritize alerts for crown-jewel applications
    where a stability regression carries the highest risk. Persistent elevation points to an ongoing campaign,
    a regressed mitigation, or a destabilizing code change; a quick return to baseline suggests a transient
    event. References: [ARIMA online forecasting, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Last 90 days (daily counts, rolling window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = daily_count(EventID 1000 WHERE exception_code=0xc0000005) BY app

      z = (series - rolling_mean) / rolling_std   # or EWMA forecast residual

      ALERT WHERE z > 3 FOR >= 2 consecutive windows

      PRIORITIZE app IN crown_jewel_list'
- question: Where browser/script heap telemetry or memory dumps are available, does any object contain
    NOP-sled/shellcode-like content, and is the aggregate 'heap-health' metric (abnormal allocation volume
    in bytes/object count) breaching threshold while co-occurring with access-violation crash bursts?
  context: 'Heap spraying floods memory with attacker-controlled objects (often NOP sleds plus shellcode)
    to make exploitation reliable. For the Harden tactic, where browser/script heap telemetry or memory
    dumps exist, score each object for NOP-sled/shellcode-like content and aggregate into a thresholded
    global ''heap-health'' metric. Alert on abnormal allocation volume (bytes/object count) that co-occurs
    with crash bursts. Set the threshold well below the published-exploit detection point and validate
    against benign traffic to keep false positives near zero. Co-occurrence of high spray score and crash
    bursts is a high-confidence indicator of active heap-spray exploitation. References: [NOZZLE, Ratanaworabhan
    et al.](https://www.usenix.org/legacy/event/sec09/tech/full_papers/ratanaworabhan.pdf).'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Last 30 days (event-centered around crash bursts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR object IN heap_telemetry:\n  object.spray_score = nopsled_shellcode_likeness(object.bytes)\n\
      heap_health = aggregate(spray_score, alloc_bytes, object_count) BY host, process\nALERT WHERE heap_health\
      \ > threshold\n  AND co_occurs(access_violation_crash_burst, window=10min)"
- question: What is the ratio of Security-Mitigations BLOCK events (exploit stopped) versus unhandled
    0xc0000005 TERMINATIONS (process killed) versus WER-reported faults per process, and is there a surge
    in block events (active-but-mitigated exploitation) or in terminations (coverage gaps)?
  context: 'Raw crash volume hides whether mitigations are actually working. For the Harden tactic, explicitly
    separate the failure modes: count Security-Mitigations block events (exploit attempted but stopped),
    unhandled 0xc0000005 terminations (process killed, no mitigation caught it), and WER-reported faults,
    then track the ratio of crashing-to-clean exits per process. A surge in BLOCK events without terminations
    signals active-but-mitigated exploitation (someone is attacking, but hardening is holding). A surge
    in TERMINATIONS signals a coverage gap where exploitation is not being stopped deterministically.
    Layer this distinct from raw crash counts to understand both attack pressure and defensive efficacy.'
  answer_sources:
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 1
  - Microsoft-Windows-Security-Mitigations/Operational Event ID 2
  - Windows Application Log Event ID 1000
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Create)
  - WerFault.exe process lineage / WER report telemetry
  - 'NAI: All Windows endpoints and servers, particularly those running critical business applications,
    web servers, and database servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'blocks = count(Security-Mitigations EventID 1/2 block) BY process

      terms  = count(EventID 1000 exception_code=0xc0000005, unhandled) BY process

      wer    = count(WerFault reports) BY process

      EMIT process, blocks, terms, wer, ratio=blocks/(terms+1)

      ALERT WHERE surge(blocks) AND NOT surge(terms)  # active but mitigated

      ALERT WHERE surge(terms)  # coverage gap'
- question: When a de-duplicated crash is classified by a model trained on exception code, faulting module/offset,
    process lineage, host role, and patch level, does it score as a likely memory-corruption exploit rather
    than a benign defect, and which top-3 features drive that score?
  context: 'Not every crash is malicious; a classifier can separate benign software defects from suspicious
    memory-corruption patterns. For the Harden tactic, train on de-duplicated crash metadata (exception
    code, faulting module/offset, process lineage, host role, patch level) to distinguish likely benign
    defects from exploit-like crashes. The alert MUST list the top-3 contributing features (e.g., faulting
    module, exit-code state, host role) alongside the probability score so an analyst can validate it,
    and high-probability exploit-like crashes should be routed for immediate threat hunting. Keep the
    deterministic rate rules running in parallel so the model augments rather than replaces them. References:
    [AURORA, Blazytko et al.](https://www.usenix.org/system/files/sec20-blazytko.pdf) ([code](https://github.com/RUB-SysSec/aurora)).'
  answer_sources:
