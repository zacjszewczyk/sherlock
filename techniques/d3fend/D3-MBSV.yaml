  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR content IN delivered_scripts(browser, office):\n  ast = parse(content); apis = api_sequence(content)\n\
      \  score = payload_classifier.predict(ast, apis)\n  IF score > threshold:\n    EMIT score, top_features(VirtualAllocEx,\
      \ WriteProcessMemory, AST_nodes), src"
- question: After a crash or mitigation event on a host, do unsupervised models (provenance-graph embedding
    or autoencoder ensemble) flag anomalous subsequent behavior -- new child processes, unbacked-memory
    execution, or anomalous egress -- indicating exploitation that survived the crash?
  context: 'Even when a crash occurs, an exploit may have already achieved code execution before the process
    died. For the Harden tactic, after a crash/mitigation event, baseline subsequent host/process behavior
    with unsupervised models -- provenance-graph embedding (PROGRAPHER-style) or an autoencoder ensemble
    (Kitsune-style) -- to flag exploitation that survived: new child processes, execution from unbacked/private
    memory, or anomalous network egress. Report the reconstruction error or graph anomaly with the top
    contributing nodes/edges so the analyst can trace the activity. High anomaly co-occurring with a crash
    strongly suggests successful exploitation and post-exploitation activity. References: [PROGRAPHER,
    Yang et al.](https://www.usenix.org/conference/usenixsecurity23/presentation/yang-fan) and [Kitsune,
    Mirsky et al.](https://arxiv.org/abs/1802.09089) ([code](https://github.com/ymirsky/Kitsune-py)).'
