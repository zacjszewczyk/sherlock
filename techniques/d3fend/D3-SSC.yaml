questions:
- question: 'Are any processes being terminated by Intel CET hardware-enforced stack protection due to
    a return-address shadow-stack mismatch (Windows Event ID 12 / #CP exception)?'
  context: 'Detect tactic: A shadow-stack mismatch is a deterministic backward-edge control-flow violation,
    not a probabilistic signal. Windows Event ID 12 from the Microsoft-Windows-Kernel-Process provider
    indicates hardware-enforced stack protection (Intel CET shadow stack) terminated a process because
    the in-memory return address diverged from the processor-maintained shadow stack — a hallmark of ROP/shellcode.
    Generate high-severity alerts on these events and enrich each with the terminated image path, PID,
    and parent process for triage. A positive result is near-certain evidence of an exploitation attempt
    against a memory-safety vulnerability; investigate the targeted process, its loaded modules, and the
    originating activity (document open, web page, network service). Sources: [SoK: Shining Light on Shadow
    Stacks](https://arxiv.org/abs/1811.03165), [Understanding Hardware-enforced Stack Protection](https://techcommunity.microsoft.com/blog/windowsosplatform/understanding-hardware-enforced-stack-protection/1247815).'
  answer_sources:
  - 'Windows Event ID 12 (Source: Microsoft-Windows-Kernel-Process)'
  - Windows Event ID 4688 (process creation with mitigation policy fields)
  - Windows Event ID 1000 (Application Error / crash)
  - Exploit Protection / WDAC audit-mode CET violation logs
  - Windows Management Instrumentation (WMI) query results for CPU CET features
  - 'NAI: All Windows endpoints and servers (Windows 10 20H1+, Windows 11, Windows Server 2022+) with
    CET-capable CPUs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=\"Microsoft-Windows-Kernel-Process\" EventID=12\n  | where reason==\"hardware_enforced_stack_protection\"\
      \ OR description CONTAINS \"#CP\"\n  | eval severity=\"high\"\n  | table _time, host, image_path,\
      \ pid, parent_process\n  | alert"
- question: Do any observed returns diverge from the protected shadow/return-address copy, indicating
    a provable Control-Flow Integrity (CFI) violation on the backward edge?
  context: 'Detect tactic: Per Control-Flow Integrity theory, returns must be constrained by a protected
    shadow call stack; any return whose target diverges from the protected shadow/return-address copy
    is a provable CFG violation. Where the toolchain or hardware enforces this (Intel CET, ARM PAC/BTI),
    treat the deterministic termination/exception as the detection floor and never suppress it in favor
    of ML scores. The analyst should confirm CFI enforcement is enabled on the binary and treat any logged
    divergence as exploitation, correlating it with the surrounding process and module activity. Absence
    of these events on enforcement-capable hosts may indicate enforcement is disabled rather than a clean
    state. Sources: [Control-Flow Integrity, Abadi et al.](https://dl.acm.org/doi/10.1145/1102120.1102165),
    [Control-Flow Integrity: Precision, Security, and Performance](https://arxiv.org/abs/1602.04056).'
  answer_sources:
