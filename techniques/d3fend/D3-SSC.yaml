      \          count(eval(cet_enabled==true)) as enabled, count as total by site\n  | eval pct_capable=capable/total*100,\
      \ pct_enabled=enabled/total*100\n  | where cet_capable==true AND cet_enabled==false\n  | sort -asset_value"
- question: Is there a statistically anomalous surge in CET-related process terminations (Event ID 12)
    on any host or for any application?
  context: 'Detect tactic: Apply time-series anomaly detection (EWMA or seasonal decomposition) to the
    per-minute and per-hour frequency of CET-related terminations (Event ID 12) per host and per application.
    Alert when counts exceed the rolling mean + 3 standard deviations, deriving the multiplier from 30-day
    baselines per environment. A sudden surge may indicate a widespread campaign exploiting a memory-safety
    vulnerability (e.g., a newly weaponized browser or document exploit). A positive result warrants checking
    whether the same application/version is affected across many hosts, suggesting a common exploit chain.
    Sources: [Unsupervised Anomaly-based Malware Detection using Hardware Features](https://link.springer.com/chapter/10.1007/978-3-319-11379-1_6).'
  answer_sources:
  - 'Windows Event ID 12 (Source: Microsoft-Windows-Kernel-Process)'
  - Windows Event ID 4688 (process creation with mitigation policy fields)
  - Windows Event ID 1000 (Application Error / crash)
  - Exploit Protection / WDAC audit-mode CET violation logs
  - Windows Management Instrumentation (WMI) query results for CPU CET features
  - 'NAI: All Windows endpoints and servers (Windows 10 20H1+, Windows 11, Windows Server 2022+) with
    CET-capable CPUs'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=\"Microsoft-Windows-Kernel-Process\" EventID=12\n  | bin _time span=1h\n  | stats\
      \ count as terms by _time, host, application\n  | eventstats mean(terms) as mu, stdev(terms) as\
      \ sd by host, application\n  | where terms > mu + 3*sd\n  | alert"
- question: Has the ratio of CET violations to benign application crashes exceeded its historical 95th
    percentile, indicating active exploitation pressure rather than software instability?
  context: 'Detect tactic: For CET-enabled applications, baseline both Volume and State by computing the
    daily ratio of CET violations (Event ID 12) to benign crashes (Event ID 1000) per application. Alert
    when the ratio exceeds the 95th percentile of its historical distribution. This separates active exploitation
    pressure (rising violations relative to ordinary crashes) from mere software instability (proportional
    crashes and violations). A positive result focuses the analyst on applications being actively probed/exploited
    rather than buggy software, enabling targeted hunting on those processes. Sources: [Unsupervised Anomaly-based
    Malware Detection using Hardware Features](https://link.springer.com/chapter/10.1007/978-3-319-11379-1_6),
    [Understanding Hardware-enforced Stack Protection](https://techcommunity.microsoft.com/blog/windowsosplatform/understanding-hardware-enforced-stack-protection/1247815).'
