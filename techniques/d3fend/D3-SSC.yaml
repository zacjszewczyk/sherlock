    query: ">-\n  source IN (\"Microsoft-Windows-Kernel-Process\", \"ExploitProtection\")\n  EventID IN\
      \ (12) OR event_type=\"cfi_violation\"\n  | where return_target != shadow_return_copy\n  | eval\
      \ verdict=\"deterministic_cfg_violation\"\n  | alert severity=\"high\""
- question: Are frequently exploited applications being launched with hardware-enforced stack protection
    (CETCOMPAT) explicitly disabled on CET-capable hardware?
  context: 'Detect tactic: Disabling backward-edge protection removes the deterministic ROP defense, so
    an analyst should monitor process creation (Event ID 4688) for commonly targeted applications (chrome.exe,
    msedge.exe, winword.exe, outlook.exe, acrord32.exe) and alert when they start with hardware-enforced
    stack protection / CETCOMPAT explicitly disabled on CET-capable CPUs. A positive result represents
    a weakened security posture and possible defense evasion (attacker or misconfiguration disabling mitigations);
    prioritize internet-facing and high-value hosts and investigate why protection was disabled. Sources:
    [Understanding Hardware-enforced Stack Protection](https://techcommunity.microsoft.com/blog/windowsosplatform/understanding-hardware-enforced-stack-protection/1247815),
    [Control-Flow Integrity: Precision, Security, and Performance](https://arxiv.org/abs/1602.04056).'
