  - Windows Event ID 4688 (process creation with mitigation policy fields)
  - Windows Event ID 1000 (Application Error / crash)
  - Exploit Protection / WDAC audit-mode CET violation logs
  - Windows Management Instrumentation (WMI) query results for CPU CET features
  - 'NAI: All Windows endpoints and servers (Windows 10 20H1+, Windows 11, Windows Server 2022+) with
    CET-capable CPUs'
  range: Last 90 days
  queries:
