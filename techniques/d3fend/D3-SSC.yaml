name: 'D3-SSC: Shadow Stack Comparisons'
id: b3583f94-368c-48f6-bac8-0e9713f6de81
description: Investigate potential return-oriented programming (ROP) and shellcode activity by comparing
  the in-memory call stack against the processor-maintained shadow call stack and corroborating with hardware
  control-flow telemetry. This playbook helps an analyst assess the deployment status and effectiveness
  of Control-flow Enforcement Technology (CET) across the enterprise, hunt for hardware control-protection
  (#CP) shadow-stack violations on Windows (Event ID 12 process terminations, CETCOMPAT/hardware-enforced-stack-protection
  status, audit-mode violations), and detect backward-edge control-flow integrity violations independent
  of CET using hardware performance counters (HPC), Intel Last Branch Record (LBR), and Intel Processor
  Trace (PT). It combines deterministic symbolic-logic checks (shadow-stack/CFI violations, call-preceded
  return and gadget-chain rules), statistical anomaly detection on violation volume/frequency/state, and
  machine-learning control-flow classifiers so deterministic detections form the floor while probabilistic
  models add corroborating coverage.
type: technique
