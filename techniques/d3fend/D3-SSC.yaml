- question: What percentage of the fleet is CET-capable versus CET-enabled, and which capable systems
    are not using hardware-based control-flow integrity?
  context: 'Detect tactic: To answer the FFIR on CET deployment status and effectiveness, periodically
    query all endpoints via WMI for CET capability and enablement, compute the percentage of the fleet
    that is CET-capable and CET-enabled, and flag systems where capable features are unused. Prioritize
    internet-facing and high-value hosts. This inventory drives remediation: capable-but-disabled hosts
    are unnecessarily exposed to ROP. The analyst is producing a coverage map, not detecting an event,
    so cadence can be daily/weekly and results compared over time to track rollout progress. Sources:
    [Understanding Hardware-enforced Stack Protection](https://techcommunity.microsoft.com/blog/windowsosplatform/understanding-hardware-enforced-stack-protection/1247815).'
  answer_sources:
