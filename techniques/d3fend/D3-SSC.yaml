      \ as crashes by _time, application\n  | eval ratio=viol/(crashes+1)\n  | eventstats perc95(ratio)\
      \ as p95 by application\n  | where ratio > p95 | alert"
- question: Are CET audit-mode violations being logged without terminating processes, signaling missed
    enforcement or evasion of single heuristics?
  context: 'Detect tactic: Deploy CET in audit mode on a canary ring and explicitly profile violations
    that were logged but did NOT terminate the process as a distinct failure-mode signal. A rising count
    of audit-only violations indicates either exploitation attempts being missed in enforcement gaps or
    evasion of single heuristics. Track blocked/exception counts separately from successful terminations.
    The analyst is hunting for blind spots: audit-only violations are a leading indicator that enforcement
    should be hardened on those applications, and a spike may reveal an exploit slipping past enforcement
    elsewhere. Sources: [ROP is Still Dangerous: Breaking Modern Defenses](https://www.usenix.org/conference/usenixsecurity14/technical-sessions/presentation/carlini),
    [Understanding Hardware-enforced Stack Protection](https://techcommunity.microsoft.com/blog/windowsosplatform/understanding-hardware-enforced-stack-protection/1247815).'
  answer_sources:
  - 'Windows Event ID 12 (Source: Microsoft-Windows-Kernel-Process)'
  - Windows Event ID 4688 (process creation with mitigation policy fields)
  - Windows Event ID 1000 (Application Error / crash)
  - Exploit Protection / WDAC audit-mode CET violation logs
  - Windows Management Instrumentation (WMI) query results for CPU CET features
  - 'NAI: All Windows endpoints and servers (Windows 10 20H1+, Windows 11, Windows Server 2022+) with
    CET-capable CPUs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=\"ExploitProtection_CET_audit\" mode=\"audit\"\n  | where action==\"logged\"\
      \ AND terminated==false\n  | bin _time span=1d\n  | stats count as audit_viol by _time, application,\
      \ host\n  | eventstats mean(audit_viol) as mu, stdev(audit_viol) as sd by application\n  | where\
      \ audit_viol > mu + 3*sd | alert"
- question: Does a per-binary control-flow anomaly model flag anomalous return/branch behavior for any
    application, with explainable contributing features?
  context: 'Detect tactic: For applications exposing control-flow telemetry (CET events, the ETW threat-intelligence
    provider, or hardware trace), train a per-binary model of benign return/branch behavior and score
    live execution, raising alerts on anomalous epochs in parallel with deterministic #CP detection. Surface
    the top-3 contributing features (RET-misprediction rate, anomalous return target outside the call-preceded
    set, abnormal memory-locality) in alert text rather than only a score. This ML layer corroborates
    deterministic detections and can catch attempts that evade single heuristics; the explainable output
    lets an analyst validate whether an anomaly reflects real ROP rather than benign drift. Sources: [HeNet:
    Deep Learning on Intel Processor Trace](https://arxiv.org/abs/1801.02318), [Unsupervised Anomaly-based
    Malware Detection using Hardware Features](https://link.springer.com/chapter/10.1007/978-3-319-11379-1_6).'
  answer_sources:
  - 'Windows Event ID 12 (Source: Microsoft-Windows-Kernel-Process)'
  - Windows Event ID 4688 (process creation with mitigation policy fields)
  - Windows Event ID 1000 (Application Error / crash)
  - Exploit Protection / WDAC audit-mode CET violation logs
  - Windows Management Instrumentation (WMI) query results for CPU CET features
  - 'NAI: All Windows endpoints and servers (Windows 10 20H1+, Windows 11, Windows Server 2022+) with
    CET-capable CPUs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = load_per_binary_cfg_model(image_path)\n  features = extract(ret_mispredict_rate,\
      \ return_target_call_preceded, memory_locality)\n  score = model.anomaly_score(features)\n  if score\
      \ > threshold:\n      emit_alert(top3=model.explain(features), pid, image_path)\n  # runs in parallel\
      \ with deterministic #CP detection"
- question: Do per-execution-window return/branch prediction mismatch counts from hardware performance
    counters exceed a tuned ROP threshold?
  context: 'Detect tactic: On hosts exposing hardware performance counters, retrieve the processor performance
    counter of return/branch prediction mismatches (resulting from call-stack vs. shadow-stack comparisons)
    per execution window and alert when the count exceeds a tuned threshold indicative of ROP. Derive
    the per-application threshold from benign 30-day baselines and keep this concrete count-based rule
    as a deterministic floor. This provides ROP detection independent of CET on CET-incapable hosts and
    corroborates CET terminations elsewhere. A positive result — elevated misprediction counts — is consistent
    with gadget-chain execution and should trigger deeper process inspection. Sources: [Threat detection
    for return oriented programming, US20140075556A1](https://patents.google.com/patent/US20140075556A1),
    [Unsupervised Anomaly-based Malware Detection using Hardware Features](https://link.springer.com/chapter/10.1007/978-3-319-11379-1_6).'
  answer_sources:
  - Hardware performance counter samples (branch/return mispredictions, instructions retired, cache references)
  - Intel Last Branch Record (LBR) snapshots at system-call boundaries
  - Intel Processor Trace (PT) control-flow streams
  - EDR memory-scan / control-flow telemetry
  - 'NAI: Windows and Linux endpoints with HPC/LBR/PT exposure or EDR control-flow telemetry'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=\"hpc_samples\" counter=\"branch_return_mispredict\"\n  | bin _time span=execution_window\n\
      \  | stats sum(mispredicts) as mp by _time, host, application\n  | lookup baseline_thresholds application\
      \ OUTPUT rop_threshold\n  | where mp > rop_threshold | alert severity=\"high\""
- question: At system-call boundaries, do LBR return targets violate the call-preceded rule or form abnormally
    long gadget chains of short indirect-branch-terminated sequences?
  context: 'Detect tactic: At system-call boundaries inspect the 16-entry Intel Last Branch Record and
    apply two deterministic rules: (1) every return target must be call-preceded (immediately follow a
    CALL) — a return into mid-function is illegal; (2) flag gadget chains of short sequences (each <=20
    instructions) ending in indirect branches whose length exceeds a threshold. Because these heuristics
    are individually evadable, run them alongside statistical/ML and shadow-stack signals, not alone.
    A positive result (non-call-preceded returns or long gadget chains) is strong evidence of ROP/JOP;
    the analyst should correlate with the system call invoked and the process context. Sources: [kBouncer:
    Transparent ROP Exploit Mitigation Using Indirect Branch Tracing](https://www.usenix.org/conference/usenixsecurity13/technical-sessions/paper/pappas),
    [ROP is Still Dangerous: Breaking Modern Defenses](https://www.usenix.org/conference/usenixsecurity14/technical-sessions/presentation/carlini).'
  answer_sources:
  - Hardware performance counter samples (branch/return mispredictions, instructions retired, cache references)
  - Intel Last Branch Record (LBR) snapshots at system-call boundaries
  - Intel Processor Trace (PT) control-flow streams
  - EDR memory-scan / control-flow telemetry
  - 'NAI: Windows and Linux endpoints with HPC/LBR/PT exposure or EDR control-flow telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=\"lbr_snapshot\" at=\"syscall_boundary\"\n  | foreach entry in lbr[0..15]:\n\
      \      if entry.return AND not is_call_preceded(entry.target): flag(\"non_call_preceded_return\"\
      )\n  | compute gadget_chain_len where seq_len<=20 ending_in indirect_branch\n  | where flagged OR\
      \ gadget_chain_len > chain_threshold\n  | alert"
- question: Does a per-program one-class SVM over hardware performance counter feature vectors flag any
    instruction epoch as an exploitation anomaly?
  context: 'Detect tactic: Build per-program one-class SVM models over HPC feature vectors (branch mispredictions,
    retired instructions, cache/memory events) per instruction epoch, applying a rank-preserving power
    transform and temporal aggregation to detect exploitation epochs (reported ~1.1% false positives).
    Report the top contributing counters in alerts. This unsupervised approach catches ROP without signatures
    and complements the deterministic HPC threshold and LBR rules. The analyst validates flagged epochs
    by examining which counters drove the anomaly and whether they coincide with other ROP indicators
    on the same host/process. Sources: [Unsupervised Anomaly-based Malware Detection using Hardware Features](https://link.springer.com/chapter/10.1007/978-3-319-11379-1_6).'
  answer_sources:
  - Hardware performance counter samples (branch/return mispredictions, instructions retired, cache references)
  - Intel Last Branch Record (LBR) snapshots at system-call boundaries
  - Intel Processor Trace (PT) control-flow streams
  - EDR memory-scan / control-flow telemetry
  - 'NAI: Windows and Linux endpoints with HPC/LBR/PT exposure or EDR control-flow telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = power_transform(hpc[branch_mispred, retired_instr, cache_events])\n  features\
      \ = temporal_aggregate(features, epoch)\n  model = ocsvm_per_program[program]\n  if model.predict(features)\
      \ == -1:\n      emit_alert(top_counters=model.top_contributors(features), program, host)"
- question: Does unsupervised directional-statistics deviation analysis of a program's micro-architectural
    and memory-locality characteristics (EigenROP) flag gadget-chain execution?
  context: 'Detect tactic: Model a program''s intrinsic micro-architectural and memory-locality characteristics
    (instruction mix, memory reference patterns) and use unsupervised directional-statistics deviation
    analysis to flag gadget-chain execution without source code or gadget signatures (EigenROP approach).
    This is valuable where neither CET nor signatures are available, detecting the statistical fingerprint
    of ROP execution. A positive result is a deviation from the program''s normal execution geometry;
    the analyst should corroborate with HPC counts, LBR checks, or any CET telemetry to confirm exploitation
    rather than benign workload change. Sources: [Detecting ROP with Statistical Learning of Program Characteristics](https://www.semanticscholar.org/paper/4524882a290f2566eb3bf092facc0a582b968858).'
  answer_sources:
  - Hardware performance counter samples (branch/return mispredictions, instructions retired, cache references)
  - Intel Last Branch Record (LBR) snapshots at system-call boundaries
  - Intel Processor Trace (PT) control-flow streams
  - EDR memory-scan / control-flow telemetry
  - 'NAI: Windows and Linux endpoints with HPC/LBR/PT exposure or EDR control-flow telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  profile = build_program_profile(instruction_mix, memory_reference_patterns)\n  baseline_direction\
      \ = directional_stats(profile_baseline)\n  deviation = angular_deviation(profile_live, baseline_direction)\n\
      \  if deviation > threshold:\n      alert(\"eigenrop_gadget_chain_suspected\", program, host)"
- question: Where Intel Processor Trace is available, does a deep-learning control-flow classifier flag
    the branch/return transfer stream as exploited execution?
  context: 'Detect tactic: Where Intel Processor Trace is available, encode the complete branch/return
    transfer stream and apply a hierarchical CNN (HeNet) to classify exploited vs. benign execution (reported
    ~100% precision / 99.8% recall on ROP), emitting the offending branch/return addresses for explainability
    and triage. PT captures the full control-flow stream, enabling high-fidelity detection that corroborates
    CET and HPC signals. A positive classification, with offending addresses, lets the analyst pinpoint
    the exploited code path and the gadget chain for incident response. Sources: [HeNet: Deep Learning
    on Intel Processor Trace](https://arxiv.org/abs/1801.02318).'
  answer_sources:
  - Hardware performance counter samples (branch/return mispredictions, instructions retired, cache references)
  - Intel Last Branch Record (LBR) snapshots at system-call boundaries
  - Intel Processor Trace (PT) control-flow streams
  - EDR memory-scan / control-flow telemetry
  - 'NAI: Windows and Linux endpoints with HPC/LBR/PT exposure or EDR control-flow telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  stream = encode_intel_pt(branch_return_transfers)\n  pred = henet_cnn.classify(stream)\
      \   # exploited vs benign\n  if pred.label == \"exploited\":\n      emit_alert(offending_addresses=pred.attributions,\
      \ pid, image_path)"
