name: 'D3-ER: Email Removal'
id: 7e9ee782-827b-416e-85d0-343f2db40df3
description: Assess and verify the organization's capability to completely and effectively remove malicious
  emails from all targeted user inboxes. This playbook helps an analyst confirm that purge actions for
  known-malicious messages were actually issued and took effect per mailbox, that no residual copies (including
  normalized-header and laterally-forwarded copies) remain across folders and storage systems, and that
  mailbox auditing was enabled so an absence of delete records is trustworthy. It further guides measurement
  of removal completeness and remediation latency, profiling of purge failure modes (audit-bypass, legal/litigation
  hold, stuck queues), detection of statistically overrepresented failure cohorts, and bounding of campaign
  blast radius weighted by pre-removal user interaction. Advanced methods cover sequence-anomaly detection
  of silently failed purges, predictive purge-failure modeling, residual-exposure-based campaign triage,
  and explainable phishing classification to accurately scope what must be evicted.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Were purge commands actually issued for the known-malicious messages, and what was the per-action
    status of each purge?
  context: Eviction begins with proof that a delete command was genuinely commanded against the malicious
    message set, not merely planned. Query the Office 365 Unified Audit Log for New-ComplianceSearchAction
    or Search-Mailbox operations whose parameters include a Purge/PurgeType (SoftDelete or HardDelete)
    or DeleteContent, scoped to the known-malicious InternetMessageId. Correlate each with Get-ComplianceSearchAction
    to record per-action completion status. A confirmed purge command with a successful status supports
    eviction effectiveness for the D3-E Evict mission; a missing or errored action means the message may
    still be present.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=o365 Operation IN (\"New-ComplianceSearchAction\",\"Search-Mailbox\")\n  | where\
      \ match(Parameters,\"Purge|PurgeType|SoftDelete|HardDelete|DeleteContent\")\n  | where match(Parameters,\
      \ known_malicious_internet_message_id)\n  | table CreationTime, UserId, Operation, Parameters, ResultStatus"
  - technology: PowerShell/pseudocode
    query: ">-\n  Get-ComplianceSearchAction -Identity $purgeAction | Select Name, Action, Status, Results"
- question: For every targeted mailbox, is there a corresponding mailbox-audit delete record tied to the
    malicious message confirming the removal actually took effect there?
  context: A purge command issued at the campaign level does not guarantee each individual mailbox was
    cleaned. For each mailbox in the target set, require a matching mailbox-audit action (HardDelete,
    SoftDelete, or MoveToDeletedItems) in the Unified Audit Log linked to the malicious message's identity.
    Any mailbox in the target set lacking such a record is an unconfirmed removal and must be treated
    as a potential residual exposure for the Evict mission, prompting re-remediation or manual verification.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=o365 RecordType=ExchangeItem Operation IN (\"HardDelete\",\"SoftDelete\",\"MoveToDeletedItems\"\
      )\n  | where match(AffectedItems, malicious_internet_message_id)\n  | stats values(Operation) by\
      \ MailboxOwnerUPN\n  | inputlookup append=true targeted_mailboxes.csv\n  | where isnull(Operation)\
      \  /* mailboxes with no delete record = unconfirmed */"
- question: After purge completion, do zero instances of each malicious message remain in any targeted
    mailbox or folder, including Inbox and Junk?
  context: Verification of absence is essential because soft-deletes and folder moves can leave recoverable
    copies. Re-run a content/compliance search and a Threat Explorer hunt scoped to all targeted mailboxes
    and folders, asserting that the latest delivery location is not Inbox/Junk and that zero message instances
    remain for each malicious InternetMessageId. Account for the 10-items-per-mailbox-per-pass cap by
    re-running until matches reach zero. Residual copies represent ongoing risk that a user could still
    execute malware or respond to phishing, directly undermining the Evict objective.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: PowerShell/pseudocode
    query: ">-\n  do {\n    New-ComplianceSearch -ContentMatchQuery 'InternetMessageId:\"<id>\"' -ExchangeLocation\
      \ $targets\n    Start-ComplianceSearch; $r = (Get-ComplianceSearch).Items\n  } while ($r -gt 0)\n\
      \  # assert $r == 0 for all targeted mailboxes/folders"
  - technology: Threat Explorer/pseudocode
    query: ">-\n  Threat Explorer: filter InternetMessageId == <id>; assert LatestDeliveryLocation NOT\
      \ IN (Inbox, Junk) AND count == 0"
- question: Was the purge scope built on the canonical, normalized Message-ID rather than display fields,
    and were laterally-forwarded or internally-bypassing copies enumerated?
  context: Naive identifier matching can miss copies hidden by ambiguous or multiple From/Message-ID headers
    (a composition attack) and by internal forwarding that bypasses SPF/DKIM. Before scoping the purge,
    re-parse and normalize message headers and match on the canonical InternetMessageId/Message-ID, not
    display fields. Then enumerate internally-forwarded and lateral copies. Failing to do so leaves residual
    malicious content for the Evict mission; thorough normalization ensures the purge scope captures every
    instance of the message.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=email\n  | eval canonical_id=normalize(message_id_header)  /* strip whitespace,\
      \ lowercase, pick first valid RFC5322 Message-ID */\n  | where canonical_id == normalized_malicious_id\n\
      \  | stats count by mailbox, folder, delivery_path\n  | where delivery_path=\"internal_forward\"\
      \ OR spf=\"none\" OR dkim=\"none\""
- question: Is mailbox auditing actually enabled organization-wide and per-mailbox so that an absence
    of delete records can be trusted as evidence of no copies?
  context: An absence of delete audit records only means something if auditing was on. Confirm Get-OrganizationConfig
    AuditDisabled is False, that target mailboxes have AuditEnabled True with delete actions in the audited
    set, and flag any Set-MailboxAuditBypassAssociation. On an audit-bypassed mailbox, missing delete
    records are a verification gap, not a confirmed purge. For the Evict mission this distinguishes genuinely
    clean mailboxes from blind spots that require alternate verification.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: PowerShell/pseudocode
    query: ">-\n  (Get-OrganizationConfig).AuditDisabled  # expect False\n  Get-Mailbox $targets | ? {-not\
      \ $_.AuditEnabled -or $_.AuditLogAgeLimit -eq 0}\n  Get-MailboxAuditBypassAssociation | ? AuditBypassEnabled\
      \ -eq $true  # flag bypassed mailboxes"
- question: What is the campaign's purge success rate (completeness) and the detection-to-final-purge-confirmation
    latency distribution, especially the slow tail?
  context: Statistical KPIs quantify eviction effectiveness. Per campaign, compute the purge success rate
    (mailboxes confirmed purged divided by mailboxes targeted) as the completeness measure, and the detection-to-final-purge-confirmation
    latency distribution (mean, median, 95th percentile, and long tail). The slow tail dominates residual
    exposure because messages linger longest there. Alert when the success rate is below 100% or the 95th-percentile
    latency exceeds a tenant-specific baseline derived from historical campaigns, signaling incomplete
    or slow eviction.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=o365 campaign=$cid\n  | stats dc(eval(status=\"purged\")) as purged, dc(targeted_mailbox)\
      \ as targeted by campaign\n  | eval success_rate=purged/targeted\n  | join campaign [search latency_event\
      \ | stats mean(latency) median(latency) perc95(latency) max(latency)]\n  | where success_rate <\
      \ 1.0 OR perc95_latency > baseline"
- question: What purge failure modes occurred (failed/stuck-queued actions, audit-bypassed, legal/litigation-hold
    mailboxes) and how do items-matched versus items-purged compare per mailbox?
  context: Each failure mode is its own actionable signal, not noise. Count and trend failed and stuck-queued
    remediation actions, audit-bypassed mailboxes, and litigation/legal-hold mailboxes that block hard-delete.
    Also track items-matched versus items-purged per mailbox (volume) and action success/fail/queued counts
    (state). For the Evict mission, distinguishing why a purge did not complete tells the analyst whether
    to retry, escalate a hold release, or apply an alternate method, and reveals systemic remediation
    weaknesses.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=o365 Operation=\"New-ComplianceSearchAction\"\n  | eval failure_mode=case(Status=\"\
      Failed\",\"failed\", Status=\"Queued\",\"stuck_queue\", LitigationHold=\"true\",\"legal_hold\",\
      \ AuditBypass=\"true\",\"audit_bypass\")\n  | stats sum(items_matched) as matched sum(items_purged)\
      \ as purged count by MailboxOwnerUPN, failure_mode\n  | where matched != purged OR isnotnull(failure_mode)"
- question: Are purge failures statistically overrepresented in any mailbox cohort (hold status, license
    type, region, execution path) beyond its base rate?
  context: Systematic gaps hide in cohorts. Segment purge failures by mailbox attribute (hold status,
    license type, region, tool/execution path) and test whether any cohort is overrepresented beyond its
    base rate using a chi-square or rate-ratio test against the org baseline. A cohort with disproportionate
    failures (e.g., one region or licensing tier) points to a process or policy problem that must be corrected
    to make eviction reliable across the enterprise, rather than a one-off failure.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=o365 purge_result IN (\"success\",\"fail\")\n  | stats count(eval(purge_result=\"\
      fail\")) as fails count as total by cohort_attr\n  | eval fail_rate=fails/total, org_rate=org_fails/org_total\n\
      \  | eval rate_ratio=fail_rate/org_rate\n  | chi_square(fails, total, org_rate)\n  | where rate_ratio\
      \ > 1.5 AND p_value < 0.05"
- question: What is the true campaign blast radius (recipient fan-out), and which recipients clicked or
    interacted with the message before removal and must be prioritized for confirmation?
  context: The verification denominator should be the full recipient fan-out of the campaign, not just
    mailboxes a tool happened to touch. Weight residual risk by counts of recipients who clicked or interacted
    with the message before it was removed, and prioritize those mailboxes for purge confirmation and
    follow-on response (credential reset, host inspection). For the Evict mission this ensures the most
    dangerous residual exposures, where a user already engaged, are confirmed clean first.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=email campaign=$cid\n  | stats dc(recipient) as fan_out by campaign\n  | join\
      \ recipient [search index=proxy OR index=o365 url_click=malicious_url | stats count by recipient]\n\
      \  | eval priority = if(count>0, \"clicked_before_removal\", \"delivered_only\")\n  | sort - count"
- question: Does the remediation/audit event sequence for each purge follow the expected order, or are
    steps missing or out-of-order indicating a silently failed purge?
  context: A purge can fail silently when an expected step is skipped. Model the expected sequence (search
    created -> purge issued -> per-mailbox delete logged -> verification returns zero) with an LSTM or
    sequence-anomaly detector and flag missing or out-of-order steps. The alert should name the missing
    step(s). For the Evict mission this catches eviction failures that have no explicit error yet leave
    the message in place, which simple status checks would miss.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = SequenceAnomalyDetector(type=LSTM)\n  expected = [\"search_created\",\"purge_issued\"\
      ,\"per_mailbox_delete\",\"verify_zero\"]\n  for campaign in campaigns:\n    seq = ordered_events(campaign)\n\
      \    score, missing = model.score(seq, expected)\n    if score > threshold: alert(campaign, missing_steps=missing)"
- question: Before executing a large eviction, what is the predicted purge-failure probability and which
    factors drive that risk?
  context: Predicting failure lets teams pre-stage mitigations. Train a supervised model (Logistic Regression
    or Gradient Boosting) on features such as campaign size, mailbox constraints (hold/license/region),
    and execution context to estimate purge-failure risk before running large eviction actions. Surface
    the top-3 contributing features (e.g., on-hold mailbox share, region, prior failure rate) in the alert
    text for explainability. For the Evict mission this enables proactive measures, like releasing holds
    or splitting batches, so the eviction succeeds the first time.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = GradientBoosting()  # or LogisticRegression\n  features = [campaign_size, on_hold_share,\
      \ license_mix, region, prior_failure_rate, exec_path]\n  risk = model.predict_proba(features)\n\
      \  top3 = model.explain(features)[:3]\n  if risk > threshold: alert(predicted_failure=risk, drivers=top3)"
- question: Can campaigns be auto-triaged by residual exposure so fully-confirmed low-risk completions
    are cleared and high-exposure ones are routed to analysts with their contributing context?
  context: Analyst time should focus on residual risk. Use contextual clustering and risk ranking to auto-clear
    low-risk, fully-confirmed completions and route high residual-exposure campaigns or mailboxes to analysts,
    exposing the contributing context (campaign size, prior clicks, mailbox constraints) rather than an
    opaque score. For the Evict mission this scales verification across many campaigns while ensuring
    nothing with meaningful residual exposure is silently closed.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  clusters = contextual_cluster(campaigns, features=[size, prior_clicks, mailbox_constraints,\
      \ confirm_rate])\n  for c in campaigns:\n    rank = residual_exposure_rank(c)\n    if c.fully_confirmed\
      \ and rank=='low': auto_clear(c)\n    else: route_to_analyst(c, context=[c.size, c.prior_clicks,\
      \ c.constraints])"
- question: What is the accurate, auditable set of malicious messages that must be evicted, as determined
    by an explainable phishing/BEC classifier?
  context: The purge is only as good as its scope. Determine the malicious message set with an explainable
    phishing/BEC classifier whose rationale (display-name/address mismatch, urgency, lookalike domain,
    suspicious URL) is emitted as contributing features, ensuring the eviction scope is accurate and auditable.
    Characterize the delivered-malicious population that survived filtering and therefore must be evicted.
    For the Evict mission, an explainable classifier prevents both under-scoping (missed malicious mail)
    and over-scoping (deleting benign mail), and produces a defensible record of why each message was
    removed.
  answer_sources:
  - Office 365 Unified Audit Log
  - Exchange Online Mailbox Audit Log
  - Microsoft Defender for Office 365 Action Center / Threat Explorer
  - Windows Event ID 4688
  - 'NAI: Microsoft 365 / Exchange Online environment'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  for msg in delivered_mail:\n    label, features = phishing_classifier.predict_explain(msg)\n\
      \    # features: display_addr_mismatch, urgency, lookalike_domain, suspicious_url\n    if label=='malicious':\
      \ add_to_eviction_set(msg.internet_message_id, rationale=features)\n  report(eviction_set)  # auditable\
      \ scope with per-message rationale"
