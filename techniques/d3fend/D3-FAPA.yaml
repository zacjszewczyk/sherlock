name: 'D3-FAPA: File Access Pattern Analysis'
id: fe7d7f9b-7d39-495c-9de4-cabef2767486
description: Investigate suspected unauthorized file-access activity by comparing process and account
  file-access behavior against deterministic policy, statistical baselines, and machine-learning models.
  This playbook helps an analyst detect ransomware, wipers, and data collection/staging by hunting for
  high-fidelity deterministic signals (decoy/canary file access, access outside an approved per-actor
  directory scope, directory traversal coupled with mass multi-type file access, rare driver/service installs
  chained to raw-disk handles and mass overwrites, and access-denied bursts), statistical deviations from
  per-user and peer-group baselines (file/byte volume, access frequency, success-versus-failure ratios,
  write-content entropy, file-type funneling and deletion bursts, and access breadth/entropy), and machine-learning
  detections (per-process I/O classifiers, provenance-graph and sequence models, peer-group clustering,
  and the read-encrypt-overwrite sequence). It is scoped to file servers, Domain Controllers, privileged-user
  workstations, and hosts holding regulated or intellectual-property data, and is designed so deterministic
  rules fire regardless of model state while statistical and ML methods catch novel misuse.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
