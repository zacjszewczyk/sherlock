- question: Do clustering models (e.g., K-Means or DBSCAN) trained on per-actor file-access features place
    an actor as an outlier relative to its peer-group behavior profile, and which features drove the outlier
    assignment?
  context: 'This method clusters actors by their file-access feature vectors to establish peer-group behavior
    profiles, then identifies actors that fall outside their cluster (or into none) as outliers. Under
    Detect, outlier actors are candidates for insider misuse or account compromise whose behavior no longer
    resembles their role peers. The model must report which features drove the outlier assignment (e.g.,
    volume, breadth, off-hours, file types) for triage. A positive result is an actor whose access profile
    separates from its cohort — review the named driving features and recent activity. A negative result
    means the actor clusters with its peers. Re-fit periodically so the peer profiles track organizational
    change. References: [A Sense of Self, Forrest et al](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf);
    [ShieldFS, Continella et al](https://conand.me/publications/continella-shieldfs-2016.pdf)'
