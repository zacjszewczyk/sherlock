questions:
- question: Did any process or account perform a read, write, rename, or delete operation against a decoy/canary
    file planted in a sensitive directory (recorded by Windows Event ID 4663 with SACLs or by File Integrity
    Monitoring)?
  context: 'Decoy or canary files are placed in sensitive directories that no legitimate workflow ever
    touches, so ANY access to them is a high-fidelity, baseline-free deterministic signal of malicious
    enumeration, collection, or ransomware traversal. Under the Detect tactic this is the highest-confidence
    rule in the playbook: it fires regardless of model state and needs no historical baseline. Confirm
    the file is a registered decoy, then identify the responsible process and account, the operation type
    (read/write/rename/delete), and the host. A positive result almost always indicates an adversary or
    malware sweeping the filesystem; a negative result does not clear the host because the actor may have
    avoided the decoy path. Ensure SACLs are configured on canary files so 4663 actually records the access.
    References: [RWGuard, Mehnaz et al](https://link.springer.com/chapter/10.1007/978-3-030-00470-5_6);
    [UNVEIL, Kharraz et al](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf);
    [Microsoft 4663](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663)'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 7045
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  let decoys = lookup('canary_files');\n  EventID==4663 OR FIM_event\n  | where ObjectName\
      \ in (decoys)\n  | where AccessType in ('ReadData','WriteData','Delete','Rename')\n  | alert severity=critical\
      \ with ProcessName, SubjectUser, ObjectName, Host"
- question: Did any user, service account, or process access privileged or atypical file paths that fall
    outside its approved per-actor directory scope (for example /etc/shadow, SSH keys, service-account
    tokens, or sensitive Windows shares)?
  context: 'This rule enforces a per-program/per-actor allowlist that maps each user, service account,
    and process to the directory scopes it is authorized to touch, then alerts on any access targeting
    privileged or atypical paths outside that scope. Under Detect, scope violations expose credential
    theft, lateral movement preparation, and collection even when volume is low. Implement with SACL-backed
    Windows Event ID 4663 on Windows and Falco/auditd sensitive-file rules on Linux. A positive result
    means an actor reached for files it has no legitimate reason to touch (e.g., a web-server service
    account reading /etc/shadow) and should be escalated; tune the allowlist to suppress legitimate administrative
    tooling so the deterministic floor stays high-fidelity. References: [Falco rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml);
    [A Sense of Self, Forrest et al](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf)'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 7045
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  let scope = lookup('actor_path_allowlist');  // actor -> approved dirs\n  EventID==4663\
      \ OR auditd_path OR falco_open\n  | join scope on actor\n  | where not startswith(ObjectName, scope.approved_dirs)\n\
      \     OR ObjectName in (sensitive_paths)\n  | alert with actor, ProcessName, ObjectName, Host"
- question: Did a single process, within a short window (for example <=60s), perform repeated open-directory/enumeration
    operations while accessing a large number of distinct files (e.g., >200) spanning multiple file types
    and multiple directory locations, or perform a copy-then-encrypt of file contents?
  context: 'This is the canonical file-modifying-malware pattern from the CrowdStrike file-modifying-malware
    patent: a process traverses directories (iterative open-directory operations) while fanning out across
    many files, many types, and many locations, or copies a file and encrypts the copy. Under Detect,
    correlating traversal with mass multi-type access distinguishes ransomware/wipers from normal application
    I/O, which is usually narrow and type-consistent. Tune the file-count and window thresholds from the
    host baseline (>200 distinct files in <=60s is a reasonable starting point). A positive result is
    a high-confidence ransomware/collection indicator; attribute it to the responsible process and isolate
    the host. A negative result over the window argues against active mass encryption but does not rule
    out slow/low staging. References: [File-modifying malware detection, US20180121650A1](https://patents.google.com/patent/US20180121650A1/en)'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 7045
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; evaluate in sliding 60-second windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventID in (4663,4656) OR Sysmon EID 11\n  | bin 60s by ProcessGuid\n  | stats dcount(ObjectName)\
      \ as files, dcount(ext) as types,\n          dcount(dir) as locs, count(opendir) as enum\n  | where\
      \ enum>=10 AND files>200 AND types>=3 AND locs>=5\n  | alert with ProcessName, files, types, locs,\
      \ Host"
- question: Did a rare kernel driver or service installation (Windows Event ID 7045) chain to a process
    opening a raw \\.\PhysicalDrive or volume handle (Sysmon Event ID 9, RawAccessRead) followed by mass
    file overwrite/truncate with random, fixed, or null bytes?
  context: 'Wipers commonly load a signed/unsigned kernel driver or install a service to gain raw disk
    access, then bypass the filesystem to overwrite or truncate files and structures directly. Under Detect,
    chaining a rare 7045 install to a RawAccessRead (Sysmon EID 9) against a physical drive/volume and
    then to a mass-overwrite burst yields a high-confidence destructive-action alert; even a single link
    (a rare driver install, an unexpected raw-disk handle on a workstation) is suspicious. Validate the
    driver''s prevalence and signing, the process opening the raw handle, and the write pattern (entropy/fixed
    bytes). A positive full-chain match should trigger immediate containment as a destructive wiper event.
    References: [The Anatomy of Wiper Malware, CrowdStrike](https://www.crowdstrike.com/en-us/blog/the-anatomy-of-wiper-malware-part-1/)'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 7045
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; correlate links within a 5-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  let drv = EventID==7045 where rare(ServiceName);\n  let raw = Sysmon EID 9 where Device\
      \ like '\\\\.\\PhysicalDrive%' OR like '\\\\.\\Volume%';\n  let wipe = mass write/truncate with\
      \ high-entropy or null/fixed bytes;\n  alert if drv -> raw -> wipe by related Process/Host within\
      \ 5min"
- question: Did any actor accumulate a burst of access-denied file events above a per-actor baseline (for
    example >25 denials/min) — Windows Event ID 4663 with a denied AccessMask, or auditd/Falco EACCES?
  context: 'Failed access is a distinct signal, not noise: a burst of access-denied events exposes enumeration,
    brute directory traversal, and probing of paths the actor is not authorized to read, even when no
    successful read occurs. Under Detect, this failure-mode rule catches reconnaissance that volume-based
    rules miss because the adversary is being blocked. Build a per-actor baseline of normal denial rates
    and alert on a surge (e.g., >25 denials/min). A positive result indicates an actor sweeping the filesystem
    against ACLs (often a precursor to privilege escalation or lateral movement); correlate with the actor''s
    successful accesses and recent logons. A negative result means no broad probing is occurring within
    the window. References: [Microsoft 4663](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663);
    [A Sense of Self, Forrest et al](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf)'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 7045
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; evaluate per-minute rates
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventID==4663 where AccessResult=='denied' OR auditd EACCES OR falco EACCES\n  | bin\
      \ 1m by actor\n  | stats count() as denials\n  | where denials > baseline_per_actor*  // e.g. >25/min\n\
      \  | alert with actor, denials, sample(ObjectName), Host"
- question: Does the current per-user, per-service-account, or per-process count of files accessed and
    bytes read/written exceed the high-tail threshold of its 30-day per-hour baseline (for example above
    the 99th percentile, or a robust modified-Z > 3.5 using median/MAD)?
  context: 'This statistical method baselines each actor''s hourly file-access volume over 30 days and
    alerts when current activity breaks the high tail. Under Detect, abnormal volume is a primary indicator
    of bulk exfiltration staging or ransomware encryption. Use robust statistics (median and MAD, modified
    Z-score) rather than mean/standard deviation so periodic backup, indexer, and batch jobs do not inflate
    the cutoff and mask real anomalies. A positive result (volume above the 99th percentile or modified-Z
    > 3.5) flags an actor reading/writing far more than its norm; verify whether a legitimate batch job
    explains it before escalation. A negative result indicates volume is within normal bounds for that
    actor and hour-of-day. References: [ShieldFS, Continella et al](https://conand.me/publications/continella-shieldfs-2016.pdf);
    [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - EDR file I/O telemetry
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventID==4663 OR Sysmon EID 11 OR EDR fileio\n  | stats dcount(file) as files, sum(bytes)\
      \ as vol by actor, hour\n  | join baseline (median,MAD per actor,hour over 30d)\n  | eval mz = 0.6745*(files-median)/MAD\n\
      \  | where mz>3.5 OR files>p99\n  | alert with actor, files, vol, hour"
- question: For each actor, do time-of-day deviation, fraction of the directory tree touched, distinct-directory
    count, and file-type access entropy combine to show off-hours access with abnormally high breadth/entropy
    that suggests staging or broad enumeration?
  context: 'ShieldFS found folder-listing rate and file-type access entropy among the most discriminative
    features for ransomware. This method profiles each actor''s access breadth (how much of the tree it
    touches, how many distinct directories, how diverse the file types) and time-of-day, then flags combinations
    of off-hours activity with high breadth/entropy. Under Detect, broad high-entropy access at unusual
    hours is a strong staging/enumeration signal that narrow daytime work would not produce. A positive
    result (e.g., a service account suddenly touching many directories and many file types at 3 a.m.)
    warrants investigation for collection or pre-encryption traversal. A negative result indicates the
    actor''s breadth and timing match its established profile. References: [ShieldFS, Continella et al](https://conand.me/publications/continella-shieldfs-2016.pdf)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - EDR file I/O telemetry
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per actor over window:\n    tod_dev   = deviation(access_hour, baseline_hours)\n   \
      \ tree_frac = dirs_touched / total_dirs\n    ddirs     = dcount(dir)\n    type_ent  = entropy(file_type\
      \ distribution)\n  | where off_hours AND (tree_frac>p95 OR type_ent>p95 OR ddirs>p95)\n  | alert\
      \ with actor, tree_frac, type_ent, ddirs"
- question: For each process, is the ratio of distinct file types read to file types written abnormally
    high ('funneling'), and does this co-occur with a burst of deletions/renames?
  context: 'CryptoDrop showed that crypto-ransomware reads many file types but writes few (or one) — ''funneling''
    — and pairs this with deletion/rename of originals. This method tracks the per-process read:write
    file-type ratio alongside deletion and rename counts and alerts when funneling co-occurs with a deletion
    burst. Under Detect, this is an orthogonal indicator that separates encrypt/replace ransomware from
    benign editing (which keeps the type set narrow without mass deletion). A positive result (high read:write
    type ratio plus a deletion/rename spike) is a strong ransomware indicator; attribute it to the process
    and contain. A negative result means the process is not exhibiting the funnel-and-delete pattern,
    though slow ransomware may stay under the burst threshold. References: [CryptoLock/CryptoDrop, Scaife
    et al](https://doi.org/10.1109/ICDCS.2016.46)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - EDR file I/O telemetry
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; evaluate in sliding windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per ProcessGuid in window:\n    read_types  = dcount(ext where op=read)\n    write_types\
      \ = dcount(ext where op=write)\n    funnel = read_types / max(write_types,1)\n    dels   = count(op\
      \ in (delete,rename))\n  | where funnel>5 AND dels>baseline_deletes\n  | alert with ProcessName,\
      \ funnel, dels, Host"
- question: For write/overwrite operations, does the Shannon entropy of the written buffer rise toward
    ~8 bits/byte with a sharp drop in similarity between the original and new content, aggregated per
    process and time window?
  context: 'Encryption and overwriting drive the Shannon entropy of written data toward the ~8 bits/byte
    maximum while the similarity between original and new file content collapses — the per-file fingerprint
    of destructive action used by UNVEIL and CryptoDrop. This method computes write-buffer entropy and
    original-vs-new similarity, then aggregates the destructive signal per process and time window. Under
    Detect, a cluster of high-entropy, low-similarity writes by one process is a near-certain encrypt/overwrite
    event. A positive result should be attributed to the responsible process and escalated as ransomware/wiper
    activity; a negative result (writes retain structure/low entropy) argues against bulk encryption.
    Beware legitimate compression/encryption tools, which raise entropy but usually have a known profile.
    References: [UNVEIL, Kharraz et al](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf);
    [CryptoLock/CryptoDrop, Scaife et al](https://doi.org/10.1109/ICDCS.2016.46)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - EDR file I/O telemetry
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; aggregate per process per 5-minute window
  queries:
  - technology: EDR/Stats pseudocode
    query: ">-\n  on write/overwrite event:\n    ent = shannon_entropy(write_buffer)\n    sim = similarity(original_content,\
      \ new_content)\n  | bin 5m by ProcessGuid\n  | stats avg(ent) as e, count(ent>7.8 AND sim<0.2) as\
      \ destructive\n  | where e>7.5 AND destructive>baseline\n  | alert with ProcessName, e, destructive,\
      \ Host"
- question: Maintaining separate baselines for successful versus failed file accesses per actor, is there
    an anomalous failure ratio — a surge of denied Windows Event ID 4663 events or EACCES syscalls relative
    to that actor's norm?
  context: 'Successful and failed accesses carry different meaning, so this method keeps separate per-actor
    baselines and alerts on anomalous failure ratios. Under Detect, a surge of denied accesses surfaces
    enumeration and unauthorized traversal even when the adversary obtains no successful read, complementing
    the volume-based detections that only see successful I/O. A positive result (failure ratio or absolute
    denied count well above the actor''s baseline) indicates probing against ACLs — often reconnaissance
    preceding escalation or lateral movement. A negative result means the actor''s success/failure mix
    is normal. Tune to the actor: some service accounts legitimately generate steady low-level denials.
    References: [Microsoft 4663](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4663);
    [ShieldFS, Continella et al](https://conand.me/publications/continella-shieldfs-2016.pdf)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - EDR file I/O telemetry
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventID==4663 OR auditd OR falco\n  | stats count(result=='success') as ok, count(result=='denied')\
      \ as fail by actor, window\n  | join baseline(fail per actor over 30d)\n  | eval ratio = fail/max(ok+fail,1)\n\
      \  | where fail > baseline_fail*3 OR ratio>baseline_ratio_p99\n  | alert with actor, ok, fail, ratio"
- question: Compared to their peer group, is an actor's file-access volume, set of paths, or hours-of-access
    rare for that user or unusual for peers — for example first-time access to a share or abnormal volume?
  context: 'Peer-group analytics (Microsoft Sentinel UEBA style) compare each user''s file-access volume,
    paths, and hours against both their own history and their peer group, flagging activity that is rare-for-user
    or unusual-for-peers. Under Detect, this catches insiders and compromised accounts whose absolute
    volume may be modest but whose behavior diverges from role peers — e.g., first-time access to a finance
    share by an engineer, or off-hours access uncommon among peers. Surface the specific deviation factors
    (rare resource, abnormal volume, unusual hour) in the alert to speed triage. A positive result identifies
    an actor behaving unlike its cohort and itself; a negative result means behavior is consistent with
    peers and history. References: [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - File Integrity Monitoring (Wazuh syscheck)
  - EDR file I/O telemetry
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per user: features = {volume, path_set, access_hours}\n  | compare to user_history AND\
      \ peer_group(role)\n  | flag rare_for_user(path|hour) OR volume > peer_p99 OR first_time_share\n\
      \  | alert with user, factors(rare_resource, abnormal_volume, off_hours)"
- question: Does a supervised per-process I/O classifier (e.g., Random Forest) flag a process as ransomware-like
    based on files read/written/renamed/created per window, file-type changes, write-entropy, and fraction
    of tree touched — with the top-3 contributing features surfaced in the alert?
  context: 'ShieldFS and RWGuard train supervised classifiers on per-process I/O features to label processes
    as ransomware-like in real time. The classification step also attributes file changes to the responsible
    process, which suppresses benign bulk-job false positives. Under Detect, this catches novel ransomware
    that evades fixed thresholds while remaining explainable: the model must surface the top-3 features
    (e.g., write-entropy, distinct files touched, deletion count) so an analyst can validate. A positive
    result identifies a process whose I/O profile matches the trained ransomware class; review the named
    features and contain. A negative result means the process''s behavior matches benign training data
    — but check for drift and adversarial evasion. References: [ShieldFS, Continella et al](https://conand.me/publications/continella-shieldfs-2016.pdf);
    [RWGuard, Mehnaz et al](https://link.springer.com/chapter/10.1007/978-3-030-00470-5_6)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - EDR file I/O telemetry
  - Endpoint provenance graphs
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; near-real-time scoring
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = per_process_window(files_read, files_written, renamed, created,\n       \
      \     type_changes, write_entropy, tree_fraction)\n  score = RandomForest.predict_proba(features)\n\
      \  | where score > threshold\n  | alert with ProcessName, score, top3_features(features), Host"
- question: Does an unsupervised provenance-graph model (e.g., GraphSAGE/ThreaTrace) flag a process or
    file whose local neighborhood deviates from benign structure — such as mass unique-file fan-out —
    and can the alert be traced to root cause?
  context: 'ThreaTrace applies unsupervised node-level learning (GraphSAGE) over provenance graphs of
    process/file/socket nodes to detect a node whose local neighborhood deviates from learned benign structure,
    without needing graph-level labels. Under Detect, this surfaces mass unique-file fan-out (one process
    touching an abnormal star of files), which is characteristic of ransomware traversal and bulk collection,
    and it preserves the graph so the alert traces to root cause. A positive result is an anomalous node
    plus its provenance path — review the process lineage and the files in its neighborhood. A negative
    result means node neighborhoods match benign topology. This method excels where labeled training data
    is scarce and behavior is novel. References: [ThreaTrace, Wang et al](https://arxiv.org/pdf/2111.04333);
    [ThreaTrace code](https://github.com/threaTrace-detector/threaTrace)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - EDR file I/O telemetry
  - Endpoint provenance graphs
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; near-real-time scoring
  queries:
  - technology: ML/Graph pseudocode
    query: ">-\n  G = provenance_graph(process,file,socket nodes; edges=ops)\n  emb = GraphSAGE.node_embeddings(G)\n\
      \  | score each node vs benign neighborhood model\n  | where anomaly(node) AND high_fanout(unique_files)\n\
      \  | alert with node, root_cause_path(node), Host"
- question: Does a sequence model (e.g., LSTM/DeepLog) trained on ordered file/object-access events flag
    a deviating event or out-of-distribution parameter (anomalous byte counts/arguments), and can the
    specific deviating step be surfaced for triage?
  context: 'DeepLog trains an LSTM on ordered access events to learn normal workflows and flags both sequence
    deviations (an event that should not follow the preceding ones) and parameter anomalies (out-of-distribution
    byte counts/arguments). Under Detect, this catches multi-step collection and pre-encryption staging
    that no single-event rule would flag, because the malice is in the ordering. The model surfaces the
    specific deviating step so the analyst sees exactly where normal workflow broke. A positive result
    points to an anomalous step in an access sequence — investigate the process and surrounding events.
    A negative result means the access sequence matches learned normal workflows. Retrain as legitimate
    workflows evolve to limit drift false positives. References: [DeepLog, Du et al](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    [DeepLog code](https://github.com/wuyifan18/DeepLog)'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11 (FileCreate)
  - Linux auditd / Falco file events
  - EDR file I/O telemetry
  - Endpoint provenance graphs
  - 'NAI: File servers, Domain Controllers, workstations of privileged users, and hosts holding regulated/IP
    data.'
  range: Last 90 days; near-real-time scoring
