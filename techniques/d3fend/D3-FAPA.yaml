- question: Does live file telemetry match the read-original -> write-high-entropy -> delete/overwrite-original
    sequence that characterizes crypto-ransomware, combining entropy and content-similarity signals with
    the access ordering?
  context: 'UNVEIL validated, in instrumented decoy environments, that crypto-ransomware follows a read-original
    then write-high-entropy then delete/overwrite-original sequence per file. This ML method learns that
    sequence and applies it to live telemetry, fusing write-entropy and original-vs-new content similarity
    with the ordered access pattern. Under Detect, matching the full sequence is a high-confidence ransomware
    detection that is robust to family-specific differences because it keys on the fundamental encrypt-in-place
    behavior. A positive result (the read-encrypt-overwrite chain repeated across files by one process)
    should trigger immediate containment. A negative result means no encrypt-in-place sequence is present;
    benign encryption tools may partially match, so validate the process and target files. References:
    [UNVEIL, Kharraz et al](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf)'
