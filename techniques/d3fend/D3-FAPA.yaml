- question: Does entity-behavior analytics score a user's file-access deviation against peers and over
    time as anomalous, and does the alert emit the top contributing factors (rare-for-user resource, abnormal
    volume, off-hours) rather than only a numeric score?
  context: 'Microsoft Sentinel UEBA-style entity-behavior analytics score each user''s file-access deviation
    against peers and against their own history over time, with a hard requirement that the alert emit
    the top contributing factors in plain text rather than only a score. Under Detect, explainable peer/temporal
    scoring catches compromised accounts and insiders while giving the analyst the ''why'' needed for
    fast triage. A positive result names the factors driving the anomaly (e.g., rare-for-user resource,
    abnormal volume, off-hours access) so the analyst can confirm intent quickly. A negative result means
    the user''s behavior is normal relative to peers and history. Treat score-only outputs without contributing
    factors as incomplete for this method. References: [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)'
