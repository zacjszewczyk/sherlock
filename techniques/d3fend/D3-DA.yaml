questions:
- question: During each sandbox detonation, did the sample resolve any domains or connect to any IP addresses
    that match known command-and-control or threat-intelligence indicators?
  context: Direct matches between sandbox network observables and curated C2/threat-intel feeds are among
    the highest-confidence malicious verdicts available, because benign software almost never reaches
    known-bad infrastructure. Extract every domain and destination IP seen in Zeek dns.log and conn.log
    for the detonation, enrich them against your intel feeds, and mark direct hits as malicious. Run this
    enrichment in parallel with all other checks - a sample is never cleared simply because no IOC matched,
    since novel malware will use fresh infrastructure. In the Detect mission this validates that the sandbox
    surfaces known-bad callbacks and gives analysts a fast path to a confirmed verdict.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for each detonation:\n  domains = unique(dns.log.query); ips = unique(conn.log.id.resp_h)\n\
      \  hits = (domains UNION ips) INTERSECT threat_intel_feed\n  if hits: emit verdict=MALICIOUS confidence=HIGH,\
      \ indicators=hits\n# always run regardless of other checks; absence of hits != benign"
- question: Did any single sample exhibit a co-occurring malicious behavior chain within one execution
    window - for example a new process spawn plus an autostart/Run-key persistence write plus an external
    network callback?
  context: Individual behaviors can be benign in isolation, but their co-occurrence within one detonation
    window is strong evidence of malice. Trigger high-priority findings when a sample chains, e.g., a
    new process creation (Sysmon Event ID 1 / 4688) with an autostart or Run-key registry write (Sysmon
    Event ID 13) and an external callback (Sysmon Event ID 3). Use deterministic syscall/behavior conditions
    in the style of the [Falco default rule library](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml).
    Keep these concrete chain rules even after ML is added, as they provide an auditable detection floor
    for the Detect mission.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each detonation window:\n  has_spawn  = exists(Sysmon EID 1 OR EID 4688)\n  has_persist=\
      \ exists(Sysmon EID 13 where TargetObject ~ /\\\\Run|Startup/)\n  has_c2     = exists(Sysmon EID\
      \ 3 where dest not in internal_ranges)\n  if has_spawn AND has_persist AND has_c2: alert(priority=HIGH)"
- question: Does the detonation's API-call sequence align with known-malicious call chains (such as the
    VirtualAllocEx -> WriteProcessMemory -> CreateRemoteThread injection chain) even when evasive calls
    are inserted or reordered?
  context: Code-injection and other malicious techniques produce recurring API-call chains that persist
    across family variants but are absent from benign software. Align each detonation's API-call sequence
    (from the Cuckoo behavior report) against a library of known-malicious chains using Smith-Waterman
    local alignment, which tolerates inserted or reordered calls used as evasion, and flag high-scoring
    matches; these injection chains recur across family variants yet are absent in benign software ([Cho
    et al.](https://journals.sagepub.com/doi/full/10.1155/2015/659101)). This catches polymorphic samples
    whose individual calls look ordinary but whose ordering reveals intent, supporting the Detect mission's
    goal of catching previously unknown malware that reuses known tradecraft.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each detonation:\n  seq = ordered_api_calls(behavior_report)\n  for chain in malicious_chain_library:\n\
      \    score = smith_waterman(seq, chain)\n    if score >= threshold: flag(match=chain, score=score)"
- question: Does an execution contain fixed-length syscall n-grams (n=6) that never appear in the benign
    self-baseline for that binary class?
  context: The stide method builds a per-binary-class baseline of benign syscall n-grams and treats any
    sequence absent from that baseline as anomalous. Build the n=6 n-gram baseline from benign detonations,
    then flag executions that contain unseen sequences, tuning the mismatch-window threshold per corpus
    ([Warrender/Forrest et al.](https://ieeexplore.ieee.org/document/766910)). A positive result means
    the sample deviates from the legitimate program's normal behavior - a strong novelty signal for unknown
    malware in the Detect mission. Tune carefully to control false positives from benign rare paths.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = set(all 6-gram syscall windows from benign detonations)\nfor each detonation:\n\
      \  windows = sliding_6grams(syscall_seq)\n  mismatches = [w for w in windows if w not in baseline]\n\
      \  if mismatch_window_rate(mismatches) > threshold: flag(ANOMALOUS)"
- question: Did the sample probe its analysis environment - for example calling IsDebuggerPresent/NtQueryInformationProcess,
    running RDTSC/GetTickCount timing loops, executing CPUID hypervisor checks, or enumerating VM-vendor
    strings and processes?
  context: Performing anti-analysis checks is itself a high-confidence malicious signal, since benign
    software has no reason to detect debuggers or virtualization. Deterministically flag samples that
    call debugger-detection APIs, use timing loops (RDTSC, GetTickCount), perform CPUID hypervisor checks,
    or enumerate registry/processes for VM-vendor strings (vmtoolsd, vboxservice, VMware), per [Galloro
    et al.'s evasive-behavior taxonomy](https://www.sciencedirect.com/science/article/abs/pii/S0167404822001407).
    In the Detect mission these checks both convict the sample and explain why other behavioral signals
    may be suppressed, prompting re-detonation on bare metal.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "evasion_apis = {IsDebuggerPresent, NtQueryInformationProcess, CheckRemoteDebuggerPresent}\n\
      for each detonation:\n  if any(call in evasion_apis) OR timing_loop(RDTSC|GetTickCount)\n     OR\
      \ cpuid_hypervisor_check OR enum(/vmtoolsd|vboxservice|VMware/):\n    flag(MALICIOUS, reason='sandbox-evasion\
      \ check')"
- question: When the same sample is detonated in multiple environments (e.g. an instrumented bare-metal
    host and a VM sandbox), do its persistent state-change sets diverge beyond a tuned threshold?
  context: Evasive malware withholds behavior when it believes it is being analyzed, so the same sample
    will leave different persistent artifacts in a real environment versus a sandbox. Detonate each sample
    in multiple environments, compute the set of persistent state changes (files, registry, processes,
    network) in each, and raise an evasion verdict when the divergence exceeds a tuned threshold, per
    [BareCloud, Kirat et al.](https://www.usenix.org/conference/usenixsecurity14/technical-sessions/presentation/kirat).
    This catches samples that look benign in the sandbox specifically because they detected it - a core
    blind-spot the Detect mission must cover.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each sample:\n  S_vm   = persistent_changes(detonation_vm)\n  S_bare = persistent_changes(detonation_baremetal)\n\
      \  divergence = jaccard_distance(S_vm, S_bare)\n  if divergence > threshold: emit verdict=EVASIVE"
- question: Do any files written or memory regions unpacked during detonation have Shannon entropy high
    enough (around 7.2+) to indicate packed or encrypted payloads?
  context: Packed and encrypted payloads have near-random byte distributions, so high Shannon entropy
    is a fast pre-filter for obfuscated malware. Compute entropy of dropped files and unpacked memory
    regions; flag those above ~7.2 (normal compiled code is ~5.0-6.5), deriving the exact cutoff from
    your own benign-binary distribution ([Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989)).
    A positive result suggests the sample carries an obfuscated stage that warrants deeper analysis, supporting
    the Detect mission's hunt for novel malware that hides its true payload.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each dropped_file, mem_region in detonation:\n  H = shannon_entropy(bytes)\n  if H >=\
      \ 7.2: flag(PACKED, entropy=H)\n# calibrate 7.2 cutoff against benign-binary entropy distribution"
- question: Are the executable names and file-write paths produced by a sample rare compared to the last
    30 days of detonation telemetry (above the 95th percentile of behavioral rarity)?
  context: Novel malware tends to create artifacts that are uncommon across your detonation corpus. Aggregate
    30-day process- and file-creation telemetry, build distributions over executable names and write paths,
    and flag samples whose artifacts exceed the 95th percentile of rarity, tuning the percentile to local
    benign volume. Rarity alone is not proof of malice, but it prioritizes unusual samples for analyst
    triage in the Detect mission, especially when combined with other signals.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
