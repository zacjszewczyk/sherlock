- question: Does a hybrid CNN-LSTM model with transfer learning classify a sample as malicious, including
    for families not seen during training?
  context: Combining a CNN over n-gram API/opcode windows with an LSTM over long-range order, plus transfer
    learning, improves generalization to previously unseen families (99.91% on ~975k samples in [[Bensaoud
    & Kalita](https://www.sciencedirect.com/science/article/abs/pii/S0950705124001783)). This is especially
    valuable for the Detect mission's central goal - catching previously unknown malware - because it
    extends beyond the families present in the training labels. Treat high-confidence outputs as triage
    priorities and keep deterministic rules as the floor.
