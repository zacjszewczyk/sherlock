- question: Does every ML verdict include SHAP/LIME (or attention) explanations naming the top-3 features
    that drove the score - e.g. a VirtualAllocEx call, dropped-file entropy 7.8, or a high-entropy callback
    domain?
  context: Unexplained ML scores are hard to action and easy to game adversarially. Attach SHAP/LIME or
    attention explanations to each model score so the alert names the top-3 drivers, making verdicts auditable
    and defensible, per the [XAI-for-malware survey](https://arxiv.org/html/2409.13723v2). In the Detect
    mission this lets analysts validate why the sandbox flagged a sample, confirm the evidence chain,
    and reject manipulated or spurious verdicts before escalation.
