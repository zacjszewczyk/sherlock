      \  if ll < threshold: flag(ANOMALOUS, loglik=ll)"
- question: Did a sample produce near-zero behavior (no file/registry/network activity), exit within seconds,
    or sleep/stall past the analysis window?
  context: Non-detonation and stalling are common evasion outcomes, not evidence of benignity. Flag samples
    that show near-zero behavior, exit within seconds, or sleep/stall past the analysis window, per [Galloro
    et al.](https://www.sciencedirect.com/science/article/abs/pii/S0167404822001407) and [BareCloud](https://www.usenix.org/conference/usenixsecurity14/technical-sessions/presentation/kirat).
    Crucially, route these to extended or bare-metal re-detonation rather than auto-clearing them as benign.
    In the Detect mission this prevents evasive malware from slipping through simply because it refused
    to run under observation.
