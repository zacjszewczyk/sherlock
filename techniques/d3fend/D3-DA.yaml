  context: Supervised models miss behaviors unlike anything in their labels, so a one-class model trained
    purely on benign detonation feature vectors captures genuinely novel behavior. Train an Isolation
    Forest / one-class model and surface high-anomaly samples regardless of any signature match, per [Nadler
    et al.](https://arxiv.org/abs/1709.08395) In the Detect mission this is the safety net for zero-day
    behavior that all signature- and supervised-based methods overlook.
