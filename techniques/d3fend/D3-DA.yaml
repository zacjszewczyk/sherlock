    query: "for each detonation dns.log:\n  feats = [subdomain_entropy, unique_queries, mean_qlen,\n \
      \          distinct_record_frac, nxdomain_ratio, mean_interarrival]\n  score = isolation_forest.predict(feats)\n\
      \  if score anomalous: flag(DNS_C2_OR_EXFIL)\n  if nxdomain_ratio high: flag(DGA_OR_DEAD_C2)"
- question: Does a detonation's syscall sequence have a likelihood below threshold under a Hidden Markov
    Model trained on benign execution sequences?
  context: An HMM captures the probabilistic structure of benign syscall sequences, so low-likelihood
    sequences indicate abnormal execution. Train the HMM on benign-execution syscall sequences and flag
    detonations whose sequence likelihood falls below a tuned threshold; HMMs reached 76-99% detection
    in [Warrender/Forrest et al.](https://ieeexplore.ieee.org/document/766910) Run this in parallel with
    the deterministic stide baseline so probabilistic and rule-based novelty detection reinforce each
    other in the Detect mission.
  answer_sources:
