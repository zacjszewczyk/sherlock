      \  if activity == 0 OR runtime < 5s OR sleep_time > analysis_window:\n    route_to(extended_or_baremetal_redetonation)\
      \  # do NOT mark benign"
- question: When a supervised model (Random Forest/XGBoost over API n-gram TF-IDF plus network/process/file/registry
    features) scores a new sample, is it classified as likely-novel malware warranting analyst triage?
  context: Supervised models trained on labeled benign and malicious detonations generalize across many
    behavioral signals at once. Use TF-IDF over API n-grams plus network/process/file/registry features
    (per the [Mal-API-2019 evaluation](https://arxiv.org/abs/2403.02232) over the [Mal-API-2019 dataset](https://github.com/ocatak/malware_api_class))
    to score new samples and prioritize likely-novel malware for triage. Keep deterministic rules as the
    detection floor so the model augments rather than replaces them. In the Detect mission this provides
    a calibrated triage ranking for previously unknown samples.
  answer_sources:
