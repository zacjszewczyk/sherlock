  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "build 30d freq tables: exe_name_freq, write_path_freq\nfor each detonation:\n  rarity = percentile_rank(min(exe_name_freq,\
      \ write_path_freq))\n  if rarity >= 95th_percentile: flag(RARE_ARTIFACT)"
- question: Across detonation batches, are there sudden shifts in volume (outbound bytes, up/down ratios),
    frequency (connections, DNS queries, process spawns per minute), or state (failed connections, NXDOMAIN
    ratio, non-zero exits) that indicate a campaign change or sandbox blind spot?
  context: Monitoring rolling aggregate statistics per batch detects when attacker tradecraft shifts or
    when the sandbox suddenly stops observing behavior. Track Volume (outbound byte counts, download/upload
    ratios), Frequency (connections/min, DNS queries/min, process spawns/min), and State (successful vs
    failed connections, NXDOMAIN ratio, non-zero process exits) per batch, and alert on abrupt distribution
    shifts. In the Detect mission, a sudden drop in observed activity can reveal that a new evasion technique
    is defeating the sandbox; a spike can reveal a new campaign.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
  - Windows Event ID 22 (Sysmon - DnsQuery)
  - API/syscall trace (Cuckoo behavior report)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Dynamic analysis/sandbox environment'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each batch:\n  V = stats(outbound_bytes, dl_ul_ratio)\n  F = stats(conns_per_min, dns_per_min,\
      \ spawns_per_min)\n  S = stats(failed_conn_rate, nxdomain_ratio, nonzero_exit_rate)\n  if drift(V|F|S,\
      \ prior_batches) > threshold: alert(DRIFT)"
- question: Do a detonation's DNS queries show characteristics of tunneling, exfiltration, or dead/DGA
    C2 - high subdomain entropy, many unique queries, long query lengths, high distinct-record fraction,
    high NXDOMAIN ratio, or unusual inter-arrival timing?
  context: Low-throughput DNS-based C2 and exfiltration evade volume thresholds, so per-query feature
    scoring is needed. For each detonation's dns.log compute subdomain-label entropy, unique-query count,
    mean query length, fraction of distinct records, NXDOMAIN ratio, and inter-arrival timing, then score
    with an Isolation Forest, per [Nadler et al.](https://arxiv.org/abs/1709.08395) Treat a high NXDOMAIN
    ratio as a distinct failure-mode signal (DGA or dead C2). In the Detect mission this surfaces stealthy
    command-and-control that conventional network volume checks would miss.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - ProcessCreate)
  - Windows Event ID 11 (Sysmon - FileCreate)
  - Windows Event ID 13 (Sysmon - RegistryEvent)
  - Windows Event ID 3 (Sysmon - NetworkConnect)
