name: 'D3-DA: Dynamic Analysis'
id: 42b2313e-6fc6-4078-984c-42a0713edf3c
description: This playbook helps an analyst evaluate and investigate the output of a dynamic-analysis
  (sandbox) capability for detecting previously unknown malware. Sandbox detonation telemetry captures
  concrete runtime behaviors of submitted files - network callbacks, process and child-process launches,
  file writes, registry modifications, and the API/syscall sequences they invoke. The questions below
  combine deterministic behavior/IOC rules, statistical rarity, entropy and DNS scoring, and sequence/ML
  classification, while explicitly profiling evasion and non-detonation as distinct failure signals. Use
  it to confirm true-positive verdicts, surface novel or evasive samples that withhold behavior in the
  sandbox, and route stalling or non-detonating samples to extended re-analysis rather than auto-clearing
  them as benign.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
