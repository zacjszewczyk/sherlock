    query: 'X = features(api_ngram_tfidf + network + process + file + registry)

      model = train(RandomForest|XGBoost, labeled_detonations)

      score = model.predict_proba(X_new)

      if score > triage_threshold: queue_for_analyst(priority=score)'
- question: Does an LSTM trained on ordered Windows API-call sequences classify a sample as malicious
    based on call ordering, even when individual calls appear benign?
  context: Metamorphic variants can use benign-looking individual calls whose ordering is malicious. Train
    an LSTM on ordered Windows API-call sequences from sandbox runs to detect such order-based maliciousness
    (~95% accuracy in [Catak et al.](https://peerj.com/articles/cs-285/)). This complements n-gram and
    alignment methods by modeling long-range call order, helping the Detect mission catch obfuscated unknown
    malware that defeats static and short-window checks.
