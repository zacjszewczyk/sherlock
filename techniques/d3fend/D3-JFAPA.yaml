name: 'D3-JFAPA: Job Function Access Pattern Analysis'
id: dfb528b8-ed2d-4878-b5a1-54b2a4859e12
description: This playbook helps an analyst investigate anomalies in user data-access behavior by comparing
  each account's activity against role-based peer-group expectations. It is designed to surface accounts
  that access unusual repositories, move atypically large data volumes, exhibit anomalous cross-system
  access sequences, or generate abnormal access-denied/failed-logon rates inconsistent with their documented
  job functions. The approach layers deterministic role/ABAC rules over statistical peer-group baselines
  and explainable machine learning, scoring activity on Volume (bytes/files), Frequency (events per unit
  time), and State (success vs. denied) metrics drawn from first-party endpoint, network, and identity
  logs. Use it to detect compromised accounts, insider misuse, and reconnaissance/enumeration that precedes
  successful data theft.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any users accessing data repositories outside the scope approved for their job function
    or department?
  context: Maintain explicit ACL/ABAC mappings between job functions and approved repositories, deriving
    roles data-drivenly from observed user-permission assignments via role mining and enforcing them as
    attribute-based policy (subject role/department, resource sensitivity, time, location). The analyst
    is looking for any object-access event where a user touches a resource outside their approved role
    scope. A positive result is a deterministic, high-fidelity indicator of access outside documented
    job function, which under the Detect tactic flags potential compromised-account or insider data access;
    enrich each hit with role, resource, and authentication context. A negative result confirms access
    stayed within sanctioned bounds.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '4663/smb_files access events JOIN role_to_repo_acl ON (user.role, resource)

      WHERE resource NOT IN approved_repositories[user.role]

      | enrich with Event 4624 logon_type, role, department

      | alert "access outside approved role scope"'
- question: Do any users exhibit high-risk access sequences, such as a first-time privileged logon immediately
    followed by bulk reads from sensitive shares?
  context: 'Create deterministic sequence rules for suspicious workflow transitions, such as a first-time
    privileged logon (Event ID 4624 type 2/10) followed by bulk file reads from sensitive shares within
    one hour, or new user-host-service triples never seen for that role. The analyst watches for ordered
    event chains that, taken together, indicate misuse even when each event alone looks benign. A match
    should be escalated as potential compromised-account or insider misuse, and the matched event chain
    preserved for triage. Tie to the Detect tactic: catching the sequence early limits data exposure.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days (correlate within a 1-hour window per user)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'seq = events WHERE Event 4624 (logon_type IN [2,10]) AND first_seen(user,host)

      FOLLOWED_BY count(4663 read on sensitive_share) > BULK_THRESHOLD WITHIN 1h

      | also match new (user,host,service) triple unseen for role

      | escalate + preserve event_chain'
- question: Does any user's data-access volume, file count, or repository breadth exceed their role peer-group
    baseline?
  context: For each job function compute rolling 30-day distributions for Volume (transferred bytes/day),
    Frequency (files accessed and distinct repositories per day), and concurrency. Alert when a user exceeds
    the role's 95th percentile on multiple metrics; use the median-absolute-deviation modified Z-score
    (flag |Mz|>3.5) to stay robust to batch jobs and outliers. Derive thresholds per environment from
    each role's own history and rank alerts by business sensitivity of accessed data. A positive result
    means the user is behaving unlike peers in the same job function—an anomaly worth review under the
    Detect tactic; a negative result keeps them within normal peer variance.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per role: baseline_30d(bytes/day, files/day, distinct_repos/day, concurrency)

      for each user: Mz = 0.6745*(x - median_role)/MAD_role

      alert WHERE count(metrics with x > p95_role) >= 2 OR |Mz| > 3.5

      | rank by data_sensitivity'
- question: Are users accessing rare or first-seen user-resource combinations that are unusual for their
    role?
  context: Track first-seen user-resource and user-hour-resource combinations and score them by rarity
    against the role's history using a Bayesian new-edge model or a Dirichlet-process profile of per-entity
    access. The analyst prioritizes combinations that are both rare and high-volume to focus on meaningful
    anomalies. A positive result highlights a user touching a resource their role essentially never uses,
    which under the Detect tactic can indicate exploration toward sensitive data; routine rare-but-trivial
    access produces low scores and is deprioritized.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for (user,resource) and (user,hour,resource): if first_seen vs role_history

      rarity = bayesian_new_edge_score(user,resource | role)

      alert WHERE rarity HIGH AND volume HIGH

      | prioritize rare+high-volume combinations'
- question: Is any user generating sustained after-hours access activity outside their role's standard
    working hours?
  context: Define standard working hours per job role (e.g., 9-5 for HR, 24/7 for SOC) and model each
    role's hourly access intensity as a behavioral indicator over fixed periods. Analyze logon (Event
    ID 4624) and file access (Event ID 4663) timestamps and alert on sustained activity (Frequency and
    Volume) outside role-specific windows, especially for roles with strict schedules; weight by the fraction
    of daily bytes moved after hours. Under the Detect tactic, off-hours bulk access is a classic indicator
    of compromised credentials or insiders avoiding observation. A positive result is sustained activity
    outside the expected window; isolated brief events are normal noise.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline role_working_hours per role

      for each user-day: after_hours_events = 4624/4663 WHERE hour NOT IN role_hours

      after_hours_byte_ratio = bytes_after_hours / bytes_total

      alert WHERE sustained_after_hours_activity AND after_hours_byte_ratio HIGH'
- question: Is any role experiencing a spike in access-denied, failed-logon, or blocked-egress events
    indicating permission probing or enumeration?
  context: Treat failure as a distinct signal—baseline each role's normal rate of access-denied file opens
    (Event ID 4656/4663 with failure status), failed logons (Event ID 4625), and blocked egress connections,
    then alert on spikes indicating permission probing or enumeration that precedes successful misuse.
    This is an explicit success-vs-fail State metric within adaptive behavioral profiling. Derive the
    alert threshold from each role's MAD-based modified Z-score on denial counts. Under the Detect tactic,
    a burst of denials often reveals an actor mapping out what they can reach before a successful access;
    a stable low denial rate is benign.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days (rolling baseline of denial rates)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per role: baseline denial_rate(4656/4663 failure, 4625 failed_logon, blocked_egress)

      Mz = 0.6745*(denials - median_role)/MAD_role

      alert WHERE |Mz| > 3.5  // spike = probing/enumeration'
- question: Do unsupervised behavioral-cohort models flag any user-day as a low-likelihood outlier relative
    to its derived peer cohort?
  context: Train unsupervised models on per-user access vectors (resource categories, temporal cadence,
    transferred bytes, file counts, denied-access rate, authentication origin) using Isolation Forest
    and per-user Bayesian Gaussian Mixture Models to derive empirical peer cohorts and flag low-likelihood
    days. Run this in parallel with the deterministic rules (never replacing them) and surface the top-3
    contributing features per alert via SHAP for explainability. Train and validate against labeled role
    data such as the CERT Insider Threat Test Dataset. Under the Detect tactic, this catches anomalies
    that fixed thresholds miss; the analyst reviews the top contributing features to judge whether the
    outlier is malicious or benign batch/seasonal activity.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days (model trained on longer history)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = per_user_day[resource_cats, cadence, bytes, file_count, denied_rate, auth_origin]

      model = IsolationForest() + per_user BayesianGMM()

      score = anomaly_score(features); alert WHERE low_likelihood

      | explain via SHAP top-3 features'
- question: Do online sequence models flag any per-user/day log stream as deviating from learned normal
    behavior, and what features drive the score?
  context: Apply online unsupervised deep/recurrent models to per-user/day log streams to score deviation
    from learned normal behavior, decomposing each anomaly score into individual feature contributions
    so analysts see the drivers (e.g., bytes moved, distinct repositories, after-hours ratio). Calibrate
    alert budgets and recall against the CERT Insider Threat Test Dataset. Under the Detect tactic, this
    provides a temporally-aware view of how a user's behavior is drifting away from their own norm; the
    decomposed feature contributions let the analyst quickly understand and validate each high score.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days (streaming/online scoring)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'for each user/day stream: model = online_RNN_autoencoder()

      score = reconstruction_error(behavior_sequence)

      alert WHERE score > calibrated_budget

      | decompose score into feature contributions (bytes, distinct_repos, after_hours_ratio)'
- question: Does a graph model of authentication and access reveal low-probability user-host-service edges
    outside the normal peer pattern?
  context: Build an authentication/access graph (users, hosts, services, repositories) from Event ID 4624
    and Zeek conn.log and learn embeddings with an unsupervised GNN; score low-probability user-host-service
    edges as access outside the normal peer pattern. Report the specific anomalous edge and its nearest
    expected peers in the alert for explainability, complementing tabular cohort models rather than replacing
    rules. Under the Detect tactic, anomalous edges expose access relationships that deviate from how
    a user's peers connect—useful for spotting lateral movement or access to systems a role would never
    normally touch. The analyst inspects the flagged edge and its expected peers to confirm.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Zeek conn.log
  - Zeek smb_files.log
  - Proxy/Egress logs
  - LDAP/HR role attributes
  - 'NAI: Domain Controllers, Critical File Servers, Database Servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = nodes(users,hosts,services,repos) edges from 4624 + Zeek conn.log

      embeddings = unsupervised_GNN(graph)

      score each (user,host,service) edge; alert WHERE edge_prob LOW

      | report anomalous edge + nearest expected peers'
