name: 'D3-SPP: Strong Password Policy'
id: 8220d765-3bf1-402c-924e-6c513f9980b1
description: Investigate the enforcement state of the enterprise strong-password policy and the user password
  hygiene it produces, and surface the online credential attacks (password spraying, brute force, reset-based
  account takeover) that weak passwords enable. This playbook helps an analyst confirm that domain, fine-grained,
  and cloud identity password policies match an approved strong-password baseline (NIST SP 800-63B), detect
  unauthorized or regressive policy changes, hunt for concentrated and low-and-slow authentication failures,
  and proactively audit password strength through breach-list screening, offline guessing-curve audits,
  and ML-based strength gating and blocklist generation. It covers policy-change and authentication telemetry
  from Windows Domain Controllers, member servers, and internet-facing authentication endpoints, as well
  as Azure AD / Entra ID sign-in logs and identity-provider configuration.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has the domain or fine-grained password policy been changed in a way that weakens it or that
    occurred outside an approved maintenance window or by a non-approved admin account?
  context: 'Supports the Harden tactic by ensuring the strong-password configuration is not silently regressed.
    Monitor Windows Event ID 4739 (domain policy changed) and compare the new settings to an approved
    baseline derived from NIST SP 800-63B and Tan et al.: minimum length >=8 (preferably >=12), lockout
    threshold configured, screening/blocklist enabled, and no arbitrary forced expiry. Alert when the
    minimum length is lowered below baseline, lockout is disabled or raised, the change is initiated by
    a non-approved admin account, or it occurs outside a defined maintenance window. A positive result
    means an attacker or a misconfiguration has weakened credential hardening; require review of the associated
    change ticket before approving. Record the count of settings altered (Volume) and whether the change
    succeeded (State). References: [NIST SP 800-63B](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63b.pdf);
    [Tan et al.](https://www.andrew.cmu.edu/user/nicolasc/publications/Tan-CCS20.pdf).'
  answer_sources:
  - Windows Event ID 4739
  - 'NAI: Domain Controllers, Member Servers, and internet-facing authentication endpoints (VPN, OWA/Exchange,
    ADFS, M365)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EventID=4739\n| parse new policy settings (MinPwdLength, LockoutThreshold, ScreeningEnabled,\
      \ MaxPwdAge)\n| baseline = {MinPwdLength>=12, LockoutThreshold in (configured,nonzero), ScreeningEnabled=true}\n\
      | alert IF MinPwdLength < baseline OR LockoutThreshold disabled/raised\n         OR SubjectUser\
      \ NOT IN approved_admins\n         OR event_time NOT IN maintenance_window\n| enrich with change_ticket;\
      \ set settings_altered_count, change_success"
- question: Is a single source host or IP attempting to authenticate against many distinct accounts within
    a short window, indicating a deterministic password spray?
  context: 'Directly supports Harden by catching the online attacks weak passwords enable. Per Splunk
    and ASD/ACSC guidance, alert when a single source IP/host generates Windows Event ID 4625 against
    more than N distinct target accounts within a 30-minute window (start at N=10 for internal/VPN and
    tune from per-source baselines), with outcomes dominated by bad-password status 0xC000006A or no-such-user
    0xC0000064. Treat any successful logon (Event ID 4624) from that source immediately after the failure
    burst as high-severity (success-after-failure State), as it indicates the spray found a valid weak
    credential. A negative result (few distinct accounts, normal status codes) is benign user error. References:
    [Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [ASD/ACSC](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Windows Event ID 4625
  - Azure AD / Entra ID Sign-in Logs
  - 'NAI: Domain Controllers, Member Servers, and internet-facing authentication endpoints (VPN, OWA/Exchange,
    ADFS, M365)'
  range: Last 90 days; pivot to 30-minute correlation windows around any failure burst
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4625 AND SubStatus IN (0xC000006A,0xC0000064)

      | bin 30m by SourceIP

      | stats distinct(TargetAccount) AS accts BY SourceIP, bin

      | where accts > N  (N=10 internal/VPN; tune per-source)

      | join EventID=4624 by SourceIP within 30m after burst -> escalate (success-after-failure)'
- question: Which users or hosts show concentrated bad-password failures separated from non-existent-user
    or disabled-account failures, exceeding the rolling baseline?
  context: 'Supports Harden by distinguishing brute-force pressure from benign noise. Analyze Windows
    Event ID 4625 by sub-status code, separating bad-password (0xC000006A) from non-existent-user (0xC0000064)
    and disabled/expired accounts. Compute failure rate (count/minute) per user and per host, and flag
    users/hosts above the 95th percentile of the rolling baseline. A high bad-password rate against a
    known-valid account suggests targeted brute force or a usability problem with the policy; a high non-existent-user
    rate suggests account enumeration. Investigate accordingly. References: [ASD/ACSC](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, Member Servers, and internet-facing authentication endpoints (VPN, OWA/Exchange,
    ADFS, M365)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EventID=4625

      | classify SubStatus: badpw=0xC000006A, nouser=0xC0000064, disabled/expired=other

      | stats count BY user, host, class, per-minute

      | rate = count/min

      | baseline = rolling p95(rate) per user/host

      | flag where rate > baseline_p95'
- question: Is the ratio of administrator password resets to user-initiated password changes abnormally
    high for any organizational unit?
  context: Supports Harden by exposing weak password hygiene and possible reset-based takeover. Track
    the ratio of administrator password resets (Windows Event ID 4724) to user-initiated password changes
    (Windows Event ID 4723) per week per OU. Alert when the ratio deviates above the 90th-percentile baseline.
    An elevated ratio indicates weak hygiene, an unusual volume of helpdesk resets, or possible reset-based
    account takeover where an attacker uses admin rights or social engineering to reset passwords rather
    than knowing them.
  answer_sources:
  - Windows Event ID 4723
  - Windows Event ID 4724
  - 'NAI: Domain Controllers, Member Servers, and internet-facing authentication endpoints (VPN, OWA/Exchange,
    ADFS, M365)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'resets = count(EventID=4724) BY OU, week

      changes = count(EventID=4723) BY OU, week

      | ratio = resets / max(changes,1)

      | baseline_p90 = p90(ratio per OU over trailing weeks)

      | alert where ratio > baseline_p90'
- question: Are there abrupt level shifts in authentication-failure or account-lockout volume per organizational
    unit that change-point detection would flag?
  context: 'Supports Harden by detecting sudden onset of online guessing. Baseline Windows Event ID 4625
    failure counts and Event ID 4740 lockout counts per OU/hour and apply CUSUM or change-point detection
    to flag abrupt level shifts. Calibrate sensitivity using the population''s online-guessing budget
    (Bonneau): because password distributions are heavily skewed, even modest failure spikes can compromise
    accounts using common passwords. Report the magnitude and timing of the detected shift in the alert
    so analysts can correlate it with campaigns or misconfiguration. References: [Bonneau](https://www.cl.cam.ac.uk/~jcb82/doc/B12-IEEESP-analyzing_70M_anonymized_passwords.pdf).'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4740
  - 'NAI: Domain Controllers, Member Servers, and internet-facing authentication endpoints (VPN, OWA/Exchange,
    ADFS, M365)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = count(EventID in {4625,4740}) BY OU, hour

      | run CUSUM/change-point on each OU series

      | detect abrupt level shift vs trailing baseline

      | alert with shift_magnitude, shift_time, OU'
- question: Do any OUs or user roles show outlier account-lockout volumes that an unsupervised anomaly
    model would isolate?
  context: 'Supports Harden by surfacing policy misconfiguration or targeted spraying scoped to a group.
    Train an unsupervised anomaly model on Windows Event ID 4740 lockout counts segmented by OU or user
    role to flag outlier groups (per Microsoft Sentinel guidance). The alert must surface the top-3 contributing
    features (e.g., OU, peak hour, dominant source host) rather than only a score, so the analyst can
    immediately understand whether the outlier reflects a spray against a specific group or a broken policy
    applied to that group. References: [Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).'
  answer_sources:
  - Windows Event ID 4740
  - 'NAI: Domain Controllers, Member Servers, and internet-facing authentication endpoints (VPN, OWA/Exchange,
    ADFS, M365)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = lockout_count, peak_hour, dominant_source_host BY OU/role

      | model = unsupervised anomaly detector (e.g., IsolationForest)

      | score groups; flag outliers

      | output top-3 contributing features per flagged group'
- question: Is there a low-and-slow password spray distributed across many source IPs and accounts that
    per-source thresholds would miss?
  context: 'Supports Harden by catching evasive online attacks. Following Microsoft Sentinel guidance,
    cluster Windows Event ID 4625 and Azure AD sign-in failures across source IPs and accounts over long
    windows to catch low-volume sprays distributed across many IPs. Engineer features over distinct accounts,
    distinct source IPs, failure reasons, and geolocation/ASN, and surface the top-3 contributing features
    (accounts targeted, source IPs, error codes) in the alert text. A positive result reveals a coordinated
    campaign that stays under per-source rate limits; correlate the implicated accounts for any successful
    logons. References: [Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).'
  answer_sources:
  - Windows Event ID 4625
  - Azure AD / Entra ID Sign-in Logs
  - 'NAI: Domain Controllers, Member Servers, and internet-facing authentication endpoints (VPN, OWA/Exchange,
    ADFS, M365)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'events = EventID=4625 + AzureAD sign-in failures over long window

      | features = distinct_accounts, distinct_source_IPs, failure_reason, geo/ASN

      | cluster across IP+account dimensions

      | flag clusters with many accounts spread over many low-volume IPs

      | output top-3 features (accounts, source IPs, error codes)'
- question: Do the Default Domain Policy, fine-grained password policies, and Azure AD Password Protection
    currently comply with the strong-password baseline, or have they regressed from it?
  context: 'Supports Harden through periodic verification that the policy configuration itself is correct.
    On a defined cadence, audit the Default Domain Policy, fine-grained password policies, and Azure AD
    Password Protection against the strong-password baseline from NIST SP 800-63B and Tan et al.: minimum
    length >=8/>=12, blocklist/screening enabled, lockout configured, and no counter-productive composition
    or arbitrary rotation rules. Alert on any configuration that violates or regresses from the baseline.
    This is the proactive companion to the 4739 change-monitoring rule and catches drift introduced through
    means other than a logged change. References: [NIST SP 800-63B](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63b.pdf);
    [Tan et al.](https://www.andrew.cmu.edu/user/nicolasc/publications/Tan-CCS20.pdf).'
  answer_sources:
  - Group Policy / Default Domain Policy and Fine-Grained Password Policy settings
  - Azure AD Password Protection configuration
  - 'NAI: Domain Controllers (policy objects and NTDS), identity-provider configuration, and password-set
    workflows'
  range: Last 90 days; run on a scheduled audit cadence (e.g., weekly)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'collect Default Domain Policy + FGPP + AzureAD Password Protection config

      | baseline = {MinLen>=12, BlocklistEnabled=true, LockoutConfigured=true, NoArbitraryRotation, NoCounterproductiveComposition}

      | compare config vs baseline

      | alert on any violation or regression with field-level diff'
- question: Are users setting or changing passwords that match entries in the offline compromised-password
    corpus, even after trivial mangling?
  context: 'Supports Harden by enforcing breach screening at set-time. On password set or change (Windows
    Event ID 4723/4724, or IdP set events) screen the candidate against an offline compromised-password
    corpus using a fuzzy full-string, case-normalized match per Thomas et al. and NIST SP 800-63B (Tan
    et al. recommend fuzzy matching to defeat trivial mangling). Reject matches, and as a failure-mode
    signal track the count and rate of rejected set attempts per user/OU to find users who repeatedly
    choose breached passwords. Repeated rejections indicate a user (or scripted process) cycling through
    known-bad credentials and warrant follow-up. References: [Thomas et al.](https://www.usenix.org/system/files/sec19-thomas.pdf);
    [NIST SP 800-63B](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63b.pdf); [Tan
    et al.](https://www.andrew.cmu.edu/user/nicolasc/publications/Tan-CCS20.pdf).'
  answer_sources:
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Offline compromised-password corpus (e.g., Pwned Passwords / breach lists)
  - 'NAI: Domain Controllers (policy objects and NTDS), identity-provider configuration, and password-set
    workflows'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'on EventID in {4723,4724} or IdP set-event:

      | normalize candidate (case-fold, strip trivial mangling)

      | fuzzy full-string match vs compromised-password corpus

      | IF match -> reject set

      | stats count/rate(rejected) BY user, OU; alert on repeat offenders'
- question: When a representative sample of NTLM hashes is cracked offline, what percentage is recovered
    within online guessing budgets, and does it exceed the organizational threshold?
  context: 'Supports Harden by measuring whether the enforced policy actually produces hard-to-guess passwords.
    On a defined cadence, crack a representative sample of NTLM hashes offline and report percent-cracked
    at fixed guess budgets (e.g., 10^4, 10^6, 10^10) and the aggregate alpha-guesswork metric, per Weir
    et al., Kelley et al., and Bonneau. Alert when percent-cracked at the online budget (~10^4-10^6) exceeds
    an organizational threshold, which indicates the policy is failing in practice and that many accounts
    are vulnerable to online guessing despite passing policy checks. References: [Weir et al.](https://www.cs.umd.edu/~jkatz/security/downloads/passwords_revealed-weir.pdf);
    [Kelley et al.](https://www.ece.cmu.edu/~lbauer/papers/2012/oakland2012-guessing.pdf); [Bonneau](https://www.cl.cam.ac.uk/~jcb82/doc/B12-IEEESP-analyzing_70M_anonymized_passwords.pdf).'
  answer_sources:
  - Offline NTLM hash audit (NTDS.dit)
  - 'NAI: Domain Controllers (policy objects and NTDS), identity-provider configuration, and password-set
    workflows'
  range: Per audit cadence (e.g., quarterly)
  queries:
  - technology: Offline audit/pseudocode
    query: 'sample NTLM hashes from NTDS.dit (representative)

      | crack with wordlist+rules up to budgets {1e4,1e6,1e10}

      | report percent_cracked at each budget + alpha-guesswork

      | alert IF percent_cracked at online budget (1e4-1e6) > org_threshold'
- question: At password-set time, does the candidate password meet a neural/zxcvbn minimum-strength guess-number
    threshold, and which weakening patterns reduce its strength?
  context: 'Supports Harden by gating weak passwords before they enter the environment. At password-set
    time, score the candidate with a neural guessability model (Melicher et al.) or zxcvbn (Wheeler) and
    reject it unless the estimated guess number exceeds a minimum-strength threshold (e.g., 10^6), as
    recommended by Tan et al. Surface the top-3 weakening patterns (e.g., ''top-1000 password'', ''date
    suffix'', ''keyboard walk'') to the user so the decision is explainable rather than just a score.
    Tracking rejection patterns also reveals systemic weak-password habits across the population. References:
    [Melicher et al.](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_melicher.pdf);
    [zxcvbn (Wheeler)](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_wheeler.pdf);
    [Tan et al.](https://www.andrew.cmu.edu/user/nicolasc/publications/Tan-CCS20.pdf).'
  answer_sources:
  - Windows Event ID 4723
  - Windows Event ID 4724
  - 'NAI: Domain Controllers (policy objects and NTDS), identity-provider configuration, and password-set
    workflows'
  range: Continuous at password-set events; review aggregates over Last 90 days
  queries:
  - technology: Set-time/ML pseudocode
    query: 'on password-set candidate:

      | guess_number = neural_model(candidate) or zxcvbn(candidate)

      | IF guess_number < 1e6 -> reject

      | explain: top-3 weakening patterns (e.g., top-1000 pw, date suffix, keyboard walk)

      | log rejections BY user/OU for trend analysis'
- question: Can ML password generators produce likely-guessed candidates to enrich the enforcement blocklist
    and red-team the current policy, and what incremental coverage do they add?
  context: 'Supports Harden by proactively strengthening the blocklist and stress-testing the policy.
    Use ML password generators (PassGAN, Pasquini et al.) to produce likely-guessed candidates that enrich
    the enforcement blocklist and to red-team the current policy. Feed newly generated high-probability
    candidates into the set-time screening list and report the incremental coverage gained (how many additional
    realistic guesses are now blocked). This closes the gap between static breach lists and the evolving
    guessing strategies real attackers use. References: [PassGAN (Hitaj et al.)](https://arxiv.org/pdf/1709.00440);
    [Pasquini et al.](https://arxiv.org/pdf/1910.04232).'
  answer_sources:
  - Offline compromised-password corpus (e.g., Pwned Passwords / breach lists)
  - Azure AD Password Protection configuration
  - 'NAI: Domain Controllers (policy objects and NTDS), identity-provider configuration, and password-set
    workflows'
  range: Per audit cadence (e.g., quarterly)
  queries:
  - technology: Offline/ML pseudocode
    query: 'candidates = MLgen(PassGAN / Pasquini) top-probability passwords

      | diff candidates vs current blocklist -> new entries

      | add new high-probability candidates to set-time screening list

      | red-team: test against sampled hashes; report incremental_coverage_gained'
