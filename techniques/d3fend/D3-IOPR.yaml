name: 'D3-IOPR: IO Port Restriction'
id: 3a15522a-5edd-4fe1-8188-21ba9cfcf958
description: This playbook helps an analyst investigate gaps and violations in IO Port Restriction (D3-IOPR)
  controls across the enterprise. It supports the Isolate tactic by surfacing unauthorized or policy-violating
  peripheral attachments (unapproved USB VID/PID/serial values), denied removable-media writes, anomalous
  attach-detach patterns, BadUSB claimed-class-vs-interface mismatches, removable-media data staging and
  exfiltration (bursts of file copies, off-hours device activity), and unauthorized wireless peripheral
  pairing that bypasses wired-port controls. It combines deterministic allow-list rules, statistical baselining
  and change-point detection, and machine-learning outlier/sequence models against endpoint and device-control
  telemetry so a SOC analyst can confirm IO port restriction enforcement status, detect bypass attempts,
  and identify insider or external actors probing or evading peripheral controls.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any peripheral devices connecting to enterprise endpoints whose USB VID/PID/serial values
    are not on the approved allow-list for that host's policy tier?
  context: Under the Isolate tactic, IO Port Restriction depends on an enforced allow-list of approved
    devices. Maintain an allow list of approved VID/PID pairs and serials per business unit. Parse Windows
    Event 6416 device-attach events (DeviceId encodes USB\VID_xxxx&PID_yyyy\<serial>) and Microsoft Defender
    Device Control DeviceEvents, normalize VID/PID/serial, and alert when a connected device is not approved
    for the host's tier. A positive result (unknown device) indicates an enforcement gap or an attacker
    introducing rogue hardware; a negative result confirms only approved peripherals are present. Present
    results as a daily violation list with host, user, VID/PID, serial, and first-seen timestamp.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM endpoint_device_events (EventID=6416 OR Defender DeviceEvents)

      | parse DeviceId -> vid, pid, serial

      | join host -> policy_tier

      | lookup (vid,pid,serial) in approved_allowlist[policy_tier]

      | where match == false

      | table host, user, vid, pid, serial, min(timestamp) as first_seen

      | sort first_seen'
- question: On Linux endpoints, is any device interface receiving traffic from a process other than the
    single process authorized to use it, or has an unexpected interface/endpoint become active?
  context: IO Port Restriction can pin a device interface to one authorized process (e.g., a webcam only
    to the conferencing app) via URB-level allow/deny rules as in usbfilter. For the Isolate tactic, this
    prevents a malicious process from hijacking a restricted device. Alert when any other process issues
    traffic to a restricted device interface, or when an unexpected interface/endpoint becomes active.
    Include pid/comm/uid and device identity in the alert. A match suggests process-level policy violation
    or device misuse; no match means device-to-process bindings hold.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: Linux usbfilter/auditd pseudocode
    query: 'FROM usbfilter/auditd urb_events

      | for each restricted_device_interface:

      |   expected_proc = binding[device_interface]

      |   where pid_comm != expected_proc OR unexpected_interface_active

      |   emit alert(pid, comm, uid, device_id, interface)'
- question: Does any connected USB device claim a device class that does not match the interfaces it actually
    enumerates (for example a mass-storage device that also presents an HID/keyboard interface)?
  context: This is the core BadUSB signal (GoodUSB). For the Isolate tactic, comparing a device's claimed
    class against the interfaces it actually enumerates detects malicious firmware that masquerades as
    benign hardware. Deny and alert on mismatch. Treat any keyboard/HID interface appearing within seconds
    of a storage enumeration on the same physical port as a high-priority injection attempt. A positive
    result strongly indicates a BadUSB/HID-injection attack; a negative result indicates devices behave
    consistently with their declared class.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM device_attach_events

      | claimed_class = device.bDeviceClass

      | enumerated = set(interface.bInterfaceClass)

      | where claimed_class NOT consistent_with enumerated

      |   OR (storage_enum AND HID_interface within 5s on same port)

      | emit high_priority_alert(host, device_id, claimed_class, enumerated)'
- question: Are there repeated denied or policy-blocked write/delete attempts to removable USB volumes
    that indicate an actor trying to bypass write restrictions?
  context: Correlate Windows Event 4656/4663 and Defender Device Control block events for removable-drive
    object access where requested write/delete access is denied or policy-blocked. For the Isolate tactic,
    repeated blocked writes signal attempted policy bypass and possible data staging. Treat 3+ denied
    writes to USB volumes within 15 minutes as attempted bypass and raise a high-priority incident with
    the account, process, and target volume details. A burst of denials means the control is working but
    is under active attack; isolated denials may be benign user error.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM (EventID IN (4656,4663) OR Defender block_events)

      | where object_type == removable_volume AND access IN (write,delete)

      |   AND result IN (denied, policy_blocked)

      | bin 15min per host

      | where count(denied_writes) >= 3

      | emit high_priority_incident(account, process, target_volume)'
- question: Are mass-storage class devices being mounted on hosts whose policy prohibits external storage,
    or any new device appearing on a fixed-function host (kiosk, OT/SCADA, server)?
  context: Filter Windows Event 6416 for ClassId matching Mass Storage ({4d36e967-e325-11ce-bfc1-08002be10318})
    where host policy prohibits external storage, comparing against an exception list. For the Isolate
    tactic this confirms storage-class isolation. Alert immediately if a storage device is mounted by
    a restricted user account, providing the device instance path and user context. On fixed-function
    hosts treat ANY new device as suspicious (Sen et al.). A match indicates an unauthorized storage device
    or compromise of a locked-down host.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM EventID=6416

      | where ClassId == ''{4d36e967-e325-11ce-bfc1-08002be10318}''

      |   AND host.policy == no_external_storage

      |   AND device NOT IN exception_list

      | if host.type IN (kiosk, OT, SCADA, server): alert on ANY new device

      | emit alert(host, user, device_instance_path)'
- question: Does a host's current-day peripheral device behavior (unique devices, attach frequency, denied-write
    ratio, after-hours attach percentage) deviate significantly from its own 30-day baseline?
  context: For each host, compute 30-day distributions of unique attached devices, attach frequency, denied-write
    ratio, and after-hours attach percentage from Event 6416/DeviceEvents. For the Isolate tactic, behavioral
    baselining reveals when a host's peripheral usage suddenly changes, hinting at policy circumvention.
    Alert when current-day metrics exceed the host's 95th percentile or 3-sigma threshold; derive thresholds
    per host class from your own telemetry and the CERT Insider Threat Test Dataset. Render a trend panel
    comparing current behavior to baseline. A spike warrants investigation; steady metrics indicate normal
    usage.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM device_events last 30d per host

      | metrics: unique_devices, attach_freq, denied_write_ratio, after_hours_pct

      | baseline = per-host distribution by host_class

      | where today.metric > p95(baseline) OR today.metric > mean+3*sigma

      | emit alert + trend_panel(current vs baseline)'
- question: Is there a sudden burst of device attach/detach activity on any host indicating possible data
    staging or repeated evasion attempts?
  context: Aggregate attach and detach counts into 15-minute bins per host and apply EWMA or CUSUM change-point
    detection (Aminikhanghahi & Cook) to detect sudden level-shifts. For the Isolate tactic, burst patterns
    can mean an actor rapidly cycling devices to stage data or probe restrictions. Escalate when the burst
    score remains above the drift threshold for three consecutive bins. Sustained elevation indicates
    probable data staging or repeated evasion; transient blips are likely benign.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM device_events per host

      | bin attach+detach counts into 15min windows

      | apply EWMA/CUSUM change_point

      | where burst_score > drift_threshold for 3 consecutive bins

      | escalate(host, window, burst_score)'
- question: Is any host or user experiencing a sustained surge in blocked/denied device attachments and
    blocked removable writes, suggesting repeated probing of IO-port restrictions?
  context: Treat denied/blocked device attachments and blocked removable writes as a distinct failure-rate
    time series per host and per user (analogous to NXDOMAIN/failed-logon profiling). For the Isolate
    tactic, a surge in blocks means the control is being repeatedly tested. Baseline normal block rates
    and use CUSUM (Aminikhanghahi & Cook) to alert on a sustained surge of blocked-device events. A sustained
    surge signals an actor repeatedly probing IO-port restrictions; a stable rate indicates routine policy
    enforcement.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM blocked_device_attach + blocked_removable_write per host,user

      | failure_series = count over time

      | baseline normal block_rate

      | apply CUSUM

      | where sustained_surge above baseline

      | emit alert(host, user, surge_window)'
- question: Which host-days are statistical outliers in peripheral behavior when scored by an unsupervised
    anomaly model across multiple device-usage features?
  context: Train an Isolation Forest and/or One-Class SVM on per-host-day feature vectors (device diversity,
    attach cadence, denied-write ratio, off-hours %, distinct device classes); One-Class SVM is more robust
    under poisoned training data. For the Isolate tactic, multivariate anomaly scoring catches subtle
    combinations of behaviors a single rule would miss. Score new host-days and surface the top-3 contributing
    features in the alert text (SHAP-IDS). Run in parallel with — never replacing — the deterministic
    allow-list rules. High anomaly scores warrant triage; the feature attributions explain why.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = per_host_day[device_diversity, attach_cadence, denied_write_ratio, off_hours_pct,
      distinct_classes]

      model = IsolationForest() and/or OneClassSVM()

      score = model.decision_function(new_host_day)

      if anomalous: alert with top-3 SHAP features

      run parallel to allowlist rules'
- question: Does the ordered sequence of PnP/removable-media events on a host (attach -> mount -> read/write)
    diverge from the expected next-event predicted by a sequence model?
  context: Apply a DeepLog-style LSTM over per-host PnP/removable-media event sequences and flag events
    whose predicted next-key probability falls outside the top-g candidates — e.g., a storage attach immediately
    followed by mass file reads, or an HID interface appearing after a storage enumeration. For the Isolate
    tactic, sequence modeling captures abnormal device-interaction workflows characteristic of automated
    exfiltration or BadUSB. Emit the diverging event and its expected alternatives for triage. A divergence
    flags unusual device behavior; matching the expected sequence indicates normal operation.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = per_host PnP/removable events [attach -> mount -> read/write]\nmodel = DeepLog_LSTM()\n\
      for event in seq:\n  if P(event | history) not in top-g predictions:\n    flag(event, expected_alternatives)"
- question: When endpoints are clustered into normal peripheral-usage cohorts (kiosk, developer, server),
    which host-days fall outside their expected cluster profile?
  context: Train DBSCAN or K-Means on per-host features (device diversity, attach cadence, denied-write
    ratio, off-hours usage) to form normal usage cohorts. For the Isolate tactic, cohort modeling distinguishes
    legitimate role-based peripheral usage from anomalous behavior. Score new host-days against cluster
    profiles and investigate outliers with explainable feature deltas, surfacing the top contributing
    features (SHAP-IDS). Outliers from a host's expected cohort warrant review; in-cluster behavior is
    consistent with peer hosts.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Microsoft Defender DeviceEvents
  - Linux udev / usbfilter logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = per_host[device_diversity, attach_cadence, denied_write_ratio, off_hours_usage]

      clusters = DBSCAN()/KMeans()  # cohorts: kiosk, developer, server

      for host_day: assign/score vs cluster

      if outlier: investigate with top feature deltas (SHAP)'
- question: Is any user copying an abnormally high volume of files or bytes to removable media, or copying
    outside normal hours, relative to their own baseline?
  context: For each user, baseline daily file-copy counts and total bytes written to removable media (Event
    4663 write access on USB volumes + Defender DeviceEvents) using the CERT Insider Threat Test Dataset
    to seed thresholds. For the Isolate tactic, removable-media copy surges indicate data staging or exfiltration
    that bypassed IO-port controls. Apply CUSUM/EWMA (Aminikhanghahi & Cook) and alert on a sudden surge
    in copy volume or off-hours copying that exceeds the user's 95th-percentile baseline. A surge or off-hours
    spike warrants investigation; steady volume is consistent with normal work.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Microsoft Defender DeviceEvents
  - Removable-media file-copy audit logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM (EventID=4663 write on USB volume + Defender DeviceEvents) per user

      | daily metrics: file_copy_count, bytes_written

      | baseline thresholds (CERT dataset seed)

      | apply CUSUM/EWMA

      | where today > p95(user_baseline) OR off_hours_copy_spike

      | emit alert(user, copy_volume, window)'
- question: Does a user's temporal pattern of device-connect, file-copy, and logon events match the signature
    of insider data theft (removable-media copy bursts plus off-hours device activity)?
  context: Train a per-user temporal sequence model (RNN/LSTM or autoencoder) over device-connect, file-copy,
    and logon events; data-theft insiders manifest as removable-media copy bursts and off-hours device
    activity, and temporal models outperform static features (Yuan & Wu). For the Isolate tactic this
    links peripheral usage to broader exfiltration behavior. Use DeepLog-style next-event scoring and
    surface the anomalous event sequence with the top contributing features. A flagged sequence suggests
    insider exfiltration; expected sequences indicate normal user activity.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Microsoft Defender DeviceEvents
  - Removable-media file-copy audit logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = per_user [device_connect, file_copy, logon] events\nmodel = RNN/LSTM or autoencoder\
      \ (DeepLog next-event scoring)\nif anomalous_sequence (copy_burst + off_hours_device):\n  alert\
      \ with sequence + top contributing features"
- question: Is any wireless peripheral (Bluetooth HID, etc.) attempting to pair or transfer whose physical-layer
    RF fingerprint is not on the hardware allow-list, even if it spoofs an approved device's identifiers?
  context: Where wireless peripherals can bypass wired IO-port controls, build a hardware allow-list using
    physical-layer RF fingerprints (transient phase, IQ imbalance) classified per Rusins & Nesenbergs.
    For the Isolate tactic, RF fingerprinting closes the wireless gap left by wired-port restrictions
    and resists identifier spoofing. Alert when an unknown or unallow-listed radio attempts to pair or
    transfer, even if it spoofs an approved device's identifiers. An unknown RF fingerprint indicates
    a rogue wireless peripheral; a matching fingerprint confirms an approved radio.
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Microsoft Defender DeviceEvents
  - Removable-media file-copy audit logs
  - 'NAI: All enterprise endpoints (workstations, servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'FROM wireless_pairing/transfer events (Bluetooth HID, etc.)

      | extract RF_fingerprint(transient_phase, IQ_imbalance)

      | classify vs hardware_allowlist (Rusins & Nesenbergs)

      | where fingerprint NOT in allowlist (even if identifiers spoofed)

      | emit alert(radio_id, claimed_identity, fingerprint)'
