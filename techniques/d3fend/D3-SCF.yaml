name: 'D3-SCF: System Call Filtering'
id: 7f97b745-3787-4dad-ac89-153163bd8534
description: 'Investigate the presence, enforcement state, and runtime behavior of system call filtering
  and mandatory access control on critical assets (Critical Application Servers, Domain Controllers, Tier
  0 administrator workstations, and Internet-facing container workloads). This playbook helps an analyst
  answer two related questions: (1) is the control actually ENFORCING — SELinux in enforcing mode, AppArmor
  profiles in enforce (not complain/permissive) mode, a non-zero seccomp filter installed on critical
  service PIDs, and Windows Mandatory Integrity Control / Windows Filtering Platform active — and (2)
  are blocked or denied operations occurring, which are high-signal indicators of misconfiguration, drift,
  or active exploitation. It combines deterministic enforcement/violation logic (AVC denials, seccomp
  KILL/ERRNO, Windows Event 5157/5152/5153 blocks, allow/deny syscall rules) with statistical baselining
  of block/denial VOLUME, FREQUENCY, RATIO, and FAILURE STATE, and machine-learning behavioral profiling
  of syscall streams, event ordering, and whole-system provenance graphs. Failure signals are treated
  as first-class detection features, not noise, so that a confined process suddenly generating denials
  is surfaced as a leading indicator of compromise.'
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
