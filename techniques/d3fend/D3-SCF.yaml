questions:
- question: On every critical asset that is supposed to be confined, is the system call filtering / mandatory
    access control actually in an ENFORCING state rather than merely installed, disabled, permissive,
    or complain mode?
  context: 'Tactic: Isolate. A filter that is installed but not enforcing provides zero isolation, and
    attackers or sloppy change management frequently drop SELinux to permissive or load AppArmor profiles
    in complain mode to silence denials while still appearing ''present''. On Linux assert SELinux is
    in enforcing mode (getenforce returns Enforcing and an AVC stream is present), that per-program AppArmor
    profiles are in enforce mode, and that critical service PIDs carry a non-zero seccomp filter mask
    (the Seccomp: field in /proc/<pid>/status). On Windows confirm Mandatory Integrity Control levels
    and that WFP filters are loaded. A positive result (a host reports permissive/unconfined/no-seccomp
    where confinement is expected) is an isolation gap that must be remediated; a negative result confirms
    the control is live. Maps to kernel filter actions documented in [Seccomp BPF, Linux Kernel Documentation](https://docs.kernel.org/userspace-api/seccomp_filter.html),
    the [SELinux Project](https://github.com/SELinuxProject), and [AppArmor](https://www.apparmor.net/).'
  answer_sources:
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 5157 (WFP blocked connection)
  - Windows Event ID 5152/5153 (WFP packet block)
  - Windows Event ID 4688 (process creation)
  - Zeek conn.log
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each host IN NAI_critical_assets:\n  expected = confinement_inventory[host]   // selinux_enforcing\
      \ | apparmor_enforce | seccomp_required | mic_active\n  observed = posture_telemetry[host]     \
      \   // getenforce, aa-status, /proc/<pid>/status Seccomp field, WFP state\n  IF expected.selinux\
      \ AND observed.selinux != 'Enforcing': ALERT 'SELinux not enforcing'\n  IF expected.apparmor AND\
      \ any(profile.mode IN ['complain','disabled']): ALERT 'AppArmor profile not in enforce'\n  IF expected.seccomp\
      \ AND observed.seccomp_mask == 0 for critical_service_pid: ALERT 'no seccomp filter'\n  IF expected.mic\
      \ AND NOT observed.wfp_loaded: ALERT 'WFP/MIC inactive'"
- question: Which Windows hosts are recording connections blocked by the Windows Filtering Platform (Event
    ID 5157 and packet blocks 5152/5153), and do the blocking filter ID, process, direction, and 5-tuple
    explain why each block fired?
  context: 'Tactic: Isolate. WFP block events are direct evidence that network-level system call filtering
    is active and enforcing on a Windows host. Query Event ID 5157 (and 5152/5153 packet blocks) to maintain
    an inventory of hosts emitting these events, confirming the control is live, and emit the blocking
    filter ID, process, direction, and 5-tuple so analysts immediately see WHY the block occurred. A host
    that should be confined but emits no block events may have the control disabled; a sudden surge of
    blocks tied to one process is a potential exploitation or beaconing signal. Baseline expected block
    rate per [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 5157 (WFP blocked connection)
  - Windows Event ID 5152/5153 (WFP packet block)
  - Windows Event ID 4688 (process creation)
  - Zeek conn.log
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, FilterId, Application AS process, Direction, SourceAddress, SourcePort,\n   \
      \    DestAddress, DestPort\nFROM windows_security\nWHERE EventID IN (5157, 5152, 5153)\nGROUP BY\
      \ host\nEMIT host_inventory WITH block_count, distinct_filter_ids\nALERT WHEN host IN NAI_critical_assets\
      \ AND (block_count == 0 expected_active\n       OR block_count spikes vs baseline)"
- question: Are any confined Linux processes generating SELinux/AppArmor AVC denials or seccomp violations,
    or running unconfined/permissive where strict confinement is expected?
  context: 'Tactic: Isolate. Parse auditd for AVC denials (type=AVC ... denied) from SELinux/AppArmor
    and seccomp violations (type=SECCOMP). Two conditions warrant an alert: (1) a critical application
    running unconfined or in permissive/complain mode where strict confinement is policy, and (2) any
    denied syscall or object access for a confined Tier 0 process. The first is an isolation gap; the
    second is a high-signal indicator that a process is attempting actions outside its policy, which can
    be drift, misconfiguration after an update, or active exploitation of the confined service. AVC/DENIED
    record semantics follow the [SELinux Project](https://github.com/SELinuxProject) and [AppArmor](https://www.apparmor.net/)
    documentation.'
  answer_sources:
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 5157 (WFP blocked connection)
  - Windows Event ID 5152/5153 (WFP packet block)
  - Windows Event ID 4688 (process creation)
  - Zeek conn.log
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, pid, comm, scontext, tcontext, tclass, denied_perms\nFROM auditd\nWHERE type\
      \ == 'AVC' AND msg CONTAINS 'denied'\n   OR type == 'SECCOMP'\nALERT WHEN host IN NAI_critical_assets\n\
      \  AND ( comm IN tier0_confined_services            // any denial = alert\n        OR scontext CONTAINS\
      \ 'unconfined' )         // running unconfined where confinement expected"
- question: Is any process performing out-of-policy syscall behavior that the kernel filter would (or
    should) block — for example a shell spawned in a container, a write below /etc, exec from a writable/tmp
    path, an unexpected outbound port, or ptrace/process injection?
  context: 'Tactic: Isolate. Run an allow-list/deny-list rule engine over the live syscall stream to catch
    out-of-policy behavior independent of whether the kernel filter actually blocked it — this both validates
    the filter and catches gaps. Classic high-fidelity patterns include a shell spawned inside a container,
    writes below /etc, exec from a writable or /tmp path, unexpected outbound network ports, and ptrace/process
    injection. Use [Falco Default Detection Rules](https://falco.org/docs/reference/rules/default-rules/),
    [Tracee](https://github.com/aquasecurity/tracee), or [Tetragon](https://github.com/cilium/tetragon)
    (which can additionally SIGKILL the offending syscall). Each alert must name the process, command
    line, container, user, and matched syscall so it is immediately actionable. The concept of per-program
    normal-sequence allow-listing originates in [A Sense of Self for Unix Processes, Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 4688 (process creation)
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days
  queries:
  - technology: Falco/Tetragon rule pseudocode
    query: "RULE out_of_policy_syscall:\n  MATCH ON syscall_stream WHERE\n      (container AND proc.name\
      \ IN ['bash','sh','zsh'])\n   OR (open/write target STARTSWITH '/etc' AND proc NOT IN allowed_writers)\n\
      \   OR (execve FROM path IN ['/tmp','/dev/shm', writable_dir])\n   OR (connect TO port NOT IN allowlist[proc])\n\
      \   OR (syscall IN ['ptrace','process_vm_writev'])\n  OUTPUT proc.name, proc.cmdline, container.id,\
      \ user.name, matched_syscall\n  ACTION alert [+ optional sigkill]"
- question: For each host and application, has the per-day or per-minute count of blocked syscalls/connections
    (seccomp KILL/ERRNO, AVC denials, Event 5157) crossed either a deterministic floor or a learned rolling-baseline
    threshold?
  context: 'Tactic: Isolate. Compute per-host/per-application counts of blocked syscalls and connections
    over per-minute and per-day windows. Apply BOTH a deterministic floor (for example more than 50 blocks/min
    from a single process, or ANY block on a Tier 0 host) AND a learned threshold set at the 90th percentile
    or median+3*MAD of a rolling 30-day baseline; alert when either is exceeded. A breach indicates misconfiguration
    or active exploitation. The deterministic floor guarantees coverage for low-and-slow activity even
    when the learned baseline is still warming up, so it must never be removed when tuning. Robust standard-deviation/threshold
    approach from [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 5157 (WFP blocked connection)
  - Windows Event ID 5152/5153 (WFP packet block)
  - Windows Event ID 4688 (process creation)
  - Zeek conn.log
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days; recompute over rolling 30-day baseline with per-minute and per-day windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each (host, app) PER minute AND PER day:\n  blocks = count(seccomp_KILL|seccomp_ERRNO|AVC_denied|EventID\
      \ 5157)\n  baseline = rolling_30d(blocks)\n  learned_thr = max(p90(baseline), median(baseline) +\
      \ 3*MAD(baseline))\n  IF blocks > 50 per minute from one process: ALERT (deterministic floor)\n\
      \  IF host IN tier0 AND blocks > 0: ALERT (deterministic floor)\n  IF blocks > learned_thr: ALERT\
      \ (statistical)"
- question: For a specific binary, are previously-unseen system calls appearing or are policy-violation
    counts spiking — as revealed by a per-application Bag-of-System-Calls frequency profile over sliding
    windows?
  context: 'Tactic: Isolate. Build a per-application frequency-vector profile of system calls over sliding
    windows (the Bag of System Calls representation) and aggregate block events by application name. Alert
    on previously-unseen syscalls for a binary or sudden spikes in violation counts, both of which suggest
    a compromised process attempting unauthorized actions while still wearing a legitimate program''s
    identity. Because the model is keyed to the application, it isolates which workload deviated rather
    than just flagging host-level noise. Method from [Applying Bag of System Calls for Anomalous Behavior
    Detection of Applications in Linux Containers, Maddala et al.](https://arxiv.org/abs/1611.03053);
    the frequency-vs-HMM-vs-enumeration data-model trade space (76-99% detection) is characterized in
    [Detecting intrusions using system calls: alternative data models, Warrender et al.](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 5157 (WFP blocked connection)
  - Windows Event ID 5152/5153 (WFP packet block)
  - Windows Event ID 4688 (process creation)
  - Zeek conn.log
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days; sliding-window syscall profiles
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each app OVER sliding_window:\n  vec = freq_vector(syscalls_for_app)          // Bag of\
      \ System Calls\n  profile = historical_freq_vectors[app]\n  new_calls = vec.keys - profile.keys\n\
      \  IF new_calls NOT empty: ALERT 'unseen syscall for ' + app, new_calls\n  IF count(block_events[app])\
      \ > spike_threshold(profile): ALERT 'violation spike for ' + app"
- question: Is the RATIO of failures to successes (seccomp ERRNO vs KILL, denied-to-allowed AVC decisions,
    WFP blocked-to-allowed connections, per-process blocked-connection rate) shifting on a confined service,
    even if absolute volume looks normal?
  context: 'Tactic: Isolate. Explicitly baseline failure-state metrics SEPARATELY from successes: seccomp
    ERRNO vs KILL counts, the ratio of denied-to-allowed AVC decisions, the WFP blocked-to-allowed connection
    ratio (joining Zeek conn.log with Event 5157), and the per-process blocked-connection rate. A rising
    denial RATIO on a confined service — not just rising absolute counts — is a leading indicator of exploitation
    or configuration drift, because a compromised process tends to fail policy checks far more often relative
    to its legitimate work. Alert on ratio shifts beyond median+3*MAD. Grounded in failure-aware statistical
    baselining from [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 5157 (WFP blocked connection)
  - Windows Event ID 5152/5153 (WFP packet block)
  - Windows Event ID 4688 (process creation)
  - Zeek conn.log
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days; rolling ratio baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each (host, process):\n  denied = count(AVC_denied | seccomp_KILL | seccomp_ERRNO | WFP_block)\n\
      \  allowed = count(AVC_allowed | syscall_success | WFP_allow)\n  ratio = denied / max(allowed, 1)\n\
      \  base = rolling_baseline(ratio)\n  IF ratio > median(base) + 3*MAD(base): ALERT 'denial-ratio\
      \ shift', host, process, ratio"
- question: Among horizontally scaled replicas of the same critical service, does any replica's kernel-event/syscall
    distribution diverge from its peers?
  context: 'Tactic: Isolate. For horizontally scaled critical services, compare kernel-event/syscall distributions
    across replicas of the same workload. A replica whose distribution diverges from its peers is anomalous
    even without a trained baseline, which makes this approach robust to software updates and concept
    drift (all replicas update together, so a benign update shifts every replica equally while a compromise
    shifts only the affected one). This is a training-less cross-replica method from [ReplicaWatcher:
    Training-less Anomaly Detection in Containerized Microservices, Doan et al.](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf).
    A positive result points investigators directly at the odd-one-out container/pod for deeper triage.'
  answer_sources:
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days; compare contemporaneous replica windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "GROUP replicas BY workload_label (deployment/replicaset)\nFOR each workload:\n  dist[r] =\
      \ syscall_freq_distribution(replica r) for r in replicas\n  centroid = mean(dist[*])\n  FOR each\
      \ replica r:\n    divergence = distance(dist[r], centroid)   // e.g. JS-divergence / chi-square\n\
      \    IF divergence > peer_threshold: ALERT 'replica diverges from peers', workload, r"
- question: When a new process starts (Event ID 4688 / execve), does an unsupervised model flag it as
    anomalous against known-good behavior, and what top features drive that score?
  context: 'Tactic: Isolate. Collect features for each new process — parentage, command line, user, network
    activity, and a syscall-frequency vector — and train an unsupervised One-Class SVM or Isolation Forest
    on known-good behavior to flag anomalous processes. These flagged processes are candidates for stricter
    system call filtering policy and for incident triage. Critically, the alert MUST surface the top-3
    contributing features (via LIME/SHAP) rather than just a raw score, so analysts can judge the finding
    and tune policy. OCSVM/iForest with LIME explanations and adversarial-robustness considerations per
    [Robust IoT security using isolation forest and one class SVM algorithms](https://www.nature.com/articles/s41598-025-20445-4);
    feature-representation guidance (n-gram vs frequency vs embedding) per [Intrusion Detection in Containerized
    Services Using System Call Data Representations](https://www.sciencedirect.com/science/article/pii/S0167404825001270).'
  answer_sources:
  - Windows Event ID 4688 (process creation)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days; train on rolling known-good window, score new processes
  queries:
  - technology: ML/pseudocode
    query: "features(proc) = [parent_image, cmdline_tokens, user, net_activity, syscall_freq_vector]\n\
      model = OneClassSVM().fit(known_good_features)   // or IsolationForest\nFOR each new process (EventID\
      \ 4688 | execve):\n  score = model.decision_function(features(proc))\n  IF score < anomaly_cutoff:\n\
      \    top3 = explain(model, features(proc))         // LIME / SHAP\n    ALERT proc, score, top3_contributing_features"
- question: Within a process's ordered stream of audit/seccomp/WFP events (or raw syscalls), does any
    event fall outside the top-g keys predicted by a trained sequence model, and which key/parameter deviated?
  context: 'Tactic: Isolate. Treat the ordered stream of audit/seccomp/WFP events (or raw syscalls) per
    process as a sequence and train an LSTM to predict the next event. Flag any event that falls outside
    the top-g predicted keys, and report which key or parameter deviated for explainability. This catches
    ordering anomalies that frequency-based methods miss — for instance a syscall sequence that is individually
    normal but appears in an impossible order during an exploit. This is the DeepLog sequence-anomaly
    approach from [DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep Learning, Du
    et al.](https://acmccs.github.io/papers/p1285-duA.pdf). Run it in parallel WITH the deterministic
    rules above; it augments, never replaces, them.'
  answer_sources:
  - Linux seccomp audit records (SECCOMP_RET_LOG / type=SECCOMP)
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days; per-process sequence windows
  queries:
  - technology: ML/pseudocode
    query: "seq = ordered_event_keys_per_process(audit | seccomp | WFP | raw_syscalls)\nlstm = train_next_event_predictor(known_good_sequences)\
      \   // DeepLog\nFOR each event e_t in seq:\n  topg = lstm.predict_topk(history(e_t), k=g)\n  IF\
      \ e_t NOT IN topg:\n    ALERT process, position=t, observed=e_t, expected_topg=topg"
- question: Can isolated syscall-filter violations be assembled into an explainable incident by building
    whole-system provenance graphs and applying graph learning to detect anomalous nodes/edges and reconstruct
    the causal attack subgraph?
  context: 'Tactic: Isolate. Build whole-system provenance graphs from syscall/audit telemetry (process->file->socket
    edges) and apply graph learning to detect anomalous nodes and edges and to reconstruct the causal
    attack subgraph. This turns scattered, low-context syscall-filter violations into a single explainable
    incident showing how an attacker moved from initial access through the confined service to its objective.
    Use a temporal GNN with attack-subgraph reconstruction ([KAIROS: Practical Intrusion Detection and
    Investigation using Whole-system Provenance, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf))
    and node-level GraphSAGE detection/tracing ([threaTrace: Detecting and Tracing Host-based Threats
    in Node Level Through Provenance Graph Learning, Wang et al.](https://arxiv.org/abs/2111.04333));
    both were evaluated on DARPA TC/OpTC. A positive result yields a ranked subgraph that investigators
    can walk to scope blast radius.'
  answer_sources:
  - Linux Audit Logs (auditd) - AVC denials (SELinux/AppArmor)
  - eBPF runtime telemetry (Falco / Tracee / Tetragon)
  - Windows Event ID 4688 (process creation)
  - 'NAI: Critical Application Servers, Domain Controllers, Tier 0 Administrator Workstations, Internet-facing
    container workloads'
  range: Last 90 days; build provenance over incident window then expand causally
  queries:
  - technology: ML/Graph pseudocode
    query: "G = build_provenance_graph(syscall/audit events)   // nodes: process,file,socket; edges: exec,read,write,connect\n\
      model = temporal_GNN()  // KAIROS  | node_classifier = GraphSAGE()  // threaTrace\nanomalies = model.score_nodes_and_edges(G)\n\
      FOR each anomalous node/edge seeded by a syscall-filter violation:\n  subgraph = reconstruct_causal_path(G,\
      \ seed)\n  ALERT incident WITH ranked_subgraph, entry_point, affected_assets"
