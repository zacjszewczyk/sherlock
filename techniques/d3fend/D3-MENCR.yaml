name: 'D3-MENCR: Message Encryption'
id: e606910f-baa3-4f3a-9bad-a8e08bdb0156
description: Investigate the implementation status, configuration, and runtime behavior of message encryption
  across the enterprise messaging fabric. This playbook helps an analyst hunt for transport-layer hardening
  gaps (plaintext SMTP/POP3/IMAP/submission sessions, stripped or failed STARTTLS, protocol/version downgrades,
  weak cipher suites, certificate validation failures, and missing MTA-STS/DANE enforcement) as well as
  message-body encryption gaps (S/MIME or OpenPGP messages lacking integrity protection, encrypted mail
  embedding remote-content references, and weak mail-client configuration that enables Efail-style ciphertext-gadget
  exfiltration). It combines deterministic symbolic-logic detections with statistical baselining of encrypted-versus-plaintext
  ratios, negotiation failure rates, and traffic-volume forecasting, plus unsupervised machine-learning
  anomaly detection over TLS and MIME-structure features. The goal is to surface both benign configuration
  drift and active downgrade/man-in-the-middle attempts by a sophisticated adversary, ensuring messages
  expected to be protected are in fact encrypted, authenticated, and integrity-protected.
type: technique
related:
- tactic_id: D3-MH
  tactic_name: Message Hardening
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which messaging sessions transferred mail or credentials over cleartext, and where was STARTTLS
    missing, failing, or actively stripped despite policy requiring encryption?
  context: Under the Message Hardening tactic, the baseline expectation is that all client and server
    messaging traffic is encrypted (Implicit-TLS per RFC 8314). This question hunts for violations of
    that baseline. Query Zeek conn.log for SMTP/POP3/IMAP/submission traffic on plaintext ports (25/110/143/587)
    and correlate with smtp.log/ssl.log TLS outcomes. A positive finding is any session that authenticates
    or transfers a message in cleartext, any session where STARTTLS is advertised but never completed,
    or where the advertised STARTTLS capability has been mangled (replaced with non-keyword bytes) so
    the session silently falls back to cleartext — the canonical STARTTLS-stripping signal. Such findings
    indicate either misconfiguration or an active man-in-the-middle stripping encryption to read mail
    and harvest credentials. A negative result (all sessions upgrade cleanly to TLS) confirms transport
    hardening is intact on those paths.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'JOIN conn.log (service in [smtp,pop3,imap] OR resp_p in [25,110,143,587])

      WITH smtp.log, ssl.log ON uid

      WHERE tls == false OR starttls_offered == true AND starttls_completed == false

      OR starttls_capability_mangled == true

      EMIT src, dst, resp_p, has_auth_or_data_in_cleartext'
  - technology: SIEM/Rule pseudocode
    query: 'alert when (smtp.auth OR smtp.mail_from) observed AND session.encrypted == false

      AND policy.requires_tls(dst) == true'
- question: Are encrypted messaging services being replaced by plaintext equivalents, or are TLS versions
    being negotiated below a host's known maximum, indicating downgrade drift or an active downgrade attack?
  context: Downgrade attacks defeat message hardening by forcing peers onto weaker or no encryption. Compare
    per-host messaging sessions over short windows and alert when encrypted service ports are swapped
    for plaintext equivalents to the same destination infrastructure, or when a ServerHello reduces the
    negotiated TLS version below the host's previously observed maximum. The TLS_FALLBACK_SCSV cipher
    value (0x5600) and inappropriate_fallback alert (86) from RFC 7507 are explicit signals that a client
    retried with a lower version, and SSL-strip/version-reduction artifacts indicate an on-path attacker.
    Repeated downgrade patterns should be treated as probable configuration drift or active downgrade
    attempts. Tie correlation windows to the per-host destination so legitimate fallbacks are distinguishable
    from systematic forcing.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days; correlate sessions within rolling 1-hour per-host windows
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR each (src,dst): window=1h

      IF prior_session.encrypted==true AND new_session.encrypted==false -> flag downgrade

      IF ssl.log version < max_observed_version[src,dst] -> flag version_reduction

      IF ssl.log cipher == 0x5600 (TLS_FALLBACK_SCSV) OR alert==inappropriate_fallback(86) -> flag'
  - technology: SIEM/Rule pseudocode
    query: alert when count(downgrade_events[src,dst]) >= 3 over 1h
- question: Which internal mail servers accept or offer obsolete protocol versions (SSLv2/SSLv3/TLS1.0/TLS1.1)
    or weak cipher suites (RC4/3DES/NULL/EXPORT/anonymous) on SMTP/IMAP/POP3?
  context: Hardened messaging requires modern protocols and strong ciphers. Inspect Zeek ssl.log version
    and cipher fields on SMTP/IMAP/POP3 connections and hard-alert on any internal server that negotiates
    SSLv2, SSLv3, TLS1.0, TLS1.1, or RC4/3DES/NULL/EXPORT/anonymous suites. Critically, mere acceptance
    or offering of SSLv2/SSLv3 is independently exploitable (DROWN), so flag offered-but-unselected legacy
    support, not only negotiated sessions — this typically requires active probing or capturing the server's
    full cipher list. A positive finding means an attacker could force a weak session or cross-protocol
    attack; a clean result confirms the server only supports strong, current cryptography.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FROM ssl.log WHERE service in [smtp,imap,pop3]

      WHERE version in [SSLv2,SSLv3,TLS1.0,TLS1.1]

      OR cipher matches /RC4|3DES|NULL|EXPORT|ADH|AECDH/

      EMIT server, version, cipher'
  - technology: SIEM/Rule pseudocode
    query: 'alert when server.offered_protocols intersects [SSLv2,SSLv3]

      (offered-but-unselected legacy = DROWN-exploitable)'
- question: Which internal mail servers presented certificates that failed validation — expired, self-signed,
    name-mismatched, or chaining to an untrusted CA — leaving encrypted sessions open to man-in-the-middle?
  context: Encryption without authentication is downgradeable to MITM, so message hardening depends on
    valid, trusted certificates. Alert on Zeek ssl.log validation_status != ok and on x509.log records
    showing expired, self-signed, name-mismatched, or untrusted-chain certificates on internal mail servers.
    A positive finding means a client could be talking to an impostor or an unverified endpoint even though
    the channel is encrypted — exactly the weakness that allows interception of supposedly protected mail.
    Investigate whether the failure is benign (lapsed renewal, internal CA not distributed) or evidence
    of an interception proxy. A clean result confirms the TLS endpoints are authenticated as well as encrypted.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'JOIN ssl.log WITH x509.log ON cert_chain_fuids

      WHERE ssl.validation_status != ''ok''

      OR x509.cert.not_valid_after < now

      OR x509.is_self_signed == true

      OR x509.san NOT matches server_name

      EMIT server, validation_status, cert_subject, issuer'
- question: Do domains expected to enforce transport encryption have valid enforce-mode MTA-STS and DANE/TLSA
    policies, and are any MTAs delivering in cleartext to destinations whose policy prohibits it?
  context: MTA-STS (RFC 8461) and DANE (RFC 7672) are the policy mechanisms that make SMTP transport encryption
    enforceable rather than opportunistic. Audit DNS/HTTPS for the relevant domains and alert on missing
    or testing-mode MTA-STS policies, MX-to-policy mismatches, and missing/invalid TLSA records or DNSSEC
    validation failures. Most importantly, alert when a sending MTA delivers in cleartext to a destination
    whose enforce-mode policy prohibits it — a direct policy violation that indicates either a bypass
    or an active downgrade. A positive result identifies domains where encryption is advisory-only or
    where enforcement is broken; a negative result confirms enforceable policy is published and honored.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR domain in protected_domains:\n  fetch _mta-sts TXT + https://mta-sts.<domain>/.well-known/mta-sts.txt\n\
      \  alert if policy.mode != 'enforce' OR policy.mx != actual_mx\n  fetch _25._tcp.<mx> TLSA; alert\
      \ if missing OR dnssec_invalid"
  - technology: Zeek/pseudocode
    query: 'FROM smtp.log JOIN ssl.log

      WHERE dst_domain in enforce_mode_domains AND tls==false

      EMIT src_mta, dst_domain -- cleartext delivery violating policy'
- question: Is the proportion of plaintext messaging sessions per business unit or mail gateway rising
    abnormally above its rolling baseline?
  context: Beyond individual sessions, message hardening posture is visible in aggregate ratios. Calculate
    daily encrypted-versus-unencrypted session ratios by business unit and mail gateway from Zeek conn.log/ssl.log.
    Alert when the plaintext proportion exceeds the 90th-95th percentile of a rolling 30-day baseline;
    derive the threshold per environment from observed distributions, recognizing that messaging-protocol
    encryption historically lags HTTPS. A spike in plaintext proportion can reveal a mass downgrade, a
    misconfigured/updated gateway, or systematic stripping affecting a unit. A stable or improving ratio
    indicates hardening is holding. This statistical view catches slow drift that per-session rules may
    not escalate.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM conn.log+ssl.log

      bucket by day, business_unit, gateway

      ratio = count(plaintext_sessions)/count(total_sessions)

      baseline = rolling_30d_distribution(ratio)

      alert when ratio > percentile(baseline, 95)'
- question: Are TLS negotiation failures (starttls-not-supported, certificate-expired, host-mismatch,
    validation-failure, dane-required, inappropriate_fallback) spiking for any MX or failure class above
    baseline?
  context: 'Negotiation failures are a first-class hardening signal, not just noise. Ingest SMTP TLS Reporting
    (RFC 8460) aggregate reports and Zeek failure events, and control-chart counts per failure type: starttls-not-supported,
    certificate-expired, certificate-host-mismatch, validation-failure, and dane-required. Alert when
    any failure class from many senders to one MX exceeds baseline, which can indicate a broken cert/policy
    rollout or an on-path device interfering with negotiation. Separately track the rate of inappropriate_fallback/SCSV
    events (RFC 7507) and offered legacy-cipher/version counts (motivated by DROWN) as their own series
    so downgrade pressure is distinguishable from ordinary cert lapses. Rising failures concentrated on
    one MX warrant urgent investigation.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ingest TLS-RPT aggregate reports + zeek_failure_events\nFOR each failure_type in [starttls-not-supported,\
      \ certificate-expired,\n  certificate-host-mismatch, validation-failure, dane-required]:\n  control_chart(count\
      \ by mx, day)\n  alert when count > UCL(baseline)\ntrack separate series: inappropriate_fallback/SCSV,\
      \ offered_legacy_cipher_count"
- question: Has the volume of encrypted messaging sessions dropped below its forecast confidence bound,
    suggesting a mass downgrade, outage, or policy regression?
  context: A sudden fall in encrypted session counts can signal a fleet-wide downgrade or a failed encryption
    service. Forecast expected encrypted session counts using ARIMA or Prophet on Zeek ssl.log trends
    and trigger when observed values fall below the lower confidence bound. Correlate any drop with certificate
    changes, policy changes, and service updates to prioritize root-cause analysis. A breach of the lower
    bound points to either an infrastructure problem disabling TLS or an adversary forcing plaintext at
    scale; a forecast within bounds indicates steady encrypted volume. This complements the ratio metric
    by catching absolute collapses even when proportions look stable.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days; train forecast on >=60 days of history
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = daily_count(ssl.log encrypted_messaging_sessions)

      model = ARIMA_or_Prophet(series, history=60d)

      forecast, lower_ci = model.predict()

      alert when observed < lower_ci

      enrich with cert_change/policy_change/service_update events'
- question: Which messaging TLS sessions are statistically anomalous given learned per-peer negotiation
    behavior, and what features (weak version, weak cipher, bad cert) drive the anomaly?
  context: Deterministic floors cannot anticipate every weak-transport pattern, so train unsupervised/self-supervised
    anomaly detection (contrastive ET-SSL, Isolation Forest, or autoencoder reconstruction error) on features
    including TLS version, cipher strength, certificate validity, destination reputation, flow shape,
    and plaintext-fallback frequency. The model learns normal per-peer negotiation distributions without
    needing to decrypt traffic. Run it in parallel to the deterministic detections and surface the top-3
    contributing features in each alert (e.g., negotiated TLS1.0, cipher RC4, validation_status=self-signed)
    so analysts can immediately remediate the weak path. High anomaly scores concentrated on sensitive
    mail flows are strong leads for an active downgrade or a newly weakened server.
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek smtp.log
  - Zeek x509.log
  - Mail gateway logs
  - SMTP TLS Reporting (TLS-RPT) aggregate reports
  - 'NAI: Enterprise email servers, network egress/ingress points, and internal network segments connecting
    client workstations to messaging services.'
  range: Last 90 days; retrain on rolling window
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [tls_version, cipher_strength, cert_validity, dst_reputation,\n            flow_shape,\
      \ plaintext_fallback_freq]\nmodel = IsolationForest_or_Autoencoder(features) trained per-peer\n\
      score = model.anomaly_score(session)\nalert when score > threshold; emit top3_contributing_features"
- question: Which inbound encrypted messages use S/MIME CBC or legacy OpenPGP CFB without a modern integrity
    mechanism (MDC/AEAD), the precondition for Efail ciphertext-gadget exfiltration?
  context: Message-body hardening requires authenticated encryption, not just confidentiality. Parse the
    MIME structure of inbound encrypted mail and alert on S/MIME CBC or legacy OpenPGP CFB messages that
    omit a modern integrity mechanism (MDC/AEAD). These malleable ciphertext modes are the exact precondition
    for the Efail ciphertext-gadget exfiltration attack, where an attacker tampers with ciphertext to
    make the client leak plaintext. A positive finding means a decrypting client could be coerced into
    exfiltrating message contents; it warrants quarantine and sender/path investigation. A negative result
    confirms inbound encrypted mail carries integrity protection and resists tampering.
  answer_sources:
  - Mail gateway logs
  - Mail content inspection (MIME structure)
  - Endpoint mail client configuration
  - S/MIME/PGP message metadata
  - 'NAI: Enterprise email servers, secure mail gateways, and endpoints running mail clients that decrypt
    S/MIME or OpenPGP content.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each inbound encrypted_mail:\n  parse MIME structure\n  if smime.cipher_mode == CBC AND\
      \ no_authenticated_attributes -> flag\n  if openpgp.mode == CFB AND lacks(MDC|AEAD) -> flag\n  emit\
      \ message_id, sender, structure"
- question: Do encrypted messages embed external HTML/CSS resource references (img src, url(), link href)
    that could form an Efail direct-exfiltration back-channel, and are clients blocking remote-content
    auto-loading?
  context: The Efail direct-exfiltration variant relies on the mail client fetching attacker-controlled
    remote resources to leak decrypted plaintext. Inspect decrypted/encrypted message bodies for external
    HTML/CSS resource references (img src, url(), link href) and verify that mail clients are configured
    to block remote-content auto-loading. A positive finding — an encrypted message containing remote
    references, especially combined with an integrity gap — is a strong indicator of a crafted exfiltration
    payload and should trigger quarantine and client-config review. Confirming that clients block remote
    content by default closes the back-channel even if such messages arrive.
  answer_sources:
  - Mail gateway logs
  - Mail content inspection (MIME structure)
  - Endpoint mail client configuration
  - S/MIME/PGP message metadata
  - 'NAI: Enterprise email servers, secure mail gateways, and endpoints running mail clients that decrypt
    S/MIME or OpenPGP content.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each encrypted_mail body:\n  if regex(/<img[^>]+src=|url\\(|<link[^>]+href=/, body)\n\
      \     AND content_encrypted == true -> flag remote_reference\nJOIN endpoint mail_client_config\n\
      \  alert if remote_content_autoload != blocked"
- question: What proportion of mailboxes/clients per business unit have S/MIME or PGP enabled and remote-content
    blocking enforced, and where has coverage fallen below baseline or policy minimums?
  context: Message hardening is only as strong as its deployment coverage. Baseline the proportion of
    mailboxes/clients with S/MIME or PGP enabled and remote-content blocking enforced per business unit,
    and alert when coverage drops below the 5th percentile of the rolling baseline or below policy minimums.
    Adoption of message encryption is historically low and uneven, so this metric catches units regressing
    or never onboarded. A coverage drop indicates configuration drift, a failed deployment, or shadow
    clients lacking protection and remote-content blocking — each expanding the Efail and plaintext attack
    surface. Stable, policy-compliant coverage confirms the hardening control is actually in force.
  answer_sources:
  - Mail gateway logs
  - Mail content inspection (MIME structure)
  - Endpoint mail client configuration
  - S/MIME/PGP message metadata
  - 'NAI: Enterprise email servers, secure mail gateways, and endpoints running mail clients that decrypt
    S/MIME or OpenPGP content.'
  range: Last 90 days; baseline over rolling window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM endpoint mail_client_config inventory\nFOR each business_unit:\n  coverage = count(smime_or_pgp_enabled\
      \ AND remote_block_enforced)/count(mailboxes)\n  alert when coverage < percentile(rolling_baseline,\
      \ 5) OR coverage < policy_min"
- question: Which encrypted messages have anomalous MIME structure (part counts, content-type nesting,
    missing integrity parts, remote-reference counts) resembling crafted Efail exfiltration payloads?
  context: Crafted Efail payloads manipulate MIME structure to bridge integrity gaps and remote references
    into an exfiltration channel. Train anomaly detection on MIME-structure and header features — part
    counts, content-type nesting depth, presence/absence of integrity parts, and remote-reference counts
    — to flag multipart messages resembling Efail exfiltration payloads. Run it alongside the deterministic
    MIME rules and surface the top-3 contributing features per alert (e.g., unusual nesting, missing MDC
    part, multiple remote references) to speed triage. A high-scoring message warrants quarantine and
    manual MIME review; a low score across inbound encrypted mail indicates normal, well-formed structure.
    This catches novel payload shapes the static rules may miss.
  answer_sources:
  - Mail gateway logs
  - Mail content inspection (MIME structure)
  - Endpoint mail client configuration
  - S/MIME/PGP message metadata
  - 'NAI: Enterprise email servers, secure mail gateways, and endpoints running mail clients that decrypt
    S/MIME or OpenPGP content.'
  range: Last 90 days; retrain on rolling window
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [mime_part_count, content_type_nesting_depth,\n            has_integrity_part,\
      \ remote_reference_count, header_anomalies]\nmodel = anomaly_detector(features)\nscore = model.score(message)\n\
      alert when score > threshold; emit top3_contributing_features"
