name: 'D3-DKE: Disk Erasure'
id: 7c3db436-66a5-4ca8-abdd-b639055619ba
description: This playbook helps an analyst verify and investigate disk erasure activity used as a data-sanitization
  and adversary-eviction countermeasure. It confirms that authorized disk erasure workflows started, completed,
  and transitioned the host into a verifiable post-erasure state, while distinguishing intentional, change-tracked
  sanitization from dual-use anti-forensics and destructive wiper activity that abuse the same primitives.
  It guides correlation of erase-tool execution with authorized incident/change identifiers, validation
  that the sanitization method is adequate for the media type (e.g., NIST Clear/Purge-class methods, ATA
  Secure Erase / NVMe Sanitize / Cryptographic Erase for flash), verification of the full erase lifecycle
  (start, success, reboot), and quantitative measurement of overwrite volume, throughput, duration, and
  retry/abort/verification-failure rates. It also covers discrimination of authorized erasure from raw
  \\.\PhysicalDrive block-level wiping (including BYOVD-enabled wipers) and predictive identification
  of high-risk erasure failures so analysts can prioritize verifiable Purge or physical Destroy.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did the observed erasure-tool execution originate from an approved sanitization utility AND
    can it be linked to an authorized incident-response or change-management identifier on a designated
    asset?
  context: As part of the Evict tactic, secure disk erasure is only legitimate eviction when it is intentional
    and authorized. Detect Windows 4688 / Sysmon EID 1 process launches for approved erasure utilities
    (cipher.exe with /w; sdelete/sdelete64 with -p/-z/-c/-s; format; diskpart 'clean all'), capture the
    full command line and parent-process lineage, and REQUIRE linkage to an authorized incident/change
    ID before classifying the action as deliberate eviction. These same tools are dual-use anti-forensics
    (T1070.004), so an invocation that is not tied to a sanctioned change, or that runs on an unexpected
    host, is suspicious destructive/anti-forensic activity rather than eviction. A positive result (approved
    tool + authorized change ID + designated asset) confirms intentional sanitization; an unlinked invocation
    should escalate as a potential adversary clearing tracks.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 1074
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - 'NAI: Designated endpoint and server assets requiring sanitization as part of an incident response.'
  range: Last 90 days (correlate within the incident/change window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID IN (4688) OR (source=sysmon AND EventID=1)

      | where lower(process_name) IN (''cipher.exe'',''sdelete.exe'',''sdelete64.exe'',''format.com'',''diskpart.exe'')

      | where command_line MATCHES ''/w|-p |-z|-c|-s|clean all''

      | lookup authorized_change_tickets host AS asset OUTPUT change_id, approved_window

      | eval intentional = (change_id != null AND asset IN designated_assets AND _time WITHIN approved_window)

      | where intentional = false  /* alert: unlinked / unexpected-host erase = anti-forensics */'
- question: Is the sanitization method that was used actually adequate to render data unrecoverable for
    the specific media type (magnetic HDD vs. SSD/flash)?
  context: Within Evict, eviction is only achieved if data is genuinely unrecoverable. Treat quick/standard
    'format' or simple file deletion as INCOMPLETE sanitization because they do not erase recoverable
    data. Require a NIST SP 800-88 Clear/Purge-class method appropriate to the media. For SSD/flash assets,
    require a verifiable built-in Purge (ATA Secure Erase / NVMe Sanitize / Cryptographic Erase) rather
    than software file-overwrite, which fails on flash due to wear-leveling and FTL remapping. When Cryptographic
    Erase cannot be verified, it must be combined with overwrite or physical destruction. A positive result
    confirms a media-appropriate verifiable method; a negative result (format/delete on any media, or
    software overwrite on flash) means recoverable data may remain and eviction is NOT complete.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 1074
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - 'NAI: Designated endpoint and server assets requiring sanitization as part of an incident response.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "erase_events\n| eval media = lookup_media_type(device_id)  /* HDD | SSD/flash */\n| eval method\
      \ = classify(command_line)  /* format-quick | file-delete | overwrite | ata-secure-erase | nvme-sanitize\
      \ | crypto-erase */\n| eval adequate = case(\n    method IN ('format-quick','file-delete'), false,\n\
      \    media='SSD/flash' AND method='overwrite', false,\n    media='SSD/flash' AND method IN ('ata-secure-erase','nvme-sanitize','crypto-erase'),\
      \ true,\n    media='HDD' AND method='overwrite', true,\n    default false)\n| where adequate = false\
      \  /* alert: inadequate sanitization for media type */"
- question: Did each erasure that started actually complete its full lifecycle (process start -> successful
    exit -> expected shutdown/restart) within the platform-specific time envelope, with a completion record
    / Certificate of Sanitization?
  context: For Evict, an interrupted erase leaves recoverable data and a falsely 'evicted' host. Correlate
    the erase process start (4688) -> process exit with a success status (4689) -> the expected shutdown/restart
    marker recording the initiating process (Event ID 1074). Alert on any erase start that lacks a matching
    4689 success and/or a 1074 transition within the platform-specific time envelope, which indicates
    interrupted or incomplete sanitization. A per-method completion record / Certificate of Sanitization
    (NIST SP 800-88 App. G) should accompany a true completion. A positive result is a fully linked start->success->reboot
    chain; a missing link signals incomplete eviction requiring re-run or escalation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 1074
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - 'NAI: Designated endpoint and server assets requiring sanitization as part of an incident response.'
  range: 'Last 90 days (event-centered: window each start with its expected completion envelope)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: '(EventID=4688 process IN erase_tools) OR EventID=4689 OR EventID=1074

      | transaction host, erase_session startswith=4688 endswith=1074 maxspan=platform_envelope

      | eval has_success_exit = match(events,''4689 status=success'')

      | eval has_reboot = match(events,''1074 initiating_process IN erase_tools'')

      | where has_success_exit=false OR has_reboot=false  /* alert: incomplete erase lifecycle */'
- question: Did the total bytes written during the erase meet or exceed the device capacity expected for
    the configured number of overwrite passes?
  context: For Evict verification, a complete single-pass overwrite must write at least 1x the visible
    device capacity (and >=Nx for N configured passes). Compute total bytes written during the erase (raw
    \\.\PhysicalDrive write counters / Sysmon RawAccessRead-adjacent write telemetry) divided by visible
    device capacity, and flag any run whose written-byte ratio falls materially below the expected pass
    count as incomplete. On modern HDDs a single pass suffices per NIST 800-88. A positive result (ratio
    >= expected passes) supports a complete overwrite; a low ratio indicates the overwrite was truncated/aborted
    and the disk is not fully sanitized.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 1074
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - 'NAI: Designated endpoint and server assets requiring sanitization as part of an incident response.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=sysmon (EventID=9 OR write_telemetry) device=PhysicalDrive*

      | stats sum(bytes_written) AS total_written by host, device, erase_session

      | eval capacity = lookup_capacity(device), passes = configured_passes(erase_session)

      | eval ratio = total_written / capacity

      | where ratio < (passes * 0.98)  /* alert: overwrite volume below expected pass count */'
- question: Is the erase taking abnormally long, or has its write throughput stalled, relative to the
    per-cohort baseline for this hardware class?
  context: Under Evict, stalled erasures delay containment and may indicate failing hardware or an interrupted
    process. Calculate time-to-completion and effective MB/s from erase start to completion/reboot across
    hardware classes (SSD/HDD, server/workstation) and track mean, median, and 95th percentile to identify
    stalled workflows; derive a per-cohort stall threshold as capacity / observed-throughput baseline.
    Detect the abrupt rise in write rate at start and the flatline at completion with change-point methods
    (CUSUM/PELT/BOCPD) for low-false-positive stall detection. A positive (within baseline) result indicates
    healthy progress; a duration beyond the cohort threshold or a premature flatline indicates a stall
    needing intervention.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 1074
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - 'NAI: Designated endpoint and server assets requiring sanitization as part of an incident response.'
  range: Last 90 days (compute per-cohort baselines; alert on outliers)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'erase_write_timeseries

      | eval cohort = media_class . ''/'' . host_role

      | streamstats by cohort | apply changepoint(write_rate) AS cp  /* CUSUM/PELT/BOCPD */

      | eval throughput_mbs = total_written / duration_s

      | eventstats p50(duration_s) p95(duration_s) median(throughput_mbs) by cohort

      | where duration_s > p95_duration OR (cp=''flatline'' AND ratio<expected) /* alert: stalled erase
      */'
- question: What are the retry, abort, and verification-failure rates by erasure tool and asset class,
    and are any post-erase verification samples returning non-zero data or hardware error signals?
  context: 'For reliable Evict, verification failures mean data may persist despite a ''success'' report.
    Compute rolling percentages of successful first-pass erasures, retries, and aborts by erasure tool
    and endpoint profile, and explicitly profile FAILURE signals as distinct: non-zero bytes in post-erase
    verification samples, ATA/NVMe sanitize error status, and growth in reallocated/pending/uncorrectable
    sectors. Verify results by reading a pseudorandom subset of blocks including first/last/reallocated
    areas (NIST SP 800-88 §4.7); built-in SSD sanitize commands are sometimes mis-implemented and report
    false success. A positive result is zeroed verification samples and clean SMART; non-zero samples
    or sanitize errors mean the eviction failed and the media should be re-purged or destroyed.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 1074
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - 'NAI: Designated endpoint and server assets requiring sanitization as part of an incident response.'
  range: Last 90 days (rolling rates by tool/asset class)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "erase_outcomes\n| stats count(eval(result='success_firstpass')) AS ok, count(eval(result='retry'))\
      \ AS retries,\n        count(eval(result='abort')) AS aborts, count AS total by tool, asset_class\n\
      | eval abort_rate = aborts/total, retry_rate = retries/total\n| join host [search verify_samples\
      \ nonzero_bytes>0 OR sanitize_status='error' OR delta_reallocated_sectors>0]\n| where abort_rate>baseline\
      \ OR nonzero_bytes>0 OR sanitize_status='error' /* alert: verification failure */"
- question: Which drives are at high risk of erasure failure BEFORE execution, based on SMART attributes
    and execution context, so we can pre-emptively choose verifiable Purge or physical Destroy?
  context: To strengthen Evict, predict failures proactively. Train a supervised, interpretable classifier
    (explainable boosting / GAM / rule list, or regularized GBDT/random forest) on historical erase outcomes
    using SMART attributes (reallocated/pending/uncorrectable sector counts), drive model/firmware, tool/method,
    and execution context to estimate failure probability and prioritize pre-emptive verifiable Purge
    or physical Destroy. SMART change-point features are predictive of drive replacement; accuracy drifts
    across fleets so retrain per fleet with dataset-specific thresholds. Use interpretable models so each
    alert surfaces its top-3 contributing features (e.g., reallocated-sector count, drive model, prior
    abort) rather than a bare score. Run this in PARALLEL with the deterministic completion/verification
    logic, never replacing it. A high predicted-risk score flags a drive for destroy-first handling.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 1074
  - Sysmon Event ID 1 (Process Create)
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 11 (FileCreate)
  - 'NAI: Designated endpoint and server assets requiring sanitization as part of an incident response.'
  range: Last 365 days (training history); score at scheduling time
  queries:
  - technology: ML/pseudocode
    query: "features = [reallocated_sectors, pending_sectors, uncorrectable_sectors,\n            drive_model,\
      \ firmware, tool_method, prior_abort_count, smart_changepoints]\nmodel = ExplainableBoosting().fit(history.features,\
      \ history.erase_failed)  # interpretable\nscore, top3 = model.predict_proba_with_attribution(candidate_drive)\n\
      if score >= fleet_threshold: route -> verifiable_purge_or_physical_destroy(reason=top3)\n# run alongside\
      \ deterministic verification; retrain per-fleet to counter drift"
- question: Do raw \\.\PhysicalDrive / DeviceIoControl block-level writes originate from an approved erase
    tool on a designated asset linked to an authorized change ID, or do they accompany an unexpected kernel
    service/driver load (potential BYOVD wiper)?
  context: Within Evict, authorized full-device erasure and destructive wiper malware use the SAME low-level
    primitives, so discrimination is critical. Detect raw \\.\PhysicalDrive / DeviceIoControl IOCTL block-level
    writes and require they originate from an approved erase tool on a designated asset linked to an authorized
    change ID. Because wipers commonly use signed-but-vulnerable drivers (BYOVD), treat an unlinked raw
    overwrite, an unexpected kernel service/driver load (EID 7045 / EID 6) immediately preceding raw writes,
    or raw-write activity on a non-scheduled host as destructive activity rather than eviction. A positive
    (approved tool + change ID + designated asset) confirms sanitization; a raw write preceded by a suspicious
    driver load on an unplanned host should escalate as a wiper.
  answer_sources:
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 1 (Process Create)
  - Windows Event ID 7045 (Service Install)
  - Windows Event ID 6 (Driver Load)
  - 'NAI: Designated endpoint and server assets undergoing sanitization, and any host issuing raw \\.\PhysicalDrive
    writes.'
  range: Last 90 days (correlate driver/service load minutes before raw writes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(source=sysmon EventID=9 path=''\\.\PhysicalDrive*'' write=true) OR (EventID=1 ioctl_rawwrite=true)

      | lookup authorized_change_tickets host OUTPUT change_id

      | join type=left host [search EventID IN (7045,6) signed_driver=true WITHIN -10m]

      | eval wiper_suspect = (change_id=null OR host NOT IN designated_assets OR driver_load_recent=true)

      | where wiper_suspect = true  /* alert: destructive raw-disk wipe / BYOVD, not eviction */'
- question: Does the raw-write byte volume and writes-per-minute match the planned device capacity and
    method throughput for an authorized full-disk erase, or does it deviate as a partial/aborted or off-plan
    burst?
  context: For Evict, quantitative profiling separates a sanctioned full-disk erase from anomalous destructive
    bursts. Track raw-write byte volume and writes/min and compare against the planned device capacity
    and method throughput; an authorized full-disk erase writes ~1x-Nx capacity at a steady, sustained
    rate, whereas a partial/aborted or off-plan burst deviates from the expected envelope. Use change-point
    detection to catch abrupt unscheduled onset. A positive result (sustained ~1x-Nx-capacity write matching
    the plan) supports authorized erasure; a short high-rate burst, a volume far below capacity, or an
    onset outside the scheduled window indicates off-plan destructive or incomplete activity.
  answer_sources:
  - Sysmon Event ID 9 (RawAccessRead)
  - Sysmon Event ID 1 (Process Create)
  - Windows Event ID 7045 (Service Install)
  - Windows Event ID 6 (Driver Load)
  - 'NAI: Designated endpoint and server assets undergoing sanitization, and any host issuing raw \\.\PhysicalDrive
    writes.'
  range: Last 90 days (event-centered around raw-write onset)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'raw_write_events device=PhysicalDrive*

      | bin _time span=1m | stats sum(bytes) AS bpm by host, device, _time

      | eval capacity = lookup_capacity(device), expected_rate = method_throughput(device)

      | apply changepoint(bpm) AS onset

      | stats sum(bpm) AS total_written, avg(bpm) AS rate, min(onset_time) AS start by host, device

      | eval ratio = total_written/capacity

      | where ratio<0.98 OR rate NOT BETWEEN(0.5*expected_rate,2*expected_rate) OR start NOT IN scheduled_window'
