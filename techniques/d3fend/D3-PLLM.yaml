name: 'D3-PLLM: Passive Logical Link Mapping'
id: 706f9cb7-a571-42d8-88bc-db764a11b90a
description: This playbook helps an analyst investigate the network's logical data-flow fabric built entirely
  from passively observed traffic, with no active probing. Passive flow telemetry captures recurring logical
  communications between assets, letting you construct a graph of expected service relationships and expose
  newly emerged or structurally abnormal links that may represent unauthorized pathways or lateral movement.
  It further uses connection-state and failure telemetry per logical link to distinguish successfully
  established flows from rejected, reset, or blocked attempts, surfacing failure-mode signals (horizontal/vertical
  scanning, blocked policy traffic, probing) that complement volume-based link mapping. Use it to baseline
  normal adjacency, flag first-seen or policy-forbidden edges, classify and gate high-risk link types
  (SMB admin-share writes, DCE-RPC remote service control, remote task scheduling), detect cross-community
  bridges, and score links with statistical, graph, and machine-learning methods.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which logical links between assets are active today, and what does the daily adjacency inventory
    of (source, destination, protocol, destination port) tuples look like compared to prior days?
  context: 'Under the Model tactic, the foundation of passive logical link mapping is a complete, recurring
    inventory of who talks to whom over what service. Generate daily adjacency lists from Zeek conn.log
    and Windows Event ID 5156 (Windows Filtering Platform permitted connections) keyed on (source, destination,
    protocol, destination port). Each per-host (src, dst, dport) tuple is treated as a transport-layer
    graphlet signature that is recoverable from flow data alone with no payload inspection or port assumptions
    (BLINC). This inventory is the substrate every other analytic builds on: a stable daily baseline of
    expected service relationships. A new or shifting set of tuples is the first hint of an unauthorized
    pathway; an unchanged inventory is the expected, benign steady state.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn, win_5156

      | WHERE date = today

      | STATS count() BY src_ip, dst_ip, proto, dst_port

      | EVAL link = src_ip + ''->'' + dst_ip + ''/'' + proto + ''/'' + dst_port

      | OUTPUT daily_adjacency_list  // graphlet signature per (src,dst,dport)'
- question: Are there any first-seen logical links, or links that are explicitly forbidden by the approved
    network architecture, appearing between zones?
  context: This is the deterministic floor of the playbook and must run regardless of any statistical
    or ML scoring. Diff each observed (source, destination, protocol, destination port) link against an
    approved-architecture allowlist and alert on links that are brand new or explicitly disallowed between
    security zones. First-seen-edge alerting is grounded on (user, src, dst) and host-host rarity, as
    in enterprise authentication-graph research. A previously-unseen edge between two hosts — especially
    one crossing a zone boundary — is a high-confidence indicator of newly established attacker infrastructure,
    lateral movement, or misconfiguration. A link already on the allowlist is expected; an unknown or
    forbidden link warrants immediate triage.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM daily_adjacency_list

      | LOOKUP approved_architecture_allowlist BY (zone_src, zone_dst, proto, dst_port)

      | WHERE link NOT IN historical_links OR allowlist_status = ''forbidden''

      | ALERT ''first-seen or policy-forbidden link'' WITH src_ip, dst_ip, proto, dst_port, user'
- question: Do any high-risk link types — SMB admin-share writes, DCE-RPC remote service control, or remote
    task scheduling — appear between hosts that were previously unconnected?
  context: 'Some logical link types are inherently associated with lateral movement and remote execution
    regardless of volume. Apply BZAR-style signature rules to classify high-risk link types such as SMB
    administrative-share writes, DCE-RPC remote service control (svcctl), and remote task scheduling (atsvc/taskscheduler).
    Treat the appearance of these link types between previously-unconnected hosts as a high-value filter
    that runs before further scoring, following the symbolic-filter-then-rank pattern of Latte. Under
    the Model tactic this both enriches the link inventory with risk labels and provides an early, deterministic
    tripwire: a new admin-share write or remote service-control call between two endpoints that never
    interacted is a strong lateral-movement signal.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// BZAR-style high-risk link classification\nWHEN smb.action='admin_share_write' OR dce_rpc.endpoint\
      \ IN ('svcctl','atsvc','taskscheduler')\n  AND (src_ip,dst_ip) NOT IN historical_links\nTHEN ALERT\
      \ 'high-risk link between previously-unconnected hosts'\n  WITH src_ip, dst_ip, link_type"
- question: Are there logical links that bridge otherwise-separate service communities, such as a workstation
    directly reaching a database enclave it shares no community with?
  context: After assigning hosts to service communities (clusters of densely interconnected assets), alert
    on links that bridge two otherwise-separate communities. This is motivated by community-graph attack
    reconstruction (HERCULE), where attack paths characteristically cut across the natural community structure
    of benign traffic. A workstation that suddenly reaches a database enclave with which it shares no
    community membership is a structurally anomalous bridge — exactly the kind of edge an attacker creates
    while pivoting toward sensitive data. Benign traffic tends to stay within established communities;
    a cross-community bridge is a defensible, structure-based anomaly worth investigating.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM daily_adjacency_list

      | COMMUNITY_DETECT graph(src_ip, dst_ip) -> community_id

      | WHERE community(src_ip) != community(dst_ip)

      | ALERT ''cross-community bridge link'' WITH src_ip, dst_ip, src_community, dst_community'
- question: For each logical link, how does its current communication strength — byte volume, byte ratio,
    connection frequency, periodicity, and active-hour distribution — compare to its own 30-day history?
  context: 'Each link has a characteristic ''strength'' profile. Compute rolling per-link metrics: bytes
    sent/received and byte ratio (Volume); connections per minute and inter-arrival periodicity via Fourier/DFFT
    analysis (Frequency); and the distribution of active hours. Flag links that exceed the 99th percentile
    of their own history, deriving thresholds per dataset from 30-day baselines (RITA; single-flow time-series
    feature work). Under the Model tactic this characterizes the normal behavior of every edge so that
    a benign link operating within its envelope is ignored, while a link suddenly carrying far more data,
    beaconing on a fixed period, or active at unusual hours is surfaced for review. Periodicity in particular
    can reveal automated beaconing/C2 over an otherwise-known link.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn BY link=(src_ip,dst_ip,proto,dst_port)

      | STATS bytes_out, bytes_in, byte_ratio, conn_per_min, dfft_periodicity, active_hours OVER 30d

      | WHERE bytes > p99(link.history) OR conn_per_min > p99(link.history) OR strong_periodicity

      | ALERT ''link communication-strength anomaly'''
- question: Which hosts or services show fan-out/fan-in communication entropy that departs from their
    established behavioral profile?
  context: Baseline the normal communication structure of each end host and service using relative-uncertainty
    (entropy) clustering and dominant-state modeling over the (srcIP, dstIP, srcPort, dstPort) feature
    space (Profiling Internet Backbone Traffic). The idea is that a server normally exhibits a stable
    distribution of who connects to it and on what ports — low or characteristic entropy — and a client
    likewise has a typical fan-out. Flag hosts whose fan-out or fan-in entropy departs from their own
    profile. A spike in destination entropy from one source suggests scanning or sweeping; a change in
    a server's source-entropy may indicate it is being reached by unexpected clients. Entropy stability
    is the benign case; a profile departure is the investigable anomaly.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn BY host\n| STATS entropy(dst_ip) AS fanout_H, entropy(src_ip) AS fanin_H,\n\
      \        entropy(dst_port) AS port_H OVER baseline_window\n| WHERE abs(fanout_H - profile.fanout_H)\
      \ > k*sigma OR abs(fanin_H - profile.fanin_H) > k*sigma\n| ALERT 'host communication-entropy departure'"
- question: Is the network topology drifting over time in a statistically significant way — measured by
    daily counts of new links, removed links, and cross-zone edges?
  context: Beyond individual links, the shape of the whole graph evolves. Track per-day counts of new
    links, removed links, and cross-zone edges, then apply two-stage per-edge counting-process change
    detection with anomalous-subgraph aggregation (Bayesian anomaly detection for social networks). Alert
    on statistically significant structural change versus historical baselines rather than relying on
    fixed thresholds alone. Under the Model tactic this answers whether the network is quietly reorganizing
    in ways that single-edge analytics miss — for example a coordinated burst of new cross-zone edges
    that individually look minor but collectively represent a campaign. Gradual, expected churn is benign;
    a significant deviation in the change-process is the signal.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM daily_adjacency_list

      | STATS new_links, removed_links, cross_zone_edges BY day

      | CHANGE_DETECT counting_process(per_edge) + anomalous_subgraph_aggregation

      | WHERE structural_change_pvalue < 0.01

      | ALERT ''statistically significant topology drift'''
- question: When scored against learned service communities using graph and temporal link-prediction models,
    which observed edges are low-probability (rare or newly emerged)?
  context: 'Learn unsupervised graph neural network (GNN) node embeddings of normal communication and
    score each observed edge''s likelihood, flagging rare or new edges as anomalous (CyberGraph). Add
    recurrent temporal link prediction over time-sliced graphs so that newly-emerged links score as low-probability
    at their timestep (Euler). This is the ML-driven complement to the deterministic first-seen rule:
    it captures edges that are not strictly new but are improbable given the host''s learned role and
    the time of day. Every alert must list the top-3 contributing features (e.g., new destination, rare
    port, off-hours) so analysts can triage. A high-probability edge is consistent with the learned model;
    a low-probability edge — especially one that links to lateral-movement risk types — is prioritized.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// Unsupervised GNN + temporal link prediction\nMODEL gnn_embeddings = train(normal_comm_graph)\n\
      MODEL euler = train(time_sliced_graphs)\nFOR edge IN observed_edges:\n  p = min(gnn_edge_likelihood(edge),\
      \ euler_link_pred(edge, t))\n  IF p < threshold: ALERT edge WITH top3_features(new_dst, rare_port,\
      \ off_hours)"
- question: Which logical links are flagged as anomalous by an unsupervised ensemble (PCA residuals, k-means
    distance, MAD) and a parallel Isolation Forest over engineered link features?
  context: 'Run an unsupervised ensemble — PCA reconstruction residuals, distance-to-nearest k-means centroid,
    and Median Absolute Deviation — over Host Communication Graph features (Bohara et al.), alongside
    a parallel Isolation Forest scorer over engineered per-link Volume/Frequency/State features. Combining
    diverse detectors reduces single-model blind spots and false positives. Surface per-feature attribution
    (top-3 features) in every alert for triage. Under the Model tactic this provides a robust, model-agnostic
    anomaly score for each link in the inventory: links that all detectors agree are normal are deprioritized,
    while links flagged by multiple methods, with clear feature attribution, are escalated.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network sensor tap points, such as core switches, internet gateways, and segment boundaries
    for critical server enclaves.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// Ensemble + Isolation Forest over Host Communication Graph features\nfeat = per_link_features(volume,\
      \ frequency, state)\nscore_ens = combine(pca_residual(feat), kmeans_dist(feat), mad(feat))\nscore_if\
      \  = isolation_forest(feat)\nIF score_ens > t1 OR score_if > t2:\n  ALERT link WITH top3_contributing_features"
- question: For each logical link, what is the ratio of failed-to-successful connection attempts, and
    does any link's failure ratio or absolute blocked-connection count exceed its historical 99th percentile?
  context: Connection failures are signal, not noise. For each logical link compute the ratio of failed-to-successful
    flows using Zeek conn_state (S0/REJ/RSTO/RSTR versus SF) and Windows Event ID 5157 (Windows Filtering
    Platform blocked connections) counts. Baseline the normal failure rate per link and alert when a link's
    failure ratio or absolute blocked-connection count exceeds its historical 99th percentile (state-aware
    flow profiling, Profiling Internet Backbone Traffic). Under the Model tactic this distinguishes healthy
    established flows from rejected, reset, or blocked attempts that indicate scanning or policy probing.
    A link with its usual small failure rate is benign; a sudden surge of resets or blocked connections
    on an edge is an investigable probing or misconfiguration signal.
  answer_sources:
  - Zeek conn.log (conn_state)
  - Windows Event ID 5157
  - NetFlow
  - 'NAI: Segment boundaries, host-based filtering platforms, and firewall logging points where blocked
    and reset connections are recorded.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn, win_5157 BY link=(src_ip,dst_ip,proto,dst_port)

      | EVAL failed = conn_state IN (''S0'',''REJ'',''RSTO'',''RSTR'') OR win5157_blocked

      | STATS fail_ratio = failed/total, blocked_count OVER history

      | WHERE fail_ratio > p99(link.history) OR blocked_count > p99(link.history)

      | ALERT ''link failure/blocked-state anomaly'''
- question: Is any single source generating an abnormally high rate of half-open or rejected connections
    to many distinct destinations or ports, indicating fan-out scanning?
  context: 'Horizontal and vertical scanning produce a distinctive flow graphlet: one source emitting
    many half-open (S0) or rejected (REJ) connections across distinct destinations or ports. Alert when
    a single source exceeds a tuned, per-environment threshold (for example, more than 20 such connections
    per minute) of S0/REJ attempts to distinct destinations or ports — a deterministic graphlet of scanning
    identifiable from flow records alone (BLINC) and labeled against expected service roles (BZAR). This
    is a deterministic detection that complements the statistical failure-ratio profiling: where one finds
    links that fail more than usual, this finds the actor whose behavior is the scan. Normal hosts contact
    a bounded set of services; a fan-out burst of failed connections is a high-confidence reconnaissance
    indicator.'
  answer_sources:
  - Zeek conn.log (conn_state)
  - Windows Event ID 5157
  - NetFlow
  - 'NAI: Segment boundaries, host-based filtering platforms, and firewall logging points where blocked
    and reset connections are recorded.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '// Fan-out scan graphlet

      WINDOW 1min BY src_ip

      | COUNT(conn_state IN (''S0'',''REJ'') AND distinct(dst_ip,dst_port)) AS halfopen

      | WHERE halfopen > tuned_threshold (e.g., 20)

      | LOOKUP expected_service_role(src_ip)

      | ALERT ''fan-out scanning'' WITH src_ip, distinct_dst, distinct_port'
- question: When per-link feature vectors combining Volume, Frequency, and State (failure ratio, blocked
    count) are scored by Isolation Forest and a PCA/k-means/MAD ensemble, which links are anomalous and
    what drove the score?
  context: 'This unifies volume, frequency, and connection-state telemetry into a single anomaly judgment.
    Feed per-link feature vectors combining Volume (bytes, byte ratio), Frequency (connections/min, periodicity),
    and State (failure ratio, blocked count) into an Isolation Forest and the PCA/k-means/MAD ensemble
    (Bohara et al.). Emit the top-3 contributing features in alert text so analysts can see whether failure
    rate, volume, or fan-out drove the score. Under the Model tactic this is the state-aware counterpart
    to the volume-only ensemble: a link that looks normal on volume but anomalous on failure/blocked counts
    will still be caught. Links scored normal across detectors are benign; links flagged with clear state-driven
    attribution are escalated for triage.'
  answer_sources:
  - Zeek conn.log (conn_state)
  - Windows Event ID 5157
  - NetFlow
  - 'NAI: Segment boundaries, host-based filtering platforms, and firewall logging points where blocked
    and reset connections are recorded.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feat = per_link_vector(volume[bytes,byte_ratio], frequency[conn_min,periodicity], state[fail_ratio,blocked])\n\
      score_if  = isolation_forest(feat)\nscore_ens = combine(pca_residual(feat), kmeans_dist(feat), mad(feat))\n\
      IF score_if > t1 OR score_ens > t2:\n  ALERT link WITH top3_contributing_features  // failure rate\
      \ vs volume vs fan-out"
