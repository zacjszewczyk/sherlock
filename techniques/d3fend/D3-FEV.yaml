questions:
- question: Was a deletion command (Remove-Item, del, erase, sdelete, rm) that explicitly references the
    malicious file path or hash executed by approved security tooling or an authorized administrator,
    rather than by an unexpected process?
  context: 'In the Evict tactic the first proof of action is that a deletion was actually attempted against
    the right artifact. Query process-creation telemetry (Windows Event ID 4688 and Sysmon Event ID 1)
    for deletion-capable commands whose command line references the target path or hash. Allowlist by
    parent image and account so that only commands launched by approved EDR/AV tooling or named administrators
    count as a valid eviction attempt. A delete of the same path issued by any other process is suspicious
    — it may be an adversary tampering with evidence or a benign-but-uncontrolled removal that bypasses
    the eviction workflow. A positive, allowlisted match confirms the eviction was initiated; absence
    means the planned eviction never ran and must be escalated. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search EventID IN (4688, SysmonID=1) AND CommandLine MATCHES /(Remove-Item|del|erase|sdelete|rm)/i
      AND CommandLine CONTAINS target_path OR target_hash

      | eval valid = (ParentImage IN approved_tools) OR (Account IN admin_allowlist)

      | where valid=true -> mark eviction_attempted ; where valid=false -> alert suspicious_deletion'
- question: Is there a successful delete event (Sysmon Event ID 23/26 FileDelete, or Windows Event ID
    4663 delete access / 4660 object deleted) matching the target path and hash, with no re-creation of
    the file during the validation period?
  context: 'A deletion command being launched is not the same as the file being gone. Correlate the eviction
    command with a successful delete signal on the same path/hash and require State=success. Then confirm
    absence: no FileCreate of the same path or known-bad hash for a defined validation window. Per NIST
    SP 800-83, follow up with a rescan to confirm a known-good state. A confirmed delete plus a quiet
    validation window marks the eviction complete; a missing delete event, a failure state, or a re-creation
    means the file may persist or the eradication failed. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (SysmonID IN (23,26) FileDelete) OR (EventID=4663 AccessMask=DELETE) OR (EventID=4660)

      | where TargetFilename==target_path AND Hash==target_hash AND State==success

      | join eviction_command on path

      | check NOT exists(FileCreate path==target_path within validation_window) -> eviction_complete'
- question: Did the AV/EDR perform a successful cleaning action (Quarantine/Remove/Clean) for the threat,
    and is the threat no longer reported as Active or Failed in first-party telemetry?
  context: 'When eviction is driven by AV/EDR rather than a manual command, confirm the cleaning action
    in first-party telemetry: Microsoft Defender Action center status (Pending/Success/Failed) and Get-MpThreat
    / Get-MpThreatDetection CleaningActionID (Quarantine/Remove/Clean) with RemediationTime. A ThreatID
    still showing ''Active'', or a status of ''Failed'', means the eviction is incomplete and requires
    escalation — the malicious file may still be executable on the host. A Success status with a recorded
    RemediationTime confirms the tooling removed or quarantined the artifact. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search source IN (DefenderActionCenter, MpThreatDetection)

      | eval clean = CleaningActionID IN (Quarantine,Remove,Clean) AND Status==Success AND RemediationTime!=null

      | where ThreatStatus==Active OR Status==Failed -> alert incomplete_eviction

      | where clean=true -> mark av_eviction_confirmed'
- question: Where policy requires the artifact be unrecoverable, was a secure-deletion/overwrite path
    used (e.g., SDelete rename-then-overwrite) rather than a simple logical unlink, and was the destruction
    verified?
  context: 'A logical delete (unlink) often leaves recoverable data on disk. Where policy mandates unrecoverability,
    confirm an overwrite/secure-deletion pattern — for example, the SDelete rename-then-overwrite behavior
    visible over Sysmon Event ID 23/26 (matching the SigmaHQ SDelete file-deletion rule) — and apply the
    NIST SP 800-88 sample-and-confirm verification mandate. On SSD/flash media, treat single-overwrite
    as insufficient because of remanence (Wei et al., Gutmann) and prefer device secure-erase or full-disk
    encryption. A positive result is evidence of verified destruction; absence of an overwrite pattern
    on a policy-controlled artifact means residual recoverability risk remains. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search SysmonID IN (23,26)

      | detect sdelete_pattern = sequence(rename target_path -> overwrite -> delete)

      | where media_type==SSD AND single_overwrite_only -> flag insufficient_wipe (require secure-erase/FDE)

      | verify sample_and_confirm(target_path) per NIST_800-88'
- question: After a confirmed delete, did a Sysmon FileCreate (Event ID 11) or write (Event ID 4663) re-create
    the same path or known-bad hash within the verification window?
  context: 'Reappearance of a deleted artifact is a deterministic reinfection / failed-eradication signal
    (NIST SP 800-83). After a confirmed delete, watch the same path and known-bad hash for any FileCreate
    or write event during the verification window. A re-creation indicates either an active persistence
    mechanism restoring the file or a re-compromise of the host, and means eradication is not complete.
    No re-creation across the verification window supports closing the eviction as successful. (Tactic:
    Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (SysmonID=11 FileCreate) OR (EventID=4663 write/create)

      | where (TargetFilename==deleted_path OR Hash==known_bad_hash) AND timestamp WITHIN verification_window
      AFTER confirmed_delete

      | alert reinfection_failed_eradication'
- question: What is the mean and 95th-percentile time from eviction request to confirmed delete per host
    class and tooling path, and is any value breaching the upper control limit?
  context: 'Per NIST SP 800-61 metrics guidance, measure eviction latency (request to confirmed delete)
    and track it on Shewhart control charts with a center line and +/-3 sigma limits, derived from at
    least 20-30 baseline evictions per host class. Compute mean and 95th-percentile latency per host class
    and tooling path. A latency that breaches the upper control limit, or a run/trend rule firing, indicates
    special-cause degradation in the eviction workflow (e.g., a tool path failing or queuing). Stable
    latency within limits indicates a healthy eviction capability. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats by host_class, tooling_path: mean(latency=confirmed_delete_time - request_time), p95(latency)

      | controlchart center=baseline_mean ucl=mean+3*sigma lcl=mean-3*sigma (baseline_n>=20)

      | alert when latency>ucl OR run_rule_fired'
- question: Which directories, file types, and endpoint groups have the highest eviction failure rate,
    retry count, and reinfection count (failed deletes, file-in-use/locked, access-denied)?
  context: 'Profile distinct failure modes — failed deletes, file-in-use/locked errors, access-denied,
    retries, and re-creation (reinfection) counts — and compute eviction failure rate, retry count, and
    median completion time grouped by directory, file type, and endpoint group. Prioritize any directory
    or system above the 90th percentile for engineering remediation, and bound residual recoverability
    risk using deletion-guarantee/latency framing (Reardon et al.). Hotspots reveal systemic weaknesses
    (locked services, permission gaps, persistent malware families) that defeat eviction; a flat low-failure
    profile indicates the capability is robust. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats by directory, file_type, endpoint_group: failure_rate=count(state=failed)/count(*),
      retry_count=sum(retries), median(completion_time), reinfection_count=count(recreated)

      | rank by failure_rate desc

      | where percentile>=90 -> flag remediation_hotspot'
- question: Based on file-path sensitivity, permission context, process-lock indicators, endpoint health,
    media type, and prior outcomes, what is the predicted probability that a given eviction will succeed,
    and which factors drive low-confidence cases to manual review?
  context: 'Train an interpretable model (Logistic Regression or Gradient Boosting) on features such as
    file-path sensitivity, permission context, active process-lock indicators, endpoint health, media
    type, and prior eviction outcomes (Rathore et al. favor explainable tree models over DNNs on opcode
    features). Use the predicted success probability to route low-confidence evictions to manual playbooks
    before execution, and surface the top-3 contributing features in the alert so analysts understand
    the risk. A low predicted probability lets the SOC pre-empt a failed eviction; a high probability
    supports automated execution. This is a prioritization aid, never a replacement for confirming the
    actual delete. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = LogisticRegression|GradientBoosting

      features = [path_sensitivity, permission_context, process_lock, endpoint_health, media_type, prior_outcome]

      p_success = model.predict_proba(features)

      | where p_success < threshold -> route manual_playbook ; emit top3_feature_importances'
- question: Has each candidate file been scored by an explainable static malware classifier (e.g., EMBER
    LightGBM on static PE features) and confirmed a true positive, with low-confidence files held for
    analyst review before eviction?
  context: 'Eviction should act only on confirmed malicious files. Before deleting, score candidate files
    with an explainable static classifier such as the EMBER LightGBM baseline (static PE features) and
    emit the top-3 contributing features alongside the verdict. Run this in parallel with deterministic
    AV/hash detection — never replacing it — so that eviction acts on confirmed true positives while low-confidence
    files are held for analyst review. A high-confidence malicious verdict corroborated by deterministic
    detection justifies eviction; a low-confidence or conflicting score should pause eviction to avoid
    deleting a benign file or missing a true threat. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = EMBER_LightGBM(static_PE_features)

      verdict, top3 = model.score(candidate_file)

      | corroborate with AV_signature/hash_detection

      | where verdict==malicious AND confidence>=threshold AND av_confirmed -> approve_eviction

      | else -> hold_for_analyst'
- question: Does the host's delete-then-verify event sequence deviate from the learned normal pattern
    (e.g., a deleted artifact being recreated, or an out-of-order workflow step), as flagged by a sequence-anomaly
    model?
  context: 'Model the host''s delete-then-verify event sequence (Sysmon delete/create log keys) with a
    DeepLog-style LSTM that flags events falling outside the top-g predicted next events. This catches
    reinfection (deleted malware recreated) and workflow deviations, and diagnoses which step deviated.
    Use it as a parallel anomaly layer above the deterministic reappearance rule, not as a substitute.
    A flagged anomaly points the analyst to the deviating event and likely process lineage; a sequence
    within the learned envelope adds confidence the eviction proceeded normally. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4660
  - Windows Sysmon Event ID 23
  - Windows Sysmon Event ID 26
  - Windows Sysmon Event ID 11
  - Microsoft Defender Action center / DeviceFileEvents
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DeepLog_LSTM(trained on normal delete->verify sequences)\nfor each event in host_sequence(Sysmon\
      \ delete/create keys):\n  if event NOT IN model.topg_predictions(prior_events): flag anomaly + diagnosing_step\n\
      | run parallel to deterministic reappearance rule"
- question: After a confirmed delete, has the same path/hash been re-created (Sysmon Event ID 11 / Event
    ID 4663 write), or does Get-MpThreat still report the ThreatID as Active following a cleaning action?
  context: 'This is the core deterministic failed-eradication test for the post-eviction verification
    window. Alert when a FileCreate (Sysmon Event ID 11) or write (Event ID 4663) re-creates a path or
    hash that was confirmed deleted, or when Get-MpThreat still reports the ThreatID Active after a cleaning
    action (NIST SP 800-83). Either condition means the threat was not fully eradicated — a persistence
    mechanism may be restoring the file, or the host may be re-compromised. A clean verification window
    with no recreation and an inactive ThreatID confirms successful eradication. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 23
  - Windows Event ID 4663
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers) within the post-eviction verification window.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (SysmonID=11 FileCreate) OR (EventID=4663 write) OR (Get-MpThreat ThreatStatus==Active)

      | where (path==confirmed_deleted_path OR hash==confirmed_deleted_hash) WITHIN verification_window

      | alert failed_eradication'
- question: What is the reinfection rate (recreated/confirmed-deleted) and median time-to-reappear per
    host group and malware family, and is it non-zero or rising against control limits?
  context: 'Compute reinfection rate (recreated divided by confirmed-deleted) and median time-to-reappear
    per host group and malware family, and chart them against Shewhart control limits. A non-zero or rising
    rate (State=failure) signals an unaddressed persistence mechanism that warrants deeper response per
    NIST SP 800-61 — simple file deletion is insufficient and the underlying mechanism (scheduled task,
    service, registry run key, dropper) must be found and removed. A consistently zero rate within control
    limits indicates evictions are sticking. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 23
  - Windows Event ID 4663
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers) within the post-eviction verification window.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats by host_group, malware_family: reinfection_rate=count(recreated)/count(confirmed_deleted),
      median(time_to_reappear)

      | controlchart ucl/lcl on reinfection_rate

      | where rate>0 OR rate>ucl OR rising_trend -> escalate persistence_investigation'
- question: Does a sequence model over Sysmon delete/create streams detect the recreate pattern, and can
    it identify the responsible process lineage restoring the evicted file?
  context: 'Apply a DeepLog-style sequence model to Sysmon delete/create streams to detect the recreate
    pattern and identify the responsible process lineage, surfacing the diagnosing event and top contributing
    features alongside the deterministic rule. This helps the analyst move from ''the file came back''
    to ''this process/parent restored it,'' pointing directly at the persistence mechanism. Use as a parallel
    anomaly layer that enriches, not replaces, the deterministic recreation alert. (Tactic: Evict [D3-E].)'
  answer_sources:
  - Windows Sysmon Event ID 11
  - Windows Sysmon Event ID 23
  - Windows Event ID 4663
  - Microsoft Defender MpThreatDetection
  - 'NAI: All managed endpoints (workstations and servers) within the post-eviction verification window.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = DeepLog_LSTM(Sysmon delete/create streams)

      | detect recreate_pattern; identify process_lineage(parent->child) responsible

      | emit diagnosing_event + top_features

      | run parallel to deterministic recreation rule'
