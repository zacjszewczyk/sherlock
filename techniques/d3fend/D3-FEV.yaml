name: 'D3-FEV: File Eviction'
id: 73d1a867-b276-4b6a-804c-0601ef1c98d7
description: Investigate and validate the eviction (deletion) of malicious files from managed endpoints.
  This playbook helps an analyst confirm that a deletion command was issued by approved security tooling,
  that a successful delete operation was logged against the target file path/hash, that the file is verified
  absent (and, where policy requires, rendered unrecoverable via secure overwrite or device secure-erase),
  and that the artifact does not reappear during post-eviction verification windows. It also covers detecting
  incomplete eradication and reinfection — where the same malicious path or hash is re-created, or the
  AV/EDR threat remains in an Active/Failed state — which indicates an unaddressed persistence mechanism.
  Methods span deterministic symbolic-logic correlation of process, delete, and create telemetry; statistical
  monitoring of time-to-evict, failure/retry, and reinfection rates against control limits; and machine-learning
  models for predicting eviction success, validating malicious-file identification, and flagging anomalous
  delete-then-verify event sequences.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
