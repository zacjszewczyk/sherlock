name: 'D3-HS: Host Shutdown'
id: c3fee82a-9045-4323-8472-2d5e5381392d
description: Investigate whether and how a host shutdown is a justified, safe, and verified eviction action
  against an active compromise. This playbook helps an analyst (1) confirm with high confidence that a
  non-critical host is actively compromised by correlating multi-signal first-party telemetry — process
  provenance, in-memory/fileless artifacts, kill-chain TTP graphs, and network/botnet indicators; (2)
  prioritize candidate hosts for shutdown using statistical and ML anomaly ranking, provenance-graph verdicts,
  and C2/botnet topology classification; and (3) govern the decision via a forensic order-of-volatility
  safety gate and host-criticality checks, then verify that the shutdown actually initiated and cleanly
  completed using tamper-evident action logs. The goal is to clear volatile/fileless malware and sever
  active adversary activity without destroying needed forensic evidence, disrupting critical assets, or
  giving responders false assurance that eviction succeeded.
type: technique
related:
- tactic_id: D3-EVC
  tactic_name: Evict
