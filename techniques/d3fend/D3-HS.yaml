questions:
- question: Do we have a deterministic, multi-signal match indicating active compromise on a single host
    before any shutdown is contemplated, and does that host clear the >=2 independent kill-chain stage
    threshold?
  context: 'Tactic context (Evict): shutdown is an aggressive, irreversible eviction action, so it must
    be gated on high-confidence evidence rather than a single noisy alert. Correlate Zeek dns.log/conn.log
    matches against high-confidence threat indicators AND a suspicious process execution (Windows Event
    ID 4688 / Sysmon Event ID 1) on the SAME host within a 10-minute window. Single-signal hits are monitor-only;
    a host becomes a shutdown-candidate only when two or more independent kill-chain stages match. A positive
    result (two correlated stages) justifies escalation; a negative result (one signal) means continue
    monitoring rather than evict, avoiding disruptive false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days (correlate signals within a 10-minute window per host)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ioc = (Zeek.dns.log OR Zeek.conn.log) WHERE dest IN threat_intel_high_conf

      proc = (WinEventID==4688 OR Sysmon==1) WHERE suspicious(cmdline,parent)

      JOIN ioc, proc ON host WITHIN 10m

      stages = count_distinct(kill_chain_stage)

      IF stages >= 2: status=''shutdown_candidate'' ELSE status=''monitor_only'''
- question: Does this host's process/kernel-audit provenance align with a full multi-stage kill-chain
    TTP graph (e.g., spawn shell -> process injection -> outbound C2)?
  context: 'Tactic context (Evict): single-event detections are easily evaded; encoding known kill-chain
    TTPs as query graphs and performing inexact subgraph matching against host kernel-audit/Sysmon provenance
    confirms an end-to-end attack pattern. A host whose provenance aligns with a full multi-stage query
    graph is a high-confidence shutdown candidate resistant to single-event evasion. A match across the
    complete chain strongly supports eviction; partial alignment warrants deeper investigation rather
    than immediate shutdown.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Graph pseudocode
    query: 'Q = query_graph(spawn_shell -> process_injection -> outbound_C2)

      G = build_provenance_graph(host, source=[Sysmon, auditd])

      score = inexact_subgraph_match(Q, G)

      IF full_chain_aligned(score): flag host AS high_conf_shutdown_candidate'
- question: Is there positive confirmation of memory-resident (fileless) malware on the host via in-memory
    byte-pattern matching and injection telemetry, with an absence of corresponding disk artifacts?
  context: 'Tactic context (Evict): fileless residence is the canonical case where shutdown clears RAM
    and is an effective eviction action. Confirm via byte-pattern/signature matching of process memory
    and injection telemetry — Sysmon Event ID 8 (CreateRemoteThread) and Event ID 10 (ProcessAccess to
    lsass/explorer). Absence of disk artifacts plus positive memory matches strengthens the shutdown justification
    because the malware will not survive a power cycle. A positive confirmation makes shutdown a high-value
    action; a negative result means disk-based persistence may be present and shutdown alone may not evict.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'inject = Sysmon==8 (CreateRemoteThread) OR Sysmon==10 (ProcessAccess target IN {lsass,explorer})

      mem_match = byte_pattern_scan(process_memory) IN malware_signatures

      disk = exists(file_on_disk(process))

      IF mem_match AND inject AND NOT disk: flag fileless_confirmed (shutdown clears RAM)'
- question: Does the host exhibit empirical signals of active botnet membership — outbound Telnet/SSH
    default-credential login attempts, high-rate horizontal scanning, and periodic C2 beaconing?
  context: 'Tactic context (Evict): the D3FEND article cites active botnet membership as a shutdown trigger.
    Match the empirical signals in Zeek conn.log: outbound Telnet/SSH default-credential login attempts,
    high-rate horizontal scanning, and periodic C2 beaconing. Pair scan volume with default-credential
    watchlist hits to deterministically tag a host as an active bot node. A positive deterministic tag
    (scanning + default-cred attempts + beaconing) supports shutting down the compromised node to sever
    its participation; isolated benign scanning does not.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'scan = conn.log | host=src | count(distinct dest:port) > scan_threshold WITHIN 5m

      defcred = conn.log service IN {telnet,ssh} AND user/pass IN default_credential_watchlist

      beacon = conn.log periodic(interval, dest) AND low_jitter

      IF scan AND defcred AND beacon: tag host AS active_bot_node'
- question: Does the host's outbound network behavior breach both the 95th-percentile and a 3.5 modified
    Z-score threshold over its 30-day per-host baseline, indicating likely exfiltration or C2?
  context: 'Tactic context (Evict): sustained anomalous egress during a suspicious window is evidence
    of active compromise (likely exfil/C2) that justifies aggressive eviction. Baseline each host''s outbound
    byte volume and unique destination counts, then flag hosts exceeding BOTH the 95th percentile AND
    a 3.5 modified Z-score (using median absolute deviation) so batch jobs do not inflate the floor. Derive
    thresholds per-host over a 30-day rolling baseline. A sustained dual-threshold breach during the suspicious
    window strengthens the case for shutdown; a transient single-metric spike does not.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days (per-host baseline over 30-day rolling window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each host: baseline = last 30d of (outbound_bytes, unique_dests)

      p95 = percentile(baseline, 95); mz = 0.6745*(x-median)/MAD

      IF outbound_bytes > p95 AND mz > 3.5 AND sustained(window): flag active_compromise (exfil/C2)'
- question: When ranked by an unsupervised Isolation Forest over per-host feature vectors, which candidate
    hosts surface as the most anomalous for shutdown prioritization, and what features drive each rank?
  context: 'Tactic context (Evict): with multiple candidate hosts, responders need a defensible ordering.
    Score per-host feature vectors (outbound bytes, unique destinations, new-process rate, beacon regularity,
    failed-logon count) with Isolation Forest to produce an unsupervised anomaly rank across the candidate
    set. Surface the contributing features for each ranked host so the analyst can validate the ranking.
    High-rank hosts with explainable contributing features are prioritized for eviction; the explainability
    ensures the model is corroborating, not replacing, the deterministic gates.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = per_host_features[outbound_bytes, unique_dests, new_proc_rate, beacon_regularity, failed_logons]

      model = IsolationForest().fit(candidate_hosts)

      rank = sort(model.anomaly_score(X), desc)

      OUTPUT host, rank, top_contributing_features'
- question: How far does the host deviate from its baseline parent-child process trees and from baseline
    system-call sequences for long-running processes, and does it rank among the highest combined process+network
    anomaly scores?
  context: 'Tactic context (Evict): rare parent->child process pairs and aberrant syscall sequences are
    strong compromise indicators. Quantify deviation from baseline parent-child process trees by historical
    frequency of each parent->child pair (Windows Event ID 4688 / Sysmon Event ID 1) and from baseline
    system-call sequences for long-running processes; then rank hosts with the highest combined process
    and network anomaly scores. A host with both a rare process tree and divergent syscall behavior, combined
    with network anomalies, is a strong shutdown candidate; expected process lineage argues against eviction.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq = historical_frequency(parent->child) FROM (4688|Sysmon1)

      proc_anom = -log(freq[parent->child])

      sys_anom = sequence_deviation(syscalls, baseline) FOR long_running_procs

      host_score = combine(proc_anom, sys_anom, network_anom); rank hosts desc'
- question: Does a provenance-graph detector return an explainable host-level compromise verdict, and
    what are the top-3 contributing nodes/edges (process, file, socket)?
  context: 'Tactic context (Evict): a host-level compromise verdict from a provenance-graph detector confirms
    active compromise before eviction. Run the detector over host kernel-audit/Sysmon telemetry using
    temporal-GNN edge scoring with attack-subgraph reconstruction, streaming graph-sketch envelope drift,
    or node-level role anomaly. The alert MUST list the top-3 contributing nodes/edges (process, file,
    socket), not just a score, so responders can verify the verdict. A positive verdict with a coherent
    anomalous subgraph supports shutdown; an unexplained score should not trigger eviction on its own.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'G = provenance_graph(host, source=[kernel_audit, Sysmon])

      verdict, subgraph = pgnn_detect(G)  # temporal-GNN edge score / sketch drift / node-role anomaly

      IF verdict==compromised: alert(host, top3_nodes_edges=subgraph.rank(3)[process,file,socket])'
- question: Does a GNN over the device-communication graph classify the host as embedded in a hub-and-spoke/relay
    C2 or botnet topology, and which neighboring nodes drive the classification?
  context: 'Tactic context (Evict): relational structure that flat-feature models miss can corroborate
    symbolic botnet-membership matches. Apply a graph neural network over the device-communication graph
    (devices as nodes, flows as edges) to classify hosts embedded in hub-and-spoke/relay C2 or botnet
    topologies. Report the neighboring nodes driving the classification. A topology-level classification
    consistent with the symbolic botnet signals reinforces the shutdown decision and may reveal additional
    compromised peers; an isolated classification with no corroboration warrants review.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4625
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - Sysmon Event ID 10
  - Linux auditd / kernel audit records
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint workstations and servers, Network egress points, Domain Name Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'DCG = device_comm_graph(nodes=devices, edges=flows)

      label = GNN_classify(DCG)  # hub-and-spoke / relay-C2 / botnet

      IF label IN {C2, botnet}: alert(host, driving_neighbors=explain(DCG, host))'
- question: Before approving shutdown, does the host hold uncaptured volatile evidence (live memory, running
    malicious processes, active C2 sockets) that must be preserved first, and is it tagged critical in
    the CMDB?
  context: 'Tactic context (Evict): shutdown destroys RAM, which is both the way to evict fileless malware
    and a source of irreplaceable forensic evidence. Deterministically check the forensic order of volatility:
    if the host holds uncaptured volatile evidence and is not imminently spreading, require a volatile-memory/state
    capture step first. This gate forces an explicit preserve-vs-evict decision. Block auto-shutdown on
    hosts tagged critical in the CMDB. A host that is imminently spreading and fileless-confirmed may
    justify immediate shutdown; otherwise capture memory first and never auto-shutdown a CMDB-critical
    asset.'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - EDR shutdown/quarantine action logs
  - CMDB / host-criticality tags
  - 'NAI: Endpoint workstations and servers, Incident-response orchestration plane, Asset inventory'
  range: Last 90 days (evaluate at decision time)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'volatile = live_memory_uncaptured OR running_malicious_proc OR active_C2_socket

      critical = CMDB.tag(host)==''critical''

      IF critical: BLOCK auto_shutdown

      ELIF volatile AND NOT imminently_spreading: REQUIRE memory_capture BEFORE shutdown

      ELSE: allow shutdown'
- question: After shutdown approval, did the host actually initiate and cleanly complete the shutdown,
    or is there evidence of a failed/dirty shutdown indicating the command was not honored?
  context: 'Tactic context (Evict): responders must not be given false assurance that eviction succeeded.
    Verify the shutdown command and clean completion via Windows Event IDs 1074 (shutdown initiated, with
    initiating user/process) and 6006 (event log stopped / clean shutdown). Alert when a shutdown is attempted
    but 6006 is absent, or an unexpected 6008 (dirty/unexpected shutdown) appears — indicating the host
    may have failed to power off or a compromised host did not honor the remote command, requiring physical
    intervention. A clean 1074->6006 sequence confirms eviction; a missing 6006 or stray 6008 means escalate
    to physical response.'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - EDR shutdown/quarantine action logs
  - CMDB / host-criticality tags
  - 'NAI: Endpoint workstations and servers, Incident-response orchestration plane, Asset inventory'
  range: Last 90 days (event-centered on the shutdown window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'init = WinEventID==1074 (with initiating user/process) WITHIN shutdown_window

      clean = WinEventID==6006 AFTER init

      dirty = WinEventID==6008

      IF init AND NOT clean: alert(''shutdown not confirmed - physical intervention'')

      IF dirty: alert(''unexpected/dirty shutdown - host may not have honored command'')'
- question: Are shutdown/EDR action logs forwarded to a tamper-evident append-only store with verified
    hash-chain continuity, and is there any chain break or missing completion record around the shutdown
    window?
  context: 'Tactic context (Evict): an adversary may spoof or suppress eviction-completion records. Forward
    shutdown/EDR action logs to a tamper-evident (hash-chained, append-only) store and verify continuity.
    A missing or forged completion record, or a hash-chain break around the shutdown window, is itself
    an alert that eviction may have failed or been spoofed. Continuous, intact chains validate the eviction
    record; a break or gap demands manual verification of the host''s actual power state.'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - EDR shutdown/quarantine action logs
  - CMDB / host-criticality tags
  - 'NAI: Endpoint workstations and servers, Incident-response orchestration plane, Asset inventory'
  range: Last 90 days (event-centered on the shutdown window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'forward(EDR_shutdown_logs) -> append_only_hash_chained_store

      ok = verify_hash_chain_continuity(window)

      IF NOT ok OR missing(completion_record): alert(''eviction may have failed or been spoofed'')'
- question: Do the host's failure-mode signals — failed-logon (4625) bursts, NXDOMAIN spikes, and blocked/refused
    connection states (S0/REJ/RSTO) — exhibit a high scan-then-login-failure ratio characteristic of an
    active automated bot node?
  context: 'Tactic context (Evict): error/failure rates are distinct State signals that disambiguate an
    active automated compromise from a merely noisy admin host. Track failed-logon (Windows Event ID 4625)
    bursts, NXDOMAIN spikes (Zeek dns.log), and blocked/refused connection states (Zeek conn.log S0/REJ/RSTO)
    with modified-Z thresholds. A high scan-then-login-failure ratio is characteristic of an active bot
    node and strengthens the shutdown decision. A clear automated failure pattern reinforces eviction;
    sporadic admin-driven failures do not.'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - EDR shutdown/quarantine action logs
  - CMDB / host-criticality tags
  - 'NAI: Endpoint workstations and servers, Incident-response orchestration plane, Asset inventory'
  range: Last 90 days (per-host modified-Z baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fl = burst(WinEventID==4625); nx = spike(dns.log NXDOMAIN)

      refused = conn.log state IN {S0,REJ,RSTO}

      mz_flag = modified_z([fl,nx,refused]) > 3.5

      ratio = scans / login_failures

      IF mz_flag AND ratio HIGH: strengthen shutdown decision (active bot node)'
- question: What is the explainable per-host risk score combining compromise-confidence, data-egress volume,
    and host-criticality, and what are the top-3 contributing factors that justify the eviction ordering?
  context: 'Tactic context (Evict): responders need to justify shutdown ordering and avoid powering off
    critical assets. Compute an explainable per-host risk score using entity behavior analytics (per-entity
    baseline + peer-group comparison) that combines compromise-confidence, data-egress volume, and host-criticality;
    rank hosts and surface the top-3 contributing factors in the alert. The explainability lets responders
    order evictions defensibly and protect business-critical hosts. A high score driven by compromise
    indicators on a non-critical host argues for shutdown; a high score dominated by criticality argues
    for a lighter action.'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - EDR shutdown/quarantine action logs
  - CMDB / host-criticality tags
  - 'NAI: Endpoint workstations and servers, Incident-response orchestration plane, Asset inventory'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "score = UEBA(per_entity_baseline + peer_group_compare)\n  over [compromise_confidence, data_egress_volume,\
      \ host_criticality]\nrank hosts desc; alert WITH top3_contributing_factors\ndeprioritize_shutdown\
      \ IF criticality dominates"
- question: Does a learned sequential decision policy recommend shutdown over isolate/monitor for this
    host, does it explain the top-3 driving features, and does it respect the deterministic forensic-volatility
    and criticality gates?
  context: 'Tactic context (Evict): the shutdown-vs-isolate-vs-monitor choice can be modeled as a sequential
    decision policy learned from historical incident outcomes, with features from IOC matches, provenance
    anomaly scores, data-egress indicators, fileless-confirmation, and host-criticality tags, and rewards
    balancing containment effectiveness against business disruption. The policy should recommend host
    removal/shutdown only when it dominates lighter actions, must explain the top-3 features driving the
    recommendation, and must NEVER override the deterministic forensic-volatility/criticality gate. A
    shutdown recommendation that is well-explained and gate-consistent supports action; any recommendation
    conflicting with the safety gates is overridden.'
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - EDR shutdown/quarantine action logs
  - CMDB / host-criticality tags
  - 'NAI: Endpoint workstations and servers, Incident-response orchestration plane, Asset inventory'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'state = [ioc_matches, provenance_anom, data_egress, fileless_confirmed, host_criticality]

      action = policy.recommend(state)  # learned from historical incident outcomes (RL)

      reward ~ containment_effectiveness - business_disruption

      IF action==''shutdown'' AND dominates(isolate,monitor): recommend WITH top3_features

      ASSERT not_override(forensic_volatility_gate, criticality_gate)'
