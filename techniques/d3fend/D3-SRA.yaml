name: 'D3-SRA: Sender Reputation Analysis'
id: 15ee94d7-8547-4085-b93b-b376d95ed1f0
description: 'Investigate the trustworthiness of external email senders to surface malicious, spoofed,
  or compromised correspondents before their messages reach users. This playbook layers three complementary
  approaches drawn from the analysis plan: a deterministic reputation floor (email-authentication results
  and identifier alignment, header-composition consistency, infrastructure blocklist matches, and lookalike/homoglyph
  sender-domain rules); statistical sender-reputation baselining of per-sender Volume, Frequency, and
  State/failure signals against behavioral and population baselines; and machine-learning reputation scoring
  that runs on first-party MTA/Zeek telemetry and surfaces its top contributing features for triage. Together
  these help an analyst answer how effectively the enterprise can assess sender reputation to identify
  phishing, business-email-compromise, and spoofing against a sophisticated external adversary as well
  as commodity and insider threats.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does the inbound sender's source IP address or sending domain appear on any known-malicious
    threat-intelligence blocklist?
  context: 'Detect-tactic deterministic floor. Cross-reference the sender''s IP address (Zeek conn.log)
    and domain (Zeek dns.log / smtp.log MAIL FROM) against curated threat-intelligence blocklists of known-malicious
    infrastructure. A match is a high-confidence indicator that the sender is hostile and should alert
    immediately and bypass any softer scoring. Keep this hard deterministic rule as the reputation floor
    regardless of model output: ML can raise suspicion but must never lower it below a confirmed blocklist
    hit. A positive result means confirmed-bad infrastructure touched the perimeter; a negative result
    only means the sender is not yet on a list, not that it is safe.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek conn.log
  - Email Gateway logs
  - 'NAI: Email gateway and network perimeter (inbound SMTP and DNS resolution)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  smtp.log JOIN conn.log ON uid\n  | LOOKUP id.orig_h IN ti_blocklist_ip\n  | LOOKUP mailfrom_domain\
      \ IN ti_blocklist_domain\n  | WHERE ip_match OR domain_match\n  | ALERT severity=high reason=\"\
      blocklist match\""
- question: Do the SPF, DKIM, and DMARC results for the message pass with proper DMARC identifier alignment,
    or do they fail or show misalignment from a domain that publishes a strict policy?
  context: 'Detect-tactic deterministic floor. Parse SPF, DKIM, and DMARC results from Zeek smtp.log /
    gateway logs. Per [RFC 7208](https://www.rfc-editor.org/rfc/rfc7208) and [RFC 7489](https://www.rfc-editor.org/rfc/rfc7489),
    do not trust a bare ''pass'': require DMARC identifier alignment between the RFC5322.From domain and
    the SPF/DKIM-authenticated domain. Alert on auth-fail or misalignment when the From domain publishes
    p=quarantine or p=reject, since research ([End-to-End Measurements of Email Spoofing](https://www.usenix.org/conference/usenixsecurity18/presentation/hu))
    shows providers still inbox spoofed mail despite passing auth. A positive result (fail/misalignment
    against a strict-policy domain) strongly indicates spoofing of a domain whose owner expected enforcement;
    a clean aligned pass raises baseline trust.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek conn.log
  - Email Gateway logs
  - 'NAI: Email gateway and network perimeter (inbound SMTP and DNS resolution)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  parse spf_result, dkim_result, dmarc_result, header_from_domain, auth_domain\n  | WHERE\
      \ dmarc_result != \"pass\" OR header_from_domain != auth_domain\n  | LOOKUP published_policy(header_from_domain)\
      \ IN (\"quarantine\",\"reject\")\n  | ALERT \"auth fail / DMARC misalignment vs strict-policy domain\""
- question: After re-parsing and normalizing the message headers, are there multiple or ambiguous From
    headers, or a mismatch between the RFC5321 envelope MAIL FROM and the RFC5322 header From?
  context: Detect-tactic deterministic floor. Re-parse and normalize message headers and deterministically
    flag messages with multiple/ambiguous From headers or a mismatch between the RFC5321 envelope MAIL
    FROM and the RFC5322 header From. These header-composition primitives bypass naive authentication
    checks ([Composition Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun)
    documents 18 evasion classes; [Weak Links in Authentication Chains](https://www.usenix.org/conference/usenixsecurity21/presentation/shen-kaiwen)
    shows chained parser disagreements). A positive result indicates deliberate header crafting to evade
    auth and confuse the user about the true sender; this is a strong spoofing/phishing signal.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek conn.log
  - Email Gateway logs
  - 'NAI: Email gateway and network perimeter (inbound SMTP and DNS resolution)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  reparse_headers(raw_message)\n  | count_from = number_of_From_headers\n  | WHERE count_from\
      \ > 1\n     OR ambiguous_from == true\n     OR envelope_mailfrom_domain != header_from_domain\n\
      \  | ALERT \"header composition evasion\""
- question: Is the inbound sender domain a lookalike or homoglyph of a protected brand, partner, or executive
    domain (within edit distance <=2 or differing only by confusable Unicode/IDN code points)?
  context: Detect-tactic deterministic floor. Maintain a list of protected brand/partner/executive domains.
    Flag any inbound sender domain within Levenshtein/Damerau edit distance <=2 of a protected domain,
    or differing only by confusable Unicode/IDN code points, using typo-generation models taxonomized
    in [The Landscape of Domain Name Typosquatting](https://arxiv.org/abs/1603.02767). A positive result
    indicates an impersonation domain designed to trick recipients into trusting a near-identical name
    - a hallmark of targeted phishing and BEC. A negative result means the sender domain is not visually
    close to anything protected.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek conn.log
  - Email Gateway logs
  - 'NAI: Email gateway and network perimeter (inbound SMTP and DNS resolution)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for sender_domain in inbound:\n    for prot in protected_domains:\n      if damerau_levenshtein(sender_domain,\
      \ prot) <= 2\n         or confusable_skeleton(sender_domain) == confusable_skeleton(prot):\n   \
      \     ALERT \"lookalike/homoglyph of \"+prot"
- question: Is this message from a new or rarely-seen sender that ranks highly under directed anomaly
    scoring on reputation features such as domain age, first-ever From for a display name, and recipient
    breadth?
  context: Detect-tactic statistical baselining. For each inbound message compute reputation features
    - days the sender domain/address has been seen, whether this is the first-ever From address for a
    known display name, a never-before-seen sender domain, and recipient breadth - then rank with non-parametric
    Directed Anomaly Scoring to a fixed daily alert budget ([Detecting Credential Spearphishing Attacks](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    Alert on senders newer than 30 days or in the top of the suspicion ranking. This catches spearphishing
    from fresh infrastructure or display-name impersonation while keeping analyst workload bounded.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway and DNS resolver telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  features = {days_seen, first_from_for_displayname, new_domain, recipient_breadth}\n\
      \  | score = directed_anomaly_score(features)\n  | rank desc by score\n  | ALERT top_N_per_day OR\
      \ days_seen < 30"
- question: Has a previously low-volume or unknown external sender suddenly spiked in message volume or
    fanned out to many internal recipients?
  context: Detect-tactic statistical baselining. Baseline each external sender's Volume (messages/day,
    total bytes, attachment/URL message ratio) and Frequency (messages/min, internal-recipient fan-out)
    over 90 days. Alert on sudden spikes from previously low-volume/unknown senders, especially fan-out
    to many internal recipients, which marks burst campaigns ([Detecting Credential Spearphishing Attacks](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    Thresholds are starting points; derive cutoffs from your own distribution (mean + 3 sigma or 99th
    percentile). A positive result suggests a phishing blast or compromised account distributing mail
    widely.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway and DNS resolver telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per sender_domain over 90d:\n    baseline_vol = mean(msgs_per_day); baseline_fanout\
      \ = mean(distinct_recipients)\n  | today_vol, today_fanout = current\n  | WHERE today_vol > baseline_vol\
      \ + 3*stdev\n     OR today_fanout > p99(fanout)\n  | ALERT \"volume/fan-out spike from low-volume\
      \ sender\""
- question: For a given sender domain, are its SPF/DKIM/DMARC failure rates, bounce rate, or return-path
    NXDOMAIN rate abnormally elevated relative to its own and the population baseline?
  context: 'Detect-tactic statistical baselining. Track per-sender-domain State signals as distinct features:
    SPF-fail %, DKIM-fail %, DMARC-fail %, bounce rate, and NXDOMAIN rate on the sender/return-path domain.
    A domain that normally enforces SPF/DMARC suddenly failing, or a sender whose return-path domain frequently
    NXDOMAINs, lowers trust (population baselines for weak-policy domains from [Neither Snow Nor Rain
    Nor MITM](https://conferences.sigcomm.org/imc/2015/papers/p27.pdf)). A positive result can indicate
    spoofing of a normally-clean domain, abuse of disposable return-paths, or failing infrastructure -
    all reputation-lowering signals worth correlating with the deterministic auth checks.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway and DNS resolver telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per sender_domain:\n    spf_fail_pct, dkim_fail_pct, dmarc_fail_pct, bounce_rate, nxdomain_rate\n\
      \  | compare to own_baseline and population_baseline\n  | WHERE any_rate > baseline + 3*sigma OR\
      \ nxdomain_rate high\n  | LOWER trust + ALERT"
- question: Does this message deviate from the established behavioral fingerprint of the sender (typical
    send-hour, MIME/X-Mailer composition, header layout, recipient set, or writing style), suggesting
    a compromised-but-genuine account?
  context: Detect-tactic statistical baselining. Build per-sender behavioral fingerprints (typical send-hour,
    MIME/X-Mailer composition, header layout, recipient set, and stylometry) and flag deviations. This
    catches compromised-but-genuine accounts that legitimately pass authentication because the attacker
    is sending from the real account ([That Ain't You](https://seclab.bu.edu/people/gianluca/papers/spearphishing-dimva2015.pdf);
    [Analyzing Social and Stylometric Features](https://arxiv.org/abs/1406.3692)). A positive result -
    e.g., an account that always mails during business hours suddenly sends at 3am with a different mailer
    and new recipients - is a strong account-takeover signal that auth checks alone would miss.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway and DNS resolver telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  fingerprint[sender] = profile(send_hour, mime, x_mailer, header_layout, recipients,\
      \ stylometry)\n  | for new_msg: dist = deviation(new_msg, fingerprint[sender])\n  | WHERE dist >\
      \ threshold\n  | ALERT \"behavioral deviation - possible account takeover\""
- question: Using passive DNS, does the sender/return-path domain score as newly-registered or high-entropy/dynamic
    relative to legitimate enterprise correspondents?
  context: Detect-tactic statistical baselining. Using passive DNS, score the sender/return-path domain
    on prevalence, IP/domain dynamism, TTL behavior, and lexical n-gram entropy ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)).
    Alert on newly-registered (<30 days) domains or high-entropy domains at or above the 95th percentile
    of legitimate enterprise correspondents. A positive result indicates throwaway or algorithmically
    generated infrastructure typical of phishing and malware campaigns; low-prevalence, fast-flux, or
    short-TTL behavior further lowers reputation.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway and DNS resolver telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for sender_domain via passive_dns:\n    age, prevalence, ip_dynamism, ttl_behavior,\
      \ ngram_entropy\n  | WHERE age < 30d\n     OR ngram_entropy >= p95(legit_correspondents)\n     OR\
      \ fast_flux(ip_dynamism, ttl_behavior)\n  | ALERT \"newly-registered / high-entropy sender domain\""
- question: What risk score does the baseline logistic-regression scorer (over domain age, name entropy,
    IP reputation, and authentication status) assign to this new sender?
  context: Detect-tactic ML layer. Retain a logistic-regression scorer over domain age, name entropy,
    IP reputation, and authentication status to assign a risk score to all new senders, kept as a tunable,
    explainable baseline beneath the ensemble model. This sits on top of - never below - the deterministic
    floor. A high score flags a sender for review; because the model is linear and interpretable, the
    analyst can see which of the four features drove the score, making it a defensible first-pass triage
    signal.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway analytics pipeline'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  x = [domain_age, name_entropy, ip_reputation, auth_status]\n  | risk = sigmoid(w . x\
      \ + b)\n  | WHERE risk > tuned_threshold\n  | ALERT with feature_contributions(x, w)"
- question: Does the explainable ensemble classifier (random forest / gradient boosting over first-party
    reputation, behavioral, and content features) flag this sender as malicious, and what are its top-3
    contributing features?
  context: Detect-tactic ML layer. Train a random forest / gradient-boosted classifier on first-party
    reputation, behavioral, and content features (recipient-profile anomaly vs the sender's historical
    contacts, URL reputation, days-known, fan-out, auth-fail rates), as in [Detecting and Characterizing
    Lateral Phishing at Scale](https://www.usenix.org/conference/usenixsecurity19/presentation/ho) (<4
    FP/million). The model MUST emit the top-3 SHAP/feature-importance contributors in each alert for
    triage (per the explainable phishing pipeline in [Novel Interpretable and Robust Web-based AI Platform
    for Phishing Email Detection](https://arxiv.org/abs/2405.11619)). A positive result with clear contributing
    features lets the analyst quickly confirm whether the drivers are legitimate or indicative of phishing/BEC.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway analytics pipeline'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = {recipient_profile_anomaly, url_reputation, days_known, fan_out, auth_fail_rate,\
      \ ...}\n  | p = ensemble_model.predict_proba(features)\n  | WHERE p > threshold\n  | ALERT score=p,\
      \ top3=shap_top_features(features)"
- question: Where edit-distance rules miss unseen Unicode substitutions, does a Siamese network score
    the sender domain/display name as visually similar to a protected domain?
  context: Detect-tactic ML layer. Where deterministic edit-distance rules miss unseen Unicode substitutions,
    render sender domains/display names to images and score visual similarity to protected domains with
    a Siamese convolutional network ([Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738)).
    This complements the symbolic homoglyph rule by catching novel confusable glyph combinations that
    are not in any precomputed confusable table. A positive result indicates a visually deceptive impersonation
    domain even when character-level distance looks large.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway analytics pipeline'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  img = render_to_image(sender_domain_or_displayname)\n  | for prot in protected_domains:\n\
      \      sim = siamese_cnn(img, render_to_image(prot))\n  | WHERE max(sim) > similarity_threshold\n\
      \  | ALERT \"visual lookalike of \"+argmax_prot"
- question: When the per-module scores (authentication-anomaly, sender-recipient behavioral, intent-classifier)
    are fused, does the combined per-organization-tunable score flag the sender, and which modules fired?
  context: 'Detect-tactic ML layer. Combine authentication-anomaly, sender-recipient behavioral, and intent-classifier
    modules into a fused, per-organization-tunable score that records which module fired (following the
    modular design of [A Modular and Adaptive System for Business Email Compromise Detection](https://arxiv.org/abs/2308.10776)),
    and optionally generate an analyst-readable rationale naming the impersonation tactic ([ChatSpamDetector](https://arxiv.org/abs/2402.18093)).
    A positive result with the firing modules and a named tactic gives the analyst an explainable, BEC-focused
    verdict: the analyst can see whether the alert is driven by auth anomalies, relationship anomalies,
    malicious intent, or a combination, and tune module weights per organization.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Email Gateway logs
  - 'NAI: Email gateway analytics pipeline'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  s_auth = auth_anomaly_module(msg)\n  | s_behav = sender_recipient_module(msg)\n  | s_intent\
      \ = intent_classifier(msg)\n  | fused = weighted_fuse(s_auth, s_behav, s_intent, org_weights)\n\
      \  | WHERE fused > threshold\n  | ALERT fused, modules_fired, rationale=name_impersonation_tactic(msg)"
