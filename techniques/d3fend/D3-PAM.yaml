name: 'D3-PAM: Physical Access Mediation'
id: 2cb5cd32-e75f-4687-b91f-b1547e1cdacd
description: Investigate potential compromise, tampering, or insider abuse of the systems that enforce
  physical access mediation (PACS) - the head-end servers, door controllers, management workstations,
  and credential databases that grant or deny entry to secure facilities. This playbook helps an analyst
  determine whether the isolated PACS network segment is being managed only by approved administrators
  over approved protocols, whether physical-access decisions still honor per-area authentication-factor,
  credential-validity, and door-authorization policy, and whether logical activity against physical-access
  infrastructure is consistent with real physical presence. It combines deterministic symbolic-logic rules
  (admin source/protocol allowlisting, failure-to-success chain detection, factor and revocation enforcement,
  logical/physical correlation), robust statistical baselining (connection-volume and failure-rate change-point
  detection, per-door grant/deny baselines, login-timing and edge-rarity modeling), and graph/ML scoring
  (rare admin-edge ranking, takeover-risk prioritization, out-of-sequence admin-action modeling, and insider-misuse
  scoring) to surface compromise of the infrastructure that underpins physical isolation.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any successful management or administrative connections to the physical access control
    (PACS) servers originating from a source IP address or user account that is not on the approved administrator
    allowlist?
  context: 'Physical access control systems are supposed to live on an isolated, deny-by-default OT segment
    that only a small, named set of administrators and jump hosts may reach. By alerting whenever a successful
    management connection (Zeek conn.log session, or a Windows 4624 interactive/network logon) to a PACS
    server originates from a source IP or account outside the approved allowlist, you catch the moment
    an adversary or unmanaged host gains a foothold on the infrastructure that enforces physical isolation.
    Apply the OT host/account allowlisting and deny-by-default model from [Guide to OT Security (NIST
    SP 800-82 Rev. 3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf). A
    positive result - a successful admin session from an unlisted source - is a high-fidelity indicator
    of compromise that warrants immediate containment; a negative result confirms management access is
    confined to sanctioned operators. (Method: Symbolic Logic; tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'LET admin_allowlist = lookup(approved_pacs_admin_ips, approved_pacs_admin_accounts)

      INDEX=pacs (sourcetype=zeek_conn OR EventID=4624)

      | where dest_host IN (pacs_server_list) AND outcome="success"

      | where NOT (src_ip IN admin_allowlist.ips) OR NOT (account IN admin_allowlist.accounts)

      | table _time src_ip account dest_host service logon_type'
- question: Is any traffic to the PACS head-end or door controllers using a management protocol, port,
    or command type that is not part of the documented, allowlisted operations set?
  context: 'Even from an approved host, an attacker may abuse the PACS in ways legitimate administration
    never does - issuing vendor controller commands, mass operations, or protocols that fall outside the
    sanctioned management surface. Permit only documented management protocols/ports and command types
    (e.g., RDP/WinRM/HTTPS to the head-end, the specific vendor controller protocols) from allowlisted
    hosts, and alert on any out-of-spec function or command. This adapts specification-based rule generation
    ([Mohan et al.](https://arxiv.org/abs/2412.07917)) and the command-allowlisting guidance of [NIST
    SP 800-82 Rev. 3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf). A positive
    result means a protocol or command outside the engineering specification was observed - a strong sign
    of misuse or tampering; a negative result confirms operations stayed within the documented control
    set. (Method: Symbolic Logic; tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LET allowed = spec_table(protocol, port, command_type)  # documented PACS mgmt ops

      INDEX=pacs sourcetype IN (zeek_conn, zeek_rdp, zeek_http, vendor_ctrl_log)

      | where dest_host IN (pacs_head_end, door_controllers)

      | eval op = service.":".dest_port.":".command_type

      | where NOT match(op, allowed)

      | table _time src_ip dest_host service dest_port command_type'
- question: On the access-control servers, are there sequences of repeated failed logons followed by a
    success from the same source or account, or sustained failure bursts with no success, indicating a
    credential attack against physical-isolation infrastructure?
  context: 'Credential attacks leave a structural fingerprint. Detect sequences of >=5 Windows Event ID
    4625 failures within 5 minutes followed by a 4624 success on access-control servers from the same
    source/account, and escalate as a probable successful credential attack; separately treat sustained
    4625 bursts with no success (corroborated by firewall denies) as a brute-force/spray signal. This
    follows the structural login analysis of [Siadati and Memon](https://doi.org/10.1145/3133956.3134003).
    A failure-to-success chain is especially serious because it suggests the attacker eventually got in;
    a no-success burst still indicates active targeting of the PACS and should drive source blocking and
    credential review. (Method: Symbolic Logic; tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX=windows EventID IN (4625,4624) host IN (pacs_server_list)\n| bin _time span=5m\n| stats\
      \ count(eval(EventID=4625)) AS fails count(eval(EventID=4624)) AS success\n        min(eval(if(EventID=4624,_time,null)))\
      \ AS success_time BY src_account, src_ip, _time\n| eval verdict = case(fails>=5 AND success>0,\"\
      fail_to_success_compromise\",\n                      fails>=5 AND success=0,\"bruteforce_or_spray\"\
      , true,null)\n| where isnotnull(verdict)\n| table _time src_account src_ip fails success verdict"
- question: For each PACS host, do daily connection count, unique peer count, or byte volume exceed the
    host's own 30-day rolling baseline (99th percentile) or show an abrupt change-point shift?
  context: 'Static thresholds are fragile on diverse OT hosts, so build 30-day rolling baselines for connection
    count, unique peer count, and byte volume per physical-access host from Zeek conn.log and alert when
    daily values exceed the 99th percentile, deriving thresholds from each site''s own traffic. Apply
    change-point methods (CUSUM/PELT/Bayesian online, per [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/))
    to flag abrupt shifts rather than relying only on fixed cutoffs. A sudden surge in peers or volume
    on an isolated PACS host can reveal scanning, data staging, lateral movement, or C2 that deterministic
    rules miss; a stable series within baseline is reassuring evidence the segment is quiet. (Method:
    Statistical Method; tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=pacs sourcetype=zeek_conn host IN (pacs_server_list)

      | bin _time span=1d

      | stats count AS conns dc(dest_ip) AS peers sum(bytes) AS vol BY host, _time

      | eventstats perc99(conns) AS c99 perc99(peers) AS p99 perc99(vol) AS v99 BY host  # 30d window

      | eval changepoint = cusum_detect(conns, peers, vol)

      | where conns>c99 OR peers>p99 OR vol>v99 OR changepoint=1

      | table _time host conns peers vol changepoint'
- question: Has the per-host failed-logon ratio (4625/(4624+4625)) or the firewall-deny count to the PACS
    segment risen above its 99th-percentile baseline or shown a change-point increase?
  context: 'Treat the failure rate as a first-class signal distinct from success volume. Baseline the
    per-host failed-logon ratio (4625/(4624+4625)) and the firewall-deny count to the PACS segment, and
    alert on change-point increases or values above the 99th percentile, per [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    A rising failure ratio - even without any single brute-force burst crossing a rule threshold - often
    precedes or accompanies credential attacks and misconfiguration against isolation infrastructure.
    A baseline-conforming ratio indicates normal authentication health; a spike points the analyst at
    the specific host and time window to investigate. (Method: Statistical Method; tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=windows EventID IN (4624,4625) host IN (pacs_server_list)

      | bin _time span=1h

      | stats count(eval(EventID=4625)) AS fails count(eval(EventID=4624)) AS oks BY host, _time

      | eval fail_ratio = fails/(fails+oks)

      | append [ search INDEX=firewall action=deny dest_zone=pacs | bin _time span=1h | stats count AS
      denies BY dest_host, _time ]

      | eventstats perc99(fail_ratio) AS r99 BY host

      | eval changepoint = cusum_detect(fail_ratio, denies)

      | where fail_ratio>r99 OR changepoint=1

      | table _time host fail_ratio denies changepoint'
- question: Are any administrators authenticating to PACS control servers at unusual hours for them, or
    producing rare/new (source, destination, account) authentication-graph edges?
  context: 'Compromised or misused admin credentials frequently betray themselves through timing and novelty.
    Model each administrator''s login-hour distribution and the rarity of authentication-graph edges to
    the control servers, and flag low-probability time windows or rare/new (source, destination, account)
    edges, applying the edge-rarity and credential-reach baselining of [Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001).
    An off-hours logon by an admin who normally only works business hours, or a brand-new source-to-PACS
    edge, is exactly the weak signal that precedes overt abuse. A finding here is a lead for deeper review
    rather than a standalone block, and a clean result supports the conclusion that admin behavior is
    consistent with history. (Method: Statistical Method; tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=windows EventID=4624 dest_host IN (pacs_server_list) logon_type IN (2,10)

      | eval hour=strftime(_time,"%H"), edge=src_ip."->".dest_host.":".account

      | eventstats count BY account hour            # per-admin hour distribution

      | eventstats count AS edge_count BY edge       # edge rarity

      | eval hour_prob = count/total_for_account, rare_edge = if(edge_count<=2,1,0)

      | where hour_prob < 0.02 OR rare_edge=1

      | table _time account src_ip dest_host hour hour_prob rare_edge'
- question: Which authentication edges into physical-access infrastructure does an unsupervised graph
    model score as the rarest new admin edges, and what features drive that score?
  context: 'Rank low-probability admin edges into the PACS segment by scoring each authentication edge
    with an unsupervised graph model and surfacing the rarest new admin edges. Apply [CyberGraph (Bowman
    et al.)](https://www.usenix.org/system/files/raid20-bowman.pdf) and the authentication-sequence ranking
    of [Bian et al.](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf), and emit the
    top-3 contributing features (e.g., new source, credential switch, off-hours) in the alert so the analyst
    can triage quickly. This catches stealthy lateral movement toward isolation infrastructure that fixed
    rules and single-metric baselines miss; the top-feature explanation distinguishes a benign new jump
    host from an adversary''s first hop. Run this alongside, not instead of, the deterministic allowlist
    rules. (Method: Machine Learning; tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: ML/Graph pseudocode
    query: "G = build_auth_graph(events where dest in pacs_segment)\nmodel = CyberGraph_unsupervised().fit(G.historical_edges)\n\
      for e in G.recent_edges:\n    score = model.rarity(e)\n    if score > threshold and e.is_new:\n\
      \        emit(edge=e, score=score, top3_features=model.explain(e))"
- question: Which events targeting physical access mediation infrastructure does a risk model rank as
    the most likely control-system takeover attempts, and what are the top contributing factors?
  context: 'Prioritize likely control-system takeover attempts by training a risk model on source reputation,
    login outcomes, host criticality, session timing, network-flow features, and inferred login-path rarity
    to score events and rank high-likelihood compromises of physical-access mediation infrastructure.
    Combine the causal login-path scoring of [Hopper (Ho et al.)](https://www.usenix.org/system/files/sec21-ho.pdf)
    with SHAP-based feature attribution ([Ha et al.](https://arxiv.org/abs/2205.01930)) so the top-3 contributing
    features appear in the alert text; the model is trainable on the [LANL authentication dataset](https://csr.lanl.gov/data/auth/).
    This fuses many weak signals into a single triage-ranked queue, helping a SOC focus on the events
    most likely to represent an adversary seizing the systems that enforce physical isolation. Treat it
    as a prioritization layer above the deterministic and statistical detections. (Method: Machine Learning;
    tactic: Isolate.)'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Firewall deny logs
  - 'NAI: Physical access control network segment, Physical access control management servers, Administrator
    workstations for physical security systems'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_event_vector(src_reputation, login_outcome, host_criticality,\n           \
      \  session_timing, netflow_features, login_path_rarity)\nmodel = RiskModel().fit(LANL_auth_dataset)\n\
      for ev in pacs_events:\n    risk = model.score(features[ev])\n    if risk > threshold:\n       \
      \ emit(event=ev, risk=risk, top3=shap_explain(model, ev))"
- question: Did the PACS head-end grant access using a weaker authentication mechanism than the target
    security area requires, or by bypassing a required factor?
  context: 'Different security areas mandate different authentication strengths; a grant that uses CAK
    where PKI-AUTH or BIO is required - or that bypasses a required factor entirely - signals tampering
    with or compromise of the mediation logic. Alert when an access grant''s mechanism is weaker than
    the security area''s policy requires, per the per-security-area requirements in [NIST SP 800-116 Rev.
    1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-116r1.pdf). A positive result
    means the door opened under a weaker proof of identity than policy allows, which an attacker could
    exploit to enter sensitive space with a cloned or low-assurance credential; a negative result confirms
    factor policy is being enforced at the head-end. (Method: Symbolic Logic; tactic: Isolate.)'
  answer_sources:
  - PACS head-end audit logs
  - Door controller event logs
  - PIV/certificate revocation (CRL/OCSP) logs
  - 'NAI: Physical access control head-end servers, Door controllers, Badge/credential management database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'LET area_policy = lookup(area_id -> required_factor)  # CAK < PKI-AUTH < PKI+BIO

      INDEX=pacs sourcetype=pacs_head_end event=access_grant

      | lookup area_policy area_id OUTPUT required_factor

      | eval used_rank = factor_rank(auth_mechanism), req_rank = factor_rank(required_factor)

      | where used_rank < req_rank

      | table _time door_id area_id cardholder auth_mechanism required_factor'
- question: Was access ever granted on a revoked or expired PIV certificate, to a cardholder not authorized
    for that door/area, or while the credential-validation service was unreachable?
  context: 'Valid mediation requires a currently-valid credential, an authorized cardholder, and a reachable
    validation service. Alert on any access grant tied to a revoked/expired PIV certificate (per CRL/OCSP
    status), to a cardholder lacking authorization for the door/area, or occurring while the validation
    service is unreachable - enforcing the credential-validity and authorization rules of [NIST SP 800-116
    Rev. 1](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-116r1.pdf). A grant against
    a revoked credential or to an unauthorized cardholder is a direct breach of mediation policy and a
    hallmark of credential misuse or tampering; grants during validation-service outages reveal fail-open
    behavior that an attacker could deliberately induce. (Method: Symbolic Logic; tactic: Isolate.)'
  answer_sources:
  - PACS head-end audit logs
  - Door controller event logs
  - PIV/certificate revocation (CRL/OCSP) logs
  - 'NAI: Physical access control head-end servers, Door controllers, Badge/credential management database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "INDEX=pacs sourcetype IN (pacs_head_end, door_controller) event=access_grant\n| lookup crl_ocsp_status\
      \ cert_id OUTPUT cert_status validation_reachable\n| lookup authz_matrix cardholder door_id OUTPUT\
      \ authorized\n| where cert_status IN (\"revoked\",\"expired\")\n     OR authorized!=\"true\"\n \
      \    OR validation_reachable=\"false\"\n| table _time door_id cardholder cert_id cert_status authorized\
      \ validation_reachable"
- question: Per door, are grant/deny counts, after-hours grant frequency, or antipassback/exception rates
    showing change-point spikes such as a sudden surge of overrides or forced-door events?
  context: 'Tampering and abuse often manifest as a statistical shift at a specific door rather than a
    single rule violation. Build per-door baselines of grant/deny counts, after-hours grant frequency,
    and antipassback/exception rates, and alert on change-point spikes - for example a sudden surge of
    manual overrides or forced-door events - using the methods of [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    A spike in overrides at one door overnight is the kind of pattern that precedes or accompanies physical
    intrusion; a stable per-door series indicates normal operations. This complements the deterministic
    factor/revocation rules by catching abuse that stays within individually-legal events. (Method: Statistical
    Method; tactic: Isolate.)'
  answer_sources:
  - PACS head-end audit logs
  - Door controller event logs
  - PIV/certificate revocation (CRL/OCSP) logs
  - 'NAI: Physical access control head-end servers, Door controllers, Badge/credential management database'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "INDEX=pacs sourcetype IN (pacs_head_end, door_controller)\n| bin _time span=1d\n| stats count(eval(event=\"\
      grant\")) AS grants count(eval(event=\"deny\")) AS denies\n        count(eval(after_hours=\"true\"\
      )) AS ah count(eval(event IN (\"override\",\"forced_door\",\"antipassback\"))) AS exceptions BY\
      \ door_id, _time\n| eventstats avg(exceptions) AS mu stdev(exceptions) AS sd BY door_id\n| eval\
      \ changepoint = cusum_detect(grants, ah, exceptions)\n| where exceptions > mu+3*sd OR changepoint=1\n\
      | table _time door_id grants denies ah exceptions changepoint"
- question: Are there abnormal or out-of-order PACS administrative operations - mass credential additions,
    door-config changes, or schedule edits - occurring alongside anomalous access grants?
  context: 'An attacker who controls the head-end will reconfigure it, and those administrative actions
    form sequences that deviate from normal operations. Model normal PACS administrative log-event sequences
    and parameter values, and flag abnormal or out-of-order admin operations (mass credential additions,
    door-config changes, schedule edits) - especially when concurrent with anomalous grants - applying
    [DeepLog (Du et al.)](https://doi.org/10.1145/3133956.3134015) and surfacing the deviating events
    in the alert. Mass credential additions or schedule edits that fall outside the learned operational
    sequence are strong evidence of mediation-logic tampering; surfacing the exact deviating events lets
    the analyst reconstruct what the attacker changed and reverse it. (Method: Machine Learning; tactic:
    Isolate.)'
  answer_sources:
  - PACS head-end audit logs
  - Door controller event logs
  - PIV/certificate revocation (CRL/OCSP) logs
  - 'NAI: Physical access control head-end servers, Door controllers, Badge/credential management database'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seqs = sessionize(pacs_admin_log, by=admin_session)\nmodel = DeepLog().fit(normal_admin_sequences)\n\
      for s in recent_sessions:\n    for ev in s:\n        if ev not in model.predict_next(s.prefix).topk\
      \ or param_anomaly(ev):\n            emit(session=s, deviating_event=ev, concurrent_grants=grants_near(ev.time))"
- question: Does any identity log on to a PACS management server (or badge into the secure area) without
    a corresponding physical badge entry, or show badge and logon events at geographically incompatible
    locations within an impossible-travel window?
  context: 'Logical access to physical-access infrastructure should be accompanied by real physical presence,
    and a single identity''s physical and logical activity should be geographically consistent. Alert
    when an account interactively logs on to a PACS management server (or badges into the secure area)
    while the same identity has no corresponding badge entry, or shows badge and logon events at incompatible
    locations within an impossible-travel window - fusing logical and physical events as enabled by the
    badge-access fields in the [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).
    A logon with no badge-in suggests remote credential misuse against isolation infrastructure; impossible-travel
    between a badge swipe and a logon points to shared or stolen credentials. A consistent logical/physical
    pairing is exculpatory. (Method: Symbolic Logic; tactic: Isolate.)'
  answer_sources:
  - Badge/physical access logs
  - Windows Event ID 4624
  - VPN/remote-access logs
  - 'NAI: Physical access control management servers, Badge access logs, Identity/HR directory'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=auth (EventID=4624 dest_host IN (pacs_mgmt_servers) logon_type IN (2,10))

      | append [ search INDEX=badge event IN (entry,exit) ]

      | append [ search INDEX=vpn event=connect ]

      | transaction identity maxspan=8h

      | eval no_badge = (logon_present AND NOT badge_entry_present)

      | eval impossible = (dist(badge_site, logon_site) / time_delta_hours > MAX_TRAVEL_SPEED)

      | where no_badge OR impossible

      | table _time identity logon_site badge_site no_badge impossible'
- question: For each identity, does the joint pattern of logical and physical activity (badge-to-logon
    ordering, sites, hours) fall into a low-probability combination relative to that identity's own baseline?
  context: 'Build per-identity baselines of joint logical/physical activity - the typical badge-to-logon
    ordering, the usual sites, and the normal hours - and alert on low-probability combinations using
    the change-point techniques of [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)
    and the edge-rarity baselining of [Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001). Unlike
    the hard impossible-travel rule, this catches subtler drift: an identity that begins logging into
    the PACS at new hours, from new sites, or in a badge/logon order it never used before. A low-probability
    combination is a lead for insider-risk or credential-misuse review; activity that matches the identity''s
    history is reassuring. Run it in parallel with the deterministic correlation rule. (Method: Statistical
    Method; tactic: Isolate.)'
  answer_sources:
  - Badge/physical access logs
  - Windows Event ID 4624
  - VPN/remote-access logs
  - 'NAI: Physical access control management servers, Badge access logs, Identity/HR directory'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX=auth OR INDEX=badge identity=*

      | eval combo = badge_logon_order."|".site."|".strftime(_time,"%H")

      | eventstats count AS combo_count BY identity, combo

      | eventstats count AS total BY identity

      | eval prob = combo_count/total, changepoint = cusum_detect(daily_activity_vector(identity))

      | where prob < 0.02 OR changepoint=1

      | table _time identity combo prob changepoint'
- question: Which identities does a behavioral model rank as highest-risk for insider misuse of physical-access
    systems based on fused logical and physical access features, and what features drive each score?
  context: 'Score insider misuse of physical-access systems by training a behavioral model on fused logical
    and physical access features - badge events, logons, off-hours activity, and role - to rank insider-misuse
    risk and surface the top-3 contributing features per alert. Use the labeled scenarios in the [CERT
    Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/) and explainable
    attribution per [Ha et al.](https://arxiv.org/abs/2205.01930). This is aimed squarely at the insider
    or credential-abuse threat to isolation infrastructure: it fuses signals no single rule captures and
    produces a ranked, explainable queue. A high score with off-hours badge/logon features, for example,
    directs the analyst to a specific identity for review; the explanation distinguishes a legitimate
    role change from genuine misuse. Keep it as a prioritization layer above the deterministic correlation
    and per-door rules. (Method: Machine Learning; tactic: Isolate.)'
  answer_sources:
  - Badge/physical access logs
  - Windows Event ID 4624
  - VPN/remote-access logs
  - 'NAI: Physical access control management servers, Badge access logs, Identity/HR directory'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = fuse(badge_events, logons, offhours_fraction, role) per identity\nmodel = InsiderRiskModel().fit(CERT_insider_threat_dataset)\n\
