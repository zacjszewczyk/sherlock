  - technology: Zeek/pseudocode
    query: |-
      conn.log
      | WHERE resp_h NOT IN internal_space   // external connections
      | stats sum(orig_bytes+resp_bytes) AS bytes, count AS conns BY orig_h
      | join asset_compliance(orig_h) -> compliant?
      | eval z = (bytes - mean(bytes BY compliant_group)) / stdev(...)
      | WHERE compliant==false AND z > 2
      | RANK noncompliant hosts BY exposure DESC for remediation
- question: >-
    Are there rate spikes per cohort in VBS/Credential Guard start failures, HVCI-blocked or known-vulnerable
    driver-load attempts, and Code Integrity 3033/3034 failures?
  context: >-
    Error and failure rates are first-class detection signals, not noise. Per cohort, baseline and alert
    on rate spikes in VBS/Credential Guard start failures, HVCI-blocked or known-vulnerable driver-load
    attempts, and Code Integrity 3033/3034 failure counts. Within the Isolate tactic, a spike in any of
    these failure classes signals either an environmental problem degrading isolation or active adversary
    attempts to load blocked drivers and subvert the control. A stable baseline indicates healthy operation;
    a sudden cohort-wide spike in blocked-driver attempts or start failures warrants investigation for
    either a faulty deployment or coordinated bypass activity. References: [Credential Guard considerations and known issues, Microsoft](https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/considerations-known-issues);
    [Microsoft recommended driver block rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules).
  answer_sources:
  - Win32_DeviceGuard inventory (fleet-wide)
  - Zeek conn.log
  - Asset inventory (CPU generation, firmware, OS build, hardware model)
  - Code Integrity 3033/3034 and blocked-driver counts
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for signal IN ('vbs_start_fail','credguard_start_fail','hvci_blocked_driver','vuln_driver_attempt','ci_3033','ci_3034'):
        stats count AS c BY cohort, day, signal
        baseline = rolling_mean+rolling_stdev(c, 28d) BY cohort, signal
        WHERE c > baseline.mean + 3*baseline.stdev
          ALERT 'failure-rate spike' cohort signal c
- question: >-
    Which currently-noncompliant assets are predicted to be HBPI-ready, and what is the expected remediation
    effort, so rollout can be sequenced to close the largest risk gaps first?
  context: >-
    A supervised classification model can forecast which hosts can be enabled now versus which need hardware/driver
    remediation, accelerating the Isolate tactic's rollout. Train the model on asset characteristics —
    CPU generation, virtualization/SLAT/MBEC support, firmware state, OS build, incompatible-driver presence,
    and prior event telemetry — to predict enablement readiness and expected remediation effort. Use predictions
    to sequence rollout and close the largest risk gaps first. The alert/report MUST list the top-3 features
    driving each prediction so analysts can act (e.g., 'blocked by incompatible driver X', 'firmware update
    required'). A 'ready' prediction enables immediate enforcement; a 'not ready' prediction with named
    blocking features directs the specific remediation needed. References: [Enable memory integrity / HVCI, Microsoft](https://learn.microsoft.com/en-us/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity);
    [Firecracker, Agache et al.](https://www.usenix.org/system/files/nsdi20-paper-agache.pdf).
  answer_sources:
  - Win32_DeviceGuard inventory (fleet-wide)
  - Zeek conn.log
  - Asset inventory (CPU generation, firmware, OS build, hardware model)
  - Code Integrity 3033/3034 and blocked-driver counts
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = [cpu_gen, slat_support, mbec_support, firmware_state, os_build,
                  incompatible_driver_present, prior_start_failures, ci_failure_rate]
      model = Classifier.train(features -> label IN {ready, not_ready})
      for host IN noncompliant:
        pred = model.predict(features(host))
        effort = model.predict_effort(host)
        top3 = shap_top_features(model, host, k=3)   // REQUIRED in output
        EMIT host, pred, effort, top3
      | SEQUENCE rollout BY (pred==ready first, then effort ASC)
- question: >-
    Which hosts deviate from the fleet norm across their full HBPI posture feature vector, per an unsupervised
    Isolation Forest, and what top-3 features explain each anomaly?
  context: >-
    Unsupervised anomaly detection surfaces configuration outliers that labeled rules miss. Run an Isolation
    Forest over per-host posture feature vectors (VBS/HVCI/Credential Guard/DMA-protection status, CPU
    generation, firmware state, OS build, driver-load profile, CI failure rate) to surface hosts deviating
    from the fleet norm without labels. Report the top-3 contributing features (via per-feature path-length
    attribution) in each alert. Within the Isolate tactic, this catches the odd host whose combination
    of attributes is unusual — for example, capable hardware but disabled controls plus an abnormal driver
    profile. Run it in parallel with, never as a replacement for, the deterministic running-state checks.
    A host that scores as a strong outlier with explanatory features is a triage candidate; inliers reflect
    the expected posture. Reference: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).
  answer_sources:
  - Win32_DeviceGuard inventory (fleet-wide)
  - Zeek conn.log
  - Asset inventory (CPU generation, firmware, OS build, hardware model)
  - Code Integrity 3033/3034 and blocked-driver counts
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = per_host_vector[vbs,hvci,credguard,dma_protection, cpu_gen, firmware_state,
                           os_build, driver_load_profile, ci_failure_rate]
      model = IsolationForest(n_estimators=200).fit(X)   // unsupervised, no labels
      score = model.anomaly_score(X)
      top3 = path_length_attribution(model, x, k=3)
      | WHERE score > threshold
      | ALERT 'HBPI posture outlier' host score top3
      // run alongside deterministic running-state checks, never replacing them
