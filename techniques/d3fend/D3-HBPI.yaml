- question: >-
    Do noncompliant (HBPI-off) assets show elevated external connection volume (bytes and connection count)
    compared with compliant cohorts, indicating higher exposure?
  context: >-
    Risk prioritization should weight isolation gaps by how exposed the host is. Measure external connection
    volume (bytes and connection count) from noncompliant assets using Zeek conn.log and compare against
    compliant cohorts. Within the Isolate tactic, a noncompliant host that is also heavily exposed to
    external traffic represents the largest practical risk and should be remediated first. Comparable
    exposure across compliant and noncompliant hosts suggests routine remediation sequencing; noncompliant
    hosts with markedly elevated external exposure are high-priority — they combine a missing isolation
    floor with a large attack surface.
  answer_sources:
  - Win32_DeviceGuard inventory (fleet-wide)
  - Zeek conn.log
