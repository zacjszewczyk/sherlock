name: 'D3-HBPI: Hardware-based Process Isolation'
id: 3d74175d-f4ce-48ef-bf06-7a8908db105b
description: >-
  Investigate the deployment, runtime health, tampering, and bypass of hardware-based process isolation
  (HBPI) controls across the Windows fleet. HBPI primitives such as Virtualization-Based Security (VBS),
  Hypervisor-Enforced Code Integrity (HVCI/memory integrity), Credential Guard, and Kernel DMA Protection
  (IOMMU) use hardware features (MMU/IOMMU, SLAT/MBEC, DMA controls) to prevent one process from reading
  or writing the memory of another and to protect critical OS components. This playbook helps an analyst
  (1) verify that these controls are actually RUNNING — not merely configured — on eligible Domain Controllers,
  critical application servers, and Windows 10/11 endpoints; (2) detect disablement and tampering (Code
  Integrity failures, DeviceGuard/LSA registry changes, bcdedit hypervisor/integrity mutations, boot-component
  downgrade, and post-tamper telemetry silence); (3) detect bypass attempts that defeat the isolation
  primitive itself (Bring-Your-Own-Vulnerable-Driver kernel execution, malicious DMA-capable peripherals
  defeating the IOMMU, and out-of-band attestation mismatches); and (4) measure fleet-wide coverage, exposure,
  and risk to prioritize remediation, including ML-based readiness prediction and configuration-drift
  anomaly detection. State (running vs configured-not-running vs off), start success/failure, and error/failure
  rates are treated as first-class detection signals.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: >-
    Which eligible Windows assets report VBS and HVCI (memory integrity) as actually RUNNING, and which
    report it as off or configured-but-not-running?
  context: >-
    Tactic D3-I (Isolate) depends on hardware-based isolation actually executing, not merely being set
    in policy. Query WMI Win32_DeviceGuard on every eligible host and assert that VirtualizationBasedSecurityStatus
    == 2 (running), that the HVCI value (2) is present in SecurityServicesRunning, and that CodeIntegrityPolicyEnforcementStatus
    >= 1. A status of 0 means VBS is off; a status of 1 means it is configured but not running — both
    are NON-COMPLIANT and represent a host whose memory-isolation floor is absent. Do not infer the running
    state from registry or GPO configuration alone, because configuration can be present while the service
    fails to start. A positive (running) result confirms the deterministic compliance floor; a negative
    result identifies a host whose critical processes are unprotected and must be remediated or investigated
    for tampering. Reference: [Enable memory integrity / HVCI, Microsoft](https://learn.microsoft.com/en-us/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity).
  answer_sources:
  - Windows WMI Win32_DeviceGuard (root\Microsoft\Windows\DeviceGuard)
  - Windows System Event Log (VBS/Credential Guard start)
  - msinfo32 / Device Security
  - 'Registry: HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard, Control\DmaSecurity, Control\Lsa'
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR EACH eligible_host:
        wmi = Get-CimInstance -Namespace root\Microsoft\Windows\DeviceGuard -ClassName Win32_DeviceGuard
        running = (wmi.VirtualizationBasedSecurityStatus == 2)
        hvci = (2 IN wmi.SecurityServicesRunning)
        ci_enforced = (wmi.CodeIntegrityPolicyEnforcementStatus >= 1)
        IF NOT (running AND hvci AND ci_enforced):
          ALERT severity=high host=$host state=wmi.VirtualizationBasedSecurityStatus
          label = (status==0 ? 'off' : status==1 ? 'configured-not-running' : 'other')
- question: >-
    Is Credential Guard running with a live LsaIso.exe isolated process on every host where it should
    be enabled, or is the isolated LSA process missing?
  context: >-
    Credential Guard uses VBS to isolate LSA secrets in a separate, hardware-protected process (LsaIso.exe),
    directly serving the Isolate tactic by preventing credential theft from the normal process memory
    space. Confirm that SecurityServicesRunning contains value 1 (Credential Guard) AND that a live LsaIso.exe
    process exists on the host. On enterprise Windows 11 22H2+ Credential Guard is default-on, so the
    absence of LsaIso on a host that should run it is non-compliant and a candidate tamper indicator.
    A positive result means credentials are isolated in hardware-backed memory; a negative result means
    LSA secrets are exposed to extraction and the isolation control may have been weakened or disabled.
    Reference: [Credential Guard overview, Microsoft](https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/).
  answer_sources:
  - Windows WMI Win32_DeviceGuard (root\Microsoft\Windows\DeviceGuard)
  - Windows System Event Log (VBS/Credential Guard start)
  - msinfo32 / Device Security
  - 'Registry: HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard, Control\DmaSecurity, Control\Lsa'
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR EACH host WHERE should_run_credguard(host):
        wmi = Win32_DeviceGuard(host)
        cg_running = (1 IN wmi.SecurityServicesRunning)
        lsaiso = process_exists(host, 'LsaIso.exe')
        IF NOT (cg_running AND lsaiso):
          ALERT severity=high host=$host reason='Credential Guard not isolated / LsaIso missing'
- question: >-
    Is Kernel DMA Protection (IOMMU) On for hosts with DMA-capable Thunderbolt/PCIe ports, or are those
    hosts exposed to direct-memory-access attacks against memory isolation?
  context: >-
    Kernel DMA Protection uses the IOMMU to give I/O devices their own virtual address space, preventing
    malicious peripherals from directly reading or writing host memory and thereby defeating process isolation.
    Confirm Kernel DMA Protection is On via msinfo32 ('Kernel DMA Protection: On') or the DmaSecurity
    registry key. Hosts that expose DMA-capable Thunderbolt or PCIe ports but have DMA Protection Off
    are exposed to DMA attacks that can bypass the memory-isolation guarantee entirely. A positive result
    confirms the IOMMU-backed isolation is active; a negative result identifies hosts that should be physically
    secured and remediated, especially mobile/laptop assets with external ports. Reference: [Kernel DMA Protection, Microsoft](https://learn.microsoft.com/en-us/windows/security/hardware-security/kernel-dma-protection-for-thunderbolt).
  answer_sources:
  - Windows WMI Win32_DeviceGuard (root\Microsoft\Windows\DeviceGuard)
  - Windows System Event Log (VBS/Credential Guard start)
  - msinfo32 / Device Security
  - 'Registry: HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard, Control\DmaSecurity, Control\Lsa'
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR EACH host:
        dma_on = (msinfo32.'Kernel DMA Protection' == 'On')
               OR registry(host,'HKLM\\SYSTEM\\CurrentControlSet\\Control\\DmaSecurity').enabled
        has_dma_ports = host.thunderbolt_or_external_pcie
        IF has_dma_ports AND NOT dma_on:
          ALERT severity=medium host=$host reason='DMA-capable ports without Kernel DMA Protection'
- question: >-
    Within each policy window, are the expected VBS/Credential Guard successful-start events present per
    cohort, and is the start-FAILURE rate elevated relative to baseline?
  context: >-
    Point-in-time configuration can look correct while VBS or Credential Guard repeatedly fails to start
    at boot, leaving isolation degraded. Within each policy window, count expected successful-start events
    versus start failures from the System log, stratified by cohort (OU, OS build, CPU generation). Missing
    expected start events or an elevated start-failure rate is a State signal that flags degraded isolation
    independent of current config. A normal profile (expected starts present, failures near baseline)
    indicates healthy isolation; a profile of missing starts or a failure spike indicates a cohort whose
    hardware isolation is intermittently or persistently unavailable, warranting driver/firmware investigation.
    Reference: [Credential Guard considerations and known issues, Microsoft](https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/considerations-known-issues).
  answer_sources:
  - Windows WMI Win32_DeviceGuard (root\Microsoft\Windows\DeviceGuard)
  - Windows System Event Log (VBS/Credential Guard start)
  - msinfo32 / Device Security
  - 'Registry: HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard, Control\DmaSecurity, Control\Lsa'
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      from System.evtx WHERE provider IN ('Microsoft-Windows-DeviceGuard','VBS','CredentialGuard')
      | eval outcome = (event=='start_success' ? 'success' : event=='start_failure' ? 'failure' : null)
      | bin policy_window
      | stats count(success) AS starts, count(failure) AS fails BY cohort(OU,os_build,cpu_gen), policy_window
      | eval fail_rate = fails / (starts+fails)
      | WHERE starts < expected_starts(cohort) OR fail_rate > baseline_rate(cohort)*1.5
      | ALERT 'degraded isolation start profile'
- question: >-
    Are there bursts of Code Integrity failure events (Event ID 3033/3034) correlated with unexpected
    reboots (System Event ID 41) and a subsequent loss of the VBS running state?
  context: >-
    Adversaries who weaken HVCI-dependent protections, or whose malicious/unsigned drivers are blocked,
    generate Code Integrity events: 3033 (a page failed an integrity check) and 3034 (an unsigned or blocked
    image was prevented from loading). Within the Isolate tactic, a burst of 3033/3034 followed by a reboot
    (Event ID 41) and a transition out of the running state from the runtime-verification action indicates
    degraded or removed isolation. Monitor for these events and correlate them temporally. An isolated
    3034 may simply be a blocked bad driver (the control working); a burst followed by reboot and loss
    of running state is a strong indicator of attempted or successful subversion of memory integrity.
    Reference: [Enable memory integrity / HVCI, Microsoft](https://learn.microsoft.com/en-us/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity).
  answer_sources:
  - Windows Code Integrity Event ID 3033, 3034
  - Windows System Event ID 41
  - Sysmon Event ID 1 (process_creation), Event ID 13 (registry)
  - Windows Security 4657 (registry value change)
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days; correlate events within a 24-hour window around each reboot
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ci = events WHERE log='Microsoft-Windows-CodeIntegrity' AND EventID IN (3033,3034)
      reboot = events WHERE log='System' AND EventID==41
      | stats count AS ci_burst BY host, window=1h WHERE ci_burst >= N
      | join reboot ON host WITHIN 24h AFTER burst
      | join vbs_state_loss(host) ON host AFTER reboot   // status drops from 2
      | ALERT severity=high 'CI failure burst + reboot + VBS loss => isolation removed'
- question: >-
    Has any process written DeviceGuard or LSA registry values to disable VBS, HVCI, or Credential Guard,
    especially outside change windows or by non-management tooling?
  context: >-
    Disabling the configuration of hardware isolation is a direct attack on the Isolate tactic. Alert
    on writes (Sysmon Event ID 13 / Security 4657) to HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\*
    — specifically EnableVirtualizationBasedSecurity or HypervisorEnforcedCodeIntegrity set to 0 — and
    to HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LsaCfgFlags set to 0. Writes occurring outside approved
    change windows, or originating from non-management/non-MDM tooling, are high-suspicion. A legitimate,
    change-managed update may explain a write; an out-of-band write that sets these values to 0 is a likely
    attempt to remove isolation prior to credential theft or kernel manipulation. Reference: [Credential Guard considerations and known issues, Microsoft](https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/considerations-known-issues).
  answer_sources:
  - Windows Code Integrity Event ID 3033, 3034
  - Windows System Event ID 41
  - Sysmon Event ID 1 (process_creation), Event ID 13 (registry)
  - Windows Security 4657 (registry value change)
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      reg = events WHERE source IN ('Sysmon EID 13','Security 4657')
        AND ( TargetObject MATCHES 'HKLM\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\*'
              AND value_name IN ('EnableVirtualizationBasedSecurity','HypervisorEnforcedCodeIntegrity') AND new_value==0 )
           OR ( TargetObject MATCHES '...\\Control\\Lsa\\LsaCfgFlags' AND new_value==0 )
      | WHERE NOT in_change_window(time) OR process NOT IN approved_mgmt_tools
      | ALERT severity=high 'HBPI config disabled via registry'
- question: >-
    Did any process invoke bcdedit with hypervisor/integrity-disabling arguments, and was it followed
    by a reboot and a transition of VBS to status 0?
  context: >-
    bcdedit can disable the hypervisor that underpins VBS and the integrity checks that protect the boot
    path. Match process_creation events (Sysmon Event ID 1 / Security 4688) for bcdedit.exe with arguments
    such as 'hypervisorlaunchtype off', 'vsmlaunchtype off', 'nointegritychecks on', or 'set nx AlwaysOff'.
    Correlate with a subsequent reboot (Event ID 41) and a transition to VBS status 0 to confirm successful
    disablement of hardware isolation. Within the Isolate tactic this sequence is a classic precursor
    to bootkit installation and credential/kernel attacks. A match without follow-on state change may
    be a mistimed admin action; the full chain (command + reboot + state loss) confirms isolation was
    deliberately turned off. References: [Credential Guard considerations and known issues, Microsoft](https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/considerations-known-issues);
    [BlackLotus UEFI Bootkit, ESET](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/).
  answer_sources:
  - Windows Code Integrity Event ID 3033, 3034
  - Windows System Event ID 41
  - Sysmon Event ID 1 (process_creation), Event ID 13 (registry)
  - Windows Security 4657 (registry value change)
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days; correlate bcdedit execution with reboot within 24 hours
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      proc = events WHERE source IN ('Sysmon EID 1','Security 4688') AND image ENDSWITH 'bcdedit.exe'
        AND command_line MATCHES_ANY('hypervisorlaunchtype off','vsmlaunchtype off','nointegritychecks on','set nx AlwaysOff')
      | join reboot(EventID 41) ON host WITHIN 24h
      | join vbs_status_transition(host -> 0) AFTER reboot
      | ALERT severity=high 'bcdedit disabled hypervisor/integrity => VBS off'
- question: >-
    Are there writes to the EFI System Partition, downgrades of bootmgr/bootmgfw.efi to old-but-signed
    versions, Secure Boot policy changes, or loads of revoked/known-vulnerable boot binaries?
  context: >-
    Bootkits such as BlackLotus downgrade boot components to vulnerable-but-signed versions to defeat
    Secure Boot and subsequently disable HVCI, BitLocker, and Defender — destroying the hardware-isolation
    foundation. Monitor EFI System Partition writes and bootmgr/bootmgfw.efi version drift (downgrade
    to old-but-signed binaries), Secure Boot policy changes, and revoked or known-vulnerable boot-binary
    hashes. Within the Isolate tactic these events precede the disablement of HBPI controls. A positive
    finding — an unexpected ESP write or a known-vulnerable boot binary — is a high-confidence indicator
    of bootkit activity that will undermine all downstream isolation guarantees; a clean, version-stable
    boot chain supports continued trust in the host's reported state. Reference: [BlackLotus UEFI Bootkit, ESET](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/).
  answer_sources:
  - Windows Code Integrity Event ID 3033, 3034
  - Windows System Event ID 41
  - Sysmon Event ID 1 (process_creation), Event ID 13 (registry)
  - Windows Security 4657 (registry value change)
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      esp = events WHERE write_path MATCHES 'EFI System Partition' OR file IN ('bootmgr','bootmgfw.efi')
      | eval downgrade = (new_version < prior_version AND is_signed(new))
      | union (events WHERE EventID == secure_boot_policy_change)
      | union (file_hash IN revoked_or_known_vulnerable_boot_hashes)
      | ALERT severity=high 'boot-component downgrade / vulnerable boot binary (bootkit precursor)'
- question: >-
    After a driver load or reboot, did a host's Code Integrity / VBS event volume drop below its expected
    lower bound, indicating 'unnatural silence' from suppressed controls?
  context: >-
    When controls are disabled and telemetry is suppressed, the giveaway is often the absence of expected
    events rather than a malicious event. Baseline each host's expected Code Integrity / VBS event volume
    and alert when the volume drops below the lower prediction-interval bound following a driver load
    or reboot. Within the Isolate tactic, this 'unnatural silence' is a hallmark of controls being switched
    off and their telemetry quieted. A volume within the normal band is reassuring; a sudden drop to near-zero
    after a driver load or reboot suggests the isolation telemetry pipeline — and possibly the controls
    themselves — has been disabled, and the host should be triaged out-of-band. Reference: [An In-Depth Look at Windows Kernel Threats, Trend Micro](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf).
  answer_sources:
  - Windows Code Integrity Event ID 3033, 3034
  - Windows System Event ID 41
  - Sysmon Event ID 1 (process_creation), Event ID 13 (registry)
  - Windows Security 4657 (registry value change)
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days; compare pre/post each driver-load or reboot event
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = per_host_expected_volume(log IN ('CodeIntegrity','VBS'), window=hourly)
      observed = count(events) BY host, hour
      | join driver_load/reboot markers BY host
      | WHERE hour AFTER (driver_load OR reboot)
        AND observed < baseline.lower_prediction_interval
      | ALERT severity=high 'unnatural telemetry silence after driver-load/reboot'
- question: >-
    Did any host load a known vulnerable or malicious driver (matching LOLDrivers hashes) or register
    such a kernel service, and is the HVCI vulnerable-driver blocklist enabled?
  context: >-
    Bring-Your-Own-Vulnerable-Driver (BYOVD) is the dominant path to kernel code execution used to disable
    hardware isolation from the inside. Match driver loads (Sysmon Event ID 6) and newly registered kernel
    services (Event ID 7045) against known vulnerable/malicious driver hashes (SHA256/SHA1/MD5), and verify
    the HVCI vulnerable-driver blocklist is enabled (HKLM\SYSTEM\CurrentControlSet\Control\CI\Config\VulnerableDriverBlocklistEnable
    == 1). Loads from user-writable paths or of blocklisted drivers are attempts to gain kernel code execution
    to defeat the Isolate tactic. A hash match on a vulnerable driver, especially from a user-writable
    path with the blocklist disabled, is a high-confidence bypass attempt; a clean signed driver from
    a trusted path with the blocklist enabled is expected. References: [LOLDrivers](https://www.loldrivers.io/);
    [Sigma: Vulnerable Driver Load](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/driver_load/driver_load_win_vuln_drivers.yml);
    [Microsoft recommended driver block rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules).
  answer_sources:
  - Sysmon Event ID 6 (driver load)
  - Windows Security Event ID 7045 (new kernel service)
  - PnP / device-enumeration logs (Microsoft-Windows-Kernel-PnP, DriverFrameworks-UserMode)
  - TPM measured boot / out-of-band attestation
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      drv = events WHERE source IN ('Sysmon EID 6','Security 7045')
      | eval bad = hash(SHA256|SHA1|MD5) IN loldrivers_blocklist
      | eval risky_path = image_path MATCHES user_writable_path
      | eval blocklist_on = registry('HKLM\\SYSTEM\\CurrentControlSet\\Control\\CI\\Config\\VulnerableDriverBlocklistEnable')==1
      | WHERE bad OR risky_path OR NOT blocklist_on
      | ALERT severity=high 'BYOVD / vulnerable driver load attempt'
- question: >-
    Was a new PCIe/Thunderbolt device enumerated and immediately bound to a driver/kernel-module load
    on hot-plug, with an unknown or spoofed device identifier?
  context: >-
    Malicious DMA-capable hardware defeats IOMMU-based isolation by directly accessing host memory. Flag
    new PCIe/Thunderbolt device enumeration correlated with a device-bound driver or kernel-module load
    on hot-plug. Maintain an allow-list of expected device class GUID / VID / PID values and alert on
    unknown or spoofed identifiers — duplicate serials or mismatched VID/PID are the signature of DMA-attack
    hardware. Within the Isolate tactic, this catches an adversary attempting to bypass memory isolation
    via physical/peripheral access rather than software. An allow-listed device hot-plug is normal; an
    unknown or spoofed device that immediately loads a driver is a strong DMA-attack indicator, particularly
    when Kernel DMA Protection is also Off. References: [Thunderclap, Markettos et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_05A-1_Markettos_paper.pdf);
    [Kernel DMA Protection, Microsoft](https://learn.microsoft.com/en-us/windows/security/hardware-security/kernel-dma-protection-for-thunderbolt).
  answer_sources:
  - Sysmon Event ID 6 (driver load)
  - Windows Security Event ID 7045 (new kernel service)
  - PnP / device-enumeration logs (Microsoft-Windows-Kernel-PnP, DriverFrameworks-UserMode)
  - TPM measured boot / out-of-band attestation
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      dev = events WHERE provider IN ('Microsoft-Windows-Kernel-PnP','DriverFrameworks-UserMode') AND action=='device_enumerated'
        AND bus IN ('PCIe','Thunderbolt')
      | join driver_or_kmod_load ON device WITHIN hotplug_window
      | eval known = (device.ClassGUID,VID,PID) IN allow_list
      | eval spoofed = duplicate_serial(device) OR mismatched(VID,PID)
      | WHERE NOT known OR spoofed
      | ALERT severity=high 'possible DMA-attack peripheral defeating IOMMU'
- question: >-
    Does the host's in-OS reported isolation state agree with an independent vantage (TPM measured-boot
    PCRs or external coprocessor hashing of kernel regions), or does external attestation show tampering?
  context: >-
    A compromised host can lie about its own state. Cross-check the host's in-OS reported isolation state
    against an independent vantage: TPM measured-boot PCR values, or hypervisor-external / coprocessor-based
    hashing of immutable kernel text and modules. Within the Isolate tactic, a host that reports controls
    as running while external attestation shows tampered kernel text or unexpected modules is a high-confidence
    subversion that purely in-OS checks would miss. Agreement between in-OS and external state supports
    trust; a mismatch — especially tampered kernel regions with a 'healthy' self-report — indicates the
    host is compromised and its telemetry can no longer be trusted. References: [Copilot, Petroni et al.](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf);
    [VMwatcher, Jiang et al.](https://www.cs.purdue.edu/homes/dxu/pubs/CCS07.pdf).
  answer_sources:
  - Sysmon Event ID 6 (driver load)
  - Windows Security Event ID 7045 (new kernel service)
  - PnP / device-enumeration logs (Microsoft-Windows-Kernel-PnP, DriverFrameworks-UserMode)
  - TPM measured boot / out-of-band attestation
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      in_os = Win32_DeviceGuard(host).running_state
      external = attestation(host)  // TPM measured-boot PCRs OR coprocessor hash of kernel text/modules
      | WHERE in_os == 'running' AND external.kernel_integrity == 'tampered'
      | ALERT severity=critical 'in-OS healthy but external attestation shows tampered kernel => subversion'
- question: >-
    Did a freshly loaded, rare driver receive a spike of DeviceIoControl/IOCTL traffic shortly after a
    7045 service-create, indicating active kernel exploitation of a BYOVD driver?
  context: >-
    Loading a vulnerable driver is only step one; exploitation shows up as anomalous IOCTL traffic to
    that driver. Baseline per-host driver-load frequency (count/day) and DeviceIoControl/IOCTL volume
    to newly registered drivers. Within the Isolate tactic, a spike of IOCTLs to a freshly loaded, rare
    driver (a combined Volume + Frequency signal) following a 7045 service create indicates active kernel
    exploitation of a BYOVD driver to manipulate or disable isolation. Low, steady IOCTL volume to established
    drivers is normal; a burst of IOCTLs to a brand-new, rarely seen driver immediately after its service
    creation is a strong indicator of in-progress kernel exploitation. Reference: [An In-Depth Look at Windows Kernel Threats, Trend Micro](https://documents.trendmicro.com/assets/white_papers/wp-an-in-depth-look-at-windows-kernel-threats.pdf).
  answer_sources:
  - Sysmon Event ID 6 (driver load)
  - Windows Security Event ID 7045 (new kernel service)
  - PnP / device-enumeration logs (Microsoft-Windows-Kernel-PnP, DriverFrameworks-UserMode)
  - TPM measured boot / out-of-band attestation
  - 'NAI: Domain Controllers, Critical Application Servers, All Windows 10/11 Endpoints'
  range: Last 90 days; correlate IOCTL volume within hours of each 7045 service-create
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      new_drv = events WHERE EventID==7045 -> driver, host, t0
      ioctl = events WHERE op=='DeviceIoControl' BY host, driver, time
      | stats count AS ioctl_count BY host, driver, window=1h
      | eval rarity = global_prevalence(driver)
      | WHERE driver IN new_drv AND rarity LOW AND ioctl_count > baseline(host)+k*stdev AND time WITHIN hours_after(t0)
      | ALERT severity=high 'IOCTL spike to fresh rare driver => active kernel exploitation'
- question: >-
    What percentage of eligible Windows systems have verified RUNNING HBPI (VBS status 2 + HVCI + Credential
    Guard), stratified by OU, OS build, CPU generation, and hardware model?
  context: >-
    Coverage measurement quantifies how well the Isolate tactic is actually realized across the fleet.
    Compute the percentage of eligible Windows systems with verified RUNNING HBPI (VBS status 2 plus HVCI
    plus Credential Guard), stratified by OU, OS build, CPU generation, and hardware model. Track cohort-level
    compliance trends over time and highlight persistently lagging segments for targeted remediation.
    High and rising coverage across cohorts indicates strong isolation posture; a persistently low cohort
    (for example, an old CPU generation or a particular OU) reveals a systemic gap where critical processes
    remain unprotected and should be prioritized for upgrade or policy enforcement. Reference: [Enable memory integrity / HVCI, Microsoft](https://learn.microsoft.com/en-us/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity).
  answer_sources:
