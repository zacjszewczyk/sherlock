name: 'D3-TB: Token Binding'
id: 9ac9e7db-d29f-40ed-8bd4-6809a76c1cd6
description: Investigate whether token binding (and its modern equivalents) is supported and enforced
  across critical, internet-facing web applications, and detect attempts to strip, downgrade, or bypass
  that binding to enable token theft and replay. Token binding cryptographically ties a security token
  (session cookie, OAuth/refresh token) to the client's TLS connection so that an exported token cannot
  be replayed from another machine. This playbook helps an analyst (1) build and maintain an adoption
  inventory of the 'Sec-Token-Binding' header (RFC 8473) and, for OAuth APIs, the 'DPoP' header and access-token
  cnf.jkt thumbprint (RFC 9449) per host/URI from first-party HTTP, proxy, and IdP logs; (2) flag tokens
  presented without a matching binding, negotiation downgrades, and adversary-in-the-middle (AiTM) relay
  sessions using deterministic symbolic-logic rules; (3) quantify enforcement with volume/ratio and failure-rate
  statistics; and (4) layer machine-learning forecasting, AiTM-relay classification, non-browser TLS-stack
  detection, and replayed-token behavioral modeling in parallel. The goal is to surface sensitive applications
  that do not enforce binding and to catch token-export/replay attempts characteristic of sophisticated
  external actors, commodity phishing kits, and insiders.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: For every host and URI serving authenticated traffic, does the application emit the 'Sec-Token-Binding'
    header (RFC 8473), or for OAuth resource servers the 'DPoP' request header plus an access-token cnf/jkt
    thumbprint (RFC 9449), and is any allowlisted sensitive application serving authenticated sessions
    WITHOUT that header on more than 1% of requests?
  context: 'This is the core adoption-inventory question for the Harden tactic: you cannot enforce token
    binding on apps that never negotiate it. Enumerate all unique host+URI combinations from Zeek http.log
    and web/reverse-proxy access logs and record whether the token-binding or DPoP headers appear. Maintain
    a per-application allowlist of services that MUST enforce binding (those handling sensitive data).
    A positive finding (an allowlisted app serving >1% of authenticated requests with no binding header)
    indicates either a misconfiguration, an incomplete rollout, or active stripping by an intermediary,
    all of which leave session tokens exportable and replayable. A negative result builds confidence that
    the protected surface is covered.'
  answer_sources:
  - Zeek http.log
  - Web server / reverse-proxy access logs
  - IdP sign-in / audit logs (Entra, Okta, Auth0)
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  read http.log\n  | group by host, uri\n  | flag has_binding = any(header['Sec-Token-Binding']\
      \ present) OR any(header['DPoP'] present AND access_token.cnf.jkt present)\n  | join allowlist on\
      \ host\n  | where allowlist.must_enforce == true AND (count(authenticated AND NOT has_binding) /\
      \ count(authenticated)) > 0.01\n  | alert"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=web_proxy OR index=idp\n  | stats count(eval(binding_header!=\"\")) as bound,\
      \ count as total by app, host, uri\n  | eval unbound_ratio=(total-bound)/total\n  | lookup sensitive_app_allowlist\
      \ app OUTPUT must_enforce\n  | where must_enforce=true AND unbound_ratio>0.01"
- question: Is any authenticated cookie or token being presented over a connection whose TokenBindingID
    does not match the ID bound at issuance, or any DPoP-bound token whose proof-key thumbprint differs
    from the access-token jkt, or any duplicate DPoP jti or stale proof iat (clock skew greater than 60
    seconds)?
  context: These are deterministic token-export and replay signals. Following the legitimate-session model
    from Cookie Crumbles (Squarcina et al., USENIX 2023) and RFC 8471/RFC 9449, a token is only valid
    when presented over the same cryptographic binding established at issuance. A TokenBindingID mismatch,
    a DPoP proof signed by a key that is not the one bound to the access token, a replayed jti, or a proof
    timestamp outside the acceptable skew window are all unambiguous evidence that a token has been exfiltrated
    and replayed from a different client, the defining behavior of token theft by AiTM phishing kits and
    infostealers. Any hit warrants immediate session/refresh-token revocation triage.
  answer_sources:
  - Zeek http.log
  - Web server / reverse-proxy access logs
  - IdP sign-in / audit logs (Entra, Okta, Auth0)
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days; pivot to the full session lifetime around any hit
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=idp OR index=web_proxy\n  | eval mismatch = (presented_tbid != issued_tbid)\n\
      \      OR (dpop_proof_jkt != access_token_jkt)\n      OR (dpop_jti seen_before within 5m)\n    \
      \  OR (abs(now - dpop_proof_iat) > 60)\n  | where mismatch=true\n  | alert severity=high"
- question: Are there TLS handshakes where the client offers the 'token_binding' TLS extension but the
    ServerHello from a known token-binding-supporting service omits it, and do these correlate with TLS_FALLBACK_SCSV
    (cipher 0x5600), 'inappropriate_fallback' alerts, or renegotiation/version-rollback patterns?
  context: Per RFC 8472 (Token Binding Negotiation), binding only takes effect when both client and server
    advertise the extension. An adversary-in-the-middle can strip the server's negotiation to silently
    disable binding, so a client offering token_binding to a service known to support it that does not
    echo it in the ServerHello is a strong extension-stripping signal. Corroborating downgrade dances
    with TLS_FALLBACK_SCSV and 'inappropriate_fallback' alerts (RFC 7507) and the rollback patterns catalogued
    in RFC 7457 raises confidence that the omission is an active AiTM downgrade rather than a benign server
    limitation. Inspect Zeek ssl.log for the offered-vs-accepted extension delta.
  answer_sources:
  - Zeek ssl.log
  - Web server / reverse-proxy access logs
  - IdP sign-in / audit logs (Entra, Okta, Auth0)
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  read ssl.log\n  | where 'token_binding' in client_extensions AND server in known_supporting_services\n\
      \  | where 'token_binding' NOT in server_extensions\n  | join conn.log on uid\n  | enrich fallback\
      \ = (cipher == 0x5600) OR (alert == 'inappropriate_fallback')\n  | alert reason='token_binding extension\
      \ stripped'"
- question: Is a session or refresh token that was previously observed as bound now being replayed from
    a new ASN, device, or user-agent, issued without interactive authentication, or reused across impossible-travel
    locations?
  context: Drawing on the Microsoft Token Theft Playbook, this question hunts for the downstream use of
    stolen bound tokens at the identity provider. A token that was bound at issuance but is later presented
    from a different network origin, device fingerprint, or user-agent, or that appears without the expected
    interactive auth event, or that is used from two geographically impossible locations within a short
    window, indicates the binding was bypassed or the token was lifted post-issuance. Positive findings
    should trigger session and refresh-token revocation and an investigation of the originating phishing/AiTM
    infrastructure.
  answer_sources:
  - IdP sign-in / audit logs (Entra, Okta, Auth0)
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=idp signin\n  | lookup bound_token_baseline token_id OUTPUT prior_asn prior_device\
      \ prior_ua\n  | eval anomaly = (asn!=prior_asn) OR (device!=prior_device) OR (user_agent!=prior_ua)\
      \ OR (interactive_auth=false) OR impossible_travel(prev_geo,geo,time_delta)\n  | where anomaly=true\n\
      \  | alert"
- question: At protected SSO portals, are there clients presenting a browser user-agent whose JA3/JA3S
    TLS fingerprint lacks the token_binding extension or matches a known relay/non-browser stack?
  context: JA3/JA3S TLS fingerprinting (native in Zeek ssl.log) lets you reconcile what a client claims
    to be (its HTTP user-agent) with how its TLS stack actually behaves. Genuine browsers negotiating
    against a token-binding portal produce recognizable fingerprints that include the token_binding extension.
    A client advertising a browser user-agent but whose JA3 omits token_binding, or matches a known phishing-relay
    or scripting library, is likely an AiTM proxy or automated tool impersonating a browser. Maintain
    allow/deny and rare-fingerprint lists per portal and alert on mismatches, which often precede or accompany
    token-replay attempts.
  answer_sources:
  - Zeek ssl.log
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  read ssl.log\n  | join http.log on uid for user_agent\n  | where dest in protected_sso_portals\n\
      \  | eval claims_browser = ua_is_browser(user_agent)\n  | where claims_browser AND ('token_binding'\
      \ NOT in ja3_extensions OR ja3 in known_relay_fingerprints OR ja3 in rare_fingerprints)\n  | alert"
- question: For each application, what is the daily ratio of token-bound connections to total authenticated
    connections (and the bound-vs-unbound negotiation ratio), and is any app's bound ratio more than 3
    standard deviations below its 30-day per-app mean?
  context: Adoption is not static, so trend the enforcement ratio rather than checking it once. Compute,
    per app per day, the fraction of authenticated connections that carry a binding header/extension and
    the bound-vs-legacy negotiation ratio. A protected app drifting toward an unbound profile (a ratio
    dropping >3 sigma below its own 30-day baseline) signals stripping, a failed deployment, or misconfiguration,
    mirroring the legacy-support ratio-tracking rationale of DROWN (Aviram et al., USENIX 2016). Derive
    the threshold per dataset; a sustained drop is more meaningful than a single-day blip.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Windows Event ID 36880 (Schannel)
  - IdP sign-in / audit logs
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ssl OR index=http\n  | bin _time span=1d\n  | stats count(eval(binding_present))\
      \ as bound, count as total by app, _time\n  | eval ratio=bound/total\n  | eventstats avg(ratio)\
      \ as mu stdev(ratio) as sd by app (last 30d)\n  | where ratio < mu - 3*sd\n  | alert"
- question: Has the distribution of negotiated key parameters or of client user-agents/JA3 fingerprints
    that negotiate token binding shifted abruptly for any app, for example a greater-than-50% drop in
    bound connections for a specific browser or version within an hour?
  context: Beyond the aggregate ratio, the composition of the bound-client population is diagnostic. Track
    the distribution of negotiated key parameters and of JA3 fingerprints/user-agents that successfully
    negotiate token binding per app. An abrupt population shift, such as one browser/version suddenly
    ceasing to negotiate binding, points to a platform-wide regression (a bad update) or a targeted evasion
    in which an attacker isolates and strips binding for a particular client cohort. Hour-over-hour change
    detection on the per-client bound counts surfaces these events quickly.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Windows Event ID 36880 (Schannel)
  - IdP sign-in / audit logs
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days; hour-over-hour change detection
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ssl\n  | bin _time span=1h\n  | stats count(eval(binding_present)) as bound by\
      \ app, ja3, user_agent, _time\n  | delta bound as d by app, ja3, user_agent\n  | eval pct_drop =\
      \ -d / prev_bound\n  | where pct_drop > 0.5\n  | alert"
- question: Are there spikes in TLS handshake-failure or 'inappropriate_fallback' counts per server, or
    in DPoP 4xx responses ('invalid_dpop_proof', 'use_dpop_nonce') per app/client, that exceed the established
    baseline?
  context: Treat failures as first-class detection signals rather than noise. Baseline and alert on increases
    in TLS handshake failures and 'inappropriate_fallback' events (RFC 7507) per server, and in DPoP-related
    4xx error codes (RFC 9449) per app and client. A sustained failure spike localized to a single app
    or a single source ASN indicates downgrade attempts, replayed or forged DPoP proofs, or an AiTM struggling
    to reproduce valid bindings. Per-server and per-ASN baselining keeps benign client churn from drowning
    out the localized spikes that matter.
  answer_sources:
  - Zeek ssl.log
  - Windows Event ID 36880 (Schannel)
  - IdP sign-in / audit logs
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  (index=ssl handshake_failure) OR (index=schannel EventID=36880) OR (index=idp dpop_error\
      \ IN ('invalid_dpop_proof','use_dpop_nonce'))\n  | bin _time span=1h\n  | stats count as failures\
      \ by server, src_asn, app, _time\n  | eventstats avg(failures) as mu stdev(failures) as sd by server\
      \ (last 14d)\n  | where failures > mu + 3*sd\n  | alert"
- question: Do per-app flow features (byte counts, request/response byte ratios, packet counts, handshake
    duration) or offered-extension sets for connections to protected apps diverge more than 3 sigma from
    the application baseline, consistent with an AiTM relay terminating and re-originating TLS?
  context: An adversary-in-the-middle relay must terminate the client's TLS and re-originate a new connection
    to the real server, which perturbs the observable flow shape. Baseline per-app flow features and offered-extension
    sets from Zeek ssl.log/conn.log and alert when a connection's volume/flow profile diverges >3 sigma
    from the app baseline, per Deciphering Malware's use of TLS (Anderson et al.). This statistical separation
    catches relays even when they otherwise mimic browser headers, complementing the deterministic mismatch
    rules and the JA3 fingerprinting checks.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  read conn.log, ssl.log\n  | where dest in protected_apps\n  | features: orig_bytes,\
      \ resp_bytes, byte_ratio, orig_pkts, resp_pkts, tls_handshake_duration, offered_extension_set\n\
      \  | baseline per app over 30d\n  | score = mahalanobis(features, app_baseline)\n  | where score\
      \ > 3sigma\n  | alert"
- question: Does the observed hourly count of token-bound connections (and negotiation rate) per app fall
    outside the 99% prediction interval of a seasonal time-series forecast, indicating large-scale bypass,
    outage, or downgrade?
  context: Build a seasonal time-series model (Prophet or SARIMA) of hourly token-bound connection counts
    and negotiation rates per app, then alert when observed volume escapes the 99% prediction interval,
    per Cloud Intrusion Detection Using Time Series Forecasting. Unlike a static threshold, the forecast
    accounts for daily/weekly seasonality so it can distinguish a genuine anomaly (a sudden collapse in
    bound traffic) from normal business-hours ebb and flow. Alert text must include observed-vs-forecast
    values, the residual magnitude, and the dominant seasonality/feature so the analyst can quickly judge
    whether the dip reflects an attack, an outage, or a downgrade.
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek conn.log
  - IdP sign-in / audit logs
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days; hourly granularity with seasonal model
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ssl OR index=http\n  | bin _time span=1h | stats count(eval(binding_present))\
      \ as bound by app, _time\n  | model: Prophet/SARIMA per app -> yhat, yhat_lower(99%), yhat_upper(99%)\n\
      \  | where bound < yhat_lower OR bound > yhat_upper\n  | eval residual = bound - yhat\n  | alert\
      \ include='observed,yhat,residual,dominant_seasonality'"
- question: Do sessions reaching protected apps classify as AiTM relays on relay-indicative features (added
    round-trip latency, TLS certificate/cipher discrepancies, request-header signatures), and does that
    relay classification co-occur with a token-binding mismatch?
  context: 'Train a PHOCA-style classifier on relay-indicative features for sessions reaching protected
    apps, per Catching Transparent Phish (Kondracki et al., CCS 2021). Because an AiTM relay cannot reproduce
    the legitimate client''s TokenBindingID, the highest-confidence detections come from fusing the ML
    relay verdict with the deterministic binding-mismatch rule: when both fire on the same session you
    have strong evidence of a transparent-phishing token-theft attempt. Surface the top-3 contributing
    features in the alert so the analyst can validate the relay determination (e.g., excess latency plus
    a mismatched server certificate).'
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek conn.log
  - IdP sign-in / audit logs
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  features per session: added_rtt, cert_mismatch, cipher_discrepancy, header_signature\n\
      \  | relay_score = phoca_classifier(features)\n  | join binding_mismatch_events on session_id\n\
      \  | where relay_score > 0.8 AND binding_mismatch == true\n  | alert severity=critical include=top3_features"
- question: At protected SSO portals, are there clients that claim a browser user-agent but whose TLS
    handshake and flow features (offered cipher order, advertised extensions including token_binding,
    version, byte/packet volumes) classify as a non-browser stack?
  context: Use a supervised handshake+flow classifier over Zeek ssl.log/conn.log to detect clients impersonating
    browsers, per Deciphering Malware's use of TLS (Anderson et al.). Where the JA3 rule looks for exact
    known-bad fingerprints, the ML model generalizes across the full handshake and flow feature space
    (cipher ordering, advertised extensions, TLS version, byte/packet volumes) to catch novel non-browser
    stacks that still claim a browser user-agent. This is a leading indicator of AiTM proxies and scripted
    token-replay tools at SSO portals; report the top discriminating handshake features in the alert.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  features: cipher_order, advertised_extensions(incl token_binding), tls_version, orig_bytes,\
      \ resp_bytes, pkt_counts\n  | label_claimed = ua_is_browser(user_agent)\n  | pred = browser_vs_nonbrowser_classifier(features)\n\
      \  | where dest in protected_sso_portals AND label_claimed == 'browser' AND pred == 'non_browser'\n\
      \  | alert include=top_discriminating_features"
- question: For apps or tokens that are not yet bound, does a token's API-call sequence fall out of distribution
    under a variable-order Markov model (with Bayesian credible intervals), and is it accompanied by new-ASN/device/user-agent
    signals indicative of replay?
  context: Where binding is absent you cannot rely on cryptographic enforcement, so model behavior instead.
    Build per-token variable-order Markov chains of API-call sequences with Bayesian credible intervals
    so that a replayed token's out-of-distribution call sequence is flagged with the improbable transition
    surfaced, per Cloudflare's sequence-learning approach to API abuse. A stolen token replayed by an
    attacker typically drives an unusual sequence of API calls; pairing the improbable-transition signal
    with new-ASN/device/user-agent enrichment from the Microsoft Token Theft Playbook raises confidence
    that the anomaly is a hijacked session rather than benign behavioral drift.
  answer_sources:
  - IdP sign-in / audit logs
  - Zeek http.log
  - 'NAI: Network egress/ingress points, DMZ segments hosting web applications, and authentication servers.'
  range: Last 90 days; per-token sequence window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=idp OR index=http\n  | where app in unbound_apps\n  | per token: build VOMM(api_call_sequence)\
      \ with Bayesian credible intervals\n  | eval seq_prob = vomm_score(sequence)\n  | enrich new_asn,\
      \ new_device, new_user_agent\n  | where seq_prob < credible_lower AND (new_asn OR new_device OR\
      \ new_user_agent)\n  | alert include=improbable_transition"
