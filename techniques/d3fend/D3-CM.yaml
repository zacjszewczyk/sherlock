name: 'D3-CM: Content Modification'
id: 9f356ee8-4b6f-42c3-b004-212e1ed4ee86
description: Investigate whether network and file content that violates policy is correctly identified
  and whether inline content-modification or blocking controls (Content Disarm and Reconstruction, content
  filtering, proxy/TLS termination) actually transformed, disarmed, or blocked the offending content path.
  This playbook helps an analyst confirm both the correct identification of policy-violating payloads,
  file types, structurally dangerous documents, and covert channels, AND the success or failure state
  of the modification action that was supposed to neutralize them. It supports the Isolate objective of
  keeping sensitive systems segregated by flagging prohibited payloads, MIME/extension mismatches, plaintext
  sensitive transfers, DNS/encrypted covert channels, anomalous outbound volume and cadence, high-entropy
  payloads, and cases where a control was triggered but failed open. Use it to surface evasion of content
  controls and gaps where sensitive data could leave the network.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are prohibited file types, dangerous extensions, executable MIME classes, or magic-byte vs
    declared-extension/MIME mismatches being transmitted over non-approved protocols or to non-approved
    destinations?
  context: 'Sophisticated and commodity actors frequently smuggle executables or scripts past content
    controls by renaming them or mislabeling their MIME type (for example application/x-dosexec or application/octet-stream
    renamed to .pdf or .doc). Inspect Zeek files.log and http.log for disallowed file types and for disagreement
    between the file''s magic bytes and its declared extension/MIME, especially over protocols or to destinations
    that are not on the approved list. Each match is a content-policy violation that should have been
    modified or blocked; community Sigma/Zeek/proxy signatures form the deterministic floor. A positive
    result means policy-violating content reached the wire and must be reviewed against the control''s
    action state; a negative result still warrants checking encrypted/inspectable channels. This directly
    supports Isolate by stopping disallowed payloads from crossing into or out of sensitive segments.
    Reference: [Sigma: Generic Signature Format for SIEM Systems](https://github.com/SigmaHQ/sigma).'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek ssl.log
  - Zeek dns.log
  - Proxy logs
  - Firewall logs
  - 'NAI: Network egress points, proxy servers, and internal network segments connecting to sensitive
    data repositories.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log OR http.log\n  | where mime_type in (executable_mime_classes)\n     OR extension\
      \ in (dangerous_extensions)\n     OR magic_bytes != declared_extension_or_mime\n  | where proto\
      \ NOT in (approved_protocols) OR dest NOT in (approved_destinations)\n  | eval violation=\"content_policy_violation\"\
      \n  | match_against(sigma_zeek_proxy_signatures)"
- question: Do transmitted documents or images contain active or embedded constructs (PDF JavaScript/OpenAction/Launch,
    Office macros, embedded scripts, steganographic image payloads, or model pickle/serialization constructs)
    that mark them as disarm candidates?
  context: 'Many intrusions begin with a structurally weaponized document that carries an active construct.
    Parse transmitted documents and images into their logical structure and flag dangerous elements: PDF
    /JavaScript, /OpenAction, /Launch; Office macros; embedded scripts; steganographic image payloads;
    and model serialization/pickle constructs. Such content is non-compliant and must be disarmed and
    reconstructed to a known-good state. A positive result identifies a file that should have been routed
    through CDR; correlate with whether the disarm action actually succeeded. This supports Isolate by
    ensuring active content cannot execute against sensitive systems. References: [Hidost: a static machine-learning-based
    detector of malicious files](https://jis-eurasipjournals.springeropen.com/articles/10.1186/s13635-016-0045-0);
    [Open Image Content Disarm And Reconstruction](https://arxiv.org/abs/2307.14057); [Zero-Trust AI Model
    Security Based on MTD and CDR](https://arxiv.org/abs/2503.01758).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log\n  | parse_structure(file_bytes) as struct\n  | where struct.pdf has (/JavaScript,\
      \ /OpenAction, /Launch)\n     OR struct.office has macros\n     OR struct.image has stego_indicators\n\
      \     OR struct.model has pickle_constructs\n  | eval action=\"route_to_CDR_disarm\""
- question: Are large outbound transfers occurring over plaintext or weakly encrypted channels to non-approved
    destinations, or is DNS being used as a covert content channel?
  context: 'Adversaries exfiltrate over plaintext channels that content controls cannot inspect or hide
    data inside DNS queries. Combine Zeek conn.log service context with ssl.log encryption metadata to
    alert when large outbound transfers (>10 MB, tuned per environment) move over plaintext or weakly
    encrypted channels to destinations that are not approved. For DNS, apply the compression/information-content
    threshold method to bound how much data could be hidden per domain, yielding low-false-positive deterministic
    limits. A positive result indicates either an inspectable-channel bypass or a DNS covert channel;
    both undermine content modification. This supports Isolate by detecting paths that move sensitive
    content past inline controls. Reference: [Practical Comprehensive Bounds on Surreptitious Communication
    Over DNS](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_paxson.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join conn.log, ssl.log on uid\n  | where orig_bytes > 10MB AND (ssl.version is null OR ssl.cipher\
      \ in weak_ciphers)\n     AND dest NOT in (approved_destinations)\n  | union (dns.log | per_domain\
      \ info_content > compression_threshold)\n  | eval signal=\"plaintext_or_covert_transfer\""
- question: When policy-violating content was identified, did the inline modification or blocking control
    return a non-success state (passed-through, bypass, error, timeout, or fail-open)?
  context: 'Identifying a violation is only half the control; the modification/block action must succeed.
    Treat the outcome of the inline control as a first-class signal. From proxy, firewall, and CDR logs,
    alert when violating content was identified but the action returned a non-success state such as pass-through,
    bypass, error, timeout, or fail-open. Track per-destination blocked-connection rates, HTTP 403/451
    rates, and DNS NXDOMAIN/SERVFAIL rates as distinct failure-mode signals indicating evasion or control
    gaps. A positive result means a known-bad object likely reached its destination despite detection,
    a serious Isolate failure that demands immediate response. Reference: [Real-Time Detection of DNS
    Exfiltration and Tunneling from Enterprise Networks](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proxy_firewall_cdr_logs\n  | where violation_identified == true AND action_result NOT in (\"\
      blocked\",\"disarmed\",\"success\")\n  | stats count by dest, action_result\n  | eval failure_mode=action_result\n\
      \  | also track rate(403/451), rate(NXDOMAIN/SERVFAIL), blocked_conn_rate by dest"
- question: Does current per-user and per-destination-category outbound byte volume exceed rolling percentile
    baselines in a way consistent with exfiltration past content controls?
  context: 'Volume anomalies often reveal exfiltration that slips past content inspection. Compute per-user
    and per-destination-category outbound byte distributions (total bytes, bytes per connection, upload:download
    ratio) and compare current flows against rolling percentile baselines, for example alerting on sustained
    traffic above the 99th percentile over a 30-day window. Because absolute volumes vary widely, derive
    thresholds per business unit rather than globally. A sustained outlier suggests data leaving the environment
    past content controls; a normal profile lowers but does not eliminate concern. This supports Isolate
    by catching bulk movement out of sensitive segments. Reference: [Real-Time Detection of DNS Exfiltration
    and Tunneling from Enterprise Networks](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id001
  range: Last 90 days; baseline over rolling 30-day window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "conn.log | stats sum(orig_bytes) as out_bytes, avg(bytes_per_conn), ratio(up:down)\n     \
      \ by user, dest_category, bin(time,1d)\n  | join baseline_percentiles on (user, dest_category)\n\
      \  | where out_bytes > P99_30d AND sustained\n  | eval alert=\"outbound_volume_outlier\""
- question: Are high-entropy (encrypted or compressed) payloads crossing channels where content is expected
    to be inspectable?
  context: 'Encrypted or compressed payloads defeat content inspection and disarm. Compute Shannon entropy
    on transferred file/object bytes and on data carried in plaintext fields, and flag content with entropy
    above roughly 7.0-7.2 crossing channels where content should be inspectable. Such content may be deliberately
    obfuscated to evade modification controls. A positive result identifies payloads that controls could
    not meaningfully inspect, warranting deeper review or blocking; benign cases (already-encrypted archives
    over approved channels) should be tuned out. This supports Isolate by surfacing content that bypasses
    inspection on paths to sensitive data. Reference: [Using Entropy Analysis to Find Encrypted and Packed
    Malware](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log | eval H = shannon_entropy(file_bytes)\n  | where H > 7.1 AND channel in (expected_inspectable_channels)\n\
      \  | eval signal=\"high_entropy_payload_on_inspectable_channel\""
- question: Does the mix of HTTP POST/PUT and file-transfer operations, or the cadence of outbound transfers,
    deviate materially from historical patterns or show automated beaconing?
  context: 'Automated exfiltration tools change the method mix and create regular outbound cadence. Track
    rates of HTTP POST/PUT and file-transfer operations by segment and business unit and trigger when
    the method mix deviates materially from historical patterns during non-maintenance windows. Apply
    FFT-based periodicity extraction to per-(host,destination) byte/connection time series to flag automated
    regular outbound transfers (beaconing cadence) that remain detectable despite jitter. A positive result
    suggests scripted or malware-driven movement of content; correlate with volume and entropy signals.
    This supports Isolate by detecting machine-paced data movement out of sensitive segments. Reference:
    [BAYWATCH: Robust Beaconing Detection in Large-Scale Enterprise Networks](https://dsail.kaist.ac.kr/files/WWW17.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "http.log | stats rate(method=POST), rate(method=PUT), rate(file_transfer)\n      by segment,\
      \ business_unit, window\n  | where deviation_from_history > threshold AND not_maintenance_window\n\
      \  | union ( conn.log | fft_periodicity(bytes_ts by host,dest) | where strong_period )\n  | eval\
      \ signal=\"method_mix_or_beacon_cadence_anomaly\""
- question: Do flow timing features indicate tunneled, VPN, or encrypted channels carrying content past
    inline modification controls to non-approved destinations?
  context: 'Tunneling and VPN encapsulation move content past content inspection entirely. Compute flow
    time-related features (bytes/sec, packet inter-arrival times, active/idle durations) to distinguish
    plaintext, encrypted, and VPN/tunneled channels, and alert on tunneled profiles to non-approved destinations.
    A positive result indicates a channel that inline modification controls cannot see into, a likely
    evasion path; benign corporate VPNs to approved endpoints should be allow-listed. This supports Isolate
    by exposing covert transport that defeats content modification on routes to or from sensitive systems.
    Reference: [Characterization of Encrypted and VPN Traffic using Time-related Features](https://www.scitepress.org/Papers/2016/57407/57407.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn.log | eval f = time_features(bytes_per_sec, iat, active_idle)\n  | classify_channel(f)\
      \ as ch\n  | where ch in (\"vpn\",\"tunneled\") AND dest NOT in (approved_destinations)\n  | eval\
      \ signal=\"tunneled_channel_evasion\""
- question: Which transmitted documents and files do structural and content models classify as requiring
    disarm or blocking, and what features drive that decision?
  context: 'Models catch novel or obfuscated malicious documents that static rules miss. Score transmitted
    documents using structural plus content models (SVM/Random Forest over logical-structure paths, and
    a byte-level CNN ensemble for novel or obfuscated samples) to decide which files require disarm or
    blocking. Surface the top-3 contributing features in alert text (for example presence of /JavaScript,
    /OpenAction, an embedded executable, or anomalous byte regions) so analysts can triage quickly. Run
    this in parallel with deterministic signatures, never replacing them. A high score routes the file
    to CDR or blocking; the feature explanations let an analyst confirm or dismiss. This supports Isolate
    by neutralizing weaponized files before they reach sensitive systems. References: [Hidost](https://jis-eurasipjournals.springeropen.com/articles/10.1186/s13635-016-0045-0);
    [Detecting Malicious PDF using CNN](https://arxiv.org/abs/2007.12729).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for file in files.log:\n    s_struct = SVM_RF(logical_structure_paths(file))\n    s_byte \
      \  = CNN_ensemble(file_bytes)\n    score = combine(s_struct, s_byte)\n    if score > disarm_threshold:\n\
      \      emit(decision=\"disarm_or_block\", top3_features=explain(file))"
- question: Do unsupervised models flag outbound flows with anomalous content volume or rate (high reconstruction
    error or isolation-forest outlier), and which features explain the anomaly?
  context: 'Unsupervised anomaly detection provides a safety net for exfiltration patterns not covered
    by thresholds. Run an autoencoder ensemble over incrementally-computed flow statistics (bandwidth,
    packet/byte rate, jitter per channel) and alert when reconstruction error exceeds the 99th-percentile
    threshold of normal egress, surfacing the top contributing features (destination, byte ratio, rate).
    Pair with an Isolation Forest over lexical/flow features as a low-latency baseline. Layer these in
    parallel with the deterministic thresholds, never replacing them. A high reconstruction error or isolation
    outlier marks a flow worth investigating for content-control evasion; the surfaced features guide
    triage. This supports Isolate by catching anomalous egress from sensitive segments. References: [Kitsune:
    An Ensemble of Autoencoders for Online Network Intrusion Detection](https://arxiv.org/abs/1802.09089);
    [Real-Time Detection of DNS Exfiltration and Tunneling from Enterprise Networks](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "flows = incremental_flow_stats(conn.log)  # bandwidth, byte/pkt rate, jitter per channel\n\
      \  err = autoencoder_ensemble(flows).reconstruction_error\n  iso = isolation_forest(lexical_flow_features(flows))\n\
      \  if err > P99(normal_egress) OR iso.is_outlier:\n    emit(alert, top_features=[dest, byte_ratio,\
      \ rate])"
