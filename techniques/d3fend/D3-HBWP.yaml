name: 'D3-HBWP: Hardware-based Write Protection'
id: 2994b930-0e15-4bbc-af62-c762940b3059
description: This playbook helps an analyst assess where hardware-based write protection should be deployed
  by hunting for evidence that software-only controls are insufficient. It surfaces unauthorized writes
  to critical paths, denied/blocked write attempts, and risky removable-media write behavior that exceed
  expected operational patterns on Domain Controllers, critical application and database servers, firmware/golden-image
  stores, and privileged-user endpoints. The questions profile write Volume (bytes/files), Frequency (writes/min),
  and State (success vs access-denied) per host, user, and process, combining deterministic allowlist
  and file-integrity logic with statistical anomaly detection and machine-learning prioritization so defenders
  can drive a phased, risk-ranked rollout of write-protect mechanisms.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are there any writes to system-critical directories that were performed by a process or account
    not on the approved allowlist?
  context: Supports the Harden tactic by identifying critical paths where software permissions alone are
    permitting unauthorized writes, signaling a need for hardware-based write protection. Configure SACLs
    and audit object access so writes to system-critical directories emit [Windows Event ID 4663](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4663)
    with AccessMask 0x2 (WriteData/AddFile), 0x4 (AppendData), 0x10000 (DELETE), or 0x40000 (WRITE_DAC).
    Validate the writing process and account against an approved allowlist built from publisher signature
    plus cryptographic hash per [Guide to Application Whitelisting, NIST SP 800-167](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-167.pdf).
    Any non-approved write is a high-confidence indicator that the path should be hardened. Derive the
    critical-path list and approved-writer allowlist per environment; a positive result is a write whose
    process/account is absent from the allowlist.
  answer_sources: &id001
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Windows Event ID 6416
  - DriverFrameworks-UserMode Event IDs 2003/2100/2102
  - File Integrity Monitoring (FIM)
  - 'NAI: Domain Controllers, critical application and database servers, firmware/golden-image stores,
    and endpoints of privileged users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4663 AND ObjectName IN (critical_paths)

      AND AccessMask IN (0x2,0x4,0x10000,0x40000)

      WHERE NOT (ProcessName+SignerHash) IN approved_writer_allowlist

      => alert unauthorized_critical_write'
- question: Have any critical files or registry keys been created, modified, or deleted in a way that
    deviates from the approved integrity baseline, and which user or process was responsible?
  context: 'Supports the Harden tactic via file integrity monitoring: baseline critical files and registry
    keys (hash, size, owner, permissions, inode) and alert on any create/modify/delete that deviates from
    the approved baseline. Attribute the responsible user/process via who-data (auditd / Windows Audit
    API), per [File Integrity Monitoring, Wazuh](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html).
    This works first-party on Windows, Linux, and macOS without external API lookups. A deviation from
    baseline on a critical object indicates the object is exposed to tampering and is a candidate for
    hardware write protection; a clean baseline match is a negative.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: FIM/pseudocode
    query: "FOR each monitored object IN critical_files+registry_keys:\n  IF current(hash,size,owner,perms,inode)\
      \ != baseline THEN\n    record change_type(create|modify|delete), actor(user,process via who-data)\n\
      \    => alert baseline_deviation"
  - technology: auditd/pseudocode
    query: 'auditctl -w /critical/path -p wa -k crit_fim

      ausearch -k crit_fim | map syscall->(uid,exe,path) | diff vs baseline'
- question: Did any removable media device get connected and then receive writes on unauthorized device
    classes/IDs or by privileged accounts operating outside policy?
  context: Supports the Harden tactic by governing removable-media writes. Correlate device recognition
    ([Windows Event ID 6416](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-6416)
    and DriverFrameworks plug events, per the [USB Device Plugged Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/driverframeworks/win_usb_device_plugged.yml))
    with handle-access/write operations ([Windows Event IDs 4656 and 4663](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4663))
    on removable-drive paths. Alert on writes to unauthorized device classes/IDs or by privileged accounts
    outside policy. Users readily connect untrusted media, so a connection-then-write sequence is a low-base-rate,
    high-value signal ([Tischer et al.](https://elie.net/static/files/users-really-do-plug-in-usb-drives-they-find/users-really-do-plug-in-usb-drives-they-find-paper.pdf)).
    A positive result is a plug event quickly followed by writes from a disallowed device or account,
    indicating the endpoint needs enforced removable-write protection.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'plug = EventID=6416 OR DriverFrameworks(2003/2100/2102)

      write = EventID IN (4656,4663) AND ObjectName IN removable_paths

      JOIN plug,write BY host WITHIN 10m

      WHERE DeviceClass NOT IN authorized_classes OR Account IN privileged_accounts

      => alert removable_write_violation'
- question: Has any write occurred to firmware or critical-code storage that was not a cryptographically
    signed update matching the authoritative golden measurement?
  context: Supports the Harden tactic by verifying firmware and golden-image integrity. Treat any write
    to firmware/critical-code storage that is not a cryptographically authenticated (signed) update matching
    an authoritative golden measurement as illegitimate, per [Platform Firmware Resiliency Guidelines,
    NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf). Maintain
    a per-device-model hash/measurement allowlist and alert on mismatches. A mismatch indicates potential
    firmware tampering and prioritizes the device for hardware write-protect mechanisms; a signed update
    matching the golden measurement is a negative.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4663 AND ObjectName IN firmware_or_golden_image_paths

      AND AccessMask IN (0x2,0x4,0x10000)

      WHERE NOT (update_is_signed AND measurement IN device_model_allowlist)

      => alert unauthorized_firmware_write'
- question: Are there spikes in access-denied write attempts (handle requests for WriteData/DELETE/WRITE_DAC
    that failed) against critical or removable-media paths per host or account?
  context: Supports the Harden tactic by treating access-denied write attempts as a distinct tamper signal.
    [Windows Event ID 4656](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4663)
    handle requests for WriteData/DELETE/WRITE_DAC that fail on critical or removable-media paths indicate
    adversary write attempts already blocked by existing controls. Baseline normal denied-write rates
    and alert on spikes per host/account. A spike in blocked writes reveals active probing of protected
    resources and confirms those resources warrant continued or strengthened hardware write protection;
    steady low rates are a negative.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4656 AND Status=AccessDenied

      AND AccessMask IN (0x2,0x10000,0x40000)

      AND ObjectName IN (critical_paths+removable_paths)

      STATS count BY host,account OVER baseline_window

      WHERE count > baseline_mean + 3*stddev => alert denied_write_spike'
- question: Which users show removable-media write Volume or Frequency above 3 standard deviations or
    the 95th percentile of their own and peer baselines?
  context: Supports the Harden tactic with statistical anomaly scoring. Build per-user baselines for removable-media
    write Volume (bytes/files) and Frequency (writes/min), then flag activity above 3 standard deviations
    or above the 95th percentile of peer behavior, using base rates from [Tischer et al.](https://elie.net/static/files/users-really-do-plug-in-usb-drives-they-find/users-really-do-plug-in-usb-drives-they-find-paper.pdf)
    to seed realistic priors. Derive thresholds from each environment's observed distribution. Users exceeding
    their baseline indicate abnormal exfil/staging or risky media use, marking their endpoints for write
    protection; activity within normal bounds is a negative.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'writes = EventID=4663 AND ObjectName IN removable_paths

      STATS sum(bytes) AS vol, count/min AS freq BY user,bin(time)

      baseline mean,stddev,p95 BY user AND peer_group

      WHERE vol>mean+3*stddev OR freq>p95 => flag user_removable_anomaly'
- question: Are there change-points in file-IO frequency or sustained high write-entropy across many file
    types that signal destructive mass-write or encryption onset?
  context: Supports the Harden tactic by detecting destructive write onset early. Model file-IO frequency
    and write-entropy as time series and apply change-point (CUSUM-style) detection plus read/write entropy
    divergence to catch mass-write/encryption onset earlier than static cutoffs, per [Casey and Melaragno](https://arxiv.org/abs/2201.04424).
    Use Shannon-entropy, chi-square, and serial-correlation randomness tests on written buffers while
    accounting for benign compressed/encoded false positives, per [Begovic et al.](https://arxiv.org/abs/2306.12008).
    High-entropy, high-volume writes across many file types mark hosts needing write protection; isolated
    compressed writes are a likely false positive to filter.
  answer_sources: *id001
  range: 'Last 30 days, event-centered: pivot +/- 1 hour around detected change-point'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = write_count_per_min, write_entropy BY host

      CUSUM(series) => detect change_point

      tests = Shannon_entropy, chi_square, serial_correlation ON write_buffers

      WHERE entropy_high AND volume_high AND filetype_diversity_high

      AND NOT benign_compressed => alert mass_write_onset'
- question: Are critical servers experiencing sustained write-event bursts beyond their forecast intervals,
    and how does the parallel denied-write rate behave?
  context: Supports the Harden tactic by forecasting server write bursts. Model write-event frequency
    for critical servers using sliding-window read/write/rename counts (as in [ShieldFS](https://conand.me/publications/continella-shieldfs-2016.pdf))
    and alert on sustained spikes beyond forecast intervals, indicating heightened tamper risk where hardware
    write protection should be prioritized. Track the denied-write rate as a parallel failure-mode series.
    A sustained burst above the forecast band on a critical server flags elevated risk; activity inside
    the forecast interval is a negative.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'win = sliding_window(read,write,rename counts) BY server

      forecast = expected_interval(win.history)

      WHERE win.write_rate > forecast.upper FOR sustained_period

      => alert server_write_burst ; ALSO track denied_write_rate series'
- question: Does a per-process filesystem behavioral classifier flag any process as exhibiting destructive
    write behavior, and what top features drove the score?
  context: Supports the Harden tactic with machine-learning behavioral classification. Train a classifier
    on per-process filesystem features — read/write/rename frequency, fraction of files accessed by type,
    and write-entropy — to distinguish destructive write behavior from benign software, following the
    hierarchical random-forest design of [ShieldFS](https://conand.me/publications/continella-shieldfs-2016.pdf)
    and host-based ML surveyed by [Vehabovic et al.](https://arxiv.org/abs/2304.04398). Run it in parallel
    with the deterministic allowlist floor and surface the top-3 contributing features in each alert.
    A process classified as destructive marks its host for write protection; benign classification is
    a negative, but the deterministic floor still applies.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_process(read_freq,write_freq,rename_freq,\n  filetype_access_fraction, write_entropy)\n\
      score = random_forest.predict(features)\nWHERE score=destructive => alert with top3_features(SHAP)\n\
      run parallel to allowlist_floor"
- question: Which hosts rank highest for needing hardware write protection based on unauthorized-write
    rate, denied-write rate, removable-media usage, privilege level, and asset criticality?
  context: Supports the Harden tactic by prioritizing deployment. Rank hosts most needing hardware write
    protection using features such as unauthorized write rate, denied-write rate, removable-media usage,
    privilege level, and asset criticality. Aggregate weak indicators into an explainable majority-vote
    score that surfaces which indicators fired and the top-3 contributing features per host, following
    the malice-score-card approach of [Davies et al.](https://arxiv.org/abs/2305.18852) Use the ranked
    outputs to drive a phased hardening deployment. High-ranked hosts are the immediate candidates for
    write-protect rollout.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_host(unauthorized_write_rate, denied_write_rate,\n  removable_usage, privilege_level,\
      \ asset_criticality)\nscore = majority_vote(weak_indicators)\nRANK hosts DESC BY score\n=> output\
      \ scorecard(fired_indicators, top3_features) for phased rollout"
