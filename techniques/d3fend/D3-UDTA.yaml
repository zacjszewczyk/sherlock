questions:
- question: Did any single network connection move an unusually large volume of bytes - exceeding a static
    high-watermark such as 1GB or the 99.9th percentile of historical connection sizes - and was that
    connection dominated by outbound (orig_bytes) traffic leaving the enterprise?
  context: 'For the Detect mission this deterministic rule catches gross bulk exfiltration in a single
    session regardless of any baseline drift. Sum orig_bytes + resp_bytes for each connection in Zeek
    conn.log and alert when it breaches a static high-watermark - start at 1GB and tune per-environment
    from the 99.9th percentile of historical connection sizes. Prioritize connections where orig_bytes
    (outbound) dominates, since an asymmetric, upload-heavy flow is the signature of data leaving rather
    than entering. A positive result is a candidate bulk-transfer exfiltration event needing immediate
    triage of the destination and the user; a negative result simply means no single connection breached
    the floor, so pair this with the per-user-day and statistical checks to catch chunked transfers. The
    volume/flow detective-control taxonomy informing this rule is in [Data Exfiltration: A Review of External
    Attack Vectors and Countermeasures](https://doi.org/10.1016/j.jnca.2018.10.010).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for conn in zeek_conn_log[last_90d]:\n    total = conn.orig_bytes + conn.resp_bytes\n    if\
      \ total > high_watermark:   # start 1GB; tune to p99.9 of historical conn sizes\n      severity\
      \ = 'HIGH' if conn.orig_bytes > conn.resp_bytes else 'MED'\n      alert('BULK_TRANSFER', conn.id_orig_h,\
      \ conn.id_resp_h, total, conn.orig_bytes, severity)"
- question: Across an entire day, did any user's total outbound bytes to external IP addresses exceed
    a hard ceiling (e.g., 5GB/user/day, or the 99.9th percentile of per-user-day egress)?
  context: This deterministic per-user-day floor catches gross exfiltration that is spread across many
    smaller connections and would slip under a single-connection watermark, and it keeps working even
    when ML baselines drift. Sum each user's daily orig_bytes to external destinations from Zeek conn.log
    and alert when the daily total breaches a hard cap derived from the 99.9th percentile of per-user-day
    egress. For the Detect mission this provides an always-on, auditable backstop. A breach is a strong
    exfiltration lead; review which destinations and connections contributed and whether the volume is
    business-justified (backups, legitimate cloud uploads) before escalating. This per-entity baselining
    pattern follows [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)
    and the volume countermeasures in [Data Exfiltration Review](https://doi.org/10.1016/j.jnca.2018.10.010).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days (evaluate per user-day)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for user, day in user_days[last_90d]:\n    daily_out = sum(conn.orig_bytes for conn in conns(user,day)\
      \ if conn.id_resp_h is external)\n    if daily_out > 5GB:   # tune to p99.9 of per-user-day egress\n\
      \      alert('EGRESS_CAP_EXCEEDED', user, day, daily_out)"
- question: Did a user transfer large (>50MB), high-entropy files matching archive extensions (.zip, .rar,
    .7z, .gz) to external or DMZ destinations, indicating compressed/encrypted data staging?
  context: Attackers commonly compress and/or encrypt stolen data before exfiltration to shrink it and
    evade content inspection, so a large high-entropy archive leaving the network is a classic staging-then-exfil
    pattern. Inspect Zeek http.log and smb_files.log for transfers of files larger than 50MB whose entropy
    is high (consistent with compression/encryption) and whose names match archive extensions, then alert
    when the destination is external or in the DMZ. For the Detect mission a positive result points to
    deliberate packaging of data for theft; correlate with the source user and the volume checks. A negative
    result does not rule out exfiltration of unpackaged data, so keep the volume and ratio analytics running
    alongside. This staging pattern is documented in [Data Exfiltration Review](https://doi.org/10.1016/j.jnca.2018.10.010).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for f in zeek_http_log + zeek_smb_files_log:\n    if f.total_bytes > 50MB and f.entropy >=\
      \ high and f.name ~ /\\.(zip|rar|7z|gz)$/:\n      if f.dest in external or f.dest in DMZ:\n    \
      \    alert('ENCRYPTED_STAGING', f.user, f.dest, f.name, f.total_bytes, f.entropy)"
- question: Did a user send a large outbound transfer (>100MB) to an external destination IP or domain
    that has not appeared in that user's history during the prior 30 days?
  context: 'Combining transfer volume with destination novelty sharply narrows false positives: routine
    large uploads usually go to known, repeatedly-used services, whereas exfiltration often targets attacker-controlled
    infrastructure the user has never contacted. Maintain a per-user rolling 30-day history of external
    destination IPs/domains and alert when a >100MB outbound transfer targets a destination new to that
    user. For the Detect mission a hit is a high-value lead - a large transfer to first-seen infrastructure
    - that should be triaged against threat intel on the destination. A negative result means the destination
    is familiar, lowering (but not eliminating) suspicion. Combine volume with destination novelty using
    the real enterprise byte/packet baselines in the [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days (per-user 30-day destination history)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for conn in egress_conns[today]:\n    if conn.orig_bytes > 100MB:\n      hist = user_dest_history(conn.user,\
      \ last_30d)\n      if conn.dest not in hist:\n        alert('LARGE_TRANSFER_NEW_DEST', conn.user,\
      \ conn.dest, conn.orig_bytes)"
- question: Did a user copy large byte volumes to USB/removable media, or transfer more than 100MB outbound,
    outside of their normal working hours?
  context: Off-hours timing and removable-media use are strong insider-exfiltration indicators because
    legitimate bulk work usually occurs during business hours over sanctioned channels. From Windows Security
    Event ID 4663 (object access), Sysmon FileCreate, and removable-device events, alert when a user writes
    large volumes to USB/removable media or moves >100MB outbound outside their established working hours.
    For the Detect mission this maps to labeled insider exfiltration scenarios and catches both the disgruntled-insider
    USB-copy case and an attacker operating during quiet hours. A positive result warrants reviewing what
    files were copied and whether the device and timing are authorized; combine with the user's working-hours
    baseline to reduce noise from shift workers. These map to labeled insider exfiltration scenarios in
    the [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/)
    and the misuse-detection category in [Homoliak et al.](https://arxiv.org/abs/1805.01612).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for ev in win_4663 + sysmon_filecreate + removable_device_events:\n    if ev.target is removable_media\
      \ and ev.bytes > large_threshold:\n      if outside_working_hours(ev.user, ev.time):\n        alert('OFFHOURS_USB_COPY',\
      \ ev.user, ev.device, ev.bytes, ev.time)\n  for conn in egress_conns:\n    if conn.orig_bytes >\
      \ 100MB and outside_working_hours(conn.user, conn.time):\n      alert('OFFHOURS_BULK_TRANSFER',\
      \ conn.user, conn.dest, conn.orig_bytes)"
- question: For each user, does the total daily data transferred over a 30-day rolling window exceed the
    99th percentile or 3 standard deviations above that user's own mean?
  context: Per-user statistical baselining detects a user transferring far more than is normal for them,
    even if the absolute volume is below organization-wide static caps. Compute each user's total daily
    transferred bytes (sum of orig_bytes/resp_bytes from Zeek conn.log) over a rolling 30-day window and
    alert when the day's total exceeds the user's 99th percentile or mean + 3 standard deviations. For
    the Detect mission this catches a compromised account or insider whose activity suddenly spikes relative
    to their own history. A positive result is a per-user anomaly to triage; be aware mean/SD thresholds
    can be inflated by occasional backups, which is why the modified Z-score variant is run in parallel.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for user in users:\n    series = daily_total_bytes(user, last_30d)\n    mu, sd = mean(series),\
      \ stddev(series)\n    today = daily_total_bytes(user, today)\n    if today > percentile(series,\
      \ 99) or today > mu + 3*sd:\n      alert('DAILY_VOLUME_SPIKE', user, today, mu, sd)"
- question: Using a robust baseline built from the median and median absolute deviation (MAD), does any
    user's daily egress modified Z-score exceed 3.5?
  context: Mean/standard-deviation baselines are easily distorted by occasional large but legitimate events
    (scheduled backups, batch jobs), which inflate thresholds and hide real anomalies. Replacing them
    with the median and MAD yields a robust modified Z-score that resists those outliers. Compute each
    user's daily egress modified Z-score = 0.6745 * (value - median) / MAD and alert when it exceeds 3.5.
    For the Detect mission this gives a more reliable per-user anomaly signal with fewer threshold-drift
    false positives. A score above 3.5 marks a day that is genuinely anomalous relative to the user's
    typical behavior and should be triaged for exfiltration. See [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days (30-day robust baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for user in users:\n    series = daily_egress_bytes(user, last_30d)\n    med, mad = median(series),\
      \ MAD(series)\n    today = daily_egress_bytes(user, today)\n    mz = 0.6745 * (today - med) / mad\n\
      \    if mz > 3.5:\n      alert('ROBUST_EGRESS_ANOMALY', user, today, mz)"
- question: When users are grouped by job role or department, is any user transferring significantly more
    data than their peers - for example more than 2x the peer-group median or in the top 1% of their peer
    rank?
  context: Peer-group analytics catches a user whose volume looks normal against a global cap but is abnormal
    for their role - a powerful insider and compromised-credential indicator. Group users by job role/department
    and compare daily transfer volumes within each group, alerting when a user exceeds roughly 2x the
    peer-group median or ranks in the top 1% of peers. For the Detect mission this contextualizes volume
    against what is normal for similar employees, so an HR analyst suddenly transferring like a data engineer
    stands out. A positive result is a contextual outlier to investigate; ensure peer groups are accurate,
    since misassigned roles cause false positives. This follows [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)
    peer-group analytics and the per-user feature baselining in [Gavai et al.](https://isyou.info/jowua/papers/jowua-v6n4-1.pdf).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for group in peer_groups(by=role_or_dept):\n    med = median(daily_volume(u) for u in group)\n\
      \    for u in group:\n      v = daily_volume(u)\n      if v > 2*med or rank(v, group) in top_1pct:\n\
      \        alert('PEER_GROUP_OUTLIER', u, group, v, med)"
- question: Has a user's outbound:inbound byte ratio (orig_bytes/resp_bytes) inverted and stayed high
    - for example above 3:1 outbound - versus their normally download-heavy baseline?
  context: Most users are download-heavy (they pull far more data than they push), so a sustained inversion
    to upload-heavy traffic is a directionality signal that flags exfiltration even at moderate absolute
    volume. Track each user's orig_bytes/resp_bytes ratio and alert when it inverts and stays high (e.g.,
    >3:1 outbound) relative to that user's baseline. For the Detect mission this catches low-and-slow
    exfiltration that never trips a raw-volume threshold but reverses the normal direction of data flow.
    A positive result indicates the user is now pushing data out atypically; correlate with destinations
    and content to confirm. Compare against the operational distributions in the [Unified Host and Network
    Data Set](https://arxiv.org/abs/1708.07518).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek smb_files.log
  - Firewall logs
  - Web Proxy logs
  - 'NAI: Our organization''s internet egress points and DMZ boundaries'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for user in users:\n    ratio_today = sum(orig_bytes)/max(sum(resp_bytes),1) for user today\n\
      \    base = baseline_ratio(user, last_30d)\n    if ratio_today > 3 and ratio_today > k*base and\
      \ sustained_over(window):\n      alert('UPLOAD_RATIO_INVERSION', user, ratio_today, base)"
- question: Per user, does the number of external connections per minute/hour, or the count of distinct
    external destinations per hour, show sustained bursts exceeding 3 standard deviations or 2x the peer-group
    median?
  context: Automated, chunked exfiltration tools open many short external connections rather than one
    large transfer, so connection FREQUENCY is a distinct signal from raw volume. Baseline each user's
    external connection count per minute/hour and distinct external destinations per hour from Zeek conn.log,
    then alert on sustained bursts beyond 3 standard deviations or 2x the peer-group median. For the Detect
    mission this catches beaconing and scripted upload loops that keep each transfer small to dodge volume
    thresholds. A positive result is a frequency anomaly to triage against the destinations and timing;
    legitimate causes include sync clients and CDNs, so combine with destination reputation. Frequency
    metrics derive against the [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518) with
    peer baselining per [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Web Proxy logs
  - DLP logs
  - 'NAI: Our organization''s internet egress points and DLP enforcement points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for user in users:\n    conn_rate = count(external_conns(user))/interval\n    distinct_dst\
      \ = count(distinct external_dst(user))/hour\n    base, sd = baseline(user); peer_med = peer_group_median()\n\
      \    if conn_rate > base + 3*sd or conn_rate > 2*peer_med:\n      alert('CONN_FREQ_BURST', user,\
      \ conn_rate, distinct_dst)"
- question: For each user, what is the count and rate of blocked or denied egress events (firewall deny,
    proxy 403, DLP block), and does it spike above the user's baseline failure-state rate?
  context: A spike in failed/blocked transfers can indicate an actor probing for an open exfiltration
    channel - trying port after port, service after service - and this failure-STATE rate is a separate
    signal from successful-transfer volume. Track per-user counts and rate of blocked/denied egress (firewall
    deny, proxy 403, DLP block) and baseline it independently, alerting when it spikes. For the Detect
    mission a rising block rate is an early warning that an actor is attempting exfiltration before they
    succeed. A positive result warrants reviewing what was blocked and whether the user later found an
    allowed path; a low rate is normal background policy enforcement. Baseline this failure-state rate
    separately per the detective-control taxonomy in [Data Exfiltration Review](https://doi.org/10.1016/j.jnca.2018.10.010)
    and the anomaly-method survey in [Homoliak et al.](https://arxiv.org/abs/1805.01612).
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Web Proxy logs
  - DLP logs
  - 'NAI: Our organization''s internet egress points and DLP enforcement points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for user in users:\n    blocked = count(fw_deny) + count(proxy_403) + count(dlp_block) for\
      \ user\n    rate = blocked / interval\n    base, sd = baseline_blocked(user, last_30d)\n    if rate\
      \ > base + 3*sd:\n      alert('BLOCKED_TRANSFER_SPIKE', user, rate, base)"
- question: Did a user accumulate multiple DLP policy hits (sensitive-content matches) within a short
    window AT THE SAME TIME as their outbound volume was elevated?
  context: Combining content signals (DLP sensitive-content matches, state = blocked/allowed) with volume
    context produces a high-confidence exfiltration alert that neither signal gives alone. Alert when
    a user accumulates multiple DLP policy hits in a short window while their outbound volume is also
    elevated. For the Detect mission this layered rule catches a user actively moving sensitive material
    in bulk - the conjunction of 'this is sensitive data' and 'a lot of it is leaving' is far more specific
    than either condition by itself. A positive result is a priority exfiltration lead; review the matched
    content classifications, destinations, and whether the transfers were allowed or blocked. This layered
    rule reflects the combined content+context detective controls described in [Data Exfiltration Review](https://doi.org/10.1016/j.jnca.2018.10.010).
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Web Proxy logs
  - DLP logs
  - 'NAI: Our organization''s internet egress points and DLP enforcement points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for user in users:\n    hits = count(dlp_policy_hits(user) within short_window)\n    vol =\
      \ outbound_volume(user, short_window)\n    if hits >= N and vol > elevated_threshold(user):\n  \
      \    alert('DLP_PLUS_VOLUME', user, hits, vol)"
- question: For each user, what is the success-to-failure ratio of upload attempts (proxy 2xx vs 4xx/5xx,
    firewall allow vs deny), and does the pattern show persistent high-volume successful uploads to non-business
    destinations or a low-and-slow series of small successful uploads following earlier blocks?
  context: 'The state of upload attempts - succeed versus fail - reveals exfiltration tradecraft: an actor
    may probe (generating failures) and then succeed via an open channel, or quietly drip small successful
    uploads to stay under thresholds. Compute each user''s success/failure ratio (proxy 2xx vs 4xx/5xx,
    firewall allow vs deny) and flag persistent high-volume successful uploads to non-business destinations,
    or a low-and-slow series of small successful uploads after earlier blocks, against the user''s baseline
    ratio. For the Detect mission this catches insider exfiltration patterns that pure volume or pure
    block-rate analysis misses. A positive result is a behavioral lead requiring destination and content
    review. This is consistent with insider exfiltration patterns in the [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Web Proxy logs
  - DLP logs
  - 'NAI: Our organization''s internet egress points and DLP enforcement points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for user in users:\n    succ = count(proxy_2xx) + count(fw_allow); fail = count(proxy_4xx_5xx)\
      \ + count(fw_deny)\n    ratio = succ/(fail+1); base = baseline_ratio(user)\n    if (ratio anomalous\
      \ vs base) or (low_and_slow_small_uploads after prior blocks):\n      if dest in non_business: alert('UPLOAD_STATE_ANOMALY',\
      \ user, succ, fail, ratio)"
- question: When per-user transfer feature vectors (daily outbound bytes, connection count, distinct destinations,
    upload:download ratio, off-hours fraction, archive-file count) are scored with an Isolation Forest,
    which users receive high anomaly scores, and what are the top-3 features driving each score?
  context: Isolation Forest isolates anomalies efficiently in high-dimensional feature space and catches
    multivariate exfiltration patterns that no single static threshold describes. Build per-user feature
    vectors from daily outbound bytes, connection count, distinct destinations, upload:download ratio,
    off-hours fraction, and archive-file count, then score with an Isolation Forest and alert on high
    anomaly scores, emitting the top-3 contributing features so the analyst sees WHY (e.g., high off-hours
    fraction + many archive files + ratio inversion). For the Detect mission this surfaces subtle combinations
    indicative of insider or compromised-account exfiltration. Keep the deterministic byte-cap rules running
    in parallel so model misses are still caught; a high score with explainable drivers is a strong triage
    lead. Method per [Isolation Forest](https://doi.org/10.1145/2133360.2133363), applied to insider detection
    with per-user explainable attribution in [Gavai et al.](https://isyou.info/jowua/papers/jowua-v6n4-1.pdf).
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Web Proxy logs
  - Windows Security logs
  - 'NAI: Our organization''s internet egress points'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = per_user_features[daily_out_bytes, conn_count, distinct_dst, up_down_ratio, offhours_frac,\
      \ archive_count]\n  model = IsolationForest().fit(X_baseline)\n  for user in users:\n    score =\
      \ model.anomaly_score(X[user])\n    if score > threshold:\n      top3 = feature_attribution(model,\
      \ X[user])[:3]\n      alert('ISOFOREST_ANOMALY', user, score, top3)\n  # keep deterministic byte-cap\
      \ rules running in parallel"
- question: Using an online autoencoder trained on per-host packet/byte rate, magnitude, and variance
    features across multiple time windows, which hosts show high reconstruction error (RMSE) indicating
    abnormal egress volume or rate?
  context: 'An autoencoder learns to reconstruct normal egress behavior; traffic it cannot reconstruct
    well (high RMSE) is abnormal - and this works unsupervised on encrypted traffic without any decryption.
    Train an online autoencoder over per-host packet/byte rate, magnitude, and variance features across
    multiple time windows and flag high reconstruction error as anomalous egress volume/rate. For the
    Detect mission this is well suited to encrypted exfiltration where payload inspection is impossible,
    catching deviations in the shape and rate of traffic. A positive result (high RMSE host) is an egress-behavior
    anomaly to correlate with the user and destination; the online/streaming nature limits drift-induced
    false positives by continuously updating the model. Method per [Kitsune](https://arxiv.org/abs/1802.09089)
    (code: [Kitsune-py](https://github.com/ymirsky/Kitsune-py)).'
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Web Proxy logs
  - Windows Security logs
  - 'NAI: Our organization''s internet egress points'
  range: Last 90 days (online/streaming model)
  queries:
  - technology: ML/pseudocode
    query: "features = per_host[pkt_rate, byte_rate, magnitude, variance] over multi_window\n  ae = OnlineAutoencoder()\
      \   # Kitsune-style, unsupervised, no decryption needed\n  for host in hosts:\n    recon = ae.predict(features[host]);\
      \ rmse = RMSE(features[host], recon)\n    ae.update(features[host])\n    if rmse > threshold:\n\
      \      alert('AUTOENCODER_EGRESS_ANOMALY', host, rmse)"
- question: When each user's daily aggregate activity (bytes, file, device, and http counts) is modeled
    with a DNN/LSTM sequence model, which users show anomalous days, and what per-feature contributions
    explain the anomaly score?
  context: A deep sequence model (DNN/LSTM) learns the temporal pattern of each user's day-to-day activity
    and flags days that break the learned sequence - capturing context that point-in-time thresholds miss.
    Model each user's daily aggregate counts (bytes, file, device, http) and decompose the anomaly score
    into per-feature contributions so analysts can triage WHY a day was flagged. For the Detect mission
    this is validated against labeled insider-threat data and catches gradual behavioral shifts characteristic
    of an insider ramping up exfiltration or a slowly-operating attacker. A positive result is an anomalous
    user-day with explainable drivers; review the contributing features (e.g., spike in device or file
    activity) against the user's role and known activity. As demonstrated on the CERT data by [Tuor et
