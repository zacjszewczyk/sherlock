name: 'D3-UDTA: User Data Transfer Analysis'
id: b2671d39-0344-432d-bb32-7fe7d2ffef7c
description: 'This playbook helps an analyst detect unauthorized data exfiltration by analyzing the volume,
  frequency, and state of data a user transfers out of the enterprise. It begins with deterministic, rule-based
  controls - static high-watermarks on single connections, per-user-day egress caps, encrypted/archive
  staging detection, first-seen external destination flagging, and off-hours or removable-media bulk-copy
  detection - that catch gross exfiltration regardless of model drift. It then layers statistical baselining:
  per-user daily volume spikes, robust modified Z-score thresholds, peer-group outlier comparison, upload:download
  byte-ratio inversion, external connection-frequency bursts, blocked/denied transfer-rate profiling,
  DLP-hit correlation, and success-versus-failure state ratios. Finally it applies behavioral machine
  learning - Isolation Forest on per-user feature vectors, autoencoder reconstruction error on egress
  rate, deep sequence models, and volume forecasting - to surface the low-and-slow and novel transfer
  patterns that evade static thresholds, with every model alert surfacing its top-3 contributing features.
  Use it to distinguish routine business data movement from a sophisticated external actor staging and
  exfiltrating sensitive data, a malicious insider copying files to removable media, or commodity malware
  beaconing data out of your environment.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
