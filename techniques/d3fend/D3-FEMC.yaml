questions:
- question: Has the FirmwareIntegrityMonitor reported any hash mismatch, signature-validation failure,
    or failed attestation against the authoritative golden reference measurement, and was any such integrity
    violation accompanied by an audit-log-cleared event (Windows Event ID 1102) or a broken/sequence-gapped
    heartbeat hash-chain within a short correlation window?
  context: Under the Detect tactic, a hash or signature mismatch against the signed golden measurement
    is the primary deterministic signal of unauthorized firmware modification, and [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf)
    establishes this golden-reference comparison as the Root-of-Trust-for-Detection floor. An adversary
    who tampers with firmware will frequently try to hide the evidence, so correlating any integrity-violation
    event with Windows Event ID 1102 (audit log cleared) inside a 5-minute window catches the cover-up.
    A broken or sequence-gapped heartbeat hash-chain is itself a tamper signal even with no explicit mismatch,
    per [Schneier and Kelsey's secure-audit-log model](https://www.schneier.com/wp-content/uploads/2016/02/paper-secure-logs.pdf).
    A positive result is high-confidence compromise and should page immediately; a negative result raises
    confidence the firmware is intact but does not by itself prove the monitor is still running.
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
  - Firmware integrity/attestation check-in records (hash, signature, sequence number, timestamp)
  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days; pivot to a 5-minute window around any integrity-violation event for log-clearing
    correlation
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'WHERE source=''FirmwareIntegrityMonitor'' AND (event=''hash_mismatch'' OR event=''sig_validation_fail''
      OR event=''attestation_fail'' OR heartbeat_chain_broken=TRUE)

      | ALERT severity=''critical''

      | CORRELATE WITH (WinEventID=1102) WHERE abs(t_logclear - t_violation) <= 5min THEN tag=''compromise_coverup'',
      severity=''critical'''
- question: Does every monitored device's running and stored firmware measurement match the signed golden
    value, are all firmware updates cryptographically authenticated before install, and do challenge-response
    attestation results (both the returned checksum AND the response latency) fall within the expected
    envelope?
  context: 'This enforces the deterministic Root-of-Trust-for-Detection from [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf):
    a device should only run firmware whose measurement equals the signed golden value, and updates must
    be cryptographically authenticated before they are applied. Where the platform supports it, issuing
    a challenge-response attestation (e.g., [SWATT](https://www.cs.cmu.edu/~arvinds/pubs/swatt.pdf)-style)
    adds a second dimension: malicious interception logic that forges a correct checksum still imposes
    measurable timing overhead, so an out-of-envelope response latency is a tamper signal even when the
    checksum looks correct. A failed measurement, an unsigned/unauthenticated update, or an abnormal latency
    under the Detect tactic all indicate unauthorized modification and warrant escalation.'
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
  - Firmware integrity/attestation check-in records (hash, signature, sequence number, timestamp)
  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR EACH device IN monitored_fleet:\n  IF running_measurement != golden_signed[device.model]\
      \ OR stored_measurement != golden_signed[device.model] THEN ALERT 'firmware_mismatch'\n  IF update_event\
      \ AND NOT signature_valid(update.image) THEN ALERT 'unsigned_update'\n  resp = challenge_response_attest(device)\n\
      \  IF resp.checksum != expected[device] OR resp.latency NOT IN [lat_lo, lat_hi] THEN ALERT 'attestation_envelope_violation'"
- question: Are any monitored platforms missing their expected integrity check-in heartbeats beyond policy
    thresholds (e.g., 3 consecutive missed intervals), and is there nearby process/service telemetry showing
    the monitor service being stopped, killed, or restarted?
  context: An independent firmware monitor that suddenly goes silent is treated as compromised until proven
    otherwise (the [Copilot coprocessor-monitor model](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf)).
    Under the Detect tactic, define the expected heartbeat cadence per platform and alert when check-ins
    are absent beyond threshold. Because an adversary often must stop or restart the monitor service to
    defeat it, enrich the silence with process and service telemetry - Windows Event ID 4688 and Sysmon
    Event ID 1 for stop/kill utilities, Event ID 7036/7045 for service state changes - to distinguish
    deliberate suppression from benign outages (reboot, maintenance). Heartbeat silence plus a monitor-service
    stop is strong evidence of active evasion.
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
  - Firmware integrity/attestation check-in records (hash, signature, sequence number, timestamp)
  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days; evaluate against each platform's maintenance-window-adjusted schedule
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR EACH device: IF consecutive_missed_checkins(device) >= 3 THEN ALERT 'monitor_silence'\n\
      | ENRICH WITH (WinEventID IN (4688) OR Sysmon=1) WHERE process IN ('sc.exe','net.exe','taskkill.exe','Stop-Service')\n\
      \  AND target_service ~ 'FirmwareIntegrityMonitor'\n| JOIN (WinEventID IN (7036,7045)) WHERE service\
      \ ~ 'FirmwareIntegrityMonitor' AND state IN ('stopped','installed')\n| IF suppression_evidence THEN\
      \ severity='critical'"
- question: Does any device report a running firmware hash that is absent from the per-model allowlist
    of approved exact firmware hashes (and does fuzzy hashing show only partial similarity to an approved
    image)?
  context: 'Maintaining a per-model allowlist of approved exact firmware hashes turns firmware integrity
    into a simple membership test: any reported measurement not on its model''s allowlist is unauthorized
    by definition. [Costin et al.''s large-scale analysis](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf)
    shows backdoors and tampered images recur across product lines, which motivates model-scoped matching.
    Adding fuzzy (ssdeep) similarity catches near-matches - an image that is mostly the approved firmware
    but with an injected modification will fail the exact match while showing high-but-imperfect similarity,
    a useful triage signal under the Detect tactic. A non-allowlisted hash is actionable; investigate
    whether it is an unapproved version or a malicious modification.'
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
  - Firmware integrity/attestation check-in records (hash, signature, sequence number, timestamp)
  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR EACH checkin: IF checkin.firmware_hash NOT IN allowlist[checkin.device_model] THEN\n \
      \ sim = max(ssdeep_compare(checkin.firmware_hash, h) for h in allowlist[checkin.device_model])\n\
      \  ALERT 'non_allowlisted_firmware' WITH similarity=sim, severity = (sim>80 ? 'high:likely_modified_image'\
      \ : 'medium:unknown_image')"
- question: Do semantic invariants over monitored firmware data structures still hold - do interrupt/jump
    tables point only into approved code regions, and do function pointers reference only signed handlers
    - or have any of these invariants been violated?
  context: 'Static-code hashing alone misses attacks that hijack control flow without rewriting hashed
    code regions. This check extends specification-based detection ([Petroni et al.](https://www.usenix.org/legacy/event/sec06/tech/full_papers/petroni/petroni.pdf))
    and the in-firmware Symbiote integrity model ([Cui and Stolfo](http://nsl.cs.columbia.edu/projects/minestrone/papers/Symbiotes.pdf))
    by evaluating invariants over firmware data segments: interrupt and jump tables must reference only
    approved code regions, and function pointers must point to signed handlers. Under the Detect tactic,
    a violation - a table entry or pointer aimed at an unapproved/unsigned region - indicates a control-flow
    hijack or data-segment tamper even when the code hash is unchanged. These are deterministic invariants,
    so any violation is high-fidelity.'
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
