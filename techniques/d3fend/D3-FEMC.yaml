  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH monitored_segment IN firmware_image:\n  FOR EACH block IN sliding_windows(segment):\n\
      \    H = shannon_entropy(block)\n    IF segment.baseline_class == 'code' AND H > 7.2 THEN\n    \
      \  ALERT 'entropy_tripwire' WITH offset=block.offset, entropy=H"
- question: Does the forecasted per-host integrity-report volume/interval (via seasonal ARIMA) diverge
    from observed - with observed volume falling below the lower prediction bound (unnatural silence after
    monitor suppression) or above the upper bound (replay/burst)?
  context: Forecasting per-host integrity-report volume/interval with (seasonal) ARIMA, per [Hyndman and
    Athanasopoulos](https://otexts.com/fpp3/arima.html), sets data-driven expectations that adapt to each
    platform's maintenance-window history. Under the Detect tactic, observed volume below the lower prediction-interval
    bound indicates 'unnatural silence' consistent with monitor suppression, while volume above the upper
    bound indicates replay or burst injection of reports. Because bounds are derived from each platform's
    own history rather than a global constant, this reduces false alarms from naturally bursty or quiet
    devices. A breach of either bound is an investigable cadence anomaly to correlate with suppression
    evidence.
  answer_sources:
