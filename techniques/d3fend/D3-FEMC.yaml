  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH host AND stream IN ('missed_heartbeat','failed_attest','dropped_conn'):\n  S = 0\n\
      \  FOR EACH interval:\n    resid = observed[stream] - expected[stream]\n    S = max(0, S + resid\
      \ - slack_k)\n    IF S > threshold_h THEN ALERT 'cusum_suppression' WITH host, stream, S\n  # dropped_conn\
      \ derived from Zeek conn.log to reporting endpoint"
- question: Do any monitored firmware code/data segments contain an unexpectedly high-entropy region (Shannon
    block entropy > ~7.2) inside a segment that is normally low-entropy (~4.5-6.5), suggesting an injected
    packed or encrypted payload?
  context: Legitimate firmware code segments have characteristic, relatively low Shannon entropy (~4.5-6.5),
    while packed or encrypted payloads approach maximum entropy. Computing block entropy over monitored
    firmware code/data segments and tripwiring when a region exceeds ~7.2 inside a normally low-entropy
    segment, using [Lyda and Hamrock's](https://ieeexplore.ieee.org/document/4140989) thresholds, flags
    injected packed/encrypted code or unauthorized modification. Under the Detect tactic, an entropy spike
    pinpoints the offset of suspected injection for the analyst to carve and examine. False positives
    can arise from legitimately compressed regions, so baseline each firmware image's expected entropy
    profile before alerting.
