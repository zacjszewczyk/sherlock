    query: "FOR EACH anomaly_alert:\n  contributions = SHAP(model, anomaly_alert.features)\n  top3 = sort_desc(contributions)[:3]\n\
      \  ATTACH top3 TO anomaly_alert.explanation\n  # e.g. {missed_checkin_count, cadence_delta, hash_mismatch_flag,\
