  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR EACH monitored_segment:\n  FOR EACH entry IN interrupt_table + jump_table:\n    IF entry.target\
      \ NOT IN approved_code_regions THEN ALERT 'invariant_violation:table'\n  FOR EACH fp IN function_pointers:\n\
      \    IF NOT is_signed_handler(fp.target) THEN ALERT 'invariant_violation:funcptr'"
- question: Across the fleet, which hosts run firmware versions/hashes that are statistically rare (outside
    the 99th percentile of rarity for their asset group) or whose fuzzy similarity to the model's golden
    image has dropped below threshold?
  context: Rather than relying solely on a known-bad list, build per-asset-group baselines of approved
    firmware versions/hashes and compute rarity across the fleet using exact and fuzzy (ssdeep) hashing,
    as in [Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf)
    Under the Detect tactic, a host whose firmware state is in the rarest 1% for its group, or whose similarity
    to the golden image falls below a tuned threshold, is a strong candidate for an unauthorized or modified
    image - attackers rarely modify every device, so tampered firmware tends to be statistically rare.
    This complements the deterministic allowlist by surfacing odd-one-out images that may predate or evade
    the allowlist.
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
  - Firmware integrity/attestation check-in records (hash, signature, sequence number, timestamp)
  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'GROUP checkins BY asset_group

      | COMPUTE freq[firmware_hash] PER group, rarity = 1 - percentile_rank(freq)

      | COMPUTE golden_sim = ssdeep_compare(firmware_hash, golden_image[model])

      | WHERE rarity >= 0.99 OR golden_sim < sim_threshold

      | OUTPUT host, firmware_hash, rarity, golden_sim'
- question: Has the per-host integrity-report check-in interval drifted - showing jitter or delay beyond
    established control limits - and does change-point detection pinpoint the moment the cadence shifted
    from normal to silent or bursty?
  context: Each healthy monitor reports on a stable cadence; suppression or interference changes that
    cadence. Measure per-host integrity-report interval mean and variance and flag jitter or delay beyond
    control limits, then apply change-point detection (CUSUM/PELT/Bayesian online CPD, per [Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)) to identify exactly when the cadence
    transitioned from normal to silent or bursty. Under the Detect tactic, a detected change-point that
    coincides with maintenance is benign, but an unexplained shift to silence (suppression) or bursts
    (replay) is investigable. Returning the timestamp of the change-point gives the analyst a precise
    pivot for correlating with process/service and audit-log events.
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
  - Firmware integrity/attestation check-in records (hash, signature, sequence number, timestamp)
  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH host: intervals = diff(checkin_timestamps)\n  mu,sigma = mean(intervals), std(intervals)\n\
      \  IF any(interval > mu + 3*sigma) THEN flag_jitter\n  cp = PELT(intervals)  # or BayesianOnlineCPD/CUSUM\n\
      \  IF cp AND NOT in_maintenance_window(cp) THEN ALERT 'cadence_change_point' WITH t=cp"
- question: Does a stateful CUSUM on the gap between expected and observed check-in counts/timing show
    slow, low-and-slow accumulation of monitoring suppression crossing a tuned bound, and how do the separate
    failure streams (failed attestations, blocked/dropped reporting connections, missed heartbeats) contribute?
  context: 'A sophisticated actor may suppress monitoring so gradually that no single interval looks anomalous.
    A stateful CUSUM residual on the gap between expected and observed check-in counts/timing accumulates
    these small deviations until they cross a tuned bound, following [Urbina et al.''s](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf)
    stateful-vs-stateless detector design and impact-vs-false-alarm tuning. Under the Detect tactic, profile
    the failure side explicitly as distinct CUSUM streams: failed attestations, blocked or dropped reporting
    connections (from Zeek conn.log), and missed heartbeats. A bound crossing on any stream indicates
    sustained degradation of monitoring that point-in-time rules would miss; tune the bound to balance
    detection delay against false alarms.'
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
