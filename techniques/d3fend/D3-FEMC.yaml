  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH host: model = SARIMA(history_volume, season=daily)\n  yhat, lo, hi = model.forecast(horizon)\n\
      \  IF observed < lo THEN ALERT 'unnatural_silence'\n  IF observed > hi THEN ALERT 'replay_or_burst'\n\
      \  # bounds adjusted for maintenance windows"
- question: Does a learned log-sequence model (LSTM/DeepLog or Transformer/LogBERT) trained on the normal
    ordered stream of firmware-monitor log keys flag any event that falls outside the top-g predicted
    next keys, and what is the expected-vs-observed key and its position in the workflow?
  context: Firmware monitoring follows a predictable ordered workflow of log keys (boot-measurement ->
    periodic check-in -> page-lock -> update-verify). Training a log-sequence model - LSTM per [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf)
    or Transformer per [LogBERT](https://arxiv.org/abs/2103.04475) - on the normal ordered stream from
    application logs and Zeek conn.log lets the detector flag any event outside the top-g most probable
    next keys. Under the Detect tactic, an out-of-sequence or unexpected log key can reveal tampering
    that respects per-event rules but breaks the workflow order (e.g., a page-lock without a preceding
    mismatch, or a missing update-verify). For explainable triage, the alert should surface the offending
    log key, the expected-vs-observed key, and the position in the workflow.
  answer_sources:
  - 'Windows Event Log (Application Source: ''FirmwareIntegrityMonitor'')'
  - Windows Event ID 1102
  - Windows Event ID 4688
  - Windows Event ID 7036/7045 (service state/install)
  - Sysmon Event ID 1 (process create)
  - Zeek conn.log
  - Firmware integrity/attestation check-in records (hash, signature, sequence number, timestamp)
  - 'NAI: Critical system boot partitions, UEFI/BIOS firmware on servers and endpoints, embedded network-device
    firmware, and the management network segment carrying firmware integrity-reporting/attestation traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DeepLog_or_LogBERT(train=normal_logkey_sequences)\nFOR EACH window IN host.logkey_stream:\n\
      \  topg = model.predict_next(window.history)\n  IF window.observed_key NOT IN topg THEN\n    ALERT\
      \ 'sequence_anomaly' WITH observed=window.observed_key, expected=topg, position=window.index"
- question: Does an unsupervised reconstruction model (1D-CNN/RNN or autoencoder) trained on benign per-host
    reporting frequency/timing/volume features produce a reconstruction error above the percentile-tuned
    threshold for any host?
  context: An unsupervised 1D-CNN/RNN or autoencoder trained on benign per-host reporting frequency, timing,
    and volume features learns the normal shape of each host's check-in behavior; a high reconstruction
    error means the recent behavior no longer resembles the learned norm, per [Kravchik and Shabtai's
    ICS CNN approach](https://arxiv.org/abs/1806.08110). Under the Detect tactic this catches subtle multivariate
    cadence/volume shifts that univariate rules miss. Critically, keep the deterministic golden-hash and
    heartbeat rules running in parallel as the floor - the model is an additive sensor, not a replacement
    - so a model miss never removes the baseline integrity guarantee. Tune the alert threshold on a held-out
    benign percentile.
