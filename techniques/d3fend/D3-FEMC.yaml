    query: "ae = Autoencoder_or_1DCNN(train=benign_freq_timing_volume_features)\nFOR EACH host_window:\n\
      \  err = reconstruction_error(ae, host_window.features)\n  IF err > pctl_threshold THEN ALERT 'recon_error_spike'\
      \ WITH host, err\n# deterministic golden-hash + heartbeat rules remain active as floor"
- question: For every firmware-monitor anomaly alert, what are the top-3 SHAP-attributed contributing
    features (e.g., missed-check-in count, cadence delta, hash-mismatch flag, entropy delta) driving the
    anomaly score?
  context: 'Anomaly scores are only actionable if the analyst understands why they fired. Applying SHAP
    feature attribution to each anomaly score, per [Hwang and Lee](https://arxiv.org/abs/2205.01930),
    makes every firmware-monitor alert list its top-3 drivers - for example missed-check-in count, cadence
    delta, hash-mismatch flag, or entropy delta. Under the Detect tactic this satisfies the explainability
    requirement for triage: an alert driven by a hash-mismatch flag is treated very differently from one
    driven only by a mild cadence delta, letting the analyst prioritize and pursue the right corroborating
    evidence quickly. Attach the attributions to every ML-derived alert from the preceding sequence and
    reconstruction detectors.'
