name: 'D3-FEMC: Firmware Embedded Monitoring Code'
id: 6397e5a9-f0cf-4a27-a6a7-a789277fcdbf
description: 'Investigate the integrity and continuity of firmware-embedded monitoring telemetry to detect
  unauthorized firmware modifications and attempts to suppress or evade the monitor itself. This playbook
  helps an analyst confirm that each monitored platform (UEFI/BIOS on servers and endpoints, embedded
  network-device firmware, and critical boot partitions) is reporting expected integrity states: cryptographic
  measurements matching signed golden references, on-cadence heartbeats with an unbroken hash-chain, and
  signed/authenticated updates. Tamper or monitor-suppression manifests across three observable dimensions
  - State (hash/signature mismatch, failed attestation, broken heartbeat hash-chain), Frequency (missing,
  delayed, or replayed check-ins), and Volume (anomalous count or byte-size of integrity-report events).
  It layers deterministic golden-measurement/attestation and allowlist rules, statistical baselining of
  cadence/volume/entropy with change-point and CUSUM detection, and explainable ML over reporting sequences
  and reconstruction error. Crucially it correlates integrity failures with audit-log clearing and monitor-service
  stop/restart to catch attempts to hide firmware compromise on servers, endpoints, network devices, and
  the management segment that carries attestation traffic.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
