name: 'D3-CAA: Connection Attempt Analysis'
id: e8a3ea75-2aba-4e1d-a82b-5e895d5272a4
description: Investigate anomalous patterns of failed and improbable connection attempts to detect reconnaissance,
  scanning, password spraying, and brute-force activity. This playbook helps an analyst profile connection
  and authentication telemetry by Volume (attempt and byte counts), Frequency (attempts per minute by
  source and destination), and State (success vs. failure, e.g., Zeek conn_state S0/REJ/RSTO/RSTR and
  Windows 4625 failures). It covers concentrated or distributed failure patterns against critical servers
  and authentication endpoints, spray-to-success sequences, sequential hypothesis testing of per-source
  failure ratios, default-credential scan-then-login attempts, statistical baselining and new-edge scoring,
  and ML classification/anomaly detection. It also addresses connection attempts to unallocated (dark)
  IP space and ghost/decommissioned assets, a high-fidelity indicator of internal/external reconnaissance
  and worm propagation, including dark-net fanout alerting, network-telescope scan-rate estimation, and
  graph link-prediction of improbable edges.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
