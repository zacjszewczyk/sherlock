questions:
- question: Are there repeated failed connection attempts whose source IPs match known-malicious threat-intelligence
    indicators, or whose Zeek conn_state shows persistent failure states (S0, REJ, RSTO, RSTR)?
  context: 'Detect: This is a first-party detection signal. Match failed connections from Zeek conn.log
    (conn_state S0=SYN with no reply, REJ=rejected, RSTO/RSTR=reset) and Windows Event ID 4625 against
    your threat-intelligence indicator feeds. Repeated failures from infrastructure already flagged as
    malicious warrant high-priority alerts and likely indicate active scanning or credential attacks.
    Critically, retain this rule even when there is no TI match: the connection failure-state itself is
    an independent indicator of probing. A positive result is repeated failures from a known-bad source
    against gateways, the DMZ, or critical authentication servers; a negative result still leaves the
    raw failure-state telemetry available for the statistical and ML methods below. Citation: [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log where conn_state in (\"S0\",\"REJ\",\"RSTO\",\"RSTR\")\n  | join threat_intel\
      \ on id.orig_h == ti.indicator\n  | group by id.orig_h | count() as fails\n  | where fails >= 5\
      \ -> ALERT high"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventID=4625\n  | lookup threat_intel on IpAddress\n  | stats count by IpAddress, TargetUserName\n\
      \  | where ti_match=true OR count>=10 -> ALERT"
- question: Did a burst of failed logons (4625) across many distinct accounts from a single source IP/host
    culminate in a successful logon (4624) from that same source within a short window?
  context: 'Detect: This identifies a likely successful password-spray. Correlate a burst of Windows Event
    ID 4625 failures spanning many distinct accounts (e.g., >=10 accounts) followed by a 4624 success
    from the same source IP/host within a short window. The pattern of broad-but-shallow failures then
    a single success is the signature of a spray that found a valid credential. Treat account-lockout
    (4740) spikes as a parallel failure-mode signal that the spray is hitting lockout thresholds. A positive
    result should be escalated immediately as likely credential-spray success and the successful account
    triaged for compromise; a negative result with only the failure burst still indicates spray attempts
    in progress. Citations: [ASD password-spray guidance](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf);
    [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days; correlate within a 30-60 minute event-centered window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  let fails = EventID=4625 | bin time span=30m | stats dc(TargetUserName) as accts by\
      \ IpAddress, bin\n  let succ  = EventID=4624 | stats values(TargetUserName) by IpAddress, bin\n\
      \  join IpAddress, bin | where accts>=10 AND succ_exists -> ALERT critical"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventID=4740 | stats count as lockouts by bin(time,30m)\n  | where lockouts > baseline_p99\
      \ -> ALERT (parallel spray signal)"
- question: Does any single source exhibit a sequence of unanswered or rejected connection attempts consistent
    with a port/host scanner under a sequential hypothesis (Threshold Random Walk) test?
  context: 'Detect: Apply the Threshold Random Walk (Jung et al.) sequential hypothesis test. Model each
    new connection from a source as a Bernoulli success/failure trial and accumulate the likelihood ratio;
    a source is declared a scanner after roughly 4-5 unanswered/rejected attempts (S0/REJ). This provides
    a bounded-error, deterministic detection floor that fires faster than fixed N-in-T thresholds while
    controlling false positives. Retain a simple fallback rule (e.g., >=20 distinct failed destinations
    in 5 minutes) for environments where TRW state is impractical. A positive result strongly suggests
    active network reconnaissance; a negative result means the source''s success/failure mix looks like
    normal connectivity. Citation: [Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  // Threshold Random Walk per source\n  for each conn from src:\n    if conn_state in\
      \ (\"S0\",\"REJ\"): outcome=fail else outcome=success\n    Lambda *= (P[outcome|scanner] / P[outcome|benign])\n\
      \    if Lambda >= eta_upper -> ALERT scanner (src)\n    if Lambda <= eta_lower -> classify benign"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  // fallback rule\n  conn where fail_state | stats dc(dest) as dests by src, bin(time,5m)\n\
      \  | where dests >= 20 -> ALERT"
- question: Is there a source that first SYN-scans a service port and then attempts logins using known
    default username/password pairs against Telnet, SSH, RDP, or SMB?
  context: 'Detect: Flag the scan-then-login sequence characteristic of IoT/commodity malware such as
    Mirai. A source first SYN-scans a service port, then attempts authentication using credentials from
    an empirical default-credential watchlist. Alert on this high-failure scan-then-login sequence even
    when the individual logins fail, because the behavior itself reveals automated exploitation attempts.
    Focus on Telnet/SSH/RDP/SMB exposed at gateways and the DMZ. A positive result indicates default-credential
    brute-forcing or worm propagation; a negative result means observed logins are not matching the default-credential
    watchlist. Citation: [Mirai (Antonakakis et al.)](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  scan = conn where conn_state==\"S0\" and service in (telnet,ssh,rdp,smb)\n  login =\
      \ auth_attempt where (user,pass) in default_cred_watchlist\n  | join on src, dest within 10m where\
      \ scan precedes login -> ALERT"
- question: When aggregated into 5-minute windows, do failed attempts concentrated by source or by destination
    exceed environment-specific 99th-percentile baselines?
  context: 'Detect: Aggregate failed attempts by source and by destination in 5-minute windows and compare
    against rolling 30-day percentile baselines. Alert when either source-driven concentration (one source
    hammering many targets) or target-driven concentration (one target hammered by many/one source) crosses
    tuned 99th-percentile thresholds. Deriving thresholds per environment from the 30-day distribution,
    rather than fixed constants, adapts to each site''s normal volume and reduces false positives. A positive
    result flags scanning, spraying, or brute-force concentration; a negative result indicates failure
    volumes within normal bounds. Citations: [Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  failed_attempts | bin(time,5m)\n  | stats count by src, dest_bin\n  | eventstats p99\
      \ as src_thr by src_baseline\n  | where count > src_thr OR count > dst_thr -> ALERT"
- question: Which source IPs/hosts target an abnormally broad set of distinct accounts with 4625 failures,
    exceeding mean+3*stdev (or the 99th percentile) of the per-source baseline?
  context: 'Detect: For each source IP/host, compute the count of distinct accounts targeted with Windows
    Event ID 4625 failures per sliding window, and flag sources whose breadth exceeds mean+3*stdev (or
    the 99th percentile) of the per-source baseline. This isolates broad-but-shallow password spraying
    that per-account thresholds miss, because spraying deliberately tries one or few passwords across
    many accounts to avoid lockouts. A positive result indicates account-fanout consistent with spraying;
    a negative result means the source is touching a normal number of accounts. Citations: [Splunk Threat
    Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventID=4625 | stats dc(TargetUserName) as fanout by IpAddress, bin(time,1h)\n  | eventstats\
      \ avg(fanout) as mu, stdev(fanout) as sd\n  | where fanout > mu + 3*sd -> ALERT"
- question: Does the enterprise-wide rate of failed connections/logons per minute, per business unit,
    exceed seasonally-forecast confidence intervals for consecutive windows?
  context: 'Detect: Build seasonal forecasts of total failed connections/logons per minute per business
    unit and trigger anomaly alerts when observed rates exceed confidence intervals for consecutive windows.
    Change-detection/baselining methods capture surges that individual per-source rules miss, such as
    a slow ramp across the whole estate. Reporting the failure-rate delta and the contributing sources
    in the alert speeds triage. A positive result indicates a coordinated or environment-wide surge worth
    investigating; a negative result means aggregate failure rates track expected seasonal patterns. Citation:
    [Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days; model seasonal baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  failures | timechart span=1m count by business_unit\n  | forecast seasonal -> expected,\
      \ ci_upper\n  | where observed > ci_upper for >=N consecutive bins\n  | report delta, top contributing\
      \ src -> ALERT"
- question: Are connection attempts being made to never-before-seen source->destination(:port) edges,
    especially edges that also show failure states or high fanout?
  context: 'Detect: Maintain a model of previously observed source->destination(:port) edges and score
    connections to never-before-seen pairs using a Bayesian new-edge approach (Metelli and Heard). Prioritize
    new edges that also exhibit failure states (S0/REJ) or high fanout, which surfaces scanning and lateral
    probing hidden amid routine traffic. New edges are inherently suspicious for lateral movement and
    reconnaissance because legitimate hosts tend to communicate with a stable peer set. A positive result
    is a rare new edge with failure/fanout characteristics; a negative result means the connection matches
    historically normal communication patterns. Citation: [Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days; baseline of historical edges
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn | eval edge = src.\"->\".dest.\":\".port\n  | lookup known_edges on edge\n  | where\
      \ edge_is_new\n  | score bayesian_new_edge(edge)\n  | where fail_state OR high_fanout -> ALERT (prioritized)"
- question: Can connection-attempt activity be classified into campaign types (scanner, password spray,
    brute-force, or benign misconfiguration) using a supervised model on temporal and structural features?
  context: 'Detect: Train a supervised model (Random Forest / gradient-boosted trees) on temporal and
    structural features such as attempt cadence, target spread, protocol mix, byte ratios, and success/fail
    ratio to classify activity as scanner, password spray, brute-force, or benign misconfiguration. Output
    the top-3 contributing features (e.g., distinct-destination count, S0 ratio, attempts/min) in alert
    text for explainability, and keep deterministic rules running in parallel (Sommer and Paxson caution
    against ML-only detection). A positive result is a high-confidence campaign classification with explanatory
    features; a negative classification (benign misconfiguration) still helps analysts dismiss noise.
    Citations: [Duque Anton et al.](https://arxiv.org/abs/1907.10374); [Sommer and Paxson](http://www.icir.org/robin/papers/oakland10-ml.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [attempt_cadence, target_spread, protocol_mix, byte_ratio, success_fail_ratio]\n\
      \  pred = RandomForest.classify(features) // {scanner, spray, brute, benign}\n  | where pred !=\
      \ benign\n  | annotate top3_features -> ALERT"
- question: Do per-host streaming connection statistics produce reconstruction-error spikes in an unsupervised
    online autoencoder ensemble, indicating scan/recon bursts?
  context: 'Detect: Run an unsupervised online autoencoder ensemble (KitNET/Kitsune) over incrementally-computed
    per-host streaming statistics including connection rate, packet rate, inter-arrival jitter, and byte
    volume. Flag reconstruction-error spikes that arise from scan/recon fanout. Because it learns normal
    per-host behavior online, it can catch novel bursts without labeled data. Surface the feature(s)/sub-model
    driving the error so analysts can see why the burst is anomalous. A positive result is a reconstruction-error
    spike tied to fanout features; a negative result means traffic reconstructs within learned norms.
    Citations: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089); [code](https://github.com/ymirsky/Kitsune-py).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days; streaming/online model
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  stream per-host stats {conn_rate, pkt_rate, inter_arrival_jitter, byte_vol}\n  rmse\
      \ = KitNET.process(stats)\n  | where rmse > anomaly_threshold\n  | report driving_submodel/feature\
      \ -> ALERT"
- question: Are there distributed low-and-slow authentication failures that cluster by failure reason/error
    code, account breadth, time cadence, and source diversity, evading per-source thresholds?
  context: 'Detect: Cluster authentication failures by failure reason/error code, account breadth, time
    cadence, and source diversity to surface distributed low-volume sprays that evade per-source thresholds.
    Low-and-slow sprays deliberately spread attempts thin across many sources and time to stay under volume
    rules, so clustering on shared characteristics reveals the coordinated campaign. Emphasize failure-code
    features (bad-password vs. locked vs. disabled) as distinct signals, since the mix reveals intent.
    A positive result is a cluster of correlated low-volume failures consistent with a coordinated spray;
    a negative result means failures lack shared campaign structure. Citation: [Microsoft Sentinel low-and-slow
    spray ML](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Firewall deny/allow logs
  - NetFlow
  - 'NAI: Internet gateways, DMZ, and critical servers (e.g., Domain Controllers, public-facing web servers,
    VPN/OWA/ADFS authentication endpoints).'
  range: Last 90 days; emphasize longer windows for slow campaigns
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  EventID=4625 with SubStatus/error_code\n  features = [error_code, account_breadth, cadence,\
      \ source_diversity]\n  clusters = unsupervised_cluster(features)\n  | where cluster shows low-volume\
      \ distributed pattern -> ALERT"
- question: Is a single source making connection attempts to multiple unallocated (dark) IP addresses
    or ghost/decommissioned assets above a tuned threshold (e.g., 4 ghost assets in under 7 minutes)?
  context: 'Detect: Using a continuously-updated map of real vs. ghost/unallocated assets, alert when
    one source''s connection attempts to dark space exceed a threshold (e.g., contacting 4 ghost assets
    in under 7 minutes per the Vectra dark-net reconnaissance patent). Confirm the attempts are failures
    (S0/REJ) via Zeek conn.log conn_state. Connections to addresses that host no legitimate service are
    a high-fidelity reconnaissance/worm-propagation indicator because there is no benign reason to contact
    them. Tune the threshold to network size to limit false positives. A positive result strongly indicates
    internal/external reconnaissance; a negative result means dark-space contact stays within tuned bounds.
    Citations: [Vectra dark-net reconnaissance patent](https://patents.google.com/patent/US20150264078A1);
    [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - Firewall deny logs
  - NetFlow
  - 'NAI: Routed-but-unused (dark) internal IP ranges, ghost/decommissioned host addresses, DMZ, and internet
    gateways. Maintain a continuously-updated inventory of allocated vs. unallocated space.'
  range: Last 90 days; correlate within short (~7 minute) windows
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn where dest in dark_space_map AND conn_state in (\"S0\",\"REJ\")\n  | stats dc(dest)\
      \ as ghosts by src, bin(time,7m)\n  | where ghosts >= 4 -> ALERT (dark-net recon)"
- question: What is the estimated scan intensity and coverage when treating allocated-but-unused address
    ranges as an internal network telescope?
  context: 'Detect: Treat allocated-but-unused address ranges as an internal network telescope and baseline
    normal dark-space packet/attempt rates. Alert when the observed hit rate exceeds the baseline percentile,
    and report the estimated scan rate and coverage (Moore et al.). Because legitimate traffic to dark
    space is near-zero, any sustained hit rate is informative, and larger monitored dark ranges yield
    more accurate rate/duration estimates. A positive result quantifies an active scan with an estimated
    rate; a negative result means dark-space hit rates remain at background levels. Citation: [Moore et
    al.](https://www.caida.org/catalog/papers/2004_tr_2004_04/tr-2004-04.pdf).'
  answer_sources:
  - Zeek conn.log
  - Firewall deny logs
  - NetFlow
  - 'NAI: Routed-but-unused (dark) internal IP ranges, ghost/decommissioned host addresses, DMZ, and internet
    gateways. Maintain a continuously-updated inventory of allocated vs. unallocated space.'
  range: Last 90 days; baseline dark-space rate
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  hits = conn where dest in dark_space | timechart span=1m count\n  | baseline p99 as\
      \ thr\n  | where count > thr\n  | eval est_scan_rate = count / monitored_dark_size\n  | report est_scan_rate,\
      \ coverage -> ALERT"
- question: Which connection edges are improbable per an unsupervised graph link-prediction model, particularly
    attempts to addresses that have no normal communicants?
  context: 'Detect: Model host/account-to-host connections as a dynamic graph and score rare/improbable
    edges, including attempts to addresses with no normal communicants, with an unsupervised GNN link-prediction
    model (CyberGraph). Surface the per-edge score and the contributing graph context (the source''s normal
    peers vs. the anomalous destination) for explainable triage. Graph-based scoring captures relational
    anomalies, such as a host suddenly reaching into dark space or contacting peers it never talks to,
    that flat thresholds miss. A positive result is a low-probability edge with explanatory context; a
    negative result means the edge fits the host''s learned communication graph. Citation: [CyberGraph,
    Bowman et al.](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf).'
  answer_sources:
  - Zeek conn.log
  - Firewall deny logs
  - NetFlow
  - 'NAI: Routed-but-unused (dark) internal IP ranges, ghost/decommissioned host addresses, DMZ, and internet
    gateways. Maintain a continuously-updated inventory of allocated vs. unallocated space.'
  range: Last 90 days; dynamic graph baseline
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  build dynamic_graph(src -> dest edges)\n  score = GNN_link_prediction(edge)\n  | where\
      \ score < improbable_threshold\n  | report edge_context(normal_peers vs anomalous_dest) -> ALERT"
