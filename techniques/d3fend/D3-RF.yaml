name: 'D3-RF: Restore File'
id: 776a1ecd-bfbd-488a-b4fd-c3fe3d6f6f4f
description: Investigate the file-restoration capability and the integrity, authorization, and performance
  of recovery operations following a destructive event such as ransomware, data corruption, or sabotage.
  This playbook helps an analyst confirm that restored files were recovered to the correct recovery point,
  restored only by authorized workflows, and validated against known-good integrity values (hashes, golden
  images, sibling replicas) before being returned to production. It baselines restore-operation volume,
  frequency, and failure metrics to surface unauthorized mass restoration, tampered or abused backup workflows,
  ransomware-recovery surges, and failed or incomplete restores as distinct signals. It layers deterministic
  policy/sequence validation, statistical baselining and change-point detection of restore activity, and
  explainable ML scoring of anomalous restore jobs and the underlying file-system I/O that necessitates
  recovery, so the organization can answer with confidence whether it can restore critical files to a
  known-good state.
type: technique
related:
- tactic_id: D3-R
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does every successful file-restore operation recorded in backup-service logs map to an approved
    change or incident ticket within an authorized maintenance window, and are there any restore operations
    that lack a matching authorization?
  context: Under the Restore tactic, legitimate recovery must trace back to an authorized recovery plan
    with defined initiation and termination criteria per [Guide for Cybersecurity Event Recovery (NIST
    SP 800-184)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf). Query backup-service
    logs for successful restore operations and correlate each operation timestamp to an approved change/incident
    ticket within the authorized maintenance window. A restore with no matching authorization is the strongest
    signal of an attacker abusing backup tooling to stage data, roll a host back to a vulnerable state,
    or mask destructive activity. A positive result (an unauthorized restore) warrants immediate escalation
    and account review; a negative result (all restores authorized) confirms governed recovery.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Backup Service Event Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM backup_service_logs WHERE event='restore' AND status='success'\n| LEFT JOIN change_tickets\
      \ t ON restore.time BETWEEN t.window_start AND t.window_end\n                            AND restore.target_host\
      \ = t.host\nWHERE t.ticket_id IS NULL\n| ALERT 'restore without authorization' severity=high\n \
      \ fields=initiating_account, target_host, target_path, bytes_restored, restore.time"
- question: For each restored file, does the post-restore hash match the known-good baseline or golden
    image for the expected recovery point/version, and are there any integrity mismatches?
  context: 'Restoring from a tampered or wrong-version backup reintroduces malware or corrupted data.
    Following the hash/manifest integrity verification prescribed in [Data Integrity: Recovering from
    Ransomware (NIST SP 1800-11)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.1800-11.pdf)
    and the copy-on-write known-good shadow model of [ShieldFS](https://conand.me/publications/continella-shieldfs-2016.pdf),
    compute the observed post-restore hash (derived from Windows Event ID 4663 object access plus a repository
    hash manifest) and compare it to the known-good baseline/golden image, also verifying the recovery-point/version.
    A mismatch indicates backup corruption, tampering, or restoration of the wrong version, and means
    the file should not be returned to production. A clean comparison validates that the file is trustworthy.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Backup Service Event Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM restored_files rf\n| LOOKUP baseline b ON rf.path = b.path AND rf.recovery_point = b.version\n\
      | COMPUTE observed_hash = hash_from(4663_access, repo_manifest)\nWHERE observed_hash != b.known_good_hash\
      \ OR rf.recovery_point != b.expected_version\n| ALERT 'restored file integrity mismatch' severity=high\n\
      \  fields=rf.path, observed_hash, b.known_good_hash, rf.recovery_point"
- question: Does the restored host or file set converge to its golden image or a sibling replica, or is
    there measurable divergence in file size, hash set, or object-access distribution from the known-good
    reference?
  context: Applying the training-less replica-comparison invariant of [ReplicaWatcher](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf),
    treat the restored host/file set as a candidate that must converge to its golden image or a sibling
    replica. Flag measurable divergence across file size, hash sets, and object-access distribution from
    the known-good reference. This catches subtle tampering or partial/incorrect restores that pass a
    single-file hash check but leave the system as a whole inconsistent with its known-good peers. Convergence
    confirms a clean restore; divergence indicates the restored state is not trustworthy and needs investigation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Backup Service Event Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM restored_set r, golden_image g, sibling_replica s\n| COMPUTE diff = symmetric_difference(hashset(r),\
      \ hashset(g))\n        + size_delta(r, g) + objaccess_distribution_distance(r, s)\nWHERE diff >\
      \ convergence_threshold\n| ALERT 'restored state diverges from known-good reference' severity=medium\n\
      \  fields=host, diff, top_divergent_files"
- question: Does each restore follow the complete, correctly ordered workflow (request -> authorize ->
    stage -> copy -> integrity-verify -> release), and are any stages missing or out of order, such as
    a copy with no preceding authorization or no integrity-verify?
  context: 'The validate-recovery-capabilities mandate of [Guide for Cybersecurity Event Recovery (NIST
    SP 800-184)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf) means each
    restore should be a complete, ordered process trace: request, authorize, stage, copy, integrity-verify,
    release. Model each restore as such a trace and alert when any stage is missing or out of order. A
    copy without a preceding authorization, or a release without an integrity-verify, indicates either
    a broken process or an attacker bypassing controls. Score unusual traces with statistical leverage
    per [Ko & Comuzzi](https://ceur-ws.org/Vol-2952/paper_291a.pdf). Complete, in-order traces confirm
    disciplined recovery.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Backup Service Event Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM restore_events GROUP BY restore_job_id ORDER BY time\n| BUILD trace = sequence(stage)\n\
      WHERE trace NOT MATCHES ['request','authorize','stage','copy','integrity-verify','release']\n  \
      \ OR missing_stage(trace, ['authorize','integrity-verify'])\n| SCORE leverage = statistical_leverage(trace)\n\
      | ALERT 'incomplete or out-of-sequence restore workflow' severity=high\n  fields=restore_job_id,\
      \ trace, missing_stages"
- question: What is the time-to-restore per server and job class, and are any jobs exceeding the 95th
    percentile or a robust modified Z-score (|M|>3.5), indicating workflow or infrastructure degradation?
  context: Restore duration is a direct measure of recovery capability (the FFIR). Compute mean, median,
    MAD, and the 95th percentile of time-to-restore from backup-log start/end timestamps, segmented per
    server and job class, deriving thresholds per environment from at least 30 days of completed jobs.
    Flag jobs exceeding the 95th percentile or a robust modified Z-score |M|>3.5 per [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    Outliers signal workflow problems, infrastructure degradation, oversized restores, or interference.
    Normal durations confirm the recovery process meets expectations.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Backup Service Event Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM backup_logs WHERE event='restore' AND status='success'\n| EVAL duration = end_time -\
      \ start_time\n| STATS median=median(duration), mad=mad(duration), p95=perc95(duration)\n       \
      \ BY server, job_class\n| EVAL mz = 0.6745*(duration-median)/mad\nWHERE duration > p95 OR abs(mz)\
      \ > 3.5\n| ALERT 'time-to-restore outlier' severity=medium\n  fields=server, job_class, duration,\
      \ p95, mz"
- question: Do live restore jobs fall outside the predicted restoration duration/throughput interval for
    their server given transfer volume and path telemetry, and which features explain the deviation?
  context: Train a forecasting/regression model on transfer volume and path telemetry from Zeek conn.log
    and backup logs to predict expected restoration duration/throughput per server, following the time-series
    forecasting approach of [Cloud Intrusion Detection Using Time Series Forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x).
    Alert when a live job falls outside the prediction interval and surface the top-3 contributing features
    (bytes, file count, path) per [SHAP-in-IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    Deviations may indicate exfiltration disguised as restore, resource contention, or a tampered workflow.
    Predictions within interval confirm the recovery path is performing as modeled, supporting the recovery-capability
    assessment.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Backup Service Event Logs
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL forecast = regression(target=duration_or_throughput,\n        features=[bytes, file_count,\
      \ path_class, hour], group=server)\n| TRAIN on trailing 90d completed restores\n| SCORE live_job\
      \ vs prediction_interval(forecast)\nWHERE live_job OUTSIDE prediction_interval\n| EXPLAIN top3 =\
      \ SHAP(forecast, live_job)\n| ALERT 'restoration throughput anomaly' severity=medium\n  fields=server,\
      \ observed, predicted, top3"
- question: Do hourly restore metrics (restored bytes/day, restored file count/day, restore jobs/minute)
    for any server exceed the role-aware baseline of mean + 3 standard deviations (or robust median/MAD
    for batch-heavy servers)?
  context: Unauthorized mass restoration or abused backup workflows show up as volume spikes. Baseline
    restored bytes/day, restored file count/day, and restore jobs/minute per server using role-aware baselines
    per [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    and robust median/MAD scoring for batch-heavy servers per [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    Alert on hourly buckets exceeding mean + 3 standard deviations. A spike may indicate an attacker bulk-restoring
    data, ransomware recovery at scale, or misuse of backup tooling. Activity within baseline reflects
    normal, expected recovery operations.
  answer_sources:
  - Windows Backup Service Event Logs
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM backup_logs WHERE event='restore'\n| BIN time SPAN=1h\n| STATS bytes=sum(bytes), files=sum(file_count),\
      \ jobs=count() BY server, bin\n| JOIN baseline ON server (mean, stddev, median, mad per metric,\
      \ role-aware)\nWHERE bytes > mean+3*stddev OR abs(0.6745*(bytes-median)/mad) > 3.5\n| ALERT 'restore\
      \ volume/frequency baseline exceeded' severity=medium\n  fields=server, bin, bytes, files, jobs"
- question: Is there an abrupt regime shift in the restored-byte or restore-count time series indicative
    of an organization-wide ransomware recovery or unauthorized bulk restoration?
  context: Beyond per-bucket thresholds, a coordinated event manifests as a change in the underlying time-series
    regime. Apply change-point detection (CUSUM, PELT, or Bayesian online) to the restored-byte and restore-count
    series, tuning detection delay against false-alarm rate per [A Survey of Methods for Time Series Change
    Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/). An abrupt, sustained shift signals
    either a large-scale legitimate recovery (which should map to a major incident) or unauthorized bulk
    restoration. Correlate any detected change point with incident timelines; an unexplained shift warrants
    investigation of the initiating accounts and targets.
  answer_sources:
  - Windows Backup Service Event Logs
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM backup_logs WHERE event='restore'\n| BIN time SPAN=15m | STATS bytes=sum(bytes), cnt=count()\
      \ BY bin\n| CHANGEPOINT method=PELT|CUSUM|BOCPD ON bytes, cnt\nWHERE changepoint_detected AND magnitude\
      \ > tuned_threshold\n| ALERT 'mass-restore regime shift' severity=high\n  fields=changepoint_time,\
      \ pre_mean, post_mean, magnitude"
- question: Is the rate of failed, aborted, or incomplete restore jobs (and integrity-verify failures)
    spiking above its normal baseline, suggesting backup corruption, tampering, or storage compromise?
  context: 'Failures are a distinct signal from successes and directly threaten recovery capability. Track
    failed, aborted, and incomplete restore jobs per window as a dedicated time series, baseline the normal
    failure fraction, and alert on robust outliers. A sustained spike in restore failures or integrity-verify
    failures indicates backup corruption, tampering, or storage compromise, complementing the deterministic
    validation in [Data Integrity: Recovering from Ransomware (NIST SP 1800-11)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.1800-11.pdf).
    A rising failure rate means the organization may be unable to restore when it needs to; a stable low
    rate confirms backup health.'
  answer_sources:
  - Windows Backup Service Event Logs
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM backup_logs WHERE event IN ('restore','integrity_verify')\n| BIN time SPAN=1h\n| STATS\
      \ fails=countif(status IN ('failed','aborted','incomplete')),\n        total=count() BY server,\
      \ bin\n| EVAL fail_frac = fails/total\n| JOIN baseline ON server (median_frac, mad_frac)\nWHERE\
      \ abs(0.6745*(fail_frac-median_frac)/mad_frac) > 3.5\n| ALERT 'restore failure/integrity-verify\
      \ spike' severity=high\n  fields=server, bin, fail_frac, fails, total"
- question: Which restore jobs are ranked most anomalous by an Isolation Forest over per-job feature vectors
    (bytes restored, file count, duration, throughput, hour-of-day, initiating account, target path, success/fail),
    and which features drove the score?
  context: Unsupervised outlier detection catches anomalous restores without labeled attack data. Build
    per-job feature vectors (bytes restored, file count, duration, throughput, hour-of-day, initiating
    account, target path, success/fail) and score them with an Isolation Forest at a tuned contamination
    rate per [Isolation Forest](https://doi.org/10.1145/2133360.2133363), surfacing the top-3 contributing
    features per [SHAP-in-IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    High-ranked jobs - e.g., a large off-hours restore by an unusual account to a sensitive path - merit
    review. Low scores across the board indicate routine recovery. This complements the deterministic
    and statistical checks with a holistic, multivariate view.
  answer_sources:
  - Windows Backup Service Event Logs
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FEATURES per restore_job = [bytes, file_count, duration, throughput,\n        hour_of_day,\
      \ initiating_account, target_path, success_fail]\n| MODEL iforest = IsolationForest(contamination=tuned)\n\
      | TRAIN on trailing 90d restore jobs | SCORE all jobs\nWHERE anomaly_score > threshold\n| EXPLAIN\
      \ top3 = SHAP(iforest, job)\n| ALERT 'anomalous restore job' severity=medium\n  fields=restore_job_id,\
      \ anomaly_score, top3"
- question: Do any restore jobs have an autoencoder reconstruction error above the 99th percentile of
    normal jobs, and which features drove the reconstruction anomaly?
  context: An autoencoder trained on normal restore-job feature vectors learns the shape of routine recovery;
    jobs it cannot reconstruct well are anomalous. Flag jobs whose reconstruction error exceeds the 99th
    percentile and cluster per-feature error to attribute which features drove the anomaly, following
    [Practical Autoencoder-Based Anomaly Detection](https://link.springer.com/article/10.1186/s42400-022-00134-9).
    This catches novel deviations that rule-based and even tree-based methods miss. High reconstruction
    error on a restore touching sensitive data or run by an atypical account warrants triage; low error
    confirms the job fits learned-normal recovery behavior.
  answer_sources:
  - Windows Backup Service Event Logs
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FEATURES per restore_job = [bytes, file_count, duration, throughput,\n        hour_of_day,\
      \ account_enc, path_enc, status]\n| MODEL ae = Autoencoder() | TRAIN on normal restore jobs\n| SCORE\
      \ recon_error = ||x - ae(x)||\nWHERE recon_error > perc99(recon_error)\n| ATTRIBUTE per_feature_error_cluster\n\
      | ALERT 'restore job reconstruction anomaly' severity=medium\n  fields=restore_job_id, recon_error,\
      \ top_error_features"
- question: Do backup/restore-service log-key sequences contain events outside the top-g predicted next-keys
    or abnormal parameter values (durations, byte counts), indicating restore workflows that skip authorization/verify
    steps or carry anomalous parameters?
  context: Log-sequence models learn the normal grammar of backup/restore operations. Using [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf),
    flag events that fall outside the top-g predicted next log keys, plus abnormal parameter values (durations,
    byte counts); a self-supervised transformer encoder per [LogBERT](https://arxiv.org/abs/2103.04475)
    provides an alternative. This detects restore workflows that skip authorization or integrity-verify
    steps, or carry anomalous parameters, even when each individual event looks valid. An out-of-sequence
    prediction on a restore path warrants investigation of whether controls were bypassed; in-sequence
    logs confirm the workflow followed its learned-normal path.
  answer_sources:
  - Windows Backup Service Event Logs
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FROM backup_service_logs | PARSE log_key, params(duration,bytes)\n| SEQUENCE per restore_job_id\n\
      | MODEL deeplog = LogKeyLSTM(top_g) ; PARAM model = GaussianPerKey\n   (or MODEL logbert = TransformerEncoder(self_supervised))\n\
      WHERE next_key NOT IN top_g_predicted OR param OUTSIDE normal_range\n| ALERT 'out-of-sequence restore\
      \ workflow' severity=high\n  fields=restore_job_id, unexpected_key, anomalous_params"
- question: On protected file servers, does low-level filesystem I/O (write-entropy, fraction of high-entropy
    writes, read/write/rename rate, fraction of files touched) indicate malicious encryption that necessitates
    restoration, and did copy-on-write rollback recover all original files?
  context: The event that triggers a restore is often ransomware encryption. Following [ShieldFS](https://conand.me/publications/continella-shieldfs-2016.pdf),
    model low-level filesystem I/O - write-entropy, fraction of high-entropy writes, file read/write/rename
    rate, and fraction of files touched - to detect the malicious encryption that necessitates restoration
    and to confirm that copy-on-write rollback recovered all original files. A surge in high-entropy writes
    and rapid renames across many files is a strong ransomware indicator and should trigger both containment
    and recovery. Verifying post-rollback that all originals are present closes the loop on recovery completeness.
  answer_sources:
  - Windows Backup Service Event Logs
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Backup servers and critical file servers'
  range: Last 30 days; center analysis on suspected encryption events and correlate +/- 24h
  queries:
  - technology: SIEM/ML pseudocode
    query: "FROM filesystem_io (Sysmon EID 11, minifilter telemetry) per host/process\n| FEATURES = [write_entropy,\
      \ frac_high_entropy_writes,\n        read_rate, write_rate, rename_rate, frac_files_touched]\n|\
      \ MODEL shieldfs_classifier ; SCORE per process and per host\nWHERE encryption_likelihood > threshold\n\
      | ALERT 'ransomware-like I/O necessitating restore' severity=critical\n  fields=host, process, frac_high_entropy_writes,\
      \ files_touched\n| FOLLOWUP verify copy_on_write_rollback restored_all_originals"
