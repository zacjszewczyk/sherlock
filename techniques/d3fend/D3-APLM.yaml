name: 'D3-APLM: Active Physical Link Mapping'
id: dd3c928b-791c-401e-ac04-d9ed3bc6f5e7
description: 'This playbook helps an analyst investigate the physical and logical topology of network
  segments by reconciling physical link telemetry, active probes, and network flow records into a single
  map of switch-level adjacencies and dominant logical communication paths. It supports Active Physical
  Link Mapping (D3-APLM): building physical adjacency from LLDP/CDP, validating link-discovery integrity
  against spoofing and topology poisoning, running active traceroute/path probes with alias resolution,
  validating sensor coverage on critical links, ranking high-impact logical paths by volume/frequency/state,
  detecting topology change with graph-distance metrics and control bounds, inferring sparse adjacency
  from traffic covariance, reconstructing topology via network tomography, and inferring latent segments
  with graph learning. The goal is to surface newly observed links, spoofed link-discovery messages, undocumented
  routing changes, inserted hubs/taps, and mapping/visibility gaps that deviate from the approved topology.'
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Does the LLDP/CDP-derived physical adjacency map match the approved network diagram, and are
    there any switch ports advertising multiple distinct peer chassis IDs that would indicate an inserted
    hub or tap?
  context: By parsing Zeek lldp.log for chassis ID, port ID, and peer system name, the analyst builds
    a canonical edge list of observed physical adjacencies and reconciles it with SNMP bridge forwarding
    tables and STP root/port roles so switch-to-switch uplinks are deterministically identified rather
    than inferred. Within the Model tactic, this establishes the ground-truth physical topology. A positive
    finding is any link absent from the approved diagram, a link on an unauthorized switch port, or a
    port advertising more than one peer chassis ID (a strong sign of an inserted hub/tap or rogue device);
    these warrant immediate physical verification. A clean result confirms the physical layer matches
    the documented design.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_lldp\n| EXTRACT chassis_id, port_id, peer_system_name, local_switch, local_port\n\
      | BUILD edge_list = (local_switch:local_port) -> (peer_chassis_id)\n| JOIN approved_diagram ON edge\n\
      | WHERE edge NOT IN approved_diagram\n   OR local_port IN unauthorized_ports\n   OR COUNT(DISTINCT\
      \ peer_chassis_id) BY (local_switch:local_port) > 1\n| ENRICH WITH snmp_bridge_fdb, stp_port_roles\n\
      | ALERT 'Unexpected or multi-peer physical adjacency'"
- question: Are any new or changed links violating deterministic physical invariants (duplicate chassis
    IDs on access ports, missing port-up events, implausibly fast host migrations) that would indicate
    forged LLDP/CDP frames and topology poisoning?
  context: 'The adjacency list is treated as a flow graph, and every new or changed link is validated
    against deterministic invariants before being accepted: a chassis ID must not appear on two access
    ports simultaneously, a newly advertised link must have a matching physical port-up event and bidirectional
    LLDP, and host-to-port bindings must not migrate faster than physically plausible. In the Model tactic
    this protects the integrity of the topology baseline against an adversary injecting forged or duplicated
    LLDP/CDP frames to poison the map. A positive result is a spike in link-discovery frames failing these
    checks above the per-port baseline, indicating active spoofing. A negative result means observed link
    changes are physically consistent and trustworthy.'
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_lldp, switch_port_events\n| FOR EACH new_or_changed_link:\n    CHECK chassis_id\
      \ NOT ON >1 access_port\n    CHECK matching port_up event EXISTS\n    CHECK bidirectional LLDP observed\n\
      \    CHECK host_port_binding_migration_time >= physical_min\n| failed = links FAILING any check\n\
      | COUNT failed PER port PER minute AS fail_rate\n| ALERT WHEN fail_rate > baseline_per_port"
- question: Do active traceroute/path probes across critical uplinks reveal L3 hops with no corresponding
    physical link, and is the rate of unanswered hops or reverse-DNS NXDOMAIN responses indicating incomplete
    mapping or evasive devices?
  context: From internal sensors, the analyst runs directed traceroute/path probes across critical uplinks,
    then applies deterministic path-reduction and alias-resolution rules to merge interface IPs onto a
    single device and decode DNS hostnames into site/role to deduplicate the L3 adjacency map. This L3
    view is reconciled with the L2 LLDP map. In the Model tactic this surfaces routing-level structure
    and discrepancies. A positive result is an L3 hop with no corresponding physical link, or an elevated
    rate of unanswered hops (`* * *`) and reverse-DNS NXDOMAIN responses, which signals incomplete mapping,
    filtering, or evasive/hidden devices. Confirm intended traceroute node identity before trusting a
    hop. A clean result means L3 and L2 maps agree and probes complete normally.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM traceroute_probe_results

      | REDUCE paths, RESOLVE aliases (merge interface IPs -> device)

      | DECODE rdns hostname -> site/role

      | JOIN lldp_l2_map ON adjacency

      | FLAG l3_hop WHERE no_matching_physical_link

      | COMPUTE pct_unanswered_hops, count_nxdomain PER campaign

      | ALERT WHEN pct_unanswered_hops OR nxdomain_rate > baseline'
- question: Are there critical switch uplinks in the approved diagram that have no corresponding Zeek
    observation window in the last 24 hours, indicating a monitoring blind spot?
  context: The analyst cross-checks LLDP- and traceroute-derived links against expected monitoring points
    and raises an alert when critical switch uplinks have no corresponding Zeek observation window. Coverage
    is quantified as the fraction of approved-diagram edges with live telemetry in the last 24 hours.
    In the Model tactic, blind spots in monitoring directly undermine the ability to detect adversary
    activity on those links, so a missing visibility window is treated as a mapping gap requiring corrective
    action. A positive result is coverage dropping below a site-specific floor (e.g., <95%). A negative
    result confirms telemetry covers all critical edges.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 24 hours
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'approved_edges = approved_diagram.critical_uplinks

      observed_edges = DISTINCT edges FROM zeek_conn,zeek_lldp WHERE ts > now-24h

      coverage = COUNT(approved_edges INTERSECT observed_edges) / COUNT(approved_edges)

      missing = approved_edges - observed_edges

      ALERT WHEN coverage < site_floor (e.g., 0.95)

      LIST missing AS mapping_gaps'
- question: Which source-destination edges are the top high-impact transit paths by transferred-byte volume,
    connection frequency, and connection state, and are any core paths showing a rising failed/blocked-connection
    ratio that suggests a routing change or new midpoint device?
  context: Aggregating Zeek conn.log flows by source-destination pair over 30 days, the analyst computes
    per-edge transferred-byte percentiles (Volume), connections-per-minute (Frequency), and the established-vs-failed/reset
    ratio (State) from conn_state and firewall allow/deny counts. Edges in the top 5 percent of bytes
    are marked critical transit paths. In the Model tactic, understanding dominant logical paths reveals
    where sensitive data flows and where an adversary would pivot. A positive result is a daily change
    in top-path membership (topology shift) or a rising failed/blocked-connection ratio on a core path,
    which is a distinct signal of a routing change or an inserted midpoint device. A negative result means
    logical path structure is stable.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek_conn WHERE ts > now-30d\n| GROUP BY src,dst AS edge\n| COMPUTE bytes_pct = PERCENTILE(orig_bytes+resp_bytes),\n\
      \         freq = COUNT()/window_minutes,\n         state_ratio = established / (failed+reset)\n\
      | JOIN firewall_logs FOR allow/deny counts\n| MARK edge critical WHERE bytes_pct >= 95\n| DIFF top5pct\
      \ membership day-over-day\n| ALERT WHEN failed_or_blocked_ratio ON core_path RISING"
- question: Does the day-over-day graph distance between logical communication snapshots, or a node's
    centrality exceeding historical control bounds, indicate emerging choke points or undocumented routing
    changes?
  context: 'The analyst builds a daily logical communication graph and computes node degree, betweenness
    centrality, and a node-aligned graph distance (e.g., spectral or DeltaCon) between consecutive snapshots,
    assessing significance with permutation tests rather than fixed thresholds. A deterministic floor
    is kept: alert when a node''s centrality exceeds historical control bounds (e.g., median + 3*MAD).
    In the Model tactic, a sudden shift in graph structure can reveal an emerging choke point, a new pivot
    host, or an undocumented routing change introduced by an adversary. A positive result is a statistically
    significant graph-distance jump or a centrality breakout. A negative result means topology is evolving
    within normal bounds.'
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each_day:\n  G_t = build_logical_graph(zeek_conn)\n  COMPUTE degree, betweenness_centrality\
      \ PER node\n  dist = graph_distance(G_t, G_t-1)   // spectral or DeltaCon\n  p = permutation_test(dist)\n\
      \  ALERT WHEN p < 0.01\n  ALERT WHEN node_centrality > median + 3*MAD(history)"
- question: When direct link telemetry is incomplete, do inferred edges from a sparse Gaussian graphical
    model of per-host traffic time series reveal candidate undocumented paths that have no matching physical
    or LLDP link?
  context: Where direct link telemetry is missing, the analyst infers logical adjacency by estimating
    a sparse Gaussian graphical model / precision matrix from per-host traffic time series, using an l0/Laplacian-constrained
    estimator that controls edge count rather than an l1 penalty that over-densifies the graph. In the
    Model tactic this fills gaps in the topology where sensors are absent. A positive result is an inferred
    edge with no matching physical/LLDP link, which becomes a candidate undocumented path for analyst
    review (possible covert channel or rogue route). A negative result means inferred adjacency aligns
    with known physical links.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "X = per_host_traffic_time_series(zeek_conn)\nP = estimate_precision_matrix(X, constraint=l0_laplacian)\n\
      inferred_edges = nonzero_offdiagonal(P)\nFOR e IN inferred_edges:\n  IF e NOT IN physical_lldp_map:\n\
      \     FLAG e AS candidate_undocumented_path\nREVIEW flagged edges"
- question: Does a tomographic reconstruction from sparse active-probe latency/loss measurements predict
    links that are missing from or extra to the LLDP/SNMP map?
  context: From sparse internal active-probe metrics (latency/loss/path measurements between sampled sensor
    pairs), the analyst reconstructs the link map and predicts unobserved adjacencies without assuming
    a known topology, then diffs the reconstruction against the LLDP/SNMP map to surface missing or extra
    links. For explainability, each alert lists the top-3 measured paths/probes that most drove an inferred
    edge so analysts can validate against physical cabling. In the Model tactic this independently corroborates
    or challenges the directly observed topology. A positive result is a reconstructed link absent from
    LLDP/SNMP (or vice versa), pointing to hidden infrastructure or mapping error. A negative result means
    the reconstruction agrees with observed telemetry.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "M = active_probe_metrics(latency, loss, path) BETWEEN sensor_pairs\nrecon_map = neural_tomography_reconstruct(M)\
      \   // no assumed topology\ndiff = symmetric_difference(recon_map, lldp_snmp_map)\nFOR edge IN diff:\n\
      \  REPORT edge, top3_driving_probes(edge)\nALERT analyst_to_validate_against_cabling"
- question: Do community-detection or node-embedding results on the weighted conn.log graph reveal nodes
    whose cluster assignment changes abruptly, indicating unauthorized reconfiguration or lateral pivot
    infrastructure?
  context: The analyst runs community-detection or node-embedding/graph-learning on the weighted conn.log
    graph to infer functional segments, learning edges from node-feature smoothness/diffusion structure.
    Nodes whose cluster assignment changes abruptly are flagged as potential unauthorized reconfiguration
    or lateral pivot infrastructure. A classical PCA/EWMA detector runs on the same origin-destination
    flows in parallel as a deterministic floor, and the top-3 contributing features (e.g., new peer set,
    byte volume, port mix) are surfaced in the alert. In the Model tactic this exposes the logical segmentation
    an adversary must traverse and any sudden membership shifts. A positive result is an abrupt cluster
    reassignment with anomalous features; a negative result means segment membership is stable.
  answer_sources:
  - Zeek lldp.log
  - Zeek conn.log
  - Traceroute/path-probe results from internal sensors
  - Switch SNMP/forwarding-table and STP polls
  - Firewall connection logs (allow/deny)
  - 'NAI: Core network switches, distribution-layer switches, network sensor tap points, and the active-probe
    vantage points used to traverse critical uplinks.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = weighted_graph(zeek_conn)

      seg = community_detection_or_node_embedding(G)

      DIFF seg vs seg_prev

      FLAG nodes WITH abrupt_cluster_change

      parallel: pca_ewma = anomaly_detect(OD_flows)

      FOR alert: LIST top3_features (peer_set, byte_volume, port_mix)

      ALERT ''Possible reconfiguration / lateral pivot'''
