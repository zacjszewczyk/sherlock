name: 'D3-NTSA: Network Traffic Signature Analysis'
id: 73157b1f-17c8-4383-ab2f-e0486a0d0764
description: Investigate the coverage, fidelity, and failure modes of network signature-based detection
  by comparing live and replayed network traffic against deployed signatures and by running signatureless
  statistical and machine-learning analytics in parallel to surface what the signature engine misses.
  This playbook helps an analyst measure per-category detection rate against labeled malicious PCAP corpora,
  correlate NIDS signature hits with host process execution and expected multi-stage callbacks, match
  TLS JA3/JA4 fingerprints, profile signature failure and enforcement state (drop-vs-alert ratios, failed
  handshakes, HTTP 4xx/5xx, DNS NXDOMAIN), tune noisy and dormant rules, and forecast alert trends to
  detect coverage collapse. It also covers payload byte-frequency anomaly scoring (PAYL), high-entropy
  payload detection on cleartext channels, periodic-beaconing frequency analysis, Bayesian fusion of weak
  per-flow signals, unsupervised autoencoder ensembles (KitNET/Kitsune), and encrypted-traffic anomaly
  detection without decryption. Together these checks let a SOC analyst quantify signature-coverage gaps,
  find evasive or zero-day traffic, and feed recurring detections back into deterministic rules under
  the Detect tactic.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: When labeled malicious PCAP corpora (C2 traffic, exploit kits, web attacks pulled from threat-intel
    feeds) are replayed against the current Suricata/Snort rule set, what is the per-category true-positive
    detection rate, and which categories fall below a 90% replay-detection threshold?
  context: 'Detection objective: empirically measure, rather than assume, the efficacy and coverage of
    deployed network signatures. Replay each labeled malicious PCAP category against the live Suricata/Snort
    rules and compute detection rate as true positives divided by known events to build a measurable coverage
    scorecard. Any category scoring below 90% replay detection is recorded as a documented gap and prioritized
    for new rule development, per Diaz-Verdejo et al. who show stock rule sets carry high false negatives.
    Manage portable rules as code via SigmaHQ and convert to Suricata/Zeek. A low score reveals a real
    blind spot an adversary can exploit; a high score confirms category coverage. This directly serves
    the Detect tactic by quantifying where signature-based detection will silently fail. References: [Diaz-Verdejo
    et al.](https://www.mdpi.com/2076-3417/12/2/852); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources: &id001
  - IDS/IPS Alert Logs (e.g., suricata.eve.json with action=allowed|blocked)
  - Zeek conn.log, ssl.log, http.log, dns.log
  - Firewall connection logs (permit/deny)
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Network egress/ingress points, internal network choke points (e.g., between VLANs), and critical
    server segments.'
  range: Last 90 days; re-run on each rule-set change and threat-intel update
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for category in {C2, exploit_kit, web_attack, malware}:\n  pcaps = labeled_corpus(category)\
      \            // threat-intel feeds\n  tp = replay(pcaps) against suricata_rules -> count(alerts\
      \ matching known events)\n  detection_rate = tp / count(known_events(pcaps))\n  scorecard[category]\
      \ = detection_rate\n  if detection_rate < 0.90:\n    flag_gap(category); prioritize_new_rule(category)\
      \  // manage via SigmaHQ as code"
- question: Do NIDS signature alerts (e.g., Suricata HTTP/exploit hits) correlate with host process execution
    (Windows Event ID 4688) on the destination within one minute, and do stateful multi-stage rules confirm
    an inbound payload match is followed by the expected outbound callback (e.g., JNDI payload then outbound
    LDAP/RMI/DNS) before escalating?
  context: 'Detection objective: raise confidence and reduce false positives by linking network signatures
    to host-side execution and to the expected exploitation sequence. Correlate Suricata signature alerts
    to Windows Event ID 4688 process creation on the destination IP within a one-minute window, and apply
    stateful multi-stage logic that requires an inbound payload match followed by the matching outbound
    callback before escalating, as in NCC Group''s Log4Shell detection (JNDI payload -> outbound LDAP/RMI/DNS).
    Alert-correlation logic and TP/FP/FN coverage accounting follow Ghorbani et al. A confirmed payload-then-callback
    chain with a corresponding host process is high-fidelity evidence of successful exploitation; an isolated
    inbound hit with no callback or process is likely reconnaissance or noise. This advances the Detect
    tactic by turning single signature pops into corroborated, prioritized incidents. References: [NCC
    Group''s Log4Shell detection](https://www.nccgroup.com/research-blog/log4shell-reconnaissance-and-post-exploitation-network-detection/);
    [Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources: *id001
  range: Last 90 days, correlated within 1-minute payload-to-execution windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for sig in nids_alerts where sig.class in {http, exploit}:\n  host_exec = e4688 where Computer\
      \ maps to sig.dest_ip and ts within [sig.ts, sig.ts+60s]\n  // stateful multi-stage: inbound payload\
      \ then expected outbound callback\n  inbound = sig (e.g., JNDI payload)\n  callback = outbound conn\
      \ where dest in sig.src and proto in {LDAP,RMI,DNS}\n             within window\n  if inbound and\
      \ callback:\n    escalate('confirmed multi-stage exploitation', sig, host_exec, callback)"
- question: Does Zeek ssl.log contain any TLS sessions whose JA3/JA3S or JA4/JA4S/JA4H fingerprints match
    known-malicious malware-family blocklists, and are both fingerprint families maintained to survive
    browser TLS-extension randomization?
  context: 'Detection objective: identify malicious TLS clients/servers by their handshake fingerprints
    even when payloads are encrypted. Inspect Zeek ssl.log for known-malicious JA3/JA3S fingerprints and
    alert immediately on matches as high-fidelity malware-family indicators. Because browser TLS-extension
    randomization degrades JA3 stability, additionally compute and match JA4+ fingerprints (JA4/JA4S/JA4H)
    for randomization-resilient identification, and maintain both blocklists so coverage is not lost as
    clients evolve. A fingerprint match is a strong, low-false-positive indicator of a specific malware
    family or tool; absence of matches does not clear traffic but removes a known-bad path. This supports
    the Detect tactic by giving encrypted-channel signature coverage that content inspection cannot. References:
    [JA3/JA3S](https://github.com/salesforce/ja3); [JA4+](https://github.com/FoxIO-LLC/ja4).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ja3_blocklist = load(malicious_ja3); ja4_blocklist = load(malicious_ja4)\nfor s in ssl.log:\n\
      \  if s.ja3 in ja3_blocklist or s.ja3s in ja3_blocklist:\n    alert('malicious JA3/JA3S fingerprint',\
      \ s)\n  if s.ja4 in ja4_blocklist or s.ja4s in ja4_blocklist or s.ja4h in ja4_blocklist:\n    alert('malicious\
      \ JA4+ fingerprint', s)  // randomization-resilient"
- question: Do enforcement-state signals - IDS drop(blocked)-to-alert(allowed) ratios per signature, firewall
    deny/permit ratios per segment, failed TLS handshakes, and spikes in HTTP 4xx/5xx or DNS NXDOMAIN
    - deviate more than three standard deviations from the 30-day per-segment baseline, indicating evasion
    or a sensor/rule failure?
  context: 'Detection objective: treat signature failure and enforcement state as first-class coverage
    indicators rather than ignoring them. Track per-signature drop-vs-alert ratios, per-segment firewall
    deny/permit ratios, failed TLS handshake counts, and surges in HTTP 4xx/5xx or DNS NXDOMAIN. A sudden
    collapse in the blocked-vs-allowed ratio or a surge in failed connections can mean either active evasion
    or that a sensor/rule has silently failed; alert when these rates deviate more than three standard
    deviations from the 30-day per-segment baseline, per metrics in Ghorbani et al. A breach of the band
    is a lead that detection is degraded or being probed; values within band indicate healthy enforcement.
    This strengthens the Detect tactic by catching coverage loss that per-alert monitoring misses. References:
    [Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources: *id001
  range: Last 90 days, scored against a trailing 30-day per-segment baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for segment, sig in scope:\n  drop_alert_ratio = count(action=blocked) / max(count(action=allowed),1)\n\
      \  deny_permit = firewall_deny / max(firewall_permit,1)\n  failed_tls = count(tls handshake failures)\n\
      \  err_rate = count(http 4xx/5xx) + count(dns NXDOMAIN)\n  baseline = mean/std over trailing 30d\
      \ per segment\n  for metric in {drop_alert_ratio, deny_permit, failed_tls, err_rate}:\n    if abs(metric\
      \ - baseline.mean) > 3*baseline.std:\n      alert('enforcement-state deviation (evasion or sensor/rule\
      \ failure)', segment, sig, metric)"
- question: Across the last 90 days of triggered signature alerts, which signatures are in the top 5%
    by volume (candidates for false-positive tuning) and which are in the bottom 5% (dormant rules) needing
    a relevance or deprecation review, while preserving hard deterministic rules?
  context: 'Detection objective: keep the rule set healthy so noise does not bury detections and dormant
    rules do not waste coverage. Analyze the frequency distribution of all triggered signature alerts
    over 90 days; investigate the top 5% highest-volume alerts for false positives and tuning (scope HOME_NET,
    raise anomaly thresholds) and review the bottom 5% (dormant rules) for continued relevance or deprecation,
    following the rule-selection methodology of Diaz-Verdejo et al. Preserve hard deterministic rules
    and tune thresholds rather than deleting them. High-volume noisy rules erode analyst attention; never-firing
    rules may be misconfigured or obsolete. This serves the Detect tactic by maximizing usable, trustworthy
    signature coverage. References: [Diaz-Verdejo et al.](https://www.mdpi.com/2076-3417/12/2/852).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "dist = count(alerts) group by signature over last 90d\np95 = percentile(dist, 95); p05 = percentile(dist,\
      \ 5)\nfor sig, vol in dist:\n  if vol >= p95 and not sig.is_hard_deterministic:\n    review('noisy\
      \ - tune HOME_NET / raise threshold', sig, vol)\n  if vol <= p05:\n    review('dormant - check relevance\
      \ / deprecate', sig, vol)"
- question: When a time-series model (e.g., ARIMA) is trained on daily alert volume per signature category,
    do observed volumes show anomalous spikes or dips outside the predicted band - especially a sudden
    drop in a previously steady category that may signal an adversary tactic shift or a sensor/rule failure
    and thus a coverage gap?
  context: 'Detection objective: detect coverage gaps and tactic shifts by forecasting expected alert
    volume per category. Train a time-series forecasting model such as ARIMA on daily alert volume per
    signature category (malware, exploit-kit, policy-violation) and detect anomalous deviations against
    the predicted band. A sudden drop in a previously steady category may indicate an adversary changing
    tactics or a sensor/rule that has failed, flagging a coverage gap; an unexpected spike may indicate
    a campaign or a noisy rule. Surface the top contributing categories and the magnitude of deviation
    in the alert text for triage, consistent with explainable NIDS practice in xNIDS. A deviation is a
    lead to investigate detection health or a new campaign; in-band values indicate stability. This advances
    the Detect tactic with predictive monitoring of signature efficacy. References: [xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources: *id001
  range: Last 90 days for training; evaluate daily
  queries:
  - technology: ML/pseudocode
    query: "for category in {malware, exploit_kit, policy_violation}:\n  series = daily_count(alerts where\
      \ class==category) over training window\n  model = ARIMA.fit(series)\n  pred, band = model.forecast(next_day)\n\
      \  if observed < band.low or observed > band.high:\n    alert('alert-trend anomaly (possible coverage\
      \ gap or campaign)',\n          category, deviation=observed-pred, top_contributors)"
- question: Do new payloads, scored against per-(destination host, port, payload-length) 1-gram byte-frequency
    profiles built from a clean training window using simplified Mahalanobis distance, exceed the empirically
    derived per-service threshold (e.g., 99th percentile of training distances), marking them as candidate
    exploit or unknown payloads not covered by signatures?
  context: 'Detection objective: catch malicious payloads that content signatures miss by modeling normal
    byte composition. Build per-(destination host, port, payload-length) 1-gram byte-frequency profiles
    from a clean training window and score new payloads with simplified Mahalanobis distance, alerting
    on outliers as candidate exploit/unknown payloads, per Wang and Stolfo''s PAYL. This captures volume/composition
    deviations (byte counts, length) that signatures cannot express; derive the per-service distance threshold
    empirically, e.g., the 99th percentile of training distances. A high-distance payload is a lead for
    an unknown exploit on that service; in-profile payloads are normal. This serves the Detect tactic
    by adding signatureless payload anomaly detection in parallel to the signature engine. References:
    [Wang and Stolfo''s PAYL](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources: &id002
  - Zeek conn.log, ssl.log, http.log, dns.log
  - IDS/IPS Alert Logs (e.g., suricata.eve.json)
  - Packet capture / flow records (NetFlow/IPFIX)
  - Firewall connection logs (permit/deny)
  - 'NAI: Network egress/ingress points, internal choke points between VLANs, and critical server segments
    where signature visibility is uncertain.'
  range: Last 90 days for training; score new payloads continuously
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (dst_host, dst_port, len_bucket):\n  profile = mean/cov of 1-gram byte freq over clean\
      \ training payloads\n  thr = percentile(training_distances, 99)\nfor p in new_payloads:\n  d = simplified_mahalanobis(byte_freq(p),\
      \ profile[p.dst,p.port,p.len])\n  if d > thr[p.dst,p.port,p.len]:\n    alert('PAYL byte-frequency\
      \ anomaly - candidate unknown payload', p, d)"
- question: On protocols expected to be plaintext (HTTP bodies, DNS labels, non-TLS ports), do payload
    Shannon-entropy values exceed the per-service baseline (typically >7.0 bits/byte), indicating encryption,
    compression, or encoding consistent with covert tunneling or encrypted C2 that evades signatures?
  context: 'Detection objective: detect covert tunneling and encrypted C2 hiding on channels that should
    be cleartext. Compute Shannon entropy of payloads on protocols expected to be plaintext and alert
    when entropy exceeds the per-service baseline (typically >7.0 bits/byte indicates encryption/compression/encoding),
    per published baseline payload entropy values. High entropy on a cleartext port is a strong covert-tunneling
    or encrypted-C2 indicator that signatures cannot match because there is no fixed pattern to match.
    A high-entropy stream on an expected-plaintext channel is a strong lead; low-entropy human-readable
    traffic is normal. This supports the Detect tactic by finding obfuscated data movement that defeats
    content signatures. References: [Baseline Payload Entropy Values](https://www.mdpi.com/1999-5903/16/12/470).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "cleartext_scope = {http_body, dns_labels, non_tls_ports}\nfor p in payloads where p.channel\
      \ in cleartext_scope:\n  H = shannon_entropy(p.bytes)\n  baseline = per_service_entropy_baseline(p.service)\n\
      \  if H > max(baseline, 7.0):\n    alert('high-entropy payload on cleartext channel - covert tunnel\
      \ / encrypted C2', p, H)"
- question: Applying discrete FFT and connection-count/byte-size scoring to per-(src,dst) connection timing
    in Zeek conn.log, which host pairs exhibit periodic beaconing or long connections, and do per-flow
    temporal features fingerprint the flow as automated rather than human?
  context: 'Detection objective: surface C2 beaconing by its timing regularity, independent of payload
    content. Apply a discrete Fast Fourier Transform plus connection-count and byte-size scoring to per-(src,dst)
    connection timing in Zeek conn.log to surface periodic beaconing and long connections, using RITA,
    and complement with the 69 per-flow temporal features of Koumar et al. to fingerprint automated flows.
    This profiles frequency (connections/min, beat regularity) without needing to read payloads, so it
    works even on encrypted C2. A strong periodic peak or automated-flow fingerprint is a beaconing lead;
    irregular human-like timing is normal. This advances the Detect tactic by catching signatureless,
    timing-based C2 indicators. References: [RITA](https://github.com/activecm/rita); [Koumar et al.](https://dl.acm.org/doi/abs/10.5555/3581644.3581681);
    [Zenodo dataset](https://zenodo.org/records/8035724).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for (src,dst) in conn.log:\n  intervals = diff(sorted(conn.ts))\n  spectrum = FFT(interval_series)\n\
      \  if dominant_period(spectrum) strong and low_jitter:\n    score = beacon_score(connection_count,\
      \ byte_size_consistency)  // RITA\n    feats = temporal_features(flow)  // 69 features per Koumar\
      \ et al.\n    if score high or feats ~ automated:\n      alert('periodic beaconing / long connection',\
      \ src, dst, score)"
- question: When multiple weak per-flow detectors (byte-frequency distance, entropy, beacon score, length,
    failed-connection rate) are combined through a Bayesian network into a single posterior probability
    of malicious traffic, which flows exceed the malicious-posterior threshold, and which constituent
    detectors contributed most?
  context: 'Detection objective: reduce false positives by fusing weak signals instead of OR-ing independent
    thresholds. Combine multiple weak per-flow detectors - byte-frequency distance, entropy, beacon score,
    length, failed-connection rate - through a Bayesian network into a single posterior probability of
    malicious traffic, reducing false positives versus threshold-OR aggregation, per Kruegel et al. Report
    which constituent detectors contributed most to each posterior for analyst triage. A high posterior
    backed by multiple corroborating detectors is a strong, low-noise lead; a high single-detector value
    alone is downweighted. This serves the Detect tactic by producing prioritized, explainable signatureless
    detections. References: [Kruegel et al.](https://ieeexplore.ieee.org/document/1254306/).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "detectors = {byte_freq_dist, entropy, beacon_score, length, failed_conn_rate}\nbn = BayesianNetwork(detectors\
      \ -> malicious)\nfor flow in flows:\n  evidence = {d: detector_value(flow, d) for d in detectors}\n\
      \  posterior = bn.infer_malicious(evidence)\n  if posterior > thr:\n    alert('Bayesian-fused malicious\
      \ flow', flow, posterior, top_contributing_detectors(evidence))"
- question: Running an unsupervised autoencoder ensemble (KitNET) over incrementally computed packet-stream
    statistics (bandwidth, jitter, packet rate per channel/host), which flows produce reconstruction RMSE
    above the auto-learned threshold, marking them as anomalies that no signature covers?
  context: 'Detection objective: catch novel attacks with no existing signature using online, unsupervised
    anomaly detection. Run an unsupervised autoencoder ensemble (KitNET) over incrementally computed packet-stream
    statistics - bandwidth, jitter, packet rate per channel/host - and flag flows whose reconstruction
    RMSE exceeds an auto-learned threshold as anomalies, per Kitsune. Surface the top-3 contributing features
    (e.g., outbound byte rate, jitter) in the alert text for explainability. A high-RMSE flow is a lead
    for novel tooling or attack behavior the signature engine cannot see; low-RMSE flows fit learned normal.
    This advances the Detect tactic with line-rate, signatureless anomaly detection layered over the rule
    set. References: [Kitsune](https://arxiv.org/abs/1802.09089); [Kitsune-py code](https://github.com/ymirsky/Kitsune-py).'
  answer_sources: *id002
  range: Last 90 days for training; score flows online/near real-time
  queries:
  - technology: ML/pseudocode
    query: "feats = incremental_stats(packet_stream)  // bandwidth, jitter, packet_rate per channel/host\n\
      model = KitNET()  // unsupervised autoencoder ensemble, online\nfor f in flows:\n  rmse = model.score(feats(f))\n\
      \  if rmse > model.auto_threshold:\n    alert('autoencoder anomaly - novel uncovered traffic', f,\
      \ rmse, top3_features(f))"
- question: Where TLS defeats content signatures, do learned representations of encrypted-flow and handshake
    metadata (sizes, timing, JA4 context) via contrastive self-supervised learning flag flows as candidate
    C2, and can feature-attribution convert recurring detections into new deterministic Suricata/Sigma
    rules?
  context: 'Detection objective: detect malicious encrypted traffic without decryption and feed findings
    back into the signature-coverage loop. Where TLS defeats content signatures, learn representations
    of encrypted-flow and handshake metadata (sizes, timing, JA4 context) via contrastive self-supervised
    learning and score deviations as candidate C2, per ET-SSL. Use feature-attribution from xNIDS to surface
    the top contributing flow features and to convert recurring detections into new deterministic Suricata/Sigma
    rules; select and tune models per the benchmark trade-offs in Kasongo and Sun. A flagged encrypted
    flow with consistent attributed features is a C2 lead and a candidate new rule; in-distribution flows
    are normal. This completes the Detect tactic by extending detection into encrypted channels and closing
    the signature gap over time. References: [ET-SSL](https://www.nature.com/articles/s41598-025-08568-0);
    [xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng); [Kasongo and Sun](https://arxiv.org/html/2401.12262v1).'
  answer_sources: *id002
  range: Last 90 days for training; score encrypted flows continuously
  queries:
  - technology: ML/pseudocode
    query: "model = ET_SSL.contrastive_pretrain(encrypted_flow_metadata)  // sizes, timing, JA4 context\n\
      for f in tls_flows:\n  score = model.deviation(f)\n  if score > thr:\n    attribution = xNIDS.attribute(f)\
      \  // top contributing features\n    alert('encrypted-traffic anomaly - candidate C2', f, score,\
      \ attribution)\n    if recurring(attribution): propose_rule('new Suricata/Sigma rule', attribution)"
