name: 'D3-CSPP: Client-server Payload Profiling'
id: 06d3cffb-34db-4af1-a11d-8e0789c0f9e0
description: Investigate client-server request/response payloads for deviations from established per-(client,
  server, service/URI or query) baselines that may indicate malicious payload delivery, exploitation,
  command-and-control, or data exfiltration. This playbook helps an analyst profile HTTP, DNS, file, and
  connection telemetry by size, entropy, structure, request/response ratio, volume, frequency, and timing;
  correlate suspicious payloads with threat intelligence and known C2 templates; fingerprint TLS/HTTP
  client-server stacks (JA3/JA3S/JA4+); baseline payload size, entropy, and failure-state rates statistically;
  and apply unsupervised, encrypted-traffic, sequence, and graph machine-learning models to surface novel
  and high-jitter C2. It spans deterministic rules, statistical baselining, and ML so deterministic high-confidence
  hits and explainable anomaly models reinforce one another.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any HTTP request/response exchanges contain payloads whose file hashes match known-malicious
    threat-intelligence indicators, or exhibit suspicious request/response asymmetry (high-entropy POSTs
    to sensitive URIs that return zero-length or empty bodies) that would indicate code injection or a
    command channel?
  context: Under the Detect tactic, this question hunts for client-server payloads that look like exploitation
    or C2 delivery. Cross-reference Zeek files.log payload hashes against threat-intel indicator feeds,
    and inspect HTTP exchanges for sensitive URI POSTs where the request body is large or high-entropy
    but the response body length is unexpectedly zero or empty. That asymmetry, combined with flow-metadata
    cues (transfer sizes, durations, request-to-response delay) from the Vectra malicious-payload patent,
    often marks a successful injection or an established command channel rather than benign traffic. A
    positive result is a payload that both matches a known indicator and shows the abnormal flow shape;
    a negative result is matched hashes with normal, symmetric, expected request/response behavior.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for rec in http.log join files.log:\n  if files.md5 in TI_indicators: alert('payload hash\
      \ match', rec)\n  if rec.method=='POST' and is_sensitive_uri(rec.uri)\n     and entropy(rec.request_body)\
      \ > 7.0\n     and rec.response_body_len == 0:\n       alert('high-entropy POST with empty response\
      \ - possible injection/C2', rec)"
- question: Are there client-server payloads that violate explicit protocol/policy expectations for their
    endpoint - for example oversized uploads to admin endpoints, unexpected binary or high-entropy content
    in JSON APIs, forbidden DNS TXT response formats, or URI/header/body structures matching known C2
    (Cobalt Strike Malleable) templates?
  context: This deterministic, rule-based check encodes what each endpoint should and should not carry,
    then alerts on explicit violations. For the Detect tactic, codify disallowed payload characteristics
    per endpoint (e.g., large uploads to administrative paths, binary or high-entropy bodies inside APIs
    that should be text/JSON, malformed or oversized DNS TXT responses) and regex-match request structure
    against published C2 profile templates. A hit means a payload broke an explicit policy rule or matched
    a known malicious template, which is high-confidence and immediately actionable; a clean result means
    observed payloads conformed to per-endpoint protocol expectations.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule payload_policy_violation:\n  oversized_upload = (uri matches '/admin' and request_body_len\
      \ > MAX_ADMIN_UPLOAD)\n  binary_in_api   = (content_type=='application/json' and entropy(body) >\
      \ 7.0)\n  bad_dns_txt     = (dns.qtype=='TXT' and txt_len > MAX_TXT or txt matches FORBIDDEN_FMT)\n\
      \  c2_template     = regex_match(uri+headers+body, COBALT_STRIKE_PROFILES)\n  if oversized_upload\
      \ or binary_in_api or bad_dns_txt or c2_template: alert"
- question: For each client-server session, what are the JA3/JA3S and JA4+ TLS/HTTP stack fingerprints,
    and do any of them match a known-bad fingerprint list or deviate from the approved client baseline
    for that server?
  context: Fingerprinting the client and server TLS/HTTP stack lets you spot tooling that masquerades
    as a legitimate client. Under Detect, compute JA3/JA3S and the more version-resilient JA4+ fingerprints
    per session and compare them to known-bad lists and to the approved baseline of clients that normally
    talk to a given server. A fingerprint that matches known-bad or that is anomalous for the server is
    a strong lead. Because modern browsers randomize TLS extensions and cause JA3 churn, prefer JA4 and
    add per-process context to suppress benign drift, otherwise you will generate false positives from
    normal browser updates.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for ssl in ssl.log:\n  ja3 = compute_ja3(ssl); ja3s = compute_ja3s(ssl); ja4 = compute_ja4plus(ssl)\n\
      \  if ja3 in KNOWN_BAD or ja4 in KNOWN_BAD: alert('known-bad fingerprint', ssl)\n  if ja4 not in\
      \ approved_baseline[ssl.server]:\n     if not benign_browser_randomization(ja4, process_context):\
      \ alert('anomalous client stack', ssl)"
- question: On channels expected to carry plaintext, do any request/response bodies or DNS TXT/label contents
    show Shannon entropy above the service-specific baseline (e.g., >=7.2 for encrypted/packed content
    versus ~4.5-6.5 for native text/code), indicating hidden encrypted, packed, or encoded payloads?
  context: High entropy on a channel that should be plaintext is a classic sign of smuggled encrypted,
    packed, or encoded data. For the Detect tactic, compute Shannon entropy of HTTP bodies and DNS TXT/label
    content and compare against the per-service expected range; encrypted or packed content trends toward
    maximum entropy (~7.2-8.0) while native text and code sit lower (~4.5-6.5). Alerts where a normally
    plaintext service suddenly carries high-entropy content can reveal exfiltration, encrypted C2, or
    staged payloads. Tune baselines per service to avoid flagging legitimately compressed or already-encrypted
    content.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for rec in http.log, dns.log:\n  e = shannon_entropy(rec.body or rec.dns_txt or rec.query)\n\
      \  base = entropy_baseline[rec.service]\n  if expected_plaintext(rec.service) and e >= max(7.2,\
      \ base.p99):\n     alert('high-entropy payload on plaintext channel', rec, e)"
- question: For each client-server-URI tuple, do request_body_len or resp_body_len values fall outside
    the 30-day mean +/- (empirically derived) standard-deviation band, and are any DNS TXT responses in
    the top 99th entropy percentile?
  context: This statistical baseline turns each conversation into its own normal model. Under Detect,
    compute rolling 30-day means and standard deviations of request and response body lengths per (client,
    server, URI) tuple and alert when values exceed roughly 3 standard deviations - calibrating the multiplier
    from your own traffic rather than assuming it. Also rank DNS TXT response entropy and flag the top
    99th percentile. Sustained deviations in payload size, or unusually high-entropy DNS TXT responses,
    frequently indicate exfiltration, tunneling, or anomalous payload delivery against an otherwise stable
    service profile.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days (rolling 30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group http by (client, server, uri) over 30d:\n  mu_req,sd_req = mean_std(request_body_len);\
      \ mu_resp,sd_resp = mean_std(resp_body_len)\n  k = empirical_multiplier(service)  # ~3\n  alert\
      \ if |request_body_len-mu_req| > k*sd_req or |resp_body_len-mu_resp| > k*sd_resp\ndns_txt: alert\
      \ if entropy in top 1% (p99)"
- question: Across conversations, do request-to-response byte ratios, total bytes, connection frequency,
    flow duration, or inter-arrival timing show sustained shifts from historical distributions, and do
    any flows score as beaconing under coefficient-of-variation, MAD/skew, Fourier periodicity, or jitter-robust
    autocorrelation tests?
  context: Beaconing and C2 reveal themselves through the rhythm and shape of traffic over time, not single
    events. For the Detect tactic, track request-to-response byte ratios, per-conversation volume, connections
    per minute, flow duration, and inter-arrival timing from Zeek http.log/conn.log, then look for sustained
    shifts from history. Score regularity with coefficient of variation, skew/MAD, and Fourier periodicity
    of intervals and payload sizes (as in RITA/RITA-J), and add jitter-robust autocorrelation with benign-service
    whitelisting (BAYWATCH) to catch attackers who add jitter. A high beacon score on a non-whitelisted
    destination is a strong C2 indicator.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group conn/http by (client, server) over history:\n  ratio = req_bytes/resp_bytes; vol = sum(bytes);\
      \ freq = conns_per_min; dur = flow_duration\n  cv = std(intervals)/mean(intervals); periodic = fourier_peak(intervals,\
      \ sizes)\n  beacon_score = combine(low_cv, mad_skew, periodic, jitter_autocorr)\n  if sustained_shift(ratio,vol,freq,dur)\
      \ or (beacon_score>THRESH and server not in whitelist): alert"
- question: For each client-server-URI, are per-endpoint failure rates - HTTP 4xx/5xx, zero-length responses,
    DNS NXDOMAIN/SERVFAIL, and firewall-blocked connections - spiking sustainedly above baseline (e.g.,
    >3x over a 1-hour window) in a way that accompanies payload anomalies?
  context: 'Failure-state telemetry is a distinct and often-overlooked signal: C2 and exploitation activity
    frequently shift the success/failure ratio of a service. Under Detect, baseline per-(client, server,
    URI) rates of HTTP 4xx/5xx, zero-length responses, DNS NXDOMAIN/SERVFAIL, and firewall blocks, then
    alert on sustained spikes (for example >3x baseline over an hour) - especially when they coincide
    with payload size or entropy anomalies. Derive per-flow temporal and size features as in single-flow
    time-series classification. A correlated spike in failures plus payload anomalies suggests scanning,
    brute force, dead-drop retries, or failing exploitation attempts rather than normal error noise.'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days (1-hour comparison windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group by (client, server, uri) per 1h window:\n  fail = rate(http_4xx_5xx) + rate(resp_len==0)\
      \ + rate(dns NXDOMAIN/SERVFAIL) + rate(fw_blocked)\n  base = baseline_fail_rate(client,server,uri)\n\
      \  if fail > 3*base and coincides_with(payload_anomaly): alert('failure spike + payload anomaly')"
- question: When an unsupervised anomaly model (Isolation Forest or DBSCAN) is trained on historically
    normal traffic using payload size, entropy, request/response byte ratio, URI frequency, and timing
    features, which conversations are flagged as outliers, and what are the top contributing features
    for each?
  context: Unsupervised models catch novel exploit, C2, and exfil behavior that fixed rules and thresholds
    miss. For the Detect tactic, train Isolation Forest (a low-latency baseline competitive with autoencoders
    for zero-day detection) or DBSCAN on per-conversation flow metadata - payload size, body entropy,
    request/response byte ratio, URI frequency, and timing - then flag outliers as candidates. Critically,
    emit the top-3 contributing features (e.g., resp_body_len, body entropy, interval CV) via SHAP attribution
    in the alert so an analyst can triage quickly. Outliers with explainable, security-relevant drivers
    warrant investigation; outliers driven by benign operational change can be tuned out.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days (train on prior normal baseline)
  queries:
  - technology: ML/pseudocode
    query: "X = features(payload_size, body_entropy, req_resp_ratio, uri_freq, timing) over normal_history\n\
      model = IsolationForest().fit(X)   # or DBSCAN\nfor conv in stream:\n  if model.predict(features(conv))\
      \ == outlier:\n     top3 = shap_top_features(model, conv, 3)\n     alert('novel payload behavior',\
      \ conv, top3)"
- question: Within encrypted (TLS) sessions, do self-supervised/contrastive representations of flow and
    payload-size sequences flag any conversations as anomalous C2, using version-agnostic flow features
    (payload sizes, directions, timing) that remain effective even after TLS 1.3 hides handshake metadata?
  context: Most malicious traffic is now encrypted, so detection must work without decryption. Under Detect,
    build self-supervised/contrastive representations over flow and payload-size sequences to surface
    encrypted C2 anomalies, and rely on version-agnostic flow-level features - payload sizes, directions,
    and timing - that survive the loss of handshake visibility in TLS 1.3. This lets you detect malicious
    encrypted channels by behavior rather than content. A session flagged as anomalous by these representations,
    particularly to a rare or new destination, is a strong lead for encrypted C2 or exfiltration.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = flow_and_payload_size_sequence(tls_session)  # sizes, directions, timing (TLS1.3-safe)\n\
      rep = self_supervised_encoder(seq)\nif anomaly_score(rep) > THRESH and dest in (rare or new):\n\
      \  alert('encrypted C2 anomaly (no decryption)', tls_session)"
- question: Where attackers randomize intervals and payload sizes to defeat coefficient-of-variation and
    Fourier rules, do LSTM/transformer time-series models flag high-jitter beacons, and do graph neural
    networks over the client-server communication graph reveal hub-and-spoke C2 topologies?
  context: Sophisticated actors deliberately add jitter and size randomization to evade statistical beacon
    detection. For the Detect tactic, apply LSTM/transformer sequence models to the time series of intervals
    and sizes to catch high-jitter beacons, and run graph neural networks over the client-server communication
    graph to surface hub-and-spoke C2 structures that are invisible at the single-flow level. Run these
    advanced models in parallel with deterministic rules and statistical thresholds rather than as a replacement,
    so simple high-confidence detections and explainable models reinforce each other. A node or flow flagged
    by both sequence and graph models, especially against rare destinations, is a high-priority C2 candidate.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Key network egress points (internet gateway/proxy), internal segments fronting critical servers
    (web servers, domain controllers, APIs), and DNS resolvers. Baselines are computed per (client, server,
    service/URI or query) tuple.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "ts = sequence(intervals, sizes)\nif lstm_transformer_beacon(ts) == anomalous: flag_beacon(flow)\n\
      g = build_comm_graph(client_server_flows)\nfor node in gnn_classify(g):\n  if node.label=='hub_spoke_c2':\
      \ alert('graph C2 topology', node)\n# run alongside deterministic + statistical detectors"
