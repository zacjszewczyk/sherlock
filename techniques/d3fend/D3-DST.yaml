    query: "model = LSTM_next_event(trained on benign auth/proc/dns/net sequences)\nseq = ordered_events(window\
      \ around decoy_hit)\nfor step in seq:\n  if observed_event not in model.topk_predicted(step):\n\
      \     mark_anomalous(step)\nif anomalous_steps>=k or attention_pivot==decoy_event:\n   alert score=model.anomaly_score,\
      \ top3=attention_fields"
- question: After decoy-token activity, do reconstructed host-to-host login-causality paths show rare
    or anomalous new login edges, and what is the estimated lateral-movement likelihood for the source,
    to prioritize containment targets?
  context: A successful decoy-credential theft often precedes lateral movement. Reconstruct host-to-host
    login-causality paths and score path rarity per Hopper, estimate lateral-movement likelihood with
    unsupervised graph embeddings that flag anomalous new edges (CyberGraph), and apply temporal link
    prediction of anomalous future login edges (Euler) -- all using only first-party authentication logs.
    This ranks which downstream hosts the attacker is most likely to reach next, prioritizing isolation.
    A positive result (rare causality paths or predicted anomalous edges originating from the decoy-using
    source) identifies high-risk lateral-movement targets for proactive containment.
