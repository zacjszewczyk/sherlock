  - 'NAI: Decoy systems, honeypots, high-value servers (e.g., Domain Controllers, database servers), identity
    providers/SSO endpoints, web/API gateways, and endpoints where decoy tokens are planted.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "decoy_token_events\n| enrich host_owner, allowed_logon_type, approved_zones, expected_window\n\
      | where src_host not in approved_hosts\n   or logon_type not in allowed_logon_type\n   or src_zone\
      \ in (remote, untrusted)\n   or event_time not in expected_window\n   or tuple(user,src_host,dst_host,hour)\
      \ not in historical_tuples\n| alert severity=critical, scope={src_host,dst_host}"
- question: In the 10- and 60-minute windows after a decoy token is used, is there a burst of failure-mode
    signals -- failed logons (4625), Kerberos failures (4771 / 4769 error codes), HTTP 401/403/404, DNS
    NXDOMAIN, or blocked/denied connections -- or a success-after-failures pattern (e.g., >=5 failures
    then 1 success)?
  context: After a decoy hit, explicitly track distinct failure-mode signals tied to the decoy session
    within short windows. A burst of failures, or a success that follows a run of failures, indicates
    active credential testing and replay -- the attacker is probing what the harvested token unlocks.
    The volume/frequency/state metric set is grounded in honeypot data-analysis research. This question
    separates a passive token observation from active exploitation attempts and helps gauge attacker intent
    and tooling. A positive result (clustered failures or success-after-failures) strongly indicates hands-on-keyboard
    credential abuse; a negative result with only the single decoy hit may indicate automated scraping
    or staging.
