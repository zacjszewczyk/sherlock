      \ per hour, last 90d\n  cp = changepoint(series, method=PELT|CUSUM|BOCPD, penalty=tuned_<1pct_FAR)\n\
      \  if cp.time within +/-1h of decoy_hit.time:\n     alert severity=medium-high, feature=cp.metric"
- question: After a decoy trigger, how rare is the session along source IP, ASN, login hour, logon type,
    and first-time destination access versus the entity's history, and does search/navigation behavior
    (command/page frequency and volume) resemble an actor unfamiliar with the environment?
  context: An attacker using a stolen decoy token does not know the environment and behaves differently
    from the legitimate principal. Calculate rarity/z-scores for source IP, ASN, login hour, logon type,
    and first-time destination access versus historical behavior, combine them into a composite anomaly
    index, and surface the top-3 contributing features in the alert. Add one-class search/navigation-behavior
    modeling (command/page frequency and volume) per Modeling User Search Behavior for Masquerade Detection
    to catch indiscriminate browsing. A high composite novelty score with masquerade-like browsing indicates
    an unfamiliar operator; the top contributing features make the alert explainable and triage-ready.
  answer_sources:
