  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "let t0 = decoy_token_event.time\nevents between t0 and t0+60m where src=decoy_src\n| summarize\
      \ failed_logon=countif(id==4625),\n    krb_fail=countif(id in (4771,4769) and error!=0x0),\n   \
      \ http_deny=countif(http_status in (401,403,404)),\n    dns_nx=countif(dns_rcode==NXDOMAIN),\n \
      \   conn_block=countif(conn_state==denied)\n    by window(10m), src\n| where (failed_logon+krb_fail+http_deny)\
      \ >= 5\n   or success_after_failures(>=5 fail then >=1 success)\n| alert severity=high"
- question: After a decoy-token hit, do destination-port entropy, unique-destination count, DNS query
    burst rate, or transferred-byte volume over 10- and 60-minute windows exceed the per-segment 95th-percentile
    baseline, and do byte-frequency distributions resemble exfiltration or C2 rather than normal traffic?
  context: An attacker who has just used a stolen credential typically pivots into reconnaissance. Compute
    destination-port entropy, unique-destination counts, DNS query burst rate, and transferred-byte volume
    in 10- and 60-minute windows after each decoy hit, and flag sustained values above the segment 95th-percentile
    baseline derived from 30-day per-segment history. Score abnormal exfil/C2 byte distributions with
    per-port/length byte-frequency profiling and Mahalanobis distance, as in PAYL. High port entropy plus
    many unique destinations indicates scanning; abnormal byte distributions indicate exfiltration or
    beaconing. A positive result quantifies the post-compromise reconnaissance and prioritizes the source
    for containment; thresholds must be environment-specific to remain defensible.
