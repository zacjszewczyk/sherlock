    query: "for each decoy_session:\n  z = {zscore(src_ip), zscore(asn), zscore(login_hour),\n       zscore(logon_type),\
      \ firsttime(dst)}\n  novelty = weighted_sum(z)\n  masq = oneclass_svm(command_freq, page_freq, volume)\n\
      \  if novelty > thr or masq==anomalous:\n     alert top3=argmax(z), severity=medium-high"
- question: When decoy-token usage is embedded in an ordered sequence of authentication, process, DNS,
    and network events, does a trained sequence model (LSTM next-event prediction or attention RNN) classify
    the surrounding event chain as malicious, with the decoy event acting as a high-weight pivot?
  context: Individual events may look benign in isolation; the malicious signal lives in the sequence.
    Train a sequence model -- a stacked LSTM with next-event prediction and per-step diagnosis as in DeepLog,
    or an attention RNN as in Recurrent Neural Network Attention Mechanisms for Interpretable System Log
    Anomaly Detection -- on ordered authentication/process/DNS/network events, so decoy-token usage acts
    as a high-weight pivot in classifying malicious vs. benign trajectories. Output the attention-weighted
    top-3 anomalous fields in the alert text for explainability. A positive classification indicates the
    event chain around the decoy hit deviates from learned-normal sequences and likely represents an attack
    progression; the diagnosed fields focus the analyst's review.
