questions:
- question: Has ANY authentication or access event referenced a known decoy session token or its associated
    decoy principal -- including decoy cookie values, API keys, Kerberos ticket/account SIDs, or OAuth
    client/refresh IDs -- in Windows logon events (4624/4625/4768/4769), identity-provider sign-ins, or
    web/proxy requests?
  context: 'This is the deterministic floor of the Decoy Object tactic: maintain an authoritative watchlist
    of every decoy token identifier and decoy principal you have planted, then trigger a high-severity
    alert on ANY match in authentication or access telemetry. Because legitimate users and services never
    touch a decoy token, a single hit is near-zero-false-positive evidence of adversary interaction with
    the deception. Use unique-per-placement tokens so that a hit also attributes the leak source (which
    host or share the adversary harvested it from), following the Honeywords, Tripwire, and Canarytokens
    patterns. Do not tune this rule away -- any match warrants immediate investigation and likely containment.
    A positive result confirms an attacker is in possession of and exercising deception credentials; a
    negative result simply means the decoys have not yet been touched.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Web/Proxy access logs
  - Cloud/IdP sign-in logs (OAuth/SAML token use)
  - 'NAI: Decoy systems, honeypots, high-value servers (e.g., Domain Controllers, database servers), identity
    providers/SSO endpoints, web/API gateways, and endpoints where decoy tokens are planted.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "auth_events (4624,4625,4768,4769, idp_signin, proxy_request)\n| where token_id   in (decoy_watchlist.token_ids)\n\
      \   or account_sid in (decoy_watchlist.sids)\n   or oauth_client in (decoy_watchlist.client_ids)\n\
      \   or cookie_value in (decoy_watchlist.cookies)\n| enrich placement_source = decoy_watchlist.lookup(matched_id)\n\
      | alert severity=critical, attribution=placement_source"
- question: When a decoy token is used, does the usage context violate expected constraints -- originating
    from an unauthorized host, an unexpected service/logon context, an off-hours window, or a remote/untrusted
    network zone -- or appear in a structurally novel (user, source-host, destination-host, time) tuple?
  context: 'Enrich each decoy-token event with host ownership, allowed logon type, approved source zones,
    and expected usage windows (which for a decoy is zero). Escalate immediately whenever usage originates
    from unauthorized hosts, unexpected service contexts, off-hours, or remote network zones. Treat a
    decoy account or token appearing in any structurally novel four-tuple of (user, source-host, destination-host,
    time) as adversary evidence, per Detecting Structurally Anomalous Logins. This validation layer hardens
    the deterministic alert against any conceivable benign misfire and immediately scopes the intrusion:
    the source host reveals the attacker''s foothold and the destination reveals their objective. A positive
    result indicates active misuse from an unauthorized context; the enrichment fields directly seed containment
    decisions.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4688
