  queries:
  - technology: SIEM/Stats pseudocode
    query: "let t0=decoy_token_event.time\nconn,dns between t0 and t0+60m where src=decoy_src\n| summarize\
      \ port_entropy=shannon(dst_port),\n    uniq_dst=dcount(dst_ip),\n    dns_rate=count(dns)/minutes,\n\
      \    bytes=sum(orig_bytes+resp_bytes)\n    by window(10m), src\n| where port_entropy > p95_baseline(segment)\n\
      \   or uniq_dst   > p95_baseline(segment)\n   or bytes      > p95_baseline(segment)\n| join payl_mahalanobis(byte_freq)\
      \ where distance>threshold\n| alert severity=high"
- question: Does per-source login rate, failed-logon rate, destination count, or byte volume exhibit a
    statistical change-point (step shift) following decoy-token use, as detected by CUSUM, PELT, or Bayesian
    online change-point detection against the entity's own historical series?
  context: 'Decoy-token use is a pivot point: legitimate or dormant behavior changes abruptly when an
    adversary begins operating with a harvested credential. Apply change-point detection (CUSUM/PELT/Bayesian
    online) to per-source login rate, failed-logon rate, destination count, and byte volume to detect
    the step shift that follows decoy use, per A Survey of Methods for Time Series Change Point Detection.
    Tune the penalty/threshold for a <1% false-alarm rate against per-entity historical series. This catches
    gradual or delayed exploitation that a fixed threshold would miss. A positive result -- a detected
    change-point coincident with the decoy hit -- corroborates that the same source''s behavior shifted
    after acquiring the deception credential.'
