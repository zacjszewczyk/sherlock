  - 'NAI: Decoy systems, honeypots, high-value servers (e.g., Domain Controllers, database servers), identity
    providers/SSO endpoints, web/API gateways, and endpoints where decoy tokens are planted.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = build_login_causality(auth_logs, last 90d)

      paths = hopper_paths(from=decoy_src)

      rare = paths where path_rarity_score > thr

      emb = graph_embed(graph); new_edges = anomalous_edges(emb)

      pred = temporal_link_predict(graph)  // Euler

      rank containment_targets by max(rare, new_edges, pred)

      alert top_targets, severity=high'
- question: Across all accumulated decoy-token interactions treated as adversarial-by-construction labels,
    can a supervised classifier trained on their behavioral and content features recognize previously
    unseen attacker tooling and patterns in new sessions?
  context: Every captured decoy-token interaction is, by construction, an adversarial example -- a free,
    high-quality label. Treat all such interactions as positive labels and train supervised classifiers
    (e.g., SVM or gradient-boosted trees) on behavioral and content features of those sessions to recognize
    previously unseen attacker tooling and patterns, following the decoy-to-ML pipeline of Uncovering
    Social Spammers. Surface the top contributing features per alert for explainability. This turns the
    deception program into a continuously improving detector that generalizes beyond exact token matches.
    A positive classification on a new session indicates it shares the behavioral fingerprint of confirmed
    attacker activity even absent a direct decoy hit.
