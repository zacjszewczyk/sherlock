name: 'D3-DST: Decoy Session Token'
id: 2a019671-95bd-41a1-833b-1ab784250b88
description: 'This playbook helps an analyst investigate adversary interaction with decoy session tokens
  (fake cookies, API keys, Kerberos tickets, OAuth/refresh tokens, or credentials) deployed as deception
  controls under the Decoy Object tactic. Because no legitimate workflow ever touches a decoy token, ANY
  authentication or access activity referencing one is high-confidence evidence that an adversary has
  harvested and is exercising deception-by-construction credentials. It guides the hunt across three layers:
  (1) deterministic symbolic-logic alerting on any decoy-token use, impossible-use context validation
  (unauthorized hosts, logon types, zones, off-hours), and post-token failure/state signals (failed logons,
  Kerberos error codes, HTTP 401/403/404, NXDOMAIN, blocked connections) that reveal credential testing
  and replay; (2) statistical baselining of post-token reconnaissance intensity (port entropy, unique-destination
  counts, DNS burst rate, byte volume), change-point detection of behavioral step-shifts, and session-novelty/masquerade
  scoring; and (3) machine-learning approaches including sequence models over event chains, lateral-movement
  probability and graph-based path scoring, and supervised attacker classifiers trained on accumulated
  decoy interactions. It draws on endpoint authentication logs (Windows Event IDs 4624/4625/4768/4769/4688),
  network telemetry (Zeek conn/dns/http), web/proxy access logs, and cloud/IdP sign-in logs to produce
  defensible, actionable detections for a SOC analyst.'
type: technique
