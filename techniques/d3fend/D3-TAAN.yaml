name: 'D3-TAAN: Transfer Agent Authentication'
id: 97853cf9-382d-4330-8b97-c8fb3be0c217
description: Investigate whether the organization's message transfer agents and critical data-relay services
  are properly authenticated and authorized to send or relay traffic. This playbook helps an analyst validate
  sender-domain ownership and transfer-path integrity for inbound and outbound email by examining SPF,
  DKIM, and DMARC results, identifier alignment, header parser-mismatch evasion, and authentication failure
  modes, and by baselining and modeling authentication-failure rates and structural sender fingerprints
  to surface spoofing, business-email-compromise, and spear-phishing campaigns. It also covers non-email
  relays (SFTP/FTP servers, message queues, API gateways, proxies), checking for enforcement of strong
  authentication, unauthorized or unauthenticated transfer attempts, credential-stuffing bursts, and anomalous
  transfer volumes indicative of exfiltration or relay misuse.
type: technique
related:
- tactic_id: D3-MH
  tactic_name: Message Hardening
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is inbound mail being delivered despite DMARC failing, or despite SPF/DKIM passing without
    aligning to the visible RFC5322.From domain, and do the envelope HELO/MAIL FROM domains disagree with
    the header From domain?
  context: Under the Message Hardening tactic, attackers spoof trusted sending domains to bypass sender
    validation. DMARC ties an SPF or DKIM pass to the visible From domain via identifier alignment; a
    verdict of 'fail', or a pass that does not align, indicates the message is not authorized by the claimed
    domain. Mail providers frequently deliver authentication-failing mail anyway, so evaluate the verdict
    yourself rather than trusting upstream disposition. Treat an aligned SPF OR DKIM pass as the non-negotiable
    floor and deterministically flag From-domain mismatches against HELO/MAIL FROM. A positive result
    (fail or non-aligned pass with mismatch) is strong evidence of spoofing and warrants quarantine and
    sender investigation.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - DMARC aggregate (rua) reports
  - Mail gateway Authentication-Results headers
  - 'NAI: External-facing Mail Transfer Agents (MTAs), Public DNS servers, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for msg in smtp.log JOIN authentication-results:\n  align_spf  = spf_pass  AND spf_domain\
      \  == header_from_domain\n  align_dkim = dkim_pass AND dkim_d       == header_from_domain\n  if\
      \ dmarc == 'fail' OR NOT (align_spf OR align_dkim)\n     OR helo_domain != header_from_domain\n\
      \     OR mailfrom_domain != header_from_domain:\n       alert('DMARC/alignment failure', msg.id,\
      \ header_from_domain, src_ip)"
- question: Do raw message headers show parser-mismatch evasion such as multiple or ambiguous From headers,
    space/comment-padded or encoded-word From values, or RFC5321-envelope versus RFC5322-header domain
    mismatches that let forged mail slip past authentication?
  context: Sophisticated spoofers exploit inconsistencies between how the authentication checker and the
    mail client parse headers, so SPF/DKIM/DMARC validate one identity while the user sees another. Re-parse
    and normalize raw headers on receipt and flag messages with duplicate/ambiguous From headers, padded
    or encoded-word addresses, or envelope-vs-header domain disagreement. Treat upstream Authentication-Results
    as untrusted unless a valid ARC chain is present, and suppress alerts on legitimately forwarded mail
    whose ARC seal preserves an upstream pass. A positive finding indicates deliberate evasion; ARC-validated
    forwards are benign.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - DMARC aggregate (rua) reports
  - Mail gateway Authentication-Results headers
  - 'NAI: External-facing Mail Transfer Agents (MTAs), Public DNS servers, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for msg in raw_messages:\n  h = normalize_headers(msg)\n  if count(h.from_headers) > 1 OR\
      \ has_encoded_word(h.from)\n     OR has_padding_or_comment(h.from)\n     OR h.envelope_from_domain\
      \ != h.header_from_domain:\n       if NOT valid_arc_chain(msg): alert('parser-mismatch evasion',\
      \ msg.id)"
- question: Can we distinguish the specific authentication failure modes (SPF fail vs softfail vs permerror/temperror,
    DKIM body-hash break vs missing key, and NXDOMAIN on _dmarc/_domainkey/SPF TXT lookups) rather than
    treating all failures as one bucket?
  context: Different failure modes carry different meaning. SPF permerror (e.g., >10 DNS lookups) or NXDOMAIN
    on your own domain's _dmarc/_domainkey/SPF TXT records signals misconfiguration that enables spoofing
    of your domain; a DKIM body-hash break suggests in-transit modification while a missing key suggests
    forgery; weak published policy (no DMARC, p=none, missing SPF) marks a domain as spoofable. Profiling
    these as distinct signals lets the analyst separate attacks from broken configuration and prioritize
    remediation that closes spoofing gaps.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - DMARC aggregate (rua) reports
  - Mail gateway Authentication-Results headers
  - 'NAI: External-facing Mail Transfer Agents (MTAs), Public DNS servers, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for msg in smtp.log:\n  classify spf in {pass,fail,softfail,permerror,temperror}\n  classify\
      \ dkim in {pass,fail_bodyhash,fail_nokey}\nfor q in dns.log where name ~ '_dmarc.|_domainkey.|spf':\n\
      \  if rcode == NXDOMAIN and name endswith our_domains:\n     alert('auth-record NXDOMAIN/misconfig',\
      \ name)"
- question: Over a rolling 30-day window, does the daily percentage of inbound mail failing SPF, DKIM,
    or DMARC exceed its locally-derived 95th-percentile baseline, or do failed-auth counts per source
    IP / claimed sender domain spike?
  context: A sudden rise in authentication failures often marks a targeted spoofing campaign against the
    organization or its partners. Compute three separate daily time series (SPF, DKIM, DMARC failure rates)
    and alert when any exceeds its own 95th percentile, deriving thresholds from local traffic because
    sender adoption of these protocols varies widely. Also track failed-auth count/min per source IP and
    per claimed sender domain. A breach of baseline focuses the analyst on the contributing senders/domains;
    staying within baseline indicates normal noise.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - DMARC aggregate (rua) reports
  - Mail gateway Authentication-Results headers
  - 'NAI: External-facing Mail Transfer Agents (MTAs), Public DNS servers, Internal DNS resolvers.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each day d in last 30d:\n  spf_rate[d]  = count(spf_fail)/count(all)\n  dkim_rate[d] =\
      \ count(dkim_fail)/count(all)\n  dmarc_rate[d]= count(dmarc_fail)/count(all)\nfor series in (spf_rate,dkim_rate,dmarc_rate):\n\
      \  if series[today] > p95(series[-30:]): alert('auth-failure surge', series)\ntrack failed_auth\
      \ count/min by src_ip, claimed_from_domain"
- question: Which inbound messages rank as most suspicious under directed anomaly scoring of first-party
    features such as a known display name paired with a never-before-seen From address, an unknown sender
    domain, or unusual sender-to-recipient pairings?
  context: Credential spear-phishing often reuses a trusted display name with a new address or impersonates
    a familiar contact. Non-parametric Directed Anomaly Scoring ranks events more suspicious than all
    benign events, surfacing only the top candidates and capping the analyst review to a fixed daily budget.
    Features are first-party (display-name/address reuse, sender-domain novelty, sender->recipient pairing),
    so the method works without message content. High-ranked events deserve manual review for impersonation;
    the bounded budget keeps alert volume realistic for a SOC.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - DMARC aggregate (rua) reports
  - Mail gateway Authentication-Results headers
  - 'NAI: External-facing Mail Transfer Agents (MTAs), Public DNS servers, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for msg in inbound:\n  f1 = known_display_name(msg.display) AND new_from_address(msg.display,\
      \ msg.from)\n  f2 = first_seen(msg.from_domain)\n  f3 = rare_pair(msg.from, msg.rcpt)\n  score =\
      \ directed_anomaly_score([f1,f2,f3])\nrank desc; alert top-N within daily_budget"
- question: Does the volume of DMARC aggregate (rua) reports indicating failures for our own domain spike
    above a time-series forecast, signaling widespread abuse of our domain name for spam or phishing?
  context: When attackers abuse your domain to spoof outsiders, receiving organizations report the failures
    back via DMARC rua. Forecasting that report volume (e.g., ARIMA) and alerting on unexplained spikes
    above prediction detects mass abuse of your domain that internal mail logs cannot see. Surface the
    top-3 contributing sending IPs/source-ASNs and the failing alignment dimension in the alert so triage
    can quickly identify the abuse source and whether it is a misconfigured legitimate sender or an attacker.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - DMARC aggregate (rua) reports
  - Mail gateway Authentication-Results headers
  - 'NAI: External-facing Mail Transfer Agents (MTAs), Public DNS servers, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = daily_count(rua_reports where result=='fail' AND domain in our_domains)\nmodel =\
      \ ARIMA.fit(series[:-1])\npred, ci = model.forecast(1)\nif series[today] > ci.upper:\n  alert('domain\
      \ abuse spike', top3(src_ip, src_asn), failing_alignment_dim)"
- question: Does mail purporting to be from a known sender deviate from that sender's learned content-agnostic
    structural profile (header order, MIME layout, X-Mailer/MUA fingerprint, encoding, transfer path),
    even when authentication superficially passes?
  context: Impersonation and business-email-compromise can occur even when SPF/DKIM/DMARC pass (e.g.,
    a compromised account or a look-alike that passes its own auth). Learning per-sender content-agnostic
    profiles from structural traits lets you flag messages claiming to be from a known sender whose structure
    deviates from history. Fuse with a modular classifier that emits interpretable per-module scores (header/auth
    anomaly, behavioral, intent) and report which module fired plus its top-3 features, not a bare score,
    so the analyst can judge whether the deviation reflects a new device or a genuine impersonation.
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - DMARC aggregate (rua) reports
  - Mail gateway Authentication-Results headers
  - 'NAI: External-facing Mail Transfer Agents (MTAs), Public DNS servers, Internal DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "profile[sender] = learn(header_order, mime_layout, x_mailer, encoding, path)\nfor msg in inbound\
      \ where msg.from in profile:\n  dev = distance(features(msg), profile[msg.from])\n  scores = modular_classifier(msg)\
      \  # header/auth, behavioral, intent\n  if dev > thresh OR max(scores) > thresh:\n     alert(fired_module,\
      \ top3_features)"
- question: Are there successful logins to critical relay servers (e.g., SFTP servers) from source IPs
    that are not on the approved allow-list, confirmed by the connection protocol/port in network logs?
  context: Relay services (SFTP/FTP, message queues, API gateways, proxies) must only accept authenticated,
    authorized clients. Monitoring successful logins (Windows Event ID 4624) from non-allow-listed source
    IPs, correlated with Zeek conn.log to confirm the protocol (e.g., port 22 for SFTP), deterministically
    catches unauthorized access. Keep this allow-list rule as the floor beneath any statistical or ML
    layer. A successful login from an unexpected source is a high-confidence indicator of compromised
    credentials or an unauthorized relay client and should trigger immediate review.
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Secure file transfer (SFTP/FTP) servers, critical application servers acting as data relays,
    API gateways, internal proxy servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for login in win:EventID==4624 where host in relay_servers:\n  if login.src_ip NOT in allow_list:\n\
      \    c = match conn.log(src_ip=login.src_ip, dst=host, port in {22,21,...})\n    alert('relay login\
      \ from non-allowlisted source', login.src_ip, host, c.proto)"
- question: Are relay services experiencing failed-authentication bursts from a single source, failures
    immediately preceding a success (credential stuffing into a valid relay), or connections rejected
    for missing client certificates or weak/downgraded TLS?
  context: 'Brute-force and credential-stuffing attacks against relays produce bursts of authentication
    failures, and a success right after failures can mean the attacker found valid credentials. Profile
    authentication failure explicitly: alert when Windows Event ID 4625 or Zeek ssh.log/ftp.log auth failures
    from one source exceed a tuned threshold (e.g., >5 in 5 min) or precede a success, and on rejections
    for missing client certs or downgraded TLS. A positive result indicates an active attack on relay
    authentication; benign automation may need allow-listing.'
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Secure file transfer (SFTP/FTP) servers, critical application servers acting as data relays,
    API gateways, internal proxy servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for src in sources:\n  fails = count(EventID==4625 OR ssh/ftp auth_fail by src in 5min window)\n\
      \  if fails > 5: alert('failed-auth burst', src)\n  if fails >= 1 AND later success(src): alert('success-after-failures',\
      \ src)\nfor c in ssh/ftp.log:\n  if missing_client_cert(c) OR tls_version < min OR downgraded(c):\
      \ alert('weak/downgraded auth', c)"
- question: For each authenticated relay service, does any source IP's daily transfer volume exceed its
    own 99th-percentile baseline of bytes in/out and connection frequency over a 30-day window?
  context: Once authenticated, a compromised or misused relay can be used to exfiltrate data. Baselining
    per-source transfer volume (bytes_in/bytes_out from Zeek conn.log) and connection frequency (count/min)
    over 30 days, then alerting when a source exceeds its own 99th percentile, flags abnormal data movement.
    Derive the percentile per service from local traffic since relays differ widely. A breach of baseline
    points to exfiltration or relay abuse and should be correlated with the authenticating identity and
    destination.
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Secure file transfer (SFTP/FTP) servers, critical application servers acting as data relays,
    API gateways, internal proxy servers.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for service in relays:\n  for src in sources:\n    vol[src] = daily_sum(bytes_in+bytes_out\
      \ from conn.log)\n    freq[src]= conn count/min\n    if vol[src][today] > p99(vol[src][-30:]):\n\
      \       alert('transfer-volume anomaly', src, service, vol[src][today])"
- question: When relay sessions are ranked by directed anomaly scoring over first-party features (new
    source IP, off-hours connect time, byte ratio, success-after-failures), which sessions surface as
    more suspicious than all benign sessions within the daily budget?
  context: Not every anomaly is worth an alert, so non-parametric directed anomaly scoring ranks relay
    sessions and surfaces only those more suspicious than all benign sessions, capping output to a fixed
    daily budget. First-party features (new source IP, off-hours connection time, byte-ratio, success-after-failures)
    require no labels. This keeps analyst load realistic while still elevating the riskiest relay sessions
    for review; top-ranked sessions warrant investigation for unauthorized access or exfiltration.
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Secure file transfer (SFTP/FTP) servers, critical application servers acting as data relays,
    API gateways, internal proxy servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for s in relay_sessions:\n  f = [new_source_ip(s), off_hours(s.start), byte_ratio(s), success_after_failures(s)]\n\
      \  score[s] = directed_anomaly_score(f)\nrank desc; alert top-N within daily_budget"
- question: Do relay connections fail to fit any learned normal cluster of behavior (source/destination
    IP, port, duration, byte volume, direction ratio), marking them as candidate unauthorized clients
    or novel misuse?
  context: Clustering Zeek conn.log connections to relay services (e.g., K-Means/DBSCAN) on source/destination
    IP, port, duration, byte volume and direction ratio learns the normal activity clusters of authorized
    clients. Connections that fit no cluster are candidate unauthorized clients or novel misuse patterns.
    Output the top-3 features driving the outlier decision (e.g., byte ratio, off-hours, unseen source)
    in the alert rather than a bare score so the analyst can validate whether it is a new legitimate integration
    or an attacker.
  answer_sources:
  - Zeek conn.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Secure file transfer (SFTP/FTP) servers, critical application servers acting as data relays,
    API gateways, internal proxy servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(conn.log to relays: src,dst,port,duration,bytes,dir_ratio)\nmodel = DBSCAN.fit(X)\
      \  # or KMeans\nfor c in new_connections:\n  if model.predict(c) == outlier/no_cluster:\n     alert('relay\
      \ connection outlier', top3_features(c))"
