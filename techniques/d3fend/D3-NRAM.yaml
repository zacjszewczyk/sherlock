name: 'D3-NRAM: Network Resource Access Mediation'
id: b9f4b418-0273-4e0f-99dd-fb7d55a5aac1
description: Investigate how effectively Network Resource Access Mediation (D3-NRAM) is enforced across
  the environment and detect breakdowns in least-privilege network access control. This playbook helps
  an analyst (1) verify that observed traffic between critical servers and non-privileged endpoints is
  limited to expected, authorized protocols and ports and is free of scanning or prohibited cleartext/deprecated
  protocol usage, and (2) confirm that authenticated access via valid credentials conforms to learned
  structural login patterns and expected host-to-host access paths, surfacing credential-switching paths
  to atypical servers and structurally anomalous logins even when port/protocol policy is satisfied. It
  combines deterministic deny-by-default zero-trust allow-list rules, statistical baselining of volumes,
  failure/denial rates, port usage and first-seen edges, and machine-learning anomaly scoring (flow clustering,
  online autoencoders, login-graph and temporal link prediction) with feature attribution, so a SOC analyst
  can measure access-control coverage gaps and catch unauthorized access, lateral movement, and scanning
  against Domain Controllers, application/file/database servers, jump hosts, and authentication infrastructure.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which observed network connections between non-privileged endpoints and critical servers do
    NOT match an approved allow-list of permitted communication tuples (source subnet, destination server
    IP, destination port, protocol) derived from documented access policy and a validated baseline?
  context: Within the Isolate (D3-I) tactic, the deterministic floor for Network Resource Access Mediation
    is deny-by-default zero-trust enforcement (NIST SP 800-207, Rose et al.). Maintain an allow-list of
    permitted communication tuples derived from documented access policy and validated against an observed
    baseline (e.g., the LANL Unified Host and Network Data Set, Turcotte et al.). Ingest Zeek conn.log
    and Windows Event ID 5156 (permitted connection) and alert on any connection that does not match an
    allow-list entry, implemented as stateful connection/protocol policy in the Zeek/Bro event-and-policy
    model (Paxson). A positive finding is a flow no policy permits — a candidate access-control failure,
    misconfiguration, or lateral movement. Keep this hard rule as the deterministic floor while layering
    statistical and ML detectors in parallel.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from conn (Zeek conn.log) OR connection (Windows EID 5156)

      | eval tuple = (src_subnet, dest_ip, dest_port, proto)

      | lookup allow_list on tuple

      | where NOT matched_allow_list

      | table _time, src_ip, src_subnet, dest_ip, dest_port, proto, service'
- question: Are any cleartext or deprecated protocols (Telnet/23, FTP/20-21, HTTP/80, SMBv1, LDAP-cleartext)
    being used on internal network segments, in violation of hardening policy?
  context: Supporting the Isolate (D3-I) tactic, this misuse-detection rule inspects Zeek conn.log service/port
    fields for cleartext or deprecated protocols that violate hardening policy on internal segments. Protocol-analyzer-driven
    misuse rules follow the Bro/Zeek design (Paxson) and the misuse-detection logic in Network Intrusion
    Detection and Prevention (Ghorbani et al.). A positive result is any internal use of Telnet, FTP,
    cleartext HTTP, SMBv1, or cleartext LDAP — each exposes credentials or data to interception and indicates
    a host or service that was never properly hardened, an attacker downgrading to a weaker protocol,
    or shadow IT. Alert immediately on match.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from conn.log\n| where src_subnet in internal AND dest_subnet in internal\n| where service\
      \ in (\"telnet\",\"ftp\",\"ftp-data\",\"http\",\"smb1\",\"ldap_cleartext\")\n   OR dest_port in\
      \ (23, 20, 21, 80, 445_smbv1, 389_cleartext)\n| table _time, src_ip, dest_ip, dest_port, service,\
      \ proto"
- question: Which connections reach sensitive management ports (RDP/3389, SSH/22, WinRM/5985-5986, SMB/445,
    WMI/135, RPC) from a source that is NOT a designated jump host or authorized admin subnet?
  context: Under the Isolate (D3-I) tactic, least-privilege boundary protection (NIST SP 800-53r5) requires
    that administrative access to critical servers originate only from designated jump hosts or admin
    subnets. Maintain an explicit rule set for sensitive management ports (RDP/3389, SSH/22, WinRM/5985-5986,
    SMB/445, WMI/135, RPC) and, using misuse rules (Ghorbani et al.), alert on any connection to these
    ports from a source outside the authorized admin set in Zeek conn.log or Windows Event ID 5156. A
    positive finding is administrative access from an ordinary endpoint — a strong indicator of lateral
    movement, credential abuse, or a misconfigured access-control boundary. Allow-list the legitimate
    jump hosts and admin subnets to suppress benign administration.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from conn (Zeek conn.log) OR connection (Windows EID 5156)

      | where dest_port in (3389, 22, 5985, 5986, 445, 135) OR proto == "rpc"

      | where src_ip NOT in authorized_admin_set (jump_hosts + admin_subnets)

      | table _time, src_ip, dest_ip, dest_port, proto, service'
- question: For each critical server, which connections from endpoint subnets use a service port outside
    the 99th percentile of historical connection frequency, a new/unexpected service port, or a byte volume
    whose z-score (or MAD-based modified z-score) exceeds a tuned threshold?
  context: This statistical baseline supports the Isolate (D3-I) tactic by profiling normal communication
    to each critical server from endpoint subnets using Zeek conn.log per-entity destination/port mix
    and byte-volume distributions (Heard et al., Dirichlet-process anomaly detection). Track Volume (bytes
    sent/received and out:in ratio) and Frequency (connections/min per destination port), and flag any
    port outside the 99th percentile of historical connection frequency, a new or unexpected service port,
    or a byte-volume modified z-score beyond a tuned threshold (start ~3.5; derive per-dataset from a
    30-day baseline). A spike to a typically low-traffic port (RDP/SSH) or an unusual data volume suggests
    misconfiguration or unauthorized access, possibly the early staging of exfiltration.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days (baseline 30 days, score recent windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from conn.log

      | stats count as conns, sum(orig_bytes+resp_bytes) as bytes by dest_ip, dest_port, src_subnet, _window

      | eventstats perc99(conns) as p99_freq, median(bytes) as med, mad(bytes) as mad by dest_ip, dest_port

      | eval mod_z = 0.6745*(bytes - med)/mad

      | where conns > p99_freq OR is_new_port(dest_ip, dest_port) OR abs(mod_z) > 3.5

      | sort mod_z desc'
- question: Which source hosts exhibit a high ratio of failed/blocked/RST connections consistent with
    scanning, or contact more than 20 unique destination IPs on one port (horizontal) or more than 20
    ports on one host (vertical) within a 5-minute window?
  context: 'Supporting the Isolate (D3-I) tactic, this method applies Threshold Random Walk / sequential
    hypothesis testing (Jung et al.) over per-source connection outcomes: scanners exhibit a far higher
    ratio of failed/blocked/RST connections than benign hosts. Compute each source''s success vs. failure
    outcomes from Zeek conn.log conn_state (S0, REJ, RSTO) and Windows Event ID 5157 (blocked connections),
    and flag a source once its likelihood ratio crosses the upper threshold (typically after 4-5 failed
    attempts). Retain a deterministic floor: also alert when a single source contacts >20 unique destination
    IPs on the same port (horizontal scan) or >20 ports on one host (vertical scan) within a 5-minute
    window. A positive finding is reconnaissance preceding lateral movement or a misconfigured/compromised
    host probing the network.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: 'Last 90 days (event-centered: 5-minute scan windows)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from conn.log (conn_state) OR blocked (Windows EID 5157)

      | eval failed = conn_state in ("S0","REJ","RSTO") OR event==5157

      | stats sum(failed) as fails, count as total, dc(dest_ip) as uniq_dst, dc(dest_port) as uniq_ports
      by src_ip, _5min

      | eval trw_lr = sprt(fails, total)

      | where trw_lr > upper_threshold OR fails >= 5 OR uniq_dst > 20 OR uniq_ports > 20

      | sort trw_lr desc'
- question: Which hosts or subnets show sustained deviations in blocked/failed connection rates (Windows
    Event ID 5157 denials and Zeek conn.log S0/REJ/RSTO states) above their per-host 99th percentile or
    a >3.5 modified z-score over a rolling window?
  context: 'For the Isolate (D3-I) tactic, treat blocked/failed connections as a distinct first-class
    signal — the network analog of NXDOMAIN/404. Baseline per-host and per-subnet rates of Windows Event
    ID 5157 denials and Zeek conn.log S0/REJ/RSTO states, then alert on sustained deviations (failed-connection
    rate exceeding the per-host 99th percentile or a >3.5 modified z-score over a rolling window) per
    Jung et al. and Ghorbani et al. A positive result indicates policy probing, misconfiguration, or an
    access-control failure: a host repeatedly hitting the deny rule may be an attacker enumerating permitted
    paths, a broken application, or a control that is silently blocking legitimate traffic. This complements
    raw scan detection by catching slower, sustained probing.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from denied (Windows EID 5157) OR conn.log where conn_state in ("S0","REJ","RSTO")

      | stats count as fails by host, subnet, _window

      | eventstats perc99(fails) as p99, median(fails) as med, mad(fails) as mad by host

      | eval mod_z = 0.6745*(fails - med)/mad

      | where fails > p99 OR mod_z > 3.5

      | sort mod_z desc'
- question: When a non-privileged endpoint communicates with a critical server on a given port for the
    FIRST time, does that new edge carry high surprisal given the historical per-source/per-destination/per-port
    node history?
  context: Supporting the Isolate (D3-I) tactic, this method maintains a per-source/per-destination/per-port
    history and scores the first time a non-privileged endpoint communicates with a critical server on
    a given port using Bayesian new-edge prediction (Metelli and Heard). Alert on new edges with high
    surprisal given node history; a never-before-seen endpoint-to-server-port edge is a hallmark of access-control
    failure or lateral movement. Derive surprisal thresholds from a 30-90 day baseline (e.g., the LANL
    Unified Host and Network Data Set). A positive result is a genuinely novel communication relationship
    to a sensitive destination — distinguishing a brand-new lateral path from the routine churn of established
    connections, which keeps the signal precise.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days (30-90 day node-history baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from conn.log

      | eval edge = (src_ip, dest_ip, dest_port)

      | lookup edge_history on edge

      | eval surprisal = bayesian_new_edge_score(src_ip, dest_ip, dest_port, history)

      | where first_seen(edge) AND dest_ip in critical_servers AND surprisal > threshold

      | sort surprisal desc'
- question: When unsupervised outlier models score Zeek conn.log/NetFlow feature vectors, which flows
    receive high anomaly scores or fail to fit normal clusters, and what are the top-3 contributing features
    (e.g., destination port, byte ratio, conn_state)?
  context: 'This ML method runs in parallel to the deterministic rules under the Isolate (D3-I) tactic.
    Score Zeek conn.log/NetFlow feature vectors (source/destination IP, port, protocol, duration, bytes,
    packets, conn_state) with unsupervised outlier models trained on a clean historical baseline: Isolation
    Forest (Liu et al.) and/or clustering with k-means/DBSCAN (Bohara et al.). Flag flows with high anomaly
    scores or that do not fit any normal cluster, and surface the top-3 contributing features in the alert
    text for analyst triage and explainability. A positive result is a flow whose combination of port,
    byte ratio, duration, and connection state jointly looks unlike normal traffic — catching novel access
    patterns that no single hard rule anticipated.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days (train on clean baseline, score recent flows)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [src_ip, dest_ip, dest_port, proto, duration, bytes, packets, conn_state]\nX =\
      \ build_vectors(conn_log_netflow, features)\niso = IsolationForest().fit(X_baseline)   # and/or\
      \ KMeans/DBSCAN\nscores = iso.score_samples(X)\nfor f in where(scores < threshold OR not_in_cluster(f)):\n\
      \    emit_alert(f, top3=feature_attribution(iso, f, k=3))"
- question: Does an online autoencoder ensemble over incremental per-host/per-channel flow statistics
    (bandwidth, packet/connection rates, jitter) produce reconstruction-error spikes indicating unexpected
    service access or scanning bursts, and which features contribute most to each spike?
  context: Supporting the Isolate (D3-I) tactic, this method runs an online autoencoder ensemble (Kitsune/KitNET,
    Mirsky et al.) over incremental per-host/per-channel flow statistics — bandwidth, packet and connection
    rates, jitter. It trains label-free on first-party traffic and flags reconstruction-error spikes caused
    by unexpected service access or scanning bursts. Report the top contributing features (highest per-feature
    reconstruction error) in the alert for explainability. A positive result is a host whose live flow
    statistics no longer reconstruct cleanly against its learned profile — an efficient, streaming way
    to detect anomalous network access without labeled attack data, complementing the batch clustering
    approach.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156 (Windows Filtering Platform - permitted connection)
  - Windows Event ID 5157 (Windows Filtering Platform - blocked connection)
  - Firewall flow logs / NetFlow
  - 'NAI: Internal network segments (e.g., server VLANs, user VLANs), firewall and network switch SPAN/TAP
    ports, microsegmentation policy enforcement points, Domain Controllers and other critical servers'
  range: Last 90 days (online/streaming over first-party baseline)
  queries:
  - technology: SIEM/ML pseudocode
    query: "kitnet = KitNET(train_on=first_party_flow_stats)\nfor window in stream(per_host_channel_stats[bandwidth,\
      \ pkt_rate, conn_rate, jitter]):\n    rmse = kitnet.process(window)\n    if rmse > anomaly_threshold:\n\
      \        emit_alert(host, channel, top_features=kitnet.top_recon_error_features(window))"
- question: Which authenticated logins violate the learned permitted set of (source host, destination
    host, user/role) login triples — even when the underlying flow satisfies port/protocol policy — and
    do any non-interactive service accounts perform interactive/RDP logons?
  context: 'Under the Isolate (D3-I) tactic, port/protocol policy alone cannot catch credential misuse
    over permitted paths, so this method mines frequent (source host, destination host, user/role) login
    triples and encodes the permitted set, alerting on logins that violate the learned structure (Siadati
    and Memon, Detecting Structurally Anomalous Logins). Build the model from Windows Event ID 4624 logon-type
    and account fields. Retain a deterministic floor for service accounts: alert on interactive or RDP
    logons by accounts designated non-interactive. A positive finding is a structurally novel login —
    an account reaching a server it never normally authenticates to, or a service account being used interactively
    — a hallmark of credential theft and lateral movement even when the network flow itself looks compliant.'
  answer_sources:
  - Windows Event ID 4624 (successful logon)
  - Windows Event ID 4625 (failed logon)
  - Zeek conn.log
  - Authentication / NetFlow logs
  - 'NAI: Domain Controllers, critical application/file/database servers, jump hosts, and authentication
    infrastructure across server and user VLANs'
  range: Last 90 days (mine permitted triples over baseline)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from logon (Windows EID 4624)

      | eval triple = (src_host, dest_host, account_or_role)

      | lookup permitted_login_triples on triple

      | eval svc_interactive = (account in non_interactive_service_accounts AND logon_type in (2,10))

      | where NOT matched_permitted_triples OR svc_interactive

      | table _time, src_host, dest_host, account, logon_type'
- question: Which accounts or hosts show failed-logon rates (Windows Event ID 4625) or success:failure
    ratios deviating beyond a tuned threshold (e.g., >3.5 modified z-score over a rolling window or >N
    failures/min), indicating credential probing?
  context: For the Isolate (D3-I) tactic, this statistical method baselines per-account and per-host Windows
    Event ID 4625 failed-logon rates and the success:failure ratio, alerting on deviations beyond a tuned
    threshold (>3.5 modified z-score over a rolling window, or >N failures/min) to capture credential
    probing as a distinct failure-mode signal (Jung et al.; Ghorbani et al.). Combine with rarity scoring
    of login structure (Siadati and Memon) so that failures against rarely-accessed targets weigh more
    heavily. A positive result is a burst or sustained elevation of failed logons — password spraying,
    brute force, or a broken/expired credential — that precedes or accompanies unauthorized access to
    network resources.
  answer_sources:
  - Windows Event ID 4624 (successful logon)
  - Windows Event ID 4625 (failed logon)
  - Zeek conn.log
  - Authentication / NetFlow logs
  - 'NAI: Domain Controllers, critical application/file/database servers, jump hosts, and authentication
    infrastructure across server and user VLANs'
  range: Last 90 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from failed_logon (Windows EID 4625)

      | stats count as fails by account, host, _window

      | join successes (EID 4624) | eval ratio = fails/(successes+1)

      | eventstats median(fails) as med, mad(fails) as mad by account, host

      | eval mod_z = 0.6745*(fails - med)/mad

      | where mod_z > 3.5 OR fails > N_per_min OR ratio_anomalous

      | sort mod_z desc'
- question: Which login/access paths switch credentials and reach servers an actor does not normally access,
    and does the path specificity score distinguish genuine lateral movement from benign administrative
    activity?
  context: Supporting the Isolate (D3-I) tactic, this ML method builds a login/access graph and flags
    paths that switch credentials and reach servers an actor does not normally access, scoring path specificity
    to suppress benign admin activity (Hopper, Ho et al.). For corroboration it uses an unsupervised multi-detector
    ensemble (PCA/k-means/MAD over Host Communication Graphs) per Bohara et al. Surface the contributing
    path edges and the atypical destination in the alert. A positive result is a chained movement where
    an actor pivots through hosts and changes credentials to reach an unusual, sensitive server — the
    signature of hands-on-keyboard lateral movement — while the specificity scoring keeps routine, broad
    admin activity from drowning the analyst in false positives.
  answer_sources:
  - Windows Event ID 4624 (successful logon)
  - Windows Event ID 4625 (failed logon)
  - Zeek conn.log
  - Authentication / NetFlow logs
  - 'NAI: Domain Controllers, critical application/file/database servers, jump hosts, and authentication
    infrastructure across server and user VLANs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_login_access_graph(EID_4624, conn_log)\npaths = enumerate_paths(G, max_hops=k)\n\
      for p in paths:\n    if credential_switch(p) AND reaches_atypical_server(p.actor, p.dest):\n   \
      \     spec = path_specificity(p)   # downweight common admin paths\n        if spec > threshold:\n\
      \            emit_alert(p.edges, atypical_dest=p.dest)"
- question: When temporal link prediction (GNN + recurrent sequence model) is applied to the authentication/communication
    graph, which host-to-host edges are improbable given temporal history and therefore candidate unauthorized
    access?
  context: Under the Isolate (D3-I) tactic, this ML method applies temporal link prediction (a graph neural
    network plus a recurrent sequence model) to the authentication/communication graph and flags improbable
    host-to-host edges given temporal history as candidate unauthorized access (Euler, King and Huang).
    Train and validate on the LANL Unified Host and Network Data Set, and report the predicted-improbable
    edge and its score for triage. A positive result is an authentication or communication edge the model
    considers unlikely at this point in time given each node's historical behavior — capturing temporally-novel
    access that static allow-lists and rarity counts miss, such as a host suddenly authenticating to infrastructure
    it has never touched in the learned time pattern.
  answer_sources:
  - Windows Event ID 4624 (successful logon)
  - Windows Event ID 4625 (failed logon)
  - Zeek conn.log
  - Authentication / NetFlow logs
  - 'NAI: Domain Controllers, critical application/file/database servers, jump hosts, and authentication
    infrastructure across server and user VLANs'
  range: Last 90 days (train on longer history, score recent edges)
  queries:
  - technology: SIEM/ML pseudocode
    query: "G_t = build_temporal_auth_graph(EID_4624, conn_log, authflows)\nmodel = train_temporal_link_predictor(G_t)\
      \   # GNN + RNN (Euler)\nfor edge in recent_edges(G_t):\n    prob = model.predict_link(edge.src,\
      \ edge.dst, t=edge.time)\n    if prob < improbable_threshold:\n        emit_alert(edge.src, edge.dst,\
      \ score=prob)"
