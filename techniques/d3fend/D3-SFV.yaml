name: 'D3-SFV: System Firmware Verification'
id: 44d3b9b1-97f9-4e40-8af2-e6768b9266a0
description: This playbook helps an analyst detect unauthorized firmware and boot-process modifications
  across the enterprise by cryptographically verifying installed system firmware integrity. It guides
  investigation of boot integrity measurements that deviate from a golden baseline or Secure Boot/measured-boot
  failures, anchoring trust in a hardware Root of Trust (TPM quotes, PCR values) and corroborating with
  out-of-band scans because a corrupted host cannot be trusted to report on itself. It covers comparing
  running and stored SPI flash / UEFI-BIOS images and option ROMs to authorized golden images, enforcing
  signed-update verification to catch unsigned or rolled-back firmware, and detecting low-level flash-access
  tooling and boot-config tampering. It adds fleet-wide statistical analysis to surface hosts whose firmware
  versions, boot measurements, or boot-failure rates diverge from the baseline (implants, downgrades,
  targeted tampering), and machine-learning models that flag anomalous boot-event sequences and boot-component
  measurement vectors with explainable, feature-level attribution. Use it to find UEFI bootkits, firmware
  implants, and rollback/downgrade attacks on endpoints, servers, Domain Controllers, and network devices.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any hosts logging Windows Kernel-Boot Event ID 34 (Secure Boot failure), and can those
    failures be correlated with Code Integrity signature/page-hash failures (Event IDs 3033/3001), EFI
    System Partition writes, or dbx-revoked/downgraded bootmgfw/bootmgr hashes that would indicate a UEFI
    bootkit?
  context: Supports the Detect mission by catching boot-chain components with an invalid or revoked signature
    at the moment Secure Boot rejects them. Windows Kernel-Boot Event ID 34 fires when a boot component
    fails Secure Boot verification; on its own this can be benign (e.g., dual-boot, driver issues), so
    corroborate it with Code Integrity events 3033/3001 (page-hash and signature failures), writes to
    the EFI System Partition, and downgraded or dbx-revoked bootmgr/bootmgfw hashes documented in [BlackLotus
    UEFI Bootkit](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/).
    A positive correlation - a Secure Boot failure alongside an unexpected bootloader hash and ESP write
    - strongly suggests an attacker is loading an unsigned or rolled-back boot component to persist below
    the OS. Generate a high-severity alert and pull the host for out-of-band firmware verification.
  answer_sources:
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - TPM PCR Measurement Logs
  - Zeek conn.log
  - 'NAI: UEFI/BIOS of endpoints and servers, Domain Controllers, and endpoints of high-value targets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert HIGH where\n  WinEvent.Channel == 'Microsoft-Windows-Kernel-Boot' AND WinEvent.EventID\
      \ == 34\ncorrelate within 24h on host with (\n  CodeIntegrity.EventID in (3033, 3001)  // page-hash\
      \ / signature failure\n  OR file_write on EFI_System_Partition (\\EFI\\Microsoft\\Boot\\bootmgfw.efi,\
      \ bootmgr)\n  OR bootloader_hash in dbx_revoked_or_downgraded_list  // BlackLotus IOCs\n)\n=> raise\
      \ 'Possible UEFI bootkit / Secure Boot bypass' ; queue host for out-of-band scan"
- question: For each device, does the TPM-extended measurement list match the per-model golden allowlist,
    and does every TPM quote correctly chain to the reported PCR aggregate - and where a host may be subverted,
    can the measurements be obtained out-of-band (TPM quote, BMC, or coprocessor)?
  context: Supports the Detect mission via the measure-extend-attest-compare model ([Sailer et al. IMA](https://www.usenix.org/legacy/event/sec04/tech/full_papers/sailer/sailer.pdf))
    and the Root of Trust for Detection in [Platform Firmware Resiliency Guidelines (NIST SP 800-193)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).
    For each device, enumerate the TPM measurement log and confirm every component measurement appears
    on the per-model golden allowlist, and that the signed TPM quote re-computes to the reported PCR aggregate
    (proving the log was not forged). Alert on any measurement not on the allowlist or any quote that
    fails to chain. Because a compromised host cannot be trusted to report honestly on itself, obtain
    the quote out-of-band - directly from the TPM, the BMC, or a coprocessor (as in the [Copilot out-of-band
    integrity monitor](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf))
    - rather than relying solely on the OS agent. A mismatch or broken chain indicates injected or tampered
    boot components.
  answer_sources:
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - TPM PCR Measurement Logs
  - Zeek conn.log
  - 'NAI: UEFI/BIOS of endpoints and servers, Domain Controllers, and endpoints of high-value targets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for host in fleet:\n  log = tpm_measurement_log(host)            # measure-extend list\n \
      \ quote = out_of_band_tpm_quote(host)        # via TPM/BMC/coprocessor, not OS agent\n  if recompute_pcr_aggregate(log)\
      \ != quote.pcr_aggregate:\n    alert HIGH 'TPM quote does not chain to measurement log' (host)\n\
      \  for m in log.component_measurements:\n    if m not in golden_allowlist[host.model]:\n      alert\
      \ HIGH 'Measurement not on golden allowlist' (host, m)"
- question: Do the current Platform Configuration Register values - specifically PCR 0, 2, and 4 - match
    the known-good baseline for the exact hardware and firmware version of each host, or has a mismatch
    appeared that points to modified BIOS code, option ROMs, or boot configuration?
  context: Supports the Detect mission by directly comparing PCR values against a per-model, per-firmware
    golden baseline. PCR 0 covers core firmware/BIOS code, PCR 2 covers option ROM (extension) code, and
    PCR 4 covers the boot loader / boot configuration; a change to any of these registers means the corresponding
    measured component changed. Pin the baseline to the EXACT hardware model and firmware version (legitimate
    firmware updates change PCRs, so version must be accounted for). Any mismatch that is not explained
    by an authorized firmware update is a strong indicator of BIOS implantation, a malicious option ROM,
    or boot-config tampering. PCR semantics and golden-value comparison follow [Sailer et al. IMA](https://www.usenix.org/legacy/event/sec04/tech/full_papers/sailer/sailer.pdf)
    and [Platform Firmware Resiliency Guidelines (NIST SP 800-193)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).
    Alert and escalate to out-of-band firmware capture.
  answer_sources:
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - TPM PCR Measurement Logs
  - Zeek conn.log
  - 'NAI: UEFI/BIOS of endpoints and servers, Domain Controllers, and endpoints of high-value targets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for host in fleet:\n  baseline = golden_pcr[host.model][host.firmware_version]\n  for pcr\
      \ in (0, 2, 4):                       # firmware, option ROM, boot config\n    if host.pcr[pcr]\
      \ != baseline[pcr]:\n      alert HIGH 'PCR%d mismatch vs golden baseline' % pcr (host, host.pcr[pcr],\
      \ baseline[pcr])"
- question: On a per-host and per-model basis, is the daily count of Secure Boot failures (Event ID 34),
    Code Integrity failures (3033/3001), and unexpected reboots (Event IDs 41/6008) within historical
    norms, or has a host exceeded mean+3 sigma or shown a sudden cluster of boot failures?
  context: Supports the Detect mission by treating boot-integrity failure events as a distinct statistical
    signal rather than waiting for a single deterministic hit. Baseline per-host and per-model daily counts
    of Secure Boot failures (EID 34), Code Integrity failures (3033/3001), and unexpected/dirty reboots
    (EID 41 and 6008), then alert when a host exceeds its mean+3 standard deviations or shows an abrupt
    cluster, using the standard-deviation method of [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    A spike or cluster of boot failures and unexpected reboots can indicate an attacker repeatedly attempting
    to load an unsigned component, a failing/bricked implant, or rollback attempts. Investigate flagged
    hosts against the deterministic Secure Boot and golden-measurement checks.
  answer_sources:
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - TPM PCR Measurement Logs
  - Zeek conn.log
  - 'NAI: UEFI/BIOS of endpoints and servers, Domain Controllers, and endpoints of high-value targets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = filter(WinEvent.EventID in (34, 3033, 3001, 41, 6008))\ndaily = count(events) by\
      \ host, model, day\nfor host in hosts:\n  mu, sigma = mean_std(daily[host][baseline_window])\n \
      \ if daily[host][today] > mu + 3*sigma or burst_cluster(daily[host]):\n    alert 'Boot-failure rate\
      \ anomaly' (host, daily[host][today], mu, sigma)"
- question: When boot-component measurement feature vectors (PCR set, component order, firmware version,
    vendor, reboot delta) are scored by a One-Class SVM / Isolation Forest trained on known-good devices,
    which devices are flagged as outliers, and do their post-reboot Zeek conn.log connections show suspicious
    immediate outbound traffic?
  context: 'Supports the Detect mission by adding ML coverage for boot anomalies that no single rule anticipates.
    Train a One-Class SVM or Isolation Forest on feature vectors built from known-good devices - the PCR
    set, component ordering, firmware version, vendor, and reboot delta - and flag outliers, per [Isolation
    Forest / One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4). Correlate each flagged
    reboot with Zeek conn.log to spot suspicious immediate outbound connections (Volume: bytes out; Frequency:
    count of new destinations), which would indicate an implant phoning home right after boot. Surface
    the top-3 contributing features (e.g., changed PCR index, version delta, post-reboot egress bytes)
    in the alert text using SHAP attribution ([Hwang et al. LSTM-autoencoder + SHAP](https://arxiv.org/abs/2205.01930))
    so the analyst gets an explainable lead rather than an opaque score. Keep deterministic golden/Secure
    Boot rules as the floor; ML adds parallel coverage.'
  answer_sources:
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - TPM PCR Measurement Logs
  - Zeek conn.log
  - 'NAI: UEFI/BIOS of endpoints and servers, Domain Controllers, and endpoints of high-value targets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X_train = boot_feature_vectors(known_good_devices)  # [PCR_set, component_order, fw_version,\
      \ vendor, reboot_delta]\nmodel = IsolationForest().fit(X_train)   # or OneClassSVM\nfor host in\
      \ fleet:\n  x = boot_feature_vector(host)\n  if model.predict(x) == OUTLIER:\n    egress = zeek_conn_log.post_reboot(host)\
      \   # bytes_out, new_destination_count\n    top3 = shap_top_features(model, x, k=3)\n    alert 'Boot-integrity\
      \ anomaly' (host, top3, egress.bytes_out, egress.new_dests)"
- question: When SPI flash regions are periodically dumped and hashed, does the running firmware image
    match the per-model known-good golden image, and are SPI write protections (BC/BLE/SMM_BWP) and Secure
    Boot variables (db/dbx/PK/KEK) in their expected state - or is there a region mismatch, disabled write
    protection, or an unexpected dbx change?
  context: 'Supports the Detect mission by implementing the Root of Trust for Detection from [Platform
    Firmware Resiliency Guidelines (NIST SP 800-193)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf):
    periodically dump and hash SPI flash regions with [CHIPSEC](https://github.com/chipsec/chipsec) and
    compare the running firmware to the per-model golden image, while asserting that SPI write protection
    (BIOS_CNTL BC/BLE, SMM_BWP) is enabled and that Secure Boot variables (db/dbx/PK/KEK) hold their expected
    values. Alert on any region mismatch (implanted firmware), disabled write protection (the door an
    attacker opens before flashing), or unexpected dbx changes (revocation tampering used to allow rolled-back
    bootloaders). A clean compare and locked-down protections indicate integrity; any deviation warrants
    firmware capture and forensic comparison against the OEM image.'
  answer_sources:
  - CHIPSEC SPI Flash Dumps
  - Firmware/BIOS Update Logs
  - Sysmon Process Creation (EID 1)
  - Sysmon Driver Load (EID 6)
  - Windows Code Integrity Event Logs
  - 'NAI: SPI flash / UEFI-BIOS images of endpoints, servers, Domain Controllers, and network devices.'
  range: Last 90 days
  queries:
  - technology: CHIPSEC/pseudocode
    query: "dump = chipsec.spi.read_all_regions(host)\nif sha256(dump) != golden_image[host.model].hash:\n\
      \  alert HIGH 'SPI flash differs from golden image' (host, diff_regions(dump, golden))\nif not chipsec.bios_wp_enabled(host):\
      \       # BC/BLE/SMM_BWP\n  alert HIGH 'SPI write protection disabled' (host)\nif secure_boot_vars(host).dbx\
      \ != expected_dbx:\n  alert HIGH 'Unexpected dbx change' (host)"
- question: Is every firmware/BIOS update image digitally signed and validated by the Root of Trust for
    Update before flashing, and are there any unsigned images, signature-verification failures, or version
    rollbacks (downgrades) being applied?
  context: Supports the Detect mission per [BIOS Protection Guidelines (NIST SP 800-147)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf)
    and [Platform Firmware Resiliency Guidelines (NIST SP 800-193)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf)
    by ensuring no firmware reaches the flash without passing signature verification by the Root of Trust
    for Update. Inspect firmware/BIOS update logs for each flash event and confirm the image was digitally
    signed and validated; alert on any unsigned image, any signature-verification failure, or any version
    rollback (the new version is older than the currently deployed version). Downgrade attacks are a favored
    technique to reintroduce a vulnerable or implant-friendly firmware while appearing as a normal update,
    so rollback detection is as important as signature checks. A failure here means a potentially malicious
    or vulnerable firmware was or nearly was installed - escalate immediately.
  answer_sources:
  - CHIPSEC SPI Flash Dumps
  - Firmware/BIOS Update Logs
  - Sysmon Process Creation (EID 1)
  - Sysmon Driver Load (EID 6)
  - Windows Code Integrity Event Logs
  - 'NAI: SPI flash / UEFI-BIOS images of endpoints, servers, Domain Controllers, and network devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for upd in firmware_update_logs:\n  if not upd.signed or upd.signature_valid == False:\n \
      \   alert HIGH 'Unsigned or invalid firmware update' (upd.host, upd.image)\n  if version_lt(upd.new_version,\
      \ deployed_version[upd.host]):\n    alert HIGH 'Firmware rollback / downgrade' (upd.host, upd.new_version,\
      \ deployed_version[upd.host])"
- question: Are there loads of known raw-memory/SPI-access drivers (e.g., RwDrv.sys), execution of firmware-flashing
    utilities, or bcdedit boot-configuration tampering (testsigning on, nointegritychecks, bootstatuspolicy
    ignoreallfailures, recoveryenabled no) on any host?
  context: Supports the Detect mission by catching the host-side tooling an attacker needs to read or
    write firmware. Alert on loads of known raw-memory/SPI-access drivers such as RwDrv.sys (used by [LoJax](https://www.welivesecurity.com/2018/09/27/lojax-first-uefi-rootkit-found-wild-courtesy-sednit-group/))
    via Sysmon Driver Load EID 6, on execution of firmware-flashing utilities via Sysmon Process Creation
    EID 1 / Security 4688, and on bcdedit boot-config tampering (per the [SigmaHQ bcdedit boot-config-tamper
    rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml))
    that weakens code-integrity enforcement - testsigning on, nointegritychecks, bootstatuspolicy ignoreallfailures,
    recoveryenabled no. These actions precede or accompany firmware implantation and boot-chain subversion;
    legitimate use is rare on production endpoints, so a hit is a strong lead. Pivot to the parent process,
    signer, and subsequent firmware/SPI activity.
  answer_sources:
  - CHIPSEC SPI Flash Dumps
  - Firmware/BIOS Update Logs
  - Sysmon Process Creation (EID 1)
  - Sysmon Driver Load (EID 6)
  - Windows Code Integrity Event Logs
  - 'NAI: SPI flash / UEFI-BIOS images of endpoints, servers, Domain Controllers, and network devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert where Sysmon.EventID == 6 AND driver in known_raw_spi_drivers (RwDrv.sys, ...)\nalert\
      \ where (Sysmon.EventID == 1 OR Security.EventID == 4688)\n  AND image in firmware_flash_utilities\
      \ (afuwin, fpt, flashrom, ...)\nalert where process == 'bcdedit.exe' AND cmdline matches\n  (testsigning\
      \ on | nointegritychecks | bootstatuspolicy ignoreallfailures | recoveryenabled no)\n=> enrich with\
      \ parent_process, signer ; pivot to firmware/SPI activity on host"
- question: For any new or unknown firmware image, what is the per-region Shannon entropy (code ~5.0-6.5
    vs compressed/encrypted >7.2), and does its exact (SHA256) and fuzzy (ssdeep) similarity match a known-good
    model image or resemble a known-bad sample?
  context: Supports the Detect mission by triaging firmware images that do not match a golden hash. Compute
    Shannon entropy per region - normal code sits around 5.0-6.5 while compressed or encrypted/packed
    regions exceed 7.2, which can signal hidden or obfuscated payloads in an unexpected region. Compute
    exact SHA256 and fuzzy ssdeep similarity against both a known-good model corpus and a known-bad corpus.
    Flag any image that fails to match a known-good model image or that resembles a known-bad sample ([Costin
    et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf)).
    High entropy in a region that should be plain code, or fuzzy similarity to a known implant, is a strong
    lead for deeper firmware reverse engineering. A clean exact match to the model golden image clears
    the image.
  answer_sources:
  - CHIPSEC SPI Flash Dumps
  - Firmware/BIOS Update Logs
  - Sysmon Process Creation (EID 1)
  - Sysmon Driver Load (EID 6)
  - Windows Code Integrity Event Logs
  - 'NAI: SPI flash / UEFI-BIOS images of endpoints, servers, Domain Controllers, and network devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for img in unknown_firmware_images:\n  for region in img.regions:\n    H = shannon_entropy(region)\n\
      \    if H > 7.2 and region.expected_type == 'code':\n      flag 'High-entropy code region (possible\
      \ packed/encrypted payload)' (img, region, H)\n  if sha256(img) not in known_good[img.model]:\n\
      \    sim_bad = max(ssdeep_compare(img, b) for b in known_bad_corpus)\n    if sim_bad > THRESHOLD:\
      \ flag 'Resembles known-bad firmware' (img, sim_bad)\n    else: flag 'Unknown firmware - no known-good\
      \ match' (img)"
- question: When a system-provenance graph is built and scored with node-level GNN anomaly detection,
    which driver-load/process nodes around boot are flagged as anomalous (e.g., raw-SPI-access driver
    loads, firmware-flashing utilities), and what is the offending node's parent-process lineage?
  context: Supports the Detect mission with label-free localization of boot-time malice. Build a system-provenance
    graph from process creation (Sysmon EID 1) and driver load (Sysmon EID 6) events around boot, then
    apply node-level GNN anomaly detection ([ThreaTrace](https://arxiv.org/pdf/2111.04333), [code](https://github.com/threaTrace-detector/threaTrace))
    to localize anomalous nodes without needing attack labels. The model flags nodes that deviate from
    learned normal provenance - for instance a raw-SPI-access driver load or a firmware-flashing utility
    appearing in an unusual lineage. Report the offending node and its full parent-process lineage in
    the alert so the analyst can see how the suspicious driver/utility was introduced (e.g., spawned by
    an unexpected parent). This complements the deterministic flash-access tooling rule by surfacing novel
    or renamed tooling.
  answer_sources:
  - CHIPSEC SPI Flash Dumps
  - Firmware/BIOS Update Logs
  - Sysmon Process Creation (EID 1)
  - Sysmon Driver Load (EID 6)
  - Windows Code Integrity Event Logs
  - 'NAI: SPI flash / UEFI-BIOS images of endpoints, servers, Domain Controllers, and network devices.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_provenance_graph(sysmon_eid1_process, sysmon_eid6_driver, window=boot_pm15min)\n\
      model = GNN_node_anomaly_detector()        # ThreaTrace, trained on benign provenance\nfor node\
      \ in G.nodes:\n  if model.score(node) > THRESHOLD:\n    lineage = parent_process_chain(node)\n \
      \   alert 'Anomalous boot-time node' (node.image_or_driver, lineage)"
- question: Across the fleet, what is the distribution of firmware versions per hardware model, and are
    there hosts running unique/outlier firmware versions or versions older than the deployed standard
    (downgrade)?
  context: Supports the Detect mission by monitoring fleet-wide firmware-version distribution per hardware
    model. Most like-model hosts should converge on one or a few sanctioned versions; a host running a
    unique or outlier version - or a version older than the deployed standard - is suspicious, indicating
    a targeted implant or a downgrade attack on that specific machine. Cross-reference asset/firmware
    inventory and corroborate any unknown image with the entropy/fuzzy-hash triage from [Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).
    A lone outlier version on a high-value host (e.g., a Domain Controller) is a priority lead; a uniform
    distribution provides assurance. This is cheap to run continuously and narrows where to apply the
    more expensive image-level checks.
  answer_sources:
  - TPM PCR Measurement Logs
  - Asset/Firmware Inventory
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - 'NAI: Fleet-wide UEFI/BIOS and TPM measurement state across like-model endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "dist = count(host) by model, firmware_version\nfor model in models:\n  standard = mode(firmware_version\
      \ where model)\n  for host in hosts[model]:\n    if host.firmware_version is rare(dist[model]) or\
      \ version_lt(host.firmware_version, standard):\n      alert 'Outlier/downgraded firmware version'\
      \ (host, host.firmware_version, standard)\n      enrich with entropy_fuzzy_triage(host.firmware_image)"
- question: Applying change-point detection (CUSUM / Bayesian) to time series of fleet firmware-version
    diversity, boot-measurement diversity, and reboot cadence per model, are there abrupt shifts that
    signal a tampering or downgrade campaign?
  context: Supports the Detect mission by watching fleet-level baselines for sudden structural change.
    Build per-model time series of firmware-version diversity, boot-measurement (PCR) diversity, and reboot
    cadence, then apply CUSUM or Bayesian change-point detection ([Aminikhanghahi & Cook change-point
    survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)) to flag abrupt shifts. A coordinated tampering
    or downgrade campaign manifests as a step change - e.g., a sudden rise in version diversity or reboot
    cadence across many like-model hosts - that per-host thresholds might miss. A detected change point
    tells the analyst when the shift began, so they can scope which hosts changed and correlate with update
    windows; an expected change point aligning with a sanctioned rollout is benign, an unexplained one
    is a campaign indicator.
  answer_sources:
  - TPM PCR Measurement Logs
  - Asset/Firmware Inventory
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - 'NAI: Fleet-wide UEFI/BIOS and TPM measurement state across like-model endpoints and servers.'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for model in models:\n  ts_div = timeseries(firmware_version_diversity[model], boot_measurement_diversity[model],\
      \ reboot_cadence[model])\n  cps = cusum_or_bayesian_changepoint(ts_div)\n  for cp in cps:\n    if\
      \ cp not in sanctioned_rollout_windows:\n      alert 'Unexplained change point in fleet boot baseline'\
      \ (model, cp.time, affected_hosts(cp))"
- question: Within pools of identical hardware/firmware, do the PCR/measurement sets agree across peers,
    and is there a divergent (minority) unit whose attested state differs from the rest?
  context: 'Supports the Detect mission with training-less, swarm/collective attestation. For pools of
    identical hardware and firmware, compare PCR and measurement sets across peers and flag the divergent
    unit - no model training is required because the peers themselves form the reference ([ReplicaWatcher](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf)).
    This realizes collective attestation where the verifier flags the minority of provers whose attested
    state diverges ([Remote Attestation: A Literature Review (Banks et al.)](https://arxiv.org/abs/2105.02466)).
    It is robust where no golden baseline exists yet: if 49 of 50 identical servers agree and one differs,
    that one is the lead. A perfectly agreeing pool gives assurance; the divergent unit warrants golden/out-of-band
    verification. This is especially powerful for homogeneous fleets like DC pools or VDI hosts.'
  answer_sources:
  - TPM PCR Measurement Logs
  - Asset/Firmware Inventory
  - Windows Kernel-Boot Event Logs
  - Windows Code Integrity Event Logs
  - 'NAI: Fleet-wide UEFI/BIOS and TPM measurement state across like-model endpoints and servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for pool in identical_hw_fw_pools:\n  consensus = majority_measurement_set(pool)   # training-less\
      \ peer reference\n  for host in pool:\n    if host.measurement_set != consensus:\n      alert 'Divergent\
      \ unit in identical-hardware pool' (host, diff(host.measurement_set, consensus))"
- question: After baselining cryptographic measurements of boot components per hardware model, do any
    devices report a measurement sequence whose rarity score exceeds the 99th percentile (rare ordering
    plus failure flags)?
  context: 'Supports the Detect mission by scoring the rarity of boot-component measurement sequences
    per hardware model. Collect and baseline the cryptographic measurements (and their ordering) of boot
    components across like-model devices, then compute how rare each device''s observed measurement sequence
    is. Alert when a device''s sequence exceeds the 99th-percentile rarity, considering both unusual ordering
    (Frequency/State: rare ordering) and accompanying failure flags. A rare sequence can indicate an injected,
