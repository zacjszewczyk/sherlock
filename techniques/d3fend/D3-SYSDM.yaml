name: 'D3-SYSDM: System Dependency Mapping'
id: 4172b156-9f44-48ac-9226-f96ff8858e71
description: Investigate and validate the critical system-to-system communication dependencies within
  the production environment to build a defensible model of how systems rely on one another. This playbook
  helps an analyst inventory mapped communication pairs (with byte volume, connection frequency, and success/failure
  state), establish statistical baselines of connection persistence and periodicity, profile failure rates
  (rejected/blocked connections and failed logons), and discover graph-based clusters of functional application
  ecosystems with explainable anomalous-edge scoring. By comparing observed dependencies against an N-tier
  architectural policy and learned/baselined structure, the analyst can surface tier-bypassing connections,
  first-time adjacencies, beaconing edges, decommissioned-but-still-referenced dependencies, credential
  probing, and lateral movement, as well as anomalous host-internal process/file/socket dependencies derived
  from provenance data.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
