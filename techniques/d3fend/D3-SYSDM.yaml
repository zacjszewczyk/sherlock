questions:
- question: What are the actual system-to-system communication pathways in the environment, and what is
    each pathway's daily connection frequency, byte volume, and success-versus-failure state when grouped
    by source IP, destination IP, destination port, and connection state?
  context: 'This question builds the foundational inventory of communication pathways. Query Zeek conn.log
    for TCP connections and Windows Event ID 5156 (allowed connections), and parse Windows logon events
    (4624) to add authentication-derived edges. Group by source IP, destination IP, destination port,
    and conn_state to produce an inventory annotated with daily connection count (Frequency), summed orig+resp
    bytes (Volume), and success vs. failed/rejected state. Build the account/host logon graph the way
    [LogonTracer](https://github.com/JPCERTCC/LogonTracer) does, and attach login causality so paths can
    be reasoned over as in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf). A complete,
    accurate inventory is the prerequisite for every downstream dependency check; gaps here mean blind
    spots in the dependency model. These questions tie to the Model tactic: building and validating an
    accurate model of system dependencies so that deviations from the intended/observed architecture become
    detectable and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      read conn.log where proto==tcp
        | group by id.orig_h, id.resp_h, id.resp_p, conn_state
        | summarize Frequency=count()/days, Volume=sum(orig_bytes+resp_bytes), state=conn_state
  - technology: SIEM/Rule pseudocode
    query: |-
      source=WinEventLog EventID IN (5156,4624)
        | normalize to edge(src_ip, dst_ip, dst_port, status)
        | join auth(4624) on host/account to add login-causality edges
        | stats count AS Frequency, sum(bytes) AS Volume by src_ip,dst_ip,dst_port,status
- question: Are there connections that violate the intended N-tier architecture (for example a Web host
    talking directly to a Database host, bypassing the Application tier) or first-time accesses to a system
    the source host or account has never legitimately reached before?
  context: 'Define an N-tier policy (e.g., Web -> App, App -> DB) and alert on tier-bypassing connections
    (e.g., Web -> DB directly) or first-time access to a system the source host/account has never legitimately
    reached. Combine the deterministic ''first-time access + credential switch'' rule with a rarity score
    as specified in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf) to flag architectural
    violations and lateral movement while keeping alert volume
    low. A positive result indicates either an undocumented-but-legitimate dependency to add to the model,
    a misconfiguration, or active lateral movement; a negative result strengthens confidence the architecture
    is being honored. These questions tie to the Model tactic: building and validating an accurate model
    of system dependencies so that deviations from the intended/observed architecture become detectable
    and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      define tier_policy = {Web->App, App->DB}
        | for each edge(src_tier,dst_tier): if (src_tier,dst_tier) NOT IN tier_policy -> alert 'tier-bypass'
        | if edge(src,dst) NOT IN historical_edges AND credential_switch -> alert 'first-time access'
        | score rarity; suppress if rarity low and policy-allowed
- question: Which stable production dependency edges are showing abnormally high rates of failed, rejected,
    or blocked connections or failed logons, indicating misconfiguration, decommissioned-but-still-referenced
    dependencies, or credential probing?
  context: 'Treat failure rates as a distinct dependency signal. Per src/dst/port edge, compute the ratio
    of failed states (Zeek conn_state S0/REJ/RSTO, Windows Event 5157 blocked connections, failed logon
    4625) to total attempts over a rolling window. Alert when a stable production edge''s failure ratio
    crosses a deterministic threshold (e.g., >20% rejected, or any 4625 burst >5/min between server tiers),
    which can indicate misconfiguration, decommissioned-but-still-referenced dependencies, or credential
    probing. Persistent low-volume failed beacons are scored alongside successful ones in [RITA](https://github.com/activecm/rita).
    A spike
    in failures on a previously healthy edge is a strong signal of either operational drift or adversary
    reconnaissance/brute-force. These questions tie to the Model tactic: building and validating an accurate
    model of system dependencies so that deviations from the intended/observed architecture become detectable
    and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per edge(src,dst,port): fail = count(conn_state IN [S0,REJ,RSTO] OR EventID==5157 OR EventID==4625)
        | ratio = fail / total over rolling 1h window
        | alert if ratio > 0.20 OR count(4625) > 5 per min between server tiers
- question: For each unique communication pathway, what is the normal daily connection frequency, total
    and per-connection byte volume, and connection duration over a 30+ day window, and which edges deviate
    by 3-sigma or more from that baseline?
  context: 'For each unique pathway, compute daily connection frequency (count/min during business hours),
    total and per-connection bytes transferred, and connection duration over a >=30-day window. Mark stable
    dependencies as those above the 90th percentile for frequency with low coefficient of variation, and
    flag deviations (>=3 sigma change in volume or frequency). Derive per-environment thresholds from
    your own baseline rather than fixed constants. This per-edge feature distribution mirrors the host-communication
    graph features used by [Bohara et al.](https://www.perform.illinois.edu/Papers/USAN_papers/17BOH01.pdf).
    Deviations highlight either capacity/operational changes or exfiltration
    and beaconing that warrant investigation. These questions tie to the Model tactic: building and validating
    an accurate model of system dependencies so that deviations from the intended/observed architecture
    become detectable and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days (baseline window >=30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per edge: baseline = stats mean,stddev,p90,cv of {freq_per_min, bytes, duration} over >=30d
        | stable = freq > p90 AND cv low
        | alert if abs(value-mean) >= 3*stddev for volume OR frequency
- question: Has a low-probability new or abnormally bursty system-to-system edge appeared between historically
    stable production systems, especially involving critical databases or domain controllers?
  context: 'Maintain a registry of historically observed system-to-system edges. Model each edge''s count
    process with a conjugate Bayesian model and compute a predictive p-value for newly appearing or abnormally
    bursty edges, using the cheap-screen-then-confirm two-stage approach of [Heard et al.](https://arxiv.org/pdf/1011.1788).
    Alert when a
    low-probability new edge appears between stable production systems, especially those involving critical
    databases or domain controllers. New adjacencies to crown-jewel systems are a hallmark of lateral
    movement and staging; a low predictive p-value indicates the edge is statistically surprising given
    history. These questions tie to the Model tactic: building and validating an accurate model of system
    dependencies so that deviations from the intended/observed architecture become detectable and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      maintain edge_registry with conjugate(Beta/Gamma) prior per edge
        | for each observed edge: p_value = predictive_prob(count | prior)
        | stage1 cheap screen -> stage2 confirm
        | alert if p_value < threshold AND (dst in critical_db OR domain_controller)
- question: Which dependency edges exhibit strong periodicity and low jitter in their connection inter-arrival
    times, distinguishing automated machine-to-machine beacons (potential C2) from legitimate stable business-hours
    dependencies?
  context: 'Distinguish legitimate stable dependencies (consistent, business-hours, high-volume) from
    automated machine-to-machine beacons by applying frequency-domain analysis (discrete FFT) to connection
    inter-arrival times plus inter-arrival and data-size dispersion scoring, as implemented in [RITA](https://github.com/activecm/rita).
    Flag
    edges with strong periodicity and low jitter, and report the period, total bytes, and connection count
    so analysts can confirm whether the edge is a sanctioned job. Many legitimate dependencies (backups,
    polling) are also periodic, so the analyst must triage by reviewing the period and destination to
    separate sanctioned automation from covert beaconing. These questions tie to the Model tactic: building
    and validating an accurate model of system dependencies so that deviations from the intended/observed
    architecture become detectable and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      per edge: ts_series = inter_arrival_times(conn.log)
        | apply discrete FFT -> dominant_freq, power
        | score = periodicity_strength * (1 - jitter) * size_consistency
        | alert if score high; report period, total_bytes, conn_count
- question: When multiple unsupervised anomaly detectors are run over per-edge features (connection count,
    byte volume, login frequency, failure ratio), which edges are flagged by two or more detectors in
    agreement?
  context: 'Ensemble multiple unsupervised detectors over per-edge features (connection count, byte volume,
    login frequency, failure ratio): PCA reconstruction error, k-means cluster distance, and Median Absolute
    Deviation, as in [Bohara et al.](https://www.perform.illinois.edu/Papers/USAN_papers/17BOH01.pdf).
    Combining weak detectors lowers false positives; alert when two or
    more detectors agree and include each detector''s contributing feature in the alert. Agreement across
    orthogonal detectors raises confidence that a flagged edge is a genuine dependency anomaly rather
    than detector-specific noise. These questions tie to the Model tactic: building and validating an
    accurate model of system dependencies so that deviations from the intended/observed architecture become
    detectable and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      features = [conn_count, byte_volume, login_freq, failure_ratio] per edge
        | d1 = PCA_reconstruction_error; d2 = kmeans_cluster_distance; d3 = MAD_score
        | votes = count(d1,d2,d3 above threshold)
        | alert if votes >= 2; include contributing feature per detector
- question: What functional application groups (server clusters) emerge from community-detection on the
    system communication graph, and which edges cross community boundaries as candidate anomalies?
  context: 'Run the [Louvain modularity](https://arxiv.org/pdf/0803.0476) community-detection algorithm
    on the system communication graph to cluster servers into functional groups, discovering undocumented
    application ecosystems in near-linear
    time. Surface edges that cross community boundaries as candidate anomalies and, in the alert, list
    the top-3 contributing attributes (e.g., crossing tier, rare port, low historical weight) rather than
    only a modularity score. Discovered communities document the real application ecosystems for the dependency
    model; cross-community edges may represent shared services, misconfigurations, or lateral movement.
    These questions tie to the Model tactic: building and validating an accurate model of system dependencies
    so that deviations from the intended/observed architecture become detectable and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: Graph/pseudocode
    query: |-
      G = build_graph(edges weighted by frequency/volume)
        | communities = louvain_modularity(G)
        | for edge where community(src) != community(dst): flag candidate anomaly
        | report top-3 attributes (cross-tier, rare-port, low historical weight)
- question: Given the expected dependency structure learned by a graph neural network, which observed
    edges have a low predicted likelihood and should be scored as anomalous adjacencies?
  context: 'Learn the expected dependency structure with a graph neural network and predict the likelihood
    of each edge; score observed low-probability edges as anomalous. Use the unsupervised graph-autoencoder/link-prediction
    approach of [CyberGraph](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf) for static
    structure and the temporal GNN-plus-recurrent design of [Euler](https://www2.seas.gwu.edu/~howie/publications/Euler-NDSS22.pdf)
    for evolving authentication graphs. Keep deterministic new-edge and tier rules running in parallel, and
    have the model surface its top-3 contributing features (e.g., source/destination node embeddings,
    edge recency, port) in the alert text. Low link-prediction probability indicates the model considers
    the adjacency inconsistent with learned structure, complementing the deterministic rules. These questions
    tie to the Model tactic: building and validating an accurate model of system dependencies so that
    deviations from the intended/observed architecture become detectable and defensible.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Windows Event ID 5156
  - Windows Event ID 5157 (blocked connections)
  - Windows Security 4624/4625 (logon success/failure)
  - Host audit/provenance (Linux auditd, Sysmon)
  - 'NAI: Network traffic flows and authentication between critical server VLANs (e.g., web, application,
    database tiers), including failed/blocked connection attempts and host-internal process/file/socket
    dependencies.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      train graph_autoencoder (CyberGraph) on static dependency graph
        | train temporal GNN+RNN (Euler) on evolving auth graph
        | for each observed edge: p = link_prediction_score
        | alert if p < threshold; surface top-3 features; run deterministic rules in parallel
- question: Within individual systems, do the host-internal process/file/socket provenance relationships
    deviate from the learned benign dependency structure, indicating anomalous component dependencies?
  context: 'For internal dependencies of individual systems, build whole-system provenance graphs (process/file/socket)
    from host audit logs and learn benign dependency structure to detect anomalous component relationships.
    Temporal graph prediction with explainable attack-subgraph reconstruction is demonstrated by [KAIROS](https://tfjmp.org/publications/2024-sp.pdf);
    concept-drift-resistant masked graph learning by [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf);
    and node-level, explainable detection by [ThreaTrace](https://arxiv.org/pdf/2111.04333).
    Emit the implicated node and its causal subgraph so analysts can validate the dependency. This captures
    intra-system dependencies that network-level mapping cannot see, exposing anomalous component relationships
    caused by malware or misconfiguration. These questions tie to the Model tactic: building and validating
    an accurate model of system dependencies so that deviations from the intended/observed architecture
    become detectable and defensible.'
