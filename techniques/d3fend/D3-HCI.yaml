name: 'D3-HCI: Hardware Component Inventory'
id: 70d07753-42a8-4781-b001-6248d31cf0d7
description: Investigate and validate the completeness and accuracy of the organization's hardware component
  inventory under the Asset Inventory tactic. This playbook helps an analyst confirm that every hardware
  item actually present on the network — peripherals, NICs, processors, memory, firewalls, VPN gateways,
  load balancers, and edge devices — is recorded against an authoritative approved baseline, and that
  any device observed but not inventoried (potential rogue, shadow, or misclassified hardware) or inventoried
  but not observed (decommissioning or coverage gaps) is surfaced for review. It correlates the eMASS
  hardware baseline, ACAS discovery scans, external attack-surface-management exports, Zeek network observations
  (conn.log, dhcp.log), and Windows logon records (Event ID 4624) to build and continuously reconcile
  MAC-IP-hostname inventory tuples. The strongest signals are observed-but-unlisted assets, first-seen
  MAC addresses requesting DHCP leases, internet-facing hardware with unresolved ownership, and anomalous
  tuple relationships. Use deterministic symbolic-logic reconciliation as the floor, statistical volume/frequency/state
  trending to detect drift and coverage loss, and machine-learning models to cluster discrepancies and
  rank likely rogue or orphaned hardware for prioritized follow-up. Special care is taken for fragile
  OT/ICS zones where active scanning can cause side effects, favoring passive fingerprinting.
type: technique
related:
- tactic_id: D3-AI
  tactic_name: Asset Inventory
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does the authoritative hardware baseline exported from the relevant eMASS system authorization
    package fully account for every asset that ACAS discovery and Zeek passively observe on the network,
    and conversely, are all eMASS-listed assets actually present?
  context: 'Under the Asset Inventory tactic, the eMASS hardware inventory in a system''s security authorization
    package is the authoritative approved baseline per NIST SP 800-128. Periodically export it and reconcile
    it against hardware identified by ACAS discovery and Zeek-observed assets. Any observed-but-unlisted
    asset is a reportable deviation and a potential rogue, shadow, or unapproved component — especially
    dangerous in OT/ICS zones per NIST SP 800-82r3 where unmanaged hardware can disrupt operations. Any
    listed-but-unobserved asset is a decommissioning or coverage gap. A clean reconciliation (every observed
    asset listed, every listed asset observed) confirms inventory integrity; any mismatch is a lead requiring
    investigation. References: [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf),
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - eMASS hardware inventory reports
  - 'NAI: Specific system authorization packages within eMASS.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'baseline = export(eMASS hardware inventory for system package)

      observed = union(ACAS_discovered_assets, zeek_observed_assets)

      | set_diff observed - baseline as observed_unlisted  // reportable deviation / rogue

      | set_diff baseline - observed as listed_unobserved  // decommission / coverage gap

      | tag zone (flag OT/ICS) | alert on any nonempty diff'
- question: What are the current baseline-to-observation mismatch rates by network zone and asset class,
    and is any zone exceeding its site-derived threshold for unlisted-observed assets?
  context: 'Following the baseline-deviation discipline of NIST SP 800-128, quantify inventory drift rather
    than just listing it. Calculate (Volume) the count and proportion of eMASS-listed assets not observed
    and observed assets not listed, segmented by network zone and asset class; track (Frequency) the per-week
    rate of new mismatches and (State) the proportion of reconciliations that fail to resolve. Alert when
    the mismatch proportion exceeds a site-derived threshold (e.g., >5% unlisted-observed assets in any
    zone, tuned from 90 days of history). A rising mismatch rate or a zone breaching threshold indicates
    either systemic onboarding/offboarding failures or an influx of unauthorized hardware that warrants
    escalation. References: [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf).'
  answer_sources:
  - eMASS hardware inventory reports
  - 'NAI: Specific system authorization packages within eMASS.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '| stats count(observed_unlisted), count(listed_unobserved), total by zone, asset_class

      | eval unlisted_pct = observed_unlisted/total

      | eval new_mismatch_rate = mismatches per week

      | where unlisted_pct > site_threshold (e.g., 0.05) OR new_mismatch_rate > baseline

      | alert'
- question: When inventory discrepancies are clustered by asset attributes, which clusters represent systematic
    onboarding errors versus likely rogue or misclassified hardware, and what features drive each cluster?
  context: 'To triage large volumes of mismatches under the Asset Inventory tactic, train an unsupervised
    clustering/anomaly model (e.g., Isolation Forest with LIME per-alert attribution) on asset attributes
    such as vendor/OUI, IP range, hostname pattern, and discovery source to group mismatch cases. Surface
    the top-3 contributing features for each flagged cluster in the alert text. A tight cluster sharing
    an onboarding-tool signature usually indicates a benign systematic process error; an isolated, high-anomaly
    point with an unusual OUI or unexpected IP range is a stronger candidate for genuine rogue or misclassified
    hardware and should be investigated first. References: [Robust IoT security using isolation forest
    and one class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - eMASS hardware inventory reports
  - 'NAI: Specific system authorization packages within eMASS.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [vendor_OUI, ip_range, hostname_pattern, discovery_source]

      model = IsolationForest.fit(mismatch_cases)

      | cluster + anomaly_score each case | explain via LIME

      | emit top_3_contributing_features per cluster

      | rank isolated high-anomaly clusters as likely rogue/misclassified'
- question: Have authenticated ACAS discovery scans been run across all defined network segments, and
    does the IP/MAC/NetBIOS/OS data they return — corroborated by stack fingerprinting — populate the
    master inventory and reconcile against the approved baseline?
  context: 'ACAS discovery is a primary source for building the hardware inventory under the Asset Inventory
    tactic. Schedule authenticated ACAS discovery scans across all defined segments and parse IP, MAC,
    NetBIOS name, and detected OS to populate the master inventory. Corroborate the scan-derived OS/device
    classification with deterministic active TCP/IP-stack fingerprinting (Nmap remote OS detection) and
    reconcile against the approved baseline per NIST SP 800-128. Critically, for fragile OT segments prefer
    passive fingerprinting (p0f v3) to avoid scan-induced side effects that could disrupt operational
    technology. Devices that ACAS classifies inconsistently with fingerprinting, or that have no baseline
    match, are leads for investigation. References: [Nmap Remote OS Detection](https://nmap.org/book/osdetect.html),
    [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf), [p0f
    v3](https://lcamtuf.coredump.cx/p0f3/).'
  answer_sources:
  - ACAS scan results
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'schedule authenticated ACAS discovery across all segments

      | parse IP, MAC, NetBIOS, detected_OS -> master_inventory

      | corroborate OS via nmap_osdetect (active) OR p0f (passive, OT segments)

      | reconcile against approved_baseline (NIST 800-128)

      | flag classification_conflict OR no_baseline_match'
- question: What is ACAS scan coverage per subnet (hosts scanned / hosts expected), and are any subnets
    falling below the derived coverage floor or showing discovered-asset counts that deviate materially
    from recent baselines?
  context: Coverage gaps blind the inventory under the Asset Inventory tactic. Measure (Volume) discovered-asset
    counts and the scan-coverage ratio per subnet (hosts scanned / hosts expected), (Frequency) scans
    per range per cadence window, and (State) the rate of scans that fail, time out, or return unauthenticated.
    Compare counts against passive Zeek/NetFlow observations and the authoritative baseline; alert when
    coverage drops below a derived floor (e.g., <90% of a subnet) or when discovered-asset counts deviate
    materially from recent baselines. Low coverage or a high rate of failed/unauthenticated scans means
    hardware may be present but invisible to the inventory, creating an exploitable blind spot.
  answer_sources:
  - ACAS scan results
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '| stats dc(host) as scanned, expected_hosts, sum(scan_fail|timeout|unauth) by subnet

      | eval coverage = scanned/expected_hosts

      | compare scanned vs passive zeek/netflow observed counts

      | where coverage < 0.90 OR abs(count - baseline) > materiality

      | alert'
- question: Which network ranges are most likely to contain unscanned or misclassified hardware, and what
    features make them high-risk for prioritized follow-up discovery?
  context: 'To direct limited scanning resources under the Asset Inventory tactic, train a model on historical
    scan cadence, subnet characteristics, passive-observation frequency, authentication-failure rates,
    and prior discrepancy outcomes to rank network ranges most likely to contain unscanned or misclassified
    hardware. Surface the top-3 contributing features per prediction to prioritize follow-up discovery.
    A range that is rarely scanned, shows high passive traffic, and has a history of authentication failures
    or discrepancies is a strong candidate for hidden hardware and should be targeted first with authenticated
    discovery. References: [Robust IoT security using isolation forest and one class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - ACAS scan results
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [scan_cadence, subnet_chars, passive_obs_freq, auth_fail_rate, prior_discrepancy]

      model.train(historical ranges)

      | predict P(unscanned_or_misclassified) per range

      | rank desc; emit top_3_contributing_features

      | queue high-risk ranges for follow-up discovery'
- question: For every internet-facing hardware asset the ASM platform discovers (firewalls, VPN gateways,
    load balancers), can ownership be validated against internal inventory, and is any unmatched external
    asset being treated as an unapproved component?
  context: 'Internet-facing edge hardware is the primary target of a sophisticated external actor, so
    under the Asset Inventory tactic seed the ASM platform with known domains, IP ranges, and subsidiaries,
    then continuously review discovered edge hardware and correlate against internal inventory to validate
    ownership. Treat any unmatched internet-facing asset as an unapproved component per NIST SP 800-128.
    Confirm device/OS class on discovered hosts with active or passive stack fingerprinting (Nmap OS detection,
    p0f v3). An unmatched exposed firewall or VPN gateway represents both an inventory gap and a potential
    unmanaged attack surface that must be claimed or remediated immediately. References: [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf),
    [Nmap Remote OS Detection](https://nmap.org/book/osdetect.html), [p0f v3](https://lcamtuf.coredump.cx/p0f3/).'
  answer_sources:
  - ASM platform discovery reports and asset inventory exports
  - 'NAI: The organization''s internet-facing perimeter and public IP address ranges.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'seed ASM with known_domains, ip_ranges, subsidiaries

      discovered_edge = ASM.discover(firewalls, vpn_gw, load_balancers)

      | correlate discovered_edge against internal_inventory

      | confirm device/OS class via nmap_osdetect OR p0f

      | where not matched -> unapproved_component | alert'
- question: How are internet-facing hardware counts, newly exposed assets, and unresolved-ownership exposures
    trending over time, and do any exceed historical norms for the external perimeter?
  context: Changes in the external attack surface are high-value signals under the Asset Inventory tactic.
    Track (Volume) counts of internet-facing hardware by device class, provider, and address range; (Frequency)
    the per-week rate of newly exposed assets; and (State) the proportion of exposures with unresolved
    ownership or failed validation. Alert when discovered totals, ownership mismatches, or unmanaged exposures
    exceed historical norms for the external perimeter. A spike in newly exposed hardware or a growing
    backlog of unowned exposures can indicate shadow IT, misconfiguration, or adversary-established footholds
    and warrants prompt review.
  answer_sources:
  - ASM platform discovery reports and asset inventory exports
  - 'NAI: The organization''s internet-facing perimeter and public IP address ranges.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '| stats count by device_class, provider, address_range

      | eval new_exposed_rate = first_seen_assets per week

      | eval unowned_pct = unresolved_ownership/total

      | where total > hist_norm OR ownership_mismatch > hist_norm OR unowned_pct > hist_norm

      | alert'
- question: Which ASM-discovered hardware assets score highest for being orphaned, shadow, or improperly
    inventoried based on ASN, certificate traits, banner data, and hosting context?
  context: 'To prioritize external-asset investigations under the Asset Inventory tactic, train a classifier
    on ASN, certificate traits, banner data, hosting context, and prior ownership outcomes to score ASM-discovered
    hardware for likelihood of being orphaned, shadow, or improperly inventoried, reporting the top-3
    contributing features in each alert. Investigate high-risk scores first. An asset on an unexpected
    ASN with a self-signed or mismatched certificate and an unusual banner is a strong candidate for orphaned
    or shadow hardware that may have fallen outside official inventory and patching processes. References:
    [Robust IoT security using isolation forest and one class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - ASM platform discovery reports and asset inventory exports
  - 'NAI: The organization''s internet-facing perimeter and public IP address ranges.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [ASN, cert_traits, banner_data, hosting_context, prior_ownership]

      model.train(labeled ownership outcomes)

      | score P(orphaned_or_shadow) per ASM asset

      | rank desc; emit top_3_contributing_features

      | investigate high-risk first'
- question: What is the current master list of observed MAC-IP-hostname tuples derived from Zeek conn.log
    and Windows Event ID 4624, and are there any IP-MAC conflicts or gratuitous-ARP churn indicating MAC
    spoofing of inventoried hosts?
  context: 'Building a behavioral baseline of active network hardware is core to the Asset Inventory tactic.
    Aggregate unique MAC and IP addresses from Zeek conn.log over a 30-day period and correlate IPs with
    hostnames from Windows Event ID 4624 to maintain a master list of MAC-IP-hostname tuples representing
    observed hardware. Enrich each MAC with its OUI vendor and bind expected IP-MAC pairs. Flag IP-MAC
    conflicts and reply-without-request / gratuitous-ARP churn as MAC-spoofing of inventoried hosts. A
    stable tuple set confirms known hardware; conflicts or ARP churn suggest an adversary impersonating
    an inventoried device to evade asset controls. References: [Intelligent ARP Spoofing Detection using
    Multi-layered Machine Learning](https://arxiv.org/abs/2507.21087).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'tuples = aggregate(zeek.conn.log MAC,IP over 30d)

      | join IP -> hostname from EID 4624

      | enrich MAC with OUI_vendor; bind expected IP-MAC pairs

      | flag where IP has multiple MACs OR MAC has multiple IPs (conflict)

      | flag gratuitous_ARP / reply_without_request churn  // MAC spoofing'
- question: Which observed hardware tuples are transient or low-prevalence across the fleet — appearing
    suddenly, with short dwell time, or below a site-derived rarity percentile — and merit review?
  context: 'Separating stable core infrastructure from transient hardware is a key statistical task under
    the Asset Inventory tactic. Compute (Frequency) per-tuple appearance rate and (State) dwell/persistence,
    and apply fleet-wide rarity/prevalence scoring over OUI, hostname, and subnet placement. Flag tuples
    with sudden appearance, short dwell time, or prevalence below a site-derived percentile (e.g., bottom
    1%) for review. A device that appears briefly and disappears, or whose OUI/hostname pattern is rare
    for its subnet, may be a visitor device, a test rig, or unauthorized hardware that never entered the
    inventory. References: [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '| stats appearance_rate, dwell_time, first_seen, last_seen by tuple

      | eval prevalence = rarity_score(OUI, hostname, subnet) fleet-wide

      | where sudden_appearance OR dwell_time < short OR prevalence < p01

      | alert for review'
- question: Which hardware tuple relationships do not fit established inventory patterns based on per-asset
    traffic-behavior snapshots, tuple stability, subnet placement, and hostname conventions?
  context: 'To detect hardware that masquerades as legitimate but behaves anomalously under the Asset
    Inventory tactic, train a per-asset behavioral model on traffic-volume and timing ''behavior snapshot''
    features (packet/byte counts, inter-arrival jitter, magnitude/radius) following N-BaIoT, plus tuple
    stability, subnet placement, and hostname conventions, to identify hardware relationships that do
    not fit established inventory patterns. Surface the top-3 contributing features per alert and prioritize
    anomalous tuples lacking an authoritative inventory match. A device whose traffic profile diverges
    from its claimed identity, with no baseline match, is a high-confidence lead for rogue or compromised
    hardware. References: [N-BaIoT](https://arxiv.org/abs/1805.03409).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [pkt/byte_counts, inter_arrival_jitter, magnitude/radius (N-BaIoT),\n         \
      \   tuple_stability, subnet_placement, hostname_convention]\nmodel.train(per-asset behavior snapshots)\n\
      | score tuples for deviation from established patterns\n| emit top_3_contributing_features; prioritize\
      \ anomalous tuples w/o baseline match"
- question: Has any first-seen MAC address or OUI not in the 30-day Zeek dhcp.log baseline requested a
    DHCP lease, and does its device type fall outside the approved white-list?
  context: 'A new device requesting a DHCP lease is the earliest network-visible sign of hardware joining
    the environment, central to the Asset Inventory tactic. Establish a baseline of known MAC addresses
    and OUIs from Zeek dhcp.log over a 30-day period, then continuously alert on first-seen MACs not in
    that baseline, enriching each with OUI vendor and opening a verification workflow. Apply the device-type-match-then-isolate
    enforcement model of IoT Sentinel and white-list known authorized device types, treating any device
    type not on the approved list as unauthorized per the unapproved-component rule of NIST SP 800-128.
    A first-seen MAC with an unapproved device type is a candidate rogue device requiring verification
    or isolation. References: [IoT Sentinel](https://arxiv.org/abs/1611.04880), [Detection of Unauthorized
    IoT Devices Using Machine Learning](https://arxiv.org/abs/1709.04647), [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf).'
  answer_sources:
  - Zeek dhcp.log
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'baseline = known_MACs/OUIs from zeek.dhcp.log over 30d

      | alert where dhcp.client_mac NOT IN baseline (first_seen)

      | enrich OUI_vendor; classify device_type

      | where device_type NOT IN approved_whitelist -> unauthorized

      | open verification workflow / isolate'
- question: What is the daily rate of first-seen MAC addresses by subnet, OUI, and VLAN/building context,
    and are there DHCP NAKs, declines, or lease failures or new-device arrival spikes that suggest rogue
    or misconfigured hardware?
  context: Quantifying new-device arrivals under the Asset Inventory tactic distinguishes normal onboarding
    from anomalous influxes. Track (Volume/Frequency) the daily rate of first-seen MAC addresses by subnet,
    OUI, and VLAN/building context, and (State) the rate of DHCP NAKs, declines, and lease failures that
    often accompany rogue or misconfigured hardware. Alert when new-device arrival rates exceed historical
    thresholds or when an OUI appears in segments where it has not previously been observed. A surge of
    new MACs, an OUI appearing in an unexpected segment, or a cluster of lease failures can indicate unauthorized
    hardware deployment or address spoofing.
  answer_sources:
  - Zeek dhcp.log
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "| stats count(first_seen_MAC) as new_devices, count(NAK|decline|lease_fail) as fails\n  by\
      \ day, subnet, OUI, vlan/building\n| where new_devices > hist_threshold\n   OR OUI not previously\
      \ seen in segment\n   OR fails rising | alert"
- question: For each newly observed MAC, what is its predicted device type from passive DHCP/traffic traits,
    and is it likely a known authorized type, misconfigured, spoofed, or rogue — including devices hidden
    behind NAT?
  context: 'To triage new hardware under the Asset Inventory tactic, identify device type from passive
    traffic/DHCP traits using the packet-level-feature Random Forest of IoT Sentinel or the behavioral-fingerprint
    classifiers of IoTSense, and score whether a new MAC is likely a known authorized type, misconfigured,
    spoofed, or rogue. Surface the predicted device type and top-3 contributing features in the alert
    so analysts can triage. For NAT''d segments, apply NetFlow-based deNAT identification to reveal devices
    hidden behind routers. A device that fingerprints as a type inconsistent with its claimed identity,
    or one revealed behind NAT, is a strong candidate for unauthorized or evasive hardware. References:
    [IoT Sentinel](https://arxiv.org/abs/1611.04880), [IoTSense](https://arxiv.org/abs/1804.03852), [Robust
    IoT security using isolation forest and one class SVM](https://www.nature.com/articles/s41598-025-20445-4),
    [Privacy-Preserving Detection of IoT Devices Behind a NAT](https://arxiv.org/abs/1905.13430).'
  answer_sources:
  - Zeek dhcp.log
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = packet_level + dhcp_traits (IoT Sentinel RF / IoTSense)

      model.predict device_type per new MAC

      | classify: authorized | misconfigured | spoofed | rogue

      | emit predicted_type + top_3_contributing_features

      | for NAT segments: netflow_deNAT to reveal hidden devices'
