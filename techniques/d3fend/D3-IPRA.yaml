name: 'D3-IPRA: IP Reputation Analysis'
id: 73494f4b-35c3-4467-9539-ca34a1c0d281
description: Investigate communication between internal hosts and high-risk external IP infrastructure
  using IP reputation analysis. This playbook helps an analyst hunt for direct matches to curated malicious
  IP/CIDR threat intelligence, statistically rare ASN/country interactions, scanning-like fan-out with
  elevated connection-failure (S0/REJ) ratios, fast-flux IP-pool dispersion, and reputable-CDN domain
  fronting that hides low-reputation backends. It layers deterministic feed and rule matching, first-party
  statistical rarity and failure-rate baselining, and explainable machine-learning reputation/anomaly
  scoring over IP-domain-ASN graph context so that unknown (unlisted) destinations are treated as suspicious
  rather than benign.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any external IP address that matches our curated IP/CIDR threat-intelligence feeds successfully
    complete a TCP handshake (conn_state SF/S1/RSTO) with an internal host, and were any blocked or failed
    attempts (S0/REJ) to the same indicators also recorded?
  context: This is the deterministic floor of IP reputation analysis (Detect tactic). Ingest curated IP/CIDR
    threat feeds and match every external IP seen in Zeek conn.log and firewall logs. A successful handshake
    to a known-bad indicator is a high-severity event warranting immediate containment; capture session
    metadata (ports, orig_bytes/resp_bytes, duration) for scoping. Failed/blocked attempts (S0/REJ) against
    the same indicators are a distinct lower-severity reconnaissance signal and must be recorded, not
    discarded. Because static lists lag real badness, treat a feed miss as 'unknown' rather than 'benign'
    and route it to the statistical and ML layers below.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ip_blocklist = load_feed('curated_ip_cidr')\nfor conn in zeek_conn_log + firewall_logs:\n\
      \  if conn.dst_ip in ip_blocklist or conn.src_ip in ip_blocklist:\n    if conn.conn_state in ['SF','S1','RSTO']:\n\
      \      alert(severity='high', meta=[ports, orig_bytes, resp_bytes, duration])\n    elif conn.conn_state\
      \ in ['S0','REJ']:\n      alert(severity='low', tag='recon_blocked')\n# feed misses -> forward to\
      \ statistical/ML layers, do not mark benign"
- question: When an IP reputation hit occurs, what domains, resolved-IP sets, and TLS certificate metadata
    were associated with that host during the same time window?
  context: Single-signal IP hits produce false positives. Under the Detect tactic, pivot from a reputation
    hit to Zeek dns.log and ssl.log for the same internal host and time window to identify the domains
    queried, the resolved-IP sets, and certificate metadata. Incidents where BOTH the IP and the domain/cert
    context look suspicious should be escalated; corroboration via passive-DNS IP/ASN/prefix association
    raises confidence and reduces noise. A clean DNS/cert context may downgrade an otherwise-isolated
    IP hit.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days; pivot to a +/- 1 hour window around each IP reputation hit
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for hit in ip_reputation_hits:\n  win = [hit.time - 1h, hit.time + 1h]\n  dns = zeek_dns_log[host=hit.internal_host,\
      \ time in win]\n  ssl = zeek_ssl_log[host=hit.internal_host, time in win]\n  if suspicious(dns.query,\
      \ dns.answers) and suspicious(ssl.cert, ssl.sni):\n    escalate(hit, context=[dns.query, dns.answers,\
      \ ssl.subject, ssl.issuer])"
- question: Did any internal server accept a successful connection sourced from a known bulletproof-hosting
    or high-risk ASN?
  context: Detect tactic. Compare the source/destination ASN of connections in Zeek conn.log against a
    maintained list of known bulletproof-hosting/high-risk ASNs and alert on successful inbound connections
    to internal servers from those networks. Maintain the ASN deny-list using control-plane reputation
    signals (BGP rewiring/churn, blacklisted-prefix prevalence) because malicious autonomous systems are
    identifiable roughly 50-60 days before any of their constituent IPs are blacklisted, giving earlier
    warning than IP-level feeds.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "bad_asns = load_list('bulletproof_high_risk_asn')\nfor conn in zeek_conn_log:\n  asn = asn_lookup(conn.src_ip)\n\
      \  if asn in bad_asns and conn.conn_state in ['SF','S1','RSTO'] and conn.dst in internal_servers:\n\
      \    alert(severity='high', asn=asn, dst=conn.dst_ip)"
- question: On TLS/HTTP egress, does the TLS SNI (ssl.log) disagree with the HTTP Host header (http.log),
    or are rare inner hostnames appearing behind a common reputable CDN front?
  context: Per-IP reputation fails when C2 rides a high-reputation CDN/cloud IP (domain fronting). Under
    the Detect tactic, for each TLS/HTTP connection compare the TLS SNI against the HTTP Host header and
    alert on a mismatch; also flag rare inner hosts seen behind a common reputable front. Reputable-CDN
    destinations should be treated as needing this deterministic counter-check rather than being auto-allowed.
    A mismatch is a strong indicator that the visible front hides a low-reputation backend.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for c in join(zeek_ssl_log, zeek_http_log, by=[conn_uid, time_window]):\n  if c.ssl.sni and\
      \ c.http.host and c.ssl.sni != c.http.host:\n    alert(severity='high', sni=c.ssl.sni, host=c.http.host,\
      \ dst=c.dst_ip)\n  if is_cdn(c.dst_ip) and rare(c.http.host, behind=c.ssl.sni):\n    alert(severity='medium',\
      \ reason='rare_inner_host_behind_cdn')"
- question: Was a sensitive asset or account reached from a never-before-seen country/ASN, or from two
    locations implying physically impossible travel velocity, even if the source IP is on no blocklist?
  context: Detect tactic. Geolocate external source IPs and alert when a sensitive asset/account is accessed
    from a never-before-seen country or ASN, or when two access events for the same identity imply an
    impossible travel velocity (e.g., logins from distant geographies within minutes). Escalate these
    even when the source IP is not on any blocklist, because reputation feeds will not flag a fresh or
    rented IP being used by an external actor with stolen credentials.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for ev in access_events[asset in sensitive_assets]:\n  geo = geolocate(ev.src_ip); asn = asn_lookup(ev.src_ip)\n\
      \  if geo.country not in seen_countries[ev.account] or asn not in seen_asns[ev.account]:\n    alert('geo_novel_access',\
      \ ev)\n  prev = last_access[ev.account]\n  if prev and velocity(prev.geo, geo, prev.time, ev.time)\
      \ > MAX_HUMAN_SPEED:\n    alert('impossible_travel', ev, prev)"
- question: Does any single domain resolve to A-records spanning many distinct /24s, ASNs, and countries
    with low TTL inside a short window, indicating fast-flux hosting?
  context: Detect tactic. From Zeek dns.log, deterministically alert when one domain's A-records disperse
    across many distinct /24 networks, ASNs, and countries with low TTL in a short window (e.g., >10 distinct
    /24s and >5 ASNs in 1 hour with TTL < 300s; tune from your DNS baseline). This dispersion is a strong
    indicator of fast-flux malicious hosting used to make takedown and blocking difficult. Thresholds
    should be calibrated against your own DNS baseline to control false positives from legitimate CDNs.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days; evaluate over rolling 1-hour windows
  queries:
  - technology: Zeek/pseudocode
    query: "for dom, recs in group(zeek_dns_log[qtype='A'], by=domain, window=1h):\n  slash24 = distinct(net24(r.ip)\
      \ for r in recs)\n  asns = distinct(asn_lookup(r.ip) for r in recs)\n  countries = distinct(geo(r.ip).country\
      \ for r in recs)\n  if len(slash24) > 10 and len(asns) > 5 and min(r.ttl) < 300:\n    alert('fast_flux',\
      \ domain=dom, slash24=len(slash24), asns=len(asns), countries=len(countries))"
- question: Compared to a 30-day baseline of external ASN and country frequencies per asset group, is
    a sensitive asset being reached from a first-seen or sub-5th-percentile geography?
  context: Detect tactic, statistical layer. Build 30-day baselines of external ASN and country frequencies
    per asset group and alert on first-seen or sub-5th-percentile geographies for sensitive assets, ranking
    by business criticality and historical rarity score. Derive the percentile thresholds per environment
    from your own logs rather than hard-coding them, and apply population/peer analysis so rarity is scored
    relative to comparable assets. Rare-but-legitimate access (travel, new vendor) must be triaged, but
    rarity concentrated on crown-jewel assets is a priority signal.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days; baseline window 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = freq(external_asn, country) per asset_group over last 30d\nfor ev in access_events[asset\
      \ in sensitive_assets]:\n  asn=asn_lookup(ev.src_ip); ctry=geo(ev.src_ip).country\n  p = percentile_rank((asn,ctry),\
      \ baseline[ev.asset_group])\n  if first_seen(asn,ctry) or p < 5:\n    score = rarity(p) * business_criticality(ev.asset)\n\
      \    alert('rare_geo_asn', ev, score)"
- question: In 5-minute windows, which external IPs contacted a number of distinct internal destinations
    above the 99th-percentile baseline, indicating scanning/reconnaissance?
  context: Detect tactic, statistical layer. In 5-minute windows, count the distinct internal destinations
    contacted by each external IP and compare against the 99th-percentile baseline; flag outliers as reconnaissance
    and display the affected subnets for scoping. Derive the percentile from labeled scan datasets and
    from your own traffic. High fan-out from a single external source is a classic horizontal-scan/recon
    pattern preceding exploitation.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days; evaluate over rolling 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for ip, conns in group(zeek_conn_log, by=src_ip, window=5min):\n  fanout = distinct(c.dst_ip\
      \ for c in conns)\n  if fanout > p99(baseline_fanout):\n    alert('scan_fanout', src_ip=ip, distinct_dst=fanout,\
      \ subnets=affected_subnets(conns))"
- question: Which external IPs exhibit an abnormally high failed-to-successful first-contact ratio (share
    of S0/REJ in conn.log), as scored by a sequential probability ratio test?
  context: Detect tactic, statistical layer. Compute each external IP's failed-to-successful first-contact
    ratio (share of S0/REJ in Zeek conn.log) and apply Wald's Sequential Probability Ratio Test / Threshold
    Random Walk. Malicious sources exhibit far higher failure ratios and can be flagged within roughly
    4-5 observations with tunable error bounds, so failure rate is a primary reputation feature rather
    than noise to be discarded. This catches scanners and spray attacks that touch many closed/filtered
    services.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for ip, conns in group(zeek_conn_log, by=src_ip):\n  outcomes = ['fail' if c.conn_state in\
      \ ['S0','REJ'] else 'success' for c in conns]\n  # Threshold Random Walk / Wald SPRT\n  llr = 0\n\
      \  for o in outcomes:\n    llr += log( P(o|malicious) / P(o|benign) )\n    if llr >= upper_bound:\
      \ alert('high_failure_ratio_malicious', ip); break\n    if llr <= lower_bound: mark_benign(ip);\
      \ break"
- question: Tracking per-domain dispersion over time (distinct resolved IPs, /24s, ASNs, countries, plus
    IP-set novelty and growth rate), which domains show rising dispersion/novelty indicative of fast-flux
    infrastructure?
  context: Detect tactic, statistical layer. Track per-domain counts of distinct resolved IPs, /24 networks,
    ASNs, and countries together with IP-set novelty and growth rate over time. Rising dispersion and
    novelty scores rank candidate fast-flux infrastructure for analyst review. Unlike the single-window
    symbolic rule, this trends behavior over time to surface slow or evolving flux networks that stay
    under per-window thresholds.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for dom in domains(zeek_dns_log):\n  ip_set = resolved_ips(dom, last 90d)\n  features = {distinct_ips:\
      \ len(ip_set), distinct_24: count24(ip_set),\n             distinct_asn: countasn(ip_set), distinct_country:\
      \ countctry(ip_set),\n             novelty: new_ips_per_day(dom), growth_rate: dispersion_slope(dom)}\n\
      \  score = weighted_sum(features)\n  rank_for_review(dom, score)"
- question: When a supervised reputation model (logistic regression / gradient boosting) is applied to
    incoming sessions, which external IPs score above the calibrated probability threshold, and what top-3
    SHAP features drove the score?
  context: Detect tactic, ML layer. Train a logistic-regression or gradient-boosting model using flow
    features (duration, orig_bytes/resp_bytes ratio, protocol, conn_state success/fail), enrichment features
    (ASN risk, geo novelty), and graph features (24-hour host fan-out, resolved-IP/ASN-set size). Apply
    it to incoming sessions and investigate IPs above a calibrated probability threshold while keeping
    deterministic blocklist rules in parallel as a floor. Every alert MUST list the top-3 contributing
    features (e.g., byte ratio, fan-out, ASN rarity) via SHAP so the analyst can validate and act on the
    reasoning.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features(session): [duration, byte_ratio, protocol, conn_state,\n      asn_risk, geo_novelty,\
      \ host_fanout_24h, resolved_ip_set, asn_set]\np = model.predict_proba(X)\nif p > calibrated_threshold:\n\
      \  top3 = shap_top_features(model, X, k=3)\n  alert('ml_malicious_ip', ip=session.dst_ip, prob=p,\
      \ top_features=top3)"
- question: Using benign-trained one-class models (Isolation Forest / One-Class SVM / autoencoder) over
    flow features, which flows to external IPs exceed the 99th-percentile anomaly score even when the
    IP is not blacklisted?
  context: Detect tactic, ML layer, for when malicious labels are scarce. Train benign-only Isolation
    Forest / One-Class SVM / autoencoder models on Zeek/NetFlow features (bytes, duration, port spread,
    distinct destinations, failed-connection ratio) and flag flows to anomalous external IPs above the
    99th-percentile anomaly score, even when the IP is not blacklisted. Prefer OCSVM for adversarial robustness
    and attach LIME attributions so analysts can see the top contributing features. This surfaces novel/unknown
    badness that signature and feed approaches miss.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = OneClassSVM().fit(benign_flows[bytes,duration,port_spread,distinct_dst,fail_ratio])\n\
      for flow in flows:\n  s = model.anomaly_score(features(flow))\n  if s > p99(anomaly_scores):\n \
      \   attr = lime_explain(model, features(flow))\n    alert('flow_anomaly', dst=flow.dst_ip, score=s,\
      \ top_features=attr)"
- question: Modeling hosts as nodes and external-IP communications as edges, which new external-IP-to-internal-host
    edges or abnormal fan-out structures receive high graph anomaly scores?
  context: Detect tactic, ML layer. Model internal hosts as nodes and external-IP communications as edges,
    then use unsupervised graph embedding plus link prediction to score anomalous new external-IP-to-internal-host
    edges and abnormal fan-out structure. Per-edge anomaly scores localize which host, edge, and feature
    drove the alert for explainability. This captures relational/structural anomalies (e.g., a server
    suddenly talking to an external IP it never has, or a hub-like fan-out pattern) that per-flow models
    cannot see.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Firewall logs
  - 'NAI: Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(nodes=internal_hosts + external_ips, edges=conn_log_sessions)\nemb = graph_embed(G)\n\
      for edge in new_edges(G, since=yesterday):\n  score = 1 - link_prediction_prob(emb, edge.src, edge.dst)\n\
      \  if score > threshold or fanout_structure_anomaly(edge.node):\n    alert('graph_new_edge_anomaly',\
      \ host=edge.internal, ext_ip=edge.external, score=score)"
