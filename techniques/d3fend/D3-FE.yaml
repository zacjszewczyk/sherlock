name: 'D3-FE: File Encryption'
id: 6be26823-1078-4328-9d6e-fd2dfa86d710
description: Investigate whether sensitive data at rest and in transit is genuinely protected by file
  encryption, or whether high-value content is exposed as plaintext. This playbook helps an analyst hunt
  for sensitive files (intellectual property, PII, finance, and legal records) that traverse unencrypted
  or weakly protected transports, that sit on high-value shares without the expected at-rest encryption
  controls, or that are claimed to be encrypted but fail randomness and entropy tests and are in fact
  plaintext or merely compressed. It combines deterministic watchlist and content-signature rules, statistical
  entropy and randomness analysis, file-I/O entropy-delta detection of active encryption events, exposure
  prioritization, and machine-learning content classification to surface unprotected sensitive data and
  validate encryption controls before an adversary can exfiltrate readable content.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are sensitive files (customer exports, finance workbooks, legal archives, and other PII-bearing
    documents) being transferred over cleartext or weakly protected channels such as FTP, HTTP, or SMBv1
    instead of an encrypted transport?
  context: In the Harden context, the goal is to find sensitive data that is exposed in transit so encryption
    controls can be enforced. Maintain a watchlist of sensitive filenames, extensions, and directory patterns
    derived from the PII taxonomy and impact tiers in [NIST SP 800-122](https://nvlpubs.nist.gov/nistpubs/legacy/sp/nistspecialpublication800-122.pdf),
    and augment it with regex/checksum content matchers (Luhn-validated card numbers, SSN/IBAN patterns)
    per the [DLP survey by Alneyadi et al.](https://www.sciencedirect.com/science/article/abs/pii/S1084804515002908)
    Query Zeek files.log and conn.log for watchlist or content matches carried over unencrypted protocols,
    which violate the in-transit encryption baseline in the [NIST ITL Bulletin (Aug 2020)](https://csrc.nist.gov/files/pubs/shared/itlb/itlbul2020-08.pdf).
    A positive result is sensitive content seen on a cleartext channel, indicating a real exposure that
    requires encryption enforcement; alert on each occurrence with host and user context so the owning
    workflow can be remediated.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log JOIN conn.log ON conn_uid\nWHERE (filename IN sensitive_watchlist OR content MATCHES\
      \ pii_regex)\n  AND service IN (ftp, http, smbv1)  // cleartext / weakly protected\nEMIT alert WITH\
      \ src_host, dst_host, user, filename, service"
- question: Which protected shares and directories hold repeatedly accessed or copied sensitive-pattern
    files that lack approved encrypted-container conventions and show no associated encryption-tool execution
    in the same workflow window?
  context: 'Hardening requires confirming that at-rest encryption controls (full-disk, volume, file/folder,
    key management) defined in [NIST SP 800-111](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-111.pdf)
    are actually applied where sensitive data lives. Correlate Windows Event ID 5145 (share access) and
    4663 (object access) for protected shares and directories with sensitive naming conventions, then
    flag files that are repeatedly accessed or copied yet do not match approved encrypted-container naming
    and have no encryption-tool execution evidence (Windows Event ID 4688) nearby in time. A positive
    result is a policy gap: sensitive content that is being used unencrypted. This drives control validation
    and remediation on the affected share.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = EventID IN (5145, 4663) WHERE object MATCHES sensitive_naming\nFOR each file:\n \
      \ if file NOT MATCHES approved_encrypted_container\n     AND NO EventID 4688 (encryption_tool) within\
      \ +-30m on same host/user\n  THEN flag(file, share, user)"
- question: When file extensions disagree with their actual magic-byte/header signatures, are sensitive
    document types (office docs, PST archives, database dumps) present in locations or transports that
    lack the expected encryption control?
  context: Adversaries and careless workflows hide sensitive content behind misleading extensions, so
    Hardening must resolve true content type from magic-byte/header signatures rather than trust the extension,
    then apply sensitive-content rules to the resolved type. Signature heuristics are the deterministic
    floor that learned classifiers like [Magika](https://arxiv.org/pdf/2409.13768) and [FiFTy](https://arxiv.org/abs/1908.06148)
    refine. Alert when a sensitive document type is found where encryption is expected but absent, especially
    when extension and detected type disagree, which both indicates exposure and may signal obfuscation.
    A negative result (extension matches benign type) lowers priority.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each file IN (files.log, object_access):\n  true_type = magic_signature(file.header_bytes)\n\
      \  if true_type IN sensitive_types\n     AND location/transport NOT IN approved_encrypted\n  THEN\
      \ alert(file, true_type, extension,\n             mismatch = (true_type != type_from_extension))"
- question: Within high-risk sensitive file cohorts, which files fall in the low-entropy (bottom quartile)
    band that indicates they are likely unencrypted plaintext rather than encrypted or packed content?
  context: Entropy cleanly separates encrypted/packed content from native text and code. Calculate Shannon
    entropy for file cohorts from Zeek files.log grouped by MIME type and extension, using the encrypted/packed
    band (>7.2 bits/byte) versus native text/code (~4.5-6.5) established by [Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989),
    and build per-service baselines per the [Baseline Payload Entropy study](https://www.mdpi.com/1999-5903/16/12/470)
    (encrypted >~7.0). Derive dataset-specific thresholds by fitting each high-risk cohort's entropy distribution
    and flag files in the bottom quartile within sensitive cohorts as likely unencrypted. This supports
    Hardening by pinpointing sensitive data that needs encryption; a low-entropy result on a 'should-be-encrypted'
    file is a strong exposure signal.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR cohort IN group_by(files.log, mime_type, extension):\n  entropy = shannon(file.bytes)\n\
      \  threshold = quantile(cohort.entropy, 0.25)\n  flag files WHERE entropy <= threshold AND cohort\
      \ IN sensitive_cohorts\n  // encrypted band >7.2, text/code ~4.5-6.5"
- question: Do files that are supposed to be encrypted actually pass NIST SP 800-22 randomness tests,
    or do they fail and turn out to be plaintext or merely compressed content masquerading as ciphertext?
  context: A false 'already protected' conclusion leaves sensitive data exposed, so Hardening must verify
    claimed encryption. For files supposed to be encrypted, run randomness tests from [NIST SP 800-22](https://nvlpubs.nist.gov/nistpubs/legacy/sp/nistspecialpublication800-22r1a.pdf)
    (monobit, chi-square goodness-of-fit, runs, approximate entropy) on sampled bytes; genuine ciphertext
    is statistically indistinguishable from random, so a failed test means the content is plaintext or
    compressed. Because compressed and encrypted data both show high global entropy, additionally apply
    within-file byte-frequency distribution analysis ([Differential Area Analysis, Davies et al.](https://www.sciencedirect.com/science/article/pii/S0167404821001140))
    to separate true encryption from compression and reduce false 'already protected' conclusions. A failed
    randomness test is a confirmed gap that requires real encryption.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each file IN claimed_encrypted:\n  sample = sample_bytes(file)\n  pass = nist_800_22(sample,\
      \ [monobit, chi_square, runs, approx_entropy])\n  if NOT pass: flag(file, reason='not random ->\
      \ plaintext/compressed')\n  else: dist_check = differential_area_analysis(file)\n        if dist_check\
      \ == compressed: flag(file, reason='compressed not encrypted')"
- question: Over sensitive paths, is there a sustained read-low-entropy / write-high-entropy file-I/O
    pattern (with high write volume and frequency) that indicates active encryption of content, whether
    sanctioned or adversarial?
  context: Detecting the transition from plaintext to ciphertext both confirms Hardening progress and
    catches adversarial encryption (e.g., ransomware). Instrument file I/O via Windows Event IDs 4663/4656
    and measure the entropy delta between low-entropy reads and high-entropy writes, plus write Volume
    (bytes) and Frequency (writes/min), per [UNVEIL, Kharaz et al.](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf).
    A sustained read-low/write-high pattern over sensitive paths indicates active encryption and confirms
    whether content moved from plaintext to ciphertext. Sanctioned encryption tooling explains benign
    cases; unexplained high-volume bursts demand immediate investigation as possible malicious encryption.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 30 days; pivot to event-centered correlation (+/- 1 hour) around any detected burst
  queries:
  - technology: SIEM/Stats pseudocode
    query: "io = EventID IN (4663, 4656) ON sensitive_paths\nFOR each (host, process) window:\n  read_entropy\
      \ = mean(entropy(reads)); write_entropy = mean(entropy(writes))\n  if (write_entropy - read_entropy)\
      \ > delta_thresh\n     AND write_volume high AND writes_per_min high\n  THEN alert('active encryption',\
      \ host, process, path)"
- question: Which sensitive files and shares combine high suspected sensitivity with high exposure (large
    read/transfer volume, high access frequency, many distinct users) and anomalous access-failure or
    denied-transfer rates that mark them as contested data?
  context: 'To Harden efficiently, remediation must be prioritized. Compute per-file and per-share exposure
    metrics from Windows Event IDs 4663/5145 and Zeek files.log: Volume (bytes read/transferred), Frequency
    (accesses and transfers per minute), distinct users, and State by explicitly profiling access failures
    and blocked/denied transfers (failed 4663 attempts, denied SMB 5145) as a distinct signal of contested
    sensitive data. Rank files that combine high suspected sensitivity and high exposure above the 95th
    percentile, escalating those with anomalous failure rates, for remediation priority. High-exposure
    plus high failure rate suggests both real value and active interest from an adversary.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "metrics = aggregate(EventID 4663, 5145, files.log) BY file, share:\n  volume=sum(bytes), freq=count/min,\
      \ users=distinct(user),\n  fail_rate=count(failed_4663 + denied_5145)/count(all)\nscore = sensitivity\
      \ * exposure(volume, freq, users)\nrank top WHERE score > p95 ; escalate WHERE fail_rate anomalous"
- question: Using a model over extension, detected content type, size, entropy, access cadence, unique
    users, source/destination patterns, and protocol, which files are predicted to be high-risk sensitive
    plaintext that should be routed for encryption enforcement?
  context: Machine learning augments (never replaces) the deterministic rules to catch exposures they
    miss. Train a Random Forest to estimate sensitive-plaintext risk using features including extension,
    detected content type, size, entropy, access cadence, number of unique users, source/destination patterns,
    and protocol type, layering it in parallel with the rules above per the rules-plus-ML pipeline in
    [Scalable Data Classification, Bharadwaj et al.](https://arxiv.org/abs/2006.14109) and the PII-recall
    gains shown by [Truong et al.](https://arxiv.org/abs/2012.09597) Surface the top-3 contributing features
    in each alert (e.g., 'cleartext HTTP transfer', 'entropy 4.1', '38 unique readers') for analyst explainability,
    and route high-confidence high-risk files for encryption enforcement and control validation. Treat
    model output as a prioritization aid that must be corroborated.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [extension, detected_type, size, entropy, access_cadence,\n            unique_users,\
      \ src_dst_pattern, protocol]\nrisk = RandomForest.predict_proba(features)\nif risk >= high_thresh:\n\
      \  alert(file, risk, top3=shap_top_features(features))\n  route_for(encryption_enforcement, control_validation)"
- question: Does a byte-level content classifier detect sensitive document types from raw bytes regardless
    of extension, and can encrypted fragments be distinguished from merely compressed/high-entropy-benign
    content so that unprotected sensitive content is correctly flagged?
  context: Extension-based and pure entropy-threshold methods produce false positives and miss obfuscated
    content. Use a byte-level content classifier such as [Magika](https://arxiv.org/pdf/2409.13768) ([code](https://github.com/google/magika))
    or [FiFTy](https://arxiv.org/abs/1908.06148) ([code](https://github.com/mittalgovind/fifty)) to identify
    sensitive document types from raw bytes regardless of extension, and apply [EnCoD, De Gaspari et al.](https://arxiv.org/abs/2010.07754)
    to distinguish genuinely encrypted fragments from compressed/high-entropy-benign content, resolving
    the entropy-threshold false-positive failure mode. Alert when sensitive content types are detected
    without an approved encryption control, including the classifier's predicted type and confidence in
    the alert text. This supports Hardening by accurately identifying which sensitive data is truly unencrypted
    and needs protection, while suppressing benign compressed files.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4656
  - 'NAI: File servers hosting intellectual property and PII'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR each file:\n  pred_type, conf = magika_or_fifty(file.bytes)\n  state = encod_classify(file.bytes)\
      \  // encrypted vs compressed/benign\n  if pred_type IN sensitive_types\n     AND state != encrypted\n\
      \     AND NO approved_encryption_control(file)\n  THEN alert(file, pred_type, conf, state)"
