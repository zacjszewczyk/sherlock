name: 'D3-DKF: Disk Formatting'
id: de0878f3-b3e0-4408-89d5-469ead6284a4
description: 'Investigate whether disk formatting and media sanitization performed during incident remediation
  actually evicted an adversary from a system, rather than merely appearing to. A reformat is not the
  same as sanitization: it can leave recoverable data remanence and cannot remove firmware/UEFI-resident
  implants. This playbook helps an analyst (1) confirm that sanitization commands were executed by authorized
  responders under a tracked incident ticket with a recorded Certificate of Sanitization, (2) verify that
  data was actually removed via read-back sampling and that eradication/recovery gates were enforced before
  return to service, (3) detect post-format re-acquisition such as contact to known-malicious or previously
  attacker-controlled destinations, low-jitter beaconing, anomalous process ancestry, and baseline-deviating
  event/traffic volume on rebuilt hosts, and (4) verify firmware and boot-chain integrity through golden-measurement
  attestation, ESP/boot-component monitoring, and measured-boot/TPM deviation modeling so that firmware-persistent
  threats (e.g., LoJax, BlackLotus) are not missed. Positive findings indicate eviction failed or the
  host was reinfected; negative findings across all checks support a confident clean-rebuild conclusion.'
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Was the disk-sanitization command (format.com, diskpart.exe, cipher /w, or an approved sanitization
    tool) executed by an authorized responder under a tracked incident ticket, with a recorded Certificate
    of Sanitization?
  context: 'Tactic D3-E (Evict): the goal is to confirm that the destructive action that should have removed
    the adversary was a sanctioned remediation step and not adversary anti-forensics or an unsanctioned
    wipe. Using Windows Event ID 4688 and Sysmon Event ID 1, identify sanitization-tool process creation
    and validate the parent process, the operator account, and a matching incident ticket. NIST SP 800-88
    Rev. 1 requires a recorded Certificate of Sanitization; a quick format with no verification record
    is incomplete eviction. A positive result (authorized, ticketed, certificate present) supports a clean
    remediation; an unauthorized or undocumented wipe is itself suspicious and must be investigated.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID IN (4688, Sysmon:1)

      AND process_name IN ("format.com","diskpart.exe","cipher.exe")

      | enrich operator_account, parent_process, incident_ticket

      | alert WHERE incident_ticket IS NULL OR operator NOT IN authorized_responders OR certificate_of_sanitization
      IS NULL'
- question: Did the remediation process include and pass a mandatory Verify step (representative read-back
    sampling of media regions for residual file signatures or non-zero blocks) before the host returned
    to production?
  context: 'Tactic D3-E (Evict): formatting leaves recoverable remanence, so eviction cannot be assumed
    from a format alone. NIST SP 800-88 Rev. 1 mandates a Verify step. The analyst confirms a passing
    verification result is logged for every remediated host before it re-enters production; flag any host
    returned without one. A failing or missing verification means residual data (and potentially persistence
    artifacts) may remain, so eviction is unconfirmed.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'remediated_hosts = assets WHERE status = "returned_to_production"

      JOIN sanitization_verification ON host

      | alert WHERE verification_result != "PASS" OR verification_result IS NULL'
- question: Did the remediated asset re-enter production only after the full eradication-and-recovery
    workflow (rebuild from known-good media, validation, and a defined heightened-monitoring window) was
    logged?
  context: 'Tactic D3-E (Evict): per NIST SP 800-61 Rev. 2, eradication and recovery require rebuild from
    known-good media, validation, and a heightened-monitoring period. The analyst verifies these gates
    are recorded before an asset returns to service. An asset that re-enters production without the eradication/validation
    gates logged may carry surviving persistence and bypasses the controls that would catch reinfection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each asset WHERE event = "return_to_service"

      REQUIRE logged(rebuild_from_known_good) AND logged(validation) AND logged(monitoring_window_start)

      | alert WHERE any required gate missing'
- question: During the heightened-monitoring window, did the remediated host make any connections or DNS
    lookups to known-malicious, non-corporate, or previously attacker-controlled destinations (including
    the original C2)?
  context: 'Tactic D3-E (Evict): a truly evicted host should not re-contact attacker infrastructure. Using
    Zeek conn.log and dns.log from remediated hosts, alert on traffic to known-malicious, non-corporate,
    or previously attacker-controlled destinations, including the original C2. Profile NXDOMAIN and blocked-connection
    counts separately as a distinct re-acquisition signal (malware attempting to resolve dead/sinkholed
    domains). Any such contact strongly indicates failed eviction or rapid reinfection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log + dns.log WHERE src IN remediated_hosts

      AND (dest IN threat_intel_malicious OR dest IN prior_c2 OR query IN prior_c2_domains)

      | also COUNT NXDOMAIN and blocked_conn per host as reacquisition_signal

      | alert'
- question: After the format, did per-host process-creation, logon (4624), outbound connection count,
    or byte volume exceed the clean/golden-image baseline by 3 or more standard deviations outside maintenance
    windows?
  context: 'Tactic D3-E (Evict): a freshly rebuilt host should behave like its golden image. Compute per-host
    mean and standard deviation of process-creation rate, logon (Windows Event ID 4624) count, outbound
    connection count, and byte volume from a 14-30 day clean baseline, then flag post-format periods exceeding
    k-sigma (start k=3) outside maintenance windows (per Dwyer''s standard-deviation method). Derive thresholds
    per host role. A breach indicates the host is doing more than a clean rebuild should, suggesting surviving
    or returned activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 30 days (baseline) + heightened-monitoring window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = mean,std per host_role over 14-30d clean window FOR (proc_create, 4624_logons,
      out_conn, bytes)

      | post_format metric WHERE metric > mean + 3*std AND time NOT IN maintenance_window

      | alert'
- question: Has the rebuilt host begun low-jitter, periodic callbacks (consistent intervals, consistent
    byte sizes, long duration) consistent with C2 beaconing?
  context: 'Tactic D3-E (Evict): a freshly formatted host that begins regular callbacks indicates failed
    eviction or reinfection. Apply FFT/autocorrelation and connection-interval dispersion analysis (low
    coefficient of variation, consistent byte sizes, long session duration) to Zeek conn.log from remediated
    hosts, using RITA and the noise-robust BAYWATCH pipeline. Detected periodic beaconing on a supposedly
    clean host is a high-priority eviction-failure signal.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log WHERE src IN remediated_hosts

      | GROUP BY src,dest | compute interval_CV, FFT_peak, autocorr, byte_size_consistency, total_duration

      | alert WHERE interval_CV < 0.1 AND strong_periodicity AND consistent_bytes'
- question: After excluding known benign periodic services (software updates, telemetry, keepalives),
    does any residual periodic traffic from the rebuilt host remain that could be malicious beaconing?
  context: 'Tactic D3-E (Evict): to keep reinfection beaconing alerts high-fidelity, subtract known benign
    periodic services (updates, telemetry, keepalives) characterized in campus-edge periodic-traffic studies
    before alerting, and tune period bands to the local benign distribution. The analyst confirms that
    flagged periodicity is not just normal scheduled traffic. Residual periodicity after benign subtraction
    is a stronger indicator of attacker beaconing on a host that should be clean.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'periodic_flows = beaconing_candidates(conn.log, remediated_hosts)

      | SUBTRACT flows MATCHING benign_periodic_allowlist (update/telemetry/keepalive period bands)

      | alert ON remaining periodic_flows'
- question: After the rebuild, did any rare or first-seen parent-child process ancestry appear (e.g.,
    an outlier parent of cmd.exe or powershell.exe) that is not part of the golden image?
  context: 'Tactic D3-E (Evict): anomalous process ancestry appearing post-format indicates the host is
    not actually clean. Build a golden-image baseline of parent-child process tuples (from Windows Event
    ID 4688 and Sysmon Event ID 1) and flag rare/first-seen ancestry, especially outlier parents of cmd.exe/powershell.exe
    (per CAR-2014-11-002). A first-seen suspicious ancestry on a rebuilt host suggests surviving persistence
    or new compromise.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline_tuples = SET(parent->child) from golden_image

      | post_format proc_create (4688/Sysmon-1) WHERE (parent->child) NOT IN baseline_tuples

      | prioritize WHERE child IN (cmd.exe, powershell.exe) AND parent IS outlier

      | alert'
- question: Does the provenance graph of the reformatted host diverge from the clean golden-image model,
    and which new nodes/edges (process, file, or network subgraph) drive that divergence?
  context: 'Tactic D3-E (Evict): train unsupervised provenance models on a clean golden image and flag
    reformatted hosts whose graph evolution leaves the benign envelope, using UNICORN (streaming Weisfeiler-Lehman
    sketches) or the self-supervised masked graph auto-encoder MAGIC. Surface the top-3 contributing nodes/edges
    in the alert text. Graph divergence from the golden image on a supposedly clean host is evidence that
    eviction did not fully succeed.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = UNICORN_or_MAGIC.train(clean_golden_image_provenance)

      | score = model.anomaly(reformatted_host_graph)

      | alert WHERE score > threshold ; emit top-3 contributing nodes/edges'
- question: Does the boot/setup/operational log-key sequence of the reformatted host deviate from the
    golden-image's learned normal sequence?
  context: 'Tactic D3-E (Evict): learn the normal boot/setup/operational log-key sequence of a golden
    image with DeepLog or LogBERT and alert when a reformatted host emits out-of-sequence keys. Include
    the deviating log keys (top-3) and predicted-vs-observed context in the alert for triage. Out-of-sequence
    log keys on a freshly rebuilt host indicate behavior the golden image never exhibited, pointing to
    incomplete eviction or reinfection.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq_model = DeepLog_or_LogBERT.train(golden_image_log_key_sequences)

      | observe reformatted_host_log_keys

      | alert WHERE observed_key NOT IN seq_model.predicted_next ; emit top-3 deviating keys + predicted_vs_observed'
- question: When a post-format anomaly fires, can the alert be linked back through its cause chain to
    originating entities (process/file/network) to confirm whether eviction severed the attacker's foothold
    or a persistence path survived?
  context: 'Tactic D3-E (Evict): when a post-format anomaly fires, use sequence-based attack reconstruction
    such as ATLAS to link the alert back to its originating entities so analysts can confirm whether eviction
    truly severed the attacker''s foothold or a persistence path survived. This turns an isolated alert
    into a full causal story, distinguishing a benign anomaly from a reconstructed attack chain that proves
    the foothold endured.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 1
  - 'NAI: Compromised endpoint devices slated for remediation and network egress points monitoring their
    traffic.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ON post_format_anomaly:

      chain = ATLAS.reconstruct(alert, host_audit_provenance)

      | present originating process/file/network entities + path

      | decide foothold_severed? vs persistence_survived?'
- question: After the format, did SPI flash/UEFI firmware verify against authoritative golden reference
    measurements, or were unauthorized firmware changes detected?
  context: 'Tactic D3-E (Evict): reformatting cannot evict SPI-flash implants such as LoJax. After a format,
    dump and verify SPI flash/UEFI firmware against authoritative golden reference measurements and reject
    unauthorized changes, applying the Roots of Trust for Detection in NIST SP 800-193. A firmware image
    that fails attestation means the implant survived the disk wipe and the host must not return to service
    until firmware is reflashed/replaced.'
  answer_sources:
  - UEFI/SPI flash firmware image
  - EFI System Partition file events
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - TPM/measured-boot logs
  - 'NAI: Remediated endpoints whose firmware/boot chain could harbor implants that survive disk formatting.'
  range: Last 90 days
  queries:
  - technology: Firmware-attestation/pseudocode
    query: 'dump = read_SPI_flash / UEFI_image(host)

      | compare hash(dump) AND measurements vs golden_reference (NIST SP 800-193 RTD)

      | alert WHERE mismatch OR unauthorized_region_change'
- question: Are there anomalous writes to the EFI System Partition, bootmgfw/bootmgr version or hash anomalies,
    bcdedit/MOK changes, or revoked/downgraded signed boot binaries indicating Secure Boot bypass persistence?
  context: 'Tactic D3-E (Evict): Secure Boot bypass bootkits (e.g., BlackLotus) persist through OS reinstalls.
    Monitor EFI System Partition file writes, bootmgfw/bootmgr version/hash anomalies, bcdedit and MOK
    (Machine Owner Key) changes, and revoked or downgraded signed boot binaries. Using ESP file events,
    Sysmon Event ID 1, and Windows Event ID 4688, detect manipulation of the boot chain. Any such modification
    on a remediated host signals bootkit persistence that disk formatting did not remove.'
  answer_sources:
  - UEFI/SPI flash firmware image
  - EFI System Partition file events
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - TPM/measured-boot logs
  - 'NAI: Remediated endpoints whose firmware/boot chain could harbor implants that survive disk formatting.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ESP_file_write OR bootmgfw/bootmgr hash != golden OR cmd MATCHES (bcdedit, mokutil) OR signed_boot_binary
      revoked/downgraded

      | correlate WITH host_remediation_status

      | alert'
- question: After a clean rebuild, did previously-removed dropped files, services, or implant network
    signatures reappear, indicating a firmware implant re-dropping its agent at boot?
  context: 'Tactic D3-E (Evict): treat reappearance of previously-removed dropped files, services, or
    implant network signatures after a clean rebuild as firmware-persistence evidence. This is the canonical
    LoJax detection, where the SPI implant re-drops its agent at every boot. The analyst compares post-rebuild
    artifacts against the catalog of artifacts removed during remediation; any reappearance proves eviction
    failed at the firmware level.'
  answer_sources:
  - UEFI/SPI flash firmware image
  - EFI System Partition file events
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - TPM/measured-boot logs
  - 'NAI: Remediated endpoints whose firmware/boot chain could harbor implants that survive disk formatting.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'removed_artifacts = files/services/net_signatures eradicated during IR

      | post_rebuild observe (Sysmon-1, 4688, file_events, net_signatures)

      | alert WHERE any removed_artifact reappears on remediated host'
- question: Do the measured-boot/TPM PCR sequences and firmware-derived telemetry of the reformatted host
    drift from the clean golden-device baseline?
  context: 'Tactic D3-E (Evict): baseline measured-boot/TPM PCR sequences and firmware-derived telemetry
    of clean golden devices, then flag reformatted hosts whose boot measurements drift from the benign
    envelope using provenance/graph-anomaly methods such as MAGIC, surfacing the top-3 deviating measurements
    in the alert. PCR drift on a rebuilt host indicates a changed boot chain, a strong sign of firmware-resident
    persistence that survived formatting.'
  answer_sources:
  - UEFI/SPI flash firmware image
  - EFI System Partition file events
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - TPM/measured-boot logs
  - 'NAI: Remediated endpoints whose firmware/boot chain could harbor implants that survive disk formatting.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = MAGIC.train(golden_device measured_boot/TPM PCR + firmware_telemetry)

      | score = model.anomaly(reformatted_host boot_measurements)

      | alert WHERE score > threshold ; emit top-3 deviating PCR/measurements'
