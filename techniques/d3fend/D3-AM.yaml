  queries:
  - technology: SIEM/Rule pseudocode
    query: "observed = collect(AD_membership, AzureAD_roles, AWS_IAM)\nauthorized = collect(SCIM_provisioning,\
      \ HR_feed, RBAC_policy)\ndrift = observed - authorized\n| where entitlement.privileged == true\n\
      | eval reason = case(account.status==\"disabled\",\"terminated_retains_access\",\n             \
      \        account.type==\"service\" AND group.interactive_admin==true,\"svc_in_admin_group\",\n \
      \                    true,\"unauthorized_grant\")\n| table account, unauthorized_group, reason,\
      \ first_seen"
- question: Were any privileged group changes performed from non-admin workstations, by unapproved service
    accounts, or outside approved maintenance windows without a corresponding change ticket?
  context: 'Legitimate privilege grants follow a predictable pattern: performed by approved identity administrators,
    from privileged access workstations, during change windows, with a ticket. Correlate each privileged
    group change (4728/4732/4756) with the actor''s Windows Event ID 4624 logon to capture source host
    and logon type. Alert when the grant originates from a non-admin workstation, is performed by a service
    account not approved for identity administration, or falls outside an approved maintenance window
    (e.g., 22:00-06:00 or weekends with no change ticket). Following the causal-rule approach of Hopper,
    a grant lacking a clear benign cause raises its score; the alert should list actor, source host, and
    grant time as top contributing factors. This catches an adversary who has seized an admin credential
    and is granting themselves persistence. (Method: Symbolic Logic; tactic: Model.)'
