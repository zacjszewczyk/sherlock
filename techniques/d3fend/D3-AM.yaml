  - AWS CloudTrail
  - SCIM / HR provisioning logs
  - 'NAI: Domain Controllers, Active Directory / identity servers, cloud IAM control planes, member servers,
    and critical workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX=windows EventID IN (4728,4732,4756)

      | eval action=if(EventID IN (4728,4732,4756),"add","remove")

      | where TargetGroup IN ("Domain Admins","Enterprise Admins","Schema Admins","Administrators","Global
      Administrator","Privileged Role Administrator")

      | stats min(_time) AS first_seen max(_time) AS last_seen values(action) BY MemberName, TargetGroup,
      SubjectUserName

      | table MemberName TargetGroup SubjectUserName first_seen last_seen'
- question: Do observed AD and cloud group/role memberships match authoritative HR/SCIM provisioning state
    and intended RBAC/ABAC policy, and which privileged entitlements exist in the directory but are absent
    from the authorized model?
  context: 'Drift between what the directory actually grants and what HR/SCIM provisioning authorizes
    is a primary indicator of mis-provisioning, leftover access, or quiet privilege abuse. Diff observed
    AD/cloud group and role memberships against authoritative provisioning state (per RFC 7642 SCIM) and
    intended RBAC/ABAC policy (NIST SP 800-162). Alert on any privileged entitlement present in the directory
    but absent from the authorized model, on disabled or terminated accounts that still retain membership,
    and on service accounts placed in interactive-admin groups. A positive result names the specific unauthorized
    group(s); a negative result confirms the directory matches the authoritative source of truth. This
    directly surfaces over-privileged and orphaned accounts that expand the attack surface for an external
    actor or insider. (Method: Symbolic Logic; tactic: Model.)'
