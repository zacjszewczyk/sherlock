  queries:
  - technology: ML/Graph pseudocode
    query: "G = graph(nodes=[users,groups,resources], edges=[membership,access])\ncommunities = louvain(G)\n\
      emb = node2vec(G)\nfor u in users:\n    home = communities[u]\n    for e in u.privilege_edges:\n\
      \        if community(e.target) != home or dist(emb[u], emb[home_centroid]) > tau:\n           \
      \ emit(u, crossed_community=community(e.target), emb_distance=dist)"
- question: Which candidate privilege-traversal paths through the authentication-access graph score as
    anomalous against benign structure, isolating rare credential-misuse operations that sequence models
    miss?
  context: 'Beyond shortest-path enumeration, learned embeddings can rank how unusual a traversal is.
    Learn metapath/path embeddings over the heterogeneous authentication-access graph and autoencoder-score
    candidate privilege-traversal paths against benign structure (per LMTracker), complementing the deterministic
    Tier-0 path rules. Use heterogeneous log-graph embedding and clustering (per Log2vec) to isolate rare
    credential-misuse operations that sequence models miss. Report the anomalous path and its reconstruction
    error. A high reconstruction error means the path does not resemble normal traversals, flagging lateral
    movement or escalation chains that evade signature rules. (Method: Machine Learning; tactic: Model.)'
