      \ score, top3_features(acct))"
- question: Do any identities have privilege edges that cross de-facto role communities or sit far from
    their RBAC neighborhood, indicating role drift or toxic privilege combinations?
  context: 'Real-world access tends to cluster into de-facto roles even when formal RBAC is incomplete.
    Build a graph with users, groups, and protected resources as nodes and membership/access events as
    edges, apply Louvain community detection to derive role communities, and use node2vec embeddings to
    locate identities whose privilege edges cross communities or sit far from their RBAC neighborhood.
    Surface the crossed community and embedding distance as top contributing features. An identity that
    bridges communities it should not (e.g., a finance user holding infrastructure-admin rights) signals
    role drift or a toxic combination that an attacker could exploit; run this in parallel with deterministic
    rules, never replacing them. (Method: Machine Learning; tactic: Model.)'
