      for p in candidate_paths:\n    err = reconstruction_error(ae, emb[p])\n    if err > threshold:\n\
      \        emit(path=p, reconstruction_error=err)\nclusters = log2vec_cluster(auth_access_graph)\n\
      emit rare_clusters(clusters)"
- question: In cloud control planes (AWS CloudTrail, Entra ID audit), which user-role-resource-action
    assignments or uses are contextually malicious yet statistically benign according to an attention-based
    GNN over the dynamic IAM graph?
  context: 'Cloud privilege abuse often looks individually unremarkable while being collectively malicious.
    Model user-role-resource-action audit trails from AWS CloudTrail and Entra ID as a dynamic heterogeneous
    graph and apply attention-based GNN aggregation (per GNN-based IAM detection) to surface contextually
    malicious yet statistically benign privilege assignments and uses. Emit the top-3 attention-weighted
    edges/features as the explanation, while keeping deterministic CloudTrail/Entra grant rules as the
    floor. This catches an external actor who has compromised a cloud identity and is quietly assembling
    permissions that, in isolation, each pass routine rule checks. (Method: Machine Learning; tactic:
    Model.)'
