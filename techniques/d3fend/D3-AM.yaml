      \   OR (offhours==true AND NOT exists(change_ticket))\n| table actor, source_host, grant_time, TargetGroup,\
      \ MemberName"
- question: Are there new identity-to-resource edges (MemberOf, AdminTo, GenericAll, Owns, WriteDACL)
    that create or shorten a privilege-escalation path from ordinary principals to Tier-0 assets such
    as Domain or Global Admins?
  context: 'Flat group listings hide transitive control: an account with WriteDACL or GenericAll over
    an object can pivot to Tier-0 without ever being a direct member of an admin group. Build the identity->right->resource
    graph and compute shortest privilege-escalation paths from ordinary principals to Tier-0 assets, following
    BloodHound attack-path modeling. Alert on any new edge that shortens an existing path to Domain/Global
    Admins or grants transitive control invisible to flat listings, and report the added edge plus resulting
    path length. A shortened path is a high-value finding because it represents exactly the route a sophisticated
    intruder would enumerate and exploit to reach the crown jewels. (Method: Symbolic Logic; tactic: Model.)'
  answer_sources:
