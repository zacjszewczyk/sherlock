questions:
- question: Which accounts have been added to or removed from privileged groups (Domain Admins, Enterprise
    Admins, Schema Admins, local Administrators, and cloud Global/Privileged Role admins), and when was
    each grant first and last observed?
  context: 'This question establishes the deterministic ground truth that the access model records. By
    parsing Windows Event IDs 4728 (member added to security-enabled global group), 4732 (member added
    to security-enabled local group), and 4756 (member added to security-enabled universal group), you
    build a daily inventory of privileged-group membership and materialize user-to-group edges with first_seen/last_seen
    timestamps. This lets an analyst trace exactly when critical access was granted, spot memberships
    that appear without a corresponding provisioning request, and provides the baseline against which
    all later drift, escalation-path, and anomaly checks are measured. A complete, time-bound inventory
    is the prerequisite for modeling the access-control landscape and locating over-privileged accounts.
    (Method: Symbolic Logic; tactic: Model.)'
