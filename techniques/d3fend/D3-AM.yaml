      | where first_use >= relative_time(now(), "-1d@d")

      | lookup bayes_newedge_model edge OUTPUT predicted_prob

      | where predicted_prob < 0.05

      | table account target_resource edge first_use predicted_prob'
- question: Which accounts have multivariate behavior profiles (privileged-group count, distinct shares,
    off-hours logon fraction, source-host diversity, failed/total logon ratio) that an unsupervised model
    scores as anomalous relative to their peer-group baseline?
  context: 'Single-metric thresholds miss accounts that are subtly abnormal across several dimensions
    at once. Build per-entity and peer-group baselines over identity and sign-in telemetry (per Microsoft
    Sentinel UEBA) and score multivariate per-account vectors with an unsupervised Isolation Forest. Alert
    above a contamination-tuned score and list the top-3 contributing features (e.g., off-hours fraction,
    host diversity) so the analyst understands why. This complements deterministic rules by catching low-and-slow
    privilege misuse where no single event crosses a hard threshold but the combined behavior departs
    from the account''s peers. (Method: Statistical Method; tactic: Model.)'
