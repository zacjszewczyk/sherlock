  queries:
  - technology: Graph/BloodHound pseudocode
    query: "G = build_graph(nodes=[users,groups,computers],\n                edges=[MemberOf,AdminTo,GenericAll,Owns,WriteDACL])\n\
      for p in principals where p not in Tier0:\n    path = shortest_path(G, p, Tier0_targets)\n    if\
      \ path.length < previous_length[p] or edge_is_new(path):\n        emit(added_edge=path.new_edge,\
      \ principal=p, path_len=path.length)"
- question: Is any single actor generating clusters of privilege-related failures (failed logons 4625,
    privilege-not-held 4673, denied access 5145) that precede or follow a successful privileged grant?
  context: 'Failure state is itself a signal. Count and alert on clusters of Windows Event ID 4625 (failed
    logon), 4673 (sensitive privilege use / privilege not held), and 5145 with a denied access mask attributable
    to one actor attempting privileged operations. A burst of more than five privilege-related failures
    in ten minutes by a single account, especially when it brackets a successful grant, is high-fidelity
    evidence of brute-forcing, privilege probing, or trial-and-error escalation. Report the failure count,
    the target, and the ratio of failed to total attempts. This catches an adversary testing the limits
    of stolen credentials before achieving access. (Method: Symbolic Logic; tactic: Model.)'
