  - technology: SIEM/Stats pseudocode
    query: 'INDEX=windows EventID IN (4728,4729,4732,4733,4756,4757)

      | bin _time span=1w

      | stats count AS changes count(eval(result="denied")) AS denied BY business_unit, TargetGroup, _time

      | eval fail_ratio = denied/changes

      | streamstats ewma0.2(changes) AS ewma stdev(changes) AS sd BY business_unit, TargetGroup

      | eval ucl = ewma + 3*sd

      | where changes > ucl

      | table _time business_unit TargetGroup changes ewma ucl fail_ratio'
- question: When does an account exercise a privileged path for the first time (first logon to an admin/Tier-0
    host, first access to a sensitive resource, first use of replication rights), and is that new edge
    genuinely novel rather than expected onboarding?
  context: 'The first time an identity uses a privilege is a natural decision point. Flag the first logon
    (4624) to an admin/Tier-0 host, first access (5145/4662) to a sensitive resource, or first use of
    replication rights using a Bayesian new-edge model (Metelli and Heard) that separates genuinely novel
    identity->resource edges from expected onboarding base rates, suppressing false positives from normal
    new-hire activity. Report the new edge and its predicted probability. A low-probability first-seen
    edge, for example an account suddenly performing DCSync-style replication, is a strong indicator of
    credential misuse or escalation in progress. (Method: Statistical Method; tactic: Model.)'
