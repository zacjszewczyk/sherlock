    query: 'INDEX=windows EventID IN (5145,4672)

      | stats dc(ShareName) AS shares count(eval(EventID=4672)) AS spec_logon BY account, peer_group

      | join account [search privileged_membership_counts]

      | eventstats median(priv_count) AS med median(abs(priv_count-med)) AS mad BY peer_group

      | eval mzscore = 0.6745*(priv_count-med)/mad

      | where abs(mzscore) > 3.5 OR priv_count > perc95(priv_count)

      | table account peer_group priv_count shares spec_logon mzscore'
- question: Are there abrupt spikes in the weekly rate of privileged-membership additions/removals (or
    in the failed-grant ratio) by business unit or group that exceed EWMA control limits?
  context: 'Sudden churn in privileged memberships signals misconfiguration, mass abuse, or active escalation
    campaigns. Compute weekly add/remove rates for privileged memberships by business unit and group and
    apply EWMA control limits to detect abrupt increases. Track the failed-grant ratio (denied/attempted)
    as a parallel series. Tune lambda (0.1-0.3) and control width (3-sigma) on historical baselines, using
    robust MAD-based limit estimation for skewed weekly counts. A breach of the upper control limit is
    an early-warning trigger that should prompt review of which accounts and groups drove the spike, separating
    routine onboarding waves from anomalous bursts. (Method: Statistical Method; tactic: Model.)'
