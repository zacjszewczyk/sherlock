      | where (EventID=5145 AND AccessMask="denied") OR EventID IN (4625,4673)

      | bin _time span=10m

      | stats count AS failures dc(EventID) AS types BY SubjectUserName, _time

      | eventstats sum(failures) AS total BY SubjectUserName

      | eval fail_ratio = failures/total

      | where failures > 5

      | table SubjectUserName _time failures fail_ratio target'
- question: Within each peer group (role, department, or OU), which accounts are statistical outliers
    in privileged-membership count, distinct sensitive shares accessed, or special-privilege logon count?
  context: 'Over-privileged accounts stand out from their peers. For each peer group compute per-account
    distributions of privileged-membership count, distinct sensitive shares accessed (Windows Event ID
    5145), and special-privilege logon count (4672). Flag accounts above the 95th percentile or with a
    robust modified Z-score |0.6745*(x-median)/MAD| > 3.5, which resists distortion from a handful of
    legitimate power users. Derive per-environment thresholds from 30-90 days of history and surface the
    specific over-baseline metric in the alert. A flagged account warrants an access review; it may be
    an accumulation of unneeded rights (insider/standing risk) or a compromised account being loaded with
    privilege. (Method: Statistical Method; tactic: Model.)'
