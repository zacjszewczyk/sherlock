name: 'D3-AM: Access Modeling'
id: 10fe0350-5348-4974-b6e7-cb13dcbb710c
description: Investigate the enterprise access-control landscape to identify over-privileged accounts,
  toxic privilege combinations, privilege-escalation paths to Tier-0, anomalous privilege-change behavior,
  and failed privileged-change attempts. This playbook helps an analyst build a time-bound, authoritative
  access model that maps user accounts, group memberships, privileged role assignments, service-account
  entitlements, and sensitive-resource access into identity->group->resource edges, then continuously
  reconciles observed grants against intended RBAC/ABAC policy and authoritative HR/SCIM provisioning
  across Windows AD, Azure AD/Entra ID, and AWS IAM. It combines deterministic symbolic-logic rules, robust
  statistical outlier and control-chart methods, and graph/ML models to surface drift, unauthorized grants,
  escalation paths, and behavioral anomalies.
type: technique
