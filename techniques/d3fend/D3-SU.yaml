name: 'D3-SU: Software Update'
id: 81a30287-bcf4-4de2-be6c-41f629dcfe34
description: This playbook helps an analyst assess software-update assurance and platform hardening posture
  across all managed endpoints, servers, and network egress points. It supports deterministic detection
  of installed software running known-vulnerable or out-of-date versions by normalizing observed software
  names/versions into CPE strings and evaluating them against OVAL/SCAP and the NVD CVE/CPE feed. Findings
  are prioritized by confirmed exploitation (CISA KEV) and exploitation probability (EPSS), and correlated
  against the enterprise version distribution to surface fleet outliers and stragglers. It also covers
  detection of unauthorized/unsanctioned software-updater execution, measurement of exploitation-window-aware
  patch latency, profiling of failed and rolled-back updates that may indicate a broken pipeline or deliberate
  tampering, and ML-based prioritization and prediction of host patch delinquency. The goal is to identify
  hardening opportunities and ensure vulnerable software is remediated before adversaries can exploit
  it.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which installed software products are running versions below their patched/fixed version when
    normalized to CPE and evaluated against OVAL/SCAP definitions and the NVD CVE/CPE feed, and which
    of those are Critical/High by CVSS v3.1 base score?
  context: This is the deterministic determinism floor for software-update assurance under the Harden
    tactic. Normalize observed software names and versions from Zeek software.log, Windows Event ID 4688
    process telemetry, and endpoint inventory (SCAP/OVAL scan results) into CPE strings, then evaluate
    each against OVAL/SCAP definitions and the NVD CVE/CPE feed to flag any product whose installed version
    is below the patched version. Tier the results by CVSS v3.1 base score and alert on Critical/High.
    A positive result means a host is running a confirmed vulnerable version and represents a concrete
    hardening opportunity; a negative result means the version is at or above the patched baseline. Keep
    this match list authoritative regardless of any statistical or ML scoring layered on top.
  answer_sources: &id001
  - Zeek software.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Endpoint software inventory (SCAP/OVAL scan results)
  - 'NAI: All managed endpoints, servers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each host, software in inventory(Zeek_software.log, EID4688, SCAP_inventory):\n  cpe =\
      \ normalize_to_cpe(software.name, software.version)\n  match = evaluate(cpe, OVAL_SCAP_defs, NVD_CVE_CPE_feed)\n\
      \  if match and installed_version < patched_version:\n    sev = cvss_v31_base(match.cve)\n    if\
      \ sev in ('Critical','High'): alert(host, software, match.cve, sev)"
- question: Are any installed software versions mapped to a CVE in the CISA Known Exploited Vulnerabilities
    (KEV) catalog, and are any of those hosts past the KEV remediation due date?
  context: 'KEV entries represent vulnerabilities with confirmed exploitation in the wild, so they warrant
    patch-now treatment independent of CVSS score. Maintain an offline copy of the CISA KEV catalog (CSV/JSON)
    and map every installed software version to its CVE set; any match alerts immediately as highest priority.
    Track each KEV finding against its remediation due date and escalate hosts that are past due. Under
    the Harden tactic this directly closes the highest-confidence exposure: a positive result means an
    actively exploited vulnerability is present on the fleet and must be remediated before an external
    actor or commodity malware leverages it.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "kev = load_offline(CISA_KEV_catalog)\nfor each host, software in inventory:\n  cve_set = cves_for(normalize_to_cpe(software))\n\
      \  for cve in cve_set:\n    if cve in kev:\n      alert(host, software, cve, priority='HIGHEST')\n\
      \      if today > kev[cve].due_date: escalate(host, cve)"
- question: Is any installer or updater process (e.g., setup.exe, install.exe, update.exe, msiexec.exe)
    executing from user-writable paths or being launched by non-administrative/non-service accounts outside
    the sanctioned patch-management tooling?
  context: 'Legitimate patching flows through sanctioned patch-management tooling defined in NIST SP 800-40r4.
    Update or installer activity that originates from user-writable paths (%TEMP%, Downloads) or is launched
    by non-administrative/non-service accounts is suspicious: it can indicate malware masquerading as
    an updater, an attacker living off legitimate installers, or unmanaged software introducing unpatched/vulnerable
    code. Monitor process creation via Windows Event ID 4688 / Sysmon EID 1 for these filenames and parentage.
    A positive result is an unauthorized update event warranting investigation; relating it to the Harden
    tactic, it both undermines the hardened baseline and may be a delivery vector for an external actor.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each proc in process_creation(EID4688, Sysmon_EID1):\n  if proc.name in ('setup.exe','install.exe','update.exe','msiexec.exe'):\n\
      \    if proc.path in user_writable_paths(%TEMP%, Downloads) \\\n       or proc.account not in (admin,\
      \ service):\n      if proc.parent not in sanctioned_patch_tooling:\n        alert(proc.host, proc.name,\
      \ proc.account, proc.path)"
- question: For each software title, which hosts are running versions in the bottom quartile (below the
    25th percentile) of the enterprise version distribution over the rolling 30-day window, marking them
    as fleet outliers/stragglers?
  context: Rare-on-fleet versions concentrate unpatched risk. For each software title, compute the distribution
    of unique installed versions across the enterprise over a rolling 30 days and flag hosts running versions
    below the 25th percentile as out-of-date stragglers. Tune the percentile per title to that product's
    observed update cadence (fast-moving browsers vs. slow line-of-business apps). This statistical approach
    catches drift that deterministic CVE matching may miss when a feed lags. Under the Harden tactic,
    stragglers are prime hardening targets; a host repeatedly in the bottom quartile likely has a stalled
    update mechanism.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each title in software_titles:\n  versions = collect(host->version, window=rolling_30d)\n\
      \  p25 = percentile(distinct(versions), 25)  # tune per title cadence\n  for host, ver in versions:\n\
      \    if ver < p25: flag(host, title, ver, reason='fleet straggler')"
- question: Which hosts or subnets exceed the fleet 90th-percentile patch latency measured from CVE public-disclosure
    date to observed remediation, or have any KEV item past its due date?
  context: 'Exploitation volume can rise by up to five orders of magnitude after public disclosure, so
    latency should be measured from the CVE public-disclosure date (not merely vendor patch release) to
    observed remediation. Build per-title survival curves and alert on hosts/subnets exceeding the fleet
    90th-percentile latency or any KEV item past its due date. Track percent-patched-within-SLA and mean
    time to remediate per NIST SP 800-40r4. Under the Harden tactic this quantifies disclosure-window
    exposure: long-latency hosts spend more time in the period of highest exploitation risk, making them
    priority remediation candidates.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each host, cve in vulnerable_findings:\n  latency = remediation_date(host,cve) - cve_public_disclosure_date(cve)\n\
      build survival_curve per title\np90 = percentile(all latencies, 90)\nfor host, cve, latency:\n \
      \ if latency > p90 or (cve in KEV and today > kev[cve].due_date):\n    alert(host, cve, latency);\
      \ track(pct_within_SLA, MTTR)"
- question: Which hosts show an elevated count of failed or rolled-back software updates, or a version
    downgrade where an installed version decreases over time, relative to their own baseline?
  context: Update failures are a distinct, meaningful signal. Count failed/rolled-back installs per host
    using Windows Update error events, package-manager non-zero exits, and version regressions (an installed
    version that decreases over time) per 7-day window. Alert when a host exceeds 3x its own baseline
    or shows a version downgrade. A broken patch pipeline leaves vulnerable software in place, and a deliberate
    downgrade can be tampering by an adversary trying to re-introduce or preserve an exploitable version.
    Under the Harden tactic this surfaces hosts whose hardening is silently regressing or being actively
    undermined.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each host:\n  fails = count(update_errors(WinUpdate_err, pkgmgr_nonzero_exit), window=7d)\n\
      \  baseline = host_rolling_mean(fails)\n  downgrade = any(installed_version[t] < installed_version[t-1])\n\
      \  if fails > 3*baseline or downgrade:\n    alert(host, fails, downgrade, reason='broken pipeline\
      \ or tampering')"
- question: After deterministic vulnerable-version matching, which findings carry an EPSS exploitation
    probability at or above the escalation threshold (e.g., EPSS >= 0.1), and where do they fall on the
    CVSS-severity x EPSS-probability grid?
  context: Enrich each deterministically-matched vulnerable version with its EPSS probability (EPSS v3,
    gradient-boosted, daily scores) and auto-escalate items with EPSS >= 0.1, tuning the threshold to
    fleet remediation capacity. Place items on the CVSS-severity x EPSS-probability grid so that high-severity
    + high-probability items are patched first; optionally fold in Expected Exploitability to weight CVEs
    likely to gain a functional exploit. Every alert must list the top-3 EPSS feature contributors (e.g.,
    public exploit code present, vendor, reference tags) so triage is explainable. This ML layer prioritizes
    the deterministic and KEV findings under the Harden tactic; it never replaces them.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for each finding in deterministic_vuln_matches:\n  epss = epss_score(finding.cve)   # FIRST\
      \ EPSS v3 daily feed\n  finding.grid = (cvss_severity(finding.cve), epss)\n  if epss >= 0.1:  #\
      \ tune to remediation capacity\n    escalate(finding, top3=epss_feature_contributors(finding.cve))\n\
      \  prioritize(high_severity AND high_epss first)"
- question: Which hosts are predicted most likely to become patch-delinquent based on host role, software
    diversity/count, historical patch latency, network exposure, and prior failed-update count, and what
    are the top contributing features?
  context: Train a gradient-boosting/random-forest classifier on internal telemetry (host role, software
    diversity/count, historical per-host patch latency, network exposure, prior failed-update count) using
    NIST SP 800-40r4 metrics as labels to score the probability that a host becomes patch-delinquent.
    Surface the top-3 contributing features in each alert (e.g., 'high historical latency, internet-exposed,
    4 prior failed updates') so triage is explainable. This predictive layer lets the Harden tactic act
    proactively, directing attention to hosts likely to fall behind before they accumulate exposure. It
    layers on top of the deterministic vulnerable-version and KEV rules and never replaces them.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [host_role, sw_diversity, sw_count, hist_patch_latency,\n            network_exposure,\
      \ prior_failed_updates]\nmodel = gradient_boosting/random_forest(labels=SP800-40r4_delinquency)\n\
      for each host:\n  p = model.predict_proba(features(host))\n  if p > threshold: alert(host, p, top3=feature_importances(host))"
