questions:
- question: Do the installer files transferred and executed during the restoration window match the approved,
    signed software manifest exactly - i.e., do their observed file hashes AND code signatures correspond
    to the precise approved hashes and lengths listed per package per asset class, with no unsigned binaries,
    unknown hashes, or signature mismatches?
  context: Under the Restore tactic, the goal is to confirm software was returned to a trusted known-good
    state, not to a tampered artifact masquerading as legitimate. Monitor Zeek files.log and endpoint
    installation logs for restoration-related installer transfers and compare each observed file hash
    and code signature against the signed software manifest, treated as TUF-style signed targets metadata
    enumerating exact approved hashes and lengths per package per asset class (per NIST SP 800-193's signed-update
    / golden-measurement requirement). Alert on any hash mismatch, unsigned binary, or unknown hash. A
    match across both hash and signature is strong evidence the restored package is authentic; any mismatch
    indicates a substituted, modified, or unauthorized installer and warrants halting the restore and
    escalating.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 11707
  - Windows Event ID 11708
  - Windows CodeIntegrity/AppControl Event ID 3004/3033/3037/3077
  - Software deployment/patch-management logs (SCCM/Intune/WSUS/package manager)
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Endpoint workstations and servers, Internal software deployment/repository servers, Approved-software
    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days; center analysis on the active restoration/maintenance window
  queries:
  - technology: Zeek/pseudocode
    query: "FROM files.log f JOIN install_logs i ON f.fuid=i.fuid\nWHERE f.during_restore_window = true\n\
      LET m = manifest_lookup(f.package, asset_class(i.host))\nWHERE f.sha256 NOT IN m.approved_hashes\n\
      \   OR f.seen_bytes != m.length\n   OR i.code_signature.status != 'valid_signed'\n   OR i.signer\
      \ NOT IN m.approved_signers\n| ALERT 'restore installer fails manifest hash/signature validation'"
  - technology: SIEM/Rule pseudocode
    query: 'index=endpoint install_event

      | eval ok=if(file_hash IN approved_hashes AND signature_status="valid" AND signer IN approved_signers,1,0)

      | where ok=0 AND restore_window=1

      | table host, package, file_hash, signature_status, signer'
- question: For each package reinstalled during the restore, is the installed version at or above the
    approved current version floor, and is the deployment metadata fresh - or is an older but validly-signed
    package being served, indicating a rollback, freeze, or replay (anti-rollback) attack?
  context: 'Adversaries can abuse a legitimate restore to serve an old-but-validly-signed package that
    contains a known vulnerability, defeating signature checks while reintroducing exploitable code (per
    ''A Look in the Mirror: Attacks on Package Managers''). For each restored package, compare the installed
    version against the approved current version floor and check that the consumed snapshot/timestamp
    deployment metadata is current rather than stale (the TUF snapshot/timestamp freshness model). Alert
    when the installed version is below the floor or when metadata freshness has expired. A positive result
    means a downgrade/freeze attack or a misconfigured repository serving stale content; treat it as reintroduction
    of vulnerable software even when signatures validate.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 11707
  - Windows Event ID 11708
  - Windows CodeIntegrity/AppControl Event ID 3004/3033/3037/3077
  - Software deployment/patch-management logs (SCCM/Intune/WSUS/package manager)
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Endpoint workstations and servers, Internal software deployment/repository servers, Approved-software
    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days; center analysis on the active restoration/maintenance window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM install_event e JOIN version_floor v ON e.package=v.package\nWHERE e.restore_window=1\n\
      \  AND ( version_cmp(e.installed_version, v.min_approved_version) < 0\n     OR (now() - e.metadata_timestamp)\
      \ > v.max_metadata_age )\n| ALERT 'anti-rollback/freshness violation on restored package'"
- question: Where in-toto/SLSA supply-chain attestations are available, does the reinstalled package verify
    against a signed layout and per-step link metadata proving it is exactly the artifact the authorized
    build steps produced - and are there any missing, invalid, or unexpected-actor attestations?
  context: A restore is a high-value moment for an attacker to inject a maliciously-built artifact that
    still carries a valid publisher signature. Where in-toto/SLSA attestation exists, verify the signed
    layout plus per-step link metadata so the reinstalled package is provably the output of the authorized,
    expected build pipeline and actors (per in-toto). Alert on missing attestation, invalid signatures
    on the layout/links, or steps performed by an unexpected actor. A passing attestation chain provides
    supply-chain provenance assurance beyond a simple publisher signature; a missing or unexpected-actor
    attestation indicates the build process itself may have been subverted.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 11707
  - Windows Event ID 11708
