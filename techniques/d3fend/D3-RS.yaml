  range: Last 90 days; center analysis on the active restoration/maintenance window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM proc=4688 LEFT JOIN logon=4624 ON proc.user=logon.user AND proc.logon_id=logon.logon_id\n\
      WHERE proc.restore_window=1 AND proc.process IN ('msiexec.exe','setup.exe','*install*')\n  AND (\
      \ logon IS NULL\n     OR proc.user NOT IN approved_admins\n     OR proc.parent_process NOT IN known_good_installer_parents\
      \ )\n| ALERT 'unauthorized operator or anomalous installer lineage during restore'"
- question: After the restore completes, does the installed-software inventory - package set, versions,
    file paths, and service configuration - match the approved secure baseline, or are there deviations
    (extra software, wrong versions, altered paths/services) introduced during recovery?
  context: Security-focused configuration management requires continuous deviation monitoring against
    an approved baseline (per NIST SP 800-128). After restore, compare installed-software inventory, versions,
    paths, and service configuration to the approved secure baseline for that asset class and alert on
    any deviation. A full match confirms the host returned to the intended known-good configuration; deviations
    such as unexpected additional packages, downgraded versions, relocated binaries, or altered service
    accounts/start types may indicate persistence or misconfiguration introduced under cover of the restore
    and require investigation.
  answer_sources:
