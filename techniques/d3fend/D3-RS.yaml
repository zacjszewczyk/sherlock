  range: Last 90 days of benign repository traffic for training; score each restore window
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = IsolationForest+Autoencoder(trained_on=benign_conn_log_endpoint_to_repo)\nFOR flow\
      \ in conn.log WHERE restore_window AND host IN restore_targets:\n  feats = [duration, orig_bytes,\
      \ resp_bytes, dest, proto]\n  IF anomaly_score(model, feats) > threshold:\n     ALERT 'anomalous\
      \ restore-time network behavior' WITH top3_flow_features(feats)"
