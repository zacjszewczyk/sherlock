  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Endpoint workstations and servers, Internal software deployment/repository servers, Approved-software
    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days to build the distributions; evaluate the restore window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint install_chain OR files.log

      | bin _time span=1m | stats count as chains, sum(bytes) as vol by asset_class, package, _time

      | eventstats avg(chains) as mc, stdev(chains) as sc, avg(vol) as mv, stdev(vol) as sv by asset_class,
      package

      | where (chains > mc+3*sc OR vol > mv+3*sv OR vol < mv-3*sv) AND restore_window=1

      | ALERT ''installer-chain frequency/volume outside baseline during restore'''
- question: Do the network connections to deployment/repository servers during the restore window match
    the expected periodicity, byte volume, and destination set baselined from Zeek conn.log, or are there
    off-schedule connections, excess byte volume, or connections to unexpected destinations?
  context: Scheduled deployment and repository traffic is highly periodic with a known destination set;
    restore-time traffic that breaks this pattern can indicate a rogue repository or exfiltration disguised
    as deployment. Baseline the periodicity, byte volume, and destination set of scheduled deployment/repository
    traffic in Zeek conn.log (the periodic-traffic characterization of Mack et al.), and flag restore-window
    connections that are off-schedule, exceed expected byte volume, or reach unexpected destinations.
    Traffic matching the learned profile supports a normal pull from approved repositories; off-schedule
    timing, volume overruns, or new destinations suggest packages are being sourced from or data sent
    to attacker-controlled infrastructure.
