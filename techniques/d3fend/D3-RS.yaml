  - 'NAI: Endpoint workstations and servers, Internal software deployment/repository servers, Approved-software
    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days to establish the per-asset-class baseline; evaluate the restore window
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=app (EventCode=11707 OR EventCode=11708) OR codeintegrity_validation_fail

      | bin _time span=1h | eval fail=if(EventCode=11708 OR ci_fail=1,1,0)

      | stats sum(fail) as fails, count as total by asset_class, _time

      | eval rate=fails/total

      | eventstats avg(rate) as mu, stdev(rate) as sd by asset_class

      | where rate > max(0.05, mu+3*sd) AND restore_window=1

      | ALERT ''elevated install/validation failure rate during restore'''
- question: During the restore, do installer-chain counts (chains per minute) and per-package transferred
    byte volumes fall within the normal per-asset-class distribution, or do they fall outside expected
    percentile bounds (e.g., beyond mean +/- 3-sigma)?
  context: Legitimate restores have characteristic installation cadence and data volumes; large departures
    can indicate extra/unexpected installs or abnormally sized payloads. Build per-asset-class frequency
    distributions of legitimate installation chains and per-package byte-volume distributions, then alert
    when restoration-time chain counts (count/min) or transferred bytes fall outside normal percentile
    bounds, using standard-deviation baselining (Dwyer & Truta). Values inside the bounds support a routine
    restore; counts or volumes beyond mean +/- 3-sigma may indicate an attacker piggybacking additional
    installs or substituting a larger, modified package and warrant inspection of the specific chains
    and files.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 11707
  - Windows Event ID 11708
  - Windows CodeIntegrity/AppControl Event ID 3004/3033/3037/3077
