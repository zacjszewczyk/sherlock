    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days to characterize periodicity and destinations; evaluate the restore window
  queries:
  - technology: Zeek/pseudocode
    query: "FROM conn.log WHERE service IN ('http','https','smb') AND host IN restore_targets\n| baseline\
      \ period, bytes, dest_set per (host, repo_service) over 90d\n| WHERE restore_window\n  AND ( off_schedule(ts,\
      \ learned_period)\n     OR orig_bytes+resp_bytes > expected_vol_p99\n     OR resp_h NOT IN approved_repository_destinations\
      \ )\n| ALERT 'deployment traffic deviates from baseline periodicity/destination'"
- question: Do the restore's log-key sequences (installer, service, and authentication events plus parameters
    such as byte counts and exit codes) match learned known-good restore patterns, or do observed events
    fall outside the model's top-g predicted keys or carry anomalous parameters?
  context: Deterministic rules can miss novel attack sequences; an LSTM log-sequence model learns the
    normal ordering and parameters of a healthy restore and flags subtle deviations. Train a DeepLog-style
    LSTM on known-good restore telemetry (installer, service, and authentication log keys plus parameter
    values like byte counts and exit codes) and flag restorations whose observed events fall outside the
    top-g predicted next keys or whose parameters are anomalous; surface the top-3 deviating log keys/parameters
    in the alert (explainability per SHAP-in-IDS). A sequence within the predicted envelope supports a
    routine restore; out-of-sequence keys or anomalous parameters indicate an unusual workflow - injected
    steps, skipped integrity checks, or abnormal exit codes - meriting triage of the surfaced keys.
