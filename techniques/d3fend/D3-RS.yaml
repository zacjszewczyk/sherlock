  range: Last 90 days of benign restore provenance for training; score each restore window
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_provenance_subgraph(restore_session)\n  nodes: {operator_logon, deploy_agent, installer,\
      \ file_writes, service_start, net_to_repo}\nscore = kairos_score(G, model=known_good_restore_graphs)\n\
      IF score > threshold OR has_unexpected_edges(G):\n  ALERT 'anomalous restore provenance subgraph'\
      \ WITH anomalous_nodes_edges(G)"
- question: During the restore window, do one-class/time-series models over Zeek conn.log flows between
    endpoints and approved repositories flag abnormal connection duration, byte volume, or destination
    patterns indicating tampering or concurrent malicious activity?
  context: Subtle network deviations during restore - slightly longer sessions, atypical byte ratios,
    or new destinations - can reveal tampering or piggybacked activity that fixed thresholds miss. Train
    one-class/time-series models (Isolation Forest, autoencoder) on benign Zeek conn.log traffic between
    endpoints and approved repositories, then flag restoration windows with abnormal connection duration,
    byte volume, or destination patterns, reporting the top-3 contributing flow features (per one-class
    classification on benign NetFlow, with SHAP explainability). Flows scored as normal corroborate a
    clean pull from approved repositories; anomalous flows indicate possible exfiltration, a rogue source,
    or concurrent C2 activity during recovery and should be triaged using the surfaced features.
