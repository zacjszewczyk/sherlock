  - 'NAI: Endpoint workstations and servers, Internal software deployment/repository servers, Approved-software
    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days; center analysis on the active restoration/maintenance window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=windows source=\"Microsoft-Windows-CodeIntegrity/Operational\"\n  EventID IN (3004,3033,3037,3077)\n\
      | where file_create_time within restore_window AND host IN restore_targets\n| stats count by host,\
      \ EventID, file_path, signer\n| ALERT 'code-integrity rejection on restored binary'"
- question: Were the installation processes executed during the restore launched by an authorized administrator
    (correlating Windows Event ID 4688 process creation with Event ID 4624 logon) and through a known-good
    parent-child installer chain (deployment agent -> msiexec/setup -> service control), or are there
    unauthorized operators or anomalous execution paths?
  context: Restoration should follow authorized workflows using trusted media (per NIST SP 800-184). Correlate
    installation process creations (4688) with the operator's interactive/network logon (4624) to confirm
    an approved administrator initiated the work, and validate the parent-child lineage of the installer
    chain (deployment agent spawning msiexec/setup, which in turn drives service control). Flag executions
    run under unexpected accounts, with no corresponding privileged logon, or with anomalous ancestry
    (e.g., an installer spawned from a shell, browser, or Office process). A clean operator+lineage correlation
    supports an authorized restore; deviations suggest an attacker using the restore window to run their
    own installer or living-off-the-land binaries.
