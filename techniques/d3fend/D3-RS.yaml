  range: Last 90 days; center analysis on the active restoration/maintenance window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM restore_install e\nLET att = attestation_lookup(e.package, e.version)\nWHERE att IS NULL\n\
      \   OR verify_intoto_layout(att.layout, trusted_keys) = false\n   OR any(link in att.links WHERE\
      \ link.actor NOT IN expected_build_actors)\n   OR any(link in att.links WHERE verify_signature(link)=false)\n\
      | ALERT 'restored build fails in-toto/SLSA attestation'"
- question: Did any binaries written during the restore window trigger Windows CodeIntegrity/AppControl
    signature-validation failures (Event ID 3004/3033), unsigned image loads (3037), or policy blocks
    (3077) - i.e., did host-native code-integrity enforcement reject any restored code?
  context: This is host-native confirmation of code trust that requires no external API lookup and is
    hard for an attacker to suppress without tampering with the host policy itself. Correlate the restoration
    window with Windows CodeIntegrity/AppControl events and alert on signature-validation failures (3004/3033),
    unsigned image loads (3037), or WDAC policy blocks (3077) on binaries written during restore (per
    Microsoft's Code Integrity event ID reference). Clean enforcement events corroborate that restored
    binaries meet host policy; any failure or block indicates an unsigned, mis-signed, or policy-violating
    binary was introduced during recovery and should halt and escalate.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 11707
  - Windows Event ID 11708
