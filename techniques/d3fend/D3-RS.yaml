    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days; compare immediately post-restore against the approved baseline snapshot
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'LET actual = inventory(host, post_restore=true)

      LET base = approved_baseline(asset_class(host))

      LET diff = symmetric_diff(actual, base) over {package,version,path,service_config}

      WHERE diff != {}

      | ALERT ''post-restore configuration deviates from approved baseline'' WITH diff'
- question: Is the fleet-wide installer failure rate or signature-validation failure rate during the restoration
    window elevated beyond its expected baseline (e.g., MsiInstaller 11707 success vs 11708 failure, plus
    CodeIntegrity validation failures), indicating package corruption, incompatibility, or tampering?
  context: A surge in failed installs or failed signature validations is a distinct failure-mode signal
    that restored packages are corrupt, incompatible, or tampered (per NIST SP 800-40r4). Monitor deployment/patch
    and Windows Application logs - MsiInstaller Event ID 11707 (success) and 11708 (failure) - together
    with CodeIntegrity validation failures, and alert when the fleet install-failure rate exceeds a derived
    baseline. Start at a 5% threshold, then tune to the historical mean + 3-sigma per asset class (the
    sigma-threshold method of Dwyer & Truta). A rate within baseline suggests a healthy restore; a spike
    points to widespread corruption or active tampering and should pause the rollout.
  answer_sources:
