    manifest/attestation store, Network egress and east-west collection points'
  range: Last 90 days of known-good restores for training; score each restore window
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DeepLog_LSTM(trained_on=known_good_restore_sequences)\nFOR each restore_session s:\n\
      \  seq = ordered_log_keys(s) ; params = parameter_vector(s)\n  IF observed_key NOT IN model.topg_predicted(seq_prefix)\n\
      \     OR param_anomaly(params) :\n     ALERT 'anomalous restore log sequence' WITH top3_deviating_keys(s)"
- question: When the restoration provenance subgraph (operator logon -> deployment agent -> installer
    -> file writes -> service start -> network to repository) is scored against learned known-good restore
    graphs, are there anomalous nodes or unexpected causal edges indicating concurrent malicious activity?
  context: Tampering during a restore often shows up as unexpected causal relationships rather than a
    single bad event. Build the restoration provenance subgraph linking operator logon, deployment agent,
    installer, file writes, service start, and network connections to the repository, and score it against
    learned known-good restore graphs (per KAIROS) to flag concurrent malicious activity or unexpected
    causal edges, surfacing the anomalous nodes/edges for triage. A graph matching learned structure supports
    a clean restore; anomalous edges - e.g., the installer spawning an unexpected child, writing to unusual
    paths, or a network connection to a non-repository host - indicate an attacker operating within the
    restore context.
