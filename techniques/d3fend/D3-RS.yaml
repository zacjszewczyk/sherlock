name: 'D3-RS: Restore Software'
id: 1159d2db-75d0-43d3-8afe-66a1c346e75b
description: Investigate whether software restoration activity reflects a legitimate, authorized recovery
  to a known-good state rather than an opportunity for an adversary to reintroduce tampered, outdated,
  or unauthorized code. This playbook helps an analyst confirm that the packages reinstalled during a
  restore were approved, signed, and current; that integrity and supply-chain attestations passed; that
  installation was performed by authorized operators through expected workflows and parent-child process
  chains; and that the post-restore configuration matches the approved secure baseline. It layers deterministic
  policy/manifest/signature/version checks, statistical baselining of install failure rates, installer-chain
  frequency/volume, and deployment traffic periodicity, and explainable ML over restore log sequences,
  provenance subgraphs, and restore-window network behavior. Use it to surface unsigned or unknown-hash
  installers, rollback/freeze attacks serving old but validly-signed packages, missing or unexpected-actor
  build attestations, code-integrity enforcement failures, unauthorized restore execution paths, baseline
  deviations, and concurrent tampering during the recovery window.
type: technique
related:
- tactic_id: D3-R
  tactic_name: Restore
