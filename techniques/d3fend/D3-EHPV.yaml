  context: 'Method: Symbolic Logic. Use ETW Threat-Intelligence call-stack capture at sensitive API calls
    to alert when a call stack contains frames executing from unbacked / non-image (private RWX) memory,
    characteristic of shellcode reached after a hijacked handler pointer ([Doubling Down on ETW Callstacks,
    Elastic Security Labs](https://www.elastic.co/security-labs/doubling-down-etw-callstacks)). In the
    context of the Harden tactic (D3-H), this matters because Exception Handler Pointer Validation (SEHOP/SafeSEH)
    only protects when it is deployed, enabled, and actually firing. A positive result indicates either
    an active SEH-overwrite exploitation attempt or a coverage/configuration gap that an attacker could
    exploit for arbitrary code execution; a negative result, corroborated across the other detection methods,
    increases confidence that exception-handler validation is intact on the named assets. Pursue it by
    focusing on the named areas of interest and the listed data sources.'
  answer_sources:
  - ETW Threat-Intelligence provider call stacks
  - Sysmon
  - CPU Last Branch Record / indirect-branch traces
  - 'NAI: Domain Controllers, Critical application servers, Endpoints of privileged users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AT sensitive_api_call:\n  stack = etw_ti_callstack()\n  FOR each frame IN stack:\n    IF frame.region\
      \ IN (private, RWX, unbacked) AND NOT image_backed\n    THEN emit alert{process,api,frame,reason='execution\
      \ from unbacked memory = shellcode after handler hijack'}"
- question: '[Statistical Method] Threshold gadget-chain length at API gates — On Domain Controllers,
