  - technology: SIEM/Stats pseudocode
    query: "AT api_gate:\n  runs = parse_indirect_branch_history()\n  short = count(consecutive runs WHERE\
      \ instr_len <= 20 AND ends_in_indirect_branch)\n  IF short >= 8 THEN emit alert{process, chain_len=short,\
      \ note='tune per workload; layer with other signals'}"
- question: '[Statistical Method] Model expected call-stack states per process — On Domain Controllers,
