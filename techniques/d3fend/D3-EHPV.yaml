name: 'D3-EHPV: Exception Handler Pointer Validation'
id: 2d4e2963-0c51-4f8a-9d57-ba6bdc468e4f
description: 'This playbook helps an analyst investigate the deployment, operational status, and effectiveness
  of Structured Exception Handler Overwrite Protection (SEHOP) and SafeSEH across critical Windows endpoints
  and servers, and to detect when an attacker has hijacked the structured exception handler chain to gain
  control of execution. It guides the hunt for two complementary signals: (1) security-mitigation and
  application-crash telemetry that reveals whether SEHOP/SafeSEH is actively blocking SEH-overwrite exploitation,
  or whether repeated memory-corruption crashes are occurring without any corresponding mitigation event
  (indicating disabled, missing, or bypassed protection); and (2) runtime control-flow and call-stack
  telemetry that detects the post-overwrite execution stage of a handler hijack, such as invalid returns,
  ROP gadget chains, and execution from unbacked memory. It combines deterministic symbolic-logic rules
  (alerting on mitigation triggers, correlating crash signatures lacking mitigation evidence, auditing
  SafeSEH/SEHOP coverage gaps, enforcing the call-preceded-return invariant, and flagging execution from
  non-image memory) with statistical methods (modified Z-score / MAD baselining, Isolation Forest outlier
  detection, change-point detection, and gadget-chain thresholds) and machine-learning approaches (ARIMA
  forecasting, LSTM log-sequence models, host risk classifiers, call-stack HMMs, and provenance-graph
  anomaly detection). The goal is to confirm that exception-handler validation controls are functioning
  rather than being silently bypassed, and to surface high-confidence exploitation attempts by a sophisticated
  external actor, commodity malware, or an insider seeking unauthorized code execution and access to sensitive
  data.'
type: technique
