- question: '[Symbolic Logic] Enforce the call-preceded-return invariant — On Domain Controllers, Critical
    application servers, Endpoints of privileged users relevant to the Harden tactic, can you enforce
    the call-preceded-return invariant?'
  context: 'Method: Symbolic Logic. At sensitive API/syscall gates, inspect indirect-branch history (Last
    Branch Record) and flag returns that do not land on a call-preceded instruction, a Boolean invariant
    violated by code-reuse following an exception-handler or return-address overwrite ([Transparent ROP
    Exploit Mitigation Using Indirect Branch Tracing, Pappas et al.](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_pappas.pdf)).
    In the context of the Harden tactic (D3-H), this matters because Exception Handler Pointer Validation
    (SEHOP/SafeSEH) only protects when it is deployed, enabled, and actually firing. A positive result
    indicates either an active SEH-overwrite exploitation attempt or a coverage/configuration gap that
    an attacker could exploit for arbitrary code execution; a negative result, corroborated across the
    other detection methods, increases confidence that exception-handler validation is intact on the named
    assets. Pursue it by focusing on the named areas of interest and the listed data sources.'
  answer_sources:
  - ETW Threat-Intelligence provider call stacks
  - Sysmon
  - CPU Last Branch Record / indirect-branch traces
  - 'NAI: Domain Controllers, Critical application servers, Endpoints of privileged users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AT sensitive_api_gate:\n  lbr = read_last_branch_record()\n  FOR each return IN lbr:\n   \
      \ IF target NOT preceded_by_call_instruction\n    THEN emit alert{process,api,target,reason='code-reuse\
      \ / handler-overwrite: return not call-preceded'}"
- question: '[Symbolic Logic] Flag execution returning into unbacked or non-image memory — On Domain Controllers,
    Critical application servers, Endpoints of privileged users relevant to the Harden tactic, can you
