questions:
- question: '[Symbolic Logic] Alert on SEHOP mitigation trigger events — On Domain Controllers, Critical
    application servers, Endpoints of privileged users relevant to the Harden tactic, can you alert on
    SEHOP mitigation trigger events?'
  context: 'Method: Symbolic Logic. Generate high-priority alerts for Windows Security Mitigations Event
    ID 12, which directly indicates SEHOP intervention against a corrupted exception chain and a probable
    exploit attempt; treat any occurrence as a hard signal because the mitigation only fires when the
    OS dispatcher detects an invalid exception-registration chain ([Overview of threat mitigations in
    Windows, Microsoft](https://learn.microsoft.com/en-us/windows/security/threat-protection/overview-of-threat-mitigations-in-windows-10)).
    In the context of the Harden tactic (D3-H), this matters because Exception Handler Pointer Validation
    (SEHOP/SafeSEH) only protects when it is deployed, enabled, and actually firing. A positive result
    indicates either an active SEH-overwrite exploitation attempt or a coverage/configuration gap that
    an attacker could exploit for arbitrary code execution; a negative result, corroborated across the
    other detection methods, increases confidence that exception-handler validation is intact on the named
    assets. Pursue it by focusing on the named areas of interest and the listed data sources.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Security Mitigations Event ID 12
  - 'NAI: Domain Controllers, Critical application servers, Endpoints of privileged users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM windows_security_mitigations

      WHERE EventID == 12

      EMIT alert{host, process, image, time, severity=HIGH, reason=''SEHOP intervention on corrupted exception
      chain''}'
- question: '[Symbolic Logic] Flag crash signatures lacking mitigation evidence — On Domain Controllers,
    Critical application servers, Endpoints of privileged users relevant to the Harden tactic, can you
    flag crash signatures lacking mitigation evidence?'
  context: 'Method: Symbolic Logic. Correlate repeated Windows Event ID 1000 memory-corruption exception
    codes (for example 0xC0000005 access violation and 0xC0000409 STATUS_STACK_BUFFER_OVERRUN) with the
    absence of any paired Event ID 12 mitigation to identify processes or hosts where SEHOP/SafeSEH is
    disabled or has been bypassed; a handler outside the valid set should never execute silently, so an
    unmitigated corruption crash is a coverage failure ([/SAFESEH, Microsoft](https://learn.microsoft.com/en-us/cpp/build/reference/safeseh-image-has-safe-exception-handlers?view=msvc-170),
    [Control-Flow Integrity, Abadi et al.](https://users.soe.ucsc.edu/~abadi/Papers/cfi-tissec-revised.pdf)).
    In the context of the Harden tactic (D3-H), this matters because Exception Handler Pointer Validation
    (SEHOP/SafeSEH) only protects when it is deployed, enabled, and actually firing. A positive result
    indicates either an active SEH-overwrite exploitation attempt or a coverage/configuration gap that
    an attacker could exploit for arbitrary code execution; a negative result, corroborated across the
    other detection methods, increases confidence that exception-handler validation is intact on the named
    assets. Pursue it by focusing on the named areas of interest and the listed data sources.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Security Mitigations Event ID 12
  - 'NAI: Domain Controllers, Critical application servers, Endpoints of privileged users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "crash = SELECT host,process,time FROM app_error WHERE EventID==1000\n  AND exception_code\
      \ IN (0xC0000005,0xC0000409)\nmitig = SELECT host,process,time FROM mitigations WHERE EventID==12\n\
      FOR each crash:\n  IF NOT EXISTS mitig WITHIN +/-60s ON (host,process)\n  THEN emit alert{host,process,exception_code,reason='unmitigated\
      \ memory-corruption crash = SEHOP/SafeSEH coverage gap'}"
- question: '[Symbolic Logic] Audit SafeSEH and SEHOP coverage gaps — On Domain Controllers, Critical
    application servers, Endpoints of privileged users relevant to the Harden tactic, can you audit SafeSEH
    and SEHOP coverage gaps?'
  context: 'Method: Symbolic Logic. Enumerate loaded modules on critical hosts that were built without
    /SAFESEH and confirm process- and system-level SEHOP enablement; flag any non-/SAFESEH module loaded
    in a SEHOP-exempt process as an exploitable blind spot, since attackers target unprotected modules
    to call arbitrary code as a handler ([/SAFESEH, Microsoft](https://learn.microsoft.com/en-us/cpp/build/reference/safeseh-image-has-safe-exception-handlers?view=msvc-170),
    [Overview of threat mitigations in Windows, Microsoft](https://learn.microsoft.com/en-us/windows/security/threat-protection/overview-of-threat-mitigations-in-windows-10)).
    In the context of the Harden tactic (D3-H), this matters because Exception Handler Pointer Validation
    (SEHOP/SafeSEH) only protects when it is deployed, enabled, and actually firing. A positive result
    indicates either an active SEH-overwrite exploitation attempt or a coverage/configuration gap that
    an attacker could exploit for arbitrary code execution; a negative result, corroborated across the
    other detection methods, increases confidence that exception-handler validation is intact on the named
    assets. Pursue it by focusing on the named areas of interest and the listed data sources.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Security Mitigations Event ID 12
  - 'NAI: Domain Controllers, Critical application servers, Endpoints of privileged users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each host IN critical_hosts:\n  sehop = query_policy(host, system_SEHOP) AND query_policy(host,process_SEHOP)\n\
      \  FOR each loaded_module IN host.modules:\n    IF module.SAFESEH == FALSE AND process.SEHOP_exempt\
      \ == TRUE\n    THEN emit finding{host,module,process,reason='non-/SAFESEH module in SEHOP-exempt\
      \ process = exploitable blind spot'}"
- question: '[Statistical Method] Baseline crash-to-mitigation ratio by process — On Domain Controllers,
    Critical application servers, Endpoints of privileged users relevant to the Harden tactic, can you
    baseline crash-to-mitigation ratio by process?'
  context: 'Method: Statistical Method. Compute per-process rates of Event ID 1000 crashes and Event ID
    12 mitigations over rolling windows and alert when crash rates exceed a robust modified Z-score /
    median-absolute-deviation threshold (for example modified Z >= 3.5) while the mitigation ratio falls
    abnormally low; MAD-based scoring resists distortion from noisy batch crashers ([Modified Z-Score
    for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    In the context of the Harden tactic (D3-H), this matters because Exception Handler Pointer Validation
    (SEHOP/SafeSEH) only protects when it is deployed, enabled, and actually firing. A positive result
    indicates either an active SEH-overwrite exploitation attempt or a coverage/configuration gap that
    an attacker could exploit for arbitrary code execution; a negative result, corroborated across the
    other detection methods, increases confidence that exception-handler validation is intact on the named
    assets. Pursue it by focusing on the named areas of interest and the listed data sources.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Security Mitigations Event ID 12
  - 'NAI: Domain Controllers, Critical application servers, Endpoints of privileged users'
  range: Last 90 days (use rolling windows; center correlation on crash/mitigation events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each process over rolling_window:\n  crash_rate = count(EventID==1000)/window\n  mitig_ratio\
      \ = count(EventID==12)/max(crash_rate,1)\n  med, mad = median(crash_rate_hist), MAD(crash_rate_hist)\n\
      \  modZ = 0.6745*(crash_rate-med)/mad\n  IF modZ >= 3.5 AND mitig_ratio low THEN emit alert{process,crash_rate,mitig_ratio,modZ}"
- question: '[Statistical Method] Detect host-level crash outliers on critical systems — On Domain Controllers,
