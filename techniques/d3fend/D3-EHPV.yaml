- question: '[Statistical Method] Detect collapse of mitigation events against sustained crashes — On
    Domain Controllers, Critical application servers, Endpoints of privileged users relevant to the Harden
    tactic, can you detect collapse of mitigation events against sustained crashes?'
  context: 'Method: Statistical Method. Apply CUSUM/PELT/Bayesian online change-point detection to the
    per-host Event ID 12 mitigation-event series and alert when mitigation events drop abruptly to near
    zero while Event ID 1000 corruption crashes persist, a distinct failure-mode signal of a silently
    disabled SEHOP policy or successful bypass ([A Survey of Methods for Time Series Change Point Detection,
    Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)). In the context of the
    Harden tactic (D3-H), this matters because Exception Handler Pointer Validation (SEHOP/SafeSEH) only
    protects when it is deployed, enabled, and actually firing. A positive result indicates either an
    active SEH-overwrite exploitation attempt or a coverage/configuration gap that an attacker could exploit
    for arbitrary code execution; a negative result, corroborated across the other detection methods,
    increases confidence that exception-handler validation is intact on the named assets. Pursue it by
    focusing on the named areas of interest and the listed data sources.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Security Mitigations Event ID 12
  - 'NAI: Domain Controllers, Critical application servers, Endpoints of privileged users'
  range: Last 90 days (use rolling windows; center correlation on crash/mitigation events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series_mitig = per_host_timeseries(EventID==12)

      series_crash = per_host_timeseries(EventID==1000)

      cp = CUSUM_or_PELT(series_mitig)

      IF change_point shows mitig -> ~0 WHILE series_crash sustained

      THEN emit alert{host, change_point_time, reason=''SEHOP silently disabled or bypassed''}'
