name: 'D3-EDL: Executable Denylisting'
id: 83eadac0-4c03-47bc-b4a8-726409b50ea7
description: This playbook helps an analyst assess and investigate the effectiveness of executable denylisting
  (D3-EDL) controls across enterprise endpoints. It examines process-execution telemetry and application-control
  enforcement events (AppLocker, WDAC/CodeIntegrity, Sysmon, Windows 4688) to surface known-bad executables
  that ran despite policy, blocks that fired, audit-mode coverage gaps where a flagged binary was never
  enforced, and trusted-but-abusable signed binaries (LOLBins) that should be constrained or denylisted.
  It combines symbolic-logic matching of hash/name/path/signer against deny indicators, statistical baselining
  of execution frequency, rarity, structural/packing features, and enforcement-failure rates, and machine-learning
  classification and clustering of executables to nominate emerging threats for the denylist. The goal
  is to measure how well denylisting isolates hosts from known malicious software and to identify and
  close policy gaps a sophisticated adversary, commodity malware, or insider could exploit.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any process launch whose SHA-256 hash, filename, full path, or signer/publisher matches
    a threat-intelligence deny indicator, and therefore ran despite our denylisting policy?
  context: 'In support of the Isolate (D3-I) objective, this question directly measures denylist coverage
    failure: a known-bad binary executing is proof the policy did not isolate the host. Pull process-launch
    events from Windows Event ID 4688 and Sysmon Event ID 1 and compare SHA-256 hash, filename, full path,
    and signer/publisher against threat-intel deny indicators. Per NIST SP 800-167, hash/path-only matching
    is brittle and easily evaded, so combine attributes (hash AND path AND signer) to reduce false negatives.
    Any running-process match is high severity and indicates either a missing deny rule or a host running
    in audit/unenforced mode.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventID=4688, Sysmon EID=1)\n  | eval h=lower(sha256), f=lower(file_name),\
      \ p=lower(image_path), s=signer\n  | lookup threatintel_deny on h OR f OR p OR s\n  | where ti_match=true\n\
      \  | stats count by host, user, image_path, sha256, signer, parent_image\n  | alert severity=high"
- question: For each attempted execution, was the binary actually blocked, merely allowed, or flagged
    in audit mode but never enforced — and where are our audit-mode coverage gaps?
  context: 'Supporting Isolate (D3-I), this correlates enforcement outcomes to classify every attempted
    execution. Join AppLocker Event IDs 8002 (allowed), 8003 (audit/would-block), 8004 (blocked) with
    WDAC/CodeIntegrity 3076 (audit) and 3077 (block) against the attempted executions. The key finding
    is audit-mode coverage gaps: a binary that generated an 8003/3076 audit event but was never blocked
    means the policy flagged it yet allowed it to run. Field meanings (path, hash, signer, policy) follow
    Microsoft WDAC and AppLocker event documentation. Surfacing these gaps tells administrators which
    rules are still in audit and need to be moved to enforcement.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (AppLocker 8002,8003,8004; CodeIntegrity 3076,3077)\n  | eval outcome=case(id\
      \ IN (8004,3077),\"blocked\", id IN (8003,3076),\"audited\", id=8002,\"allowed\")\n  | stats values(outcome)\
      \ as outcomes by host, file_path, sha256, signer\n  | where \"audited\" IN outcomes AND NOT \"blocked\"\
      \ IN outcomes\n  | alert msg=\"audit-mode gap: flagged but never enforced\""
- question: Did an AppLocker or WDAC enforcement event fire indicating a file was not allowed to run,
    and which host, user, path, and rule was responsible?
  context: Supporting Isolate (D3-I), every enforced block is a high-fidelity signal that the denylist
    successfully isolated the host from a disallowed binary. Fire an alert on AppLocker enforcement events
    8004/8007 ('file was not allowed to run'), attributing each block to host, user, path, and triggering
    rule, using the portable AppLocker 'File Was Not Allowed to Run' Sigma rule and the broader SigmaHQ
    corpus for known-bad name/hash/signer matches in 4688/Sysmon-1 telemetry. Repeated blocks of the same
    binary on the same host indicate an actor or malware persistently retrying — escalate for investigation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (AppLocker 8004, AppLocker 8007)\n  | stats count by host, user, file_path,\
      \ rule_name, sha256\n  | eval msg=\"file was not allowed to run\"\n  | alert severity=high fields(host,user,file_path,rule_name)"
- question: Are there executables on disk that evade hash/name denylists but match YARA byte-patterns,
    imphash, or packer signatures of known-bad tools — i.e., renamed or recompiled variants?
  context: Supporting Isolate (D3-I), attackers defeat hash- and name-based deny rules by renaming or
    recompiling tools, which changes the hash but preserves code content. Scan executables that hash/name
    denylists miss using YARA byte-pattern, imphash, and packer/obfuscation signatures from the signature-base
    (Roth et al.) corpus to catch renamed or recompiled variants of known-bad tooling. Any content match
    should be nominated for addition to the denylist (ideally via imphash or YARA rule rather than a fragile
    file hash) and triaged on the affected hosts.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: EDR/YARA pseudocode
    query: ">-\n  for each executable not matched by hash/name denylist:\n    run yara(signature-base\
      \ rules) AND compute imphash\n    if yara_match OR imphash IN known_bad_imphash OR packer_detected:\n\
      \       nominate_for_denylist(file); alert host, image_path, rule, imphash"
- question: Are trusted, Microsoft-signed living-off-the-land binaries (rundll32, regsvr32, mshta, msbuild,
    installutil) being invoked with known abuse arguments that publisher allowlists would permit?
  context: Supporting Isolate (D3-I), publisher/signature allowlists trust Microsoft-signed binaries,
    creating a denylist gap that LOLBins exploit. Add command-line-aware deny rules for living-off-the-land
    binaries cataloged by the LOLBAS Project (rundll32, regsvr32, mshta, msbuild, installutil, etc.) and
    alert when these binaries are invoked with known abuse arguments — remote URLs, scriptlets, suspicious
    parent processes. A positive result reveals a policy gap where signed-but-abusable execution bypasses
    denylisting; constrain these via command-line-aware WDAC/AppLocker rules.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventID=4688, Sysmon EID=1)\n  | where file_name IN (rundll32,regsvr32,mshta,msbuild,installutil,...)\n\
      \  | where command_line MATCHES (http(s)?://, .sct, scrobj.dll, javascript:, suspicious_parent)\n\
      \  | stats count by host, user, file_name, command_line, parent_image\n  | alert severity=high reason=\"\
      LOLBin abuse / denylist gap\""
- question: Has the execution frequency of a suspicious or denylisted binary suddenly surged above its
    established baseline?
  context: Supporting Isolate (D3-I), a sudden spike in how often a binary runs can indicate mass deployment
    of malware or a denylist that is failing to suppress it. Baseline per-process execution counts over
    a 14-day window from Windows Event ID 4688 and apply seasonal-trend decomposition (e.g., series_decompose_anomalies,
    sensitivity 1.5-3 sigma) to flag surges, following the Microsoft Sentinel Process Execution Frequency
    Anomaly analytic. Derive the per-environment threshold from observed baseline variance. A flagged
    surge of a known-bad or low-reputation binary is a strong denylist-effectiveness signal warranting
    investigation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days (14-day baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source WinEventID=4688 earliest=-14d\n  | bin _time span=1h | stats count as execs by\
      \ file_name, _time\n  | series_decompose_anomalies(execs, sensitivity=2.5)\n  | where anomaly=1\
      \ AND file_name IN suspicious_or_denylisted\n  | alert host, file_name, execs, expected"
- question: Which executables are rare across the fleet (e.g., present on <1% of hosts) and also initiate
    anomalous external network communications, making them high-risk denylist candidates?
  context: Supporting Isolate (D3-I), rare binaries that also reach out to the internet fit the profile
    of targeted malware or attacker tooling. Compute 30-day executable prevalence by host (distinct-host
    count and percentile rank) and flag binaries in extreme low-prevalence percentiles that also initiate
    external Zeek conn.log communications. Score outbound Volume (bytes sent/received) and connection
    Frequency (conns/min) to elevate rare binaries generating anomalous traffic, consistent with the learn-normal
    outlier paradigm of one-class malware detection and the byte/volume profiling of PAYL. Positive hits
    are nominated as denylist candidates.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days (30-day prevalence window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source WinEventID=4688 earliest=-30d\n  | stats dc(host) as hosts by file_name, sha256\
      \ | eval pct=percentile_rank(hosts)\n  | where pct < 1\n  | join sha256 [ Zeek conn.log | where\
      \ dst is external | stats sum(orig_bytes+resp_bytes) as vol, count/duration as freq by sha256 ]\n\
      \  | sort -vol -freq | alert reason=\"rare binary with external traffic\""
- question: Are there high-entropy or packed executables on disk whose structural statistics (section
    count, section entropy, byte histogram) indicate obfuscation designed to evade hash/name denylists?
  context: Supporting Isolate (D3-I), packing and obfuscation change a file's hash and hide its content
    from name/hash deny rules, so structural statistics catch what signatures miss. For executables observed
    on disk, compute section count, section-entropy distribution, packer indicators, and byte-entropy/byte-histogram
    features; flag high-entropy or packed binaries as candidates, using structural statistics from PE-Probe
    (Shafiq et al.) and the byte-entropy feature set of EMBER. Derive entropy thresholds from the local
    benign-binary distribution so the alert reflects what is abnormal for your environment. Flagged binaries
    should be nominated for content-based denylisting.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: EDR/Stats pseudocode
    query: ">-\n  for each PE on disk:\n    compute section_count, per_section_entropy, byte_histogram,\
      \ packer_flags\n    benign_thr = quantile(benign_entropy_dist, 0.99)\n    if max(per_section_entropy)\
      \ > benign_thr OR packer_flags:\n       nominate_candidate(file); alert host, image_path, entropy,\
      \ sections"
- question: Is denylist enforcement effectiveness degrading over time — measured by block rate, audit-without-block
    rate, and repeat-execution-after-block rate per executable family, host, and business unit?
  context: Supporting Isolate (D3-I), enforcement failure is itself a measurable signal of denylist health.
    Measure block rate (8004/3077), audit-without-block rate (8003/3076 with no subsequent block), and
    repeat-execution-after-block rate per executable family, host, and business unit over time. Alert
    on statistically significant degradation in enforcement effectiveness or recurring blocked binaries
    that keep re-launching. Event semantics follow Microsoft's AppLocker Event Viewer documentation. A
    rising audit-without-block rate signals expanding coverage gaps; persistent re-launch after block
    signals an active threat or misconfiguration.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (AppLocker 8003,8004; CodeIntegrity 3076,3077)\n  | bin _time span=1d\n  |\
      \ stats sum(blocked) as b, sum(audited_no_block) as a, sum(relaunch_after_block) as r by family,\
      \ business_unit, _time\n  | eval audit_gap_rate=a/(a+b)\n  | trend audit_gap_rate, r over _time\n\
      \  | where trend_increasing OR r>0 | alert reason=\"enforcement degradation\""
- question: Does a supervised malware classifier, scoring static-PE plus host-network features, recommend
    that a newly seen executable be denylisted — and what top features drove that decision?
  context: Supporting Isolate (D3-I), an ML classifier can proactively nominate never-before-seen binaries
    for the denylist before signatures exist. Train a supervised gradient-boosted classifier (LightGBM/XGBoost
    or Random Forest) on static-PE features (header fields, imports, sections, strings, byte-entropy histograms)
    plus process lineage, command-line, signer reputation, and network destinations, using the EMBER dataset/baseline
    and reference pipeline, the time-split SOREL-20M benchmark for concept-drift-aware retraining, and
    behavioral API-sequence features from the Mal-API-2019 evaluation. Every alert must surface the top-3
    contributing features (e.g., suspicious imports, high section entropy, signer mismatch) via SHAP/LIME
    per the XAI for Malware Analysis survey — not just a score — so an analyst can validate the recommendation
    before adding a deny rule.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = static_pe(header,imports,sections,strings,byte_entropy)\n            + lineage\
      \ + command_line + signer_reputation + net_dest\n  score = gbdt_model.predict(features)\n  if score\
      \ > deny_threshold:\n     top3 = shap_explain(model, features)[:3]\n     alert(file, score, top3_features);\
      \ nominate_for_denylist\n  # retrain on SOREL-20M time-split to handle concept drift"
- question: Do unsupervised clustering and outlier detection reveal novel high-risk executable clusters
    not represented in the current denylist policy?
  context: Supporting Isolate (D3-I), emerging threats form new clusters that existing deny rules do not
    cover. Apply unsupervised clustering and outlier detection (Isolation Forest, One-Class SVM, or autoencoders)
    to newly observed executable feature vectors and monitor cluster drift to identify novel high-risk
    clusters absent from current policy, following the unsupervised approaches evaluated in one-class
    malware detection. List the nearest known-bad cluster and the distinguishing features in each alert
    for triage. A newly emerged cluster near a known-bad family is a strong signal that the denylist needs
    a policy update.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 8002
  - Windows Event ID 8003
  - Windows Event ID 8004
  - Windows CodeIntegrity Event ID 3076
  - Windows CodeIntegrity Event ID 3077
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All enterprise endpoint devices (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = feature_vectors(new_executables)\n  outliers = IsolationForest().fit_predict(X)\
      \  # or OneClassSVM / autoencoder\n  clusters = cluster(X); drift = compare(clusters, baseline_clusters)\n\
      \  for c in new_or_drifting_high_risk_clusters:\n     nearest = nearest_known_bad_cluster(c)\n \
      \    alert(cluster=c, nearest_bad=nearest, distinguishing_features=top_feats(c))\n     recommend_policy_update"
