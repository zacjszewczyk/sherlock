name: 'D3-BA: Bootloader Authentication'
id: 9c05501c-3070-40fd-952f-6c4d1269c1da
description: Investigate whether enterprise systems' bootloaders are cryptographically authenticated and
  whether that protection is enabled, enforcing, and intact. This playbook helps an analyst confirm that
  UEFI Secure Boot is enabled and validating the bootloader at startup, track coverage gaps (disabled,
  unsupported, or setup-mode devices) as the primary risk signal, and verify Secure Boot variables (PK/KEK/db/dbx)
  and SPI write-protection against a golden baseline. It guides review of boot-time signature/integrity
  validation failures (Secure Boot and Code Integrity/AppControl events) that show the mechanism actively
  blocked unauthorized code, out-of-band measured-boot/TPM attestation against golden PCR values independent
  of a potentially compromised host OS, and host telemetry revealing active attempts to bypass or disable
  bootloader authentication (BlackLotus-class Secure Boot bypass, bootkit installation, EFI System Partition
  writes, boot-binary downgrade, MOK enrollment, low-level flash-access driver loads, or bcdedit policy
  tampering). Detection approaches span symbolic-logic configuration and event checks, statistical profiling
  of compliance and failure rates (proportions, change-point, CUSUM, peer comparison, new-edge), and machine-learning
  models for ranking, sequence anomaly detection, clustering, and provenance-graph tracing.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Across every workstation and server, what is each endpoint's Secure Boot configuration state
    (enabled, disabled, unsupported, or setup mode), and which devices are not enabled-and-enforcing?
  context: 'Bootloader Authentication only protects boot if UEFI Secure Boot is enabled and enforcing.
    Query Windows Event ID 30 (Microsoft-Windows-SecureBoot-Config) and system inventory (e.g., Confirm-SecureBootUEFI)
    to classify every endpoint. Treat any state other than enabled-and-enforcing as non-compliant per
    the signed-boot mandate of NIST SP 800-193 and the authenticated-update baseline of NIST SP 800-147.
    Non-compliant hosts have an unprotected boot chain that could load a tampered bootloader. Produce
    an asset list of non-compliant devices with last-seen timestamps for remediation. This is the core
    Harden-tactic preventive check. Authoritative references: [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf),
    [NIST SP 800-147](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf).'
  answer_sources:
  - Windows Event ID 30 (Microsoft-Windows-SecureBoot-Config)
  - System Inventory Scans
  - CHIPSEC platform assessment output (Secure Boot variables PK/KEK/db/dbx, BIOS write-protection)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each host in inventory:\n  state = parse(SecureBoot-Config EventID=30) or Confirm-SecureBootUEFI\n\
      \  if state != 'enabled_enforcing':\n    emit noncompliant(host, state, last_seen)"
  - technology: PowerShell/pseudocode
    query: 'Confirm-SecureBootUEFI  # True=enabled; error=unsupported/setup

      # join with Get-WinEvent -LogName Microsoft-Windows-SecureBoot-Config/Operational'
- question: Do each platform's Secure Boot variables (PK, KEK, db, dbx) and SPI flash write-protection
    match the authorized enterprise golden baseline, or has the boot root-of-trust been weakened?
  context: 'Even when Secure Boot is ''enabled'', an attacker-enrolled key, stale dbx revocation list,
    or unlocked flash can defeat it. Use CHIPSEC to confirm the platform key (PK), KEK, db, and dbx match
    the authorized baseline and that BIOS_CNTL write-protection (BLE/SMM_BWP) is set. Alert on any unexpected/attacker-enrolled
    key, an out-of-date dbx, or unlocked flash, which indicate the bootloader-authentication root of trust
    has been weakened. This is a first-party check requiring no external API. A mismatch is high-confidence
    evidence of tampering or misconfiguration that must be remediated under Harden. Tooling reference:
    [CHIPSEC](https://github.com/chipsec/chipsec).'
  answer_sources:
  - Windows Event ID 30 (Microsoft-Windows-SecureBoot-Config)
  - System Inventory Scans
  - CHIPSEC platform assessment output (Secure Boot variables PK/KEK/db/dbx, BIOS write-protection)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: CHIPSEC/pseudocode
    query: "chipsec_main -m common.secureboot.variables\nchipsec_main -m common.bios_wp\nfor var in [PK,KEK,db,dbx]:\n\
      \  if hash(var) != golden[var]: alert('secureboot var drift', host, var)\nif not (BLE and SMM_BWP):\
      \ alert('SPI flash unlocked', host)"
- question: Which organizational units, OS builds, or hardware models form low-compliance clusters for
    Secure Boot enablement, and has the enterprise-wide enablement rate dropped suddenly?
  context: 'Calculate Secure Boot enablement proportions by organizational unit, OS build, and hardware
    model; flag cohorts in the bottom 10th percentile and count high-value assets within them. Because
    boot configuration is rare and predictable, specification/proportion rules yield very low false positives.
    Apply change-point detection to the enablement-rate time series so a sudden enterprise-wide drop is
    alerted distinctly from baseline. Under Harden, this prioritizes remediation toward the weakest cohorts
    and catches systemic regressions (e.g., a bad GPO or image rollout) early. Because boot configuration
    is rare and predictable, specification/proportion rules yield very low false positives ([Mitchell
    & Chen CPS IDS survey](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf)). Change-point reference:
    [change-point detection survey (Aminikhanghahi & Cook)](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 30 (Microsoft-Windows-SecureBoot-Config)
  - System Inventory Scans
  - CHIPSEC platform assessment output (Secure Boot variables PK/KEK/db/dbx, BIOS write-protection)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'group endpoints by OU, os_build, hw_model

      rate = enabled_count / total

      flag cohorts where rate <= p10

      count high_value_assets in flagged cohorts

      changepoint(daily enterprise enablement_rate) -> alert on level shift'
- question: Is there a low-and-slow erosion of Secure Boot compliance over time that a fixed daily threshold
    would miss?
  context: 'Run a stateful CUSUM control chart over the daily count/proportion of newly-disabled or setup-mode
    endpoints so a low-and-slow rollback campaign accumulates into an alert instead of hiding under a
    fixed daily threshold. Set the CUSUM reference value to the trailing 30-day mean and the decision
    interval to ~4-5 sigma; tune per environment. A persistent small drip of newly non-compliant hosts
    can indicate a methodical adversary or a creeping misconfiguration; CUSUM accumulates these deviations
    so they surface before the fleet is broadly exposed. Method reference: [stateful CUSUM detection (Urbina
    et al.)](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf).'
  answer_sources:
  - Windows Event ID 30 (Microsoft-Windows-SecureBoot-Config)
  - System Inventory Scans
  - CHIPSEC platform assessment output (Secure Boot variables PK/KEK/db/dbx, BIOS write-protection)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'mu = mean(daily_new_noncompliant, trailing 30d)

      S = max(0, S_prev + (today - mu - k))

      if S > h (~4-5 sigma): alert(''slow compliance erosion'')'
- question: Which currently non-compliant or at-risk endpoints are most likely to have Secure Boot disabled,
    and what features drive that prediction?
  context: 'Train a classifier (logistic regression or gradient boosting) on inventory features (hardware
    age, model, OS build, patch recency, last firmware-update date) to rank endpoints by likelihood of
    Secure Boot being disabled, prioritizing proactive validation. Surface the top-3 contributing features
    in each alert (LIME/SHAP attribution) so analysts see WHY a device is flagged, not just a score. Under
    Harden this enables proactive validation of the riskiest hosts before they are exploited, and the
    feature attribution makes the prioritization defensible and actionable. Feature-attribution reference:
    [Isolation Forest + OCSVM with LIME (Scientific Reports 2025)](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Windows Event ID 30 (Microsoft-Windows-SecureBoot-Config)
  - System Inventory Scans
  - CHIPSEC platform assessment output (Secure Boot variables PK/KEK/db/dbx, BIOS write-protection)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features[hw_age, model, os_build, patch_recency, last_fw_update]

      model = GradientBoosting().fit(X_train, y=secureboot_disabled)

      score = model.predict_proba(X)

      rank desc; attach SHAP top-3 features per host'
- question: Have any endpoints logged a Secure Boot or Code Integrity/AppControl validation failure indicating
    the boot-path rejected unsigned, revoked, or tampered code?
  context: 'These first-party events are direct evidence that bootloader authentication actively blocked
    unauthorized code. Trigger on Windows Event ID 59 (Microsoft-Windows-Kernel-Boot) for boot-start drivers/bootloaders
    blocked by Secure Boot policy, and on Windows Code Integrity/AppControl events (3004/3033 failed signature
    validation, 3010 revoked, 3023/3077 blocked driver/policy) for unsigned or revoked boot-path code.
    Correlate with recent software/driver/firmware changes from inventory. A failure can mean the protection
    worked against an attack, or that a legitimate change was incorrectly signed; correlation distinguishes
    the two and is essential triage under Harden. Event reference: [Windows Code Integrity/AppControl
    events](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/operations/event-id-explanations).'
  answer_sources:
  - Windows Event ID 59 (Microsoft-Windows-Kernel-Boot)
  - Windows Event Log (System) - Event ID 1001 from BugCheck
  - Windows CodeIntegrity/AppControl events (3004/3033/3010/3023/3077)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert if EventID=59 (Kernel-Boot, blocked boot-start driver/bootloader)\n  OR CodeIntegrity\
      \ EventID in [3004,3033,3010,3023,3077]\nenrich with recent sw/driver/fw change from inventory window\
      \ +/- 24h"
- question: What are the per-host and fleet-wide boot-failure rates, and does any host or model deviate
    from its established baseline?
  context: Track per-host and fleet-wide failure rates (Event 59, BugCheck 1001, Code Integrity blocks)
    separately from successful boots. A rising failure ratio on a single host suggests repeated tamper-and-reboot
    attempts; a synchronized fleet-wide rise suggests a bad deployment or coordinated attack. Establish
    a per-model baseline failure rate and alert on deviation. Profiling failures as a distinct signal
    (not lumped with successes) keeps the tamper indicator from being diluted by normal boot volume.
  answer_sources:
  - Windows Event ID 59 (Microsoft-Windows-Kernel-Boot)
  - Windows Event Log (System) - Event ID 1001 from BugCheck
  - Windows CodeIntegrity/AppControl events (3004/3033/3010/3023/3077)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for host: fail_ratio = boot_failures / total_boots

      baseline = per_model mean+std

      alert if host fail_ratio > baseline + n*std

      alert if synchronized fleet-wide rise across many hosts'
- question: Is there an enterprise-wide spike or gradual increase in boot validation failures by hardware
    model or OS build that is not explained by a patch cycle?
  context: 'Track daily counts of Event ID 59 by hardware model and OS build and alert on spikes above
    historical control limits / change points, using stateful CUSUM to also catch gradual increases. Separate
    spikes correlated with a patch cycle (benign) from those that are not. A coordinated, patch-unrelated
    rise in boot failures across a model/build cohort can indicate a fleet-targeting bootkit or rollback
    campaign; correlating with the patch calendar suppresses benign deployment noise under Harden. Method
    references: [change-point detection survey (Aminikhanghahi & Cook)](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/),
    [stateful CUSUM detection (Urbina et al.)](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf).'
  answer_sources:
  - Windows Event ID 59 (Microsoft-Windows-Kernel-Boot)
  - Windows Event Log (System) - Event ID 1001 from BugCheck
  - Windows CodeIntegrity/AppControl events (3004/3033/3010/3023/3077)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = daily_count(EventID=59) by (hw_model, os_build)

      changepoint(series) and CUSUM(series) -> alert

      suppress if window overlaps known patch_cycle'
- question: Does the ordered sequence of boot and integrity log events on a host deviate from the normal
    boot sequence in a way consistent with tampering?
  context: 'Train an LSTM on the normal ordering of boot/Secure-Boot/Code-Integrity/start-up log keys
    (e.g., Kernel-Boot, CodeIntegrity, Event 41/1074/6006) per DeepLog log-sequence anomaly detection
    and alert when a tamper chain produces an out-of-distribution sequence; the model surfaces the offending
    predicted-vs-observed log key as explainable evidence. Sequence anomalies catch novel tamper chains
    that individual event rules miss, while the predicted-vs-observed key gives the analyst concrete evidence
    for triage under Harden. Method reference: [DeepLog log-sequence anomaly detection](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Windows Event ID 59 (Microsoft-Windows-Kernel-Boot)
  - Windows Event Log (System) - Event ID 1001 from BugCheck
  - Windows CodeIntegrity/AppControl events (3004/3033/3010/3023/3077)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered boot log keys per host per boot

      model = LSTM(DeepLog).fit(normal_seq)

      if observed_key not in topK predicted: alert(host, predicted_vs_observed)'
- question: When multiple systems experience boot failures, do they cluster around a common root cause
    such as a shared model, OS build, update ID, or failing driver hash?
  context: 'Apply unsupervised clustering/isolation (Isolation Forest) to affected systems using features
    such as hardware model, OS build, recent update IDs, and failing driver hash to group failures and
    isolate common root causes; report the dominant features per cluster for triage. Clustering distinguishes
    a benign bad-driver/bad-update rollout (one tight cluster on an update ID) from a targeted attack
    pattern, accelerating root-cause analysis under Harden. Method reference: [Isolation Forest (Liu et
    al.)](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 59 (Microsoft-Windows-Kernel-Boot)
  - Windows Event Log (System) - Event ID 1001 from BugCheck
  - Windows CodeIntegrity/AppControl events (3004/3033/3010/3023/3077)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features[hw_model, os_build, recent_update_ids, failing_driver_hash]

      clusters = cluster(X); outliers = IsolationForest(X)

      report dominant features per cluster'
- question: Do each TPM-capable endpoint's measured-boot PCR values for the bootloader and pre-OS components
    match the authorized golden measurement list?
  context: 'Because the host OS cannot be trusted once the boot chain is compromised, verification must
    be out-of-band. Verify that TPM PCR measurements of the bootloader and pre-OS components match the
    authorized golden measurement list per the Root-of-Trust-for-Detection model of NIST SP 800-193 using
    TCG measured boot (IMA). Any PCR/measurement mismatch is a deterministic indicator of unauthorized
    bootloader modification. Where stronger assurance is required, corroborate with out-of-band coprocessor
    attestation since host self-reports are untrustworthy after boot-chain compromise. A mismatch is a
    high-confidence tamper signal demanding investigation. References: [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf),
    [TCG-based measured boot (IMA, Sailer et al.)](https://www.usenix.org/legacy/event/sec04/tech/full_papers/sailer/sailer.pdf),
    [out-of-band coprocessor attestation (Copilot, Petroni et al.)](https://www.usenix.org/legacy/event/sec04/tech/full_papers/petroni/petroni.pdf).'
  answer_sources:
  - TPM PCR measurements / Windows TPM/Measured Boot logs (TBS)
  - Remote attestation service / verifier records
  - CHIPSEC SPI flash and golden-image comparison output
  - 'NAI: All enterprise endpoints with a TPM/attestation-capable platform'
  range: Last 90 days
  queries:
  - technology: Attestation/pseudocode
    query: "for host: pcr = read_TPM_PCR(bootloader, preos)\nif pcr != golden_measurement_list[host_model]:\n\
      \  alert('boot measurement mismatch', host)\ncorroborate via out-of-band verifier record"
- question: Does the SPI flash and bootloader/EFI image on each host match the per-model known-good golden
    image, with no deviation, unsigned region, or rollback to an older signed image?
  context: 'Periodically dump and hash SPI flash and the bootloader/EFI image with CHIPSEC and diff against
    the per-model golden image; alert on any deviation, unsigned region, or rollback to an older signed
    image, consistent with NIST SP 800-147 authenticated-update requirements. This catches firmware-implant
    and rollback attacks even when Secure Boot reports healthy, directly supporting the Harden objective
    of an authenticated, current boot chain. References: [CHIPSEC](https://github.com/chipsec/chipsec),
    [NIST SP 800-147](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-147.pdf).'
  answer_sources:
  - TPM PCR measurements / Windows TPM/Measured Boot logs (TBS)
  - Remote attestation service / verifier records
  - CHIPSEC SPI flash and golden-image comparison output
  - 'NAI: All enterprise endpoints with a TPM/attestation-capable platform'
  range: Last 90 days
  queries:
  - technology: CHIPSEC/pseudocode
    query: "dump = chipsec spi/efi image; h = hash(dump)\nif h != golden_image[host_model]:\n  alert('firmware/boot\
      \ image drift', host)\nflag unsigned regions or version < golden (rollback)"
- question: Within a homogeneous hardware/OS-image fleet, does any single unit diverge from its identical
    peers in attestation measurements or boot-event distribution?
  context: 'Across a homogeneous hardware/OS-image fleet, compare each unit''s attestation measurements
    and boot-event distribution to its identical peers and flag divergent units without requiring a trained
    model (ReplicaWatcher training-less fleet anomaly detection). On an identical image, exactly one host
    showing a different PCR/measurement profile is a high-confidence tamper signal. This peer-comparison
    approach needs no labeled data and is robust for Harden because identical images should produce identical
    measurements. Method reference: [ReplicaWatcher training-less fleet anomaly detection](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf).'
  answer_sources:
  - TPM PCR measurements / Windows TPM/Measured Boot logs (TBS)
  - Remote attestation service / verifier records
  - CHIPSEC SPI flash and golden-image comparison output
  - 'NAI: All enterprise endpoints with a TPM/attestation-capable platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'group hosts by (hw_model, os_image)

      for group: mode_profile = majority(pcr/measurement profile)

      flag units whose profile != mode_profile'
- question: Which endpoints exhibit rare or anomalous attestation feature vectors (unusual PCR deltas,
    measurement-list length, unknown component hashes, or time-to-attest)?
  context: 'Feed attestation feature vectors (PCR deltas, measurement-list length, new/unknown component
    hashes, time-to-attest) to an unsupervised detector (Isolation Forest; OCSVM with LIME attribution)
    to isolate rare measurement profiles, reporting the top contributing features per alert. This surfaces
    subtle, novel boot-chain anomalies that exact golden-value matching might not characterize, with feature
    attribution so the analyst understands why a host is rare under Harden. Method references: [Isolation
    Forest (Liu et al.)](https://doi.org/10.1145/2133360.2133363), [Isolation Forest + OCSVM with LIME
    (Scientific Reports 2025)](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - TPM PCR measurements / Windows TPM/Measured Boot logs (TBS)
  - Remote attestation service / verifier records
  - CHIPSEC SPI flash and golden-image comparison output
  - 'NAI: All enterprise endpoints with a TPM/attestation-capable platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = [pcr_deltas, measurement_list_len, unknown_component_hashes, time_to_attest]

      scores = IsolationForest(X)  # or OCSVM

      alert rare profiles; attach LIME top features'
- question: Are there writes to the EFI System Partition or replacements of bootmgfw.efi/bootmgr with
    an older version or known-vulnerable-but-signed hash, along with unexpected dbx/MOK changes?
  context: 'These are the concrete observables of BlackLotus-class Secure Boot bypass. Alert on writes
    to the EFI System Partition and on bootmgfw.efi/bootmgr being replaced with an older version or a
    known-vulnerable-but-signed hash, plus unexpected dbx/MOK changes. Maintain an allowlist of legitimate
    boot binaries per OS build and a watchlist of revoked/old hashes. A positive detection is a strong
    indicator of an in-progress bootkit installation that defeats bootloader authentication via downgrade,
    and demands immediate response. Reference: [BlackLotus UEFI bootkit](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/).'
  answer_sources:
  - Sysmon Event ID 1 (process creation) / Windows Event ID 4688
  - Sysmon Event ID 11 (file create) on the EFI System Partition / bootmgfw.efi / bootmgr
  - Sysmon Event ID 6 (driver load) / Windows CodeIntegrity events
  - Network flow / proxy logs (early-boot or pre-logon egress)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert if Sysmon EventID=11 file_write on ESP (bootmgfw.efi|bootmgr)

      and (new_hash in revoked_or_old_watchlist or new_hash not in allowlist[os_build])

      alert on unexpected dbx/MOK enrollment changes'
  - technology: Sysmon/pseudocode
    query: EventID=11 TargetFilename contains '\\EFI\\' or 'bootmgfw.efi' or 'bootmgr'
- question: Is bcdedit (or similar) being used to weaken boot integrity, or are known low-level SPI/flash-access
    drivers being loaded that precede reflashing?
  context: 'Detect bcdedit.exe weakening boot integrity (/set nointegritychecks on, /set testsigning on,
    bootstatuspolicy ignoreallfailures, recoveryenabled no) using the bcdedit boot-tampering Sigma rule,
    and alert on loads of known low-level SPI/flash-access drivers (e.g., RwDrv.sys) that precede reflashing,
    as in the LoJax UEFI rootkit tooling chain, via Sysmon Event 6 and Windows Code Integrity/AppControl
    events. These commands and drivers are precursors to disabling signature enforcement or reflashing
    firmware, so detecting them gives early warning before the boot chain is subverted under Harden. References:
    [bcdedit boot-tampering Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml),
    [LoJax UEFI rootkit](https://www.welivesecurity.com/2018/09/27/lojax-first-uefi-rootkit-found-wild-courtesy-sednit-group/),
    [Windows Code Integrity/AppControl events](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/operations/event-id-explanations).'
  answer_sources:
  - Sysmon Event ID 1 (process creation) / Windows Event ID 4688
  - Sysmon Event ID 11 (file create) on the EFI System Partition / bootmgfw.efi / bootmgr
  - Sysmon Event ID 6 (driver load) / Windows CodeIntegrity events
  - Network flow / proxy logs (early-boot or pre-logon egress)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "alert if proc=bcdedit.exe and cmdline matches\n  (nointegritychecks on|testsigning on|bootstatuspolicy\
      \ ignoreallfailures|recoveryenabled no)\nalert if Sysmon EventID=6 driver_load in known_flash_access_drivers\
      \ (e.g., RwDrv.sys)"
- question: Are there novel early-boot or pre-logon outbound network connections (or failed connection
    attempts) that have never been seen from a host before?
  context: 'Score first-time host-to-host or host-to-external edges originating before user logon with
    a Bayesian new-edge model; a never-before-seen early-boot beacon (e.g., the BlackLotus HTTP downloader)
    is high-signal with far fewer false positives than a naive allowlist diff. Profile blocked/failed
    connection attempts (failure mode) as a distinct signal. Legitimate pre-logon egress is limited and
    predictable, so a brand-new early-boot edge strongly suggests bootkit command-and-control or payload
    retrieval under Harden. Method reference: [Bayesian new-edge detection (Metelli & Heard)](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).'
  answer_sources:
  - Sysmon Event ID 1 (process creation) / Windows Event ID 4688
  - Sysmon Event ID 11 (file create) on the EFI System Partition / bootmgfw.efi / bootmgr
  - Sysmon Event ID 6 (driver load) / Windows CodeIntegrity events
  - Network flow / proxy logs (early-boot or pre-logon egress)
  - 'NAI: All enterprise endpoints (workstations and servers)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'filter conn where ts < user_logon_time(host)

      edge = (src_host, dst)

      if edge never seen before: bayes_newedge_score(edge) -> alert

      profile blocked/failed pre-logon attempts separately'
- question: Which specific process on a host wrote to the EFI System Partition, loaded a raw flash-access
    driver, or invoked bcdedit/firmware tools, and what is its lineage?
  context: 'Run a provenance-graph GNN (ThreaTrace) over Sysmon process/file/driver events to flag, at
    node level, the specific process that writes the ESP, loads a raw flash-access driver, or invokes
    bcdedit/firmware tools, surfacing the deviating entity and its lineage for triage. Node-level provenance
    pinpoints the offending process and its ancestry/descendants, letting an analyst reconstruct the full
