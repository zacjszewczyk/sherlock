questions:
- question: Does the current live Active Directory trust configuration exactly match the approved golden
    baseline allowlist, and is there any unapproved trust, removed trust, or parameter drift (trust type,
    direction, transitivity, SID-filtering/quarantine state, or SIDHistory exposure)?
  context: 'An authoritative, tiered baseline of approved trusts is the ground truth for what inter-domain
    trust should exist. Enumerate live trusts (nltest /domain_trusts, Get-ADTrust) and reconcile trust-change
    events (Event IDs 4706/4707/4716) against the golden allowlist, which records each trust''s type,
    direction, transitivity, SID-filter/quarantine state, and SIDHistory exposure. Any deviation is a
    deterministic finding: a new trust the allowlist does not contain, a trust that was silently removed,
    or a changed parameter (e.g., a one-way trust flipped to bidirectional). In the Isolate tactic context
    this confirms the trust surface is constrained to exactly what was approved; drift indicates either
    unmanaged change or adversary tampering to open a cross-domain path. A positive (drift) result should
    trigger reconciliation against the change-management record and, if unexplained, treatment as a potential
    compromise of a domain controller or privileged account.'
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      LET baseline = approved_trust_allowlist(trust_name, type, direction, transitive, sid_filter, sidhistory)
      LET live = enumerate_trusts()  // Get-ADTrust / nltest /domain_trusts + EventID(4706,4707,4716)
      FOR each t IN (live UNION baseline):
        IF t NOT IN baseline -> ALERT 'unapproved trust'
        ELSE IF t NOT IN live -> ALERT 'approved trust removed'
        ELSE IF any_param(live[t]) != baseline[t] -> ALERT 'trust parameter drift', diff(params)
- question: For every external and forest trust, is SID filtering (SID filter quarantining) enabled, the
    quarantine flag set, and are there any principals carrying foreign SIDHistory across the trust boundary?
  context: 'SID filtering and quarantining strip foreign SIDs (including injected SIDHistory) from authentication
    requests crossing an external or forest trust. When SID filtering is disabled, the quarantine flag
    is cleared, or a principal carries foreign SIDHistory, an attacker in the trusted domain can forge
    or inherit SIDs of high-privilege groups in the trusting domain, achieving cross-domain privilege
    escalation. Assert these protections for each external/forest trust and alert deterministically on
    any violation. For the Isolate tactic this is a core boundary-hardening check: SID filtering is what
    makes the trust boundary actually isolating. A positive finding (filtering off or SIDHistory present)
    is a direct, high-severity escalation primitive that should be remediated immediately and investigated
    for prior abuse.'
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each trust WHERE type IN ('external','forest'):
        IF sid_filtering_enabled == FALSE -> ALERT 'SID filtering disabled', trust
        IF quarantine_flag == FALSE -> ALERT 'quarantine cleared', trust
        IF EXISTS principal WHERE foreign_sidHistory(principal) crosses trust -> ALERT 'foreign SIDHistory', principal, trust
- question: Are there any dangerous trust attributes present right now — unexpected bidirectional trusts,
    transitive trust expansion into sensitive/Tier-0 forests, trust-change events outside approved change
    windows, or trust-account password resets — and which of these are reachable abuse primitives?
  context: 'Some trust configurations are inherently dangerous: a bidirectional trust where only one-way
    was needed, transitive trust that reaches into a Tier-0/sensitive forest, trust modification events
    (4706/4707/4716) occurring outside an approved change window, or a reset of a trust-account password
    (which can precede trust-key abuse). Apply explicit rules to detect these attributes and prioritize
    trusts that attack-path analysis (e.g., BloodHound) exposes as reachable primitives such as foreign
    group membership or cross-trust unconstrained delegation. In the Isolate tactic this surfaces the
    trusts that most undermine isolation. A match is a high-priority finding; off-window changes or password
    resets in particular warrant immediate correlation with the responsible admin and change record.'
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each trust:
        IF direction == 'bidirectional' AND approved_direction != 'bidirectional' -> ALERT 'unexpected bidirectional'
        IF transitive == TRUE AND reaches(trust, tier0_forest) -> ALERT 'transitive into Tier-0'
      EventID IN (4706,4707,4716) AND event_time NOT IN approved_change_window -> ALERT 'off-window trust change'
      trust_account_password_reset -> ALERT 'trust account password reset'
      JOIN bloodhound_paths -> prioritize trusts on abuse paths (foreign group membership, unconstrained delegation)
- question: When trusts, delegation, and ACL relationships are modeled as a reachability graph, do any
    trust edges lie on a path to Domain Admin / Tier-0, and which trust edges have the highest betweenness
    (leverage) along those paths?
  context: 'Individual trusts may look benign in isolation but become dangerous as edges in a larger attack
    graph that combines trusts, delegation, and ACL relationships. Build the reachability graph and deterministically
    flag any trust edge that lies on a path to Domain Admin or a Tier-0 asset. Rank edges by betweenness
    centrality so the highest-leverage trusts — those many attack paths traverse — are hardened or removed
    first. For the Isolate tactic this turns isolation into a prioritization exercise: removing or constraining
    a high-betweenness trust collapses many potential attack paths at once. A finding here identifies
    the specific trust relationships whose removal yields the greatest reduction in cross-domain reachability.'
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Graph analytics/pseudocode
    query: |-
      G = build_graph(nodes=principals+hosts+domains, edges=trusts+delegation+ACLs)
      targets = {DomainAdmins, Tier0_assets}
      FOR each trust_edge e IN G:
        IF exists_path(e -> any target) -> FLAG e
      RANK flagged edges BY edge_betweenness(G) DESC  // harden/remove highest-leverage first
- question: Is the daily/weekly volume of trust-change events (Event IDs 4706, 4707, 4716) abnormally
    high relative to the 90-day baseline, or is there an abrupt regime shift in change frequency?
  context: Trust modifications should be rare and tied to deliberate change activity. Build a 90-day baseline
    of 4706/4707/4716 frequency (changes per day and per week) and alert when counts exceed mean plus
    two standard deviations — the deterministic floor. Layer change-point detection (PELT or binary segmentation)
    to catch abrupt shifts in the change-frequency regime that a static threshold would miss. In the Isolate
    tactic a spike or regime change in trust modifications can indicate bulk tampering with the trust
    surface (e.g., scripted creation or weakening of trusts). A positive result should be triaged against
    authorized change windows; unexplained bursts point to compromise of trust-administering accounts.
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      counts = timeseries(EventID IN (4706,4707,4716)) bucket=1d over 90d
      mu = mean(counts); sd = stddev(counts)
      ALERT WHERE today_count > mu + 2*sd
      cp = changepoint_detect(counts, method='PELT')  // ruptures
      ALERT WHERE changepoint_recent(cp)
- question: For each trust, has cross-realm Kerberos authentication volume (TGS/TGT per hour) or the breadth
    of distinct destination hosts reached across the trust suddenly spiked above the per-trust baseline
    (mean plus three standard deviations)?
  context: Legitimate cross-trust authentication tends to follow a stable per-trust pattern in both volume
    and breadth. Baseline Kerberos cross-realm volume (TGS/TGT count per hour) and the number of distinct
    destination hosts reached across each trust from Event IDs 4768/4769 and Zeek kerberos.log, then alert
    on sudden fan-out or volume spikes above mean plus three standard deviations. A sudden increase in
    breadth (one account reaching many new hosts across the trust) is a classic lateral-movement signature;
    a volume spike can indicate automated abuse. For the Isolate tactic this measures whether a trust
    is being used far beyond its normal scope. Positive results identify the specific trust, source account,
    and destination set to investigate for lateral movement across the trust boundary.
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each trust:
        vol = count(EventID IN (4768,4769) cross_realm) per 1h
        breadth = distinct(dest_host) per window
        ALERT WHERE vol > mean(vol)+3*stddev(vol) OR breadth > mean(breadth)+3*stddev(breadth)
  - technology: Zeek/pseudocode
    query: |-
      kerberos.log | where cross_realm | summarize tgt_tgs=count(), hosts=dcount(service_host) by trust, bin(ts,1h)
      | where tgt_tgs > baseline_mean+3*baseline_sd or hosts > breadth_mean+3*breadth_sd
- question: Has the per-trust ratio of failed to successful cross-trust authentications risen above baseline
    (mean plus three standard deviations), indicating credential probing or SID-filtering rejections at
    the trust boundary?
  context: Authentication failures carry signal that raw volume hides. Track failed cross-trust logons
    and Kerberos errors as a distinct State signal — Event ID 4625 status/sub-status and 4768/4769 failure
    codes such as KDC_ERR_S_PRINCIPAL_UNKNOWN or PREAUTH failures — and baseline the per-trust failure-to-success
    ratio. Alert when the ratio exceeds mean plus three standard deviations. A rising failure ratio at
    a trust boundary surfaces credential probing, password spraying, or rejections caused by SID filtering
    blocking forged SIDs. In the Isolate tactic this reveals adversary attempts to traverse a trust that
    volume metrics alone would miss. Positive results pinpoint the trust and the failing principals for
    deeper credential-abuse investigation.
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      FOR each trust:
        fails = count(EventID 4625 status/substatus cross_trust) + count(4768/4769 err IN (KDC_ERR_S_PRINCIPAL_UNKNOWN,PREAUTH))
        succ  = count(successful cross_trust auth)
        ratio = fails / max(succ,1)
        ALERT WHERE ratio > mean(ratio)+3*stddev(ratio)
- question: Which configured trusts show zero or near-zero cross-realm Kerberos authentication usage over
    the last 90 days, marking them as stale candidates for isolation or removal?
  context: Every trust that exists but is never used is pure attack surface with no operational benefit.
    Correlate the Active Directory trust inventory with actual cross-realm Kerberos activity in Zeek kerberos.log
    and Event IDs 4768/4769 to find trusts with zero or near-zero usage across 90 days (a volume-of-zero
    signal). Prioritize these unused trusts for isolation or removal. For the Isolate tactic this directly
    shrinks the trust surface by eliminating relationships that provide no value but still enable cross-domain
    reachability. A positive result is a list of stale trusts to validate with their owners and decommission,
    reducing the paths an attacker could exploit.
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      inventory = enumerate_trusts()
      usage = summarize count() by trust FROM (EventID(4768,4769) cross_realm) over 90d
      FOR each trust IN inventory:
        IF usage[trust] == 0 OR usage[trust] ~= 0 -> FLAG 'stale trust', prioritize for removal
  - technology: Zeek/pseudocode
    query: |-
      kerberos.log | where cross_realm | summarize uses=count() by trust
      | join kind=rightanti (trust_inventory) on trust  // trusts with no kerberos usage
- question: Do actual daily/weekly trust-change counts (Event IDs 4706/4707/4716) fall outside the prediction
    intervals of a time-series model trained on historical trust-change activity?
  context: Static thresholds miss seasonality and trend in change activity. Train a time-series model
    on historical trust-change counts (4706/4707/4716) to predict expected daily/weekly activity and trigger
    an alert when actual values fall outside the model's prediction intervals; change-point segmentation
    provides the backbone for handling regime changes. The alert text must name the offending event types
    and the magnitude of deviation so analysts can act. For the Isolate tactic this catches subtle, drifting
    trust tampering that a fixed mean+2-sigma rule would not flag. A positive result means trust-modification
    activity is statistically unexpected and should be reconciled against authorized change.
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = fit_timeseries(history(EventID IN (4706,4707,4716)) daily/weekly)
      pred, lo, hi = model.forecast()
      ALERT WHERE actual < lo OR actual > hi
        WITH message = format(event_types, deviation=actual-pred)
- question: Within an authentication graph built from Event IDs 4624/4768/4769, are there first-time or
    improbable cross-trust account-to-host edges that unsupervised graph learning scores as highly novel?
  context: Cross-trust lateral movement often manifests as new, improbable account-to-host relationships.
    Build an authentication graph from Event IDs 4624/4768/4769 and score first-time or improbable cross-trust
    edges with unsupervised graph learning — combining rare-edge link prediction, scalable temporal link
    prediction, and causal-path rarity scoring. Emit a per-edge explanation (source account, destination
    host, novelty score) so analysts see exactly why a cross-trust path was flagged. For the Isolate tactic
    this detects an adversary using a trust to reach hosts they have never legitimately reached. A positive
    result identifies the specific anomalous cross-trust edge to investigate as potential lateral movement.
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      edges = build_auth_graph(EventID IN (4624,4768,4769))
      scores = unsupervised_link_predict(edges)  // rare-edge + temporal(Euler) + causal-rarity(Hopper)
      FOR each cross_trust edge e:
        IF first_seen(e) OR scores[e] > novelty_threshold -> ALERT e WITH (src, dst, novelty_score)
- question: When each trust is described by a feature vector (directionality, transitivity, SID-filtering
    state, change-event counts, Kerberos utilization, off-hours and failure rates), which trusts are outliers
    with elevated abuse potential, and what features drive that score?
  context: Risk emerges from the combination of many trust attributes, not any single one. Build a feature
    vector per trust capturing directionality, transitivity, SID-filtering state, change-event counts,
    Kerberos utilization, off-hours activity, and failure rates, then apply an Extended Isolation Forest
    to score outlier trusts with elevated abuse potential. Surface the top-three contributing features
    (e.g., SID-filtering disabled, zero utilization, off-hours change burst) in the alert rather than
    only the anomaly score, and prioritize outliers for hardening. For the Isolate tactic this ranks the
    trust surface by holistic risk so remediation effort targets the most dangerous relationships first.
    A positive result is a prioritized list of high-risk trusts with explanations to guide hardening or
    removal.
  answer_sources:
  - Windows Event ID 4706
  - Windows Event ID 4707
  - Windows Event ID 4716
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = per_trust_vector(direction, transitive, sid_filter, change_counts, kerberos_util, offhours_rate, failure_rate)
      model = ExtendedIsolationForest().fit(features)
      scores = model.score(features)
      FOR each trust IN top_outliers(scores):
        ALERT trust WITH anomaly_score, top3_contributing_features
