name: 'D3-DTP: Domain Trust Policy'
id: f0662b21-a290-424b-b512-8a6d4a09782a
description: 'This playbook helps an analyst assess and defend the organization''s inter-domain trust
  posture (D3FEND Domain Trust Policy). It guides an investigation into every Active Directory domain
  and forest trust relationship: building an authoritative trust inventory, validating trust type, direction,
  transitivity, SID-filtering/quarantine state, and SIDHistory exposure against an approved baseline,
  and surfacing anomalous trust modifications or underused trusts that expand the attack surface for cross-domain
  abuse. It combines deterministic baseline diffing and high-risk-configuration rules with statistical
  baselining of trust-change volume and cross-trust Kerberos authentication (volume, breadth, failure
  ratios, and stale/unused trusts), plus machine-learning forecasting, graph-based anomalous-edge scoring,
  and outlier clustering of trusts by risk profile. The goal is to detect cross-domain privilege escalation
  primitives (disabled SID filtering, foreign SIDHistory, unconstrained delegation, foreign group membership),
  trust tampering by a sophisticated adversary, and trust edges that lie on attack paths to Domain Admin
  / Tier-0 so they can be hardened or removed.'
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
