name: 'D3-RIC: Reissue Credential'
id: 3b89a8ed-5364-4708-ade2-17eaa6a0af1d
description: Investigate the effectiveness and integrity of incident-driven credential reissue (password
  reset/credential rotation) for compromised accounts. This playbook helps an analyst confirm that a reset
  was actually executed against the incident ticket within SLA, that the previous secret and all derived
  sessions/OAuth refresh tokens/Kerberos tickets were effectively invalidated (including the dual krbtgt
  rotation for domain-wide compromise), that the new credential successfully restored legitimate access,
  and that the account does not re-enter a compromised state. It layers deterministic checks on first-party
  identity logs (Windows security events and Entra ID sign-in/audit logs) with statistical performance,
  failure-mode, frequency, and volume metrics, and explainable machine-learning analysis of post-reset
  account behavior to surface incomplete remediation, repeat compromise, insider abuse, or continued adversary
  control.
type: technique
related:
- tactic_id: D3-R
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: 'For every incident ticket that called for a credential reissue, was a corresponding password
    reset event (Windows Event ID 4724 administrative reset, 4723 user-initiated change, or an Entra ID
    ''Reset password'' audit event) recorded on the affected account within the SLA window (default: 1
    hour of ticket creation), and are there any tickets with no matching reset?'
  context: 'This is the foundational deterministic check for the Restore tactic: a credential reissue
    can only restore account integrity if it actually happened. Join each incident record that mandates
    a reissue to identity/directory logs and look for a reset on the affected account inside the SLA window.
    A missing or late reset means the account may still be controlled by the adversary using the old secret.
    Tie every reset to an incident record and require validated recovery before closing the ticket. A
    positive result (reset found within SLA) supports closure; a negative result (no reset, or reset outside
    SLA) is an actionable gap that must be escalated.'
  answer_sources: &id001
  - Windows Event ID 4724
  - Windows Event ID 4723
  - Windows Event ID 4725
  - Windows Event ID 4726
  - Windows Event ID 4740
  - Windows Event ID 4767
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Entra ID Sign-in logs
  - Entra ID Audit logs (token/session revocation)
  - krbtgt password reset records
  - 'NAI: Authentication servers (e.g., Domain Controllers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "tickets = incidents where action == 'reissue_credential'\nresets = auth_logs where EventID\
      \ in (4724, 4723) OR (source=='EntraID' AND operation=='Reset password')\nfor t in tickets:\n  match\
      \ = resets where account == t.account AND (reset_time - t.created_time) <= 1h AND reset_time >=\
      \ t.created_time\n  if not match: alert('No reset within SLA for ticket', t.id, t.account)"
- question: After the reset, is there evidence that authentication with the OLD secret now fails (Windows
    Event ID 4625 with status 0xC000006A bad password or 0xC0000234 locked out) AND at least one SUCCESSFUL
    logon with the new credential (Windows Event ID 4624), confirming the old authenticator was invalidated
    rather than merely changed?
  context: 'A reissue is only effective when the old authenticator (and its sessions/tokens) is invalidated
    and the new one works. This state check requires two facts post-reset: the old secret is rejected,
    and the new credential produces a real successful logon. If you only see a 4724/4723 but never a successful
    4624 with the new credential, restoration is unverified; if the old secret still produces 4624 successes,
    the reset did not take effect. This validates full restoration of legitimate access for the affected
    account during the Restore phase.'
  answer_sources: *id001
  range: Last 90 days. Center analysis on each reset event and inspect the following 24-72 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'reset = auth_logs where EventID in (4724,4723) for account A at time T

      old_fail = auth_logs where account==A AND EventID==4625 AND Status in (0xC000006A,0xC0000234) AND
      time > T

      new_success = auth_logs where account==A AND EventID==4624 AND time > T

      if reset AND new_success AND old_fail: state = ''restored''

      else: alert(''Reissue not validated'', A, missing=[not old_fail and ''old-secret-rejection'', not
      new_success and ''new-cred-success''])'
- question: For privileged and cloud accounts, were active sessions and OAuth refresh tokens explicitly
    revoked (Entra ID 'Revoke sign-in sessions' / refresh-token revocation audit events) and do pre-reset
    tokens subsequently fail; and for domain-wide compromise, were TWO krbtgt password resets (with replication
    and ticket-lifetime waits between them) plus signing-key rotation performed to invalidate golden tickets/SAML?
  context: Changing a password does not by itself kill existing sessions, OAuth refresh tokens, or already-issued
    Kerberos tickets, so an adversary can retain access after a reset. For cloud/privileged accounts,
    require evidence of session and refresh-token revocation and confirm pre-reset tokens now fail. For
    domain-wide compromise, a single krbtgt reset is insufficient because two are needed to fully cycle
    the key and invalidate forged golden tickets; signing-key rotation invalidates forged SAML tokens.
    Alert if only one krbtgt reset (or none) is recorded, or if pre-reset tokens/sessions remain valid
    after reset. This is critical to truly restoring integrity and denying persistence.
  answer_sources: *id001
  range: Last 90 days. Correlate revocation events to the reset and to subsequent token-use attempts.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'revoke = audit where source==''EntraID'' AND operation in (''Revoke sign-in sessions'',''Refresh
      token revocation'') AND account==A

      stale_use = signin_logs where account==A AND token_issued_at < reset_time AND time > reset_time
      AND result==''success''

      if not revoke OR stale_use: alert(''Sessions/tokens not invalidated'', A)

      krbtgt_resets = auth_logs where target==''krbtgt'' AND EventID==4724 in last 14d

      if domain_wide_compromise AND count(krbtgt_resets) < 2: alert(''krbtgt rotated <2 times'', count=count(krbtgt_resets))'
- question: At the moment of issuance, was the new secret screened against known-breached password corpora
    (using a privacy-preserving breach-alerting mechanism) and rejected if it matched, so the reissued
    credential is not trivially re-compromised?
  context: Per NIST SP 800-63B authenticator strength/lifecycle requirements, a newly issued credential
    must not be a known-breached value, or the account can be immediately re-compromised by credential-stuffing.
    Screening should use privacy-preserving k-anonymity breach alerting (e.g., hashed-prefix lookups)
    so the plaintext secret is never exposed. A positive result here is a rejected weak/breached choice
    (good); the risk to detect is a reissued credential that was accepted despite matching a breach corpus,
    which undermines the entire Restore action.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on credential_issue(account A, secret S):\n  h = sha1(S); prefix = h[:5]; suffix = h[5:]\n\
      \  matches = breach_api.query(prefix)  # k-anonymity, plaintext never sent\n  if suffix in matches:\
      \ reject_and_alert('Reissued credential found in breach corpus', A)\n  else: allow"
- question: What is the mean, median, and 95th-percentile time-to-remediate from high-risk alert creation
    to the first successful post-reset logon (Windows Event ID 4624), and is weekly performance trending
    within environment-derived SLO thresholds (historical p95 plus a margin)?
  context: Measuring response performance over time is required for incident response maturity. By computing
    the latency from when a high-risk alert is created to the first successful logon with the new credential,
    you quantify how fast credential integrity is actually restored. Trend these statistics weekly and
    compare against a dataset-specific SLO derived from your own historical p95 plus a margin (not a fixed
    value). A widening p95 or an upward trend indicates the remediation pipeline is degrading, leaving
    compromised accounts exposed longer.
  answer_sources: *id001
  range: Last 90 days, aggregated weekly.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events = join(high_risk_alerts a, auth_logs s on s.account==a.account AND s.EventID==4624
      AND s.time>a.created)

      latency = first(s.time) - a.created  per alert

      by week: mean(latency), median(latency), p95(latency)

      slo = historical_p95(latency) * 1.2

      if week.p95 > slo: alert(''Remediation latency exceeds SLO'', week, week.p95)'
- question: Per reset account, is the old-secret failed-logon rate (Windows Event ID 4625) and account-lockout
    rate (Windows Event ID 4740) decaying over the 24-72 hours after reset, and is the count of rejected
    pre-reset tokens dropping to zero, or do these curves persist?
  context: A successful reissue should produce a sharp, decaying tail of old-secret failures as caches
    and services pick up the new credential. A non-decaying old-secret failure curve, repeated lockouts,
    or continued token rejections indicate incomplete invalidation or a service/host still configured
    with the old secret (or an adversary still trying the old credential). Alert when post-reset 4625/4740
    for the account exceeds a baseline-derived threshold, e.g. more than 5 in the first hour or any persisting
    beyond 24 hours. This failure-mode profiling distinguishes a clean restore from one that silently
    failed.
  answer_sources: *id001
  range: Last 90 days. Per-account window of 24-72 hours after each reset.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for account A with reset at T:\n  fails = auth_logs where account==A AND EventID==4625 AND\
      \ time in [T, T+72h]\n  locks = auth_logs where account==A AND EventID==4740 AND time in [T, T+72h]\n\
      \  rate_curve = bucket(fails, 1h)\n  if rate_curve[0..1h] > 5 OR any(rate_curve[after 24h] > 0)\
      \ OR count(locks) repeated:\n    alert('Non-decaying post-reset failures - incomplete invalidation',\
      \ A)"
- question: How many credential reissues has each user account required over a rolling 90-day window,
    and which accounts have needed 3 or more (tunable), and does change-point detection on the per-account
    or enterprise-wide reissue time series reveal a regime shift consistent with broad compromise?
  context: Repeated reissues for the same account signal persistent compromise, chronic user-behavior
    issues, or insider threat rather than a one-off incident. Counting reissues per account over a rolling
    window and flagging accounts at 3+ (tune to your environment) surfaces these. Applying change-point
    detection (CUSUM/PELT/Bayesian) to the per-account and enterprise-wide reissue series flags regime
    shifts such as a sudden cluster of resets that may indicate broad compromise. This frequency analysis
    ties the Restore action to detecting failed restoration and recurring adversary access.
  answer_sources: *id001
  range: Last 90 days, rolling window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'reissues = auth_logs where EventID in (4724,4723) OR operation==''Reset password''

      by account: c = count(reissues in last 90d)

      if c >= 3: alert(''Repeat reissue - possible persistent compromise'', account, c)

      series = daily_count(reissues) per account and enterprise-wide

      cp = change_point_detect(series, method in [''CUSUM'',''PELT'',''Bayesian''])

      if cp: alert(''Regime shift in reissue volume'', cp)'
- question: Does a seasonality-aware time-series forecast (trend plus weekly/holiday seasonality with
    uncertainty intervals) of credential-reissue volume show demand spikes that breach the prediction
    confidence intervals, and which component (trend vs. seasonal vs. holiday deviation) is driving any
    breach?
  context: 'Forecasting reissue volume with a model that captures trend and weekly/holiday seasonality
    lets you flag anomalous demand spikes that exceed expected confidence intervals as possible indicators
    of broad compromise or process instability, and helps the identity team plan surge capacity. Surfacing
    the contributing components (trend, seasonal, holiday) in the alert makes it explainable: a holiday-driven
    spike is benign, while an unexplained trend break warrants investigation. This volume forecasting
    supports both operational readiness and early detection of enterprise-wide credential incidents.'
  answer_sources: *id001
  range: Last 90 days for fitting; forecast forward 1-2 weeks.
  queries:
  - technology: Stats/ML pseudocode
    query: "ts = daily_count(reissue_events) over training window\nmodel = Prophet(trend + weekly_seasonality\
      \ + holidays, interval_width=0.95)\nforecast = model.predict(future)\nfor day in observed:\n  if\
      \ actual[day] > forecast.upper[day]:\n    components = decompose(actual[day])  # trend vs seasonal\
      \ vs holiday\n    alert('Reissue volume spike beyond CI', day, actual[day], components)"
- question: Does the account's post-reset behavior (logon volume, distinct source hosts, success/fail
    ratio, time-of-day, logon types) deviate from its own and peer baselines per an isolation-based detector,
    does the post-reset event sequence match the expected workflow (4724 -> failed 4625 with old secret
    -> successful 4624 with new secret) per a log-sequence model, and is the login structure consistent
    with the user's normal pattern?
  context: Even after a credential is reissued, an adversary may retain control or the account may behave
    abnormally. Score post-reset behavior against the account's own and peer baselines with an isolation-forest
    detector, surfacing the top-3 contributing features in the alert for explainability. Validate the
    post-reset event sequence against the expected workflow with a log-sequence model (DeepLog) and flag
    missing/out-of-order steps. Use interpretable attention RNNs and structural-login baselines to detect
    logons inconsistent with the user's normal structure (continued adversary control). A high anomaly
    score or broken sequence after a reset means restoration may have failed and the account is still
    compromised.
  answer_sources: *id001
  range: Last 90 days for baselines; score the 24-72 hours after each reset.
  queries:
  - technology: Stats/ML pseudocode
    query: 'feats = [logon_volume, distinct_src_hosts, success_fail_ratio, hour_of_day, logon_types] post-reset

      score = IsolationForest(self_and_peer_baseline).score(feats)

      if score anomalous: alert(''Anomalous post-reset behavior'', account, top3_features(feats))

      seq = ordered_events(account, after reset)

      expected = [4724, 4625(old secret), 4624(new secret)]

      if not DeepLog.matches(seq, expected): alert(''Out-of-order/missing reset workflow steps'', account,
      seq)

      if attention_rnn.structurally_anomalous(login_graph(account)): alert(''Login structure unlike user
      baseline'', account)'
