name: 'D3-CFC: Content Format Conversion'
id: 630d0c2c-a454-4d0f-acd0-f52a8cab8d2a
description: >-
  Investigate the use and efficacy of content format conversion (Content Disarm and Reconstruction, sanitization,
  and normalization) as an isolation control against file-based payloads delivered via email, web proxies,
  and file shares. This playbook helps an analyst confirm that high-risk active-content formats (macro-enabled
  Office documents, script-enabled PDFs, HTA/JS/VBS/WSF scripts, ISO/IMG containers, images, and serialized
  payloads) are detected and routed to mandatory conversion before reaching users; verify that conversion
  executed and that only inert output was released; detect raw active-content that bypassed conversion
  or executed directly; measure conversion coverage, failure/error rates, and residual post-conversion
  risk; surface structural and entropy anomalies and obfuscated macros/scripts; and run machine-learning
  classifiers, risk models, and campaign clustering alongside deterministic rules to find malicious documents,
  predict bypass risk, and group coordinated waves. It targets both sophisticated external actors weaponizing
  documents and commodity malware delivery, with realistic endpoint, network, and gateway telemetry.
type: technique
related:
- tactic_id: D3-IS
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are inbound high-risk active-content file types (DOCM, XLSM, XLSB, PPTM, HTA, JS, VBS, WSF,
    ISO/IMG containers, or script-enabled PDFs) being delivered into user-accessible locations without
    triggering the mandatory conversion workflow, and is each conversion recording both the original and
    converted-output hashes?
  context: 'This is the foundational isolation check for the Isolate tactic: dangerous formats must be
    deterministically forced through a disassemble-evaluate-reassemble CDR workflow before a user can
    ever open them. The analyst should confirm that every delivery of an active-content format observed
    in Zeek files.log or Windows Event ID 4663 is matched to a conversion event, and that the conversion
    gateway recorded the original-file hash and converted-output hash for auditability. A positive result
    (delivery with no conversion record) means a malicious payload could reach a user in its raw, weaponizable
    form; a clean result confirms the conversion control is covering the denylist of risky file types
    and structures.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4663
  - Windows Event ID 4104
  - CDR/conversion gateway logs
  - Email security gateway logs
  - 'NAI: Email gateways, web proxies, and endpoint file systems where external files are first written.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      files = parse(Zeek_files_log, WinEvent_4663); FOR f WHERE f.type IN [DOCM,XLSM,XLSB,PPTM,HTA,JS,VBS,WSF,ISO,IMG,pdf_with_script]
      AND f.dest IN user_accessible_folders: IF NOT exists(conversion_record WHERE orig_hash=f.hash):
      ALERT 'unconverted active-content'; ELSE LOG orig_hash, converted_hash; OUTPUT file, type, dest,
      conversion_status.
- question: Do inbound files contain deterministic active-content markers (VBA auto-exec triggers such
    as AutoOpen, Document_Open, Workbook_Open; suspicious APIs such as Shell, CreateObject, URLDownloadToFile,
    ExecuteExcel4Macro; or PDF keywords such as /JavaScript, /OpenAction, /AA, /Launch, /EmbeddedFile
    and deeply nested object paths) that should force them into conversion?
  context: 'Before conversion runs, files should be statically parsed so the decision to sanitize is justified
    by concrete, deterministic evidence rather than guesswork. The analyst is looking for the structural
    and code markers that olevba/oletools and PDF structural detectors (Hidost, Maiorca et al.) use to
    identify weaponized documents: auto-executing macro entry points, dangerous API calls, and PDF action/embedded-file
    keywords with abnormal nesting. Recording the count and type of markers found becomes the conversion
    justification and an investigative lead. Many markers present means a strong case for malicious intent;
    their absence helps explain why a file was or was not routed to conversion. This supports isolation
    by ensuring active content is identified before it can act.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4663
  - Windows Event ID 4104
  - CDR/conversion gateway logs
  - Email security gateway logs
  - 'NAI: Email gateways, web proxies, and endpoint file systems where external files are first written.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      FOR f IN inbound_files: markers = static_parse(f); office_markers = count(AutoOpen,Document_Open,Workbook_Open,Shell,CreateObject,URLDownloadToFile,ExecuteExcel4Macro);
      pdf_markers = count(/JavaScript,/OpenAction,/AA,/Launch,/EmbeddedFile) + deep_object_paths(f); IF
      (office_markers+pdf_markers)>0: ROUTE f TO conversion; OUTPUT f, marker_types, marker_count AS justification.
- question: After conversion, does re-parsing the output prove that zero residual active-content structures
    remain (no VBA modules/macros, no /JavaScript, /OpenAction, /Launch, /EmbeddedFile, and trailing-byte
    length of zero for re-encoded images) before the file is released to the user?
  context: Isolation only succeeds if the converted output is genuinely inert, so the analyst must verify
    the post-conversion assertion that all dangerous structures were stripped, mirroring rebuild-only
    CDR designs (Open Image CDR, Zero-Trust AI MTD+CDR). The check re-parses each released file and confirms
    the absence of macros, embedded JavaScript, launch/embedded-file actions, and steganographic trailing
    bytes. A residual marker, or evidence that the conversion tool errored or timed out, must result in
    quarantine and an alert rather than fail-open release. A positive finding here is high severity because
    it means a file believed to be safe still carried executable content into the user environment.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4663
  - Windows Event ID 4104
  - CDR/conversion gateway logs
  - Email security gateway logs
  - 'NAI: Email gateways, web proxies, and endpoint file systems where external files are first written.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      FOR out IN converted_outputs: residual = reparse(out); IF residual.has_vba OR residual.has(/JavaScript,/OpenAction,/Launch,/EmbeddedFile)
      OR (is_image(out) AND trailing_byte_len>0) OR conversion_tool.status IN [error,timeout]: QUARANTINE
      out; ALERT 'residual active-content / fail-open prevented'; ELSE RELEASE out.
- question: Is there any case where an original, non-converted active-content file was opened or executed
    without a matching conversion record, including Office applications spawning interpreters (winword/excel/powerpnt
    launching cmd, powershell, wscript, cscript, mshta, rundll32, or regsvr32)?
  context: 'This question detects the failure mode the Isolate tactic is meant to prevent: a raw, un-sanitized
    document reaching execution. The analyst correlates inbound file events with conversion-tool execution
    logs (Windows Event ID 4104) and downstream file-access events, alerting when an original active-content
    file is opened with no corresponding conversion record. Office-spawns-interpreter activity provides
    a deterministic backstop (per the SigmaHQ Suspicious Microsoft Office Child Process rule) that a non-converted
    document actually executed its payload. A match indicates the conversion isolation boundary was bypassed
    and a payload likely detonated, warranting immediate host investigation.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4663
  - Windows Event ID 4104
  - CDR/conversion gateway logs
  - Email security gateway logs
  - 'NAI: Email gateways, web proxies, and endpoint file systems where external files are first written.'
  range: Last 90 days, with event-centered correlation between the file-open event and any conversion
    record.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: >-
      JOIN inbound_active_content_files TO file_access_events AND WinEvent_4104 ON file_hash, time_window<=event_centered;
      ALERT WHERE original_file opened/executed AND no conversion_record; ALSO ALERT WHERE parent IN [winword,excel,powerpnt]
      AND child IN [cmd,powershell,wscript,cscript,mshta,rundll32,regsvr32]; OUTPUT host, file, parent,
      child, cmdline.
- question: Do independent parsers (or the CDR parser versus the renderer) disagree on the structure or
    content of an inbound file, or does any parser report a partial parse, extraction error, or timeout
    that would indicate hidden executable content?
  context: 'Parser confusion is a known evasion against CDR and malware detectors (Extract Me If You Can,
    Carmony et al.): attackers craft files that one parser reads as benign while another, or the renderer,
    sees executable content. To keep isolation robust, the analyst should run two independent parsers
    and treat any disagreement, partial parse, extraction error, or timeout as suspicious and route the
    file to quarantine rather than passing it. This is a fail-closed control. A disagreement or parse
    failure means the file may carry content the primary detector cannot see, so it must not be released;
    consistent clean parses across engines increase confidence the file is benign.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Windows Event ID 4663
  - Windows Event ID 4104
  - CDR/conversion gateway logs
  - Email security gateway logs
  - 'NAI: Email gateways, web proxies, and endpoint file systems where external files are first written.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      FOR f IN inbound_files: r1=parserA(f); r2=parserB(f); rr=renderer(f); IF r1!=r2 OR r1.partial OR
      r2.partial OR any.error OR any.timeout OR disagree(r1,rr): QUARANTINE f; ALERT 'parser disagreement/failure';
      OUTPUT f, parserA_result, parserB_result, renderer_result.
- question: What is the daily conversion coverage (converted divided by eligible files) per MIME category
    and entry channel (email, web proxy, file share), and has coverage dropped below the established baseline
    or become concentrated at a single gateway?
  context: Conversion is only an effective isolation control if it actually covers the files it should,
    so the analyst measures coverage as converted/eligible per MIME type and channel, alongside volume
    (absolute eligible-file counts and bytes), frequency (files/min routed to conversion), and state (converted
    versus bypassed) metrics. Applying fleet-wide rarity/prevalence analysis (Using Frequency Analysis
    to Defend Office 365), an alert fires when coverage falls below baseline (for example below 99% for
    DOCM/XLSM/JS) or when missed conversions cluster at one gateway. A coverage drop reveals a silent
    isolation gap where weaponized files may be passing untouched; concentration at one gateway points
    to a specific misconfiguration or bypass path to remediate.
  answer_sources:
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Zeek files.log
  - Sandbox detonation verdicts
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Email gateways, web proxies, CDR/sanitization services, and endpoint file systems.'
  range: Last 90 days, with daily aggregation against a rolling baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      FOR each (mime,channel),day: coverage = converted_count / eligible_count; eligible_bytes; files_per_min;
      bypassed_count; baseline = rolling_baseline(mime,channel); ALERT WHEN coverage < baseline (e.g.
      <0.99 for DOCM/XLSM/JS) OR bypassed concentrated at single gateway; OUTPUT mime, channel, coverage,
      baseline, gateway.
- question: Are CDR-tool error, timeout, and exception rates or parser-disagreement counts deviating from
    their normal per-file-type baseline, indicating evasion or degraded conversion efficacy?
  context: Conversion failures are not noise to be suppressed; they are first-class failure signals (Failure
    Mode Awareness), because rising parse failures often indicate adversaries probing parser weaknesses
    or a degraded tool that silently passes weaponized files (Extract Me If You Can, Carmony et al.).
    The analyst baselines the normal failure/error/timeout rate per file type and alerts on deviation
    using a robust statistic such as median + k*MAD. A spike in failures for a given file type suggests
    an evasion campaign or a broken conversion path that is no longer isolating content; stable low rates
    indicate the conversion pipeline is healthy. This directly supports the Isolate tactic by ensuring
    failures lead to quarantine rather than fail-open delivery.
  answer_sources:
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Zeek files.log
  - Sandbox detonation verdicts
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Email gateways, web proxies, CDR/sanitization services, and endpoint file systems.'
  range: Last 90 days, baselined per file type.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      FOR each file_type: rate = (errors+timeouts+exceptions+parser_disagreements)/total; med=median(rate_30d);
      mad=MAD(rate_30d); ALERT WHEN rate > med + k*mad; OUTPUT file_type, current_rate, median, mad, deviation.
- question: Do any inbound files show structural or entropy anomalies (unusual file size, embedded-object
    counts, trailing-byte length, overall entropy, or high-entropy-region ratio) relative to their MIME
    baseline, or do extracted macros/scripts show character-frequency or AST-structure deviation consistent
    with obfuscation?
  context: Weaponized documents and steganographic carriers frequently deviate structurally from benign
    files of the same type, so per-MIME baselining of size, embedded-object count, trailing-byte length,
    and entropy (overall and high-entropy-region ratio) lets the analyst flag 99th-percentile outliers
    for mandatory conversion and review (Maiorca et al.; Open Image CDR). For extracted macros and scripts,
    adding character-frequency and AST-structure deviation flags obfuscation (Revoke-Obfuscation). An
    outlier means the file is statistically unlike normal content and may hide an embedded payload or
    steganographic data, justifying forced conversion before any user access; in-baseline values reduce
    suspicion. This strengthens isolation by catching evasive files that lack obvious deterministic markers.
  answer_sources:
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Zeek files.log
  - Sandbox detonation verdicts
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Email gateways, web proxies, CDR/sanitization services, and endpoint file systems.'
  range: Last 90 days, scored against per-MIME baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      FOR f IN inbound_files: base = mime_baseline(f.mime); score f.size, embedded_object_count, trailing_byte_len,
      entropy, high_entropy_region_ratio vs base; FOR extracted macros/scripts: add char_freq_dev, ast_structure_dev;
      FLAG WHEN any_feature > p99; ROUTE to conversion+review; OUTPUT f, feature, percentile.
- question: Has post-conversion residual risk increased compared with historical levels, measured by sandbox
    detonation verdicts, suspicious follow-on process activity rate, and NXDOMAIN/404/blocked-connection
    rates from hosts that opened converted documents?
  context: Even with conversion in place, the analyst must confirm that sanitized files are not still
    leading to malicious behavior, which would indicate degraded efficacy or a new evasion pattern. Comparing
    current post-conversion detections (sandbox verdicts, suspicious child-process activity, and failed-C2
    signals such as NXDOMAIN, HTTP 404s, and blocked outbound connections from converted-document hosts)
    against historical levels reveals whether conversion is still neutralizing payloads. A significant
    increase means converted files are still active or attackers have found a bypass, undermining the
    isolation guarantee; stable or declining residual signals confirm the control remains effective. Treating
    failed downloads and blocked C2 as distinct indicators (rather than noise) sharpens this measurement.
  answer_sources:
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Zeek files.log
  - Sandbox detonation verdicts
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 11
  - 'NAI: Email gateways, web proxies, CDR/sanitization services, and endpoint file systems.'
  range: Last 90 days, compared against historical post-conversion baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      FOR converted_doc_hosts: current = {sandbox_malicious_rate, suspicious_followon_proc_rate, nxdomain_rate,
      http404_rate, blocked_conn_rate}; baseline = historical(same metrics); ALERT WHEN any metric significantly
      > baseline; OUTPUT metric, current, baseline, delta.
- question: Does a structural machine-learning classifier (trained on PDF object trees, OOXML/OLE structure,
    and embedded-object traits) flag any inbound document as malicious and requiring conversion, and does
    each alert surface its top-3 contributing features?
  context: Running in parallel with (never replacing) deterministic rules, a structural-path classifier
    (SVM/decision-tree style as validated across PDF/SWF in Hidost, with the detector taxonomy and evasion
    lessons of Maiorca et al.) catches malicious documents whose maliciousness is encoded in structure
    rather than obvious keywords. The analyst should use adversarially-aware training and require each
    alert to surface its top-3 features (for example '/OpenAction present, embedded-EXE object, abnormal
    object depth') so the verdict is explainable and actionable. A high-confidence flag means the document
    should be forced through conversion and reviewed; the feature attribution tells the analyst exactly
    why, supporting both triage and the isolation decision under the Isolate tactic.
  answer_sources:
  - Zeek files.log
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Sandbox detonation verdicts
  - 'NAI: Email gateways, web proxies, CDR/sanitization services.'
  range: Last 90 days for training features, with live scoring of inbound documents.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      features = structural_paths(pdf_object_tree, ooxml_ole_structure, embedded_object_traits); model
      = structural_clf(adversarially_trained); p = model.predict_proba(features); ALERT WHEN p>=threshold;
      ROUTE to conversion; run alongside deterministic_rules; OUTPUT verdict, top_3_features.
- question: Does a risk model using source reputation, file metadata, embedded-object traits, and delivery
    context score any file as high-risk for malicious content or likely to bypass conversion, and are
    the top-3 driving features included in the alert?
  context: Some files warrant mandatory conversion and analyst review not because of a single marker but
    because their combined context (untrusted source reputation, suspicious metadata, risky embedded objects,
    and delivery channel) makes them dangerous or likely to evade the conversion pipeline (Maiorca et
    al.). The analyst uses this risk score to route high-risk files for forced conversion and review,
    with the top-3 contributing features included in the alert text for explainability. A high score indicates
    a file that should not be allowed to bypass isolation and merits closer inspection; the feature list
    helps the analyst judge whether reputation, structure, or context is the dominant concern. This predicts
    and closes potential bypass gaps in the Isolate control.
  answer_sources:
  - Zeek files.log
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Sandbox detonation verdicts
  - 'NAI: Email gateways, web proxies, CDR/sanitization services.'
  range: Last 90 days for training features, with live scoring of inbound files.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      features = [source_reputation, file_metadata, embedded_object_traits, delivery_context]; risk =
      bypass_risk_model.predict_proba(features); ALERT WHEN risk>=threshold; ROUTE high-risk to mandatory
      conversion + analyst review; OUTPUT risk_score, top_3_features.
- question: Can converted or quarantined Office documents be clustered into campaigns using perceptual-hash/image
    clustering on lure images and document features, revealing coordinated waves that bypassed or stressed
    the conversion control?
  context: Individual file verdicts can obscure the bigger picture of a coordinated campaign, so applying
    perceptual-hash and image clustering on lure images and document features groups converted or quarantined
    documents into campaigns (Analysis and Correlation of Visual Evidence in Campaigns of Malicious Office
    Documents, Casino et al.). For the analyst this accelerates triage and reveals coordinated waves that
    bypassed or overloaded conversion. A dense cluster of related documents indicates an active campaign
    targeting the organization, which both prioritizes response and exposes whether the conversion isolation
    boundary is being systematically probed; isolated singletons are lower priority. This turns per-file
    isolation outcomes into campaign-level intelligence.
  answer_sources:
  - Zeek files.log
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Sandbox detonation verdicts
  - 'NAI: Email gateways, web proxies, CDR/sanitization services.'
  range: Last 90 days, clustering converted and quarantined documents.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      vecs = perceptual_hash(lure_images) + document_features(converted_or_quarantined_docs); clusters
      = cluster(vecs); FLAG dense clusters AS campaigns; OUTPUT cluster_id, member_count, representative_lure,
      bypass_or_stress_indicators.
- question: For image and serialized/model file types, does rebuild-and-verify CDR successfully reconstruct
    each file from valid content only and pass output-integrity validation, and does it alert when reconstruction
    fails or diverges materially from the original beyond expected normalization?
  context: Images and serialized/model files can hide steganographic or serialization payloads that keyword
    scanning misses, so a rebuild-and-verify approach reconstructs the file from valid content only and
    validates the integrity of the output, achieving high disarm rates (Open Image CDR; Zero-Trust AI
    MTD+CDR). The analyst should alert when reconstruction fails verification or when the reconstructed
    output diverges materially from the original beyond expected normalization, since that divergence
    can indicate embedded malicious data that could not survive a clean rebuild. A failed or materially
    divergent reconstruction means the file should be quarantined rather than released; a clean rebuild
    that matches within expected normalization confirms the payload class was neutralized, fulfilling
    the Isolate objective for these harder file types.
  answer_sources:
  - Zeek files.log
  - CDR/conversion gateway logs
  - Email security gateway logs
  - Sandbox detonation verdicts
  - 'NAI: Email gateways, web proxies, CDR/sanitization services.'
  range: Last 90 days, scoring image and serialized/model files at ingest.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      FOR f IN [image, serialized, model]: rebuilt = rebuild_from_valid_content_only(f); IF NOT verify_integrity(rebuilt)
      OR divergence(rebuilt,f) > expected_normalization: QUARANTINE f; ALERT 'rebuild verification failed';
      ELSE RELEASE rebuilt; OUTPUT f, rebuild_status, divergence.
