name: 'D3-VI: Variable Initialization'
id: 864b0807-ae59-4b4e-94dd-ce09a93c5a77
description: 'This playbook helps an analyst investigate the operational consequences and pre-production
  indicators of uninitialized-variable defects (CWE-457) in in-house developed software. Uninitialized
  pointers and indeterminate values can crash an application (commonly surfacing as Windows Error Reporting
  access violations, exception code 0xC0000005) or silently leak residual process memory over the network
  (a buffer over-read information disclosure, as in Heartbleed). It guides the analyst across three vantage
  points: production endpoint crash telemetry (Windows Event ID 1000 / WER records), network egress and
  internal traffic from managed applications (Zeek conn/http/ssl/files/weird logs), and CI/CD plus canary-fleet
  instrumentation (compiler diagnostics, MemorySanitizer/Valgrind, SAST, symbolic execution, and coverage-guided
  fuzzing). For each vantage point it layers deterministic allow-list and signature rules, statistical
  baselining and anomaly detection, and machine-learning classification and root-cause localization so
  a SOC analyst can determine to what extent the organization''s applications are hardened against, and
  currently affected by, uninitialized-variable vulnerabilities.'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any of our monitored, in-house developed applications generating Windows Event ID 1000
    (Application Error) crashes, and does any crashing application match our predefined watch-list?
  context: 'Under the Harden mission this is the deterministic detection floor: a simple allow-list rule
    that fires whenever a known, business-critical in-house application crashes. Search Windows Event
    ID 1000 (Application Error) and compare the ''Faulting application name'' field against a curated
    list of monitored in-house executables; generate an alert for any match. Crashes in these applications
    are the most direct production symptom of an uninitialized-pointer dereference or use of an indeterminate
    value (CWE-457). A positive result means a monitored app is crashing and warrants triage of the WER
    record; a clean result over the range gives baseline assurance that the watched binaries are not faulting.
    Keep this rule running permanently as the deterministic backstop beneath the statistical and ML methods.'
  answer_sources:
  - Windows Event ID 1000
  - WER report fields (Faulting application name, Faulting module name, Exception code, Faulting offset)
  - 'NAI: Endpoints and servers running critical in-house developed applications.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "monitored = load_list('inhouse_critical_apps')\nalert WHERE EventID == 1000\n  AND FaultingApplicationName\
      \ IN monitored\n  -> open_case(app=FaultingApplicationName, module=FaultingModuleName, exc=ExceptionCode)"
- question: When we bucket every application crash by a stable signature, are there new, never-before-seen
    crash buckets with an access-violation exception code appearing after a software deployment?
  context: 'This applies the population-scale crash classification pioneered by Windows Error Reporting:
    bucket each crash on a stable signature of (Faulting application name + Faulting module name + Faulting
    offset + Exception code). Buckets whose Exception code is 0xC0000005 (access violation) are prime
    candidates for uninitialized-pointer dereferences per CWE-457. For the Harden mission, the key signal
    is a brand-new bucket that emerges immediately after a deployment, implying a freshly introduced defect.
    Auto-open a tracking case for any never-before-seen access-violation bucket post-deployment. Bucketing
    prevents one noisy crash from drowning out distinct root causes and lets you tie a specific fault
    to a specific code change. References: [Debugging in the (Very) Large](https://www.sigops.org/s/conferences/sosp/2009/papers/glerum-sosp09.pdf)
    [CWE-457: Use of Uninitialized Variable](https://cwe.mitre.org/data/definitions/457.html)'
  answer_sources:
  - Windows Event ID 1000
  - WER report fields (Faulting application name, Faulting module name, Exception code, Faulting offset)
  - 'NAI: Endpoints and servers running critical in-house developed applications.'
  range: Last 90 days; correlate buckets to deployment/change-management timestamps
  queries:
  - technology: SIEM/Stats pseudocode
    query: "bucket = hash(FaultingApplicationName, FaultingModuleName, FaultingOffset, ExceptionCode)\n\
      known = seen_buckets_before(deployment_time)\nfor crash in EventID==1000:\n  if crash.bucket not\
      \ in known:\n    if crash.ExceptionCode == 0xC0000005:  # access violation -> CWE-457 candidate\n\
      \      open_case(reason='new access-violation bucket post-deploy', bucket=crash.bucket)"
- question: For each monitored application, has the daily crash volume (overall and per crash bucket)
    spiked above its historical baseline, or has the crashes-per-launch ratio risen sharply?
  context: 'This statistical method baselines each application''s crash frequency (Event ID 1000) over
    a 30-day window and alerts when the daily count exceeds the 95th percentile of its historical distribution.
    Because crash volume is heavy-tailed across buckets, baseline and alert per crash bucket as well as
    in aggregate so a single dominant bucket does not mask a new one. Additionally track the normalized
    failure metric crashes-per-launch (Event ID 1000 count divided by Sysmon Event ID 1 process-start
    count) and alert when it exceeds 3x the trailing 7-day median, which controls for changes in usage
    volume. For the Harden mission a spike indicates degrading stability that often traces to an uninitialized-variable
    regression; derive thresholds per application since baselines differ widely. References: [Debugging
    in the (Very) Large](https://www.sigops.org/s/conferences/sosp/2009/papers/glerum-sosp09.pdf)'
  answer_sources:
  - Windows Event ID 1000
  - WER report fields (Faulting application name, Faulting module name, Exception code, Faulting offset)
  - Sysmon Event ID 1 (process create)
  - 'NAI: Endpoints and servers running critical in-house developed applications.'
  range: Last 90 days; baseline window 30 days, ratio over trailing 7 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for app in monitored:\n  daily = count(EventID==1000 where app) group_by day, bucket\n  p95\
      \ = percentile(daily.baseline_30d, 95)\n  if daily.today > p95: alert(app, bucket, 'crash spike\
      \ > p95')\n  launches = count(Sysmon EventID==1 where app) per day\n  cpl = daily.today / launches.today\n\
      \  if cpl > 3 * median(cpl.trailing_7d): alert(app, 'crashes-per-launch > 3x median')"
- question: Does the observed crash count for any critical application deviate significantly from a time-series
    forecast of its expected crash volume, indicating a new widespread issue?
  context: 'This machine-learning method fits a time-series forecasting model (e.g., ARIMA) to each critical
    application''s crash count and flags points that fall outside the forecast''s confidence interval.
    Unlike a static percentile threshold, forecasting captures trend and seasonality (e.g., business-hours
    usage cycles), so it detects an anomalous surge even when absolute counts are modest. For the Harden
    mission, a significant deviation above the forecast suggests a newly deployed or newly triggered uninitialized-variable
    defect affecting many users simultaneously. A within-interval observation is consistent with normal
    variation; a breakout is a lead for deeper bucket-level and root-cause analysis. References: [Online
    Forecasting and Anomaly Detection Based on ARIMA](https://www.mdpi.com/2076-3417/11/7/3194)'
  answer_sources:
  - Windows Event ID 1000
  - WER report fields (Faulting application name, Faulting module name, Exception code, Faulting offset)
  - 'NAI: Endpoints and servers running critical in-house developed applications.'
  range: Last 90 days; train on >=60 days of history for stable forecasts
  queries:
  - technology: Python/ML pseudocode
    query: "series = daily_crash_count(app, history>=60d)\nmodel = ARIMA.fit(series)\nfc, lo, hi = model.forecast(horizon=1,\
      \ ci=0.99)\nif observed_today > hi or observed_today < lo:\n  alert(app, observed=observed_today,\
      \ expected=fc, bound=[lo,hi])"
- question: For a binary that is crashing, can statistical root-cause analysis over crashing versus non-crashing
    executions localize the uninitialized-value defect and explain why those runs failed?
  context: 'Uninitialized-value bugs are notoriously hard to triage because the defect (the missing initialization)
    is frequently far from the crash site. This ML method (AURORA-style statistical root-cause analysis)
    compares many crashing and non-crashing executions of the affected binary and ranks behavioral predicates
    - register, memory, and branch states - that best discriminate failing runs. Surface the top-3 discriminating
    predicates plus the faulting module/offset in the alert so analysts see the causal reason, not just
    a score. For the Harden mission this converts a raw crash signal into an actionable defect location
    that developers can fix, hardening the source against recurrence. Requires collecting instrumented
    execution traces of the binary. References: [AURORA](https://www.usenix.org/system/files/sec19-blazytko.pdf)'
  answer_sources:
  - Windows Event ID 1000
  - WER report fields (Faulting application name, Faulting module name, Exception code, Faulting offset)
  - 'NAI: Endpoints and servers running critical in-house developed applications.'
  range: 'Event-centered: collect executions around each crash cluster of interest'
  queries:
  - technology: Python/ML pseudocode
    query: "runs = collect_traces(binary)  # crashing + non-crashing\npredicates = extract_predicates(runs)\
      \  # register/memory/branch states\nranked = statistical_root_cause(predicates, label=is_crash)\
      \  # AURORA-style\nalert(top3=ranked[:3], faulting_module=mod, faulting_offset=off,\n      note='uninitialized-value\
      \ defect likely upstream of crash site')"
- question: Is any in-house application sending network payloads to external hosts that contain uninitialized-memory
    fill patterns such as repeating 0xCC or 0xAB bytes?
  context: This deterministic rule inspects traffic from in-house applications (Zeek conn.log) to external
    hosts for payloads that, while non-zero in size, contain telltale uninitialized-memory patterns -
    debug fill bytes like 0xCCCCCCCC or 0xABABABAB. The presence of such patterns leaving the host strongly
    suggests an uninitialized buffer is being serialized and transmitted, an information-leak class of
    bug. For the Harden mission, any match is a high-confidence indicator that residual process memory
    is escaping over the wire and should trigger immediate investigation of the responsible service. Absence
    of the pattern does not rule out leaks of non-pattern memory, which the entropy and byte-frequency
    methods cover.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log / ssl.log (request vs response byte counts)
  - 'NAI: Network egress points and internal network segments monitoring traffic from in-house developed
    applications.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "patterns = [b'\\xcc'*4, b'\\xab'*4]\nfor c in conn.log where orig_h in inhouse_apps and resp_h\
      \ is external:\n  payload = c.payload\n  if len(payload) > 0 and any(p in payload for p in patterns):\n\
      \    alert(c.uid, 'uninitialized-memory fill pattern in egress payload')"
- question: Are any in-house services returning response byte volumes that vastly exceed the corresponding
    request size, the canonical memory-disclosure signature seen in Heartbleed?
  context: 'Buffer over-read disclosures (Heartbleed being the archetype) manifest as a server returning
    far more bytes than the request asked for. Using Zeek http.log/ssl.log or conn.log resp_bytes versus
    orig_bytes, compute the response-to-request ratio per flow for in-house services and alert when it
    exceeds a per-endpoint deterministic ceiling (start at 10x and tune to the application''s normal response
    profile). For the Harden mission this is a strong, low-cost indicator of an uninitialized/over-read
    memory leak. A flagged flow means the server emitted an anomalously large response relative to its
    request; tuning per endpoint avoids false positives for services that legitimately return large payloads
    (e.g., file downloads). References: [The Matter of Heartbleed](https://jhalderm.com/pub/papers/heartbleed-imc14.pdf)'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log / ssl.log (request vs response byte counts)
  - 'NAI: Network egress points and internal network segments monitoring traffic from in-house developed
    applications.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for f in (http.log | ssl.log | conn.log) where svc in inhouse_services:\n  ratio = f.resp_bytes\
      \ / max(f.orig_bytes, 1)\n  ceiling = per_endpoint_ceiling(svc, default=10)\n  if ratio > ceiling:\n\
      \    alert(f.uid, svc, ratio, 'response >> request: memory-disclosure signature')"
- question: Has the Shannon entropy of an in-house service's payloads dropped sharply below its normal
    baseline, suggesting transmission of repetitive uninitialized memory?
  context: 'This statistical method computes the Shannon entropy of the initial data-packet payload for
    flows tied to specific applications (identified by source/destination IPs and ports in Zeek conn.log)
    and compares it to a per-service baseline. Leaked uninitialized memory is frequently repetitive (fill
    bytes, zero pages, stale structures), which lowers entropy relative to the service''s normal output.
    Alert when entropy drops below the 5th percentile of the per-service baseline. For the Harden mission
    this catches leaks that lack a fixed byte pattern but are still abnormally low-entropy. Use per-service
    baselines rather than one global cut-off because normal entropy varies widely between, e.g., encrypted,
    compressed, and plaintext protocols. References: [Using Entropy Analysis to Find Encrypted and Packed
    Malware](https://ieeexplore.ieee.org/document/4140989) [Baseline Payload Entropy Values for Common
    Internet Services](https://www.mdpi.com/1999-5903/16/12/470)'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log / ssl.log (request vs response byte counts)
  - 'NAI: Network egress points and internal network segments monitoring traffic from in-house developed
    applications.'
  range: Last 90 days; establish per-service entropy baseline over the window
  queries:
  - technology: Zeek/pseudocode
    query: "for c in conn.log where (orig_h,resp_h,ports) maps_to app:\n  e = shannon_entropy(c.first_payload)\n\
      \  base = per_service_entropy_baseline(app)\n  if e < percentile(base, 5):\n    alert(c.uid, app,\
      \ entropy=e, 'low-entropy payload: possible repetitive memory leak')"
- question: Do live payloads from an in-house service deviate from its modeled byte-frequency distribution,
    and are we also seeing malformed or truncated responses?
  context: 'This statistical method (PAYL-style) models each service''s normal payload byte-frequency
    distribution per destination port and length bin, then scores live payloads by Mahalanobis distance
    from that profile, alerting when distance exceeds the per-service 99th percentile. Leaked uninitialized
    memory shifts the byte-frequency away from the application''s normal output, producing a high distance
    score. Pair this with two corroborating signals: response volume (resp_bytes per flow) and the failure/state
    indicator of malformed or truncated responses (Zeek conn.log conn_state and weird.log entries). For
    the Harden mission, a high distance combined with anomalous volume or protocol weirdness is a strong,
    multi-evidence indication of memory disclosure. References: [Anomalous Payload-Based Network Intrusion
    Detection](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11)'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log / ssl.log (request vs response byte counts)
  - Zeek weird.log
  - 'NAI: Network egress points and internal network segments monitoring traffic from in-house developed
    applications.'
  range: Last 90 days; build per-service profile over the window
  queries:
  - technology: Python/ML pseudocode
    query: "profile = payl_model(service, port, length_bin)  # mean byte-freq + covariance\nfor c in live_flows[service]:\n\
      \  d = mahalanobis(byte_freq(c.payload), profile)\n  weird = c.conn_state in BAD_STATES or has_weird_log(c.uid)\n\
      \  if d > percentile(profile.dist, 99) or weird:\n    alert(c.uid, service, distance=d, resp_bytes=c.resp_bytes,\
      \ malformed=weird)"
- question: Can a supervised classifier trained on Zeek flow features reliably separate normal from anomalous
    in-house application traffic, and which features drive each anomalous verdict?
  context: 'This ML method trains a classifier (e.g., Random Forest) on features extracted from Zeek logs
    - protocol, service, duration, byte counts, payload entropy, and optional per-flow temporal features
    - to distinguish normal from anomalous application traffic. It then scores live traffic to detect
    deviations that may stem from bugs such as uninitialized variables causing information leakage. Crucially,
    surface the top-3 contributing features per alert via SHAP attribution (e.g., resp/orig byte ratio,
    payload entropy, byte-frequency distance) so analysts understand the basis of each flag. For the Harden
    mission this generalizes across the deterministic and statistical signals into a single tunable detector
    while remaining explainable enough for confident triage; it requires a labeled or curated training
    set of the service''s normal traffic. References: [Classification of Network Traffic Based on Single
    Flow Time Series Analysis](https://dl.acm.org/doi/abs/10.5555/3581644.3581681) [SHAP Integration in
    Intrusion Detection Systems](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek http.log / ssl.log (request vs response byte counts)
  - 'NAI: Network egress points and internal network segments monitoring traffic from in-house developed
    applications.'
  range: Last 90 days; retrain periodically on recent normal traffic
  queries:
  - technology: Python/ML pseudocode
    query: "X = features(zeek)  # proto, service, duration, bytes, entropy, temporal\nclf = RandomForest.fit(train_normal_vs_anomalous)\n\
      for c in live_flows:\n  pred, prob = clf.predict(X[c])\n  if pred == 'anomalous':\n    top3 = shap_top_features(clf,\
      \ X[c], k=3)\n    alert(c.uid, prob=prob, drivers=top3)"
- question: Are our CI/CD builds failing on any compiler uninitialized-use diagnostic, and do MemorySanitizer
    or Valgrind runs report any use of uninitialized values?
  context: 'This is the deterministic pre-production gate that catches the defect before it ever reaches
    production as a crash or network leak. Compile in-house C/C++ with -Wuninitialized/-Wmaybe-uninitialized
    and -Werror so any uninitialized-use diagnostic is a build-blocking finding (per CWE-457 guidance).
    Pair static diagnostics with bit-precise dynamic detection: run test/canary builds under MemorySanitizer,
    which reports use-of-uninitialized-value only when it affects observable behavior and pinpoints the
    producing allocation via origin tracking; for binaries that cannot be recompiled, run Valgrind Memcheck,
    which tracks the definedness (V bits) of every bit in unmodified binaries. Generate an alert/case
    for any new finding. For the Harden mission these are the highest-confidence, lowest-cost confirmations
    of an uninitialized-variable defect. References: [CWE-457: Use of Uninitialized Variable](https://cwe.mitre.org/data/definitions/457.html)
    [MemorySanitizer](https://research.google/pubs/memorysanitizer-fast-detector-of-uninitialized-memory-use-in-c/)
    [Clang MemorySanitizer docs](https://clang.llvm.org/docs/MemorySanitizer.html) [Valgrind](https://valgrind.org/docs/valgrind2007.pdf)'
  answer_sources:
  - Compiler diagnostics (-Wuninitialized/-Wmaybe-uninitialized)
  - MemorySanitizer / Valgrind Memcheck reports
  - Static analysis / SAST findings
  - Fuzzing crash artifacts (AFL/libFuzzer)
  - 'NAI: CI/CD pipelines and pre-production canary fleets building and testing in-house C/C++ applications.'
  range: Per build / per CI run; review trailing 90 days of findings
  queries:
  - technology: CI-CD/pseudocode
    query: 'build with CC_FLAGS += -Wuninitialized -Wmaybe-uninitialized -Werror

      if build.fails_on(uninitialized_diag): block_merge(); open_case(diag)

      run canary under MemorySanitizer -> on use-of-uninitialized-value: open_case(origin=alloc_site)

      for non-recompilable bins: run Valgrind Memcheck -> on uninitialised value: open_case()'
- question: Has symbolic execution of our code discovered any uninitialized or unconstrained-value paths,
    and do we have concrete reproducer inputs for them?
  context: 'This method uses symbolic execution (KLEE-style) to systematically explore program paths and
    discover uninitialized/unconstrained-value bugs, emitting a concrete reproducing input for each defect
    found. Each reproducer is a deterministic confirmation tied to a specific input, which makes the bug
    trivially repeatable for developers and verifiable after a fix. For the Harden mission this complements
    compiler and sanitizer findings by exploring paths that ordinary test suites may never exercise, surfacing
    latent uninitialized-value defects proactively. A new reproducer should open a tracking case; the
    absence of new reproducers across a code change increases confidence in that change. References: [KLEE](https://llvm.org/pubs/2008-12-OSDI-KLEE.pdf)'
  answer_sources:
  - Compiler diagnostics (-Wuninitialized/-Wmaybe-uninitialized)
  - MemorySanitizer / Valgrind Memcheck reports
  - Static analysis / SAST findings
  - Fuzzing crash artifacts (AFL/libFuzzer)
  - 'NAI: CI/CD pipelines and pre-production canary fleets building and testing in-house C/C++ applications.'
  range: Per build / per analysis run; review trailing 90 days
  queries:
  - technology: CI-CD/pseudocode
    query: "klee.explore(target)  # symbolic execution\nfor bug in klee.findings where type in {uninitialized,\
      \ unconstrained}:\n  repro = bug.concrete_input\n  open_case(func=bug.location, input=repro, note='deterministic\
      \ reproducer')"
- question: Is coverage-guided fuzzing of our sanitizer-instrumented canary builds discovering new unique-crash
    buckets, especially ones reproducible under MemorySanitizer?
  context: 'This statistical method tracks the unique-crash discovery rate from coverage-guided greybox
    fuzzing (AFL-style) against sanitizer-instrumented canary builds, where crashes are deduplicated by
    execution-path/edge coverage. Alert when a build introduces new unique-crash buckets or when a module''s
    unique-crash count exceeds its historical baseline, and prioritize buckets that also reproduce under
    MemorySanitizer as likely uninitialized-value defects. For the Harden mission, rising unique-crash
    counts after a change point to newly introduced instability, while MSan-confirmed buckets specifically
    implicate uninitialized memory. Baseline per module since fuzzing yields differ widely by code surface
    and harness maturity. References: [American Fuzzy Lop](https://lcamtuf.coredump.cx/afl/technical_details.txt)'
  answer_sources:
  - Compiler diagnostics (-Wuninitialized/-Wmaybe-uninitialized)
  - MemorySanitizer / Valgrind Memcheck reports
  - Static analysis / SAST findings
  - Fuzzing crash artifacts (AFL/libFuzzer)
  - 'NAI: CI/CD pipelines and pre-production canary fleets building and testing in-house C/C++ applications.'
  range: Last 90 days; baseline unique-crash counts per module
  queries:
  - technology: SIEM/Stats pseudocode
    query: "fuzz(canary_with_sanitizers)  # AFL coverage-guided\nbuckets = dedup_crashes_by_edge_coverage()\n\
      for m in modules:\n  if new_buckets(m) or unique_crashes(m) > baseline(m):\n    msan_confirmed =\
      \ [b for b in new_buckets(m) if reproduces_under_MSan(b)]\n    alert(m, new=new_buckets(m), prioritized=msan_confirmed)"
- question: When scoring changed functions in each pull request with vulnerability-detection models, which
    functions or code slices are flagged as likely use-before-definition defects?
  context: 'This ML method scores changed functions in every pull request for vulnerability before merge.
    A graph neural network (Devign-style) operates over joint AST/control-flow/data-flow representations
    whose data-flow edges learn use-before-definition patterns - directly relevant to uninitialized variables.
    Complement it with a dependency-aware sequence model (VulDeePecker-style) that slices code into data/control-dependent
    gadgets and classifies them with a BiLSTM. Surface the implicated function or gadget (the top contributing
    slice) in the finding so reviewers see the location and reason, not just a score. For the Harden mission
    this shifts detection left into code review, catching uninitialized-variable defects before they are
    built or deployed; it requires integration with the PR/CI workflow and trained models. References:
    [Devign](https://proceedings.neurips.cc/paper_files/paper/2019/file/49265d2447bc3bbfe9e76306ce40a31f-Paper.pdf)
    [VulDeePecker](https://arxiv.org/pdf/1801.01681)'
  answer_sources:
  - Compiler diagnostics (-Wuninitialized/-Wmaybe-uninitialized)
  - MemorySanitizer / Valgrind Memcheck reports
  - Static analysis / SAST findings
  - Fuzzing crash artifacts (AFL/libFuzzer)
  - 'NAI: CI/CD pipelines and pre-production canary fleets building and testing in-house C/C++ applications.'
  range: Per pull request; review trailing 90 days of findings
  queries:
  - technology: Python/ML pseudocode
    query: "for fn in pull_request.changed_functions:\n  g = joint_AST_CFG_DFG(fn)\n  score_gnn = devign(g)\
      \            # data-flow edges learn use-before-def\n  gadgets = slice_data_control_dependent(fn)\n\
      \  score_seq = max(vuldeepecker_bilstm(gadgets))\n  if max(score_gnn, score_seq) > threshold:\n\
      \    finding(fn, top_slice=argmax_gadget(gadgets), scores=(score_gnn, score_seq))"
