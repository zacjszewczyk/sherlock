name: 'D3-CR: Credential Revocation'
id: 8cf19d9d-c586-46cf-aa90-821e5b683d60
description: Investigate whether credential revocation actions taken to evict an adversary were timely,
  complete, and effective. This playbook helps an analyst confirm that revocation events fired for compromised
  accounts within the control SLA, that pre-existing sessions were terminated, and that the account can
  no longer establish new access on enterprise systems. It extends to federated, cloud, and Kerberos identities,
  verifying that the full token and ticket graph was invalidated (krbtgt double-reset, OAuth/OIDC refresh-token
  revocation, Entra sign-in-session revocation and Continuous Access Evaluation, and verifiable-credential
  status publication). The questions combine deterministic symbolic-logic checks, statistical baselining
  of eviction latency, residual sessions, and post-revocation success-versus-failure authentication signals,
  and machine-learning anomaly scoring of post-revocation login paths to distinguish a clean eviction
  (failed reauthentication, adversary probing) from surviving persistence (clean successful authentication
  after revocation, residual sessions, forged tickets, or token reuse).
type: technique
related:
- tactic_id: D3-EV
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: After a planned credential revocation, did the corresponding password-reset (Windows Event
    ID 4724) or account-deletion (Windows Event ID 4726) event fire for the target identity within the
    control SLA, and were all pre-existing logon sessions terminated (Windows Event ID 4634/4647)?
  context: This deterministic completeness check confirms the revocation actually executed against the
    directory and that eviction was total rather than partial. Per NIST SP 800-63B a revocation is incomplete
    until every bound authenticator and active session is terminated, so it is not enough to see a single
    4724/4726 - you must also see correlated logoff events for the account's existing sessions. If the
    4724/4726 is missing or arrives after the SLA (for example more than 5 minutes after the revocation
    decision), or if active sessions persist without a matching 4634/4647, that is a control failure indicating
    the adversary may retain access. A positive result (revocation event plus session terminations within
    SLA) confirms the Evict action landed on the directory side.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days; pivot to a window starting at the revocation decision timestamp
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      let revoke = EventID in (4724,4726) for TargetAccount;
      let logoff = EventID in (4634,4647) for TargetAccount after revoke.time;
      alert if revoke.time - decision.time > 5min
         OR not exists(logoff within SLA for each pre-existing session)
- question: Starting at the revocation timestamp, did any successful authentication (Windows Event ID
    4624), Kerberos TGT request (Windows Event ID 4768), or correlated network session (Zeek conn.log)
    occur that is attributable to the revoked account?
  context: Any successful authentication or new session for a revoked identity is structurally anomalous
    and indicates incomplete eviction or credential reuse. CISA AA20-245A warns that partial remediation
    lets adversaries re-establish access, so this rule runs immediately from the revocation timestamp
    forward. Tie network sessions back to the identity via source host, Kerberos service tickets, or proxy/VPN
    logs. A positive hit (any post-revocation 4624/4768 or attributable conn.log session) must be escalated
    as surviving persistence; a clean negative across the eviction window supports a successful Evict.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days; alert window opens at the revocation timestamp
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      let t0 = revocation.time for Account;
      alert if exists(EventID in (4624,4768) for Account where time >= t0)
         OR exists(conn.log session attributable to Account where ts >= t0)
- question: What is the eviction latency (time from revocation to the account's last observed activity),
    and does it exceed the per-cohort 95th percentile when broken out by business unit and account type?
  context: 'Eviction latency L = t_last_activity - t_revocation measures how long the account remained
    operationally alive after the revocation decision. Tracking mean, median, and p95 by business unit
    and account type reveals systemic gaps in the revocation process and outlier accounts that lingered
    far longer than peers. Derive expected-latency thresholds from historical incidents and benchmark
    authentication datasets such as the LANL Comprehensive Multi-Source Cyber-Security Events corpus.
    Any L exceeding the cohort p95 is flagged for review: a large latency means the adversary had an extended
    window of continued access after eviction was supposed to have completed.'
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      L = t_last_activity - t_revocation per Account;
      by (business_unit, account_type): compute mean, median, p95(L);
      flag Account where L > p95(cohort)
- question: How many active sessions remained for the revoked account at 5, 15, and 60 minutes after revocation,
    and did the account create any new source-to-destination network edges during the eviction window?
  context: Counting residual sessions at fixed checkpoints (5/15/60 minutes) and baselining that distribution
    across incidents reveals whether session termination kept pace with the revocation. Escalate revocations
    whose residual-session counts exceed expected thresholds. Additionally, treat every NEW source->destination
    edge the revoked identity creates during the eviction window as improbable using calibrated first-time-edge
    scoring (Metelli & Heard). A revoked account that is still opening new connections is a strong indicator
    of surviving persistence or credential reuse, whereas a steadily decaying residual-session count with
    no new edges supports a clean eviction.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days; checkpoint sampling at +5/+15/+60 min after revocation
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for cp in [5,15,60] min after revocation:
         residual[cp] = count(active sessions for Account);
      alert if residual[cp] > baseline_threshold[cp];
      for each new (src->dst) edge by Account in window:
         score = first_time_edge_prob(src,dst); alert if score improbable
- question: After revocation, did the revoked identity generate a spike in FAILED authentication signals
    (Windows Event ID 4625, KDC failures 4768/4769 with KDC_ERR_C_PRINCIPAL_UNKNOWN or KDC_ERR_CLIENT_REVOKED,
    and lockout 4740) versus CLEAN successful authentications (4624)?
  context: This baselines the failure-mode signals that distinguish a successful eviction from surviving
    persistence. A spike in FAILED reauthentication (counts/min of 4625, KDC errors KDC_ERR_C_PRINCIPAL_UNKNOWN
    / KDC_ERR_CLIENT_REVOKED, and account-lockout 4740) indicates the adversary lost access and is now
    probing - a GOOD outcome that confirms eviction worked. Conversely, CLEAN successful 4624 events after
    revocation indicate surviving persistence and credential survival. Per CISA AA20-245A you must explicitly
    distinguish these two regimes rather than treating all post-revocation activity identically; report
    the success-vs-failure ratio over time.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days; rate computed per minute from revocation timestamp
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      fails = countPerMin(EventID 4625 OR 4768/4769 with KDC_ERR_CLIENT_REVOKED/PRINCIPAL_UNKNOWN OR 4740) for Account after t0;
      succ  = count(EventID 4624 for Account after t0);
      if fails spikes AND succ==0: GOOD eviction (probing);
      if succ>0: BAD surviving persistence
- question: When post-revocation authentications or residual sessions are ranked by surprise using temporal
    link prediction over the authentication graph and causal login-path scoring with credential-switch
    detection, which events score as highly anomalous?
  context: This ML layer runs in parallel to the deterministic post-revocation-access rule to catch subtle
    survival that escapes simple rules. Temporal link prediction over the authentication graph (Euler)
    models normal who-authenticates-to-what dynamics, while causal login-path scoring with credential-switch
    detection (Hopper) reconstructs lateral-movement paths and flags credential switching. Together they
    rank post-revocation authentications and residual sessions by how improbable they are. Surface the
    top-3 contributing features (for example new destination host, credential switch, off-hours timing)
    in the alert text so an analyst can quickly adjudicate. High-surprise post-revocation logins corroborate
    surviving footholds and should be escalated alongside the deterministic rule.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      G = auth_graph(EventID 4624/4768, conn.log);
      scores = Euler.temporal_link_predict(G after t0)
               + Hopper.login_path_score(credential_switch=True);
      rank post-revocation events by surprise; emit top-3 features
- question: Does masked graph representation learning over the user-asset/process interaction graph reveal
    anomalous continuation of activity after revocation that indicates a surviving foothold (backdoor
    or residual session)?
  context: Build a user-asset/process interaction graph from Windows Event ID 4624 and Zeek telemetry,
    then apply masked graph representation learning with concept-drift handling (MAGIC) to score post-revocation
    cluster activity. Unlike per-event rules, this captures whether an entire cluster of behavior tied
    to the revoked identity continues anomalously after eviction - a signature of backdoors or residual
    sessions that survived credential revocation. Report the top contributing entities (hosts, processes,
    peers) in the alert so the analyst can target containment. A clean result (no anomalous continuation)
    supports successful eviction; flagged continuation indicates the adversary retained access through
    a non-credential persistence mechanism that revocation alone did not remove.
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      G = user_asset_process_graph(EventID 4624, Zeek);
      emb = MAGIC.masked_graph_repr(G, concept_drift=True);
      score post-revocation clusters; alert on anomalous continuation;
      report top contributing entities
- question: Does the observed sequence of revocation-related log events deviate from the expected revocation
    workflow (revoke 4724/4726 -> session-termination 4634 -> no further authentication)?
  context: 'Model the expected revocation workflow as a log-key sequence and use an LSTM sequence detector
    (DeepLog) to flag deviations. The healthy pattern is: revocation event (4724/4726), followed by session
    termination (4634), followed by no further authentication for the account. Deviations - such as authentication
    events appearing after revocation, or missing revocation/termination steps entirely - indicate either
    an incomplete control workflow or active adversary survival. Surface the top contributing log keys
    for explainability so the analyst can see exactly which step was out of place. This catches process-level
    gaps that point-in-time rules may miss.'
  answer_sources:
  - Windows Event ID 4724
  - Windows Event ID 4726
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4768
  - Zeek conn.log
  - 'NAI: Domain Controllers, Identity and Access Management (IAM) Systems, Network Egress Points, Critical
    Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      seq = log_key_sequence(EventID 4724/4726, 4634, auth events) per Account;
      model = DeepLog.LSTM(expected: revoke->terminate->no-auth);
      flag seq where auth follows revoke OR steps missing;
      emit top contributing log keys
- question: Was the krbtgt account password reset TWICE to fully invalidate Kerberos tickets, and after
    the reset are there any Golden/Silver-ticket survival signatures - TGTs with non-default lifetimes,
    encryption downgrade, time anomalies, or 4768/4769 tickets issued for revoked or deleted accounts?
  context: 'True Kerberos eviction requires resetting the krbtgt account password twice (with replication
    between resets) because a single reset still allows previously forged or minted tickets to be used
    until the second reset purges the prior key. After the double-reset, alert on forged-ticket survival
    signatures: TGTs with non-default lifetimes, encryption downgrade (for example RC4 where AES is expected),
    time anomalies between authentication and service-ticket requests, and 4768/4769 events for accounts
    that were revoked or deleted. Per Microsoft Defender for Identity and CISA AA20-245A eviction-completeness
    guidance, any such signature indicates a Golden or Silver ticket survived the revocation and the adversary
    retains domain access.'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4770
  - Microsoft Entra sign-in logs (interactive and non-interactive)
  - OAuth/OIDC token revocation logs
  - Microsoft Defender for Identity alerts
  - 'NAI: Domain Controllers, Identity Providers (Entra ID/Okta), OAuth Authorization Servers, Critical
    SaaS Applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      verify krbtgt password reset count == 2 (with replication between);
      alert if EventID 4768/4769 has non-default TGT lifetime
         OR encryption downgrade (RC4)
         OR time anomaly
         OR ticket for revoked/deleted account
- question: For federated and cloud identities, was the full OAuth refresh-token graph revoked (so dependent
    access tokens from the same grant are invalidated), and did account disable + password reset + sign-in-session
    revocation all complete with Continuous Access Evaluation in effect?
  context: Per RFC 7009, revoking a refresh token must invalidate the dependent access tokens issued from
    the same grant; if the refresh-token graph is not fully revoked the adversary can keep minting access.
    Per Microsoft Entra guidance, complete eviction of a cloud identity requires account disable, password
    reset, AND sign-in-session revocation - a missing revoke-sign-in-session step, or absent Continuous
    Access Evaluation (CAE), is a control gap that leaves a residual-validity window open. Confirm each
    step appears in the token-revocation and sign-in logs. A positive verification (all steps present,
    CAE enabled) confirms cloud eviction; any missing step is flagged as an incomplete revocation.
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4770
  - Microsoft Entra sign-in logs (interactive and non-interactive)
  - OAuth/OIDC token revocation logs
  - Microsoft Defender for Identity alerts
  - 'NAI: Domain Controllers, Identity Providers (Entra ID/Okta), OAuth Authorization Servers, Critical
    SaaS Applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      require events: account_disable AND password_reset AND revoke_sign_in_session for User;
      require refresh_token_revocation covers full grant graph;
      alert if any step missing OR Continuous_Access_Evaluation == disabled
- question: For verifiable credentials, was the credential's revocation status published to the status
    list within SLA so relying parties fail closed, and has any successful presentation or verification
    of a revoked credential been observed?
  context: Verifiable-credential revocation depends on publishing the credential's revocation status to
    a status list that relying parties check on presentation, so they fail closed when a revoked credential
    is presented. Confirm the status-list update occurred within SLA after the revocation decision (per
    Microsoft Verified ID guidance). Then alert on any successful presentation or verification of a credential
    that should be revoked - that indicates either the status list was not updated in time or a relying
    party is not checking it. A timely status publication with no successful revoked-credential presentations
    confirms this part of the eviction; otherwise it is a control gap.
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4770
  - Microsoft Entra sign-in logs (interactive and non-interactive)
  - OAuth/OIDC token revocation logs
  - Microsoft Defender for Identity alerts
  - 'NAI: Domain Controllers, Identity Providers (Entra ID/Okta), OAuth Authorization Servers, Critical
    SaaS Applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      verify status_list_update for Credential within SLA of revocation;
      alert if exists(successful presentation/verification of revoked Credential)
- question: After revocation, how many successful resource accesses or non-interactive sign-ins used a
    token issued BEFORE the revocation timestamp (within the residual-validity window), and what is the
    rate of post-revocation token-refresh FAILURES (AADSTS50173 / invalid_grant)?
  context: 'Microsoft Entra notes that access tokens remain valid for up to ~1 hour after revocation unless
    Continuous Access Evaluation is enabled, creating a residual-validity window an adversary can exploit.
    Baseline and alert on the COUNT of successful resource accesses or non-interactive sign-ins using
    a token issued before the revocation timestamp - these represent surviving access. Simultaneously
    profile token-refresh FAILURES (AADSTS50173, invalid_grant) as a distinct success-vs-failure signal
    per RFC 7009: a rise in refresh failures means the revocation is biting and the adversary cannot renew
    access (good), while continued successful resource access on pre-revocation tokens means the residual
    window is being abused (bad). Enabling CAE collapses this window.'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4770
  - Microsoft Entra sign-in logs (interactive and non-interactive)
  - OAuth/OIDC token revocation logs
  - Microsoft Defender for Identity alerts
  - 'NAI: Domain Controllers, Identity Providers (Entra ID/Okta), OAuth Authorization Servers, Critical
    SaaS Applications'
  range: Last 90 days; focus on the ~1 hour residual-validity window after revocation
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      surviving = count(successful access/non-interactive sign-in where token.iat < t_revocation);
      refresh_fail = count(AADSTS50173 OR invalid_grant after t_revocation);
      alert if surviving > 0;
      trend refresh_fail (rise = good eviction) vs surviving (rise = bad)
- question: When post-revocation cloud sign-ins are ranked by surprise using graph anomaly scoring over
    user-resource-action sign-in graphs and temporal link prediction, which sign-ins score as highly anomalous
    (new app/resource, unusual IP/ASN, old token age)?
  context: This ML layer is overlaid on the deterministic token-use rule to surface subtle cloud survival.
    Graph anomaly scoring over user-resource-action sign-in graphs (MAGIC) and temporal link prediction
    (Euler) learn normal cloud access patterns and rank post-revocation sign-ins by how improbable they
    are. Surface the top-3 contributing features - new application or resource, unusual IP/ASN, and token
    age (a token older than the revocation timestamp) - in the alert text so the analyst can adjudicate
    quickly. High-surprise post-revocation cloud sign-ins corroborate residual-window abuse or refresh-token
    survival and should be escalated alongside the deterministic checks.
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4770
  - Microsoft Entra sign-in logs (interactive and non-interactive)
  - OAuth/OIDC token revocation logs
  - Microsoft Defender for Identity alerts
  - 'NAI: Domain Controllers, Identity Providers (Entra ID/Okta), OAuth Authorization Servers, Critical
    SaaS Applications'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      G = sign_in_graph(user, resource, action);
      scores = MAGIC.graph_anomaly(G after t0) + Euler.temporal_link_predict(G);
      rank post-revocation cloud sign-ins by surprise;
      emit top-3 features (new app/resource, IP/ASN, token-age)
