name: 'D3-DNR: Decoy Network Resource'
id: 0447603e-65be-44b1-9ace-746656dbeca9
description: Investigate interactions with deployed decoy network resources (honeypots, honey-accounts,
  honeytokens, and tarpits) to surface adversary reconnaissance, credential theft, and lateral movement.
  Because legitimate users have no reason to touch a decoy, any non-whitelisted connection, authentication
  attempt, honeytoken hit, or scan against unallocated/dark IP space is unauthorized by construction and
  constitutes high-fidelity evidence of adversary engagement. This playbook helps an analyst alert on
  first-contact with decoy hosts, accounts, and credentials; correlate multi-stage interaction patterns
  (repeated connections, decoy DNS lookups, and successful logons); baseline decoy background-noise and
  dark-space failure rates to separate meaningful interaction from internet scanning; detect coordinated
  campaigns through source-diversity and burstiness statistics; and apply time-series anomaly detection
  and session clustering/classification to attribute and triage attacker tooling. It spans Zeek network
  telemetry, Windows authentication events, firewall, and NetFlow sources to deliver near-zero-false-positive
  tripwires under the Decoy Object tactic.
type: technique
related:
- tactic_id: D3-DO
  tactic_name: Decoy Object
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any source not on the explicit maintenance/scanner whitelist established a session to
    a decoy host's IP or port (per Zeek conn.log), and did a correlated Windows 4624 authentication event
    occur on that decoy host within the same session window?
  context: 'Decoy network resources have no legitimate users, so under the Decoy Object tactic the alert
    threshold is a single connection: any non-whitelisted session targeting a decoy is unauthorized reconnaissance
    or engagement by definition. Filter Zeek conn.log for destinations matching the decoy IP/port inventory,
    excluding only the explicit maintenance and vulnerability-scanner whitelist, then raise severity when
    a Windows Event ID 4624 logon lands on the decoy host inside the same session window. A positive result
    is high-fidelity adversary activity; a clean window means the decoy saw no human interaction beyond
    known maintenance.'
  answer_sources: &id001
  - Zeek conn.log
  - Windows Event ID 4624
  - Zeek dns.log
  - 'NAI: The decoy network server (e.g., a server hosting a fake file share or internal web application).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_conn.log\nWHERE dest_ip IN decoy_ips AND dest_port IN decoy_ports\n  AND src_ip\
      \ NOT IN maintenance_scanner_whitelist\n| ALERT severity='high' 'decoy_access_attempt'\n| JOIN win_4624\
      \ ON host=dest_ip WITHIN session_window\n| WHEN matched RAISE severity='critical' WITH src_ip, logon_type"
- question: Within a rolling window, has a single source touched multiple distinct decoy services, performed
    decoy DNS lookups, and followed a TCP connect with a successful logon (e.g., >=3 distinct decoy services
    or a connect-then-4624 sequence) that distinguishes active engagement from a stray packet?
  context: A single benign stray packet differs sharply from a deliberate adversary working through a
    decoy. Under the Decoy Object tactic, correlate repeated conn.log connection attempts, dns.log lookups
    for decoy hostnames, and successful authentication or lateral-movement attempts from the same source
    within a rolling window. A source hitting three or more distinct decoy services, or completing a TCP
    connect followed by a Windows 4624 logon, is exhibiting multi-stage engagement. Surface the matched
    stages in the alert so the analyst can reconstruct the adversary's path.
  answer_sources: *id001
  range: Last 90 days; correlate events within a rolling 1-hour window per source
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_conn.log, zeek_dns.log, win_4624

      WHERE dest/query IN decoy_inventory

      | BIN rolling=1h BY src_ip

      | STATS distinct_services=dcount(decoy_service), dns_lookups=count(dns), has_connect_then_logon=seq(tcp_connect
      -> 4624)

      | WHERE distinct_services >= 3 OR has_connect_then_logon

      | ALERT ''multi_stage_decoy_engagement'' WITH matched_stages'
- question: Did any embedded honeytoken (a decoy URL, DNS name, document, or fake API key planted in a
    decoy resource) get triggered, and what triggering source IP, timestamp, and token type does the hit
    carry?
  context: Honeytokens are unique artifacts placed inside decoy resources that nothing legitimate should
    ever access, so any first interaction is a near-zero-false-positive confirmed reconnaissance event
    under the Decoy Object tactic. Instrument decoys with unique decoy URLs, DNS names, documents, and
    fake API keys, and alert on the first request or use of each token, capturing the source IP, timestamp,
    and token type for explainable attribution. A token hit deterministically proves an adversary discovered
    and interacted with the decoy; treat it as confirmed and pivot on the source IP.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM honeytoken_events (zeek_http/dns + token_service)\nWHERE token_id IN planted_honeytokens\n\
      | ALERT 'honeytoken_triggered' severity='critical'\n  WITH src_ip, ts, token_type"
- question: Over rolling windows, which non-whitelisted decoy sessions exceed the per-decoy 95th-percentile
    thresholds for session duration, orig_bytes, or resp_bytes, marking them as meaningful interaction
    rather than internet background scanning?
  context: Internet background noise constantly grazes exposed decoys, so raw connection counts alone
    are noisy. Under the Decoy Object tactic, profile each decoy's own traffic over rolling windows and
    compute 95th-percentile thresholds for session duration, orig_bytes, and resp_bytes; derive these
    per-decoy because exposure varies widely. Flag non-whitelisted sessions exceeding those thresholds
    as meaningful interaction and report the offending volume/duration in the alert. A session that transfers
    or sustains far more than the decoy's background baseline indicates an adversary actually engaging
    the resource, not a transient scan.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn.log WHERE dest_ip IN decoy_ips

      | STATS p95_dur=pct95(duration), p95_orig=pct95(orig_bytes), p95_resp=pct95(resp_bytes) BY dest_ip
      OVER rolling_window

      | JOIN current sessions WHERE src_ip NOT IN whitelist

      | WHERE duration>p95_dur OR orig_bytes>p95_orig OR resp_bytes>p95_resp

      | ALERT ''meaningful_decoy_interaction'' WITH duration, bytes'
- question: Are hourly unique-source counts, repeat-visitor rates, or connection-burst metrics against
    decoys rising sustainedly above the rolling mean + 3 sigma, indicating a coordinated reconnaissance
    campaign rather than steady internet noise?
  context: A coordinated campaign manifests as a statistical departure from the steady hum of internet
    scanning. Under the Decoy Object tactic, monitor hourly unique-source counts, repeat-visitor rates,
    and burst metrics (connections per minute) against the decoy fleet, and escalate sustained increases
    above the rolling mean + 3 sigma. A sudden surge in distinct sources or a burst of rapid connections
    signals an organized reconnaissance effort; isolated spikes that revert are likely transient noise.
    Report the contributing metric and source diversity in the alert.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn.log WHERE dest_ip IN decoy_ips

      | BIN time SPAN=1h

      | STATS uniq_src=dcount(src_ip), repeat_rate=..., conns_per_min=max(rate) BY bin

      | WHERE uniq_src > rolling_mean + 3*rolling_std

      | ALERT ''coordinated_decoy_campaign'' WITH uniq_src, burst'
- question: Do time-series anomaly models trained on hourly decoy connection counts and transfer volumes
    flag deviations from expected background-noise patterns, and what are the top-3 contributing features
    (e.g., unique-source spike, byte volume, new destination port)?
  context: 'Seasonal and bursty decoy traffic defeats static thresholds, so model the expected pattern
    directly. Under the Decoy Object tactic, train time-series anomaly models (seasonal decomposition
    or robust z-score) on hourly decoy connection counts and transfer volumes, and alert on deviations
    from the learned background-noise baseline. Include the top-3 contributing features in the alert text
    so analysts can triage quickly: a spike in unique sources, a jump in byte volume, or a newly contacted
    destination port each tells a different story about adversary behavior.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "ts = hourly_series(zeek_conn.log: conn_count, byte_volume BY decoy)\nmodel = seasonal_decompose_or_robust_zscore.fit(ts_history)\n\
      resid = model.score(ts_current)\nFOR bin WHERE abs(resid) > threshold:\n  emit alert WITH top3 =\
      \ contributing_features(unique_src, bytes, new_port)"
- question: When per-source interaction sequences on the decoy (commands, protocol function codes, accessed
    services, byte volumes) are encoded and clustered, which sources group into recurring campaigns, and
    does a supervised classifier flag known adversary tooling?
  context: Adversaries reuse tooling and tradecraft, leaving repeatable interaction signatures on decoys.
    Under the Decoy Object tactic, encode each source's interaction sequence (commands, protocol function
    codes, accessed services, byte volumes) and cluster sources to group and attribute campaigns; bootstrap
    a supervised classifier from labeled decoy captures to flag recurring adversary tooling. Output the
    cluster label and top contributing features per alert so analysts can link new activity to known campaigns
    and prioritize confirmed tooling over opportunistic noise.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = encode_sequences(per_source: commands, func_codes, services, byte_volumes)\nclusters =\
      \ cluster(X)\nclf = supervised_classifier.fit(labeled_decoy_captures)\nFOR src:\n  label = clf.predict(X[src]);\
      \ emit alert WITH cluster_label, top_features"
- question: Did any Windows 4624 (success), 4625 (failure), or 4768 (Kerberos TGT request) event target
    a provisioned decoy/honey-account, and what source host, logon type, and result accompanied it?
  context: Decoy accounts have no legitimate use, so a single authentication event against one is a deterministic
    tripwire under the Decoy Object tactic. Fire a critical alert on any Windows Event ID 4624, 4625,
    or 4768 whose target account matches the provisioned decoy/honey-account list, with a threshold of
    one event. A logon attempt - successful or failed - against a decoy identity signals credential theft,
    password spraying, or insider reconnaissance. Include the source host, logon type, and result so the
    analyst can immediately pivot to the originating system.
  answer_sources: &id002
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4768
  - 'NAI: Domain controllers and the decoy host where decoy accounts and honeytoken credentials are provisioned.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM win_security WHERE EventID IN (4624,4625,4768)\n  AND TargetAccount IN decoy_account_list\n\
      | ALERT 'decoy_account_logon' severity='critical'\n  WITH SourceHost, LogonType, Result"
- question: Has any authentication attempt used the exact credentials planted as honeytokens in config
    files, registry keys, scripts, or GPP/SYSVOL locations, deterministically proving an attacker harvested
    and used planted secrets?
  context: Seeding decoy credentials in the very places attackers look - config files, registry keys,
    scripts, and GPP/SYSVOL - turns credential harvesting into a detectable event under the Decoy Object
    tactic. Alert on any authentication attempt using those exact planted credentials. Because no legitimate
    process knows these secrets, a match deterministically proves an adversary discovered and attempted
    to use them, confirming both the harvesting location and an active credential-abuse attempt. Pivot
    on the source host and the harvest location to scope the intrusion.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM win_security WHERE EventID IN (4624,4625,4768)\n  AND (TargetAccount, credential_hash)\
      \ IN planted_honeytoken_creds\n| ALERT 'honeytoken_credential_used' severity='critical'\n  WITH\
      \ SourceHost, harvest_location"
- question: Over time, what is the 4625 failure count and distinct-source-host count per decoy account,
    and is the failure-vs-success ratio indicating password spraying/brute force versus a credential compromise
    (a success after failures)?
  context: 'The pattern of failures and successes against decoy identities distinguishes brute-force reconnaissance
    from successful compromise. Under the Decoy Object tactic, track Windows 4625 failure counts and distinct
    source hosts per decoy account over time: a burst of failed logons indicates password spraying or
    brute force, while a 4624 success following failures indicates credential compromise. Profile failure
    signals (failed logons, blocked connections) as distinct from successes and report the failure-vs-success
    ratio in the alert so analysts can tell attempted access from achieved access.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM win_security WHERE TargetAccount IN decoy_account_list

      | STATS fails=count(4625), uniq_src=dcount(SourceHost), succ=count(4624) BY TargetAccount, window

      | EVAL fail_success_ratio=fails/max(succ,1)

      | WHERE fails > burst_threshold OR (succ>0 AND fails>0)

      | ALERT ''decoy_account_spray_or_compromise'' WITH fail_success_ratio, uniq_src'
- question: Has any connection attempt reached decoy IPs/ports on unallocated/dark IP space, where only
    virtual decoys live and no legitimate traffic exists, warranting a first-packet high-confidence reconnaissance
    alert?
  context: Unallocated/dark IP space and unused service ports host only tarpits and virtual decoys, so
    any contact is inherently suspicious under the Decoy Object tactic. Treat any connection attempt to
    these decoy IPs/ports as a high-confidence reconnaissance indicator and alert on the first packet,
    since these addresses see no legitimate traffic. Correlate Zeek conn.log, firewall logs, and NetFlow
    to capture both completed and dropped attempts. A positive result identifies a scanning or lateral-movement
    source probing space it should never know about.
  answer_sources: &id003
  - Zeek conn.log
  - Firewall logs
  - NetFlow
  - 'NAI: Decoy/virtual hosts and tarpits deployed on unallocated IP space and unused service ports.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_conn.log, firewall_logs, netflow\nWHERE dest_ip IN dark_space_decoy_ips OR dest_port\
      \ IN unused_decoy_ports\n| ALERT 'dark_space_contact' severity='high' ON first_packet\n  WITH src_ip,\
      \ dest_ip, dest_port"
- question: Which sources exceed deterministic scan thresholds for negative responses (TCP RST, ICMP unreachable,
    blocked/dropped firewall events) and host/port fan-out within tunable windows, and what scan type,
    source, and host/port counts characterize them?
  context: Scanning produces a characteristic signature of negative responses and wide host/port fan-out
    that deterministic counting can capture. Under the Decoy Object tactic, count negative responses (TCP
    RST, ICMP unreachable, blocked/dropped firewall events) and host/port fan-out per source within tunable
    windows, flagging sources that exceed thresholds (e.g., portscan/portsweep at sense_level medium,
    in the style of Snort sfPortscan). Emit the scan type, source, and host/port counts for explainability.
    High fan-out with many negative responses against decoy/dark space is a strong reconnaissance indicator.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_conn.log, firewall_logs

      WHERE dest IN decoy_dark_space

      | STATS neg_resp=count(RST|ICMP_unreach|dropped), host_fanout=dcount(dest_ip), port_fanout=dcount(dest_port)
      BY src_ip, window

      | WHERE host_fanout>threshold OR port_fanout>threshold OR neg_resp>threshold

      | ALERT ''scan_detected'' WITH scan_type, host_fanout, port_fanout'
- question: Is the rate of failed/blocked connections and the count of distinct destination ports touched
    per source against dark space sustainedly elevated above the rolling baseline, distinguishing active
    scanning campaigns from stray broadcast/misconfiguration traffic?
  context: Legitimate sessions to decoy/dark space are near zero, so the failure rate itself is the signal.
    Under the Decoy Object tactic, profile the rate of failed/blocked connections and the number of distinct
    destination ports touched per source; sustained elevation above the rolling baseline distinguishes
    an active scanning campaign from stray broadcast or misconfiguration traffic that produces brief,
    low-port-diversity blips. Report the failure rate and port diversity in the alert. A source persistently
    generating blocked connections across many ports is conducting reconnaissance.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM firewall_logs, zeek_conn.log WHERE dest IN dark_space

      | STATS fail_rate=rate(blocked|failed), port_div=dcount(dest_port) BY src_ip, window

      | WHERE fail_rate > rolling_baseline + k*std OR port_div > baseline

      | ALERT ''sustained_dark_space_scanning'' WITH fail_rate, port_div'
- question: Are deployed decoys scoring well on realism/enticement (service banners, naming, content)
    so they blend into the environment and reliably attract interaction rather than being trivially fingerprinted
    and avoided, preserving detection coverage?
  context: A decoy that adversaries can trivially fingerprint and avoid provides no detection value, so
    decoy quality is itself a monitored metric under the Decoy Object tactic. Periodically score decoy
    realism and enticement across service banners, naming conventions, and content, comparing them to
    the surrounding real assets (e.g., NLP-based honeyfile enticement scoring). Decoys that blend in reliably
    attract interaction and sustain coverage; decoys scoring poorly are likely being bypassed and create
    blind spots. A low score should drive remediation of the decoy, not an adversary alert, but it directly
    governs the trustworthiness of every other detection here.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM decoy_inventory

      | SCORE realism = f(banner_similarity, naming_consistency, content_plausibility) vs real_assets

      | WHERE realism < enticement_threshold

      | REPORT ''low_enticement_decoy_needs_refresh'' WITH decoy_id, realism_score'
