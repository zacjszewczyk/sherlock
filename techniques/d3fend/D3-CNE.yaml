name: 'D3-CNE: Content Excision'
id: 55bf7841-a0af-43bd-925f-6e5e9878f0b7
description: Investigate the effectiveness of Content Excision (Content Disarm and Reconstruction, CDR,
  and sanitization) controls in isolating malicious content from reaching endpoints. This playbook helps
  an analyst verify that inbound files passing through web proxies, email gateways, and the CDR/sanitization
  engine were properly disarmed (macros, scripts, and embedded objects removed; images, PDFs, and models
  re-encoded) and to surface gaps where active content survived excision. It combines gateway and proxy
  CDR telemetry (comparing pre- and post-excision file structure, metadata, and signature matches) with
  endpoint execution-time telemetry that catches excision misses which only manifest on open, such as
  a supposedly-disarmed document spawning interpreters or LOLBins. Methods span deterministic symbolic-logic
  floor rules, statistical coverage, anomaly, and rarity analysis, and machine-learning false-negative
  prediction and anomaly scoring, so analysts can measure sanitization coverage, detect tool degradation
  or attacker evasion, and prioritize high-risk deliveries for secondary detonation or manual review.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are all inbound files of mandatory-excision, high-risk MIME types (Office OOXML, legacy Word,
    PDF, Windows executables, JPEG images, ZIP archives) being delivered only AFTER a successful sanitize/flatten/reconstruct
    outcome, or are any reaching endpoints delivered-unscanned?
  context: 'Supports the Isolate tactic by enforcing a deterministic floor rule: structural infection
    vectors for these formats are well enumerated, so every file on the mandatory-excision list must carry
    an excision disposition before delivery. Correlate Zeek files.log entries for predefined high-risk
    MIME types against CDR/sanitization disposition logs. A positive finding (file delivered with State
    = delivered-unscanned rather than excised) means the isolation control was bypassed and active content
    may have reached the endpoint. Tune the MIME list to the environment but never remove this deterministic
    floor, which catches gross control failures that statistical and ML methods cannot safely replace
    under evasion.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      files.log
      | where mime_type in (application/vnd.openxmlformats, application/msword,
          application/pdf, application/x-dosexec, image/jpeg, application/zip)
      | join cdr_disposition on fuid
      | where disposition != "excised"   // delivered-unscanned
      => alert: mandatory-excision MIME delivered without sanitize/flatten/reconstruct
  - technology: SIEM/Rule pseudocode
    query: |-
      FROM files JOIN cdr_disposition ON file_id
      WHERE mime_type IN (mandatory_excision_list)
        AND state != 'excised'
      => ALERT 'high-risk MIME delivered-unscanned'
- question: After excision, are all active-content structural paths actually absent from delivered documents
    (PDF /OpenAction, /AA, /JavaScript, /JS, /Launch, /EmbeddedFile; OOXML vbaProject.bin, oleObject,
    external relationships), and for images and models do only allowlisted structures remain?
  context: Supports Isolate by verifying the reconstruction step structurally removed the dangerous elements
    rather than merely flagging them. Parse each delivered document into its structure-path representation
    and assert prohibited active-content paths are gone post-excision. Raise an alert when any prohibited
    path survives despite an excision-success status; this is direct, structural proof that the disarm
    step failed and the file remains weaponizable. For images and ML models, the analogous check confirms
    only allowlisted structures remain after reconstruction.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each delivered_doc WHERE disposition == 'excision-success':
        paths = parse_structure(delivered_doc)   // Hidost-style structure paths
        IF doc is PDF AND any(p in paths for p in
             [/OpenAction,/AA,/JavaScript,/JS,/Launch,/EmbeddedFile])
        OR doc is OOXML AND any(p in paths for p in
             [vbaProject.bin, oleObject, external_relationship])
        OR doc is image/model AND any(p NOT in allowlist)
        THEN ALERT 'prohibited active-content path survived excision'
- question: When static analyzers are re-run on the DELIVERED (post-excision) file, does any active content
    remain, such as surviving AutoExec macros, Shell or download keywords, VBA stomping, embedded OLE
    objects, or YARA signature matches, despite an excision-success status?
  context: 'Supports Isolate by independently re-validating the post-excision artifact with the same tooling
    an attacker''s payload would trip. Run oletools olevba/mraptor on the delivered file and re-match
    Neo23x0 signature-base YARA rules. Any post-excision hit despite an excision-success disposition indicates
    a miss: the engine reported success but left executable or active content behind. A negative result
    (no hits) increases confidence the file was genuinely disarmed.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each delivered file WHERE disposition == 'excision-success':
        r = olevba/mraptor(file)   // AutoExec, Shell/download, VBA stomping, embedded OLE
        y = yara_match(file, Neo23x0_signature_base)
        IF r.active_content OR y.matched
        THEN ALERT 'active content remains post-excision (miss)'
- question: What is the daily sanitization coverage and miss rate by file type, ingress channel, and business
    unit, and is coverage for mandatory-excision types falling below the control threshold (e.g., <99%)
    or is the post-excision active-content re-match rate exceeding baseline?
  context: Supports Isolate by measuring how completely the excision control is operating across the fleet.
    Calculate sanitized-vs-unsanitized ratios and miss rates (Volume = byte/file counts; Frequency = files/min)
    segmented by file type, channel, and business unit. Alert when coverage for mandatory types drops
    below the threshold or when the failed-sanitization re-match rate rises. Derive per-environment thresholds
    from the observed benign distribution rather than fixed constants. A sustained coverage drop points
    to systemic isolation failure, such as a misconfigured channel or an overwhelmed engine.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      stats by day, file_type, channel, business_unit:
        coverage  = excised_count / total_count
        miss_rate = failed_sanitization_count / total_count
      threshold = benign_distribution_percentile()   // not a fixed constant
      ALERT WHEN file_type in mandatory AND coverage < 0.99
      ALERT WHEN post_excision_rematch_rate > baseline
- question: Are there anomalous shifts (residual spikes) in the hourly or daily count of sanitized files
    per type once business-hours and weekly seasonality are accounted for, suggesting tool degradation,
    attacker evasion, or campaign activity?
  context: Supports Isolate by separating real changes in excision behavior from normal business rhythm.
    Apply Seasonal-Hybrid ESD (STL or median decomposition plus Generalized ESD with median/MAD on residuals)
    to sanitized file counts per type. Isolated residual spikes that respect seasonality can indicate
    the engine started failing (fewer sanitized files), an evasion technique causing skips, or a delivery
    campaign overwhelming the control. A positive anomaly should be triaged against engine error logs
    and concurrent delivery volume.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      series   = hourly/daily sanitized_count per file_type
      residual = series - STL_decompose(series, seasonality=[business_hours, weekly])
      anomalies = generalized_ESD(residual, center=median, scale=MAD)
      ALERT on residual spikes => tool degradation / evasion / campaign
- question: Are excision failure and error rates rising (parser/engine errors, timeouts, password-protected
    or encrypted-archive bypasses, oversize-skip counts, and 'delivered-unscanned' counts per channel)
    relative to the rolling baseline?
  context: Supports Isolate by treating sanitization failures as first-class evasion signals. Attackers
    deliberately induce failures (encrypted archives, malformed structures, oversized files) to force
    a fail-open delivery and bypass excision. Track each failure mode per channel and alert on increases
    versus the rolling baseline. A spike in password-protected or oversize-skip bypasses, for instance,
    is a classic precursor to a delivery campaign engineered to slip past CDR.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      stats per channel:
        parser_errors, timeouts, encrypted_archive_bypass,
        oversize_skip, delivered_unscanned
      baseline = rolling_mean(prev_period)
      ALERT WHEN any_failure_mode > baseline   => engineered fail-open evasion
- question: Which rare-but-clustered MIME/structure combinations are reaching endpoints WITHOUT excision,
    and do they exceed the rarity cutoff derived from the observed fleet-wide prevalence distribution?
  context: 'Supports Isolate using the rarity-as-malice prior: maintain fleet-wide prevalence of MIME/structure
    combinations and flag types that are both uncommon and clustered yet bypass excision. Rare file types
    that suddenly appear at multiple endpoints without sanitization are a strong indicator of a targeted
    delivery exploiting a gap in the excision policy. Set the rarity cutoff from the observed prevalence
    distribution rather than a fixed constant so the signal adapts to the environment.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      prevalence = fleet_count(mime_type, structure_combo) over fleet
      FOR files reaching endpoints WHERE disposition != 'excised':
        IF prevalence(combo) < rarity_cutoff AND cluster_count(combo) >= k
        THEN ALERT 'rare-but-clustered unsanitized file type'
      rarity_cutoff = quantile(prevalence_distribution)
- question: Which delivered files have a high model-estimated probability of being an excision false-negative
    (based on MIME type, entropy, structural-path counts, embedded-object or JavaScript presence, archive
    nesting depth, source reputation, and prior verdicts), and were they routed to secondary detonation
    or manual review?
  context: Supports Isolate by predictively prioritizing files the deterministic rules may have missed.
    Train a supervised model on file and delivery features to estimate false-negative probability, and
    route high-risk files to secondary detonation or manual review. Every alert must surface the top-3
    contributing features via SHAP (e.g., 'rare MIME', 'high-entropy nested archive', 'embedded OLE present')
    for explainable triage. Run this in PARALLEL with the deterministic floor rules; ML cannot safely
    replace them under evasion, but it can focus analyst attention on the riskiest deliveries.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [mime, entropy, structural_path_counts, embedded_object, js_present,
        archive_nesting_depth, source_reputation, prior_verdicts]
      p_fn = supervised_model.predict_proba(features)
      IF p_fn > threshold:
        top3 = SHAP(features)
        ROUTE file -> secondary_detonation / manual_review WITH top3
      // runs in parallel with deterministic floor rules
- question: Which delivered files deviate most from the benign, successfully-sanitized baseline by autoencoder
    reconstruction error (above the 99th percentile), and which features drive the deviation?
  context: Supports Isolate by catching novel or unusual post-excision artifacts that rule-based and supervised
    methods miss. Train an autoencoder only on feature vectors of successfully-sanitized (benign) files,
    then score delivered files by reconstruction error and alert above the 99th percentile of benign error.
    Provide per-feature error attribution so analysts can see WHY a file looks anomalous. High reconstruction
    error on a file marked excision-success suggests the disarmed output does not resemble known-good
    output, a candidate sanitization miss worth manual review.
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - CDR/sanitization engine disposition logs
  - Email gateway logs
  - YARA scan results
  - oletools/olevba/mraptor output
  - 'NAI: Network egress/ingress points, specifically traffic passing through web proxies, email gateways,
    and the CDR/sanitization engine.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = autoencoder.train(benign = successfully_sanitized_feature_vectors)
      err = reconstruction_error(model, delivered_file_features)
      IF err > p99(benign_error):
        attribution = per_feature_error(model, file)
        ALERT 'post-excision deviation from benign baseline' WITH attribution
- question: After delivery downstream of CDR, are any Office applications (winword.exe, excel.exe, powerpnt.exe,
    outlook.exe, mspub.exe, visio.exe) spawning interpreters or LOLBins (cmd, powershell, wscript, cscript,
    mshta, regsvr32, rundll32, certutil, bitsadmin, schtasks, msbuild, installutil)?
  context: 'Supports Isolate at execution time: some excision misses only manifest on open. If a document
    that passed through CDR triggers an Office process to spawn a scripting interpreter or LOLBin, active
    content survived excision (State = excision miss). This deterministic Sigma-based rule is the execution-time
    floor; it ties endpoint process telemetry back to the gateway disposition and confirms the isolation
    control failed in practice, not just on paper.'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Security 4688
  - EDR process telemetry
  - 'NAI: Endpoints that open delivered documents downstream of the CDR/sanitization gateway.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      process_creation
      WHERE parent_image IN (winword.exe, excel.exe, powerpnt.exe,
          outlook.exe, mspub.exe, visio.exe)
        AND child_image IN (cmd, powershell, wscript, cscript, mshta, regsvr32,
          rundll32, certutil, bitsadmin, schtasks, msbuild, installutil)
        AND source_file passed_through_CDR
      => ALERT 'excision miss: active content executed on open'
- question: Is the rate of Office->interpreter child-process events per hour exceeding the rolling baseline,
    and does it correlate with CDR-processed file deliveries (indicating systemic rather than isolated
    excision failure)?
  context: Supports Isolate by quantifying execution-time misses across the fleet. Count Office->interpreter
    child-process events per hour (Frequency metric) and correlate with CDR-processed deliveries. Use
    robust seasonal residual analysis so business-hours patterns do not generate false positives. Correlated
    spikes (a rise in document-spawned interpreter activity tracking a batch of CDR-processed deliveries)
    are evidence of systemic excision failure rather than isolated noise and warrant a control review.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Security 4688
  - EDR process telemetry
  - 'NAI: Endpoints that open delivered documents downstream of the CDR/sanitization gateway.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      series   = hourly count(Office -> interpreter child_process)
      residual = series - seasonal_decompose(series)
      ALERT WHEN residual > baseline AND correlates_with(CDR_processed_deliveries)
      => systemic excision failure
- question: Which document-originated process trees are most anomalous against the benign baseline, and
    which of them are tied to recently CDR-processed files (prioritized via top-3 SHAP feature attribution)?
  context: 'Supports Isolate by scoring post-delivery process chains for anomalousness and prioritizing
    those linked to recently CDR-processed files. Surface the top-3 contributing features (parent image,
    child image, command-line tokens, network egress) via SHAP so analysts get explainable triage. This
    complements the deterministic Sigma rule: it catches subtler chains that do not match a fixed signature
    but still represent active content that survived excision and executed on the endpoint.'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Security 4688
  - EDR process telemetry
  - 'NAI: Endpoints that open delivered documents downstream of the CDR/sanitization gateway.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      trees = build_process_trees(document_originated)
      score = anomaly_model.score(trees vs benign_baseline)
      FOR high-score trees:
        top3 = SHAP(parent_image, child_image, cmdline_tokens, network_egress)
        PRIORITIZE trees tied to recently CDR-processed files WITH top3
