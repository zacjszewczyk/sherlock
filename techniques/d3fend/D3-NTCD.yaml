name: 'D3-NTCD: Network Traffic Community Deviation'
id: 4d0de9dc-8b14-46ed-8f29-524351160482
description: This playbook helps an analyst investigate statistically significant deviations in communication
  patterns between established network communities (groups of hosts that normally talk to each other,
  derived from subnets/VLANs, asset roles, or graph-based community detection). It supports detection
  of brand-new connections between communities that have never interacted, the reactivation of long-dormant
  inter-community edges, spikes in data volume or connection frequency, unusual protocols/ports, structurally
  anomalous logins, and elevated failed/blocked connection rates that indicate scanning or community-boundary
  probing. The methods span deterministic segmentation and new-edge rules, statistical baselining and
  Bayesian/ensemble anomaly detection, and graph machine-learning (Louvain communities, GNN link-prediction,
  temporal models, embedding-based drift detection) to surface lateral movement, insider activity, and
  unauthorized cross-community access while keeping false positives manageable in dynamic networks.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there any connections between network communities that an explicit segmentation policy
    says must never communicate (for example workstation-to-workstation RDP/3389, or the Finance VLAN
    reaching the code server on 22/445)?
  context: 'Tactic: Detect. This establishes a deterministic ''static floor'' beneath the statistical
    and ML models. Define static communities from IP subnets/VLANs and asset-inventory roles (e.g., ''Workstations'',''Domain
    Controllers'',''CodeServers'',''FinanceVLAN'') and maintain an explicit deny/alert matrix for community
    pairs that should never talk. Any observed flow matching a forbidden pair is high-confidence evidence
    of misconfiguration or unauthorized lateral movement. Keep concrete port/role rules and tune them
    rather than deleting them; a positive result names the offending source/destination communities, host,
    and port, while a negative result confirms the policy boundary held.'
  answer_sources: &id001
  - Zeek conn.log
  - Firewall connection logs (allowed/denied)
  - Windows Security EventLog (4624/4625 logon, 4768/4769 Kerberos)
  - NetFlow/IPFIX
  - 'NAI: Internal network segments (e.g., user VLANs, server farms, DMZ), and network egress/ingress
    points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'LET community(ip) = lookup(asset_inventory, ip).role  // Workstation, DC, CodeServer, FinanceVLAN

      FROM conn_logs, firewall_logs

      LET pair = (community(src_ip), community(dst_ip), dst_port)

      WHERE pair IN forbidden_matrix  // e.g. (Workstation,Workstation,3389),(FinanceVLAN,CodeServer,22|445)

      ALERT severity=high details=src_community,dst_community,src_ip,dst_ip,dst_port'
- question: Do any logins between source and destination community groups fail to match the historically
    learned login structures, and in particular do any login paths BOTH reach a system new to that user/community
    AND involve a credential switch?
  context: 'Tactic: Detect. Mine frequent source-group to destination-group login structures from Windows
    4624 logon and Kerberos 4769 service-ticket events, then alert on any login that matches no learned
    structure (per ''Detecting Structurally Anomalous Logins Within Enterprise Networks''). Layer Hopper''s
    two-condition causal rule: flag a login path that BOTH reaches a system new to that user/community
    AND involves a credential switch (the account used to authenticate differs from the account that initiated
    the path). Both conditions together strongly indicate lateral movement with stolen or escalated credentials.
    The alert must name the source community, destination community, account, and which condition(s) fired
    so the analyst can triage quickly.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM win_security WHERE EventID IN (4624,4769)

      LET s_comm=community(src_host), d_comm=community(dst_host)

      LET structure=(s_comm,d_comm,logon_type)

      WHERE structure NOT IN learned_login_structures

      LET cond_new = dst_host NOT IN history[account].systems

      LET cond_switch = auth_account != path_origin_account

      WHERE structure_unseen OR (cond_new AND cond_switch)

      ALERT details=s_comm,d_comm,account,fired=[cond_new,cond_switch]'
- question: Has a brand-new source-community to destination-community communication edge appeared, or
    has a previously dormant edge (no activity for more than 30 days) suddenly reactivated, especially
    involving sensitive communities?
  context: 'Tactic: Detect. Maintain a registry of observed source-community to destination-community
    pairs derived from community partitions (Louvain / ''Fast unfolding of communities in large networks'').
    Deterministically alert when a never-before-seen edge appears or when a dormant edge reactivates,
    prioritizing pairs that touch sensitive communities (Domain Controllers, CodeServers, Finance). This
    implements the ''new/never-seen contact'' rule of the community-outlier method. A positive result
    is a concrete, explainable signal of a community boundary being crossed for the first time; run it
    in parallel with the statistical/ML detectors as a low-false-negative tripwire.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM conn_logs\nLET edge=(community(src_ip), community(dst_ip))\nLET first_seen = registry[edge].first_seen\n\
      LET last_seen = registry[edge].last_seen\nWHERE edge NOT IN registry        // brand-new edge\n\
      \   OR now - last_seen > 30 days    // dormant edge reactivation\nRANK by sensitivity(community(dst_ip))\n\
      ALERT details=src_community,dst_community,first_seen,last_seen"
- question: For each pair of communities, do hourly volume, frequency, or connection-state metrics exceed
    the 99th percentile of a rolling 30-day baseline, indicating a surge in inter-community traffic?
  context: 'Tactic: Detect. Group hosts into communities (subnet/role) using Zeek conn.log and, for each
    community pair, baseline three metric families over a rolling 30-day window: Volume (orig_bytes+resp_bytes
    and byte ratio), Frequency (connections/min), and State (proportion of S0/REJ/RSTO failed connections).
    Alert when hourly metrics exceed the 99th percentile, deriving site-specific cutoffs from your own
    data (validate against the LANL authentication dataset). The alert should report the top-3 contributing
    metrics so an analyst understands whether the anomaly is bulk exfiltration (volume), scanning/beaconing
    (frequency), or probing (failed states).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM conn.log\nLET pair=(community(id.orig_h), community(id.resp_h))\nPER pair, PER 1h:\n\
      \  volume=sum(orig_bytes+resp_bytes); freq=count()/60; fail=count(conn_state IN [S0,REJ,RSTO])/count()\n\
      BASELINE p99 over trailing 30d per pair per metric\nWHERE volume>p99_volume OR freq>p99_freq OR\
      \ fail>p99_fail\nALERT details=pair, top3_metrics"
- question: Does the recent connection count on any community-pair edge diverge significantly from its
    historical predictive distribution (low Bayes factor / p-value), and does the local subgraph around
    that edge show anomalous structure?
  context: 'Tactic: Detect. Apply the two-stage Bayesian counting-process test from ''Bayesian anomaly
    detection methods for social networks'': first score each community-pair edge''s recent connection
    counts against its historical predictive distribution to flag statistically surprising edges, then
    inspect the local subgraph around flagged edges for anomalous structure (e.g., a node fanning out
    to many new neighbors). Surfacing the edge, its expected vs. observed counts, and the implicated neighbor
    set gives the analyst a defensible, quantified anomaly rather than a raw threshold trip. A strong
    anomaly localized to a sensitive community warrants immediate triage.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM conn_logs\nPER edge=(community(src),community(dst)) PER window:\n  observed=count_connections\n\
      \  expected ~ Predictive(history[edge])  // counting process\n  score = bayes_factor(observed, expected)\n\
      WHERE score > anomaly_threshold (or p_value < 0.01)\nTHEN inspect_subgraph(edge) for anomalous neighbors\n\
      ALERT details=edge,expected,observed,neighbor_set"
- question: Which hosts are flagged as consensus outliers by an ensemble of unsupervised detectors (PCA
    subspace-residual, k-means cluster-distance, and Median Absolute Deviation) computed over host-communication-graph
    features such as inter-community degree, edge volume, and distinct destination communities?
  context: 'Tactic: Detect. Build a Host Communication Graph from conn.log/NetFlow and compute per-host
    features including inter-community degree, edge volume, and number of distinct destination communities.
    Fuse three complementary detectors — PCA subspace residual, k-means cluster distance, and MAD — and
    alert only on consensus outliers (hosts flagged by multiple detectors), per ''An Unsupervised Multi-Detector
    Approach for Identifying Malicious Lateral Movement''. Requiring agreement suppresses single-method
    false positives. Report which detectors voted and the top-3 features driving the score so the analyst
    can judge whether the host is a pivot reaching many communities.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'BUILD host_comm_graph FROM conn.log/NetFlow

      PER host: features=[inter_community_degree, edge_volume, distinct_dst_communities, ...]

      score_pca=subspace_residual(features); score_km=cluster_distance(features); score_mad=mad_score(features)

      votes = count(score_* > detector_threshold)

      WHERE votes >= 2

      ALERT details=host, voting_detectors, top3_features'
- question: Is any host generating an unusual volume of failed or blocked connections (blocked firewall
    connections, Zeek S0/REJ states, failed logons 4625, Kerberos failures 4771) toward a community it
    does not normally contact — for example more than 10 distinct denied destinations to a new community
    within 5 minutes?
  context: 'Tactic: Detect. Treat error/failure rates as a distinct signal (Failure Mode Awareness). Baseline
    per-community-pair rates of blocked firewall connections, Zeek S0/REJ states, and failed logons (4625)
    / Kerberos failures (4771). Alert when failed-connection or failed-logon volume to a community a host
    does not normally contact exceeds the 99th percentile or a hard floor (e.g., >10 distinct denied destinations
    to a new community in 5 min), which indicates scanning or community-boundary probing. Rarity-ranking
    (as in Hopper) keeps alert volume low. A positive result frequently precedes successful lateral movement,
    so it is a valuable early warning.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM firewall(denied), conn.log(S0|REJ), win_security(4625,4771)

      LET pair=(community(src), community(dst))

      PER src PER 5m: distinct_denied_dst=countDistinct(dst WHERE dst_community is new to src)

      BASELINE p99 fail_rate per pair over 30d

      WHERE fail_rate>p99 OR distinct_denied_dst>10

      ALERT details=src, new_dst_community, distinct_denied_dst'
- question: Do per-community-pair interaction time series deviate beyond their forecast prediction interval
    (SARIMA/Prophet), or does a temporal GNN link-prediction model flag edges inconsistent with the learned
    temporal community structure?
  context: 'Tactic: Detect. Construct a weighted communication graph (nodes=IPs, edges=connection counts/bytes
    from conn.log) and partition with Louvain community detection. Model each community-pair interaction
    time series with SARIMA or Prophet and alert when observed values fall outside the prediction interval,
    capturing trend/seasonality-aware anomalies that fixed thresholds miss. For temporally-aware detection,
    apply the GNN+recurrent temporal link-prediction model of Euler to flag edges inconsistent with learned
    temporal community structure. Alerts must list the top-3 contributing features (predicted vs. observed
    volume, edge probability delta) so the analyst can distinguish a benign seasonal shift from genuinely
    anomalous cross-community activity.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "GRAPH = weighted(nodes=IP, edges=conn_count|bytes) FROM conn.log\ncommunities = Louvain(GRAPH)\n\
      PER community_pair: ts = interaction_volume_over_time\n  forecast, lo, hi = SARIMA|Prophet(ts)\n\
      \  WHERE observed < lo OR observed > hi -> anomaly\nALSO: edge_prob = Euler_temporal_GNN.predict(edge,t)\n\
      \  WHERE edge_prob < min_prob -> anomaly\nALERT details=community_pair, top3=[pred_vs_obs_volume,\
      \ edge_prob_delta]"
- question: Does an unsupervised graph autoencoder/GNN trained on the authentication/communication graph
    assign a low probability to any observed edge between hosts or communities, indicating an anomalous
    connection?
  context: 'Tactic: Detect. Train an unsupervised graph autoencoder/GNN on the authentication/communication
    graph and flag low-probability edges between hosts/communities (per CyberGraph and Euler). Run this
    in parallel with the deterministic new-edge registry rather than replacing it, so you get both explainable
    tripwires and learned-structure anomalies. Each alert must surface the edge probability, the source/destination
    communities, and the top-3 anomalous neighbors. Train and validate on the LANL authentication dataset
    before deploying. A low-probability edge into a sensitive community is a strong lateral-movement indicator
    warranting investigation.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "TRAIN gae = GraphAutoEncoder(auth_comm_graph)  // validate on LANL auth dataset\nFOR each\
      \ observed edge (h_src,h_dst):\n  p = gae.edge_probability(h_src,h_dst)\n  WHERE p < low_prob_threshold\n\
      \  ALERT details=edge_prob=p, src_community, dst_community, top3_anomalous_neighbors\nRUN in parallel\
      \ with new-edge registry"
- question: Are there hosts that frequently switch communities or bridge multiple distinct communities
    over successive Louvain re-runs, suggesting they are acting as proxies or pivots between communities?
  context: 'Tactic: Detect. Periodically re-run Louvain community detection and track hosts that frequently
    switch communities or bridge multiple distinct communities. Use inductive node-level graph learning
    (ThreaTrace) or heterogeneous-log embedding with outlier-cluster flagging (Log2vec) to detect drifting/bridging
    nodes that act as proxies or pivots between otherwise-separate communities. Alert text must name the
    host, its prior vs. current community, and the top-3 features (new neighbor communities, embedding
    distance, bridging centrality). A host that suddenly bridges the workstation and server communities,
    for example, is a classic pivot signature.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'PERIODIC: communities_t = Louvain(comm_graph_t)

      PER host: track community_id over time; bridging = distinct_communities_touched

      embed = ThreaTrace|Log2vec(host_logs); drift = embedding_distance(host, cluster_centroid)

      WHERE community_switches > k OR bridging > b OR drift outlier

      ALERT details=host, prior_community, current_community, top3=[new_neighbor_communities, embedding_distance,
      bridging_centrality]'
