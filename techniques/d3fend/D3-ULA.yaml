name: 'D3-ULA: Unlock Account'
id: fc5bc4c9-c4f6-4f65-87bc-50828881f159
description: Investigate account-unlock activity to confirm that restoration of access to a locked user
  account is authorized, that the underlying lockout root cause has been remediated, and that the unlock
  is not adversary- or social-engineering-driven. This playbook helps an analyst correlate Windows account-unlock
  events (4767) with their preceding lockouts (4740), the failed-logon bursts (4625) that caused them,
  and any password resets (4723/4724) that should accompany legitimate recovery. It also helps surface
  help-desk social-engineering chains where an unlock is immediately followed by a logon from a new device,
  identify unauthorized unlock operators or sources, baseline and model normal unlock/lockout behavior
  to flag statistical and behavioral anomalies, and trace the source hosts or accounts that drive excessive
  lockouts and the resulting unlock workload.
type: technique
related:
- tactic_id: D3-R
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: For every account-unlock event (Windows Event ID 4767), can we positively identify the operator
    who performed the unlock and the target account, and tie each unlock back to its preceding lockout
    (4740) on the same account?
  context: 'This is the foundational accounting step for the Restore tactic: every legitimate unlock should
    restore access only after a recorded lockout. Capture the Subject fields (SubjectUserName/SubjectLogonId)
    that identify the operator and the Target Account fields (TargetUserName/TargetSid). Correlate each
    4767 with the most recent preceding 4740 lockout for the same TargetSid to confirm a coherent lockout-then-unlock
    sequence. An unlock with no matching lockout, or one bound to a different account, is suspicious and
    warrants review.'
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=windows (EventCode=4767 OR EventCode=4740)\n  | transaction TargetSid maxspan=24h\
      \ startswith=EventCode=4740 endswith=EventCode=4767\n  | table _time, TargetUserName, TargetSid,\
      \ SubjectUserName, SubjectLogonId, EventCode\n  | append [search index=windows EventCode=4767] //\
      \ surface 4767 with no matching 4740"
- question: Before any account is unlocked, was the root cause of its lockout actually remediated (e.g.,
    password reset performed, offending source host no longer generating failed logons), or was the account
    unlocked while the underlying problem persisted?
  context: 'The Restore tactic mandates an approval-gated, root-cause-first recovery model. For each matched
    4740, identify the CallerComputerName and the preceding 4625 failed-logon burst that caused the lockout.
    Alert when a 4767 occurs without evidence the cause was resolved: no intervening 4723/4724 password
    reset, or the source host is still emitting 4625 failures. A premature unlock simply restarts the
    lockout cycle and, if attacker-driven, hands access back to the adversary. A positive finding (remediation
    present) supports a clean restore; a negative finding indicates the unlock was unsafe.'
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; pivot around each 4767 to inspect the preceding lockout window and the following
    hour
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=windows EventCode=4767\n  | join TargetSid [search index=windows EventCode=4740\
      \ | rename CallerComputerName as lockout_src]\n  | join type=outer TargetSid [search index=windows\
      \ (EventCode=4723 OR EventCode=4724) | stats max(_time) as reset_time by TargetSid]\n  | where isnull(reset_time)\
      \ OR reset_time<lockout_time\n  | eval still_failing=[search index=windows EventCode=4625 ComputerName=lockout_src\
      \ earliest=unlock_time]\n  | table _time, TargetUserName, SubjectUserName, lockout_src, reset_time,\
      \ still_failing"
- question: Is any account being unlocked (4767) more than once within a 24-hour period without an intervening
    password reset (4723 or 4724) between the unlocks?
  context: Repeated unlocks without remediation are a strong signal that the credential problem or attacker
    activity persists. Benign recovery normally pairs an unlock with a password reset to fix the underlying
    credential issue. A loop of unlock-without-reset is consistent with adversary account re-enabling/manipulation
    (ATT&CK T1098), where an attacker repeatedly restores access while defenders try to lock them out.
    Count 4767 per TargetSid in a rolling 24h window and require zero 4723/4724 between them to fire.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; evaluate in rolling 24-hour windows per account
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows (EventCode=4767 OR EventCode=4723 OR EventCode=4724)\n  | bin _time span=24h\n\
      \  | stats count(eval(EventCode=4767)) as unlocks count(eval(EventCode IN(4723,4724))) as resets\
      \ by TargetSid, _time\n  | where unlocks>1 AND resets=0"
- question: Was any unlock performed by an operator or from a host that is NOT on the approved list of
    unlock operators (Help Desk, Domain Admins) and authorized administrative workstations?
  context: Legitimate identity administration is performed by a known set of operators from a known set
    of admin hosts. Maintain an allowlist of authorized unlock Subjects and admin host names/IPs. Alert
    when a 4767 Subject falls outside the allowlist, or when the action originates from a non-privileged/standard
    workstation. An operator account performing identity administration outside its normal role or location
    may indicate credential compromise or insider abuse (ATT&CK T1098). Use the Subject fields from the
    4767 record to evaluate against the allowlist.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=windows EventCode=4767\n  | lookup unlock_operator_allowlist SubjectUserName OUTPUT\
      \ is_authorized\n  | lookup admin_host_allowlist host AS Computer OUTPUT is_admin_host\n  | where\
      \ is_authorized!=\"true\" OR is_admin_host!=\"true\"\n  | table _time, SubjectUserName, Computer,\
      \ TargetUserName, TargetSid"
- question: Did any account unlock (4767) get immediately followed (within about an hour) by an interactive
    or remote logon (4624) for the same user from a workstation or IP never previously associated with
    that user?
  context: 'This sequence is the signature of help-desk social engineering: an adversary tricks an operator
    into unlocking/resetting an account, then immediately logs in from their own device. Build a per-user
    history of known source workstations/IPs, then alert when a 4767 for a target user is followed within
    <=1 hour by a 4624 for that same user from a brand-new source. This pattern is documented in the Scattered
    Spider advisory (AA23-320A) and ATT&CK T1098. A positive result is high-fidelity and should trigger
    rapid containment (re-lock, force reset, verify with the user out-of-band).'
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; correlate each unlock with logons in the following 1-hour window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=windows EventCode=4767\n  | join type=inner TargetUserName max=0\n    [search\
      \ index=windows EventCode=4624 (Logon_Type=2 OR Logon_Type=10)]\n  | where logon_time>=unlock_time\
      \ AND logon_time<=unlock_time+3600\n  | lookup user_known_sources user AS TargetUserName OUTPUT\
      \ known_ip known_host\n  | where NOT match(IpAddress, known_ip) AND Workstation!=known_host\n  |\
      \ table _time, TargetUserName, SubjectUserName, IpAddress, Workstation"
- question: Is any operator performing a volume of account unlocks per day that is statistically anomalous
    relative to their own 30-day baseline?
  context: A compromised or abusive help-desk credential will often show a sudden spike in unlock activity.
    Compute a 30-day rolling baseline of unlocks per operator per day and alert when an operator exceeds
    3 standard deviations above their mean or enters the 95th percentile. Prefer robust median/MAD statistics
    to resist contamination by prior anomalies. Derive thresholds from at least 30 days of your own 4767
    data so the model reflects your environment, not a generic assumption. A breach of the threshold flags
    the operator for review of which accounts they unlocked and why.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows EventCode=4767\n  | bin _time span=1d\n  | stats count as daily_unlocks\
      \ by SubjectUserName, _time\n  | eventstats median(daily_unlocks) as med p95(daily_unlocks) as p95\
      \ by SubjectUserName\n  | eval mad=abs(daily_unlocks-med)\n  | where daily_unlocks>p95 OR (daily_unlocks-med)>3*mad"
- question: After accounting for normal business-hours and weekday seasonality, are there genuine spikes
    in the volume of account unlocks (4767) that stand out from the periodic pattern?
  context: 'Unlock counts are strongly seasonal: business-hours peaks, heavy Monday-morning volume (post-weekend
    password fatigue). A naive threshold drowns in this periodicity. Apply Seasonal-Hybrid ESD to hourly/daily
    4767 counts to flag true spikes while tolerating the expected seasonal shape, and report the exact
    anomalous timestamps for triage. A flagged spike may indicate a mass-lockout event, scripted abuse,
    or an unfolding incident that is generating an unusual unlock burst outside the normal rhythm.'
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days for seasonal training; flag hourly/daily anomalies
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows EventCode=4767\n  | timechart span=1h count as unlocks\n  | // apply Seasonal-Hybrid\
      \ ESD (S-H-ESD) decomposition\n  | shesd unlocks period=24 max_anoms=0.05 direction=pos\n  | where\
      \ anomaly=1\n  | table _time, unlocks, expected, anomaly"
- question: Is there a sustained regime shift (change point) in the enterprise or per-operator unlock
    time series indicating a new ongoing condition rather than a one-off spike?
  context: Distinct from transient spikes, a change point marks a durable shift in the baseline rate that
    can reveal an incident in progress or a compromised help-desk credential being used steadily. Run
    CUSUM, Bayesian-online, or PELT change-point detection on the enterprise and per-operator 4767 series
    and emit an explainable change timestamp. A detected change point tells the analyst when the new regime
    began so they can scope what changed (new operator behavior, mass lockout event, scripted abuse) around
    that time.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows EventCode=4767\n  | timechart span=1h count as unlocks by SubjectUserName\n\
      \  | // run PELT / CUSUM change-point detection per series\n  | changepoint method=pelt field=unlocks\n\
      \  | where changepoint=1\n  | table _time, SubjectUserName, unlocks, changepoint"
- question: What are the failure-mode ratios - failed logons (4625) per lockout (4740) and lockouts per
    unlock (4767) - per account and per source host, and are any abnormally high?
  context: These ratios distinguish brute-force/spray-driven churn from benign resets. A high failed-logon-to-lockout
    ratio for an account or source host indicates many credential-guessing attempts driving the lockouts,
    characteristic of password spraying, rather than a user simply mistyping a forgotten password. Track
    4625 per 4740 and 4740 per 4767 per account and per CallerComputerName/source host. Accounts and hosts
    with outlier ratios should be investigated as attack-driven rather than ordinary helpdesk recovery.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows (EventCode=4625 OR EventCode=4740 OR EventCode=4767)\n  | stats count(eval(EventCode=4625))\
      \ as fails count(eval(EventCode=4740)) as lockouts count(eval(EventCode=4767)) as unlocks by TargetUserName\n\
      \  | eval fail_per_lockout=fails/lockouts, lockout_per_unlock=lockouts/unlocks\n  | where fail_per_lockout>20\
      \ OR lockout_per_unlock>3"
- question: Do any account unlocks represent structurally novel operator-target-host combinations that
    have not been seen before in normal identity administration?
  context: Beyond raw volume, the structure of who unlocks what from where carries signal. Learn the normal
    structure - which operators unlock which classes of accounts (standard user, privileged, service)
    from which admin hosts - using market-basket/association-rule scoring, then flag structurally novel
    unlock tuples (e.g., a help-desk operator unlocking a Domain Admin account from an unusual host).
    This adapts the structurally-anomalous-logins approach to identity administration. Benchmark false-positive
    rates against the CERT Insider Threat dataset. A novel tuple is a candidate for misuse or compromise
    even if no single field alone is anomalous.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; train structure over trailing 60-90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows EventCode=4767\n  | eval tuple=SubjectUserName.\"|\".target_account_class.\"\
      |\".Computer\n  | stats count as freq by tuple\n  | // association-rule / market-basket: score support\
      \ & confidence\n  | where freq<=1 // structurally novel / never-before-seen tuple\n  | table tuple,\
      \ freq"
- question: Does the observed hourly unlock volume breach a seasonal forecast prediction interval, signaling
    a mass-lockout or scripted-abuse event?
  context: Fit a seasonal time-series forecast (ARIMA/SARIMA) on hourly unlock volume that captures the
    diurnal and weekly seasonality, then alert when observed volume falls outside the prediction interval.
    Unlike a static threshold, the forecast adapts to expected periodic load, so a breach is meaningful.
    Surface the contributing window and the magnitude of the deviation in the alert so the analyst can
    immediately scope whether a mass lockout (e.g., expired password policy, AD replication issue) or
    scripted abuse is occurring.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days for model fit; forecast forward hourly
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = SARIMA(order=(p,d,q), seasonal_order=(P,D,Q,24))\n  fit on hourly_4767_counts\
      \ (trailing 90d)\n  for each hour:\n    yhat, lo, hi = model.forecast()\n    if observed > hi: alert(window=hour,\
      \ magnitude=observed-yhat)"
- question: When each operator's daily behavior is modeled across multiple features (unlock count, distinct/high-value
    targets, off-hours fraction, host diversity), which operators produce high anomaly scores, and what
    features drive them?
  context: A multivariate behavioral model catches subtle misuse that single-metric thresholds miss. Build
    per-operator daily feature vectors and score them with an online autoencoder or RNN; alert on high
    reconstruction error and surface the top-3 contributing features in the alert text so triage is explainable
    (e.g., 'off-hours fraction' and 'high-value targets' spiked). This unsupervised insider-threat approach,
    benchmarked on the CERT dataset, flags operators behaving unlike themselves - a compromised or malicious
    help-desk account unlocking privileged accounts at unusual hours from many hosts.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; daily scoring with trailing training window
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [unlock_count, distinct_targets, high_value_targets, offhours_frac, host_diversity]\n\
      \  per operator per day -> vector\n  model = OnlineAutoencoder(); train on normal history\n  score\
      \ = reconstruction_error(vector)\n  if score > threshold: alert(operator, top3_contributing_features(vector))"
- question: When the account-management event stream (4767/4740/4723/4724/4624) is modeled as an ordered
    sequence, do any unlocks score as anomalous in their surrounding context?
  context: Some malicious unlocks are anomalous not in isolation but in sequence - e.g., an unlock that
    is not preceded by a lockout, or that is immediately followed by a logon and a privilege change. Train
    an attention-augmented LSTM language model over the ordered account-management event stream and score
    each unlock in context. Use the attention weights to report which fields (operator, target, host,
    time) drove the anomaly, giving the analyst an interpretable explanation. This catches abnormal event
    orderings that rule logic and volume statistics overlook.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = ordered_events(EventCode IN(4767,4740,4723,4724,4624)) per account\n  model =\
      \ AttentionLSTM_LanguageModel(); train on normal sequences\n  for each unlock event in context:\n\
      \    p = model.likelihood(event | preceding_context)\n    if p < threshold: alert(event, attention_top_fields(operator,target,host,time))"
- question: Do any operator-to-target-account unlock relationships represent previously-unseen or improbable
    graph edges?
  context: Model operator->target-account unlock relationships as an evolving graph and use an unsupervised
    graph neural network to flag new or improbable edges with edge-level explanations. An operator who
    suddenly unlocks an account class or specific high-value account they have never touched creates a
    new edge that may indicate lateral progression toward privileged identities or a compromised operator.
    Operationalize hunting on first-party Windows AD logs with PageRank/ML account-host ranking (LogonTracer).
    A flagged new edge focuses the analyst on a specific operator-target pair to validate.
  answer_sources:
  - Windows Event ID 4767
  - Windows Event ID 4740
  - Windows Event ID 4723
  - Windows Event ID 4724
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; maintain evolving graph
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = graph(edges = operator -> target_account from EventCode=4767)\n  model = UnsupervisedGNN();\
      \ learn normal edge distribution\n  for new edge (op, target):\n    if edge_probability(op,target)\
      \ < threshold OR edge unseen:\n      alert(op, target, edge_explanation)\n  # also: LogonTracer\
      \ PageRank ranking on AD logon/account-mgmt logs"
- question: Is any single source host or endpoint causing an excessive number of account lockouts (4740)
    over a defined window, thereby driving the downstream unlock workload?
  context: A single misconfigured host (cached stale credentials, scheduled task, service account) or
    a malicious host can cause repeated lockouts that generate continuous unlock demand. Count lockout
    events per source host (CallerComputerName) over a window and alert when one host causes more than
    ~5 lockouts. Name the contributing user and host in the alert. Account for known false positives -
    shared kiosks and service hosts legitimately generate multiple lockouts. Tune the count and window
    to your environment. Identifying and remediating the source breaks the repeated unlock/lockout cycle.
  answer_sources:
  - Windows Event ID 4740
  - Windows Event ID 4625
  - Windows Event ID 4767
  - 'NAI: Domain Controllers'
  range: Last 90 days; evaluate in rolling windows (e.g., per hour/day)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows EventCode=4740\n  | bin _time span=1h\n  | stats dc(TargetUserName) as\
      \ users values(TargetUserName) as accounts count as lockouts by CallerComputerName, _time\n  | where\
      \ lockouts>5\n  | table _time, CallerComputerName, lockouts, accounts"
- question: Are any lockouts (4740) preceded by failed-logon bursts (4625) in which a single source targets
    many distinct accounts - the structural signature of password spraying?
  context: Password spraying tries a few common passwords against many accounts, producing failed-logon
    bursts from one source spread across distinct usernames, some of which trip the lockout threshold.
    Correlate 4740 lockouts with preceding 4625 bursts where one source host hits many distinct accounts.
    The CallerComputerName in the 4740 (and IpAddress/Workstation in the 4625) identifies the offending
    host. A positive result reframes the lockouts as attack-driven churn requiring containment of the
    source, not routine helpdesk resets.
  answer_sources:
  - Windows Event ID 4740
  - Windows Event ID 4625
  - Windows Event ID 4767
  - 'NAI: Domain Controllers'
  range: Last 90 days; correlate failed-logon bursts in the window preceding each lockout
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=windows EventCode=4625\n  | bin _time span=15m\n  | stats dc(TargetUserName) as\
      \ distinct_targets count as fails by IpAddress, _time\n  | where distinct_targets>10\n  | join IpAddress\
      \ [search index=windows EventCode=4740 | rename CallerComputerName as src]\n  | table _time, IpAddress,\
      \ src, distinct_targets, fails"
- question: Relative to rolling baselines of lockouts per source host and per account, are there change-points
    or statistically significant deviations (>3 SD / 95th percentile)?
  context: Maintain rolling baselines of lockouts per source host and per account, and alert on change-points
    or deviations beyond 3 standard deviations / the 95th percentile, using robust statistics and change-point
    detection methods. This catches both a sudden surge from one host and a gradual sustained increase
    that a static threshold would miss. A flagged host or account directs the analyst to investigate whether
    a new spray campaign, a misconfiguration, or insider activity is driving abnormal lockout generation.
  answer_sources:
  - Windows Event ID 4740
  - Windows Event ID 4625
  - Windows Event ID 4767
  - 'NAI: Domain Controllers'
  range: Last 90 days; baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=windows EventCode=4740\n  | bin _time span=1d\n  | stats count as lockouts by\
      \ CallerComputerName, _time\n  | eventstats median(lockouts) as med p95(lockouts) as p95 by CallerComputerName\n\
      \  | eval mad=abs(lockouts-med)\n  | where lockouts>p95 OR (lockouts-med)>3*mad\n  | // also run\
      \ PELT/CUSUM change-point detection per host series"
- question: Using graph analysis and host ranking over AD logon and account-management logs, which hosts
    and accounts are disproportionately involved in generating lockouts?
  context: Apply graph analysis/PageRank and ML host ranking (LogonTracer) over AD logon and account-management
    logs to surface hosts and accounts that are central to lockout generation - the nodes whose removal
    or remediation would most reduce the lockout/unlock churn. This complements simple counts by weighting
    structural importance in the logon graph. Benchmark detectors against the CERT Insider Threat dataset.
    The top-ranked nodes become priority remediation targets and potential indicators of brute-force/spray
    infrastructure or compromised accounts.
  answer_sources:
  - Windows Event ID 4740
  - Windows Event ID 4625
  - Windows Event ID 4767
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = graph(nodes=hosts+accounts, edges=logon/account-mgmt events)\n  rank = PageRank(G)\
      \ weighted by lockout involvement (4740)\n  # LogonTracer ML host ranking on AD logs\n  surface\
      \ top-N hosts/accounts by lockout-generation centrality\n  alert(top_nodes)"
