name: 'D3-EAL: Executable Allowlisting'
id: 68035009-39fc-43c5-a8f8-f5b63ae6220f
description: Audit and assess the coverage and effectiveness of executable allowlisting (AppLocker / Windows
  Defender Application Control) across Windows endpoints and servers. This playbook helps an analyst (1)
  confirm that the allowlisting policy is actively denying execution of unauthorized or known-bad files
  via enforce-mode block events, (2) discover coverage gaps where hosts run only in audit/'would-block'
  mode or emit no policy events at all, (3) measure the per-host and per-user block frequency, blocked:allowed
  ratio, and audit would-block rate to distinguish a healthy policy from a mis-scoped one, (4) detect
  campaign onset via anomalies in block volume, and (5) audit comprehensive process-execution telemetry
  against the master allowlist to find unenforced systems, weak path/name rules, rare or stolen code-signing
  certificates, packed/obfuscated payloads, and allowlist bypasses through abused Microsoft-signed living-off-the-land
  binaries (LOLBins). It supports investigation of a sophisticated external actor attempting to execute
  unauthorized code, as well as commodity malware and insiders, by combining symbolic-logic matching,
  statistical baselining, and machine-learning classification over endpoint and network logs.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did our enforcing allowlisting policy actively block any executables, scripts, or MSIs from
    running, and were any of the blocked files known-bad or living-off-the-land binaries?
  context: Under the Harden tactic, AppLocker block events (Event ID 8004 for EXE/DLL, 8007 for Script/MSI)
    and WDAC CodeIntegrity enforce-block events (Event ID 3077) are the authoritative first-party signal
    that the policy actively denied execution. For each block event, extract the file hash and publisher
    and correlate against known malware IOCs and CISA/NSA living-off-the-land guidance. A confirmed match
    to a known-bad file means the control successfully stopped an attempted execution and warrants incident
    follow-up on that host; benign blocks indicate policy friction or misconfiguration that should be
    tuned. Either way these events prove the policy is in enforce mode and working.
  answer_sources:
  - Windows Event ID 8004 (AppLocker EXE/DLL blocked)
  - Windows Event ID 8007 (AppLocker Script/MSI blocked)
  - Windows Event ID 8003 (AppLocker EXE/DLL would-block, audit mode)
  - Windows Event ID 8006 (AppLocker Script/MSI would-block, audit mode)
  - Windows Event ID 8002 (AppLocker EXE/DLL allowed)
  - WDAC CodeIntegrity Event ID 3077 (enforce block)
  - WDAC CodeIntegrity Event ID 3076 (audit block)
  - 'NAI: All Windows endpoints and servers under the scope of the allowlisting policy.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = filter(WinEventLog, EventID in [8004,8007] OR (Channel='CodeIntegrity' AND EventID=3077))\n\
      for e in events:\n  enrich(e.FileHash, e.Publisher) against malware_IOCs + LOLBAS_list\n  emit alert{host=e.Computer,\
      \ file=e.FilePath, hash=e.FileHash, signer=e.Publisher, known_bad=match}"
- question: Which hosts are still running the allowlisting policy in audit/'would-block' mode only, and
    which in-scope hosts emit no AppLocker or CodeIntegrity events at all?
  context: 'NIST SP 800-167 treats audit/logging mode strictly as a measurement phase before enforcement,
    so hosts that emit audit-mode would-block events (Event ID 8003/8006, WDAC 3076) but never emit enforce-mode
    block events (8004/8007/3077) represent unfinished policy rollout and an enforcement gap an attacker
    could exploit. Hosts in scope that emit NO AppLocker/CodeIntegrity events at all are unmonitored and
    may have no policy deployed. Identifying these gaps is central to assessing the coverage of the Harden
    control: every audit-only or silent host is an exposure where unauthorized executables could run freely.'
  answer_sources:
  - Windows Event ID 8004 (AppLocker EXE/DLL blocked)
  - Windows Event ID 8007 (AppLocker Script/MSI blocked)
  - Windows Event ID 8003 (AppLocker EXE/DLL would-block, audit mode)
  - Windows Event ID 8006 (AppLocker Script/MSI would-block, audit mode)
  - Windows Event ID 8002 (AppLocker EXE/DLL allowed)
  - WDAC CodeIntegrity Event ID 3077 (enforce block)
  - WDAC CodeIntegrity Event ID 3076 (audit block)
  - 'NAI: All Windows endpoints and servers under the scope of the allowlisting policy.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'audit_hosts  = set(host where EventID in [8003,8006,3076])

      enforce_hosts= set(host where EventID in [8004,8007,3077])

      all_inscope  = set(hosts in allowlisting_policy_scope)

      audit_only   = audit_hosts - enforce_hosts        # unfinished rollout

      silent_hosts = all_inscope - (audit_hosts | enforce_hosts)  # unmonitored

      emit audit_only, silent_hosts'
- question: Which hosts or users have abnormally high block-event frequency, and what is the blocked:allowed
    ratio and audit would-block rate per host?
  context: 'Computing the frequency of block events (8004/8007) per host and per user over a rolling 24-hour
    window and flagging the 95th percentile surfaces hosts/users that are actively targeted, compromised,
    or simply misconfigured. A State metric — the blocked:allowed ratio (8004 vs 8002) and the audit would-block
    rate (8003/8006) per host — separates a working policy from a mis-scoped one: a host blocking far
    more than it allows is likely over-restrictive or under attack, while a high would-block rate signals
    pending enforcement gaps. Treat blocked/failed-execution counts as a distinct failure-mode signal
    from successful allowed runs. Derive site-specific thresholds from 30 days of baseline.'
  answer_sources:
  - Windows Event ID 8004 (AppLocker EXE/DLL blocked)
  - Windows Event ID 8007 (AppLocker Script/MSI blocked)
  - Windows Event ID 8003 (AppLocker EXE/DLL would-block, audit mode)
  - Windows Event ID 8006 (AppLocker Script/MSI would-block, audit mode)
  - Windows Event ID 8002 (AppLocker EXE/DLL allowed)
  - WDAC CodeIntegrity Event ID 3077 (enforce block)
  - WDAC CodeIntegrity Event ID 3076 (audit block)
  - 'NAI: All Windows endpoints and servers under the scope of the allowlisting policy.'
  range: Last 90 days (baseline over 30 days; evaluate per rolling 24-hour window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'win = tumbling_window(24h)

      blocks  = count(EventID in [8004,8007]) by host, user, win

      allowed = count(EventID=8002) by host, win

      wouldblk= count(EventID in [8003,8006]) by host, win

      thresh  = percentile(blocks_over_30d_baseline, 95)

      emit where blocks >= thresh, with blocked_allowed_ratio=blocks/allowed, wouldblock_rate=wouldblk'
- question: Is there a sudden spike or anomalous pattern in the hourly volume of allowlist block events
    that indicates the onset of a campaign being mitigated by the policy?
  context: Applying time-series anomaly detection (ARIMA or LSTM log-sequence modeling, e.g. DeepLog)
    to the hourly volume of block events (8004/8007) lets analysts catch the moment a policy begins repeatedly
    denying execution — a strong indicator that an attack campaign is underway and being mitigated. Because
    raw anomaly scores are hard to triage, the alert must surface the top-3 contributing factors (concentrating
    host, repeated signer/publisher, common parent process) so an analyst can immediately determine scope.
    A spike concentrated on one host or one signer points to a targeted intrusion; broad spikes may indicate
    worm-like commodity malware that the Harden control is containing.
  answer_sources:
  - Windows Event ID 8004 (AppLocker EXE/DLL blocked)
  - Windows Event ID 8007 (AppLocker Script/MSI blocked)
  - Windows Event ID 8003 (AppLocker EXE/DLL would-block, audit mode)
  - Windows Event ID 8006 (AppLocker Script/MSI would-block, audit mode)
  - Windows Event ID 8002 (AppLocker EXE/DLL allowed)
  - WDAC CodeIntegrity Event ID 3077 (enforce block)
  - WDAC CodeIntegrity Event ID 3076 (audit block)
  - 'NAI: All Windows endpoints and servers under the scope of the allowlisting policy.'
  range: Last 90 days (hourly aggregation)
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_count(EventID in [8004,8007])\nmodel  = ARIMA_or_LSTM.fit(series_baseline)\n\
      resid  = series - model.predict()\nfor h in hours where resid > k*sigma:\n  factors = top3(concentrating_host,\
      \ repeated_signer, common_parent_process)\n  emit alert{hour=h, score=resid, top_factors=factors}"
- question: For every process-creation event, is the executable's file hash present in the master allowlist
    database, and which executions on enforce-mode hosts ran a hash that is NOT on the allowlist?
  context: 'Cryptographic-hash matching is the most robust allowlist attribute and the basis of pre-execution
    module verification. For each process-creation event (Windows Event ID 4688 / Sysmon Event ID 1),
    extract the executable hash and signer and compare the hash against the master allowlist database.
    Any hash absent from the list on a host that should be in enforce mode represents a policy failure,
    a path/name-rule bypass, or an unmonitored system. This audit directly measures whether the Harden
    control is actually catching everything it should: an unlisted hash that still executed is the clearest
    proof of a coverage gap or bypass requiring investigation of how it ran.'
  answer_sources:
  - Windows Event ID 4688 (process creation)
  - Sysmon Event ID 1 (process create)
  - Sysmon Event ID 7 (image/DLL load)
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly developer workstations, administrative servers,
    and systems with direct internet access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for e in events where EventID=4688 OR (source=Sysmon AND EventID=1):\n  h = e.ProcessHash;\
      \ signer = e.Signer\n  if host_is_enforce(e.Computer) AND h NOT in allowlist_db:\n    emit alert{host=e.Computer,\
      \ image=e.NewProcessName, hash=h, signer=signer, reason='unlisted_executed'}"
- question: Are Microsoft-signed default binaries (LOLBins) being abused to bypass the allowlist — e.g.,
    rundll32, regsvr32, mshta, msbuild, installutil, or scriptrunner spawning script interpreters or making
    outbound connections?
  context: Publisher/path allowlists permit Microsoft-signed default binaries, so adversaries use the
    documented 'AWL bypass' LOLBins to execute code inside trusted processes. Match process-creation and
    image-load events against the AWL-bypass entries and abusive parent/child command patterns from the
    LOLBAS Project (e.g., rundll32/regsvr32/mshta/msbuild/installutil/scriptrunner spawning cmd, powershell,
    wscript/cscript, or initiating outbound network connections) and translate them into SIEM-portable
    Sigma-style rules. A match means the allowlist's signer-based trust was likely subverted; this is
    a high-value detection because it catches execution that bypasses an otherwise sound Harden policy.
  answer_sources:
  - Windows Event ID 4688 (process creation)
  - Sysmon Event ID 1 (process create)
  - Sysmon Event ID 7 (image/DLL load)
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly developer workstations, administrative servers,
    and systems with direct internet access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "lolbins = {rundll32,regsvr32,mshta,msbuild,installutil,scriptrunner,...}\nfor e in proc_create\
      \ + image_load(Sysmon EventID 7):\n  if basename(e.Image) in lolbins AND (\n     e.Child in {cmd,powershell,wscript,cscript}\
      \ OR\n     opens_outbound(correlate e.PID with Zeek conn.log) OR\n     matches_AWL_bypass(e.CommandLine)):\n\
      \    emit alert{host=e.Computer, lolbin=e.Image, cmdline=e.CommandLine, child=e.Child}"
- question: Which executed binaries are rare across the enterprise, signed by uncommon or recently-issued
    certificates, or exhibit high byte/command-line entropy indicating packing or obfuscation?
  context: 'Compute enterprise prevalence of each executable hash and code-signing signer: binaries present
    on fewer than 1% of endpoints or signed by rare or recently-issued certificates warrant review, since
    adversaries buy or steal valid certificates to defeat signature-based trust. For executed processes,
    calculate Shannon entropy of the executable bytes (>7.0-7.2 indicates packing/encryption) and of the
    command-line arguments to flag obfuscated payloads; structural PE/packer features add precision beyond
    raw entropy. Under the Harden tactic this finds the executables most likely to be malicious yet trusted
    by a weak allowlist rule — low prevalence plus a fresh certificate plus high entropy is a strong signal
    of an attacker-introduced binary.'
  answer_sources:
  - Windows Event ID 4688 (process creation)
  - Sysmon Event ID 1 (process create)
  - Sysmon Event ID 7 (image/DLL load)
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly developer workstations, administrative servers,
    and systems with direct internet access.'
  range: Last 90 days (prevalence baseline across full fleet)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prevalence = count(distinct host) per hash / total_hosts\nsigner_age = now - cert_issue_date(signer)\n\
      for p in executed_processes:\n  ent_bytes = shannon_entropy(p.file_bytes)\n  ent_cmd   = shannon_entropy(p.command_line)\n\
      \  if prevalence[p.hash] < 0.01 OR signer_rare(p.signer) OR signer_age < 30d\n     OR ent_bytes\
      \ > 7.0 OR ent_cmd high:\n    emit review{hash=p.hash, prevalence, signer=p.signer, signer_age,\
      \ ent_bytes, ent_cmd}"
- question: Do unauthorized executables observed on audit-mode hosts classify as malicious when scored
    by a static PE classifier on imports, sections, entropy histograms, parentage, command line, and early
    network behavior?
  context: Train a static PE classifier (gradient-boosted trees / Random Forest, e.g. EMBER) on features
    such as imports, section characteristics, byte/entropy histograms, parent process, command-line length,
    executable-name entropy, and whether the process opens an external connection within seconds of creation
    (correlating the 4688/Sysmon Process ID with Zeek conn.log) to triage unknown executables seen on
    audit-mode hosts. Because these hosts are not yet enforcing, the classifier acts as a compensating
    control, prioritizing which unlisted binaries to investigate first. Each alert must list the top-3
    contributing features for explainability so analysts can validate the verdict before acting.
  answer_sources:
  - Windows Event ID 4688 (process creation)
  - Sysmon Event ID 1 (process create)
  - Sysmon Event ID 7 (image/DLL load)
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly developer workstations, administrative servers,
    and systems with direct internet access.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = extract_PE_features(image): imports, section_chars, byte_entropy_hist,\n        parent_proc,\
      \ cmdline_len, name_entropy, early_outbound=join(PID, Zeek conn.log within 5s)\nscore = pe_classifier.predict_proba(feats)\
      \   # GBT/RandomForest, EMBER-style\nfor img on audit_mode_hosts where score > threshold:\n  emit\
      \ alert{host, image, score, top3_features=explain(feats)}"
- question: Are allowed interpreters and LOLBins being misused, as revealed by execution chains or system-call/process
    sequences that deviate from each program's learned normal behavior?
  context: Allowlists are defeated when adversaries run malicious logic inside trusted, allowed interpreters
    and LOLBins. Build per-program system-call / process-sequence self-profiles (a 'sense of self') and
    score deviations to detect such misuse; HMM and sequence models flag low-probability execution chains
    as anomalous. For example, a normally-benign signed interpreter suddenly spawning unusual child processes
    or producing an execution sequence never seen in its baseline indicates abuse that the allowlist alone
    cannot catch. Under Harden, this behavioral layer closes the residual gap left by signer/path trust
    and helps confirm whether an allowed binary was hijacked for malicious purposes.
  answer_sources:
  - Windows Event ID 4688 (process creation)
  - Sysmon Event ID 1 (process create)
  - Sysmon Event ID 7 (image/DLL load)
  - Zeek conn.log
  - 'NAI: All Windows endpoints and servers, particularly developer workstations, administrative servers,
    and systems with direct internet access.'
  range: Last 90 days (per-program behavioral baseline)
  queries:
  - technology: SIEM/ML pseudocode
    query: "for prog in allowed_interpreters + lolbins:\n  profile = learn_seq_model(prog.syscall_or_proc_sequences_baseline)\
      \  # HMM/sequence\n  for seq in current_sequences(prog):\n    p = profile.score(seq)\n    if p <\
      \ anomaly_threshold:\n      emit alert{host, program=prog, sequence=seq, likelihood=p, reason='abnormal_execution_chain'}"
