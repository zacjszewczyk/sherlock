name: 'D3-DENCR: Disk Encryption'
id: bfcb6981-41d1-4da9-a8d5-b745e5e03dde
description: Investigate the deployment and operational integrity of full-disk encryption (FDE) across
  all endpoints and servers to confirm that disk-encryption policy is actually enforced — not merely configured.
  This playbook helps an analyst prove successful encryption activation on protected volumes (volume fully
  encrypted, protection On, approved cipher), surface and resolve failure conditions, profile encryption
  failure and flapping rates as distinct signals, distinguish 'encrypted-and-locked' hosts from 'encrypted-but-unlocked/suspended'
  key-exposure states, detect unauthorized disablement, suspension, or cryptographic downgrade, and sustain
  measurable compliance across asset cohorts. It spans Windows BitLocker, macOS FileVault, and Linux LUKS
  telemetry, correlates with MDM/EDR compliance and SCAP/OVAL assessment results, and combines deterministic
  posture checks with statistical trending, sector-entropy validation, and machine learning to predict
  and pre-empt non-compliance.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: For each endpoint and server, can you positively confirm that the primary OS volume is fully
    encrypted AND actively protected — and can you identify any host that reports an encryption failure
    or has gone silent on encryption telemetry?
  context: Within the Harden tactic, the goal is to require positive proof of encryption rather than trusting
    the absence of an alert. Look for BitLocker VolumeStatus=FullyEncrypted with ProtectionStatus=On and
    EncryptionPercentage=100 (via Get-BitLockerVolume / manage-bde -status or success Event IDs such as
    796/24578), FileVault reported On via `fdesetup status`, or a valid LUKS header with active key slots
    via `cryptsetup luksDump`/`isLuks`. A positive result establishes the posture floor for that asset;
    a negative result — BitLocker-API failure Event ID 822, EncryptionPercentage<100 persisting beyond
    24h, or an asset with no successful encryption telemetry in the last reporting cycle — is a concrete
    defect to remediate. Silence is treated as failure because a compromised or misconfigured host may
    simply stop reporting. References for the posture floor and platform commands — [Guide to Storage
    Encryption Technologies for End User Devices (NIST SP 800-111)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-111.pdf),
    [Configure BitLocker (Microsoft)](https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/configure),
    [Volume Encryption with FileVault (Apple)](https://support.apple.com/guide/security/volume-encryption-with-filevault-sec4c6dc1b6e/web),
    and [LUKS1 On-Disk Format Specification](https://mirrors.edge.kernel.org/pub/linux/utils/cryptsetup/LUKS_docs/on-disk-format.pdf).
  answer_sources: &id001
  - Windows Event ID 796 (BitLocker Management)
  - Windows Event ID 24578/24586/24588 (BitLocker-Driver)
  - Windows Event ID 845/846/847 (BitLocker-API)
  - Windows Event ID 822 (BitLocker-API failure)
  - manage-bde -status / Get-BitLockerVolume (VolumeStatus, ProtectionStatus, EncryptionPercentage, EncryptionMethod,
    KeyProtector)
  - macOS fdesetup status / fdesetup list (FileVault state, escrow)
  - Linux cryptsetup luksDump / isLuks, lsblk crypt targets, /etc/crypttab
  - MDM/EDR compliance attributes (Intune, Jamf, SCCM)
  - SCAP/OVAL/XCCDF assessment results
  - Change-management / maintenance-ticket records
  - Power-state / sleep-resume events (Windows Kernel-Power 42/107, macOS pmset)
  - 'NAI: All corporate endpoints (laptops, desktops) and servers (physical and virtual)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each host: status = get_encryption_status(host)\nIF NOT (status.VolumeStatus == 'FullyEncrypted'\
      \ AND status.ProtectionStatus == 'On' AND status.EncryptionPercentage == 100)\n  OR status.source_event\
      \ == 'BitLocker-API EventID 822'\n  OR host NOT IN hosts_with_success_telemetry(last_reporting_cycle)\n\
      THEN raise('encryption_not_confirmed', host)\nALERT IF EncryptionPercentage < 100 FOR > 24h"
- question: Does each asset's actual encryption configuration match the secure baseline (encryption enabled,
    OS volume fully encrypted, approved cipher, approved protector bound, and a recovery key escrowed)
    — and which specific baseline conditions are unmet?
  context: This treats the secure baseline as machine-readable checks and counts every mismatch as a discrete,
    named posture defect (per NISTIR 8011-1 and SCAP v1.3). Desired state = encryption enabled AND OS
    volume fully encrypted AND approved cipher (BitLocker XtsAes128/256; LUKS aes-xts-plain64 >=256-bit)
    AND an approved protector bound (TPM+PIN preferred over TPM-only) AND a recovery key escrowed to AD/Entra/MDM.
    Under the Harden tactic, expressing each condition separately lets triage route each defect to the
    right remediation owner. A host can be 'encrypted' yet still fail on cipher strength, protector type,
    or missing escrow — each is its own finding rather than a single pass/fail. References — [Automation
    Support for Security Control Assessments (NISTIR 8011-1)](https://nvlpubs.nist.gov/nistpubs/ir/2017/NIST.IR.8011-1.pdf)
    and [SCAP v1.3 (NIST SP 800-126 Rev. 3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-126r3.pdf).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "baseline = {enabled:true, fully_encrypted:true, cipher in approved_ciphers,\n  protector in\
      \ ['TPM+PIN'], recovery_key_escrowed:true}\nFOR each host: actual = get_config(host)\nFOR each key\
      \ in baseline:\n  IF actual[key] != baseline[key] THEN emit_defect(host, key, actual[key])"
- question: Has any host had its disk encryption disabled, suspended, downgraded in cipher/keysize, had
    a key protector or recovery key removed — and is that change tied to an approved change/maintenance
    ticket?
  context: 'Protector removal, `Disable-BitLocker`/`manage-bde -off`, BitLocker suspension, `fdesetup
    disable`, `cryptsetup luksRemoveKey`/luksKillSlot, cipher or keysize downgrade, and recovery-key deletion
    are all unauthorized configuration changes unless matched to an open approved change window (per NIST
    SP 800-128). For the Harden tactic this is critical: a sophisticated actor or insider may weaken or
    disable FDE to enable later offline data access. Auto-close events that fall inside an approved maintenance
    window; escalate every unmatched downgrade of encryption posture. A positive (unmatched) result is
    a high-priority tamper indicator; a matched result is routine maintenance. Reference: [Guide for Security-Focused
    Configuration Management (NIST SP 800-128)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-128.pdf).'
  answer_sources: *id001
  range: Last 90 days; correlate each change event +/- 7 days against the change-ticket window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "change_events = ['Disable-BitLocker','manage-bde -off','BitLocker suspend',\n  'fdesetup disable','luksRemoveKey','luksKillSlot','cipher_downgrade','recovery_key_delete','protector_removed']\n\
      FOR e in events WHERE e.type in change_events:\n  IF NOT matches_open_change_ticket(e.host, e.time)\
      \ THEN escalate(e)\n  ELSE auto_close(e)"
- question: Which encrypted laptops are configured in ways that leave FDE keys exposed in memory — sleep/suspend
    instead of shutdown/hibernate, TPM-only protectors without a pre-boot PIN, or persistent auto-unlock?
  context: 'Disk encryption protects confidentiality only when the volume is locked or powered off; recently-powered
    or suspended machines can leak FDE keys from DRAM (cold-boot attacks). Within Harden, flag FDE laptops
    configured for sleep/suspend rather than shutdown/hibernate (Kernel-Power 42 without a subsequent
    shutdown), TPM-only protectors with no pre-boot PIN, and persistent auto-unlock. These are posture
    defects even when encryption is nominally ''on'', because an attacker with physical access could recover
    keys from a running or suspended device. A positive result identifies a host that should be reconfigured
    to require pre-boot authentication and full power-down/hibernate. References — [Lest We Remember:
    Cold Boot Attacks on Encryption Keys](https://www.usenix.org/legacy/event/sec08/tech/full_papers/halderman/halderman.pdf)
    and the pre-boot-authentication guidance in [NIST SP 800-111](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-111.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each fde_laptop:\n  IF (sleep_or_suspend_enabled AND NOT hibernate_on_lid)\n     OR (protector\
      \ == 'TPM-only' AND no_preboot_pin)\n     OR persistent_auto_unlock\n  THEN flag('keys_in_memory_exposure',\
      \ host)\n# correlate Kernel-Power 42 without subsequent clean shutdown"
- question: What percentage of devices are encrypted within each asset cohort (by OS version, department,
    hardware model), and which cohorts fall below the policy floor or significantly under the enterprise
    mean?
  context: Define an encrypted-device defect-rate metric and assess it on a fixed cadence (per NIST SP
    800-137 and NISTIR 8011-1). Group assets by OS version, department, and hardware model; compute encrypted-device
    percentage per cohort; flag cohorts below the policy floor (for example 95%) or more than one standard
    deviation under the enterprise mean. Derive the SD/threshold from at least 30 days of your own fleet
    data rather than a fixed global constant. For the Harden tactic this turns individual defects into
    actionable remediation campaigns — a single weak cohort (e.g., an aging hardware model or a specific
    department) represents a systemic gap an attacker can target. References — [Information Security Continuous
    Monitoring (NIST SP 800-137)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-137.pdf)
    and [NISTIR 8011-1](https://nvlpubs.nist.gov/nistpubs/ir/2017/NIST.IR.8011-1.pdf).
  answer_sources: *id001
  range: Last 90 days; recompute on a fixed monitoring cadence using >=30 days of fleet history
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR cohort in group_by(assets, [os_version, department, hw_model]):\n  pct = count(encrypted)/count(total)\
      \ * 100\n  mean, sd = fleet_stats(last_30d)\n  IF pct < policy_floor(95) OR pct < (mean - sd) THEN\
      \ flag_cohort(cohort, pct)"
- question: How are encryption health states (compliant, failed, flapping, in-progress) and the failure
    rate itself trending per cohort over time, and are there spikes that indicate a deployment regression
    or tampering wave?
  context: 'Monitor rolling rates of compliant, failed, flapping, and in-progress encryption states per
    cohort and profile the failure rate as a distinct signal: BitLocker Event 822 failures per 100 endpoints
    per day, deferred-FileVault-enablement that never completes, and LUKS unlock failures (per the metric/trend
    model in NIST SP 800-137). Under Harden, prioritize cohorts with persistent or rising failure trends
    for remediation. A failure-rate spike on a previously-clean cohort is a strong signal of either a
    broken deployment or a coordinated tampering wave and warrants investigation, not just remediation.
    Reference for the metric/trend model: [Information Security Continuous Monitoring (NIST SP 800-137)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-137.pdf).'
  answer_sources: *id001
  range: Last 90 days; rolling daily/weekly trend windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR cohort, day in rolling_window(90d):\n  rates = {compliant, failed, flapping, in_progress}\n\
      \  fail_rate = bitlocker_822_failures / endpoints * 100\n  IF trend(fail_rate) rising OR spike_vs_baseline(cohort)\
      \ THEN prioritize(cohort)"
- question: For volumes reported as 'encrypted', does direct sampling of raw disk sectors show near-maximal
    entropy proving the bytes are actually encrypted — or are there low-entropy regions indicating partial
    or failed encryption?
  context: 'Where management telemetry can be spoofed or stale, sample raw disk sectors/blocks and require
    near-maximal Shannon entropy (>=7.9 bits/byte) to prove the bytes are genuinely encrypted rather than
    merely flagged. Use locally-derived thresholds. For the Harden tactic this is the ground-truth check
    that defeats spoofed compliance attributes: an attacker who fakes a ''compliant'' status cannot fake
    the statistical randomness of ciphertext. Low-entropy regions on a volume reported ''encrypted'' are
    a high-confidence defect (partial or failed encryption) and should be escalated immediately. Threshold
    guidance derived from [Baseline Payload Entropy Values for Common Internet Services (Kenyon et al.)](https://www.mdpi.com/1999-5903/16/12/470).'
  answer_sources: *id001
  range: Last 90 days; spot-check sampling on suspect or high-value assets
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each volume reported_encrypted:\n  samples = read_random_sectors(volume, n=1000)\n  FOR\
      \ s in samples:\n    H = shannon_entropy(s)\n    IF H < 7.9 THEN flag('low_entropy_region', volume,\
      \ offset(s))\n# locally-derived threshold; low entropy => partial/failed encryption"
- question: Across the normally-regular sequence of encryption-management events per host (enable, unlock,
    key-rotation, suspend/resume), are there out-of-distribution event sequences — and what specific deviating
    event and preceding events explain the anomaly?
  context: Model the expected per-host/per-cohort sequence of encryption-management events and flag out-of-distribution
    events using a next-event LSTM (DeepLog) or HMM/n-gram sequence models. Surface the specific deviating
    event key and the top-3 contributing prior events in the alert — for example protector-removal following
    an unexpected disable, or repeated unlock failures before a decryption event. Within Harden, this
    catches subtle tamper patterns that no single deterministic rule covers. Run it in parallel with —
    never replacing — the deterministic disablement and defect-check rules, and treat anomalies as leads
    for analyst review rather than automatic enforcement. References — [DeepLog (Du et al., ACM CCS 2017)](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)
    and [Detecting Intrusions Using System Calls (Warrender, Forrest & Pearlmutter)](https://ieeexplore.ieee.org/document/766910).
  answer_sources: *id001
  range: Last 90 days; sequence windows per host
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = LSTM_next_event(train=normal_encryption_event_sequences_per_host)\nFOR each new event\
      \ e in host_sequence:\n  p = model.predict(prior_events)\n  IF e NOT IN top_k(p) THEN\n    alert(host,\
      \ deviating_event=e, top3_prior=prior_events[-3:])\n# run alongside deterministic rules, not instead\
      \ of"
- question: Which endpoints are most likely to become encryption non-compliant in the near future based
    on their patch level, hardware age/model, prior defect/flap history, open tickets, and health telemetry
    — and what features drive each risk score?
  context: Train a supervised classifier on features from continuous-monitoring history — patch level,
    hardware age/model, prior encryption defect/flap history, open ticket count, and endpoint health telemetry
    — to score the risk of future encryption non-compliance (using the defect-history and metric inputs
    from NISTIR 8011-1 and NIST SP 800-137). Require each alert to list the top-3 contributing features
    (e.g., model with known TPM firmware issue, 3 prior flaps, 45 days unpatched) so triage is explainable.
    For the Harden tactic, use scores to drive proactive remediation — not enforcement decisions — so
    weak assets are fixed before they drift below the encryption posture floor. References for the defect-history
    and metric inputs — [NISTIR 8011-1](https://nvlpubs.nist.gov/nistpubs/ir/2017/NIST.IR.8011-1.pdf)
    and [NIST SP 800-137](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-137.pdf).
  answer_sources: *id001
  range: Last 90 days; retrain on rolling continuous-monitoring history
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [patch_level, hw_age, hw_model, prior_defects, prior_flaps, open_tickets, health]\n\
      model = train_classifier(history, label=became_noncompliant)\nFOR host: score = model.predict_proba(features(host))\n\
      \  emit(host, score, top3_features=explain(model, host))\n# drives proactive remediation, not enforcement"
