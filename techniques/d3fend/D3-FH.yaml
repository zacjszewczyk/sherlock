name: 'D3-FH: File Hashing'
id: 8948715a-85d8-4b11-92d5-9c332dfc5aaa
description: Investigate the enterprise file-hashing detection posture to confirm or deny the presence
  of known-malicious files and to surface suspicious unknown binaries before they execute or spread. This
  playbook helps an analyst (1) deterministically match observed file hashes (MD5/SHA1/SHA256, imphash,
  and fuzzy ssdeep/TLSH digests) against curated malicious-IOC feeds and vulnerable-driver deny-lists
  while suppressing NIST NSRL known-good noise; (2) apply statistical prevalence, spread-velocity, section-entropy,
  and hash/signature failure-rate analytics to find rare unknown files that evade explicit signatures;
  and (3) run explainable static machine-learning classifiers to score and prioritize never-before-seen
  hashes for sandbox detonation and response. It draws telemetry from endpoint process/image/file-creation
  and driver-load events (Sysmon), service installs, and network file transfers (Zeek), and is aligned
  to the Detect mission of measuring how effectively file hashing identifies known and unknown threats
  across the enterprise.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Do any file hashes (MD5/SHA1/SHA256) observed in process creation, image/DLL loads, or file-creation
    events, or in network file transfers, exactly match a known-malicious hash from our curated threat-intel
    feeds?
  context: This is the deterministic floor of file-hashing detection and the highest-confidence signal
    available. Continuously ingest trusted hash IOCs from curated feeds such as Neo23x0 Signature-Base
    and compare them against the Hashes field of Sysmon Event ID 1 (ProcessCreate), Event ID 7 (image/DLL
    load), Event ID 11 (FileCreate), and Zeek files.log extractions. A match is a confirmed presence of
    a known-bad file and should raise an immediate high-severity alert enriched with host, user, full
    path, parent process, and execution context for rapid scoping and containment. A negative result does
    not prove cleanliness (repacked/unknown variants evade exact hashing) so this rule is retained even
    when statistical and ML layers are deployed. In the Detect mission this directly measures coverage
    against known malware.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 6
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: All enterprise endpoints (workstations and servers), critical file servers, driver/image load
    on endpoints, and network egress points where files are transferred.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ingest malicious_hashes from feed(Signature-Base)\nfor event in (sysmon_id1, sysmon_id7, sysmon_id11,\
      \ zeek_files):\n  h = event.sha256 or event.sha1 or event.md5\n  if h in malicious_hashes:\n   \
      \ alert(severity=HIGH, host, user, image_path, parent_process, hash=h)"
- question: Are any driver-load or service-install events loading a binary whose hash matches a known
    vulnerable or malicious driver from the LOLDrivers deny-list, even if the driver is validly signed?
  context: Bring-Your-Own-Vulnerable-Driver (BYOVD) attacks abuse legitimately signed but exploitable
    drivers to gain kernel-level execution, so signer trust alone is insufficient. Match Sysmon Event
    ID 6 (driver load) and Event ID 7045 (service install) hashes against the LOLDrivers SHA256/SHA1/MD5
    feed. Any hit indicates a known-bad or known-vulnerable driver being introduced and should alert with
    the driver path, signer, and loading process so the analyst can determine whether an adversary is
    staging kernel tampering or EDR-blinding. This is a deterministic, low-false-positive control central
    to detecting privileged-execution attempts.
  answer_sources:
  - Sysmon Event ID 6
  - Sysmon Event ID 7045
  - 'NAI: All enterprise endpoints (workstations and servers), critical file servers, driver/image load
    on endpoints, and network egress points where files are transferred.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for event in (sysmon_id6_driverload, sysmon_id7045_serviceinstall):\n  h = event.hash  //\
      \ sha256|sha1|md5\n  if h in loldrivers_feed:\n    alert(severity=HIGH, driver_path=event.path,\
      \ signer=event.signature, loader=event.process)"
- question: Which observed files can be confidently classified as benign known-good using the NIST NSRL
    Reference Data Set so they can be suppressed before any rarity or ML scoring?
  context: False positives overwhelm analysts when benign OS and vendor binaries are scored for rarity
    or maliciousness. Before applying prevalence or ML logic, subtract files whose SHA256/SHA1/MD5 appears
    in the NIST NSRL. NSRL hits should be treated as benign with high confidence to sharply cut noise
    on legitimate operating-system and software binaries. Critically, never allowlist by filename alone,
    only by cryptographic hash, because adversaries routinely masquerade malware under trusted filenames.
    In the Detect mission, accurate known-good suppression is what makes the downstream rare-file and
    ML signals trustworthy and actionable rather than ignored.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 6
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: All enterprise endpoints (workstations and servers), critical file servers, driver/image load
    on endpoints, and network egress points where files are transferred.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for h in observed_hashes(non_iocs):\n  if h in nsrl_set:\n    tag(h, benign_knowngood) and\
      \ suppress_from(rarity_scoring, ml_scoring)\n  // never allowlist by filename only"
- question: Do any PE files share an import-hash (imphash) with a known malware family, indicating a repacked
    variant whose full-file SHA256 changed but whose import-table layout did not?
  context: Adversaries repack and recompile malware to defeat exact-hash detection, but the PE import
    table often remains structurally stable across variants. Compute the imphash from Sysmon Event ID
    1/7 PE metadata and match it against an imphash watchlist of known malware families. A match flags
    a likely family-related sample that exact hashing missed. Because packers can collapse unrelated samples
    to a single imphash, hits must be corroborated (with prevalence, path, signer, behavior) before escalation
    to avoid false positives. This extends deterministic detection to polymorphic and repacked threats.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: All enterprise endpoints (workstations and servers), critical file servers, driver/image load
    on endpoints, and network egress points where files are transferred.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for event in (sysmon_id1, sysmon_id7):\n  ih = imphash(event.pe_metadata)\n  if ih in malware_imphash_watchlist:\n\
      \    score = corroborate(prevalence, path, signer, behavior)\n    if score >= threshold: alert(imphash=ih,\
      \ family=lookup(ih))"
- question: Do any extracted files have a fuzzy hash (ssdeep or TLSH) that is highly similar to a known-bad
    reference sample, indicating a near-duplicate or minor variant?
  context: Single-byte edits, recompilation, or trivial modifications change the exact SHA256 while leaving
    most of the file intact. Compute context-triggered piecewise hashes (ssdeep) and locality-sensitive
    hashes (TLSH) on extracted files and alert when similarity to a known-bad reference exceeds threshold
    (e.g., ssdeep score >= 70, or TLSH distance <= 50, tuned per corpus). A high-similarity match suggests
    an adversary tweaked a known sample to evade exact hashing. Thresholds must be tuned against your
    own benign corpus to balance variant capture against false positives. This is the fuzzy-matching layer
    that catches what exact and imphash matching miss.
  answer_sources:
  - Zeek files.log
  - Sysmon Event ID 11
  - 'NAI: All enterprise endpoints (workstations and servers), critical file servers, driver/image load
    on endpoints, and network egress points where files are transferred.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for f in extracted_files(zeek_files, sysmon_id11):\n  for ref in knownbad_fuzzy_refs:\n  \
      \  if ssdeep_compare(f.ssdeep, ref.ssdeep) >= 70 or tlsh_distance(f.tlsh, ref.tlsh) <= 50:\n   \
      \   alert(file=f.path, matched_ref=ref.id, similarity=score)"
- question: Has a new, unexpected binary hash appeared in a protected critical path (System32, service
    binaries, scheduled-task targets) outside of an approved change window, even without any direct malicious
    IOC match?
  context: Many intrusions plant or replace binaries in trusted system locations without tripping an IOC.
    Maintain allowlists of expected binary hashes for critical paths and services and alert when a new
    hash appears in those paths absent an approved change. This known-good/known-bad correlation model
    (per Costin et al.) catches integrity changes to trusted locations that signature feeds cannot, such
    as binary replacement, DLL side-loading, or service-binary tampering. A positive result means an unexpected
    change to a high-value path and warrants immediate investigation of the change provenance; a negative
    result confirms integrity of the protected paths for the window.
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: All enterprise endpoints (workstations and servers), critical file servers, driver/image load
    on endpoints, and network egress points where files are transferred.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "protected = {System32, service_binaries, scheduled_task_targets}\nfor event in (sysmon_id11,\
      \ sysmon_id1, sysmon_id7):\n  if event.path in protected and event.hash not in approved_hashes[event.path]:\n\
      \    if not within_change_window(event.time):\n      alert(path=event.path, new_hash=event.hash,\
      \ host=event.host)"
- question: Which non-NSRL file hashes are statistically rare across the enterprise (e.g., in the bottom
    1st percentile of distinct-host prevalence over 30 days), and are any of them executing from temp
    or user-writeable paths?
  context: 'Real threats are overwhelmingly rare: F-Secure observed ~99.7% of true threats are low-prevalence,
    so rarity is a powerful malice discriminator after known-good suppression. Compute 30-day enterprise
    prevalence (distinct-host count) for each non-NSRL hash and flag the rarest tail, escalating further
    when rare hashes execute from temp/user-writeable directories or precede suspicious Zeek conn.log
    activity. Derive the percentile cutoff from your own prevalence distribution rather than a fixed number.
    A rare hash running from a user-writeable path with outbound network activity is a strong candidate
    for unknown malware; a high-prevalence hash is far more likely legitimate software. This is the core
    statistical layer for surfacing signatureless threats.'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: All enterprise endpoints and file servers contributing hash telemetry to a central store enabling
    fleet-wide prevalence computation.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "window = 30d\nfor h in distinct_hashes(non_nsrl):\n  prevalence[h] = count_distinct(host)\
      \ over window\ncutoff = percentile(prevalence.values, 1)\nfor h where prevalence[h] <= cutoff:\n\
      \  sev = HIGH if exec_path(h) in (temp, user_writeable) or precedes(zeek_conn_suspicious) else MED\n\
      \  alert(hash=h, prevalence=prevalence[h], severity=sev)"
- question: Are any never-before-seen hashes spreading across hosts faster than the normal software-rollout
    baseline (for example, more than 25 new hosts per hour)?
  context: Self-propagating malware and rapid lateral tooling deployment produce spread velocities that
    exceed routine, managed software rollouts. Track the time and host-count from a hash's first observation
    to multi-host presence and compare against your baseline rollout rate. A never-before-seen hash appearing
    on dozens of hosts within an hour is anomalous and should be escalated as possible worm-like propagation
    or coordinated deployment. The round-robin fleet-inventory pattern (per Microsoft O365 frequency analysis)
    enables this fleet-wide first-seen tracking. A slow, staged appearance consistent with patch management
    is benign; an explosive spread is not.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: All enterprise endpoints and file servers contributing hash telemetry to a central store enabling
    fleet-wide prevalence computation.'
  range: Last 30 days; for a flagged hash, pivot to a tight event-centered window (first-seen +/- 6 hours)
    to reconstruct the spread timeline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for h in new_hashes:\n  first_seen[h] = min(event.time)\n  rate = count_distinct(host where\
      \ time <= first_seen[h] + 1h)\n  if not_seen_before(h) and rate > 25:\n    alert(hash=h, hosts_per_hour=rate,\
      \ first_seen=first_seen[h])"
- question: Among rare unknown PE files, which exhibit high section/byte entropy or packer indicators
    that statistically distinguish them from the benign corpus?
  context: Packed and encrypted malware tends to have high-entropy code sections, a feature shown to be
    a strong zero-day discriminator in XGBoost/Random-Forest studies and the packed/non-packed split work
    behind PE-Probe. For unknown PEs, compute section and byte entropy and packer-structure indicators
    and flag rare hashes whose entropy exceeds the benign distribution (e.g., > 7.2 bits/byte in code
    sections). High entropy combined with rarity is a meaningful pre-execution warning sign of obfuscated
    payloads. Note that some legitimate installers and protected binaries are also packed, so entropy
    is corroborating evidence rather than standalone proof and should be combined with prevalence and
    path context.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - 'NAI: All enterprise endpoints and file servers contributing hash telemetry to a central store enabling
    fleet-wide prevalence computation.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for pe in unknown_pes(rare):\n  e = max(section_entropy(pe)) ; packed = packer_indicators(pe)\n\
      \  if e > 7.2 or packed:\n    alert(hash=pe.sha256, code_entropy=e, packed=packed)"
- question: Are there hosts with anomalous spikes of hash-extraction failures, missing Sysmon Hashes fields,
    or Authenticode signature-verification failures that could indicate tampering or evasion?
  context: Failures are signals, not noise. Locked, unreadable, or zero-byte files, gaps in the Sysmon
    Hashes field, and Authenticode signature-verification failures should each be treated as a distinct
    first-class indicator rather than silently dropped. Profile each host's baseline failure rate and
    alert on anomalous spikes of unsignable or unhashable executions, which can indicate active tampering,
    hash-collision or evasion attempts, or agent interference designed to blind hash-based detection.
    A sudden cluster of unhashable executions on one host is suspicious even when no malicious hash is
    observed, because the absence of expected telemetry is itself the lead.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - 'NAI: All enterprise endpoints and file servers contributing hash telemetry to a central store enabling
    fleet-wide prevalence computation.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_host_failure_rate(hash_extract_fail, hashes_field_gap, authenticode_fail)\n\
      for host in hosts:\n  cur = failure_rate(host, last=1h)\n  if cur > baseline[host] + k*stdev[host]:\n\
      \    alert(host=host, failure_spike=cur, types=[unhashable, unsignable])"
- question: Which unknown files (no IOC match and not in NSRL) receive a high maliciousness probability
    from a static PE classifier, and should be prioritized for triage and sandboxing?
  context: Static machine-learning classifiers can score files that have no signature match at all, filling
    the gap left by deterministic detection. Score unknown hashes with a static PE classifier trained
    on EMBER/EMBER2024 features (byte/entropy histograms, imports, sections, header fields, strings) augmented
    with operational features (hash prevalence, parent process, signer status, path entropy, extension,
    user context, and post-execution Zeek conn.log behavior). LightGBM baselines exceed 98% AUC, and calibrated
    probabilities let analysts rank triage by confidence. This model must run in parallel to, never replacing,
    deterministic hash matching; a high score elevates an otherwise-invisible unknown file for human review
    and detonation.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - 'NAI: Endpoints and file servers where unknown (non-IOC, non-NSRL) PE/script files are created or
    executed and can be statically featurized.'
  range: Last 90 days
  queries:
  - technology: ML/Scoring pseudocode
    query: "feat = ember_features(pe) + operational_features(prevalence, parent, signer, path_entropy,\
      \ ext, user, zeek_conn)\np = lightgbm_static_classifier.predict_proba(feat)  // calibrated\nif p\
      \ >= triage_threshold and hash not in (iocs, nsrl):\n  enqueue_triage(hash, score=p, priority=rank(p))"
- question: For each ML-flagged file, what are the top contributing features (via SHAP/LIME) that drove
    the maliciousness score, so an analyst can validate the verdict?
  context: 'A bare probability is not actionable and erodes analyst trust. Attach per-alert SHAP/LIME
    explanations surfacing the top-3 contributing features (e.g., low imphash prevalence, unsigned binary,
    high section entropy, user-writeable path) so the analyst can confirm the score reflects genuinely
    suspicious attributes rather than artifacts. This follows CNN-GRU SHAP/LIME work, TreeSHAP interaction
    rules over EMBER, and the XAI malware survey. Explainability turns the model from an opaque oracle
    into a decision-support tool: if the top features are benign-consistent the alert can be downgraded,
    and if they are clearly malicious the analyst can escalate with evidence. Never emit a score without
    its explanation.'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - 'NAI: Endpoints and file servers where unknown (non-IOC, non-NSRL) PE/script files are created or
    executed and can be statically featurized.'
  range: Last 90 days
  queries:
  - technology: ML/Explainability pseudocode
    query: "for alert in ml_alerts:\n  contribs = shap_or_lime(model, alert.features)\n  top3 = sort_by_abs(contribs)[:3]\n\
      \  emit(alert, score=alert.p, explanation=top3)  // never emit bare score"
- question: Which previously unseen rare hashes does an ensemble classifier (XGBoost/Random Forest) rank
    highest for sandbox detonation when combined with prevalence and spread-velocity scores?
  context: Sandbox detonation capacity is finite, so unknown files must be prioritized. Use ensemble classifiers
    (XGBoost/Random Forest) over static header and entropy features to rank previously unseen rare hashes,
    per the zero-day detection study, and fuse the ML rank with the statistical prevalence and spread-velocity
    scores to set an overall response priority. This produces a single, defensible ordering so the rarest,
    fastest-spreading, highest-scoring unknowns are detonated and adjudicated first. The combined ranking
    is what operationalizes zero-day discovery within real SOC throughput constraints in the Detect mission.
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Zeek files.log
  - 'NAI: Endpoints and file servers where unknown (non-IOC, non-NSRL) PE/script files are created or
    executed and can be statically featurized.'
  range: Last 90 days
  queries:
  - technology: ML/Ensemble pseudocode
    query: "rank_ml = ensemble_xgb_rf.rank(static_header_entropy_features(unseen_rare_hashes))\npriority\
      \ = combine(rank_ml, prevalence_score, velocity_score)\nfor h in top(priority, N):\n  send_to_sandbox(h,\
      \ priority=priority[h])"
