name: 'D3-FIM: File Integrity Monitoring'
id: eb34dd16-d7c8-41ae-b82b-4215f7e3caa5
description: Investigate suspected unauthorized changes to critical system files, directories, and registry
  keys using File Integrity Monitoring (FIM). This playbook helps an analyst determine whether immutable
  system/application files have been created, modified, deleted, or had their permissions altered without
  authorization — for example when a baselined cryptographic hash changes, when the responsible user or
  process is unexpected (a service or web server writing to System32, a non-package-manager process replacing
  a system binary), or when change volume exceeds normal operational baselines. It layers a deterministic
  hash-baseline and watchlist detection floor with statistical change-rate anomaly detection and machine-learning
  behavioral, sequence, and provenance-graph analysis to surface tampering with kernel binaries, security/EDR
  agents, web roots, /etc, /bin, autostart and security-policy registry hives, domain controllers, and
  endpoints handling sensitive intellectual property.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
