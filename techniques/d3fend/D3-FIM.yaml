questions:
- question: Has any immutable system or application file changed when compared against its signed, read-only
    cryptographic hash baseline (SHA-256) or expected file attributes (size, mode, owner, link count,
    mtime/ctime)?
  context: 'This is the non-negotiable deterministic detection floor for the Detect tactic. Maintain a
    signed baseline of SHA-256 hashes and inode/file attributes for every immutable system/application
    file, then compare the current file system against that read-only baseline. Any hash mismatch or attribute
    deviation is a high-confidence indicator that a protected file was tampered with — even if the change
    appears benign on the surface. A positive result (mismatch) means the file no longer matches its trusted
    state and must be triaged for malicious replacement or modification; a negative result means integrity
    is intact. Tune the scope of monitored files to reduce noise, but never disable the rule. Tools such
    as Tripwire and AIDE implement this approach. References: [The Design and Implementation of Tripwire](https://dl.acm.org/doi/10.1145/191177.191183)
    and [AIDE](https://aide.github.io/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: FIM/pseudocode
    query: "for each file in baseline_watchlist:\n  cur = sha256(file) + attributes(file)\n  if cur !=\
      \ signed_baseline[file]:\n    alert(severity=high, type='hash_or_attr_mismatch', file=file,\n  \
      \        expected=signed_baseline[file], observed=cur)"
- question: Have any watchlisted immutable system or application files (kernel binaries, security/EDR
    agents, web roots, /etc, /bin, autorun registry keys) been written to, created, or deleted outside
    an approved maintenance window?
  context: 'Watchlist enforcement gives deterministic coverage of the most security-relevant files. For
    the Detect tactic, alert on write/delete access (Windows Event ID 4663), delete events (Sysmon Event
    ID 23), file creates (Sysmon Event ID 11), and Linux auditd/inotify changes that affect watchlisted
    paths. Restricting alerts to approved maintenance windows reduces noise from legitimate patching.
    A hit outside a change window on a critical path (e.g., a new binary appearing in System32 or an autorun
    registry key being modified) strongly suggests persistence or defense-evasion activity and warrants
    immediate investigation of the responsible process and user. Reference: [File Integrity Monitoring
    in Microsoft Defender for Cloud](https://learn.microsoft.com/en-us/azure/defender-for-cloud/file-integrity-monitoring-overview).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=endpoint (EventID=4663 AccessMask IN (write,delete))\n  OR (sysmon EventID IN (11,23))\n\
      \  OR (auditd type=PATH watch=fim)\n| where ObjectName IN (critical_watchlist)\n| where NOT in_maintenance_window(_time,\
      \ host)\n| table _time host user process ObjectName EventID"
- question: Did a file permission or ACL change (Windows Security Event ID 4670) on a protected object
    immediately precede a write or delete on that same object, indicating a privilege-then-tamper sequence?
  context: 'Attackers often relax permissions on a protected file before modifying it. For the Detect
    tactic, correlate ACL/permission changes (Event ID 4670) with nearby write/delete events on the same
    object within a short window (e.g., 5 minutes). Escalate when an ACL change appears to enable subsequent
    modification of a protected file. A positive correlation (permission loosened, then file modified
    by the same or related actor) is a high-fidelity tamper signal; isolated permission changes during
    sanctioned administration are expected and lower priority. Reference: [File Integrity Monitoring in
    Microsoft Defender for Cloud](https://learn.microsoft.com/en-us/azure/defender-for-cloud/file-integrity-monitoring-overview).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days; correlate events within a 5-minute window centered on the ACL change
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'acl = search(EventID=4670 ObjectName IN critical_watchlist)

      mods = search(EventID=4663 AccessMask IN (write,delete))

      join object_name [acl, mods]

      | where mods._time - acl._time between 0 and 300s

      | alert(type=''privilege_then_tamper'', object=ObjectName, user=user)'
- question: Was a watchlisted critical file modified by an unexpected responsible process or parent process
    (for example a service or web server writing to System32, or a non-package-manager process replacing
    a system binary)?
  context: 'Who-data attribution (Linux auditd, Windows SACL) ties each file change to the responsible
    user and process. For the Detect tactic, alert when a watchlisted file is modified by a process that
    is not in the approved set for that path. Legitimate changes to system binaries normally come from
    package managers, installers, or trusted update services; a web server, scripting interpreter, or
    unknown process touching System32 or /bin is anomalous and a classic indicator of post-exploitation
    tampering. A positive result identifies both the suspect process and its parent for rapid containment.
    Reference: [File Integrity Monitoring (Wazuh Documentation)](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search EventID=4663 OR auditd_who_data ObjectName IN critical_watchlist

      | lookup approved_writers path=ObjectName process AS allowed

      | where isnull(allowed)

      | table _time host user process parent_process ObjectName'
- question: Is there a spike in access-denied or otherwise blocked modification attempts (failed writes/deletes,
    read-only-filesystem violations) against watchlisted protected paths on any host?
  context: 'Failure states are distinct, valuable signals. For the Detect tactic, count access-denied
    write/delete attempts (Event ID 4663 with failure status), blocked deletes, and read-only-filesystem
    violations against watchlisted paths per host/hour. A spike in denied modification attempts on protected
    files indicates active tamper attempts even when no change actually succeeds — evidence that an adversary
    is probing or being stopped by controls. A positive result (a burst of denials) should trigger investigation
    of the acting account/process even though integrity was preserved. Reference: [File Integrity Monitoring
    (Wazuh Documentation)](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html).'
  answer_sources:
