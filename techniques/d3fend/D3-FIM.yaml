  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EventID=4663 Status=AccessDenied ObjectName IN critical_watchlist

      | bin _time span=1h

      | stats count by host, _time

      | where count > denied_attempt_floor

      | alert(type=''blocked_tamper_spike'', host=host)'
- question: Does any host or critical directory show a file create/delete/modify volume that is a statistical
    outlier versus its own 30+ day baseline using a robust modified Z-score and a static floor?
  context: 'Fixed thresholds are easily distorted by backup and patch batch jobs. For the Detect tactic,
    build per-host and per-critical-directory baselines for change volume (Sysmon Event IDs 11/23, Event
    ID 4663) and apply the robust modified Z-score (flag where |0.6745*(x-median)/MAD| > 3.5) plus a static
    floor (e.g., >50 changes/hour to System32). Median/MAD resists distortion from batch jobs, and the
    static floor catches absolute-volume abuse. A positive result is a change burst that is both unusual
    for that host/directory and above an operational floor, suggesting mass file tampering, ransomware-style
    activity, or rapid persistence deployment. Reference: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days; baseline derived from 30+ days of history
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search (sysmon EventID IN (11,23)) OR EventID=4663 ObjectName IN critical_dirs

      | bin _time span=1h | stats count AS x by host, directory, _time

      | eventstats median(x) AS med, mad(x) AS mad by host, directory

      | eval mz = abs(0.6745*(x-med)/mad)

      | where mz > 3.5 OR (directory=''System32'' AND x > 50)'
- question: Does observed change volume on a host or directory fall outside the prediction interval of
    a seasonal (ARIMA) forecast that models normal patch/backup/maintenance cycles?
  context: 'Some change bursts are off-schedule rather than high-volume, and fixed thresholds miss them.
    For the Detect tactic, fit online ARIMA models to per-host/per-directory change-count time series
    to learn normal patch/backup/maintenance seasonality, then alert when observed change volume falls
    outside the one-step-ahead prediction interval. A positive result is a change burst occurring at an
    unexpected time relative to learned cycles — e.g., heavy modification activity on a day with no scheduled
    maintenance — which is a strong indicator of unauthorized tampering disguised within otherwise normal-looking
    volumes. Reference: [Online Forecasting and Anomaly Detection Based on the ARIMA Model](https://www.mdpi.com/2076-3417/11/7/3194).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days; train on multiple seasonal cycles of history
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = change_counts by host, directory over time\nmodel = ARIMA.fit_online(series)\npred,\
      \ lo, hi = model.forecast(step=1)\nif observed < lo or observed > hi:\n  alert(type='seasonal_change_anomaly',\
      \ host=host, observed=observed, interval=[lo,hi])"
- question: Are multiple hosts experiencing high integrity-alert counts within the same time window above
    the historical 95th percentile, suggesting coordinated or worm-like tampering?
  context: 'Single-host anomalies can be benign, but simultaneous anomalies across many hosts are not.
    For the Detect tactic, measure how many hosts experience high-integrity-alert counts in the same time
    window and compare against the historical distribution. Multi-host bursts above the 95th percentile
    indicate potentially coordinated tampering, lateral movement, or worm-like propagation. A positive
    result reframes scattered single-host alerts as a campaign and should escalate scope from host triage
    to enterprise incident response. Reference: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search fim_alerts | bin _time span=15m

      | stats dc(host) AS hosts_alerting by _time

      | eventstats perc95(hosts_alerting) AS p95

      | where hosts_alerting > p95

      | alert(type=''multi_host_integrity_burst'', concurrent_hosts=hosts_alerting)'
- question: For fleets of identical hosts, containers, or golden images, does any single node's file-change
    distribution deviate from its peer-group consensus?
  context: 'Identical nodes should behave identically; a deviating node is suspect without needing a learned
    baseline. For the Detect tactic, compare each node''s file-change distribution against its peer group
    (same role, image, or container template). A node whose change profile diverges from the consensus
    — extra files modified, different directories touched, unusual binaries replaced — is anomalous and
    may be compromised. This training-less consensus approach (as in ReplicaWatcher) is especially effective
    in containerized microservices and golden-image fleets where drift implies tampering. Reference: [ReplicaWatcher:
    Training-less Anomaly Detection in Containerized Microservices](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search fim_changes | stats values(directory) AS dirs, count AS chg by node, peer_group

      | eventstats consensus(dirs) AS grp_dirs, median(chg) AS grp_med by peer_group

      | eval deviation = jaccard_distance(dirs, grp_dirs)

      | where deviation > peer_threshold OR chg > 3*grp_med

      | alert(type=''peer_group_deviation'', node=node)'
- question: Do any per-host or per-process change-feature vectors score as outliers under an Isolation
    Forest model trained on change behavior (change count, distinct directories, bytes written, off-hours
    fraction, permission changes, hash churn)?
  context: 'Unlabeled anomaly detection surfaces novel tamper behavior no rule anticipates. For the Detect
    tactic, score per-host/per-process change-feature vectors with Isolation Forest to identify outlier
    change behavior without labels. Useful features include change count, distinct directories touched,
    bytes written, off-hours fraction, permission-change count, and hash churn. Emit the top-3 contributing
    features (e.g., file path, responsible process, off-hours fraction) in the alert to speed triage.
    A positive result flags a host/process whose aggregate change behavior is unlike the rest of the population,
    which often corresponds to stealthy, low-volume tampering that evades thresholds. Reference: [Isolation
    Forest](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [change_count, distinct_dirs, bytes_written, offhours_frac, perm_changes, hash_churn]\n\
      model = IsolationForest(contamination=auto).fit(history_features)\nscore = model.decision_function(current_features)\n\
      if score < anomaly_cutoff:\n  alert(type='change_feature_outlier', host=host, top_features=top3_contributors())"
- question: Does any host's file/registry change-event sequence contain events outside the top-g predictions
    of a DeepLog-style LSTM model of normal change workflows (e.g., a binary replacement not preceded
    by an installer event)?
  context: 'Order and context matter: a legitimate file replacement is normally preceded by an installer
    or update event. For the Detect tactic, train DeepLog-style LSTM models on host file/registry change-event
    and audit-log sequences to learn normal change workflows, then flag events that fall outside the top-g
    predicted next events. A binary replacement with no preceding installer event, or a registry persistence
    write that does not follow a sanctioned change sequence, is anomalous. The model supports online learning
    from analyst feedback. A positive result identifies the specific out-of-sequence event for root-cause
    analysis. Reference: [DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep Learning](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = ordered_change_events(host)\nmodel = DeepLog_LSTM.train(normal_sequences)\nfor event\
      \ in seq:\n  if event not in model.predict_topg(prior_context):\n    alert(type='change_sequence_anomaly',\
      \ host=host, event=event, context=prior_context)"
- question: Do any service or binary processes exhibit runtime system-call sequences that deviate from
    their established short-sequence behavioral baseline, indicating the anomalous process behavior that
    produces unauthorized file modifications?
  context: 'Unauthorized file changes are produced by processes behaving abnormally. For the Detect tactic,
    baseline normal program behavior as short system-call sequences per service/binary (the classic ''sense
    of self'' approach) and flag processes whose runtime sequences deviate from that baseline. This catches
    a trusted process that has been hijacked or is being abused to modify protected files, even before
    the file-change alert fires. A positive result links anomalous process behavior to the integrity-affecting
    modifications it causes, enabling earlier and more precise containment. Reference: [A Sense of Self
    for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
  - Sysmon Event ID 23
  - Linux auditd / inotify file events
  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: EDR/ML pseudocode
    query: "baseline = short_syscall_ngrams(service_binary, normal_runs)\nfor window in runtime_syscall_stream(process):\n\
      \  if mismatch_ratio(window, baseline) > tolerance:\n    alert(type='process_behavior_anomaly',\
      \ process=process, binary=binary)"
- question: When a critical file is modified, does whole-system provenance-graph analysis place that modification
    within an anomalous causal chain of process/file/socket activity?
  context: 'Isolated change alerts lack context and generate false positives. For the Detect tactic, build
    whole-system provenance graphs (process/file/socket nodes and causal edges from Sysmon/auditd) and
    apply graph learning to contextualize file modifications within their causal chains. Temporal GNN
    scoring with attack-graph reconstruction (KAIROS), node-level GraphSAGE to pinpoint the exact anomalous
    file/process node (ThreaTrace), masked-graph autoencoders with concept-drift adaptation (MAGIC), and
    snapshot embeddings of abnormal causal patterns (PROGRAPHER) each reduce false positives versus isolated
    alerts and enable root-cause tracing of which process touched a critical file. Surface the top contributing
    nodes/edges in the alert. A positive result not only confirms tampering but reconstructs the full
    attack path leading to it. References: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf), [ThreaTrace](https://arxiv.org/pdf/2111.04333),
    [MAGIC](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf), and [PROGRAPHER](https://www.usenix.org/system/files/usenixsecurity23-yang-fan.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Security Event ID 4670
  - Sysmon Event ID 11
