  - FIM agent change events (Tripwire/AIDE/Wazuh/Defender for Cloud)
  - 'NAI: Critical system directories (e.g., C:\Windows\System32, /etc, /bin, /usr/sbin), autostart and
    security-policy registry hives, web server root directories, security-agent and EDR binaries, domain
    controllers, and endpoints handling sensitive intellectual property.'
  range: Last 90 days
  queries:
  - technology: Provenance-graph/ML pseudocode
    query: "G = build_provenance_graph(sysmon, auditd)  # process/file/socket nodes, causal edges\nscores\
      \ = temporal_gnn_score(G)   # KAIROS / ThreaTrace / MAGIC / PROGRAPHER\nfor node in scores where\
      \ node.touches(critical_file) and node.anomaly > tau:\n  alert(type='provenance_integrity_anomaly',\
      \ node=node, path=root_cause_chain(node))"
