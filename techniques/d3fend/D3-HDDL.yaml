name: 'D3-HDDL: Hierarchical Domain Denylisting'
id: a0650465-1074-4edd-aea4-751c9c99d18f
description: This playbook helps an analyst investigate and verify the effectiveness of hierarchical domain
  denylisting — blocking the DNS resolution of a malicious parent domain and every descendant subdomain.
  It guides confirmation that parent domains and all child subdomains are actually blocked (failed resolution,
  no egress) while surfacing successful resolutions, bypass paths (alternate resolvers, DoH/DoT, CNAME/DNAME
  chains, unusual record types), stale or zero-hit denylist entries, and high-risk emerging domain hierarchies
  that warrant denylist expansion. It combines deterministic RPZ/DNS-policy enforcement checks, resolution-to-connection
  correlation, denylist coverage and staleness audits, statistical discovery of high-risk and surging
  domains, NXDOMAIN/SERVFAIL failure-rate profiling for DGA hierarchies, and machine-learning classification
  of parent domains to expand coverage to sibling infrastructure.
type: technique
related:
- tactic_id: D3-ISO
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are hierarchical deny rules covering each malicious parent domain AND every descendant subdomain
    (including wildcard *.parent patterns) actually enforced so that any blocked hierarchy returns NXDOMAIN
    or is sinkholed, with no NOERROR-with-answer responses leaking through?
  context: 'Supports the Isolate tactic by verifying that the denylist truly isolates the network from
    known malicious infrastructure. Enforce hierarchical deny rules using wildcard QNAME/NSDNAME triggers
    in DNS Response Policy Zones (RPZ) or wildcard FQDN query-resolution policies on Windows DNS; rules
    must follow CNAME/DNAME alias chains to the denied target per RFC 1035 name-space semantics. Validate
    enforcement from RPZ hit logs and DNS analytic logs: a denied hierarchy must return NXDOMAIN or a
    sinkhole address. A positive (bad) result is any Zeek dns.log or DNS server log entry showing a NOERROR
    response WITH a populated answer record for a blocked parent or *.parent pattern — that is a hard
    enforcement failure indicating the control is not isolating that hierarchy. A negative result (all
    denied hierarchies returning NXDOMAIN/sinkhole) confirms enforcement. References for this enforcement
    method: [RPZ](https://datatracker.ietf.org/doc/html/draft-vixie-dnsop-dns-rpz-00), [Microsoft DNS
    Policy](https://learn.microsoft.com/en-us/windows-server/networking/dns/deploy/apply-filters-on-dns-queries),
    [RFC 1035](https://www.rfc-editor.org/rfc/rfc1035).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Logs
  - Zeek conn.log
  - RPZ/DNS firewall hit logs
  - 'NAI: Internal DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM dns_logs\nWHERE (qname IN denylist_parents OR qname MATCHES '*.'+denylist_parents)\n\
      \  AND rcode == 'NOERROR' AND answer_count > 0\nEMIT alert('Hierarchical deny enforcement failure:\
      \ denied hierarchy resolved', qname, answers)"
  - technology: RPZ/pseudocode
    query: 'expected = NXDOMAIN or sinkhole_ip for each denied parent and *.parent

      FROM rpz_hit_logs JOIN dns_analytic_logs ON query_id

      WHERE denied_hierarchy AND response NOT IN {NXDOMAIN, sinkhole_ip}

      ALERT ''denied hierarchy not enforced'''
- question: When a domain in a blocked hierarchy does successfully resolve, did any internal host then
    make an outbound network connection to the resolved IP, and are queries for denied hierarchies bypassing
    the control via non-approved resolvers, DoH/DoT, CNAME chains, or alternate record types?
  context: 'Supports the Isolate tactic by detecting failures of the deny control that allow egress to
    malicious infrastructure. Correlate any successful blocked-hierarchy resolution with Zeek conn.log
    egress sessions to the resolved IP; any resulting outbound communication is a deny-control failure
    requiring immediate response. Explicitly profile bypass paths: queries for denied hierarchies sent
    to non-approved resolvers (hard-coded 8.8.8.8/1.1.1.1, DoH/DoT on 443/853), resolution via CNAME chains
    whose final target is denied, or alternate record types (TXT/NULL/MX) returning answers for a denied
    parent. Cross-reference resolved IPs against the IP set historically returned for denied hierarchies
    so infrastructure reuse under a new, uncovered name is caught. A positive result means an isolation
    gap exists; the host and infrastructure should be contained and the denylist expanded. Reference for
    this correlation method: [Zeek](https://www.rfc-editor.org/rfc/rfc1035).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Logs
  - Zeek conn.log
  - RPZ/DNS firewall hit logs
  - 'NAI: Internal DNS Resolvers, Network Egress Points'
  range: Last 90 days; pivot to a +/- 1 hour window around each successful denied resolution
  queries:
  - technology: Zeek/pseudocode
    query: "resolved = FROM dns.log WHERE qname IN denied_hierarchy AND rcode=='NOERROR' SELECT answer_ips,\
      \ host, ts\negress  = FROM conn.log WHERE resp_h IN resolved.answer_ips AND orig_h == resolved.host\n\
      \         AND conn.ts BETWEEN resolved.ts AND resolved.ts+1h\nEMIT alert('deny bypass + egress',\
      \ host, qname, resp_h)"
  - technology: SIEM/Rule pseudocode
    query: "FROM dns_logs WHERE qname IN denied_hierarchy AND (\n  resolver NOT IN approved_resolvers\
      \ OR dest_port IN (853) OR proto=='DoH' OR\n  qtype IN ('TXT','NULL','MX') OR cname_chain_final\
      \ IN denylist_parents)\nALERT 'denied hierarchy bypass path'\nALSO check answer_ip IN historical_denied_ip_set\
      \ -> 'infrastructure reuse under new name'"
- question: On the maintenance cycle, which denylist entries are now stale (resolving only to parked/sinkhole
    ranges or with zero hits), and which active malicious second-level domains seen in resolver logs lack
    a corresponding wildcard parent rule, and what is the measured coverage of the denylist?
  context: 'Supports the Isolate tactic by ensuring the denylist remains complete and fresh so isolation
    is not silently eroded. On a fixed maintenance cycle, audit denylist health to expose silent gaps:
    flag entries that now resolve only to parked/sinkhole IP ranges (stale, candidates for removal), entries
    with zero hits over the window, and active malicious second-level domains observed in resolver logs
    that lack a corresponding wildcard parent rule (coverage gap). Report measured coverage as blocked-hierarchy
    hits divided by total observed malicious-hierarchy queries so freshness and completeness are quantified
    rather than assumed. A low coverage ratio or many uncovered active hierarchies indicates the denylist
    needs expansion; many stale/zero-hit entries indicate pruning is due. Reference for this audit method:
    [Paint It Black](https://christian-rossow.de/publications/blacklists-raid2014.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Logs
  - Zeek conn.log
  - RPZ/DNS firewall hit logs
  - 'NAI: Internal DNS Resolvers, Network Egress Points'
  range: Last 90 days (aligned to denylist maintenance cycle)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stale = FROM denylist e WHERE all_resolved_ips(e) IN parked_or_sinkhole_ranges

      zero_hit = FROM denylist e WHERE hit_count(e, window) == 0

      uncovered = FROM dns.log WHERE qname IN known_malicious_sld AND NOT EXISTS wildcard_parent_rule(qname)

      coverage = blocked_hierarchy_hits / total_malicious_hierarchy_queries

      REPORT stale, zero_hit, uncovered, coverage'
- question: Among newly observed second-level domains, which parents show anomalous volume, frequency/requester
    diversity, and high subdomain-label randomness (KL-divergence above the 99th benign percentile and
    query frequency >3 sigma above baseline) that make them strong candidates for hierarchical denylisting?
  context: 'Supports the Isolate tactic by discovering high-risk hierarchies before they are exploited
    so they can be proactively isolated. For newly observed second-level domains, compute Volume (distinct
    resolved IPs/ASNs/countries, query and response byte counts), Frequency (queries/min and distinct
    internal requester count — high requester diversity is a strong upper-hierarchy malware signal), and
    subdomain-label randomness using KL-divergence against an English letter-frequency baseline (more
    robust than raw Shannon entropy on short labels), with Shannon-entropy/Levenshtein thresholds calibrated
    from DGA research. Flag parents whose label KL-divergence exceeds the 99th benign percentile AND whose
    query frequency is >3 sigma above the per-parent baseline as denylist candidates. Derive percentile/sigma
    thresholds from a 7-30 day baseline of your own resolver traffic. Flagged parents are reviewed for
    wildcard denylist inclusion. References for these discovery metrics: [Kopis](https://www.usenix.org/legacy/events/sec11/tech/full_papers/Antonakakis.pdf),
    [Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/), [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Logs
  - Zeek conn.log
  - RPZ/DNS firewall hit logs
  - 'NAI: Internal DNS Resolvers, Network Egress Points'
  range: Last 90 days (baseline 7-30 days for thresholds)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM dns.log WHERE parent_domain NOT IN seen_before(30d)\nGROUP BY parent_domain COMPUTE\n\
      \  vol = distinct(resolved_ip), distinct(asn), distinct(country), sum(bytes)\n  freq = queries_per_min,\
      \ distinct(internal_requester)\n  rand = KL_divergence(label_char_freq, english_baseline)\nWHERE\
      \ rand > pctile99(benign_KL) AND freq > mean_freq + 3*std_freq\nEMIT denylist_candidate(parent_domain,\
      \ vol, freq, rand)"
- question: Has any never-before-seen or newly registered parent domain shown a sudden surge in query
    volume (>3 sigma above baseline) or appeared abruptly across many internal hosts, together with short-lifetime/low-TTL/changing-answer-IP
    characteristics indicating campaign onset?
  context: 'Supports the Isolate tactic by forecasting emerging malicious infrastructure so it can be
    denylisted at campaign onset. Model query volumes for newly registered or newly observed domains using
    prevalence-and-dynamism features (short domain lifetime, low or changing TTL, rapidly changing answer
    IP sets) and reputation features. Trigger alerts when a never-before-seen parent''s query volume deviates
    significantly (e.g., >3 sigma) from baseline or appears suddenly across many internal hosts, indicating
    campaign onset. Tune the deviation threshold to your environment''s new-domain churn. A positive result
    flags a candidate hierarchy for rapid review and potential wildcard denylisting before widespread
    egress. References for these forecasting features: [EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf),
    [Notos](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Logs
  - Zeek conn.log
  - RPZ/DNS firewall hit logs
  - 'NAI: Internal DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM dns.log WHERE parent_domain IS new_or_recently_registered\nGROUP BY parent_domain, time_bucket\
      \ COMPUTE\n  q_vol, distinct_internal_hosts, min_ttl, ttl_variance, distinct_answer_ip_over_time,\
      \ domain_age\nWHERE q_vol > baseline_mean + 3*baseline_std OR sudden_appearance_across(distinct_internal_hosts)\n\
      AND (domain_age < 30d OR min_ttl low OR ttl_changing OR answer_ip_churn high)\nEMIT alert('new-domain\
      \ surge / campaign onset', parent_domain)"
- question: Which internal hosts show NXDOMAIN/SERVFAIL failure bursts (rate >10x the 7-day baseline or
    ~>50/min) with high label entropy and lexically clustered failed names, and among those failures which
    names DO resolve and are therefore likely active C2 parents to add to the denylist?
  context: 'Supports the Isolate tactic by detecting DGA-driven hierarchies, which surface as bursts of
    failed resolutions before any domain is registered or listed, enabling pre-emptive isolation. Profile
    the failure mode directly — per-host NXDOMAIN and SERVFAIL rates over time. Cluster a host''s NXDOMAIN
    responses by lexical similarity and alert when a host''s NXDOMAIN rate exceeds 10x its 7-day baseline
    (or roughly >50 per minute) with high label entropy. The small subset of those algorithmically generated
    names that DO resolve are likely active C2 parents and should be added to the denylist. A positive
    result both identifies a likely-infected host and yields concrete denylist additions. Reference for
    this failure-rate method: [Pleiades](https://www.usenix.org/system/files/conference/usenixsecurity12/sec12-final127.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Logs
  - Zeek conn.log
  - RPZ/DNS firewall hit logs
  - 'NAI: Internal DNS Resolvers, Network Egress Points'
  range: Last 90 days (per-host 7-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM dns.log WHERE rcode IN ('NXDOMAIN','SERVFAIL')\nGROUP BY host, time_bucket COMPUTE fail_rate,\
      \ avg_label_entropy\nWHERE fail_rate > 10 * host_baseline_7d OR fail_rate > 50/min\n  AND avg_label_entropy\
      \ high\ncluster = lexical_cluster(failed_qnames)\nresolving = FROM dns.log WHERE qname IN cluster\
      \ AND rcode=='NOERROR'\nEMIT suspected_dga_host(host); RECOMMEND denylist_add(resolving)"
- question: When a classifier scores parent domains and NXDOMAINs on lexical and behavioral features,
    which parents are flagged as high-confidence malicious (with the top-3 contributing features surfaced)
    and recommended for analyst review and hierarchical wildcard denylist inclusion or expansion to sibling
    hierarchies?
  context: 'Supports the Isolate tactic by expanding denylist coverage to sibling/related malicious hierarchies
    that deterministic rules miss. Running in parallel to (never replacing) the deterministic deny and
    threshold rules, score parent domains and NXDOMAINs with a classifier on lexical and behavioral features
    — domain/label length, n-gram normality, entropy, character ratios, IP/host dispersion, query cadence,
    and NXDOMAIN profile — using interpretable models such as Random Forest/SVM (FANCI), a character-level
    LSTM on the raw FQDN, reputation clustering (Notos), or graph association to known-bad seeds to reach
    sibling hierarchies. Each alert MUST surface the top-3 contributing features (e.g., label entropy,
    n-gram abnormality, IP fan-out) in its text. Only high-confidence malicious parents are recommended
    for hierarchical (wildcard) denylist inclusion, and always for analyst review rather than automatic
    blocking. References for these classifiers: [FANCI](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-schuppen.pdf),
    [Woodbridge et al.](https://arxiv.org/pdf/1611.00791), [Notos](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf),
    [Khalil et al.](https://www3.cs.stonybrook.edu/~phillipa/papers/asiaccs143-khalil.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows DNS Server Analytic Logs
  - Zeek conn.log
  - RPZ/DNS firewall hit logs
  - 'NAI: Internal DNS Resolvers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = extract(domain_len, label_len, ngram_normality, entropy, char_ratios,\n       \
      \            ip_dispersion, host_dispersion, query_cadence, nxdomain_profile)\nscore = model.predict_proba(features)\
      \   # RF/SVM (FANCI), char-LSTM, reputation/graph\nWHERE score >= high_confidence_threshold\nEMIT\
      \ alert(parent, score, top3_features(features)) -> recommend wildcard_denylist (analyst review)"
