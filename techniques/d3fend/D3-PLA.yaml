name: 'D3-PLA: Process Lineage Analysis'
id: a0a66f17-c416-4a9d-9235-10007074f143
description: Investigate suspicious process execution on endpoints by analyzing process lineage — the
  ancestry, siblings, command lines, timing, and tree geometry of running processes — to detect anomalous
  execution that deviates from established parent-child norms (D3-PLA, supporting the Detect tactic).
  Process lineage telemetry can reveal impossible or rare parents of sensitive Windows system binaries,
  Office/browser processes spawning shells or LOLBins, lsass.exe or winlogon.exe spawning interactive
  tools, abnormal command-line characteristics, anomalous tree shape (depth, branching, burstiness, descendant
  counts), and elevated process-creation failure or blocked-spawn rates — all indicators of exploitation,
  masquerading, LOLBin abuse, injected execution, or lateral movement. This playbook helps an analyst
  combine deterministic known-good-parent allowlists and high-risk-lineage rules, statistical baselining
  of rare parent-child pairs / tree geometry / failure rates / correlated provenance threat scoring, and
  machine-learning provenance-graph and sequence models so that anomalous process nodes and causal attack
  chains can be surfaced, explained, and triaged.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which sensitive Windows system binaries (svchost.exe, smss.exe, csrss.exe, wininit.exe, services.exe,
    lsass.exe, spoolsv.exe) launched with a parent process that is NOT on their documented known-good
    parent allowlist?
  context: 'Within the Detect (D3-D) tactic, deterministic child->expected-parent allowlists are the detection
    floor for process lineage. Core Windows images have a small, well-known set of legitimate parents:
    svchost.exe should be parented only by services.exe (or documented launchers), and smss.exe, csrss.exe,
    wininit.exe, services.exe, lsass.exe, and spoolsv.exe each have canonical parent mappings. Any deviation
    — for example svchost.exe spawned by a non-services.exe process — is a strong masquerading or injection
    indicator, per the Splunk [Non-Services.exe Spawn Svchost.exe](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/)
    rule, Elastic''s [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)
    rule, and [CAR-2020-11-004: Processes Started From Irregular Parent](https://car.mitre.org/analytics/CAR-2020-11-004/).
    A positive result (an allowlist violation) warrants immediate triage; keep these deterministic mappings
    as the detection floor and tune per-environment exceptions rather than disabling rules.'
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_creation (Sysmon EID 1 OR Windows EID 4688)

      | where lower(child_image) in (svchost.exe, smss.exe, csrss.exe, wininit.exe, services.exe, lsass.exe,
      spoolsv.exe)

      | lookup known_good_parents on child_image -> expected_parents

      | where lower(parent_image) not in expected_parents

      | table host, child_image, parent_image, command_line, user, _time'
- question: Did any Office application, browser, or other user-facing process spawn a command shell (cmd.exe,
    powershell.exe, bash) or a LOLBin (rundll32.exe, regsvr32.exe, mshta.exe, wmic.exe), or did lsass.exe
    spawn ANY child process?
  context: Within the Detect (D3-D) tactic, certain parent-child lineages are almost always malicious.
    Productivity and browser processes (winword.exe, excel.exe, outlook.exe, acrobat.exe, chrome.exe)
    spawning interactive shells or living-off-the-land binaries strongly suggests a malicious document,
    macro, or exploit executing follow-on code, per [Process Injection (T1055), Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).
    Similarly, lsass.exe legitimately spawns no child processes, so any lsass.exe child is a high-fidelity
    injection/credential-theft signal. Pair each lineage match with command-line and network context to
    raise fidelity and reduce noise from rare legitimate automation.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_creation (Sysmon EID 1 OR Windows EID 4688)

      | eval office_browser = lower(parent_image) in (winword.exe, excel.exe, powerpnt.exe, outlook.exe,
      acrobat.exe, acrord32.exe, chrome.exe, msedge.exe, firefox.exe)

      | eval shell_or_lolbin = lower(child_image) in (cmd.exe, powershell.exe, pwsh.exe, bash, rundll32.exe,
      regsvr32.exe, mshta.exe, wmic.exe)

      | where (office_browser AND shell_or_lolbin) OR lower(parent_image)=lsass.exe

      | table host, parent_image, child_image, command_line, network_conns, user, _time'
- question: Did any privileged or sensitive parent process (lsass.exe, winlogon.exe, service hosts) spawn
    an interactive tool such as cmd.exe or powershell.exe without explicit administrative approval?
  context: 'Within the Detect (D3-D) tactic, lineage-policy violations for privileged contexts indicate
    privilege escalation or persistence abuse. Enforce rules that disallow sensitive parents (for example
    lsass.exe, winlogon.exe, or service hosts such as svchost.exe) from spawning interactive command-line
    tools unless the spawn is explicitly approved by administrative policy. The canonical example is cmd.exe
    or powershell.exe launched directly from winlogon.exe, per [CAR-2020-11-004: Processes Started From
    Irregular Parent](https://car.mitre.org/analytics/CAR-2020-11-004/). A positive result implies an
    attacker has leveraged a SYSTEM-level parent to obtain an interactive elevated shell and should be
    escalated immediately; tune approved administrative exceptions rather than disabling the rule.'
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_creation (Sysmon EID 1 OR Windows EID 4688)

      | where lower(parent_image) in (lsass.exe, winlogon.exe, services.exe, svchost.exe)

      | where lower(child_image) in (cmd.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe)

      | lookup approved_admin_exceptions on host, parent_image, child_image

      | where approved != true

      | table host, parent_image, child_image, command_line, user, _time'
- question: Can multiple individually low-confidence process/file/network events be correlated along their
    causal chain into an ATT&CK kill-chain scenario that spans several tactics, indicating a coordinated
    intrusion rather than isolated noise?
  context: Within the Detect (D3-D) tactic, isolated lineage alerts produce overwhelming false positives.
    Instead, correlate causally-linked process, file, and network events into an attack scenario graph
    mapped to ATT&CK stages, and only alert when linked TTPs span multiple kill-chain phases (e.g., initial
    execution -> discovery -> lateral movement -> collection). This [HOLMES](https://arxiv.org/pdf/1810.01594)-style
    approach sharply reduces false positives while preserving an explainable attack narrative the analyst
    can follow. A positive result is a connected, multi-stage causal subgraph; the analyst uses the chain
    to scope the intrusion end-to-end.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days (with causal correlation across the full chain)
  queries:
  - technology: SIEM/Correlation pseudocode
    query: 'from {process_creation, file_events, network_events}

      | build causal_graph linking events by (pid, ppid, file_handle, socket) over time

      | map each node to ATT&CK technique/tactic

      | where distinct_tactics_in_connected_component >= 3

      | emit scenario_graph, ordered_ttp_chain, hosts, time_span'
- question: Which parent->child process image pairs are statistically rare for a given host role — occurring
    on fewer than ~0.1% of hosts or never previously seen — for example an unusual parent of cmd.exe such
    as Outlook or Acrobat?
  context: 'Within the Detect (D3-D) tactic, statistical baselining catches anomalies that deterministic
    allowlists miss. Build 30-day per-host-role baselines of parent->child image-pair frequency and flag
    pairs that are extremely rare (under ~0.1% of hosts) or never seen for that role. The canonical example
    is profiling all parents of cmd.exe and flagging outliers such as Outlook or Acrobat ([CAR-2014-11-002:
    Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/)); a rare parent can indicate
    code injection into a normally-benign process or a malicious program replacing a legitimate one. Score
    the K rarest causal paths per process via historical frequency as in [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24167-paper.pdf),
    and derive dataset-specific thresholds from local telemetry validated against the [Unified Host and
    Network Data Set](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days (baseline over trailing 30 days per host role)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation (Sysmon EID 1 OR Windows EID 4688) earliest=-30d

      | eval pair = parent_image."->".child_image

      | stats dc(host) as host_count by host_role, pair

      | eval host_frac = host_count / total_hosts(host_role)

      | where host_frac < 0.001 OR pair not in known_pairs(host_role)

      | table host_role, pair, host_count, host_frac'
- question: Do any process trees show abnormal geometry — excessive depth, branching factor above the
    per-role 99th percentile, bursty inter-spawn timing, or unusually large descendant counts — compared
    with role-specific norms?
  context: Within the Detect (D3-D) tactic, the structure of a process tree itself can betray malice even
    when individual parent-child pairs look normal. Compute graph features per tree — depth, branching
    factor (children per parent), inter-spawn timing/burstiness (process creations per minute), and total
    descendant count — and alert when geometry deviates significantly from role-specific norms. Mass-spawning,
    deeply nested chains, or rapid bursts can indicate scripting frameworks, worm-like propagation, or
    automated post-exploitation. Streaming whole-system summarization of these structural features ([UNICORN](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf))
    detects low-and-slow deviations that point-in-time rules miss.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation grouped by root_pid

      | eval depth=tree_depth, branch=max_children_per_parent, burst=count/window_minutes, descendants=total_descendants

      | stats p99(depth), p99(branch), p99(burst), p99(descendants) by host_role -> norms

      | where depth>norms.depth OR branch>norms.branch OR burst>norms.burst OR descendants>norms.descendants

      | table host, root_pid, root_image, depth, branch, burst, descendants'
- question: When individual lineage alerts are aggregated along their causal provenance, which hosts or
    process chains accumulate the highest threat score from multiple causally-linked, multi-tactic alerts?
  context: Within the Detect (D3-D) tactic, prioritizing investigation requires ranking. Aggregate individual
    lineage alerts along their causal provenance and assign a threat score that grows with the number
    of causally-linked, multi-tactic alerts attached to a single chain — the [RapSheet / Tactical Provenance
    Analysis](https://adambates.org/documents/Hassan_Oakland20.pdf) approach. Triage from the highest
    score downward and set the alerting cutoff from validation data so analysts focus on the chains most
    likely to represent a real, progressing intrusion rather than isolated benign anomalies. A high aggregate
    score indicates a chain combining several ATT&CK tactics and merits urgent review.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from lineage_alerts

      | join on causal_provenance_chain_id

      | stats count as n_alerts, dc(attack_tactic) as n_tactics, list(attack_technique) as ttps by chain_id,
      host

      | eval threat_score = weight_tactics(n_tactics) + weight_alerts(n_alerts)

      | where threat_score >= validated_cutoff

      | sort -threat_score'
- question: Is there a spike in failed process creations, blocked or denied spawns (application-control
    / EDR prevention), or short-lived/exited-parent anomalies from a single parent that exceeds the normal
    failure rate for that host role?
  context: Within the Detect (D3-D) tactic, process-creation failures are an under-used signal. Treat
    failed process creations, blocked/denied spawns (e.g., application-control or EDR prevention), and
    short-lived or exited-parent anomalies as distinct signals. A spike in failed or blocked child spawns
    from a single parent indicates exploitation attempts, injection probing, or an attacker repeatedly
    trying to execute payloads against an enforcing control. Baseline normal failure rates per host role
    from internal logs (validated against the [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518))
    and alert on deviations beyond +3 sigma. A positive result is a parent generating an abnormal burst
    of denied/failed spawns.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days (baseline failure rate per host role)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from {process_creation_failures, appcontrol_blocks, edr_prevention_events}

      | stats count as fails by host_role, parent_image, bin(_time, 1h)

      | eventstats avg(fails) as mu, stdev(fails) as sd by host_role, parent_image

      | where fails > mu + 3*sd

      | table host, parent_image, fails, mu, sd, _time'
- question: Which specific process or file nodes within a host's provenance graph are flagged as anomalous
    by a graph-neural-network model trained on benign node roles, and what are the top contributing nodes/edges
    for each?
  context: Within the Detect (D3-D) tactic, machine learning on provenance graphs can pinpoint the precise
    malicious node within a lineage even without attack labels. Train an inductive graph neural network
    on benign process/file node roles ([ThreaTrace](https://arxiv.org/pdf/2111.04333)) to flag nodes whose
    learned role does not fit, and use a GNN temporal autoencoder over whole-system provenance ([KAIROS](https://tfjmp.org/publications/2024-sp.pdf))
    to score anomalous edges by reconstruction error and auto-reconstruct the attack subgraph for analysts.
    Run these models in parallel with the deterministic rules and surface the top-3 contributing nodes/edges
    in the alert text so analysts can validate the model's reasoning. A positive result is an anomalous
    node within an otherwise normal-looking tree.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: ML/Graph-neural-network pseudocode
    query: 'load provenance_graph(process, file, network nodes/edges)

      model = GNN_node_classifier(trained_on=benign_node_roles)   # ThreaTrace

      anomalies = nodes where predicted_role != observed_role

      ae = GNN_temporal_autoencoder(provenance_graph)             # KAIROS

      anomalies += edges where reconstruction_error > threshold

      for a in anomalies: emit node, score, top3_contributing_nodes_edges'
- question: Which process nodes or rare causal lineage paths rank highest for anomaly when scored by an
    autoencoder reconstruction error (graph-LSTM) or by Local Outlier Factor novelty detection over embedded
    lineage paths?
  context: Within the Detect (D3-D) tactic, unsupervised anomaly ranking surfaces novel lineages that
    signature rules cannot anticipate. Use a graph-LSTM autoencoder over the process provenance graph
    to rank anomalous process nodes by reconstruction error ([SIGL](https://www.usenix.org/system/files/sec21-han-xueyuan.pdf)),
    or embed rare causal lineage paths and apply Local Outlier Factor novelty detection ([ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24167-paper.pdf)).
    Both approaches highlight lineages that look unlike anything in the benign baseline — for example
    a never-before-seen execution path leading to a sensitive binary. The output must include the top-3
    contributing paths/features so analysts can validate the score; a high reconstruction error or strong
    LOF novelty score on a path touching sensitive resources warrants investigation.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: ML/Autoencoder + novelty-detection pseudocode
    query: 'ae = graphLSTM_autoencoder(process_provenance_graph)        # SIGL

      ranked = sort(nodes by reconstruction_error desc)

      paths = embed(rare_causal_lineage_paths)                    # ProvDetector

      lof = LocalOutlierFactor(paths)

      emit top_ranked_nodes + lof_novel_paths with top3_contributing_features'
- question: For each parent process, do its observed child-process executions fall outside the top-k expected
    next children predicted by a sequence model of process-creation order, or form rare behavioral groupings
    when log entities are embedded and clustered?
  context: Within the Detect (D3-D) tactic, modeling the ordered sequence of process-creation events captures
    temporal anomalies that frequency baselines miss. Train an LSTM next-event predictor on the ordered
    children each parent normally spawns ([DeepLog](https://doi.org/10.1145/3133956.3134015)) and flag
    executions that fall outside the top-k expected next children — an out-of-sequence or unexpected child
    suggests injected or hijacked execution. Complement this with heterogeneous-graph embedding plus clustering
    of log entities ([Log2vec](https://doi.org/10.1145/3319535.3363749)) to surface rare malicious behavioral
    groupings. Benchmark and tune on [DARPA Transparent Computing](https://github.com/darpa-i2o/Transparent-Computing/blob/master/README-E3.md)
    and [OpTC](https://github.com/FiveDirections/OpTC-data) datasets before production rollout. A positive
    result is a child execution the sequence model assigns low probability, or an entity that clusters
    away from normal behavior.
  answer_sources:
  - Windows Event ID 4688 (Process Creation, with parent and command line)
  - Sysmon Event ID 1 (ProcessCreate)
  - Linux auditd execve / eBPF process telemetry
  - EDR process-lineage / data-provenance graph
  - 'NAI: Endpoint devices (workstations, servers); host process-creation and provenance pipelines'
  range: Last 90 days
  queries:
  - technology: ML/Sequence-model pseudocode
    query: 'seq = ordered_child_executions_per_parent

      model = LSTM_next_event_predictor(trained_on=benign_seq)    # DeepLog

      anomaly if observed_child not in model.topk_predicted(context)

      emb = hetero_graph_embed(log_entities)                      # Log2vec

      clusters = cluster(emb); flag rare/isolated clusters

      emit parent, anomalous_child, predicted_topk, cluster_id'
