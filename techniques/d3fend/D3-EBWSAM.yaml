name: 'D3-EBWSAM: Endpoint-based Web Server Access Mediation'
id: 2a59becf-d17d-4e08-8240-2e8cce922e96
description: Investigate endpoints that reach critical internal web servers without the endpoint-based
  access mediation controls that should govern them. Under a Zero Trust, deny-by-default posture, any
  session that completes against a protected web resource without presenting a valid device credential
  (mutual-TLS client certificate, approved endpoint agent, or approved client TLS stack) is non-compliant
  and may indicate a bypass or failure of access mediation enforcement. This playbook helps an analyst
  find TLS sessions to critical web servers that lack valid client certificates, correlate those sessions
  to the originating endpoints and processes, validate that only approved browsers/agents and known-good
  JA3/JA4 client fingerprints are talking to protected services, and surface automated or anomalous clients
  that evade interactive endpoint controls. It combines deterministic symbolic-logic rules (certificate
  presence, process allowlisting, TLS fingerprint allowlisting) with statistical baselining (handshake
  failure rates, process/JA3 frequency distributions, non-compliance ratios, beaconing detection) and
  machine-learning detection (time-series forecasting of control failures, explainable session-risk scoring,
  and unsupervised anomaly detection over encrypted flows) so the analyst can both detect active bypass
  attempts and monitor the health of the mediation control itself.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which TLS sessions to designated critical web servers completed (established=T) without a
    valid mutual-TLS client certificate — that is, with an empty client_cert_chain_fuids or a validation_status
    other than 'ok' — and which source endpoints originated them?
  context: Under the Isolate tactic and a Zero Trust deny-by-default model, endpoint-based web server
    access mediation requires every device to authenticate to a protected resource with a valid device
    credential. A completed TLS session that presents no client certificate (empty client_cert_chain_fuids)
    or a certificate that fails validation (validation_status != 'ok') is non-compliant by definition
    and signals that mutual-TLS enforcement was bypassed or failed. The analyst queries Zeek ssl.log for
    established sessions to the critical web servers, filters for missing/invalid client certs, then pivots
    through the conn.log uid to identify the originating endpoint. A positive result is a real, completed
    session to a protected service without device authentication — investigate the endpoint, the service's
    mTLS configuration, and whether an attacker reached the resource directly. The absent client Certificate
    / CertificateVerify message is defined by RFC 8446 TLS 1.3.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "LET crit = critical_web_server_ips\nFROM ssl.log WHERE established == T AND id.resp_h IN crit\n\
      \  AND (client_cert_chain_fuids == empty OR validation_status != \"ok\")\nJOIN conn.log ON ssl.uid\
      \ == conn.uid\nSELECT conn.id.orig_h AS endpoint, id.resp_h AS server, server_name, validation_status,\
      \ uid"
- question: For non-compliant sessions to critical web servers, what process and parent-process lineage
    initiated the connection on the endpoint, and were any of them command-line tools, script hosts, or
    unsigned binaries (e.g., curl.exe, powershell.exe, python.exe) rather than an approved browser or
    agent?
  context: Bypass of endpoint mediation is frequently performed by tooling rather than an approved, managed
    browser. Correlating the non-compliant network sessions with Sysmon Event ID 3 (network connection)
    to identify the initiating process, and Sysmon Event ID 1 (process create) for parent lineage, lets
    the analyst enforce an allowlist of approved browsers/agents. Connections to critical web services
    originated by command-line HTTP clients, interpreters, script hosts, or unsigned binaries are strong
    indicators of scripted access, exfiltration tooling, or an actor operating outside the sanctioned
    client. This supports the Isolate tactic by ensuring only authorized device-mediated processes can
    initiate sessions. Use process-origin / non-browser-HTTPS rule templates from SigmaHQ. A positive
    result is a disallowed process (or unexpected parent) reaching a protected service; a negative result
    is access exclusively via approved agents.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'LET approved = {chrome.exe, msedge.exe, firefox.exe, approved_agent.exe}

      FROM sysmon WHERE EventID == 3 AND DestinationIp IN critical_web_server_ips

      JOIN sysmon EventID==1 ON ProcessGuid (network) == ProcessGuid (create)

      WHERE Image NOT IN approved OR Image IN {curl.exe,powershell.exe,python.exe,wget.exe} OR Signed
      == false

      SELECT Computer, Image, ParentImage, CommandLine, DestinationIp'
- question: Do any sessions to protected web services present a JA3/JA4 client TLS fingerprint (or JA4X
    certificate-issuer structure) that is not on the deny-by-default allowlist of approved clients for
    that service?
  context: Approved, managed clients produce a consistent and enumerable set of TLS client fingerprints.
    By building a deny-by-default allowlist of approved JA3 and version-resilient JA4/JA4+ (JA4/JA4X)
    fingerprints per protected web service, the analyst can detect when a session uses a non-browser or
    otherwise unknown TLS stack, or a certificate issuer structure (JA4X) outside the approved CA. This
    catches tooling that impersonates compliant clients and actors using custom or off-the-shelf TLS libraries.
    JA4's resilience to TLS-extension reordering makes it harder to evade than JA3 alone. A positive result
    is a fingerprint outside the allowlist hitting a protected service, supporting the Isolate tactic
    by flagging clients that are not device-mediated. Validate against the endpoint's expected software
    before escalating.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LET allow = approved_ja3_ja4_per_server

      FROM ssl.log WHERE id.resp_h IN critical_web_server_ips

      WHERE ja3 NOT IN allow[id.resp_h] OR ja4 NOT IN allow[id.resp_h] OR ja4x_issuer NOT IN approved_CAs

      SELECT id.orig_h, id.resp_h, ja3, ja4, ja4x_issuer, server_name'
- question: Are there per-server spikes in failed or aborted TLS handshakes and failed connections (Zeek
    ssl.log non-established sessions and conn.log conn_state S0/REJ/RSTO/RSTRH) that indicate enforcement
    misconfiguration, credential failures, or probing of the mediation control?
  context: 'Failed and aborted handshakes are a distinct signal from successful non-compliant sessions:
    a surge in them can mean the mediation control is misconfigured, that legitimate endpoints are failing
    credential checks, or that an actor is probing the control to learn how it responds. The analyst tracks
    per-server rates of non-established TLS sessions (ssl.log) and failed connection states in conn.log
    (S0, REJ, RSTO, RSTRH) and alerts on statistically significant spikes relative to baseline. Under
    the Isolate tactic this both protects the control''s availability and surfaces reconnaissance against
    it. RFC 8446 defines the failed/alert states of the TLS handshake. A sustained spike warrants checking
    for config changes, certificate expiry, or scanning.'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM conn.log WHERE id.resp_h IN critical_web_server_ips AND conn_state IN {S0,REJ,RSTO,RSTRH}

      UNION FROM ssl.log WHERE established == F AND id.resp_h IN critical_web_server_ips

      BIN by server, 1h

      COMPUTE fail_count; baseline = mean+3sigma over trailing 14d

      ALERT WHERE fail_count > baseline'
- question: For each protected server and network segment, which source processes or JA3 fingerprints
    making mediated connections fall in the low-frequency tail (e.g., below the 5th percentile of observed
    prevalence), marking them as rare/anomalous origins?
  context: Legitimate mediated access to a given server tends to come from a stable, repeating set of
    processes and client fingerprints. Building per-server and per-segment frequency distributions of
    source processes/JA3 lets the analyst flag the rare tail — origins seen far less often than the norm
    (for example below the 5th percentile of prevalence) — as candidates for validation. Rare origins
    can represent a new tool, a misconfigured host, or an actor blending into protected traffic. This
    supports the Isolate tactic by distinguishing routine device-mediated clients from unusual ones. Use
    percentile-threshold guidance (Akcay et al.). A positive result is a low-prevalence process/JA3 touching
    a protected service; confirm whether it is newly deployed legitimate software or unauthorized access.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM mediated_sessions (ssl.log JOIN sysmon EID3) WHERE id.resp_h IN critical_web_server_ips

      GROUP BY server, segment, process_or_ja3

      COMPUTE prevalence = count / total_per_server

      ALERT WHERE prevalence < p05(prevalence distribution for that server)'
- question: Are the daily/hourly ratios of non-certificate sessions to total sessions, along with byte
    volumes (orig_bytes/resp_bytes) and connection frequency per protected web service, increasing beyond
    baseline confidence bounds in a way that signals systemic enforcement drift?
  context: Beyond individual bypass events, the overall non-compliance rate is a health metric for the
    mediation control. The analyst measures per-service ratios of non-certificate to total sessions on
    daily and hourly windows, plus Volume (orig_bytes/resp_bytes) and Frequency (connections/min) from
    conn.log, and alerts when these rise beyond baseline confidence bounds (e.g., per-service mean+3σ
    or seasonal bounds derived from 14-30 days). A sustained increase indicates systemic enforcement drift
    — a policy change, deployment regression, or broad bypass — rather than one-off endpoint issues. This
    directly supports the Isolate tactic's goal of keeping the control effective. A rising trend should
    trigger a configuration and coverage review across the affected service.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM ssl.log JOIN conn.log WHERE id.resp_h IN critical_web_server_ips

      BIN by server, {1h,1d}

      COMPUTE noncompliant_ratio = noncert_sessions/total_sessions, vol=orig_bytes/resp_bytes, freq=conns/min

      baseline = mean+3sigma OR seasonal_bounds over 14-30d

      ALERT WHERE any metric sustained > baseline'
- question: Are there automated, non-interactive clients beaconing to mediated web servers — exhibiting
    low coefficient of variation in inter-arrival/payload size, characteristic Bowley skewness/MAD, long-lived
    connections, or invalid certificates — that bypass interactive endpoint agents?
  context: Endpoint mediation often assumes interactive use through a managed agent or browser. Automated
    clients that beacon on a regular cadence can slip past those interactive controls. Applying RITA-style
    beaconing analysis to mediated-server traffic in Zeek conn/ssl logs — looking for low coefficient
    of variation in connection inter-arrival times and payload sizes, Bowley skewness, median absolute
    deviation, unusually long connections, and invalid certificates — surfaces these non-interactive clients.
    Under the Isolate tactic this catches C2-like or scripted access that evades the endpoint agent. A
    positive result is a regular, machine-like communication pattern to a protected service; correlate
    the source to a process and assess whether it is sanctioned automation.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: RITA/pseudocode
    query: 'FROM conn.log + ssl.log WHERE id.resp_h IN critical_web_server_ips

      GROUP BY (id.orig_h, id.resp_h)

      COMPUTE cv(interarrival), cv(payload_size), bowley_skew, MAD, long_conn_ratio, invalid_cert

      SCORE beacon_likelihood

      ALERT WHERE beacon_score > threshold'
- question: Do observed counts of non-compliant connections and handshake-failure rates exceed the confidence
    intervals predicted by a time-series forecasting model, distinguishing a one-off endpoint problem
    from a broader mediation-control outage?
  context: Time-series forecasting turns the control-health metrics into a predictive baseline. By training
    models on historical non-compliant connection counts and handshake-failure rates, the analyst can
    flag observations that exceed the predicted confidence interval. This separates isolated endpoint
    hiccups (which stay within expected variance) from systemic failures or coordinated bypass that drive
    metrics well beyond forecast. Pairing forecasting with percentile-threshold approaches (Akcay et al.)
    improves robustness to seasonality. Under the Isolate tactic, this gives early warning of mediation-control
    outages so coverage can be restored quickly. An out-of-interval spike should trigger investigation
    into the control's configuration and the affected endpoints/services.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'TRAIN forecaster (e.g., SARIMA/Prophet) ON hourly noncompliant_count and handshake_fail_rate
      per server (trailing 30-90d)

      PREDICT next interval with confidence band

      ALERT WHERE observed > upper_CI for sustained windows'
- question: What is each session's policy-bypass likelihood when scored by a classifier over endpoint
    identity, process lineage, TLS/JA4 characteristics, certificate validity, byte ratios, and destination
    service profile — and which top-3 features drove the high-risk scores?
  context: A supervised classifier can fuse many weak signals — endpoint identity, process lineage, TLS/JA4
    characteristics, certificate validity, byte ratios, and destination service profile — into a single
    policy-bypass risk score per session, catching bypass patterns that no single rule covers. To keep
    the output actionable for a SOC analyst, the alert should surface the top-3 contributing features
    using SHAP attributions (Idrissi et al.) and feature-level explanations / rule generation (xNIDS).
    Under the Isolate tactic, this prioritizes the sessions most likely to be evading device mediation
    while telling the analyst why. A high score with explanatory features (e.g., missing cert + unknown
    JA4 + scripting-host process) is a strong investigative lead; review the cited features against ground
    truth.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'FEATURES = {endpoint_id, process_lineage, ja3/ja4, cert_valid, orig/resp_byte_ratio, dest_service_profile}

      MODEL = trained_bypass_classifier

      FOR each session: risk = MODEL.predict_proba; top3 = SHAP_top_features(session)

      ALERT WHERE risk > threshold WITH top3 in alert text'
- question: Which mediated-session flow vectors per protected server are flagged as anomalous by unsupervised
    models (Isolation Forest, online autoencoder ensembles like Kitsune/KitNET, or contrastive encrypted-flow
    models like ET-SSL) operating inside opaque TLS without decryption?
  context: Because mediated traffic is encrypted, deterministic rules cannot see payload content. Unsupervised
    anomaly detection over per-server mediated-session flow vectors (timing, sizes, directionality, TLS
    metadata) flags client behavior that deviates from the learned norm without needing to decrypt. Isolation
    Forest provides a low-latency baseline; online autoencoder ensembles (Kitsune/KitNET) adapt to drift;
    contrastive encrypted-flow modeling (ET-SSL) captures subtle distributional shifts. Running these
    in parallel with the deterministic certificate and allowlist rules gives defense-in-depth for the
    Isolate tactic, catching novel bypass behavior the rules and classifiers miss. A high anomaly score
    on a mediated flow is a lead to correlate with endpoint, process, and certificate evidence before
    escalating.
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - Sysmon Event ID 3
  - 'NAI: Critical internal web application servers, endpoint devices, and network segments fronting these
    servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'BUILD flow_vectors per (server, session) from conn.log/ssl.log metadata (timing, sizes, direction,
      tls_meta)

      MODEL = IsolationForest baseline + KitNET online AE + ET-SSL encoder

      SCORE anomaly per flow

      ALERT WHERE anomaly_score > threshold; correlate with cert/allowlist findings'
