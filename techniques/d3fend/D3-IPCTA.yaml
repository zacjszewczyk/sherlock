name: 'D3-IPCTA: IPC Traffic Analysis'
id: 4fbc5009-700b-4188-8ac3-4465137fe7d1
description: This playbook helps an analyst investigate inter-process communication (IPC) traffic to detect
  deviations from normal protocol activity that signal lateral movement, remote execution, and post-exploitation
  tooling. It covers two complementary vantage points. First, host IPC telemetry reveals suspicious named-
  and anonymous-pipe creation and access, abnormal source-to-destination process pairings, and bursty
  pipe fan-out consistent with lateral-movement and post-exploitation frameworks (e.g., Cobalt Strike
  default pipes); it leans on Volume (bytes/messages per pipe), Frequency (distinct pipes per process
  per window), and State (create vs access-denied) signals from Sysmon, Windows Security, and Linux auditd/eBPF
  logs. Second, network IPC analysis over SMB/DCE-RPC detects remote service control, scheduled-task creation,
  and write-then-execute lateral movement across hosts using Zeek SMB/RPC logs and Windows logon/file-share
  events. The questions below combine deterministic threat-intel and behavior rules, statistical rarity
  and failure-mode profiling, and machine-learning/provenance-graph methods so a SOC analyst can prioritize,
  triage, and scope IPC-based intrusion activity.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any created or connected named pipes on monitored hosts matching known malicious pipe
    artifacts, such as Cobalt Strike default pipe patterns or named frameworks like psexesvc, msagent_*,
    postex_*, or status_*?
  context: 'Detect (D3-D): Post-exploitation frameworks frequently use named pipes for C2 and module communication,
    and many leave recognizable artifacts. For each Sysmon Event ID 17 (Pipe Created) and 18 (Pipe Connected)
    event, compare the PipeName, the source Image, and the parent process against threat intel and internal
    deny lists. Apply the high-fidelity Cobalt Strike regex `\\.\pipe\[0-9a-f]{7,10}` (a hex pipe name
    whose length matches the module name) and known framework pipe names. A match is high-confidence malicious
    activity; alert on exact and normalized matches and attach the Event ID 4688 process-creation context
    (command line, parent, user, integrity level) for triage. A negative result means no known-bad artifact
    was seen, but does not rule out custom tooling, so pair with the behavioral and statistical questions
    below. Source references: [Detecting Cobalt Strike Default Modules via Named Pipe Analysis](https://labs.withsecure.com/publications/detecting-cobalt-strike-default-modules-via-named-pipe-analysis),
    [SigmaHQ rule corpus](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (sysmon:17, sysmon:18)\n  | eval norm_pipe = lower(PipeName)\n  | where match(norm_pipe,\
      \ \"\\\\\\\\\\.\\\\pipe\\\\[0-9a-f]{7,10}$\")\n     OR norm_pipe IN (threatintel_pipe_denylist)\n\
      \     OR match(norm_pipe, \"(psexesvc|msagent_|postex_|status_)\")\n  | join host, ProcessGuid [\
      \ source=sysmon:1 OR eventid=4688 ]\n  | table _time, host, Image, ParentImage, User, IntegrityLevel,\
      \ PipeName, CommandLine"
- question: Which post-exploitation-prone or unsigned processes (e.g., rundll32, regsvr32, dllhost) are
    opening anonymous (unnamed) pipes that fall outside the expected allow-list of legitimate anonymous-pipe
    users?
  context: 'Detect (D3-D): Native Windows processes rarely use anonymous (unnamed) pipes, so anonymous-pipe
    usage by injection-prone or unsigned images is a strong tell for in-memory tooling and process injection.
    Maintain an allow-list of expected anonymous-pipe users and alert when post-exploitation-prone images
    (rundll32, regsvr32, dllhost, unsigned binaries) open anonymous pipes. Surface the writing/reading
    process pair and the integrity level in the alert so the analyst can judge whether a low-integrity
    or unsigned process is communicating with a higher-privileged one. A positive result warrants pulling
    the full process tree; a benign result is expected for the small set of allow-listed system components.
    Source reference: [Detecting Cobalt Strike Default Modules via Named Pipe Analysis](https://labs.withsecure.com/publications/detecting-cobalt-strike-default-modules-via-named-pipe-analysis).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (sysmon:17, sysmon:18)\n  | where PipeName=\"\" OR isnull(PipeName) OR is_anonymous(PipeName)\n\
      \  | where (Image IN (rundll32.exe, regsvr32.exe, dllhost.exe) OR Signed=false)\n  | where Image\
      \ NOT IN (anon_pipe_allowlist)\n  | table _time, host, Image, ParentImage, User, IntegrityLevel,\
      \ peer_process"
- question: Are there disallowed inter-process pipe relationships occurring outside approved maintenance
    windows, such as Office applications or script interpreters creating or connecting to administrative
    or service-control pipes?
  context: 'Detect (D3-D): Certain process-to-process IPC relationships should never occur in a healthy
    environment. Build deterministic rules for disallowed IPC tuples (e.g., Office or script interpreters
    such as winword.exe, excel.exe, wscript.exe, powershell.exe creating/connecting administrative pipes;
    low-integrity user processes touching service-control pipes like svcctl). Trigger when these disallowed
    tuples occur outside approved maintenance windows. Model normal per-process behavior as syscall/pipe
    allow-lists; on Linux enforce equivalent constraints with tunable Falco rules. A hit strongly implies
    macro-borne or scripted lateral movement / privilege escalation; absence of hits with good allow-list
    coverage is reassuring. Source references: [A Sense of Self for Unix Processes](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes),
    [Falco rules](https://falco.org/docs/reference/rules/default-rules/).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (sysmon:17, sysmon:18)\n  | eval pair = Image . \"->\" . PipeName\n  | where\
      \ (Image IN (winword.exe,excel.exe,wscript.exe,cscript.exe,powershell.exe)\n            AND PipeName\
      \ IN (admin_pipe_list))\n        OR (IntegrityLevel IN (Low,Medium) AND PipeName IN (svcctl,scerpc,winreg))\n\
      \  | where NOT within_maintenance_window(_time)\n  | table _time, host, Image, ParentImage, User,\
      \ IntegrityLevel, PipeName"
  - technology: Falco/pseudocode
    query: ">-\n  - rule: Disallowed IPC pipe relationship\n    condition: (fd.type=fifo or fd.name startswith\
      \ /var/run)\n      and proc.name in (interpreter_list)\n      and not proc.name in (ipc_allowlist)\n\
      \    output: \"Unexpected IPC by %proc.name peer=%fd.name user=%user.name\"\n    priority: WARNING"
- question: Which (source process, destination process, PipeName) IPC tuples are statistically rare or
    first-seen for a given host role, especially those touching critical servers?
  context: 'Detect (D3-D): Rare IPC tuples expose novel tooling and lateral movement that signature rules
    miss. Maintain a 30-day frequency table of (source process, destination process, PipeName) tuples
    segmented by host role; flag events below the 5th-percentile frequency or any first-seen tuple touching
    critical servers, scoring structural rarity. Derive per-role baselines so a tuple that is common on
    a build server is not penalized on a domain controller. Publish ranked rarity scores so analysts review
    the most anomalous IPC first. A high rarity score on a critical server is a strong triage lead; commonly
    seen tuples are deprioritized. Source references: [Detecting Structurally Anomalous Logins](https://doi.org/10.1145/3133956.3134003),
    [LANL Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days (30-day baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (sysmon:17, sysmon:18)\n  | eval tuple = src_process . \"|\" . dst_process\
      \ . \"|\" . PipeName\n  | bin _time span=1d\n  | stats count AS freq by host_role, tuple\n  | eventstats\
      \ perc5(freq) AS p5 by host_role\n  | where freq <= p5 OR isfirstseen(tuple, host_role)\n  | eval\
      \ rarity_score = 1 - (freq / max_freq)\n  | sort - rarity_score"
- question: Are any processes exhibiting bursty pipe fan-out, where the count of distinct pipe names,
    distinct destination processes, or total pipe-message bytes within a short window exceeds the role-specific
    baseline?
  context: 'Detect (D3-D): Remote-execution staging and credential-theft tooling often open many pipes
    rapidly. In 10-minute windows compute per-process distinct PipeName count, distinct destination-process
    count, and total pipe-message bytes; alert when any exceeds the role-specific 99th-percentile or a
    robust median-absolute-deviation / modified-Z threshold (which resists distortion from legitimate
    batch jobs). High fan-out indicates remote-execution staging or credential-theft tooling spreading
    across many endpoints or processes. A spike above baseline is a strong investigative lead; steady
    low fan-out is normal. Source reference: [Bohara et al.](https://doi.org/10.1109/SRDS.2017.31).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days (10-minute correlation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (sysmon:17, sysmon:18)\n  | bin _time span=10m\n  | stats dc(PipeName) AS\
      \ pipes, dc(dst_process) AS dests, sum(bytes) AS vol by host, Image, _time\n  | eventstats median(pipes)\
      \ AS med, mad(pipes) AS mad_p by host_role\n  | eval mz = 0.6745*(pipes-med)/mad_p\n  | where mz\
      \ > 3.5 OR pipes > perc99(pipes) OR dests > perc99(dests)\n  | table _time, host, Image, pipes,\
      \ dests, vol, mz"
- question: Do any source processes show abnormal IPC failure-mode rates, such as a high ratio of STATUS_ACCESS_DENIED
    pipe opens, failed logons (4625) immediately preceding pipe access, or connect-then-no-data sessions?
  context: 'Detect (D3-D): Reconnaissance and credential spraying produce distinctive failure signatures
    distinct from benign IPC. Track failure/state signals as separate features per source: STATUS_ACCESS_DENIED
    on pipe opens, failed logons (Event ID 4625) immediately preceding pipe access, and connect-then-no-data
    sessions. Alert when a process''s denied-to-successful pipe-access ratio or its count of pre-access
    failed logons exceeds a learned per-role threshold. A high denied/failed ratio distinguishes probing/spraying
    from legitimate use; a normal ratio with occasional denials is expected. Source reference: [LANL Unified
    Host and Network Data Set](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (sysmon:17, sysmon:18, 5145, 4625)\n  | eval denied = if(Status=\"STATUS_ACCESS_DENIED\"\
      ,1,0)\n  | stats sum(denied) AS denied_n, count AS total, sum(eval(eventid=4625)) AS failed_logons\
      \ by host, src_process\n  | eval deny_ratio = denied_n/total\n  | eventstats avg(deny_ratio) AS\
      \ m, stdev(deny_ratio) AS sd by host_role\n  | where deny_ratio > m+3*sd OR failed_logons > role_threshold\n\
      \  | table host, src_process, denied_n, total, deny_ratio, failed_logons"
- question: When modeling normal IPC behavior with an unsupervised machine-learning model, which IPC events
    are flagged as anomalous, and what are the top contributing features explaining each anomaly?
  context: 'Detect (D3-D): A behavioral ML model catches novel IPC misuse that fixed rules cannot enumerate.
    Train an unsupervised Isolation Forest (or autoencoder/DBSCAN) on features including process-path
    embedding, signer trust, integrity level, pipe-name Shannon entropy, fan-out counts, byte volume,
    and temporal cadence. Run it in parallel with the deterministic rules above, never replacing them.
    Emit the top-3 contributing features (via SHAP or nearest-cluster attribution) in the alert text alongside
    the anomaly score so analysts understand why an event scored high. A high score with interpretable
    drivers (e.g., high pipe-name entropy from an unsigned binary) is a strong lead; low scores indicate
    routine IPC. Source reference: [Isolation Forest](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days (train on rolling 30-60 day baseline)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [path_embed, signer_trust, integrity_level, pipe_name_entropy,\n        \
      \     distinct_pipes, distinct_dests, byte_volume, cadence]\n  model = IsolationForest(n_estimators=200,\
      \ contamination='auto').fit(baseline_X)\n  scores = model.score_samples(today_X)\n  for e where\
      \ anomaly(score):\n      top3 = shap_top_features(model, e, k=3)\n      alert(host, Image, PipeName,\
      \ score, top3)"
- question: Using whole-system provenance graphs, which new IPC edges (process->pipe->process) or nodes
    score as low-likelihood or malicious, and what attack-summary subgraph and out-of-distribution event
    sequences do they form?
  context: 'Detect (D3-D): Provenance-graph analytics connect individual IPC events into causal attack
    chains that point analytics miss. Build whole-system provenance graphs (process -> pipe -> process,
    file, socket) and score each new IPC edge with a temporal GNN (KAIROS-style), or detect malicious
    nodes at node level with GraphSAGE (ThreaTrace-style). Surface the reconstructed attack-summary subgraph
    and the lowest-likelihood edges for analyst triage. Additionally model DeepLog-style LSTM sequences
    of pipe/RPC event keys to flag out-of-distribution next events, with online analyst feedback. A coherent
    low-likelihood subgraph spanning processes/files/sockets is a high-value lead worth full timeline
    reconstruction; isolated normal edges are deprioritized. Source references: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf),
    [ThreaTrace](https://arxiv.org/pdf/2111.04333), [DeepLog](https://dl.acm.org/doi/10.1145/3133956.3134015).'
  answer_sources:
  - Sysmon Event ID 17 (Pipe Created)
  - Sysmon Event ID 18 (Pipe Connected)
  - Sysmon Event ID 1 / Windows Event ID 4688 (Process Creation)
  - Windows Security Event ID 5145 (Detailed File Share / named pipe access)
  - Linux auditd / eBPF syscall telemetry
  - 'NAI: Critical servers (e.g., Domain Controllers, database servers), user endpoints, and application
    servers where sensitive processes communicate.'
  range: Last 90 days (streaming provenance graph)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  G = build_provenance_graph(process, pipe, file, socket events)\n  edge_scores = temporal_gnn_score(G.new_edges)\
      \        # KAIROS-style\n  node_scores = graphsage_node_classify(G.nodes)        # ThreaTrace-style\n\
      \  seq_anom = deeplog_lstm(sequence_of(pipe_rpc_event_keys))\n  for e in lowest_likelihood(edge_scores)\
      \ + malicious(node_scores) + ood(seq_anom):\n      alert(subgraph=reconstruct_attack_summary(e),\
      \ edges=e)"
- question: Are non-admin workstations connecting to sensitive SMB/DCE-RPC named pipes such as atsvc,
    svcctl, scerpc, srvsvc, lsarpc, or winreg, indicating possible remote execution or service manipulation?
  context: 'Detect (D3-D): Sensitive RPC pipes are the conduits for remote service control, scheduled
    tasks, and registry/SAM access used in lateral movement. Inspect Zeek smb_files.log and dce_rpc.log
    for connections to sensitive named pipes (atsvc, svcctl, scerpc, srvsvc, lsarpc, winreg). Alert immediately
    when the source is a non-admin workstation, since ordinary user endpoints should not be driving administrative
    RPC. A hit suggests remote execution or service manipulation (e.g., PsExec, scheduled task creation,
    remote registry); legitimate administration normally originates from designated admin hosts/jump servers,
    which can be allow-listed. Source reference: [CAR-2014-03-001: SMB Write Request - NamedPipes](https://car.mitre.org/analytics/CAR-2014-03-001/).'
  answer_sources:
  - Zeek smb_files.log
  - Zeek dce_rpc.log
  - Zeek smb_mapping.log
  - Windows Security Event ID 5145 (Detailed File Share)
  - Windows Security Event ID 4624/4625 (Logon Success/Failure)
  - 'NAI: Domain Controllers, file/print servers, database and application servers, and the subnets of
    non-admin workstations that should not initiate administrative SMB/RPC.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  (smb_files.log OR dce_rpc.log)\n  | where endpoint IN (\"atsvc\",\"svcctl\",\"scerpc\"\
      ,\"srvsvc\",\"lsarpc\",\"winreg\")\n        OR named_pipe IN (\"atsvc\",\"svcctl\",\"scerpc\",\"\
      srvsvc\",\"lsarpc\",\"winreg\")\n  | where src_ip IN (non_admin_workstation_subnets)\n  | where\
      \ src_ip NOT IN (admin_host_allowlist)\n  | table ts, id.orig_h, id.resp_h, named_pipe, endpoint,\
      \ operation"
- question: Is there evidence of remote SMB write-then-execute activity, where a file written to a host
    over SMB (Event ID 5145 / Zeek smb_files.log) is subsequently executed (Event ID 4688) on that same
    host within a short window, especially in high-value locations like %SYSTEMROOT%\system32?
  context: 'Detect (D3-D): The write-then-execute combination is a classic remote code execution / lateral
    movement pattern that is far rarer than either event alone. Correlate a remote SMB file write (Windows
    Event ID 5145 with write access / Zeek smb_files.log write action) with subsequent execution of that
    same file (Event ID 4688) on the same host within a short window. Tune to high-value run locations
    such as %SYSTEMROOT%\system32. The rare co-occurrence is a strong lateral-movement signal; isolated
    SMB writes or unrelated executions are common and should not alert on their own. Source reference:
    [CAR-2013-05-005: SMB Copy and Execution](https://car.mitre.org/analytics/CAR-2013-05-005/).'
  answer_sources:
  - Zeek smb_files.log
  - Zeek dce_rpc.log
  - Zeek smb_mapping.log
  - Windows Security Event ID 5145 (Detailed File Share)
  - Windows Security Event ID 4624/4625 (Logon Success/Failure)
  - 'NAI: Domain Controllers, file/print servers, database and application servers, and the subnets of
    non-admin workstations that should not initiate administrative SMB/RPC.'
  range: Last 90 days (correlate write and execute within ~10 minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  let writes = search (eventid=5145 AccessMask~write) OR (zeek smb_files.log action=write)\n\
      \  let execs  = search eventid=4688\n  | join host, file_path [writes -> execs]\n  | where exec_time\
      \ - write_time < 10m\n  | where file_path LIKE \"%\\\\system32\\\\%\" OR file_path IN (high_value_paths)\n\
      \  | table host, file_path, src_host_of_write, write_time, exec_time, CommandLine"
- question: Which host-to-host SMB edges (source host, destination host, pipe/share) are first-seen or
    low-probability over the baseline period, particularly new edges directed at critical servers?
  context: 'Detect (D3-D): New administrative SMB pathways between hosts often mark the spread of an intrusion.
    Maintain a graph of (source host, destination host, pipe/share) edges over 30 days and flag first-seen
    or low-probability edges to critical servers, scoring structural rarity. Report the connection count
    and byte volume in the alert to help judge significance. A brand-new edge from a workstation to a
    domain controller''s admin share is a strong lateral-movement lead; long-established edges between
    known peers are normal. Source references: [LANL Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518),
    [Siadati and Memon - Detecting Structurally Anomalous Logins](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - Zeek smb_files.log
  - Zeek dce_rpc.log
  - Zeek smb_mapping.log
  - Windows Security Event ID 5145 (Detailed File Share)
  - Windows Security Event ID 4624/4625 (Logon Success/Failure)
  - 'NAI: Domain Controllers, file/print servers, database and application servers, and the subnets of
    non-admin workstations that should not initiate administrative SMB/RPC.'
  range: Last 90 days (30-day baseline window)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  smb_mapping.log OR smb_files.log\n  | eval edge = id.orig_h . \"->\" . id.resp_h . \"\
      |\" . share\n  | stats count AS conns, sum(bytes) AS vol, min(ts) AS first_seen by edge\n  | where\
      \ first_seen > now()-1d AND id.resp_h IN (critical_servers)\n        OR edge NOT IN (baseline_edges_30d)\n\
      \  | sort - vol"
- question: Do any SMB source hosts exhibit abnormal failure-mode rates, such as a high ratio of blocked/denied
    SMB connects (TCP 445 resets), STATUS_ACCESS_DENIED tree-connects, or bursts of failed logons (4625)?
  context: 'Detect (D3-D): SMB recon and credential spraying generate characteristic failure patterns
    that separate them from benign access. Track blocked/denied SMB connects (TCP 445 resets), STATUS_ACCESS_DENIED
    tree-connects, and failed logons (Event ID 4625) per source as distinct features. Alert when a source''s
    blocked-or-denied-to-success ratio or its 4625 burst exceeds a robust MAD/modified-Z threshold. This
    separates spraying/recon from benign access; a source with many denials/resets relative to successes
    is a strong lead, whereas occasional denials during normal operations are expected. Source reference:
    [Bohara et al.](https://doi.org/10.1109/SRDS.2017.31).'
  answer_sources:
  - Zeek smb_files.log
  - Zeek dce_rpc.log
  - Zeek smb_mapping.log
  - Windows Security Event ID 5145 (Detailed File Share)
  - Windows Security Event ID 4624/4625 (Logon Success/Failure)
  - 'NAI: Domain Controllers, file/print servers, database and application servers, and the subnets of
    non-admin workstations that should not initiate administrative SMB/RPC.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (zeek conn.log:445, 5145, 4625)\n  | eval denied = if(rst=true OR Status=\"\
      STATUS_ACCESS_DENIED\",1,0)\n  | stats sum(denied) AS denied_n, count AS total, sum(eval(eventid=4625))\
      \ AS failed_logons by src_ip\n  | eval ratio = denied_n/total\n  | eventstats median(ratio) AS med,\
      \ mad(ratio) AS mad_r\n  | eval mz = 0.6745*(ratio-med)/mad_r\n  | where mz > 3.5 OR failed_logons\
      \ > burst_threshold\n  | table src_ip, denied_n, total, ratio, failed_logons, mz"
- question: When applying unsupervised graph machine learning and temporal link prediction to the authentication/SMB
    graph, which low-probability lateral-movement edges, privilege-boundary crossings, or never-before-used
    credential uses are surfaced?
  context: 'Detect (D3-D): Graph ML reveals stealthy lateral-movement paths that thread through many low-signal
    events. Apply unsupervised GNN / temporal link-prediction over the authentication/SMB graph to flag
    low-probability movement edges (CyberGraph / Euler style), and infer causal login/execution paths
    that cross privilege boundaries or use never-before-used credentials (Hopper style). Run alongside
    the deterministic rules and surface the top-3 contributing edges/credentials in the alert. A low-probability
    movement path crossing into privileged accounts is a high-value lead worth full path reconstruction;
    established, high-probability paths are normal operations. Source references: [CyberGraph](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf),
    [Euler](https://dl.acm.org/doi/10.1145/3588771), [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources:
  - Zeek smb_files.log
