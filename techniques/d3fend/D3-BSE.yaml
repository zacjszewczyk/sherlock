name: 'D3-BSE: Byte Sequence Emulation'
id: bc80bc48-fd63-400f-8438-339e2c429766
description: 'Investigate whether sequences of bytes observed in network payloads, extracted files, or
  scripts likely represent malicious shellcode by analyzing those bytes as if they were machine code instructions.
  This playbook helps an analyst detect shellcode across both network egress/ingress and host endpoints
  using complementary methods: deterministic signature/opcode and YARA matching, lightweight x86/x64 emulation
  to expose GetPC stubs and self-referencing decryption loops, correlation of suspicious script blocks
  with follow-on process creation, statistical entropy and byte-frequency/n-gram anomaly scoring against
  first-party baselines, surge and failure-mode monitoring, and supervised machine-learning classification
  of unknown payloads. It profiles both positive indicators (opcode hits, valid executed-instruction chains,
  high entropy, rare n-grams, script-to-process chains) and failure modes (failed disassembly, blocked/dropped
  sessions) as distinct signals so the analyst can confirm or rule out shellcode delivery and execution.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do byte streams in extracted files (Zeek files.log) and decoded PowerShell script blocks (Windows
    Event ID 4104) match known shellcode byte/opcode signatures such as GetPC stubs, egg-hunters, NOP
    sleds, and common stagers?
  context: 'This is the deterministic detection floor in support of the Detect tactic: known-bad byte
    patterns produce high-confidence alerts with minimal analysis. Scan byte streams referenced by Zeek
    files.log (extracted files) and decoded content from Windows Event ID 4104 against maintained YARA
    and opcode-signature rulesets covering GetPC stubs, egg-hunters, NOP sleds, and common stagers (e.g.,
    [Neo23x0 signature-base](https://github.com/Neo23x0/signature-base)) and the syscall/opcode reasoning
    from [Network-Based Buffer Overflow Detection by Exploit Code Analysis](https://eprints.qut.edu.au/21172/1/21172.pdf).
    A direct hit strongly indicates shellcode delivery or staging and should trigger immediate triage;
    the absence of a hit does not rule out novel or obfuscated shellcode, which the emulation, statistical,
    and ML methods below cover. Generate high-confidence alerts for direct hits; tune and extend rules
    to cut false positives, but never remove coverage.'
  answer_sources: &id001
  - Zeek files.log
  - Zeek conn.log
  - Suricata/Snort IDS alerts
  - Windows Event ID 4104
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Network egress/ingress points and critical host endpoints (servers, user workstations)'
  range: Last 90 days
  queries:
  - technology: YARA/pseudocode
    query: "for file in zeek_files.log.extracted + decode(EventID==4104):\n  matches = yara_scan(file,\
      \ ruleset=[GetPC, egg_hunter, NOP_sled, stagers])\n  if matches: alert(HIGH, file, matches)"
  - technology: SIEM/Rule pseudocode
    query: 'index=files OR index=ps_scriptblock

      | eval bytes=extracted_content

      | where opcode_signature_match(bytes, signature_base)

      | stats count by host, src_ip, rule_name'
- question: When each byte offset of a payload on a text-expected channel or of an extracted file is treated
    as a candidate instruction stream and run through a lightweight x86/x64 emulator, does any stream
    reach a long valid execution chain that includes GetPC code followed by repeated reads/writes to its
    own bytes (a self-decryption loop)?
  context: 'Polymorphic and self-modifying shellcode evades static signatures, so emulation exposes the
    behavior the bytes actually perform. In support of Detect, for payloads on text-expected channels/ports
    and for extracted files, treat each byte offset as a candidate instruction-stream start and run a
    lightweight x86/x64 emulator (libemu/NEMU-style) per [Network-Level Polymorphic Shellcode Detection
    Using Emulation](https://www3.cs.stonybrook.edu/~mikepo/papers/emulation.dimva06.pdf) and [Emulation-based
    Detection of Non-self-contained Polymorphic Shellcode](https://www3.cs.stonybrook.edu/~mikepo/papers/nemu.raid07.pdf).
    Flag a stream when execution reaches >=14 valid executed instructions AND includes GetPC code followed
    by >=8 reads/writes to the payload''s own bytes (decryption-loop self-reference); derive these thresholds
    per environment from the wild distributions in [An Empirical Study of Real-world Polymorphic Code
    Injection Attacks](https://www3.cs.stonybrook.edu/~mikepo/papers/nemu-study.leet09.pdf). Complement
    with code-vs-data discrimination per [SigFree](https://www.cse.psu.edu/~sxz16/papers/sigfree.pdf):
    disassemble, build the instruction-flow graph, and alert when the longest execution chain / push-call
    pattern count exceeds a threshold of useful instructions. A passing stream is strong evidence of executable
    shellcode; failed disassembly should be recorded as a separate failure-mode signal.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Emulator/pseudocode
    query: "for offset in range(len(payload)):\n  trace = emulate_x86(payload[offset:])\n  if trace.valid_instr\
      \ >= 14 and trace.has_getpc and trace.self_writes >= 8:\n    alert(HIGH, offset, trace)\n  if sigfree_longest_chain(payload)\
      \ > THRESHOLD: alert(MED)"
  - technology: Zeek/pseudocode
    query: '# emit candidate files for emulation; record disasm failures

      files.log -> extract -> emulate; if disasm_fail: log(failure_mode, fuid)'
- question: Are suspicious script-block contents (Event ID 4104) followed within a short window by process
    creation (Event ID 4688 / Sysmon Event ID 1) invoking rundll32, regsvr32, powershell, or reflective-loading
    patterns, forming a script-to-process shellcode execution chain?
  context: Detecting shellcode at execution time ties suspect bytes to actual host behavior. For the Detect
    tactic, correlate suspicious script-block content (Event ID 4104) with near-term process creation
    (Event ID 4688 / Sysmon Event ID 1) that invokes rundll32, regsvr32, powershell, or reflective-loading
    patterns. Prioritize chains whose script blocks also match shellcode signatures from [Neo23x0 signature-base](https://github.com/Neo23x0/signature-base).
    A matched chain is a high-priority indicator of shellcode execution on the endpoint and a candidate
    for rapid containment; absence of a follow-on process suggests the script may not have executed shellcode
    or was blocked.
  answer_sources: *id001
  range: Last 90 days; correlate script block and process creation within a 5-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=win EventCode=4104 [suspicious scriptblock]\n| join host [search EventCode=4688 OR (Sysmon\
      \ EventCode=1)\n    Image IN (rundll32.exe,regsvr32.exe,powershell.exe) OR reflective_load=true]\n\
      | where proc_time - script_time <= 5m\n| eval priority=if(scriptblock matches signature_base,\"\
      HIGH\",\"MED\")\n| alert"
  - technology: Sysmon/pseudocode
    query: "EventID=1 where ParentImage~powershell and Image in (rundll32,regsvr32)\n correlate with EventID=4104\
      \ within 5m -> chain_alert"
- question: Do files, scripts, or network payloads contain abnormally high-entropy regions or byte (1-gram)
    frequency distributions that deviate strongly from the normal baseline for that service, port, or
    length bin?
  context: 'Encrypted, packed, or encoded shellcode raises entropy and distorts byte-frequency profiles
    relative to benign content. Supporting Detect, compute Shannon entropy per file/script/payload type
    and flag high-entropy regions (>7.0-7.2 on text-expected channels) per [Using Entropy Analysis to
    Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989) (Volume signal).
    In parallel, model the byte (1-gram) frequency distribution of normal payloads per service/port/length
    bin and score new payloads with a simplified Mahalanobis distance per [PAYL: Anomalous Payload-based
    Network Intrusion Detection](https://www.covert.io/research-papers/security/PAYL%20-%20Anomalous%20Payload-based%20Network%20Intrusion%20Detection.pdf).
    Alert when entropy or distance exceeds the type-specific 99th percentile of your own benign baseline.
    High scores warrant inspection and emulation; baselines must be first-party to keep false positives
    manageable.'
  answer_sources: *id001
  range: Last 90 days; build baseline over a longer clean window
  queries:
  - technology: SIEM/Stats pseudocode
    query: '... | eval H=shannon_entropy(bytes)

      | where (channel=="text" AND H>7.0)

      | eval d=mahalanobis(bytefreq(bytes), baseline[service,port,lenbin])

      | where H > pct99[type] OR d > pct99[type]

      | alert'
  - technology: Zeek/pseudocode
    query: files.log -> compute entropy(extracted); flag entropy>7.2 on text channels
- question: What fraction of a payload's byte n-grams (n=3-5) have never been seen in the clean first-party
    traffic baseline for that channel, and does that novel-n-gram fraction exceed the tuned threshold?
  context: 'Higher-order byte n-grams capture shellcode instruction structure and resist mimicry/blending
    better than 1-gram models. For Detect, build a per-channel Bloom-filter model of normal byte n-grams
    (n=3-5) trained on clean first-party traffic, then alert when the fraction of never-before-seen n-grams
    in a payload exceeds a threshold (start ~5%, tune per channel) per [Anagram: A Content Anomaly Detector
    Resistant to Mimicry Attack](https://mice.cs.columbia.edu/getTechreport.php?techreportID=403&format=pdf).
    A high novelty fraction indicates content structurally unlike normal traffic and is a strong anomaly
    worth correlating with emulation and signature results; a low fraction suggests the payload resembles
    benign baseline traffic.'
  answer_sources: *id001
  range: Last 90 days; train Bloom filter on a longer clean window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model = bloom_filter(ngrams(clean_traffic[channel], n=3..5))\nfor payload:\n  novel = count(g\
      \ not in model for g in ngrams(payload,n))/total\n  if novel > 0.05: alert(channel, novel)"
- question: Are there surges in shellcode-like features (signature hits, emulation hits, high-entropy
    payloads) per host/subnet, shifts in the ratio of code-flagged to total payloads, or spikes in failure
    modes such as failed disassembly and blocked/dropped connections?
  context: 'Coordinated payload delivery shows up as temporal bursts and elevated failure rates even when
    individual payloads are borderline. Supporting Detect, aggregate per-host/per-subnet counts/min of
    signature hits, emulation hits, and high-entropy payloads (Frequency) and the ratio of code-flagged
    to total payloads (State). Explicitly profile failure modes as distinct signals (Failure Mode Awareness):
    rates of failed disassembly, blocked/dropped connections (Zeek conn.log), and rejected sessions. Apply
    seasonal baselines, control charts, or EWMA to detect bursts indicating coordinated payload delivery,
    and surface unsupervised outliers with [Extended Isolation Forest](https://arxiv.org/pdf/1811.02141).
    A surge or failure-rate spike indicates possible coordinated injection campaigns and should focus
    deeper analysis on the implicated hosts/subnets.'
  answer_sources: *id001
  range: Last 90 days; evaluate with EWMA/control charts on hourly or daily buckets
  queries:
  - technology: SIEM/Stats pseudocode
    query: "| bin _time span=1h\n| stats count(sig_hit) as sigs count(emu_hit) as emus count(high_entropy)\
      \ as he\n    sum(code_flag)/count as code_ratio by host,subnet\n| eval anomaly=ewma_or_controlchart(sigs,emus,he,code_ratio)\n\
      | append [extended_isolation_forest(features) where score>thr]\n| alert"
  - technology: Zeek/pseudocode
    query: conn.log | stats count by host where conn_state in (REJ,RSTO) -> failure_mode rate
- question: When a supervised classifier scores unknown payloads using entropy, byte n-gram vectors, opcode
    frequency, and emulation-derived features, which payloads are predicted to be shellcode with high
    probability, and what top features drove each prediction?
  context: Machine learning generalizes across the feature space to catch zero-day and obfuscated shellcode
    that escapes signatures and fixed thresholds. For Detect, train supervised classifiers on labeled
    benign/malicious payloads using entropy, byte n-gram vectors, opcode frequency, and emulation-derived
    features (executed-instruction count, payload-read count). Use gradient-boosted trees per [Performance
    Comparative Study on Zero Day Malware Detection Using XGBoost and Random Forest Classifiers](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers),
    a raw-byte CNN per [Malware Detection by Eating a Whole EXE (MalConv)](https://arxiv.org/pdf/1710.09435),
    and/or a CNN-LSTM over decoded opcode sequences per [CNN-LSTM and transfer learning models for malware
    classification](https://www.sciencedirect.com/science/article/abs/pii/S0950705124001783). Route high-probability
    detections for rapid containment and, per [SHAP Integration in Intrusion Detection Systems](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full),
    include the top-3 contributing features (e.g., n-gram novelty ratio, payload entropy, executed-instruction
    count) in the alert rather than a bare score so the analyst can validate the model's reasoning.
  answer_sources: *id001
  range: Last 90 days; retrain periodically on labeled data
  queries:
  - technology: ML/pseudocode
    query: "X = features(entropy, ngram_vec, opcode_freq, executed_instr_count, payload_read_count)\n\
      p = model.predict_proba(X)  # XGBoost / MalConv CNN / CNN-LSTM\nif p > 0.9:\n  top3 = shap_top_features(model,\
      \ X)\n  alert(HIGH, payload, prob=p, drivers=top3)\n  route_to_containment(payload)"
