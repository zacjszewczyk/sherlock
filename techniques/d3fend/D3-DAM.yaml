- question: Which organizational units or host tiers show abnormal account churn or usage based on percentile
    bands for modification and logon volume, frequency, and success/failure state?
  context: Per-OU and per-tier baselining surfaces localized pockets of abnormal activity that global
    thresholds miss. Track percentile bands for 4728/4738/4624 volume (events/day), frequency (events/min),
    and success/failure state by OU and host tier, building per-account activity profiles in the spirit
    of the Dirichlet-process model of Heard et al. A positive result identifies an OU or tier with unusual
    account churn or authentication behavior; a negative result confirms activity is within normal band.
    Supports the Detect tactic by localizing identity anomalies.
