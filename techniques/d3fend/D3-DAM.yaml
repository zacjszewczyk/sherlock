    query: |-
      series = hourly_count(EventCode IN (4624,4728,4738))
      model = Prophet().fit(series[train])
      forecast = model.predict(series.index)
      residual = series - forecast.yhat
      alert where abs(residual) > k * forecast.uncertainty
      emit top3_contributing_buckets(residual)
- question: Which account-host authentication edges or credential-switch login paths are flagged as anomalous
    by unsupervised graph and temporal link-prediction models?
  context: Graph-based machine learning detects lateral movement and credential abuse invisible to single-event
    rules. Score anomalous account-host authentication edges with unsupervised graph models such as CyberGraph
    and temporal link prediction Euler, and rare credential-switch login paths with Hopper; each alert
    must surface the contributing edge/path and top-3 features and be validated against the LANL authentication
    dataset and CERT Insider Threat dataset. A positive result identifies a suspicious edge or path with
    explainable evidence; a negative result reflects expected graph structure. Supports the Detect tactic
    by modeling the full authentication graph.
