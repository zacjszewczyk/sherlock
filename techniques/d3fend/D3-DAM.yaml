- question: Are there accounts that were created and then deleted within a short window (e.g., under 24
    hours), or created and immediately added to a privileged group?
  context: Transient accounts that appear and disappear quickly, or that are created and instantly granted
    privilege, are a documented backdoor pattern (Splunk Security Content). Correlate 4720 (creation)
    with 4726 (deletion) for the same target account within a short window, and 4720 followed quickly
    by 4728/4732/4756. A positive result strongly suggests an attacker created a temporary account to
    perform actions and erase evidence; a negative result means account lifecycles follow expected durations.
    Supports the Detect tactic by exposing short-lived credential abuse.
