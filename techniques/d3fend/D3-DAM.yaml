      scores = CyberGraph.score_edges(graph) + Euler.temporal_link_predict(graph)
      paths = Hopper.detect_credential_switch(graph)
      alert where scores > threshold OR paths.suspicious
      attach contributing_edge, top3_features
- question: Do attention-augmented sequence models or UEBA peer-group baselining reveal interpretable
    account-sequence anomalies or peer deviations in logon and management events?
  context: Sequence and peer-group models catch behavior that is individually plausible but collectively
    anomalous, with human-readable explanations. Apply attention-augmented RNN log-language models per
    Brown et al. and UEBA peer-group baselining per Microsoft Sentinel UEBA over account logon and management
    events; outputs must expose the top contributing tokens/factors (rare action, first-time access, peer
    deviation) in alert text and run in parallel with deterministic rules. A positive result flags an
    account whose action sequence or peer-relative behavior is anomalous with explanation; a negative
    result reflects normal behavior. Supports the Detect tactic by adding explainable behavioral analytics.
