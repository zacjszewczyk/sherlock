      index=wineventlog EventCode IN (4625,4768,4769,4740)
      | stats count as fails dc(TargetUserName) as accts dc(IpAddress) as srcs by _time_bucket
      | eventstats avg(fails) as mu stdev(fails) as sd
      | where fails > mu+3*sd
      | eval pattern=case(accts>20 AND fails/accts<5,"spray", accts<3 AND fails>50,"brute", true(),"stuffing")
- question: Do forecasting models of hourly identity event volume show significant residuals indicating
    anomalous activity or telemetry integrity gaps?
  context: Time-series forecasting captures expected periodicity in identity events so that both surges
    and unexpected silence become visible. Train ARIMA or Prophet models on hourly 4624 and 4728/4738
    event volumes and alert on significant residuals; surface the top-3 contributing time buckets/features
    in alert text. A positive residual spike may indicate anomalous account activity, while an unexpected
    drop may indicate a telemetry integrity gap an attacker created. A negative result means observed
    volume tracks the forecast. Supports the Detect tactic by modeling temporal identity behavior.
