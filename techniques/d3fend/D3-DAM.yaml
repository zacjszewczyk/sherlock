- question: Do per-account or per-OU failed-logon ratios, Kerberos pre-auth failures, and lockout rates
    deviate in ways indicating password spray, brute force, or credential stuffing?
  context: Authentication-failure patterns are distinct signals from successful-logon anomalies and reveal
    credential-guessing campaigns. Baseline per-account and per-OU failed-logon ratio (4625/4771), Kerberos
    pre-auth failures (4768/4769 result codes), and lockout rate (4740); alert on deviations indicating
    password spray (many accounts, few attempts each), brute force (one account, many attempts), or stuffing,
    using thresholds from Splunk Security Content. A positive result indicates an active credential-guessing
    attack; a negative result reflects normal user error rates. Supports the Detect tactic by separating
    attack-driven failures from benign noise.
