name: 'D3-DAM: Domain Account Monitoring'
id: 9c8ab8b4-618b-4a78-a751-1e89746c724e
description: Investigate the lifecycle and usage of domain user accounts to surface unusual identity activity
  and credential abuse. This playbook helps an analyst verify telemetry coverage for account-management
  and logon events across all domain controllers, then hunt for high-risk lifecycle changes (account creation,
  enablement, password reset, deletion, attribute change, rename), privileged-group membership additions,
  short-lived create/delete backdoor accounts, and impossible-travel or geo-infeasible sign-ins. It layers
  a deterministic floor of exact account-management Event IDs and admin/owner allow-lists with statistical
  baselining of volume, frequency, and success/failure state per organizational unit and host tier, plus
  explainable machine learning over the account-host authentication graph and account event sequences.
  Use it to detect bulk account creation, abnormal account churn, password spray/brute-force/credential
  stuffing, structurally anomalous logins, first-time account-to-host edges, and peer-group deviations.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
