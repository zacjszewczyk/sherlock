      | eval speed = haversine(plat,plon,lat,lon) / ((_time-pt)/3600)
      | where speed > 900  // km/h, faster than commercial flight
- question: Are there statistically significant spikes or sustained regime shifts in account-creation
    (4720) and related modification volume per organizational unit?
  context: Bulk account creation is a hallmark of automated provisioning by an attacker or compromised
    admin tooling. Compute daily and weekly moving averages and standard deviations for 4720 (and 4728/4738)
    counts per OU and flag days exceeding three standard deviations or robust percentile bands; additionally
    apply change-point detection (CUSUM, PELT, Bayesian online change-point per Aminikhanghahi and Cook)
    to catch sustained shifts thresholds miss. A positive result indicates anomalous bulk activity in
    a specific OU; a negative result reflects steady-state churn. Supports the Detect tactic by quantifying
    abnormal account growth.
