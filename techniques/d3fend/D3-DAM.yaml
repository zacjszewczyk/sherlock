      | table _time, ComputerName, EventCode, SubjectUserName, TargetUserName
- question: Were there any additions to sensitive security-enabled groups (Domain Admins, Enterprise Admins,
    Schema Admins, Administrators) where the adding account or the target is not in the change-approval
    allow-list?
  context: Membership in highly privileged groups grants broad control over the domain, so additions are
    a key privilege-escalation and persistence signal. Alert on any 4728/4732/4756 event adding a member
    to Domain Admins, Enterprise Admins, Schema Admins, or Administrators where the adding account or
    target is not on the change-approval allow-list, using portable Elastic detection-rules and SigmaHQ
    logic. A positive result is a high-severity escalation indicator warranting immediate review; a negative
    result reflects approved access provisioning. Supports the Detect tactic by surfacing unauthorized
    privilege grants.
