- question: For each account, do consecutive sign-in events imply a physically impossible travel speed
    between source locations?
  context: Impossible-travel detection reveals credential compromise where the same account authenticates
    from geographically distant locations faster than physically possible. For each account, compare consecutive
    4624 sign-in events, geolocate the source addresses, and compute the implied travel speed; alert when
    it exceeds a realistic threshold (per Impossible Travel Detection WO2018085161A1). A positive result
    indicates likely shared or stolen credentials used from two places at once; a negative result reflects
    normal mobility. Supports the Detect tactic by flagging account usage anomalies tied to external access.
