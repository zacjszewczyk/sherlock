questions:
- question: Are all domain controllers continuously forwarding the required account-management and logon
    audit subcategories, and has any controller stopped sending a required Event ID family for more than
    24 hours?
  context: Detection depends entirely on complete telemetry. Confirm that every domain controller is forwarding
    the account-management and logon events (4720, 4722, 4724, 4725, 4726, 4738, 4781, 4728/4732/4756,
    4624, 4625, 4768/4769) over rolling windows per Audit User Account Management and ATT&CK Data Source
    DS0002. A controller that silently stops forwarding a subcategory creates a blind spot a sophisticated
    actor can exploit to create or modify accounts undetected. A positive finding (a gap) means coverage
    must be restored before other questions can be trusted; this supports the Detect tactic by ensuring
    identity-lifecycle visibility is intact.
