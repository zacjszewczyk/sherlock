- question: Which logins exhibit structurally anomalous (source, destination, account, service, time)
    patterns or represent first-time account-to-host authentication edges?
  context: Attackers moving laterally produce login structures that deviate from learned norms and create
    never-before-seen account-to-host edges. Learn normal (source, destination, account, service, time)
    login structures with association-rule mining per Siadati and Memon, and score first-time account-to-host
    authentication edges with the calibrated Bayesian new-edge model of Metelli and Heard; optionally
    rank suspicious accounts/hosts with PageRank-based graph statistics via LogonTracer. A positive result
    flags a structurally rare or brand-new authentication relationship; a negative result reflects an
    established pattern. Supports the Detect tactic by exposing anomalous identity graph behavior.
