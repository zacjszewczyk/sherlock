  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4776
  - Zeek conn.log
  - 'NAI: Domain Controllers, Authentication Servers, Member Servers, Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for each DC in domain_controllers:
        for each event_id in [4720,4722,4724,4725,4726,4738,4781,4728,4732,4756,4624,4625,4768,4769]:
          last_seen = max(_time) where ComputerName==DC and EventCode==event_id
          if now() - last_seen > 24h: alert("coverage gap", DC, event_id)
- question: Which account creations, enablements, password resets, deletions, attribute changes, or renames
    were initiated by identities not on the approved admin allow-list, outside maintenance windows, or
    by an unexpected parent process?
  context: High-risk identity-lifecycle changes are a primary persistence and privilege mechanism. Alert
    on account creation (4720), enablement (4722), password reset (4724), deletion (4726), attribute change
    (4738), or rename (4781) where the initiating identity is not on an approved admin allow-list, the
    action falls outside an approved maintenance window, or it was spawned by an unexpected parent process,
    per the MITRE Cyber Analytics Repository, SigmaHQ, and Splunk Security Content. A positive result
    indicates possible unauthorized account manipulation; a negative result indicates the change was authorized
    routine administration. This directly supports the Detect tactic by catching credential abuse early.
