questions:
- question: Are any newly created Windows services or scheduled tasks launching with command lines or
    executable paths that match known-malicious persistence indicators (encoded PowerShell, rundll32/mshta/regsvr32
    abuse, or execution from user-writable paths)?
  context: 'Detect tactic: adversaries frequently establish persistence by registering a new service (Event
    ID 7045/4697) or scheduled task (Event ID 4698) whose command line betrays its intent. Scan command-line
    arguments and executable paths for high-signal patterns: encoded PowerShell (-enc, -e, -EncodedCommand),
    rundll32.exe invoking unusual exports, mshta/regsvr32 fetching remote content, and binaries staged
    under C:\Users\Public\, %TEMP%, or /tmp. A match is strong evidence of malicious persistence and should
    alert immediately; a clean result reduces (but does not eliminate) suspicion. Use deployable SigmaHQ
    rules and the event-to-artifact mappings from JPCERT/CC to map detections back to host artifacts for
    triage.'
