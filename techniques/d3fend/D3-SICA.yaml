- question: On whole-system provenance graphs, do graph-based detectors surface an autostart-write ->
    anomalous-execution -> C2 path as a high-error or anomalous subgraph?
  context: 'Detect tactic: sophisticated persistence is best seen as a causal chain across system entities.
    On whole-system provenance graphs built from first-party audit telemetry, use node-level GraphSAGE
    (ThreaTrace) or temporal/masked graph autoencoders (KAIROS, MAGIC) to surface the autostart-write
    -> anomalous-execution -> C2 path as high-error subgraphs. These models learn normal provenance structure
    and flag deviations without per-rule tuning, catching multi-step persistence that point detectors
    miss. Present the reconstructed subgraph as alert context so an analyst can follow the kill-chain.
    A high-error subgraph linking a startup write to anomalous execution and outbound C2 is high-confidence.'
