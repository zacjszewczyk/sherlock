- question: Does a supervised classifier trained on labeled benign/malicious startup items flag any new
    entry as high-probability malicious based on path rarity, command-line complexity, parent-process
    lineage, and associated network activity?
  context: 'Detect tactic: with labeled training data, supervised models outperform heuristics at separating
    benign from malicious persistence. Train a classifier (LightGBM/Random Forest) on path rarity, command-line
    complexity/obfuscation, parent-process lineage, and associated Zeek network activity, following ProblemChild''s
    feature-attributed parent-child approach and Mandiant''s obfuscated-command-line features. Escalate
    high-probability items and surface the top-3 SHAP/feature contributions in the alert for explainability.
    A high malicious probability with an interpretable rationale (e.g., obfuscated command line + rare
    parent) is actionable; periodically retrain to limit drift.'
