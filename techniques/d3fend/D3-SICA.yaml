    query: ">-\n  source IN (WinEventID=4657, SysmonEID=13)\n  | where registry_path IN (\"*\\\\CurrentVersion\\\
      \\Run*\", \"*\\\\Winlogon\\\\Shell\", \"*\\\\Winlogon\\\\Userinit\",\n          \"*\\\\Image File\
      \ Execution Options*\", \"*\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\AppInit_DLLs\")\n  | lookup\
      \ signer(new_value) as sig\n  | where sig!=\"signed\" OR match(new_value, \"\\\\\\\\users\\\\\\\\\
      |\\\\\\\\temp\\\\\\\\|\\\\\\\\public\\\\\\\\\")\n  | alert priority=high"
- question: On Linux hosts, are systemd unit files, cron entries, init.d scripts, or rc.local being created
    or modified—especially with ExecStart targets pointing to user-writable paths—outside of package-manager-driven
    changes?
  context: 'Detect tactic: Linux persistence commonly abuses systemd units, cron, init.d, and rc.local.
    With auditd/eBPF, alert on creation/modification of unit files under /etc/systemd/system, /usr/lib/systemd/system,
    and ~/.config/systemd/user, on cron/init.d/rc.local writes, and on ExecStart values pointing to user-writable
    directories, following Elastic Security Labs'' persistence primer. Allowlist legitimate package-manager
    (apt/yum/dnf/rpm) activity to suppress benign changes. A write to these locations by a non-package-manager
    process, or an ExecStart pointing to /tmp or a home directory, is high-signal for persistence.'
