      \ as bo, sum(resp_bytes) as bi by process_guid ]\n  | where ent > baseline_entropy_p95 AND (payload_size\
      \ < small_thresh OR bo+bi anomalous)\n  | alert priority=medium"
- question: Among first-seen startup entries, which ones exhibit a history of failures—failed service
    starts (7000/7009/7001), scheduled-task last-run result != 0x0, crash-loop restarts, or (for network-facing
    processes) Zeek connection failures and high NXDOMAIN ratios?
  context: 'Detect tactic: poorly-tested or misconfigured malicious persistence frequently fails before
    it succeeds, an unusual State for legitimate software. Profile failure signals as distinct features:
    failed service starts (Event ID 7000/7009/7001), scheduled-task last-run result != 0x0, crash-loop
    restart counts, and for network-facing autostart processes, Zeek connection failures or high NXDOMAIN
    ratios (indicative of dead/rotating C2). A new autostart entry with a non-zero failure history is
    high-signal. Alert on first-seen entries that repeatedly fail before succeeding; established, reliably-starting
    entries are lower priority.'
