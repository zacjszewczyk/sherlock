- question: After embedding service/task command lines with BERT-style representations, which startup
    command lines are flagged as rare outliers that would evade keyword-based signatures?
  context: 'Detect tactic: adversaries obfuscate command lines to evade keyword rules. Embed service/task
    command lines with BERT-style representations and apply unsupervised outlier detectors (Isolation
    Forest, COPOD, PCA, autoencoder) to flag rare command lines that keyword signatures miss, per CrowdStrike''s
    command-line anomaly work. The embedding captures semantic and structural rarity beyond literal token
    matches. Include the nearest known-good command line in the alert for explainability so an analyst
    can judge how far the flagged entry deviates. Outliers far from any benign cluster are high-priority;
    near-cluster entries are likely benign.'
