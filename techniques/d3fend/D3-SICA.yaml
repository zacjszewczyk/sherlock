      \ | TemporalGraphAutoencoder   # ThreaTrace / KAIROS / MAGIC\n  node_err = model.reconstruction_error(G.nodes)\n\
      \  flag subgraphs where err > threshold AND path matches (autostart_write -> exec -> c2)\n  emit\
      \ reconstructed_subgraph as context"
