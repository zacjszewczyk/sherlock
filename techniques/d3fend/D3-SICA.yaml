- question: Within any host group, is the rate of new service creations, scheduled-task creations, and
    registry autostart writes spiking beyond the normal 30-day baseline (mean + 3 sigma)?
  context: 'Detect tactic: automated persistence deployment (e.g., a worm or post-exploitation script)
    produces bursts of autostart-creation activity. Build a per-host-group 30-day rolling time-series
    baseline of new service (7045) and scheduled-task (4698) creations plus registry autostart writes,
    then alert on spikes beyond mean + 3*sigma using statistical control limits (Dwyer & Truta). This
    captures the Frequency (count per minute) physics of automated persistence; tune the k multiplier
    per host role since servers and workstations differ. A sudden spike is suspicious; steady low-rate
    activity is normal.'
