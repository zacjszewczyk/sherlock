name: 'D3-SICA: System Init Config Analysis'
id: 9b40c1be-cb48-44c8-bfc9-c2af32491c65
description: This playbook helps an analyst investigate system process startup (init) configurations across
  Windows, Linux, and macOS endpoints to detect unauthorized persistence mechanisms. It establishes a
  baseline for autostart extensibility points—Windows registry Run/RunOnce/Winlogon/IFEO/AppInit keys,
  services, scheduled tasks, and Startup folders; Linux systemd units/timers, cron, init.d, and rc.local;
  and macOS launchd plists—then surfaces deviations from that baseline. Use it to hunt for anomalous or
  unauthorized startup entries that reference unsigned binaries or user-writable paths, are rare across
  the fleet, are created in abnormal volume or frequency, exhibit randomized/high-entropy naming, or repeatedly
  fail to start. The questions combine symbolic-logic signatures, statistical rarity/velocity/entropy/failure-state
  analytics, and machine-learning detectors (isolation forests, supervised classifiers, command-line embeddings,
  sequence modeling, and provenance-graph analysis) so a SOC analyst can distinguish legitimate software
  and administrative changes from adversary persistence.
type: technique
