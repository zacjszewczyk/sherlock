- question: Using a median/MAD-based modified z-score that resists contamination from patch days and imaging
    batches, which hosts show an autostart-creation rate outlier (|z| > 3.5)?
  context: 'Detect tactic: mean/stddev baselines are skewed by legitimate mass events like patch Tuesday
    or imaging batches, producing false negatives or alert floods. Score each host''s autostart-creation
    rate with the median and MAD-based modified z-score (flag at |z| > 3.5) to provide a batch-resistant
    confirmation. Run this in parallel with the sigma control-limits analytic; agreement between the two
    raises confidence, while a host flagged only by the robust score during a known imaging window can
    be deprioritized. This is a complementary, outlier-robust view of creation velocity.'
