  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventID=7045, WinEventID=4697, WinEventID=4698)\n  | eval cmd=lower(image_path\
      \ + \" \" + command_line)\n  | where match(cmd, \"-enc|-encodedcommand|\\\\benc\\\\b\")\n      \
      \    OR match(cmd, \"rundll32.*,[a-z]\")\n          OR match(cmd, \"mshta|regsvr32\") AND match(cmd,\
      \ \"http|https|\\\\\\\\\\\\\\\\\")\n          OR match(cmd, \"c:\\\\\\\\users\\\\\\\\public|\\\\\
      \\\\temp\\\\\\\\|/tmp/\")\n  | alert priority=high"
- question: When each host's current autostart inventory is compared against its previous baseline, which
    autostart extensibility points (services, tasks, registry keys, startup folders) have new additions
    or removals not attributable to validated Microsoft-signed entries?
  context: 'Detect tactic: persistence shows up as a change to a host''s set of autostart entries over
    time. Periodically inventory all autostart extensibility points with Sysinternals Autoruns/autorunsc
    (ignoring validated Microsoft-signed entries) and diff each snapshot against the host''s prior baseline
    per CAR-2013-01-002. Additions are the primary signal for newly planted persistence; removals can
    indicate defense evasion or cleanup. In dynamic environments this may produce noise, so correlate
    diffs with other signals. Where streaming detection is required, replace the periodic scan with registry/file
    sensor events (Sysmon EID 13, Event 4657) feeding the same diff logic.'
