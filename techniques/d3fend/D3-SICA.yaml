      )\n  | table host, entry_location, image_path, status"
- question: Have any Windows Registry autostart or AppInit_DLLs persistence keys been modified to reference
    non-signed executables or files located in user-writable directories?
  context: 'Detect tactic: classic persistence and privilege-escalation techniques write to high-value
    registry keys. Monitor modifications (Event ID 4657 / Sysmon EID 13) to HKLM\Software\Microsoft\Windows\CurrentVersion\Run,
    RunOnce, Winlogon Shell/Userinit, Image File Execution Options, and the AppInit_DLLs values (per CAR-2020-09-005).
    AppInit DLLs are loaded by user32.dll into every process that loads it, making them a powerful privilege-escalation
    foothold. Alert on new entries that reference unsigned executables or files in user-writable paths;
    benign software updates can touch Run keys, so corroborate signer status and path.'
  answer_sources:
