      \ as mad by host\n  | eval mz = 0.6745*(rate-med)/mad\n  | where abs(mz) > 3.5\n  | sort -mz"
- question: For each newly identified startup item, does its filename/path exhibit high Shannon entropy
    (randomized naming) combined with anomalous payload size or unusual associated network byte volume?
  context: 'Detect tactic: malware persistence often uses randomly generated filenames and small/odd payloads.
    For each new startup item compute Shannon entropy of the filename and full path to flag randomized
    naming, and record Volume metrics: payload byte-size and any associated Zeek conn.log bytes_in/bytes_out
    for the launched process. High-entropy names paired with small or unusual payload sizes strongly indicate
    malware persistence. Derive entropy thresholds from the benign filename distribution in your environment
    rather than guessing; a high-entropy name plus anomalous network volume is a high-confidence finding.'
