- question: Does the observed boot/logon event sequence (service registration -> process creation -> network)
    deviate from the modeled normal ordering, indicating out-of-order or unexpected autostart launches?
  context: 'Detect tactic: even known-good autostart entries can be abused, and the anomaly may appear
    only in the ordering/timing of events. Model the normal ordered boot/logon sequence (service registration
    -> process creation -> network) with a DeepLog-style LSTM and flag the top-k out-of-order or unexpected
    autostart launches (Du et al.). This complements static config diffing by catching anomalous execution
    ordering of otherwise-known entries—for example a normally-late service launching unusually early
    or initiating unexpected network activity. Sequences with high prediction error are suspicious; well-predicted
    sequences are normal.'
