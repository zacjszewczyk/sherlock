      \ (apt, dpkg, yum, dnf, rpm, packagekitd)\n  | OR (file ~ systemd_unit AND grep ExecStart ~ \"/tmp/|/home/|/dev/shm/\"\
      )\n  | alert priority=high"
- question: Across the entire fleet, which unique startup-config entries (executable path + command-line
    pairs for services, scheduled tasks, and systemd units) appear on fewer than ~1% of endpoints and
    therefore warrant review as rare-and-risky?
  context: 'Detect tactic: legitimate enterprise software is broadly deployed, while adversary persistence
    is typically rare. Aggregate startup-config entries across all endpoints and compute the global prevalence
    of each unique (executable path, command-line) pair, flagging those present on less than 1% of the
    fleet as high-risk (CAR-2014-11-002 cross-host rarity ranking). Derive the percentile cutoff per environment
    from the observed prevalence distribution rather than hard-coding 1%. A vanishingly rare entry that
    also references an unsigned binary or odd path is a prime triage candidate; commonly deployed entries
    can be deprioritized.'
