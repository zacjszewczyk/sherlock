      \ | stats count(eval(result!=\"0x0\")) as fails, min(_time) as first_seen by entry, host\n  | where\
      \ first_seen > now()-90d AND fails > 0\n  | join entry [ search Zeek:conn.log | stats count(eval(conn_state\
      \ IN (\"S0\",\"REJ\"))) as netfail by entry ]\n  | where fails>0 OR netfail>0\n  | alert priority=medium"
- question: When each new startup item is scored with an unsupervised Isolation Forest over its structural
    and contextual features, which items rank as anomalies—and what are the top contributing features?
  context: 'Detect tactic: many persistence indicators are individually weak but jointly anomalous. Score
    each new startup item with an unsupervised Isolation Forest (sklearn IsolationForest, per Liu, Ting
    & Zhou) over features {path depth, filename entropy, signer status, parent-process reputation, creation
    hour, cross-host rarity, payload byte-size}. The model isolates outliers without labels, catching
    novel persistence that signatures miss. Emit the top-3 contributing features (e.g., ''unsigned, prevalence=0.2%,
    entropy=4.8'') in the alert so analysts can triage quickly. High anomaly scores warrant review; the
    explanation distinguishes benign-but-rare from malicious.'
