name: 'D3-MFA: Multi-factor Authentication'
id: a3c48626-8ccd-4682-9dfd-4c334e550343
description: 'Investigate the coverage, effectiveness, and active subversion of Multi-factor Authentication
  (MFA) across the enterprise. This playbook helps an analyst answer whether MFA is genuinely enforced
  where it matters and whether attackers are bypassing or defeating it. It guides two complementary lines
  of inquiry: (1) measuring MFA policy coverage and detecting enforcement gaps — privileged or sensitive
  sign-ins that succeed with a single factor, recurring conditional-access/legacy-auth bypasses, downgrades
  from phishing-resistant factors to weak fallbacks, anomalous failure rates, coverage regression over
  time, and behavioral policy drift; and (2) detecting active attacks against enforced MFA — push-bombing/MFA
  fatigue, adversary-in-the-middle (AiTM) session-token theft surfaced as impossible travel on MFA-satisfied
  sessions, anomalous authenticator/device registration, failed-authentication bursts and password spray,
  and behavioral anomalies scored by risk-based and sequence models. Evidence is drawn from cloud identity
  provider logs (Azure AD/Entra Sign-in and Audit Logs), Windows authentication events, and network telemetry
  (Zeek).'
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which successful authentications to privileged roles, AAL3-required apps, or sensitive applications
    completed with only a single factor and without an approved, time-bounded exception?
  context: This question identifies non-approved single-factor access that violates the required assurance
    level for the role or application. Using Azure AD Sign-in Logs, split successful authentications into
    MFA-satisfied versus MFA-bypassed outcomes (authenticationRequirement='singleFactorAuthentication',
    authenticationDetails) and correlate with local logons (Event ID 4624 with no preceding MFA claim).
    Treat the assurance level required per app/role as a deterministic floor per NIST SP 800-63B-4. A
    positive result — a privileged account, AAL3 app, or sensitive application authenticating without
    MFA and not on an approved exception list — is a direct control gap an attacker could exploit. Within
    the Harden tactic, this confirms whether the MFA control is actually enforced where policy demands
    it.
  answer_sources:
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Domain Controllers, ADFS), Cloud Identity Provider tenants (e.g., Azure
    AD), and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      // MFA-bypassed successful auth to high-value targets
      index=azuread_signin OR source="WinEventID:4624"
      | eval mfa_satisfied = (authenticationRequirement=="multiFactorAuthentication")
      | where status=="success" AND mfa_satisfied==false
      | where (user_role IN privileged_roles) OR (app IN aal3_apps) OR (app IN sensitive_apps)
      | where NOT lookup(approved_mfa_exceptions, user, app, valid_until)
      | table _time, user, user_role, app, src_ip, authenticationRequirement
      | alert
- question: Which users or applications repeatedly satisfy MFA through bypass or conditional-access exception
    conditions (token-claim reuse, trusted-IP/named-location bypass, or legacy/basic-auth protocols)?
  context: 'This question detects recurring MFA bypass conditions that represent systemic control gaps
    rather than one-off events. Correlate bypass/conditional-access reason codes (e.g., ''MFA requirement
    satisfied by claim in token'', trusted-IP/named-location bypass, legacy-auth protocols) with account,
    application, and device context. Escalate users or apps with repeated bypasses across multiple days.
    Pay special attention to legacy/basic-auth protocols (IMAP/POP/SMTP, ActiveSync) that cannot enforce
    interactive MFA and therefore create uneven coverage. A positive result reveals a durable hole in
    MFA enforcement; a negative result increases confidence that bypass paths are tightly scoped. Tactic
    relevance (Harden): legacy protocols and broad trusted-location exceptions are common ways MFA is
    silently defeated.'
  answer_sources:
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Domain Controllers, ADFS), Cloud Identity Provider tenants (e.g., Azure
    AD), and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=azuread_signin
      | eval bypass_reason = case(
          resultDetail=="MFA requirement satisfied by claim in token", "token_claim",
          conditionalAccessStatus=="notApplied" AND named_location=="trusted", "trusted_ip",
          clientAppUsed IN ("IMAP","POP","SMTP","ActiveSync","Other clients"), "legacy_auth",
          true(), null())
      | where isnotnull(bypass_reason)
      | stats dc(date) AS bypass_days, count BY user, app, bypass_reason
      | where bypass_days >= 2
      | sort - bypass_days
- question: For accounts that registered a phishing-resistant authenticator (FIDO2/WebAuthn or certificate),
    did a later authentication fall back to a weaker factor (SMS OTP, voice, push) or was a strong factor
    deregistered?
  context: This question flags MFA method downgrade and fallback to weak factors. Maintain a per-account
    inventory of registered authenticators and alert when a phishing-resistant factor is followed by authentication
    using a weaker fallback factor, or when a strong factor is deregistered. Origin-bound FIDO2 is phishing-resistant
    only until a downgrade re-introduces interception (per Berladskyy & Aßmuth) and the verifier-impersonation-resistance
    property in NIST SP 800-63B-4. A positive result indicates an account whose strongest protection has
    been undercut — either by an attacker forcing a fallback path or by deregistration of a strong factor
    — re-opening it to phishing/AiTM. Within Harden, this verifies that the strongest available factor
    is the one actually used.
  answer_sources:
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Domain Controllers, ADFS), Cloud Identity Provider tenants (e.g., Azure
    AD), and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      // Build per-account authenticator inventory, detect downgrade/deregistration
      index=azuread_signin
      | eval factor_strength = case(
          authMethod IN ("FIDO2","WebAuthn","CertificateBasedAuth"), 3,
          authMethod IN ("MicrosoftAuthenticatorPush","OATH"), 2,
          authMethod IN ("SMS","Voice"), 1, true(), 0)
      | sort user, _time
      | streamstats max(factor_strength) AS prev_max BY user
      | where prev_max==3 AND factor_strength < 3
      | append [ search index=azuread_audit activity="Delete security info" OR activity="User deleted security info"
                | eval factor_strength=3 ]
      | table _time, user, authMethod, factor_strength, prev_max
      | alert
- question: Which users, roles, or applications show MFA failure/deny rates that exceed their rolling
    30-day baseline (above the 95th percentile or a sudden week-over-week spike)?
  context: This question baselines MFA failure rates and surfaces statistical outliers. Compute daily
    MFA failure/deny rates by user, role, and application and compare against rolling 30-day distributions,
    deriving per-environment thresholds from the empirical distribution rather than a fixed global value.
    Profile the failure type as a first-class signal (deny vs timeout vs error), consistent with the failed-login
    behavioral policy in Microsoft Defender for Cloud Apps. A positive result — a user above the 95th
    percentile or a sudden spike — may indicate brute force, misconfiguration, fatigue attacks, or a struggling
    user; the failure subtype helps disambiguate. Within Harden, abnormal failure behavior often precedes
    or accompanies attempts to defeat MFA.
  answer_sources:
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Domain Controllers, ADFS), Cloud Identity Provider tenants (e.g., Azure
    AD), and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=azuread_signin (resultType!=0 OR status="failure")
      | eval outcome = case(resultDetail LIKE "%denied%","deny", resultDetail LIKE "%timeout%","timeout", true(),"error")
      | bin _time span=1d
      | stats count AS fails BY _time, user, user_role, app, outcome
      | eventstats avg(fails) AS mu, stdev(fails) AS sd, perc95(fails) AS p95 BY user, app, outcome
      | where fails > p95 OR fails > (mu + 3*sd)
      | table _time, user, user_role, app, outcome, fails, p95
      | alert
- question: Has enterprise MFA enforcement coverage for privileged or non-privileged populations shown
    a downward step-change (policy regression) over recent weeks?
  context: This question tracks enterprise MFA coverage trends with change-point detection. Measure weekly
    MFA enforcement coverage across privileged and non-privileged populations and apply CUSUM/PELT/Bayesian
    online change-point detection to flag downward step-changes rather than relying on a static target
    (per Aminikhanghahi & Cook). Surface the largest contributing business units/apps to prioritize remediation
    campaigns. A positive result — a detected downward change point — signals that a policy change, exception,
    or new app onboarding regressed coverage, creating exploitable gaps. Within Harden, this provides
    early warning that the MFA control posture is silently eroding before an incident occurs.
  answer_sources:
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Domain Controllers, ADFS), Cloud Identity Provider tenants (e.g., Azure
    AD), and VPN concentrators.'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      // Weekly MFA enforcement coverage + change-point detection
      index=azuread_signin earliest=-180d
      | bin _time span=1w
      | eval mfa_enforced = if(authenticationRequirement=="multiFactorAuthentication",1,0)
      | stats avg(mfa_enforced) AS coverage, count BY _time, population  // population=privileged|nonpriv
      | sort population, _time
      | apply change_point_detection(coverage, method="PELT")  // or CUSUM / BOCPD
      | where change_direction=="down"
      | eval contributors=top_decreasing_units(population, _time)
      | table _time, population, coverage, change_magnitude, contributors
      | alert
- question: Which users are behavioral outliers in MFA usage and authentication context (low MFA-adoption
    ratio, abrupt cluster migration, novel geolocation/ASN, device, or network context)?
  context: This question clusters or scores authentication behavior to detect policy drift in an explainable
    way. Cluster or score users on MFA-usage ratio, login timing, source geolocation/ASN novelty, app
    diversity, device fingerprint, and network context (Zeek conn.log) using an unsupervised detector
    such as Extended Isolation Forest (Hariri et al.). Flag low-MFA-adoption outliers or abrupt cluster
    migration as enforcement drift, and surface the top-3 contributing features in every alert; feature
    selection follows the production RBA signals in Wiefling et al. A positive result identifies accounts
    whose MFA behavior diverges from peers — either weak adoption (a coverage gap) or sudden behavioral
    change (possible compromise). Within Harden, this catches drift that rule-based coverage metrics miss.
  answer_sources:
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication servers (Domain Controllers, ADFS), Cloud Identity Provider tenants (e.g., Azure
    AD), and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      // Unsupervised behavioral outlier detection (Extended Isolation Forest)
      index=azuread_signin OR source="zeek:conn"
      | stats mfa_ratio=avg(mfa_satisfied), dc(app) AS app_div, dc(geo) AS geo_nov,
              dc(asn) AS asn_nov, dc(device_fp) AS dev_div, avg(login_hour) AS hour
              BY user
      | apply eif_model features=(mfa_ratio,app_div,geo_nov,asn_nov,dev_div,hour) AS anomaly_score
      | where anomaly_score > threshold
      | eval top_features = explain_top3(anomaly_score)
      | table user, anomaly_score, mfa_ratio, top_features
      | sort - anomaly_score
- question: Are there accounts experiencing a burst of MFA deny/timeout events followed by an approval
    within a short window, indicating MFA fatigue / push-bombing?
  context: This question detects MFA fatigue / push-bombing. Monitor the frequency of MFA deny/timeout
    events (Azure AD Sign-in Logs, ResultDetail 'MFA denied'/'MFA timeout') per account within a short
    window and alert on sequences of 3+ denials/timeouts followed by a success in under 10 minutes, indicating
    the user was annoyed into approving. Tune the count and window from each tenant's benign deny-then-success
    distribution. This push-bombing pattern is documented Scattered Spider tradecraft (CISA/FBI AA23-320A);
    over-prompting that desensitizes users is why step-up should be risk-gated (Wiefling et al.). A positive
    result is a strong indicator that an attacker holding valid credentials wore the user down into approving
    access — a high-priority compromise lead.
  answer_sources:
  - Azure AD Sign-in Logs
  - Azure AD Audit Logs (authenticator registration)
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud Identity Provider tenants (e.g., Azure AD/Entra), Authentication servers (Domain Controllers,
    ADFS), MFA push services, and VPN concentrators.'
  range: Last 90 days; correlate within 10-minute windows per account
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      index=azuread_signin
      | eval outcome = case(resultDetail LIKE "%MFA denied%","deny", resultDetail LIKE "%MFA timeout%","timeout",
                           status=="success","success", true(),"other")
      | sort user, _time
      | streamstats time_window=10m count(eval(outcome IN ("deny","timeout"))) AS denials,
                   latest(outcome) AS last_outcome BY user
      | where denials >= 3 AND last_outcome=="success"
      | table _time, user, denials, last_outcome, src_ip, app
      | alert
- question: For consecutive authentications of the same identity, do any imply physically impossible travel
    velocity — especially where the second session was MFA-satisfied?
  context: This question detects impossible travel on MFA-satisfied sessions, a strong signal of stolen
    session tokens or AiTM hijack that bypassed the live MFA challenge. For consecutive authentications
    of the same identity, compute implied travel velocity (geo distance ÷ elapsed time) from source-IP
    geodata and flag physically impossible movement, with VPN/named-location handling (Microsoft WO2018085161A1).
    Prioritize cases where the second session was MFA-satisfied, and corroborate with the impossible-travel
    and infrequent-country policies in Microsoft Defender for Cloud Apps. A positive result indicates
    the same identity active from two infeasibly distant locations; MFA satisfaction on the suspicious
    leg points to token theft rather than a fresh login. Within Harden, this catches attacks that defeat
    enforced MFA outright.
  answer_sources:
  - Azure AD Sign-in Logs
  - Azure AD Audit Logs (authenticator registration)
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud Identity Provider tenants (e.g., Azure AD/Entra), Authentication servers (Domain Controllers,
    ADFS), MFA push services, and VPN concentrators.'
  range: Last 90 days; correlate consecutive sign-ins per identity
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=azuread_signin status=success
      | sort user, _time
      | streamstats current=f last(geo_lat) AS plat, last(geo_lon) AS plon, last(_time) AS ptime,
                   last(named_location) AS ploc BY user
      | eval dist_km = haversine(plat,plon,geo_lat,geo_lon)
      | eval hours = (_time - ptime)/3600
      | eval velocity = dist_km/hours
      | where velocity > 900 AND NOT (named_location=="vpn" OR ploc=="vpn")
      | eval priority = if(authenticationRequirement=="multiFactorAuthentication","high","normal")
      | table _time, user, dist_km, hours, velocity, priority
      | alert
- question: Did any MFA authenticator or device registration occur from a new IP/ASN/geo, immediately
    after a password reset or help-desk action, or for a privileged account outside a change window?
  context: This question detects anomalous authenticator/device registration. Alert on MFA authenticator
    or device registration (Azure AD Audit Logs 'Register security info', 'Add registered device') that
    occurs from a new IP/ASN/geo, immediately after a password reset or help-desk action, or for privileged
    accounts outside change windows. Attacker-controlled authenticator enrollment and SIM-swap-enabled
    resets are core Scattered Spider tradecraft (CISA/FBI AA23-320A). A positive result — an unexpected
    new-authenticator enrollment, particularly right after a credential reset or from an unfamiliar source
    — is a hallmark of an attacker establishing persistent MFA control of an account. Within Harden, this
    protects the integrity of the MFA enrollment process itself.
  answer_sources:
  - Azure AD Sign-in Logs
  - Azure AD Audit Logs (authenticator registration)
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud Identity Provider tenants (e.g., Azure AD/Entra), Authentication servers (Domain Controllers,
    ADFS), MFA push services, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      index=azuread_audit (activity="Register security info" OR activity="Add registered device"
                           OR activity="User registered security info")
      | lookup user_baseline user OUTPUT known_ips, known_asns, known_geos
      | eval new_source = NOT (src_ip IN known_ips OR asn IN known_asns OR geo IN known_geos)
      | join type=left user [ search index=azuread_audit activity IN ("Reset password","Reset user password")
                              | eval reset_time=_time ]
      | eval post_reset = (_time - reset_time) < 3600
      | eval priv_offhours = (user_role IN privileged_roles) AND NOT in_change_window(_time)
      | where new_source OR post_reset OR priv_offhours
      | table _time, user, activity, src_ip, asn, geo, post_reset, priv_offhours
      | alert
- question: Are there failed-authentication bursts that exceed the configured rate-limit/lockout cap,
    and do they reflect single-account brute force or low-and-slow password spray across many accounts?
  context: This question throttles and alerts on failed-authentication bursts. Enforce and monitor rate-limiting/throttling
    of failed authentication attempts per account and per source (Event ID 4625 / Sign-in failures), alerting
    when consecutive failures exceed the configured cap before lockout/back-off, consistent with the rate-limiting
    requirements in NIST SP 800-63B-4. Distinguish single-account brute force (many failures, one account)
    from low-and-slow spray (many accounts, few attempts each) using per-source failure fan-out. A positive
    result indicates an active credential-guessing campaign; the fan-out pattern tells the analyst whether
    to scope to one account or an enterprise-wide spray. Within Harden, this validates that throttling
    controls are functioning and surfaces attacks attempting to reach the MFA prompt.
  answer_sources:
  - Azure AD Sign-in Logs
  - Azure AD Audit Logs (authenticator registration)
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud Identity Provider tenants (e.g., Azure AD/Entra), Authentication servers (Domain Controllers,
    ADFS), MFA push services, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      source="WinEventID:4625" OR index=azuread_signin status=failure
      | bin _time span=5m
      | stats count AS fails, dc(user) AS accts BY _time, src_ip
      | eval pattern = case(fails > cap AND accts==1, "brute_force",
                            accts >= spray_threshold AND fails/accts <= 5, "password_spray",
                            fails > cap, "burst", true(), null())
      | where isnotnull(pattern)
      | table _time, src_ip, fails, accts, pattern
      | alert
- question: Which individual sign-ins receive a high behavioral risk score across risk-based authentication
    (RBA) features such as source IP/ASN novelty, geolocation, device fingerprint, language, and login
    hour?
  context: This question risk-scores anomalous authentications in an explainable way. Score each sign-in
    with a behavioral model over RBA features — source IP/ASN novelty, geolocation, user agent/device
    fingerprint, language, and login hour — to drive adaptive MFA step-up and post-hoc detection of token-theft
    sessions (Wiefling et al., 'Is This Really You?'). Emit the top-3 contributing features with each
    alert for triage. A positive result is a sign-in whose context deviates sharply from the user's norm,
    which may indicate credential or token theft even when MFA appears satisfied; the contributing features
    tell the analyst why. Within Harden, this supplies the risk signal that should gate step-up and catch
    sessions that slipped past static MFA rules.
  answer_sources:
  - Azure AD Sign-in Logs
  - Azure AD Audit Logs (authenticator registration)
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud Identity Provider tenants (e.g., Azure AD/Entra), Authentication servers (Domain Controllers,
    ADFS), MFA push services, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      // Risk-based authentication scoring (RBA)
      index=azuread_signin
      | lookup user_baseline user OUTPUT known_ips, known_asns, known_geos, known_devices, usual_hours, usual_lang
      | eval f_ip_novel = NOT(src_ip IN known_ips), f_asn_novel = NOT(asn IN known_asns),
             f_geo = NOT(geo IN known_geos), f_dev = NOT(device_fp IN known_devices),
             f_lang = (language != usual_lang), f_hour = NOT(login_hour IN usual_hours)
      | apply rba_model features=(f_ip_novel,f_asn_novel,f_geo,f_dev,f_lang,f_hour) AS risk_score
      | where risk_score > threshold
      | eval top_features = explain_top3(risk_score)
      | table _time, user, src_ip, risk_score, top_features
      | alert
- question: Do any per-user authentication/MFA event sequences form abnormal chains (e.g., repeated deny
    then approve fatigue, or downgrade then success) when modeled as ordered streams?
  context: This question sequence-models authentication chains in an explainable way. Train an attention-augmented
    recurrent sequence model on per-user authentication/MFA event streams to flag abnormal chains (e.g.,
    repeated deny→approve fatigue, downgrade→success) while surfacing the per-field attention weights
    that drove the score (Brown et al., evaluated on the LANL authentication corpus). Retain deterministic
    fatigue/impossible-travel rules in parallel as the floor of determinism. A positive result identifies
    a temporally suspicious sequence of events that individual rules might miss, with attention weights
    explaining which steps were anomalous. Within Harden, this captures multi-step MFA-defeat patterns
    — fatigue and downgrade chains — as coherent attack narratives rather than isolated events.
  answer_sources:
  - Azure AD Sign-in Logs
  - Azure AD Audit Logs (authenticator registration)
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: Cloud Identity Provider tenants (e.g., Azure AD/Entra), Authentication servers (Domain Controllers,
    ADFS), MFA push services, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      // Attention-augmented sequence model over per-user auth event chains
      index=azuread_signin OR source="WinEventID:4624" OR source="WinEventID:4625"
      | eval evt = mvjoin(mvappend(auth_method, outcome, app, src_geo), ":")
      | transaction user maxpause=1h
      | apply seq_attention_model input=evt_sequence AS seq_anomaly, attn_weights
      | where seq_anomaly > threshold
      | eval drivers = top_attention_fields(attn_weights)
      | table _time, user, seq_anomaly, drivers, evt_sequence
      | append [ search deterministic_fatigue_or_impossible_travel_rules ]
      | alert
