name: 'D3-EHB: Endpoint Health Beacon'
id: 48f71bbc-510d-4fa0-a548-86f9350158c6
description: This playbook helps an analyst investigate degradation, loss, or manipulation of endpoint
  health beacons (heartbeats) sent by managed hosts to a central security collector (SIEM/EDR/management
  server). Endpoints periodically transmit a secure, scheduled heartbeat conveying status (software versions,
  configuration, host/network identity); an interruption, abnormal cadence, or integrity failure in that
  beacon can signal that the endpoint has been isolated, that its control channel has been disrupted,
  that a security service has failed, or that the host has been compromised. The included questions span
  deterministic symbolic-logic checks (tolerance-multiplier timeouts, independent-observer corroboration,
  host-state correlation, beacon integrity/anti-spoofing), statistical detectors (phi accrual, robust
  median/MAD with seasonal ESD, CUSUM drift, FFT/autocorrelation periodicity baselining, failure-mode
  change-point series), and machine learning approaches (forecasting with dynamic thresholds, online label-free
  streaming anomaly detection, sequence models for beacon mimicry, and cause classification). Together
  they help distinguish benign downtime (power-off, maintenance, segmentation) from active interference
  or compromise, and to detect an attacker who attempts to mimic a healthy beacon after taking over the
  endpoint.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
