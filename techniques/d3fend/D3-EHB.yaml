questions:
- question: For each critical endpoint, has the health beacon failed to reach its designated collector
    within a tolerance-adjusted timeout (expected interval multiplied by a Detect Multiplier), indicating
    the host should be declared SUSPECT?
  context: This is the deterministic floor of beacon monitoring and supports the Detect tactic by giving
    a hard, explainable threshold that fires when a host goes silent. For each critical endpoint, derive
    the expected beacon interval and the collector IP/port from Zeek conn.log, then declare the host SUSPECT
    when no beacon arrives within (expected interval x Detect Multiplier). Start with 3 missed intervals
    x 1.5 jitter tolerance and tune per role, mirroring the timeout-and-multiplier model in [Bidirectional
    Forwarding Detection (RFC 5880)](https://www.rfc-editor.org/rfc/rfc5880.txt). A positive result (timeout
    exceeded) means the host stopped beaconing and warrants corroboration; a negative result means cadence
    is within tolerance. Keep this hard threshold as the floor and run statistical/ML detectors in parallel,
    because a sophisticated actor may silence or throttle the agent in ways a single static timeout misses.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for host in critical_endpoints:\n  beacons = conn.log where dst_ip=collector_ip and dst_port=collector_port\
      \ and src_ip=host.ip\n  expected = host.expected_interval\n  multiplier = host.detect_multiplier\
      \  // default 3 missed * 1.5 jitter\n  if (now - last(beacons.ts)) > expected * multiplier:\n  \
      \  declare host SUSPECT; raise alert(host, missed=floor((now-last)/expected))"
- question: When an endpoint's beacon is missing, do independent first-party liveness signals (switch
    CAM/ARP, DHCP lease renewal, AD Kerberos/NTLM logon, EDR check-in) also show the host as absent, justifying
    escalation rather than a transient-loss false positive?
  context: To avoid alerting on transient packet loss, corroborate a missed beacon through k independent
    observers before escalating to a compromise alert. Check the switch CAM/ARP table, DHCP lease renewal,
    Active Directory Kerberos/NTLM authentication in the Windows Security Event Log, and EDR agent check-in
    telemetry. Only escalate when the beacon is missing AND at least one corroborating liveness signal
    is ALSO absent, applying the indirect-probe confirmation pattern of [SWIM](https://www.cs.cornell.edu/projects/Quicksilver/public_pdfs/SWIM.pdf)
    and the completeness/accuracy trade-off formalized by [Chandra & Toueg](https://dl.acm.org/doi/10.1145/226643.226647).
    A positive result (beacon gone AND corroborators silent) strongly indicates real isolation or compromise
    relevant to the Detect tactic; if the beacon is missing but the host still authenticates or renews
    its lease, the loss is likely transient or the beacon path alone is broken.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for host in SUSPECT_hosts:  // beacon already missing\n  cam   = switch_cam_arp present(host.mac)\
      \ within last(beacon_interval)\n  dhcp  = dhcp_logs lease_renew(host.mac) within last(2*lease_time)\n\
      \  authn = WinSec EventID in (4768,4624) where Computer=host within last(beacon_interval)\n  edr\
      \   = edr_checkin(host.id) within last(beacon_interval)\n  corroborators_absent = count(not present\
      \ in [cam,dhcp,authn,edr])\n  if beacon_missing and corroborators_absent >= 1: escalate(host)"
- question: Can a missed beacon be explained by a legitimate host-state event such as a clean shutdown,
    reboot, or service stop (Windows Event IDs 1074/6006, 7034/7031), or does the silence remain unexplained
    and therefore suspicious?
  context: 'Distinguishing expected downtime from suspicious communications loss is central to a low-noise
    Detect capability. Enrich every heartbeat-miss alert with Windows Application/System Event Log context:
    shutdown events 1074 (initiated) and 6006 (clean event-log stop), service crash 7034 and unexpected
    service stop 7031, and reboot context. If a beacon stops immediately after a logged shutdown or reboot,
    the loss is expected; if the host goes silent with no such event, or a critical security service crashes
    (7034) right before the silence, treat it as suspicious per the secure-heartbeat health-monitor design
    in the [Sophos intrusion-detection patent](https://patents.google.com/patent/US20180191752A1). This
    correlation turns a bare timeout into an explainable, triageable finding.'
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days; correlate host-state events within +/- 15 minutes of the missed beacon
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for alert in heartbeat_miss_alerts:\n  ctx = WinEvent where Computer=alert.host and ts in\
      \ [alert.ts-15m, alert.ts+15m]\n        and EventID in (1074,6006,7034,7031,6005,6008)\n  if ctx\
      \ contains (1074 or 6006): tag alert = EXPECTED_DOWNTIME\n  elif ctx contains (7034 or 7031 on security_service):\
      \ tag alert = SUSPICIOUS_SERVICE_FAILURE\n  else: tag alert = UNEXPLAINED_SILENCE -> review"
- question: Has any received beacon failed integrity validation - a bad HMAC/signature, a stale or out-of-order
    sequence number, or an unexpected source IP/port - indicating an attacker may be mimicking a healthy
    heartbeat?
  context: A capable adversary who compromises a host may keep sending heartbeats to mask the takeover,
    so beacon integrity must be validated, not just beacon presence - directly serving the Detect tactic.
    Treat a beacon with a failed HMAC/signature, a stale or out-of-order sequence number, or an unexpected
    source IP/port as an alert in its own right (attacker mimicry), using the authenticated-keepalive
    provisions of [RFC 5880](https://www.rfc-editor.org/rfc/rfc5880.txt) and the message-integrity requirements
    of the [Sophos patent](https://patents.google.com/patent/US20180191752A1). Maintain per-endpoint consecutive
    success/fail and integrity-failure counters as deterministic triage fields (State metric). A positive
    result (integrity failure from a host that is supposedly healthy) is a high-fidelity indicator of
    spoofing or replay; a clean integrity record raises confidence the beacon is authentic.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for b in incoming_beacons:\n  if hmac_verify(b) == FAIL or b.seq <= last_seq[b.host] or b.seq\
      \ > last_seq[b.host]+max_gap\n     or b.src_ip not in allowed_ips[b.host] or b.src_port not in allowed_ports[b.host]:\n\
      \       integrity_fail_count[b.host] += 1\n       raise alert(SPOOFED_BEACON, host=b.host, reason=...)\n\
      \  else: consec_success[b.host]+=1; last_seq[b.host]=b.seq"
- question: For each endpoint, does the phi accrual suspicion value (phi = -log10 P(interval > time-since-last-beacon))
    exceed a tunable threshold, indicating the beacon is increasingly overdue relative to its learned
    timing distribution?
  context: Rather than a binary up/down decision, the [phi accrual failure detector](https://dspace.jaist.ac.jp/dspace/bitstream/10119/4784/1/IS-RR-2004-010.pdf)
    produces a continuously rising suspicion level that self-adapts to each endpoint's natural jitter
    - well suited to the Detect tactic where graceful sensitivity beats a brittle timeout. Per endpoint,
    fit the historical inter-beacon-interval distribution and compute phi = -log10 P(interval > time-since-last-beacon);
    alert when phi exceeds a tunable threshold (start 8-12). As a beacon becomes overdue, phi climbs smoothly,
    so the detector raises suspicion proportionally instead of waiting for one hard cutoff. A high phi
    indicates the current silence is statistically improbable given past behavior; a low phi means the
    gap is consistent with normal jitter.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for host in endpoints:\n  intervals = historical inter_beacon_intervals(host)  // rolling\
      \ window\n  fit distribution D(intervals)            // e.g. normal/exponential of log-intervals\n\
      \  elapsed = now - last_beacon_ts(host)\n  phi = -log10( P_D(interval > elapsed) )\n  if phi > threshold(host):\
      \  // start 8..12\n    raise alert(host, phi)"
- question: Does an endpoint's current inter-beacon interval or beacon volume deviate from its robust
    rolling median by more than k x MAD (after removing business-hours/weekly seasonality), indicating
    an anomalous beacon-delay pattern?
  context: Robust, seasonality-aware baselining detects abnormal beacon delays without being masked by
    outliers - supporting Detect with fewer false alarms than mean +/- 3 sigma. Maintain a rolling per-endpoint
    baseline of inter-beacon intervals and beacon volume; flag when the current value deviates from the
    robust median by more than k x MAD (start k=6). First decompose business-hours/weekly seasonality,
    then test the residuals with a Generalized ESD test (Twitter's Seasonal Hybrid ESD, [Hochenbaum et
    al.](https://arxiv.org/abs/1704.07706)). Median/MAD resists masking by a few extreme values better
    than mean-based rules; keep mean+3SD as a coarse fallback. A flagged residual indicates the beacon
    timing/volume has shifted beyond normal seasonal variation, warranting review.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for host in endpoints:\n  series = inter_beacon_interval(host) and beacon_volume(host)\n \
      \ resid  = series - seasonal_decompose(series, period=daily+weekly)\n  med = median(window); mad\
      \ = MAD(window)\n  if abs(current - med) > k * mad:  // k=6\n    flag candidate\n  if generalized_ESD(resid)\
      \ == anomaly: raise alert(host)"
- question: Does a stateful CUSUM over an endpoint's beacon-interval and byte-volume residuals accumulate
    enough small, sustained drift to trip its threshold, revealing a slowly silenced or throttled agent
    that a single-sample test would miss?
  context: Stealthy adversaries throttle or gradually silence an agent so no single beacon looks abnormal;
    a stateful CUSUM accumulates small sustained deviations until they trip a threshold, which is essential
    for catching slow-drift attacks under the Detect tactic. Apply CUSUM to per-endpoint beacon-interval
    and byte-volume residuals so that frozen or missing measurements grow the cumulative statistic over
    time, as shown for stealthy attacks by [Urbina et al.](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf)
    and within the change-point toolbox (PELT, Bayesian online CPD) surveyed by [Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    A tripped CUSUM indicates a persistent, directional change (e.g., steadily lengthening intervals or
    shrinking volume); a flat statistic indicates stable behavior.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for host in endpoints:\n  for x in residuals(beacon_interval, byte_volume):  // streaming\n\
      \    S_pos = max(0, S_pos + (x - mu - slack))\n    S_neg = min(0, S_neg + (x - mu + slack))\n  \
      \  if S_pos > h or S_neg < -h:  // h tuned per host\n      raise alert(host, drift_direction); reset\
      \ S"
- question: Has an endpoint's learned dominant beacon period (via FFT/autocorrelation) disappeared or
    shifted, or have its per-beacon volume, request/response ratio, frequency, or jitter band drifted
    sustainably?
  context: Healthy beacons are strongly periodic; learning each endpoint's dominant period and jitter
    band lets the Detect tactic flag loss-of-periodicity that signals a broken, throttled, or hijacked
    beacon. Use FFT/autocorrelation to learn each endpoint's dominant beacon period and jitter band, and
    baseline Volume (bytes per beacon and request/response ratio) and Frequency (beacons per minute).
    Alert when the dominant period disappears or shifts, or when volume/jitter drift sustainably, applying
    the periodicity machinery of [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks)
    and the benign-periodicity, role-aware baselines of [Mack et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf)
    Period loss or a sudden change in beacon volume can indicate the agent is impaired or that a different
    process is now generating the traffic; stable periodicity supports normal operation.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for host in endpoints:\n  spectrum = FFT(beacon_timestamps(host)); P0 = dominant_period via\
      \ autocorrelation\n  jitter_band = baseline_jitter(host); vol = bytes_per_beacon, rr_ratio, beacons_per_min\n\
      \  if dominant_period(now) absent or |dominant_period(now)-P0| > tol\n     or sustained_drift(vol)\
      \ or sustained_drift(jitter):\n       raise alert(host, PERIOD_LOSS_or_VOLUME_DRIFT)"
- question: Are beacon-channel failure modes - blocked/denied firewall connections, failed TLS handshakes,
    DNS NXDOMAIN/SERVFAIL to the collector, HTTP 4xx/5xx - rising as distinct change-point series, indicating
    active interference rather than a clean power-off?
  context: 'Clean silence (host powered off) looks different from interference (beacons blocked or rejected);
    tracking failure modes as separate signals lets the Detect tactic tell these apart. Track failure-mode
    rates for the beacon channel as separate change-point series: blocked/denied firewall connections,
    failed TLS handshakes, DNS NXDOMAIN/SERVFAIL to the collector, and HTTP 4xx/5xx responses. Alert on
    rises distinct from clean silence, using change-point monitoring per [Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    A spike in denied connections or failed handshakes while the host is otherwise alive implies active
    interference (firewall change, MITM, or tampering) rather than benign downtime; no failures plus no
    beacons points more toward power-off or disconnection.'
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "fw_denied   = firewall_logs action=deny dst=collector by host  // change-point series\ntls_fail\
      \    = ssl.log where server=collector and validation_status!=ok\ndns_fail    = dns.log where query~collector\
      \ and rcode in (NXDOMAIN,SERVFAIL)\nhttp_err    = http.log where host=collector and status_code\
      \ in 4xx,5xx\nfor series in [fw_denied, tls_fail, dns_fail, http_err]:\n  if change_point_detect(series)\
      \ == rise: raise alert(ACTIVE_INTERFERENCE, series)"
- question: Do per-endpoint time-series forecasts of next check-in time and per-interval beacon count
    produce residuals exceeding an unsupervised nonparametric dynamic threshold, identifying anomalous
    beacon cadence or volume?
  context: Forecast-based detection adapts thresholds to each endpoint's evolving behavior, improving
    Detect-tactic sensitivity over static rules. Train per-endpoint time-series forecasters (ARIMA/Prophet
    for volume; LSTM for cadence) to predict the next check-in time and per-interval beacon count, then
    flag residuals that exceed an unsupervised nonparametric dynamic threshold with false-positive pruning,
    per NASA JPL's [Telemanom](https://arxiv.org/abs/1802.04431) and Prophet-based [cloud time-series
    IDS](https://link.springer.com/article/10.1186/s13677-023-00491-x). Alert text must surface the top-3
    contributing features (residual magnitude, deviating metric, recent failure rate) so an analyst can
    triage quickly. A large residual indicates the observed cadence/volume diverges from the learned forecast;
    residuals within the dynamic band indicate normal, expected behavior.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for host in endpoints:\n  model_vol = Prophet/ARIMA.fit(beacon_volume_history)\n  model_cad\
      \ = LSTM.fit(next_checkin_time_history)\n  pred = predict(model_vol, model_cad); resid = observed\
      \ - pred\n  thr = nonparametric_dynamic_threshold(resid)  // Telemanom, with FP pruning\n  if resid\
      \ > thr: raise alert(host, top3_features=[resid_mag,deviating_metric,recent_fail_rate])"
- question: Does an always-on, label-free streaming detector assign a high anomaly likelihood to an endpoint's
    beacon-interval stream, adapting to fleet-wide concept drift without retraining?
  context: Fleet behavior drifts (patches, schedule changes, new roles), so the Detect tactic benefits
    from a detector that learns continuously without labels or retraining. Score each endpoint's beacon-interval
    stream with an always-on detector that computes an anomaly likelihood and adapts to concept drift,
    per Numenta HTM and the open NAB benchmark ([Ahmad et al.](https://www.sciencedirect.com/science/article/pii/S0925231217309864)).
    A high anomaly likelihood indicates the recent beacon-interval pattern is novel relative to what the
    model has learned for that host; a low likelihood indicates the stream is consistent with recent normal
    behavior. Because it is unsupervised and online, it can surface emerging beacon anomalies that fixed
    rules and periodic models miss.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days (streaming/continuous)
  queries:
  - technology: ML/pseudocode
    query: "detector = HTM_online()  // unsupervised, continuous learning\nfor x in stream(beacon_interval[host]):\n\
      \  pred = detector.predict(x); detector.learn(x)\n  likelihood = anomaly_likelihood(pred, x)\n \
      \ if likelihood > threshold: raise alert(host, likelihood)"
- question: Do sequence models trained on legitimate inter-beacon timing flag a beacon stream as mimicry
    or high-jitter spoofing, or do log-key sequence models detect missing/out-of-order beacon and host-health
    events?
  context: An attacker may replay or fabricate beacons with imperfect timing to defeat simple periodicity
    tests; sequence models learn the temporal signature of a healthy beacon and flag deviations, strengthening
    the Detect tactic against mimicry. Train LSTM/transformer models on the temporal structure of legitimate
    inter-beacon intervals to recognize a healthy beacon's signature and flag attacker mimicry or high-jitter
    spoofing, per [Gupta et al. (C2 beaconing time-series)](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20).
    Complement with log-key sequence modeling that flags missing or out-of-order beacon and host-health
    events and names the deviating event, per [DeepLog](https://acmccs.github.io/papers/p1285-duA.pdf).
    A flagged sequence indicates the beacon's temporal/log-key structure deviates from learned legitimate
    patterns - consistent with spoofing or tampering; a conforming sequence supports authenticity.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq_model = LSTM/Transformer.fit(legit_inter_beacon_interval_sequences)\nlogkey   = DeepLog.fit(beacon_and_host_health_event_keys)\n\
      for host in endpoints:\n  if seq_model.score(recent_intervals[host]) == anomaly: raise alert(MIMICRY/HIGH_JITTER,\
      \ host)\n  miss = logkey.predict_next(event_window[host])\n  if observed_event not in miss.topk:\
      \ raise alert(host, deviating_event=observed_event)"
- question: When beacons are missing, does a trained classifier (using beacon timing, prior host-health
    events, corroborating-signal presence, and network context) attribute the cause to benign outage,
    segmentation issue, or security incident - with the top-3 contributing features explained?
  context: Triage speed under the Detect tactic improves when a model attributes a missing-beacon condition
    to a likely cause rather than emitting a bare score. Train a classifier on beacon timing, prior host-health
    events, corroborating-signal presence (CAM/ARP, DHCP, AD logon, EDR), and network context to estimate
    whether missing beacons reflect a benign outage, a segmentation issue, or a security incident. Emit
    the top-3 contributing features in the alert for explainable triage (feature-attribution approach
    as in [Telemanom](https://arxiv.org/abs/1802.04431)). A 'security incident' classification with corroborating
    absent liveness signals warrants escalation; an 'outage' or 'segmentation' classification, supported
    by host-state events or network changes, can be down-prioritized while still being verified.
  answer_sources:
  - Zeek conn.log
  - Firewall logs
  - Windows Application Event Log
  - Windows Security Event Log
  - DHCP server logs
  - EDR/agent check-in telemetry
  - 'NAI: All managed endpoints (workstations, servers), the central security management/SIEM/EDR server
    receiving beacons, core network switches, DHCP, and the authentication infrastructure used to corroborate
    liveness.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [beacon_timing, prior_host_health_events, corroborator_presence(cam,dhcp,authn,edr),\
      \ net_context]\nclf = GradientBoosting/RF.fit(labeled_history)\nfor host in missing_beacon_hosts:\n\
      \  pred = clf.predict_proba(features[host])  // {outage, segmentation, incident}\n  raise alert(host,\
