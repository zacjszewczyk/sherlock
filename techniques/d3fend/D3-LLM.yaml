name: 'D3-LLM: Logical Link Mapping'
id: 070841e7-11eb-41a7-9d66-650521e1b629
description: Investigate node-to-node logical link mapping to understand and govern how assets actually
  communicate east-west and north-south, and to detect deviations that indicate architecture drift, control
  gaps, or malicious pivoting. This playbook helps an analyst build a canonical source-destination communication
  graph from first-party connection telemetry (Zeek conn.log, Windows WFP Event IDs 5156/5157, NetFlow/IPFIX,
  firewall allow/deny logs), capturing per-edge Volume (byte counts and ratios), Frequency (connection
  counts), and State (success/failure), and compare those observed edges against a deny-by-default allow-list
  and segmentation policy. It layers deterministic rules (first-seen edges, disallowed trust-boundary
  crossings, high failure/blocked ratios), statistical analytics (betweenness centrality for critical
  dependency nodes, heavy-hitter Volume/Frequency control limits, edge churn and connection-state-ratio
  baselines), and explainable graph machine learning (Louvain community detection, unsupervised temporal
  link prediction for improbable edges, and inductive GraphSAGE node-structure anomalies) to rank improbable
  edges, choke-point nodes, churn, and shifting communities. Use it to surface scanning, denied lateral
  movement, segmentation probing, and pivoting before an adversary reaches crown-jewel or identity tiers.
type: technique
related:
- tactic_id: D3-M
  tactic_name: Model
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Can we build and maintain a canonical, normalized inventory of every observed (source, destination,
    protocol, destination-port) edge from Zeek conn.log and Windows Event ID 5156, with each edge annotated
    by its byte Volume (orig_bytes/resp_bytes), connection Frequency, and connection State (conn_state),
    and mapped to a known asset role?
  context: 'Under the Model tactic this question establishes the authoritative graph that every other
    analytic depends on: a deterministic record of how assets actually talk to one another. The analyst
    normalizes connection logs into unique edges keyed on (src, dst, proto, dport) and accumulates per-edge
    Volume (byte counts and orig/resp ratio), Frequency (connection count), and State (conn_state), then
    joins each endpoint to its asset role (user subnet, server tier, crown-jewel/identity tier, infrastructure)
    for governance tracking. First-seen edges should be marked for review. Validate and tune the model
    against labeled enterprise graphs such as LANL cyber1. A complete, role-annotated map lets you reason
    about what is normal; gaps in it mean downstream anomaly detection is blind.'
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_conn OR win_5156

      EVAL edge = concat(src_ip,''->'',dst_ip,'':'',dport,''/'',proto)

      STATS conn_count=count(), orig=sum(orig_bytes), resp=sum(resp_bytes), states=set(conn_state), first=min(ts)
      BY edge, src_ip, dst_ip, dport, proto

      EVAL byte_ratio = orig / nullif(resp,0)

      LOOKUP asset_roles ON src_ip, dst_ip

      | EVAL first_seen = first > now()-30d

      OUTPUT canonical_edge_inventory(volume, frequency, state, role, first_seen)'
- question: Which observed edges violate an explicit deny-by-default allow-list of permitted resource-to-resource
    flows or cross a trust boundary they should not (for example a user subnet reaching the crown-jewel/identity
    tier), and do any edges match BZAR signatures for SMB/DCE-RPC enumeration or remote execution?
  context: 'This is the policy-enforcement question for the Model tactic: it compares the observed graph
    to explicit segmentation policy rather than to history. Maintain an allow-list of permitted (source-role,
    destination-role, protocol) flows and alert on any disallowed pair or any protocol crossing a trust
    boundary, following NIST SP 800-207 Zero Trust principles. Layer BZAR Zeek rules to catch SMB/DCE-RPC
    enumeration and remote-execution edges that signal policy-violating lateral links. A positive result
    is a concrete segmentation control gap or active lateral movement; a clean result raises confidence
    that the trust boundaries are holding. Prioritize alerts whose destination is an identity or crown-jewel
    asset.'
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM canonical_edge_inventory

      JOIN segmentation_allowlist ON (src_role, dst_role, proto)

      | WHERE allowlist_match == false OR crosses_trust_boundary(src_role, dst_role)

      | EVAL crit = dst_role IN (''crown_jewel'',''identity'')

      OR bzar_match(service, dce_rpc_operation)

      | SORT crit desc'
  - technology: Zeek/pseudocode
    query: 'load bzar; event smb/dce_rpc enumeration or remote-exec ->

      if edge(src,dst) crosses trust boundary: notice DisallowedLogicalLink'
- question: Which (source, destination, destination-port) tuples appear that are absent from the trailing
    30/90-day baseline, and do any of these first-seen edges target critical segments or admin protocols
    such as RDP 3389, WinRM 5985/5986, SMB 445, or SSH 22?
  context: This deterministic rule is the floor underneath the probabilistic edge models in this playbook,
    supporting the Model tactic by catching brand-new communication paths without needing a trained model.
    The analyst compares each newly observed edge tuple against the trailing baseline of known edges and
    alerts when the tuple has never been seen, prioritizing edges into critical segments and administrative
    protocols frequently abused for lateral movement (RDP, WinRM, SMB, SSH). It operationalizes the new/improbable-edge
    concept from CyberGraph and EULER deterministically. A first-seen admin-protocol edge into a crown-jewel
    host is a strong pivot indicator; benign first-seen edges are common, so role and protocol context
    drives triage priority.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_conn OR win_5156

      EVAL tuple = concat(src_ip,''->'',dst_ip,'':'',dport)

      | WHERE tuple NOT IN baseline_edges(30d, 90d)

      | EVAL admin = dport IN (3389,5985,5986,445,22)

      | EVAL crit = dst_role IN (''crown_jewel'',''identity'')

      | WHERE admin OR crit

      ALERT first_seen_edge'
- question: Which edges or source nodes exhibit a high ratio of failed or blocked connections - for example
    Zeek conn_state S0/REJ/RSTO/RSTR or Windows Event ID 5157 drops - such as more than 20 failed/blocked
    connections to distinct destinations in five minutes, or a failure ratio above 0.8 on a new edge?
  context: Failure is treated as its own signal in the Model tactic because denied and half-open attempts
    reveal reconnaissance and segmentation probing that successful traffic hides. The analyst flags edges
    or source hosts with high failed/blocked ratios using Zeek conn_state codes (S0, REJ, RSTO, RSTR)
    and Windows 5157 drop events, applying fan-out thresholds (e.g., >20 failures to distinct destinations
    in 5 minutes) and per-edge failure-ratio thresholds (>0.8 on a new edge). Such patterns indicate scanning,
    denied lateral attempts, or someone testing segmentation boundaries. Derive concrete thresholds from
    local baselines and labeled red-team edges in LANL cyber1. A positive result warrants investigating
    the source host for compromise.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 7 days; pivot to event-centered 5-minute windows around bursts
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM zeek_conn OR win_5157

      EVAL failed = conn_state IN (''S0'',''REJ'',''RSTO'',''RSTR'') OR event_id==5157

      STATS fails=count(failed), distinct_dst=dcount(dst_ip), total=count() BY src_ip, bin(ts,5m)

      | EVAL ratio = fails/total

      | WHERE (fails>20 AND distinct_dst>20) OR (ratio>0.8 AND new_edge)

      ALERT high_failure_fanout'
- question: Which nodes in the communication graph have high betweenness centrality but are NOT designated
    infrastructure (routers/firewalls), making them potential single points of failure or high-value pivot
    points?
  context: Under the Model tactic this question finds the structurally important hosts an adversary would
    want to control. Compute exact betweenness centrality on the communication graph using Brandes' O(nm)
    algorithm, which measures how often a node lies on shortest paths between other nodes. Routers and
    firewalls are expected to score high, so the alert is on high-centrality nodes that are NOT designated
    infrastructure - those are unmanaged choke points, single points of failure, or pivot nodes worth
    hardening and monitoring. A positive result identifies a host whose compromise would disproportionately
    enable lateral reach; it should be reconciled against the asset role inventory.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'graph = build_graph(canonical_edge_inventory)

      bc = brandes_betweenness(graph)  # O(nm)

      FROM bc WHERE centrality > p95(centrality) AND role != ''infrastructure''

      SORT centrality desc

      OUTPUT critical_dependency_nodes'
- question: Which edges are heavy hitters by rolling connection-count (Frequency) and byte-volume (Volume,
    including orig/resp byte ratio) - landing in the 95th-99th percentile or showing sustained increases
    that indicate an emergent dependency or exfiltration channel?
  context: This statistical question for the Model tactic separates normal high-throughput services from
    emergent or anomalous bulk flows. Compute rolling Frequency and Volume distributions per edge (including
    orig/resp byte ratio, which exposes asymmetric outbound transfers) and flag 95th-99th percentile heavy
    hitters and sustained upward trends, using the graph-feature anomaly approach of Bohara et al. (PCA
    subspace projection, k-means clustering, median-absolute-deviation). Use per-zone control limits derived
    from local history rather than a single global threshold so that busy server tiers are not constantly
    noisy. A new heavy-hitter edge - especially outbound with a high orig/resp ratio - can indicate staging
    or exfiltration and warrants content/destination review.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM canonical_edge_inventory

      STATS freq=conn_count, vol=orig+resp, ratio=orig/nullif(resp,0) BY edge, zone, bin(ts,1d)

      EVAL p = percentile_rank(vol, zone) ; pf = percentile_rank(freq, zone)

      | WHERE p>=0.95 OR pf>=0.95 OR mad_outlier(vol, zone) OR sustained_increase(edge)

      OUTPUT heavy_hitter_edges'
- question: What is the daily edge churn (new, disappeared, and reappearing links) per zone, and which
    edges produce high per-edge discrepancy scores or form a coordinated-change subgraph that exceeds
    historical control limits?
  context: Churn analysis under the Model tactic detects architecture drift and coordinated change that
    a single-edge view would miss. Compute daily counts of new, disappeared, and reappearing links per
    zone, and score per-edge change with the two-stage Bayesian counting-process method of Heard et al.,
    which yields per-edge discrepancy scores and surfaces a coordinated-change subgraph (many edges changing
    together). Trigger investigation when zone churn exceeds historical control limits. High churn can
    mean benign migration or misconfiguration, but a coordinated-change subgraph appearing suddenly is
    a hallmark of pivoting or mass reconfiguration and should be correlated with change tickets and authentication
    events.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days; daily aggregation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM canonical_edge_inventory

      STATS new=count(new_edge), gone=count(disappeared), reapp=count(reappeared) BY zone, bin(ts,1d)

      score = heard_bayesian_counting_process(edge_history)  # per-edge discrepancy

      | WHERE zone_churn > control_limit(zone) OR coordinated_change_subgraph(score)

      OUTPUT edge_churn_anomalies'
- question: For each edge, what is the historical successful-versus-failed connection ratio (Zeek conn_state;
    Windows 5156 vs 5157), and which edges have significantly deviated - for example an edge that historically
    completed now flipping to majority half-open or reset connections?
  context: This statistical baseline for the Model tactic couples State with Volume and Frequency to distinguish
    noisy-but-benign services from genuine probing. Maintain a per-edge baseline of the success/failure
    ratio using Zeek conn_state and the ratio of Windows 5156 (permitted) to 5157 (blocked) events, and
    alert when an edge's ratio deviates significantly from its own history - classically an edge that
    used to complete reliably now showing majority S0/REJ/RST states. Because the baseline is per-edge,
    a service that is always partly failing does not generate noise, while a real behavioral flip stands
    out. A positive result indicates a host whose connection behavior changed, consistent with scanning,
    service disruption, or a control change.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn OR win_5156 OR win_5157

      EVAL ok = conn_state IN (''SF'',''S1'',''RSTO'') OR event_id==5156

      STATS ok_n=count(ok), bad_n=count(NOT ok) BY edge, bin(ts,1d)

      EVAL ratio = ok_n/nullif(ok_n+bad_n,0)

      | WHERE abs(ratio - baseline_ratio(edge)) > k*baseline_std(edge)

      OUTPUT conn_state_ratio_deviation'
- question: What logical communities emerge when the weighted communication graph is partitioned with
    Louvain modularity optimization, and which assets show abrupt community reassignment or anomalous
    cross-community bridging?
  context: Community detection under the Model tactic reveals the natural logical groupings of assets
    and the hosts that improperly bridge them. Partition the weighted communication graph using the Louvain
    modularity-optimization heuristic and assess partition quality with the Newman-Girvan modularity Q
    score. Then flag assets whose community membership abruptly changes between runs, or that bridge communities
    they normally do not, surfacing the top-3 contributing edges/communities in the alert for analyst
    validation. Stable communities map to expected asset groups (the FFIR question of identifying logical
    asset groups); a host that suddenly joins or bridges the identity tier from a user community is a
    candidate pivot. Treat output as leads requiring human validation, not autonomous blocking.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = build_weighted_graph(canonical_edge_inventory)

      communities = louvain(graph); Q = newman_girvan_modularity(communities)

      FROM communities WHERE abrupt_reassignment(node) OR cross_community_bridge(node)

      EVAL top3 = top_contributing_edges(node, 3)

      OUTPUT community_anomalies(top3)'
- question: When each new edge is scored with unsupervised graph embeddings / temporal link prediction
    (CyberGraph, EULER), which edges receive a low probability, and what are the top-3 contributing features
    (source/destination rarity, port novelty, time-of-day) for each?
  context: This machine-learning analytic for the Model tactic complements the deterministic first-seen
    rule with a probabilistic estimate of how surprising an edge is given the graph's learned structure
    and temporal dynamics. Score each new edge with unsupervised graph embeddings or temporal link prediction
    (CyberGraph, EULER) and alert on low-probability edges, running strictly in parallel with the first-seen
    rule so neither replaces the other. Crucially, surface the top-3 contributing features - source/destination
    rarity, port novelty, time-of-day - in the alert text so an analyst can triage quickly. A low-probability
    edge into a sensitive segment, driven by port novelty and odd timing, is a high-value lead; the model
    output is advisory and must be validated.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = euler_temporal_link_prediction(graph_history)  # unsupervised embeddings

      FROM new_edges EVAL p = model.score(edge)

      | WHERE p < low_prob_threshold

      EVAL top3 = explain(edge, [''src_rarity'',''dst_rarity'',''port_novelty'',''time_of_day''])

      SORT p asc OUTPUT improbable_edges(top3)'
- question: Using an inductive GraphSAGE model (ThreaTrace) trained on benign node neighborhoods, which
    nodes - including previously unseen hosts - have local graph structure that deviates from learned
    normal, and what are the top-3 neighborhood features driving each deviation?
  context: This inductive machine-learning analytic for the Model tactic generalizes anomaly detection
    to hosts the model has never seen, which transductive methods cannot do. Train an inductive GraphSAGE
    model (ThreaTrace) on benign node neighborhoods so it learns what normal local structure looks like,
    then flag nodes whose neighborhood structure deviates - even brand-new hosts. Report the top-3 neighborhood
    features driving the deviation (e.g., unusual degree, neighbor role mix, edge-type distribution) for
    explainability, and validate against labeled red-team edges in LANL cyber1. A structurally anomalous
    node is a candidate for compromise or misconfiguration; because the method is inductive it is well
    suited to dynamic environments, but its output remains a lead for human validation rather than an
    automated action.
  answer_sources:
  - Zeek conn.log (id.orig_h, id.resp_h, id.resp_p, proto, service, orig_bytes, resp_bytes, conn_state,
    history, duration)
  - Windows Event ID 5156 (WFP permitted connection)
  - Windows Event ID 5157 (WFP blocked connection)
  - NetFlow/IPFIX
  - Firewall allow/deny logs
  - 'NAI: Key network choke points (core switches, internet gateways, VPN concentrators), inter-zone segmentation
    boundaries, and critical server segments (crown-jewel/identity tiers).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = graphsage_inductive(train=benign_neighborhoods)  # ThreaTrace

      FROM nodes EVAL score = model.anomaly(node_neighborhood)

      | WHERE score > threshold

      EVAL top3 = explain_neighborhood_features(node, 3)

      OUTPUT node_structural_anomalies(top3)  # validate vs LANL cyber1'
