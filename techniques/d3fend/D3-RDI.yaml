tags: none
questions:
- question: For every critical asset in scope, does an approved disk image exist in the image repository,
    and is the latest approved image fresher than the policy window derived from the asset's Recovery
    Point Objective (default 30 days)?
  context: 'This deterministic coverage-and-freshness check is the foundation of restore readiness: you
    cannot restore an asset you have never imaged, and a stale image forces excessive data loss and rework.
    Perform a lookup of each critical asset against the disk image repository metadata and alert when
    no corresponding approved image exists, or when the newest approved image is older than the RPO-derived
    policy window. A positive result (missing or stale image) is a Restore-tactic readiness gap that must
    be remediated before an incident forces an unplanned recovery; a negative result confirms current,
    approved coverage. Backup-currency and recovery-prerequisite expectations follow NIST SP 800-184 and
    NIST SP 800-34 Rev 1. References: [Guide for Cybersecurity Event Recovery (NIST SP 800-184)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf);
    [Contingency Planning Guide (NIST SP 800-34 Rev 1)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for asset in critical_assets:\n  img = lookup(image_repo, asset)\n  if img is null: alert('no\
      \ approved image', asset)\n  elif now - img.approved_date > rpo_window(asset, default=30d):\n  \
      \  alert('stale image', asset, img.approved_date)"
- question: During a restore drill or incident, did the approved restore tooling actually execute (Windows
    Event ID 4688), was that execution tied to an authorized change ticket and an approved operator account,
    and did the rebuild use a known-good validated image?
  context: 'This check validates that a restore was performed legitimately and not by an unauthorized
    actor or with an unvetted image. Correlate process-creation events (Windows Event ID 4688) for the
    sanctioned restore binaries against the change-management ticket and the approved backup-operator
    account set, and confirm the image referenced is a validated known-good baseline. A positive result
    (restore tooling run by an unapproved account, with no matching change ticket, or against an unvalidated
    image) signals either an out-of-process recovery or an adversary abusing restore tooling; a clean
    result confirms an authorized, auditable execution chain. Aligns with the Eradication & Recovery procedures
    in the CISA Incident & Vulnerability Response Playbooks. References: [CISA Incident & Vulnerability
    Response Playbooks](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days; pivot to the restore drill/incident window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let restore = EventID==4688 where Image in approved_restore_tools;\nfor r in restore:\n  if\
      \ r.account not in approved_operators OR not exists(change_ticket matching r.time)\n     OR r.image_ref\
      \ not in validated_golden_images:\n    alert('unauthorized restore execution', r)"
- question: Was any restored asset reconnected to production before a passing integrity verification and
    a passing required-service check were both recorded for it?
  context: 'Returning a host to production before validation risks reintroducing a compromised or non-functional
    system into the environment. This rule gates reconnection: it alerts on any network reconnection of
    a restored asset that precedes a recorded passing validation (both integrity verification and required-service
    checks). A positive result (reconnection observed in conn.log/network telemetry with no prior passing
    validation record) is a process-control failure that could re-expose the network; a clean result confirms
    validation-before-reconnect discipline. Aligns with the verify-before-reconnect requirements of the
    CISA Incident & Vulnerability Response Playbooks. References: [CISA Incident & Vulnerability Response
    Playbooks](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days; pivot to the restore/return-to-production window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for asset in restored_assets:\n  reconnect = first(network_session(asset))\n  validation =\
      \ passing(integrity_check(asset)) AND passing(service_check(asset))\n  if reconnect.time < validation.time\
      \ OR validation is null:\n    alert('reconnected before passing validation', asset)"
- question: During restore drills, how long does each asset take from system boot (Windows Event ID 6005)
    until its required services are running (Windows Event ID 7036), and does any restore exceed two standard
    deviations from its asset-class baseline or breach the documented RTO/MTD?
  context: 'Restoration is only successful if the asset returns required services within the Recovery
    Time Objective. Measure the elapsed time from the Event Log service start (Windows Event ID 6005,
    a boot indicator) to the service-state-change events confirming required services are running (Windows
    Event ID 7036). Flag drills exceeding two standard deviations from the historical baseline for that
    asset class, and hard-fail any restore that breaches the documented RTO/Maximum Tolerable Downtime.
    A positive result (slow or RTO-breaching restore) indicates a recovery-capability shortfall; a clean
    result confirms timely service restoration. Metrics per NIST SP 800-34 Rev 1 and NIST SP 800-184.
    References: [NIST SP 800-34 Rev 1](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf);
    [NIST SP 800-184](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for drill in restore_drills:\n  boot = EventID==6005 (asset, drill)\n  svc_up = max(EventID==7036\
      \ 'running' for required_services)\n  t = svc_up.time - boot.time\n  if t > mean[class] + 2*std[class]\
      \ OR t > rto_mtd(asset): alert(asset, t)"
- question: For skewed or small-sample restore-time and image-age series, does the median-absolute-deviation
    modified Z-score exceed 3.5 for any observation?
  context: 'Restore-time and image-age samples are typically small and skewed, so a single slow restore
    can inflate the mean and standard deviation and mask future anomalies. Compute the MAD-based modified
    Z-score, Mz = 0.6745*(x - median)/MAD, and flag any |Mz| > 3.5. This robust threshold resists outlier
    contamination of the baseline. A positive result (|Mz| > 3.5) marks a genuine outlier restore time
    or image age worth investigating; a clean result keeps the baseline stable. Method per the Modified
    Z-Score for Anomaly Detection reference. References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series = restore_times OR image_ages (per asset_class)\nmed = median(series); MAD = median(|series\
      \ - med|)\nfor x in series:\n  Mz = 0.6745*(x - med)/MAD\n  if abs(Mz) > 3.5: alert('robust outlier',\
      \ x, Mz)"
- question: Within each asset class, which disk images fall above the 90th percentile of image age and
    should be scheduled for replacement to keep the repository ready for rapid restoration?
  context: 'Beyond per-asset freshness, the overall age distribution of images per asset class reveals
    systemic drift toward staleness. Compute the image-age distribution for each asset class and identify
    images older than the 90th percentile as replacement candidates. A positive result (images in the
    top decile of age) flags a proactive refresh need before those images become unfit for restoration;
    a clean result confirms the repository is being kept current. Aligns with the restore-readiness discipline
    in NIST SP 800-184. References: [NIST SP 800-184](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for cls in asset_classes:\n  ages = image_age[cls]\n  p90 = percentile(ages, 90)\n  for img\
      \ in images[cls]:\n    if img.age > p90: flag('replace candidate', img)"
- question: Over a rolling window, is the ratio of failed restore attempts (including integrity-check
    failures and aborted drills) to total attempts rising for any asset class, independent of restore
    timing?
  context: 'Restore readiness can degrade even when individual restores that succeed are fast: a climbing
    failure ratio is a distinct early-warning signal. Maintain per-asset-class counts of restore attempts,
    successes, and failures (counting integrity-check failures and aborted drills as failures), and treat
    a rising failure ratio over a rolling window as a recovery-readiness degradation signal separate from
    timing anomalies. A positive result (increasing failure ratio) points to corruption, tooling breakage,
    or process problems; a stable/low ratio confirms reliable recovery capability. Consistent with validate-recovery-capabilities
    guidance in NIST SP 800-184. References: [NIST SP 800-184](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-184.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days; rolling-window comparison
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for cls in asset_classes:\n  win = rolling_window(restore_events[cls])\n  fail_ratio = (integrity_fail\
      \ + aborted + failed) / total_attempts\n  if fail_ratio_now > fail_ratio_prev * 1.5 OR trend(fail_ratio)\
      \ increasing:\n    alert('recovery readiness degradation', cls, fail_ratio)"
- question: Does any restoration take materially longer than a regression model predicts from image size,
    hardware profile, and network-path features (latency/throughput from Zeek conn.log), indicating an
    infrastructure or process bottleneck?
  context: A learned baseline of expected time-to-restore lets you separate inherently large/slow restores
    from genuine bottlenecks. Train a regression model on image size, target hardware profile, and network-path
    features (latency and throughput derived from Zeek conn.log) to estimate expected time-to-restore,
    then flag restores that materially exceed the prediction. Surface the top-3 contributing features
    (e.g., image size, path throughput, target hardware class) in the alert so responders can act. A positive
    result (observed >> predicted) implicates a fixable infrastructure or process problem; a clean result
    confirms performance is in line with expectations for that workload.
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [image_size, hw_profile, conn_log.latency, conn_log.throughput]\npred = regressor.predict(features)\n\
      if observed_restore_time > pred + tolerance:\n  alert('restore bottleneck', asset, observed, pred,\
      \ top3_features(features))"
- question: When labeled restore failures are scarce, do any per-restore feature vectors (image size,
    duration, throughput, integrity pass/fail) score as anomalous under an Isolation Forest or One-Class
    SVM, and what features drive each anomaly?
  context: 'Labeled restore-failure data is usually too sparse for supervised detection, so use unsupervised
    anomaly scoring with explainability. Score each per-restore feature vector (image size, duration,
    throughput, integrity pass/fail) with an Isolation Forest or One-Class SVM and attach LIME-derived
    top-3 feature attributions to every alert so analysts understand why a restore was flagged. A positive
    result (high anomaly score) marks a restore that deviates from the normal population and warrants
    review; a clean result confirms the restore looks typical. Approach follows the unsupervised-with-explainability
    evaluation in ''Robust IoT security using isolation forest and one class SVM algorithms''. References:
    [Robust IoT security using isolation forest and one class SVM algorithms](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4688
  - Windows Event ID 6005
  - Windows Event ID 7036
  - Zeek conn.log
  - 'NAI: Golden Image Repository, Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = [image_size, duration, throughput, integrity_pass]\nscore = IsolationForest.decision_function(X)\
      \  # or OneClassSVM\nif score < anomaly_threshold:\n  alert('anomalous restore', asset, LIME_top3(X))"
- question: Before restoring, does the image's computed SHA-256 hash exactly match the authoritative golden
    measurement recorded in the signed manifest, and is the restore blocked on any mismatch?
  context: 'This is the core integrity gate that prevents restoring a corrupted or backdoored image. Before
    any restore, compute the candidate image''s SHA-256 and compare it byte-for-byte to the authoritative
    golden measurement stored in the signed manifest; alert and block on any mismatch. A positive result
    (hash mismatch) means the image differs from the known-good baseline and must not be used; a clean
    result cryptographically proves the image is the approved baseline. Verification of stored/running
    code against golden reference measurements per NIST SP 800-193, with storage integrity-verification
    guidance from NIST SP 800-209. References: [Platform Firmware Resiliency Guidelines (NIST SP 800-193)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);
    [Security Guidelines for Storage Infrastructure (NIST SP 800-209)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-209.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Image Hash/Checksum Manifest
  - 'NAI: Golden Image Repository, Backup and Recovery Infrastructure'
  range: Last 90 days; evaluate at each restore
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for img in images_presented_for_restore:\n  h = sha256(img)\n  golden = signed_manifest.lookup(img.id)\n\
      \  if h != golden.sha256:\n    block_and_alert('image hash mismatch', img, h, golden.sha256)"
- question: For images that fail exact SHA-256 comparison, what is their ssdeep (context-triggered piecewise)
    similarity to the baseline, and do image-to-image scores across an asset class reveal unexpected drift?
  context: 'An exact-hash failure alone does not tell you whether an image is slightly corrupted/tampered
    or entirely different. Compute a context-triggered piecewise (ssdeep) similarity score against the
    baseline for any image that fails exact SHA-256 comparison: a high-but-imperfect score (greater than
    0 and less than 100) indicates partial corruption or targeted tampering rather than a wholly different
    image, while comparing image-to-image ssdeep scores across an asset class surfaces unexpected drift.
    A positive result (partial similarity or unexpected drift) focuses forensic attention; a result near
    100 or near 0 clarifies whether the change is minor tampering or a full substitution. Method per Kornblum''s
    context-triggered piecewise hashing. References: [Identifying Almost Identical Files Using Context
    Triggered Piecewise Hashing, Kornblum](https://dfrws.org/sites/default/files/session-files/2006_USA_paper-identifying_almost_identical_files_using_context_triggered_piecewise_hashing.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Image Hash/Checksum Manifest
  - 'NAI: Golden Image Repository, Backup and Recovery Infrastructure'
  range: Last 90 days; evaluate on hash-mismatch events
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for img in hash_mismatch_images:\n  s = ssdeep_compare(img, baseline)\n  if 0 < s < 100: alert('partial\
      \ corruption/tamper', img, s)\ndrift = pairwise_ssdeep(images_in_class)\nif drift unexpected: alert('image\
      \ drift', class, drift)"
- question: Was there any write, overwrite, or delete (Windows Event ID 4663) against WORM/retention-locked
    golden images, or any access by a principal outside the approved backup-operator set?
  context: 'The golden-image repository must be immutable and tightly access-controlled so adversaries
    cannot poison the very images used to recover. Alert on any object-access event (Windows Event ID
    4663) representing a write, overwrite, or delete against WORM/retention-locked golden images, and
    on any access by a principal outside the approved backup-operator set. A positive result (a mutation
    attempt against immutable images or access by an unauthorized principal) is a strong tampering/insider
    indicator that endangers all future restores; a clean result confirms the repository''s immutability
    and access controls are intact. Requirement per NIST SP 800-209. References: [NIST SP 800-209](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-209.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Image Hash/Checksum Manifest
  - 'NAI: Golden Image Repository, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let acc = EventID==4663 where ObjectName in golden_image_repo;\nfor a in acc:\n  if a.AccessMask\
      \ in (WRITE, DELETE, APPEND) and a.Object is WORM_locked:\n    alert('mutation of immutable image',\
      \ a)\n  if a.SubjectAccount not in approved_backup_operators:\n    alert('unauthorized repo access',\
      \ a)"
- question: Over a rolling window, is the rate of hash/manifest verification failures rising for any repository
    or asset class, indicating corruption, tampering, or a broken manifest pipeline?
  context: 'A single integrity failure can be noise, but a rising failure rate is a systemic signal that
    the image supply is degrading. Track the rate of hash/manifest verification failures per repository
    and asset class over a rolling window and treat an increasing rate as a distinct alert from timing
    or coverage gaps. A positive result (climbing verification-failure rate) points to corruption, active
    tampering, or a broken manifest/signing pipeline; a stable/low rate confirms the integrity controls
    and pipeline are healthy. Aligns with NIST SP 800-209. References: [NIST SP 800-209](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-209.pdf).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Image Hash/Checksum Manifest
  - 'NAI: Golden Image Repository, Backup and Recovery Infrastructure'
  range: Last 90 days; rolling-window comparison
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for repo, cls in repositories:\n  win = rolling_window(verification_events[repo][cls])\n \
      \ fail_rate = manifest_or_hash_failures / total_verifications\n  if fail_rate_now > fail_rate_prev\
      \ * 1.5 OR trend increasing:\n    alert('integrity failure rate rising', repo, cls, fail_rate)"
- question: Does whole-system provenance around the image repository and restore tooling deviate from
    the authorized read-image-then-write-target pattern (e.g., unexpected processes reading or modifying
    golden images)?
  context: 'Modeling the repository''s behavior as a provenance graph catches subtle, multi-step tampering
    that simple access rules miss. Represent whole-system provenance around the image repository and restore
    tooling as evolving subgraphs and flag deviation from the authorized ''read image then write target''
    pattern, such as unexpected processes reading or modifying golden images, surfacing the contributing
    nodes and edges for triage. A positive result (anomalous subgraph) indicates a process touching golden
    images outside the sanctioned restore workflow; a clean result confirms only authorized provenance
    paths. Approach per KAIROS: Practical Intrusion Detection using Whole-system Provenance. References:
    [KAIROS: Practical Intrusion Detection using Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf);
    [code](https://github.com/ProvenanceAnalytics/kairos).'
  answer_sources:
  - Disk Image Repository Metadata
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Image Hash/Checksum Manifest
  - 'NAI: Golden Image Repository, Backup and Recovery Infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = provenance_subgraph(image_repo, restore_tooling)\nauthorized = read(image) -> write(target)\n\
      score = graph_anomaly(G, authorized_pattern)\nif score > threshold:\n  alert('anomalous repo provenance',\
      \ contributing_nodes_edges(G))"
- question: After restore, do the installed services, autoruns, and key file hashes on the rebuilt host
    match the approved image baseline, or is any item present that is not in the baseline (potential surviving
    or reintroduced persistence)?
  context: 'A restore is only trustworthy if the resulting host matches the approved baseline and carries
    no extra persistence. After restore, diff the installed services, autoruns, and key file hashes against
    the approved image baseline and alert on any item present that is not in the baseline. A positive
    result (extra service, autorun, or unexpected file hash) indicates persistence that survived the rebuild
    or was reintroduced during restore and demands re-eradication; a clean diff confirms the host matches
    the known-good baseline. Consistent with verify-before-reconnect requirements in the CISA Incident
    & Vulnerability Response Playbooks. References: [CISA Incident & Vulnerability Response Playbooks](https://www.cisa.gov/sites/default/files/publications/Federal_Government_Cybersecurity_Incident_and_Vulnerability_Response_Playbooks_508C.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek conn.log
  - 'NAI: Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days; pivot to the post-restore window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'baseline = approved_image_baseline(asset)

      current = collect(services, autoruns, file_hashes)  # EID 4688, Sysmon 1/11

      extras = current - baseline

      if extras: alert(''non-baseline item after restore'', asset, extras)'
- question: On the freshly restored host, does per-process write volume or write entropy spike, or do
    mass file modification/deletion or shadow-copy/backup destruction occur, indicating re-infection rather
    than a clean restore?
  context: 'A host that is reinfected immediately after restore betrays itself through abnormal disk I/O.
    Establish per-process write-volume and write-entropy baselines for the freshly restored host (using
    Sysmon Event ID 11 file-create and process telemetry), then flag sharp write-entropy increases, mass
    file modification/deletion, or shadow-copy/backup destruction. A positive result (entropy/volume spike
    or shadow-copy destruction) strongly suggests ransomware or other malware re-infection rather than
    a clean restore; a clean result confirms benign post-restore behavior. Uses the ransomware I/O statistics
    from UNVEIL. References: [UNVEIL](https://www.usenix.org/conference/usenixsecurity16/technical-sessions/presentation/kharaz).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Zeek conn.log
  - 'NAI: Critical Asset Subnets, Backup and Recovery Infrastructure'
  range: Last 90 days; pivot to the immediate post-restore window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for proc on restored_host:\n  w_vol = write_bytes(proc); w_ent = mean_write_entropy(proc)\n\
      \  if w_ent > baseline_entropy + k*std OR mass_delete(proc)\n     OR vssadmin/backup_destruction(proc):\n\
      \    alert('possible re-infection', restored_host, proc)"
- question: Does a Random-Forest classifier over multi-scale per-process I/O features (files read/written/renamed,
    fraction of files touched, file-type coverage, average write entropy) confirm the restored filesystem
    behaves like a clean system, or does it detect anomalous or incomplete-restore behavior?
  context: 'Beyond simple thresholds, a trained classifier can confirm the restored filesystem matches
    expected clean behavior and catch incomplete restores. Apply a Random-Forest classifier over multi-scale
    per-process I/O features (files read, written, and renamed; fraction of files touched; file-type coverage;
    average write entropy) and report the top contributing features with each alert. A positive result
    (classified anomalous) indicates either re-infection or an incomplete/partial restore that did not
    fully reconstitute the host; a clean classification confirms the restored filesystem behaves as expected.
    Following ShieldFS: A Self-healing, Ransomware-aware Filesystem. References: [ShieldFS: A Self-healing,
    Ransomware-aware Filesystem](https://conand.me/publications/continella-shieldfs-2016.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
