name: 'D3-RDI: Restore Disk Image'
id: 89894044-adef-4f22-9d48-d34663f73f9d
description: 'Investigate how effectively critical systems can be restored from a known-good disk image
  during remediation, and confirm that the restore process is trustworthy end to end. This playbook helps
  an analyst verify three things across the Restore tactic: (1) that every critical asset has a current,
  approved golden image and that restore drills/incidents actually rebuild the host from a validated image
  via authorized tooling, return required services, and meet integrity and Recovery-Time/Recovery-Point
  objectives; (2) that each image presented for restoration cryptographically matches an authoritative
  known-good baseline and that the golden-image repository is immutable and access-controlled, so a corrupted
  or backdoored image can never be reintroduced; and (3) that the rebuilt host behaves like a clean system
  afterward and does not re-exhibit the malicious activity that prompted the rebuild. The questions combine
  deterministic symbolic-logic checks (image coverage/freshness, hash/manifest verification, repository
  immutability, authorized execution chain, validation gating, post-restore baseline diffing), statistical
  baselining (boot-to-service timing, modified Z-score robust thresholds, image-age distribution, restore
  success/failure rate, integrity-failure rate, post-restore I/O volume and entropy), and machine-learning
  techniques (restore-delay regression, anomaly scoring with explainability, provenance-graph monitoring
  of the repository, and clean-versus-anomalous restored-filesystem classification) to distinguish a healthy,
  defensible restore from one that is slow, incomplete, tampered, or silently reinfected.'
type: technique
related:
- tactic_id: D3-R
  tactic_name: Restore
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
