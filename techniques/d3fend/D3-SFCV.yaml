name: 'D3-SFCV: Stack Frame Canary Validation'
id: ecd5fd7d-da1d-4c06-982c-c55c4bacd8d7
description: This playbook helps an analyst investigate whether stack frame canary protections are present,
  effective, and actually firing across critical C/C++ applications, and whether attackers are attempting
  or succeeding at memory-corruption attacks against them. Stack canaries produce high-fidelity, deterministic
  crash artifacts when a contiguous stack overwrite is caught at a function epilogue - on Windows the
  STATUS_STACK_BUFFER_OVERRUN exception (0xC0000409) via the /GS __fastfail path, and on Linux/macOS the
  libc '*** stack smashing detected ***' message with SIGABRT from __stack_chk_fail. Because canaries
  are routinely defeated by information leaks, write-what-where / direct overwrites that skip the canary,
  and SEH abuse, this playbook layers deterministic crash-detection rules, build-time verification that
  protections are compiled into shipped binaries, hardware shadow-stack (Intel CET) telemetry, statistical
  crash bucketing and frequency baselining, anomalous inbound-payload detection, and machine-learning
  analysis of control-flow traces, ROP gadget chains, and network flows. Use it to confirm canary coverage,
  distinguish failed exploitation (a defended target) from successful bypass (an undefended or evaded
  target), and surface zero-day attempts, fuzzing pressure, and hardening regressions against critical
  and internet-facing software.
type: technique
related:
- tactic_id: D3-H
  tactic_name: Harden
