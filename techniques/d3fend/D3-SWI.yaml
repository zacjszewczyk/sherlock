name: 'D3-SWI: Software Inventory'
id: 39cf158d-42aa-4d2f-a77b-05d1f1bee462
description: 'This playbook helps an analyst validate and investigate the organization''s software inventory
  by reconciling authoritative approved-software baselines against what is actually installed and executing
  across the environment. It draws on multiple evidence sources: the approved software baseline exported
  from eMASS/SSP authorization packages, comprehensive software discovery from ACAS active vulnerability
  scans, endpoint process-creation telemetry (Windows Event ID 4688), and Windows Installer service events
  (Event ID 11707/11708). The investigation focuses on detecting unauthorized or unmanaged software, end-of-life
  and unpatched versions, discovery blind spots and coverage gaps, and anomalous installation or execution
  patterns that could indicate adversary tooling, commodity malware, or insider activity. Each line of
  inquiry pairs a hard symbolic-logic allowlist rule with statistical prevalence/frequency baselining
  and explainable machine-learning classification so analysts can triage findings against the configuration-management
  baseline (NIST SP 800-128, CM-8/CM-7) with defensible, granular evidence.'
type: technique
related:
- tactic_id: D3-AI
  tactic_name: Asset Inventory
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does every executable observed running or installed on each host appear on the authoritative
    approved-software allowlist exported from the system's eMASS/SSP authorization package?
  context: 'Asset Inventory depends on a trustworthy picture of what software is authorized to exist in
    the architecture. Export the approved software inventory from the relevant eMASS authorization package
    and treat it as the authoritative allowlist, per the reconcile-to-baseline workflow of [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf)
    and the unauthorized-component detection mandate of CM-8(3)/CM-7 in [NIST SP 800-53r5](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf).
    Normalize both the allowlist and observed software to common identifiers ([SWID tags](https://nvlpubs.nist.gov/nistpubs/ir/2016/NIST.IR.8060.pdf),
    [CPE names](https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir7695.pdf)) so records join cleanly,
    then diff the allowlist against software seen in Windows Event ID 4688 and agent inventory. Any executable
    or title absent from the allowlist is a positive finding and should alert: it may be an approved tool
    that was never documented (an inventory gap) or genuinely unauthorized software such as adversary
    tooling, dual-use utilities, or commodity malware. A negative result (full match) confirms inventory
    fidelity. Keep this as a hard rule even after layering statistical and ML methods.'
  answer_sources:
  - eMASS software inventory reports
  - System Security Plan (SSP) approved software lists
  - 'NAI: Specific system authorization packages within eMASS.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'observed = dedup(processes from EventID=4688, agent_inventory) | normalize to CPE/SWID

      allowlist = import eMASS_approved_software | normalize to CPE/SWID

      alert where observed.cpe NOT IN allowlist.cpe'
- question: Is the rate or volume of executables that fail to match the approved allowlist rising abnormally
    for any host role or OU, and are any hosts or eMASS exports stale enough to create coverage gaps?
  context: 'Beyond binary matching, the trend of allowlist mismatches reveals emerging problems. Measure
    the rate of observed executables absent from the approved list, segmented by host role and OU, and
    trend it over time, applying prevalence/rarity scoring so rare-on-fleet titles rank first (roughly
    99.7% of threats are rare) per [Microsoft frequency analysis](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    and [F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/). Track Volume
    (distinct unauthorized titles per host/role), Frequency (new-mismatch count per day), and State as
    a distinct failure signal: hosts that have not reported inventory within the expected cycle and stale
    eMASS exports indicate coverage gaps, not compliance. Derive thresholds from your own 30-day baseline
    (for example, alert when daily mismatches exceed mean+3σ for the OU). A positive result is a spike
    in mismatches or a drop in reporting coverage; both warrant investigation as either an uncontrolled
    rollout or a blind spot an adversary could exploit.'
  answer_sources:
  - eMASS software inventory reports
  - System Security Plan (SSP) approved software lists
  - 'NAI: Specific system authorization packages within eMASS.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per OU,host_role: daily_mismatch = count(observed NOT IN allowlist)

      baseline = mean+3*stddev(daily_mismatch over trailing 30d)

      alert where daily_mismatch > baseline OR host.last_inventory_age > expected_cycle

      OR eMASS_export.age > expected_cycle | rank by fleet_rarity asc'
- question: For each newly observed piece of software, does a trained classifier predict it is approved,
    miscategorized, or unauthorized, and which features (low prevalence, unsigned, rare parent) drive
    that prediction?
  context: Allowlist diffs produce volume that is hard to triage manually. Train a classifier on executable
    path, signer, fleet prevalence, parent process, host role, and prior approval outcomes to estimate
    whether newly observed software is approved, miscategorized, or unauthorized, then validate high-risk
    predictions. Use prevalence/clustering features as in [Microsoft frequency analysis](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    so rare, anomalous software surfaces. Critically, every alert must surface the top-3 contributing
    features (for example, low prevalence, unsigned binary, rare parent process) in the alert text rather
    than a bare score, so analysts can triage against the [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf)
    baseline. A high unauthorized probability with explanatory features pointing to evasion (unsigned,
    rare parent, low prevalence) is a strong lead for adversary or malware activity; a confident 'approved'
    with sensible features can be deprioritized.
  answer_sources:
  - eMASS software inventory reports
  - System Security Plan (SSP) approved software lists
  - 'NAI: Specific system authorization packages within eMASS.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [exe_path, signer, fleet_prevalence, parent_process, host_role, prior_approval]

      score = classifier.predict(features)  # approved | miscategorized | unauthorized

      emit alert where score==unauthorized with top3_feature_contributions(features)'
- question: What software is identified across all managed IP space by authenticated ACAS discovery scans
    and SNMP MIB polling, and which discovered titles or versions are end-of-life or unpatched?
  context: A comprehensive inventory must cover assets that endpoint agents may miss. Schedule regular
    authenticated ACAS discovery scans across all defined segments and extract software identity from
    open ports, service banners, and version indicators using signature matching ([Nmap service/version
    detection](https://nmap.org/book/vscan.html)), supplemented by application-layer [SNMP](https://www.rfc-editor.org/rfc/rfc1157.txt)
    polling of installed-software MIBs (hrSWInstalled, sysDescr). Normalize results to [CPE names](https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir7695.pdf)
    and load them into the master inventory, flagging titles and versions that are end-of-life or unpatched
    per [NIST SP 800-40r4](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-40r4.pdf).
    A positive finding is the discovery of unmanaged, unauthorized, or vulnerable software on a host;
    this both completes the Asset Inventory picture and highlights exposure that a sophisticated external
    actor could target for initial access or persistence.
  answer_sources:
  - ACAS scan results
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for host in all_segments:\n  banners = authenticated_ACAS_scan(host).service_versions\n  mib\
      \ = snmp_poll(host, hrSWInstalled, sysDescr)\n  sw = normalize_to_cpe(banners + mib)\n  upsert master_inventory(sw)\n\
      \  alert where sw.version is EOL or unpatched (per 800-40r4)"
- question: Do CPE-normalized software counts from active scans agree with passive and agent-based sources
    by subnet and role, or has coverage dropped or scan-failure state risen enough to indicate blind spots?
  context: 'Active scans alone can lie by omission. Compare CPE-normalized software counts and product
    families from active scans against passive ([p0f](https://lcamtuf.coredump.cx/p0f3/)) and agent ([osquery](https://osquery.readthedocs.io/en/stable/))
    sources by subnet and role, alerting when coverage drops or discrepancy rates rise beyond recent baselines,
    using prevalence scoring per [F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/).
    Profile failure explicitly: track scan State (hosts unreachable, authentication-failed, scan-timed-out)
    as a distinct signal of blind spots rather than treating missing software as absence. Derive per-subnet
    thresholds (for example, alert when the authenticated-scan success rate falls below the trailing 7-day
    median). A positive result is a subnet where the three sources diverge or scan success collapses;
    these are exactly the places where unauthorized software or a foothold could hide undetected.'
  answer_sources:
  - ACAS scan results
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per subnet,role: active=cpe_count(ACAS), passive=cpe_count(p0f), agent=cpe_count(osquery)

      discrepancy = abs(active-agent)/agent

      scan_success = scanned_ok / scan_attempts

      alert where discrepancy > baseline OR scan_success < trailing_7d_median

      track state counts: unreachable, auth_failed, timed_out'
- question: Which network segments are predicted to have incomplete software discovery, and what features
    (scan cadence, auth-failure history, low passive density) drive each blind-spot prediction?
  context: Prioritizing rescans by hand wastes effort. Train a model on segment, scan cadence, passive-observation
    density, auth-failure history, and prior discrepancy outcomes to predict where discovery is likely
    incomplete and prioritize rescans. Corroborate with passive packet/flow classification of OS and software
    ([nPrint/nPrintML](https://arxiv.org/pdf/2008.02695); [Sivanathan et al.](https://www2.ee.unsw.edu.au/~vijay/pubs/jrnl/18tmc.pdf))
    for hosts that resist authenticated scanning. Surface the top-3 features driving each blind-spot prediction
    in the output for analyst review. A high blind-spot score on a segment that also carries sensitive
    systems is a priority for targeted rescanning, because gaps in the Asset Inventory are the seams a
    sophisticated actor exploits to operate unseen.
  answer_sources:
  - ACAS scan results
  - 'NAI: All managed IP address spaces and subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [segment, scan_cadence, passive_density, auth_failure_history, prior_discrepancy]

      blindspot_score = model.predict(features)

      rank segments by blindspot_score desc

      for top segments: corroborate via passive nPrint/flow classification

      emit with top3_feature_contributions(features)'
- question: What is the complete catalog of unique process names and executable paths executed across
    endpoints (Windows Event ID 4688 plus agent telemetry), and which of them are absent from the approved
    baseline?
  context: Execution telemetry reveals software that static inventories miss, including portable and fileless
    tools. Aggregate all unique process names and executable paths from Windows Event ID 4688 across hosts
    to build an observed software catalog, supplementing with first-party agent SQL over the programs/processes
    tables ([osquery](https://osquery.readthedocs.io/en/stable/)). Normalize to [CPE names](https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir7695.pdf)/[SWID
    tags](https://nvlpubs.nist.gov/nistpubs/ir/2016/NIST.IR.8060.pdf) identity and reconcile execution
    activity against the approved baseline per [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf),
    alerting on any executable not on the allowlist. A positive finding is execution of software that
    no authorization package covers; this is the clearest signal of unmanaged tooling, living-off-the-land
    binaries, or malware running in the environment, and it directly enriches the Asset Inventory with
    what is actually used rather than merely installed.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'catalog = dedup(process_name, exe_path from EventID=4688) + osquery(programs,processes)

      catalog = normalize_to_cpe_swid(catalog)

      alert where catalog.cpe NOT IN approved_baseline.cpe'
- question: For each executable, how prevalent is it across the fleet, how rare is it relative to peers,
    and do its parent-child launch chains or execution frequency deviate from role-specific baselines?
  context: Rarity and abnormal launch behavior are durable indicators of malicious or unmanaged software.
    For each unique executable path compute Volume (count of distinct executables per host/role) and prevalence
    as the percentage of hosts where it runs, deriving a rarity score and ranking bottom-percentile (for
    example <1%) software for review, per [Microsoft frequency analysis](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    and [F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/). Establish role-specific
    baselines for normal parent-child relationships and Frequency (executions/min per binary) so uncommon
    software and unexpected launch chains are highlighted; treat failed/blocked process launches as a
    distinct State signal. Tune thresholds to local baselines rather than fixed values. A positive result
    is a rare binary, an anomalous parent (for example Office spawning a shell), or a burst of blocked
    launches; all are high-value leads for triage in the Asset Inventory context.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per exe_path: prevalence = distinct_hosts_running / total_hosts

      rarity = 1 - prevalence ; rank where prevalence < 1%

      per host_role: baseline parent->child pairs and exec_freq/min

      alert on rare exe, parent_child NOT IN baseline, or blocked_launch spikes'
- question: When executables are clustered by path, signer, host distribution, parent process, and command
    line, which outliers fall outside common software families, and what features make them anomalous?
  context: Clustering separates the bulk of normal software from the long tail worth scrutiny. Train a
    clustering/classification model on executable path, signer, host distribution, parent process, and
    command-line features to group software into common versus anomalous families and prioritize cluster
    outliers; packet/flow classifiers ([nPrint/nPrintML](https://arxiv.org/pdf/2008.02695)) can identify
    software for network-only assets. Each flagged outlier must report the top-3 contributing features
    (for example low host prevalence, unsigned binary, anomalous parent) in the alert text. An outlier
    whose explanatory features point to evasion is a strong candidate for adversary tooling or malware;
    clusters of well-known signed software can be deprioritized, keeping the Asset Inventory review focused.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [exe_path, signer, host_distribution, parent_process, cmdline]

      clusters = model.fit(features)

      outliers = points far from cluster centroids

      emit outliers with top3_feature_contributions(features)'
- question: For each Windows Installer event (Event ID 11707 success / 11708 failure), is the installed
    Product Name and version on the centrally managed allowlist, and is the version current rather than
    end-of-life or unpatched?
  context: Installation events capture software at the moment it enters a host. Monitor endpoints for
    Windows Installer events (Event ID 11707 install-success; 11708 install-failure), extract the Product
    Name and version, normalize to [CPE names](https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir7695.pdf)/[SWID
    tags](https://nvlpubs.nist.gov/nistpubs/ir/2016/NIST.IR.8060.pdf), and validate each install against
    the centrally managed allowlist (CM-8/CM-7, [NIST SP 800-53r5](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf);
    [NIST SP 800-128](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-128.pdf)). Alert
    on unapproved titles and on installs of end-of-life/unpatched versions per [NIST SP 800-40r4](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-40r4.pdf).
    A positive finding is an install of software not on the allowlist or a vulnerable version; catching
    it at install time lets the Asset Inventory stay current and lets responders act before unauthorized
    or vulnerable software is exercised by an attacker.
  answer_sources:
  - Windows Event ID 11707
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on EventID in (11707,11708):\n  product = normalize_to_cpe_swid(event.ProductName, event.Version)\n\
      \  alert where product NOT IN allowlist\n  alert where product.version is EOL or unpatched (per\
      \ 800-40r4)"
- question: Is any software title being installed at an anomalously high frequency or volume relative
    to its historical baseline, or is there a spike in failed installs (Event ID 11708) or retry loops
    indicating tampered or unapproved deployment?
  context: 'Sudden installation patterns can reveal an uncontrolled or malicious rollout. Maintain installation
    Frequency statistics per title by day, host group, and business unit, and Volume (distinct titles
    installed) per host, alerting when a product becomes anomalously popular relative to historical baselines
    (prevalence shift) per [Microsoft frequency analysis](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    and [F-Secure prevalence](https://blog.f-secure.com/whats-the-deal-with-prevalence/). Profile install
    State explicitly: a spike in failed installs (Event ID 11708) or repeated retry loops is a distinct
    signal of unapproved or tampered deployment. Track the version-state distribution over time per [NIST
    SP 800-40r4](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-40r4.pdf); derive spike
    thresholds from each unit''s trailing baseline. A positive result is a title that suddenly proliferates
    or a cluster of install failures/retries; both merit investigation as potential adversary deployment,
    worm-like spread, or a botched (and risky) change.'
  answer_sources:
  - Windows Event ID 11707
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per title,host_group,business_unit: daily_installs from EventID=11707

      baseline = trailing mean+3*stddev

      alert where daily_installs > baseline (prevalence shift)

      alert where failed_installs(11708) or retry_loops spike vs baseline'
- question: Does a time-series/classification model predict that an observed software rollout is suspicious
    spread rather than planned deployment, and which features (abnormal install velocity, high failure
    rate, low title prevalence) drive that judgment?
  context: Distinguishing legitimate mass deployment from malicious spread requires modeling cadence over
    time. Train a time-series/classification model on installation cadence, host role, software family,
    success/failure ratio, and prior approval outcomes to predict whether an observed rollout is planned
    deployment or suspicious spread, escalating high-risk campaigns; prevalence-shift features as in [Microsoft
    frequency analysis](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    drive scoring. Each escalation must surface the top-3 contributing features (for example abnormal
    install velocity, high failure rate, low title prevalence) in the alert text. A high suspicion score
    with features indicating atypical velocity and an unapproved, low-prevalence title is a strong indicator
    of adversary lateral deployment or self-propagating malware; a confident 'planned deployment' aligned
    with a known change window can be cleared, keeping Asset Inventory triage efficient.
  answer_sources:
  - Windows Event ID 11707
  - 'NAI: Insert site-specific NAI here'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [install_cadence_ts, host_role, software_family, success_fail_ratio, prior_approval]

      score = model.predict(features)  # planned | suspicious

      escalate where score==suspicious with top3_feature_contributions(features)'
