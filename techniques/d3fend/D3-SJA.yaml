name: 'D3-SJA: Scheduled Job Analysis'
id: 591f5799-6cca-40be-ad76-3581a2db2df1
description: Investigate potentially unauthorized use of job scheduling for persistence, privilege escalation,
  remote execution, and lateral movement across the enterprise. This playbook helps an analyst hunt and
  triage anomalous scheduled job activity by examining the source files, processes, destination files,
  run-as principals, triggers, and destination servers associated with scheduled jobs. It covers Windows
  Task Scheduler activity (creation, modification, deletion, and execution events with suspicious command
  lines, paths, run-as principals, or anomalous naming/volume/timing), WMI permanent event subscriptions
  used as trigger-based jobs (__EventFilter, __EventConsumer, __FilterToConsumerBinding in root\subscription
  that execute code on system events and survive reboots), and Unix/Linux scheduled jobs created via cron,
  at, or systemd timers (suspicious commands, paths, off-hours edits, and anomalous creation volume).
  It blends deterministic symbolic-logic detections, statistical baselining (entropy, volume spikes, periodicity,
  failure profiling), and machine learning (provenance-graph anomaly scoring, log-sequence modeling, isolation-forest
  outliers) so a SOC analyst can determine whether scheduled job activity is benign administration or
  malicious automation.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are scheduled tasks being created or modified on Windows hosts whose embedded action command
    line, executable path, or arguments match a watchlist of high-risk binaries, suspicious flags, or
    user-writable directories?
  context: Adversaries frequently abuse the Windows Task Scheduler (T1053.005) for persistence, privilege
    escalation, and remote/lateral execution. On task creation (Event ID 4698) or modification (4702)
    the Task Scheduler XML records the Actions/Command, Arguments, Triggers, and Principals. Parse that
    XML and compare the command line and executable path against a maintained watchlist of high-risk binaries
    and flags (e.g., powershell -enc, mshta, regsvr32 /s /u, certutil -urlcache, rundll32) and user-writable
    paths (C:\Users\Public\, C:\Windows\Temp\, %APPDATA%). A match strongly suggests a malicious or LOLBin-based
    task; include the creating account, host, task name, and full command line so the analyst can confirm
    whether the task is sanctioned. A negative result (no watchlist hit) lowers suspicion but does not
    clear novel/obfuscated payloads, which other questions address. This supports the Detect tactic by
    surfacing unauthorized job scheduling at the moment of creation.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, creating_account, task_name, action_command, action_path\nFROM windows_events\n\
      WHERE event_id IN (4698, 4702)\n  AND ( action_command MATCHES_ANY watchlist_high_risk_cmds  --\
      \ powershell -enc, mshta, regsvr32 /s /u, certutil -urlcache, rundll32\n     OR action_path  MATCHES_ANY\
      \ user_writable_paths )      -- C:\\Users\\Public\\, C:\\Windows\\Temp\\, %APPDATA%\n| ALERT include=[creating_account,\
      \ host, task_name, action_command]"
- question: Is the legacy at.exe utility being executed anywhere in the environment to schedule jobs,
    and if so by which account and against which host?
  context: at.exe is rarely used in modern Windows environments, so any process creation of at.exe is
    high-signal for adversary scheduling per CAR-2013-05-004. It can be used for persistence, remote execution
    (at \\host), or privilege escalation. Detect it via process-creation telemetry (Event ID 4688 / Sysmon
    Event ID 1), then correlate with creation of At#.job artifacts and identify the responsible account.
    A hit warrants immediate triage of the scheduled command and target host; legitimate use is unusual
    and should still be validated against change records. This supports the Detect tactic by catching
    a low-prevalence, high-fidelity adversary behavior.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, account, process_path, command_line, parent_process\nFROM process_creation\n\
      WHERE event_id IN (4688, 1)\n  AND lower(process_name) = 'at.exe'\n| JOIN file_events ON file_name\
      \ LIKE 'At%.job'\n| ALERT include=[account, host, command_line, target_host]"
- question: Are scheduled tasks being created that run as SYSTEM, target a remote host, or request the
    highest available privileges from a non-administrative account?
  context: schtasks.exe /create (or ITaskService/COM equivalents) that specify /ru SYSTEM indicate privilege
    escalation, and /s <remote-host> indicate lateral movement (CAR-2013-08-001, T1053.005). Equally suspicious
    are tasks whose Principal RunLevel is HighestAvailable created by an account that is not administrative
    or SYSTEM. Surface the creating account, target host, and run-as principal so the analyst can assess
    whether escalation/lateral movement is occurring. A match is high-priority; a benign explanation requires
    a corresponding administrative change ticket. This supports the Detect tactic by tying task run-as
    context to escalation and lateral-movement intent.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, creating_account, target_host, run_as_principal, run_level, command_line\nFROM\
      \ process_creation\nWHERE process_name = 'schtasks.exe' AND command_line CONTAINS '/create'\n  AND\
      \ ( command_line CONTAINS '/ru SYSTEM'\n     OR command_line CONTAINS '/s '\n     OR (run_level\
      \ = 'HighestAvailable' AND creating_account NOT IN admin_or_system_accounts) )\n| ALERT include=[creating_account,\
      \ target_host, run_as_principal]"
- question: Which local scheduled tasks are being created by non-SYSTEM accounts, and do their parent
    process, arguments, integrity level, and code signature indicate unauthorized scheduling?
  context: Following the Elastic 'Local Scheduled Task Creation' EQL pattern, alert on schtasks.exe /create
    initiated by non-SYSTEM accounts (exclude S-1-5-18) and triage by parent process, command-line arguments,
    integrity level, and the initiating process's code signature. Maintain an allowlist of known software-install
    task creators to suppress benign noise rather than disabling the rule. A new task created by a user-context,
    unsigned, or unusual parent process is suspicious; a signed installer parent is more likely benign.
    This supports the Detect tactic by separating routine software installs from user-context persistence.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, user_sid, parent_process, command_line, integrity_level, code_signature\nFROM\
      \ process_creation\nWHERE process_name = 'schtasks.exe' AND command_line CONTAINS '/create'\n  AND\
      \ user_sid != 'S-1-5-18'\n  AND parent_process NOT IN allowlist_install_task_creators\n| ALERT include=[parent_process,\
      \ command_line, integrity_level, code_signature]"
- question: When tasks execute, are the scheduler-spawned child processes anomalous — running from user-writable
    directories, using LOLBins with uncommon flags, or representing rare parent->child pairs?
  context: Correlate newly created/modified tasks (Event ID 4698/4702) with subsequent process creations
    (4688 / Sysmon 1) whose parent is taskeng.exe, svchost.exe -k netsvcs (Schedule), or wmiprvse.exe.
    Flag executions from user-writable directories or living-off-the-land binaries with uncommon flags,
    and apply the rare-parent baseline of CAR-2014-11-002 (Outlier Parents of Cmd) to scheduler parent->child
    pairs. An execution chain that runs unusual children from temp/public paths is high-signal for a malicious
    task firing; common, well-known children are likely benign. This supports the Detect tactic by validating
    what a scheduled task actually does at runtime.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, parent_process, child_process, child_path, command_line\nFROM process_creation\n\
      WHERE parent_process IN ('taskeng.exe','svchost.exe','wmiprvse.exe')\n  AND ( child_path MATCHES_ANY\
      \ user_writable_paths\n     OR child_process MATCHES_ANY lolbins_with_uncommon_flags )\n| RARE_PAIR\
      \ parent_process, child_process OVER fleet  -- CAR-2014-11-002 outlier parents\n| ALERT include=[parent_process,\
      \ child_process, command_line]"
- question: Do any scheduled task names or action command-line arguments exhibit abnormally high Shannon
    entropy or length, suggesting obfuscated or randomized malware-generated tasks?
  context: Compute Shannon entropy and length for task names and action command-line arguments parsed
    from creation/modification events, applying entropy scoring. Maintain per-host/per-environment baselines
    and flag tasks above the 95th percentile for entropy or with rare character distributions, deriving
    the threshold from your own fleet distribution rather than a fixed constant. High-entropy, randomized
    names/arguments are characteristic of automatically generated malicious tasks; include the top-3 highest-entropy
    tokens in the alert to speed triage. Normal admin tasks usually have low-entropy, human-readable names.
    This supports the Detect tactic by exposing obfuscation that signature watchlists miss.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'STATS p95_entropy = percentile(shannon_entropy(token), 95) OVER fleet

      FROM windows_events

      WHERE event_id IN (4698, 4702)

      | EVAL ent = shannon_entropy(task_name + action_args)

      | WHERE ent > p95_entropy OR rare_char_distribution(task_name)

      | ALERT include=[host, task_name, top3_high_entropy_tokens]'
- question: Are there abnormal spikes or change-points in the per-host rate of scheduled task creation/modification
    that indicate automated persistence deployment?
  context: Build a rolling per-host hourly series of task create/modify counts (Event ID 4698/4702) and
    detect spikes with seasonal time-series decomposition (e.g., series_decompose_anomalies, tunable score
    1.5-3.0) and change-point detectors (CUSUM/PELT/Bayesian online CPD). Alert on z-score > 3sigma or
    detected change points, capturing the volume (count) and timing of automated persistence deployment.
    A sudden burst of task creation on a host that historically creates few tasks is high-signal for scripted/malware-driven
    persistence; a gradual, scheduled change may reflect patching. This supports the Detect tactic by
    catching mass or bursty scheduling that single-event rules overlook.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SERIES count BY host, bin(time, 1h)

      FROM windows_events WHERE event_id IN (4698, 4702)

      | DECOMPOSE_ANOMALIES score>=3.0

      | OR CHANGEPOINT(method=PELT)

      | WHERE zscore > 3

      | ALERT include=[host, window_count, window_start]'
- question: Do scheduler-spawned processes generate new, low-jitter periodic outbound network activity
    that resembles beaconing and did not exist in the prior baseline?
  context: 'For processes/network connections spawned by the scheduler, measure cadence regularity (dominant
    period, inter-arrival distribution, coefficient of variation, autocorrelation). Flag newly appearing,
    low-jitter periodic outbound activity (volume: bytes per interval; frequency: connections/min) from
    scheduled jobs that did not exist in the prior baseline window. Regular, low-variance beaconing tied
    to a scheduled job is a strong indicator of C2 driven by a persistence mechanism; high-jitter, human-driven
    traffic is less suspicious. This supports the Detect tactic by linking scheduled execution to covert
    command-and-control cadence.'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "STATS dominant_period, coeff_var, bytes_per_interval, conns_per_min\n  BY scheduler_child_proc,\
      \ dest_ip\nFROM network_connections\nWHERE parent_chain CONTAINS scheduler_service\n| WHERE coeff_var\
      \ < 0.1 AND dest_ip NOT IN prior_baseline_peers\n| ALERT include=[scheduler_child_proc, dest_ip,\
      \ dominant_period]"
- question: Are scheduled tasks or their spawned child processes showing repeated failures (bad last-run
    results, blocked connections, NXDOMAIN/404 on payload fetch) that suggest misconfigured or partially-blocked
    malicious jobs?
  context: 'Track per-task State signals: last-run result codes (Event ID 4699/4700/4701 lifecycle and
    Task Scheduler operational results) and the success/failure rate of scheduler-spawned child processes
    and their network connections (blocked connections, NXDOMAIN/404 on payload fetch). Profile error/failure
    rates as a distinct signal; repeated failed scheduler executions or failed payload pulls are high-signal
    for misconfigured or partially-blocked malicious tasks (T1053.005). A task that repeatedly fails to
    reach a download host may be malware whose infrastructure is down or blocked; consistent success on
    benign internal endpoints is expected for legitimate jobs. This supports the Detect tactic by surfacing
    failing automation that defenders may otherwise ignore.'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "STATS fail_rate = avg(result_code != 0), nxdomain_ct, blocked_conn_ct, http_404_ct\n  BY host,\
      \ task_name\nFROM windows_events JOIN network_connections, dns_logs\nWHERE event_id IN (4699,4700,4701)\
      \ OR parent_chain CONTAINS scheduler_service\n| WHERE fail_rate > 0.5 OR nxdomain_ct > 0 OR blocked_conn_ct\
      \ > 0\n| ALERT include=[host, task_name, fail_rate, nxdomain_ct]"
- question: Does the causal provenance subgraph rooted at scheduler processes (task -> spawned process
    -> file/registry/network) contain anomalous nodes or edges when scored with provenance graph learning?
  context: Model the causal subgraph rooted at scheduler processes and score anomalous nodes/edges with
    provenance graph learning (KAIROS temporal-GNN edge scoring with attack-graph reconstruction, ThreaTrace
    node-level GraphSAGE localization, MAGIC self-supervised masked-graph embeddings, PROGRAPHER snapshot
    embeddings). Surface the top-3 contributing nodes/edges (e.g., unusual child binary, rare write path,
    anomalous outbound peer) in the alert. Run ML in parallel with the deterministic rules above. A high
    anomaly score on a scheduler-rooted chain points to a novel or stealthy attack the rules may miss;
    a low score increases confidence the chain is benign. This supports the Detect tactic by catching
    previously unseen scheduled-job attack patterns.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'BUILD provenance_graph ROOT scheduler_processes EDGES [spawn, file_write, reg_write, net_conn]

      | SCORE nodes,edges WITH temporal_gnn_model  -- KAIROS / ThreaTrace / MAGIC / PROGRAPHER

      | WHERE anomaly_score > threshold

      | ALERT include=[host, top3_contributing_nodes_edges]'
- question: Do sequences of task/scheduler log events deviate from the learned normal order and parameters
    (create -> enable -> run -> child-spawn) as detected by an LSTM next-event model?
  context: Train an LSTM next-event model on normal sequences of task/scheduler log keys and parameters
    (e.g., create -> enable -> run -> child-spawn) and flag deviations (DeepLog). Report which predicted-vs-observed
    log key or parameter (run-as account, action path, trigger type) deviated to drive triage. An out-of-order
    or unexpected event in a task's lifecycle, or an unexpected run-as account/path, signals tampering
    or malicious scheduling; sequences matching the learned model are likely benign. This supports the
    Detect tactic by modeling normal scheduler behavior and flagging deviations.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL deeplog_lstm ON sequence(task_log_keys, params) PER task

      | PREDICT next_event

      | WHERE observed_event NOT IN top_k_predicted

      | ALERT include=[host, task_name, deviating_log_key, expected_vs_observed]'
- question: Which newly created tasks are statistical outliers when scored by an Isolation Forest over
    features like creator account, run-as account, trigger type/time, command path category, argument
    entropy, and creation time-of-day?
  context: Train an Isolation Forest on task features (creator account, run-as account, trigger type/time,
    command path category, command-line entropy, creation time-of-day), baselining benign tasks per environment.
    Score new tasks, escalate high anomaly scores for analyst review, and emit the top-3 contributing
    features (e.g., rare creator, high-entropy arguments, off-hours creation) in the alert. A task that
    combines several unusual attributes (rare creator + off-hours + high entropy) is a strong outlier
    worth review; tasks resembling the benign baseline are deprioritized. This supports the Detect tactic
    by holistically profiling tasks rather than matching a single field.
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4699
  - Windows Event ID 4700
  - Windows Event ID 4702
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL isolation_forest ON features[creator_acct, run_as_acct, trigger_type, trigger_time,\n\
      \  cmd_path_category, cmd_arg_entropy, creation_hour] BASELINE per_environment\n| SCORE new_tasks\n\
      | WHERE anomaly_score > threshold\n| ALERT include=[host, task_name, top3_contributing_features]"
- question: Are new WMI permanent event subscription components (__EventFilter, __EventConsumer, __FilterToConsumerBinding)
    being registered in root\subscription, especially CommandLineEventConsumer or ActiveScriptEventConsumer?
  context: WMI permanent event subscriptions act as trigger-based scheduled jobs that execute code on
    system events and survive reboots. Alert on creation of subscription components via Sysmon Event ID
    19 (WmiEventFilter), 20 (WmiEventConsumer), and 21 (WmiEventConsumerToFilter) and corresponding Microsoft-Windows-WMI-Activity/Operational
    entries. Treat any new CommandLineEventConsumer or ActiveScriptEventConsumer as high-signal, capturing
    the filter query, consumer command/script, and creating account. WMI subscriptions are a stealthy
    persistence mechanism rarely used by ordinary applications, so most new ones merit review; established,
    inventoried subscriptions are lower risk. This supports the Detect tactic by exposing fileless, trigger-based
    persistence.
  answer_sources:
  - Sysmon Event ID 19
  - Sysmon Event ID 20
  - Sysmon Event ID 21
  - Microsoft-Windows-WMI-Activity/Operational
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, creating_account, filter_query, consumer_type, consumer_command\nFROM sysmon_events\n\
      WHERE event_id IN (19, 20, 21)\n  OR source = 'Microsoft-Windows-WMI-Activity/Operational'\n| WHERE\
      \ consumer_type IN ('CommandLineEventConsumer','ActiveScriptEventConsumer')\n     OR event_id IN\
      \ (19,20,21)\n| ALERT include=[host, creating_account, filter_query, consumer_command]"
- question: Do the consumer actions of new WMI event subscriptions match the high-risk binary/script watchlist
    (encoded PowerShell, mshta, scripting engines, user-writable paths)?
  context: Inspect the consumer action of new subscriptions and match against the same high-risk binary/script
    watchlist used for scheduled tasks (encoded PowerShell, mshta, scripting engines, user-writable paths)
    per T1053.005 and WMI Offense/Defense/Forensics. Alert on matches with the full consumer text. A subscription
    whose consumer launches obfuscated PowerShell or a script from a temp/public path is almost certainly
    malicious persistence; a benign management subscription typically invokes signed, well-known tooling.
    This supports the Detect tactic by applying payload reputation to WMI consumers, not just task command
    lines.
  answer_sources:
  - Sysmon Event ID 19
  - Sysmon Event ID 20
  - Sysmon Event ID 21
  - Microsoft-Windows-WMI-Activity/Operational
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, creating_account, consumer_type, consumer_command\nFROM sysmon_events\nWHERE\
      \ event_id IN (20, 21)\n  AND ( consumer_command MATCHES_ANY watchlist_high_risk_cmds\n     OR consumer_command\
      \ MATCHES_ANY user_writable_paths )\n| ALERT include=[host, consumer_command]"
- question: Which WMI subscriptions (filter query + consumer hash) are low-prevalence across the fleet,
    appearing on only a few hosts?
  context: Maintain a fleet-wide inventory of WMI subscriptions (filter query + consumer hash) and flag
    low-prevalence subscriptions seen on few hosts, using the prevalence/outlier-baseline approach of
    CAR-2014-11-002. Rare subscriptions warrant review; report the count of hosts on which the subscription
    appears. A subscription present on a single or handful of hosts is far more likely to be attacker-planted
    than one deployed fleet-wide by management tooling. This supports the Detect tactic by using prevalence
    as a discriminator for stealthy WMI persistence.
  answer_sources:
  - Sysmon Event ID 19
  - Sysmon Event ID 20
  - Sysmon Event ID 21
  - Microsoft-Windows-WMI-Activity/Operational
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'STATS host_count = dcount(host) BY filter_query, consumer_hash

      FROM wmi_subscription_inventory

      | WHERE host_count <= rare_threshold

      | ALERT include=[filter_query, consumer_hash, host_count]'
- question: Does the process/file/network subgraph spawned by wmiprvse.exe from a subscription trigger
    score as anomalous under provenance graph learning?
  context: Score the process/file/network subgraph spawned by wmiprvse.exe from a subscription trigger
    with provenance graph learning (KAIROS, MAGIC), surfacing the top-3 anomalous nodes/edges, and run
    it alongside the deterministic Sysmon 19/20/21 rules. When a WMI subscription fires, wmiprvse.exe
    becomes the parent of the executed action; an anomalous downstream subgraph (rare child binary, unusual
    write path, anomalous outbound peer) indicates malicious trigger-based execution. A benign subgraph
    increases confidence the subscription is legitimate. This supports the Detect tactic by validating
    what WMI subscriptions actually execute at runtime.
  answer_sources:
  - Sysmon Event ID 19
  - Sysmon Event ID 20
  - Sysmon Event ID 21
  - Microsoft-Windows-WMI-Activity/Operational
  - 'NAI: All enterprise Windows endpoints and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'BUILD provenance_graph ROOT wmiprvse.exe EDGES [spawn, file_write, net_conn]

      | SCORE nodes,edges WITH temporal_gnn_model  -- KAIROS / MAGIC

      | WHERE anomaly_score > threshold

      | ALERT include=[host, top3_contributing_nodes_edges]'
- question: Are cron files or systemd timer units being created or modified, or are crontab/at/systemctl
    being executed, with job lines that fetch or decode payloads (curl|bash, wget, base64 -d, reverse-shell
    one-liners)?
  context: Monitor writes to crontab locations and timer units (/var/spool/cron/*, /etc/crontab, /etc/cron.d/*,
    /etc/cron.{hourly,daily,weekly,monthly}/*, ~/.config/systemd/user/*.timer, /etc/systemd/system/*.timer)
    and execution of crontab, at, and systemctl enable --now *.timer via auditd/FIM. Flag entries invoking
    shells/interpreters that fetch or decode payloads (curl|bash, wget, base64 -d, reverse-shell one-liners)
    per T1053.005. Capture the editing user, file, and full job line. A cron/timer entry that downloads
    and pipes code to a shell is high-signal for Linux persistence; routine system maintenance jobs are
    expected and can be allowlisted. This supports the Detect tactic by catching unauthorized Unix/Linux
    scheduled jobs at edit time.
  answer_sources:
  - Linux auditd (syscall/path)
  - Syslog (cron)
  - File integrity monitoring (crontab and /etc/cron.*)
  - systemd journal
  - 'NAI: All enterprise Linux/Unix servers and workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT host, user, file_path, job_line\nFROM auditd_fim\nWHERE file_path MATCHES_ANY ['/var/spool/cron/*','/etc/crontab','/etc/cron.d/*',\n\
      \      '/etc/cron.*/*','*/systemd/*.timer']\n  OR exec_comm IN ('crontab','at','systemctl')\n| WHERE\
      \ job_line MATCHES_ANY ['curl*|*bash','wget','base64 -d','/dev/tcp/']\n| ALERT include=[host, user,\
      \ file_path, job_line]"
- question: Are there abnormal spikes or change-points in per-host cron/timer edit volume that indicate
    automated persistence deployment on Linux/Unix hosts?
  context: Baseline per-host cron/timer edit counts and detect bursts/abrupt shifts with seasonal decomposition
    and change-point detection; alert on >3sigma spikes or detected change points (volume and timing of
    automated persistence). A burst of cron edits on a host that rarely changes its schedule suggests
    scripted or malware-driven persistence; gradual, planned changes are likely administrative. This supports
    the Detect tactic by catching mass cron/timer modification that single-event rules miss.
  answer_sources:
  - Linux auditd (syscall/path)
  - Syslog (cron)
  - File integrity monitoring (crontab and /etc/cron.*)
  - systemd journal
  - 'NAI: All enterprise Linux/Unix servers and workstations'
