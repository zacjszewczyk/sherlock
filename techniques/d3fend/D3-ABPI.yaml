name: 'D3-ABPI: Application-based Process Isolation'
id: caa0814b-6257-483d-b21e-5ee11236ffb3
description: Investigate the extent to which Application-based Process Isolation (D3-ABPI) is actually
  enforced across isolation-sensitive applications, and detect runtime breakdown of those boundaries.
  This playbook helps an analyst (1) audit whether applications that are expected to enforce intra-process
  and cross-process isolation — browsers running Site Isolation, document/PDF viewers, authentication
  components, and security tooling — are launching with their required hardening (Control Flow Guard,
  CET shadow stack, DEP, renderer sandbox tokens, and Cross-Origin Read Blocking), and (2) hunt for evidence
  that those boundaries have been bypassed via cross-process memory access, remote-thread injection, process
  hollowing, execution from unbacked memory, and control-flow/CET faults. It combines configuration/coverage
  auditing, deterministic detection rules, statistical baselining of access pressure and isolation-failure
  rates, and machine-learning anomaly scoring with feature attribution, so the analyst can measure isolation
  coverage gaps and catch active memory-tampering against high-value processes such as lsass.exe, browser
  brokers, and EDR agents.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which launched processes on isolation-sensitive hosts fail to match the approved inventory
    of applications that must enforce in-app isolation, and which of those processes start WITHOUT their
    expected memory-integrity mitigation flags (Control Flow Guard / /guard:cf, CET shadow stack, DEP)
    and renderer sandbox token?
  context: 'Within the Isolate (D3-I) tactic, the first step in measuring D3-ABPI coverage is to know
    which processes are even in scope and whether they launch hardened. Using Sysmon Event ID 1 and Windows
    Event ID 4688, enumerate every launched process and compare its image path, signer, and version against
    an approved allowlist of applications expected to enforce intra-process isolation — browsers, document/PDF
    viewers, and authentication components. Unsigned, out-of-date, or non-standard builds are isolation-risk
    candidates. Then verify each in-scope process actually launched with its mitigation flags (CFG, CET
    shadow stack, DEP) and, for renderers, an active sandbox token, per the in-process integrity model
    in Abadi et al. (Control-Flow Integrity) and the layered-defense argument in Szekeres et al. (SoK:
    Eternal War in Memory). A positive finding is a process that is supposed to enforce isolation but
    is running without the required hardening — that is the exposure surface an attacker would target
    for intra-process memory access.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 7
  - Windows Registry / Group Policy (browser enterprise policy)
  - Chrome chrome://process-internals
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    managed browser fleets and document/PDF viewers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_creation (Sysmon EID 1 OR Windows EID 4688)

      | lookup approved_isolation_apps on image_path

      | eval risk = (signature_status!="signed") OR (not in approved_isolation_apps) OR (version < approved_min_version)

      | eval missing_mitigations = NOT (CFG_enabled AND CET_enabled AND DEP_enabled AND (is_renderer ==>
      sandbox_token_present))

      | where risk OR (in_scope AND missing_mitigations)

      | table host, image_path, signer, version, CFG_enabled, CET_enabled, DEP_enabled, sandbox_token_present'
- question: Are managed browsers actually running with one renderer process per site, an active sandbox
    token, and Cross-Origin Read Blocking, and do enterprise policy values (SitePerProcess, IsolateOrigins)
    and the live chrome://process-internals state confirm this — or are renderers hosting multiple sites
    with Site Isolation disabled?
  context: 'Browser Site Isolation is the canonical real-world example of Application-based Process Isolation
    and directly supports the Isolate (D3-I) tactic: each site gets its own renderer process so that compromise
    of one site cannot read another site''s data. Confirm the production contract from Reis et al. (Site
    Isolation): one renderer per site, an active sandbox token, and Cross-Origin Read Blocking. Audit
    enterprise policy values (SitePerProcess, IsolateOrigins) via Registry/Group Policy and validate ground
    truth at chrome://process-internals per the Chromium Site Isolation Design Document. A deterministic
    misconfiguration finding is any renderer hosting multiple sites, a missing --site-per-process flag,
    or a disabled sandbox — each of these collapses the process boundary the browser is supposed to provide
    and is a coverage gap, not necessarily an active compromise.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 7
  - Windows Registry / Group Policy (browser enterprise policy)
  - Chrome chrome://process-internals
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    managed browser fleets and document/PDF viewers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from registry_or_gpo (browser enterprise policy)

      | eval site_per_process = policy.SitePerProcess, isolate_origins = policy.IsolateOrigins

      | join chrome_process_internals on host

      | where site_per_process != 1 OR isolate_origins is null OR renderer.sites_count > 1 OR renderer.sandbox_token
      == false

      | table host, site_per_process, isolate_origins, renderer.pid, renderer.sites_count, renderer.sandbox_token'
- question: Which modules (DLLs/images) loaded into isolation-sensitive processes are rare or never-before-seen
    across the fleet — for example in the bottom 1% of prevalence — and therefore candidates for code
    injection or DLL hijack into a process expected to be isolated?
  context: Supporting the Isolate (D3-I) tactic, this hunt looks for foreign code that has made its way
    into a process that is supposed to keep its internal memory protected. Using Sysmon Event ID 7 (ImageLoad),
    baseline the set of modules normally loaded into each isolation-sensitive process and rank them by
    fleet-wide prevalence, applying the 16-bucket round-robin frequency-analysis approach described by
    the Office 365 Security Team. Low-prevalence (e.g., bottom 1%) or never-before-seen modules loaded
    into a browser renderer, document viewer, or auth component are injection/hijack candidates. A positive
    result is a rare, unsigned, or unusually-located module loaded into an otherwise hardened process;
    a negative result is a module already well-established across the fleet for that process family.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 7
  - Windows Registry / Group Policy (browser enterprise policy)
  - Chrome chrome://process-internals
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    managed browser fleets and document/PDF viewers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from image_load (Sysmon EID 7) where target_image in isolation_sensitive_set

      | stats dc(host) as host_count by target_image, loaded_module, module_signer

      | eventstats sum(host_count) as total_hosts

      | eval prevalence = host_count / total_hosts

      | where prevalence <= 0.01 OR first_seen within range

      | sort prevalence asc'
- question: Which hosts have the lowest isolation-coverage score — the smallest proportion of process
    launches with required mitigations (CFG/CET/DEP, sandbox, Site Isolation policy present) — and which
    hosts have seen their compliance drop more than 10 percentage points week-over-week?
  context: This converts D3-ABPI coverage into a measurable, trendable metric in support of the Isolate
    (D3-I) tactic. For each host and day, calculate the proportion of process launches that have the required
    mitigation settings enabled (CFG/CET/DEP, sandbox token, Site Isolation policy present). Percentile-rank
    hosts to surface the lowest decile, and trend each host against its own 30-day baseline, alerting
    on a drop greater than 10 percentage points week-over-week. Thresholds should be derived from the
    environment's own compliance distribution rather than fixed externally. A declining score means hardening
    is regressing — through misconfiguration, policy rollback, or tampering — and the host is becoming
    a softer target for intra-process memory attacks.
  answer_sources:
  - Windows Event ID 4688
  - Windows Sysmon Event ID 1
  - Windows Sysmon Event ID 7
  - Windows Registry / Group Policy (browser enterprise policy)
  - Chrome chrome://process-internals
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    managed browser fleets and document/PDF viewers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_creation

      | eval hardened = (CFG_enabled AND CET_enabled AND DEP_enabled AND sandbox_ok AND site_isolation_policy_present)

      | stats avg(hardened) as coverage by host, _day

      | eventstats perc10(coverage) as p10 by _day

      | eval baseline30 = avg(coverage) over last 30 days by host

      | where coverage <= p10 OR (baseline30 - coverage) > 0.10

      | sort coverage asc'
- question: Which processes are requesting high-risk access rights against protected processes — PROCESS_VM_READ
    (0x0010), PROCESS_VM_WRITE (0x0020), PROCESS_VM_OPERATION (0x0008), PROCESS_CREATE_THREAD (0x0002),
    or full access (0x1F0FFF/0x1FFFFF) — especially when the source is on the isolation-risk list or the
    target is lsass.exe, a browser broker, or security tooling?
  context: 'This is the core runtime detection that an Application-based Process Isolation boundary is
    being attacked, complementing the Isolate (D3-I) coverage audits. Sysmon Event ID 10 (ProcessAccess)
    records one process opening a handle to another with specific access rights. High-risk masks — PROCESS_VM_READ,
    PROCESS_VM_WRITE, PROCESS_VM_OPERATION, PROCESS_CREATE_THREAD, or full access — are the building blocks
    of cross-process memory read/write and remote-thread injection. Prioritize events where the source
    is an isolation-risk process or where the target is a high-value process: lsass.exe (credential theft),
    a browser broker, or EDR/security tooling. Apply the high-value/rarity guidance in the TrustedSec
    Sysmon Community Guide. A true positive is an unexpected process reaching into protected memory; benign
    cases (debuggers, the EDR agent itself) should be allowlisted.'
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from process_access (Sysmon EID 10)

      | eval hi_risk = (GrantedAccess & 0x0010) OR (GrantedAccess & 0x0020) OR (GrantedAccess & 0x0008)
      OR (GrantedAccess & 0x0002) OR GrantedAccess in (0x1F0FFF, 0x1FFFFF)

      | where hi_risk AND (SourceImage in isolation_risk_list OR TargetImage in ("lsass.exe", browser_broker,
      security_tooling))

      | where SourceImage not in allowlist_debuggers_edr

      | table host, SourceImage, TargetImage, GrantedAccess, CallTrace'
- question: Where are remote threads being created with a StartAddress in unbacked/private memory (no
    StartModule), or where has Sysmon flagged process tampering / image replacement (EID 25), and do any
    of these violate known parent-child lineage rules such as lsass.exe spawning children or svchost.exe
    not parented by services.exe?
  context: Remote-thread injection and process hollowing are direct violations of an application's process
    boundary, which is exactly what D3-ABPI is meant to prevent under the Isolate (D3-I) tactic. Use Sysmon
    Event ID 8 (CreateRemoteThread) where the StartAddress resides in unbacked/private memory (no associated
    StartModule) and Sysmon Event ID 25 (process tampering / image replaced) to catch injection and hollowing,
    per the deterministic rules from Wazuh. Layer curated lineage heuristics from Red Canary's Process
    Injection report — for example, lsass.exe never spawns children and svchost.exe should only be spawned
    by services.exe. A positive finding is a remote thread into another process from unbacked memory,
    or a hollowed image, combined with anomalous lineage; these are high-fidelity indicators of isolation
    breakdown.
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from create_remote_thread (Sysmon EID 8)

      | where StartModule is null OR StartAddress in unbacked_private_memory

      | append (from process_tampering (Sysmon EID 25))

      | eval bad_lineage = (parent=="lsass.exe" has_children) OR (image=="svchost.exe" AND parent != "services.exe")

      | where 1 OR bad_lineage

      | table host, SourceImage, TargetImage, StartAddress, StartModule, parent'
- question: Can we observe a linked sequence — memory allocation/protection, then a write, then an execution
    or thread-start — all targeting the SAME memory address in a victim process, and do the associated
    call stacks contain unbacked frames?
  context: 'To suppress the false positives that plague single-event injection rules, this method demands
    the full causal chain that defines a real code-injection attack against an isolated process, reinforcing
    the Isolate (D3-I) tactic. Alert only when memory allocation/protection, a write, and an execution/thread-start
    are observed in sequence sharing the same target memory address — the robust temporal API-correlation
    rule from D''Elia et al. (Can You Run My Code?). Cross-reference call stacks containing unbacked frames
    via the Microsoft-Threat-Intelligence ETW provider, as described by Elastic Security Labs (Doubling
    Down on ETW Callstacks). A positive correlation is extremely high-fidelity: it shows an attacker staged
    executable memory and ran it inside another process. Missing any link in the chain drops the event,
    keeping the alert precise.'
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: 'Last 90 days (event-centered: correlate alloc/write/exec within a short window, e.g. 60s)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from etw_memory_events (alloc/protect, write, exec/thread_start)

      | transaction by target_pid, target_address maxspan=60s

      | where events_include(alloc_or_protect) AND events_include(write) AND events_include(exec_or_threadstart)

      | join callstacks (MS-Threat-Intelligence ETW) on target_pid

      | where callstack contains unbacked_frame

      | table host, source_pid, target_pid, target_address, sequence, callstack'
- question: For each (SourceImage, TargetImage) family and host role, are rolling rates of ProcessAccess
    (Sysmon EID 10) attempts spiking above 3 standard deviations or sustained over two consecutive windows,
    and which rare access pairs stand out by low prevalence?
  context: Beyond catching individual access attempts, this statistical view detects probing or automated
    abuse pressure against isolated processes in support of the Isolate (D3-I) tactic. Compute rolling
    rates of Sysmon Event ID 10 attempts per (SourceImage, TargetImage) family and host role. Flag spikes
    above 3 standard deviations or sustained elevation over two consecutive windows, and separately rank
    rare access pairs by prevalence, following the baselining and outlier-ranking method from Active Countermeasures.
    The standard-deviation multiplier should be derived from each host role's own historical distribution
    rather than a global constant. A surge in access attempts against protected targets can indicate scripted
    credential access or injection tooling; a rare, low-prevalence access pair indicates a previously-unseen
    relationship worth investigating.
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from process_access (Sysmon EID 10)

      | bin _time span=1h

      | stats count as attempts by SourceImage, TargetImage, host_role, _time

      | eventstats avg(attempts) as mu, stdev(attempts) as sd by SourceImage, TargetImage, host_role

      | eval z = (attempts - mu) / sd

      | where z > 3 OR sustained_elevation(2 windows)

      | sort z desc'
- question: Are there surges in isolation-failure signals — failed OpenProcess / access-denied (Security
    EID 4656/4663 with access-denied status), Control Flow Guard / CET violation exceptions, and browser
    sandbox-broker denials — per process and host, and conversely are expected CFG/CET telemetry ABSENT
    on binaries that should be hardened?
  context: Failure and denial events are first-class signals for the Isolate (D3-I) tactic in two opposite
    directions. A surge in access-denied attempts against protected processes (Security Event ID 4656/4663
    with access-denied status), CFG/CET violation exceptions, or browser sandbox-broker denials indicates
    an adversary is actively probing an enforced boundary — the isolation is working but under attack.
    Conversely, the ABSENCE of expected CFG/CET telemetry on a binary that is supposed to be hardened
    indicates the isolation is not actually enforced — a coverage gap. Count these events per process
    and host and compare against baseline. This dual reading lets the analyst distinguish 'boundary is
    holding and being attacked' from 'boundary was never really there.'
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from (Security EID 4656/4663 where status=access_denied) OR (CFG/CET violation exceptions)
      OR (sandbox_broker_denials)

      | stats count as failures by signal_type, process, host

      | eventstats avg(failures) as base by signal_type, host_role

      | where failures > base * surge_factor

      | append (from hardened_binaries | where cfg_cet_telemetry_count == 0)

      | table host, process, signal_type, failures, base'
- question: Do the live system-call and security-event sequences of isolation-sensitive applications deviate
    from their learned normal behavior, and what are the top-3 deviating events (e.g., an unexpected handle
    operation or an anomalous next log key) driving each alert?
  context: This machine-learning method models what normal in-process behavior looks like for isolation-sensitive
    applications so that subtle isolation bypasses surface as sequence anomalies, supporting the Isolate
    (D3-I) tactic. Train sequence/behavioral models on the normal system-call and security-event sequences
    of these applications, using the data-model comparison approach in Warrender, Forrest & Pearlmutter
    (HMM, 76-99% detection) and the LSTM log-key approach in Du et al. (DeepLog). At inference time, flag
    sequences that diverge from the model and surface the top-3 deviating events — an unexpected handle
    op, an anomalous next log key — in the alert text so the analyst can triage quickly. A positive result
    is a process behaving outside its learned envelope, which can indicate injected code executing inside
    an otherwise-isolated application.
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: Last 90 days (train on a longer clean baseline; score recent windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = train_sequence_model(syscall_and_security_event_seqs[isolation_sensitive_apps])\n\
      for window in recent_windows:\n    score = model.anomaly_score(window.sequence)\n    if score >\
      \ threshold:\n        emit_alert(host, process, top3=model.top_deviating_events(window, k=3))"
- question: When an Isolation Forest scores per-process/host feature vectors (granted-access masks, module
    rarity, unbacked-memory ratio, outbound byte volume), which processes are outliers, and what are the
    top-3 contributing features for each — correlated in real time with ETW allocate/protect/write memory
    events?
  context: This provides low-latency, explainable outlier scoring of memory-tampering behavior in support
    of the Isolate (D3-I) tactic. Build per-process/host feature vectors from granted-access masks, module
    rarity, unbacked-memory ratio, and outbound byte volume, and run an Isolation Forest per Liu, Ting
    & Zhou (Isolation-Based Anomaly Detection). Correlate the scored outliers in real time with ETW allocate/protect/write
    memory events, following Nasereddin & Al-Qassas (99.93% accuracy, 0.068% FP). Critically, every alert
    must list the top-3 contributing features rather than a bare anomaly score, so the analyst understands
    WHY a process was flagged. A positive result is a process whose access patterns, module rarity, and
    memory behavior jointly look like injection/tampering against an isolated target.
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [granted_access_mask, module_rarity, unbacked_memory_ratio, outbound_bytes]\nX\
      \ = build_vectors(per_process_host, features)\niso = IsolationForest().fit(X_baseline)\nscores =\
      \ iso.score_samples(X)\nfor p in where(scores < threshold):\n    correlate(p, etw_alloc_protect_write_events)\n\
      \    emit_alert(p, top3=feature_attribution(iso, p, k=3))"
- question: Which hosts show declining daily isolation-compliance scores coupled with rising outbound
    session counts or byte volume (from Zeek conn.log) originating from normally-quiet processes — the
    post-injection network signature of an isolated process that has been subverted and is now beaconing
    or exfiltrating?
  context: This time-series method ties isolation coverage to network behavior to forecast and catch post-compromise
    activity under the Isolate (D3-I) tactic. Train a time-series anomaly model on daily host isolation-compliance
    scores together with outbound session volume/byte counts from Zeek conn.log. Alert on hosts that show
    declining compliance coupled with rising external connection counts from normally-quiet processes
    — the post-injection network signature documented by Akamai (Novel Detection of Process Injection
    Using Network Anomalies). Report the contributing compliance and volume features in the alert. A positive
    result is a host whose hardening is slipping at the same time a previously-silent isolated process
    begins making outbound connections, suggesting injected code has broken isolation and is now communicating
    externally.
  answer_sources:
  - Windows Sysmon Event ID 8
  - Windows Sysmon Event ID 10
  - Windows Sysmon Event ID 25
  - Windows Security Event ID 4656/4663 (handle/object access)
  - Microsoft-Threat-Intelligence ETW provider
  - Zeek conn.log
  - 'NAI: Critical application servers, domain controllers, and user workstations handling sensitive data;
    high-value authentication and security tooling (lsass, browsers, EDR agents)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "ts = join(daily_isolation_compliance[host], zeek_conn_outbound_sessions_bytes[host] by process)\n\
      model = train_timeseries_anomaly(ts)\nfor host in hosts:\n    if compliance_trend(host) < 0 AND\
      \ outbound_from_quiet_process(host) rising:\n        emit_alert(host, features=[compliance_drop,\
      \ outbound_session_delta])"
  - technology: Zeek/pseudocode
    query: 'from conn.log

      | where orig_h in monitored_hosts AND resp_h not in internal

      | stats count as sessions, sum(orig_bytes+resp_bytes) as bytes by orig_h, _day

      | join process_owner on conn

      | where process in normally_quiet_set AND (sessions rising vs baseline)'
