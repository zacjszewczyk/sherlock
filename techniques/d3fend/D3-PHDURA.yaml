name: 'D3-PHDURA: Per Host Download-Upload Ratio Analysis'
id: 1cc3a664-1a79-471a-825e-8666e1cc18c8
description: 'Hunt for data exfiltration and command-and-control activity by baselining and monitoring
  each host''s download-to-upload (pull-vs-push) byte ratio. This playbook helps an analyst detect hosts
  that become outbound-dominant relative to their own history or role-based peers: hourly upload volume
  crossing a high-risk floor with an inverted upload:download ratio, chunked or low-and-slow transfers
  that defeat single-threshold alerting, high-volume uploads to rare or first-seen destinations, sustained
  ratio regime shifts (change-point), beacon-like cadence correlated with byte asymmetry, and bursts of
  blocked/aborted egress. It pairs deterministic volume/ratio rules with statistical baselining and machine-learning
  scoring (including encrypted-traffic and explainable models) so that high-risk host-windows are ranked
  and triaged for potential bulk staging or exfiltration over an established channel.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which internal hosts uploaded far more data than they downloaded in any one-hour window, exceeding
    a high-risk outbound volume floor (start at >1 GB/hr, ideally your own 99.9th percentile) while the
    upload:download byte ratio exceeded 3:1 to external destinations?
  context: 'This is the deterministic core of per-host pull-vs-push ratio modeling. Most hosts are pull-dominant
    (they download more than they upload); a host that inverts that pattern AND moves a large absolute
    volume outbound is a strong exfiltration or bulk-staging signal under the Detect tactic. Aggregate
    per-host hourly orig_bytes (sent) and resp_bytes (received) from Zeek conn.log, then alert when sent
    bytes exceed the fixed floor to external destinations and the sent:received ratio exceeds 3:1. A positive
    result means a host is shipping bulk data over an established channel; a negative result narrows attention
    away from high-volume single-session exfiltration toward stealthier variants. Tune the floor from
    your own 99.9th percentile to control false positives from backups and legitimate uploads. (Method:
    Symbolic Logic; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - Firewall
  - NetFlow
  - 'NAI: Network egress/ingress points where north-south traffic is monitored; internal aggregation points
    for east-west lateral transfers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from conn.log where dest is external\n  | bin time into 1h windows by src_ip\n  | stats sum(orig_bytes)\
      \ as up, sum(resp_bytes) as down by src_ip, window\n  | eval ratio = up / max(down,1)\n  | where\
      \ up > 1GB AND ratio > 3\n  | sort -up"
- question: For each host-window, what are the physical attack metrics — Volume (total upload bytes and
    upload:download ratio), Frequency (sessions per minute to the top external destination), and State
    (counts of conn_state S0/REJ/RSTO/RSTR) — that accompany an outbound-dominant alert?
  context: 'Ratio alone is brittle; enriching every alert with Volume, Frequency, and State gives the
    analyst the concrete behavior behind the number, consistent with exfiltration-over-C2 (T1041). Volume
    captures how much left and how lopsided the transfer was; Frequency reveals automated/scripted transfer
    cadence to a single destination; State exposes connection health (lots of S0/REJ/RSTO/RSTR suggests
    probing or unstable channels). Computing these per host-window under the Detect tactic lets a SOC
    analyst distinguish a single large legitimate upload from a sustained, automated exfiltration session
    and prioritize accordingly. (Method: Symbolic Logic; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - Firewall
  - NetFlow
  - 'NAI: Network egress/ingress points where north-south traffic is monitored; internal aggregation points
    for east-west lateral transfers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from conn.log\n  | bin time into 1h windows by src_ip\n  | stats sum(orig_bytes) as up, sum(resp_bytes)\
      \ as down,\n          count as sessions, dc(dest) as dests,\n          count(eval(conn_state in\
      \ (\"S0\",\"REJ\",\"RSTO\",\"RSTR\"))) as bad_state\n          by src_ip, window\n  | eval ratio=up/max(down,1),\
      \ sess_per_min=sessions/60\n  | table src_ip, window, up, ratio, sess_per_min, bad_state"
- question: Which hosts show bursts of failed, rejected, or aborted outbound connections (conn_state S0,
    REJ, RSTO) and proxy/firewall denies occurring alongside rising upload volume?
  context: 'A spike of blocked egress combined with growing upload volume indicates an actor probing for
    an open exfiltration path — trying multiple destinations/ports until one succeeds. Under the Detect
    tactic this failure-mode profiling (per T1041) turns ''noise'' (denied connections) into a leading
    indicator. Track per-host counts of S0/REJ/RSTO conn_states from Zeek plus deny events from proxy/firewall
    logs, and correlate them with the host''s outbound byte trend. A positive result is a host hammering
    egress while its uploads climb; a negative result helps rule out an active path-finding stage. (Method:
    Symbolic Logic; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - Firewall
  - NetFlow
  - 'NAI: Network egress/ingress points where north-south traffic is monitored; internal aggregation points
    for east-west lateral transfers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join (conn.log where conn_state in (\"S0\",\"REJ\",\"RSTO\") | stats count as fails by src_ip,1h_window)\n\
      \       (firewall where action=\"deny\" and direction=\"outbound\" | stats count as denies by src_ip,1h_window)\n\
      \       (conn.log | stats sum(orig_bytes) as up by src_ip,1h_window)\n  | where (fails+denies) >\
      \ threshold AND up rising vs prior windows\n  | alert"
- question: Which host-to-destination pairs accumulate large total outbound volume across many small,
    uniformly sized sessions over rolling 1-hour and 24-hour windows, even though no single session crosses
    the volume floor?
  context: 'Adversaries split data into fixed-size chunks (T1030) to stay under single-threshold volume
    alerts. Cumulative aggregation defeats this: sum orig_bytes per host->destination pair over rolling
    1h/24h windows and alert on cumulative outbound volume and on a high count of uniform-size sessions
    (low variance in bytes-per-session). RITA implements similar long-connection and large-cumulative-transfer
    scoring over Zeek logs. Under the Detect tactic, a positive result is a host quietly draining data
    in equal-sized pieces to one destination; a negative result shifts focus to rare-destination or low-rate
    variants. (Method: Symbolic Logic; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - Firewall
  - NetFlow
  - 'NAI: Network egress points and DNS/HTTP/TLS proxies where destination prevalence can be computed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from conn.log where dest external\n  | bin time into 24h (and 1h) windows\n  | stats sum(orig_bytes)\
      \ as cum_up, count as sessions,\n          stdev(orig_bytes) as size_var, avg(orig_bytes) as size_avg\n\
      \          by src_ip, dest, window\n  | eval uniformity = size_var / max(size_avg,1)\n  | where\
      \ cum_up > cum_floor AND sessions > N AND uniformity < 0.1\n  | alert"
- question: Which hosts with abnormal upload:download ratios sent large outbound volumes to first-seen
    or organization-wide low-prevalence external destinations within the monitoring window?
  context: 'Exfiltration frequently targets attacker-controlled infrastructure the organization has never
    (or rarely) contacted. Combining an abnormal ratio with destination rarity (org-wide prevalence) implements
    the external-transfer filtering logic of the Vectra patent and sharply reduces false positives versus
    volume alone. Compute a prevalence score for each external destination across all hosts, then alert
    when an outbound-dominant host moves large volume to a first-seen or rare destination. Under the Detect
    tactic, a positive result is a strong candidate for active exfiltration to new C2/storage; a known
    popular SaaS destination lowers concern. (Method: Symbolic Logic; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - Firewall
  - NetFlow
  - 'NAI: Network egress points and DNS/HTTP/TLS proxies where destination prevalence can be computed.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// build prevalence: dc(src_ip) per dest over 90d\n  from conn.log | stats dc(src_ip) as host_count,\
      \ min(_time) as first_seen by dest\n  | join dest [ from conn.log | bin 1h | stats sum(orig_bytes)\
      \ as up,sum(resp_bytes) as down by src_ip,dest,window ]\n  | eval ratio=up/max(down,1)\n  | where\
      \ ratio>3 AND up>floor AND (host_count<=2 OR first_seen within window)\n  | alert"
- question: Which hosts exceed their own host-specific 95th-percentile upload:download ratio and their
    role-based peer-group 99th-percentile boundary over a rolling 30-day baseline?
  context: 'Static thresholds misfire because benign edge/server traffic is often periodic and high-volume.
    Maintaining rolling 30-day ratio distributions per host AND per role-based peer group (web servers,
    workstations, backup hosts) lets you flag deviations relative to appropriate norms (per Mack et al.).
    Flag hosts crossing both their host-specific 95th and peer-group 99th percentile to require self-and-peer
    anomaly. Derive/validate thresholds empirically from labeled flows like CIC-IDS2017. Under the Detect
    tactic, a positive result is a host abnormal for both itself and its function; negative reduces noise
    from naturally high-upload roles. (Method: Statistical Method; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points where north-south traffic is monitored.'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from conn.log | bin 1h | stats sum(orig_bytes) as up,sum(resp_bytes) as down by src_ip,window\n\
      \  | eval ratio=up/max(down,1)\n  | stats p95(ratio) as host_p95 by src_ip   // over 30d\n  | join\
      \ role [ ... p99(ratio) as peer_p99 by role ]\n  | where current_ratio > host_p95 AND current_ratio\
      \ > peer_p99\n  | alert"
- question: Which hosts show a persistent regime shift (durable change-point) in their daily upload/download
    ratio or outbound-byte series — becoming upload-dominant — rather than a transient one-off spike?
  context: 'A compromised host often changes behavior durably (a new exfiltration channel persists), whereas
    benign spikes revert. Apply change-point detection (PELT or binary segmentation with a BIC penalty)
    to each host''s daily upload/download ratio and outbound-byte time series to locate the point where
    the mean shifts and stays shifted (Truong et al.; ruptures library). Under the Detect tactic, a detected
    change-point with a sustained higher-ratio regime is a high-value lead; isolated spikes that revert
    are deprioritized. This complements percentile baselining by capturing slow, deliberate behavioral
    drift. (Method: Statistical Method; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points where north-south traffic is monitored.'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each src_ip:\n    series = daily sum(orig_bytes) and daily ratio over 90d\n    cps = PELT(series,\
      \ model=\"rbf\", penalty=BIC)\n    if cps and post_segment_mean > pre_segment_mean * factor\n  \
      \     and post_segment persists >= K days:\n       alert(src_ip, change_date, old_mean, new_mean)"
- question: Which host-to-destination pairs exhibit regular or jittered periodic connection cadence (via
    FFT/autocorrelation of timestamps) that co-occurs with outbound byte dominance?
  context: 'Automated C2 and exfiltration agents connect on a schedule (often with jitter). Running FFT/autocorrelation
    on per-host->destination connection timestamps surfaces periodic beaconing (BAYWATCH); coefficient-of-variation,
    skew, and DFFT scoring is implemented in RITA. Escalate only when regular cadence co-occurs with outbound
    byte dominance, which separates exfil-over-C2 from benign periodic polling. Under the Detect tactic,
    a positive result — steady cadence + upload-heavy bytes — is a strong C2/exfil indicator; periodic-but-download-dominant
    traffic (updates, polling) is filtered out. (Method: Statistical Method; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points where north-south traffic is monitored.'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each (src_ip,dest):\n    intervals = diff(sorted connection timestamps)\n    cv = stdev(intervals)/mean(intervals)\n\
      \    score = DFFT_peak(intervals) or autocorr peak\n    up,down = sum(orig_bytes),sum(resp_bytes)\n\
      \    if (cv < 0.1 or score high) AND up/max(down,1) > 3:\n       alert(beaconing+upload_dominant)"
- question: Which hosts show sustained low-rate outbound dominance — elevated request counts, many distinct
    destinations, persistent small uploads — that never crosses the high-volume floor but still scores
    as an outlier?
  context: 'Low-and-slow exfiltration deliberately stays beneath volume thresholds. Build sliding-window
    behavioral features (request counts, distinct destinations, sustained low-rate outbound dominance)
    and apply outlier scoring to surface stealthy channels (Nadler et al.). Under the Detect tactic this
    catches the exfiltration that the deterministic floor misses: a host that trickles data continuously.
    A positive result is a persistently outbound-leaning host with unusual destination spread; a negative
    result indicates the host''s low-volume traffic matches normal patterns. (Method: Statistical Method;
    tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points where north-south traffic is monitored.'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from conn.log | sliding 6h window per src_ip\n  | stats count as reqs, dc(dest) as dests,\n\
      \          sum(orig_bytes) as up, sum(resp_bytes) as down by src_ip,window\n  | eval ratio=up/max(down,1),\
      \ rate=up/window_seconds\n  | // outlier score on [reqs,dests,ratio,sustained low rate]\n  | where\
      \ outlier_score > threshold AND ratio>1 AND up < high_floor\n  | alert"
- question: Using a supervised model over ratio, total/cumulative volume, destination rarity, uniform-session-count,
    protocol mix, conn_state failure rate, and temporal features, which host-windows have the highest
    estimated exfiltration likelihood?
  context: 'When labels exist, a supervised classifier fuses the many weak signals (ratio, cumulative
    volume, destination rarity, session uniformity, protocol mix, connection-failure rate, time-of-day)
    into a single prioritized risk score per host-window, validated on CIC-IDS2017. This ranks the queue
    so analysts triage the riskiest intervals first rather than chasing individual thresholds. Under the
    Detect tactic, run this in parallel with deterministic rules, never replacing them. A high score concentrates
    investigation; a low score across all features supports deprioritization. (Method: Machine Learning;
    tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points; TLS proxies where flow metadata is available without decryption.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [ratio, total_up, cum_up, dest_rarity, uniform_sessions,\n              proto_mix,\
      \ conn_fail_rate, hour_of_day] per src_ip,window\n  model = GradientBoosting/XGBoost trained on\
      \ CIC-IDS2017 labels\n  score = model.predict_proba(features)[exfil]\n  emit top-N host-windows\
      \ by score"
- question: Where labels are scarce, which outbound-dominant hosts are flagged as outliers by one-class/unsupervised
    models (Isolation Forest, One-Class SVM, autoencoders) trained on benign per-host flow statistics?
  context: 'Labeled exfiltration data is rare, so train unsupervised models on benign per-host flow statistics
    (byte ratios, volumes, durations) and flag deviations. Isolation Forest, One-Class SVM, or deep autoencoders
    learn the normal manifold; an online autoencoder ensemble with incremental per-host stats and RMSE
    scoring (Kitsune/KitNET) supports streaming detection. Under the Detect tactic, an outbound-dominant
    host with high reconstruction error/anomaly score is a candidate exfiltrator. A positive result means
    the host''s flow profile is unlike learned-normal; a low score means it fits the baseline. (Method:
    Machine Learning; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points; TLS proxies where flow metadata is available without decryption.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = benign per-host flow stats [byte_ratio, up_vol, down_vol, duration, sessions]\n  model\
      \ = IsolationForest() / OneClassSVM() / AutoEncoder()\n  model.fit(X_benign)\n  score = model.decision_function\
      \ / RMSE for live host-windows\n  where score indicates outlier AND outbound-dominant -> alert"
- question: Which hosts show upload-dominant exfiltration patterns within encrypted/TLS traffic — detectable
    from directional packet-size/byte-volume sequences without decryption, including high-jitter chunked
    transfers?
  context: 'Payload encryption blinds content inspection, but directional metadata still betrays exfiltration.
    Self-supervised contrastive models over directional packet-size/byte-volume sequences detect upload-dominant
    transfers in TLS without decryption (ET-SSL), and LSTM/transformer sequence models learn combined
    timing-and-volume signatures of high-jitter chunked transfers (Gupta et al., ARES 2025). Under the
    Detect tactic, this extends coverage to the encrypted channels adversaries prefer. A positive result
    is an encrypted flow whose directional sequence resembles learned exfiltration shapes; benign encrypted
    browsing/streaming scores low. (Method: Machine Learning; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points; TLS proxies where flow metadata is available without decryption.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = directional packet-size/byte-volume series per flow (no decryption)\n  enc = SelfSupervisedContrastive(seq)\
      \  // ET-SSL embeddings\n  // or temporal model:\n  pred = LSTM/Transformer(seq) -> P(upload_dominant_exfil)\n\
      \  where pred high OR embedding near exfil cluster -> alert"
- question: For every ML-generated alert, what are the top-3 contributing features (e.g., upload bytes,
    destination rarity, session count) driving the score, attached via SHAP/LIME attributions?
  context: 'A bare anomaly score is not actionable; analysts need to know why. Attaching SHAP/LIME feature
    attributions to each ML alert names the top-3 drivers (e.g., upload bytes, destination rarity, session
    count), following IDS explainability best practice (Frontiers XAI-IDS review). This accelerates triage,
    builds trust, and exposes model errors. Under the Detect tactic, the explanation tells the analyst
    whether to chase the lead and which evidence to pull next. ML must run in parallel with, never replace,
    the deterministic volume/ratio thresholds. (Method: Machine Learning; tactic: Detect.)'
  answer_sources:
  - Zeek conn.log
  - NetFlow
  - 'NAI: Network egress/ingress points; TLS proxies where flow metadata is available without decryption.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for each ml_alert:\n    contributions = SHAP(model, features)\n    top3 = sort(contributions,\
      \ desc)[:3]\n    annotate alert with top3 feature names + values\n    // keep deterministic ratio/volume\
      \ rules running alongside"
