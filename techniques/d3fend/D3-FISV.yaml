name: 'D3-FISV: File Internal Structure Verification'
id: ca75e895-1698-48bd-8c51-4add33e82ad3
description: Detect files whose declared format diverges from their true internal structure — a hallmark
  of masquerading, corruption, polyglots, and malformed exploit payloads built to evade inspection. This
  playbook helps an analyst investigate first-party network, email-gateway, web-proxy, and file-share
  telemetry by combining deterministic file-format-specification validation (magic bytes, header constants,
  object/CRC checks, polyglot detection) with content byte-distribution statistics (fileprint/PAYL modeling,
  entropy plus chi-square, rare-mismatch rate baselining) and machine-learning content typing (Magika-style
  classification, polyglot/masquerade classifiers, unsupervised isolation-forest triage). Use it to confirm
  whether a transferred or stored file is genuinely the type it claims to be, to surface files that satisfy
  multiple format validators or fail structural sanity checks, and to prioritize anomalous transfers for
  response.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there files whose content-sniffed MIME/magic-byte type contradicts the type implied by
    their declared file extension or URL path?
  context: This is the foundational masquerading check. Zeek's File Analysis Framework computes mime_type
    from file content independent of the filename, so comparing that content-derived type against the
    type the extension/URL claims exposes files pretending to be something they are not. Trigger a hard
    alert on deterministic, high-confidence mismatches — for example executable signatures (MZ 0x4D5A,
    ELF 0x7F454C46, Mach-O) hiding under image/document/archive extensions, or script/HTML content delivered
    under a media extension. Maintain the allow/deny mapping as a fixed, version-controlled table that
    is tuned but never pruned, because deletions reopen evasion paths. A positive result strongly suggests
    an actor is disguising tooling or payloads to slip past extension-based controls; supporting the Detect
    tactic, it gives high-fidelity early warning of staged or delivered malware.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log | derive declared_type = lookup_extension(mime_from_name(filename, source))\n\
      \  | where mime_type != declared_type\n  | where (mime_type in [\"application/x-dosexec\",\"application/x-elf\"\
      ,\"application/x-mach-o-binary\"]\n           and declared_ext in [image,document,archive,media])\n\
      \  | alert severity=high \"signature/extension mismatch\""
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=files\n  | lookup magic_to_ext_map content_type AS mime_type OUTPUT allowed_exts\n\
      \  | where NOT match(declared_ext, allowed_exts)\n  | table _time src dest filename mime_type declared_ext\n\
      \  | alert"
- question: Do any files fail full format-object validation when their internal structure is parsed beyond
    the leading magic bytes (e.g., JPEG markers, OLE/Compound-Document header constants, ZIP central directory
    and CRC/length fields)?
  context: 'Leading magic bytes are trivial to forge, so this question pushes validation deep into the
    file. Run spec-faithful validators that parse internal structure: JPEG segment markers, the OLE/Compound-Document
    header constants such as the 29th-30th byte order mark (0xFFFE for little-endian), ZIP central-directory
    and sector chains, and CRC/length-field consistency, per Garfinkel''s fast object validation. Any
    file whose declared type fails its validator (validator pass/fail state) is malformed or masqueraded
    and is high-risk for exploit delivery. Maintainable, spec-faithful parsers can be generated using
    model-driven format DSLs such as Derric (van den Bos). For the Detect tactic, a validator failure
    on an otherwise plausible-looking file is a strong signal of a crafted exploit document or a container
    hiding non-conforming data.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=files\n  | eval result = run_validator(declared_type, file_bytes)\n  | where result\
      \ == \"FAIL\"\n  | table _time src dest filename declared_type validator_error\n  | alert severity=high\
      \ \"format object validation failed\""
- question: Are there files exhibiting malformed headers or broken structure — impossible header/section
    lengths, broken offsets, or truncated transfers (Zeek missing_bytes > 0 or seen_bytes < total_bytes)?
  context: Beyond strict spec validation, parser sanity checks catch structurally broken files that may
    indicate evasion, corruption, or incomplete delivery. Look for impossible header or section lengths,
    offsets that point outside the file, and truncated transfers where Zeek files.log missing_bytes >
    0 or seen_bytes < total_bytes. Track per-source parse-error and validator-failure counts as a distinct
    Failure-Mode signal so a host repeatedly producing malformed files stands out. Under the Detect tactic,
    clustered structural failures from a single source can reveal an actor probing parser tolerance, a
    malformed-exploit campaign, or a misconfigured exfiltration tool, while isolated truncations may simply
    be network issues that should be ruled out.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log | where missing_bytes > 0 OR seen_bytes < total_bytes OR parse_error == true\n\
      \  | summarize fails=count() by source\n  | where fails > threshold\n  | alert \"malformed/truncated\
      \ file structure\""
- question: Do any files simultaneously satisfy two or more independent format validators (polyglots),
    for example a file valid as both PDF and ZIP/JAR, or with trailing/appended archives or scripts?
  context: Polyglots are files crafted to be valid as multiple formats at once, defeating single-answer
    identifiers like libmagic, TrID, and Tika (per ORNL's polyglot study). Do not stop at the first matching
    signature — parse for co-present valid structures of multiple formats and alert when a file satisfies
    two or more independent format validators, especially when there are trailing or embedded appended
    archives or scripts. A positive result is highly suspicious because legitimate files rarely need to
    be two formats at once; polyglots are a deliberate technique to bypass content inspection and have
    benign-looking front matter with a malicious payload behind it. This directly supports the Detect
    tactic by catching evasion that magic-byte checks miss.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=files\n  | eval valids = all_passing_validators(file_bytes)\n  | where mvcount(valids)\
      \ >= 2 OR has_trailing_archive(file_bytes)==true\n  | table _time src dest filename valids\n  |\
      \ alert severity=high \"polyglot multi-format file\""
- question: Does any file's byte-value frequency distribution (its 'fileprint') deviate from the learned
    centroid for its claimed content type beyond the per-type 99th-percentile threshold?
  context: This statistical method models each file or fragment's 1-gram byte-value frequency distribution
    as a 'fileprint' and scores it against per-type centroids using Mahalanobis/nearest-centroid distance
    (Li, Wang, Herzog & Stolfo), optionally using the length/port-conditioned PAYL variant. Content whose
    distribution does not match its claimed type — NOP sleds, oversized binary blobs, malformed protocol
    fields — produces a large distance. Alert when the distance exceeds the per-type 99th-percentile learned
    from a 30-day benign baseline. For the Detect tactic, this catches masquerade and embedded payloads
    that survive header checks but cannot fake the overall byte statistics of a legitimate file of the
    claimed type; a high distance with a clean header is a strong indicator of hidden or injected content.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days (baseline trained on a rolling 30-day benign window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=files\n  | eval fp = byte_histogram(file_bytes)\n  | eval dist = mahalanobis(fp,\
      \ centroid[declared_type], cov[declared_type])\n  | where dist > pctl99[declared_type]\n  | table\
      \ _time src dest filename declared_type dist\n  | alert \"fileprint distribution mismatch\""
- question: Are there declared 'document' files with implausibly high body entropy (> 7.5, likely packed/encrypted
    payload) or declared compressed/media files with implausibly low body entropy (< 4.0, likely text/script
    masquerade)?
  context: Entropy alone is misleading because compressed media (JPEG/ZIP/OOXML) legitimately sits near
    8.0 bits/byte, so this method combines Shannon entropy with header/format checks and adds chi-square
    and per-fragment analysis (Davies et al.). Flag declared documents whose body entropy exceeds 7.5
    — a sign of an encrypted or packed payload smuggled inside a document wrapper — and flag declared
    compressed/media files whose body entropy is implausibly low (< 4.0), which suggests text or script
    masquerading as a binary format. Derive Volume features (file size, body byte count) alongside entropy
    for context. Under the Detect tactic, entropy-versus-type contradictions are an efficient triage signal
    for packed malware and obfuscated payloads when combined with format validation rather than used in
    isolation.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=files\n  | eval ent = shannon_entropy(body_bytes), chi = chi_square(body_bytes)\n\
      \  | where (declared_class==\"document\" AND ent > 7.5)\n        OR (declared_class in [\"compressed\"\
      ,\"media\"] AND ent < 4.0)\n  | table _time src dest filename declared_class ent chi file_size\n\
      \  | alert \"entropy/type inconsistency\""
- question: Which extension-to-MIME/signature pairings are rare against a 30-day baseline, and which sources
    show mismatch or validator-failure rates exceeding their own historical norm (modified Z-score |Mz|
    > 3.5)?
  context: 'This method builds 30-day frequency baselines of extension-to-MIME/signature pairs and scores
    low-frequency combinations (below the 1st percentile) as anomalous, then quantifies mismatch and validator-failure
    rates per source subnet, destination segment, and transport protocol from Zeek conn.log (Frequency:
    events/min/source). Use the robust median/MAD modified Z-score (|Mz| > 3.5) so thresholds adapt per
    environment rather than relying on fixed cutoffs, and escalate any source whose mismatch rate exceeds
    its historical baseline. For the Detect tactic, rare pairings and rate spikes pinpoint where masquerading
    activity concentrates — a host or segment suddenly generating unusual extension/type combinations
    is a prime investigation lead, while a stable low rate is likely benign noise.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days (baselines computed over rolling 30-day windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=files\n  | eval pair = declared_ext.\"->\".mime_type\n  | summarize cnt=count()\
      \ by pair, source\n  | eval freq = cnt / total_by_source\n  | eventstats median(rate) AS med, mad(rate)\
      \ AS mad by segment\n  | eval mz = 0.6745*(rate-med)/mad\n  | where freq < pctl1 OR abs(mz) > 3.5\n\
      \  | alert \"rare mismatch / rate anomaly\""
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log join files.log on uid\n  | summarize mismatch_rate by orig_subnet, resp_segment,\
      \ proto\n  | flag rows exceeding per-segment modified-z threshold"
- question: When an ML content-type classifier predicts the true file type from raw bytes, does the predicted
    type conflict with the declared extension or fall into the unknown/high-entropy class?
  context: Run a content-type classifier such as Magika over the file bytes to predict the true type (200+
    types) with per-type confidence, completely independent of the extension. Alert when the predicted
    type conflicts with the declared extension or when the file is classified into the unknown/high-entropy
    bucket. Surface the top-3 contributing signals in the alert text — predicted type, confidence, and
    declared extension — for explainability so the analyst can quickly judge the finding. For the Detect
    tactic, an ML classifier generalizes beyond fixed magic-byte tables and catches novel or obfuscated
    masquerades; a high-confidence prediction that contradicts the declared extension is a strong, explainable
    masquerading signal, while an unknown/high-entropy classification warrants deeper format validation.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=files\n  | eval pred = magika_predict(file_bytes)  // {type, confidence}\n  |\
      \ where pred.type != type_of(declared_ext) OR pred.type==\"unknown\" OR pred.high_entropy==true\n\
      \  | eval explain = top3_signals(pred)\n  | table _time src dest filename declared_ext pred.type\
      \ pred.confidence explain\n  | alert"
- question: Do gradient-boosted/neural or Random Forest classifiers trained on whole-file byte-content
    and structure features flag a file as a polyglot or malicious masquerade, with the top-3 contributing
    features surfaced?
  context: 'Train gradient-boosted or neural classifiers on whole-file byte-content and structure features
    to detect polyglots and masquerade that defeat magic-byte identification (Toward the Detection of
    Polyglot Files), using static structure features such as byte/entropy histograms, size, and section/import/header
    fields drawn from the EMBER methodology. Retain the existing Random Forest on labeled mismatch events
    (features: mismatch pair type, file size, transport protocol, source reputation, destination criticality,
    recurrence) for triage prioritization, and require the model to emit the top-3 contributing features
    in the alert. For the Detect tactic, this supervised layer prioritizes which mismatches are likely
    malicious versus benign, focusing analyst attention; a high malicious score with interpretable drivers
    (e.g., polyglot structure + low source reputation + high destination criticality) is a strong case
    for escalation.'
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=files\n  | eval feats = ember_features(file_bytes) ++ {mismatch_pair, file_size,\
      \ proto, src_reputation, dst_criticality, recurrence}\n  | eval score = gbdt_polyglot.predict(feats),\
      \ rf = rf_mismatch.predict(feats)\n  | where score > 0.8 OR rf.malicious_prob > 0.8\n  | eval drivers\
      \ = top3_features(feats)\n  | alert severity=high"
- question: When file-transfer/write feature vectors are scored with an unsupervised anomaly model (Extended
    Isolation Forest), which files rank as rare anomalies (short isolation path), and what are the top-3
    per-feature drivers?
  context: This unsupervised method scores file-transfer/write feature vectors — file size, body entropy,
    content-mime, declared extension, source reputation, recurrence, missing_bytes — with an Extended
    Isolation Forest to rank rare anomalies without labels; a short isolation path indicates an anomaly.
    It catches novel masquerading and structural oddities that no signature or label covers. Output per-feature
    contributions so analysts see the top-3 drivers (for example size, entropy, extension-MIME mismatch)
    in the alert text. For the Detect tactic, unsupervised ranking is valuable precisely when an actor
    uses techniques never seen before; the highest-ranked anomalies with interpretable drivers become
    the triage queue, while bulk benign traffic isolates with long paths and is deprioritized.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Email gateway file-extraction logs
  - Web proxy / file-share write logs
  - 'NAI: Network egress points, email gateways, web proxies, and file shares where files are transferred
    or stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=files\n  | eval v = vector(file_size, body_entropy, content_mime, declared_ext,\
      \ src_reputation, recurrence, missing_bytes)\n  | eval score = eif.score(v)   // shorter path =>\
      \ higher anomaly\n  | where score > anomaly_threshold\n  | eval drivers = top3_contributions(v)\n\
      \  | sort -score\n  | alert \"unsupervised mismatch anomaly\""
