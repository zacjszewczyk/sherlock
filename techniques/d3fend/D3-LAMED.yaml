      model = per_type_RandomForest(features)\nfor mac:\n  inferred = model.predict(features[mac])\n \
      \ if inferred != registered_type(mac):\n    alert('device type mismatch vs declared', mac, inferred,\
      \ top3_features)"
- question: Does an authenticated MAC's live behavioral fingerprint (protocol set, payload entropy, packet-length
    statistics) diverge from its enrolled fingerprint, indicating a shared, spoofed, or compromised port?
  context: 'Detection objective (Isolate tactic): once a device is enrolled, drift from its behavioral
    fingerprint signals that the identity is now being used by a different or compromised device riding
    the same authentication. Build per-device behavioral fingerprints (protocol set, payload entropy,
    packet-length statistics) and flag when an authenticated MAC''s live behavior diverges from its enrolled
    fingerprint, reporting the top contributing features. A positive result indicates the authenticated
    identity no longer matches the device that enrolled it - a shared, spoofed, or compromised port to
    isolate; a negative result means behavior remains consistent with enrollment. Re-enroll fingerprints
    after legitimate firmware/role changes to avoid stale-baseline false positives. Source: [IoTSense:
    Behavioral Fingerprinting of IoT Devices, Bezawada et al.](https://arxiv.org/pdf/1804.03852).'
