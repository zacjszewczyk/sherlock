      \ > 1: alert('multiple hosts behind one authed port', port, skews)"
- question: Does the device type inferred from passive traffic features (protocol mix, packet sizes, ports,
    DNS/NTP servers) disagree with the MAC's registered/declared device type?
  context: 'Detection objective (Isolate tactic): a device that claims to be one thing but behaves like
    another is a classic rogue or misrepresented endpoint that should not have been admitted. Classify
    device type from passive onboarding/flow features (protocol mix, packet sizes, ports, DNS/NTP servers)
    using per-type Random Forests, and alert when the inferred type for a MAC disagrees with its registered/declared
    type, surfacing the top-3 contributing features. A positive result means the network admitted a device
    under a false identity (e.g., a laptop posing as a printer) - isolate and reconcile against inventory;
    a negative result confirms observed behavior matches the declared type. Retrain classifiers as the
    device fleet evolves to limit drift-driven false positives. Sources: [IoT SENTINEL: Automated Device-Type
    Identification for Security Enforcement in IoT, Miettinen et al.](https://arxiv.org/pdf/1611.04880);
    [Classifying IoT Devices in Smart Environments Using Network Traffic Characteristics, Sivanathan et
    al.](https://www2.ee.unsw.edu.au/~vijay/pubs/jrnl/18tmc.pdf).'
  answer_sources:
