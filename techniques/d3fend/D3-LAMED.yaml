      \ mac (authenticated):\n  live = current_fingerprint(mac)\n  if distance(live, fingerprint[mac])\
      \ > drift_threshold:\n    alert('behavioral-fingerprint drift', mac, top_features(live, fingerprint[mac]))"
- question: Does a per-device autoencoder report reconstruction error above its benign-derived threshold
    on stream-aggregation features (packet/byte counts, inter-arrival jitter, magnitude and variance over
    multiple windows)?
  context: 'Detection objective (Isolate tactic): per-device deep autoencoders learn each device''s normal
    traffic shape, so high reconstruction error flags anomalous behavior such as compromise, scanning,
    or botnet activity from a device that mediation may have admitted. Train per-device autoencoders on
    benign stream-aggregation features (packet/byte counts, inter-arrival jitter, magnitude and variance
    over multiple time windows) and alert when reconstruction error exceeds a benign-derived threshold,
    reporting the top-3 driving features for triage. A positive result is a device deviating sharply from
    its own learned norm - investigate for compromise or rogue use and isolate if confirmed; a negative
    result means traffic reconstructs within normal error. Best for stable, fixed-function devices; expect
    more variance from general-purpose hosts. Source: [N-BaIoT: Network-based Detection of IoT Botnet
    Attacks Using Deep Autoencoders, Meidan et al.](https://arxiv.org/pdf/1805.03409).'
  answer_sources:
