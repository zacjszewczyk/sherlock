  - 'NAI: Network Access Control (NAC) servers (e.g., RADIUS/NPS servers), network switches (802.1X/port-security/DHCP-snooping
    enforcement points), and core network traffic aggregation points.'
  range: Last 90 days, evaluated against a trailing 14-day per-port/segment median
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for scope in (port, segment):\n  fails = count(e6273) + count(EAP-Failure) + count(port_security_violation)\n\
      \  median = trailing_14d_median(scope, fails)\n  if fails > 3*median: alert('admission-failure spike',\
      \ scope, fails)\n  if burst_of_failures(scope) immediately_followed_by success(scope):\n    alert('failures-then-success\
      \ (possible bypass)', scope)"
- question: Is the daily percentage of unauthenticated active devices per site/segment exceeding its 30-day
    95th-percentile baseline or showing sustained upward drift over multiple days?
  context: 'Detection objective (Isolate tactic): a rising share of unauthenticated devices is a population-level
    signal that access mediation is eroding or being evaded at scale. Compute daily percentages of unauthenticated
    active devices by site and segment and compare against 30-day baselines; alert when ratios exceed
    the 95th percentile or drift upward over multiple consecutive days. Derive thresholds per segment
    because device populations and traffic signatures vary widely. A positive result indicates a segment
    where unmediated devices are accumulating - investigate enforcement gaps, switch misconfiguration,
    or a coordinated bypass; a negative result shows the authenticated/unauthenticated mix is stable.
    Pair with the per-device watchlist check to enumerate the specific offending endpoints. Source: [Classifying
    IoT Devices in Smart Environments Using Network Traffic Characteristics, Sivanathan et al.](https://www2.ee.unsw.edu.au/~vijay/pubs/jrnl/18tmc.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - Windows Event ID 6272
  - Windows Event ID 6273
  - Windows DHCP Server Audit Logs
  - Switch 802.1X/Port-Security Syslog
  - RADIUS Accounting Logs
  - 'NAI: Network Access Control (NAC) servers (e.g., RADIUS/NPS servers), network switches (802.1X/port-security/DHCP-snooping
    enforcement points), and core network traffic aggregation points.'
  range: Last 90 days, scored against a trailing 30-day per-segment baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for site, segment, day:\n  ratio = unauthenticated_active / total_active\n  base = percentile_95(trailing_30d_ratio[site,segment])\n\
      \  if ratio > base or upward_drift(ratio, days>=3):\n    alert('rising unauthenticated device ratio',\
      \ site, segment, ratio)"
- question: Which unauthenticated endpoints exceed segment-specific 99th-percentile values for session
    duration, active-day persistence, connection count, or byte volume/rate?
  context: 'Detection objective (Isolate tactic): an unauthenticated device that lingers, persists across
    days, or moves significant volume is a higher-risk mediation failure than a transient one and warrants
    immediate isolation. For unauthenticated endpoints, compute session duration, active-day persistence,
    connection count, and byte volume/rate; prioritize devices above segment-specific 99th-percentile
    values, and apply volumetric/rate thresholds to residual non-whitelisted traffic for immediate isolation
    checks. A positive result is a long-dwell, high-volume unmediated device - a prime candidate for quarantine
    and forensic review; a negative result means unauthenticated presence is brief and low-volume. Use
    segment-specific percentiles so a chatty-but-normal segment is not over-alerted. Source: [Verifying
    and Monitoring IoTs Network Behavior using MUD Profiles, Hamza et al.](https://arxiv.org/pdf/1902.02484).'
  answer_sources:
  - Zeek conn.log
