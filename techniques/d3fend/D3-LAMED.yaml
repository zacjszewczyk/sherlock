- question: Does a wireless endpoint's clock skew differ from the enrolled value for its claimed MAC,
    corroborating spoofing already suspected from RSS or RF analysis?
  context: 'Detection objective (Isolate tactic): clock skew is a location-independent hardware check
    that complements RSS and RF methods, providing independent corroboration of wireless identity spoofing.
    Apply clock-skew estimation to wireless endpoints; a skew inconsistent with the enrolled value for
    a MAC corroborates spoofing flagged by RSS or RF analysis. A positive result strengthens a spoofing
    case by adding a second, orthogonal hardware signal - raise confidence and isolate the impersonating
    device; a negative (matching) skew weakens a spoofing hypothesis or supports a benign explanation.
    Use a tolerance band for temperature-driven drift and treat this primarily as corroboration alongside
    the RSS and RF detections rather than a standalone trigger. Source: [Remote Physical Device Fingerprinting,
    Kohno et al.](https://homes.cs.washington.edu/~yoshi/papers/PDF/KoBrCl05PDF-lowres.pdf).'
