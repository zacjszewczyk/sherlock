  - 'NAI: Network Access Control (NAC) servers (e.g., RADIUS/NPS servers), network switches (802.1X/port-security/DHCP-snooping
    enforcement points), and core network traffic aggregation points.'
  range: Last 90 days, ranked against segment-specific 99th-percentile thresholds
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for d in unauthenticated_devices:\n  m = {dwell=session_duration, active_days, conn_count,\
      \ bytes, byte_rate}\n  thr = percentile_99(segment(d), m)\n  if any(m[k] > thr[k]): prioritize_isolation(d,\
      \ m)\n  if residual_nonwhitelisted_traffic(d) > rate_threshold: alert('immediate isolation', d)"
- question: Does a known MAC's estimated clock skew (ppm) from TCP/ICMP timestamps shift beyond its historical
    band, or do multiple distinct skews appear behind a single authenticated port/MAC?
  context: 'Detection objective (Isolate tactic): clock skew is a hardware-physics fingerprint that spoofing
    cannot easily forge, so it exposes cloning and undeclared hosts hiding behind a mediated port. Estimate
    per-device clock skew (ppm) from TCP/ICMP timestamps and alert when a known MAC''s skew shifts beyond
    its historical band, or when multiple distinct skews appear behind one authenticated port/MAC. A positive
    result reveals device cloning, MAC spoofing, or extra hosts behind a single authenticated port - validate
    physical device identity and isolate; a negative result means skew is consistent with the enrolled
    hardware. Allow for temperature-driven skew drift by using a tolerance band rather than a fixed value.
    Source: [Remote Physical Device Fingerprinting, Kohno et al.](https://homes.cs.washington.edu/~yoshi/papers/PDF/KoBrCl05PDF-lowres.pdf).'
