name: 'D3-LAMED: LAN Access Mediation'
id: 9078d6cb-21f5-415c-b1c8-5fb79346efcf
description: Investigate the current state of device authentication and authorization on Local Area Networks
  (wired and wireless) to find devices that have bypassed, defeated, or were never subjected to NAC/802.1X
  access mediation. This playbook helps an analyst determine whether endpoints generating internal traffic
  actually authenticated successfully, whether devices keep communicating after denial or past NAC grace
  windows, whether a second MAC is riding an authenticated switch port, whether MAC/identity spoofing
  is occurring (via DHCP lease/binding anomalies, RSS spatial correlation, RF fingerprinting, and clock-skew
  checks), and whether a device's observed behavior matches its declared/registered identity and per-device
  flow contract (MUD). It layers deterministic enforcement checks (authenticated watchlists, post-denial
  persistence, 802.1X bypass / second-MAC detection, MUD flow whitelisting), statistical baselining (admission-failure
  rates, authenticated-to-unauthenticated ratios, dwell time/volume, clock-skew bands, RSS clustering),
  and machine learning (device-type classification vs declared identity, behavioral-fingerprint drift,
  per-device autoencoders, behavior clustering, and CNN-based RF fingerprinting) so the analyst can isolate
  rogue, spoofed, cloned, or compromised devices on the LAN.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
