      \ magnitude, variance)\n  thr = benign_error_threshold(device)\nfor window in stream(device):\n\
      \  err = ae.reconstruction_error(window)\n  if err > thr: alert('per-device anomaly', device, err,\
      \ top3_features)"
- question: When endpoints are clustered on mediation features (authentication status, connection volume,
    destination entropy, protocol mix, temporal cadence), do unauthenticated devices appear as cluster
    outliers?
  context: 'Detection objective (Isolate tactic): unsupervised clustering groups devices by how they behave
    on the network, and unauthenticated outliers stand out as high-risk mediation failures that rule-based
    checks may miss. Train clustering on device features (authentication status, connection volume, destination
    entropy, protocol mix, temporal cadence), treat unauthenticated cluster outliers as high-risk mediation
    failures, and provide feature-level explanations (top-3 contributors) for analyst action. A positive
    result is an unauthenticated device whose behavior also isolates it from peers - a strong candidate
    for quarantine and investigation; a negative result means unauthenticated devices, if any, behave
    like benign peers. Re-cluster periodically as the environment changes and validate clusters against
    known device roles. Source: [Classifying IoT Devices in Smart Environments Using Network Traffic Characteristics,
    Sivanathan et al.](https://www2.ee.unsw.edu.au/~vijay/pubs/jrnl/18tmc.pdf).'
