    query: "for port in authenticated_802.1x_ports:\n  macs = distinct_src_mac(conn.log, port)\n  if len(macs)\
      \ > expected_device_count(port): alert('second MAC behind authed port', port, macs)\n  if mab_fallback(port)\
      \ and port in eap_expected_ports: alert('MAB used where EAP expected', port)\nfor mac in authenticated_macs:\n\
      \  if seen_on_multiple(mac, ports/vlans): alert('authed MAC reused on other port/VLAN', mac)"
- question: Does any device generate flows that fall outside its per-device Manufacturer Usage Description
    (MUD) / behavioral flow profile of allowed endpoints, ports, directions, and protocols?
  context: 'Detection objective (Isolate tactic): a per-device admission contract (MUD profile) turns
    ''what the device is allowed to talk to'' into an enforceable whitelist; any deviation is a mediation
    violation. Generate or import a per-device MUD/behavioral flow profile (allowed endpoints, ports,
    directions, protocols), statically verify it for internal conflicts, then alert on any Zeek conn.log
    flow that falls outside the device''s profile. A positive result means a device is communicating outside
    its declared contract - possible compromise, lateral movement, or a misrepresented device - and is
    a candidate for isolation; a negative result means all flows conform to the profile. Best applied
    to fixed-function/IoT/OT devices whose behavior is narrow and predictable; baseline general-purpose
    hosts more loosely. Source: [Verifying and Monitoring IoTs Network Behavior using MUD Profiles, Hamza
    et al.](https://arxiv.org/pdf/1902.02484).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - Windows Event ID 6272
