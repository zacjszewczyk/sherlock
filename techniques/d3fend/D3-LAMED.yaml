  - 'NAI: Network Access Control (NAC) servers (e.g., RADIUS/NPS servers), network switches (802.1X/port-security/DHCP-snooping
    enforcement points), and core network traffic aggregation points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "mud[device] = {allowed_endpoints, ports, directions, protocols}\nstatic_verify(mud[device])\
      \  // flag internal conflicts\nfor f in conn.log:\n  if not matches(mud[f.device], f.dst, f.port,\
      \ f.dir, f.proto):\n    alert('MUD flow violation', device=f.device, flow=f)"
- question: Are per-port or per-segment rates of denied RADIUS authentication (Windows Event ID 6273),
    EAP-Failure, and port-security violations spiking above baseline, or showing a burst of failures immediately
    followed by a success?
  context: 'Detection objective (Isolate tactic): treat authentication failure as a distinct signal -
    sustained or bursty failures reveal credential guessing, rogue-device probing, or NAC bypass attempts,
    and a failure burst followed by a success can mark a defeated control. Baseline per-port/segment rates
    of denied RADIUS auth (Windows Event ID 6273), EAP-Failure, and port-security violations, then alert
    on spikes (e.g., >3x the 14-day median) or a failures-then-success pattern. A positive result flags
    a port/segment under authentication pressure that may precede or accompany unauthorized admission
    - investigate the source device; a negative result shows failure rates within normal envelope. Tune
    per segment because failure baselines differ by device population. Source: [An Initial Security Analysis
    of the IEEE 802.1X Standard, Mishra and Arbaugh](https://www.cs.umd.edu/~waa/1x.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - Windows Event ID 6272
  - Windows Event ID 6273
  - Windows DHCP Server Audit Logs
  - Switch 802.1X/Port-Security Syslog
