questions:
- question: Are there internal endpoints generating traffic on the LAN without a corresponding successful
    RADIUS/802.1X authentication event inside the NAC grace window (e.g., 60 seconds)?
  context: 'Detection objective (Isolate tactic): establish per-session device authentication and segmentation
    as the deterministic enforcement floor and catch any device that talks on the LAN without first passing
    NAC. Build an authenticated MAC/IP/VLAN watchlist from Windows Event ID 6272 (NPS granted access)
    and DHCP audit mappings, then compare Zeek conn.log internal traffic against it. Alert when an endpoint
    sources internal traffic but has no valid authentication event within the grace window, and include
    first-seen time, source MAC, and the affected VLAN/subnet so responders can isolate the port. A positive
    result is a device on the wire that NAC never admitted - a rogue or mediation-failed host that should
    be quarantined; a negative result means every active talker has a backing auth event. Tune the grace
    window to supplicant timing so legitimate boot/onboarding delays are not flagged. Source: [Guide to
    a Secure Enterprise Network Landscape (NIST SP 800-215), Chandramouli](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-215.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - Windows Event ID 6272
  - Windows Event ID 6273
  - Windows DHCP Server Audit Logs
  - Switch 802.1X/Port-Security Syslog
  - RADIUS Accounting Logs
  - 'NAI: Network Access Control (NAC) servers (e.g., RADIUS/NPS servers), network switches (802.1X/port-security/DHCP-snooping
    enforcement points), and core network traffic aggregation points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "auth_watchlist = set((mac,ip,vlan) from e6272 within grace_window joined DHCP audit)\nfor\
      \ s in conn.log where is_internal(s.id.orig_h):\n  if (s.mac, s.id.orig_h, s.vlan) not in auth_watchlist\n\
      \     and no e6272 for s.mac within 60s before first_seen(s):\n    alert('unauthenticated device\
      \ traffic', first_seen=s.ts, mac=s.mac, vlan=s.vlan, subnet=s.subnet)"
- question: Do any devices keep communicating on the LAN after an explicit authentication denial (Windows
    Event ID 6273) or after an EAPOL-Logout, indicating they are riding an authenticated 802.1X port past
    the grace period?
  context: 'Detection objective (Isolate tactic): an 802.1X port can be hijacked after EAP success, so
    a denied or de-authenticated device that keeps sending frames is a strong port-riding/session-hijack
    signal. Identify devices with denied (Windows Event ID 6273) or missing authentication that continue
    communicating past the NAC grace period, and additionally alert on continued frames following an EAPOL-Logout.
    Escalate persistent offenders and attach destination criticality to set response priority for isolation.
    A positive result means a device the network explicitly rejected (or that logged out) is still on
    the segment - prioritize port shutdown or quarantine; a negative result means denials are honored
    and traffic stops as expected. Source: [An Initial Security Analysis of the IEEE 802.1X Standard,
    Mishra and Arbaugh](https://www.cs.umd.edu/~waa/1x.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - Windows Event ID 6272
  - Windows Event ID 6273
  - Windows DHCP Server Audit Logs
  - Switch 802.1X/Port-Security Syslog
  - RADIUS Accounting Logs
  - 'NAI: Network Access Control (NAC) servers (e.g., RADIUS/NPS servers), network switches (802.1X/port-security/DHCP-snooping
    enforcement points), and core network traffic aggregation points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "denied = events e6273 (access denied) and EAPOL-Logout from switch syslog\nfor d in denied:\n\
      \  later = conn.log where mac==d.mac and ts > d.ts + grace_period\n  if later not empty:\n    sev\
      \ = destination_criticality(later.dest)\n    alert('post-denial communication persistence', mac=d.mac,\
      \ after=d.ts, severity=sev)"
- question: Are there rapid MAC changes on the same DHCP lease/IP, conflicting lease requests, or MAC<->IP
    binding violations that indicate MAC spoofing or address conflicts on the LAN?
  context: 'Detection objective (Isolate tactic): MAC spoofing is a core way to defeat MAC-based admission
    and ride another device''s authorization. Analyze Zeek dhcp.log and Windows DHCP Server audit logs
    for rapid MAC changes against a single IP lease, conflicting lease requests, and MAC<->IP binding
    violations as seen by DHCP snooping / dynamic ARP inspection. Alert on high-frequency changes consistent
    with identity-based attack indicators. A positive result (a lease whose MAC flips repeatedly, or a
    binding violation) points to spoofing or a rogue device impersonating a trusted host - isolate and
    verify; a negative result reflects stable, one-MAC-per-lease behavior. Tune for legitimate churn such
    as dual-boot, virtualization, or randomized client MACs. Source: [Detecting and Localizing Identity-Based
    Attacks in Wireless and Sensor Networks, Chen et al.](https://www.winlab.rutgers.edu/~yychen/papers/Detecting%20and%20Localizing%20Identity-Based%20Attacks%20in%20Wireless%20and%20Sensor%20Networks.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - Windows Event ID 6272
  - Windows Event ID 6273
  - Windows DHCP Server Audit Logs
  - Switch 802.1X/Port-Security Syslog
  - RADIUS Accounting Logs
  - 'NAI: Network Access Control (NAC) servers (e.g., RADIUS/NPS servers), network switches (802.1X/port-security/DHCP-snooping
    enforcement points), and core network traffic aggregation points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for ip, window in dhcp.log + DHCP audit:\n  macs = distinct_mac_per_lease(ip, window)\n  if\
      \ change_rate(macs) > spoof_threshold or binding_violation(ip,mac) or lease_conflict(ip):\n    alert('MAC\
      \ spoof / lease-binding anomaly', ip=ip, macs=macs, rate=change_rate(macs))"
- question: Is more than one distinct source MAC sending traffic on a single 802.1X-authenticated access
    port, is MAB fallback used where EAP was expected, or is an authenticated MAC reused on another port/VLAN?
  context: 'Detection objective (Isolate tactic): all three patterns are symptomatic of NAC bypass or
    session hijacking - e.g., a hub/rogue device behind an authenticated phone, MAC Authentication Bypass
    standing in for a supplicant, or a cloned MAC appearing elsewhere. From switch 802.1X/port-security
    syslog and Zeek conn.log, alert when a single authenticated access port sources multiple distinct
    MACs, when MAB fallback is used for a device expected to perform EAP, or when an authenticated MAC
    is seen on a different port/VLAN. A positive result indicates a second device piggybacking on a legitimate
    authentication or an authenticated identity being reused - isolate the port and validate device count;
    a negative result confirms one device per authenticated port. Account for legitimate IP-phone-plus-PC
    daisy chains with proper voice/data VLAN policy. Source: [An Initial Security Analysis of the IEEE
    802.1X Standard, Mishra and Arbaugh](https://www.cs.umd.edu/~waa/1x.pdf).'
  answer_sources:
  - Zeek conn.log
