      \ == unauthenticated:\n    alert('high-risk mediation outlier', d, top3_contributors(d))"
- question: On wireless segments, do received-signal-strength (RSS) vectors for a single claimed identity
    form multiple spatial clusters across APs/monitors, indicating the same MAC is transmitting from more
    than one physical location?
  context: 'Detection objective (Isolate tactic): on wireless LANs, MAC/identity spoofing that bypasses
    access mediation is exposed by physical-layer signals forgery cannot replicate. Collect RSS vectors
    per claimed identity across multiple APs/monitors and cluster them with K-means: a single physical
    transmitter forms one tight cluster while a spoofed identity emitted from another location forms multiple
    clusters. Alert when inter-cluster centroid distance exceeds a calibrated threshold - an approach
    robust to attackers varying transmit power. A positive result means one MAC is being radiated from
    two places at once - clear evidence of spoofing - so isolate/de-authenticate and locate both transmitters;
    a negative result means the identity maps to a single physical location. Calibrate thresholds per
    site to account for multipath and AP placement. Source: [Detecting and Localizing Identity-Based Attacks
    in Wireless and Sensor Networks, Chen et al.](https://www.winlab.rutgers.edu/~yychen/papers/Detecting%20and%20Localizing%20Identity-Based%20Attacks%20in%20Wireless%20and%20Sensor%20Networks.pdf).'
