name: 'D3-PFV: Peripheral Firmware Verification'
id: 591c59eb-3ab5-4430-8192-a4ae56668028
description: Investigate the integrity of peripheral and platform firmware (webcams, NICs, storage/USB
  controllers, BMCs, routers/switches and similar updatable devices) to detect unauthorized modification,
  supply-chain compromise, and stealth firmware implants. This playbook helps an analyst confirm whether
  running and stored firmware matches approved per-model golden hashes / Reference Integrity Measurements,
  whether only signed and version-monotonic images are accepted, and whether TPM measured-boot attestation
  deviates from the signed RIM database. It also covers statistical detection of mismatch/failure rate
  spikes, entropy and fuzzy-hash screening of unknown images, software-based attestation timing checks,
  and machine-learning risk scoring with feature attribution. Finally it corroborates firmware-verification
  mismatches with post-change device behavior - new listening services/ports, anomalous outbound volume
  or beaconing, and anomalous host process/device-interface activity - to catch implants that survived
  or evaded static checks.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
