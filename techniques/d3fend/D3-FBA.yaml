name: 'D3-FBA: Firmware Behavior Analysis'
id: 6f432793-d15f-409b-972e-181497e52d8a
description: Investigate suspected firmware-level compromise of embedded and critical infrastructure devices
  (network appliances, peripherals, PLCs, hypervisors, and server platforms) by detecting behavior that
  deviates from the device's known-good baseline. Because firmware rootkits can subvert on-device checks,
  this playbook pairs hard-to-suppress external network and host telemetry (suspicious beaconing, unexpected
  listeners and destinations, elevated DNS/connection failure rates, and crash/reboot instability) with
  on-device integrity, attestation, and hardware-execution evidence (signed golden measurements, per-model
  hash allowlists, timing challenge-response attestation, hardware performance counters, and TPM/PCR event
  logs). It establishes what data is available and what baselines can be built, then layers deterministic
  integrity floors (threat-intel matching, communication allowlists, signature/attestation verification)
  with statistical baselining (periodicity, failure-rate, latency, and change-point analysis) and machine-learning
  anomaly/forecasting models with SHAP-based explainability to surface and triage firmware-induced behavioral
  regime shifts.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
