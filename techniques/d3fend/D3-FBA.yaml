questions:
- question: Does outbound network activity from critical firmware-driven systems (Zeek conn.log connections
    and Zeek dns.log lookups) match any known firmware-malware command-and-control indicators such as
    known-bad IPs, domains, or destination ports?
  context: 'This is the deterministic detection floor for the Detect tactic. Firmware implants must eventually
    communicate with attacker infrastructure, and matching device egress against curated threat intelligence
    for known firmware C2 yields high-confidence, low-false-positive hits. Run signature/misuse matching
    of known-bad indicators as the always-on baseline. A positive match (any conn.log or dns.log record
    resolving or connecting to a flagged indicator) is a strong, actionable signal of firmware compromise
    and should be alerted immediately; a clean negative does not clear the device but removes the most
    obvious C2. Because firmware rootkits subvert on-device checks, this network-side corroboration is
    hard for the implant to suppress. Sources: [A Survey of Intrusion Detection Techniques for Cyber-Physical
    Systems](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf); [Ghost in the PLC](https://www.blackhat.com/docs/eu-16/materials/eu-16-Abbasi-Ghost-In-The-PLC-Designing-An-Undetectable-Programmable-Logic-Controller-Rootkit-wp.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 6008
  - Windows Event ID 41
  - Windows Event ID 1001
  - 'NAI: Critical infrastructure endpoints, including servers and hypervisors, and network choke points
    monitoring their traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  for rec in conn.log, dns.log:\n    if rec.dest_ip in TI_firmware_c2_ips\n       OR rec.query\
      \ in TI_firmware_c2_domains\n       OR rec.dest_port in TI_firmware_c2_ports:\n      alert(high_confidence,\
      \ rec)"
- question: Has any critical firmware-level system opened a new listening service or initiated communication
    with an external endpoint or management service that is not on its expected per-device (or per-device-class)
    allowlist of services, listening ports, and outbound destinations?
  context: 'Embedded firmware exhibits predictable, narrow communication patterns, so a specification-based
    allowlist built from emulated or observed known-good firmware behavior keeps false positives low while
    exposing novel implant activity. For the Detect tactic, deviations from the baseline - a new open
    listener, an unapproved outbound destination, or contact with an unexpected management service - are
    leading indicators of a firmware backdoor or C2 channel. A positive result (any service/destination
    outside the device''s allowlist) warrants investigation; the absence of deviations supports baseline
    conformance. Maintain the allowlist per model so legitimate firmware behavior is not repeatedly re-flagged.
    Sources: [Automated Dynamic Firmware Analysis at Scale (FIRMADYNE)](https://arxiv.org/abs/1511.03609);
    [A Survey of Intrusion Detection Techniques for Cyber-Physical Systems](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 6008
  - Windows Event ID 41
  - Windows Event ID 1001
  - 'NAI: Critical infrastructure endpoints, including servers and hypervisors, and network choke points
    monitoring their traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  baseline = allowlist[device_class].{services, listen_ports, dest_endpoints}\n  for evt\
      \ in conn.log:\n    if evt.listen_port not in baseline.listen_ports\n       OR evt.dest_endpoint\
      \ not in baseline.dest_endpoints:\n      alert('unapproved firmware comms', evt)"
- question: Is any host-to-destination pair from a critical system exhibiting highly periodic (low-jitter)
    beaconing intervals indicative of automated firmware C2, when measured by coefficient-of-variation
    and FFT-based periodicity analysis of inter-connection intervals?
  context: 'Firmware implants frequently beacon to C2 on regular cadences. For the Detect tactic, building
    an inter-connection-interval time series per host-destination pair and extracting jitter-robust periodicity
    with FFT plus multi-stage filtering reveals automated callbacks that blend into normal volume. Flag
    extremely low-variance series (for example bottom 1st-percentile coefficient-of-variation) or a dominant
    FFT peak outside known legitimate services. Capture Volume (bytes per connection and total bytes/hour)
    and Frequency (connections/min) alongside cadence to characterize the channel. A positive result (strong
    periodicity to a non-allowlisted destination) is a high-value lead; legitimate periodic services (NTP,
    update checks) should be whitelisted to control false positives. Sources: [BAYWATCH: Robust Beaconing
    Detection in Large-Scale Enterprise Networks](https://dsail.kaist.ac.kr/files/WWW17.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 6008
  - Windows Event ID 41
  - Windows Event ID 1001
  - 'NAI: Critical infrastructure endpoints, including servers and hypervisors, and network choke points
    monitoring their traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for (host,dest) in conn.log:\n    intervals = diff(sorted(conn_ts))\n    cv = std(intervals)/mean(intervals)\n\
      \    peak = max(fft_power(intervals))\n    if (cv < p01(cv_all) OR peak > peak_threshold)\n    \
      \   AND dest not in legit_services:\n      alert('periodic beacon', host, dest, bytes_per_hr, conns_per_min)"
- question: Are failure-mode and instability metrics - DNS NXDOMAIN rate, failed/blocked outbound connections
    (conn_state S0/REJ/RSTO), and abrupt reboot/crash counts (Windows Event ID 6008, 41, 1001) - elevated
    above each host's established norm?
  context: 'Firmware implants commonly generate elevated DNS resolution failures (algorithmically generated
    or stale C2 domains), blocked or refused outbound connection attempts, and device instability. For
    the Detect tactic, these failure-mode signals should be baselined explicitly and treated as distinct
    indicators rather than discarded as noise. Alert when NXDOMAIN rate, S0/REJ/RSTO connection counts,
    or unexpected shutdown/crash events (6008 unexpected shutdown, 41 kernel-power, 1001 bugcheck) deviate
    from the per-host norm. A positive deviation, especially across multiple of these signals at once,
    suggests firmware-level compromise; quiet baselines reduce suspicion. Correlate with the beaconing
    and threat-intel checks to raise confidence. Sources: [BAYWATCH: Robust Beaconing Detection in Large-Scale
    Enterprise Networks](https://dsail.kaist.ac.kr/files/WWW17.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 6008
  - Windows Event ID 41
  - Windows Event ID 1001
  - 'NAI: Critical infrastructure endpoints, including servers and hypervisors, and network choke points
    monitoring their traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  nx_rate = count(dns.rcode==NXDOMAIN)/window per host\n  fail_conn = count(conn_state\
      \ in {S0,REJ,RSTO}) per host\n  crash = count(EventID in {6008,41,1001}) per host\n  for host:\n\
      \    if nx_rate > baseline[host].nx + k*sigma\n       OR fail_conn > baseline[host].fail + k*sigma\n\
      \       OR crash > baseline[host].crash + k*sigma:\n      alert('firmware instability/failure spike',\
      \ host)"
- question: Using change-point detection on rolling baselines of Windows Event IDs 6008, 41, and 1001,
    can a sustained onset of increased crash/restart activity be localized in time - particularly one
    coincident with suspicious outbound traffic?
  context: 'A single reboot is noise; a durable regime shift to frequent crashes is signal. For the Detect
    tactic, applying change-point detection (CUSUM, PELT, or Bayesian online change-point) to the frequency
    of unexpected shutdown (6008), kernel-power (41), and bugcheck (1001) events pinpoints the time at
    which a host''s stability changed, providing an explainable ''instability began at T'' onset with
    confidence. This is especially compelling when the change-point aligns with the start of suspicious
    beaconing or threat-intel matches, linking instability to firmware compromise. A detected change-point
    with a sustained higher rate is the positive result; a stationary baseline is negative. Use the onset
    timestamp to scope correlation across the other questions. Sources: [A Survey of Methods for Time
    Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 6008
  - Windows Event ID 41
  - Windows Event ID 1001
  - 'NAI: Critical infrastructure endpoints, including servers and hypervisors, and network choke points
    monitoring their traffic.'
  range: Last 90 days; pivot to a window centered on any detected change-point
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  series = rolling_count(EventID in {6008,41,1001}) per host\n  cp = changepoint(series,\
      \ method=PELT|CUSUM|BOCPD)\n  for t in cp:\n    if mean(series after t) > mean(series before t):\n\
      \      alert('crash-rate onset', host, t, confidence)"
- question: Do unsupervised forecasting/reconstruction models trained on normal critical-host stability
    and telemetry streams produce prediction-versus-observation errors that exceed a tuned percentile
    threshold, indicating a firmware-induced behavioral regime shift?
  context: 'When deterministic and simple-statistical methods miss subtle multivariate drift, learned
    models of normal behavior catch it. For the Detect tactic, train unsupervised reconstruction or forecasting
    models (1D-CNN, LSTM, or SARIMA) on a critical host''s normal stability and telemetry, then alert
    when the prediction error rises above a tuned percentile (for example 99th). A large, sustained error
    indicates the host has moved outside its learned normal envelope, consistent with firmware-induced
    behavior change. The positive result is an error spike beyond threshold; a low, stable error supports
    normal operation. Tune the threshold on a clean baseline period and validate against known maintenance
    windows to limit false positives. Sources: [Detecting Cyberattacks in Industrial Control Systems Using
    Convolutional Neural Networks](https://arxiv.org/abs/1806.08110).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 6008
  - Windows Event ID 41
  - Windows Event ID 1001
  - 'NAI: Critical infrastructure endpoints, including servers and hypervisors, and network choke points
    monitoring their traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = train_unsupervised(normal_host_telemetry)  # 1D-CNN | LSTM | SARIMA\n  err =\
      \ |observed - model.predict(observed)|\n  if err > percentile(err_baseline, 99):\n    alert('firmware\
      \ behavioral regime shift', host, err)"
- question: When beacon periodicity/CV, destination rarity, DNS/NXDOMAIN behavior, byte-volume ratios,
    and host-instability features are fused into a prioritized firmware-compromise risk score (CT-HMM
    for drifting/jittered beacon timing) with SHAP attribution, which hosts rank highest and what top-3
    features drive each alert?
  context: 'Individual weak signals become strong when fused. For the Detect tactic, combine beacon periodicity
    and coefficient-of-variation, destination rarity, DNS/NXDOMAIN behavior, byte-volume ratios, and host
    instability into a single prioritized firmware-compromise risk score, using continuous-time hidden
    Markov models to capture drifting and jittered beacon state-timing transitions that defeat simple
    periodicity tests. Attach SHAP-based attribution so every alert names its top-3 contributing features,
    making triage explainable rather than an opaque score. This ML layer runs in parallel with - never
    replacing - the deterministic allowlist and threat-intel floor. The positive result is a high-ranked
    host whose SHAP features point to coherent firmware-C2 behavior; analysts work the ranked queue top-down.
    Sources: [NetSpectra Sentinel: CT-HMM for C2 Beaconing Detection](https://www.sciencedirect.com/science/article/pii/S1084804525000244);
    [Explainable Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930);
    [A Survey of Intrusion Detection Techniques for Cyber-Physical Systems](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 6008
  - Windows Event ID 41
  - Windows Event ID 1001
  - 'NAI: Critical infrastructure endpoints, including servers and hypervisors, and network choke points
    monitoring their traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  feats = [beacon_cv, dest_rarity, nxdomain_rate, byte_ratio, instability]\n  state =\
      \ CT_HMM(beacon_timing)  # captures jitter/drift\n  score = risk_model(feats, state)\n  top3 = SHAP(risk_model,\
      \ feats)\n  rank hosts by score desc; alert with top3 attribution\n  # runs in parallel with deterministic\
      \ floor, not instead of it"
- question: Does the running and stored firmware on each device match its authoritative per-model signed
    'golden' reference measurement, with all firmware updates cryptographically authenticated via a Root
    of Trust for Detection?
  context: 'This is the cryptographic integrity floor for the Detect tactic, aligned with NIST SP 800-193
    platform firmware resiliency guidance. Enforce signed firmware updates and verify both running and
    stored firmware against per-model golden measurements through a Root of Trust for Detection. Any measurement
    or signature mismatch is a definitive tamper indicator and must be treated as a hard, non-suppressible
    alert. A positive result (mismatch or failed signature) means the firmware is not authentic; a clean
    verification is the expected state. This deterministic check is the strongest single signal of firmware
    modification when the Root of Trust itself is intact, and it underpins the statistical/ML layers that
    catch what signatures miss. Sources: [NIST SP 800-193: Platform Firmware Resiliency Guidelines](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf);
    [Ghost in the PLC](https://www.blackhat.com/docs/eu-16/materials/eu-16-Abbasi-Ghost-In-The-PLC-Designing-An-Undetectable-Programmable-Logic-Controller-Rootkit-wp.pdf).'
  answer_sources:
  - Firmware measurement/attestation logs
  - TPM/PCR event logs
  - Hardware performance counter telemetry
  - Device management attestation responses
  - Firmware update/image inventory
  - 'NAI: Embedded/firmware-driven devices (network appliances, peripherals, PLCs, hypervisor/server platforms)
    and their management/attestation servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  for dev in devices:\n    m = measure(running_fw) ; s = measure(stored_fw)\n    if m\
      \ != golden[dev.model] OR s != golden[dev.model]\n       OR not verify_signature(dev.last_update):\n\
      \      alert('firmware integrity mismatch', dev)  # hard, non-suppressible"
- question: Is every device's firmware image present on the approved per-model allowlist of exact hashes
    and fuzzy hashes (ssdeep), and does its entropy and structure (via magic-byte unpacking and Shannon
    entropy) match the model baseline rather than indicating unexpected compressed/encrypted payloads?
  context: 'Beyond signed measurements, maintaining exact-hash and fuzzy-hash (ssdeep) allowlists per
    device model catches images that are close-but-modified, and entropy/structure analysis exposes injected
    compressed or encrypted blobs hidden in firmware. For the Detect tactic, use magic-byte unpacking
    and Shannon entropy to separate legitimate code from anomalous packed/encrypted regions, then alert
    on any image not on the allowlist or whose entropy/structure deviates from the model baseline. A positive
    result (unknown hash, high-similarity-but-not-exact match, or anomalous entropy) flags a tampered
    or unauthorized image; an exact allowlist match with baseline entropy is clean. This complements signature
    checks where golden measurements are unavailable. Sources: [A Large-Scale Analysis of the Security
    of Embedded Firmwares](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).'
  answer_sources:
  - Firmware measurement/attestation logs
  - TPM/PCR event logs
  - Hardware performance counter telemetry
  - Device management attestation responses
  - Firmware update/image inventory
  - 'NAI: Embedded/firmware-driven devices (network appliances, peripherals, PLCs, hypervisor/server platforms)
    and their management/attestation servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  for img in firmware_inventory:\n    if sha256(img) not in allowlist[img.model].exact:\n\
      \      if max_ssdeep(img, allowlist[img.model].fuzzy) < sim_threshold\n         OR shannon_entropy(unpack(img))\
      \ outside baseline[img.model]:\n        alert('unauthorized/abnormal firmware image', img)"
- question: When a nonce-seeded software attestation challenge is issued, does the firmware return the
    correct checksum computed over all of its memory including the nonce?
  context: 'Software-only attestation (VIPER-style) verifies peripheral firmware integrity by forcing
    the device to compute a checksum over all of its memory, seeded with a fresh nonce so replays are
    impossible. For the Detect tactic, an incorrect checksum is a definitive tamper indicator: malicious
    firmware cannot reproduce the genuine memory contents and checksum. The positive result is any checksum
    mismatch (or a missing/late response handled by the timing question); a correct checksum supports
    integrity. Because the nonce defeats precomputation and replay, this is a strong on-device check,
    though it should be corroborated by external telemetry since firmware-resident malware may attempt
    to subvert the attestation routine itself. Sources: [VIPER: Verifying the Integrity of PERipherals''
    Firmware](https://dl.acm.org/doi/pdf/10.1145/2046707.2046711).'
  answer_sources:
  - Firmware measurement/attestation logs
  - TPM/PCR event logs
  - Hardware performance counter telemetry
  - Device management attestation responses
  - Firmware update/image inventory
  - 'NAI: Embedded/firmware-driven devices (network appliances, peripherals, PLCs, hypervisor/server platforms)
    and their management/attestation servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  nonce = random()\n  resp = challenge(dev, nonce)\n  expected = checksum(golden_memory[dev.model],\
      \ nonce)\n  if resp.checksum != expected:\n    alert('attestation checksum mismatch - firmware tamper',\
      \ dev)"
- question: Does any device's attestation response latency fall outside the empirical timing band established
    from known-good firmware (for example beyond 3 sigma or the 99th percentile)?
  context: 'A tampered or proxied firmware cannot compute the attestation checksum within the genuine
    timing envelope - it must either emulate the original (adding delay) or forward the challenge elsewhere.
    For the Detect tactic, measure attestation response latency per device and build an empirical timing
    band from known-good firmware, then flag responses outside that band. A positive result (latency beyond
    3 sigma or the 99th percentile) is strong evidence that the responding firmware is not the genuine,
    unmodified image, even if it returns a plausible checksum. In-band latency supports integrity. Build
    the band per device model and account for network path variance so legitimate jitter does not trigger
    false positives. Sources: [VIPER: Verifying the Integrity of PERipherals'' Firmware](https://dl.acm.org/doi/pdf/10.1145/2046707.2046711).'
  answer_sources:
  - Device management attestation responses
  - Firmware measurement/attestation logs
  - 'NAI: Embedded/firmware-driven devices (network appliances, peripherals, PLCs, hypervisor/server platforms)
    and their management/attestation servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  band = fit_timing(known_good_latency[dev.model])\n  if resp.latency > band.mean + 3*band.sigma\n\
      \     OR resp.latency > percentile(band, 99):\n    alert('abnormal attestation latency', dev, resp.latency)"
- question: Do per-routine Hardware Performance Counter events (instructions retired, branches, cache
    references) deviate from the known-good reference distributions beyond a tuned tolerance for any firmware
    routine?
  context: 'Embedded firmware execution is highly deterministic, so the number of low-level hardware events
    during a given routine is stable and predictable. For the Detect tactic, ConFirm-style HPC monitoring
    collects instructions retired, branches taken, and cache references per firmware routine and compares
    them against known-good reference distributions. Any modification - inserted code, altered control
    flow - perturbs these counts beyond a tuned tolerance. A positive result (counts outside tolerance
    for a routine) indicates the firmware executing is not the reference firmware; in-tolerance counts
    support integrity. This is a powerful behavioral check precisely because firmware determinism leaves
    little room for benign variance, but it requires per-device/model profiling and tuning to set tolerances.
    Sources: [ConFirm: Detecting Firmware Modifications Using Hardware Performance Counters](http://sites.nyuad.nyu.edu/moma/pdfs/pubs/C22.pdf).'
  answer_sources:
  - Hardware performance counter telemetry
  - 'NAI: Embedded/firmware-driven devices (network appliances, peripherals, PLCs, hypervisor/server platforms)
    and their management/attestation servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for routine in firmware_routines:\n    hpc = {instr_retired, branches, cache_refs}\n\
      \    if any(|hpc[c] - ref[dev.model][routine][c]| > tol[c]):\n      alert('HPC deviation - firmware\
      \ modification', dev, routine, hpc)"
- question: Can change-point detection on HPC counts, attestation latency, and PCR-measurement event rates
    localize the time at which firmware behavior shifted, yielding an explainable 'behavior changed at
    T' onset with confidence?
  context: 'Rather than only asking whether current firmware behavior is anomalous, this question pinpoints
    when it changed. For the Detect tactic, apply change-point detection (CUSUM, PELT, or Bayesian online
    change-point) to time series of HPC counts, attestation latency, and TPM/PCR measurement event rates
    to localize the onset of a behavioral shift. The output - a timestamp T with confidence - is directly
    actionable for incident scoping: it bounds when the firmware was likely modified and lets analysts
    correlate with update events, maintenance, or external telemetry. A detected change-point is the positive
    result; a stationary series across all three metrics is negative. Align detected onsets with firmware
    update inventory to distinguish authorized changes from compromise. Sources: [A Survey of Methods
    for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Hardware performance counter telemetry
  - Device management attestation responses
  - TPM/PCR event logs
  - Firmware update/image inventory
  - 'NAI: Embedded/firmware-driven devices (network appliances, peripherals, PLCs, hypervisor/server platforms)
    and their management/attestation servers.'
  range: Last 90 days; pivot to a window centered on any detected change-point
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for metric in [hpc_counts, attest_latency, pcr_event_rate]:\n    cp = changepoint(metric,\
      \ method=CUSUM|PELT|BOCPD)\n    for t in cp:\n      alert('firmware behavior shift', dev, metric,\
      \ t, confidence)\n  # correlate t with firmware_update_inventory"
- question: Do classifiers and unsupervised reconstruction models over firmware execution telemetry (HPC
    event vectors) separate genuine from modified firmware, with prediction-error spikes beyond a tuned
    percentile and SHAP attribution naming the top-3 diverging counters/features?
  context: 'Where tolerance-based HPC comparison is too rigid, learned models capture the joint distribution
    of execution telemetry. For the Detect tactic, train classifiers on HPC event vectors to separate
    genuine from modified firmware execution (ConFirm), and model normal firmware telemetry with unsupervised
    reconstruction (1D-CNN or autoencoder), alerting when prediction error spikes beyond a tuned percentile.
    Attach SHAP attribution so each alert names the top-3 diverging counters or features, making the verdict
    explainable for triage. The positive result is a ''modified'' classification or a reconstruction-error
    spike with coherent feature attribution; normal reconstruction supports integrity. Critically, run
    this ML layer in parallel with - not instead of - the signed-measurement and hash-allowlist deterministic
    floor, so a model miss never removes the cryptographic guarantee. Sources: [ConFirm: Detecting Firmware
    Modifications Using Hardware Performance Counters](http://sites.nyuad.nyu.edu/moma/pdfs/pubs/C22.pdf);
    [Detecting Cyberattacks in Industrial Control Systems Using Convolutional Neural Networks](https://arxiv.org/abs/1806.08110);
    [Explainable Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930);
    [NIST SP 800-193: Platform Firmware Resiliency Guidelines](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).'
  answer_sources:
  - Hardware performance counter telemetry
  - Firmware measurement/attestation logs
  - 'NAI: Embedded/firmware-driven devices (network appliances, peripherals, PLCs, hypervisor/server platforms)
    and their management/attestation servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  clf = train(genuine_hpc, modified_hpc)\n  ae = train_unsupervised(normal_fw_telemetry)\
      \  # 1D-CNN / autoencoder\n  if clf.predict(hpc)=='modified' OR recon_err(ae,hpc) > percentile(99):\n\
      \    top3 = SHAP(model, hpc)\n    alert('firmware modification (ML)', dev, top3)\n  # parallel to\
      \ signed-measurement + hash-allowlist floor"
