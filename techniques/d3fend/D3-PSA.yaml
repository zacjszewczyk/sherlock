name: 'D3-PSA: Process Spawn Analysis'
id: c797e40f-3630-46eb-bf8f-8548553270f7
description: Investigate potentially unauthorized or malicious software by analyzing the attributes of
  newly spawned processes. This playbook helps an analyst hunt for abnormal process parentage, masqueraded
  or renamed executables, executions from user-writable or temporary paths, and obfuscated or high-entropy
  command lines that indicate malware, living-off-the-land binary (LOLBin) abuse, or hands-on-keyboard
  activity. It layers deterministic signature and parent/child rules over statistical baselines (spawn
  rarity, command entropy, volume/frequency/failure-state profiling, structural tree rarity, and correlated
  network behavior) and machine-learning approaches (supervised classification, command-line NLP, active-learning
  LOLBin models, and provenance-graph detection) so that an analyst can detect, triage, and root-cause
  unauthorized process execution from first-party process creation telemetry on Windows, Linux, and macOS
  endpoints.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any newly created processes launching with names, image paths, or command-line tokens
    that match curated indicators for known malware families, LOLBin abuse, or encoded payload-launch
    flags?
  context: This is the deterministic first line of detection for the Detect tactic. The analyst compares
    Windows Event ID 4688 and Sysmon Event ID 1 process names and full command lines against a curated
    indicator set covering malware families, living-off-the-land binary abuse, and encoded/obfuscated
    payload launchers such as 'powershell -enc' or '-w hidden', 'certutil -urlcache'/'-decode', and 'regsvr32
    scrobj.dll', plus suspicious administrative tooling (per CAR-2013-07-001 Suspicious Arguments and
    CAR-2020-05-003 Rare LolBAS Command Lines). A positive match is a high-confidence indicator that unauthorized
    software ran; a negative result simply means no known-bad signature fired and the statistical/ML layers
    should still be consulted. Because attackers rename binaries, inspect arguments rather than relying
    on the image name alone.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search EventID IN (4688, 1)\n| eval cmd=lower(CommandLine), img=lower(NewProcessName)\n| where\
      \ match(cmd, \"-enc |-encodedcommand|-w hidden|-windowstyle hidden\")\n      OR match(cmd, \"certutil.*(-urlcache|-decode|-split)\"\
      )\n      OR (img LIKE \"%regsvr32.exe\" AND match(cmd, \"scrobj.dll|/i:http\"))\n      OR cidr_lookup(img,\
      \ malware_indicator_list)\n| table _time, host, User, ParentImage, NewProcessName, CommandLine"
  - technology: Sysmon/EQL pseudocode
    query: "process where event_type == \"start\" and\n  (process.command_line : (\"*-enc *\", \"*-w hidden*\"\
      , \"*certutil* -urlcache*\", \"*certutil* -decode*\")\n   or (process.name == \"regsvr32.exe\" and\
      \ process.command_line : \"*scrobj.dll*\"))"
- question: Are high-risk binaries executing from user-writable or temporary directories, or being spawned
    by irregular parent processes that should never launch them?
  context: Unauthorized software frequently runs from non-standard locations (Temp, AppData, Downloads,
    user profile paths) and is launched by parents that legitimate workflows would not use. For the Detect
    tactic the analyst encodes concrete parent->child pairs such as winword.exe/excel.exe/wscript.exe
    -> cmd.exe or powershell.exe (classic phishing-macro chains) and w3wp.exe -> cmd.exe (webshell activity),
    aligning with CAR-2013-05-002 Suspicious Run Locations and CAR-2021-02-001 Webshell-Indicative Process
    Tree. A hit pairing a high-risk binary (powershell.exe, rundll32.exe, regsvr32.exe) with a writable
    path and an anomalous parent is strong evidence of malicious execution; benign software occasionally
    trips these rules, so verify the signer and full lineage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search EventID IN (4688, 1)\n| eval img=lower(NewProcessName), parent=lower(ParentImage)\n\
      | where (match(img, \"\\\\\\\\(temp|appdata|downloads|users\\\\\\\\public)\\\\\\\\\") \n       \
      \  AND img LIKE_ANY (\"%powershell.exe\",\"%rundll32.exe\",\"%regsvr32.exe\"))\n      OR (parent\
      \ LIKE_ANY (\"%winword.exe\",\"%excel.exe\",\"%wscript.exe\") AND img LIKE_ANY (\"%cmd.exe\",\"\
      %powershell.exe\"))\n      OR (parent LIKE \"%w3wp.exe\" AND img LIKE \"%cmd.exe\")\n| table _time,\
      \ host, User, ParentImage, NewProcessName, CommandLine"
- question: Do any processes use the name of a protected Windows binary while running from the wrong path,
    under the wrong parent, or signed by the wrong (or no) code signer?
  context: Masquerading (T1036) hides malware behind trusted names like lsass.exe, svchost.exe, or services.exe.
    For the Detect tactic the analyst validates the trinity of expected name, path, parent, and signer
    for protected binaries (per CAR-2021-04-001 Common Windows Process Masquerading). For example, svchost.exe
    NOT spawned by services.exe, or lsass.exe running from a path other than C:\Windows\System32, is high-fidelity
    evidence of impersonation. A positive result strongly indicates unauthorized software impersonating
    a system process; legitimate system processes will always satisfy the expected path/parent/signer,
    so deviations warrant immediate triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search EventID IN (4688, 1)\n| eval img=lower(NewProcessName), parent=lower(ParentImage)\n\
      | where (img LIKE \"%\\\\svchost.exe\" AND NOT parent LIKE \"%\\\\services.exe\")\n      OR (img\
      \ LIKE \"%lsass.exe\" AND NOT NewProcessName LIKE \"C:\\\\Windows\\\\System32\\\\lsass.exe\")\n\
      \      OR (img LIKE_ANY (\"%services.exe\",\"%csrss.exe\") AND Signer != \"Microsoft Windows\")\n\
      | table _time, host, ParentImage, NewProcessName, Signer"
- question: Which process-creation events fall in the rare tail of parent-child pairings, executable-path
    prevalence, or command-line length/entropy when compared to a rolling per-host and per-role baseline?
  context: Signatures miss novel tooling, so the Detect tactic also relies on statistical rarity. The
    analyst builds rolling 30-day distributions per host and per role for parent-child pair frequency,
    executable path prevalence, and command-line length/entropy, then flags events in the low-frequency
    or high-entropy tails (e.g. mean+3sigma or the 99th percentile, tuned per environment), consistent
    with CAR-2014-11-002 Outlier Parents of Cmd and entropy-scoring work in SCADE and Mandiant's obfuscation
    research. A flagged event is statistically anomalous, not necessarily malicious; the analyst correlates
    it with signer, path trust, and network aftermath. Tune thresholds to your environment to balance
    noise against detection of obfuscated commands.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EventID IN (4688, 1) earliest=-30d

      | eval pcpair=ParentImage."->".NewProcessName, cmdlen=len(CommandLine), ent=entropy(CommandLine)

      | eventstats count by host, pcpair

      | eventstats avg(cmdlen) as mu_len stdev(cmdlen) as sd_len avg(ent) as mu_e stdev(ent) as sd_e by
      host_role

      | where count < rare_threshold OR cmdlen > mu_len+3*sd_len OR ent > mu_e+3*sd_e

      | table _time, host, pcpair, cmdlen, ent, CommandLine'
- question: Are any parent processes spawning child processes at burst rates above baseline, or generating
    elevated rates of failed or application-control-blocked executions?
  context: Volume, frequency, and launch state are independent anomaly signals for the Detect tactic.
    The analyst tracks child-process count per parent per minute and joins process events with exit codes
    and AppLocker/WDAC/application-control block events to compute a failure/block rate. Burst spawning
    above a >=30-day baseline can indicate scripted malware, lateral-movement loops, or fork-bomb-like
    behavior, while a spike in failed or blocked executions reveals an actor probing against application
    control. Derive thresholds from the baseline rather than fixed constants. A positive result is an
    elevated rate relative to the host/role norm; isolated failures are common and benign.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search (EventID IN (4688,1)) OR (AppLockerBlock OR WDACBlock) earliest=-30d

      | bin _time span=1m

      | stats count as spawns, sum(blocked) as blocks, sum(failed) as fails by _time, host, ParentImage

      | eventstats avg(spawns) as mu stdev(spawns) as sd by host, ParentImage

      | where spawns > mu+3*sd OR (blocks+fails)/spawns > block_rate_baseline

      | table _time, host, ParentImage, spawns, blocks, fails'
- question: Which short parent->child->grandchild spawn sequences are structurally rare compared to the
    bulk of observed process trees in the environment?
  context: Beyond single events, the shape of short process trees carries signal for the Detect tactic.
    The analyst scores parent->child->grandchild sequences for structural rarity using statistical leverage
    (per 'Business Process Event Log Anomaly Detection based on Statistical Leverage'), flagging traces
    that deviate from the mass of normal trees without needing labeled data. This catches multi-stage
    execution chains (e.g. a document spawning a shell that spawns a downloader) that look benign one
    hop at a time. A high-leverage trace is an unusual execution structure to investigate; the method
    is label-free, so analysts confirm with signer/path/network context.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EventID IN (4688, 1) earliest=-30d

      | build_tree grandparent=ParentOfParent parent=ParentImage child=NewProcessName

      | eval trace=grandparent."->".parent."->".child

      | stats count by trace

      | compute leverage_score(count, total)

      | where leverage_score > leverage_threshold

      | table trace, count, leverage_score'
- question: Do suspicious process launches immediately precede unusual network behavior such as first-seen
    destinations, outbound byte-volume spikes, or elevated connection-failure rates?
  context: Unauthorized software often beacons or exfiltrates shortly after launch, so the Detect tactic
    correlates execution with network telemetry. The analyst joins new process events to Zeek conn.log
    in short time windows (e.g. 1-5 minutes) and detects statistically unusual first-seen destinations,
    outbound byte-volume spikes, or elevated connection-failure rates following a suspicious spawn. A
    positive correlation (a rare spawn followed by a never-before-seen C2-like destination) materially
    raises confidence that the process is malicious; absence of network activity does not clear a process,
    since not all malware is immediately network-active.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days; correlate within a 1-5 minute window centered on each suspicious process launch
  queries:
  - technology: Zeek/pseudocode
    query: "# join suspicious spawns to conn.log within 5m\nFOR each suspicious_spawn(host, t):\n  conns\
      \ = conn.log WHERE id.orig_h==host AND ts BETWEEN t AND t+5m\n  flag conns WHERE id.resp_h NOT IN\
      \ seen_destinations(host, last=30d)\n             OR orig_bytes > byte_volume_baseline\n       \
      \      OR conn_state IN (\"S0\",\"REJ\",\"RSTO\")"
  - technology: SIEM/Stats pseudocode
    query: 'search index=proc suspicious=1 | join host [search index=zeek sourcetype=conn]

      | where abs(net_time-proc_time) < 300

      | eventstats dc(resp_h) as newdest avg(orig_bytes) as mu stdev(orig_bytes) as sd by host

      | where first_seen(resp_h) OR orig_bytes > mu+3*sd OR conn_state IN ("S0","REJ")

      | table _time, host, NewProcessName, resp_h, orig_bytes, conn_state'
- question: What malicious-likelihood score does a supervised classifier assign to each process execution
    based on its lineage, path trust, signer context, command features, and network aftermath?
  context: To generalize beyond rules, the Detect tactic uses a supervised classifier trained on process
    lineage, path trust, signer context, command-line features, and network aftermath to score each execution's
    malicious likelihood, following the XGBoost parent-child approach of ProblemChild and the gradient-boosted
    obfuscation features of Mandiant. Critically, each alert must surface the top-3 contributing features
    (e.g. rare parent-child pair, untrusted signer, high command entropy) so the analyst can triage the
    reasoning rather than trust an opaque score. A high score with coherent contributing features warrants
    escalation; the model complements, not replaces, the deterministic and statistical layers.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [parent_child_rarity, path_trust, signer_trust, cmd_len, cmd_entropy,\n       \
      \    lolbin_flag, net_firstseen, net_bytes_z]\nmodel = XGBoost.load(\"problemchild_proc_classifier\"\
      )\nscore = model.predict_proba(features)\nif score > 0.8:\n    alert(top3=model.explain(features))\
      \  # surface top-3 contributing features"
- question: Which process command lines are flagged as obfuscated or malicious by character-level deep-learning
    models or language-model embeddings that catch what entropy and keyword rules miss?
  context: Adversaries obfuscate command lines (string concatenation, encoding, case randomization) to
    defeat entropy and keyword rules. For the Detect tactic the analyst scores command-line text with
    character-level CNN/LSTM ensembles (Hendler et al.), ELECTRA small language models (Tran et al.),
    or BERT embeddings paired with unsupervised outlier detection (CrowdStrike), while keeping deterministic
    rules running in parallel. A model hit on a command line that signatures missed is a strong lead toward
    hidden payload execution; analysts review the decoded/normalized command to confirm intent. False
    positives arise from unusual but legitimate admin scripting, so corroborate with lineage and signer.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for ev in process_events:\n    s_cnn  = charCNN_LSTM.score(ev.command_line)\n    s_lm   =\
      \ electra_small.score(ev.command_line)\n    s_bert = outlier_detector.score(bert_embed(ev.command_line))\n\
      \    if max(s_cnn, s_lm, s_bert) > obf_threshold:\n        alert(ev, normalized=deobfuscate(ev.command_line))\n\
      # keep deterministic keyword/entropy rules running in parallel"
- question: Are the living-off-the-land command-line detectors being kept current against mutated built-in
    tooling through an active-learning loop with minimal analyst labeling?
  context: 'LOLBin abuse evolves as attackers mutate built-in tooling, so static detectors decay. For
    the Detect tactic the analyst employs active learning (per ''Living-Off-The-Land Command Detection
    Using Active Learning'') to keep command-line detectors current with minimal labeling: the model surfaces
    the most informative uncertain samples for an analyst to label, continuously refreshing coverage of
    new LOLBin variants. The investigative value is sustained detection fidelity over time; a stale model
    that no longer flags current LOLBin variants is itself a gap. Periodically verify the labeling queue
    is being worked and detection recall is holding.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = lolbas_command_detector\nwhile streaming(process_events):\n    uncertain = model.query_most_informative(events,\
      \ strategy=\"uncertainty\")\n    labels = analyst_label(uncertain)   # minimal labeling budget\n\
      \    model.update(uncertain, labels)\n    monitor(recall_on_known_lolbas_variants)"
- question: Where whole-system provenance is collected, do graph-learning models reveal fileless or masqueraded
    execution chains, and can they reconstruct an analyst-readable root-cause graph?
  context: Fileless and masqueraded execution can evade per-event detection, so where whole-system provenance
    is available the Detect tactic models process causal chains with graph learning (ThreaTrace, MAGIC,
    or KAIROS, trained/evaluated on DARPA TC/OpTC). These detectors flag anomalous nodes/edges in the
    provenance graph and reconstruct analyst-readable root-cause subgraphs, exposing how a benign-looking
    process descended from a malicious origin. A flagged subgraph gives the analyst both a detection and
    an investigation map for scoping and response; this approach requires rich provenance instrumentation
    and is most valuable on high-value or high-risk hosts.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: All Windows workstations and servers'
  range: Last 90 days
  queries:
  - technology: ML/Graph pseudocode
    query: "G = build_provenance_graph(process, file, network events)  # whole-system\nanomalies = threaTrace.infer(G)\
      \   # or MAGIC / KAIROS\nfor node in anomalies:\n    sub = reconstruct_root_cause(G, node)\n   \
      \ alert(node, rootcause_graph=sub)  # analyst-readable subgraph"
