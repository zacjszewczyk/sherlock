name: 'D3-PS: Process Suspension'
id: ae88fee4-24fc-4064-b684-882750b2409c
description: >-
  This playbook helps an analyst investigate and validate the suspension of malicious or high-risk processes
  as a containment (Evict) action across the enterprise. It guides verification that a suspension command
  actually executed and that the target process transitioned to a fully suspended/wait state across all
  of its threads, that volatile evidence (memory, handles, process listing) was preserved before any disposition,
  and that the containment was effective (outbound traffic ceased and no respawn occurred). It also covers
  scoping related parent/sibling/child processes for co-suspension, measuring time-to-contain and recurrence,
  quantifying operational side effects on business-critical services, and applying statistical and provenance-graph
  machine-learning methods to prioritize candidate processes, predict operational impact, and confirm
  eviction. The objective is to suspend malicious processes reliably without causing operational disruption,
  consistent with NIST incident-response and digital-forensics guidance.
type: technique
related:
- tactic_id: D3-E
  tactic_name: Evict
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did every EDR or SOAR process-suspension request produce a confirmed success status in the
    process action logs for the same host and process identifier within 60 seconds, and are there any
    missing, failed, or access-denied confirmations?
  context: >-
    During an Evict action you cannot assume a suspension worked simply because a request was issued.
    Correlate each suspension request emitted by EDR or a SOAR playbook with a corresponding success status
    in the endpoint process action logs, matched on host and PID, within a tight 60-second window. A missing,
    failed, or access-denied confirmation means the containment may not have taken effect and the malicious
    process could still be live. Confirming that a containment action actually took effect is a required
    step of the response lifecycle ([NIST SP 800-61r2: Computer Security Incident Handling Guide](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf)).
    A positive result is a matched request+success
    pair; a negative result (unmatched request, failure code) should alert and trigger re-attempt or escalation.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (correlate request and confirmation within 60 seconds of each action timestamp)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      req = events where action='suspend_request'

      ok  = events where action='suspend_result' and status='success'

      JOIN req->ok ON host, pid WHERE ok.time - req.time <= 60s

      ALERT req WHERE no matching ok OR ok.status in ('failed','access_denied') OR ok missing
- question: Can EDR/Sysmon thread-state telemetry confirm that ALL threads of the target PID entered a
    suspended/wait state (with no new threads resuming) within the verification window, rather than relying
    on the command return code alone?
  context: >-
    A command return code can report success while the process keeps running or only partially suspends.
    For the Evict tactic, verify from thread-state telemetry that every thread of the target PID transitioned
    to a suspended/wait state and that no new threads resumed during the verification window. A fully
    frozen process is the precondition for sound volatile-data acquisition; a still-running or partially-suspended
    PID must be treated as a failed action ([NIST SP 800-86: Guide to Integrating Forensic Techniques into Incident Response](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-86.pdf)).
    A positive result is all-threads-suspended;
    any running thread or newly resumed thread is a negative result requiring re-action.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (verify thread states within the action verification window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      threads = thread_state where host=H and pid=P and time in [suspend_ts, suspend_ts+window]

      total = distinct(threads.tid)

      suspended = distinct(threads.tid where state in ('suspended','wait'))

      resumed = threads.tid where state='running' and time > suspend_ts

      PASS if suspended == total and count(resumed)==0 else ALERT 'partial/failed suspension'
- question: After a reported suspension, does the same binary (matched on image hash) show continued outbound
    activity in Zeek conn.log or an immediate respawn in Windows Event ID 4688 / Sysmon Event ID 1 within
    the window, indicating ineffective eviction?
  context: >-
    Suspension is only successful if malicious activity actually stops. After a reported suspension, alert
    if the same binary (match on image hash) shows continued outbound network activity (orig_bytes > 0
    after the action timestamp in Zeek conn.log) or an immediate respawn (Event ID 4688 / Sysmon Event
    ID 1) within the window. Either signal indicates failed containment and should be escalated as ineffective
    eviction. Verifying that malicious activity stopped is part of confirming containment effectiveness
    ([NIST SP 800-61r2: Computer Security Incident Handling Guide](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf));
    residual anomalous nodes/sockets are detectable at node granularity in provenance
    ([ThreaTrace: Detecting and Tracing Host-based Threats in Node Level Through Provenance Graph Learning](https://arxiv.org/pdf/2111.04333)).
    A positive (bad) result is continued traffic or respawn; a clean result is silence from
    that binary after the action.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (focus on the window immediately following each suspension timestamp)
  queries:
  - technology: Zeek/pseudocode
    query: >-
      conn.log where host=H and time > suspend_ts and orig_bytes > 0

      and producing-process.image_hash == suspended.image_hash

      => ALERT 'continued exfil after suspension'
  - technology: SIEM/Rule pseudocode
    query: >-
      newproc = EventID 4688 or Sysmon EventID 1 where image_hash == suspended.image_hash

      and time in [suspend_ts, suspend_ts+window]

      => ALERT 'process respawn after suspension'
- question: Was a memory, handle, or process-listing acquisition artifact for the target PID produced
    between the suspend timestamp and any subsequent terminate, or was a process killed with no acquisition
    recorded (an evidence gap)?
  context: >-
    Suspension exists precisely to freeze volatile state so it can be captured before disposition, following
    the order-of-volatility principle. Require that an acquisition artifact (memory dump, handle list,
    or process listing) for the target PID exists between the suspend timestamp and any later terminate
    action. Alert when a process was killed with no acquisition recorded, because that is an irrecoverable
    evidence gap ([NIST SP 800-86: Guide to Integrating Forensic Techniques into Incident Response](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-86.pdf)).
    A positive result is an acquisition artifact present before terminate;
    a negative result is suspend-then-kill with no capture in between.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (correlate suspend, acquisition, and terminate events per PID)
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      suspend = action where type='suspend' (host,pid,ts_s)

      acq = artifact where type in ('memdump','handles','proclist') and pid=P and ts in (ts_s, ts_kill)

      kill = EventID 4689 or action 'terminate' where pid=P (ts_kill)

      ALERT WHERE kill exists AND no acq between ts_s and ts_kill  // evidence gap
- question: Using provenance root-cause analysis, are there any parent, sibling, or child processes in
    the same malicious causal subgraph as the suspended PID that remain running and uncontained?
  context: >-
    Malicious activity rarely lives in a single process. Using provenance root-cause analysis, enumerate
    the parent, sibling, and child processes in the same malicious causal subgraph as the suspended PID
    and alert if any causal kin remain running and uncontained. Root-cause-annotated detection identifies
    the ancestor/descendant set that must be contained together ([R-CAID: Embedding Root Cause Analysis within Provenance-based Intrusion Detection](https://gangw.cs.illinois.edu/rcaid-sp24.pdf);
    [KAIROS: Practical Intrusion Detection and Investigation using Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf)).
    For the Evict tactic
    this prevents an attacker from re-establishing via an un-suspended relative. A positive (bad) result
    is uncontained causal kin still running; a clean result is the whole malicious subgraph suspended.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (build the causal subgraph around each suspended PID)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      subgraph = provenance_walk(root_cause(suspended.pid), include=[parents,siblings,children])

      for node in subgraph.processes:
        if node.state == 'running' and node.pid not in contained_set:
          ALERT 'uncontained causal kin', node.pid, node.image
- question: What is the detection-to-suspension latency and post-suspension recurrence rate per host,
    tool, and playbook, and which of these fall into worst-performing percentile bands (latency above
    the 90th percentile or recurrence above baseline + 3 sigma)?
  context: >-
    Time-to-contain and effectiveness are prescribed response metrics ([NIST SP 800-61r2: Computer Security Incident Handling Guide](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf)).
    Compute detection-to-suspension
    latency and post-suspension recurrence rates grouped by host, tool, and playbook, then flag those
    whose metrics fall into worst-performing percentile bands (e.g., latency above the 90th percentile
    or recurrence above baseline + 3 sigma). Derive band thresholds from your own action-log distribution
    rather than fixed numbers ([Detecting EDR Killers Using Statistical Deviations](https://www.cardinalops.com/blog/detecting-edr-killers-using-statistical-deviations/)).
    This identifies underperforming containment paths during
    the Evict tactic. A positive result is a host/tool/playbook in a worst-performing band that warrants
    tuning or investigation.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (aggregate across actions to build per-host/tool/playbook distributions)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      latency = suspend_ts - detection_ts per action

      STATS p90(latency), mean(recurrence), stdev(recurrence) BY host, tool, playbook

      ALERT groups WHERE latency > p90(latency) OR recurrence > mean + 3*stdev
- question: Do Windows System Event ID 7036 service-state changes and crash/error counts in fixed windows
    (5 and 30 minutes) after each suspension exceed host-specific baselines by a tuned z-score (e.g.,
    > 3), indicating operational disruption?
  context: >-
    Containment must avoid unacceptable disruption ([NIST SP 800-61r3: Incident Response Recommendations](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r3.pdf)).
    Track Event ID 7036 service-state
    changes and crash/error counts in fixed windows (e.g., 5 and 30 minutes) after each suspension and
    alert when disruption counts exceed host-specific baselines by a tuned z-score (e.g., > 3). Baseline
    normal per-host rates first, then alert on statistically significant deviations ([Detecting EDR Killers Using Statistical Deviations](https://www.cardinalops.com/blog/detecting-edr-killers-using-statistical-deviations/)).
    For the Evict tactic this measures whether suspending a process broke business-critical services. A positive
    (bad) result is a statistically significant spike in service changes or errors after the action.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (compare 5- and 30-minute post-action windows against per-host baselines)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      base_mu, base_sd = baseline(EventID 7036 + error_count per 5m/30m window BY host)

      post = count(EventID 7036, crashes) in [suspend_ts, suspend_ts+5m] and [+30m]

      z = (post - base_mu)/base_sd

      ALERT WHERE z > 3  // operational disruption from suspension
- question: Does online change-point detection (CUSUM or Bayesian online CPD) on the suspended host's
    per-minute outbound byte volume and connection rate show the expected downward level shift at the
    action timestamp, or is the expected drop absent (failed containment)?
  context: >-
    A successful suspension should produce a measurable downward level shift in network activity. Run
    online change-point detection (CUSUM or Bayesian online CPD) on the suspended host's per-minute outbound
    byte volume and connection rate; expect a downward level shift at the action timestamp. Absence of
    the expected drop within the window is a failed-containment signal ([A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).
    For the Evict tactic this independently confirms the malicious traffic ceased. A positive
    result is a detected downward change-point at the action time; a negative result (no level shift)
    flags ineffective containment.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (per-minute series spanning before and after each action timestamp)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      series = per_minute(sum(orig_bytes), conn_count) for host=H around suspend_ts

      cp = CUSUM_or_BOCPD(series)

      EXPECT downward level_shift at suspend_ts

      ALERT WHERE no downward change_point within window  // traffic did not cease
- question: Treating failed or blocked suspension attempts (access-denied, PID-not-found, timeout) as
    their own time series per host and tool, is there a z-score spike in the failure rate that could indicate
    process tampering, anti-tamper protection, or tooling degradation?
  context: >-
    Failed suspensions are not just noise; a surge can reveal an adversary actively protecting a process
    or degraded tooling. Treat failed/blocked suspension attempts (access-denied, PID-not-found, timeout)
    as their own time series per host and tool, and alert on a z-score spike in failure rate distinctly
    from successful actions ([Detecting EDR Killers Using Statistical Deviations](https://www.cardinalops.com/blog/detecting-edr-killers-using-statistical-deviations/)).
    During the Evict tactic an unexpected rise in failures may
    indicate anti-tamper protection or an EDR-killer at work. A positive (bad) result is a statistically
    significant spike in suspension failures for a host or tool.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (build per-host/tool failure-rate time series)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      fail = suspend_result where status in ('access_denied','pid_not_found','timeout')

      ts = count(fail) per interval BY host, tool

      mu, sd = baseline(ts)

      ALERT WHERE (count - mu)/sd > 3  // possible tampering/anti-tamper/tooling degradation
- question: Can a model trained on process lineage, signer reputation, host criticality, historical disruption
    outcomes (Event ID 7036), and network behavior classify a proposed suspension as low- or high-operational-impact,
    and surface the top-3 contributing features in the alert?
  context: >-
    Before suspending, it helps to predict whether the action will disrupt operations. Train a lightweight,
    explainable model on process lineage, signer reputation, host criticality, historical disruption outcomes
    (Event ID 7036), and network behavior to classify a proposed suspension as low- or high-operational-impact,
    and surface the top-3 contributing features (e.g., 'host=domain-controller, signer=Microsoft, child-of=services.exe')
    in the alert. Layer this over the deterministic rules above ([Sometimes Simpler is Better: A Comprehensive Analysis of Provenance-Based IDS](https://www.usenix.org/system/files/usenixsecurity25-bilot.pdf)).
    For the
    Evict tactic this guards against breaking critical services. A high-impact prediction warrants analyst
    review before the suspension is executed.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (train on historical actions; score proposed suspensions in near-real-time)
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features = [lineage, signer_reputation, host_criticality, hist_7036_disruption, net_behavior]

      label = impact_class in {low, high}

      model = explainable_clf.fit(historical_actions)

      on proposed_suspension: pred, top3 = model.predict_with_explanation(features)

      ALERT IF pred=='high' WITH top3 contributing features
- question: Which candidate processes rank highest for suspension based on provenance-graph anomaly scores,
    and what contributing path or subgraph explains each high score?
  context: >-
    When multiple suspect processes exist, prioritize the most likely malicious ones for suspension. Rank
    candidates using provenance-graph anomaly scores and present the contributing path/subgraph as explanation:
    edge-level temporal-GNN scoring ([KAIROS: Practical Intrusion Detection and Investigation using Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf)),
    node-level GraphSAGE scoring ([ThreaTrace: Detecting and Tracing Host-based Threats in Node Level Through Provenance Graph Learning](https://arxiv.org/pdf/2111.04333)),
    rare causal-path scoring with Local Outlier Factor ([ProvDetector: You Are What You Do](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf)),
    and masked-graph representation scoring ([MAGIC: Detecting Advanced Persistent Threats via Masked Graph Representation Learning](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf)).
    For the Evict tactic this focuses limited containment capacity on the highest-risk processes. A positive
    result is a high anomaly score with an explanatory subgraph that justifies suspension.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (score the host provenance graph to rank candidate processes)
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      G = provenance_graph(host)

      scores = ensemble(KAIROS_edge_gnn(G), ThreaTrace_node_sage(G),
                        ProvDetector_rarepath_LOF(G), MAGIC_masked_repr(G))
      rank processes DESC by scores

      OUTPUT top candidates WITH explanatory_subgraph for suspension
- question: After the suspension, does re-running the provenance anomaly model on the host show persistence
    of anomalous nodes/edges (incomplete eviction) or recovery of the graph score toward baseline (successful
    eviction)?
  context: >-
    Confirming eviction requires re-assessing host state after the action. Re-run the provenance anomaly
    model on the host after the suspension; persistence of anomalous nodes/edges indicates incomplete
    eviction, while recovery of the host's graph score toward baseline indicates successful eviction,
    and drift-adaptive models keep this assessment valid over time ([MAGIC: Detecting Advanced Persistent Threats via Masked Graph Representation Learning](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf);
    [ThreaTrace: Detecting and Tracing Host-based Threats in Node Level Through Provenance Graph Learning](https://arxiv.org/pdf/2111.04333)).
    For the Evict
    tactic this is the final closure check. A positive (good) result is the graph score returning to baseline;
    lingering anomalies mean further containment is needed.
  answer_sources:
  - EDR process action logs
  - EDR/Sysmon thread and process state telemetry
  - Windows Event ID 4689
  - Windows Event ID 4688
  - Windows Event ID 7036
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Memory/handle acquisition artifacts
  - Zeek conn.log
  - SOAR playbook execution logs
  - Whole-system provenance/audit telemetry
  - 'NAI: Endpoint devices, critical application servers, and network egress points.'
  range: Last 90 days (re-score the host after each suspension and compare to baseline)
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      pre = anomaly_score(provenance_graph(host)) before action

      post = anomaly_score(provenance_graph(host)) after action

      if post still flags anomalous nodes/edges: REPORT 'incomplete eviction'

      elif post ~ baseline: REPORT 'eviction successful'
