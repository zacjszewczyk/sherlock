name: 'D3-ACA: Active Certificate Analysis [1]'
id: 84187453-2236-4eed-9788-9fec84889fc0
description: Investigate the SSL/TLS certificates presented by external services that our users connect
  to, in order to detect misconfigured, spoofed, revoked, or adversary-controlled certificates in active
  use. This playbook helps an analyst baseline issuer trust, full chain validation status, certificate
  fingerprints/JA4X structure, validity and revocation characteristics, and cryptographic strength across
  outbound TLS sessions observed at the egress. It layers deterministic policy/chain/revocation validation,
  statistical baselining of issuer and algorithm prevalence and certificate-failure rates, and explainable
  ML scoring of certificate outliers, with payload-agnostic flow-feature fallbacks where TLS 1.3/ECH encrypts
  certificate fields. Use it to surface untrusted chains, revocation anomalies, certificates absent from
  Certificate Transparency, implant/default certificate fingerprints, and domain-to-fingerprint drift
  that may indicate command-and-control, phishing, or interception.
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any outbound TLS sessions presenting certificates with untrusted or invalid certificate
    chains, unknown trust anchors, self-signed certificates without an explicit allowlist entry, deny-listed
    issuers, sub-policy key lengths (RSA <2048, ECC <256), or weak signature algorithms (MD5/SHA-1), and
    do their key-usage/EKU and SAN/name constraints validate?
  context: This question detects certificates that fail deterministic trust validation, a core indicator
    of spoofing, interception, or adversary-controlled infrastructure under the Detect tactic. Parse the
    Zeek ssl.log validation_status field together with x509.log certificate details to flag sessions where
    chain validation fails, the trust anchor is unknown, certificates are self-signed outside the allowlist,
    issuers appear on deny lists, cryptographic strength falls below enterprise baselines from [NIST SP
    1800-16](https://www.nccoe.nist.gov/sites/default/files/library/sp1800/tls-serv-cert-mgt-nist-sp1800-16b-final.pdf),
    or weak signature algorithms are used. Also verify key-usage/EKU and SAN/name constraints to catch
    misused certificates. A positive result on a high-trust external service warrants immediate escalation;
    these are hard policy rules, so tune only the allowlist and never remove the thresholds.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN ssl.log s WITH x509.log x ON s.cert_chain_fps[0]=x.fingerprint\nWHERE s.validation_status\
      \ != 'ok'\n   OR x.trust_anchor NOT IN known_roots\n   OR (x.is_self_signed AND x.subject NOT IN\
      \ allowlist)\n   OR x.issuer IN issuer_denylist\n   OR (x.key_type='rsa' AND x.key_length<2048)\n\
      \   OR (x.key_type='ecdsa' AND x.key_length<256)\n   OR x.sig_alg IN ('md5WithRSA','sha1WithRSA')\n\
      \   OR x.key_usage_invalid OR x.san_name_mismatch\n| ENRICH dest_trust=high IF s.server_name IN\
      \ critical_external_services\n| ALERT severity = CASE WHEN dest_trust='high' THEN 'critical' ELSE\
      \ 'high' END"
- question: Are any certificates being served that are already revoked (per OCSP/CRL), or that advertise
    the must-staple extension but present no valid stapled OCSP response, and is the rate of 'revocation
    unknown' / responder-unavailable soft-fail events spiking for any destination?
  context: 'Revocation evasion lets compromised or fraudulently issued certificates continue to appear
    valid. Resolve revocation status via OCSP/CRL and OCSP stapling and alert when a revoked certificate
    is still served, or when a certificate advertises must-staple yet presents no valid stapled response
    (per [Liu et al., IMC 2015](https://www.cs.umd.edu/~dml/papers/revocations_imc15.pdf)). Critically,
    treat failure modes as distinct signals: count OCSP/CRL responder-unavailable and soft-fail events
    per destination per hour, because a spike in ''revocation unknown'' status can be deliberately induced
    to make revoked or compromised certificates look valid. A positive result indicates either an attacker
    leveraging a revoked/stolen certificate or an attempt to suppress revocation checking.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM x509.log x JOIN ocsp_crl_responses r ON x.fingerprint=r.fingerprint\nWHERE r.status='revoked'\
      \ AND x.seen_on_wire=true\n   OR (x.must_staple=true AND x.stapled_ocsp_valid=false)\n| ALERT 'revoked_or_unstapled_cert_served'"
  - technology: SIEM/Stats pseudocode
    query: 'FROM ocsp_crl_responses

      WHERE status IN (''unknown'',''responder_unavailable'',''soft_fail'')

      | BIN time SPAN=1h | STATS count BY dest, bin

      | ALERT WHEN count > baseline_mean(dest) + 3*stddev(dest)'
- question: Do any wire-observed certificate fingerprints fail to appear in public Certificate Transparency
    logs for services that should be logged, and are there newly issued CT certificates naming our domains/brands
    or homoglyph look-alikes?
  context: Certificate Transparency corroboration catches both interception (a wire certificate that was
    never publicly logged) and phishing infrastructure (certificates issued for your domains or look-alikes).
    Cross-check each certificate fingerprint observed in Zeek x509.log against public CT log feeds (crt.sh/certstream,
    per [RFC 6962](https://www.rfc-editor.org/rfc/rfc6962.txt)). Flag certificates absent from CT for
    services that should be logged, and watchlist CT for newly issued certificates that name your domains,
    brands, or homoglyph variants so phishing certificates are caught at issuance. A wire-only certificate
    strongly suggests a machine-in-the-middle; a newly issued look-alike certificate is an early phishing
    warning under the Detect tactic.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM x509.log x

      LOOKUP ct = ct_log_feed(x.fingerprint)

      WHERE ct.found=false AND x.server_name IN should_be_logged

      | ALERT ''cert_absent_from_CT''

      -- separately, stream CT issuance:

      FROM ct_stream WHERE san MATCHES our_domains OR homoglyph(san, our_domains)

      | ALERT ''lookalike_cert_issued'''
- question: Do any certificates match known implant or default certificate fingerprints (JA4X structure,
    issuer/subject CN, serials) associated with Cobalt Strike or other tooling, or use self-signed, abnormally
    short validity, or free-CA certificates to suspicious destinations, or match known-bad issuer/serial
    pairs?
  context: Adversary frameworks frequently ship default or reused certificates with recognizable structures.
    Compute JA4X X509 structure fingerprints and maintain allow/deny lists (per [JA4+](https://github.com/FoxIO-LLC/ja4)),
    match certificate issuer/subject CN and serials against implant signatures (e.g., [Cobalt Strike YARA](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar)),
    and deploy portable SIEM rules for self-signed, abnormally short validity, and free-CA certificates
    to suspicious destinations (per [SigmaHQ](https://github.com/SigmaHQ/sigma)). Because stolen-but-valid
    certificates produce valid chains yet anomalous usage, also watchlist known-bad issuer/serial pairs
    (per [Kim et al., CCS 2017](https://doi.org/10.1145/3133956.3133958)). A match is a high-confidence
    command-and-control or tooling indicator even when the chain itself validates.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM x509.log x JOIN conn.log c ON x.uid=c.uid\nWHERE x.ja4x IN ja4x_denylist\n   OR (x.issuer_cn,\
      \ x.serial) IN implant_signatures\n   OR (x.is_self_signed AND c.dest IN suspicious_dests)\n   OR\
      \ x.validity_days < 7\n   OR x.issuer IN free_ca_list AND c.dest IN suspicious_dests\n   OR (x.issuer,\
      \ x.serial) IN known_bad_issuer_serial\n| ALERT 'implant_or_default_cert_match'"
- question: Has any known destination domain suddenly begun presenting a new certificate fingerprint/JA4X,
    a new issuer chain, or mismatched SANs outside of a planned change window, relative to its established
    baseline mapping?
  context: Domain-to-fingerprint drift reveals interception or infrastructure substitution against services
    that are normally stable. Maintain a baseline mapping of expected certificate fingerprints/JA4X and
    issuer chains per destination domain and service category, then alert when a known domain abruptly
    presents a new fingerprint, a new issuer, or mismatched SANs outside a planned change window (a drift
    signal validated against first-party Zeek telemetry, e.g., [RITA](https://github.com/activecm/rita)).
    A positive result for a high-trust service outside a change window is a strong machine-in-the-middle
    or compromise indicator under the Detect tactic; confirm against any legitimate certificate-rotation/maintenance
    records before escalating.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM x509.log x JOIN ssl.log s ON x.uid=s.uid\nLOOKUP base = domain_cert_baseline(s.server_name)\n\
      WHERE x.fingerprint NOT IN base.fingerprints\n   OR x.issuer NOT IN base.issuers\n   OR x.san_set\
      \ != base.san_set\nAND s.ts NOT IN planned_change_windows\n| ALERT 'domain_to_fingerprint_drift'"
- question: Over a rolling 30-day window, which certificate issuers and signature algorithms in outbound
    TLS fall into the lowest 5th percentile of historical frequency, especially for destinations that
    are normally stable?
  context: Rare issuer and algorithm patterns surface anomalous certificate authorities and cryptographic
    choices that legitimate enterprise services rarely use. Over a rolling 30-day window, compute issuer
    and signature-algorithm frequency distributions for outbound TLS, seeding expectations with internet-wide
    prevalence baselines ([Durumeric et al., IMC 2013](https://jhalderm.com/pub/papers/https-imc13.pdf)).
    Flag certificate presentations in the lowest 5th percentile of historical frequency, deriving the
    per-environment cutoff from your own egress distribution and weighting normally-stable domains more
    heavily. Include Volume (certificates seen per issuer/day) and State (validation pass/fail) as features.
    A rare issuer paired with a validation failure or a stable destination is a strong lead under the
    Detect tactic.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM x509.log (rolling 30d)

      STATS count AS freq BY issuer, sig_alg

      | EVAL pct = percentile_rank(freq)

      | WHERE pct <= 5

      | JOIN current_sessions ON issuer, sig_alg

      | EVAL weight = stable_domain(dest) ? 2 : 1

      | ALERT score = (5 - pct) * weight'
- question: Are any service categories showing abrupt shifts in certificate validity duration, renewal
    cadence, or adoption of CT/CAA/HSTS/must-staple, or a per-destination certificate validation-failure
    ratio exceeding its baseline (e.g., >3 sigma over a 7-day mean)?
  context: Abnormal certificate lifetime and configuration baselines reveal infrastructure churn, hasty
    attacker setups, and degraded security posture. Model baseline certificate validity duration, renewal
    cadence, and adoption of CT/CAA/HSTS/must-staple per service category (calibrated per [Amann et al.,
    IMC 2017](https://doi.org/10.1145/3131365.3131401)). Alert on abrupt shifts toward unusually short-lived
    (<7 day), frequently rotated, or out-of-family validity windows, and treat a per-destination validation-failure
    ratio exceeding its baseline (e.g., >3 sigma over a 7-day mean) as an explicit failure-rate signal.
    A positive result may indicate throwaway attacker certificates or a service whose certificate hygiene
    has suddenly regressed.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM x509.log JOIN ssl.log ON uid\nSTATS avg(validity_days) AS vdur, count AS renewals,\n\
      \      ratio(validation_status!='ok') AS fail_ratio\n  BY service_category, dest, window=7d\n| WHERE\
      \ vdur < 7\n   OR abs(vdur - baseline_vdur) > family_tolerance\n   OR fail_ratio > baseline_fail_mean\
      \ + 3*baseline_fail_std\n| ALERT 'abnormal_cert_lifetime_or_failrate'"
- question: When certificate outliers are scored with one-class anomaly detection over engineered x509/ssl
    features and certificate DN strings are classified as benign/malware/phishing, which certificates
    are flagged, and what are the top-3 contributing features behind each alert?
  context: Explainable ML catches subtle multivariate anomalies the deterministic rules miss. Engineer
    features from Zeek x509.log/ssl.log (issuer/subject DN tokens, validity duration, key length, signature
    algorithm, SAN count, JA4X, reuse patterns, destination rarity, validation/revocation state) and run
    one-class outlier detection (Isolation Forest / One-Class SVM, per [Scientific Reports 2025](https://www.nature.com/articles/s41598-025-20445-4))
    in parallel with the deterministic rules. Additionally classify certificate DN strings with an LSTM/DNN
    benign-vs-malware-vs-phishing model ([Torroledo et al., AISec 2018](https://doi.org/10.1145/3270101.3270105)).
    Surface the top-3 contributing features in every alert via SHAP attributions ([Frontiers in AI 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full))
    rather than a bare score, so analysts can validate and triage. A high anomaly score with interpretable
    drivers (e.g., rare issuer + short validity + DN tokens) is an actionable lead under the Detect tactic.
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(x509.log, ssl.log:\n  issuer_dn_tokens, subject_dn_tokens, validity_days, key_length,\n\
      \  sig_alg, san_count, ja4x, reuse_count, dest_rarity,\n  validation_state, revocation_state)\n\
      model = IsolationForest().fit(history)\nscores = model.decision_function(X)\ndn_class = LSTM_DNN.predict(subject_dn)\
      \  # benign|malware|phishing\nFOR row WHERE score in top_outliers OR dn_class != 'benign':\n  emit\
      \ alert WITH top3 = SHAP(model, row)"
- question: For TLS 1.3/ECH sessions where certificate and handshake fields are encrypted and active retrieval/CT
    corroboration is unavailable, which flows score as anomalous based on payload-agnostic features (record-size
    sequences, byte ratios, timing, JA4)?
  context: 'When TLS 1.3/ECH encrypts certificate and handshake fields, certificate-level analysis is
    blinded, so fall back to flow-level behavior. Score payload-agnostic flow features (record-size sequences,
    byte ratios, timing, JA4) per [Novo et al., RAID 2024](https://dl.acm.org/doi/10.1145/3678890.3678921)
    (code [extending12to13](https://github.com/CarlosANovo/extending12to13)), optionally using self-supervised
    encrypted-flow anomaly detection under label scarcity ([ET-SSL, Scientific Reports 2025](https://www.nature.com/articles/s41598-025-08568-0)).
    This preserves detection coverage for the Detect tactic when no certificate is observable: an anomalous
    encrypted flow to a rare or suspicious destination may still indicate command-and-control or interception
    even though the certificate cannot be inspected. Treat these as lower-confidence corroborating signals
    to be fused with the certificate-based detections above.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - Zeek conn.log
  - OCSP/CRL responder logs
  - Certificate Transparency log feed (crt.sh/certstream)
  - 'NAI: Our organization''s internet gateway/egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'FROM conn.log + ssl.log WHERE tls_version=''1.3'' AND ech=true

      F = flow_features(record_size_seq, byte_ratio_in_out, iat_timing, ja4)

      model = ET_SSL_or_supervised.fit(known_flows)

      score = model.anomaly(F)

      | WHERE score > threshold

      | ENRICH dest_rarity

      | ALERT ''encrypted_flow_anomaly_cert_blind'''
