name: 'D3-DNRA: Domain Name Reputation Analysis'
id: 4bd7d91f-f0fe-4d2e-8c37-5f398751e385
description: 'Investigate suspicious DNS activity by analyzing the reputation of queried domain names
  across internal resolvers, network egress points, and endpoints. This playbook helps an analyst layer
  three complementary approaches: (1) a deterministic high-confidence floor that matches queried domains
  against curated threat intelligence and enforces RFC structural limits and high-risk registration traits;
  (2) statistical baselines over domain prevalence, resolution dynamism, lexical randomness/entropy, per-host
  DNS failure (NXDOMAIN/SERVFAIL) rates, and requester diversity to surface fast-flux, disposable, and
  DGA infrastructure; and (3) supervised and deep-learning reputation models that score never-before-seen
  domains and NXDOMAIN responses, surfacing top contributing features for analyst triage. Together these
  detect phishing, command-and-control, malware-hosting, and domain-generation-algorithm activity even
  before public blacklists catch up.'
type: technique
related:
- tactic_id: D3-D
  tactic_name: Detect
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any internal hosts querying domains (or their registered eTLD+1 parent) that appear on
    curated malicious-domain threat intelligence feeds for phishing, C2, malware hosting, or known DGA
    families?
  context: This is the high-confidence reputation floor for the Detect tactic. Continuously exact- and
    regex-match every queried domain, and its registered parent/eTLD+1, in DNS telemetry against curated
    malicious-domain intelligence (phishing, C2, malware-hosting, DGArchive family lists). A hit is a
    strong, immediately actionable signal of compromise or attempted compromise and should alert at once.
    Static blocklists remain a necessary floor even though sophisticated attackers rotate domains to evade
    them; a negative result does not clear the host, it just means the deterministic layer found nothing
    and the statistical/ML layers must carry the detection. Pivot any hit to the querying host, the resolved
    IPs, and the surrounding conn.log sessions to scope follow-on activity.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Sysmon EID 22 (DnsQuery)
  - DNS resolver query logs
  - 'NAI: Internal DNS resolvers, Network egress points, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "load dns.log\n| extract domain, etld1 = registered_parent(query)\n| where domain in ti_malicious_domains\
      \ OR etld1 in ti_malicious_domains\n       OR regex_match(domain, ti_malicious_patterns)\n| join\
      \ conn.log on uid to recover src_host, resp_ip\n| emit alert(severity=high, src_host, domain, matched_feed)"
- question: Do any DNS queries violate RFC 1035 structural limits or use rare record types inconsistent
    with the querying host's role (oversized labels/names, abnormal subdomain depth, TXT/NULL abuse)?
  context: DGA, tunneling, and crafted exfiltration domains frequently breach the hard structural bounds
    defined in RFC 1035 or rely on record types rarely used by ordinary hosts. For the Detect tactic,
    flag any query whose individual labels exceed 63 octets, whose full name exceeds 255 octets, that
    has an abnormal label count / subdomain depth (for example more than 5 labels), or that uses rare
    record types (TXT/NULL) that are inconsistent with the host's normal behavior. These are deterministic
    violations, so a match is high-signal and low-false-positive; a typical workstation issuing deep TXT/NULL
    queries is especially suspicious and warrants pivoting to the host for tunneling or beaconing behavior.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Sysmon EID 22 (DnsQuery)
  - DNS resolver query logs
  - 'NAI: Internal DNS resolvers, Network egress points, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "load dns.log\n| compute max_label_len = max(len(label) for label in split(query,'.'))\n| compute\
      \ name_len = len(query), label_count = count(split(query,'.'))\n| where max_label_len > 63 OR name_len\
      \ > 255 OR label_count > 5\n       OR (qtype in ['TXT','NULL'] AND src_host_role == 'workstation')\n\
      | emit alert(src_host, query, qtype, reason)"
- question: Are hosts querying newly registered or otherwise high-risk domains that combine young WHOIS
    age, abused TLDs, IP-literal/excessive-subdomain hosts, and absence from an approved allowlist?
  context: 'Newly registered and short-lived domains with high distinct-IP/country counts are deterministic
    risk multipliers used by phishing and C2 operators. For the Detect tactic, alert when a queried domain
    combines several high-risk indicators at once: WHOIS registration age under 30 days, an uncommon or
    commonly abused TLD, an IP-literal or excessive-subdomain host structure, and absence from an approved
    allowlist (Tranco/Alexa top-N plus internal approved domains). Requiring multiple co-occurring traits
    keeps false positives manageable while still catching freshly stood-up attacker infrastructure. A
    positive result should drive enrichment (WHOIS, passive DNS) and host triage; legitimate but new business
    domains can be allowlisted to refine the signal.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Sysmon EID 22 (DnsQuery)
  - DNS resolver query logs
  - 'NAI: Internal DNS resolvers, Network egress points, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "load dns_queries\n| enrich whois_age, tld, host_form (ip_literal|subdomain_depth)\n| where\
      \ domain NOT in allowlist(tranco_topN + internal_approved)\n| score risk = (whois_age < 30d) + (tld\
      \ in abused_tlds)\n             + (host_form == 'ip_literal') + (subdomain_depth > 4)\n| where risk\
      \ >= 2\n| emit alert(src_host, domain, risk_factors)"
- question: Which resolved domains show fast-flux or disposable-infrastructure behavior, measured by TTL
    volatility, distinct resolved IPs/ASNs/countries, IP-set growth rate, and reverse-DNS diversity?
  context: 'Fast-flux and disposable infrastructure rotate IPs rapidly to keep C2 and phishing online
    despite takedowns. For the Detect tactic, baseline per resolved domain: TTL-change count/variance,
    the number of distinct resolved IPs/ASNs/countries, IP-set growth rate, and reverse-DNS diversity.
    Derive thresholds from the environment''s own distribution rather than fixed magic numbers (for example
    more than 3 distinct ASNs or rapid IP-set growth for a low-prevalence domain). Domains that resolve
    to many ASNs/countries in a short window, especially newly seen low-prevalence domains, are strong
    fast-flux candidates. A positive result should be correlated with the querying hosts and the registration/reputation
    signals from the deterministic layer.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS resolver query logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "load passive_dns + dns.log over 30d\n| by domain compute distinct_ips, distinct_asns, distinct_countries,\n\
      \    ttl_change_count, ttl_variance, ipset_growth_rate, rdns_diversity\n| join prevalence (client_count)\n\
      | where prevalence < low_threshold AND (distinct_asns > 3 OR ipset_growth_rate > p99)\n| emit alert(domain,\
      \ distinct_asns, distinct_countries, ttl_variance)"
- question: Which queried domain labels exhibit abnormally high lexical randomness, measured by Shannon
    entropy and KL-divergence from an English character distribution above the environment's 99th percentile?
  context: Domain-generation algorithms produce labels with near-random character distributions that stand
    out lexically. For the Detect tactic, compute Shannon entropy and KL-divergence against an English
    character distribution for queried labels, baseline the normal range per environment, and flag domains
    above the 99th entropy/KL percentile. KL-divergence reduces false positives on short or legitimate
    strings compared with raw entropy alone, and entropy combined with Levenshtein/n-gram features remains
    the primary DGA discriminator at scale. A high-entropy domain queried by a host that also shows NXDOMAIN
    bursts is a high-confidence DGA indicator; legitimate high-entropy domains (CDNs, hashed subdomains)
    should be baselined or allowlisted to control noise.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS resolver query logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "load dns.log\n| for each query compute entropy = shannon(label),\n    kl = kl_divergence(label_char_dist,\
      \ english_char_dist)\n| baseline per_environment entropy_p99, kl_p99\n| where entropy > entropy_p99\
      \ AND kl > kl_p99\n| emit alert(src_host, query, entropy, kl)"
- question: Which internal hosts show DNS failure or rarity patterns indicative of DGA exploration, such
    as elevated NXDOMAIN/SERVFAIL rates, high first-seen-domain ratios, or query-frequency outliers?
  context: A DGA-infected host typically generates many domains that do not resolve, producing a burst
    of NXDOMAIN responses as it searches for its live C2 rendezvous. For the Detect tactic, monitor host-level
    NXDOMAIN rate and ratio, SERVFAIL counts, first-seen-domain ratio, and query-frequency outliers (queries/min),
    alerting on hosts exceeding mean+3-sigma or the 99.5th percentile of a 7-30 day baseline. High NXDOMAIN
    volume per host is one of the most robust indicators of DGA-based infection. A positive result strongly
    implicates the host; pivot to the actual failed domains, run them through the entropy and ML layers,
    and inspect the host for malware.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS resolver query logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, Network egress points'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "load dns.log over 30d\n| by src_host, window=1d compute nxdomain_count, nxdomain_ratio,\n\
      \    servfail_count, first_seen_ratio, queries_per_min\n| baseline mean, sigma per host\n| where\
      \ nxdomain_count > mean+3*sigma OR nxdomain_ratio > p99_5\n       OR queries_per_min > p99_5\n|\
      \ emit alert(src_host, nxdomain_count, nxdomain_ratio)"
- question: Do any low-prevalence domains have anomalous requester profiles, where the geographic/network
    spread of the internal clients querying them deviates from normal patterns?
  context: Looking at who queries a domain (the requester profile) detects malware domains even when no
    IP reputation exists yet, by leveraging the diversity and distribution of the internal clients reaching
    out. For the Detect tactic, baseline the geographic/network spread of internal clients querying each
    domain, then flag low-prevalence domains whose requester profile is anomalous (for example a domain
    suddenly queried by an unusual cluster of hosts, or by hosts that share a common compromise vector).
    This upper-hierarchy vantage complements lexical and reputation signals. A positive result should
    be correlated with host triage and the prevalence/dynamism metrics from the other statistical checks.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - DNS resolver query logs
  - Passive DNS
  - 'NAI: Internal DNS resolvers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "load dns.log + passive_dns\n| by domain compute client_count, client_subnet_spread,\n    client_geo_spread\n\
      | where client_count < low_prevalence_threshold\n       AND requester_profile deviates_from baseline\n\
      | emit alert(domain, client_count, client_subnet_spread)"
- question: When a supervised reputation model scores newly observed domains, which never-before-seen
    domains receive high maliciousness scores from lexical, registration, TTL-dynamism, and IP/ASN-diversity
    features?
  context: Public blacklists lag attacker infrastructure by days or weeks; a supervised reputation model
    closes that gap. For the Detect tactic, train a decision tree / random forest / KNN on labeled benign
    vs. malicious domains using lexical, entropy, subdomain-depth, TLD, registration-age, TTL-dynamism,
    IP/ASN-diversity, and query-frequency features, then score newly observed domains. Such passive-DNS
    reputation models reach 96-98 percent TPR at sub-1 percent FPR and can flag domains weeks before they
    appear on public blacklists. Run this layer in parallel with, not in place of, the deterministic floor.
    A high score is a triage lead, not a verdict; validate with the contributing features and host context
    before acting.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Passive DNS
  - DNS resolver query logs
  - 'NAI: Internal DNS resolvers, Network egress points, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = load('domain_reputation_rf')\nload newly_observed_domains\n| featurize lexical, entropy,\
      \ subdomain_depth, tld,\n    registration_age, ttl_dynamism, ip_asn_diversity, query_freq\n| score\
      \ = model.predict_proba(features)\n| where score > 0.9\n| emit alert(domain, score, top_features)"
- question: When NXDOMAIN responses are classified in real time, which individual NXDOMAIN responses does
    a Random Forest/SVM classifier flag as DGA-generated based on structural and linguistic features?
  context: DNS failure telemetry can be turned into a first-party detection signal with no external lookups.
    For the Detect tactic, apply a Random Forest/SVM classifier to individual NXDOMAIN responses using
    per-domain structural, linguistic, and statistical features to detect DGA-based malware in real time.
    This approach generalizes to unseen DGA families and reaches very high accuracy (>99.7 percent F1).
    Because it scores each NXDOMAIN independently, it works on resolver streams without passive-DNS context.
    A positive classification on multiple NXDOMAINs from one host is a strong DGA-infection indicator;
    correlate with the per-host NXDOMAIN-rate statistic for confirmation.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Passive DNS
  - DNS resolver query logs
  - 'NAI: Internal DNS resolvers, Network egress points, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = load(''fanci_nxdomain_rf'')

      load dns.log where rcode == ''NXDOMAIN''

      | featurize structural, linguistic, statistical (per-domain)

      | label = model.predict(features)

      | where label == ''DGA''

      | by src_host aggregate count

      | emit alert(src_host, dga_nxdomain_count, sample_domains)'
- question: When a character-level LSTM scores raw queried domain strings, which single domains are flagged
    as DGA-generated (with attributed DGA family) directly on the resolver stream?
  context: A character-level LSTM scores a single queried domain string as DGA-generated or benign, and
    can attribute the DGA family, with no feature engineering and no passive-DNS context. For the Detect
    tactic, deploy this model for real-time per-query scoring on resolver streams; it complements the
    feature-based models by catching domains they miss and by working on the raw string alone. Because
    it needs only the domain text, it can score every query inline. A positive result should be enriched
    with the family attribution and corroborated against the entropy and NXDOMAIN signals; treat it as
    a parallel layer and keep the deterministic blocklist independent of any score.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Passive DNS
  - DNS resolver query logs
  - 'NAI: Internal DNS resolvers, Network egress points, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = load(''dga_lstm_charlevel'')

      load dns.log

      | for each query: score, family = model.predict(query_string)

      | where score > threshold

      | emit alert(src_host, query, score, dga_family)'
- question: For every model-flagged domain, are the top contributing features (entropy/KL, registration
    age, IP/ASN fan-out, NXDOMAIN rate) being surfaced in the alert so analysts can see why the domain
    scored as malicious?
  context: 'Model interpretability is essential for fast, defensible triage. For the Detect tactic, ensure
    every model-flagged domain emits its top-3 contributing features (for example entropy/KL score, registration
    age, IP/ASN fan-out, NXDOMAIN rate) in the alert text, using interpretable tree/RF feature attribution.
    This lets an analyst immediately understand the reasoning and decide whether the score is credible
    or a false positive driven by a benign-but-unusual trait. Critically, the deterministic blocklist
    floor must remain independent of the model so high-confidence hits never depend on a score. Reviewing
    whether alerts carry feature attribution is a control check: missing attribution means analysts are
    triaging blind and tuning is harder.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Passive DNS
  - DNS resolver query logs
  - 'NAI: Internal DNS resolvers, Network egress points, Endpoint devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'load model_flagged_domains

      | attribution = model.explain(features)  // tree/RF feature importance

      | top3 = top_n(attribution, 3)

      | enrich alert.text with top3 (name, value)

      | verify deterministic_blocklist_alerts independent_of model_score

      | emit alert(domain, score, top3_features)'
