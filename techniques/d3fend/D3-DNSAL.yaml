name: 'D3-DNSAL: DNS Allowlisting'
id: b2515223-f784-4ef6-ad6b-0b7fab149d5e
description: Investigate the effectiveness and integrity of DNS allowlisting as a network-isolation control.
  This playbook helps an analyst build and defend a DNS allowlist from first-party telemetry (Zeek dns.log/conn.log,
  Windows DNS Server Analytic Logs, and firewall/proxy denied-connection logs) by establishing a 30-day
  DNS baseline, admitting only consistently legitimate, high-prevalence business domains, and isolating
  low-prevalence, high-entropy, newly observed, fast-flux, and failure-heavy (NXDOMAIN-burst) domains
  for analyst review before approval. It covers candidate-list construction with hard prevalence floors,
  structural/RFC validation, trust-graded enforcement, statistical profiling of resolution failures and
  answer dynamism, lexical entropy scoring, and machine-learning DGA/reputation classification - all without
  mandatory external lookups - so the SOC can confirm legitimate business flows, quarantine suspicious
  infrastructure, and continuously monitor already-allowlisted domains for exfiltration and C2 abuse.
type: technique
related:
- tactic_id: D3-I
  tactic_name: Isolate
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Which registered domains, observed over a rolling 30-day window, meet hard prevalence floors
    (seen on many distinct days by many distinct internal clients) and match pre-approved business-critical
    categories, so that they qualify as allowlist candidates rather than being seeded from manipulable
    public popularity lists?
  context: 'Supports the Isolate tactic by ensuring the allowlist that defines the trusted network perimeter
    is built only from durable, internally-corroborated business activity. Aggregate unique registered
    domains from Zeek dns.log over a rolling 30 days and admit as candidates only domains meeting hard
    prevalence floors (e.g., observed on >=20 distinct days and queried by >=10 distinct internal clients)
    and matching pre-approved business-critical domains (internal zones, collaboration suites, sanctioned
    SaaS). Do NOT seed the allowlist directly from public popularity rankings: a single HTTP request can
    insert a malicious domain into such lists, so they are trivially manipulable. A domain passing multi-day,
    multi-client agreement is a defensible candidate; a domain failing the floors should be held for review,
    preventing an attacker from smuggling C2 or exfil infrastructure into the trusted set. References:
    [Tranco: A Research-Oriented Top Sites Ranking Hardened Against Manipulation](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_01B-3_LePochat_paper.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'domains = dns.log | last 30d | extract registered_domain

      per domain: distinct_days = count_distinct(date), clients = count_distinct(src_ip)

      candidate = (distinct_days >= 20 AND clients >= 10) OR domain in approved_business_categories

      EXCLUDE any seeding from public top-sites lists

      output candidate domains for review'
- question: Are approved domains represented as authoritative DNS records with graded trust levels (none/low/medium/high),
    and is resolution enforced only for approved zones and their subdomains, with newly graded or low-trust
    entries routed to monitoring rather than silently allowed?
  context: 'Directly implements the Isolate objective: the resolver should answer only for approved zones,
    turning the allowlist into an enforceable boundary. Following the DNSWL model, represent approved
    domains and their graded trust as authoritative records and enforce resolution only for approved zones
    and their subdomains. Verify that low-trust or newly graded entries are placed in a monitoring state
    instead of an unconditional allow, so freshly added or uncertain domains are watched. A positive result
    is a resolver configuration where every allowed answer maps to a trust-graded record; a negative result
    (resolution succeeding for un-graded or out-of-zone names) indicates a gap an attacker could use to
    reach unapproved infrastructure. References: [DNS Whitelist (DNSWL) Email Authentication Method Extension](https://datatracker.ietf.org/doc/html/rfc8904).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each resolved query in dns.log:\n  zone = match_approved_zone(query.name)\n  if zone is\
      \ None: ALERT 'resolution outside approved zones'\n  trust = lookup_trust(zone)\n  if trust in (none,\
      \ low) or zone.newly_graded: route_to_monitoring(query)"
- question: Which candidate domains violate DNS structural bounds (labels >63 octets, names >255 octets)
    or exhibit tunneling-style structure such as high subdomain fan-out or rare NULL/TXT record usage
    on newly observed hostnames, and should therefore be quarantined rather than allowed?
  context: 'Reinforces isolation by blocking domains whose very structure signals abuse before they enter
    the trusted set. Reject or quarantine candidates that violate RFC 1035 bounds - labels longer than
    63 octets or names longer than 255 octets - or that show tunneling structure: high subdomain fan-out
    and rare NULL/TXT record usage on newly observed hostnames. Legitimate business domains rarely breach
    these structural limits or rely on NULL records; such patterns are hallmarks of DNS tunneling and
    covert channels. A flagged domain should never be auto-allowed; quarantining it preserves the integrity
    of the allowlist. References: [RFC 1035 Domain Names Implementation and Specification](https://www.rfc-editor.org/rfc/rfc1035)
    and [Below the Radar: Spotting DNS Tunnels in Newly Observed Hostnames in the Wild](https://docs.apwg.org/ecrimeresearch/2019/Nov13_DennisTatang.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "dns.log | for each query:\n  max_label = max(len(l) for l in query.name.split('.'))\n  if\
      \ max_label > 63 or len(query.name) > 255: QUARANTINE\n  if query.qtype in (NULL, TXT) and query.name\
      \ is newly_observed: QUARANTINE\n  if subdomain_fanout(registered_domain) > threshold: QUARANTINE"
- question: For each allowlist candidate, do repeated successful policy-compliant DNS resolutions correlate
    with expected downstream connections (bytes transferred, established TCP), and which candidates resolve
    but never produce legitimate downstream business traffic and should be quarantined?
  context: Ensures the Isolate control only trusts domains that carry real business value, not domains
    that merely resolve. Correlate candidate domains across Zeek dns.log, Zeek conn.log, and Windows DNS
    Server Analytic Logs, retaining only domains with repeated successful, policy-compliant resolutions
    AND expected downstream connections such as bytes transferred and established TCP sessions. A domain
    that resolves repeatedly but yields no established connection or data transfer is suspicious - it
    may be beaconing, a parked/sinkholed name, or staging infrastructure - and should be quarantined rather
    than allowlisted.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "resolves = dns.log | candidate domains | success (rcode=NOERROR)\nconns = conn.log | join\
      \ on resolved_ip\nfor domain in candidates:\n  if count(resolves[domain]) >= N and exists conn with\
      \ orig_bytes>0 and conn_state='SF': KEEP\n  else: QUARANTINE 'resolves without business flow'"
- question: Which internal hosts exhibit an NXDOMAIN or blocked-lookup burst that exceeds their own trailing
    baseline (e.g., >3 sigma or >50 NXDOMAINs in 10 minutes), indicating DGA malware probing for live
    C2 before it can reach an allowed domain?
  context: 'Treats resolution failures as a first-class isolation signal: an allowlist that blocks unapproved
    names will generate failures, and a spike of them on one host is a strong indicator of DGA-based malware
    cycling through candidate C2 names. Compute per-host NXDOMAIN rate and count of blocked/denied lookups
    per minute, then alert when a host''s NXDOMAIN burst exceeds its trailing baseline. Derive thresholds
    from your own 30-day per-host distribution rather than fixed magic numbers. A sustained burst on a
    single host warrants endpoint investigation; quiet baselines confirm the allowlist is not being probed.
    References: [From Throw-Away Traffic to Bots: Detecting the Rise of DGA-Based Malware](https://www.usenix.org/system/files/conference/usenixsecurity12/sec12-final127.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host per 10min: nxd = count(dns where rcode=NXDOMAIN) + count(firewall denied dns)

      baseline_mean,std = trailing_30d_per_host(nxd)

      if nxd > baseline_mean + 3*std OR nxd > 50: ALERT host ''NXDOMAIN burst / possible DGA'''
- question: Among all observed domains, which fall into the long-tail (bottom-percentile query frequency,
    single-client, first-seen within the last 7 days) and should be ranked as exclusion-review candidates
    before any allowlist inclusion?
  context: 'Helps the analyst focus isolation review on the riskiest domains by combining prevalence and
    dynamism scoring. For all observed domains compute query frequency, unique-client count, and first-seen
    age, then use percentile thresholds (e.g., bottom 20th-percentile frequency, single-client, first-seen
    <7 days) to rank long-tail and newly observed domains as exclusion-review candidates. Malicious infrastructure
    is typically rare, used by few hosts, and recently registered; ranking by these features surfaces
    it for review before it can be trusted. High-prevalence, broadly-used, established domains drop to
    the bottom of the queue. References: [EXPOSURE: Finding Malicious Domains Using Passive DNS Analysis](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for domain in observed_domains(last 90d):\n  freq = query_count(domain); clients = distinct_clients(domain);\
      \ age = now - first_seen(domain)\nscore = (freq <= pctile(freq,20)) + (clients == 1) + (age < 7d)\n\
      rank domains by score desc -> exclusion-review queue"
- question: Which candidate domains resolve to many IPs across many ASNs and countries with very low TTL
    and high IP-set churn, marking them as fast-flux exclusions distinct from legitimate CDNs (which show
    stability and reverse-DNS coherence)?
  context: 'Protects the Isolate boundary from fast-flux C2 networks that rotate IPs to evade blocking.
    Per candidate domain compute distinct resolved IPs, distinct ASNs/countries, minimum TTL, and IP-set
    churn rate; flag domains with many IPs spread across many ASNs and very low TTL as fast-flux exclusions.
    Distinguish them from legitimate CDNs, which - despite many IPs - show stable IP sets, coherent reverse
    DNS, and consistent ASN ownership. A high churn + low TTL + multi-ASN profile should keep a domain
    out of the allowlist; a stable CDN-like profile can be trusted. References: [Early Detection of Malicious
    Flux Networks via Large-Scale Passive DNS Analysis (FluxBuster)](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf)
    and [EXPOSURE: Finding Malicious Domains Using Passive DNS Analysis](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per candidate domain over window:\n  ips=distinct(answer_ip); asns=distinct(asn(answer_ip));\
      \ cc=distinct(country(answer_ip))\n  min_ttl=min(ttl); churn=ip_set_change_rate()\nif ips high AND\
      \ asns high AND min_ttl < 300 AND churn high AND not rdns_coherent: FLAG fast-flux"
- question: Which registered domains carry disproportionate cumulative uplink information - high cumulative
    request bytes, high encoded-payload entropy, and large unique-subdomain counts - even at low throughput,
    indicating DNS data exfiltration?
  context: 'Defends both candidate gating and ongoing monitoring of already-allowlisted domains against
    low-and-slow DNS exfiltration. Maintain a streaming per-registered-domain tally of cumulative request
    bytes / encoded payload entropy and unique-subdomain count, flagging the small set of domains that
    carry disproportionate uplink information even at low throughput. Exfiltration over DNS hides in the
    request side (subdomain labels) and may never spike instantaneous volume, so cumulative information
    per domain is the right heavy-hitter signal. A domain accumulating high encoded uplink with many unique
    subdomains should be excluded or investigated even if currently allowlisted. References: [Information-Based
    Heavy Hitters for Real-Time DNS Data Exfiltration Detection](https://www.ndss-symposium.org/wp-content/uploads/2024-388-paper.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "stream dns.log per registered_domain:\n  cum_req_bytes += len(query.name)\n  uniq_subdomains.add(subdomain_label)\n\
      \  payload_entropy = entropy(decoded_labels)\nif cum_req_bytes or len(uniq_subdomains) or payload_entropy\
      \ in top heavy-hitters: ALERT 'possible DNS exfil'"
- question: Which candidate domain labels score high on Kullback-Leibler divergence against an English
    bigram baseline (rather than raw Shannon entropy), marking them as DGA-like exclusion candidates,
    and what are the top contributing bigrams?
  context: 'Improves the lexical screening of allowlist candidates by reducing false positives on short
    legitimate names. Score each candidate label with KL divergence against an English bigram baseline
    instead of raw Shannon entropy; high-divergence labels look statistically unlike human-chosen names
    and are DGA-like exclusion candidates. Emit the computed divergence and the top contributing bigrams
    so an analyst can sanity-check the score. A high-divergence label (e.g., random consonant runs) should
    be treated as an exclusion candidate, while low-divergence brandable names pass screening even when
    short. References: [Using Entropy in Threat Hunting: a Mathematical Search for the Unknown](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "english_bigrams = load_baseline()\nfor domain in candidates:\n  div = kl_divergence(bigram_dist(domain.label),\
      \ english_bigrams)\n  if div > threshold: FLAG exclusion-candidate with div, top_bigrams(domain.label)"
- question: Using a feature-based classifier over per-domain lexical features (length, entropy, n-gram
    frequency, vowel/digit ratios, repeated chars), which NXDOMAIN and candidate domains are labeled DGA-generated,
    with the top-3 contributing features surfaced for analyst review?
  context: 'Applies explainable machine learning to keep DGA infrastructure out of the allowlist. Run
    a feature-based classifier (random forest/SVM) over per-domain lexical features - length, entropy,
    n-gram frequency, vowel/digit ratios, repeated characters - to label DGA-generated names from NXDOMAIN
    traffic and candidate domains. Surface the top-3 contributing features (e.g., entropy, digit ratio,
    rarest bigram) in the alert text so analysts can trust the verdict. Auto-exclude high-confidence DGA
    domains and route low-confidence cases to analysts, balancing automation with human review for the
    Isolate decision. References: [FANCI: Feature-based Automated NXDomain Classification and Intelligence](https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-schuppen.pdf)
    (code: https://github.com/fanci-dga-detection/fanci).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [length, entropy, ngram_freq, vowel_ratio, digit_ratio, repeat_chars]

      score = rf_dga_model.predict_proba(features(domain))

      if score >= 0.9: AUTO_EXCLUDE

      elif score >= 0.5: QUEUE_ANALYST

      report top3_feature_importances(domain)'
- question: Using a character-level LSTM that scores DGA likelihood from the raw domain string alone (no
    external lookups), which domains are flagged as DGA and to which family, and where do the LSTM and
    the feature-based model disagree (requiring analyst review)?
  context: 'Provides a parallel, lookup-free DGA detector to cross-check the feature-based classifier.
    Apply a character-level LSTM that scores DGA likelihood from the raw domain string alone and attributes
    a likely DGA family. Use it alongside the feature-based model; where the two models disagree, require
    analyst review before excluding a domain, reducing both false exclusions of legitimate names and false
    trust of malicious ones. Agreement between the two models gives high confidence for the Isolate decision;
    disagreement is itself a useful triage signal. References: [Predicting Domain Generation Algorithms
    with Long Short-Term Memory Networks](https://arxiv.org/pdf/1611.00791).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'lstm_score, family = char_lstm.predict(domain_string)

      rf_score = rf_dga_model.predict_proba(features(domain))

      if lstm_score high and rf_score high: EXCLUDE (family)

      if disagree(lstm_score, rf_score): QUEUE_ANALYST'
- question: For candidate domains lacking any internal history, what reputation score do network (AS/IP
    fan-out), zone (related-domain lexical structure), and evidence features produce, and which low-reputation
    domains resembling known-bad infrastructure should be denied or queued?
  context: 'Extends the Isolate control to never-before-seen domains where prevalence data is absent.
    For candidates lacking internal history, compute a reputation score from network features (AS/IP fan-out),
    zone features (related-domain lexical structure), and evidence features, then deny or queue low-reputation
    domains that resemble known-bad infrastructure. Report the dominant contributing feature group in
    the decision so analysts understand whether the score was driven by network, zone, or evidence signals.
    Low-reputation new domains should not be trusted by default; high-reputation ones may be fast-tracked.
    References: [Building a Dynamic Reputation System for DNS (Notos)](https://www.usenix.org/legacy/event/sec10/tech/full_papers/Antonakakis.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for new_domain with no internal_history:\n  net_feats = as_ip_fanout(new_domain)\n  zone_feats\
      \ = related_domain_lexical(new_domain)\n  ev_feats = evidence_features(new_domain)\n  rep = notos_reputation_model(net_feats,\
      \ zone_feats, ev_feats)\nif rep < threshold: DENY/QUEUE; report dominant_feature_group"
- question: When clustering observed domains by lexical and usage features (length, Shannon/KL entropy,
    TLD, query burstiness, distinct-IP fan-out, unique-client count), which clusters show DGA-like or
    low-prevalence characteristics and should be treated as allowlist-exclusion candidates?
  context: 'Finds suspicious domain families at scale to complement single-domain scoring for the Isolate
    decision. Apply DBSCAN to observed domains using features such as domain length, Shannon/KL entropy,
    TLD, query burstiness, distinct-IP fan-out, and unique-client count; clusters with DGA-like or low-prevalence
    characteristics are explicit allowlist-exclusion candidates. This unsupervised approach catches coordinated
    malicious families that individually might slip past thresholds, and complements behavioral low-throughput
    exfiltration models. List the cluster''s defining features in the alert so analysts can validate the
    grouping. References: [Detection of Malicious and Low Throughput Data Exfiltration Over the DNS Protocol](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows DNS Server Analytic Logs
  - Firewall/Proxy denied-connection logs
  - 'NAI: Internal DNS resolvers and network egress points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(domains): [length, shannon, kl, tld, burstiness, ip_fanout, client_count]\nlabels\
      \ = DBSCAN(eps, min_samples).fit_predict(scale(X))\nfor cluster in labels:\n  if cluster_profile\
      \ is DGA-like or low-prevalence: mark members EXCLUSION-CANDIDATE\n  report cluster_defining_features"
