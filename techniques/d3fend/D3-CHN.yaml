questions:
- question: Did any network flow (Zeek conn.log or firewall connection log) have a source or destination
    matching a designated honeynet asset, excluding sanctioned health-check or scanner IPs on the allowlist?
  context: 'Production systems should not legitimately interact with deception infrastructure, so any
    flow touching a honeynet asset is suspicious by construction and warrants a high-priority alert. Maintain
    an explicit allowlist of sanctioned vulnerability scanners and monitoring sources so their probes
    do not mask a real intrusion. A positive result (a flow from a non-allowlisted host) is strong evidence
    of reconnaissance or active engagement against the deception infrastructure and supports the Deceive
    objective of detecting and studying adversary behavior; a negative result means no unexpected network
    contact occurred during the window. References: [Demystifying Deception Technology: A Survey](https://arxiv.org/abs/1804.06196),
    [Application Layer Cyber Deception without Developer Interaction](https://arxiv.org/abs/2405.12852).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: LOAD conn.log | WHERE id.orig_h IN honeynet_assets OR id.resp_h IN honeynet_assets | WHERE
      id.orig_h NOT IN allowlist_ips AND id.resp_h NOT IN allowlist_ips | ALERT priority=high
  - technology: SIEM/Rule pseudocode
    query: source=firewall_conn (src_ip IN honeynet_assets OR dst_ip IN honeynet_assets) NOT (src_ip IN
      allowlist OR dst_ip IN allowlist) | eval severity="high" | alert
- question: Was any planted decoy credential, canary file, fake cloud API key, or honeytoken account submitted,
    authenticated, or otherwise used, and can the hit be confirmed out-of-band?
  context: 'Decoy credentials and honeytokens are zero-false-positive tripwires: because they correspond
    to no real account or asset, any use proves hands-on adversary interaction. Verify decoy logons via
    an out-of-band honeychecker so a single hit is conclusive, and deploy embeddable tokens (unique URLs,
    DNS names, documents) that fire with the attacker''s source IP and user-agent on first interaction.
    A positive result is conclusive proof of compromise or credential theft and directly serves the Deceive
    tactic by capturing attacker context; a negative result indicates no planted token was triggered.
    References: [Honeywords: Making Password-Cracking Detectable](https://people.csail.mit.edu/rivest/pubs/JR13.pdf),
    [Tripwire: Inferring Internet Site Compromise](https://cseweb.ucsd.edu/~voelker/pubs/tripwire-imc17.pdf),
    [Canarytokens](https://docs.canarytokens.org/guide/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: source=(honeytoken_trigger OR canarytoken OR auth_log) (account IN decoy_accounts OR token_id
      IN canary_tokens OR access_key IN fake_keys) | honeychecker_verify(account) | alert priority=critical,
      capture src_ip, user_agent
  - technology: DNS/pseudocode
    query: LOAD dns.log | WHERE query MATCHES canarytoken_dns_names | ALERT capture orig_h, query, ts
- question: Was any SACL-audited decoy file (honeyfile) on a honeynet host read or opened, as recorded
    by Windows Event ID 4663?
  context: 'Honeyfiles are decoy documents placed on honeynet hosts with object-access auditing (SACL)
    enabled so that any read or open generates an Event ID 4663. Decoy content and enticement should be
    tuned so attackers reliably engage while keeping the access a deterministic, near-zero-false-positive
    signal. A positive result (a 4663 read against a honeyfile) indicates an actor is browsing or exfiltrating
    from the decoy, supporting the Deceive objective of observing adversary intent; a negative result
    means no decoy file was accessed. Reference: [TSM: Measuring the Enticement of Honeyfiles with NLP](https://arxiv.org/abs/2203.07580).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: source=WinEventLog EventID=4663 ObjectName IN honeyfile_paths AccessMask IN (read,open) Computer
      IN honeynet_hosts | alert capture SubjectUserName, ProcessName, src
- question: Do honeynet hosts show multi-step chains linking a logon (Event ID 4624) to subsequent process
    creation (4688) and file-access (4663) events that indicate active engagement rather than opportunistic
    scanning?
  context: 'Correlating a successful logon to follow-on process execution and file access on a decoy host
    distinguishes hands-on engagement from passive scanning. Compare observed protocol, host, and asset
    attributes against the expected decoy policy to confirm a rogue interactor. A positive result (a complete
    logon-to-execution-to-file-access chain on a honeynet host) should be escalated as active adversary
    engagement consistent with the Deceive tactic''s goal of studying intruder behavior; a negative result
    suggests at most opportunistic or automated probing. References: [Wireless Rogue Access Point Detection
    Using Shadow Honeynet](https://doi.org/10.1007/s11277-015-2408-0), [A Survey on Honeypot Software
    and Data Analysis](https://arxiv.org/abs/1608.06249).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days; correlate events within a single session window (e.g. +/- 30 minutes of the 4624)
  queries:
  - technology: SIEM/Rule pseudocode
    query: source=WinEventLog Computer IN honeynet_hosts | transaction by LogonId starts_with EventID=4624
      | where any(EventID=4688) AND any(EventID=4663) | compare(protocol,host,asset) against decoy_policy
      | alert priority=high
- question: For each honeynet session, do the Volume (bytes in/out, touched-object count), Frequency (connections/min,
    commands/min, session duration), or State (successful vs failed logons, TCP resets) metrics exceed
    historical percentile bands?
  context: 'Computing per-session Volume, Frequency, and State metrics and alerting when they exceed per-deployment
    historical percentile bands (for example >P95 command rate or >P95 byte volume) prioritizes hands-on-keyboard
    activity over scripted probes. A positive result (metrics above the learned thresholds) flags an unusually
    heavy or interactive session deserving analyst attention under the Deceive tactic; a negative result
    indicates the session resembles routine low-volume scanning. Reference: [A Survey on Honeypot Software
    and Data Analysis](https://arxiv.org/abs/1608.06249).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days; baseline over trailing 30-90 days per deployment
  queries:
  - technology: SIEM/Stats pseudocode
    query: source=(zeek_conn OR WinEventLog) host IN honeynet_assets | bin by session | stats sum(bytes)
      as vol, count(cmd)/duration as cmd_rate, count(conn)/min as freq, count(4624) as ok, count(4625)
      as fail by session | where vol>P95(vol) OR cmd_rate>P95(cmd_rate) OR freq>P95(freq) | alert
- question: What are the failure and error rates per honeynet session — failed logons (4625), connection
    resets, blocked firewall attempts, NXDOMAIN responses, and emulated-service error/404 responses —
    and do they indicate brute-force/credential-stuffing versus interactive compromise?
  context: 'Explicitly baselining failure and error telemetry separates credential-stuffing and brute-force
    (characterized by a high failure ratio and low success) from interactive compromise (a success following
    failures). Both patterns are flagged as distinct adversary modes. A positive result with a high failure-to-success
    ratio points to automated guessing, while a success-after-failures pattern signals likely interactive
    compromise — both informative to the Deceive objective; a negative result shows no elevated error
    activity. References: [Tripwire: Inferring Internet Site Compromise](https://cseweb.ucsd.edu/~voelker/pubs/tripwire-imc17.pdf),
    [Honeywords: Making Password-Cracking Detectable](https://people.csail.mit.edu/rivest/pubs/JR13.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: source=(WinEventLog OR zeek_dns OR firewall OR honeyservice) host IN honeynet_assets | stats
      count(eval(EventID=4625 OR rcode=NXDOMAIN OR action=blocked OR http_status>=400)) as failures, count(eval(EventID=4624
      OR http_status=200)) as successes by src_ip | eval ratio=failures/(successes+1) | where ratio>threshold
      OR (failures>0 AND successes>0) | classify
- question: Does any honeynet session exhibit command-line entropy, argument length, or process diversity
    (from Event ID 4688) that exceeds the historical percentile bands expected for the lure service?
  context: 'Baselining command complexity — command-line entropy, argument length, and process-diversity
    distributions from 4688 process-creation events — and alerting on sessions above historical percentile
    bands marks complex post-exploitation activity that exceeds what the emulated lure service should
    normally generate. A positive result (high-complexity command activity) indicates sophisticated hands-on
    tooling consistent with the Deceive tactic''s interest in studying adversary TTPs; a negative result
    indicates command activity within expected lure behavior. Reference: [A Survey on Honeypot Software
    and Data Analysis](https://arxiv.org/abs/1608.06249).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days; baseline over trailing 30-90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: source=WinEventLog EventID=4688 Computer IN honeynet_hosts | eval ent=entropy(CommandLine),
      arglen=len(CommandLine) | stats avg(ent) as ent, max(arglen) as arglen, dc(NewProcessName) as proc_div
      by session | where ent>P95(ent) OR arglen>P95(arglen) OR proc_div>P95(proc_div) | alert
- question: How deep is each attacker's engagement in the honeynet when modeled as state transitions with
    per-state sojourn times using a Semi-Markov model, and does it distinguish transient scans from sustained
    interaction?
  context: 'A Semi-Markov model characterizes attacker state transitions and per-state sojourn (dwell)
    times in the honeynet to quantify engagement depth and reward/risk. This distinguishes transient scans
    from sustained interaction and informs how long to keep engaging the adversary. A positive result
    (deep engagement with long sojourn times across multiple states) marks a high-value interaction worth
    continued observation under the Deceive tactic; a negative result indicates shallow, transient contact.
    Reference: [Adaptive Honeypot Engagement through Reinforcement Learning of Semi-Markov Decision Processes](https://arxiv.org/abs/1906.12182).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: model SMDP over session_states(scan,login,exec,file,exfil) | estimate per-state sojourn_time
      and transition_probs | compute engagement_depth = sum(sojourn_time * state_weight) | rank sessions
      by engagement_depth | flag deep-engagement sessions
- question: When honeynet sessions are clustered on combined network and host features (byte volume, command
    count/rate, process diversity, touched decoys, failure ratio), which sessions fall into advanced post-exploitation
    archetypes versus scanner or credential-tester archetypes?
  context: 'Unsupervised clustering of combined network+host session features classifies sessions into
    archetypes (scanner, credential tester, post-exploitation actor) so analysts can prioritize advanced
    clusters. Surface the top-3 contributing features (e.g., command count, byte volume, decoy-token type)
    in the alert text for triage. A positive result (a session assigned to an advanced/post-exploitation
    cluster) elevates triage priority in line with the Deceive objective; a negative result places the
    session in a low-priority automated cluster. References: [What are Attackers after on IoT Devices?
    An approach based on a multi-phased multi-faceted IoT honeypot ecosystem and data clustering](https://arxiv.org/abs/2112.10974),
    [A Survey on Honeypot Software and Data Analysis](https://arxiv.org/abs/1608.06249).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days; cluster over trailing 30-90 days of sessions
  queries:
  - technology: ML/pseudocode
    query: 'X = features(byte_vol, cmd_count, cmd_rate, proc_diversity, touched_decoys, failure_ratio)
      per session | model = cluster(X)  # e.g. KMeans/DBSCAN | label clusters {scanner, cred_tester, post_exploit}
      | for each session: emit cluster + top3 contributing_features | prioritize post_exploit'
- question: Can a supervised classifier trained on decoy-captured behavioral and content features recognize
    known attacker tooling and generalize to previously unseen actors at high precision?
  context: 'Because all honeynet telemetry is attacker-generated, supervised classifiers (for example
    an SVM) can be trained on captured behavioral and content features to recognize and generalize attacker
    tooling to new actors at high precision, exporting per-prediction feature contributions for explainable
    triage. A positive result (a session classified as known malicious tooling) provides high-precision
    attribution supporting the Deceive tactic; a negative result means the behavior did not match learned
    attacker signatures. Reference: [Uncovering Social Spammers: Social Honeypots + Machine Learning](https://faculty.cse.tamu.edu/caverlee/pubs/lee10sigir.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4663
  - Honeytoken/Canarytoken trigger logs
  - Firewall connection logs
  - 'NAI: The connected honeynet server(s) and the network switches/sensors monitoring traffic to/from
    the honeynet''s subnet.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'train model = SVM(features=behavioral+content, labels=attacker_tool_class) on historical honeynet
      sessions | for new session: pred = model.predict(features); export feature_contributions | alert
      if pred in known_malicious with confidence>threshold'
- question: What adaptive engagement policy, learned via reinforcement learning over the honeynet's SMDP
    state transitions, keeps adversaries interacting long enough to collect indicators of compromise while
    bounding the probability of deeper penetration?
  context: 'Reinforcement learning over the honeynet''s Semi-Markov decision-process state transitions
    derives risk-averse, cost-effective engagement policies that prolong attacker interaction to collect
    IoCs while bounding penetration probability; the learned per-state features double as inputs for session
    classification. A positive result (a policy that successfully extends engagement and yields new IoCs)
    directly advances the Deceive objective; a negative result or policy that ends engagement early limits
    intelligence collection. Reference: [Adaptive Honeypot Engagement through Reinforcement Learning of
    Semi-Markov Decision Processes](https://arxiv.org/abs/1906.12182).'
