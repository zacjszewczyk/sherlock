name: 'D3-CHN: Connected Honeynet'
id: c9cca2f8-863e-419b-8789-68480ebd773b
description: This playbook helps an analyst investigate adversary interaction with a connected honeynet
  — a decoy service, system, or environment attached to the enterprise network that emulates functionality
  to attract attackers without exposing a production system. Because no legitimate production workflow
  should ever touch the deception infrastructure, any inbound/outbound session or host activity (logons,
  process execution, file access, decoy-credential or honeytoken use) on decoy assets is high-confidence
  adversary evidence. The questions below guide deterministic tripwire detection (honeytokens, honeyfiles,
  any network touch), statistical triage of session volume/frequency/state and failure rates to separate
  scanners and credential-stuffing from hands-on-keyboard compromise, and machine-learning approaches
  to cluster interaction archetypes, classify attacker tooling, and learn adaptive engagement policies
  that keep adversaries engaged long enough to collect indicators of compromise.
type: technique
