name: 'AT1667: Application API Abuse'
id: a4c4cf5d-54da-491b-ab1b-358294fcdb42
description: Investigate suspected abuse of internet-exposed AWS application APIs to gain an initial foothold.
  This playbook helps an analyst determine whether an external caller abused exposed application API methods
  in a manner deviating from normal consumer behavior — for example, repeated authentication/authorization
  failures followed by successful invocation of high-risk administrative, data-access, or account-management
  functions from the same source infrastructure, user-agent family, or token context. It further guides
  the analyst to confirm whether the API was used as a pivot to reach protected data or downstream services,
  evidenced by successful calls to rarely used or newly observed endpoints followed by abnormal backend
  access, large object retrieval, SSRF-to-metadata/credential theft, or credential-bearing service calls
  inconsistent with the caller's historical scope. The playbook combines symbolic logic (deny-then-allow
  correlation, WAF/CRS scoring, first-seen role/action detection, metadata-access correlation), statistical
  profiling (median/MAD modified Z-scores, seasonal forecast residuals, byte-distribution outliers), and
  machine-learning sequence/compromise models across API Gateway, CloudTrail, WAF, ALB/CloudFront, VPC
  Flow, and S3 access logs.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
