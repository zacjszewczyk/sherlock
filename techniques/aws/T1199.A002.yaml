name: 'T1199.A002: Role Assumption and Federated Access'
id: 2ee0abc1-623c-4d14-b710-52d35dcc8fff
description: 'Investigate whether an adversary has established or is maintaining persistence in AWS by
  abusing trusted cross-account role assumption (sts:AssumeRole, AssumeRoleWithSAML, AssumeRoleWithWebIdentity)
  or federated identity paths (SAML/OIDC) that continue to grant access after the initial compromise.
  This playbook helps an analyst determine whether an external AWS account, SAML identity provider, or
  OIDC-backed federated principal repeatedly assumes sensitive production or administrative roles through
  trust paths that are broader than intended, recently modified, or unused in normal operations - giving
  the adversary a repeatable re-entry mechanism without creating a persistent IAM user inside the victim
  account. It also covers the follow-on behavior: recurring management-plane or data-access activity from
  the same outside principal after assumption, indicating the trust path is being used as a durable foothold
  for discovery, privilege retention, or access to sensitive services rather than a one-time delegated
  task. Questions combine deterministic first-seen and trust-change rules, statistical baselining of reuse
  cadence and failure profiles, and sequence/graph machine-learning models, drawing primarily on CloudTrail
  management events, CloudTrail Lake, AWS Config, IAM Access Analyzer, GuardDuty, and VPC Flow Logs.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is any external AWS account, SAML issuer, or OIDC subject assuming a production or administrative
    IAM role through a trust path - calling account ID, SAML issuer, OIDC subject, source-IP CIDR, role
    session-name pattern, or externalId - that has never been seen for that role in the trailing 30-day
    baseline?
  context: 'This targets the moment an adversary re-enters via a trusted relationship. Alert on AssumeRole,
    AssumeRoleWithSAML, or AssumeRoleWithWebIdentity into sensitive roles when the principal context is
    new versus a 30-day baseline of that role''s normal callers. A positive result - a never-before-seen
    outsider on a sensitive role - is a strong persistence signal, especially when the trust policy was
    modified in the prior 24h, expected condition keys (externalId, MFA, source constraints) are absent,
    or the session bypasses the role''s normal guardrails. A baseline match lowers concern but should
    still feed cadence baselining. Maps to AN1348 under Persistence (TA0003), where cross-account/third-party
    principals assume roles into the account. Detection-as-code references: [Elastic Detection Rules -
    AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws) and the [Panther
    Analysis Repository](https://github.com/panther-labs/panther-analysis).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - IAM Access Analyzer findings
  - 'NAI: Cross-account trust relationships for production roles, IAM roles accessible through SAML or
    web identity federation, and configuration history for trust-policy changes in sensitive accounts'
  range: Last 90 days (baseline 30 days; evaluate new assumptions near-real-time)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=AWS:CloudTrail eventName IN (\"AssumeRole\",\"AssumeRoleWithSAML\",\"AssumeRoleWithWebIdentity\"\
      )\n  | where resources.ARN IN (sensitive_role_arns)\n  | eval ctx=mvjoin(callerAccountId, samlIssuer,\
      \ oidcSub, sourceIPCIDR, sessionNamePattern, externalId)\n  | lookup role_caller_baseline_30d role,\
      \ ctx OUTPUT seen\n  | where isnull(seen)\n  | join role [search eventName=\"UpdateAssumeRolePolicy\"\
      \ earliest=-24h]\n  | table _time role callerAccountId sourceIPAddress externalId mfaAuthenticated\
      \ trustPolicyChanged"
- question: For each AssumedRole identity, does any successful CloudTrail call use a (role, API action)
    pair that is absent from the role's first-seen baseline or was first observed only within the last
    24 hours?
  context: 'Adversaries who pivot through an assumed role betray themselves by invoking API actions that
    role has never legitimately used. Maintain a first-seen lookup of (role, API) pairs and alert on combinations
    missing from the baseline or first seen in the last 24h, encoding documented recon-to-privilege API
    chains (GetCallerIdentity -> List*/Describe* -> privilege/data APIs). A positive result indicates
    the trust path is being exercised beyond its intended narrow purpose - a persistence/exploration signal.
    Validate logic against the flaws.cloud CloudTrail dataset. Supports AN1348 (Persistence). References:
    [Cloud API Calls From Previously Unseen User Roles](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/),
    real-world recon-to-privilege chains in [Compromised Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/),
    validated against the [flaws.cloud CloudTrail dataset](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - IAM Access Analyzer findings
  - 'NAI: Cross-account trust relationships for production roles, IAM roles accessible through SAML or
    web identity federation, and configuration history for trust-policy changes in sensitive accounts'
  range: Last 90 days (first-seen baseline continuously maintained)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=AWS:CloudTrail userIdentity.type=\"AssumedRole\" errorCode=null\n  | eval role=userIdentity.sessionContext.sessionIssuer.arn,\
      \ api=eventName\n  | stats min(_time) as first_seen by role, api\n  | where first_seen >= relative_time(now(),\"\
      -24h\") OR NOT [| inputlookup role_api_baseline]\n  | table role api first_seen"
- question: Was an IAM trust policy or federation provider changed (UpdateAssumeRolePolicy, CreateSAMLProvider/UpdateSAMLProvider,
    OIDC provider creation, trust-condition change) and then the newly permitted external principal successfully
    assumed that role within 24 hours?
  context: 'This stitches the configuration change to its abuse, presenting one persistence workflow:
    who changed the trust, what statement was added, and who first used the new path. Correlate trust/federation
    modification events with subsequent successful AssumeRole* by the newly permitted principal inside
    24h. A positive result is high-confidence persistence establishment - the adversary widened a trust
    relationship to grant themselves durable re-entry. Present the changed trust statement, actor, and
    first-use timeline together. Maps to AN1348 (Persistence) trust-modification chain. Reference: [Elastic
    Detection Rules - AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - IAM Access Analyzer findings
  - 'NAI: Cross-account trust relationships for production roles, IAM roles accessible through SAML or
    web identity federation, and configuration history for trust-policy changes in sensitive accounts'
  range: Last 90 days (correlate change and first-use within a 24h window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=AWS:CloudTrail eventName IN (\"UpdateAssumeRolePolicy\",\"CreateSAMLProvider\",\"UpdateSAMLProvider\"\
      ,\"CreateOpenIDConnectProvider\")\n  | rename requestParameters.roleName as role\n  | join type=inner\
      \ role [search source=AWS:CloudTrail eventName IN (\"AssumeRole\",\"AssumeRoleWithSAML\",\"AssumeRoleWithWebIdentity\"\
      )\nerrorCode=null]\n  | where assume_time>=change_time AND assume_time<=change_time+86400\n  | table\
      \ change_time changed_by trustStatement newExternalPrincipal assume_time role"
- question: Is any external or assumed-role principal generating an elevated rate of AccessDenied or throttle
    responses on sts:AssumeRole, iam:*, or Describe* calls - exceeding a tuned threshold (default >=15/hour)
    within a rolling 60-minute window - indicating trust enumeration?
  context: 'Before settling into a trusted role, adversaries often probe which roles they can assume and
    what permissions exist, producing a burst of failures. Profile per-source-IP and per-identity AccessDenied/throttle
    counts in a rolling 60-minute window as a distinct signal; derive the threshold from the 99th percentile
    of benign role behavior (default >=15/hour). A positive result suggests active reconnaissance of the
    trust landscape, a precursor to durable foothold establishment. A low/zero failure rate is normal.
    Maps to AN1348 (Persistence) discovery profiling. Reference: [AWS IAM AccessDenied Discovery Events](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - IAM Access Analyzer findings
  - 'NAI: Cross-account trust relationships for production roles, IAM roles accessible through SAML or
    web identity federation, and configuration history for trust-policy changes in sensitive accounts'
  range: Last 90 days (rolling 60-minute evaluation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=AWS:CloudTrail (errorCode=\"AccessDenied\" OR errorCode=\"*Throttl*\")\n  eventName\
      \ IN (\"AssumeRole\",\"iam:*\",\"Describe*\")\n  | bin _time span=60m\n  | stats count as denials\
      \ by _time, sourceIPAddress, userIdentity.arn\n  | eventstats p99(denials) as thr | eval thr=max(15,thr)\n\
      \  | where denials>=thr"
- question: Does any trusted role's current external reuse cadence - source-account diversity, sessions
    per day, session duration, day-of-week usage, or count of distinct federated identities - exceed both
    its own 30-day baseline and the 95th percentile of peer production roles?
  context: 'Genuine delegated tasks have stable, predictable rhythms; a foothold shows abnormal recurrence.
    Baseline each trusted role''s reuse cadence over a trailing 30-day window and flag roles whose current
    external reuse or source novelty exceeds both the role baseline and the peer-role 95th percentile.
    A positive result indicates the trust path is being exercised as a repeatable re-entry mechanism rather
    than for incidental partner access. This first-seen/peer baselining echoes the Netflix CloudTrail
    Anomaly Detector approach. Maps to AN1348 (Persistence) recurrence baselining. References: first-seen
    baselining as in the [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)
    and method guidance from [Experience Report: System Log Analysis for Anomaly Detection](https://jiemingzhu.github.io/pub/slhe_issre2016.pdf).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - IAM Access Analyzer findings
  - 'NAI: Cross-account trust relationships for production roles, IAM roles accessible through SAML or
    web identity federation, and configuration history for trust-policy changes in sensitive accounts'
  range: Last 90 days (trailing 30-day baseline; daily cadence evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=AWS:CloudTrail eventName=\"AssumeRole*\" errorCode=null\n  | stats dc(callerAccountId)\
      \ as acct_div count as sessions dc(userIdentity.arn) as fed_ids avg(duration)\nas dur by role, date\n\
      \  | eventstats avg(sessions) as base_s stdev(sessions) as base_sd by role\n  | eventstats p95(sessions)\
      \ as peer95\n  | where sessions > base_s+3*base_sd AND sessions > peer95"
- question: After assumption, how many accounts, regions, and high-value services does each external principal
    reach, and is the control-plane breadth or cross-account spread per session unusually large versus
    that trust relationship's norm even when individual calls look valid?
  context: 'Even when each API call is individually authorized, abnormally broad reach across accounts/regions/services
    per session reveals a foothold being leveraged for expansion. Measure per-principal account/region/service
    breadth and privileged-API count per session, and flag sessions whose spread is unusually large versus
    the trust relationship''s history. Forecast expected per-principal volume with time-series methods
    (e.g., Prophet) to set adaptive thresholds. A positive result indicates wide post-assumption blast
    radius - persistence enabling lateral expansion. Maps to AN1348 (Persistence) breadth analysis. References:
    forecast expected per-principal volume with Prophet/causal feature selection per [Cloud Intrusion
    Detection Using Time Series Forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x)
    and [CloudWatch ML over CloudTrail metrics](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - IAM Access Analyzer findings
  - 'NAI: Cross-account trust relationships for production roles, IAM roles accessible through SAML or
    web identity federation, and configuration history for trust-policy changes in sensitive accounts'
  range: Last 90 days (per-session aggregation with forecasted thresholds)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=AWS:CloudTrail userIdentity.type=\"AssumedRole\"\n  | stats dc(recipientAccountId)\
      \ as accts dc(awsRegion) as regions dc(eventSource) as svcs count(eval(privileged_api))\nas priv\
      \ by sessionId, principal\n  | eventstats avg(svcs) as f_svcs stdev(svcs) as sd_svcs by principal\n\
      \  | where svcs > f_svcs+3*sd_svcs OR accts>1"
- question: Does a sequence model over per-role CloudTrail/STS event streams - using trust-policy age,
    provider novelty, session-name entropy, recurrence interval, source reputation, and follow-on privileged
    APIs - rank any session as resembling durable foothold behavior?
  context: 'Deterministic rules can miss slow, low-and-slow persistence; a learned model captures temporal
    structure. Train an LSTM next-event-prediction model (DeepLog-style) on per-role event streams and
    rank sessions higher when patterns match durable foothold behavior, surfacing the top-3 contributing
    features/deviating events in alert text. Mitigate concept drift and evaluation leakage. A high model
    score with explanatory features warrants investigation; always retain the deterministic first-seen
    and trust-change rules as a floor so the ML augments rather than replaces them. Maps to AN1348 (Persistence)
    advanced detection. References: LSTM next-event prediction in the style of [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    mitigate concept drift and evaluation leakage per [Deep Learning for Anomaly Detection in Log Data:
    A Survey](https://arxiv.org/pdf/2207.03820).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - IAM Access Analyzer findings
  - 'NAI: Cross-account trust relationships for production roles, IAM roles accessible through SAML or
    web identity federation, and configuration history for trust-policy changes in sensitive accounts'
  range: Last 90 days (model retrained periodically; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model=lstm_deeplog(input=per_role_event_sequence,\n    features=[trust_policy_age, provider_novelty,\
      \ session_name_entropy, recurrence_interval, source_reputation,\nfollowon_priv_apis])\n  | predict\
      \ next_event ; score = surprise(actual, predicted)\n  | where score > tuned_threshold\n  | annotate\
      \ top3_features ; floor_rules=[first_seen_role_api, trust_change_then_reuse]"
- question: Are externally sourced assumed-role sessions repeatedly executing reconnaissance/access APIs
    (GetCallerIdentity, List*, Describe*, GetSecretValue, kms:Decrypt, ssm:GetParameter, s3:ListBucket,
    iam:Get*) across multiple days, with the same outside principal returning to the same role and revisiting
    privileged services or sensitive buckets?
  context: 'Persistence is confirmed when an outside principal returns repeatedly and exercises recon/access
    APIs over multiple days - the hallmark of a durable foothold rather than a one-time delegated task.
    Detect external assumed-role sessions running these API chains and raise severity when the same principal
    re-enters the same role and revisits privileged services or sensitive buckets. A positive result strongly
    indicates the trust path is a maintained re-entry mechanism. Match against documented compromised-credential
    API chains. Maps to AN1348 (Persistence) recurring-recon detection. References: API chains in [Compromised
    Cloud Compute Credentials](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)
    and rule patterns in the [Panther Analysis Repository](https://github.com/panther-labs/panther-analysis).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - GuardDuty findings
  - VPC Flow Logs
  - 'NAI: High-value roles reachable through federation or cross-account trust, sensitive services commonly
    touched after role assumption, and network telemetry from workloads managed by assumed-role sessions'
  range: Last 90 days (multi-day recurrence emphasis)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=AWS:CloudTrail userIdentity.type=\"AssumedRole\" sourceIPAddress IN (external)\n  eventName\
      \ IN (\"GetCallerIdentity\",\"List*\",\"Describe*\",\"GetSecretValue\",\"Decrypt\",\"GetParameter\"\
      ,\"ListBucket\",\"iam:Get*\")\n  | stats dc(date) as active_days count by principal, role\n  | where\
      \ active_days>=2\n  | eval severity=if(active_days>=3 AND priv_service_revisit,\"high\",\"medium\"\
      )"
- question: After external role assumption, is there subsequent activity against EC2, Lambda, ECS, EKS,
    SSM, Secrets Manager, or data stores - especially when the trusted role normally performs only narrow
    automation - including new administrative network connections to managed workloads in VPC Flow Logs?
  context: 'A foothold often pivots from the control plane into workloads. Correlate external role assumption
    with follow-on activity against compute/secret/data services in the same session or source pattern,
    weighting heavily when the role normally performs narrow automation. Include VPC Flow Log evidence
    of new administrative connections (SSH/RDP/management ports) to managed workloads after assumption.
    A positive result shows the trust path driving workload access - persistence enabling impact. Maps
    to AN1348 (Persistence) workload-access correlation. Reference: [Elastic Detection Rules - AWS](https://github.com/elastic/detection-rules/tree/main/rules/integrations/aws).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - GuardDuty findings
  - VPC Flow Logs
  - 'NAI: High-value roles reachable through federation or cross-account trust, sensitive services commonly
    touched after role assumption, and network telemetry from workloads managed by assumed-role sessions'
  range: Last 90 days (correlate assumption with follow-on workload access)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=AWS:CloudTrail eventName=\"AssumeRole*\" errorCode=null\n  | join sessionId [search\
      \ source=AWS:CloudTrail eventSource IN (\"ec2\",\"lambda\",\"ecs\",\"eks\",\"ssm\",\"secretsmanager\"\
      ,\"s3\",\"dynamodb\",\"rds\")]\n  | where role_is_narrow_automation(role)\n  | join [search source=VPC:FlowLogs\
      \ action=ACCEPT dstport IN (22,3389,5985) dir=ingress]\n  | table _time role principal eventSource\
      \ targetWorkload srcaddr dstport"
- question: Within an assumed-role session, is the AccessDenied/throttle-to-success ratio elevated (default
    flag >25% denied of total calls, tuned to the role's benign 95th percentile), indicating a foothold
    session probing for permissions?
  context: 'A session that is mapping its own permissions generates a distinctive high failure-to-success
    ratio. Track per-session AccessDenied/throttle ratios after assumption as a distinct signal and flag
    sessions exceeding the tuned threshold. A positive result indicates the principal does not yet know
    the environment and is exploring - consistent with adversary post-compromise behavior rather than
    a scripted delegated task that knows exactly which calls it needs. Tune to each role''s benign 95th
    percentile to suppress noisy-but-legitimate automation. Maps to AN1348 (Persistence) post-assumption
    failure profiling. Reference: [AWS IAM AccessDenied Discovery Events](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - GuardDuty findings
  - VPC Flow Logs
  - 'NAI: High-value roles reachable through federation or cross-account trust, sensitive services commonly
    touched after role assumption, and network telemetry from workloads managed by assumed-role sessions'
  range: Last 90 days (per-session ratio)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=AWS:CloudTrail userIdentity.type=\"AssumedRole\"\n  | stats count as total count(eval(errorCode=\"\
      AccessDenied\" OR errorCode LIKE \"%Throttl%\")) as\ndenied by sessionId, role\n  | eval ratio=denied/total\n\
      \  | eventstats p95(ratio) as base by role | eval thr=max(0.25,base)\n  | where ratio>thr"
- question: Does the current session's post-assumption API mix, request volume (count/min), region fan-out,
    or sensitive-resource touch rate deviate materially above the role's trailing baseline or peer-role
    behavior?
  context: 'Drift in what a role does after assumption signals misuse. Compare the role''s normal post-assumption
    API mix, volume, region fan-out, and sensitive-resource touch rate against the current session using
    novelty baselining and invariant/PCA methods, plus peer-group anomaly comparison. A positive result
    - control-plane and data-plane breadth materially above baseline or peers - indicates the trust path
    is being exercised beyond its intended scope. This complements deterministic rules with statistical
    detection of subtle expansion. Maps to AN1348 (Persistence) post-assumption drift analysis. References:
    novelty baselining ([Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)),
    invariant/PCA methods from [Experience Report: System Log Analysis for Anomaly Detection](https://jiemingzhu.github.io/pub/slhe_issre2016.pdf),
    and peer-group anomalies from the [Microsoft Sentinel Anomalies Reference](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - GuardDuty findings
  - VPC Flow Logs
  - 'NAI: High-value roles reachable through federation or cross-account trust, sensitive services commonly
    touched after role assumption, and network telemetry from workloads managed by assumed-role sessions'
  range: Last 90 days (trailing baseline; per-session drift scoring)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=AWS:CloudTrail userIdentity.type=\"AssumedRole\"\n  | stats dc(eventName) as api_div\
      \ count as vol dc(awsRegion) as regions count(eval(sensitive_resource))\nas sens by sessionId, role\n\
      \  | eventstats avg(api_div) as b_api stdev(api_div) as sd_api avg(vol) as b_vol stdev(vol) as sd_vol\n\
      by role\n  | where api_div>b_api+3*sd_api OR vol>b_vol+3*sd_vol OR regions>baseline_regions"
- question: When scored by re-entry days, median time between visits, count of reused role session-name
    patterns, and concentration on privileged assets, do any external principals exhibit a recurrence
    pattern suggesting persistence rather than incidental partner access?
  context: 'A durable foothold has a measurable recurrence fingerprint. Score each external principal
    across number of re-entry days, median inter-visit time, reused session-name patterns, and privileged-asset
    concentration, forecasting expected per-principal cadence and escalating those whose pattern indicates
    persistence. A high recurrence score distinguishes a maintained adversary foothold from sporadic legitimate
    third-party administration. Use this to prioritize which external principals to deep-dive. Maps to
    AN1348 (Persistence) durable-foothold scoring. Reference: forecast expected per-principal cadence
    per [Cloud Intrusion Detection Using Time Series Forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - GuardDuty findings
  - VPC Flow Logs
  - 'NAI: High-value roles reachable through federation or cross-account trust, sensitive services commonly
    touched after role assumption, and network telemetry from workloads managed by assumed-role sessions'
  range: Last 90 days (per-principal recurrence scoring)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=AWS:CloudTrail eventName=\"AssumeRole*\" sourceIPAddress IN (external)\n  | stats dc(date)\
      \ as reentry_days median(interval) as med_gap dc(sessionNamePattern) as reused_patterns\ncount(eval(privileged_asset))\
      \ as priv_touch by principal\n  | eval recurrence_score=reentry_days*0.4 + reused_patterns*0.3 +\
      \ priv_touch*0.3 - med_gap_norm\n  | where recurrence_score > tuned_threshold | sort - recurrence_score"
- question: Modeling outside identities, trusted roles, accessed resources, and recurring session artifacts
    as a dynamic heterogeneous graph, are there anomalous identity-resource subgraphs where the same external
    identity repeatedly re-enters, explores laterally, and touches high-value services unlike ordinary
    third-party administration?
  context: 'Persistence and lateral expansion are inherently relational, so a graph model captures patterns
    flat rules miss. Build a heterogeneous dynamic graph of external identities, trusted roles, resources,
    and recurring session artifacts; score anomalous identity-resource subgraphs with a GNN/temporal-GNN
    (KAIROS-style) approach. Reconstruct the contributing subgraph and surface the top-3 nodes/edges (external
    identity, role, high-value resource) in alert text. Prioritize clusters where one external identity
    re-enters, explores laterally, and reaches high-value services unlike ordinary administration; retain
    deterministic recon-API and recurrence rules as a floor. Validate on the flaws.cloud dataset. Maps
    to AN1348 (Persistence) graph modeling. References: [GNN-Based Adaptive Threat Detection for Cloud
    IAM Logs](https://arxiv.org/abs/2512.10280) and the temporal-GNN approach of [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)
    ([KAIROS code](https://github.com/ProvenanceAnalytics/kairos)); validate on the [flaws.cloud dataset](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - GuardDuty findings
  - VPC Flow Logs
  - 'NAI: High-value roles reachable through federation or cross-account trust, sensitive services commonly
    touched after role assumption, and network telemetry from workloads managed by assumed-role sessions'
  range: Last 90 days (graph built over rolling window; periodic scoring)
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph=build_hetero_dynamic_graph(nodes=[external_identity, role, resource, session_artifact],\n\
      \    edges=[assumes, accesses, reuses])\n  | model=temporal_gnn(graph) ; score subgraphs by anomaly\n\
      \  | where subgraph_score>threshold AND same_identity_reentry AND lateral_exploration\n  | reconstruct\
      \ top3_nodes_edges ; floor_rules=[recon_api, recurrence]\n  | validate on flaws_cloud"
