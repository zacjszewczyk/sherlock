name: 'T1562.A001: Disable or Modify GuardDuty'
id: 72e6aac7-5362-4310-be50-e1c3c253e4fc
description: Investigate whether an adversary has weakened or disabled Amazon GuardDuty to create a monitoring
  blind spot that conceals malicious AWS control-plane activity. This playbook helps an analyst determine
  if GuardDuty detectors, organization settings, member relationships, or protection features were deleted,
  disabled, detached, downgraded, or quietly suppressed (for example via trusted-IP lists) shortly before
  or during suspicious IAM, networking, credential, compute, or data-access activity. It covers both broad
  coverage reduction and selective, region- or account-targeted suppression that aligns with subsequent
  reconnaissance, persistence, privilege escalation, or sensitive data access. Questions combine symbolic-logic
  correlation of CloudTrail GuardDuty events, out-of-band verification via AWS Config and Security Hub,
  statistical baselining of administrative actions and coverage gaps, and machine-learning models that
  rank sequences most consistent with deliberate defense evasion.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a non-security principal successfully execute a GuardDuty coverage-reducing API call (such
    as DeleteDetector, UpdateDetector with enable=false or data sources/features disabled, StopMonitoringMembers,
    DisassociateMembers, DeleteMembers, or UpdateMemberDetectors) without an error?
  context: 'This question targets the most direct form of GuardDuty tampering: an identity that is not
    an approved security-administration principal disabling detection. Under Defense Evasion (TA0005)
    the adversary wants to silence GuardDuty before continuing intrusion activity. Look at CloudTrail
    events with eventSource guardduty.amazonaws.com that are successful (errorCode absent) and state-changing,
    and confirm the caller ARN/type is outside your sanctioned security-admin role set. Triage the actor
    ARN, request parameters, region, source IP, user agent, and geolocation. A positive result is a state-changing
    GuardDuty call by an unexpected principal, especially within ~60 minutes of suspicious IAM, networking,
    credential, or compute actions in the same account/region; a negative result is the change being attributable
    to an approved maintenance workflow.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SIEM | filter eventSource=='guardduty.amazonaws.com'\n  AND eventName IN [DeleteDetector,UpdateDetector,StopMonitoringMembers,DisassociateMembers,DeleteMembers,UpdateMemberDetectors]\n\
      \  AND ISNULL(errorCode)\n  AND userIdentity.arn NOT IN approved_security_admin_roles\n  AND (eventName=='UpdateDetector'\
      \ IMPLIES requestParameters CONTAINS enable=false OR features/dataSources disabled)\n| enrich actor_arn,\
      \ actor_type, requestParameters, awsRegion, sourceIPAddress, userAgent, geo\n| set severity=high\
      \ IF any suspicious IAM/network/credential/compute event in same account+region within 60m"
- question: Was GuardDuty organization-wide coverage deliberately reduced through DisableOrganizationAdminAccount,
    delegated-administrator changes, member detachment (DisassociateMembers/DeleteMembers/DisassociateFromMasterAccount),
    auto-enable downgrades, or selective feature disablement?
  context: Organization-level controls let an adversary remove visibility across many accounts at once
    or quietly stop new accounts from being protected. Tying these control changes to the resulting loss
    of S3, EKS, EC2, runtime, or malware-protection coverage exposes a single defense-evasion workflow
    rather than isolated admin events. Present the control change and the specific protections it removed
    together. A positive result is an org-level coverage reduction not matched to an approved change record;
    this is high severity because it can blind whole account cohorts ahead of broader intrusion activity.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SIEM | filter eventSource=='guardduty.amazonaws.com'\n  AND eventName IN [DisableOrganizationAdminAccount,UpdateOrganizationConfiguration,DisassociateMembers,DeleteMembers,DisassociateFromMasterAccount,UpdateMemberDetectors]\n\
      \  AND ISNULL(errorCode)\n| derive lost_protections = diff(detector features before, after)\n| correlate\
      \ control_change WITH lost_protections AS one_workflow\n| alert IF NOT matches_approved_change_record"
- question: Were attacker-controlled CIDRs added to a GuardDuty detector's trusted-IP list (CreateIPSet/UpdateIPSet)
    or threat-intel entries removed (CreateThreatIntelSet changes) to silently suppress findings without
    disabling the detector?
  context: 'Trusted-IP list manipulation is a stealthy alternative to disabling GuardDuty: the detector
    stays enabled and compliant while findings from the listed ranges are suppressed. This matches Defense
    Evasion''s goal of blending in with intact defensive systems. Compare the source Location URL and
    added CIDRs against approved change records, and treat non-RFC1918 additions as high severity. A positive
    result is a trusted-IP addition not seen in change management, particularly public CIDRs that correspond
    to attacker infrastructure; a negative result is an addition matching a documented allow-listing request.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SIEM | filter eventSource=='guardduty.amazonaws.com'\n  AND eventName IN [CreateIPSet,UpdateIPSet,CreateThreatIntelSet,UpdateThreatIntelSet]\n\
      \  AND ISNULL(errorCode)\n| extract added_cidrs, location_url\n| alert IF added_cidrs NOT IN approved_change_records\n\
      | set severity=high IF any added_cidr is non-RFC1918/public"
- question: Independently of CloudTrail event capture, does AWS Config and Security Hub show any account/region
    transitioning from GuardDuty-enabled (PASS) to disabled or NON_COMPLIANT?
  context: Out-of-band verification catches tampering even when the disabling API call was never delivered
    to your log pipeline (for example if logging was also impaired). Using configuration-state controls
    such as guardduty-enabled-centralized, assert GuardDuty is enabled per account and region and alert
    on any PASS-to-NON_COMPLIANT/disabled transition. This is critical against a sophisticated actor who
    may try to break both GuardDuty and the audit trail. A positive result is a compliance regression
    for GuardDuty enablement; it should be reconciled against any observed CloudTrail event and escalated
    if none exists.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days
  queries:
  - technology: AWS Config/Security Hub pseudocode
    query: 'CONFIG/SECURITYHUB | evaluate control guardduty-enabled-centralized PER account,region

      | compare current_state TO previous_state

      | alert IF transition PASS -> (NON_COMPLIANT OR disabled)

      | reconcile WITH CloudTrail guardduty events; escalate IF no matching event found'
- question: Is this the first time a given identity, role, or region performed a sensitive GuardDuty administrative
    action, and does the daily count of coverage-reducing calls exceed the expected baseline for the account
    cohort?
  context: Rarity-based statistics separate routine, scheduled GuardDuty maintenance from anomalous tampering.
    Baseline administrative actions by actor, role, region, feature set, and maintenance window, then
    use per-principal first-seen detection to flag the first-ever DeleteDetector, CreateIPSet, or DisableOrganizationAdminAccount
    by an identity, and robust modified Z-score / MAD scoring (flag |z|>3.5) on the daily count of coverage-reducing
    calls per cohort. This keeps batch maintenance from distorting the threshold while surfacing novel,
    low-frequency activity. A positive result is a first-ever sensitive action or a statistical outlier
    in coverage-reducing volume.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SIEM | from guardduty_admin_events

      | baseline per actor,role,region,feature,maintenance_window

      | firstseen(actor, action) FOR action IN [DeleteDetector,CreateIPSet,DisableOrganizationAdminAccount]
      -> flag

      | stats daily_count = count(coverage_reducing_calls) BY account_cohort,day

      | modified_zscore(daily_count) -> flag IF abs(z) > 3.5'
- question: How long did the reduced GuardDuty coverage persist, across how many regions and accounts,
    and did that blind spot outlast normal maintenance windows or overlap bursts of privileged activity,
    discovery, or data access?
  context: The value of a blind spot to an adversary is its duration and overlap with their operations.
    Measure the duration, regional spread, and account concentration of reduced coverage, and forecast
    expected detector uptime and admin-action rates with time-series models and confidence bands. Prioritize
    gaps that persist longer than normal maintenance or coincide with privileged activity. Under Defense
    Evasion this reveals whether the coverage loss was opportunistic noise or a sustained, exploited gap.
    A positive result is a long-lived or activity-aligned blind spot exceeding the forecast band.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days; correlate against the full duration of any detected coverage gap
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SIEM | identify coverage_gap intervals WHERE detector disabled/feature off

      | compute gap_duration, distinct_regions, distinct_accounts

      | forecast expected_uptime, expected_admin_rate WITH timeseries + confidence_band

      | prioritize gaps WHERE duration > normal_maintenance OR overlaps burst(privileged_activity|discovery|data_access)'
- question: Did a principal generate a burst of AccessDenied / UnauthorizedOperation responses on guardduty:*
    actions, indicating enumeration or permission-probing before successful tampering?
  context: Adversaries often probe what GuardDuty actions they can perform before disabling it, producing
    a cluster of denied calls. Explicitly profiling the failure state — baselining AccessDenied/UnauthorizedOperation
    on guardduty:* per principal and alerting on bursts (e.g., >5 distinct denied GuardDuty actions in
    10 minutes, or |modified Z|>3.5 over the per-actor baseline) — gives an early warning that precedes
    successful coverage reduction. A positive result is an unusual denied-action burst, especially when
    followed by a successful state-changing GuardDuty call by the same principal.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SIEM | filter eventSource==''guardduty.amazonaws.com'' AND errorCode IN [AccessDenied,UnauthorizedOperation]

      | baseline denied_guardduty_actions PER principal

      | stats distinct_denied = dcount(eventName) BY principal, window=10m

      | alert IF distinct_denied > 5 OR modified_zscore(denied_rate) > 3.5

      | raise confidence IF same principal later has successful coverage-reducing call'
- question: When an unsupervised model scores GuardDuty and adjacent control-plane sequences, which events
    rank highest as deliberate security-control suppression, and what are the top-3 contributing features?
  context: A machine-learning population/rare-function model over CloudTrail GuardDuty and adjacent control-plane
    activity captures combinations no single rule covers. Use features such as actor novelty, change timing,
    regional spread, feature-loss depth, concurrent suspicious APIs, and prior detector state, complemented
    by graph context scoring anomalous actor-role-resource paths to the GuardDuty service. Rank sequences
    where GuardDuty modifications appear intended to suppress detection. Every alert MUST surface the
    top-3 contributing features (e.g., 'first-time actor for DeleteDetector', 'region novel for principal',
    'co-occurring AssumeRole burst') so analysts can triage. A high-ranked sequence with suppression-consistent
    features is a positive result warranting investigation.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS Security Hub findings
  - 'NAI: GuardDuty administrator and member accounts, regional GuardDuty detectors, organization-level
    security administration workflows, and accounts exhibiting concurrent suspicious IAM or resource activity'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ML | dataset = cloudtrail_guardduty + adjacent_controlplane sequences

      | features = [actor_novelty, change_timing, regional_spread, feature_loss_depth, concurrent_suspicious_apis,
      prior_detector_state]

      | model = unsupervised population/rare-function + GNN actor-role-resource path score

      | rank sequences BY suppression_likelihood

      | OUTPUT score, top3_contributing_features  // MUST include top-3 features'
- question: After GuardDuty was suspended, deleted, or had features disabled (DeleteDetector/UpdateDetector/StopMonitoringMembers)
    in a specific region or member account, did follow-on adversary activity occur in that same scope?
  context: 'This correlation links a coverage change to its exploitation. Within the affected region/account,
    look for follow-on role assumption, IAM changes, security-group modification, instance access, secret
    retrieval, or bulk S3 actions occurring after the GuardDuty change. Raise severity when the affected
    scope was previously protected and the change lacks an approved maintenance record. For Defense Evasion
    this is the strongest narrative: the adversary created a blind spot and then operated inside it. A
    positive result is suspicious scoped activity following a scoped coverage reduction.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - EventBridge event history
  - 'NAI: Regions with limited prior activity, member accounts managed through AWS Organizations, and
    cloud environments where detector state changes can create temporary or persistent blind spots'
  range: Last 90 days; pivot to a tight window immediately following each detector change
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SIEM | let gap = events WHERE eventName IN [DeleteDetector,UpdateDetector(disable),StopMonitoringMembers]\
      \ BY region,account\n| join follow_on = events WHERE eventName IN [AssumeRole,IAM changes,AuthorizeSecurityGroupIngress,GetSecretValue,GetObject(bulk)]\n\
      \    ON same region+account AND follow_on.time > gap.time\n| alert; severity=high IF scope previously_protected\
      \ AND NOT approved_maintenance"
- question: Is GuardDuty still enabled broadly while being reduced only in the specific regions or accounts
    that subsequently show suspicious API activity?
  context: Selective suppression — leaving GuardDuty on environment-wide but disabling it only where the
    adversary operates — avoids the obvious signal of a full outage. Detect this via per-region AWS Config/Security
    Hub enablement-state transitions combined with per-region CloudWatch metric filters on coverage-reducing
    events. The tell is a localized coverage drop in an otherwise healthy estate that aligns with later
    suspicious activity in that same scope. A positive result is a single-region or single-account enablement
    regression that maps onto subsequent anomalous API use.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - EventBridge event history
  - 'NAI: Regions with limited prior activity, member accounts managed through AWS Organizations, and
    cloud environments where detector state changes can create temporary or persistent blind spots'
  range: Last 90 days
  queries:
  - technology: AWS Config/Security Hub pseudocode
    query: 'CONFIG/SECURITYHUB | evaluate guardduty_enabled PER region,account

      | detect localized_drop = region/account NON_COMPLIANT WHILE estate mostly PASS

      | join per-region CloudWatch metric_filter(coverage_reducing_events)

      | alert IF localized_drop scope LATER shows suspicious_api_activity'
- question: What is the duration, timing, and regional concentration of GuardDuty coverage gaps, and do
    any regions or member accounts show downtime or feature-disablement frequency that materially exceeds
    baseline?
  context: Quantifying gaps per region and account reveals targeted suppression. Apply per-region/per-account
    CloudWatch band anomaly detection and robust modified Z-score thresholds to detector downtime, feature-disablement
    frequency (count/day), and detachment patterns. Flag scopes whose gaps exceed baseline or cluster
    around other anomalous activity bursts. This supports Defense Evasion analysis by distinguishing routine
    variance from deliberately engineered blind spots in chosen scopes. A positive result is a region/account
    whose coverage-gap metrics are statistical outliers.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - EventBridge event history
  - 'NAI: Regions with limited prior activity, member accounts managed through AWS Organizations, and
    cloud environments where detector state changes can create temporary or persistent blind spots'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SIEM | from coverage_gaps BY region,account

      | metrics = [downtime, feature_disable_freq_per_day, detachment_pattern]

      | cloudwatch_band_anomaly(metrics) + modified_zscore(metrics) -> flag IF outlier

      | boost IF gap clusters near other anomalous_activity_bursts'
- question: During a GuardDuty coverage gap, did the volume of privileged or sensitive activity in that
    scope rise above what is normal for fully instrumented periods?
  context: Comparing activity density inside the blind spot to the same scope's historical norm tests
    whether the gap was exploited. Measure calls/min, distinct mutating APIs, and bytes/objects accessed
    during the gap against time-series forecasts with confidence bounds. Escalate when suspicious activity
    density rises during the blind spot; short, intense bursts are characteristic of automated intrusions
    that can reach admin access within minutes. A positive result is elevated privileged/sensitive activity
    concentrated within the period GuardDuty was impaired.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - EventBridge event history
  - 'NAI: Regions with limited prior activity, member accounts managed through AWS Organizations, and
    cloud environments where detector state changes can create temporary or persistent blind spots'
  range: Last 90 days; align measurement windows to each detected coverage gap
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SIEM | for each coverage_gap(scope,interval)

      | measure activity = [calls_per_min, dcount(mutating_apis), bytes_objects_accessed] WITHIN interval

      | forecast baseline_activity FROM instrumented_periods WITH confidence_bounds

      | escalate IF activity > upper_bound  // short intense bursts = automated intrusion'
- question: Within an affected region or account, is there a failed-then-succeeded pattern where a burst
    of AccessDenied on guardduty:* is immediately followed by a successful coverage-reducing call by the
    same principal?
  context: Scoping the failure-then-success pattern to the specific region/account where the adversary
    later operates makes it a high-confidence signal of targeted tampering. Baseline this pattern per
    principal using robust MAD scoring, then alert when denied GuardDuty probing precedes a successful
    state-changing call in the same scope. This is a sharper, location-aware version of generic permission-probing
    detection and ties directly to where Defense Evasion is being attempted. A positive result is the
    denied-then-successful sequence localized to a scope of interest.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - EventBridge event history
  - 'NAI: Regions with limited prior activity, member accounts managed through AWS Organizations, and
    cloud environments where detector state changes can create temporary or persistent blind spots'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'SIEM | scope = affected region,account

      | seq = AccessDenied(guardduty:*) burst THEN successful coverage-reducing call BY same principal

      | baseline seq PER principal WITH MAD scoring

      | alert IF seq present AND modified_zscore > 3.5'
- question: When temporal/sequence and graph models score GuardDuty state transitions and the control-plane
    behavior that follows, which combinations match historical defense-evasion patterns, and what are
    the top-3 contributing features?
  context: Sequence-aware modeling predicts blind-spot exploitation by learning which GuardDuty state
    transitions plus subsequent behavior historically indicate evasion. Use multi-order Markov sequence
    plausibility and graph-based user-service-activity embeddings, emphasizing features such as region
    novelty, detector uptime history, co-occurring IAM actions, and post-change service-access breadth.
    Surface the top-3 contributing features in every alert so analysts can validate quickly. A positive
    result is a transition-plus-activity combination the model flags as consistent with prior defense-evasion
    episodes.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - EventBridge event history
  - 'NAI: Regions with limited prior activity, member accounts managed through AWS Organizations, and
    cloud environments where detector state changes can create temporary or persistent blind spots'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ML | model = multi-order Markov(guardduty_state_transitions) + graph user-service-activity
      embeddings (CS-GAD)

      | features = [region_novelty, detector_uptime_history, cooccurring_iam_actions, post_change_service_access_breadth]

      | score transition+followon AGAINST historical defense_evasion patterns

      | OUTPUT score, top3_contributing_features'
