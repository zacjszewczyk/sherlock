name: 'T1648.A002: Malicious code from Compromised Third Party Packages'
id: cc28d372-f4d4-432c-b20c-d650c81c1cf4
description: Investigate whether an adversary has achieved execution in AWS by introducing or abusing
  a compromised third-party package within a Lambda deployment package, layer, or serverless build path.
  This playbook helps an analyst determine if a function, layer, or CI/CD pipeline pulled in a new or
  changed dependency that is inconsistent with the application's approved package set, and whether the
  resulting function execution began contacting unexpected destinations, retrieving runtime credentials,
  accessing new AWS services, or performing actions outside the function's established IAM role. It correlates
  deployment and layer-update events (CloudTrail UpdateFunctionCode, PublishLayerVersion, UpdateFunctionConfiguration)
  and build-pipeline activity (CodeBuild, CodePipeline, CodeArtifact) with post-release runtime telemetry
  from CloudWatch Logs, VPC Flow Logs, X-Ray, and GuardDuty findings. Methods span symbolic-logic detections
  (dependency-linked behavior change, malicious-package content signatures, first-seen deployment principals,
  post-update runtime indicators), statistical baselining (package/runtime drift, post-deployment failure-rate
  and credential-probe profiling, release-to-runtime anomaly thresholding, beacon periodicity), and machine-learning
  models (release-lineage clustering, supply-chain execution anomaly and malicious-package behavior modeling)
  to give the SOC granular, defensible coverage of serverless supply-chain compromise.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Was a Lambda function or layer updated (CloudTrail UpdateFunctionCode, PublishLayerVersion,
    or UpdateFunctionConfiguration) from a new code source, an unusual pipeline principal, or an unapproved
    repository context, and did subsequent invocations begin making new outbound connections, retrieving
    runtime credentials, or accessing AWS services not previously associated with that function?
  context: 'In the Execution tactic, a compromised third-party package becomes dangerous the moment the
    function runs adversary-controlled code. Tie the deployment event to what the function does next:
    alert when an update originates from a new code source, unusual pipeline principal, or unapproved
    repository AND the first invocation window shows new outbound destinations, runtime credential/metadata
    retrieval, or access to services outside the function''s history. Treat a deployment package or layer
    lacking valid signed build provenance (in-toto / SLSA), or not produced by the sanctioned build step,
    as a hard policy violation. Raise severity to critical when the change is followed within the first
    invocation window by secrets access (GetSecretValue, GetParameter with WithDecryption), STS role assumption,
    or S3 reads exceeding the function''s 30-day p95 object count. Validate detonation logic with Stratus
    Red Team. A positive result indicates a deployment whose behavior diverged immediately after a dependency
    change; a negative result reflects routine releases that behave consistently.'
  answer_sources: &id001
  - CloudTrail management events
  - CloudWatch Logs
  - CodeBuild logs
  - CodePipeline logs
  - VPC Flow Logs
  - AWS CodeArtifact repository events
  - 'NAI: Serverless CI/CD pipelines, Lambda deployment and layer update events, CloudWatch log groups
    for production functions, and network telemetry for VPC-enabled functions'
  range: Last 90 days (correlate the deployment event with the first 1-24h invocation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=cloudtrail eventName in (\"UpdateFunctionCode\",\"PublishLayerVersion\",\"UpdateFunctionConfiguration\"\
      )\n| where new_code_source OR principal NOT IN approved_deploy_principals OR repo NOT IN approved_repos\
      \ OR NOT has_signed_provenance\n| join function_arn [ search source=cloudtrail OR source=vpcflow\
      \ earliest=deploy_time latest=deploy_time+24h\n    | where new_outbound_dest OR eventName in (\"\
      GetSecretValue\",\"AssumeRole\") OR (eventName=\"GetParameter\" AND withDecryption=true) OR new_service_access\
      \ OR s3_object_reads>p95_30d ]\n| eval severity=if(secrets_access OR sts_assume OR s3_burst,\"critical\"\
      ,\"high\")\n| alert"
- question: Do any newly added or changed dependencies and deployment packages contain the high-risk API
    or keyword signatures empirically associated with supply-chain malware (eval/exec, __import__, base64.b64decode,
    marshal.loads, os.system, subprocess, socket, requests.get/urllib) or code that executes at install/import
    time via setup.py or postinstall hooks?
  context: Malicious packages frequently combine remote-fetch, decode, and execute primitives, or run
    code at install/import time to gain execution before the function's normal logic runs. Scan the diff
    of newly added/changed dependencies and the built deployment package for these deterministic signatures,
    per the PyPI empirical study and Backstabber's Knife Collection. Flag any package whose content combines
    remote-fetch + decode + execute primitives, or that triggers code at install/import time (setup.py,
    postinstall). These signatures are the deterministic floor and must remain even when ML scoring is
    layered on top. A positive result means the package contains code patterns characteristic of supply-chain
    malware and warrants quarantine and source review; a negative result lowers but does not eliminate
    suspicion, since obfuscation can hide intent.
  answer_sources: *id001
  range: Last 90 days (scan at build/deploy time; re-scan on each dependency change)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=codebuild OR source=codeartifact event=dependency_added OR event=dependency_changed

      | scan package_content for regex "eval\(|exec\(|__import__|base64\.b64decode|marshal\.loads|os\.system|subprocess|socket|requests\.get|urllib"

      | eval install_time_exec=match(file,"setup\.py") OR match(hook,"postinstall")

      | eval fetch_decode_exec=has_remote_fetch AND has_decode AND has_exec

      | where fetch_decode_exec OR install_time_exec

      | alert severity=high'
- question: Is this the first time a given principal has deployed code to this function or published this
    layer (a first-seen principal->function or principal->PublishLayerVersion pairing) relative to an
    allowlist of authorized deploy principals and expected source repositories/pipelines?
  context: Supply-chain execution often begins with an unexpected identity pushing code. Maintain an allowlist
    of principals authorized to deploy each function/layer plus the expected source repository/pipeline,
    then alert on first-seen principal->function or principal->PublishLayerVersion pairs using first-seen
    logic (Splunk 'Cloud API Calls From Previously Unseen User Roles', Netflix CloudTrail Anomaly Detector).
    In the Execution tactic this catches an attacker who has obtained deployment credentials or hijacked
    a pipeline to inject a compromised package. A positive result identifies a novel deployment identity
    that should be confirmed against change-management records; a negative result confirms the deployment
    came from an established, expected principal.
  answer_sources: *id001
  range: Last 90 days (baseline of known principal->function pairs over 90 days)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventName in ("UpdateFunctionCode","PublishLayerVersion","UpdateFunctionConfiguration")

      | eval pair=userIdentity.arn."->".functionName

      | lookup known_deploy_pairs pair OUTPUT seen

      | where isnull(seen) OR userIdentity.arn NOT IN allowlist[functionName] OR sourceRepo NOT IN expected_repos[functionName]

      | alert severity=medium'
- question: Does a deployment's dependency-change frequency, transitive dependency-graph fan-out, maintainer
    reach, deployment source novelty, layer reuse, outbound destination set, deployment cadence, or post-deployment
    API behavior exceed the historical norm for that application or the 95th percentile for comparable
    serverless workloads?
  context: Abnormal expansion of the transitive dependency set, or a new maintainer/source, is a supply-chain
    precondition (Small World with High Risks). Baseline per-function normal dependency-change frequency,
    dependency-graph fan-out and maintainer reach, deployment sources, layer reuse, outbound destination
    sets, deployment cadence, and post-deployment API behavior over 30-90 days of CloudTrail/build history.
    Flag deployments whose dependency churn, deployment-path novelty, or runtime behavior shift exceeds
    historical norms for that application or the 95th percentile for comparable workloads; use CloudWatch
    anomaly-detection bands for deployment cadence. A positive result signals an unusually large or novel
    dependency/runtime change consistent with package compromise; a negative result reflects normal incremental
    maintenance.
  answer_sources: *id001
  range: Last 90 days (baseline 30-90 days per environment)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail OR source=codebuild earliest=-90d

      | stats avg(dep_change_count) as mu_churn p95(dep_change_count) as p95_churn dc(dep_transitive)
      as fanout dc(maintainer) as maintainers dc(outbound_dest) as dest_set by functionName

      | eventstats p95(dep_change_count) as peer_p95

      | where dep_change_count_current > p95_churn OR fanout_current > fanout*1.5 OR new_maintainer OR
      new_source OR dep_change_count_current > peer_p95

      | alert'
- question: After a deployment, did a function's IAM role generate a burst of AccessDenied / Client.UnauthorizedOperation
    errors (more than its 7-day baseline mean + 3 sigma, or more than 5 distinct denied actions in 5 minutes)
    consistent with a compromised dependency enumerating the role's reachable services before a successful
    access?
  context: A compromised dependency commonly probes the function's IAM role to discover what it can reach,
    producing a cluster of denied calls before it lands a successful action. Profile CloudTrail errorCode=AccessDenied
    / Client.UnauthorizedOperation per function role over a sliding window. Alert when denied calls for
    a role exceed its 7-day baseline mean + 3 sigma, or when more than 5 distinct denied actions occur
    in 5 minutes following a deployment (AWS IAM AccessDenied Discovery Events). In the Execution tactic
    this denied-call burst is the observable footprint of injected code mapping its environment. A positive
    result indicates post-deployment permission probing; a negative result indicates the function operated
    within its expected permission envelope.
  answer_sources: *id001
  range: Last 90 days (baseline 7 days; evaluate 5-minute sliding windows after each deployment)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail (errorCode="AccessDenied" OR errorCode="Client.UnauthorizedOperation")

      | bin _time span=5m

      | stats count as denied dc(eventName) as distinct_denied by userIdentity.sessionContext.role, _time

      | eventstats avg(denied) as mu stdev(denied) as sd by role (over -7d)

      | where (denied > mu + 3*sd OR distinct_denied > 5) AND recent_deploy(role)

      | alert'
- question: When deployments are clustered by repository context, pipeline principal, dependency-change
    volume, layer hashes, and post-release runtime behavior, do any releases fall into anomalous clusters
    that isolate unusual software-delivery paths correlated with suspicious execution drift?
  context: Unsupervised clustering of releases can surface software-delivery paths that look unlike normal
    pipeline activity and that coincide with abnormal runtime behavior. Cluster deployments by repository
    context, pipeline principal, dependency-change volume, layer hashes, and post-release runtime behavior
    to isolate outlier delivery paths. Surface the top-3 contributing features (e.g., source novelty,
    dependency-churn volume, new layer hash) in each alert for explainability. In the Execution tactic
    this helps distinguish a malicious injection path from the dozens of legitimate routine releases.
    A positive result flags a release whose delivery characteristics and downstream behavior diverge from
    the population and merits manual provenance review; a negative result places the release within an
    established benign cluster.
  answer_sources: *id001
  range: Last 90 days (train on 30-90 days of release history)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'input = deployments[repo_context, pipeline_principal, dep_change_volume, layer_hash, post_release_behavior]

      model = cluster(input, algo=DBSCAN_or_HDBSCAN)

      flag releases in low-density/outlier clusters

      emit top_3_contributing_features(release)

      | alert'
- question: Does a supervised/anomaly model linking deployment metadata (repository novelty, pipeline
    identity, dependency-change volume, new layer hashes) with post-release runtime telemetry (outbound
    destination novelty and byte volume, newly accessed AWS services, post-deploy denied-call rate) classify
    a given execution as likely caused by malicious package insertion rather than benign release activity?
  context: A model that fuses release metadata with runtime outcomes can separate executions caused by
    malicious package insertion from normal release churn. Train on features such as repository novelty,
    pipeline identity, dependency-change volume (byte/file counts), new layer hashes, outbound destination
    novelty and byte volume, newly accessed AWS services, and post-deploy denied-call rate, applying rare-function/population
    analysis (Elastic CloudTrail ML) and MalwareHunter-style behavioral classification of dependency content
    (PyPI study). Emit the top-3 contributing features in alert text for explainability. In the Execution
    tactic this is the integrative model that ties a suspect deployment to its anomalous execution. A
    positive result indicates an execution statistically consistent with package compromise; a negative
    result indicates behavior consistent with benign releases.
  answer_sources: *id001
  range: Last 90 days (train on 30-90 days; score each release)
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [repo_novelty, pipeline_identity, dep_change_bytes, dep_change_files, new_layer_hash,\n\
      \            outbound_dest_novelty, egress_bytes, new_service_access, post_deploy_denied_rate]\n\
      score = supply_chain_model.predict(features)\n| where score > threshold\n| emit top_3_contributing_features\n\
      | alert severity=high"
- question: After a package or layer update, did a function during execution enumerate environment variables,
    request the runtime credentials/metadata endpoint, create unexpected external sessions, or trigger
    GuardDuty findings tied to credential misuse or suspicious network destinations (for example Backdoor:Lambda/C&CActivity.B
    or CryptoCurrency:Lambda/BitcoinTool.B)?
  context: Malicious dependency code typically reveals itself at runtime by harvesting environment variables
    and credentials or opening command-and-control channels. Detect newly updated functions that, during
    execution, enumerate environment variables, request the runtime credentials/metadata endpoint, create
    unexpected external sessions, or trigger GuardDuty Lambda Protection findings tied to credential misuse
    or suspicious destinations. Correlate the behavior to the most recent package or layer update event,
    and cross-reference observed payload behavior against malicious-package signatures (remote-fetch +
    decode + execute) from Backstabber's Knife Collection and the PyPI study. A positive result strongly
    indicates a compromised dependency executing in production; a negative result indicates the post-update
    runtime is free of these credential/C2 indicators.
  answer_sources: &id002
  - CloudWatch Logs
  - VPC Flow Logs
  - CloudTrail management events
  - Amazon GuardDuty findings
  - AWS X-Ray
  - 'NAI: Production Lambda functions with recent dependency or layer changes, execution logs for sensitive
    workloads, and GuardDuty findings related to anomalous credential or network use'
  range: Last 90 days (correlate findings to the most recent deployment event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=cloudwatch_logs OR source=guardduty\n| where env_var_enumeration OR metadata_endpoint_request\
      \ OR unexpected_external_session\n   OR finding_type in (\"Backdoor:Lambda/C&CActivity.B\",\"CryptoCurrency:Lambda/BitcoinTool.B\"\
      ,\"UnauthorizedAccess:Lambda/*\")\n| join function_arn [ search source=cloudtrail eventName in (\"\
      UpdateFunctionCode\",\"PublishLayerVersion\") earliest=-7d ]\n| eval malpkg_match=fetch_decode_exec_signature\n\
      | alert severity=critical"
- question: Does a post-deployment execution window deviate sharply from pre-update baselines for error
    classes, log-message entropy, outbound connection counts and byte volume, external domain diversity,
    X-Ray call-graph shape, or sensitive API usage (for example outbound destination count, egress bytes,
    or invocation error rate exceeding the prior version's p95 by more than 50%)?
  context: A malicious package often changes a function's runtime profile abruptly relative to its last
    known-good version. Compare each post-deployment execution window against pre-update baselines for
    error classes, log-message entropy, outbound connection counts and byte volume, external domain diversity,
    X-Ray call-graph shape, and sensitive API usage. Flag releases where the runtime profile shifts abruptly
    versus the last known-good version or peer deployments; alert when outbound destination count, egress
    bytes, or invocation error rate exceeds the prior version's p95 by more than 50%. Baseline volumes
    with CloudWatch anomaly detection and treat new service/destination access via first-seen logic (Netflix
    CloudTrail Anomaly Detector). A positive result indicates a release-induced behavioral shift consistent
    with injected code; a negative result indicates the new version behaves like its predecessor.
  answer_sources: *id002
  range: Last 90 days (baseline = last known-good version; compare per release window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudwatch_logs OR source=vpcflow OR source=xray

      | stats dc(outbound_dest) as dest_count sum(egress_bytes) as egress count(eval(error)) as errors
      entropy(log_msg) as log_entropy dc(external_domain) as domain_div by functionVersion

      | eventstats p95(dest_count) as prev_p95_dest p95(egress) as prev_p95_egress p95(errors) as prev_p95_err
      by functionName (prior version)

      | where dest_count > prev_p95_dest*1.5 OR egress > prev_p95_egress*1.5 OR errors > prev_p95_err*1.5
      OR new_service_or_dest

      | alert'
- question: After a deployment, do VPC Flow Logs show outbound sessions with beacon-like timing (low coefficient
    of variation of inter-connection intervals to a single destination), uniform payload sizes, regular
    retry spacing, or destination reuse that was not present in previous versions of the function?
  context: Command-and-control introduced by a compromised dependency frequently manifests as periodic
    beaconing. Measure outbound session periodicity (autocorrelation/FFT), retry spacing, payload-size
    uniformity, and destination reuse in VPC Flow Logs after each deployment, applying the periodicity
    + destination-reuse filtering of BAYWATCH. Escalate functions whose new release introduces beacon-like
    timing (low coefficient of variation of inter-connection intervals to a single destination) or staged
    data-transfer patterns absent from prior versions. In the Execution tactic, regular beaconing from
    a freshly updated serverless function is a strong indicator that injected code is calling home. A
    positive result indicates probable C2 beaconing tied to the release; a negative result indicates outbound
    traffic lacks periodic structure.
  answer_sources: *id002
  range: Last 90 days (analyze per-deployment outbound sessions)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=vpcflow

      | stats list(_time) as ts list(bytes) as sizes by function, dest_ip

      | eval intervals=delta(ts), cv=stdev(intervals)/avg(intervals), size_cv=stdev(sizes)/avg(sizes)

      | eval periodicity=fft_peak(intervals)

      | where (cv < 0.2 OR periodicity > threshold) AND size_cv < 0.2 AND NOT seen_in_prior_version(function,dest_ip)

      | alert severity=high'
- question: After a package update, did a function exhibit a spike of denied or failed signals (post-update
    AccessDenied API errors, 4xx/5xx responses to new external endpoints, NXDOMAIN/blocked egress attempts,
    or failed metadata calls) exceeding 3 sigma over its pre-update baseline, indicating a dependency
    probing its environment?
  context: Denied and failed signals are distinct evidence of a dependency probing its surroundings. Count
    post-update AccessDenied API errors, 4xx/5xx responses to new external endpoints, NXDOMAIN/blocked
    egress attempts, and failed metadata calls per function. A spike of denied or failed attempts after
    a release indicates a dependency probing its environment; alert on more than 3 sigma over the function's
    pre-update baseline (AWS IAM AccessDenied Discovery Events). In the Execution tactic these failures
    reveal injected code testing what credentials, endpoints, and services it can reach before succeeding.
    A positive result indicates probing behavior post-release; a negative result indicates no abnormal
    failure clustering after the update.
  answer_sources: *id002
  range: Last 90 days (baseline = pre-update window per function)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudwatch_logs OR source=cloudtrail OR source=vpcflow

      | stats count(eval(errorCode="AccessDenied")) as denied count(eval(http_status>=400)) as http_err
      count(eval(dns="NXDOMAIN")) as nxdomain count(eval(metadata_call_failed)) as meta_fail by functionName,
      version

      | eventstats avg(total_fail) as mu stdev(total_fail) as sd by functionName (pre-update)

      | where total_fail > mu + 3*sd

      | alert'
- question: Using unsupervised modeling over function logs and network telemetry, do any functions show
    embeddings that shift sharply immediately after a package update, with new behavior including beacon-like
    periodicity, hidden retry loops, or unusual combinations of secrets access and external communication?
  context: Latent malicious behavior introduced by a package update may not match any fixed signature
    but will appear as an abrupt change in a function's behavioral embedding. Use unsupervised modeling
    over function logs and network telemetry to detect behavior introduced immediately after package updates;
    prioritize functions whose embeddings shift sharply after release and whose new behavior includes
    beacon-like periodicity, hidden retry loops, or unusual combinations of secrets access and external
    communication. Detect evasive high-jitter beaconing with LSTM/transformer time-series models, complement
    with rare-function CloudTrail analysis (Elastic CloudTrail ML), and surface the top-3 contributing
    features in alert text for explainability. A positive result flags a function whose post-update behavior
    is anomalous and worth deep review; a negative result indicates behavioral continuity across the release.
  answer_sources: *id002
  range: Last 90 days (train on pre-update behavior; score post-update windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'emb_pre = embed(function_logs+netflow, window=pre_update)

      emb_post = embed(function_logs+netflow, window=post_update)

      drift = distance(emb_pre, emb_post)

      beacon = lstm_timeseries_score(outbound_intervals)

      | where drift > threshold AND (beacon_like OR hidden_retry_loop OR (secrets_access AND external_comm))

      | emit top_3_contributing_features

      | alert severity=high'
