name: 'T1496.A007: Cloud Service Hijacking - Bedrock LLM Abuse'
id: 6c410683-6640-4ef4-b92f-61e44ce89228
description: 'Investigate whether an adversary is abusing Amazon Bedrock foundation-model access to cause
  impact in AWS through LLMjacking: hijacking stolen or over-privileged credentials to generate unauthorized
  content, perform social engineering at scale, resell access via reverse proxies, or drive resource-intensive
  inference at financially damaging scale. This playbook helps a SOC analyst determine if Bedrock invocation
  activity (InvokeModel, InvokeModelWithResponseStream, Converse, ConverseStream) has spiked sharply in
  volume, model diversity, token consumption, request frequency, or throttling/failure rate, and whether
  it is driven by principals, regions, source IPs, user-agents, or applications inconsistent with sanctioned
  AI usage. It correlates CloudTrail management and data events, Bedrock model-invocation logs, CloudWatch
  metrics, GuardDuty findings, and AWS Cost Anomaly Detection to surface credential-validation/access-reconnaissance
  patterns, permission and logging changes that precede abuse, cost and content-class change points, quota-exhaustion
  impact, and the downstream delivery of generated content into business channels. Methods span symbolic-logic
  detections, statistical baselining (modified Z-score/MAD, CUSUM/PELT, ARIMA, cost anomaly detection),
  and explainable machine learning (Isolation Forest, One-Class SVM, DeepLog sequence models, graph models)
  to give defensible, granular coverage of Bedrock LLM abuse.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any principal invoke Amazon Bedrock foundation models (CloudTrail InvokeModel, InvokeModelWithResponseStream,
    Converse, or ConverseStream) under conditions inconsistent with sanctioned AI usage — an unusual or
    first-seen principal, a newly assumed role, an unsanctioned region, a new source IP or user-agent
    (for example OpenAI reverse-proxy / OAI strings), or against a foundation model not approved for that
    workload?
  context: 'Under the Impact tactic, LLMjacking abuses hijacked credentials to run Bedrock inference for
    abusive content generation, resale via reverse proxies, or large-scale financial misuse. Build and
    maintain an allowlist of (principal, application, model, region) tuples from a trailing 30-day baseline,
    then alert on any Bedrock runtime invocation whose tuple is absent from that baseline. Critically,
    detect Converse and ConverseStream SEPARATELY from InvokeModel because the Converse APIs do not emit
    the InvokeModel eventName and are easily missed. Enrich with source IP / user-agent reputation (reverse-proxy
    and OAI strings are strong tells) and flag newly assumed roles. A positive result indicates a principal
    generating content from an identity, location, or model it has no established reason to use — a hallmark
    of credential hijacking; a negative result reflects invocations consistent with the sanctioned baseline.
    Citations: [LLMjacking, Sysdig](https://sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack/)
    [Growing Dangers of LLMjacking, Sysdig](https://sysdig.com/blog/growing-dangers-of-llmjacking/) [T1496.004,
    MITRE](https://attack.mitre.org/techniques/T1496/004/).'
  answer_sources: &id001
  - AWS CloudTrail management events
  - AWS CloudTrail data events (Bedrock runtime)
  - Amazon Bedrock model invocation logs (CloudWatch/S3)
  - Amazon CloudWatch metrics
  - Amazon GuardDuty findings
  - AWS Cost and Usage Report / Cost Anomaly Detection
  - 'NAI: Accounts/roles with Bedrock access, applications authorized to invoke foundation models, AI
    experimentation environments, recently created or assumed roles, source IPs/user-agents calling Bedrock,
    and regions where Bedrock usage should be limited or absent'
  range: Last 90 days (baseline trailing 30 days; alert per invocation event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="bedrock.amazonaws.com"

      | where eventName in ("InvokeModel","InvokeModelWithResponseStream","Converse","ConverseStream")

      | eval converse_api=if(eventName in ("Converse","ConverseStream"),1,0)   // detect separately

      | lookup bedrock_allowlist principal application model region OUTPUT in_baseline

      | eval new_tuple=if(in_baseline!="yes",1,0)

      | eval recon_ua=if(match(userAgent,"(?i)oai|reverse.?proxy|openai"),1,0)

      | where new_tuple=1 OR recon_ua=1 OR newly_assumed_role=1 OR region NOT IN (sanctioned_regions)

      | alert'
- question: Did a principal probe Bedrock capability and configuration — calling GetModelInvocationLoggingConfiguration,
    GetFoundationModelAvailability, ListFoundationModels, PutUseCaseForModelAccess, or PutFoundationModelEntitlement
    — especially with AccessDenied / ValidationException errors or immediately before its first successful
    model invocation?
  context: 'Attackers who steal credentials run reconnaissance to confirm the keys can invoke models and
    to check whether model-invocation logging is enabled before they generate prompts. In the Impact tactic
    this recon is the precursor to abusive inference at scale. Alert when a principal issues these discovery/entitlement
    calls — particularly clustered with AccessDenied or validation errors, or shortly before the first
    ever successful InvokeModel/Converse from that principal. The logging-config check is especially telling:
    LLMjacking tooling deliberately avoids keys that have logging enabled. A positive result indicates
    credential validation and capability mapping against Bedrock; a negative result reflects normal administrative
    discovery without the failure clustering or pre-abuse timing. Citations: [LLMjacking, Sysdig](https://sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack/)
    [Growing Dangers of LLMjacking, Sysdig](https://sysdig.com/blog/growing-dangers-of-llmjacking/).'
  answer_sources: *id001
  range: Last 90 days (correlate recon and first invocation within a 24-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="bedrock.amazonaws.com"

      | where eventName in ("GetModelInvocationLoggingConfiguration","GetFoundationModelAvailability","ListFoundationModels","PutUseCaseForModelAccess","PutFoundationModelEntitlement")

      | eval err=if(errorCode IN ("AccessDenied","ValidationException"),1,0)

      | transaction userIdentity.arn maxspan=24h

      | join type=left userIdentity.arn [ search source=cloudtrail eventName IN ("InvokeModel","Converse")
      ]

      | eval recon_then_invoke=if(isnotnull(first_invoke_time) AND first_invoke_time>recon_time,1,0)

      | where err=1 OR recon_then_invoke=1

      | alert'
- question: Were Bedrock invocation bursts preceded by IAM policy changes, model-access entitlement grants,
    broadened Bedrock permissions, or the disabling/altering of model-invocation logging (PutModelInvocationLoggingConfiguration
    set to off) for the same principal or role?
  context: 'LLMjacking tooling deliberately avoids credentials that have logging enabled, so adversaries
    frequently disable or weaken model-invocation logging and broaden permissions just before abusing
    Bedrock. Under the Impact tactic, this sequencing — a permission/entitlement/logging change followed
    by an invocation burst by the same identity — is a strong, low-noise signal of staged abuse. Alert
    when PutModelInvocationLoggingConfiguration disables logging, when IAM/Bedrock policies are broadened,
    or when model-access entitlements are granted, and then the same principal/role drives a spike in
    InvokeModel/Converse activity. A positive result indicates an actor preparing the environment to hide
    and scale abuse; a negative result reflects legitimate configuration change decoupled from anomalous
    inference. Citations: [LLMjacking, Sysdig](https://sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack/)
    [Leaked Environment Variables, Unit 42](https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/).'
  answer_sources: *id001
  range: Last 90 days (correlate config change and invocation burst within a 24-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail (eventSource="bedrock.amazonaws.com" OR eventSource="iam.amazonaws.com")

      | eval logging_off=if(eventName="PutModelInvocationLoggingConfiguration" AND loggingEnabled="false",1,0)

      | eval perm_change=if(eventName IN ("PutFoundationModelEntitlement","PutUseCaseForModelAccess","PutRolePolicy","AttachRolePolicy","PutUserPolicy"),1,0)

      | transaction userIdentity.arn maxspan=24h

      | join type=left userIdentity.arn [ search source=cloudtrail eventName IN ("InvokeModel","Converse","InvokeModelWithResponseStream","ConverseStream")
      | stats count as inv_burst by userIdentity.arn ]

      | where (logging_off=1 OR perm_change=1) AND inv_burst > burst_threshold

      | alert'
- question: Is the Bedrock invocation volume (input+output tokens, mean request size), frequency (invocations/min),
    inferred spend, or failure-state ratio (throttling/AccessDenied/ValidationException) for a (principal,
    application, model, region) a statistical outlier versus its own trailing 30-day baseline, or does
    a first-seen principal/region/model/source-IP combination or rising unique-source-IP count per credential
    appear?
  context: 'LLMjacking manifests as abrupt expansion in how much, how fast, and how expensively a credential
    consumes Bedrock inference. Baseline per (principal, application, model, region) over a trailing 30
    days four signals: Volume (token totals and mean request size), Frequency (invocations/min), Spend
    (inferred per-model cost), and State (ratio of throttling/AccessDenied/ValidationException to total
    calls). Flag when any metric exceeds the trailing 95th percentile or a modified Z-score (MAD) > 3.5,
    when ARIMA-forecast residuals spike, or when CUSUM/PELT detects an abrupt regime change. Also flag
    first-seen principal/region/model/source-IP combinations and a rising count of unique source IPs per
    credential (a sign of resale via reverse proxy). Derive thresholds per environment from each metric''s
    own distribution. A positive result means consumption has diverged sharply from the identity''s norm
    — the core impact signature of LLMjacking. Citations: [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    [ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194) [Change Point Detection, Aminikhanghahi
    & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/) [CloudTrail Anomaly Detector, Netflix](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)
    [Growing Dangers of LLMjacking, Sysdig](https://sysdig.com/blog/growing-dangers-of-llmjacking/).'
  answer_sources: *id001
  range: Last 90 days (baseline trailing 30 days; evaluate per principal/session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="bedrock.amazonaws.com" earliest=-30d

      | stats sum(input_tokens+output_tokens) as tokens avg(request_size) as mean_size count as calls
      dc(sourceIPAddress) as ip_fanout count(eval(errorCode IN ("ThrottlingException","AccessDenied","ValidationException")))
      as fails by principal, application, model, region, _time

      | eval freq=calls/minutes, spend=tokens*per_model_cost, state=fails/calls

      | eventstats p95(tokens) as t95 median(tokens) as tmed by principal,model

      | eval mz=0.6745*(tokens-tmed)/`mad(tokens)`

      | `cusum_pelt_changepoint(spend)` | `arima_residual(freq)`

      | where tokens>t95 OR abs(mz)>3.5 OR changepoint=1 OR arima_resid_spike=1 OR first_seen_combo=1
      OR ip_fanout>baseline

      | alert'
- question: Has AWS Cost Anomaly Detection (scoped to Amazon Bedrock and to each cost-allocation tag /
    application) detected inference spend diverging sharply from its learned baseline — the dominant financial
    impact of LLMjacking, which has exceeded $46,000/day?
  context: 'Even when invocation-level telemetry is incomplete, runaway cost is the unambiguous, high-impact
    endpoint of Bedrock abuse. Configure an AWS Cost Anomaly Detection monitor scoped to Amazon Bedrock,
    broken out per cost-allocation tag and per application, as a low-touch ML/statistical backstop that
    fires when inference spend diverges sharply from the learned baseline. Under the Impact tactic, a
    sustained cost spike directly measures financial damage and quota pressure on legitimate users. Set
    alert thresholds to catch the order-of-magnitude jumps seen in real LLMjacking incidents (can exceed
    $46,000/day). A positive result means inference spend has broken from its baseline and demands immediate
    cost containment and credential investigation; a negative result indicates spend tracking expected
    usage. Citations: [AWS Cost Anomaly Detection](https://docs.aws.amazon.com/cost-management/latest/userguide/getting-started-ad.html)
    [Bedrock cost tracking, AWS](https://aws.amazon.com/blogs/machine-learning/cost-tracking-multi-tenant-model-inference-on-amazon-bedrock/)
    [LLMjacking, Sysdig](https://sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack/).'
  answer_sources: *id001
  range: Last 90 days (continuous Cost Anomaly Detection; daily evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// AWS Cost Anomaly Detection monitor scoped to Bedrock

      create_cost_monitor(service="Amazon Bedrock", dimension=[cost_allocation_tag, application])

      | baseline learned by service/tag/app

      | where daily_spend - forecast_spend > anomaly_threshold OR daily_spend > 46000

      | emit account, service, tag, application, observed_spend, expected_spend

      | alert'
- question: Do unsupervised anomaly detectors (Isolation Forest, One-Class SVM) over per-principal Bedrock
    feature vectors — token-burst, model-switching, role/region novelty, error ratios, off-hours fraction,
    source-IP fan-out — or an LSTM (DeepLog-style) sequence model over each principal's Bedrock API order,
    flag abusive workloads, and does every alert surface its top-3 contributing features?
  context: 'Sophisticated actors interleave benign calls and spread activity to evade fixed thresholds,
    so model the shape and order of Bedrock behavior. Train unsupervised detectors (Isolation Forest,
    and One-Class SVM for robustness) on per-principal CloudTrail/invocation feature vectors capturing
    token-burst, model-switching, role/region novelty, error ratios, off-hours fraction, and source-IP
    fan-out; and/or train an LSTM DeepLog-style sequence model over each principal''s ordered Bedrock
    API calls; optionally add a cross-service graph model (CS-GAD). For analyst trust and triage speed,
    every alert MUST surface its top-3 contributing features via SHAP/LIME in the alert text, not just
    an anomaly score. In the Impact tactic, a high score points to a principal whose Bedrock usage is
    structurally abnormal — a likely hijacked credential generating abusive content at scale. Citations:
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363) [Robust IF/OCSVM, Scientific
    Reports](https://www.nature.com/articles/s41598-025-20445-4) [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015)
    [CS-GAD](https://arxiv.org/html/2409.12726v1) [SHAP IDS review, Frontiers](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    [Detecting Threats in CloudTrail with ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources: *id001
  range: Last 90 days (train on trailing 30-90 days; score continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Per-principal Bedrock feature vectors -> unsupervised + sequence models

      featurize principal: [token_burst, model_switching, role_region_novelty, error_ratio, off_hours_frac,
      ip_fanout]

      | score isolation_forest -> if_score, shap_top3

      | score one_class_svm -> ocsvm_score

      | model deeplog_next_key(sequence=ordered_eventName by principal) -> seq_anomaly

      | where if_score>thr OR ocsvm_score>thr OR seq_anomaly=1

      | emit principal, if_score, shap_top3'
- question: Were Bedrock invocations followed by service-quota-increase requests (RequestServiceQuotaIncrease),
    rapid cost growth, sustained throttling that blocks the owning application, or high-risk generated-content
    categories, and then downstream use of outputs in messaging/support/automation channels inconsistent
    with the application's mission?
  context: 'This question ties Bedrock abuse to visible organizational impact. Under the Impact tactic,
    adversaries who hijack model access often push past quotas (requesting increases), drive cost growth,
    and exhaust capacity so legitimate use is throttled — a denial of the application''s own AI function.
    Alert when invocation activity is followed by Bedrock RequestServiceQuotaIncrease, rapid cost growth,
    sustained throttling of the owning app, or production of high-risk content categories, and especially
    when the outputs then flow into messaging, support, or automation channels that the invoking application
    does not normally feed. A positive result links model abuse to concrete operational or financial damage;
    a negative result shows invocations without impactful follow-on. Citations: [LLMjacking, Sysdig](https://sysdig.com/blog/llmjacking-stolen-cloud-credentials-used-in-new-ai-attack/)
    [T1496.004, MITRE](https://attack.mitre.org/techniques/T1496/004/).'
  answer_sources: &id002
  - AWS CloudTrail management events
  - Amazon Bedrock model invocation logs (CloudWatch/S3)
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report / Cost Anomaly Detection
  - Amazon GuardDuty findings
  - 'NAI: AI-enabled applications exposed to employees or customers, budget-sensitive shared AWS accounts,
    Bedrock service quotas, and governance/cost telemetry that reveals abrupt misuse of model inference
    capacity'
  range: Last 90 days (correlate invocation, quota/cost/throttle, and downstream use within 24 hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail (eventSource="bedrock.amazonaws.com" OR eventSource="servicequotas.amazonaws.com")

      | transaction principal maxspan=24h

      | eval invoked=match(eventName,"InvokeModel|Converse")

      | eval quota_req=if(eventName="RequestServiceQuotaIncrease",1,0)

      | eval throttled=if(errorCode="ThrottlingException",1,0)

      | eval risky_content=lookup_content_class(invocation_log)

      | join principal [ search source=downstream_channels (email OR chat OR ticketing OR automation)
      ]

      | where invoked AND (quota_req=1 OR cost_growth=1 OR throttled=1 OR risky_content=1) AND downstream_mismatch=1

      | alert'
- question: Were suspicious Bedrock outputs subsequently delivered through email, chat, ticketing, or
    customer-facing automation pipelines that are not normally fed by the invoking application, when correlating
    invocation-log output text with downstream send events?
  context: 'A second, distinct impact signal is the weaponization of generated content: model outputs
    from a hijacked Bedrock workload being injected into business communication channels to support phishing,
    social engineering, or content-manipulation campaigns. Under the Impact tactic, raise this alert when
    suspicious invocation outputs (captured in Bedrock model-invocation logs) are matched to downstream
    send events in email, chat, ticketing, or customer-facing automation pipelines that the invoking application
    does not normally feed. The correlation is between invocation-log output text and the content of downstream
    delivery events. A positive result indicates the environment is being used as a content factory feeding
    unauthorized outbound campaigns; a negative result shows outputs remaining within sanctioned application
    flows. Citations: [T1496.004, MITRE](https://attack.mitre.org/techniques/T1496/004/).'
  answer_sources: *id002
  range: Last 90 days (correlate invocation output and downstream delivery within a 24-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=bedrock_invocation_logs

      | eval out_hash=fingerprint(output_text)

      | join out_hash [ search source=downstream_delivery (email OR chat OR ticketing OR automation) |
      eval out_hash=fingerprint(body) ]

      | lookup app_channel_map application OUTPUT expected_channels

      | where delivery_channel NOT IN (expected_channels)

      | alert'
- question: Do CUSUM/PELT change-point detection on the Bedrock cost/token series and MAD-based scoring
    on content-class ratios (roleplay/jailbreak/risky fraction from invocation logs) reveal principals
    or applications whose consumption or risky-content share materially exceeds expectations for their
    role?
  context: 'This statistical method compares invocation cost, token totals, content-class distribution
    (roleplay/jailbreak/risky fraction parsed from model-invocation logs), output reuse, and per-app call
    rates against historical baselines. Apply CUSUM/PELT change-point detection to the cost and token
    time series to catch abrupt regime changes, and MAD-based modified Z-scoring to the content-class
    ratios to catch a shift toward risky generation. Under the Impact tactic, flag principals or applications
    whose consumption or risky-content share materially exceeds expectations for their role. A positive
    result shows a measurable shift in either spend trajectory or the nature of generated content — evidence
    the workload''s purpose has changed under abuse; a negative result reflects stable cost and content
    profiles. Citations: [Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)
    [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    [Bedrock invocation logging, AWS](https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html)
    [Growing Dangers of LLMjacking, Sysdig](https://sysdig.com/blog/growing-dangers-of-llmjacking/).'
  answer_sources: *id002
  range: Last 90 days (baseline trailing 30-90 days; evaluate per principal/app)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=bedrock_invocation_logs earliest=-90d

      | stats sum(tokens) as tokens sum(cost) as cost count as calls count(eval(content_class IN ("roleplay","jailbreak","risky")))
      as risky by principal, application, _time

      | eval risky_ratio=risky/calls

      | `cusum_pelt_changepoint(cost)` | `cusum_pelt_changepoint(tokens)`

      | eventstats median(risky_ratio) as med by role | eval mz=0.6745*(risky_ratio-med)/`mad(risky_ratio)`

      | where changepoint_cost=1 OR changepoint_tokens=1 OR abs(mz)>3.5

      | table principal application cost risky_ratio | alert'
- question: Do sequence/graph models across Bedrock invocations, cost telemetry, and downstream application
    events identify campaigns where model abuse causes financial or reputational impact — emphasizing
    burst behavior, risky prompt themes, output reuse, and divergence from established interaction patterns
    — with top-3 contributing features surfaced and GuardDuty Extended Threat Detection correlating the
    weak signals into a single prioritized attack-sequence finding?
  context: 'The highest-impact LLMjacking cases are campaigns that span invocation behavior, cost, and
    downstream delivery rather than single events. Use sequence modeling (DeepLog) and graph modeling
    (CS-GAD) across Bedrock invocations, cost telemetry, and downstream application events to identify
    campaigns where model abuse causes financial or reputational impact, emphasizing burst behavior, risky
    prompt themes, output reuse, and divergence from established interaction patterns. Under the Impact
    tactic, surface the top-3 contributing features per alert (SHAP) for explainable triage, and let GuardDuty
    Extended Threat Detection correlate these individually weak signals into a single prioritized attack-sequence
    finding. A positive result is a correlated, multi-signal campaign of Bedrock abuse with measurable
    impact; a negative result indicates isolated anomalies without a coherent damaging sequence. Citations:
    [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015) [CS-GAD](https://arxiv.org/html/2409.12726v1)
    [SHAP IDS review, Frontiers](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    [GuardDuty Extended Threat Detection, AWS](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-extended-threat-detection.html).'
  answer_sources: *id002
  range: Last 90 days (train on trailing 30-90 days; score continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Cross-signal sequence/graph modeling for impactful Bedrock-abuse campaigns

      build_graph(nodes=[principal, model, application, downstream_channel, cost], edges=invoke/deliver,
      window=90d)

      | score deeplog(sequence=invocation_order by principal) -> seq_score

      | score cs_gad(session) -> graph_score

      | features [token_burst, risky_prompt_theme, output_reuse, interaction_divergence]

      | where seq_score>thr OR graph_score>thr

      | correlate guardduty_extended_threat_detection -> attack_sequence_finding

      | emit principal, attack_sequence_finding, shap_top3'
