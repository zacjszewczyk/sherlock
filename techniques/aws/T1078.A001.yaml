name: 'T1078.A001: IAM Users'
id: 2aa1cf92-f696-4b77-8b84-c8a03399a495
description: 'Investigate whether an adversary has gained initial access to an AWS environment by abusing
  a compromised IAM user, exercised through the AWS Management Console (ConsoleLogin) or programmatic
  API calls using long-term access keys. This playbook helps a SOC analyst determine if an IAM principal
  is authenticating from infrastructure, geographies, ASNs, user agents, or session shapes inconsistent
  with its established behavior, and whether that session rapidly expands into first-time or rare use
  of sensitive services (IAM, Organizations, Security Hub, GuardDuty, S3, KMS, Secrets Manager). It also
  covers misuse of long-term credentials: reconnaissance followed by privilege- or data-relevant activity,
  API calls from cloud-hosted infrastructure not owned by the organization, sudden activation of stale
  or recently created keys, permission probing via clustered AccessDenied responses, brute-force-then-success
  logon states, and logging-disruption follow-on. Detection methods span symbolic-logic rules over CloudTrail
  and GuardDuty, statistical baselining (modified Z-score, lifecycle/burst forecasting), and machine-learning
  models (session-shape clustering, credential-misuse classifiers, sequence/graph anomaly detection) to
  give defensible, granular coverage of compromised IAM-user initial access.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did an IAM user successfully authenticate (ConsoleLogin or a programmatic API call) from a
    source IP, ASN, country, or user-agent never before seen for that principal in the trailing 30 days,
    and did that same session quickly branch into first-time access to sensitive services such as IAM,
    Organizations, Security Hub, GuardDuty, S3, KMS, or Secrets Manager?
  context: In the Initial Access tactic, a compromised IAM user typically signs in from infrastructure
    the legitimate owner has never used and then immediately reaches for high-value services to establish
    footing. Build a 30-day first-seen baseline per principal for source IP/ASN/country and user-agent,
    and alert on a successful ConsoleLogin or API call from a previously unseen value, especially when
    followed within the same session by first-time use of identity, security, or secret/data services.
    Escalate to high severity on a corroborating GuardDuty finding such as UnauthorizedAccess:IAMUser/MaliciousIPCaller,
    TorIPCaller, ConsoleLoginSuccess, or InitialAccess:IAMUser/AnomalousBehavior, and treat ConsoleLogin
    without MFA (additionalEventData.MFAUsed=No) as an amplifier. A positive result indicates a likely
    unauthorized foothold; a negative result reflects normal administration from known infrastructure.
  answer_sources:
  - CloudTrail management events
  - CloudTrail ConsoleLogin events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Identity and Access Management access advisor data
  - 'NAI: AWS accounts receiving internet-origin IAM user access, CloudTrail records for ConsoleLogin
    and management APIs, and egress points associated with administrative sessions'
  range: Last 90 days (30-day first-seen baseline; correlate first-use within the same session window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail (eventName="ConsoleLogin" OR readOnly=false) errorMessage!="*Failure*"

      | lookup principal_baseline_30d userIdentity.arn OUTPUT seen_ips seen_asns seen_countries seen_uas

      | eval new_src=(sourceIPAddress NOT IN seen_ips OR src_asn NOT IN seen_asns OR src_country NOT IN
      seen_countries OR userAgent NOT IN seen_uas)

      | eval no_mfa=(additionalEventData.MFAUsed="No")

      | join type=left userIdentity.arn [ search source=cloudtrail eventSource IN ("iam.amazonaws.com","organizations.amazonaws.com","securityhub.amazonaws.com","guardduty.amazonaws.com","s3.amazonaws.com","kms.amazonaws.com","secretsmanager.amazonaws.com")
      | stats values(eventSource) as first_use_services by userIdentity.arn ]

      | join type=left userIdentity.arn [ search source=guardduty type IN ("UnauthorizedAccess:IAMUser/MaliciousIPCaller*","UnauthorizedAccess:IAMUser/TorIPCaller","UnauthorizedAccess:IAMUser/ConsoleLoginSuccess*","InitialAccess:IAMUser/AnomalousBehavior")
      | stats values(type) as gd_findings by userIdentity.arn ]

      | eval severity=case(isnotnull(gd_findings),"high", new_src AND isnotnull(first_use_services),"high",
      new_src,"medium", true(),"low")

      | where new_src OR isnotnull(gd_findings)

      | alert'
- question: Does the CloudTrail userAgent for an IAM principal match offensive or GUI tooling (for example
    S3 Browser, Pacu) or generic scripting agents (python-requests, Go-http-client, curl) that are not
    normal for that principal, particularly when it co-occurs with IAM enumeration or access-key creation?
  context: Adversaries who have obtained IAM credentials frequently drive them with attacker tooling or
    ad-hoc scripts rather than the principal's usual SDK/console fingerprint. Match the CloudTrail userAgent
    field against regexes for offensive/GUI tools (S3 Browser, Pacu, aws-cli from unexpected hosts) and
    generic scripting agents (python-requests, Go-http-client, curl) that are out of character for the
    principal. Alert on any match and escalate when the same session performs IAM enumeration (ListUsers/ListRoles)
    or creates access keys (CreateAccessKey), a classic post-compromise persistence move. Validate coverage
    by replaying techniques with Stratus Red Team. A positive result strongly suggests credential misuse
    via tooling; a negative result indicates the principal's expected client fingerprint.
  answer_sources:
  - CloudTrail management events
  - CloudTrail ConsoleLogin events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Identity and Access Management access advisor data
  - 'NAI: AWS accounts receiving internet-origin IAM user access, CloudTrail records for ConsoleLogin
    and management APIs, and egress points associated with administrative sessions'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail

      | eval tool_ua=if(match(userAgent,"(?i)s3browser|pacu|stratus|nimbostratus|go-http-client|python-requests|curl|aws-cli.*(unknown|unexpected)"),1,0)

      | join type=left userIdentity.arn [ search source=cloudtrail eventName IN ("ListUsers","ListRoles","ListPolicies","GetAccountAuthorizationDetails","CreateAccessKey","CreateUser")
      | stats values(eventName) as iam_actions by userIdentity.arn ]

      | eval escalate=if(tool_ua=1 AND isnotnull(iam_actions),1,0)

      | where tool_ua=1

      | table _time userIdentity.arn sourceIPAddress userAgent iam_actions escalate

      | alert'
- question: Across a session, do an IAM user's source geography/ASN, hour-of-day, service families, API
    volume, success-to-failure ratio, or console-versus-programmatic mix deviate from that user's trailing
    30-day baseline beyond the 95th percentile or a robust modified Z-score above 3.5?
  context: Compromised initial access often shows up as a measurable shift in a principal's behavioral
    profile rather than a single hard indicator. Build per-IAM-user baselines for source geography/ASN,
    hour-of-day, service families touched, API request volume, authentication success-to-failure ratio,
    and the mix of console versus programmatic activity. Flag sessions whose source novelty, service novelty,
    or request volume exceed the user's trailing 30-day 95th percentile, scoring deviations with a median/MAD
    modified Z-score (>3.5) so high-volume automation and batch jobs do not distort the baseline. Report
    which metric drove the alert. A positive result means the identity is behaving unlike itself; a negative
    result reflects activity within established norms.
  answer_sources:
  - CloudTrail management events
  - CloudTrail ConsoleLogin events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Identity and Access Management access advisor data
  - 'NAI: AWS accounts receiving internet-origin IAM user access, CloudTrail records for ConsoleLogin
    and management APIs, and egress points associated with administrative sessions'
  range: Last 90 days (30-day trailing baseline; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail earliest=-30d

      | stats count as api_vol dc(eventSource) as service_families dc(src_asn) as asn_div count(eval(errorCode!="success"))
      as fails count as total values(awsRegion) as regions by userIdentity.arn, session_id

      | eval fail_ratio=fails/total, console_prog_mix=...

      | eventstats median(api_vol) as med_vol by userIdentity.arn

      | eval mad_vol=`median_abs_dev(api_vol)`, mz_vol=0.6745*(api_vol-med_vol)/mad_vol

      | eval src_novelty=(asn NOT IN baseline_asns), svc_novelty=(eventSource NOT IN baseline_services)

      | where abs(mz_vol)>3.5 OR src_novelty OR svc_novelty OR api_vol>p95_vol

      | eval detail="driver metric exceeded 30d 95pct/modZ baseline"

      | alert'
- question: Was a successful ConsoleLogin preceded by an abnormal burst of failed ConsoleLogin or AccessDenied
    events for the same principal or source IP within a one-hour window, above the rolling 99th percentile
    or a modified Z-score over 3.5?
  context: A spike of authentication failures immediately followed by success is a hallmark of brute-force,
    password-spray, or credential-guessing that culminated in initial access. Treat per-principal and
    per-source-IP failed ConsoleLogin and AccessDenied counts as a first-class State signal, baseline
    them, and alert when a successful sign-in is preceded by failure counts above the rolling 99th percentile
    or a median/MAD modified Z-score >3.5 within a one-hour window. Pivot on the source IP to see whether
    multiple principals were targeted (spray). A positive result indicates guessing that succeeded and
    warrants immediate credential containment; a negative result indicates a clean sign-in without preceding
    failure pressure.
  answer_sources:
  - CloudTrail management events
  - CloudTrail ConsoleLogin events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Identity and Access Management access advisor data
  - 'NAI: AWS accounts receiving internet-origin IAM user access, CloudTrail records for ConsoleLogin
    and management APIs, and egress points associated with administrative sessions'
  range: Last 90 days (alert on a 1-hour sliding window before each success)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventName="ConsoleLogin"

      | bin _time span=1h

      | stats count(eval(errorMessage="*Failed authentication*" OR errorCode="AccessDenied")) as fails
      count(eval(responseElements.ConsoleLogin="Success")) as successes by userIdentity.arn, sourceIPAddress,
      _time

      | eventstats p99(fails) as p99_fails median(fails) as med_fails by userIdentity.arn

      | eval mad=`median_abs_dev(fails)`, mz=0.6745*(fails-med_fails)/mad

      | where successes>0 AND (fails>p99_fails OR abs(mz)>3.5)

      | alert'
- question: When IAM user sessions are clustered by their ordered service access, source context, console
    behavior, and response-code patterns, does the session fall into a rare cluster that begins with authentication
    and rapidly branches into discovery and privilege-sensitive services?
  context: Unsupervised clustering of session shapes isolates the rare access patterns associated with
    compromised credentials, which differ structurally from routine administration. Cluster IAM user sessions
    by ordered service access, source context, console behavior, and response-code patterns, then prioritize
    small/rare clusters whose sessions start with authentication and quickly fan into discovery (ListUsers/ListRoles/ListBuckets)
    and privilege-sensitive services (KMS, Secrets Manager, IAM mutations). Report the top-3 contributing
    features (e.g., new ASN, first-time service, AccessDenied burst) so analysts can triage. In the Initial
    Access tactic a rare session shape that mirrors a recon-to-privilege progression is a strong signal
    of an unauthorized foothold; common, established clusters are benign.
  answer_sources:
  - CloudTrail management events
  - CloudTrail ConsoleLogin events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Identity and Access Management access advisor data
  - 'NAI: AWS accounts receiving internet-origin IAM user access, CloudTrail records for ConsoleLogin
    and management APIs, and egress points associated with administrative sessions'
  range: Last 90 days (train clustering on 30-90 days; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Cluster IAM-user sessions by ordered service access + source + console + response codes

      featurize session: [ordered_service_seq, source_asn, source_country, console_vs_prog, response_code_hist,
      access_denied_burst, first_time_service_flag]

      | cluster session_vectors (HDBSCAN/kmeans, train_window=90d)

      | eval rare_cluster=(cluster_size < small_threshold)

      | eval recon_to_priv=(seq_starts_with_auth AND branches_to(discovery, kms|secretsmanager|iam_mutation))

      | where rare_cluster AND recon_to_priv

      | emit userIdentity.arn, cluster_id, shap_top3=[new_asn, first_time_service, access_denied_burst]'
- question: Does a supervised credential-misuse classifier score an IAM user session as likely compromised
    based on IP reputation, geo/ASN novelty, API-family novelty, first-time service combinations, session
    duration, MFA result, and error transitions rather than legitimate admin travel or automation?
  context: A trained classifier can weigh many weak signals together to separate genuine compromise from
    benign anomalies like an administrator traveling or a new automation job. Train a model over IAM user
    sessions using features such as source IP reputation, geo/ASN novelty, API-family novelty, first-time
    service combinations, session duration, MFA result, and error transitions, and alert on compromised-credential
    probability above a tuned threshold. Surface the top-3 contributing features in every alert and monitor
    for model drift so detection stays calibrated. In the Initial Access tactic a high-probability score
    points to an IAM user being driven by an unauthorized party; an explainable low score helps clear
    benign novelty quickly.
  answer_sources:
  - CloudTrail management events
  - CloudTrail ConsoleLogin events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Identity and Access Management access advisor data
  - 'NAI: AWS accounts receiving internet-origin IAM user access, CloudTrail records for ConsoleLogin
    and management APIs, and egress points associated with administrative sessions'
  range: Last 90 days (train on historical labeled sessions; score continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Supervised credential-misuse classifier over IAM-user sessions

      featurize session: [ip_reputation, geo_asn_novelty, api_family_novelty, first_time_service_combo,
      session_duration, mfa_result, error_transition_rate]

      | score classifier(model=cred_misuse) -> compromise_prob, shap_top3

      | monitor drift(model=cred_misuse)

      | where compromise_prob > threshold

      | emit userIdentity.arn, compromise_prob, shap_top3'
- question: Did an IAM user operating from a new source perform reconnaissance calls (ListUsers, ListRoles,
    ListPolicies, ListBuckets, GetAccountAuthorizationDetails, ListAccessAnalyzerFindings, DescribeRegions)
    and then transition to privilege-relevant actions such as policy reads, AssumeRole attempts, GetSecretValue,
    or S3 data access?
  context: Stolen long-term credentials are typically used first to map the environment and then to reach
    privilege or data, so detecting the recon-to-privilege chain catches the foothold as it expands. Detect
    sessions where an IAM user from a new source issues enumeration/reconnaissance calls and then pivots
    to privilege-relevant operations (policy reads, role-assumption attempts, GetSecretValue, S3 GetObject
    on sensitive buckets). Raise severity when the source is cloud-hosted (e.g., another provider's ASN)
    or threat-listed, and correlate matching GuardDuty Recon:IAMUser/* or UnauthorizedAccess:IAMUser/*
    findings. A positive result indicates an actor advancing from discovery toward impact under a compromised
    key; a negative result reflects isolated enumeration consistent with normal operations.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Access Analyzer findings
  - 'NAI: IAM users with long-lived access keys, accounts with externally exposed workloads that might
    leak keys, and services typically targeted early after credential compromise'
  range: Last 90 days (correlate recon and privilege-relevant actions within a 24-hour session window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail

      | transaction userIdentity.arn maxspan=24h

      | eval recon=match(eventName,"ListUsers|ListRoles|ListPolicies|ListBuckets|GetAccountAuthorizationDetails|ListFindings|DescribeRegions")

      | eval priv=match(eventName,"GetPolicy|GetPolicyVersion|AssumeRole|GetSecretValue|GetObject")

      | eval new_src=(sourceIPAddress NOT IN baseline_ips)

      | eval cloud_hosted=cidr_match(sourceIPAddress, cloud_provider_ranges) OR threatlist_match(sourceIPAddress)

      | join type=left userIdentity.arn [ search source=guardduty type IN ("Recon:IAMUser/*","UnauthorizedAccess:IAMUser/*")
      | stats values(type) as gd by userIdentity.arn ]

      | where recon AND priv AND new_src

      | eval severity=if(cloud_hosted OR isnotnull(gd),"high","medium")

      | alert'
- question: Did an IAM user outside approved logging-automation roles issue CloudTrail StopLogging or
    DeleteTrail, GuardDuty DeleteDetector, or disable AWS Config or Security Hub shortly after first use
    from a new source?
  context: A common step right after unauthorized access is to blind the defenders by disrupting logging
    and monitoring. Alert when an IAM user that is not part of an approved logging-automation allowlist
    issues CloudTrail StopLogging or DeleteTrail, GuardDuty DeleteDetector, or disables Config recorders
    or Security Hub, especially shortly after a first-use-from-new-source event tied to the same principal.
    This defense-evasion follow-on strongly corroborates that the initial access was unauthorized. A positive
    result is high-severity and warrants immediate containment and restoration of logging; a negative
    result indicates no tampering with the audit trail.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Access Analyzer findings
  - 'NAI: IAM users with long-lived access keys, accounts with externally exposed workloads that might
    leak keys, and services typically targeted early after credential compromise'
  range: Last 90 days (correlate within 24 hours of first use from a new source)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventName IN ("StopLogging","DeleteTrail","DeleteDetector","StopConfigurationRecorder","DeleteConfigurationRecorder","DisableSecurityHub","UpdateDetector")

      | lookup logging_automation_allowlist userIdentity.arn OUTPUT approved

      | where isnull(approved)

      | join type=left userIdentity.arn [ search source=cloudtrail eventName="ConsoleLogin" new_src=1
      earliest=-24h | stats min(_time) as first_use_new_src by userIdentity.arn ]

      | eval shortly_after=(isnotnull(first_use_new_src) AND _time-first_use_new_src < 86400)

      | eval severity="high"

      | alert'
- question: Using the IAM credential report, is a long-term access key that has been dormant beyond 90
    days suddenly active from a new network, or is a recently created key beginning high-risk API activity
    far sooner than the account population's norm (modified Z-score over 3.5)?
  context: Attackers often revive stale keys they have recovered or exposed, or weaponize freshly created
    keys immediately, both of which deviate from how the account's keys normally age and are used. Using
    the IAM credential report, compare each user's normal access-key age, active-key count, last-used
    recency/region, API dispersion, and source-network diversity. Flag stale long-term keys (dormant >90
    days) that suddenly become active from new networks, or recently created keys that begin high-risk
    API activity sooner than the account population's norm, scoring deviations with a median/MAD modified
    Z-score (>3.5). A positive result points to credential compromise or exposure being operationalized;
    a negative result reflects key usage consistent with the population baseline.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Access Analyzer findings
  - 'NAI: IAM users with long-lived access keys, accounts with externally exposed workloads that might
    leak keys, and services typically targeted early after credential compromise'
  range: Last 90 days (credential-report lookback; per-key evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=iam_credential_report

      | eval key_age_days=now_days - key_creation_days, dormant=(days_since_last_used > 90)

      | stats values(*) by user, access_key_id

      | eventstats median(key_age_days) as pop_med_age p95(time_to_first_highrisk) as pop_p95_ttfr

      | eval mad_age=`median_abs_dev(key_age_days)`, mz_age=0.6745*(key_age_days-pop_med_age)/mad_age

      | join type=left access_key_id [ search source=cloudtrail | stats values(src_asn) as used_asns dc(awsRegion)
      as region_div by accessKeyId ]

      | eval stale_reactivated=(dormant AND new_network=1)

      | eval fast_highrisk=(time_to_first_highrisk < pop_p95_ttfr AND abs(mz_age)>3.5)

      | where stale_reactivated OR fast_highrisk

      | alert'
- question: Measuring time between key creation, last rotation, prior inactivity, and first sensitive
    API use, does a recently recovered, reactivated, or long-dormant key begin immediate reconnaissance
    or privilege-relevant activity, or exceed its forecasted API/error rate prediction interval?
  context: 'Credential lifecycle timing is a strong tell: a key that goes from creation or long dormancy
    straight into sensitive activity behaves unlike a key in normal rotation. Measure the time between
    key creation, last rotation, prior inactivity, and first sensitive API use, and forecast each key''s
    expected API rate. Escalate when a recently recovered, reactivated, or long-dormant key begins immediate
    reconnaissance or privilege-relevant activity, or when its API or error volume exceeds the forecast
    prediction interval. A positive result indicates a key being driven in a burst inconsistent with its
    history, a likely compromise signature; a negative result indicates usage within forecasted bounds.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Access Analyzer findings
  - 'NAI: IAM users with long-lived access keys, accounts with externally exposed workloads that might
    leak keys, and services typically targeted early after credential compromise'
  range: Last 90 days (lifecycle window per key; forecast prediction interval per key)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail join source=iam_credential_report on accessKeyId

      | eval t_create=key_creation_time, t_rotate=last_rotation_time, t_inactive=prior_inactivity_days,
      t_first_sensitive=first_time(eventName matches "GetSecretValue|AssumeRole|ListUsers|GetObject")

      | eval immediate_recon=(t_first_sensitive - greatest(t_create, t_reactivation) < short_window)

      | forecast per_key_api_rate -> pred, pred_hi

      | eval rate_breach=(observed_api_rate > pred_hi OR observed_error_rate > err_pred_hi)

      | eval recovered_or_dormant=(was_recovered OR was_reactivated OR t_inactive>90)

      | where recovered_or_dormant AND (immediate_recon OR rate_breach)

      | alert'
- question: Does an IAM principal's count of AccessDenied/UnauthorizedOperation responses, or its count
    of distinct denied actions, exceed its rolling 99th percentile or a modified Z-score over 3.5, indicating
    permission probing by a compromised credential?
  context: An actor wielding a stolen key usually does not know its exact permissions and probes blindly,
    producing clustered authorization failures across many actions. Treat AccessDenied/UnauthorizedOperation
    responses as a distinct State signal, baseline per-principal error rate and distinct-denied-action
    count, and alert when a key's denial volume or breadth exceeds its rolling 99th percentile or a modified
    Z-score >3.5. A positive result suggests the credential is being exercised by someone enumerating
    the boundaries of its access; a negative result indicates well-scoped, expected usage without repeated
    denials.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Access Analyzer findings
  - 'NAI: IAM users with long-lived access keys, accounts with externally exposed workloads that might
    leak keys, and services typically targeted early after credential compromise'
  range: Last 90 days (rolling baseline; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail (errorCode="AccessDenied" OR errorCode="*UnauthorizedOperation*")

      | stats count as denials dc(eventName) as distinct_denied_actions by userIdentity.arn, accessKeyId,
      session_id

      | eventstats p99(denials) as p99_d median(denials) as med_d by userIdentity.arn

      | eval mad=`median_abs_dev(denials)`, mz=0.6745*(denials-med_d)/mad

      | where denials>p99_d OR abs(mz)>3.5

      | table userIdentity.arn accessKeyId denials distinct_denied_actions

      | alert'
- question: Does a sequence or graph anomaly model flag an IAM user's ordered API activity, enriched with
    key age, source characteristics, and service progression, as moving from discovery to privilege-sensitive
    operations along a path not previously seen for that user or its role cohort?
  context: Sophisticated abuse of long-term credentials is best captured by modeling the order and shape
    of activity rather than raw counts, because attackers interleave benign calls to evade thresholds.
    Apply sequence or graph anomaly detection to ordered IAM user API activity enriched with key age,
    source characteristics, and service progression, prioritizing sessions whose path moves from discovery
    into privilege-sensitive operations in a way not previously observed for that user or role cohort.
    Surface the top-3 contributing edges/transitions as the explanation so analysts can validate. In the
    Initial Access tactic, a structurally novel discovery-to-privilege path under a long-term key is a
    strong indicator of unauthorized external access; familiar paths are benign.
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS IAM credential report
  - AWS Access Analyzer findings
  - 'NAI: IAM users with long-lived access keys, accounts with externally exposed workloads that might
    leak keys, and services typically targeted early after credential compromise'
  range: Last 90 days (train on 30-90 days of sequences/graph; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Sequence/graph anomaly over ordered IAM-user API activity

      build sequences: ordered_eventName by userIdentity.arn enriched with [key_age, source_asn, source_country,
      service_stage]

      | model sequence_anomaly(LSTM/transformer next-event) -> seq_anomaly_score

      | build_graph(nodes=[user, role, service, resource], edges=api_call, window=90d)

      | score graph_anomaly(path: discovery -> privilege_sensitive) -> path_score

      | eval novel_path=(path not in user_or_cohort_history)

      | where (seq_anomaly_score>thr OR path_score>thr) AND novel_path

      | emit userIdentity.arn, top3_transitions'
