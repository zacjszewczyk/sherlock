questions:
- question: Did a CloudTrail RunInstances event, launch-template change, or instance-profile attachment
    launch an unusual or expensive EC2 instance family (GPU/accelerated, large *xlarge), use an unapproved
    AMI, assign a public IP, originate from an anomalous source ASN/geolocation, exhibit impossible-travel,
    or fan out rapidly across multiple regions, followed within minutes by outbound VPC Flow Log connections
    to mining-pool ports (3333, 4444, 5555, 7777, 14444), Stratum JSON-RPC login/submit/job messages,
    or DNS-over-HTTPS egress that hides pool-domain resolution?
  context: 'Under the Impact tactic, an adversary who has obtained credentials commonly stands up fresh
    EC2 compute to monetize stolen capacity through cryptomining or other compute abuse. The strongest
    early signal is the pairing of a suspicious control-plane launch with the network behavior of a miner
    moments later. Look for RunInstances or launch-template/instance-profile changes that select rarely
    used, GPU/accelerated, or oversized instance families, reference AMIs outside the approved catalog,
    request public IPs, or come from source ASNs/geolocations and region patterns the account never uses
    (including impossible-travel and rapid multi-region launches). Then pivot to VPC Flow Logs for the
    new instance and look for outbound connections to known Stratum mining-pool ports or for DoH egress
    masking pool-domain resolution. A positive correlation - an anomalous launch immediately followed
    by mining-like egress - is high-confidence compute hijacking; a launch with normal, business-correlated
    traffic is likely benign autoscaling or deployment. Sources: [Compromised Cloud Compute Credentials,
    Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/) [A First Look
    at Browser-Based Cryptojacking](https://arxiv.org/abs/1803.02887) [Cado Discovers Denonia, Cado Security](https://www.cadosecurity.com/blog/cado-discovers-denonia-the-first-malware-specifically-targeting-lambda)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Accounts permitted to launch EC2 instances, subnets with internet egress, EC2 fleets handling
    elastic compute, and regions where high-cost or GPU-capable instances are uncommon'
  range: Last 90 days (correlate launch and outbound mining egress within a 30-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventName="RunInstances" OR eventName="ModifyLaunchTemplate" OR eventName="AssociateIamInstanceProfile"

      | eval suspicious=match(instanceType,"(?i)(p[0-9]|g[0-9]|inf|trn|.*\\dx?large)") OR NOT (imageId
      in approved_amis) OR associatePublicIpAddress="true" OR (sourceASN in rare_asns) OR impossible_travel=1
      OR multi_region_burst=1

      | where suspicious=1

      | join instanceId [ search source=vpcflowlogs (dstport in (3333,4444,5555,7777,14444) OR stratum_method
      in ("login","submit","job") OR doh_egress=1) earliest=-30m ]

      | alert'
- question: Did a newly launched or recently repurposed EC2 instance also receive a high-privilege IAM
    role, a weakened security group (for example 0.0.0.0/0 ingress), a RequestServiceQuotaIncrease, or
    have monitoring disabled (GuardDuty, CloudTrail, or VPC Flow Logs) shortly before it began sustained
    high-CPU or high-egress behavior?
  context: 'In the Impact tactic, adversaries hardening their foothold on hijacked compute frequently
    grant the instance more privilege and remove the controls that would expose them, then scale up resource
    abuse. This question chains a compute launch/repurpose to privilege and persistence changes plus monitoring
    tampering. Look for IAM role attachment granting broad permissions, security-group changes that open
    the instance to the internet, service-quota increase requests (used to lift instance/region limits
    so mining can scale), and disable/delete actions against GuardDuty detectors, CloudTrail trails, or
    VPC Flow Logs - especially when these precede a spike in CPU utilization or outbound bytes. A positive
    result indicates deliberate adversary setup of stolen compute rather than routine operations; absence
    of monitoring tampering and privilege escalation favors a benign workload. Sources: [Leaked Environment
    Variables, Unit 42](https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Accounts permitted to launch EC2 instances, subnets with internet egress, EC2 fleets handling
    elastic compute, and regions where high-cost or GPU-capable instances are uncommon'
  range: Last 90 days (correlate config changes with utilization spike within a 1-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail (eventName in ("AttachRolePolicy","AssociateIamInstanceProfile","AuthorizeSecurityGroupIngress","RequestServiceQuotaIncrease")
      OR eventName in ("DeleteDetector","StopLogging","DeleteFlowLogs"))

      | transaction instanceId maxspan=1h

      | eval priv_or_persist=match(eventName,"AttachRolePolicy|AssociateIamInstanceProfile|RequestServiceQuotaIncrease")
      OR cidr="0.0.0.0/0"

      | eval monitoring_off=match(eventName,"DeleteDetector|StopLogging|DeleteFlowLogs")

      | join instanceId [ search source=cloudwatch metric in ("CPUUtilization","NetworkOut") value>90
      earliest=-1h ]

      | where (priv_or_persist OR monitoring_off) | alert'
- question: On host or container telemetry (auditd, Sysmon, or Falco) for EC2 instances, do you see known
    miner binaries or paths (xmrig, kinsing, kdevtmpfsi, cpuminer), execution from /dev/shm, fileless
    memfd_create execution, drop-and-execute of a new binary inside a container, reads of AWS credentials,
    processes masquerading as kernel threads (for example bioset) with LD_PRELOAD hiding, or static CryptoNight
    WASM/opcode signatures in observable bytecode?
  context: 'Even when control-plane and network signals are ambiguous, host and container telemetry can
    directly confirm a miner running on hijacked EC2. Under Impact, match process-creation events against
    known miner names and paths, watch for execution from memory-resident or temporary locations (/dev/shm,
    memfd_create) that evade disk scanning, container drop-and-execute patterns, processes that read instance-credential
    files (IMDS or ~/.aws), and rootkit-style hiding such as a miner masquerading as a kernel thread name
    with LD_PRELOAD. Where bytecode is observable, apply static CryptoNight WASM/opcode signatures. A
    positive match is direct evidence of unauthorized compute abuse on the host; a clean host with high
    CPU may instead be a legitimate batch job and warrants the statistical checks. Sources: [Falco Default
    Detection Rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml) [Hildegard,
    Unit 42](https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/) [MineSweeper](https://download.vusec.net/papers/minesweeper_ccs18.pdf)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Accounts permitted to launch EC2 instances, subnets with internet egress, EC2 fleets handling
    elastic compute, and regions where high-cost or GPU-capable instances are uncommon'
  range: Last 90 days
  queries:
  - technology: EDR/auditd/Falco pseudocode
    query: 'source=auditd:execve OR source=sysmon EventCode=1 OR source=falco

      | eval miner=match(process_name,"(?i)xmrig|kinsing|kdevtmpfsi|cpuminer") OR match(exe_path,"/dev/shm/")

      | eval fileless=match(syscall_detail,"memfd_create") OR container_drop_exec=1

      | eval cred_read=match(file_path,"\\.aws/credentials|169\\.254\\.169\\.254")

      | eval masquerade=match(process_name,"^(bioset|kworker|kthreadd)$") AND ld_preload_set=1

      | eval cryptonight_sig=wasm_opcode_match("cryptonight")

      | where miner OR fileless OR (cred_read AND masquerade) OR cryptonight_sig | alert'
- question: Across a rolling 30-day window, is an account or workload showing sustained CPU occupancy
    (for example >90% for over 30 minutes with low variance) without a correlated business event, a sudden
    appearance of expensive compute classes, or RunInstances frequency / Cost and Usage Report spend exceeding
    its own 95th percentile baseline?
  context: 'Compute hijacking for mining produces a distinctive resource signature: long, flat, high CPU
    utilization and rising cost that does not line up with deployments or business activity. Under Impact,
    baseline per-account and per-workload RunInstances frequency, instance-type mix, CloudWatch CPUUtilization,
    network egress bytes, and CUR spend over rolling 30-day windows, deriving thresholds per account because
    legitimate burst workloads vary widely. Flag sustained, low-variance high CPU occupancy lacking a
    correlated change/business event, the sudden first-time appearance of expensive (GPU/accelerated)
    compute classes, or launch/spend above the 95th percentile. A positive result is a cost/utilization
    outlier consistent with mining; a negative result reflects normal elastic workloads. Pair this with
    network and host signals to reduce false positives from legitimate compute-heavy jobs. Sources: [Detecting
    Covert Cryptomining using HPC](https://arxiv.org/abs/1909.00268) [Leaked Environment Variables, Unit
    42](https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Accounts permitted to launch EC2 instances, subnets with internet egress, EC2 fleets handling
    elastic compute, and regions where high-cost or GPU-capable instances are uncommon'
  range: Last 90 days (baseline rolling 30-day windows; evaluate per account/workload)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudwatch OR source=cur earliest=-30d

      | stats avg(CPUUtilization) as cpu_avg stdev(CPUUtilization) as cpu_var max_duration(cpu>90) as
      high_cpu_minutes sum(cost) as spend count(eval(eventName="RunInstances")) as launches values(instanceType)
      as types by account_id, workload_id

      | eventstats p95(launches) as launch_p95 p95(spend) as spend_p95 by account_id

      | eval sustained_high_cpu=if(cpu_avg>90 AND high_cpu_minutes>30 AND cpu_var<5 AND business_event=0,1,0)

      | eval expensive_new_class=if(NOT (types in baseline_types) AND match(types,"(?i)p[0-9]|g[0-9]|.*xlarge"),1,0)

      | where sustained_high_cpu=1 OR expensive_new_class=1 OR launches>launch_p95 OR spend>spend_p95

      | eval detail="cpu=".cpu_avg." high_cpu_min=".high_cpu_minutes." spend=".spend | alert'
- question: Do VPC Flow Log or Zeek conn flows from EC2 instances exhibit the low-variance, periodic,
    near-symmetric Stratum keep-alive heartbeat - small bidirectional packets at fixed intervals, long
    flow duration, low byte variance - that distinguishes mining egress from bursty application traffic
    even when the traffic is encrypted or VPN/tunneled?
  context: 'Mining clients maintain a persistent connection to a pool and exchange small, regular keep-alive
    and share-submission messages, producing a flow fingerprint very different from request/response application
    traffic. Under Impact, profile per-instance flows for periodicity (fixed inter-arrival intervals),
    near-symmetric small packet sizes, long duration, and low byte-volume variance. This heartbeat signature
    survives encryption and VPN tunneling because it is a timing/volume pattern rather than payload content.
    A positive result - a long-lived, metronomic, low-variance flow from compute - strongly indicates
    a mining session; bursty, asymmetric, or short flows are typical of legitimate services. Correlate
    flagged flows back to the launching principal and instance for triage. Sources: [Cryptomining Makes
    Noise / Crypto-Aegis](https://arxiv.org/abs/1910.09272) [A First Look at Browser-Based Cryptojacking](https://arxiv.org/abs/1803.02887)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Accounts permitted to launch EC2 instances, subnets with internet egress, EC2 fleets handling
    elastic compute, and regions where high-cost or GPU-capable instances are uncommon'
  range: Last 90 days (analyze flow periodicity over multi-hour windows)
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'source=vpcflowlogs OR source=zeek_conn earliest=-90d

      | stats count as pkts avg(pkt_size) as size_avg stdev(pkt_size) as size_var avg(inter_arrival) as
      iat_avg stdev(inter_arrival) as iat_var sum(bytes) as bytes max(duration) as dur by src_ip, dst_ip,
      dst_port, conn_uid

      | eval symmetry=abs(bytes_out-bytes_in)/(bytes_out+bytes_in)

      | eval heartbeat=if(iat_var<0.1*iat_avg AND size_var<small_thr AND dur>3600 AND symmetry<0.2,1,0)

      | where heartbeat=1

      | table src_ip dst_ip dst_port dur iat_avg size_avg | alert'
- question: Are there bursts of failed, AccessDenied, or throttled RunInstances calls, spikes in NXDOMAIN
    / blocked-egress from compute (failed DoH or pool-domain resolution), or CloudTrail event sequences
    that violate the learned normal workflow grammar (for example abnormal RunInstances -> ModifyInstanceAttribute
    -> AuthorizeSecurityGroupIngress orderings)?
  context: 'Adversaries operating with stolen or limited credentials probe boundaries and trip over guardrails,
    generating failure-mode signals that precede or accompany successful hijacking. Under Impact, explicitly
    baseline and alert on bursts of failed/AccessDenied/throttled RunInstances (attempts to launch beyond
    limits or permissions) and on spikes in NXDOMAIN or blocked outbound resolution from compute, which
    indicate failed DoH or mining-pool domain lookups. Separately, score CloudTrail control-plane event
    sequences against the account''s learned normal workflow grammar using a sequence model (DeepLog-style
    next-event prediction) so that improbable orderings - such as a launch immediately followed by attribute
    modification and security-group opening - surface even if each call individually succeeds. A positive
    result indicates probing or an abnormal control-plane workflow consistent with hijack setup; a negative
    result reflects normal, well-scoped operations. Sources: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)
    [Compromised Cloud Compute Credentials, Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Accounts permitted to launch EC2 instances, subnets with internet egress, EC2 fleets handling
    elastic compute, and regions where high-cost or GPU-capable instances are uncommon'
  range: Last 90 days (baseline 30-90 days; alert on bursts and per-session sequences)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail earliest=-90d

      | eval failed_run=if(eventName="RunInstances" AND (errorCode="*AccessDenied*" OR errorCode="*Throttling*"
      OR errorCode="Client.*"),1,0)

      | eval failed_dns=if(source="vpcflowlogs" AND (rcode="NXDOMAIN" OR action="REJECT"),1,0)

      | bin _time span=10m

      | stats sum(failed_run) as run_failures sum(failed_dns) as dns_failures values(eventName) as seq
      by userIdentity.arn, instanceId, _time

      | eventstats p95(run_failures) as fail_p95

      | eval seq_anomaly=deeplog_next_key_violation(seq)

      | where run_failures>fail_p95 OR dns_failures>dns_baseline_p95 OR seq_anomaly=1 | alert'
- question: Does a flow-based machine-learning classifier (for example Random Forest over packet size,
    inter-arrival time, byte volume/ratio, and flow duration) identify mining egress from new EC2 even
    when encrypted, supported by CPU-dynamics models that resist throttling and an unsupervised autoencoder
    over flow statistics for novel egress - and does the alert surface the top-3 contributing features
    (instance-family rarity, AMI novelty, Stratum-heartbeat periodicity, destination reputation) for triage?
  context: 'Signature and threshold methods miss throttled or novel miners, so under Impact apply learned
    models to the new-compute problem. Train a supervised flow classifier (Random Forest) over packet-size,
    inter-arrival-time, byte-volume/ratio, and flow-duration features to detect mining egress even when
    encrypted; complement it with CPU-dynamics models that catch miners which throttle to evade utilization
    thresholds, and an unsupervised autoencoder over flow statistics to catch unlabeled or novel egress
    as reconstruction-error outliers. Critically, the alert must be explainable: surface the top-3 contributing
    features (e.g., instance-family rarity, AMI novelty, Stratum-heartbeat periodicity, destination reputation)
    so analysts can validate quickly. A high model score with corroborating features indicates unauthorized
    compute; explainability ties the score to concrete evidence and reduces wasted triage. Sources: [Crypto-Aegis](https://arxiv.org/abs/1910.09272)
    [CoinPolice](https://arxiv.org/abs/2006.10861) [Kitsune](https://arxiv.org/abs/1802.09089) [SoK Cryptojacking](https://arxiv.org/abs/2103.03851)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Accounts permitted to launch EC2 instances, subnets with internet egress, EC2 fleets handling
    elastic compute, and regions where high-cost or GPU-capable instances are uncommon'
  range: Last 90 days (train on 30-90 days; score continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Flow-based + CPU-dynamics + autoencoder ML for mining egress from new compute

      featurize flow: [pkt_size, inter_arrival_time, byte_volume, byte_ratio, flow_duration]

      | score random_forest(flow_features) -> rf_mining_prob

      | score cpu_dynamics_model(cpu_timeseries) -> throttle_resistant_score

      | score autoencoder(flow_stats) -> recon_error

      | enrich [instance_family_rarity, ami_novelty, stratum_heartbeat_periodicity, dest_reputation]

      | where rf_mining_prob>thr OR throttle_resistant_score>thr OR recon_error>thr

      | emit instanceId, score, shap_top3=[top contributing features]'
- question: Did an existing EC2 instance with a stable workload profile abruptly begin sustained CPU saturation,
    new outbound destination diversity to mining-pool ports/domains, new public exposure, or control-plane
    changes (security-group weakening, IAM role attachment, unexpected reboot followed by abnormal egress)
    - and on the host do you see competitor-killing loops, crontab tampering, or hidden miner binaries
    that maximize stolen CPU?
  context: 'Hijacking is not limited to new launches; adversaries also commandeer existing production,
    bastion, or internet-connected hosts whose compromise yields reusable compute. Under Impact, focus
    on behavior shifts: an instance that historically ran a stable workload suddenly saturates CPU, opens
    connections to many new destinations including pool ports/domains, gains public exposure, or undergoes
    control-plane changes such as security-group weakening, IAM role attachment, or an unexpected reboot
    followed by abnormal egress. On the host, miners often run a competitor-killing loop to evict other
    miners, tamper with crontab for persistence, and hide binaries. A positive result indicates a previously
    trusted host has been repurposed for adversary compute; a negative result reflects expected service
    behavior and planned changes. Sources: [War of Linux Cryptocurrency Miners, Trend Micro](https://www.trendmicro.com/en_us/research/20/i/war-of-linux-cryptocurrency-miners-a-battle-for-resources.html)
    [Hildegard, Unit 42](https://unit42.paloaltonetworks.com/hildegard-malware-teamtnt/) [Falco Default
    Detection Rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Long-running EC2 instances supporting production services, bastion or admin systems with broad
    permissions, and internet-connected workloads whose compromise would expose reusable compute resources'
  range: Last 90 days (compare against the instance's trailing baseline; correlate change + egress)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudwatch OR source=cloudtrail OR source=vpcflowlogs

      | stats avg(CPUUtilization) as cpu dc(dst_ip) as dst_diversity values(eventName) as cp_changes by
      instanceId

      | eval baseline_shift=if(cpu>2*baseline_cpu AND cpu>90,1,0)

      | eval new_pool_egress=if(searchmatch("dstport in (3333,4444,5555,7777,14444)"),1,0)

      | eval risky_change=match(cp_changes,"AuthorizeSecurityGroupIngress|AttachRolePolicy|AssociateIamInstanceProfile")
      OR (reboot=1 AND abnormal_egress=1) OR new_public_ip=1

      | join instanceId [ search source=auditd:execve (competitor_kill_loop=1 OR crontab_modified=1 OR
      hidden_miner=1) ]

      | where baseline_shift=1 OR new_pool_egress=1 OR risky_change | alert'
- question: Is an existing EC2 instance driving an abrupt Cost and Usage Report spend increase through
    prolonged high-resource operation, burstable-credit (T-instance CPU credit) depletion, or repeated
    launches of attached accelerator resources that are inconsistent with the application's change calendar?
  context: 'Hijacked existing hosts often reveal themselves first in the bill: mining runs flat-out, exhausting
    burstable CPU credits, sustaining high-resource operation, or repeatedly attaching accelerators, all
    of which spike cost. Under Impact, raise a high-severity alert when an instance''s CUR spend abruptly
    increases via prolonged high-resource use, burstable-credit depletion, or accelerator launches that
    do not correspond to any entry in the application''s change/deployment calendar. Cross-check spend
    anomalies against approved changes to separate legitimate scaling from abuse. A positive result -
    cost drift with no business justification - is a strong indicator of compute hijacking on a known
    host; a negative result aligns spend with planned activity. Sources: [Leaked Environment Variables,
    Unit 42](https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Long-running EC2 instances supporting production services, bastion or admin systems with broad
    permissions, and internet-connected workloads whose compromise would expose reusable compute resources'
  range: Last 90 days (compare daily/instance spend against change calendar and baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cur earliest=-90d

      | stats sum(cost) as daily_spend avg(cpu_credit_balance) as credit_bal count(eval(match(resource,"(?i)p[0-9]|g[0-9]|inf|trn")))
      as accel_launches by instanceId, _time

      | eventstats avg(daily_spend) as base_spend stdev(daily_spend) as sd_spend by instanceId

      | eval spend_drift=if(daily_spend > base_spend + 3*sd_spend,1,0)

      | eval credit_depleted=if(credit_bal<5 AND prolonged_high_cpu=1,1,0)

      | lookup change_calendar instanceId OUTPUT approved_change

      | where (spend_drift=1 OR credit_depleted=1 OR accel_launches>0) AND isnull(approved_change)

      | eval severity="high" | alert'
- question: When each instance's recent CPU, network, runtime, and spend metrics are compared to its own
    trailing baseline and to peers in the same auto-scaling group or application tier, are there hosts
    whose utilization persistence (stationary high CPU, low variance), egress entropy, or cost contribution
    materially diverges from expected service behavior?
  context: 'A precise way to find a repurposed host is to measure how far it has drifted from both its
    own history and its peers doing the same job. Under Impact, compare each instance''s recent CPU, network,
    runtime, and spend to its trailing baseline and to peers in the same auto-scaling group or application
    tier. Flag hosts whose utilization persistence is anomalously stationary and high with low variance
    (treat sustained low-variance high CPU as mining-like rather than a legitimate burst, which is spikier),
    whose outbound destination entropy has grown, or whose cost contribution has diverged from cohort
    norms. A positive result is a host behaving unlike itself and its peers, consistent with hijacked
    compute; a negative result indicates the host tracks its cohort and is likely operating normally.
    Sources: [Detecting Covert Cryptomining using HPC](https://arxiv.org/abs/1909.00268) [Crypto-Aegis](https://arxiv.org/abs/1910.09272)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Long-running EC2 instances supporting production services, bastion or admin systems with broad
    permissions, and internet-connected workloads whose compromise would expose reusable compute resources'
  range: Last 90 days (baseline 30-90 days; evaluate per instance vs peer cohort)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudwatch OR source=vpcflowlogs OR source=cur earliest=-90d

      | stats avg(CPUUtilization) as cpu stdev(CPUUtilization) as cpu_var dc(dst_ip) as egress_entropy
      sum(cost) as spend avg(runtime) as runtime by instanceId, asg_id, app_tier

      | eventstats median(cpu) as peer_cpu median(spend) as peer_spend `mad(cpu)` as cpu_mad by asg_id

      | eval util_persistence=if(cpu>90 AND cpu_var<5,1,0)

      | eval mz_cpu=0.6745*(cpu-peer_cpu)/cpu_mad

      | eval mz_spend=0.6745*(spend-peer_spend)/`mad(spend)`

      | where util_persistence=1 OR abs(mz_cpu)>3.5 OR abs(mz_spend)>3.5 OR egress_entropy>peer_entropy_p95

      | table instanceId cpu spend egress_entropy | alert'
- question: For a given EC2 instance, are per-instance error/failure rates spiking - blocked outbound
    connections, NXDOMAIN/DoH resolution failures to pool domains, and failed or AccessDenied control-plane
    calls made by the instance role - in a way that often accompanies hijack attempts and scanning?
  context: 'Beyond utilization, failure rates are an independent and revealing signal of a compromised
    host. Under Impact, profile each instance''s error/failure rates as distinct signals: spikes in blocked
    outbound connections (egress controls denying mining traffic), NXDOMAIN or DoH resolution failures
    against pool domains (the miner trying to reach pools), and failed/AccessDenied control-plane calls
    made using the instance''s IAM role (the attacker probing what the role can do). These failure bursts
    frequently accompany hijack attempts, lateral scanning, and credential probing. A positive result
    - an instance suddenly generating clusters of these failures - warrants investigation as a possibly
    hijacked host; a negative result indicates the instance is operating within normal, well-scoped patterns.
    Sources: [SoK Cryptojacking](https://arxiv.org/abs/2103.03851) [Compromised Cloud Compute Credentials,
    Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Long-running EC2 instances supporting production services, bastion or admin systems with broad
    permissions, and internet-connected workloads whose compromise would expose reusable compute resources'
  range: Last 90 days (alert on per-instance failure bursts; baseline 30-90 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=vpcflowlogs OR source=cloudtrail earliest=-90d

      | eval blocked_out=if(action="REJECT" AND direction="egress",1,0)

      | eval dns_fail=if(rcode="NXDOMAIN" OR doh_fail=1,1,0)

      | eval cp_denied=if(errorCode="*AccessDenied*" AND userIdentity.type="AssumedRole" AND instance_role=1,1,0)

      | bin _time span=10m

      | stats sum(blocked_out) as blocks sum(dns_fail) as dns_failures sum(cp_denied) as denials by instanceId,
      _time

      | eventstats p95(blocks) as b95 p95(dns_failures) as d95 p95(denials) as ad95 by instanceId

      | where blocks>b95 OR dns_failures>d95 OR denials>ad95 | alert'
- question: Do unsupervised time-series/autoencoder and clustering models over instance metrics, flow
    patterns, and billing features - plus LSTM log-sequence scoring of the instance's CloudTrail activity
    - detect workload shifts consistent with hijacked compute (persistent utilization plateaus, non-business-hour
    activation, new destination communities, divergence from prior host cohorts), with the top-3 contributing
    features listed in the alert?
  context: 'To catch subtle or novel repurposing, under Impact apply learned models across the instance''s
    full behavioral footprint. Use unsupervised time-series/autoencoder methods and clustering over instance
    metrics (CPU, network), flow patterns, and billing features to surface workload shifts: persistent
    utilization plateaus, activation during non-business hours, the emergence of new outbound destination
    communities, and divergence from the host''s prior cohort. Add an LSTM log-sequence model (DeepLog-style)
    over the instance''s CloudTrail activity to flag improbable control-plane sequences. Every alert must
    list the top-3 contributing features so analysts can validate the score against concrete evidence.
    A high anomaly score with corroborating features indicates a host whose behavior has shifted toward
    adversary-controlled compute; explainability keeps triage efficient and defensible. Sources: [Kitsune](https://arxiv.org/abs/1802.09089)
    [CoinPolice](https://arxiv.org/abs/2006.10861) [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)'
  answer_sources:
  - AWS CloudTrail management events
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: Long-running EC2 instances supporting production services, bastion or admin systems with broad
    permissions, and internet-connected workloads whose compromise would expose reusable compute resources'
  range: Last 90 days (train on 30-90 days; score per instance/session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Unsupervised time-series/autoencoder + clustering + LSTM log-sequence for repurposed hosts

      featurize instance: [cpu_ts, net_ts, flow_communities, billing_features, activation_hour]

      | score autoencoder(instance_features) -> recon_error

      | cluster instances -> cohort; eval cohort_divergence=distance(instance, prior_cohort)

      | flag plateau=persistent_utilization_plateau(cpu_ts), offhours=nonbusiness_hour_activation(activation_hour),
      newcomm=new_destination_community(flow_communities)

      | score deeplog_lstm(cloudtrail_sequence by instanceId) -> seq_anomaly

      | where recon_error>thr OR cohort_divergence>thr OR plateau OR offhours OR newcomm OR seq_anomaly=1

      | emit instanceId, score, top3=[top contributing features]'
