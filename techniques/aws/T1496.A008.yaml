name: 'T1496.A008: Compute Hijacking - EC2 Use'
id: 2d44824c-c9ef-4a4e-a09c-872b948d5b3a
description: 'Investigate whether an adversary has hijacked Amazon EC2 capacity for unauthorized, compute-intensive
  activity such as cryptocurrency mining, botnet operation, or large-scale task execution under the Impact
  tactic. This playbook helps an analyst determine two complementary scenarios: (1) newly launched or
  recently modified EC2 instances stood up with unusual/expensive instance families, unapproved AMIs,
  user-data scripts, IAM instance profiles, or outbound destinations inconsistent with the account''s
  expected workloads that quickly begin sustained high-utilization processing or mining-pool communications;
  and (2) existing EC2 infrastructure repurposed for adversary-controlled compute, evidenced by abrupt
  shifts in utilization, outbound communications, IAM attachments, security-group exposure, or cost. It
  correlates CloudTrail control-plane events (RunInstances, launch-template/instance-profile changes,
  security-group and IAM modifications, monitoring tampering, service-quota requests) with VPC Flow Logs
  (Stratum mining-pool ports and heartbeat periodicity, DoH egress), CloudWatch utilization metrics, GuardDuty
  findings, Cost and Usage Report spend, and host/container telemetry (auditd, Sysmon, Falco) for known
  miner artifacts and evasion. Methods span symbolic-logic detections, statistical baselining of compute/cost/failure-rate
  outliers and flow periodicity, and machine-learning flow/CPU/log-sequence models with explainable top-feature
  output to give the SOC granular, defensible coverage of EC2 compute hijacking.'
type: technique
