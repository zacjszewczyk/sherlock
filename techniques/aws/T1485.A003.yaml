name: 'T1485.A003: S3 Object and Bucket Deletion'
id: 0b8345eb-d201-4aed-b575-7383c4290252
description: Investigate whether an adversary has caused impact in AWS by deleting Amazon S3 objects,
  object versions, or entire buckets in a way that destroys recoverable data or disrupts business operations.
  This playbook helps a SOC analyst determine if a principal performed bulk DeleteObject/DeleteObjects/DeleteBucket/DeleteObjectVersion
  operations against production, backup, logging, or evidentiary buckets outside approved retention, lifecycle,
  or decommission workflows -- particularly after weakening recovery controls such as bucket versioning,
  object-lock retention, legal holds, or replication. It correlates CloudTrail management and S3 data
  events, S3 server access logs, AWS Config configuration history, CloudWatch metrics, application logs,
  and GuardDuty findings to surface the destruction chain (protection rollback -> deletion), lifecycle-policy
  weaponization, attacker tooling fingerprints, deletion-volume surges, first-seen destructive APIs, permission-probing
  failures, and the downstream operational impact of missing objects (NoSuchKey/NoSuchBucket, failed restores,
  broken services). Methods span symbolic-logic detections, statistical baselining, and machine-learning
  anomaly models so the analyst gets granular, defensible coverage of S3 data-destruction activity and
  its recoverability consequences.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: When a principal issued CloudTrail DeleteObject, DeleteObjects, DeleteBucket, or DeleteObjectVersion
    calls against a high-value S3 bucket, was that deletion preceded within the prior 24 hours by reconnaissance
    or protection-weakening actions (ListBucket, GetBucketVersioning, PutBucketVersioning, object-lock
    changes, or lifecycle-policy edits) by the same identity?
  context: 'In the Impact tactic, deliberate S3 destruction rarely happens in isolation -- an adversary
    first enumerates and then dismantles recovery controls before deleting. Correlating the actual Delete*
    events with a preceding chain of ListBucket/GetBucketVersioning/PutBucketVersioning/object-lock/lifecycle
    edits by the same principal within 24 hours separates a malicious destruction chain from routine single
    deletes. Map each eventName to first-party telemetry per the AWS Threat Technique Catalog for T1485.
    A positive result (delete that follows protection changes against a critical bucket) is a strong destruction
    indicator; a negative result (isolated delete with no preparatory activity) favors normal object lifecycle
    management. References: [Threat Technique Catalog for AWS T1485](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days (alert on delete events; pivot 24 hours before each delete)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nsource=cloudtrail eventSource=\"s3.amazonaws.com\"\n| where eventName in (\"DeleteObject\"\
      ,\"DeleteObjects\",\"DeleteBucket\",\"DeleteObjectVersion\")\n  and bucketName in (CRITICAL_BUCKETS)\n\
      | join type=left userIdentity.arn, bucketName [ search source=cloudtrail\n    eventName in (\"ListBucket\"\
      ,\"GetBucketVersioning\",\"PutBucketVersioning\",\n    \"PutObjectLockConfiguration\",\"PutObjectRetention\"\
      ,\"PutBucketLifecycleConfiguration\")\n    earliest=-24h ]\n| where isnotnull(prep_event)\n| alert\
      \ severity=high"
- question: Did any principal create or modify an S3 bucket lifecycle configuration (PutBucketLifecycleConfiguration)
    that introduced a short Expiration (Days <= 7) or an ExpiredObjectDeleteMarker rule on a production
    or backup bucket, effectively weaponizing AWS to delete data without issuing per-object Delete calls?
  context: 'For the Impact tactic, an adversary can destroy data without ever calling DeleteObject by
    abusing S3 lifecycle expiration -- AWS itself deletes the objects on schedule, leaving few direct
    delete events. A new short-horizon Expiration or ExpiredObjectDeleteMarker rule on critical/backup
    data is therefore high severity. Baseline benign retention (long durations, prefix-scoped) per AWS
    lifecycle guidance, and treat SSE-C-encrypt-then-expire chains as ransomware (Halcyon Codefinger).
    A positive result is a lifecycle policy that will silently purge business data; a negative result
    is a long, prefix-scoped retention rule consistent with cost management. References: [Managing the
    Lifecycle of Objects, AWS](https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html)
    [Halcyon Codefinger](https://www.halcyon.ai/blog/abusing-aws-native-services-ransomware-encrypting-s3-buckets-with-sse-c)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      source=cloudtrail eventName="PutBucketLifecycleConfiguration"

      | spath requestParameters.LifecycleConfiguration.Rule{} as rules

      | where rule.Expiration.Days <= 7 OR rule.Expiration.ExpiredObjectDeleteMarker == true

      | where bucketName in (PRODUCTION_BUCKETS, BACKUP_BUCKETS)

      | eval ransomware_chain=if(match(prior_events,"SSE-C"),1,0)

      | alert severity=high'
- question: Did a principal first roll back S3 recovery protections -- suspending versioning (PutBucketVersioning
    Status=Suspended), removing object-lock retention or legal hold (PutObjectLockConfiguration / PutObjectRetention),
    deleting with BypassGovernanceRetention=true, or altering replication -- and then begin deleting objects
    or versions from that bucket or its replicated partner?
  context: 'In the Impact tactic, the protections that make S3 recoverable (versioning, object lock, legal
    holds, replication) are exactly what an adversary must disable to ensure deletions are permanent.
    Detecting the ordered sequence of protection rollback followed by deletion on the same bucket (or
    its replication partner) is one of the most reliable destruction signatures. These APIs and their
    recovery role are defined in AWS Object Lock/Versioning docs. A positive result is suppression-then-delete
    -- treat as confirmed destructive intent; a negative result is a delete on a bucket whose protections
    were never weakened. References: [Using S3 Object Lock/Versioning, AWS](https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days (correlate rollback then delete within 72 hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nsource=cloudtrail eventSource=\"s3.amazonaws.com\"\n| where eventName in (\"PutBucketVersioning\"\
      ,\"PutObjectLockConfiguration\",\n    \"PutObjectRetention\",\"PutBucketReplication\")\n  and (requestParameters.Status=\"\
      Suspended\" or requestParameters.BypassGovernanceRetention=true\n       or retention_removed=true)\n\
      | join type=inner userIdentity.arn, bucketName [ search source=cloudtrail\n    eventName in (\"\
      DeleteObject\",\"DeleteObjects\",\"DeleteObjectVersion\",\"DeleteBucket\")\n    latest=+72h ]\n\
      | alert severity=high"
- question: Do any destructive S3 events (DeleteObject/DeleteObjects/DeleteBucket/DeleteObjectVersion)
    carry a userAgent that matches known offensive or emulation tooling, such as the S3 Browser GUI or
    stratus-red-team_* attack-emulation signatures?
  context: 'In the Impact tactic, credentialed-but-anomalous deletions are hard to separate from admin
    activity on volume alone, so the userAgent string adds precision. Destructive operations executed
    via S3 Browser (a GUI commonly used by attackers per the SigmaHQ rule) or via stratus-red-team emulation
    are far less likely to be legitimate automation, which usually uses the AWS SDK/CLI or known pipelines.
    A positive result is a destructive call with an offensive-tool user agent -- escalate; a negative
    result (standard SDK/CLI agent) does not exonerate but lowers this specific signal. References: [SigmaHQ
    S3Browser rule](https://detection.fyi/sigmahq/sigma/cloud/aws/cloudtrail/aws_iam_s3browser_user_or_accesskey_creation/)
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      source=cloudtrail eventSource="s3.amazonaws.com"

      | where eventName in ("DeleteObject","DeleteObjects","DeleteBucket","DeleteObjectVersion")

      | where match(userAgent, "(?i)s3browser|stratus-red-team")

      | table _time userIdentity.arn sourceIPAddress userAgent bucketName eventName

      | alert severity=high'
- question: Has any bucket or principal experienced a deletion surge -- abnormally high object deletions,
    version removals, an elevated delete-to-write (PutObject) ratio, large delete bursts per five-minute
    interval, or unusual hour-of-day deletion -- that exceeds the trailing 95th-percentile baseline or
    spreads across multiple buckets and critical prefixes?
  context: 'For the Impact tactic, mass deletion is fundamentally a volume-and-frequency anomaly. Baselining
    per-bucket and per-principal deletion counts, version removals, delete-to-write ratio, five-minute
    delete bursts, and hour-of-day patterns lets the analyst flag spikes, critical-prefix concentration,
    or multi-bucket spread above the trailing 95th percentile -- the same signals catalogued for AWS T1485.
    A high delete-to-write ratio is especially telling because legitimate workloads write far more than
    they delete. A positive result is a statistically anomalous deletion burst; a negative result is deletion
    volume within normal operational variance. References: [Threat Technique Catalog for AWS T1485](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days (baseline trailing 30-90 days; evaluate 5-minute and hourly windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=cloudtrail eventSource="s3.amazonaws.com"

      | where eventName in ("DeleteObject","DeleteObjects","DeleteObjectVersion")

      | bin _time span=5m

      | stats count as deletes dc(bucketName) as buckets by userIdentity.arn, _time

      | eventstats avg(deletes) as mu perc95(deletes) as p95 by userIdentity.arn

      | eval delete_to_write=deletes/(writes+1)

      | where deletes > p95 OR buckets > 1 OR delete_to_write > 2

      | alert'
- question: Was this the first-ever time a given principal invoked a destructive or destruction-enabling
    S3 API (for example its first DeleteBucket, DeleteObjects, or PutBucketLifecycleConfiguration) within
    the lookback window?
  context: 'In the Impact tactic, a compromised or misused identity often performs an action it has never
    performed before. Per-principal first-seen baselining of CloudTrail actions flags the first-ever DeleteBucket/DeleteObjects/PutBucketLifecycleConfiguration
    by an identity, following the Athena approach of the Netflix CloudTrail Anomaly Detector. This catches
    privilege misuse even when volume is low (a single DeleteBucket can be catastrophic). A positive result
    is a never-before-seen destructive API for that principal -- investigate intent and authorization;
    a negative result is an action consistent with the identity''s historical behavior. References: [Netflix
    CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days (compare against trailing 90-day per-principal action history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=cloudtrail eventSource="s3.amazonaws.com"

      | where eventName in ("DeleteBucket","DeleteObjects","PutBucketLifecycleConfiguration")

      | stats earliest(_time) as first_seen by userIdentity.arn, eventName

      | where first_seen >= relative_time(now(), "-1d")

      | alert'
- question: Did a principal generate a burst of AccessDenied or other failure responses on S3 Delete,
    lifecycle, or versioning attempts -- and then succeed -- indicating permission probing that precedes
    destruction?
  context: 'For the Impact tactic, an adversary operating with imperfect knowledge of its permissions
    will often probe before destroying, producing a cluster of denied Delete/lifecycle/versioning attempts
    followed by a successful one. Profiling AccessDenied and other failure responses as a distinct signal
    (not just success-based rules) catches this reconnaissance-of-permissions phase, an explicit failure-mode
    complement per the AWS T1485 catalog. A positive result is a denied-then-succeeded destructive sequence
    by the same principal -- high suspicion; a negative result is isolated denials with no eventual success
    (likely misconfiguration). References: [Threat Technique Catalog for AWS T1485](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days (correlate failures then success within 24 hours)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nsource=cloudtrail eventSource=\"s3.amazonaws.com\"\n| where eventName in (\"DeleteObject\"\
      ,\"DeleteObjects\",\"DeleteBucket\",\n    \"PutBucketLifecycleConfiguration\",\"PutBucketVersioning\"\
      )\n| eval denied=if(errorCode=\"AccessDenied\",1,0)\n| bin _time span=1h\n| stats sum(denied) as\
      \ denials sum(eval(isnull(errorCode))) as successes by userIdentity.arn, _time\n| where denials\
      \ >= 5 AND successes >= 1\n| alert"
- question: Does an unsupervised anomaly model scoring per-principal/per-bucket feature vectors (deletes
    per minute, delete-to-write ratio, distinct buckets/prefixes, failure rate, principal novelty) flag
    a principal acting outside its normal behavioral community, with the top contributing features surfaced
    for the analyst?
  context: 'In the Impact tactic, multivariate destruction patterns can evade single-threshold rules.
    An Extended Isolation Forest over engineered features (deletes/min, delete-to-write ratio, distinct
    buckets/prefixes, failure rate, principal novelty), combined with a tripartite user-service-activity
    GNN (CS-GAD) to detect principals acting outside their normal community, captures subtle anomalies.
    SHAP surfaces the top-3 contributing features in the alert so the analyst understands why it fired;
    validate against Stratus Red Team telemetry. A positive result is a high anomaly score with explanatory
    features (e.g., high delete-to-write + novel buckets); a negative result is a vector well within the
    learned normal manifold. References: [Extended Isolation Forest](https://arxiv.org/abs/1811.02141)
    [CS-GAD](https://arxiv.org/html/2409.12726v1) [SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days (retrain weekly; score continuously)
  queries:
  - technology: ML/pseudocode
    query: ">-\nfeatures = per_principal_bucket_window(\n    deletes_per_min, delete_to_write_ratio, distinct_buckets,\
      \ distinct_prefixes,\n    failure_rate, principal_novelty)\nmodel = ExtendedIsolationForest().fit(baseline_features)\n\
      score = model.anomaly_score(features)\ncommunity = CS_GAD_GNN(user, service, activity).out_of_community(principal)\n\
      if score > threshold or community:\n    explain = SHAP(model, features).top(3)\n    alert(principal,\
      \ score, explain)"
- question: Has Amazon GuardDuty raised an Impact:S3/AnomalousBehavior.Delete or related S3-protection
    finding indicating mass deletes that deviate from a principal's learned baseline, and does it corroborate
    the symbolic rollback or lifecycle rules above?
  context: 'For the Impact tactic, GuardDuty provides a managed-ML layer over S3 data events that learns
    each principal''s baseline and flags anomalous deletion behavior. Ingesting Impact:S3/AnomalousBehavior.Delete
    and related S3-protection findings gives the SOC an independent corroborator that can be fused with
    the symbolic protection-rollback and lifecycle rules. A positive result is a GuardDuty S3 delete-anomaly
    finding that aligns with a destruction chain -- strong confirmation; a negative result means no managed-ML
    anomaly, though absence of a finding does not rule out targeted destruction. References: [GuardDuty
    S3 Protection finding types, AWS](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-s3.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - AWS Config configuration history
  - Amazon GuardDuty findings
  - 'NAI: Critical S3 buckets containing production data, logs, backups, or legal records, S3 data-event
    logging for delete activity, and bucket-configuration timelines for versioning and object-lock changes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nsource=guardduty\n| where type LIKE \"Impact:S3/AnomalousBehavior%\" OR type LIKE \"%S3/AnomalousBehavior.Delete%\"\
      \n| join userIdentity.arn [ search source=cloudtrail eventName IN\n    (\"DeleteObjects\",\"DeleteBucket\"\
      ,\"PutBucketVersioning\",\"PutObjectLockConfiguration\") ]\n| alert severity=high"
- question: Was recent S3 object/bucket deletion or lifecycle expiration followed within a short response
    window by missing-object failures -- NoSuchKey or NoSuchBucket responses, failed restore attempts,
    application 5xx errors, or broken content delivery -- tied to the same buckets or prefixes?
  context: 'In the Impact tactic, the proof of disruption is downstream: applications and pipelines that
    depend on deleted objects start failing. Correlating recent deletions or lifecycle expirations with
    NoSuchKey/NoSuchBucket errors, failed restores, 5xx responses, or broken CDN delivery for the same
    buckets/prefixes confirms real operational impact rather than benign cleanup. Note that lifecycle-driven
    loss can appear without any per-object Delete events, so application failures may be the first visible
    symptom. A positive result is deletion linked to a spike of missing-object failures on the same resource;
    a negative result is deletion with no downstream errors (objects were genuinely unused). References:
    [Managing the Lifecycle of Objects, AWS](https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 server access logs
  - Amazon CloudWatch metrics
  - Application logs
  - AWS Config configuration history
  - 'NAI: Applications and workflows dependent on S3-hosted objects, recovery repositories for backups
    and logs, and monitoring systems that surface missing-object errors after destructive activity'
  range: Last 90 days (correlate deletion then failures within 6 hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nsource=cloudtrail eventName IN (\"DeleteObject\",\"DeleteObjects\",\"DeleteBucket\")\n\
      \  OR (eventName=\"PutBucketLifecycleConfiguration\")\n| join type=inner bucketName [ search (source=s3_access_log\
      \ OR source=app_log)\n    (status=404 OR error IN (\"NoSuchKey\",\"NoSuchBucket\") OR http_status>=500)\n\
      \    earliest=0 latest=+6h ]\n| stats count by bucketName, prefix, userIdentity.arn\n| alert"
- question: After destruction in a backup or logging bucket, did recovery workflows fail -- failed recovery
    jobs, replication-lag alarms, or restore operations that cannot locate expected object versions --
    especially where object-lock retention or versioning had been removed first?
  context: 'For the Impact tactic, the most damaging outcome is irrecoverability. When destruction hits
    a backup/logging bucket and is followed by failed recovery jobs, replication-lag alarms, or restores
    that cannot find expected object versions, the recovery path has collapsed -- particularly if object-lock
    or versioning was removed beforehand (the very controls AWS provides for recovery). A positive result
    is destruction in a recovery repository plus failed restores -- treat as a recovery-path compromise
    and escalate to IR; a negative result is successful recovery, indicating protections held. References:
    [Using S3 Object Lock/Versioning, AWS](https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 server access logs
  - Amazon CloudWatch metrics
  - Application logs
  - AWS Config configuration history
  - 'NAI: Applications and workflows dependent on S3-hosted objects, recovery repositories for backups
    and logs, and monitoring systems that surface missing-object errors after destructive activity'
  range: Last 90 days (pivot from deletion to subsequent recovery jobs)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nsource=cloudtrail eventName IN (\"DeleteObject\",\"DeleteObjects\",\"DeleteObjectVersion\"\
      ,\"DeleteBucket\")\n  and bucketName in (BACKUP_BUCKETS, LOGGING_BUCKETS)\n| join type=inner bucketName\
      \ [ search (source=backup_jobs OR source=cloudwatch)\n    (job_status=\"FAILED\" OR metric=\"ReplicationLatency\"\
      \ OR error=\"version not found\") ]\n| where prior_protection_removed=true\n| alert severity=high"
- question: For each critical bucket, has the count of expected live object versions, locked objects,
    or restore-ready recovery points dropped abruptly, or have missing-object retrieval errors (NoSuchKey/NoSuchBucket)
    spiked beyond the trailing baseline?
  context: 'In the Impact tactic, recoverability itself can be measured and trended. Tracking expected
    live object versions, locked objects, restore-ready recovery points, and missing-object error volume
    per critical bucket lets the analyst flag abrupt drops in recoverable content or spikes in retrieval
    failures beyond the trailing baseline -- profiling these failure states as distinct signals per the
    AWS T1485 catalog. A positive result is a sharp decline in recoverable content or surge in NoSuchKey/NoSuchBucket
    errors; a negative result is stable recovery-point counts and normal error rates. References: [Threat
    Technique Catalog for AWS T1485](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 server access logs
  - Amazon CloudWatch metrics
  - Application logs
  - AWS Config configuration history
  - 'NAI: Applications and workflows dependent on S3-hosted objects, recovery repositories for backups
    and logs, and monitoring systems that surface missing-object errors after destructive activity'
  range: Last 90 days (daily trend with trailing baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nsource=cloudwatch (metric=\"NumberOfObjects\" OR metric=\"BucketSizeBytes\")\n  OR source=s3_access_log\n\
      | bin _time span=1h\n| stats latest(NumberOfObjects) as live_objects sum(eval(error IN\n    (\"\
      NoSuchKey\",\"NoSuchBucket\"))) as missing_errors by bucketName, _time\n| eventstats avg(live_objects)\
      \ as base_obj stdev(live_objects) as sd_obj\n    perc95(missing_errors) as p95_err by bucketName\n\
      | where live_objects < base_obj-3*sd_obj OR missing_errors > p95_err\n| alert"
- question: Did retrieval or restore failure rates and 404/NoSuchKey volume per bucket burst above the
    95th percentile, in a way that is distinguishable from normal cache-miss noise and correlates with
    first-seen destructive actions?
  context: 'For the Impact tactic, a destruction event produces a characteristic burst of retrieval/restore
    failures that exceeds ordinary cache-miss noise. Baselining failure rates and 404/NoSuchKey volume
    per bucket and alerting on 95th-percentile bursts -- then correlating with first-seen destructive
    actions from the Netflix CloudTrail Anomaly Detector -- distinguishes destruction-driven failure from
    benign misses. A positive result is a failure burst coinciding with novel destructive API use; a negative
    result is failure volume within normal variance attributable to caching behavior. References: [Netflix
    CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 server access logs
  - Amazon CloudWatch metrics
  - Application logs
  - AWS Config configuration history
  - 'NAI: Applications and workflows dependent on S3-hosted objects, recovery repositories for backups
    and logs, and monitoring systems that surface missing-object errors after destructive activity'
  range: Last 90 days (5-95th percentile baseline; correlate with destructive events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=s3_access_log

      | eval fail=if(status IN (404) OR error IN ("NoSuchKey"),1,0)

      | bin _time span=5m

      | stats sum(fail) as failures count as total by bucketName, _time

      | eval fail_rate=failures/total

      | eventstats perc95(failures) as p95 by bucketName

      | where failures > p95

      | join bucketName [ search source=cloudtrail first_seen_destructive=true ]

      | alert'
- question: Does an unsupervised cross-source anomaly model -- fusing S3 delete/lifecycle events, recovery
    telemetry, and application failures -- score a campaign highly when there is broad prefix impact,
    restoration failure, and concurrent protection suppression, with the top contributing features explained?
  context: 'In the Impact tactic, the strongest evidence of a destructive campaign is the convergence
    of destruction, recovery failure, and protection suppression across data sources. An Extended Isolation
    Forest scoring fused S3 delete/lifecycle events, recovery telemetry, and application failures elevates
    scores on broad prefix impact, restoration failure, and concurrent protection suppression, and emits
    the top-3 SHAP features so analysts see why the campaign was flagged. A positive result is a high
    cross-source anomaly score with explanatory features indicating impact plus suppression; a negative
    result is a low fused score where signals do not co-occur. References: [Extended Isolation Forest](https://arxiv.org/abs/1811.02141)
    [SHAP in IDS review](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 server access logs
  - Amazon CloudWatch metrics
  - Application logs
  - AWS Config configuration history
  - 'NAI: Applications and workflows dependent on S3-hosted objects, recovery repositories for backups
    and logs, and monitoring systems that surface missing-object errors after destructive activity'
  range: Last 90 days (retrain weekly; score continuously)
  queries:
  - technology: ML/pseudocode
    query: ">-\nfused = join(s3_delete_lifecycle_events, recovery_telemetry, app_failures)\nfeatures =\
      \ per_bucket_window(prefix_breadth, restore_failure_rate,\n    protection_suppression_flag, delete_volume,\
      \ missing_object_errors)\nmodel = ExtendedIsolationForest().fit(baseline_fused)\nscore = model.anomaly_score(features)\n\
      if score > threshold:\n    explain = SHAP(model, features).top(3)\n    alert(bucket, score, explain)"
- question: Has GuardDuty produced Impact:S3/AnomalousBehavior.Delete or exfiltration findings that corroborate
    a destructive S3 campaign by surfacing post-deletion impact relative to learned baselines?
  context: 'For the Impact tactic, GuardDuty''s managed ML can independently confirm that the post-deletion
    state deviates from a principal''s learned baseline. Treating Impact:S3/AnomalousBehavior.Delete and
    S3 exfiltration findings as a corroborator of destructive campaigns helps validate the downstream-impact
    signals from other rules. A positive result is a GuardDuty finding aligned with observed deletion-plus-impact
    -- strong confirmation; a negative result means no managed-ML corroboration, though it does not exclude
    targeted destruction. References: [GuardDuty S3 Protection finding types, AWS](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-s3.html)'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon S3 server access logs
