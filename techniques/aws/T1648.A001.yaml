name: 'T1648.A001: Invoking Lambda Function'
id: 84389904-0800-4d1d-84a1-5fbf064e2f19
description: Investigate whether an adversary with sufficient AWS permissions has abused the ability to
  invoke an existing Lambda function to run code for discovery, data exfiltration, persistence, or privilege
  escalation. This playbook helps an analyst determine (1) whether a principal invoked a Lambda function
  outside its normal operational pattern — targeting rarely used, privileged, or administrative functions,
  originating from a new source context, or immediately followed by discovery, privilege-relevant, or
  data-access activity performed by the function's execution role; and (2) whether a Lambda function's
  runtime behavior is inconsistent with its intended purpose, such as first-time outbound connections,
  unusual access to secrets or data stores, invocation bursts aligned with reconnaissance or credential
  use, or execution logs showing command-like tasking and collection behavior. It combines symbolic-logic
  detections (execution-role privileged operations, first-seen caller/function/action, AccessDenied probing
  bursts, runtime drift, first-seen downstream service/egress), statistical baselining (modified Z-score
  / Seasonal Hybrid ESD on invocation, execution, and egress profiles; Markov sequence modeling; command-like
  log bursts), and machine-learning approaches (rare-population analysis, identity/cross-service graph
  anomaly detection, LSTM log-sequence modeling) to surface abuse of Lambda invocation across the Execution
  tactic.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
