name: 'T1496.A009: Compute Hijacking - WorkSpaces'
id: 52fcb1cb-4eeb-4be1-af1d-f124f92dd3ec
description: Investigate whether an adversary has created unauthorized Amazon WorkSpaces or hijacked existing
  virtual desktops to abuse their compute resources for illicit activity such as cryptomining, staging,
  or other adversary-controlled operations. This playbook helps an analyst determine if WorkSpaces are
  provisioned, rebuilt, restored, or reassigned outside normal workforce onboarding and support processes
  and then exhibit network or usage patterns inconsistent with employee productivity, and whether established
  WorkSpaces have drifted from interactive end-user roles toward sustained, server-like, automated compute
  use. It correlates AWS CloudTrail WorkSpaces lifecycle events, WorkSpaces access/connection logs, VPC
  Flow Logs, CloudWatch desktop metrics, GuardDuty findings, and Cost and Usage Reports to surface unexpected
  provisioning by rare principals, high-cost bundle repurposing, permission-probing AccessDenied bursts,
  mining-pool/Stratum egress and miner-binary IOCs, and sustained CPU/cost/egress anomalies. Methods span
  symbolic-logic detections, statistical baselining (modified Z-score/MAD, first-seen, DNS entropy), and
  machine-learning models (unsupervised CloudTrail rare-function analysis, supervised VPC Flow Log classifiers,
  ARIMA/LSTM residual scoring) to give the SOC granular, defensible coverage of WorkSpaces compute hijacking.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any IAM principal invoke Amazon WorkSpaces lifecycle APIs such as CreateWorkspaces, RebuildWorkspaces,
    RestoreWorkspace, ModifyWorkspaceProperties, or directory/bundle changes when that principal has never
    performed those actions before, outside approved provisioning windows, or in volumes that do not match
    actual hiring or support activity?
  context: 'Under the Impact tactic, an adversary who has stolen cloud credentials will often stand up
    new compute by creating or rebuilding WorkSpaces, mirroring stolen-credential compute-creation sequences
    seen in cloud incidents. Search AWS CloudTrail management events for eventSource=workspaces.amazonaws.com
    and the lifecycle API calls, then flag any issued by a principal/role with no prior history of them,
    executed off-hours, or in counts inconsistent with onboarding/support tempo. Enrich every alert with
    the principal/role ARN, sourceIPAddress and its ASN, userAgent, region, and the call count so triage
    can quickly judge intent. A positive result indicates a likely compromised identity provisioning desktops
    as adversary compute; a negative result reflects routine, expected administrative provisioning. Validate
    this logic against labeled detonations (Stratus Red Team). Sources: [Compromised Cloud Compute Credentials,
    Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/); [Finding Evil
    in AWS, Expel](https://expel.com/blog/finding-evil-in-aws/); [Stratus Red Team, DataDog](https://github.com/DataDog/stratus-red-team).'
  answer_sources:
  - AWS CloudTrail management events (workspaces.amazonaws.com)
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - AWS Cost and Usage Report
  - 'NAI: WorkSpaces directories, provisioning workflows for virtual desktops, internet-egress paths from
    desktop subnets, and business units where WorkSpaces creation is rare or tightly controlled'
  range: Last 90 days (alert on first-ever use; pivot 24h around the event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="workspaces.amazonaws.com"

      | where eventName in ("CreateWorkspaces","RebuildWorkspaces","RestoreWorkspace","ModifyWorkspaceProperties","CreateWorkspaceBundle","RegisterWorkspaceDirectory")

      | stats earliest(_time) as first count as n values(eventName) as actions by userIdentity.arn, sourceIPAddress,
      userAgent, awsRegion

      | eval first_seen = lookup_principal_history(userIdentity.arn, eventName)

      | where first_seen==1 OR off_hours(_time)==1 OR n > onboarding_baseline(awsRegion)

      | enrich asn(sourceIPAddress)

      | alert'
- question: Did a newly provisioned or rebuilt WorkSpace use an unusually expensive high-vCPU or GPU bundle,
    gain new public egress paths or modified security groups, AND immediately begin sustained outbound
    traffic, off-hours access, or always-on runtime inconsistent with employee use, particularly egress
    to canonical Stratum mining ports or stratum+tcp/stratum+ssl strings, or destinations and process
    hashes matching known miner IOCs?
  context: 'In the Impact tactic, repurposing a desktop for cryptomining typically combines an oversized
    bundle (to maximize hashing) with widened egress and continuous, automated runtime. Raise a high-severity,
    deterministic alert when a new or rebuilt WorkSpace selects a high-cost bundle, gains public egress
    or altered security groups, and immediately shows sustained outbound flows. Treat VPC Flow Log or
    in-guest connections to canonical Stratum ports (3333, 4444, 5555, 7777, 14444, 45700), stratum+tcp://
    or stratum+ssl:// strings, or destination IPs/domains/process hashes matching mining pools and miner
    binaries (xmrig, cpuminer, kdevtmpfsi, kinsing) as a hard match. A positive result is strong evidence
    of compute hijacking; a negative result indicates the new desktop is being used for normal interactive
    work. Sources: [Cryptomining Makes Noise, Caprolu et al.](https://arxiv.org/abs/1910.09272); [SoK
    Cryptojacking, Tekiner et al.](https://arxiv.org/abs/2103.03851); [Finding Evil in AWS, Expel](https://expel.com/blog/finding-evil-in-aws/).'
  answer_sources:
  - AWS CloudTrail management events (workspaces.amazonaws.com)
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - AWS Cost and Usage Report
  - 'NAI: WorkSpaces directories, provisioning workflows for virtual desktops, internet-egress paths from
    desktop subnets, and business units where WorkSpaces creation is rare or tightly controlled'
  range: Last 90 days (evaluate within 24h of provisioning; correlate continuous egress)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=cloudtrail eventSource=\"workspaces.amazonaws.com\" eventName in (\"CreateWorkspaces\"\
      ,\"RebuildWorkspaces\")\n| eval expensive_bundle = bundle in (\"graphics\",\"graphics-g4dn\",\"\
      powerpro\",\"power\") OR vcpu>=8\n| join WorkspaceId [ search source=vpcflow action=ACCEPT direction=egress\n\
      \    | eval mining = dest_port in (3333,4444,5555,7777,14444,45700) OR match(payload,\"stratum\\\
      \\+(tcp|ssl)://\") OR dest_ip in miner_ioc_list OR dest_domain in mining_pool_list\n    | stats\
      \ sum(bytes) as egress_bytes max(duration) as max_dur values(mining) as mining by WorkspaceId ]\n\
      | eval public_egress = sg_changed==1 OR public_route==1\n| where expensive_bundle==1 AND public_egress==1\
      \ AND (mining==1 OR (egress_bytes>sustained_threshold AND always_on==1))\n| alert severity=high"
- question: Did a single principal generate a burst of CloudTrail AccessDenied or Client.UnauthorizedOperation
    responses on WorkSpaces or compute APIs (for example more than five denials in ten minutes), especially
    immediately preceding a successful CreateWorkspaces call?
  context: 'As a distinct failure-mode signal in the Impact tactic, a compromised identity often probes
    its permissions before abusing them, producing a cluster of denied API calls followed by a successful
    provisioning action. Count CloudTrail errorCode=AccessDenied and Client.UnauthorizedOperation responses
    per principal over a rolling window for WorkSpaces/compute APIs and alert when the rate exceeds a
    tuned floor (e.g., >5 in 10 minutes). Strongly elevate confidence when the denial burst is immediately
    followed by a successful CreateWorkspaces or related lifecycle call. A positive result suggests an
    attacker enumerating permissions before standing up adversary compute; a negative result reflects
    benign misconfiguration or expected permission errors. Sources: [AWS IAM AccessDenied Discovery Events,
    Splunk](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources:
  - AWS CloudTrail management events (workspaces.amazonaws.com)
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - AWS Cost and Usage Report
  - 'NAI: WorkSpaces directories, provisioning workflows for virtual desktops, internet-egress paths from
    desktop subnets, and business units where WorkSpaces creation is rare or tightly controlled'
  range: Last 90 days (alert on a 10-minute sliding window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=cloudtrail (errorCode=\"AccessDenied\" OR errorCode=\"Client.UnauthorizedOperation\"\
      )\n  (eventSource=\"workspaces.amazonaws.com\" OR eventSource=\"ec2.amazonaws.com\")\n| bin _time\
      \ span=10m\n| stats count as denials values(eventName) as denied_apis by userIdentity.arn, sourceIPAddress,\
      \ _time\n| where denials > 5\n| join type=left userIdentity.arn [ search source=cloudtrail eventName=\"\
      CreateWorkspaces\" errorCode=null earliest=-10m latest=+10m ]\n| eval probe_then_success = if(isnotnull(CreateWorkspaces_time),1,0)\n\
      | alert"
- question: Across each WorkSpaces directory and hour-of-day, is the current creation rate, active-session
    duration, egress byte volume, per-desktop cost, bundle selection, or CloudWatch desktop metric a statistical
    outlier versus its trailing baseline, or is this a principal's first-ever creation API call or first
    activity from a new region?
  context: 'In the Impact tactic, hijacking frequently shows up as quantities that exceed normal operations
    even when each individual call looks legitimate. Baseline WorkSpaces creation rate, active-session
    duration, egress byte volume (Volume), per-desktop cost, bundle selection, and CloudWatch desktop
    metrics per directory and hour-of-day using CloudWatch metric filters / Contributor Insights with
    anomaly bands. Apply the modified Z-score (median absolute deviation, e.g., |z|>3.5) so heavy but
    legitimate users do not mask sustained outliers, and use first-seen baselining to flag a principal''s
    first-ever creation API or activity from a previously unseen region. Treat low-byte, near-constant-period,
    long-duration egress flows as a mining-heartbeat outlier. A positive result means the activity deviates
    materially from established norms; a negative result indicates volumes consistent with expected operations.
    Sources: [Simplify Analysis of CloudTrail with CloudWatch ML, AWS](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/);
    [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [CloudTrail Anomaly Detector, Netflix](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly);
    [Cloud API Calls From Previously Unseen User Roles, Splunk](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/);
    [Cryptomining Makes Noise, Caprolu et al.](https://arxiv.org/abs/1910.09272).'
  answer_sources:
  - AWS CloudTrail management events (workspaces.amazonaws.com)
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - AWS Cost and Usage Report
  - 'NAI: WorkSpaces directories, provisioning workflows for virtual desktops, internet-egress paths from
    desktop subnets, and business units where WorkSpaces creation is rare or tightly controlled'
  range: Last 90 days (baseline 30-90 days; evaluate per directory and per hour-of-day)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="workspaces.amazonaws.com" earliest=-90d

      | stats count as creates avg(session_duration) as dur sum(egress_bytes) as egress avg(cost) as cost
      values(bundle) as bundles by directory_id, date_hour, userIdentity.arn

      | eventstats median(creates) as med mad(creates) as mad by directory_id, date_hour

      | eval mod_z = 0.6745*(creates-med)/mad

      | eval first_create = first_seen(userIdentity.arn,"CreateWorkspaces"), new_region = first_seen(userIdentity.arn,awsRegion)

      | where abs(mod_z) > 3.5 OR first_create==1 OR new_region==1

      | alert'
- question: Do unsupervised and supervised models flag abusive virtual-desktop behavior, such as rare
    WorkSpaces lifecycle API actions, geographies, source IPs, or user-command pairs in CloudTrail and
    encrypted mining-pool patterns in VPC Flow Logs, with the top contributing features surfaced for triage?
  context: 'Under the Impact tactic, ML complements rules and statistics by catching novel combinations
    a human would not pre-specify. Apply unsupervised CloudTrail ML (rare-function/population analysis)
    over WorkSpaces lifecycle events, login telemetry, and spend signals to flag rare API actions, geographies,
    source IPs, and user-command pairs, surfacing the top-3 contributing features (e.g., creator rarity,
    new region, expensive bundle) in the alert text. In parallel, train a supervised VPC Flow Log classifier
    (Random Forest) on duration, bytes and byte-out/byte-in ratio (Volume), inter-arrival periodicity
    (Frequency), connection success versus reset/blocked (State), and destination ASN type, which detects
    encrypted pool traffic at high F1 (~0.96) and emits the top-3 features per alert; enrich with cryptojacking
    behavioral feature families. A positive result is a model-flagged anomaly with explainable features
    pointing to hijacking; a negative result means the behavior fits learned normal profiles. Sources:
    [Detecting Threats in AWS CloudTrail Logs Using ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning);
    [Cryptomining Makes Noise, Caprolu et al.](https://arxiv.org/abs/1910.09272); [SoK Cryptojacking,
    Tekiner et al.](https://arxiv.org/abs/2103.03851).'
  answer_sources:
  - AWS CloudTrail management events (workspaces.amazonaws.com)
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - AWS Cost and Usage Report
  - 'NAI: WorkSpaces directories, provisioning workflows for virtual desktops, internet-egress paths from
    desktop subnets, and business units where WorkSpaces creation is rare or tightly controlled'
  range: Last 90 days (train on 30-90 days; score continuously)
  queries:
  - technology: SIEM/ML pseudocode (unsupervised CloudTrail rare-function analysis)
    query: "model = CloudTrailRareFunction(events = workspaces_lifecycle + login_telemetry + spend_signals)\n\
      features = [api_action, geography, source_ip, user_command_pair, bundle, spend]\nscore = model.population_rarity(principal,\
      \ features)\nif score.is_rare():\n    emit_alert(top_features = score.top_n(3))   # e.g. creator_rarity,\
      \ new_region, expensive_bundle"
  - technology: ML/VPC Flow Log classifier pseudocode
    query: "clf = RandomForest()\nX = vpcflow[[duration, bytes, byte_out_in_ratio(Volume), inter_arrival_periodicity(Frequency),\n\
      \             conn_state_success_vs_reset_blocked(State), dest_asn_type]]\nclf.fit(X_train, y_train_mining_labels)\
      \   # target F1 ~ 0.96\npred = clf.predict_proba(X_live)\nif pred.mining > threshold:\n    alert(top_features\
      \ = clf.explain(X_live).top_n(3))"
- question: Did an established WorkSpace begin maintaining long-duration sessions without normal user-interaction
    patterns, communicate with novel external destinations or Stratum ports/strings, run known miner binaries
    (xmrig, cpuminer, kdevtmpfsi, kinsing) or match mining-pool IOCs, or generate GuardDuty findings related
    to cryptocurrency, malware, or suspicious internet behavior?
  context: 'In the Impact tactic, an existing desktop being repurposed shifts from interactive use to
    continuous automated activity. Alert when an established WorkSpace starts holding long-duration sessions
    lacking normal user-interaction patterns, reaches out to novel external destinations or Stratum ports/strings,
    executes known miner binaries, or matches mining-pool IOCs, or when GuardDuty raises cryptocurrency/malware/suspicious-internet
    findings for that desktop. Sustained near-saturation CPU (CloudWatch) for more than ~30 minutes outside
    maintenance windows is the stationary-load signature that distinguishes mining from transient legitimate
    spikes. A positive result indicates the desktop is no longer serving its end-user productivity role
    and is instead being abused; a negative result reflects normal, varied interactive workload. Sources:
    [SoK Cryptojacking, Tekiner et al.](https://arxiv.org/abs/2103.03851); [Cryptomining Makes Noise,
    Caprolu et al.](https://arxiv.org/abs/1910.09272); [Detecting Covert Cryptomining using HPC, Gangwal
    and Conti](https://arxiv.org/abs/1909.00268).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - Amazon GuardDuty findings
  - AWS Cost and Usage Report
  - 'NAI: Persistent virtual desktops assigned to privileged or remote personnel, networks where WorkSpaces
    should access only approved enterprise services, and security monitoring around suspicious outbound
    activity'
  range: Last 90 days (correlate sustained CPU >30 min and continuous egress)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=workspaces_connection OR source=vpcflow OR source=guardduty

      | eval long_idle_session = session_duration > 8h AND user_input_events < idle_floor

      | eval mining_net = dest_port in (3333,4444,5555,7777,14444,45700) OR match(payload,"stratum\\+(tcp|ssl)://")
      OR dest_ip in miner_ioc_list OR dest_domain in mining_pool_list

      | eval miner_proc = process_name in ("xmrig","cpuminer","kdevtmpfsi","kinsing")

      | eval gd = guardduty_finding_type in ("CryptoCurrency:*","Trojan:*","Backdoor:*","UnauthorizedAccess:*")

      | join WorkspaceId [ search source=cloudwatch metric=CPUUtilization | stats max(sustained_min) as
      cpu_sat_min by WorkspaceId | where cpu_sat_min > 30 ]

      | where long_idle_session==1 OR mining_net==1 OR miner_proc==1 OR gd==1

      | alert'
- question: Does the same repurposed WorkSpace also show sustained cost growth, repeated off-hours use,
    or abrupt egress expansion following directory, bundle, or access-permission changes made by an unusual
    administrator, or after security-group/egress widening that opens new public paths?
  context: 'In the Impact tactic, a deliberate hijack often pairs a control-plane change made by an atypical
    admin with a downstream behavioral and cost shift. Raise severity when a WorkSpace exhibits sustained
    cost growth, repeated off-hours use, or abrupt egress expansion that follows directory, bundle, or
    access-permission modifications performed by an unusual administrator, or after security-group/egress
    widening that opens new public egress paths. Correlate the CloudTrail change event (who changed what,
    when) with the subsequent Cost and Usage Report growth and VPC Flow Log egress increase on the same
    desktop. A positive result links an administrative change to abusive resource consumption and is strong
    evidence of intentional repurposing; a negative result indicates expected administration with no abusive
    follow-on. Sources: [Finding Evil in AWS, Expel](https://expel.com/blog/finding-evil-in-aws/); [Compromised
    Cloud Compute Credentials, Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - Amazon GuardDuty findings
  - AWS Cost and Usage Report
  - 'NAI: Persistent virtual desktops assigned to privileged or remote personnel, networks where WorkSpaces
    should access only approved enterprise services, and security monitoring around suspicious outbound
    activity'
  range: Last 90 days (pivot from the control-plane change forward 7-30 days)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventName in ("ModifyWorkspaceProperties","ModifyWorkspaceCreationProperties","AuthorizeSecurityGroupEgress","ModifyClientProperties")

      | eval unusual_admin = first_seen(userIdentity.arn,"workspace_admin")==1 OR not_in(admin_allowlist,
      userIdentity.arn)

      | join WorkspaceId [ search source=cost_usage_report | stats trend(cost) as cost_growth by WorkspaceId
      ]

      | join WorkspaceId [ search source=vpcflow | stats trend(egress_bytes) as egress_growth count(eval(off_hours(_time)))
      as offhours by WorkspaceId ]

      | where unusual_admin==1 AND (cost_growth>0 OR egress_growth>0 OR offhours>offhours_baseline)

      | alert severity=high'
- question: For each WorkSpace, is its session length, active-hour distribution, egress byte volume, flow
    periodicity, destination diversity, or cost a robust outlier versus its own trailing baseline and
    its peers in the same directory, and are there DNS subdomain-entropy or NXDOMAIN-rate spikes indicating
    domain-fluxing pool resolvers?
  context: 'Under the Impact tactic, repurposing manifests as a desktop drifting away from its established
    interactive profile toward server-like or automated compute usage. Compare each WorkSpace''s session
    length, active-hour distribution, egress byte volume (Volume), flow periodicity (Frequency), destination
    diversity, and cost against its trailing baseline and peer desktops in the same directory using robust
    modified Z-score (MAD) outlier scoring, and baseline per-directory CloudWatch metrics with anomaly
    bands. As a distinct failure-mode signal, track DNS subdomain-entropy and NXDOMAIN-rate spikes per
    desktop, which reveal domain-fluxing pool resolvers. Flag desktops whose behavior materially shifts
    toward automated compute. A positive result identifies a desktop diverging from both its history and
    its peers; a negative result indicates behavior consistent with normal interactive use. Sources: [Modified
    Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [SoK Cryptojacking, Tekiner et al.](https://arxiv.org/abs/2103.03851); [Simplify Analysis of CloudTrail
    with CloudWatch ML, AWS](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - Amazon GuardDuty findings
  - AWS Cost and Usage Report
  - 'NAI: Persistent virtual desktops assigned to privileged or remote personnel, networks where WorkSpaces
    should access only approved enterprise services, and security monitoring around suspicious outbound
    activity'
  range: Last 90 days (baseline 30-90 days; compare per-desktop and per-peer-group)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=workspaces_connection OR source=vpcflow OR source=cost_usage_report OR source=dns earliest=-90d\n\
      | stats avg(session_len) as slen dc(active_hours) as ahours sum(egress_bytes) as egress periodicity(flows)\
      \ as freq dc(dest) as dest_div avg(cost) as cost\n        avg(subdomain_entropy) as dns_entropy\
      \ avg(nxdomain_rate) as nxd by WorkspaceId, directory_id\n| eventstats median(egress) as peer_med\
      \ mad(egress) as peer_mad by directory_id\n| eval mod_z = 0.6745*(egress-peer_med)/peer_mad\n| where\
      \ abs(mod_z) > 3.5 OR dns_entropy > entropy_band OR nxd > nxdomain_band\n| alert"
- question: Do time-series forecasts of each WorkSpace's CPU, session-duration, and egress series produce
    persistently high positive residuals with single-process attribution, and does a supervised VPC Flow
    Log classifier flag persistent, low-interaction high-traffic behavior, with the top contributing features
    surfaced and rare control-plane changes detected before the behavior shift?
  context: 'In the Impact tactic, hijacked desktops settle into a sustained, predictable compute load
    that forecasting models expose as persistent residuals. Forecast each WorkSpace''s CPU, session-duration,
    and egress series with ARIMA/LSTM and score residuals; persistently high positive residuals combined
    with single-process attribution indicate repurposing for unauthorized compute. Complement with a supervised
    VPC Flow Log classifier emphasizing persistent uptime, low-interaction high-traffic behavior, byte
    ratio (Volume), periodicity (Frequency), and connection success/reset state (State), surfacing the
    top-3 contributing features per alert. Apply unsupervised CloudTrail ML to detect rare control-plane
    changes preceding the behavior shift, with top influencers in the alert text. A positive result is
    a model-confirmed sustained anomaly tied to a single abusive process and an antecedent control-plane
    change; a negative result means the series matches forecast and the flows look interactive. Sources:
    [Cloud Intrusion Detection Using Time Series Forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x);
    [Detecting Covert Cryptomining using HPC, Gangwal and Conti](https://arxiv.org/abs/1909.00268); [Cryptomining
    Makes Noise, Caprolu et al.](https://arxiv.org/abs/1910.09272); [Detecting Threats in AWS CloudTrail
    Logs Using ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon WorkSpaces access/connection logs
  - VPC Flow Logs
  - Amazon CloudWatch WorkSpaces metrics
  - Amazon GuardDuty findings
  - AWS Cost and Usage Report
  - 'NAI: Persistent virtual desktops assigned to privileged or remote personnel, networks where WorkSpaces
    should access only approved enterprise services, and security monitoring around suspicious outbound
    activity'
  range: Last 90 days (train on 30-90 days; score continuously; correlate control-plane change window)
  queries:
  - technology: ML/Time-series residual pseudocode (ARIMA/LSTM)
    query: "for ws in workspaces:\n    for series in [cpu, session_duration, egress]:\n        model =\
      \ ARIMA(series) or LSTM(series)          # trained on 30-90d\n        resid = observed - model.forecast()\n\
      \    if persistent_positive(resid_cpu) and single_process_attribution(ws):\n        alert(workspace=ws,\
      \ reason=\"sustained unauthorized compute\", residuals=resid)"
  - technology: ML/VPC Flow Log classifier pseudocode
    query: "clf = RandomForest()\nX = vpcflow[[persistent_uptime, low_interaction_high_traffic, byte_ratio(Volume),\n\
      \             periodicity(Frequency), conn_state_success_vs_reset(State)]]\npred = clf.predict_proba(X_live)\n\
      if pred.hijacked > threshold:\n    alert(top_features = clf.explain(X_live).top_n(3))"
