name: 'T1190.A019: Overly Permissive VPC Security Groups'
id: dff109b3-6030-4b3b-a832-7521892bb156
description: Investigate whether an adversary has gained or materially enabled initial access into the
  AWS environment through overly permissive VPC security groups attached to internet-reachable resources.
  This playbook helps an analyst determine (1) whether a security group attached to a public IP, internet-facing
  load balancer, or internet-routable interface exposes administrative or otherwise sensitive ports to
  broad source ranges such as 0.0.0.0/0 or ::/0, who made or broadened that configuration, and whether
  that exposure is anomalous for the account, VPC, or principal; and (2) whether, after a permissive change
  took effect, external sources began probing, scanning, brute-forcing, or otherwise attempting access
  against the newly exposed resource. It combines deterministic never-allow floors (any /0-to-admin-port
  rule), statistical baselining of exposure and ingress pressure, and explainable machine-learning ranking
  so analysts can prioritize the exposures and source behaviors most likely to constitute an active initial-access
  vector.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any security group attached to an internet-reachable AWS resource (a public IP, an internet-facing
    load balancer, or an internet-routable network interface) allowing inbound traffic from 0.0.0.0/0
    or ::/0 to a high-risk administrative, database, or control-plane port?
  context: This is the deterministic never-allow floor for the Initial Access tactic. An exposed admin
    port (SSH 22, RDP 3389, Telnet 23, FTP 21, SMB 445, WinRM 5985/5986), database port (1433, 3306, 5432,
    1521, 27017, 6379, 9200), or container/control-plane port (6443, 2379-2380, 10250, 2375) reachable
    from the entire internet is a direct foothold for scanning, brute force, exploit delivery, and opportunistic
    malware ingress. Evaluate the exact CloudTrail flattened request-parameter fields request_parameters.ipPermissions.items.ipRanges.items.cidrIp
    and .fromPort/.toPort. Escalate if the rule was recently created or broadened via AuthorizeSecurityGroupIngress,
    sits on an internet-gateway path, and the resource lacks an approved exception tag. Treat any /0-to-admin-port
    rule as a never-allow violation and keep this floor regardless of any ML scoring. A positive result
    means a realistic, immediate initial-access path exists and should be remediated; web-only 80/443
    exposure is lower priority.
  answer_sources: &id001
  - AWS Config configuration history
  - CloudTrail management events
  - VPC Flow Logs
  - AWS Security Hub findings
  - Amazon GuardDuty findings
  - AWS Reachability Analyzer findings
  - 'NAI: Internet gateways, public subnets, elastic network interfaces for externally reachable workloads,
    and configuration history for security groups attached to EC2, load balancers, and other exposed resources'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloudtrail WHERE eventName IN (AuthorizeSecurityGroupIngress)

      AND request_parameters.ipPermissions.items.ipRanges.items.cidrIp IN (0.0.0.0/0, ::/0)

      AND fromPort/toPort overlaps {22,23,21,445,3389,5985,5986,1433,3306,5432,1521,27017,6379,9200,6443,2379,2380,10250,2375,app_admin}

      AND security_group attached_to (public_ip OR internet_facing_lb OR internet_routable_eni)

      AND NOT resource.tags contains approved_exception

      => ALERT severity=critical (never-allow /0-to-admin-port floor)'
  - technology: AWS Config/pseudocode
    query: 'EVALUATE config_history(security_groups) WHERE ingress.cidr IN (0.0.0.0/0,::/0)

      AND ingress.port IN high_risk_ports AND attachment.internet_reachable = true

      => NONCOMPLIANT'
- question: Was a permissive ingress change that opens 0.0.0.0/0 to sensitive ports made by a principal,
    source IP/ASN, or user agent that is unusual for the account, especially alongside other credential-abuse
    behaviors?
  context: Stolen-credential abuse frequently manifests as an attacker opening SSH/RDP for follow-on access.
    Flag AuthorizeSecurityGroupIngress (or a RevokeSecurityGroupIngress followed by a re-add) events that
    open /0 to sensitive ports when the calling principal, source IP/ASN, or userAgent is anomalous for
    the account. Require state=success. Raise severity sharply if the same principal in the same time
    window also disabled logging (CloudTrail/Config/GuardDuty), created access keys, or launched instances
    — a cluster of actions consistent with compromised cloud compute credentials. A positive result strongly
    suggests the exposure was created by an adversary rather than a legitimate operator, directly supporting
    the Initial Access hypothesis.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM cloudtrail WHERE eventName=AuthorizeSecurityGroupIngress AND responseElements=success\n\
      AND cidr IN (0.0.0.0/0,::/0) AND port IN sensitive_ports\nAND (userIdentity.arn NOT IN known_principals_for_account\n\
      \     OR sourceIPAddress.asn NOT IN baseline_asn\n     OR userAgent NOT IN baseline_userAgent)\n\
      | join (same principal+window: StopLogging|DeleteTrail|CreateAccessKey|RunInstances)\n=> ALERT severity=high"
- question: Does the volume and breadth of internet exposure for a given account, VPC, or subnet exceed
    its peer group or its own recent baseline of public ingress rules and open sensitive ports?
  context: Beyond single rules, sustained or growing exposure is itself an initial-access risk. Baseline
    the count of public ingress rules, exposed port categories, CIDR breadth, and number of attached public
    resources by account, VPC, and environment using CloudWatch metric filters, Contributor Insights,
    and band-based anomaly detection over CloudTrail-derived metrics. Flag teams or subnets whose exposure
    score, number of broad CIDRs, or number of sensitive ports open to the internet exceeds peer groups
    or their own 30-day baseline (for example, beyond the upper anomaly band, or any first-ever /0-to-admin-port).
    A positive result highlights an environment drifting toward a larger external attack surface that
    warrants review.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM cloudtrail_exposure_metrics BY account, vpc, subnet, env

      COMPUTE public_ingress_rules, sensitive_ports_open, broad_cidr_count, public_attachments

      EVAL exposure_score = weighted_sum(...)

      COMPARE vs peer_group AND vs self_30d_baseline (anomaly band)

      => FLAG where exposure_score > upper_band OR first_ever(/0-to-admin-port)'
- question: Is a principal issuing an AuthorizeSecurityGroupIngress (or a /0-to-sensitive-port change)
    for the first time, or from a new account or region?
  context: First-seen novelty on exposure-changing API calls is a high-fidelity, low-cost signal of compromised-credential
    activity that complements volume baselining. Maintain a per-principal history of CloudTrail API actions
    and alert when an identity performs AuthorizeSecurityGroupIngress — or specifically a /0-to-sensitive-port
    change — for the first time, or from a previously unseen account or region. Legitimate operators tend
    to repeat the same administrative actions from consistent locations; a sudden first-ever exposure
    change by an identity is a strong trigger to investigate whether its credentials have been stolen
    and used for initial access.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM cloudtrail BY userIdentity.arn

      MAINTAIN history(eventName, account, region)

      WHEN eventName=AuthorizeSecurityGroupIngress AND (action OR account OR region) NOT IN history[arn]

      OR (cidr IN (0.0.0.0/0,::/0) AND port IN sensitive_ports AND first_seen_for_principal)

      => ALERT first_seen_exposure_change'
- question: Do any security-group configurations form a rare exposure cluster resembling previously exploited
    misconfigurations rather than common web-only exposure?
  context: Cluster security-group configurations using interpretable features such as port criticality,
    CIDR breadth, attachment to sensitive workloads, internet reachability, and recent change activity
    to identify rare exposure patterns. Keep the features explainable and pair clustering with the deterministic
    /0-to-admin-port floor rather than replacing it — unscoped anomaly ML produces too many false positives
    to stand alone. Prioritize clusters resembling prior externally exploited configurations (for example,
    admin ports broadly open on sensitive workloads) over common web-only 80/443 exposure. A positive
    result surfaces configurations that statistically look like known-bad exposure for analyst review
    under the Initial Access lens.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FEATURES per security_group: port_criticality, cidr_breadth, sensitive_workload_attach,\n\
      \  internet_reachable, recent_change_activity\nMODEL cluster(security_groups)  # interpretable features\
      \ only\nRANK clusters by similarity_to(prior_exploited_configs)\nOUTPUT rare_clusters EXCLUDING\
      \ common web-only(80/443)\nLAYER on top of deterministic /0-to-admin-port floor"
- question: When security-group configurations are risk-ranked for initial-access potential, which exposures
    rank highest and what top contributing features explain that ranking?
  context: Train a risk model that scores security-group configurations using attachment criticality,
    resource role, change recency, historic findings, and observed internet reachability, and surface
    the top-3 contributing features in the alert text (for example, '0.0.0.0/0 to 22', 'first-seen principal',
    'public ALB attachment') so analysts immediately see why a config ranked high. Rank exposures most
    likely to enable successful initial access rather than noisy but low-consequence misconfiguration.
    A high-ranking, well-explained result lets the SOC triage the most dangerous external attack surface
    first and feed remediation.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL risk_score(security_group | attachment_criticality, resource_role,\n  change_recency,\
      \ historic_findings, internet_reachability)\nRANK security_groups DESC by risk_score\nEMIT top3_contributing_features\
      \ per alert  # e.g. '0.0.0.0/0 to 22','first-seen principal'\nPRIORITIZE configs likely to enable\
      \ successful initial access"
- question: Within 24 hours of a security-group change that broadened ingress, did new external sources
    begin connecting to the newly opened ports with scan, brute-force, or exploit behavior?
  context: This correlation ties a permissive configuration change to actual hostile traffic, confirming
    the exposure became an active initial-access vector. Correlate recent AuthorizeSecurityGroupIngress
    events with VPC Flow Log, Network Firewall, ALB, or WAF evidence of new external sources hitting the
    opened ports within 24 hours. Escalate when traffic shows scan behavior (many REJECT/SYN-only flows,
    broad destination-port fan-out), brute-force patterns (repeated auth failures then a success, default-credential
    dictionaries against 22/23/3389), denied-to-accepted transitions, exploit requests, or GuardDuty findings
    tied to the same interface or workload. Newly exposed services are typically discovered and scanned
    within minutes, so a tight temporal correlation is expected and meaningful.
  answer_sources: &id002
  - VPC Flow Logs
  - CloudTrail management events
  - Amazon GuardDuty findings
  - AWS Network Firewall logs
  - Application load balancer access logs
  - AWS WAF logs
  - 'NAI: VPC ingress points for internet-exposed workloads, network telemetry for public interfaces,
    and resources whose security groups were recently changed to broaden external access'
  range: Last 90 days; pivot to a 24-hour window centered on each security-group change
  queries:
  - technology: SIEM/Rule pseudocode
    query: "LET changes = cloudtrail WHERE eventName=AuthorizeSecurityGroupIngress AND broadens_ingress\n\
      JOIN (vpcflow OR networkfirewall OR alb OR waf) WHERE dst_port IN changes.opened_ports\n  AND src_ip\
      \ NOT IN prior_known_sources\n  AND time BETWEEN change_time AND change_time+24h\nWHERE scan_behavior\
      \ OR brute_force OR denied_to_accepted OR exploit_request OR guardduty_finding\n=> ALERT escalate"
- question: Is a single external source generating high-fan-out connection attempts or a high REJECT:ACCEPT
    ratio against the exposed resource, indicating scanning?
  context: The failed-versus-successful connection signal most cleanly distinguishes scanners from benign
    clients. On VPC Flow Logs, deterministically alert when a single external source generates connection
    attempts to >=20 distinct destination ports, or to a tuned number of distinct hosts, within 5 minutes,
    or whose REJECT:ACCEPT ratio exceeds a tuned threshold (for example >0.8). Separately profile authentication-failure
    bursts (failed logons, 401/403, SSH auth failures) in the minutes after a rule change as a distinct
    failure-mode signal rather than relying only on successful connections. A positive result confirms
    active reconnaissance or probing against the newly exposed surface.
  answer_sources: *id002
  range: Last 90 days; 5-minute sliding windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM vpcflow BY src_ip OVER 5min\nCOMPUTE distinct_dst_ports, distinct_dst_hosts, reject_count,\
      \ accept_count\nWHERE distinct_dst_ports >= 20 OR distinct_dst_hosts >= H\n  OR (reject_count/(accept_count+1))\
      \ > 0.8\n=> ALERT scan\nALSO profile auth_failure_burst (failed_logons,401/403,ssh_auth_fail) post\
      \ rule_change"
- question: Did inbound connection pressure, source diversity, port entropy, or authentication-failure
    rate change significantly before versus after a security-group rule change?
  context: Compare inbound connection count, unique source count, destination-port entropy, authentication-failure
    rate, and denied-to-accepted (REJECT:ACCEPT) ratios before and after a rule change, and apply a sequential-probability-ratio
    (TRW/SPRT) test on per-source success/fail outcomes to flag scanners within a handful of attempts.
    For credential attacks, model aggregate site-wide login failure/success to catch low-and-slow distributed
    brute-forcing that evades per-source counts. Derive dataset-specific thresholds from CICFlowMeter-style
    flow features (byte/packet counts, flow duration, flag counts, inter-arrival times) using a labeled
    benchmark. A measurable jump in ingress pressure coincident with the rule change confirms the exposure
    is drawing hostile attention.
  answer_sources: *id002
  range: Last 90 days; compare windows before and after each rule change
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each rule_change: COMPARE pre vs post window\n  metrics: inbound_conns, unique_sources,\
      \ dst_port_entropy, auth_fail_rate, reject:accept\nAPPLY SPRT/TRW on per-source success/fail =>\
      \ flag scanners early\nMODEL site-wide login fail/success => detect low-and-slow distributed brute\
      \ force\nTHRESHOLDS from CICFlowMeter features (bytes,pkts,duration,flags,IAT) on labeled benchmark"
- question: Do newly observed external sources cluster into coordinated probing or brute-force groups
    distinct from background internet noise?
  context: Cluster newly observed external sources by connection cadence, destination-port spread, flow-size
    distribution, WAF signature mix, user-agent characteristics, and retry timing to distinguish background
    noise from coordinated probing or brute force. NetFlow-only statistical features (flow-size distributions,
    client-access patterns, temporal regularity) are sufficient and run on first-party VPC Flow Logs without
    payload, so this works even where deep inspection is unavailable. Validate and tune the model against
    labeled brute-force and DoS flows. A cluster of coordinated sources targeting the exposed resource
    is strong evidence of an active initial-access campaign rather than incidental scanning.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FEATURES per external src: conn_cadence, dst_port_spread, flow_size_dist,\n  waf_signature_mix,\
      \ user_agent_chars, retry_timing\nMODEL cluster(new_external_sources)  # NetFlow-only features,\
      \ no payload\nLABEL clusters: background_noise vs coordinated_probe/brute_force\nVALIDATE against\
      \ labeled brute-force/DoS flows"
- question: Across the sequence {config change -> scan density -> authentication attempts -> destination
    criticality}, does a time-aware model indicate the permissive rule has become an active initial-access
    vector?
  context: Use time-aware anomaly detection over the sequence {config change -> scan density -> authentication
    attempts -> destination criticality} and surface the top-3 contributing features in the alert (for
    example, '0/0-to-22 opened 14m ago', 'REJECT:ACCEPT 0.9', 'first-seen ASN') for analyst triage. Keep
    the model narrowly scoped and layered atop the deterministic rules above to avoid the semantic-gap
    and high-false-positive failure modes of blackbox NIDS ML. Favor alerts where recent exposure, scan
    density, authentication attempts, and destination criticality jointly indicate the permissive rule
    has become an active initial-access vector. This is the top-of-funnel synthesizing signal that connects
    the configuration weakness to observed adversary behavior.
  answer_sources: *id002
  range: Last 90 days; event-centered on each config change
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL time_aware_anomaly over sequence:\n  config_change -> scan_density -> auth_attempts\
      \ -> destination_criticality\nEMIT top3_contributing_features  # e.g. '0/0-to-22 opened 14m ago','REJECT:ACCEPT\
      \ 0.9','first-seen ASN'\nLAYER atop deterministic rules; scope narrowly\nPRIORITIZE joint exposure+scan+auth+criticality\
      \ => active initial-access vector"
