name: 'T1485.A002: AMI Image Deletion'
id: 0a93ffb4-5e0a-4852-9ada-8a55d1308c08
description: Investigate whether an adversary has caused impact in AWS by deregistering Amazon Machine
  Images (AMIs) or removing the launchable golden images and backing EBS snapshots an organization needs
  to restore, scale, or rebuild its environment. This playbook helps an analyst determine if a principal
  deregistered AMIs, deleted associated snapshots, or altered image-sharing permissions for known-good
  base images outside approved image-lifecycle workflows, especially for golden images referenced by launch
  templates, Auto Scaling groups, disaster-recovery runbooks, incident-response automation, or regulated
  workload rebuilds. It correlates CloudTrail management events (DeregisterImage, DeleteSnapshot, ModifyImageAttribute/ResetImageAttribute)
  with enumeration that precedes them, with combined image-and-snapshot teardown chains, and with downstream
  operational impact such as RunInstances and Auto Scaling launch failures referencing invalid or missing
  image IDs (InvalidAMIID.NotFound/InvalidAMIID.Unavailable). Methods span symbolic-logic detections,
  statistical baselining (modified Z-score, change-point detection, failure/denial-rate profiling), and
  machine-learning graph/sequence and restoration-impairment models so the SOC has granular, defensible
  coverage of AMI image deletion and the recovery degradation it is designed to cause.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any principal deregister an approved golden/base AMI (CloudTrail eventName=DeregisterImage,
    eventSource ec2.amazonaws.com), delete its backing EBS snapshots (DeleteSnapshot), or change its sharing
    permissions (ModifyImageAttribute/ResetImageAttribute) outside an approved image-lifecycle workflow,
    and is that image ID still referenced by a launch template, Auto Scaling group, or DR runbook?
  context: 'In the Impact tactic, deregistering an AMI is an irreversible inhibit-recovery action: AWS
    does not auto-delete the backing snapshots, so removing a known-good restore image deliberately strips
    the organization of a recovery and scaling path. Build the rule from the reusable eventSource+eventName
    pattern proven for AWS destruction verbs and the image-permission pattern used to detect AMIs made
    public. Alert on DeregisterImage, DeleteSnapshot of associated snapshot IDs, or ModifyImageAttribute/ResetImageAttribute
    affecting approved restore images. Escalate to high if the image ID is still referenced by a launch
    template, Auto Scaling group, or DR runbook, or if the same principal ran DescribeImages/DescribeSnapshots
    enumeration in the prior 60 minutes. A positive result means a restore-critical image was removed
    or exposed; a negative result reflects routine lifecycle retirement. Validate with Stratus Red Team
    emulation. References: [AWS DeregisterImage reference](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/deregister-ami.html),
    [SigmaHQ AWS CloudTrail rules](https://github.com/SigmaHQ/sigma/tree/master/rules/cloud/aws/cloudtrail),
    [Datadog''s AMI-made-public rule](https://docs.datadoghq.com/security/default_rules/aws-ec2-ami-made-public/),
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team).'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - EC2 image and snapshot inventories
  - EventBridge event history
  - CloudWatch metrics
  - 'NAI: Golden-image pipelines, AMIs referenced by launch templates and auto scaling groups, snapshot
    inventories backing restorable images, and EC2 administration activity in production accounts'
  range: Last 90 days (pivot 60 minutes before/after for enumeration)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="ec2.amazonaws.com"

      | where eventName in ("DeregisterImage","DeleteSnapshot","ModifyImageAttribute","ResetImageAttribute")

      | lookup approved_image_inventory imageId OUTPUT is_golden, referenced_by_lt, referenced_by_asg,
      in_dr_runbook

      | eval enum_recent=[search source=cloudtrail eventName IN ("DescribeImages","DescribeSnapshots")
      earliest=-60m by userIdentity.arn]

      | eval severity=if(referenced_by_lt OR referenced_by_asg OR in_dr_runbook OR enum_recent,"high","medium")

      | where is_golden=true | table _time userIdentity.arn eventName imageId snapshotId sourceIPAddress
      userAgent severity | alert'
- question: Did a single actor or session both deregister an AMI and delete its associated EBS snapshots
    (and/or revoke image sharing or edit launch templates) within a short window (for example 30 minutes),
    destroying the full image-and-snapshot recovery chain together?
  context: 'Because backing snapshots are not removed when an AMI is deregistered, a combined image+snapshot
    teardown by the same principal in a tight window is a deliberate, irreversible inhibit-recovery signal
    rather than incidental cleanup. Correlate DeregisterImage with DeleteSnapshot of the associated snapshot
    IDs, launch-template edits, or image-share revocation by the same session/actor within roughly 30
    minutes. Present the full destruction chain (image ID, snapshot IDs, affected templates, principal,
    sourceIPAddress, userAgent) so defenders can see whether recovery options were intentionally removed.
    A positive result is a strong Impact indicator that an actor methodically eliminated the ability to
    rebuild from a known-good image; a negative result (image deregistered but snapshots retained) leaves
    a partial recovery path intact. References: [AWS DeregisterImage reference](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/deregister-ami.html).'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - EC2 image and snapshot inventories
  - EventBridge event history
  - CloudWatch metrics
  - 'NAI: Golden-image pipelines, AMIs referenced by launch templates and auto scaling groups, snapshot
    inventories backing restorable images, and EC2 administration activity in production accounts'
  range: Last 90 days (correlate within a 30-minute window per actor/session)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="ec2.amazonaws.com"

      | where eventName in ("DeregisterImage","DeleteSnapshot","ModifyImageAttribute","ModifyLaunchTemplate")

      | transaction userIdentity.arn, userIdentity.sessionContext maxspan=30m

      | eval chain=mvappend(eventName)

      | where "DeregisterImage" in chain AND ("DeleteSnapshot" in chain OR "ModifyImageAttribute" in chain
      OR "ModifyLaunchTemplate" in chain)

      | table userIdentity.arn imageId snapshotIds launchTemplateIds sourceIPAddress userAgent chain |
      alert'
- question: Is this the first time a given role or principal has invoked a destructive image operation
    (DeregisterImage, DeleteSnapshot, or ModifyImageAttribute), compared to an allowlist of identities
    that normally perform image management?
  context: 'Adversaries frequently abuse credentials or roles that have permission to delete images but
    no operational history of doing so. Maintain an allowlist of (principal/role, eventName) pairs that
    normally perform image management, then alert when DeregisterImage, DeleteSnapshot, or ModifyImageAttribute
    is invoked by a role for the first time, following the previously-unseen role/API analytic pattern
    and CloudTrail first-seen baselining. Include the prior count of image operations by that role to
    support triage. In the Impact tactic, a first-seen destructive image operation by an otherwise read-only
    or unrelated role strongly suggests credential misuse or lateral abuse rather than sanctioned lifecycle
    work; a known image-management role acting within its history is far more likely benign. References:
    [Splunk previously-unseen role/API analytic](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/),
    [Netflix CloudTrail first-seen baselining](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - EC2 image and snapshot inventories
  - EventBridge event history
  - CloudWatch metrics
  - 'NAI: Golden-image pipelines, AMIs referenced by launch templates and auto scaling groups, snapshot
    inventories backing restorable images, and EC2 administration activity in production accounts'
  range: Last 90 days (baseline first-seen over 90+ days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="ec2.amazonaws.com" eventName IN ("DeregisterImage","DeleteSnapshot","ModifyImageAttribute")

      | inputlookup append=t image_mgmt_allowlist.csv

      | stats earliest(_time) as first_seen count as prior_ops by userIdentity.arn, eventName

      | eval is_first_seen=if(NOT [userIdentity.arn,eventName] in allowlist_pairs,1,0)

      | where is_first_seen=1 | table userIdentity.arn eventName prior_ops first_seen | alert'
- question: Is the volume, batch size, or frequency of DeregisterImage/DeleteSnapshot operations by an
    account, image pipeline, or operations team a statistical outlier versus its historical baseline,
    especially outside release windows?
  context: 'Mass or bursty image deletion is a hallmark of destructive Impact, but naive thresholds break
    against legitimate batch retirement jobs. Baseline normal DeregisterImage/DeleteSnapshot counts and
    batch sizes per account, image pipeline, and operations team, then flag deviations using robust median/MAD
    modified Z-scores (alert at modified Z > 3.5, tuned per environment) so batch jobs do not distort
    the model. Emit CloudTrail-to-CloudWatch metric filters with seasonal Anomaly Detection bands and
    Contributor Insights to rank the principals/sources driving spikes. Flag deletions outside release
    windows or exceeding expected batch size versus historical retirement behavior, and include the top
    contributing fields (principal, region, image count) in the alert. A positive result indicates abnormal
    deletion volume consistent with an attempt to destroy many recovery images at once; a negative result
    is volume within normal retirement envelopes. References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    [AWS CloudWatch ML](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - EC2 image and snapshot inventories
  - EventBridge event history
  - CloudWatch metrics
  - 'NAI: Golden-image pipelines, AMIs referenced by launch templates and auto scaling groups, snapshot
    inventories backing restorable images, and EC2 administration activity in production accounts'
  range: Last 90 days (baseline 30-90 days; evaluate per window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="ec2.amazonaws.com" eventName IN ("DeregisterImage","DeleteSnapshot")
      earliest=-90d

      | bin _time span=1h | stats count as del_count by account, image_pipeline, userIdentity.arn, awsRegion,
      _time

      | eventstats median(del_count) as med by account, image_pipeline

      | eval mad=`median_abs_dev(del_count)`, mz=0.6745*(del_count-med)/mad

      | eval outside_release_window=NOT in_release_window(_time)

      | where mz > 3.5 OR outside_release_window

      | table _time account userIdentity.arn awsRegion del_count mz | alert'
- question: Did the number of valid launchable images for a workload class, region, or recovery tier drop
    abruptly below its baseline, indicating a structural break in recovery-image availability rather than
    gradual lifecycle turnover?
  context: 'Beyond counting deletions, the defender cares whether recovery capability actually degraded.
    Track the number of valid launchable images per workload class, region, and recovery tier as a time
    series and detect abrupt drops below the baseline minimum using change-point detection (CUSUM/PELT/Bayesian
    online) rather than a static floor. Escalate sharp structural breaks or a concentration of deletions
    against images central to scaling or disaster recovery, and report the pre/post image count and affected
    workloads. In the Impact tactic, a sudden change-point in launchable-image coverage is direct evidence
    that an actor (or fault) has eroded the organization''s ability to scale or recover; a smooth, expected
    decline tied to normal pipeline turnover is benign. References: [Aminikhanghahi and Cook survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - EC2 image and snapshot inventories
  - EventBridge event history
  - CloudWatch metrics
  - 'NAI: Golden-image pipelines, AMIs referenced by launch templates and auto scaling groups, snapshot
    inventories backing restorable images, and EC2 administration activity in production accounts'
  range: Last 90 days (model the readiness time series continuously)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=ec2_image_inventory earliest=-90d

      | stats dc(imageId) as valid_images by workload_class, awsRegion, recovery_tier, _time

      | changepoint algorithm=PELT field=valid_images by workload_class, awsRegion, recovery_tier

      | where changepoint=1 AND valid_images < baseline_min

      | table _time workload_class awsRegion recovery_tier pre_count post_count affected_workloads | alert'
- question: Did a single principal generate a burst of AccessDenied/Client.UnauthorizedOperation errors
    on image and snapshot APIs (DeregisterImage, DeleteSnapshot, DescribeImages), or a denied-then-allowed
    destructive sequence, indicating discovery or partially blocked destruction before a successful call?
  context: 'Actors using stolen or under-privileged credentials often probe image/snapshot permissions
    before succeeding, producing clustered authorization failures that are a distinct, high-signal failure-mode
    indicator. Profile CloudTrail errorCode (AccessDenied, Client.UnauthorizedOperation) on DeregisterImage,
    DeleteSnapshot, and DescribeImages as its own signal, following the AccessDenied discovery analytic
    pattern. Alert on denial bursts (for example >=5 in 10 minutes) and on a denied-then-allowed destructive
    sequence where a principal is initially blocked and then succeeds. Surface counts of failed vs. succeeded
    operations. In the Impact tactic, a denial burst can reveal reconnaissance or a partially blocked
    attempt to destroy recovery images; a denied-then-allowed transition shows the actor found a path
    to complete the destructive action. References: [Splunk AccessDenied discovery analytic](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - EC2 image and snapshot inventories
  - EventBridge event history
  - CloudWatch metrics
  - 'NAI: Golden-image pipelines, AMIs referenced by launch templates and auto scaling groups, snapshot
    inventories backing restorable images, and EC2 administration activity in production accounts'
  range: Last 90 days (alert on a 10-minute sliding window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="ec2.amazonaws.com" eventName IN ("DeregisterImage","DeleteSnapshot","DescribeImages")

      | bin _time span=10m

      | stats count as total count(eval(errorCode IN ("AccessDenied","Client.UnauthorizedOperation")))
      as denied count(eval(isnull(errorCode))) as succeeded by userIdentity.arn, _time

      | eval denied_then_allowed=if(denied>0 AND succeeded>0,1,0)

      | where denied >= 5 OR denied_then_allowed=1

      | table _time userIdentity.arn denied succeeded denied_then_allowed | alert'
- question: Do graph- or sequence-based ML models flag the image-management activity as anomalous, for
    example a rare or newly formed user-role-resource-action edge created by a destructive call, an enumeration-then-delete
    sequence, or a rare verb-per-user with unusual geo/AS?
  context: 'Sophisticated actors blend destructive calls into otherwise normal activity, so model the
    structure and ordering of image management rather than raw counts. Represent CloudTrail image-management
    as a heterogeneous user-role-resource-action graph and flag the rare or newly formed edge a destructive
    call creates, using attention-based GNN aggregation or tripartite user-service-activity scoring. Complement
    with Elastic rare-API/population jobs that flag rare verb-per-user, unusual geo/AS, and identity-vs-error
    pairs, and Sentinel UEBA anomalous-resource-operation patterns. Surface the top-3 contributing features
    (for example rare principal-resource edge, image centrality, enumeration-then-delete sequence) in
    the alert text. Train and validate on flaws.cloud CloudTrail logs and Stratus Red Team emulation.
    In the Impact tactic, a high graph/sequence score points to an identity destroying images it has no
    historical or contextual reason to touch. References: [GNN IAM threat detection](https://arxiv.org/abs/2512.10280),
    [CS-GAD](https://arxiv.org/html/2409.12726v1), [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning),
    [Microsoft Sentinel anomalies](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference),
    [flaws.cloud CloudTrail logs](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/),
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team).'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - EC2 image and snapshot inventories
  - EventBridge event history
  - CloudWatch metrics
  - 'NAI: Golden-image pipelines, AMIs referenced by launch templates and auto scaling groups, snapshot
    inventories backing restorable images, and EC2 administration activity in production accounts'
  range: Last 90 days (build graph/sequences over 30-90 days; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Heterogeneous user-role-resource-action graph + rare-API/sequence models

      build_graph(nodes=[user, role, image_resource, action], edges=cloudtrail_calls, window=90d)

      | score gnn_attention(new_edge=principal->image:DeregisterImage) -> rare_edge_score

      ml rare_event(field=eventName, influencers=[userIdentity.arn, sourceIPAddress, awsRegion]) -> rare_verb_score

      | eval enum_then_delete=sequence_match("Describe*" -> "DeregisterImage|DeleteSnapshot")

      | where rare_edge_score>thr OR rare_verb_score>thr OR enum_then_delete=1

      | emit userIdentity.arn, shap_top3=[rare_edge, image_centrality, enum_then_delete]'
- question: After a recent DeregisterImage/DeleteSnapshot, did subsequent RunInstances or Auto Scaling
    launch attempts fail referencing the now-invalid or missing image ID (errorCode InvalidAMIID.NotFound
    or InvalidAMIID.Unavailable)?
  context: 'This question links the destructive cause to its operational effect: a deleted image breaking
    instance replacement is direct confirmation of Impact. Correlate recent DeregisterImage/DeleteSnapshot
    events with subsequent RunInstances or Auto Scaling launch failures referencing invalid or missing
    image IDs (errorCode InvalidAMIID.NotFound/InvalidAMIID.Unavailable), using the deterministic eventSource+eventName+errorCode
    rule pattern. Increase severity when failures affect internet-facing tiers, recovery procedures, or
    regulated production systems, and link the prior deletion event as the likely cause. A positive result
    shows the image deletion is actively preventing the environment from scaling or rebuilding; a negative
    result means launches still succeed and recovery paths remain intact. References: [SigmaHQ AWS CloudTrail
    rules](https://github.com/SigmaHQ/sigma/tree/master/rules/cloud/aws/cloudtrail), [AMI lifecycle reference](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/deregister-ami.html).'
  answer_sources:
  - CloudTrail management events
  - Auto Scaling activity history
  - EC2 instance state-change events
  - CloudWatch metrics
  - 'NAI: Auto scaling groups, launch templates, incident-recovery automation, and operational dashboards
    that show failed launches or reduced capacity after image deletion'
  range: Last 90 days (join deletion to launch failures within 24 hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="ec2.amazonaws.com" eventName IN ("RunInstances")

      | where errorCode IN ("InvalidAMIID.NotFound","InvalidAMIID.Unavailable")

      | join type=left imageId [ search source=cloudtrail eventName="DeregisterImage" earliest=-24h |
      fields imageId userIdentity.arn _time ]

      | lookup workload_inventory imageId OUTPUT internet_facing, in_recovery_proc, regulated

      | eval severity=if(internet_facing OR in_recovery_proc OR regulated,"high","medium")

      | table _time imageId failed_eventName prior_deregister_by prior_deregister_time severity | alert'
- question: Did incident-recovery automation, launch-template validation, or replacement workflows fail
    after an AMI deletion because the expected image ID no longer exists or is no longer launchable, while
    still being referenced by launch templates or Auto Scaling groups?
  context: Golden-image loss is most damaging when it silently breaks the very playbooks meant to restore
    service. Alert when incident-recovery automation, launch-template validation, or replacement workflows
    fail after an AMI deletion because the expected image ID no longer exists or is no longer launchable.
    Join on the deregistered image ID still referenced by launch templates or Auto Scaling groups, and
    present the prior image-destruction event as the root cause. In the Impact tactic, a recovery playbook
    failing on a missing golden image confirms the adversary achieved an inhibit-recovery effect; if no
    recovery workflow references the deleted image, the operational blast radius is limited.
  answer_sources:
  - CloudTrail management events
  - Auto Scaling activity history
  - EC2 instance state-change events
  - CloudWatch metrics
  - 'NAI: Auto scaling groups, launch templates, incident-recovery automation, and operational dashboards
    that show failed launches or reduced capacity after image deletion'
  range: Last 90 days (join workflow failures to prior deletion within 24 hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail (eventName IN ("RunInstances","CreateAutoScalingGroup","UpdateAutoScalingGroup")
      OR source=recovery_automation_logs status="failed")

      | where errorCode IN ("InvalidAMIID.NotFound","InvalidAMIID.Unavailable") OR failure_reason="image_not_launchable"

      | lookup launch_template_refs imageId OUTPUT referenced_by_lt, referenced_by_asg

      | join type=left imageId [ search source=cloudtrail eventName="DeregisterImage" earliest=-24h ]

      | where referenced_by_lt=true OR referenced_by_asg=true

      | table _time imageId failed_workflow referenced_by_lt referenced_by_asg root_cause_deregister |
      alert'
- question: Has the historical success rate of launches from standard images, or the count of valid AMIs
    per workload class, dropped suddenly below its baseline minimum, indicating degraded recovery readiness?
  context: 'This statistical view measures recovery readiness directly so degradation is caught even without
    a clean cause-and-effect join. Measure the historical success rate of launches from standard images
    and the count of valid AMIs per workload class, then flag sudden drops in launch success or restorable-image
    coverage using robust median/MAD thresholds and change-point detection over the readiness time series.
    Alert when a service has fewer valid images than its baseline minimum and report pre/post counts.
    In the Impact tactic, a sharp decline in launch success or restorable-image coverage signals that
    recovery capability has been eroded; stable readiness metrics indicate the environment can still scale
    and rebuild normally. References: [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    [Aminikhanghahi and Cook survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - CloudTrail management events
  - Auto Scaling activity history
  - EC2 instance state-change events
  - CloudWatch metrics
  - 'NAI: Auto scaling groups, launch templates, incident-recovery automation, and operational dashboards
    that show failed launches or reduced capacity after image deletion'
  range: Last 90 days (baseline 30-90 days; model readiness continuously)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventName="RunInstances" earliest=-90d

      | bin _time span=1h | stats count as launches count(eval(isnull(errorCode))) as succeeded by workload_class,
      _time

      | eval success_rate=succeeded/launches

      | appendcols [ search source=ec2_image_inventory | stats dc(imageId) as valid_images by workload_class,
      _time ]

      | eventstats median(success_rate) as med_sr median(valid_images) as med_imgs by workload_class

      | eval mz_sr=0.6745*(success_rate-med_sr)/`median_abs_dev(success_rate)`

      | changepoint field=valid_images by workload_class

      | where mz_sr < -3.5 OR (changepoint=1 AND valid_images < baseline_min)

      | table _time workload_class success_rate valid_images pre_count post_count | alert'
- question: Is the rate of failed launches (InvalidAMIID.* errors) or the gap between expected and achieved
    instance replacement per Auto Scaling group or recovery tier abnormally high, indicating a capacity
    shortfall caused by missing images?
  context: 'Failed-launch bursts are an explicit failure-mode signal analogous to AccessDenied bursts
    and reveal capacity that cannot be restored. Profile the rate of failed launches (InvalidAMIID.* errors)
    and compare expected versus achieved instance replacement per Auto Scaling group/recovery tier. Baseline
    image-management API volume and downstream launch counts as CloudWatch metrics with anomaly bands,
    and escalate when capacity restoration lags beyond the normal envelope, reporting failed vs. succeeded
    launch counts. In the Impact tactic, a burst of InvalidAMIID failures combined with under-replacement
    shows the deletion is causing a real availability shortfall; replacement tracking the desired count
    means the group is healthy despite any image changes. References: [Splunk AccessDenied discovery analytic](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/),
    [AWS CloudWatch ML](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/).'
  answer_sources:
  - CloudTrail management events
  - Auto Scaling activity history
  - EC2 instance state-change events
  - CloudWatch metrics
  - 'NAI: Auto scaling groups, launch templates, incident-recovery automation, and operational dashboards
    that show failed launches or reduced capacity after image deletion'
  range: Last 90 days (alert on rolling windows; compare desired vs. achieved capacity)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventName="RunInstances" OR source=autoscaling_activity

      | bin _time span=15m

      | stats count(eval(errorCode IN ("InvalidAMIID.NotFound","InvalidAMIID.Unavailable"))) as failed
      count(eval(isnull(errorCode))) as succeeded by asg_name, recovery_tier, _time

      | eval desired=lookup_desired_capacity(asg_name), achieved=succeeded, shortfall=desired-achieved

      | eventstats median(failed) as med by asg_name | eval mz=0.6745*(failed-med)/`median_abs_dev(failed)`

      | where mz > 3.5 OR shortfall > shortfall_baseline

      | table _time asg_name recovery_tier failed succeeded shortfall | alert'
- question: Does an anomaly-detection model over image-inventory changes and downstream launch telemetry
    indicate that AMI deletions are causing operational impact, weighting lost image centrality, launch-failure
    clustering, and timing relative to deletion events?
  context: 'When cause and effect are diffuse across many resources, an ML model can connect image deletions
    to the operational impact they produce. Apply anomaly detection across image-inventory changes and
    downstream launch telemetry to identify when image deletions are causing operational impact, using
    Elastic CloudTrail rare/population ML jobs with influencer surfacing and Sentinel UEBA unusual-operation-volume
    patterns. Weight features such as lost image centrality, launch-failure clustering, and timing relative
    to deletion events, and surface the top-3 contributors (deleted image ID, dependent ASG/template,
    failure cluster) in the alert. Validate against Stratus Red Team and flaws.cloud telemetry. In the
    Impact tactic, a high restoration-impairment score links a deletion to a measurable degradation in
    the ability to launch and recover; a low score indicates inventory changes without downstream harm.
    References: [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning),
    [Microsoft Sentinel anomalies](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference),
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team), [flaws.cloud](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/).'
  answer_sources:
  - CloudTrail management events
  - Auto Scaling activity history
  - EC2 instance state-change events
  - CloudWatch metrics
  - 'NAI: Auto scaling groups, launch templates, incident-recovery automation, and operational dashboards
    that show failed launches or reduced capacity after image deletion'
  range: Last 90 days (train on 30-90 days; score continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Restoration-impairment detector over image-inventory + launch telemetry

      featurize: [lost_image_centrality, launch_failure_cluster_size, time_since_deregister, dependent_asg_count,
      dependent_lt_count]

      ml population_anomaly(field=launch_failures, influencers=[imageId, asg_name, userIdentity.arn])
      -> impact_score

      | score elastic_rare_job(image_inventory_change) -> rare_change_score

      | where impact_score>thr OR rare_change_score>thr

      | emit shap_top3=[deleted_image_id, dependent_asg_or_template, failure_cluster]'
