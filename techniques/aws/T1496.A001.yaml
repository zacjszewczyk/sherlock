name: 'T1496.A001: Cloud Service Hijacking - SES Messaging'
id: 0893a9ef-d39e-4143-8f35-dbba58d5d5db
description: 'Investigate whether an adversary has hijacked Amazon Simple Email Service (SES) to send
  bulk unsolicited, phishing, or malware-delivery email by abusing the organization''s trusted cloud messaging
  reputation. This playbook helps an analyst detect when SES identities, configuration sets, or sending
  principals begin transmitting message volumes, recipient patterns, attachment types, or content themes
  inconsistent with sanctioned business workflows, and when control-plane changes (identity policies,
  DKIM/domain verification, configuration sets, SMTP credentials) precede a send burst in the classic
  validate-then-abuse sequence. It also covers the downstream operational impact of such abuse: domain-reputation
  degradation, complaint and bounce surges, suppression-list growth, sending throttles or account-under-review
  actions, abnormal SES (and downstream SNS/Firehose) spend, and evidence of malicious content delivery
  affecting external victims and business operations. Questions span symbolic-logic alerts, statistical
  baselining, and machine-learning approaches across CloudTrail, SES sending and event-publishing telemetry,
  CloudWatch, WAF, and cost/usage data.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any principal invoke SES send APIs (ses:SendEmail, SendRawEmail, SendBulkEmail) or SES
    identity/configuration changes (PutIdentityPolicy, CreateConfigurationSet, PutAccountSendingEnabled,
    VerifyDomainIdentity, SMTP-credential creation) from a source IP, ASN, region, or user agent that
    is not in that identity's 30-day allowlist, and was the call chained to a send burst within minutes?
  context: This targets the validate-then-abuse control-plane sequence used to hijack SES for spam, phishing,
    or malware delivery, which maps to the Impact tactic because successful abuse leverages the organization's
    mail reputation to harm downstream victims and operations. The analyst is looking for SES send or
    identity/config API calls issued by a principal, source IP, ASN, region, or user agent that falls
    outside the identity's established 30-day allowlist, especially when an identity/config change is
    immediately followed (within minutes) by a send burst. Correlate with credential-takeover precursors
    and impossible-travel on the originating console login or AssumeRole event. A positive result (anomalous
    principal/source chained to a burst) strongly suggests stolen-credential abuse; a negative result
    (calls from known automation roles/IPs at normal cadence) is likely sanctioned activity.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: SES identities approved for outbound messaging, automation roles capable of sending email, applications
    integrated with SES, and domains whose reputation would amplify phishing or spam impact'
  range: Last 90 days (correlate identity/config change and send burst within a 15-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloudtrail WHERE eventSource=''ses.amazonaws.com'' AND eventName IN (''SendEmail'',''SendRawEmail'',''SendBulkEmail'',''PutIdentityPolicy'',''CreateConfigurationSet'',''PutAccountSendingEnabled'',''VerifyDomainIdentity'',''CreateSmtpCredentials'')

      | ENRICH identity_allowlist_30d(identityArn) -> {ips, asns, regions, userAgents}

      | WHERE sourceIPAddress NOT IN allowlist.ips OR asn(sourceIPAddress) NOT IN allowlist.asns OR awsRegion
      NOT IN allowlist.regions OR userAgent NOT IN allowlist.userAgents

      | JOIN send_events s ON principalId WHERE s.time BETWEEN change.time AND change.time + 15m

      | ENRICH impossible_travel(login_or_assumerole_event)

      | ALERT ''Anomalous SES API + send burst from out-of-allowlist principal/source'''
- question: Did the same principal modify SES identity policies, configuration sets, DKIM/domain-verification
    settings, email templates, or SMTP credentials and then trigger a send burst, or did GuardDuty raise
    IAM anomaly/malicious-IP/Tor/CloudTrail-disabled findings on the sending principal?
  context: 'Identity tampering immediately before mail abuse indicates preparation to weaponize the tenant''s
    mail reputation, which is the core of Impact via SES hijacking. The analyst should look for an ordering
    where one principal changes identity policies, configuration sets, DKIM/domain verification, templates,
    or SMTP credentials and then begins sending. Reinforce with GuardDuty findings on that same principal:
    Impact:IAMUser/AnomalousBehavior, Recon:IAMUser/MaliciousIPCaller, Recon:IAMUser/TorIPCaller, or Stealth:IAMUser/CloudTrailLoggingDisabled.
    A positive match (change-then-send by the same actor, especially with a GuardDuty finding) is high-confidence
    hijack preparation; a negative result means config changes and sends are decoupled or from trusted
    automation.'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: SES identities approved for outbound messaging, automation roles capable of sending email, applications
    integrated with SES, and domains whose reputation would amplify phishing or spam impact'
  range: Last 90 days (sequence change-then-send within minutes to hours)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cloudtrail WHERE eventSource=''ses.amazonaws.com'' AND eventName IN (''PutIdentityPolicy'',''CreateConfigurationSet'',''UpdateConfigurationSet'',''PutEmailIdentityDkimAttributes'',''VerifyDomainIdentity'',''CreateTemplate'',''UpdateTemplate'',''CreateSmtpCredentials'')
      AS changes

      | JOIN (FROM cloudtrail WHERE eventName IN (''SendEmail'',''SendRawEmail'',''SendBulkEmail'')) AS
      sends ON changes.userIdentity.principalId = sends.userIdentity.principalId AND sends.time BETWEEN
      changes.time AND changes.time + 60m

      | LEFT JOIN guardduty WHERE finding IN (''Impact:IAMUser/AnomalousBehavior'',''Recon:IAMUser/MaliciousIPCaller'',''Recon:IAMUser/TorIPCaller'',''Stealth:IAMUser/CloudTrailLoggingDisabled'')
      ON principalId

      | ALERT ''SES identity tampering then send burst by same principal'''
- question: Did the SES account or any identity breach the hard reputation floor of bounce rate >= 5%
    or complaint rate >= 0.1%, or approach the configured max-send-rate or daily sending quota?
  context: These are the exact thresholds AWS itself uses to place an account under review or pause sending,
    so they form a deterministic, non-tunable impact floor for the Impact tactic. The analyst checks whether
    bounce rate reaches or exceeds 5%, complaint rate reaches or exceeds 0.1%, or the send rate approaches
    the configured max-send-rate / daily quota. Crossing these floors means real reputational and deliverability
    harm is already occurring or imminent. Keep this rule as a deterministic floor and run statistical/ML
    detections in parallel for earlier warning. A positive result demands immediate triage of what was
    sent and by whom; a negative result does not clear the account because abuse can occur below these
    floors.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: SES identities approved for outbound messaging, automation roles capable of sending email, applications
    integrated with SES, and domains whose reputation would amplify phishing or spam impact'
  range: Last 90 days (evaluate on rolling reputation windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM ses_reputation_metrics

      | WHERE bounce_rate >= 0.05 OR complaint_rate >= 0.001 OR send_rate >= 0.9*max_send_rate OR daily_sent
      >= 0.9*daily_quota

      | ALERT severity=high ''SES hard reputation/quota floor breached'' (non-tunable deterministic floor)'
- question: For each SES identity, configuration set, or principal, do hourly send count/bytes (Volume),
    send rate vs quota (Frequency), unique-recipient count and destination-domain entropy (Diversity),
    or bounce/complaint/reject rates (State) exceed the historical baseline (95th-99th percentile or robust
    MAD z-score over >= 30 days)?
  context: 'This statistical baselining detects SES abuse for the Impact tactic before the hard reputation
    floor trips. The analyst baselines four feature families per identity/configuration-set/principal:
    Volume (hourly send count and bytes), Frequency (send rate vs quota), Diversity (unique recipients
    and destination-domain entropy), and State (bounce/complaint/reject rates). Flag identities exceeding
    the 95th-99th percentile or a robust MAD z-score computed over at least 30 days. For near-constant
    transactional identities, treat a 3-5x spike or a sudden recipient-domain entropy jump as significant.
    Rank candidates with Directed Anomaly Scoring to bound alert volume, use burstiness/temporal clustering
    as a change-point trigger, and surface the top-3 deviating features in the alert. Positive results
    pinpoint which identity and feature deviated; negatives indicate steady-state sending.'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: SES identities approved for outbound messaging, automation roles capable of sending email, applications
    integrated with SES, and domains whose reputation would amplify phishing or spam impact'
  range: Last 90 days (baseline over >= 30 days, evaluate hourly)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM ses_event_publishing

      | STATS hourly_count, hourly_bytes, send_rate, dc(recipient) AS uniq_recipients, entropy(dest_domain)
      AS domain_entropy, bounce_rate, complaint_rate, reject_rate BY identity, config_set, principal,
      bin(1h)

      | JOIN baseline_30d ON identity,config_set,principal

      | EVAL z = mad_zscore(metric, baseline); pctl = percentile_rank(metric, baseline)

      | WHERE pctl >= 0.95 OR z >= 3.5 OR (transactional AND metric >= 3*baseline_median) OR domain_entropy_jump

      | RANK BY directed_anomaly_score | OUTPUT top_3_deviating_features'
- question: Do any SES sends go to a recipient set that deviates sharply from the sending identity's historical
    contact graph?
  context: A sudden departure from an identity's normal recipients is a primary signal for hijacked-identity
    campaigns and a strong Impact indicator. The analyst builds each sending identity's historical recipient/contact
    graph (recipient addresses and destination domains it normally mails) and flags sends whose recipient
    set diverges sharply from that graph, e.g., a transactional identity that normally mails a small known
    set suddenly blasting thousands of new external domains. A positive result (large novel recipient
    set inconsistent with history) suggests the identity is being used for an unsanctioned campaign; a
    negative result means recipients align with established contacts.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: SES identities approved for outbound messaging, automation roles capable of sending email, applications
    integrated with SES, and domains whose reputation would amplify phishing or spam impact'
  range: Last 90 days (build contact graph over >= 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM ses_event_publishing

      | BUILD contact_graph(identity) OVER last_30d = {recipients, dest_domains}

      | FOR each_send: novelty = fraction(recipients NOT IN contact_graph.recipients) , new_domains =
      count(dest_domain NOT IN contact_graph.dest_domains)

      | WHERE novelty >= 0.8 OR new_domains >= threshold

      | ALERT ''Recipient-graph deviation from historical contacts'''
- question: Do outbound SES message bodies and subjects classify as abusive (spam, phishing, or malware-lure)
    content, with explainable models surfacing the specific deception features driving the verdict?
  context: 'Content classification distinguishes hijack-driven abuse from sanctioned bulk mail for the
    Impact tactic, and explainability lets analysts trust and act on the verdict. The analyst classifies
    outbound message bodies/subjects using models that emit the top contributing deception features in
    the alert text, not just a score: GPT-4 prompting that returns a per-message rationale (ChatSpamDetector),
    LIME/SHAP-instrumented classifiers, LIME+attention DistilBERT for urgency/lure phrasing, and per-sender
    stylometric drift. Combine these with a random forest over recipient-unlikelihood, URL-risk, and phishing-intent
    features to separate hijack from legitimate marketing. A positive result (high abuse probability plus
    phishing/urgency/malicious-URL features) indicates weaponized mail; a negative result indicates benign
    transactional or marketing content.'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - Amazon CloudWatch metrics
  - AWS Cost and Usage Report
  - 'NAI: SES identities approved for outbound messaging, automation roles capable of sending email, applications
    integrated with SES, and domains whose reputation would amplify phishing or spam impact'
  range: Last 90 days (score messages at send time / near real time)
  queries:
  - technology: ML/pseudocode
    query: "model = explainable_classifier(message.subject, message.body)\nscore, top_features = model.predict_with_explanation()\
      \  # GPT-4 rationale / LIME / SHAP / DistilBERT+attention\nrf = random_forest([recipient_unlikelihood,\
      \ url_risk, phishing_intent, stylometric_drift])\nIF score >= threshold OR rf.prob >= threshold:\n\
      \    ALERT 'Abusive SES campaign content' WITH top_features"
- question: Was SES activity followed by sudden complaint, bounce, suppression-list, reputation-dashboard,
    or sending-limit/throttle anomalies, particularly when the same principal recently changed identity
    policies, domain verification, or SMTP credentials?
  context: This captures reputation damage that follows a service hijack, the realized harm under the
    Impact tactic. The analyst looks for SES sending activity that is shortly followed by spikes in complaints,
    bounces, suppression-list growth, reputation-dashboard degradation, or new sending-limit/throttle
    actions, and weights it heavily when the same principal recently altered identity policies, domain
    verification, or SMTP credentials. The SES-enforced bounce >= 5% / complaint >= 0.1% breach is treated
    as a deterministic impact trip. A positive result confirms downstream reputational impact from suspect
    sending; a negative result suggests reputation metrics remain within normal bounds.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - AWS WAF logs
  - AWS Cost and Usage Report
  - 'NAI: Email identities tied to corporate domains, sending pipelines exposed through web applications
    or APIs, and monitoring for bounce, complaint, and unsubscribe anomalies that indicate reputation
    damage'
  range: Last 90 days (correlate sends with reputation metrics over following hours/days)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM ses_reputation_metrics, ses_event_publishing

      | DETECT spike IN (complaint_rate, bounce_rate, suppression_list_growth, reputation_dashboard, sending_limit_throttle)
      AFTER recent send activity

      | LEFT JOIN cloudtrail changes WHERE eventName IN (''PutIdentityPolicy'',''VerifyDomainIdentity'',''CreateSmtpCredentials'')
      BY principalId WITHIN prior_24h

      | EVAL deterministic_trip = (bounce_rate>=0.05 OR complaint_rate>=0.001)

      | ALERT ''Reputation damage after SES hijack'''
- question: Did suspicious SES campaigns coincide with abrupt SES (and downstream Firehose/SNS) spend
    growth, daily-quota exhaustion, account-under-review/pause actions, or application failures from SES
    throttling?
  context: Mail abuse that expands into cost and quota impact mirrors documented cloud-service hijacking
    monetization patterns and represents tangible Impact harm. The analyst checks whether suspect campaigns
    line up with sudden SES (and downstream Firehose/SNS) spend increases, exhaustion of the daily sending
    quota, account-under-review or pause actions, or application errors caused by SES throttling. A positive
    result (campaign plus spend/quota/throttle impact) confirms the abuse is consuming resources and disrupting
    operations; a negative result indicates spend and quota remain nominal.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - AWS WAF logs
  - AWS Cost and Usage Report
  - 'NAI: Email identities tied to corporate domains, sending pipelines exposed through web applications
    or APIs, and monitoring for bounce, complaint, and unsubscribe anomalies that indicate reputation
    damage'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM cost_and_usage_report, ses_sending_metrics, cloudtrail

      | DETECT abrupt_growth(ses_spend, firehose_spend, sns_spend) OR daily_quota_exhausted OR eventName
      IN (''UpdateAccountSendingEnabled(false)'',''account_under_review'',''PauseSending'') OR app_error(SES
      throttling)

      | WHERE coincides_with(suspicious_campaign)

      | ALERT ''SES mail abuse expanding into cost/quota impact'''
- question: For each SES identity, do reject rate, bounce rate, complaint rate, suppression-list growth,
    send rejections (AccessDenied/throttling), or destination-domain skew materially exceed the identity's
    historical baseline?
  context: These distinct failure-mode signals spike before reputation fully collapses, giving early Impact
    warning. The analyst profiles reject rate, bounce rate, complaint rate, suppression-list growth, send
    rejections (AccessDenied/throttling), and destination-domain skew against each identity's historical
    baseline derived over at least 30 days, recognizing that transactional senders tolerate far lower
    complaint variance than marketing senders. Flag campaigns whose negative-feedback or deliverability
    degradation materially exceeds normal thresholds. A positive result isolates which failure mode and
    identity is degrading; a negative result indicates deliverability metrics are within historical norms.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - AWS WAF logs
  - AWS Cost and Usage Report
  - 'NAI: Email identities tied to corporate domains, sending pipelines exposed through web applications
    or APIs, and monitoring for bounce, complaint, and unsubscribe anomalies that indicate reputation
    damage'
  range: Last 90 days (baseline over >= 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM ses_event_publishing

      | STATS reject_rate, bounce_rate, complaint_rate, suppression_growth, access_denied_or_throttle_rate,
      skew(dest_domain) BY identity, bin(1h)

      | JOIN baseline_30d ON identity (sender_class IN {transactional, marketing})

      | WHERE metric materially_exceeds baseline_threshold(sender_class)

      | ALERT ''SES failure-mode / deliverability anomaly'' WITH offending_metric'
- question: Does an AWS Cost Anomaly Detection monitor scoped to SES report spend anomalies exceeding
    an absolute (> $X) or relative (> N% of baseline) threshold?
  context: Cost anomaly detection provides a robust, lagging confirmation of Impact impact with root-cause
    breakdown and dollar figures. The analyst scopes an AWS Cost Anomaly Detection monitor to SES and
    subscribes to alerts on anomalies exceeding an absolute dollar threshold (> $X) or a relative threshold
    (> N% of baseline). A positive result (a flagged SES cost anomaly) corroborates abusive sending volume
    and quantifies the financial impact; a negative result indicates SES spend tracks expected patterns.
    Because cost signals lag, pair this with the real-time symbolic and statistical detections above.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - AWS WAF logs
  - AWS Cost and Usage Report
  - 'NAI: Email identities tied to corporate domains, sending pipelines exposed through web applications
    or APIs, and monitoring for bounce, complaint, and unsubscribe anomalies that indicate reputation
    damage'
  range: Last 90 days (Cost Anomaly Detection daily evaluation)
  queries:
  - technology: AWS Cost Anomaly Detection/pseudocode
    query: 'aws ce create-anomaly-monitor --monitor scope=SERVICE:''Amazon Simple Email Service''

      aws ce create-anomaly-subscription --threshold ABSOLUTE>$X OR RELATIVE>N%

      ON anomaly: ALERT ''SES cost anomaly'' WITH root_cause_breakdown, dollar_impact'
- question: Does an online autoencoder ensemble over streaming SES event/usage features (send rate, recipient
    entropy, bounce/complaint/reject, spend) show reconstruction-error spikes, and do these fuse with
    GuardDuty ML anomaly findings on the sending principal to predict impactful hijacking?
  context: An unsupervised, streaming predictor catches novel Impact hijack shapes without labels and
    surfaces explanations for triage. The analyst applies an online autoencoder ensemble (e.g., Kitsune-style)
    to streaming SES event/usage features (send rate, recipient entropy, bounce/complaint/reject rates,
    spend) and alerts on reconstruction-error spikes, surfacing the top-3 contributing features. Fuse
    this with GuardDuty ML anomaly findings on the sending principal and weight recent policy changes,
    sender drift, feedback telemetry, and bursty cross-domain delivery to predict whether SES usage reflects
    impactful hijacking. A positive result (high reconstruction error plus corroborating GuardDuty/feature
    signals) predicts active hijacking; a negative result indicates usage matches the learned normal profile.
  answer_sources:
  - AWS CloudTrail management events
  - Amazon SES sending metrics
  - Amazon SES event publishing logs
  - AWS WAF logs
  - AWS Cost and Usage Report
  - 'NAI: Email identities tied to corporate domains, sending pipelines exposed through web applications
    or APIs, and monitoring for bounce, complaint, and unsubscribe anomalies that indicate reputation
    damage'
  range: Last 90 days (streaming/online scoring)
  queries:
  - technology: ML/pseudocode
    query: "stream = ses_event_usage_features(send_rate, recipient_entropy, bounce_rate, complaint_rate,\
      \ reject_rate, spend)\nae = OnlineAutoencoderEnsemble()  # Kitsune-style, unsupervised\nFOR x IN\
      \ stream:\n    err = ae.score(x); ae.update(x)\n    IF err >= dynamic_threshold:\n        feats\
      \ = top_3_contributing_features(x)\n        fused = combine(err, guardduty_ml_finding(principal),\
      \ weight(recent_policy_change, sender_drift, feedback, cross_domain_burst))\n        IF fused >=\
      \ threshold: ALERT 'Predicted impactful SES hijacking' WITH feats"
