name: 'T1491.A001: Subdomain Takeover'
id: 8b6a4236-677a-4fbe-86f9-711d68df8397
description: Investigate whether an adversary has hijacked an exposed AWS-backed subdomain by exploiting
  a dangling DNS record and then used the reclaimed hostname to deface trusted organizational content
  or redirect users to adversary-controlled infrastructure. This playbook helps an analyst determine if
  a public Route 53 record still points at a deleted, unclaimed, or no-longer-owned AWS resource (S3 website
  bucket, CloudFront distribution, Elastic Beanstalk environment, or released Elastic IP) that an adversary
  has re-created to take over the subdomain. It correlates control-plane evidence (CloudTrail record/resource
  lifecycle, first-seen and rare API activity), DNS and resource-existence enumeration, Certificate Transparency
  monitoring, content and DOM integrity diffs, and edge-traffic analytics (WAF, CloudFront, Zeek http.log)
  to surface reclamation and the trust-targeting content -- impersonated login pages, scam pages, malicious
  downloads, mass redirects -- that the adversary serves to create visible operational and reputational
  impact. Methods span symbolic-logic detections, statistical baselining, and machine learning to give
  the SOC granular, defensible coverage of subdomain takeover.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: For every public Route 53 alias, CNAME, A, or PTR record, does the backing AWS resource still
    exist and remain owned by the organization, or does the hostname resolve while the target returns
    an unclaimed-resource fingerprint (for example S3 'NoSuchBucket'/'The specified bucket does not exist',
    or a CloudFront/Elastic Beanstalk 404 indicating no such app or environment)?
  context: 'Subdomain takeover begins with a dangling DNS record: the record resolves but the AWS resource
    it points to has been deleted or released, letting an adversary re-create a resource with the same
    name and serve content under a trusted hostname. To deliver Impact, the attacker first needs that
    exploitable gap. Enumerate every Route 53 alias/CNAME/A record, deterministically test whether the
    backing AWS resource still exists and is owned by the org, and alert when a record resolves but the
    target returns an unclaimed-resource fingerprint. Use the Dare-A/CNAME/NS taxonomy from ''All Your
    DNS Records Point to Us'', the automated takeover detector from ''Can I Take Your Subdomain?'', and
    provider signatures from can-i-take-over-xyz. Run at least daily and on every record/resource deletion.
    A positive result means a dangling, takeover-prone record exists; a negative result means records
    resolve to owned, live resources.'
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (run at least daily and on every record/resource deletion)
  queries:
  - technology: DNS/HTTP probe pseudocode
    query: |
      for record in route53_records(type in [ALIAS,CNAME,A,PTR]):
        target = resolve(record)
        if record.resolves and not aws_resource_exists_and_owned(target):
          fp = http_fingerprint(record.hostname)
          if fp matches ['NoSuchBucket','The specified bucket does not exist',
                         'no such app','no such environment', cloudfront_404]:
            alert(record.hostname, target, fp, severity=high)
- question: Does CloudTrail show a backing resource being deleted (DeleteBucket, DeleteDistribution, TerminateEnvironment,
    ReleaseAddress) while the Route 53 record that referenced it is NOT removed within a short window
    (for example 24 hours), or any suspicious Route 53 ChangeResourceRecordSets, DeleteHostedZone, or
    DisableDomainTransferLock event?
  context: 'The dangling-record condition that enables takeover is directly observable on the control
    plane as a lifecycle violation: the resource is destroyed but its DNS pointer survives. Reconstruct
    this from CloudTrail by flagging the pattern where a backing resource is deleted while the referencing
    Route 53 record is not cleaned up within a short window (e.g., 24h), and alert on Route 53 ChangeResourceRecordSets
    / DeleteHostedZone / DisableDomainTransferLock events following the SigmaHQ Route 53 rule selector
    pattern, accounting for the registrar/delegation-drift risks described in Domijn. A positive result
    identifies the exact moment a record became dangling and who caused it; a negative result indicates
    records are decommissioned alongside their resources. This is tactic-specific to Impact because it
    catches the precondition the adversary needs to reclaim and deface a hostname.'
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (correlate delete and record-removal within a 24-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |
      source=cloudtrail eventName in (DeleteBucket,DeleteDistribution,TerminateEnvironment,ReleaseAddress) as del
      | join target_resource [ search source=cloudtrail eventSource=route53.amazonaws.com
          eventName=ChangeResourceRecordSets action=DELETE ] as recdel
      | where isnull(recdel) OR (recdel._time - del._time) > 24h
      | append [ search source=cloudtrail eventSource=route53.amazonaws.com
          eventName in (DeleteHostedZone,DisableDomainTransferLock,ChangeResourceRecordSets) ]
      | table _time userIdentity.arn eventName target_resource sourceIPAddress | alert
- question: Has any newly issued certificate appeared in Certificate Transparency logs covering an owned
    subdomain whose issuer, key, or issuing account does not match the approved AWS ACM / corporate CA
    baseline, especially for a hostname that was previously dangling?
  context: When an adversary reclaims a subdomain, they typically obtain a fresh domain-validated (DV)
    certificate for it, which is publicly visible in Certificate Transparency logs before any defacement
    is observed on-site. Monitor CT logs for any new certificate covering an owned subdomain whose issuer,
    key, or account deviates from the approved ACM / corporate CA inventory, and treat an unexpected DV
    cert for a previously dangling hostname as high-severity reclamation, per Cloud Strife and the CT-completeness
    analysis in 'Does Certificate Transparency Break the Web?'. A positive result is strong early evidence
    that someone outside the org's PKI now controls the hostname -- a precursor to trust-targeting Impact;
    a negative result means certificate issuance stays within the approved baseline.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (evaluate continuously as CT entries arrive)
  queries:
  - technology: CT-monitor pseudocode
    query: |
      stream ct_logs(domains=owned_subdomains)
      | for each new_cert:
        if new_cert.issuer not in approved_ca_baseline
           OR new_cert.account not in approved_acm_accounts
           OR new_cert.key not in approved_keys:
          sev = high if new_cert.hostname in previously_dangling else medium
          alert(new_cert.hostname, new_cert.issuer, new_cert.serial, sev)
- question: For each externally exposed subdomain, has the live HTTP status code, TLS certificate issuer/key,
    content hash, redirect destination, or response-header set abruptly deviated from its own historical
    baseline -- in particular a transition from resolving-but-404/'NoSuchBucket' to resolving-with-200?
  context: 'Reclamation produces a measurable, host-specific change: a hostname that was failing (404
    / NoSuchBucket) starts returning 200 with new content, a new certificate, or new redirect behavior.
    Baseline per exposed subdomain the expected status codes, TLS issuer/key, content hashes, redirect
    destinations, and response headers from a window of legitimate snapshots, then flag hostnames whose
    properties abruptly deviate from the historical norm, with a specific high-confidence rule for the
    failure-mode transition from resolving-but-404/NoSuchBucket to resolving-with-200, which marks reclamation
    (''All Your DNS Records Point to Us''; ''Can I Take Your Subdomain?''). Derive per-host thresholds
    from each site''s own baseline variance to suppress benign churn. A positive result signals a hostname
    has come back to life under new control; a negative result reflects stable, expected content.'
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (baseline from prior snapshots; evaluate per probe)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |
      source=http_probe earliest=-90d
      | stats baseline by hostname: mode(status) values(tls_issuer) values(tls_key)
          values(content_hash) values(redirect_dest) values(headers)
      | eval changed = (status != baseline_status) OR (tls_issuer != baseline_issuer)
          OR (content_hash NOT in baseline_hashes) OR (redirect_dest != baseline_redirect)
      | eval reclamation = (prev_status in (404,'NoSuchBucket') AND status==200)
      | where changed OR reclamation | table hostname status tls_issuer content_hash | alert
- question: Does a weighted DOM tree-edit/disparity score between the approved baseline snapshot and the
    live page for a branded hostname exceed the tolerance tuned to ignore benign dynamic content, and
    which node subtrees changed?
  context: Even when status codes and certificates look plausible, defacement shows up as structural divergence
    in the page's DOM relative to the approved baseline. Compute a weighted DOM tree-edit/disparity score
    between the baseline snapshot and the live page for each branded hostname using HDNA, and alert when
    structural disparity exceeds a tolerance tuned to ignore benign dynamic content (ads, timestamps,
    personalization), surfacing the changed node subtrees in the alert so analysts see exactly what was
    altered. A positive result indicates the page structure no longer matches the approved content --
    consistent with defacement Impact on a reclaimed host; a negative result means the live page is structurally
    faithful to the baseline.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (diff live page against approved baseline snapshot)
  queries:
  - technology: Content-integrity pseudocode
    query: |
      for hostname in branded_hostnames:
        base = approved_baseline_snapshot(hostname)
        live = fetch_dom(hostname)
        score = weighted_tree_edit_disparity(base, live)   // HDNA
        if score > tolerance(hostname):   // tuned to ignore benign dynamic content
          alert(hostname, score, changed_subtrees=diff_nodes(base,live))
- question: Did an identity issue takeover-relevant control-plane actions it has never used before --
    for example first-seen Route 53 ChangeResourceRecordSets / DeleteHostedZone, or S3 PutObject / PutBucketWebsite
    against a website bucket -- and from what source ASN/geo?
  context: Hijacking or repointing a subdomain often requires control-plane actions that the abusing principal
    has never legitimately performed. Baseline per-principal CloudTrail API actions over an N-day lookback
    and alert on first-seen (principal, action) pairs for Route 53 ChangeResourceRecordSets/DeleteHostedZone
    or S3 PutObject/PutBucketWebsite to a website bucket, using the Netflix cloudtrail-anomaly approach,
    and include the deviating principal, action, and source ASN/geo in the alert. A positive result flags
    an identity manipulating DNS or website content in a way it never has before -- a hallmark of takeover
    setup or defacement; a negative result confirms the activity is consistent with the principal's established
    behavior. This ties to Impact because these are the exact write actions used to seize and deface a
    hostname.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (build per-principal baseline over N days; evaluate per event)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |
      source=cloudtrail earliest=-Nd
      | where eventName in (ChangeResourceRecordSets,DeleteHostedZone,PutObject,PutBucketWebsite)
      | stats earliest(_time) as first_seen by userIdentity.arn, eventName, resource
      | where first_seen >= now()-window AND (userIdentity.arn,eventName) NOT in principal_baseline
      | eval is_website_bucket = lookup(resource).website_enabled
      | where eventName in (ChangeResourceRecordSets,DeleteHostedZone) OR is_website_bucket
      | table userIdentity.arn eventName resource sourceIPAddress src_asn src_geo | alert
- question: When fetched page content and screenshots for branded subdomains are rendered and scored by
    an image-based defacement classifier, are any pages classified as defacements, and what are the top-3
    contributing features (visual class, lexical similarity to a branded login page, outbound-link anomaly)?
  context: Takeover defacements are served from attacker infrastructure, so on-server file-integrity checks
    miss them entirely -- the only reliable view is rendering the page as a user sees it. Render fetched
    content and screenshots for branded subdomains and apply image-based defacement recognition (stacked
    autoencoders + DNN) per Meerkat, complemented with content-feature classification of HTML/redirect
    chains from the 'Can I Take Your Subdomain?' takeover features. The alert must list the top-3 contributing
    features (e.g., visual class, lexical similarity to a branded login page, outbound-link anomaly) so
    analysts can triage quickly. A positive result means a branded hostname is visually/structurally consistent
    with a defacement or phishing clone served by an adversary; a negative result means the rendered page
    matches expected legitimate appearance.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (score rendered captures continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: |
      for hostname in branded_subdomains:
        img = render_screenshot(hostname); html = fetch(hostname)
        visual = meerkat_defacement_model(img)        // stacked autoencoders + DNN
        content = takeover_feature_classifier(html, redirect_chain(hostname))
        score = combine(visual, content)
        if score > threshold:
          alert(hostname, score, top3=feature_importance(visual,content))
- question: Does rare-function / population analysis over CloudTrail surface unusual Route 53 / S3 / CloudFront
    API calls, geographies, ASNs, or user-command pairs that could create or exploit a dangling record,
    and what are the top influencers?
  context: Sophisticated actors blend takeover steps into otherwise normal activity, so threshold rules
    can miss them; population and rare-event modeling catches the statistically unusual API/geo/command
    combinations. Apply rare-function/population analysis over CloudTrail to surface unusual Route 53/S3/CloudFront
    API calls, geographies/ASNs, and user-command pairs that create or exploit a dangling record, per
    Elastic CloudTrail ML, and surface the top influencers in the alert for triage. A positive result
    highlights control-plane behavior that is anomalous relative to the population and warrants investigation
    as possible takeover setup or defacement; a negative result indicates the API usage falls within normal
    population behavior. For Impact, this provides explainable, low-floor coverage of the actions that
    precede and execute a subdomain hijack.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - Amazon CloudFront access logs
  - Amazon S3 server access logs
  - Certificate Transparency logs
  - Active DNS resolution / HTTP probe results
  - 'NAI: Public Route 53 hosted zones, subdomains mapped to S3 website endpoints, CloudFront distributions,
    or Elastic Beanstalk, externally reachable branded hostnames, and the org''s approved ACM certificate
    inventory'
  range: Last 90 days (train ML jobs on 30-90 days; score continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: |
      source=cloudtrail earliest=-90d eventSource in (route53,s3,cloudfront).amazonaws.com
      | ml population_rare(field=eventName,
          by=[userIdentity.arn, sourceIPAddress, awsRegion, src_asn],
          influencers=[userIdentity.arn, sourceIPAddress, src_geo, userAgent]) -> rare_score
      | where rare_score > threshold
      | table userIdentity.arn eventName sourceIPAddress src_geo top_influencers | alert
- question: Has a subdomain associated with a deleted or missing AWS resource begun serving new login
    forms, executable downloads, mass redirects, or messaging that is inconsistent with the legitimate
    business function of that hostname?
  context: 'The Impact of a subdomain takeover is realized when the hijacked hostname starts serving trust-abusing
    content: impersonated login pages to harvest credentials, malicious downloads, scam pages, or redirects
    to phishing infrastructure. Alert when a subdomain tied to a deleted or missing AWS resource begins
    serving new login forms, executable downloads, mass redirects, or messaging inconsistent with that
    hostname''s business function, and correlate with the dangling-record state from ''All Your DNS Records
    Point to Us'' and the takeover fingerprints in can-i-take-over-xyz. A positive result confirms the
    adversary is actively weaponizing the reclaimed hostname against users and the brand; a negative result
    means content remains consistent with the host''s intended purpose.'
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - AWS WAF logs
  - Amazon CloudFront access logs
  - Zeek http.log / web server access logs
  - 'NAI: High-visibility public web properties, subdomains linked from corporate communications, and
    protective edge telemetry (WAF, CloudFront, Zeek http.log) around services receiving user traffic'
  range: Last 90 days (correlate content change with dangling-record state)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |
      source=(zeek_http OR web_access_log)
      | join hostname [ search dangling_record_state where resource_state in (deleted,missing) ]
      | eval new_login = match(body,'(?i)<form[^>]*password')
      | eval exe_download = match(uri,'(?i)\.(exe|msi|dmg|apk|scr)$')
      | eval mass_redirect = (status in (301,302) AND redirect_dest NOT in approved_redirects)
      | eval offbrand = content_inconsistent_with_business_function(hostname,body)
      | where new_login OR exe_download OR mass_redirect OR offbrand
      | table hostname uri status redirect_dest | alert
- question: Immediately after a hostname begins serving different content, does inbound request volume,
    credential-post attempts, geo-diverse traffic, or the POST-to-GET ratio rise sharply (for example
    >3-sigma over the per-host baseline, or a step change) in WAF / CloudFront / Zeek logs?
  context: A successful takeover that is being exploited typically drives a measurable shift in edge traffic
    -- victims being redirected in, credentials being posted to a fake login, or a surge of geo-diverse
    traffic. Measure Volume (requests/min, bytes in/out, POST body sizes), Frequency (count/min per source),
    and State (HTTP 2xx/3xx/4xx mix, login success/fail) per subdomain from WAF/CloudFront/Zeek logs,
    and raise severity when inbound request volume, credential-post attempts, or geo-diverse traffic rise
    sharply (e.g., >3-sigma over the per-host baseline, or a step change in the POST-to-GET ratio) immediately
    after the hostname begins serving different content. Derive sigma thresholds from each host's own
    history. A positive result indicates the reclaimed hostname is generating operational Impact and likely
    harvesting credentials; a negative result shows traffic remains within normal bounds.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - AWS WAF logs
  - Amazon CloudFront access logs
  - Zeek http.log / web server access logs
  - 'NAI: High-visibility public web properties, subdomains linked from corporate communications, and
    protective edge telemetry (WAF, CloudFront, Zeek http.log) around services receiving user traffic'
  range: Last 90 days (baseline per host; evaluate around content-change events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |
      source=(waf OR cloudfront OR zeek_http) earliest=-90d
      | bin _time span=1m
      | stats count as req sum(bytes_in) as bin sum(bytes_out) as bout
          count(eval(method=POST)) as posts count(eval(method=GET)) as gets
          dc(src_country) as geo_div count(eval(login_attempt=1)) as cred_posts by hostname,_time
      | eval post_get_ratio = posts/max(gets,1)
      | eventstats mean(req) as mu stdev(req) as sd by hostname
      | eval z=(req-mu)/sd
      | where z > 3 OR step_change(post_get_ratio) OR cred_posts > cred_baseline
      | where _time >= content_change_time(hostname) | alert
- question: Do per-program / per-parameter HTTP anomaly models (attribute length via Chebyshev, character
    distribution via chi-square, structural/token inference, access frequency, inter-request time) flag
    specific deviating requests against first-party Zeek http.log / WAF parameters on the reclaimed host?
  context: Injection, abnormal redirect parameters, and other manipulation on a hijacked host show up
    as requests that deviate from the learned model of normal HTTP for that application. Apply per-program/per-parameter
    HTTP anomaly models -- attribute length via Chebyshev, character distribution via chi-square, structural/token
    inference, access frequency and inter-request time -- from 'Anomaly Detection of Web-based Attacks'
    over first-party Zeek http.log/WAF parameters, and report the specific deviating model(s) per request
    for explainable triage. A positive result points to specific requests carrying abnormal parameters
    consistent with injection or malicious redirects on the reclaimed host; a negative result means requests
    fit the established per-parameter models. This supports Impact investigation by explaining exactly
    which request features are anomalous.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - AWS WAF logs
  - Amazon CloudFront access logs
  - Zeek http.log / web server access logs
  - 'NAI: High-visibility public web properties, subdomains linked from corporate communications, and
    protective edge telemetry (WAF, CloudFront, Zeek http.log) around services receiving user traffic'
  range: Last 90 days (build per-parameter models; evaluate per request)
  queries:
  - technology: Zeek/Stats pseudocode
    query: |
      source=zeek_http hostname in reclaimed_hosts
      | for each (program,parameter):
        len_anom   = chebyshev(param.length, learned_mean, learned_var)
        char_anom  = chi_square(param.char_dist, learned_dist)
        struct_anom= token_structure_infer(param.value, learned_grammar)
        freq_anom  = access_frequency(program) + inter_request_time(program)
      | eval anomalous = any(len_anom,char_anom,struct_anom,freq_anom) > threshold
      | where anomalous | table uid program parameter deviating_models | alert
- question: Has a subdomain's request volume, country/ASN distribution, user-agent mix, redirect frequency,
    POST-to-GET ratio, path entropy, or 404/NXDOMAIN failure rate shifted sharply from its prior baseline
    in a way consistent with public defacement, phishing, or malware staging?
  context: Beyond raw volume, the shape of traffic to a hijacked hostname changes -- redirect frequency
    climbs, the country/ASN and user-agent mix shifts, path entropy and error rates move -- in patterns
    characteristic of defacement, phishing, or malware staging. Baseline request volume, country/ASN distribution,
    user-agent mix, redirect frequency, POST-to-GET ratio, path entropy, and 404/NXDOMAIN failure rates
    per subdomain, and flag hostnames whose traffic, redirect behavior, or error-rate profile shift sharply
    from the prior baseline ('Can I Take Your Subdomain?'). A positive result indicates the hostname's
    traffic profile now resembles abusive use; a negative result reflects a profile consistent with its
    legitimate history. This is tactic-specific to Impact because it captures the externally visible consequence
    of the takeover.
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - AWS WAF logs
  - Amazon CloudFront access logs
  - Zeek http.log / web server access logs
  - 'NAI: High-visibility public web properties, subdomains linked from corporate communications, and
    protective edge telemetry (WAF, CloudFront, Zeek http.log) around services receiving user traffic'
  range: Last 90 days (baseline per subdomain; evaluate per interval)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |
      source=(waf OR cloudfront OR zeek_http) earliest=-90d
      | stats count as vol dc(src_country) as countries dc(src_asn) as asns
          dc(user_agent) as ua_mix count(eval(status in(301,302))) as redirects
          count(eval(method=POST))/count(eval(method=GET)) as post_get
          entropy(uri_path) as path_entropy
          count(eval(status=404 OR rcode=NXDOMAIN))/count as fail_rate by hostname, span=1h
      | eventstats baseline(stats) by hostname
      | eval shift = sharp_deviation([vol,countries,asns,ua_mix,redirects,post_get,path_entropy,fail_rate])
      | where shift consistent_with [defacement,phishing,malware_staging] | alert
- question: When content- and sequence-based models combine DNS state, edge traffic, and retrieved page
    artifacts -- record age, resource nonexistence/failure-fingerprint, certificate churn, visual defacement
    class, lexical similarity to branded login pages, abnormal external-link destinations, and rare-API
    scoring -- is a hostname scored as likely takeover abuse, and what are the top-3 contributing features?
  context: 'The strongest detection fuses signals across layers: a hostname is most likely hijacked when
    a dangling/aged record, a nonexistent backing resource, fresh certificate churn, a visual defacement
    class, and abnormal outbound links all co-occur. Use content- and sequence-based modeling across DNS
    state, edge traffic, and retrieved page artifacts to identify likely takeover abuse, weighting record
    age, resource nonexistence/failure-fingerprint, certificate churn, visual defacement class (Meerkat),
    lexical similarity to branded login pages, and abnormal external-link destinations, complemented with
    Elastic CloudTrail ML rare-API scoring. The alert must enumerate the top-3 contributing features rather
    than only a score. A positive result is a high-confidence, explainable indication of subdomain-takeover
    Impact combining DNS, control-plane, and content evidence; a negative result means the combined signals
    do not support takeover abuse.'
  answer_sources:
  - Amazon Route 53 hosted zone records
  - AWS CloudTrail management events
  - AWS WAF logs
  - Amazon CloudFront access logs
  - Zeek http.log / web server access logs
  - 'NAI: High-visibility public web properties, subdomains linked from corporate communications, and
    protective edge telemetry (WAF, CloudFront, Zeek http.log) around services receiving user traffic'
  range: Last 90 days (train on 30-90 days; score per hostname continuously)
  queries:
  - technology: SIEM/ML pseudocode
    query: |
      // fuse DNS state + edge traffic + page artifacts per hostname
      features = [record_age, resource_nonexistence_fingerprint, certificate_churn,
                  meerkat_visual_defacement_class, lexical_sim_to_branded_login,
                  abnormal_external_link_dest, elastic_cloudtrail_rare_api_score]
      score = content_sequence_model(features)
      if score > threshold:
        alert(hostname, score, top3=feature_importance(features))
