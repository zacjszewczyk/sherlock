name: 'T1619.A001: S3 Object and Bucket Enumeration'
id: ccd318f5-7533-446b-a7f3-e98254cde8be
description: Investigate potential adversary discovery activity in AWS in which a principal enumerates
  Amazon S3 buckets and objects to map accessible cloud storage and identify sensitive or high-value data
  stores for later collection or exfiltration. This playbook helps an analyst determine whether ListBuckets/ListObjects/ListObjectsV2
  and related bucket-profiling calls (GetBucketPolicy, GetBucketAcl, GetBucketEncryption, GetBucketVersioning,
  public-access-block and inventory reads) represent legitimate data-engineering, backup, ETL, or compliance
  workflows or deliberate reconnaissance. It covers burst/volume detection, enumeration-tool and userAgent
  fingerprinting, first-seen/new-terms baselines, correlation with preceding identity changes (AssumeRole,
  access-key creation, login-profile changes), denied-listing permission probing, statistical fan-out
  and focus-ratio anomalies, sensitive-target selection, and ML sequence/graph/embedding models, including
  correlation with GuardDuty S3 Protection findings, so the analyst can distinguish benign storage operations
  from targeted discovery of regulated or business-sensitive content.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is any single principal issuing a rapid burst of S3 listing operations (ListBuckets, GetBucketLocation,
    ListObjects, ListObjectsV2, or repeated delimiter/prefix-based listing) across many distinct buckets
    or prefixes in a short window, especially when the caller is newly active, externally sourced, or
    outside expected data-engineering and backup workflows?
  context: 'During the Discovery tactic an adversary who has gained a foothold will try to map what cloud
    storage they can reach before deciding what to collect. A concentrated burst of list operations across
    many buckets is a strong signal of deliberate enumeration rather than an application reading known
    objects. Operationalize a deterministic CloudTrail/Athena (Sigma-on-Athena) rule such as a principal
    touching >=10 distinct buckets OR >50 list operations within 5 minutes; derive site-specific thresholds
    from your own history and validate against public CloudTrail datasets. A positive result is a principal
    whose burst far exceeds its normal storage cadence; a negative result is steady, scoped access to
    a small set of expected buckets. Pay special attention to newly active principals, external source
    IPs, and roles that normally only use the console or a single service role. Authoritative references:
    [flaws.cloud CloudTrail dataset](https://summitroute.com/blog/2020/10/09/public_dataset_of_cloudtrail_logs_from_flaws_cloud/);
    [Automated First Response in AWS using Sigma and Athena, Invictus IR](https://www.invictus-ir.com/news/automated-first-response-in-aws-using-sigma-and-athena).'
  answer_sources: &id001
  - CloudTrail management events
  - CloudTrail S3 data events (object-level)
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets containing business-sensitive or regulated data, CloudTrail data events for bucket
    and object listing, and identities with read access to object inventories across production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SELECT userIdentity.arn, COUNT(*) AS list_calls, COUNT(DISTINCT requestParameters.bucketName)\
      \ AS buckets\nFROM cloudtrail\nWHERE eventSource='s3.amazonaws.com'\n  AND eventName IN ('ListBuckets','GetBucketLocation','ListObjects','ListObjectsV2')\n\
      GROUP BY userIdentity.arn, floor(eventTime/300)  -- 5-minute bins\nHAVING buckets >= 10 OR list_calls\
      \ > 50\n// flag callers new in last 7d, external sourceIPAddress, or non data-eng roles"
- question: Does any principal's userAgent string or access-key usage match known S3 enumeration tooling
    (S3 Browser, S3Scanner, custom boto3/aws-cli signatures) while issuing bulk ListBuckets or ListObjectsV2
    calls?
  context: 'Enumeration tools leave recognizable userAgent and client fingerprints in CloudTrail. Matching
    these against bulk listing activity quickly surfaces reconnaissance, applying the same userAgent/tool-fingerprint
    primitive used in published Sigma rules for S3Browser activity. The signal is strongest when a fingerprinted
    client appears on a principal that normally interacts only through the AWS console or an SDK service
    role, indicating that a human-operated enumeration tool is being driven with that identity''s credentials.
    A positive result is a tool fingerprint on a principal/credential that should never use it; a negative
    is expected automation whose userAgent is a known, sanctioned SDK pattern. Authoritative reference:
    [AWS IAM S3Browser User or AccessKey Creation Sigma rule](https://detection.fyi/sigmahq/sigma/cloud/aws/cloudtrail/aws_iam_s3browser_user_or_accesskey_creation/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WHERE eventSource='s3.amazonaws.com' AND eventName IN ('ListBuckets','ListObjectsV2')\n  AND\
      \ (userAgent MATCHES /(S3 Browser|S3Scanner|s3scanner|boto3.*custom|aws-cli.*scan)/\n       OR userAgent\
      \ IN known_enum_tool_agents)\n// escalate when principal normally uses console/SDK service role\
      \ only\nGROUP BY principal, accessKeyId, userAgent"
- question: Is this the first time within a 30-90 day lookback that a given (principal, enumeration-API)
    or (principal, bucket) pair has appeared - that is, is a role suddenly listing buckets it has never
    enumerated before?
  context: 'A New Terms / first-seen baseline catches a principal performing storage enumeration it has
    no history of, which is a hallmark of Discovery by a compromised or misused identity. This requires
    no external lookups: simply maintain a 30-90 day baseline of (principal, API) and (principal, bucket)
    tuples and alert on novel combinations. A positive result is a previously storage-quiet role suddenly
    enumerating buckets; a negative is a principal repeating enumeration patterns it has long exhibited.
    Tune the lookback to be long enough to capture monthly or quarterly batch jobs so legitimate periodic
    workflows do not appear as first-seen. Authoritative reference: [AWS Account Discovery By Rare User,
    Elastic](https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_organization_discovery_by_rare_user.toml).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "baseline = SET of (principal, eventName) and (principal, bucket) over last 30-90d\nFOR each\
      \ new S3 list event:\n  IF (principal, eventName) NOT IN baseline OR (principal, bucket) NOT IN\
      \ baseline:\n     ALERT first_seen_enumeration"
- question: Do S3 listing bursts closely follow a preceding identity or foothold change by the same principal
    - such as AssumeRole, access-key creation, login-profile changes, or trust-path use - within the prior
    24 hours?
  context: Adversaries frequently establish or escalate access and then immediately reconnoiter storage.
    Correlating S3 enumeration with a preceding authentication or privilege event presents the credential
    change and the subsequent storage reconnaissance as a single discovery workflow, sharply raising confidence
    over either signal alone. A positive result is an AssumeRole or new access key followed within hours
    by broad bucket listing from the same principal; a negative is enumeration by a long-stable identity
    with no recent credential changes. This correlation is tactic-specific to Discovery because it captures
    the orient-then-explore behavior immediately after gaining a new foothold.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'auth = events WHERE eventName IN (''AssumeRole'',''CreateAccessKey'',''UpdateLoginProfile'',''CreateLoginProfile'')
      within prior 24h

      recon = S3 list burst by same principal

      JOIN auth, recon ON principal WHERE recon.time - auth.time <= 24h

      EMIT correlated discovery workflow'
- question: Is any single principal generating a burst of AccessDenied / Client.UnauthorizedOperation
    errors on S3 enumeration calls (ListBucket, GetBucketAcl, GetBucketPolicy, GetObject) - for example
    >5 denials in 5 minutes or a denied:allowed ratio >0.5 before any successes?
  context: 'Permission probing with stolen or low-privilege credentials produces a distinctive pattern
    of denied S3 calls as the adversary tests what the identity can reach. Profiling errorCode=AccessDenied
    on listing and policy-read APIs turns failures into a high-value discovery signal. A positive result
    is a principal that rapidly accumulates denials across buckets, especially before any successful listing;
    a negative is the occasional isolated denial typical of a misconfigured but benign workflow. This
    is tactic-specific to Discovery because failed enumeration still reveals adversary intent to map storage
    even when access controls hold. Authoritative reference: [AWS IAM AccessDenied Discovery Events, Splunk](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WHERE eventSource='s3.amazonaws.com'\n  AND eventName IN ('ListBucket','GetBucketAcl','GetBucketPolicy','GetObject')\n\
      \  AND errorCode IN ('AccessDenied','Client.UnauthorizedOperation')\nGROUP BY principal, 5min_bin\n\
      HAVING denials > 5 OR (denials/NULLIF(allowed,0)) > 0.5 before first success"
- question: Does a principal's listed-bucket count, prefix fan-out, request density, region spread, or
    hour-of-day enumeration behavior in a session exceed its own 30-day baseline (mean + 3*sigma and the
    95th percentile for comparable roles)?
  context: 'Statistical baselining of each principal''s bucket diversity and enumeration rate detects
    sessions that deviate sharply from learned-normal storage behavior, using an explainable z-score method
    so the offending metric and sigma value can be emitted in the alert. This catches enumeration that
    no single deterministic rule would flag because it is anomalous only relative to that role''s history.
    A positive result is a session whose fan-out or rate sits well beyond mean + 3*sigma and the peer
    95th percentile; a negative is activity within normal variance. The explainability (which metric,
    how many sigma) makes the finding defensible during triage. Authoritative reference: [Finding Anomalies
    in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each principal compute over 30d: mean,std of {buckets_listed, prefix_depth, req_density,
      region_spread, hour_dist}

      z = (session_metric - mean)/std

      ALERT IF z > 3 AND session_metric > peer_role_p95

      EMIT metric_name, z_value'
- question: Within rolling 5-minute and 1-hour windows, is list-heavy behavior dominating a principal's
    normal application pattern - high counts of list operations (frequency), many unique buckets touched
    (volume), and a high ratio of list calls to read calls and to denied calls (state)?
  context: Reconnaissance tends to concentrate enumeration into short windows that look very different
    from steady application access, which reads known objects rather than broadly listing. Computing rolling
    frequency, volume, and state metrics per principal and comparing to its baseline highlights sessions
    where listing dominates and clusters into discovery windows. A positive result is a principal whose
    short-window list:read ratio spikes far above its norm; a negative is balanced, sustained read activity
    consistent with serving an application. Derive thresholds per role from history so high-throughput
    legitimate jobs are not falsely flagged.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'rolling windows = [5min, 1h]

      FOR each principal,window: freq=count(list), vol=distinct(bucket), state=list/read_ratio, denied_ratio

      ALERT IF list_ratio >> principal_baseline AND recon concentrated in short window'
- question: When checked against a per-principal lookback of observed S3 API actions and resources, is
    the principal performing actions or touching buckets that have not been seen in the baseline window?
  context: 'A low-false-positive Athena baseline (as implemented by the Netflix CloudTrail Anomaly Detector)
    maintains, per principal, the set of S3 API actions and resources previously observed and reports
    novel behavior. Unlike a single first-seen rule, this builds a comprehensive per-principal action/resource
    profile, making genuinely new enumeration behavior stand out with few false positives. A positive
    result is a principal exercising S3 actions or enumerating buckets entirely absent from its profile;
    a negative is activity fully covered by the established baseline. This supports Discovery detection
    by catching the moment a role''s behavior expands into unfamiliar storage territory. Authoritative
    reference: [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "profile[principal] = {S3 actions} ∪ {resources} over lookback window\nFOR each event:\n  IF\
      \ action NOT IN profile[principal].actions OR resource NOT IN profile[principal].resources:\n  \
      \   REPORT novel_behavior  // Netflix cloudtrail-anomaly style Athena baseline"
- question: How rare, fleet-wide, are the (principal, source-IP, userAgent, bucket) tuples performing
    enumeration - are there rare-but-clustered tuples seen on very few identities, or first-seen IPs/userAgents,
    that warrant investigation?
  context: 'Prevalence/rarity analysis treats infrequency as a prior for malice: an enumeration context
    (source IP, userAgent, bucket combination) seen across the whole fleet on only one or two identities
    is far more suspicious than a common pattern. Scoring tuple rarity and surfacing rare-but-clustered
    combinations produces high-value leads with manageable volume. A positive result is enumeration from
    a first-seen IP/userAgent or a tuple unique to a single principal; a negative is activity matching
    widely shared, common patterns. This frequency-analysis approach is well suited to Discovery because
    reconnaissance often originates from infrastructure and tooling that are anomalous for the environment.
    Authoritative reference: [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each enumeration event compute fleet-wide count of tuple (principal, sourceIP, userAgent,
      bucket)

      rarity = 1/prevalence

      ALERT rare-but-clustered tuples (seen on <=N identities OR first-seen IP/userAgent)'
- question: Does a principal's CloudTrail API sequence deviate from its learned-normal workflow in a way
    consistent with enumeration bursts (e.g., ListBuckets -> ListObjectsV2 x N -> GetBucketPolicy) where
    the next-event prediction falls outside the top-g candidates?
  context: 'An LSTM sequence model (per DeepLog) learns each principal''s normal ordering of CloudTrail
    API calls and flags out-of-pattern enumeration whose next predicted event is improbable, surfacing
    the deviating log key for triage. This captures the temporal structure of reconnaissance that volume
    thresholds miss. A positive result is a session whose API ordering matches adversary discovery rather
    than scheduled inventory, ETL, or compliance scanning; a negative is a sequence consistent with the
    principal''s established workflow. Prioritizing sessions by structural deviation lets analysts separate
    human-driven recon from automated, predictable jobs during the Discovery phase. Authoritative reference:
    [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'train LSTM on per-principal CloudTrail API key sequences (DeepLog)

      FOR each event: predict next log key; IF actual NOT IN top-g predictions: FLAG

      surface deviating key; prioritize ListBuckets->ListObjectsV2 xN->GetBucketPolicy shapes'
- question: When user-service-activity graphs are built over CloudTrail, do any principals' S3 fan-out
    patterns place them outside their normal behavioral community according to GNN embeddings with node/edge
    attribution?
  context: 'Dynamic graph anomaly detection (per CS-GAD) embeds principals, services, and activities and
    scores identities whose S3 enumeration places them outside their behavioral community, using edge
    attribution to name the specific buckets and actions driving the score. This detects discovery behavior
    that is anomalous relative to peer groups even when absolute volumes look ordinary. A positive result
    is a principal whose enumeration connects it to buckets/actions characteristic of a different community
    than it belongs to; a negative is activity consistent with its peer cluster. The attribution makes
    the alert actionable by pointing to the exact storage objects responsible. Authoritative reference:
    [CS-GAD, Graph Anomaly Detection for Cloud User Behavior](https://arxiv.org/html/2409.12726v1).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'build dynamic user-service-activity graph from CloudTrail

      learn GNN node embeddings; score principal distance from behavioral community (CS-GAD)

      ALERT out-of-community S3 fan-out; emit edge attribution (buckets/actions)'
- question: When cloud CLI invocations (aws s3 ls, s3api list-objects-v2) and userAgent strings are embedded
    with BERT-style representations, do unsupervised outlier detectors (Isolation Forest, COPOD, PCA,
    autoencoders) flag anomalous tokens, resource identifiers, or execution context?
  context: 'Embedding command-line and userAgent text and applying unsupervised outlier detection surfaces
    anomalous enumeration tooling, arguments, and resource identifiers that signature rules miss, per
    CrowdStrike''s BERT-embedding approach. Every ML alert should emit its top-3 contributing features
    for explainability. A positive result is an enumeration invocation whose embedded representation is
    a clear outlier (unusual flags, resource patterns, or context); a negative is a command resembling
    the principal''s routine, sanctioned usage. This complements deterministic fingerprinting by catching
    novel or obfuscated tooling during Discovery. Authoritative references: [A New Approach for Command
    Line Anomaly Detection Using BERT Embeddings, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/);
    [A Systematic Review on the Integration of Explainable AI in IDS, Frontiers in AI](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'embed (CLI invocation tokens + userAgent) with BERT

      apply IsolationForest/COPOD/PCA/autoencoder

      ALERT outliers; emit top-3 contributing features'
- question: Do GuardDuty S3 Protection findings - the per-principal ML baseline Discovery:S3/AnomalousBehavior
    and the deterministic Discovery:S3/TorIPCaller and MaliciousIPCaller findings - correlate with the
    custom CloudTrail enumeration analytics in this playbook?
  context: 'AWS GuardDuty provides a managed ML baseline (Discovery:S3/AnomalousBehavior) and deterministic
    threat-intel findings (TorIPCaller, MaliciousIPCaller) for S3 access. Correlating these with your
    own CloudTrail-derived enumeration signals provides independent corroboration and raises confidence
    while reducing false positives. A positive result is a GuardDuty S3 finding for a principal that your
    analytics also flag for anomalous enumeration, or enumeration sourced from Tor/known-malicious IPs;
    a negative is a GuardDuty finding with no supporting custom signal (still worth triage) or custom
    signals with no managed corroboration. This fusion strengthens Discovery detection by combining managed
    and bespoke detections. Authoritative reference: [Amazon GuardDuty S3 Protection finding types, AWS](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-s3.html).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ingest GuardDuty findings: Discovery:S3/AnomalousBehavior, Discovery:S3/TorIPCaller, Discovery:S3/MaliciousIPCaller

      JOIN ON principal/sourceIP WITH custom_cloudtrail_enum_alerts

      ESCALATE corroborated findings'
- question: Does enumeration disproportionately target buckets or prefixes tied to sensitive data - Macie
    findings, backup nomenclature, export workflows, security logs, customer data, or public-access exposure
    - and does the same session also query bucket policies, public-access-block settings, encryption status,
    inventory manifests, or object tags to refine target selection?
  context: 'When discovery concentrates on sensitive or operationally valuable storage rather than browsing
    broadly, the adversary is likely selecting collection or exfiltration targets. A deterministic Sigma-on-Athena
    rule over CloudTrail can flag enumeration weighted toward Macie-classified, backup, export, security-log,
    customer-data, or publicly exposed buckets, and escalate when the session also profiles policies,
    public-access-block, encryption, inventory, or tags. A positive result is focused listing of high-value
    buckets combined with configuration/permission probing; a negative is broad or routine listing with
    no sensitive-target bias. This is tactic-specific to Discovery because it captures target prioritization
    that precedes Collection and Exfiltration. Authoritative reference: [Automated First Response in AWS
    using Sigma and Athena, Invictus IR](https://www.invictus-ir.com/news/automated-first-response-in-aws-using-sigma-and-athena).'
  answer_sources: &id002
  - CloudTrail management events
  - S3 Inventory
  - AWS Config
  - Amazon Macie findings
  - 'NAI: Buckets with sensitive naming conventions, Macie-classified data, public-access findings, lifecycle
    and inventory configurations, and access paths used to organize high-value S3 content'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'sensitive = buckets WHERE name MATCHES /(backup|export|finance|hr|customer|legal|logs)/ OR
      macie_flag OR public_access

      ALERT IF enumerated_sensitive/enumerated_total high

      ESCALATE IF session also calls GetBucketPolicy/GetPublicAccessBlock/GetBucketEncryption/inventory/GetObjectTagging'
- question: Is focused enumeration of sensitive buckets followed by GetBucketPolicy, GetBucketAcl, GetBucketEncryption,
    GetBucketVersioning, or cross-account permission reads - a combined storage-profiling sequence suggesting
    the caller is planning follow-on access?
  context: Reconnaissance that pairs narrowing enumeration with permission and configuration reads on
    the same sensitive buckets indicates planning for access rather than routine inventory. Correlating
    the listing with these bucket-profiling APIs treats the sequence as evidence of intent to collect.
    A positive result is a session that lists a sensitive bucket and then immediately reads its policy,
    ACL, encryption, or versioning, or probes cross-account permissions; a negative is listing without
    any configuration profiling. Tying this to Discovery clarifies that the adversary is orienting on
    how to reach high-value data before acting on it.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'list_sensitive = ListObjects on sensitive bucket

      profile = GetBucketPolicy|GetBucketAcl|GetBucketEncryption|GetBucketVersioning|cross-account read

      CORRELATE list_sensitive -> profile by same principal/session

      EMIT storage-profiling sequence'
- question: Is any principal repeatedly receiving AccessDenied responses specifically against sensitive/high-value
    buckets (finance, backup, customer-data) on GetBucketPolicy, ListBucket, or GetObject - indicating
    targeted reconnaissance against known-valuable storage?
  context: 'Denials are a discovery signal in their own right, and denials concentrated on sensitive buckets
    are an especially strong indicator of targeted probing. Tracking AccessDenied responses against high-value
    buckets distinguishes purposeful reconnaissance from random testing. A positive result is a principal
    repeatedly denied on finance, backup, or customer-data buckets; a negative is sparse, scattered denials
    with no sensitive-target focus. This supports Discovery detection because it reveals the adversary''s
    interest in specific valuable data even when the access controls successfully block them. Authoritative
    reference: [AWS IAM AccessDenied Discovery Events, Splunk](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WHERE errorCode='AccessDenied'\n  AND bucket IN sensitive_buckets\n  AND eventName IN ('GetBucketPolicy','ListBucket','GetObject')\n\
      GROUP BY principal HAVING denials_on_sensitive > threshold"
- question: What percentage of a caller's enumerated buckets and prefixes maps to sensitive naming patterns,
    Macie severity, data-classification tags, or public-exposure indicators, and does that focus on high-value
    storage exceed the caller's own baseline (mean + 3*sigma) or the peer-role norm?
  context: 'Measuring the focus ratio - the share of enumeration directed at sensitive storage - and comparing
    it statistically to the caller''s history and peer roles distinguishes selective targeting from broad
    browsing, using an explainable deviation method. A positive result is a caller whose high-value-bucket
    focus is far above its baseline or peers; a negative is enumeration spread proportionally across storage
    with no sensitive bias. Emitting the metric and sigma value keeps the finding defensible. This is
    tactic-specific to Discovery because rising focus on sensitive data marks the transition from mapping
    the environment to selecting collection targets. Authoritative reference: [Finding Anomalies in Windows
    Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'focus_ratio = enumerated_sensitive_buckets / enumerated_total_buckets

      baseline mean,std per principal and peer-role

      ALERT IF focus_ratio > mean+3*std OR > peer_norm; emit ratio & sigma'
- question: Do the number of objects and aggregate bytes a principal lists or reads in a session deviate
    from the data-volume distribution that principal/role normally exhibits?
  context: 'Baselining the distribution of objects and bytes a role normally enumerates and reads, then
    flagging sessions that deviate, catches mass enumeration preceding collection even when each individual
    call looks legitimate (a data-centric insider-detection approach). A positive result is a session
    whose enumerated-object count or aggregate size is far outside the learned distribution; a negative
    is volume consistent with the role''s normal data handling. This supports Discovery detection because
    adversaries staging collection often enumerate far more objects than the role''s legitimate function
    requires, even while each API call appears authorized. Authoritative reference: [A Data-Centric Approach
    to Insider Attack Detection in Database Systems, Mathew et al.](https://link.springer.com/chapter/10.1007/978-3-642-15512-3_20).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline distribution of {objects_listed, bytes} per principal/role

      ALERT session WHERE objects or bytes deviate from learned distribution (data-centric profiling)'
- question: Does a session score high for concentration on backup, archive, export, finance, HR, or customer-data
    prefixes relative to all prefixes viewed - especially rapidly narrowing from broad bucket listing
    to a small set of high-value paths - and is the (principal, sensitive-bucket) tuple rare?
  context: 'Scoring each session by its concentration on sensitive prefixes, and escalating when a caller
    quickly narrows from broad listing to a few high-value paths, models the target-selection behavior
    that precedes collection; combining it with rarity scoring of the (principal, sensitive-bucket) tuple
    sharpens the signal. A positive result is a session that funnels from wide enumeration into a tight
    set of finance/HR/backup/customer prefixes, particularly when that principal rarely touches those
    buckets; a negative is diffuse listing with no narrowing pattern. This is tactic-specific to Discovery
    because the narrowing trajectory is the analytic signature of choosing what to steal. Authoritative
    reference: [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'score = concentration on prefixes IN {backup,archive,export,finance,hr,customer} / all prefixes

      ESCALATE rapid narrowing broad->few high-value paths

      COMBINE rarity(principal, sensitive-bucket) tuple'
- question: Does an LSTM model of the API sequence from broad listing to focused sensitive-bucket profiling
    flag deviations from learned-normal workflow whose structure matches reconnaissance intended to support
    collection or exfiltration rather than administration?
  context: 'An LSTM sequence model (per DeepLog) learns the normal progression of a principal''s storage
    API calls and flags sequences whose structure matches the broad-to-focused target-selection pattern,
    surfacing the deviating action. This captures the temporal shape of pre-collection reconnaissance
    that volume or focus metrics alone miss. A positive result is a session whose ordering moves from
    wide enumeration into concentrated sensitive-bucket profiling in a way that diverges from learned
    admin/ETL workflows; a negative is a sequence consistent with the principal''s normal operations.
    Prioritizing collection-shaped sequences focuses analyst attention on Discovery that is about to escalate.
    Authoritative reference: [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
