- question: Using tripartite user-service-activity graph GNNs, are any principals accessing sensitive
    buckets outside their behavioral community, with node/edge attribution naming the buckets and actions
    driving the anomaly score?
  context: 'A tripartite (user-service-activity) graph GNN identifies principals whose access to sensitive
    buckets places them outside their normal behavioral community, with attribution that names the responsible
    buckets and actions, and the top-3 contributing features emitted for explainability. This detects
    sensitive-data discovery that is anomalous relative to peer behavior even when raw volumes appear
    ordinary. A positive result is a principal connecting to sensitive buckets characteristic of a different
    community than its own; a negative is access consistent with its peer cluster. The attribution makes
    the finding immediately actionable for Discovery triage by pointing to the exact high-value objects
    involved. Authoritative references: [CS-GAD, Graph Anomaly Detection for Cloud User Behavior](https://arxiv.org/html/2409.12726v1);
