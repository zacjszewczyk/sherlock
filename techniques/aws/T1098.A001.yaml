questions:
- question: Did a principal call CloudTrail support:ResolveCase (eventSource=support.amazonaws.com, eventName=ResolveCase)
    to close or resolve an AWS Support case when that principal (a) had zero prior support:* events in
    the trailing 90 days, (b) is an IAM principal or role created less than 7 days ago, or (c) within
    the prior 24 hours modified IAM policies, MFA devices, alternate/security contacts, billing access,
    or root-account recovery - and especially when the case was closed with no preceding support:AddCommunicationToCase,
    outside business hours, or referenced abuse, billing anomaly, credential misuse, or account compromise?
  context: 'ResolveCase is the documented AWS Support suppression API for T1098.A001. In a Privilege Escalation
    context, an adversary who has just expanded their own permissions (new policies, MFA swaps, trust/contact
    changes, root recovery) will close the very support cases an organization''s security or billing team
    opened so remediation never happens. This deterministic rule is the detection floor: alert on ResolveCase
    performed by a brand-new identity, a never-before-seen support actor, or an identity that just touched
    privilege-affecting settings. Escalate when the case is closed without any customer communication
    (no AddCommunicationToCase), when it happens outside defined business hours, or when the case subject
    references abuse, billing anomalies, credential misuse, or compromise. A positive result is a high-confidence
    suppression signal that warrants immediate review of the closed case and the principal''s recent IAM
    activity; a negative result still leaves the statistical and ML detections to catch lower-and-slower
    behavior. Tune false positives by allow-listing a managed support-operations role and its console
    userAgent - do not weaken or replace the rule with scoring.'
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - AWS Health Dashboard event history
  - Amazon GuardDuty findings
  - CloudTrail Lake
  - 'NAI: CloudTrail trails logging support and IAM control-plane actions, support cases tied to account-security
    notifications, and management accounts where responders coordinate abuse and billing investigations'
  range: Last 90 days (evaluate ResolveCase against the prior 90-day support history and the prior 24h
    of IAM changes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="support.amazonaws.com" eventName="ResolveCase"

      | join type=left userIdentity.arn [ search source=cloudtrail eventSource="support.amazonaws.com"
      earliest=-90d | stats count as prior_support by userIdentity.arn ]

      | join type=left userIdentity.arn [ search source=cloudtrail eventName IN ("PutUserPolicy","AttachUserPolicy","AttachRolePolicy","DeactivateMFADevice","PutAccountAlternateContact","UpdateAssumeRolePolicy")
      earliest=-24h | stats count as recent_priv_changes by userIdentity.arn ]

      | eval new_principal=if(principal_create_age_days<7,1,0)

      | eval no_prior_support=if(isnull(prior_support) OR prior_support=0,1,0)

      | where no_prior_support=1 OR new_principal=1 OR recent_priv_changes>0

      | eval suspicious_case=if(match(caseSubject,"(?i)abuse|billing|credential|compromise|root"),1,0)

      | eval no_comms=if(NOT comm_before_resolve,1,0)

      | where suspicious_case=1 OR no_comms=1 OR outside_business_hours=1

      | alert'
- question: For each account or business unit, do the support-case closure volume (closures/day), frequency
    (closures/hour), the ratio of cases closed WITHOUT customer communication versus with, and the time-to-resolution
    deviate sharply (modified Z-score |z| > 3.5) from the established baseline - or does any security/abuse-category
    case show a time-to-resolution under 10 minutes?
  context: 'Adversaries suppressing oversight often close cases in batches or unnaturally fast, or close
    them without ever communicating with AWS. Baselining per account/BU defends against environments with
    legitimately high support traffic. Use the median-absolute-deviation modified Z-score (flag |z| >
    3.5) so batch activity and skew do not distort thresholds, implemented as CloudWatch metric filters
    with band-based anomaly alarms over CloudTrail metrics. A hard secondary rule fires on any closure
    with time-to-resolution under 10 minutes on a security/abuse case, regardless of score. Pair this
    with time-series prediction intervals to alert on both spikes (mass suppression) and suppressive lulls
    that coincide with abnormal identity administration. In the Privilege Escalation context, anomalous
    closure handling is the statistical complement to the deterministic ResolveCase rule: it catches suppression
    patterns that individually look authorized but collectively deviate from how the account normally
    handles cases.'
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - AWS Health Dashboard event history
  - Amazon GuardDuty findings
  - CloudTrail Lake
  - 'NAI: CloudTrail trails logging support and IAM control-plane actions, support cases tied to account-security
    notifications, and management accounts where responders coordinate abuse and billing investigations'
  range: Last 90 days (baseline window; score daily/hourly aggregates)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="support.amazonaws.com" eventName IN ("ResolveCase","AddCommunicationToCase")

      | bin _time span=1d

      | stats count(eval(eventName="ResolveCase")) as closures, count(eval(eventName="ResolveCase" AND
      no_comms=1)) as closures_no_comm, avg(time_to_resolution_min) as ttr by account_id, _time

      | eventstats median(closures) as med, median(abs(closures-med)) as mad by account_id

      | eval mod_z=0.6745*(closures-med)/mad

      | eval hard_flag=if(case_category IN ("security","abuse") AND ttr<10,1,0)

      | where abs(mod_z)>3.5 OR hard_flag=1

      | alert'
- question: Did a principal accumulate an unusual burst of CloudTrail authorization failures (errorCode=AccessDenied
    or Client.UnauthorizedOperation) across support:* and IAM control-plane calls within a 60-minute sliding
    window - exceeding its own 30-day p95 or >=5 denials - immediately before a successful support:ResolveCase?
  context: 'Before suppressing a case, an adversary frequently probes for the permissions needed to do
    so, producing a cluster of AccessDenied/UnauthorizedOperation errors as they test support and IAM
    actions they do not yet fully control. Profiling the failure state explicitly - counting denied calls
    per principal over a 60-minute window and alerting when the count exceeds the principal''s 30-day
    p95 or a floor of 5 denials - turns this permission-probing into a precursor signal. When that denial
    burst is immediately followed by a successful ResolveCase, it strongly suggests the actor escalated
    just enough to suppress the case. In the Privilege Escalation context this is a leading indicator:
    it can catch the attacker mid-escalation, before the suppression completes. Validate thresholds against
    emulated detonations (Stratus Red Team) to avoid alerting on benign exploratory denials.'
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - AWS Health Dashboard event history
  - Amazon GuardDuty findings
  - CloudTrail Lake
  - 'NAI: CloudTrail trails logging support and IAM control-plane actions, support cases tied to account-security
    notifications, and management accounts where responders coordinate abuse and billing investigations'
  range: Last 90 days (alert on a 60-minute sliding window; require a successful ResolveCase within the
    window or shortly after)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail (eventSource="support.amazonaws.com" OR eventSource="iam.amazonaws.com")

      | eval denied=if(errorCode IN ("AccessDenied","Client.UnauthorizedOperation"),1,0)

      | bin _time span=60m

      | stats sum(denied) as denials, count(eval(eventName="ResolveCase" AND isnull(errorCode))) as resolved
      by userIdentity.arn, _time

      | join type=left userIdentity.arn [ search source=cloudtrail earliest=-30d | eval denied=if(errorCode
      IN ("AccessDenied","Client.UnauthorizedOperation"),1,0) | stats perc95(denied) as p95_denials by
      userIdentity.arn ]

      | where (denials>p95_denials OR denials>=5) AND resolved>0

      | alert'
- question: Is a CloudTrail support:ResolveCase (or any support:* write) the first ever observed for that
    principal, role, region, or source ASN according to a maintained per-principal first-seen index?
  context: 'A first-ever support write by an identity that otherwise behaves as a privileged operator
    is high-signal: legitimate support handling is usually done by a stable, small set of support-ops
    identities, so a privileged admin suddenly resolving a case is anomalous. Maintain a per-principal
    first-seen index of CloudTrail actions (e.g., via an Athena lookback over historical trails) and alert
    when support:ResolveCase or any support write appears for the first time for that principal, role,
    region, or source ASN. In the Privilege Escalation context, this novelty detection catches the case
    where an escalated identity reaches into AWS Support for the first time specifically to suppress a
    case. A positive result should be correlated with the principal''s recent IAM activity to confirm
    whether escalation preceded the support write; a negative simply means the support actor is established
    and the action is more likely routine.'
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - AWS Health Dashboard event history
  - Amazon GuardDuty findings
  - CloudTrail Lake
  - 'NAI: CloudTrail trails logging support and IAM control-plane actions, support cases tied to account-security
    notifications, and management accounts where responders coordinate abuse and billing investigations'
  range: Last 90 days (first-seen index built from a longer historical lookback, e.g., Athena over all
    available trail history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="support.amazonaws.com" eventName="ResolveCase"

      | lookup firstseen_index userIdentity.arn, awsRegion, source_asn OUTPUT first_support_write_seen

      | eval is_first_seen=if(isnull(first_support_write_seen),1,0)

      | where is_first_seen=1

      | eval privileged_operator=if(prior_priv_api_count>0,1,0)

      | alert'
- question: Do support-case closures cluster in a heterogeneous principal/service/action graph together
    with nearby IAM, billing, and account-setting changes in a way that surfaces recurring suppression
    patterns, with GNN embeddings flagging anomalous clusters and the alert naming the top-3 contributing
    edges/features (e.g., principal_age_days, prior_AccessDenied_count, case_category=abuse)?
  context: Individual events may look benign, but the relationship between a case closure and the surrounding
    IAM/billing/account-setting changes reveals the escalation-then-suppress pattern. Build a tripartite/heterogeneous
    graph of principals, services, and actions and cluster ResolveCase events with nearby control-plane
    changes using GNN embeddings and anomaly scoring (CS-GAD, GNN-based IAM threat detection). To be actionable
    in the Privilege Escalation context, alerts MUST surface the top-3 contributing edges/features - for
    example principal_age_days, prior_AccessDenied_count, case_category=abuse - rather than just a cluster
    score, so an analyst can immediately judge whether the cluster reflects real privilege escalation.
    This ML method complements the deterministic and statistical detections by catching distributed, recurring
    suppression behavior that single-event rules miss.
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - AWS Health Dashboard event history
  - Amazon GuardDuty findings
  - CloudTrail Lake
  - 'NAI: CloudTrail trails logging support and IAM control-plane actions, support cases tied to account-security
    notifications, and management accounts where responders coordinate abuse and billing investigations'
  range: Last 90 days (graph built over rolling 90-day window; re-score periodically)
  queries:
  - technology: ML/pseudocode
    query: "graph = build_heterogeneous_graph(nodes=[principal, service, action], edges=cloudtrail_events[last_90d])\n\
      subgraphs = extract_subgraphs_around(event=\"support:ResolveCase\", radius=24h, include=[iam_changes,\
      \ billing_changes, account_setting_changes])\nemb = GNN_embed(subgraphs)\nscore = anomaly_score(emb)\n\
      for s in subgraphs where score > threshold:\n    top3 = explain_top_edges(s)   # e.g. principal_age_days,\
      \ prior_AccessDenied_count, case_category\n    alert(cluster=s, score=score, top3_features=top3)"
- question: Does an explainable rare-event model of the account-activity sequence leading into a support-case
    closure - using features such as prior GuardDuty findings, permission changes, actor novelty, case
    topic, the no-communication flag, and elapsed time from case creation to closure - score the closure
    as anomalous, with the top-3 contributing features surfaced?
  context: 'Some suppression only stands out as a sequence: a GuardDuty finding, then permission changes
    by a novel actor, then a fast no-communication closure of a sensitive case. Model that sequence with
    explainable rare-event scoring (population/rare-function analysis with surfaced influencers) or, for
    the label-scarce case, robust unsupervised detectors (Isolation Forest / One-Class SVM with LIME attribution).
    Train behavioral baselines of authorized-principal misuse against the labeled CERT Insider Threat
    Test Dataset. In the Privilege Escalation context this captures the insider-or-takeover pattern where
    a principal uses the support workflow to cover newly elevated permissions. Every alert must output
    the top-3 contributing features so an analyst can validate the model''s reasoning (e.g., no_communication_flag=true,
    case_topic=compromise, time_to_closure=4min). Positive results feed case review; the model should
    be retuned as benign fast-closure patterns are confirmed.'
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - AWS Health Dashboard event history
  - Amazon GuardDuty findings
  - CloudTrail Lake
  - 'NAI: CloudTrail trails logging support and IAM control-plane actions, support cases tied to account-security
    notifications, and management accounts where responders coordinate abuse and billing investigations'
  range: Last 90 days (model trained on longer history; score each ResolveCase sequence)
  queries:
  - technology: ML/pseudocode
    query: "features = [prior_guardduty_findings, permission_changes_24h, actor_novelty_score, case_topic,\
      \ no_communication_flag, time_to_closure_min]\nX = build_sequence_features(cloudtrail, support_cases,\
      \ guardduty)\nmodel = IsolationForest()  # or OneClassSVM; alt: rare-event population analysis\n\
      model.fit(baseline_X)\nfor event in resolvecase_events:\n    score = model.decision_function(event.X)\n\
      \    if score < threshold:\n        top3 = LIME_explain(model, event.X)\n        alert(event, score,\
      \ top3_features=top3)"
- question: Did an identity emit CloudTrail support:ResolveCase and then, within the same 24-hour window,
    perform privilege-relevant actions - AttachUserPolicy/AttachRolePolicy/PutUserPolicy, AssumeRole into
    a higher-privilege role, UpdateAssumeRolePolicy (trust change), PutAccountAlternateContact, or disabling
    detective controls (StopLogging, DeleteTrail, cloudtrail:PutEventSelectors, GuardDuty DeleteDetector)
    - or access high-value services, especially with zero prior support-case history or a closed case
    that correlates with a GuardDuty finding?
  context: 'This evidence focuses on what happens AFTER the closure: if the support interaction was used
    to preserve escalation rather than remediate, the same identity keeps operating with elevated privileges
    instead of fixing the issue. The deterministic floor links a ResolveCase to follow-on privilege-relevant
    actions within 24 hours - policy attachment, assuming a higher-privilege role, trust-policy changes,
    alternate-contact changes, or disabling logging/GuardDuty. Raise severity when the principal had zero
    prior support history or when the closed case correlates with a GuardDuty finding. In the Privilege
    Escalation context, a closure immediately followed by detective-control suppression or policy expansion
    is a strong indicator the case closure was part of an escalation-and-hide chain. A positive result
    should trigger containment review of the principal; map exact API names via the AWS Support IAM actions
    reference and keep this rule as the deterministic floor.'
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS Config configuration history
  - 'NAI: Support workflows for compromised or high-value accounts, subsequent management activity by
    the case-handling principal, and investigation timelines correlating case actions with persistent
    account access'
  range: Last 90 days (correlate ResolveCase with privilege-relevant actions in the following 24h)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventName="ResolveCase"

      | join type=left userIdentity.arn [ search source=cloudtrail eventName IN ("AttachUserPolicy","AttachRolePolicy","PutUserPolicy","AssumeRole","UpdateAssumeRolePolicy","PutAccountAlternateContact","StopLogging","DeleteTrail","PutEventSelectors","DeleteDetector")
      | where _time>=resolve_time AND _time<=resolve_time+24h | stats values(eventName) as followon_actions
      count as followon_count by userIdentity.arn ]

      | where followon_count>0

      | eval no_prior_support=if(prior_support_cases=0,1,0)

      | eval guardduty_linked=if(case_has_guardduty_finding,1,0)

      | eval severity=if(no_prior_support=1 OR guardduty_linked=1,"high","medium")

      | alert'
- question: In the 24 hours after a principal calls support:ResolveCase, do its volume (API calls), frequency
    (calls/min), distinct high-risk API count, configuration-drift volume, and service spread deviate
    sharply (modified Z-score |z| > 3.5) from its prior 30-day baseline and its peer-admin group - or
    does it show a >=3x increase in distinct write APIs, or a rise in AccessDenied indicating continued
    privilege probing?
  context: 'If a case closure is followed by a genuine surge in activity, the closure was likely a cover
    for ongoing escalation rather than a resolution. Compare the principal''s post-closure 24h behavior
    - call volume, calls/min, distinct high-risk API count, AWS Config configuration-drift volume, and
    the spread of services touched - against both its own prior 30-day baseline and its peer-admin group,
    flagging with modified Z-score |z| > 3.5 via CloudWatch metric-filter anomaly bands. A hard rule fires
    on any >=3x increase in distinct write APIs post-closure regardless of score. Also profile the failure
    state: a rise in AccessDenied right after closure indicates the principal is still probing for more
    privilege. In the Privilege Escalation context this statistical method quantifies the ''kept operating
    without remediation'' pattern that the deterministic rule detects categorically, catching surges that
    any single follow-on action would miss.'
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS Config configuration history
  - 'NAI: Support workflows for compromised or high-value accounts, subsequent management activity by
    the case-handling principal, and investigation timelines correlating case actions with persistent
    account access'
  range: Last 90 days (baseline 30 days; compare the 24h window after each ResolveCase)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventName="ResolveCase" | eval resolve_time=_time

      | map search="source=cloudtrail userIdentity.arn=$userIdentity.arn$ earliest=$resolve_time$ latest=$resolve_time$+24h
      | stats count as vol, dc(eventName) as distinct_apis, count(eval(errorCode=\"AccessDenied\")) as
      denials, dc(eventSource) as service_spread by userIdentity.arn"

      | join type=left userIdentity.arn [ search source=cloudtrail earliest=-30d | stats avg(daily_distinct_apis)
      as base_apis, stdev(daily_distinct_apis) as sd, median(daily_distinct_apis) as med, median(abs(daily_distinct_apis-med))
      as mad by userIdentity.arn ]

      | eval mod_z=0.6745*(distinct_apis-med)/mad

      | eval surge_3x=if(distinct_apis>=3*base_apis,1,0)

      | where abs(mod_z)>3.5 OR surge_3x=1 OR denials>base_denials

      | alert'
- question: Does a principal with effectively no support history (fewer than 2 support events in 90 days)
    close a support case and then immediately begin high-privilege operations, with the behavioral shift
    scored as anomalous (modified Z-score) via first-seen/rarity profiling?
  context: This measures the drift between how a principal historically behaves (support participation
    versus privileged administration) and what it does around a case closure. Using first-seen/rarity
    profiling, escalate when a principal that almost never touches support (<2 support events in 90 days)
    closes a case and then immediately pivots to high-privilege operations, scoring the behavioral shift
    with the modified Z-score method. In the Privilege Escalation context, this captures the takeover/insider
    pattern where an identity steps outside its normal role to both suppress a case and exercise elevated
    permissions. A positive result indicates an identity acting out of character around a support interaction
    and should be correlated with the specific case subject and the follow-on privileged actions; a negative
    result suggests an established support actor whose behavior is within normal bounds.
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS Config configuration history
  - 'NAI: Support workflows for compromised or high-value accounts, subsequent management activity by
    the case-handling principal, and investigation timelines correlating case actions with persistent
    account access'
  range: Last 90 days (support-history rarity over 90 days; evaluate post-closure privileged activity)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventName="ResolveCase" | eval resolve_time=_time

      | join type=left userIdentity.arn [ search source=cloudtrail eventSource="support.amazonaws.com"
      earliest=-90d | stats count as support_events_90d by userIdentity.arn ]

      | where support_events_90d<2

      | join type=left userIdentity.arn [ search source=cloudtrail eventName IN ("AttachUserPolicy","AttachRolePolicy","PutUserPolicy","AssumeRole","UpdateAssumeRolePolicy")
      | where _time>=resolve_time AND _time<=resolve_time+1h | stats count as priv_ops by userIdentity.arn
      ]

      | where priv_ops>0

      | eval drift_z=modified_zscore(behavior_vector, baseline_vector)

      | where abs(drift_z)>3.5

      | alert'
- question: Does temporal sequence/graph analysis of support:ResolveCase and the subsequent CloudTrail
    events identify a case-closure-as-precursor-to-escalation pattern - emphasizing policy attachment,
    role assumption, trust/contact modification, and detective-control suppression after closure - with
    the alert listing the top-3 contributing features?
  context: Where the deterministic rule links a closure to a fixed list of follow-on actions, this ML
    method learns the temporal/graph structure of escalation that follows a case closure. Apply temporal
    sequence analysis and heterogeneous dynamic IAM graphs with attention (GNN-based IAM threat detection)
    plus explainable rare-event CloudTrail ML to identify case-closure-as-precursor-to-escalation patterns.
    Emphasize features such as policy attachment, role assumption, trust/contact modification, and detective-control
    suppression after the closure. Train and validate against the labeled CERT Insider Threat Test Dataset
    and emulated CloudTrail from Stratus Red Team. In the Privilege Escalation context this surfaces multi-step
    escalation chains that begin with a suppressive closure and unfold over subsequent events. Every alert
    MUST list the top-3 contributing features so analysts can validate the sequence rather than trusting
    an opaque score.
  answer_sources:
  - CloudTrail management events
  - AWS Support case history exports
  - CloudTrail Lake
  - Amazon GuardDuty findings
  - AWS Config configuration history
  - 'NAI: Support workflows for compromised or high-value accounts, subsequent management activity by
    the case-handling principal, and investigation timelines correlating case actions with persistent
    account access'
  range: Last 90 days (model over rolling window; score sequences anchored on each ResolveCase)
  queries:
  - technology: ML/pseudocode
    query: "seqs = build_sequences(anchor=\"support:ResolveCase\", window=24h, source=cloudtrail)\ngraph\
      \ = build_dynamic_iam_graph(seqs)  # heterogeneous, attention-based\nmodel = GNN_attention.fit(labeled=CERT_insider\
      \ + stratus_emulated)\nfor seq in seqs:\n    score = model.score(seq)  # emphasize policy_attach,\
      \ assume_role, trust_change, detective_control_disable\n    if score > threshold:\n        top3\
      \ = explain(model, seq)\n        alert(seq, score, top3_features=top3)"
