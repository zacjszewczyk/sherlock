name: 'T1098.A001: AWS Support Case Closure'
id: 3c7cc58f-f339-4944-a953-ca67a8206d70
description: 'Investigate whether an adversary is abusing AWS Support case closure (ResolveCase) to suppress
  security, billing, abuse, root-account-recovery, or account-change notifications and thereby hide and
  preserve unauthorized privilege escalation in an AWS account. This playbook helps an analyst determine
  if a principal with unusual, newly granted, or first-ever AWS Support permissions resolved or closed
  support cases shortly after manipulating IAM policies, MFA devices, role trust policies, alternate/security/billing
  contacts, or root recovery settings - and whether that case interaction was used to reduce scrutiny
  rather than remediate the underlying issue. It correlates CloudTrail support and IAM control-plane events
  with case history, GuardDuty findings, AWS Config drift, and AWS Health events to surface: cases closed
  without customer communication or with sub-10-minute time-to-resolution; permission-probing AccessDenied
  bursts preceding suppression; first-seen support writes by privileged operators; and case closures immediately
  followed by privilege-relevant actions (policy attachment, role assumption, trust changes, contact changes,
  or disabling detective controls). Methods span deterministic symbolic-logic floors, statistical baselining
  (modified Z-score, first-seen rarity, failure-state profiling, time-series forecasting), and explainable
  machine-learning models (graph/GNN clustering and rare-event sequence detection) to give the SOC granular,
  defensible coverage of AWS Support Case Closure used for privilege escalation.'
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
