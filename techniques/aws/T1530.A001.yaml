name: 'T1530.A001: S3 Object Collection'
id: 134f5d0a-2867-48c6-b6a6-184f1dcdc4d7
description: Investigate whether an adversary has collected data from Amazon S3 by retrieving or copying
  objects (s3:GetObject, s3:CopyObject, GetObjectVersion, SelectObjectContent) from buckets, prefixes,
  or object classes that hold sensitive business data. This playbook helps an analyst determine if a principal,
  assumed role, source IP, VPC endpoint, or user agent is accessing S3 content it does not normally touch;
  whether reads cluster on high-value backup, export, finance, legal, or customer-data prefixes; whether
  activity follows recent bucket/object enumeration; and whether objects are being copied or staged to
  newly observed or attacker-controlled destinations. It combines first-seen/novelty detection, volume
  and frequency outlier analysis, failure-state (AccessDenied) profiling, network egress modeling over
  VPC Flow Logs, sequence/workflow modeling of discovery-to-collection chains, and machine-learning session
  classifiers to separate deliberate data harvesting and staging from routine application, backup, analytics,
  replication, and CDN reads.
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has a principal, assumed role, source IP, user agent, VPC endpoint, or accessed prefix that
    is first-seen for a sensitive S3 bucket retrieved or copied objects from it (GetObject, CopyObject,
    GetObjectVersion, or SelectObjectContent)?
  context: Collection of S3 objects by a never-before-seen caller is a strong indicator that an adversary
    is harvesting cloud-stored data. Build a per-bucket baseline of the principals, roles, source IPs,
    user agents, VPC endpoints, and prefixes normally observed, then alert when an S3 data event introduces
    a new combination for that bucket, mirroring GuardDuty Exfiltration:S3/AnomalousBehavior first-time-caller
    logic. A positive result -- a new caller reading objects, especially Macie/tag-flagged sensitive ones
    or immediately following S3 enumeration -- warrants investigation of the identity and session; a negative
    (the caller is an established reader of that bucket) lowers concern. This supports the Collection
    tactic by surfacing the moment data is gathered before it can be exfiltrated.
  answer_sources:
  - CloudTrail data events
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets that store sensitive business data, CloudTrail data events for object retrieval and
    copy operations, and principals with permission to read or replicate S3 content in production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      eventName IN ("GetObject","CopyObject","GetObjectVersion","SelectObjectContent")

      | lookup bucket_baseline bucket userIdentity.arn sourceIPAddress userAgent vpcEndpointId requestParameters.prefix

      | where first_seen_for_bucket=true

      | eval severity=if(macie_sensitive OR recent_s3_enumeration(userIdentity.arn),"high","medium")

      | table _time userIdentity.arn bucket requestParameters.key sourceIPAddress userAgent severity'
- question: Did any S3 read or copy event originate from offensive tooling (Kali/Parrot/Pentoo user agents,
    S3 Browser) or from a Tor exit node or known-malicious source IP?
  context: Adversaries frequently collect S3 data using recognizable offensive distributions, S3 Browser,
    or anonymizing/malicious infrastructure. Match S3 read events whose userAgent indicates pen-test distros
    or browsing tools (GuardDuty PenTest:S3/{Kali,Parrot,Pentoo}Linux; S3 Browser Sigma rule) or whose
    sourceIPAddress is a Tor exit or threat-intel-flagged IP (GuardDuty Discovery:S3/TorIPCaller, Exfiltration:S3/MaliciousIPCaller).
    Validate rule fidelity against Stratus Red Team detonations (userAgent stratus-red-team_*). A hit
    is high-fidelity evidence of malicious collection because legitimate workloads do not use these tools
    or routes; a clean result reduces concern but does not exclude bespoke tooling. This directly serves
    Collection by catching hostile access methods at the point of object retrieval.
  answer_sources:
  - CloudTrail data events
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets that store sensitive business data, CloudTrail data events for object retrieval and
    copy operations, and principals with permission to read or replicate S3 content in production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      eventName IN ("GetObject","CopyObject","GetObjectVersion","SelectObjectContent")

      | eval bad_ua=match(userAgent,"(?i)kali|parrot|pentoo|s3browser|S3 Browser|stratus-red-team")

      | eval bad_ip=cidr_in_threatintel(sourceIPAddress) OR is_tor_exit(sourceIPAddress)

      | where bad_ua OR bad_ip

      | table _time userIdentity.arn bucket sourceIPAddress userAgent bad_ua bad_ip'
- question: Did a session that performed S3 bucket/object discovery (ListBuckets, ListObjects) then pivot
    into concentrated object retrieval across those same buckets?
  context: A discovery-to-collection sequence -- enumerate buckets and objects, then read a small set
    of high-value prefixes, archives, or exports -- is the canonical adversary workflow for cloud data
    theft. Correlate listing operations with subsequent GetObject/CopyObject activity in the same session
    or source pattern, modeling the expected order as a DeepLog-style workflow. Raise severity when the
    sequence narrows from broad discovery to dense reads on a few high-value targets. A positive result
    indicates deliberate reconnaissance-then-harvest behavior rather than routine app access; a negative
    (reads without preceding enumeration, or enumeration by automation that never reads) lowers concern.
    This is central to the Collection tactic, capturing the staging that precedes exfiltration.
  answer_sources:
  - CloudTrail data events
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets that store sensitive business data, CloudTrail data events for object retrieval and
    copy operations, and principals with permission to read or replicate S3 content in production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      | transaction userIdentity.sessionContext.attributes session_id maxpause=30m

      | eval did_discovery=match_any(eventName,"ListBuckets","ListObjects","ListObjectsV2")

      | eval did_reads=count_events(eventName IN ("GetObject","CopyObject"))

      | where did_discovery=true AND did_reads>=N

      | eval prefix_fanout=dc(requestParameters.prefix)

      | where prefix_fanout<=K  /* discovery broad, reads narrow = escalate */

      | table session_id userIdentity.arn did_reads prefix_fanout'
- question: Is the volume or frequency of a principal's S3 object reads a statistical outlier versus its
    own 30-day baseline (bytes downloaded, unique objects, calls per minute, prefix fan-out, time-of-day)?
  context: Mass collection produces measurable spikes in read volume and cadence. Baseline per-principal/per-role
    bytes downloaded, unique objects, GetObject/CopyObject calls per minute, bucket/prefix fan-out, and
    time-of-day over a rolling 30-day window; flag sessions exceeding mean + 3*sigma or a median/MAD modified
    Z-score |M|>3.5 (robust against batch-job tails). Surface the top-3 deviating features in the alert
    (e.g., bytes, object count, prefix fan-out). A positive result -- a session far above the principal's
    normal envelope -- suggests bulk harvesting; a negative keeps the activity within expected operations.
    This supports Collection by quantifying when reads exceed legitimate need.
  answer_sources:
  - CloudTrail data events
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets that store sensitive business data, CloudTrail data events for object retrieval and
    copy operations, and principals with permission to read or replicate S3 content in production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      eventName IN ("GetObject","CopyObject")

      | bin _time span=1d

      | stats sum(bytesTransferred) as bytes dc(requestParameters.key) as objs count as calls dc(bucket)
      as buckets by userIdentity.arn _time

      | eventstats median(bytes) as med_b mad(bytes) as mad_b avg(calls) as mu_c stdev(calls) as sd_c
      by userIdentity.arn

      | eval modz=0.6745*(bytes-med_b)/mad_b

      | where modz>3.5 OR calls>mu_c+3*sd_c

      | table userIdentity.arn _time bytes objs calls buckets modz'
- question: Are there first-seen (principal, eventName, bucket) tuples or reads from a source IP, role,
    or VPC endpoint never previously associated with that principal, and how rare are those tuples fleet-wide?
  context: Novelty in identity-resource-source relationships is a leading signal of account takeover or
    misuse for collection. Flag first-seen (principal, eventName, bucket) tuples and reads from a source
    IP/role/VPC endpoint never before observed for that principal using per-principal CloudTrail baselining,
    then rank rare (principal, bucket, prefix, source-IP, user-agent) tuples by fleet-wide prevalence
    so the rarest combinations rise to the top. A positive result -- a genuinely novel and globally rare
    access pattern -- focuses analyst attention on the most suspicious sessions; common combinations are
    deprioritized. This serves Collection by exposing newly emerged access paths to sensitive data.
  answer_sources:
  - CloudTrail data events
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets that store sensitive business data, CloudTrail data events for object retrieval and
    copy operations, and principals with permission to read or replicate S3 content in production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      eventName IN ("GetObject","CopyObject","GetObjectVersion","SelectObjectContent")

      | eval tuple=mvjoin(mvappend(userIdentity.arn,eventName,bucket,sourceIPAddress,userAgent),"|")

      | lookup principal_history userIdentity.arn tuple OUTPUT seen

      | where isnull(seen)

      | eventstats count as fleet_prevalence by bucket requestParameters.prefix sourceIPAddress userAgent

      | sort + fleet_prevalence

      | table _time userIdentity.arn bucket sourceIPAddress userAgent fleet_prevalence'
- question: Is a principal generating an abnormal rate of AccessDenied/403 errors on S3 reads, or a denial
    spike immediately followed by a successful read run?
  context: Credential probing and permission enumeration leave a trail of AccessDenied errors; an attacker
    often tests access broadly, then succeeds. Track per-principal AccessDenied/403 rate and AccessDenied-then-success
    transitions on S3 reads as a distinct enumeration signal. Baseline normal denial rates and alert on
    bursts, or on a denial spike immediately preceding a successful read run. A positive result -- elevated
    403s or a deny-then-allow pivot -- indicates an actor mapping reachable data before harvesting it;
    a negative (low, steady denials) reflects normal misconfiguration noise. This supports Collection
    by catching the reconnaissance that precedes successful object retrieval.
  answer_sources:
  - CloudTrail data events
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets that store sensitive business data, CloudTrail data events for object retrieval and
    copy operations, and principals with permission to read or replicate S3 content in production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      eventName IN ("GetObject","CopyObject","GetObjectVersion")

      | eval denied=if(errorCode IN ("AccessDenied","403"),1,0)

      | bin _time span=10m

      | stats sum(denied) as denials count as total by userIdentity.arn _time

      | eval deny_rate=denials/total

      | eventstats avg(deny_rate) as mu stdev(deny_rate) as sd by userIdentity.arn

      | where deny_rate>mu+3*sd OR (denials>threshold AND next_window_success(userIdentity.arn))

      | table _time userIdentity.arn denials total deny_rate'
- question: Does a session-level model of S3 access telemetry score this activity as staging/theft rather
    than routine application, backup, or analytics reads?
  context: A learned session model can integrate many weak signals into a single defensible verdict. Train
    a session-level classifier over S3 access telemetry -- source novelty, object sensitivity, bytes transferred,
    retrieval cadence, prefix fan-out, prior enumeration -- to distinguish staging/theft from routine
    application reads, backup, or analytics. Combine GuardDuty's managed anomaly model with an identity-graph
    detector (CS-GAD) that flags principals acting outside their role/peer community; the model must emit
    the top-3 contributing features in each alert for analyst triage. A high theft score warrants investigation;
    a low score with benign features deprioritizes. This serves Collection by holistically separating
    malicious harvesting from legitimate bulk reads.
  answer_sources:
  - CloudTrail data events
  - CloudTrail Lake
  - S3 server access logs
  - GuardDuty S3 Protection findings
  - 'NAI: S3 buckets that store sensitive business data, CloudTrail data events for object retrieval and
    copy operations, and principals with permission to read or replicate S3 content in production accounts'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nmodel=s3_theft_session_classifier\nfeatures = [source_novelty, sensitive_object_ratio,\
      \ bytes_transferred, reads_per_min,\n            prefix_fanout, prior_enumeration_flag, peer_community_distance(CS-GAD)]\n\
      score = model.predict_proba(session_features)\nblend = max(score, guardduty_anomaly_score)\nwhere\
      \ blend > 0.8\nemit session_id, userIdentity.arn, blend, top3_features"
- question: Are there bursts of retrieval or copy operations concentrated on backup, export, legal-hold,
    archive, customer-record, or security-log prefixes and buckets?
  context: Adversaries prioritize the richest data stores, so concentrated reads on backup, export, legal,
    archive, customer-data, or security-log prefixes are a hallmark of deliberate harvesting. Detect bursts
    of retrieval/copy focused on those high-value prefixes and buckets, and escalate if the same session
    also assumes a new role, mints temporary credentials, or touches buckets the principal has never accessed.
    A positive result -- dense reads against sensitive prefixes, especially with new-role/credential pivots
    -- strongly suggests targeted collection; a negative (routine, distributed access) lowers concern.
    This serves Collection by spotlighting the deliberate selection of high-value data.
  answer_sources:
  - CloudTrail data events
  - S3 server access logs
  - VPC Flow Logs
  - Amazon Macie findings
  - 'NAI: High-value S3 prefixes and objects, buckets associated with exports or backups, network paths
    used by VPC endpoints accessing S3, and data-classification findings for collected content'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      eventName IN ("GetObject","CopyObject")

      | where match(bucket+"/"+requestParameters.prefix,"(?i)backup|export|legal|hold|archive|customer|pii|security-?log|audit")

      | bin _time span=15m

      | stats count as reads dc(requestParameters.key) as objs by userIdentity.arn bucket _time

      | where reads>burst_threshold

      | eval escalate=session_assumed_new_role(userIdentity.arn) OR new_bucket_for_principal(userIdentity.arn,bucket)

      | table _time userIdentity.arn bucket reads objs escalate'
- question: Were sensitive objects copied (CopyObject), replicated, or staged into buckets, prefixes,
    or regions that are new for the workload, and was S3 access logging disabled or cross-account replication
    added?
  context: Copying or replicating objects to new destinations is a common staging step before exfiltration,
    often paired with tampering that hides the activity. Alert when CopyObject, replication-config changes,
    or same-account staging writes sensitive objects into buckets, prefixes, or regions new for that workload,
    and correlate with the S3 data-management tampering Sigma rule for disabled access logging or new
    cross-account replication. Include VPC Flow Log/access-log evidence of subsequent movement toward
    external systems. A positive result -- novel destination plus tampering or outbound movement -- is
    strong evidence of attacker staging; a negative (copies within established workflows) lowers concern.
    This serves Collection by catching consolidation of stolen data into attacker-controlled or unusual
    stores.
  answer_sources:
  - CloudTrail data events
  - S3 server access logs
  - VPC Flow Logs
  - Amazon Macie findings
  - 'NAI: High-value S3 prefixes and objects, buckets associated with exports or backups, network paths
    used by VPC endpoints accessing S3, and data-classification findings for collected content'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com"

      (eventName="CopyObject" AND new_destination_for_workload(requestParameters.bucket,awsRegion))

      OR eventName IN ("PutBucketReplication","PutBucketLogging","DeleteBucketLogging")

      | eval tamper=match(eventName,"Logging|Replication")

      | join session_id [search source=VPCFlowLogs action=ACCEPT dstaddr_not_in_corp]

      | table _time userIdentity.arn eventName requestParameters.bucket awsRegion tamper dstaddr bytes'
- question: Does a session show abnormally high byte volume, mean object size, sensitive-object ratio,
    or cross-bucket breadth compared with the principal/application baseline?
  context: Targeted harvesting of high-value content shows up as a shift in the mix and magnitude of reads,
    not just raw count. Compare session Volume (bytes read, mean object size), sensitive-object ratio
    (Macie-flagged share), and cross-bucket breadth against the principal/application baseline; flag sessions
    exceeding mean + 3*sigma or modified Z-score |M|>3.5, and report which metric drove the alert. A positive
    result -- e.g., a spike in Macie-flagged objects or unusually large objects across many buckets --
    indicates concentration on valuable data; a negative stays within normal. This serves Collection by
    measuring the qualitative shift toward sensitive, high-value object reads.
  answer_sources:
  - CloudTrail data events
  - S3 server access logs
  - VPC Flow Logs
  - Amazon Macie findings
  - 'NAI: High-value S3 prefixes and objects, buckets associated with exports or backups, network paths
    used by VPC endpoints accessing S3, and data-classification findings for collected content'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com" eventName IN ("GetObject","CopyObject")

      | lookup macie_labels bucket requestParameters.key OUTPUT sensitive

      | transaction userIdentity.sessionContext.attributes session_id maxpause=30m

      | eval bytes=sum(bytesTransferred), avg_obj=avg(bytesTransferred), sens_ratio=count(sensitive)/count,
      buckets=dc(bucket)

      | eventstats median(bytes) as m mad(bytes) as d by userIdentity.arn

      | eval modz=0.6745*(bytes-m)/d

      | where modz>3.5 OR sens_ratio>baseline_ratio*2

      | table session_id userIdentity.arn bytes avg_obj sens_ratio buckets modz driver'
- question: After suppressing seasonal backup/ETL/CDN cycles, are there dense retrieval or large-object
    bursts whose timing falls outside approved transfer windows?
  context: Legitimate bulk reads follow predictable schedules (nightly backups, ETL, CDN refresh), so
    the analytically interesting bursts are those that break seasonality. Apply Seasonal Hybrid ESD (S-H-ESD)
    to per-bucket/per-principal read-volume and large-object-count time-series to flag dense retrieval/copy
    bursts while suppressing recurring backup/ETL/CDN cycles. Highlight bursts whose timing and destination
    fall outside approved transfer windows. A positive result -- an off-schedule, off-window burst --
    is suspicious; a negative (burst aligned to a known seasonal cycle) is expected. This serves Collection
    by isolating anomalous harvesting from the heavy but legitimate periodic read activity that would
    otherwise mask it.
  answer_sources:
  - CloudTrail data events
  - S3 server access logs
  - VPC Flow Logs
  - Amazon Macie findings
  - 'NAI: High-value S3 prefixes and objects, buckets associated with exports or backups, network paths
    used by VPC endpoints accessing S3, and data-classification findings for collected content'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      source=CloudTrail eventSource="s3.amazonaws.com" eventName IN ("GetObject","CopyObject")

      | bin _time span=1h

      | stats sum(bytesTransferred) as vol count(eval(bytesTransferred>large_obj)) as big by bucket userIdentity.arn
      _time

      | sh_esd(vol, period=24h, alpha=0.05) as anomaly

      | where anomaly=true

      | eval off_window=NOT in_approved_transfer_window(_time)

      | where off_window

      | table _time bucket userIdentity.arn vol big'
- question: Do VPC Flow Logs show abnormally large or atypical egress on S3/VPC-endpoint paths toward
    non-corporate IPs, and is the destination first-seen?
  context: The network leg confirms whether collected S3 data is actually moving out of the environment.
    Model per-flow byte counts and transfer-size distributions for S3/VPC-endpoint paths in VPC Flow Logs
    and flag abnormally large or atypical egress toward non-corporate IPs using distance-from-baseline
    scoring (PAYL-style), then pair with first-seen destination detection. A positive result -- a large
    transfer to a never-before-seen, non-corporate destination -- corroborates exfiltration following
    collection; a negative (egress within normal volume and to known endpoints) lowers concern. This serves
    Collection by linking object reads to outbound movement, distinguishing staging that stays internal
    from data leaving the boundary.
  answer_sources:
  - CloudTrail data events
  - S3 server access logs
  - VPC Flow Logs
  - Amazon Macie findings
  - 'NAI: High-value S3 prefixes and objects, buckets associated with exports or backups, network paths
    used by VPC endpoints accessing S3, and data-classification findings for collected content'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '>-

      # VPC Flow Logs / Zeek conn over S3 endpoint paths

      filter dstaddr NOT in corporate_cidr AND srcaddr in s3_vpce_subnets

      | stats sum(bytes_out) as egress by srcaddr dstaddr

      | score = distance_from_baseline(egress, transfer_size_dist)   # PAYL

      | eval first_seen=is_new_destination(dstaddr)

      | where score>3 OR (first_seen AND egress>threshold)

      | table srcaddr dstaddr egress score first_seen'
- question: Does a session classifier over access logs, sensitivity labels, object-size distributions,
    destination patterns, and preceding discovery flag this as malicious harvesting rather than analytics/backup/replication/CDN?
  context: A purpose-built classifier can reconcile sensitivity, size, destination, and discovery context
    to separate genuine harvesting from heavy-but-benign workflows. Build a session classifier over access
    logs, data-sensitivity labels, object-size distributions, destination patterns, and preceding discovery;
    detect anomalous staging sequences with DeepLog and out-of-community access with CS-GAD; train/tune
    on Stratus Red Team-labeled events; and surface the top-3 contributing features per alert. A high
    harvesting score -- e.g., novel destination + high sensitivity + post-discovery staging -- warrants
    investigation; a low score with analytics/backup signatures deprioritizes. This serves Collection
    by providing a learned, explainable verdict on whether observed reads constitute deliberate data harvesting.
  answer_sources:
  - CloudTrail data events
  - S3 server access logs
  - VPC Flow Logs
  - Amazon Macie findings
  - 'NAI: High-value S3 prefixes and objects, buckets associated with exports or backups, network paths
    used by VPC endpoints accessing S3, and data-classification findings for collected content'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nmodel=cloud_storage_harvesting_classifier\nfeatures=[sensitivity_label_mix, object_size_dist,\
      \ destination_novelty,\n          preceding_discovery, deeplog_seq_anomaly, csgad_community_distance]\n\
      score=model.predict_proba(session_features)\nwhere score>0.8\nemit session_id, userIdentity.arn,\
      \ score, top3_features"
