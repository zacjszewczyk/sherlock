name: 'T1486.A001: S3 Encryption - SSE-C Key Encryption'
id: f5801ea5-0321-4ad0-b7fb-923358ac66ea
description: Investigate whether an adversary has used Server-Side Encryption with Customer-Provided Keys
  (SSE-C) to re-encrypt existing Amazon S3 objects in a way that locks the organization out of its own
  data for impact (ransomware in the cloud). Because the attacker supplies the SSE-C key and AWS stores
  only an HMAC of it, objects rewritten this way cannot be recovered without the attacker's key. This
  playbook helps an analyst (1) detect bulk PutObject/CopyObject/UploadPart activity carrying SSE-C headers
  against critical buckets, (2) correlate that activity with prior reconnaissance (bucket and object enumeration)
  and with recovery-defeating changes such as suspended versioning, short lifecycle expirations, and replication/encryption
  tampering, (3) profile statistical outliers in SSE-C usage, AccessDenied bursts, and write/read volume,
  (4) apply machine-learning anomaly detection to the recon-to-rewrite-to-delete API sequence, and (5)
  confirm downstream impact through spikes in GetObject 403/AccessDenied failures, failing restore and
  content-delivery jobs, and ransom-note objects. Use it to scope, confirm, and respond to suspected S3
  SSE-C encryption-for-impact campaigns.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any single principal bulk-rewriting existing objects in critical S3 buckets using SSE-C
    headers (PutObject, CopyObject, or multipart UploadPart with x-amz-server-side-encryption-customer-algorithm=AES256
    and a customer-key-MD5)?
  context: 'This is the core impact action for T1486.A001 (Impact/TA0040): an adversary re-encrypts objects
    with a key only they control, so AWS - which stores only an HMAC of the SSE-C key - cannot help the
    organization recover the data. In S3 data events, look for PutObject/CopyObject/UploadPart that carry
    the SSE-C customer-algorithm and customer-key-MD5 headers and that target EXISTING keys in high-value
    buckets (operational data, backups, shared documents). A positive result is especially strong when
    the bucket policy mandates SSE-KMS/SSE-S3 yet SSE-C is being used. Alert on any SSE-C write to a policy-protected
    bucket, and treat as high severity when one principal issues >1,000 SSE-C rewrites in 5 minutes or
    rewrites >100 distinct keys in a bucket. Validate detections with Stratus Red Team detonations. A
    burst against production or backup data indicates an active ransomware-in-the-cloud event.'
  answer_sources: &id001
  - AWS CloudTrail management events
  - Amazon S3 data events
  - Amazon S3 server access logs
  - Amazon CloudWatch metrics
  - 'NAI: High-value S3 buckets holding operational data, backup sets, and shared documents, plus data-event
    logging for bulk object copy or rewrite activity that changes encryption handling'
  range: Last 90 days; pivot to 5-minute windows around any detected SSE-C write burst
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=s3_data_events eventName IN (PutObject,CopyObject,UploadPart)\n| where requestParameters.x-amz-server-side-encryption-customer-algorithm=\"\
      AES256\"\n  AND isnotnull(requestParameters.x-amz-server-side-encryption-customer-key-MD5)\n  AND\
      \ bucket IN (critical_buckets) AND key_exists_before(object)\n| stats count AS rewrites, dc(object)\
      \ AS distinct_keys BY userIdentity.arn, bucket, window=5m\n| where rewrites>1000 OR distinct_keys>100\
      \ OR bucket_policy_requires_kms(bucket)"
- question: Did the principal performing SSE-C rewrites first conduct reconnaissance of buckets and objects
    (ListBuckets, ListObjects, HeadObject, GetBucketVersioning, GetObjectTagging, or bucket-policy inspection)
    before encrypting?
  context: Cloud ransomware actors typically inventory the environment before encrypting, to find high-value
    data and understand recovery controls (the staged inventory-then-encrypt workflow documented by Halcyon
    and Invictus-IR). Correlating recent enumeration API calls by the same principal, access key, or source
    IP with the subsequent SSE-C rewrite burst confirms intent and helps scope which buckets and objects
    were targeted. A positive result - recon by the same identity shortly before SSE-C writes - raises
    confidence that the encryption is malicious rather than a legitimate re-encryption job, and exposes
    the full kill-chain leading to data denial under the Impact tactic.
  answer_sources: *id001
  range: Last 90 days; correlate recon within 24-72 hours preceding any SSE-C rewrite burst
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=cloudtrail eventName IN (ListBuckets,ListObjects,ListObjectsV2,HeadObject,\n  GetBucketVersioning,GetObjectTagging,GetBucketPolicy,GetBucketAcl)\n\
      | join type=inner userIdentity.arn [ search sse_c_rewrite_bursts ]\n| where recon.time < rewrite.time\
      \ AND rewrite.time-recon.time < 72h\n| stats count AS recon_calls, dc(eventName) AS recon_apis BY\
      \ userIdentity.arn, sourceIPAddress\n| where recon_apis>=3"
- question: Near any SSE-C rewrite burst, did the same or related principal make management-plane changes
    that defeat recovery - PutBucketLifecycleConfiguration with short (<30 day, e.g. ~7 day) expiration,
    PutBucketVersioning=Suspended, PutEncryption, or PutReplication?
  context: Encryption alone does not guarantee irrecoverability if versioning retains prior plaintext
    object versions; adversaries therefore tamper with data-management controls to ensure the organization
    cannot roll back. The Codefinger campaign set ~7-day object expirations to permanently delete data
    shortly after encryption. Fire on these management events when they occur close in time to a rewrite
    burst by the same or a related principal. A positive result strongly indicates deliberate, recovery-denying
    impact (TA0040) rather than benign configuration change, and warns responders that the recovery window
    may be closing fast - preserve versions and objects immediately.
  answer_sources: *id001
  range: Last 90 days; correlate management changes within a few hours of an SSE-C rewrite burst
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=cloudtrail eventName IN (PutBucketLifecycleConfiguration,PutBucketVersioning,\n  PutEncryption,PutBucketReplication)\n\
      | eval recovery_defeat = (eventName=\"PutBucketVersioning\" AND status=\"Suspended\")\n  OR (eventName=\"\
      PutBucketLifecycleConfiguration\" AND expiration_days<30)\n  OR eventName IN (\"PutEncryption\"\
      ,\"PutBucketReplication\")\n| join type=inner bucket,userIdentity.arn [ search sse_c_rewrite_bursts\
      \ ]\n| where recovery_defeat AND abs(mgmt.time-rewrite.time)<6h"
- question: Is SSE-C being used anywhere organizational policy mandates SSE-KMS or SSE-S3 - i.e., is there
    any SSE-C usage at all in buckets where it should never appear?
  context: Where policy standardizes on AWS-managed (SSE-S3) or KMS-backed (SSE-KMS) encryption, ANY SSE-C
    usage is a policy violation and a high-fidelity indicator, because legitimate workflows never supply
    customer keys. The s3:x-amz-server-side-encryption-customer-algorithm IAM condition key can both alert
    on and proactively DENY SSE-C writes. Treating any SSE-C request as a violation yields a low-false-positive
    signal in policy-protected buckets. A positive result means either misconfiguration or an attacker
    bypassing the approved encryption path to lock data (Impact). Recommend enforcing a bucket policy
    or SCP that denies SSE-C in these buckets as a mitigation.
  answer_sources: *id001
  range: Last 90 days; continuous enforcement going forward
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=s3_data_events eventName IN (PutObject,CopyObject,UploadPart)\n| where isnotnull(requestParameters.x-amz-server-side-encryption-customer-algorithm)\n\
      \  AND bucket IN (kms_mandated_buckets)\n| stats count BY userIdentity.arn, bucket, sourceIPAddress\n\
      | eval severity=\"high\"  // ANY SSE-C here violates policy; also enforce via IAM/SCP Deny"
- question: Do per-principal or per-bucket statistics show an SSE-C usage outlier - an abnormal rise in
    objects rewritten/min, bytes written/min, SSE-C request count, SSE-C-to-total-write ratio, copy-to-original
    ratio, or distinct-prefix breadth versus a 30-day baseline (including the FIRST-EVER SSE-C operation
    by a role)?
  context: 'Rule thresholds miss low-and-slow or novel activity, so baseline each principal and bucket
    on Volume (bytes and objects per minute), Frequency (SSE-C requests/min), State (success vs AccessDenied),
    SSE-C-to-total-write ratio, copy-to-original ratio, and distinct-prefix breadth, then flag statistically
    significant deviations using metric filters, Contributor Insights, or band anomaly detection. First-seen
    logic is powerful: the first time a role ever issues an SSE-C copy/put is inherently suspicious. A
    practical starting cut is the SSE-C ratio for a bucket climbing from ~0% baseline to >20% of writes;
    derive bucket-specific thresholds from 30-day history. A positive result flags emerging encryption-for-impact
    even before volume thresholds trip.'
  answer_sources: *id001
  range: Last 90 days; baseline 30 days, evaluate in rolling 1-5 minute and hourly windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=s3_data_events\n| eval is_ssec=isnotnull(requestParameters.x-amz-server-side-encryption-customer-algorithm)\n\
      | stats sum(is_ssec) AS ssec, count AS total, dc(prefix) AS prefixes,\n        sum(bytes) AS bytes\
      \ BY userIdentity.arn, bucket, span=5m\n| eval ssec_ratio=ssec/total\n| eventstats avg(ssec_ratio)\
      \ AS base_ratio, stdev(ssec_ratio) AS sd BY bucket\n| where ssec_ratio>0.20 OR ssec_ratio>base_ratio+3*sd\
      \ OR first_seen_ssec(userIdentity.arn)"
- question: Is there an abnormal burst of AccessDenied/error responses for the principal - for example
    denied ListBuckets/GetObject/CreateUser during recon followed by SUCCESSFUL SSE-C writes - that deviates
    from the per-principal denied-call baseline?
  context: 'Stolen but limited-permission credentials produce a tell-tale failure pattern: the attacker
    probes APIs, accumulates AccessDenied errors while mapping their permissions, then pivots to the operations
    that do succeed (SSE-C writes). Invictus-IR reconstructed exactly this sequence. Profiling AccessDenied/error
    rates as a distinct signal and alarming on deviation from the per-principal baseline (CloudWatch ML)
    surfaces compromised-credential activity that volume metrics alone miss. A positive result - a denied-call
    spike immediately preceding successful SSE-C encryption - is high-signal evidence of an external actor
    using stolen keys to cause Impact.'
  answer_sources: *id001
  range: Last 90 days; baseline per-principal denied-call rate, evaluate in rolling windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=cloudtrail\n| eval denied=(errorCode IN (\"AccessDenied\",\"Client.UnauthorizedOperation\"\
      ))\n| stats sum(denied) AS denials, dc(eventName) AS denied_apis,\n        sum(eval(is_ssec AND\
      \ errorCode=null)) AS ssec_success BY userIdentity.arn, span=10m\n| eventstats avg(denials) AS base,\
      \ stdev(denials) AS sd BY userIdentity.arn\n| where denials>base+3*sd AND ssec_success>0"
- question: Does a multivariate model score this principal/bucket as a ransomware-style S3 encryption
    anomaly, and is the recon-to-SSE-C-copy-to-lifecycle-to-delete API sequence out-of-distribution?
  context: 'Combine the individual signals into one model: an Isolation Forest over per-principal/per-bucket
    features (objects rewritten, bytes, SSE-C ratio, distinct prefixes, copy-to-original ratio, AccessDenied
    rate, actor novelty) plus sequence modeling (DeepLog) of the API order recon -> SSE-C copy -> lifecycle/versioning
    change -> delete to catch out-of-distribution kill-chains; complement with rare-function and population
    analysis over CloudTrail. Managed GuardDuty/S3 anomaly findings provide a parallel ML layer. Alerts
    MUST surface the top-3 contributing features (e.g., SSE-C ratio, distinct-prefix breadth, novel principal).
    Tune on labeled Stratus Red Team emulation telemetry. A high score with a coherent malicious sequence
    is strong evidence of encryption-for-impact (TA0040).'
  answer_sources: *id001
  range: Last 90 days; score continuously, retrain on rolling 30-90 day history
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = per_principal_bucket(objects_rewritten, bytes, ssec_ratio, distinct_prefixes,\n\
      \  copy_to_original_ratio, access_denied_rate, actor_novelty)\nscore = IsolationForest.fit(baseline).decision_function(features)\n\
      seq_anom = DeepLog.is_ood([recon, ssec_copy, lifecycle_change, delete])\nalert if score>threshold\
      \ OR seq_anom\n  with top_3_contributing_features  // also fuse GuardDuty/S3 anomaly findings"
- question: After suspicious SSE-C rewrites, are there spikes in failed GetObject (HTTP 403/AccessDenied)
    on the SAME object prefixes that were rewritten, and the appearance of ransom-note PutObject files?
  context: 'This confirms downstream impact: once objects are re-encrypted under an attacker-held key,
    legitimate reads fail with 403/AccessDenied because the organization cannot supply the SSE-C key.
    Correlate recent SSE-C rewrites with read-failure spikes on the identical prefixes, and watch for
    newly created ransom-note objects (e.g., README or recovery instructions) being PUT into the affected
    buckets. Raise severity when failures follow a concentrated rewrite burst on production or backup
    data. A positive result is decisive confirmation that an encryption-for-impact event has materialized
    into actual data-availability loss (Impact/TA0040) and helps scope exactly which prefixes are denied.'
  answer_sources: &id002
  - Amazon S3 server access logs
  - Application logs
  - AWS CloudTrail management events
  - Amazon CloudWatch metrics
  - 'NAI: Applications reading from shared S3 buckets, user-facing content delivery paths, and monitoring
    for read failures on objects that were recently copied or overwritten with new encryption semantics'
  range: Last 90 days; correlate read failures within 1-24 hours after a rewrite burst
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=s3_server_access_logs operation=REST.GET.OBJECT http_status IN (403)

      | join type=inner bucket,prefix [ search sse_c_rewrite_bursts ]

      | where getfail.time>rewrite.time AND getfail.time-rewrite.time<24h

      | stats count AS denials BY bucket, prefix

      | append [ search source=s3_data_events eventName=PutObject key LIKE "%README%" OR key LIKE "%RECOVER%"
      ]'
- question: Are objects recently rewritten with SSE-C now referenced by FAILING restore jobs, content-delivery
    workflows, or backup-verification tasks that previously succeeded for the same bucket/prefix - and
    is recovery further blocked by suspended versioning or short lifecycle expiration?
  context: 'Beyond raw GetObject 403s, the operational blast radius shows up as broken business processes:
    restore jobs, CDN/content-delivery pipelines, and backup-verification tasks that used to succeed now
    fail on the rewritten prefixes. Cross-check whether versioning was suspended or a short lifecycle
    expiration removed recoverable prior versions, which would mean the data is unrecoverable. A positive
    result demonstrates real mission impact and informs response prioritization and recovery feasibility,
    directly supporting the Impact tactic by measuring loss of availability and integrity to dependent
    workflows.'
  answer_sources: *id002
  range: Last 90 days; correlate failing jobs with rewrites and recovery-control changes in the same window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=application_logs (job_type IN (restore,content_delivery,backup_verify)) status=failed\n\
      | where object_ref.bucket,object_ref.prefix IN (sse_c_rewritten_prefixes)\n  AND previously_succeeded(bucket,prefix)\n\
      | join bucket [ search source=cloudtrail eventName=PutBucketVersioning status=Suspended\n  OR (eventName=PutBucketLifecycleConfiguration\
      \ expiration_days<30) ]"
- question: Does any bucket/prefix show an abrupt concentration of read failures - GetObject 403/AccessDenied
    counts, lower read-success rate, or higher retrieval latency - exceeding baseline mean + 3 sigma within
    an hour of a copy/overwrite spike using SSE-C parameters?
  context: Statistically baseline read-success rate, retrieval latency, 403/AccessDenied counts, and failure
    concentration by bucket/prefix, then flag abrupt increases that coincide with a recent SSE-C write
    spike. A practical starting cut is per-prefix GetObject failure rate exceeding baseline mean + 3 sigma
    within one hour of a rewrite burst. When S3 data events are NOT enabled, corroborate impact via AWS
    Cost & Usage Report byte/request anomalies, since a rewrite campaign moves unusual data volumes. A
    positive result quantifies the availability impact and pinpoints affected prefixes even without full
    data-event logging, supporting Impact-tactic confirmation and scoping.
  answer_sources: *id002
  range: Last 90 days; evaluate in rolling 1-hour windows anchored to rewrite bursts
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=s3_server_access_logs\n| eval fail=(http_status>=400)\n| stats sum(fail) AS fails,\
      \ count AS reqs, avg(turnaround_ms) AS latency BY bucket, prefix, span=1h\n| eval fail_rate=fails/reqs\n\
      | eventstats avg(fail_rate) AS base, stdev(fail_rate) AS sd BY bucket, prefix\n| where fail_rate>base+3*sd\
      \ AND near_recent_ssec_write(bucket,prefix,1h)\n  // fallback: corroborate with Cost & Usage Report\
      \ byte/request spikes when data events absent"
- question: Does multivariate anomaly detection across write operations and downstream read telemetry
    identify an unauthorized cloud-storage encryption campaign - broad object rewriting followed by clustered
    read failures and loss of access to high-value content?
  context: A model that jointly considers the write side (SSE-C rewrites, affected-prefix breadth, actor
    novelty) and the read side (post-rewrite 403 spike, clustered failures, loss of access to high-value
    content) detects the full impact campaign with fewer false positives than either signal alone. Use
    Isolation Forest plus sequence modeling (DeepLog), and add UEBA volume/identity/source-IP anomaly
    context (Microsoft Sentinel anomalies). Score higher when broad rewriting is followed by clustered
    read failures. Alert text MUST list the top-3 contributing features (e.g., post-rewrite 403 spike,
    affected-prefix breadth, novel actor). A high score correlating write encryption with read denial
    is strong, explainable evidence of an active S3 encryption-for-impact (TA0040) campaign.
  answer_sources: *id002
  range: Last 90 days; score continuously, retrain on rolling 30-90 day history
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = join_write_read(ssec_rewrites, affected_prefix_breadth, actor_novelty,\n  post_rewrite_403_spike,\
      \ clustered_read_failures, high_value_access_loss)\nscore = IsolationForest.decision_function(features)\n\
      seq = DeepLog.is_ood([rewrite_burst, read_failure_cluster])\nalert if score>threshold OR seq with\
      \ top_3_contributing_features\n  // enrich with UEBA volume/identity/source-IP anomalies"
