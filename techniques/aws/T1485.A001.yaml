questions:
- question: Did a principal delete or schedule deletion of production-tagged or recovery-critical RDS
    resources via rds:DeleteDBInstance, rds:DeleteDBCluster, rds:DeleteDBSnapshot, rds:DeleteDBClusterSnapshot,
    or rds:DeleteDBParameterGroup, particularly with SkipFinalSnapshot=true or --delete-automated-backups,
    and was the same principal recently granted elevated access or had it disabled protections just before?
  context: 'Under the Impact tactic, deletion of RDS instances and their backups causes permanent data
    loss and disrupts business operations. Look in CloudTrail management events for any of the RDS Delete*
    APIs targeting resources tagged production or otherwise recovery-critical, and treat SkipFinalSnapshot=true
    (no recoverable final snapshot) and --delete-automated-backups as high-impact variants because they
    remove the last recovery point. Escalate when the same principal or session shortly before disabled
    deletion protection, set backup retention to 0, enumerated backups, or assumed an elevated role. A
    positive result is a strong destructive-impact signal; a negative result favors routine, approved
    decommissioning. Validate rule coverage and latency with Stratus Red Team detonations. References:
    [Deleting a DB Instance (AWS RDS docs)](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_DeleteInstance.html);
    [AWS Threat Technique Catalog T1485.A001](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.A001.html);
    [Stratus Red Team](https://github.com/DataDog/stratus-red-team)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (pivot 24 hours before each delete for preceding protection changes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=cloudtrail eventSource=\"rds.amazonaws.com\"\n| where eventName in (\"DeleteDBInstance\"\
      ,\"DeleteDBCluster\",\"DeleteDBSnapshot\",\"DeleteDBClusterSnapshot\",\"DeleteDBParameterGroup\"\
      )\n| eval skip_final=requestParameters.skipFinalSnapshot, del_auto=requestParameters.deleteAutomatedBackups\n\
      | eval prod=if(match(resourceTags,\"(?i)prod|critical\"),1,0)\n| join type=left userIdentity.arn\
      \ [ search source=cloudtrail eventName in (\"ModifyDBInstance\",\"ModifyDBCluster\",\"AssumeRole\"\
      ) earliest=-24h\n    | where requestParameters.deletionProtection=false OR requestParameters.backupRetentionPeriod=0\
      \ OR eventName=\"AssumeRole\" ]\n| where prod=1 OR skip_final=\"true\" OR del_auto=\"true\"\n| alert\
      \ severity=high"
- question: Did a principal weaken RDS recovery protections (rds:ModifyDBInstance with BackupRetentionPeriod=0
    or deletion-protection-off, or rds:ModifyDBCluster deletion-protection-off) and then perform an RDS
    deletion within 24 hours in the same principal/session?
  context: 'In the Impact tactic, cloud destruction is typically a small number of recovery-removing control-plane
    calls rather than a high-volume delete spree, so this chain matters even when only a couple of API
    calls are involved. Setting BackupRetentionPeriod=0 disables automated backups and deletes existing
    automated snapshots, and turning off deletion protection removes the guardrail that blocks destruction.
    Correlate these weakening modifications with a subsequent Delete* by the same principal/session within
    24 hours and present them as one impact workflow. Do not gate this detection on per-object delete
    counts. A positive result indicates a deliberate setup-then-destroy sequence; a negative result may
    be benign retention tuning without follow-on deletion. References: [Working With Backups](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html);
    [AWS Threat Technique Catalog T1485.A001](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.A001.html);
    [Unit 42 Cloud Ransomware](https://unit42.paloaltonetworks.com/cloud-ransomware/)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (correlate weakening and delete within a 24-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="rds.amazonaws.com"

      | eval weaken=if((eventName in ("ModifyDBInstance","ModifyDBCluster")) AND (requestParameters.backupRetentionPeriod=0
      OR requestParameters.deletionProtection=false),1,0)

      | eval del=if(eventName in ("DeleteDBInstance","DeleteDBCluster","DeleteDBSnapshot","DeleteDBClusterSnapshot"),1,0)

      | sort _time | streamstats time_window=24h max(weaken) as weakened_recently by userIdentity.arn

      | where del=1 AND weakened_recently=1

      | alert severity=high  # impact workflow, do not gate on delete count'
- question: Did a principal enumerate RDS resources (rds:DescribeDBInstances / rds:DescribeDBSnapshots)
    and then, within the same session, issue Modify* or Delete* calls against the enumerated resources?
  context: 'Under the Impact tactic, reconnaissance frequently precedes destruction: an adversary lists
    databases and snapshots to identify what to destroy and confirm recovery paths before acting. Flag
    sessions where Describe* enumeration is followed by Modify*/Delete* against those same resource identifiers
    within the session. A positive result indicates a recon-then-destroy precursor and warrants immediate
    triage; a negative result (describes only, or modifies of unrelated resources) is weaker. This precursor
    pattern is documented in the AWS Threat Technique Catalog for T1485.A001. References: [AWS Threat
    Technique Catalog T1485.A001](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.A001.html)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (scope to a single session/credential window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventSource="rds.amazonaws.com"

      | transaction userIdentity.accessKeyId maxspan=1h

      | eval has_recon=if(match(eventName,"DescribeDBInstances|DescribeDBSnapshots"),1,0)

      | eval has_destroy=if(match(eventName,"^(Modify|Delete)"),1,0)

      | where has_recon=1 AND has_destroy=1 AND recon_resource==destroy_resource

      | alert'
- question: Did a single principal generate a burst of AccessDenied or Client.UnauthorizedOperation errors
    on RDS Delete*/Modify* APIs, indicating a constrained actor probing for destructive permissions?
  context: 'In the Impact tactic, an actor who lacks full permissions may probe which destructive RDS
    actions are allowed before succeeding. Profile the failure signal: raise an alert when one principal
    produces a burst of errorCode=AccessDenied or Client.UnauthorizedOperation specifically on RDS Delete*/Modify*
    APIs. This is distinct from successful destruction but is a valuable early-warning and intent indicator.
    Use failure-rate profiling (modified Z-score over the principal''s normal denied-rate) to separate
    genuine probing from occasional benign denials. A positive result suggests permission enumeration
    toward destruction; a negative result is routine. References: [DEW 145 Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (alert on short bursts, e.g. 10-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="rds.amazonaws.com"

      | where match(eventName,"^(Delete|Modify)") AND (errorCode="AccessDenied" OR errorCode="Client.UnauthorizedOperation")

      | bin _time span=10m | stats count as denied by userIdentity.arn, _time

      | eventstats median(denied) as med, mad(denied) as mad by userIdentity.arn

      | eval mzs=0.6745*(denied-med)/mad | where mzs>3.5

      | alert'
- question: Does the frequency or volume of RDS Delete*/Modify* activity for a principal, role, or account
    deviate sharply from its historical baseline, for example more than five distinct resources deleted
    in ten minutes or a first-of-its-kind delete?
  context: 'Under the Impact tactic, statistical baselining catches destructive outliers that fixed rules
    miss. Baseline per principal/role/account the frequency (Delete*/Modify* events per hour), volume
    (distinct DB instances/clusters/snapshots affected per session), and protection-change counts over
    30-90 days, then flag deviations with a MAD-based modified Z-score (|M_i| > 3.5) that resists batch-job
    heavy tails. Implement with CloudWatch metric filters plus band-based Anomaly Detection and Contributor
    Insights to name the top principal/resource. Start at thresholds of more than five distinct resources
    deleted in ten minutes or any first-of-its-kind delete. A positive result is an anomalous destructive
    spike; a negative result is consistent with established behavior. References: [DEW 145](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [AWS CloudWatch ML](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (baseline 30-90 days of history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="rds.amazonaws.com" eventName IN ("Delete*","Modify*")

      | bin _time span=1h | stats count as freq dc(resourceId) as distinct_resources by userIdentity.arn,
      _time

      | eventstats median(freq) as med, mad(freq) as mad by userIdentity.arn

      | eval mzs=0.6745*(freq-med)/mad

      | where mzs>3.5 OR distinct_resources>5

      | alert  # threshold: >5 distinct resources in 10 min or first-of-its-kind'
- question: Is this the principal's first-ever use of a destructive RDS API such as rds:DeleteDBInstance,
    rds:DeleteDBClusterSnapshot, or a rds:ModifyDBInstance retention change?
  context: 'In the Impact tactic, a principal calling a destructive RDS API for the very first time is
    a high-signal, explainable anomaly. Maintain a per-principal lookback baseline of previously observed
    API actions and alert when a principal issues its first-ever destructive call, naming the specific
    rare API so triage is fast and defensible. A positive result indicates novel destructive behavior
    by an identity that has never done so before (possible compromise or insider action); a negative result
    means the action is within the principal''s established repertoire and may be routine. References:
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (per-principal lookback over full available history)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=cloudtrail eventSource="rds.amazonaws.com"

      | where eventName in ("DeleteDBInstance","DeleteDBClusterSnapshot") OR (eventName="ModifyDBInstance"
      AND isnotnull(requestParameters.backupRetentionPeriod))

      | lookup principal_api_history userIdentity.arn eventName OUTPUT seen

      | where isnull(seen)  # first-ever destructive API for this principal

      | eval rare_api=eventName | alert'
- question: Has the count of restorable snapshots, automated-backup retention days, or protected-database
    count dropped abruptly for critical databases beyond normal maintenance seasonality?
  context: 'Under the Impact tactic, destruction shows up as a measurable loss of recovery coverage. Track
    restorable snapshots, automated-backup retention days (expected 1-35), and protected-database count
    as time series, and alert on abrupt dips using Seasonal Hybrid ESD, which suppresses maintenance seasonality
    and catches both spikes and dips. A positive result indicates recovery capability is being eroded,
    often a precursor to or consequence of destruction; a negative result means coverage remains stable.
    This complements per-event rules by detecting the cumulative effect on recoverability. References:
    [Working With Backups](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html);
    [S-H-ESD, Hochenbaum et al.](https://arxiv.org/pdf/1704.07706)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (time series with seasonal baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=rds_inventory metric IN (restorable_snapshots, backup_retention_days, protected_db_count)

      | timechart span=1d avg(value) as v by database

      | apply seasonal_hybrid_esd(v, period=7)  # S-H-ESD, catch spikes and dips

      | where anomaly=1 AND direction="dip"

      | alert'
- question: Does an LSTM next-event model over CloudTrail RDS administrative sequences flag an impact-oriented
    chain such as AssumeRole -> Describe -> ModifyDBInstance(retention=0) -> DeleteDBSnapshot -> DeleteDBInstance,
    or anomalous parameters such as SkipFinalSnapshot=true?
  context: 'In the Impact tactic, the destructive workflow has a recognizable order that sequence models
    can learn. Train a DeepLog-style LSTM next-event detector on normal CloudTrail RDS admin sequences
    and flag low-probability continuations matching the recon-then-weaken-then-destroy chain, surfacing
    the deviating step. Run an unsupervised Extended Isolation Forest in parallel over per-session features
    (Delete*/min, distinct resources, deletion-protection-off flag, retention delta, off-hours, AccessDenied
    rate). Never let the model replace the deterministic rule floor; use it to enrich. Alerts must list
    the top-3 contributing features via SHAP. A positive result is a model-flagged destructive chain;
    a negative result is a normal admin sequence. References: [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    [Extended Isolation Forest](https://arxiv.org/abs/1811.02141); [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (session-windowed sequences; train on 30-90 days)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=deeplog_rds_lstm

      | input sequence per session: ordered eventName stream (rds.amazonaws.com)

      | predict next_event; flag if observed NOT in top-k probable

      | features per session: deletes_per_min, distinct_resources, deletion_protection_off, retention_delta,
      off_hours, access_denied_rate

      | score with extended_isolation_forest

      | if lstm_anomaly OR eif_score>threshold: alert with top3 SHAP features  # ML augments, never replaces
      rules'
- question: Does a graph/UEBA model show a principal deleting or modifying RDS resources outside its normal
    role or community, for example databases it has never previously touched, from unusual source geo/IP?
  context: 'Under the Impact tactic, an out-of-role destructive action is a strong compromise/insider
    signal. Build a graph or UEBA model over IAM and control-plane logs to flag principals acting outside
    their normal role community, using temporal GNN embeddings or attention-weighted heterogeneous graphs
    that yield per-edge explanations. Complement with unsupervised rare-function/population CloudTrail
    jobs scoring rarely-used destructive APIs and unusual source geo/IP. A positive result indicates a
    principal destroying resources it has no normal relationship with; a negative result means the action
    fits the identity''s usual access pattern. Always keep deterministic detections as the floor. References:
    [CS-GAD](https://arxiv.org/html/2409.12726v1); [GNN for Cloud IAM](https://arxiv.org/abs/2512.10280);
    [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)'
  answer_sources:
  - CloudTrail management events
  - AWS Config
  - RDS event subscriptions
  - CloudWatch Logs
  - 'NAI: Production RDS instances and clusters, backup inventories for critical databases, CloudTrail
    trails for database-administration activity, and configuration timelines for deletion-protection changes'
  range: Last 90 days (graph baseline over 30-90 days of IAM/control-plane history)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=temporal_gnn_ueba over (IAM edges + rds control-plane)

      | node=principal, edge=action_on_resource

      | score edge novelty: principal modifying/deleting RDS resource outside its role community

      | enrich rare_function_score(eventName), unusual source geo/IP

      | if community_outlier OR rare_geo: alert with per-edge explanation  # deterministic rules remain
      the floor'
- question: Did recent RDS deletions (rds:DeleteDBInstance / DeleteDBCluster / DeleteDBSnapshot) coincide
    with spikes in database connection failures, failover errors, CloudWatch alarms, or unsuccessful restore
    attempts in the same account or service boundary?
  context: 'In the Impact tactic, the destructive call is the upstream cause of observable service degradation.
    Correlate recent RDS Delete* events with downstream symptoms (connection failures, failover errors,
    CloudWatch alarms, failed restores) within the same account/service boundary, and raise severity when
    the deleted resource supports customer-facing or mission-critical workloads. A positive result confirms
    the deletion produced real availability/recovery impact, elevating it from a config change to a confirmed
    destructive event; a negative result may mean the resource was idle or the deletion was approved decommissioning.
    References: [AWS Threat Technique Catalog T1485.A001](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.A001.html)'
  answer_sources:
  - CloudTrail management events
  - RDS event subscriptions
  - CloudWatch metrics
  - AWS Config
  - 'NAI: Business-critical applications dependent on RDS, database monitoring and event streams, and
    recovery workflows that validate whether recent backups remain restorable'
  range: Last 90 days (correlate symptoms within hours after each delete)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=cloudtrail eventName in ("DeleteDBInstance","DeleteDBCluster","DeleteDBSnapshot") as
      deletes

      | join account,region [ search index=cloudwatch (alarm_state="ALARM" OR metric="DatabaseConnections"
      failures>0 OR restore_status="failed") earliest=delete_time latest=delete_time+2h ]

      | eval sev=if(match(resourceTags,"(?i)prod|customer|critical"),"high","medium")

      | alert severity=sev'
- question: Did a restore, DR-validation, or auto-remediation workflow fail because the referenced DB
    instance, cluster snapshot, or automated backup no longer exists, and was that recovery point removed
    by a preceding BackupRetentionPeriod=0 or Delete* action?
  context: 'Under the Impact tactic, the clearest proof of recovery destruction is a restore that fails
    because the recovery point is gone. Alert when restore, DR-validation, or auto-remediation workflows
    fail due to a missing DB instance, cluster snapshot, or automated backup, and include the preceding
    BackupRetentionPeriod=0 or Delete* action that removed it. A positive result demonstrates that recovery
    capability was actually destroyed (not merely degraded); a negative result means recovery points remain
    intact. This ties the operational failure back to the responsible API call for attribution. References:
    [Working With Backups](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html)'
  answer_sources:
  - CloudTrail management events
  - RDS event subscriptions
  - CloudWatch metrics
  - AWS Config
  - 'NAI: Business-critical applications dependent on RDS, database monitoring and event streams, and
    recovery workflows that validate whether recent backups remain restorable'
  range: Last 90 days (link failed restores to prior delete/retention changes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=ops_workflows (workflow in ("restore","dr_validation","auto_remediation") status="failed"
      reason~"not found|does not exist|missing snapshot")

      | join referenced_resource [ search source=cloudtrail (eventName in ("DeleteDBInstance","DeleteDBClusterSnapshot","DeleteDBSnapshot")
      OR (eventName="ModifyDBInstance" AND requestParameters.backupRetentionPeriod=0)) ]

      | alert severity=high'
- question: Did the expected count of snapshots, automated backups, or restorable recovery points for
    a critical database drop abruptly, beyond routine-maintenance noise?
  context: 'In the Impact tactic, loss of backup inventory is a direct measure of destroyed recoverability.
    Track expected counts of snapshots, automated backups, and restorable recovery points per critical
    database as a time series and flag abrupt drops, retention shrinkage, or loss of multi-AZ/restore-ready
    coverage with Seasonal Hybrid ESD against trailing baselines, then apply a MAD modified Z-score on
    the daily delta to suppress routine-maintenance noise. A positive result indicates an unexpected collapse
    in recovery coverage; a negative result is stable inventory. This catches gradual or stealthy erosion
    that single-event rules miss. References: [S-H-ESD, Hochenbaum et al.](https://arxiv.org/pdf/1704.07706);
    [DEW 145](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)'
  answer_sources:
  - CloudTrail management events
  - RDS event subscriptions
  - CloudWatch metrics
  - AWS Config
  - 'NAI: Business-critical applications dependent on RDS, database monitoring and event streams, and
    recovery workflows that validate whether recent backups remain restorable'
  range: Last 90 days (daily time series with seasonal baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=rds_inventory metric in (snapshot_count, automated_backups, restorable_points) by database

      | timechart span=1d sum(value) as cnt by database

      | apply seasonal_hybrid_esd(cnt, period=7)

      | eval daily_delta=cnt-prev_cnt | eventstats median(daily_delta) as med mad(daily_delta) as mad
      by database

      | eval mzs=0.6745*(daily_delta-med)/mad

      | where anomaly=1 AND mzs<-3.5 | alert  # abrupt inventory drop'
- question: After an RDS deletion, how many downstream services, alarms, and dependent applications degraded
    (and how many connection/restore failures occurred) compared with the service's normal incident profile?
  context: 'Under the Impact tactic, measuring blast radius distinguishes a contained change from a damaging
    destructive event. Measure the volume/state of downstream impact (degraded services, alarms, dependent
    applications, failed-connection/restore counts) after a deletion versus the service''s normal incident
    profile, using CloudWatch metric filters with band-based Anomaly Detection and Contributor Insights
    to attribute the blast radius. Escalate when blast radius exceeds the baseline for routine database
    maintenance. A positive result shows wide operational impact attributable to the deletion; a negative
    result indicates limited or expected effect. References: [AWS CloudWatch ML](https://aws.amazon.com/blogs/mt/simplify-analysis-of-aws-cloudtrail-data-leveraging-amazon-cloudwatch-machine-learning-and-advanced-capabilities/)'
  answer_sources:
  - CloudTrail management events
  - RDS event subscriptions
  - CloudWatch metrics
  - AWS Config
  - 'NAI: Business-critical applications dependent on RDS, database monitoring and event streams, and
    recovery workflows that validate whether recent backups remain restorable'
  range: Last 90 days (compare post-delete window to normal incident profile)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=cloudwatch earliest=delete_time latest=delete_time+2h

      | stats dc(service) as services_degraded dc(alarm) as alarms sum(connection_failures) as conn_fail
      sum(restore_failures) as restore_fail

      | apply cloudwatch_anomaly_detection band

      | contributor_insights top by service,resource

      | where blast_radius > baseline_routine_maintenance | escalate'
- question: Does a multi-source sequence/graph model correlate a single principal's kill chain (credential
    use -> enumeration -> protection-weakening -> Delete* -> service degradation) across CloudTrail, RDS
    events, and operational metrics?
  context: 'In the Impact tactic, the strongest confirmation links the actor''s full chain to its operational
    consequences. Use multi-source sequence/graph anomaly detection across CloudTrail, RDS events, and
    operational metrics to identify destructive database actions that cause downstream disruption, correlating
    the kill chain by one principal. Rank higher when the model sees concurrent loss of backups, connectivity
    degradation, and unusual actor behavior, and surface the top-3 contributing features via SHAP. A positive
    result is a model-correlated end-to-end destructive impact event; a negative result lacks the joint
    signal. Keep deterministic detections as the floor. References: [CS-GAD](https://arxiv.org/html/2409.12726v1);
    [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
  - CloudTrail management events
  - RDS event subscriptions
  - CloudWatch metrics
  - AWS Config
  - 'NAI: Business-critical applications dependent on RDS, database monitoring and event streams, and
    recovery workflows that validate whether recent backups remain restorable'
  range: Last 90 days (correlate across sources per principal/session)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=multisource_seq_graph (CloudTrail + RDS_events + ops_metrics)

      | build per-principal kill chain: credential_use -> enumeration -> protection_weakening -> Delete*
      -> service_degradation

      | score correlation; rank higher when concurrent: backup_loss AND connectivity_degradation AND unusual_actor

      | alert with top3 SHAP features  # keep deterministic detections as floor'
