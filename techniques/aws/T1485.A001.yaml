name: 'T1485.A001: RDS Instances and Backups'
id: b1a2808f-b42d-4fd2-ab43-038860ff758b
description: Investigate whether an adversary has caused impact in AWS by deleting Amazon RDS database
  instances, clusters, automated backups, or snapshots in a way that destroys data and disrupts database
  availability or recovery. This playbook helps an analyst determine if a principal deleted or scheduled
  deletion of production RDS resources outside approved maintenance or decommission workflows, and whether
  recovery-removing controls were weakened first (deletion protection disabled, BackupRetentionPeriod
  set to 0, snapshots enumerated) before the destructive call. It correlates CloudTrail management events
  (rds:DeleteDBInstance, rds:DeleteDBCluster, rds:DeleteDBSnapshot, rds:DeleteDBClusterSnapshot, rds:ModifyDBInstance/Cluster),
  AWS Config timelines, RDS event subscriptions, and CloudWatch metrics to reconstruct the impact workflow
  (AssumeRole -> Describe -> protection weakening -> Delete*), to identify high-impact variants such as
  SkipFinalSnapshot=true and --delete-automated-backups, and to confirm downstream consequences such as
  database connectivity loss, failover errors, vanished backup inventory, and failed restore or DR-validation
  attempts. Detection methods span symbolic-logic correlations, statistical baselining (modified Z-score,
  Seasonal Hybrid ESD, first-seen profiling), and machine-learning sequence and graph models to give the
  SOC granular, defensible coverage of RDS data destruction.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
