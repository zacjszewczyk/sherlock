    query: 'mfa_cred = filter eventName in (DeactivateMFADevice,DeleteVirtualMFADevice,DeleteLoginProfile)

      delete_id = filter eventName in (DeleteUser,DeleteRole)

      correlate mfa_cred with delete_id on same identity within +/-1h

      enrich with preceding AccessDenied burst count for same principal'
- question: Is the density and diversity of IAM cleanup actions in rolling windows abnormal versus the
