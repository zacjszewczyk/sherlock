name: 'T1070.A001: Delete IAM Entities'
id: 9981972a-32b9-40f3-a361-fdd670b83196
description: Investigate whether an adversary deleted AWS IAM users or roles to remove indicators and
  thwart forensic reconstruction following an intrusion. This playbook helps an analyst determine if identities
  were deleted shortly after being used for suspicious authentication, privilege changes, reconnaissance,
  secret access, or data-access activity, and whether those deletions are part of a broader cleanup workflow
  that also removes access keys, attached policies, policy versions, instance profiles, trust relationships,
  MFA devices, and login profiles. It guides correlation of the create-use-delete lifecycle from CloudTrail,
  detection of AccessDenied failure bursts and CloudTrail integrity gaps preceding deletions, statistical
  baselining of identity lifespan and cleanup-burst density, and machine-learning scoring of per-deletion
  feature vectors and event-name sequences to distinguish routine offboarding from adversary-driven forensic
  artifact removal.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Defense Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Was an IAM user or role (or its login profile or access keys) deleted shortly after that same
    identity performed anomalous sign-in, role assumption, privilege modification, reconnaissance, secret
    access, or data-access activity?
  context: 'This is the core Defense Evasion signal for this technique: adversaries delete the very identity
    they used so responders cannot inspect its permissions, sessions, or activity trail. Look for DeleteUser,
    DeleteRole, DeleteLoginProfile, or DeleteAccessKey calls on iam.amazonaws.com that follow recent anomalous
    behavior by the same principal, mirroring Elastic''s IAM-deletion CloudTrail logic. A positive result
    is a deletion that closely follows suspicious use, especially when the deleted identity was newly
    created, recently modified, or linked to GuardDuty findings, denied actions, or an active investigation.
    A negative result is a deletion with no preceding anomalous activity, consistent with routine cleanup.
    Source action: Symbolic Logic: Detect `DeleteUser` or `DeleteRole` (and `DeleteLoginProfile`, `DeleteAccessKey`)
    on `iam.amazonaws.com` after the same identity recently performed anomalous sign-in, role assumption,
    privilege modification, reconnaissance, secret access, or data-access actions, mirroring Elastic''s
    IAM-deletion CloudTrail logic ([AWS IAM Group Deletion, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/impact_iam_group_deletion.toml)).
    Escalate if the deleted identity was newly created, recently modified, or linked to GuardDuty findings,
    denied actions, or an active investigation.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS IAM credential report
  - 'NAI: IAM identities with recent control-plane activity, incident-scoped principals used for suspicious
    sessions, and accounts where deletion of identities could erase evidence of temporary or attacker-created
    access'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'iam_delete = filter eventSource=iam.amazonaws.com AND eventName in (DeleteUser,DeleteRole,DeleteLoginProfile,DeleteAccessKey)

      prior_susp = filter same principalId within -24h of iam_delete where action in (anomalous ConsoleLogin,AssumeRole,Put*Policy,recon
      List*/Get*,secret GetSecretValue,s3 GetObject bulk)

      join iam_delete with prior_susp on userIdentity.arn

      escalate if deleted_identity.created within 30d OR deleted_identity in guardduty_findings OR preceding
      AccessDenied present'
- question: Does the deleted IAM identity show a create-use-delete lifecycle, where the same actor or
    session previously created the user/role, attached policies, created access keys or login profiles,
    or edited trust policies before deleting it?
  context: 'Reconstructing the create-use-delete timeline exposes a cleanup workflow intended to erase
    attacker-established access. Correlate the deletion with preceding CreateUser, CreateRole, CreateAccessKey,
    AttachUserPolicy, AttachRolePolicy, trust-policy edits, or login-profile creation by the same actor
    or session, running portable Sigma over CloudTrail in S3/Athena. A positive result is a short-lived
    identity created and then deleted by the same principal within an intrusion window, indicating disposable
    attacker infrastructure rather than legitimate provisioning that persists and serves real workloads.
    Source action: Symbolic Logic: Correlate identity deletion with preceding `CreateUser`, `CreateRole`,
    `CreateAccessKey`, `AttachUserPolicy`, `AttachRolePolicy`, trust-policy edits, or login-profile creation
    by the same actor or session, reconstructing the create-use-delete cleanup timeline from first-party
    CloudTrail (run portable Sigma over S3/Athena per [Invictus IR](https://www.invictus-ir.com/news/automated-first-response-in-aws-using-sigma-and-athena);
    [Recorded Future](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security)).
    Treat the create-use-delete chain as a cleanup workflow intended to remove evidence of attacker-established
    access.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS IAM credential report
  - 'NAI: IAM identities with recent control-plane activity, incident-scoped principals used for suspicious
    sessions, and accounts where deletion of identities could erase evidence of temporary or attacker-created
    access'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'create_events = filter eventSource=iam.amazonaws.com AND eventName in (CreateUser,CreateRole,CreateAccessKey,AttachUserPolicy,AttachRolePolicy,UpdateAssumeRolePolicy,CreateLoginProfile)

      delete_events = filter eventName in (DeleteUser,DeleteRole)

      join create_events->delete_events on target_identity within -7d by same actor/session

      flag lifecycle where (delete_time - create_time) short AND identity used in between'
- question: Was the IAM deletion preceded by a burst of AccessDenied or UnauthorizedOperation errors by
    the same principal/session, or accompanied by CloudTrail integrity gaps such as missing records, failed
    digest validation, or a silenced log source?
  context: 'Failure state is a distinct evasion signal: attackers probing permissions generate denied
    actions before they succeed and clean up. Count errorCode=AccessDenied and UnauthorizedOperation events
    per principal/session in the window preceding a deletion (as in Panther''s IAM recon-denied rule)
    and alert when a deletion follows a denied burst. Separately, treat CloudTrail integrity gaps as alerts
    in their own right: missing expected records, failed log-file digest validation, or a source that
    goes silent around the delete window may indicate tampering with the evidence itself. A positive result
    is a deletion bracketed by recon-denied failures or a coincident logging gap. Source action: Symbolic
    Logic: Profile error/failure state as a distinct signal: count `errorCode=AccessDenied` (and `UnauthorizedOperation`)
    events per principal/session in the window preceding a deletion, as in [Panther''s IAM recon-denied
    rule](https://github.com/panther-labs/panther-analysis), and alert when a deletion follows a denied-action
    burst. Additionally treat CloudTrail integrity gaps as alerts in their own right — missing expected
    records, failed log-file digest validation, or a silenced source around the delete window ([Schneier
    and Kelsey](https://www.schneier.com/wp-content/uploads/2016/02/paper-secure-logs.pdf)).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS IAM credential report
  - 'NAI: IAM identities with recent control-plane activity, incident-scoped principals used for suspicious
    sessions, and accounts where deletion of identities could erase evidence of temporary or attacker-created
    access'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'denied = filter errorCode in (AccessDenied,UnauthorizedOperation) | stats count by userIdentity.principalId,
      session, bin(window=1h)

      delete_events = filter eventName in (DeleteUser,DeleteRole)

      alert if delete_events preceded by denied.count > baseline_burst_threshold for same principal

      integrity_check: alert if cloudtrail digest validation fails OR expected_record_count gap OR source
      silent near delete window'
- question: Is the IAM deletion a statistical outlier in terms of identity lifespan, deletion frequency,
    or time from last use to deletion compared to the account baseline, or a first-seen deletion action
    for that principal?
  context: 'Baselining IAM identity lifespan, deletion frequency, and time-from-last-use-to-deletion by
    identity type and account lets you separate suspicious removals from routine offboarding. Use a robust
    modified Z-score (MAD, |z|>3.5) so batch offboarding does not distort the baseline, and flag first-seen
    deletion actions for a principal via per-principal lookback baselining (Netflix CloudTrail Anomaly
    Detector). A positive result is a user or role deleted unusually quickly after creation, or shortly
    after rare high-risk activity, or deleted by a principal that has never issued deletions before. Source
    action: Statistical Method: Baseline IAM identity lifespan, deletion frequency, and time from last
    use to deletion by identity type and account, flagging deletions with a robust modified Z-score (MAD,
    |z|>3.5) to resist batch-offboarding distortion ([modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Also flag first-seen deletion actions for a principal that has never issued them via per-principal
    lookback baselining ([Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)).
    Escalate users or roles deleted unusually quickly after creation or shortly after rare high-risk activity.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS IAM credential report
  - 'NAI: IAM identities with recent control-plane activity, incident-scoped principals used for suspicious
    sessions, and accounts where deletion of identities could erase evidence of temporary or attacker-created
    access'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = stats median(lifespan), mad(lifespan), median(time_last_use_to_delete) by identity_type,
      account over 90d

      for each delete: mz = 0.6745*(value - median)/mad

      flag if abs(mz) > 3.5 on lifespan OR time_last_use_to_delete

      flag if eventName=DeleteUser/DeleteRole first-seen for principalId in lookback window'
- question: Do related IAM cleanup actions (access-key deletion, policy detachment, instance-profile removal,
    trust-policy reversion) cluster into an abnormally dense burst around the deletion, exceeding the
    forecast per-principal control-plane rate?
  context: 'Measure the volume and frequency of related IAM cleanup actions in rolling windows around
    each delete and compare to the account baseline. Change-point methods (CUSUM/PELT/Bayesian online
    CPD) detect the abrupt onset of a cleanup spree, while per-principal rate forecasting flags exceedances
    of the predicted confidence interval. A positive result is a deletion that occurs inside an unusually
    dense cleanup burst, indicating coordinated evidence removal rather than the slow trickle of normal
    deprovisioning. Source action: Statistical Method: Measure the Volume and Frequency of related IAM
    cleanup actions (access-key deletion, policy detachment, instance-profile removal, trust-policy reversion)
    in rolling windows around each delete and compare to the account baseline; detect abrupt onset with
    change-point methods (CUSUM/PELT/Bayesian online CPD) ([Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/))
    and forecast expected per-principal control-plane rates, alerting on exceedances of the predicted
    confidence interval ([time-series forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x)).
    Escalate deletes occurring inside an unusually dense cleanup burst.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS IAM credential report
  - 'NAI: IAM identities with recent control-plane activity, incident-scoped principals used for suspicious
    sessions, and accounts where deletion of identities could erase evidence of temporary or attacker-created
    access'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = count IAM cleanup actions (DeleteAccessKey,Detach*Policy,RemoveRoleFromInstanceProfile,UpdateAssumeRolePolicy)
      per rolling 1h window

      cpd = change_point_detect(series)  # CUSUM/PELT/BOCPD

      forecast = predict per-principal control-plane rate with CI

      escalate delete where window_density > forecast_upper_CI OR delete inside detected change-point
      burst'
- question: Does an unsupervised anomaly model score a given IAM deletion as a likely adversary-driven
    forensic artifact removal based on its feature vector, and what are the top contributing features?
  context: 'Score per-deletion feature vectors with an unsupervised detector such as Isolation Forest
    or Elastic''s rare-function/population CloudTrail jobs. Features include identity age at deletion,
    preceding-API-sequence rarity, privilege level, actor novelty, concurrent cleanup count, AccessDenied
    rate, and source geography. Crucially, surface the top-3 contributing features (influencers) in the
    alert text rather than a bare score so the analyst can triage. A positive result is a high anomaly
    score driven by interpretable factors such as a brand-new identity, rare API sequence, and high concurrent
    cleanup count. Source action: Machine Learning: Score per-deletion feature vectors with an unsupervised
    detector such as [Isolation Forest](https://doi.org/10.1145/2133360.2133363) or Elastic''s rare-function/population
    CloudTrail jobs ([Detecting Threats in AWS CloudTrail, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)).
    Features: identity age at deletion, preceding-API-sequence rarity, privilege level, actor novelty,
    concurrent cleanup count, AccessDenied rate, and source geography. Surface the top-3 contributing
    features (influencers) in the alert text, not just a score, to prioritize likely adversary-driven
    removals.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS IAM credential report
  - 'NAI: IAM identities with recent control-plane activity, incident-scoped principals used for suspicious
    sessions, and accounts where deletion of identities could erase evidence of temporary or attacker-created
    access'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [identity_age_at_delete, preceding_api_seq_rarity, privilege_level, actor_novelty,
      concurrent_cleanup_count, accessdenied_rate, source_geo]

      model = IsolationForest(features) over CloudTrail deletions

      alert if anomaly_score > threshold

      output top-3 influencer features with each alert'
- question: Does the per-principal CloudTrail event-name sequence around the deletion fall outside the
    top-k predictions of a learned next-event model, indicating an improbable create-use-delete or out-of-order
    cleanup chain?
  context: 'Model per-principal CloudTrail event-name sequences with an LSTM next-event predictor (DeepLog)
    so that create-use-delete chains and out-of-order or missing events fall outside the top-k predicted
    next keys. Present the predicted-versus-observed keys as explainable evidence. A positive result is
    a deletion that the model did not expect given the principal''s normal API rhythm, supporting the
    hypothesis that the sequence reflects deliberate cleanup rather than habitual administration. Source
    action: Machine Learning: Model per-principal CloudTrail event-name sequences with an LSTM next-event
    predictor ([DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)) so that create-use-delete
    chains and out-of-order/missing events fall outside the top-k predicted next keys; present the predicted-vs-observed
    keys as explainable evidence.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - AWS IAM credential report
  - 'NAI: IAM identities with recent control-plane activity, incident-scoped principals used for suspicious
    sessions, and accounts where deletion of identities could erase evidence of temporary or attacker-created
    access'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = order CloudTrail eventNames per principalId/session

      model = LSTM next-event predictor (DeepLog) trained on normal sequences

      for each event: if observed_key not in top_k(predicted): flag anomaly

      report predicted_keys vs observed_key for the delete event'
- question: Is the DeleteUser/DeleteRole correlated with surrounding policy detachment, policy-version
    deletion, instance-profile removal, access-key deletion, session revocation, or trust-policy changes
    by the same actor or session?
  context: 'Deletion of an IAM entity is rarely isolated in an attacker cleanup; it is part of a broader
    workflow that removes access keys, policies, trust relationships, and role attachments tied to the
    intrusion, making it harder to determine how access was gained and used. Correlate DeleteUser and
    DeleteRole with surrounding DetachUserPolicy/DetachRolePolicy, DeletePolicyVersion, RemoveRoleFromInstanceProfile,
    DeleteAccessKey, session revocation, or trust-policy changes by the same actor/session using Elastic-style
    matching and portable Sigma over S3/Athena. Raise severity when the cleanup follows suspicious access
    or occurs during an active investigation. Source action: Symbolic Logic: Correlate `DeleteUser` and
    `DeleteRole` with surrounding policy detachment, policy-version deletion, instance-profile removal,
    access-key deletion, session revocation, or trust-policy changes executed by the same actor or session,
    applying Elastic-style IAM CloudTrail matching ([AWS IAM Group Deletion, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/impact_iam_group_deletion.toml))
    and portable Sigma over S3/Athena ([Invictus IR](https://www.invictus-ir.com/news/automated-first-response-in-aws-using-sigma-and-athena)).
    Raise severity when the cleanup follows suspicious access or occurs during an active investigation.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - GuardDuty findings
  - 'NAI: Identity stores, role-trust relationships, policy attachments, and compromised accounts where
    adversaries may attempt to erase temporary footholds or delegated access chains'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'delete_id = filter eventName in (DeleteUser,DeleteRole)

      cleanup = filter eventName in (DetachUserPolicy,DetachRolePolicy,DeletePolicyVersion,RemoveRoleFromInstanceProfile,DeleteAccessKey,UpdateAssumeRolePolicy)
      within +/-1h

      correlate by same actor/session on related identity

      raise severity if preceded by suspicious access OR during active investigation'
- question: Did a role deletion or UpdateAssumeRolePolicy rollback follow recent cross-account role assumption,
    federation changes, or external-principal use, suggesting the trust path was erased after use?
  context: 'Adversaries who abuse cross-account trust or federation will roll back or delete the trust
    relationship to hide the delegated access chain. Alert when role deletion or an UpdateAssumeRolePolicy
    rollback follows recent cross-account role assumption, federation changes, or external-principal use,
    using vendor-neutral cloud Sigma logic. Present the trust path, the suspicious use, and the cleanup
    actions together so the erased attack chain is preserved for the investigator. A positive result is
    a trust-policy reversion or role deletion that directly follows external/cross-account use of that
    role. Source action: Symbolic Logic: Alert when role deletion or `UpdateAssumeRolePolicy` rollback
    follows recent cross-account role assumption, federation changes, or external-principal use, using
    vendor-neutral cloud Sigma logic ([Recorded Future](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security)).
    Present the trust path, the suspicious use, and the cleanup actions together to preserve the erased
    attack chain.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - GuardDuty findings
  - 'NAI: Identity stores, role-trust relationships, policy attachments, and compromised accounts where
    adversaries may attempt to erase temporary footholds or delegated access chains'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'cross_use = filter eventName=AssumeRole where recipientAccountId != resourceAccount OR external/federated
      principal

      trust_erase = filter eventName in (DeleteRole,UpdateAssumeRolePolicy) on same role within -24h after
      cross_use

      join cross_use -> trust_erase on roleArn

      emit trust_path + suspicious_use + cleanup_actions together'
- question: Did MFA-device deactivation/deletion or login-profile deletion co-occur with the IAM identity
    deletion, and was it preceded by an AccessDenied burst?
  context: 'Weakening or removing credentials and MFA can be both an access-enabling step and a cleanup
    precursor. Treat DeactivateMFADevice/DeleteVirtualMFADevice and DeleteLoginProfile co-occurring with
    identity deletion as correlated cleanup, and incorporate preceding AccessDenied bursts as a distinct
    failure-state signal. A positive result is an identity whose MFA and login profile are stripped just
    before or as it is deleted, especially after recon-denied failures, indicating the actor is dismantling
    the credential trail. Source action: Symbolic Logic: Treat `DeactivateMFADevice`/`DeleteVirtualMFADevice`
    and `DeleteLoginProfile` co-occurring with identity deletion as correlated cleanup ([AWS IAM Deactivate
    MFA Device, Elastic](https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/impact_iam_deactivate_mfa_device.toml)),
    and incorporate preceding `AccessDenied` bursts as a distinct failure-state signal ([Panther IAM recon-denied](https://github.com/panther-labs/panther-analysis)).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - GuardDuty findings
