- question: How quickly do an identity's supporting artifacts (keys, policies, trust relationships, group
    membership) disappear after its last suspicious action, and does that collapse register as an abrupt
    change point?
  context: 'Score how quickly an identity''s supporting artifacts vanish after its last suspicious action
    and detect the abrupt collapse as a change point. Legitimate offboarding tends to be gradual and scheduled;
    attacker cleanup compresses the removal of keys, policies, trust relationships, and group membership
    into a tight window. A positive result is an attack path that collapses much faster than normal employee
    or service-account offboarding, indicating deliberate evidence destruction following malicious use.
    Source action: Statistical Method: Score how quickly an identity''s supporting artifacts (keys, policies,
    trust relationships, group membership) disappear after its last suspicious action, detecting the abrupt
    collapse as a change point ([Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).
    Escalate when the path collapses much faster than normal employee or service-account offboarding.'
  answer_sources:
  - CloudTrail management events
  - CloudTrail Lake
  - AWS Config
  - GuardDuty findings
  - 'NAI: Identity stores, role-trust relationships, policy attachments, and compromised accounts where
    adversaries may attempt to erase temporary footholds or delegated access chains'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each identity: t0 = last_suspicious_action_time

      compression = time to remove (keys, policies, trust, group_membership) after t0

      cpd = change_point_detect(artifact_count_over_time)

      escalate if compression << baseline_offboarding_duration AND abrupt change point present'
- question: Do sequence and graph models distinguish this IAM cleanup from routine offboarding, flagging
    improbable chained deletions, self-deleting principals, or cross-service cleanup?
  context: 'Apply sequence and graph analysis to separate routine offboarding from attacker cleanup. An
    LSTM next-event model over CloudTrail keys (DeepLog) flags improbable chained deletions, while dynamic
    IAM/user-service graph models (GNN over IAM logs, CS-GAD) capture self-deleting principals and cross-service
    cleanup. Emphasize features such as preceding suspicious API activity, rapid chained deletions, privileged-actor
    novelty, and overlap with threat-detection findings, and surface the top-3 contributing features in
    the alert. A positive result is a cleanup chain the models rate as improbable, especially a principal
    that deletes itself. Source action: Machine Learning: Apply sequence and graph analysis to distinguish
    routine offboarding from attacker cleanup: an LSTM next-event model over CloudTrail keys ([DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf))
    flags improbable chained deletions, while dynamic IAM/user-service graph models ([GNN over IAM logs](https://arxiv.org/abs/2512.10280);
    [CS-GAD](https://arxiv.org/html/2409.12726v1)) capture self-deleting principals and cross-service
    cleanup. Emphasize features such as preceding suspicious API activity, rapid chained deletions, privileged-actor
    novelty, and overlap with threat-detection findings, and surface the top-3 contributing features in
    the alert.'
  answer_sources:
