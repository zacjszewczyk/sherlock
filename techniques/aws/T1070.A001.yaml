    using robust modified Z-score thresholds (MAD, |z|>3.5) ([modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly));
    flag first-seen comprehensive deletion sequences for a principal via per-principal lookback baselining
    ([Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)).
    Flag bursts removing multiple related artifacts faster or more comprehensively than normal deprovisioning.'
  answer_sources:
