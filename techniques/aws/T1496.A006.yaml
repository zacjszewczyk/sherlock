questions:
- question: Are there CloudTrail ECS control-plane calls (ecs:RegisterTaskDefinition, ecs:CreateService,
    ecs:UpdateService, ecs:StartTask, ecs:RunTask) that introduce container images outside approved ECR
    repositories, unexpected entry points/commands, privileged or host-namespace settings, public IP assignment,
    disabled awslogs, or abnormal environment variables, and do they correlate within ~15 minutes with
    abusive egress to mining-pool ports or low-reputation destinations?
  context: 'This Impact-tactic check targets the core compute-hijacking-via-ECS chain: an adversary who
    has obtained credentials registers or launches a task that pulls an unauthorized image and immediately
    begins resource abuse. The analyst looks for task definitions or service/task launches that deviate
    from approved workloads -- images from outside the approved ECR registry path, unexpected commands,
    privileged=true, host network/PID namespaces, assignPublicIp=ENABLED, disabled awslogs (to blind logging),
    or odd environment variables -- then pivots to VPC Flow Logs to confirm the new task''s ENI rapidly
    opens sustained outbound connections to Stratum mining ports (3333, 4444, 5555) or low-reputation
    IPs. A positive result (suspicious launch plus abusive egress within minutes) is high-confidence cryptojacking;
    a negative egress correlation may still warrant review of the out-of-policy launch itself. Abused
    ECS API set per [Compute Hijacking - ECS, Threat Technique Catalog for AWS](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A006.html);
    credential-theft-to-launch chain per [Compromised Cloud Compute Credentials, Unit 42](https://unit42.paloaltonetworks.com/compromised-cloud-compute-credentials/).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS task state change logs
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch Container Insights
  - 'NAI: ECS clusters with internet egress, accounts using Fargate or EC2-backed containers, CI/CD paths
    capable of registering task definitions, and services permitted to pull external images'
  range: Last 90 days; correlate launch events with egress in a 15-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=cloudtrail eventSource=ecs.amazonaws.com\n  eventName IN (RegisterTaskDefinition, CreateService,\
      \ UpdateService, StartTask, RunTask)\n| WHERE image NOT_IN approved_ecr_repos\n     OR privileged=true\
      \ OR networkMode=host OR pidMode=host\n     OR assignPublicIp=ENABLED OR awslogs_disabled=true\n\
      \     OR entrypoint/command NOT_MATCH approved_baseline\n     OR env_vars MATCH suspicious_pattern\n\
      | JOIN taskEni WITH vpcflow WITHIN 15m\n| WHERE flow.dstport IN (3333,4444,5555) OR flow.dstip IN\
      \ low_reputation_list\n| EMIT alert(principal, cluster, service, image, dst, dstport)"
- question: Do Amazon GuardDuty cryptocurrency/behavior findings (CryptoCurrency:EC2/BitcoinTool.B, BitcoinTool.B!DNS,
    Behavior:EC2/TrafficVolumeUnusual, Behavior:EC2/NetworkPortUnusual) fire on instances hosting ECS
    clusters, and on EC2-backed clusters do Falco runtime rules flag Stratum traffic, unexpected container
    shells, or known miner process names (xmrig, minerd)?
  context: Managed-service and host-runtime signals provide independent corroboration of compute hijacking
    for the Impact tactic. GuardDuty's EC2 finding types detect Bitcoin/mining tool communication and
    unusual traffic-volume/port behavior at the network layer; treat these as high-severity confirmation
    when they land on instances that back ECS clusters. On EC2-backed (non-Fargate) clusters, host runtime
    telemetry via Falco can catch the actual miner process executing inside the container, interactive
    shells spawned in containers, and Stratum protocol traffic -- evidence that survives even if control-plane
    logging was disabled. Concurrence of GuardDuty plus Falco signals on the same host strongly indicates
    active cryptojacking. See [Amazon GuardDuty EC2 Finding Types](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-ec2.html);
    [Falco Default Rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml); [Detecting
    cryptojacking with Falco, Sysdig](https://sysdig.com/blog/detecting-cryptojacking-with-falco/).
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS task state change logs
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch Container Insights
  - 'NAI: ECS clusters with internet egress, accounts using Fargate or EC2-backed containers, CI/CD paths
    capable of registering task definitions, and services permitted to pull external images'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=guardduty type IN (\n    \"CryptoCurrency:EC2/BitcoinTool.B\",\n    \"CryptoCurrency:EC2/BitcoinTool.B!DNS\"\
      ,\n    \"Behavior:EC2/TrafficVolumeUnusual\",\n    \"Behavior:EC2/NetworkPortUnusual\")\n| WHERE\
      \ resource.instanceId IN ecs_cluster_instances\n| APPEND (index=falco rule IN (\"Outbound Stratum/mining\
      \ traffic\",\n    \"Terminal shell in container\") OR proc.name IN (xmrig, minerd, cpuminer))\n\
      | EMIT high_severity_alert(instanceId, finding_or_rule, cluster)"
- question: Are new ECS tasks or services launching with IAM task roles outside the approved per-service
    allowlist, with public IP assignment, or with image sources outside the approved registry path, immediately
    before sustained compute consumption and outbound egress begin?
  context: This focuses on task-role escalation as a precursor to compute abuse under the Impact tactic.
    Adversaries frequently attach a more permissive task role (or any unexpected role) to a hijacked task
    to broaden access or to allow the miner to reach external infrastructure, and they enable a public
    IP so the container can talk directly to mining pools. The analyst compares each launched task/service's
    task role, network configuration, and image source against the approved per-service allowlist and
    registry path; a launch that violates the allowlist and is followed by sustained CPU and egress is
    a strong indicator. Thresholds and the allowlist should be validated and tuned against labeled detonations
    (e.g., Stratus Red Team) to limit false positives from legitimate new deployments. Validate and tune
    thresholds against labeled detonations from [Stratus Red Team](https://github.com/DataDog/stratus-red-team).
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS task state change logs
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch Container Insights
  - 'NAI: ECS clusters with internet egress, accounts using Fargate or EC2-backed containers, CI/CD paths
    capable of registering task definitions, and services permitted to pull external images'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=cloudtrail eventSource=ecs.amazonaws.com\n  eventName IN (CreateService, UpdateService,\
      \ RunTask, StartTask)\n| LOOKUP approved_service_role_allowlist BY service\n| WHERE taskRoleArn\
      \ NOT_IN allowlist[service]\n     OR assignPublicIp=ENABLED\n     OR image NOT_STARTSWITH approved_registry_path\n\
      | JOIN taskEni WITH vpcflow WITHIN 30m\n| WHERE sustained_cpu=true OR sum(flow.bytes_out) > egress_threshold\n\
      | EMIT alert(principal, service, taskRoleArn, image)"
- question: For each principal/AssumedRole, are there first-seen ECS control-plane calls (RegisterTaskDefinition,
    CreateService, RunTask) relative to that identity's historical baseline, and are there bursts of AccessDenied/Client.UnauthorizedOperation
    errors (e.g., >5 in 10 minutes) that precede a successful task/service launch?
  context: This statistical check models normal behavior per identity to catch the moment a compromised
    or misused principal first reaches into ECS. Baselining the set of CloudTrail actions historically
    performed by each principal/role and alerting on first-seen ECS control-plane calls surfaces credential
    theft or privilege misuse that deterministic rules might miss. As a distinct failure-mode signal,
    counting AccessDenied / UnauthorizedOperation errors per principal in short windows reveals permission-probing/discovery
    that often immediately precedes a successful launch -- the classic fumble-then-succeed pattern. Either
    signal alone is suspicious; together they strongly suggest an adversary experimenting toward compute
    hijacking under the Impact tactic. See [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly);
    [Cloud API Calls From Previously Unseen User Roles, Splunk](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/);
    [AWS IAM AccessDenied Discovery Events, Splunk](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/).
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS task state change logs
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch Container Insights
  - 'NAI: ECS clusters with internet egress, accounts using Fargate or EC2-backed containers, CI/CD paths
    capable of registering task definitions, and services permitted to pull external images'
  range: Last 90 days for baseline; 10-minute windows for AccessDenied burst counting
  queries:
  - technology: SIEM/Stats pseudocode
    query: "/* first-seen ECS action per identity */\nindex=cloudtrail eventSource=ecs.amazonaws.com\n\
      \  eventName IN (RegisterTaskDefinition, CreateService, RunTask)\n| STATS earliest(_time) AS first_seen\
      \ BY userIdentity.arn, eventName\n| WHERE first_seen > now()-1d AND NOT_IN historical_baseline(arn,\
      \ eventName)\n| EMIT alert(\"first-seen ECS control-plane\", arn, eventName)\n;\n/* AccessDenied\
      \ burst preceding success */\nindex=cloudtrail (errorCode=AccessDenied OR errorCode=\"Client.UnauthorizedOperation\"\
      )\n| BIN _time span=10m\n| STATS count AS denied BY userIdentity.arn, _time\n| WHERE denied > 5\n\
      | JOIN arn WITH successful_ecs_launch WITHIN next 10m\n| EMIT alert(\"denied-burst before launch\"\
      , arn, denied)"
- question: Per cluster/service, do deployment cadence (task-definition churn/day, task starts/min), runtime
    density (CPU/memory reservation), or egress volume (outbound bytes/hour) exceed historical norms or
    the 95th percentile for similar workloads, and on EC2 hosts do syscall-frequency or command/image
    frequency profiles deviate from baseline?
  context: This statistical baselining models the Volume, Frequency, and State dimensions of normal ECS
    behavior to detect abusive workloads under the Impact tactic. Compute hijacking typically manifests
    as sustained high CPU/memory reservation, unusual task-definition churn or rapid task starts, and
    elevated outbound byte volume to a small set of destinations. Deriving per-environment thresholds
    from ~30 days of CloudWatch Container Insights lets the analyst flag services whose cadence, runtime
    density, or egress exceeds the norm or 95th percentile of peers. On EC2-backed hosts, profiling syscall-frequency
    vectors (bag-of-system-calls) and per-service command/image frequency adds a host-level masquerade
    signal. Exceedance without a matching legitimate workload change indicates likely hijacking. Methods
    per [Bag of System Calls](https://arxiv.org/abs/1611.03053) and [Masquerade Detection Using Truncated
    Command Lines, Maxion and Townsend](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS task state change logs
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch Container Insights
  - 'NAI: ECS clusters with internet egress, accounts using Fargate or EC2-backed containers, CI/CD paths
    capable of registering task definitions, and services permitted to pull external images'
  range: Last 90 days; baseline derived from 30 days of CloudWatch Container Insights
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=container_insights OR vpcflow\n| STATS avg(cpu_reservation) AS cpu, avg(mem_reservation)\
      \ AS mem,\n        sum(bytes_out)/dur_hours AS egress_per_hr,\n        count(task_starts)/dur_min\
      \ AS starts_per_min,\n        dc(task_definition_revision) AS td_churn\n  BY cluster, service\n\
      | LOOKUP baseline_30d_p95 BY cluster, service\n| WHERE cpu > p95.cpu OR egress_per_hr > p95.egress\n\
      \     OR starts_per_min > p95.starts OR td_churn > p95.churn\n| EMIT anomaly(cluster, service, exceeded_metrics)\n\
      /* EC2 hosts: bag-of-syscalls + command/image freq vs baseline */"
- question: When task-definition metadata, runtime telemetry, and flow features are scored with unsupervised
    models -- rare-function/population analysis over CloudTrail (rare API/actor/ASN combinations) and
    Isolation Forest over egress flow features (bytes, ports, destination diversity, ratios) -- which
    ECS tasks or control-plane events are flagged as anomalous, and what are their top-3 contributing
    features?
  context: Machine-learning scoring generalizes beyond signatures to catch novel compute-hijacking under
    the Impact tactic. A rare-function/population model over CloudTrail surfaces principals invoking rare
    ECS API/actor/ASN combinations, while an Isolation Forest over egress flow features isolates task
    traffic with anomalous byte volumes, destination ports, destination diversity, or in/out ratios characteristic
    of mining. The analyst should treat the deterministic symbolic-logic rules as the detection floor
    and use ML to add coverage, reviewing the top-3 contributing features (e.g., image rarity, destination
    reputation, sustained CPU) emitted in each alert to rapidly judge whether a flagged task is benign
    novelty or genuine abuse. Methods per [Detecting Threats in AWS CloudTrail Logs Using ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)
    and [Isolation Forest vs. Autoencoders for Zero-Day Network Attack Detection](https://ieeexplore.ieee.org/document/10143005/).
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS task state change logs
  - VPC Flow Logs
  - Amazon GuardDuty findings
  - Amazon CloudWatch Container Insights
  - 'NAI: ECS clusters with internet egress, accounts using Fargate or EC2-backed containers, CI/CD paths
    capable of registering task definitions, and services permitted to pull external images'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "/* unsupervised scoring */\nmodel_A = RareFunction(cloudtrail, features=[apiName, actor, sourceASN])\n\
      model_B = IsolationForest(vpcflow, features=[bytes_out, dstport,\n            dc(dstip), in_out_ratio,\
      \ conn_duration])\nscore_ct  = model_A.score(event)\nscore_net = model_B.score(task_flow)\n| WHERE\
      \ score_ct > thr_ct OR score_net > thr_net\n| ENRICH top3_features = explain(model)   /* image_rarity,\
      \ dst_reputation, sustained_cpu */\n| EMIT ml_alert(task, score_ct, score_net, top3_features)\n\
      /* deterministic rules remain the detection floor */"
- question: Has a previously stable ECS service suddenly scaled out, swapped to a non-approved image via
    ecs:UpdateService, changed task roles, or launched one-off tasks outside the deployment pipeline --
    especially when followed by persistent CPU pressure, increased failed health checks, or anomalous
    internet egress?
  context: 'This targets repurposing of existing production services for adversary compute under the Impact
    tactic -- a stealthier path than standing up new infrastructure because it hides inside trusted workloads.
    The analyst looks for abrupt change in an otherwise stable service: a scale-out, an image swap to
    something outside the approved registry, a task-role change, or one-off RunTask invocations that bypass
    the normal CI/CD deployment pipeline. Correlating these control-plane changes with subsequent persistent
    CPU pressure, rising failed health checks, or anomalous egress (and GuardDuty mining/volume findings)
    distinguishes malicious repurposing from legitimate operational change. Abused API set per [Compute
    Hijacking - ECS, Threat Technique Catalog for AWS](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A006.html);
    corroborate with GuardDuty mining/volume findings ([Amazon GuardDuty EC2 Finding Types](https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-ec2.html)).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS service events
  - VPC Flow Logs
  - Amazon CloudWatch metrics
  - Amazon CloudWatch Container Insights
  - 'NAI: Production ECS services, autoscaling policies that can magnify malicious tasks, and cluster
    telemetry that reflects abrupt shifts in service behavior or resource pressure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=cloudtrail eventSource=ecs.amazonaws.com\n  eventName IN (UpdateService, RunTask, StartTask)\n\
      | LOOKUP stable_service_baseline BY service\n| WHERE desiredCount_delta > scaleout_threshold\n \
      \    OR image NOT_IN approved_images[service]\n     OR taskRoleArn CHANGED\n     OR (eventName=RunTask\
      \ AND NOT_FROM deployment_pipeline)\n| JOIN service WITH container_insights WITHIN 60m\n| WHERE\
      \ cpu_pressure=sustained OR failed_health_checks RISING\n     OR anomalous_egress=true\n| APPEND\
      \ guardduty_mining_or_volume_findings\n| EMIT alert(principal, service, change_type)"
- question: Are malicious service changes followed by autoscaling-policy activity, unusual desired-count
    increases, or repeated task restarts that expand resource consumption without a matching increase
    in legitimate application demand (request rate, queue depth), and do EC2-backed tasks show host runtime
    miner/Stratum signals?
  context: 'Adversaries can abuse autoscaling to multiply hijacked compute under the Impact tactic: by
    inflating desired count or triggering scale-out policies, a single malicious task definition becomes
    many miners. The key discriminator is demand mismatch -- legitimate scaling tracks request rate or
    queue depth, whereas malicious scaling expands resource consumption without any corresponding rise
    in real application demand. The analyst raises a high-severity alert when service changes are followed
    by anomalous desired-count increases or restart loops absent demand, and cross-checks EC2-backed tasks
    for Falco-detected miner processes or Stratum traffic to confirm the expanded capacity is doing illicit
    work. Cross-check with host runtime miner/Stratum signals on EC2-backed tasks ([Falco Default Rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml);
    [Detecting cryptojacking with Falco, Sysdig](https://sysdig.com/blog/detecting-cryptojacking-with-falco/)).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS service events
  - VPC Flow Logs
  - Amazon CloudWatch metrics
  - Amazon CloudWatch Container Insights
  - 'NAI: Production ECS services, autoscaling policies that can magnify malicious tasks, and cluster
    telemetry that reflects abrupt shifts in service behavior or resource pressure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=cloudtrail (eventSource=application-autoscaling.amazonaws.com\n   OR eventName=UpdateService)\n\
      | WHERE preceded_by malicious_service_change(service) WITHIN 1h\n| EVAL demand = lookup(request_rate,\
      \ queue_depth, service)\n| WHERE (desiredCount_increase=true OR restart_count > restart_threshold)\n\
      \     AND demand NOT_INCREASED\n| APPEND (index=falco proc.name IN (xmrig,minerd) OR rule=\"Stratum\
      \ traffic\"\n          WHERE host IN ecs_cluster_instances[service])\n| EMIT high_severity_alert(service,\
      \ scaling_action, demand_mismatch=true)"
- question: Per service, when desired-count changes, task restarts, CPU/memory usage, request rates, and
    outbound destination diversity are baselined and the Volume/Frequency series are forecast with confidence
    bands, does post-change behavior exceed the predicted band without a matching demand increase, and
    are there State anomalies (rising failed health checks, restart loops)?
  context: Time-series forecasting catches gradual or disguised repurposing under the Impact tactic that
    single-event rules miss. By forecasting each service's CPUUtilization, outbound bytes, and task starts/min
    with confidence bands derived from ~30 days of CloudWatch metrics, the analyst can flag when actual
    behavior breaches the predicted band -- but only treats it as suspicious when there is no matching
    increase in legitimate demand (request rate/queue depth). State anomalies such as a climbing failed-health-check
    rate or task restart loops are surfaced as distinct signals, since hijacked or unstable miner tasks
    often crash and restart. A sustained forecast breach without demand justification is strong evidence
    of abusive compute. Method per [Intrusion detection in cloud computing based on time series anomalies](https://link.springer.com/article/10.1186/s13677-023-00491-x).
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS service events
  - VPC Flow Logs
  - Amazon CloudWatch metrics
  - Amazon CloudWatch Container Insights
  - 'NAI: Production ECS services, autoscaling policies that can magnify malicious tasks, and cluster
    telemetry that reflects abrupt shifts in service behavior or resource pressure'
  range: Last 90 days; confidence bands derived from 30 days of CloudWatch metrics
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=cloudwatch OR container_insights\n| STATS series(CPUUtilization), series(bytes_out),\
      \ series(task_starts_per_min),\n        series(desiredCount_changes), series(restarts) BY service\n\
      | FORECAST each_series MODEL=timeseries TRAIN=30d -> band(lower, upper)\n| WHERE actual > band.upper\
      \ AND demand(request_rate, queue_depth) NOT_INCREASED\n| EMIT forecast_breach(service, metric, actual,\
      \ band.upper)\n| WHERE failed_health_checks RISING OR restart_loop=true\n| EMIT state_anomaly(service)"
- question: Per principal/role, are there first-seen ecs:UpdateService or ecs:RunTask actions against
    a previously untouched production service, and are there AccessDenied bursts preceding them?
  context: This identity-centric statistical check detects the takeover of an existing production service
    under the Impact tactic. Baselining which services each principal/role has historically modified lets
    the analyst alert when an identity touches a production service it has never modified before via UpdateService
    or RunTask -- a hallmark of credential compromise or lateral privilege misuse. Pairing this with AccessDenied
    bursts immediately preceding the successful action reveals the permission-probing that often comes
    first. A first-seen high-impact change to a sensitive production service, especially after denied-call
    bursts, warrants immediate investigation. See [Cloud API Calls From Previously Unseen User Roles,
    Splunk](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/); [AWS IAM AccessDenied
    Discovery Events, Splunk](https://research.splunk.com/cloud/3e1f1568-9633-11eb-a69c-acde48001122/);
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS service events
  - VPC Flow Logs
  - Amazon CloudWatch metrics
  - Amazon CloudWatch Container Insights
  - 'NAI: Production ECS services, autoscaling policies that can magnify malicious tasks, and cluster
    telemetry that reflects abrupt shifts in service behavior or resource pressure'
  range: Last 90 days for baseline; short windows for AccessDenied burst detection
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=cloudtrail eventSource=ecs.amazonaws.com\n  eventName IN (UpdateService, RunTask)\n\
      | STATS earliest(_time) AS first BY userIdentity.arn, requestParameters.service\n| WHERE service\
      \ IN production_services\n     AND NOT_IN historical_modified_services(arn)\n     AND first > now()-1d\n\
      | JOIN arn WITH (index=cloudtrail errorCode=AccessDenied\n        | BIN _time span=10m | stats count\
      \ AS denied BY arn)\n| WHERE denied > 5 BEFORE first\n| EMIT alert(\"first-seen prod repurpose\"\
      , arn, service, denied)"
- question: For services running multiple identical task replicas, do live kernel-event/CPU/network distributions
    diverge across replicas (training-less replica comparison), and do Isolation Forest over service egress
    flow features and CloudTrail rare-function ML over control-plane sequences flag anomalies -- with
    the top-3 contributing features (replica divergence magnitude, destination novelty, sustained CPU)
    surfaced?
  context: 'When a service runs many identical replicas, a hijacked task betrays itself by diverging from
    its siblings -- a training-less anomaly approach (ReplicaWatcher) compares kernel-event, CPU, and
    network distributions across replicas and flags the outlier without any per-service model training,
    which is ideal for ephemeral container workloads. In parallel, an Isolation Forest over service egress
    flow features scores anomalous destinations/volume, and CloudTrail rare-function ML scores anomalous
    control-plane sequences that preceded the change. For the Impact tactic, this triangulates host behavior,
    network behavior, and control-plane intent; reviewing the emitted top-3 contributing features (replica
    divergence magnitude, destination novelty, sustained CPU) lets the analyst quickly confirm whether
    one replica has been repurposed for abusive compute. Methods per [ReplicaWatcher: Training-less Anomaly
    Detection in Containerized Microservices](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf);
    [Isolation Forest vs. Autoencoders for Zero-Day Network Attack Detection](https://ieeexplore.ieee.org/document/10143005/);
    [Detecting Threats in AWS CloudTrail Logs Using ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - AWS CloudTrail management events
  - Amazon ECS service events
  - VPC Flow Logs
  - Amazon CloudWatch metrics
  - Amazon CloudWatch Container Insights
  - 'NAI: Production ECS services, autoscaling policies that can magnify malicious tasks, and cluster
    telemetry that reflects abrupt shifts in service behavior or resource pressure'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "/* training-less replica divergence (ReplicaWatcher) */\nFOR service WITH replicas >= 2:\n\
      \  dist[r] = distribution(kernel_events, cpu, net) PER replica r\n  divergence[r] = jsd(dist[r],\
      \ median(dist[all]))\n  | WHERE divergence[r] > thr -> flag replica r\n/* parallel models */\n|\
      \ APPEND IsolationForest(service_egress_flow).score > thr_net\n| APPEND CloudTrailRareFunction(control_plane_seq).score\
      \ > thr_seq\n| ENRICH top3 = [replica_divergence_magnitude, destination_novelty, sustained_cpu]\n\
      | EMIT ml_alert(service, replica, top3)"
