name: 'T1496.A006: Compute Hijacking - ECS'
id: 7d0ca604-b1bd-4cea-85b9-d92bc1630bf3
description: Investigate whether an adversary has hijacked Amazon Elastic Container Service (ECS) tasks
  or services to run unauthorized containers for compute-intensive or abusive operations such as cryptomining.
  This playbook helps an analyst determine (1) whether new or modified ECS task definitions, services,
  or one-off tasks have introduced container images, commands, IAM task roles, or runtime settings inconsistent
  with approved workloads that then quickly begin sustained outbound communications or resource consumption,
  and (2) whether existing ECS services have been repurposed or scaled to create business impact through
  unexpected compute consumption, degraded performance, or execution of adversary-controlled tasks unrelated
  to the intended application or deployment pipeline. It correlates AWS CloudTrail control-plane activity,
  ECS task/service state changes, VPC Flow Logs egress, GuardDuty findings, and CloudWatch/Container Insights
  telemetry (plus host-runtime signals on EC2-backed clusters) using symbolic-logic detections, statistical
  baselining/forecasting, and machine-learning anomaly scoring to surface and triage compute-hijacking
  abuse.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
