name: 'T1190.A016: EC2 Hosted Application Compromise'
id: 8dcb90cf-9117-4ce0-b772-43e1d757d945
description: Investigate whether an adversary gained initial access in AWS by compromising a public-facing
  application hosted on an Amazon EC2 instance. This playbook helps an analyst determine if exploit-oriented
  requests against an internet-facing application (delivered through WAF, application load balancer, or
  container/cloud ingress) were followed by host or cloud behavior inconsistent with normal application
  processing - such as instance metadata (IMDS) access, secrets or parameter retrieval, KMS Decrypt, unexpected
  web/interpreter process execution, web-shell writes under document roots, or new outbound command-and-control
  sessions. It correlates suspicious inbound web activity with post-exploit pivots on the same EC2 workload,
  and with control-plane/data-plane API use attributable to the instance profile that the application
  does not normally perform. Methods span deterministic symbolic-logic correlation (WAF/CRS signatures,
  web-process-to-shell lineage, web-shell artifacts), statistical baselining of request, error, and role-usage
  distributions, and machine-learning request clustering, sequence modeling, and provenance graph scoring
  - giving the SOC granular, defensible coverage of EC2-hosted application compromise.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
