  queries:
  - technology: SIEM/ML pseudocode
    query: "input: inbound_requests[uri_pattern, waf_label, status, bytes, client_reputation]\nfeatures\
      \ = vectorize(uri_pattern, waf_label, status, bytes, client_reputation)\nclusters = cluster(features)\
      \                       # HDBSCAN / DBSCAN\nfor each request: sqli_score = sqli_classifier(payload);\
      \ cmdi_score = cmdi_classifier(payload)\nexploit_clusters = clusters where mean(sqli_score|cmdi_score)\
      \ high OR malicious waf_label density high\nfor c in exploit_clusters:\n    if any member.src_instance\
      \ has followon_host_or_cloud_anomaly within window: priority = HIGH\n    alert(top3_features = shap(c),\
      \ members=c.members)"
- question: When suspicious-request features, application-log anomalies, host-telemetry/syscall keywords,
    and egress novelty are fused with a Bayesian/sequence model (plus an unsupervised online autoencoder
    on egress), does the combined score indicate a likely web compromise - especially where exploit requests
    immediately precede credential, secret, or control-plane access from the targeted EC2 instance?
  context: 'No single weak detector is reliable on its own; fusing them raises confidence while preserving
    sensitivity. Combine suspicious-request features, application-log anomalies, host/syscall keywords,
    and egress novelty using Bayesian event classification or sequence fusion to lower false positives,
    and detect post-exploit egress with an unsupervised online autoencoder (e.g., Kitsune) that reports
    per-feature reconstruction error with each alert. Raise the highest-confidence alerts when exploit
    requests immediately precede credential, secret, or control-plane access from the targeted instance
    - the defining sequence of EC2-hosted application compromise leading to Initial Access. A positive
    result is a fused high-confidence compromise indication with explainable contributing features; a
    negative result reflects independent weak signals that do not cohere into an attack chain. References:
    [Bayesian Event Classification for Intrusion Detection](https://ieeexplore.ieee.org/document/1254306/),
    [Kitsune: An Ensemble of Autoencoders for Online Network Intrusion Detection](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - AWS WAF logs
  - Application load balancer access logs
  - CloudWatch application logs
  - CloudWatch Logs for EC2 host telemetry
  - VPC Flow Logs
  - CloudTrail management events
  - Amazon GuardDuty findings
  - EC2 serial console logs
  - 'NAI: Internet-facing load balancers, EC2 instances hosting public applications, instance-associated
    VPC subnets, and log groups containing web-server, runtime, and host telemetry'
  range: 'Last 90 days (event-centered: align request, host, and egress timelines)'
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = concat(request_features, app_log_anomaly, host_syscall_keywords, egress_novelty)\n\
      fused_p = bayesian_fusion(weak_detectors=[waf, app_anom, host_anom, egress_anom])   # sequence-aware\n\
      ae = online_autoencoder(egress_features)            # Kitsune-style\nrecon_err = ae.reconstruction_error_per_feature(egress_features)\n\
      score = combine(fused_p, recon_err)\nif exploit_request immediately_precedes (credential|secret|controlplane_access\
      \ from same_instance):\n    score = boost(score)\nif score > threshold: alert(per_feature_recon_err=recon_err,\
      \ contributing=top_features)"
- question: After suspicious inbound web activity against a public EC2 application (a high-severity WAF/CRS
    match), did CloudTrail show activity attributable to that instance profile that the application does
    not normally perform - first-time API families, cross-account access attempts, Secrets Manager reads,
    Parameter Store reads, KMS Decrypt, or IMDS role-credential retrieval from an unexpected caller process
    or a first-time IMDS path - and did GuardDuty report instance credential exfiltration, suspicious
    DNS, or anomalous role use on the same host?
  context: 'This is the pivot from a compromised application to the AWS control plane - the moment Initial
    Access becomes a cloud foothold. Alert when a high-severity inbound exploit signal is followed by
    CloudTrail activity under the instance profile that is abnormal for the application: first-time API
    families, cross-account access attempts, Secrets Manager or Parameter Store reads, or KMS Decrypt.
    Treat IMDS role-credential retrieval from an unexpected caller process or a first-time IMDS path as
    a high-signal SSRF-to-credential-theft indicator. Increase severity when GuardDuty reports UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration,
    suspicious DNS, or anomalous role usage tied to the same host. A positive result indicates credential
    theft and control-plane abuse stemming from the exploited workload; a negative result suggests the
    application''s API behavior remained within its norm. References: [OWASP ModSecurity Core Rule Set](https://github.com/coreruleset/coreruleset),
    [IMDS Anomaly Hunting: Finding Zero-Day SSRF](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day),
    [Falco Default Detection Rules](https://falco.org/docs/reference/rules/default-rules/).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail data events
  - VPC Flow Logs
  - CloudWatch application logs
  - CloudWatch Logs for EC2 host telemetry
  - Amazon GuardDuty findings
  - EC2 serial console logs
  - AWS Systems Manager session logs
  - 'NAI: Instance profiles attached to public EC2 workloads, metadata-access paths, VPC egress points,
    and AWS service APIs normally unused by the application'
  range: Last 90 days (correlate exploit signal to CloudTrail pivot within a short window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=waf | where crs_severity==\"high\"\n| eval instance_profile = lookup_profile(target_instance)\n\
      | join instance_profile [ search source=(cloudtrail OR cloudtrail_data) earliest=waf_time latest=waf_time+1h\n\
      \    | where eventName IN (\"GetSecretValue\",\"GetParameter*\",\"Decrypt\") OR first_time_api_family\
      \ OR cross_account_access\n       OR (imds_role_cred_retrieval AND (caller_proc NOT IN expected\
      \ OR imds_path first_seen)) ]\n| eval gd = guardduty_findings(instance) CONTAINS (\"InstanceCredentialExfiltration\"\
      ,\"suspicious_dns\",\"anomalous_role_use\")\n| eval severity = if(gd,\"critical\",\"high\")\n| alert"
- question: Does an instance role's post-request behavior materially exceed its trailing 30-day baseline
    - in service diversity, privilege-sensitive API families, secrets-access volume, API call volume,
    destination countries, or external egress ports/bytes - and are there spikes in CloudTrail AccessDenied/UnauthorizedOperation,
    throttling, or blocked egress that signal credential probing?
  context: 'A compromised instance role typically begins exercising services and APIs it has never used.
    Baseline each instance role''s service usage, API call Volume, destination countries, and egress ports/bytes,
    then flag post-request sessions where service diversity, privilege-sensitive API families, secrets-access
    volume, or external egress novelty materially exceed the role''s trailing 30-day distribution. Profile
    failure-State explicitly: bursts of CloudTrail AccessDenied/UnauthorizedOperation, throttling, and
    blocked egress connections are distinct early signals of credential probing as an adversary tests
    the stolen role''s reach. Derive thresholds from local per-role history. A positive result shows the
    role behaving unlike itself after suspicious inbound activity; a negative result indicates usage consistent
    with deployment, health-check, and autoscaling norms. References: [Anomaly Detection of Web-based
    Attacks](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf), [Intrusion Detection
    for Web Services Based on Time Series](https://ieeexplore.ieee.org/document/7129383/).'
  answer_sources:
