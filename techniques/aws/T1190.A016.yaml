  range: Last 90 days (baseline trailing 30 days; evaluate as time series)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=(waf OR alb_access OR cloudwatch_app) earliest=-30d\n| stats avg(uri_len) p95(uri_len)\
      \ avg(param_entropy) values(token_set) as baseline by app\n| eval req_anom = char_dist_distance(request,\
      \ baseline) OR byte_freq_distance(payload, app_port_model)\n| timechart span=5m count as reqs sum(req_bytes)\
      \ as req_bytes sum(egress_bytes) as egress_bytes\n    count(eval(status>=400 AND status<500)) as\
      \ e4xx count(eval(status>=500)) as e5xx count(eval(waf_block)) as waf_blocks by app\n| eval err_rate=(e4xx+e5xx)/reqs\n\
      | where req_anom OR err_rate > max(app_30d_baseline_p95, peer_tier_p95) OR waf_blocks > app_30d_baseline_p95\n\
      | alert"
- question: When inbound requests to a public EC2 application are clustered by URI pattern, WAF labels,
    response codes, byte counts, and client reputation, do any clusters isolate an exploit campaign (for
    example SQL-injection or command-injection payload classes) - and are members of those clusters followed
    by host or cloud anomalies from the same EC2 instance?
  context: 'Machine-learning clustering separates exploit campaigns from the noise of normal traffic and
    benign scanners. Cluster inbound requests on URI patterns, WAF labels, response codes, byte counts,
    and client reputation, applying payload-class classifiers for SQLi and command injection. Prioritize
    clusters whose members are followed by host or cloud anomalies (IMDS access, process spawn, egress
    novelty) from the same EC2 instance - this links the campaign to a real foothold. For analyst trust
    and triage, alert text must list the top-3 contributing request features (e.g., parameter, payload
    token, response code). A positive result surfaces a coordinated exploit campaign worth deep investigation;
    a negative result suggests diffuse or benign traffic. References: [Cascaded Lightweight and Transformer
    NLP for SQL Injection Detection](https://arxiv.org/abs/2312.13041), [Detecting Command Injection Attacks
    via Deep Learning](https://www.nature.com/articles/s41598-024-74350-3), [An Explainable Machine Learning-based
    Web Attack Detection System](https://www.tandfonline.com/doi/full/10.1080/19393555.2024.2362813),
    [xNIDS: Explaining Deep Learning-based Network Intrusion Detection Systems](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources:
