questions:
- question: Did exploit-like inbound requests carrying deterministic WAF/OWASP CRS signatures - directory
    traversal strings, insecure-deserialization probes, template-injection markers, SSRF attempts targeting
    169.254.169.254, or repeated high-severity matches at or above a tuned inbound anomaly score (start
    at PL1 score >=5, escalate to PL2) - against a public EC2 application get followed within 30 minutes
    by activity from the same EC2 workload such as IMDS access, secrets retrieval, a web/interpreter process
    spawning /bin/sh, curl, wget, or socat, a webshell write under the web root, or outbound sessions
    to rare internet destinations?
  context: 'For Initial Access via EC2-hosted application compromise, the highest-confidence signal is
    an exploit request immediately followed by host or cloud behavior that normal application processing
    never exhibits. Use deterministic WAF signatures and OWASP ModSecurity Core Rule Set anomaly scoring
    to flag the inbound exploit attempt, then pivot to the same application host or target-group member
    for follow-on activity within a tight 30-minute window: IMDS calls, Secrets Manager/Parameter Store
    reads, a web process (www-data, apache, nginx) spawning a shell or download tooling, a script/executable
    written under the document root, or an outbound session to a rare destination. Escalate only when
    the request target and the post-request activity resolve to the same workload. A positive result indicates
    successful exploitation and foothold establishment, not mere scanning; a negative result suggests
    blocked or unsuccessful probing. Never delete these deterministic rules - tune thresholds rather than
    remove them. References: [OWASP ModSecurity Core Rule Set](https://github.com/coreruleset/coreruleset),
    [An Empirical Study on OWASP CRS Enhancement](https://www.sciencedirect.com/science/article/pii/S0167404825004031),
    [Falco Default Detection Rules](https://falco.org/docs/reference/rules/default-rules/).'
  answer_sources:
  - AWS WAF logs
  - Application load balancer access logs
  - CloudWatch application logs
  - CloudWatch Logs for EC2 host telemetry
  - VPC Flow Logs
  - CloudTrail management events
  - Amazon GuardDuty findings
  - EC2 serial console logs
  - 'NAI: Internet-facing load balancers, EC2 instances hosting public applications, instance-associated
    VPC subnets, and log groups containing web-server, runtime, and host telemetry'
  range: Last 90 days (correlate inbound request to host/cloud pivot within a 30-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=waf OR source=alb_access\n| where crs_anomaly_score >= 5 OR waf_label IN (\"traversal\"\
      ,\"deserialization\",\"template_injection\",\"ssrf\") OR uri CONTAINS \"169.254.169.254\"\n| eval\
      \ target_host = backend_instance_or_target_group_member\n| join target_host [ search source=(cloudtrail\
      \ OR ec2_host_telemetry OR vpcflow) earliest=request_time latest=request_time+30m\n    | where imds_access\
      \ OR secrets_read OR proc IN (\"/bin/sh\",\"curl\",\"wget\",\"socat\") OR webshell_write OR egress_to_rare_dest\
      \ ]\n| where request.target_host == followon.target_host\n| alert severity=high"
- question: On the EC2 instance backing a public application, did a web-server user (www-data, apache,
    nginx) write an executable or script file under a document root, did a known-good file baseline change,
    or did a server process emit system-call sequences outside its learned profile - and did any server
    process spawn a child shell (web-process -> shell lineage)?
  context: 'Web-shell deployment and post-exploit artifacts are durable evidence that Initial Access succeeded
    and the adversary intends continued access. Alert when web-server service accounts write executable
    or script files (.php, .jsp, .aspx, .sh) under document roots, when file-integrity baselines change
    unexpectedly, or when server processes deviate from their learned system-call profile (a Sense-of-Self
    style anomaly). Crucially, treat a web/interpreter process spawning a shell as State=success exploitation
    rather than reconnaissance - this lineage rarely occurs in healthy applications. A positive result
    is strong proof of code execution on the host; investigate the writing process, the request that preceded
    it, and any subsequent IMDS/credential access. A negative result lowers but does not eliminate suspicion
    if exploit traffic was seen. References: [Mitigating Web Shells](https://github.com/nsacyber/Mitigating-Web-Shells),
    [A Sense of Self for Unix Processes](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes).'
  answer_sources:
  - AWS WAF logs
  - Application load balancer access logs
  - CloudWatch application logs
  - CloudWatch Logs for EC2 host telemetry
  - VPC Flow Logs
  - CloudTrail management events
  - Amazon GuardDuty findings
  - EC2 serial console logs
  - 'NAI: Internet-facing load balancers, EC2 instances hosting public applications, instance-associated
    VPC subnets, and log groups containing web-server, runtime, and host telemetry'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=ec2_host_telemetry (auditd execve OR file_integrity OR sysmon)

      | where user IN ("www-data","apache","nginx")

      | eval webroot_write = (action=="write" AND path MATCHES "(/var/www|/usr/share/nginx|htdocs).*\.(php|jsp|aspx|sh|pl|py)$"
      AND executable=true)

      | eval baseline_change = (fim_status=="changed" AND path UNDER document_root)

      | eval syscall_anomaly = (syscall_seq NOT IN learned_profile[process])

      | eval webproc_shell = (parent IN ("apache2","nginx","php-fpm","node","python","w3wp.exe") AND child
      IN ("/bin/sh","/bin/bash","cmd.exe","powershell.exe"))

      | where webroot_write OR baseline_change OR syscall_anomaly OR webproc_shell

      | eval state = if(webproc_shell,"success_exploitation","suspect")

      | alert'
- question: Do current inbound requests, error rates, and WAF-block rates for a public EC2 application
    deviate from that application's own trailing 30-day baseline and from peer applications in the same
    tier - across request path/parameter structure (length, character distribution, token set), payload
    byte-frequency distance, request/egress volume, request and WAF-match frequency, and 4xx/5xx error-state
    bursts?
  context: 'Exploitation pressure against a public application often shows up statistically before any
    single deterministic rule fires. Baseline each application''s request-path and parameter distribution
    and score deviating requests, and model payloads with per-port/length byte-frequency distance. Track
    Volume (request bytes, egress bytes) and Frequency (requests/min, WAF matches/min), and treat failure-State
    as a distinct signal: profile 4xx/5xx error-rate bursts and WAF-block rates as a time series and alert
    when they exceed the app''s trailing 30-day baseline or the 95th percentile of peer apps in the same
    tier. Derive thresholds from local history. A positive result flags abnormal exploit-like pressure
    or a failure-state surge indicative of fuzzing/exploitation; a negative result indicates traffic consistent
    with normal operation. References: [Anomaly Detection of Web-based Attacks](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf),
    [Anomalous Payload-Based Network Intrusion Detection](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11),
    [Intrusion Detection for Web Services Based on Time Series](https://ieeexplore.ieee.org/document/7129383/).'
  answer_sources:
