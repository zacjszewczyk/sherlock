  - EC2 serial console logs
  - AWS Systems Manager session logs
  - 'NAI: Instance profiles attached to public EC2 workloads, metadata-access paths, VPC egress points,
    and AWS service APIs normally unused by the application'
  range: Last 90 days (baseline trailing 30 days; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "source=cloudtrail earliest=-30d\n| stats dc(eventSource) as svc_div values(api_family) count\
      \ as api_vol dc(dst_country) as countries\n    sum(secrets_reads) as secrets_vol sum(egress_bytes)\
      \ as egress by instance_role\n| eval baseline = role_30d_distribution(instance_role)\n| where svc_div\
      \ > baseline.p95 OR new_privileged_api_family OR secrets_vol > baseline.p95 OR egress_novelty(dst,port)\
      \ high\n| append [ search source=cloudtrail | timechart span=5m count(eval(errorCode IN (\"AccessDenied\"\
      ,\"UnauthorizedOperation\"))) as denies\n    count(eval(throttled)) as throttles by instance_role\
      \ | where denies > baseline OR throttles > baseline ]\n| alert"
- question: Across WAF, application, host/syscall, and CloudTrail telemetry, does sequence modeling identify
    an exploit-traffic -> cloud-resource-access transition that differs from deployment, health-check,
    and autoscaling patterns - weighting time-to-first-API-call, API-family novelty, and destination rarity?
  context: 'The transition from inbound exploitation to cloud-resource access has a temporal signature
    that distinguishes attacks from routine automation. Use sequence modeling spanning WAF, application,
    host/syscall, and CloudTrail telemetry to identify exploit-traffic-to-cloud-access transitions that
    differ from deployment, health-check, and autoscaling patterns, weighting time-to-first-API-call,
    API-family novelty, and destination rarity, and reducing false positives through weak-detector fusion.
    Each alert must surface its top-3 contributing features so analysts can validate quickly. A positive
    result indicates a modeled attack chain from the public app into AWS resources; a negative result
    reflects benign operational sequences that match learned normal behavior. References: [Bayesian Event
    Classification for Intrusion Detection](https://ieeexplore.ieee.org/document/1254306/), [xNIDS: Explaining
    Deep Learning-based Network Intrusion Detection Systems](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail data events
  - VPC Flow Logs
  - CloudWatch application logs
  - CloudWatch Logs for EC2 host telemetry
  - Amazon GuardDuty findings
  - EC2 serial console logs
  - AWS Systems Manager session logs
  - 'NAI: Instance profiles attached to public EC2 workloads, metadata-access paths, VPC egress points,
    and AWS service APIs normally unused by the application'
  range: Last 90 days (event-centered across request, host, and API timelines)
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = order_by_time(events from [waf, cloudwatch_app, host_syscall, cloudtrail] for instance)\n\
      model = sequence_model(trained_on=normal[deploy, healthcheck, autoscale])\nscore = model.anomaly(seq,\
      \ features=[time_to_first_api_call, api_family_novelty, dst_rarity])\nscore = weak_detector_fusion(score,\
      \ [waf, app, host, ct])\nif score > threshold and pattern == \"exploit_traffic -> cloud_resource_access\"\
      :\n    alert(top3_features = explain(seq))"
- question: When a provenance/entity graph links suspicious requests, target EC2 instances, exploited
    processes, assumed roles, API calls, and external destinations, do any subgraphs indicate rapid foothold
    expansion - one compromised host touching new roles, data stores, or C2 endpoints within a single
    investigative window?
  context: 'Graph-based scoring captures the breadth of an unfolding compromise that point detections
    miss. Build a provenance/entity graph connecting suspicious requests, target EC2 instances, exploited
    processes, assumed roles, API calls, and external destinations, then score subgraphs indicating rapid
    foothold expansion using a temporal graph model (e.g., KAIROS) that also reconstructs the chain for
    triage. Surface cases where a single compromised host reaches new roles, data stores, or C2 endpoints
    within one investigative window, and report the contributing nodes and edges in the alert so analysts
    can follow the attack path. A positive result is a high-fidelity, explainable picture of foothold
    expansion from the exploited workload; a negative result indicates no anomalous cross-entity expansion
    linked to the host. References: [KAIROS: Practical Intrusion Detection and Investigation using Whole-System
    Provenance](https://arxiv.org/html/2308.05034).'
  answer_sources:
  - CloudTrail management events
  - CloudTrail data events
  - VPC Flow Logs
  - CloudWatch application logs
  - CloudWatch Logs for EC2 host telemetry
  - Amazon GuardDuty findings
  - EC2 serial console logs
  - AWS Systems Manager session logs
  - 'NAI: Instance profiles attached to public EC2 workloads, metadata-access paths, VPC egress points,
    and AWS service APIs normally unused by the application'
  range: Last 90 days (single investigative window per suspected compromise)
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_provenance_graph(nodes=[requests, ec2_instances, processes, assumed_roles, api_calls,\
      \ ext_dst],\n                          edges=[request->instance, instance->process, process->assumeRole,\
      \ role->api_call, instance->ext_dst])\nfor subgraph in temporal_subgraphs(G, window=investigation_window):\n\
      \    score = kairos_temporal_score(subgraph)\n    if subgraph.host_count==1 and (new_roles>0 or\
      \ new_datastores>0 or c2_endpoints>0):\n        alert(chain=reconstruct(subgraph), nodes=subgraph.nodes,\
      \ edges=subgraph.edges, score=score)"
