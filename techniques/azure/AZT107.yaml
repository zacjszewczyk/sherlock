    containing regulated or mission-sensitive data'
  range: Last 90 days for model training, with per-session scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [resource_sensitivity, service_progression, first_time_access, failed_read_ratio,
      followon_data_plane, rare_function];

      score = dynamic_user_service_action_GNN(features) + rare_function_score + peer_UEBA;

      explain = shap_top3(features);

      alert when score >= threshold; output principal, score, explain, target_sequence.'
