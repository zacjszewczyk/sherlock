name: 'AZT107: Gather Resource Data'
id: 66136028-eb95-4464-8cc3-015114e9c48c
description: Investigate whether an adversary is gathering Azure resource data to understand the configuration,
  sensitivity, or access paths of cloud resources in support of later execution, collection, or impact.
  This playbook helps an analyst examine broad read, list, and show operations against Azure Resource
  Manager and service-specific APIs that extract configuration and metadata from compute, networking,
  storage, identity, and platform services, and to distinguish detailed cloud reconnaissance from routine
  administration. It then follows how resource-data gathering narrows onto data-bearing or security-relevant
  services such as storage, key vaults, app configuration, automation, and compute configuration, indicating
  target prioritization for follow-on abuse or collection. Questions span deterministic symbolic-logic
  rules (cross-resource read bursts, service-detail chaining, first-seen reads, sensitive-service focus),
  statistical baselining (read-volume expansion, production/crown-jewel coverage skew, failed-read bursts),
  and machine-learning models (rare-function, UEBA, and graph-based scoring of identity-to-resource read
  behavior) so a SOC analyst can detect and triage Azure resource-data reconnaissance.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
