  range: Last 90 days, with a trailing 30-day p99 baseline on sensitive-service failures.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = KeyVaultAuditEvents or StorageBlobLogs where result in [''403'',''Forbidden'',''AuthorizationFailed''];

      win = count fails by principal; ratio = fails/successes by principal;

      alert when win > p99(trailing_30d) or ratio > p99(trailing_30d);

      output principal, failed_sensitive_reads, ratio, denied_resources.'
- question: Does a sequence or graph machine-learning model distinguish routine administration from adversary
    target selection by combining resource sensitivity, service progression, first-time access, failed-read
    ratio, and follow-on data-plane actions into one explainable risk score?
  context: 'Apply a sequence/graph model (a dynamic user-service-action GNN) that distinguishes routine
    administration from adversary target selection by combining resource sensitivity, service progression,
    first-time access, failed-read ratio, and follow-on data-plane actions into one risk score. Add rare-function
    scoring over audit logs and peer-group UEBA. In Reconnaissance this captures the full narrowing behavior,
    from broad discovery to focused selection of data- and control-bearing services. The alert MUST surface
    the top-3 contributing features (SHAP) so the analyst can validate the driver. A positive result is
    a high-scoring session whose drivers reflect sensitive-target selection rather than ordinary operations.
    Citations: [CS-GAD dynamic GNN for cloud user anomalies](https://arxiv.org/html/2409.12726v1), [GNN
    adaptive threat detection for cloud IAM logs](https://arxiv.org/abs/2512.10280), [Detecting threats
    in CloudTrail logs with ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning),
    [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics),
    [SHAP in IDS: explainable anomaly detection](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)'
  answer_sources:
