- question: How many customer-managed key vaults, applications, and subscriptions did a principal traverse
    in one session, and does that breadth exceed comparable administrators or the peer group?
  context: Score the number of customer-managed key vaults, applications, and subscriptions traversed
    per session via per-principal lookback. Prioritize sessions enumerating more cryptographic assets
    than comparable administrators or the peer group. A positive result is a session whose breadth across
    the cryptographic estate materially exceeds the actor's history and peers, consistent with broad key
    discovery; a negative result is access confined to a normal, narrow set. This breadth scoring supports
    Credential Access by surfacing wide-reaching cryptographic inventorying.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults used for customer-managed keys, HSM-backed operations, and identities with key read
    permissions'
  range: Last 90 days, with per-principal lookback.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'session = per-principal key-read window

