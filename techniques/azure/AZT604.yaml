name: 'AZT604: Azure KeyVault Dumping'
id: 5002a171-6a7a-45fb-8ffa-7424a6b96543
description: Investigate whether an adversary has accessed Azure Key Vault to enumerate or dump secrets,
  certificates, or keys in order to obtain credential material or sensitive cryptographic artifacts. This
  playbook helps an analyst hunt for bulk or repeated secret listing and retrieval consistent with credential
  harvesting, certificate enumeration and paired backing-secret reads that suggest collection of authentication/signing
  certificates for impersonation, and concentrated key or key-metadata enumeration that may indicate inventorying
  of protected workloads or preparation for follow-on abuse of key-backed services. It combines deterministic
  symbolic-logic detections (operation bursts, post-grant/post-sign-in correlation, denied-access bursts),
  statistical baselining (per-principal and per-vault volume, diversity, version depth, source-IP and
  time-of-day profiling, first-seen and breadth scoring), and machine-learning models (rare-function/population
  classifiers, multi-order Markov sequence models, and principal-service-object graph models) to separate
  routine application retrieval from manual or scripted Key Vault dumping.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a single principal or source IP perform a burst of Key Vault secret listing or secret
    retrieval operations across many distinct secrets within a short window, consistent with bulk credential
    collection rather than normal workload retrieval?
  context: An adversary who reaches a Key Vault often enumerates and pulls many plaintext secrets quickly
    to harvest credentials. Look in AzureDiagnostics for ResourceType=='VAULTS' where one identity (identity_claim_upn_s/objectId)
    or CallerIPAddress performs SecretList or SecretGet (Microsoft.KeyVault/vaults/secrets/getSecret/action)
    across many distinct secret names in a tight window. This mirrors the Sentinel Sensitive Azure Key
    Vault operations rule's EventCount/operation-set/CallerIP grouping. A positive result is a single
    actor touching >=10 distinct secrets in ~10 minutes; severity rises when clientInfo_s shows an interactive/browser
    or scripting user agent (azure-cli, python) rather than the expected workload identity, because legitimate
    apps retrieve a stable, small set of secrets on a predictable cadence. This is the core Credential
    Access signal for AZT604 secret dumping.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults storing production credentials, administrative break-glass vaults, and the identities
    granted secret read permissions'
  range: Last 90 days, with 10-minute burst correlation windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM AzureDiagnostics WHERE ResourceType==''VAULTS'' AND OperationName IN (''SecretGet'',''SecretList'')

      | BIN time INTO 10m windows GROUP BY identity_claim_upn_s, CallerIPAddress, window

      | COMPUTE distinct_secrets = dcount(secret_name), ops = count(), agent = any(clientInfo_s)

      | ALERT WHERE distinct_secrets >= 10 (tune per vault)

      | RAISE severity WHERE agent MATCHES /azure-cli|python|powershell|browser/'
- question: Did secret enumeration immediately follow a first-seen Entra sign-in, a new role assignment,
    or a Key Vault access-policy change for the same identity within roughly an hour?
  context: Adversaries that newly obtain an identity or expand its permissions frequently begin harvesting
    secrets right away. Correlate first-seen Entra sign-ins, new role assignments, or vault access-policy
    changes (AzureActivity control-plane events) with secret enumeration on the same identity_claim within
    60 minutes. A positive result ties a fresh grant or novel sign-in to immediate SecretGet/SecretList
    activity, strongly suggesting an attacker capitalizing on newly acquired access. A negative result
    (long-established identity using its normal scope) is consistent with benign automation. This directly
    supports the Credential Access objective by catching the privilege-then-collect pattern.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults storing production credentials, administrative break-glass vaults, and the identities
    granted secret read permissions'
  range: Last 90 days, correlating control-plane and sign-in events to secret access within 60 minutes.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'grants = FROM AzureActivity WHERE OperationName IN (''Microsoft.Authorization/roleAssignments/write'',''Microsoft.KeyVault/vaults/accessPolicies/write'')

      newlogin = FROM EntraSignIn WHERE first_seen(identity, device, ip)

      secrets = FROM AzureDiagnostics WHERE OperationName IN (''SecretGet'',''SecretList'')

      | JOIN secrets TO (grants UNION newlogin) ON identity_claim WHERE secrets.time - event.time BETWEEN
      0 AND 60m

      | ALERT principal, triggering_event, secret_count'
- question: Has any principal or source IP accumulated a burst of denied (Forbidden/Unauthorized) secret
    operations, or a high denied-to-success ratio, indicating permission probing before a successful dump?
  context: Before a successful secret dump, adversaries often probe what they can reach, generating denied
    operations. Profile ResultType in ('Forbidden','Unauthorized') separately from successes and alert
    when one principal/IP accumulates >=5 denied secret operations within 10 minutes, or when the denied:Success
    ratio exceeds 0.3. A positive result indicates scoped-token brute enumeration or permission probing;
    pair it with any subsequent successes from the same actor to find the moment access was achieved.
    Low, steady denial rates are normal noise. This failure-mode lens complements the burst detection
    for Credential Access.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults storing production credentials, administrative break-glass vaults, and the identities
    granted secret read permissions'
  range: Last 90 days, 10-minute denial-burst windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM AzureDiagnostics WHERE ResourceType==''VAULTS'' AND OperationName IN (''SecretGet'',''SecretList'')

      | BIN time INTO 10m GROUP BY identity_claim_upn_s, CallerIPAddress, window

      | COMPUTE denied = countif(ResultType IN (''Forbidden'',''Unauthorized'')), success = countif(ResultType==''Success'')

      | ALERT WHERE denied >= 5 OR (denied / max(success,1)) > 0.3'
- question: Does any principal's daily secret read volume, distinct-secret diversity, secret-version depth,
    or source-IP set deviate sharply from its own 30-day baseline for a given vault?
  context: Statistical baselining catches dumping that stays under fixed thresholds but is abnormal for
    the specific actor or vault. Baseline per principal and per vault the daily SecretGet/SecretList volume
    (ops/min), distinct-secret-name diversity, secret-version depth, and source-IP set over 30 days. Flag
    first-time vault access and spikes above the 99th percentile, or read rates inconsistent with the
    calling application's known cadence. Derive vault-specific thresholds from each vault's own distribution,
    since a high-traffic vault and a rarely used break-glass vault have very different normal. A positive
    result is a statistically anomalous read session; a negative result is volume within the actor/vault
    norm. Supports Credential Access by exposing quiet but abnormal harvesting.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults storing production credentials, administrative break-glass vaults, and the identities
    granted secret read permissions'
  range: Last 90 days, baselined against a trailing 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = FROM AzureDiagnostics WHERE OperationName IN (''SecretGet'',''SecretList'') LAST
      30d

      | PER principal, vault COMPUTE p99_volume, p99_diversity, version_depth_dist, known_ips

      live = today''s secret ops PER principal, vault

      | ALERT WHERE live.volume > p99_volume OR live.diversity > p99_diversity OR live.ip NOT IN known_ips
      OR first_time(principal,vault)'
- question: Is this the first time a principal has performed SecretList/SecretGet or touched a given vault,
    and how broad is the session in vaults, subscriptions, and distinct secrets compared with the actor's
    history and peers?
  context: 'Using a per-principal historical lookback (in the spirit of the Netflix CloudTrail Anomaly
    Detector), flag the first time a principal performs SecretList/SecretGet or accesses a particular
    vault, and score session breadth: count of vaults, subscriptions, and distinct secrets touched. Prioritize
    sessions whose breadth or Success/Forbidden ratio materially exceeds the actor''s own history or peer
    group. A positive result is a novel actor suddenly enumerating broadly across the secret estate; a
    negative result is a known reader operating within its usual scope. This first-seen-plus-breadth scoring
    sharpens the Credential Access hunt by surfacing both new and unusually wide-reaching collectors.'
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults storing production credentials, administrative break-glass vaults, and the identities
    granted secret read permissions'
  range: Last 90 days, with per-principal lookback for first-seen determination.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hist = per-principal set of (operation, vault) over lookback

      session = current per-principal window of secret ops

      | COMPUTE first_seen_op = session.op NOT IN hist.ops, first_seen_vault = session.vault NOT IN hist.vaults

      | COMPUTE breadth = dcount(vault)+dcount(subscription)+dcount(secret), sf_ratio = success/forbidden

      | SCORE and ALERT WHERE first_seen_* OR breadth >> peer_group_breadth OR sf_ratio anomalous'
- question: Does an unsupervised model of Key Vault secret-access behavior flag a session as a rare function
    for the principal or population, indicating manual or scripted dumping rather than routine retrieval?
  context: 'Train an unsupervised rare-function/population model on Key Vault access features: object-type
    mix, distinct-secret count, sequence timing, caller identity class, user agent, source novelty, and
    denied-ratio. The model separates routine application retrieval (consistent feature vectors) from
    manual or scripted dumping, mirroring rare-operation-for-principal CloudTrail ML jobs. Alert text
    must surface the top-3 contributing features (e.g., distinct-secret count, caller class, source novelty)
    so analysts can triage quickly. A positive result is a high anomaly score with explainable drivers
    pointing at bulk/manual access; this supports Credential Access by catching dumping that evades fixed
    rules and simple baselines.'
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults storing production credentials, administrative break-glass vaults, and the identities
    granted secret read permissions'
  range: Last 90 days for scoring; trained on a longer historical corpus.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = per-session [object_type_mix, distinct_secret_count, seq_timing, caller_class,
      user_agent, source_novelty, denied_ratio]

      model = unsupervised_rare_function(features) trained on history

      | SCORE current sessions; ALERT WHERE anomaly_score > threshold

      | EMIT top-3 contributing features per alert'
- question: Does the ordered sequence of a principal's operations match a SecretList -> bulk SecretGet
    -> cross-vault traversal pattern that resembles human-led credential dumping rather than steady application
    access?
  context: Apply a multi-order Markov / sequence model over per-principal operation streams to learn the
    normal application-to-vault interaction order, and flag sequences such as SecretList followed by bulk
    SecretGet followed by cross-vault traversal that resemble human-led credential dumping. For cross-service
    breadth, complement this with a principal-service-object graph model (CS-GAD) to detect traversal
    spanning many vaults and services. A positive result is an operation sequence with low likelihood
    under the learned model and a shape characteristic of discovery-then-harvest; a negative result follows
    the steady, repetitive ordering of automation. This sequence view supports Credential Access by modeling
    the workflow of a dump rather than individual events.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults storing production credentials, administrative break-glass vaults, and the identities
    granted secret read permissions'
  range: Last 90 days of per-principal operation sequences.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seqs = ordered per-principal operation streams (SecretList, SecretGet, vault transitions)

      model = multi_order_markov(seqs) ; graph = principal_service_object_graph()

      | ALERT WHERE seq_likelihood < threshold AND pattern ~ (List -> bulk Get -> cross-vault)

      | corroborate with graph traversal breadth'
- question: Did a single principal read multiple certificates, or read certificates paired with their
    backing secrets, in one session, especially following privilege changes or new sign-ins?
  context: Authentication and signing certificates enable impersonation, so adversaries enumerate and
    export them with their private material. In AzureDiagnostics, detect CertificateList/CertificateGet
    (Microsoft.KeyVault/vaults/certificates/read) and paired SecretGet for certificate-backed objects
    from one principal. Alert when >=3 certificates are accessed in one session, or when certificate reads
    follow privilege changes or new sign-ins, using the Sensitive Azure Key Vault operations grouping
    over the documented operation/caller fields. A positive result is a principal pulling several certificates
    (and their backing secrets) in a concentrated session, which is rare for legitimate workloads. This
    is the certificate-theft signal for AZT604 within Credential Access.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults that store service certificates, signing certificates, and identities with certificate
    management rights'
  range: Last 90 days, session-grouped.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM AzureDiagnostics WHERE OperationName IN (''CertificateGet'',''CertificateList'',''SecretGet'')

      | GROUP BY identity_claim_upn_s, session_window

      | COMPUTE certs = dcount(certificate_name), paired_secret = exists(SecretGet for cert-backed object)

      | ALERT WHERE certs >= 3 OR (cert_read AND recent_privilege_change_or_new_signin)'
- question: Did certificate reads occur adjacent to vault access-policy/role changes or service-principal
    sign-ins within about an hour, suggesting staging of certificate theft for immediate reuse?
  context: Correlate certificate reads with adjacent vault access-policy or role changes, or service-principal
    sign-ins, within 60 minutes to catch sessions staging certificate theft for immediate reuse. A positive
    result links a control-plane change or fresh SP sign-in to certificate retrieval, a pattern consistent
    with an actor acquiring rights then exporting certificates to impersonate a service or sign tokens.
    A negative result is certificate maintenance by an established identity with no surrounding privilege
    activity. This supports Credential Access by exposing the acquire-then-stage workflow specific to
    cryptographic-identity theft.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults that store service certificates, signing certificates, and identities with certificate
    management rights'
  range: Last 90 days, 60-minute correlation windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'changes = FROM AzureActivity WHERE OperationName IN (''accessPolicies/write'',''roleAssignments/write'')

      spsignin = FROM EntraSignIn WHERE servicePrincipal sign-in

      certs = FROM AzureDiagnostics WHERE OperationName IN (''CertificateGet'',''CertificateList'')

      | JOIN certs TO (changes UNION spsignin) ON identity WHERE 0 <= certs.time - event.time <= 60m

      | ALERT principal, triggering_event, certs_read'
- question: Has any principal or IP accumulated a burst of denied certificate reads, or a high denied-to-success
    ratio, indicating enumeration of inaccessible signing/auth certificates?
  context: Track ResultType=='Forbidden' on certificate operations and alert on >=5 denied certificate
    reads per principal/IP in 10 minutes, or a denied:Success ratio >0.3. A positive result indicates
    an actor probing for signing or authentication certificates it cannot yet reach, often a precursor
    to a successful certificate dump once permissions or tokens are obtained. Correlate denial bursts
    with any later successful certificate reads from the same actor to pinpoint the breach moment. Low,
    steady denials are normal. This failure-mode view rounds out the certificate-theft detection for Credential
    Access.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults that store service certificates, signing certificates, and identities with certificate
    management rights'
  range: Last 90 days, 10-minute denial-burst windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM AzureDiagnostics WHERE OperationName IN (''CertificateGet'',''CertificateList'')

      | BIN time INTO 10m GROUP BY identity_claim_upn_s, CallerIPAddress, window

      | COMPUTE denied = countif(ResultType==''Forbidden''), success = countif(ResultType==''Success'')

      | ALERT WHERE denied >= 5 OR (denied / max(success,1)) > 0.3'
- question: Is a principal's certificate-access behavior rare compared with its 30-day baseline (certificates
    per session, whether backing secrets are read, source IPs, time-of-day), or does it show cross-vault
    certificate access exceeding historic admin behavior?
  context: Baseline which principals read certificates, certificates-per-session, whether backing secrets
    are also read, source IPs, and time-of-day over 30 days. Flag rare callers, cross-vault certificate
    access, or breadth exceeding historic administrator behavior at the 99th percentile, deriving thresholds
    from each vault's distribution. A positive result is a statistically unusual certificate-access session
    for that actor or vault; a negative result is routine certificate maintenance within the established
    norm. This statistical lens catches certificate harvesting that stays below fixed counts but is abnormal
    for the principal, supporting Credential Access.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults that store service certificates, signing certificates, and identities with certificate
    management rights'
  range: Last 90 days, baselined against a trailing 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = FROM AzureDiagnostics WHERE OperationName IN (''CertificateGet'',''CertificateList'')
      LAST 30d

      | PER principal, vault COMPUTE p99_certs_per_session, backing_secret_rate, known_ips, normal_hours

      | ALERT WHERE live.certs_per_session > p99 OR live.cross_vault OR live.ip NOT IN known_ips OR live.hour
      NOT IN normal_hours'
- question: Has an admin or workload identity accessed unfamiliar signing or authentication certificates
    for the first time, across environments, relative to its historical certificate set?
  context: Track the normal certificate set each admin/workload identity accesses, and flag first-seen
    access to unfamiliar signing/authentication certificates across environments using per-principal lookback.
    A positive result is an identity suddenly reaching certificates it has never touched, especially signing/auth
    certificates in other environments, which suggests targeted collection of impersonation material.
    A negative result is access confined to the identity's established certificate inventory. This deviation
    analysis supports Credential Access by surfacing actors expanding into new cryptographic-identity
    assets.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults that store service certificates, signing certificates, and identities with certificate
    management rights'
  range: Last 90 days, with per-principal lookback for first-seen determination.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hist = per-principal historical set of certificate_name/vault accessed

      | ALERT WHERE current.certificate_name NOT IN hist OR current.vault NOT IN hist.vaults

      | prioritize signing/auth certs and cross-environment access'
- question: Does a classifier over certificate-read sequences, actor type, source characteristics, denied-ratio,
    and adjacent control-plane events distinguish certificate harvesting from routine maintenance?
  context: Train a model over certificate-read sequences, actor type, source characteristics, denied-ratio,
    and adjacent control-plane events to identify certificate harvesting versus routine maintenance, using
    rare-operation/population features. Surface the top-3 contributing features in alerts so analysts
    understand the drivers. A positive result is a high-confidence classification of harvesting behavior
    with explainable features (e.g., dense certificate reads from a novel source after a privilege change);
    a negative result reflects normal certificate lifecycle operations. This ML approach supports Credential
    Access by catching certificate theft that evades static rules.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults that store service certificates, signing certificates, and identities with certificate
    management rights'
  range: Last 90 days for scoring; trained on longer history.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [cert_read_sequence, actor_type, source_chars, denied_ratio, adjacent_control_plane_events]

      model = rare_operation_population_classifier(features)

      | ALERT WHERE score > threshold ; EMIT top-3 contributing features'
- question: Do session-level sequence and principal-service-object graph models identify a certificate-collection
    campaign aimed at follow-on credential abuse?
  context: Apply a session-level sequence (multi-order Markov) model over object-type mix, access ordering,
    actor history, and post-read activity, and a principal-service-object graph model (CS-GAD) to identify
    certificate-collection campaigns aimed at follow-on credential abuse. A positive result is a low-likelihood
    access sequence combined with graph traversal spanning many certificates/services and followed by
    reuse activity; a negative result is steady, narrow maintenance. Combining sequence and graph views
    supports Credential Access by modeling both the workflow and the breadth of certificate harvesting.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults that store service certificates, signing certificates, and identities with certificate
    management rights'
  range: Last 90 days of per-principal sessions.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq_model = multi_order_markov(object_type_mix, access_order, actor_history, post_read_activity)

      graph = principal_service_object_graph()

      | ALERT WHERE seq_likelihood < threshold AND graph_traversal_breadth high AND post_read_reuse observed'
- question: Did a single principal or IP retrieve a burst of distinct Key Vault keys or key versions across
    one or more vaults within a short window, especially when that identity does not normally perform
    key management?
  context: Broad key enumeration can indicate inventorying of cryptographic material or preparation to
    abuse key-backed services. In AzureDiagnostics, alert on KeyGet/KeyList (Microsoft.KeyVault/vaults/keys/read)
    touching >=10 distinct key names/versions or multiple vaults from one principal/IP within a 10-minute
    window, especially when the identity does not normally perform key management, using the Sensitive
    Azure Key Vault operations EventCount/caller grouping. A positive result is a concentrated key-read
    burst by an atypical key reader; legitimate services use a small, stable key set. This is the key-dumping
    signal for AZT604 under Credential Access.
  answer_sources:
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Key Vaults used for customer-managed keys, HSM-backed operations, and identities with key read
    permissions'
  range: Last 90 days, 10-minute burst windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM AzureDiagnostics WHERE OperationName IN (''KeyGet'',''KeyList'')

      | BIN time INTO 10m GROUP BY identity_claim_upn_s, CallerIPAddress, window

      | COMPUTE distinct_keys = dcount(key_name||key_version), vaults = dcount(vault)

      | ALERT WHERE distinct_keys >= 10 OR vaults > 1 ; RAISE when principal not in known_key_managers'
