name: 'AZT705: Azure Backup Delete'
id: d725587a-a4d0-4801-bba7-9e464551c22c
description: Investigate whether an adversary has deleted, disabled, or tampered with Azure Backup resources
  to undermine recovery and amplify destructive impact. This playbook helps an analyst hunt for destructive
  operations against Recovery Services Vaults and the backup data they protect — including protected-item
  deletion, stop-protection-with-delete-data, backup-policy deletion or retention reduction, vault deletion,
  disabling of soft-delete, and removal or disablement of Multi-User Authorization (MUA) Resource Guards.
  It guides deterministic control-plane alerting, statistical baselining of who normally manages each
  vault and how often destructive operations occur, profiling of failed and MUA-blocked attempts, and
  machine-learning approaches (operation-sequence modeling, causal-path linkage, and campaign classification)
  that connect backup sabotage to surrounding workload destruction such as VM, disk, snapshot, or storage
  deletion.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are there any destructive Recovery Services Vault control-plane operations — protected-item
    delete, stop-protection-with-delete-data, backup-policy delete or retention reduction, or vault delete
    — occurring outside an approved change window?
  context: 'This is the core deterministic detection for Azure Backup sabotage. The set of destructive
    RSV operations is enumerable in AzureActivity/AzureDiagnostics (e.g. Microsoft.RecoveryServices/Vaults/backupFabrics/protectionContainers/protectedItems/delete,
    stop-protection-with-delete-data, backup policy delete or retention reduction, and vault delete).
    Under the Impact tactic, an adversary destroys backups to remove the organization''s ability to recover
    from concurrent destructive activity. Any non-zero occurrence of these operations outside a documented
    change window should be triaged: confirm the actor, the targeted vault and protected workload, and
    whether a change ticket authorizes it. A positive result (unsanctioned deletion) is a high-severity
    recovery-integrity event; a negative result confirms backups remain intact. Restrict and log backup-admin
    privileges per CISA #StopRansomware guidance. References: [Azure Backup security features, Microsoft](https://learn.microsoft.com/en-us/azure/backup/backup-azure-security-feature);
    [Azure Monitor Logs in Azure Backup, Microsoft](https://learn.microsoft.com/en-us/azure/backup/backup-azure-monitoring-use-azuremonitor);
    [#StopRansomware Guide, CISA](https://www.cisa.gov/stopransomware/ransomware-guide).'
  answer_sources: &id001
  - AzureActivity
  - AzureDiagnostics
  - AzureBackupReport
  - CoreAzureBackup
  - AddonAzureBackupJobs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Recovery Services Vaults protecting critical workloads, backup administrators and their role
    assignments, Resource Guards / Multi-User Authorization configuration, and subscriptions hosting regulated
    or mission-essential systems'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nlet destructive = dynamic([\n  \"Microsoft.RecoveryServices/Vaults/backupFabrics/protectionContainers/protectedItems/delete\"\
      ,\n  \"stopProtectionWithDeleteData\", \"backupPolicies/delete\", \"reduceRetention\",\n  \"Microsoft.RecoveryServices/Vaults/delete\"\
      ]);\nAzureActivity\n| where OperationNameValue in~ (destructive) or OperationName has_any (destructive)\n\
      | where ActivityStatusValue in (\"Success\",\"Started\",\"Accepted\")\n| where not(in_approved_change_window(TimeGenerated))\n\
      | project TimeGenerated, Caller, CallerIpAddress, _ResourceId, OperationNameValue, ActivityStatusValue\n\
      | order by TimeGenerated asc"
- question: Has soft-delete been disabled on any vault, or has Multi-User Authorization (MUA) / its Resource
    Guard been removed or disabled — or has any critical operation been executed without a corresponding
    Resource Guard approval?
  context: 'Disabling soft-delete and removing or disabling MUA/Resource Guard are high-fidelity precursors
    to backup destruction: they strip the safety controls that would otherwise allow recovery or block
    unilateral destructive actions. These should never occur without a documented approval workflow. Under
    Impact, an adversary disarms these protections immediately before purging backups. Alert on a single
    occurrence of disable-soft-delete or MUA removal, and on any critical operation (stop-protection-with-delete-data,
    disable soft delete, reduce retention, delete policy) that lacks a matching Resource Guard approval
    event. A positive result means the recovery safety net was deliberately weakened; correlate tightly
    with subsequent deletions. Generate and validate this telemetry with Stratus Red Team. References:
    [Multi-user authorization using Resource Guard, Microsoft](https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept);
    [Azure Backup security features, Microsoft](https://learn.microsoft.com/en-us/azure/backup/backup-azure-security-feature);
    [Stratus Red Team, DataDog](https://github.com/DataDog/stratus-red-team).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      let tamper = dynamic(["disableSoftDelete","resourceGuard/delete","disableMUA","removeResourceGuard"]);

      let critical = dynamic(["stopProtectionWithDeleteData","disableSoftDelete","reduceRetention","backupPolicies/delete"]);

      AzureActivity

      | where OperationName has_any (tamper) or OperationName has_any (critical)

      | extend hasApproval = exists_resource_guard_approval(CorrelationId, _ResourceId)

      | where (OperationName has_any (tamper)) or (OperationName has_any (critical) and hasApproval ==
      false)

      | project TimeGenerated, Caller, CallerIpAddress, _ResourceId, OperationName, hasApproval'
- question: Do any vault deletions, disable-soft-delete events, or stop-protection-with-delete-data operations
    occur within a short window (e.g. +/- 60 minutes) of VM deletion, managed-disk deletion, disk/snapshot
    export, storage-account/blob deletion, or mass encryption?
  context: 'This correlation identifies campaigns where backup removal is used to prevent recovery from
    broader destruction (MITRE T1490 Inhibit System Recovery alongside T1485 Data Destruction). Under
    the Impact tactic, sophisticated actors sequence backup sabotage with workload destruction to maximize
    and lock in damage. The analyst looks for temporal clustering of a destructive backup operation and
    a destructive compute/storage operation by the same or related principals. A positive result — backup
    destruction tightly coupled with VM/disk/storage destruction or mass encryption — strongly indicates
    an active destructive campaign and warrants immediate containment. A negative result suggests isolated
    backup activity that may still merit review. References: [Inhibit System Recovery (T1490), MITRE ATT&CK](https://attack.mitre.org/techniques/T1490/);
    [Data Destruction (T1485), MITRE ATT&CK](https://attack.mitre.org/techniques/T1485/).'
  answer_sources: *id001
  range: Last 90 days; correlate events within +/- 60 minutes
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nlet backupDestroy = AzureActivity\n  | where OperationName has_any (\"Vaults/delete\"\
      ,\"disableSoftDelete\",\"stopProtectionWithDeleteData\")\n  | project bTime=TimeGenerated, Caller,\
      \ bOp=OperationName, _ResourceId;\nlet workloadDestroy = AzureActivity\n  | where OperationName\
      \ has_any (\"virtualMachines/delete\",\"disks/delete\",\"snapshots\",\"storageAccounts/delete\"\
      ,\"blobServices\")\n  | project wTime=TimeGenerated, Caller, wOp=OperationName, wRes=_ResourceId;\n\
      backupDestroy | join kind=inner workloadDestroy on Caller\n| where abs(datetime_diff('minute', bTime,\
      \ wTime)) <= 60\n| project bTime, wTime, Caller, bOp, wOp, _ResourceId, wRes"
- question: Is this the first time a given identity has issued any destructive Recovery Services Vault
    operation (delete protected item, disable soft delete, stop protection with delete data) within the
    trailing 90-day history?
  context: 'First-seen actor+operation combinations are high-priority because legitimate backup destruction
    is rare and performed by a small, stable set of administrators. Maintain a per-principal history of
    management operations over a 90-day lookback and flag the first time an identity performs a destructive
    RSV operation. Under Impact, an attacker who has compromised or escalated an account will frequently
    produce a never-before-seen actor/operation pairing. Surface the actor, the specific operation, and
    days-since-last-similar in the alert to aid triage. A positive result (a brand-new destroyer) merits
    investigation of how that identity obtained backup rights; a negative result indicates an established
    operator whose action may be routine. References: [CloudTrail Anomaly Detector, Netflix-Skunkworks](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources: *id001
  range: Last 90 days (90-day baseline lookback)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nlet hist = AzureActivity\n  | where TimeGenerated between (ago(90d) .. ago(1d))\n  | where\
      \ OperationName has_any (\"protectedItems/delete\",\"disableSoftDelete\",\"stopProtectionWithDeleteData\"\
      )\n  | summarize by Caller, Op=OperationName;\nAzureActivity\n| where TimeGenerated > ago(1d)\n\
      | where OperationName has_any (\"protectedItems/delete\",\"disableSoftDelete\",\"stopProtectionWithDeleteData\"\
      )\n| join kind=leftanti hist on Caller, $left.OperationName==$right.Op\n| project TimeGenerated,\
      \ Caller, OperationName, _ResourceId"
- question: Is the volume or frequency of destructive Recovery Services Vault operations per actor or
    per vault anomalously high relative to a 14-day seasonal+trend baseline?
  context: 'A burst of protected-item deletions materially exceeding the actor''s and vault''s historical
    maximum indicates a mass purge rather than routine lifecycle work. Baseline destructive RSV operations
    per actor and per vault per hour over a trailing 14 days using seasonal+trend decomposition, then
    flag spikes at a tunable 1.5-3 sigma (derive sigma per tenant from observed false-positive rate).
    Under Impact, mass backup deletion is a deliberate availability attack. A positive result — a statistically
    significant spike — points to bulk destruction; a negative result indicates volumes within normal
    operating range. Tune sigma to balance detection of slow, low-and-slow deletion against alert fatigue.
    References: [TimeSeriesAnomaly-ProcessExecutions, Microsoft Sentinel](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml).'
  answer_sources: *id001
  range: Last 14 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      let step=1h; let lookback=14d; let sigma=2.5;

      AzureActivity

      | where TimeGenerated > ago(lookback)

      | where OperationName has_any ("protectedItems/delete","stopProtectionWithDeleteData","Vaults/delete")

      | make-series cnt=count() default=0 on TimeGenerated step step by Caller

      | extend (anom,score,base)=series_decompose_anomalies(cnt, sigma)

      | mv-expand TimeGenerated, anom, cnt

      | where toint(anom) == 1

      | project Caller, TimeGenerated, cnt'
- question: Does the actor performing destructive vault operations deviate from the peer group that normally
    manages that vault — e.g. a non-backup-admin or peer outlier, acting at an unusual time, from an unusual
    network or geo?
  context: 'Backup administration is normally performed by a known set of identities from known networks
    at predictable times. Baseline who manages each vault, which protected systems they touch, and from
    where; then score per-entity and peer-group deviations (rare-for-user, peer outlier, unusual time/geo)
    using UEBA-style analytics. Under Impact, a compromised or insider account executing deletes will
    frequently stand out as a peer outlier. Flag a non-backup-admin or peer outlier performing deletes
    and surface the contributing deviation reasons. A positive result (significant peer deviation) elevates
    priority; a negative result (action consistent with the operator''s peer behavior) lowers it. References:
    [Identify threats with entity behavior analytics (UEBA), Microsoft](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [Microsoft Sentinel anomalies reference, Microsoft](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nlet peers = AzureActivity\n  | where TimeGenerated between (ago(90d)..ago(1d))\n  | where\
      \ OperationName has \"backup\" or OperationName has \"RecoveryServices\"\n  | summarize ops=count(),\
      \ nets=make_set(CallerIpAddress) by Caller, VaultId=_ResourceId;\nAzureActivity\n| where TimeGenerated\
      \ > ago(1d)\n| where OperationName has_any (\"protectedItems/delete\",\"stopProtectionWithDeleteData\"\
      ,\"disableSoftDelete\")\n| join kind=leftouter peers on Caller, $left._ResourceId==$right.VaultId\n\
      | extend rare_for_user = isempty(ops), peer_outlier = isempty(VaultId), unusual_net = not(CallerIpAddress\
      \ in (nets))\n| where rare_for_user or peer_outlier or unusual_net\n| project TimeGenerated, Caller,\
      \ _ResourceId, rare_for_user, peer_outlier, unusual_net"
- question: Are there bursts of failed or blocked destructive RSV operations — AuthorizationFailed/403
    responses or MUA-blocked critical operations — by a single principal, even when no deletion ultimately
    succeeds?
  context: 'Failed and blocked attempts are distinct, valuable signals: a spike of AuthorizationFailed/403
    on RSV delete/disable operations, or MUA-blocked critical operations, indicates reconnaissance or
    a thwarted sabotage attempt that frequently precedes a successful escalation. Under Impact, an attacker
    probes backup defenses before finding a path that works. Alert on a spike of failed destructive attempts
    by one principal even when nothing was destroyed, so defenders can intervene before the actor escalates
    or obtains the missing rights. A positive result (a burst of denials) is an early-warning indicator;
    a negative result indicates no probing of backup controls. Profile failure/error rates separately
    from successful-operation baselines. References: [Microsoft Sentinel anomalies reference, Microsoft](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference);
    [Multi-user authorization using Resource Guard, Microsoft](https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      AzureActivity

      | where TimeGenerated > ago(1d)

      | where OperationName has_any ("protectedItems/delete","disableSoftDelete","stopProtectionWithDeleteData","Vaults/delete")

      | where ActivityStatusValue in ("Failed") or ResultType in ("AuthorizationFailed","Forbidden") or
      OperationName has "MUA" and ActivityStatusValue=="Failed"

      | summarize fails=count(), ops=make_set(OperationName) by Caller, bin(TimeGenerated, 1h)

      | where fails >= 3

      | order by fails desc'
- question: Within a principal's ordered control-plane operation sequence, are there improbable transitions
    — such as role-assignment -> disable-soft-delete -> delete-protected-item — that are individually
    common but jointly rare for normal operators?
  context: 'Individual operations may each look benign, but their ordering reveals intent. Score the ordered
    sequence of a principal''s control-plane operations with a variable-order (multi-order) Markov model
    and flag low-probability transitions. Under Impact, an attack chain like grant-self-rights -> disarm-soft-delete
    -> destroy-backups produces a transition pattern that is jointly improbable for legitimate operators
    even though each step is common in isolation. Output the improbable transition and its likelihood
    in the alert. A positive result (an improbable, intent-revealing sequence) is high-value; a negative
    result indicates the operation order matches learned-normal behavior. References: [Protecting APIs
    from abuse using sequence learning and variable-order Markov chains, Cloudflare](https://blog.cloudflare.com/protecting-apis-from-abuse-using-sequence-learning-and-variable-order-markov/);
    [Statistical Learning for Anomaly Detection in Cloud Server Systems](https://ieeexplore.ieee.org/document/7065233/).'
  answer_sources: *id001
  range: Last 90 days (sequence model trained on trailing history)
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n# Train variable-order Markov model on per-principal operation sequences\nmodel = VariableOrderMarkov(max_order=4)\n\
      model.fit(historical_sequences_by_caller(lookback='90d'))\nfor caller, seq in recent_sequences_by_caller(window='24h'):\n\
      \    for (ctx, next_op, p) in model.transition_probs(seq):\n        if next_op in DESTRUCTIVE_RSV_OPS\
      \ and p < threshold:\n            emit_alert(caller=caller, transition=ctx+'->'+next_op, likelihood=p)"
- question: Can a causal path be constructed linking the authentication, sign-in, or role assignment that
    granted backup-management rights to a subsequent destructive vault operation — especially where a
    credential or role switch immediately precedes anomalous backup deletion?
  context: 'Recovery sabotage is often the tail of a chain that begins with an anomalous sign-in or a
    fresh role assignment that grants backup-management rights. Build causal paths over identity -> vault
    -> workload edges that link the grant of rights to the destructive operation, and prioritize paths
    where a credential/role switch immediately precedes anomalous backup deletion (Hopper-style lateral-movement
    modeling). For multi-stage chains, apply provenance-graph reconstruction-error scoring (KAIROS-style)
    and emit an auto-constructed attack-summary graph with the top contributing edges. Under Impact, this
    connects the enabling escalation to the destructive payoff, achieving low alert volume with high context.
    A positive result yields a coherent attack path; a negative result shows the deletion is not preceded
    by suspicious rights changes. References: [Hopper: Modeling and Detecting Lateral Movement, Ho et
    al.](https://www.usenix.org/system/files/sec21-ho.pdf); [KAIROS: Practical Intrusion Detection using
    Whole-system Provenance, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\ng = build_provenance_graph(edges=['signin->identity','roleAssignment->identity','identity->vault','vault->workload'],\
      \ window='90d')\npaths = g.causal_paths(sink_ops=DESTRUCTIVE_RSV_OPS)\nfor p in paths:\n    if p.has_recent_role_or_cred_switch(before_minutes=120)\
      \ and p.destructive_op_is_anomalous():\n        score = reconstruction_error(p)\n        if score\
      \ > threshold:\n            emit_attack_summary_graph(path=p, top_edges=p.top_contributing_edges(3),\
      \ score=score)"
- question: Should a given backup deletion be classified as expected lifecycle work or as adversary sabotage,
    given actor novelty, vault sensitivity, protected-workload criticality, sign-in anomaly, and surrounding
    impact events?
  context: 'Not every backup deletion is malicious; the goal is to separate routine lifecycle activity
    from sabotage. Train a classifier using features such as actor novelty, vault sensitivity, protected-workload
    criticality, sign-in anomaly score, and the presence of surrounding impact events (e.g. concurrent
    VM deletion, disable-soft-delete). Under Impact, the highest-risk deletions combine a first-time actor,
    disarmed protections, and concurrent destruction. Surface the top-3 contributing features in the alert
    text rather than only a score, so analysts can act quickly. Validate against labeled detonations from
    Stratus Red Team. A positive classification (sabotage) drives escalation; a negative (lifecycle) supports
    rapid dismissal with rationale. References: [Microsoft Sentinel anomalies reference, Microsoft](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference);
    [Identify threats with entity behavior analytics (UEBA), Microsoft](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [Stratus Red Team, DataDog](https://github.com/DataDog/stratus-red-team).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nfeatures = extract(['actor_novelty','vault_sensitivity','workload_criticality',\n  'signin_anomaly','concurrent_impact_events','disable_soft_delete_present'])\n\
      model = GradientBoostedClassifier.load('backup_sabotage_clf')  # validated vs Stratus Red Team labels\n\
      for ev in destructive_backup_events(window='24h'):\n    p = model.predict_proba(features(ev))\n\
      \    if p['sabotage'] > threshold:\n        emit_alert(event=ev, score=p['sabotage'], top_features=model.top_features(ev,\
      \ 3))"
