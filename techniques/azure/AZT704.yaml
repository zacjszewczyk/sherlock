questions:
- question: Did any principal invoke an Azure Key Vault recovery operation (VaultRecover, SecretRecover,
    KeyRecover, or CertificateRecover) that reverses a deliberate soft-delete, and can each recover be
    tied to a prior delete by the same identity?
  context: 'Soft-delete recovery of Key Vault objects undoes a defensive or administrative deletion and
    re-exposes secrets, certificates, and keys that were meant to stay unavailable. Deterministically
    alert in AzureDiagnostics when operationName is VaultRecover, SecretRecover, KeyRecover, or CertificateRecover,
    then correlate each recover with the earlier delete event and the same identity.claim to confirm a
    delete-then-recover performed by a single principal. A positive match — especially recovering credentials
    or signing keys — is a high-fidelity Impact signal that an adversary is re-acquiring removed material
    to regain access; a benign result is an approved break-glass restore by an authorized operator. Codify
    the logic as portable Sigma cloud rules so it travels across tenants. References: [Azure Key Vault
    logging](https://learn.microsoft.com/en-us/azure/key-vault/general/logging); [Key Vault soft-delete
    overview](https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview); [Sigma
    cloud rules](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security).'
  answer_sources: &id001
  - AzureDiagnostics
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Soft-deleted Key Vault secrets, certificates, and keys tied to sensitive workloads and administrative
    identities'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AzureDiagnostics\n| where ResourceProvider == 'MICROSOFT.KEYVAULT'\n| where OperationName\
      \ in ('VaultRecover','SecretRecover','KeyRecover','CertificateRecover')\n| where ResultType == 'Success'\n\
      | project recoverTime=TimeGenerated, identity_claim, CallerIPAddress, id_s, OperationName\n| join\
      \ kind=inner (\n    AzureDiagnostics\n    | where OperationName has 'Delete'\n    | project delTime=TimeGenerated,\
      \ identity_claim, id_s\n  ) on identity_claim, id_s\n| where recoverTime > delTime   // same principal\
      \ performed delete then recover"
- question: Was a Key Vault recovery operation immediately followed by a read of the same object (SecretGet,
    KeyGet, or CertificateGet) within a tight window, and was the reader a different principal than the
    one who recovered it?
  context: 'Recover-then-read is the high-fidelity signature of an adversary reacquiring removed material:
    the object is restored only to be immediately consumed. Correlate a recover event with a SecretGet/KeyGet/CertificateGet
    against the same object within a tight window (default <=10 minutes). The shorter the latency between
    restore and read, the stronger the evidence that the restore existed solely to harvest the value rather
    than to restore a service. Escalate when the reading principal differs from the recovering principal,
    which suggests handoff or use of a separate identity to obscure attribution. For the Impact tactic
    this confirms the adversary achieved the objective — sensitive material is back in their hands. References:
    [Azure Key Vault logging](https://learn.microsoft.com/en-us/azure/key-vault/general/logging).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let recovers = AzureDiagnostics\n  | where OperationName in ('VaultRecover','SecretRecover','KeyRecover','CertificateRecover')\n\
      \  | project rTime=TimeGenerated, obj=id_s, rPrincipal=identity_claim;\nAzureDiagnostics\n| where\
      \ OperationName in ('SecretGet','KeyGet','CertificateGet')\n| project gTime=TimeGenerated, obj=id_s,\
      \ gPrincipal=identity_claim\n| join kind=inner recovers on obj\n| where gTime - rTime between (0min\
      \ .. 10min)\n| extend escalate = gPrincipal != rPrincipal   // reader differs from recoverer"
- question: Did a principal generate denied (Forbidden/401/403) recover or get attempts immediately before
    a successful recover from the same principal or IP, indicating permission probing rather than a routine
    break-glass restore?
  context: 'A burst of access-denied results followed by a success is the classic fingerprint of permission
    probing: the actor is testing what they can reach before they succeed, unlike a sanctioned break-glass
    operation that succeeds on the first attempt. Flag resultSignature/result values of Forbidden/401/403
    on recover or get operations that precede a successful recover by the same principal or source IP.
    Pair this with risky Entra sign-in context to strengthen attribution. A positive result reframes an
    otherwise lone successful recover as the tail end of reconnaissance, raising severity for this Impact
    behavior; the absence of preceding denials is more consistent with an authorized operator. References:
    [Detecting Microsoft 365 and Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AzureDiagnostics\n| where ResourceProvider == 'MICROSOFT.KEYVAULT'\n| where OperationName\
      \ has_any ('Recover','Get')\n| extend denied = ResultSignature in ('Forbidden','401','403') or ResultType\
      \ == 'Forbidden'\n| summarize denials=countif(denied), successes=countif(OperationName has 'Recover'\
      \ and ResultType=='Success'),\n    firstDeny=minif(TimeGenerated, denied), firstSuccess=minif(TimeGenerated,\
      \ not(denied))\n    by identity_claim, CallerIPAddress, bin(TimeGenerated, 1h)\n| where denials\
      \ >= 3 and successes >= 1 and firstSuccess > firstDeny   // probe-then-success"
- question: Does any principal or vault show statistically anomalous recovery behavior — a first-ever
    recover, recoveries outside maintenance windows, abnormal recover frequency, or rapid delete-then-recover
    loops with sub-minute latency?
  context: 'Legitimate recoveries are rare and predictable, so behavioral baselining surfaces the anomalies.
    Baseline per-principal and per-vault recover frequency (count/day over 30-90 days), elapsed delete->recover
    latency, and hour-of-day, then flag a principal''s first-ever recover, recoveries outside approved
    maintenance windows, or rapid delete-and-recover loops (latency under a few minutes). Use median/MAD
    modified Z-scores so automation bursts do not inflate the baseline, and add per-account rare-operation
    scoring. For the Impact tactic, a first-seen recoverer or an off-baseline burst marks the moment an
    adversary reversed an intended deletion; a result inside normal cadence and windows is likely operational.
    References: [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly);
    [Microsoft Sentinel anomalies reference](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'AzureDiagnostics

      | where OperationName in (''VaultRecover'',''SecretRecover'',''KeyRecover'',''CertificateRecover'')

      | summarize cnt=count(), hours=make_set(hourofday(TimeGenerated)) by identity_claim, Resource, bin(TimeGenerated,1d)

      | extend med=series_stats_dynamic, mZ = 0.6745*(cnt - toscalar(percentile(cnt,50)))/ toscalar(stdev(cnt))

      | where mZ > 3.5            // MAD modified Z-score outlier

      // also flag: first-ever recover per principal, recoveries outside maintenance window,

      // delete->recover latency < a few minutes (rapid loop)'
- question: When scoring each Key Vault recovery by object sensitivity, actor rarity, delete-to-recover
    latency, count of distinct sensitive objects recovered in the session, and post-recovery read count,
    which recoveries rank highest?
  context: 'Not all recoveries are equal; a weighted risk score prioritizes the dangerous ones. Score
    recoveries by object sensitivity, actor rarity, delete->recover latency, the number of distinct objects
    recovered in a single session (flag more than 3 sensitive objects), and post-recovery read count.
    Prioritize high-value objects restored quickly or restored by identities whose role does not normally
    perform recovery. The alert text must list the top-3 contributing factors so an analyst can triage
    fast. For Impact, a session that rapidly restores multiple crown-jewel secrets and reads them is far
    more likely adversarial reacquisition than a single, slow, role-appropriate restore. References: [Microsoft
    Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [Detecting Anomalous Access Patterns in Relational Databases, Kamra et al.](https://link.springer.com/article/10.1007/s00778-007-0051-4).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "AzureDiagnostics\n| where OperationName endswith 'Recover'\n| extend sensitivity=lookup_sensitivity(id_s),\
      \ actor_rarity=rarity(identity_claim),\n    latency=delete_to_recover_latency(id_s), reads=post_recover_reads(id_s)\n\
      | summarize objs=dcount(id_s), score=sum(sensitivity*actor_rarity) , reads=sum(reads),\n    minLatency=min(latency)\
      \ by session_id, identity_claim\n| extend risk = score + iff(objs>3, 5, 0) + iff(minLatency<5m,\
      \ 5, 0) + reads\n| top 50 by risk\n| extend top3_factors = pack_top3(sensitivity, actor_rarity,\
      \ objs, reads, minLatency)"
- question: Do per-principal/per-vault operation sequences (delete -> ... -> recover -> get) diverge from
    approved break-glass or operational workflows when scored by a trained sequence model?
  context: 'Sanctioned recovery follows a known choreography; adversary recovery does not. Train a sequence
    model (DeepLog-style) on per-principal/per-vault operation streams such as delete -> ... -> recover
    -> get, then flag recovery sequences that diverge from approved break-glass/operational workflows
    and surface the exact deviating step for triage. Correlate flagged sequences with risky Entra sign-ins
    to add identity-risk context. Run this in parallel with — never instead of — the deterministic recover
    rules. For Impact, sequence anomalies catch novel restoration patterns the threshold rules miss, e.g.,
    a recover that is not preceded by the change-ticket pattern the model learned to expect. References:
    [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015); [Detecting Microsoft 365 and Azure
    AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).'
