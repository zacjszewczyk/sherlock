  context: 'Recovery breadth separates a targeted single-file restore from a sweeping data-reactivation
    campaign. Track the distinct objects/containers each actor restores per session and how quickly each
    is read, then prioritize sessions materially exceeding recovery norms or recoveries by identities
    whose role profile excludes restore operations. Surface the top-3 contributing factors in the alert.
    For Impact, an actor restoring many containers in one session and reading them rapidly — particularly
    an identity not provisioned for restore duties — strongly indicates adversarial bulk reactivation
    of deleted data rather than a narrow, sanctioned recovery. References: [Detecting Anomalous Access
    Patterns in Relational Databases, Kamra et al.](https://link.springer.com/article/10.1007/s00778-007-0051-4);
    [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
