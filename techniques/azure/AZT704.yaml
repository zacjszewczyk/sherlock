- question: Did any principal undelete a soft-deleted Azure Storage blob or restore a soft-deleted container
    (UndeleteBlob or RestoreContainer), especially when immediately followed by ListBlobs then GetBlob
    or an overwrite?
  context: 'Restoring soft-deleted storage rehydrates previously removed data, making it available again
    for theft, tampering, or operational disruption. In StorageBlobLogs/AzureActivity, alert on OperationName
    RestoreContainer or UndeleteBlob, and escalate when the restored container/blob is immediately followed
    by ListBlobs (enumeration) then GetBlob or an overwrite. That restore-enumerate-read chain indicates
    the restore exists to access data rather than to recover a service. For Impact, a positive result
    means an adversary reversed an intended deletion and is staging or exfiltrating the recovered content;
    codify the logic as portable Sigma cloud rules for reuse across storage accounts. References: [Soft
    delete for containers, Microsoft](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-container-overview);
    [Soft delete for blobs, Microsoft](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview);
    [Sigma cloud rules](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security).'
  answer_sources: &id002
  - StorageBlobLogs
  - AzureActivity
  - Entra Sign-in Logs
  - 'NAI: Soft-deleted blob containers, protected storage accounts, and identities authorized to manage
    restore operations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "StorageBlobLogs\n| where OperationName in ('UndeleteBlob','RestoreContainer')\n| where StatusText\
      \ == 'Success'\n| project rTime=TimeGenerated, AccountName, ObjectKey=Uri, CallerIpAddress, RequesterObjectId\n\
      | join kind=leftouter (\n    StorageBlobLogs | where OperationName in ('ListBlobs','GetBlob','PutBlob')\n\
      \    | project fTime=TimeGenerated, OperationName, Uri, RequesterObjectId\n  ) on RequesterObjectId\n\
      | where fTime between (rTime .. rTime+15min)   // restore -> list -> get/overwrite chain"
- question: Was a storage undelete correlated with a first-seen CallerIpAddress or RequesterObjectId,
    broad enumeration, or a large GetBlob egress within a short window, isolating restores intended for
    adversary access?
  context: 'Service-restoration restores look quiet; adversary restores are followed by access. Correlate
    an undelete with a first-seen CallerIpAddress/RequesterObjectId, broad enumeration, or large GetBlob
    egress within a short window to isolate restores intended for adversary access rather than legitimate
    recovery. A novel caller or a spike in read volume right after the restore is strong evidence the
    recovered data is being harvested. For the Impact tactic, this distinguishes a benign operational
    restore (no unusual follow-on access) from a malicious reactivation where the adversary immediately
    pulls the rehydrated data out of the account. References: [Soft delete for blobs, Microsoft](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let restores = StorageBlobLogs | where OperationName in ('UndeleteBlob','RestoreContainer')\n\
      \  | project rTime=TimeGenerated, AccountName, CallerIpAddress, RequesterObjectId;\nStorageBlobLogs\n\
      | where OperationName in ('ListBlobs','GetBlob')\n| join kind=inner restores on RequesterObjectId\n\
      | where TimeGenerated between (rTime .. rTime+30min)\n| summarize reads=count(), bytes=sum(ResponseBodySize),\
      \ newIp=any(CallerIpAddress not in (known_ips))\n    by AccountName, RequesterObjectId, CallerIpAddress\n\
      | where newIp or bytes > egress_threshold or reads > enum_threshold"
- question: Did a principal or IP produce clusters of 403/AuthorizationFailure results on restore, undelete,
    or list operations before a successful undelete, indicating probing of restore permissions?
  context: 'Denied-then-success on storage restore operations signals an actor discovering and then exercising
    permissions they should not routinely use. Flag clusters of StatusCode 403/AuthorizationFailure on
    restore/undelete or list operations preceding a successful undelete by the same principal/IP. A legitimate
    operator with proper RBAC succeeds without a wall of authorization failures, so a denial cluster immediately
    before success reframes the undelete as the payoff of reconnaissance. For Impact, this raises confidence
    that the restore is adversarial reactivation of deleted data rather than a sanctioned recovery, and
    it warrants pivoting to the identity''s broader activity. References: [Detecting Microsoft 365 and
    Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "StorageBlobLogs\n| where OperationName in ('UndeleteBlob','RestoreContainer','ListBlobs')\n\
      | extend denied = StatusCode == 403 or StatusText has 'AuthorizationFailure'\n| summarize denials=countif(denied),\
      \ success=countif(OperationName in ('UndeleteBlob','RestoreContainer') and StatusText=='Success'),\n\
      \    firstDeny=minif(TimeGenerated,denied), firstOk=minif(TimeGenerated, not(denied))\n    by RequesterObjectId,\
      \ CallerIpAddress, bin(TimeGenerated,1h)\n| where denials >= 3 and success >= 1 and firstOk > firstDeny"
- question: Does any storage account show anomalous restore behavior — a first-time restore, restores
    from unusual networks or off-hours, abnormal restore frequency, or post-restore reads exceeding the
    historical p99 read volume?
  context: 'Baselining restore behavior per storage account surfaces the rare events that matter. Baseline
    restore frequency, restored object count, post-restore read bytes/count, actor identity, and client
    network per storage account, then flag first-time restores, restores from unusual networks or off-hours,
    or post-restore reads exceeding the p99 of historical read volume. Use modified Z-scores to resist
    batch jobs that would otherwise inflate the baseline. For the Impact tactic, a first-seen restorer
    or a post-restore read spike beyond p99 marks the moment deleted data was reactivated and harvested;
    activity within established cadence and networks is more consistent with routine operations. References:
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly); [Microsoft
    Sentinel anomalies reference](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'StorageBlobLogs

      | where OperationName in (''UndeleteBlob'',''RestoreContainer'')

      | summarize restores=count(), objs=dcount(Uri) by AccountName, RequesterObjectId, CallerIpAddress,
      bin(TimeGenerated,1d)

      | extend mZ = 0.6745*(restores - toscalar(percentile(restores,50)))/toscalar(stdev(restores))

      | where mZ > 3.5 or restores == 1   // outlier or first-time restorer

      // also: off-hours / unusual network; post-restore read bytes > historical p99'
- question: How many distinct objects or containers does each actor restore per session, and how quickly
    is each read — do any sessions materially exceed recovery norms or come from identities whose role
