- question: Did a principal or IP receive Forbidden/403 results on recovery-vault administration or undelete
    operations before a successful undelete, signaling probing of recovery permissions?
  context: 'As with other recovery surfaces, denied-then-success indicates an actor testing recovery permissions
    before exercising them. Flag Forbidden/403 results on recovery-vault administration or undelete preceding
    a successful undelete by the same principal/IP. An authorized break-glass recovery operator would
    not normally generate a wall of denials before succeeding, so the denial-then-success pattern reframes
    the undelete as the culmination of permission probing. For Impact, this elevates confidence that the
    backup restoration is adversarial reactivation of removed protected content rather than legitimate
    disaster recovery, and it should drive review of the principal''s role and recent grants. References:
    [Detecting Microsoft 365 and Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).'
