    a sensitive key from a novel ASN after prior denials — that no single rule would flag on its own.
    References: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363); [GNN for Cloud
    IAM Logs](https://arxiv.org/abs/2512.10280).'
