name: 'AZT704: Soft-Delete Recovery'
id: 1e28332f-e35d-499f-8ecf-5f83858a6435
description: 'Investigate whether an adversary recovered Azure resources from a soft-delete state to regain
  access to sensitive material or reverse intended defensive deletion (AZT704, Impact). This playbook
  covers three soft-delete recovery surfaces: Azure Key Vault objects (secrets, certificates, keys restored
  via VaultRecover/SecretRecover/KeyRecover/CertificateRecover), Azure Storage blobs and containers (UndeleteBlob/RestoreContainer),
  and Azure Recovery Services backup items and vaults. For each surface it combines deterministic detection
  of the recover/undelete operations, correlation of delete-then-recover and recover-then-read chains
  by the same or differing principals, failed-attempt (403/Forbidden) probing precursors, statistical
  baselining of recovery frequency/latency/breadth and post-recovery read volume, and explainable machine-learning
  sequence, outlier, and IAM-graph models. The goal is to separate sanctioned break-glass and disaster-recovery
  operations from adversarial reactivation of intentionally deleted data.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
