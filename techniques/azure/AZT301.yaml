name: 'AZT301: Virtual Machine Scripting'
id: 11abb7cf-323c-4574-8411-ab137f74d999
description: 'Investigate potential abuse of Azure managed compute to execute adversary-controlled code
  through virtual machine scripting features. This playbook helps an analyst examine three execution paths:
  (1) Azure run-command and AKS command-invoke operations that run as SYSTEM/root through guest agents
  on VMs, scale sets, and clusters; (2) compute extension and gallery-application workflows (CustomScript,
  DSC, RunCommand) that stage and execute code through seemingly administrative configuration channels;
  and (3) serial console access that issues commands directly to a VM, bypassing normal remote-management
  patterns. For each path it covers deterministic control-plane-to-guest correlation, first-seen caller/target
  novelty, failure/denial probing signals, statistical volume, frequency, fan-out, and rarity anomalies,
  and machine-learning sequence, graph, and entity-behavior models, so a SOC analyst can distinguish legitimate
  administration from privileged code execution by an adversary.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
