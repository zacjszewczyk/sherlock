questions:
- question: Did a principal invoke an Azure run-command operation against a virtual machine, VM scale
    set instance, or AKS cluster, and did that control-plane call result in privileged code execution
    on the guest within minutes?
  context: Run-command capabilities (Microsoft.Compute/virtualMachines/runCommand/action, runCommands/write,
    VMSS runCommand, and AKS command invoke) execute as SYSTEM on Windows or root on Linux through the
    guest agent, so they are a direct path to privileged code execution that bypasses normal interactive
    logon. Alert on successful AzureActivity run-command operations and correlate them with near-term
    guest execution (Windows 4688, PowerShell 4104, Linux Syslog) or script-file creation on the target
    within 15 minutes. Any child shell (cmd, powershell, bash, /bin/sh) parented by the guest agent (WindowsAzureGuestAgent,
    WaAppAgent, walinuxagent) is high fidelity. Raise severity when the caller has not issued run-command
    in the trailing 90 days or the target hosts sensitive workloads. A positive result is a control-plane
    call tightly coupled to privileged guest execution; a negative result is a benign management-plane
    call with no anomalous guest activity. This supports the Execution tactic by exposing adversary-controlled
    code running on managed compute.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AKSAuditAdmin
  - 'NAI: Azure compute management plane activity, guest agents on targeted Windows and Linux systems,
    and AKS administrative paths capable of issuing command-invoke actions'
  range: Last 90 days, with 15-minute event-centered correlation from control-plane call to guest execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "cp = AzureActivity where OperationName in ['Microsoft.Compute/virtualMachines/runCommand/action',\n\
      \  'Microsoft.Compute/virtualMachines/runCommands/write','VMSS runCommand','AKS command invoke']\n\
      \  and activityStatus='Success';\nguest = (Win4688 or PS4104 or Syslog) where parent in ['WindowsAzureGuestAgent','WaAppAgent','walinuxagent']\n\
      \  and ts within 15m of cp.ts and host=cp.targetResource;\nalert join cp,guest on target; output\
      \ caller, target, OperationName, child_process, cmdline."
- question: Is this the first time the calling principal has ever issued a run-command or command-invoke
    operation, or the first time it has targeted this specific VM, scale set, or AKS cluster?
  context: Maintain first-seen tables of (caller principal, OperationName) and (caller, targetResourceId).
    Fire when a principal issues runCommand or command-invoke for the first time, or against a resource
    it has never touched. Novelty baselining catches credential theft and lateral movement where a legitimate-looking
    identity suddenly performs privileged execution it has never done before. A brand-new caller->target
    edge is treated as anomalous first-occurrence behavior. A positive result is a previously unseen caller/operation
    or caller/target pair; a negative result is activity consistent with the principal's established history.
    For Execution, this distinguishes routine operator automation from an adversary newly weaponizing
    stolen access.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AKSAuditAdmin
  - 'NAI: Azure compute management plane activity, guest agents on targeted Windows and Linux systems,
    and AKS administrative paths capable of issuing command-invoke actions'
  range: Last 90 days baseline window for first-seen determination.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "seen_op = baseline of (caller, OperationName) over 90d;\nseen_edge = baseline of (caller,\
      \ targetResourceId) over 90d;\ncur = AzureActivity where OperationName matches runCommand/command-invoke;\n\
      alert when (cur.caller,cur.OperationName) not in seen_op\n  or (cur.caller,cur.targetResourceId)\
      \ not in seen_edge;\noutput caller, OperationName, targetResourceId, first_seen=true."
- question: Did a principal accumulate repeated failed, forbidden, or authorization-denied run-command,
    extension, or role attempts, or guest-side non-zero script exits, before achieving a successful execution?
  context: Profile run-command and command-invoke calls returning activityStatus Failed, Forbidden, or
    AuthorizationFailed as a distinct signal. Alert when a principal accumulates three or more denied
    runCommand/extension/role attempts within 10 minutes (permission probing) before any success, and
    when guest-side scripts exit non-zero in bursts. Failed or denied control-plane calls preceding a
    success are a strong scripted-access indicator and reveal trial-and-error tradecraft as an actor learns
    the environment's permission boundaries. A positive result is a burst of denials followed by a success;
    a negative result is isolated, expected failures. This is tactic-relevant to Execution because it
    captures the reconnaissance/probing that immediately precedes adversary code execution.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AKSAuditAdmin
  - 'NAI: Azure compute management plane activity, guest agents on targeted Windows and Linux systems,
    and AKS administrative paths capable of issuing command-invoke actions'
  range: Last 90 days, with 10-minute sliding window for denial bursts.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "fails = AzureActivity where OperationName matches runCommand/extension/role\n  and activityStatus\
      \ in ['Failed','Forbidden','AuthorizationFailed'];\nbursts = count(fails) by caller over 10m where\
      \ count>=3;\nsuccess = AzureActivity where same caller and activityStatus='Success' after burst;\n\
      alert join bursts,success on caller; also flag guest scripts with nonzero exit bursts."
- question: Is the frequency of run-command activity for a given identity, target host, subscription,
    or hour-of-day, or the associated guest-side script execution volume, statistically anomalous versus
    its trailing baseline?
  context: Baseline run-command frequency by identity, target host, subscription, and hour-of-day, plus
    guest-side script execution volume tied to those actions. Flag calls exceeding the trailing 30-day
    per-identity 95th percentile (derive the cutoff per tenant; start at 95th and tighten if alert volume
    is high) or occurring outside the caller's normal hours. Use a modified Z-score / median-absolute-deviation
    cutoff so batch automation does not distort the threshold, and model the management-plane->guest transition
    probability with a multi-order Markov chain to flag low-probability sequences. A positive result is
    a volume or timing spike beyond the robust threshold or a rare transition; a negative result falls
    within normal variance. For Execution, abnormal cadence often signals scripted abuse rather than human
    operations.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AKSAuditAdmin
  - 'NAI: Azure compute management plane activity, guest agents on targeted Windows and Linux systems,
    and AKS administrative paths capable of issuing command-invoke actions'
  range: Trailing 30-day baseline, evaluated against the last 90 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = AzureActivity runCommand counts by (caller,host,subscription,hour) over 30d;

      mad = median_abs_deviation(base); cutoff = 95th_pct or modified_zscore>3.5;

      cur = current run-command volume per identity;

      alert when cur > cutoff or hour outside caller_normal_hours;

      markov_score(mgmt_plane -> guest_exec); alert on low-probability transitions.'
- question: Did a single session fan out run-command or command-invoke actions across an unusually large
    number of distinct hosts, node pools, or scale-set instances, or push abnormally large script payloads?
  context: 'Measure the volume and frequency of fan-out: count distinct hosts, node pools, or scale-set
    instances receiving run-command/command-invoke in one session and the per-minute invocation rate.
    Investigate sessions touching more than roughly five distinct targets or exceeding the trailing-baseline
    99th percentile of targets-per-session faster than routine remediation. Also track total bytes/length
    of script payloads pushed versus the host''s historical mean. Mass fan-out is characteristic of adversary
    attempts to deploy code broadly (e.g., ransomware staging) rather than targeted administration. A
    positive result is wide, rapid targeting or oversized payloads; a negative result is narrow, paced
    activity consistent with maintenance. This directly supports Execution by surfacing fleet-wide code
    delivery.'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AKSAuditAdmin
  - 'NAI: Azure compute management plane activity, guest agents on targeted Windows and Linux systems,
    and AKS administrative paths capable of issuing command-invoke actions'
  range: Last 90 days, session-scoped (group by caller and session/correlation id).
  queries:
  - technology: SIEM/Stats pseudocode
    query: "sess = AzureActivity runCommand/command-invoke grouped by caller,session;\ndistinct_targets\
      \ = count_distinct(targetResourceId) per sess;\nrate = invocations per minute per sess;\nalert when\
      \ distinct_targets>5 or distinct_targets>99th_pct(baseline)\n  or payload_bytes>host_mean*k; output\
      \ sess, targets, rate, total_payload."
- question: Does the sequence from management-plane command invocation into guest execution deviate from
    learned-normal execution paths and parameter distributions?
  context: Score the sequence from management-plane command invocation into guest execution using an LSTM
    log-sequence model (DeepLog-style) that learns normal execution paths and parameter distributions
    and flags deviating paths or parameters. Features include target novelty, privilege level, script
    length/entropy, process lineage, VM-vs-cluster context, caller history, and time-of-day. Surface the
    top-3 contributing features (e.g., first-seen target, high command entropy, off-hours) in the alert
    text. This captures contextually anomalous execution that deterministic rules miss. A positive result
    is a low-probability sequence with explanatory features; a negative result fits the learned model.
    Keep the deterministic runCommand rule as the floor and layer this model in parallel. For Execution,
    it models the full control-plane-to-guest code path.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AKSAuditAdmin
  - 'NAI: Azure compute management plane activity, guest agents on targeted Windows and Linux systems,
    and AKS administrative paths capable of issuing command-invoke actions'
  range: Last 90 days for scoring; model trained on a longer trailing window.
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [target_novelty, privilege_level, script_len, script_entropy,\n  process_lineage,\
      \ vm_or_cluster, caller_history, hour_of_day];\nmodel = LSTM_logseq.train(normal mgmt_plane->guest\
      \ sequences);\nscore = model.predict(current sequence);\nalert when score below learned threshold;\
      \ emit top3 contributing features."
- question: Do the identity->role->VM->runCommand relationships in a session form a contextually malicious
    but statistically benign edge consistent with a privilege-gaining movement path?
  context: Model identity->role->VM->runCommand relationships as a dynamic IAM graph and score contextually-malicious-but-statistically-benign
    edges with attention-based GNN embeddings. Prioritize sessions where the control-plane invocation
    plus follow-on guest identity/network actions resemble a privilege-gaining movement path with no legitimate
    cause (Hopper-style lateral-movement reasoning). This catches abuse that looks normal per-event but
    is anomalous in graph context. A positive result is a high-scoring suspicious path joining control-plane
    execution to onward movement; a negative result is a benign, well-precedented graph edge. Keep the
    deterministic runCommand rule as the floor and layer this model in parallel. For Execution, it ties
    code execution to broader intrusion structure.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AKSAuditAdmin
  - 'NAI: Azure compute management plane activity, guest agents on targeted Windows and Linux systems,
    and AKS administrative paths capable of issuing command-invoke actions'
  range: Last 90 days, graph built over a rolling identity/resource window.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'graph = build(identity->role->VM->runCommand edges + guest identity/network follow-ons);

      emb = attention_GNN.embed(graph);

      score = anomaly(emb edges);

      alert when path resembles privilege-gaining movement with no legitimate cause;

      output suspicious_path, contributing_edges.'
- question: Did an extension write or gallery-application/VM-application update reference a script-capable
    handler (CustomScript, DSC, RunCommand), and did it correlate with guest-side file creation in extension
    staging paths or interpreter execution within minutes?
  context: Detect AzureActivity extension writes (Microsoft.Compute/virtualMachines/extensions/write)
    or gallery-application/VM-application version updates referencing CustomScript/CustomScriptExtension,
    DSC, or RunCommand handlers, then correlate with guest-side file creation (Sysmon 11) in extension
    staging paths (e.g., C:\Packages\Plugins\..., /var/lib/waagent/), PowerShell 4104, shell execution,
    or service changes on the same host within 15 minutes. Extensions run as SYSTEM/root, so child interpreters
    parented by the extension handler are high fidelity. Configuration channels can look administrative
    while delivering attacker-controlled code. A positive result is an extension write tightly coupled
    to guest script artifacts; a negative result is an extension change with no anomalous guest execution.
    This supports Execution by exposing code delivered through configuration management.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 11
  - Syslog
  - 'NAI: Virtual machines and scale sets receiving Custom Script Extension, DSC, or Compute Gallery updates,
    plus guest file paths used by Azure extensions to stage code'
  range: Last 90 days, with 15-minute event-centered correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ext = AzureActivity where OperationName='Microsoft.Compute/virtualMachines/extensions/write'\n\
      \  or gallery/VM-application version update referencing CustomScript/DSC/RunCommand;\nguest = Sysmon11\
      \ in ['C:\\\\Packages\\\\Plugins\\\\','/var/lib/waagent/'] or PS4104 or shell/service change\n \
      \ where ts within 15m of ext.ts and host=ext.target;\nalert join ext,guest; output caller, host,\
      \ extension_type, staged_file, child_process."
- question: Did one identity deploy script-capable extensions or gallery applications to many new or sensitive
    hosts in close succession, or is the (caller, extension-type) or (caller, target) pair first-seen?
  context: Alert when one identity deploys script-capable extensions or gallery applications to new or
    sensitive hosts in close succession (five or more distinct VMs in 10 minutes), especially hosts with
    no shared patching relationship, or when the (caller, extension-type) or (caller, target) pair is
    first-seen. Mass or novel extension deployment is a hallmark of adversaries using configuration channels
    to push code broadly. A positive result is rapid fan-out across unrelated hosts or a previously unseen
    deployment pattern; a negative result is paced deployment consistent with an established maintenance
    group. For Execution, this catches scaled code delivery disguised as administration.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 11
  - Syslog
  - 'NAI: Virtual machines and scale sets receiving Custom Script Extension, DSC, or Compute Gallery updates,
    plus guest file paths used by Azure extensions to stage code'
  range: Last 90 days, with 10-minute window for mass-push detection.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'pushes = AzureActivity extension/gallery-app deploys grouped by caller over 10m;

      alert when count_distinct(target)>=5 with no shared patching relationship;

      seen = baseline (caller,extension_type),(caller,target) over 90d;

      alert when current pair not in seen; output caller, targets, extension_type, first_seen.'
- question: Did a principal generate bursts of failed, forbidden, or authorization-denied extension-write
    or gallery-application calls, or guest extension-handler errors, before a successful deployment?
  context: Track extension-write and gallery-application calls returning Failed/Forbidden/AuthorizationFailed,
    and guest extension handler errors, as a distinct signal. Bursts of denied extension writes before
    a success indicate permission probing or trial-and-error tradecraft as an actor maps what extensions
    and targets they can reach. A positive result is a cluster of denials followed by a success; a negative
    result is sporadic, expected failures. For Execution, this captures the probing that precedes configuration-channel
    code delivery.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 11
  - Syslog
  - 'NAI: Virtual machines and scale sets receiving Custom Script Extension, DSC, or Compute Gallery updates,
    plus guest file paths used by Azure extensions to stage code'
  range: Last 90 days, with 10-minute sliding window for denial bursts.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'fails = AzureActivity extension/gallery calls where status in [''Failed'',''Forbidden'',''AuthorizationFailed''];

      bursts = count(fails) by caller over 10m where count>=3;

      success = subsequent successful extension write by same caller;

      alert join bursts,success; also include guest extension-handler error events.'
- question: Has an administrator introduced script-bearing extensions to atypical hosts, or has extension
    and guest-execution volume diverged from normal patching, beyond a robust statistical threshold?
  context: Baseline extension update frequency, target-host distribution, and guest-side script artifacts
    by administrator and subscription. Alert when an actor introduces script-bearing extensions to atypical
    hosts or when extension activity and guest execution volume diverge from normal patching, using a
    modified Z-score/MAD threshold robust to maintenance batches and multi-order-Markov transition scoring
    for the extension->guest-execution sequence. A positive result is extension activity that breaks the
    established host distribution or transition pattern; a negative result matches routine patching. For
    Execution, drift from the maintenance baseline reveals configuration channels repurposed for malicious
    code.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 11
  - Syslog
  - 'NAI: Virtual machines and scale sets receiving Custom Script Extension, DSC, or Compute Gallery updates,
    plus guest file paths used by Azure extensions to stage code'
  range: Trailing 30-day baseline, evaluated against the last 90 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = extension updates by (admin,subscription,target_host) + guest artifact volume over
      30d;

      mad_cut = modified_zscore>3.5;

      alert when script-bearing extension on atypical host or volume divergence>mad_cut;

      markov_score(extension->guest_execution); alert on low-probability sequences.'
- question: Does the post-deployment guest activity footprint (file creations, interpreter launches, outbound
    connection count/bytes, non-zero exits) exceed the host's normal extension behavior?
  context: Compare the volume of post-deployment guest activity (file creations, interpreter launches,
    outbound connection count/bytes) with the host's normal extension behavior. Escalate extensions whose
    artifact footprint exceeds the host's trailing 95th percentile, and flag failed/non-zero guest exits
    as a state signal. Derive per-host cutoffs since maintenance footprints vary widely. A heavy artifact
    footprint after an extension deployment suggests the extension delivered substantive attacker code
    rather than a benign config change. A positive result is an outlier footprint or anomalous exit pattern;
    a negative result is a light, expected footprint. For Execution, this measures the actual code activity
    an extension produced.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 11
  - Syslog
  - 'NAI: Virtual machines and scale sets receiving Custom Script Extension, DSC, or Compute Gallery updates,
    plus guest file paths used by Azure extensions to stage code'
  range: Last 90 days, per-host baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = per-host guest artifacts (files,interpreters,conn_count,conn_bytes) after extensions
      over 90d;

      cur = artifacts after current deployment;

      alert when cur > host_95th_pct; flag nonzero guest exits as state signal;

      output host, extension, artifact_counts, exit_states.'
- question: Does the extension-deploy-to-guest-execution path, including embedded-script obfuscation features,
    deviate from learned-normal configuration-channel behavior?
  context: Use sequence analytics to identify malicious extension/gallery-application use with an LSTM
    log-sequence model over the extension-deploy-to-guest-execution path. Features include extension type,
    script artifact density, embedded-script length/entropy, host sensitivity, deployment timing, reuse
    across machines, and deviation from maintenance baselines. Score obfuscated/encoded embedded scripts
    with character-distribution/keyword/entropy features and surface the top contributing features in
    the alert. Unsupervised feature scoring via Isolation Forest and rare-API ML jobs provide parallel
    coverage; keep the deterministic rule as the floor. A positive result is a low-probability path or
    high-obfuscation embedded script; a negative result fits the learned model. For Execution, this models
    code delivery through configuration channels end to end.
  answer_sources:
  - AzureActivity
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 11
  - Syslog
  - 'NAI: Virtual machines and scale sets receiving Custom Script Extension, DSC, or Compute Gallery updates,
    plus guest file paths used by Azure extensions to stage code'
  range: Last 90 days for scoring; model trained on a longer trailing window.
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [extension_type, artifact_density, script_len, script_entropy,\n  host_sensitivity,\
      \ deploy_timing, reuse_count, maintenance_deviation];\nseq_model = LSTM_logseq.train(normal extension->guest\
      \ sequences);\nobf = char_dist+keyword+entropy score on embedded scripts;\niforest = IsolationForest(features);\n\
      alert when seq_score low or obf high or iforest outlier; emit top features."
- question: Was serial-console access established to a VM, and did it correlate with immediate privileged
    command execution, service manipulation, or file changes on the guest within minutes?
  context: Alert when serial-console access is established for a VM (Boot Diagnostics / serial-console
    channel events in AzureActivity) and correlate with immediate privileged command execution, service
    manipulation, or file changes on the guest (4688/4104/Syslog) within minutes. Serial console bypasses
    normal remote-management patterns, providing direct host-side execution tied to boot diagnostics or
    console interaction. Raise priority for production systems or accounts without routine break-glass
    duties. A positive result is console access immediately followed by privileged guest actions; a negative
    result is console access with no, or only benign recovery, activity. For Execution, this surfaces
    code run through an out-of-band channel.
  answer_sources:
  - Boot Diagnostics logs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AzureActivity
  - 'NAI: Virtual machines with boot diagnostics enabled, sensitive systems that seldom require break-glass
    console access, and operator accounts capable of serial-console use'
  range: Last 90 days, with few-minute event-centered correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "console = AzureActivity / BootDiagnostics where serial-console channel established;\nguest\
      \ = (Win4688 or PS4104 or Syslog) privileged cmd/service/file change\n  where ts within minutes\
      \ of console and host=console.target;\nalert join console,guest; raise priority for production hosts\
      \ or non-break-glass accounts."
- question: Was serial-console access used on a healthy, recently active system not in an outage state,
    or is this a first-seen (caller, target) console edge, especially when followed by identity, network,
    or persistence changes?
  context: Detect serial-console use on systems that are healthy, recently active, or not in an outage
    state, especially when followed by identity, network, or persistence changes rather than recovery
    commands. Treat first-seen (caller, target) console edges as anomalous first occurrences. Console
    access is meant for recovery; its use on healthy systems, or by a caller/target pair never seen before,
    suggests abuse of a break-glass path for execution rather than legitimate troubleshooting. A positive
    result is console use on a healthy host or a novel edge with non-recovery follow-on actions; a negative
    result is console use during a genuine outage with recovery commands. For Execution, this distinguishes
    break-glass misuse from legitimate recovery.
  answer_sources:
  - Boot Diagnostics logs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AzureActivity
  - 'NAI: Virtual machines with boot diagnostics enabled, sensitive systems that seldom require break-glass
    console access, and operator accounts capable of serial-console use'
  range: Last 90 days baseline for first-seen edges.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "console = serial-console sessions joined with host health/outage state;\nseen = baseline (caller,target)\
      \ console edges over 90d;\nalert when host healthy/active or (caller,target) not in seen,\n  and\
      \ follow-on = identity/network/persistence change (not recovery cmds);\noutput caller, target, health_state,\
      \ follow_on_actions."
- question: Were there repeated failed or denied serial-console connection attempts, or failed guest logons
    during a console session, before a successful console session?
  context: Profile failed/denied serial-console connection attempts and failed guest logons during a console
    session as a distinct state signal. Repeated denied attempts or failed authentications before a successful
    console session indicate brute-force or permission probing. A positive result is a cluster of failures
    preceding a successful session; a negative result is an isolated mistyped credential. For Execution,
    this captures the access struggle that precedes out-of-band code execution and helps separate determined
    adversaries from routine operators.
  answer_sources:
  - Boot Diagnostics logs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AzureActivity
  - 'NAI: Virtual machines with boot diagnostics enabled, sensitive systems that seldom require break-glass
    console access, and operator accounts capable of serial-console use'
  range: Last 90 days, with short sliding window for failure clustering.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "fails = serial-console connection attempts where status in ['Failed','Denied']\n  + failed\
      \ guest logons during console session;\nbursts = count(fails) by caller/target over 10m where count>=3;\n\
      success = subsequent successful console session;\nalert join bursts,success; output caller, target,\
      \ fail_count, then_success."
- question: Is serial-console use occurring on systems or by users where console access is historically
    absent or extremely rare (per-identity first-seen or fewer than one event in 90 days)?
  context: Track serial-console use frequency by identity, target host, and business unit against a long
    trailing baseline. Flag any use on systems or by users where console access is historically absent
    or extremely rare (per-identity first-seen or fewer than one event in 90 days), using MAD-based scoring
    so the rare-event baseline is not dominated by a few legitimate break-glass operators. Console access
    is inherently uncommon, so its appearance where it has effectively never occurred is a strong anomaly.
    A positive result is console use by a rare or never-seen identity/host; a negative result is use by
    an established break-glass operator. For Execution, rarity is a high-signal indicator of out-of-band
    code execution abuse.
  answer_sources:
  - Boot Diagnostics logs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Syslog
  - AzureActivity
  - 'NAI: Virtual machines with boot diagnostics enabled, sensitive systems that seldom require break-glass
    console access, and operator accounts capable of serial-console use'
  range: Last 90 days (long trailing baseline for rarity).
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = serial-console counts by (identity,host,business_unit) over 90d;

      alert when use where baseline_count<1 or identity first-seen;

      mad_score so a few legit operators do not mask rare abuse;

      output identity, host, historical_count.'
- question: Do serial-console sessions occur off-hours or with no open incident, and does their command
