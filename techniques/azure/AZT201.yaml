name: 'AZT201: Valid Credentials'
id: 3436555c-cfbc-4f4d-8964-6e12f242f973
description: 'Investigate whether an adversary has gained initial access to Azure / Entra ID by authenticating
  with valid user or service-principal credentials and then assuming the privileges of that identity.
  This playbook helps an analyst hunt for successful interactive and non-interactive user sign-ins from
  rare source IPs, ASNs, countries, devices, or legacy/basic-auth clients that are followed by tenant,
  subscription, Graph, portal, CLI, or PowerShell activity inconsistent with the user''s normal pattern,
  including impossible-travel, leaked-credential, password-spray-to-success, and risky first-session pivot
  patterns. It also covers compromised service-principal and workload-identity abuse: secret/certificate
  sign-ins from unfamiliar infrastructure, tenants, user agents, or clouds, dormant-principal reactivation,
  anomalous token lifetime/issuer state, and downstream management or data operations that suggest unauthorized
  foothold establishment. Detection approaches span deterministic symbolic-logic rules, statistical baselining
  and change-point detection, and machine-learning session/graph models so an analyst can triage with
  explainable, feature-attributed evidence.'
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there successful Azure / Entra ID user sign-ins originating from previously unseen IP
    addresses, ASNs, countries, devices, or legacy/basic-auth client applications that are immediately
    followed by portal, Microsoft Graph, Azure CLI, or PowerShell activity the user has not historically
    performed?
  context: This is the deterministic first pass for credential-based initial access. The analyst normalizes
    successful user sign-ins and compares each session's source IP, ASN, country, device state, and client
    app against the user's prior history; a first-seen combination that is immediately followed by management-plane
    or data-plane activity the user never normally performs is a strong foothold signal. Layer the deterministic
    Entra ID Protection risk signals (anonymous/Tor IP, malicious IP, unfamiliar sign-in properties, atypical/impossible
    travel) so the rule fires even when each attribute alone looks plausible. A positive result means
    a likely compromised credential was used to enter the tenant; a negative result helps establish a
    clean baseline for the user. This maps directly to Initial Access via Valid Credentials.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days, prioritizing successful sign-ins in the last 24 hours with a 90-day first-seen
    baseline.
  queries:
  - technology: SIEM/Rule pseudocode
    query: auth = successful_user_signins(); enrich source_ip WITH asn, geo, entra_risk_signals(anon_tor,
      malicious_ip, unfamiliar_props, atypical_travel); FLAG where (source_ip OR asn OR country OR device
      OR client_app) first_seen_for user in 90d AND followed_within 60m BY portal|graph|az_cli|powershell
      activity NOT in user_baseline; OUTPUT user, source_ip, asn, country, client_app, first_action.
- question: Do any two successive successful sign-ins for the same user imply a physically impossible
    travel velocity between their geolocated source IPs?
  context: For each pair of successive successful sign-ins the analyst geolocates the source IPs and computes
    the implied travel speed; a required velocity exceeding a feasibility threshold (e.g., >900 km/h,
    or >1000 km within 60 minutes) indicates the same credential is being used from two locations at once.
    Known VPN/proxy egress points and corporate ranges must be suppressed first to control false positives
    from legitimate tunneling. A confirmed impossible-travel pair strongly suggests credential sharing
    or theft enabling initial access. Tie the second, anomalous location to subsequent tenant activity
    to confirm intent.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days, evaluating consecutive sign-in pairs per user.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each consecutive pair of successful_signins per user: geo1,geo2 = geolocate(ip1,ip2);
      speed = distance(geo1,geo2)/time_delta; FLAG when speed>900kmh OR (distance>1000km AND time_delta<60m)
      AND ip1,ip2 NOT IN vpn_proxy_corp_ranges; OUTPUT user, ip1, ip2, distance, time_delta, implied_speed.'
- question: Has any account whose credential matches a known breach corpus (Entra 'leaked credentials'
    risk) completed a successful interactive sign-in?
  context: Entra ID Protection's leaked-credentials risk, grounded in privacy-preserving breach alerting,
    flags accounts whose password appears in a known breach corpus. A successful interactive sign-in by
    such an account is a high-confidence compromise indicator and should trigger forced re-authentication
    or account disablement. The analyst confirms the sign-in succeeded (not merely flagged), checks the
    source against the user's baseline, and scopes any post-auth activity. A positive result warrants
    immediate containment; this is one of the strongest deterministic foothold signals for Valid Credentials.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days, with immediate review of current leaked-credential risk events.
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN entra_leaked_credential_risk TO successful_interactive_signins ON user; ALERT for every
      match; ACTION force_reauth_or_disable; OUTPUT user, source_ip, risk_detection_id, signin_time, post_auth_actions.
- question: After a successful user sign-in, does the session immediately perform enumeration, role lookups,
    subscription browsing, mailbox access, consent grants, or a credential switch that materially differs
    from the user's normal first actions?
  context: 'Using causal login-path construction, the analyst correlates a successful sign-in with the
    very first actions taken in the session and looks for a credential-switch-plus-atypical-target pattern:
    immediate directory/role enumeration, subscription browsing, mailbox access, OAuth consent grants,
    or a pivot to a different identity. Legitimate users tend to repeat familiar first actions; an attacker
    who just established a foothold usually orients themselves and escalates. Requiring both a credential
    switch and an atypical target before alerting controls false positives. A positive result indicates
    active exploitation of newly obtained valid credentials.'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days, with a 30-minute post-sign-in first-action window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN successful_signin TO first_session_actions within 30m; FLAG when actions IN [dir_enum,
      role_lookup, subscription_browse, mailbox_access, consent_grant, credential_switch] AND target NOT
      IN user_baseline_first_actions AND credential_switch=true; OUTPUT user, source_ip, action_sequence,
      switched_identity.
- question: Is any successful sign-in immediately preceded by a burst of failed authentication attempts
    (password spray or credential stuffing) from the same source or across many accounts?
  context: Failed-logon volume is profiled as a distinct state signal. The analyst alerts when a successful
    sign-in is immediately preceded by a burst of failures (e.g., >=10 AADSTS50126/50053 failures within
    10 minutes from the same IP, or one failure across many accounts indicating spray). The success that
    follows a spray/stuffing burst is the actual foothold. The analyst preserves the targeted account
    list and source so the same infrastructure can be tracked across campaigns. A positive result confirms
    a brute-force/spray attack that succeeded and demands credential reset and session revocation.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days, with 10-minute failure-burst windows correlated to subsequent success.
  queries:
  - technology: SIEM/Rule pseudocode
    query: GROUP failed_signins BY source_ip,10m => fail_count, distinct_users; FLAG (fail_count>=10 AADSTS[50126,50053]
      same user) OR (distinct_users>=10 spray); JOIN to successful_signin within 10m from same source
      OR same user; OUTPUT source_ip, users, fail_count, success_user, success_time.
- question: Does any sign-in session score above the user's trailing-30-day novelty/risk baseline when
    combining geography, ASN, device state, client app, hour-of-day, authentication method, and post-login
    service mix?
  context: The analyst builds per-user baselines across multiple sign-in dimensions and flags sessions
    whose combined novelty/risk score exceeds the user's trailing-30-day 95th percentile. First-seen (user
    -> IP/ASN) and (user -> resource) pairs are scored with Bayesian new-edge probability rather than
    a hard rule to control benign-travel false positives. This statistical view catches credential abuse
    where no single attribute is forbidden but the overall session is atypical. A high composite score,
    especially with first-seen resource edges, suggests initial access with stolen credentials.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days, with rolling 30-day per-user baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline user over 30d for [geo, asn, device_state, client_app, hour_of_day, auth_method, post_login_service_mix];
      score session novelty + bayesian_new_edge_prob(user->ip/asn, user->resource); ALERT when composite_score>user_p95;
      OUTPUT score, contributing_dimensions, first_seen_edges.
- question: In the first hour after a sign-in, does the volume and frequency of Graph/ARM API calls, bytes
    returned, and distinct resources, tenants, or subscriptions touched show a regime shift from the user's
    baseline?
  context: The analyst measures Volume (Graph/ARM API calls, bytes returned, distinct resources) and Frequency
    (calls/min) of services, tenants, subscriptions, and high-value apps touched in the first hour after
    sign-in, then applies change-point detection (CUSUM/PELT/Bayesian online CPD) to per-user activity-volume
    and failed/success-ratio series. A detected regime shift where a benign baseline abruptly breaks indicates
    the credential is now being driven differently than the legitimate user drives it. This catches discovery
    and collection bursts that follow a foothold. A positive result indicates active hands-on-keyboard
    or scripted abuse after initial access.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days, with a 60-minute post-sign-in measurement window and per-user baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each session: measure first_60m [graph_arm_calls, bytes_returned, distinct_resources,
      distinct_subscriptions, calls_per_min, fail_success_ratio]; run change_point_detection(CUSUM|PELT|BOCPD)
      on per-user series; ALERT on regime shift above baseline; OUTPUT user, metric, changepoint_time,
      magnitude.'
- question: Does a machine-learning session classifier distinguish a given sign-in as initial access with
    stolen credentials rather than legitimate travel, based on sign-in risk, device/location novelty,
    first-time service usage, token type/lifetime, and immediate post-auth actions?
  context: The analyst trains (or applies) a session classifier on sign-in risk signals, device/location
    novelty, first-time service usage, token type/lifetime, and immediate post-authentication actions
    to separate legitimate travel from stolen-credential initial access. The model emits the top-3 contributing
    features (e.g., first-seen ASN, anomalous token lifetime, rare resource edge) so triage is explainable.
    Analysts should rely on the feature attributions, not the raw score alone, before forcing credential
    resets. A high-confidence positive with strong attributions warrants containment.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days for training features, with live scoring of new successful sign-ins.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[signin_risk, device_novelty, location_novelty, first_time_service, token_type, token_lifetime,
      post_auth_actions]; score=compromised_cred_model.predict_proba(features); ALERT when score>=0.85;
      OUTPUT top_shap_3, user, source_ip, token_lifetime.
- question: When sign-ins and post-auth events are modeled as an authentication/access graph (identity
    -> source-IP/ASN -> resource), do any low-probability or first-seen edges appear that a temporal link-prediction
    or sequence model ranks as anomalous?
  context: The analyst builds an authentication/access graph linking identity to source-IP/ASN to resource
    and ranks low-probability edges using temporal link prediction (GNN+RNN) or self-supervised sequence
    models over the ordered post-sign-in event chain. Thresholds should be validated on labeled authentication
    telemetry (e.g., LANL) before applying to Entra logs. This surfaces a compromised identity reaching
    infrastructure or resources it never legitimately touched. A highly improbable new edge, especially
    one chained into sensitive resources, indicates initial access followed by reconnaissance or collection.
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - AzureActivity
  - OfficeActivity
  - MicrosoftGraphActivityLogs
  - 'NAI: External sign-in paths to Entra, identities with access to Azure subscriptions or sensitive
    M365 data, and newly observed devices or locations for privileged and high-value users'
  range: Last 90 days for graph construction and scoring.
  queries:
  - technology: ML pipeline pseudocode
    query: G=build_auth_graph(identity->source_ip/asn->resource over 90d); score edges WITH temporal_link_prediction(GNN+RNN)
      OR sequence_model(post_signin_chain); ALERT on edges below probability_threshold OR first_seen;
      OUTPUT identity, anomalous_edge, edge_probability, event_chain.
- question: Are there successful service-principal sign-ins from unusual IP ranges, tenants, user agents,
    or clouds, especially where the principal has not authenticated recently or immediately performs role,
    compute, storage, or secret-related operations?
  context: Service principals authenticate from predictable deployment/automation infrastructure. The
    analyst detects successful SP sign-ins from unusual IP ranges, tenants, user agents, or clouds and
    prioritizes cases where the principal was recently dormant or immediately performs role, compute,
    storage, or secret operations. Layering Entra workload-identity risk detections (suspicious sign-in
    patterns, leaked credentials, anomalous SP activity) names the contributing signals for explainable
    triage. A positive result indicates a compromised secret/certificate being used for foothold via a
    non-human identity, which often bypasses MFA and user-focused controls.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - AzureActivity
  - MicrosoftGraphActivityLogs
  - Proxy logs
  - 'NAI: Service principals with subscription or tenant privileges, automation identities holding secrets
    or certificates, and sign-in paths that originate outside normal deployment or automation infrastructure'
  range: Last 90 days, prioritizing recent SP sign-ins with a 90-day baseline.
  queries:
  - technology: SIEM/Rule pseudocode
    query: sp=successful_sp_signins(); enrich source_ip WITH asn, cloud, entra_workload_identity_risk;
      FLAG where (ip_range OR tenant OR user_agent OR cloud) first_seen_for sp in 90d OR sp_dormant; AND
      followed_by [role|compute|storage|secret] ops; OUTPUT sp_id, source_ip, user_agent, cloud, first_action.
- question: Has a long-dormant service principal suddenly authenticated and then quickly accessed subscriptions,
    key vaults, storage, or Graph endpoints outside its normal automation workflow?
  context: The analyst alerts when a service principal that has been dormant for an extended period authenticates
    and then rapidly reaches subscriptions, key vaults, storage, or Graph endpoints outside its normal
    automation pattern. The credential-switch-plus-atypical-target reactivation is treated as the causal
    foothold pattern. Dormant SPs are attractive to attackers because their credentials may have leaked
    long ago and their reactivation rarely draws attention. A positive result strongly suggests an adversary
    is exploiting a stale workload identity for initial access.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - AzureActivity
  - MicrosoftGraphActivityLogs
  - Proxy logs
  - 'NAI: Service principals with subscription or tenant privileges, automation identities holding secrets
    or certificates, and sign-in paths that originate outside normal deployment or automation infrastructure'
  range: Last 90 days, with dormancy measured over the prior 90+ days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each sp: days_since_last_signin = now - last_signin; FLAG when days_since_last_signin>=30
      AND new_signin THEN accesses [subscription|key_vault|storage|graph] NOT IN sp_baseline within 1h;
      OUTPUT sp_id, dormancy_days, source_ip, accessed_resources.'
- question: Are any service-principal tokens showing unusual lifetime, replay from an unfamiliar IP/location,
    or token-issuer anomalies, and are failed token-acquisition errors (AADSTS7000215/700016) preceding
    a successful acquisition?
  context: The analyst flags SP tokens with unusual lifetime, replay from an unfamiliar IP/location, or
    token-issuer anomalies, and profiles failed token-acquisition errors (AADSTS7000215 invalid client
    secret, AADSTS700016 application not found) as a distinct state signal preceding a successful acquisition.
    A burst of failed secret/cert attempts followed by success can indicate an attacker testing leaked
    or guessed credentials. Token-issuer or lifetime anomalies can indicate replay or forgery. A positive
    result indicates likely workload-identity compromise enabling a foothold.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - AzureActivity
  - MicrosoftGraphActivityLogs
  - Proxy logs
  - 'NAI: Service principals with subscription or tenant privileges, automation identities holding secrets
    or certificates, and sign-in paths that originate outside normal deployment or automation infrastructure'
  range: Last 90 days, correlating failed and successful token acquisitions.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FLAG sp_tokens WHERE token_lifetime != typical OR replayed_from unfamiliar_ip OR issuer_anomaly;
      GROUP failed_token_acq BY sp,error[AADSTS7000215,700016],10m; ALERT when failures followed_by successful_acquisition;
      OUTPUT sp_id, error_codes, source_ip, token_lifetime, success_time.
- question: Does any service principal deviate materially from its baseline source IPs/ASNs, sign-in intervals,
    token-acquisition cadence, and downstream API families, or reactivate after long dormancy with high-impact
    actions?
  context: The analyst baselines each service principal's normal source IPs/ASNs, sign-in intervals, token-acquisition
    cadence, and downstream API families, then applies change-point detection to interval and request-volume
    series and Bayesian new-edge scoring to first-seen (principal -> IP/ASN) and (principal -> resource)
    pairs. Material deviation, or reactivation after long dormancy paired with high-impact actions, is
    flagged. Automation is normally highly regular, so a statistical break is meaningful. A positive result
    indicates the workload identity is being driven abnormally, consistent with compromise.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - AzureActivity
  - MicrosoftGraphActivityLogs
  - Proxy logs
  - 'NAI: Service principals with subscription or tenant privileges, automation identities holding secrets
    or certificates, and sign-in paths that originate outside normal deployment or automation infrastructure'
  range: Last 90 days, with per-principal baselines and change-point monitoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline sp for [source_ips, asns, signin_intervals, token_cadence, api_families]; run change_point_detection
      on interval+volume series; score bayesian_new_edge(sp->ip/asn, sp->resource); ALERT on material
      deviation OR dormancy_reactivation + high_impact_action; OUTPUT sp_id, broken_metric, changepoint_time,
      new_edges.
- question: When post-authentication service-principal actions are weighted by privilege and resource
    sensitivity, does any session show a Volume, Frequency, or success/AccessDenied-ratio profile that
    sharply diverges toward privileged management/data access or enumeration?
  context: The analyst weights post-auth actions by privilege and resource sensitivity, measures Volume
    (API calls, bytes), Frequency (calls/min), and State (success vs AccessDenied/403 ratio), then compares
    each session to the principal's historical automation profile via peer-group and per-entity baselines.
    Sessions whose action mix sharply diverges toward privileged management/data access, or whose AccessDenied
    rate spikes (indicating discovery/enumeration), are escalated. A positive result indicates a compromised
    SP probing for or exercising privileges beyond its legitimate automation scope.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - AzureActivity
  - MicrosoftGraphActivityLogs
  - Proxy logs
  - 'NAI: Service principals with subscription or tenant privileges, automation identities holding secrets
    or certificates, and sign-in paths that originate outside normal deployment or automation infrastructure'
  range: Last 90 days, comparing each session to the principal's historical profile.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each sp_session: weight actions BY privilege+resource_sensitivity; measure [api_calls,
      bytes, calls_per_min, success_vs_403_ratio]; compare to per_entity + peer_group baseline; ALERT
      when action_mix shifts to privileged_mgmt/data OR access_denied_ratio spikes; OUTPUT sp_id, weighted_score,
      denied_ratio, top_resources.'
- question: Does a machine-learning model distinguish benign service-principal automation from adversary
    misuse based on source novelty, authentication cadence, action rarity, privilege level, failure/AccessDenied
    ratio, and linkage to recent consent, credential, or ownership changes?
  context: The analyst models benign automation versus adversary misuse from SP sign-in and activity telemetry.
    Features include source novelty, authentication cadence, action rarity, privilege level, failure/AccessDenied
    ratio, and linkage to recent consent, credential, or ownership changes; the top-3 contributing features
    are surfaced in the alert. Linkage to a recent credential addition or consent grant is especially
    telling, as attackers often add a secret then immediately use it. A high-confidence positive with
    strong attributions indicates a compromised or rogue workload identity establishing a foothold.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - AzureActivity
  - MicrosoftGraphActivityLogs
  - Proxy logs
  - 'NAI: Service principals with subscription or tenant privileges, automation identities holding secrets
    or certificates, and sign-in paths that originate outside normal deployment or automation infrastructure'
  range: Last 90 days for training features, with live scoring of SP sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[source_novelty, auth_cadence, action_rarity, privilege_level, fail_403_ratio, recent_consent_or_cred_or_owner_change];
      score=sp_misuse_model.predict_proba(features); ALERT when score>=0.85; OUTPUT top_shap_3, sp_id,
      linked_change.
- question: When service-principal activity is modeled as an access graph of (service principal -> resource/subscription/secret)
    edges, do any low-probability or first-seen edges appear that temporal link prediction ranks as anomalous?
  context: The analyst constructs an access graph of (service principal -> resource/subscription/secret)
    edges and ranks low-probability or first-seen edges with scalable temporal link prediction (GNN+RNN),
    validating on labeled authentication telemetry before deployment. This surfaces a compromised SP reaching
    resources, subscriptions, or secrets it never legitimately touched. Because SP access patterns are
    normally stable and narrow, a highly improbable new edge into sensitive resources is a strong indicator
    of workload-identity compromise enabling initial access and follow-on collection.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - AzureActivity
  - MicrosoftGraphActivityLogs
  - Proxy logs
  - 'NAI: Service principals with subscription or tenant privileges, automation identities holding secrets
    or certificates, and sign-in paths that originate outside normal deployment or automation infrastructure'
  range: Last 90 days for graph construction and scoring.
  queries:
  - technology: ML pipeline pseudocode
    query: G=build_access_graph(sp->resource/subscription/secret over 90d); score edges WITH temporal_link_prediction(GNN+RNN);
      ALERT on edges below probability_threshold OR first_seen into sensitive resources; OUTPUT sp_id,
      anomalous_edge, edge_probability.
