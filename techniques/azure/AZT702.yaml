name: 'AZT702: File Share Mounting'
id: 55f641e7-9285-40e7-8d75-b33c61610d40
description: Investigate adversary mounting and access of Azure file shares as a precursor to unauthorized
  data theft or destructive impact against stored content. This playbook helps an analyst determine whether
  an Azure file share was mounted or accessed from an unusual client following control-plane precursors
  such as storage key listing, SAS generation, or loosening of NSG/firewall rules. It correlates Azure
  control-plane activity with first-party data-plane file telemetry to surface direct SMB or NFS access
  outside normal workflows. Coverage includes precursor-to-mount correlation, overly permissive or external
  SAS use, mount-then-destructive-action chains, per-share client and access baselining, first-seen client-to-share
  edges, throughput forecasting, failure-mode profiling, session sequence likelihood, unsupervised session
  anomaly scoring, rare-by-population client classification, and per-identity behavioral anomaly detection
  so analysts can distinguish benign administration from staging and impact.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a control-plane precursor in AzureActivity (storage account key listing via Microsoft.Storage/storageAccounts/listKeys/action,
    SAS token generation, or a loosening of NSG/firewall rules) precede StorageFileLogs CreateFile or
    mount activity from a new client IP, unapproved subnet, or non-private-endpoint path within a short
    window?
  context: This question targets the Impact tactic by catching the moment an adversary converts stolen
    storage credentials or relaxed network controls into actual file-share access used to stage theft
    or destruction. The analyst correlates a control-plane action (key listing, SAS creation, or network-rule
    change) with data-plane file operations that follow within roughly 60 minutes from an IP, subnet,
    or path that is not the expected private endpoint. A positive result is a tight precursor-to-mount
    sequence from novel infrastructure, which strongly suggests credential abuse rather than routine workflow;
    a negative result is mount activity that matches established clients and approved paths with no suspicious
    precursor. Codify the precursors with SigmaHQ Azure activity rules (azure_rare_operations.yml, azure_network_security_modified_or_deleted.yml)
    and Elastic Azure rules, and pull data-plane fields (operation, client IP, protocol, auth type, status)
    from Azure Files monitoring.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days, correlating control-plane precursors with data-plane mounts in a <=60 minute window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN AzureActivity precursor (operation IN [Microsoft.Storage/storageAccounts/listKeys/action,
      SAS_generation, NSG_or_firewall_loosen]) TO StorageFileLogs (operation IN [CreateFile, mount]) ON
      storage_account, time_window<=60m; FLAG when data-plane client_ip is new OR subnet NOT IN approved
      OR path != private_endpoint; OUTPUT actor, precursor_op, client_ip, protocol, auth_type, status.
- question: Is any file-share access authenticated by an account or service SAS that is used from an external
    public IP, carries broad signed permissions (read/write/delete/list), has an expiry beyond policy
    (for example >7 days), lacks a source-IP restriction, or originates from a Tor exit node or known-suspicious
    application?
  context: Under the Impact tactic, an over-scoped or externally used SAS is a common way for an adversary
    to obtain durable, unattributed access to a file share for exfiltration or destruction. The analyst
    inspects SAS scope, permission set, expiry, and source-IP binding (derived from the SAS overview fields)
    plus the network origin of the authenticated access. A positive result is an account/service SAS used
    from a public or anonymizing IP with broad permissions or excessive lifetime and no IP lock, mirroring
    the Defender for Storage alert Storage.Files_AccountSas.InternalSasUsedExternally; a negative result
    is SAS use from approved internal ranges with tightly scoped permissions and short expiry. This directly
    maps to Defender for Storage SAS abuse and suspicious-application alerts.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days, prioritizing authenticated SAS file-share access from external or anonymizing sources.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FILTER StorageFileLogs WHERE auth_type='SAS' AND (source_ip external OR source_ip IN tor_exit_list
      OR app IN suspicious_apps); ALERT when signed_permissions CONTAINS any of [r,w,d,l] broadly OR sas_expiry
      > 7d OR sip_restriction is null; OUTPUT account, share, source_ip, signed_permissions, sas_expiry,
      app.
- question: After a first-seen client mounts a share, is there rapid directory enumeration (ListFilesAndDirectories
    bursts), large copy/read bursts, mass rename, or a sustained spike in DeleteFile operations above
    the account's recent baseline?
  context: This question addresses the destructive end of the Impact tactic, where an adversary who has
    mounted a share follows up with enumeration, bulk theft, or mass deletion. The analyst correlates
    a first-seen client mount with the subsequent operation mix in StorageFileLogs and watches for a delete
    spike relative to the account baseline (mapping to Defender for Storage unusual-deletion detection).
    A positive result is a new client that mounts and then rapidly enumerates and deletes or copies large
    volumes, exceeding a deterministic floor (for example >N deletes/min or >M files read/session); a
    negative result is modest, scoped activity consistent with troubleshooting. Keeping a hard floor alongside
    the baseline comparison reduces false negatives while distinguishing benign administration from staging
    or impact.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days, with mount-to-action correlation over the minutes-to-hours following a first-seen
    mount.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN first_seen_mount TO subsequent StorageFileLogs ops per client/session; COMPUTE list_ops,
      read_bytes, rename_count, delete_count vs account_baseline; ALERT when delete_count > baseline_spike
      OR deletes>N/min OR files_read>M/session OR large copy/read burst; OUTPUT client_ip, share, op_mix,
      counts, baseline.
- question: For each file share, do the accessing clients, subnets, identities, operation volumes, protocols,
    or access hours deviate robustly from the established per-share baseline (for example a modified Z-score
    above 3.5, a first-seen mount source, or access outside approved maintenance windows)?
  context: This statistical question supports the Impact tactic by establishing what normal access looks
    like per share so that adversary mounts stand out. The analyst baselines clients, subnets, identities,
    volumes, protocols, and hours per share and uses median-absolute-deviation / modified Z-score so that
    batch jobs do not distort thresholds. A positive result is a first-seen mount source, a robust spike
    (modified Z > 3.5) in enumeration or copy volume, or access outside approved windows; a negative result
    is activity within the normal envelope. The alert should surface the specific deviating feature and
    its baseline so the analyst can immediately judge whether the deviation reflects new legitimate workload
    or adversary access.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days, with per-share rolling baselines and modified Z-score scoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE per share for {clients, subnets, identities, op_volume, protocol, hour}; COMPUTE modified_z
      = 0.6745*(x-median)/MAD; FLAG when modified_z>3.5 OR mount_source first_seen OR access outside maintenance_window;
      OUTPUT share, deviating_feature, value, baseline_median, modified_z.
- question: Has a client, subnet, or identity formed a file-share connection (or an identity performed
    a listKeys/SAS action) to a storage account that was never observed in the lookback window, after
    controlling for entities that legitimately create new edges?
  context: This question applies first-seen and new-edge logic to the Impact tactic, surfacing the very
    first time a given client/subnet-to-share or identity-to-action relationship appears. The analyst
    uses first-seen-per-principal logic (as in the Netflix CloudTrail anomaly detector) and Bayesian new-edge
    scoring (Metelli and Heard) to score connections and control-plane actions never seen before, while
    accounting for principals that routinely form new edges. A positive result is a brand-new client/subnet
    reaching a sensitive share or an identity invoking listKeys/SAS for the first time; a negative result
    is an edge consistent with prior history. New edges to business-critical shares are high-value leads
    for credential abuse and staging.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days as the lookback window for first-seen edge determination.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each (client_or_subnet -> storage_account.share) edge AND (identity -> listKeys/SAS) action:
      CHECK against 90d observed_edges; SCORE new edges with bayesian_new_edge_probability; ALERT when
      edge first_seen AND principal not in habitual_new_edge_set; OUTPUT principal, edge, first_seen_time,
      score.'
- question: Does observed per-share read throughput (bytes) or file-operation count exceed the predicted
    band from a time-series forecast, indicating an anomalous surge consistent with data exfiltration?
  context: This forecasting question targets the exfiltration aspect of the Impact tactic by modeling
    expected per-share activity and alerting on excess. The analyst forecasts read throughput and file-operation
    counts with time-series models (for example Prophet with causal feature selection) and compares observed
    activity to the predicted band, mapping to Defender for Storage Storage.Files_DataExfiltration.AmountOfDataAnomaly
    and NumberOfFilesAnomaly. A positive result is observed activity that materially exceeds the forecast
    upper bound; a negative result is activity within the expected band. Reporting the forecast-versus-observed
    gap in the alert lets the analyst quantify how anomalous the surge is and prioritize accordingly.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days for model fitting, scoring current per-share activity against the forecast band.
  queries:
  - technology: SIEM/Stats pseudocode
    query: FIT time_series_forecast(per_share read_bytes, file_op_count) over history; PREDICT band [lower,upper];
      ALERT when observed > upper_band; OUTPUT share, observed, predicted, gap, metric.
- question: Is there a burst of failed mounts or authentication errors (AuthenticationFailed/403, ShareNotFound,
    blocked-by-network-rule, NFS/SMB mount errors, or NSG-denied connections) from a single client, especially
    one that precedes a successful mount?
  context: This question profiles failure signals to catch reconnaissance and key/SAS brute force under
    the Impact tactic. The analyst treats AuthenticationFailed/403, ShareNotFound, network-rule blocks,
    and mount errors in StorageFileLogs plus denied connections in NSG Flow Logs as distinct per-client
    and per-share features, then baselines normal error rates. A positive result is a burst of failed
    mounts or auth errors from one client that is then followed by a successful mount, indicating credential
    guessing or probing that eventually succeeded; a negative result is sporadic errors within the normal
    envelope. Failure-mode bursts immediately before success are a strong early indicator that warrants
    rapid containment.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days, with error-rate baselines per client and share and burst correlation to subsequent
    success.
  queries:
  - technology: SIEM/Stats pseudocode
    query: AGGREGATE per client,share => {auth_failed_403, share_not_found, network_blocked, mount_errors
      (StorageFileLogs), nsg_denied}; BASELINE normal error_rate; ALERT when failure_burst > baseline_robust_dev
      AND followed_by successful_mount within window; OUTPUT client, failure_types, counts, success_time.
- question: Does a principal's ordered file-share session (mount -> enumerate -> bulk-read/copy -> delete)
    follow a low-probability transition sequence compared with learned multi-order Markov transition probabilities?
  context: This question models the shape of file-share sessions to detect staging-and-impact chains under
    the Impact tactic that no single threshold would catch. The analyst builds multi-order Markov transition
    probabilities over the ordered session states (mount, enumerate, bulk-read/copy, delete) and flags
    sequences whose transitions are improbable for that principal. A positive result is a session whose
    progression (for example mount immediately into mass delete or bulk copy) is far less likely than
    the principal's historical behavior; a negative result is a session that matches typical patterns.
    Reviewing the triggering low-probability transition tells the analyst exactly which step in the session
    looked anomalous.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days for training transition probabilities, scoring current sessions.
  queries:
  - technology: SIEM/Stats pseudocode
    query: BUILD multi_order_markov over session_states [mount,enumerate,bulk_read_copy,delete] per principal;
      SCORE current_session transition_likelihood; ALERT when sequence_probability < learned_low_threshold;
      OUTPUT principal, session_path, triggering_transition, probability.
- question: Does an unsupervised model score any file-share session as a strong anomaly based on bytes
    read, file/operation counts, operation mix, source-network novelty, SAS-versus-key authentication,
    and protocol?
  context: This machine-learning question provides composite anomaly detection for the Impact tactic,
    combining many weak session-level signals into one score. The analyst scores file-share sessions with
    an unsupervised model such as Isolation Forest over features including bytes read, file/operation
    counts, operation mix, source-network novelty, SAS-vs-key auth, and protocol. A positive result is
    a session that the model isolates as anomalous, with the top-3 contributing features (for example
    new subnet, 50x read volume, external SAS) emitted in the alert text for triage; a negative result
    is a session well within the normal distribution. The feature attributions let the analyst decide
    quickly whether the anomaly reflects new legitimate workload or adversary access.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days for model training, scoring current file-share sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [bytes_read, file_op_count, op_mix, source_network_novelty, sas_vs_key, protocol];
      score = isolation_forest.score(features); ALERT when anomaly_score high; OUTPUT session_id, score,
      top_3_contributing_features.
- question: Across the storage account, are there clients, identities, or operations in StorageFileLogs
    and AzureActivity that are statistical outliers relative to the overall population?
  context: This question uses population-level rarity analysis to find Impact-tactic outliers that only
    stand out when compared across the whole account. The analyst runs rare-function / population-analysis
    unsupervised jobs over StorageFileLogs and AzureActivity to flag clients, identities, and operations
    that are rare across the account. A positive result is a client, identity, or operation that is an
    extreme outlier versus its peers, with the rare attributes that triggered the score listed for triage;
    a negative result is activity that is common across the population. Population rarity is especially
    useful for catching a single adversary-controlled client or seldom-used operation hiding among many
    normal ones.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days of account-wide activity for population baselining.
  queries:
  - technology: ML pipeline pseudocode
    query: POPULATION_ANALYSIS over StorageFileLogs+AzureActivity for {client, identity, operation}; SCORE
      rarity vs account population; ALERT on statistical outliers; OUTPUT entity, rarity_score, rare_attributes.
- question: Does the identity that retrieved storage keys/SAS or mounted the share show behavioral anomalies
    such as impossible travel, an unusual location or IP, or an unusual download volume?
  context: This question applies per-identity behavioral profiling to the Impact tactic, focusing on the
    principal behind the key retrieval, SAS generation, or share mount. The analyst evaluates impossible
    travel, unusual location/IP, and unusual download volume (as in Defender for Cloud Apps anomaly policies),
    with production per-account learned baselines exemplified by Defender for Storage Storage.Files_GeoAnomaly
    and Storage.Files_DataExfiltration.*. A positive result is an identity whose access pattern is geographically
    or volumetrically inconsistent with its learned baseline, with the contributing factors surfaced in
    the alert; a negative result is behavior consistent with the identity's history. Tying the data-plane
    access back to anomalous identity behavior helps confirm account compromise versus legitimate use.
  answer_sources:
  - AzureActivity
  - StorageFileLogs
  - Entra Sign-in Logs
  - NSG Flow Logs
  - 'NAI: Azure Storage file shares holding business-critical data, bastion and admin hosts, and network
    boundaries around storage private endpoints'
  range: Last 90 days for per-identity baselines, scoring current key/SAS retrieval and mount activity.
  queries:
  - technology: ML pipeline pseudocode
    query: PROFILE identity that performed [listKeys, SAS_gen, mount]; EVALUATE impossible_travel, location/ip_novelty,
      download_volume vs learned_baseline; ALERT on behavioral anomaly; OUTPUT identity, anomaly_type,
      contributing_factors.
