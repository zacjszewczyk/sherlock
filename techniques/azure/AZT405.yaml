name: 'AZT405: Azure AD Application'
id: 688d6013-3f7a-4966-aecc-745c87a34bbd
description: 'Investigate whether an adversary has escalated privileges in Azure/Entra ID by abusing an
  Azure AD application, its assigned app roles, its consented API permissions, or its ownership and credential
  relationships in order to impersonate a more privileged principal. This playbook helps an analyst answer
  three connected investigative threads: (1) a compromised user, group member, or service principal abusing
  an application''s app role so the service principal begins making privileged directory, messaging, vault,
  or resource-management requests beyond the actor''s prior authority; (2) a service principal tied to
  an application with privileged API permissions issuing high-impact Graph or Azure Resource Manager requests
  that let the adversary act as a more powerful principal; and (3) an application owner adding or rotating
  credentials on an application registration, with the newly valid service principal identity then authenticating
  from new infrastructure and exercising privileged permissions. It covers symbolic-logic detections (first-time
  and novel-context privileged operations, endpoint chaining, credential-add-then-use correlation, and
  actor-vs-target privilege comparison), statistical baselines (first-seen operations/API families, volume
  and frequency outliers via modified Z-score/MAD, and authorization-failure state profiling), and machine
  learning sequence/graph models that rank sessions resembling privilege escalation while surfacing the
  top contributing features.'
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is a service principal whose application exposes a sensitive app role (for example Directory.ReadWrite.All,
    RoleManagement.ReadWrite.Directory, Application.ReadWrite.All, or full Key Vault/Exchange access)
    signing in and then issuing directory-wide, role-management, Key Vault, Exchange, or subscription
    authorization requests for the first time, or from a new source IP, ASN, or user-agent?
  context: This question targets privileged app role impersonation under Privilege Escalation. The analyst
    inventories which applications expose high-value app roles and which principals are assigned to them,
    then watches for the moment a corresponding service principal begins exercising that role against
    a privileged control plane (Microsoft Graph, Azure Resource Manager, Key Vault, or Exchange). A first-time
    directory-wide, role-management, vault, or subscription authorization call, or one from infrastructure
    outside the application's normal profile, is concrete evidence that a compromised identity is impersonating
    a more privileged principal. Escalate sharply when this follows user-compromise indicators or an application
    ownership change, since that ties the abuse to a takeover path. A positive result means a powerful
    role is being used in a new and unexpected way; a negative result means observed role use matches
    established, expected behavior.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Applications exposing powerful app roles, principals assigned to those roles, and service principal
    sign-ins into Graph, Azure Resource Manager, Key Vault, Exchange, or other privileged control planes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: sensitive_roles=[Directory.ReadWrite.All,RoleManagement.ReadWrite.Directory,Application.ReadWrite.All,KeyVault.*,Exchange.full];
      JOIN AADServicePrincipalSignInLogs TO MicrosoftGraphActivityLogs ON sp_id; ALERT when sp.app_role
      IN sensitive_roles AND op IN [directory_wide,roleManagement,keyvault,exchange,subscription_authz]
      AND (first_seen(sp,op) OR source_ip/asn/user_agent NOT IN sp.prior_30d_profile); RAISE severity
      if preceded_by(user_compromise OR app_ownership_change); OUTPUT sp_id, app_id, role, op, source_ip,
      asn, ua.
- question: Has any service-principal session begun exercising an app role from a source address, automation
    context, or user-agent that is not part of the application's prior 30-day profile, especially when
    the first requests target Graph roleManagement, directoryRoles, or tenant-wide read/write endpoints?
  context: This question covers role assignment reuse from a novel context under Privilege Escalation.
    Even an authorized app role becomes suspicious when it is suddenly exercised from infrastructure or
    an automation context the application has never used. The analyst builds a 30-day per-application
    profile of source IPs/ASNs, automation contexts, and user-agents, then flags sessions that deviate
    while reaching the most sensitive Graph endpoints (roleManagement, directoryRoles, tenant-wide read/write).
    Sudden role use immediately after an ownership or credential change is treated as concrete impersonation
    evidence. A positive result indicates the role is being driven from attacker-controlled infrastructure;
    a negative result indicates the context matches normal operations.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Applications exposing powerful app roles, principals assigned to those roles, and service principal
    sign-ins into Graph, Azure Resource Manager, Key Vault, Exchange, or other privileged control planes'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: profile=app.prior_30d(source_ip,asn,automation_context,user_agent); ALERT when sp_session.context
      NOT IN profile AND first_ops IN [roleManagement,directoryRoles,tenant_wide_rw]; ESCALATE if recent(ownership_change
      OR credential_change) for app; OUTPUT sp_id, app_id, new_context, first_ops, ts.
- question: Does any privileged (operation, target endpoint) tuple appear for the first time for a given
    service principal when compared against a trailing 30-90 day allow-list of that principal's observed
    operations?
  context: This question applies first-seen privileged-operation profiling under Privilege Escalation.
    Rather than relying on a static role inventory, the analyst maintains a per-service-principal allow-list
    of (operation, target endpoint) tuples seen over a trailing 30-90 day window, then alerts whenever
    a privileged tuple appears that has never been observed for that principal. This mirrors first-seen
    detection approaches (Splunk Unseen User Roles, Netflix CloudTrail Anomaly Detector) and is effective
    against valid-credential abuse where each individual call looks legitimate but the combination is
    new. A positive result means a service principal has begun performing a privileged action it never
    did before; a negative result means the action is within its historical repertoire.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Applications exposing powerful app roles, principals assigned to those roles, and service principal
    sign-ins into Graph, Azure Resource Manager, Key Vault, Exchange, or other privileged control planes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = set((op,target_endpoint)) per sp over trailing 30-90d; FOR each new event where
      op IN privileged_set: ALERT if (op,target_endpoint) NOT IN baseline[sp]; OUTPUT sp_id, op, target_endpoint,
      first_seen_ts, baseline_size.'
- question: Is any application's app-role activity exceeding its historical volume or frequency norms,
    for example privileged requests per hour, bytes returned by directory reads, or admin operations per
    minute rising above the application's 95th percentile or a MAD-based modified Z-score above 3.5?
  context: This question addresses application role-use volume and frequency outliers under Privilege
    Escalation. The analyst baselines each application's Volume (privileged requests/hour, bytes returned
    by directory reads), Frequency (admin operations/min), and source diversity, then scores deviations
    using a modified Z-score / median absolute deviation so that legitimate batch automation does not
    inflate the mean and mask an attack. Seasonal time-series forecasting helps separate genuine trend
    from anomaly. An app-role suddenly enumerating the directory or performing admin operations far above
    its norm is a strong privilege-abuse signal. A positive result is activity above the 95th percentile
    or MAD score >3.5; a negative result is volume within normal seasonal bounds.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Applications exposing powerful app roles, principals assigned to those roles, and service principal
    sign-ins into Graph, Azure Resource Manager, Key Vault, Exchange, or other privileged control planes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline app over 30-90d => priv_requests_per_hour, bytes_returned, admin_ops_per_min, source_diversity;
      mz = 0.6745*(x-median)/MAD; ALERT when x>app_p95 OR mz>3.5; ANNOTATE seasonal_forecast_residual;
      OUTPUT app_id, metric, value, p95, mz_score.
- question: Is a service principal generating a burst of authorization-failure responses (403, AuthorizationFailed,
    insufficient-privileges) followed by a success, for example more than 10 distinct denied privileged
    operations within 10 minutes and then a successful one?
  context: This question profiles the authorization-failure (state) signal under Privilege Escalation.
    The analyst explicitly counts per-principal success/fail states in MicrosoftGraphActivityLogs and
    AzureActivity. A burst of denied privileged calls followed by a success is the classic signature of
    an impersonating principal probing the boundaries of its inherited rights until it finds an operation
    it is permitted to perform. This mirrors Splunk's AccessDenied Discovery logic. A positive result
    is a denial burst (e.g., >10 distinct denied operations in 10 minutes) followed by at least one success;
    a negative result is a low, stable failure rate consistent with normal operation.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Applications exposing powerful app roles, principals assigned to those roles, and service principal
    sign-ins into Graph, Azure Resource Manager, Key Vault, Exchange, or other privileged control planes'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'WINDOW 10m per sp: count distinct denied_ops where status IN [403,AuthorizationFailed,insufficient_privileges];
      ALERT when denied_distinct>10 AND any subsequent success within window; OUTPUT sp_id, denied_ops,
      first_denial, success_op, success_ts.'
- question: Does a sequence/behavior model rank any service-principal session as resembling privilege
    escalation rather than expected application behavior, based on role sensitivity, source novelty, endpoint
    novelty, token audience, request volume/frequency, failure ratio, and operation sequence?
  context: This question applies an app-role abuse sequence model under Privilege Escalation. When no
    single feature is decisive, a model that scores sessions over role sensitivity, source novelty, endpoint
    novelty, token audience, request volume/frequency, failure ratio, and operation sequence can surface
    escalation that rules miss. Variable-order Markov sequence plausibility (Cloudflare) or graph relational
    anomaly scoring (GNN IAM, CS-GAD) are appropriate. Crucially, the alert must surface the top-3 contributing
    features (for example first-time roleManagement call, new ASN, failure-burst) alongside the score
    so analysts can act on explainable evidence rather than a raw number. A positive result is a high-ranked
    session whose contributing features describe an escalation pattern; a negative result is a session
    that fits expected app behavior.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Applications exposing powerful app roles, principals assigned to those roles, and service principal
    sign-ins into Graph, Azure Resource Manager, Key Vault, Exchange, or other privileged control planes'
  range: Last 90 days for training features, with live scoring of new service-principal sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[role_sensitivity,source_novelty,endpoint_novelty,token_audience,req_volume,req_frequency,failure_ratio,op_sequence];
      score=markov_or_gnn.score(session_features); ALERT when score>=threshold; OUTPUT sp_id, score, top_3_features.
- question: Is an application with broad consented API permissions performing rare or first-time administrative
    Graph operations such as modifying roles, users, applications, consents, secrets, or appRoleAssignments,
    especially after ownership changes, credential resets, or suspicious sign-in context?
  context: This question targets privileged API permission abuse under Privilege Escalation. An application
    granted tenant-wide consented permissions can quietly hold the keys to the directory; the danger materializes
    when it actually performs high-impact administrative Graph operations (changing roles, users, applications,
    consents, secrets, or appRoleAssignments) for the first time or rarely. The analyst raises severity
    when these calls follow ownership changes, credential resets, or suspicious sign-in context, and maps
    them to the specific Entra audit events known to accompany Azure/M365 backdoors. A positive result
    is a privileged directory-administration call by an app that does not normally perform it; a negative
    result is routine API use consistent with the app's purpose.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - AzureActivity
  - AuditLogs
  - 'NAI: Applications with tenant-wide API permissions, consented service principals, and sign-in sessions
    that reach Graph role management, credential administration, mailbox access, or subscription authorization
    APIs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: admin_ops=[update_role,update_user,update_application,grant_consent,add_secret,add_appRoleAssignment];
      ALERT when app.consented_permissions=broad AND op IN admin_ops AND (first_seen(app,op) OR rare(app,op));
      RAISE severity if recent(ownership_change OR credential_reset OR suspicious_signin) for app; OUTPUT
      app_id, op, target, ts, signin_context.
- question: Within any short window of 15 minutes or less, does a service principal chain multiple privileged
    Graph/ARM endpoints that are rarely used together, such as role assignment plus credential management
    plus policy/consent modification?
  context: This question detects permissioned endpoint chaining surges under Privilege Escalation. Attackers
    who seize an application's permissions tend to perform a rapid burst of related high-impact actions
    (assign a role, add a credential, then modify a policy or consent) to lock in elevated access. Clustered
    use of high-impact endpoints rarely seen together is stronger evidence than any single isolated call.
    The analyst looks for these tight chains and validates plausible attack chains against Stratus Red
    Team telemetry. A positive result is several distinct privileged endpoint families touched within
    a short window; a negative result is isolated, spread-out calls consistent with normal administration.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - AzureActivity
  - AuditLogs
  - 'NAI: Applications with tenant-wide API permissions, consented service principals, and sign-in sessions
    that reach Graph role management, credential administration, mailbox access, or subscription authorization
    APIs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'WINDOW<=15m per sp: collect distinct privileged_endpoint_families {role_assignment, credential_mgmt,
      policy_consent_mod}; ALERT when distinct_families>=2 AND combo IN rarely_used_together_set; OUTPUT
      sp_id, endpoints, window_start, window_end.'
- question: Is any session reaching administrative Graph/ARM API families that the application has never
    touched over the trailing 30-90 day baseline, or originating from source networks the application
    has never used?
  context: This question applies first-seen API-family profiling per application under Privilege Escalation.
    The analyst baselines each application's usual Graph/ARM API families and source networks over 30-90
    days, then flags sessions that reach administrative API families the application has never used or
    that arrive from never-before-seen networks. This first-seen logic (Splunk Unseen User Roles, Netflix
    CloudTrail Anomaly Detector) is effective against consented-app abuse where the credentials are valid
    but the behavior is novel. A positive result is an app suddenly using an entirely new administrative
    API family or network; a negative result is API/network usage within its established profile.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - AzureActivity
  - AuditLogs
  - 'NAI: Applications with tenant-wide API permissions, consented service principals, and sign-in sessions
    that reach Graph role management, credential administration, mailbox access, or subscription authorization
    APIs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline app over 30-90d => set(api_family), set(source_network); ALERT when session.api_family
      NOT IN baseline.api_family AND api_family IN administrative_set, OR session.source_network NOT IN
      baseline.source_network; OUTPUT app_id, api_family, source_network, ts.
- question: Is an application's privileged-endpoint request volume, frequency, or concurrency exceeding
    its trailing 95th percentile or a MAD-based modified Z-score above 3.5?
  context: This question addresses API request volume/frequency spikes under Privilege Escalation. The
    analyst tracks Volume (requests, bytes returned), Frequency (privileged calls/min), and concurrency
    per application, then alerts when privileged-endpoint activity exceeds the trailing 95th percentile
    or a MAD-based modified Z-score above 3.5, using seasonal forecasting to account for legitimate periodicity.
    A compromised app that begins mass-enumerating or mass-modifying the directory will spike well above
    its own historical norm. A positive result is privileged-endpoint volume/frequency above the threshold;
    a negative result is activity within normal seasonal bounds.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - AzureActivity
  - AuditLogs
  - 'NAI: Applications with tenant-wide API permissions, consented service principals, and sign-in sessions
    that reach Graph role management, credential administration, mailbox access, or subscription authorization
    APIs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline app over 30-90d => priv_requests, bytes_returned, priv_calls_per_min, concurrency;
      mz=0.6745*(x-median)/MAD; ALERT when x>app_p95 OR mz>3.5; ANNOTATE seasonal_forecast; OUTPUT app_id,
      metric, value, p95, mz_score.
- question: Has an application's failed-call rate spiked sharply, for example its AuthorizationFailed/403/insufficient-privileges
    ratio jumping from under 1% to over 20%?
  context: 'This question profiles permission failure-rate (state) under Privilege Escalation. By explicitly
    baselining each application''s normal failed-call rate, the analyst can detect a compromised application
    probing the bounds of its consented permissions: a sudden jump in AuthorizationFailed/403/insufficient-privileges
    responses (for example from <1% to >20%) indicates exploratory privilege-testing rather than normal
    operation. This mirrors Splunk''s AccessDenied Discovery logic. A positive result is a pronounced
    failure-rate spike relative to baseline; a negative result is a stable, low failure rate.'
  answer_sources:
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - AzureActivity
  - AuditLogs
  - 'NAI: Applications with tenant-wide API permissions, consented service principals, and sign-in sessions
    that reach Graph role management, credential administration, mailbox access, or subscription authorization
    APIs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline app failure_ratio over 30d; current=failed_calls/total_calls per window; ALERT when
      current>20% AND baseline<1%; OUTPUT app_id, baseline_ratio, current_ratio, failed_ops, window.
- question: Does a consent/permission abuse behavior model identify any session where a benign application
    baseline is replaced by directory-administration patterns, considering application age, permission
    breadth, source novelty, endpoint novelty, request volume/frequency, failure ratio, and operation
    sequence?
  context: This question applies a consent/permission abuse behavior model under Privilege Escalation.
    Using features such as application age, permission breadth, source novelty, endpoint novelty, request
    volume/frequency, failure ratio, and operation sequence, the model identifies sessions where an application's
    previously benign baseline is replaced by directory-administration behavior. Heterogeneous-graph relational
    scoring (GNN IAM, CS-GAD) or managed anomaly policies (Defender for Cloud Apps) are suitable approaches.
    Alerts must list the top-3 contributing features so the analyst sees why a session was flagged. A
    positive result is a session whose contributing features describe directory-administration takeover;
    a negative result is behavior consistent with the app's benign baseline.
  answer_sources:
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - AzureActivity
  - AuditLogs
  - 'NAI: Applications with tenant-wide API permissions, consented service principals, and sign-in sessions
    that reach Graph role management, credential administration, mailbox access, or subscription authorization
    APIs'
  range: Last 90 days for training features, with live scoring of new application sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[app_age,permission_breadth,source_novelty,endpoint_novelty,req_volume,req_frequency,failure_ratio,op_sequence];
      score=hetero_graph_model.score(session); ALERT when score>=threshold; OUTPUT app_id, sp_id, score,
      top_3_features.
- question: Has an Entra 'Update application - Certificates and secrets management' or 'Add service principal
    credentials' event been followed by a service-principal sign-in from a new source or automation context,
    particularly when the modified application holds privileged app roles or API permissions and the new
    sign-in immediately touches sensitive directory or subscription endpoints?
  context: 'This question correlates credential addition followed by service-principal use under Privilege
    Escalation. The analyst joins Entra audit events for adding or rotating application credentials (AuditLogs)
    with subsequent AADServicePrincipalSignInLogs sign-ins from a new source or automation context. This
    is the canonical owner-driven escalation and backdoor pattern: an actor injects a credential and then
    authenticates as the now-controlled service principal. Severity rises sharply when the modified application
    holds privileged app roles or API permissions and the new sign-in immediately reaches sensitive directory
    or subscription endpoints in MicrosoftGraphActivityLogs. A positive result is a credential-add tightly
    followed by privileged use from new infrastructure; a negative result is a credential rotation followed
    by use from known automation with no privileged escalation.'
  answer_sources:
  - AuditLogs
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Application registrations with owner relationships, certificate and secret management events,
    and subsequent service principal sign-ins by the modified application into privileged resource providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN AuditLogs[op IN ('Update application - Certificates and secrets management','Add service
      principal credentials')] TO AADServicePrincipalSignInLogs ON app_id WHERE signin.ts>cred_add.ts
      AND signin.source NOT IN app.known_sources; ESCALATE if app.has_privileged_roles AND signin followed_by
      sensitive_directory_or_subscription_ops; OUTPUT actor, app_id, cred_add_ts, signin_ts, source, first_ops.
- question: Was a newly added secret or certificate exercised within minutes to hours by an application
    that had been dormant or that normally signs in only from fixed automation infrastructure?
  context: This question detects rapid credential first use under Privilege Escalation. The analyst flags
    cases where a freshly added secret/certificate is used almost immediately by an application that was
    dormant or that normally authenticates only from fixed automation infrastructure. Rapid first use
    after credential insertion is a strong signal of application takeover rather than routine secret hygiene,
    and can be reproduced with Stratus Red Team. A positive result is a new credential exercised soon
    after insertion by an otherwise quiet/fixed-source app; a negative result is a credential rotation
    where first use matches the app's normal cadence and infrastructure.
  answer_sources:
  - AuditLogs
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Application registrations with owner relationships, certificate and secret management events,
    and subsequent service principal sign-ins by the modified application into privileged resource providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN AuditLogs[add_credential] TO AADServicePrincipalSignInLogs ON app_id; time_to_first_use
      = first_signin_with_new_cred.ts - cred_add.ts; ALERT when time_to_first_use<=hours AND (app.dormant
      OR app.normal_source=fixed_automation AND signin.source!=fixed_automation); OUTPUT app_id, cred_id,
      cred_add_ts, first_use_ts, time_to_first_use, source.
- question: When an account adds credentials to an application, does the actor's effective roles compared
    to the target application's app roles and API permissions show the actor granting itself control over
    a more-privileged principal (for example an Application Administrator or mere Owner taking over a
    more powerful app)?
  context: This question implements actor-vs-target privilege comparison under Privilege Escalation, the
    core of the AZT405 escalation model. When an account adds credentials to an application, the analyst
    compares the actor's effective roles to the target application's app roles/API permissions. If a lower-privileged
    actor (such as an Application Administrator or just an Owner) gives itself control over a more-privileged
    service principal, that is privilege escalation by definition, matching the SpecterOps escalation
    paths and BloodHound/AzureHound graph analysis. A positive result is a credential change where target
    privilege strictly exceeds actor privilege; a negative result is a change where the actor already
    holds equal or greater privilege than the target.
  answer_sources:
  - AuditLogs
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Application registrations with owner relationships, certificate and secret management events,
    and subsequent service principal sign-ins by the modified application into privileged resource providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Correlation pseudocode
    query: 'FOR each AuditLogs[add_credential] event: actor_priv=effective_roles(actor); target_priv=app_roles_and_api_perms(target_app);
      ALERT when target_priv > actor_priv (actor gains control of more-privileged principal); OUTPUT actor,
      actor_roles, target_app, target_perms, ts.'
- question: Are there credential changes that fall outside maintenance windows, or where the new credential
    is exercised faster or more broadly than an application's historical norms, based on per-application
    baselines of credential-update frequency, owner identities, sign-in sources, and time-to-first-use?
  context: This question applies owner-driven credential-change outlier detection under Privilege Escalation.
    The analyst baselines per-application credential-update frequency, owner identities, sign-in sources,
    and time-to-first-use after rotation, then flags changes outside maintenance windows or where the
    new credential is used faster or more broadly than historical norms, scoring deviations with MAD/modified
    Z-score and first-seen logic. This separates routine secret rotation from suspicious owner-driven
    takeover. A positive result is a credential change that is anomalous in timing, owner, source, or
    speed of use; a negative result is a rotation consistent with established maintenance patterns.
  answer_sources:
  - AuditLogs
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Application registrations with owner relationships, certificate and secret management events,
    and subsequent service principal sign-ins by the modified application into privileged resource providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline app => cred_update_freq, set(owner), set(signin_source), time_to_first_use_dist; mz=0.6745*(x-median)/MAD;
      ALERT when change outside maintenance_window OR new_owner OR new_source OR time_to_first_use<baseline_p5
      OR mz(scope)>3.5; OUTPUT app_id, actor, anomaly_reason, values.
- question: After a credential is added to an application, does the new session show a surge in privileged
    operations and/or a burst of AuthorizationFailed responses that indicates malicious takeover rather
    than routine secret hygiene?
  context: This question performs post-takeover failure/volume profiling under Privilege Escalation. After
    a credential add, the analyst profiles the new session's success/fail state and Volume/Frequency.
    A surge in privileged operations and/or a burst of AuthorizationFailed responses (capability probing)
    points to malicious takeover rather than benign rotation, mirroring Splunk's AccessDenied Discovery
    and unseen-operation logic. A positive result is a post-credential-add session with elevated privileged
    volume or a denial burst; a negative result is a quiet session whose activity matches the app's prior
    behavior.
  answer_sources:
  - AuditLogs
  - AADServicePrincipalSignInLogs
  - MicrosoftGraphActivityLogs
  - 'NAI: Application registrations with owner relationships, certificate and secret management events,
    and subsequent service principal sign-ins by the modified application into privileged resource providers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'AFTER AuditLogs[add_credential] for app: profile new_session => priv_op_volume, priv_calls_per_min,
      denied_count; ALERT when priv_op_volume>app_p95 OR denied_burst(>10 distinct in 10m) OR first_seen_privileged_ops;
      OUTPUT app_id, cred_id, priv_ops, denied_ops, ts.'
- question: Does a sequence model flag the chain of ownership/credential-management followed by service-principal
    authentication followed by downstream privileged API use, prioritizing sequences where credential
    injection rapidly turns into privileged control?
  context: This question applies an application-takeover sequence anomaly model under Privilege Escalation.
