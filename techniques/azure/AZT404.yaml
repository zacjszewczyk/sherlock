    and flag jobs touching anything off-list. Track failed jobs and 403/AuthorizationFailed results as
    a distinct probing signal. In the Privilege Escalation context, arming the automation identity with
    new credentials or roles and then running an off-allowlist job is strong evidence of deliberate escalation
