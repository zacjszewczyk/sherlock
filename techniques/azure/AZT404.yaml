    it so its system- or user-assigned identity acts against control-plane or sensitive data services.
    Detect Microsoft.Web/sites/write or Microsoft.Web/sites/start/action and correlate with follow-on
    workload-identity sign-ins (resultType 0) to rarely/never-accessed resources within 60 minutes. Raise
    severity when changes affect authentication settings, app settings/secrets, or deployment content
    shortly before privileged API use, or when the identity outranks the editing principal. This is the
    central deterministic detection for App Service impersonation under Privilege Escalation; a positive
    result indicates an edited service is now behaving like an operator-controlled administrative tool.
