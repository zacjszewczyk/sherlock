name: 'AZT404: Principal Impersonation'
id: cc545e84-2fce-40a0-a37d-c4a48555bb67
description: 'Investigate suspected Azure privilege escalation via principal impersonation, where an adversary
  abuses an identity-enabled resource so that its managed identity or service principal performs unauthorized
  control-plane or data-plane operations. This playbook helps an analyst hunt across four common abuse
  vectors: Function Apps whose code, configuration, or restarts are altered so their identity calls subscriptions,
  vaults, storage, or directory endpoints outside normal scope; Logic App workflows whose identities,
  callback URLs, or connections are changed to expose remotely triggerable privileged paths; Automation
  Account runbooks and jobs that are created, edited, published, or executed so the account''s managed
  identity or Run As principal acts against identities, secrets, or subscriptions; and App Services that
  are reconfigured or restarted to provide a durable privileged execution path. For each vector the playbook
  combines deterministic correlation of resource-edit events with subsequent workload-identity sign-ins
  and privileged operations, near-zero-baseline precursor detection (credential additions, role assignments,
  consent grants, callback retrievals), statistical baselining of per-resource volume/frequency/state,
  and machine-learning sequence and graph models for improbable identity-resource-action edges.'
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: After a Function App's code, functions, or site configuration were written or updated, did
    the app's managed identity or service principal sign in (resultType 0) and begin reaching a resource
    provider it had not called in the prior 30 days, especially while issuing high-privilege control-plane
    writes?
  context: This is the core deterministic detection for Function App principal impersonation. An operator
    who edits run.csx, function definitions, or the site itself can repurpose the app's identity to act
    far beyond its intended scope. Correlate successful AzureActivity writes (Microsoft.Web/sites/hostruntime/vfs/run.csx/write,
    Microsoft.Web/sites/functions/write, Microsoft.Web/sites/write) with a managed-identity or service-principal
    sign-in within 60 minutes that reaches ARM, Microsoft Graph, Key Vault, or Storage for the first time
    in 30 days. Escalate to high when the same session performs Microsoft.Authorization/roleAssignments/write,
    Microsoft.KeyVault/vaults/secrets/read, or policyAssignments/write, and especially when the identity
    is more privileged than the editor who changed the code — a classic escalation tell for the Privilege
    Escalation tactic. A positive result indicates the actor turned a benign function into an administrative
    tool; a negative result helps rule out the most direct impersonation path.
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with managed identities or service principal-backed secrets, deployment and function
    update events, and post-deployment sign-ins by workload identities to Azure Resource Manager, Graph,
    Key Vault, Storage, or subscription administration endpoints'
  range: Last 90 days, with event-centered correlation of code/config writes to identity sign-ins within
    60 minutes.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'edit = AzureActivity where OperationName in [''Microsoft.Web/sites/hostruntime/vfs/run.csx/write'',''Microsoft.Web/sites/functions/write'',''Microsoft.Web/sites/write'']
      and ActivityStatus==''Succeeded'';

      signin = (AADManagedIdentitySignInLogs | AADServicePrincipalSignInLogs) where resultType==0 and
      ResourceProvider in [''ARM'',''MicrosoftGraph'',''KeyVault'',''Storage''];

      alert when signin.appId==edit.appId and signin.time within 60min after edit.time and resourceProvider
      not seen for appId in prior 30d;

      escalate=high if same session has OperationName in [''Microsoft.Authorization/roleAssignments/write'',''Microsoft.KeyVault/vaults/secrets/read'',''Microsoft.Authorization/policyAssignments/write'']
      or identity_role outranks editor_role;

      output appId, editor, resourceProvider, operation, severity.'
- question: Were any near-zero-baseline impersonation precursors — adding application credentials, granting
    consent, or assigning a new role to the Function App's identity — observed, and did they correlate
    with a subsequent workload-identity sign-in or calls to resource providers outside the app's least-privilege
    allowlist?
  context: Credential additions, consent grants, and new role assignments to a Function App identity are
    rare in healthy environments, so any occurrence deserves an alert. These are the precursors that let
    an adversary arm an identity for impersonation. Maintain a per-app allowlist of approved target resource
    providers derived from least-privilege role assignments; any call outside that allowlist, and any
    spike of blocked control-plane calls (HTTP 403/AuthorizationFailed), is a probing signal that maps
    directly to Privilege Escalation. Correlate each precursor with the resulting sign-in to confirm the
    identity was actually used. A positive result is strong evidence of intentional escalation setup;
    tracking the failed/blocked calls separately reveals the actor mapping their newly granted permissions.
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with managed identities or service principal-backed secrets, deployment and function
    update events, and post-deployment sign-ins by workload identities to Azure Resource Manager, Graph,
    Key Vault, Storage, or subscription administration endpoints'
  range: Last 90 days.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'precursor = AzureActivity where OperationName in [''Microsoft.Web/sites/credentials/write'',''add
      app credential'',''Microsoft.Authorization/roleAssignments/write'',''consent grant''] and target_identity
      == FunctionApp.identity;

      alert on any precursor (near-zero baseline);

      correlate to signin = (AADManagedIdentitySignInLogs|AADServicePrincipalSignInLogs) for same identity;

      allowlist = approved resourceProviders(appId) from least-privilege assignments;

      flag calls where resourceProvider not in allowlist; count 403/AuthorizationFailed by identity as
      probing;

      output identity, precursor_op, downstream_call, offlist?, failed_count.'
- question: Does a recently modified Function App deviate from its own 30-day baseline of operation volume,
    sign-in frequency, first-seen target services, or failed-to-successful call ratio in a way consistent
    with identity abuse?
  context: Statistical baselining catches impersonation that does not trip a single deterministic rule.
    For each Function App, profile Volume (bytes/records read or written and control-plane operations
    per run), Frequency (deployments per week and identity sign-ins per hour), and State (ratio of failed
    403/AuthorizationFailed/NXDOMAIN to successful calls). Flag a newly modified app when it exceeds its
    95th-percentile operation volume, authenticates to a first-seen (identity, resourceProvider, operation)
    tuple, or shows a failure-rate spike indicating permission probing. Thresholds are derived per app
    from its own history rather than global constants, which keeps false positives low. In the Privilege
    Escalation context, a sudden volume jump plus first-seen privileged targets right after a code change
    is a high-confidence signal.
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with managed identities or service principal-backed secrets, deployment and function
    update events, and post-deployment sign-ins by workload identities to Azure Resource Manager, Graph,
    Key Vault, Storage, or subscription administration endpoints'
  range: Last 90 days, baselined against each app's own trailing 30-day profile.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each appId: baseline_30d(volume_ops_per_run, signins_per_hour, deploys_per_week, fail_to_success_ratio);

      flag if ops_volume > p95(appId) or (identity,resourceProvider,operation) first_seen or fail_to_success_ratio
      spikes > baseline;

      restrict to apps with a write/deploy event in last 24h; output appId, deviating_metric, observed_vs_baseline.'
- question: When workload-identity sessions for recently edited Function Apps are modeled as an identity-resource-action
    graph or API sequence, do any sessions score as anomalous access edges or out-of-pattern privileged
    sequences reaching improbable high-value resources?
  context: Machine-learning models add coverage for novel impersonation patterns. Model workload-identity
    sessions as a heterogeneous identity-resource-action graph and score anomalous access edges where
    a recently edited Function App identity reaches improbable high-value resources, or model the expected
    per-app API sequence with an LSTM and flag out-of-pattern privileged sequences. To stay actionable,
    the alert must surface the top-3 contributing features (e.g., first-seen target resource, recent code
    change, privileged operation mix) using attention or feature attribution. These models run in parallel
    with the deterministic and statistical rules and never replace the symbolic floor — they are a sensitivity
    layer for the Privilege Escalation hunt, useful for catching slow or low-volume abuse the thresholds
    miss.
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with managed identities or service principal-backed secrets, deployment and function
    update events, and post-deployment sign-ins by workload identities to Azure Resource Manager, Graph,
    Key Vault, Storage, or subscription administration endpoints'
  range: Last 90 days, scored continuously with model retraining on rolling history.
  queries:
  - technology: ML/pseudocode
    query: 'build graph G(identity -> resourceProvider -> action) over workload-identity sessions;

      score access edges; OR train LSTM per appId on API operation sequences;

      anomaly if edge_score > tau or sequence_prob < epsilon for apps with recent code change;

      emit top3 features via attention/attribution; run parallel to symbolic+stats rules;

      output appId, session, anomaly_score, top3_features.'
- question: Was a Logic App workflow written, given a public callback URL, or had a connection changed,
    and was that change followed within 60 minutes by a managed-identity sign-in or workflow run touching
    privileged resources such as Authorization, Key Vault secrets, or directory objects?
  context: Logic Apps can be weaponized by editing the workflow, retrieving a public HTTP callback URL,
    or modifying a connection so the workflow's identity executes privileged operations. Correlate AzureActivity
    events Microsoft.Logic/workflows/write, Microsoft.Logic/workflows/triggers/listCallbackUrl/action,
    or Microsoft.Web/connections/write with a downstream managed-identity sign-in or Microsoft.Logic/workflows/run/action
    that touches privileged resources within 60 minutes. Raise severity to high when the edit adds an
    HTTP request trigger, retrieves a callback URL (creating a remotely triggerable privileged path),
    or the workflow afterward accesses Microsoft.Authorization/*, Key Vault secrets, or directory objects,
    and especially when the workflow identity outranks the editor. This is the central deterministic detection
    for Logic App impersonation under Privilege Escalation; a positive result shows a benign integration
    turned into an attacker-triggerable escalation primitive.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic App workflows with identities or privileged connectors, callback URL access, connection
    objects, and workflow runs that access sensitive subscriptions, resource groups, or identity objects'
  range: Last 90 days, with event-centered correlation of workflow edits/callback retrievals to runs within
    60 minutes.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'edit = AzureActivity where OperationName in [''Microsoft.Logic/workflows/write'',''Microsoft.Logic/workflows/triggers/listCallbackUrl/action'',''Microsoft.Web/connections/write''];

      exec = (AADManagedIdentitySignInLogs|AADServicePrincipalSignInLogs sign-in) OR AzureActivity ''Microsoft.Logic/workflows/run/action''
      touching privileged resourceProvider;

      alert when exec.workflowId==edit.workflowId and exec.time within 60min after edit.time;

      severity=high if new HTTP trigger or callback URL retrieved or access to [''Microsoft.Authorization/*'',''KeyVault
      secrets'',''directory objects''] or identity_role outranks editor_role;

      output workflowId, editor, trigger_type, target, severity.'
- question: Were Logic App impersonation precursors — listCallbackUrl retrievals, new connection authorizations,
    or credential/consent additions to the workflow identity — observed, and did off-allowlist connectors/target
    providers or blocked runs follow?
  context: Callback-URL retrieval, new connection authorizations, and credential or consent additions
    to a workflow identity are near-zero-baseline events; alert on any occurrence and correlate to the
    downstream identity sign-in. Maintain a per-workflow allowlist of approved connectors and target resource
    providers derived from least-privilege assignments, and treat any call outside it as an alert candidate.
    Track failed/blocked workflow runs and 403/AuthorizationFailed results from the identity as a distinct
    permission-probing signal. In the Privilege Escalation context, a callback retrieval that creates
    a remotely triggerable path, paired with a new privileged connector, is strong evidence of intentional
    escalation staging.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic App workflows with identities or privileged connectors, callback URL access, connection
    objects, and workflow runs that access sensitive subscriptions, resource groups, or identity objects'
  range: Last 90 days.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'precursor = AzureActivity where OperationName in [''Microsoft.Logic/workflows/triggers/listCallbackUrl/action'',''Microsoft.Web/connections/write'',''add
      credential'',''consent grant''] for workflow identity;

      alert on any precursor (near-zero baseline); correlate to downstream identity sign-in;

      allowlist = approved connectors+resourceProviders(workflowId);

      flag off-allowlist calls; count failed runs and 403/AuthorizationFailed as probing;

      output workflowId, precursor, downstream_signin, offlist?, failed_count.'
- question: Does an updated Logic App workflow deviate from its own 30-day baseline by introducing a first-seen
    connector or first-seen (identity, resourceProvider, operation) tuple, exceeding 95th-percentile run/operation
    volume, or spiking in failed runs?
  context: Per-workflow statistical baselining catches abuse that no single rule flags. Profile each workflow
    over 30 days across Volume (records moved and control-plane ops per run), Frequency (runs/hour, edits/week,
    callback retrievals/week), and State (failed-to-successful run ratio). Flag when an updated version
    introduces a first-seen connector or first-seen (identity, resourceProvider, operation) tuple, exceeds
    its 95th-percentile run/operation volume, or shows a spike in failed runs indicating permission probing.
    Thresholds come from each workflow's own history. For Privilege Escalation, a freshly edited workflow
    that suddenly drives high operation volume against a never-before-seen privileged provider is a high-confidence
    impersonation indicator.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic App workflows with identities or privileged connectors, callback URL access, connection
    objects, and workflow runs that access sensitive subscriptions, resource groups, or identity objects'
  range: Last 90 days, baselined against each workflow's own trailing 30-day profile.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each workflowId: baseline_30d(records_per_run, ops_per_run, runs_per_hour, edits_per_week,
      callbacks_per_week, fail_to_success_ratio);

      flag if first_seen connector OR first_seen (identity,resourceProvider,operation) OR volume > p95(workflowId)
      OR failed_runs spike;

      restrict to workflows edited recently; output workflowId, deviating_metric, observed_vs_baseline.'
- question: When workflow edits, callback operations, run invocations, and downstream identity sign-ins
    are run through sequence or graph models, do any sequences separate from routine integration maintenance
    as impersonation-based escalation with improbable access edges?
  context: Sequence modeling across workflow edits, callback operations, run invocations, and downstream
    identity sign-ins helps separate routine integration maintenance from impersonation-based escalation,
    and graph scoring of the identity-resource-action graph surfaces improbable access edges. Emit the
    top-3 contributing features (e.g., new HTTP trigger, first-seen privileged target, rare connector)
    in each alert so analysts can triage quickly. These models operate in parallel with the deterministic
    and statistical rules and do not remove the thresholds. Within Privilege Escalation, this layer catches
    multi-step Logic App abuse — for example a quiet edit, later callback retrieval, then a privileged
    run — that individual rules might miss.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic App workflows with identities or privileged connectors, callback URL access, connection
    objects, and workflow runs that access sensitive subscriptions, resource groups, or identity objects'
  range: Last 90 days, scored continuously with model retraining on rolling history.
  queries:
  - technology: ML/pseudocode
    query: 'sequence = [edit, listCallbackUrl, run, downstream_signin] per workflowId;

      model with LSTM (DeepLog-style) OR score identity-resource-action graph edges (GNN);

      anomaly if sequence_prob < epsilon or edge_score > tau;

      emit top3 features (new HTTP trigger, first-seen privileged target, rare connector);

      run parallel to symbolic+stats rules; output workflowId, anomaly_score, top3_features.'
- question: Was an Automation Account runbook drafted, published, or a job written, and was that followed
    within 60 minutes by the account's managed identity or Run As principal performing high-impact actions
    like role assignments, Key Vault secret reads, policy updates, or subscription management?
  context: Automation Accounts hold powerful identities, so a runbook edit or job execution is a natural
    impersonation vector. Detect Microsoft.Automation/automationAccounts/runbooks/draft/write, runbooks/publish/action,
    or jobs/write in AzureActivity followed by managed-identity or Run As sign-ins performing high-impact
    actions (Microsoft.Authorization/roleAssignments/write, Key Vault secret reads, policy updates, subscription
    management) within 60 minutes. Escalate when the runbook is newly created or edited by an operator
    outside the normal author set, or when the identity outranks the editing principal — both classic
    Privilege Escalation tells. A positive result indicates an attacker used automation to grant themselves
    or read privileged material; a negative result helps clear the runbook-driven path.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Automation Accounts with managed identities or Run As principals, runbook draft and publish
    activity, job execution history, and downstream identity sign-ins into administrative resource providers'
  range: Last 90 days, with event-centered correlation of runbook publish/job writes to privileged sign-ins
    within 60 minutes.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'edit = AzureActivity where OperationName in [''Microsoft.Automation/automationAccounts/runbooks/draft/write'',''Microsoft.Automation/automationAccounts/runbooks/publish/action'',''Microsoft.Automation/automationAccounts/jobs/write''];

      act = (AADManagedIdentitySignInLogs|AADServicePrincipalSignInLogs) doing OperationName in [''Microsoft.Authorization/roleAssignments/write'',''KeyVault
      secret read'',''policy update'',''subscription management''];

      alert when act.identity==automationAccount.identity and act.time within 60min after edit.time;

      escalate if author not in normal_author_set(account) or identity_role outranks editor_role;

      output accountId, runbook, editor, action, severity.'
- question: Were near-zero-baseline precursors — credential additions, new role assignments, or consent
    grants to the Automation Account identity or Run As principal — observed, and did any job then touch
