name: 'AZT108: Gather Victim Data'
id: f0829b53-d97b-4315-8655-be78e78a9b6f
description: 'Investigate whether an adversary, after compromising an Entra ID (Azure AD) identity, is
  gathering victim data from Azure-connected user services such as Exchange Online mailboxes, OneDrive,
  SharePoint, and Teams. This playbook helps an analyst determine if a compromised account has shifted
  from normal usage into adversary-driven collection: anomalous content access from new devices, IPs,
  ASNs, or countries; first-seen client apps and Microsoft Graph endpoints; cross-service sweeps that
  fan out across mailboxes, sites, and chats; and statistically abnormal volumes of mail items read, files
  previewed or downloaded, and collaboration sites touched. It then escalates to detect focused, high-value
  collection - selective triage and export of executive, legal, finance, or incident-response content,
  sensitivity-label concentration, owner concentration shifts, and permission-probing failure signatures
  (AccessDenied, DLP blocks, throttling, 403/404). Methods span deterministic symbolic-logic rules over
  first-party Microsoft 365 audit logs, statistical baselining and forecasting, and machine learning (isolation
  forests, graph embeddings, and sequence models) to give the SOC granular, defensible coverage of Azure
  identity-driven data gathering.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a successful interactive sign-in originate from a device, IP, ASN, or country that is
    not in the user's trailing-90-day baseline and was then followed within the same session (under 30
    minutes) by content-access operations the user does not normally perform, such as MailItemsAccessed
    bind/sync, eDiscovery/compliance SearchStarted, SharePointFileOperation FileDownloaded or FileAccessed
    enumeration, Teams MessageRead, or Microsoft Graph reads of /me/messages, /users, or /drive?
  context: In the Reconnaissance tactic, an adversary who has compromised an identity moves quickly from
    authenticating to harvesting whatever personal and organizational data the account can reach. The
    strongest deterministic signal couples a sign-in from unfamiliar infrastructure with an immediate
    pivot into content access. Correlate Entra ID SignInLogs (device, IP, ASN, country versus the trailing-90-day
    baseline) with M365 audit operations occurring within 30 minutes of that sign-in. Encode as Sigma/KQL
    rules over first-party M365 audit logs and align with Defender for Cloud Apps impossible-travel and
    infrequent-country anomaly policies. A positive result indicates a likely account takeover entering
    a collection phase; a negative result reflects a familiar device/location performing routine activity.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (alert when access follows a new-context sign-in within 30 minutes; baseline 90
    days)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=SignInLogs ResultType=0 (interactive)

      | lookup user_baseline UserPrincipalName OUTPUT known_devices, known_ips, known_asns, known_countries

      | eval new_context=if(DeviceId NOT IN known_devices OR IPAddress NOT IN known_ips OR ASN NOT IN
      known_asns OR Country NOT IN known_countries,1,0)

      | where new_context==1

      | join type=inner UserPrincipalName, SessionId [ search source IN (OfficeActivity,MailItemsAccessed,SharePointFileOperation,MicrosoftGraphActivityLogs)
      Operation IN ("MailItemsAccessed","SearchStarted","FileDownloaded","FileAccessed","MessageRead")
      OR RequestUri IN ("/me/messages","/users","/drive") ]

      | where access_time - signin_time <= 30m

      | alert'
- question: Did a compromised account use a content-access operation, client application, AppId/Graph
    endpoint, user-agent, or resource owner that has never before been observed for that account (first-seen
    behavior)?
  context: Reconnaissance via a stolen identity frequently surfaces as activity the legitimate user has
    simply never done before - a new mail client, a never-before-used Graph endpoint, or access to a resource
    owner with whom the account has no history. Maintain a per-user allow-set of previously observed client
    apps, AppIds/Graph endpoints, user-agents, and resource owners, then alert when a session introduces
    a content-access operation, application, or endpoint that is first-seen for that account. Adapt the
    lookback first-seen pattern of the Netflix CloudTrail Anomaly Detector to Entra/Graph telemetry and
    corroborate with Sentinel UEBA first-time-action enrichments. A positive result flags behavior the
    identity has never exhibited; a negative result confirms activity consistent with established patterns.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (maintain a rolling per-user allow-set; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (OfficeActivity,MailItemsAccessed,SharePointFileOperation,MicrosoftGraphActivityLogs)
      earliest=-90d

      | inputlookup append=t user_allowset.csv

      | eval fs_app=if(NOT [UserId,ClientAppId] IN allow_apps,1,0)

      | eval fs_endpoint=if(NOT [UserId,RequestUri] IN allow_endpoints,1,0)

      | eval fs_agent=if(NOT [UserId,UserAgent] IN allow_agents,1,0)

      | eval fs_owner=if(NOT [UserId,ResourceOwner] IN allow_owners,1,0)

      | where fs_app=1 OR fs_endpoint=1 OR fs_agent=1 OR fs_owner=1

      | enrich sentinel_ueba first_time_action

      | alert'
- question: Did a single sign-in session touch three or more distinct collaboration services (Exchange
    Online, OneDrive, SharePoint, Teams, Graph) within 60 minutes - especially for an account that does
    not normally use multiple services in that pattern - suggesting a sweep to inventory the victim's
    personal content?
  context: When an adversary inventories what a compromised identity can reach, a single session often
    fans out across multiple collaboration services in quick succession, which differs from most users
    who live mainly in one or two services. Alert when one session touches at least three distinct services
    (Exchange Online, OneDrive, SharePoint, Teams, Graph) within 60 minutes, and raise confidence when
    the account has no normal multi-service pattern. Keep the concrete service-count and time-window thresholds
    as the deterministic floor and tune per tenant without removing them. A positive result indicates
    a cross-service victim sweep characteristic of reconnaissance/collection; a negative result reflects
    ordinary single-service work.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (alert on a 60-minute sliding window per session)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (OfficeActivity,MailItemsAccessed,SharePointFileOperation,MicrosoftGraphActivityLogs)

      | eval service=case(Workload="Exchange","Exchange",Workload="OneDrive","OneDrive",Workload="SharePoint","SharePoint",Workload="MicrosoftTeams","Teams",Workload="Graph","Graph")

      | bin _time span=60m

      | stats dc(service) as services values(service) as svc_list by UserId, SessionId, _time

      | where services >= 3

      | lookup user_baseline UserId OUTPUT normal_multiservice | where normal_multiservice=0

      | alert'
- question: Within a session, did the volume of mailbox items accessed, files previewed or downloaded,
    distinct collaboration sites touched, or the hour-of-day profile exceed the user's trailing-30-day
    95th percentile or a robust MAD-based modified Z-score greater than 3.5?
  context: Bulk gathering of victim data shows up as a content-access volume that departs sharply from
    the user's own norm. Baseline per user the count of mailbox items accessed, files previewed/downloaded,
    distinct collaboration sites touched, and the hour-of-day profile over a trailing 30-day window. Alert
    when a session exceeds the 95th percentile OR a robust modified Z-score (median absolute deviation
    based) greater than 3.5, which resists distortion from periodic bulk jobs. Derive each tenant's thresholds
    from its own 30-90 day history and report the observed value alongside the baseline percentile in
    the alert. A positive result means the identity is accessing far more content than it normally does;
    a negative result reflects volumes consistent with the user's history.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (baseline 30-90 days; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (MailItemsAccessed,SharePointFileOperation,OfficeActivity) earliest=-90d

      | stats count as items dc(FileId) as files dc(SiteUrl) as sites by UserId, SessionId, date_hour

      | eventstats median(items) as med p95(items) as p95 by UserId

      | eval mad=`median_abs_dev(items)`, mz=0.6745*(items-med)/mad

      | where abs(mz) > 3.5 OR items > p95

      | eval detail="observed=".items." baseline_p95=".p95

      | alert'
- question: Does a seasonal time-series forecast of each user's expected hourly content-access volume
    produce residuals that exceed the forecast confidence band, indicating spikes that a static percentile
    threshold would miss?
  context: Static percentile thresholds miss spikes that occur during a user's normally busy hours or
    that ride on top of cyclical business activity. Forecast each user's expected hourly content-access
    volume with seasonal time-series decomposition (e.g., STL) and alert when the observed value falls
    outside the forecast confidence band. This catches out-of-band bursts as residuals after business-hour
    and batch seasonality are removed. In the Reconnaissance tactic, an abnormal residual indicates the
    identity is pulling content at a rate the model did not expect for that time, a hallmark of collection.
    Report the forecast, the band, and the observed value so analysts can judge severity.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (train forecast on 30-90 days; score hourly)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (MailItemsAccessed,SharePointFileOperation,OfficeActivity) earliest=-90d

      | timechart span=1h count as volume by UserId

      | stl_decompose(volume) -> trend, seasonal, resid, conf_band

      | eval anomaly=if(abs(resid) > conf_band,1,0)

      | where anomaly==1

      | eval detail="observed=".volume." forecast=".(trend+seasonal)

      | alert'
- question: Even when raw volume stays moderate, does access originate from unusual client apps, device
    states, ASNs, or geographies for that user, such that a multi-feature per-user anomaly profile flags
    deviations across several weak indicators?
  context: Careful adversaries keep volume low to evade thresholds, so weak signals must be combined.
    Score whether access originates from unusual client apps, device compliance/join states, ASNs, or
    geographies for that specific user, using a multi-model per-feature anomaly profile (as in Kruegel
    and Vigna's web-attack anomaly work) that aggregates several individually weak deviations into a meaningful
    score. Combine with peer-group deviation scoring from Sentinel UEBA so an identity that diverges from
    comparable peers is highlighted. A positive result indicates context that is subtly abnormal across
    multiple dimensions even at modest volume; a negative result indicates the access context matches
    the user's and peers' norms.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (build per-feature profiles over 30-90 days; score per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (SignInLogs,OfficeActivity,MicrosoftGraphActivityLogs) earliest=-90d

      | eval feats=[ClientApp,DeviceState,ASN,Country,ResourceOwner]

      | score per_feature_anomaly(feats) by UserId -> f_scores

      | eval combined=sum(f_scores)

      | enrich sentinel_ueba peer_deviation -> peer_score

      | where combined > thr OR peer_score > thr

      | alert'
- question: Did a user exhibit a burst of failed sign-ins, AccessDenied/403 Graph responses, throttling
    (429), or ItemNotFound (404) errors that deviates from their normal error ratio, indicating broad
    enumeration that hits permission or rate limits during harvesting?
  context: Enumeration that scans broadly frequently bumps into permission boundaries and rate limits,
    producing a distinct failure-mode signal that often precedes or accompanies successful harvesting.
    Profile per-user rates of failed sign-ins, AccessDenied/403 Graph responses, throttling (429), and
    ItemNotFound (404) as their own signal rather than folding them into success metrics. Baseline the
    normal error ratio per user and alert on sharp increases, especially alongside risky sign-in context.
    A positive result suggests the identity is probing the edges of what it can access (consistent with
    reconnaissance/collection by a compromised account); a negative result reflects normal, well-scoped
    activity with few errors.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (baseline error ratio over 30-90 days; alert on bursts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (SignInLogs,MicrosoftGraphActivityLogs,OfficeActivity) earliest=-90d

      | eval is_err=if(ResultType!=0 OR ResponseStatusCode IN (403,429,404),1,0)

      | stats count as total sum(is_err) as errors by UserId, SessionId

      | eval err_ratio=errors/total

      | eventstats median(err_ratio) as med by UserId

      | eval mz=0.6745*(err_ratio-med)/`mad(err_ratio)`

      | where abs(mz) > 3.5 AND risky_signin=1

      | alert'
- question: Does an unsupervised per-user-session model (Isolation Forest / One-Class SVM) over sign-in
    risk, device/geo novelty, content volume, distinct-owner count, service progression, and error rate
    separate adversary-driven collection from legitimate travel or project work, with the top contributing
    features surfaced for triage?
  context: Single thresholds cannot tell adversary collection apart from a legitimate user who is travelling
    or starting an intense project, so model the whole session shape. Train an unsupervised per-user-session
    detector (Isolation Forest or One-Class SVM) on features including sign-in risk, device/geo novelty,
    content volume, distinct-owner count, service progression, and error rate, using an explainable robust
    configuration. Validate the detector against labeled harvesting scenarios in the CMU SEI CERT Insider
    Threat Test Dataset, and surface the top-3 contributing features (e.g., SHAP) in every alert. A high
    anomaly score points to a session whose collection behavior is structurally unusual; explainable features
    tie the score back to concrete evidence for the analyst.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (train on 30-90 days of sessions; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Per-user-session unsupervised collection model

      featurize session by UserId: [signin_risk, device_geo_novelty, content_volume, distinct_owner_count,
      service_progression, error_rate]

      | score isolation_forest OR one_class_svm -> anomaly_score, shap_top3

      | where anomaly_score > threshold

      | emit UserId, SessionId, anomaly_score, shap_top3'
- question: Does a dynamic graph model of users, services, and activities (or users-roles-resources-actions)
    flag a compromised identity fanning out across mailboxes and sites with which it has no normal relationship?
  context: Cross-service fan-out into resources an identity has no historical relationship with is best
    captured by graph models that understand who normally touches what. Model users, services, and activities
    (or users-roles-resources-actions) as a dynamic graph and learn embeddings to flag a compromised identity
    that suddenly reaches into mailboxes and sites outside its normal neighborhood, as in CS-GAD and GNN-based
    IAM threat detection. Features include resource ownership relationships, access ordering, and correlation
    with subsequent collection. In the Reconnaissance tactic, a high graph anomaly score indicates an
    account establishing improbable new edges to victim content - a strong precursor to focused collection.
    Surface the contributing edges/features per alert.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (build graph over 30-90 days; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Dynamic user-service-activity graph embeddings

      build_graph(nodes=[user, service, resource_owner, action], edges=access, window=90d)

      | score cs_gad(session) -> fanout_score

      | score iam_gnn(new_edge=user->resource_owner) -> improbable_edge

      | where fanout_score > thr OR improbable_edge > thr

      | emit UserId, contributing_edges'
- question: Does a sequence model of each user's normal ordered M365/Graph audit operations flag improbable
    next-events (top-k deviation), catching enumeration orderings that volume thresholds miss?
  context: Adversaries often perform the same operations as users but in an unusual order, so the sequence
    of actions carries signal that raw counts do not. Learn each user's normal ordered sequence of M365/Graph
    audit operations with an LSTM/sequence model (DeepLog-style) and flag improbable next-events using
    top-k deviation; a complementary variable-order Markov session model scores sequence plausibility
    with Bayesian credible intervals. This catches enumeration orderings - e.g., a methodical walk across
    folders, sites, and Graph endpoints - that volume thresholds miss. A positive result highlights a
    session whose action ordering is structurally improbable for that identity and warrants triage; a
    negative result indicates the operation sequence matches learned norms.
  answer_sources:
  - Entra ID SignInLogs
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - 'NAI: High-value user accounts, mailboxes, OneDrive sites, Teams workspaces, and collaboration tenants
    storing sensitive data or executive communications'
  range: Last 90 days (train on 30-90 days of sequences; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Per-user ordered M365/Graph operation sequence model

      model deeplog_next_key(sequence=ordered Operation by UserId)

      | eval seq_anomaly=(observed_next NOT IN top_k_predictions)

      | score vomm_session_plausibility -> seq_prob, credible_interval

      | where seq_anomaly==1 OR seq_prob < lower_credible_bound

      | emit UserId, SessionId, improbable_ops'
- question: Did one session repeatedly access sensitivity-labeled or executive/legal/finance mail folders,
    download many files (for example more than 50 in 10 minutes, tuned per tenant) from a small set of
    high-value SharePoint/OneDrive locations, or run eDiscovery/compliance searches scoped to specific
    people?
  context: Once an adversary knows what a compromised account can reach, collection narrows onto the content
    that matters. Alert when a single session repeatedly accesses sensitivity-labeled or executive/legal/finance
    mail folders, downloads many files (e.g., more than 50 in 10 minutes, tuned per tenant) from a small
    set of high-value SharePoint/OneDrive locations, or runs eDiscovery/compliance searches scoped to
    specific people. Encode as deterministic rules over OfficeActivity/SharePointFileOperation/MailItemsAccessed
    and pair with Defender for Cloud Apps unusual mass-download and unusual eDiscovery anomaly policies.
    Keep the concrete download/time floor as the deterministic baseline. A positive result indicates focused
    high-value collection; a negative result reflects ordinary, dispersed access.
  answer_sources:
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - Defender for Cloud Apps
  - 'NAI: Executive mailboxes, legal and finance document stores, merger or incident response workspaces,
    and users tied to privileged business processes'
  range: Last 90 days (alert on a 10-minute sliding window; tune the per-tenant floor)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (OfficeActivity,SharePointFileOperation,MailItemsAccessed)

      | eval high_value=if(SensitivityLabel!="" OR FolderPath MATCH "(?i)exec|legal|finance" OR SiteUrl
      IN hv_sites,1,0)

      | bin _time span=10m

      | stats count(eval(Operation="FileDownloaded")) as downloads dc(SiteUrl) as sites count(eval(Operation="SearchStarted"))
      as ediscovery by UserId, SessionId, _time

      | where (downloads > 50 AND sites <= 3) OR ediscovery_scoped_to_person=1 OR high_value_folder_repeat=1

      | correlate mcas mass_download, unusual_ediscovery

      | alert'
- question: Did the actor search, preview, or export only specific executives, legal matters, incident
    artifacts, or finance content - including first-seen access to high-value owners the account has no
    prior relationship with - rather than browsing broadly, indicating intentional triage?
  context: 'Deliberate triage looks different from browsing: the actor goes straight to specific high-value
    people and matters. Detect patterns where a session searches/previews/exports content tied to particular
    executives, legal matters, incident artifacts, or finance owners - especially first-seen access to
    high-value owners with whom the account has no prior relationship - rather than dispersed activity.
    Corroborate with Sentinel UEBA first-time-action and peer-deviation enrichments. In the Reconnaissance/collection
    context, this selective targeting indicates the adversary already knows what it wants. A positive
    result flags intentional triage of sensitive owners; a negative result reflects access consistent
    with the user''s established working relationships.'
  answer_sources:
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - Defender for Cloud Apps
  - 'NAI: Executive mailboxes, legal and finance document stores, merger or incident response workspaces,
    and users tied to privileged business processes'
  range: Last 90 days (evaluate per session; first-seen owner lookback up to 90 days)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (OfficeActivity,MailItemsAccessed,SharePointFileOperation,MicrosoftGraphActivityLogs)

      | lookup hv_owners ResourceOwner OUTPUT is_exec, is_legal, is_finance, is_incident

      | inputlookup append=t user_owner_history.csv

      | eval first_seen_owner=if(NOT [UserId,ResourceOwner] IN known_owners,1,0)

      | where (is_exec OR is_legal OR is_finance OR is_incident) AND first_seen_owner=1 AND Operation
      IN ("SearchStarted","FilePreviewed","FileDownloaded","MailItemsAccessed")

      | enrich sentinel_ueba first_time_action, peer_deviation

      | alert'
- question: Is the fraction of content touches involving executive/finance/legal/incident data in a session
    unusually high compared with the user's historical fraction, even at moderate absolute volume?
  context: Concentration on sensitive material is itself a signal independent of how much was accessed.
    Compare the fraction of content touches involving executive/finance/legal/incident data in a session
    against the user's historical fraction, and flag sessions whose activity is unusually concentrated
    on high-value information even at moderate absolute volume. Use a robust MAD-based modified Z-score
    to avoid bulk-job false positives. Report the observed sensitivity fraction, the user's baseline,
    and the specific high-value resources so analysts can assess blast radius. A positive result shows
    the account is disproportionately focused on sensitive content; a negative result reflects a normal
    mix of routine and sensitive material.
  answer_sources:
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - Defender for Cloud Apps
  - 'NAI: Executive mailboxes, legal and finance document stores, merger or incident response workspaces,
    and users tied to privileged business processes'
  range: Last 90 days (baseline 30-90 days; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (OfficeActivity,MailItemsAccessed,SharePointFileOperation) earliest=-90d

      | eval sensitive=if(SensitivityLabel!="" OR ResourceOwner IN hv_owners,1,0)

      | stats count as total sum(sensitive) as sens by UserId, SessionId

      | eval sens_frac=sens/total

      | eventstats median(sens_frac) as med by UserId

      | eval mz=0.6745*(sens_frac-med)/`mad(sens_frac)`

      | where abs(mz) > 3.5

      | table UserId sens_frac med high_value_resources | alert'
- question: Does a session concentrate on a small number of high-value users, teams, or sites more tightly
    than the user's normal work pattern (measured by Gini/entropy of the accessed-owner distribution),
    especially alongside risky sign-in context and elevated forecast residuals?
  context: When an adversary triages, the distribution of accessed owners narrows compared to a user's
    normal spread. Measure whether a session concentrates on a small set of high-value users/teams/sites
    more tightly than the user's norm using the Gini coefficient or entropy of the accessed-owner distribution.
    Escalate when concentration rises sharply alongside risky sign-in context and elevated forecast residuals
    (per time-series modeling). A positive result indicates an owner-concentration shift consistent with
    targeted collection; a negative result reflects the user's usual breadth of access. Report the concentration
    metric, the baseline, and the dominant owners.
  answer_sources:
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - Defender for Cloud Apps
  - 'NAI: Executive mailboxes, legal and finance document stores, merger or incident response workspaces,
    and users tied to privileged business processes'
  range: Last 90 days (baseline 30-90 days; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (OfficeActivity,MailItemsAccessed,SharePointFileOperation) earliest=-90d

      | stats count by UserId, SessionId, ResourceOwner

      | eval concentration=gini(count) // or entropy

      | eventstats median(concentration) as med by UserId

      | eval mz=0.6745*(concentration-med)/`mad(concentration)`

      | where abs(mz) > 3.5 AND (risky_signin=1 OR high_forecast_residual=1)

      | table UserId concentration dominant_owners | alert'
- question: Did a user exhibit a spike in denied or blocked operations during selective collection - AccessDenied
    on protected mailboxes/sites, DLP-blocked downloads, sharing-policy denials, or 403/404 Graph responses
    - that deviates from their normal denial ratio, indicating probing of high-value targets beyond its
    permissions?
  context: 'Probing high-value content the account cannot fully reach produces a distinct burst of denials
    that frequently precedes a successful export. Profile per-user rates of denied/blocked operations
    during selective collection: AccessDenied on protected mailboxes/sites, DLP-blocked downloads, sharing-policy
    denials, and 403/404 Graph responses. Treat this as its own signal, baseline the normal denial ratio,
    and alert on sharp increases. A positive result suggests an actor testing the boundaries of its access
    against high-value targets (export-prep failure mode); a negative result indicates well-scoped, unimpeded
    activity. Correlate with the focused-collection rules to prioritize sessions where probing and successful
    access co-occur.'
  answer_sources:
  - OfficeActivity
  - MailItemsAccessed
  - SharePointFileOperation
  - MicrosoftGraphActivityLogs
  - Defender for Cloud Apps
  - 'NAI: Executive mailboxes, legal and finance document stores, merger or incident response workspaces,
    and users tied to privileged business processes'
  range: Last 90 days (baseline denial ratio over 30-90 days; alert on bursts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (OfficeActivity,SharePointFileOperation,MicrosoftGraphActivityLogs) earliest=-90d

      | eval denied=if(ResultStatus="Failed" OR Operation IN ("DLPRuleMatch","SharingDenied") OR ResponseStatusCode
      IN (403,404),1,0)

      | stats count as total sum(denied) as denials by UserId, SessionId

      | eval denial_ratio=denials/total

      | eventstats median(denial_ratio) as med by UserId

      | eval mz=0.6745*(denial_ratio-med)/`mad(denial_ratio)`

      | where abs(mz) > 3.5

      | alert'
