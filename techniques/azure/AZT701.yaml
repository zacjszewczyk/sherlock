name: 'AZT701: SAS URI Generation'
id: 77d55c39-21d8-4ffe-a21a-5abfb70bfa0c
description: Investigate adversary generation of Azure Shared Access Signature (SAS) URIs and tokens that
  grant time-bounded but credential-less access to managed disks and Azure Storage (accounts, containers,
  file shares), which can enable bulk data theft, unauthorized overwrite, or destructive deletion. This
  playbook helps an analyst detect management-plane disk export operations (Microsoft.Compute/disks/beginGetAccess/action),
  auditable storage SAS issuance (listAccountSas, generateUserDelegationKey), and SAS-authenticated data-plane
  activity. It covers high-fidelity rule-based alerts on risky issuance and policy-violating SAS scope,
  statistical baselining of export/access rarity, volume, frequency, failure rates, issuer-to-consumer
  divergence, and high-value asset exposure scoring, as well as machine-learning sequence, clustering,
  and classifier models that separate legitimate break-glass recovery and operational sharing from adversary-led
  export preparation and low-and-slow exfiltration.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any principal invoke the management-plane disk export operation Microsoft.Compute/disks/beginGetAccess/action
    to mint a time-bounded SAS export URI for a managed disk, especially for a high-value workload, with
    an excessive duration, or following risky activity?
  context: 'This is the deterministic floor for detecting disk-level data theft or destructive staging
    under the Impact tactic. The beginGetAccess action mints a SAS URI that allows the raw VHD of a managed
    disk to be downloaded without further authentication, bypassing normal administration and recovery
    workflows. Treat the event as high-fidelity when the caller is an interactive user rather than the
    backup/Azure Site Recovery service principal, when the disk belongs to a sensitive VM, when requested
    durationInSeconds exceeds the org standard (for example >3600s), or when the call follows risky sign-in,
    new role assignment, or VM shutdown. A positive result means an analyst should immediately confirm
    whether the export was an approved break-glass recovery or unauthorized exfiltration preparation.
    References: [Data from Cloud Storage T1530, MITRE ATT&CK](https://attack.mitre.org/techniques/T1530/);
    [Security recommendations for Blob storage, Microsoft](https://learn.microsoft.com/en-us/azure/storage/blobs/security-recommendations).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days, prioritizing disk export operations from the last 24 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH AzureActivity WHERE OperationName=='Microsoft.Compute/disks/beginGetAccess/action';
      ALERT when caller NOT IN backup_or_asr_service_principals AND (disk IN high_value_workloads OR durationInSeconds>3600
      OR recent_risky_signin OR recent_role_assignment OR recent_vm_shutdown); OUTPUT caller, disk, subscription,
      durationInSeconds, correlated_event.
- question: Is a managed-disk SAS generation correlated with first-seen sign-ins, rare administrative
    devices, or new outbound network paths in NSG Flow Logs from recovery infrastructure to the disk SAS
    endpoint?
  context: 'Adversaries who abuse disk export rarely originate from the same sanctioned break-glass context
    as legitimate recovery operators. Correlating the beginGetAccess event with Entra first-seen sign-ins,
    unfamiliar admin devices, and new NSG Flow Log egress paths toward the SAS endpoint distinguishes
    approved recovery from an export session that departs from established handling. Under the Impact
    tactic this matters because an unfamiliar source consuming a disk SAS is a strong signal of staged
    data theft. A positive result is a disk export whose source identity, device, or network path has
    never been seen for that disk or workflow. References: [Detections in the Sky: Sigma Rules for Cloud
    Security, Recorded Future](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days, with a 24-hour correlation window between issuance and source telemetry.
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN AzureActivity(beginGetAccess) TO Entra_Signin AND NSG_Flow_Logs ON caller/principal, time_window<=24h;
      FLAG when signin first_seen_for_principal OR device NOT IN known_admin_devices OR egress_path NOT
      IN approved_breakglass_paths TO disk_SAS_endpoint; OUTPUT caller, src_ip, device, disk, path.
- question: Is a managed-disk SAS export rare relative to baselines of subscription, disk owner team,
    principal, time-of-day, and requested duration, such as a first-seen export per principal or duration
    above the 95th percentile of recovery operations?
  context: 'Most disk exports cluster around a small set of recovery operators and durations, so first-seen
    or extreme-duration exports stand out statistically. Baseline beginGetAccess events over 90 days of
    AzureActivity by subscription, owner team, principal, time-of-day, and durationInSeconds, then flag
    first-seen exports per principal/subscription and durations or frequencies above the 95th percentile.
    Start at p95 and tune toward roughly one alert per analyst-day. Under Impact this surfaces export
    behavior that deviates from the organization''s own recovery norms, indicating possible theft preparation.
    References: [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days, deriving percentile thresholds from 90 days of AzureActivity.
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE beginGetAccess over 90d BY subscription, owner_team, principal, hour_of_day, durationInSeconds;
      FLAG first_seen export per principal/subscription OR durationInSeconds>p95 OR export_frequency>p95;
      OUTPUT principal, disk, duration, percentile_rank.
- question: Where disk export traffic traverses logged paths, do per-session byte totals, GET/range request
    frequency, or transfer rate from the disk SAS endpoint exceed the per-team 95th percentile, including
    dribbled low-and-slow exports?
  context: 'Byte movement is the hard physical signature of disk exfiltration. Where export traffic is
    observable, profile Volume (total bytes pulled from the disk SAS endpoint), Frequency (GET/range requests
    per minute), and rate, then alert on per-session byte totals above the per-team 95th percentile. Apply
    low-and-slow cumulative baselining so an adversary pulling a disk image slowly over time is not missed.
    Under Impact, large or sustained extraction from a disk SAS endpoint is direct evidence of data theft
    rather than benign verification. References: [Real-Time Detection of DNS Exfiltration and Tunneling,
    Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf); [Detection of Malicious and
    Low Throughput Data Exfiltration, Nadler et al](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days, with per-session aggregation and cumulative low-and-slow windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each disk_SAS_session: compute bytes_total, requests_per_min, transfer_rate; ALERT when
      bytes_total>per_team_p95 OR cumulative_bytes over rolling_window>p95; OUTPUT session_id, principal,
      disk, bytes_total, requests_per_min.'
- question: When each disk export is weighted by workload criticality, prior export history for that disk,
    caller familiarity, and peer-group behavior, do any SAS issuances produce a combined exposure score
    materially above normal recovery activity?
  context: 'Not every disk export carries equal risk; a first-ever 24-hour export of a high-criticality
    disk by an unfamiliar caller is far more concerning than a routine recovery. Combine workload criticality,
    the disk''s prior export history, caller familiarity, and UEBA peer-group behavior into a single weighted
    exposure score and prioritize issuances scoring well above normal recovery. Surface the top-3 contributing
    factors (for example ''first export for this disk'', ''duration 24h'', ''criticality=high'') so the
    analyst can triage quickly. Under Impact this focuses attention on the exports most likely to represent
    theft of sensitive data. References: [Identify advanced threats with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days, scoring each new disk export against historical baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: score = w1*workload_criticality + w2*(1/prior_export_count) + w3*(1-caller_familiarity) + w4*peer_group_deviation;
      ALERT when score>recovery_baseline_threshold; OUTPUT disk, caller, score, top3_contributing_factors.
- question: Are there bursts of AuthorizationError, SASNetworkError (signed-IP or protocol violations),
    or 403 responses against disk and storage SAS endpoints, particularly a run of failures immediately
    followed by a successful export?
  context: 'Failed SAS access is a distinct and valuable signal because probing precedes success. Track
    AuthorizationError, SASNetworkError (signed-IP/protocol violations), and forbidden 403 responses against
    disk/storage SAS endpoints; a burst of failures followed by a success indicates an actor testing scope/IP
    restrictions or relocating the consumer of a stolen URI. Under Impact this helps catch theft attempts
    in the reconnaissance/probing phase before bulk extraction succeeds. A positive result is a failure
    spike from one source or token immediately preceding an authorized-looking success. References: [Monitor,
    diagnose, and troubleshoot Azure Storage, Microsoft](https://learn.microsoft.com/en-us/azure/storage/common/storage-monitor-troubleshoot-storage-application).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days, with short windows linking failure bursts to subsequent success.
  queries:
  - technology: SIEM/Stats pseudocode
    query: PROFILE SAS endpoint responses BY token/source_ip => count(AuthorizationError), count(SASNetworkError),
      count(403); ALERT when failure_burst (>=N in T) is followed by success within T2; OUTPUT token,
      source_ip, failure_count, success_time.
- question: Does a causal session sequence model (identity sign-in -> management-plane disk export ->
    downstream storage/network egress) score a disk export's full path as rare, indicating data theft
    or destructive staging rather than recovery?
  context: 'Individual events can look benign, but the ordered causal path from sign-in through disk export
    to downstream egress reveals theft. Model the session sequence and score full-path rarity, flagging
    exports whose end-to-end path diverges from legitimate recovery, and show the contributing path steps
    in the alert. Under Impact this catches multi-stage exfiltration chains that no single rule would
    flag. A positive result is a high path-rarity score with a coherent sign-in-to-egress chain pointing
    to data theft or destructive preparation. References: [Hopper: Modeling and Detecting Lateral Movement,
    Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days for training, with current disk-export sessions scored as causal paths.
  queries:
  - technology: ML pipeline pseudocode
    query: seq = build_session_path(entra_signin, disk_export(beginGetAccess), downstream_egress); score
      = path_rarity_model.score(seq); ALERT when score>=threshold; OUTPUT path_steps, principal, disk,
      score.
- question: Does a supervised classifier trained on actor history, disk sensitivity, export duration,
    byte volume, failure rate, and adjacent operations separate legitimate break-glass disk handling from
    adversary-led export preparation?
  context: 'A trained classifier can weigh many weak signals at once to distinguish routine recovery from
    theft preparation. Train on actor history, disk sensitivity, export duration, byte volume, failure
    rate, and adjacent operations, validate against labeled exfiltration scenarios, and emit the top-3
    feature contributions per prediction. Keep the deterministic disk-export rules running in parallel
    as the floor of determinism. Under Impact this prioritizes the exports most consistent with adversary
    behavior. A positive result is a high theft-class probability whose feature attributions an analyst
    can verify. References: [CERT Insider Threat Test Dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - NSG Flow Logs
  - StorageBlobLogs
  - 'NAI: Managed disks attached to sensitive virtual machines, disk export workflows, and identities
    with disk access permissions'
  range: Last 90 days for feature history, with live scoring of new disk exports.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[actor_history, disk_sensitivity, export_duration, byte_volume, failure_rate, adjacent_ops];
      prob = recovery_vs_theft_model.predict_proba(features); ALERT when prob_theft>=0.85; OUTPUT prob,
      top_feature_contributions; RUN deterministic_rules in parallel.
- question: Was an auditable storage SAS issued via listAccountSas or generateUserDelegationKey, and is
    subsequent SAS-authenticated data-plane access (AuthenticationType == SAS) coming from new IPs, anonymous-style
    clients, or user agents not normally tied to the issuing identity?
  context: 'Some SAS issuance is auditable: listAccountSas and generateUserDelegationKey (the latter signed
    with Entra credentials) appear in logs, while account/service SAS are signed locally with no issuance
    event, making the SAS-authenticated data plane the primary evidence. Correlate auditable issuance
    with downstream data-plane access where AuthenticationType==SAS from new IPs, anonymous-style clients,
    or unfamiliar user agents. Under Impact this links the act of minting broad access to the act of bulk
    reading or modifying regulated data. A positive result is SAS-authenticated access from a source that
    does not match the issuing identity''s norms. References: [Grant limited access to Azure Storage with
    SAS, Microsoft](https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview); [Storage
    Anomalous Access analytic rule, Microsoft Sentinel](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Azure%20Storage/Analytic%20Rules/StorageAnomalousAccessAlerts.yaml).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, correlating issuance with SAS-authenticated data-plane access.
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN AzureActivity(listAccountSas OR generateUserDelegationKey) TO StorageBlobLogs/StorageFileLogs
      WHERE AuthenticationType=='SAS' ON account, time_window; ALERT when consumer source_ip/user_agent
      first_seen OR anonymous_style AND NOT tied_to_issuer; OUTPUT issuer, account, consumer_ip, user_agent.
- question: Did any SAS or container configuration change violate the storage hardening baseline, such
    as anonymous/public-read enabled, account-level or write/delete/add/create permissions, no signed
    IP range, or expiry beyond the org limit?
  context: 'Over-permissioned or unrestricted SAS dramatically broadens data exposure. Treat as high-fidelity
    any SAS or container change that breaks the hardening baseline: anonymous/public-read enabled, account-level
    or write/delete/add/create permissions, missing signed IP range, or expiry beyond the org limit, and
    alert specifically on container public-access changes. Under Impact, such scope expansion is precisely
    what enables unauthorized bulk read, overwrite, or deletion of regulated data. A positive result is
    an issued SAS or container change that exceeds policy and should be revoked and investigated. References:
    [Security recommendations for Blob storage, Microsoft](https://learn.microsoft.com/en-us/azure/storage/blobs/security-recommendations);
    [Azure Blob Container Access Level Modification, Sigma](https://detection.fyi/sigmahq/sigma/cloud/azure/azure_blob_container_access_level_modification/).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, prioritizing recent container access-level and SAS scope changes.
  queries:
  - technology: SIEM/Rule pseudocode
    query: DETECT SAS issuance or container change WHERE public_access_enabled OR permissions IN [account,write,delete,add,create]
      OR signed_ip_range IS NULL OR expiry>org_limit; ALERT (high-fidelity); OUTPUT principal, account/container,
      permissions, expiry, signed_ip.
- question: Is a broad SAS (write/delete or account-level) rapidly followed by listing, download, overwrite,
    or delete activity against sensitive containers or file shares?
  context: 'The tightest signal of SAS abuse is a broad token immediately put to work. Alert when write/delete
    or account-level SAS is rapidly followed by list, download, overwrite, or delete operations against
    sensitive containers/shares, which matches exfiltration and destructive-impact transfer patterns.
    Under Impact this captures both data theft (mass download) and integrity/availability attacks (mass
    overwrite/delete). A positive result is a short interval between broad issuance and high-impact data-plane
    operations on regulated data. References: [Exfiltration to Cloud Storage T1567.002, MITRE ATT&CK](https://attack.mitre.org/techniques/T1567/002/).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, with short issuance-to-use correlation windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN broad_SAS_issuance(write/delete/account) TO data_plane_ops ON account, time_window<=short;
      ALERT when ops IN [ListBlobs, GetBlob(download), PutBlob(overwrite), DeleteBlob] on sensitive_container;
      OUTPUT principal, account, op_sequence, byte_volume.
- question: Across permission scope, expiry duration, source IP, and target container, are there first-seen
    IPs or containers, or bursts of SAS token creation or access spanning multiple containers, that deviate
    from the storage account and caller baseline?
  context: 'Baseline SAS-authenticated access per storage account and caller across permission scope,
    expiry duration, source IP, and target container, then flag first-seen IPs/containers and bursts of
    token creation or access across many containers. Derive thresholds from 30-90 days of StorageBlobLogs/StorageFileLogs.
    Under Impact this surfaces access patterns that depart from operational norms, which often signals
    an actor enumerating and pulling data broadly. A positive result is access from a never-before-seen
    IP/container combination or a fan-out across containers inconsistent with the caller''s history. References:
    [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly); [Storage
    Anomalous Access analytic rule, Microsoft Sentinel](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Azure%20Storage/Analytic%20Rules/StorageAnomalousAccessAlerts.yaml).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, deriving thresholds from 30-90 days of storage diagnostic logs.
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE SAS access BY account, caller across permission_scope, expiry, source_ip, container;
      FLAG first_seen source_ip OR container OR burst(token_creation/access across>=N containers); OUTPUT
      caller, account, new_ips, container_count.
- question: Do storage SAS sessions show per-session bytes above the per-account 95th percentile, abnormal
    GetBlob/ListBlobs frequency, skewed read:write ratios, or mass-delete/overwrite bursts, including
    dribbled low-and-slow exfiltration?
  context: 'Compute Volume (sum ResponseBodySize per SAS session), Frequency (GetBlob/ListBlobs per minute),
    read:write ratio, and State (Success vs AuthorizationError/SASNetworkError) from storage diagnostic
    logs. Alert on per-session bytes above the per-account 95th percentile and on mass-delete/overwrite
    bursts, applying low-and-slow cumulative baselining for dribbled exfiltration. Under Impact, high
    volume signals theft while delete/overwrite bursts signal destructive impact. A positive result is
    a session whose byte volume, request rate, or destructive operation count is statistically extreme
    for that account. References: [Monitor, diagnose, and troubleshoot Azure Storage, Microsoft](https://learn.microsoft.com/en-us/azure/storage/common/storage-monitor-troubleshoot-storage-application);
    [Real-Time Detection of DNS Exfiltration and Tunneling, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf);
    [Detection of Malicious and Low Throughput Data Exfiltration, Nadler et al](https://arxiv.org/abs/1709.08395).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, with per-session aggregation and cumulative low-and-slow windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each SAS_session: bytes=sum(ResponseBodySize), freq=ops_per_min, rw_ratio=reads/writes,
      state=success_vs_error; ALERT when bytes>account_p95 OR delete/overwrite_burst>p95 OR cumulative_bytes>p95;
      OUTPUT session, account, bytes, freq, rw_ratio, delete_count.'
- question: How often is the entity creating a SAS also the entity consuming it, and are there sessions
    where issuer and consumer IP, device, geography, or peer group sharply diverge from historical norms?
  context: 'Legitimate SAS is often created and consumed by the same operational context; theft frequently
    splits issuance from consumption. Measure issuer-to-consumer distance and prioritize sessions where
    the consuming IP, device, geography, or peer group sharply diverges from history, surfacing the divergence
    in the alert. Under Impact a large issuer-consumer gap suggests a token was handed to or stolen by
    a different actor. A positive result is SAS consumption far removed from where and how the token was
    issued. References: [Identify advanced threats with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [IMDS Anomaly Hunting Zero-Day Discovery, Wiz](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, comparing issuer and consumer attributes against historical norms.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each SAS token: compare issuer vs consumer on source_ip, device, geo, peer_group; score
      = divergence(issuer, consumer); ALERT when score>historical_norm; OUTPUT token, issuer_attrs, consumer_attrs,
      divergence.'
- question: Are there spikes in AuthorizationError, SASNetworkError (signed-IP/HTTPS violations), or 403/404
    responses per token and source IP, especially a spike of failed SAS attempts immediately preceding
    a success?
  context: 'Profile AuthorizationError, SASNetworkError (signed-IP/HTTPS violations), and 403/404 rates
    per token and source IP as a distinct signal; a spike of failures preceding a success indicates expiry
    or scope probing or a moved consumer. Under Impact this catches the reconnaissance phase where an
    actor tunes a stolen or guessed SAS before bulk access. A positive result is a per-token or per-source
    failure spike that resolves into a successful data-plane access. References: [Monitor, diagnose, and
    troubleshoot Azure Storage, Microsoft](https://learn.microsoft.com/en-us/azure/storage/common/storage-monitor-troubleshoot-storage-application).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, linking failure spikes to subsequent successful access.
  queries:
  - technology: SIEM/Stats pseudocode
    query: PROFILE storage responses BY token, source_ip => count(AuthorizationError), count(SASNetworkError),
      count(403), count(404); ALERT when failure_spike followed by success within T; OUTPUT token, source_ip,
      failure_counts, success_time.
- question: Does a causal-session model flag rare paths where SAS issuance is rapidly followed by mass
    list/download/overwrite/delete, or where SAS access creates a previously-unseen principal-to-account
    access edge?
  context: 'Model storage management and data-plane events as causal sessions and score rare paths where
    SAS issuance is rapidly followed by mass list/download/overwrite/delete diverging from operational
    patterns, presenting the contributing sequence steps. Also flag SAS access that creates a previously-unseen
    principal-to-account access edge. Under Impact this catches both staged theft and destructive sequences
    as coherent chains. A positive result is a high path-rarity score with a new access edge or a fast
    issuance-to-mass-operation sequence. References: [Hopper: Modeling and Detecting Lateral Movement,
    Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf); [Detecting Structurally Anomalous Logins,
    Siadati and Memon](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days for training, with current SAS sessions scored as causal paths.
  queries:
  - technology: ML pipeline pseudocode
    query: seq = build_storage_session(SAS_issuance, data_plane_ops); score = path_rarity_model.score(seq);
      ALSO flag new principal->account access_edge; ALERT when score>=threshold OR new_edge; OUTPUT path_steps,
      principal, account, score.
- question: Is SAS consumption distributed across many datacenter or Tor source IPs that individually
    stay below volume thresholds but together recover an aggregate bulk exfiltration?
  context: 'Sophisticated actors spread SAS consumption across many low-volume sources to defeat per-session
    thresholds. Cluster distributed SAS consumption spread across many datacenter/Tor source IPs that
    individually stay under volume thresholds, using a low-and-slow clustering approach with failure-rate
    features to recover the aggregate exfiltration. Under Impact this reconstructs theft that hides beneath
    per-source detection floors. A positive result is a cluster of small accesses to the same account/token
    that, in aggregate, constitutes a large unauthorized extraction. References: [Hunting for Low and
    Slow Password Sprays Using Machine Learning, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - StorageFileLogs
  - Entra Sign-in Logs
  - 'NAI: Storage accounts containing regulated data, backup containers, and identities permitted to generate
    SAS tokens'
  range: Last 90 days, clustering distributed SAS consumption across sources.
  queries:
  - technology: ML pipeline pseudocode
    query: vectors = per_source SAS access features [bytes, freq, failure_rate, asn, tor_flag]; cluster
      = low_and_slow_cluster(vectors) grouped by token/account; ALERT when aggregate_bytes_across_cluster>threshold;
