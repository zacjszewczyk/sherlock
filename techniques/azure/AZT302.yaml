name: 'AZT302: Serverless Scripting'
id: 1f637ec5-dc6f-4a11-9f8d-f1bc549f8a4c
description: 'Investigate adversary execution of code in Azure through abuse of serverless and automation
  scripting paths that can act on cloud resources without an interactive logon to the target workload.
  This playbook helps an analyst examine two primary abuse surfaces: (1) Azure Automation Account runbooks
  created, modified, published, or executed to run attacker-controlled PowerShell or Python against Azure
  resources or attached virtual machines via Hybrid Worker Groups, RunAs accounts, or privileged managed
  identities; and (2) Function Apps and related serverless resources whose code or configuration is updated
  so attacker-controlled logic can execute Azure operations, access cloud data, or trigger downstream
  resource actions under the app''s identity. It guides review of the runbook and function deployment
  lifecycle, first-seen identity/IP/target behavior, managed-identity token retrieval and downstream Graph/resource
  operations, script and payload content (entropy, obfuscation, AST features), churn and cold-start anomalies,
  failure-state and authorization patterns indicating trial-and-error abuse, peer-group and privilege-target
  drift, and sequence/graph-based modeling of automation and invocation event streams.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a single runbook move from draft write to publish to job start within a very short window
    (default under five minutes), and was the actor someone who does not normally maintain that automation
    account, or did the runbook target Hybrid Workers, RunAs accounts, or privileged managed identities?
  context: For the Execution tactic (TA0002), adversaries abusing Azure Automation often compress the
    legitimate runbook lifecycle (Microsoft.Automation/automationAccounts/runbooks/write -> .../publish/action
    -> .../jobs/write) into a tight sequence so attacker-controlled script runs immediately. Treat each
    stage as a discrete state and alert when draft, publish, and job-start fire close together for the
    same runbook, especially when the actor is outside the maintainer allowlist or the runbook reaches
    into Hybrid Workers, RunAs accounts, or privileged identities. A positive result is a fast author-to-execute
    chain by an unexpected identity; a negative result is the normal, slower DevOps cadence by a known
    maintainer. Tune latency and the maintainer allowlist per environment but keep the hard thresholds.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, with event-centered correlation across the runbook write/publish/job operations.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'writes = AzureActivity where op==''Microsoft.Automation/automationAccounts/runbooks/write'';

      pubs = AzureActivity where op endswith ''runbooks/publish/action'';

      jobs = AzureActivity where op endswith ''jobs/write'';

      join on runbook_id; alert when (job.ts - write.ts) < 5min

      and (actor not in maintainer_allowlist or target in {HybridWorker, RunAs, privileged_managed_identity});

      output actor, runbook, latency, target.'
- question: After a runbook was edited or newly published, did it rapidly execute on a Hybrid Runbook
    Worker, use a privileged managed identity, or reach into subscriptions and virtual machines outside
    the automation account's normal scope, followed by managed-identity token retrieval and downstream
    resource or Graph operations not previously seen for that account?
  context: This pivot detects the Execution-to-action step where attacker-controlled automation leverages
    the worker host or managed identity to operate on cloud resources without interactive logon. Correlate
    freshly edited/published runbooks with execution on Hybrid Runbook Workers, with use of privileged
    managed identities, and with reach into subscriptions/VMs beyond the account's baseline scope, then
    chain to immediate IMDS/managed-identity token retrieval and to downstream resource or Microsoft Graph
    calls that the account has never made before. A positive result is a new identity-token-then-novel-operation
    chain emanating from an edited runbook; benign maintenance reuses known scopes and tokens. Reuse portable
    Azure detection-as-code as a starting point.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, with event-centered correlation following each runbook publish/job event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'edited = AzureActivity where op in {runbooks/write, runbooks/publish/action};

      exec = AzureDiagnostics JobStreams where runbook in edited and (worker is HybridWorker or identity
      is privileged);

      scope_new = exec.target_subscription_or_vm not in baseline_scope[account];

      token = AzureDiagnostics/host where managed_identity_token_request near exec.ts;

      downstream = AzureActivity|MicrosoftGraphActivityLogs op not in baseline_ops[account];

      alert when edited -> exec(scope_new) -> token -> downstream.'
- question: Is this the first time a given identity or source IP has performed a runbook write, publish,
    or job operation, or the first time a particular runbook executed against a specific subscription
    or resource group?
  context: First-seen analysis surfaces novel Execution activity that rule thresholds miss. Maintaining
    per-identity and per-source-IP histories of runbook write/publish/job operations, and per-runbook
    histories of target subscriptions/resource groups, lets the analyst flag the first occurrence of any
    such edge. Modeled on first-seen source-IP and rare-operation Sigma logic over Azure activity logs,
    a positive result is a never-before-seen actor or target pairing for automation; a negative result
    is recurrence of an established pattern. This is high value because adversaries frequently operate
    from new identities, IPs, or against new scopes.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, baseline window at least 30 days prior to the candidate event.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each event in AzureActivity where op in {runbooks/write,publish,jobs/write}:\n  key1=(actor);\
      \ key2=(source_ip); key3=(runbook,target_subscription_or_rg);\n  if key1 not in hist_identity or\
      \ key2 not in hist_ip or key3 not in hist_target:\n    alert first_seen(actor, source_ip, runbook,\
      \ target);\nupdate histories."
- question: Does the content of a published runbook or PowerShell script block show high entropy, heavy
    obfuscation, or known encoded-command patterns relative to a benign corpus?
  context: Adversaries staging Execution via runbooks frequently obfuscate or base64-encode their scripts
    to evade review. Capturing published runbook/script-block content (PowerShell Event ID 4104) and scoring
    it with character-frequency statistics and tokenizer/AST deviations from a benign corpus provides
    a deterministic pre-filter for malicious drafts. A positive result is a runbook whose entropy or token
    distribution diverges sharply from normal authoring or that contains -enc/FromBase64String/IEX patterns;
    a negative result is plainly readable operational code. This supports triage before the runbook runs
    and helps prioritize the fast-chain and pivot alerts above.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, evaluated at each publish event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'blocks = PowerShell 4104 ScriptBlockText for automation runbooks;

      entropy = shannon_entropy(block); ast_dev = ast_token_distance(block, benign_corpus);

      alert when entropy > corpus_p95 or ast_dev > threshold

      or block matches /-enc|FromBase64String|IEX|char\[\]/;

      output runbook, actor, entropy, matched_pattern.'
- question: Has any automation account's rate of runbook edits, publishes, job starts, target worker groups,
    or script length spiked above its own trailing 30-day 95th percentile or a MAD-based modified Z-score
    of 3.5, or shown unusual compression between editing and execution?
  context: Volumetric and timing anomalies expose Execution campaigns that individually look like routine
    automation. Baseline per automation account the normal count/min and per-day of edits, publishes,
    job starts, target worker groups, and script length, and alert when volume or editing-to-execution
    compression exceeds the trailing 30-day 95th percentile or a modified Z-score |Mi|>3.5. Layer seasonal/trend/residual
    decomposition to catch spikes against learned seasonality so weekend or scheduled batch behavior does
    not generate false positives. A positive result is a statistically extreme burst or unusually tight
    edit-to-run gap relative to that account's history.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, with a trailing 30-day baseline per automation account.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per account, per day/min: counts of {edits,publishes,job_starts,worker_groups}, mean script_len,
      edit_to_exec_gap;

      base = trailing_30d; med=median(base); mad=MAD(base);

      Mi = 0.6745*(x-med)/mad;

      alert when x > p95(base) or |Mi| > 3.5 or edit_to_exec_gap < p05(base);

      apply STL decomposition and flag residual outliers.'
- question: Have an account's runbooks suddenly begun acting on more sensitive subscriptions, resource
    groups, or host sets than usual, creating surprising first-ever identity-to-target edges?
  context: Privilege-target drift detects lateral expansion during Execution, where compromised automation
    reaches into higher-value scopes. Measure whether runbooks begin acting on subscriptions, resource
    groups, or host sets outside their norm, and score first-ever identity-to-target edges with a Bayesian
    new-edge model that accounts for the natural rate of new-edge formation so genuinely surprising reach
    is escalated above ordinary growth. A positive result is a low-probability new edge to a sensitive
    target; a negative result is expected expansion consistent with the historical rate of new-edge creation
    for that identity.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, with continuously updated identity-to-target edge history.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'edges = (identity -> target_subscription_or_rg_or_host) from runbook jobs;

      model new-edge probability with Bayesian rate accounting for baseline edge formation;

      score = surprise(new_edge | history);

      alert when score high and target in sensitive_scope;

      output identity, new_target, score.'
- question: Are there bursts of failed-then-succeeded automation jobs or repeated authorization failures
    (Suspended/Failed/Stopped job states, AccessDenied/Forbidden) for an automation account that exceed
    the modified Z-score threshold?
  context: Trial-and-error is a hallmark of hands-on-keyboard Execution. Profile job State (Suspended,
    Failed, Stopped) and authorization failures (AzureActivity AccessDenied/Forbidden) per automation
    account as distinct signals, and alert when failed-then-succeeded sequences or permission-failure
    counts exceed a modified Z-score threshold. A positive result is a cluster of failures resolving into
    success, or repeated denials, indicating an actor iterating toward working code or sufficient permissions;
    benign automation is largely steady-state with stable success rates.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, with a trailing 30-day baseline per automation account.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'states = AzureDiagnostics job State per account; denials = AzureActivity AccessDenied|Forbidden;

      fail_then_ok = count(Failed/Suspended/Stopped followed by Completed within window);

      Mi = modified_zscore(fail_then_ok or denial_count, trailing_30d);

      alert when |Mi| > 3.5; output account, failure_burst, denials.'
- question: Is the identity that edited or executed a runbook acting outside its peer group or doing so
    for the first time, even though it normally never authors or runs automation?
  context: Entity behavior analytics surface compromised or misused accounts driving Execution. Score
    the editing/executing identity with peer-group and first-seen behavior analytics, escalating when
    an identity that normally never authors or runs automation suddenly does, or acts outside the behavior
    of peers in the same role. A positive result is an identity whose automation activity is anomalous
    versus its own history and its peer group; a negative result is activity consistent with the user's
    role and team norms. This complements first-seen edge detection by adding role-relative context.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days, with peer-group membership derived from role/department.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for identity i performing runbook write/publish/job:\n  self_novel = i never authored/ran\
      \ automation before;\n  peer_dev = behavior(i) deviates from peer_group(role(i));\n  alert when\
      \ self_novel or peer_dev high;\n  output identity, role, peer_group, deviation_score."
- question: When per-account/per-runbook feature vectors (editor novelty, target worker novelty, identity
    privilege, publish-to-execute latency, script entropy, follow-on resource operations, failure rate)
    are scored with an Isolation Forest, which automation activity is most anomalous?
  context: An unsupervised model catches multivariate Execution abuse that no single rule captures. Build
    per-account/per-runbook feature vectors covering editor identity novelty, target worker novelty, identity
    privilege, publish-to-execute latency, script entropy, follow-on resource operations, and failure
    rate, then score them with an Isolation Forest and surface the top-3 contributing features in the
    alert text for explainability. A positive result is a high anomaly score whose contributing features
    (for example, novel editor plus short latency plus high entropy) tell a coherent abuse story; analysts
    use the feature attributions to triage quickly.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days for scoring; retrain on a rolling 30-90 day window.
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = features[account,runbook] = {editor_novelty,target_worker_novelty,identity_privilege,\n\
      \  publish_to_exec_latency,script_entropy,followon_resource_ops,failure_rate};\nmodel = IsolationForest().fit(baseline_X);\n\
      score = model.decision_function(X);\nalert when score in top anomalies; emit top3 contributing features."
- question: Does the ordered sequence of automation job-stream events (JobStreams) and downstream operations
    contain out-of-sequence or improbable transitions that resemble adversary tasking rather than routine
    operation?
  context: Sequence modeling detects Execution that mimics legitimate operations individually but follows
    an improbable order. Model the ordered sequence of automation/job-stream events (JobStreams in AzureDiagnostics)
    and downstream operations with an LSTM next-event predictor or a variable-order Markov chain, flagging
    transitions that the model deems improbable for that account. A positive result is a low-likelihood
    event sequence (for example, token retrieval and Graph enumeration injected into a normally narrow
    operational flow); a negative result is a sequence the model predicts confidently. This catches adversary
    tasking embedded inside otherwise normal automation.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days; train sequence model on historical job-stream flows.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ordered(JobStreams + downstream_ops) per account/runbook;

      model = LSTM_next_event or VOMM trained on benign sequences;

      p = model.prob(next | history);

      alert when p < threshold (out-of-sequence transition);

      output account, improbable_transition, likelihood.'
- question: Do identity -> job -> process -> resource/network provenance graphs built from automation
    and host telemetry contain structurally anomalous subgraphs that reconstruct an attack path?
  context: Graph-based provenance modeling provides explainable detection of complex Execution chains.
    Build an identity -> job -> process -> resource/network provenance graph from automation and host
    telemetry and use a temporal graph-neural-network autoencoder to detect structurally anomalous subgraphs
    and reconstruct the attack path for triage. A positive result is a subgraph with high reconstruction
    error that links a runbook job to unexpected processes, resources, or network destinations, giving
    the analyst a visual, end-to-end account of the suspected abuse; benign automation reconstructs cleanly.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Automation Accounts, Hybrid Worker hosts, runbook publication pipelines, and identities or service
    principals capable of publishing or executing automation jobs'
  range: Last 90 days; build graph over a rolling window with temporal edges.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'G = graph(identity -> job -> process -> resource/network) from AzureDiagnostics+host telemetry;

      model = temporal_GNN_autoencoder.fit(benign_G);

      err = reconstruction_error(subgraphs(G));

      alert when err high; output anomalous_subgraph as reconstructed attack path.'
- question: Were there writes to function code, run.csx, function definitions, or site configuration (Microsoft.Web/sites/*)
    that were quickly followed by new function execution, downstream resource access, or outbound connections
    not previously associated with the app?
  context: Function Apps are a prime serverless Execution surface in Azure. Alert on writes to function
    code, run.csx, function definitions, or site configuration (Microsoft.Web/sites/*), then correlate
    them with new function execution, downstream resource access, or outbound connections the app has
    not made before. A positive result is a code/config change immediately followed by novel behavior
    under the app identity; benign deployments are followed by expected, previously observed operations.
    Reuse portable Azure detection-as-code as a baseline. This is the serverless analogue of the runbook
    fast-chain detection.
  answer_sources:
  - AzureActivity
  - AppServiceAppLogs
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - MicrosoftGraphActivityLogs
  - 'NAI: Function Apps with privileged identities, deployment endpoints, application logs, and serverless
    resources connected to storage, automation, or identity-sensitive workflows'
  range: Last 90 days, with event-centered correlation following each Microsoft.Web/sites/* write.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'changes = AzureActivity where op like ''Microsoft.Web/sites/%write%'';

      exec = AppServiceAppLogs new function execution near change.ts;

      downstream = AzureActivity|MicrosoftGraphActivityLogs|outbound not in baseline[app];

      alert when change -> exec -> downstream(novel);

      output app, actor, changed_resource, novel_op.'
- question: Did a Function App change quickly precede managed-identity token use, storage access, Graph
    calls, or administrative operations that fall outside the function's historical behavior profile?
  context: Identity-backed serverless actions let attacker code act on cloud resources without interactive
    logon, directly enabling the Execution tactic. Flag Function App changes quickly followed by managed-identity
    token use, storage access, Graph calls, or administrative operations outside the function's historical
    profile, treating token retrieval by a function outside its profile as a high-fidelity signal. A positive
    result is a recently changed function suddenly acquiring tokens and performing privileged or data
    operations it never did before; a negative result is a function reusing its established identity for
    known operations.
  answer_sources:
  - AzureActivity
  - AppServiceAppLogs
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - MicrosoftGraphActivityLogs
  - 'NAI: Function Apps with privileged identities, deployment endpoints, application logs, and serverless
    resources connected to storage, automation, or identity-sensitive workflows'
  range: Last 90 days, with event-centered correlation after each function change.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'changes = AzureActivity Microsoft.Web/sites write;

      token = managed_identity_token_use by app near change.ts;

      acts = storage_access|MicrosoftGraphActivityLogs|admin_ops not in profile[app];

      alert when change -> token -> acts(novel);

      output app, token_event, novel_action.'
- question: Is this the first time a given identity or source IP deployed or updated a Function App, or
    the first interactive serverless console use (for example MICROSOFT.PORTAL/CONSOLES/WRITE CloudShell)?
  context: First-seen detection surfaces novel serverless Execution. Maintain per-identity and per-source-IP
    histories of Function App deploy/update operations and of interactive serverless console creation
    (MICROSOFT.PORTAL/CONSOLES/WRITE, CloudShell), and flag the first occurrence, using first-seen/rare-operation
    Sigma logic over Azure activity logs. A positive result is a never-before-seen deployer identity or
    IP, or a first interactive console use, which often accompanies hands-on-keyboard attacker activity;
    a negative result is recurrence of established deployment patterns.
  answer_sources:
  - AzureActivity
  - AppServiceAppLogs
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - MicrosoftGraphActivityLogs
  - 'NAI: Function Apps with privileged identities, deployment endpoints, application logs, and serverless
    resources connected to storage, automation, or identity-sensitive workflows'
  range: Last 90 days, baseline window at least 30 days prior to the candidate event.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for event in AzureActivity where op in {Microsoft.Web/sites/write, MICROSOFT.PORTAL/CONSOLES/WRITE}:\n\
      \  if actor not in hist_identity or source_ip not in hist_ip or op==console_first:\n    alert first_seen(actor,\
      \ source_ip, op);\nupdate histories."
- question: Has a function app's deployment frequency, update cadence, invocation volume, or downstream
    API usage spiked above its trailing-window 95th percentile or a modified Z-score of 3.5, especially
    outside maintenance windows?
  context: Statistical deviation exposes serverless Execution disguised as routine DevOps. Baseline deployment
    frequency, function update cadence, invocation volume, and downstream API usage for each function
    app, and flag abrupt code changes or execution surges exceeding the trailing-window 95th percentile
    or modified Z-score |Mi|>3.5, weighting deviations that occur outside maintenance windows. Apply seasonal
    decomposition for spike detection against learned seasonality. A positive result is a statistically
    extreme deploy or invocation burst, particularly off-hours; a negative result is activity within the
    app's normal envelope.
  answer_sources:
  - AzureActivity
  - AppServiceAppLogs
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - MicrosoftGraphActivityLogs
  - 'NAI: Function Apps with privileged identities, deployment endpoints, application logs, and serverless
    resources connected to storage, automation, or identity-sensitive workflows'
  range: Last 90 days, with a trailing baseline per function app.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per app: counts of {deploys,updates,invocations,downstream_api_calls} over time;

      med=median; mad=MAD; Mi=0.6745*(x-med)/mad;

      alert when x>p95(trailing) or |Mi|>3.5, boost if outside maintenance_window;

      apply STL and flag residual spikes.'
- question: In the first hour of executions after a function deployment, did the app show unusually aggressive
    early behavior (destination diversity, secret access, resource-operation counts) or first-seen downstream
    operations compared with prior releases?
  context: Cold-start behavior analysis catches malicious code that activates immediately post-deploy.
    Compare the first hour of executions after deployment with prior releases for that app across destination
    diversity, secret access, and resource-operation counts, and escalate releases with unusually aggressive
    early behavior or first-seen downstream operations relative to the per-principal baseline. A positive
    result is a new release that immediately fans out to many destinations, reads secrets, or performs
    novel resource operations; benign releases resemble their predecessors' early behavior. This is the
    serverless analogue of editing-to-execution compression.
  answer_sources:
  - AzureActivity
  - AppServiceAppLogs
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - MicrosoftGraphActivityLogs
  - 'NAI: Function Apps with privileged identities, deployment endpoints, application logs, and serverless
    resources connected to storage, automation, or identity-sensitive workflows'
  range: Last 90 days; per-deployment first-hour window compared against prior releases.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each deploy d of app a:\n  early = exec_logs[a] in [d.ts, d.ts+1h];\n  metrics = {dest_diversity,\
      \ secret_access, resource_ops, novel_downstream};\n  compare metrics to distribution over prior_releases[a];\n\
      \  alert when metrics >> prior or novel_downstream present."
- question: Are App Service HTTP 4xx/5xx rates or authorization failures (AccessDenied/Forbidden in AzureActivity
    and MicrosoftGraphActivityLogs) for a function app spiking above the modified Z-score threshold after
    a deploy?
  context: Failure-state bursts indicate enumeration or trial-and-error abuse following serverless Execution.
    Profile App Service HTTP 4xx/5xx rates and authorization failures (AccessDenied/Forbidden in AzureActivity
    and MicrosoftGraphActivityLogs) per function app as distinct signals, alerting on failure bursts that
    exceed the modified Z-score threshold. A positive result is a cluster of client/server errors or permission
    denials right after a deploy, suggesting the actor is probing endpoints or testing permissions; a
    negative result is stable error rates consistent with the app's baseline.
  answer_sources:
  - AzureActivity
  - AppServiceAppLogs
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - MicrosoftGraphActivityLogs
  - 'NAI: Function Apps with privileged identities, deployment endpoints, application logs, and serverless
    resources connected to storage, automation, or identity-sensitive workflows'
  range: Last 90 days, with a trailing baseline per function app.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'http_fail = AppServiceHTTPLogs status in 4xx/5xx per app;

      authz_fail = AzureActivity|MicrosoftGraphActivityLogs AccessDenied|Forbidden per app;

      Mi = modified_zscore(fail_count, trailing_baseline);

      alert when |Mi|>3.5, correlate with recent deploy;

      output app, fail_type, burst_size.'
