name: 'AZT402: Elevated Access Toggle'
id: e289f8e5-0951-4e56-82fd-4f8ee600b1d7
description: Investigate whether an Azure Entra ID (Azure AD) global administrator has abused the elevated-access
  toggle (Microsoft.Authorization/elevateAccess/action) to grant themselves tenant-wide User Access Administrator
  at the root (/) scope and then bridged that directory role into subscription-wide administrative control.
  This playbook helps an analyst detect the deterministic elevateAccess invocation, the rapid post-elevation
  RBAC takeover (root or management-group role assignments, Owner/User Access Administrator grants, subscription
  ownership changes, and removal of deny assignments, Azure Policy, or resource locks), and the sign-in
  context that preceded it (impossible travel, anonymized or Tor sources, weak or stale MFA). It layers
  statistical baselining of per-admin elevateAccess behavior and failure-rate precursors, plus entity-behavior
  and graph-based machine-learning models that surface rare principals, blast radius, and cross-subscription
  role fan-out, all while keeping the deterministic elevateAccess rule as the authoritative floor.
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any principal invoke the Azure elevated-access toggle (Microsoft.Authorization/elevateAccess/action)
    that grants tenant-wide User Access Administrator at the root (/) scope, and was that invocation tied
    to a pre-approved change ticket and an actor with a legitimate history of tenant-wide governance work?
  context: 'This is the authoritative, deterministic detection for AZT402 privilege escalation. The elevateAccess
    operation is the single API call a global administrator uses to convert their Entra ID directory role
    into User Access Administrator across every subscription and management group in the tenant. It is
    rare in normal operations, so any occurrence should be treated as high severity unless it maps to
    an approved change record. Search AzureActivity for operationName == MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION,
    then enrich with the actor identity, source IP, and change-management status. A positive result with
    no approved ticket, especially from an actor with no recent legitimate tenant-wide governance activity,
    is a concrete escalation event that should drive immediate containment of the identity and review
    of all subsequent RBAC changes. References: [Azure Subscription Permission Elevation Via ActivityLogs,
    SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/activity_logs/azure_subscription_permissions_elevation_via_activitylogs.yml)
    [Elevate access to manage all Azure subscriptions, Microsoft Learn](https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin)
    [Azure Threat Research Matrix AZT402](https://microsoft.github.io/Azure-Threat-Research-Matrix/PrivilegeEscalation/AZT402/AZT402/).'
  answer_sources: &id001
  - AuditLogs
  - AzureActivity
  - SigninLogs
  - 'NAI: Directory/Azure Activity Log at tenant and root scope, all subscriptions and management groups
    under the tenant, and sign-in sessions belonging to global administrators with potential access to
    Microsoft.Authorization/elevateAccess/action.'
  range: Last 90 days, with immediate review of any elevateAccess invocation in the last 24 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH AzureActivity WHERE operationName == 'MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION';
      ENRICH actor, caller, source_ip, change_ticket_status, actor_governance_history_90d; ALERT high
      unless approved_change_ticket=true; ESCALATE when actor_governance_history_90d=none; OUTPUT actor,
      source_ip, timestamp, ticket.
- question: Within the same session or a 30-minute window after an elevateAccess invocation, did the actor
    perform root- or management-group-scope role assignments, grant Owner or User Access Administrator,
    change subscription ownership, or remove deny assignments, Azure Policy, or resource locks?
  context: 'The elevateAccess toggle is only the doorway; the actual takeover is the burst of RBAC and
    governance edits that follows. Using the Azure RBAC scope/role hierarchy, correlate the elevateAccess
    event with subsequent Microsoft.Authorization/roleAssignments/write operations at root or management-group
    scope or to privileged roles (Owner, User Access Administrator), subscription ownership changes, and
    deletion of denyAssignments, Azure Policy assignments, or resource locks. A concrete escalation workflow
    is >=3 roleAssignments/write across >=2 distinct subscriptions within 30 minutes of elevateAccess,
    or any successful root-scope assignment. Raise severity further when the grant originates from a previously
    unseen source IP. This tactic-specific chain confirms the actor is rapidly expanding control beyond
    normal governance responsibilities, which is the defining behavior of this privilege-escalation technique.
    References: [Azure RBAC role assignments, Microsoft Learn](https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-portal)
    [Granting Of Permissions To An Account, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/activity_logs/azure_granting_permission_detection.yml).'
  answer_sources: *id001
  range: Last 90 days, correlating events within a 30-minute window after each elevateAccess invocation.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN elevateAccess_events TO AzureActivity WHERE operationName IN ['MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE']
      OR subscription_ownership_change OR denyAssignment_or_policy_or_lock_removed, time_window<=30m,
      same_actor; FLAG scope IN [root '/', management_group] OR role IN [Owner, 'User Access Administrator'];
      ALERT when role_assignment_count>=3 AND distinct_subscriptions>=2 OR any root_scope_assignment;
      RAISE when source_ip first_seen_for_actor; OUTPUT actor, scope, role, subscriptions, source_ip.
- question: Was the global-admin sign-in immediately preceding an elevateAccess invocation geographically
    or temporally infeasible (impossible travel) or sourced from an anonymizing proxy or Tor exit node?
  context: 'The credibility of the sign-in that authorized elevateAccess is decisive for triage. Evaluate
    the SigninLogs event directly preceding the elevateAccess action for impossible travel (two sign-ins
    separated by a distance that cannot be covered in the elapsed time) and for anonymized or Tor source
    infrastructure. An infeasible or anonymized session combined with an elevateAccess invocation should
    be treated as confirmed-compromise priority, because a legitimate global administrator rarely elevates
    from an impossible location or behind anonymization. A negative result (the sign-in is from a known,
    feasible location and device) lowers but does not eliminate suspicion, so this gate should always
    be paired with the deterministic elevateAccess and RBAC-takeover checks. References: [Impossible Travel
    Detection WO2018085161A1, Microsoft](https://patents.google.com/patent/WO2018085161A1/en) [Anomaly
    detection policies, Microsoft Defender for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).'
  answer_sources: *id001
  range: Last 90 days, evaluating the sign-in session in the minutes immediately preceding each elevateAccess
    invocation.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: 'FOR each elevateAccess_event: SELECT preceding SigninLogs FOR same actor; COMPUTE impossible_travel(prior_signin,
      this_signin); CHECK source_ip IN tor_exit_list OR anonymizer_list; ALERT confirmed_compromise when
      impossible_travel=true OR anonymized=true; OUTPUT actor, geo_pair, time_delta, source_ip, anon_flag.'
- question: Compared with each global administrator's own 30-90 day baseline, is the elevateAccess frequency,
    count of affected subscriptions, post-elevation role-assignment volume, time-of-day, source IP/ASN
    novelty, or MFA freshness a robust statistical outlier, or is this the actor's first-ever elevateAccess
    or first root-scope assignment?
  context: 'Per-principal baselining catches abuse that hard rules might rationalize as routine. Build
    a trailing 30-90 day profile for each global admin covering elevateAccess frequency, blast radius
    (affected subscriptions), post-elevation roleAssignments/write volume, time-of-day, source IP/ASN
    novelty, and MFA freshness. Use a robust outlier test such as the modified Z-score / median absolute
    deviation (|score| > 3.5) so periodic batch governance does not inflate thresholds. Treat the actor''s
    first-ever elevateAccess or first root-scope assignment as a first-seen-per-principal anomaly. Forecasting
    the expected per-principal RBAC-change rate and alerting when activity breaches the upper confidence
    band adds an additional time-series check. A robust outlier here, in the context of privilege escalation,
    indicates the actor is operating well outside their normal governance pattern and warrants investigation
    even absent an obvious rule hit. References: [Modified Z-Score for Anomaly Detection, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    [CloudTrail Anomaly Detector, Netflix-Skunkworks](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly)
    [Intrusion detection in cloud computing based on time series anomalies, Lin et al.](https://link.springer.com/article/10.1186/s13677-023-00491-x).'
  answer_sources: *id001
  range: Last 90 days, with trailing 30-90 day per-principal baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per global_admin over 30-90d for [elevateAccess_freq, affected_subscription_count,
      post_elevation_roleassign_volume, time_of_day, source_ip_asn_novelty, mfa_freshness]; COMPUTE modified_zscore
      via MAD; ALERT when |score|>3.5 OR first_ever_elevateAccess OR first_root_scope_assignment; FORECAST
      per_principal_rbac_rate and ALERT on upper_confidence_band breach; OUTPUT actor, feature, score,
      baseline.
- question: Did a burst of authentication or authorization failures - failed or interrupted MFA challenges,
    AADSTS sign-in failures, or AccessDenied/Forbidden errors in AzureActivity - precede a successful
    elevateAccess invocation or root-scope grant, and does the sign-in -> elevateAccess -> roleAssignment
    sequence contain low-probability transitions?
  context: 'Failure telemetry is a leading indicator of takeover that should be modeled as its own channel.
    Track failed/interrupted MFA challenges and AADSTS sign-in failures in SigninLogs, plus AccessDenied/Forbidden
    authorization errors in AzureActivity, and alert when a burst of these failures immediately precedes
    a successful elevateAccess or root-scope grant - the signature of brute-force or MFA consent-fatigue
    preceding control seizure. Additionally, model the ordered sign-in -> elevateAccess -> roleAssignment
    sequence (for example with a variable-order Markov model) and flag low-probability transitions. For
    this privilege-escalation technique, a failure burst that resolves into a successful elevation is
    strong evidence the actor was probing or fatiguing controls before seizing tenant-wide rights. References:
    [Anomaly detection policies, Microsoft Defender for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy)
    [Protecting APIs from abuse using sequence learning and variable order Markov chains, Cloudflare](https://blog.cloudflare.com/protecting-apis-from-abuse-using-sequence-learning-and-variable-order-markov/).'
  answer_sources: *id001
  range: Last 90 days, correlating failure bursts in the window immediately preceding each successful
    elevateAccess or root-scope grant.
  queries:
  - technology: SIEM/Stats pseudocode
    query: CHANNEL failures = SigninLogs(failed_or_interrupted_mfa, AADSTS_failures) + AzureActivity(AccessDenied,
      Forbidden); GROUP by actor; ALERT when failure_burst precedes successful elevateAccess OR root_scope_grant
      within window; MODEL sequence(signin->elevateAccess->roleAssignment) with variable_order_markov;
      FLAG low_probability_transition; OUTPUT actor, failure_count, sequence, transition_prob.
- question: When scored with entity behavior analytics against the actor's own history and peer global
    administrators, does the elevateAccess session rank as high risk based on source/device novelty, MFA
    freshness, rare subscription targets, breadth of post-elevation RBAC edits, and the sign-in -> elevateAccess
    -> authorization sequence, and what are the top-3 contributing features?
  context: 'A UEBA model combines weak signals that no single rule captures into an explainable risk score
    for the elevateAccess session. Features should include source and device novelty, MFA freshness, rare
    subscription targets, the breadth (blast radius) of post-elevation RBAC edits, and the ordered sign-in
    -> elevateAccess -> authorization sequence. The alert must surface the top-3 contributing features
    (for example new ASN, blast radius, peer-rarity) rather than only a numeric score so the analyst can
    act on the rationale. Run this in parallel with rare-action / rare-population unsupervised jobs so
    a rarely-used privileged action performed by an atypical principal is surfaced. This model layers
    on top of - and never replaces - the deterministic elevateAccess rule, providing context and prioritization
    for the privilege-escalation investigation. References: [Identify advanced threats with UEBA, Microsoft
    Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)
    [Detecting Threats in AWS CloudTrail Logs Using Machine Learning, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources: *id001
  range: Last 90 days for behavioral features, with scoring of each elevateAccess session as it occurs.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [source_novelty, device_novelty, mfa_freshness, rare_subscription_target, post_elevation_rbac_breadth,
      signin_elevate_authz_sequence]; score = ueba_model.score(session, actor_history, peer_global_admins);
      ALERT on high score; RUN parallel rare_action/rare_population unsupervised job; OUTPUT score, top_3_features;
      KEEP deterministic elevateAccess rule active.
- question: When the Azure RBAC/identity audit trail is modeled as a heterogeneous dynamic graph (principal-role-resource-action),
    does an anomalous root-scope subgraph or rapid cross-subscription role fan-out appear after an elevateAccess
    invocation, and which nodes and edges drove the anomaly?
  context: 'Graph modeling captures the structural blast radius of a tenant-to-subscription takeover that
    flat rules miss. Represent the RBAC/identity audit trail as a heterogeneous dynamic graph linking
    principals, roles, resources, and actions, then flag the anomalous root-scope subgraph and the rapid
    cross-subscription role fan-out created after elevation, with adaptation to legitimate governance
    drift. The model should emit the contributing nodes and edges - which subscriptions and role edges
    drove the score - so the analyst can triage exactly where control expanded. Keep the deterministic
    elevateAccess floor active alongside this model. For this privilege-escalation technique, a dense,
    newly formed root-scope subgraph fanning out across many subscriptions is a high-confidence picture
    of an adversary bridging directory rights into subscription-wide control. References: [Graph Neural
    Network Based Adaptive Threat Detection for Cloud IAM Logs](https://arxiv.org/abs/2512.10280) [Cloudy
    with a Chance of Anomalies (CS-GAD)](https://arxiv.org/html/2409.12726v1).'
  answer_sources: *id001
  range: Last 90 days for graph construction, scoring subgraphs formed after each elevateAccess invocation.
  queries:
  - technology: ML pipeline pseudocode
    query: graph = build_heterogeneous_dynamic_graph(principal, role, resource, action) FROM AuditLogs+AzureActivity;
      score = gnn_anomaly.score(graph) WITH governance_drift_adaptation; FLAG root_scope_subgraph AND
      cross_subscription_role_fanout after elevateAccess; OUTPUT contributing_nodes, contributing_edges,
      subscriptions, score; KEEP deterministic floor active.
