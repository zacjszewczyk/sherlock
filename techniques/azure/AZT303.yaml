name: 'AZT303: Managed Device Scripting'
id: 51c46951-cd4f-47c3-8ec3-92083ebd61d3
description: Investigate whether an adversary has abused Azure/Entra ID device-management capabilities
  (primarily Microsoft Intune) to execute PowerShell or Python on enrolled, enterprise-managed endpoints.
  This playbook helps an analyst examine the Intune/Graph control plane for the creation, modification,
  or assignment of device-management scripts, proactive-remediation scripts, and device actions that run
  code as SYSTEM via the Intune Management Extension, and to scope those changes by the invoking principal,
  the breadth and sensitivity of targeted device groups, and the content of the deployed scripts. It then
  pivots to the managed endpoints themselves to correlate those control-plane changes with near-term PowerShell,
  Python, or suspicious child-process activity spawned under the IME agent (IntuneWindowsAgent.exe / AgentExecutor.exe),
  and to surface anomalous execution sequences, cross-device simultaneity, deployment and execution failure
  bursts, and malicious or obfuscated script content. Detection guidance spans deterministic symbolic-logic
  rules, statistical baselining, and machine-learning models so an analyst can distinguish routine fleet
  administration from managed-device scripting abuse used for execution.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has an operator created, updated, or assigned an Intune device-management script, proactive-remediation
    script, or device action that can run PowerShell or Python on enrolled endpoints, and does the invoking
    principal or the breadth of the target match their normal administrative behavior?
  context: This is the core control-plane detection for Managed Device Scripting under the Execution tactic.
    The Intune Management Extension runs deployed PowerShell as SYSTEM from %Program Files%\Microsoft
    Intune Management Extension, so any create/update/assign operation against device scripts or device
    actions is effectively a fleet-wide code-execution primitive. Mirror the cloud-native pattern of alerting
    on the fleet-execution API and scoping by who invoked it and how broadly it reaches. Treat operators
    who rarely manage endpoint scripting, or assignments that target admins, executives, or security tooling
    hosts, as higher severity. A positive result is a script-deployment operation from an unexpected principal
    or with unusual scope; a negative result is routine, expected management by an established operator
    within a maintenance window.
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'ops = IntuneAuditLogs|MicrosoftGraphActivityLogs where operation in [''create'',''update'',''assign'']
      and target in [''deviceManagementScript'',''proactiveRemediationScript'',''deviceAction''];

      enrich operator with role, historical_scripting_activity, target_group_sensitivity;

      alert when operator rarely_manages_scripts=true or target_group in [admin_workstations,executives,security_tooling];

      output operator, operation, script_id, target_groups, device_count, source_ip, time'
- question: Did a script deployment newly target administrator workstations, security systems, executives,
    or a geographically broad set of devices that the deploying operator has not historically administered,
    representing a never-before-seen operator-to-device-group relationship?
  context: Even authorized script-deployment operators normally manage a stable set of device populations.
    A first-time operator->device-group assignment is a high-value new-relationship event and a strong
    indicator that a compromised or malicious operator is steering managed execution toward sensitive
    endpoints. Model the operator-to-target-group graph and flag new edges, weighting privileged, security,
    executive, or broad groups most heavily. For the Execution tactic this matters because the choice
    of target dictates the blast radius and the value of the code that will run as SYSTEM. A positive
    result is a new operator->sensitive-group edge with no prior history; a negative result is an assignment
    that falls within the operator's established management footprint.
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'graph = historical edges operator -> device_group over 90d;

      new_edge = assignment where (operator,target_group) not in graph;

      score = bayesian_new_edge_probability(operator,target_group);

      alert when new_edge=true and (target_group.sensitive=true or target_group.breadth high or score
      low);

      output operator, target_group, group_sensitivity, device_count, first_seen'
- question: When the deployed script body is retrievable through Graph or Intune, does its content contain
    download cradles, in-memory execution, reflection, AMSI or defense-tampering keyword combinations,
    or obfuscation and encoding consistent with documented PowerShell loaders?
  context: Static screening of the actual script payload turns a control-plane event into a content-based
    verdict. Because IME-delivered scripts run as SYSTEM, malicious cradles (e.g., DownloadString/IEX),
    reflective assembly loading, AMSI bypasses, and heavy obfuscation are direct evidence of abuse rather
    than administration. Retrieve the assigned script body and screen it for malicious keyword combinations
    and encoding/entropy patterns associated with loaders. For the Execution tactic this is the clearest
    signal that the deployed code is intended to run hostile payloads on managed devices. A positive result
    is a script matching loader keyword combinations or high-entropy/encoded blocks; a negative result
    is a readable administrative script with benign intent.
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'body = fetch_script_body(script_id via Graph/Intune);

      flags = match(body, [''DownloadString'',''IEX'',''Invoke-Expression'',''FromBase64String'',''reflection'',''amsiInitFailed'',''AmsiScanBuffer'',''-enc'']);

      entropy = shannon_entropy(body);

      alert when count(flags) >= 2 or entropy > threshold;

      output script_id, operator, matched_keywords, entropy, target_groups'
- question: Is the rate of scripts created, edited, and assigned by an operator, the number of devices
    targeted per rollout, or the timing of changes outside that operator's seasonal management baseline
    or outside approved maintenance windows?
  context: Management activity is strongly seasonal, concentrated in business hours and maintenance windows,
    so naive thresholds generate noise. Decompose each operator's script-creation/edit/assignment volume
    and target-count series with STL seasonal decomposition and apply robust median/MAD ESD testing to
    flag behavior exceeding the trailing 30-90 day seasonal baseline (e.g., above the 95th percentile
    or MAD k>=3) or occurring outside maintenance windows. For the Execution tactic, an off-hours surge
    of script rollouts is a hallmark of an actor pushing code quickly rather than a planned change. A
    positive result is a statistically significant spike or off-window rollout burst; a negative result
    is activity consistent with the operator's seasonal norm.
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days, with a trailing 30-90 day seasonal baseline per operator.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = per_operator_per_day(scripts_created, scripts_edited, scripts_assigned, devices_targeted);

      decomp = STL(series, seasonality=''business_hours+maintenance'');

      resid = decomp.residual;

      alert when ESD(resid, MAD, k>=3) or value > p95(baseline) or time outside maintenance_window;

      output operator, metric, observed, expected, window'
- question: Does a single rollout affect an unusually large or sensitive set of device groups, OS types,
    and privileged endpoints relative to the deploying operator's historical profile, when scored across
    principal, source, time, target count, and script size/entropy together?
  context: 'Assignment breadth is a multi-dimensional signal: a rollout may be unremarkable in count yet
    alarming when it combines a novel principal, an unusual source host/geo, off-hours timing, a large
    or sensitive target set, and a large or high-entropy script. Stream these control-plane events to
    an online Robust Random Cut Forest that scores anomalies and attributes the verdict to its top contributing
    features. For the Execution tactic this catches an operator suddenly expanding scope or sensitivity
    beyond their norm before code lands on many devices. A positive result is a high-scoring rollout with
    breadth/sensitivity attribution; a negative result is a rollout whose combined features fall within
    the operator''s profile.'
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days, streaming/online scoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'features = [principal, source_host, source_geo, hour, target_count, os_types, privileged_endpoint_count,
      script_size, script_entropy, success_count, fail_count];

      score = RRCF_stream(features);

      attr = top_feature_attribution(score);

      alert when score > threshold; output rollout_id, operator, score, attr, target_groups'
- question: Is a particular operator generating an abnormal burst of failed, blocked, or partially-applied
    script deployments, repeated edit-redeploy cycles, or attempts to target groups they cannot normally
    reach?
  context: Failed and partial deployments are a distinct, high-value signal separate from successful ones.
    A spike of assignment errors, repeated edit-redeploy loops, or attempts against groups outside the
    operator's authorization indicates trial-and-error abuse and environment probing rather than healthy
    administration. Derive the alert floor from the trailing-90-day per-operator failure-rate distribution
    so each operator is judged against their own norm. For the Execution tactic this surfaces an actor
    iterating to get malicious code to run before any successful execution occurs. A positive result is
    a per-operator failure-rate spike or repeated unauthorized targeting; a negative result is a normal,
    low failure rate consistent with routine change.
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days, with trailing-90-day per-operator failure-rate baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = IntuneAuditLogs|Graph where result in [''failed'',''blocked'',''partial''];

      rate = count(fails) by operator,window / count(all_ops) by operator,window;

      baseline = trailing_90d_failure_rate(operator);

      alert when rate > p95(baseline) or repeated_edit_redeploy(operator) or target_group unauthorized;

      output operator, fail_count, rate, baseline, targeted_groups'
- question: Does the observed Intune control-plane sequence for a script deviate from the expected order
    (create -> assign -> deploy with the expected actor/role), or include never-before-seen management
    actions?
  context: Legitimate management follows a predictable control-plane workflow with expected actors and
    roles. Modeling that workflow as a log-key sequence (DeepLog-style) lets you flag out-of-order operations,
    skipped steps, or never-before-seen management actions, each with per-event diagnosis surfaced in
    the alert. For the Execution tactic this detects an actor whose abuse of Intune does not follow the
    normal administrative choreography, for example assigning and deploying with anomalous role context.
    A positive result is a low-probability or out-of-order management sequence; a negative result is a
    sequence matching the learned-normal workflow with expected actor/role.
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days for sequence training and scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ordered control_plane_events(script_id) keyed by operation+role;

      model = deeplog_logkey_sequence(train=normal_workflows);

      p = model.predict_next(seq);

      alert when observed not in topk(p) or sequence_out_of_order=true;

      output script_id, operator, observed_sequence, anomalous_step, diagnosis'
- question: When Intune and Graph sessions are scored on admin novelty, targeted device criticality, script-assignment
    breadth, prior role history, source-host/geo context, and deployment success/failure rates, does any
    session stand out as anomalous?
  context: This is the unsupervised model that runs in parallel with the deterministic rules to catch
    abuse that no single rule covers. Score each Intune/Graph session with features for operator novelty,
    targeted device criticality, assignment breadth, prior role history, source-host/geo, and success/failure
    rates, and emit the top-3 contributing features in the alert text for analyst triage. For the Execution
    tactic this provides a holistic risk verdict on managed-device scripting sessions, prioritizing those
    most likely to represent execution abuse. A positive result is a high model score with interpretable
    feature attribution; a negative result is a session that resembles established, low-risk administration.
  answer_sources:
  - IntuneAuditLogs
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - 'NAI: Intune administration paths, Graph device-management endpoints, administrators with script-deployment
    privileges, and device groups containing privileged or sensitive endpoints'
  range: Last 90 days for model training and scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [operator_novelty, target_device_criticality, assignment_breadth, prior_role_history,
      source_host, source_geo, success_rate, failure_rate];

      score = streaming_anomaly_model(features);  # RRCF / HTM ensemble

      explain = top3_contributors(features);

      alert when score >= threshold; output session_id, operator, score, explain, target_groups'
- question: Did an Intune script deployment or assignment correlate with near-term PowerShell, Python,
    or suspicious child-process execution on the targeted devices, anchored to the Intune Management Extension
    agent running as SYSTEM?
  context: This closes the loop between the control-plane change and the actual code execution on endpoints.
    Correlate an Intune deployment/assignment with PowerShell, Python, or suspicious child processes on
    the targeted devices within the expected execution window, anchoring on the IME agent (IntuneWindowsAgent.exe
    / AgentExecutor.exe) running as SYSTEM. Escalate when the executed commands modify credentials, security
    settings, persistence controls, or remote-access tooling, since those move beyond benign management.
    For the Execution tactic this is the decisive evidence that managed-device scripting resulted in adversary-controlled
    code running on hosts. A positive result is targeted endpoints executing IME-spawned code shortly
    after the deployment; a negative result is a deployment with no corresponding endpoint execution or
    only benign administrative actions.
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days, with deployment-centered correlation over the IME execution window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'deploy = IntuneAuditLogs where assign/deploy script -> target_devices, t0;

      exec = DeviceEvents|EID4688|EID4104|Sysmon1 where parent in [''IntuneWindowsAgent.exe'',''AgentExecutor.exe'']
      and user=''SYSTEM'' and host in target_devices and ts within [t0, t0+execwindow];

      alert when exec present; escalate when command touches [credentials, security_settings, persistence,
      remote_access_tooling];

      output host, deploy_id, process, command_line, parent, user'
- question: Did the IME agent or a proactive-remediation process spawn script interpreters, download utilities,
    credential tools, or persistence-changing commands shortly after a new deployment, as seen in deobfuscated
    PowerShell ScriptBlock (Event ID 4104) content?
  context: This focuses on the process-chain fingerprint of abuse on the endpoint. The IME agent or remediation
    processes legitimately run management code, but spawning interpreters that then launch download cradles,
    credential tooling, or persistence changes immediately after a new deployment is suspicious. Use full
    deobfuscated PowerShell ScriptBlock text (Event ID 4104) to match malicious keyword combinations and
    known loader behaviors instead of relying on the command line alone. For the Execution tactic this
    reveals the in-host execution of hostile payloads delivered through managed scripting. A positive
    result is an IME->interpreter->malicious-behavior chain with matching ScriptBlock content; a negative
    result is the agent running benign, expected management commands.
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days, anchored to recent deployments.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'chain = process_tree where root in [''IntuneWindowsAgent.exe'',''AgentExecutor.exe''] and
      child in [''powershell.exe'',''pwsh.exe'',''python.exe'',''cmd.exe'',''curl.exe'',''certutil.exe''];

      sbl = EID4104 deobfuscated_scriptblock for child;

      alert when chain present and (match(sbl, malicious_keywords) or child in [credential_tools, persistence_cmds])
      and recent_deploy=true;

      output host, process_tree, scriptblock, matched_indicators, deploy_id'
- question: Does a managed device's management-agent process lineage, script-execution frequency, or child-process
    n-grams fall outside its learned per-host/per-role 'self', or does its hourly execution rate exceed
    the device's robust seasonal baseline?
  context: 'Each managed device has a stable normal for how the management agent behaves: its process
    lineage, how often it runs scripts, and the n-grams of child processes it spawns. Build that per-host/per-role
    ''self'' (Forrest-style) and flag executions whose sequences fall outside it, and combine with seasonal-hybrid
    ESD on the hourly execution rate to catch volume spikes. For the Execution tactic this detects deviations
    introduced when a malicious script runs on an otherwise predictable endpoint. A positive result is
    a process sequence not in the device''s self set or an hourly rate above the seasonal baseline; a
    negative result is execution consistent with the device''s established management pattern.'
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days, with per-host self/baseline training.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'self = build_short_sequence_db(agent_process_lineage per host/role);

      ngram = child_process_ngrams(host);

      alert when ngram not in self or anomaly_score high;

      rate = hourly_exec_count(host); base = seasonal_hybrid_ESD(rate);

      alert when rate > base.upper; output host, sequence, score, observed_rate, expected_rate'
- question: Within a rollout window, how many devices show similar unusual child-process trees, script
    artifacts, or byte-volume writes simultaneously, and does that synchronized anomaly exceed ordinary
    staged administration?
  context: Managed scripting abuse often manifests across many devices at once because a single assignment
    fans out to a group. Measure how many targeted devices exhibit similar unusual child-process trees,
    script artifacts, or byte-volume writes within the rollout window and stream the per-device counts
    to a label-free online detector (HTM/NAB-style). Synchronized anomalies that exceed normal staged
    administration are a strong indicator of coordinated malicious execution. For the Execution tactic
    this distinguishes a controlled phased rollout from simultaneous adversary code execution across a
    fleet. A positive result is a spike of correlated, simultaneous device anomalies; a negative result
    is the gradual, staged pattern typical of legitimate deployments.
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days, evaluated within each rollout window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each rollout_window: count devices with [unusual_child_tree | new_script_artifact | byte_write_spike];

      stream counts -> online_detector(HTM/NAB);

      alert when synchronized_anomaly_score > threshold and > staged_admin_norm;

      output rollout_id, affected_device_count, shared_indicators, score'
- question: Is a device or rollout showing a spike in AgentExecutor non-zero exit codes, script timeouts,
    or PowerShell error/blocked-execution counts that indicates environment probing or broken malicious
    payloads?
  context: Execution failures on the endpoint are a distinct signal from successful runs. A burst of AgentExecutor
    non-zero exit codes, script timeouts, or PowerShell error/blocked-execution events suggests an actor
    probing the environment or deploying payloads that fail rather than healthy management. Derive thresholds
    from each device's trailing-30-day error distribution so each host is judged against its own norm.
    For the Execution tactic this catches the noisy, iterative phase of getting malicious code to run
    reliably. A positive result is a per-device or per-rollout error spike above baseline; a negative
    result is an error rate consistent with the device's normal management failures.
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days, with trailing-30-day per-device error baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'errs = AgentExecutor_exit_codes!=0 | script_timeouts | EID4104/PS errors | blocked_execution;

      rate = count(errs) by host,window and by rollout;

      base = trailing_30d_error_distribution(host);

      alert when rate > p95(base); output host, rollout_id, error_count, error_types, baseline'
- question: When the deobfuscated text of IME-delivered scripts and their PowerShell children (Event ID
    4104 / AMSI) is classified with obfuscation-robust models, is any content scored as malicious?
  context: This applies content classification to the endpoint-side scripts rather than the control-plane
    copy. Classify the deobfuscated text of IME-delivered scripts and their PowerShell children (captured
    via 4104/AMSI) using character-CNN plus contextual-embedding models and AST-structure models that
    are robust to obfuscation, surfacing the top contributing tokens or structures in the alert. For the
    Execution tactic this catches malicious payloads that evade keyword rules through encoding or structural
    tricks. A positive result is a high malicious-probability score with interpretable token/structure
    attribution; a negative result is script content classified as benign administration.
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days for scoring and retraining.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'text = deobfuscated_scriptblock(IME_scripts + PS_children via 4104/AMSI);

      score = ensemble([char_cnn_contextual_embeddings(text), ast_structure_model(text)]);

      explain = top_tokens_or_substructures(text);

      alert when score > threshold; output host, script_id, score, explain'
- question: Do command lines spawned under the IME agent deviate from each host's or role's learned-normal,
    and does an obfuscation classifier flag base64/encoded commands that string rules would miss?
  context: Command-line analysis complements script-body classification by catching what is actually invoked
    under the agent. Embed and score the command lines spawned under the IME agent against each host's/role's
    learned-normal (BERT-embedding-style), and run a feature-based obfuscation classifier whose feature
    importances explain the verdict, to catch base64/encoded commands that evade string rules. For the
    Execution tactic this exposes encoded or obfuscated invocations that managed scripting abuse uses
    to hide intent. A positive result is a command line far from the host's normal embedding cluster or
    flagged as obfuscated with feature attribution; a negative result is a command consistent with the
    host/role baseline and not obfuscated.
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days for embedding training and scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'cmd = command_lines where parent in [''IntuneWindowsAgent.exe'',''AgentExecutor.exe''];

      emb = bert_embed(cmd); dist = distance(emb, host_role_normal_cluster);

      obf = obfuscation_classifier(cmd); explain = feature_importances(obf);

      alert when dist > threshold or obf.malicious=true; output host, cmd, dist, obf_score, explain'
- question: Across management-script executions on a device, does a sequence anomaly model flag out-of-order
    or novel execution sequences when considering process lineage, script-content indicators, target sensitivity,
    rollout timing, cross-device simultaneity, and exit-code/error counts?
  context: This is the endpoint-side sequence model that runs alongside the deterministic chain rules.
    Build a device-level sequence anomaly detector (DeepLog-style) over management-script executions,
    incorporating process lineage, script-content indicators, target-device sensitivity, rollout timing,
    cross-device simultaneity, and exit-code/error counts, and flag out-of-order or novel execution sequences
    with per-event diagnosis and the top-3 contributing features. For the Execution tactic this catches
    abuse whose individual steps look plausible but whose sequence is abnormal for the device. A positive
    result is a low-probability or out-of-order execution sequence with feature attribution; a negative
    result is an execution sequence matching the device's learned-normal management behavior.
  answer_sources:
  - DeviceEvents
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Sysmon Event ID 1
  - IntuneAuditLogs
  - 'NAI: Managed Windows endpoints, high-value administrative workstations, device groups recently assigned
    new scripts, and EDR telemetry tied to Intune execution windows'
  range: Last 90 days for sequence training and scoring.
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ordered management_script_executions(host) with [lineage, content_indicators, target_sensitivity,
      rollout_timing, simultaneity, exit_codes];

      model = deeplog_device_sequence(train=normal);

      alert when observed not in topk(model.predict) or out_of_order=true;

      explain = top3_contributors; output host, sequence, anomalous_step, explain'
