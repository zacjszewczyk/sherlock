name: 'AZT101: Port Mapping'
id: 62dab0cb-bd61-430d-b229-902deba5401a
description: Investigate adversary reconnaissance of Azure network exposure, where a principal views control-plane
  networking objects to map which virtual machines expose management and application services to the internet.
  This playbook helps an analyst examine Azure Activity log READ operations against network security groups,
  network interfaces, public IP objects, load balancer front ends, subnets, and related configuration
  to derive allowed inbound ports, permitted source ranges, and reachable services. It then covers the
  follow-on validation phase, where discovered exposure is tested by correlating recent enumeration with
  near-term inbound connection attempts and port probes against the exact IPs and administrative ports
  just reviewed. Detection guidance spans deterministic symbolic-logic rules (read chains, exposure sweeps,
  authorization-failure bursts, rule-to-traffic correlation, sequential hypothesis scan testing), statistical
  baselining (port inventory outliers, cross-subscription spread, first-seen enumerators, validation-timing
  spikes, probe fan-out), and machine-learning models (graph-based exposure mapping and recon-to-access
  sequence scoring), so a SOC analyst can separate routine Azure administration and change-management
  troubleshooting from systematic intrusion preparation.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is any single principal or host issuing a chained set of Azure control-plane READ operations
    against network security groups, network interfaces, subnets, and public IP objects in the same session,
    consistent with mapping inbound ports and internet exposure?
  context: 'This is the deterministic detection floor for Azure port-mapping reconnaissance under the
    Reconnaissance tactic. An adversary who wants to know which VMs expose SSH, RDP, WinRM, Kubernetes,
    database, or web-management services will read NSG rules, NIC attachments, subnets, and public IP
    objects together to derive allowed inbound ports and source ranges. These are control-plane READ operations
    recorded in the Azure Activity log (for example MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/READ, .../NETWORKINTERFACES/READ,
    .../PUBLICIPADDRESSES/READ) and via CLI/PowerShell commands such as `az network nsg show`, `Get-AzNetworkSecurityGroup`,
    and `Get-AzNetworkInterface`. The analyst matches on operationName plus caller in one session and
    raises priority when the same user or host has no prior history of administering Azure networking.
    A positive result is a caller assembling an exposure picture rather than touching a single resource;
    a negative result is isolated, expected administration tied to a known change. References: [Detections
    in the Sky: Sigma Rules for Cloud Security](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security);
    [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma).'
  answer_sources: &id001
  - Azure Activity Log (Administrative operations)
  - Defender for Cloud Apps
  - Entra ID SignInLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Azure administration workstations, jump hosts, proxy egress paths to management.azure.com, and
    identities newly accessing subscription networking resources'
  range: Last 90 days, correlating read operations within a single sign-in or session.
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH AzureActivity WHERE operationName MATCHES 'MICROSOFT.NETWORK/(NETWORKSECURITYGROUPS|NETWORKINTERFACES|PUBLICIPADDRESSES|VIRTUALNETWORKS)/.*READ';
      GROUP BY caller, correlationId, 1h; ALERT when distinct_resource_types>=2 AND caller NOT IN prior_azure_network_admins;
      OUTPUT caller, operations, resources, timestamps.
- question: Within one sign-in or session, does a caller correlate three or more distinct Microsoft.Network
    read operation types (NSG rules, public IP objects, load balancer front ends, NIC configuration),
    suggesting a systematic inventory of externally reachable services rather than troubleshooting a single
    host?
  context: 'Reconnaissance aimed at prioritizing reachable services produces a breadth signature: the
    same caller pulls several different networking object types in quick succession to build a complete
    exposure map. By aggregating per caller over a one-hour window and counting distinct Microsoft.Network/*
    read operation types, the analyst distinguishes a sweeping inventory workflow from a focused single-host
    fix. A threshold of three or more distinct read types in one session is a practical line for ''systematic
    enumeration.'' A positive result indicates the principal is canvassing the environment''s externally
    reachable surface; a negative result is a narrow, single-object lookup consistent with normal operations.
    Tune against your own Activity-log volume so legitimate broad automation is allowlisted. References:
    [SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma); [Splunk Security Content - Cloud Detections](https://research.splunk.com/cloud/).'
  answer_sources: *id001
  range: Last 90 days, with per-caller aggregation over rolling 1-hour windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP AzureActivity (Microsoft.Network/*/read) BY caller, 1h => distinct_operation_types, resource_count;
      ALERT when distinct_operation_types>=3; OUTPUT caller, operation_types, resource_count, session_window.
- question: Is any caller accumulating a burst of AuthorizationFailed or Forbidden responses (more than
    roughly ten in ten minutes) against Microsoft.Network read operations, indicating brute enumeration
    across networking resources the principal cannot fully read?
  context: 'Failed control-plane reads are a distinct and high-value reconnaissance signal. A principal
    probing the environment''s networking surface often touches resources it lacks permission to read,
    producing a cluster of AuthorizationFailed/Forbidden results. Profiling this error burst separately
    from successful reads catches enumeration that would otherwise blend into noise. Alerting when a caller
    exceeds roughly ten failed Microsoft.Network/* reads within ten minutes surfaces brute, scope-testing
    behavior. A positive result is a principal repeatedly bumping into authorization boundaries while
    canvassing networking objects; a negative result is occasional, isolated permission errors during
    legitimate work. This ties directly to the Reconnaissance tactic because adversaries map both what
    is exposed and what they can reach. References: [Splunk Security Content - Cloud Detections](https://research.splunk.com/cloud/);
    [Detections in the Sky: Sigma Rules for Cloud Security](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security).'
  answer_sources: *id001
  range: Last 90 days, with rolling 10-minute failure-burst windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP AzureActivity WHERE operationName MATCHES 'Microsoft.Network/.*read' AND resultType IN
      ['AuthorizationFailed','Forbidden'] BY caller, 10m => failure_count; ALERT when failure_count>10;
      OUTPUT caller, failure_count, attempted_resources, window.
- question: For each principal and host, does any session exceed the trailing 30-day baseline for NSGs
    reviewed, distinct inbound ports examined, subscriptions touched, network read success/failure ratio,
    or the rate of network inventory commands, or pivot suddenly from no Azure networking activity to
    broad port-focused enumeration?
  context: 'Statistical baselining catches port-mapping reconnaissance that stays within permitted reads
    but is abnormally voluminous or sudden. The analyst baselines per principal and host the daily count
    of NSGs reviewed, distinct inbound ports examined, subscriptions touched, the success/failure ratio
    of network reads, and the frequency of network inventory commands per minute. A session crossing the
    trailing 30-day 95th percentile (or the higher of p95 and 3x median, derived from your own Activity-log
    volume), or a sharp pivot from zero networking activity to broad enumeration, is flagged. A positive
    result is an operator behaving far outside their own norm in a way that maps directly to building
    a port-exposure picture; a negative result is in-baseline routine administration. This supports the
    Reconnaissance tactic by quantifying enumeration intensity. References: [Anomalies detected by the
    Microsoft Sentinel machine learning engine](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id001
  range: Last 90 days, with trailing 30-day per-principal and per-host baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per caller,host over 30d => nsgs_reviewed, distinct_ports, subscriptions_touched,
      read_success_fail_ratio, cmds_per_min; ALERT when session > max(p95, 3*median) OR (prior_30d_network_activity=0
      AND current_session broad_port_enum); OUTPUT metric, value, baseline.
- question: How many subscriptions, resource groups, and virtual networks does a single session query
    for port exposure, and does its breadth, rate, or diversity of examined services materially exceed
    the operator's own history and peer group?
  context: 'Reconnaissance often spreads across organizational boundaries that a focused administrator
    would not normally cross in one sitting. By measuring how many subscriptions, resource groups, and
    virtual networks a session queries for port exposure, along with the read rate (reads/min), the analyst
    scores breadth and tempo against both the operator''s historical pattern and their peer group. Peer-relative
    anomaly scoring flags an account that suddenly fans out across many subscriptions or VNets at high
    speed. A positive result is wide, fast, cross-boundary enumeration consistent with mapping the whole
    estate''s exposure; a negative result is activity confined to the operator''s normal scope and cadence.
    This is tactic-specific to Reconnaissance because adversaries prioritize the broadest reachable surface.
    References: [Identify advanced threats with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources: *id001
  range: Last 90 days, with per-session breadth/rate scoring against 30-day history and peer groups.
  queries:
  - technology: SIEM/Stats pseudocode
    query: per caller,session compute distinct_subscriptions, distinct_resource_groups, distinct_vnets,
      reads_per_min; score vs caller_history AND peer_group; ALERT when breadth_or_rate >> peer_p99; OUTPUT
      caller, breadth_metrics, peer_percentile.
- question: Is this the first time a given principal, source IP/ASN, or geolocation has read Azure networking
    resources (NSG, NIC, or public IP objects), and is that first-seen access paired with notable read
    volume?
  context: 'Reconnaissance frequently originates from novel identities, hosts, or network locations. Flagging
    the first time a principal, source IP/ASN, or geolocation reads Azure networking objects surfaces
    enumeration from new or unexpected origins. Because first-seen alone is noisy, the analyst combines
    it with read volume so a brand-new identity that immediately pulls many networking objects rises to
    the top. A positive result is novel access that maps the exposure surface; a negative result is an
    established operator from a known location performing routine reads. This directly serves the Reconnaissance
    tactic, where the origin of control-plane access is itself a strong indicator of staging for future
    operations. References: [IMDS Anomaly Hunting: Zero-Day Discovery](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources: *id001
  range: Last 90 days, with 90-day first-seen history per principal, IP/ASN, and geolocation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR AzureActivity Microsoft.Network read events: mark first_seen(caller|src_ip|asn|geo) against
      90d history; ALERT when first_seen=true AND read_volume>=volume_floor; OUTPUT caller, src_ip, asn,
      geo, read_count, first_seen_dimension.'
- question: Does a graph- and feature-based model score a principal's command and API sequence as anomalous
    reconnaissance based on NSG read density, variety of port ranges inspected, adjacency of NIC and public
    IP lookups, read success/failure ratio, privilege level, and source-host novelty?
  context: 'When no single rule fires but several weak signals align, a model run in parallel with the
    deterministic NSG-read-chain rule (kept as the floor) can surface subtle exposure-mapping behavior.
    The Activity log is modeled as a principal->resource graph, and the model scores features such as
    NSG read density, the variety of inspected port ranges, the adjacency of NIC and public IP lookups,
    read success/failure ratio, account privilege level, and source-host novelty, flagging anomalous out-degree
    and first-seen control edges. Per explainability guidance, alerts surface the top-3 contributing features
    (for example distinct network resource types, subscription breadth, host novelty). A positive result
    is a session whose graph structure resembles systematic exposure mapping; a negative result is routine
    administration. This supports the Reconnaissance tactic by catching enumeration that evades fixed
    thresholds. References: [Graph Neural Network Based Adaptive Threat Detection for Cloud IAM Logs](https://arxiv.org/abs/2512.10280);
    [Outside the Closed World: On Using ML for Network Intrusion Detection](https://www.icir.org/robin/papers/oakland10-ml.pdf);
    [Anomalies detected by the Microsoft Sentinel machine learning engine](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id001
  range: Last 90 days for model training, with current sessions scored continuously.
  queries:
  - technology: ML pipeline pseudocode
    query: graph = build_principal_resource_graph(AzureActivity); features = [nsg_read_density, port_range_variety,
      nic_publicip_adjacency, read_success_fail_ratio, privilege_level, host_novelty, out_degree, first_seen_edges];
      score = exposure_model.predict_proba(features); ALERT if score>=0.85 (rule-floor always on); OUTPUT
      top_features_3.
- question: Does the same source host or identity that just enumerated Azure NSG and interface objects
    also attempt near-term inbound connections to the exact ports, protocols, and public IPs it reviewed
    (for example SSH, RDP, WinRM, Kubernetes, database, or web-management services)?
  context: 'After mapping exposure, an adversary validates it by connecting to what was just discovered.
    Correlating recent NSG and interface enumeration in the Activity log with near-term connection attempts
    to the exact ports, protocols, and public IPs (from NSG Flow Logs, Azure Firewall, and Zeek conn.log)
    confirms the transition from reconnaissance to validation. The analyst escalates when one source host
    or identity both inventories Azure networking objects and then attempts SSH, RDP, WinRM, Kubernetes,
    database, or web-management connections to the reviewed targets. A positive result is a tight read-then-probe
    match; a negative result is enumeration with no corresponding traffic, or traffic unrelated to what
    was read. This question pursues the Reconnaissance tactic''s validation phase by joining cloud-audit
    and network telemetry. References: [Detections in the Sky: Sigma Rules for Cloud Security](https://www.recordedfuture.com/research/detections-in-the-sky-sigma-rules-to-enhance-cloud-security).'
  answer_sources: &id002
  - Azure Firewall Network Rule Logs
  - NSG Flow Logs
  - Proxy logs
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Internet-facing virtual networks, firewall and flow-log coverage for exposed subnets, and analyst
    workstations or external infrastructure performing follow-on validation'
  range: Last 90 days, joining enumeration to inbound attempts within short (minutes-to-hours) windows.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: 'JOIN AzureActivity(network reads: nsg,nic,publicip) TO (NSGFlowLogs|AzureFirewall|Zeek_conn)
      ON reviewed_publicip+port, time_window<=2h, same source_host_or_identity; ALERT when probe to [22,3389,5985,5986,6443,1433,3306,443];
      OUTPUT caller, src, dst_ip, port, action.'
- question: Do endpoints that just ran Azure network inventory commands immediately launch tools like
    nmap, Test-NetConnection, nc, ssh, mstsc, or browser sessions against the same public IPs and administrative
    ports identified during discovery?
  context: 'This host-centric check ties Azure enumeration to follow-on probing on the same workstation.
    When an endpoint runs Azure network inventory commands and then immediately launches `nmap`, `Test-NetConnection`,
    `nc`, `ssh`, `mstsc`, or browser sessions to the same public IPs and administrative ports just discovered,
    the analyst has strong evidence of validation. Process and network telemetry (Sysmon Event ID 1/3,
    Windows 4688) provide the launches and destinations. A positive result is a discovery-to-probe chain
    on one host; a negative result is inventory commands with no subsequent probing tools, or probing
    unrelated to the reviewed targets. This serves the Reconnaissance tactic by confirming an operator
    is verifying practical entry paths rather than merely viewing configuration. References: [SigmaHQ
    Detection Rules](https://github.com/SigmaHQ/sigma).'
  answer_sources: *id002
  range: Last 90 days, with short post-enumeration windows (minutes) on the originating host.
  queries:
  - technology: EDR/SIEM correlation pseudocode
    query: JOIN azure_inventory_commands(host) TO process_create(Sysmon1|4688) WHERE image IN [nmap,Test-NetConnection,nc,ssh,mstsc,chrome,msedge]
      AND network(Sysmon3) dst_ip IN reviewed_publicips AND dst_port IN reviewed_ports within 30m; OUTPUT
      host, user, image, dst_ip, dst_port.
- question: Across inbound connection attempts per source, does sequential hypothesis testing (Threshold
    Random Walk) declare a scanner because the source hits a high fraction of closed or blocked ports,
    often after only four or five attempts?
  context: 'Scanners reveal themselves by touching many closed or blocked ports, so the ratio of failed-to-successful
    connections rises quickly. Applying sequential hypothesis testing (Threshold Random Walk) over inbound
    attempts per source lets the analyst declare a scanner when the running success/failure likelihood
    ratio crosses threshold, frequently after only four or five attempts. Blocked, RST, and timeout connections
    (NSG Flow Logs deny actions, Zeek S0/REJ states) are profiled as a distinct failure signal. A positive
    result is a source whose connection outcomes statistically resemble scanning of the freshly reviewed
    exposure; a negative result is a source whose attempts mostly succeed against legitimate services.
    This advances the Reconnaissance tactic by detecting probe-based validation of discovered ports. References:
    [Fast Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources: *id002
  range: Last 90 days, evaluating per-source sequences as connections arrive.
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR each source_ip: stream inbound conn outcomes (success vs S0/REJ/timeout or NSG deny);
      update TRW likelihood_ratio per attempt; DECLARE scanner when LR crosses upper_threshold; OUTPUT
      source_ip, attempts_to_decision, failed_fraction, targeted_ports.'
- question: How compressed is the time gap between Azure network inventory activity and the first observed
    inbound validation attempts, and is there unusual fan-out of newly tested ports or an abnormal deny/allow
    ratio against freshly reviewed endpoints?
  context: 'The latency between reading exposure and probing it is itself a signal: adversaries often
    probe within minutes of the read, far faster than routine change-management. The analyst measures
    the time gap between Azure network inventory activity and the first inbound validation attempts, the
    number of newly tested ports per host, and the deny/allow ratio, flagging compressed sequences and
    unusual fan-out against newly reviewed endpoints. Thresholds can be derived from labeled scan traffic
    in flow datasets such as CICIDS2017/UNSW-NB15. A positive result is rapid, broad probing immediately
    after enumeration; a negative result is a long, low-volume gap consistent with normal operations.
    This question supports the Reconnaissance tactic by timing the recon-to-validation handoff. References:
    [A Survey of Network-based Intrusion Detection Data Sets](https://arxiv.org/abs/1903.02460).'
  answer_sources: *id002
  range: Last 90 days, measuring read-to-probe latency and fan-out per host.
  queries:
  - technology: SIEM/Stats pseudocode
    query: per host compute delta = first_inbound_probe_time - azure_inventory_time, new_ports_tested,
      deny_allow_ratio; ALERT when delta<latency_p5 AND (new_ports_tested>fanout_threshold OR deny_allow_ratio
      high); OUTPUT host, delta_minutes, new_ports, deny_allow_ratio.
- question: Per source device, is the count of distinct target IP:port pairs contacted after Azure management
    activity, and the fraction that fail, abnormally high relative to baseline and concentrated on internet-facing
    resources that operator does not normally touch?
  context: 'Validation of discovered exposure produces fan-out: one source reaches many distinct IP:port
    pairs, with a high failure fraction against ports that are closed or blocked. The analyst baselines
    per source device the count of distinct target IP:port pairs contacted after Azure management activity
    and the fraction that fail, then investigates short-lived spikes concentrating on internet-facing
    resources not normally touched by that operator. Volume, fan-out, and failure-rate features plus peer-relative
    baselining drive the score. A positive result is a burst of broad, failure-heavy probing focused on
    newly reviewed exposure; a negative result is steady, in-baseline connectivity to familiar services.
    This serves the Reconnaissance tactic by quantifying the scanning intensity of the validation phase.
    References: [A Survey of Network-based Intrusion Detection Data Sets](https://arxiv.org/abs/1903.02460);
    [Identify advanced threats with UEBA in Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources: *id002
  range: Last 90 days, with 30-day per-source baselines and short spike windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per source over 30d => distinct_ip_port_pairs, fail_fraction; ALERT when current_window
      distinct_pairs>baseline_p99 AND fail_fraction high AND targets internet_facing NOT IN operator_normal_set;
      OUTPUT source, pairs, fail_fraction, targets.
- question: Does a sequence model across endpoint, proxy, and network telemetry identify sessions that
    move from Azure network reads into targeted port validation, using read-to-probe latency, distinct
    ports probed, failed-connection ratio, and resource novelty?
  context: 'The full recon-to-validation chain can be modeled as a sequence: Azure network reads followed
    by targeted port probing. Running a sequence model in parallel with the deterministic rule-to-traffic
    and TRW detectors (kept as the floor) lets the analyst catch chains that no single rule flags. Features
    include read-to-probe latency, distinct ports probed, failed-connection ratio, and resource novelty;
    alerts surface the top-3 contributing features. Cases are ranked higher when the sequence mirrors
    known intrusion preparation rather than change-management troubleshooting. A positive result is a
    session whose ordered behavior matches recon-then-access; a negative result is administration that
    reads configuration without a matching validation sequence. This directly serves the Reconnaissance
    tactic by modeling the transition into early access attempts. References: [Outside the Closed World:
    On Using ML for Network Intrusion Detection](https://www.icir.org/robin/papers/oakland10-ml.pdf);
    [Anomalies detected by the Microsoft Sentinel machine learning engine](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources: *id002
  range: Last 90 days for training, with current sessions scored as event sequences.
  queries:
  - technology: ML pipeline pseudocode
    query: seq = build_session_sequence(azure_reads, proxy, endpoint, network_probes); features = [read_to_probe_latency,
      distinct_ports_probed, failed_conn_ratio, resource_novelty]; score = sequence_model.predict(seq)
      (det floor always on); ALERT when score>=0.80 AND resembles intrusion_prep; OUTPUT top_features_3.
