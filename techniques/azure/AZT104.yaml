name: 'AZT104: Gather User Information'
id: 5696cb92-0c09-43f7-8961-1819f8c3e074
description: Investigate whether an adversary is conducting Azure / Entra ID identity reconnaissance by
  enumerating user profile attributes, group and directory-role memberships, manager chains, application
  ownership, and contact details via Microsoft Graph, Azure CLI, Azure PowerShell, or the Azure portal.
  This playbook helps an analyst determine if a principal is performing breadth-first directory reconnaissance
  (the read surface used by tools such as AzureHound) at a volume or scope inconsistent with ordinary
  collaboration, and whether that enumeration then pivots into focused collection on administrators, executives,
  application owners, or users tied to sensitive mailboxes, Teams, and SharePoint - indicating target
  prioritization for follow-on access or phishing. It correlates MicrosoftGraphActivityLogs, Entra ID
  sign-in and audit logs, PowerShell script-block (Event ID 4104), process creation (Windows Event ID
  4688), proxy egress to graph.microsoft.com, and Office activity to profile read volume, breadth, sequence/timing,
  failure-rate bursts (403/429/404 permission probing), and targeting skew toward high-value identities.
  Methods span symbolic-logic detections, statistical baselining (robust modified Z-score, per-role standard
  deviation, first-seen, time-series forecasting, Markov sequence scoring), and machine-learning models
  (Isolation Forest, graph/GNN victim-selection models, UEBA peer-group deviation) to give the SOC granular,
  defensible coverage of Azure identity reconnaissance.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a single principal or session read an unusually large number of distinct Entra ID user
    objects (for example 200 or more via Graph /users or /users/{id}) or repeatedly call membership endpoints
    (/memberOf, /transitiveMemberOf) within a one-hour window, including the Azure CLI and Azure PowerShell
    equivalents?
  context: 'In the Reconnaissance tactic, an adversary maps the directory before selecting targets, and
    the tell-tale signature is breadth-first reading of many distinct user objects and membership endpoints
    in a short window - the exact read surface documented for AzureHound. Over MicrosoftGraphActivityLogs
    (requestUri/requestMethod) and CLI/PowerShell equivalents, alert when one principal or session reads
    >=200 distinct user objects or repeatedly traverses /memberOf and /transitiveMemberOf within an hour.
    Do not leave the threshold static: derive the per-tenant count from the trailing 30-day 99th percentile
    of distinct users read per principal-session so noisy admin tooling does not generate false positives.
    A positive result indicates targeted directory reconnaissance rather than ordinary collaboration;
    a negative result reflects normal, narrowly-scoped directory access. Portable rule logic exists in
    SigmaHQ and Recorded Future cloud Sigma research.'
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Windows Event ID 4688
  - 'NAI: Identity administration endpoints, egress to graph.microsoft.com, Entra sign-in context for
    Graph sessions, and tenants containing privileged or high-value users'
  range: Last 90 days (alert on a 1-hour sliding window; baseline distinct-user count over trailing 30
    days)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=MicrosoftGraphActivityLogs (requestUri="*/users*" OR requestUri="*/memberOf*" OR requestUri="*/transitiveMemberOf*")

      | bin _time span=1h

      | stats dc(target_user_id) as distinct_users count(eval(match(requestUri,"memberOf"))) as membership_calls
      by principalId, sessionId, _time

      | lookup tenant_baseline OUTPUT p99_distinct_users

      | where distinct_users >= coalesce(p99_distinct_users, 200) OR membership_calls > 50

      | alert'
- question: Did a single identity, within one session, pivot from user listings into manager chains, group/transitive-group
    traversals, /directoryRoles membership, application ownership, and contact-detail harvesting - chaining
    multiple directory object types together?
  context: AzureHound-style collection does not just read users; it expands across the directory graph,
    walking from user listings into manager chains, group and transitive-group membership, directory-role
    membership, app ownership, and contact details in a single session. This relationship expansion is
    a stronger reconnaissance signal than any single read because it reconstructs the org and privilege
    structure. Alert when one identity touches several of these distinct object-type categories in the
    same session. A positive result indicates deliberate directory mapping; a negative result is a single
    object type consistent with a normal lookup. Microsoft Defender for Cloud Apps behavior policies for
    unusual administrative/impersonated activity add a complementary deterministic layer.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Windows Event ID 4688
  - 'NAI: Identity administration endpoints, egress to graph.microsoft.com, Entra sign-in context for
    Graph sessions, and tenants containing privileged or high-value users'
  range: Last 90 days (evaluate per session)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=MicrosoftGraphActivityLogs

      | eval otype=case(match(requestUri,"/users"),"user", match(requestUri,"manager"),"manager", match(requestUri,"memberOf|groups"),"group",
      match(requestUri,"directoryRoles"),"role", match(requestUri,"ownedObjects|appOwner"),"appowner",
      match(requestUri,"contacts|otherMails|phones"),"contact")

      | stats dc(otype) as object_types values(otype) as types by principalId, sessionId

      | where object_types >= 4

      | alert'
- question: Did a principal generate a burst of HTTP 403/429 (and 404) error responses against Graph /users,
    /groups, /directoryRoles, or /servicePrincipals endpoints - for example more than 25 failures in 10
    minutes, or a failure ratio above 0.3 across 50 or more calls?
  context: 'Error responses are a distinct, high-value reconnaissance signal: scripted enumeration that
    probes scope and permissions produces clustered authorization (403), throttling (429), and not-found
    (404) responses as it sweeps endpoints it may not be entitled to read. Flag a principal generating
    a burst of such failures on Graph /users, /groups, /directoryRoles, or /servicePrincipals (start threshold
    >25 failures in 10 minutes, or failure ratio >0.3 over >=50 calls). A positive result indicates scripted
    scope/permission probing characteristic of cloud discovery; a negative result reflects the occasional
    benign error. This mirrors cloud discovery patterns described in Recorded Future cloud Sigma research.'
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Windows Event ID 4688
  - 'NAI: Identity administration endpoints, egress to graph.microsoft.com, Entra sign-in context for
    Graph sessions, and tenants containing privileged or high-value users'
  range: Last 90 days (alert on a 10-minute sliding window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=MicrosoftGraphActivityLogs (requestUri="*/users*" OR requestUri="*/groups*" OR requestUri="*/directoryRoles*"
      OR requestUri="*/servicePrincipals*")

      | bin _time span=10m

      | stats count as calls count(eval(responseStatusCode IN (403,429,404))) as failures by principalId,
      _time

      | eval fail_ratio=failures/calls

      | where failures > 25 OR (calls >= 50 AND fail_ratio > 0.3)

      | alert'
- question: Is a principal's distinct-users / distinct-groups / distinct-attributes read per day, or its
    Graph read rate, a statistical outlier versus its own baseline using a robust modified Z-score (|Mi|>3.5),
    or is this the first time the principal has performed directory enumeration at all?
  context: Volume-based reconnaissance is best caught by baselining each principal and using robust statistics
    that resist distortion from legitimate batch jobs. Baseline per principal the distinct users, groups,
    and attributes read per day and the Graph read rate, then alert using median-absolute-deviation /
    modified Z-score (|Mi|>3.5) rather than mean+stddev so periodic automation does not inflate thresholds.
    Additionally alert on first-seen enumeration per principal (a CloudTrail-anomaly-detector style lookback).
    Use Prophet-style time-series forecasting to catch seasonal spikes beyond predicted bands. A positive
    result means the identity is reading the directory unlike its own history; a negative result is within
    normal variation. Name the metric, baseline, and observed value in the alert.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Windows Event ID 4688
  - 'NAI: Identity administration endpoints, egress to graph.microsoft.com, Entra sign-in context for
    Graph sessions, and tenants containing privileged or high-value users'
  range: Last 90 days (baseline 30 days; evaluate per principal per day)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=MicrosoftGraphActivityLogs earliest=-90d

      | bin _time span=1d

      | stats dc(target_user_id) as distinct_users dc(group_id) as distinct_groups dc(attribute) as distinct_attrs
      count as read_rate by principalId, _time

      | eventstats median(distinct_users) as med mad(distinct_users) as mad by principalId

      | eval mz=0.6745*(distinct_users-med)/mad

      | eval first_seen=if(isnull(med),1,0)

      | where abs(mz)>3.5 OR first_seen=1

      | eval detail="metric=distinct_users baseline=".med." observed=".distinct_users | alert'
- question: Does a session sample an unusually high fraction of the total tenant user population, span
    an unusual number of distinct departments/geographies, or over-represent privileged roles relative
    to robust per-role baselines?
  context: 'Beyond raw volume, the breadth of directory coverage in a single session reveals reconnaissance
    intent: enumeration tools sweep across departments, geographies, and business units that an individual
    operator would never legitimately need together. Measure how broadly a session samples the directory
    (fraction of total tenant users, distinct departments/geographies, privileged-role representation)
    and flag sessions touching an unusually high fraction or spanning unrelated business units, using
    robust per-role standard-deviation baselines. A positive result indicates broad, indiscriminate directory
    sampling consistent with reconnaissance; a negative result reflects access confined to a coherent,
    expected slice of the directory.'
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Windows Event ID 4688
  - 'NAI: Identity administration endpoints, egress to graph.microsoft.com, Entra sign-in context for
    Graph sessions, and tenants containing privileged or high-value users'
  range: Last 90 days (baseline 30 days; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=MicrosoftGraphActivityLogs earliest=-90d

      | lookup user_directory target_user_id OUTPUT department, geography, is_privileged

      | stats dc(target_user_id) as users_read dc(department) as depts dc(geography) as geos count(eval(is_privileged=1))
      as priv_reads by principalId, sessionId

      | eval tenant_fraction=users_read/`tenant_total_users`

      | eventstats stdev(tenant_fraction) as sd_frac avg(tenant_fraction) as avg_frac by role

      | where tenant_fraction > avg_frac + 3*sd_frac OR depts > 5

      | alert'
- question: Does the ordered sequence of a principal's Graph calls match a scripted enumeration pattern
    (for example list users -> get user -> memberOf -> directoryRoles) scored as improbable by a variable-order
    Markov model, or do request inter-arrival times show near-constant timing (low coefficient of variation)
    indicating automation rather than human admin activity?
  context: Human administrators issue directory queries irregularly and in response to specific tasks,
    whereas scripted enumeration follows a predictable call ordering at machine-regular intervals. Score
    the ordered Graph call sequence (e.g., list users -> get user -> memberOf -> directoryRoles) for plausibility
    with variable-order / multi-order Markov chains, and flag near-constant request inter-arrival times
    (low coefficient of variation) that betray scripted enumeration. A positive result highlights a session
    whose call order and cadence are structurally machine-like; a negative result reflects irregular,
    human-paced activity. Combine both signals so that either an improbable ordering or robotic timing
    raises the alert.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Windows Event ID 4688
  - 'NAI: Identity administration endpoints, egress to graph.microsoft.com, Entra sign-in context for
    Graph sessions, and tenants containing privileged or high-value users'
  range: Last 90 days (train Markov model on 30 days; score per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=MicrosoftGraphActivityLogs earliest=-90d

      | sort 0 principalId sessionId _time

      | streamstats current=f last(_time) as prev_time by principalId, sessionId

      | eval interarrival=_time-prev_time

      | stats list(requestUri) as call_sequence stdev(interarrival) as sd_ia avg(interarrival) as mean_ia
      by principalId, sessionId

      | eval cv=sd_ia/mean_ia

      | eval seq_prob=`markov_sequence_score(call_sequence)`

      | where seq_prob < 0.01 OR cv < 0.1

      | alert'
- question: Does an unsupervised model (Isolation Forest) score a Graph/endpoint enumeration session as
    anomalous across features such as distinct-user fan-out, privilege of queried accounts, proportion
    of first-time lookups, membership traversal depth, source-host novelty, and failure rate - with the
    top-3 contributing features surfaced, and does it agree with Sentinel UEBA peer-group deviation?
  context: Sophisticated actors blend benign and reconnaissance calls to evade single-feature thresholds,
    so model the overall shape of each session. Score Graph/endpoint sessions with an unsupervised Isolation
    Forest over features (distinct-user fan-out, privilege of queried accounts, proportion of first-time
    lookups, membership traversal depth, source-host novelty, failure rate) and surface the top-3 contributing
    features in the alert so triage ties the score to concrete evidence. Complement with rare-population
    jobs (Elastic CloudTrail ML style) and peer-group deviation from Sentinel UEBA and Sentinel built-in
    anomalies. A positive result flags a session that is structurally unusual across multiple reconnaissance
    features at once and warrants triage.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Windows Event ID 4688
  - 'NAI: Identity administration endpoints, egress to graph.microsoft.com, Entra sign-in context for
    Graph sessions, and tenants containing privileged or high-value users'
  range: Last 90 days (train on 30 days of sessions; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Per-session Graph enumeration features -> Isolation Forest + UEBA

      featurize session: [distinct_user_fanout, queried_privilege_score, first_time_lookup_ratio, membership_traversal_depth,
      source_host_novelty, failure_rate]

      | score isolation_forest -> if_score, shap_top3

      | correlate sentinel_ueba_peer_deviation(principalId) -> ueba_score

      | where if_score > threshold OR ueba_score > threshold

      | emit principalId, if_score, shap_top3'
- question: After broad user enumeration, did the same principal concentrate reads on /directoryRoles,
    management chains, application ownership, or a small cluster of privileged/executive accounts - and
    did that principal later attempt authentication, OAuth consent, or mailbox access against those same
    targets?
  context: Reconnaissance becomes dangerous when broad enumeration narrows to high-value identities. Alert
    when user enumeration is followed by concentrated reads on /directoryRoles, management chains, app
    ownership, or a small cluster of privileged/executive accounts in MicrosoftGraphActivityLogs, and
    raise severity when the same principal later attempts authentication, OAuth consent, or mailbox access
    against those targets - the transition from recon to action. Correlate with risky-user / risky-sign-in
    signals from Entra ID Protection. A positive result indicates target prioritization for access; a
    negative result is enumeration without observed high-value focus or follow-through.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - OfficeActivity
  - 'NAI: Privileged identity populations, business leadership accounts, app-owner groups, and user populations
    associated with sensitive mailboxes, Teams, or SharePoint sites'
  range: Last 90 days (correlate enumeration and follow-on within a 24-hour window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=MicrosoftGraphActivityLogs

      | transaction principalId maxspan=24h

      | eval enumerated=searchmatch("requestUri=*/users*")

      | lookup hvi_users target_user_id OUTPUT is_privileged, is_executive, is_app_owner

      | eval focused=if((is_privileged=1 OR is_executive=1 OR is_app_owner=1) AND searchmatch("requestUri=*directoryRoles*
      OR requestUri=*manager*"),1,0)

      | join type=left principalId [ search source="Entra ID SignInLogs" OR source=OfficeActivity (auth_attempt
      OR oauth_consent OR mailbox_access) ]

      | where enumerated AND focused

      | eval severity=if(isnotnull(followon_action),"high","medium") | alert'
- question: Did a workflow gather email addresses, reporting lines, alternate contact details, and group
    memberships for a narrowed high-value subset of users immediately after tenant-wide enumeration -
    the signature of assembling a targeted phishing list?
  context: 'Adversaries preparing social-engineering campaigns harvest the specific attributes needed
    to impersonate and target victims: email addresses, reporting lines, alternate contact details, and
    group memberships, focused on a narrowed high-value subset right after a tenant-wide sweep. Flag this
    broad-to-narrow contact-harvesting workflow using cloud identity-recon rule patterns from SigmaHQ
    and Recorded Future cloud Sigma research. A positive result strongly suggests phishing-list assembly
    and target prioritization; a negative result reflects enumeration without focused contact-detail collection.'
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - OfficeActivity
  - 'NAI: Privileged identity populations, business leadership accounts, app-owner groups, and user populations
    associated with sensitive mailboxes, Teams, or SharePoint sites'
  range: Last 90 days (correlate within a 24-hour window after broad enumeration)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=MicrosoftGraphActivityLogs

      | transaction principalId maxspan=24h

      | eval broad_sweep=if(dc_users_read>200,1,0)

      | eval contact_harvest=if(match(requestUri,"mail|otherMails|phones|manager|memberOf"),1,0)

      | lookup hvi_users target_user_id OUTPUT is_high_value

      | stats sum(broad_sweep) as swept sum(contact_harvest) as harvested dc(eval(is_high_value=1)) as
      hv_targets by principalId

      | where swept>0 AND harvested>0 AND hv_targets>0 AND hv_targets<50

      | alert'
- question: Is the share of enumerated users who hold privileged roles, own applications, or belong to
    sensitive groups disproportionately high for this session relative to the principal's own history,
    per a robust modified Z-score threshold?
  context: Targeting skew measures whether a session's attention is concentrated on high-value identities
    far more than the actor's norm. Measure the share of enumerated users who hold privileged roles, own
    applications, or belong to sensitive groups, and flag sessions whose targeting is disproportionately
    concentrated on high-value identities relative to the actor's history using robust modified Z-score
    thresholds (|z|>3.5, median absolute deviation). A positive result indicates the principal is selectively
    focusing on privileged/sensitive accounts - a precursor to access or phishing; a negative result reflects
    targeting distributed across ordinary users. Report the high-value share and the specific accounts
    in the alert.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - OfficeActivity
  - 'NAI: Privileged identity populations, business leadership accounts, app-owner groups, and user populations
    associated with sensitive mailboxes, Teams, or SharePoint sites'
  range: Last 90 days (baseline 30 days; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=MicrosoftGraphActivityLogs earliest=-90d

      | lookup hvi_users target_user_id OUTPUT is_privileged, is_app_owner, is_sensitive_group

      | stats count as total sum(eval(is_privileged=1 OR is_app_owner=1 OR is_sensitive_group=1)) as high_value
      by principalId, sessionId

      | eval hv_share=high_value/total

      | eventstats median(hv_share) as med mad(hv_share) as mad by principalId

      | eval mz=0.6745*(hv_share-med)/mad

      | where abs(mz)>3.5

      | table principalId hv_share high_value | alert'
- question: Did a principal who normally queries certain roles/departments suddenly concentrate on executives,
    admins, or application owners they have no normal need to query, per per-role standard-deviation baselines
    or first-seen logic?
  context: Each operator has a normal set of roles and departments they legitimately query; a sudden shift
    toward executives, admins, or app owners is a strong reconnaissance-targeting signal. Baseline which
    roles/departments each operator normally queries and alert via per-role standard-deviation baselines
    or first-seen logic when a user with no normal need suddenly concentrates on high-value populations.
    A positive result indicates an operator deviating from their established targeting pattern toward
    high-value identities; a negative result reflects queries consistent with the operator's role. This
    complements targeting-skew analysis by focusing on the operator's behavioral baseline rather than
    the session ratio.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - OfficeActivity
  - 'NAI: Privileged identity populations, business leadership accounts, app-owner groups, and user populations
    associated with sensitive mailboxes, Teams, or SharePoint sites'
  range: Last 90 days (baseline 30 days; evaluate per session)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=MicrosoftGraphActivityLogs earliest=-90d

      | lookup user_directory target_user_id OUTPUT queried_role, queried_dept

      | stats count as cnt by principalId, queried_role

      | eventstats avg(cnt) as avg_role stdev(cnt) as sd_role first_seen(queried_role) as baseline_roles
      by principalId

      | eval first_seen=if(NOT queried_role IN baseline_roles AND queried_role IN ("GlobalAdmin","Executive","AppOwner"),1,0)

      | where cnt > avg_role + 3*sd_role OR first_seen=1

      | alert'
- question: Do graph-based models (GNN over IAM logs, CS-GAD tripartite user/service/activity graphs)
    combined with Isolation Forest scoring indicate that a principal's directory reads are building a
    prioritized victim list - based on privilege centrality of queried users, broad-to-narrow traversal,
    and follow-on identity/collaboration activity?
  context: Determining whether enumeration is assembling a prioritized victim list requires understanding
    the relationships among queried identities, not just counts. Apply graph models - a GNN over IAM logs
    and CS-GAD tripartite user/service/activity graphs - to assess whether directory reads concentrate
    on high-centrality privileged users and follow a broad-to-narrow traversal toward them. Features include
    privilege centrality of queried users, broad-to-narrow traversal, and follow-on identity/collaboration
    activity. Score with Isolation Forest, surface the top-3 contributing features, and correlate peer-group
    deviation from Sentinel UEBA. A positive result indicates an identity constructing a targeted victim
    set, a strong precursor to credential access or phishing; a negative result reflects reads without
    victim-list structure.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - Entra ID SignInLogs
  - Entra ID AuditLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - OfficeActivity
  - 'NAI: Privileged identity populations, business leadership accounts, app-owner groups, and user populations
    associated with sensitive mailboxes, Teams, or SharePoint sites'
  range: Last 90 days (build graph over 30-90 days; score per session)
  queries:
  - technology: SIEM/ML pseudocode
    query: '// Graph-based victim-selection models over user-service-activity graph

      build_graph(nodes=[principal, queried_user, activity], edges=read, window=90d)

      | score gnn_iam(session) -> gnn_score

      | score cs_gad(session) -> pivot_score

      | features [privilege_centrality, broad_to_narrow_traversal, followon_identity_collab_activity]

      | score isolation_forest -> if_score, shap_top3

      | correlate sentinel_ueba_peer_deviation(principalId) -> ueba_score

      | where gnn_score>thr OR pivot_score>thr OR if_score>thr

      | emit principalId, if_score, shap_top3'
