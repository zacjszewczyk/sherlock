  - 'NAI: Internet-facing Entra sign-in paths, externally reachable authentication endpoints, high-value
    tenant user populations, and source infrastructure generating multi-account failures'
  range: Last 90 days, with peer-group and per-entity baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ENRICH targeted_users WITH role(admin/exec), CA_exemption_flag, breach_corpus_match; SCORE
      source by concentration_on_high_value_population vs peer_group_baseline; ALERT when concentration
      exceeds expected; OUTPUT source, targeted_high_value_users, score.
- question: Does an unsupervised anomaly model (e.g., Isolation Forest) score a failed-authentication
    session as a high-confidence spray based on distinct-user count, failure:success ratio, per-resultType
    error mix, source-IP reputation/churn, user-agent reuse, inter-attempt timing, and targeted-app set?
  context: 'When no single feature is decisive, an unsupervised detector such as Isolation Forest isolates
    spray sessions with short path length in linear time and without labels, combining many weak signals
    into one score. For Initial Access, run this model in parallel with — never instead of — the deterministic
    distinct-user and failure-code thresholds, and combine it with peer-group UEBA risk scoring. Every
    alert must surface the top-3 contributing features (for example distinct-user fan-out, invalid-user
    failure share, IP churn) so analysts triage the cause rather than a bare score. A positive result
    is an anomalous session whose feature attributions point to spray behavior; a negative result is a
    session that scores normal across these features. References: [Isolation Forest, Liu et al](https://doi.org/10.1109/ICDM.2008.17);
    [Identify Threats with Entity Behavior Analytics, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [Recurrent Neural Network Attention Mechanisms for Interpretable System Log Anomaly Detection, Brown
    et al](https://arxiv.org/abs/1803.04967).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - Azure Firewall Network Rule Logs
  - 'NAI: Internet-facing Entra sign-in paths, externally reachable authentication endpoints, high-value
    tenant user populations, and source infrastructure generating multi-account failures'
  range: Last 90 days for training features, with live scoring of failed-auth sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [distinct_user_count, failure_success_ratio, resultType_mix, ip_reputation, ip_churn,
      ua_reuse, inter_attempt_timing, targeted_app_set]; score = isolation_forest.score(features); ALERT
      on high-anomaly sessions; OUTPUT top_3_features; run alongside deterministic rules.
- question: Do failed sign-ins spread across multiple IPs or time buckets share user-agent traits, target
    overlapping account populations, or cycle one attempt per user before rotating sources, revealing
    a low-and-slow spray?
  context: 'Adversaries evade simple thresholds by distributing attempts across many source IPs and long
    windows, but the campaign still betrays itself through persistent overlap in targeted users, shared
    failure-code patterns, and consistent timing. For Initial Access, cluster failed sign-ins by targeted-user
    overlap, failure-code pattern, and timing to expose sprays spread across infrastructure, and remember
    that even low-and-slow source sets retain a high failure-to-success ratio. A positive result is a
    set of disparate sources bound together by shared targets and behavior; a negative result is unrelated
    failures with no overlapping target or pattern. References: [Hunting for Low and Slow Password Sprays
    Using Machine Learning, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052);
    [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - 'NAI: Longer time-window sign-in telemetry, password-spray susceptible user populations, and infrastructure
    used to spread attempts across IPs or hours'
  range: Last 90 days, with multi-day clustering windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: CLUSTER failed_signins BY targeted_user_overlap, resultType_pattern, ua_traits, timing across
      IPs and time_buckets; FLAG clusters spanning many source_ips with shared targets AND high aggregate
      failure:success; OUTPUT cluster_id, member_ips, shared_users.
- question: Did any account experience a successful authentication from the same source cluster, user
    agent, or infrastructure family shortly after being included in a failure campaign, and is that success
    structurally novel for the user?
  context: 'This is the confirmation step that turns spray detection into compromise scoping: a success
    from spray-associated infrastructure shortly after a failure campaign is a strong takeover signal,
    especially when it is structurally novel — a (user, source, destination/app) combination never seen
    for that user, or a never-before-seen source-IP-to-account edge. For Initial Access, join failure
    campaigns to subsequent successes on the same source cluster and verify novelty against the user''s
    history. A positive result is a novel success tied to spray infrastructure, indicating likely account
    takeover; a negative result is a success matching the user''s established source/app patterns. References:
    [Detecting Structurally Anomalous Logins Within Enterprise Networks, Siadati and Memon](https://www.semanticscholar.org/paper/Detecting-Structurally-Anomalous-Logins-Within-Siadati-Memon/2614038b2e4c837adeeaab86341224065e76109d);
    [On Bayesian new edge prediction and anomaly detection in computer networks, Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - 'NAI: Longer time-window sign-in telemetry, password-spray susceptible user populations, and infrastructure
    used to spread attempts across IPs or hours'
  range: Last 90 days, with correlation centered on the success event and a lookback over the preceding
    failure campaign.
  queries:
  - technology: SIEM/Rule pseudocode
    query: JOIN spray_failure_campaign TO later_success ON account, shared(source_cluster OR user_agent
      OR ASN), success_time within campaign+window; CONFIRM if (user, source, app) is first_seen for user
      OR source_ip->account edge is novel; OUTPUT account, source, novelty_flag.
- question: Does change-point detection over rolling 24-hour and 7-day failed-sign-in and distinct-user
    fan-out series reveal a spray onset even though no single hour crosses a static threshold?
  context: 'Low-and-slow sprays are designed so that no single hour looks alarming, so static thresholds
    miss them. This statistical method computes rolling 24-hour and 7-day metrics for failed attempts
    per user, per source cluster, and per application, then applies change-point detection (CUSUM or Bayesian
    online CPD) to the cumulative failed-sign-in and distinct-user fan-out series to detect onset. For
    Initial Access, derive thresholds from each tenant''s own history. A positive result is a detected
    change point marking the start of sustained elevated failures or fan-out; a negative result is a stable
    series with no structural break. References: [A Survey of Methods for Time Series Change Point Detection,
    Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); [Detecting Password Spraying
    Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - 'NAI: Longer time-window sign-in telemetry, password-spray susceptible user populations, and infrastructure
    used to spread attempts across IPs or hours'
  range: Last 90 days, with rolling 24-hour and 7-day windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: BUILD rolling 24h/7d series of failed_attempts and distinct_user_fanout per user/source_cluster/app;
      APPLY CUSUM or Bayesian_online_CPD to cumulative series; ALERT on detected change_point; derive
      thresholds from tenant history; OUTPUT series, change_point_time.
- question: Does a campaign rotate IPs or client fingerprints while maintaining persistent overlap in
    targeted users and applications in a way that is statistically unlikely under normal authentication
    noise?
  context: 'The discriminator for distributed sprays is persistent user/app overlap across churning sources:
    benign noise does not coordinate the same targets across many rotating IPs. For Initial Access, measure
    how often a campaign rotates source IPs or client fingerprints while continuing to hit the same user
    and application set, and compare that coordination against per-entity and peer-group baselines. A
    positive result is high source churn bound to a stable, overlapping target set whose coordination
    is improbable by chance; a negative result is rotating sources with no shared targets. References:
    [Hunting for Low and Slow Password Sprays Using Machine Learning, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052);
    [Identify Threats with Entity Behavior Analytics, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - 'NAI: Longer time-window sign-in telemetry, password-spray susceptible user populations, and infrastructure
    used to spread attempts across IPs or hours'
  range: Last 90 days, with rolling multi-day windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: MEASURE source_ip/fingerprint churn_rate against persistent targeted_user_app_overlap; SCORE
      coordination_probability vs peer_group/per_entity baseline; ALERT when overlap_persists despite
      high churn AND coordination unlikely; OUTPUT churn_rate, overlap_set, score.
- question: Is the rate and distribution of Entra failure codes (50126 invalid password, 50053 lockout/IP-blocked,
    50057 disabled, 50034 user-not-found) per source cluster or targeted population shifting toward invalid-user
    or lockout codes, or is there a spike in account lockouts?
  context: 'Profiling the failure-code distribution per source cluster and per targeted population as
    a distinct signal separates spraying from ordinary user error. A rising share of invalid-user (50034)
    or lockout (50053) codes, or a spike in account lockouts over a defined period, indicates systematic
    guessing rather than legitimate failures. For Initial Access, track these per-code rates over time
    and alert when the mix shifts. A positive result is a source cluster whose failure profile moves toward
    invalid-user/lockout codes; a negative result is a stable, mostly invalid-password profile consistent
    with routine mistypes. References: [Detecting Password Spraying Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - 'NAI: Longer time-window sign-in telemetry, password-spray susceptible user populations, and infrastructure
    used to spread attempts across IPs or hours'
  range: Last 90 days, with rolling daily windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: PROFILE per source_cluster/targeted_population the rate+distribution of resultType [50126,50053,50057,50034];
      ALERT when invalid_user OR lockout share rises OR account_lockout_count spikes; OUTPUT cluster,
      code_distribution_trend, lockout_count.
- question: Does unsupervised clustering and temporal anomaly detection — combined with a sign-in event-sequence
    model — separate distributed, evasive spray activity from routine noise based on inter-arrival time,
    source churn, targeted-user overlap, failure-code similarity, and eventual success transitions?
  context: 'Evasive distributed sprays require ML that models both feature space and event order. Apply
    unsupervised clustering and temporal anomaly detection over inter-arrival time, source churn, targeted-user
    overlap, failure-code similarity, and eventual success transitions; add a sign-in event-sequence model
    to flag abnormal failed-then-success logon sequences and score per-source feature vectors with Isolation
    Forest. For Initial Access, surface the top-3 contributing features in every alert via attention/attribution,
    train and validate on enterprise authentication telemetry such as the LANL datasets, and run ML in
    parallel with deterministic rules — never replacing them. A positive result is a cluster or sequence
    whose attributions indicate coordinated evasive spraying; a negative result is activity that resolves
    into ordinary noise. References: [Hunting for Low and Slow Password Sprays Using Machine Learning,
    Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052);
    [DeepLog: Anomaly Detection and Diagnosis from System Logs, Du et al](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf);
    [Isolation Forest, Liu et al](https://doi.org/10.1109/ICDM.2008.17); [Recurrent Neural Network Attention
    Mechanisms for Interpretable System Log Anomaly Detection, Brown et al](https://arxiv.org/abs/1803.04967);
    [Unified Host and Network Data Set, Turcotte et al](https://arxiv.org/abs/1708.07518); [LANL User-Computer
    Authentication Dataset, Kent](https://csr.lanl.gov/data/auth/).'
