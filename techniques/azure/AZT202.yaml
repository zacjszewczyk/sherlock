name: 'AZT202: Password Spraying'
id: 48cfd492-efb7-43bd-921d-5fbb27a2e2a1
description: Investigate adversary attempts to gain initial access to Microsoft Entra ID (Azure AD) through
  password spraying, in which a single actor or coordinated infrastructure tries one or a few common,
  reused, or breach-corpus passwords against many distinct user accounts to evade lockout thresholds.
  This playbook helps an analyst distinguish spray activity from ordinary user typos by examining single-source
  fan-out across many distinct failed users, single-attempt-per-user iteration, and the distribution of
  Entra sign-in failure codes (resultType 50126 invalid password, 50053 lockout/IP-blocked, 50057 disabled,
  50034 user-not-found). It covers high-volume bursts as well as low-and-slow campaigns distributed across
  multiple IPs, hours, and applications, statistical baselining of failure density and failure-to-success
  ratios, concentration on high-value or protected accounts, change-point detection of gradual onset,
  source-churn correlation, and machine-learning anomaly and sequence models. It also pursues confirmation
  of compromise when a structurally novel success follows a failure campaign from the same source cluster,
  so analysts can move from spray detection to account takeover scoping.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
