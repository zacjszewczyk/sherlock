questions:
- question: Is a single source IP, device fingerprint, or user agent producing failed Entra sign-ins against
    many DISTINCT user accounts within a short window, especially against Azure Portal, Azure CLI, PowerShell,
    or Graph-connected apps and sharing the invalid-password failure code (resultType 50126)?
  context: 'This is the core deterministic signature of high-volume password spraying for Initial Access:
    legitimate users almost never authenticate against a large number of different accounts, so a single
    source fanning out across many distinct failed users is not normal behavior. Start your distinct-user
    count threshold at >=10 distinct failed users per source per hour and tune to the tenant''s normal
    baseline. Concentrate on app paths that adversaries favor for programmatic credential testing and
    on failures sharing resultType 50126 (invalid password), which indicate guessing valid usernames with
    wrong passwords. A positive result is a source touching far more distinct users than any benign client;
    a negative result is a source whose failures concentrate on one or two of its own accounts. References:
    [Detecting Password Spraying Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - Azure Firewall Network Rule Logs
  - 'NAI: Internet-facing Entra sign-in paths, externally reachable authentication endpoints, high-value
    tenant user populations, and source infrastructure generating multi-account failures'
  range: Last 90 days, with 1-hour aggregation windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: GROUP failed_signins (resultType=50126) BY source_ip, device_fingerprint, user_agent, 1h; COUNT
      distinct_failed_users; ALERT when distinct_failed_users>=10 (tune per tenant) AND target_app IN
      [AzurePortal, AzureCLI, PowerShell, MicrosoftGraph]; OUTPUT source, distinct_users, app, failure_codes.
- question: Is one source performing only one or two failed sign-ins per account across a large set of
    distinct users before moving on, rather than many retries against a single account?
  context: 'Single-attempt fan-out is a stronger spray signature than repeated retries against one account
    because adversaries cap attempts per user at the expected lockout threshold to stay under the radar,
    and often iterate usernames alphabetically or from generated lists. For Initial Access, look for a
    low max-attempts-per-user combined with a high distinct-user count from the same source, and inspect
    whether the targeted usernames appear in sequential or list-derived order. A positive result is a
    broad, shallow pattern (many users, <=2 attempts each); a negative result is a deep pattern concentrated
    on few accounts, which is more consistent with a single user mistyping a password. References: [Password
    Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
  - Identity Protection
  - Proxy logs
  - Azure Firewall Network Rule Logs
  - 'NAI: Internet-facing Entra sign-in paths, externally reachable authentication endpoints, high-value
    tenant user populations, and source infrastructure generating multi-account failures'
  range: Last 90 days, with 24-hour aggregation windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: GROUP failed_signins BY source_ip, 24h; COMPUTE distinct_users, max_attempts_per_user; ALERT
      when distinct_users>=20 AND max_attempts_per_user<=2; FLAG if targeted usernames are alphabetical/list-ordered;
      OUTPUT source, distinct_users, per_user_counts.
- question: Are a source's failures concentrating on non-existent (resultType 50034 user-not-found), disabled
    (50057), or lockout/IP-blocked (50053) accounts rather than ordinary invalid-password failures (50126),
    and is any source driving a spike in account lockouts?
  context: 'Legitimate users rarely fail against accounts that do not exist or are disabled, so failures
    against these states are higher-confidence spray signals than ordinary password failures. For Initial
    Access, treat 50034 and 50057 failures as distinct, escalated indicators because they reveal an actor
    guessing usernames from external lists that do not perfectly match the tenant directory. Likewise,
    a source generating many 50053 (lockout/IP-blocked) results or driving a spike in account lockouts
    over a defined period indicates spray pressure tripping protective controls. A positive result is
    a source whose failure mix is dominated by these codes; a negative result is a source whose failures
    are almost entirely 50126 against valid, enabled accounts. References: [Detecting Password Spraying
    Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Entra ID SignInLogs
  - AADNonInteractiveUserSignInLogs
  - RiskDetections
