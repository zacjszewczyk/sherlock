  queries:
  - technology: SIEM/Stats pseudocode
    query: CALCULATE per source_ip and ASN, 60m => failures, successes, failure_success_ratio, resultType_distribution;
      ALERT when ratio>=source_baseline_p99 OR error_mix diverges from source history; OUTPUT source,
      ratio, code_mix, baseline.
- question: Do the accounts targeted by a source disproportionately belong to administrators, executives,
    conditional-access-exempt users, or known weak/breach-corpus password holders?
  context: 'Spray success depends on weak or reused credentials, and adversaries seeking Initial Access
    prioritize high-value identities, so a source whose failures concentrate on privileged or exempt populations
    warrants escalation. Score targeted accounts against peer-group and per-entity baselines and weight
    sources that focus on administrators, executives, or users exempt from common conditional-access paths.
    Prioritize accounts known to use breach-corpus or weak passwords. A positive result is a source whose
    targeting skews toward high-value or weak-credential accounts beyond what random targeting would produce;
    a negative result is targeting spread evenly across ordinary user accounts. References: [Identify
    Threats with Entity Behavior Analytics, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [Protecting accounts from credential stuffing with password breach alerting, Thomas et al](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas).'
  answer_sources:
