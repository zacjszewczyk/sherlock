- question: Is a source IP or ASN producing a login failure-to-success ratio far higher than its own history,
    and does its per-resultType error distribution (50126/50053/50057/50034) depart from its baseline?
  context: 'Sprays yield many more failures than successes, so a source with a high failure rate against
    many users is suspicious even in low-volume campaigns where raw counts are modest. For Initial Access,
    compute the failure-to-success ratio per source IP and per ASN and profile each source''s per-resultType
    error distribution as a distinct state signal. Alert when the failure mix or ratio departs from the
    source''s own history. A positive result is a source whose ratio or error mix shifts sharply from
    baseline; a negative result is a source whose ratio matches its normal, mostly-successful pattern.
    References: [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
