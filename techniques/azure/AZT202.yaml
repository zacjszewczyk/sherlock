  queries:
  - technology: SIEM/Rule pseudocode
    query: GROUP failed_signins BY source_ip, resultType, 1h; ALERT when share(50034 OR 50057 OR 50053)
      is high for a source OR account_lockout_count spikes above baseline; RANK sources by invalid/disabled/lockout
      failure share; OUTPUT source, code_distribution, lockout_count.
- question: Does any source IP, user agent, or target application exceed the tenant's trailing 30-day
    95th-percentile baseline for failed-sign-in count, distinct-user fan-out, or distinct-user-to-attempt
    ratio?
  context: 'Fixed global numbers misfire across tenants, so this statistical method derives thresholds
    from each tenant''s own trailing 30-day history of failed sign-ins per source, per user agent, and
    per target application, plus the ratio of distinct users to total attempts. For Initial Access, a
    source whose fan-out or failure density rises above the tenant''s 95th percentile is anomalous relative
    to that environment''s normal authentication noise. Validate the baselining approach against enterprise
    authentication telemetry such as the LANL datasets. A positive result is a source materially above
    the tenant''s own historical spread; a negative result is activity within the normal band even if
    absolute counts look large. References: [Detecting Password Spraying Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Unified Host and Network Data Set, Turcotte et al](https://arxiv.org/abs/1708.07518); [LANL User-Computer
    Authentication Dataset, Kent](https://csr.lanl.gov/data/auth/).'
