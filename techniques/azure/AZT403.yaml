    write/overwrite and download (GetBlob) operations against those paths, and follow-on AzureActivity
    role-management activity initiated from Cloud Shell sessions'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'writes = image_or_profile_write_events(); for each w: signin = SigninLogs where AppDisplayName
      contains ''Cloud Shell'' AND time in [w.time, w.time+60m]; priv = AzureActivity where OperationName
      in (Microsoft.Authorization/roleAssignments/write, PIM_activation, Microsoft.Authorization/policy*,
      application_credential_add) AND time in [w.time, w.time+60m]; ALERT where signin AND priv exist
      for same/targeted actor; OUTPUT chain(w, signin, priv).'
- question: Is any principal other than the image owner reading or writing another user's acc_*.img for
    the first time, given that subscription Contributors are granted read/write to all storage accounts
    by default?
  context: Baseline which identities legitimately access each cs-prefixed storage account, then alert
    deterministically the first time any principal other than the image owner touches another user's acc_*.img.
    Because subscription Contributors inherit read/write on all storage accounts, cross-user Cloud Shell
    image access is rarely benign and is a precursor to tampering. The analyst is looking for an identity
    stepping outside its own Cloud Shell storage and reaching into a colleague's image. A positive result
    is a first-ever cross-user image access; a negative result is owners only touching their own images.
    This supports Privilege Escalation by exposing reconnaissance/staging against a victim's privileged
    session image.
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
  - 'NAI: Cloud Shell backing storage accounts prefixed with ''cs'' (e.g., cs120000000ff), Azure Files
