    write/overwrite and download (GetBlob) operations against those paths, and follow-on AzureActivity
    role-management activity initiated from Cloud Shell sessions'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: baseline = map(storageAccount -> set(legit_principals)) over lookback; event = StorageBlobLogs/StorageFileLogs
      where ObjectKey matches 'acc_*.img'; ALERT where event.principal != image_owner(event.objectKey)
      AND event.principal NOT in baseline[event.account]; OUTPUT principal, owner, account, objectKey,
      operation, time.
- question: When scoring per-user Cloud Shell storage behavior with a robust median/MAD modified Z-score,
    do any metrics (bytes written per operation, acc_*.img write frequency per day, distinct source networks,
    or elapsed time from Cloud Shell launch to first privileged action) exceed the |Mi|>3.5 anomaly threshold?
  context: Establish a per-user baseline of Cloud Shell storage behavior and use a modified Z-score (median/MAD)
    that resists distortion from batch jobs, flagging values where the modified Z-score magnitude exceeds
    3.5. The features of interest are write volume per operation, image write frequency, breadth of source
    networks, and the gap between Cloud Shell launch and the first privileged control-plane action. Sentinel
    built-in time-series anomalies for unusual storage operation volume can run as a parallel detector.
    A positive result is a statistically extreme deviation in one or more of these features; a negative
    result is behavior within each user's normal envelope. For Privilege Escalation, abnormal write volume/frequency
    on image files signals tampering preparation.
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
  - 'NAI: Cloud Shell backing storage accounts prefixed with ''cs'' (e.g., cs120000000ff), Azure Files
