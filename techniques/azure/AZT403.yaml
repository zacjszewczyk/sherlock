      time-series anomaly on storage_op_volume; OUTPUT user, feature, value, Mi.'
- question: Over a rolling 30-90 day lookback, is this the first time a principal touched a given cs-prefixed
    storage account, downloaded an acc_*.img, or issued a role-assignment write from a Cloud Shell context,
    and does it coincide with behavioral anomalies such as impossible travel, infrequent location/IP,
    or unusual download volume?
  context: 'Apply per-principal first-seen analysis over a rolling lookback to surface novel actions:
    first contact with a cs-prefixed account, first acc_*.img download, or first Cloud-Shell-context roleAssignments/write.
    Layer behavioral anomalies (impossible travel, activity from rare location/IP, unusual download volume)
    and UEBA peer-group scoring to add geographic and peer-relative context. A positive result is a first-seen
    privileged or storage action enriched by a concurrent behavioral anomaly; a negative result is repeated,
    familiar behavior from expected locations. This ties to Privilege Escalation because a brand-new actor
    reaching Cloud Shell images and then writing role assignments matches the attacker''s escalation path.'
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
