name: 'AZT403: Local Resource Hijack'
id: 6b0d4455-81b4-484b-95f5-3916d6d7b738
description: Investigate whether an adversary escalated privileges in Azure by tampering with a local
  file generated by a resource, specifically backdooring an Azure Cloud Shell backing-store image (acc_<user>.img)
  or its startup/profile files (.bashrc, Microsoft.PowerShell_profile.ps1) so that future Cloud Shell
  sessions automatically execute privileged actions. This playbook helps an analyst hunt for writes/overwrites
  to 'cs'-prefixed Cloud Shell storage accounts, the canonical download-edit-reupload tamper round-trip
  on user disk images, cross-user first-touch access to another operator's image, startup-backdoor execution
  chains where a profile edit is followed by high-impact control-plane activity (role assignments, PIM
  activation, policy changes, credential additions), and statistical / machine-learning anomalies in Cloud
  Shell storage behavior and session event sequencing.
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there write or overwrite operations (PutBlob, PutRange, PutBlockList) targeting a 'cs'-prefixed
    Cloud Shell storage account where the path matches the user disk image (.cloudconsole/acc_*.img) or
    the shell startup files (.bashrc, Microsoft.PowerShell_profile.ps1), and do those writes correlate
    with a concurrent, legitimate Cloud Shell session?
  context: Cloud Shell normally synchronizes the backing image only from inside an active session host,
    so any write to acc_*.img or the profile files whose caller IP, user agent, or identity does not line
    up with a concurrent Cloud Shell launch is high signal for tampering. The analyst is looking for the
    moment an attacker plants persistence/privilege-escalation commands into a startup file that will
    auto-execute when the operator next opens Cloud Shell. A positive result is a write to these protected
    paths with no matching active session; a negative result is a write that maps cleanly to the owner's
    own live session. Ensure storage diagnostic settings are streaming StorageBlobLogs/StorageFileLogs
    to Log Analytics first. This maps to Privilege Escalation because a successful edit lets the adversary
    inherit the operator's privileged context on the next launch.
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
  - 'NAI: Cloud Shell backing storage accounts prefixed with ''cs'' (e.g., cs120000000ff), Azure Files
    shares containing .cloudconsole/acc_<user>.img user disk images, shell startup files inside that image
    (.bashrc and ~/.config/PowerShell/Microsoft.PowerShell_profile.ps1), the StorageBlobLogs/StorageFileLogs
    write/overwrite and download (GetBlob) operations against those paths, and follow-on AzureActivity
    role-management activity initiated from Cloud Shell sessions'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: writes = StorageBlobLogs/StorageFileLogs where OperationName in (PutBlob,PutRange,PutBlockList)
      AND AccountName startswith 'cs' AND ObjectKey matches '.cloudconsole/acc_*.img' OR endswith ('.bashrc','Microsoft.PowerShell_profile.ps1');
      ALERT where NOT exists(active_cloudshell_session WHERE same(identity,callerIP,userAgent) within
      session_window); OUTPUT principal, callerIP, userAgent, objectKey, time.
- question: Did any single principal perform a large GetBlob/GET download of a Cloud Shell user image
    (acc_*.img, typically around 5 GB) followed within minutes-to-hours by an overwrite PutBlob/PutBlockList
    of the same blob, indicating a mount-edit-reupload tamper round-trip?
  context: The canonical AZT403 attack is to download the operator's ~5 GB Cloud Shell user image, mount
    and edit it offline to insert malicious startup commands, then re-upload (overwrite) it. The discriminators
    are the profile-sized byte volume and the GET-then-PUT ordering against the same blob, especially
    when the operator has no active Cloud Shell session at the time. A positive result is a download+overwrite
    pair on the same acc_*.img by one principal in a short window; a negative result is read-only access
    or writes consistent with normal session sync. This is Privilege Escalation evidence because the re-uploaded
    image carries attacker code that executes with the victim's privileges on next launch.
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
  - 'NAI: Cloud Shell backing storage accounts prefixed with ''cs'' (e.g., cs120000000ff), Azure Files
    shares containing .cloudconsole/acc_<user>.img user disk images, shell startup files inside that image
    (.bashrc and ~/.config/PowerShell/Microsoft.PowerShell_profile.ps1), the StorageBlobLogs/StorageFileLogs
    write/overwrite and download (GetBlob) operations against those paths, and follow-on AzureActivity
    role-management activity initiated from Cloud Shell sessions'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ops = StorageBlobLogs where ObjectKey matches 'acc_*.img'; group by principal, objectKey; find
      GET (GetBlob, bytes ~5GB) THEN PutBlob/PutBlockList on same objectKey within 3h; ALERT on download->overwrite
      pair; flag higher when no active_cloudshell_session for owner; OUTPUT principal, objectKey, get_time,
      put_time, bytes, srcIPs.
- question: Following a Cloud Shell image or profile write, did the same or targeted actor sign in to
    Cloud Shell and then perform high-impact control-plane operations (Microsoft.Authorization/roleAssignments/write,
    PIM activation, Microsoft.Authorization/policy* changes, or application credential additions) within
    a short correlation window?
  context: This question links the planting of the backdoor to its payoff. Correlate a Cloud Shell image/profile
    write with a subsequent SigninLogs Cloud Shell sign-in and AzureActivity privileged operations by
    the same or targeted actor within a tight window (start 60 minutes; tune per tenant). Privileged control-plane
    activity occurring immediately after a startup-file change is strong evidence the edited profile auto-executed
    the attacker's commands. A positive result is the write->sign-in->role/policy/credential change sequence;
    a negative result is a write with no follow-on privileged activity. This is the core Privilege Escalation
    outcome the technique is designed to achieve.
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
  - 'NAI: Cloud Shell backing storage accounts prefixed with ''cs'' (e.g., cs120000000ff), Azure Files
