    write/overwrite and download (GetBlob) operations against those paths, and follow-on AzureActivity
    role-management activity initiated from Cloud Shell sessions'
  range: Last 90 days
  queries:
  - technology: ML/LSTM sequence pseudocode
    query: 'model = train_LSTM(normal_session_sequences[launch,image_sync,signin,controlplane]); for session
      s: p = model.predict_next(s.events); ALERT where observed_event not in top_k_predicted OR sequence_logprob
      < threshold; report top3 contributing features; OUTPUT session, divergent_event, top_features.'
- question: Does a dynamic user-service-activity graph built from AzureActivity/StorageBlobLogs/SigninLogs
    reveal anomalous principal->Cloud-Shell-storage->role-management paths via GNN embeddings, or do host-side
    provenance models surface the edit-profile-then-execute-privileged-cmdlet chain?
  context: Build a dynamic graph of users, services, and activities from AzureActivity, StorageBlobLogs,
    and SigninLogs and use GNN embeddings to score anomalous principal->Cloud-Shell-storage->role-management
    paths that deviate from learned tenant behavior. For host-side provenance within the session, masked-graph
    or provenance-autoencoder models (e.g., MAGIC, KAIROS) can detect the edit-profile-then-execute-privileged-cmdlet
    chain and reconstruct the attack subgraph with node-level feature attributions. Keep deterministic
    image-overwrite rules running in parallel as the detection floor. A positive result is a graph path/subgraph
    scored anomalous against tenant norms; a negative result is paths consistent with learned behavior.
    This addresses Privilege Escalation by modeling the full escalation path from storage tamper to role
    management.
