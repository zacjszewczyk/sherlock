      UEBA_peer_score; ALERT where first_seen AND behavioral_anomaly; OUTPUT principal, action, geo, score.'
- question: Is there a spike in authorization/transaction failures (AuthorizationPermissionMismatch, HTTP
    403, or 404) for a principal enumerating cs-prefixed accounts and image paths, particularly any failed-then-succeeded
    transition against the same blob?
  context: Profile authorization and transaction outcomes (StatusText / HTTP status) in StorageBlobLogs/StorageFileLogs
    per principal as a distinct probing signal. A burst of AuthorizationPermissionMismatch/403 or 404
    responses while enumerating cs-prefixed accounts and image paths indicates an attacker probing for
    accessible Cloud Shell images before achieving a successful overwrite. The strongest tell is a failed-then-succeeded
    transition against the same blob. A positive result is a probing spike followed by a successful access/overwrite;
    a negative result is a stable, mostly-successful access pattern. This supports Privilege Escalation
    by catching the reconnaissance that precedes image tampering.
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
  - 'NAI: Cloud Shell backing storage accounts prefixed with ''cs'' (e.g., cs120000000ff), Azure Files
    shares containing .cloudconsole/acc_<user>.img user disk images, shell startup files inside that image
    (.bashrc and ~/.config/PowerShell/Microsoft.PowerShell_profile.ps1), the StorageBlobLogs/StorageFileLogs
    write/overwrite and download (GetBlob) operations against those paths, and follow-on AzureActivity
    role-management activity initiated from Cloud Shell sessions'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'logs = StorageBlobLogs/StorageFileLogs where AccountName startswith ''cs''; per principal
      window: count(StatusText in (AuthorizationPermissionMismatch) OR HTTP in (403,404)); ALERT where
      failure_rate spikes vs baseline; ALSO ALERT where same(principal,objectKey) shows fail THEN success;
      OUTPUT principal, objectKey, fail_count, first_success_time.'
- question: When an LSTM log-sequence model is trained on normal per-user/session event order (Cloud Shell
    launch -> image sync -> sign-in -> control-plane actions), do any sessions diverge from the learned
    path, for example a storage overwrite followed immediately by previously-unseen privilege-escalation
    operations?
  context: Train a DeepLog-style LSTM on the normal ordering of Cloud Shell session events and flag sessions
    whose execution path deviates, such as an image overwrite immediately followed by privilege-escalation
    operations never seen in that order before. Surface the top-3 contributing events/features (e.g.,
    novel acc_*.img overwrite, new source ASN, first-seen roleAssignments/write) in the alert text to
    speed triage. A positive result is a low-probability event sequence diverging from the baseline; a
    negative result is a session following an expected order. This detects the edit-profile-then-execute
    chain central to AZT403 Privilege Escalation, complementing the deterministic rules.
  answer_sources:
  - StorageBlobLogs
  - StorageFileLogs
  - AzureActivity
  - SigninLogs
  - AzureDiagnostics
  - 'NAI: Cloud Shell backing storage accounts prefixed with ''cs'' (e.g., cs120000000ff), Azure Files
    shares containing .cloudconsole/acc_<user>.img user disk images, shell startup files inside that image
