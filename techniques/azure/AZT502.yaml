questions:
- question: Using deterministic detection logic, can analysts identify unexpected user creation as it
    would manifest during Persistence?
  context: 'Under the Persistence tactic, the analyst is looking for the following evidence: A new user
    is created in Entra ID so the adversary retains a fresh credentialed foothold that can be blended
    into normal identity administration activity and then quickly prepared for interactive or privileged
    use. This symbolic logic approach proceeds as follows: Detect ''Add user'' operations in AuditLogs
    and correlate within a short window (e.g., <=60 min) with immediate role assignment, license assignment,
    MFA registration, or first successful sign-in for the new identity. Escalate when the creator is not
    a member of the normal identity-administrator set, when the new user receives a directory/privileged
    role, or when the name closely matches an existing privileged account (Jaro-Winkler similarity >=0.92)
    ([String Comparator Metrics, Winkler](https://files.eric.ed.gov/fulltext/ED325505.pdf)). Canonical
    creation/role/credential events per [Detecting M365 and Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).
    A positive result strengthens the case that Account Creation is in use for persistence; a negative
    result helps rule it out or redirect the investigation.'
  answer_sources: &id001
  - AuditLogs
  - SigninLogs
  - IdentityProtectionRiskEvents
  - 'NAI: Entra ID user creation events, privileged group membership changes around newly created users,
    and first sign-ins by recently created accounts'
