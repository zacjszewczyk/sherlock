    identity-persistence event mapping per [Detecting M365 and Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).
    A positive result strengthens the case that Account Creation is in use for persistence; a negative
    result helps rule it out or redirect the investigation.'
