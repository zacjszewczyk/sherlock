name: 'AZT502: Account Creation'
id: eb65c44f-b249-4145-86dc-855537799d01
description: 'Investigate Account Creation (AZT502) as it manifests under Persistence. This playbook helps
  analysts confirm or refute the technique by examining: A new user is created in Entra ID so the adversary
  retains a fresh credentialed foothold that can be blended into normal identity administration activity
  and then quickly prepared for interactive or privileged use. A new application and service principal
  are created so the adversary can authenticate with a non-user identity that is easier to hide, automate,
  and preserve across password resets and user-account cleanup. A guest account is invited or created
  so the adversary can maintain access through an external identity that may not appear in standard employee
  account reviews and can be re-used from outside the tenant.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
