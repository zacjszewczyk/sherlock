- question: Was a managed-identity Logic App's workflow updated, its trigger callback URL listed, or its
    connections changed so that the modified definition introduces HTTP actions, callback retrieval, or
    external destinations shortly before execution?
  context: 'Logic App JWT abuse (the documented PUT/POST pattern in AZT601) works by editing a workflow
    to add token-disclosure logic and then running it under credential access (TA0006), where stolen managed
    identity JWTs enable the adversary to authenticate to Azure resources as a trusted service principal.
    The analyst should alert on workflow updates, callback URL listings, or connection changes on a managed-identity
    Logic App when a new HTTP action, callback retrieval, or external destination appears just before
    execution, keying on AzureActivity OperationNameValue and Caller. A positive result shows a workflow
    being weaponized to surface the managed identity token to an operator-controlled path. Source references:
    [AZT601](https://microsoft.github.io/Azure-Threat-Research-Matrix/CredentialAccess/AZT601/AZT601/),
    [AzureActivity schema](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity).'
