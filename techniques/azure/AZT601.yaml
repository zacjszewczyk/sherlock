name: 'AZT601: Steal Managed Identity JsonWebToken'
id: fa1afc2d-a3d5-480b-b659-346b4d9d7e49
description: Investigate adversary theft of Azure managed identity JSON Web Tokens (JWTs) obtained by
  abusing the legitimate functionality of managed-identity-enabled Azure resources. This playbook helps
  an analyst hunt for token harvesting across virtual machines and hybrid workers that query the instance
  metadata service (IMDS) token endpoint, Azure Kubernetes Service clusters where pod exec or run-command
  activity precedes IMDS access, Logic Apps modified to disclose tokens through new HTTP/callback actions,
  Function Apps updated to surface tokens through code paths or HTTP responses, and Automation Account
  runbooks created or executed to dump tokens through job output. It covers deterministic command and
  control-plane correlation, failed/blocked request profiling, statistical baselining of token-request
  cadence and rarity, and machine-learning sequence, graph, and content models that distinguish routine
  automation from operator-driven credential theft, supporting the credential-access mission question
  of whether the adversary has obtained managed identity access tokens to enable follow-on credential
  abuse.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: On managed-identity-enabled VMs, is any PowerShell, command-line, or shell activity requesting
    a JWT from the IMDS token endpoint (http://169.254.169.254/metadata/identity/oauth2/token) with the
    Metadata:true header and a resource= audience parameter?
  context: 'This is the documented managed-identity token flow, so a hands-on-keyboard request to IMDS
    is the clearest deterministic signal of token harvesting under credential access (TA0006), where stolen
    managed identity JWTs enable the adversary to authenticate to Azure resources as a trusted service
    principal. The analyst should scan PowerShell script block logs (4104), Sysmon process creation (1),
    and Linux shell activity for Invoke-RestMethod/Invoke-WebRequest, curl, and wget invocations targeting
    IMDS, then pivot to AzureActivity (OperationNameValue for VM Run Command/extension write, Caller,
    CallerIpAddress) to see whether an admin sign-in occurred on the same asset. A positive result --
    an interactive IMDS call from a human session -- strongly suggests JWT theft rather than the silent
    SDK-driven token retrieval normal applications perform. Source references: [How managed identities
    work with VMs](https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-managed-identities-work-vm),
    [T1552.005 Cloud Instance Metadata API](https://attack.mitre.org/techniques/T1552/005/), [AzureActivity
    schema](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity).'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog
  - 'NAI: Managed-identity-enabled virtual machines, jump hosts, and hybrid worker servers'
  range: Last 90 days, pivoting to AzureActivity Run Command/extension writes on the same asset.
  queries:
  - technology: SIEM/Rule pseudocode
    query: SEARCH (Win4104 OR Sysmon1 OR Syslog_shell) WHERE cmd CONTAINS '169.254.169.254/metadata/identity/oauth2/token'
      AND cmd CONTAINS 'Metadata:true' AND cmd MATCHES 'resource='; ALERT on Invoke-RestMethod|Invoke-WebRequest|curl|wget
      to IMDS; JOIN AzureActivity ON host WHERE OperationNameValue IN [runCommand, extensions/write] WITHIN
      1h; OUTPUT host, user, cmdline, resource_audience, Caller, CallerIpAddress.
- question: Did a host-level IMDS token request on a VM lead to subsequent Azure management actions, Azure
    CLI use, or access to sensitive resource audiences (management.azure.com, vault.azure.net, graph.microsoft.com)
    from the same identity or CallerIpAddress within one hour?
  context: 'Correlating a token retrieval with downstream control-plane use isolates retrievals that likely
    produced a reusable JWT rather than routine application startup, matching the resource-functionality
    abuse model of AZT601 under credential access (TA0006), where stolen managed identity JWTs enable
    the adversary to authenticate to Azure resources as a trusted service principal. The analyst is looking
    for the theft-to-reuse pivot: a token pulled on a VM and then exercised against high-value Azure APIs.
    A positive correlation indicates the stolen JWT is actively being used for lateral movement or data
    access; a negative result (token pulled with no follow-on) may still be application noise. Source
    references: [AZT601](https://microsoft.github.io/Azure-Threat-Research-Matrix/CredentialAccess/AZT601/AZT601/).'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog
  - 'NAI: Managed-identity-enabled virtual machines, jump hosts, and hybrid worker servers'
  range: Last 90 days, with a 60-minute token-retrieval-to-API-use correlation window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN host_IMDS_token_request TO AzureActivity_or_CLI ON identity OR CallerIpAddress WITHIN
      60m WHERE target_audience IN [management.azure.com, vault.azure.net, graph.microsoft.com]; FLAG
      retrieval+reuse pairs; OUTPUT identity, CallerIpAddress, audience, operations.
- question: Are there repeated blocked or denied IMDS calls, 403/timeout responses from the metadata endpoint,
    or AzureActivity ActivityStatusValue=Failed on follow-on control-plane calls that indicate token probing
    or misuse?
  context: 'Failed and blocked requests are a distinct precursor signal: failure-rate spikes commonly
    precede successful theft as an operator iterates on the IMDS call or replays a token that has not
    yet been granted scope. Under credential access (TA0006), where stolen managed identity JWTs enable
    the adversary to authenticate to Azure resources as a trusted service principal, the analyst should
    alert on >=3 failed token requests in 5 minutes or a failed-then-succeeded retrieval burst. A positive
    result frequently catches the experimentation phase before a clean token dump, giving early warning.
    Source references: [Wiz IMDS Anomaly Hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day),
    [AzureActivity schema](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity).'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog
  - 'NAI: Managed-identity-enabled virtual machines, jump hosts, and hybrid worker servers'
  range: Last 90 days, with 5-minute failure-burst windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: GROUP IMDS_responses BY host,5m WHERE status IN [403, timeout, denied]; ALERT when fail_count>=3
      OR (fail_then_success burst); ALSO flag AzureActivity ActivityStatusValue='Failed' on follow-on
      calls; OUTPUT host, fail_count, sequence, timestamps.
- question: Compared with each VM's own 30-day baseline, are there first-time interactive IMDS token requests,
    request bursts above the 99th percentile, or requests for unusual audiences such as management.azure.com
    from hosts that normally never request tokens interactively?
  context: 'Statistical baselining of token-retrieval attempts per VM, user context, process name, and
    hour separates routine SDK token refresh from anomalous human-driven harvesting under credential access
    (TA0006), where stolen managed identity JWTs enable the adversary to authenticate to Azure resources
    as a trusted service principal. The analyst should derive per-host thresholds from each environment''s
    own distribution and forecast expected volume with confidence bands. A positive result -- a host suddenly
    issuing interactive token requests or requesting a never-before-seen high-value audience -- highlights
    the asset most likely to be the theft origin. Source references: [time-series cloud intrusion detection](https://link.springer.com/article/10.1186/s13677-023-00491-x),
    [Wiz IMDS Anomaly Hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog
  - 'NAI: Managed-identity-enabled virtual machines, jump hosts, and hybrid worker servers'
  range: Last 90 days, with rolling 30-day per-host/per-hour baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline IMDS_token_requests per host,user,process,hour over 30d; FLAG first_seen interactive
      request OR count>p99 OR audience NOT IN host_known_audiences; forecast expected_volume with confidence_bands;
      OUTPUT host, observed, expected, percentile.
- question: Which VMs show a rare first-seen combination of shell/PowerShell execution, a new outbound
    connection to 169.254.169.254 (Sysmon 3), and immediate Azure control-plane access?
  context: 'Scoring how often each VM produces this specific triad surfaces the novel pairings most consistent
    with token theft under credential access (TA0006), where stolen managed identity JWTs enable the adversary
    to authenticate to Azure resources as a trusted service principal, using a per-principal first-seen
    model and peer-group outlier scoring. The analyst should prioritize first-seen combinations and review
    the top-3 contributing features (process name, audience, novelty) in the alert. A positive result
    indicates a host exhibiting the full harvest behavior chain it has never shown before, which is far
    more suspicious than any single component alone. Source references: [Netflix cloudtrail-anomaly](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly),
    [Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog
  - 'NAI: Managed-identity-enabled virtual machines, jump hosts, and hybrid worker servers'
  range: Last 90 days, with per-principal first-seen scoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: SCORE per VM the triad {shell_exec, Sysmon3_to_169.254.169.254, control_plane_access}; rank
      by first_seen novelty per principal AND peer-group outlier; OUTPUT VM, novelty_score, top3_features
      [process, audience, novelty].
- question: Does a sequence model trained on normal VM administration flag chains such as 'extension write
    -> shell launch -> IMDS token request -> Azure API use' as improbable?
  context: 'A variable-order Markov / multi-order transition model over AzureActivity plus host process
    telemetry learns benign administration sequences so that token-theft chains stand out as low-probability
    under credential access (TA0006), where stolen managed identity JWTs enable the adversary to authenticate
    to Azure resources as a trusted service principal. The analyst should alert when sequence probability
    falls below the benign threshold and review the lowest-probability transitions as the explanation.
    A positive result captures multi-step abuse that no single rule would flag, e.g., a deployment extension
    immediately followed by an interactive token pull and external API call. Source references: [variable-order
    Markov API abuse](https://blog.cloudflare.com/protecting-apis-from-abuse-using-sequence-learning-and-variable-order-markov/),
    [multi-order Markov cloud anomaly detection](https://ieeexplore.ieee.org/document/7065233/).'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog
  - 'NAI: Managed-identity-enabled virtual machines, jump hosts, and hybrid worker servers'
  range: Last 90 days for training, with current chains scored continuously.
  queries:
  - technology: ML pipeline pseudocode
    query: train variable_order_markov on benign sequences from AzureActivity+host_process; score chain
      [extension_write, shell_launch, IMDS_token_request, azure_api_use]; ALERT when seq_prob < benign_threshold;
      OUTPUT lowest_probability_transitions.
- question: Does a supervised command-line classifier distinguish operator-driven token harvesting from
    legitimate automation on managed-identity VMs based on command-line tokens, parent-child process lineage,
    and script content?
  context: 'A classifier over command-line tokens, process lineage, and script content catches harvesting
    that uses unfamiliar tooling or obfuscation under credential access (TA0006), where stolen managed
    identity JWTs enable the adversary to authenticate to Azure resources as a trusted service principal,
    where the giveaway features are an IMDS string, base64-encoded output, or an interactive parent process.
    The analyst should surface the top-3 contributing features in alert text and can generate labeled
    training/validation telemetry with Stratus Red Team. A positive classification points to hands-on
    harvesting; reviewing feature attributions confirms whether the script is dumping tokens versus performing
    sanctioned work. Source references: [Malicious PowerShell Detection via ML](https://cloud.google.com/blog/topics/threat-intelligence/malicious-powershell-detection-via-machine-learning/),
    [Stratus Red Team](https://stratus-red-team.cloud/attack-techniques/azure/).'
  answer_sources:
  - AzureActivity
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog
  - 'NAI: Managed-identity-enabled virtual machines, jump hosts, and hybrid worker servers'
  range: Last 90 days for features, with live scoring of new process/script events.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [cmdline_tokens, parent_child_lineage, script_content, imds_string, base64_output];
      label via Stratus_Red_Team telemetry; pred = harvester_clf.predict_proba(features); ALERT if pred>=0.85;
      OUTPUT top_shap_3.
- question: In AKS, is managedClusters/runcommand/action, Kubernetes exec/attach, or container output
    containing 169.254.169.254/metadata/identity/oauth2/token (with Metadata:true) occurring on the same
    cluster within a short window?
  context: 'Interactive cluster access immediately followed by an IMDS token request indicates token harvesting
    from inside the cluster under credential access (TA0006), where stolen managed identity JWTs enable
    the adversary to authenticate to Azure resources as a trusted service principal. The analyst should
    correlate run-command or exec/attach events in the Kubernetes Audit Log with container logs showing
    IMDS calls on the same cluster within a short window. A positive correlation shows an operator gained
    a shell in a pod or node and then pulled the managed identity token -- a high-confidence theft signal
    distinct from an application''s silent SDK token use. Source references: [AZT601](https://microsoft.github.io/Azure-Threat-Research-Matrix/CredentialAccess/AZT601/AZT601/),
    [T1552.005](https://attack.mitre.org/techniques/T1552/005/).'
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Kubernetes Audit Log
  - ContainerLogV2
  - 'NAI: Production AKS clusters, node pools with managed identities, and cluster administration workstations'
  range: Last 90 days, correlating exec/run-command to IMDS within a short window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN K8s_audit (verb IN [exec, attach] OR managedClusters/runcommand/action) TO ContainerLogV2
      CONTAINS '169.254.169.254/metadata/identity/oauth2/token' ON cluster WITHIN 10m; OUTPUT cluster,
      namespace, pod, principal, sequence.
- question: Are pods in namespaces, service accounts, or node pools that do not normally use managed identities
    suddenly requesting IMDS tokens, especially followed by outbound connections to external destinations
    or Azure management APIs?
  context: 'Workload-baseline IMDS profiling flags identity usage that is inconsistent with a workload''s
    expected behavior under credential access (TA0006), where stolen managed identity JWTs enable the
    adversary to authenticate to Azure resources as a trusted service principal. The analyst should alert
    when a namespace/service account/node pool with no history of managed-identity use begins calling
    IMDS, particularly if followed by egress to external or Azure management endpoints. A positive result
    indicates a compromised or attacker-introduced workload abusing identity it should never touch --
    a strong theft indicator. Source references: [Wiz IMDS Anomaly Hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Kubernetes Audit Log
  - ContainerLogV2
  - 'NAI: Production AKS clusters, node pools with managed identities, and cluster administration workstations'
  range: Last 90 days, with per-namespace identity-usage baselines.
  queries:
  - technology: SIEM/Rule pseudocode
    query: baseline IMDS usage per namespace,service_account,node_pool; ALERT when first_time IMDS request
      from non-MI namespace AND followed_by egress_external OR azure_management_api; OUTPUT namespace,
      sa, pod, destination.
- question: Are there repeated failed/denied IMDS responses or Kubernetes audit forbidden/403 decisions
    on exec/run-command within a short window that signal probing before successful token theft?
  context: 'Failed exec-then-IMDS attempts are a distinct precursor signal under credential access (TA0006),
    where stolen managed identity JWTs enable the adversary to authenticate to Azure resources as a trusted
    service principal, because operators frequently hit RBAC denials or IMDS errors while iterating toward
    a working harvest. The analyst should profile forbidden/403 decisions on exec/run-command together
    with denied IMDS responses and alert on repeated failed attempts within 5 minutes. A positive result
    catches the reconnaissance/iteration phase, giving early warning before a clean token dump. Source
    references: [Wiz IMDS Anomaly Hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - Kubernetes Audit Log
  - ContainerLogV2
