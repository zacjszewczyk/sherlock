    to Azure resources as a trusted service principal. The analyst should use a first-seen detector plus
    peer-group scoring to surface new images, short-lived pods, or nodes with abnormal token cadence.
    A positive result points to a container that does not belong -- a classic vector for harvesting managed
    identity tokens from inside a cluster. Source references: [Netflix cloudtrail-anomaly](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly),
    [Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
