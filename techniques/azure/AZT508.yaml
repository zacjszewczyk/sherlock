    a backdoor resource, privileged extension, or malicious configuration whenever the policy evaluates
    matching resources, allowing persistence to be re-established automatically. This symbolic logic approach
    proceeds as follows: Correlate a DeployIfNotExists assignment write with a MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE
    that grants the assignment''s system- or user-assigned managed identity a privileged role (Owner,
    Contributor, User Access Administrator), which the portal auto-grants and SDK grants explicitly ([Remediate
    non-compliant resources](https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources)).
    Reuse the role-grant matching pattern from [Sigma admin-role rule](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/activity_logs/azure_ad_user_added_to_admin_role.yml).
    Treat assignment write + privileged identity grant within the same change window as concrete persistence
    evidence; suppress known PIM eligible-role activations. A positive result strengthens the case that
    Azure Policy is in use for persistence; a negative result helps rule it out or redirect the investigation.'
