name: 'AZT508: Azure Policy'
id: 48a0a170-4f3c-4fbb-bd63-f13452f88d0b
description: 'Investigate Azure Policy (AZT508) as it manifests under Persistence. This playbook helps
  analysts confirm or refute the technique by examining: A policy definition or assignment is created
  or changed so a DeployIfNotExists effect can deploy or reapply a backdoor resource, privileged extension,
  or malicious configuration whenever the policy evaluates matching resources, allowing persistence to
  be re-established automatically.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Using deterministic detection logic, can analysts identify deployIfNotExists definition/assignment
    write as it would manifest during Persistence?
  context: 'Under the Persistence tactic, the analyst is looking for the following evidence: A policy
    definition or assignment is created or changed so a DeployIfNotExists effect can deploy or reapply
    a backdoor resource, privileged extension, or malicious configuration whenever the policy evaluates
    matching resources, allowing persistence to be re-established automatically. This symbolic logic approach
    proceeds as follows: In AzureActivity, alert on OperationNameValue in (MICROSOFT.AUTHORIZATION/POLICYDEFINITIONS/WRITE,
    MICROSOFT.AUTHORIZATION/POLICYASSIGNMENTS/WRITE) where the definition/assignment uses the DeployIfNotExists
    effect; inspect the details block for roleDefinitionIds granting Owner, Contributor, or User Access
    Administrator and for an embedded deployment template that creates managed identities, VM extensions,
    NSG allow rules, or automation runbooks ([ATRM AZT508](https://microsoft.github.io/Azure-Threat-Research-Matrix/Persistence/AZT508/AZT508/);
    [DeployIfNotExists effect](https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deploy-if-not-exists)).
    Escalate when deploymentScope/assignment scope is a management group or subscription. Use the operation-name-list
    rule pattern from [Sigma Azure firewall policy rule](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/activity_logs/azure_network_firewall_policy_modified_or_deleted.yml)
    and triage by Caller, CallerIpAddress, and user agent from the [AzureActivity table](https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/azureactivity).
    A positive result strengthens the case that Azure Policy is in use for persistence; a negative result
    helps rule it out or redirect the investigation.'
  answer_sources: &id001
  - AzureActivity
  - Azure Policy
  - AzureResourceGraph
  - 'NAI: Policy definitions and assignments at management group, subscription, and resource group scope,
    especially those deploying extensions, identities, network exposure, or automation assets to sensitive
    workloads'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: In AzureActivity, alert on OperationNameValue in (MICROSOFT.AUTHORIZATION/POLICYDEFINITIONS/WRITE,
      MICROSOFT.AUTHORIZATION/POLICYASSIGNMENTS/WRITE) where the definition/assignment uses the DeployIfNotExists
