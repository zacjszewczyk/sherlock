- question: Through statistical baselining and anomaly detection, can analysts surface policy governance
    volume/frequency outlier as it would manifest during Persistence?
  context: 'Under the Persistence tactic, the analyst is looking for the following evidence: A policy
    definition or assignment is created or changed so a DeployIfNotExists effect can deploy or reapply
    a backdoor resource, privileged extension, or malicious configuration whenever the policy evaluates
    matching resources, allowing persistence to be re-established automatically. This statistical method
    approach proceeds as follows: Baseline per-Caller and per-scope counts of policy writes, role grants,
    remediation tasks, and deployed resource types; flag robust outliers using the MAD-based modified
    Z-score (|Z| > 3.5) so batch automation does not distort thresholds ([Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)).
    Derive tenant-specific cutoffs from 30-90 days of AzureActivity; alert on DeployIfNotExists assignments
    whose scope breadth or template resource count exceeds the historical 95th percentile, and on new-author
    + broad-scope + privileged-roleDefinitionIds combinations. A positive result strengthens the case
    that Azure Policy is in use for persistence; a negative result helps rule it out or redirect the investigation.'
