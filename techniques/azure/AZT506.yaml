name: 'AZT506: Network Security Group Modification'
id: 1d44452e-5bed-40c0-b1bd-714934d2fb9a
description: >-
  Investigate whether an adversary has modified an Azure Network Security Group (NSG) to establish or
  maintain access over ports, protocols, or source ranges that were not previously permitted, a common
  persistence mechanism in Azure (ATRM AZT506). This playbook helps an analyst examine NSG security-rule
  write/delete operations in the Azure control plane, confirm whether those rule changes produced real
  new ingress or east-west traffic in NSG flow logs, and distinguish malicious openings of administrative
  and management services from routine policy maintenance. It combines deterministic rule-matching (allow
  rules exposing admin ports or broad source CIDRs), first-seen and robust statistical baselining of actors
  and NSG behavior, time-series and graph-based anomaly detection, and unsupervised/temporal machine-learning
  models that flag durable, unauthorized exposure and the principals responsible for it.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: >-
    Has an NSG security rule been created or updated to ALLOW inbound traffic to administrative or management
    ports (e.g., 22, 3389, 5985/5986, 445, 1433, 3306, 5432) or from broad/internet source ranges such
    as '*', 'Internet', 0.0.0.0/0, or a /16-or-broader CIDR, especially as a high-priority (low-numbered)
    rule?
  context: >-
    This deterministic check is the front-line detection for AZT506 persistence: an adversary opens a
    path back into Azure by relaxing NSG rules. On AzureActivity, look for operationName Microsoft.Network/networkSecurityGroups/securityRules/write
    (and the related .../write, .../securityRules/delete, .../join/action) where the resulting rule has
    access=Allow and direction=Inbound, then test whether the destination port is in the administrative
    set or the source prefix is broad. Low rule numbers take precedence, so a high-priority permissive
    rule is more dangerous. Escalate sharply when the parent NSG is attached to subnets hosting domain
    controllers, jump/bastion hosts, or sensitive workloads, because that converts a config change into
    durable privileged access. A positive result is a concrete persistence lead; a negative result narrows
    the investigation to subtler statistical signals. This is tactic-specific to Persistence (TA0003):
    the goal is keeping a foothold open after the original session ends.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: Last 90 days, prioritizing rule writes in the last 24-48 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      SEARCH AzureActivity WHERE operationName IN [Microsoft.Network/networkSecurityGroups/securityRules/write,
      Microsoft.Network/networkSecurityGroups/write, .../securityRules/delete, .../join/action]; PARSE
      resulting rule; ALERT when access='Allow' AND direction='Inbound' AND (destinationPortRange IN {22,3389,5985,5986,445,1433,3306,5432}
      OR sourceAddressPrefix IN {'*','Internet','0.0.0.0/0'} OR cidr_prefix<=16); RANK by low priority
      number; ESCALATE when parent_NSG attached_to sensitive_subnets; OUTPUT caller, nsg, rule_priority,
      port, source_prefix, time.
- question: >-
    After an NSG securityRules/write event, did a first-ever allowed 5-tuple matching the newly permitted
    source prefix and destination port appear in NSG flow logs within ~15 minutes, confirming the change
    produced real new ingress or east-west traffic?
  context: >-
    Rule changes alone may be benign policy maintenance; the strongest persistence evidence is when a
    config change is immediately followed by traffic that the change enabled. Correlate each securityRules/write
    with NSG flow logs and treat it as concrete persistence evidence when a never-before-seen allowed
    source->destination:port flow (matching the newly permitted prefix and port) appears within 15 minutes.
    NSG flow logs supply the Allow/Deny decision, bytes/packets in both directions, and flow state needed
    to prove that the modification produced actual new connectivity rather than sitting dormant. A positive
    correlation means the adversary not only opened the door but is using it. This directly supports Persistence
    (TA0003) by showing the maintained access path is live.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: >-
    Last 90 days, correlating each rule-write event with flow logs in a 15-minute forward window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: >-
      JOIN AzureActivity(securityRules/write) TO NSGFlowLogs ON nsg, time_window<=15m; FILTER flow WHERE
      decision='Allow' AND src_prefix MATCHES new_rule.sourceAddressPrefix AND dst_port MATCHES new_rule.destinationPortRange
      AND tuple_first_seen=true; ALERT as confirmed persistence; OUTPUT rule_change, 5tuple, bytes_in,
      bytes_out, flow_state, delta_minutes.
- question: >-
    Was the NSG securityRules/write performed by an identity (or role) that has never before performed
    network operations, or from a source IP/geo not previously seen for that identity over the prior 30-90
    days?
  context: >-
    Maintain a per-principal and per-role history of NSG/network control-plane operations over a rolling
    30-90 day window. A securityRules/write by a principal with no prior network-operation history, or
    originating from a brand-new source IP or geolocation for that identity, is a strong first-seen signal
    of a compromised or atypical account being used to plant persistence. This baselining requires no
    external threat feeds and surfaces credential misuse where the action itself looks legitimate but
    the actor context does not. A positive result points to account takeover or insider misuse; a negative
    result suggests the change came from an expected operator. Tied to Persistence (TA0003): adversaries
    often use a hijacked identity to open the durable access path.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: Last 90 days, with rolling 30-90 day per-principal and per-role baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      BASELINE per caller (and per role) over 30-90d => set(network_operations), set(source_ip), set(geo);
      FOR each AzureActivity securityRules/write: ALERT when caller has zero prior network_operations
      OR source_ip/geo NOT IN caller_baseline; OUTPUT caller, role, operationName, source_ip, geo, first_seen_flags.
- question: >-
    For a given NSG, does a rule change's openness or resulting traffic exceed the NSG's own robust baseline
    (modified Z-score using median and MAD) for daily change count, distinct permitted ports, source-CIDR
    breadth, or post-change flow byte volume?
  context: >-
    Per NSG, compute robust baselines over 30 days using the median-absolute-deviation modified Z-score,
    0.6745*(x-median)/MAD, flagging |score|>3.5, for: changes per day, number of distinct permitted ports,
    source-CIDR breadth (host count covered), and post-change flow byte volume. Flag rule changes whose
    openness or resulting traffic departs sharply from the NSG's robust threshold or from peer NSGs of
    similar purpose. Using median/MAD instead of mean/stddev resists distortion from batch automation
    and occasional large legitimate changes. A flagged outlier indicates an unusually broad or high-traffic
    opening worth manual review. This supports Persistence (TA0003) by catching the over-broad openings
    adversaries make to guarantee future access.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: Last 90 days, with 30-day per-NSG robust baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      FOR each nsg: COMPUTE median, MAD over 30d for [changes_per_day, distinct_permitted_ports, source_cidr_hostcount,
      post_change_byte_volume]; score = 0.6745*(x-median)/MAD; ALERT when abs(score)>3.5 for any feature
      OR feature >> peer_nsg_group; OUTPUT nsg, feature, value, mod_zscore, peer_comparison.
- question: >-
    Do per-subscription or per-NSG securityRules/write counts, or post-change flow-volume series, show
    seasonal/trend time-series anomalies that exceed a tuned anomaly score against learned seasonality?
  context: >-
    Apply seasonal and trend time-series decomposition (e.g., series_decompose_anomalies) to per-subscription
    and per-NSG securityRules/write counts and to post-change flow-volume series, alerting on points whose
    anomaly score exceeds a tunable cutoff calibrated against labeled streaming benchmarks. Unlike fixed
    thresholds, this learns normal seasonality (business-hours change windows, weekly automation cycles)
    and catches bursts of rule edits or traffic spikes that static rules miss. A positive result is an
    abnormal cluster of NSG modifications or a traffic surge inconsistent with historical rhythm. This
    is relevant to Persistence (TA0003) because adversaries may make multiple edits in a short burst to
    establish and refine their access path.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: Last 90 days, with decomposition over the series history to learn seasonality.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      BUILD time_series of securityRules/write counts per subscription and per nsg, and post-change flow_volume
      series; APPLY series_decompose_anomalies(series, seasonality); ALERT when anomaly_score>tuned_cutoff;
      OUTPUT scope, timestamp, observed, expected, score.
- question: >-
    Immediately after a rule change, did NSG flow logs show a never-before-seen external or cross-subnet
    edge (source->destination/port) to a managed host, as scored by a Bayesian new-edge model?
  context: >-
    Treat NSG flow logs as a dynamic graph and score first-time (new-edge) source->destination/port connections
    using a Bayesian new-edge prediction model. A rule change immediately followed by a never-before-seen
    external or cross-subnet edge to a managed host is a high-value persistence signal that is statistically
    distinct from ordinary connection churn, because the model accounts for the expected rate of new connections
    in the environment. A high new-edge score on an edge enabled by a fresh rule change strongly suggests
    the adversary is exercising the access they just provisioned. Negative results (edges that fit normal
    churn) help suppress noise. Directly relevant to Persistence (TA0003): the new edge is the maintained
    access path in action.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: Last 90 days, scoring new edges in the window following each rule change.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      MODEL flow graph edges(src->dst:port) with Bayesian new-edge predictor over history; FOR flows after
      a securityRules/write: score = P(new_edge); ALERT when edge is first-seen AND (external OR cross-subnet)
      AND dst IN managed_hosts AND score>threshold; OUTPUT edge, score, related_rule_change, time_delta.
- question: >-
    Are there bursts of Failed/AuthorizationFailed securityRules/write operations (permission probing)
    or a spike in denied flows on a newly targeted port after a change, deviating from baseline failure
    rates per principal and per NSG?
  context: >-
    Profile failure rates as distinct signals. First, bursts of Failed or AuthorizationFailed securityRules/write
    operations in AzureActivity (status field) indicate a principal probing for the permissions needed
    to establish persistence, often before a successful change. Second, a spike in denied flows on a newly
    targeted port after a rule change indicates partial or misconfigured exposure, or external scanning
    of the freshly opened service. Baseline normal failure rates per principal and per NSG and alert on
    robust deviations. A surge in authorization failures may catch the adversary in the reconnaissance/attempt
    stage; a surge in denied flows may reveal that an opening attempt drew immediate attention. This supports
    Persistence (TA0003) by detecting both the attempt to open access and the early use of a partially
    opened path.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: >-
    Last 90 days, with per-principal and per-NSG failure-rate baselines and short burst windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      BASELINE failure_rate per caller and per nsg over 30d; COUNT AzureActivity securityRules/write WHERE
      status IN ['Failed','AuthorizationFailed'] per caller per window; COUNT NSGFlowLogs denied flows
      per nsg,dst_port per window; ALERT when either count exceeds robust baseline deviation; OUTPUT caller/nsg,
      fail_type, count, baseline.
- question: >-
    Does an unsupervised isolation-based outlier model flag an NSG-change feature vector (permitted-port
    breadth, source-CIDR host count, new-port flag, rule priority, change hour, actor first-seen flag,
    post-change byte volume, allow/deny ratio) as an outlier indicating durable unauthorized access?
  context: >-
    Train an unsupervised Isolation Forest / Extended Isolation Forest on NSG-change feature vectors built
    from control-plane and flow telemetry: permitted-port breadth, source-CIDR host count, new-port flag,
    rule priority, change hour, actor first-seen flag, post-change byte volume, and allow/deny ratio.
    These models give linear-time scoring on unlabeled data and are well suited to surfacing rare, durable,
    unauthorized openings that do not match routine maintenance. Each alert should surface the top-3 contributing
    features so analysts understand whether breadth, novelty of the actor, or resulting traffic drove
    the score. A high anomaly score on a recent change is a prioritized persistence lead. This supports
    Persistence (TA0003) by isolating the small fraction of changes that establish lasting access.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: Last 90 days for feature history, scoring each new NSG change.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      features = [permitted_port_breadth, source_cidr_hostcount, new_port_flag, rule_priority, change_hour,
      actor_first_seen_flag, post_change_byte_volume, allow_deny_ratio]; model = IsolationForest_or_ExtendedIF.fit(historical_changes);
      score = model.decision(features); ALERT on high anomaly score; OUTPUT change_id, nsg, caller, score,
      top_3_features.
- question: >-
    Does temporal graph / UEBA peer-group modeling flag the NSG-modifying identity as anomalous, correlating
    the NSG change with subsequent anomalous cross-service activity or deviation from the identity's peer
    baseline?
  context: >-
    Build dynamic user-service-activity graphs from Azure audit/Activity logs and use temporal GNN embeddings
    to detect anomalous principal behavior, correlating an NSG modification with subsequent anomalous
    cross-service activity by the same identity. Layer Sentinel UEBA peer-group scoring to flag NSG changes
    by identities that deviate from their peer baseline. Alerts must surface contributing features, such
    as BlastRadius, first-time activity, and unusual source IP/geo, rather than only a score, so analysts
    can judge whether the identity is compromised. A positive result ties the rule change to a broader
    pattern of anomalous behavior by the same principal, strongly suggesting account compromise driving
    persistence. This supports Persistence (TA0003) by attributing the access-opening change to an identity
    behaving outside its norm.
  answer_sources:
  - AzureActivity
  - NSGFlowLogs
  - AzureDiagnostics
  - >-
    NAI: NSGs attached to internet-facing or high-value subnets; security-rule write/delete operations
    that open management ports or broad source ranges; and NSG flow telemetry showing new external or
    cross-subnet communication after a rule modification.
  range: >-
    Last 90 days for graph/peer-group baselines, scoring identities around NSG changes.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      BUILD dynamic user-service-activity graph from AzureActivity/audit; learn temporal_GNN embeddings;
      score principal anomaly around securityRules/write events; CORRELATE with subsequent cross-service
      activity; LAYER UEBA peer_group_score; ALERT when principal deviates from peers OR shows anomalous
      post-change activity; OUTPUT principal, score, contributing_features[BlastRadius, first_time_activity,
      unusual_source_ip_geo].
