  queries:
  - technology: ML pipeline pseudocode
    query: >-
      seq = build_event_sequence(signin, consent, token_issuance, first_data_access, bulk_enumeration)
      per appId/user | score = lstm_next_event.predict(seq) | ALERT when prediction_anomaly high | OUTPUT
      appId, anomalous_steps, score
- question: When IAM/consent telemetry is modeled as a heterogeneous dynamic graph (user -> delegated
