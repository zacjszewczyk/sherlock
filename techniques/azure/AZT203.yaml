  context: Model IAM/consent telemetry as a heterogeneous dynamic graph (user -> delegated grant -> service
    principal -> resource scopes) and flag the new control edge and its abnormal downstream fan-out across
    users/objects. The method returns the explainable contributing subgraph rather than only a score,
    which helps the analyst see exactly which grant and which downstream accesses are anomalous. A flagged
    subgraph indicates a newly created consent relationship that is reaching far more of the tenant than
    the graph structure predicts, consistent with a consent foothold being exploited.
