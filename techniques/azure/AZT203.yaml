      scopes | OUTPUT appId, error_codes, counts, window
- question: Does an event-sequence/LSTM next-event predictor flag the ordered audit stream (sign-in ->
    consent -> token issuance -> first data access -> bulk enumeration) as an aberrant, compressed sequence?
  context: Model the ordered audit stream - sign-in, consent, token issuance, first data access, bulk
    enumeration - with an event-sequence/LSTM next-event predictor. Benign onboarding yields a slower,
    narrower sequence, so prediction anomalies surface compressed or aberrant adversary sequences. Surface
    the contributing sequence steps in the alert. A high anomaly score means the observed progression
    deviates from learned benign patterns, often because the adversary compresses the steps or escalates
    directly to bulk enumeration.
  answer_sources:
