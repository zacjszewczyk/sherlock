  - technology: SIEM/Rule pseudocode
    query: >-
      per recently_consented appId measure distinct_users, distinct_sites, objects_accessed within window
      | ALERT when app enumerates mail/files/chats/contacts/directory across multiple users/sites soon
      after consent (app governance: 'access after recent consent','unusual volume') | OUTPUT appId, distinct_users,
      distinct_sites, data_types
- question: Is the elapsed time between consent, first token issuance, and first data access for an app
    far shorter than benign SaaS adoption, based on a robust MAD threshold?
  context: The volume/frequency physics of the attack mean adversaries move from consent to data access
    far faster than benign onboarding. Measure the elapsed time between consent, first token issuance,
    and first data access, and flag apps whose first high-risk access occurs far faster than benign SaaS
    adoption using a robust median/MAD threshold on the per-app consent-to-use interval. A compressed
    consent-to-use interval is a strong indicator of pre-staged, automated adversary tooling rather than
    a human onboarding a new SaaS app.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Entra ID SignInLogs
  - OfficeActivity
