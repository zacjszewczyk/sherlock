- question: After consent, is an app generating bursts of Graph 403/429/interrupted errors or AccessDenied
    responses that suggest scoped harvesting against objects the grant does not cover?
  context: Track per-app Graph error/throttle rates (403/429/interrupted) after consent as a distinct
    success/fail state signal. Bursts of failed enumeration calls or AccessDenied responses indicate scoped
    data harvesting against objects the grant does not cover, distinguishing active abuse from benign
    use. An app that probes beyond its granted scopes - generating many AccessDenied responses - is behaving
    like an adversary mapping reachable data rather than a well-behaved SaaS integration.
  answer_sources:
