    comparisons.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per appId compute interval = first_data_access - consent_time (also first_token issuance) | baseline
      median/MAD of benign consent-to-use intervals | ALERT when modified_z of interval indicates abnormally
      short (|z|>3.5, faster than benign) | OUTPUT appId, interval, modified_z
- question: Does the number of services, users, and objects accessed by an app shortly after consent,
    or its Graph-call volume, exceed the time-series forecast band for peer apps with similar publishers
    and scopes?
  context: Compare the post-consent breadth of an app - number of services, users, and objects accessed,
    plus Graph-call volume - against peer apps with similar publishers and scopes using time-series forecast
    bands per app. Escalate apps whose post-consent breadth or call volume exceeds the predicted interval.
    This catches an app that, immediately after consent, fans out across far more of the tenant than comparable
    legitimate applications, which is consistent with bulk collection from a consent foothold.
