name: 'AZT203: Malicious Application Consent'
id: 19d219e0-470f-4dc0-8fec-7e0f7748615d
description: >-
  Investigate whether an adversary has obtained initial access by socially engineering a user into granting
  OAuth consent to a malicious or over-privileged application registered in Entra ID (Azure AD). This
  playbook helps an analyst examine tenant app-consent events to determine whether a user granted delegated
  permissions to an application that is new, untrusted, unusually privileged, lacks a verified publisher,
  or is inconsistent with the user's job function - access that can be used immediately without further
  credential prompts and that bypasses MFA, conditional-access session controls, and password resets.
  It then guides the analyst through detecting whether the newly consented application rapidly began acquiring
  tokens and reaching into mailboxes, files, chats, contacts, or directory objects through Microsoft Graph
  and related APIs in ways that align with the granted scopes and indicate active adversary use of the
  consent foothold. Detection methods span deterministic rules over Entra audit operations, statistical
  baselining of consent volume and scope sensitivity, failure/throttle profiling, and machine-learning
  approaches (peer-group/UEBA scoring, classifiers, event-sequence models, and IAM graph anomaly detection)
  to separate malicious consent abuse from legitimate SaaS onboarding.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a user grant consent to an application that is newly registered, low-prevalence in the
    tenant, lacks a verified publisher, uses reply/redirect URLs outside approved domains, or requests
    high-impact delegated scopes such as Mail.Read, Mail.ReadWrite, Files.ReadWrite.All, Directory.Read.All,
    Sites.Read.All, or offline_access?
  context: 'This is the core deterministic check for malicious application consent as an Initial Access
    vector. Alert on Entra audit operations ''Consent to application'', ''Add delegated permission grant'',
    and ''Add app role assignment grant to user'' and evaluate the target application against risk attributes:
    registration age under 30 days, low tenant prevalence, missing verified publisher, and reply/redirect
    URIs outside approved domains. Pay special attention to high-impact delegated scopes - offline_access
    and refresh-token scopes are high severity because they grant durable, MFA-bypassing access that survives
    password resets. A positive result means a foothold may already exist that operates with the user''s
    privileges; raise severity further when the consenting user is privileged or has no application-administration
    duties.'
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days, prioritizing app-consent events and follow-on activity from the last 24-48 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      search AuditLogs where OperationName in ('Consent to application','Add delegated permission grant','Add
      app role assignment grant to user') | join app_registry on appId | where app.age_days<30 OR app.tenant_prevalence<=low
      OR app.verified_publisher=false OR app.reply_url NOT IN approved_domains | where scopes intersect
      ('Mail.Read','Mail.ReadWrite','Files.ReadWrite.All','Directory.Read.All','Sites.Read.All','offline_access')
      | set severity=high if 'offline_access' in scopes OR consenting_user.privileged=true | OUTPUT user,
      appId, app.displayName, scopes, severity
- question: Across all tenant OAuth grants, are there applications consented to by many users in a short
    window or by privileged accounts, and how sensitive are the scopes they hold?
  context: Because consent-based access bypasses MFA and conditional-access session controls and survives
    password resets, the analyst should inventory all tenant OAuth grants (oauth2PermissionGrants) and
    search the Unified Audit Log for 'Consent to application' / 'Add OAuth2PermissionGrant'. Escalate
    applications that were consented to by many users in a short window (suggesting a broad consent-phishing
    campaign) or by privileged accounts (where the resulting delegated access is far more dangerous).
    Severity should be gated on scope sensitivity and the consenting user's role rather than on volume
    alone, so a single privileged consent to a sensitive scope is treated as seriously as a mass-consent
    event.
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days, prioritizing app-consent events and follow-on activity from the last 24-48 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      inventory = list oauth2PermissionGrants | enrich consentUAL = UnifiedAuditLog where Operation in
      ('Consent to application','Add OAuth2PermissionGrant') | GROUP BY appId => distinct_users, time_span,
      max_user_privilege, scope_sensitivity | ALERT when (distinct_users>=N within short_window) OR max_user_privilege='privileged'
      | rank by scope_sensitivity * user_privilege | OUTPUT appId, distinct_users, scopes, top_consenter_role
- question: Did a consent event immediately follow a risky or failed-then-successful sign-in, originate
    from an unusual browser/referrer, or involve an application with mismatched branding or newly registered
    redirect URIs?
  context: Adversary-in-the-middle (AiTM) phishing relays frequently chain a credential/token theft into
    an immediate OAuth consent so the attacker retains access even after the stolen session expires. Flag
    consent events that follow a risky or failed-then-successful sign-in (anomalous location/device, AiTM/reverse-proxy
    indicators), originate from unusual browsers or referrers, or involve apps with mismatched branding
    or newly registered redirect URIs. A consent that occurs minutes downstream of an AiTM relay is high
    severity and strongly indicates initial access via consent abuse rather than legitimate SaaS onboarding.
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days, prioritizing app-consent events and follow-on activity from the last 24-48 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      JOIN AuditLogs(consent) TO SignInLogs ON user, time_window<=30m | FLAG when signin.riskLevel in
      ('medium','high') OR (failed_then_success) OR signin.AiTM_indicator=true OR signin.browser/referrer
      anomalous OR app.branding_mismatch OR app.redirect_uri first_seen | OUTPUT user, appId, signin.risk,
      signin.location, time_delta
- question: Is a user's or department's daily consent count, or the number of sensitive scopes granted,
    statistically anomalous relative to a robust 30-day baseline?
  context: Legitimate SaaS onboarding produces occasional consent activity, so a robust statistical baseline
    avoids alert fatigue while still catching abuse. Baseline normal consent volume by user, department,
    publisher, and scope, then apply a median/MAD modified Z-score (flag |z|>3.5) to per-user and per-department
    daily consent counts and to the count of sensitive scopes granted. Derive tenant-specific thresholds
    from a trailing 30-day window. A flagged outlier means the consent activity is far outside historical
    norms for that identity or group, warranting review of which application and scopes were involved.
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days, with a trailing 30-day baseline window for per-user, per-department, and per-app
    comparisons.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per user,department over 30d of daily_consent_count and sensitive_scope_count | compute
      modified_z = 0.6745*(x - median)/MAD | ALERT when abs(modified_z)>3.5 | OUTPUT user, department,
      metric, value, modified_z, appId
- question: Which consent events are at least as suspicious as every benign consent along publisher rarity,
    delegated-scope sensitivity, and consenting-user reputation, under a fixed alert budget?
  context: 'Directed Anomaly Scoring produces budget-bounded, high-recall alerts instead of unbounded
    outliers by flagging an event only when it dominates (is at least as suspicious as) every benign consent
    along the chosen axes: publisher rarity, delegated-scope sensitivity, and consenting-user reputation.
    This is well-suited to consent abuse where the analyst wants a manageable, prioritized queue rather
    than a long anomaly list. A flagged event is one that no benign baseline event matches or exceeds
    on all axes, making it a strong candidate for malicious consent.'
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days, with a trailing 30-day baseline window for per-user, per-department, and per-app
    comparisons.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      score each consent on axes {publisher_rarity, scope_sensitivity, user_reputation} | flag event if
      for all benign_events b: event dominates b on all axes (directed anomaly scoring) within alert_budget
      K | OUTPUT ranked alerts, appId, axis_scores
- question: When weighting each consent by the breadth and sensitivity of its delegated scopes, do any
    apps exceed the time-series forecast band for normal SaaS onboarding in that department even at low
    raw consent volume?
  context: Raw consent counts can miss a single dangerous grant, so weight each consent by scope breadth
    and sensitivity - read vs. read-write, single-resource vs. .All, and presence of offline_access -
    to produce a risk score. Compare that score against normal SaaS onboarding for the department using
    time-series forecast bands, and escalate outliers even when raw consent volume is low. A positive
    result identifies a low-volume but high-risk consent (for example a single offline_access + .All grant)
    that simple counting would overlook.
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days, with a trailing 30-day baseline window for per-user, per-department, and per-app
    comparisons.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      weight = f(read_vs_write, single_vs_All, offline_access) | risk_score = sum(scope_weight) per consent
      | forecast band per department via time-series model | ALERT when risk_score > upper_forecast_band
      even if consent_volume low | OUTPUT appId, department, risk_score, band
- question: Are there spikes of interrupted or blocked consent attempts against an app, or apps generating
    elevated Graph 403/throttling rates immediately after consent?
  context: Profile interrupted/blocked consents and elevated post-grant Graph 403/throttling rates per
    app as a distinct probing signal. A spike of failed or blocked consent attempts against an application,
    or an application generating high error rates right after consent, indicates probing or misconfigured
    malicious tooling testing what the grant allows. This success/fail state signal complements volume-based
    detection and helps distinguish active adversary experimentation from smooth, benign onboarding.
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days, with a trailing 30-day baseline window for per-user, per-department, and per-app
    comparisons.
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per appId compute blocked_consent_count and post_consent_graph_error_rate (403/429/interrupted)
      | baseline normal rate | ALERT when blocked_consent_spike OR error_rate>baseline_mean+3sigma shortly
      after consent | OUTPUT appId, blocked_count, error_rate, window
- question: Is a user granting app consent that is uncommon for that user and for the user's department
    peers, such as a first-time consent from an unusual location or device?
  context: Peer-group / UEBA scoring flags a user granting app consent that is uncommon both for the user
    individually and for their department peers - first-time consent, unusual location or device. This
    catches social-engineering-driven consent that would look unremarkable at the tenant level but is
    anomalous for that specific identity and peer group. Surface the top contributing factors (first-time
    consent, new location/device, peer rarity) in the alert so the analyst can quickly judge whether the
    behavior reflects compromise.
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days for model features and baselines, with scoring of new consent and post-consent events.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      model peer_group(user, department) consent behavior | features = [first_time_consent, location_novelty,
      device_novelty, peer_rarity] | UEBA_score = ueba.score(user, event) | ALERT when score high | OUTPUT
      user, appId, top_contributing_factors
- question: Does a feature-based classifier score a consent event as likely malicious based on publisher
    reputation, permission-scope risk, user role, consent timing, sign-in risk, and prior app prevalence?
  context: A supervised classifier (random forest / gradient boosting) over publisher reputation, permission-scope
    risk, user role, consent timing, sign-in risk, and prior app prevalence in the tenant prioritizes
    events resembling social-engineering-driven consent abuse over legitimate SaaS onboarding. This first-party
    behavioral-baseline approach is proven for phishing detection. Surface the top-3 contributing features
    (for example offline_access scope, publisher never seen in tenant, privileged consenter) in the alert
    text so the analyst can validate the model's reasoning before escalating.
  answer_sources:
  - AuditLogs
  - Entra ID SignInLogs
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Unified Audit Log
  - Defender for Cloud Apps app governance
  - 'NAI: Tenant app-consent events, users without normal application-administration duties, new third-party
    apps, and applications requesting high-impact delegated scopes'
  range: Last 90 days for model features and baselines, with scoring of new consent and post-consent events.
  queries:
  - technology: ML pipeline pseudocode
    query: >-
      features = [publisher_reputation, scope_risk, user_role, consent_hour, signin_risk, app_prior_prevalence]
      | prob = consent_classifier.predict_proba(features) | ALERT when prob>=0.85 | OUTPUT user, appId,
      prob, top_shap_3
- question: After a 'Consent to application' event, did the same application rapidly acquire tokens or
    perform Graph activity - accessing mailboxes, files, chats, contacts, or directory objects - within
    minutes or hours of consent?
  context: Correlating each 'Consent to application' event with rapid follow-on token acquisition or Graph
    activity by the same application confirms active adversary use of the consent foothold. Escalate when
    access targets mailboxes, files, chats, contacts, or directory objects within minutes/hours of consent,
    and especially when it originates from unusual infrastructure or outside the user's normal workflow.
    A positive result moves the investigation from a suspicious grant to a confirmed, operational compromise
    that should be contained immediately.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Entra ID SignInLogs
  - OfficeActivity
  - Defender for Cloud Apps app governance
  - 'NAI: Recently consented applications, service principals receiving delegated tokens, user mail and
    file services, and suspicious cloud applications observed in downstream access telemetry'
  range: Last 90 days, prioritizing app-consent events and follow-on activity from the last 24-48 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      JOIN AuditLogs(consent) TO MicrosoftGraphActivityLogs/AADServicePrincipalSignInLogs ON appId, time_window<=several_hours
      | FLAG token_acquisition OR graph_access to mail/files/chats/contacts/directory soon after consent
      | escalate if source_ip unusual OR outside user workflow | OUTPUT appId, first_access_delta, resources,
      source_ip
- question: Is a newly consented application using its granted scopes to enumerate mail, files, chats,
    contacts, or directory data across multiple users or sites soon after consent?
  context: Detect a newly consented application using its granted scopes to enumerate data across multiple
    users or sites shortly after consent - the signature of data harvesting via a consent foothold. Defender
    for Cloud Apps app governance ships predefined rules such as 'app accessing data after recent consent'
    and 'app with unusual volume of data access' for exactly this pattern. A positive result indicates
    the application is exercising its delegated scopes at breadth inconsistent with a single user's legitimate
    use, strongly suggesting adversary data collection.
  answer_sources:
  - MicrosoftGraphActivityLogs
  - AADServicePrincipalSignInLogs
  - Entra ID SignInLogs
