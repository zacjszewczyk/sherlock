name: 'AZT103: Public Accessible Resource'
id: 5800c784-de97-4ca2-8bb7-213ed501d902
description: Investigate whether an adversary is discovering and prioritizing Azure resources that are
  reachable from the public internet so they can target exposed workloads for access, abuse, or follow-on
  collection. This playbook helps an analyst examine control-plane and data-plane activity that inspects
  or alters exposure surfaces -- public IP bindings, network security group rules, app-service access
  restrictions, storage anonymous/public-access settings, function apps, and application gateways -- as
  well as the network telemetry that shows newly reviewed public assets being validated, fingerprinted,
  scanned, or ranked for exploitation. It pairs deterministic symbolic-logic detections (exposure-setting
  reads, anonymous-access review, denied-operation bursts, exposure-to-probe correlation, endpoint fingerprinting,
  and scan/failed-connection tests) with statistical baselining (modified Z-score deviations, service-mix
  anomalies, validation concentration, and exposure-ranking acceleration) and machine-learning models
  (per-principal session and graph anomaly scoring) so a SOC analyst can distinguish routine cloud administration
  from reconnaissance that precedes intrusion.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is a single principal reading or modifying Azure exposure-related configuration -- public
    IP bindings, network security group rules, app-service access restrictions, and storage network settings
    -- across three or more distinct resource types within one session?
  context: 'During Reconnaissance an adversary who already holds some level of access often inspects the
    tenant''s exposure surface to learn which resources can be reached from the internet before committing
    to an attack. Detect Azure Activity Log control-plane reads and writes that touch exposure surfaces
    such as public IP bindings, NSG rules (MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/*WRITE|DELETE|SECURITYRULES/*|JOIN/ACTION),
    app-service access restrictions, and storage network configuration, using the operation strings from
    the SigmaHQ Azure NSG rule. Flag sessions that sweep across three or more distinct resource types,
    escalate when the principal holds no network-architecture role, and reconcile findings against the
    internet-exposed inventory from Defender for Cloud attack-path analysis. Tune the resource-type count
    to your tenant''s normal admin scope, but keep the deterministic operation match -- a positive result
    indicates deliberate exposure discovery rather than routine maintenance. Key references: [SigmaHQ
    Azure NSG rule](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/activity_logs/azure_network_security_modified_or_deleted.yml),
    [Defender for Cloud attack-path analysis](https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-attack-path).'
  answer_sources: &id001
  - Azure Activity Logs
  - Defender for Cloud Apps
  - Entra ID SignInLogs
  - PowerShell Event ID 4104
  - Proxy logs
  - Storage Analytics logs
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Admin endpoints querying Azure networking and platform services, subscriptions hosting public
    workloads, and identities that rarely inspect exposure-related settings'
  range: Last 90 days, with per-session correlation across exposure-related operations.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FILTER azure_activity WHERE operation MATCHES exposure_ops[public_ip, NETWORKSECURITYGROUPS/*WRITE|DELETE|SECURITYRULES/*|JOIN/ACTION,
      app_service_access_restrictions, storage_network_config]; GROUP BY principal,session; ALERT when
      distinct_resource_types>=3; ENRICH principal WITH role AND defender_attack_path_inventory; ESCALATE
      when principal_role NOT network_architecture.
- question: Is a principal enumerating anonymous or public-access settings -- storage AllowBlobPublicAccess,
    anonymous web endpoints, externally reachable function apps, or permissive application gateways --
    in one workflow, and is that paired with anonymous data-plane reads?
  context: 'Adversaries hunting for unauthenticated footholds review settings that permit anonymous access
    so they can read data without credentials. Flag sessions that enumerate storage blob public-access
    settings (AllowBlobPublicAccess), anonymous web endpoints, externally reachable function apps, or
    permissive application gateways together in one workflow, then confirm with data-plane evidence of
    AuthenticationType=Anonymous reads per Microsoft''s anonymous-access guidance. Treat repeated anonymous-read
    403/404 failures as a distinct failure-rate signal of probing for readable containers. A positive
    result -- configuration review followed by anonymous reads -- strongly suggests the actor is locating
    publicly readable data; a negative result helps rule out anonymous-exposure abuse for that principal.
    Key reference: [Microsoft anonymous-access guidance](https://learn.microsoft.com/en-us/azure/storage/blobs/anonymous-read-access-prevent).'
  answer_sources: *id001
  range: Last 90 days, correlating configuration reads with same-session anonymous data-plane access.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN config_reads[AllowBlobPublicAccess, anonymous_web_endpoint, function_app_public, app_gateway_permissive]
      TO storage_analytics WHERE AuthenticationType='Anonymous' ON principal,resource,session; ALERT when
      both present; SEPARATELY COUNT anonymous_read 403/404 per principal,window AS probing_failure_signal.
- question: Is one principal generating a burst of AccessDenied / 403 responses on exposure-related read
    or list operations, indicating permission enumeration during exposure discovery?
  context: 'Permission enumeration leaves a trail of denied operations as an actor probes what exposure
    settings they are allowed to read. Profile AccessDenied / 403 responses on exposure-related read/list
    operations in Azure Activity and Entra sign-in logs as a separate signal. A burst of denied configuration
    reads by one principal indicates permission enumeration during exposure discovery rather than benign
    administration, consistent with rare-operation cloud-audit baselining. Compare the denied-operation
    count against the principal''s normal behavior; a sharp spike, especially from an identity that rarely
    inspects exposure settings, is a high-value reconnaissance signal. Key reference: [Elastic CloudTrail
    ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources: *id001
  range: Last 90 days, with rolling per-principal denied-operation windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: FILTER azure_activity,signin WHERE operation IN exposure_read_list_ops AND result IN [AccessDenied,403];
      COUNT per principal,15m; BASELINE per principal over 30-60d; ALERT when denied_count>baseline_mean+3sigma
      OR principal first_seen inspecting exposure; OUTPUT principal, denied_ops, window.
- question: Does any principal deviate from its baseline volume of exposure-related property reads, the
    mix of services touched, or the proportion of reads focused on internet-facing resources?
  context: 'Statistical baselining catches reconnaissance that stays under deterministic thresholds. Baseline
    per-principal volume (count of exposure-related properties read per session), the mix of services
    touched, and the proportion of reads focused on internet-facing resources. Flag deviations with a
    robust median/MAD modified Z-score (e.g., |score|>3.5) and forecast expected review volume per principal
    with time-series forecasting, alerting on confidence-band breaks. Derive thresholds from 30-60 days
    of tenant history and surface the deviating features in the alert so the analyst can see whether the
    anomaly is driven by sheer volume, an unusual service mix, or a sudden focus on internet-facing assets.
    Key references: [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    [time-series forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x).'
  answer_sources: *id001
  range: Last 90 days, with 30-60 day per-principal baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each principal: compute per-session exposure_property_reads, service_mix, internet_facing_read_ratio;
      BASELINE median/MAD over 30-60d; modified_z = 0.6745*(x-median)/MAD; ALERT when |modified_z|>3.5
      OR forecast_confidence_band breached; OUTPUT deviating_features, score.'
- question: Is a session inspecting an unusually wide set of distinct externally exposed service types
    (VMs, storage, web apps, databases, gateways) in an improbable order, suggesting a systematic cross-service
    exposure sweep?
  context: 'A broad sweep across many exposed service types in one session is more consistent with deliberate
    exposure mapping than with focused maintenance. Measure how many distinct externally exposed service
    types -- VMs, storage, web apps, databases, gateways -- are inspected per session and score session
    plausibility with multi-order Markov models of ordered cloud operations. Escalate wide cross-service
    sweeps that exceed the operator''s usual maintenance scope and resemble improbable operation transitions.
    A high cross-service breadth combined with a low-probability operation sequence indicates an actor
    cataloguing the tenant''s external footprint rather than an administrator working on a single service.
    Key reference: [multi-order Markov models](https://ieeexplore.ieee.org/document/7065233/).'
  answer_sources: *id001
  range: Last 90 days, with per-session service-breadth and operation-sequence scoring.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each session: distinct_exposed_service_types = count([vm,storage,webapp,db,gateway]);
      seq_prob = markov_model.score(ordered_operations); ALERT when distinct_exposed_service_types>operator_baseline
      AND seq_prob<low_threshold; OUTPUT principal, service_types, improbable_transitions.'
- question: Does a per-principal model identify a low-privilege or atypical identity reviewing networking
    and public-access configuration with high exposure-property diversity, repetitive inspection, internet-facing
    concentration, and a high deny ratio?
  context: 'When no single feature is decisive, a behavioral model can combine weak signals into a confident
    detection. Train a per-principal session model on cloud-audit, sign-in, proxy, and host telemetry
    using features such as exposure-property diversity, repetitive property inspection, internet-facing-resource
    concentration, deny ratio, and follow-on validation. Use graph approaches that flag low-privilege
    identities reviewing networking/public-access configuration (CS-GAD, GNN-based IAM detection) and
    peer-group baselines from Microsoft Sentinel UEBA anomalies, plus behavioral baselining of control-plane
    access. The alert text must surface the top-3 contributing features, not just the score, so the analyst
    can judge whether the identity''s role and behavior justify escalation. Key references: [CS-GAD](https://arxiv.org/html/2409.12726v1),
    [GNN-based IAM detection](https://arxiv.org/abs/2512.10280), [Microsoft Sentinel UEBA anomalies](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference),
    [Wiz IMDS anomaly hunting](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources: *id001
  range: Last 90 days for model features, with scoring on current sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[exposure_property_diversity, repetitive_inspection, internet_facing_concentration,
      deny_ratio, followon_validation, privilege_level]; score=exposure_discovery_model.predict_proba(features);
      graph_score=iam_gnn.score(identity,service_graph); ALERT when score>=0.85 OR graph_anomaly_high;
      OUTPUT top_features_3, peer_group_deviation.
- question: After a session inspects public exposure settings, do the same resources receive near-term
    HTTP/HTTPS, SSH, RDP, database, or management-plane probes in NSG Flow Logs, Azure Firewall/WAF, or
    Zeek conn.log?
  context: 'The transition from reviewing exposure settings to actively probing the discovered resources
    is a key indicator that reconnaissance is turning into validation for exploitation. Correlate sessions
    that inspect public exposure settings with near-term HTTP/HTTPS, SSH, RDP, database, or management-plane
    probes against those same resources in NSG Flow Logs, Azure Firewall/WAF, and Zeek conn.log. Reconcile
    targets against Defender for Cloud attack-path and Defender EASM inventories, and raise severity when
    the targeted services store identity data, admin paths, or sensitive content. A tight exposure-review-then-probe
    sequence against high-value assets is strong evidence of intrusion preparation. Key references: [NSG
    Flow Logs](https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview), [Defender
    for Cloud attack-path](https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-attack-path),
    [Defender EASM](https://learn.microsoft.com/en-us/azure/external-attack-surface-management/).'
  answer_sources: &id002
  - Azure Firewall Network Rule Logs
  - NSG Flow Logs
  - Storage Analytics logs
  - WAF logs
  - Proxy logs
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: Public web applications, externally reachable storage and compute endpoints, web application
    firewalls, and network telemetry for newly examined Azure resources'
  range: Last 90 days, with short (e.g., <=1 hour) review-to-probe correlation windows.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN exposure_review_sessions TO network_probes[NSGFlow, AzureFW, WAF, Zeek_conn] ON target_resource,source,time_window<=1h
      WHERE probe_proto IN [http,https,ssh,rdp,db,mgmt]; ENRICH target WITH attack_path,EASM,data_sensitivity;
      ALERT and raise_severity when target stores identity/admin/sensitive data.
- question: Does an endpoint that inspected exposure settings then perform banner grabs, TLS handshakes,
    HTTP header collection, or auth-page loads against the discovered resources -- or do newly EASM-discovered
    public assets immediately receive inbound validation?
  context: 'Fingerprinting confirms an actor is characterizing discovered resources to plan exploitation.
    Alert when an endpoint that inspected exposure settings then performs banner grabs, TLS handshakes,
    HTTP header collection, or auth-page loads against discovered resources. Note that adversaries may
    instead enumerate exposure via third-party scanners (e.g., Censys), leaving no first-party probe,
    so also monitor newly EASM-discovered public assets that immediately receive inbound validation. Either
    pattern -- first-party fingerprinting from an exposure-reviewing host, or rapid inbound validation
    of a freshly-exposed asset -- indicates targeted attention rather than background internet noise.
    Key reference: [Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf).'
  answer_sources: *id002
  range: Last 90 days, with monitoring of newly discovered/exposed assets for immediate inbound validation.
  queries:
  - technology: Zeek/pseudocode
    query: FLAG src_host that previously reviewed exposure THEN performs [banner_grab, tls_handshake,
      http_header_collect, auth_page_load] on discovered_resource; ALSO WATCH EASM_new_public_assets for
      inbound validation within short window of discovery; OUTPUT src, target, fingerprint_method, time_delta.
- question: Are any source addresses exhibiting scan or failed-connection behavior across the public Azure
    footprint -- a high denied/refused proportion or many distinct destination IPs/ports in a short interval?
  context: 'Scanning produces a recognizable statistical fingerprint of many connection attempts with
    a high failure rate. Over NSG Flow Logs and Zeek, apply the Threshold Random Walk sequential-hypothesis
    test: treat each source''s connection attempts as success/fail trials and flag sources whose denied/refused
    (decision=D) proportion crosses the likelihood threshold. A practical fixed-rule fallback is a source
    touching >=15 distinct destination IPs or >=10 distinct destination ports with a deny-ratio >0.5 within
    5 minutes; mass-sweep speed/volume baselines follow ZMap. Keep the deterministic count thresholds
    and run the SPRT in parallel so both subtle and obvious scans are caught. Key references: [Threshold
    Random Walk sequential-hypothesis test](https://www.icir.org/vern/papers/portscan-oak04.pdf), [ZMap](https://zmap.io/paper.pdf).'
  answer_sources: *id002
  range: Last 90 days, with 5-minute scan-detection windows.
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR each src over NSGFlow,Zeek_conn: run TRW_SPRT(success=accepted, fail=denied/refused);
      FLAG when likelihood crosses threshold; FALLBACK ALERT when distinct_dst_ip>=15 OR distinct_dst_port>=10
      with deny_ratio>0.5 within 5m; OUTPUT src, dst_count, port_count, deny_ratio.'
- question: Does a user or source host validate a disproportionate fraction (e.g., >50% within an hour)
    of the public resources it just studied, with elevated blocked-connection and 403/404 rates?
  context: 'An actor preparing to exploit will revisit and connect to a large share of the assets it just
    discovered, far more than ordinary administration. Compare how often newly reviewed public assets
    receive immediate follow-on connections versus ordinary admin behavior using a robust modified Z-score.
    Flag a user or source host that validates a disproportionate fraction (e.g., >50% within 1 hour) of
    the public resources it just studied. Separately profile blocked-connection and 403/404 rates as a
    distinct failure signal. High validation concentration paired with elevated failures suggests systematic
    probing of discovered exposure rather than routine, scattered admin connections. Key reference: [modified
    Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources: *id002
  range: Last 90 days, with 1-hour review-to-validation windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each user/source: validated_fraction = followon_connected_assets / reviewed_assets within
      1h; modified_z over admin_baseline; ALERT when validated_fraction>0.5 OR modified_z>3.5; SEPARATELY
      profile blocked_conn and 403/404 rate; OUTPUT validated_fraction, failure_rate, asset_list.'
- question: Are newly discovered public resources being probed with an abnormally short time-to-first-probe,
    or is a session rapidly pivoting across regions and business units in a way that indicates systematic
    prioritization?
  context: 'Compressed timelines and broad pivoting distinguish targeted ranking from troubleshooting.
    Measure time-to-first-probe for newly discovered public resources and how often a session pivots across
    regions or business units; forecast expected probe rates per resource with time-series forecasting
    and calibrate background-versus-targeted using empirical scan/port-popularity baselines from internet-wide
    scanning studies. Flag compressed workflows that indicate systematic prioritization rather than troubleshooting.
    A very short discovery-to-probe latency, especially spanning multiple regions or business units, points
    to an actor deliberately ranking and validating exposed targets. Key references: [time-series forecasting](https://link.springer.com/article/10.1186/s13677-023-00491-x),
    [internet-wide scanning study](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).'
  answer_sources: *id002
  range: Last 90 days, with per-resource time-to-first-probe measurement.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each newly_discovered_resource: time_to_first_probe = first_probe - discovery_time; FOR
      each session: count region/business_unit pivots; forecast expected probe_rate; ALERT when time_to_first_probe<background_baseline
      AND cross_region_pivots high; OUTPUT resource, latency, pivot_count.'
- question: Does sequence or graph analytics identify an actor moving from exposure review into deliberate
    validation of public targets, with high distinct probed ports/IPs, deny ratio, exposure-to-probe latency,
    and service diversity?
  context: 'Modeling the full progression from discovery to validation surfaces intrusion-preparation
    patterns that individual rules miss. Apply sequence and graph analytics to identify actors moving
    from exposure review into deliberate validation of public targets. Use rare-function cloud-audit models
    (Elastic CloudTrail ML) and user-service-activity graph anomaly scoring (CS-GAD) with features including
    distinct probed ports/IPs, deny ratio, exposure-to-probe latency, and service diversity. Prioritize
    patterns resembling intrusion preparation, and the alert text must list the top-3 contributing features
    so the analyst can validate whether the modeled behavior reflects a real reconnaissance-to-exploitation
    pivot. Key references: [Elastic CloudTrail ML](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning),
    [CS-GAD](https://arxiv.org/html/2409.12726v1).'
  answer_sources: *id002
  range: Last 90 days for model features, with scoring on current actor sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: features=[distinct_probed_ports, distinct_probed_ips, deny_ratio, exposure_to_probe_latency,
      service_diversity]; score=pre_exploitation_model.predict_proba(features); graph_score=cs_gad.score(user_service_graph);
      ALERT when score>=0.85 OR graph_anomaly_high; OUTPUT top_features_3, sequence.
