      | where score anomalous AND ueba_anomaly | alert'
- question: Is the exposed account showing failed/errored runbook jobs or post-reveal failed sign-ins
    followed by success, indicating credential reuse attempts?
  context: 'Failure-rate signals expose reuse attempts even when the eventual success looks ordinary.
    Profile failed/errored job runs and post-reveal failed sign-ins of the exposed account as a distinct
    failure-rate signal; repeated failed authentications followed by success indicate credential reuse
    attempts. A failed-then-successful auth burst by a recently exposed account is a high-confidence reuse
    pattern; sustained failures alone still indicate attempted abuse. References: [Defender for Cloud
    Apps anomaly policies](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).'
  answer_sources:
