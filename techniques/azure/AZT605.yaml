- question: Is any principal performing repeated deployment-history reads or template exports across multiple
    resource groups shortly after authentication, privilege changes, or portal access to high-value subscriptions,
    with no recent deployment-management history?
  context: Deployment history and template exports can expose parameter values that were not protected
    as secure strings. Alert when a principal performs repeated deployment-history reads or exports across
    multiple resource groups shortly after authentication, privilege changes, or portal access to high-value
    subscriptions, prioritizing actors with no recent deployment-management history. Broad, cross-resource-group
    reads by a non-deployer right after a privilege change strongly suggest deliberate secret hunting;
    routine reads by an active deployer are expected.
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - Proxy Logs
  - 'NAI: Resource groups hosting sensitive workloads, deployment operators, and build systems that submit
    ARM or Bicep deployments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'AzureActivity where OperationName matches deployments/(read|exportTemplate)

      | summarize rg=dcount(ResourceGroup), reads=count() by Caller, bin(time,1h)

      | where rg>1 AND Caller_has_no_recent_deploy_writes AND preceded_by(auth|priv_change|portal_hv)

      | alert'
- question: Do AzureActivity and Proxy Logs reveal rapid navigation across deployment detail pages, export
    actions, and resource group views consistent with manual inspection of template inputs for embedded
    secrets?
  context: Manual secret hunting in the portal leaves a recognizable traversal fingerprint. Use AzureActivity
    and Proxy Logs to identify rapid navigation across deployment detail pages, export actions, and resource
    group views that suggest manual inspection of template inputs for embedded secrets. A fast click-through
    of many deployment pages and exports without accompanying change activity indicates browsing for secrets;
    sparse, change-linked navigation is normal operations.
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - Proxy Logs
  - 'NAI: Resource groups hosting sensitive workloads, deployment operators, and build systems that submit
    ARM or Bicep deployments'
