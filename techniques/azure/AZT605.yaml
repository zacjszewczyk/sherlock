- question: Does a temporal sequence model over runbook edits, credential-oriented output, and downstream
    identity telemetry identify sessions consistent with automation-based secret revelation and reuse?
  context: 'End-to-end abuse spans editing, disclosure, and reuse, which a sequence model captures better
    than isolated events. Train a multi-order Markov model over runbook edits, credential-oriented output,
    and downstream identity telemetry to recognize automation-based secret revelation and reuse, corroborated
    with UEBA peer-group anomaly scoring. A high-scoring edit->disclose->reuse sequence is a strong Credential
    Access signal; UEBA corroboration raises confidence. References: [multi-order Markov cloud sequence
    modeling](https://ieeexplore.ieee.org/document/7065233/); [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
