  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = normal_deploy_admin(signins, AzureActivity, ProxyLogs)

      score each session | where traverses_many_deployments AND lacks_change_activity

      | emit top_features | alert'
- question: Can a session classifier distinguish benign troubleshooting from deliberate harvesting of
    deployment-time secrets using page-access order, export frequency, subscription breadth, denied-read
    ratio, and absence of adjacent deployment writes?
  context: 'An Isolation Forest classifier on session features separates legitimate troubleshooting from
    harvesting. Build the classifier on page-access order, export frequency, subscription breadth, denied-read
    ratio, and absence of adjacent deployment writes, emitting the top-3 features per alert and validating
    against the CERT Insider Threat Test Dataset. A ''harvesting'' verdict driven by high export frequency,
    broad subscription coverage, and no adjacent writes is high priority; troubleshooting sessions tied
    to incidents are deprioritized. References: [Isolation Forest](https://doi.org/10.1145/2133360.2133363);
    [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - Proxy Logs
  - 'NAI: Resource groups hosting sensitive workloads, deployment operators, and build systems that submit
    ARM or Bicep deployments'
