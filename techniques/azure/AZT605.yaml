  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [page_order, export_freq, sub_breadth, denied_read_ratio, no_adjacent_writes]

      model = IsolationForest.fit(normal_sessions)

      | where outlier | explain top3 SHAP | alert'
- question: Is any principal accumulating AuthorizationFailed or denied deployment-history reads and exports,
    indicating secret hunting against resource groups the actor cannot yet access?
  context: 'Denied deployment reads are a distinct failure-rate signal of targeted reconnaissance. Track
    AuthorizationFailed/denied deployment-history reads and exports per principal; a burst of denied template-export
    attempts indicates secret hunting against resource groups the actor cannot yet access. A denied-export
    burst, especially followed by a successful read after privilege change, is a high-confidence hunting
    indicator; isolated denials may reflect scoping errors. References: [Defender for Cloud Apps anomaly
    policies](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - Proxy Logs
