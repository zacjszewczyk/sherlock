  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join AzureActivity(deployment reads/exports) with ProxyLogs(portal urls)

      | sessionize by Caller | where rapid_sequence(deployment_detail, export, rg_view)

      AND no_adjacent_deployment_writes | alert'
- question: Which users exceed their 95th-percentile profile for the number of deployment records viewed
    or exported, cross-subscription coverage, or off-hours export activity over a 30-day baseline?
  context: 'Outliering read breadth catches harvesting that stays under absolute thresholds. Baseline
    the number of deployment records viewed or exported per user, subscription, and resource group over
    30 days, then flag users whose read breadth, cross-subscription coverage, or off-hours export activity
    exceeds their 95th-percentile profile, applying rare-API population analysis. A user suddenly reading
    far more deployments across more subscriptions than their norm is a likely secret-hunting indicator;
    in-profile activity is benign. References: [Detecting Threats in CloudTrail Logs Using ML, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - Proxy Logs
  - 'NAI: Resource groups hosting sensitive workloads, deployment operators, and build systems that submit
    ARM or Bicep deployments'
  range: Last 90 days using a 30-day per-user baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per User 30d (deploy_reads, subs_covered, offhours_exports) p95

      now | where reads>p95 OR subs>p95 OR offhours_exports>p95

      | rare_api_population_score | alert'
- question: Do any sessions produce a high weighted exposure score when deployment reads are weighted
    by subscription criticality, number of templates viewed, and overlap with legacy deployments likely
    to contain insecure parameters?
  context: Not all deployment reads are equally risky; weighting focuses attention on the most exposing
    access. Weight deployment reads by subscription criticality, number of templates viewed, and overlap
    with known legacy deployments that may contain insecure parameters, and elevate sessions whose weighted
    exposure score materially exceeds the user's normal footprint. A high weighted score concentrated
    on critical, legacy-template subscriptions indicates targeted secret exposure; low scores on routine
    reads are deprioritized.
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - Proxy Logs
  - 'NAI: Resource groups hosting sensitive workloads, deployment operators, and build systems that submit
    ARM or Bicep deployments'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'score = sum(sub_criticality * templates_viewed * legacy_overlap) per session

      | compare to user_normal_footprint

      | where score >> baseline | alert'
- question: Does a behavioral model of normal deployment administration identify sessions resembling secret
    hunting that traverse many deployments without the surrounding change activity typical of legitimate
    operators?
  context: 'Modeling the full administrative context distinguishes hunting from genuine operations. Model
    normal deployment-administration behavior using sign-in telemetry, AzureActivity, and web proxy records,
    then identify sessions resembling secret hunting that traverse many deployments without the surrounding
    change activity typical of legitimate operators, surfacing top contributing features. A session that
    reads/exports many deployments but performs no writes or deployments is a strong hunting signal; reads
    embedded in real change workflows are normal. References: [Microsoft Sentinel anomalies reference](https://learn.microsoft.com/en-us/azure/sentinel/anomalies-reference).'
  answer_sources:
  - AzureActivity
  - Entra Sign-in Logs
  - Proxy Logs
  - 'NAI: Resource groups hosting sensitive workloads, deployment operators, and build systems that submit
    ARM or Bicep deployments'
