name: 'AZT106: Gather Role Information'
id: 4a678c04-a04c-46bc-a05d-9365fc83f8a9
description: Investigate adversary reconnaissance against Azure role information, where a principal enumerates
  Entra ID directory roles, eligible/PIM members, transitive and application role assignments, and Azure
  Resource Manager (ARM) role assignments across management groups, subscriptions, resource groups, and
  individual resources. This playbook helps an analyst determine whether someone is mapping privilege
  paths, identifying tenant administrators and high-value identities (Global Administrator, Privileged
  Role Administrator, application owners), and locating scopes where a compromised identity could exercise
  control over compute, networking, storage, identity, or security tooling. It covers deterministic detection
  of role-enumeration API calls and CLI/PowerShell cmdlets, privilege-path traversal signatures (AzureHound/BloodHound),
  first-seen authorization reads, denied-read burst probing, statistical volume/breadth/criticality anomalies,
  and graph- and sequence-based machine-learning models that score deliberate privilege-path discovery.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is a principal reading Entra ID directory roles, eligible/PIM members, transitive group memberships,
    application role assignments, or role-assignment endpoints in a way that maps who can administer the
    tenant?
  context: Under Reconnaissance, an adversary who has a foothold first wants to know who holds tenant
    power and which identities carry sensitive permissions before acting. Detect reads of directory roles,
    eligible/PIM members, transitive membership, app role assignments, and role-assignment endpoints.
    In MicrosoftGraphActivityLogs, alert on GET requests to /directoryRoles, /roleManagement/directory/roleAssignments,
    /roleManagement/directory/roleEligibilitySchedules, and /servicePrincipals/*/appRoleAssignments; on
    endpoints alert on CLI/PowerShell such as Get-MgRoleManagement*, Get-AzureADDirectoryRole, and az
    role assignment list, per ATRM AZT106. Apply a concrete floor (for example more than 20 distinct role/membership
    objects read in 10 minutes by one principal) to separate bulk enumeration from routine single lookups.
    A positive hit on a non-governance identity is a strong recon signal worth pivoting from.
  answer_sources: &id001
  - MicrosoftGraphActivityLogs
  - Entra ID AuditLogs
  - Entra ID SignInLogs
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Proxy logs
  - 'NAI: Graph sessions querying role and membership endpoints, identities without routine role-governance
    duties, and high-value tenant roles such as Global Administrator, Privileged Role Administrator, and
    application owners'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: graph = MicrosoftGraphActivityLogs | where method=='GET' AND requestUri matches ('/directoryRoles','/roleManagement/directory/roleAssignments','/roleManagement/directory/roleEligibilitySchedules','/servicePrincipals/*/appRoleAssignments');
      host = EID4688/EID4104 where cmd matches ('Get-MgRoleManagement*','Get-AzureADDirectoryRole','az
      role assignment list'); count distinct role/membership objects per principal over 10m; ALERT where
      count>20 AND principal not in role_governance_allowlist.
- question: Does a session pivot from basic role listings into privileged eligibility data, transitive
    group resolution, or service-principal role-assignment inspection to uncover who can elevate to or
    impersonate admin access?
  context: 'This targets the documented AzureHound/BloodHound privilege-path collection signature: a user->group->role->app->eligible-assignment
    traversal that reveals elevation and impersonation routes. Within Reconnaissance, flag sessions that
    start with general role listings and then deepen into eligibility schedules, transitive membership,
    and service-principal assignments. Weight reads that touch Global Administrator, Privileged Role Administrator,
    and application owners, because those are the prizes an attacker maps toward. A matching traversal
    pattern, especially against high-value roles, indicates intentional privilege-path discovery rather
    than incidental browsing.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: session = group_by(principal, 30m, graph_role_reads); detect ordered traversal roles->members->transitive->eligible->appRoleAssignments;
      w = weight(target_role in ['Global Administrator','Privileged Role Administrator','Application owner']);
      ALERT where traversal_depth>=3 AND w>0.
- question: Has an identity issued a role or membership read operation it has never performed before within
    the lookback window?
  context: Maintain a per-principal history of Graph/role operations and alert when an identity issues
    a role/membership read it has never performed in the lookback window. First-seen behavior is a robust
    signal for atypical principals performing recon under Reconnaissance, because legitimate governance
    and automation accounts repeat the same operations. Suppress known role-governance accounts and automation
    service principals to control noise. A first-seen role read from a user or service principal with
    no governance duties warrants investigation of the surrounding session and the account's recent authentication
    context.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'hist = per_principal_history(role_ops, lookback=90d); FOR each role/membership read op: IF
      op not in hist[principal] AND principal not in (governance_accounts, automation_sps): ALERT first_seen_role_read(principal,
      op).'
- question: Is a principal generating a burst of denied (403/forbidden) responses against role and membership
    endpoints, indicating permission probing?
  context: Authorization-failure responses are a distinct signal from successful reads. Count Graph 403/forbidden
    responses on role and membership endpoints per principal per window and alert on bursts (for example
    >=10 denied role reads in 10 minutes) or a denied:successful ratio far above the principal's baseline.
    Under Reconnaissance, a high denied rate means the actor is testing what it can see rather than performing
    sanctioned governance, which often precedes pivoting to a more privileged token. A clean baseline
    of mostly successful reads makes a sudden denial burst stand out clearly.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: denied = MicrosoftGraphActivityLogs | where endpoint in role_membership_endpoints AND responseStatusCode
      in (403); per principal/10m count denied, compute ratio=denied/successful; ALERT where denied>=10
      OR ratio >> baseline_ratio[principal].
- question: Is the count of roles, members, applications, and transitive paths reviewed by a principal
    or host a statistically robust deviation from its baseline?
  context: Baseline the volume and frequency of roles, members, applications, and transitive paths reviewed
    per principal and host, then alert on robust deviations using median-absolute-deviation / modified
    Z-score (|MZ|>3.5) so heavy automation does not inflate the baseline. Forecast expected per-identity
    authorization-read volume with seasonality and flag spikes. In Reconnaissance, a sharp fan-out in
    objects reviewed is the quantitative tell of enumeration. Robust statistics keep noisy automation
    from masking a real spike, and a flagged deviation should be triaged against the principal's normal
    role-governance role (or lack thereof).
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: metric = per_principal_per_host count(roles+members+apps+transitive) over 1h windows; mz =
      (x - median)/(1.4826*MAD); ALERT where abs(mz)>3.5; also forecast(expected_volume, seasonality)
      and flag actual>>forecast.
- question: Is a session disproportionately concentrating on tenant-wide or high-impact administrative
    roles compared to the actor's own history and its peer group?
  context: Compare the proportion of viewed role objects that are tenant-wide or high-impact against the
    actor's own history and its role-governance peer group, then flag sessions that concentrate on the
    most sensitive administrative roles. Use peer-group (UEBA) analytics and calibrate baselines with
    labeled recon scenarios. On hosts, baseline enumeration frequency with standard-deviation bands over
    Event ID 4688/4104 aggregates. Under Reconnaissance, over-indexing on Global Administrator, Privileged
    Role Administrator, and similar roles, rather than a representative spread, betrays targeting of the
    keys to the tenant. A high privilege-concentration ratio for a non-admin actor is a priority lead.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'p = fraction(viewed_roles that are tenant_wide/high_impact) per session; compare to self_history[principal]
      and peer_group_baseline; ALERT where p >> max(self_baseline, peer_baseline); host: stdev_bands over
      EID4688/4104 enum counts.'
- question: Does a machine-learning model scoring authorization reads as a user-role-resource-action graph
    and as an ordered enumeration sequence indicate anomalous privilege-path discovery?
  context: Model authorization reads as a heterogeneous user-role-resource-action graph and score anomalous
    traversal indicative of privilege-path discovery, complemented by a variable-order Markov model that
    scores whether the ordered enumeration session (roles->members->transitive->eligible/app) is plausible
    for the principal. Run this in parallel with the deterministic rules and surface the top-3 contributing
    features (for example role criticality, first-seen operation, request burst) in the alert text. Managed
    UEBA/ML anomalies (Sentinel anomalies, Defender for Cloud Apps anomaly policies) add scored coverage.
    In Reconnaissance, ML captures subtle, low-and-slow traversals that fixed thresholds miss, while explainable
    features keep analyst triage grounded.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: graph = build_hetero_graph(user,role,resource,action); s_graph = GNN_anomaly_score(traversal);
      s_seq = VOMM_score(order=[roles,members,transitive,eligible,app] | principal); score = combine(s_graph,
      s_seq); ALERT where score>threshold; emit top3_features.
- question: Is a principal listing ARM role assignments and role definitions across multiple scopes, subscriptions,
    or resources in a short window?
  context: Detect ARM or local command activity that lists role assignments across multiple scopes. Alert
    on Microsoft.Authorization/roleAssignments/read and roleDefinitions/read operations in AzureActivity/AzureDiagnostics
    and on Get-AzRoleAssignment, Get-AzRoleDefinition, and az role assignment list --all, per ATRM AZT106,
    especially when one session rapidly enumerates management groups, subscriptions, resource groups,
    and per-resource role bindings (for example more than 3 distinct scopes in 10 minutes). Under Reconnaissance,
    this reveals where a compromised identity could exert control, so broad cross-scope reads from a single
    session are a meaningful lead.
  answer_sources: &id002
  - AzureActivity
  - AzureDiagnostics
  - PowerShell Event ID 4104
  - Proxy logs
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Administrative workstations, ARM management endpoints, high-value subscriptions, and scopes
    that host identity, compute, storage, and monitoring resources'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: arm = AzureActivity/AzureDiagnostics | where operationName in ('Microsoft.Authorization/roleAssignments/read','Microsoft.Authorization/roleDefinitions/read');
      host = EID4104/EID4688/Sysmon1 where cmd matches ('Get-AzRoleAssignment','Get-AzRoleDefinition','az
      role assignment list --all'); per session count distinct scopes/10m; ALERT where scopes>3.
- question: Is a workflow walking from management groups to subscriptions to resource groups to individual
    resources while checking inherited and custom role assignments?
  context: Flag workflows that traverse the ARM hierarchy (management groups -> subscriptions -> resource
    groups -> individual resources) while checking inherited and custom role assignments, the deliberate
    control-mapping signature collected by AzureHound/BloodHound. Weight scopes hosting identity, security,
    backup, networking, and production compute resources. In Reconnaissance, this top-down inheritance
    tracing is how an adversary builds a complete picture of effective access, so a session that systematically
    descends the hierarchy against high-value scopes is a strong privilege-mapping indicator.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: session = group_by(principal,30m, arm_authz_reads); detect descent mgmtGroup->subscription->resourceGroup->resource
      with inherited+custom assignment reads; w = weight(scope hosts identity/security/backup/network/prod_compute);
      ALERT where hierarchy_descent AND w>0.
- question: Has an identity read role assignments on an ARM scope or operation it has never touched in
    the lookback window?
  context: Keep a per-principal history of ARM authorization operations and alert when an identity reads
    role assignments on a scope/operation it has never touched in the lookback window. Exclude known IaC/governance
    service principals that legitimately sweep scopes. Under Reconnaissance, a first-seen authorization
    read on a new scope, particularly a sensitive one, suggests the actor is exploring beyond its normal
    footprint, which is consistent with mapping new control opportunities.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'hist = per_principal_history(arm_authz_ops, lookback=90d); FOR each roleAssignments/read on
      scope S: IF (S,op) not in hist[principal] AND principal not in (iac_sps, governance_sps): ALERT
      first_seen_authz_read(principal,S,op).'
- question: Is a principal generating a burst of AuthorizationFailed (ARM 403) responses on role/authorization
    reads, indicating probing?
  context: Treat AuthorizationFailed (ARM 403) responses as a distinct probing signal. Count denied authorization/role
    reads per principal per window and alert on bursts or a denied:successful ratio far above baseline
    (for example >=10 AuthorizationFailed role reads in 10 minutes). In Reconnaissance, repeated denials
    show the actor is testing the boundaries of what its current identity can read, often a precursor
    to seeking a more privileged context. A normally low-denial principal that suddenly spikes is worth
    immediate review.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: denied = AzureActivity | where operationName has 'roleAssignments/read' AND status=='AuthorizationFailed';
      per principal/10m count denied, ratio=denied/successful; ALERT where denied>=10 OR ratio >> baseline[principal].
- question: Is the breadth of distinct scopes, subscriptions, and resource types a principal reviews for
    authorization data a robust statistical deviation from its baseline?
  context: Measure how many distinct scopes, subscriptions, and resource types a principal reviews for
    authorization data per day and alert on robust deviations using modified Z-score (|MZ|>3.5) to resist
    automation outliers; forecast expected per-identity volume with seasonality and flag spikes. Under
    Reconnaissance, an unusually wide authorization-read footprint is the quantitative signature of scope
    mapping. Robust statistics ensure a small number of busy automation accounts do not hide a genuine
    breadth spike from a human or compromised principal.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: metric = per_principal count(distinct scopes + subscriptions + resource_types) per day; mz
      = (x - median)/(1.4826*MAD); ALERT where abs(mz)>3.5; forecast(volume, seasonality) and flag actual>>forecast.
- question: Is an operator suddenly over-indexing on role assignments for identity, security, backup,
    networking, or production compute scopes relative to self and peer group?
  context: Baseline how often each operator inspects role assignments on identity, security, backup, networking,
    or production compute scopes and escalate sessions that suddenly over-index on those high-value scopes
    relative to self and peer group. On hosts, baseline CLI/PowerShell enumeration frequency with standard-deviation
    bands over Event ID 4688/4104; validate thresholds with labeled insider-threat data. In Reconnaissance,
    concentration on the scopes that govern identity and security tooling is precisely where an attacker
    wants control, so a sudden critical-scope bias is a high-priority lead.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'crit_frac = fraction(authz_reads on identity/security/backup/network/prod_compute scopes)
      per session; compare to self_baseline[principal] and peer_group; ALERT where crit_frac >> baselines;
      host: stdev_bands over EID4688/4104 enumeration counts.'
- question: Does a machine-learning model over ARM authorization-enumeration sessions score a session
    as deliberate privilege-path preparation?
  context: Build a model over authorization-enumeration sessions using a heterogeneous user-role-resource-action
    graph to score deliberate privilege-path preparation, with a variable-order Markov sequence model
    scoring whether the scope-traversal order is plausible for the principal. Features include scope depth,
    role criticality, subscription breadth, adjacency to prior identity recon, first-seen operations,
    and follow-on modification attempts. Run in parallel with deterministic rules and surface the top-3
    contributing features in alert text; managed ML anomalies add coverage. Under Reconnaissance, ML connects
    ARM recon to earlier directory recon and to subsequent modification attempts, catching staged privilege-path
    preparation that single rules would miss.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: graph = build_hetero_graph(user,role,resource,action over arm_authz_sessions); s_graph = GNN_score(privilege_path_prep);
      s_seq = VOMM_score(scope_traversal_order | principal); features=[scope_depth,role_criticality,subscription_breadth,adjacency_to_identity_recon,first_seen_ops,followon_modifications];
      score=combine(s_graph,s_seq); ALERT where score>threshold; emit top3_features.
