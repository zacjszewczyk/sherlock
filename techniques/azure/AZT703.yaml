name: 'AZT703: Replication'
id: 1c8256eb-a101-41de-b97c-d6ef167c7ff3
description: 'This playbook helps an analyst investigate whether an adversary has abused Azure Storage
  object replication to create unauthorized secondary copies of sensitive data or alternate recovery/exfiltration
  paths that enable impact. It covers two complementary signal sets. First, control-plane evidence: creation
  or modification of an object replication policy (Microsoft.Storage/storageAccounts/objectReplicationPolicies/write)
  that copies blob data to a destination account, container, subscription, or Entra tenant not normally
  associated with the protected workload, including cross-tenant/cross-subscription destinations, first-seen
  actors/roles, and anomalous replication breadth. Second, data-plane evidence: the read-side fingerprint
  of bulk copying in StorageBlobLogs, where elevated CopyBlob/GetBlob byte volumes, object counts, and
  throttling/authorization-failure spikes reveal data leaving the workload. Use it to distinguish legitimate
  resiliency engineering from adversary-driven replication.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
