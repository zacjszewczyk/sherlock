questions:
- question: Was a new or modified Azure Storage object replication policy created via the control-plane
    operation Microsoft.Storage/storageAccounts/objectReplicationPolicies/write, and did the acting principal
    recently acquire elevated storage RBAC?
  context: 'Object replication policy creation is a near-zero-baseline administrative event, so any unexpected
    occurrence warrants scrutiny under the Impact tactic because it can establish an unauthorized secondary
    copy or recovery path. Search AzureActivity for the objectReplicationPolicies/write operation, then
    correlate the actor against recent role assignments (Owner, Storage Account Contributor, or a custom
    role granting the objectReplicationPolicies action) granted within the prior 24 hours. Escalate when
    the destination account, subscription, or tenant is new for the source workload. A positive result
    (unexpected actor, freshly granted permissions, novel destination) is high severity; a negative result
    is a known operator within an established change window. References: [Configure object replication,
    Microsoft](https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-configure); [Detecting
    Post-Compromise Threat Activity AA21-008A, CISA](https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-008a).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Storage accounts containing sensitive datasets, replication-capable blob containers, and subscriptions
    with cross-tenant connectivity'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AzureActivity\n| where OperationNameValue == 'Microsoft.Storage/storageAccounts/objectReplicationPolicies/write'\n\
      | join kind=leftouter (RoleAssignmentEvents | where TimeGenerated > ago(24h)\n    and Role in ('Owner','Storage\
      \ Account Contributor') or RoleHasAction == 'objectReplicationPolicies')\n    on $left.Caller ==\
      \ $right.PrincipalId\n| extend new_destination = (DestinationAccount !in (known_destinations_for[SourceAccount]))\n\
      | where isnotempty(RecentRoleGrant) or new_destination\n| project TimeGenerated, Caller, SourceAccount,\
      \ DestinationAccount, Severity='High'"
- question: Does any object replication policy designate a destination storage account that resolves to
    a foreign Entra tenant or to a subscription not on the approved replication allowlist?
  context: 'Azure object replication legally supports source and destination accounts in different subscriptions
    and even different Entra tenants, which means adversaries can abuse it to copy data outside the organization''s
    trust boundary — the cloud analogue of MITRE T1537 Transfer Data to Cloud Account. Under the Impact
    tactic this represents unauthorized data movement that can both exfiltrate and provide cover. Resolve
    every policy''s destinationAccount to its owning subscription and tenant, compare against the approved
    replication allowlist, and treat any foreign-tenant or off-allowlist destination as CRITICAL. A positive
    result indicates likely data exfiltration via replication; a negative result confirms the destination
    is an approved internal pair. References: [Object replication overview, Microsoft](https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview);
    [Transfer Data to Cloud Account T1537, MITRE ATT&CK](https://attack.mitre.org/techniques/T1537/).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Storage accounts containing sensitive datasets, replication-capable blob containers, and subscriptions
    with cross-tenant connectivity'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'AzureActivity

      | where OperationNameValue == ''Microsoft.Storage/storageAccounts/objectReplicationPolicies/write''

      | extend dest_tenant = lookup_tenant(DestinationAccount), dest_sub = lookup_subscription(DestinationAccount)

      | where dest_tenant != source_tenant or dest_sub !in (approved_replication_subscriptions)

      | project TimeGenerated, Caller, SourceAccount, DestinationAccount, dest_tenant, dest_sub, Severity=''Critical'''
- question: Is this the first time the acting identity or role has ever issued an objectReplicationPolicies/write
    (or any storage-management) operation in the environment?
  context: 'Maintaining a lookback baseline of which identities and roles have previously performed storage-management
    operations lets you detect novelty, a strong indicator of compromise under the Impact tactic. Adversaries
    frequently operate through service principals or roles that never normally touch storage. Alert the
    first time a given principal performs objectReplicationPolicies/write, weighting heavily when the
    principal is a service principal or a role with no storage-management history. A positive result (first-seen
    actor/action) is suspicious and should be correlated with sign-in and audit context; a negative result
    means the actor routinely manages storage. References: [Cloud API Calls From Previously Unseen User
    Roles, Splunk](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Storage accounts containing sensitive datasets, replication-capable blob containers, and subscriptions
    with cross-tenant connectivity'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "let baseline = AzureActivity | where TimeGenerated between (ago(90d) .. ago(1d))\n    and\
      \ OperationNameValue startswith 'Microsoft.Storage/storageAccounts'\n    | summarize make_set(Caller);\n\
      AzureActivity\n| where TimeGenerated > ago(1d)\n| where OperationNameValue == 'Microsoft.Storage/storageAccounts/objectReplicationPolicies/write'\n\
      | where Caller !in (baseline)\n| project TimeGenerated, Caller, CallerType, SourceAccount, FirstSeen=true"
- question: Do current replication policies introduce first-seen source-to-destination edges, sudden increases
    in replicated containers/prefixes, or policy changes outside established change windows compared to
    the account's baseline?
  context: 'By baselining approved source-to-destination replication pairs, actor identities, rule/prefix
    counts, and the timing of changes per account, you can apply rare-event correlation to control-plane
    modifications. Under the Impact tactic, deviations from these baselines — a new replication edge,
    a jump in replicated containers, or an off-hours change — indicate possible adversary activity even
    when each individual operation looks routine. A positive result is a statistically rare deviation
    that should be triaged; a negative result fits established norms. References: [Detecting Post-Compromise
    Threat Activity AA21-008A, CISA](https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-008a);
    [Cloud API Calls From Previously Unseen User Roles, Splunk](https://research.splunk.com/cloud/2181ad1f-1e73-4d0c-9780-e8880482a08f/).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Storage accounts containing sensitive datasets, replication-capable blob containers, and subscriptions
    with cross-tenant connectivity'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "AzureActivity\n| where OperationNameValue contains 'objectReplicationPolicies'\n| extend edge\
      \ = strcat(SourceAccount,'->',DestinationAccount)\n| summarize rule_count=count(), edges=make_set(edge),\
      \ hours=make_set(hourofday(TimeGenerated)) by SourceAccount, bin(TimeGenerated,1d)\n| extend new_edge\
      \ = set_difference(edges, baseline_edges[SourceAccount])\n| where array_length(new_edge) > 0 or\
      \ rule_count > baseline_rule_count[SourceAccount]*2\n    or hours !in (approved_change_windows)\n\
      | project TimeGenerated, SourceAccount, new_edge, rule_count"
- question: What is the replication breadth-and-sensitivity score for each policy, computed as (number
    of replicated containers/prefixes) x (source-account sensitivity weight) x (destination novelty),
    and which policies sharply increase data exposure?
  context: 'Not all replication changes carry equal risk. Scoring each policy by replicated container/prefix
    count times source-account sensitivity times destination novelty applies a data-centric, volume-of-data
    principle so that broad copies of sensitive data rank highest even when the operation itself looks
    routine. Under the Impact tactic this prioritizes the policies that most increase exposure versus
    historical norms. A high score indicates a high-impact replication change that merits immediate review;
    a low score indicates limited, low-sensitivity scope. References: [A Data-Centric Approach to Insider
    Attack Detection, Mathew et al](https://link.springer.com/chapter/10.1007/978-3-642-15512-3_20).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Storage accounts containing sensitive datasets, replication-capable blob containers, and subscriptions
    with cross-tenant connectivity'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'AzureActivity

      | where OperationNameValue contains ''objectReplicationPolicies''

      | extend breadth = count_replicated_prefixes(PolicyBody)

      | extend sensitivity = source_sensitivity_weight[SourceAccount]

      | extend dest_novelty = iff(DestinationAccount in (known_destinations[SourceAccount]),1.0,3.0)

      | extend exposure_score = breadth * sensitivity * dest_novelty

      | where exposure_score > historical_p95[SourceAccount]

      | top 50 by exposure_score desc'
- question: Does a dynamic graph of normal actor->storage-account->destination relationships flag any
    new or altered replication edge as anomalous, especially edges connecting sensitive sources to unusual
    destinations?
  context: 'Building a dynamic graph (GNN-style) of normal actor-to-storage-account-to-destination relationships
    lets you score new or altered replication edges for anomaly. Under the Impact tactic, edges that connect
    sensitive sources to unusual destinations or coincide with other suspicious storage-management activity
    are the strongest indicators of adversary-driven copying. The model should surface the top-3 contributing
    features (destination novelty, breadth, actor history) in each alert so analysts can validate quickly.
    A high anomaly score is a strong lead; a low score reflects a relationship consistent with normal
    topology. References: [CS-GAD Dynamic GNN for Cloud Anomalies, Khatri et al](https://arxiv.org/abs/2409.12726);
    [GNN Based Adaptive Threat Detection for Cloud IAM Logs](https://arxiv.org/abs/2512.10280).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Storage accounts containing sensitive datasets, replication-capable blob containers, and subscriptions
    with cross-tenant connectivity'
  range: Last 90 days
  queries:
  - technology: ML/Graph-anomaly pseudocode
    query: "graph = build_graph(nodes=[actor, source_account, destination], edges=replication_events(90d))\n\
      model = DynamicGNN.train(graph)\nfor edge in new_or_modified_replication_edges(1d):\n    score =\
      \ model.anomaly_score(edge)\n    if score > threshold:\n        alert(edge, top_features=['destination_novelty','breadth','actor_history'])"
- question: When classified by actor history, source-destination relationship rarity, policy breadth,
    recently granted permissions, and adjacent identity/sign-in events, does a replication change appear
    to be adversary-driven copying rather than expected resiliency engineering?
  context: 'A supervised classifier trained with per-entity baselines can weigh actor history, source-destination
    rarity, policy breadth, recently granted permissions, and adjacent identity/sign-in events to separate
    legitimate resiliency engineering from adversary-driven replication. Under the Impact tactic this
    reduces analyst load by ranking the most likely malicious changes while handling label imbalance.
    Each alert must list the top-3 features driving the score. A high malicious probability with corroborating
    features warrants escalation; a low probability with strong benign signals can be deprioritized. References:
    [Hopper: Modeling and Detecting Lateral Movement, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf);
    [Deep Learning for Insider Threat Detection, Yuan and Wu](https://arxiv.org/pdf/2005.12433).'
  answer_sources:
  - AzureActivity
  - StorageBlobLogs
  - Entra Sign-in Logs
  - Entra Audit Logs
  - 'NAI: Storage accounts containing sensitive datasets, replication-capable blob containers, and subscriptions
    with cross-tenant connectivity'
  range: Last 90 days
  queries:
  - technology: ML/Classifier pseudocode
    query: "features = [actor_history, src_dst_rarity, policy_breadth, recent_perm_grants,\n         \
      \   adjacent_signin_events]\nmodel = GradientBoost.train(labeled_replication_changes, class_weight='balanced')\n\
      for change in replication_changes(1d):\n    p = model.predict_proba(featurize(change))\n    if p_malicious\
      \ > threshold:\n        alert(change, top_features=model.top_k(change,3))"
- question: Does the source storage account show statistically significant spikes in egress bytes (Volume)
    or in the number of distinct blobs touched per window (Frequency) versus its own history in StorageBlobLogs?
  context: 'Replication or attacker-driven bulk copying produces an abnormal volume and rate of blob reads/copies,
    observable in data-plane StorageBlobLogs as elevated CopyBlob/GetBlob bytes and object counts. Baseline
    per-account egress bytes and distinct-blob counts per window from request/response sizes and operation
    types, then alert on statistically significant spikes, weighting sensitive containers higher. This
    operationalizes Defender''s Exfiltration.AmountOfDataAnomaly and Exfiltration.NumberOfBlobsAnomaly
    detections under the Impact tactic. A positive result is a volume/frequency anomaly indicating data
    leaving the workload; a negative result is read activity within normal bounds. References: [Storage
    Analytics logging, Microsoft](https://learn.microsoft.com/en-us/azure/storage/common/storage-analytics-logging);
    [Alerts for Azure Storage, Microsoft Defender for Cloud](https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-azure-storage).'
  answer_sources:
  - StorageBlobLogs
  - AzureActivity
  - 'NAI: Source storage accounts containing sensitive datasets and replication-capable blob containers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "StorageBlobLogs\n| where OperationName in ('GetBlob','CopyBlob')\n| summarize egress_bytes=sum(ResponseBodySize),\
      \ distinct_blobs=dcount(Uri)\n    by AccountName, bin(TimeGenerated,1h)\n| extend sens = container_sensitivity_weight[AccountName]\n\
      | extend z_bytes = (egress_bytes - avg_bytes[AccountName])/stdev_bytes[AccountName]\n| extend z_blobs\
      \ = (distinct_blobs - avg_blobs[AccountName])/stdev_blobs[AccountName]\n| where (z_bytes > 3 or\
      \ z_blobs > 3) and sens >= 1\n| project TimeGenerated, AccountName, egress_bytes, distinct_blobs,\
      \ z_bytes, z_blobs"
- question: Is there an anomalous spike in 403/429 (authorization-failure or throttled) and other failure
    status codes during read/copy bursts on the source account?
  context: 'Automated mass replication frequently drives anomalous throttling or authorization-failure
    spikes that differ from normal interactive access, making the failure/throttle rate a distinct exfiltration
    signal. Profile the rate of 403, throttled-429, and other failure status codes during read/copy bursts
    in StorageBlobLogs. Under the Impact tactic, a surge of these codes alongside elevated read volume
    corroborates bulk copying. A positive result is a failure/throttle spike concurrent with read bursts;
    a negative result reflects normal low failure rates. References: [Storage Analytics logging, Microsoft](https://learn.microsoft.com/en-us/azure/storage/common/storage-analytics-logging);
    [Alerts for Azure Storage, Microsoft Defender for Cloud](https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-azure-storage).'
  answer_sources:
  - StorageBlobLogs
  - AzureActivity
  - 'NAI: Source storage accounts containing sensitive datasets and replication-capable blob containers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'StorageBlobLogs

      | where OperationName in (''GetBlob'',''CopyBlob'')

      | summarize total=count(), failures=countif(StatusCode in (403,429)) by AccountName, bin(TimeGenerated,5m)

      | extend fail_rate = todouble(failures)/total

      | where fail_rate > failrate_baseline_p95[AccountName] and total > read_burst_threshold

      | project TimeGenerated, AccountName, total, failures, fail_rate'
- question: When modeling normal per-principal data-access volume, shape, and sequence, does any principal
    retrieve far more data or more objects than its learned baseline, even when each individual request
    is valid?
  context: 'An ML model of normal per-principal data-access volume, shape, and sequence can score bulk
    read/copy behavior as anomalous when a principal retrieves far more data or objects than its learned
    baseline — catching exfiltration that hides in individually valid requests. Under the Impact tactic
    this is the data-plane complement to control-plane replication detection. The alert should surface
    contributing features (bytes, object count, container sensitivity). A high anomaly score indicates
    a principal exceeding its normal access envelope; a low score reflects access consistent with the
    principal''s baseline. References: [A Data-Centric Approach to Insider Attack Detection, Mathew et
    al](https://link.springer.com/chapter/10.1007/978-3-642-15512-3_20); [Deep Learning for Insider Threat
    Detection, Yuan and Wu](https://arxiv.org/pdf/2005.12433).'
  answer_sources:
  - StorageBlobLogs
  - AzureActivity
  - 'NAI: Source storage accounts containing sensitive datasets and replication-capable blob containers'
  range: Last 90 days
  queries:
  - technology: ML/Anomaly pseudocode
    query: "profiles = train_per_principal_access_model(StorageBlobLogs, lookback=90d,\n    features=['bytes','object_count','access_sequence','container_sensitivity'])\n\
      for principal, window in recent_access(1d):\n    score = profiles[principal].anomaly_score(window)\n\
      \    if score > threshold:\n        alert(principal, window, top_features=['bytes','object_count','container_sensitivity'])"
