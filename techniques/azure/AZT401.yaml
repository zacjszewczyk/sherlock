name: 'AZT401: Privileged Identity Management Role'
id: 6e5fc88d-338a-4524-9361-076f2a98707b
description: Investigate whether an adversary has escalated privileges in Azure/Entra ID by abusing Privileged
  Identity Management (PIM) - activating an eligible high-impact role, converting an eligible assignment
  into a permanent privileged assignment, or otherwise obtaining elevated permissions and then immediately
  using them. This playbook helps an analyst hunt for high-impact PIM activations (Global Administrator,
  Privileged Role Administrator, User Access Administrator, Owner, and equivalent roles), elevations that
  bypass approval/justification controls, bursts of failed or denied activation attempts that precede
  a success, and PIM activity that is statistically or behaviorally anomalous for the principal or its
  peer group. It correlates control-plane sequences (sign-in, MFA, PIM request/completion, role assignment
  writes, service-principal credential additions, federation/token-signing changes, and illicit OAuth
  grants) to distinguish legitimate just-in-time administration from privilege-escalation abuse.
type: technique
related:
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a principal who is eligible for a high-impact Entra ID or Azure RBAC role request or complete
    a PIM elevation - and did the same session then proceed (within roughly 15 minutes) into sensitive
    control-plane changes such as role assignment writes, service-principal credential additions, federation/token-signing
    changes, or illicit OAuth grants?
  context: This is the core privilege-escalation signal for AZT401. Detect PIM role operations in Entra
    AuditLogs ('Add member to role requested/completed', 'Add eligible member to role requested/completed',
    and 'Update role setting') that target Global Administrator, Privileged Role Administrator, User Access
    Administrator, Owner, or equivalent high-impact roles. The high-impact role list is a deterministic,
    non-negotiable floor and must not be removed; only tune the downstream-action correlation window per
    tenant. Raise severity when the same session quickly chains the activation into roleAssignments/write,
    credential additions on service principals, changes to federation or token-signing configuration,
    or OAuth consent grants - a sequence characteristic of an adversary cementing access after elevation.
    A positive result (activation of a sensitive role followed by tenant- or subscription-impacting change
    by the same actor) is a strong escalation indicator warranting immediate triage; a benign result is
    a routine just-in-time activation with no high-impact downstream action.
  answer_sources: &id001
  - AuditLogs
  - SigninLogs
  - AzureActivity
  - 'NAI: Entra ID role management events, PIM-eligible identities, and sessions capable of activating
    Global Administrator, Privileged Role Administrator, User Access Administrator, Owner, or similarly
    sensitive roles'
  range: Last 90 days; correlate downstream actions within ~15 minutes of the activation event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AuditLogs\n| where OperationName in ('Add member to role requested','Add member to role completed',\n\
      \    'Add eligible member to role requested','Add eligible member to role completed','Update role\
      \ setting')\n| where TargetRole in ('Global Administrator','Privileged Role Administrator',\n  \
      \  'User Access Administrator','Owner')  // non-negotiable high-impact floor\n| join kind=inner\
      \ (\n    union AuditLogs, AzureActivity\n    | where OperationName in ('roleAssignments/write','Add\
      \ service principal credentials',\n        'Set federation settings','Update token signing','Consent\
      \ to application')\n  ) on $left.SessionId == $right.SessionId\n| where Downstream.TimeGenerated\
      \ - Activation.TimeGenerated <= 15m\n| project Principal, TargetRole, Activation.TimeGenerated,\
      \ Downstream.OperationName, severity='high'"
- question: Did an elevation create a PERMANENT high-impact role assignment instead of a just-in-time
    eligible activation, or did an activation complete without the user's normal justification text, without
    a PIM approval/peer-approval record, or without a corresponding change ticket?
  context: PIM is designed for time-bound, just-in-time elevation with justification and (for sensitive
    roles) approval. An adversary who can manage PIM may instead create a permanent privileged assignment,
    skip the justification, or bypass the approval workflow. Alert when an elevation yields a permanent
    high-impact assignment rather than an eligible activation, or when an activation lacks justification
    text, has no approval/peer-approval record, or has no matching change ticket. Combine with session
    enrichments to flag rare source IP/geo and off-hours timing relative to the principal's normal maintenance
    window. Creating permanent eligibility for a role the principal rarely activates should be treated
    as a privilege-escalation precursor. A positive result indicates governance bypass and likely abuse;
    a negative result reflects a properly approved, justified, time-bound activation.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'AuditLogs

      | where OperationName has ''role'' and TargetRole in (HighImpactRoles)

      | extend isPermanent = (AssignmentType == ''Permanent'' or ExpiryTime == '''')

      | extend missingJustification = isempty(JustificationText)

      | extend missingApproval = isempty(ApprovalId) and isempty(PeerApprovalId)

      | extend missingTicket = isempty(ChangeTicketId)

      | where isPermanent or missingJustification or missingApproval or missingTicket

      | join kind=leftouter SigninLogs on SessionId

      | extend rareGeo = (Location !in (KnownAdminGeos)), offHours = (hourofday(TimeGenerated) !in (MaintenanceWindow))

      | project Principal, TargetRole, isPermanent, missingJustification, missingApproval, missingTicket,
      rareGeo, offHours'
- question: Were there bursts of failed or denied PIM activation requests, approval rejections, or MFA
    failures (per principal per hour) that immediately preceded a successful activation?
  context: 'This is an explicit failure-mode signal: the cloud analogue of credential probing or eligibility
    enumeration. Baseline and alert on bursts of failed/denied PIM activation requests, approval rejections,
    and MFA failures per principal per hour, and report explicitly when a success follows N failures.
    Derive the per-tenant burst threshold from the trailing 30-day 99th percentile of failed-activation
    counts so the rule adapts to each environment. A spike of failures followed by a success can indicate
    an actor brute-forcing approval/MFA, testing which roles they can activate, or persisting until controls
    are satisfied. A positive result (success-after-burst) is a high-value lead; a negative result is
    normal activation behavior with few or no preceding failures.'
  answer_sources: *id001
  range: Last 90 days; per-principal per-hour bucketing, baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "let thresh = toscalar(\n  AuditLogs | where Result in ('failure','denied') and OperationName\
      \ has 'role'\n  | summarize fails=count() by Principal, bin(TimeGenerated,1h)\n  | summarize percentile(fails,99));\n\
      AuditLogs | where OperationName has 'role'\n| summarize fails=countif(Result in ('failure','denied')),\n\
      \    mfaFails=countif(OperationName=='MFA' and Result=='failure'),\n    successes=countif(Result=='success')\n\
      \  by Principal, bin(TimeGenerated,1h)\n| where fails+mfaFails >= thresh and successes > 0  // success\
      \ after burst\n| project Principal, TimeGenerated, fails, mfaFails, successes"
- question: Is a given eligible principal's PIM activation behavior - downstream change volume per activation,
    activation frequency and hour-of-day, and success vs failed/denied/MFA outcomes - a statistical outlier
    relative to its own 30-day baseline AND its dynamic peer group?
  context: Baseline each eligible principal and its dynamic peer group over a trailing 30-day window across
    Volume (downstream RBAC/credential/object changes per activation), Frequency (activations per day
    and hour-of-day distribution), and State (succeeded vs failed/denied activations and MFA pass/fail).
    Score deviations with the robust modified Z-score (median + MAD, flag when |score| > ~3.5) so heavy-tailed
    administrator behavior does not mask genuine outliers, and combine independent per-feature profiles
    (target-role set, source-network tokens, hour structure, activation duration) as a multi-model aggregate.
    The alert must surface the top-3 contributing features (for example 'role rarely activated', 'new
    source ASN', 'post-activation change volume at the peer 99th percentile'). Validate thresholds and
    peer grouping against labeled insider scenarios. A positive result highlights a principal behaving
    unlike itself and its peers; a negative result is behavior within normal variance.
  answer_sources: *id001
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "AuditLogs | where OperationName has 'role'\n| summarize activations=count(), downstream=sum(DownstreamChanges),\n\
      \    fails=countif(Result!='success'), hour=make_list(hourofday(TimeGenerated))\n  by Principal,\
      \ bin(TimeGenerated,1d)\n| extend peer = PeerGroup(Principal)\n| extend med=percentile(downstream,50),\
      \ mad=mad(downstream)\n| extend modZ = 0.6745*(downstream-med)/mad\n| where abs(modZ) > 3.5\n| extend\
      \ topFeatures = rank_features(target_role, source_asn, hour_structure, duration)\n| project Principal,\
      \ peer, downstream, modZ, topFeatures"
- question: Is the ordered control-plane chain around the PIM activation (sign-in -> MFA -> PIM request
    -> PIM completion -> roleAssignments/write -> credential add) plausible for this principal, or does
    it contain low-probability transitions such as jumping straight from activation to tenant-wide control?
  context: Rather than scoring each event independently, model whether the ordered sequence of control-plane
    events is plausible for the principal using multi-order Markov transition probabilities. Learn the
    normal ordering and timing of sign-in, MFA, PIM request, PIM completion, role assignment writes, and
    credential additions, then flag low-probability transitions - for example a previously low-volume
    principal jumping directly from an activation to tenant-wide control changes. This captures escalation
    paths that look benign event-by-event but are improbable as a sequence. A positive result is an implausible
    escalation chain worth investigating; a negative result is a sequence consistent with the principal's
    historical control-plane patterns.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Build per-principal multi-order Markov model of control-plane event transitions\nAuditLogs,\
      \ SigninLogs, AzureActivity\n| sort by Principal, TimeGenerated asc\n| extend prev=prev(OperationName),\
      \ prev2=prev(OperationName,2)\n| summarize transProb = count() / countPrior(prev2,prev) by Principal,\
      \ prev2, prev, OperationName\n| where OperationName in ('roleAssignments/write','Add service principal\
      \ credentials')\n    and transProb < 0.01\n| project Principal, prev2, prev, OperationName, transProb"
- question: When per-principal PIM feature vectors (activation count, role sensitivity, source novelty,
    downstream-change breadth, fail/deny ratio, activation duration) are scored with an unsupervised Isolation
    Forest, which principals are flagged as anomalous?
  context: Use unsupervised Isolation Forest to provide a label-free, linear-time baseline of per-principal
    PIM behavior. Feature each principal with activation count, role sensitivity, source novelty, downstream-change
    breadth, fail/deny ratio, and activation duration, then isolate outliers. Expose the top-3 path-contributing
    features in each alert for explainability so analysts understand why a principal scored anomalously.
    This complements the deterministic rules by catching novel combinations of attributes no single threshold
    would flag. A positive result (a principal isolated quickly by the forest) warrants review of that
    principal's recent elevations; a negative result places the principal among the normal majority.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_principal(\n  activation_count, role_sensitivity, source_novelty,\n  downstream_change_breadth,\
      \ fail_deny_ratio, activation_duration)\nmodel = IsolationForest(n_estimators=200, contamination='auto')\n\
      scores = model.fit_predict(features)\nfor p in principals where scores[p] == anomaly:\n    emit(principal=p,\
      \ score=anomaly_score[p], top3=path_contributing_features(p))"
- question: When Entra/Azure IAM audit trails are modeled as heterogeneous dynamic graphs (user-role-session-action)
    and via tripartite user-service-activity graphs, do graph-based embeddings reveal contextually-malicious
    but statistically-benign escalation around a PIM activation?
  context: Model the Entra/Azure IAM audit trails as heterogeneous dynamic graphs linking users, roles,
    sessions, and actions, and learn attention-based GNN embeddings to flag escalations that are contextually
    malicious even when each individual event looks statistically benign. Correlate the activation with
    subsequent cross-service abuse using tripartite user-service-activity graphs, and build causal login/privilege-change
    paths so a session that elevates and then reaches resources atypical for the principal is flagged
    at very low alert volume. This approach surfaces relationship-level anomalies - unusual user-role-resource
    paths - that tabular methods miss. A positive result is an anomalous escalation path connecting an
    activation to atypical resource access; a negative result is a path consistent with the principal's
    normal IAM graph neighborhood.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_heterogeneous_graph(nodes=[user,role,session,action], edges=AuditLogs)\nemb = attention_GNN(G).node_embeddings()\n\
      tri = tripartite_graph(user, service, activity)  // CS-GAD style\npaths = causal_paths(login ->\
      \ privilege_change -> resource_access)  // Hopper style\nfor s in sessions:\n    if anomaly(emb[s])\
      \ and reaches_atypical_resource(paths[s]):\n        emit(session=s, principal, activation, atypical_resources)"
- question: Treating the Entra audit stream as a language and learning normal administrative key sequences
    with LSTM next-key prediction or masked-key BERT, are there low-probability activation-to-tenant-change
    sequences - especially a previously low-volume principal activating a sensitive role and immediately
    pivoting into subscription- or tenant-wide control?
  context: Treat the Entra audit stream as a language where each administrative operation is a token.
    Train an LSTM next-key prediction model (DeepLog style) or a masked-key BERT model (LogBERT style)
    to learn normal administrative key sequences, then flag low-probability activation-to-tenant-change
    sequences while surfacing the specific deviating log keys for triage. Prioritize sequences where a
    previously low-volume principal activates a sensitive role and immediately pivots into subscription-
    or tenant-wide control changes - the exact behavior expected of an adversary escalating via PIM. A
    positive result is an anomalous operation sequence with identifiable deviating keys; a negative result
    is a sequence the model predicts with high confidence as normal administration.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seqs = sessionize(AuditLogs.OperationName)  // ordered admin key sequences\nmodel = DeepLog_LSTM()\
      \ or LogBERT_masked_key()\nmodel.train(normal_admin_sequences)\nfor s in seqs:\n    p = model.predict_next(s)\n\
      \    if observed_key not in top_k(p):\n        emit(session=s, principal, deviating_keys=diff(observed,p),\n\
      \             flag_if = low_volume_principal and sensitive_role_then_tenant_change)"
