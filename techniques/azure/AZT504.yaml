name: 'AZT504: Watcher Tasks'
id: 146a68b2-531a-439a-b03b-14ab18dfa6fc
description: 'Investigate adversary use of Azure Automation watcher tasks for persistence. A watcher task
  paired with a Runbook lets an adversary automatically execute privileged automation whenever a monitored
  event occurs, regaining execution and re-establishing access even after remediation. Because the watcher
  object itself emits no Azure Activity log, this playbook reconstructs the loggable chain that surrounds
  it: runbook draft write, runbook publish, optional webhook creation, Automation account creation, job
  execution, and the downstream privileged identity actions a triggered job performs. It combines deterministic
  Azure Activity / AzureDiagnostics rules, statistical baselining of Automation cadence and job state,
  and behavioral/graph machine learning to surface event-driven persistence backdoors.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any principal write or publish an Azure Automation runbook that a watcher task could invoke,
    and was it created by an unexpected identity, IP, or geography?
  context: Watcher-backed persistence requires a runbook the watcher can launch. Deterministically flag
    Azure Activity operations Microsoft.Automation/automationAccounts/runbooks/write and .../runbooks/publish/action
    with status Succeeded, excluding the built-in AzureAutomationTutorial* runbooks. Record Caller, CallerIpAddress,
    principal type (interactive user vs ServicePrincipal/ManagedIdentity), and the AutomationAccount.
    Because the watcher object itself emits no Azure Activity log, the runbook write/publish is the earliest
    reliable signal for this Persistence behavior. A positive result is a runbook created or published
    by a principal with no prior Automation history, or from an unusual IP/geo, which raises severity
    and should drive pivots to webhook and job activity.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - 'NAI: Automation Accounts; runbook draft write/publish, webhook write, and Automation-account create
    operations in the Azure Activity log; AzureDiagnostics JobLogs/JobStreams (RunbookName_s, ResultType,
    JobId_g); and Automation jobs that launch immediately after monitored-resource activity then perform
    privileged operations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AzureActivity\n| where OperationNameValue in ('Microsoft.Automation/automationAccounts/runbooks/write',\n\
      \    'Microsoft.Automation/automationAccounts/runbooks/publish/action')\n| where ActivityStatusValue\
      \ == 'Success'\n| where RunbookName !startswith 'AzureAutomationTutorial'\n| project TimeGenerated,\
      \ Caller, CallerIpAddress, principalType=identity_type, AutomationAccount=Resource\n| join kind=leftanti\
      \ (prior_automation_callers) on Caller   // first-seen author => higher severity"
- question: Were any Automation webhooks or new Automation accounts created as persistence-setup precursors
    around the time of runbook activity?
  context: Adversaries often pair a runbook with an unauthenticated, Internet-reachable webhook trigger
    URL, or stand up an entirely new Automation account to host the persistence. Flag Microsoft.Automation/automationAccounts/webhooks/write
    and the rarer Microsoft.Automation/automationAccounts/write. Treat a new Automation account, a runbook
    publish, or a webhook creation performed by an unusual principal within a short time window as a single
    high-confidence Persistence setup chain. A webhook is significant because it provides an externally
    reachable trigger that does not require the watcher at all; a new account is significant because it
    isolates the adversary's tooling from monitored, well-understood accounts.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - 'NAI: Automation Accounts; runbook draft write/publish, webhook write, and Automation-account create
    operations in the Azure Activity log; AzureDiagnostics JobLogs/JobStreams (RunbookName_s, ResultType,
    JobId_g); and Automation jobs that launch immediately after monitored-resource activity then perform
    privileged operations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "AzureActivity\n| where OperationNameValue in ('Microsoft.Automation/automationAccounts/webhooks/write',\n\
      \    'Microsoft.Automation/automationAccounts/write')\n| where ActivityStatusValue == 'Success'\n\
      | summarize ops=make_set(OperationNameValue), t0=min(TimeGenerated), t1=max(TimeGenerated)\n   \
      \ by Caller, CallerIpAddress, bin(TimeGenerated, 1h)\n| where t1 - t0 <= 1h and array_length(ops)\
      \ >= 1\n// correlate same Caller with runbook publish in same window => high-confidence persistence\
      \ setup"
- question: Can the unlogged watcher trigger be reconstructed by correlating runbook publish/webhook writes
    with job execution that performs privileged downstream operations?
  context: Watcher creation produces no log, so detection must bridge the configuration leg to the execution
    leg. Correlate runbook publish / webhook write with Microsoft.Automation/automationAccounts/jobs/write
    and AzureDiagnostics JobLogs/JobStreams (RunbookName_s, ResultType, JobId_g). Alert when, within the
    same JobId, the runbook performs privileged operations such as role assignment, user creation, or
    VM run-command on an Automation account with no prior watcher/runbook job history. Use the documented
    watcher polling-interval model to separate benign periodic watch jobs from event-triggered action
    jobs. For the Persistence tactic, a job that fires immediately after monitored-resource activity and
    then escalates privilege is the clearest evidence of an event-driven backdoor.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - 'NAI: Automation Accounts; runbook draft write/publish, webhook write, and Automation-account create
    operations in the Azure Activity log; AzureDiagnostics JobLogs/JobStreams (RunbookName_s, ResultType,
    JobId_g); and Automation jobs that launch immediately after monitored-resource activity then perform
    privileged operations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let publishes = AzureActivity\n  | where OperationNameValue endswith 'runbooks/publish/action'\
      \ or OperationNameValue endswith 'webhooks/write';\nlet jobs = AzureActivity\n  | where OperationNameValue\
      \ == 'Microsoft.Automation/automationAccounts/jobs/write';\nAzureDiagnostics\n| where ResourceProvider\
      \ == 'MICROSOFT.AUTOMATION' and Category in ('JobLogs','JobStreams')\n| project JobId_g, RunbookName_s,\
      \ ResultType, TimeGenerated\n| join kind=inner jobs on $left.JobId_g == $right.JobId\n| join kind=inner\
      \ publishes on AutomationAccount\n// flag JobId whose runbook then performs role assignment / user\
      \ create / VM run-command\n// AND account has no prior runbook job history"
- question: Does any Automation account show a first-seen or statistically anomalous spike in runbook
    writes, job volume, target resources, or privileged identity destinations?
  context: Baseline each Automation account's runbook publication cadence, jobs/hour, target resources,
    and identity destinations. Apply a MAD-based modified Z-score (flag |Mi| > 3.5) to resist scheduled-automation
    skew, and add per-principal first-seen detection of Automation write operations. Flag watcher-linked
    jobs whose volume (jobs/hour, distinct target resources) or frequency exceeds the account's trailing
    95th percentile, whose privilege scope is new, or that start outside maintenance windows. Forecast
    expected job/runbook-write volume with seasonal time-series and alert on residuals. For Persistence,
    a sudden first-seen author or an off-baseline burst of privileged jobs marks the moment a dormant
    watcher persistence mechanism activated.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - 'NAI: Automation Accounts; runbook draft write/publish, webhook write, and Automation-account create
    operations in the Azure Activity log; AzureDiagnostics JobLogs/JobStreams (RunbookName_s, ResultType,
    JobId_g); and Automation jobs that launch immediately after monitored-resource activity then perform
    privileged operations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'AzureActivity

      | where OperationNameValue has ''Microsoft.Automation'' and OperationNameValue has_any (''write'',''jobs'')

      | make-series cnt=count() default=0 on TimeGenerated step 1h by AutomationAccount

      | extend med=series_median(cnt), mad=series_mad(cnt)

      | extend mZ = 0.6745 * (cnt - med) / mad

      | where mZ > 3.5            // MAD modified Z-score outlier

      // also: first-seen Caller per account, jobs/hour > trailing p95, new privilege scope, off-hours
      start'
- question: Do newly published runbooks exhibit anomalous job-state patterns such as high Failed/Suspended
    ratios, repeated retries, or off-hours Started events?
  context: Job state is a distinct behavioral signal. Profile AzureDiagnostics ResultType (Started/Completed/Failed/Suspended)
    and alert when a newly published runbook shows an anomalous Failed/Suspended ratio, repeated failed-then-retried
    jobs, or off-hours Started events versus the account baseline. Pair with Sentinel built-in volume/rare-operation
    anomalies. For Persistence, adversary-authored runbooks frequently fail or get suspended as the attacker
    iterates on the automation, and they tend to run at unusual hours, so abnormal state distributions
    on a fresh runbook are a meaningful tell distinct from raw volume.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - 'NAI: Automation Accounts; runbook draft write/publish, webhook write, and Automation-account create
    operations in the Azure Activity log; AzureDiagnostics JobLogs/JobStreams (RunbookName_s, ResultType,
    JobId_g); and Automation jobs that launch immediately after monitored-resource activity then perform
    privileged operations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "AzureDiagnostics\n| where ResourceProvider == 'MICROSOFT.AUTOMATION' and Category == 'JobLogs'\n\
      | summarize total=count(), failed=countif(ResultType in ('Failed','Suspended')),\n    offhours=countif(hourofday(TimeGenerated)\
      \ !between (7 .. 19) and ResultType=='Started')\n    by RunbookName_s, bin(TimeGenerated, 1d)\n\
      | extend fail_ratio = todouble(failed)/total\n| where (fail_ratio > baseline_fail_ratio) or offhours\
      \ > 0   // anomalous state on new runbook"
- question: Do behavioral or graph machine-learning models flag watcher/runbook/webhook/job activity as
    outside the normal behavior of the operator, service principal, or persistence subgraph?
  context: Run machine learning in parallel with the deterministic rules, never replacing them. Use Sentinel
    UEBA per-entity and peer-group baselining over AzureActivity/AuditLogs to score watcher/runbook operations
    performed outside an operator's or service principal's normal behavior, and complement with Defender
    for Cloud Apps anomaly policies (unusual administrative activity, impossible travel). Model the principal
    -> Automation-account -> runbook -> webhook -> job -> identity chain as a heterogeneous dynamic graph
    and score rare/anomalous subgraphs that behave like an event-driven persistence backdoor. Every model
    output must list its top-3 contributing features (e.g., first-seen runbook author, anomalous job cadence,
    new privileged downstream action) in the alert text. For Persistence, this catches stealthy reuse
    of legitimate identities and slow-burn persistence the threshold rules miss.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - AuditLogs
  - 'NAI: Automation Accounts; runbook draft write/publish, webhook write, and Automation-account create
    operations in the Azure Activity log; AzureDiagnostics JobLogs/JobStreams (RunbookName_s, ResultType,
    JobId_g); and Automation jobs that launch immediately after monitored-resource activity then perform
    privileged operations'
  range: Last 90 days
  queries:
  - technology: UEBA/Graph ML pseudocode
    query: '// 1. Sentinel UEBA: score Automation runbook/webhook/job ops vs per-entity & peer-group baseline

      // 2. Defender for Cloud Apps: unusual admin activity, impossible travel on Caller

      // 3. Build heterogeneous dynamic graph:

      //    principal -> automationAccount -> runbook -> webhook -> job -> identityAction

      // 4. Score rare/anomalous subgraphs ~ event-driven persistence backdoor

      // 5. Emit top-3 contributing features per alert; run alongside deterministic rules'
