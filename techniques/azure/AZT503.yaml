name: 'AZT503: HTTP Trigger'
id: 684dd8b7-5484-47b9-b4a0-3538d89642bb
description: Investigate adversary persistence in Azure achieved by adding or modifying HTTP-reachable
  triggers that execute privileged logic without normal interactive authentication. This playbook helps
  an analyst hunt for Logic Apps converted into remotely callable backdoors via HTTP triggers and listCallbackUrl
  retrieval, Function Apps with HTTP-triggered (especially anonymous authLevel) code that reuses the app's
  managed identity, Automation runbook webhooks that launch jobs under a RunAs/managed identity with no
  interactive auth, and App Service WebJobs deployed through Kudu/SCM for durable background execution.
  It correlates control-plane modification events with subsequent workflow/function/job runs and downstream
  workload-identity access to privileged or sensitive resources, and layers symbolic-logic detections,
  statistical baselining, and machine-learning behavioral models to separate covert persistence from routine
  automation.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Has any Logic App workflow been created or modified to introduce or alter an HTTP-triggered
    execution path, and does that change correlate with subsequent workflow runs and workload-identity
    access to privileged or sensitive data-plane resources?
  context: For the Persistence tactic, an adversary who converts a Logic App into an HTTP-triggered workflow
    leaves behind a remotely callable backdoor that runs privileged actions without the original operator
    signing in interactively again. Look for Microsoft.Logic/workflows/write, Microsoft.Logic/workflows/triggers/listCallbackUrl/action,
    or Microsoft.Web/connections/write events that add or change HTTP/Request triggers, then pivot to
    the workflow runs and managed-identity/service-principal sign-ins that follow. Escalate when the workflow
    is internet-reachable and was modified by an operator who does not normally touch it. A positive result
    is a control-plane edit that introduces an HTTP trigger followed by privileged downstream activity;
    a negative result is a change traceable to an approved deployment by an expected operator with no
    anomalous downstream access.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic Apps with HTTP triggers, callback URL retrieval activity, privileged connectors, and workflow
    runs that touch administrative or sensitive data-plane resources'
  range: Last 90 days, correlating each workflow edit with runs and identity activity in the following
    24 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM AzureActivity WHERE OperationName IN [Microsoft.Logic/workflows/write, Microsoft.Logic/workflows/triggers/listCallbackUrl/action,
      Microsoft.Web/connections/write]; JOIN AzureDiagnostics workflow_runs AND (AADManagedIdentitySignInLogs
      OR AADServicePrincipalSignInLogs) ON workflow_resource, identity, time_window<=24h; ALERT when trigger_type='Request'/HTTP
      AND internet_reachable=true AND operator NOT IN usual_operators; OUTPUT workflow, operator, run_ids,
      privileged_resources_touched.
- question: Was a Logic App callback URL retrieved via listCallbackUrl and then immediately followed by
    a workflow run from external infrastructure or by managed-identity access to sensitive resources?
  context: 'Within Persistence, the SAS-signed callback URL returned by listCallbackUrl is effectively
    a credential: retrieving it is the key control-plane signal that an actor is preparing to invoke the
    backdoor trigger path. Flag listCallbackUrl operations that are quickly followed by a run originating
    from external/cloud-hosted infrastructure or by prompt managed-identity access to privileged data.
    Treat the pairing of callback retrieval plus prompt execution as concrete evidence the actor is validating
    and using the trigger. A first-seen privileged operation for that identity after callback retrieval
    strengthens the finding; routine retrievals by an established pipeline that never lead to anomalous
    runs are negative.'
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic Apps with HTTP triggers, callback URL retrieval activity, privileged connectors, and workflow
    runs that touch administrative or sensitive data-plane resources'
  range: Last 90 days, with a 1-hour correlation window from callback retrieval to first run.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: FROM AzureActivity WHERE OperationName='Microsoft.Logic/workflows/triggers/listCallbackUrl/action';
      JOIN AzureDiagnostics runs AND identity_signins ON workflow, time_window<=1h; ALERT when next_run.source
      IN external_or_cloud_hosted OR managed_identity_access first_seen_privileged_op=true; OUTPUT workflow,
      callback_retriever, run_source, resources.
- question: Does any Logic App show a statistically anomalous change in its trigger model, callback-retrieval
    frequency, run volume, or privileged-connector usage compared with its own established baseline?
  context: For Persistence, a workflow quietly repurposed into a backdoor often drifts from its historical
    behavior. Baseline each Logic App's trigger types, hourly callback-retrieval frequency, run volume,
    and privileged connector usage, then flag workflows whose post-change runs or identity activity exceed
    the 95th percentile using seasonal forecasting and residual analysis. For sparse callback-retrieval
    counts apply the robust median/MAD modified z-score (|Mz|>3.5). Treat bursts of failed runs (HTTP
    4xx/5xx on the trigger) as a distinct backdoor-validation signal. A positive result is a workflow
    whose trigger model and run/identity behavior break baseline after an edit; expected seasonal growth
    that stays within bounds is negative.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic Apps with HTTP triggers, callback URL retrieval activity, privileged connectors, and workflow
    runs that touch administrative or sensitive data-plane resources'
  range: Last 90 days, with 30-day per-workflow seasonal baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per workflow over 30d for [trigger_types, callback_retrievals_per_hour, run_volume,
      privileged_connector_use]; FORECAST seasonal; ALERT when residual>p95 OR modified_z(callback_counts)>3.5
      OR failed_run_rate(4xx/5xx) spikes; OUTPUT workflow, metric, baseline, observed.
- question: Does a behavioral model over workflow edits, callback operations, run history, and downstream
    identity usage flag any Logic App as a covert HTTP backdoor, and what are the top contributing features?
  context: Under Persistence, no single signal may be decisive, but the ordered sequence of edit -> callback
    retrieval -> run -> downstream identity usage can reveal a workflow converted into an operator-driven
    backdoor. Use sequence features and rare-source/rare-operation patterns to score deviations from the
    workflow's established business process, modeling identity-to-resource topology change with a graph
    approach. Surface the top-3 contributing features in alert text so analysts can validate quickly.
    A positive result is a high-scoring sequence whose features show rare operations and identity-graph
    deviation; a negative result is behavior consistent with the workflow's known business logic.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Logic Apps with HTTP triggers, callback URL retrieval activity, privileged connectors, and workflow
    runs that touch administrative or sensitive data-plane resources'
  range: Last 90 days for training features, with live scoring of recent workflow activity.
  queries:
  - technology: ML pipeline pseudocode
    query: features = sequence(edit_ops, callback_ops, run_history, downstream_identity_targets, source_rarity);
      score = workflow_persistence_model.predict_proba(features); ALERT when score>=0.85 OR identity_graph_delta
      high; OUTPUT top_shap_3, workflow, sequence.
- question: Has a Function App been modified to add or change HTTP-triggered code (site/function writes,
    host-key changes, run.csx updates), and does the new function invoke privileged services or sign in
    with the app's identity in ways it did not before?
  context: For Persistence, an HTTP-triggered function gives an adversary a durable remote execution path
    that reuses the app's managed identity without re-establishing the original foothold. Detect Microsoft.Web/sites/write,
    Microsoft.Web/sites/functions/write, host-key changes, or run.csx updates that introduce HTTP triggers,
    then correlate with unusual Function App executions and identity sign-ins to privileged services.
    Raise severity when the new function is authLevel:anonymous (internet-callable without a key) or begins
    calling management APIs not previously used. A positive result is anonymous/HTTP code plus first-seen
    privileged API calls under the app identity; a benign CI/CD deploy with no new privileged behavior
    is negative.
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with HTTP triggers, code deployment events, execution logs, and downstream identity
    sign-ins or control-plane actions performed by the app after modification'
  range: Last 90 days, correlating each deployment with executions and identity activity in the following
    24 hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM AzureActivity WHERE OperationName IN [Microsoft.Web/sites/write, Microsoft.Web/sites/functions/write,
      host_key_change]; JOIN FunctionAppLogs executions AND (AADManagedIdentitySignInLogs OR AADServicePrincipalSignInLogs);
      ALERT when authLevel='anonymous' OR new_management_api_called=true; OUTPUT app, function, authLevel,
      callers, privileged_apis.
- question: Are there short bursts of first-time HTTP invocations against a function, especially from
    external or cloud-hosted infrastructure, immediately after a function deployment?
  context: 'Within Persistence, an operator typically validates a freshly planted backdoor by calling
    it shortly after deployment. Flag short bursts of first-time HTTP invocations right after a function
    deployment, particularly from external/cloud-hosted sources, and treat deployment plus validation
    calls plus privileged downstream access as concrete backdoor establishment evidence. Anonymous-vs-keyed
    exposure semantics matter: anonymous functions are callable without a key and are higher risk. A positive
    result is a deploy-then-call-then-privileged-access chain from unfamiliar infrastructure; routine
    warm-up calls from the deployment pipeline are negative.'
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with HTTP triggers, code deployment events, execution logs, and downstream identity
    sign-ins or control-plane actions performed by the app after modification'
  range: Last 90 days, with a 1-hour post-deployment validation window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN deployment_events TO FunctionAppLogs http_invocations ON app, time_window<=1h; ALERT when
      first_seen_caller AND source IN external_or_cloud_hosted AND followed_by privileged_identity_access;
      OUTPUT app, function, caller_ips, invocation_count, downstream_access.
- question: Does any Function App show post-change HTTP invocation counts, status-code distributions,
    or downstream identity destinations that statistically exceed its normal baseline or originate from
    rare sources?
  context: For Persistence, a backdoored function often diverges from its normal execution profile. Baseline
    function update cadence, HTTP invocation counts (volume), status-code distribution (state), and downstream
    identity destinations, then flag apps whose post-change remote executions or management calls exceed
    the 95th percentile or appear from rare source patterns using seasonal/residual modeling, with the
    robust modified z-score for sparse counts. Profile a rising 401/403/404 invocation rate as a distinct
    probing/validation signal. A positive result is invocation or management-call volume breaking baseline
    alongside rare sources or rising auth-failure rates; expected seasonal load is negative.
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with HTTP triggers, code deployment events, execution logs, and downstream identity
    sign-ins or control-plane actions performed by the app after modification'
  range: Last 90 days, with 30-day per-app seasonal baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per app over 30d for [update_cadence, http_invocations, status_code_dist, identity_destinations];
      ALERT when post_change_volume>p95 OR modified_z(sparse_counts)>3.5 OR rate(401/403/404) rising OR
      source_rarity high; OUTPUT app, metric, baseline, observed.
- question: Does an explainable model over Function App deployments and executions classify any app as
    having shifted from business logic to operator-driven persistence, and what are the top contributing
    features?
  context: Under Persistence, the combination of trigger type, code-change timing, caller distribution,
    identity targets, and API-sequence features can distinguish a normal app from one repurposed as a
    backdoor. Train an explainable anomaly model on these features and prioritize apps whose behavior
    shifts from business logic toward operator-driven persistence, using temporal-graph detection to catch
    early identity/resource topology changes. Surface the top-3 contributing features in alerts. A positive
    result is a high anomaly score driven by rare callers, new identity targets, and unusual API sequences;
    behavior matching the app's known business function is negative.
  answer_sources:
  - AzureActivity
  - FunctionAppLogs
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Function Apps with HTTP triggers, code deployment events, execution logs, and downstream identity
    sign-ins or control-plane actions performed by the app after modification'
  range: Last 90 days for training features, with live scoring of recent deployments and executions.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [trigger_type, code_change_timing, caller_distribution, identity_targets, api_sequence];
      score = serverless_backdoor_model.predict_proba(features); ALERT when score>=0.85 OR temporal_graph_anomaly
      high; OUTPUT top_shap_3, app, behavior_shift.
- question: Has a webhook been created on an Automation Account, and do subsequent runbook job executions
    use the runbook identity to perform privileged Azure control-plane or sensitive data actions?
  context: For Persistence, an Automation runbook webhook is a secret URL that launches a job under the
    RunAs/managed identity with no interactive auth, letting anyone with the URL recreate access on demand.
    Detect Microsoft.Automation/automationAccounts/webhooks/write events and correlate them with subsequent
    job executions and privileged API use by the runbook identity. Escalate when the webhook is added
    to an account that previously had no external trigger path. A positive result is webhook creation
    followed by privileged jobs under the runbook identity; a webhook tied to an approved, documented
    automation change is negative.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Automation Accounts, webhook creation events, webhook-triggered runbook jobs, and identities
    used by the runbook to reach Azure control plane or sensitive data services'
  range: Last 90 days, correlating webhook creation with jobs and identity activity in the following 24
    hours.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM AzureActivity WHERE OperationName='Microsoft.Automation/automationAccounts/webhooks/write';
      JOIN AzureDiagnostics runbook_jobs AND (AADManagedIdentitySignInLogs OR AADServicePrincipalSignInLogs);
      ALERT when account_had_no_prior_external_trigger AND job_uses_privileged_api; OUTPUT account, webhook,
      creator, job_ids, privileged_resources.
- question: Are webhook-triggered runbook jobs executing at unusual times, after-hours, or in repeated
    short bursts that do not align with the Automation Account's established schedule, while performing
    privileged downstream actions?
  context: 'Within Persistence, repeated unauthenticated reuse of a runbook webhook with privileged downstream
    actions indicates durable persistence. Flag webhook-triggered jobs whose timing is after-hours, off-schedule,
    or bursty relative to the account''s known automation cadence, and correlate to first-seen privileged
    operations for the runbook identity. The execution model is key: the webhook runs the job with no
    interactive auth. A positive result is off-schedule/bursty webhook jobs hitting privileged resources
    for the first time; jobs matching the documented schedule and scope are negative.'
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Automation Accounts, webhook creation events, webhook-triggered runbook jobs, and identities
    used by the runbook to reach Azure control plane or sensitive data services'
  range: Last 90 days, comparing job timing against the account's 30-day schedule baseline.
  queries:
  - technology: SIEM/Sequence pseudocode
    query: FROM AzureDiagnostics webhook_triggered_jobs; baseline account schedule over 30d; ALERT when
      job_time after_hours OR off_schedule OR burst_count>=N AND downstream first_seen_privileged_op=true;
      OUTPUT account, runbook, job_times, resources.
- question: Does any Automation Account show webhook creation frequency, webhook-driven job timing, identity
    targets, or failed/suspended job rates that statistically deviate from its baseline?
  context: For Persistence, covert webhook abuse often appears as new or rare webhook-driven activity.
    Baseline webhook creation frequency, job launch timing, identity targets, and runbook privilege scope
    per Automation Account, then flag accounts where webhook-driven jobs start appearing unexpectedly
    or execute against rare administrative targets using seasonal/residual baselining and the robust modified
    z-score for sparse job counts. Track the failed/suspended job rate (state) from JobStreams as a distinct
    anomaly signal. A positive result is webhook jobs appearing where none existed or hitting rare admin
    targets; expected scheduled automation is negative.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Automation Accounts, webhook creation events, webhook-triggered runbook jobs, and identities
    used by the runbook to reach Azure control plane or sensitive data services'
  range: Last 90 days, with 30-day per-account baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per account over 30d for [webhook_creations, job_launch_timing, identity_targets,
      privilege_scope]; ALERT when webhook_jobs first_appear OR rare_admin_target OR modified_z(job_counts)>3.5
      OR failed_suspended_rate>p95; OUTPUT account, metric, baseline, observed.
- question: Does a behavioral model over webhook, job, and downstream identity telemetry separate routine
    operations automation from covert persistent execution, and which features drive the score?
  context: Under Persistence, distinguishing legitimate operations automation from a planted webhook backdoor
    benefits from a model over webhook, job, and downstream identity telemetry. Prioritize webhooks whose
    jobs repeatedly access sensitive resources in patterns inconsistent with established baselines, using
    behavioral scoring and identity-graph deviation. Surface the top-3 contributing features. A positive
    result is a high-scoring webhook whose jobs repeatedly reach sensitive resources off-pattern with
    identity-graph deviation; routine maintenance automation is negative.
  answer_sources:
  - AzureActivity
  - AzureDiagnostics
  - AADManagedIdentitySignInLogs
  - AADServicePrincipalSignInLogs
  - 'NAI: Automation Accounts, webhook creation events, webhook-triggered runbook jobs, and identities
    used by the runbook to reach Azure control plane or sensitive data services'
  range: Last 90 days for training features, with live scoring of recent webhook jobs.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [webhook_attributes, job_targets, downstream_identity_usage, resource_sensitivity,
      source_rarity]; score = webhook_abuse_model.predict_proba(features); ALERT when score>=0.85 OR identity_graph_delta
      high; OUTPUT top_shap_3, account, webhook, pattern.
- question: Have App Service writes associated with WebJob creation or update occurred, and do WebJob
    output or application logs show newly scheduled or on-demand tasks launching scripts, binaries, or
    administrative actions?
  context: For Persistence, a WebJob deployed on an App Service provides durable scheduled or background
    execution that survives interactive-session cleanup. Detect App Service writes tied to WebJob creation/update,
    then inspect WebJob output and application logs for newly scheduled or on-demand tasks that run scripts,
    binaries, or administrative actions. Escalate when the WebJob appears on an app that historically
    did not use background jobs. A positive result is a new WebJob on a previously job-free app running
    scripts or admin actions; a documented background task from an approved release is negative.
  answer_sources:
  - AzureActivity
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - 'NAI: App Services hosting WebJobs, Kudu and SCM activity, WebJob output logs, and application logs
    that reveal newly scheduled or manually triggered background tasks'
  range: Last 90 days, reviewing WebJob output for the period after each App Service write.
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM AzureActivity WHERE OperationName ~ App_Service_write AND resource ~ webjob; JOIN AzureDiagnostics
      AND AppServiceHTTPLogs; INSPECT webjob_output FOR script/binary/admin tasks; ALERT when app_had_no_prior_background_jobs;
      OUTPUT app, webjob, task_cmd, operator.
- question: Were any WebJobs deployed through SCM or Kudu activity and then executed soon afterward with
    no corresponding release artifact or approved deployment record?
  context: Within Persistence, deployment through Kudu/SCM followed by immediate execution and administrative
    behavior is strong evidence of WebJob-based persistence outside normal release pipelines. Flag WebJobs
    deployed via SCM/Kudu activity that execute shortly afterward with no matching release artifact or
    approved deployment record, and use a first-seen-operation baseline to confirm novelty. A positive
    result is a Kudu-deployed WebJob executing immediately with no release record and admin-like behavior;
    a deployment tied to a known release artifact is negative.
  answer_sources:
  - AzureActivity
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - 'NAI: App Services hosting WebJobs, Kudu and SCM activity, WebJob output logs, and application logs
    that reveal newly scheduled or manually triggered background tasks'
  range: Last 90 days, with a short Kudu-deploy-to-execution correlation window.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: FROM AppServiceHTTPLogs WHERE endpoint ~ scm_or_kudu AND method IN [PUT,POST]; JOIN AzureDiagnostics
      webjob_executions ON app, time_window<=1h; ALERT when no_release_artifact AND first_seen_operation
      AND admin_behavior; OUTPUT app, webjob, deploy_source, exec_time.
- question: Does any App Service show WebJob creation frequency, execution interval, runtime duration,
    or Kudu/SCM error rates that statistically exceed historical behavior?
  context: For Persistence, hidden WebJob persistence often deviates from an app's normal background-job
    profile. Baseline WebJob creation frequency, execution interval, runtime duration (volume), and originating
    operator per App Service, then flag new or modified jobs whose cadence, runtime, or output volume
    exceeds the 95th percentile using seasonal/residual modeling with the robust modified z-score for
    sparse counts. Profile AppServiceHTTPLogs error rates (4xx/5xx) on Kudu/SCM endpoints as a distinct
    probing signal. A positive result is WebJob cadence/runtime breaking baseline or rising Kudu error
    rates; expected scheduled maintenance is negative.
  answer_sources:
  - AzureActivity
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - 'NAI: App Services hosting WebJobs, Kudu and SCM activity, WebJob output logs, and application logs
    that reveal newly scheduled or manually triggered background tasks'
  range: Last 90 days, with 30-day per-app baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline per app over 30d for [webjob_creations, execution_interval, runtime_duration, operator];
      ALERT when cadence/runtime/output>p95 OR modified_z(sparse_counts)>3.5 OR rate(4xx/5xx on scm/kudu)
      rising; OUTPUT app, webjob, metric, baseline, observed.
- question: Does an explainable model over WebJob deployment and execution flag any job as hidden persistence
    rather than normal operational maintenance, and which features drive the score?
  context: Under Persistence, schedule regularity, log-content features, deployment timing, and associated
    app changes together can distinguish covert WebJob persistence from routine maintenance. Model these
    features with explainable anomaly scoring and early temporal-graph detection, prioritizing jobs whose
    profile matches hidden persistence. Surface the top-3 contributing features. A positive result is
    a high-scoring WebJob whose profile (timing, log content, app-change correlation) resembles persistence
    rather than maintenance; jobs matching documented operational patterns are negative.
  answer_sources:
  - AzureActivity
  - AppServiceHTTPLogs
  - AzureDiagnostics
  - 'NAI: App Services hosting WebJobs, Kudu and SCM activity, WebJob output logs, and application logs
    that reveal newly scheduled or manually triggered background tasks'
  range: Last 90 days for training features, with live scoring of recent WebJob deployments and runs.
  queries:
  - technology: ML pipeline pseudocode
    query: features = [schedule_regularity, log_content_features, deployment_timing, associated_app_changes];
      score = webjob_anomaly_model.predict_proba(features); ALERT when score>=0.85 OR temporal_graph_anomaly
      high; OUTPUT top_shap_3, app, webjob, profile.
