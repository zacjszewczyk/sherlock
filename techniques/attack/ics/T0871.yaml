name: 'T0871: Execution through API'
id: 330677ea-b41d-4707-9648-e35ca207e852
description: Investigate potential adversary abuse of native ICS Application Program Interfaces (APIs)
  used for communication between control software and field hardware (PLCs, RTUs, IEDs). This playbook
  helps an analyst hunt for unauthorized execution on control devices by (1) detecting connections to
  ICS protocol ports (Modbus/502, DNP3/20000, S7/102) from source IPs not on an asset-specific allowlist
  and profiling blocked/denied attempts; (2) identifying use of high-risk, write-capable ICS function
  codes (Modbus write coils/registers, S7comm PLC Stop/Program Download, DNP3 Control Operate), exception/error
  responses, and slow stealthy function-code abuse; and (3) spotting compromised-but-authorized HMI/EWS-to-PLC
  pairs that exhibit anomalous volume, timing, or sequencing of API calls. It layers deterministic specification/allow-listing
  logic, statistical baselining, and explainable machine-learning anomaly detection across enterprise/PCN
  segmentation boundaries and intra-PCN control links.
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is any connection reaching an ICS protocol port (Modbus/502, DNP3/20000, S7/102) on a control
    device (PLC, RTU, IED) from a source IP that is NOT on the asset-specific allowlist of authorized
    engineering workstations or HMIs for that exact destination device and port?
  context: 'Execution through API depends on reaching the device''s command interface. By maintaining
    a per-asset allowlist mapping each destination control-device IP and its ICS port to the specific
    EWs/HMIs permitted to talk to it (per Purdue-level segmentation and port allow-listing in NIST SP
    800-82r3), any connection from an unlisted source is out-of-spec and warrants investigation. Codify
    expected source/destination/function-code semantics as explicit allow/deny specifications so unauthorized
    flows alert without requiring labeled training data. When a violation fires, correlate the source
    IP and timestamp with Windows Event ID 5156 (WFP connection permitted) and 4688 (process creation)
    on the originating host to name the actual process driving the ICS API call. A positive result (unlisted
    source talking to a PLC port) is strong evidence of unauthorized execution attempts; a negative result
    narrows the hunt to authorized hosts that may themselves be compromised. Source references: [Guide
    to Operational Technology (OT) Security, NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [On Specification-based Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Network ingress/egress points between the Enterprise Network (Level 4/5) and Process Control
    Network (Level 3), and network segments within the PCN containing Engineering Workstations (EWs),
    Human-Machine Interfaces (HMIs), and critical control devices (PLCs, RTUs).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log\n  | where id.resp_p in (502, 20000, 102)\n  | lookup allowlist on id.resp_h,\
      \ id.resp_p -> allowed_src[]\n  | where id.orig_h not in allowed_src\n  | emit alert(src=id.orig_h,\
      \ dst=id.resp_h, port=id.resp_p, ts)"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  join Zeek_alert with WinEvent(5156,4688) on src_ip=Computer, near(ts, +/-2m)\n  | project\
      \ src_ip, dst_ip, dst_port, NewProcessName, CommandLine\n  | output 'unauthorized ICS API source\
      \ -> process'"
- question: Is a single source IP generating an abnormal number of blocked or denied connection attempts
    toward control-device ICS ports (firewall denies, Windows Event ID 5157), suggesting reconnaissance
    or repeated unauthorized API access attempts?
  context: 'Failure state is itself a signal. Adversaries probing for reachable control interfaces frequently
    trip firewall and host-based filtering rules before they succeed. Treating denies as a distinct telemetry
    stream, count blocked/rejected attempts to control-device ICS ports per source IP in a rolling 10-minute
    window and alert when one source exceeds a tuned threshold (e.g., >=5) or when blocked attempts to
    a device exceed that device''s historical daily maximum. A spike of denies from one host toward PLC
    ports is a hallmark of scanning or brute-forced access ahead of Execution through API; per NIST SP
    800-82r3, this maps directly to unauthorized OT access attempts. Tune thresholds per environment to
    avoid alerting on benign mis-configured clients. Source references: [Guide to Operational Technology
    (OT) Security, NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Network ingress/egress points between the Enterprise Network (Level 4/5) and Process Control
    Network (Level 3), and network segments within the PCN containing Engineering Workstations (EWs),
    Human-Machine Interfaces (HMIs), and critical control devices (PLCs, RTUs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  (FirewallDeny OR WinEvent==5157)\n  | where dst_port in (502,20000,102)\n  | bin span=10m\
      \ by src_ip\n  | count as denies\n  | where denies >= 5 OR denies > daily_max_baseline(dst_ip)\n\
      \  | alert"
- question: For each control device, does the number of unique source IPs connecting in any one hour exceed
    that specific device's 30-day rolling 99th-percentile baseline, indicating a scan or the appearance
    of unauthorized devices?
  context: 'Legitimate control devices typically talk to a small, stable set of EWs/HMIs. A sudden rise
    in the count of distinct sources connecting to a device within an hour suggests scanning, lateral
    movement, or newly-introduced unauthorized hosts attempting API access. Build a per-device 30-day
    rolling baseline of unique source IPs per hour from Zeek conn.log and alert when the hourly unique-source
    count exceeds the 99th percentile for that device. Include the actual source-IP list in the alert
    so the analyst can triage immediately. Simple deterministic percentile baselines often match complex
    ML models for industrial IDS, so this is a high-value, low-overhead detector. A positive result points
    to scanning or rogue devices; a negative keeps the device within its normal communication footprint.
    Source references: [A False Sense of Security? Revisiting ML-Based Industrial Intrusion Detection](https://arxiv.org/abs/2205.09199).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Network ingress/egress points between the Enterprise Network (Level 4/5) and Process Control
    Network (Level 3), and network segments within the PCN containing Engineering Workstations (EWs),
    Human-Machine Interfaces (HMIs), and critical control devices (PLCs, RTUs).'
  range: Last 90 days; baseline 30 days, evaluate hourly
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn.log\n  | bin span=1h by id.resp_h\n  | dc(id.orig_h) as uniq_src, values(id.orig_h)\
      \ as src_list\n  | join p99_baseline_per_device(id.resp_h, lookback=30d)\n  | where uniq_src > p99\n\
      \  | alert(device=id.resp_h, uniq_src, src_list)"
- question: Do any control-network flows appear anomalous under an unsupervised model (Isolation Forest)
    or supervised model (Random Forest where labeled attack/DoS data exists) trained on historical Zeek
    conn.log features, especially flows to known ICS ports and critical devices?
  context: 'Some unauthorized API execution will not violate a static allowlist or simple count threshold
    but will still look statistically unusual in its combination of features. Train an Isolation Forest
    (or Random Forest with labels) on historical conn.log features — source/destination IP, destination
    port, protocol, duration, total bytes, packet counts — and flag outliers for review, prioritizing
    known ICS ports and critical assets. Surface the top-3 contributing features (e.g., destination port,
    byte ratio, source rarity) via feature attribution so the analyst understands WHY a flow was flagged.
    Because ML-based ICS IDS are evadable by adversarial manipulation, run this in PARALLEL with the deterministic
    allowlist rather than as a replacement. A positive (high anomaly score on a critical-device flow)
    merits manual review against the allowlist and host process context. Source references: [Anomaly-based
    Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374);
    [Adversarial Attacks on Time-Series Intrusion Detection for Industrial Control Systems](https://arxiv.org/abs/1911.04278).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Network ingress/egress points between the Enterprise Network (Level 4/5) and Process Control
    Network (Level 3), and network segments within the PCN containing Engineering Workstations (EWs),
    Human-Machine Interfaces (HMIs), and critical control devices (PLCs, RTUs).'
  range: Last 90 days; train on >=60 days history
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = conn.log[orig_h, resp_h, resp_p, proto, duration, orig_bytes, resp_bytes,\
      \ orig_pkts, resp_pkts]\n  model = IsolationForest.fit(history)  # or RandomForest if labeled\n\
      \  score = model.decision_function(live)\n  | where score < anomaly_threshold AND resp_p in (502,20000,102)\n\
      \  | attribute top3_features\n  | alert"
- question: Is any high-risk, write-capable ICS function code (Modbus FC 5/6/15/16, S7comm Stop/Start/Program
    Download, DNP3 Control Operate) observed on the wire, particularly from an unauthorized source or
    outside a scheduled maintenance window?
  context: 'Execution through API is most damaging when it changes device state. Define a list of critical
    write-capable function codes and generate a high-severity alert whenever they appear in Zeek modbus.log/s7comm.log/dnp3.log,
    enriching with source/destination asset identity and cross-referencing a maintenance-schedule calendar
    to suppress authorized work. Auto-generate the rule set from protocol semantics (valid function codes,
    request/response pairing, addressing, value ranges) for robust deterministic coverage. A write command
    from a non-EWS source, or any write outside a planned window, is a direct indicator of unauthorized
    control manipulation. This is one of the highest-fidelity detectors for this technique because these
    function codes are inherently dangerous and infrequent in normal read-heavy monitoring traffic. Source
    references: [Distributed Intrusion Detection System using Semantic-based Rules for SCADA in Smart
    Grid](https://arxiv.org/abs/2412.07917).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: Network taps or SPAN ports deployed at critical choke points within the Process Control Network
    (Level 2), such as in front of safety PLCs, between HMI/EWS and control devices, and on links to Historian
    servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  (modbus.log func in (5,6,15,16)) OR (s7comm.log func in ['PLC_STOP','PLC_START','DOWNLOAD'])\n\
      \    OR (dnp3.log func == 'CONTROL_OPERATE')\n  | enrich src/dst asset\n  | where src not in authorized_EWS\
      \ OR ts not in maintenance_window\n  | alert severity=high"
- question: Is a source-destination pair producing a burst of ICS protocol exception/error responses (Modbus
    exceptions, S7comm error codes, DNP3 IIN error bits), or any error in response to a write request,
    indicating malformed/unauthorized API calls or function fuzzing?
  context: 'Failure-mode telemetry exposes adversaries who do not yet know the device''s valid addresses,
    value ranges, or function semantics. Parse exception/error indicators from Zeek protocol logs and
    alert when a source-destination pair generates a burst (e.g., >=3 in 1 minute, tuned per asset) or
    when any error is returned to a write request. A cluster of exceptions often means the adversary is
    probing or fuzzing device functions ahead of a successful unauthorized API call. Legitimate, well-formed
    HMI/EWS traffic rarely produces sustained protocol errors, so this is a sensitive early indicator
    of reconnaissance or clumsy unauthorized execution attempts. Source references: [On Specification-based
    Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: Network taps or SPAN ports deployed at critical choke points within the Process Control Network
    (Level 2), such as in front of safety PLCs, between HMI/EWS and control devices, and on links to Historian
    servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  protocol_logs(modbus,s7comm,dnp3)\n  | where exception != none OR s7_error != none OR\
      \ dnp3_iin_error == true\n  | bin span=1m by orig_h, resp_h\n  | count as errs\n  | where errs >=\
      \ 3 OR (is_write_request AND error)\n  | alert"
- question: For each source-destination asset pair, has the function-code distribution become abnormally
    repetitive (Shannon entropy below the 5th percentile), a high-risk function-code frequency Z-score
    exceeded 3.0, or a CUSUM test over write-command rate accumulated a slow, stealthy deviation?
  context: 'Adversaries may abuse APIs slowly to evade single-sample thresholds. Build a 60-day baseline
    of function-code usage per asset pair and compute Shannon entropy of the function-code distribution
    in a rolling 10-minute window: an entropy drop below the 5th percentile signals repetitive automated
    activity (e.g., a script hammering one write command), while a high-risk function-code frequency Z-score
    above 3.0 flags an unusual surge. Add a stateful CUSUM test over the write-command rate so small,
    persistent deviations accumulate and trigger even when no single window looks alarming — this catches
    slow stealthy API abuse. Tune via an impact-vs-false-alarm metric. Positive results indicate automated
    or stealthy manipulation distinct from normal human-paced operations. Source references: [Limiting
    the Impact of Stealthy Attacks on Industrial Control Systems](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: Network taps or SPAN ports deployed at critical choke points within the Process Control Network
    (Level 2), such as in front of safety PLCs, between HMI/EWS and control devices, and on links to Historian
    servers.'
  range: Last 90 days; baseline 60 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  protocol_logs | bin span=10m by orig_h,resp_h\n  | H = shannon_entropy(func_code_dist)\n\
      \  | z = zscore(highrisk_fc_freq, baseline=60d)\n  | cusum_state += (write_rate - mu)\n  | where\
      \ H < p05 OR z > 3.0 OR cusum_state > h_threshold\n  | alert"
- question: Does an observed sequence of function codes between a controlling HMI/EWS and its target PLC/RTU
    have very low probability under a Hidden Markov / sequence model trained on that process's normal
    operational logic (idle, running, startup states)?
  context: 'Legitimate control of a process follows learnable command sequences and state transitions.
    Train a Hidden Markov or sequence model per critical process on typical function-code sequences between
    an HMI/EWS and its PLC/RTU, capturing legitimate states. Alert when a live sequence is highly improbable
    under the model — e.g., a transition that never occurs in normal operation — and surface the offending
    low-probability transition(s) so the analyst can interpret the deviation. Invariant/sequence mining
    over correlated command values yields explainable runtime checks. This detects unauthorized execution
    that uses individually-valid function codes but in an operationally-illegal order, which static per-message
    rules miss. Source references: [A Systematic Framework to Generate Invariants for Anomaly Detection
    in Industrial Control Systems](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: Network taps or SPAN ports deployed at critical choke points within the Process Control Network
    (Level 2), such as in front of safety PLCs, between HMI/EWS and control devices, and on links to Historian
    servers.'
  range: Last 90 days; train on >=60 days benign sequences
  queries:
  - technology: ML/pseudocode
    query: ">-\n  seq = ordered_func_codes(orig_h, resp_h, window)\n  hmm = HMM.fit(benign_sequences_per_process)\n\
      \  logp = hmm.score(seq)\n  | where logp < low_prob_threshold\n  | report worst_transition(seq)\n\
      \  | alert"
- question: Does an authorized HMI/EWS-to-PLC channel exhibit a forbidden command anti-pattern, such as
    a PLC Stop immediately followed by a Program Download from a non-EWS source, or a write to a safety
    system outside a planned shutdown?
  context: 'A compromised but otherwise authorized host can issue valid commands in dangerous combinations.
    Using operator knowledge, define forbidden command anti-patterns within short windows and model each
    authorized PLC channel as a deterministic finite automaton (DFA) of normal command sequences, alerting
    on out-of-sequence or forbidden transitions. The classic example — Stop followed immediately by Program
    Download — represents an attacker re-flashing logic on a halted controller. Because the source is
    allow-listed, only the SEQUENCE and CONTEXT reveal the abuse, so DFA-based forbidden-transition detection
    is essential. A positive result is high-confidence evidence of malicious execution via a trusted host;
    tie the alert to safety-relevant assets for prioritization. Source references: [Temporal Phase Shifts
    in SCADA Networks](https://arxiv.org/abs/1808.05068).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: Network segments within the Process Control Network (Level 2) that connect authorized Engineering
    Workstations (EWs) and Human-Machine Interfaces (HMIs) to their respective control devices (PLCs,
    RTUs).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  channel_dfa = DFA(normal_command_sequences_per_channel)\n  | stream commands by (orig_h,resp_h)\n\
      \  | detect anti_pattern: PLC_STOP -> PROGRAM_DOWNLOAD within 60s AND src not in EWS\n     OR write_to_safety\
      \ AND ts not in planned_shutdown\n     OR dfa.transition == forbidden\n  | alert"
- question: For each authorized source-destination ICS pair, has the inter-arrival time of requests dropped
    below the 1st percentile of its per-phase baseline (commands faster than a human), or are periodic
    messages missing, delayed, or extra relative to the expected phase?
  context: 'Authorized HMI/EWS-to-PLC communications follow periodic, phase-structured rhythms. Baseline
    the inter-arrival time of requests per pair using Zeek protocol-log timestamps, accounting for distinct
    periodic phases, and alert when the mean inter-arrival in a 5-minute window falls below the 1st percentile
    (an automated script issuing commands faster than any operator could) or when messages are missing,
    delayed, or extra versus the expected periodic phase. Add frequency-domain/PCA monitoring of command
    periodicity to catch injected or dropped periodic commands. A compromised authorized host driven by
    a script typically breaks the human/periodic timing signature even while sending otherwise-valid commands,
    making timing analysis a strong tell for automated unauthorized execution. Source references: [Temporal
    Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068); [Efficient Cyber Attack Detection
    in Industrial Control Systems Using Lightweight Neural Networks and PCA](https://arxiv.org/abs/1907.01216).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: Network segments within the Process Control Network (Level 2) that connect authorized Engineering
    Workstations (EWs) and Human-Machine Interfaces (HMIs) to their respective control devices (PLCs,
    RTUs).'
  range: Last 90 days; baseline per periodic phase
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  protocol_logs | by (orig_h,resp_h), phase\n  | iat = inter_arrival_times(ts)\n  | bin\
      \ span=5m: mean_iat\n  | where mean_iat < p01_per_phase OR missing/delayed/extra_vs_phase\n  | optionally\
      \ PCA(command_periodicity) residual > thr\n  | alert"
- question: Does live communication between an authorized pair produce reconstruction error above the
    99th-percentile threshold from an LSTM/1D-CNN autoencoder trained on benign-only communication volume
    and command frequency, or score as anomalous under a one-class SVM/DNN trained on normal telemetry?
  context: 'Subtle compromise of an authorized host may alter the overall rhythm of bytes/sec and function-codes/sec
    without tripping discrete rules. Train an LSTM or 1D-CNN autoencoder on benign-only time series of
    communication volume (bytes/sec from conn.log) and command frequency (function codes/sec from protocol
    logs) between authorized pairs to learn normal rhythm, then alert when live reconstruction error exceeds
    the 99th-percentile threshold, reporting the top-3 feature/timestep contributors for explainability.
    Complement with a one-class SVM or DNN trained only on normal telemetry for higher recall. Deploy
    these in PARALLEL with the deterministic and statistical layers, since deep models are individually
    evadable but collectively raise the cost of stealthy unauthorized execution through a trusted channel.
    Source references: [Detecting Cyberattacks in Industrial Control Systems Using Convolutional Neural
    Networks](https://arxiv.org/abs/1806.08110); [Anomaly Detection for a Water Treatment System Using
    Unsupervised Machine Learning](https://arxiv.org/abs/1709.05342); [Deep Learning-Based Anomaly Detection
    in Cyber-Physical Systems: Progress and Opportunities](https://arxiv.org/abs/2003.13213).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: Network segments within the Process Control Network (Level 2) that connect authorized Engineering
    Workstations (EWs) and Human-Machine Interfaces (HMIs) to their respective control devices (PLCs,
    RTUs).'
  range: Last 90 days; train on benign-only history
  queries:
  - technology: ML/pseudocode
    query: ">-\n  ts_feats = [bytes_per_s(conn.log), funccodes_per_s(protocol_logs)] per authorized_pair\n\
      \  ae = LSTM_or_1DCNN_autoencoder.fit(benign_only)\n  err = reconstruction_error(ae, live)\n  |\
      \ where err > p99_threshold\n  | report top3_feature_timestep_contributors\n  | corroborate one_class_SVM/DNN(normal_telemetry)\n\
      \  | alert"
