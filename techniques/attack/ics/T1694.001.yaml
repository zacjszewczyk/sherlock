- question: When a supervised classifier scores historical authentication events, which events are flagged
    as high-confidence suspicious where the hardcoded-credential watchlist feature is true and the source
    is not a recognized maintenance system - and what are the top-3 feature contributions?
  context: 'A supervised classifier can distinguish malicious hardcoded-credential use from legitimate
    maintenance once labeled history is available. Train a classifier (e.g., Random Forest, as evaluated
    on ICS network traffic) on historical authentication events using features such as username, source
    IP, destination IP, protocol, time of day, device family, session length, target-diversity, failed/success
    ratio, and whether the account is on a hardcoded-credential watchlist. Flag high-confidence suspicious
    events where the watchlist feature is true and the source is not a recognized maintenance system,
    and surface the top-3 feature contributions (via Random Forest feature importance or SHAP) in the
    alert. This focuses analyst attention on the riskiest hardcoded-credential events with an explanation
    of why. A positive result is a high-confidence classification of suspicious hardcoded-credential use
    from an unexpected source; a negative result classifies the event as benign maintenance. References:
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374);
    [Explainable Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930).'
