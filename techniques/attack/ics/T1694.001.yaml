  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = profile_30d(asset_family -> {user, src_ip, dst_port} frequencies)\nFOR e IN auth_events(zeek+windows):\n\
      \  r_user = 1/(freq(e.user, e.asset_family)+1)\n  score  = -log(p(e.user)) + -log(p(e.src_ip ->\
      \ e.dst_asset))\n  IF e.user IN default_accounts AND (score >= pctl_99(asset_family)\n       OR\
      \ distinct_targets(e.user) > baseline_max\n       OR first_seen_edge(e.src_host, e.dst_asset, e.user)):\n\
      \    ALERT top3_factors(e)"
- question: Across sliding 1-, 5-, and 60-minute windows, does any source IP or asset show authentication
    volume/frequency/failure patterns consistent with default-credential spraying - such as trying default
    creds against 5+ distinct ICS assets in 5 minutes, or a failed-logon burst immediately followed by
    a success to the same asset?
  context: 'Automated default-credential attacks generate distinctive volume, frequency, and state signatures.
    Compute per-source-IP and per-asset metrics over sliding 1-, 5-, and 60-minute windows: bytes/packets
    per connection, connections per minute, distinct destination assets per source, and the ratio of FAILED
    to SUCCESSFUL authentications (Zeek ssh.log auth_success=F, telnet/ftp failures, Windows 4625, blocked
    conn.log attempts). Alert when one source tries default credentials against >=5 distinct ICS assets
    within 5 minutes (horizontal spray), or when a failed-logon burst (tune to >=10/5min per site) is
    immediately followed by a SUCCESS to the same asset - a failed-then-success transition is a strong
    indicator of a working default credential being found. Damped-window rate features additionally flag
    abnormal connection rate or byte volume to PLCs/RTUs that do not normally receive interactive sessions.
    A positive result reveals brute-force or spray activity converging on a default credential; a negative
    result shows rates and failure ratios within normal bounds. References: [Password Spray Attacks: Detection
    and Mitigation Strategies (ASD)](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf);
    [Detecting Password Spraying Attacks (Splunk)](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Kitsune](https://arxiv.org/abs/1802.09089).'
