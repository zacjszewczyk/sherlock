      \ ALERT \"failed-then-success default cred\""
- question: When an unsupervised anomaly detector scores authentication and session features from Zeek
    and Windows logs, do any default-watchlisted sessions fall into rare clusters or high reconstruction-error
    regions - especially sessions reaching multiple control assets?
  context: 'Machine learning broadens detection to subtle default-credential abuse that rule and statistical
    methods miss. Train an unsupervised anomaly detector (e.g., an online autoencoder ensemble such as
    Kitsune for flow features, or a supervised SVM/Random Forest on ICS Modbus/OPC UA traffic) on historical
    authentication and session features: source IP, destination asset, protocol, destination port, function-code
    privilege, session duration, byte counts, failed/success ratio, and an account-on-default-watchlist
    flag. Flag sessions in rare clusters or with high reconstruction error, prioritizing default-credential
    sessions reaching multiple control assets, since that fan-out pattern is typical of an adversary using
    a working default account to move laterally. Surface the top-3 contributing features in the alert.
    A positive result is an anomalous default-account session that merits investigation; a negative result
    means the session fits learned-normal behavior. References: [Kitsune: An Ensemble of Autoencoders
    for Online Network Intrusion Detection](https://arxiv.org/abs/1802.09089); [Kitsune-py code](https://github.com/ymirsky/Kitsune-py);
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374).'
