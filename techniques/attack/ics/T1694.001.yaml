  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "default_watchlist = {(admin,admin),(root,xc3511),(root,vizxv), ...}  # per device family\n\
      JOIN conn.log WITH (ssh.log|http.log|ftp.log|telnet.log|rdp.log) ON uid, ts, id.orig_h, id.resp_h\n\
      WHERE id.resp_h IN ics_asset_inventory\n  AND auth_success == true\n  AND (user, password) IN default_watchlist\n\
      ALERT \"default credential auth to critical ICS asset\""
  - technology: Zeek/pseudocode
    query: "# protocols without auth logs: enforce conduit + function-code allow-list\nFOR rec IN (modbus.log|dnp3.log|enip.log|s7comm.log)\n\
      \  WHERE rec.func IN privileged_write_operate  # Modbus WriteSingleCoil/Register, DNP3 Operate\n\
      \    AND NOT approved_maintenance_path(rec.id.orig_h, rec.id.resp_h)\n  ALERT \"out-of-conduit privileged\
      \ write/operate to \" + rec.id.resp_h"
- question: Is a factory or default account being used in a statistically rare way for its ICS asset family
    - appearing in the top 1 percent of rarity scores, contacting an unusually large number of distinct
    targets, or forming a (source-host, dest-asset, account) edge with no benign precedent?
  context: 'Beyond exact watchlist matches, default-credential abuse shows up as anomalously rare authentication
    behavior. Build a 30-day baseline per ICS asset and device family of successful usernames, source
    IPs, and destination ports, then score each event by username rarity and source-to-asset rarity (risk
    = 1/(frequency+1) or negative-log-probability). Alert when a credential tied to a factory default
    account lands in the top 1 percent of rarity for that asset family or is used against an unusually
    large number of distinct targets, and apply first-time-edge logic to flag (source-host, dest-asset,
    account) triples never previously seen as benign. This catches default accounts that are technically
    valid but never legitimately used from a given host. Thresholds are derived per site, and the alert
    must list the top-3 contributing factors (account, source IP, first-seen edge). A positive result
    indicates novel or rare default-account access consistent with an intruder pivoting; a negative result
    means access matches established baselines. References: [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518);
    [Hopper: Modeling and Detecting Lateral Movement](https://www.usenix.org/system/files/sec21-ho.pdf).'
