    query: "FOR cred IN successful_auth_credentials, window=24h:\n  targets = distinct(dst_asset WHERE\
      \ cred, window)\n  H = shannon_entropy(distribution(dst_asset | cred, window))\n  base = baseline_30d(cred)\n\
      \  IF count(targets) > base.distinct_targets_upper OR H > base.entropy_upper:\n    ALERT cred WITH\
      \ top3_new_assets(targets - base.known_assets)"
- question: Does any watchlisted hardcoded account show a failed-logon burst followed by a success to
    the same asset, or get attempted across 5+ distinct OT hosts within a short window - indicating automated
    reuse or spraying?
  context: 'Automated reuse of hardcoded credentials produces measurable failed-vs-successful logon state
    patterns. Track per-account and per-source state/failure-mode metrics: counts of Windows 4625 (failed)
    vs 4624 (success), distinct accounts attempted per source, lockout spikes, and failed-then-success
    transitions to the same asset. Alert when a watchlisted hardcoded account shows a failed-logon burst
    (tune >=10/5min per site) followed by a success, or is attempted across >=5 distinct OT hosts within
    a short window - both indicate automated reuse rather than legitimate maintenance. Thresholds are
    derived from each site''s baseline to limit false positives in OT. In the Lateral Movement context
    this catches an adversary scripting a hardcoded account across the supervisory and control layers.
    A positive result is a burst-then-success or broad horizontal attempt pattern on a hardcoded account;
    a negative result shows isolated, expected use. References: [Password Spray Attacks: Detection and
    Mitigation Strategies (ASD)](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf);
    [Detecting Password Spraying Attacks (Splunk)](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
