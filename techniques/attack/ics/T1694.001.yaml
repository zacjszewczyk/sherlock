    query: "features = [src_ip, dst_asset, proto, dst_port, funccode_priv, session_dur,\n            bytes,\
      \ fail_succ_ratio, on_default_watchlist]\nmodel = Kitsune_autoencoder_ensemble().fit(benign_flow_features)\n\
      FOR s IN sessions:\n  err = model.reconstruction_error(s)\n  IF err > anomaly_threshold AND s.on_default_watchlist\
      \ AND distinct_control_assets(s) > 1:\n    ALERT s WITH top3_features(s)"
- question: When each authentication/flow event is scored with an explainable tabular anomaly detector
    (e.g., Extended Isolation Forest), which events receive high anomaly scores, and what are the top-3
    per-feature drivers - such as rare source IP, privileged write function code, or default account?
  context: 'To make ML output actionable for SOC analysts, score each authentication/flow event with an
    unsupervised tabular detector such as Extended Isolation Forest over features [source-IP rarity, destination
    asset, port, protocol, function-code privilege, bytes, connections/min, failed/success ratio, account-on-default-watchlist].
    Because the model assigns per-feature isolation depth, the alert must report the top-3 features driving
    the score (e.g., ''rare source IP'', ''privileged write function code'', ''default account'') rather
    than just a number, consistent with SHAP-style attribution for ICS anomaly detection. Train on benign
    baselines and retune the contamination parameter per site. This gives the analyst an explainable,
    prioritized list of anomalous events with the specific reasons each was flagged, which is essential
    in OT where false positives can be operationally costly. A positive result is a high-scoring event
    with clear default-credential indicators among its top features; a negative result means the event
    scores as normal. References: [Extended Isolation Forest](https://arxiv.org/abs/1811.02141); [Extended
    Isolation Forest code](https://github.com/sahandha/eif); [Explainable Anomaly Detection for Industrial
    Control System Cybersecurity](https://arxiv.org/abs/2205.01930); [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518).'
