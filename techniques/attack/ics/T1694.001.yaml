    query: "hardcoded_watchlist = load(vendor_advisories + manuals + default_pairs)\nFOR e IN (win 4624\
      \ | ssh.log | telnet.log | http.log | ftp.log | dce_rpc.log | ssl.log):\n  IF e.success AND e.user\
