questions:
- question: Did any successful login or authenticated device session to a critical ICS asset use a known
    manufacturer default username/password pair, or did any unauthenticated industrial protocol carry
    a privileged write/operate function code from a source outside that asset's approved maintenance path?
  context: 'Adversaries performing Lateral Movement in an ICS environment frequently abuse manufacturer-set
    default credentials because they are documented in vendor manuals and often never changed. Join Zeek
    conn.log with the per-protocol logs (ssh, http, ftp, telnet, rdp, modbus, dnp3, enip, s7comm) on timestamp/UID/source
    IP/destination IP and alert when a successful authenticated session to an asset on the critical ICS
    inventory uses a credential matching a maintained per-device-family default watchlist seeded from
    vendor manuals and the ~60 empirically observed default pairs (admin/admin, root/xc3511, root/vizxv,
    etc.). For protocols with no authentication logs (Modbus, DNP3, S7comm, ENIP), the network-side allow-list
    is the primary control: alert when a privileged write/operate function code (Modbus Write Single Coil/Register,
    DNP3 Operate) originates from a source not on the approved maintenance path. A positive result confirms
    use of a known default credential set or out-of-conduit control traffic and warrants immediate containment;
    a negative result means observed sessions used non-default accounts on approved paths. References:
    [Understanding the Mirai Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf);
    [Guide to Operational Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Top Cyber Actions for Securing Water Systems (CISA)](https://www.cisa.gov/resources-tools/resources/top-cyber-actions-securing-water-systems).'
