name: 'T1694.001: Default Credentials'
id: 24433461-838f-4c9e-89c8-b87faefa81d9
description: This playbook helps an analyst investigate the use of manufacturer- or supplier-set default
  credentials and hardcoded vendor/product credentials on industrial control system (ICS) assets. Adversaries
  abuse documented default username/password pairs (and accounts that cannot be changed) to authenticate
  to PLCs, RTUs, IEDs, SCADA servers, historians, and engineering workstations, often bypassing normal
  account lifecycle controls and enabling lateral movement through the OT environment. The investigation
  looks for successful logins or authenticated sessions using known default or hardcoded credential sets,
  privileged write/operate traffic on industrial protocols from hosts outside the approved maintenance
  path, rare or first-seen account-to-asset access, failed-then-success authentication bursts indicative
  of credential reuse or spraying, and a single credential fanning out across many devices. It combines
  symbolic-logic watchlist matching, statistical rarity/volume/state baselining, and machine-learning
  anomaly detection across Zeek network logs, Windows authentication events, Sysmon, and ICS asset inventory
  context to confirm and prioritize default-credential abuse.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
