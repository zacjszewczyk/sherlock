      \     AND e.src_ip NOT IN maintenance_systems:\n    ALERT e WITH top3_feature_importance(e)"
- question: When an unsupervised temporal-graph / link-prediction model scores authenticated sessions
    (devices/accounts as nodes, sessions as edges), does any hardcoded credential produce a star-like
    burst of low-probability new edges across many devices?
  context: 'Graph analytics expose the structural signature of shared-credential reuse that flat features
    miss. Train an unsupervised temporal-graph / link-prediction model on Zeek conn.log plus authentication
    logs, with nodes representing devices/accounts and edges representing authenticated sessions. The
    model learns normal communication structure and scores improbable new edges; a hardcoded credential
    authenticating across many devices produces a star-like burst of low-probability edges radiating from
    one account or source. Optionally pair this with a sequence-anomaly model over engineering-workstation
    / jump-server session sequences to catch anomalous session ordering. Surface the top-3 anomalous edges/features
    in the alert. This directly targets the Lateral Movement pattern where a single reusable credential
    is the pivot point. A positive result is an account/source emitting many improbable edges in a short
    span; a negative result means observed session structure matches the learned-normal graph. References:
    [CyberGraph: Detecting Lateral Movement in Enterprise Computer Networks with Unsupervised Graph AI](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf);
    [DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep Learning](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
