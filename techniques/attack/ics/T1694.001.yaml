      \ \" + e.user + \" -> \" + e.dst_asset"
- question: For each credential that authenticates successfully, how many distinct destination assets
    does it touch and what is the Shannon entropy of its target set over a rolling 24-hour window - and
    does any credential contact an unusually broad set of devices versus its 30-day baseline?
  context: 'Because hardcoded credentials are commonly reused across an entire product line, a tell-tale
    sign is one credential authenticating to an abnormally broad set of devices. For each credential that
    authenticates successfully, calculate the number of distinct destination assets and the Shannon entropy
    of the target set over a rolling 24-hour window, then compare against that credential''s 30-day baseline.
    Alert when a credential''s target diversity exceeds its baseline, applying first-time-edge and rarity
    logic generalized from lateral-movement research. Report the top-3 newly-contacted assets in the alert
    so the analyst can see the spread. High target diversity for a shared/hardcoded account strongly suggests
    an adversary leveraging it to fan out across the OT environment - a core Lateral Movement behavior.
    A positive result is a credential whose reach has expanded well beyond normal; a negative result means
    the credential''s target set is stable and narrow. References: [Hopper: Modeling and Detecting Lateral
    Movement](https://www.usenix.org/system/files/sec21-ho.pdf); [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518).'
