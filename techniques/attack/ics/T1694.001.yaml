- question: Do any successful authentications or session establishments match a maintained watchlist of
    vendor hardcoded or shared product credentials, particularly when the source host is not a known engineering
    or maintenance station?
  context: 'Hardcoded vendor/product credentials are even more dangerous than configurable defaults because
    the same account works across many devices and often cannot be changed by the owner, bypassing normal
    account lifecycle controls. Continuously compare usernames and authentication artifacts in Windows
    Event ID 4624 and Zeek protocol logs (ssh, telnet, http, ftp, dce_rpc, ssl) against a maintained watchlist
    of hardcoded/shared product credentials built from vendor advisories, manuals, and the empirical default-pair
    dictionary. Alert on any successful authentication or session matching the watchlist, especially when
    the source host is not a recognized engineering or maintenance station. Where the credential cannot
    be changed, the compensating control is a zone-and-conduit access policy - alert on any out-of-conduit
    session to the affected asset. In the Lateral Movement context, a hit means an adversary may be reusing
    a known-good hardcoded account to access management interfaces of PLCs, RTUs, IEDs, SCADA, historians,
    and engineering workstations. A positive result confirms hardcoded-credential use; a negative result
    shows no watchlisted account authenticated. References: [Understanding the Mirai Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf);
    [Guide to Operational Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Top Cyber Actions for Securing Water Systems (CISA)](https://www.cisa.gov/resources-tools/resources/top-cyber-actions-securing-water-systems).'
