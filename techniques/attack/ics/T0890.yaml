questions:
- question: Are any approved, high-privilege ICS application processes (e.g., HMIServer.exe, OPC.exe,
    RSLinx.exe, WinCCExplorer.exe) spawning command shells, scripting engines, or LOLBins (cmd.exe, powershell.exe,
    whoami.exe, net.exe, psexec.exe, wmic.exe, rundll32.exe, mshta.exe) while running at System/High integrity?
  context: When an exploit succeeds against a privileged ICS service, the injected code typically launches
    a generic interactive or scripting utility under the parent's elevated token. A legitimate historian,
    HMI, or OPC process has no business spawning cmd.exe or powershell.exe, so a parent on the ICS application
    allowlist creating a child on the suspicious-utility watchlist, with the parent confirmed at TokenElevationType
    '%%1936' (Type 1) or IntegrityLevel 'System', is a high-confidence privilege-escalation signal. Build
    the ics_app_allowlist per site from a 90-day process-creation inventory, and extend the watchlist
    with canonical unexpected-lineage rules (svchost/lsass/services parented unexpectedly; services.exe->cmd.exe).
    A match means an exploited privileged process is executing attacker tooling; the alert must surface
    hostname, user, parent, child, full command line, and token/integrity level so the analyst can confirm
    and scope.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, and OPC
    Servers within the Process Control Network (PCN) and Manufacturing Zone (MZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule \"Privileged ICS app spawns suspicious utility\":\n  index=process_creation (EventID=4688\
      \ OR sysmon_id=1)\n  | where ParentProcessName IN ics_app_allowlist\n    AND lower(NewProcessName)\
      \ IN suspicious_utility_watchlist\n    AND (TokenElevationType=\"%%1936\" OR IntegrityLevel=\"System\"\
      )\n  | table _time, host, user, ParentProcessName, NewProcessName, CommandLine, IntegrityLevel"
- question: For each ICS asset, which newly observed (ParentProcessName, NewProcessName, CommandLine)
    tuples have never appeared in that host's 90-day baseline, and are they also globally rare across
    the ICS fleet or launched at elevated integrity?
  context: Allowlists cannot enumerate every benign combination, so a complementary statistical layer
    baselines the unique parent-child-commandline tuples each host normally produces over a 90-day rolling
    window and flags first-time occurrences. Novelty alone is medium signal; escalate to high when the
    child executable or its command-line arguments are also globally rare (seen on <2% of assets in 90
    days), because rare-everywhere tooling is more likely attacker-introduced than a local quirk. Also
    track Frequency (distinct new tuples per host per hour) and State (ratio of process creations at System/High
    integrity vs. baseline) - a spike in either is a stronger escalation indicator than a single novel
    tuple. This catches exploitation that uses living-off-the-land binaries not on any static watchlist
    while keeping noise manageable through rarity scoring.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, and OPC
    Servers within the Process Control Network (PCN) and Manufacturing Zone (MZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "# 90-day per-host baseline of (parent, child, cmdline) tuples\nbaseline = stats by host, ParentProcessName,\
      \ NewProcessName, CommandLine over last 90d\non new_event:\n  tuple = (host, ParentProcessName,\
      \ NewProcessName, CommandLine)\n  if tuple not in baseline[host]:\n    global_rarity = pct_assets_seen(NewProcessName,\
      \ CommandLine, 90d)\n    sev = \"medium\"\n    if global_rarity < 0.02: sev = \"high\"\n    if IntegrityLevel\
      \ in (\"System\",\"High\"): sev = \"high\"\n    alert(sev, host, ParentProcessName, NewProcessName,\
      \ CommandLine)\n# track Frequency=distinct_new_tuples/host/hour, State=ratio elevated vs baseline"
- question: Do process-creation events on critical ICS assets fall in the top 1st percentile of anomaly
    scores from an Isolation Forest / One-Class SVM trained on a clean baseline of parent/child names,
    command-line length and entropy, integrity/token elevation, user context, path depth, and image-name
    digit ratio?
  context: Exploitation drives a process off its learned behavior profile, so an unsupervised anomaly
    detector trained on 90 days of clean process-creation telemetry from critical ICS assets can surface
    escalation that no static rule anticipated. Score new events in real time and treat the top 1st percentile
    as high priority. For Explainability the alert must list the top-3 contributing features (e.g., rare
    parent->child pair, high command-line entropy, elevation to System) via per-feature attribution (LIME).
    Complement with system-call/short-sequence behavioral baselining, since exploited processes deviate
    at the syscall level too. Because ML-only industrial detectors generalize poorly to unseen attacks,
    run this strictly as a parallel layer over the deterministic rules - a high anomaly score corroborates,
    but does not replace, the rule-based findings.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, and OPC
    Servers within the Process Control Network (PCN) and Manufacturing Zone (MZ).'
  range: Last 90 days
  queries:
  - technology: ML/Isolation Forest pseudocode
    query: "features = [parent_name, child_name, cmdline_len, cmdline_entropy,\n            integrity_level,\
      \ token_elevation, user, path_depth, digit_char_ratio]\nmodel = IsolationForest.load(\"ics_proc_baseline_90d\"\
      )   # or OneClassSVM\nscore = model.anomaly_score(features(event))\nif score in top_percentile(1):\n\
      \  top3 = lime_explain(model, features(event))[:3]\n  alert(\"high\", event, contributing_features=top3)"
- question: When a whole-system provenance graph (process->child, process->file, process->socket) is built
    from Sysmon EID 1/8/10/11/3 on each ICS host and scored with a GNN, do any process nodes/edges deviate
    structurally from the learned benign baseline in a way consistent with a multi-step exploitation chain?
  context: Single-event rules miss multi-step exploitation (vulnerable service -> injected thread -> shell)
    because each step alone can look benign. A provenance-graph approach (ThreaTrace, KAIROS) models the
    structural role each process plays - what it spawns, which files it touches, which sockets it opens
    - and a GNN flags nodes/edges whose role departs from the benign baseline. This surfaces the lineage
    of an exploited service even when the individual events are unremarkable. KAIROS reconstructs a compact
    attack-summary subgraph; attach it to the alert (Explainability) so the analyst can immediately see
    the contributing nodes and edges and trace the chain from initial vulnerable process to the escalated
    payload.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, and OPC
    Servers within the Process Control Network (PCN) and Manufacturing Zone (MZ).'
  range: Last 90 days
  queries:
  - technology: ML/Provenance-GNN pseudocode
    query: "# Build provenance graph from Sysmon EID 1,8,10,11,3 per host\nG = build_provenance_graph(sysmon_events,\
      \ edges=[proc_child, proc_file, proc_socket])\nnode_scores = GNN_threatrace.score_nodes(G)     \
      \   # benign-baseline model\nfor n in node_scores where n.deviation > threshold:\n  subgraph = kairos_attack_summary(G,\
      \ n)\n  alert(\"high\", node=n.process, lineage=subgraph)"
- question: Did any allowlisted ICS application running at System/High integrity emit a Windows Application
    Error / WER event (Event ID 1000/1001) or abnormally terminate-and-respawn (Sysmon EID 1) within 60
    seconds of a process-creation anomaly, and was it followed by a new SYSTEM child process or service
    install?
  context: 'Exploits frequently destabilize or crash the target process even when they succeed, so the
    failure mode is itself a detectable artifact. Profile crashes of privileged ICS applications: a WER
    1000/1001 fault or an abnormal terminate/respawn, occurring within a 60-second window of a process-creation
    anomaly from the methods above, is suspicious. Track per-host crash Frequency (faults/hour) and the
    success/fail State of subsequent child spawns, and correlate stale or out-of-sequence application
    log keys (DeepLog). A crash immediately followed by a new SYSTEM child process or service install
    is a high-confidence exploitation signal even when the exploit primitive itself is invisible to the
    sensors - it captures the moment a vulnerable privileged process is corrupted and handed off to attacker
    code.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, and OPC
    Servers within the Process Control Network (PCN) and Manufacturing Zone (MZ).'
  range: Last 90 days; correlate within a 60-second window of a process-creation anomaly
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Exploitation-induced crash correlated with process anomaly\njoin (EventID IN (1000,1001)\
      \ AND faulting_app IN ics_app_allowlist\n      AND IntegrityLevel IN (\"System\",\"High\"))\n  with\
      \ proc_creation_anomaly\n  on host within 60s\n| where followed_by(new_SYSTEM_child OR service_install)\
      \ within 60s\n| stats faults_per_hour by host\n| alert(\"high\", host, faulting_app, followon_child)"
- question: Have any new services been installed on ICS assets that run as LocalSystem/NT AUTHORITY\SYSTEM
    with an executable path in a user-writable location (C:\Users\*, C:\ProgramData, C:\PerfLogs, C:\Windows\Temp,
    C:\Windows\Tasks), a path not on the approved-service allowlist, or a randomized service name?
  context: Installing a SYSTEM service is a common way to convert an exploit into persistent, elevated
    execution. Legitimate ICS software installs services from controlled program directories under managed
    change processes; an attacker drops a payload to a user-writable directory and registers it as a LocalSystem
    service, often with a random name to evade signatures. Trigger on Event ID 4697/7045 when the account
    is LocalSystem/SYSTEM AND (the ServiceFileName path matches user-writable regex OR is not on the approved_service_exe_allowlist),
    and additionally flag service names matching a high-entropy random-string pattern (>8 alphanumerics,
    no dictionary token). Build the allowlist from a 90-day baseline plus NIST SP 800-82 application-allowlisting
    guidance. A match warrants immediate triage with hostname, service name, executable path, and account,
    because OT assets should rarely see new SYSTEM services at all.
  answer_sources:
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Sysmon Event ID 13
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian Servers, OPC Servers, and other critical Windows-based
    ICS infrastructure components within the PCN/MZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule \"Suspicious SYSTEM service install\":\n  index=service_install (EventID=4697 OR EventID=7045\
      \ OR sysmon_id=13)\n  | where ServiceAccount IN (\"LocalSystem\",\"NT AUTHORITY\\\\SYSTEM\")\n \
      \   AND (regex(ServiceFileName,\"^C:\\\\(Users\\\\.*|ProgramData|PerfLogs|Windows\\\\(Temp|Tasks))\"\
      )\n         OR ServiceFileName NOT IN approved_service_exe_allowlist\n         OR regex(ServiceName,\"\
      ^[A-Za-z0-9]{9,}$\") AND no_dictionary_token(ServiceName))\n  | table _time, host, ServiceName,\
      \ ServiceFileName, ServiceAccount"
- question: For each new service-creation event, does the Shannon entropy of the ServiceName or of the
    executable filename exceed the 95th percentile of the known-good baseline, and do newly installed
    SYSTEM services repeatedly fail to start (System Event ID 7000/7009/7011)?
  context: 'Malware often randomizes service and binary names, which raises their character entropy relative
    to legitimate, human-named services. Compute Shannon entropy of the ServiceName and the executable
    filename for every new service and compare against a 90-day baseline distribution of known-good services;
    an entropy above the 95th percentile is medium-confidence evidence of randomization to evade detection.
    Also profile the failure-mode/State signal: count failed service starts per host (System Event ID
    7000/7009/7011), because a newly installed SYSTEM service that repeatedly fails to start is a strong
    indicator of a broken or incompatible exploit payload rather than legitimate software. Together, high
    name entropy plus start failures sharply increase confidence that the install is malicious.'
  answer_sources:
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Sysmon Event ID 13
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian Servers, OPC Servers, and other critical Windows-based
    ICS infrastructure components within the PCN/MZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = entropy_dist(ServiceName, exe_filename) over known_good_services 90d\non new_service:\n\
      \  e_name = shannon_entropy(ServiceName)\n  e_file = shannon_entropy(filename(ServiceFileName))\n\
      \  if e_name > pct95(baseline.name) OR e_file > pct95(baseline.file):\n    alert(\"medium\", host,\
      \ ServiceName, ServiceFileName)\n# failure-mode: count System EID 7000/7009/7011 per host -> repeated\
      \ SYSTEM start failures = strong"
- question: Does a Random Forest / Gradient Boosting classifier (with Isolation Forest as an unsupervised
    parallel) score any new service installation as malicious above the tuned probability threshold based
    on path depth, name entropy, filename digit ratio, ServiceType, ServiceStartType, account, and path
    writability?
  context: 'Many weak signals combine into a reliable classification, so train a supervised model on labeled
    benign/malicious service installs (from threat intel and sandbox analysis) using features from 4697/7045/Sysmon
    13: ServiceFileName path depth, ServiceName entropy, filename digit-to-char ratio, ServiceType, ServiceStartType,
    ServiceAccount, and whether the path is user-writable. Random Forest is preferred for its built-in
    feature importance, supporting Explainability - the alert must list the top-3 features driving the
    malicious prediction. Score in real time and alert (high) when P(malicious) exceeds a tuned threshold
    (e.g., 0.90); run Isolation Forest on the same feature vector as an unsupervised parallel to catch
    novel installs absent from training labels. Keep the deterministic rules as the floor and never gate
    alerting solely on the model, since ML can fail on unseen attacks.'
  answer_sources:
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Sysmon Event ID 13
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian Servers, OPC Servers, and other critical Windows-based
    ICS infrastructure components within the PCN/MZ.'
  range: Last 90 days
  queries:
  - technology: ML/Random Forest pseudocode
    query: "features = [path_depth, name_entropy, filename_digit_ratio, ServiceType,\n            ServiceStartType,\
      \ ServiceAccount, is_user_writable_path]\nrf = RandomForest.load(\"svc_install_clf\")\np = rf.predict_proba(features(event)).malicious\n\
      if p >= 0.90:\n  top3 = rf.feature_importance_local(event)[:3]\n  alert(\"high\", event, p_malicious=p,\
      \ top_features=top3)\niforest_score = IsolationForest.score(features(event))   # unsupervised parallel"
- question: Was a new SYSTEM service install (4697/7045) preceded within 120 seconds by named-pipe impersonation/token-manipulation
    (Sysmon EID 17/18) or a CreateRemoteThread into a SYSTEM process (Sysmon EID 8) indicative of getsystem-style
    elevation?
  context: 'A SYSTEM service install that is the payload of an exploit is usually accompanied by the elevation
    primitive that produced the SYSTEM context. Correlate the service create with getsystem-style indicators:
    named-pipe impersonation/token manipulation (Sysmon pipe events EID 17/18) and cross-process injection
    via CreateRemoteThread into a SYSTEM process (Sysmon EID 8). Trigger when a service create is preceded
    within 120 seconds by a remote thread into a SYSTEM process or a duplicated SYSTEM token. This distinguishes
    an attacker''s escalation-then-persistence sequence from legitimate software management, which has
    no reason to impersonate tokens or inject threads before installing a service. A positive correlation
    strongly indicates the install is the persistence/escalation stage of an active exploit.'
  answer_sources:
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Sysmon Event ID 13
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian Servers, OPC Servers, and other critical Windows-based
    ICS infrastructure components within the PCN/MZ.'
  range: Last 90 days; correlate service install with elevation primitives in the preceding 120 seconds
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# getsystem-style elevation correlated with service install\njoin (service_create: EventID\
      \ IN (4697,7045) AND account=\"SYSTEM\")\n  with (Sysmon EID 17/18 named_pipe_impersonation\n  \
      \      OR Sysmon EID 8 CreateRemoteThread -> SYSTEM_process\n        OR duplicated_SYSTEM_token)\n\
      \  on host within 120s (elevation precedes install)\n| alert(\"high\", host, ServiceName, elevation_primitive)"
- question: Within a 120-second window, did an ICS asset's network activity (a connection to a non-RFC1918
    IP not on the allowlist, an HTTP download of mime_type application/x-dosexec, or an SMB/file transfer
    of a .exe/.dll/.ps1) precede a high-priority host alert for anomalous process creation or suspicious
    service install on that same asset?
  context: 'Exploitation for privilege escalation is often preceded by payload or exploit delivery over
    the network. Joining network and host telemetry by IP within a 120-second window catches the delivery-then-escalation
    sequence: Event A is a Zeek-observed rare egress, executable download, or file transfer; Event B is
    a high-priority host alert (process anomaly or suspicious service install) on the same asset. Because
    egress from OT to the internet should be deny-by-default per NIST SP 800-82, any allowed-then-payload
    sequence is high signal. When both fire in order, escalate as a critical incident and attach both
    the network artifact and the host lineage so responders can see how the payload arrived and what it
    did, enabling rapid containment of the affected ICS asset.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek smb_files.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - 'NAI: Network segments connecting EWS, HMIs, and servers within the PCN/MZ; industrial demilitarized
    zones (IDMZ) and network gateways connecting the PCN to enterprise IT networks.'
  range: Last 90 days; join network and host events within a 120-second window
  queries:
  - technology: SIEM/Correlation pseudocode
    query: "# Correlate rare network delivery with host escalation (join by IP, 120s)\nEventA = zeek_conn(dst\
      \ NOT in rfc1918 AND dst NOT in allowlist)\n         OR zeek_http(mime_type=\"application/x-dosexec\"\
      )\n         OR zeek_files(filename ~ \"\\.(exe|dll|ps1)$\")\nEventB = host_alert(anomalous_proc_creation\
      \ OR suspicious_service_install)\njoin EventA, EventB on asset_ip within 120s where EventA before\
      \ EventB\n| escalate(\"critical\", net_artifact=EventA, host_lineage=EventB)"
- question: Which (destination_ip, destination_port) tuples or queried domains are new versus the asset's
    90-day baseline, and within a 2-minute window of such a rare network event did any medium/high host
    alert fire - including bursts of blocked egress (REJ/RSTO/S0) or NXDOMAIN resolutions preceding the
    escalation?
  context: 'Rare network events are leading indicators of exploit staging or C2. Maintain a 90-day rolling
    baseline of (destination_ip, destination_port) tuples from conn.log and queried domains from dns.log
    per critical ICS asset; flag any new connection or domain as a rare network event and open a 2-minute
    monitoring window on the source host, correlating and escalating if any medium/high host alert fires
    within it. Crucially, profile failure-mode/State signals as distinct features: blocked/denied firewall
    connections, conn.log history flags REJ/RSTO/S0, and dns.log NXDOMAIN responses - a burst of blocked
    egress or failed resolutions preceding a host escalation indicates exploit-staging or C2 fallback.
    Use SVM/Random Forest on these flow features for explainable scoring. This catches both successful
    and failed delivery attempts that bracket on-host escalation.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek smb_files.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - 'NAI: Network segments connecting EWS, HMIs, and servers within the PCN/MZ; industrial demilitarized
    zones (IDMZ) and network gateways connecting the PCN to enterprise IT networks.'
  range: Last 90 days; open a 2-minute correlation window on each rare network event
  queries:
  - technology: Zeek/pseudocode
    query: "baseline = set((dst_ip,dst_port)) from conn.log + set(query) from dns.log per asset 90d\n\
      on conn/dns event:\n  if (dst_ip,dst_port) not in baseline OR query not in baseline:\n    open_window(host,\
      \ 2m)\n    if host_alert(sev>=medium) within window: escalate(\"high\", host, rare_event)\n# failure-mode\
      \ features: conn history REJ/RSTO/S0, blocked egress, dns NXDOMAIN bursts\nscore = svm_or_rf.score(flow_features)\
      \   # explainable"
- question: When per-entity risk scores aggregate the process-anomaly, service-anomaly, rare-network,
    and provenance-graph models over a rolling 5-minute window, does any ICS entity's TotalRisk cross
    the critical threshold indicating a full escalation chain?
  context: Individual model alerts may each be sub-threshold yet together describe a complete exploitation-for-escalation
    chain. Implement risk-based alerting (RBA) where each entity (e.g., an HMI) accumulates risk from
    the process-anomaly model, service-anomaly model, rare-network model, and provenance-graph anomaly
    (KAIROS/ThreaTrace). Aggregate over a rolling 5-minute window as TotalRisk = sum(EventScore * EventWeight),
    where EventScore is the model probability/anomaly score and EventWeight reflects alert type and asset
    criticality. When TotalRisk crosses the critical threshold, emit a single composite alert listing
    the top-3 contributing risk events and, when available, the KAIROS attack-summary subgraph (Explainability)
    so the analyst sees the whole chain. Retain deterministic thresholds as an independent trigger so
    ML scoring failures cannot suppress a confirmed match.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek smb_files.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 4697
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - 'NAI: Network segments connecting EWS, HMIs, and servers within the PCN/MZ; industrial demilitarized
    zones (IDMZ) and network gateways connecting the PCN to enterprise IT networks.'
  range: Last 90 days; aggregate entity risk over a rolling 5-minute window
  queries:
  - technology: SIEM/Risk-based alerting pseudocode
    query: "# Risk-based alerting over rolling 5-minute window per entity\nrisk_events = [proc_anomaly,\
      \ svc_anomaly, rare_network, provenance_gnn]\nfor entity in assets:\n  TotalRisk = sum(EventScore\
      \ * EventWeight for e in risk_events[entity] in last 5m)\n  if TotalRisk > critical_threshold:\n\
      \    top3 = sort(risk_events[entity], by=score)[:3]\n    alert(\"critical\", entity, contributing=top3,\
      \ subgraph=kairos_summary(entity))\n# deterministic thresholds remain an independent trigger"
