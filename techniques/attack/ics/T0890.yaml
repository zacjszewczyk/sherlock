name: 'T0890: Exploitation for Privilege Escalation'
id: 98913012-70a0-442f-800e-22de1520f864
description: 'Investigate whether an adversary is exploiting software vulnerabilities to elevate privileges
  on critical ICS assets such as Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian
  Servers, and OPC Servers within the Process Control Network (PCN) and Manufacturing Zone (MZ). This
  playbook helps an analyst hunt for the host- and network-level fingerprints of exploitation for privilege
  escalation: legitimate high-privilege ICS application processes spawning anomalous child utilities (shells,
  scripting engines, LOLBins); suspicious service installations running as LocalSystem from user-writable
  paths or with randomized names; SYSTEM token/named-pipe and cross-process injection patterns consistent
  with getsystem-style elevation; exploitation-induced process crashes followed by new SYSTEM children;
  and network payload/exploit delivery temporally correlated with on-host escalation. It combines deterministic
  SIEM rules, statistical baselining (rare parent-child tuples, entropy of service names, rare network
  destinations), and machine-learning approaches (Isolation Forest, Random Forest, provenance-graph GNNs,
  and risk-based alert aggregation) so that single-event detections and multi-step chains are both covered.
  Treat ML as a parallel layer over the deterministic rules, never a replacement.'
type: technique
related:
- tactic_id: TA0111
  tactic_name: Privilege Escalation
