name: 'T1692.001: Command Message'
id: 1a95de47-2879-452e-985f-363158781aaa
description: Investigate whether an adversary has sent unauthorized command messages to ICS control assets
  (PLCs/RTUs) to drive them outside their intended functionality or without the normal logical preconditions.
  This playbook helps an analyst detect critical control commands such as Modbus writes (function codes
  0x05/0x06/0x10), DNP3 Operate, EtherNet/IP Stop, and S7comm writes that are inconsistent with the approved
  source host, operator context, maintenance window, permitted value/function-code range, or required
  process sequence. Because this is treated as an Evasion technique, the adversary may spoof legitimate
  commands to blend with normal control traffic, so the guidance combines allowlist/precondition checks,
  failure- and denial-state profiling (exception responses, denied/aborted operations, firewall blocks),
  statistical baselining of operator workflow and command values/sequences, and machine-learning anomaly
  detection over protocol fields and originating-host telemetry. Symbolic-logic, statistical, and ML approaches
  run in parallel so deterministic rules and anomaly models together yield defensible, explainable alerting
  on spoofed or injected control commands.
type: technique
related:
- tactic_id: TA0103
  tactic_name: Evasion
