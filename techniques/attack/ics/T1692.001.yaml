questions:
- question: Was a critical write or operate command (Modbus function codes 0x05/0x06/0x10, DNP3 Operate,
    EtherNet/IP Stop, or S7comm write) issued to a target control device by a source host, user account,
    or address range that is not on the approved allowlist, that lacks a matching maintenance ticket,
    or that skipped the prerequisite process sequence operators normally follow?
  context: Because this is an Evasion technique, an adversary spoofs a legitimate command to blend in
    with normal control traffic, so provenance and preconditions are the strongest discriminators. Maintain
    allowlists of {source IP, user, destination device, command/function code, address range} and alert
    when a write or operate command originates from a non-approved operator context, has no corresponding
    change-management ticket, or arrives without the required prerequisite sequence for that process.
    Per NIST SP 800-82r3, enforce least-functionality, deny-by-default segmentation per Purdue level so
    only documented hosts and accounts can issue write/operate function codes, and auto-generate protocol-semantic
    rules for legal function codes and register/point ranges. Validate the application-layer function-code
    and value fields, not just the TCP/IP headers, so replayed or crafted commands that look network-legitimate
    are still caught. A positive result (allowlist miss, missing ticket, or skipped precondition) indicates
    a likely unauthorized command; a clean match against an approved operator workflow is benign.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Change Management System Logs
  - 'NAI: Engineering Workstations (EWS) and Operator Stations (HMI) for command origination context;
    ICS Control Network (Purdue Model Levels 1 & 2) for monitoring command transmission to PLCs/RTUs;
    Authentication Servers for user identity correlation; Change Management database for operational context.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ICS_WRITE = (proto==modbus AND func IN [0x05,0x06,0x10]) OR (proto==dnp3 AND func==OPERATE)\
      \ OR (proto==enip AND service==STOP) OR (proto==s7comm AND func==WRITE)\nALERT WHEN ICS_WRITE AND\
      \ ( {src_ip,user,dst_device,func,addr_range} NOT IN allowlist\n  OR no_matching_ticket(dst_device,\
      \ time)\n  OR NOT precondition_sequence_met(dst_device, func) )"
  - technology: Zeek/pseudocode
    query: 'from modbus.log, dnp3.log, enip.log, s7comm.log

      join with auth (Windows 4624) and change-management tickets on src/time

      emit when critical write/operate AND src/user/value outside permitted set'
- question: Did a single source generate a burst of failed, denied, or exception-response critical commands
    (for example three or more within five minutes) — such as Modbus/DNP3 exception responses, EtherNet/IP
    denied or aborted operations, or firewall-blocked attempts to the target device — that suggests blind
    injection or probing by an unauthorized initiator?
  context: Error and failure states are a distinct signal, not just noise. An adversary attempting to
    evade controls often does not know the exact addressing, value ranges, or session state of the target,
    so probing produces exception responses, denied/aborted operations, and firewall blocks. Track these
    per source device and alert on a burst of failed or denied critical commands (e.g., >=3 within 5 minutes),
    correlating each with any allowlist miss from the provenance check. Per NIST SP 800-82r3, this profiling
    surfaces blind injection and reconnaissance against control devices. Note that single-packet inspection
    cannot catch replayed valid commands, so pair this with stateful baselining. A positive result is
    a concentrated cluster of denials/exceptions from one initiator; isolated, expected exceptions during
    normal operation are benign.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Change Management System Logs
  - 'NAI: Engineering Workstations (EWS) and Operator Stations (HMI) for command origination context;
    ICS Control Network (Purdue Model Levels 1 & 2) for monitoring command transmission to PLCs/RTUs;
    Authentication Servers for user identity correlation; Change Management database for operational context.'
  range: Last 90 days; correlate bursts within 5-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FAIL = modbus.exception OR dnp3.exception OR enip.status IN [denied,aborted] OR fw.action==block

      stats count() as fails by src_ip, dst_device, bin(5m)

      where target_is_critical(dst_device)

      ALERT WHEN fails >= 3

      enrich: join allowlist_miss(src_ip)'
- question: Do command timing and volume deviate from the established operator-workflow baseline for a
    target device — off-hours commands (e.g., after 10 PM local), critical write/operate rates exceeding
    mean+3 standard deviations for that time slice, or sequence transitions whose probability falls below
    0.01 under a Markov model of normal workflows?
  context: Spoofed commands frequently violate the temporal and sequential rhythm of legitimate operator
    activity. Baseline command frequency (commands/min), bytes-per-command, time-of-day, and command-to-operator
    ratios per target device over at least 30 days, then flag off-hours critical commands and rates beyond
    mean+3 sigma for the relevant time slice. Model normal operator workflows as a Markov chain and flag
    sequence transitions with probability below 0.01, which catches commands issued without their usual
    precursors. Complement this with probability-risk scoring of Modbus transactions to surface low-probability
    injected or replayed packets, and use the predicted-vs-observed residual paradigm to set thresholds.
    A positive result is a statistically rare time/volume/sequence pattern consistent with an evading
    adversary; routine operations within baseline are benign.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Change Management System Logs
  - 'NAI: Engineering Workstations (EWS) and Operator Stations (HMI) for command origination context;
    ICS Control Network (Purdue Model Levels 1 & 2) for monitoring command transmission to PLCs/RTUs;
    Authentication Servers for user identity correlation; Change Management database for operational context.'
  range: Last 90 days; baseline over >=30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per dst_device over >=30d: mean,std of cmd_rate by time_slice\nALERT WHEN (hour(t)\
      \ >= 22 OR hour(t) < 5) AND critical_cmd\n  OR cmd_rate > mean+3*std for time_slice\n  OR markov_transition_prob(seq)\
      \ < 0.01"
- question: Did a written register or command value fall outside the normal per-control-point distribution
    (beyond 3 standard deviations or 1.5 IQR), or did PCA residual analysis in the time and frequency
    domains reveal an anomalous process state consistent with spoofed command values?
  context: Even a command from an apparently legitimate source can carry an out-of-range or process-damaging
    value designed to cause Impact. Baseline register/write-value distributions per control point over
    90 days and alert on outliers beyond 3 standard deviations or 1.5 IQR. Apply PCA residual analysis
    in both time and frequency domains to isolate anomalous process states caused by spoofed values, since
    a value that is locally plausible may still push the overall process into an abnormal region. A positive
    result is a write value or process-state residual far outside the learned envelope for that point;
    values within the historical distribution for that control point are benign.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Change Management System Logs
  - 'NAI: Engineering Workstations (EWS) and Operator Stations (HMI) for command origination context;
    ICS Control Network (Purdue Model Levels 1 & 2) for monitoring command transmission to PLCs/RTUs;
    Authentication Servers for user identity correlation; Change Management database for operational context.'
  range: Last 90 days; baseline over 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per control_point over 90d: mean,std,Q1,Q3 of written_value

      ALERT WHEN abs(value-mean) > 3*std OR value < Q1-1.5*IQR OR value > Q3+1.5*IQR

      ALSO run PCA residual on process vars; ALERT WHEN residual > threshold'
- question: Does a One-Class SVM, autoencoder, or sequence-to-sequence model score a command sequence
    as an outlier based on protocol-field and behavioral features (function code, target register, written
    value, inter-command interval, source behavior), especially when paired with recent suspicious host
    activity on the originating HMI or EWS?
  context: Sophisticated spoofing may evade individual rules and per-field statistics yet still produce
    anomalous multi-field command sequences. Train a One-Class SVM or autoencoder on command-sequence
    and protocol-field features (function code, target register, written value, inter-command interval,
    source behavior) and escalate commands scored as outliers, particularly when the originating HMI/EWS
    shows recent suspicious host activity. Use sequence-to-sequence prediction error to catch out-of-sequence
    or injected commands, and surface the top-3 contributing features via Random Forest feature-importance
    so the alert is auditable; optionally attach a token-grounded LLM explanation of the offending Modbus
    fields for operator-friendly triage. A positive result is a high anomaly score with explanatory features
    that match an evasion pattern; commands consistent with learned-normal behavior are benign.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Change Management System Logs
  - 'NAI: Engineering Workstations (EWS) and Operator Stations (HMI) for command origination context;
    ICS Control Network (Purdue Model Levels 1 & 2) for monitoring command transmission to PLCs/RTUs;
    Authentication Servers for user identity correlation; Change Management database for operational context.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [func_code, target_register, written_value, inter_cmd_interval, src_behavior]

      model = OneClassSVM() or Autoencoder() or Seq2Seq() trained on normal commands

      score = model.anomaly(features)

      ALERT WHEN score > threshold; attach top3 RF feature_importance + LLM field explanation

      escalate WHEN originating_host has recent suspicious activity'
- question: On the HMI or EWS that originated an ICS command, did host telemetry show a critical ICS application
    spawned by a non-standard parent process (Windows Event ID 4688), an unexpected USB device, or anomalous
    process memory within a 60-second window of the outbound ICS traffic?
  context: 'SCADA/engineering hosts are low-variability systems, so rare process lineage or unexpected
    peripherals are strong, low-false-positive signals that a command was emitted by adversary tooling
    rather than a legitimate operator. Correlate command emission with host telemetry on the stable HMI/EWS
    that originated it: flag critical ICS applications spawned by non-standard parents (Windows Event
    ID 4688 process creation), unexpected USB device insertions, or anomalous process memory within a
    60-second window of the outbound ICS traffic. A positive result is an ICS command emitted concurrently
    with abnormal host behavior on the origin workstation, strengthening the case for unauthorized command
    injection; commands from a clean, expected process lineage are benign.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Change Management System Logs
  - 'NAI: Engineering Workstations (EWS) and Operator Stations (HMI) for command origination context;
    ICS Control Network (Purdue Model Levels 1 & 2) for monitoring command transmission to PLCs/RTUs;
    Authentication Servers for user identity correlation; Change Management database for operational context.'
  range: Last 90 days; correlate within 60-second windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from Windows 4688 on HMI/EWS where new_process == critical_ics_app\nALERT WHEN parent_process\
      \ NOT IN approved_parents\n  OR usb_insert_event within 60s\n  OR process_memory anomalous\nJOIN\
      \ outbound ICS command from same host within 60s window"
