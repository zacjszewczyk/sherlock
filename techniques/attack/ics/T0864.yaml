questions:
- question: Are there network connections to critical ICS hosts (PLC, HMI, Historian) originating from
    a MAC or IP address that was first seen in the last 30 days and is not present in the authoritative
    ICS asset inventory (CMDB) or the segment-specific device allowlist?
  context: 'A transient cyber asset used for initial access will appear as a device that has not previously
    communicated within the ICS segment and is not documented in the CMDB or approved allowlist. Enumerate
    source_mac and id.orig_h values from Zeek conn.log (and DHCP lease assignments from dhcp.log), determine
    first-seen time per segment, and compare against the authoritative inventory under a deny-by-default
    conduit policy (NIST SP 800-82r3; NSA/CISA AA20-205A). A positive result is an undocumented device
    reaching a critical ICS host; a negative result means every observed device is known and approved.
    This is a primary Initial Access indicator because unauthorized transient devices are the entry vector
    into the OT network. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [NSA/CISA AA20-205A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-205a); [Ghorbani
    et al.](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Network ingress/egress points for ICS zones (e.g., Level 2 Process Control Network, Level 3.5
    Manufacturing Zone), especially within maintenance and engineering VLANs, IT/OT DMZ gateways, core
    ICS network switches, and physical ports where transient devices (e.g., engineering laptops, diagnostic
    tools) connect. Also, Jump Servers and Bastion Hosts within the IT/OT DMZ.'
  range: Last 30 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=zeek sourcetype=conn\n  | eval dev=coalesce(source_mac,id.orig_h)\n  | join type=left\
      \ dev [ inventory_cmdb OR segment_allowlist ]\n  | where isnull(inventory_entry) AND firstseen(dev)\
      \ >= now()-30d AND id.resp_h IN (plc_hmi_historian_list)\n  | table ts, dev, id.orig_h, source_mac,\
      \ id.resp_h, id.resp_p, proto"
- question: Are there spikes in blocked, failed, or rejected connection attempts (conn_state S0, REJ,
    RSTOS0, or conduit-firewall denials) originating from MAC/IP addresses that are absent from the CMDB?
  context: 'Before a successful foothold, a transient device often probes the ICS segment, generating
    failed or denied connection attempts at conduit firewalls and on target hosts. Treat these failure-mode
    signals as a distinct detection: count denied/half-open/rejected connections (Zeek conn.log conn_state
    in S0/REJ/RSTOS0) from devices not in the CMDB and alert on spikes (CISA Defense-in-Depth conduit
    monitoring). A positive result indicates reconnaissance or unauthorized connection attempts by an
    unknown transient device; absence of such spikes lowers suspicion. This complements allowlist alerting
    by catching activity that never completes a session. References: [CISA Defense-in-Depth](https://www.cisa.gov/sites/default/files/recommended_practices/NCCIC_ICS-CERT_Defense_in_Depth_2016_S508C.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Network ingress/egress points for ICS zones (e.g., Level 2 Process Control Network, Level 3.5
    Manufacturing Zone), especially within maintenance and engineering VLANs, IT/OT DMZ gateways, core
    ICS network switches, and physical ports where transient devices (e.g., engineering laptops, diagnostic
    tools) connect. Also, Jump Servers and Bastion Hosts within the IT/OT DMZ.'
  range: Last 30 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=zeek sourcetype=conn conn_state IN (\"S0\",\"REJ\",\"RSTOS0\")\n  | eval dev=coalesce(source_mac,id.orig_h)\n\
      \  | where NOT [inventory_cmdb]\n  | bin _time span=1h | stats count by _time, dev, id.resp_h\n\
      \  | where count > denial_spike_threshold"
- question: Does the daily count of new (previously unseen) devices in any ICS segment exceed its historical
    norm, measured against a per-segment baseline using the 99th percentile or a robust modified z-score
    (|Mi| > 3.5)?
  context: 'A surge of new devices in a segment can indicate uncontrolled introduction of transient assets.
    Baseline the daily new-device count per segment over 30-60 days and alert when today exceeds the 99th
    percentile or when the modified z-score (median absolute deviation based) exceeds 3.5, which resists
    distortion from batch/maintenance events (Modified Z-Score; Dwyer et al.). A positive result flags
    abnormal device churn warranting review against change records; a normal count suggests routine operations.
    This statistical view catches gradual or bulk introduction that single-device allowlisting may not
    prioritize. References: [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Dwyer et al.](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Network ingress/egress points for ICS zones (e.g., Level 2 Process Control Network, Level 3.5
    Manufacturing Zone), especially within maintenance and engineering VLANs, IT/OT DMZ gateways, core
    ICS network switches, and physical ports where transient devices (e.g., engineering laptops, diagnostic
    tools) connect. Also, Jump Servers and Bastion Hosts within the IT/OT DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=zeek sourcetype=conn | eval dev=coalesce(source_mac,id.orig_h)\n  | bin _time\
      \ span=1d\n  | stats dc(new_dev) as new_devices by _time, segment\n  | eventstats median(new_devices)\
      \ as med, mad(new_devices) as mad by segment\n  | eval mz=0.6745*(new_devices-med)/mad\n  | where\
      \ abs(mz)>3.5 OR new_devices>p99(new_devices)"
- question: For each newly observed device-to-ICS-host connection edge, how novel is that edge when scored
    with a Bayesian new-edge anomaly model, and does it terminate on a PLC, HMI, or Historian?
  context: 'Not every new edge is malicious; some are expected (e.g., a new workstation talking to a known
    print server). Compute a Bayesian new-edge prediction probability for each device->host edge to separate
    genuinely novel edges from expected ones (Metelli and Heard), then prioritize low-probability edges
    terminating on critical ICS hosts. A positive result is a high-anomaly edge to a PLC/HMI/Historian,
    which strongly suggests an unauthorized transient asset gaining trusted access; expected edges score
    low and are deprioritized. This focuses analyst attention on the riskiest connectivity changes. References:
    [Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Network ingress/egress points for ICS zones (e.g., Level 2 Process Control Network, Level 3.5
    Manufacturing Zone), especially within maintenance and engineering VLANs, IT/OT DMZ gateways, core
    ICS network switches, and physical ports where transient devices (e.g., engineering laptops, diagnostic
    tools) connect. Also, Jump Servers and Bastion Hosts within the IT/OT DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=zeek sourcetype=conn | eval edge=coalesce(source_mac,id.orig_h).\"->\".id.resp_h\n\
      \  | bayesian_new_edge_prob(edge, history=90d) as p_new\n  | where p_new < 0.01 AND id.resp_h IN\
      \ (plc_hmi_historian_list)\n  | sort p_new"
- question: Do connections from new/transient devices contain flow-level outliers (orig_bytes, resp_bytes,
    duration, destination port, protocol, peer count) when scored with an Isolation Forest tuned to a
    contamination threshold?
  context: 'Unauthorized transient assets often exhibit flow characteristics that differ from normal ICS
    traffic (large transfers, unusual ports, long durations, many peers). Train an Isolation Forest on
    Zeek conn.log features and alert on outliers above the contamination-tuned threshold, surfacing the
    top-3 contributing features (e.g., dest_port, byte_ratio, duration) via per-feature path length for
    analyst triage (Liu et al.). A positive result is an anomalous flow profile from a device that may
    be a malicious transient asset; inliers reflect normal communication. This unsupervised method catches
    novel behavior without prior labels. References: [Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Network ingress/egress points for ICS zones (e.g., Level 2 Process Control Network, Level 3.5
    Manufacturing Zone), especially within maintenance and engineering VLANs, IT/OT DMZ gateways, core
    ICS network switches, and physical ports where transient devices (e.g., engineering laptops, diagnostic
    tools) connect. Also, Jump Servers and Bastion Hosts within the IT/OT DMZ.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = conn.log[orig_bytes,resp_bytes,duration,id.resp_p,proto,peer_count]\n  model\
      \ = IsolationForest(contamination=tuned)\n  score = model.decision_function(features)\n  alert if\
      \ score < threshold; emit top3 features by path-length"
- question: When connection/authentication activity is modeled as a graph, which low-probability device-to-host
    edges (e.g., engineering laptop -> PLC) are ranked most anomalous by an unsupervised graph model?
  context: 'Modeling the ICS network as a graph of devices and hosts lets you rank connection edges by
    how unexpected they are given the overall communication structure. Score edges with an unsupervised
    graph model (CyberGraph, Bowman et al.) and rank low-probability device->host edges such as an engineering
    laptop suddenly talking to a PLC. A positive result is a high-rank anomalous edge representing a transient
    asset reaching control equipment it should not touch; routine edges rank low. This graph-based view
    captures relational anomalies that per-flow methods miss. References: [CyberGraph, Bowman et al.](https://www.usenix.org/system/files/raid20-bowman.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Network ingress/egress points for ICS zones (e.g., Level 2 Process Control Network, Level 3.5
    Manufacturing Zone), especially within maintenance and engineering VLANs, IT/OT DMZ gateways, core
    ICS network switches, and physical ports where transient devices (e.g., engineering laptops, diagnostic
    tools) connect. Also, Jump Servers and Bastion Hosts within the IT/OT DMZ.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  G = build_graph(conn.log edges device->host, auth edges)\n  model = unsupervised_graph_embedding(G)\n\
      \  rank edges by edge_probability ascending\n  alert top-N low-probability device->ICS-host edges"
- question: Is a known transient cyber asset connecting to destination IPs/ports or using protocols that
    are not on its per-asset allowlist, matching threat-intelligence indicators, or reaching external
    networks outside documented maintenance windows?
  context: 'A legitimate transient asset can be compromised and then misused. Enforce per-asset destination/protocol
    allowlists and alert when a known asset (matched by id.orig_h or source_mac in the inventory) connects
    to non-allowlisted IPs/ports, uses protocols absent from its baseline, hits TI-matched IPs/domains
    (Zeek dns.log/http.log), or reaches external networks outside maintenance windows (NIST SP 800-82r3;
    NSA/CISA AA20-205A). A positive result indicates the asset is behaving outside its sanctioned role,
    a strong sign of compromise enabling initial access; allowlist-conforming activity is benign. This
    pins detection to authorized usage policy. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [NSA/CISA AA20-205A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-205a).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: Network ingress/egress points for ICS zones, especially at the boundaries of Level 2/3.5 networks,
    Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historians, Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), and network gateways connecting the Process Control Network
    (PCN) to corporate IT or external networks. Also, the transient asset''s point of connection to the
    ICS network and any associated management/maintenance VLANs.'
  range: Last 60 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=zeek sourcetype IN (conn,dns,http) | eval dev=coalesce(source_mac,id.orig_h)\n\
      \  | where dev IN (transient_inventory)\n  | where NOT match_allowlist(dev,id.resp_h,id.resp_p,proto)\n\
      \     OR ti_match(id.resp_h,query)\n     OR (is_external(id.resp_h) AND NOT in_maintenance_window(_time))\n\
      \  | table _time,dev,id.resp_h,id.resp_p,proto,query"
- question: Is a known transient asset issuing ICS flows or write/operate function codes that violate
    an auto-generated device/flow specification (allowed peers, protocol fields, function codes)?
  context: 'Specification-based detection generates a model of what a device is allowed to do (permitted
    peers, protocol fields, function codes) and flags any deviation. Auto-generate specs for transient
    assets and alert when one issues flows or write/operate function codes that violate the spec (Sen
    et al.), deploying Zeek/SMB rule content (SigmaHQ). A positive result is a transient asset performing
    protocol operations it should never perform (e.g., a diagnostic laptop issuing PLC writes), indicating
    misuse for impact or persistence; spec-conforming flows are normal. This catches protocol-level abuse
    that volume/IP allowlisting alone would miss. References: [specification-based detection, Sen et al.](https://arxiv.org/abs/2209.04354);
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: Network ingress/egress points for ICS zones, especially at the boundaries of Level 2/3.5 networks,
    Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historians, Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), and network gateways connecting the Process Control Network
    (PCN) to corporate IT or external networks. Also, the transient asset''s point of connection to the
    ICS network and any associated management/maintenance VLANs.'
  range: Last 60 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  for flow in conn/dnp3/modbus where orig in transient_inventory:\n    spec = device_spec[flow.orig]\n\
      \    if flow.peer not in spec.peers OR flow.func_code in spec.forbidden_writes\n       OR flow.proto_field\
      \ violates spec: alert(flow)"
- question: Does a known transient asset's destination IP/port set, protocol mix, or hourly data volume
    deviate beyond the 99th percentile or a z-score > 3 (modified z |Mi| > 3.5) from its established 60-day
    behavioral baseline?
  context: 'Build a per-asset behavioral profile: the set of destination IPs/ports, protocol mix, and
    hourly byte volume (orig_bytes+resp_bytes) over 60 days. Alert when current behavior exceeds the 99th
    percentile or a z-score of 3 (use modified z > 3.5 for robustness), and model profile drift probabilistically
    (Dirichlet-process profiling, Heard et al.; Modified Z-Score). A positive result is a statistically
    significant behavioral shift in a known asset, suggesting compromise; in-profile behavior is benign.
    This statistical baseline detects subtle deviations without explicit allowlists. References: [Modified
    Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly); [Dirichlet-process
    profiling, Heard et al.](https://www.researchgate.net/publication/310500555_Network-wide_anomaly_detection_via_the_Dirichlet_process).'
  answer_sources:
  - Zeek conn.log
