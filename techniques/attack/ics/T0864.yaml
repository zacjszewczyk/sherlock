- question: Does a Gradient Boosting classifier flag a transfer+execution pair as malicious with confidence
    > 0.85, based on file size/entropy, extension, path, transfer protocol, parent process, and command-line
    tokens?
  context: 'Supervised classification combines many features of the transfer-execution event into a single
    malicious-probability score. Train a Gradient Boosting model on file size/entropy, extension, path,
    transfer protocol, parent process, and command-line tokens, alerting when malicious confidence exceeds
    0.85 and surfacing the top-3 contributing features (Mandiant ML feature approach). A positive result
    is a high-confidence malicious transfer-execution pair on an ICS host; low scores indicate benign
    administrative activity. This method weighs multiple weak signals together for higher precision than
    single-feature rules. References: [Mandiant Obfuscated Command Line Detection](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).'
  answer_sources:
  - Zeek files.log
