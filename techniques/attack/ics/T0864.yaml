- question: Does a known transient asset's hourly byte volume or connection frequency breach an ARIMA
    forecast confidence band, and are its failure-mode signals (failed/blocked connections, conn_state
    REJ/S0, NXDOMAIN) elevated?
  context: 'Time-series forecasting predicts expected per-asset hourly volume and connection frequency
    with confidence bands; breaches indicate anomalous activity (Pena et al.). Separately track failure-mode
    signals — failed/blocked connection rate, conn_state REJ/S0, and NXDOMAIN responses in dns.log — as
    a distinct alert, since malware beaconing or scanning generates such failures. A positive result is
    a forecast breach or a spike in failed/NXDOMAIN activity for the asset, suggesting compromise or C2
    attempts; values within bands are normal. Forecasting adapts to seasonality better than static thresholds.
    References: [Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: Network ingress/egress points for ICS zones, especially at the boundaries of Level 2/3.5 networks,
    Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historians, Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), and network gateways connecting the Process Control Network
    (PCN) to corporate IT or external networks. Also, the transient asset''s point of connection to the
    ICS network and any associated management/maintenance VLANs.'
