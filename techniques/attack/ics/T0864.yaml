    query: ">-\n  kit = KitNET(features=conn/dns/http per-asset)\n  rmse = kit.process(flow)\n  alert\
      \ if rmse > learned_threshold; emit top3 error features\n  cross-check with IsolationForest(flow_features)"
- question: Was an executable or script (.exe, .dll, .bat, .ps1, .vbs, .py) transferred from a transient
    asset to an ICS host and then executed within 5 minutes, where a Windows Event ID 4688 New Process
    Name matches the transferred filename?
  context: 'Malware propagation from an infected transient asset typically follows a transfer-then-execute
    pattern. Correlate file transfers seen in Zeek files.log/smb_files.log/http.log (with executable/script
    extensions) from a transient asset to an ICS host with a Windows 4688 process creation within 5 minutes
    where the New Process Name matches the transferred filename (SigmaHQ; NIST SP 800-82r3 application
    allowlisting). A positive result is a strong, high-fidelity indicator of malware delivery and execution
    on an ICS endpoint; absence means transfers were not executed. This temporal correlation is one of
    the most actionable signals in the playbook. References: [SigmaHQ](https://github.com/SigmaHQ/sigma);
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek smb_files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historians, file servers, and
    other Windows-based servers within the Process Control Network (PCN), especially endpoints configured
    to accept file transfers from transient devices. Also, network segments where transient assets connect
    and hosts within those segments, and IT/OT DMZ file transfer zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=zeek sourcetype IN (files,smb_files,http) ext IN (exe,dll,bat,ps1,vbs,py) orig\
      \ IN transient_inventory\n  | rename filename as fn, id.resp_h as host\n  | join host [ index=win\
