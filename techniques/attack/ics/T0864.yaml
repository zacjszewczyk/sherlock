  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per asset: forecast = ARIMA(hourly_vol, freq)\n  alert if observed outside forecast.conf_band\n\
      \  also: stats count(conn_state IN (REJ,S0)) as fails, count(dns.rcode=NXDOMAIN) as nxd by dev,_time\n\
      \  alert if fails>thr OR nxd>thr"
- question: When each transient asset's flows are scored by an online autoencoder ensemble (KitNET) and
    an Isolation Forest baseline, do reconstruction-error spikes indicate anomalous behavior?
  context: 'Online autoencoder ensembles learn normal per-asset traffic and flag reconstruction-error
    spikes in real time (Kitsune/KitNET, Mirsky et al.), complemented by an Isolation Forest baseline
    (Liu et al.). Score each transient asset''s flows and alert on error spikes, surfacing the top-3 highest-error
    features for triage. A positive result is a flow whose reconstruction error exceeds the learned threshold,
    indicating behavior the model never saw during training — consistent with compromise; low-error flows
    are normal. This ML approach adapts continuously and catches novel attack traffic without labels.
    References: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089); [Kitsune code](https://github.com/ymirsky/Kitsune-py);
    [Liu et al.](https://doi.org/10.1145/2133360.2133363).'
