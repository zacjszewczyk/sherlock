name: 'T0864: Transient Cyber Asset'
id: 4e898964-8120-448a-b135-edfa5116bba1
description: Investigate adversary abuse of transient cyber assets (e.g., engineering laptops, diagnostic
  tools, vendor/contractor devices, removable media) that move between external networks and ICS networks
  and may carry malware or be leveraged for trusted access into the Process Control Network. This playbook
  helps an analyst (1) detect new or unknown devices connecting to ICS segments that are absent from the
  authoritative asset inventory (CMDB) or segment allowlists, (2) identify known transient assets that
  deviate from their established behavioral baselines (new destinations/ports/protocols, abnormal data
  volumes, off-maintenance-window or malicious external connections), (3) correlate file transfers from
  transient assets to ICS hosts with subsequent process execution, and (4) surface anomalous administrative/engineering
  commands and unauthorized ICS protocol (DNP3/Modbus) write/operate commands originating from transient-asset
  sessions. It combines symbolic-logic allowlisting, statistical baselining/forecasting, and machine-learning
  anomaly detection across Zeek network logs and Windows endpoint telemetry.
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
