- question: Is a command line from a transient session novel — Jaccard similarity < 0.5 to the per-host
    60-day baseline or character entropy above the 98th percentile — and are failed-command/failed-logon
    (4625) or access-denied rates elevated?
  context: 'Novel or obfuscated commands stand out statistically. Alert when a command line''s Jaccard
    similarity to the per-host 60-day baseline is below 0.5 or its character entropy exceeds the 98th
    percentile, and baseline per-session command volume with a modified z-score for robust cutoffs (Modified
    Z-Score; Dwyer et al.). Separately profile failed-command/failed-logon (4625) and access-denied rates
    as distinct failure-mode signals. A positive result is a previously unseen or obfuscated command,
    or a spike in failures, from a transient session — consistent with intrusion activity; familiar low-entropy
    commands are benign. This catches both novelty and brute-force-style failures. References: [Modified
    Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly); [Dwyer et al.](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
