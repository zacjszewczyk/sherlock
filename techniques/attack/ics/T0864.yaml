      \ 300s AND match(fn)\n  | table transfer._time,exec._time,host,fn,Account_Name"
- question: Do transferred files from transient assets show anomalous filename entropy (>99th percentile),
    file size deviating >10% from per-type baselines, or per-host transfer count/volume exceeding a modified
    z-score of 3.5 — and are blocked-transfer/AV-quarantine or failed-execution events elevated?
  context: 'Statistical features of transferred files can reveal malicious payloads. Alert when filename
    entropy exceeds the 99th percentile (random/obfuscated names), file size deviates more than 10% from
    per-type baselines, or per-host transfer count/volume exceeds a robust modified z-score of 3.5 (Modified
    Z-Score; Dwyer et al.). Separately track blocked-transfer/AV-quarantine and failed-execution events
    as a distinct failure-mode signal. A positive result flags suspicious file characteristics or a spike
    in blocked/failed activity around an ICS host; normal entropy/size/volume is benign. This catches
    malicious transfers even when execution is blocked. References: [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Dwyer et al.](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek smb_files.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historians, file servers, and
    other Windows-based servers within the Process Control Network (PCN), especially endpoints configured
    to accept file transfers from transient devices. Also, network segments where transient assets connect
