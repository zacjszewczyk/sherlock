name: 'T0852: Screen Capture'
id: 90549ee3-c205-4198-baa7-3b4f2c70db11
description: 'Investigate whether an adversary is capturing screen data from Human-Machine Interfaces
  (HMIs), Engineering Workstations (EWS), operator stations, or jump servers in the ICS/OT environment
  to learn process layout, control logic, alarm states, and device schematics. This playbook guides the
  analyst across three observable stages: (1) execution of screen-capture tooling or APIs via process-creation,
  ScriptBlock, and service-install telemetry; (2) creation of image files in unexpected paths or at anomalous
  volume/frequency on HMI/EWS hosts; and (3) outbound network flows that could exfiltrate captured imagery
  out of the OT network. For each stage it pairs deterministic allow-list/symbolic-logic detections with
  statistical baselining and explainable ML so detections remain defensible on tightly constrained ICS
  assets.'
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has any process consistent with screen capture been launched on an HMI, Engineering Workstation,
    operator station, or jump server in the ICS/OT network? Look for known capture utilities (psr.exe,
    SnippingTool.exe, ScreenClippingHost.exe, nircmd savescreenshot, or *nix xwd/scrot/import/gnome-screenshot),
    psr.exe started silently with /start, PowerShell ScriptBlocks containing CopyFromScreen/BitBlt or
    loading System.Drawing, processes absent from the per-host allow-list, or non-allow-listed services
    being installed.
  context: Collection on an ICS network frequently begins with an adversary photographing the operator's
    view to understand process layout, control logic, alarm states, and device interactions visible on
    an HMI. Process-creation telemetry (Windows Event ID 4688 / Sysmon Event ID 1) is the most direct
    evidence of capture tooling running. Matching on file hash and OriginalFileName rather than just process
    name defeats renamed binaries, and correlating PowerShell ScriptBlock logs (Event ID 4104) catches
    fileless capture via the .NET graphics API. New service installs (Event ID 4697) using non-allow-listed
    executables can indicate persistence of a capture mechanism. Because HMIs/EWS run a tightly constrained
    software set, any off-allow-list execution is high-signal; a positive result is a process/script that
    captures the screen on an asset where that should never happen, while a negative result is execution
    limited to approved imaging/reporting tools. Exact invocation strings and field guidance are in
    [Atomic Red Team T1113](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1113/T1113.md),
    the [Sigma Psr.EXE rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_psr_capture_screenshots.yml),
    the [CopyFromScreen API reference](https://learn.microsoft.com/en-us/dotnet/api/system.drawing.graphics.copyfromscreen),
    and the [Sysmon Community Guide](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/process-creation.md).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4697
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Operator Stations, and Jump
    Servers within the ICS/OT network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=process_creation host IN (HMI*, EWS*, OPSTN*, JUMP*) (EventCode=4688 OR EventCode=1)\n\
      | eval img=lower(OriginalFileName)\n| where match(img, \"psr\\.exe|snippingtool\\.exe|screenclippinghost\\\
      .exe|nircmd\\.exe|xwd|scrot|import|gnome-screenshot\")\n    OR (img=\"psr.exe\" AND like(CommandLine,\
      \ \"%/start%\"))\n    OR (lower(ParentImage) IN (\"powershell.exe\",\"pwsh.exe\"))\n    OR NOT [|\
      \ inputlookup approved_apps_by_host]\n| append [search EventCode=4104 (ScriptBlockText=\"*CopyFromScreen*\"\
      \ OR ScriptBlockText=\"*BitBlt*\" OR ScriptBlockText=\"*System.Drawing*\")]\n| append [search EventCode=4697\
      \ NOT ServiceFileName IN [| inputlookup approved_service_bins]]\n| table _time host User Image OriginalFileName\
      \ Hash ParentImage CommandLine"
- question: Across the HMI/EWS fleet, are there statistically rare processes, rare parent-child process
    relationships, or unusual failed-start patterns that suggest screen capture tooling being introduced
    or trialed?
  context: Sophisticated actors often rename binaries or live off the land, so signature matching alone
    is insufficient. Maintaining a 30-day per-host and fleet-wide baseline of processes and their parents
    lets you surface a capture-capable or image-writing process spawned by a parent that has never (or
    <1% historically) spawned it on that host, and processes that appear on <5% of the fleet (rare-parent
    baselining per CAR-2014-11-002). Aggregating per-process counts in 1-hour windows and flagging a median/MAD
    modified Z-score >3.5 resists skew from legitimate batch activity. Separately counting failed process
    starts / access-denied events (4688 with non-zero status, or 4656 failures) exposes constrained or
    trial capture attempts where the adversary is probing for what works. A positive result is anomalous
    rarity or a spike in failures on a normally static OT asset. See the rare-parent baselining approach
    in [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/) and the robust outlier scoring
    in [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4697
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Operator Stations, and Jump
    Servers within the ICS/OT network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=process_creation (EventCode=4688 OR EventCode=1) host IN (HMI*, EWS*)

      | stats count earliest(_time) as first by host, ParentImage, Image

      | join type=left ParentImage Image [| inputlookup baseline_parent_child_30d]

      | eval rare_pair=if(isnull(baseline_count) OR baseline_count/total<0.01,1,0)

      | eventstats dc(host) as fleet_hosts by Image | eval rare_fleet=if((host_count/fleet_hosts)<0.05,1,0)

      | where rare_pair=1 OR rare_fleet=1'
  - technology: SIEM/Stats pseudocode
    query: 'index=process_creation host IN (HMI*, EWS*)

      | bin _time span=1h | stats count as starts, sum(eval(Status!=0)) as failed by host, Image, _time

      | eventstats median(starts) as med, median(abs(starts-median(starts))) as mad by host, Image

      | eval mz=0.6745*(starts-med)/mad

      | where mz>3.5 OR failed>0'
- question: When a suspicious process executes on an ICS asset, does an explainable ML classifier score
    it as malicious/suspicious screen-capture activity with high confidence, and what features drive that
    score?
  context: Layering supervised and unsupervised ML over deterministic rules catches renamed tooling and
    novel techniques. Train a Random Forest or XGBoost classifier (TF-IDF over command-line and API tokens)
    on labeled benign/malicious process events from this specific ICS environment using features like
    process name, parent name, command-line length and Shannon entropy, user context, process path, integrity
    level, and imaging APIs invoked (BitBlt, CopyFromScreen, GdipCreateBitmapFromScan0). Alerts firing
    at confidence >0.90 MUST print the top-3 contributing features (via SHAP/LIME) so an analyst can validate
    the verdict rather than trusting a black box. A parallel one-class model (Isolation Forest / OCSVM)
    trained only on benign data catches tooling the supervised model has never seen. A positive result
    is a high-confidence verdict whose attribution names capture-relevant features (e.g., parent=powershell.exe,
    api=CopyFromScreen, high cmdline entropy). This feature/model choice follows the best-performing setup
    in the [Mal-API-2019 evaluation](https://arxiv.org/abs/2403.02232), with explainability per [SHAP in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    and the unsupervised novelty approach per [Robust IoT Isolation Forest/OCSVM](https://www.nature.com/articles/s41598-025-20445-4).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4697
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Operator Stations, and Jump
    Servers within the ICS/OT network.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feats = tfidf(cmdline_tokens + api_tokens) + [proc_name, parent_name,\n        cmdline_len,\
      \ cmdline_entropy, user_ctx, proc_path, integrity_level,\n        api_BitBlt, api_CopyFromScreen,\
      \ api_GdipCreateBitmapFromScan0]\nclf = XGBoost.load('hmi_screencap_model')\np = clf.predict_proba(feats)\n\
      if p['malicious'] > 0.90: alert(event, top3=shap_explain(clf, feats))\n# parallel novelty detector\n\
      if IsolationForest.fit(benign).decision_function(feats) < thr: alert_novel(event)"
- question: Has an image file (.png, .jpg, .jpeg, .bmp, .gif, .tiff, .mht) been created on an HMI or EWS
    by a process not on the approved image-generating allow-list, or written to a temporary/non-standard
    staging directory?
  context: 'After capturing the screen, the adversary must write the image somewhere before exfiltration.
    Object-access auditing (Windows Event ID 4663/4656) or Sysmon Event ID 11 reveals these writes. Alert
    when an image/capture-extension file is created and either the creating process is not on the per-host
    allow-list of approved image-generating applications (HMI reporting/trending tools), or the path is
    a non-standard staging location such as %TEMP%, %APPDATA%, C:\Windows\Temp, or a ProgramData subdir.
    Correlating the writer back to the process-creation detection is powerful: psr.exe writing .mht and
    powershell.exe writing .png/.bmp are high-fidelity indicators. A positive result is an image dropped
    by unexpected tooling or into a staging path on an asset that legitimately produces images only via
    known reporting tools. psr.exe writing .mht and powershell.exe writing .png/.bmp are high-fidelity
    per [Atomic Red Team T1113](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1113/T1113.md)
    and [MITRE T0852](https://attack.mitre.org/techniques/T0852).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - 'NAI: Local file systems of HMIs and EWS, focusing on temporary directories (%TEMP%, C:\Windows\Temp),
    user profiles, and staging directories used for data transfer.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=file_audit host IN (HMI*, EWS*) (EventCode=4663 OR EventCode=4656 OR EventCode=11)\n\
      | eval ext=lower(replace(ObjectName, \".*\\.\", \"\"))\n| where ext IN (\"png\",\"jpg\",\"jpeg\"\
      ,\"bmp\",\"gif\",\"tiff\",\"mht\")\n| where NOT [| inputlookup approved_image_apps_by_host]\n  \
      \  OR match(ObjectName, \"(?i)\\\\Temp\\\\|\\\\AppData\\\\|Windows\\\\Temp|ProgramData\")\n| table\
      \ _time host ProcessName ObjectName ext"
- question: Is the volume or frequency of image-file creation on an HMI/EWS anomalously high, or do new
    image filenames/directories show high entropy or distribution shift consistent with bulk screen capture?
  context: Bulk collection produces many images in a short window, which a per-host 30-day baseline can
    detect. Alert when the current hour's image-file count exceeds the 99th percentile OR a median/MAD
    modified Z-score >3.5 (robust to scheduled report-generation skew). Capture the Volume signal (total
    bytes of newly written images/hour) and Frequency (files/min) explicitly, since a burst is characteristic
    of bulk capture. Scoring new filenames/directory names with Shannon entropy (flag mean per-char entropy
    >4.0) and comparing against the host's historical filename distribution via KL divergence reduces
    false positives from random temp names. Track failed image writes (4656 access-denied) as a distinct
    State signal indicating constrained capture attempts. A positive result is a burst or high-entropy
    naming pattern that deviates from the asset's steady reporting rhythm. The robust modified Z-score is
    described in [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    and entropy-based naming analysis in [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - 'NAI: Local file systems of HMIs and EWS, focusing on temporary directories (%TEMP%, C:\Windows\Temp),
    user profiles, and staging directories used for data transfer.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=file_audit host IN (HMI*, EWS*) ext IN (png,jpg,jpeg,bmp,gif,tiff,mht)

      | bin _time span=1h

      | stats count as files, sum(FileSize) as bytes, sum(eval(EventCode=4656 AND Status="denied")) as
      failed by host, _time

      | eventstats median(files) as med, median(abs(files-median(files))) as mad, p99(files) as p99 by
      host

      | eval mz=0.6745*(files-med)/mad

      | where files>p99 OR mz>3.5 OR failed>0'
  - technology: SIEM/Stats pseudocode
    query: '... per new filename compute shannon_entropy(name)

      | where mean_char_entropy>4.0

      | eval kl=kl_divergence(host_filename_dist_today, host_filename_dist_baseline)

      | where kl > threshold'
- question: Does a sequence model of normal file-creation rhythm on an HMI/EWS flag anomalous image-creation
    sequences, and which features drive the anomaly?
  context: Legitimate ICS reporting tools create images on a predictable schedule; an adversary capturing
    screens breaks that rhythm. Train an LSTM autoencoder (or sequence model, per DeepLog) on per-host
    event vectors {time-of-day, day-of-week, creating-process, target-path-class, file-size-bucket} from
    benign operation to learn the normal cadence. Alert when reconstruction error exceeds a dynamic threshold
    (e.g., 3 MAD above the rolling error distribution), and surface the top-3 reconstruction-error features
    (e.g., process, path-class, hour) for triage. Run a parallel Isolation Forest over the same features
    for a low-latency, label-free baseline. A positive result is an image-creation sequence that the model
    cannot reconstruct well, with attribution pointing at an off-hours write, unexpected process, or unusual
    path-class. The sequence-modeling approach follows [DeepLog](https://dl.acm.org/doi/10.1145/3133956.3134015),
    with feature attribution per [SHAP in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)
    and the parallel label-free baseline per [Robust IoT Isolation Forest/OCSVM](https://www.nature.com/articles/s41598-025-20445-4).
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - 'NAI: Local file systems of HMIs and EWS, focusing on temporary directories (%TEMP%, C:\Windows\Temp),
    user profiles, and staging directories used for data transfer.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = vectorize({hour, dow, creating_proc, path_class, size_bucket}) per host\nmodel = LSTM_Autoencoder.load('hmi_filecreate_seq')\n\
      err = reconstruction_error(model, seq)\nif err > rolling_median(err) + 3*rolling_mad(err):\n   \
      \ alert(seq, top3=feature_attribution(model, seq))\n# parallel label-free baseline\nif IsolationForest.fit(benign_feats).predict(feats)==-1:\
      \ alert_iforest(seq)"
- question: Is an HMI or EWS making outbound connections to destinations not on the network allow-list,
    to unexpected ports, or via large HTTP POST/PUT bodies that could carry captured screen images out
    of the OT environment?
  context: Captured screens have value only once exfiltrated. ICS Level 2/3 assets normally talk to a
    fixed, small set of peers, so any new egress edge is high-signal. Query Zeek conn.log, dns.log, and
    http.log for traffic sourced from HMI/EWS IPs and alert when a connection targets a destination IP
    or resolved domain not on the explicit per-asset-class allow-list, when the destination port is outside
    the approved list for that destination, or when an HTTP POST/PUT to a non-whitelisted endpoint carries
    a request body >1MB. Pair this with first-seen-destination logic and failure profiling. A positive
    result is an HMI/EWS reaching an unknown internet or DMZ endpoint, especially via a bulk upload, which
    is anomalous for an OT asset and consistent with data exfiltration following collection. See exfiltration
    feature guidance in [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf) and [Kitsune](https://arxiv.org/abs/1802.09089).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: ICS Network Segments, OT/IT Network Boundary, Purdue Model Level 2/3 systems, ICS DMZ, and Internet
    Gateway.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log | where id.orig_h IN (hmi_ews_ips)

      | where dst NOT IN allowlist[asset_class] OR id.resp_p NOT IN approved_ports[dst]

      | join dns.log on resolved domain not in allowlist

      | union (http.log | where method IN ("POST","PUT") AND host NOT IN allowlist AND request_body_len>1048576)

      | output ts, id.orig_h, id.resp_h, id.resp_p, host, request_body_len'
- question: Compared to its 30-day baseline, is an HMI/EWS sending anomalous outbound data volume, connection
    frequency, or showing elevated connection/upload failure rates by peer?
  context: 'Exfiltration of screen images often shows up as a volumetric anomaly. Profile outbound conn.log
    over 30 days per HMI/EWS and per destination port to baseline orig_bytes (Volume), connections/min
    (Frequency), and duration. Alert when a connection''s orig_bytes exceeds the 99.9th percentile for
    its peer group (e.g., HMI->443) or when 10-minute total outbound volume exceeds a median/MAD modified
    Z-score >3.5 over the host history. Explicitly profile the Failure-Mode State: rates of blocked/denied
    connections (firewall drops), HTTP 4xx/5xx on uploads, and DNS NXDOMAIN from the host, since staging/exfil
    attempts often generate elevated failures before success. A positive result is a volume spike or a
    surge of failed egress/lookups from an asset whose network behavior is normally flat and predictable.
    The robust modified Z-score is described in [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    and the volumetric/lexical exfiltration features mirror [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: ICS Network Segments, OT/IT Network Boundary, Purdue Model Level 2/3 systems, ICS DMZ, and Internet
    Gateway.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'conn.log | where id.orig_h IN (hmi_ews_ips)

      | stats p99.9(orig_bytes) as p999 by id.orig_h, id.resp_p

      | join back: flag conn where orig_bytes>p999

      | bin ts span=10m | stats sum(orig_bytes) as vol by id.orig_h, ts

      | eventstats median(vol) as med, median(abs(vol-median(vol))) as mad by id.orig_h

      | eval mz=0.6745*(vol-med)/mad | where mz>3.5'
  - technology: Zeek/Stats pseudocode
    query: '# failure-mode state signals

      fw_drops by id.orig_h ; http.log status_code>=400 by host ; dns.log rcode=NXDOMAIN by query

      | baseline rates 30d | alert when current rate >> baseline'
- question: Do explainable anomaly-detection models over HMI/EWS network flows flag likely exfiltration
    of captured screen data, and which flow features drive the alert?
  context: Beyond thresholds, online ML models catch subtle exfiltration. Apply an online autoencoder
    ensemble over incremental flow statistics (packet/byte rates, jitter, orig_bytes, duration at multiple
    time decays) to model normal HMI/EWS egress and alert on high reconstruction error (RMSE), per Kitsune.
    In parallel run Isolation Forest / One-Class SVM on conn.log features {dst IP, dst port, protocol,
    orig_bytes, resp_bytes, duration} trained on benign traffic, flagging outliers and small/noise clusters,
    with LIME attribution naming the top-3 features (e.g., orig_bytes, new dst IP, off-hours). Keep the
    deterministic allow-list and percentile rules as the floor; ML runs layered, not as a replacement.
    A positive result is a flow with high reconstruction error or outlier score whose attribution points
    at large orig_bytes to a new destination at an unusual hour. The online autoencoder ensemble follows
    [Kitsune](https://arxiv.org/abs/1802.09089), with the parallel Isolation Forest/OCSVM per [Robust IoT Isolation Forest/OCSVM](https://www.nature.com/articles/s41598-025-20445-4)
    and LIME/SHAP attribution per [SHAP in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: ICS Network Segments, OT/IT Network Boundary, Purdue Model Level 2/3 systems, ICS DMZ, and Internet
    Gateway.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feats = incremental_flow_stats(pkt_rate, byte_rate, jitter, orig_bytes, duration; decays=[1s,10s,1m])\n\
      kitsune = AutoencoderEnsemble.load('hmi_egress')\nif rmse(kitsune, feats) > thr: alert(flow)\niso\
      \ = IsolationForest.fit(benign_conn_feats)\nif iso.predict({dst_ip,dst_port,proto,orig_bytes,resp_bytes,duration})==-1:\n\
      \    alert(flow, top3=lime_explain(iso, feats))"
