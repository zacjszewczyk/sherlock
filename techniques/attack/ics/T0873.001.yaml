  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'build provenance_graph per engineering_workstation from sysmon (proc, file, net);

      score subgraphs; flag pattern: (script_host|remote_admin) -> write(project_file) -> conn(plc:102);

      alert on high anomaly subgraph; emit explainable_attack_graph; confirm with deterministic rules.'
- question: Does an exported Siemens project file or PLC upload/download artifact diverge in block ordering,
    hardware profile, instruction mix, or function-block reuse from the known-good projects for that cell
    or line?
  context: Structural analysis of project artifacts catches logic that violates expected patterns. Extract
    features from exported Siemens project files and PLC upload/download artifacts, including block ordering,
    hardware profile changes, instruction mix, and reuse of function blocks across controllers. Train
    an unsupervised model on known-good engineering projects for the same cell or line, then flag files
    whose structure or control logic diverges from the expected pattern, complementing ML-mined process
    invariants that modified logic violates. A positive result is a structurally divergent project; a
    negative result is one matching the learned engineering pattern.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [block_order, hw_profile, instruction_mix, fb_reuse];

      model = unsupervised(known_good_projects[cell]);

      score = model.anomaly(project_artifact);

      alert when score > threshold; cross-check against mined process_invariants.'
- question: Do process sensor/actuator telemetry values show reconstruction or prediction anomalies indicating
    the physical effects of maliciously modified control logic, even when network authorization checks
    pass?
  context: Physics-based detection catches the downstream effect of injected logic that bypasses network
    controls. Train a 1D-CNN or PCA model on normal multivariate process telemetry (sensor/actuator values)
    so the physical effects of maliciously modified control logic downloaded from an infected project
    surface as time-series reconstruction or prediction anomalies, even when network authorization checks
    pass. A positive result is a sustained reconstruction/prediction error in process telemetry; a negative
    result is telemetry within the learned normal manifold.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = 1DCNN_or_PCA(normal process_telemetry sensors+actuators);

      err = reconstruction_error(model, live_telemetry);

      alert when err > threshold over sustained window;

      correlate with recent program_download events.'
- question: Has the same Siemens project artifact (by hash) suddenly appeared on multiple hosts or controllers
    in a way that does not match a normal deployment workflow?
  context: Cross-host reuse can reveal worm-like or staged propagation of an infected project. Model relationships
    between project hashes, source hosts, engineering accounts, and PLC targets to identify project files
    that suddenly appear on multiple hosts or controllers. Treat repeated reuse of the same project artifact
    across unrelated engineering stations as suspicious when the timing or target set does not match a
    normal deployment workflow, mirroring Stuxnet's project-file and network-share propagation. A positive
    result is one project hash spreading across unrelated stations/controllers off-workflow; a negative
    result is reuse consistent with sanctioned deployment.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "graph = relate(project_hash -> {src_host, account, plc});\nfor each hash: hosts = distinct(src_host);\
      \ targets = distinct(plc);\nalert when hash appears on multiple unrelated stations/controllers\n\
      \  AND timing/target_set not match deployment_workflow."
