questions:
- question: Which process wrote, renamed, deleted, or created a Siemens engineering project file (e.g.,
    .S7P/.AP*/.MCP/WinCC files) or a STEP 7 communication DLL, and was that process a legitimate engineering
    tool or an unexpected scripting host, remote-administration tool, or non-engineering account?
  context: 'This question targets the core persistence behavior: an adversary touching project files from
    a process that is not the sanctioned engineering software. Audit project folders and shared repositories
    for Windows Event ID 4663 write/rename/delete activity and Sysmon Event ID 11 FileCreate on project
    file types, then correlate with Windows Event ID 4688 / Sysmon Event ID 1 process creation to identify
    the originating process and parent. Flag changes by scripting hosts, remote admin tools, or non-engineering
    accounts, especially when the same host subsequently opens PLC sessions (Zeek conn.log) or transfers
    project artifacts (Zeek files.log). Stuxnet wrote STEP 7/WinCC project files from non-engineering
    processes and replaced s7otbxdx.dll, so any modification of STEP 7 comms DLLs or project files by
    an unexpected parent process is a strong persistence indicator. A positive result is an out-of-band
    process modifying engineering artifacts; a negative result is changes attributable only to approved
    engineering tooling.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'file_evt = win4663 OR sysmon11 where target_file matches ''*.S7P|*.AP*|*.MCP|WinCC*|s7otbxdx.dll''
      and access in (''WriteData'',''Delete'',''Rename'');

      proc = win4688 OR sysmon1 where ts ~ file_evt.ts and host = file_evt.host;

      alert when proc.image not in engineering_tool_allowlist OR proc.user not in engineering_accounts
      OR proc.image in (script_hosts, remote_admin_tools);

      enrich with subsequent conn.log/files.log PLC sessions from same host.'
- question: Did a Siemens project upload or download occur outside an approved maintenance window, from
    an unexpected engineering workstation, or with a file path/name that does not match the cell's normal
    project naming convention?
  context: Persistence via infected project files often appears as a transfer that does not fit the sanctioned
    maintenance workflow. Compare each Siemens project upload/download against the approved maintenance
    window, change ticket, and expected engineering workstation for the target PLC, restricting program-download
    and project-transfer actions to authorized accounts within pre-approved windows as prescribed by NIST
    SP 800-82r3. Alert when a project transfer occurs from a new host, outside the change window, or with
    a path/filename that deviates from the normal convention for that cell. A positive result is a transfer
    with no matching change record or from an unexpected host; a negative result is a transfer fully reconciled
    to an approved change.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "transfers = s7comm_transfers OR files.log where event in ('download','upload','project_transfer');\n\
      join change_calendar on (plc, window);\nalert when transfers.ts NOT within approved_window\n  OR\
      \ transfers.src_host not in expected_workstation[plc]\n  OR transfers.account not in authorized_accounts\n\
      \  OR transfers.filename not match naming_convention[cell]."
- question: Did an S7Comm/S7CommPlus program download to a PLC (TCP/102) originate from a host that is
    not on the approved engineering-workstation allowlist, or from a peer PLC?
  context: Program-download source authentication cannot be assumed on S7 networks. Maintain an explicit
    allowlist of engineering-workstation hosts permitted to perform S7Comm/S7CommPlus program downloads
    to each PLC and alert on any download whose source IP/host is not on the allowlist, or that originates
    from a peer PLC. Rogue7 shows an attacker can impersonate TIA Portal to download malicious logic to
    S7-1500 controllers, and PLC-Blaster shows a worm reprogramming peers, so the source of a program
    download must be enforced and monitored. A positive result is a download from an unlisted host or
    from another controller; a negative result is downloads only from allowlisted engineering stations.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "dl = zeek_s7comm where command in ('download','plc_program_download') and dst_port = 102;\n\
      alert when dl.src_ip not in engineering_workstation_allowlist[dl.dst_ip]\n  OR dl.src_ip in plc_inventory;\n\
      output src, dst, command, ts."
- question: After an authorized change, does the current project file and PLC block inventory match the
    hashed golden reference, or has logic changed without a valid approved engineering transaction?
  context: Stuxnet hooked the comms library to hide modified blocks from the engineer's host view, so
    file-system monitoring alone is insufficient and integrity must be verified against an independent
    golden measurement. Hash known-good project files and the PLC block inventory uploaded after each
    authorized change, and after every subsequent download compare current project/logic against the golden
    reference; reject or alert on any change not backed by a valid approved engineering transaction. This
    applies the signed-update and golden-measurement integrity principle of NIST SP 800-193. A positive
    result is a logic/project hash mismatch with no approved transaction; a negative result is a hash
    matching the golden baseline.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'baseline = golden_hash[plc] captured after approved_change;

      current = hash(upload_block_inventory(plc)) + hash(project_export);

      alert when current != baseline AND no_matching approved_transaction;

      output plc, changed_blocks, baseline_hash, current_hash.'
- question: Are there blocked or rejected S7 connections, failed logons (Windows Event ID 4625) on engineering
    stations, or S7CommPlus session-key/handshake errors that suggest an attacker is probing or impersonating
    the engineering station during a program download?
  context: 'Failure-mode signals are distinct evidence of an adversary attempting to gain or impersonate
    engineering access. Encode an allow/deny specification for engineering-to-PLC traffic and explicitly
    profile failure signals: blocked/rejected S7 connections, failed logons (Windows Event ID 4625) on
    engineering stations, and S7CommPlus session-key/handshake errors during program download, which appear
    when an attacker probes or impersonates the engineering station as in Rogue7. Specification-based
    rules over protocol/command semantics deterministically catch out-of-spec transfers without labeled
    attack data. A positive result is a cluster of handshake errors or failed logons preceding a successful
    transfer; a negative result is clean, spec-conformant sessions.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "failures = (zeek_s7comm where status in ('rejected','handshake_error','session_key_error'))\n\
      \  OR (win4625 where host in engineering_stations);\nspec_violation = s7_traffic NOT conform engineering_to_plc_spec;\n\
      alert when count(failures) over 10m >= threshold OR spec_violation;\ncorrelate failures preceding\
      \ any successful download."
- question: Does a Siemens project download's frequency, duration, or transferred bytes exceed the normal
    baseline for that workstation/PLC pair, or occur after hours without a matching change record?
  context: Infected-project activity can manifest as abnormal transfer volume or timing. Build per-workstation
    and per-PLC baselines for Siemens project download frequency (count/min), transfer duration, and bytes
    transferred during authorized maintenance periods. Use rolling percentiles over historical Zeek conn.log
    and files.log sessions to flag transfers exceeding the 95th percentile for the asset pair or occurring
    after hours without a matching change record; derive per-site thresholds from each cell's own maintenance
    history per NIST SP 800-82r3. A positive result is a transfer above the learned 95th percentile or
    off-hours without a change record; a negative result is volume within normal range.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats by (src_host, plc): p95_count, p95_bytes, p95_duration over 90d maintenance;\ncur =\
      \ conn.log+files.log per project_transfer;\nalert when cur.count > p95_count OR cur.bytes > p95_bytes\
      \ OR cur.duration > p95_duration\n  OR (cur.ts after_hours AND no change_record)."
- question: Compared to the prior known-good version, does a project export show an abnormal block-count
    change, configuration delta, or logic growth rate for that PLC model or engineering team?
  context: Infected project files often add a small but consistent amount of malicious content. Compare
    current project exports against prior known-good versions to measure block count changes, configuration
    deltas, and logic growth rate. Flag files whose size, block delta, or change density deviates sharply
    from the historical range for that PLC model or engineering team; Stuxnet prepended code and added
    blocks such as DB890 and OB1/OB35 to the controller. A positive result is a block/logic delta outside
    the historical band; a negative result is a delta consistent with routine engineering changes.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prev = known_good_export[plc].version_prior;\ncur = current_export[plc];\ndelta = diff_blocks(prev,\
      \ cur);\nalert when abs(delta.block_count) OR delta.config_delta OR delta.growth_rate\n  outside\
      \ historical_range[plc_model, eng_team];\nhighlight added_blocks (e.g., new OB/DB)."
- question: Does the normally periodic PLC-to-server and engineering-station traffic show a missing, delayed,
    or extra message such as an unscheduled program-download burst or an off-cycle engineering session
    that breaks the learned periodicity?
  context: ICS traffic is typically highly periodic, so deviations in timing reveal injected activity.
    Model the periodic PLC-to-server and engineering-station traffic with phase-aware timing/sequence
    models and flag missing, delayed, or extra messages such as an unscheduled program-download burst
    or an off-cycle engineering session that breaks the learned periodicity. A positive result is a phase
    shift or an extra off-cycle program-download event; a negative result is traffic conforming to the
    learned periodic pattern.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model = phase_timing_model(plc_server_traffic, eng_station_traffic) over 90d;\nfor each msg:\
      \ expected_phase = model.predict(ts);\nalert when observed deviates (missing | delayed | extra)\n\
      \  especially unscheduled program_download_burst or off_cycle engineering_session."
- question: Is a PLC programming interface being contacted by a never-before-seen source host, or is an
    engineering station opening a first-time connection to a project repository or PLC?
  context: New host-to-host edges to programming interfaces are a strong signal of rogue engineering activity.
    Apply Bayesian new-edge scoring to host-to-host connections so a PLC programming interface contacted
    by a never-before-seen source host, or an engineering station opening a first-time edge to a project
    repository or PLC, is flagged while genuinely expected new connections are suppressed. A positive
    result is a high-scoring new edge into the programming interface; a negative result is a connection
    between an already-established host pair.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'graph = historical_edges(src_host -> {plc:102, project_repo}) over 90d;

      for each new_conn: score = bayesian_new_edge(src, dst, graph);

      alert when score > threshold AND dst in (plc_programming_iface, project_repo);

      suppress expected_new_edges.'
- question: Among all project-transfer events, which ones are statistical outliers across source host,
    account, file path/size, block delta, transfer bytes/duration, and time-of-day, and what features
    make them rare?
  context: Unsupervised outlier detection surfaces rare malicious transfers without labeled data. Train
    an Isolation Forest on per-event project-transfer features (source host, account, file path/size,
    block delta, transfer bytes/duration, time-of-day) to isolate rare writes/downloads in linear time
    without labels, and surface the top-3 contributing features in the alert (e.g., new source host +
    off-hours + abnormal block delta) for analyst triage. A positive result is a high anomaly score with
    explanatory top features; a negative result is an event resembling the bulk of normal transfers.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
  - Zeek s7comm.log
  - PLC CPU logs
  - 'NAI: Engineering workstations, Siemens project repositories, and PLC programming paths on the OT
    network where project uploads and downloads are expected.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [src_host, account, file_path, file_size, block_delta, bytes, duration, hour];

      model = IsolationForest(project_transfer_events);

      score = model.decision_function(event);

      alert when score in top_outliers; output top3 contributing_features.'
- question: On engineering workstations, is there an anomalous process->file->network subgraph, such as
    a scripting host or remote-administration tool writing a Siemens project file and then opening a PLC
    session?
  context: Whole-system provenance reconstructs the attack chain on an engineering host. Build provenance
    graphs on engineering workstations and score anomalous process->file->network subgraphs, such as a
    scripting host or remote-administration tool writing a Siemens project file and then opening a PLC
    session, reconstructing a compact explainable attack graph for triage. Pair ML scores with the deterministic
    rules above and never rely on the score alone, because ML industrial intrusion detectors can generalize
    poorly against evasive attacks. A positive result is a high-scoring subgraph linking an unexpected
    process to project-file writes and a PLC session; a negative result is normal engineering-tool provenance.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4624/4625
  - Sysmon Event ID 1/11
  - Zeek conn.log
  - Zeek files.log
