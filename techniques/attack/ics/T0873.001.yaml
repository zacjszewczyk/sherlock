name: 'T0873.001: Siemens Project File Format'
id: 43ac85ee-882d-4714-b3a6-4b59a607dd44
description: Investigate possible infection or unauthorized modification of Siemens PLC project files
  (STEP 7, TIA Portal, WinCC, etc.) used to achieve persistence, execution, and lateral movement in an
  ICS environment. This playbook helps an analyst detect unauthorized creation, modification, replacement,
  or export of Siemens engineering project files on workstations, and unexpected PLC upload/download sequences
  that introduce altered blocks, hardware-configuration changes, or logic not approved for the target
  controller. It correlates project-file writes with the originating process and account, verifies transfers
  against approved change windows and engineering-station allowlists, checks project and PLC-logic integrity
  against golden baselines, profiles failed or blocked S7 download attempts, and applies statistical,
  timing, new-edge, and machine-learning methods (Isolation Forest, provenance graphs, structural analysis,
  physics-based telemetry models, and cross-host reuse correlation) to surface activity reminiscent of
  Stuxnet, Rogue7, and PLC-Blaster.
type: technique
