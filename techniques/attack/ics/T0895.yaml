  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  seq = api_or_sysmon_sequence(process spawned from non_fixed_drive)\n  lstm_score = LSTM.predict(seq)\n\
      \  graph = provenance_graph(mount -> process -> file -> network)\n  node_scores = ThreaTrace.score(graph)\n\
      \  if lstm_score anomalous OR any(node_scores anomalous AND lineage->non_fixed_volume):\n     alert(contributing_nodes_edges)"
- question: Did a hypervisor virtual-disk-attach correlate with a guest-OS disk initialization, a process
    creation from the new volume within 60 seconds, and an outbound connection from that process to a
    blocklisted IP or non-browser HTTP/S endpoint?
  context: 'This deterministic correlation addresses the virtual-media variant of AutoRun under the Execution
    tactic, where an adversary with hypervisor management access attaches a malicious ISO/VMDK to a guest
    VM so it auto-executes without prior remote access. Join the hypervisor ''virtual disk attach'' event
    with the guest OS disk-initialization event (Windows System Log Event ID 15). Alert if within 60 seconds
    a process is created (Sysmon Event ID 1) from the new disk volume and that process initiates a network
    connection (Sysmon Event ID 3 or Zeek conn.log) to a threat-blocklist IP or as a non-browser HTTP/S
    initiator. Because virtualized HMIs/EWS/historians/domain controllers in the ICS DMZ rarely receive
    ad-hoc disk attaches followed by immediate execution and egress, a positive is a high-confidence Execution
    indicator. Source references: [Sysmon Event ID 3 reference](https://www.elastic.co/docs/reference/security/prebuilt-rules/audit_policies/windows/sysmon_eventid3_network_connection).'
  answer_sources:
