- question: Does a multivariate anomaly model (Isolation Forest / autoencoder) over 1-minute VM windows
    flag a window in the top 1% — especially one where a virtual disk was mounted — based on process/network/byte/DNS/blocked-connection
    counts?
  context: 'This ML method provides behavioral coverage for critical ICS VMs (EWS, Historians) under the
    Execution tactic, catching subtle anomalies that single-event rules miss. Aggregate per 1-minute window:
    process-creation count, network-connection count, total bytes sent, unique-DNS count, blocked-connection/NXDOMAIN
    counts, and a binary vdisk_mounted_in_window flag. Train an Isolation Forest or autoencoder/VAE on
    a 30-day baseline, then alert on windows scoring in the top 1%, prioritizing those with vdisk_mounted_in_window
    true. Surface the top-3 contributing features in the alert so analysts understand what drove the score.
    Retain deterministic disk-attach correlation rules in parallel. A top-percentile window coinciding
    with a vdisk mount and elevated process/network/egress counts is a strong indicator of disk-image-driven
    execution and follow-on activity. Source references: [Isolation Forest (Liu et al.)](https://doi.org/10.1145/2133360.2133363);
    [Anton et al.](https://arxiv.org/abs/1907.10374); [Kus et al.](https://arxiv.org/abs/2205.09199).'
