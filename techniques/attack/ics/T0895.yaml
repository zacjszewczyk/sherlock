- question: Was a virtual disk image attached to an ICS VM outside approved maintenance windows or by
    an administrative account not on the hypervisor change-control allowlist, especially when followed
    by process execution from the new volume?
  context: 'This policy-and-access detection ties hypervisor governance to the Execution tactic. Legitimate
    disk attaches to ICS VMs should occur only within sanctioned change windows by allowlisted admin accounts.
    Alert when hypervisor logs show a virtual disk attach to an ICS VM outside approved windows, or performed
    by an admin account absent from the change-control allowlist — and escalate sharply if it is followed
    by process execution from the new volume. A positive suggests either an insider abusing privileges
    or an external actor who has compromised the hypervisor management interface to deploy a malicious
    AutoRun image. Ground change-control allowlists, removable/virtual-media policy, and AutoRun disabling
    in NIST SP 800-82r3. A negative supports normal, governed virtualization operations. Source references:
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
