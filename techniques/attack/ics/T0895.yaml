- question: After a process launched from a newly mounted virtual disk, were its DNS queries highly novel
    (Jaccard similarity < 0.10 to the VM's 30-day history, elevated NXDOMAIN) or did its outbound:inbound
    byte ratio exceed the VM's 95th-percentile historical value?
  context: 'This statistical method detects C2/exfiltration following virtual-disk execution under the
    Execution tactic. For any process launched from a newly mounted virtual disk, analyze subsequent DNS
    queries (Sysmon Event ID 22 or Zeek dns.log). Compute the Jaccard similarity between domains queried
    in the first 10 minutes and the set of all unique domains the VM queried over 30 days; alert if below
    0.10, indicating the process is reaching entirely new infrastructure. Use stateless lexical features
    (entropy, char/length counts) with an Isolation Forest to score DNS tunneling/exfiltration even at
    low throughput, and profile the NXDOMAIN failure-mode rate as a distinct signal (DGA/failed-resolution
    bursts). Additionally alert when the outbound:inbound byte ratio (orig_bytes/resp_bytes) exceeds the
    VM''s 95th-percentile historical value (Volume). Derive all thresholds from your own data. A positive
    across DNS novelty and egress ratio strongly suggests the disk-launched process is communicating with
    adversary infrastructure. Source references: [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
