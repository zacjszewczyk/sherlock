name: 'T0895: Autorun Image'
id: a49bc936-2ea1-4a23-8024-743853b95a11
description: 'Investigate whether an adversary leveraged AutoRun/AutoPlay functionality or virtual disk
  images (ISO/VMDK/VHD) to execute malicious code on ICS endpoints and virtualized assets. This playbook
  helps an analyst hunt for two primary scenarios: (1) a process spawned from removable media (a non-fixed
  drive such as USB) within 30 seconds of the media being mounted on an HMI, Engineering Workstation (EWS),
  data historian, or PCN/ICS-DMZ server — where the executable is unsigned, matches a known IOC, exhibits
  abnormally high file/filename entropy, or is accompanied by an autorun.inf file; and (2) a process launched
  from a newly mounted virtual disk image on a guest VM within 60 seconds of a hypervisor disk-attach,
  particularly when the attach occurs outside change control or by a non-allowlisted admin account. In
  both cases the playbook correlates the media/disk mount with downstream process creation, first network
  connections, DNS novelty, data-egress byte ratios, and out-of-spec ICS control traffic (DNP3/Modbus/IEC
  61850). Success/failure states — blocked executions, access-denied on the volume, failed logons, blocked
  egress, and elevated NXDOMAIN — are profiled as distinct signals. Deterministic symbolic-logic correlation,
  statistical anomaly detection, and machine learning classifiers/sequence/provenance models are provided
  side by side so ML augments but never replaces deterministic IOC/allowlist rules.'
