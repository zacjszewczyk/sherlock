- question: Following execution from a newly mounted virtual disk, did the VM emit out-of-spec, injected,
    or unpaired ICS control messages (DNP3/Modbus/IEC 61850)?
  context: 'This constraint focuses on the impact side of the Execution tactic specific to ICS: code that
    runs from a malicious disk image may attempt to issue unauthorized control commands. Deploy protocol-semantic
    IDS rules for DNP3/Modbus/IEC 61850 to constrain the control traffic a media-launched process may
    emit, and flag any out-of-spec, injected, or unpaired command/response that follows execution from
    the new volume. A positive — for example a write/command function code with no legitimate corresponding
    response, or a command sequence that violates protocol state — indicates the media-launched process
    is manipulating the physical process. This is among the most consequential outcomes in an ICS environment
    and should trigger immediate response. A negative reduces (but does not eliminate) the likelihood
    that execution reached the control layer. Source references: [Distributed IDS semantic rules for SCADA](https://arxiv.org/abs/2412.07917).'
  answer_sources:
