  context: 'This ML method detects signatureless attacks from virtual-disk execution under the Execution
    tactic by reasoning over causality rather than indicators. Apply node-level provenance-graph learning
    (e.g. ThreaTrace) to the guest VM to detect anomalous causal chains rooted at the mounted virtual
    disk: disk-initialization -> process creation -> file/registry writes -> network connections. Alert
    on anomalous nodes whose lineage traces back to the new volume, and present the contributing path
    for analyst triage. This catches novel droppers and living-off-the-land sequences that have no known
    hash or domain. A flagged chain that originates at a freshly attached disk and propagates into persistence
    (registry/file) or egress (network) is a high-confidence Execution lead. Always provide the path so
    analysts can quickly confirm whether the disk-rooted lineage is benign maintenance or malicious. Source
    references: [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Hypervisor API logs (e.g., vSphere, Hyper-V)
  - Windows System Log Event ID 15
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 22
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Virtualization hosts (hypervisors) managing guest VMs in the ICS DMZ or Process Control Network.
    Specific targets include virtualized HMIs, EWS, data historians, and domain controllers. Also includes
    VM templates, golden images, and network egress points monitoring traffic from the virtualization
    cluster.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  graph = provenance_graph(disk_init -> process -> file/registry -> network) on guest_vm\n\
      \  node_scores = ThreaTrace.score(graph)\n  for n in nodes:\n     if node_scores[n] anomalous AND\
      \ lineage(n) traces_to mounted_vdisk:\n        alert(n, contributing_path)"
