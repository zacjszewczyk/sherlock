- question: Does a sequence/provenance model flag an anomalous causal chain (mount -> process -> file
    -> network) originating from a non-fixed volume on an ICS endpoint?
  context: 'This ML method models the runtime behavior, not just the static binary, to catch metamorphic
    droppers under the Execution tactic. Use an LSTM/sequence model over the runtime API/Sysmon call sequence
    of processes spawned from removable media, or apply node-level provenance-graph learning (e.g. ThreaTrace)
    over the mount->process->file->network chain. Alert on anomalous causal chains rooted at a non-fixed
    volume and list the contributing nodes/edges for triage. This is valuable when an adversary repacks
    the same logic to dodge signatures — the behavioral/causal pattern persists even when hashes change.
    A flagged chain whose lineage traces to a USB mount and ends in suspicious network or file activity
    is a high-priority Execution lead. Always present the contributing path so analysts can confirm or
    dismiss quickly. Source references: [LSTM Windows API calls](https://peerj.com/articles/cs-285/);
    [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
