      \ launch_from_media_30s]\n  model = RandomForest|XGBoost.fit(historical_sysmon1 + static_pe_features)\n\
      \  score = model.predict_proba(event)\n  if score > 0.85: alert(event, top3=shap_importance(event))\n\
