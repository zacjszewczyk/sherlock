    (EWS), data historians, and any servers within the Process Control Network (PCN) or ICS DMZ. Includes
    endpoints used for device programming or maintenance updates.'
  range: Last 90 days (join outbound connections within 5 minutes of media-launched process start)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  proc = (sysmon_id=1 Image=\"<non_fixed_drive>\\\\*\")\n  | join host,pid [ search (sysmon_id=3\
      \ OR zeek_conn) where _time>=proc._time AND _time<=proc._time+300s ]\n  | eval bad = (dest_ip IN\
      \ blocklist) OR (proto IN (http,https) AND image NOT IN browsers) OR (action IN (blocked,denied))\n\
      \  | where bad=true | stats count by host,image,dest_ip,action"
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log | filter orig_host in media_launched_hosts AND ts within 5m of proc_start\n\
      \  | where id.resp_h in blocklist OR conn_state in (REJ,S0)"
- question: Did a removable-media-launched executable exhibit packed/encrypted characteristics (absolute
    content entropy >7.2, or filename entropy above the host-class 98th percentile), and was it followed
    by an anomalous network burst within 5 minutes?
  context: 'This statistical method targets obfuscated droppers and their immediate network behavior under
    the Execution tactic. For any process launched from removable media, compute the Shannon entropy of
    both filename and file content. Content entropy above 7.2 indicates packing/encryption typical of
    malware; filename entropy above the host class 98th percentile (from a 30-day rolling baseline) flags
    machine-generated/random names. Concurrently, for five minutes after execution, monitor Zeek conn.log:
    alert if the count of new unique destination IP:port combinations exceeds the host''s 99th-percentile
    hourly rate (Frequency), if the outbound:inbound byte ratio exceeds the 95th percentile (Volume),
    or if blocked-connection/NXDOMAIN counts spike (failure-mode). Derive all thresholds from your own
    30-day data per host class. A positive across entropy AND network burst is a high-confidence indicator
    of media-delivered malware beaconing or exfiltrating. Source references: [Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows System Log Event ID 12
  - Windows System Log Event ID 1006
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Physical USB ports on Windows-based Human-Machine Interfaces (HMIs), Engineering Workstations
    (EWS), data historians, and any servers within the Process Control Network (PCN) or ICS DMZ. Includes
    endpoints used for device programming or maintenance updates.'
  range: Last 90 days (entropy at execution; network burst window = 5 minutes post-execution; baselines
    = 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  media_proc | eval content_entropy=shannon(file_bytes), name_entropy=shannon(filename)\n\
      \  | where content_entropy>7.2 OR name_entropy > pctl98(name_entropy, host_class, 30d)\n  | join\
      \ host [ stats dc(dest_ip+\":\"+dest_port) as uniq, sum(orig_bytes)/sum(resp_bytes) as ratio,\n\
      \      count(eval(action=\"blocked\" OR dns_rcode=\"NXDOMAIN\")) as fails by host within 5m ]\n\
      \  | where uniq>pctl99(uniq,host,1h) OR ratio>pctl95(ratio,host) OR fails>baseline_spike"
- question: Does a supervised classifier (Random Forest/XGBoost) score a removable-media-launched process
    as malicious with probability >0.85 based on parent process, command-line length, path/content entropy,
    unsigned status, and launch-from-media timing?
  context: 'This ML method augments deterministic detection for the Execution tactic by catching novel/zero-day
    media-borne malware that evades IOC lists. Train a binary classifier on historical Sysmon Event ID
    1 process-creation events plus static PE features (section entropy, imports). Features include: parent
    process name (explorer.exe/cmd.exe/svchost.exe are common AutoRun parents), command-line length, executable
    path/content entropy, an unsigned boolean, and a boolean for launch-from-removable-media within 30s
    of a mount. Alert when malicious probability exceeds 0.85 and surface the top-3 contributing features
    (via SHAP or RF importance) directly in the alert text so analysts can validate the reasoning. Keep
    deterministic IOC/allowlist rules running in parallel — the ML score adds coverage, it never replaces
    the explainable rules. A high score with sensible top features (e.g. unsigned + high entropy + media
    launch) is a strong lead. Source references: [XGBoost/RF zero-day malware](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers);
    [CNN-GRU XAI with SHAP/LIME](https://peerj.com/articles/cs-3258/); [Anton et al.](https://arxiv.org/abs/1907.10374);
    [Kus et al.](https://arxiv.org/abs/2205.09199).'
