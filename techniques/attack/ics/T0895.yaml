questions:
- question: Did a process launch from a non-fixed (removable) drive within 30 seconds of a USB/removable-media
    mount on an ICS endpoint, where the executable matched a known malicious IOC, or was unsigned and
    preceded by an autorun.inf file write on the same drive?
  context: 'Under the Execution tactic, AutoRun abuse begins the moment removable media is mounted: a
    malicious autorun.inf or staged executable runs automatically with the privileges of the logged-on
    user. This deterministic correlation joins a removable-device insertion (Windows System Log Event
    ID 12/1006) with a process creation (Windows Event ID 4688 or Sysmon Event ID 1) on the same host
    inside a 30-second window. Treat it as a strong positive when the new process image sits on a non-fixed
    drive letter (e.g. E:\) AND its hash matches a known IOC, or it is unsigned AND a Sysmon Event ID
    11 file-create for autorun.inf occurred on that drive just before execution. On HMIs/EWS/historians,
    legitimate USB execution should be rare and confined to approved maintenance windows, so a hit warrants
    immediate triage. Enforce AutoRun/AutoPlay disabling and removable-media policy per NIST SP 800-82r3;
    where possible mediate the mount at the USB packet layer so unauthorized interfaces never reach the
    OS. Source references: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [USBFILTER](https://www.usenix.org/conference/usenixsecurity16/technical-sessions/presentation/tian).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows System Log Event ID 12
  - Windows System Log Event ID 1006
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Physical USB ports on Windows-based Human-Machine Interfaces (HMIs), Engineering Workstations
    (EWS), data historians, and any servers within the Process Control Network (PCN) or ICS DMZ. Includes
    endpoints used for device programming or maintenance updates.'
  range: Last 90 days (correlate within a 30-second window around each mount event)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=ics (EventCode=12 OR EventCode=1006) -> mount(host, drive, time=t0)\n  | join\
      \ host [ search (EventCode=4688 OR sysmon_id=1) NewProcessName=\"<non_fixed_drive>\\\\*\"\n    \
      \  where _time>=t0 AND _time<=t0+30s ]\n  | eval susp = (hash IN known_iocs) OR (signed=\"false\"\
      \ AND autorun_inf_created_on_drive=true)\n  | where susp=true"
  - technology: Sysmon/pseudocode
    query: ">-\n  EventID=11 TargetFilename ENDSWITH \"autorun.inf\" AND TargetFilename MATCHES \"<removable_drive>\"\
      \n  FOLLOWED-BY EventID=1 Image STARTSWITH \"<removable_drive>\" WITHIN 30s ON same Computer"
- question: Was any process created whose executable path begins with a removable or unknown drive letter
    on an OT endpoint, outside an approved maintenance window and not on the executable allowlist?
  context: 'This is a policy-breach detection tied to the Execution tactic: on hardened ICS hosts, code
    should only ever run from fixed system drives and approved paths. Any process whose image path starts
    with a removable/unknown drive letter is anomalous by default. Alert unless the host is in a sanctioned
    maintenance window or the executable hash is allowlisted. A positive result means code executed from
    media that bypassed expected baseline controls — a direct indicator of AutoRun/removable-media abuse.
    Pair this with an allowlisting USB access controller that admits only enrolled device serials and
    blocks illegal storage/HID/network behavior on insertion. A negative result (no such events) supports
    the hypothesis that media-based execution did not occur in the window. Source references: [USBIPS](https://arxiv.org/abs/2409.12850).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows System Log Event ID 12
  - Windows System Log Event ID 1006
  - Zeek conn.log
  - Zeek files.log
  - 'NAI: Physical USB ports on Windows-based Human-Machine Interfaces (HMIs), Engineering Workstations
    (EWS), data historians, and any servers within the Process Control Network (PCN) or ICS DMZ. Includes
    endpoints used for device programming or maintenance updates.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  search (EventCode=4688 OR sysmon_id=1) NewProcessName=\"<removable_or_unknown_drive>\\\
      \\*\"\n  | where NOT in_maintenance_window(host,_time) AND hash NOT IN allowlist\n  | table _time,\
      \ host, user, NewProcessName, hash"
- question: After a process launched from a non-fixed drive, did it make an outbound network connection
    within 5 minutes to a threat-blocklisted destination, act as a non-browser HTTP/S initiator, or get
    blocked by firewall policy?
  context: 'This question chains Execution to its likely follow-on (command-and-control or egress). For
    any process whose image path is on a non-fixed drive, deterministically join the next outbound connection
    (Sysmon Event ID 3 or Zeek conn.log) within 5 minutes. Alert when the destination is on a threat blocklist,
    when a non-browser binary initiates HTTP/S, or when the connection is blocked/denied by firewall policy.
    The blocked/denied connection count is itself a distinct failure-mode signal — repeated blocked egress
    from a media-launched process strongly suggests thwarted C2. In an ICS context, HMIs and EWS rarely
    initiate arbitrary outbound web traffic, so even a single non-browser HTTP/S call from media-launched
    code is highly suspect. Source references: [Sysmon Event ID 3 reference](https://www.elastic.co/docs/reference/security/prebuilt-rules/audit_policies/windows/sysmon_eventid3_network_connection).'
  answer_sources:
  - Windows Event ID 4688
