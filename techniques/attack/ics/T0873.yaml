name: 'T0873: Project File Infection'
id: 081dbd37-e7b8-43c7-9957-5547d9ae0451
description: 'Investigate potential MITRE ATT&CK for ICS technique T0873 (Project File Infection), in
  which an adversary injects malicious code into ICS project files (.ACD, .S7P, .L5K, .RSS, .ap16, .pro,
  .tpzip, .pcw, .wsp, .XEF) and then uses engineering software to download the infected program to a PLC,
  enabling execution and persistence that survives engineering-workstation disconnection. This playbook
  helps an analyst examine three lines of evidence: (1) file modification events targeting ICS project
  files on engineering workstations and project file servers, looking for changes from unauthorized users/hosts,
  outside maintenance windows, or by non-engineering processes; (2) network connections to PLC engineering
  ports (S7COMM/102, Modbus/502, CODESYS/1217, DNP3/20000, EtherNet/IP/44818) from non-allow-listed sources
  or with anomalous volume/duration indicative of a project download; and (3) PLC mode changes (RUN->PROGRAM/REMOTE)
  immediately followed by high-volume transfers, the classic ''change mode, then write'' download signature.
  It pairs deterministic allow-list/maintenance-window rules with robust statistical baselining and machine-learning
  anomaly detection to surface project-file infection and PLC program downloads.'
type: technique
related:
- tactic_id: TA0110
  tactic_name: Persistence
