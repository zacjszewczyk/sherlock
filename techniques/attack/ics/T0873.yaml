      BUCKET 5min BY id.orig_h COUNT distinct failed PLC dst\nALERT IF distinct_failed_PLC >= 5\n  OR\
      \ ( failed THEN successful high-volume session WITHIN 10min )"
- question: Cluster anomalous engineering-port sessions? (Machine Learning) — How can an analyst cluster
    anomalous engineering-port sessions to detect Project File Infection activity?
  context: 'Tactic: Persistence. Use DBSCAN (or [Isolation Forest](https://doi.org/10.1145/2133360.2133363))
    on Zeek conn.log connections to PLCs on engineering ports with features duration, orig_bytes, resp_bytes,
    service (s7, enet-ip, modbus), conn_state, hour_of_day, and day_of_week. Routine low-volume short
    polling forms dense clusters; noise points (outliers) are high-volume, long-duration, or off-hours
    sessions typical of project downloads. Emit the top-3 contributing features per outlier in the alert
    ([Explainable Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930)).
    Keep the deterministic allow-list and percentile rules in parallel given ICS ML evasion ([Adversarial
    Attacks on Time-Series Intrusion Detection for ICS](https://arxiv.org/abs/1911.04278)). A positive
    result (matching the conditions above) is a candidate indicator of project-file infection or an unauthorized
    PLC program download and should be triaged against change-management records and the authorized-engineer/EWS
    allow-lists; a negative result lowers but does not eliminate suspicion, since deterministic, statistical,
    and ML methods are complementary and should be run in parallel.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Network segments within the ICS DMZ (Level 3.5) and Process Control Network (Levels 2/1), and
