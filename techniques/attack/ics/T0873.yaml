    query: "features = [duration, orig_bytes, resp_bytes, service, conn_state,\n            hour_of_day,\
      \ day_of_week]  on conn.log to PLC eng ports\nmodel = DBSCAN().fit(sessions)   # dense clusters\
      \ = routine polling\nALERT on noise/outlier points (high-volume/long/off-hours) WITH top3 feats\n\
      # keep allow-list + percentile rules in parallel"
- question: Correlate PLC mode changes with high data transfers? (Symbolic Logic) — How can an analyst
    correlate PLC mode changes with high data transfers to detect Project File Infection activity?
  context: 'Tactic: Persistence. Create a stateful SIEM rule that triggers when a PLC mode change is observed
    (e.g., param.function == "stop" or "start" in zeek s7comm.log, or RUN->PROGRAM/REMOTE in enip/dnp3).
    On trigger, monitor Zeek conn.log for 5 minutes for connections to the same id.resp_h where orig_bytes
    exceeds a tuned threshold (e.g., 500KB or 4x the per-PLC baseline). Alert with source host, destination
    PLC, function, and byte count. Ground the allowed command/sequence semantics in specification- and
    semantic-rule IDS that flag out-of-spec function codes and broken command/response pairing ([Distributed
    Intrusion Detection System using Semantic-based Rules for SCADA in Smart Grid](https://arxiv.org/abs/2412.07917);
    [On Specification-based Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354)).
    A mode-change-then-write sequence outside an approved maintenance window is a high-confidence program/project
    download. A positive result (matching the conditions above) is a candidate indicator of project-file
    infection or an unauthorized PLC program download and should be triaged against change-management
    records and the authorized-engineer/EWS allow-lists; a negative result lowers but does not eliminate
    suspicion, since deterministic, statistical, and ML methods are complementary and should be run in
    parallel.'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - 'NAI: Process Control Network (Level 2/1) segments where PLCs and other field controllers reside and
    network traffic can be monitored via a TAP or SPAN port.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode (stateful)
    query: "ON mode_change (s7comm.log param.function IN ('stop','start')\n   OR enip/dnp3 RUN->PROGRAM/REMOTE)\
      \ FOR id.resp_h = PLC\nTHEN WATCH conn.log to same id.resp_h FOR 5min\nALERT IF orig_bytes > max(500KB,\
      \ 4x per_PLC_baseline)\n  WITH src_host, dst_PLC, function, byte_count\n# flag out-of-spec function\
      \ codes / broken cmd-response pairing"
- question: Baseline write/download frequency and transfer size? (Statistical Method) — How can an analyst
    baseline write/download frequency and transfer size to detect Project File Infection activity?
  context: 'Tactic: Persistence. For each PLC, baseline (1) the hourly frequency of write/download function
    codes (write_tag in s7comm.log, write_multiple_coils in modbus.log) and (2) the 95th percentile of
    orig_bytes from conn.log. SCADA M2M traffic is highly periodic, so model per-PLC timing/sequence with
    a DFA and track phase shifts to keep baselines accurate, flagging extra/unscheduled messages such
    as a download ([Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068)). Alert
    when write/download count in an hour exceeds the robust threshold AND a connection''s orig_bytes exceeds
    the 95th percentile. The near-parameter-free Matrix Profile surfaces such sudden frequency/volume
    bursts as time-series discords ([Anomaly-based Intrusion Detection in Industrial Data with SVM and
    Random Forests](https://arxiv.org/abs/1907.10374)). A positive result (matching the conditions above)
    is a candidate indicator of project-file infection or an unauthorized PLC program download and should
    be triaged against change-management records and the authorized-engineer/EWS allow-lists; a negative
    result lowers but does not eliminate suspicion, since deterministic, statistical, and ML methods are
    complementary and should be run in parallel.'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - 'NAI: Process Control Network (Level 2/1) segments where PLCs and other field controllers reside and
    network traffic can be monitored via a TAP or SPAN port.'
  range: Last 30 days (baseline)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "PER PLC: freq = hourly count(write_tag in s7comm.log,\n          write_multiple_coils in modbus.log)\n\
      \         p95_bytes = percentile95(conn.log orig_bytes)\nmodel per-PLC timing with DFA (phase-shift\
      \ aware)\nALERT IF freq > robust_threshold AND orig_bytes > p95_bytes\n# Matrix Profile discord\
      \ on freq/volume time-series"
- question: Profile failed or rejected control commands? (Statistical Method) — How can an analyst profile
