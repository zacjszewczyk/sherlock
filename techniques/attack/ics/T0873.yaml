questions:
- question: Alert on unauthorized project file modifications? (Symbolic Logic) — How can an analyst alert
    on unauthorized project file modifications to detect Project File Infection activity?
  context: 'Tactic: Persistence. Construct a SIEM rule that filters file audit logs (Windows Event ID
    4663, Sysmon Event ID 11) for events where the TargetFilename field ends with a known ICS project
    extension (.ACD, .S7P, .L5K, .RSS, .ap16, .pro, .tpzip, .pcw, .wsp, .XEF). For each match perform
    two checks: 1) verify SubjectUserName is in an "Authorized_ICS_Engineers" AD group; 2) verify the
    event timestamp falls inside an approved change/maintenance window (query the change-management system).
    Generate a high-severity alert if the user is unauthorized OR the change is outside a window. Correlate
    with Windows Event ID 5145 to confirm SourceAddress is an approved EWS asset. Enforce application
    allow-listing, EWS hardening, and file-integrity monitoring as the deterministic floor per [Guide
    to Operational Technology (OT) Security, NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    and treat any project-file write by a non-engineering process (e.g., powershell.exe, cmd.exe, wscript.exe)
    as inherently anomalous. A positive result (matching the conditions above) is a candidate indicator
    of project-file infection or an unauthorized PLC program download and should be triaged against change-management
    records and the authorized-engineer/EWS allow-lists; a negative result lowers but does not eliminate
    suspicion, since deterministic, statistical, and ML methods are complementary and should be run in
    parallel.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Windows Event ID 5145
  - Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS Project File Shares (e.g., dedicated SMB shares for engineering files) and Engineering Workstations
    (EWS) within the Corporate IT, DMZ, or Process Control Network (PCN).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM file_audit (WinEventID IN (4663,4656) OR SysmonEventID=11)\nWHERE TargetFilename MATCHES\
      \ /\\.(ACD|S7P|L5K|RSS|ap16|pro|tpzip|pcw|wsp|XEF)$/i\n  AND ( SubjectUserName NOT IN group('Authorized_ICS_Engineers')\n\
      \        OR event_time NOT IN change_window()\n        OR ProcessName IN ('powershell.exe','cmd.exe','wscript.exe')\
      \ )\nJOIN WinEventID=5145 ON 5-tuple WHERE SourceAddress NOT IN asset('Authorized_EWS')\n=> ALERT\
      \ severity=high"
- question: Profile failed and denied project file access? (Symbolic Logic) — How can an analyst profile
    failed and denied project file access to detect Project File Infection activity?
  context: 'Tactic: Persistence. Failure-mode signal. From Windows Event ID 4656/4663 (audit-failure)
    and Event ID 5145 (Access: DENIED) on project shares, count failed/denied OPEN, WRITE, and DELETE
    attempts against project-file extensions per source host per 10-minute window. Alert when failed attempts
    exceed a tuned threshold (e.g., >=5) or when a denied write is followed within 5 minutes by a successful
    write from the same host (privilege escalation / ACL tampering). A burst of denied accesses to many
    project files from one source is an enumeration indicator that precedes infection, consistent with
    non-EWS download sources observed in [PLC-Blaster: A Worm Living Solely in the PLC](https://www.blackhat.com/docs/asia-16/materials/asia-16-Spenneberg-PLC-Blaster-A-Worm-Living-Solely-In-The-PLC-wp.pdf).
    A positive result (matching the conditions above) is a candidate indicator of project-file infection
    or an unauthorized PLC program download and should be triaged against change-management records and
    the authorized-engineer/EWS allow-lists; a negative result lowers but does not eliminate suspicion,
    since deterministic, statistical, and ML methods are complementary and should be run in parallel.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Windows Event ID 5145
  - Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS Project File Shares (e.g., dedicated SMB shares for engineering files) and Engineering Workstations
    (EWS) within the Corporate IT, DMZ, or Process Control Network (PCN).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM (WinEventID IN (4656,4663) AND status=FAILURE) OR (WinEventID=5145 AND Access='DENIED')\n\
      WHERE TargetFilename MATCHES /\\.(ACD|S7P|L5K|RSS|ap16|pro|tpzip|pcw|wsp|XEF)$/i\n  AND Operation\
      \ IN (OPEN,WRITE,DELETE)\nBUCKET 10min BY SourceHost COUNT failed_attempts\nALERT IF failed_attempts\
      \ >= 5\n  OR ( denied_write THEN successful_write FROM same host WITHIN 5min )"
- question: Baseline user project file access diversity? (Statistical Method) — How can an analyst baseline
    user project file access diversity to detect Project File Infection activity?
  context: 'Tactic: Persistence. For each authorized account, ingest file modification events (Sysmon
    Event ID 11) over a 30-day rolling window. Because a few legitimate bulk operations skew mean/standard-deviation
    thresholds, use the robust median/MAD [modified z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    on the count of unique project files written per hour and alert when the modified z-score exceeds
    3.5. Concurrently compute Shannon entropy over the set of unique parent folder paths accessed per
    user per week; a sharp rise versus the prior 4-week median indicates access to an unusually diverse
    set of project directories. Pair the Volume metric (total project bytes written/hour vs. per-user
    99th percentile) and the State metric (ratio of successful to failed writes) with the diversity metric
    so a single threshold cannot be evaded. A positive result (matching the conditions above) is a candidate
    indicator of project-file infection or an unauthorized PLC program download and should be triaged
    against change-management records and the authorized-engineer/EWS allow-lists; a negative result lowers
    but does not eliminate suspicion, since deterministic, statistical, and ML methods are complementary
    and should be run in parallel.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Windows Event ID 5145
  - Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS Project File Shares (e.g., dedicated SMB shares for engineering files) and Engineering Workstations
    (EWS) within the Corporate IT, DMZ, or Process Control Network (PCN).'
  range: Last 30 days (rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM SysmonEventID=11 WHERE ext IN project_exts

      PER user, PER hour: u = count(distinct project_file_written)

      mz = 0.6745*(u - median(u_30d)) / MAD(u_30d)

      entropy = shannon(distinct parent_folder_paths per user per week)

      volume = bytes_written_per_hour ; state = success_writes/failed_writes

      ALERT IF mz > 3.5 OR entropy >> median(prev_4wk) OR volume > user_p99'
- question: Anomaly detection for project file modifications? (Machine Learning) — How can an analyst
    use anomaly detection on project file modifications to detect Project File Infection activity?
  context: 'Tactic: Persistence. Train an [Isolation Forest](https://doi.org/10.1145/2133360.2133363)
    on features from file access logs (Sysmon Event ID 11, Windows Event ID 4663): User (categorical),
    Source Hostname (categorical), Process Name making the change (e.g., Studio5000.exe, TIA_Portal.exe,
    powershell.exe), Parent Process Name, hour of day, day of week, file extension, bytes written, and
    successful/failed flag. Train on >=90 days of normal engineering activity and flag events in the top
    1% anomaly score. Surface the top-3 contributing features in the alert text (e.g., "process=powershell.exe;
    host=non-EWS; bytes=high") using SHAP/feature-attribution as in [Explainable Anomaly Detection for
    Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930). Run this model in parallel
    with the deterministic allow-list rules above, never as a replacement, because ICS ML detectors are
    demonstrably evadable ([Adversarial Attacks on Time-Series Intrusion Detection for ICS](https://arxiv.org/abs/1911.04278)).
    A positive result (matching the conditions above) is a candidate indicator of project-file infection
    or an unauthorized PLC program download and should be triaged against change-management records and
    the authorized-engineer/EWS allow-lists; a negative result lowers but does not eliminate suspicion,
    since deterministic, statistical, and ML methods are complementary and should be run in parallel.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Windows Event ID 5145
  - Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS Project File Shares (e.g., dedicated SMB shares for engineering files) and Engineering Workstations
    (EWS) within the Corporate IT, DMZ, or Process Control Network (PCN).'
  range: Last 90 days (training); score new events
  queries:
  - technology: ML/IsolationForest pseudocode
    query: "features = [User, SourceHostname, ProcessName, ParentProcessName,\n            hour_of_day,\
      \ day_of_week, file_ext, bytes_written, success_flag]\nmodel = IsolationForest().fit(events_90d_normal)\n\
      score = model.anomaly_score(new_event)\nALERT IF score IN top 1%  WITH shap_top3(features)\n# run\
      \ in parallel with deterministic allow-list rules, not as replacement"
- question: Alert on non-allow-listed engineering port access? (Symbolic Logic) — How can an analyst alert
    on non-allow-listed engineering port access to detect Project File Infection activity?
  context: 'Tactic: Persistence. Create a SIEM rule on Zeek conn.log where id.resp_p is in the ICS engineering-port
    set (102, 502, 1217, 20000, 44818) AND id.resp_h is a tagged PLC asset. Generate a high-severity alert
    if id.orig_h is NOT in the "Authorized_EWS" asset group; treat controller-to-controller (PLC source)
    sessions on these ports as inherently malicious, since worms self-propagate via PLC-originated program
    downloads ([PLC-Blaster: A Worm Living Solely in the PLC](https://www.blackhat.com/docs/asia-16/materials/asia-16-Spenneberg-PLC-Blaster-A-Worm-Living-Solely-In-The-PLC-wp.pdf)).
    For authorized EWS sources, correlate the 5-tuple/timestamp with Windows Event ID 5156 to identify
    the Application/ProcessID and Event ID 4688 to confirm an approved engineering executable rather than
    a generic utility. Because the engineering station itself can be impersonated at the protocol layer,
    validate session/protocol state (e.g., S7CommPlus handshake integrity) and not IP alone, per [Rogue7:
    Rogue Engineering-Station Attacks on S7 Simatic PLCs](https://i.blackhat.com/USA-19/Thursday/us-19-Bitan-Rogue7-Rogue-Engineering-Station-Attacks-On-S7-Simatic-PLCs-wp.pdf).
    A positive result (matching the conditions above) is a candidate indicator of project-file infection
    or an unauthorized PLC program download and should be triaged against change-management records and
    the authorized-engineer/EWS allow-lists; a negative result lowers but does not eliminate suspicion,
    since deterministic, statistical, and ML methods are complementary and should be run in parallel.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Network segments within the ICS DMZ (Level 3.5) and Process Control Network (Levels 2/1), and
    the Engineering Workstations that access them.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM conn.log WHERE id.resp_p IN (102,502,1217,20000,44818)\n  AND id.resp_h IN asset('PLC')\n\
      ALERT high IF id.orig_h NOT IN asset('Authorized_EWS')\nALERT high IF id.orig_h IN asset('PLC')\
      \   # controller-to-controller = worm\nELSE JOIN WinEventID=5156 (Application/ProcessID) + 4688\n\
      \  CONFIRM approved engineering exe AND valid S7CommPlus handshake"
- question: Baseline PLC connection tuples and transfer size? (Statistical Method) — How can an analyst
    baseline PLC connection tuples and transfer size to detect Project File Infection activity?
  context: 'Tactic: Persistence. From Zeek conn.log establish a 30-day baseline of all (id.orig_h, id.resp_h,
    id.resp_p) tuples to PLC destinations and alert on any new tuple ("first-time talker"), treating rare/unseen
    source-destination pairs as elevated risk per [Probability Risk Identification Based IDS for SCADA
    Systems](https://arxiv.org/abs/1711.02826). For established pairs, baseline orig_bytes and duration
    and alert when a new connection exceeds the pair-specific 99th percentile (Volume), using robust median/MAD
    [modified z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly) so
    occasional legitimate downloads do not desensitize the threshold. A large orig_bytes/duration to an
    engineering port indicates a project download rather than routine polling. A positive result (matching
    the conditions above) is a candidate indicator of project-file infection or an unauthorized PLC program
    download and should be triaged against change-management records and the authorized-engineer/EWS allow-lists;
    a negative result lowers but does not eliminate suspicion, since deterministic, statistical, and ML
    methods are complementary and should be run in parallel.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Network segments within the ICS DMZ (Level 3.5) and Process Control Network (Levels 2/1), and
    the Engineering Workstations that access them.'
  range: Last 30 days (baseline)
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'baseline = distinct (id.orig_h,id.resp_h,id.resp_p) to PLC over 30d

      ALERT IF tuple NOT IN baseline   # first-time talker

      PER established pair: mz_bytes = modified_zscore(orig_bytes)

      ALERT IF orig_bytes > pair_p99 OR duration > pair_p99   # likely download'
