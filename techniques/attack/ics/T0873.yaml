- question: Sequence anomaly detection for PLC download activity? (Machine Learning) — How can an analyst
    use sequence anomaly detection for PLC download activity to detect Project File Infection activity?
  context: 'Tactic: Persistence. Abstract per-PLC network logs into a discrete event stream of (timestamp,
    event_type, event_value), where event_type includes PLC_MODE_CHANGE, PLC_FUNCTION_CALL, and CONNECTION_STATS
    (orig_bytes, duration). Train a sequence model (HMM, [LSTM DeepLog](https://doi.org/10.1145/3133956.3134015),
    or [seq2seq ICS model](https://arxiv.org/abs/1911.04831)) on normal sequences; a download manifests
    as a low-probability transition (e.g., MODE_CHANGE followed by high-byte CONNECTION_STATS). A 1D-CNN
    autoencoder over per-PLC time-series provides a complementary low-latency reconstruction-error detector
    ([Detecting Cyberattacks in ICS Using Convolutional Neural Networks](https://arxiv.org/abs/1806.08110)).
    Surface the top-3 contributing events/features in the alert ([Explainable Anomaly Detection for Industrial
    Control System Cybersecurity](https://arxiv.org/abs/2205.01930)), and keep the deterministic mode-change/byte-threshold
    rule in parallel because ICS sequence IDS are evadable ([Adversarial Attacks on Time-Series Intrusion
    Detection for ICS](https://arxiv.org/abs/1911.04278)). A positive result (matching the conditions
    above) is a candidate indicator of project-file infection or an unauthorized PLC program download
    and should be triaged against change-management records and the authorized-engineer/EWS allow-lists;
    a negative result lowers but does not eliminate suspicion, since deterministic, statistical, and ML
    methods are complementary and should be run in parallel.'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - 'NAI: Process Control Network (Level 2/1) segments where PLCs and other field controllers reside and
    network traffic can be monitored via a TAP or SPAN port.'
  range: Last 90 days (training); score live streams
  queries:
  - technology: ML/Sequence model pseudocode
    query: "stream = (timestamp, event_type, event_value)\n  event_type IN {PLC_MODE_CHANGE, PLC_FUNCTION_CALL,\
      \ CONNECTION_STATS}\nmodel = LSTM_DeepLog | HMM | seq2seq fit(normal sequences)\nALERT on low-probability\
      \ transition\n  (MODE_CHANGE -> high-byte CONNECTION_STATS) WITH top3 events\n# complement with\
      \ 1D-CNN autoencoder recon-error; keep det. rule parallel"
