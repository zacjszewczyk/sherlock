- question: 'For the Execution concern on critical ICS assets: Baseline RDP logon times and session durations.
    Specifically, can you identify a successful remote interactive logon (windows event id 4624, logon
    type 10) to a critical ics asset that violates an established policy, such as originating from an
    ip not on an allow-list, an account not in an authorized remote access group, or occurring outside
    of defined maintenance windows?'
  context: 'This question supports the Execution tactic by helping detect adversary use of GUI-based remote
    access (RDP/VNC) to run code on critical ICS hosts (T0823). Evidence under investigation: A successful
    remote interactive logon (Windows Event ID 4624, Logon Type 10) to a critical ICS asset that violates
    an established policy, such as originating from an IP not on an allow-list, an account not in an authorized
    remote access group, or occurring outside of defined maintenance windows. Method (statistical): Statistical
    Method: For each unique user-and-asset pair, establish a 30-day rolling baseline of successful RDP
    logons (Windows Event ID 4624, Type 10). Calculate the historical distribution (mean, standard deviation)
    of logon hour-of-day and of session duration by correlating logon 4624 with logoff 4634/4647, plus
    the count of prior occurrences of that user-asset pair (edge rarity). For each new logon, compute
    a z-score for its hour against the user-asset baseline; alert if the hour-of-day z-score exceeds 3,
    the session duration exceeds the 95th percentile for that pair, or the user-asset pair has never been
    seen before. Feature choice and rarity statistics follow authentication-behavior modeling in [Bian
    et al.](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf) and rarity scoring in
    [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf); derive site-specific thresholds from your
    own distribution using the [LANL auth schema](https://csr.lanl.gov/data/cyber1/) as a template. A
    positive result (a logon/connection that violates allow-lists, deviates from statistical baselines,
    or scores anomalous) warrants escalation and validation against change/maintenance records and the
    operator on duty; a negative result helps confirm that observed remote access is sanctioned. Pursue
    it by scoping to the named area of interest and correlating endpoint logon artifacts with network
    telemetry around the event time.'
