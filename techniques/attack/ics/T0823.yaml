name: 'T0823: Graphical User Interface'
id: da29d4cc-e9ab-4c29-88bf-13e1a0fda1e7
description: Investigate potential adversary use of GUI-based remote access (RDP on Windows, VNC on Linux/Unix)
  to gain interactive control of critical ICS hosts such as HMIs, Engineering Workstations, and Operator
  Workstations for execution. This playbook helps an analyst hunt for policy-violating and anomalous remote
  interactive logons at the endpoint level (Windows Event IDs 4624/4625/4634/4647 Logon Type 10, TerminalServices
  RemoteConnectionManager EID 1149 and LocalSessionManager EIDs 21/24/25) and at the network level (Zeek
  conn.log/rdp.log/x509.log, firewall logs for TCP/3389 and TCP/5900-5906). It combines deterministic
  allow-list and edge-novelty checks, statistical baselining of logon times, session durations, byte volumes,
  cookie entropy, and failure/brute-force precursors, and machine-learning detectors (isolation forest,
  authentication-graph link prediction, sequence models, and online autoencoders) to surface credential-switching
  lateral movement, off-hours access, scanning, and anomalous remote-access traffic onto OT assets.
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
