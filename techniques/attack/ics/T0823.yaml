- question: 'For the Execution concern on critical ICS assets: Graph and Isolation-Forest scoring of anomalous
    remote GUI access. Specifically, can you identify a successful remote interactive logon (windows event
    id 4624, logon type 10) to a critical ics asset that violates an established policy, such as originating
    from an ip not on an allow-list, an account not in an authorized remote access group, or occurring
    outside of defined maintenance windows?'
  context: 'This question supports the Execution tactic by helping detect adversary use of GUI-based remote
    access (RDP/VNC) to run code on critical ICS hosts (T0823). Evidence under investigation: A successful
    remote interactive logon (Windows Event ID 4624, Logon Type 10) to a critical ICS asset that violates
    an established policy, such as originating from an IP not on an allow-list, an account not in an authorized
    remote access group, or occurring outside of defined maintenance windows. Method (ml): Machine Learning:
    For each RDP logon (Windows Event ID 4624, Type 10), create a feature vector including user, target
    host, source IP novelty, day of week, and logon hour (cyclical features) and session duration. Score
    with an unsupervised detector such as an [Isolation Forest or One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4)
    trained on a curated benign baseline, and use LIME-style attribution so each alert surfaces the top-3
    contributing features (e.g., never-before-seen source IP, off-hours, abnormal duration) in the alert
    text rather than a bare score. In parallel, rank logon edges with an unsupervised authentication-graph
    model: [CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf) scores new edges by link
    probability and [EULER](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf) adds
    temporal link prediction to flag improbable source->critical-asset RDP edges over an evolving graph;
    both are validated on the [LANL dataset](https://csr.lanl.gov/data/cyber1/). Alert when any model
    exceeds a statistically determined threshold. A positive result (a logon/connection that violates
    allow-lists, deviates from statistical baselines, or scores anomalous) warrants escalation and validation
    against change/maintenance records and the operator on duty; a negative result helps confirm that
    observed remote access is sanctioned. Pursue it by scoping to the named area of interest and correlating
    endpoint logon artifacts with network telemetry around the event time.'
