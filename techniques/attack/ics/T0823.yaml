  queries:
  - technology: SIEM/pseudocode
    query: "FOR (user, asset) pair OVER 30d rolling baseline of (EventID==4624 AND LogonType==10):\n \
      \ mean_hour, std_hour = dist(logon_hour_of_day)\n  durations = correlate(4624 -> 4634/4647); p95_dur\
      \ = pctl(durations, 95)\n  seen_count = prior_occurrences(user, asset)   // edge rarity\nFOR new\
      \ logon:\n  z = (logon_hour - mean_hour) / std_hour\n  IF z > 3 OR session_duration > p95_dur OR\
      \ seen_count == 0:\n    ALERT 'anomalous RDP logon time/duration or never-seen user-asset pair'"
- question: 'For the Execution concern on critical ICS assets: Profile failed remote-logon rate and account
    fan-out (failure mode). Specifically, can you identify a successful remote interactive logon (windows
    event id 4624, logon type 10) to a critical ics asset that violates an established policy, such as
