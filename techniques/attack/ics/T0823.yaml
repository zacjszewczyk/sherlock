    an established policy, such as originating from an IP not on an allow-list, an account not in an authorized
    remote access group, or occurring outside of defined maintenance windows. Method (statistical): Statistical
    Method: Explicitly profile authentication failures as a distinct precursor signal. Per [Splunk Threat
    Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html),
    count distinct failed remote logons (Windows Event ID 4625, Logon Type 10/3) per source IP and per
    targeted account over a sliding window (e.g., 10-30 min). Alert when one source fails against many
    distinct accounts targeting a critical asset (spray/brute force), when failed-then-succeeded (4625
    followed by 4624 Type-10 from the same source within minutes) indicates a guessed credential, or when
    the failed-logon rate to an HMI/EWS exceeds 3 standard deviations above its 30-day baseline. Establish
    per-asset baselines because many ICS hosts normally see near-zero remote-logon failures. A positive
    result (a logon/connection that violates allow-lists, deviates from statistical baselines, or scores
    anomalous) warrants escalation and validation against change/maintenance records and the operator
    on duty; a negative result helps confirm that observed remote access is sanctioned. Pursue it by scoping
    to the named area of interest and correlating endpoint logon artifacts with network telemetry around
    the event time.'
