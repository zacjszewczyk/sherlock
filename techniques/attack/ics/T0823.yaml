questions:
- question: 'For the Execution concern on critical ICS assets: Alert on policy-violating remote GUI logons.
    Specifically, can you identify a successful remote interactive logon (windows event id 4624, logon
    type 10) to a critical ics asset that violates an established policy, such as originating from an
    ip not on an allow-list, an account not in an authorized remote access group, or occurring outside
    of defined maintenance windows?'
  context: 'This question supports the Execution tactic by helping detect adversary use of GUI-based remote
    access (RDP/VNC) to run code on critical ICS hosts (T0823). Evidence under investigation: A successful
    remote interactive logon (Windows Event ID 4624, Logon Type 10) to a critical ICS asset that violates
    an established policy, such as originating from an IP not on an allow-list, an account not in an authorized
    remote access group, or occurring outside of defined maintenance windows. Method (symbolic): Symbolic
    Logic: Maintain an inventory of critical ICS assets (HMIs, EWS, OWS) with corresponding allow-lists
    for source IPs, user groups, and operational/maintenance hours. Query for all successful remote interactive
    logons (Windows Event ID 4624, Logon Type 10 RemoteInteractive) to these assets; per [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf)
    these are the canonical RDP-session artifacts (corroborate with TerminalServices RemoteConnectionManager
    EID 1149 and LocalSessionManager EIDs 21/24/25). For each logon, join with the inventory to verify
    source IP, user-group membership, and timestamp against policy. Trigger a high-priority alert for
    any logon that violates one or more rules. Per [MITRE ATT&CK T0823 / DET0772](https://attack.mitre.org/techniques/T0823/),
    also alert on creation of remote-graphical-service processes (rdpclip.exe, tvnserver/vncserver) and
    DLL loads into those services on assets where remote GUI is not authorized. A positive result (a logon/connection
    that violates allow-lists, deviates from statistical baselines, or scores anomalous) warrants escalation
    and validation against change/maintenance records and the operator on duty; a negative result helps
    confirm that observed remote access is sanctioned. Pursue it by scoping to the named area of interest
    and correlating endpoint logon artifacts with network telemetry around the event time.'
