  - Windows TerminalServices-RemoteConnectionManager (EID 1149)
  - Windows TerminalServices-LocalSessionManager (EIDs 21, 24, 25)
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Operator Workstations (OWS),
    ICS Domain Controllers, Jump Servers, Remote Access Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/pseudocode
    query: "inventory = critical_ics_assets(HMI,EWS,OWS) WITH allowlists(src_ip, user_group, maintenance_hours)\n\
      logons = events(EventID==4624 AND LogonType==10)   // RemoteInteractive\nFOR l IN logons WHERE l.dest_host\
      \ IN inventory:\n  IF l.src_ip NOT IN allowlist(l.dest).ips\n     OR l.user NOT IN allowlist(l.dest).groups\n\
      \     OR l.time NOT IN allowlist(l.dest).maintenance_hours:\n    ALERT high 'policy-violating remote\
      \ GUI logon'\n// corroborate with TerminalServices RemoteConnectionManager EID 1149 and LocalSessionManager\
      \ EIDs 21/24/25\n// also alert on creation of rdpclip.exe / tvnserver / vncserver and DLL loads\
      \ into those services\n//   on assets where remote GUI is not authorized"
- question: 'For the Execution concern on critical ICS assets: Flag credential-switch / causally-unexplained
    remote logon paths. Specifically, can you identify a successful remote interactive logon (windows
    event id 4624, logon type 10) to a critical ics asset that violates an established policy, such as
    originating from an ip not on an allow-list, an account not in an authorized remote access group,
    or occurring outside of defined maintenance windows?'
  context: 'This question supports the Execution tactic by helping detect adversary use of GUI-based remote
    access (RDP/VNC) to run code on critical ICS hosts (T0823). Evidence under investigation: A successful
    remote interactive logon (Windows Event ID 4624, Logon Type 10) to a critical ICS asset that violates
    an established policy, such as originating from an IP not on an allow-list, an account not in an authorized
    remote access group, or occurring outside of defined maintenance windows. Method (symbolic): Symbolic
    Logic: Reconstruct host-to-host login paths from 4624 Type-10 events as in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf)
    and the high-value-filter-then-path-search approach of [Latte](https://www.microsoft.com/en-us/research/wp-content/uploads/2019/03/Milcom2018_Liu.pdf).
    Deterministically flag any remote GUI logon that (a) switches to a different account than the inbound
    session AND (b) reaches a critical OT asset with no causally-explaining predecessor session, OR is
    immediately followed by remote command/process execution. Treat such credential-switching, causally-unexplained
    movement onto HMIs/EWS as high priority regardless of allow-list status. A positive result (a logon/connection
    that violates allow-lists, deviates from statistical baselines, or scores anomalous) warrants escalation
    and validation against change/maintenance records and the operator on duty; a negative result helps
    confirm that observed remote access is sanctioned. Pursue it by scoping to the named area of interest
    and correlating endpoint logon artifacts with network telemetry around the event time.'
