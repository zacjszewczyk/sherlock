questions:
- question: '[Discovery] Match known discovery frames: Can you determine whether multicast discovery frames
    sent to a protocol-specific group address, such as PROFINET DCP Identify traffic, that trigger replies
    from multiple live ICS devices and expose asset identities. The evidence should show a source host
    that does not normally enumerate devices initiating the multicast request, followed by a reply burst
    that is distinct from ordinary cyclic control traffic or routine engineering maintenance. -- specifically
    by applying the ''Match known discovery frames'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary issues multicast discovery
    requests (e.g., PROFINET DCP Identify-All) to enumerate live ICS devices and map assets while remaining
    stealthier than a broadcast sweep. This evidence focuses on the condition that multicast discovery
    frames sent to a protocol-specific group address, such as PROFINET DCP Identify traffic, that trigger
    replies from multiple live ICS devices and expose asset identities. The evidence should show a source
    host that does not normally enumerate devices initiating the multicast request, followed by a reply
    burst that is distinct from ordinary cyclic control traffic or routine engineering maintenance. The
    ''Match known discovery frames'' approach (Symbolic Logic) works as follows: Detect PROFINET DCP Identify-All
    requests (Ethertype 0x8892, ServiceID Identify, multicast group 01:0e:cf:00:00:00) or equivalent multicast
    discovery frames in [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html) / PCAP, confirm
    the destination is the expected protocol multicast group, and verify that multiple devices reply in
    the same time window. Correlate the source host with Windows Event ID 4688/5156 to identify the initiating
    process, distinguishing engineering tools from ad hoc scripts, using process-creation/network rule
    patterns from [SigmaHQ](https://github.com/SigmaHQ/sigma) and network discovery analytics from [BZAR](https://github.com/mitre-attack/bzar).
    Reference [Cisco Cyber Vision](https://www.cisco.com/site/us/en/products/security/industrial-security/cyber-vision/index.html)
    for the expected appearance of legitimate DCP Identify-All discovery. What the analyst is looking
    for: a source host that does not normally enumerate OT assets initiating a multicast discovery request,
    followed by a reply burst from multiple devices that is distinct from cyclic control traffic or scheduled
    engineering maintenance. A positive result -- a deterministic rule match, a statistical outlier beyond
    the stated threshold, or a model alert -- indicates probable adversary asset mapping; pivot to the
    initiating host (IP/MAC), the responsible process and account (via Windows Event ID 4688/5156), the
    protocol multicast group, the set of responding devices, and the surrounding event timeline to scope
    what the adversary learned and whether the source is an approved engineering workstation. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss low-and-slow or carefully paced enumeration; run deterministic
    rules as the floor and treat statistical/ML detections as parallel corroboration, since ML detection
    of ICS attacks degrades on novel/unknown techniques.'
