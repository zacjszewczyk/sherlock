name: 'T0846.003: Multicast Discovery'
id: 6a0b2ce8-cf5d-4b72-b35a-e9bd851025a2
description: 'This playbook helps an analyst investigate whether an adversary is using multicast discovery
  protocols to identify and map Industrial Control System (ICS) assets within an OT network (MITRE ATT&CK
  for ICS T0846.003, Multicast Discovery). Multicast discovery is when a single host sends a message to
  a pre-defined protocol group address on a network or subnet and waits for replies; any device that responds
  is live and reachable over that protocol. Because only members of the multicast group are addressed
  -- rather than every host as in broadcast discovery -- multicast enumeration tends to be stealthier
  and can masquerade as routine OT housekeeping. A common example is the PROFINET Discovery and Configuration
  Protocol (DCP) Identify-All request (Ethertype 0x8892, multicast group 01:0e:cf:00:00:00). The hunt
  looks for a source host that does not normally enumerate devices issuing a multicast discovery request,
  followed by a reply burst from multiple live ICS devices that is distinct from ordinary cyclic control
  traffic or scheduled engineering maintenance. It pursues this behavior across the OT estate (OT network,
  PROFINET/Industrial Ethernet segments, and industrial switches) from several complementary angles: deterministic
  symbolic-logic detection of known discovery frames and protocol-specification (finite-state) violations,
  validation of the source host role and account privilege against an engineering-workstation allowlist,
  statistical baselining of discovery burst frequency, reply fan-out, rarity, and failure rates, and machine-learning
  clustering and explainable sequence models. Evidence is drawn from Zeek conn.log, raw PCAP, PROFINET
  DCP frames, Windows Event IDs 4688 and 5156, and firewall logs, so the analyst can corroborate suspected
  multicast asset mapping against network, host, and ICS protocol context while keeping deterministic
  rules as the detection floor alongside statistical and ML methods.'
type: technique
