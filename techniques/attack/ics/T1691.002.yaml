name: 'T1691.002: Reporting Message'
id: de0a7522-b870-494e-aea9-8abfc4248c2c
description: 'Investigate whether an adversary has blocked or suppressed OT reporting (telemetry) messages
  to hide malicious activity from operators and inhibit response functions in an ICS environment. Reporting
  messages carry I/O values and equipment/process state from controllers to reporting hosts such as HMIs,
  historians, and OPC servers; blocking them can prevent timely operator or safety response to a dangerous
  fault. This playbook helps an analyst detect three suppression patterns: (1) unexpected termination
  of a critical reporting service (HMI/historian/OPC) followed by a sustained gap in expected OT telemetry
  from the same host/controller path; (2) host-based firewall rule additions or modifications that block
  essential OT ports (Modbus TCP 502, DNP3 20000, IEC-104 2404, EtherNet/IP 44818/2222) followed by immediate
  loss of reporting traffic; and (3) denial-of-service floods of failed/reset connections that overwhelm
  a reporting endpoint and suppress legitimate polling. It pairs deterministic symbolic-logic rules (service-stop
  and firewall-change correlation, stale-value timeouts, specification-defined periodicity checks, connection-error-ratio
  and rate thresholds) with statistical baselining (per-host telemetry volume/jitter baselines, change-point
  detection, k-sigma event spikes, inbound-surge and source-entropy analysis) and machine-learning forecasting
  and anomaly scoring across endpoint (Windows Event IDs 4688/4689/4947/4950/4956, firewall logs) and
  network (Zeek conn/notice/modbus/dnp3) telemetry to surface blocked-reporting behavior in support of
  the Inhibit Response Function tactic.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: On a critical ICS reporting host (HMI, historian, or OPC server), did a reporting service
    terminate (Windows Event ID 4689 process-exit or 7036 service-stopped) at nearly the same time as
    a sharp drop in that host's OT sessions, without a matching approved maintenance ticket, operator
    login, or planned restart window?
  context: Supports the Inhibit Response Function tactic. Blocking reporting messages can begin with forcibly
    stopping the very service that emits telemetry. Correlate a stop of a critical ICS reporting service
    (HMI/historian/OPC) - Windows Event ID 4689 process exit or service-control 7036 - with a same-host
    collapse in Zeek OT sessions (conn/modbus/dnp3) within a tight time window. Alert only when the termination
    is NOT tied to an approved change ticket, operator login, or planned restart, per OT change-control
    and scoped-authorization expectations in NIST SP 800-82r3. A positive result - service death plus
    immediate telemetry loss on the same controller/reporting path, with no authorization - is high-fidelity
    evidence of telemetry suppression rather than a routine restart; a benign restart will recover traffic
    and map to a known maintenance action.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Historian Servers, OPC Servers
    within the Process Control Network (PCN) segments.'
  range: 'Last 90 days (event-centered: correlate service stop and traffic loss within a 5-minute window)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=win (EventCode=4689 OR (EventCode=7036 AND Message=\"*stopped*\"))\nservice IN (hmi_svc,\
      \ historian_svc, opc_svc)\n| join host [ search index=zeek (source=\"conn.log\" OR source=\"modbus.log\"\
      \ OR source=\"dnp3.log\")\n    | bin _time span=1m | stats count as ot_sessions by _time, host ]\n\
      | where ot_sessions_after < 0.1 * ot_sessions_before\n| lookup change_tickets host approved_window\
      \ OUTPUT approved\n| where approved!=\"yes\"\n| alert"
  - technology: Zeek/pseudocode
    query: '# confirm the post-stop telemetry gap on the same controller path

      conn/modbus/dnp3.log: per host, compare session count in 5m before vs after stop_ts

      if after ~ 0 and not in maintenance_window -> flag telemetry suppression'
- question: For each monitored controller/reporting pair, did fresh reporting messages stop arriving for
    longer than 2.5x the nominal polling interval after a reporting service stop, when measured against
    the protocol's specification-defined periodicity?
  context: 'Supports the Inhibit Response Function tactic. ICS reporting is periodic, so the absence of
    a fresh report past an expected deadline is itself a detection. Apply the dropped-packet/stale-value
    timeout model: treat telemetry as suppressed when no new reporting message arrives within 2.5x the
    nominal polling interval after a service stop. Validate against the protocol''s specification-defined
    periodicity (Modbus/DNP3/IEC-104 expected report cadence) so a genuine device outage is distinguished
    from deliberately blocked reporting. A positive result means the controller''s status feed went stale
    past its deadline with no legitimate cause - a low-false-positive indicator of blocked reporting that
    protects the operator''s ability to respond to a fault.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Historian Servers, OPC Servers
    within the Process Control Network (PCN) segments.'
  range: Last 90 days (evaluate per polling interval; alert after 2.5x interval elapses)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "foreach (controller, reporting_host) in monitored_pairs:\n  nominal = poll_interval[controller]\
      \   # from protocol spec\n  last_report = max(_time) where source in (modbus.log,dnp3.log) and pair\
      \ matches\n  if (now - last_report) > 2.5 * nominal AND service_stop_seen(reporting_host):\n   \
      \   alert(pair, gap=now-last_report, expected=nominal)"
  - technology: Zeek/pseudocode
    query: 'modbus/dnp3.log: track inter-arrival of periodic status reports per master/outstation

      if gap > 2.5 * spec_periodicity -> stale-value timeout -> flag blocked reporting'
- question: After a reporting-service termination, did the host's per-minute OT session counts or byte
    totals fall below the 5th percentile of its 14-day baseline (or drop by more than three standard deviations),
    and does an online change-point detector confirm an abrupt step-down to near-zero?
  context: Supports the Inhibit Response Function tactic. Build a 14-day baseline of per-minute OT session
    counts and byte totals per host from Zeek conn.log, modbus.log, and dnp3.log. Flag when the 5-minute
    post-termination average falls below the 5th percentile of the host baseline or drops by more than
    three sigma. Run an online change-point detector (CUSUM or Bayesian online CPD) on the same series
    to catch the abrupt step-down to near-zero that marks suppression, and engineer per-host volume/jitter
    features with a damped-window approach (Kitsune). A positive result - a statistically significant
    collapse plus a confirmed change point - distinguishes deliberate telemetry suppression from normal
    traffic variation, and the change-point timestamp helps anchor the incident timeline.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Historian Servers, OPC Servers
    within the Process Control Network (PCN) segments.'
  range: Last 90 days (baseline 14 days; evaluate 5-minute post-termination window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek (source IN (conn.log,modbus.log,dnp3.log)) earliest=-14d

      | bin _time span=1m | stats count as sess, sum(bytes) as bytes by _time, host

      | eventstats avg(sess) as mu, stdev(sess) as sd, p5(sess) as p5 by host

      | eval z=(sess-mu)/sd

      | where sess < p5 OR z < -3

      | append [ cusum(series=sess, by=host) where step_down_to_near_zero ]

      | alert'
  - technology: SIEM/Stats pseudocode
    query: 'cpd = BayesianOnlineCPD(series=per_host_session_rate, hazard=1/1440)

      feats = damped_window(volume, jitter)   # Kitsune-style

      if cpd.changepoint() and post_level < 0.05*pre_level: alert(host, ts)'
- question: Did a host's hourly count of service-stop events (Windows Event ID 4689/7036) or rare process-exit
    codes for reporting services exceed its k-sigma baseline (mean + 3 sigma)?
  context: Supports the Inhibit Response Function tactic. Forced termination of reporting services is
    a distinct host-side failure-mode signal that can precede or accompany blocked reporting. Maintain
    a k-sigma baseline of per-host hourly counts of service-stop events (4689/7036) and rare process-exit
    codes, and flag counts exceeding mean + 3 sigma. A spike of stops - especially outside maintenance
    windows or clustered across reporting assets - indicates an actor deliberately killing telemetry sources.
    A positive result is an early, cheap precursor that should be correlated with the corresponding traffic-loss
    evidence; a negative result still leaves the deterministic stop+traffic-loss correlation as the primary
    detection.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Historian Servers, OPC Servers
    within the Process Control Network (PCN) segments.'
  range: Last 90 days (hourly buckets)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=win (EventCode=4689 OR EventCode=7036) reporting_service=true

      | bin _time span=1h | stats count as stops by _time, host

      | eventstats avg(stops) as mu, stdev(stops) as sd by host

      | eval k=(stops-mu)/sd

      | where k > 3

      | alert'
- question: Does observed OT telemetry stay below a per-host forecast model's prediction interval for
    three or more consecutive minutes after a process stop, and which top-3 channels/features (register
    group, byte-rate, inter-arrival gap) drove the deviation?
  context: Supports the Inhibit Response Function tactic. Train a per-host forecast model (ARIMA, LSTM,
    or seq2seq) on historical OT traffic volume and inter-arrival timing, and alert when observed telemetry
    stays below the forecast interval for three or more consecutive minutes after a process stop. Emit
    the top-3 contributing channels/features (affected register group, byte-rate, inter-arrival gap) using
    SHAP-style attribution so analysts can triage quickly. Keep the deterministic stale-value timeout
    rule as the floor, since ML ICS detectors degrade on unseen attacks. A positive result flags a sustained,
    model-confirmed shortfall of expected telemetry consistent with suppression, even when no single threshold
    is crossed.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4689
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Historian Servers, OPC Servers
    within the Process Control Network (PCN) segments.'
  range: Last 90 days (forecast horizon minutes; alert on 3+ consecutive sub-forecast minutes)
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = Forecast(['ARIMA','LSTM'], target='ot_volume', key_by='host').fit(history)\nfor host,\
      \ minute in stream_after(process_stop):\n    pred = model.predict_interval(host, minute)\n    if\
      \ observed[host,minute] < pred.lower for 3+ consecutive minutes:\n        alert(host=host, top3=shap_topk(model,\
      \ host, k=3))\n# floor: keep deterministic stale-value timeout rule active"
- question: Was a host-based firewall rule added or modified (Windows Event ID 4947/4950/4956 or Windows
    Firewall logs) to block or alter traffic on a known OT port (Modbus 502, DNP3 20000, IEC-104 2404,
    EtherNet/IP 44818/2222) or a reporting-asset group, without an approved ticket and a permitted fallback
    path for reporting traffic?
  context: Supports the Inhibit Response Function tactic. A common way to block reporting is to install
    a host firewall rule that drops the OT reporting port. Watch Windows Event IDs 4947, 4950, and 4956
    (and Windows Firewall logs) for block/modify rules targeting known OT ports or reporting-asset groups.
    Suppress the alert only when the change is tied to an approved ticket AND still leaves a permitted
    fallback path for reporting traffic, per deny-by-default and scoped-authorization guidance in NIST
    SP 800-82r3. A positive result - an unauthorized rule that isolates a reporting port with no remaining
    path - is a strong, deliberate suppression signal; the requirement for a surviving fallback path prevents
    attackers from hiding a block behind a partial, benign-looking change.
  answer_sources:
  - Windows Event ID 4947
  - Windows Event ID 4950
  - Windows Event ID 4956
  - Windows Firewall Logs
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: HMIs, Historian Servers, Application Servers in the Process Control Network (PCN), and Industrial
    Demilitarized Zone (IDMZ) servers that bridge IT/OT networks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=win (EventCode=4947 OR EventCode=4950 OR EventCode=4956) OR source="WindowsFirewall"

      | where rule_action="block" AND (port IN (502,20000,2404,44818,2222) OR target_group="reporting_assets")

      | lookup change_tickets rule_id OUTPUT approved

      | eval fallback = has_permitted_reporting_path(host, port)

      | where approved!="yes" OR fallback=false

      | alert'
- question: Immediately after a firewall change, did the expected periodic master/outstation status reports
    for that protocol path cease, when checked against specification/semantic allow-rules of expected
    periodic reporting?
  context: Supports the Inhibit Response Function tactic. Maintain specification/semantic allow-rules
    describing the expected periodic reports each master/outstation pair should send per protocol. Immediately
    after a firewall change, alert if the expected periodic status messages for that path stop arriving.
    This is a low-false-positive signal of blocked reporting because it tests the actual semantic effect
    of the change (did the protocol's required periodic report disappear?) rather than just the presence
    of a rule. A positive result confirms the firewall change actually severed a required reporting path;
    a negative result indicates the change did not break expected telemetry and can be deprioritized.
  answer_sources:
  - Windows Event ID 4947
  - Windows Event ID 4950
  - Windows Event ID 4956
  - Windows Firewall Logs
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: HMIs, Historian Servers, Application Servers in the Process Control Network (PCN), and Industrial
    Demilitarized Zone (IDMZ) servers that bridge IT/OT networks.'
  range: 'Last 90 days (event-centered: evaluate path within minutes after each firewall change)'
  queries:
  - technology: Zeek/pseudocode
    query: "spec_rules: expected_periodic_report[(master,outstation,proto)] = interval\non firewall_change(host,\
      \ port):\n    affected = paths_using(host, port)\n    for path in affected:\n        if no expected\
      \ periodic report seen within expected interval after change_ts:\n            alert(path, reason=\"\
      spec periodic report ceased post-firewall-change\")"
- question: In the first 10 minutes after a firewall rule change, did traffic on the affected OT port
    fall below the 5th percentile of the host's normal session count or drop more than three sigma in
    byte volume, with change-point detection confirming an abrupt level shift and a rise in exception/refused
    responses?
  context: Supports the Inhibit Response Function tactic. Compare pre- and post-change traffic on the
    affected port using Zeek conn.log and protocol logs. Alert when the first 10 minutes after the rule
    change fall below the 5th percentile of the host's normal session count or show a greater than three-sigma
    drop in byte volume. Apply change-point detection to confirm an abrupt level shift rather than normal
    variation, and track any rise in protocol exception/error or refused responses as a distinct state
    signal. A positive result statistically links the firewall change to a real collapse of reporting
    traffic, distinguishing deliberate suppression from incidental variation; the exception/refused-response
    rise corroborates that the path is now being denied.
  answer_sources:
  - Windows Event ID 4947
  - Windows Event ID 4950
  - Windows Event ID 4956
  - Windows Firewall Logs
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: HMIs, Historian Servers, Application Servers in the Process Control Network (PCN), and Industrial
    Demilitarized Zone (IDMZ) servers that bridge IT/OT networks.'
  range: 'Last 90 days (event-centered: 10-minute post-change window vs host baseline)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek source IN (conn.log,modbus.log,dnp3.log) port=affected_port

      | eval phase=if(_time<change_ts,"pre","post")

      | stats count as sess, sum(bytes) as bytes by phase, host

      | eventstats p5(sess) as p5, avg(bytes) as mu_b, stdev(bytes) as sd_b by host

      | where phase="post" AND (sess < p5 OR (bytes-mu_b)/sd_b < -3)

      | append [ cpd(series=sess) where level_shift_down ]

      | append [ stats count by exception_or_refused_responses ]

      | alert'
- question: Did a host's count of firewall rule add/modify events (Windows Event ID 4947/4950/4956) spike
    above its k-sigma baseline (mean + 3 sigma), especially outside maintenance windows?
  context: Supports the Inhibit Response Function tactic. Keep a k-sigma baseline of per-host counts of
    firewall rule add/modify events (4947/4950/4956) and flag spikes above mean + 3 sigma, especially
    outside maintenance windows. A burst of firewall changes on a reporting asset is an anomalous administrative
    pattern that frequently accompanies an attempt to isolate telemetry. A positive result is an inexpensive
    precursor that should be correlated with the OT-port targeting and traffic-loss evidence; outside-maintenance-window
    timing sharply increases suspicion since legitimate rule churn is normally scheduled.
  answer_sources:
  - Windows Event ID 4947
  - Windows Event ID 4950
  - Windows Event ID 4956
  - Windows Firewall Logs
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: HMIs, Historian Servers, Application Servers in the Process Control Network (PCN), and Industrial
    Demilitarized Zone (IDMZ) servers that bridge IT/OT networks.'
  range: Last 90 days (hourly/daily buckets)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=win (EventCode=4947 OR EventCode=4950 OR EventCode=4956)

      | bin _time span=1h | stats count as fw_changes by _time, host

      | eventstats avg(fw_changes) as mu, stdev(fw_changes) as sd by host

      | eval k=(fw_changes-mu)/sd, off_hours=if(NOT match(hour,"08-17"),1,0)

      | where k > 3

      | alert'
- question: Does a supervised classifier (Random Forest) score a firewall change as likely to isolate
    a reporting asset with high malicious probability, based on rule action, port, direction, authorizing
    account, and historical effect on OT traffic - and what are the top-3 feature contributions?
  context: Supports the Inhibit Response Function tactic. Train a supervised classifier (Random Forest
    preferred for interpretability) on firewall-change features such as rule action, port, direction,
    authorizing account, and the historical effect of similar changes on OT traffic. Flag changes with
    high malicious probability when the model predicts a policy update that would isolate a reporting
    asset, and surface the top-3 feature contributions in the alert. Retain the deterministic OT firewall
    rule validation as the floor because high-accuracy ML IIDS fail on novel attacks. A positive, high-probability
    result identifies a firewall change whose learned profile matches reporting-isolation behavior even
    when it does not exactly match a static rule; the feature attribution explains why and speeds triage.
  answer_sources:
  - Windows Event ID 4947
  - Windows Event ID 4950
  - Windows Event ID 4956
  - Windows Firewall Logs
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: HMIs, Historian Servers, Application Servers in the Process Control Network (PCN), and Industrial
    Demilitarized Zone (IDMZ) servers that bridge IT/OT networks.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "clf = RandomForest(features=['rule_action','port','direction','auth_account','hist_ot_effect'])\n\
      for ch in firewall_changes:\n    p = clf.predict_proba(ch)\n    if p.malicious > 0.85 and predicts_isolates_reporting_asset(ch):\n\
      \        alert(host=ch.host, score=p.malicious, top3=clf.explain(ch,k=3))\n# floor: keep deterministic\
      \ OT firewall rule validation active"
- question: Over a 5-minute window, did failed/reset/refused connections (Zeek conn_state S0/REJ/RSTOS0)
    make up the majority of attempts to a critical reporting endpoint while legitimate OT session counts
    fell sharply, and did inbound connection rate per source/destination exceed a per-asset deterministic
    threshold?
  context: Supports the Inhibit Response Function tactic. A denial-of-service against the reporting path
    suppresses telemetry by drowning the endpoint in failed connections. Alert when Zeek conn.log shows
    failed, reset, or refused connections (conn_state S0/REJ/RSTOS0) accounting for the majority of attempts
    to a critical reporting endpoint over a 5-minute window while legitimate OT session counts fall sharply
    at the same time - treating connection-error rate as a first-class failure-mode signal. Also enforce
    a deterministic inbound rate threshold per source/destination (rate_filter/detection_filter style),
    tuned per asset. A positive result - high error ratio plus collapsing legitimate sessions, or a rate
    breach - indicates a focused flood that is blocking reporting rather than an ordinary outage.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Network interfaces of HMIs, Historians, and Control Servers; network segments/VLANs dedicated
    to process control.'
  range: 'Last 90 days (event-centered: 5-minute sliding window)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=zeek source=\"conn.log\" dest IN (hmi,historian,control_server)\n| bin _time span=5m\n\
      | stats count as total, count(eval(conn_state IN (\"S0\",\"REJ\",\"RSTOS0\"))) as failed,\n    \
      \    count(eval(ot_legit=true)) as ot_sessions by _time, dest\n| eval fail_ratio=failed/total\n\
      | where fail_ratio > 0.5 AND ot_sessions < 0.5*baseline_ot_sessions\n| alert"
  - technology: Zeek/pseudocode
    query: '# Suricata-style thresholding per asset

      detection_filter: track by_dst, count 2000, seconds 60 on inbound to reporting_endpoint

      conn.log: alert when failed/reset ratio dominates per 5m window'
- question: For each monitored OT service, did the inbound connection count exceed its mean by at least
    five standard deviations while source-IP entropy dropped below the 10th percentile, with change-point
    detection confirming the onset - consistent with a focused flood on one reporting host?
  context: Supports the Inhibit Response Function tactic. Baseline inbound connection rate and source-IP
    entropy for each monitored OT service. Flag when connection counts exceed the mean by at least five
    standard deviations while source entropy drops below the 10th percentile, consistent with a focused
    flood concentrating on one reporting host. Confirm onset with change-point detection on the connection-rate
    series, and derive failed/half-open-ratio and packets-per-second thresholds from labeled flood traffic
    (e.g., CIC-DDoS2019). A positive result - a large connection surge from a narrow set of sources targeting
    a single reporting endpoint - is the statistical signature of a targeted DoS that suppresses reporting;
    the low source entropy distinguishes a focused attack from broad, organic traffic growth.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Network interfaces of HMIs, Historians, and Control Servers; network segments/VLANs dedicated
    to process control.'
  range: Last 90 days (per-service baseline; confirm onset via change-point)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=zeek source=\"conn.log\" service IN (modbus,dnp3) \n| bin _time span=1m | stats count\
      \ as conns, dc(src_ip) as srcs, entropy(src_ip) as src_ent by _time, dest\n| eventstats avg(conns)\
      \ as mu, stdev(conns) as sd, p10(src_ent) as p10_ent by dest\n| eval z=(conns-mu)/sd\n| where z\
      \ >= 5 AND src_ent < p10_ent\n| append [ cpd(series=conns, by=dest) where changepoint ]\n| alert"
- question: Does an Isolation Forest or online autoencoder ensemble score any 1-minute window of Zeek
    flow features (failed_connection_ratio, source_ip_entropy, session duration, byte volume) above the
    99th percentile of normal OT traffic - and what are the top-3 contributing features?
  context: Supports the Inhibit Response Function tactic. Train an Isolation Forest or online autoencoder
    ensemble (Kitsune-style) on Zeek flow features such as failed_connection_ratio, source_ip_entropy,
    session duration, and byte volume. Alert on any 1-minute window whose anomaly score exceeds the 99th
    percentile of normal OT traffic, and emit the top-3 contributing features in the alert text via SHAP/feature-importance
    attribution. Keep the deterministic rate/ratio rules as the floor because model-free ML detectors
    degrade on unseen attacks. A positive result identifies a flow-level pattern consistent with a DoS
    that suppresses reporting even when no single fixed threshold is tripped; the feature attribution
    explains which behavior (error ratio, entropy, volume) drove the score and accelerates triage.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Network interfaces of HMIs, Historians, and Control Servers; network segments/VLANs dedicated
    to process control.'
  range: Last 90 days (1-minute scoring windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = zeek_flow_features(window='1m',\n      cols=['failed_connection_ratio','source_ip_entropy','session_duration','byte_volume'])\n\
      model = IsolationForest()  # or online autoencoder ensemble (Kitsune)\nmodel.fit(X_normal)\nfor\
      \ w in X:\n    if model.anomaly_score(w) > p99(normal_scores):\n        alert(dest=w.dest, top3=explain(w,\
      \ k=3))\n# floor: keep deterministic rate/ratio rules active"
