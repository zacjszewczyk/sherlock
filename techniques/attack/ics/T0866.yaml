  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = aggregate_flows(window=5m, fields=[dst_port,byte_ratio,pkt_rate,conn_count])\n\
      score = kitsune_autoencoder_ensemble.predict(features)\nif score > anomaly_threshold:\n    top3\
      \ = xnids_attribution(features)\n    emit alert(score, top3)"
- question: Which OT-asset service crashes (Windows Event ID 1000) or unexpected service terminations
    (Event ID 7031/7034) occurred within 60 seconds of an accepted inbound IT connection (Event ID 5156)
    to that service's listening port, indicating a possible exploit attempt?
  context: 'In the context of Initial Access, this Symbolic Logic technique addresses the analytic goal
    "Correlate service crashes with inbound IT connections." Alert when an OT-asset service crash (Windows
    Event ID 1000) or unexpected termination (Event ID 7031/7034) occurs within 60 seconds of an accepted
    inbound IT connection (Event ID 5156) to that service''s listening port, using stateful inbound-payload-to-effect
    correlation per [NCC Group stateful exploit-chain correlation](https://www.nccgroup.com/research-blog/log4shell-reconnaissance-and-post-exploitation-network-detection/).
    The underlying observable is: A critical OT asset''s service (e.g., on an HMI, SCADA server) registers
    an application crash (Windows Event ID 1000) or an unexpected service termination (Windows Event ID
    7031, 7034) within 60 seconds of receiving and accepting an inbound network connection (Windows Event
    ID 5156) from an IT network segment, where the connection''s destination port matches the affected
    service''s listening port. A positive result indicates likely exploitation of remote services relevant
    to initial access; a negative result helps rule out this vector and should be corroborated with the
    other questions in this playbook.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 7034
  - Windows Event ID 7031
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA servers, Historian servers,
    and critical Windows-based control system assets in the Process Control Network (PCN) or Supervisory
    Control Network (SCN).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=wineventlog (EventCode=1000 OR EventCode=7031 OR EventCode=7034) host IN OT_assets

      | join host [search EventCode=5156 src_zone=IT direction=inbound]

      | where abs(crash_time - conn_time) <= 60s AND conn_dst_port == service_listen_port

      | eval alert="crash within 60s of accepted inbound IT connection"'
