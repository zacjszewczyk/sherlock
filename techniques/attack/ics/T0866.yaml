    to score never-before-seen source-host -> OT-service-port edges crossing the IDMZ, alerting on low-probability
    first-contact edges to critical assets. The underlying observable is: An inbound network connection
    from an untrusted IT network segment to a critical OT asset''s service port (e.g., SMB/445, RDP/3389,
    VNC/5900, Modbus/502, DNP3/20000) that either: 1) violates a pre-defined IT/OT communication whitelist,
    2) targets a known vulnerable service (e.g., SMBv1), 3) exhibits a protocol anomaly detected by a
    sensor (e.g., a non-standard SMB negotiation sequence), or 4) contains a payload whose Shannon entropy
    exceeds the 95th percentile for that specific protocol and communication channel. A positive result
    indicates likely exploitation of remote services relevant to initial access; a negative result helps
    rule out this vector and should be corroborated with the other questions in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek smb.log
  - Zeek rdp.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 5156
  - 'NAI: Industrial Demilitarized Zone (IDMZ) network segments, firewalls at the IT/OT boundary, remote
    access gateways for OT, historian servers with external interfaces, and network switches/routers connecting
    IT and OT zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek dst_zone=OT

      | eval edge=src_ip."->".dst_ip.":".dst_port

      | lookup historical_edges edge OUTPUT seen_count

      | eval p_new = bayesian_new_edge_prob(src_ip,dst_ip,dst_port)

      | where isnull(seen_count) AND p_new < 0.01 AND dst_asset_criticality="high"

      | eval alert="low-probability first-contact IT->OT edge"'
- question: Which source hosts are generating bursts of firewall-denied or failed/rejected protocol negotiations
