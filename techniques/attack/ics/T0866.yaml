name: 'T0866: Exploitation of Remote Services'
id: 5bb8ac7a-9550-4c37-aa06-8443a0b19ea7
description: This playbook helps an analyst investigate adversary Exploitation of Remote Services (T0866)
  across the IT/OT boundary and within the ICS environment. Adversaries exploit software vulnerabilities
  in remote services (e.g., SMBv1/MS17-010, RDP, VNC) and ICS protocols (Modbus, DNP3) to gain initial
  access into the OT environment and to move laterally toward targeted control systems, as seen with wormable
  malware such as WannaCry, NotPetya, and BadRabbit migrating from IT into industrial networks. It guides
  investigation of inbound IT-to-OT connections that violate IT/OT communication allowlists, target known-vulnerable
  services, exhibit protocol-state or payload entropy anomalies, or constitute never-before-seen edges
  into critical assets; OT-asset service crashes and unexpected service terminations correlated with accepted
  inbound connections; OT-to-OT fan-out and honey-host hits indicative of lateral movement; and anomalous
  child processes spawned by critical OT applications shortly after receiving network connections. The
  playbook combines symbolic-logic allowlisting and signature/specification-based detection, statistical
  baselining (byte-frequency entropy, Mahalanobis volume, Bayesian new-edge scoring, failure-state profiling),
  and machine-learning anomaly models (autoencoder ensembles, LSTM process-sequence models, graph analytics)
  to surface and triage exploitation activity in NAIs such as the IDMZ, IT/OT firewalls, remote-access
  gateways, historians, engineering workstations, HMIs, and SCADA servers.
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
- tactic_id: TA0109
  tactic_name: Lateral Movement
