questions:
- question: Which inbound connections from untrusted IT network segments to critical OT service ports
    (SMB/445, RDP/3389, VNC/5900, Modbus/502, DNP3/20000) violate the IT/OT communication allowlist, use
    deprecated SMBv1/MS17-010 negotiation, break the expected protocol-state specification, or match known
    exploit signatures in Zeek notice.log?
  context: 'In the context of Initial Access, this Symbolic Logic technique addresses the analytic goal
    "Alert on IT-to-OT connection violations." Enforce a deterministic IT/OT communication allowlist for
    remote-service and ICS ports (SMB/445, RDP/3389, VNC/5900, Modbus/502, DNP3/20000); deny legacy SMBv1/MS17-010
    negotiation outright, validate protocol-state transitions against an explicit specification, and correlate
    exploit signatures in Zeek notice.log, per [Berthier and Sanders specification-based IDS](https://www.perform.illinois.edu/Papers/USAN_papers/11BER01.pdf),
    [BZAR Zeek SMB/DCE-RPC analytics](https://github.com/mitre-attack/bzar), and tuned IDS signatures
    [Diaz-Verdejo et al. signature IDS tuning](https://www.mdpi.com/2076-3417/12/2/852); keep connection-policy
    logic per [Ghorbani et al. Network Intrusion Detection and Prevention](https://doi.org/10.1007/978-0-387-88771-5).
    The underlying observable is: An inbound network connection from an untrusted IT network segment to
    a critical OT asset''s service port (e.g., SMB/445, RDP/3389, VNC/5900, Modbus/502, DNP3/20000) that
    either: 1) violates a pre-defined IT/OT communication whitelist, 2) targets a known vulnerable service
    (e.g., SMBv1), 3) exhibits a protocol anomaly detected by a sensor (e.g., a non-standard SMB negotiation
    sequence), or 4) contains a payload whose Shannon entropy exceeds the 95th percentile for that specific
    protocol and communication channel. A positive result indicates likely exploitation of remote services
    relevant to initial access; a negative result helps rule out this vector and should be corroborated
    with the other questions in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek smb.log
  - Zeek rdp.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 5156
  - 'NAI: Industrial Demilitarized Zone (IDMZ) network segments, firewalls at the IT/OT boundary, remote
    access gateways for OT, historian servers with external interfaces, and network switches/routers connecting
    IT and OT zones.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from conn.log, smb.log, rdp.log, modbus.log, dnp3.log\nwhere src_ip in IT_zone and dst_ip\
      \ in OT_zone\nand dst_port in [445,3389,5900,502,20000]\nfilter (src_ip,dst_ip,dst_port) not in\
      \ IT_OT_allowlist\n   or smb_dialect == 'SMBv1' or smb_signature matches MS17-010\n   or protocol_state\
      \ not in allowed_state_transitions\njoin notice.log where note matches exploit_signature\nemit alert"
  - technology: SIEM/Rule pseudocode
    query: 'index=firewall OR index=zeek dst_zone=OT dst_port IN (445,3389,5900,502,20000)

      | lookup it_ot_allowlist src_ip dst_ip dst_port OUTPUT permitted

      | where isnull(permitted) OR dialect="SMBv1"

      | eval alert="IT->OT remote-service policy violation"'
- question: Which IT/OT communication channels show payload Shannon entropy above the 95th percentile
    or connection volume (bytes/connection, connections/minute) more than three standard deviations above
    their site-specific baseline, suggesting encoded or exploit payloads crossing into the OT environment?
  context: 'In the context of Initial Access, this Statistical Method technique addresses the analytic
    goal "Baseline channel payload entropy and volume." Baseline per-channel Volume (bytes/connection,
    connection counts/min) and per-port/per-length byte-frequency with Mahalanobis distance and payload
    Shannon entropy per [Wang and Stolfo PAYL byte-frequency anomaly detection](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11);
    alert on >95th-percentile entropy or >3 standard-deviation Volume spikes, deriving site-specific percentile
    thresholds from representative OT captures indexed in [Conti et al. ICS testbeds and datasets survey](https://arxiv.org/abs/2102.05631).
    The underlying observable is: An inbound network connection from an untrusted IT network segment to
    a critical OT asset''s service port (e.g., SMB/445, RDP/3389, VNC/5900, Modbus/502, DNP3/20000) that
    either: 1) violates a pre-defined IT/OT communication whitelist, 2) targets a known vulnerable service
    (e.g., SMBv1), 3) exhibits a protocol anomaly detected by a sensor (e.g., a non-standard SMB negotiation
    sequence), or 4) contains a payload whose Shannon entropy exceeds the 95th percentile for that specific
    protocol and communication channel. A positive result indicates likely exploitation of remote services
    relevant to initial access; a negative result helps rule out this vector and should be corroborated
    with the other questions in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek smb.log
  - Zeek rdp.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 5156
  - 'NAI: Industrial Demilitarized Zone (IDMZ) network segments, firewalls at the IT/OT boundary, remote
    access gateways for OT, historian servers with external interfaces, and network switches/routers connecting
    IT and OT zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek src_zone=IT dst_zone=OT

      | eval entropy=shannon(payload), bytes_per_conn=orig_bytes+resp_bytes

      | stats p95(entropy) as e95 avg(bytes_per_conn) as mu stdev(bytes_per_conn) as sd by dst_port channel

      | where entropy>e95 OR bytes_per_conn>mu+3*sd

      | eval method="PAYL byte-frequency + Mahalanobis volume"'
- question: Which never-before-seen source-host to OT-service-port edges crossing the IDMZ score as low-probability
    first-contact connections to critical assets under a Bayesian new-edge model?
  context: 'In the context of Initial Access, this Statistical Method technique addresses the analytic
    goal "Score first-time IT-to-OT edges." Apply a Bayesian new-edge model per [Metelli and Heard Bayesian
