- question: Which OT hosts connected to more than 10 unique OT destinations on remote/ICS ports within
    5 minutes, or touched an OT honey-host, indicating lateral-movement fan-out or scanning?
  context: 'In the context of Lateral Movement, this Symbolic Logic technique addresses the analytic goal
    "Alert on OT fan-out and honey-host hits." Alert when an OT host exceeds 10 unique destinations on
    remote/ICS ports in 5 minutes or connects to a honey-host, and enforce the OT-segment communication
    allowlist and protocol-state specification per [Berthier and Sanders specification-based IDS](https://www.perform.illinois.edu/Papers/USAN_papers/11BER01.pdf);
    detect SMB/DCE-RPC remote-service abuse with [BZAR Zeek SMB/DCE-RPC analytics](https://github.com/mitre-attack/bzar).
    The underlying observable is: An OT host initiates outbound connections on common remote service ports
    (e.g., SMB/445, RDP/3389, VNC/5900) or ICS protocols (e.g., Modbus/502, DNP3/20000) to a number of
    unique destination OT hosts that exceeds a hard threshold (e.g., >10 hosts in 5 minutes) or is a statistically
    significant outlier compared to its own historical baseline (e.g., >99th percentile of unique hosts
    contacted in a 10-minute window). A positive result indicates likely exploitation of remote services
    relevant to lateral movement; a negative result helps rule out this vector and should be corroborated
    with the other questions in this playbook.'
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Zeek rdp.log
  - Zeek dce_rpc.log
  - Windows Event ID 4624
  - 'NAI: Supervisory Control Network (SCN), Process Control Network (PCN), individual device networks
    (e.g., for PLCs, RTUs, IEDs), internal OT firewalls, and network switches/routers within the OT environment.'
