  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=firewall action IN ("deny","reset") dst_zone=OT

      | bin _time span=10m

      | stats count as blocked by src_ip _time

      | eventstats avg(blocked) as mu stdev(blocked) as sd by src_ip

