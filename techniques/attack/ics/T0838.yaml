    LSTM over event keys and parameters, alerting on out-of-sequence stops, missing periodic heartbeats,
    or surges. This complements the deterministic stop/start-type rules by catching stealthy patterns
    and missing-heartbeat conditions. A positive result is an anomalous service event sequence that should
    be correlated with the initiating process and host; a negative result matches the service's historical
    behavior.
