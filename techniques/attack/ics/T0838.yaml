  - technology: SIEM/Stats CUSUM pseudocode
    query: "for tag in alarm_relevant_tags:\n  expected = trajectory(tag)  # engineering bounds or MPC\
      \ reference\n  resid = observed(tag) - expected\n  cusum = nonparametric_cusum(resid)\n  if cusum\
      \ > threshold(tag): alert('residual_accumulation', tag)\n  if no_update(tag, expected_interval):\
      \ alert('stale_tag', tag)"
