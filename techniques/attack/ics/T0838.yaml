- question: Does historian or live process data show a critical process variable exceeding its documented
    alarm setpoint or limit while the corresponding alarm tag remains inactive — i.e., an invariant such
    as 'IF level > HI_LIMIT THEN alarm_HI = ACTIVE' is violated?
  context: Physics-based corroboration directly reveals altered or suppressed alarm thresholds even when
    the configuration write was not observed. From asset-management records and mined operational invariants,
    encode predicates linking each critical process variable to its documented alarm setpoint/limit and
    the alarm tag that must be active when breached (e.g., IF level > HI_LIMIT THEN alarm_HI = ACTIVE).
    Continuously evaluate these invariants on historian/live data and alert deterministically when a value
    exceeds its limit while the alarm remains inactive — a direct, explainable indicator of altered or
    suppressed alarm settings. Invariants of this form are auto-mineable from normal operational logs,
    and semantic rules over the underlying DNP3/Modbus/IEC 61850 limit-write traffic can confirm the change.
    A positive result is high-confidence evidence that an alarm has been silenced relative to real process
    conditions and should be tied back to the file/network/service detections.
  answer_sources:
  - Process History/Live Data (DC0107)
  - Operational Databases / Historian tags
  - Network Traffic Content (DC0085)
  - Application Log Content (DC0038)
  - 'NAI: Data Historian Servers, SCADA Servers, HMIs, Alarm management servers, OPC/Data Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Invariant rule pseudocode
    query: "invariants = mine_from_normal_logs() + asset_mgmt_limits()\nfor var in critical_vars:\n  if\
      \ value(var) > HI_LIMIT(var) and alarm_tag(var) != ACTIVE: alert('invariant_violation', var)\n \
      \ if value(var) < LO_LIMIT(var) and alarm_tag(var) != ACTIVE: alert('invariant_violation', var)\n\
      # confirm via DNP3/Modbus/IEC61850 limit-write semantic rule"
- question: For each alarm-relevant process variable, does the residual between its expected trajectory
    (engineering bounds or a model-predictive reference) and its observed value accumulate in a nonparametric
    CUSUM detector to an alert — capturing a value pinned just below an alarm limit, a frozen/flatlined
    channel, or stale/missing tag updates?
  context: Statistical residual monitoring catches stealthy manipulation where a variable is held just
    under an alarm limit or a channel is frozen. Maintain an expected trajectory for each alarm-relevant
    variable (engineering bounds or a model-predictive reference) and compute the residual against observed
    values; accumulate it in a nonparametric CUSUM detector so that an attacker pinning a value just below
    an alarm limit, or a frozen/flatlined channel, accumulates to an alert. Derive residual thresholds
    from each tag's normal operating distribution and explicitly treat stale or missing tag updates (no
    value change over the expected reporting interval) as a distinct failure-mode signal. A positive result
    indicates process behavior inconsistent with healthy alarm coverage and complements the invariant
    check.
  answer_sources:
  - Process History/Live Data (DC0107)
  - Operational Databases / Historian tags
  - Network Traffic Content (DC0085)
  - Application Log Content (DC0038)
  - 'NAI: Data Historian Servers, SCADA Servers, HMIs, Alarm management servers, OPC/Data Gateways'
