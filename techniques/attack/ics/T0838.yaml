questions:
- question: Did a non-allowlisted user or process perform a write, delete, or permission change to a critical
    alarm configuration file (e.g., C:\SCADA\Projects\*.ALM, D:\HMI_Config\*.XML) on an engineering workstation,
    HMI, or historian, and did that change occur outside an approved maintenance window or originate from
    a scripting engine or anomalous parent process?
  context: Modifying alarm settings frequently begins with a direct edit to an alarm configuration file
    on a trusted engineering host. Maintain a watchlist of critical alarm configuration file paths and
    an allowlist of authorized engineering users and processes, applying the deny-by-default and application-allowlisting
    guidance in NIST SP 800-82r3. Monitor Windows Event ID 4663 (Object Access) or 5145 (Detailed File
    Share) for write/delete access and correlate the ProcessId with Event ID 4688 (Process Creation) to
    resolve the user, process, and parent process. Alert if the modifying user/process is not allowlisted
    (e.g., powershell.exe, certutil.exe, wmic.exe) or if the change occurs outside a documented maintenance
    window. In the deterministic, low-variability ICS environments typical of process control, specification-based
    rules of this kind yield very low false positives. A positive result is a strong indicator that an
    adversary is tampering with alarm configuration to inhibit response functions; a benign result is
    an allowlisted engineer working during a sanctioned window.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 5145
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian servers, Data Gateways/OPC
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "watch_paths=['C:\\\\SCADA\\\\Projects\\\\*.ALM','D:\\\\HMI_Config\\\\*.XML']\nfor evt in (EventID\
      \ in [4663,5145] where ObjectName matches watch_paths and AccessMask in [WRITE,DELETE,WRITE_DAC]):\n\
      \  proc = join EventID=4688 on ProcessId -> user, image, parent_image\n  if proc.user not in eng_allowlist\
      \ or proc.image in ['powershell.exe','certutil.exe','wmic.exe'] or not in_maintenance_window(evt.time):\n\
      \    raise alert(evt, proc)"
- question: Has the hourly volume or frequency of write/delete events to monitored alarm configuration
    files exceeded the 99th percentile of its 60-day baseline, or has the Shannon entropy of the parent
    processes and user accounts modifying these files shifted by more than two sigma (for example a sharp
    drop indicating a single actor making many edits)?
  context: 'Beyond individual unauthorized edits, statistical baselining catches bursts of activity and
    shifts in who or what is touching alarm configuration files. For each monitored path, build a 60-day
    baseline of write/delete events (Event ID 4663/5145) and alert when the hourly count exceeds the 99th
    percentile. Compute the Shannon entropy of parent-process names and user accounts over a rolling 24-hour
    window: a sharp drop (one actor performing all edits) or a greater-than-two-sigma shift from baseline
    entropy is alertable, applying feature-distribution entropy analysis. Additionally treat access-denied/failed-write
    events (Event ID 4656 with a failure status) as a distinct failure-mode signal of an adversary probing
    for config files. Derive percentile and entropy thresholds per asset from its own history so the baseline
    reflects normal operations. A positive result suggests bulk or concentrated tampering with alarm settings
    consistent with inhibiting response functions.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 5145
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian servers, Data Gateways/OPC
    Servers'
  range: Last 60 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_path_hourly_counts(EventID in [4663,5145], window=60d)

      if hourly_count(path) > percentile(baseline[path], 99): alert(''volume'')

      H = shannon_entropy(parent_process + user for edits over rolling 24h)

      if H < baseline_H - 2*sigma or abs(H-baseline_H) > 2*sigma: alert(''entropy_shift'')

      if EventID=4656 and status=FAILURE: alert(''failed_write_probe'')'
- question: Does the sequence of application and security log events surrounding an alarm-config edit
    (open, write, save, service reload) deviate from the learned normal sequence — for example an out-of-order
    save, an unexpected surge of edits, or a gap where an expected event is missing?
  context: Adversaries who tamper with alarm configuration often produce log event sequences that differ
    subtly from normal engineering workflows even when each individual event looks legitimate. Model the
    normal sequence of application/security log events around alarm-config edits with a DeepLog-style
    LSTM that learns event-key sequences and per-event parameter distributions, alerting on out-of-sequence
    events or surge/gap patterns. Pair the model with the deterministic allowlist rules so that a learned-model
    miss never removes the deterministic detection floor. A positive result is an anomalous edit workflow
    that warrants pivoting to the file, process, and user details; a negative result is a workflow matching
    the historical norm.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 5145
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian servers, Data Gateways/OPC
    Servers'
  range: Last 90 days
  queries:
  - technology: ML/DeepLog LSTM pseudocode
    query: 'seq = event_key_sequence(app+security logs around alarm_config edits)

      model = DeepLog_LSTM.train(normal_sequences)

      if model.predict_next(seq) not in topk or surge_or_gap(seq): alert(''sequence_anomaly'')

      # deterministic floor from PLACEHOLDER1 always runs in parallel'
- question: When a supervised classifier scores an alarm configuration file change using process name,
    parent process, user, time-of-day, day-of-week, file path, scripting-engine flag, and outside-maintenance-window
    flag, does it predict the change is malicious with probability greater than 0.90, and which top-3
    features drove that decision?
  context: A supervised model can fuse many weak signals to classify alarm-config changes that rules alone
    might miss. Deploy a Random Forest or Gradient Boosting classifier on Event ID 4663/4688 features
    (process name, parent process, user, time-of-day, day-of-week, file path, scripting-engine boolean,
    outside-maintenance-window boolean), labeled from prior incident response. Random Forests give strong
    accuracy with interpretable feature importance on industrial data, and every alert MUST list the top-3
    contributing features rather than just a score so an analyst can validate it. Alert on predicted-malicious
    with probability greater than 0.90, running in parallel with the symbolic-logic rules because ML alone
    is evadable. A positive result with sensible top features (e.g., powershell parent + off-hours + outside
    window) strongly corroborates malicious alarm tampering.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 5145
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian servers, Data Gateways/OPC
    Servers'
  range: Last 90 days
  queries:
  - technology: ML/Random Forest pseudocode
    query: 'X = features(EventID 4663/4688: image,parent_image,user,hour,dow,file_path,is_scripting_engine,outside_window)

      model = RandomForest.train(labeled_incidents)

      p = model.predict_proba(X)[''malicious'']

      if p > 0.90: alert(X, top3=model.feature_importance(X))'
- question: Was a file whose name or extension matches a known alarm configuration file (e.g., *.alm,
    *.prj, *.cfg) transferred to or from a critical ICS asset from a non-allowlisted source host, over
    an unapproved protocol or port, or with a SHA1 hash that does not match the known-good version?
  context: Alarm settings can be altered by pushing a tampered configuration file across the network rather
    than editing it locally. Maintain a watchlist of alarm configuration filenames and an allowlist of
    known-good SHA1 hashes and authorized source hosts/ports/protocols, consistent with deny-by-default
    conduits and protocol allowlisting in NIST SP 800-82r3. In Zeek files.log, alert on transfers where
    the filename matches and the destination (rx_hosts) is a critical ICS asset; join conn.log on uid
    and alert if id.orig_h or id.resp_p is not allowlisted, or if the files.log sha1 does not match the
    known-good hash. For ICS protocol carriers (DNP3/Modbus/IEC 61850), apply auto-generated semantic
    rules over function codes, source/destination relationships, and point/limit ranges to flag writes
    that alter alarm or limit settings. A positive result indicates an unauthorized config delivery that
    could silence alarms across the IT/OT boundary.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek smb_files.log
  - Zeek ftp.log
  - 'NAI: IT/OT boundary firewalls, Industrial Demilitarized Zones (IDMZ), Control Network segments (Process
    Control, Safety Instrumented Systems), Wireless Industrial Networks'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "watch_names=['*.alm','*.prj','*.cfg']\nfor f in files.log where filename matches watch_names\
      \ and rx_hosts in critical_ics:\n  c = join conn.log on uid\n  if c.id.orig_h not in host_allowlist\
      \ or c.id.resp_p not in port_allowlist or f.sha1 not in known_good_hashes:\n    alert(f,c)\n# ICS\
      \ carriers: DNP3/Modbus/IEC61850 semantic rule on limit/alarm function codes -> alert on out-of-range\
      \ limit write"
- question: Has the daily count or total byte volume of alarm config-file transfers to a critical asset
    exceeded the 99th percentile of its 60-day baseline, has the Shannon entropy of source IPs transferring
    these files dropped sharply (indicating a single host doing bulk transfers), or are there spikes in
    rejected/blocked connections or failed FTP/SMB transfers?
  context: Statistical baselining of transfer telemetry catches anomalous delivery patterns and reconnaissance
    of config files. Per critical asset, baseline the daily count and total volume (sum of total_bytes
    in files.log) of config-file transfers over 60 days and alert above the 99th percentile. Compute the
    Shannon entropy of source IPs transferring these files over a rolling 24-hour window; a sudden entropy
    drop indicates a single anomalous host doing bulk transfers. Explicitly profile failure-mode State
    signals — spikes in rejected/blocked connections (conn.log conn_state S0/REJ) or failed FTP/SMB transfers
    — as distinct indicators of unauthorized transfer attempts. Derive thresholds per asset from its own
    traffic history. A positive result points to either a burst of config pushes or repeated blocked attempts
    consistent with an adversary trying to deliver tampered alarm settings.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek smb_files.log
  - Zeek ftp.log
  - 'NAI: IT/OT boundary firewalls, Industrial Demilitarized Zones (IDMZ), Control Network segments (Process
    Control, Safety Instrumented Systems), Wireless Industrial Networks'
  range: Last 60 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'base = per_asset_daily(count,sum(total_bytes)) of config transfers over 60d

      if daily_count>percentile(base.count,99) or daily_bytes>percentile(base.bytes,99): alert(''volume'')

      H = shannon_entropy(src_ip transferring config files, rolling 24h)

      if H << baseline_H: alert(''single_host_bulk'')

      if spike(conn_state in [''S0'',''REJ'']) or failed_ftp_smb: alert(''blocked_attempts'')'
- question: When an unsupervised reconstruction model is run over hourly Zeek conn.log/files.log features
    (total bytes, packet count, unique-protocol count, file-transfer count, mean file size, mean session
    duration) for a critical asset, does the reconstruction or forecast residual exceed the tuned percentile
    threshold, and which top-3 features explain the anomaly?
  context: Time-series anomaly detection captures multivariate deviations in transfer behavior that simple
    thresholds miss. Train an unsupervised reconstruction model (1D-CNN/autoencoder or LSTM autoencoder)
    on at least 90 days of hourly Zeek conn.log/files.log features (total bytes, packet count, unique-protocol
    count, file-transfer count, mean file size, mean session duration) and alert when the reconstruction
    or forecast residual exceeds a tuned percentile, following the predict-then-threshold-residual design
    validated on ICS telemetry. Use one-class models where only normal data exists. The alert must report
    the top-3 contributing features, and it runs alongside the deterministic hash/allowlist floor since
    reconstruction detectors are evadable. A positive result is an anomalous transfer profile to a critical
    asset that should be investigated against the config-file allowlist.
  answer_sources:
  - Zeek files.log
  - Zeek conn.log
  - Zeek smb_files.log
  - Zeek ftp.log
  - 'NAI: IT/OT boundary firewalls, Industrial Demilitarized Zones (IDMZ), Control Network segments (Process
    Control, Safety Instrumented Systems), Wireless Industrial Networks'
  range: Last 90 days
  queries:
  - technology: ML/Autoencoder pseudocode
    query: 'X = hourly_features(conn.log/files.log: total_bytes,pkts,uniq_proto,file_xfers,mean_file_size,mean_duration)

      ae = Autoencoder.train(>=90d normal)

      r = reconstruction_error(ae, X)

      if r > tuned_percentile: alert(X, top3=feature_attribution(ae,X))

      # runs alongside hash/allowlist floor'
- question: Did a watchlisted critical ICS alarm service (e.g., CitectAlarm, FTAEAlarms) enter the 'stopped'
    state without a legitimate system shutdown (Event ID 1074) being logged on the same host within the
    preceding 5 minutes, was the stop initiated by net.exe/sc.exe/taskkill.exe/powershell.exe, or was
    the service start-type changed (Event ID 7040), especially to 'Disabled'?
  context: Stopping or disabling an alarm service is a direct way to inhibit the response function. Maintain
    a watchlist of critical ICS service names. Alert on Windows Event ID 7036 where a watchlisted service
    enters 'stopped'; suppress the alert only if Event ID 1074 (System Shutdown) is logged on the same
    host within the preceding 5 minutes. If not suppressed, correlate Event ID 4688 to identify the initiating
    process (net.exe, sc.exe, taskkill.exe, powershell.exe). Raise high priority on any service start-type
    change (Event ID 7040), especially to 'Disabled'. A silenced or stopped alarm service is itself a
    signal, consistent with continuous loss-of-function monitoring in NIST SP 800-82r3, and specification-based
    service-state rules give low false positives in ICS. A positive result means alarm monitoring may
    be down precisely when an adversary needs cover for impact.
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 1074
  - Windows Event ID 4688
  - Windows Event ID 7040
  - 'NAI: Operator Stations, Human-Machine Interfaces (HMIs), Alarm management servers, SCADA Servers,
    Data Historian Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "watch_svc=['CitectAlarm','FTAEAlarms']\nfor e in EventID=7036 where service in watch_svc and\
      \ state='stopped':\n  if exists EventID=1074 on same host within 5min before e.time: suppress\n\
      \  else:\n    proc = correlate EventID=4688 (net.exe,sc.exe,taskkill.exe,powershell.exe)\n    alert(e,\
      \ proc)\nif EventID=7040 and service in watch_svc and new_start_type='Disabled': alert(high)"
- question: For each critical alarm service, did a stop occur after an uptime below the 5th percentile
    of its 90-day baseline (a premature stop), did the daily unsuppressed stop count exceed the 99th percentile,
    or did a CUSUM test over the running deficit of expected alarm/heartbeat events accumulate to an alert
    from repeated short or stealthy outages?
  context: An adversary may evade simple stop alerts by toggling a service in short bursts or causing
    stealthy outages that individually stay under threshold. For each critical service, track uptime between
    started/stopped states (Event ID 7036) over a 90-day baseline; alert when a stop occurs after an uptime
    below the 5th percentile (premature stop) and when the daily unsuppressed stop count exceeds the 99th
    percentile. Apply a CUSUM (cumulative-sum) test over the running deficit of expected alarm/heartbeat
    events so that repeated short or stealthy outages accumulate to an alert even when each is individually
    below threshold. Treat failed service-control attempts (Event ID 7040 failures, access-denied) as
    a distinct failure-mode signal. A positive result reveals patterned service instability consistent
    with deliberate alarm inhibition rather than a one-off restart.
  answer_sources:
  - Windows Event ID 7036
  - Windows Event ID 1074
  - Windows Event ID 4688
  - Windows Event ID 7040
  - 'NAI: Operator Stations, Human-Machine Interfaces (HMIs), Alarm management servers, SCADA Servers,
    Data Historian Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats CUSUM pseudocode
    query: 'base = uptime_distribution(EventID=7036 started->stopped, 90d)

      if uptime < percentile(base,5): alert(''premature_stop'')

      if daily_unsuppressed_stops > percentile(base.daily,99): alert(''frequent_stops'')

      cusum += (expected_heartbeats - observed_heartbeats); if cusum > h: alert(''accumulated_deficit'')

      if EventID=7040 failure or access_denied: alert(''failed_control'')'
- question: Does the sequence and rate of alarm-manager/service events deviate from the learned normal
