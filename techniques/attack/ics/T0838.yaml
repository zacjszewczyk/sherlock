name: 'T0838: Modify Alarm Settings'
id: 7258868f-a1bd-4fcf-a74a-fbf99b18c960
description: 'Investigate whether an adversary is modifying or suppressing critical process alarm settings
  to blind operators and prevent protective responses to dangerous or unintended ICS conditions, consistent
  with the Inhibit Response Function tactic. This playbook helps an analyst pursue four complementary
  lines of evidence: (1) unauthorized edits to alarm configuration files on engineering workstations,
  HMIs, and historians (write/delete/permission changes by non-allowlisted users or processes, outside
  maintenance windows, or from anomalous parent processes); (2) anomalous network transfers of alarm configuration
  files across IT/OT boundaries (unknown source hosts, unapproved protocols/ports, hash/size deviations,
  and ICS-protocol limit-writes over DNP3/Modbus/IEC 61850); (3) inhibition of alarm-related ICS services
  (suspicious service stops not preceded by a legitimate shutdown, start-type changes to Disabled, premature
  outages); and (4) physics-based corroboration where historian/live process data shows a setpoint or
  limit silently breached without the expected alarm event firing. Each line provides deterministic symbolic-logic
  rules running in parallel with statistical baselines (volume/frequency, Shannon entropy, CUSUM) and
  machine-learning detectors (sequence models, supervised classifiers, reconstruction/forecast models)
  so alerts remain defensible, explainable, and resistant to evasion.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
