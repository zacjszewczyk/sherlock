  queries:
  - technology: SIEM/Stats pseudocode
    query: 'load conn.log | bin _time span=1h

      | stats dc(resp_h) as fanout count as conns entropy(resp_p) as port_ent by orig_h,_time

      | eventstats p99(fanout) as t1 p99(conns) as t2 p99(port_ent) as t3 by orig_h

      | where fanout>t1 OR conns>t2 OR port_ent>t3 -> alert'
