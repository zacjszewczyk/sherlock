- question: '[Discovery] Alert on policy-violating connections: Can you determine whether an ICS host
    exhibits anomalous network scanning behavior, indicated by communication with an abnormally high number
    of unique destination IPs or communication with IPs outside of its established communication allowlist.
    -- specifically, using the ''Alert on policy-violating connections'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary uses Network Sniffing
    (T0842) to capture ICS traffic and learn the internal network, control-system devices, protocols,
    and credentials needed to orient and select targets for collection and lateral movement. This evidence
    focuses on the condition that an ICS host exhibits anomalous network scanning behavior, indicated
    by communication with an abnormally high number of unique destination IPs or communication with IPs
    outside of its established communication allowlist. The ''Alert on policy-violating connections''
    approach (Symbolic Logic) works as follows: Enforce approved source-destination-port tuples (allowlist)
    over Zeek conn.log and alert on any connection violating policy; OT allowlists and semantic protocol
    rules yield low-false-positive deterministic detection ([A Survey of Intrusion Detection Techniques
    for Cyber-Physical Systems, Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf);
    [Distributed IDS using Semantic-based Rules for SCADA, Mohan et al.](https://arxiv.org/abs/2412.07917)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable network
    sniffing or its supporting reconnaissance; pivot to the responsible host and asset role (EWS/HMI/historian/SCADA/PLC),
    the user or process involved, the network segment and SPAN/mirror context, the protocols and peers
    observed, and the timing of the activity to scope what traffic could have been captured. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land sniffing.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network segments connecting PLCs, RTUs, and SCADA servers; network choke points between the
    IT and OT networks; switch port mirror/SPAN sessions on critical ICS segments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'load conn.log

      allowlist = approved {orig_h, resp_h, resp_p} tuples for OT segment

      for c in conn: if {c.orig_h,c.resp_h,c.resp_p} not in allowlist: alert(policy_violation, c)'
- question: '[Discovery] Baseline fan-out and port entropy: Can you determine whether an ICS host exhibits
