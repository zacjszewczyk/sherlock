  queries:
  - technology: SIEM/Stats pseudocode
    query: 'load conn.log per protocol/host-pair

      | stats avg(duration) as mu_d stdev(duration) as sd_d avg(orig_bytes+resp_bytes) as mu_b stdev(...)
      as sd_b by proto,pair

      | where duration > mu_d+3*sd_d OR bytes > mu_b+3*sd_b -> alert

      + PAYL: per host/port/length byte-frequency profile scored with Mahalanobis distance -> flag anomalous
      payload'
