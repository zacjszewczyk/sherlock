questions:
- question: '[Discovery] Alert on known sniffer tools or drivers: Can you determine whether a process
    is created or a service is installed on a critical ICS asset that matches a known network sniffing
    tool, or a running process loads a known packet capture library. -- specifically, using the ''Alert
    on known sniffer tools or drivers'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary uses Network Sniffing
    (T0842) to capture ICS traffic and learn the internal network, control-system devices, protocols,
    and credentials needed to orient and select targets for collection and lateral movement. This evidence
    focuses on the condition that a process is created or a service is installed on a critical ICS asset
    that matches a known network sniffing tool, or a running process loads a known packet capture library.
    The ''Alert on known sniffer tools or drivers'' approach (Symbolic Logic) works as follows: Trigger
    on process creation (Event ID 4688 / Sysmon 1), service install (7045), or image load (Sysmon 7) matching
    known sniffer tool, driver, or capture-library names (e.g., tshark/dumpcap/Wireshark, tcpdump, npcap/npf.sys/WinPcap,
    WinDivert, raw-socket libs) on EWS/HMI/historian assets, and on NIC promiscuous-mode enablement; specification/host-audit
    rules give low false positives in predictable ICS hosts ([A Survey of Intrusion Detection Techniques
    for Cyber-Physical Systems, Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf)).
    Keep this deterministic floor and tune the name/driver list rather than removing it. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable network sniffing or its
    supporting reconnaissance; pivot to the responsible host and asset role (EWS/HMI/historian/SCADA/PLC),
    the user or process involved, the network segment and SPAN/mirror context, the protocols and peers
    observed, and the timing of the activity to scope what traffic could have been captured. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land sniffing.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, and other
    Windows-based systems within the Process Control Network (PCN) and Manufacturing Zone.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=endpoint (EventCode=4688 OR EventCode=1 OR EventCode=7045 OR (source=Sysmon EventCode=7))\
      \ host IN (EWS,HMI,Historian)\n| eval name=lower(coalesce(NewProcessName,Image,ServiceFileName,ImageLoaded))\n\
      | where match(name,\"(tshark|dumpcap|wireshark|tcpdump|windump|npcap|npf\\.sys|wpcap|winpcap|windivert|rawcap)\"\
      )\n   OR like(CommandLine,\"%--promisc%\") OR like(CommandLine,\"% -i %\")\n| `add NIC promiscuous-mode\
      \ enablement events`\n| table _time host user name CommandLine ParentImage -> alert"
- question: '[Discovery] Baseline new processes and DLL loads: Can you determine whether a process is
    created or a service is installed on a critical ICS asset that matches a known network sniffing tool,
    or a running process loads a known packet capture library. -- specifically, using the ''Baseline new
    processes and DLL loads'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary uses Network Sniffing
    (T0842) to capture ICS traffic and learn the internal network, control-system devices, protocols,
    and credentials needed to orient and select targets for collection and lateral movement. This evidence
    focuses on the condition that a process is created or a service is installed on a critical ICS asset
    that matches a known network sniffing tool, or a running process loads a known packet capture library.
    The ''Baseline new processes and DLL loads'' approach (Statistical Method) works as follows: Baseline
    daily new-process counts and DLL/image loads per asset and alert when counts exceed the 98th percentile
    or unexpected packet-capture DLLs appear; derive per-asset thresholds from a 30-day clean window using
    public ICS host corpora ([A Survey on Industrial Control System Testbeds and Datasets for Security
    Research, Conti et al.](https://arxiv.org/abs/2102.05631)). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable network sniffing or its supporting reconnaissance; pivot
    to the responsible host and asset role (EWS/HMI/historian/SCADA/PLC), the user or process involved,
    the network segment and SPAN/mirror context, the protocols and peers observed, and the timing of the
    activity to scope what traffic could have been captured. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land sniffing.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 7045
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, and other
    Windows-based systems within the Process Control Network (PCN) and Manufacturing Zone.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=endpoint (EventCode=4688 OR EventCode=1 OR EventCode=7)

      | bin _time span=1d | stats dc(NewProcessName) as new_proc dc(ImageLoaded) as new_dll by host,_time

      | eventstats p98(new_proc) as thr_proc p98(new_dll) as thr_dll by host  /* 30-day clean window */

      | where new_proc>thr_proc OR new_dll>thr_dll OR match(ImageLoaded,"(npcap|wpcap|winpcap|npf)") ->
      alert'
