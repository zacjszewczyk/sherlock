name: 'T0842: Network Sniffing'
id: 9332f126-3ef5-49db-af00-7c2281c53257
description: 'This playbook helps an analyst investigate whether an adversary is sniffing ICS network
  traffic to discover information about network topology, industrial protocols, or credentials (MITRE
  ATT&CK ICS T0842, Network Sniffing). Network sniffing places a network interface into a posture where
  it monitors or captures traffic regardless of the intended destination, letting an adversary harvest
  general machine-to-machine communications, unencrypted industrial commands, and login information carried
  over cleartext protocols such as Telnet and FTP; ARP and DNS poisoning can extend passive capture into
  active man-in-the-middle redirection of OT traffic. The hunt pursues this behavior from several complementary
  angles: execution of known packet-capture tools, drivers, and capture libraries (tshark/dumpcap, tcpdump,
  npcap/WinPcap, WinDivert) or NIC promiscuous-mode enablement on Engineering Workstations, HMIs, and
  historians; anomalous host communication profiles such as excessive unique destination IPs, allowlist
  violations, fan-out and port-entropy spikes, and failed/half-open connection bursts that precede or
  accompany scanning and sniffing; cleartext transmission of sensitive ICS commands or administrative
  credentials and abnormal duration/volume of unencrypted protocol sessions (Modbus, DNP3, Telnet, FTP,
  HTTP); and ARP/DNS tampering where a critical IP is re-mapped to an unauthorized MAC or an internal
  FQDN resolves to an external/unauthorized address. Detection methods combine deterministic symbolic-logic
  rules (sniffer tool/driver watchlists, source-destination-port allowlists, semantic protocol-function
  rules, ARP/DNS tampering indicators with active probe verification), statistical baselining (new-process
  and DLL-load thresholds, fan-out/port-entropy and session duration/byte z-scores, payload byte-frequency
  Mahalanobis scoring, failed-connection and authentication-failure spike detection, IP-MAC churn and
  NXDOMAIN rate monitoring), and machine learning (Random Forest sniffer-process classifiers, Kitsune/LSTM
  autoencoder per-host flow anomaly detection, DBSCAN/Random Forest session clustering, and multi-layered/graph
  ARP-DNS anomaly models, all surfacing top contributing features for triage), applied across Windows
  and Sysmon process/service/image-load events and Zeek conn/notice/modbus/dnp3/ftp/http/arp/dns logs,
  so the analyst can corroborate suspected network sniffing against host, protocol, flow, and name-resolution
  context.'
type: technique
related:
- tactic_id: TA0102
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
