- question: '[Collection] Suspicious process creation on ICS assets (Symbolic Logic): Can you determine
    whether a process creation event on an ICS asset (EWS, HMI) involving a scripting interpreter or a
    non-allowlisted executable is immediately followed by a network connection burst from that host to
    multiple unique ICS devices within 60 seconds. -- specifically, using the ''Suspicious process creation
    on ICS assets'' (Symbolic Logic) approach to detect automated collection in the ICS/OT environment?'
