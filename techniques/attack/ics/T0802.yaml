    2. Monitor Windows Event ID 4688 for process creations. 3. Generate a high-priority alert if a ''NewProcessName''
    is not on the allowlist, or if ''CommandLine'' contains scripting interpreters (powershell.exe, python.exe,
    wscript.exe) or known reconnaissance/enumeration tools (nmap.exe, masscan.exe, plcscan, modbus/opc
    client utilities). A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable automated collection; pivot to the responsible source host/IP, user or service account, the
