name: 'T0802: Automated Collection'
id: 9da21411-f0de-46d5-844d-7c93c5dbcaee
description: 'This playbook helps an analyst investigate whether an adversary is performing automated
  collection of data from the ICS/OT environment (MITRE ATT&CK ICS T0802, Automated Collection). Adversaries
  automate the gathering of industrial environment information using tools or scripts that ride on native
  control protocols (e.g., OPC, Modbus, S7comm, DNP3, EtherNet/IP) to enumerate and read from attached
  PLCs, RTUs, HMIs, historians, and OPC servers. The hunt pursues this behavior from several complementary
  angles: a single source establishing connections to an abnormal number of unique ICS devices on control
  ports (502, 102, 44818, 20000, 47808) beyond a statistically derived baseline; violations of the legitimate
  master->slave / function-code / register-range allowlist and of the highly periodic master polling cadence;
  fan-out, volume, frequency, and port/destination-entropy outliers; connection success/failure-ratio
  scan classification via sequential hypothesis testing; suspicious process creation on Engineering Workstations
  and HMIs (scripting interpreters or non-allowlisted recon tools) immediately followed by a network connection
  burst to many ICS devices; and abnormal spikes in successful network logons (and failed-logon probing)
  to critical ICS servers correlated with increased protocol read traffic. Detection methods combine deterministic
  symbolic-logic rules (threat-intel and scanner allowlists, protocol-specification tuples, polling-cadence
  models, process allowlists, logon watchlists), statistical baselining (99th-percentile fan-out/volume/frequency,
  Shannon entropy of destinations and ports, Threshold Random Walk failure-ratio classification, 3-sigma
  logon-count spikes), and machine learning (Isolation Forest and online autoencoder ensembles such as
  Kitsune/KitNET, command-line maliciousness classifiers, ARIMA/autoencoder logon forecasting with required
  explainability surfacing the top contributing features), applied across Zeek conn/modbus/notice logs
  and Windows Event IDs 4688, 4624, and 4625, so the analyst can corroborate suspected automated collection
  against host, user, network, and protocol context.'
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
contributors:
- Zachary Szewczyk
