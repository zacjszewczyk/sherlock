    to enumerate and read from PLCs, RTUs, HMIs, historians, and OPC servers, building the domain knowledge
    needed to plan or revise an ICS attack. This evidence focuses on the condition that a process creation
    event on an ICS asset (EWS, HMI) involving a scripting interpreter or a non-allowlisted executable
    is immediately followed by a network connection burst from that host to multiple unique ICS devices
    within 60 seconds. The ''Suspicious process creation on ICS assets'' approach (Symbolic Logic) works
    as follows: 1. Maintain a strict process allowlist (by ''NewProcessName'' and ''CommandLine'' hash)
    for critical ICS assets, per OT allow-listing guidance ([Guide to OT Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
