questions:
- question: '[Collection] Unauthorized scanner and protocol-spec violations (Symbolic Logic): Can you
    determine whether a single source IP establishes connections with a number of unique destination IPs
    on ICS-specific ports (e.g., 502, 102, 44818) that exceeds a statistically-derived baseline (e.g.,
    99th percentile) within a 5-minute window, and is not associated with an authorized scanner. -- specifically,
    using the ''Unauthorized scanner and protocol-spec violations'' (Symbolic Logic) approach to detect
    automated collection in the ICS/OT environment?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary automates the collection
    of industrial environment data by riding native control protocols (OPC, Modbus, S7comm, DNP3, EtherNet/IP)
    to enumerate and read from PLCs, RTUs, HMIs, historians, and OPC servers, building the domain knowledge
    needed to plan or revise an ICS attack. This evidence focuses on the condition that a single source
    IP establishes connections with a number of unique destination IPs on ICS-specific ports (e.g., 502,
    102, 44818) that exceeds a statistically-derived baseline (e.g., 99th percentile) within a 5-minute
    window, and is not associated with an authorized scanner. The ''Unauthorized scanner and protocol-spec
    violations'' approach (Symbolic Logic) works as follows: 1. Maintain a watchlist of known malicious
    IPs and an allowlist of authorized network/asset scanners, plus an authoritative allowlist of legitimate
    (master IP -> slave IP, ICS port, function code, point/register range) tuples derived from engineering
    documentation ([Distributed IDS using Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917),
    [On Specification-based Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354)).
    2. Query Zeek conn.log for ''id.orig_h'' on the malicious watchlist and generate a high-priority alert.
    3. Query Zeek conn.log/modbus.log for hosts NOT on the scanner allowlist connecting to more than 20
    unique ''id.resp_h'' on common ICS ports (502, 102, 44818, 20000, 47808) within a 5-minute window,
    OR issuing read/enumeration function codes (e.g., Modbus FC 0x03/0x04, FC 0x2B/0x11 device-ID, DNP3
    integrity poll) to register ranges or devices outside the allowlist, and generate a medium-priority
    alert. Allow-list and threshold logic follows established NIDS theory and OT segmentation/allow-listing
    guidance ([Network Intrusion Detection and Prevention, Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5),
    [Guide to OT Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable automated
    collection; pivot to the responsible source host/IP, user or service account, the targeted ICS devices
    and segment (Control/Process Network, DMZ), the protocols, function codes, and register/object ranges
    accessed, and the volume, fan-out, and timing of the activity to scope what was enumerated. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land collection
    layered over legitimate control traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network taps/SPAN ports on ICS network segments (Control Network, Process Network, DMZ), specifically
    monitoring traffic to/from PLCs, RTUs, and HMIs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "load malicious_ip_watchlist, scanner_allowlist, legit_tuples (master_ip->slave_ip,ics_port,function_code,register_range)\n\
      conn.log where id.orig_h in malicious_ip_watchlist -> alert PRIORITY=high\nconn.log where id.orig_h\
      \ not in scanner_allowlist\n  | filter id.resp_p in [502,102,44818,20000,47808]\n  | bin 5min by\
      \ id.orig_h | count distinct id.resp_h as fanout\n  | where fanout > 20 -> alert PRIORITY=medium\n\
      modbus.log/dnp3.log where (orig_h,resp_h,func,register) not in legit_tuples\n  and func in read/enum\
      \ codes (FC 0x03,0x04,0x2B/0x11; DNP3 integrity poll) -> alert PRIORITY=medium"
- question: '[Collection] Periodic polling cadence violations (Symbolic Logic): Can you determine whether
    a single source IP establishes connections with a number of unique destination IPs on ICS-specific
    ports (e.g., 502, 102, 44818) that exceeds a statistically-derived baseline (e.g., 99th percentile)
    within a 5-minute window, and is not associated with an authorized scanner. -- specifically, using
    the ''Periodic polling cadence violations'' (Symbolic Logic) approach to detect automated collection
    in the ICS/OT environment?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary automates the collection
    of industrial environment data by riding native control protocols (OPC, Modbus, S7comm, DNP3, EtherNet/IP)
    to enumerate and read from PLCs, RTUs, HMIs, historians, and OPC servers, building the domain knowledge
    needed to plan or revise an ICS attack. This evidence focuses on the condition that a single source
    IP establishes connections with a number of unique destination IPs on ICS-specific ports (e.g., 502,
    102, 44818) that exceeds a statistically-derived baseline (e.g., 99th percentile) within a 5-minute
    window, and is not associated with an authorized scanner. The ''Periodic polling cadence violations''
    approach (Symbolic Logic) works as follows: Master-to-PLC polling is highly periodic, so build a per-flow
    (master IP, slave IP, function code) timing model of the expected inter-arrival period T, automatically
    re-learning sharp phase shifts to avoid false positives ([Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068)).
    Deterministically alert when a source issues reads/enumeration to a slave at a rate substantially
    above the learned period (e.g., > 3x baseline poll frequency), reads objects/registers never seen
    in the baseline, or contacts devices it never normally polls - all hallmarks of automated collection
    layered over native protocols. A positive result -- a rule match, statistical outlier, or model alert
    -- indicates probable automated collection; pivot to the responsible source host/IP, user or service
    account, the targeted ICS devices and segment (Control/Process Network, DMZ), the protocols, function
    codes, and register/object ranges accessed, and the volume, fan-out, and timing of the activity to
    scope what was enumerated. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land collection layered over legitimate control traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network taps/SPAN ports on ICS network segments (Control Network, Process Network, DMZ), specifically
    monitoring traffic to/from PLCs, RTUs, and HMIs.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "per (master_ip,slave_ip,function_code): learn expected inter-arrival period T (re-learn sharp\
      \ phase shifts)\nstream reads: rate = 1 / inter_arrival\nalert if rate > 3 * baseline_poll_freq(T)\n\
      \  OR object/register not in baseline_registers\n  OR slave_ip not in normally_polled(master_ip)"
- question: '[Collection] Fan-out outliers, volume, frequency, and port entropy (Statistical Method):
    Can you determine whether a single source IP establishes connections with a number of unique destination
    IPs on ICS-specific ports (e.g., 502, 102, 44818) that exceeds a statistically-derived baseline (e.g.,
    99th percentile) within a 5-minute window, and is not associated with an authorized scanner. -- specifically,
    using the ''Fan-out outliers, volume, frequency, and port entropy'' (Statistical Method) approach
    to detect automated collection in the ICS/OT environment?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary automates the collection
    of industrial environment data by riding native control protocols (OPC, Modbus, S7comm, DNP3, EtherNet/IP)
    to enumerate and read from PLCs, RTUs, HMIs, historians, and OPC servers, building the domain knowledge
    needed to plan or revise an ICS attack. This evidence focuses on the condition that a single source
    IP establishes connections with a number of unique destination IPs on ICS-specific ports (e.g., 502,
    102, 44818) that exceeds a statistically-derived baseline (e.g., 99th percentile) within a 5-minute
    window, and is not associated with an authorized scanner. The ''Fan-out outliers, volume, frequency,
    and port entropy'' approach (Statistical Method) works as follows: 1. For each ''id.orig_h'' in Zeek
    conn.log, establish a 30-day baseline of the 99th percentile for (a) count of unique ''id.resp_h''
    per 5-minute rolling window [State/fan-out], (b) read-request rate per minute [Frequency], and (c)
    summed ''orig_bytes'' per window [Volume]. 2. In real-time compute each metric over the last 5 minutes
    and generate a medium-priority alert if any exceeds its 99th-percentile baseline, including the source
    IP, the breached metric(s), current value, and baseline in the alert text. 3. Enrich with the Shannon
    entropy of destination IP and ''id.resp_p'' for the source; a sharp entropy change indicates broad
    fan-out that volume alone misses ([Mining Anomalies Using Traffic Feature Distributions, Lakhina et
    al](https://conferences.sigcomm.org/sigcomm/2005/paper-LakCro.pdf)). 4. Derive thresholds per network
    segment because OT rates are near-constant ([Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068),
    [Anomaly-based IDS with SVM and Random Forests](https://arxiv.org/abs/1907.10374)). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable automated collection; pivot
    to the responsible source host/IP, user or service account, the targeted ICS devices and segment (Control/Process
    Network, DMZ), the protocols, function codes, and register/object ranges accessed, and the volume,
    fan-out, and timing of the activity to scope what was enumerated. A negative result helps rule out
    this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land collection layered over legitimate
    control traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network taps/SPAN ports on ICS network segments (Control Network, Process Network, DMZ), specifically
    monitoring traffic to/from PLCs, RTUs, and HMIs.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "baseline 30d per id.orig_h: P99 of\n  (a) distinct id.resp_h per 5min window  [fan-out]\n\
      \  (b) read_requests per minute            [frequency]\n  (c) sum(orig_bytes) per window       \
      \   [volume]\nrealtime: compute metrics over last 5min\nalert MEDIUM if any metric > its P99 (include\
      \ metric,current,baseline)\nenrich: H = shannon_entropy(id.resp_h), shannon_entropy(id.resp_p);\
      \ alert on sharp shift\nthresholds derived per network segment"
- question: '[Collection] Connection success/failure-ratio scan classification (Statistical Method): Can
    you determine whether a single source IP establishes connections with a number of unique destination
    IPs on ICS-specific ports (e.g., 502, 102, 44818) that exceeds a statistically-derived baseline (e.g.,
    99th percentile) within a 5-minute window, and is not associated with an authorized scanner. -- specifically,
    using the ''Connection success/failure-ratio scan classification'' (Statistical Method) approach to
    detect automated collection in the ICS/OT environment?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary automates the collection
    of industrial environment data by riding native control protocols (OPC, Modbus, S7comm, DNP3, EtherNet/IP)
    to enumerate and read from PLCs, RTUs, HMIs, historians, and OPC servers, building the domain knowledge
    needed to plan or revise an ICS attack. This evidence focuses on the condition that a single source
    IP establishes connections with a number of unique destination IPs on ICS-specific ports (e.g., 502,
    102, 44818) that exceeds a statistically-derived baseline (e.g., 99th percentile) within a 5-minute
    window, and is not associated with an authorized scanner. The ''Connection success/failure-ratio scan
    classification'' approach (Statistical Method) works as follows: Treat connection State and protocol
    errors as first-class signals. From Zeek conn.log compute, per source per 5-minute window, the ratio
    of failed/rejected control connections (conn_state in S0, REJ, RSTOS0, RSTRH) to total on ICS ports,
    plus protocol exception/error responses (e.g., Modbus exception codes, DNP3/OPC error returns) where
    parsed. Apply sequential hypothesis testing (Threshold Random Walk) on the success/failure sequence
    to classify a source as a scanner after few attempts, and alert when the failure ratio exceeds mean
    + 3 sigma or an absolute floor (e.g., > 5% failed) - enumeration probes commonly touch non-existent
    units/registers and fail ([Fast Portscan Detection Using Sequential Hypothesis Testing, Jung et al](https://www.icir.org/vern/papers/portscan-oak04.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable automated
    collection; pivot to the responsible source host/IP, user or service account, the targeted ICS devices
    and segment (Control/Process Network, DMZ), the protocols, function codes, and register/object ranges
    accessed, and the volume, fan-out, and timing of the activity to scope what was enumerated. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land collection
    layered over legitimate control traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network taps/SPAN ports on ICS network segments (Control Network, Process Network, DMZ), specifically
    monitoring traffic to/from PLCs, RTUs, and HMIs.'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "per source per 5min on ICS ports:\n  fail_ratio = count(conn_state in [S0,REJ,RSTOS0,RSTRH])\
      \ / total\n  + protocol exception responses (Modbus exception, DNP3/OPC errors)\napply Threshold\
      \ Random Walk (sequential hypothesis test) on success/fail sequence\nclassify source = scanner;\
      \ alert if fail_ratio > mean+3sigma OR fail_ratio > 0.05"
- question: '[Collection] Unsupervised anomaly model on source behavior (Machine Learning): Can you determine
    whether a single source IP establishes connections with a number of unique destination IPs on ICS-specific
    ports (e.g., 502, 102, 44818) that exceeds a statistically-derived baseline (e.g., 99th percentile)
    within a 5-minute window, and is not associated with an authorized scanner. -- specifically, using
    the ''Unsupervised anomaly model on source behavior'' (Machine Learning) approach to detect automated
    collection in the ICS/OT environment?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary automates the collection
    of industrial environment data by riding native control protocols (OPC, Modbus, S7comm, DNP3, EtherNet/IP)
    to enumerate and read from PLCs, RTUs, HMIs, historians, and OPC servers, building the domain knowledge
    needed to plan or revise an ICS attack. This evidence focuses on the condition that a single source
    IP establishes connections with a number of unique destination IPs on ICS-specific ports (e.g., 502,
    102, 44818) that exceeds a statistically-derived baseline (e.g., 99th percentile) within a 5-minute
    window, and is not associated with an authorized scanner. The ''Unsupervised anomaly model on source
    behavior'' approach (Machine Learning) works as follows: 1. Train an unsupervised model (Isolation
    Forest or an online autoencoder ensemble such as Kitsune/KitNET) on a 30-day baseline of benign ICS
    traffic from Zeek conn.log/modbus.log ([Kitsune, Mirsky et al](https://arxiv.org/abs/1802.09089) [code](https://github.com/ymirsky/Kitsune-py),
    [Detecting Cyberattacks in ICS Using CNNs](https://arxiv.org/abs/1806.08110), [Efficient Cyber Attack
    Detection in ICS Using Lightweight NNs and PCA](https://arxiv.org/abs/1907.01216)). 2. Build per-source
    5-minute feature vectors: count of unique destination IPs, count of unique destination ports/registers,
    total/failed connection counts, summed ''orig_bytes'', read-request frequency, and protocol distribution.
    3. Score new vectors and alert on anomalies. 4. EXPLAINABILITY (required): the alert MUST list the
    top-3 contributing features (e.g., ''unique-dest count'', ''read-request frequency'', ''failed-conn
    ratio'') per ([xNIDS, Wei et al](https://www.usenix.org/system/files/usenixsecurity23-wei-feng.pdf),
    [Anomaly-based IDS with SVM and Random Forests](https://arxiv.org/abs/1907.10374)). Keep the deterministic
    and statistical layers as the floor because ML-IDS performance is often overstated and generalizes
    poorly to unseen attacks ([A False Sense of Security?](https://arxiv.org/abs/2205.09199), [Deep Learning-Based
    Anomaly Detection in CPS](https://arxiv.org/abs/2003.13213)). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable automated collection; pivot to the responsible source
    host/IP, user or service account, the targeted ICS devices and segment (Control/Process Network, DMZ),
    the protocols, function codes, and register/object ranges accessed, and the volume, fan-out, and timing
    of the activity to scope what was enumerated. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land collection layered over legitimate control traffic.'
