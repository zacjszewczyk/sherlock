name: 'T1692: Unauthorized Message'
id: 125859a0-ad90-42d5-bada-4c085f24f77c
description: Investigate the injection of unauthorized command and reporting messages into an OT/ICS environment,
  where an adversary manipulates processes or hides a malicious state to evade defenses. This playbook
  helps an analyst detect command injection into PLCs/RTUs from unauthorized sources, function codes,
  or sessions; spoofed telemetry whose reported values contradict physical safety limits, redundant instrumentation,
  or historian trends; and malformed or out-of-spec OT protocol traffic generated by custom tooling, relayed
  sessions, or in-path injectors. It combines specification-based allowlists and ICS IDS signatures, statistical
  baselining of source-destination pairs, command rates, exception ratios, header entropy and timing,
  cross-sensor residual/CUSUM and state-estimation checks, and machine-learning sequence, autoencoder,
  grammar, and causal digital-twin models.
type: technique
related:
- tactic_id: TA0103
  tactic_name: Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did a PLC, RTU, or other automation controller receive a write, stop, or mode-change command
    from a source IP, user account, or function code that is not on its approved allowlist?
  context: In an OT evasion scenario an adversary injects command messages that look like legitimate control
    traffic but originate from an unauthorized source or carry an operation that source should never issue.
    Maintain a per-device allowlist of approved source IPs, authenticated user accounts, and permitted
    command function codes, then inspect Zeek modbus.log, dnp3.log, and enip.log for command writes (e.g.,
    Modbus FC 5/6/15/16 write-coil/register, DNP3 operate/direct-operate) coming from sources or sessions
    not approved for that target controller. A hit that lacks a matching operator session (Windows 4624),
    engineering ticket, or change request is strong evidence of command injection rather than routine
    control. Specification-based allowlisting over the protocol grammar is the most robust OT detection
    approach and gives a defensible, low-false-positive signal tied directly to the Evasion tactic. Specification-based
    allowlisting over the protocol grammar is the dominant robust approach for OT per [A Survey of Intrusion
    Detection Techniques for Cyber-Physical Systems, Mitchell and Chen](https://doi.org/10.1145/2542049).
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - Change Management System Logs
  - 'NAI: Process Control Network (PCN), Controller Network Interfaces, Network Access Control Points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'cmd = ot_protocol_logs where func_code in WRITE_OR_CONTROL_CODES;

      allow = device_allowlist[cmd.dst_device];

      alert when cmd.src_ip not in allow.src_ips OR cmd.user not in allow.users OR cmd.func_code not in
      allow.func_codes;

      enrich with operator_session(4624), change_mgmt_ticket; flag if no matching authorization.'
- question: Are there OT packets containing illegal or reserved function codes, writes to protected points/registers,
    or unauthorized master/slave pairings that ICS IDS preprocessors would deterministically flag?
  context: 'Beyond per-device allowlisting, deploy Snort/Suricata ICS preprocessors (e.g., Digital Bond
    Quickdraw rules) to deterministically catch unauthorized or illegal function codes, writes to protected
    points and registers, and unauthorized master-to-slave pairings. The protected-point list and authorized-master
    list are derived per site from labeled command-injection traffic. Because these are rule-based signatures
    over known-bad behaviors, a match is high-confidence and directly indicates an attempt to inject control
    or evade defenses by manipulating a protected process value. Use rules from [Quickdraw-Snort: SCADA
    IDS Preprocessors and Rules, Digital Bond](https://github.com/digitalbond/Quickdraw-Snort), and derive
    the protected-point and authorized-master lists per site from labeled command-injection traffic in
    the [Industrial Control System (ICS) Cyber Attack Datasets, Morris](https://sites.google.com/a/uah.edu/tommy-morris-uah/ics-data-sets).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Intrusion Detection System (IDS) Alerts
  - 'NAI: Process Control Network (PCN), Controller Network Interfaces, Network Access Control Points.'
  range: Last 90 days
  queries:
  - technology: Snort/Suricata ICS preprocessor
    query: 'alert modbus any -> CONTROLLERS: func_code in ILLEGAL_OR_RESERVED;

      alert write to PROTECTED_POINTS[device] from src not in AUTHORIZED_MASTERS[device];

      msg=''Unauthorized/illegal OT command''; reference Quickdraw protected-point list.'
- question: Has any source-destination controller pair appeared for the first time, or exceeded its historical
    command volume, in a way that indicates injected commands?
  context: Adversaries injecting messages often create source-destination conversations that have never
    been seen before, or send commands at a rate that exceeds normal control loops. Baseline unique source-destination
    pairs and command frequency (commands/min) over a 30-day window, then alert on first-seen pairs or
    pairs exceeding the 99th percentile of historical command volume for that device. Enforce deterministic
    min/max message-count bounds per time window using Inter-Arrival Curves so extra/injected commands
    trip a frequency violation. A first-seen pair or volume spike paired with the allowlist or IDS signals
    strongly corroborates unauthorized message injection. Enforce deterministic min/max message-count
    bounds per time window using Inter-Arrival Curves to catch injected/extra commands by frequency violation,
    per [Anomaly Detection for Industrial Control Networks using Machine Learning with the help from the
    Inter-Arrival Curves, Al-Madani et al](https://arxiv.org/abs/1911.05692).
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek conn.log
  - 'NAI: Process Control Network (PCN), Controller Network Interfaces, Network Access Control Points.'
  range: Last 90 days, baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = stats by src,dst,func_code over 30d: count, p99(cmd_per_min);\nalert when (src,dst)\
      \ first_seen OR cmd_per_min > baseline.p99\n  OR window_count outside InterArrivalCurve.min_max[src,dst];"
- question: Is a particular source producing an elevated rate of rejected, failed, or exception command
    responses that would indicate a spoofing source probing unfamiliar devices?
  context: A source that does not legitimately operate a device often issues commands the device rejects,
    producing Modbus exception codes, DNP3 IIN error bits, or denied writes. Profile the rate of failed/exception
    command responses per source as a distinct State signal, establish the normal exception baseline from
    labeled command-injection traffic, and alert when a source exceeds the 95th percentile rejected/exception
    ratio. An elevated rejection profile is a behavioral tell of an adversary or tool unfamiliar with
    the target controller's register map and supported operations. Establish the normal exception baseline
    from labeled command-injection traffic in the [Industrial Control System (ICS) Cyber Attack Datasets,
    Morris](https://sites.google.com/a/uah.edu/tommy-morris-uah/ics-data-sets) and alert on deviations
    above the 95th percentile.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN), Controller Network Interfaces, Network Access Control Points.'
  range: Last 90 days, baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per_src = stats by src: exceptions=count(resp in MODBUS_EXC,DNP3_IIN_ERR,denied_write), total=count(resp);

      ratio = exceptions/total; alert when ratio > p95(baseline_ratio);'
- question: Does a source on the control network behave like an active controller (timing, request-to-command
    ratio, device context) rather than a passive HMI, suggesting an injected command source?
  context: Train a sequence-to-sequence model on command timing, device context, source behavior, and
    request-to-command ratios to characterize how legitimate stations interact with controllers. Adversarial
    injectors tend to behave like active controllers issuing commands rather than passive monitoring HMIs.
    Score sources against the learned normal behavior and surface the top-3 contributing features (function
    code, inter-command interval, target register range) so an analyst can validate. Sequence models trained
    only on normal ICS data detect and localize injected control actions, making this a powerful complement
    to the deterministic allowlist and rule checks for the Evasion tactic. Sequence models trained only
    on normal ICS operational data detect and localize injected control actions, per [Anomaly Detection
    for Industrial Control Systems Using Sequence-to-Sequence Neural Networks, Kim et al](https://arxiv.org/abs/1911.04831).
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek conn.log
  - 'NAI: Process Control Network (PCN), Controller Network Interfaces, Network Access Control Points.'
  range: Last 90 days; score in near-real-time, retrain on trailing 60-90 days of normal traffic
  queries:
  - technology: ML/Sequence model pseudocode
    query: 'model = seq2seq.train(normal_command_streams[timing,device_ctx,src_behavior,req_to_cmd]);

      score = model.anomaly(src.command_sequence);

      alert when score > threshold; output top3_features(func_code, inter_cmd_interval, target_register_range);'
- question: Do any reported process values violate hard safety bounds, physics invariants, or expected
    state transitions for the current operating mode?
  context: Spoofed reporting messages can make a compromised process look normal in OT protocol logs while
    independent sensors or safety systems indicate a conflicting condition. Define hard bounds and physics
    invariants (e.g., open intake valve implies tank level must rise) and state-transition rules for critical
    process tags, then compare reported values against historian and SIS events. Alert when a reported
    value is physically impossible for the current mode or contradicts the expected cause-effect relationship.
    Physics-based plausibility checking confirms that executed commands and sensor reports are consistent
    and is a direct counter to telemetry spoofing used for evasion. Physics-based prediction models confirm
    commands executed and sensor reports are consistent, per [Limiting the Impact of Stealthy Attacks
    on Industrial Control Systems, Urbina et al](https://dl.acm.org/doi/10.1145/2976749.2978388).
  answer_sources:
  - Operational Historian Logs
  - Safety Instrumented System (SIS) Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek iec61850.log
  - 'NAI: SCADA Servers, HMI Workstations, Safety Instrumented Systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for tag in CRITICAL_TAGS:\n  alert when reported_value outside HARD_BOUNDS[tag,mode]\n   \
      \ OR violates INVARIANT(cause->effect)\n    OR state_transition not in ALLOWED[mode];\ncross-check\
      \ historian + SIS events for same timestamp."
- question: Has the correlation between redundant or related sensors broken down, or have paired-signal
    residuals exceeded historical error in a sustained way (CUSUM)?
  context: Stealthy spoofing of reporting messages can be revealed by comparing related or redundant sensors
    that should move together. Baseline the correlation between such signals during normal operation and
    alert when correlation drops sharply or the paired-signal residual exceeds the 95th percentile of
    historical error. Apply a stateful cumulative-sum (CUSUM) test on residuals, which bounds the cumulative
    deviation a stealthy spoofer can introduce far better than instantaneous thresholds. A sustained correlation
    breakdown or growing CUSUM statistic indicates that one reported channel is being manipulated independently
    of physical reality. Apply a stateful cumulative-sum (CUSUM) test on residuals, which bounds the deviation
    a stealthy spoofer can cause better than instantaneous thresholds, per [Limiting the Impact of Stealthy
    Attacks on Industrial Control Systems, Urbina et al](https://dl.acm.org/doi/10.1145/2976749.2978388).
  answer_sources:
  - Operational Historian Logs
  - Safety Instrumented System (SIS) Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek iec61850.log
  - 'NAI: SCADA Servers, HMI Workstations, Safety Instrumented Systems.'
  range: Last 90 days, baseline correlations over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (s1,s2) in REDUNDANT_PAIRS:\n  resid = s1 - predict(s1|s2); corr = rolling_corr(s1,s2);\n\
      \  cusum = cumulative_sum(resid - drift);\n  alert when corr < corr_floor OR |resid| > p95(hist_resid)\
      \ OR cusum > h;"
- question: Are there measurements that pass instantaneous bad-data/state-estimation checks but are temporally
    implausible relative to recent process dynamics?
  context: For measurement-heavy processes such as power state estimation, spoofed reporting is frequently
    crafted to pass static, single-instant bad-data detection yet remains inconsistent with the recent
    dynamic trajectory. Profile state-estimation residuals over time and flag measurements that look fine
    at one instant but break the temporal dynamics of the system. This catches false-data-injection that
    defeats classical static detectors, providing a dynamics-aware check that exposes evasion attempts
    hiding in plausible-looking instantaneous values. This catches the failure mode of classical bad-data
    detection, where measurements consistent at a single instant are inconsistent with recent dynamics,
    identified in [Dynamic Detection of False Data Injection Attack in Smart Grid using Deep Learning,
    Niu et al](https://arxiv.org/abs/1808.01094).
  answer_sources:
  - Operational Historian Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek iec61850.log
  - 'NAI: SCADA Servers, HMI Workstations, Safety Instrumented Systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'r_t = state_estimation_residual(measurements_t);

      temporal_r = residual_vs_recent_dynamics(measurements_t, window=N);

      alert when static_bad_data(r_t)==pass AND temporal_r > threshold;'
- question: Do any time windows of historian/telemetry data show high reconstruction error under a learned
    model of normal process behavior, indicating spoofed reporting?
  context: Train an autoencoder or multivariate predictor (e.g., lightweight convolutional autoencoder
    in time and frequency domains) on historian and telemetry sequences per process unit. During inference,
    time windows that produce high reconstruction error are likely to contain spoofed reporting because
    the manipulated values do not fit the learned normal manifold. Flag and rank such windows for analyst
    review. This data-driven residual approach detects subtle, coordinated telemetry manipulation that
    rule-based bounds may miss, reinforcing the Evasion-tactic hypothesis. Use lightweight convolutional
    autoencoders applied in the time and frequency domains, per [Efficient Cyber Attack Detection in Industrial
    Control Systems Using Lightweight Neural Networks and PCA, Kravchik and Shabtai](https://arxiv.org/abs/1907.01216),
    and CNN-based residual detection in [Detecting Cyberattacks in Industrial Control Systems Using Convolutional
    Neural Networks, Kravchik and Shabtai](https://arxiv.org/abs/1806.08110).
  answer_sources:
  - Operational Historian Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek iec61850.log
  - 'NAI: SCADA Servers, HMI Workstations, Safety Instrumented Systems.'
  range: Last 90 days; retrain on trailing 60-90 days of normal operation
  queries:
  - technology: ML/Autoencoder pseudocode
    query: 'ae = autoencoder.train(normal_historian_telemetry[process_unit]);

      err = ae.reconstruction_error(window);

      alert when err > p99(normal_err); rank windows by err for triage.'
- question: When a process anomaly is detected, do the top causal variables from a process digital twin
    point to spoofed reporting rather than a benign physical disturbance?
  context: Benign upsets and malicious telemetry spoofing can produce similar surface anomalies, so use
    a causal model or digital twin of the process to separate the two and to explain each deviation. The
    model identifies the top-3 causal variables driving a detected anomaly and includes them in the alert
    text, letting an analyst judge whether the deviation has a physical cause or is consistent with injected
    reporting. This causal attribution reduces false positives and provides defensible reasoning that
    ties anomalies back to unauthorized-message evasion. Use a causal model/digital twin of the process
    to separate spoofed reporting from benign disturbances, per [Causal Digital Twins for Cyber-Physical
    Security in Water Systems, Homaei et al](https://arxiv.org/abs/2510.09616).
  answer_sources:
  - Operational Historian Logs
  - Safety Instrumented System (SIS) Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek iec61850.log
  - 'NAI: SCADA Servers, HMI Workstations, Safety Instrumented Systems.'
  range: Last 90 days
  queries:
  - technology: ML/Causal digital-twin pseudocode
    query: "twin = causal_model(process_unit);\nfor anomaly in detected:\n  causes = twin.attribute(anomaly);\
      \ label = twin.classify(spoof vs disturbance);\n  alert with top3_causal_variables(causes), label;"
- question: Are OT packets malformed, carrying reserved/prohibited function codes, or otherwise failing
    to match the expected command grammar for the vendor and device type?
  context: 'Custom injection tools, relayed sessions, and in-path injectors often emit traffic that deviates
    from the exact protocol grammar legitimate automation software uses. Use Zeek protocol analyzers and
    Snort/Suricata ICS preprocessors to flag malformed packets, reserved or prohibited function codes,
    and payloads that do not match the expected command grammar for the specific vendor and device type,
    applying signatures such as Digital Bond Quickdraw. Specification-based validation of allowed protocol
    states is the recommended robust OT technique, and a violation here points to a non-native message
    source attempting to evade defenses. Apply signatures from [Quickdraw-Snort: SCADA IDS Preprocessors
    and Rules, Digital Bond](https://github.com/digitalbond/Quickdraw-Snort); specification-based validation
    of allowed protocol states is the recommended robust technique for OT in [A Survey of Intrusion Detection
    Techniques for Cyber-Physical Systems, Mitchell and Chen](https://doi.org/10.1145/2542049).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek conn.log
  - Intrusion Detection System (IDS) Alerts
  - 'NAI: Network Taps on PCN segments, IDS Sensors.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode + Suricata ICS
    query: "on ot_packet: if malformed OR func_code in RESERVED_OR_PROHIBITED OR payload !~ GRAMMAR[vendor,device]:\n\
      \  log Notice('Out-of-spec OT message', conn, func_code, deviation);\nrun Quickdraw ICS preprocessor\
      \ signatures over PCN tap."
- question: Does a flow's protocol header entropy, field distribution, or message inter-arrival timing
    deviate from its 30-day baseline or violate expected message-count bounds?
  context: In-path injectors and custom tooling frequently get header fields (transaction IDs, sequence
    numbers, object identifiers) and timing subtly wrong. Baseline Shannon entropy and field distributions
    for protocol headers plus message inter-arrival timing per conversation, then alert when a flow deviates
    from the 30-day mean or violates the min/max message-count bounds expected for that conversation using
    an Inter-Arrival Curve timing model. Such statistical deviations expose injected or relayed traffic
    that is byte-valid but statistically foreign to the legitimate endpoint. Use the Inter-Arrival Curve
    timing model from [Anomaly Detection for Industrial Control Networks using Machine Learning with the
    help from the Inter-Arrival Curves, Al-Madani et al](https://arxiv.org/abs/1911.05692).
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek conn.log
  - 'NAI: Network Taps on PCN segments, IDS Sensors.'
  range: Last 90 days, baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_flow stats over 30d: entropy(headers), dist(txn_id,seq,obj_id), inter_arrival_curve;

      alert when |entropy - mean| > k*std OR field_dist KL-div high OR msg_count outside IAC.min_max;'
- question: Is any flow producing an elevated rate of protocol errors or exception responses, indicating
    out-of-spec exchanges from an injector or custom tool?
  context: Track the rate of protocol errors and exception responses (malformed-packet drops, Modbus exception
    codes, DNP3 IIN error flags) per flow as a State/failure signal. In-path injectors and bespoke tooling
    routinely generate out-of-spec exchanges that elevate the error ratio above the normal baseline derived
    from labeled traffic. Alert when a flow's error/exception ratio exceeds its baseline. A high error
    profile on an otherwise quiet flow is a behavioral indicator that a non-native process is generating
    unauthorized messages. Derive the normal baseline from the labeled traffic in the [Industrial Control
    System (ICS) Cyber Attack Datasets, Morris](https://sites.google.com/a/uah.edu/tommy-morris-uah/ics-data-sets).
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Intrusion Detection System (IDS) Alerts
  - 'NAI: Network Taps on PCN segments, IDS Sensors.'
  range: Last 90 days, baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per_flow = stats: errors=count(malformed_drop,MODBUS_EXC,DNP3_IIN_ERR), total=count(msg);

      ratio=errors/total; alert when ratio > baseline_ratio + margin;'
- question: Do any packets or conversations score as low-likelihood under a learned per-protocol, per-site
    grammar model, characteristic of custom injection tooling?
  context: Train a sequence model on byte-level or field-level OT packet structures per protocol and site
    to learn the legitimate message grammar. Packets or conversations that score as low-likelihood under
    the model are characteristic of custom injection tooling that cannot perfectly reproduce native software
    behavior. Surface the top-3 deviating fields in the alert so an analyst can validate. This anomaly/behavior-based
    model complements deterministic protocol validation and statistical baselining, giving broad coverage
    against novel unauthorized-message techniques used for evasion. This is consistent with the anomaly/behavior-based
    detection approaches surveyed in [A Survey of Intrusion Detection Techniques for Cyber-Physical Systems,
    Mitchell and Chen](https://doi.org/10.1145/2542049) and the residual-based ICS detection of [Detecting
    Cyberattacks in Industrial Control Systems Using Convolutional Neural Networks, Kravchik and Shabtai](https://arxiv.org/abs/1806.08110).
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Intrusion Detection System (IDS) Alerts
  - 'NAI: Network Taps on PCN segments, IDS Sensors.'
  range: Last 90 days; retrain on trailing 60-90 days of normal traffic
  queries:
  - technology: ML/Grammar model pseudocode
    query: 'model = seq_model.train(normal_packets[byte_or_field][protocol,site]);

      ll = model.loglikelihood(packet_or_conversation);

      alert when ll < threshold; output top3_deviating_fields;'
