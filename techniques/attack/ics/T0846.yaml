  - technology: ML/pseudocode (Isolation Forest + LIME)
    query: "// 5-min per-host feature vectors\nfeatures = [distinct_dst_ips, distinct_dst_ports, total_conns,\
      \ failure_ratio, ics_port_count]\nmodel = IsolationForest(contamination=auto).fit(history)   //\
      \ OCSVM as robustness check\nscore = model.decision_function(current)\nif score < threshold:\n \
