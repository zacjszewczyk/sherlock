- question: '[Discovery] Alert on discovery utilities with scanning args: Can you determine whether a
    process on an ICS host (e.g., Engineering Workstation, HMI) executes a known network discovery utility
    (e.g., ping.exe, net.exe, arp.exe, nmap.exe, nbtscan.exe) with command-line arguments indicative of
    subnet-wide enumeration (e.g., CIDR notation like 192.168.1.0/24, or flags like -sP, -sn, /a). The
    activity is considered highly anomalous if the command is initiated by an unexpected parent process
    (e.g., a Microsoft Office application, a web browser) or by a non-administrative user account. --
    specifically, using the ''Alert on discovery utilities with scanning args'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary performs Remote System
    Discovery to enumerate other systems on the ICS/OT network that may be used for subsequent Lateral
    Movement or Discovery. This evidence focuses on the condition that a process on an ICS host (e.g.,
    Engineering Workstation, HMI) executes a known network discovery utility (e.g., ping.exe, net.exe,
    arp.exe, nmap.exe, nbtscan.exe) with command-line arguments indicative of subnet-wide enumeration
    (e.g., CIDR notation like 192.168.1.0/24, or flags like -sP, -sn, /a). The activity is considered
    highly anomalous if the command is initiated by an unexpected parent process (e.g., a Microsoft Office
    application, a web browser) or by a non-administrative user account. The ''Alert on discovery utilities
    with scanning args'' approach (Symbolic Logic) works as follows: From Windows Event ID 4688, match
    discovery utilities (ping.exe, net.exe, net1.exe, arp.exe, nbtscan.exe, nmap.exe, tracert.exe) whose
    command line contains subnet/CIDR notation (e.g., /24), sweep flags (-sn, -sP, /a, -PE), or rapid
    sequential targets, and raise severity when the parent is an unexpected process (Office app, browser,
    script host) or the user is non-administrative. ATT&CK-aligned enumeration matching follows [BZAR](https://github.com/mitre-attack/bzar);
    restrict and monitor which OT hosts may run such tooling per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable remote-system
    discovery; pivot to the responsible source host, the originating process and user/account, the targeted
    destination devices, ports, and ICS protocols/function codes, and the rate and timing of the activity
    to scope what was enumerated. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land discovery activity.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations, HMIs, Data Historians, Jump Servers within the OT network'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode (Windows 4688)
    query: "from winlog.eventid==4688\n| where NewProcessName in (\"ping.exe\",\"net.exe\",\"net1.exe\"\
      ,\"arp.exe\",\"nbtscan.exe\",\"nmap.exe\",\"tracert.exe\")\n| where CommandLine matches /\\/(\\\
      d{1,2})\\b/        // CIDR e.g. /24\n        OR CommandLine matches /(-sn|-sP|-PE|\\/a)/   // sweep\
      \ flags\n| eval susp_parent = ParentProcessName in (\"winword.exe\",\"excel.exe\",\"outlook.exe\"\
      ,\"chrome.exe\",\"msedge.exe\",\"wscript.exe\",\"powershell.exe\")\n| eval nonadmin = user NOT IN\
      \ admin_group\n| where susp_parent OR nonadmin\n| emit alert(raise_severity if susp_parent or nonadmin)"
