  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// per-host 5-minute baseline (>=2 weeks steady-state)\nbaseline = stats by id.orig_h over\
      \ last 14d:\n      p99_dstips = percentile(dcount(id.resp_h) per 5m, 99),\n      mean_conns = avg(count()\
      \ per 5m), sd_conns = stdev(count() per 5m)\ncurrent = stats by id.orig_h per 5m: cur_dstips=dcount(id.resp_h),\
      \ cur_conns=count()\n| where cur_dstips > baseline.p99_dstips\n        OR cur_conns > baseline.mean_conns\
