questions:
- question: '[Discovery] Alert on high fan-out from unauthorized hosts: Can you determine whether a single
    source host, not on a pre-defined ''Authorized Scanners'' watchlist, generates a high volume of connection
    attempts to many distinct destinations. Specifically, the host initiates connections to over 50 unique
    destination IPs or over 100 unique destination ports within a 5-minute window, and the total connection
    count exceeds the 99th percentile of its own historical 5-minute average. The activity is considered
    high-priority if targeting common ICS/OT ports (e.g., 502, 102, 44818, 20000). -- specifically, using
    the ''Alert on high fan-out from unauthorized hosts'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary performs Remote System
    Discovery to enumerate other systems on the ICS/OT network that may be used for subsequent Lateral
    Movement or Discovery. This evidence focuses on the condition that a single source host, not on a
    pre-defined ''Authorized Scanners'' watchlist, generates a high volume of connection attempts to many
    distinct destinations. Specifically, the host initiates connections to over 50 unique destination
    IPs or over 100 unique destination ports within a 5-minute window, and the total connection count
    exceeds the 99th percentile of its own historical 5-minute average. The activity is considered high-priority
    if targeting common ICS/OT ports (e.g., 502, 102, 44818, 20000). The ''Alert on high fan-out from
    unauthorized hosts'' approach (Symbolic Logic) works as follows: From Zeek conn.log, count distinct
    id.resp_h and id.resp_p per id.orig_h in rolling 5-minute windows; alert when a source NOT on the
    Authorized ICS Management Hosts watchlist exceeds >50 unique destination IPs OR >100 unique destination
    ports. Escalate severity when destinations include ICS ports (502 Modbus, 102 S7comm, 44818 EtherNet/IP,
    20000 DNP3). Maintain the watchlist and authorized protocol/port allow-lists per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    fan-out matching of single-source-to-many-destinations follows [BZAR](https://github.com/mitre-attack/bzar)
    over the first-party fields documented in [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable remote-system
    discovery; pivot to the responsible source host, the originating process and user/account, the targeted
    destination devices, ports, and ICS protocols/function codes, and the rate and timing of the activity
    to scope what was enumerated. A negative result helps rule out this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land discovery activity.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: ICS Network Segments (e.g., Control Network, Safety Instrumented System Network), OT/IT DMZ,
    Engineering Subnet, Process Control Network (PCN)'
  range: Last 90 days
  queries:
  - technology: Zeek/conn.log stats pseudocode
    query: "// rolling 5-minute fan-out per source\nfrom zeek.conn\n| where id.orig_h NOT IN watchlist(\"\
      Authorized_ICS_Management_Hosts\")\n| bin window = 5m on ts\n| stats by id.orig_h, window:\n   \
      \   dst_ips = dcount(id.resp_h),\n      dst_ports = dcount(id.resp_p),\n      conns = count(),\n\
      \      ics_ports = countif(id.resp_p in (502,102,44818,20000))\n| where dst_ips > 50 OR dst_ports\
      \ > 100\n| eval severity = if(ics_ports > 0, \"HIGH\", \"MEDIUM\")\n| emit alert"
