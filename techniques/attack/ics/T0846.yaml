name: 'T0846: Remote System Discovery'
id: 7c1660ec-57e5-46dc-a101-5962127f2d4a
description: 'This playbook helps an analyst investigate whether an adversary is performing Remote System
  Discovery (MITRE ATT&CK for ICS T0846) to enumerate other systems by IP address, hostname, or other
  logical identifier across an ICS/OT network in preparation for Lateral Movement or further Discovery.
  It hunts the behavior from several complementary angles: a single source host that generates high connection
  fan-out to many distinct destination IPs/ports (especially common ICS/OT ports such as 502/Modbus, 102/S7comm,
  44818/EtherNet-IP, 20000/DNP3) from a host not on an authorized-scanner watchlist; execution of native
  network-discovery utilities (ping.exe, net.exe, arp.exe, nbtscan.exe, nmap.exe, tracert.exe) on Engineering
  Workstations and HMIs with subnet/CIDR sweep arguments, suspicious parent processes, or non-administrative
  users; unauthorized ICS-specific discovery/identity function codes (EtherNet/IP List Identity, Modbus
  Read Device Identification, S7comm Get Block Info, DNP3 Read Class 0) issued at high rate or variety
  against many PLCs/RTUs; and processes responsible for large numbers of failed connection attempts (TCP
  RST, ICMP Destination Unreachable, Zeek S0/REJ/RSTR) indicative of a network sweep. Detection methods
  combine deterministic symbolic-logic rules (fan-out thresholds, authorized-host/protocol allow-lists,
  discovery-utility command-line matching, ICS function-code semantic rules, failed-connection sweep correlation),
  statistical baselining (per-host fan-out and connection-volume percentiles, discovery-utility frequency
  and parent entropy, ICS request-rate/variety/periodicity modeling, Threshold Random Walk sequential
  hypothesis testing, per-process success/failure ratios), and machine learning (Isolation Forest / One-Class
  SVM with LIME explanations, DBSCAN clustering of process and ICS behavior, Random Forest classification,
  Matrix Profile discord detection, and the Kitsune autoencoder ensemble), applied across Zeek conn/icmp/s7comm/enip/modbus/dnp3
  logs and Windows Event IDs 4688 and 5156, so the analyst can corroborate suspected remote-system discovery
  against host, process, user, protocol, and network-flow context.'
type: technique
related:
- tactic_id: TA0102
  tactic_name: Discovery
