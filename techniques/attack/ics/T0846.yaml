- question: '[Discovery] Alert on unauthorized ICS discovery function codes: Can you determine whether
    a source IP address, not on a pre-defined ''Authorized ICS Management Hosts'' watchlist, initiates
    a high frequency or wide variety of ICS-specific discovery requests. This is defined as more than
    10 discovery-related function calls (e.g., EtherNet/IP ''List Identity'', Modbus ''Read Device Identification'',
    S7comm ''Get Block Info'', DNP3 ''Read Class 0 Data'') directed to more than 5 unique destination
    ICS devices (e.g., PLCs, RTUs) within a 1-minute window. -- specifically, using the ''Alert on unauthorized
    ICS discovery function codes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary performs Remote System
    Discovery to enumerate other systems on the ICS/OT network that may be used for subsequent Lateral
    Movement or Discovery. This evidence focuses on the condition that a source IP address, not on a pre-defined
    ''Authorized ICS Management Hosts'' watchlist, initiates a high frequency or wide variety of ICS-specific
    discovery requests. This is defined as more than 10 discovery-related function calls (e.g., EtherNet/IP
    ''List Identity'', Modbus ''Read Device Identification'', S7comm ''Get Block Info'', DNP3 ''Read Class
    0 Data'') directed to more than 5 unique destination ICS devices (e.g., PLCs, RTUs) within a 1-minute
    window. The ''Alert on unauthorized ICS discovery function codes'' approach (Symbolic Logic) works
    as follows: Identify discovery/identity function codes (EtherNet/IP List Identity, Modbus Read Device
    Identification FC 0x2B/0x0E, S7comm Get Block Info, DNP3 Read Class 0) in Zeek protocol logs and alert
    when issued by a source NOT on the Authorized ICS Management Hosts watchlist, when targeting >5 unique
    devices, or when >10 such requests occur in a 1-minute window. Encode valid function codes, command/response
    pairing, and addressing as semantic rules per [Distributed IDS using Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917)
    and [On Specification-based Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354);
