- question: '[Discovery] Score scan likelihood from connection success/failure state: Can you determine
    whether a single source host, not on a pre-defined ''Authorized Scanners'' watchlist, generates a
    high volume of connection attempts to many distinct destinations. Specifically, the host initiates
    connections to over 50 unique destination IPs or over 100 unique destination ports within a 5-minute
    window, and the total connection count exceeds the 99th percentile of its own historical 5-minute
    average. The activity is considered high-priority if targeting common ICS/OT ports (e.g., 502, 102,
    44818, 20000). -- specifically, using the ''Score scan likelihood from connection success/failure
    state'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary performs Remote System
    Discovery to enumerate other systems on the ICS/OT network that may be used for subsequent Lateral
    Movement or Discovery. This evidence focuses on the condition that a single source host, not on a
    pre-defined ''Authorized Scanners'' watchlist, generates a high volume of connection attempts to many
    distinct destinations. Specifically, the host initiates connections to over 50 unique destination
    IPs or over 100 unique destination ports within a 5-minute window, and the total connection count
    exceeds the 99th percentile of its own historical 5-minute average. The activity is considered high-priority
    if targeting common ICS/OT ports (e.g., 502, 102, 44818, 20000). The ''Score scan likelihood from
    connection success/failure state'' approach (Statistical Method) works as follows: Apply the Threshold
    Random Walk sequential hypothesis test of [Fast Portscan Detection](https://www.icir.org/vern/papers/portscan-oak04.pdf)
    over conn_state: treat each new connection as success (SF/established) or failure (S0 no-reply, REJ
    rejected, RSTR reset) and accumulate the likelihood ratio, flagging a source as a scanner once it
    crosses the upper threshold (typically after ~4-5 mostly-failed attempts to distinct hosts). Profile
    the per-source failure ratio (S0+REJ)/total as a distinct signal. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable remote-system discovery; pivot to the responsible
    source host, the originating process and user/account, the targeted destination devices, ports, and
    ICS protocols/function codes, and the rate and timing of the activity to scope what was enumerated.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    discovery activity.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: ICS Network Segments (e.g., Control Network, Safety Instrumented System Network), OT/IT DMZ,
    Engineering Subnet, Process Control Network (PCN)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode (Threshold Random Walk)
    query: "// TRW sequential hypothesis test over conn_state per source\nfor each new conn by id.orig_h\
      \ to distinct id.resp_h:\n    outcome = success if conn_state in (\"SF\",\"S1\",\"S2\",\"ESTAB\"\
      ) else failure  // S0,REJ,RSTR=failure\n    Lambda *= (outcome==success ? theta1/theta0 : (1-theta1)/(1-theta0))\n\
      \    if Lambda >= eta1: flag id.orig_h as SCANNER   // ~4-5 mostly-failed distinct hosts\n| also\
      \ profile failure_ratio = (S0+REJ)/total per source"
