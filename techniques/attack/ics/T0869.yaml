name: 'T0869: Standard Application Layer Protocol'
id: df22e003-b0a1-438d-aec3-29da07fc4282
description: Investigate whether an adversary is abusing standard application layer protocols (e.g., HTTP(S),
  OPC, RDP, telnet, DNP3, Modbus) to establish command and control (C2) within or out of the ICS environment,
  disguising malicious activity as benign operational traffic. This playbook helps an analyst hunt for
  protocol services running on non-standard ports, rare service/port pairings, anomalous cross-boundary
  (IT-to-OT) and external connections, unauthorized ICS function codes and broken command/response pairing,
  periodic beaconing cadence, anomalous data volume and payload/URI entropy, HTTP failure-rate spikes
  indicative of dead-drop or failed polling, and suspicious RDP interactive logons to critical OT assets.
  It combines deterministic allowlist/symbolic-logic rules, statistical baselining (percentiles, entropy,
  beacon-regularity, failure-state profiling), and machine-learning outlier, time-series, and graph models,
  always keeping deterministic rules as the floor because ML ICS-IDS generalize poorly and are evadable.
type: technique
related:
- tactic_id: TA0101
  tactic_name: Command And Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are any critical ICS application-layer protocols (DNP3, Modbus, RDP, telnet, OPC) running
    on ports that are not their IANA-standard port or a documented organizational exception, especially
    when the connection crosses an IT/OT boundary or reaches a non-RFC1918 external address?
  context: 'Adversaries deliberately run standard ICS protocols over non-standard ports to evade port-based
    controls and blend in. Use Zeek''s protocol classification (the `service` field), which identifies
    the actual application protocol regardless of port, and compare the observed responder port against
    a per-zone allowlist of approved ports. A match on a critical protocol on an unapproved port is suspicious;
    escalate sharply when the source is in an OT subnet and the destination is external or the flow crosses
    a defined IT/OT demarcation, which is the classic posture for Command and Control egress from a segmented
    environment. Maintain per-zone protocol/port allowlists aligned to NIST SP 800-82r3 segmentation guidance.
    A positive result is a genuine misuse of a standard protocol for covert C2; a negative result helps
    confirm protocols stay within their approved channels. Source references: [Guide to Operational Technology
    (OT) Security, NIST SP 800-82r3](https://csrc.nist.gov/pubs/sp/800/82/r3/final); [Network Intrusion
    Detection and Prevention, Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Zeek conn.log
  - Zeek service.log
  - 'NAI: IT/OT Demarcation Points (e.g., firewalls, DMZ), ICS Zone Gateways, Enterprise Network Perimeter,
    Internet Proxies, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    PLCs, RTUs, Jump Servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM conn.log\nWHERE service IN [\"dnp3\",\"modbus\",\"rdp\",\"telnet\",\"opc\"]\n  AND id.resp_p\
      \ NOT IN approved_ports[service]\nEVAL crosses_boundary = is_ot(id.orig_h) AND (is_external(id.resp_h)\
      \ OR zone(id.orig_h)!=zone(id.resp_h))\nSET severity = crosses_boundary ? \"high\" : \"medium\"\n\
      OUTPUT ts, id.orig_h, id.resp_h, id.resp_p, service, severity"
- question: Is any OT source host generating an abnormal burst of failed, blocked, or half-open connection
    attempts (conn_state S0, REJ, RSTRH, RSTRO) toward external or cross-zone destinations, indicating
    attempted C2 setup or retry behavior?
  context: 'Connection-setup failure is itself a C2 reconnaissance/retry signal: malware that cannot reach
    its controller (because of firewall blocks or a dead C2) repeatedly retries, producing a spike of
    half-open or rejected connections. Baseline each OT source host''s 30-day rolling rate of failed egress
    attempts per 5-minute window using Zeek conn.log conn_state values, then alert when the failed cross-boundary/external
    attempt rate exceeds the host''s mean + 3 standard deviations. A positive result flags a host trying
    to phone home; a negative result indicates connection failures are within normal operational noise.
    Tie this to the Command and Control tactic: it surfaces nascent C2 before a successful channel is
    established. Source references: [Network Intrusion Detection and Prevention, Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Zeek conn.log
  - Zeek service.log
  - 'NAI: IT/OT Demarcation Points (e.g., firewalls, DMZ), ICS Zone Gateways, Enterprise Network Perimeter,
    Internet Proxies, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    PLCs, RTUs, Jump Servers.'
  range: Last 30 days (5-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM conn.log\nWHERE conn_state IN [\"S0\",\"REJ\",\"RSTRH\",\"RSTRO\"]\n  AND is_ot(id.orig_h)\
      \ AND (is_external(id.resp_h) OR crosses_boundary)\nBIN ts INTO 5m AS w\nSTATS fails = count() BY\
      \ id.orig_h, w\nBASELINE mean,std OF fails BY id.orig_h OVER 30d\nWHERE fails > mean + 3*std\nOUTPUT\
      \ id.orig_h, w, fails, mean, std"
- question: For each application protocol, which destination ports are rarely used (below the 5th percentile),
    and is any source host dispersing connections across an unusually high number of ports or destination
    IPs (high Shannon entropy) relative to its own baseline?
  context: 'Volume-based detection misses low-and-slow C2 that hides in rare service/port pairings. Daily,
    analyze the last 30 days of conn.log: for each `service`, compute the usage frequency of every responder
    port and flag ports below the 5th percentile as rare; additionally compute the Shannon entropy of
    the destination-port and destination-IP distribution per source host to catch dispersal anomalies
    (e.g., scanning or domain/port fluxing) that frequency alone misses. Maintain a dynamic watchlist
    of rare service-port pairs and alert when a new connection matches one or when a host''s port/IP entropy
    exceeds its baseline by more than 3 standard deviations. A positive result points to covert C2 channels
    using uncommon paths; a negative result confirms protocol traffic follows established, common pairings.
    Source references: [Mining Anomalies Using Traffic Feature Distributions, Lakhina et al](https://conferences.sigcomm.org/sigcomm/2005/paper-LakCro.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek service.log
  - 'NAI: IT/OT Demarcation Points (e.g., firewalls, DMZ), ICS Zone Gateways, Enterprise Network Perimeter,
    Internet Proxies, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    PLCs, RTUs, Jump Servers.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM conn.log OVER 30d

      STATS freq = count() BY service, id.resp_p

      EVAL p5 = percentile(freq, 5) BY service

      SET rare_pairs = {service,id.resp_p WHERE freq <= p5}

      -- entropy per host

      STATS port_H = entropy(id.resp_p), ip_H = entropy(id.resp_h) BY id.orig_h, day

      BASELINE mean,std OF port_H,ip_H BY id.orig_h

      ALERT new conn IN rare_pairs OR port_H > mean+3*std OR ip_H > mean+3*std'
- question: Do any connections receive a high anomaly score from an unsupervised model (Isolation Forest
    or online autoencoder) trained on historical Zeek connection features, and what are the top contributing
    features explaining each anomalous flow?
  context: 'An unsupervised model can surface novel C2 flows that escape static allowlists by learning
    the joint distribution of connection features (proto, service, resp_p, duration, orig_bytes, resp_bytes,
    conn_state, and external/cross-boundary flags). Train an Isolation Forest, or an online autoencoder
    ensemble such as Kitsune suited to OT-edge resources, on clean historical conn.log, then score new
    connections and alert above a tuned threshold. Always surface the top-3 contributing features (per-feature
    reconstruction error or SHAP values) so analysts can triage. Run this in parallel with (never instead
    of) the deterministic allowlist rules above, because ML ICS-IDS generalize poorly to unseen attacks
    and are evadable. A positive result is a flow deviating from normal operations worth investigating;
    the explanation guides whether it is benign drift or true C2. Source references: [Kitsune, Mirsky
    et al](https://arxiv.org/abs/1802.09089); [Explainable Anomaly Detection for Industrial Control System
    Cybersecurity, Ha et al](https://arxiv.org/abs/2205.01930); [A False Sense of Security? Revisiting
    ML-Based Industrial Intrusion Detection, Kus et al](https://arxiv.org/abs/2205.09199); [Adversarial
    Attacks on Time-Series Intrusion Detection for Industrial Control Systems, Zizzo et al](https://arxiv.org/abs/1911.04278).'
  answer_sources:
  - Zeek conn.log
  - Zeek service.log
  - 'NAI: IT/OT Demarcation Points (e.g., firewalls, DMZ), ICS Zone Gateways, Enterprise Network Perimeter,
    Internet Proxies, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    PLCs, RTUs, Jump Servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [proto, service, id.resp_p, duration, orig_bytes, resp_bytes, conn_state,\n   \
      \        is_external, crosses_boundary]\nmodel = IsolationForest().fit(history.conn_log[features])\
      \  # or Kitsune autoencoder ensemble\nFOR conn IN new_conns:\n  score = model.anomaly_score(conn[features])\n\
      \  IF score > tuned_threshold:\n     ALERT(conn, top3 = explain(model, conn))  # SHAP / per-feature\
      \ recon error"
- question: Are any DNP3 or Modbus transactions using function codes that are not on the allowlist for
    that specific master-outstation pair, writing/controlling on a normally read-only channel, or violating
    expected command/response pairing, ordering, or periodicity?
  context: 'ICS protocols carry function codes that map to concrete operations (read, write, control).
    Adversaries abuse them to issue unauthorized commands while riding a legitimate protocol session.
    For each critical master-outstation IP pair, define a strict allowlist of expected function codes
    and enforce command/response pairing and message ordering using protocol-semantic rules; model the
    per-channel rhythm with a DFA so missing, extra, or out-of-sequence periodic messages are caught.
    Generate a high-severity alert when a disallowed function code appears, when a write/control code
    appears on a read-only channel, or when expected periodic messaging breaks. Enrich by correlating
    concurrent suspicious process creations (Windows Event ID 4688) on the source host. A positive result
    is strong evidence of hands-on-keyboard or automated C2 issuing control actions; a negative result
    confirms only sanctioned commands traverse the channel. Source references: [Distributed Intrusion
    Detection System using Semantic-based Rules for SCADA, Mohan et al](https://arxiv.org/abs/2412.07917);
    [Temporal Phase Shifts in SCADA Networks, Markman et al](https://arxiv.org/abs/1808.05068).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), SCADA Servers, Historian Servers, Human-Machine Interfaces (HMIs),
    DMZ Web Servers, Process Control Networks (PCN) Segments, Enterprise Proxies, Internet Gateways, Domain
    Controllers, Jump Servers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FROM dnp3.log, modbus.log\nLET pair = (id.orig_h,id.resp_h)\nWHERE function_code NOT IN allowlist[pair]\n\
      \   OR (is_write(function_code) AND channel_is_readonly(pair))\n   OR violates_request_response_pairing(pair)\n\
      \   OR missing_or_out_of_sequence(periodic_model[pair])\nENRICH with WinEventID=4688 ON host=id.orig_h\
      \ NEAR ts\nOUTPUT high_severity_alert(pair, function_code, ts)"
- question: For each ICS source host, does any outbound HTTP request exceed its data-volume baseline,
    show URI or User-Agent Shannon entropy more than 3 standard deviations above its mean, or produce
    an anomalous spike in 4xx/5xx responses to a single external destination?
  context: 'C2 frequently tunnels through HTTP. Build a 30-day rolling per-host baseline of the 95th/99th
    percentile of outbound HTTP orig_bytes, the mean/stddev of Shannon entropy for the `uri` and `user_agent`
    fields, and the per-host rate of HTTP 4xx/5xx codes. High-entropy URIs or user-agents suggest encoded/encrypted
    C2 data or randomized beacons; oversized requests suggest exfil or command payloads; a spike of failed
    (4xx/5xx) responses to one external host indicates dead-drop or failed-C2 polling. Complement with
    byte-frequency payload profiling per host/port/length using Mahalanobis distance (PAYL) to detect
    C2 content hidden inside HTTP or ICS bodies. A positive result identifies a host whose web traffic
    deviates from its norm in a C2-consistent way; a negative result reduces suspicion of HTTP-based covert
    channels. Source references: [Mining Anomalies Using Traffic Feature Distributions, Lakhina et al](https://conferences.sigcomm.org/sigcomm/2005/paper-LakCro.pdf);
    [Anomalous Payload-Based Network Intrusion Detection (PAYL), Wang and Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), SCADA Servers, Historian Servers, Human-Machine Interfaces (HMIs),
    DMZ Web Servers, Process Control Networks (PCN) Segments, Enterprise Proxies, Internet Gateways, Domain
    Controllers, Jump Servers.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM http.log OVER 30d\nBASELINE p95,p99 OF orig_bytes BY src\nBASELINE mean,std OF entropy(uri),\
      \ entropy(user_agent) BY src\nBASELINE err_rate OF (status>=400) BY src,dst\nALERT WHEN orig_bytes\
      \ > p99[src]\n   OR entropy(uri) > mean+3*std OR entropy(user_agent) > mean+3*std\n   OR err_rate(src,dst)\
      \ spikes for single external dst\n-- PAYL: flag Mahalanobis(byte_freq, model[host,port,len]) > threshold"
- question: Do any (source, destination, destination-port) flows exhibit regular beaconing cadence, low
    inter-arrival-time variance, long-lived or external-rare characteristics, after suppressing known-benign
    periodic services?
  context: 'Beaconing is the heartbeat of C2: implants call home at regular intervals. For each (src,dst,dst_port)
    tuple in conn.log, compute inter-arrival-time and payload-size regularity over a rolling window using
    coefficient of variation, median absolute deviation, and Bowley skewness, and flag low-variance, long-lived,
    or external-rare flows as beaconing (RITA-style scoring plus an FFT periodicity + whitelist-suppression
    pipeline as in BAYWATCH). For DNP3 specifically, apply probabilistic risk scoring over function-code/message
    sequences to surface replay/injection. Whitelist known-benign periodic services (NTP, software updates,
    polling) to control false positives. A positive result is a strong C2 indicator; a negative result
    helps rule out automated callbacks. This directly supports the Command and Control tactic by exposing
    the periodic signaling that defines a C2 channel. Source references: [RITA, Active Countermeasures](https://github.com/activecm/rita);
    [BAYWATCH, Hu et al](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    [Probability Risk Identification Based Intrusion Detection System for SCADA, Marsden et al](https://arxiv.org/abs/1711.02826).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), SCADA Servers, Historian Servers, Human-Machine Interfaces (HMIs),
    DMZ Web Servers, Process Control Networks (PCN) Segments, Enterprise Proxies, Internet Gateways, Domain
    Controllers, Jump Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM conn.log\nGROUP BY src,dst,dst_port OVER rolling_window\nEVAL iat = diff(ts)\nSTATS cv\
      \ = stddev(iat)/mean(iat), mad = mad(iat), skew = bowley(iat),\n      dur = max(ts)-min(ts), n =\
      \ count()\nWHERE cv < 0.1 AND n >= min_hits AND (is_external(dst) OR is_rare(dst))\n  AND dst_port\
      \ NOT IN benign_periodic_whitelist\nOPTIONAL fft_periodicity(iat) confirms peak\nOUTPUT beacon_candidate(src,dst,dst_port,cv,dur,n)"
- question: Does any 10-minute window of aggregated master-outstation telemetry produce a high reconstruction
    error from an LSTM/transformer autoencoder trained on the channel's normal operational rhythm, and
    which features drive the anomaly?
  context: 'ICS communications follow a predictable operational rhythm; deviations can indicate C2 injecting
    traffic or altering cadence. For each master-outstation pair, build multivariate time-series by aggregating
    Zeek logs into 10-minute windows (message count, function-code distribution, average duration, total
    bytes, inter-arrival statistics) and train an LSTM Autoencoder (or a transformer for high-jitter beacons)
    on normal behavior. Alert when a new window''s reconstruction error exceeds a dynamic threshold and
    surface the top-3 contributing features (SHAP/per-feature error). Keep the deterministic function-code
    and beaconing rules as the floor, since time-series ICS-IDS are evadable via adversarial sensor perturbation.
    A positive result flags a channel whose rhythm broke from normal; the feature attribution guides triage
    toward benign process changes versus C2. Source references: [C2 Beaconing Detection via AI-Based Time-Series
    Analysis, Gupta et al](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20); [Explainable
    Anomaly Detection for Industrial Control System Cybersecurity, Ha et al](https://arxiv.org/abs/2205.01930);
    [Adversarial Attacks on Time-Series Intrusion Detection for Industrial Control Systems, Zizzo et al](https://arxiv.org/abs/1911.04278).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), SCADA Servers, Historian Servers, Human-Machine Interfaces (HMIs),
    DMZ Web Servers, Process Control Networks (PCN) Segments, Enterprise Proxies, Internet Gateways, Domain
    Controllers, Jump Servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR pair IN master_outstation_pairs:\n  X = aggregate(zeek_logs[pair], window=10m,\n     \
      \   feats=[msg_count, fc_distribution, avg_duration, total_bytes, iat_stats])\n  model = LSTMAutoencoder().fit(X_normal[pair])\
      \  # or transformer for high-jitter\n  FOR w IN new_windows[pair]:\n    err = model.reconstruction_error(w)\n\
      \    IF err > dynamic_threshold[pair]:\n       ALERT(pair, w, top3 = explain(model, w))"
- question: Has there been any successful RDP logon (Windows Event ID 4624, Logon Type 10) to an OT asset
    where the Source Network Address is external (non-RFC1918) and not on the approved remote-access allowlist,
    or any telnet session into OT or anomalous RDP client version?
  context: 'Interactive RDP (and telnet) to critical OT assets such as EWS, HMIs, and SCADA servers is
    a high-value C2 vector. Implement a SIEM rule that fires high severity for any successful RDP logon
    (Event 4624, Logon Type 10) to an OT asset where the Source Network Address is external and not on
    a maintained allowlist of approved IPs/subnets, consistent with NIST SP 800-82r3 remote-access restriction
    and IT/OT demarcation guidance. Correlate with Zeek rdp.log for anomalous RDP client versions and
    with telnet sessions to OT, which should generally be disallowed entirely. A positive result is a
    likely interactive C2 foothold on a critical asset; a negative result confirms remote access stays
    within sanctioned sources. This supports the Command and Control tactic by catching hands-on remote
    control of OT endpoints. Source references: [Guide to Operational Technology (OT) Security, NIST SP
    800-82r3](https://csrc.nist.gov/pubs/sp/800/82/r3/final); [Network Intrusion Detection and Prevention,
    Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Zeek conn.log
  - Zeek rdp.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Jump Servers/Bastion
    Hosts, Domain Controllers, Remote Access VPN Concentrators, IT/OT Demarcation Points, Active Directory
    Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM WinEventID=4624 WHERE LogonType=10 AND is_ot_asset(Computer)\n  AND is_external(SourceNetworkAddress)\n\
      \  AND SourceNetworkAddress NOT IN rdp_allowlist\nSET severity = high\nCORRELATE Zeek rdp.log FOR\
      \ anomalous client_version\nALERT any telnet session INTO ot_asset"
- question: For each user-asset RDP pair, does a new logon occur at an unusual hour (>3 standard deviations
    from the user's mean), is there a spike of failed RDP logons (Event 4625, Logon Type 10) followed
    by a success, or does a session duration exceed the 95th percentile for that pair?
  context: Behavioral baselining of RDP catches C2 that uses valid credentials. Over the past 90 days
    of Event 4624, profile each user-asset pair's logon hours and alert on logons more than 3 standard
    deviations from the user's mean hour (off-hours access is a common C2 pattern). Profile the RDP failure
    rate using Event 4625 (Logon Type 10) per source and per asset and alert when a burst of failures
    is immediately followed by a success, the signature of brute-force-then-access. Correlate the Logon
    ID between Event 4624 (logon) and 4634 (logoff) to compute session durations and alert on sessions
    exceeding the 95th percentile for the pair, since over-long interactive sessions can indicate sustained
    remote control. A positive result is anomalous interactive access worth investigating; a negative
    result indicates RDP behavior matches historical norms.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Zeek conn.log
  - Zeek rdp.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Jump Servers/Bastion
    Hosts, Domain Controllers, Remote Access VPN Concentrators, IT/OT Demarcation Points, Active Directory
    Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '-- timing

      FROM 4624 (LogonType=10) BASELINE mean,std OF logon_hour BY user,asset

      ALERT WHEN new logon_hour > mean+3*std

      -- brute force then success

      FROM 4625 (LogonType=10) STATS fails BY source,asset,window

      ALERT WHEN fails spike THEN 4624 success same source/asset

      -- session length

      JOIN 4624(logon) AND 4634(logoff) ON LogonID -> duration

      ALERT WHEN duration > p95(user,asset)'
- question: When RDP sessions are modeled as a graph of users and ICS assets, do any new RDP edges score
    as highly improbable (e.g., connecting disparate clusters) or carry highly anomalous features (time,
    duration, bytes), per an unsupervised graph model?
  context: 'Graph-based modeling exposes improbable RDP relationships that point-based rules miss. Construct
    a graph where nodes are users and ICS assets and edges are historical RDP sessions, then train an
    unsupervised graph anomaly model that learns node embeddings and scores the likelihood of new edges
    (CyberGraph-style). Deploy it to score new RDP sessions and alert on highly improbable connections,
    such as a new edge bridging previously disconnected clusters, or edges with highly anomalous features
    (unusual time, duration, or bytes transferred), surfacing the top-3 contributing features/edges for
    triage. Retain the deterministic external-IP allowlist rule as the floor, since ML detectors overfit
    and are evadable. A positive result reveals lateral/remote-control patterns inconsistent with normal
    access topology; a negative result supports that RDP relationships remain within expected clusters.
    Source references: [CyberGraph: Detecting Lateral Movement with Unsupervised Graph AI, Bowman et al](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf);
    [A False Sense of Security? Revisiting ML-Based Industrial Intrusion Detection, Kus et al](https://arxiv.org/abs/2205.09199).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Zeek conn.log
  - Zeek rdp.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Jump Servers/Bastion
    Hosts, Domain Controllers, Remote Access VPN Concentrators, IT/OT Demarcation Points, Active Directory
    Servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = build_graph(nodes=users+ics_assets, edges=rdp_sessions(history))\nemb = graph_model.fit(G)\
      \  # learn node embeddings (CyberGraph-style)\nFOR session IN new_rdp_sessions:\n  p = emb.edge_likelihood(session.user,\
      \ session.asset, feats=[time,duration,bytes])\n  IF p < threshold OR bridges_disparate_clusters(session):\n\
      \     ALERT(session, top3 = explain(emb, session))\n-- floor: deterministic external-IP allowlist\
      \ rule still applies"
