questions:
- question: '[Evasion] Detect ICS app executions from unapproved paths or with metadata mismatch: Can
    you determine whether a process creation event (Windows Event ID 4688) shows a known ICS application
    name (e.g., ''RSLinx.exe'', ''FTView.exe'', ''ControlLogix.exe'') executing from a command line path
    that is not on an established whitelist of approved execution directories for that specific application.
    -- specifically by applying the ''Detect ICS app executions from unapproved paths or with metadata
    mismatch'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Evasion tactic (TA0103), The adversary is trying to avoid security
    defenses. For T0849 (Masquerading), adversaries disguise a malicious application or executable as
    a legitimate ICS or system file -- using vendor-relevant names, expected install paths, or commonplace
    naming conventions -- so operators and engineers do not notice and may run it as a trusted function.
    This evidence focuses on the condition that a process creation event (Windows Event ID 4688) shows
    a known ICS application name (e.g., ''RSLinx.exe'', ''FTView.exe'', ''ControlLogix.exe'') executing
    from a command line path that is not on an established whitelist of approved execution directories
    for that specific application. The ''Detect ICS app executions from unapproved paths or with metadata
    mismatch'' approach (Symbolic Logic) works as follows: Maintain an allowlist mapping each approved
    ICS process name (e.g., RSLinx.exe, FTView.exe) to its full legitimate install path, vendor-signed
    publisher, and known-good hash, derived from documented name/path/event baselines [Detecting Lateral
    Movement through Tracking Event Logs](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).
    Alert on Windows Event ID 4688 / Sysmon EID 1 when ProcessName matches the allowlist but CommandLine
    path is not the approved path, runs from a suspicious directory (C:\Temp\, C:\PerfLogs\, C:\Users\Public\,
    %APPDATA%), is unsigned, hash does not match the vendor known-good, or the PE OriginalFileName metadata
    does not equal the on-disk filename (renamed-after-compile indicator) [SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma).
    What the analyst is looking for: deviations from the known-good name/path/metadata/behavior baseline
    described above that betray a renamed, relocated, or impersonating binary or file. A positive result
    -- a deterministic rule match, a statistical outlier beyond the stated threshold, or a model alert
    -- indicates probable masquerading; pivot to the implicated ICS host (EWS, HMI, application server,
    historian, or jump server), the responsible account and parent process, the file''s on-disk path/hash/metadata,
    and the surrounding event timeline to confirm whether the object is the genuine vendor artifact or
    an impostor, and to scope any downstream execution or egress. A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss careful, low-and-slow, or living-off-the-land masquerading; run deterministic allowlist/metadata
    rules as the floor and treat statistical/ML detections as parallel corroboration.'
