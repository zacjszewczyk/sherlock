name: 'T0849: Masquerading'
id: a1ac1e8c-a856-4592-b1aa-ba5acc0233c0
description: 'This playbook helps an analyst investigate whether an adversary is using masquerading to
  disguise a malicious application, executable, or file as legitimate ICS software or a trusted Windows
  system process in order to evade operator and engineer suspicion (MITRE ATT&CK for ICS T0849, Masquerading).
  Masquerading in OT environments is frequently as simple as renaming a binary to mimic a vendor executable
  (e.g., RSLinx.exe, FTView.exe, ControlLogix.exe) or a core system process (e.g., svchost.exe, lsass.exe,
  services.exe), placing it in an unexpected directory, or giving a malicious file a double extension
  or right-to-left-override name on an engineering workstation or project share. The hunt pursues the
  behavior from several complementary angles across the ICS estate (Engineering Workstations, HMIs, ICS
  application servers, data historians, jump servers, project file shares, and the ICS network segments
  and IT/OT DMZ): process-creation events where a known ICS or system process name runs from an unapproved
  path, is unsigned, fails its known-good hash, or shows a PE OriginalFileName/on-disk-name mismatch;
  trusted-binary lineage and image-path invariant violations; PE structure and entropy checks that expose
  packed or impostor binaries; suspicious file extensions, double extensions, obfuscated or high-entropy
  filenames written into critical ICS directories; and trusted-named processes initiating never-before-seen
  outbound network connections correlated across Windows and Zeek logs. Detection methods combine deterministic
  symbolic-logic rules (name/path/publisher/hash allowlists, parent-child and System32 image-path invariants,
  Sigma-style filename and extension rules, file-type vs metadata validation), statistical baselining
  (rare-path and rare-extension percentile scoring, filename Shannon entropy and character n-gram likelihood,
  file-content entropy >7.2, and per-process network volume, frequency, and failure-state baselines),
  and machine learning (one-class Isolation Forest/OCSVM/autoencoder outlier detection with LIME feature
  attribution, supervised filename classifiers, multivariate process-to-network autoencoders, and provenance-graph
  models such as GraphSAGE/ThreaTrace, MAGIC, and KAIROS with analyst-readable causal paths), applied
  across Windows Event IDs 4688, 4663, and 5156 and Zeek conn/dns logs, so the analyst can corroborate
  suspected masquerading against host, file, and network context.'
type: technique
