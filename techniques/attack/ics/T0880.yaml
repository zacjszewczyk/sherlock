    query: "model = SafetyProcessAE.load('sis_telemetry')  # 1D-CNN/Seq2Seq/one-class\nresid, per_point\
      \ = model.reconstruct(current_telemetry)\nIF resid > tuned_threshold:\n  point = argmax(per_point)\n\
