  - Zeek enip.log
  - 'NAI: Network traffic at SIS network segment ingress/egress points; Authentication logs on Domain
    Controllers; File access and process execution logs on Engineering Workstations (EWS) and file servers;
    Network protocol logs from network sensors.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [hour, dow, src_ip, dst_ip, user, file_size, duration, proto, failed_attempts,\
      \ is_maint_window]\nmodel = RandomForest.load('sis_logic_clf')\nscore = model.predict_proba(features)['malicious']\n\
      IF score > 0.95:\n  top3 = shap_top_features(model, features, 3)\n  ALERT(high, transfer, top3)\n\
      # allowlist specification rule remains authoritative floor"
- question: Has any safety-critical ICS protocol command (such as Stop CPU, write-to-safety-memory, or
    program/append download) been sent to an SIS PLC from a source IP not on the authorized EWS watchlist,
    or as part of an invalid command/response pairing?
  context: Beyond full file downloads, an attacker can issue individual protocol commands that stop or
    reprogram a safety controller. Deploy a protocol-aware rule (Zeek script or SIEM parser over s7comm.log,
    enip.log, modbus.log, dnp3.log, and TriStation UDP/1502) maintaining a static allowlist of critical
    function codes and target memory addresses for SIS devices. Alert instantly if such a command originates
    from a source IP not on the authorized EWS watchlist or pairs an invalid command/response. Specification-based
    detection yields very low false positives in predictable ICS traffic, and the rule set can be auto-generated
    from protocol semantics (valid codes, command/response pairing, point ranges); the function-code indicators
    for SIS reprogramming are documented in the CISA HatMan/TRITON MAR. A positive result is a direct
    attempt to manipulate safety logic/state; a clean result indicates no unauthorized critical commands
    were observed.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Network traffic at the SIS network segment; ICS protocol logs from network sensors monitoring
    communication to SIS PLCs; Process execution logs on HMIs and Engineering Workstations; Asset inventory
    database defining SIS device roles and IP addresses.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "const critical_fc = { 'stop_cpu', 'write_safety_mem', 'program_download', 'append' };\nevent\
      \ ics_command(c):\n  if c$dst in SIS_asset_group and c$function_code in critical_fc:\n    if c$src\
      \ !in Authorized_EWS_watchlist or invalid_cmd_response(c):\n      NOTICE(SIS_Critical_Command, c$src,\
      \ c$dst, c$function_code)"
  - technology: SIEM/Rule pseudocode
    query: "ALERT(high) WHEN proto IN [s7comm,enip,modbus,dnp3,tristation]\n  AND function_code IN SIS_critical_allowlist\n\
      \  AND dst_ip IN SIS_asset_group\n  AND src_ip NOT IN Authorized_EWS_watchlist"
- question: For each SIS PLC, do the function-code entropy, write/program command frequency, total command
    volume, or protocol exception/error rate deviate sharply from baseline in any 5-minute interval?
  context: Unauthorized probing and manipulation perturb the statistical shape of command traffic. For
    each SIS PLC, compute in 5-minute intervals the Shannon entropy of observed function codes, the frequency
    (count/min) of write/program commands, total command volume, and the rate of protocol exception/error
    responses (e.g., Modbus exception codes, denied/NAK responses) from Zeek protocol logs. Alert if function-code
    entropy increases > 3 standard deviations from baseline, OR critical-command frequency exceeds its
    99th percentile, OR the exception-response rate spikes (a failure-mode signal of unauthorized probing
    or malformed commands). Rare command transactions should be modeled probabilistically. A positive
    result indicates abnormal command interaction with a safety controller; a negative result shows command
    traffic remains within normal operational bounds.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Network traffic at the SIS network segment; ICS protocol logs from network sensors monitoring
    communication to SIS PLCs; Process execution logs on HMIs and Engineering Workstations; Asset inventory
    database defining SIS device roles and IP addresses.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each SIS_PLC, bin = 5min:\n  H = shannon_entropy(function_codes_in_bin)\n  freq_write\
      \ = count(write|program)/min\n  vol = count(all_commands)\n  exc_rate = count(exception|NAK|denied)/count(all)\n\
      \  ALERT IF H > mean_H + 3*std_H\n     OR freq_write > p99(freq_write)\n     OR exc_rate > mean_exc\
      \ + 3*std_exc"
- question: Does the sequence of commands sent to an SIS PLC violate the learned grammar of normal safe
    operation, and which specific command or memory point is responsible for the anomaly?
  context: Safety controllers exhibit a predictable command 'grammar' over time that a sequence model
    can learn. Train an LSTM/Seq2Seq encoder-decoder autoencoder on historical sequences of normal command
    traffic per SIS PLC; alert when reconstruction/prediction error exceeds a tuned threshold and report
    the localized offending command/point. Surface the top-3 contributing features via SHAP so the analyst
    can interpret the alert. Keep the deterministic critical-command allowlist as the floor, since time-series
    ICS detectors are evadable by adversarial perturbation. A high reconstruction error localized to a
    write-to-safety-memory or program command is a strong signal of an attempted Loss of Safety; low error
    indicates the command sequence matches learned-safe behavior.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: Network traffic at the SIS network segment; ICS protocol logs from network sensors monitoring
    communication to SIS PLCs; Process execution logs on HMIs and Engineering Workstations; Asset inventory
    database defining SIS device roles and IP addresses.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = Seq2SeqAE.load('sis_cmd_grammar')   # per SIS_PLC\nseq = recent_command_sequence(SIS_PLC)\n\
      recon_err, per_point_err = model.reconstruct(seq)\nIF recon_err > tuned_threshold:\n  offending\
      \ = argmax(per_point_err)\n  ALERT(high, SIS_PLC, offending, shap_top_features(model, seq, 3))\n\
      # critical-command allowlist remains the floor"
- question: Is any single source IP generating an abnormal burst of new/incomplete connections (S0/S1/REJ)
    to an SIS PLC, triggering scan or excessive-connection notices, or causing missing/delayed/extra messages
    on periodic SIS poll channels?
  context: 'Network reconnaissance and denial activity often precede or accompany an attack on safety
    systems. Create a SIEM rule that fires a high-severity alert when new connections from a single source
    IP to a single SIS PLC with conn_state S0/S1/REJ in Zeek conn.log exceed 100 in a 1-minute window,
    plus a rule on any Zeek notice of type Scan::Address_Scan or DoS::Excessive_Connections where the
    victim is in the SIS asset group. Complement these with deterministic timing checks: periodic SIS
    poll/heartbeat channels can be modeled as a DFA so that missing, delayed, or extra messages are flagged.
    Enforce deny-by-default at the SIS zone boundary. A positive result indicates scanning, flooding,
    or disruption targeting the safety segment; a clean result supports that no abnormal connection behavior
    reached the SIS.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek weird.log
  - Zeek packet_filter.log
  - 'NAI: Network traffic at the SIS network segment and IDMZ boundaries; Logs from network infrastructure
    (firewalls, switches) protecting the SIS; Network sensor logs (Zeek conn.log, notice.log) capturing
    connection state information; Performance and availability monitoring data for SIS PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT(high) WHEN count(conn.log WHERE id.orig_h=X AND id.resp_h=Y_in_SIS\n  AND conn_state\
      \ IN [S0,S1,REJ]) > 100 WITHIN 1min\nOR notice.note IN [Scan::Address_Scan, DoS::Excessive_Connections]\n\
      \  AND victim IN SIS_asset_group"
  - technology: Zeek/pseudocode
    query: "# DFA timing model for periodic SIS poll/heartbeat\nif observed_interval(poll_channel) deviates(expected_period)\
      \ or msg_missing or msg_extra:\n  NOTICE(SIS_Timing_Anomaly, channel)"
- question: For each SIS PLC, do per-minute inbound bytes, count of unique source IPs, or the ratio of
    incomplete-to-established connections exceed their historical extremes, or has the steady periodicity
    of reporting traffic been lost?
  context: 'Volumetric and connection-health metrics reveal abuse that single-event rules miss. For each
    SIS PLC, track per-minute metrics from Zeek conn.log in a time-series database: total inbound bytes,
    count of unique source IPs, and the ratio of incomplete connections (S0/S1/REJ) to established (SF).
    Alert if inbound byte count or unique-source-IP count exceeds its 99.9th percentile, or if the incomplete-connection
    (failure) ratio exceeds 3 standard deviations above its 30-day rolling average. Loss of steady periodicity
    in reporting traffic can be captured via frequency-domain (FFT) residual analysis, and rare transactions
    modeled probabilistically. A positive result indicates abnormal traffic load or connection failures
    against a safety controller; a negative result confirms traffic remains within normal volume and health
    bounds.'
