questions:
- question: Has any PLC/SIS logic or program file (for example .L5X, .ACD, .PRO, or TriStation program/append
    payloads) been transferred to a host in the SIS asset group from a source not on the Authorized EWS
    allowlist, or outside a documented maintenance window?
  context: 'Reprogramming a safety controller is the central act of a Loss of Safety attack such as TRITON/HatMan,
    and it requires pushing a logic/program file to the SIS. Per NIST SP 800-82r3, only documented engineering
    hosts and accounts operating within scheduled maintenance windows should ever reprogram safety controllers,
    so any other source must be treated as malicious. Build a real-time SIEM correlation rule over Zeek
    files.log that fires when a known logic file extension/MIME is seen heading to an SIS destination
    IP AND the source IP is not on the Authorized EWS watchlist OR the timestamp falls outside the Scheduled
    Maintenance calendar. Cross-reference the SIS key-switch/operating-mode state: because reprogramming
    requires PROGRAM/REMOTE mode, a logic transfer concurrent with a non-RUN key-switch report is high
    severity. A positive result indicates an unsanctioned attempt to alter safety logic and directly supports
    the Impact hypothesis; a clean window supports that no out-of-band reprogramming occurred.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Zeek conn.log
  - Zeek files.log
  - Zeek smb.log
  - Zeek ftp.log
  - Zeek s7comm.log
  - Zeek enip.log
  - 'NAI: Network traffic at SIS network segment ingress/egress points; Authentication logs on Domain
    Controllers; File access and process execution logs on Engineering Workstations (EWS) and file servers;
    Network protocol logs from network sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHEN files.log.filename MATCHES /\\.(L5X|ACD|PRO)$/ OR files.mime_type IN safety_logic_types\n\
      \  AND id.resp_h IN SIS_asset_group\n  AND ( id.orig_h NOT IN Authorized_EWS_watchlist\n       \
      \ OR event_time NOT WITHIN Scheduled_Maintenance_calendar )\nSET severity = high\nIF sis_keyswitch_state(id.resp_h)\
      \ != 'RUN' THEN severity = critical"
  - technology: Zeek/pseudocode
    query: "event file_over_new_connection(f):\n  if f$mime_type in safety_logic_types and f$id$resp_h\
      \ in SIS_subnets:\n    NOTICE(SIS_Logic_Transfer, f$id$orig_h, f$id$resp_h, f$filename)"
- question: For each authorized EWS-to-SIS channel, do the size, duration, frequency, or failure rate
    of logic transfers deviate from the established 30-day baseline (oversized/long transfers, abnormal
    transfer cadence, or a burst of failed attempts preceding a success)?
  context: 'Even transfers from a nominally authorized host can be malicious or coerced. Profile each
    authorized EWS-to-SIS channel from Zeek logs: compute 30-day rolling 99th-percentile values for transfer
    size (files.log total_bytes) and connection duration (conn.log duration), a baseline transfer frequency
    (transfers/week), and the ratio of failed/rejected attempts (conn_state REJ/RSTO, FTP/SMB error codes).
    A medium-severity alert should fire when a logic transfer exceeds both size and duration thresholds
    together, OR transfer frequency exceeds baseline, OR a burst of failed attempts precedes a successful
    one (a probing/brute pattern). Rare, low-probability transactions are strong indicators of unauthorized
    reprogramming in otherwise predictable ICS traffic. A positive result flags abnormal reprogramming
    activity worth correlating with the deterministic rule; a negative result shows transfers conform
    to normal engineering cadence.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Zeek conn.log
  - Zeek files.log
  - Zeek smb.log
  - Zeek ftp.log
  - Zeek s7comm.log
  - Zeek enip.log
  - 'NAI: Network traffic at SIS network segment ingress/egress points; Authentication logs on Domain
    Controllers; File access and process execution logs on Engineering Workstations (EWS) and file servers;
    Network protocol logs from network sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each channel(src=EWS, dst IN SIS_asset_group):\n  p99_size = rolling_percentile(files.total_bytes,\
      \ 99, 30d)\n  p99_dur  = rolling_percentile(conn.duration, 99, 30d)\n  base_freq = rolling_mean(transfers_per_week,\
      \ 30d)\n  fail_ratio = count(conn_state IN [REJ,RSTO])/count(all)\n  ALERT(medium) IF (size>p99_size\
      \ AND dur>p99_dur)\n     OR transfers_this_week > base_freq\n     OR (failed_burst THEN successful_transfer)"
- question: When a supervised classifier scores each SIS logic download, are any transfers labeled malicious
    with high confidence, and what features (time-of-day, source/destination, user context, file size,
    protocol, failed-attempt count, maintenance-window flag) drive that classification?
  context: 'A supervised model can capture multivariate patterns that simple thresholds miss. Train a
    classifier (e.g., Random Forest) to label each logic download authorized vs. malicious using features:
    time-of-day, day-of-week, source/destination IP, user-account context, file size, connection duration,
    protocol, failed-attempt count, and an is_maintenance_window flag. Alert on any transfer classified
    malicious with confidence > 0.95 and surface the top-3 contributing features via SHAP so the analyst
    can validate the decision. Crucially, the deterministic allowlist rule remains the floor: ML detectors
    for ICS are evadable by perturbation, so model output must never suppress a specification-rule alert.
    A high-confidence malicious classification with explainable features (e.g., off-hours + unauthorized
    source + program download) is a strong lead for the Impact hypothesis.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Zeek conn.log
  - Zeek files.log
  - Zeek smb.log
  - Zeek ftp.log
