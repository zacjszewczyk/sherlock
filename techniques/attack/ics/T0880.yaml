      IF obs outside ci(99%) for > 3 consecutive minutes:\n  ALERT(high, SIS_PLC, shap_top_features(model,\
      \ obs, 3))\n# connection-rate & scan rules remain the floor"
- question: When a trip/safe-state condition is asserted (a sensor crosses a safety setpoint or an alarm
    trip fires), does the corresponding final element/actuator reach its fail-safe position within the
    design response time T_response?
  context: This is the physical end-state of a disabled or manipulated safety function, as seen in TRITON
    where the SIS could no longer enforce safe shutdown. For each safety function, deterministically encode
    the design invariant 'trip condition asserted => corresponding final element commanded to fail-safe
    within T_response' and alert when the predicate is violated (trip present, actuator not in safe state
    past the deadline). These invariants can be mined automatically from operational data and enforced
    as explainable runtime checks; the violated predicate and its variables are named directly in the
    alert. Draw the data from the process historian, operational databases, and ICS protocol logs carrying
    read/write values to SIS I/O. A violation is a direct, high-confidence indication that the safety
    function did not act as designed; satisfaction across all trips supports an intact safety function.
  answer_sources:
  - Process Historian
  - Operational Databases
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: SIS and BPCS process telemetry (sensor tags, trip setpoints, final-element/actuator status)
    from the process historian and operational databases; ICS protocol logs carrying read/write values
    to SIS I/O; alarm/event journals correlating trip assertions with actuator commands.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each safety_function sf:\n  WHEN trip_asserted(sf.sensor, sf.setpoint) AT t0:\n    IF\
      \ NOT actuator_in_failsafe(sf.final_element) BY t0 + sf.T_response:\n      ALERT(critical, 'Safety\
      \ invariant violated', sf.name, sf.predicate_vars)"
- question: Do safety-relevant sensor signals deviate from a physics/model-predictive reference in a sustained
    way (indicating false-data injection), or has any channel flatlined to zero variance or stopped reporting
    at its expected frequency?
  context: 'Adversaries may spoof or withhold safety measurements so that trips never fire. Maintain a
    physics/model-predictive reference of each safety-relevant signal and form the residual between predicted
    and observed values; feed it to a nonparametric CUSUM change detector to flag sustained deviation
    indicating false-data injection or a flatlined channel. Profile the failure mode explicitly: zero-variance/flatlined
    safety channels and missing periodic telemetry updates (loss of expected reporting frequency) are
    distinct alertable signals. A sustained CUSUM alarm, a flatlined channel, or missing updates each
    indicate the SIS may be operating on manipulated or stale data and thus blind to unsafe conditions;
    stable residuals and healthy reporting support data integrity.'
  answer_sources:
  - Process Historian
  - Operational Databases
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: SIS and BPCS process telemetry (sensor tags, trip setpoints, final-element/actuator status)
    from the process historian and operational databases; ICS protocol logs carrying read/write values
    to SIS I/O; alarm/event journals correlating trip assertions with actuator commands.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each safety_signal s:\n  resid = observed(s) - model_predict(s)\n  cusum = nonparametric_cusum(resid)\n\
      \  ALERT IF cusum > h  # sustained deviation / FDI\n  ALERT IF variance(s, window) == 0  # flatlined\
      \ channel\n  ALERT IF time_since_last_update(s) > expected_period"
- question: Do prediction/reconstruction models of normal safety-process telemetry produce residuals above
    threshold, and which specific sensor or actuator point is driving the anomalous safety state?
  context: Learned models of normal safety-process behavior can detect manipulation that physics references
    or invariants miss. Train prediction/reconstruction models on normal safety-process telemetry (1D-CNN,
    Seq2Seq with point localization, or one-class baseline) and alert when the residual exceeds a tuned
    threshold, identifying the specific sensor/actuator point at fault. Surface the top-3 contributing
    signals via SHAP, and keep the deterministic safety-invariant rule as the floor given the evadability
    of ML ICS detectors. A high residual localized to a safety-critical tag indicates an anomalous or
    manipulated safety state warranting immediate physical verification; low residual supports normal
    safety-process behavior.
