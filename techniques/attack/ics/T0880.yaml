name: 'T0880: Loss of Safety'
id: 171390e4-c6a8-419d-8d0e-09745c03e384
description: 'This playbook helps an analyst investigate potential Loss of Safety in an Industrial Control
  System (ICS) environment, where an adversary compromises, disables, or manipulates Safety Instrumented
  System (SIS) functions designed to drive a process to a predetermined safe state when dangerous conditions
  occur (e.g., the TRITON/HatMan attack). It addresses the core Impact-tactic question of whether an adversary
  is attempting to disable or manipulate the SIS. The investigation covers four evidence lines: (1) unauthorized
  or out-of-window SIS logic/program file transfers (e.g., .L5X, .ACD, .PRO, TriStation payloads) to safety
  controllers; (2) safety-critical ICS protocol commands (e.g., Stop CPU, write-to-safety-memory, program
  download) issued from unauthorized hosts or with unsafe parameters; (3) anomalous network behavior toward
  SIS PLCs such as connection floods, scans, protocol errors, and abnormal data volume; and (4) the physical
  safety end-state in which a trip/safe condition is asserted but the SIS fails to command the expected
  fail-safe actuation, or safety-relevant sensor channels flatline. Each line pairs a deterministic specification/allowlist
  rule (kept as the detection floor), a statistical baseline, and a machine-learning detector so an analyst
  can confirm whether SIS protective functions have been tampered with, bypassed, or rendered ineffective.'
type: technique
related:
