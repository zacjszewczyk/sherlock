- question: Does a multivariate time-series forecast of each SIS PLC's traffic volume, packet counts,
    and protocol distribution deviate beyond a 99% confidence interval for more than three consecutive
    minutes, accounting for operational seasonality?
  context: ICS traffic is highly periodic, so a learned forecast can flag subtle sustained deviations.
    Implement a multivariate time-series detector (1D-CNN/autoencoder or VAR) that forecasts expected
    traffic volume, packet counts, and protocol distribution for each SIS PLC from >=30 days of Zeek conn.log
    history, accounting for operational seasonality; alert when observed metrics deviate beyond a 99%
    confidence interval for >3 consecutive minutes (predict-then-threshold-residual design). Report the
    top-3 contributing features via SHAP, and retain the deterministic connection-rate and scan rules
    as the floor. A sustained residual breach indicates anomalous network behavior toward the safety segment
    consistent with disruption or staging; staying within the interval supports normal operation.
