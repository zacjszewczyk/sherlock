questions:
- question: Did any host issue an ICS controller logic or configuration modification command (e.g., S7comm
    'Download block' 0x1A / 'Write System Data' 0x28, Modbus 'Write Multiple Registers' 0x10, or EtherNet/IP
    'Write Tag' 0x4B) from a source that is NOT on the approved Engineering Workstation (EWS) allowlist,
    or outside a documented maintenance window?
  context: Modifying controller tasking almost always requires sending a programming/write function code
    to the controller. Per NIST SP 800-82r3, only documented EWS hosts and authorized accounts may issue
    such function codes, and only inside approved change windows. A modification command from an IP outside
    the EWS allowlist (including unexpected PLC-to-PLC traffic, as demonstrated by PLC-Blaster) or one
    that occurs outside a maintenance window is a high-fidelity indicator of unauthorized tasking changes
    under the Execution tactic. A positive result means an unsanctioned programming attempt; investigate
    the source host, the targeted block/OB, and correlate with change tickets. A negative result (authorized
    EWS, in-window) reduces but does not eliminate suspicion. On alert, enrich with conn.log (uid, duration,
    service) and the full protocol log entry.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek dnp3.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with controllers; network taps at the PCN/DMZ boundary; SPAN ports on core switches; Virtual
    LANs (VLANs) dedicated to Safety Instrumented Systems (SIS) and Basic Process Control Systems (BPCS).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "IF (s7comm.function IN ['Download block (0x1A)','Write System Data (0x28)']\n    OR modbus.func_code\
      \ == 16\n    OR enip.service == 'Write Tag (0x4B)'\n    OR dnp3 write/program function)\n  AND (src_ip\
      \ NOT IN EWS_Allowlist\n       OR event_time NOT WITHIN Approved_Maintenance_Windows)\nTHEN alert(severity=high);\
      \ enrich with conn.log uid,duration,service + full protocol entry"
- question: Are there any ICS programming or write messages on the network that violate the protocol specification
    or expected command/response sequence — for example, malformed function codes, unpaired requests/responses,
    or writes targeting a block/Organization Block (OB) outside the documented set?
  context: Adversaries can modify tasking using otherwise valid function codes, so volume- and allowlist-based
    detections alone may miss them. Applying auto-generated, protocol-grounded rules (semantic-based SCADA
    rules, Mohan et al.) that validate function code, command/response pairing, and target register/block
    ranges, and modeling each PLC<->server channel as a deterministic finite automaton (Temporal Phase
    Shifts, Kleinmann et al.), catches messages that are out-of-spec, out-of-sequence, unpaired, or that
    target undocumented blocks/OBs. A positive result indicates protocol abuse consistent with stealthy
    tasking modification; pursue by inspecting the offending session's full message sequence and the targeted
    memory blocks against the documented program structure.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek dnp3.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with controllers; network taps at the PCN/DMZ boundary; SPAN ports on core switches; Virtual
    LANs (VLANs) dedicated to Safety Instrumented Systems (SIS) and Basic Process Control Systems (BPCS).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// protocol-grounded + DFA validation\nFOR each ICS message:\n  IF func_code INVALID for protocol\n\
      \     OR request has no matching paired response\n     OR message out-of-sequence per per-channel\
      \ DFA model\n     OR target block/OB NOT IN documented_block_set\n  THEN alert('protocol/sequence\
      \ violation', session.uid, target_block)"
- question: For each unique (source IP, destination controller IP) pair, is the hourly count of modification-related
    function codes anomalously high relative to its own 90-day baseline (exceeding mean + 3 standard deviations
    with raw count > 5), or does a stateful CUSUM / Matrix Profile detector reveal a low-and-slow accumulation
    or sudden burst of program edits?
  context: A surge in programming/write commands between a specific source and a controller can indicate
    active tasking modification, including iterative program edits. Establishing a per-pair 90-day baseline
    of hourly counts and alerting when an hour exceeds mu + 3*sigma (and count > 5) flags overt spikes.
    A CUSUM test (Urbina et al., CCS 2016) accumulates small persistent increases to catch low-and-slow
    edits below the per-hour threshold, while a Matrix Profile discord detector (Duque Anton et al.) surfaces
    sudden activity bursts in the command time series. Thresholds are derived per-site from each pair's
    history to limit false positives. A positive result warrants pivoting to the specific source/controller
    pair and reviewing the underlying commands and change records.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek dnp3.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with controllers; network taps at the PCN/DMZ boundary; SPAN ports on core switches; Virtual
    LANs (VLANs) dedicated to Safety Instrumented Systems (SIS) and Basic Process Control Systems (BPCS).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// per (src_ip,dst_controller) pair, modification func codes

      baseline = hourly_counts over 90d; mu=mean; sigma=stddev

      IF hour_count > mu + 3*sigma AND hour_count > 5 THEN alert(spike)

      cusum = running_sum(max(0, count - (mu+sigma)))

      IF cusum > CUSUM_THRESHOLD THEN alert(low_and_slow)

      matrix_profile(command_series); IF discord_score high THEN alert(burst)'
- question: Is there a spike in ICS error and rejection signals — denied/blocked connections to controller
    programming ports, malformed or exception/negative-response S7comm/Modbus messages, or rejected/aborted
    block downloads — that could indicate brute-force tasking attempts or tooling mismatch?
  context: Failed and aborted programming activity is a first-class indicator, not just noise. Profiling
    ICS error signals distinctly — blocked connections to programming ports, exception/negative responses,
    and aborted block downloads — and alerting on a spike (e.g., > mu + 3*sigma over a 30-day baseline,
    or any burst of >3 in 5 minutes from one source) can reveal an adversary probing or repeatedly attempting
    tasking changes with mismatched tooling or credentials. This aligns with the low-probability/risky-transaction
    flagging of PRI-IDS (Marsden et al.) and out-of-sequence detection in Temporal Phase Shifts. A positive
    result means investigate the source host's intent and whether any attempt ultimately succeeded.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek dnp3.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with controllers; network taps at the PCN/DMZ boundary; SPAN ports on core switches; Virtual
    LANs (VLANs) dedicated to Safety Instrumented Systems (SIS) and Basic Process Control Systems (BPCS).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// distinct ICS error signals per source

      errors = blocked_conns_to_prog_ports + exception/negative_responses + aborted_block_downloads

      baseline_30d -> mu, sigma

      IF error_count > mu + 3*sigma OR count(errors from src in 5min) > 3

      THEN alert(''failed/aborted programming attempts'', src_ip)'
- question: Does a time-series anomaly model over the aggregated count of modification-related function
    codes (15-minute intervals) flag a window as anomalous with high confidence (> 0.99), accounting for
    day-of-week, hour-of-day, scan-cycle periodicity, and maintenance windows?
  context: Simple thresholds can miss context-dependent anomalies. Training a time-series anomaly model
    (1D-CNN/autoencoder per Kravchik & Shabtai; lightweight NN + frequency-domain PCA) on modification-command
    counts in 15-minute bins, with features for raw count, day-of-week, hour-of-day, scan-cycle periodicity,
    and a binary is_maintenance_window, learns the normal rhythm of legitimate programming activity. Alerting
    when a window scores anomalous with confidence > 0.99 captures subtle off-pattern tasking changes.
    Surfacing the top-3 contributing features (e.g., off-window flag, count z-score, periodicity shift)
    in the alert text enables fast triage. A positive result means review the flagged window's commands,
    sources, and targeted controllers.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek dnp3.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with controllers; network taps at the PCN/DMZ boundary; SPAN ports on core switches; Virtual
    LANs (VLANs) dedicated to Safety Instrumented Systems (SIS) and Basic Process Control Systems (BPCS).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [count, day_of_week, hour_of_day, scan_cycle_periodicity, is_maintenance_window]

      X = aggregate modification_func_codes per 15min

      model = autoencoder/1D-CNN trained on normal windows

      score = anomaly_confidence(model, X_window)

      IF score > 0.99 THEN alert(window, top3_features=[off_window, count_zscore, periodicity_shift])'
- question: Was an ICS engineering software process (e.g., TIA Portal.exe, Studio 5000.exe, ControlLogix
    Designer.exe) created on an Engineering Workstation by an unauthorized user or from a suspicious parent
    process (powershell.exe, cmd.exe, wscript.exe, rundll32.exe), and was it followed within ~60 seconds
    by a connection to a controller IP/port?
  context: Tasking modification typically requires ICS engineering software running on an EWS. A SIEM
    correlation on Windows Event ID 4688 (Process Creation) that fires when NewProcessName matches known
    ICS software AND (the user is not in the authorized-engineers group OR the parent process is in a
    blocklist) detects unsanctioned or malware-spawned use of programming tools. NIST SP 800-82r3 requires
    application allowlisting on EWS and restriction of programming to authorized accounts/windows. Correlating
    with a subsequent Event ID 5156 (WFP connection permitted) from the same PID to a controller IP/port
    within 60 seconds raises fidelity that an actual programming session followed. A positive result indicates
    a likely unauthorized engineering session; investigate the user, parent process chain, and target
    controller.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Dedicated Engineering Workstations (EWS); Active Directory Domain Controllers authenticating
    PCN users; Endpoint Detection and Response (EDR) platforms deployed on EWS hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// EID 4688 on EWS\nIF NewProcessName IN ICS_Software_List\n   AND (SubjectUserSid NOT IN\
      \ Authorized_Engineers_Group\n        OR ParentProcessName IN ['powershell.exe','cmd.exe','wscript.exe','rundll32.exe'])\n\
      THEN candidate\n  IF EID 5156 from same PID to controller_ip:port within 60s\n  THEN alert(severity=high)"
- question: For each authorized engineer, is the current ICS-software execution an unusual (user, workstation_hostname,
    hour_of_day) tuple — in the bottom 5th percentile historically, or never seen before — that is not
    explained by a pre-approved maintenance window?
  context: Even authorized engineers have stable habits regarding which workstation they use and when.
    Profiling the historical frequency of the (user, workstation, hour) tuple for ICS software execution
    (EID 4688) over 90 days lets you emit a medium-severity alert for rare tuples (bottom 5th percentile)
    and high-severity for never-before-seen tuples. This catches stolen credentials, lateral movement
    to an unusual EWS, or off-hours activity. Suppressing tuples that match pre-approved change windows
    (per NIST SP 800-82r3) avoids alerting on expected rare-but-authorized sessions. A positive result
    means verify the session against change records and confirm with the named engineer.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Dedicated Engineering Workstations (EWS); Active Directory Domain Controllers authenticating
    PCN users; Endpoint Detection and Response (EDR) platforms deployed on EWS hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// EID 4688 ICS software executions, 90d

      p = freq(user, workstation_hostname, hour_of_day) / total(user)

      IF tuple never_seen THEN alert(severity=high)

      ELSE IF p <= 5th_percentile THEN alert(severity=medium)

      SUPPRESS IF session WITHIN Approved_Maintenance_Window'
- question: Is there a burst of failed logons (EID 4625) or explicit-credential logons (EID 4648) preceding
    a successful logon (EID 4624) and ICS-software launch on an EWS, or repeated blocked WFP connections
    (EID 5157) to controller programming ports?
  context: Authentication and connection failures are first-class signals of an adversary attempting to
    gain a foothold on an EWS to modify tasking. Profiling failed logons (EID 4625), explicit-credential
    logons (EID 4648), and blocked WFP connections to controller subnets (EID 5157) as distinct rates,
    then alerting on a burst of failures immediately preceding a successful EID 4624 plus ICS-software
    launch, or repeated blocked attempts to programming ports, treats failure surges as primary indicators
    (per the FP/FN failure analysis in Kim et al.). A positive result suggests credential brute-forcing
    or unauthorized probing that may have culminated in access; investigate the source, account, and whether
    a programming session followed.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Dedicated Engineering Workstations (EWS); Active Directory Domain Controllers authenticating
    PCN users; Endpoint Detection and Response (EDR) platforms deployed on EWS hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// EWS auth & connection failures

      seq = failed_logons(EID 4625) THEN success(EID 4624) THEN ICS_software_launch

      IF burst(EID 4625) preceding seq THEN alert

      IF count(EID 5157 to controller programming ports from src) high THEN alert

      track EID 4648 explicit-credential logons as distinct signal'
- question: Does a User Behavior Analytics model (Isolation Forest / Autoencoder) flag an EWS session
    as anomalous (above the 99.5th percentile anomaly score) based on login time/type, command-line length
    and entropy, parent-child process relationships, special privileges, and connections to controller
    subnets?
  context: A holistic per-session model can detect compromised or misused EWS sessions that individual
    rules miss. Building feature vectors from login time/type (EID 4624), command-line length and entropy
    (EID 4688), parent-child process relationships, special privileges (EID 4672), and count of connections
    to controller subnets (EID 5156 / Zeek conn.log), then scoring with an Isolation Forest or Autoencoder,
    flags sessions above the 99.5th percentile. Following Ha et al. (LSTM-VAE + SHAP), each alert should
    carry the top-3 contributing features (e.g., off-hours login, high command-line entropy, anomalous
    parent process) rather than a bare score, enabling rapid triage. A positive result means review the
    full session and confirm legitimacy of the engineering activity.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Dedicated Engineering Workstations (EWS); Active Directory Domain Controllers authenticating
    PCN users; Endpoint Detection and Response (EDR) platforms deployed on EWS hosts.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// per EWS session feature vector\nfv = [login_time/type(4624), cmdline_len, cmdline_entropy(4688),\n\
      \      parent_child_rel, special_privs(4672), conn_count_to_controllers(5156/conn.log)]\nscore =\
      \ IsolationForest_or_Autoencoder(fv)\nIF score > 99.5th_percentile\nTHEN alert(session, top3_features\
      \ via SHAP)"
- question: When critical controllers are periodically polled and their tasking configuration/program
    blocks (including task-to-OB associations such as OB1) hashed with SHA-256, does any block's hash
    mismatch the known-good 'golden image' in the secure repository?
  context: Hash verification against an authoritative baseline is the most direct way to confirm a controller's
    running tasking has been altered. Periodically (e.g., every 4 hours) polling controllers to retrieve
    program/task blocks, computing SHA-256, and comparing against a golden image in a secure repository
    detects block/OB modification such as the cyclic-execution insertion demonstrated by PLC-Blaster,
    and aligns with NIST SP 800-82r3 configuration-change monitoring. A critical alert on mismatch should
    include controller IP, timestamp, expected vs. actual hash, and the changed block/OB. A positive result
    is strong evidence of unauthorized tasking change; correlate with change tickets and network programming
    activity to determine source and time of modification.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Controller configuration backups / 'golden image' repository
  - Controller internal logs
  - 'NAI: Directly on Programmable Logic Controllers (PLCs) and Distributed Control Systems (DCS); Secure
    baseline repository or Configuration Management Database (CMDB) storing controller golden images;
    Network segments carrying configuration traffic between EWS and controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// every 4h poll critical controllers\nFOR controller in critical_controllers:\n  blocks =\
      \ retrieve_task_program_blocks(controller)  // incl. OB1 task associations\n  FOR block in blocks:\n\
      \    IF sha256(block) != golden_image[controller][block].hash\n    THEN alert(critical, controller_ip,\
      \ ts, expected_hash, actual_hash, changed_block/OB)"
- question: Has any process-state invariant been violated — a deterministic predicate linking commanded
    setpoints/task schedules to observed sensor/actuator state — indicating an actuator state inconsistent
    with the commanded value or a scan-cycle interval outside specification?
  context: A tasking change that alters execution order, priority, or frequency manifests physically as
    a broken invariant even if the network command looked valid. Mining and enforcing invariants (Feng
    et al., NDSS 2019) — deterministic predicates tying commanded values and task schedules to observed
    process state — lets you alert when, for example, an actuator state is inconsistent with the commanded
    value or a scan-cycle interval falls outside spec. Reporting the specific violated invariant gives
    explainability for triage. A positive result indicates the controller is behaving inconsistently with
    its expected program, which is a strong signal of altered tasking; investigate the corresponding controller
    and recent programming events.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Controller configuration backups / 'golden image' repository
  - Controller internal logs
  - 'NAI: Directly on Programmable Logic Controllers (PLCs) and Distributed Control Systems (DCS); Secure
    baseline repository or Configuration Management Database (CMDB) storing controller golden images;
    Network segments carrying configuration traffic between EWS and controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// enforce mined invariants\nFOR invariant in mined_invariants(setpoint/schedule -> sensor/actuator\
      \ state):\n  IF NOT invariant.holds(current_state)\n  THEN alert('invariant violated', invariant.id,\n\
      \             e.g. actuator_state != commanded_value OR scan_interval OUT_OF_SPEC)"
- question: For each controller, does an hour's count or Shannon entropy of configuration write commands
    exceed the 98th percentile of its 30-day baseline, or does a CUSUM / DFA timing check reveal slow
    sub-threshold change activity or abnormal write-command rhythm?
  context: Configuration write activity has a characteristic volume and diversity per controller. Baselining
    the 30-day hourly count and Shannon entropy of configuration write commands in Zeek logs, then alerting
    when an hour exceeds the 98th percentile for count OR entropy, catches both volume spikes and unusually
    varied command mixes. Adding a CUSUM test (Urbina et al.) accumulates slow, sub-threshold change activity,
    and DFA/phase timing checks (Temporal Phase Shifts) catch abnormal write-command rhythm. Surfacing
    raw count, entropy, and z-scores in the alert aids triage. A positive result means inspect the offending
    controller's write commands, the targeted blocks, and the source host.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Controller configuration backups / 'golden image' repository
  - Controller internal logs
  - 'NAI: Directly on Programmable Logic Controllers (PLCs) and Distributed Control Systems (DCS); Secure
    baseline repository or Configuration Management Database (CMDB) storing controller golden images;
    Network segments carrying configuration traffic between EWS and controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// per controller config write commands

      baseline_30d: hourly count + shannon_entropy

      IF hour_count > p98(count) OR hour_entropy > p98(entropy) THEN alert

      cusum += max(0, count - threshold); IF cusum > C THEN alert(slow_change)

      DFA_phase_timing(write_intervals); IF rhythm abnormal THEN alert

      report raw_count, entropy, z_scores'
- question: Does a supervised Random Forest classifier label any observed configuration change as 'Malicious'
    based on features such as source IP, user, change command type, controller ID, size of data block
    written, target memory address/block/OB, time-of-day, day-of-week, and whether a change ticket is
    open?
  context: When labeled history exists, a supervised classifier can distinguish benign from malicious
    configuration changes with interpretable feature importances. Training a Random Forest on features
    including source IP, user (if available), change command type/code, controller ID, size of data block
    written, target memory address/block/OB number, time-of-day, day-of-week, and a binary is_change_ticket_open
    lets you flag changes that resemble known-malicious patterns. Duque Anton et al. show RF on Modbus/OPC-UA
    flow features yields high accuracy with interpretable per-feature importance. Emitting the top-3 feature
    importances driving each 'Malicious' verdict aids analyst triage. A positive result means review the
    change against authorized work and the contributing features.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Controller configuration backups / 'golden image' repository
  - Controller internal logs
  - 'NAI: Directly on Programmable Logic Controllers (PLCs) and Distributed Control Systems (DCS); Secure
    baseline repository or Configuration Management Database (CMDB) storing controller golden images;
    Network segments carrying configuration traffic between EWS and controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// supervised classifier\nfeatures = [src_ip, user, change_cmd_type, controller_id, data_block_size,\n\
      \           target_addr/block/OB, hour_of_day, day_of_week, is_change_ticket_open]\nlabel = RandomForest.predict(features)\n\
      IF label == 'Malicious'\nTHEN alert(change, top3_feature_importances)"
- question: After a programming event, does an unsupervised process-telemetry predictor (1D-CNN/autoencoder
    or seq2seq) produce a reconstruction/prediction error exceeding a tuned percentile, indicating the
    physical consequences of altered tasking even when the network change itself looked authorized?
  context: Some tasking modifications use authorized-looking commands but change how the process physically
    behaves. Training an unsupervised predictor on normal process telemetry (1D-CNN/autoencoder per Kravchik
    & Shabtai; seq2seq with point localization per Kim et al.) and alerting when reconstruction/prediction
    error exceeds a tuned percentile after a programming event catches these physical consequences. Using
    SHAP attribution (Ha et al.) to report the top-3 deviating measurement points makes the alert actionable.
    A positive result means the process is deviating from its learned normal following a programming change;
    correlate the deviation with the recent programming event and verify whether the change was authorized.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Controller configuration backups / 'golden image' repository
  - Controller internal logs
  - 'NAI: Directly on Programmable Logic Controllers (PLCs) and Distributed Control Systems (DCS); Secure
    baseline repository or Configuration Management Database (CMDB) storing controller golden images;
    Network segments carrying configuration traffic between EWS and controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '// unsupervised process telemetry predictor

      model = train_1DCNN_autoencoder/seq2seq on normal_telemetry

      err = reconstruction_error(model, telemetry_after_programming_event)

      IF err > tuned_percentile

      THEN alert(top3_deviating_points via SHAP, correlate with recent programming event)'
