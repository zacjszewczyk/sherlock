name: 'T0821: Modify Controller Tasking'
id: e19624c5-af3d-4dec-8b3b-b16b20b46306
description: 'Investigate suspected modification of an ICS controller''s tasking, where an adversary alters
  or creates task-to-Program-Organization-Unit associations (e.g., adding code to Siemens OB1) to change
  a controller''s execution flow, priority, or frequency and run unauthorized logic. This playbook helps
  an analyst detect and triage: (1) controller logic/configuration modification commands on the network
  (S7comm Download/Write block, Modbus Write Multiple Registers, EtherNet/IP Write Tag) originating from
  non-Engineering-Workstation sources or outside approved maintenance windows, including protocol-specification
  and sequence violations; (2) suspicious launches of ICS engineering software on Engineering Workstations
  (EWS) by unauthorized users, from anomalous parent processes, or at unusual times, followed by connections
  to controllers; and (3) discrepancies between a controller''s running task configuration and its authoritative
  golden image, plus anomalous volume, entropy, or sequence of configuration write commands and the physical-process
  consequences of altered tasking. It combines symbolic-logic detections, statistical baselining, and
  machine-learning anomaly models across network (Zeek), endpoint (Windows Event Logs), and controller/configuration-management
  sources.'
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
