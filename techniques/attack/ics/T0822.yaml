- question: '[Initial Access] Failed-login rate and entropy spikes: For each remote-access gateway, using
    a 30-day baseline of failed-login rate per minute (4625), can you detect when the current rate exceeds
    the 99th percentile, catch slow campaigns with a stateful CUSUM/change-point test, flag per-10-minute
    Shannon entropy of Target_User_Names per Source_Network_Address exceeding 3 standard deviations above
    the mean (password spraying), and distinguish user enumeration from credential guessing via the ratio
    of ''user not found'' (0xC0000064) to ''bad password'' (0xC000006A) status codes?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), credential attacks against external
    remote services range from noisy bursts to deliberately slow, low-and-slow campaigns designed to evade
    fixed thresholds. This statistical approach establishes, for each remote-access gateway, a 30-day
    baseline of failed-login rate per minute (4625) and alerts when the current rate exceeds the 99th
    percentile; for slow campaigns it applies a stateful CUSUM test (per Urbina et al.) and change-point
    detection (per Aminikhanghahi and Cook) so small persistent failure accumulations are caught. Per
    10-minute window it computes the Shannon entropy of Target_User_Names per Source_Network_Address --
    high entropy indicates many distinct accounts (password spraying) -- and alerts when an IP''s entropy
    exceeds the mean by more than 3 standard deviations. It also explicitly profiles failure status codes
    as a distinct signal: a high ratio of ''user not found'' (0xC0000064) to ''bad password'' (0xC000006A)
    indicates user enumeration rather than credential guessing. A positive result reveals abnormal credential-attack
    pressure or reconnaissance against the remote-access surface even when individual thresholds are not
    tripped; a negative result helps rule out sustained guessing but should be corroborated with the deterministic
    and ML methods.'
