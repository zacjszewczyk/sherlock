- question: '[Initial Access] DBSCAN clustering for attack-source grouping: Using density-based clustering
    (DBSCAN) on 4625 events aggregated hourly with per-source feature vectors (log10 total failed logins,
    unique target users, ratio of bad-password 0xC000006A to user-not-found 0xC0000064 failures, and standard
    deviation of inter-attempt timestamps), can you automatically group and label attacking sources as
    ''Password Spraying'' (high unique-user clusters) or ''Brute Force'' (high-failure/low-user clusters),
    and additionally catch low-and-slow sprays distributed across many source IPs via cross-IP clustering?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), sophisticated actors distribute
    credential attacks across many source IPs and pace them to evade per-source thresholds, so unsupervised
    grouping adds coverage the deterministic rules lack. Apply DBSCAN on 4625 events aggregated hourly
    with per-source feature vectors: log10 total failed logins, unique target users, ratio of bad-password
    (0xC000006A) to user-not-found (0xC0000064) failures, and standard deviation of inter-attempt timestamps.
    Clusters with high unique-user counts are auto-labeled ''Password Spraying''; high-failure/low-user
    clusters are labeled ''Brute Force''. For low-and-slow sprays distributed across many source IPs that
    evade per-source thresholds, add the cross-IP clustering approach of Microsoft Sentinel. Each cluster
    alert must list the dominant features (unique-user count, failure-code ratio, timing) driving the
    label so an analyst can validate it. Per Kus et al., run this in parallel with -- never replacing
    -- the deterministic thresholds above. A meaningful cluster indicates coordinated credential-attack
    behavior against the remote-access surface; absence of clusters complements but does not replace the
    threshold and statistical findings.'
