name: 'T0822: External Remote Services'
id: ecc1ac46-9085-4311-9b09-48cae8719509
description: 'This playbook helps an analyst investigate whether an adversary is leveraging external remote
  services (MITRE ATT&CK for ICS T0822, External Remote Services) -- such as VPNs, Citrix, remote access
  gateways, and jump boxes -- to gain initial access into an industrial control system (ICS) environment.
  These services let vendors, engineers, and support staff reach control-system networks from outside
  the perimeter, and their compromise gives an attacker a direct foothold that bridges the corporate (Purdue
  Level 4) and OT (Levels 3/3.5) zones. The hunt pursues the behavior from several complementary angles:
  anomalous successful remote logins (Windows Event ID 4624, Logon Type 3/10) exhibiting new source IP/ASN/country,
  off-hours timing, or new user-agent for the account; high-volume credential-guessing against ICS-facing
  authentication services (Windows Event ID 4625 brute force and password spraying), distinguished by
  failure status codes and per-source entropy; and anomalous post-access session behavior after a successful
  login, including connections to restricted ICS assets, use of dangerous ICS protocol function codes
  (Modbus writes, DNP3 DIRECT_OPERATE), suspicious process creation (Event ID 4688), sensitive file-share
  access (Event ID 5145), and abnormal data volumes. Detection methods combine deterministic symbolic-logic
  rules (remote-access allowlists, RBAC and geo/IP policy enforcement, threat-intel matching, brute/spray
  thresholds, restricted-function-code and high-risk-process correlation), statistical baselining (per-user
  90-day source/time/user-agent risk scoring with CUSUM/PELT change-point detection, failed-login rate
  and Shannon-entropy spikes, role-based session-behavior percentiles), and machine learning (interpretable
  supervised classifiers with SHAP attribution, DBSCAN clustering of attack sources, and autoencoder/LSTM
  sessionized-activity anomaly detection), applied across Windows Security and process-creation events
  and Zeek conn/http/dns/files/modbus/dnp3 logs, so the analyst can corroborate suspected external-remote-service
  abuse against host, user, network, protocol, and volume context. Per the cited research, ML detectors
  are always run in parallel with -- never replacing -- the deterministic and statistical rules.'
type: technique
