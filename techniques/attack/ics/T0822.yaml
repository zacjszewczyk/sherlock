- question: '[Initial Access] High-risk actions after a remote login: Correlating a successful remote
    login (Windows Event ID 4624) with subsequent session activity, can you determine whether the session
    (a) connects to a critical ICS asset (PLC, SIS controller) not on the user''s RBAC list, (b) issues
    restricted ICS protocol function codes (e.g., Modbus write/function codes >16, DNP3 DIRECT_OPERATE)
    per validated protocol-semantic rules, (c) spawns a known hacking tool, network scanner, or encoded
    scripting interpreter (e.g., powershell.exe -enc, Event ID 4688) on a jump box/EWS, or (d) accesses
    sensitive engineering project files (Event ID 5145) using a non-engineering account?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), once an adversary establishes
    a foothold via an external remote service the next observable actions are reaching into the OT network
    and acting on control-system assets. How to pursue it: correlate a successful remote login (4624)
    with subsequent session activity and generate a CRITICAL alert if -- (a) a connection is made to a
    critical ICS asset (PLC, SIS controller) not on the user''s RBAC list (RBAC/least-privilege per NIST
    SP 800-82r3); (b) Zeek logs show restricted ICS protocol function codes (e.g., Modbus write / function
    codes >16, DNP3 DIRECT_OPERATE) validated against protocol-semantic rule sets (valid function codes,
    command/response pairing, addressing) per Mohan et al.; (c) a new process (4688) for a known hacking
    tool, network scanner, or encoded scripting interpreter (e.g., powershell.exe -enc) appears on a jump
    box/EWS, matching SigmaHQ signatures; or (d) file-share logging (5145) shows access to sensitive engineering
    project files by a non-engineering account. A positive result indicates the remote session is being
    used to act against ICS assets and is a high-confidence sign of active intrusion; a negative result
    lowers but does not eliminate the chance of stealthy hands-on-keyboard activity, addressed by the
    statistical and ML questions.'
