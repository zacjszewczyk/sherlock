- question: '[Initial Access] Supervised classifier for malicious remote logins: Using a supervised classifier
    (Random Forest or Gradient Boosting) trained on labeled historical 4624 logins with interpretable
    features (cyclical sin/cos transforms of logon hour and day-of-week, one-hot source country, source-ASN
    risk score, boolean new-source-to-user, boolean new-user-agent, boolean first-time source-to-asset
    edge, and user role/privilege), can you score each remote login''s probability of being malicious,
    flag scores above 0.9, and surface the top-3 contributing features so an analyst can validate the
    verdict?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), adversaries reusing valid accounts
    over external remote services can blend many weak signals that a single threshold misses but a learned
    model can combine. Train a supervised classifier (Random Forest or Gradient Boosting, chosen for interpretable
    feature importance per Duque Anton et al.) on labeled historical 4624 logins using features: cyclical
    sin/cos transforms of logon hour and day-of-week, one-hot source country, source-ASN risk score, boolean
    new-source-to-user, boolean new-user-agent, boolean first-time source-to-asset edge, and user role/privilege.
    The model outputs a probability (0-1); flag scores >0.9 for immediate review. Crucially, each alert
    MUST surface the top-3 contributing features (via the model''s feature importance or SHAP attribution
    as in Ha et al.), not just the score, so the analyst can corroborate. Per Kus et al., run this model
    strictly in parallel with -- never replacing -- the deterministic allowlist and statistical-threshold
    rules above, and re-validate it against novel attack patterns, since ML detection rates collapse on
    unseen behavior. A high-probability, explainable alert is a strong lead for credentialed remote-service
    abuse; consistently low scores complement (but do not substitute for) the rule- and statistics-based
    findings.'
