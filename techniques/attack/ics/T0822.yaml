- question: '[Initial Access] Brute-force or password-spray thresholds: Can you determine whether a single
    Source_Network_Address is generating credential-guessing activity (Windows Event ID 4625) against
    an ICS remote-access service -- specifically more than 10 failed logins against a single Target_User_Name
    within any 60-second sub-window (Status 0xC000006D, Sub_Status 0xC000006A bad password) for brute
    force, or failed logins against more than 15 distinct Target_User_Name accounts within a 10-minute
    window for password spraying -- and does a successful 4624 follow the failure burst from the same
    source?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), adversaries frequently attempt
    to obtain valid accounts for an external remote service by brute forcing a single account or spraying
    a common password across many accounts before logging in. How to pursue it: create a SIEM rule on
    Windows Event ID 4625 where the target is an ICS remote-access service, aggregating by Source_Network_Address
    over a 10-minute sliding window, following the deterministic thresholds documented by Splunk Threat
    Research and portable SigmaHQ rules. Generate a HIGH alert when (a) Brute Force: count of failed events
    for a single Target_User_Name exceeds 10 within any 60-second sub-window (Status 0xC000006D, Sub_Status
    0xC000006A bad password); or (b) Password Spray: distinct Target_User_Name count exceeds 15 within
    the 10-minute window. Escalate priority if the targeted accounts are privileged ICS roles, or if a
    successful 4624 follows the failure burst from the same source (the failure-then-success state transition
    that indicates a likely compromise). A positive result indicates active credential-guessing against
    the remote-access surface and, if followed by success, a probable foothold; a negative result lowers
    but does not eliminate the possibility of slow or distributed guessing, addressed by the statistical
    and ML questions.'
