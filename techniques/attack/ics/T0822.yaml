questions:
- question: '[Initial Access] Remote login from a risky source: For each successful remote login (Windows
    Event ID 4624, Logon Type 3 Network or 10 RemoteInteractive) to a critical ICS-facing remote-access
    asset, can you determine whether the login originated from a source IP/ASN that is not on the authorized
    remote-access allowlist, bypasses the DMZ/jump-host path, violates the user''s geographic/IP-based
    RBAC policy, comes from a country or ASN never seen for a privileged account in the last 90 days,
    or matches a known-malicious threat-intel list?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), an adversary abuses external remote
    services (VPNs, Citrix, remote access gateways, jump boxes) to obtain an initial foothold in the ICS
    environment, typically using valid but stolen credentials. This evidence focuses on a successful interactive
    or network remote login to an ICS-facing service that carries risky-source characteristics. How to
    pursue it: correlate each 4624 Source_Network_Address with Zeek conn.log and a GeoIP database to enrich
    country/ASN, then apply deterministic rules -- (1) enforce the remote-access allowlist mandated by
    NSA/CISA AA20-205A and NIST SP 800-82r3, raising a CRITICAL alert on any logon from an IP/ASN not
    on the authorized list or that bypasses the required DMZ/jump-host path; (2) alert when the login
    violates the user role''s geographic/IP-based RBAC policy; (3) for privileged accounts, alert on any
    successful login from a country or ASN not seen for that user in the past 90 days, and on first-time
    source-IP-to-asset edges (new-source logon, impossible travel) using portable SigmaHQ-style signatures;
    (4) alert if the source IP appears on a known-malicious threat-intel list. A positive result strongly
    suggests adversary use of valid accounts over an external remote service and warrants immediate scoping
    of the session, the account, and the reachable OT assets; a negative result reduces but does not eliminate
    this vector, so corroborate with the statistical and ML questions below.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: ICS Network Demarcation Zone (DMZ), VPN Concentrators, Remote Access Gateways, Jump Boxes, Engineering
    Workstations (EWS), Human-Machine Interfaces (HMIs), Authentication Servers within the ICS DMZ, Network
    traffic flows between Purdue Model Level 4 (Corporate) and Level 3 (Site Operations)'
  range: Last 90 days (evaluate each login against the user's 90-day history)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Remote login from risky source (Symbolic Logic)

      source IN [Windows Event ID 4624, Zeek conn.log, Zeek http.log]

      | filter destinations IN External-Remote-Service NAIs

      | approach: For each successful remote login (4624, Logon Type 3/10) to a critical ICS-facing asset:
      enrich source IP with Zeek conn.log + GeoIP; CRITICAL alert if IP/ASN not on remote-access allowlist
      or bypasses DMZ/jump-host; alert on geographic/IP RBAC violation; for privileged accounts alert
      on new country/ASN (90d) and first-time source->asset edge (impossible travel); alert if source
      IP on threat-intel list

      | correlate over NAI: ICS Network Demarcation Zone (DMZ), VPN Concentrators, Remote Access Gateways,
      Jump Boxes, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Authentication Servers
      within the ICS DMZ, Network traffic flows between Purdue Model Level 4 (Corporate) and Level 3 (Site
      Operations)

      | emit alert with contributing fields and entity context (src_ip, asn, country, user, host, logon_type,
      status_code, function_code, resp_bytes)'
  - technology: Windows/Zeek pseudocode
    query: '# Remote login from risky source -- Windows/Zeek implementation

      event 4624/4625/4688/5145 OR zeek.conn/http/dns/files/modbus/dnp3

      | where target in ics_remote_access_assets

      | apply symbolic logic logic: For each successful remote login (4624, Logon Type 3/10) to a critical
      ICS-facing asset: enrich source IP with Zeek conn.log + GeoIP; CRITICAL alert if IP/ASN not on remote-access
      allowlist or bypasses DMZ/jump-host; alert on geographic/IP RBAC violation; for privileged accounts
      alert on new country/ASN (90d) and first-time source->asset edge (impossible travel); alert if source
      IP on threat-intel list

      | output src_ip, user, logon_type, status, asn, country, function_code, uid'
- question: '[Initial Access] Risk score for anomalous remote logins: Using a 90-day rolling per-user
    baseline of remote-access behavior (source countries/ASNs, login-time distribution by hour-of-day
    and day-of-week, known user-agents, and per-asset source-IP edges), can you compute an additive risk
    score for each new login (+20 new country, +15 new ASN, +10 login time outside the user''s 5th-95th
    percentile for that day, +5 new user-agent, +15 first-time source-to-asset edge) and raise a HIGH
    alert when the cumulative score exceeds a tuned threshold, while also catching gradual drift in each
    user''s new-source rate?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), an attacker using stolen credentials
    over an external remote service often deviates subtly from the legitimate user''s habitual access
    pattern rather than tripping a single hard rule. This statistical approach builds, for each user,
    a 90-day rolling baseline of (a) historically observed source countries and ASNs, (b) login-time distribution
    by hour-of-day and day-of-week, (c) known user-agent strings, and (d) per-asset source-IP edges, deriving
    dataset-specific percentile cutoffs from reference data such as the LANL Unified Host and Network
    Data Set. For each new login it computes an additive risk score (+20 new country, +15 new ASN, +10
    off-percentile time, +5 new user-agent, +15 first-time source-to-asset edge) and raises a HIGH alert
    above a tuned threshold (default 25). To catch low-and-slow campaigns it complements the score with
    change-point monitoring (CUSUM/PELT) of each user''s new-source rate to detect gradual drift. Every
    alert must list the specific contributing terms (e.g., ''new country=RU +20, off-hours +10'') so an
    analyst can judge it quickly. A high score indicates a login that is anomalous for that specific account
    and should be triaged; a low score across all logins supports ruling out covert credentialed access
    via the remote service.'
