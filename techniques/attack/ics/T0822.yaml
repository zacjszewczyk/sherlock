- question: '[Initial Access] Session behavior exceeding role baselines: For each user role (Operator,
    Engineer, Technician), using a 30-day baseline over a 1-hour session window (99th-percentile unique
    internal hosts contacted, 99th-percentile total session data volume orig_bytes+resp_bytes, common
    protocols/destination ports, and 99th-percentile file-access 5145 events), can you raise a HIGH alert
    when a live session exceeds two or more 99th-percentile thresholds, score the rarity of the post-access
    path (credential switching plus never-before-used hosts), and profile connection-state failures (Zeek
    REJ/RSTO, blocked firewall conns) as a distinct scanning signal?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), an adversary operating through
    a compromised remote session typically touches more hosts, moves more data, or uses different protocols
    than the legitimate role would. This approach builds, for each user role (Operator, Engineer, Technician),
    a 30-day baseline over a 1-hour session window: (a) 99th percentile of unique internal hosts contacted
    (frequency), (b) 99th percentile of total session data volume orig_bytes+resp_bytes (volume), (c)
    common protocols/destination ports, and (d) 99th percentile of file-access (5145) events, deriving
    percentiles from reference distributions such as the LANL Unified Host and Network Data Set. It raises
    a HIGH alert when a live session exceeds two or more of these 99th-percentile thresholds. It additionally
    scores the rarity of the post-access login path (credential switching plus access to never-before-used
    hosts) using the causality+rarity inference of Hopper, and profiles connection-state failures (Zeek
    REJ/RSTO, blocked firewall connections) as a distinct scanning/reconnaissance signal. A positive result
    indicates the session behaves unlike its role and warrants investigation as possible lateral movement
    or discovery from the remote foothold; a negative result helps rule out gross deviation but should
    be corroborated with the deterministic and ML methods.'
