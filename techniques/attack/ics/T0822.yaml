- question: '[Initial Access] Autoencoder on sessionized post-login activity: Training an unsupervised
    autoencoder on sessionized known-good activity (all Zeek + Windows events linked to a user within
    4 hours of login) with a feature vector of total data volume, count of unique destination IPs, entropy
    of destination ports, counts of connection states (SF, REJ, RSTO), process-creation count, file-access
    count, and a binary vector of observed ICS protocols, can you flag sessions with high reconstruction
    error, augment with an online ensemble-of-autoencoders at the IT/OT boundary and an LSTM over log-event
    sequences, and surface the top-3 features driving each anomaly via SHAP?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), novel adversary tradecraft through
    a remote foothold may not match any rule or fixed percentile, so an unsupervised model of ''normal''
    sessions adds coverage for the unknown. Train an autoencoder on sessionized known-good activity (all
    Zeek + Windows events linked to a user within 4 hours of login) using the feature vector: total data
    volume, count of unique destination IPs, entropy of destination ports, counts of connection states
    (SF, REJ, RSTO), process-creation count, file-access count, and a binary vector of observed ICS protocols.
    Flag high reconstruction error; for online flow scoring at the IT/OT boundary use an ensemble-of-autoencoders
    approach such as Kitsune, and model authentication/session log-event sequences with an LSTM as in
    DeepLog to catch out-of-sequence surges. Every anomaly alert MUST surface the top-3 features driving
    the reconstruction error via SHAP attribution (Ha et al.). Per Kus et al., run this in parallel with
    the deterministic and statistical detectors and re-test against novel attacks, since ML alone degrades
    sharply on unseen behavior. A high-reconstruction-error, explainable alert is a strong lead for anomalous
    use of a remote session; low error complements but does not replace the rule- and statistics-based
    findings.'
