name: 'T0843.003: Program Append'
id: 57e9bbcf-7b3e-4505-b200-c6db4d74d74f
description: Investigate whether an adversary has used lateral movement to append new logic blocks or
  rungs to an existing PLC program, introducing malicious routines while preserving the controller's original
  functionality. A program append updates only parts of an existing program and may not require stopping
  the PLC, letting it keep running during transfer and reconfiguration so the adversary minimizes downtime
  and evades detection. This playbook helps an analyst detect additive program changes where the program
  footprint grows and the change appears as a new block, rung, or checksum delta rather than a full overwrite.
  It layers a deterministic floor (authorized-source/account/maintenance-window allowlists and checksum/block-inventory
  baselines) with statistical baselining of program size, append velocity, and protocol-transaction probability,
  and machine learning that classifies or clusters programming sessions and models engineering event sequences.
  The ability to append to a PLC typically relies on access to an engineering workstation with vendor-specific
  PLC programming software, so host, network, and PLC diagnostic telemetry are correlated to confirm whether
  any append followed an approved engineering task.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a PLC program-append or logic-download operation occur on the network, and can the originating
    host and account be confirmed as part of an approved, scheduled engineering task rather than unauthorized
    lateral movement?
  context: An append introduces new logic objects, blocks, or rungs into a running controller using vendor
    automation protocols. Inspect network traffic for protocol operations that create or add logic (e.g.,
    S7Comm/S7CommPlus download function codes on TCP/102, Modbus or DNP3 program/config write verbs) and
    correlate them with engineering workstation project history and Windows process-creation (EID 4688)
    plus logon (EID 4624) events to confirm the append followed an approved engineering task. Because
    legitimate engineering changes are rare and scheduled, alert deterministically when the write originates
    from a host or account not on the engineering allowlist, or outside an approved maintenance window.
    A positive result (off-allowlist source, off-hours, no matching project activity) is a high-confidence
    indicator of malicious logic injection during lateral movement; a clean correlation to an authorized
    task lowers concern.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'append_writes = traffic where proto in [''s7comm'',''s7commplus'',''modbus'',''dnp3''] and
      func in [download_block, program_write, config_write];

      for w in append_writes: if w.src_host not in eng_allowlist or w.account not in eng_accounts or w.ts
      not in maintenance_window: alert(w)'
  - technology: SIEM correlation pseudocode
    query: 'net_append = zeek_appends;

      host = process_events(EID=4688) join logon(EID=4624) on host,user where ts near net_append.ts;

      proj = ews_project_history near net_append.ts;

      alert when not (host and proj and src on eng_allowlist and within maintenance_window)'
- question: After a programming session, does the PLC's block inventory and per-block checksums show new
    blocks or rungs appended while the existing logic remains intact, and does any such additive change
    lack a matching change ticket or maintenance record?
  context: An append is an additive delta, not a full overwrite, so existing logic stays in place while
    new blocks or rungs are added. Compare the controller's post-session block inventory and per-block
    checksums against a per-controller golden baseline to identify additive changes. Flag any change that
    has no corresponding maintenance record or change ticket. Maintain this signed baseline as the low-false-positive
    deterministic floor because engineering operations are infrequent and planned; keep it in place even
    when ML detectors are deployed, since reconstruction-based anomaly detectors are evadable by constrained-concealment
    attacks. A new checksum/block with no authorized record strongly indicates covert program append;
    a fully reconciled inventory indicates expected maintenance.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "post = plc_block_inventory_after_session(controller);\ndelta = diff(post.blocks_and_checksums,\
      \ golden_baseline[controller]);\nif delta.added and not delta.removed_or_modified_existing:  # additive\
      \ only\n  if no change_ticket match delta: alert('covert program append', controller, delta.new_blocks)"
- question: Are there aborted or partially-completed program downloads/appends, repeated authentication
    failures to the PLC programming port, unexpected RUN/STOP/PROGRAM mode transitions, or protocol command/response
    pairs that violate protocol semantics?
  context: Treat the success/fail state of program operations as a distinct signal. Alert on aborted or
    partially-completed downloads or appends, repeated authentication failures to the PLC programming
    port, unexpected RUN/STOP/PROGRAM mode transitions in PLC diagnostic logs, and command/response pairs
    that violate protocol semantics (a write with no valid response, or responses to commands that were
    never issued). Failed or aborted appends frequently precede a successful malicious one, so they provide
    early warning of an adversary probing or refining their injection during lateral movement. A cluster
    of failures or anomalous mode changes around an off-hours session warrants escalation; clean, well-formed
    sessions during a maintenance window are lower risk.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert if plc_diag.op_state in [''abort'',''partial''] for program_download/append;

      alert if count(auth_fail to PLC_prog_port within 10m) >= threshold;

      alert if mode_transition in [''RUN->PROGRAM'',''RUN->STOP''] unexpected;

      alert if protocol_pair where write has no valid response OR response without matching command'
- question: Has a PLC's program size in bytes, block/rung count, or occupied memory grown beyond its historical
    norm in a way consistent with repeated appends rather than a routine revision cycle?
  context: Establish per-PLC baselines for program size (bytes), block/rung count, and occupied memory
    over time, then use percentile thresholds (e.g., flag growth above the 99th percentile of historical
    per-session deltas) and z-scores to identify unexpected additive growth. Capture Volume explicitly
    (bytes and blocks added), not just how often changes occur, because an append's signature is the incremental
    increase in footprint. Derive dataset-specific thresholds from site history or public ICS datasets
    (SWaT, WADI, HAI, Electra, Morris). Sustained or anomalous growth that does not align with a scheduled
    revision points to covert appended logic accumulating in the controller; normal small deltas within
    a planned cycle are benign.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 180 days to establish stable per-PLC size/footprint baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_plc_history(program_bytes, block_count, mem_used);\nsession_delta = current\
      \ - prev;\nif session_delta.bytes > p99(baseline.session_deltas) or zscore(session_delta.blocks)\
      \ > 3:\n  alert('anomalous additive growth', controller, volume=session_delta.bytes)"
- question: Is the rate at which new blocks or rungs are added, or the timing of program operations, anomalous
    relative to the controller's normally periodic engineering cadence?
  context: Measure how quickly new blocks or rungs are added over a rolling maintenance window (count/min
    and appends/window), and model the normally periodic PLC-server traffic with a deterministic finite
    automaton plus phase-shift detection. Non-periodic append verbs, bursts of incremental changes exceeding
    the normal engineering cadence, and abnormal inter-arrival timing surface as model violations. Because
    OT traffic and engineering activity are highly periodic, deviations in append velocity and timing
    are reliable indicators that an adversary is injecting logic outside the expected workflow during
    lateral movement. Activity that matches the established periodic model is expected; bursts or off-phase
    appends should be escalated.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 90 days, with rolling per-maintenance-window correlation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "rate = count(append_verbs)/window;\ndfa = build_periodic_model(plc_server_traffic);\nif rate\
      \ > normal_cadence or phase_shift(dfa, observed) or interarrival anomalous:\n  alert('append velocity/timing\
      \ anomaly', controller)"
- question: Do specific program/write transactions to a controller represent low-probability function
    codes, register/address targets, or parameter values relative to that controller's learned normal
    distribution?
  context: Build a probabilistic model of normal function-code, register/address, and parameter-value
    distributions per controller and score each program/write transaction; append write verbs and atypical
    parameter distributions appear as low-probability or risky transactions. Combine this with reconstruction-error
    thresholds (a percentile of benign error) on process telemetry to catch the physical effect of an
    appended routine even if the network operation is subtle. A transaction that is improbable under the
    learned model, especially paired with elevated process reconstruction error, signals an anomalous
    program change; transactions well within the normal distribution are routine.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 90 days for distribution modeling, event-centered on each transaction.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'model = prob_dist(func_code, register_addr, param_value | controller);

      score = -log P(transaction | model);

      recon_err = reconstruction_error(process_telemetry);

      if score > risk_threshold or recon_err > p99(benign_error): alert(transaction, score)'
- question: When programming sessions are clustered by their behavioral features, do any sessions stand
    out as originating from unusual engineering workstations, accounts, or network segments?
  context: Use clustering such as K-means or DBSCAN on session features (source host, account, transfer
    size, time of day, function-code/command mix, byte counts) to isolate programming sessions that originate
    from unusual engineering workstations or network segments. Validate and tune on labeled OT datasets,
    and surface the distinguishing features (e.g., source segment, transfer volume) in the alert so an
    analyst can triage quickly. An outlier session that clusters away from the established engineering
    norm, particularly one from an unexpected source segment, is a candidate malicious append; sessions
    that fall within established clusters are likely legitimate maintenance.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 180 days to gather sufficient programming sessions for clustering.
  queries:
  - technology: ML/pseudocode
    query: 'feats = session_features(src_host, account, transfer_size, hour, funccode_mix, byte_counts);

      clusters = DBSCAN(feats)  # or KMeans;

      for s in sessions: if s is outlier/noise: alert(s, distinguishing_features(s))'
- question: Can a supervised, explainable model distinguish a legitimate maintenance append from malicious
    logic injection, and what specific features drove that determination?
  context: Train a Random Forest or SVM on network and host telemetry to distinguish legitimate maintenance
    appends from malicious logic injection using protocol fields, user context, transfer volume, and PLC
    response patterns. Emit the top-3 contributing features (via Random Forest feature importance or SHAP)
    in the alert text rather than a bare score, and pair with an LLM that tokenizes discretized protocol
    fields to produce an operator-auditable, token-grounded explanation for triage. A classification of
    malicious with strong, sensible contributing features (unusual source, abnormal transfer volume, atypical
    PLC responses) should be escalated; an explainable legitimate verdict supports rapid clearing of the
    event.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 180 days for labeled training data, applied to recent sessions.
  queries:
  - technology: ML/pseudocode
    query: 'clf = RandomForest_or_SVM(protocol_fields, user_ctx, transfer_volume, plc_response);

      pred = clf.predict(session);

      if pred == ''malicious'': alert(session, top3=shap_or_importance(session)); llm_explain(tokenized_protocol_fields)'
- question: Does the ordered sequence of engineering events (logon, project open, compile, controller
    connect, download/append, mode change) for a session deviate from the normal learned workflow?
  context: Model the normal ordering of EWS/PLC engineering events (logon, project open, compile, controller
    connect, download/append, mode change) with an LSTM over log keys, and flag out-of-distribution append
    chains, surfacing the offending log key for triage. Train on benign engineering activity and retrain
    online to track cadence drift. Corroborate ML output with the deterministic checksum/allowlist floor,
    since ML-only detectors are evadable by constrained concealment. An append that appears without its
    expected preceding workflow steps (e.g., a download with no project-open/compile lineage) is a strong
    indicator of automated or covert injection during lateral movement; a complete, in-order engineering
    chain is consistent with legitimate work.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation project history
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Control Network (Level 1), Engineering Workstations, PLC Programming Ports'
  range: Last 180 days of benign engineering activity for sequence modeling.
  queries:
  - technology: ML/pseudocode
    query: 'seq = log_keys(logon, project_open, compile, controller_connect, download_append, mode_change);

      lstm = train_on_benign(seq); retrain_online();

      if lstm.predict_next(seq) is out_of_distribution: alert(offending_log_key); corroborate(checksum_allowlist_floor)'
