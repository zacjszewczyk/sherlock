    on normal service-control event sequences and flag anomalous sequences such as a 'stop' not followed
    by 'start' within typical maintenance duration, or a 'disable' with no preceding authorized activity,
    with a high anomaly score that surfaces the deviating keys. For provenance context, a whole-system
    temporal GNN (KAIROS) flags the stop/disable as an anomalous edge and reconstructs the originating
