name: 'T0872: Indicator Removal on Host'
id: 834045e9-b4fe-46f6-9821-ac12705400c3
description: Investigate whether an adversary is attempting to hide their presence on critical ICS hosts
  (Engineering Workstations, HMIs, Historian Servers, Process Control Servers, and OT Domain Controllers)
  by removing, overwriting, or suppressing host-based indicators of compromise. This playbook helps an
  analyst hunt for cleared Windows audit logs (Event ID 1102/104) and their Linux equivalents, mass deletion
  or wiping of system, ICS application, and shell-history log files, tampering with or disabling the Windows
  EventLog service (7036/7040) and Linux auditd/rsyslog/journald, and the resulting telemetry gaps that
  betray a silenced logging pipeline. It combines deterministic symbolic-logic detections, statistical
  baselining (modified Z-score, change-point detection, entropy and syscall n-gram analysis), and machine-learning
  approaches (UEBA, isolation forests, sequence models, and provenance graphs) to surface unauthorized
  log clearing, correlate it with the initiating user, session, and source network segment, and distinguish
  malicious evasion from legitimate maintenance activity.
type: technique
related:
- tactic_id: TA0103
  tactic_name: Evasion
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: On any host tagged 'ICS', has the Windows Security/System audit log been cleared (Event ID
    1102 or System Event ID 104) or have wevtutil/Clear-EventLog commands been executed, by a user who
    is not a whitelisted administrator or outside an approved maintenance window?
  context: Clearing the audit log is one of the strongest single signals of an adversary trying to erase
    forensic evidence during the Evasion tactic. Alert on Event ID 1102 (audit log cleared) or System
    Event ID 104, and on the equivalent `wevtutil cl` / `Clear-EventLog` commands seen in Sysmon Event
    ID 1 or Event ID 4688, following the SigmaHQ 'Important Windows Eventlog Cleared' rule. Enrich by
    correlating the clear timestamp with the preceding successful logon (Event ID 4624) to recover the
    user and session, then check that user+timestamp against a watchlist of authorized administrators
    and a schedule of approved maintenance windows. Any event from an unauthorized user, or any event
    outside an approved window, should escalate. Pivot on Zeek conn.log to recover the source IP and flag
    activity originating from unexpected network segments. A negative result (clear performed by an approved
    admin inside a window) is benign; a positive result is a high-confidence evasion indicator.
  answer_sources: &id001
  - Windows Event ID 1102
  - Windows Event ID 104
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, and OT Domain
    Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM windows WHERE (event_id=1102 OR (channel=''System'' AND event_id=104) OR (event_id IN
      (1,4688) AND command_line MATCHES /wevtutil\s+cl|Clear-EventLog/i)) AND host_tag=''ICS''

      | JOIN last preceding event_id=4624 ON host WITHIN 10m => user, logon_id, src_ip

      | WHERE user NOT IN authorized_admins OR timestamp NOT IN approved_maintenance_windows

      | ENRICH src_ip FROM zeek_conn WHERE src_subnet NOT IN expected_ics_segments

      | ALERT severity=critical'
- question: Is there a gap or reset in the forwarded EventRecordID sequence, a missing log-shipping heartbeat,
    or a central-index clear event with no pre-clear backlog from any ICS host, indicating logs were cleared
    locally even though the on-host evidence is gone?
  context: Sophisticated actors clear the local log to defeat host inspection, but the central pipeline
    still recorded what arrived before the clear. Per Schneier and Kelsey's secure-audit-log model, treat
    the absence of expected telemetry as the alert itself. Continuously verify each host's EventRecordID
    sequence in the forwarded Security/System channels and the heartbeat of the log-shipping agent. Fire
    when (a) EventRecordID resets to a low value or skips a contiguous block, (b) no events arrive from
    an ICS host for more than 2x its baseline maximum inter-event gap, or (c) the central index shows
    a clear event (1102/104) with no corresponding pre-clear backlog. This catches local clearing or agent
    tampering that on-host telemetry can no longer prove, making it resilient to evasion.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM forwarded_events WHERE host_tag='ICS'\n| STATS by host: detect EventRecordID reset_or_skip,\
      \ last_seen, baseline_max_gap\n| WHERE EventRecordID_reset=true OR EventRecordID_skip=true\n   OR\
      \ (now - last_seen) > 2*baseline_max_gap\n   OR (clear_event_1102_or_104=true AND pre_clear_backlog=0)\n\
      | ALERT severity=high reason='log-shipping integrity gap'"
- question: Does any host audit graph match the full indicator-removal attack chain (remote logon 4624
    Type 3/10 -> reconnaissance -> service or audit-policy change -> log clear 1102/104) correlated on
    a single shared Logon ID within a short window?
  context: 'Individual steps of an evasion sequence may each look benign, but their composition is highly
    diagnostic. Following the POIROT approach, encode the known multi-step indicator-removal chain as
    a single provenance query graph and match it against host audit graphs: a remote logon (Event ID 4624
    Logon Type 3 or 10), followed by reconnaissance, followed by a service or audit-policy change, ending
    in a log clear (1102/104). Correlate every step on a shared Logon ID. A complete match within a short
    time window is a high-confidence deterministic detection that survives renamed binaries and minor
    procedural variation, because it keys on the structure of the attack rather than specific tool names.
    A partial match warrants enrichment; a full match should escalate.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM windows WHERE host_tag='ICS'\n| GRAPH MATCH chain:\n    n1: event_id=4624 logon_type\
      \ IN (3,10)\n    -> n2: recon (4688 net/whoami/quser/tasklist)\n    -> n3: service_or_auditpolicy_change\
      \ (7040 OR 4719)\n    -> n4: log_clear (1102 OR 104)\n  WHERE n1.logon_id=n2.logon_id=n3.logon_id=n4.logon_id\n\
      \    AND span(n1..n4) < 30m\n| ALERT severity=critical"
- question: Is the count of audit-log-clear events (Event ID 1102/104) on an ICS host anomalous against
    its 90-day rolling baseline, and how short is the time delta between the clear and the last interactive
    logon?
  context: Audit log clears are rare on a stable ICS host, so any occurrence is a statistical anomaly
    above the 99.9th percentile. Establish a 90-day rolling baseline of 1102/104 counts per host and alert
    on outliers using the median-absolute-deviation modified Z-score (|MZ|>3.5) rather than mean/stddev,
    so legitimate maintenance bursts do not inflate the baseline. As a risk modifier, compute the delta
    to the last interactive logon (Event ID 4624 Logon Type 2 or 10) on the same host; a delta under 300
    seconds sharply raises risk because it implies a human logged on and immediately cleared logs. Also
    track failed/denied clear attempts (a preceding Event ID 4625, or access-denied 4663 on the log channel)
    as a distinct failure-mode signal that an attacker probed but was blocked.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM windows WHERE event_id IN (1102,104) AND host_tag=''ICS''

      | STATS count BY host OVER 90d

      | EVAL mz = modified_zscore(count)

      | WHERE abs(mz) > 3.5

      | JOIN last 4624 (logon_type IN (2,10)) ON host => logon_delta

      | EVAL risk = (logon_delta < 300s ? ''high'' : ''medium'')

      | ENRICH failed_clear = exists(4625 before OR 4663 access_denied on log_channel)

      | ALERT'
- question: Has any ICS host's per-minute Security/System event volume undergone an abrupt downward change
    point (collapsing toward zero) concurrent with or just after a privileged logon?
  context: When an attacker stops the EventLog service or clears/tampers with logging, the event-volume
    time series exhibits a sudden drop rather than a single discrete event. Apply change-point detection
    (CUSUM or Bayesian online CPD) to each ICS host's per-minute Security/System event-volume series.
    An abrupt downward change point whose post-change mean falls below the 1st percentile of the host's
    30-day baseline volume variance, especially when concurrent with or just after a privileged logon,
    indicates clearing or service tampering. Derive the host-specific threshold from the 30-day distribution
    of normal volume so quiet but normal periods are not flagged. This statistical view complements per-event
    rules by catching gradual or sustained suppression of telemetry.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM windows WHERE channel IN (''Security'',''System'') AND host_tag=''ICS''

      | TIMESERIES count BY host PER 1m

      | CHANGEPOINT cusum_or_bocpd(count) => cp_time, post_mean

      | WHERE cp_direction=''down'' AND post_mean < percentile(baseline_30d,1)

      | JOIN privileged_logon 4624 ON host WITHIN 5m of cp_time

      | ALERT severity=high'
- question: Does a User and Entity Behavior Analytics model score an audit-log-clear event (1102/104)
    as a high-risk anomaly because the initiating account has no history of such actions or acted at an
    anomalous time?
  context: Behavioral modeling catches evasion that rule lists miss when an otherwise-authorized account
    is abused. Profile normal administrative actions (logon times, source IPs, commands) per user and
    entity, then score Event ID 1102/104 with an unsupervised Extended Isolation Forest over per-host/per-user
    feature vectors (clear counts, logon delta, command entropy, EventRecordID gaps). Flag clears initiated
    by accounts with no history of such actions or at anomalous times. The alert must surface the model
    score and the top-3 contributing features for analyst triage. For interpretable sequence context,
    pair with an attention-LSTM over the event stream that names the user/host/field driving the anomaly.
    A high score with corroborating features (short logon delta, unusual source IP) is a strong evasion
    indicator on a critical ICS host.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FROM windows WHERE event_id IN (1102,104) AND host_tag=''ICS''

      | BUILD features per host,user: clear_count, logon_delta, cmd_entropy, eventrecordid_gaps, hour_of_day,
      src_ip_rarity

      | SCORE eif = ExtendedIsolationForest(features)

      | WHERE eif_score > threshold

      | OUTPUT score, top3_features

      | ENRICH attention_lstm(event_stream) => driving_user_host_field

      | ALERT severity=high'
- question: Has a known file-wiping utility or deletion command (wevtutil cl, del /s /q, sdelete, cipher
    /w, or Linux rm/shred/unlink/truncate on /var/log) been executed against system, ICS application,
    or temp log directories on an ICS host?
  context: Beyond clearing the audit log, adversaries delete on-disk log files directly. Alert on Event
    ID 4688 / Sysmon Event ID 1 where the command line includes wiping utilities ('wevtutil.exe cl', 'del
    /s /q', 'sdelete.exe', 'cipher.exe /w') targeting sensitive log directories, and the Linux equivalents
    ('rm'/'shred'/'unlink'/'truncate' on /var/log) per the SigmaHQ Linux log-clearing rule. Match the
    deleted paths against a log-path allow/deny list, while excluding a benign-process allowlist (logrotate,
    dockerd, the EDR agent) per the Elastic 'System Log File Deletion' rule to control false positives.
    Correlate with Event ID 4663 where AccessMask is DELETE (0x10000) and ObjectName matches sensitive
    directories such as C:\Windows\System32\winevt\Logs\ or C:\ProgramData\Wonderware\Logs\. Escalate
    when the executing process hash has low reputation.
  answer_sources: &id002
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Zeek fileinfo.log
  - Zeek pe.log
  - 'NAI: File systems on Engineering Workstations, HMIs, Process Control Servers, and Historian Servers,
    specifically directories containing system logs, ICS vendor-specific application logs, and user profiles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM process WHERE host_tag=''ICS'' AND event_id IN (4688,1)

      | WHERE command_line MATCHES /wevtutil(\.exe)?\s+cl|del\s+\/s\s+\/q|sdelete|cipher(\.exe)?\s+\/w|\b(rm|shred|unlink|truncate)\b.*\/var\/log/i

      | WHERE target_path IN sensitive_log_dirs AND parent_process NOT IN benign_allowlist

      | JOIN 4663 ON host WHERE access_mask=0x10000 AND object_name IN sensitive_log_dirs WITHIN 1m

      | ENRICH process_hash reputation

      | ALERT severity=high escalate_if low_reputation'
- question: Does an ICS host show a file-deletion spike in log directories above its 99th-percentile baseline
    within a 15-minute window, or a sudden drop in the Shannon entropy of deleted file extensions by a
    single process?
  context: Programmatic wiping produces statistical signatures distinct from occasional manual deletions.
    For each ICS host, baseline file deletions (Event ID 4663 DELETE) per user and per process within
    log directories over 7 days, and alert when the count in a 15-minute window exceeds the 99th percentile,
    using the modified Z-score (|MZ|>3.5) to resist batch effects. Separately compute the Shannon entropy
    of file extensions deleted by a single process in a 60-second window; a sudden drop below the 5th
    percentile indicates programmatic deletion of many similar files (e.g., all .evtx or all .log). Profile
    failed deletions / access-denied (4663 failure, or status 0xC0000022) as a distinct failure-mode feature,
    since defenders' ACLs often block the first attempt. Together these surface mass log destruction even
    when individual deletions look ordinary.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM windows WHERE event_id=4663 AND access_mask=0x10000 AND object_name IN log_dirs AND host_tag='ICS'\n\
      | STATS count BY host,user,process OVER 15m WITH baseline 7d\n| WHERE modified_zscore(count) > 3.5\
      \  // > 99th pct\n| UNION (\n   STATS ext_entropy = shannon(file_ext) BY process OVER 60s\n   |\
      \ WHERE ext_entropy < percentile(baseline,5))\n| ENRICH failed_delete = count(4663 failure OR status=0xC0000022)\n\
      | ALERT"
- question: Is any binary on an ICS host emitting bursts of deletion-related system calls (unlink/rename/truncate/ftruncate)
    that fall outside its learned normal short n-gram 'self' profile?
  context: Process-level syscall modeling detects wiping behavior independent of command-line obfuscation.
    Following Forrest et al's 'sense of self', model each binary's normal short system-call n-gram profile
    from a 14-day clean baseline on the stable ICS software set, then flag bursts of unlink/rename/truncate/ftruncate
    that fall outside the learned database. Weight rare n-grams using a frequency-based (t-stide) score
    so a process that suddenly emits a high rate of deletion syscalls is surfaced even when each individual
    call is technically valid. Because ICS hosts run a fixed, well-understood software set, deviations
    from the learned per-binary profile are strong, low-noise indicators that a normally-benign process
    has been hijacked or replaced to wipe logs.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM auditd_syscalls WHERE host_tag=''ICS'' AND syscall IN (unlink,unlinkat,rename,renameat,truncate,ftruncate)

      | WINDOW ngram(seq, n=6) BY binary

      | SCORE tstide = rarity_weight(ngram, self_db[binary])

      | WHERE ngram NOT IN self_db[binary] AND tstide > threshold

      | ALERT severity=high reason=''anomalous deletion syscall burst'''
- question: Does an LSTM/DeepLog model flag an anomalous spike or sequence discontinuity in an ICS host's
    file-deletion rate (Event ID 4663), and do clustered hosts/users share an anomalous deletion pattern
    indicating a coordinated campaign?
  context: Sequence and clustering models reveal both subtle per-host anomalies and cross-host coordination.
    Apply a time-series anomaly model (LSTM) to the per-host rate of file-deletion events (Event ID 4663)
    to flag anomalous spikes as potential indicator removal, and model the surrounding log-key sequence
    with DeepLog so missing expected keys and discontinuities (gaps where rotated logs should appear)
    raise an explainable alert listing the top-g predicted-vs-observed keys. Then cluster hosts/users
    with similar anomalous patterns using DBSCAN over features like deletion rate, target directory, parent
    process, and time of day to identify coordinated campaigns across the OT environment. Surface the
    top-3 contributing features in each alert so an analyst can quickly confirm whether the pattern reflects
    an enterprise-wide evasion effort.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FROM windows WHERE event_id=4663 AND access_mask=0x10000 AND host_tag=''ICS''

      | TIMESERIES deletion_rate BY host PER 1m

      | SCORE lstm_anomaly(deletion_rate); DeepLog(log_key_seq) => missing_keys, topg

      | WHERE lstm_anomaly > threshold OR missing_keys>0

      | CLUSTER dbscan(features=[deletion_rate,target_dir,parent_process,hour])

      | OUTPUT cluster_id, top3_features

      | ALERT'
- question: Has a shell-history file (ConsoleHost_history.txt, .bash_history, PSReadline\*.txt) been deleted
    or directly referenced by a command on an ICS host, especially by a non-standard parent process or
    a non-administrator user?
  context: Deleting command-line history is a deliberate attempt to hide which commands an operator or
    attacker ran. Alert on a file deletion (Event ID 4663, AccessMask 0x10000) or command execution (Event
    ID 4688 / Sysmon Event ID 1) whose target or command line references known shell-history files ('ConsoleHost_history.txt',
    '.bash_history', 'PSReadline\*.txt'), and on `history -c` / `unset HISTFILE` / `rm ~/.bash_history`
    on ICS Linux hosts per the SigmaHQ Linux log-clearing rule. Escalate when the parent process is not
    a standard shell (powershell.exe, cmd.exe, bash) or the user is not a whitelisted administrator, since
    legitimate history pruning is rare on ICS hosts and almost never done by service or anomalous parent
    processes. A positive hit is a focused evasion indicator that often accompanies hands-on-keyboard
    activity.
  answer_sources: &id003
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: User profile directories on Engineering Workstations (EWS) and other ICS hosts where operators
    use command-line interfaces (e.g., C:\Users\<user>\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadline\).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM events WHERE host_tag='ICS' AND (\n    (event_id=4663 AND access_mask=0x10000 AND object_name\
      \ MATCHES /ConsoleHost_history\\.txt|\\.bash_history|PSReadline\\\\.*\\.txt/i)\n OR (event_id IN\
      \ (4688,1) AND command_line MATCHES /ConsoleHost_history|\\.bash_history|history\\s+-c|unset\\s+HISTFILE|rm\\\
      s+.*\\.bash_history/i))\n| WHERE parent_process NOT IN ('powershell.exe','cmd.exe','bash') OR user\
      \ NOT IN authorized_admins\n| ALERT severity=high"
- question: Is a deletion targeting a command-history file anomalous against the user's 30-day baseline,
    and how short is the delta from the user's most recent interactive logon to the deletion?
  context: Legitimate deletions of command-history files are extremely rare, so any occurrence exceeds
    the 99.9th percentile and should alert. Establish a 30-day baseline of history-file deletions per
    user and score occurrences robustly with the modified Z-score. Compute the delta from the user's most
    recent interactive logon (Event ID 4624 Type 2 or 10) to the deletion; a delta under 120 seconds is
    high-confidence malicious because it implies the user logged on and almost immediately wiped their
    history. Track failed access to the history path (access-denied 4663) as a distinct failure-mode signal
    that an attacker probed the file but was blocked by ACLs. This statistical lens elevates rare-but-quiet
    evasion that simple rules might down-rank.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM windows WHERE event_id=4663 AND access_mask=0x10000 AND object_name MATCHES /history/
      AND host_tag=''ICS''

      | STATS count BY user OVER 30d

      | WHERE modified_zscore(count) > 3.5  // any occurrence ~ 99.9th pct

      | JOIN last 4624 (logon_type IN (2,10)) ON user => logon_delta

      | EVAL conf = (logon_delta < 120s ? ''high'' : ''medium'')

      | ENRICH failed_access = count(4663 access_denied on history_path)

      | ALERT'
- question: Are there command lines on an ICS host with anomalously high Shannon entropy or length, or
    never-before-seen structure for the operator, consistent with encoded/obfuscated PowerShell that clears
    PSReadline history?
  context: Attackers obfuscate history-wiping commands to evade keyword rules. Baseline per-user command-line
    Shannon entropy and length, and alert on entropy outliers indicative of encoded or obfuscated PowerShell
    that clears PSReadline history. Combine the entropy score with a frequency/rarity score so a command
    structure never previously seen for that operator is elevated even at only moderate entropy. This
    catches Base64-encoded or string-manipulated commands that ultimately delete or disable history logging
    without ever spelling out 'ConsoleHost_history.txt' in clear text. Pair findings with temporal proximity
    to other low-confidence indicators to raise overall confidence that this is deliberate evasion rather
    than benign scripting.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM process WHERE host_tag='ICS' AND process_name IN ('powershell.exe','pwsh','cmd.exe')\n\
      | EVAL cmd_entropy = shannon(command_line), cmd_len = length(command_line)\n| WHERE cmd_entropy\
      \ > percentile(user_baseline,99) OR cmd_len > percentile(user_baseline,99)\n   OR rarity(command_structure,\
      \ user_baseline) = 'never_seen'\n| ALERT severity=medium reason='obfuscated command likely history\
      \ wipe'"
- question: Does a supervised command-line classifier score a command as malicious history-wiping, or
    does an Extended Isolation Forest flag it as novel, especially when temporally correlated with other
    low-confidence indicators?
  context: Machine learning generalizes beyond fixed signatures to catch novel history-wiping commands.
    Train a command-line classifier (e.g., Random Forest) to distinguish malicious from benign commands
    using features like argument bag-of-words, length, entropy, and parent process; a high score for a
    history-deleting command, especially when temporally correlated with other low-confidence indicators
    such as unusual Zeek conn.log activity, triggers a high-fidelity alert. Score residual novelty with
    an Extended Isolation Forest over the same features and surface the top-3 contributing features so
    an analyst understands why the command was flagged. This approach is well-suited to ICS hosts where
    the legitimate command vocabulary is narrow, making malicious deviations stand out.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FROM process WHERE host_tag=''ICS'' AND event_id IN (4688,1)

      | FEATURES arg_bow, length, entropy, parent_process

      | SCORE rf = RandomForest_malicious(features); eif = ExtendedIsolationForest(features)

      | WHERE rf_score > threshold OR eif_score > threshold

      | ENRICH correlate zeek_conn anomalies WITHIN 10m

      | OUTPUT score, top3_features

      | ALERT severity=high'
- question: Has the Windows EventLog service been stopped (Event ID 7036, state 'stopped') or disabled
    (Event ID 7040, start type 'Disabled') on an ICS host, or the Linux auditd/rsyslog/journald equivalent
    been stopped or masked, outside an authorized maintenance window?
  context: Disabling logging at the service level halts all future telemetry, a powerful evasion move.
    Alert on `(event_id=7036 AND service_name='EventLog' AND state='stopped')` or `(event_id=7040 AND
    service_name='EventLog' AND new_start_type='Disabled')`, and on the Linux equivalent of stopping or
    masking auditd/rsyslog/systemd-journald, following the deterministic service-tamper pattern in the
    SigmaHQ rule. Query the preceding Event ID 4688 / Sysmon Event ID 1 to recover the command ('sc.exe
    stop eventlog', 'systemctl stop auditd') and Event ID 4624 for the user. Escalate immediately unless
    the user is a whitelisted administrator acting within a documented maintenance window. Because ICS
    hosts should run logging continuously, any unauthorized stop/disable is a critical indicator.
  answer_sources: &id004
  - Windows Event ID 7036
  - Windows Event ID 7040
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Service Control Manager and system services on critical ICS hosts, including EWS, HMIs, Historians,
    and OT Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM windows WHERE host_tag='ICS' AND (\n    (event_id=7036 AND service_name='EventLog' AND\
      \ state='stopped')\n OR (event_id=7040 AND service_name='EventLog' AND new_start_type='Disabled'))\n\
      | JOIN preceding 4688/1 ON host WITHIN 2m => command (sc stop eventlog / systemctl stop auditd)\n\
      | JOIN 4624 ON host => user\n| WHERE user NOT IN authorized_admins OR timestamp NOT IN maintenance_windows\n\
      | ALERT severity=critical"
- question: Did the EventLog/auditd service stop or become disabled on an ICS host without telemetry resuming
    within its baseline maintenance duration, leaving a gap in forwarded EventRecordIDs?
  context: An integrity-focused view treats the silence after a service stop as the detection. Per Schneier
    and Kelsey, alert when the EventLog/auditd service stops or is disabled and no corresponding telemetry
    resumes within its baseline maintenance duration. The silenced agent and the resulting gap in forwarded
    EventRecordIDs are themselves the detection, and they survive cases where the on-host log is later
    wiped to hide the stop event. This catches scenarios where an attacker stops logging, performs malicious
    actions during the blackout, and never restarts the service, or restarts it only after destroying
    intervening evidence. A confirmed unexplained gap on a critical ICS host is a high-priority evasion
    indicator.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM service_events WHERE host_tag=''ICS'' AND service IN (''EventLog'',''auditd'',''rsyslog'',''systemd-journald'')
      AND action IN (''stopped'',''disabled'')

      | FOR each stop: CHECK telemetry_resumed WITHIN baseline_maintenance_duration

      | WHERE telemetry_resumed=false OR eventrecordid_gap_after_stop=true

      | ALERT severity=high reason=''logging service stopped without restart'''
- question: Is an EventLog service stop (7036) or disable (7040) on an ICS host anomalous against its
    1-year baseline and outside a change-controlled window, with a short delta to the last interactive
    logon and a confirmed post-stop drop in event volume?
  context: EventLog stops/disables are extraordinarily rare on a properly run ICS host, so any occurrence
    outside a change-controlled window is a severe anomaly above the 99.9th percentile. Establish a 1-year
    baseline of 7036/7040 counts per host and alert using the modified Z-score to suppress maintenance-burst
    false positives. Compute the delta to the last interactive logon (4624 Type 2/10); under 60 seconds
    is highly suspicious. Confirm the impact by applying change-point detection to the post-stop event-volume
