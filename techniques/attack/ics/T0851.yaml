name: 'T0851: Rootkit'
id: c9d97e09-6b7d-4de4-915e-194296639a32
description: 'Investigate whether an adversary has deployed a rootkit on ICS assets to hide programs,
  files, network connections, services, drivers, or firmware-level components, and to inhibit the response
  functions of critical control devices. This playbook helps an analyst hunt for the canonical cross-view
  discrepancy of a rootkit: outbound network flows observed by network sensors (Zeek conn.log) that have
  no corresponding host-level attribution (Sysmon Event ID 3, Windows Event ID 5156, or an initiating
  process in Windows Event ID 4688). It guides detection of suspicious service and driver installs (Windows
  Event ID 7045/7040, Sysmon Event ID 1/6, registry Services keys) such as unsigned or known-vulnerable
  (BYOVD) drivers and high-entropy service names that are the primary kernel-rootkit installation vector.
  For the Inhibit Response Function angle, it correlates anomalous TCP connection-state failures (REJ/RSTO/S1)
  on ICS protocol ports (Modbus/502, S7/102, EtherNet/IP/44818) and repeated critical HMI/SCADA application
  crashes (Windows Event ID 1000/1001) whose faulting modules point at low-level network/system drivers
  (tcpip.sys, afd.sys) with ICS traffic, revealing a rootkit selectively dropping control commands or
  destabilizing I/O. Symbolic-logic, statistical (CUSUM, Matrix Profile, entropy, sigma/percentile baselines),
  and explainable machine-learning (Random Forest, Isolation Forest, LSTM/CNN autoencoders, provenance
  graphs with SHAP) methods are provided so deterministic rules run in parallel with anomaly models for
  defensible, explainable alerting.'
type: technique
