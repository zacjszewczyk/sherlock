questions:
- question: Is there an outbound network connection from a critical ICS asset that is visible in Zeek
    conn.log but has NO corresponding host-level network event (Sysmon Event ID 3 or Windows Event ID
    5156) and no initiating process (Windows Event ID 4688) within a tight 5-second window?
  context: This is the canonical cross-view discrepancy that exposes a kernel- or userland-level rootkit
    operating under the Evasion tactic. A rootkit hides its presence by intercepting and modifying OS
    API calls, so a malicious socket can be invisible to host telemetry while it is still carried on the
    wire and seen by a passive network sensor. Join externally-observed flows (Zeek conn.log) against
    host network telemetry (Sysmon Event ID 3 connect events and Windows Filtering Platform Event ID 5156)
    and the owning process (Event ID 4688) on the connection 5-tuple within a 5-second window, and alert
    on any externally-observed flow that has no host attribution at all. Escalate when the remote destination
    is not on the OT egress allowlist or matches threat intelligence. A positive result means a hidden
    channel exists and the host kernel is likely lying about its connection table; a negative result (every
    flow attributed to a host event and process) argues against an active network-hiding rootkit.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: ICS network security monitoring points (e.g., SPAN ports on switches in Level 2/3), firewalls
    segmenting OT zones, and logs from critical endpoints such as Engineering Workstations (EWS), Human-Machine
    Interfaces (HMIs), Historian servers, and OT Domain Controllers.'
  range: Last 90 days; correlate network flows with host telemetry within a 5-second window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for each flow in zeek_conn where orig_h IN critical_ics_assets: host_evt = match(sysmon_id3
      OR winevt_5156, key=5tuple, within=5s); proc = match(winevt_4688, key=pid/image, within=5s); if
      host_evt IS NULL AND proc IS NULL => alert ''unattributed outbound flow''; escalate if resp_h NOT
      IN ot_egress_allowlist OR resp_h IN threat_intel'
- question: Has the per-asset volume, frequency, or failure-rate of UNATTRIBUTED outbound connections
    spiked beyond its clean baseline (e.g., >3 sigma on hourly count, >50% increase in out/in byte ratio,
    or accumulating small persistent gaps)?
  context: A stealthy rootkit may exfiltrate or beacon in low-and-slow bursts that any single cross-view
    check misses, so profile the unattributed-flow signal statistically over a 7-30 day clean window.
    For each asset baseline the hourly COUNT of unattributed connections (frequency), outbound BYTE volume
    and the out/in byte RATIO, and the rate of unattributed failed/reset connections (state). Alert on
    >3 sigma spikes or >50% ratio increases. Apply the near-parameter-free Matrix Profile to the per-minute
    series to surface discords, and feed the residual into a CUSUM statistic to accumulate small persistent
    gaps that signal slow hidden activity. In the Evasion tactic this catches a rootkit that throttles
    its hidden channel to stay below deterministic thresholds; a positive result is an abnormal rise in
    hidden traffic, while a flat baseline-conforming series is reassuring.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: ICS network security monitoring points (e.g., SPAN ports on switches in Level 2/3), firewalls
    segmenting OT zones, and logs from critical endpoints such as Engineering Workstations (EWS), Human-Machine
    Interfaces (HMIs), Historian servers, and OT Domain Controllers.'
  range: Last 90 days; baseline 7-30 days of clean data, evaluate per-minute and per-hour series
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per asset over 7-30d: mean,std of hourly unattributed_conn_count; out_in_byte_ratio;
      unattributed_failed_conn_rate; alert if hourly_count > mean+3*std OR ratio > 1.5*baseline OR failed_rate
      > mean+3*std'
  - technology: Python/Matrix Profile + CUSUM pseudocode
    query: mp = matrix_profile(per_minute_unattributed_count); flag discords where mp_score > p99; cusum
      = CUSUM(observed_gap - expected_gap); alert when cusum exceeds drift threshold (slow persistent
      hiding)
- question: Does an explainable supervised classifier label an unattributed flow as malicious based on
    flow features (is_unattributed, bytes, duration, destination reputation, port), and does a provenance-graph
    detector localize the hidden process or socket on the host?
  context: Layer machine learning beside the deterministic cross-view rule to score novel hiding behavior,
    while remembering ML alone collapses on unseen attacks, so it must augment not replace the rule. Train
    a Random Forest on flow features (is_unattributed, bytes, duration, destination reputation, port)
    and surface the top-3 feature contributions in every alert via feature importance / SHAP for analyst
    triage and defensibility. In parallel run node-level provenance-graph detection (ThreaTrace / KAIROS)
    over whole-system host events to localize the hidden process and socket that the rootkit is concealing,
    reconstructing the causal chain from initial execution to the covert connection. Under the Evasion
    tactic a positive result is a high-confidence, explainable indication of a concealed channel pinned
    to a specific host artifact; analysts should always confirm against the symbolic-logic cross-view
    rule.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: ICS network security monitoring points (e.g., SPAN ports on switches in Level 2/3), firewalls
    segmenting OT zones, and logs from critical endpoints such as Engineering Workstations (EWS), Human-Machine
    Interfaces (HMIs), Historian servers, and OT Domain Controllers.'
  range: Last 90 days; flow-level scoring with host provenance over the same window
  queries:
  - technology: ML/pseudocode
    query: 'rf = RandomForest(features=[is_unattributed,bytes,duration,dest_reputation,dest_port]); score
      = rf.predict_proba(flow); if score>thr: alert + emit top3 SHAP features'
  - technology: ML/Provenance-graph pseudocode
    query: graph = build_provenance(sysmon+auditd host events); detector = ThreaTrace_or_KAIROS(graph);
      localize node(hidden_process/socket); attach top3 contributing nodes to alert
- question: Was a new or modified Windows service (Event ID 7045/7040) installed with a suspicious configuration
    (executable path in C:\Users\, C:\Temp\, or another non-standard directory; unsigned or invalid-signature
    binary per Sysmon Event ID 1; high-entropy random service name/description), or was an unsigned or
    known-vulnerable (BYOVD) kernel driver loaded (Sysmon Event ID 6)?
  context: Services and kernel drivers are the primary installation and persistence vector for rootkits.
    Flag new/modified services (Event ID 7045 service installed, 7040 service config/start-type changed)
    whose executable path is outside approved directories, whose name matches known malware, or whose
    binary is unsigned or has an invalid signature (correlate with Sysmon Event ID 1 process create with
    hashes/signature status). Additionally alert on kernel driver loads (Sysmon Event ID 6) of unsigned
    or known-vulnerable drivers, because Bring-Your-Own-Vulnerable-Driver (BYOVD) is the canonical route
    to load kernel-rootkit code on a patched host. Validate against the registry Services key for the
    asset's secure baseline. In the Evasion tactic a positive result is a likely rootkit being installed
    to hide subsequent activity; a benign result is a signed service from an approved path matching the
    baseline.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Sysmon Event ID 1
  - Windows Registry HKLM\SYSTEM\CurrentControlSet\Services\
  - 'NAI: Engineering Workstations (EWS), Domain Controllers in the OT network, Historian Servers, SCADA
    Servers, OPC Servers, HMI Servers, Remote Terminal Units (RTUs) with Windows OS, Programmable Logic
    Controllers (PLCs) with embedded Windows OS.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: (EventID IN [7045,7040] AND (image_path NOT IN approved_dirs OR image_path ~ /(\\Users\\|\\Temp\\)/i
      OR service_name IN known_malware OR signature_status IN ['unsigned','invalid'])) OR (Sysmon EventID=6
      AND (signed=false OR driver_hash IN byovd_known_vulnerable)) => alert
- question: Does the entropy of a new service name or image path exceed the 95th percentile, or does the
    daily count of service/driver modifications exceed the 99th percentile of the per-asset baseline,
    or are there abnormal numbers of failed service starts and signature-verification failures?
  context: Rootkit installers frequently use randomized (high-entropy) service names and image paths and
    cause unusual bursts of service/driver changes on otherwise static ICS hosts. Baseline per asset and
    alert when service-name or image-path Shannon entropy exceeds the 95th percentile, and when the daily
    service/driver modification COUNT exceeds the 99th percentile of that asset's history. Explicitly
    track failed service starts and signature-verification failures (state) as distinct signals, since
    a half-installed or blocked rootkit driver produces those errors. Compare the host's process behavior
    against its normal short-sequence baseline so any behavior absent from the known-good sequence set
    is treated as anomalous. Under Evasion a positive result indicates programmatically-generated, abnormally
    frequent, or failing installs consistent with rootkit deployment; a result within baseline percentiles
    is routine administration.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Sysmon Event ID 1
  - Windows Registry HKLM\SYSTEM\CurrentControlSet\Services\
  - 'NAI: Engineering Workstations (EWS), Domain Controllers in the OT network, Historian Servers, SCADA
    Servers, OPC Servers, HMI Servers, Remote Terminal Units (RTUs) with Windows OS, Programmable Logic
    Controllers (PLCs) with embedded Windows OS.'
  range: Last 90 days; per-asset daily baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per asset: p95(name_entropy), p95(path_entropy), p99(daily_svc_drv_mod_count); on
      new svc/drv: alert if shannon_entropy(name) > p95 OR shannon_entropy(path) > p95 OR daily_mod_count
      > p99; separately alert on spikes in failed_service_starts OR signature_verify_failures vs baseline'
- question: Does an Isolation Forest trained on service/driver creation features (path, signer, entropy,
    parent process, hour-of-day) flag a creation event as a strong outlier, with the top-3 contributing
    features surfaced for triage?
  context: Some rootkit installs evade single-feature thresholds but stand out in the joint distribution
    of their attributes. Train an Isolation Forest on service/driver creation features including image
    path, signer/signature status, name and path entropy, parent process, and hour-of-day, then alert
    on strong outliers. Surface the top-3 contributing features in the alert text following an explainability
    approach so an analyst can immediately see why the event was flagged (e.g., unsigned + temp path +
    off-hours parent process). Select and tune the detector using established CPS anomaly-detection model-selection
    guidance. In the Evasion tactic a positive result is an explainable, multi-feature outlier consistent
    with covert service/driver installation by a rootkit; because ML degrades on novel attacks, keep this
    parallel to the deterministic service/driver rules and confirm against the baseline.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 7040
  - Sysmon Event ID 1
  - Windows Registry HKLM\SYSTEM\CurrentControlSet\Services\
  - 'NAI: Engineering Workstations (EWS), Domain Controllers in the OT network, Historian Servers, SCADA
    Servers, OPC Servers, HMI Servers, Remote Terminal Units (RTUs) with Windows OS, Programmable Logic
    Controllers (PLCs) with embedded Windows OS.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'iso = IsolationForest(features=[image_path,signer,name_entropy,path_entropy,parent_process,hour]);
      s = iso.score(event); if s in strong_outlier_region: alert + emit top3 contributing features (SHAP)'
- question: Does any HMI-PLC pair show a sustained burst of failed/incomplete TCP connection states (>10
    REJ/RSTO/S1 in 60 seconds) on ICS protocol ports (Modbus/502, S7/102, EtherNet/IP/44818), especially
    with one-way byte flow?
  context: A rootkit on a control device can manipulate the network stack to selectively drop or reject
    legitimate control commands and status updates, breaking the expected request-response exchange of
    the Inhibit Response Function tactic. Flag any HMI-PLC pair with more than 10 REJ/RSTO/S1 connection
    states within 60 seconds on ICS ports (Modbus/502, S7/102, EtherNet/IP/44818) and escalate when bytes
    flow one-way, because selectively dropped or rejected commands violate mined process invariants and
    indicate the control channel is being interfered with. Cross-check the suspected device against firmware/logic
    integrity (Trusted Safety Verifier) and control-flow attestation (C-FLAT) to confirm a rootkit resides
    on the device rather than a transient network fault. A positive result is selective command suppression
    consistent with an inhibited response function; a clean request-response pattern is normal operation.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network segments connecting Level 2 (Supervisory Control) and Level 1 (Basic Control) devices,
    DMZ between IT and OT networks, Process Control Networks (PCN), Industrial Demilitarized Zones (IDMZ),
    Field Device Networks.'
  range: Last 90 days; 60-second evaluation windows per HMI-PLC pair
  queries:
  - technology: Zeek/pseudocode
    query: 'group conn.log by (orig_h=hmi, resp_h=plc, resp_p IN [502,102,44818]); per 60s window: cnt
      = count(conn_state IN [''REJ'',''RSTO'',''S1'']); if cnt > 10 => alert; escalate if orig_bytes==0
      XOR resp_bytes==0 (one-way flow); pivot to TSV/C-FLAT integrity check on plc'
- question: Has the connection-state entropy or the per-minute message frequency/byte volume for an HMI-PLC
    pair deviated >3 sigma from baseline, and does a CUSUM detector on the expected-vs-observed reporting
    residual reveal slow, stealthy command suppression?
  context: Stealthy command suppression by a rootkit may be too gradual for a 60-second threshold, so
    model the channel statistically. Baseline conn_state entropy and per-minute message FREQUENCY and
    BYTE volume per HMI-PLC pair, and alert when entropy exceeds 3 sigma above baseline (a shift in the
    mix of successful vs failed states). Feed the residual between expected and observed reporting volume
    into a stateful CUSUM detector to catch slow, persistent suppression of control commands that never
    trips a sigma alarm on any single minute. Surface sudden frequency drops as Matrix Profile discords
    on the per-minute series. In the Inhibit Response Function tactic a positive CUSUM excursion or entropy
    spike indicates the device is quietly failing to serve its control role; a baseline-conforming channel
    indicates healthy periodic exchange.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network segments connecting Level 2 (Supervisory Control) and Level 1 (Basic Control) devices,
    DMZ between IT and OT networks, Process Control Networks (PCN), Industrial Demilitarized Zones (IDMZ),
    Field Device Networks.'
  range: Last 90 days; per-minute series with CUSUM accumulation
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per hmi-plc pair: mean,std of conn_state_entropy, per_min_msg_count, per_min_bytes;
      alert if conn_state_entropy > mean+3*std; cusum = CUSUM(expected_reporting_vol - observed_reporting_vol);
      alert when cusum > drift_threshold'
  - technology: Python/Matrix Profile pseudocode
    query: mp = matrix_profile(per_min_msg_count[pair]); flag discords (sudden frequency drops) where
      mp_score > p99
- question: Does an LSTM autoencoder / 1D-CNN forecaster on per-minute channel features (count, bytes,
    conn_state mix) produce high reconstruction or prediction error, or do FFT/PCA features show loss
    of the channel's normal periodicity?
  context: Periodic ICS polling has a strong temporal rhythm, so a rootkit blocking or selectively dropping
    commands shows up as a break in that rhythm. Train an LSTM autoencoder or a 1D-CNN forecaster on per-minute
    channel features (message count, bytes, conn_state mix) for each HMI-PLC pair and alert on high reconstruction
    or prediction error. Use frequency-domain (FFT) and PCA features to detect loss of periodicity caused
    by blocked periodic traffic, which lightweight neural/PCA methods catch efficiently. Attach the top-3
    SHAP feature contributions to each alert for explainability, and keep the deterministic connection-state
    rule running in parallel because ML degrades on unseen attacks. Under the Inhibit Response Function
    tactic a positive result is a holistic, explainable anomaly in the control channel's rhythm consistent
    with a rootkit suppressing commands; low error and intact periodicity indicate normal operation.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network segments connecting Level 2 (Supervisory Control) and Level 1 (Basic Control) devices,
    DMZ between IT and OT networks, Process Control Networks (PCN), Industrial Demilitarized Zones (IDMZ),
    Field Device Networks.'
  range: Last 90 days; per-minute aggregations, clean-data training
  queries:
  - technology: ML/pseudocode
    query: feat = per_min[count,bytes,conn_state_mix] per hmi-plc pair; model = LSTM_AE_or_1DCNN(trained
      on clean window); alert if recon_or_pred_error > p99.8(clean); add fft/pca periodicity features;
      alert on loss_of_periodicity; emit top3 SHAP
- question: Did a critical HMI/SCADA process crash (Windows Event ID 1000/1001) with a faulting module
    pointing to a low-level system/network driver (e.g., tcpip.sys, afd.sys) occur within 10 seconds of
    ICS-port traffic to/from a field device in Zeek conn.log?
  context: A rootkit (often a BYOVD kernel driver) interfering with I/O frequently destabilizes the critical
    HMI/SCADA software it is manipulating, producing crashes whose faulting module is a low-level network/system
    driver. Alert when a critical HMI/SCADA process crash (Event ID 1000 application error / 1001 Windows
    Error Reporting) names a faulting module such as tcpip.sys or afd.sys AND correlates within 10 seconds
    with ICS-port traffic in Zeek conn.log to or from a PLC/RTU. Faulting kernel drivers and instability
    following privileged driver activity are hallmark rootkit/BYOVD side-effects. In the Inhibit Response
    Function tactic a positive correlation suggests the rootkit's interference with control I/O is crashing
    the operator's interface at the moment of communication, undermining operator intervention; an isolated
    crash with an application-level faulting module is more likely an ordinary software bug.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Operator Workstations, SCADA Engineering Workstations, Process
    Control Workstations, Remote Access Jump Hosts for OT.'
  range: Last 90 days; correlate crashes with ICS traffic within a 10-second window
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID IN [1000,1001] AND process IN critical_hmi_scada AND faulting_module IN ['tcpip.sys','afd.sys',
      low_level_drivers]; corr = match(zeek_conn where (orig_h OR resp_h)=field_device AND resp_p IN ics_ports,
      within=10s); if corr => alert
- question: Are the exception/bugcheck codes seen on a critical workstation in the bottom 5th percentile
    of historical frequency, or is the per-asset crash rate (count/min) spiking, especially when correlated
    with ICS traffic?
  context: Rootkit-induced instability tends to manifest as rare, unusual exception codes and elevated
    crash rates rather than the common faults a system normally produces. Alert on exception or bugcheck
    codes that fall in the bottom 5th percentile of historical FREQUENCY for that asset (novel/rare faults)
    and on spikes in the crash RATE (count per minute), escalating when these correlate with ICS traffic
    to field devices. Treat repeated faults as a distinct failure-state signal, and compare the process's
    behavior against its normal short-sequence baseline so deviations from known-good execution sequences
    are surfaced. In the Inhibit Response Function tactic a cluster of rare exceptions or a crash-rate
    spike coincident with control traffic supports the hypothesis that a rootkit is destabilizing the
    operator workstation; common exception codes at normal rates are routine.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Operator Workstations, SCADA Engineering Workstations, Process
    Control Workstations, Remote Access Jump Hosts for OT.'
  range: Last 90 days; per-asset frequency and rate baselines
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per asset: freq distribution of exception/bugcheck codes; alert if code in bottom_p5(frequency)
      (rare) OR crash_rate(count/min) > p99(baseline); escalate if correlated with ics_traffic; compare
      to normal short-sequence process baseline'
- question: Does an anomaly model over crash features (faulting module, exception code, preceding syscalls/driver
    loads, correlated flow) flag a deviation beyond normal failure modes, and does a whole-system provenance
    graph reconstruct a causal chain from a driver load to the crash?
  context: To separate rootkit-caused crashes from benign software faults, model the full context around
    each crash. Train an anomaly model on crash features including faulting module, exception code, the
    preceding syscalls and driver loads, and any correlated network flow, and alert on deviations beyond
    the asset's normal failure modes, selecting and tuning the detector per established CPS anomaly-detection
    guidance. In parallel reconstruct the causal chain with whole-system provenance graphs (KAIROS / ThreaTrace)
    and surface the top-3 contributing nodes/features for triage, so an analyst can see, for example,
    an unsigned driver load preceding the I/O fault and crash. In the Inhibit Response Function tactic
    a positive result is an explainable, context-rich indication that a rootkit/BYOVD driver is destabilizing
    critical control software; analysts should confirm against the deterministic crash-correlation rule
    since ML degrades on novel attacks.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Operator Workstations, SCADA Engineering Workstations, Process
    Control Workstations, Remote Access Jump Hosts for OT.'
  range: Last 90 days; crash-centered provenance reconstruction
  queries:
  - technology: ML/pseudocode
    query: feat = [faulting_module, exception_code, preceding_syscalls, preceding_driver_loads, correlated_flow];
      model = anomaly_detector(tuned per CPS guidance); alert if deviation > normal_failure_modes
  - technology: ML/Provenance-graph pseudocode
    query: g = whole_system_provenance(host events); chain = KAIROS_or_ThreaTrace(g, anchor=crash_event);
      reconstruct driver_load -> io_fault -> crash; emit top3 contributing nodes/features
