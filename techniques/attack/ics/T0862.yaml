name: 'T0862: Supply Chain Compromise'
id: 1a026572-c324-4792-9738-0977b09ba403
description: 'Investigate whether an adversary has gained access to the OT/ICS environment through a supply
  chain compromise: trojanized vendor software installers, malicious firmware or project files, counterfeit
  devices, or otherwise tampered products delivered through a trusted vendor relationship. This playbook
  helps an analyst hunt for the observable consequences of such a compromise across three vantage points.
  First, it correlates software-installation and firmware/project-download events on OT assets (Windows
  EID 4688/4697, Zeek files.log, vendor engineering-station logs) with subsequent outbound network behavior,
  looking for connections to threat-intel-flagged C2, statistically rare destinations (new ASN/country,
  anomalous outbound volume), beacon-to-dead-C2 failure spikes, and time-series flow anomalies. Second,
  it hunts for processes masquerading as legitimate ICS vendor applications via hash/allow-list violations,
  invalid or missing code signatures, abnormal paths/parents, path and argument entropy, and supervised/sequence/provenance
  modeling of installer behavior. Third, it inspects post-update industrial-protocol traffic from PLCs/RTUs/IEDs
  for unauthorized state-changing commands (Modbus, DNP3, S7comm, ENIP), use of non-industrial protocols,
  new peers, mined-invariant violations, and learned controller-traffic fingerprint anomalies. Together
  these questions combine deterministic integrity checks, statistical baselining, and machine learning
  to surface a supply-chain implant before or shortly after it acts.'
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: When a software, firmware, or project artifact is installed or downloaded onto an OT asset
    (Windows Event ID 4697/4688, Zeek files.log, or vendor engineering-station logs), does its SHA-256
    hash and code-signing chain match a per-vendor/per-model known-good allow-list, and are any artifacts
    with missing/invalid signatures or hash mismatches present?
  context: Supply-chain compromise begins when a tampered or substituted artifact is introduced into the
    environment, so the single most decisive control for Initial Access is to deterministically verify
    every installer, firmware image, and project file at the moment it is deployed. The analyst should
    compare each artifact's SHA-256 against a curated per-vendor/per-model known-good allow-list AND validate
    the Authenticode/code-signing chain to the expected publisher. A hash mismatch, a missing or invalid
    signature, or an artifact absent from the allow-list is a critical, high-fidelity signal that a trusted
    product was altered before receipt. Where an attestation pipeline (e.g., in-toto) exists, enforce
    signed supply-chain metadata so any substituted build step is rejected. For unknown firmware images
    that have no allow-list entry, triage with magic-byte unpacking, Shannon-entropy blob classification,
    and exact/fuzzy (ssdeep) hashing against known-good and known-bad corpora. A positive (mismatch) demands
    isolating the asset and quarantining the artifact; a clean match is a strong negative but does not
    rule out a not-yet-cataloged image.
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4697
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek files.log
  - Vendor engineering station logs
  - 'NAI: Network egress points from OT segments (e.g., OT DMZ firewalls), Engineering Workstations (EWS),
    Human-Machine Interfaces (HMIs), Historian servers, and IT/OT boundary firewalls.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on (EID=4697 OR EID=4688 OR zeek_files.log OR vendor_log) artifact_installed\n| compute sha256(artifact)\n\
      | if sha256 NOT IN knowngood_allowlist[vendor,model] OR signature_status IN (\"NotFound\",\"Invalid\"\
      ) OR signing_publisher != expected_publisher\n    -> alert severity=critical reason=\"supply-chain\
      \ integrity violation\"\n| for unknown_firmware: entropy=shannon(blob); ssdeep_match(blob, knownbad_corpus)\
      \ -> triage"
- question: In the 72 hours after a software installation event on an OT asset, does that asset make any
    outbound connection (Zeek conn.log joined to dns.log) to an IP or domain that appears on a threat
    intelligence feed of known C2 servers or malware drop sites?
  context: Empirically, malicious supply-chain payloads predominantly open outbound C2 or exfiltration
    connections at or just after install. The analyst should open a 72-hour monitoring window keyed on
    each install event, take all outbound connections from the asset's IP in conn.log, resolve the destinations
    to domains via dns.log, and match both IPs and domains against high-confidence CTI of C2/drop infrastructure.
    Any match is a high-severity event because it ties a freshly deployed artifact to known-bad infrastructure,
    strongly corroborating a trojanized installer used for Initial Access into OT. A hit warrants immediate
    host isolation and 5-tuple triage; the absence of a hit does not clear the asset, since attacker infrastructure
    may be unknown.
  answer_sources: *id001
  range: Last 90 days; pivot to a 72-hour window anchored on each software-install event
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'install_evt = (EID=4697 OR EID=4688) by asset_ip, time=t0

      conns = zeek_conn where id.orig_h=asset_ip AND ts BETWEEN t0 AND t0+72h

      join dns on conns.id.resp_h = dns.answers -> domain

      | where id.resp_h IN cti_c2_ip_list OR domain IN cti_c2_domain_list

      | alert severity=high tuple=orig_h+":"+orig_p+"->"+resp_h+":"+resp_p indicator=matched_feed'
- question: After a software update on an OT asset, do any of its outbound connections in the following
    72 hours go to a destination IP, ASN, or country absent from its 90-day rolling baseline, or carry
    outbound bytes above the 99th percentile of the asset's historical connection sizes?
  context: Because attacker infrastructure is frequently unknown to CTI, rarity is a powerful complement
    to signature matching. For each OT asset, maintain a 90-day rolling baseline of destination IPs, ASNs,
    and countries, plus the distribution of per-connection outbound bytes. In the 72 hours after an update,
    flag any connection to a new ASN or new country (medium severity) and any connection whose orig_bytes
    exceeds the asset's own 99th-percentile outbound size (medium severity, possible exfiltration). Thresholds
    must be derived per-asset from its own distribution, not from fleet-wide constants, because OT assets
    are highly deterministic and individually distinctive. To catch algorithmically generated C2 domains,
    add stateless lexical/entropy features (queried-domain Shannon entropy, label length) scored with
    an Isolation Forest. New-destination plus large-transfer coincidence right after an update is a classic
    supply-chain implant calling home.
  answer_sources: *id001
  range: Last 90 days rolling baseline; evaluate within 72 hours after each update
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline[asset] = distinct(resp_ip,resp_asn,resp_country) over 90d ; p99_orig=pctl(orig_bytes,99)

      post = zeek_conn where orig_h=asset AND ts in [update_t0, update_t0+72h]

      | if post.resp_asn NOT IN baseline.asn OR post.resp_country NOT IN baseline.country -> alert sev=medium
      reason=new_dest

      | if post.orig_bytes > p99_orig -> alert sev=medium reason=anomalous_outbound_volume

      | domain_entropy=shannon(query); IsolationForest([domain_entropy,label_len]) -> dga_score'
- question: In the 72 hours after an install, does the OT asset show a statistically significant spike
    in failure-mode signals -- DNS NXDOMAIN responses, rejected/reset connection states (REJ, RSTO, S0),
    or firewall-denied egress attempts -- relative to its baseline?
  context: A freshly deployed implant often beacons to dead, sinkholed, or firewall-blocked C2, producing
    telltale failure bursts even when the destination itself is unknown to CTI. The analyst should track,
    per asset within the 72-hour post-install window, the rate of DNS NXDOMAIN responses (dns.log rcode),
    the count of REJ/RSTO/S0 connection states in conn.log, and firewall egress denials. A spike greater
    than 3 standard deviations above the asset's baseline, or more than 5 NXDOMAIN per minute, indicates
    beacon-to-dead-C2 or blocked-callback behavior typical of a newly introduced supply-chain payload.
    These error-rate signals are treated as distinct features from successful connections and are valuable
    precisely because they fire when the malware's infrastructure is not yet reachable.
  answer_sources: *id001
  range: Last 90 days baseline; evaluate per 72-hour post-install window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "win = [install_t0, install_t0+72h]\nnxd = count(dns where rcode=NXDOMAIN AND orig_h=asset)\
      \ ; rej = count(conn where conn_state IN (REJ,RSTO,S0))\nfwdeny = count(fw_log where action=deny\
      \ AND src=asset)\n| if nxd_rate > mean_base+3*sd_base OR nxd_per_min>5 OR rej > mean_base+3*sd_base\
      \ OR fwdeny spike\n    -> alert sev=medium reason=\"beacon-to-dead-C2 / blocked-callback\""
- question: Does a time-series anomaly model (e.g., LSTM autoencoder or an online autoencoder ensemble
    such as Kitsune/KitNET) trained on critical OT assets' network-flow sequences produce a sustained
    reconstruction-error score above its 99th-percentile threshold after a software update, and which
    top features drive that error?
  context: Supply-chain implants change an asset's flow behavior in ways that escape single-rule logic
    but are captured by sequence models. Train an LSTM autoencoder or online KitNET ensemble on per-asset
    flow sequences from conn.log using features such as destination port, protocol, connection duration,
    total bytes (orig+resp), connection state, and time-of-day/day-of-week. After an update, stream the
    asset's live flows through the model; a sustained reconstruction error above the learned 99th percentile
    signals a meaningful behavioral deviation and merits a high-severity alert. Critically, the alert
    must surface the top-3 features contributing to the error (per-feature error or SHAP) so the analyst
    sees why it fired, not just a score, enabling fast triage and reducing alert fatigue in the OT SOC.
  answer_sources: *id001
  range: Train on 90+ days; score in real time, focused on post-update windows
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [resp_port,proto,duration,orig_bytes+resp_bytes,conn_state,hour,dow]\nmodel = LSTM_AE.fit(asset_flow_sequences[90d])\
      \  # or KitNET online ensemble\nscore = model.reconstruction_error(live_flow)\n| if score > pctl(train_error,99)\
      \ sustained -> alert sev=high\n    explain = top3_feature_error(live_flow)  # or SHAP attribution"
- question: Where whole-system audit telemetry exists on EWS/HMI hosts, can a provenance-graph IDS link
    an installer process to the files it dropped and the outbound connections those artifacts subsequently
    made, producing a compact causal subgraph for triage?
  context: 'The strongest confirmation of a trojanized installer is a causal chain: installer process
    -> dropped binary -> outbound C2/exfil. Where EWS/HMI hosts collect whole-system provenance (process,
    file, and network events), apply a provenance-graph IDS (e.g., KAIROS) to reconstruct and score the
    install-to-egress chain, emitting a small, analyst-readable subgraph rather than thousands of raw
    events. This directly addresses Initial Access via supply chain by showing exactly how a substituted
    product established a foothold and reached out. A flagged subgraph linking a recently installed vendor-named
    binary to anomalous file drops and external connections is high-fidelity evidence and should drive
    immediate scoping of impacted OT hosts.'
  answer_sources: *id001
  range: Last 90 days; anchor graph extraction on install events
  queries:
  - technology: Provenance-graph IDS/pseudocode
    query: 'graph = build_provenance(host_audit_events)  # process->file->network edges

      anomaly_subgraphs = KAIROS.score(graph)

      | where subgraph links installer_proc -> dropped_file -> outbound_conn(external)

      | emit causal_subgraph sev=high for analyst triage'
- question: Is any process whose name matches a critical ICS vendor application created with a file hash,
    file path, or parent process that violates the application allow-list (e.g., a known process name
    with a hash mismatch, execution from a disallowed path, or an unauthorized parent such as winword.exe/outlook.exe)?
  context: Application allow-listing on engineering workstations is the prescribed OT baseline (NIST SP
    800-82r3). Maintain an allow-list mapping each critical ICS application's process name to its known-good
    hash(es), expected install path(s), and authorized parent process(es). Monitor Sysmon Event ID 1 and
    Windows Event ID 4688 and raise a high-severity alert whenever a process matching a vendor name violates
    any dimension of the allow-list. This catches a trojanized binary that reuses a legitimate vendor
    name but runs from C:\Temp\, carries a mismatched hash, or is spawned by an Office/mail application
    -- all hallmarks of a supply-chain or phishing-delivered payload seeking Initial Access on the process
    control network. A violation is high-fidelity and should trigger immediate host containment.
  answer_sources: &id002
  - Windows Event ID 4688
  - Sysmon Event ID 1 (Process Creation)
  - File hash repository
  - 'NAI: Endpoint devices within the Process Control Network (PCN) and Manufacturing Zone, specifically
    Engineering Workstations, HMIs, application servers, and other Windows-based OT assets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on (Sysmon EID=1 OR EID=4688) proc\n| where proc.name IN ics_allowlist.names\n| if proc.sha256\
      \ NOT IN ics_allowlist[proc.name].hashes\n   OR proc.path NOT IN ics_allowlist[proc.name].paths\n\
      \   OR proc.parent NOT IN ics_allowlist[proc.name].parents\n   -> alert severity=high reason=\"\
      vendor-app allowlist violation\""
- question: For every process whose name matches a known ICS vendor application, is there a valid Authenticode
    signature chained to the expected publisher AND a hash present on the per-model allow-list, or does
    the binary carry a NotFound/Invalid signature or an unknown hash?
  context: Trojanized installers reuse genuine vendor names and icons but cannot reproduce a valid signing
    chain or a cataloged hash. For any vendor-named binary, deterministically require both a valid Authenticode
    signature to the expected publisher and a hash on the per-model allow-list; treat any 'NotFound'/'Invalid'
    signature or unknown hash as a critical alert. This is a Floor-of-Determinism check that should never
    be disabled, because it converts the attacker's masquerade into a detectable integrity failure. A
    positive finding (broken integrity on a binary impersonating a trusted ICS product) is among the clearest
    indicators of supply-chain-driven Initial Access and warrants isolating the EWS/HMI and pulling the
    binary for analysis.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "on proc (Sysmon EID=1 / EID=4688) where proc.name IN vendor_app_names\n| if proc.signature_status\
      \ IN (\"NotFound\",\"Invalid\")\n   OR proc.signing_publisher != expected_publisher[proc.name]\n\
      \   OR proc.sha256 NOT IN permodel_allowlist\n   -> alert severity=critical reason=\"masquerading\
      \ vendor binary - integrity failure\""
- question: For each process creation event, does the Shannon entropy of the full file path or of the
    command-line arguments exceed the 95th percentile of the per-host, per-process-name baseline built
    over the last 30 days?
  context: Malware often executes from randomized paths and with obfuscated arguments, both of which raise
    Shannon entropy relative to the deterministic paths and arguments of legitimate ICS software. For
    each Sysmon EID 1 event, compute the entropy of the file path and the command line, and compare to
    a per-host, per-process-name 30-day baseline. An entropy above the 95th percentile of that baseline
    is a medium-severity anomaly suggesting randomized paths or packed/obfuscated invocation typical of
    a trojanized or dropper component. The 95th-percentile cutoff must be derived from each host's own
    distribution so that ordinarily long but legitimate command lines do not generate noise. This statistical
    signal complements the deterministic allow-list/signature checks for Initial Access hunting.
  answer_sources: *id002
  range: Last 30 days baseline; evaluate continuously
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for proc in Sysmon EID=1:\n  path_H = shannon(proc.path); arg_H = shannon(proc.cmdline)\n\
      \  base = pctl(history[host,proc.name].entropy, 95)\n| if path_H > base.path95 OR arg_H > base.arg95\n\
      \    -> alert severity=medium reason=\"high path/arg entropy\""
- question: Does any host show a spike (>3 standard deviations over baseline) in signature-verification
    failures for vendor-named binaries, or does a newly installed binary spawn an unusual number of child
    processes or file-writes within 60 seconds of its first execution?
  context: 'Supply-chain payloads characteristically execute at install time and immediately spawn children,
    drop files, and connect out -- a behavioral burst distinct from steady-state operation. Profile two
    distinct features per host: the rate of signature-verification failures (''NotFound''/''Invalid'')
    for vendor-named binaries, and the count of child processes and file-writes a newly installed binary
    creates within 60 seconds of first run. A greater-than-3-standard-deviation spike over baseline on
    either signal is alertable and points to a freshly deployed implant unpacking and establishing itself.
    These failure-mode and burst signals catch malicious behavior even when the specific hash is unknown,
    strengthening Initial Access detection on OT endpoints.'
  answer_sources: *id002
  range: Last 90 days baseline; 60-second burst window per new binary
  queries:
  - technology: SIEM/Stats pseudocode
    query: "sigfail_rate[host] = count(sig_status IN(NotFound,Invalid) for vendor_named)/window\nburst\
      \ = count(children)+count(file_writes) within 60s of first_exec(new_binary)\n| if sigfail_rate >\
      \ mean+3*sd OR burst > mean_burst+3*sd\n    -> alert severity=high reason=\"install-time spawn/drop\
      \ burst or sig-fail spike\""
- question: Does a supervised classifier (e.g., Gradient Boosting or Random Forest) trained on labeled
    process-creation events score a new process as malicious with confidence > 0.9, and what are the top-3
    features driving that classification?
  context: A supervised model can fuse many weak masquerading signals into one decision. Train a Gradient
    Boosting or Random Forest classifier on labeled Sysmon EID 1 events using features such as parent
    process name, file-path depth, file-path entropy, command-line length and entropy, a boolean for whether
    the path is user-writable, and digital-signature status (Valid/Invalid/NotFound). Classify new process
    events in real time and raise a high-severity alert for any event scored malicious with confidence
    above 0.9. The alert text must list the top-3 contributing features (tree feature importance or SHAP)
    for explainability so analysts can validate the call quickly. This catches masquerading vendor-application
    processes that individually pass simpler checks but collectively look malicious -- a key Initial Access
    vector for supply-chain payloads.
  answer_sources: *id002
  range: Train on labeled history; classify continuously
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feat = [parent_name,path_depth,path_entropy,cmd_len,cmd_entropy,user_writable,sig_status]

      model = GradientBoosting.fit(labeled_proc_events)

      p = model.predict_proba(new_proc)[''malicious'']

      | if p > 0.9 -> alert severity=high explain=top3_feature_importance(new_proc)'
- question: When host audit/Sysmon streams are modeled as ordered sequences (LSTM) or as a provenance
    graph, do they reveal abnormal create-drop-connect chains characteristic of trojanized installers?
  context: 'Trojanized installers produce a recognizable temporal pattern: a process is created, it drops
    files, then it connects out. Model the host event stream as an ordered sequence with an LSTM to flag
    abnormal create-drop-connect chains, and where full provenance is collected use a provenance-graph
    IDS (e.g., KAIROS) to emit a causal subgraph linking the masquerading binary to its parent and its
    downstream actions. Sequence and provenance modeling captures the install-time behavior of a supply-chain
    payload even when individual events look benign, giving the analyst an interpretable narrative of
    how the foothold was established. A flagged sequence/subgraph centered on a vendor-named binary is
    strong corroboration of Initial Access via supply chain.'
  answer_sources: *id002
  range: Last 90 days; anchor on install/first-exec events
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = order(host_events by ts) -> LSTM.next_event_prob

      | if observed create->drop->connect chain has low likelihood -> flag

      graph = build_provenance(audit) ; KAIROS.score(graph)

      | emit causal_subgraph(masquerading_binary -> parent -> downstream) sev=high'
- question: Before any firmware image or project file is downloaded to a PLC/RTU/IED, is it verified against
    a valid signature and per-model known-good hash, and does the device's running/stored firmware still
    match its golden measurement on scheduled checks?
  context: Controllers are the crown jewels of an ICS, and a tampered firmware or project file delivered
    through a vendor channel is a direct supply-chain path to physical impact. Require a valid signature
    and a per-model known-good hash for every firmware image or project file before it is downloaded to
    a PLC/RTU/IED, rejecting unsigned or altered images. Additionally, on a schedule, verify the device's
    running and stored firmware against a golden measurement using a Root of Trust for Detection (NIST
    SP 800-193). A signature/hash mismatch at load time, or drift from the golden measurement, is critical
    evidence that a trusted controller artifact was compromised. This deterministic check is the primary
    barrier against supply-chain Initial Access reaching Level 1 devices.
  answer_sources: &id003
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Industrial Firewall logs
  - 'NAI: Network segments at Level 1 (Basic Control) and Level 2 (Area Supervisory Control) of the Purdue
    Model, particularly network taps and span ports monitoring traffic to/from PLCs, RTUs, and IEDs.'
  range: Last 90 days; scheduled golden-measurement comparisons
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'on firmware_download(controller) OR project_download(controller):

      | if signature invalid OR sha256 NOT IN permodel_knowngood -> alert severity=critical reason="unverified
      controller artifact"

      schedule: measure(running_firmware) vs golden_measurement

      | if mismatch -> alert severity=critical reason="firmware drift from RoT golden image"'
- question: After a firmware/project update, does any industrial-protocol packet (Modbus, S7comm, DNP3,
    ENIP) carry a critical state-changing command from a source IP not on the authorized allow-list, or
    fail to match the strict (Source IP, Dest IP, Protocol, Function Code) allow-list for that controller?
  context: A compromised firmware or project, or an attacker who pivoted to the control network, may issue
    dangerous commands such as Modbus FC5/6 writes, DNP3 cold/warm restart, or S7comm Stop/Run. For critical
    controllers, define a strict allow-list of (Source IP, Dest IP, Protocol, Function Code) tuples and
    monitor Zeek's modbus.log, s7comm.log, dnp3.log, and enip.log. Raise an immediate critical alert when
    a packet matches a deny-list rule (e.g., any non-'Authorized EWS' IP sending an S7comm Stop) or fails
    to match any allow-list entry. Use auto-generated protocol-semantic rules (valid function codes, command/response
    pairing, point ranges) for DNP3/Modbus/IEC 61850 to keep rules robust and low-false-positive. An unauthorized
    state-changing command post-update is a high-confidence indicator of a supply-chain compromise translating
    into control over OT.
  answer_sources: *id003
  range: Last 90 days; focus on post-update windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "crit_fc = {modbus:[5,6], dnp3:[1,2], s7comm:[Stop,Run]}\non ics_proto_pkt (modbus/s7comm/dnp3/enip):\n\
      | if (src_ip,dst_ip,proto,func_code) NOT IN allowlist[controller]\n   OR (func_code IN crit_fc AND\
      \ src_ip NOT IN authorized_ews)\n   -> alert severity=critical reason=\"unauthorized control command\""
- question: Do any deterministic process invariants -- predicates over correlated sensor/actuator values
    that always hold in normal operation, mined from historian logs -- become violated after a firmware/project
    change?
  context: Tampered firmware or a malicious project file may drive the physical process outside its safe
    envelope in ways that pure network rules cannot see. Mine deterministic invariants (predicates over
    correlated sensor and actuator values that always hold during normal operation) from historian logs
    and enforce them as explainable runtime checks. When a compromised controller drives the process out
    of spec, an invariant breaks and yields a named, human-readable violation (e.g., 'valve open while
    downstream pressure falling') that an operator can immediately understand. Invariant violations after
    a supply-chain-delivered firmware/project change are strong, interpretable evidence that the artifact
    was malicious, bridging cyber detection and physical-process safety.
  answer_sources: *id003
  range: Last 90 days; evaluate continuously, emphasize post-update
  queries:
  - technology: Historian/Invariant pseudocode
    query: "invariants = mine_invariants(historian_normal_ops)  # e.g., P_down rises when valve opens\n\
      on live_telemetry:\n| for inv in invariants: if NOT inv.holds(sensor,actuator) -> alert severity=high\n\
      \    reason = inv.human_readable_violation"
- question: Within any 24-hour period after an update, does a controller communicate with a new peer IP,
    use an industrial-protocol function code absent from its 90-day baseline, or exceed its baseline hourly
    data volume by more than 3 standard deviations?
  context: Controllers are exceptionally deterministic communicators, so deviations are meaningful. Build
    a 90-day per-controller baseline from conn.log and protocol logs comprising its set of peer IPs, its
    destination ports/protocols, the frequency distribution of function codes it uses, and the mean and
    standard deviation of hourly data volume. Over each 24-hour window, raise a medium-severity alert
    if the device talks to a new peer IP, uses a function code never seen in baseline, or its hourly volume
    exceeds the baseline mean by more than 3 standard deviations. Modbus flow/timing/function-code features
    give interpretable separation, and the 3-sigma bands should be derived per device. A post-update appearance
    of new peers, new function codes, or volume surges suggests the controller's behavior was altered
    by a compromised artifact.
  answer_sources: *id003
  range: Last 90 days baseline; 24-hour evaluation windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base[ctrl] = {peers:set, ports:set, fc_hist:dist, vol:mean/sd} over 90d

      win = last 24h after update

      | if win.peer NOT IN base.peers -> alert sev=medium reason=new_peer

      | if win.func_code NOT IN base.fc_hist -> alert sev=medium reason=new_function_code

      | if win.hourly_vol > base.vol.mean + 3*base.vol.sd -> alert sev=medium reason=volume_spike'
- question: After an update, does a controller exhibit a surge in industrial-protocol error/exception
    responses or rejected commands, an elevated rate of restart/Stop/Run commands per hour, or a predict-then-threshold
    residual on its periodic traffic that exceeds the learned threshold?
  context: 'Manipulated controllers and freshly deployed implants generate distinctive failure-mode and
    frequency signals. Profile, as distinct features: the rate of exception/error responses or rejected
    commands in the industrial-protocol logs, the count of restart/Stop/Run commands per hour, and the
    residual from a predict-then-threshold model of the controller''s normally periodic reporting volume.
    A surge in command frequency, a spike in error responses, or a residual exceeding the learned threshold
    is alertable and may indicate that a compromised firmware/project is issuing abnormal control actions
    or that the device is being probed/driven by an attacker. These signals are robust because ICS traffic
    is highly periodic, so deviations from the expected cadence stand out.'
  answer_sources: *id003
  range: Last 90 days baseline; evaluate post-update
  queries:
  - technology: SIEM/Stats pseudocode
    query: "err_rate = count(exception/error/rejected responses)/window\nrestart_rate = count(func_code\
      \ IN {restart,Stop,Run})/hour\nresid = |observed_periodic_volume - predicted| ; thr = learned_threshold\n\
