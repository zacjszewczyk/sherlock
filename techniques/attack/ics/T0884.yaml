questions:
- question: '[Command And Control] Alert on external-to-internal fan-out via ICS host: Can you determine
    whether an ICS host (e.g., Engineering Workstation, HMI) exhibits a ''fan-out'' network pattern: it
    receives an inbound connection from an external IP address not belonging to defined internal network
    ranges, and subsequently, within a 5-minute window, initiates outbound connections to 5 or more distinct
    internal ICS assets (e.g., PLCs, RTUs) with which it has not communicated in the preceding 30 days.
    This abrupt change from a static communication baseline is highly anomalous in a deterministic ICS
    environment. -- specifically by applying the ''Alert on external-to-internal fan-out via ICS host''
    approach (Symbolic Logic)?'
  context: 'Why this matters: Under the Command And Control tactic (TA0101), an adversary may use a compromised
    ICS host as a connection proxy to relay command and control communications, directing traffic between
    external infrastructure and internal ICS assets to manage C2, add resilience, and ride trusted paths
    to avoid suspicion. This evidence focuses on the following condition: An ICS host (e.g., Engineering
    Workstation, HMI) exhibits a ''fan-out'' network pattern: it receives an inbound connection from an
    external IP address not belonging to defined internal network ranges, and subsequently, within a 5-minute
    window, initiates outbound connections to 5 or more distinct internal ICS assets (e.g., PLCs, RTUs)
    with which it has not communicated in the preceding 30 days. This abrupt change from a static communication
    baseline is highly anomalous in a deterministic ICS environment. The ''Alert on external-to-internal
    fan-out via ICS host'' approach (Symbolic Logic) works as follows: In Zeek conn.log detect an inbound
    connection to a known ICS host where id.orig_h is external (not in defined internal IT/OT CIDR ranges);
    then search for >=5 subsequent NEW outbound connections from that host to unique internal ICS assets
    within a 5-minute window, where ''new'' = a (src,dst) edge not seen in the prior 30 days. Trigger
    high severity and enrich with the initiating process (Windows Event ID 4688), logon user (4624), and
    asset criticality from inventory. Layer this deterministic floor under proxy-tooling/LOLBin network-initiation
    signatures (SOCKS, Tor, ngrok, chisel, Squid, unusual process making connections) from [SigmaHQ](https://github.com/SigmaHQ/sigma)
    and the relay-correlation framing of [MITRE ATT&CK T1071.004 / DET0400](https://attack.mitre.org/techniques/T1071/004/).
    Failure Mode (per [MITRE DET0400](https://attack.mitre.org/techniques/T1071/004/)): separately count
    failed/blocked outbound attempts (Windows Event ID 5157, Zeek conn.state S0/REJ/RSTO) from the host
    in the same window; a burst of failed connections to many internal hosts (scanning to find relay targets)
    is itself a distinct high-severity signal even if <5 succeed. A positive result -- a deterministic
    rule match, a statistical outlier, or a model alert -- indicates probable connection-proxy/relay activity;
    pivot to the implicated intermediary host, the initiating process and logon user, the external source
    IP/ASN, the set of internal ICS assets contacted and their criticality, the protocols and ports involved,
    and the volume, timing, and success/failure ratio of the connections to scope the relay. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land proxying
    in a deterministic OT environment.'
  answer_sources: &id001
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Asset Inventory DB
  - 'NAI: Network perimeters between IT and OT zones (e.g., IT/OT firewalls), ICS DMZ hosts, jump servers,
    and critical ICS assets such as Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data
    Historians, and SCADA servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Detect external inbound to ICS host, then fan-out to >=5 new internal ICS assets in 5 min\n\
      inbound = conn.log where dst in ICS_HOST_LIST and orig_h NOT in INTERNAL_CIDR\nfor each inbound\
      \ (host=resp_h, t0):\n  newdst = conn.log where orig_h=host and resp_h in INTERNAL_ICS\n       \
      \                 and ts between t0 and t0+5min\n                        and (orig_h,resp_h) NOT\
      \ seen in prior 30 days\n  if count(distinct newdst.resp_h) >= 5:\n     alert(severity=HIGH)\n \
      \    enrich(process=EID4688, user=EID4624, criticality=AssetInventory)\n// Failure-mode: burst of\
      \ failed outbound\nfails = conn.log where orig_h=host and conn_state in (S0,REJ,RSTO)\n        OR\
      \ EID5157(block) ts in [t0,t0+5min]\nif count(distinct fails.resp_h) >= 5: alert(severity=HIGH,\
      \ reason=relay-scan)"
- question: '[Command And Control] Baseline daily unique internal destinations per host: Can you determine
    whether an ICS host (e.g., Engineering Workstation, HMI) exhibits a ''fan-out'' network pattern: it
    receives an inbound connection from an external IP address not belonging to defined internal network
    ranges, and subsequently, within a 5-minute window, initiates outbound connections to 5 or more distinct
    internal ICS assets (e.g., PLCs, RTUs) with which it has not communicated in the preceding 30 days.
    This abrupt change from a static communication baseline is highly anomalous in a deterministic ICS
    environment. -- specifically by applying the ''Baseline daily unique internal destinations per host''
    approach (Statistical Method)?'
  context: 'Why this matters: Under the Command And Control tactic (TA0101), an adversary may use a compromised
    ICS host as a connection proxy to relay command and control communications, directing traffic between
    external infrastructure and internal ICS assets to manage C2, add resilience, and ride trusted paths
    to avoid suspicion. This evidence focuses on the following condition: An ICS host (e.g., Engineering
    Workstation, HMI) exhibits a ''fan-out'' network pattern: it receives an inbound connection from an
    external IP address not belonging to defined internal network ranges, and subsequently, within a 5-minute
    window, initiates outbound connections to 5 or more distinct internal ICS assets (e.g., PLCs, RTUs)
    with which it has not communicated in the preceding 30 days. This abrupt change from a static communication
    baseline is highly anomalous in a deterministic ICS environment. The ''Baseline daily unique internal
    destinations per host'' approach (Statistical Method) works as follows: For each ICS host compute
    a 30-day rolling baseline (mean, std dev, 99th percentile) of the daily count of unique internal destination
    IPs and total outbound bytes from Zeek conn.log (Physics: Volume + Frequency). Alert (medium) when
    the current day exceeds mean+3*std or the 99th percentile. Because ICS polling is inherently periodic,
    apply role-aware period/jitter baselines to avoid flagging legitimate cyclic polls, following [Mack
    et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf). Add a Failure-State
    feature: the ratio of failed/reset (S0/REJ/RSTO) to established (SF) connections per host per day;
    a simultaneous rise in unique destinations AND failure ratio sharply raises confidence. Combine the
    destination Z-score, failure-ratio Z-score, external source ASN reputation, and destination asset
    criticality into a composite priority score. A positive result -- a deterministic rule match, a statistical
    outlier, or a model alert -- indicates probable connection-proxy/relay activity; pivot to the implicated
    intermediary host, the initiating process and logon user, the external source IP/ASN, the set of internal
    ICS assets contacted and their criticality, the protocols and ports involved, and the volume, timing,
    and success/failure ratio of the connections to scope the relay. A negative result helps rule out
    this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land proxying in a deterministic
    OT environment.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// 30-day rolling baseline of daily unique internal destinations + bytes per ICS host\nbaseline\
      \ = rolling30d(per host: mean,std,p99 of daily distinct(resp_h), sum(orig_bytes))\ntoday = per host:\
      \ distinct(resp_h), sum(orig_bytes) from conn.log\nfail_ratio = count(state in S0,REJ,RSTO) / count(state=SF)\
      \ per host per day\nif today.distinct > mean+3*std OR today.distinct > p99:\n   score = z(distinct)\
      \ + z(fail_ratio) + asn_reputation(ext_src) + asset_criticality\n   alert(severity=MEDIUM, priority=score)\n\
      // role-aware periodicity to suppress legitimate cyclic polling"
