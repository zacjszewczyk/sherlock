name: 'T0884: Connection Proxy'
id: 7def1321-0cef-4092-899b-9846798bd02b
description: 'This playbook helps an analyst investigate whether an adversary is using a connection proxy
  to relay command and control (C2) traffic through a compromised host inside an ICS/OT environment (MITRE
  ATT&CK for ICS T0884, Connection Proxy). In deterministic OT networks, an attacker may subvert an engineering
  workstation (EWS), HMI, data historian, SCADA server, jump server, or OT-DMZ host so it acts as an intermediary
  -- accepting an inbound connection from an external IP and then fanning out to internal ICS assets (PLCs,
  RTUs) on native ICS protocols (Modbus/TCP 502, DNP3 20000, S7 102, EtherNet/IP 44818), often to manage
  C2, reduce simultaneous outbound connections, gain resilience, or ride trusted communication paths to
  avoid suspicion. The hunt pursues this behavior from several complementary angles: an external-to-internal
  ''fan-out'' pattern where a host abruptly contacts many new internal ICS assets after an external inbound
  connection; relay of external connections into native ICS protocols through designated intermediaries;
  and C2 protocol tunneling (high-entropy/long DNS queries, anomalous HTTP user-agents, rare TLS JA3/JA4
  fingerprints, oversized ICMP payloads) followed by new internal ICS connectivity. Detection methods
  combine deterministic symbolic-logic rules (external-source fan-out thresholds, ICS-port relay windows,
  threat-intel and change-management cross-referencing, tunneling indicators, and failed/blocked-connection
  failure modes), statistical baselining (rolling per-host unique-destination and byte-volume baselines,
  relay-tuple baselines, tunneling-metric baselines, failure-ratio features, and composite priority scoring
  with role-aware periodicity), and machine learning (graph anomaly detection of proxy centrality and
  new edges, sequence/HMM/LSTM modeling of connection-state transitions and beaconing, and supervised/unsupervised
  tunneling classifiers), applied across Zeek conn/dns/http/ssl/icmp logs, Windows Security and process-creation
  events, asset inventory, threat intelligence, and change management records, so the analyst can corroborate
  suspected connection-proxy/relay activity against host, user, network, protocol, and volume context.'
type: technique
related:
- tactic_id: TA0101
  tactic_name: Command And Control
contributors:
- Zachary Szewczyk
