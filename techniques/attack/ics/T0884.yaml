- question: '[Command And Control] Correlate tunneling indicators with internal connections: Can you determine
    whether a host exhibits network traffic consistent with C2 protocol tunneling, followed by new connections
    from that host to internal ICS assets within 60 seconds. Tunneling evidence includes anomalies in
    legitimate protocols, such as DNS queries with length > 64 characters or Shannon entropy > 4.0; HTTP/S
    traffic with non-standard user-agents or high-entropy SNI values; or ICMP packets with unusually large
    payloads, indicating data exfiltration or C2 communications being encapsulated. -- specifically by
    applying the ''Correlate tunneling indicators with internal connections'' approach (Symbolic Logic)?'
  context: 'Why this matters: Under the Command And Control tactic (TA0101), an adversary may use a compromised
    ICS host as a connection proxy to relay command and control communications, directing traffic between
    external infrastructure and internal ICS assets to manage C2, add resilience, and ride trusted paths
    to avoid suspicion. This evidence focuses on the following condition: A host exhibits network traffic
    consistent with C2 protocol tunneling, followed by new connections from that host to internal ICS
    assets within 60 seconds. Tunneling evidence includes anomalies in legitimate protocols, such as DNS
    queries with length > 64 characters or Shannon entropy > 4.0; HTTP/S traffic with non-standard user-agents
    or high-entropy SNI values; or ICMP packets with unusually large payloads, indicating data exfiltration
    or C2 communications being encapsulated. The ''Correlate tunneling indicators with internal connections''
    approach (Symbolic Logic) works as follows: Detect tunneling indicators in real time and correlate
    to internal ICS connectivity. DNS: alert on Zeek dns.log query length > 64 chars or Shannon entropy
    > 4.0, or abnormal NULL/TXT volumes. HTTP/S: alert on suspicious User-Agents/URI patterns from [Unit
    42 Malleable C2](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/) and on rare/allowlist-miss
