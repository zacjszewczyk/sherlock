questions:
- question: When a critical ICS process such as HMIRuntime.exe, RSLogix.exe, or a Step7 component loads
    a DLL, is that module untrusted - i.e. unsigned or with an invalid signature, loaded from a user-writable
    or temporary directory, not on the per-process allowlist of legitimate imports, named to impersonate
    a system DLL, or matching a threat-intel hash blocklist?
  context: Hooking in ICS frequently begins with a legitimate process loading a tampered, renamed, or
    malicious DLL - the canonical case being Stuxnet wrapping/IAT-hooking the Step7 's7otbxdx.dll'. Building
    a per-process allowlist of known-good DLL full paths and hashes from a golden image and alerting on
    any deviation gives high-fidelity detection because legitimate ICS software has a stable, enumerable
    set of imports. Look for Sysmon Event ID 7 image loads under critical processes where the module is
    unsigned/invalid, sits in C:\Windows\Temp, C:\ProgramData or C:\Users\*\AppData, is off-allowlist,
    impersonates a system DLL (e.g. 'svch0st.dll', Levenshtein distance <=2 from a real name but different
    path/hash), or matches a known-bad hash. A positive result is a strong indicator of code redirection
    for unauthorized execution on the EWS/HMI; a negative result helps confirm module-load integrity on
    the asset.
  answer_sources: &id001
  - Windows Event ID 7 (Sysmon - Image Loaded)
  - Windows Event ID 8 (Sysmon - CreateRemoteThread)
  - ETW / OS API Execution (DC0021)
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Operator Stations, Process
    Control Servers (e.g., Historians, Domain Controllers in the PCN)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each Sysmon EventID=7 (ImageLoaded)
        WHERE Image IN critical_ics_processes (HMIRuntime.exe, RSLogix.exe, Step7 stack)
        ALERT IF (Signed == false OR SignatureStatus != "Valid")
           OR (ImageLoaded NOT IN per_process_dll_allowlist[Image])
           OR (ImageLoaded path UNDER {C:\Windows\Temp, C:\ProgramData, C:\Users\*\AppData})
           OR (levenshtein(basename(ImageLoaded), known_system_dll) <= 2 AND hash/path differ)
           OR (ImageLoadedHash IN threat_intel_blocklist)
- question: For DLLs loaded by critical ICS processes, is the module statistically rare across the fleet
    (prevalence below the 1st percentile), does its path or filename have anomalously high Shannon entropy,
    has its file size deviated from the historical average, or are failed/denied module-load events spiking?
  context: Rare modules are disproportionately malicious, so fleet-wide frequency analysis is a powerful
    complement to allowlisting. Compute the 30-day prevalence of each ImageLoadedHash across all ICS hosts
    and alert when a newly loaded module falls below the 1st percentile (tune to fleet size). High Shannon
    entropy in the path string or filename can indicate randomly generated or obfuscated DLL names dropped
    by malware; alert when entropy exceeds 3 standard deviations above the per-process mean for legitimate
    DLLs. A >10% deviation in file size from a known DLL's historical average suggests tampering or wrapping.
    Finally, spikes in failed/denied module-load and DLL-not-found events per process per hour accompany
    DLL search-order hijack attempts. Together these statistical signals surface novel hooking attempts
    that evade static rules, while a clean result raises confidence in normal operation.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      # Rarity
      baseline = prevalence(ImageLoadedHash) over 30d across all ICS hosts
      ALERT IF prevalence(new_load.ImageLoadedHash) < 1st_percentile
      # Entropy
      ALERT IF shannon_entropy(ImageLoaded.path) OR shannon_entropy(filename)
               > mean_per_process + 3*stddev
      # Size
      ALERT IF abs(FileVolume - hist_avg[DLL]) / hist_avg[DLL] > 0.10
      # Failure-mode
      count failed/denied module-load per process per hour; ALERT on spike
- question: Does an unsupervised anomaly model trained on benign module-load behavior of critical ICS
    processes flag a new DLL load as a high-scoring anomaly, and do the top contributing features (signature,
    path entropy, directory depth, user-writable flag, hash rarity) explain why?
  context: ICS baselines are stable, which makes one-class/benign-only training a good fit for catching
    novel hooking-related DLL loads that deterministic rules miss. Train on historical Sysmon Event ID
    7 data for critical ICS processes using features such as one-hot Signed/SignatureStatus, path entropy,
    directory depth, a user-writable-path flag, and a hash-rarity score. Isolation Forest provides a linear-time
    baseline; a One-Class SVM adds robustness against a poisoned baseline. Always surface the top-3 contributing
    features (e.g. 'unsigned', 'path entropy 4.9', 'hash prevalence 0.1%') in the alert via LIME/SHAP
    so the analyst can triage quickly. This model runs in parallel with - never replaces - the deterministic
    allowlist and signature rules. A high-scoring anomaly warrants investigation of possible hooking;
    a low score adds assurance the load is consistent with the learned-benign profile.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = IsolationForest(contamination=auto)  # + OneClassSVM in parallel
      features = [onehot(Signed,SignatureStatus), path_entropy,
                  directory_depth, user_writable_flag, hash_rarity_score]
      train on benign-only EventID=7 for critical_ics_processes
      score = model.decision_function(new_load.features)
      ALERT IF score is anomalous
        INCLUDE top-3 SHAP/LIME features in alert text
- question: Did a non-allowlisted critical ICS process call the hook-install APIs SetWindowsHookEx or
    SetWinEventHook, is there an allocate->write->execute injection chain bound to a single memory address
    within 60 seconds, or does an in-memory integrity check reveal IAT/inline trampoline hooks or an unbacked
    remote-thread start address?
  context: This is the most direct evidence of hooking. Legitimate callers of SetWindowsHookEx/SetWinEventHook
    are few and known, so any call from a non-allowlisted critical ICS process is suspicious. The classic
    injection precursor to hooking is the ordered chain VirtualAllocEx/NtMapViewOfSection -> WriteProcessMemory
    -> CreateRemoteThread/SetWindowsHookEx/QueueUserAPC, all bound to one target memory address within
    a short window; requiring that ordering sharply increases confidence. For high-value EWS/HMI hosts,
    periodically diff in-memory module code against the on-disk binary to expose IAT modifications and
    inline JMP/CALL trampolines that redirect code flow. Sysmon Event ID 8 remote threads whose StartAddress
    is unbacked memory or points into a foreign module are also strong injection signals. A positive result
    is high-confidence evidence of active hooking/injection for unauthorized execution; a negative result
    supports process-integrity assurance.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ALERT IF (process IN critical_ics_processes AND process NOT IN hook_installer_allowlist)
               AND OS_API_call IN {SetWindowsHookEx, SetWinEventHook}
      # Injection chain (same target address, within 60s)
      SEQUENCE VirtualAllocEx|NtMapViewOfSection -> WriteProcessMemory
               -> CreateRemoteThread|SetWindowsHookEx|QueueUserAPC
      # Integrity
      compare in_memory_module_code vs on_disk_binary -> flag IAT/inline JMP/CALL hooks
      ALERT IF EventID=8 StartAddress is unbacked OR in foreign module
- question: Does a critical ICS process initiate a network connection to a destination IP, port, or DNS
    domain never previously observed for that process, speak a protocol inconsistent with its function
    (e.g. an HMI using FTP/HTTP), reach out to the Internet when it historically only talks intra-PCN,
    or query a known-malicious domain?
  context: After hooking, a compromised ICS process may open a C2 channel or exfiltrate data. ICS processes
    have near-static, deterministic communications, so any new destination, port, or protocol is high
    signal. Correlate Sysmon Event ID 3 with Zeek conn.log to identify connections from critical ICS processes
    and alert when the DestinationIp/DestinationPort is off the per-process allowlist, when the protocol
    is not allowed for that process-destination pair (an HMI speaking FTP/HTTP is anomalous), or when
    an intra-PCN-only process suddenly reaches outbound/Internet. Concurrently match Zeek dns.log queries
    against a malicious-domain feed. A positive result suggests a hooked process has established external
    communication and should trigger containment; a negative result confirms the process's network behavior
    remains within its expected profile.
  answer_sources: &id002
  - Windows Event ID 3 (Sysmon - Network Connection)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Process Control Network (PCN) Segments, EWS, HMIs, Historian Servers, Network Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      JOIN Sysmon EventID=3 WITH Zeek conn.log ON src/process
      FOR connections WHERE Image IN critical_ics_processes
        ALERT IF (DestinationIp,DestinationPort) NOT IN per_process_net_allowlist
           OR Protocol NOT IN allowed_protocols[process,destination]
           OR (process historically intra-PCN AND destination is outbound/Internet)
      MATCH Zeek dns.log.query AGAINST malicious_domain_feed -> ALERT
- question: Against a 90-day baseline, is a connection from a critical ICS process going to a rare or
    first-ever destination, transferring byte volumes above the 99th percentile, beaconing at fixed intervals,
    or exhibiting spikes in NXDOMAIN/failed connections or high-entropy DNS queries indicative of tunneling
    or DGA?
  context: Statistical baselining catches stealthy C2 and exfiltration that allowlists may not anticipate.
    For each critical ICS process build a 90-day baseline of unique DestinationIp/DestinationPort pairs
    from Zeek conn.log and Sysmon Event ID 3, then alert when a new connection's destination falls in
    the bottom 1st percentile of frequency, and always flag first-ever destinations. Baseline byte volume
    (orig_bytes/resp_bytes) and connection frequency per process; alert when bytes exceed the 99th percentile
    or when fixed-interval, beacon-like connections appear. As failure-mode signals, count NXDOMAIN and
    failed/blocked connection rates per process and alert on spikes, and compute DNS query lexical Shannon
    entropy to flag high-entropy names indicative of tunneling or DGA from a hooked process. Positive
    results indicate likely covert channels; negative results support normal network behavior.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = unique (DestinationIp,DestinationPort) per process over 90d
      ALERT IF new_dest frequency < 1st_percentile OR dest is first-ever
      ALERT IF orig_bytes|resp_bytes > 99th_percentile per process
      ALERT IF connections show fixed-interval beaconing
      ALERT IF NXDOMAIN|failed_conn rate spikes per process
      ALERT IF shannon_entropy(dns.query) is high  # tunneling/DGA
- question: Does a benign-only autoencoder or Isolation Forest trained on per-process network features
    produce high reconstruction error for a connection from a critical ICS process, and do the top contributing
    features (unusual port/protocol/volume combination) explain the anomaly?
  context: An unsupervised model adds coverage for novel network patterns that escape the deterministic
    destination/protocol allowlist. Train a benign-only autoencoder (or Isolation Forest) on correlated
    network features per critical ICS process - DestinationIp, DestinationPort, Protocol, orig_bytes,
    resp_bytes, duration, connections/min - drawn from Sysmon Event ID 3 and Zeek conn.log. Alert on high
    reconstruction error, which flags unusual combinations of port, protocol, and volume that may represent
    C2 or exfiltration from a hooked process, and surface the top-3 contributing features in the alert
    for fast triage. The deterministic allowlist remains the floor; the model only extends coverage. High
    reconstruction error warrants investigation; low error indicates the connection matches learned-benign
    behavior.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = Autoencoder()  # or IsolationForest in parallel
      features = [DestinationIp, DestinationPort, Protocol,
                  orig_bytes, resp_bytes, duration, connections_per_min]
      train benign-only per critical_ics_process
      err = reconstruction_error(new_conn.features)
      ALERT IF err > threshold
        INCLUDE top-3 contributing features in alert
- question: When a process running at High or System integrity loads a DLL, does that module fail the
    strict allowlist of approved hashes and full paths, or is it unsigned/invalid-signature, or loaded
    from a user-writable directory - even if it carries a valid (possibly stolen-certificate) signature?
  context: 'Hooking for privilege escalation targets processes already running at High or System integrity,
    so a tampered DLL loaded there grants the adversary deep control. Enforce a strict allowlist of ImageLoadedHash
    and ImageLoaded full paths for all privileged ICS processes and raise a critical-severity alert on
    any Sysmon Event ID 7 where the parent IntegrityLevel is High or System and the module is off-allowlist,
    unsigned/invalid, or loaded from C:\Temp/C:\ProgramData. Crucially, do not treat a valid signature
    alone as benign: Stuxnet abused stolen-certificate signed drivers alongside a hooked Step7 DLL to
    gain privileged execution. A positive result is a high-priority privilege-escalation indicator; a
    negative result confirms privileged module-load integrity.'
  answer_sources: &id003
  - Windows Event ID 7 (Sysmon - Image Loaded)
  - ETW / OS API Execution (DC0021)
  - 'NAI: Engineering Workstations (EWS), Domain Controllers, Application Servers within the PCN'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR Sysmon EventID=7 WHERE parent.IntegrityLevel IN {High, System}
        ALERT (critical) IF ImageLoadedHash NOT IN privileged_allowlist
           OR ImageLoaded NOT IN privileged_path_allowlist
           OR Signed == false OR SignatureStatus != "Valid"
           OR ImageLoaded path UNDER {C:\Temp, C:\ProgramData}
      # NOTE: valid signature alone is NOT sufficient (stolen-cert abuse)
- question: For DLLs loaded into privileged ICS processes, is the module's fleet-wide hash prevalence
    below the 0.5th percentile, is its PE compile time newer than the parent binary or last patch date,
    is its path entropy >3 standard deviations above the per-process mean, or are there abnormal memory
    operations (RWX allocations, oversized writes) accompanying the load?
  context: Statistical and PE-metadata signals catch privileged hooking that mimics legitimate modules.
    Compute fleet-wide ImageLoadedHash prevalence over 30 days for privileged ICS processes and alert
    below the 0.5th percentile - a tighter threshold than for general processes because privileged loads
    should be especially uniform. A module whose PE compile time is newer than the parent process binary
    or the last system patch date is suspicious, suggesting freshly built malware. High path Shannon entropy
    (>3 SD above the per-process mean) indicates obfuscated drops. Finally, profile memory operations
    via ETW and alert on RWX allocations or oversized writes that deviate from the per-process baseline,
    which accompany injection that precedes hooking. Positive results indicate likely privilege-escalation
    hooking; negative results add assurance.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      ALERT IF prevalence(ImageLoadedHash) over 30d < 0.5th_percentile
      ALERT IF PE_compile_time(module) > min(parent_binary_time, last_patch_date)
      ALERT IF shannon_entropy(ImageLoaded.path) > mean_per_process + 3*stddev
      # Memory-op profiling via ETW
      ALERT IF RWX_allocation OR oversized_write deviates from per-process baseline
- question: Does a One-Class SVM trained on benign privileged-process module-load features flag a load
    as outside the learned boundary, with an Isolation Forest second opinion, and do the top contributing
    features (compile-time delta, hash prevalence, signature) justify the alert?
  context: For privileged ICS processes, train a One-Class SVM on benign-only Sysmon Event ID 7 features
    - signature status, path entropy, hash-prevalence score, a standard-system-directory flag, and compile-time
    delta - and flag loads falling outside the learned boundary. Run an Isolation Forest in parallel as
    a cheap second opinion. Always emit the top-3 contributing features per alert (e.g. 'compile-time
    newer than patch', 'hash prevalence 0.2%', 'unsigned') so analysts can judge relevance quickly. The
    deterministic allowlist remains the non-negotiable floor; the model extends coverage to novel privileged
    hooking attempts. A boundary violation warrants investigation as possible privilege escalation; an
    in-boundary load matches learned-benign behavior.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = OneClassSVM(kernel=rbf)  # + IsolationForest second opinion
      features = [signature_status, path_entropy, hash_prevalence_score,
                  standard_system_dir_flag, compile_time_delta]
      train benign-only on privileged_ics_processes EventID=7
      ALERT IF model.predict(new_load) == outlier
        INCLUDE top-3 SHAP/LIME features in alert
- question: Did a privileged ICS process (High/System integrity) call SetWindowsHookEx/SetWinEventHook
    without being on the allowlist of legitimate hook installers, does an in-memory vs on-disk diff reveal
    IAT/inline trampoline hooks, or does the observed DLL-injection/hook API sequence align with known
    malicious sequences?
  context: This targets the hooking mechanism directly in privileged context. Alert when a privileged
    ICS process calls SetWindowsHookEx/SetWinEventHook without being on the small allowlist of legitimate
    hook installers, since hook installation by a High/System process is a strong privilege-escalation
    indicator. Periodically diff in-memory module code against the on-disk binary to detect IAT modifications
    and inline trampoline hooks installed for escalation. Additionally, template-match the privileged
    DLL-injection/hook API sequence using Smith-Waterman alignment against a library of known malicious
    sequences to catch reordered or obfuscated variants. A positive result is high-confidence evidence
    of hooking-based privilege escalation; a negative result supports privileged-process integrity.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      ALERT IF process.IntegrityLevel IN {High,System}
               AND API_call IN {SetWindowsHookEx, SetWinEventHook}
               AND process NOT IN hook_installer_allowlist
      # Live integrity
      diff in_memory_module vs on_disk_binary -> flag IAT/inline trampoline hooks
      # Sequence alignment
      ALERT IF smith_waterman(observed_api_sequence, known_malicious_seqs) >= threshold
- question: After a suspicious DLL load or hook-install by a critical ICS process, did that same process
    (same ProcessGuid) spawn a child within 60 seconds that is on the LOLBin blocklist (cmd.exe, powershell.exe,
    bitsadmin.exe, rundll32.exe, mshta.exe) or whose command line contains '-enc', 'download', 'IEX',
    or 'FromBase64String'?
  context: Successful code injection via hooking often manifests as a critical ICS process spawning an
    unexpected child or a legitimate process with suspicious arguments. Trigger when a Sysmon Event ID
    7 for a critical ICS process matches suspicious criteria (unsigned, rare hash, or hook-install API)
    and is followed within 60 seconds by a Sysmon Event ID 1 from the same ProcessGuid. Raise a high-severity
    alert if the child is a known LOLBin or its command line shows encoding/download/in-memory-execution
    markers. Confidence rises sharply when the preceding allocate->write->execute hook chain is linked
    by a unified target address. A positive result strongly indicates injection-driven execution following
    hooking; a negative result indicates no risky descendant activity from the suspect process.
  answer_sources: &id004
  - Windows Event ID 7 (Sysmon - Image Loaded)
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon - Process Create)
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      LET hooked = Sysmon EventID=7 WHERE Image IN critical_ics_processes
                    AND (unsigned OR rare_hash OR hook_install_api)
      FOR Sysmon EventID=1 WHERE ParentProcessGuid == hooked.ProcessGuid
          AND timestamp within 60s of hooked
        ALERT (high) IF Child IN {cmd.exe,powershell.exe,bitsadmin.exe,rundll32.exe,mshta.exe}
           OR CommandLine CONTAINS {-enc, download, IEX, FromBase64String}
        RAISE confidence IF preceding alloc->write->execute chain shares target address
- question: Against a 90-day per-parent baseline, has a critical ICS process spawned a child name never
    seen before, issued a command line whose token set is >0.8 Jaccard distance from historical commands,
    or shown abnormal spawn-rate bursts or repeated failed launches?
  context: Baselining the process tree of each critical ICS parent catches injection results that bypass
    static blocklists. For each critical ICS parent, build a 90-day baseline of child process names and
    command-line argument token sets from Sysmon Event ID 1. Alert if a child process name has never been
    seen for that parent. For known children, tokenize the command line and compute Jaccard distance to
    historical token sets, alerting when distance exceeds 0.8 (a novel command structure). As state signals,
    track child-process creation frequency (count/min) and process-exit/error codes and alert on abnormal
    spawn bursts or repeated failed launches, which can indicate injected-payload activity or crashing
    exploit attempts. Positive results indicate anomalous descendant behavior consistent with hooking-driven
    execution; negative results support normal operation.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline_children = set of child names per parent over 90d
      baseline_tokens = historical command-line token sets per (parent,child)
      ALERT IF child_name NOT IN baseline_children[parent]
      ALERT IF jaccard_distance(tokenize(CommandLine), baseline_tokens) > 0.8
      # State signals
      track spawn frequency (count/min) and exit/error codes per parent
      ALERT on abnormal spawn bursts OR repeated failed launches
- question: Does a provenance/process graph built from Sysmon Event ID 1/7/8 flag a structurally rare
    event - such as a historian service loading a foreign DLL then creating powershell.exe - via a GNN
    or graph temporal autoencoder, with the top anomalous nodes/edges surfaced for triage?
  context: Graph-based detection captures the structural signature of hooking-driven privilege escalation
    that point rules miss. Build a provenance/process graph from Sysmon Event ID 1/7/8 where nodes are
    processes, modules, and threads and edges are parent-child, image-load, and remote-thread relations,
    enriched with integrity level, command-line TF-IDF, and module signature features. Apply node-level
    GNN detection (e.g. ThreaTrace) or a graph temporal autoencoder (e.g. KAIROS) that also reconstructs
    the attack footprint to flag structurally rare events - for example a historian service loading a
    foreign DLL and then creating powershell.exe. Surface the top-3 anomalous nodes/edges and their features
    in the alert, and keep the deterministic parent-child blocklist rules running in parallel. A high
    anomaly score warrants investigation of multi-step hooking/escalation; a low score adds assurance
    the process lineage is normal.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      graph: nodes={process,module,thread}, edges={parent-child,image-load,remote-thread}
      node_features = [integrity_level, commandline_TFIDF, module_signature]
      model = GNN(ThreaTrace)  # or graph temporal autoencoder (KAIROS)
      ALERT IF node/edge anomaly_score > threshold
        e.g. historian_service -> load foreign DLL -> create powershell.exe
        SURFACE top-3 anomalous nodes/edges + features; run blocklist rules in parallel
