name: 'T0874: Hooking'
id: 37c78f5f-9820-4ca0-859f-18c8fc7309ce
description: 'Investigate potential API hooking on critical ICS assets (Engineering Workstations, HMIs,
  Operator Stations, Historians, Domain Controllers and application servers within the Process Control
  Network). Adversaries hook API functions used by legitimate industrial processes - most notably via
  Import Address Table (IAT) hooking and DLL tampering/wrapping as seen with Stuxnet''s manipulation of
  the Step7 ''s7otbxdx.dll'' - to redirect execution, run unauthorized code, and escalate privileges.
  This playbook helps an analyst hunt for the observable consequences of hooking: critical or privileged
  ICS processes loading unsigned, invalid, rare, mis-located, or impersonating DLLs; calls to hook-install
  APIs (SetWindowsHookEx/SetWinEventHook); the allocate->write->execute process-injection chain; in-memory
  IAT/inline trampoline modifications; anomalous network destinations or protocols from hooked processes
  (potential C2 or exfiltration); and hooked processes spawning suspicious child processes or commands.
  It spans the Execution and Privilege Escalation tactics and combines deterministic allowlist/signature
  logic, statistical rarity and entropy analysis, and unsupervised machine-learning models.'
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
- tactic_id: TA0111
  tactic_name: Privilege Escalation
