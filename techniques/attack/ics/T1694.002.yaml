name: 'T1694.002: Hardcoded Credentials'
id: 45b17edf-29dc-4770-bfa8-599c28c0ce02
description: Investigate the use of credentials, cryptographic keys/certificates, or API tokens that are
  hardcoded in ICS software or firmware and reused by design across whole product lines or device families
  to gain unauthorized interactive sessions to assets. This playbook helps an analyst detect a non-service
  or shared engineering account authenticating to multiple ICS assets or product-line siblings within
  a short window; sessions matching a hardcoded-credential watchlist built from vendor documentation,
  firmware reverse-engineering, and prior incident data; structurally novel account/source/destination
  login triplets; failed-then-successful credential reuse bursts; machine-like session cadence indicative
  of a tool wielding an embedded credential; abrupt change-points in per-account access behavior; and
  rare authentication edges or anomalous sessions surfaced by graph link-prediction and one-class/isolation-forest
  models. Together these questions support an adversary attempting lateral movement through OT supervisory-control
  and process-control segments using embedded access material.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does a non-service or shared engineering account authenticate into more than one ICS asset
    within a single reconstructed login chain, or originate from a host that is not on the recognized
    maintenance/vendor-support remote-access allowlist?
  context: 'Hardcoded credentials are embedded in software/firmware and reused across devices rather than
    issued per user or per asset, so they tend to produce login chains that traverse multiple ICS assets
    from a single account. By correlating successful remote authentications (Windows Event ID 4624 and
    Zeek ssh/telnet/http/rdp logs) with Zeek conn.log on source IP, destination IP, and session timestamp,
    the analyst reconstructs causal login chains as in [Hopper: Modeling and Detecting Lateral Movement,
    Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf). A positive result is a non-service or
    shared engineering account reaching more than one ICS asset in one session chain, or any chain whose
    source host is not an approved maintenance/vendor platform per [NSA/CISA AA20-205A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-205a)
    - both consistent with reused embedded credentials enabling lateral movement through OT cells. A negative
    result is access confined to a single expected asset from an allowlisted host.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek http.log
  - Windows Event ID 4625
  - 'NAI: Supervisory-control and process-control network segments, including engineering workstations,
    HMIs, SCADA servers, and gateways between OT cells or zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN auth = (WinEventID=4624) WITH zeek_ssh, zeek_telnet, zeek_http, zeek_rdp\nON src_ip,\
      \ dst_ip, session_time (+/- window)\nENRICH WITH zeek_conn ON src_ip, dst_ip, ts -> reconstruct\
      \ login chains\nWHERE account IN (non_service OR shared_engineering)\nALERT IF distinct_dst_assets_in_chain\
      \ > 1\n   OR src_host NOT IN remote_access_allowlist"
- question: Has any successful authentication used an account/source-host/destination-asset triplet that
    has never been observed before, violating the learned login structure of the OT environment?
  context: Embedded credentials frequently create structurally novel access because a reused credential
    lets a new source host reach a destination it has no legitimate relationship with. Maintain a baseline
    of known-good account -> source-host -> destination-asset triplets and alert on any successful authentication
    that violates this learned structure, as described in [Detecting Structurally Anomalous Logins, Siadati
    and Memon](https://doi.org/10.1145/3133956.3134003); this surfaces hardcoded-credential abuse even
    when each individual login looks ordinary. A positive result is a successful logon using a source/destination
    pairing the account has never used; a negative result is a logon consistent with the account's historical
    structure. Tie any hit to the Lateral Movement context - novel triplets are how an adversary pivots
    between OT zones.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek http.log
  - Windows Event ID 4625
  - 'NAI: Supervisory-control and process-control network segments, including engineering workstations,
    HMIs, SCADA servers, and gateways between OT cells or zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "BASELINE good_triplets = SET(account, src_host, dst_asset) FROM last_90d successful_auth\n\
      STREAM successful_auth (4624 + zeek_*) \nWHERE (account, src_host, dst_asset) NOT IN good_triplets\n\
      ALERT \"structure-violating login\" WITH account, src_host, dst_asset"
- question: Does a single account generate a burst of failed logons (>= 5 in 5 minutes) across multiple
    distinct targets followed by a success, or achieve success across >= 3 distinct field devices within
    10 minutes?
  context: When a reused or embedded credential is tried across a device family, it often produces a characteristic
    failure-then-success pattern as the same secret is sprayed across siblings. By joining Windows Event
    ID 4625 (failed) with 4624 (success) per account and source host, the analyst can detect a burst of
    failed logons (>= 5 in 5 minutes) against multiple distinct targets immediately preceding a success,
    or any success across >= 3 distinct field devices within 10 minutes, per [Detecting Password Spraying
    Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).
    A positive result strongly suggests a credential being trialed across a product line - exactly the
    behavior expected from hardcoded credentials supporting lateral movement. A negative result is isolated,
    expected authentication activity without cross-target spray.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek http.log
  - Windows Event ID 4625
  - 'NAI: Supervisory-control and process-control network segments, including engineering workstations,
    HMIs, SCADA servers, and gateways between OT cells or zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "JOIN fail=(WinEventID=4625) success=(WinEventID=4624) BY account, src_host\nWINDOW 5m: cnt_fail\
      \ = count(distinct dst WHERE fail) \nALERT IF cnt_fail >= 5 AND followed_by success\nWINDOW 10m:\
      \ ALERT IF count(distinct dst_field_device WHERE success) >= 3"
- question: For each account and source host, does the rolling 30-minute count of distinct destination
    assets exceed both an absolute floor of five targets and the account's 90-day 99th-percentile fan-out?
  context: Hardcoded credentials are reused across many devices in the same product family, so an account
    wielding one will fan out to an abnormal number of destinations. Compute a rolling 30-minute count
    of distinct destination assets per (account, source host) and compare it against a 90-day baseline
    - alerting when it exceeds both an absolute floor of five targets and the account's 99th-percentile
    fan-out, per [Detecting Structurally Anomalous Logins, Siadati and Memon](https://doi.org/10.1145/3133956.3134003)
    - to flag this reuse statistically while controlling false positives. Tune the floor to local cell
    size using historical authentication data such as the [LANL authentication dataset](https://csr.lanl.gov/data/auth/).
    A positive result is anomalous multi-asset fan-out consistent with credential reuse for lateral movement;
    a negative result is fan-out within the account's normal envelope.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek http.log
  - Windows Event ID 4625
  - 'NAI: Supervisory-control and process-control network segments, including engineering workstations,
    HMIs, SCADA servers, and gateways between OT cells or zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH (account, src_host):\n  fanout = COUNT(DISTINCT dst_asset) OVER rolling 30m\n  baseline_p99\
      \ = percentile(fanout_history_90d, 99)\nALERT IF fanout > 5 AND fanout > baseline_p99"
- question: Do remote-access sessions for any (account, source, destination) show low-jitter, machine-like
    cadence (coefficient of variation < 0.1 over >= 5 sessions) in inter-arrival times and byte counts?
  context: A tool or script wielding an embedded credential tends to connect with regular, machine-like
    timing and consistent byte volumes, unlike an interactive operator. Compute the coefficient of variation
    (CoV) of session inter-arrival times and byte counts per (account, source, destination) in Zeek conn.log
    and flag low-jitter cadence (CoV < 0.1 over >= 5 sessions), as in [RITA, Active Countermeasures](https://github.com/activecm/rita)
    beacon analysis, to distinguish automated reuse of a hardcoded credential from human operator behavior.
    A positive result is highly regular automated sessions; a negative result is irregular, human-paced
    access. In the Lateral Movement context, this exposes automated tooling pivoting with embedded credentials.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek http.log
  - Windows Event ID 4625
  - 'NAI: Supervisory-control and process-control network segments, including engineering workstations,
    HMIs, SCADA servers, and gateways between OT cells or zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH (account, src, dst) IN zeek_conn WITH >= 5 sessions:\n  cov_iat = stddev(inter_arrival)\
      \ / mean(inter_arrival)\n  cov_bytes = stddev(orig_bytes) / mean(orig_bytes)\nALERT IF cov_iat <\
      \ 0.1 OR cov_bytes < 0.1   // machine-like beacon"
- question: Is there an abrupt, sustained change-point in any account's login rate or distinct-target
    fan-out time series that has no maintenance-window justification?
  context: The onset of hardcoded-credential abuse often appears as a sudden, sustained shift in an account's
    behavior. Apply CUSUM or PELT change-point detection to per-account time series of login rate and
    distinct-target fan-out, per [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/), to detect an abrupt increase that is
    not explained by a scheduled maintenance window. A positive result is a sustained behavioral break
    in an account that previously had stable, low fan-out - consistent with an adversary beginning to
    reuse an embedded credential to move laterally. A negative result is stable behavior or a change that
    aligns with an authorized maintenance activity.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek http.log
  - Windows Event ID 4625
  - 'NAI: Supervisory-control and process-control network segments, including engineering workstations,
    HMIs, SCADA servers, and gateways between OT cells or zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH account:\n  ts_rate = login_count per interval\n  ts_fanout = distinct_target_count\
      \ per interval\n  cp = CHANGEPOINT(ts_rate, ts_fanout)  // CUSUM or PELT\nALERT IF cp = sustained_increase\
      \ AND NOT in_maintenance_window"
- question: Which historical remote-access sessions fall in rare regions of feature space when scored
    by an unsupervised anomaly model, particularly multi-asset access originating from a single account?
  context: An unsupervised Extended Isolation Forest trained on historical remote-access sessions - using
    features such as source IP, destination IP, protocol, user account, destination asset family, session
    duration, fan-out, and time of day - can flag sessions in rare regions of feature space without labeled
    attack data, per [Extended Isolation Forest, Hariri et al](https://arxiv.org/pdf/1811.02141). Prioritizing
    multi-asset access from one account targets the signature of hardcoded-credential reuse. Surface the
    top-3 contributing features (e.g., fan-out, new destination, off-hours) in the alert text via per-alert
    feature attribution, per [Robust IoT security using isolation forest and one class SVM, Scientific
    Reports 2025](https://www.nature.com/articles/s41598-025-20445-4), to make results actionable. A positive
    result is a high anomaly score driven by reuse-related features; a negative result is a session consistent
    with learned-normal OT access. This supports detecting lateral movement that bypasses static rules.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek http.log
  - Windows Event ID 4625
  - 'NAI: Supervisory-control and process-control network segments, including engineering workstations,
    HMIs, SCADA servers, and gateways between OT cells or zones.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'FEATURES = [src_ip, dst_ip, proto, account, dst_asset_family, duration, fanout, hour]

      MODEL = ExtendedIsolationForest.fit(sessions_90d)

      score = MODEL.anomaly_score(session)

      ALERT IF score > threshold, PRIORITIZE multi_asset_single_account

      INCLUDE top3_feature_attribution IN alert'
- question: Does any successful authentication match a hardcoded-credential watchlist built from vendor
    documentation, firmware reverse-engineering, and prior incident data, especially when the source IP
    is not on the maintenance/vendor-support allowlist?
  context: Embedded keys and credentials are reused across whole product lines, so a curated watchlist
    of known hardcoded credential pairs, certificates, and tokens is directly actionable. Compare authentication
    fields in Windows Event ID 4624 and the Zeek protocol logs (ssh, telnet, http, ftp, dce_rpc, ssl,
    conn) against this watchlist - built from vendor docs, firmware reverse-engineering, and prior incidents,
    per [A Large-Scale Analysis of the Security of Embedded Firmwares, Costin et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf)
    - and alert on any successful session that matches, especially from a non-allowlisted source IP per
    [NSA/CISA AA20-205A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-205a), to catch
    in-use embedded access material. A positive result is a confirmed match to known hardcoded material;
    a negative result is authentication using uniquely issued operator credentials. In Lateral Movement
    terms, watchlist hits represent reliable adversary access into OT assets.
  answer_sources:
  - Windows Event ID 4624
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek dce_rpc.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: OT management interfaces, SCADA supervision segments, engineering workstations, and product-family
    service paths where embedded credentials are likely to be reused.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'WATCHLIST = load(hardcoded_creds from vendor_docs + firmware_RE + incidents)

      STREAM successful_auth (4624 + zeek ssh/telnet/http/ftp/dce_rpc/ssl/conn)

      WHERE auth_fields MATCH WATCHLIST

      ALERT, ESCALATE IF src_ip NOT IN maintenance_allowlist'
- question: For each hardcoded credential, does the number of distinct destination assets reached in a
    24-hour window (and the Shannon entropy of the target distribution) exceed its 30-day baseline by
    more than two standard deviations?
  context: A credential reused by design across a device family will reach an unusually broad and evenly
    distributed set of targets when abused. Track, per hardcoded credential, the count of distinct destination
    assets reached in a 24-hour window and compute the Shannon entropy of the target distribution - then
    alert when current spread exceeds the credential's 30-day baseline by more than two standard deviations,
    per [Detecting Structurally Anomalous Logins, Siadati and Memon](https://doi.org/10.1145/3133956.3134003)
    - to statistically surface reuse across a product family. A positive result is an unusual breadth/entropy
    of targets for that credential; a negative result is spread within its established baseline. This
    is a tactic-specific signal that embedded credentials are being leveraged for lateral movement across
    OT.
  answer_sources:
  - Windows Event ID 4624
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek dce_rpc.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: OT management interfaces, SCADA supervision segments, engineering workstations, and product-family
    service paths where embedded credentials are likely to be reused.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR EACH hardcoded_credential:\n  spread = COUNT(DISTINCT dst_asset) OVER 24h\n  entropy =\
      \ shannon(target_distribution)\n  base_mean, base_std = stats(spread_30d)\nALERT IF spread > base_mean\
      \ + 2*base_std"
- question: Are there low-probability, first-time source-host -> field-device authentication edges when
    modeled with a Bayesian new-edge model?
  context: Reused credentials create authentication edges between hosts and devices that have no prior
    relationship. Model the probability of a first-time source-host -> field-device authentication edge
    with a Bayesian new-edge model and alert on low-probability new edges, per [On Bayesian new edge prediction
    and anomaly detection in computer networks, Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf),
    to separate genuine anomalies from expected, benign network growth. A positive result is a new edge
    whose modeled probability is very low - consistent with an embedded credential opening access between
    assets that should not normally communicate. A negative result is a new edge that the model considers
    plausible given network evolution. This directly addresses lateral movement by highlighting structurally
    improbable pivots in the OT authentication graph.
  answer_sources:
  - Windows Event ID 4624
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek dce_rpc.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: OT management interfaces, SCADA supervision segments, engineering workstations, and product-family
    service paths where embedded credentials are likely to be reused.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'MODEL = BayesianNewEdge.fit(edges_history)   // src_host -> field_device

      p = MODEL.prob(new_edge)

      ALERT IF first_time(edge) AND p < threshold'
- question: Which rare or new authentication edges in the OT authentication graph are flagged by an unsupervised
    graph link-prediction model (with low-probability edge scores) or, where labels exist, by a supervised
    classifier with an embedded-credential indicator feature?
  context: 'Lateral movement via reused credentials manifests as rare/new edges in the authentication
    graph of accounts, source hosts, and destination assets. Train an unsupervised temporal graph link-prediction
    model over the OT authentication graph, per [Euler: Detecting Network Lateral Movement via Scalable
    Temporal Link Prediction, King and Huang](https://dl.acm.org/doi/10.1145/3588771), to flag improbable
    edges a reused credential creates between assets, ranked by low-probability edge scores with link-level
    explanations, per [Detecting Lateral Movement with Unsupervised Graph AI, Bowman et al](https://www.usenix.org/system/files/raid20-bowman.pdf).
    Where labeled data exists, complement this with a supervised classifier (e.g., Random Forest) over
    username, source/destination IPs, protocol, time of day, asset family, and an embedded-credential
    indicator - surfacing the top-3 contributing features per alert, per [xNIDS: Explaining Deep Learning-based
    NIDS, Feng et al](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng) - to improve
    precision. A positive result is a highly improbable edge or a high-confidence classification of embedded-credential
    abuse; a negative result is an edge well explained by normal OT behavior.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek dce_rpc.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: OT management interfaces, SCADA supervision segments, engineering workstations, and product-family
    service paths where embedded credentials are likely to be reused.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "GRAPH = auth_graph(accounts, src_hosts, dst_assets)\nunsup = EulerTemporalLinkPredict(GRAPH);\
      \ score = unsup.edge_prob(edge)\nALERT IF score < threshold WITH link_explanation\nIF labels_exist:\
      \ rf = RandomForest([username, src_ip, dst_ip, proto, hour, asset_family, embedded_cred_flag])\n\
      \  ALERT IF rf.predict(session)=abuse WITH top3_features"
- question: Do any ICS remote-access sessions deviate from a one-class model (one-class SVM or autoencoder)
    trained only on benign sessions, indicating abnormal access without relying on labeled attacks?
  context: OT environments rarely have labeled attack data, so a one-class model trained only on benign
    ICS remote-access sessions (one-class SVM or autoencoder) is well suited to flagging deviating sessions,
    per [Anomaly Detection for a Water Treatment System Using Unsupervised Machine Learning, Inoue et
    al](https://arxiv.org/abs/1709.05342). Prefer OCSVM for robustness under data poisoning and attach
    LIME feature attributions to each alert, per [Robust IoT security using isolation forest and one class
    SVM, Scientific Reports 2025](https://www.nature.com/articles/s41598-025-20445-4), to make results
    both resilient and explainable. A positive result is a session scored as a strong deviation from learned-normal
    behavior - consistent with a hardcoded credential being used in a way operators never do; a negative
    result is a session within the benign envelope. This catches embedded-credential lateral movement
    that signature- and rule-based methods miss in sparse OT telemetry.
  answer_sources:
  - Windows Event ID 4624
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek http.log
  - Zeek ftp.log
  - Zeek dce_rpc.log
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: OT management interfaces, SCADA supervision segments, engineering workstations, and product-family
    service paths where embedded credentials are likely to be reused.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'MODEL = OneClassSVM.fit(benign_sessions)   // or autoencoder

      score = MODEL.decision(session)

      ALERT IF score = deviation WITH LIME_attribution'
