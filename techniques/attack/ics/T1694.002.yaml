name: 'T1694.002: Hardcoded Credentials'
id: 45b17edf-29dc-4770-bfa8-599c28c0ce02
description: Investigate the use of credentials, cryptographic keys/certificates, or API tokens that are
  hardcoded in ICS software or firmware and reused by design across whole product lines or device families
  to gain unauthorized interactive sessions to assets. This playbook helps an analyst detect a non-service
  or shared engineering account authenticating to multiple ICS assets or product-line siblings within
  a short window; sessions matching a hardcoded-credential watchlist built from vendor documentation,
  firmware reverse-engineering, and prior incident data; structurally novel account/source/destination
  login triplets; failed-then-successful credential reuse bursts; machine-like session cadence indicative
  of a tool wielding an embedded credential; abrupt change-points in per-account access behavior; and
  rare authentication edges or anomalous sessions surfaced by graph link-prediction and one-class/isolation-forest
  models. Together these questions support an adversary attempting lateral movement through OT supervisory-control
  and process-control segments using embedded access material.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
