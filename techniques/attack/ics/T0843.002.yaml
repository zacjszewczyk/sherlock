name: 'T0843.002: Online Edit'
id: 168d3434-8211-4e57-896c-9f3894e00e6a
description: Investigate whether an adversary performed an online edit of programmable logic controller
  (PLC) logic to modify an industrial process without stopping the controller. An online edit updates
  parts of an existing program while the PLC remains in RUN, allowing the attacker to minimize process
  downtime and evade detection by avoiding a stop-and-full-download cycle. The ability to perform an online
  edit typically relies on access to a workstation that has the vendor-specific PLC programming software
  installed, which makes lateral movement to that engineering workstation a key precursor. This playbook
  helps an analyst detect in-place modifications of logic blocks (OB/FC/FB/DB) by correlating ICS automation-protocol
  write verbs (e.g., S7Comm, CIP/PCCC, Modbus) against approved engineering-workstation, account, and
  maintenance-window allowlists; by verifying running-program block checksums and version metadata against
  the approved project baseline; by profiling failed and out-of-window edit attempts; and by watching
  for the physical process effects of a covert edit even when the programming traffic is missed. It layers
  deterministic protocol/integrity rules, statistical volume/frequency/state and timing baselines, and
  explainable machine-learning session and process profiling on first-party telemetry from engineering
  workstations, the control network (Level 1), and PLC programming interfaces.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did an ICS automation protocol carry an in-place write verb (e.g., S7Comm OB/FC/FB/DB block
    download or PUT, CIP/PCCC program write, or a Modbus function-code write to a program area) sourced
    from a host, account, or time window that is NOT an approved engineering workstation, authorized programmer,
    or pre-approved maintenance window?
  context: An online edit is performed by issuing protocol verbs that change individual logic blocks or
    attributes in place, rather than a full stop-and-download. Under the Lateral Movement tactic, an adversary
    who has pivoted to a host on the control network will issue these write verbs from an unexpected source.
    The analyst should encode the valid function codes, command/response pairing, and legitimate object/address
    ranges as deterministic specification rules, then alert when a program-write verb originates from
    any host that is not an approved engineering workstation, occurs outside an approved maintenance window,
    or uses an unexpected account. Correlate the Zeek conn/files event with Windows EID 4688 (PLC programming-software
    process execution) and EID 4624 (interactive logon) to separate authorized engineering changes from
    covert edits. A positive result (write verb from an unapproved 5-tuple/account/time) is high-fidelity
    evidence of an unauthorized online edit; a negative result narrows the activity to sanctioned maintenance.
  answer_sources: &id001
  - Zeek conn.log
  - Zeek files.log
  - Engineering Workstation audit logs
  - Windows Event ID 4688
  - Windows Event ID 4624
  - PLC diagnostic logs
  - Network PCAP
  - 'NAI: Engineering Workstations, Control Network (Level 1), PLC Programming Interfaces'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      s7comm OR cip OR modbus where function in {block_download, PUT, program_write, write_db, write_program_area}

      AND src_ip NOT in approved_ews_allowlist

      => raise alert("in-place PLC write from unapproved source", src_ip, dst_ip, function, block_id)
  - technology: SIEM/Rule pseudocode
    query: >-
      join ZeekProgramWrite e

      with WinEvent(4688 process in {step7.exe, tia*.exe, rslogix*.exe, codesys*.exe}) p on p.host==e.src_ip
      within 5m

      with WinEvent(4624 logon) l on l.host==e.src_ip

      where e.src_ip not in approved_ews OR e.account not in authorized_programmers OR e.time not in maintenance_window

      => alert("covert online edit", e, p, l)
- question: Did any running-program logic block change (checksum drift or version-metadata change) while
    the controller remained in RUN, with no corresponding change/maintenance ticket, and do the on-PLC
    blocks match the approved engineering project baseline?
  context: The archetypal covert online edit (e.g., Stuxnet) injects or hides added blocks while the PLC
    stays in RUN and fakes read-back via on-EWS DLL interception (s7otbxdx.dll). The analyst should compare
    running-program block checksums and version metadata against the approved project baseline before
    and after each programming session and alert when a block changes in place while the controller is
    online and there is no corresponding maintenance ticket. Also flag the presence of interception DLLs
    on the engineering workstation and any discrepancy between the blocks resident on the PLC and the
    offline engineering project. A positive result (checksum/version drift while RUN, ticketless, or PLC-vs-project
    mismatch) strongly indicates a malicious online edit and possible read-back spoofing; a negative result
    confirms program integrity.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      for each plc: current = read_block_checksums_and_versions(plc)

      baseline = approved_project_baseline(plc)

      if current != baseline AND plc.mode == RUN AND no_change_ticket(plc, window):
        alert("in-place block change while RUN without ticket", plc, diff(current, baseline))
  - technology: SIEM/Stats pseudocode
    query: >-
      search WinEvent(4688) OR file_create on EWS where filename in {s7otbxdx.dll, *interception*.dll}

      OR detect mismatch(on_plc_blocks, offline_project_blocks)

      => alert("interception DLL or PLC/project discrepancy")
- question: Did any programming-protocol session violate the engineering-workstation, account, maintenance-window,
    or network-segmentation allowlist (e.g., a new PLC-to-PLC programming session or a new outbound 5-tuple
    from a controller)?
  context: NIST SP 800-82r3 prescribes application allowlisting on the engineering workstation, programming
    restricted to authorized accounts and pre-approved maintenance windows, and explicit source/destination
    allowlists across IT/OT and intra-PCN segments. Encoding these as deterministic rules lets the analyst
    alert on any programming-protocol session whose 5-tuple, account, or timing falls outside the allowlist.
    Under Lateral Movement, treat new PLC-to-PLC programming sessions and new outbound 5-tuples from a
    controller as field-device-worm indicators (PLC-Blaster). A positive result reveals an unauthorized
    programming path or worm-like spread; a negative result confirms the session conforms to the sanctioned
    topology.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      programming_session = conn where service in {s7comm, enip/cip, modbus, codesys}

      if (src_ip, dst_ip, port, account, hour) not in allowlist:
        alert("programming session outside allowlist", programming_session)
      if src_ip in plc_subnet AND dst_ip in plc_subnet AND service in programming_services:
        alert("new PLC-to-PLC programming session (worm indicator)")
  - technology: SIEM/Rule pseudocode
    query: >-
      baseline plc_outbound_5tuples over 30d

      if new outbound 5-tuple from plc not in baseline => alert("new outbound PLC 5-tuple (PLC-Blaster
      spread)")
- question: Are there rejected or failed program-write responses, mode-change denials, authentication
    failures on the programming channel, or edit attempts outside approved windows against a controller?
  context: Failure-mode signals are first-class indicators, not noise. Rising rejected/failed program-write
    function responses, mode-change denials, authentication failures on the programming channel, and edit
    attempts outside approved windows indicate reconnaissance or a brute-forced edit against a controller.
    The analyst should track these as distinct signals and watch for rate increases. This approach follows
    the low-false-positive specification-rule emphasis on failure modes (Mitchell & Chen). A positive
    result (a cluster of denied/failed edit attempts) suggests an adversary probing or attempting an unauthorized
    online edit; a negative result indicates no detected edit pressure on the controller.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      events = program_write_responses where status in {rejected, failed}
        OR mode_change where result==denied
        OR auth_failure on programming_channel
        OR edit_attempt outside maintenance_window
      by plc, 1h window: count(events)

      if count > baseline_mean + 3*stddev => alert("rising failed/denied edit attempts", plc)
- question: Does the volume, block count, or success/reject ratio of an online-edit session exceed the
    per-controller baseline for legitimate maintenance (e.g., bytes written or blocks touched above the
    99th percentile)?
  context: 'Statistically, legitimate online maintenance has a characteristic footprint: number of blocks
    touched, bytes written per session, edits per minute, and the ratio of successful versus rejected
    writes. The analyst should build per-controller baselines from benign maintenance and use percentile
    thresholds (e.g., >99th percentile bytes or block count) to surface unusually large or repeated partial
    updates that suggest staged malicious modification. Surface Matrix-Profile discords over the write-volume
    series to find anomalous edit bursts. A positive result (an edit session far above the benign envelope)
    points to a large or staged covert change; a negative result places the edit within normal maintenance
    bounds.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per plc per session: bytes_written, blocks_touched, edits_per_min, success_ratio

      thresholds = percentile(benign_sessions, 99)

      if bytes_written > thresholds.bytes OR blocks_touched > thresholds.blocks:
        alert("online edit exceeds baseline volume", plc, session)
  - technology: SIEM/Stats pseudocode
    query: >-
      series = write_volume_per_interval(plc)

      mp = matrix_profile(series, window=w)

      flag discords where mp > discord_threshold => alert("anomalous edit-volume discord", plc)
- question: Does the per-PLC programming/poll traffic show missing, extra, delayed, or out-of-sequence
    messages, abnormal inter-arrival timing, or repeated small edits during production hours that deviate
    from the normal maintenance cadence?
  context: Modeling the per-PLC programming and poll traffic as a deterministic finite automaton (with
    automatic phase-shift handling) lets the analyst flag missing, extra, delayed, or out-of-sequence
    messages and abnormal inter-arrival timing for an edit exchange. Complement this with time-series
    decomposition of logic-edit counts per PLC to flag deviations from the normal maintenance cadence,
    especially repeated small edits during production hours — a hallmark of a stealthy, incremental online
    edit. A positive result (sequence or cadence anomaly) indicates a covert or malformed edit exchange;
    a negative result confirms the edit timing matches sanctioned patterns.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      model dfa = learn_message_sequence(plc_programming_traffic) with phase_shift_handling

      for each edit_exchange:
        if message missing/extra/out_of_sequence OR inter_arrival outside [min,max]:
          alert("programming sequence/timing anomaly", plc, exchange)
  - technology: SIEM/Stats pseudocode
    query: >-
      counts = edit_count_per_hour(plc)

      decomp = seasonal_decompose(counts)

      if residual deviates from cadence OR repeated small edits during production_hours:
        alert("abnormal edit cadence", plc)
- question: Does the deviation between predicted and observed sensor/actuator values exceed the benign-tuned
    threshold, indicating a covert online edit changed process behavior even if the programming traffic
    was not observed?
  context: An online edit ultimately changes how the process behaves. As a parallel safety net to protocol
    and integrity checks, the analyst should threshold the deviation between predicted and observed sensor/actuator
    values so a covert edit that alters process behavior is caught even when the programming traffic is
    missed (e.g., encrypted, on-device, or via a trusted path). Tune the threshold to a chosen percentile
    on benign data (CNN-on-SWaT approach). A positive result (sustained predicted-vs-observed deviation
    with no legitimate setpoint/recipe change) indicates the logic governing the process was altered;
    a negative result indicates process behavior remains within the learned model.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      predicted = process_model(history)

      residual = abs(observed_sensor_actuator - predicted)

      threshold = percentile(benign_residuals, p)

      if residual > threshold AND no setpoint/recipe change ticket:
        alert("process behavior shift consistent with covert edit", tag, residual)
- question: Does an unsupervised session-anomaly model (Isolation Forest / One-Class SVM) isolate a rare
    online-edit session tuple from an uncommon engineering host, and which top features explain the anomaly?
  context: Train an Isolation Forest or One-Class SVM on session features — source workstation, command
    spacing, destination PLC, block diversity, write/byte counts, and success ratio — to isolate rare
    or stealthy online-edit tuples, such as those from uncommon engineering hosts. Surface the top-3 contributing
    features in the alert text using SHAP-style attribution so analysts can triage rather than chase an
    opaque score. Because reconstruction/anomaly detectors are evadable by constrained spoofing, every
    ML hit MUST be corroborated with the deterministic block-checksum/protocol rules above. A positive
    result (a high-anomaly session with explainable features, confirmed by a checksum/protocol rule) flags
    a probable covert edit; a negative result lowers but does not eliminate suspicion.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      features = [src_workstation, command_spacing, dst_plc, block_diversity, write_count, byte_count,
      success_ratio]

      model = IsolationForest().fit(benign_sessions)

      score = model.decision_function(session)

      if score in anomalous_range:
        top3 = shap_top_features(model, session, k=3)
        if corroborated_by_checksum_or_protocol_rule(session):
          alert("rare online-edit session", session, top3)
- question: Do unsupervised deep models (LSTM/GRU or 1D-CNN reconstruction/prediction) trained on benign
    controller and process telemetry flag a deviation introduced by an online edit, validated and thresholded
    on public ICS datasets?
  context: Use unsupervised LSTM/GRU or 1D-CNN reconstruction/prediction models trained on benign controller
    and process telemetry to flag the deviation introduced by an online edit, selecting architecture and
    metrics per the CPS deep-anomaly-detection taxonomy. Validate and threshold on public ICS datasets
    (SWaT, WADI, HAI, Electra) before deployment, and keep the deterministic checksum/version baseline
    as the non-negotiable floor since deep detectors can be evaded. A positive result (a reconstruction/prediction
    error spike coinciding with programming activity or process change) supports a covert online-edit
    hypothesis; a negative result, combined with intact checksums, increases confidence that no edit occurred.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: >-
      model = LSTM_or_1DCNN_reconstruction().fit(benign_controller_process_telemetry)

      err = reconstruction_error(model, live_window)

      threshold = validate_on(SWaT, WADI, HAI, Electra)

      if err > threshold:
        alert("deep-model deviation (possible online edit)", window)
      # floor: always run checksum/version baseline regardless of ML output
