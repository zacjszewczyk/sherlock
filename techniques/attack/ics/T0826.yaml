questions:
- question: Within a 5-minute correlation window, does a critical ICS host (HMI, Engineering Workstation,
    Historian, OPC server) go completely network-silent at the same time that it logs an unexpected critical-process
    termination, application error/hang, service stop, or an unscheduled system shutdown/restart?
  context: 'This question targets the core symptom of a Loss of Availability under the Impact tactic:
    a critical control host that stops talking on the wire while simultaneously showing host-level evidence
    of a crash or shutdown. The analyst correlates network-silence alerts with Windows host events on
    the same asset within +/-5 minutes - Event ID 1000 (Application Error), 1002 (Application Hang), 7036
    (Service Stopped), 4689 (Process Exited), 4608 (System Shutdown), 4609 (Shutdown Initiated), and 1074
    (Shutdown/Restart). Prioritize matches where the affected process or service name is on a predefined
    critical-ICS-application list (e.g., ''HMI_Runtime.exe'', ''Historian_Service.exe'', OPC server services).
    Treat each per-PLC/per-host communication channel as a deterministic finite automaton, so a missing,
    delayed, or extra message is itself an alertable specification violation; specification-based rules
    yield the lowest false-positive rates in the predictable, periodic traffic of OT networks and enforce
    the allow-listed communication baseline mandated for OT assets. A positive correlation (silence +
    critical crash/shutdown) strongly indicates a disruptive Impact event rather than a transient blip;
    a negative result (silence with no host event, or a host event with continued comms) points to network-path
    or maintenance causes. Supporting references: [Temporal Phase Shifts in SCADA Networks, Markman et
    al.](https://arxiv.org/abs/1808.05068), [A Survey of Intrusion Detection Techniques for Cyber-Physical
    Systems, Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf), [Guide to Operational
    Technology (OT) Security (NIST SP 800-82r3), Stouffer et al.](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 1000
  - Windows Event ID 1002
  - Windows Event ID 7036
  - Windows Event ID 4608
  - Windows Event ID 4609
  - Windows Event ID 1074
  - Windows Event ID 4689
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations, Operator Stations, Historian Servers,
    Data Gateways, and Domain Controllers located on the Process Control Network (PCN) or ICS Demilitarized
    Zone (DMZ).'
  range: Last 90 days (correlate host events within +/-5 minutes of the network-silence alert)
  queries:
  - technology: SIEM/Rule pseudocode
    query: silence = network_silence_alerts(host in critical_ics_hosts) hostev = events(EventID in [1000,1002,7036,4689,4608,4609,1074]
      AND host in critical_ics_hosts) join silence, hostev ON host WHERE abs(silence.time - hostev.time)
      <= 5m | eval critical = (process_name IN critical_ics_app_list) | where critical | alert severity=high
  - technology: Zeek/pseudocode
    query: conn.log | bin by host, 60s | flag windows where bytes_in==0 AND bytes_out==0 (no flows) for
      host in critical_ics_hosts | emit network_silence_alert(host, start_time)
- question: For each critical ICS host, does the gap between consecutive network communications exceed
    the greater of three standard deviations above its rolling 7-day mean inter-flow interval or a hard
    floor of 60 seconds, and does the per-minute packet/flow frequency collapse toward zero?
  context: 'This statistical method detects cessation of communication that signals Loss of Availability
    without relying on a fixed threshold that ignores each asset''s natural cadence. Build a rolling 7-day
    baseline of inbound/outbound communication intervals (time between Zeek conn.log entries) per critical
    host. Alert when a host logs zero communication for longer than max(mean + 3*stddev, 60s), tuning
    the floor per asset from its observed poll cadence. Because ICS machine-to-machine traffic is highly
    periodic, also score loss of periodicity via frequency-domain residuals: a sudden drop in expected
    per-minute packet/flow frequency to roughly zero indicates a true cessation rather than a slow link.
    A breach of the baseline that persists indicates the host has gone dark - consistent with a crash,
    shutdown, or DoS - whereas brief, in-baseline gaps reflect normal polling jitter and should not alert.
    Pair this with the host-event correlation to confirm an availability impact. Supporting references:
    [Efficient Cyber Attack Detection in ICS Using Lightweight Neural Networks and PCA, Kravchik & Shabtai](https://arxiv.org/abs/1907.01216),
    [Temporal Phase Shifts in SCADA Networks, Markman et al.](https://arxiv.org/abs/1808.05068).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 1000
  - Windows Event ID 1002
  - Windows Event ID 7036
  - Windows Event ID 4608
  - Windows Event ID 4609
  - Windows Event ID 1074
  - Windows Event ID 4689
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations, Operator Stations, Historian Servers,
    Data Gateways, and Domain Controllers located on the Process Control Network (PCN) or ICS Demilitarized
    Zone (DMZ).'
  range: Last 90 days (rolling 7-day baseline; evaluate per 60s bucket)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host in critical_ics_hosts: base = rolling_7d(interval_between(conn.log entries)) mean=avg(base);
      sd=stddev(base) gap = now - last_seen(host) threshold = max(mean + 3*sd, 60s) | where gap > threshold
      | alert // periodicity check | freq = packets_per_minute(host); residual = fft_residual(freq) |
      where freq ~ 0 AND residual high | alert severity=high'
- question: In the 5 minutes preceding a communication gap on a critical ICS host, is there a burst of
    blocked/reset connections (Zeek conn_state S0/REJ/RSTO), a spike in failed service-control attempts,
    or repeated application-error events (Event ID 1000/1002) for a critical ICS process?
  context: 'This question separates a malicious crash or denial-of-service from a clean, planned maintenance
    shutdown by profiling the failure signature that immediately precedes silence. A planned shutdown
    is orderly and quiet; an attack or fault typically produces a rising tide of errors first. The analyst
    looks for, in the 5 minutes before the gap, a burst of Zeek conn.log entries in failure states (S0
    no-reply, REJ rejected, RSTO/RSTR resets) to or from the host, a spike in failed service-control attempts,
    or repeated application-error/hang events (1000/1002) for a critical ICS process. A rising failure
    rate that terminates in silence is a strong indicator of a crash or DoS-driven Loss of Availability;
    the absence of such precursors before an orderly shutdown event supports a benign maintenance explanation.
    This tactic-specific framing keeps the analyst focused on the integrity/availability impact rather
    than routine restarts. Supporting references: [Guide to Operational Technology (OT) Security (NIST
    SP 800-82r3), Stouffer et al.](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 1000
  - Windows Event ID 1002
  - Windows Event ID 7036
  - Windows Event ID 4608
  - Windows Event ID 4609
  - Windows Event ID 1074
  - Windows Event ID 4689
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations, Operator Stations, Historian Servers,
    Data Gateways, and Domain Controllers located on the Process Control Network (PCN) or ICS Demilitarized
    Zone (DMZ).'
  range: Last 90 days (evaluate the 5-minute window immediately before each communication gap)
  queries:
  - technology: SIEM/Rule pseudocode
    query: gap = communication_gap_events(host in critical_ics_hosts) pre = window(gap.start - 5m, gap.start)
      fail_conns = count(conn.log WHERE host_involved AND conn_state IN [S0,REJ,RSTO,RSTR]) in pre app_err
      = count(EventID IN [1000,1002] AND process IN critical_ics_app_list) in pre svc_fail = count(failed
      service_control attempts) in pre | where fail_conns > baseline_burst OR app_err >= 2 OR svc_fail
      > baseline | alert label="failure_burst_before_silence" severity=high
- question: Does a time-series / sequence anomaly model (LSTM autoencoder or DeepLog-style LSTM) flag
    a sustained zero-communication anomaly on a critical ICS host, based on per-minute Zeek conn.log counts
    and the ordered host-event sequence (e.g., service-stop -> application-error -> shutdown)?
  context: 'This machine-learning layer catches availability-loss patterns that fixed thresholds and specification
    rules miss, by learning each host''s normal rhythm of per-minute flow counts and the typical ordering
    of its host events. Train an LSTM autoencoder over per-minute conn.log entry counts, and/or a DeepLog-style
    LSTM over per-host event-key sequences, then retrain weekly to track drift. Alert when reconstruction
    or next-event prediction error indicates a sustained zero-communication anomaly (anomaly score > 0.7,
    tuned to a chosen percentile of validation residuals), especially when the event sequence matches
    a crash/shutdown progression. Critically, run the model in parallel with the deterministic specification
    and statistical rules - never as the sole signal - because ML intrusion-detection degrades on unseen
    attacks. Surface the top-3 contributing features (e.g., host, minute-bucket count, preceding event
    key) in the alert so the analyst can validate the finding quickly. A high score with a coherent crash
    sequence corroborates a Loss of Availability; isolated high scores without supporting deterministic
    evidence should be triaged, not auto-escalated. Supporting references: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015),
    [Detecting Cyberattacks in ICS Using CNNs, Kravchik & Shabtai](https://arxiv.org/abs/1806.08110),
    [A False Sense of Security?, Kus et al.](https://arxiv.org/abs/2205.09199), [Explainable Anomaly Detection
    for ICS Cybersecurity, Ha et al.](https://arxiv.org/abs/2205.01930).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 1000
  - Windows Event ID 1002
  - Windows Event ID 7036
  - Windows Event ID 4608
  - Windows Event ID 4609
  - Windows Event ID 1074
  - Windows Event ID 4689
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations, Operator Stations, Historian Servers,
    Data Gateways, and Domain Controllers located on the Process Control Network (PCN) or ICS Demilitarized
    Zone (DMZ).'
  range: Last 90 days (model trained on benign history; retrain weekly)
  queries:
  - technology: SIEM/ML pseudocode
    query: features = per_minute_conn_counts(host) + ordered_event_key_sequence(host) model = LSTM_autoencoder(features)
      OR DeepLog(event_sequence) // retrain weekly score = reconstruction_or_prediction_error(model, current_window)
      | where score > 0.7 AND sustained_zero_comm | annotate top3_features(host, minute_bucket_count,
      preceding_event_key) | alert (parallel_to deterministic_rules)
- question: Are high rates of file-modification events on critical ICS data directories correlated with
    a process-creation event whose command line matches known ransomware/wiper precursors (e.g., 'vssadmin
    delete shadows', 'wbadmin delete catalog', 'bcdedit', 'cipher /w'), or do modified files take on known
    ransomware extensions (.locked, .enc, .crypt, .encrypted)?
  context: 'This question hunts for the destructive Impact of ransomware or wiper malware against ICS
    data - encrypting or deleting project files, historian databases, and backups that operators need
    to run the process. Correlate high rates of file-modification events (Event ID 4663 Object Access,
    4656 Handle Requested) with process-creation events (4688) to identify the initiating NewProcessName
    and CommandLine. Alert on hard ransomware indicators: shadow-copy and backup destruction via ''vssadmin.exe
    delete shadows'', ''wbadmin delete catalog'', ''bcdedit'' boot-config tampering, or ''cipher.exe /w''
    free-space wiping. Maintain a watchlist of known ransomware file extensions and alert when they appear
    in the ObjectName field of 4663 events. Enforce application allowlisting on engineering workstations
    and historians so any unapproved binary performing bulk writes is alertable. A match - especially
    shadow-copy deletion plus bulk writes from an unrecognized process - is a near-certain availability-impact
    event requiring immediate containment; the absence of these precursors lowers (but does not eliminate)
    suspicion of ransomware. Supporting references: [UNVEIL, Kharaz et al.](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf),
    [Guide to Operational Technology (OT) Security (NIST SP 800-82r3), Stouffer et al.](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4656
  - Windows Event ID 4659
  - 'NAI: Historian Servers, Engineering Workstations, File Servers hosting ICS project files and configurations,
    and Backup Servers storing critical ICS data, all located within the Process Control Network (PCN)
    or ICS Demilitarized Zone (DMZ).'
  range: Last 90 days (correlate 4688 process creation with bursts of 4663/4656)
  queries:
  - technology: SIEM/Rule pseudocode
    query: proc = events(EventID=4688) fileev = events(EventID IN [4663,4656] AND ObjectName IN critical_ics_dirs)
      join proc, fileev ON host, logon_id WHERE near_in_time | eval precursor = CommandLine MATCHES /vssadmin
      .*delete shadows|wbadmin delete catalog|bcdedit|cipher.* \/w/ | eval bad_ext = ObjectName MATCHES
      /\.(locked|enc|crypt|encrypted)$/ | eval unapproved = NewProcessName NOT IN app_allowlist | where
      precursor OR bad_ext OR (unapproved AND file_rate_high) | alert severity=critical
- question: Does any process exceed the 99th percentile of its 7-day rolling baseline for file Object-Access
    events (Event ID 4663) per minute on critical ICS directories for 3 consecutive minutes, and does
    the Shannon entropy of the file extensions it touches drop sharply (uniform renaming) or the entropy
    of its write buffers rise (encryption)?
  context: 'This statistical method quantifies the file-operation surge that characterizes crypto-ransomware
    and mass-deletion wipers on historians and engineering workstations. For each critical host, baseline
    the rate of Event ID 4663 per process per minute on critical ICS directories over a 7-day rolling
    window (Volume and Frequency). Alert when a process exceeds its 99th-percentile historical rate for
    3 consecutive minutes, with a hard fallback floor of >100 events/minute sustained for 5 minutes. Add
    two entropy signals computed over a 5-minute sliding window: a sharp drop in the Shannon entropy of
    file extensions a process modifies (below ~0.5) indicates uniform renaming to a single ransomware
    extension, while high entropy of written content versus the original indicates encryption. File-operation
    rate and the set of extensions touched are the strongest crypto-ransomware indicators. A combined
    rate-and-entropy anomaly is a high-confidence availability-impact signal; rate alone may be a benign
    bulk job, so the entropy context reduces false positives. Supporting references: [UNVEIL, Kharaz et
    al.](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf), [Automated
    Dynamic Analysis of Ransomware, Sgandurra et al.](https://arxiv.org/abs/1609.03020).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4656
  - Windows Event ID 4659
  - 'NAI: Historian Servers, Engineering Workstations, File Servers hosting ICS project files and configurations,
    and Backup Servers storing critical ICS data, all located within the Process Control Network (PCN)
    or ICS Demilitarized Zone (DMZ).'
  range: Last 90 days (7-day rolling baseline; 5-minute sliding entropy window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per (host, process): base = rolling_7d(count(EventID=4663 WHERE ObjectName IN critical_ics_dirs)
      per minute) p99 = percentile(base, 99) cur = count_per_minute(now) | where cur > p99 for 3 consecutive
      minutes OR cur > 100/min for 5 min | ext_entropy = shannon(file_extensions_modified, window=5m)
      | buf_entropy = shannon(write_buffer_bytes, window=5m) | where ext_entropy < 0.5 OR buf_entropy
      high | alert severity=high'
- question: Across many distinct files, is a single process exhibiting a sustained read-then-write-then-delete
    (or read-encrypt-write) operation pattern, or a surge in delete operations, and is there a separate
    rise in denied/failed access attempts (from Event ID 4663/4659/4656/4690)?
  context: 'This question profiles the operation-state signature of ransomware and wipers rather than
    just the volume of activity, distinguishing destructive Impact from ordinary file churn. Track per
    process the read/write/delete state of file operations and their success-vs-failed/denied outcome
    using Event IDs 4663 (object access), 4659 (handle to object requested with intent to delete), 4656
    (handle requested), and 4690 (duplicate handle). A process that sustains a read-then-write-then-delete
    or read-encrypt-write pattern across many distinct files is the canonical crypto-ransomware behavior;
    a surge in delete operations alone signals a wiper. Track denied/failed operations separately as a
    distinct signal of probing or partial encryption where the malware lacks permission. A sustained encrypt/delete
    pattern across many files is a strong availability-loss indicator warranting immediate isolation of
    the host; scattered failed reads without the full pattern may indicate early-stage probing to investigate
    further. Supporting references: [UNVEIL, Kharaz et al.](https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_kharraz.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4656
  - Windows Event ID 4659
  - 'NAI: Historian Servers, Engineering Workstations, File Servers hosting ICS project files and configurations,
    and Backup Servers storing critical ICS data, all located within the Process Control Network (PCN)
    or ICS Demilitarized Zone (DMZ).'
  range: Last 90 days (evaluate per-process operation sequences over sliding windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per process: ops = sequence(EventID 4663/4659/4656/4690 with AccessMask -> read|write|delete,
      status success|denied) distinct_files = count_distinct(ObjectName) | pattern = detect(read->write->delete
      OR read->encrypt->write) across many distinct_files | delete_surge = count(delete ops) > baseline
      | denied_signal = count(status=denied) tracked separately | where pattern OR delete_surge | alert
      severity=high; emit denied_signal as distinct indicator'
- question: When Event ID 4663 events are clustered (e.g., DBSCAN) on features such as initiating process
    name, target directory, operation type, and timestamp within 5-minute windows, does a new dense cluster
    emerge that deviates from learned benign file-activity clusters?
  context: 'This machine-learning layer detects mass file-manipulation campaigns whose shape differs from
    learned-benign activity even when individual thresholds are not tripped. Cluster Event ID 4663 events
    with a density-based algorithm such as DBSCAN over features including the initiating ProcessName,
    target directory, operation type, and timestamp within 5-minute windows; train on benign file activity
    and alert when a new dense cluster forms that deviates from the learned benign clusters. Optionally
    add a supervised classifier over file-operation, extension, and registry features to label the initiating
    process as ransomware-like. Run this in parallel with the deterministic precursor rules and statistical
    rate/entropy checks - not as the sole signal - because ML degrades on unseen attacks, and surface
    the top-3 contributing features (process, directory, extension-entropy) in each alert for fast analyst
    validation. A new dense malicious-shaped cluster corroborates a destructive Impact event; clusters
    that match known benign batch jobs should be suppressed. Supporting references: [Automated Dynamic
    Analysis of Ransomware, Sgandurra et al.](https://arxiv.org/abs/1609.03020), [A False Sense of Security?,
    Kus et al.](https://arxiv.org/abs/2205.09199), [Explainable Anomaly Detection for ICS Cybersecurity,
    Ha et al.](https://arxiv.org/abs/2205.01930).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Windows Event ID 4656
  - Windows Event ID 4659
  - 'NAI: Historian Servers, Engineering Workstations, File Servers hosting ICS project files and configurations,
    and Backup Servers storing critical ICS data, all located within the Process Control Network (PCN)
    or ICS Demilitarized Zone (DMZ).'
  range: Last 90 days (cluster over 5-minute windows; train on benign history)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'feats = features_from(EventID=4663): [ProcessName, target_dir, op_type, timestamp] per 5m
      window benign_clusters = DBSCAN.fit(benign_history) cur = DBSCAN.fit(current_window) | where new_dense_cluster(cur)
      deviates_from benign_clusters | optional: supervised_classify(process, file_op/ext/registry feats)
      | annotate top3_features(process, directory, extension_entropy) | alert (parallel_to deterministic_and_statistical_rules)'
- question: Is there any connection to a critical ICS field device on an ICS protocol port (502 Modbus,
    44818 EtherNet/IP, 20000 DNP3, 102 S7Comm) whose originating IP is not on the predefined Process Control
    Network allow-list, and does it coincide with Zeek scan or SYN-flood notices from the same source
    within one minute?
  context: 'This question enforces the OT allow-list floor to catch the first move of a denial-of-service
    or resource-exhaustion attack against PLCs, RTUs, and IEDs - a direct path to Loss of Availability.
    For all Zeek conn.log traffic to critical ICS devices on ICS ports, check whether the originating
    IP (id.orig_h) is on the predefined allow-list and alert on any connection from a non-allow-listed
    source. Correlate with Zeek notice.log entries such as ''Scan::Address_Scan'' or SYN-flood notices
    from the same source within a 1-minute window to confirm hostile intent. Allow-listing of source and
    destination to controllers is the prescribed OT security floor, and specification-based rules give
    the lowest false positives in deterministic control networks. A non-allow-listed source touching controller
    ports - especially alongside scan/flood notices - is a high-priority precursor to an availability
    attack; legitimate engineering hosts on the allow-list generate no alert, keeping noise low. Supporting
    references: [Guide to Operational Technology (OT) Security (NIST SP 800-82r3), Stouffer et al.](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    [A Survey of Intrusion Detection Techniques for Cyber-Physical Systems, Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek profinet.log
  - Zeek ethernetip.log
  - 'NAI: The Process Control Network (PCN) segments, specifically network traffic directed at PLCs, RTUs,
    IEDs, and other field devices. This includes monitoring at network boundaries (e.g., Firewalls between
    PCN zones) and within specific control segments (e.g., Level 1 control networks).'
  range: Last 90 days (correlate notice.log within +/-1 minute)
  queries:
  - technology: Zeek/pseudocode
    query: conn.log WHERE id.resp_p IN [502,44818,20000,102] AND id.resp_h IN critical_ics_devices | where
      id.orig_h NOT IN pcn_allowlist | join notice.log ON id.orig_h WHERE note IN [Scan::Address_Scan,
      SYN_flood] AND within 1m | alert severity=high label="non_allowlisted_to_ics_port"
- question: Does a single source IP exceed the 99th percentile (or 4 standard deviations above a 30-minute
    moving average) of a field device's 7-day baseline for new connections/minute or bytes/minute on an
    ICS port for at least 30 seconds, and does a network-wide entropy check on source-IP/destination-port
    distributions reveal a distributed flood?
  context: 'This statistical method detects the volumetric and connection-rate surges that drive denial-of-service
    against ICS field devices, causing Loss of Availability. For each critical field device, baseline
    inbound connection rate (new conns/min) and total bytes/min from Zeek conn.log per ICS port over a
    rolling 7-day window (Volume and Frequency). Alert when a single source IP exceeds the 99th percentile
    of its historical distribution, or 4 standard deviations above a 30-minute moving average, sustained
    for at least 30 seconds, with hard fallback floors of >100 MB/min or >50 new conns/min. Add a network-wide
    subspace/entropy check on the distributions of source IPs and destination ports to catch distributed
    floods and surface shifts that simple volume metrics miss. A sustained per-source spike on a controller
    port is a strong availability-attack indicator; a network-wide entropy shift without a single dominant
    source points to a distributed flood. Benign polling stays within baseline and does not alert. Supporting
    references: [Diagnosing Network-Wide Traffic Anomalies, Lakhina et al.](https://www.cs.bu.edu/fac/crovella/paper-archive/sigc04-network-wide-anomalies.pdf),
    [Probability Risk Identification Based IDS for SCADA Systems, Marsden et al.](https://arxiv.org/abs/1711.02826),
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests, Anton et al.](https://arxiv.org/abs/1907.10374).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek profinet.log
  - Zeek ethernetip.log
  - 'NAI: The Process Control Network (PCN) segments, specifically network traffic directed at PLCs, RTUs,
    IEDs, and other field devices. This includes monitoring at network boundaries (e.g., Firewalls between
    PCN zones) and within specific control segments (e.g., Level 1 control networks).'
  range: Last 90 days (7-day baseline; 30-minute moving average; >=30s sustain)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per (device in critical_ics_devices, port in ics_ports): base = rolling_7d(new_conns_per_min,
      bytes_per_min) per source_ip p99 = percentile(base,99); mavg = moving_avg_30m; sd = stddev_30m |
      where source exceeds max(p99, mavg + 4*sd) sustained >=30s OR conns_per_min > 50 OR bytes_per_min
      > 100MB | network_wide: entropy(source_ip dist), entropy(dest_port dist) | where entropy_shift significant
      | alert severity=high'
- question: Toward any critical ICS device, is there a surge in Zeek conn.log entries with failure states
    (S0 no-reply, REJ rejected, RSTO/RSTR resets) or a spike in firewall-blocked/denied connections that
    exceeds the device's 99th-percentile baseline, even when payload byte volume stays low?
  context: 'This question profiles connection-failure metrics as a distinct denial-of-service signal that
    volume-based detection misses - a SYN flood or resource-exhaustion attack can knock a controller offline
    with many tiny, never-completed connections. Baseline the normal blocked/failed-connection rate per
    device and alert on departures above the 99th percentile. Look for surges in conn.log entries with
    conn_state S0 (no reply), REJ (rejected), or RSTO/RSTR (resets), and for spikes in firewall-blocked
    or denied connections toward an ICS device. Because these attacks carry little payload, byte-volume
    thresholds alone will not fire, making the failure-state rate the key indicator. A sustained surge
    in failed/blocked connections to a controller is a strong sign of an availability attack in progress;
    a normal failure rate argues against SYN-flood exhaustion and points the analyst elsewhere. Supporting
    references: [Diagnosing Network-Wide Traffic Anomalies, Lakhina et al.](https://www.cs.bu.edu/fac/crovella/paper-archive/sigc04-network-wide-anomalies.pdf),
    [Guide to Operational Technology (OT) Security (NIST SP 800-82r3), Stouffer et al.](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
