  context: 'This machine-learning layer catches anomalous flow behavior toward field devices that fixed
    allow-lists and thresholds do not anticipate, complementing the deterministic and statistical DoS
    detection for Loss of Availability. Deploy unsupervised flow anomaly detection - an Isolation Forest,
    or a Kitsune-style autoencoder ensemble over damped-window packet/byte-rate, jitter, and inter-arrival
    features - on conn.log flows to critical ICS devices. Train on benign traffic and alert on high anomaly
    scores (>0.7, tuned to a validation percentile). Keep the deterministic allow-list rule and the statistical
    rate/failure thresholds as the floor, because ML degrades on unseen attacks, and surface the top-3
    contributing flow features (e.g., source IP, conns/min, bytes/min) in each alert so the analyst can
    validate quickly. A high anomaly score on controller-bound flows corroborates an availability attack;
    scores should be triaged alongside the deterministic signals rather than auto-escalated on their own.
    Supporting references: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363), [Kitsune,
