name: 'T0826: Loss of Availability'
id: f22cf6f1-aeea-4cb5-ac14-c2fb94a66b3b
description: 'Investigate a suspected Loss of Availability affecting a critical ICS component, where an
  adversary disrupts essential hosts, processes, or field devices to prevent owners and operators from
  delivering products or services. This playbook helps an analyst correlate three converging lines of
  evidence: (1) a complete cessation of network communication on a critical ICS host (HMI, Engineering
  Workstation, Historian, OPC server) that lines up in time with an unexpected process termination or
  unscheduled shutdown/restart; (2) an anomalous, sustained surge of file modification, rename, or deletion
  events on critical ICS data directories - the hallmark of ransomware or wiper malware encrypting or
  destroying project files, historian databases, and backups; and (3) an abrupt, sustained flood of traffic
  or new connections aimed at PLCs, RTUs, and IEDs over ICS protocol ports (Modbus, EtherNet/IP, DNP3,
  S7Comm) from sources not on the OT allow-list, consistent with a denial-of-service or resource-exhaustion
  attack on field devices. Each line of evidence is pursued with layered symbolic-logic (specification/allow-list)
  rules, statistical baselining, and machine-learning anomaly detection so an analyst can distinguish
  a genuine outage or attack from planned maintenance and quantify impact to control operations.'
type: technique
related:
- tactic_id: TA0105
  tactic_name: Impact
