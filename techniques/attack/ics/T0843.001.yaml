name: 'T0843.001: Download All'
id: ade62571-9382-4973-acf9-0c2cfe7ccce4
description: Investigate whether an adversary executed a full PLC program download ('Download All') to
  overwrite the entire controller program and configuration. This playbook helps an analyst determine
  if a complete project image replaced existing logic, whether the PLC was forced into a STOP/PROGRAM
  state during the transfer, and whether block versions, checksums, or project hashes changed afterward.
  It correlates programming-protocol traffic (S7Comm, Modbus, DNP3, EtherNet/IP), Engineering Workstation
  project history, Windows authentication and process events, PLC diagnostics, and asset-inventory baselines
  to distinguish authorized maintenance from malicious overwrite activity, supporting detection of lateral
  movement into ICS controllers.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did programming-protocol traffic to a PLC contain a complete project-transfer sequence (e.g.,
    S7Comm download/block-write, a controller STOP followed by RUN), and was that transfer window authorized
    when correlated with Engineering Workstation project history, Windows logons (4624/4625), process
    creation (4688), and PLC diagnostics?
  context: A full program download overwrites the entire controller logic and configuration and almost
    always requires taking the PLC out of normal operation. The analyst inspects Zeek conn.log, vendor
    protocol logs, and PCAP for programming function codes or write sequences indicative of a complete
    project transfer (download/block-write, controller STOP then RUN), then aligns the transfer window
    with EWS project history, Windows logon (4624/4625) and process (4688) events, and PLC diagnostics
    to confirm whether the overwrite was authorized and whether the controller entered a stop/maintenance
    state. Apply protocol-semantic rules - valid function codes, command/response pairing, addressing,
    and direction - and the legitimate authenticate-stop-download-start specification. A positive result
    is an unauthorized or undocumented full transfer tied to anomalous logons or processes; a negative
    result is a transfer matching a scheduled change. This is tactic-specific to Lateral Movement because
    adversaries pivot to engineering hosts to reprogram controllers.
  answer_sources: &id001
  - Zeek conn.log
  - Zeek files.log
  - S7Comm/Modbus/DNP3/EtherNet-IP protocol logs
  - Engineering Workstation project history
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4688
  - PLC diagnostic and device-alarm logs
  - PLC mode/state (RUN/STOP/PROGRAM) telemetry
  - Asset inventory (expected program version/checksum)
  - Network PCAP
  - 'NAI: Control Network (Level 1/2), Engineering Workstations, PLC Management Interfaces'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from s7comm,modbus,enip,dnp3 logs

      where function in {download_block, block_write, plc_stop, plc_start}

      group by src_host, dst_plc, session

      select sessions containing STOP -> download/block_write+ -> START

      join conn.log on session for byte_volume, duration

      emit candidate_full_download(session)'
  - technology: SIEM/Rule pseudocode
    query: 'let dl = candidate_full_download events

      join WinEvent(4624,4625,4688) on host=ews_host within [dl.start-10m, dl.end+10m]

      join EWS_project_history on dst_plc within dl.window

      join PLC_diag on dst_plc for state_transition

      alert if dl AND (no matching authorized_change OR controller_state in {STOP,PROGRAM})'
- question: Did a program download originate from a host that is not an approved Engineering Workstation,
    target a PLC outside its approved engineer-to-controller pairing, use a programming protocol/port
    not on the conduit allow-list, or occur outside a change-controlled maintenance window?
  context: Deterministic allow-listing is the strongest control against unauthorized reprogramming. The
    analyst verifies that any observed program download matches an approved (EWS host, target PLC) pairing,
    uses an allow-listed programming protocol/port on the conduit, and falls within a documented maintenance
    window. Alert when any of these conditions is violated. PLC-to-PLC or non-EWS S7Comm downloads are
    explicit indicators of compromise (e.g., worm propagation within the PLC layer). A positive result
    - a download from an unexpected source, to an unexpected controller, over an unexpected port, or off-window
    - is high-confidence malicious lateral movement. A negative result is a download fully within the
    segmentation and change-control policy. This directly supports Lateral Movement detection by catching
    pivots that bypass approved engineering paths.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each program_download(src, dst_plc, proto, port, time):\n  if src not in authorized_EWS\n\
      \     OR (src,dst_plc) not in approved_pairings\n     OR (proto,port) not in conduit_allowlist\n\
      \     OR time not in change_window(dst_plc):\n     alert(severity=high, reason=allowlist_violation)"
  - technology: Zeek/pseudocode
    query: 'from s7comm,enip logs where function in {download_block,block_write}

      where src_is_plc(src) OR src not in EWS_set

      emit ioc_non_ews_download(src,dst,session)'
- question: After a programming session, did the PLC's block inventory, checksum, firmware, and configuration
    metadata change such that the entire logic image - not just a subset of blocks - was replaced or reinitialized
    without a documented maintenance activity?
  context: A full 'Download All' replaces the whole project rather than editing individual blocks. The
    analyst compares post-session PLC block inventory, checksum, firmware, and configuration metadata
    against the known-good baseline in asset inventory. Alert when the complete logic image is replaced
    or reinitialized and the change is not tied to a documented activity. A positive result is a wholesale
    image change with no change record - strong evidence of malicious overwrite. A negative result is
    either an unchanged image or a partial, documented edit. This is tactic-specific to Lateral Movement
    because reprogramming a controller in full is a high-impact way for an adversary to control a remote
    ICS system after pivoting in.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each plc:\n  baseline = asset_inventory.expected(plc)  # block_set, checksum, fw, config_hash\n\
      \  current = post_session_state(plc)\n  if current.block_set != baseline.block_set (full replace)\n\
      \     OR current.checksum != baseline.checksum\n     OR current.config_hash != baseline.config_hash:\n\
      \     if not documented_change(plc): alert(reason=whole_project_replacement)"
- question: Did a programming session's duration, bytes transferred, or number of blocks written exceed
    the per-PLC baseline (99th percentile or modified z-score > 3.5) in a way consistent with a full overwrite
    rather than a routine partial edit?
  context: Full downloads transfer far more data and far more blocks than incremental edits. The analyst
    builds per-asset baselines for session duration, bytes transferred (Volume), and block-write count
    from at least 30 days of per-PLC maintenance history, recomputed monthly, and flags values above the
    99th percentile or a modified z-score greater than 3.5. A Matrix Profile discord approach offers a
    near-parameter-free baseline for these metrics. A positive result is a session whose volume/block
    count is a statistical outlier consistent with a complete image transfer; a negative result is a session
    within normal partial-edit ranges. This supports Lateral Movement detection by quantitatively separating
    massive overwrite transfers from benign engineering traffic.
  answer_sources: *id001
  range: Last 90 days (baseline >=30 days per PLC, recompute monthly)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline(plc): collect bytes, duration, block_count per session over >=30d\n  med = median(metric);\
      \ mad = MAD(metric)\nfor new session s on plc:\n  mz = 0.6745*(s.metric - med)/mad\n  if mz > 3.5\
      \ OR s.metric > p99(plc.metric):\n     alert(reason=volume_block_outlier, metric, mz)"
- question: Do the timing and periodicity of programming sessions and controller STOP commands deviate
    from the historical pattern - aperiodic programming bursts, sessions outside approved change windows,
    or sessions from rarely used source hosts?
  context: Legitimate engineering activity is periodic and confined to known windows. The analyst models
    historical timing (programming sessions per PLC per week, inter-arrival of STOP commands) and periodicity
    by hour, weekday, and maintenance window, then applies DFA/phase-aware anomaly detection to flag aperiodic
    programming bursts and controller-state transitions outside approved change periods or from rarely
    used hosts. A positive result is a download occurring at an anomalous time, in an unexpected burst,
    or from an uncommon source; a negative result is a session matching normal cadence. This is tactic-specific
    to Lateral Movement because adversary reprogramming often happens off-hours or in irregular bursts
    that break the plant's temporal rhythm.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model per plc: sessions_per_week, stop_inter_arrival, hist by (hour,weekday)\nfor new session\
      \ s:\n  expected = periodic_profile(plc, s.hour, s.weekday)\n  if s outside maintenance_window\n\
      \     OR aperiodic_burst(plc, recent_sessions)\n     OR src_host_rarity(s.src) high:\n     alert(reason=timing_anomaly)"
- question: Did incremental traffic statistics (byte/packet rate, jitter, inter-arrival) for an engineering-to-PLC
    flow produce a reconstruction-error or anomaly-score spike consistent with an unusually large or fast
    programming transfer?
  context: Streaming anomaly detection can catch overwrite transfers in near-real-time without waiting
    for batch baselines. The analyst computes incremental damped-window traffic statistics (byte/packet
    rate, jitter, inter-arrival) for engineering-to-PLC flows and alerts on score/reconstruction-error
    spikes that accompany an unusually large or fast programming transfer, using online ensemble-autoencoder
    feature engineering. A positive result is a flow whose online statistics spike during the candidate
    download; a negative result is a flow whose statistics remain within learned norms. This supports
    Lateral Movement detection by surfacing the network signature of a full download as it occurs on the
    control network.
  answer_sources: *id001
  range: Last 90 days (streaming/online scoring)
  queries:
  - technology: Zeek/pseudocode
    query: "stream ews_to_plc flows:\n  feats = damped_window_stats(byte_rate, pkt_rate, jitter, inter_arrival)\n\
      \  score = online_autoencoder.recon_error(feats)\n  if score > dynamic_threshold:\n     alert(reason=flow_stat_spike,\
      \ flow, score)"
- question: Was there a spike in failed logons (Event ID 4625), blocked/denied programming connections,
    or controller STOP/PROGRAM transitions immediately preceding a successful full program download?
  context: Failure-mode signals often corroborate a forced reprogramming. The analyst tracks failed logons
    (4625) and blocked/denied programming connections preceding a session, plus the count of controller
    STOP/PROGRAM transitions per interval (success/fail state). A spike in denied connections or STOP
    commands immediately before a successful full download is a high-confidence corroborating signal.
    A positive result is a burst of failures or state changes right before the overwrite (suggesting brute
    force or repeated attempts); a negative result is a clean, single authorized session with no preceding
    failures. This is tactic-specific to Lateral Movement because adversaries frequently probe or fail
    authentication before achieving access to reprogram a controller.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "window = [download.start - 60m, download.start]\nfails = count(WinEvent 4625 on ews_host in\
      \ window)\ndenied = count(blocked_programming_conn to dst_plc in window)\nstops = count(controller\
      \ STOP/PROGRAM transitions in window)\nif (fails > baseline_p99) OR (denied > 0) OR (stops spike)\
      \ preceding successful download:\n   alert(reason=failure_statechange_corroboration)"
- question: Does a programming session's feature set (source host, destination PLC, command ordering,
    transfer size/byte ratio, timing, authentication context) resemble atypical overwrite activity when
    scored by an Isolation Forest or Random Forest, with the top contributing features surfaced?
  context: Multivariate ML can flag sessions that individual rules miss. The analyst trains an Isolation
    Forest or Random Forest on session features - source host, destination PLC, command ordering, transfer
    size/byte ratio, timing, authentication context - to identify atypical programming sessions resembling
    malicious overwrites, surfacing the top-3 contributing features (e.g., transfer-volume z-score, source-host
    rarity, off-window timing) in every alert for analyst interpretability. A positive result is a session
    scored anomalous with explainable drivers; a negative result is a session scored normal. Run this
    strictly in parallel with the deterministic and statistical layers, never as the sole control. This
    supports Lateral Movement detection by catching subtle combinations of features characteristic of
    adversary reprogramming.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [src_host, dst_plc, cmd_order, transfer_size, byte_ratio, timing, auth_ctx]\nmodel\
      \ = IsolationForest()/RandomForest() trained on labeled/normal sessions\nfor session s:\n  score\
      \ = model.score(s)\n  if score anomalous:\n     alert(reason=ml_session_anomaly, top3=shap_top_features(s))"
- question: Does the event sequence of a programming session (authenticate-query-stop-download-start)
    and the PLC state transitions appear truncated, reordered, or unusually repetitive when scored by
    an LSTM or Hidden Markov Model trained on normal sequences?
  context: Forced full downloads can break the expected order of operations. The analyst uses a sequence
    classifier (LSTM or HMM) to learn the normal order of authenticate-query-stop-download-start events
    and expected PLC state transitions, then flags sessions with truncated, reordered, or unusually repetitive
    sequences consistent with forced full program downloads. A positive result is a session whose event
    order diverges from the learned norm; a negative result is a session matching the expected sequence.
    Because such ML detectors degrade on unseen attacks and are evadable, run them strictly in parallel
    with the deterministic and statistical layers and never as the sole control. This supports Lateral
    Movement detection by identifying anomalous control-flow in the reprogramming handshake.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = ordered_events(session)  # authenticate,query,stop,download,start + state transitions\n\
      model = LSTM()/HMM() trained on normal session sequences\np = model.likelihood(seq)\nif p < threshold\
      \ OR seq truncated/reordered/repetitive:\n   alert(reason=abnormal_overwrite_sequence)\n# corroborate\
      \ with deterministic + statistical layers"
