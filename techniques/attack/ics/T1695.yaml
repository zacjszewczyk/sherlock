- question: '[Inhibit Response Function] Baseline and threshold control-loop volume/frequency (Statistical
    Method): Can you determine whether OT communications between supervisory systems and field devices
    are being blocked or degraded by applying the ''Baseline and threshold control-loop volume/frequency''
    approach? Specifically, are you able to detect the condition where volume, frequency, and state metrics
    of a control loop deviate sharply from baseline: packet rate, byte throughput, and the poll/response
    success ratio collapse, or the periodicity of steady reporting traffic is lost. These are the physics
    of a blocked channel and are measured per channel rather than as global ''style'' features.'
