    deviate sharply from baseline: packet rate, byte throughput, and the poll/response success ratio collapse,
    or the periodicity of steady reporting traffic is lost. These are the physics of a blocked channel
    and are measured per channel rather than as global ''style'' features. The ''Baseline and threshold
    control-loop volume/frequency'' approach (Statistical Method) works as follows: Establish a >=30-day
    baseline of packet rate, byte throughput, and poll/response success ratio for each control loop. Alert
    when these fall below the 1st percentile of the baseline or remain >3 standard deviations under the
    hourly mean for a sustained interval, indicating communications are blocked rather than merely delayed.
