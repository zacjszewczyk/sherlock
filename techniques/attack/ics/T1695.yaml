questions:
- question: '[Inhibit Response Function] Correlate repeated protocol timeouts and missing request/response
    pairs (Symbolic Logic): Can you determine whether OT communications between supervisory systems and
    field devices are being blocked or degraded by applying the ''Correlate repeated protocol timeouts
    and missing request/response pairs'' approach? Specifically, are you able to detect the condition
    where industrial-control communications between supervision systems and field devices stop or degrade
    in a way that produces repeated protocol timeouts, missing poll/response pairs, broken protocol timing/sequence,
    or an abrupt drop in expected traffic volume for a normally steady control loop. Because OT machine-to-machine
    traffic is highly periodic and predictable, the gap itself is the indicator of blocked traffic rather
    than benign noise. Profile failure states (TCP RST, ICMP unreachable, unanswered requests) as distinct
    signals from a clean shutdown.'
  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary blocks
    reporting and command messages from reaching their intended target devices over serial COM, Ethernet,
    Wi-Fi, cellular, or satellite mediums -- disrupting processes and operations and potentially causing
    cyber-physical impact, often to hide or enable an Impact technique. Adversaries achieve this through
    firmware/rootkit/hooking modifications, Service Stop, Denial of Service, or Adversary-in-the-Middle
    interception. What the analyst is looking for: Industrial-control communications between supervision
    systems and field devices stop or degrade in a way that produces repeated protocol timeouts, missing
    poll/response pairs, broken protocol timing/sequence, or an abrupt drop in expected traffic volume
    for a normally steady control loop. Because OT machine-to-machine traffic is highly periodic and predictable,
    the gap itself is the indicator of blocked traffic rather than benign noise. Profile failure states
    (TCP RST, ICMP unreachable, unanswered requests) as distinct signals from a clean shutdown. The ''Correlate
    repeated protocol timeouts and missing request/response pairs'' approach (Symbolic Logic) works as
    follows: Monitor Zeek conn.log together with modbus.log, dnp3.log, and s7comm.log for repeated timeout,
    reset, or unanswered-request conditions and for broken command/response pairing between known supervisory
    hosts and field devices. Encode valid function codes, addressing, and command/response semantics as
    deterministic rules per [Mohan et al.](https://arxiv.org/abs/2412.07917). Alert when a normally reachable
    PLC or RTU stops responding to >=3 consecutive polls while other control traffic on the same segment
    remains active. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    communications to one or more field devices are likely being blocked; pivot to the affected channel/conduit,
    the supervisory host and target PLC/RTU, the protocol and function codes involved, the timing of the
    gap, and any correlated service stops, firewall/ACL changes, resets, or AitM indicators on the same
    segment to confirm intent and scope physical-process risk. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, slow, or partial blocking -- especially where alternative communication paths keep
    some alarms visible.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Windows Event ID 7036
  - 'NAI: HMI, SCADA, historian, and PLC communication paths in the supervisory and process-control layers
    of the OT network.'
  range: Last 90 days (correlate around the comms-gap window; tighten to minutes/hours for burst rules)
  queries:
  - technology: Zeek/pseudocode
    query: "LOAD conn.log, modbus.log, dnp3.log, s7comm.log\nFOR each (supervisory_host -> field_device)\
      \ channel:\n  pair requests with responses by transaction id / function code\n  ts_gap = count consecutive\
      \ polls with no response\n  WHERE ts_gap >= 3 AND function_code IN allowed_set\n        AND other_channels_on_segment\
      \ still active\n  ALERT 'loss-of-comms: PLC not responding while segment active'\nALSO flag conn.log\
      \ entries with conn_state in (RSTO,RSTR,S0,REJ)\n     against a normally-reachable field_device"
  - technology: SIEM/Rule pseudocode
    query: "index=zeek (modbus OR dnp3 OR s7comm OR conn)\n| stats count(eval(resp_pkts=0)) as unanswered,\
      \ dc(uid) as polls\n        by orig_h, resp_h, function_code, bin(_time,1m)\n| where unanswered>=3\n\
      | join resp_h [search index=ot_inventory role=PLC OR role=RTU]"
