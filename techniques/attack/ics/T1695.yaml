name: 'T1695: Block Communications'
id: bb2925a6-557e-434e-9ecf-e9965f46398a
description: 'This playbook helps an analyst investigate whether an adversary is blocking communications
  between supervisory systems (HMI, SCADA, historian) and field devices (PLCs, RTUs) to prevent reporting
  and command messages from reaching their intended targets (MITRE ATT&CK for ICS T1695, Block Communications).
  Because OT machine-to-machine traffic is highly periodic and predictable, a blocked or degraded channel
  manifests as repeated protocol timeouts, missing poll/response pairs, broken protocol timing or sequence,
  bursts of TCP RST / ICMP unreachable failure states, and an abrupt collapse in packet rate, byte throughput,
  or the loss of steady-reporting periodicity for a normally steady control loop. The hunt pursues this
  behavior from three complementary angles: deterministic symbolic-logic rules (correlated protocol timeouts
  and missing request/response pairs, per-PLC timing/sequence automata, OT loss-of-comms and config-change
  baselining with protocol/port allow-listing and service-stop/ACL-change correlation, and Suricata-style
  rate thresholding of failure-state bursts), statistical methods (per-channel volume/frequency baselining
  and thresholding, CUSUM/PELT/Bayesian change-point detection on cadence and throughput, FFT/PCA periodicity
  and Matrix Profile discord checks, and Shannon-entropy shift on flow/address distributions), and machine
  learning (1D-CNN/Seq2Seq forecasting of expected reporting volume, unsupervised streaming flow anomaly
  scoring with Kitsune/one-class models, SHAP explainable feature attribution, and a discipline of running
  every learned detector in parallel beneath an authoritative deterministic loss-of-comms floor). These
  are applied across Zeek conn/modbus/dnp3/s7comm logs, network flow records, operational process alarms
  and historian data, and Windows service-control events (Event ID 7036/7040), so the analyst can corroborate
  a suspected communications block against network, process, and host context and distinguish it from
  a benign shutdown or phase transition.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
