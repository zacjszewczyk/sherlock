name: 'T0827: Loss of Control'
id: b2d171cc-3796-4d1a-b43f-47edf8c769e0
description: 'Investigate whether an adversary has caused a sustained loss of control over a critical
  industrial process — a condition in which operators can no longer reliably issue commands to field devices,
  or in which the physical process diverges from operator intent. This playbook helps an analyst correlate
  HMI/operator-station telemetry, OT network protocol logs (Zeek modbus.log, dnp3.log, s7comm.log, enip.log,
  conn.log), Process Historian time-series, and Safety Instrumented System (SIS) records to find three
  interlocking failure patterns: (1) an HMI or Engineering Workstation that is attempting to poll or command
  a PLC but whose Write commands never succeed (communication errors, suppressed/uncommanded control messages,
  stalled or flooded polling cadence, and spikes in Modbus exception responses); (2) a critical process
  variable that excurts beyond its safe operational envelope for a sustained period with NO corresponding
  authorized Write command in the network logs that could legitimately explain the change, indicating
  physical change without a command cause; and (3) a Safety Instrumented System trip or emergency shutdown
  that occurs with neither a preceding safety-limit excursion nor an authorized manual trip from a whitelisted
  SIS workstation. It layers deterministic symbolic-logic specification/allow-deny rules and process invariants
  (the explainable floor that runs regardless of ML availability), statistical baselining (percentile
  bands, CUSUM residual tests, rarity scoring), and explainable machine-learning anomaly detection (Isolation
  Forest, forecast-residual models, supervised SIS-trip classifiers) so that loss-of-control behavior
  is surfaced even when self-reported device state would otherwise hide it.'
type: technique
