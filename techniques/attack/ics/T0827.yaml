  context: 'Evidence: A Human Machine Interface (HMI) generates application-level communication error
    events (Windows Event ID 1000) while network logs (Zeek modbus.log) simultaneously show a lack of
    successful Modbus ''Write'' commands (Function Codes 0x05, 0x06, 0x0F, 0x10) from the HMI''s IP address
    to a target PLC, and/or a statistically significant spike in Modbus Exception Responses (e.g., ''Illegal
    Function'', ''Illegal Data Address'') from the PLC back to the HMI. This addresses the Impact tactic
    by detecting a sustained loss of control over the industrial process. Method (Symbolic Logic): Model
    the normally highly-periodic HMI->PLC polling/command stream per device pair as a deterministic finite
    automaton with expected inter-arrival period (e.g., 100ms-1s) and alert when expected messages are
    missing, delayed, duplicated, or out-of-order beyond the learned phase tolerance, indicating the control
    channel has stalled or is being flooded (Frequency signal). Use automatic phase-shift handling so
    the timing model stays accurate, per [Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068).
    Maintain authorized HMI/EWS source-IP and port allow-lists per [Guide to Operational Technology (OT)
    Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
