  - technology: SIEM/Rule pseudocode
    query: "// Mine + enforce deterministic process invariants\nINVARIANTS = { pump_ON => downstream_level\
      \ rising within N s,\n               valve_CLOSED => flow ~ 0, ... }\nFOR each historian sample:\n\
      \  IF any invariant violated:\n    ALERT 'Process invariant violation' + localize affected loop\n\
      (runs regardless of ML availability)"
- question: PV excursion without authorized command (residual+CUSUM) — In the context of Impact, can you
    determine the following? A critical process variable (e.g., boiler pressure, turbine RPM) recorded
    in the Process Historian deviates beyond its established operational envelope (e.g., > 99th percentile
    of 30-day values) for a sustained period (e.g., > 5 minutes). This deviation occurs without any corresponding
