    alert MUST list the top-3 contributing features (e.g., via per-feature attribution) so analysts see
    WHY it fired, following the explainable feature-ranking approach of [Explainable Anomaly Detection
    for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930). Run this only in parallel
    with the deterministic rules above, never alone, because ML detection collapses on unseen attacks
    per [A False Sense of Security? Revisiting the State of Machine Learning-Based Industrial Intrusion
    Detection](https://arxiv.org/abs/2205.09199).'
