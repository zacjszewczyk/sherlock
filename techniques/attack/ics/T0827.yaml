  context: 'Evidence: A critical process variable (e.g., boiler pressure, turbine RPM) recorded in the
    Process Historian deviates beyond its established operational envelope (e.g., > 99th percentile of
    30-day values) for a sustained period (e.g., > 5 minutes). This deviation occurs without any corresponding
    authorized ''Write'' commands from a whitelisted HMI or Engineering Workstation IP address to the
    relevant PLC registers observed in network traffic logs (e.g., Zeek modbus.log, dnp3.log) that would
    legitimately cause the change. This addresses the Impact tactic by detecting a sustained loss of control
    over the industrial process. Method (Statistical Method): For each critical process variable (PV)
    from the Historian, compute a 30-day rolling baseline (1st/99th percentile band) and alert if the
    PV stays outside the band for 5 consecutive minutes WITHOUT a corresponding authorized ''Write'' in
    network logs (the State signal: physical change with no command cause). Strengthen this with a physics-based
    residual between observed PV and a model/forecast prediction, fed to a stateful CUSUM test to catch
    slow runaway drift that stays under per-sample limits, tuned with an impact-vs-false-alarm metric,
    per [Limiting the Impact of Stealthy Attacks on Industrial Control Systems](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf)
    and the MPC-reference residual+CUSUM design of [A Physics-Based Attack Detection Technique in Cyber-Physical
    Systems](https://arxiv.org/abs/1910.03162). In parallel, run Matrix Profile discord detection over
    PV and write-command cadence to flag abrupt cadence shifts, per [Anomaly-based Intrusion Detection
    in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374). Track write Volume
    (commands/min) and Frequency, not only Shannon entropy of register addresses (entropy below the 5th
    percentile remains a supplemental repetitive-command indicator).'
  answer_sources:
