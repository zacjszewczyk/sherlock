  context: 'Evidence: A critical process variable (e.g., boiler pressure, turbine RPM) recorded in the
    Process Historian deviates beyond its established operational envelope (e.g., > 99th percentile of
    30-day values) for a sustained period (e.g., > 5 minutes). This deviation occurs without any corresponding
    authorized ''Write'' commands from a whitelisted HMI or Engineering Workstation IP address to the
    relevant PLC registers observed in network traffic logs (e.g., Zeek modbus.log, dnp3.log) that would
    legitimately cause the change. This addresses the Impact tactic by detecting a sustained loss of control
    over the industrial process. Method (Symbolic Logic): Mine and enforce deterministic invariants —
    predicates over correlated sensor/actuator values that must always hold in normal operation (e.g.,
    pump ON => downstream level rising within N seconds; valve CLOSED => flow ~ 0). Alert when an invariant
    is violated, which localizes the loop that has lost control, per [A Systematic Framework to Generate
    Invariants for Anomaly Detection in Industrial Control Systems](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf).
    These rules are the explainable floor and run regardless of ML availability.'
