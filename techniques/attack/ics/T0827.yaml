questions:
- question: HMI comm error with no writes — In the context of Impact, can you determine the following?
    A Human Machine Interface (HMI) generates application-level communication error events (Windows Event
    ID 1000) while network logs (Zeek modbus.log) simultaneously show a lack of successful Modbus 'Write'
    commands (Function Codes 0x05, 0x06, 0x0F, 0x10) from the HMI's IP address to a target PLC, and/or
    a statistically significant spike in Modbus Exception Responses (e.g., 'Illegal Function', 'Illegal
    Data Address') from the PLC back to the HMI.
  context: 'Evidence: A Human Machine Interface (HMI) generates application-level communication error
    events (Windows Event ID 1000) while network logs (Zeek modbus.log) simultaneously show a lack of
    successful Modbus ''Write'' commands (Function Codes 0x05, 0x06, 0x0F, 0x10) from the HMI''s IP address
    to a target PLC, and/or a statistically significant spike in Modbus Exception Responses (e.g., ''Illegal
    Function'', ''Illegal Data Address'') from the PLC back to the HMI. This addresses the Impact tactic
    by detecting a sustained loss of control over the industrial process. Method (Symbolic Logic): Trigger
    when a Windows Event ID 1000 from an HMI host indicates communication failure (message contains ''Modbus
    communication error'' or ''PLC connection lost''), then query Zeek modbus.log for the HMI source IP
    over the same 1-minute window and alert if ZERO successful Modbus ''Write'' commands (function codes
    0x05, 0x06, 0x0F, 0x10) were observed AND at least one read/poll attempt was made (the State signal:
    the operator is trying but cannot command). Encode this as a specification/allow-deny rule over protocol
    state and command/response pairing so suppressed or uncommanded control messages fire deterministically
    without labeled data, per [On Specification-based Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354)
    and the auto-generated DNP3/Modbus/IEC 61850 semantic rules of [Distributed Intrusion Detection System
    using Semantic-based Rules for SCADA in Smart Grid](https://arxiv.org/abs/2412.07917).'
  answer_sources:
  - Windows Event ID 1000
  - Zeek modbus.log
  - 'NAI: HMI hosts in the control room, PCN network taps monitoring traffic to critical PLCs (e.g., Boiler
    Control PLC, Turbine Governor PLC), Engineering Workstation subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON WindowsEventID=1000 WHERE host IN hmi_hosts AND (message ~ 'Modbus communication error'\
      \ OR message ~ 'PLC connection lost'):\n  win = [event.time - 60s, event.time]\n  reads  = COUNT(zeek_modbus\
      \ WHERE id_orig_h=hmi.ip AND func IN (0x01,0x02,0x03,0x04) AND time IN win)\n  writes = COUNT(zeek_modbus\
      \ WHERE id_orig_h=hmi.ip AND func IN (0x05,0x06,0x0F,0x10) AND time IN win)\n  IF writes == 0 AND\
      \ reads >= 1: ALERT 'HMI commanding but no writes succeed' (operator trying, cannot command)"
