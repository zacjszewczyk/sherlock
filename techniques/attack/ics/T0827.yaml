  context: 'Evidence: A critical process variable (e.g., boiler pressure, turbine RPM) recorded in the
    Process Historian deviates beyond its established operational envelope (e.g., > 99th percentile of
    30-day values) for a sustained period (e.g., > 5 minutes). This deviation occurs without any corresponding
    authorized ''Write'' commands from a whitelisted HMI or Engineering Workstation IP address to the
    relevant PLC registers observed in network traffic logs (e.g., Zeek modbus.log, dnp3.log) that would
    legitimately cause the change. This addresses the Impact tactic by detecting a sustained loss of control
    over the industrial process. Method (Machine Learning): Train predict-then-threshold-residual forecasters
    only on normal data to learn the dynamic relationship between related PVs and legitimate ''Write''
    commands, then alert when observed PVs persistently fall outside the predicted interval (>3 min) —
    i.e., the process behaves in a way legitimate inputs do not explain. Vector Autoregression (VAR) gives
    an interpretable linear baseline; a lightweight 1D-CNN forecaster ([Detecting Cyberattacks in Industrial
    Control Systems Using Convolutional Neural Networks](https://arxiv.org/abs/1806.08110)) and a Seq2Seq
    encoder-decoder that also LOCALIZES the affected sensor/actuator ([Anomaly Detection for Industrial
    Control Systems Using Sequence-to-Sequence Neural Networks](https://arxiv.org/abs/1911.04831)) extend
    it. Surface the top-3 contributing PVs/actuators in the alert via SHAP-style attribution per [Explainable
    Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930).
    Keep the symbolic invariant and residual/CUSUM layers active in parallel because adversarial sensor
    spoofing can evade process-based ML ([No Need to Know Physics](https://arxiv.org/abs/2012.03586))
    and ML degrades on unseen attacks ([A False Sense of Security?](https://arxiv.org/abs/2205.09199)).'
