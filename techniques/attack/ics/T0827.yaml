- question: Unauthorized write to PLC registers — In the context of Impact, can you determine the following?
    A critical process variable (e.g., boiler pressure, turbine RPM) recorded in the Process Historian
    deviates beyond its established operational envelope (e.g., > 99th percentile of 30-day values) for
    a sustained period (e.g., > 5 minutes). This deviation occurs without any corresponding authorized
    'Write' commands from a whitelisted HMI or Engineering Workstation IP address to the relevant PLC
    registers observed in network traffic logs (e.g., Zeek modbus.log, dnp3.log) that would legitimately
    cause the change.
  context: 'Evidence: A critical process variable (e.g., boiler pressure, turbine RPM) recorded in the
    Process Historian deviates beyond its established operational envelope (e.g., > 99th percentile of
    30-day values) for a sustained period (e.g., > 5 minutes). This deviation occurs without any corresponding
    authorized ''Write'' commands from a whitelisted HMI or Engineering Workstation IP address to the
    relevant PLC registers observed in network traffic logs (e.g., Zeek modbus.log, dnp3.log) that would
    legitimately cause the change. This addresses the Impact tactic by detecting a sustained loss of control
    over the industrial process. Method (Symbolic Logic): Maintain a stateful whitelist of authorized
    HMI/EWS source IPs and the specific PLC registers/DNP3 objects each may write. Monitor all ''Write''
    commands in Zeek modbus.log and dnp3.log and raise high-severity alerts for any write from a non-whitelisted
    IP or to an unauthorized register/object, using semantic protocol rules (valid function codes, command/response
    pairing, addressing) per [Distributed Intrusion Detection System using Semantic-based Rules for SCADA
    in Smart Grid](https://arxiv.org/abs/2412.07917) and the allow-listing baseline in [Guide to Operational
    Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek conn.log
  - Process Historian Data
  - Windows Event ID 4624
  - 'NAI: Process Historian database servers, Network taps capturing traffic between Level 1 (PLCs/RTUs)
    and Level 2 (Supervisory Control), specific PLCs controlling critical physical processes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Stateful whitelist: authorized src_ip -> allowed PLC registers / DNP3 objects\nFOR write\
      \ IN (zeek_modbus.write UNION zeek_dnp3.write):\n  IF write.src_ip NOT IN whitelist OR write.target_reg\
      \ NOT IN allowed[write.src_ip]:\n    ALERT HIGH 'Unauthorized write to PLC register/object'\n  VALIDATE\
      \ semantic rules: function code, command/response pairing, addressing"
