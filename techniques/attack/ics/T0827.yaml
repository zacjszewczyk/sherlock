      \ no command cause' (State signal)\nresidual = PV_observed - PV_model_forecast; CUSUM(residual)\
      \ -> ALERT on slow runaway\nMatrixProfile.discord(PV, write_cadence) -> ALERT on abrupt cadence\
      \ shift\nTRACK write volume(cmds/min), frequency; entropy(reg_addr) < p5 = supplemental"
