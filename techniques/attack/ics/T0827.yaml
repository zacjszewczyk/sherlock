  context: 'Evidence: A Human Machine Interface (HMI) generates application-level communication error
    events (Windows Event ID 1000) while network logs (Zeek modbus.log) simultaneously show a lack of
    successful Modbus ''Write'' commands (Function Codes 0x05, 0x06, 0x0F, 0x10) from the HMI''s IP address
    to a target PLC, and/or a statistically significant spike in Modbus Exception Responses (e.g., ''Illegal
    Function'', ''Illegal Data Address'') from the PLC back to the HMI. This addresses the Impact tactic
    by detecting a sustained loss of control over the industrial process. Method (Statistical Method):
    For each HMI-to-PLC pair, baseline 30 days of Modbus Exception Response code counts per 5-minute interval
    and compute the 99th percentile; alert when a 5-minute sliding window exceeds it. Add a stateful CUSUM
    (cumulative-sum) test over the exception-rate residual to catch slow, sustained error growth that
    stays under the per-window threshold, and explicitly profile the FAILURE rate (ratio of exception/''Illegal
    Function'',''Illegal Data Address'' responses to total requests; alert if it exceeds the 99th-percentile
    baseline) as a distinct signal, per the residual/CUSUM framework in [Limiting the Impact of Stealthy
    Attacks on Industrial Control Systems](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf). Report
    counts (Volume) and per-minute rates (Frequency) in the alert. Correlate with the symbolic comm-error
    alert for higher fidelity.'
  answer_sources:
  - Windows Event ID 1000
  - Zeek modbus.log
  - 'NAI: HMI hosts in the control room, PCN network taps monitoring traffic to critical PLCs (e.g., Boiler
    Control PLC, Turbine Governor PLC), Engineering Workstation subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Per HMI->PLC pair, 30d baseline of exception-response counts per 5min

      baseline_p99 = percentile(99, counts_5min[pair], 30d)

      sliding_5min = COUNT(zeek_modbus exception_resp WHERE pair) over window

      IF sliding_5min > baseline_p99: ALERT

      CUSUM(residual = exc_rate - mean) -> ALERT on sustained slow growth

      failure_rate = exc_resp / total_req; IF failure_rate > p99_baseline: ALERT

      REPORT volume=count, frequency=count/min; CORRELATE with comm-error alert'
