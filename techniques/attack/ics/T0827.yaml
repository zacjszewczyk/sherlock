- question: SIS trip without valid cause — In the context of Impact, can you determine the following?
    A Safety Instrumented System (SIS) initiates a trip or emergency shutdown, confirmed via SIS system
    logs. However, this trip is not preceded by a valid cause, such as a critical process variable in
    the Process Historian exceeding its defined safety limit or an authorized manual trip command issued
    from a whitelisted SIS workstation.
  context: 'Evidence: A Safety Instrumented System (SIS) initiates a trip or emergency shutdown, confirmed
    via SIS system logs. However, this trip is not preceded by a valid cause, such as a critical process
    variable in the Process Historian exceeding its defined safety limit or an authorized manual trip
    command issued from a whitelisted SIS workstation. This addresses the Impact tactic by detecting a
    sustained loss of control over the industrial process. Method (Symbolic Logic): On any SIS trip alarm,
    execute a lookback over the preceding 5 minutes across two sources: (1) Process Historian, to check
    whether any PV crossed its defined safety trip point, and (2) SIS command logs + Windows Event ID
    4624, to check for an authorized manual trip from a whitelisted SIS workstation. Raise a critical
    alert if the trip occurred with NEITHER a preceding safety-limit excursion NOR an authorized manual
    command. Codify expected SIS cause/effect as an allow/deny specification per [On Specification-based
    Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354), and enforce SIS network
    isolation/whitelisting per [Guide to Operational Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek enip.log
  - SIS System Logs
  - Process Historian Data
  - 'NAI: SIS Logic Solver hardware, SIS Engineering Workstations, Network segments dedicated to the Safety
    Instrumented Network (SIN), Firewalls or Data Diodes separating the SIN from the PCN.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON SIS_trip_alarm:\n  win = [trip.time - 5min, trip.time]\n  pv_excursion = EXISTS(historian\
      \ PV crossed safety_trip_point IN win)\n  manual = EXISTS(SIS_cmd_log manual_trip FROM whitelisted_ws)\
      \ AND EXISTS(WinEventID=4624 from SIS ws IN win)\n  IF NOT pv_excursion AND NOT manual:\n    ALERT\
      \ CRITICAL 'SIS trip without valid cause'\nENFORCE SIS network isolation/whitelisting"
