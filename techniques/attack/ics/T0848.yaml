name: 'T0848: Rogue Master'
id: 8fb52a30-3230-4aea-9740-026476ab6548
description: 'This playbook helps an analyst investigate whether an adversary has stood up a rogue master
  (control server) on an ICS/SCADA network to issue illegitimate control messages to outstations (PLCs,
  RTUs), disrupt or hijack communications meant for the legitimate master, and thereby manipulate the
  operator''s view of the industrial process (MITRE ATT&CK for ICS T0848, Rogue Master). A rogue master
  can send valid-looking Modbus write function codes (5, 6, 15, 16) or DNP3 WRITE/OPERATE commands from
  an unauthorized source, redirect or impersonate the real master via ARP/IP takeover, stop the legitimate
  master service to capture its traffic, or appear as a brand-new device on the Process Control Network
  (PCN). This hunt pursues the behavior from several complementary angles spanning both Impact (TA0105
  -- has the operator''s view of the process been manipulated?) and Initial Access (TA0108 -- is an unauthorized
  device acting as a master?): write/control commands from sources not on the authoritative master allowlist;
  abnormal write volume, cadence, and target-point deviations; outstations initiating connections to unapproved
  destination masters on ICS ports (502/TCP Modbus, 20000/TCP DNP3); IP-to-MAC mismatches, ARP churn,
  and gratuitous-ARP spikes indicating spoofing/MitM; unexpected stops of critical master/SCADA Windows
  services (Event ID 7036) outside maintenance windows; and newly observed MAC addresses that begin emitting
  master-like ICS traffic. Detection methods combine deterministic symbolic-logic rules (authorized-master
  allowlists, IP-to-MAC bindings, deny-by-default conduit whitelists, semantic specification rules and
  per-channel DFA models, asset-inventory reconciliation, critical-service watchlists), statistical baselining
  (write-volume and cadence percentiles, unique-destination and new-MAC rates, multi-MAC/entropy churn,
  REJ/S0 failure-mode counting, service-stop frequency), and machine learning (command-sequence and time-series
  anomaly models, Random-Forest flow classification with top-feature attribution, autoencoder/clustering
  outlier detection such as Kitsune, and process-physics reconstruction models that catch the physical
  effect of rogue commands), applied across Zeek modbus/dnp3/conn/arp/dhcp logs, HMI/SCADA application
  logs, process telemetry, and Windows event logs, so the analyst can corroborate a suspected rogue master
  against network, host, asset, and process-physics context.'
type: technique
