questions:
- question: '[Impact] Enforce authorized master command sources: Can you determine whether ICS write/control
    commands originating from a source not on the authorized master list, or control commands that change
    process values without a corresponding authorized operator action, indicating a rogue master manipulating
    the operator''s view of the process. -- specifically by applying the ''Enforce authorized master command
    sources'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0105), an adversary may operate a rogue master
    to issue illegitimate control commands to outstations, impersonate or displace the legitimate master,
    and manipulate the operator''s view of the process (T0848, Rogue Master). This evidence focuses on
    the condition that ICS write/control commands originating from a source not on the authorized master
    list, or control commands that change process values without a corresponding authorized operator action,
    indicating a rogue master manipulating the operator''s view of the process. The ''Enforce authorized
    master command sources'' approach (Symbolic Logic) works as follows: Maintain an authoritative allowlist
    of master server IPs (and IP-to-MAC bindings) and the expected protocol functions each may issue,
    per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    and [CISA Defense-in-Depth](https://www.cisa.gov/sites/default/files/recommended_practices/NCCIC_ICS-CERT_Defense_in_Depth_2016_S508C.pdf).
    Alert on any Modbus write FC (5,6,15,16) or DNP3 WRITE/OPERATE where the source IP is not on the authorized
    master list, or the function/target point falls outside the allowed set for that master. Generate
    semantic/specification rules encoding legitimate function codes and authorized master->outstation->point
    relationships as in [Mohan et al.](https://arxiv.org/abs/2412.07917) and [Sen et al.](https://arxiv.org/abs/2209.04354);
    model each master->outstation channel as a deterministic finite automaton and alert on any message
    violating the learned sequence/source ([Goldenberg and Wool](https://www.avishaiwool.sites.tau.ac.il/_files/ugd/c7b5d0_49208929d90040bc8162ca4aa901b654.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    a rogue master and warrants pivoting to the offending source IP/MAC, the targeted outstation(s) and
    point(s), the ICS protocol and function codes used, the authorized master baseline, concurrent device/loss-of-communications
    alarms, and any correlated process-value deviation to scope the operational impact. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, because a single method can miss stealthy, low-and-slow, replayed, or living-off-the-land
    master impersonation -- and ML methods in particular degrade on previously unseen attacks, so the
    deterministic allowlist rules remain the detection floor.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek conn.log
  - HMI application logs
  - 'NAI: Network sensors on the Process Control Network (PCN) monitoring traffic to PLCs/RTUs and the
    HMI/SCADA segment, plus HMI application logs from operator consoles.'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Enforce authorized master command sources (Symbolic Logic)

      source IN [Zeek modbus.log, Zeek dnp3.log, Zeek conn.log, HMI application logs]

      | scope to NAI: Network sensors on the Process Control Network (PCN) monitoring traffic to PLCs/RTUs
      and the HMI/SCADA segment, plus HMI application logs from operator consoles.

      | approach: Maintain an authoritative allowlist of master server IPs (and IP-to-MAC bindings) and
      the expected protocol functions each may issue, per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.8

      | emit alert with contributing fields and entity context (src_ip, src_mac, dst_outstation, ics_proto,
      function_code, target_point, command_rate)'
  - technology: Zeek/pseudocode
    query: '# Enforce authorized master command sources -- Zeek implementation

      event zeek.modbus / zeek.dnp3 / zeek.conn

      | where function in [Modbus FC 5,6,15,16] OR func_name in [WRITE, OPERATE]

      | evaluate against authorized master allowlist / baseline / model per method

      | output ts, id.orig_h, id.resp_h, id.resp_p, func, unit_id/point, uid'
- question: '[Impact] Baseline write command volume and targets: Can you determine whether ICS write/control
    commands originating from a source not on the authorized master list, or control commands that change
    process values without a corresponding authorized operator action, indicating a rogue master manipulating
    the operator''s view of the process. -- specifically by applying the ''Baseline write command volume
    and targets'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0105), an adversary may operate a rogue master
    to issue illegitimate control commands to outstations, impersonate or displace the legitimate master,
    and manipulate the operator''s view of the process (T0848, Rogue Master). This evidence focuses on
    the condition that ICS write/control commands originating from a source not on the authorized master
    list, or control commands that change process values without a corresponding authorized operator action,
    indicating a rogue master manipulating the operator''s view of the process. The ''Baseline write command
    volume and targets'' approach (Statistical Method) works as follows: Build a 30-day baseline of write/control
    command counts per master and per outstation, including time-of-day cadence and per-channel inter-arrival
    timing. Trigger alerts when a master or unknown source exceeds the 99th percentile of normal write
    volume, exceeds 5 writes in 60 seconds, targets a new outstation/point not seen in baseline, or breaks
    the periodic cadence (missing/delayed/extra messages) per phase-aware DFA modeling ([Markman et al.](https://arxiv.org/abs/1808.05068)).
    Score each Modbus transaction''s probability and alert on low-probability/replayed/injected commands
    ([Marsden et al. (PRI-IDS)](https://arxiv.org/abs/1711.02826)). Profile loss-of-communications alarms
    and REJ/S0 conn-states as a distinct failure signal of master takeover ([NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    a rogue master and warrants pivoting to the offending source IP/MAC, the targeted outstation(s) and
    point(s), the ICS protocol and function codes used, the authorized master baseline, concurrent device/loss-of-communications
    alarms, and any correlated process-value deviation to scope the operational impact. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, because a single method can miss stealthy, low-and-slow, replayed, or living-off-the-land
    master impersonation -- and ML methods in particular degrade on previously unseen attacks, so the
    deterministic allowlist rules remain the detection floor.'
