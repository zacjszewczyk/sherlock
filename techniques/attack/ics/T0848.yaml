- question: '[Initial Access] Baseline service stop frequency: Can you determine whether A critical master
    server software service on a Windows host, identified by its service name, logs a ''stopped'' state
    (Windows Event ID 7036) outside of a scheduled and approved maintenance window. -- specifically by
    applying the ''Baseline service stop frequency'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), an adversary may operate a rogue
    master to issue illegitimate control commands to outstations, impersonate or displace the legitimate
    master, and manipulate the operator''s view of the process (T0848, Rogue Master). This evidence focuses
    on the condition that A critical master server software service on a Windows host, identified by its
    service name, logs a ''stopped'' state (Windows Event ID 7036) outside of a scheduled and approved
    maintenance window. The ''Baseline service stop frequency'' approach (Statistical Method) works as
    follows: Build a 30-day baseline of stop events per critical service and alert if stop counts exceed
    1 in 24 hours or exceed 3 standard deviations above the long-term mean for unstable services. Treat
    loss-of-communications alarms concurrent with the stop as a distinct corroborating failure signal
    ([NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    a rogue master and warrants pivoting to the offending source IP/MAC, the targeted outstation(s) and
    point(s), the ICS protocol and function codes used, the authorized master baseline, concurrent device/loss-of-communications
    alarms, and any correlated process-value deviation to scope the operational impact. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, because a single method can miss stealthy, low-and-slow, replayed, or living-off-the-land
    master impersonation -- and ML methods in particular degrade on previously unseen attacks, so the
    deterministic allowlist rules remain the detection floor.'
