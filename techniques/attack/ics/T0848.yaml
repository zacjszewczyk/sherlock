- question: '[Impact] Detect anomalous command sequences: Can you determine whether ICS write/control
    commands originating from a source not on the authorized master list, or control commands that change
    process values without a corresponding authorized operator action, indicating a rogue master manipulating
    the operator''s view of the process. -- specifically by applying the ''Detect anomalous command sequences''
    (Machine Learning) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0105), an adversary may operate a rogue master
    to issue illegitimate control commands to outstations, impersonate or displace the legitimate master,
    and manipulate the operator''s view of the process (T0848, Rogue Master). This evidence focuses on
    the condition that ICS write/control commands originating from a source not on the authorized master
    list, or control commands that change process values without a corresponding authorized operator action,
    indicating a rogue master manipulating the operator''s view of the process. The ''Detect anomalous
    command sequences'' approach (Machine Learning) works as follows: Train a sequence model on normal
    command sequences (function code, outstation, timing) for each authorized master and flag outliers/abnormal
    ordering (e.g., rapid setpoint changes across multiple outstations) consistent with rogue-master manipulation
    ([Kim et al.](https://arxiv.org/abs/1911.04831)); classify authorized vs. anomalous behavior from
    flow features (source/destination, function code, timing) with Random Forest and surface the top-3
    contributing features in the alert ([Anton et al.](https://arxiv.org/abs/1907.10374)). Run this in
    parallel with—never replacing—the deterministic whitelist, and explicitly profile false-negative/false-positive
    rates because ML degrades on unseen attacks ([Kus et al.](https://arxiv.org/abs/2205.09199)). A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong indicator of a rogue master
    and warrants pivoting to the offending source IP/MAC, the targeted outstation(s) and point(s), the
    ICS protocol and function codes used, the authorized master baseline, concurrent device/loss-of-communications
    alarms, and any correlated process-value deviation to scope the operational impact. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, because a single method can miss stealthy, low-and-slow, replayed, or living-off-the-land
    master impersonation -- and ML methods in particular degrade on previously unseen attacks, so the
    deterministic allowlist rules remain the detection floor.'
