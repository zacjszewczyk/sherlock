name: 'T0831: Manipulation of Control'
id: d5fc2806-6ded-4c96-ac29-59ab93f1b11d
description: Investigate possible adversary Manipulation of Control (T0831) within the ICS/OT environment,
  where an attacker alters physical process control by changing setpoint values, tags, or other parameters;
  spoofing command messages; or inserting themselves as a man-in-the-middle to command physical processes
  or falsify the operator's view. This playbook helps an analyst hunt for unauthorized or implausible
  ICS write/control commands (Modbus, DNP3, S7comm, ENIP) from sources not on the asset allowlist, by
  users outside authorized OT operator groups, or outside approved maintenance windows; physically implausible
  or out-of-bounds setpoints and abnormal write rates/frequency; high-risk ICS tooling or interpreters
  launched on HMIs/EWS from unusual parents or network logons; Layer-2/Layer-3 MitM precursors such as
  duplicate MACs, gratuitous ARP, and changed IP-to-MAC bindings; and spoofed or stateless protocol responses
  that misrepresent process state. It combines deterministic specification/whitelist rules, statistical
  baselining, and machine-learning anomaly models so that manipulation can be detected even when it is
  intended to remain hidden from operators.
type: technique
related:
- tactic_id: TA0105
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
