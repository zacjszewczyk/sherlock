questions:
- question: Are ICS write/setpoint commands (Modbus 0x06/0x10, DNP3 0x03/0x04/0x05, S7comm write) reaching
    critical PLC/RTU registers from a source IP that is not on the per-asset allowlist, from a Windows
    logon identity that is not a member of the authorized OT operator group, or outside the documented
    operational/maintenance window?
  context: 'Manipulation of Control under the Impact tactic most often begins with a write command that
    looks structurally valid but is unauthorized in source, identity, or timing. Apply deny-by-default
    authorization (NIST SP 800-82r3): correlate each observed write/setpoint command in the Zeek protocol
    logs with its source IP and, by joining the source host to Windows Event ID 4624 logon data, the initiating
    user. Alert when the source IP is not on the asset allowlist, the user is not in the authorized OT
    operator group, or the command falls outside a defined operational/maintenance window. Because Modbus
    and similar protocols lack authentication, consider in-line eBPF enforcement that filters function
    code and source identity in-kernel, and encode legitimate function-code/register ranges as whitelist
    rules. A positive result is a high-fidelity indicator of unauthorized control; a negative result helps
    confirm only sanctioned operators are commanding the process. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    [eBPF Modbus enforcement, Jhan & Sun](https://arxiv.org/abs/2312.05665), [semantic-based SCADA rules,
    Mohan et al.](https://arxiv.org/abs/2412.07917).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Data Historian Logs
  - 'NAI: Engineering Workstations (EWS) on the Process Control Network (PCN), Human-Machine Interfaces
    (HMIs) on the PCN, Level 1 and 2 Network Segments (containing PLCs, RTUs, IEDs), Data Historian Servers,
    Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  modbus.log/dnp3.log/s7comm.log where func in {write_single,write_multiple,operate}\n\
      \  join conn.log on uid -> src=id.orig_h, dst=id.resp_h\n  join Windows 4624 on src host within\
      \ +-300s -> user\n  alert if src NOT in allowlist[dst]\n     or user NOT in authorized_OT_operators[dst]\n\
      \     or now NOT in maintenance_window[dst]"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=ics func IN (0x06,0x10,0x03,0x04,0x05,s7_write)\n  | lookup asset_allowlist target_plc\
      \ src_ip OUTPUT authorized\n  | lookup ot_operator_group user OUTPUT in_group\n  | where authorized!=\"\
      true\" OR in_group!=\"true\" OR NOT in_window(target_plc, _time)"
- question: Are any ICS write commands carrying setpoint values that are physically implausible (out of
    the per-tag engineering min/max) or that exceed the allowed single-step change, and are there bursts
    of protocol exception/rejected-write responses or denied writes from a given source?
  context: 'Even an authorized source can be abused to push a dangerous value, and attackers probing for
    a working manipulation often generate rejected writes first. Maintain per-tag engineering min/max
    bounds and a maximum single-step change, and alert on any write whose value is out of range or whose
    delta from the last value is too large (a 2025 covert MitM incident featured an implausible 999% dam
    setpoint). Separately, count protocol exception/NAK/rejected-write responses and denied writes per
    source as a distinct failure-mode signal: a burst of rejected writes can indicate scripted manipulation
    attempts before a successful one. A positive result indicates either an integrity attack on the process
    or reconnaissance/brute-forcing of acceptable values. References: [covert MitM vs. PASAD, Mattos et
    al.](https://arxiv.org/abs/2511.03971).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Data Historian Logs
  - 'NAI: Engineering Workstations (EWS) on the Process Control Network (PCN), Human-Machine Interfaces
    (HMIs) on the PCN, Level 1 and 2 Network Segments (containing PLCs, RTUs, IEDs), Data Historian Servers,
    Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  modbus.log/dnp3.log write events\n  for each tag t with value v:\n    alert if v < min[t]\
      \ or v > max[t]\n    alert if abs(v - last_value[t]) > max_step[t]\n  count exception_code!=0 or\
      \ rejected responses per src over 5m\n    alert if count > rejected_threshold"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ics (write OR exception) | lookup tag_bounds tag OUTPUT min max max_step\n  |\
      \ eval oob=if(value<min OR value>max,1,0), step_viol=if(abs(value-last)>max_step,1,0)\n  | stats\
      \ sum(oob) sum(step_viol) count(eval(exception=1)) as rejects by src_ip\n  | where oob>0 OR step_viol>0\
      \ OR rejects>threshold"
- question: For each critical setpoint, does the rate-of-change, write frequency (writes/min), or write
    byte-volume exceed the 99th percentile of that asset's own 90-day history, or do transactions score
    as low-probability/injected/replayed?
  context: 'Manipulation of Control may be subtle, spreading small writes over time or replaying captured
    legitimate commands. Statistically baseline each critical setpoint''s rate-of-change, write frequency,
    and write byte-volume over 90 days and alert when new activity exceeds the 99th percentile for any
    metric, using the asset''s own history rather than global defaults because OT processes are highly
    individual. Augment with a transaction-likelihood score (PRI-IDS) to flag low-probability, injected,
    or replayed command transactions. A positive result points to scripted or automated manipulation or
    replay; the per-asset baseline keeps false positives low for naturally chatty assets. References:
    [PRI-IDS, Marsden et al.](https://arxiv.org/abs/1711.02826).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Data Historian Logs
  - 'NAI: Engineering Workstations (EWS) on the Process Control Network (PCN), Human-Machine Interfaces
    (HMIs) on the PCN, Level 1 and 2 Network Segments (containing PLCs, RTUs, IEDs), Data Historian Servers,
    Active Directory Domain Controllers'
  range: Last 90 days (rolling baseline; alert on event-centered deviation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ics write by setpoint\n  | bin _time span=1m | stats count as writes_min sum(bytes)\
      \ as vol avg(roc) as roc by setpoint, _time\n  | eventstats p99(writes_min) p99(vol) p99(roc) by\
      \ setpoint\n  | where writes_min>p99_writes_min OR vol>p99_vol OR roc>p99_roc"
  - technology: SIEM/ML pseudocode
    query: ">-\n  score = PRI_IDS.transaction_likelihood(src,func,register,value,timing)\n  alert if score\
      \ < low_prob_threshold  // injected/replayed command"
- question: Do new setpoint write events score as anomalous against a multivariate model trained on setpoint
    value, time-of-day, day-of-week, source IP, and user account, and which features (SHAP-style) drive
    the anomaly?
  context: 'Rules and percentile thresholds can miss multivariate manipulation (e.g., a plausible value
    at an implausible time by an unusual user). Train an anomaly model on historian-logged setpoint value,
    time-of-day, day-of-week, source IP, and user account (SVM/Random Forest over Modbus/OPC-UA flow features)
    and alert when new writes exceed a high anomaly score, surfacing the top-3 contributing features via
    SHAP-style attribution so the analyst can triage quickly. Keep this model in parallel with the deterministic
    rules above, because ML scores are known to collapse on unseen attacks. A high anomaly score with
    interpretable drivers focuses investigation; the deterministic floor catches what the model misses.
    References: [SVM & Random Forest, Anton et al.](https://arxiv.org/abs/1907.10374), [LSTM-VAE + SHAP,
    Ha et al.](https://arxiv.org/abs/2205.01930), [Erba & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Data Historian Logs
  - 'NAI: Engineering Workstations (EWS) on the Process Control Network (PCN), Human-Machine Interfaces
    (HMIs) on the PCN, Level 1 and 2 Network Segments (containing PLCs, RTUs, IEDs), Data Historian Servers,
    Active Directory Domain Controllers'
  range: Last 90 days (training window 90+ days; score in near-real-time)
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [value, hour, dow, src_ip, user]\n  model = train(RandomForest/SVM, historian_writes_90d)\n\
      \  for new write w:\n    s = model.anomaly_score(w)\n    if s > high_threshold:\n      alert(top3=shap_explain(w))"
- question: Are write/control commands (Modbus 0x05/0x06/0x0F/0x10, DNP3 operate) originating from a source
    IP/MAC that has no record in the authoritative OT asset inventory for that segment, or from a device
    whose inventory role is designated read-only/monitoring-only?
  context: 'An attacker who introduces a rogue device or repurposes a monitoring host can issue control
    commands the device was never meant to send. Maintain a real-time asset inventory keyed by IP/MAC
    with each device''s role, and alert on write/control commands when the source has no inventory record
    or is designated read-only/monitoring-only. Encode device-role-to-function-code constraints as whitelist
    rules (specification-based detection / semantic SCADA rules) and enforce them in-line where possible
    (eBPF). A positive result is strong evidence of an unauthorized actor manipulating control; a clean
    result confirms only role-appropriate devices are commanding the process. References: [specification-based
    detection, Sen et al.](https://arxiv.org/abs/2209.04354), [semantic-based SCADA rules, Mohan et al.](https://arxiv.org/abs/2412.07917),
    [eBPF Modbus enforcement, Jhan & Sun](https://arxiv.org/abs/2312.05665).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - 'NAI: Network switches and routers within Level 1 (Basic Control) and Level 2 (Supervisory Control)
    of the Purdue Model, Industrial DMZ (IDMZ) gateways, Firewalls segmenting IT and OT networks, SCADA
    Servers, Management Workstations'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  modbus.log/dnp3.log where func in {0x05,0x06,0x0F,0x10,operate}\n  src = id.orig_h ;\
      \ mac = orig_l2_addr (from conn.log via uid)\n  rec = inventory.lookup(src, mac, segment)\n  alert\
      \ if rec is None or rec.role in {read-only, monitoring-only}"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=ics control_cmd | lookup asset_inventory src_ip src_mac OUTPUT role exists\n \
      \ | where exists!=\"true\" OR role IN (\"read-only\",\"monitoring-only\")"
- question: Is the diversity of source IPs issuing write commands per device increasing abnormally (entropy
    spike >3σ over 1-hour windows), and are firewall-blocked or NAK'd control connections per segment
    rising?
  context: 'Before a successful unauthorized write, attackers frequently probe from multiple hosts, and
    segmentation controls may block early attempts. Baseline the unique source IPs issuing write commands
    per device over 30 days, compute entropy over 1-hour windows, and alert when entropy rises more than
    3 standard deviations above the historical mean; track low-probability source/function-code combinations
    (PRI-IDS). Separately count firewall-blocked or NAK''d control connections per segment as a distinct
    failure-mode signal that often precedes a successful unauthorized write. A positive result suggests
    diversification of command sources or a probing campaign warranting immediate scoping. References:
    [PRI-IDS, Marsden et al.](https://arxiv.org/abs/1711.02826).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - 'NAI: Network switches and routers within Level 1 (Basic Control) and Level 2 (Supervisory Control)
    of the Purdue Model, Industrial DMZ (IDMZ) gateways, Firewalls segmenting IT and OT networks, SCADA
    Servers, Management Workstations'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=ics write | bin _time span=1h\n  | stats dc(src_ip) as srcs values(src_ip) as\
      \ ips by device,_time\n  | eval H=entropy(ips) | eventstats avg(H) as mu stdev(H) as sd by device\n\
      \  | where H > mu + 3*sd"
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log where service in {modbus,dnp3} and conn_state in {REJ,RSTO} \n  count blocked/NAK\
      \ control conns per segment per hour\n  alert on >3sigma rise"
- question: Modeling control traffic as a graph (nodes=IP/MAC, edges=observed write/control flows), do
    any new write-command edges appear from nodes outside the learned authorized-control subgraph?
  context: 'Authorized control relationships in OT are stable and sparse, so a graph view exposes new
    command paths that flat rules may miss. Build a graph of control traffic over 90 days, learn the authorized-control
    subgraph, and alert on new write-command edges from nodes outside it, combining header, flow, and
    temporal features as in multi-layered ML detection. Surface the offending source, destination, and
    function code in the alert. Retain the deterministic inventory rule as a floor because learned models
    miss unseen behaviors. A new control edge from an unexpected node is a strong manipulation indicator
    and pinpoints both attacker and target. References: [multi-layered ML ARP-spoofing detection, Ali
    et al.](https://arxiv.org/abs/2507.21087), [Erba & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - 'NAI: Network switches and routers within Level 1 (Basic Control) and Level 2 (Supervisory Control)
    of the Purdue Model, Industrial DMZ (IDMZ) gateways, Firewalls segmenting IT and OT networks, SCADA
    Servers, Management Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G = build_graph(nodes=IP/MAC, edges=write/control flows, window=90d)\n  authorized =\
      \ learn_subgraph(G)\n  for new edge (src->dst, func):\n    if edge not in authorized:\n      alert(src,dst,func,\
      \ features=[header,flow,temporal])"
- question: On HMIs/EWS, is a high-risk ICS utility or interpreter (e.g., plccmd.exe, modscan.exe, powershell.exe)
    launched (Event ID 4688) from a parent not on the per-tool whitelist, with a file hash not on the
    known-good allowlist, or under a network logon (Logon Type 3) not tied to approved remote-administration
    tools?
  context: 'To manipulate control an attacker often runs ICS-protocol tooling or scripting on an HMI/EWS.
    Monitor Event ID 4688 for high-risk ICS utilities and interpreters and apply application allowlisting
    (NIST SP 800-82r3). Alert when the parent process is not on the per-tool whitelist (e.g., not explorer.exe),
    the file hash is not on the known-good allowlist, or the process runs under a network logon (Logon
    Type 3, correlated via 4624/4648) not associated with approved remote-administration tooling. Correlate
    with unauthorized-process/USB indicators. A positive result indicates hands-on-keyboard or scripted
    control manipulation from a workstation; the allowlist context tells the analyst what is anomalous
    about the launch. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    [SCADA HIDS, Sen et al.](https://arxiv.org/abs/2402.14599).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4648
  - 'NAI: Human-Machine Interfaces (HMIs) on the PCN, Engineering Workstations (EWS) on the PCN, SCADA
    Servers, Remote Access Servers (RAS) providing access to the OT network'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventID=4688 process IN high_risk_ics_tools+interpreters host IN (HMI,EWS)\n  | lookup\
      \ tool_parent_whitelist process parent OUTPUT ok_parent\n  | lookup known_good_hash hash OUTPUT\
      \ ok_hash\n  | join host -> 4624 logon_type\n  | where ok_parent!=\"true\" OR ok_hash!=\"true\"\
      \ OR (logon_type=3 AND NOT approved_remote_admin)"
- question: On HMIs/EWS, do any parent-child process execution pairs fall in the bottom 1st percentile
    of a 30-day frequency baseline (prioritizing ICS tools/interpreters), and are AppLocker/WDAC execution
    denials occurring?
  context: 'SCADA hosts are stable, so rare parent-child pairs are inherently suspicious. Build a 30-day
    frequency map of parent-child process pairs on HMIs/EWS and alert when a pair falls in the bottom
    1st percentile, prioritizing ICS tools or command-line interpreters. Count failed/blocked execution
    attempts (AppLocker/WDAC denials) as a distinct signal of attempted but prevented execution. A rare
    pair such as a service or office app spawning a protocol tool or powershell is a likely manipulation
    precursor; blocked-execution bursts indicate an actor probing what they can run. References: [SCADA
    HIDS, Sen et al.](https://arxiv.org/abs/2402.14599).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4648
  - 'NAI: Human-Machine Interfaces (HMIs) on the PCN, Engineering Workstations (EWS) on the PCN, SCADA
    Servers, Remote Access Servers (RAS) providing access to the OT network'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventID=4688 host IN (HMI,EWS)\n  | stats count by parent,process | eventstats p1(count)\
      \ as floor\n  | where count<=floor AND (process IN ics_tools OR process IN interpreters)\n  ++ count\
      \ AppLocker/WDAC EventID 8004/8007 denials by host"
- question: Do 4688 process executions classified by an ML model (using process name, parent, command-line
    length/entropy, and user context) score as high-confidence suspicious, especially those containing
    ICS-related keywords, and what are the top-3 drivers?
  context: 'Attackers obfuscate command lines and use living-off-the-land tools, defeating static lists.
    Train a classifier on 4688 events using process name, parent process, command-line length/entropy,
    and user context, exposing feature importance (SVM/Random Forest) so each alert lists the top-3 drivers.
    Alert on high-confidence suspicious executions, especially those with ICS-related keywords, while
    retaining the allowlist rule as a deterministic floor. A high-confidence classification with interpretable
    drivers (e.g., high command-line entropy, unusual user) accelerates triage of potential control-manipulation
    tooling. References: [SVM & Random Forest, Anton et al.](https://arxiv.org/abs/1907.10374).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4648
  - 'NAI: Human-Machine Interfaces (HMIs) on the PCN, Engineering Workstations (EWS) on the PCN, SCADA
    Servers, Remote Access Servers (RAS) providing access to the OT network'
  range: Last 90 days (training window 90+ days)
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features=[process,parent,cmdline_len,cmdline_entropy,user,ics_keyword_flag]\n  model=train(RF/SVM,\
      \ labeled_4688)\n  for e in 4688_events:\n    if model.proba(e) > 0.9: alert(top3=feature_importance(e))"
- question: Does the real-time IP-to-MAC mapping derived from Zeek arp.log/conn.log contradict the maintained
    static whitelist for any critical ICS asset, and are there ARP::Spoofing or ARP::Duplicate_IP_Detected
    notices?
  context: 'A man-in-the-middle is a primary method of Manipulation of Control, and it usually starts
    with ARP/IP-to-MAC manipulation. Query Zeek arp.log and conn.log to build a real-time IP-to-MAC mapping
    and compare it against a maintained static whitelist of known IP-to-MAC pairs for critical assets
    (consistent with NIST SP 800-82r3 segmentation/monitoring). Alert if orig_l2_addr/resp_l2_addr in
    conn.log or any arp.log mapping contradicts the whitelist for a critical id.orig_h/id.resp_h, and
    escalate notice.log ARP::Spoofing / ARP::Duplicate_IP_Detected notices. A contradiction not tied to
    documented maintenance is a strong MitM precursor enabling command/state spoofing. References: [NIST
    SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek arp.log
  - 'NAI: Process control network segments connecting PLCs, HMIs, and other critical control system devices
    within the Operational Technology (OT) network.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  build map[ip]=mac from arp.log and conn.log (orig/resp_l2_addr)\n  for critical ip in\
      \ whitelist:\n    alert if map[ip] != whitelist[ip]\n  escalate notice.log note in {ARP::Spoofing,\
      \ ARP::Duplicate_IP_Detected}"
- question: For each critical IP, does the count of associated MAC addresses in a sliding 5-minute window
    exceed 1, or do gratuitous-ARP/ARP-reply rates spike more than 3σ above baseline?
  context: 'Under normal OT operation a critical IP maps to exactly one MAC, so any second MAC indicates
    spoofing or a rogue device. Baseline the count of MACs per critical IP over a 24-hour window (normally
    1) and, using a sliding 5-minute window over conn.log/arp.log, count distinct MACs per critical IP
    and alert when the count exceeds 1. Additionally baseline gratuitous-ARP and ARP-reply rates and alert
    on >3σ spikes, capturing the temporal packet-anomaly features used in ARP-spoofing detection. A positive
    result is a high-confidence MitM precursor that should trigger immediate containment of the affected
    segment. References: [multi-layered ML ARP-spoofing detection, Ali et al.](https://arxiv.org/abs/2507.21087).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek arp.log
  - 'NAI: Process control network segments connecting PLCs, HMIs, and other critical control system devices
    within the Operational Technology (OT) network.'
  range: Last 90 days (24h baseline, 5-minute detection windows)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  sliding 5m over arp.log/conn.log:\n    for critical ip: n=distinct(mac); alert if n>1\n\
      \  baseline gratuitous_arp_rate, arp_reply_rate (24h)\n  alert if rate > mean + 3*stdev"
- question: Modeling the OT Layer-2/Layer-3 topology as a graph, does a structural anomaly appear in real
    time, such as a new edge binding a critical asset's IP to a previously unknown MAC (probable MitM)?
  context: 'Subtle MitM may not trip simple counters but does change network structure. Model the OT Layer-2/Layer-3
    topology as a graph (nodes=IP/MAC, edges=observed communications) and train a graph/deep model on
    historical data to learn normal structure, combining ARP-header, flow, and temporal features. Detect
    structural anomalies in real time, such as a new edge binding a critical asset''s IP to a previously
    unknown MAC, and surface the implicated IP/MAC pair in the alert. Keep the deterministic IP-MAC whitelist
    as a floor since learned detectors miss novel manipulations. A new IP-to-unknown-MAC binding is a
    strong, actionable MitM indicator. References: [multi-layered ML ARP-spoofing detection, Ali et al.](https://arxiv.org/abs/2507.21087),
    [Erba & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek arp.log
  - 'NAI: Process control network segments connecting PLCs, HMIs, and other critical control system devices
    within the Operational Technology (OT) network.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  G=topology_graph(nodes=IP/MAC, edges=comms, window=hist)\n  model=train_graph_model(G)\n\
      \  for new edge (ip<->mac):\n    if anomalous(edge) and mac unknown for critical ip:\n      alert(ip,\
      \ mac)"
- question: Using stateful protocol analysis, do any PLC response/state-reporting messages appear without
    a corresponding request from a whitelisted HMI/historian within the timeout, or originate from an
    IP not on the approved PLC list for that segment?
  context: 'Spoofed state-reporting messages let an attacker hide manipulation by feeding the operator
    false ''normal'' readings. Implement stateful protocol analysis: for PLC response messages (is_response=true)
    cache the transaction identifier (e.g., trans_id in modbus.log) and alert if a response appears without
