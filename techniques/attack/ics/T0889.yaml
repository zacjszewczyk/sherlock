name: 'T0889: Modify Program'
id: bdd78a4e-7672-452d-9766-58cfcd5c90b9
description: 'This playbook helps an analyst investigate whether an adversary has modified or added a
  program on an ICS controller to change how it interacts with the physical process, peripheral devices,
  and other hosts on the network (MITRE ATT&CK for ICS T0889, Modify Program). Program modification can
  be achieved through a Program Download as well as online edit and program append, and may add new functions,
  change the logic of existing functions, alter calls between functions, or abuse the controller''s native
  API to establish persistence in the OT environment. The hunt pursues this behavior from several complementary
  angles: program-modification function codes (S7Comm Program Download/PLC-STOP, EtherNet/IP Write Tag,
  Modbus Write Multiple Registers/file-record, DNP3 select/operate) observed from source IPs that are
  not on the authorized Engineering Workstation (EWS) allowlist or outside scheduled maintenance windows;
  controller mode-change commands (CPU Control to STOP/PROGRAM, Set Attribute Single) that lack an approved
  change-management ticket or come from unauthorized sources; and mismatches between ICS project files
  and their trusted golden baseline detected on EWS hosts or during network transfer (hash, size, timestamp,
  entropy, or logical-content changes). Detection methods combine deterministic symbolic-logic rules (protocol-semantic
  program-modification and mode-change detections with EWS allowlist and maintenance-window checks, change-ticket
  correlation, file-integrity monitoring and golden-image/malicious-hash comparison, and failure-mode
  counting of denied/negative-ack programming attempts), statistical baselining (per-controller modification
  volume and byte/destination-block 3-sigma envelopes, time-in-non-RUN-state 99th-percentile thresholds,
  DFA and inter-arrival timing/phase models, physics-based residual/CUSUM and mined process invariants,
  and transferred-file entropy/size outlier detection), and machine learning (LSTM/CNN reconstruction
  autoencoders for anomalous modification bursts, HMM/Seq2Seq sequence models for abnormal controller
  state sequences, and a Random Forest classifier for unauthorized project-file modifications, each with
  SHAP feature-attribution for explainable alerts), applied across Zeek ICS protocol logs (s7comm, modbus,
  enip, dnp3, conn, files) and Windows/Sysmon endpoint events on engineering workstations, so the analyst
  can corroborate suspected controller program modification against network, host, file, and physical-process
  context. Note that a clean project-file diff does not guarantee controller integrity -- below-logic
  PLC rootkits can leave project files unchanged -- so network and physical-process detections must be
  corroborated.'
type: technique
related:
- tactic_id: TA0110
  tactic_name: Persistence
