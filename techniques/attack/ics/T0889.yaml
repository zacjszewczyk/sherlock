    impact. A negative result helps rule out this particular vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy logic changes, below-logic
    PLC rootkits, or low-and-slow tradecraft.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FEATURES per 5-min: count(modification_cmds), unique_src_ips, unique_dest_plcs/blocks,\n \
      \          protocol(one-hot), total_bytes_written, write/response_success_ratio\nTRAIN 1D-CNN/LSTM\
      \ autoencoder on historical Zeek logs\nSCORE live -> reconstruction_error\n| WHERE recon_error >\
      \ dynamic_threshold -> ALERT + top-3 SHAP features\n// keep deterministic allowlist/window rules\
      \ in parallel as floor"
- question: '[Persistence] Detect timing and phase violations for program sessions: Can you determine
    whether a program modification command (e.g., S7COMM ''Program Download'', Modbus ''Write Multiple
    Registers'', EtherNet/IP ''Write Tag'') is observed in network traffic, and the command originates
    from a source IP not on the authorized Engineering Workstation (EWS) allowlist or occurs outside of
    a scheduled maintenance window. -- specifically, using the ''Detect timing and phase violations for
    program sessions'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0110), an adversary modifies or adds program
    logic on an ICS controller to maintain a foothold that survives restarts, credential changes, and
    other interruptions -- replacing or hijacking legitimate code and logic so their activity persists
    in the process. This evidence focuses on the condition that a program modification command (e.g.,
    S7COMM ''Program Download'', Modbus ''Write Multiple Registers'', EtherNet/IP ''Write Tag'') is observed
    in network traffic, and the command originates from a source IP not on the authorized Engineering
    Workstation (EWS) allowlist or occurs outside of a scheduled maintenance window. The ''Detect timing
    and phase violations for program sessions'' approach (Statistical Method) works as follows: Model
    the highly periodic machine-to-machine traffic between each EWS/SCADA host and PLC with a deterministic
    finite automaton and per-PLC inter-arrival timing baseline, and detect time-varying phase shifts,
    missing/extra/out-of-sequence messages per [Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068).
    An out-of-band program-download or online-edit session inserts message types and timing that violate
    the learned per-PLC DFA/timing model; alert when observed inter-arrival or message-sequence deviates
    beyond the fitted phase tolerance (derive tolerance per PLC; retain a hard rule that any program-download
    message type outside the modeled sequence fires). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable unauthorized program modification or persistence on a controller;
    pivot to the responsible source host/EWS and account, the targeted controller/PLC and protocol, the
    specific function codes or project files involved, the timing relative to maintenance windows and
    change tickets, and any downstream effect on process variables to scope impact. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy logic changes, below-logic PLC rootkits, or low-and-slow
    tradecraft.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "PER (ews_or_scada_host, plc) FIT deterministic_finite_automaton(message_sequence)\n      \
      \  + inter_arrival_timing_baseline\n| SCORE live session: missing/extra/out-of-sequence messages\
      \ + phase_shift\n| WHERE inter_arrival OR msg_sequence DEVIATES > fitted_phase_tolerance -> ALERT\n\
      // hard rule: any program-download message type outside modeled sequence -> ALERT"
- question: '[Persistence] Alert on unauthorized controller mode changes: Can you determine whether an
    ICS controller mode change command (e.g., S7COMM ''CPU Control'' to STOP/PROGRAM, EtherNet/IP ''Set
    Attribute Single'' to change operational mode) is observed in network traffic, and the command either
    originates from an unauthorized source IP or is not correlated with an approved change management
    ticket for the target device and time. -- specifically, using the ''Alert on unauthorized controller
    mode changes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0110), an adversary modifies or adds program
    logic on an ICS controller to maintain a foothold that survives restarts, credential changes, and
    other interruptions -- replacing or hijacking legitimate code and logic so their activity persists
    in the process. This evidence focuses on the condition that an ICS controller mode change command
    (e.g., S7COMM ''CPU Control'' to STOP/PROGRAM, EtherNet/IP ''Set Attribute Single'' to change operational
    mode) is observed in network traffic, and the command either originates from an unauthorized source
    IP or is not correlated with an approved change management ticket for the target device and time.
    The ''Alert on unauthorized controller mode changes'' approach (Symbolic Logic) works as follows:
    Implement a SIEM rule to detect controller mode-change commands (e.g., to "STOP" or "PROGRAM") within
    Zeek ICS protocol logs (`s7comm.log`, `enip.log`, `dnp3.log`), encoding valid command/response semantics
    and state transitions per [Distributed IDS using Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917).
    For each detection: 1. Check the `conn.log` source IP against the authorized EWS allowlist ([NIST
    SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)). 2. Query
    the change-management system for an approved ticket matching controller, timestamp, and action. 3.
    Alert if no approved ticket exists OR the source IP is unauthorized. Failure-mode signal: also count
    rejected/failed mode-change attempts and denied connections to the CPU-control service as a distinct
    indicator. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    unauthorized program modification or persistence on a controller; pivot to the responsible source
    host/EWS and account, the targeted controller/PLC and protocol, the specific function codes or project
    files involved, the timing relative to maintenance windows and change tickets, and any downstream
    effect on process variables to scope impact. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy logic changes, below-logic PLC rootkits, or low-and-slow tradecraft.'
  answer_sources: &id002
  - Zeek s7comm.log
  - Zeek enip.log
  - Zeek dnp3.log
  - Zeek conn.log
  - 'NAI: Network interfaces of critical PLCs/Controllers (Level 1/2), Process Control Network (Purdue
    Level 2/3) monitoring points, network choke points between Level 3 and Level 2, and logs from change
    management systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'Zeek(s7comm.log OR enip.log OR dnp3.log)

      | WHERE function IN {CPU_Control_STOP, CPU_Control_PROGRAM, Set_Attribute_Single_mode}

      | JOIN conn.log ON uid -> src_ip

      | LOOKUP authorized_EWS_allowlist(src_ip) AS ews_ok

      | LOOKUP change_mgmt(controller, ts, action) AS ticket_ok

      | WHERE ews_ok == false OR ticket_ok == false -> ALERT

      // also: COUNT rejected/failed mode-change + denied CPU-control connections AS failure_signal'
- question: '[Persistence] Baseline time spent in non-RUN states: Can you determine whether an ICS controller
    mode change command (e.g., S7COMM ''CPU Control'' to STOP/PROGRAM, EtherNet/IP ''Set Attribute Single''
    to change operational mode) is observed in network traffic, and the command either originates from
    an unauthorized source IP or is not correlated with an approved change management ticket for the target
    device and time. -- specifically, using the ''Baseline time spent in non-RUN states'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0110), an adversary modifies or adds program
    logic on an ICS controller to maintain a foothold that survives restarts, credential changes, and
    other interruptions -- replacing or hijacking legitimate code and logic so their activity persists
    in the process. This evidence focuses on the condition that an ICS controller mode change command
    (e.g., S7COMM ''CPU Control'' to STOP/PROGRAM, EtherNet/IP ''Set Attribute Single'' to change operational
    mode) is observed in network traffic, and the command either originates from an unauthorized source
    IP or is not correlated with an approved change management ticket for the target device and time.
    The ''Baseline time spent in non-RUN states'' approach (Statistical Method) works as follows: For
    each critical controller, use Zeek protocol logs to calculate total daily time in a non-"RUN" state
    ("STOP", "PROGRAM"). Establish a 90-day baseline 99th-percentile of daily duration, and a baseline
    count of mode-transition events per day, grounded in OT operational baselining ([NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    Alert if the trailing-24h duration or transition count exceeds the 99th-percentile threshold, indicating
    the controller was modifiable for an unusually long period or cycled abnormally (derive thresholds
    per controller). A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable unauthorized program modification or persistence on a controller; pivot to the responsible
    source host/EWS and account, the targeted controller/PLC and protocol, the specific function codes
    or project files involved, the timing relative to maintenance windows and change tickets, and any
    downstream effect on process variables to scope impact. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy logic changes, below-logic PLC rootkits, or low-and-slow tradecraft.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'Zeek(s7comm.log OR enip.log OR dnp3.log) | PER controller_ip

      | COMPUTE daily_seconds_in_state(STOP, PROGRAM) AS non_run_dur, count(mode_transitions) AS transitions

      | BASELINE 90d 99th_percentile(non_run_dur), 99th_percentile(transitions)

      | WHERE trailing_24h(non_run_dur) > p99 OR trailing_24h(transitions) > p99 -> ALERT'
