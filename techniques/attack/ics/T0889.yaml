questions:
- question: '[Persistence] Alert on unauthorized program modification commands: Can you determine whether
    a program modification command (e.g., S7COMM ''Program Download'', Modbus ''Write Multiple Registers'',
    EtherNet/IP ''Write Tag'') is observed in network traffic, and the command originates from a source
    IP not on the authorized Engineering Workstation (EWS) allowlist or occurs outside of a scheduled
    maintenance window. -- specifically, using the ''Alert on unauthorized program modification commands''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0110), an adversary modifies or adds program
    logic on an ICS controller to maintain a foothold that survives restarts, credential changes, and
    other interruptions -- replacing or hijacking legitimate code and logic so their activity persists
    in the process. This evidence focuses on the condition that a program modification command (e.g.,
    S7COMM ''Program Download'', Modbus ''Write Multiple Registers'', EtherNet/IP ''Write Tag'') is observed
    in network traffic, and the command originates from a source IP not on the authorized Engineering
    Workstation (EWS) allowlist or occurs outside of a scheduled maintenance window. The ''Alert on unauthorized
    program modification commands'' approach (Symbolic Logic) works as follows: Create a SIEM detection
    rule that triggers when a Zeek log (e.g., `s7comm.log`, `modbus.log`, `enip.log`) records a program
    modification function code (S7Comm program download/PLC-STOP, EtherNet/IP Write Tag/forward-open to
    the file object, Modbus Write Multiple Registers/file-record, DNP3 select/operate). Encode protocol
    semantics — valid function codes, command/response pairing, addressing, and direction — so out-of-spec
    or injected programming messages are flagged deterministically per [Distributed IDS using Semantic-based
    Rules for SCADA](https://arxiv.org/abs/2412.07917) and [On Specification-based Cyber-Attack Detection
    in Smart Grids](https://arxiv.org/abs/2209.04354). The rule must: 1. Extract the source IP from the
    corresponding `conn.log` entry. 2. Compare it against a maintained allowlist of authorized Engineering
    Workstation IPs (only authorized EWS may issue programming commands, per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    3. Compare the timestamp against approved maintenance windows. 4. Alert if the source IP is not on
    the allowlist OR the event is outside a window. Failure-mode signal: separately count program-download
    responses carrying error/negative-ack or blocked-by-firewall events to the controller — a burst of
    failed/denied programming attempts is itself an indicator, even when no write succeeds. Correlate
    with PLC-to-PLC scanning on TCP/102 and new outbound 5-tuples from controllers characteristic of PLC-resident
    worms ([PLC-Blaster](https://www.blackhat.com/docs/asia-16/materials/asia-16-Spenneberg-PLC-Blaster-A-Worm-Living-Solely-In-The-PLC-wp.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable unauthorized
    program modification or persistence on a controller; pivot to the responsible source host/EWS and
    account, the targeted controller/PLC and protocol, the specific function codes or project files involved,
    the timing relative to maintenance windows and change tickets, and any downstream effect on process
    variables to scope impact. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy logic changes,
    below-logic PLC rootkits, or low-and-slow tradecraft.'
  answer_sources: &id001
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network traffic sensors at choke points between the enterprise network (Level 4/5) and the process
    control network (Level 3), taps on EWS subnets (Level 3), and span ports monitoring traffic to and
    from critical PLCs/controllers (Level 1/2).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "Zeek(s7comm.log OR modbus.log OR enip.log OR dnp3.log)\n| WHERE function IN {S7_program_download,\
      \ S7_PLC_STOP, ENIP_Write_Tag, ENIP_forward_open_file,\n                     Modbus_Write_Multiple_Registers,\
      \ Modbus_file_record, DNP3_select, DNP3_operate}\n| VALIDATE protocol_semantics(function, cmd/resp\
      \ pairing, addressing, direction)\n| JOIN conn.log ON uid -> src_ip\n| WHERE src_ip NOT IN authorized_EWS_allowlist\
      \ OR ts NOT IN maintenance_window -> ALERT\n// failure signal: COUNT negative-ack/error program-download\
      \ responses + firewall-blocked attempts\n// correlate: PLC-to-PLC TCP/102 scanning + new outbound\
      \ 5-tuples from controllers (worm)"
- question: '[Persistence] Baseline modification command volume per controller: Can you determine whether
    a program modification command (e.g., S7COMM ''Program Download'', Modbus ''Write Multiple Registers'',
    EtherNet/IP ''Write Tag'') is observed in network traffic, and the command originates from a source
    IP not on the authorized Engineering Workstation (EWS) allowlist or occurs outside of a scheduled
    maintenance window. -- specifically, using the ''Baseline modification command volume per controller''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0110), an adversary modifies or adds program
    logic on an ICS controller to maintain a foothold that survives restarts, credential changes, and
    other interruptions -- replacing or hijacking legitimate code and logic so their activity persists
    in the process. This evidence focuses on the condition that a program modification command (e.g.,
    S7COMM ''Program Download'', Modbus ''Write Multiple Registers'', EtherNet/IP ''Write Tag'') is observed
    in network traffic, and the command originates from a source IP not on the authorized Engineering
    Workstation (EWS) allowlist or occurs outside of a scheduled maintenance window. The ''Baseline modification
    command volume per controller'' approach (Statistical Method) works as follows: For each controller
    IP, aggregate ICS protocol logs (e.g., `s7comm.log`) and count program-modification commands per hour,
    computing total bytes written and write/response success ratio. Calculate a 30-day rolling baseline
    (mean and standard deviation) per hour-of-day and day-of-week, consistent with baselining predictable
    OT operations in [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    Alert if the current hourly count, byte volume, or unique-destination-block count exceeds its historical
    baseline by more than 3 standard deviations. Profile failure rate as a distinct signal: alert when
    the count of failed/negative-ack program-download responses or blocked connections exceeds its own
    3σ envelope (derive both thresholds from your environment; tune, do not delete the hard 3σ floor).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable unauthorized
    program modification or persistence on a controller; pivot to the responsible source host/EWS and
    account, the targeted controller/PLC and protocol, the specific function codes or project files involved,
    the timing relative to maintenance windows and change tickets, and any downstream effect on process
    variables to scope impact. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy logic changes,
    below-logic PLC rootkits, or low-and-slow tradecraft.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "Zeek(s7comm.log ... ICS protocol logs) | PER controller_ip, hour-of-day, day-of-week\n| COUNT\
      \ program_modification_cmds, SUM bytes_written, write/response success_ratio,\n        unique_destination_blocks\n\
      | BASELINE 30d rolling mean,std\n| WHERE hourly_count OR byte_volume OR unique_dest_blocks > mean\
      \ + 3*std -> ALERT\n| WHERE failed/negative-ack downloads OR blocked_conns > own 3sigma -> ALERT"
