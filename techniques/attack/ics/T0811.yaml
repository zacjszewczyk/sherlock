name: 'T0811: Data from Information Repositories'
id: 721c4d19-5dde-41c9-832e-5eadb74c36fa
description: 'Investigate whether an adversary is collecting data from ICS information repositories (file
  servers, engineering workstations, document management systems, project file shares, CMDBs, SharePoint/Confluence
  sites, process historians, and control-system SQL/Oracle databases). This playbook helps an analyst
  hunt for: anomalous reads of sensitive ICS documentation (schematics, P&IDs, RTU sites, credentials,
  network diagrams) by users or hosts that exceed baseline volume or match sensitive keywords; first-time
  access to sensitive repository shares; outbound exfiltration of repository data to unauthorized or malicious
  external destinations; suspicious or unauthorized logons to critical ICS repository hosts; and role-mismatched
  or high-volume SQL queries against ICS databases. It combines symbolic-logic rules, statistical baselining,
  and machine-learning methods across endpoint, network, and database telemetry to surface reconnaissance
  and collection activity consistent with the documented ONG repository-search TTPs.'
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any user account or host read files from a sensitive ICS repository whose names match
    predefined sensitive keywords (e.g. SCADA, P&ID, RTU, PLC, HMI, Historian, network diagram, dial-up,
    password, credential), or repeatedly hit access-denied on such files?
  context: 'During Collection an adversary searches ICS document repositories for high-value materials
    such as system manuals, RTU site lists, personnel rosters, schematics, and remote dial-up/credential
    information - exactly the pattern documented in the 2011-2013 ONG intrusions. A successful keyword-matched
    read by an account outside the authorized ICS-documentation allowlist group is a strong reconnaissance
    signal. Enforce least-privilege/role-based read access per NIST SP 800-82r3 and watch the file-read
    audit trail. A positive result is a read (Event 5145 ''ReadData'' or smb_files.log ''file_read'')
    of a keyworded object by a non-allowlisted user. As a distinct failure-mode signal, repeated access-denied
    results for the same keyworded object from one account in a short window indicate probing for documents
    the account cannot read. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    [Homoliak et al](https://arxiv.org/abs/1805.01612).'
  answer_sources:
  - Windows Event ID 5145
  - Windows Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS File Servers, Engineering Workstations (EWS), Document Management Systems (DMS), Project
    File Shares, Configuration Management Databases (CMDBs), and SharePoint/Confluence sites hosting ICS
    documentation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (WinEventID=5145, zeek:smb_files) \n  | where (EventID=5145 AND Accesses CONTAINS\
      \ 'ReadData') OR (action='file_read')\n  | where lower(RelativeTargetName/filename) MATCHES_ANY\
      \ ['scada','scad','p&id','rtu','plc','hmi','historian','network_diagram','dial-up','password','credential']\n\
      \  | where TargetUserName/user NOT IN ad_group('ICS_Doc_Readers')\n  | emit alert(severity=high)"
  - technology: SIEM/Rule pseudocode
    query: "  source WinEventID=5145 where AccessMask=denied OR result='AuditFailure'\n  | where lower(RelativeTargetName)\
      \ MATCHES_ANY <keyword_list>\n  | stats count BY TargetUserName, ObjectName, bin(10m)\n  | where\
      \ count >= 1 AND repeated_object\n  | emit alert(severity=high, reason='access-denied probing of\
      \ sensitive doc')"
- question: Did a single user-host pair access a number of unique files from a sensitive ICS repository
    within a 15-minute window that significantly exceeds its 30-day baseline, or show an unusual spike
    in the entropy of file extensions accessed?
  context: 'Programmatic harvesting of a repository produces bursts of unique-file reads and touches many
    different file types in a short period - distinct from a human browsing a handful of documents. Build
    a 30-day rolling baseline per user-host pair and flag windows where the unique-file count exceeds
    the 99th percentile or a median/MAD modified Z-score above 3.5 (robust against periodic bulk backups
    inflating the mean). Additionally compute Shannon entropy of file extensions per hour and alert on
    spikes versus the user''s norm. A positive result (high unique-file count and/or extension-entropy
    spike) suggests automated collection; negatives are consistent with normal, focused access. Derive
    thresholds against labeled corpora such as the CERT Insider Threat and Unified Host and Network datasets.
    References: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf),
    [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly), [CERT
    Insider Threat](https://www.sei.cmu.edu/library/insider-threat-test-dataset/), [Unified Host and Network
    Data Set](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Windows Event ID 5145
  - Windows Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS File Servers, Engineering Workstations (EWS), Document Management Systems (DMS), Project
    File Shares, Configuration Management Databases (CMDBs), and SharePoint/Confluence sites hosting ICS
    documentation.'
  range: Last 90 days (15-minute and 1-hour aggregation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  source IN (WinEventID=5145, zeek:smb_files) where repository_share\n  | bin 15m | stats\
      \ dcount(RelativeTargetName) AS uniq BY user, host, window\n  | join baseline_30d ON user,host \
      \ // mean, mad, p99\n  | eval mz = 0.6745*(uniq-median)/mad\n  | where uniq > p99 OR mz > 3.5 |\
      \ emit alert"
  - technology: SIEM/Stats pseudocode
    query: "  source IN (WinEventID=5145, zeek:smb_files)\n  | bin 1h | eval ext=fileext(RelativeTargetName)\n\
      \  | stats shannon_entropy(ext) AS ent BY user, host, window\n  | join user_ext_baseline | where\
      \ ent > baseline_mean + 3*baseline_sd | emit alert"
- question: Does an unsupervised Isolation Forest over repository file-access events flag a user's hourly
    behavior as anomalous (score above the 99.5th percentile), and which features drove that anomaly?
  context: 'Some collection activity stays under simple volume thresholds yet remains anomalous across
    many dimensions at once (off-hours access to a new target server with deep file paths and keyword
    matches). An Isolation Forest trained over Windows Event 5145, Sysmon Event 11, and Zeek smb_files.log
    captures these multivariate deviations without labeled data. Engineer per-event features: user, source
    host, target server, file-path depth, file extension, time of day, day of week, count of unique files
    in the trailing hour, keyword-match flag, and non-business-hours flag. Alert when a user''s hourly
    anomaly score exceeds the 99.5th percentile. Every alert must surface the top-3 contributing features
    (per-feature attribution) so the analyst can triage rather than chase a bare score. Tune and validate
    against the CERT Insider Threat dataset. References: [Isolation Forest](https://doi.org/10.1145/2133360.2133363),
    [Tuor et al](https://arxiv.org/abs/1710.00811), [CERT Insider Threat dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 5145
  - Windows Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS File Servers, Engineering Workstations (EWS), Document Management Systems (DMS), Project
    File Shares, Configuration Management Databases (CMDBs), and SharePoint/Confluence sites hosting ICS
    documentation.'
  range: Last 90 days (hourly scoring; train on >=90 days)
  queries:
  - technology: ML/pseudocode
    query: "  events = load(WinEventID=5145, Sysmon=11, zeek:smb_files)\n  feats = featurize(user, src_host,\
      \ target_srv, path_depth, ext, hour, dow,\n                    uniq_files_trailing_1h, keyword_flag,\
      \ offhours_flag)\n  model = IsolationForest().fit(train_90d)\n  score = model.score(feats_per_user_hour)\n\
      \  if score > p99_5(all_scores):\n      top3 = attribute_features(model, feats)\n      emit alert(user,\
      \ score, top3)"
- question: Has a user or host accessed a sensitive ICS repository share for the first time within the
    lookback window (a previously unseen user/host->share edge), especially for privileged accounts or
    off-hours access?
  context: 'Reconnaissance performed with valid stolen credentials can stay below volume thresholds while
    still representing a brand-new access relationship. Maintain the set of (user, host, repository-share)
    tuples observed over the last 90 days and score first-time edges using Bayesian new-edge prediction
    and per-entity Dirichlet-process profiling. Alert when a user or host reads a sensitive ICS share
    for the first time, weighting the score higher for privileged accounts (which should rarely touch
    information repositories) and for off-hours activity. A positive result is a never-before-seen access
    edge to a sensitive share; this complements the volume- and keyword-based detections by catching low-and-slow
    collection. References: [Metelli & Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf),
    [Heard et al](https://www.researchgate.net/publication/310500555_Network-wide_anomaly_detection_via_the_Dirichlet_process).'
  answer_sources:
  - Windows Event ID 5145
  - Windows Sysmon Event ID 11
  - Zeek smb_files.log
  - 'NAI: ICS File Servers, Engineering Workstations (EWS), Document Management Systems (DMS), Project
    File Shares, Configuration Management Databases (CMDBs), and SharePoint/Confluence sites hosting ICS
    documentation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  known = set((user,host,share) seen in last 90d)\n  stream source IN (WinEventID=5145, zeek:smb_files)\
      \ where sensitive_share\n  | eval edge=(user,host,share)\n  | where edge NOT IN known\n  | eval\
      \ w = base_score + 3*is_privileged(user) + 2*is_offhours(time)\n  | emit alert(edge, w); known.add(edge)"
- question: Did an ICS information-repository host make an outbound connection to a destination outside
    the defined ICS/corporate address space - particularly to a known-malicious IP or an unauthorized
    service (cloud storage, webmail, paste sites) - and transfer data?
  context: 'After collecting repository data an adversary must move it out. ICS repository hosts should
    egress only to a tightly defined allowlist per NIST SP 800-82r3, so any outbound connection to an
    external destination is suspicious. From Zeek conn.log, filter connections originating from NAI hosts
    to destinations outside ICS/corporate ranges. Correlate the responder IP against a high-confidence
    malicious-IP feed (critical alert on match) and correlate dns.log/ssl.log SNI/resolved domains against
    an unauthorized-services list, alerting when bytes were transferred (orig_bytes > 1KB). Treat egress
    failures as distinct signals: bursts of conn_state S0/REJ (blocked/denied) and DNS NXDOMAIN spikes
    from a repository host indicate beaconing/exfil attempts against a deny-by-default boundary. References:
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Process Historian Servers, Control System Databases (SQL, Oracle), OPC DA/HDA servers, ICS File
    Servers, and Engineering Workstations acting as data aggregation points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  conn.log where id.orig_h IN nai_hosts AND id.resp_h NOT IN (ics_space, corp_space)\n  |\
      \ lookup malicious_ip_feed ON id.resp_h -> if match emit alert(critical)\n  | join dns.log/ssl.log\
      \ ON id.resp_h -> domain/SNI\n  | where domain IN unauthorized_services AND orig_bytes > 1024\n\
      \  | emit alert(high)"
  - technology: Zeek/pseudocode
    query: "  conn.log where id.orig_h IN nai_hosts\n  | stats count BY id.orig_h, conn_state, bin(5m)\n\
      \  | where conn_state IN ('S0','REJ') AND count > burst_threshold | emit alert\n  ;; dns.log where\
      \ id.orig_h IN nai_hosts AND rcode_name='NXDOMAIN'\n  | stats count BY id.orig_h, bin(5m) | where\
      \ count > nxdomain_threshold | emit alert"
- question: Does the hourly or per-session outbound byte volume from an ICS repository host to non-ICS
    destinations exceed its 30-day baseline or a hard deterministic floor (500MB/hour or 100MB/session)?
  context: 'Bulk exfiltration of collected repository data manifests as outbound volume well above normal.
    Using Zeek conn.log build a 30-day baseline per NAI host of total outbound bytes (orig_bytes) per
    hour to non-ICS destinations and per single session, using a median/MAD modified Z-score (flag |score|
    > 3.5) so scheduled transfers do not distort the baseline. Alert when hourly outbound traffic exceeds
    the learned baseline OR a hard floor of 500MB, and raise a separate alert when any single session
    exceeds its baseline OR a hard floor of 100MB. The deterministic floors guarantee detection of large
    transfers regardless of learned baselines; a positive result warrants investigation of the destination
    and the data moved. References: [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Process Historian Servers, Control System Databases (SQL, Oracle), OPC DA/HDA servers, ICS File
    Servers, and Engineering Workstations acting as data aggregation points.'
  range: Last 90 days (hourly and per-session aggregation; baseline 30 days)
  queries:
  - technology: Zeek/pseudocode
    query: "  conn.log where id.orig_h IN nai_hosts AND id.resp_h NOT IN ics_space\n  | bin 1h | stats\
      \ sum(orig_bytes) AS bph BY id.orig_h, window\n  | join baseline_30d ON id.orig_h\n  | eval mz=0.6745*(bph-median)/mad\n\
      \  | where bph > p99 OR mz > 3.5 OR bph > 500MB | emit alert(hourly)"
  - technology: Zeek/pseudocode
    query: "  conn.log where id.orig_h IN nai_hosts\n  | eval session_bytes=orig_bytes\n  | join per_session_baseline\
      \ ON id.orig_h\n  | where session_bytes > session_p99 OR session_bytes > 100MB | emit alert(session)"
- question: Does a time-series forecast of a repository host's egress show observed outbound volume exceeding
    the upper prediction bound for two or more consecutive intervals, and what destinations and ports
    drove the excess?
  context: 'Slow or staged exfiltration may not trip a fixed threshold but will deviate from the host''s
    predicted traffic rhythm. Build a per-host series of total outbound bytes per 15-minute interval from
    conn.log and train a time-series model (ARIMA prediction intervals or Prophet) on at least 90 days
    of history. Alert when observed volume exceeds the upper prediction bound for >=2 consecutive intervals,
    which filters single-interval noise. The alert must include observed vs predicted bytes, the breaching
    intervals, and the top destination(s) and ports driving the excess - not just an anomaly flag - so
    the analyst can immediately assess whether the excess egress represents exfiltration of collected
    ICS repository data. References: [Peña et al](https://www.mdpi.com/2076-3417/11/7/3194), [Aldallal
    et al](https://link.springer.com/article/10.1186/s13677-023-00491-x).'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek http.log
  - Zeek ftp.log
  - 'NAI: Process Historian Servers, Control System Databases (SQL, Oracle), OPC DA/HDA servers, ICS File
    Servers, and Engineering Workstations acting as data aggregation points.'
  range: Last 90 days (15-minute intervals; train on >=90 days)
  queries:
  - technology: ML/pseudocode
    query: "  series = conn.log | bin 15m | sum(orig_bytes) BY id.orig_h\n  model = Prophet_or_ARIMA().fit(series[-90d:])\n\
      \  pred, upper = model.forecast()\n  if observed > upper for >=2 consecutive intervals:\n      tops\
      \ = top_dest_ports(conn.log, breaching_intervals)\n      emit alert(host, observed, pred, breaching_intervals,\
      \ tops)"
- question: Did a successful logon (Event ID 4624) to a critical ICS repository host come from an account
    lacking the required AD group membership for that host role, a RemoteInteractive (LogonType 10) logon
    from a non-allowlisted account, or follow a burst of failed logons (Event 4625)?
  context: 'To reach a repository an adversary first authenticates to the hosting asset. Enforce role-based
    access per NIST SP 800-82r3 and monitor Event 4624 on all NAI hosts. Raise a high-priority alert when
    a successful logon''s TargetUserName is not a member of the authorized AD group for that host''s role
    (e.g. Historian_Admins), and a medium-priority alert for LogonType 10 (RemoteInteractive) from accounts
    not on the ICS remote-access allowlist. As a failure-mode signal, correlate preceding Event 4625 failures
    and alert when >=5 failures precede a success for the same account/host within 10 minutes - the signature
    of credential guessing into the repository host. A positive result indicates unauthorized or coerced
    access to an ICS asset. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Historian Servers, Human-Machine Interface (HMI) consoles, Domain
    Controllers, and Jump Servers within the ICS network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  WinEventID=4624 where Computer IN nai_hosts\n  | where TargetUserName NOT IN authorized_group(host_role)\n\
      \  | emit alert(high)\n  ;; WinEventID=4624 where LogonType=10 AND TargetUserName NOT IN ics_remote_allowlist\n\
      \  | emit alert(medium)"
  - technology: SIEM/Rule pseudocode
    query: "  WinEventID=4625 | stats count AS fails BY TargetUserName, Computer, bin(10m)\n  | join (WinEventID=4624\
      \ success) ON TargetUserName, Computer\n  | where fails >= 5 AND success_after_fails | emit alert(credential-guessing)"
- question: Does an additive logon-risk score (off-hours +3, new country +5, new source workstation +2,
    weighted for first-ever account->host pairs) reach the alert threshold for a logon to an ICS repository
    host?
  context: 'Suspicious logons often differ from a user''s norm along several axes at once. For each account
    build a 90-day baseline from Event 4624 and Zeek conn.log: common login hours, common source geolocations,
    and prior WorkstationName values. Apply additive risk scoring - +3 for outside normal hours, +5 for
    a new country, +2 for a new source workstation - and alert at a score >=5. Augment with Bayesian new-edge
    scoring to weight first-ever (account->host) logon pairs and median/MAD modified Z-scores for per-account
    logon-count spikes. A positive result is a logon that diverges across multiple baseline dimensions,
    indicating possible credential misuse to access an ICS repository host; the component scores explain
    why the alert fired. References: [Metelli & Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf),
    [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Historian Servers, Human-Machine Interface (HMI) consoles, Domain
    Controllers, and Jump Servers within the ICS network.'
  range: Last 90 days (baseline 90 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  WinEventID=4624 where Computer IN nai_hosts\n  | join baseline_90d ON TargetUserName  //\
      \ hours, geos, workstations, host-edges\n  | eval score = 3*offhours + 5*new_country + 2*new_workstation\n\
      \  | eval score = score + new_edge_weight(user, Computer)\n  | where score >= 5 | emit alert(score,\
      \ contributing_terms)"
- question: Does a supervised classifier (Random Forest) or UEBA model label a logon to an ICS repository
    host as suspicious with confidence above 0.90, and which top-3 features drove that classification?
  context: 'Beyond hand-tuned rules, a Random Forest trained on historical labeled Event 4624 data can
    capture combinations that signal malicious logons. Features include LogonType, IsAdmin, IsServiceAccount,
    TimeOfDay, DayOfWeek, IsNewSourceGeoIP, IsNewSourceWorkstation (vs 90-day history), and IsRemoteLogon
    (LogonType 3/10). Alert when the model classifies a logon as suspicious with confidence > 0.90. As
    an unsupervised complement and for peer-group context, use UEBA scoring and per-user models that attribute
    the score to top features; mind base-rate caveats from the insider-threat ML taxonomy. Every alert
    must list the top-3 contributing features (e.g. new geo-IP, remote logon, off-hours) so analysts can
    triage. A high-confidence suspicious classification on an ICS repository host warrants prompt investigation.
    References: [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics),
    [Tuor et al](https://arxiv.org/abs/1710.00811), [Homoliak et al](https://arxiv.org/abs/1805.01612).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Historian Servers, Human-Machine Interface (HMI) consoles, Domain
    Controllers, and Jump Servers within the ICS network.'
  range: Last 90 days (train on labeled history; 90-day feature window)
  queries:
  - technology: ML/pseudocode
    query: "  X = featurize(WinEventID=4624: LogonType, IsAdmin, IsServiceAccount, TimeOfDay,\n      \
      \          DayOfWeek, IsNewSourceGeoIP, IsNewSourceWorkstation, IsRemoteLogon)\n  rf = RandomForest().fit(labeled_history)\n\
      \  p = rf.predict_proba(X)['suspicious']\n  if p > 0.90:\n      top3 = shap_top_features(rf, X)\n\
      \      emit alert(user, host, p, top3)"
- question: Did an account issue SQL SELECT/EXPORT statements against ICS-database tables outside its
    role allowlist (e.g. credential, RTU-site, personnel, or schematic tables), run schema-discovery queries
    (information_schema, sys.objects), or generate a burst of permission-denied errors?
  context: 'Relational ICS repositories (process historians, asset/config databases) hold exactly the
    data an adversary wants. Enable database audit logging and enforce role-based access per NIST SP 800-82r3,
    then maintain an allowlist mapping each role to the tables/columns it may read. Alert deterministically
    when an account issues SELECT/EXPORT against tables outside its role or runs schema-discovery queries
    against information_schema/sys.objects - reconnaissance of the database structure. As a failure-mode
    signal, alert on bursts of permission-denied/failed queries (SQL error 229, ORA-00942) from one account,
    which indicate enumeration of tables it cannot read. A positive result is role-mismatched access to
    sensitive tables, a direct indicator of collection from an ICS database. References: [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Database Audit Logs (SQL Server Audit, Oracle Unified Audit Trail, PostgreSQL pgAudit)
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Process Historian databases (e.g., PI, Wonderware), Control System SQL/Oracle databases, Configuration
    Management Databases (CMDBs), and asset/inventory databases within the ICS and supervisory networks.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source db_audit where command IN ('SELECT','EXPORT')\n  | where accessed_table NOT IN role_allowlist(account_role)\n\
      \     OR accessed_table IN ('information_schema','sys.objects')\n  | emit alert(role-mismatch)\n\
      \  ;; source db_audit where result='permission_denied' OR error IN ('229','ORA-00942')\n  | stats\
      \ count BY account, bin(10m) | where count > burst | emit alert(enumeration)"
- question: Does an account's SQL query volume or rows-returned/scanned against a sensitive ICS database
    exceed its 30-day baseline (99th percentile or modified Z-score |3.5|) or a hard floor such as a single
    query returning more than 100k rows?
  context: 'Programmatic harvesting of an ICS database shows up as abnormally high query rates or massive
    row scans - e.g. bulk SELECT * scans of schematic or configuration tables. Baseline per account/role
    over 30 days the rows returned and queries per minute. Alert when current values exceed the 99th percentile
    or a median/MAD modified Z-score of |3.5|, or a hard floor (a single query returning > 100k rows from
    a sensitive table). The robust statistic prevents legitimate periodic large queries from inflating
    the baseline, while the hard floor guarantees detection of obvious bulk extraction. A positive result
    indicates likely automated collection of ICS database contents. References: [modified Z-score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly),
    [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Database Audit Logs (SQL Server Audit, Oracle Unified Audit Trail, PostgreSQL pgAudit)
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Process Historian databases (e.g., PI, Wonderware), Control System SQL/Oracle databases, Configuration
    Management Databases (CMDBs), and asset/inventory databases within the ICS and supervisory networks.'
  range: Last 90 days (baseline 30 days; per-minute aggregation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  source db_audit | stats sum(rows_returned) AS rows, count AS qpm BY account, bin(1m)\n \
      \ | join baseline_30d ON account, role\n  | eval mz=0.6745*(rows-median)/mad\n  | where rows > p99\
      \ OR mz > 3.5 OR single_query_rows > 100000 | emit alert"
- question: Does a database-query role classifier (naive-Bayes over query quiplets, or k-means clustering
    for non-RBAC databases) predict a role for a query that differs from the issuing account's actual
    role?
