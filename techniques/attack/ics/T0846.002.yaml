name: 'T0846.002: Broadcast Discovery'
id: 64da76ef-a793-49e8-b8fb-9196afa2bee3
description: Investigate whether an adversary is abusing broadcast discovery requests to enumerate systems,
  devices, and services across ICS/OT subnets. This playbook helps an analyst hunt for protocol-specific
  discovery primitives (BACnet Who-Is/I-Am, CIP/EtherNet-IP ListIdentity over UDP/44818, Siemens S7 broadcast
  identification) sent to L2/L3 or protocol broadcast addresses, especially from hosts that are not approved
  engineering workstations or management servers. It examines the one-to-many fan-out signature of subnet
  mapping (Volume), elevated discovery frame frequency outside planned commissioning windows (Frequency),
  and the mix of responders and unanswered first-contacts (State). Guidance combines deterministic decoding
  and allowlist/specification rules, statistical baselining of broadcast rate, responder count, destination-address
  entropy, and first-contact failure rate, and machine-learning clustering, explainable classification,
  and interaction-graph analysis to surface hosts whose behavior deviates from their normal control-only
  role and whose discovery traffic crosses Purdue conduit boundaries.
type: technique
related:
- tactic_id: TA0102
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are broadcast discovery protocol primitives (BACnet Who-Is, CIP/EtherNet-IP ListIdentity/ListServices/ListInterfaces
    over UDP/44818, S7 broadcast identification) being sent to L2/L3 or protocol broadcast addresses from
    a host that is not an approved engineering workstation or management server, or that crosses a Purdue
    conduit boundary?
  context: 'Decode the discovery service from Zeek bacnet.log/enip.log or PCAP using the CISA ICSNPP parsers
    (icsnpp-bacnet, icsnpp-enip) and validate the source against an allowlist of approved engineering
    workstations and management servers. Broadcast discovery is a legitimate commissioning function, so
    the question separates authorized maintenance from reconnaissance: alert when a discovery service
    targets the L2/L3 broadcast or the BACnet broadcast address from a host not on the allowlist, and
    per NIST SP 800-82r3 Purdue zone/conduit guidance alert on any discovery frame that crosses a conduit
    boundary. In Discovery, an adversary uses these requests to enumerate live ICS assets before lateral
    movement; a positive result from an unexpected source or across a conduit is high-fidelity evidence
    of subnet mapping, while traffic confined to an approved host inside its zone during a known change
    is likely benign.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek bacnet.log (ICSNPP)
  - Zeek enip.log (ICSNPP)
  - Network Traffic PCAP
  - Network Traffic Flow (NetFlow)
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: OT Subnets, Industrial Gateways, Management Network Segments, Purdue Conduit Boundaries'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  bacnet.log OR enip.log\n  where service in [\"Who-Is\",\"ListIdentity\",\"ListServices\"\
      ,\"ListInterfaces\"]\n  and (dst in BROADCAST_ADDRS or dst == BACNET_BROADCAST)\n  and src not in\
      \ ALLOWLIST_ENG_WS\n  | also flag if zone(src) != zone(dst)  // conduit crossing"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  filter proto in {bacnet,enip} AND udp.port==44818\n  AND dest_ip in (broadcast_ranges)\n\
      \  AND src_ip NOT IN allowlist_engineering\n  -> alert \"Broadcast discovery from unapproved source\""
- question: Does any one-to-many broadcast discovery flow violate the allowlist of permitted source ->
    discovery-service -> destination-scope tuples, indicating a deviation from the documented OT communication
    specification?
  context: 'Maintain a whitelist of permitted source->discovery-service->destination-scope tuples and
    treat any deviation as a deterministic alert, following the auto-generated semantic/specification
    rule approach (Mohan et al.) and graph-based communication-flow specification (Sen et al.). OT networks
    are highly deterministic, so specification-based detection is powerful: legitimate discovery comes
    from known sources, uses known services, and targets known scopes. The analyst is looking for one-to-many
    discovery flows from unlisted sources or to disallowed scopes. In Discovery, an adversary''s enumeration
    will rarely match the sanctioned specification; a positive result (a tuple not in the allowlist) is
    a deterministic indicator of unauthorized reconnaissance, while a matching tuple reflects sanctioned
    engineering activity.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  tuple = (src, discovery_service, dest_scope)\n  if tuple NOT IN permitted_spec_allowlist\n\
      \     and fanout(src) > 1:\n     alert \"Specification violation: unlisted discovery flow\""
- question: On the host that emitted the broadcast discovery traffic, did process-creation and network-connection
    telemetry (Windows Event ID 4688/5156) show an HMI, engineering tool, or ad hoc script launching the
    requests, and did it occur without a corresponding authorized maintenance or commissioning change?
  context: 'Correlate broadcast discovery network traffic with Windows Event ID 4688 (process creation)
    and 5156 (Windows Filtering Platform allowed connection) on the source host to determine what process
    generated the discovery requests, comparing against the normal host/flow baseline mapped by GRASSMARLIN.
    This ties network evidence to local execution context: a legitimate engineering tool launched during
    an approved change differs from an ad hoc script or LOLBin spawning broadcast probes. In Discovery,
    an adversary may run custom discovery tooling on a compromised engineering workstation. Escalate when
    the broadcast activity occurs without a corresponding authorized maintenance or commissioning change;
    a positive result links a suspicious process (e.g., unknown binary, scripting host) to the fan-out,
    while a known HMI/engineering binary during a scheduled window is likely benign.'
  answer_sources: *id001
  range: Last 90 days; pivot to a +/- 10 minute window around the first broadcast discovery frame
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  join net_discovery(src_host) with\n     winlog(EventID in {4688,5156}, host==src_host,\
      \ time within +/-10m)\n  | surface process_name, parent, cmdline\n  | flag if process not in baseline_engineering_tools\n\
      \  | escalate if no approved_change ticket in window"
- question: Has the rate of broadcast discovery frames per minute (per subnet and per source host) spiked
    abnormally above its daily/weekly baseline, especially outside routine engineering windows?
  context: Baseline the frequency of broadcast discovery frames per minute per subnet and per source host
    over daily and weekly windows, deriving thresholds from at least 30 days of per-site capture. Flag
    abrupt increases with a Z-score >= 3 or excursions above the 99th percentile, especially outside routine
    engineering windows (Lakhina et al.). Cyclic control traffic is stable, so a sudden burst of discovery
    frames stands out statistically. The analyst looks for rate excursions that scanning produces. In
    Discovery, active enumeration sharply elevates discovery frame frequency and destination-address dispersion;
    a positive result (rate above the Z-score/percentile threshold off-hours) indicates probable scanning,
    while normal commissioning produces predictable, scheduled bursts.
  answer_sources: *id001
  range: Last 90 days; baseline window >= 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per (subnet, src_host) per minute:\n     rate = count(discovery_frames)\n  baseline\
      \ mean,std over >=30d by hour-of-week\n  alert if zscore(rate) >= 3 OR rate > p99(baseline)\n  boost\
      \ severity if outside engineering_window"
- question: For each broadcast discovery request, does the number of unique responding devices (responder
    count) or the entropy/dispersion of probe destination addresses exceed the host's and subnet's historical
    baseline, indicating wide device enumeration?
  context: 'Measure how many unique devices answer each broadcast discovery request (responder count)
    and the entropy/dispersion of probe destination addresses, comparing to the host and subnet historical
    baseline (Lakhina et al.). Subnet mapping reveals itself through breadth: a single probe drawing many
    responders, or probes fanning across a wide address range, raises responder count, response rate,
    and destination-address entropy. The analyst is quantifying that fan-out. In Discovery, the adversary''s
    goal is to enumerate as many live assets as possible; a positive result (responder count or destination
    entropy beyond normal operating variance) signals broad enumeration, while routine traffic targets
    a small, stable set of devices.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  for each discovery_request(src):\n     responders = distinct(responding_devices)\n \
      \    dst_entropy = entropy(destination_addrs)\n  baseline per (src, subnet)\n  alert if responders\
      \ > baseline_max\n          OR dst_entropy > p99(baseline)"
- question: Is a source host accruing an abnormal number of unanswered first-contact discovery probes
    (no I-Am/ListIdentity reply, ICMP host/port-unreachable, or TCP RST), crossing a sequential-hypothesis-testing
    (Threshold Random Walk) decision threshold?
  context: 'Profile the failure mode of discovery probes using sequential hypothesis testing (Threshold
    Random Walk): count first-contact requests that elicit no I-Am/ListIdentity reply, an ICMP host/port-unreachable,
    or a TCP RST, per source (Jung et al.). A discovering host probes many addresses that do not exist
    or do not speak the protocol, so it accrues many unanswered first-contacts, unlike normal cyclic control
    which talks to known, responsive peers. The analyst tracks the failed-to-successful first-contact
    ratio. In Discovery, scanning naturally produces a long run of non-responding destinations; alert
    when the SPRT decision threshold is crossed (e.g., >= 5 consecutive non-responding destinations).
    Complement with probabilistic risk scoring of improbable source/service/destination-spread transactions
    (Marsden et al.). A positive result strongly implies scanning behavior, while a low failure ratio
    reflects established, legitimate communication.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  TRW per src:\n     for each first_contact:\n        outcome = success if reply else\
      \ failure(no_reply|ICMP_unreach|RST)\n        update likelihood_ratio\n     alert if LR crosses\
      \ upper_threshold\n             OR consecutive_failures >= 5\n  | add probabilistic_risk_score(src,service,dst_spread)"
- question: Do density-based clusters of discovery traffic features (protocol/service type, request cadence,
    source role, response fan-out, destination entropy) reveal sparse or outlier clusters representing
    aggressive broadcast discovery from a host that normally performs process control only?
  context: Use DBSCAN or another density-based clustering method on discovery traffic features such as
    protocol/service type, request cadence, source role, response fan-out, and destination entropy, treating
    sparse or outlier clusters as suspicious (Tonejc et al.). Normal OT behavior forms dense, repeatable
    clusters; aggressive broadcast discovery from a control-only host falls outside them. The analyst
    examines outlier points and what makes them anomalous. In Discovery, a process-control host suddenly
    emitting wide discovery is structurally abnormal; surface the top-3 contributing features (source
    role, destination fan-out, discovery service code) in the alert. A positive result (outlier cluster
    tied to a control host) flags role-inconsistent reconnaissance, while membership in a dense baseline
    cluster is expected behavior.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [service_type, cadence, src_role, fan_out, dst_entropy]\n  model = DBSCAN(eps,\
      \ min_samples).fit(discovery_flows)\n  for f in outliers(model):\n     alert with top3_features(src_role,\
      \ fan_out, service_code)"
- question: When OT flows are classified by a Random Forest on engineered features (source/destination,
    function/service code, timing, fan-out), are discovery flows predicted as anomalous, and what are
    the top-3 feature-importance/SHAP contributors for each alert?
  context: Classify OT flows with a Random Forest on engineered features (source/destination, function/service
    code, timing, fan-out) and emit the top-3 feature-importance/SHAP contributors per alert (Anton et
    al.; Tonejc et al.). Supervised/explainable classification adds a second opinion to the deterministic
    allowlist floor, not a replacement for it. The analyst reviews flows the model labels anomalous and
    the SHAP attribution explaining why (e.g., unusual service code, high fan-out, off-hours timing).
    In Discovery, broadcast enumeration produces feature combinations the model has learned are abnormal
    for the source's role; a positive result with coherent SHAP contributors corroborates reconnaissance,
    while a benign classification with low anomaly score reflects routine flows. Run in parallel with
    the deterministic allowlist.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = engineer_features(src,dst,service_code,timing,fan_out)\n  pred = RandomForest.predict(X)\n\
      \  if pred == anomalous:\n     alert with shap_top3(X)\n  // runs alongside, not instead of, allowlist\
      \ rules"
- question: Modeling normal OT host interactions as a graph, has any host's out-degree/fan-out suddenly
    expanded into a one-to-many star pattern (the structural signature of subnet mapping), and which new
    neighbors and fan-out delta drove the change?
  context: Model normal OT host interaction patterns as a graph and score hosts whose out-degree/fan-out
    suddenly expands into a one-to-many star using graph-based anomaly methods (Ma et al.), with the asset/flow
    baseline from GRASSMARLIN. OT communication graphs are typically stable and sparse; subnet mapping
    appears as a node abruptly sprouting many new edges into a star. The analyst examines hosts whose
    graph neighborhood expands rapidly and the node/edge attribution (which new neighbors and the fan-out
    delta). In Discovery, broadcast enumeration is exactly this structural change; emit the new neighbors
    and fan-out delta as top contributing features and prioritize the fastest-expanding hosts. A positive
    result (a control host blooming into a star) is strong evidence of mapping, while a stable neighborhood
    is normal.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  G = build_interaction_graph(baseline_window)  // GRASSMARLIN assets\n  for host in current_window:\n\
      \     delta = out_degree(host,now) - out_degree(host,baseline)\n     if star_pattern(host) and delta\
      \ >> 0:\n        alert with new_neighbors(host), fanout_delta"
