name: 'T0806: Brute Force I-O'
id: ff8c8d7c-0e1e-4c10-a260-884930c855e8
description: 'Investigate potential Brute Force I/O activity in the OT/ICS environment, where an adversary
  repetitively or successively changes I/O point values to manipulate a physical process. This playbook
  helps an analyst hunt for three behavioral patterns observed in ICS protocol and host telemetry: (1)
  high-frequency bursts of write commands (Modbus Write Single Coil/Register, DNP3 WRITE, S7comm writes)
  against a single or small set of I/O points from a single source, exceeding learned per-channel baselines;
  (2) scanning-style write sequences across many I/O addresses (sequential arithmetic progressions, high
  invalid-address ratios, and Shannon-entropy spikes) indicating indiscriminate brute forcing of a value
  range; and (3) rapid repeated toggling of a specific discrete or analog point beyond engineering safe
  operating limits, especially when correlated with anomalous logons on the originating HMI/EWS. It combines
  symbolic-logic allow-list and rule checks, statistical baselining (percentiles, control limits, exception-ratio
  profiling, entropy), and machine-learning models (LSTM autoencoder, DBSCAN/Isolation Forest, sequence
  models) to distinguish legitimate, near-deterministic HMI-PLC traffic from adversarial manipulation
  that can wear or damage equipment and threaten operator safety.'
type: technique
related:
- tactic_id: TA0106
  tactic_name: Impair Process Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a high-frequency burst of ICS write commands to a single I/O point originate from a source
    IP that is NOT on the authorized PLC-communication allow-list, or from an authorized HMI/EWS that
    had NO corresponding legitimate SCADA/HMI control process running at the time of the burst?
  context: Impair Process Control via Brute Force I/O frequently begins from a host with no business issuing
    write commands, or from a compromised but legitimate HMI/EWS where the adversary drives writes outside
    the normal control application. Allow-listing authorized command sources (NIST SP 800-82r3, CISA ICS-CERT
    Defense-in-Depth) is the primary OT control. After a statistically anomalous write burst is flagged,
    first test whether the source IP (Zeek conn.log id.orig_h) is in the authorized-source asset inventory;
    if absent, escalate as a high-confidence Unauthorized Write Attempt. If the source is authorized,
    pivot to endpoint logs (Windows Event ID 4688) on that host and look for a new process within a 5-minute
    window whose command line does NOT match the allow-list of known SCADA/HMI executables (e.g., FactoryTalk.exe,
    WinCC.exe). Because legitimate HMI-PLC channels are near-deterministic and periodic (Goldenberg and
    Wool Modbus DFA model), a burst that does not match the learned per-channel pattern is itself corroborating
    evidence. A positive result (unknown source, or authorized source without a matching control process)
    strongly indicates manipulation of process control; a negative result suggests legitimate batch operations.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset inventory/allow-list database
  - Modbus/DNP3 exception responses
  - 'NAI: Control Network segments, Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Programmable
    Logic Controllers (PLCs), OT network traffic monitoring points (e.g., SPAN ports on OT switches),
    and Data Historians.'
  range: Last 90 days (correlate Windows Event ID 4688 within a 5-minute window of the write burst)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      input = write_bursts_flagged_by_stat_rule  // (src_ip, dst_plc, io_addr, ts)
      for each burst:
        if burst.src_ip NOT in asset_inventory.authorized_write_sources:
            alert("Unauthorized Write Attempt", severity=HIGH)
        else:
            procs = WinEventID==4688 where Computer==host(src_ip)
                     and NewProcessTime within [burst.ts-5m, burst.ts+5m]
            if none(procs.CommandLine matches scada_hmi_allowlist):
                alert("Authorized host, no legit control process", severity=HIGH)
  - technology: Zeek/pseudocode
    query: |-
      // confirm burst targets single io point from single source
      modbus.log | where func in ("WRITE_SINGLE_COIL","WRITE_SINGLE_REGISTER","WRITE_MULTIPLE")
        | join conn.log on uid
        | stats count by id.orig_h, id.resp_h, addr, 1min_bucket
        | where count exceeds learned_per_channel_pattern
- question: For each (source IP, destination PLC, I/O address) tuple, does the per-minute count of write
    commands exceed BOTH the 99th percentile and the mean + 3 standard deviations of its 30-day rolling
    baseline?
  context: Brute Force I/O against a single point manifests as a write-rate excursion far above the deterministic,
    near-periodic polling that characterizes legitimate Modbus/DNP3/S7comm channels (Goldenberg and Wool).
    Build 1-minute time buckets per unique (src_ip, dst_plc_ip, io_address) tuple and count write commands
    (volume/frequency). Over a 30-day rolling window compute the 99th percentile and mean + 3 standard
    deviations (an upper control limit). Alert only when a new 1-minute count breaches BOTH thresholds;
    this dual-thresholding suppresses false positives from legitimate but infrequent operations. Derive
    thresholds per tuple from your own historical traffic and validate the false-positive rate against
    labeled command-injection traffic such as the Morris/Gao gas-pipeline datasets. A breach indicates
    a sustained, anomalous write rate to a specific point consistent with attempts to manipulate or destabilize
    the associated process function.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset inventory/allow-list database
  - Modbus/DNP3 exception responses
  - 'NAI: Control Network segments, Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Programmable
    Logic Controllers (PLCs), OT network traffic monitoring points (e.g., SPAN ports on OT switches),
    and Data Historians.'
  range: Last 90 days (30-day rolling baseline, 1-minute evaluation buckets)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      writes = ics_writes | bucket(1min) by src_ip, dst_plc_ip, io_addr
      counts = writes | count
      baseline = counts over last 30d per tuple:
        p99 = percentile(count, 99)
        ucl = mean(count) + 3*stddev(count)
      alert when current.count > p99 AND current.count > ucl
- question: Does an LSTM autoencoder trained on the normal write rhythm of critical I/O points produce
    a reconstruction error above threshold for recent write activity, and which top-3 features drive that
    error?
  context: Subtle brute-force manipulation may stay under static thresholds yet still break the learned
    operational rhythm of a critical I/O point. Train an LSTM autoencoder on at least 90 days of history
    using features such as write count per minute, time of day, day of week, and the ICS function code
    used; the model learns normal temporal patterns. In production, feed live data and alert when reconstruction
    error (predicted vs. actual) exceeds a tuned threshold. This predict-then-measure-deviation design
    follows Kravchik and Shabtai and is validatable on SWaT (Inoue et al.). Every alert must surface the
    top-3 contributing features (e.g., writes/min, function code, hour-of-day) so analysts can triage
    without re-deriving the score. High reconstruction error indicates a write pattern inconsistent with
    normal operations and warrants investigation as possible process-control impairment.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset inventory/allow-list database
  - Modbus/DNP3 exception responses
  - 'NAI: Control Network segments, Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Programmable
    Logic Controllers (PLCs), OT network traffic monitoring points (e.g., SPAN ports on OT switches),
    and Data Historians.'
  range: Last 90 days (train on >=90 days; score live data continuously)
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [writes_per_min, hour_of_day, day_of_week, function_code]
      model = LSTM_Autoencoder.train(history>=90d, features)
      for window in live_stream:
        err = reconstruction_error(model, window)
        if err > threshold:
            top3 = feature_attribution(model, window)[:3]
            alert("Abnormal write rhythm", contributing_features=top3)
- question: Within any 1-minute window, do failed or exception write responses (Modbus exception codes
    02/03, DNP3 IIN error bits, Zeek conn_state REJ/RSTO/S0) exceed 10 percent of writes for a source-PLC
    pair, or rise more than 3 standard deviations above the 30-day baseline?
  context: 'Beyond raw volume, the STATE of each write is revealing: brute-force sweeps of unknown or
    read-only addresses generate a characteristic burst of failures. Parse protocol responses for Modbus
    exceptions (function code OR''d with 0x80 carrying exception 02 ''Illegal Data Address'' or 03 ''Illegal
    Data Value''), DNP3 IIN error/parameter bits, and Zeek conn.log conn_state values of REJ/RSTO/S0.
    Baseline the normal exception/failure ratio per source-PLC pair over 30 days and alert when failed/exception
    writes exceed 10 percent of writes in a 1-minute window OR rise more than 3 standard deviations above
    baseline. Such bursts are a deviation from the deterministic channel model (Goldenberg and Wool) and
    align with NIST SP 800-82r3 anomalous-command guidance. A spike in ''Illegal Data Address'' exceptions
    is a strong signal of indiscriminate address probing during a brute-force attempt.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Asset inventory/allow-list database
  - Modbus/DNP3 exception responses
  - 'NAI: Control Network segments, Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Programmable
    Logic Controllers (PLCs), OT network traffic monitoring points (e.g., SPAN ports on OT switches),
    and Data Historians.'
  range: Last 90 days (30-day baseline, 1-minute evaluation buckets)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      resp = ics_write_responses | bucket(1min) by src_ip, dst_plc_ip
      fail = resp where (modbus.func & 0x80) and modbus.exception in (02,03)
              or dnp3.iin_error_bit set
              or conn.conn_state in ("REJ","RSTO","S0")
      ratio = count(fail)/count(resp)
      baseline_ratio = mean+3*stddev over 30d per pair
      alert when ratio > 0.10 OR ratio > baseline_ratio
- question: Within a 30-second sliding window, did a single source IP write to a set of I/O addresses
    on a PLC where more than 75 percent are invalid (non-writable per the PLC config map), OR did it write
    to 5 or more addresses in an arithmetic progression?
  context: 'Brute forcing a RANGE of point values shows up as scanning: addresses targeted in sequence
    or a high proportion of writes to non-existent/read-only points. Group all I/O addresses (Zeek modbus.log
    addr) targeted by one source IP in a 30-second window and compare against the pre-compiled list of
    valid, writable points for that PLC. Alert if invalid addresses exceed 75 percent of the total. Concurrently
    scan the valid-address sequence for arithmetic progressions (addr[i] = addr[i-1] + C) and alert on
    runs of 5 or more. Corroborate with the protocol''s own failure signal: indiscriminate sweeps produce
    a matching burst of Modbus ''Illegal Data Address'' (exception 02) responses, a clear deviation from
    the deterministic per-channel model (Goldenberg and Wool). Tune the invalid-ratio and progression-length
    thresholds against labeled scans in the Morris/Gao datasets and the writable-point map recommended
    by NIST SP 800-82r3. A positive result indicates address-range brute forcing rather than legitimate
    targeted control.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - PLC configuration files or asset inventory
  - 'NAI: Control Network segments, Programmable Logic Controllers (PLCs), ICS protocol gateways, centralized
    PLC configuration management databases, and network security monitoring sensors.'
  range: Last 90 days (30-second sliding window evaluation)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for each src_ip, dst_plc in 30s_window:
        addrs = io_write_addresses
        invalid = addrs not in plc_config.writable_points
        if count(invalid)/count(addrs) > 0.75:
            alert("High invalid-address ratio scan")
        valid_seq = sort(addrs in plc_config.writable_points)
        if longest_arithmetic_run(valid_seq) >= 5:
            alert("Sequential I/O address scan")
- question: For each source-IP-to-PLC pair, does the Shannon entropy of the targeted I/O address field
    over a 5-minute window exceed its 30-day baseline by more than 2 standard deviations, especially alongside
    a rise in the count of distinct addresses?
  context: A shift from targeted operational writes to broad, indiscriminate scanning increases the diversity
    (entropy) of addresses touched. For each source-to-PLC pair compute the Shannon entropy of the I/O
    address field from write commands within a 5-minute sliding window, along with the raw count of distinct
    addresses (volume) and writes per minute (frequency). Establish a 30-day rolling baseline and standard
    deviation per pair. Alert when current entropy exceeds the baseline by more than 2 standard deviations,
    especially when accompanied by a rise in distinct-address count. Validate baselines against normal-vs-attack
    traffic in the SWaT and Morris/Gao datasets. An entropy spike indicates the source has begun touching
    a much wider, more random set of addresses, consistent with range brute forcing.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - PLC configuration files or asset inventory
  - 'NAI: Control Network segments, Programmable Logic Controllers (PLCs), ICS protocol gateways, centralized
    PLC configuration management databases, and network security monitoring sensors.'
  range: Last 90 days (30-day baseline, 5-minute sliding window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      win = io_writes | window(5min) by src_ip, dst_plc_ip
      H = shannon_entropy(win.io_addr)
      distinct = dcount(win.io_addr)
      base_H = mean(H)+2*stddev(H) over 30d per pair
      alert when H > base_H AND distinct rising vs baseline
- question: When write events are aggregated into 1-minute feature vectors per source IP (unique PLCs
    targeted, unique I/O addresses, address entropy, exception-response ratio), does any point fall outside
    all 'normal' DBSCAN clusters (flagged as noise) or rank highly anomalous under a parallel Isolation
    Forest / Kitsune model?
  context: 'Density-based clustering distinguishes novel scanning behavior from established operational
    patterns without labeled attack data. For each source IP, build 1-minute feature vectors: count of
    unique PLCs targeted, count of unique I/O addresses, entropy of I/O addresses, and exception-response
    ratio. Train DBSCAN on historical data to define clusters of normal communication; any point flagged
    as noise (in no cluster) represents anomalous scanning to escalate. Run an Isolation Forest in parallel
    for scored ranking and per-feature attribution, and an online Kitsune autoencoder for unlabeled edge
    scoring of write-rate/address-sweep spikes. Alerts must name the top-3 features (e.g., unique addresses,
    entropy, exception ratio) that placed the point outside normal clusters, enabling rapid triage of
    suspected address-range brute forcing.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - PLC configuration files or asset inventory
  - 'NAI: Control Network segments, Programmable Logic Controllers (PLCs), ICS protocol gateways, centralized
    PLC configuration management databases, and network security monitoring sensors.'
  range: Last 90 days (1-minute aggregation; train on history)
  queries:
  - technology: ML/pseudocode
    query: |-
      feat = per src_ip per 1min: [n_unique_plcs, n_unique_addrs, addr_entropy, exc_ratio]
      dbscan = DBSCAN.fit(history.feat)
      for v in live.feat:
        if dbscan.predict(v) == NOISE:
            alert("Anomalous write scanning")
        iso_score = IsolationForest.score(v)   // parallel ranking + attribution
        if iso_score high: alert(top3=feature_attribution(v))
- question: After a toggle-frequency anomaly on a discrete I/O point, is the source IP off the PLC write
    allow-list, or - if authorized - does the correlated successful logon (Windows Event ID 4624) on the
    HMI/EWS exhibit at least two anomalous traits (rare geolocation, off-hours, or first-time write to
    that point), and were there preceding failed logons (4625)?
  context: 'Repeated toggling of a discrete point (e.g., a large valve cycled 0->1->0) is a destructive
    brute-force pattern that can damage equipment. When a toggle-frequency anomaly fires, first check
    whether the source IP (Zeek conn.log id.orig_h) is on the PLC write allow-list (NIST SP 800-82r3,
    CISA ICS-CERT Defense-in-Depth); if not, escalate immediately. If the source is an authorized HMI/EWS,
    correlate the event timestamp with successful logons (Windows Event ID 4624) on that host and escalate
    if the logon has at least two anomalous traits: (1) source IP geolocates to a country not seen for
    that user in 30 days, (2) logon time falls outside the user''s baselined 9am-5pm hours, or (3) the
    user has no history of writing to that specific I/O point. Also profile preceding failed logons (Windows
    Event ID 4625) as a distinct credential-access signal. Two or more anomalies alongside dangerous toggling
    strongly suggest a compromised account driving process-control impairment.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - Windows Event ID 4624
  - User activity baselines
  - IP geolocation database
  - 'NAI: Control Network segments, Programmable Logic Controllers (PLCs), critical field devices (actuators,
    valves, breakers), HMIs, Active Directory domain controllers, and Identity and Access Management (IAM)
    log repositories.'
  range: Last 90 days (correlate Windows Event ID 4624/4625 around the toggle burst)
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      on toggle_anomaly(src_ip, io_point, ts):
        if src_ip NOT in plc_write_allowlist: alert(HIGH); return
        logon = WinEventID==4624 on host(src_ip) near ts
        anomalies = 0
        if geo(logon.src_ip) not in user.geo_30d: anomalies+=1
        if logon.time not in user.work_hours: anomalies+=1
        if io_point not in user.write_history: anomalies+=1
        failed = count(WinEventID==4625 on host before ts)
        if anomalies >= 2 or failed high: alert("Toggle + suspicious logon")
- question: Does a critical discrete I/O point change state more than its engineering safe-operating limit
    (e.g., 5 toggles/min) or above the 98th percentile of its 30-day baseline, and do analog points exceed
    their percentile-based rate-of-change threshold?
  context: 'Engineering safety limits provide a non-negotiable deterministic floor: out-of-range or rapidly
    cycling commands are treated as incidents (NIST SP 800-82r3). Monitor critical discrete I/O point
    states from ICS protocol logs and count state changes per minute to compute a toggle frequency. Alert
    if it exceeds a static engineering threshold (e.g., 5 toggles/min) OR the 98th percentile of its 30-day
    historical baseline. For analog points, compute the rate of change per minute and alert against a
    similar percentile threshold. Tune the percentile baseline against actuator-manipulation cases in
    SWaT and Morris/Gao datasets; rapid cycling also breaks the periodic channel model (Goldenberg and
    Wool). Exceeding the safety floor is itself an incident regardless of baseline; baseline excursions
    catch slower-but-abnormal cycling.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - Windows Event ID 4624
  - User activity baselines
  - IP geolocation database
  - 'NAI: Control Network segments, Programmable Logic Controllers (PLCs), critical field devices (actuators,
    valves, breakers), HMIs, Active Directory domain controllers, and Identity and Access Management (IAM)
    log repositories.'
  range: Last 90 days (30-day baseline; per-minute evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      discrete = io_state_changes | bucket(1min) by io_point
      toggle_freq = count(state_change)
      p98 = percentile(toggle_freq, 98) over 30d per point
      alert when toggle_freq > engineering_limit(io_point)   // hard floor
            OR toggle_freq > p98
      analog: roc = delta(value)/min; alert when roc > p98_analog
- question: Does an Isolation Forest (or DeepLog sequence model) trained on the normal rhythm of a critical
    I/O point assign a high anomaly score to recent writes - feature vectors of written value, inter-write
    interval, source IP, function code, and exception ratio - and which top-3 features explain it?
  context: 'An adversary repeatedly toggling a value produces a sequence of feature vectors that depart
    from learned operational rhythm. For each critical I/O point, build feature vectors from Zeek logs:
    the value written, time since last write to that point, source IP, ICS function code, and exception-response
    ratio. Train an Isolation Forest on history to learn normal behavior; repeated toggling yields high
    anomaly scores distinguishable from normal operational changes. Complement with predict-then-deviation
    models (Kravchik and Shabtai) and one-class methods (Inoue et al.); for sequence or out-of-order command
    surges feed events to a DeepLog LSTM. Each alert must list the top-3 contributing features (e.g.,
    inter-write interval, written value, function code) behind the score so analysts can triage suspected
    toggling-based brute force quickly.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - Windows Event ID 4624
  - User activity baselines
  - IP geolocation database
  - 'NAI: Control Network segments, Programmable Logic Controllers (PLCs), critical field devices (actuators,
    valves, breakers), HMIs, Active Directory domain controllers, and Identity and Access Management (IAM)
    log repositories.'
  range: Last 90 days (train on history; score live writes)
  queries:
  - technology: ML/pseudocode
    query: |-
      feat = per io_point: [written_value, inter_write_interval, src_ip, function_code, exc_ratio]
      model = IsolationForest.train(history.feat)
      for v in live.feat:
        s = model.anomaly_score(v)
        if s > threshold:
            alert("Anomalous I/O toggling", top3=feature_attribution(v)[:3])
      // optional: DeepLog LSTM on command sequence for out-of-order surges
