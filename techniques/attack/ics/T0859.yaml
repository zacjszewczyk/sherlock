    access, and per-account host fan-out, baselined from a 30-day rolling window of auth events and flow
    features, and alert when the cumulative score reaches 4 or more. In the Persistence tactic this aggregates
    weak individual signals into a defensible alert that a privileged account is being exercised abnormally
    to maintain access. A positive cumulative score should be triaged against the user''s normal behavior
    and any change activity.'
  answer_sources:
