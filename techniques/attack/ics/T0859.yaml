name: 'T0859: Valid Accounts'
id: 14dd07d3-4201-4a8d-956f-f1d088218a56
description: Investigate adversary abuse of valid accounts within an ICS/OT environment, where stolen,
  default, or attacker-created credentials are used to bypass access controls, move laterally between
  critical assets (EWS, HMI, Historian, PLC/RTU, jump servers, SIS, DCS controllers), and establish persistent
  access across restarts and credential changes. This playbook helps an analyst detect unauthorized lateral
  logons (Windows Event ID 4624 Logon Type 3/10) that violate a time-bound access control list, impossible-travel
  and concurrent sessions, failed-logon bursts that precede a single success, anomalous administrative-protocol
  connections (RDP/SSH/WinRM/SMB) and out-of-spec OT control-plane commands, as well as persistence behaviors
  such as new account creation followed by rapid privilege-group additions and privileged OT logons that
  violate source, role, or logon-type allowlists. It pairs deterministic symbolic-logic rules with statistical
  baselining and explainable machine-learning scoring so that detection retains a defensible floor even
  when ML detectors are evaded.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
- tactic_id: TA0110
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there successful interactive or network logons (Windows Event ID 4624, Logon Type 3 or
    10) onto critical ICS assets where the (source host, destination asset, user account) tuple is NOT
    on the pre-approved, time-bound lateral-movement allowlist?
  context: In the Lateral Movement tactic an adversary reuses valid credentials to pivot between OT assets
    without dropping malware. Correlate each 4624 Type 3/10 success on an HMI/EWS/Historian with the matching
    Zeek conn.log/rdp.log/dce_rpc.log flow, build the (id.orig_h, id.resp_h, TargetUserName) tuple, and
    compare it against an explicit allowlist of who may reach which asset from where. A tuple that is
    absent from the allowlist, or a first-time user-host edge, is a strong signal of credentialed lateral
    movement; enforce the same tuple over SMB/DCE-RPC admin operations (BZAR) so credentialed admin actions
    are caught too. This deterministic floor must remain regardless of any ML output. A positive result
    is an unauthorized pivot; a negative result confirms the access matched policy.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek dce_rpc.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), Historian Servers, Active Directory/Authentication servers,
    Network switches/routers in critical OT segments, IT/OT DMZ gateways, Jump Servers, Safety Instrumented
    Systems (SIS), Distributed Control Systems (DCS) controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from win_security where EventID==4624 and LogonType in (3,10)\njoin zeek_conn on (src_ip,\
      \ dst_ip, ~time)\nlet tuple = (src_ip, dst_ip, TargetUserName)\nwhere tuple NOT IN authorized_lateral_allowlist\n\
      \   or tuple is first_seen_edge(window=90d)\nalso flag dce_rpc/smb admin ops (svcctl, atsvc, srvsvc)\
      \ for same tuple\n-> alert 'unauthorized lateral logon'"
- question: Is the same account authenticating from two locations whose implied travel speed is physically
    impossible, or holding simultaneous interactive sessions on multiple critical ICS assets at the same
    time?
  context: Credential theft enables an attacker to use an account from a location the legitimate owner
    cannot be. Enrich VPN and jump-server logons with GeoIP and compute the implied travel speed between
    consecutive authentications for each account; flag speeds that exceed feasible human/air travel. Separately,
    detect a single account holding concurrent interactive sessions across multiple critical assets, which
    a single operator cannot legitimately do. In the Lateral Movement context this exposes shared/stolen
    credentials being exercised from the adversary's infrastructure in parallel with normal use. Positive
    results warrant immediate account suspension and session review.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek dce_rpc.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), Historian Servers, Active Directory/Authentication servers,
    Network switches/routers in critical OT segments, IT/OT DMZ gateways, Jump Servers, Safety Instrumented
    Systems (SIS), Distributed Control Systems (DCS) controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from auth_events (VPN, jump, 4624) enrich GeoIP\nper account order by time:\n  speed = distance(prev_geo,\
      \ cur_geo) / (cur_time - prev_time)\n  if speed > MAX_FEASIBLE_KMH -> alert 'impossible travel'\n\
      per account: if count(distinct asset with active interactive session) > 1\n  -> alert 'concurrent\
      \ sessions on critical assets'"
- question: For each (asset, user) pair, are there first-seen source IPs, statistically rare source addresses,
    abnormal per-account host fan-out, or admin-session byte volumes beyond the 99th percentile compared
    to a rolling baseline?
  context: Stolen credentials often arrive from new network locations or generate atypical session characteristics.
    Baseline source IPs and per-session bytes/duration per (ComputerName, TargetUserName) over a rolling
    window, then alert on first-seen sources, bottom-1st-percentile rarity, a single account suddenly
    reaching many hosts (fan-out), or admin sessions transferring data beyond the 99th percentile. In
    the Lateral Movement tactic these statistical outliers surface pivoting that does not trip the deterministic
    allowlist, e.g. a known-but-rare path being abused. A positive result is an anomalous deviation requiring
    triage against change records and user activity.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek dce_rpc.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), Historian Servers, Active Directory/Authentication servers,
    Network switches/routers in critical OT segments, IT/OT DMZ gateways, Jump Servers, Safety Instrumented
    Systems (SIS), Distributed Control Systems (DCS) controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per (ComputerName, TargetUserName): set(src_ip), p99(bytes), p99(duration), avg(fan_out)\n\
      for each new auth/flow:\n  alert if src_ip is first_seen\n  alert if src_ip rarity < 1st_percentile\n\
      \  alert if distinct_hosts_per_account > baseline_fanout\n  alert if admin_session_bytes > p99(bytes)"
- question: Is there a burst of failed logons (Windows Event ID 4625) from a source touching many distinct
    accounts, immediately followed by a single successful logon (4624) on a critical ICS asset, indicating
    password spraying or brute force that found a valid credential?
  context: 'Before valid-account abuse there is frequently a credential-guessing phase. Explicitly model
    authentication failure state: count 4625 failures and the number of distinct targeted accounts per
    source over a 15-minute sliding window, and correlate a failure burst that ends in a single 4624 success
    (''credential found''). Alert when failures exceed the per-asset 99.9th percentile or any source touches
    more than 5 distinct accounts before succeeding. In the Lateral Movement tactic this catches the moment
    an attacker transitions from guessing to valid access. A positive result is a likely successful spray/brute
    force; the subsequent success should be treated as a compromised account.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek dce_rpc.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), Historian Servers, Active Directory/Authentication servers,
    Network switches/routers in critical OT segments, IT/OT DMZ gateways, Jump Servers, Safety Instrumented
    Systems (SIS), Distributed Control Systems (DCS) controllers.'
  range: Last 7 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "window=15m per src_ip:\n  fails = count(EventID==4625)\n  targeted = count(distinct TargetUserName\
      \ where 4625)\n  if (fails > p99.9(per_asset) or targeted > 5)\n     and exists(EventID==4624 success\
      \ from same src within window_end)\n     -> alert 'failed-logon burst followed by success (credential\
      \ found)'"
- question: Does a supervised/UEBA model score a lateral logon as malicious with high probability (>0.85)
    based on peer-relative anomalies such as new source subnet, rare logon type, off-hours access, or
    first-time resource access?
  context: Deterministic rules miss novel or low-and-slow lateral movement. Score peer-relative login
    anomalies with UEBA and a supervised classifier trained on login/flow features (time, geo, device,
    logon type, first-time resource access), alerting when malicious probability exceeds 0.85 and surfacing
    the top-3 contributing features in the alert text for analyst explainability. Run this in parallel
    with the deterministic allowlist because ML detectors are evadable. In the Lateral Movement context
    this catches credentialed pivots that look statistically normal in isolation but are anomalous relative
    to the user's peer group. A positive, explainable score should be corroborated with the deterministic
    and statistical checks before escalation.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek dce_rpc.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Programmable Logic Controllers
    (PLCs), Remote Terminal Units (RTUs), Historian Servers, Active Directory/Authentication servers,
    Network switches/routers in critical OT segments, IT/OT DMZ gateways, Jump Servers, Safety Instrumented
    Systems (SIS), Distributed Control Systems (DCS) controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [logon_type, src_subnet_new, geo, device, hour, first_time_resource]\np = classifier.predict_proba(features)\n\
      ueba_score = sentinel_ueba(account, host)\nif p > 0.85 or ueba_score high:\n  alert with top3_features(shap)\n\
      always run alongside deterministic allowlist"
- question: Are there RDP/SSH/WinRM/SMB administrative connections between ICS assets, or from IT hosts
    to ICS assets, whose source-destination-account combination violates the ICS Administrative Access
    Control Matrix?
  context: Adversaries abuse high-privilege admin protocols with valid credentials to control OT systems.
    Enforce the ICS Administrative Access Control Matrix against Zeek rdp.log/ssh.log/dce_rpc.log connections
    and alert on any source-destination-account violation. Additionally detect remote service create/start,
    scheduled-task creation, and admin-share operations that accompany credentialed lateral movement (BZAR),
    and apply portable Sigma rules. In the Lateral Movement tactic these admin-protocol violations are
    the mechanism by which a foothold becomes control. A positive result is an admin connection outside
    policy that demands immediate review of the source host and account.
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Network switches and routers in critical OT segments, Firewalls at network boundaries (e.g.,
    IT/OT DMZ), Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Jump Servers, Remote
    Access Gateways, Historian Servers, Process Control Networks (PCN) assets, Data Diodes.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from rdp.log, ssh.log, dce_rpc.log

      let key=(id.orig_h, id.resp_h, user/account)

      where key NOT IN admin_access_control_matrix

      or dce_rpc.endpoint in (svcctl create/start, atsvc, admin$ share)

      -> alert ''admin protocol access violation'''
- question: Within credentialed sessions that carry OT control-protocol traffic (DNP3, Modbus, IEC 61850),
    are authorized identities issuing out-of-spec or out-of-role function codes, or malformed command/response
    pairings?
  context: A valid account does not guarantee valid commands. For credentialed sessions issuing control-protocol
    traffic, validate function codes, command/response pairing, and the source/destination role against
    allow/deny specifications. Alert when an authorized identity issues commands outside its defined role
    or outside the protocol specification. In the Lateral Movement context this catches an attacker who
    has pivoted onto an asset and is now sending legitimate-looking but unintended control commands. A
    positive result is an in-spec identity performing out-of-spec/out-of-role control actions, which is
    high-fidelity evidence of misuse.
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Network switches and routers in critical OT segments, Firewalls at network boundaries (e.g.,
    IT/OT DMZ), Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Jump Servers, Remote
    Access Gateways, Historian Servers, Process Control Networks (PCN) assets, Data Diodes.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from ot_protocol logs (dnp3, modbus, iec61850)\nfor each command:\n  if function_code NOT\
      \ IN allowed_for_role(src_identity, dst_role)\n  or response not paired with valid request\n  ->\
      \ alert 'out-of-spec/out-of-role OT command by authorized identity'"
- question: Do admin-connection frequency, transferred bytes, or session duration on a source-destination-protocol
    path exceed the 99th percentile of a 30-day rolling baseline, or is there a rise in blocked/rejected
    connections at the IT/OT firewall?
  context: Credentialed admin abuse changes the statistical shape of connections. Baseline connection
    frequency (count/min), bytes transferred, and session duration per source-destination-protocol path
    from a 30-day rolling window and alert when metrics exceed the 99th percentile. Separately profile
    blocked/rejected connection state at the IT/OT firewall as a distinct precursor signal of probing.
    In the Lateral Movement tactic these volume/frequency anomalies expose data staging, bulk command
    issuance, or scanning that rides over a legitimate admin path. A positive result is a path operating
    well outside its norm and should be correlated with the access matrix and user activity.
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Network switches and routers in critical OT segments, Firewalls at network boundaries (e.g.,
    IT/OT DMZ), Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Jump Servers, Remote
    Access Gateways, Historian Servers, Process Control Networks (PCN) assets, Data Diodes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per (src, dst, proto) over 30d: p99(count_per_min), p99(bytes), p99(duration)

      alert if current_metric > p99 for that path

      separately: count firewall blocked/rejected per (src,dst); alert on rise vs baseline'
- question: Does an Isolation Forest / Random Forest flag an admin connection in the top 0.5% of anomalies
    (bytes, duration, frequency, ports, time-of-day), and does provenance-graph correlation link the credentialed
    logon to suspicious follow-on process/file/network actions?
  context: Train an Isolation Forest / Random Forest on admin-connection features (bytes, duration, frequency,
    ports, time-of-day) and alert on the top 0.5% anomalies, emitting the top-3 contributing features.
    Correlate the credentialed logon with follow-on process, file, and network actions using provenance
    graphs (KAIROS) to confirm whether the access leads to a malicious chain. In the Lateral Movement
    tactic this catches novel admin-channel abuse that evades thresholds and ties an authentication to
    its downstream impact. Keep this alongside the deterministic access matrix because ML is evadable;
    a positive, graph-corroborated anomaly is strong evidence.
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Network switches and routers in critical OT segments, Firewalls at network boundaries (e.g.,
    IT/OT DMZ), Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Jump Servers, Remote
    Access Gateways, Historian Servers, Process Control Networks (PCN) assets, Data Diodes.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features=[bytes,duration,freq,dst_port,hour]

      score=isolation_forest.score(features)

      if score in top 0.5%: alert with top3_features

      then provenance_graph(logon -> proc/file/net) via KAIROS; escalate if malicious subgraph'
- question: Was a new local or domain account created on a critical ICS asset (Windows Event ID 4720)
    and then added to a high-privilege group (4732/4728/4756) within ~10 minutes WITHOUT a matching change
    ticket?
  context: For Persistence, adversaries create backup accounts, sometimes with predefined names and passwords,
    to survive credential changes and reboots. Correlate 4720 (account created) with 4732/4728/4756 (added
    to Administrators, Remote Desktop Users, or other privileged groups) within a 10-minute window on
    critical ICS assets and require validation against an approved change request. Alert when no matching
    ticket exists, and apply portable Sigma account-creation/privileged-group rules plus Elastic first-occurrence
    logic. A positive result is an undocumented privileged account being stood up - a classic persistence
    mechanism that should be disabled and investigated for its creator and source.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4732
  - Windows Event ID 4728
  - Windows Event ID 4756
  - 'NAI: Active Directory/LDAP servers, Local security logs on EWS/HMIs/Historian Servers, Configuration
    management systems for PLCs/RTUs (if applicable), Patch Management/Change Management systems, Jump
    Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from win_security where EventID==4720 (account created) on critical_asset

      join EventID in (4732,4728,4756) (added to priv group) within 10m on same account

      where no_matching_change_ticket(account, time)

      -> alert ''account created then privileged within 10m, undocumented'''
- question: Are new accounts on ICS assets using high-entropy names, typosquatting existing privileged
    accounts (edit distance 1-2), or being created at rates above the 99.9th percentile for that asset
    role - especially backup/default-named accounts created off-hours?
  context: 'Persistence accounts are often named to blend in or are auto-generated. Statistically profile
    account creation: alert on high-entropy usernames, names within edit-distance 1-2 of existing privileged
    accounts (typosquatting like ''administrater''), or account-creation rates above the 99.9th percentile
    per asset role over a 30-day baseline, and treat backup/default-named accounts created off-hours as
    elevated risk. In the Persistence tactic these naming and rate anomalies expose stealthy backdoor
    accounts. A positive result warrants checking whether the account is documented and who created it.'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4732
  - Windows Event ID 4728
  - Windows Event ID 4756
  - 'NAI: Active Directory/LDAP servers, Local security logs on EWS/HMIs/Historian Servers, Configuration
    management systems for PLCs/RTUs (if applicable), Patch Management/Change Management systems, Jump
    Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each new account (EventID 4720):\n  alert if entropy(name) > threshold\n  alert if min_edit_distance(name,\
      \ privileged_accounts) in (1,2)\n  alert if creation_rate_per_role > p99.9(30d_baseline)\n  elevate\
      \ if default/backup name and off_hours(time)"
- question: Does a supervised classifier score an account creation as malicious with very high probability
    (>0.95) using features like name entropy, time-of-day, creator account, and group-membership delta,
    with peer-group context from UEBA?
  context: To catch sophisticated persistence account creation, train a supervised classifier on creation
    features (name entropy, time-of-day, creator account, group-membership delta) and alert on malicious
    probability above 0.95, surfacing the top-3 contributing features and providing peer-group context
    via Sentinel UEBA. Retain the deterministic 4720->privilege-add rule because ML can be evaded. In
    the Persistence tactic this flags backdoor accounts whose individual attributes look plausible but
    are jointly anomalous. A high-confidence, explainable score should be corroborated with change records
    and the deterministic rule before action.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4732
  - Windows Event ID 4728
  - Windows Event ID 4756
  - 'NAI: Active Directory/LDAP servers, Local security logs on EWS/HMIs/Historian Servers, Configuration
    management systems for PLCs/RTUs (if applicable), Patch Management/Change Management systems, Jump
    Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features=[name_entropy, hour, creator_account, group_delta]

      p=classifier.predict_proba(features)

      if p > 0.95: alert with top3_features + ueba_peer_context(creator)

      retain deterministic 4720->priv-add rule in parallel'
- question: Did a privileged OT account authenticate (Windows Event ID 4624) from a source subnet, asset
    role, or logon type not on its allowlist - for example a user who normally uses Logon Type 10 (RDP)
    suddenly appearing as Type 3 (Network), or from an unexpected GeoIP origin / impossible-travel path?
  context: For Persistence, an adversary holding a privileged OT credential accesses assets in ways that
    deviate from the legitimate owner's habits. Enforce allowlists for OT privileged accounts and alert
    on disallowed source subnets, asset roles, or logon types (e.g., normal Type 10 RDP now Type 3 Network),
    flag unexpected GeoIP origins and impossible travel, and apply explicit-credential (4648) and off-hours
    Sigma rules. In the Persistence tactic this catches a compromised privileged account being used from
    attacker infrastructure or in an abnormal manner. A positive result is a privileged logon that violates
    established access patterns.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - 'NAI: VPN concentrators, Jump servers, Firewalls (IT/OT boundary), Active Directory/Authentication
    servers, Network switches/routers in critical OT segments, Endpoint devices (EWS, HMIs, Historian
    Servers), Remote Access Gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from win_security where EventID==4624 and account in OT_privileged_accounts\nalert if src_subnet\
      \ not in allowlist(account)\n   or asset_role not in allowlist(account)\n   or LogonType != usual_logon_type(account)\n\
      \   or geoip unexpected or impossible_travel\nalso flag EventID 4648 explicit-credential and off-hours\
      \ logons"
- question: For privileged OT accounts, is there a burst of authentication failures (4625), account lockouts
    (4740), or blocked IT/OT firewall connections followed by a single successful logon (4624)?
  context: 'Explicitly profile failure state for privileged OT accounts: count 4625 failures, account
    lockouts (4740), and blocked IT/OT firewall connections per account/source, and alert on a failure
    burst that ends in a single 4624 success. In the Persistence tactic this exposes an adversary guessing
    or stuffing credentials to (re)establish access to a privileged OT account, with the terminal success
    indicating they found the working credential. A positive result should be treated as a compromised
    privileged account and trigger credential reset and session review.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - 'NAI: VPN concentrators, Jump servers, Firewalls (IT/OT boundary), Active Directory/Authentication
    servers, Network switches/routers in critical OT segments, Endpoint devices (EWS, HMIs, Historian
