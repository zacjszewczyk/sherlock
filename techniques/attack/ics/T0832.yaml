tags: none
questions:
- question: For each critical process tag, does the value read directly from the PLC's network response
    differ from the value forwarded by the HMI or gateway to the historian for the same tag within a short
    correlation window, beyond the per-tag engineering threshold?
  context: 'Under the Impact tactic, Manipulation of View means an adversary makes the operator-facing
    value desynchronize from the value physically present on the PLC. By correlating ICS read responses
    from PLC IPs (is_response=true) with the value sent from HMI/gateway IPs to historian IPs for the
    same tag inside a small (e.g. 5s) window that absorbs network latency, an analyst performs a physics-aware
    cross-source comparison. Alert if the values differ by more than a per-tag threshold (>2% for analog,
    any mismatch for discrete/boolean). A positive result strongly suggests the displayed view has been
    falsified; a clean comparison across all critical tags is evidence the operator view is faithful.
    This is the deterministic floor of detection and should be tuned per tag. References: [Cárdenas et
    al.](https://users.soe.ucsc.edu/~alacarde/papers/asiaccs11.pdf); [Urbina et al., NIST GCR 16-010](https://nvlpubs.nist.gov/nistpubs/gcr/2016/nist.gcr.16-010.pdf).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - 'NAI: HMI servers, Historian servers, and network segments connecting PLCs to HMIs and Historians,
    focusing on data gateways and visualization platforms.'
  range: Last 90 days; correlate PLC and HMI/historian samples within a 5s window per tag
  queries:
  - technology: Zeek/pseudocode
    query: "join PLC_response(tag,value_plc,ts) with HMI_to_historian(tag,value_hist,ts)\n  on tag and\
      \ abs(ts_plc - ts_hist) <= 5s\n  | where (is_analog and abs(value_plc-value_hist)/value_plc > 0.02)\n\
      \          or (is_discrete and value_plc != value_hist)\n  | alert 'cross-source value mismatch'"
- question: Do correlated, Zeek-derived tag values violate codified engineering invariants from the asset's
    P&ID or control logic for several consecutive polling cycles (e.g., tank level not rising while inflow
    pump is ON and outflow valve is CLOSED, motor RPM inconsistent with current draw, or a PV not changing
    when its setpoint changes)?
  context: 'Even when a single reading looks plausible, a manipulated view will eventually contradict
    the physical/process consequences it should produce. Encoding deterministic engineering invariants
    over correlated tag values lets the analyst catch this: if an invariant is violated for more than
    ~3 consecutive polling cycles, the reported value no longer reflects reality, indicating Impact via
    Manipulation of View. Invariants should be drawn from the control logic and benchmarked against labeled
    process-aware datasets. A sustained violation is high-confidence evidence of tampering; transient
    single-cycle violations are usually noise. References: [Urbina et al., NIST GCR 16-010](https://nvlpubs.nist.gov/nistpubs/gcr/2016/nist.gcr.16-010.pdf);
    [Sen et al.](https://arxiv.org/abs/2412.04902); [Sherlock dataset](https://arxiv.org/abs/2504.06102).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - 'NAI: HMI servers, Historian servers, and network segments connecting PLCs to HMIs and Historians,
    focusing on data gateways and visualization platforms.'
  range: Last 90 days; evaluate over >=3 consecutive polling cycles
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each polling_cycle:\n    if inflow_pump==ON and outflow_valve==CLOSED and delta(tank_level)<=0:\
      \ violation++\n    if not consistent(motor_RPM, current_draw): violation++\n    if setpoint_changed(tag)\
      \ and not PV_changed(tag): violation++\n  | alert if violation persists > 3 consecutive cycles"
- question: Does the rolling cross-correlation between the PLC-reported series and the historian-recorded
    series for a critical tag drop below threshold, or does a CUSUM/EWMA on their residual accumulate
    beyond its baseline drift?
  context: 'Sophisticated, stealthy manipulation may keep each instantaneous value under a hard threshold
    while slowly biasing the operator view. Building two synchronized series per critical tag (PLC responses
    vs historian/HMI traffic) and computing a rolling 10-minute Pearson cross-correlation catches decoupling:
    alert if correlation falls below a tuned value (e.g. <0.9) for >5 minutes. In parallel, a stateful
    CUSUM/EWMA on the residual accumulates slow drift so gradual falsification still triggers while bounding
    false alarms; derive drift/threshold from a 30-day normal baseline. This statistical layer complements
    the deterministic rules and is well suited to detecting slow Impact-stage manipulation. References:
    [Cárdenas et al.](https://users.soe.ucsc.edu/~alacarde/papers/asiaccs11.pdf); [Urbina et al., NIST
    GCR 16-010](https://nvlpubs.nist.gov/nistpubs/gcr/2016/nist.gcr.16-010.pdf); [Birihanu & Lendák](https://doi.org/10.3389/frai.2024.1508821).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - 'NAI: HMI servers, Historian servers, and network segments connecting PLCs to HMIs and Historians,
    focusing on data gateways and visualization platforms.'
  range: Last 90 days; rolling 10-minute window, baseline from 30 days of normal
  queries:
  - technology: SIEM/Stats pseudocode
    query: "series_plc, series_hist = synchronized(tag)\n  rho = rolling_pearson(series_plc, series_hist,\
      \ window=10min)\n  if rho < 0.9 for > 5min: alert 'correlation drop'\n  resid = series_plc - series_hist\n\
      \  if CUSUM(resid, drift=k, h=baseline_threshold) exceeded: alert 'stealthy drift'"
- question: Does a multivariate autoencoder trained on synchronized normal time series produce high per-feature
    reconstruction error on the vector [PLC_reported_value, HMI_displayed_value, Historian_recorded_value,
    control_output] for a tag, and which features drive the anomaly?
  context: 'A learned model captures the joint normal behavior of the PLC reading, HMI display, historian
    record, and control output for each tag. When an adversary manipulates the view, these sources diverge
    in ways the autoencoder/seq2seq predictor cannot reconstruct, producing high per-feature error. Set
    the error threshold on validation data and require the alert to surface the top-3 contributing tags/features
    (via SHAP or largest per-feature errors) so analysts can confirm which reading was manipulated. Run
    this in parallel with the deterministic invariant and cross-source rules, because adversarial spoofing
    can evade a learned detector used alone. A high, well-attributed reconstruction error against an otherwise
    stable baseline is strong corroboration of Manipulation of View. References: [Kravchik & Shabtai](https://arxiv.org/abs/1806.08110);
    [Kim et al.](https://arxiv.org/abs/1911.04831); [Ha et al.](https://arxiv.org/abs/2205.01930); [Birihanu
    & Lendák](https://doi.org/10.3389/frai.2024.1508821); [Erba & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - Zeek conn.log
  - 'NAI: HMI servers, Historian servers, and network segments connecting PLCs to HMIs and Historians,
    focusing on data gateways and visualization platforms.'
  range: Last 90 days; train on >=30 days normal, threshold on validation set
  queries:
  - technology: ML/pseudocode
    query: "X = [PLC_reported, HMI_displayed, Historian_recorded, control_output] per tag\n  err = autoencoder.reconstruction_error(X)\n\
      \  if err > validation_threshold:\n     alert with top3 = shap_or_max_feature_errors(X)"
- question: Is any process that is not on the approved whitelist of HMI development/deployment software
    writing to HMI graphical configuration or project files (.gfx, .pvi, .xml, .ini) in known project
    directories?
  context: HMI screen and logic configuration files define what the operator sees; tampering with them
    is a direct route to Manipulation of View under Impact. Maintain a strict whitelist of ProcessName/ProcessHash
    for authorized HMI editing and deployment tools, then monitor Windows Event ID 4663 for write access
    (AccessMask contains WRITE_DATA) to HMI-specific extensions in project directories. Correlate the
    writing process by ProcessId back to Event ID 4688 to get the full image path and hash, and alert
    if the process or hash is not whitelisted. A non-whitelisted writer (e.g., powershell.exe, a script,
    or unknown binary) editing display files is high-confidence evidence of unauthorized view modification.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on HMI servers and engineering workstations, specifically directories containing
    HMI screen and logic configuration files.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "4663 where AccessMask has WRITE_DATA\n    and ObjectName matches '*.gfx|*.pvi|*.xml|*.ini'\n\
      \    and ObjectName in HMI_project_dirs\n  | join 4688 on ProcessId -> ProcessName, ProcessHash\n\
      \  | where ProcessName not in whitelist or ProcessHash not in whitelist\n  | alert 'non-whitelisted\
      \ HMI file write'"
- question: Does the count of modifications to any single HMI configuration file by a given user, host,
    or process in a 24-hour period exceed the 99th percentile of that file's own 30-day historical modification
    frequency?
  context: Beyond who edits the files, how often they are edited is a useful signal. Establishing a 30-day
    baseline of modification frequency (Event ID 4663 write counts) per file, per user, per host, and
    per process lets the analyst flag bursts of editing that deviate from normal change rhythms. Alert
    when a single file's modification count by one user or process in 24 hours exceeds its own 99th percentile.
    Unusually frequent editing can indicate iterative tampering with operator displays or staging of a
    falsified view. This statistical method reduces reliance on whitelists alone and catches authorized-but-abused
    tools.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on HMI servers and engineering workstations, specifically directories containing
    HMI screen and logic configuration files.'
  range: Last 90 days; 30-day baseline, 24-hour evaluation window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_file_per_actor 4663 write counts over 30d\n  p99 = percentile(baseline.daily_counts,\
      \ 99)\n  today = count(4663 writes) per file per (user|process) in 24h\n  | where today > p99 |\
      \ alert 'unusual HMI edit frequency'"
- question: Does a UEBA model of normal HMI-server file-modification behavior flag a user or system process
    whose access pattern (paths, frequency, time-of-day, day-of-week, originating/parent process) deviates
    significantly, and is there a rising rate of FAILED/denied write attempts?
  context: 'A UEBA model learns each user''s and process''s normal file-modification profile on HMI servers
    and engineering workstations. It can catch context-rich anomalies that simple rules miss, e.g., an
    admin account modifying HMI display files via powershell.exe outside business hours instead of the
    standard HMI_Editor.exe. The alert MUST surface the top-3 contributing features for triage. Critically,
    the model should separately profile FAILED/access-denied writes (Event ID 4663 access-denied) as a
    distinct signal of probing before a successful tamper. In the Impact context, this behavioral layer
    flags both successful unauthorized edits to the operator view and the reconnaissance/probing that
    precedes them. References: [Ha et al.](https://arxiv.org/abs/2205.01930).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File systems on HMI servers and engineering workstations, specifically directories containing
    HMI screen and logic configuration files.'
  range: Last 90 days; train on >=30 days normal behavior
  queries:
  - technology: ML/pseudocode
    query: "features = [user, process, parent_process, path, freq, hour, dow]\n  score = ueba.anomaly(features\
      \ over HMI file 4663/4688 events)\n  if score > threshold: alert with top3 contributing features\n\
      \  separately: model rate(4663 access-denied writes) as probing signal"
- question: Did an ICS write command (e.g., modbus.func 6 or 16) from a source IP not on the HMI/EWS allowlist
    target a critical register with a value outside its documented safe range, or target a register defined
    as read-only?
  context: 'While Manipulation of View hides the true state, the same intrusion frequently issues damaging
    control writes. Maintaining an asset inventory of critical registers with safe min/max ranges, data
    types, and read/write status lets the analyst apply a deterministic floor: alert (high severity) when
    a write from a non-allowlisted source IP pushes a critical register out of range or writes to a read-only
    register. This catches commands intended to cause physical damage and is the most defensible, lowest-false-positive
    layer. A hit, especially uncorrelated with change management, indicates an attempt to cause Impact
    via unsafe control. References: [Cárdenas et al.](https://users.soe.ucsc.edu/~alacarde/papers/asiaccs11.pdf);
    [Urbina et al., NIST GCR 16-010](https://nvlpubs.nist.gov/nistpubs/gcr/2016/nist.gcr.16-010.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Process Control Network (PCN) segments, Safety Instrumented System (SIS) network segments, PLC/RTU
    network interfaces, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    Data Historian servers.'
  range: Last 90 days; correlate against change-management windows (15 min)
  queries:
  - technology: Zeek/pseudocode
    query: "ics_write where func in (6,16) [or dnp3/enip equivalents]\n    and src_ip not in HMI_EWS_allowlist\n\
      \    and (value < reg.safe_min or value > reg.safe_max or reg.readonly)\n  | alert high 'out-of-range/read-only\
      \ write'"
- question: Do decoded write commands violate physics/engineering invariants indicating mechanical or
    thermal stress, such as 5+ alternating open/close commands to a valve within 1 second, or commanding
    a heater to maximum while its cooling system is commanded off?
  context: 'Some damaging command sequences use values that are individually in range but collectively
    destructive. Encoding mechanical-fatigue and thermal-shock invariants over decoded write commands
    catches these patterns: e.g., rapid alternating valve commands (mechanical fatigue) or simultaneous
    heater-max/cooling-off (thermal shock). Alert on any invariant violation and validate the rules against
    process-aware datasets. In the Impact context, these rules detect intent to damage property even when
    point-in-time values pass range checks, complementing both the out-of-range rule and statistical detectors.
    References: [Urbina et al., NIST GCR 16-010](https://nvlpubs.nist.gov/nistpubs/gcr/2016/nist.gcr.16-010.pdf);
    [Sen et al.](https://arxiv.org/abs/2412.04902); [Sherlock dataset](https://arxiv.org/abs/2504.06102).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Process Control Network (PCN) segments, Safety Instrumented System (SIS) network segments, PLC/RTU
    network interfaces, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    Data Historian servers.'
  range: Last 90 days; evaluate sequences within sub-second to minute windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: "if count(alternating open/close to valve) >= 5 within 1s: alert 'mechanical fatigue'\n  if\
      \ heater_cmd==MAX and cooling_cmd==OFF concurrently: alert 'thermal shock'\n  | source from decoded\
      \ modbus/dnp3/enip/s7comm writes"
- question: For each critical parameter, does a reading fall outside its 30-day 1st-99th percentile distribution
    for several consecutive cycles, does a CUSUM/EWMA on residuals show slow drift, or does the Mahalanobis
    distance of the interdependent state vector (RPM, current, temperature) exceed the 99.9th percentile?
  context: 'Statistical baselining detects damaging or manipulated conditions that deterministic rules
    miss. Per parameter, build a 30-day rolling distribution and alert if a reading is outside the 1st-99th
    percentile for >3 consecutive polling cycles. A stateful CUSUM/EWMA on residuals catches slow, stealthy
    drift while bounding false alarms. For interdependent systems, compute the Mahalanobis distance of
    the current state vector from its normal centroid and alert above the 99.9th percentile of historical
    distances, capturing abnormal combinations even when each variable is individually normal. In the
    Impact context these flag both physical-damage conditions and the desynchronized states characteristic
    of a manipulated view. References: [Cárdenas et al.](https://users.soe.ucsc.edu/~alacarde/papers/asiaccs11.pdf);
    [Urbina et al., NIST GCR 16-010](https://nvlpubs.nist.gov/nistpubs/gcr/2016/nist.gcr.16-010.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Process Control Network (PCN) segments, Safety Instrumented System (SIS) network segments, PLC/RTU
    network interfaces, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    Data Historian servers.'
  range: Last 90 days; 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: "if reading outside [p1,p99] for >3 consecutive cycles: alert\n  if CUSUM/EWMA(residual) exceeds\
      \ baseline threshold: alert 'drift'\n  d = mahalanobis(state_vector[RPM,current,temp], normal_centroid,\
      \ cov)\n  if d > p99_9(historical_d): alert 'multivariate outlier'"
- question: Does a One-Class SVM (or autoencoder) flag an ICS write command vector [source_ip, register_address,
    value] as unlike learned normal, or does a time-series anomaly model flag change-points in write volume,
    frequency, write/read ratio, success-vs-failed counts, or target-register entropy?
  context: 'Machine learning generalizes beyond enumerated rules. Train a One-Class SVM (or autoencoder)
    on normal command vectors [source_ip, register_address, value]; a -1/high-error prediction flags a
    command unlike anything learned. In parallel, run a time-series anomaly model (Isolation Forest /
    seq2seq) on 1-minute aggregates capturing VOLUME (write byte counts), FREQUENCY (writes/min), STATE
    (write/read ratio, success vs failed/blocked commands), and entropy of target registers, alerting
    on change-points. The alert MUST list the top-3 contributing features, and the failed/blocked-write
    rate MUST be profiled as a distinct probing signal. Layer ML behind the deterministic rules because
    spoofed signals can evade learned detectors alone. In the Impact context this catches novel damaging-write
    campaigns and the burst/anomaly patterns that precede them. References: [Kravchik & Shabtai](https://arxiv.org/abs/1806.08110);
    [Kim et al.](https://arxiv.org/abs/1911.04831); [Ha et al.](https://arxiv.org/abs/2205.01930); [Erba
    & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Process Control Network (PCN) segments, Safety Instrumented System (SIS) network segments, PLC/RTU
    network interfaces, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers,
    Data Historian servers.'
  range: Last 90 days; train on >=30 days normal; 1-minute aggregation
  queries:
  - technology: ML/pseudocode
    query: "ocsvm.fit(normal [source_ip, register_address, value])\n  if ocsvm.predict(cmd) == -1: alert\
      \ 'anomalous write'\n  agg = 1min[volume, freq, write_read_ratio, success_vs_failed, reg_entropy]\n\
      \  if change_point(isolation_forest_or_seq2seq, agg): alert with top3 features"
