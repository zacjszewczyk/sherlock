name: 'T0832: Manipulation of View'
id: 0fb16b50-1295-4d68-a888-8769d27b45e2
description: Investigate possible Manipulation of View (T0832), where an adversary falsifies the information
  reported to ICS operators, HMIs, historians, or business analytics so that the process appears normal
  while its true physical state diverges. This playbook helps an analyst detect a persistent, measurable
  discrepancy between a process variable read directly from a PLC's network responses (Zeek modbus/dnp3/s7comm
  logs) and the value recorded by a historian or shown on an HMI, using physics-aware cross-source validation,
  engineering invariants, correlation/CUSUM drift analysis, and multivariate autoencoders with explainable
  attribution. It also covers unauthorized modification of HMI graphical configuration or project files
  (Windows Event ID 4663/4688) by non-whitelisted processes, anomalous edit frequency, and UEBA for abnormal
  HMI file edits. Finally, because a manipulated view often masks damaging control actions, it includes
  detection of out-of-range or read-only write commands, mechanical-stress and thermal-shock invariant
  violations, statistical PV/CUSUM/Mahalanobis outliers, and one-class/anomaly models over ICS write traffic.
  A positive result indicates an operator may be acting on a falsified view, risking inappropriate control
  sequences, faults, or catastrophic failure.
type: technique
related:
- tactic_id: TA0105
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
