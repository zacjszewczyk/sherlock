name: 'T0830: Adversary-in-the-Middle'
id: 0058ce6a-9f4a-4796-8db0-a07602c30cf8
description: 'This playbook helps an analyst investigate whether an adversary with privileged network
  access has established an Adversary-in-the-Middle (AiTM) position to intercept, block, log, modify,
  or inject ICS network communications (MITRE ATT&CK T0830, Adversary-in-the-Middle). AiTM in an industrial
  environment is most often achieved through ARP cache poisoning, rogue gratuitous ARP, static ARP manipulation
  on Engineering Workstations, or interposition of an unauthorized proxy/relay between a critical asset
  and its legitimate peer, and it underpins downstream attacks such as Block Reporting Message, Spoof
  Reporting Message, Modify Parameter, and Unauthorized Command Message. The hunt pursues the behavior
  from three complementary angles: (1) anomalous ARP activity on the Process Control Network -- IP-to-MAC
  mappings that violate a hardware allowlist, a single MAC claiming multiple IPs, rapid MAC flapping,
  gratuitous-ARP and reply-without-request floods, and arp.exe/netsh static-cache edits on EWS hosts;
  (2) network-flow evidence of an unapproved intermediary hop, where an A->B->C path is rerouted through
  a device that is not an approved proxy, gateway, or data diode, corroborated by RTT/timing-phase drift,
  byte-distribution shifts, connection-state failures, and graph-structural changes to previously direct
  paths; and (3) TLS/SSL certificate anomalies on encrypted sessions to critical assets -- off-baseline
  certificate or JA4X/JA4S fingerprints, validation_status != ''ok'', self-signed certificates where CA-signed
  is expected, and high-entropy subject/issuer fields characteristic of interception proxies. Detection
  methods combine deterministic symbolic-logic rules (IP-MAC allowlists with active probing, specification-based
  path/protocol validation, certificate-fingerprint baselines, and process-creation rules for ARP tampering),
  statistical baselining (MAC-flap and gratuitous-ARP rate thresholds, RTT/timing-phase and byte-distribution
  drift, connection-reset and retransmit surges, certificate-entropy and TLS-error rate spikes), and machine
  learning (Kitsune-style autoencoder ensembles on ARP statistics, GraphSAGE node-level graph anomaly
  detection for new hops, and one-class/autoencoder certificate outlier models with feature attribution),
  applied across Zeek arp/conn/http/ssl/x509 logs and Windows process-creation and registry/ARP audit
  events, so the analyst can corroborate a suspected AiTM position against host, network-path, and cryptographic
  context.'
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
