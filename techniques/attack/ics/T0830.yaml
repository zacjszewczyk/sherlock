questions:
- question: '[Collection] ARP spoofing or static entry changes: Can you determine, using the ''ARP spoofing
    or static entry changes'' (Symbolic Logic) approach, the following? Whether any ARP reply or gratuitous
    ARP on the Process Control Network associates a critical ICS asset''s IP (PLC, HMI, SCADA) with a
    MAC address that is not on the pre-approved IP-to-MAC hardware allowlist, or whether an arp.exe /
    netsh static-cache edit was executed on an Engineering Workstation against a critical asset IP?'
  context: 'Why this matters: Under the Collection tactic, an adversary first establishes the AiTM position
    before intercepting or manipulating ICS traffic, and on a flat LAN the cheapest way to do that is
    to falsify IP-to-MAC bindings via forged ARP replies or gratuitous ARP. Maintain an allowlist of the
    known-good IP-to-MAC mappings for every critical ICS asset and, using Zeek arp.log, alert on any ARP
    reply (op=''reply'') or gratuitous ARP whose sender IP-MAC pair is off-allowlist -- falsified pairs
    are the first observable step of most LAN AiTM. Where static bindings are impractical, deterministically
    verify a suspect pair with an active ICMP/TCP/ARP request-response probe and flag pairs that fail
    the handshake. In parallel, using Windows Event ID 4688 (process creation), alert on command lines
    such as ''arp.exe -s'' or ''netsh interface ipv4 add neighbors'' targeting critical asset IPs, which
    indicate host-based static ARP manipulation. A positive result -- an off-allowlist pair, a failed
    active probe, or a static-cache edit -- is strong evidence of ARP poisoning; pivot to the offending
    MAC/host, the targeted critical asset, and the switch port to localize the rogue device. A negative
    result reduces but does not eliminate suspicion, since proxy-based AiTM leaves no ARP signature.
    Citations: [An Active Host-Based Intrusion Detection System for ARP-Related Attacks](https://arxiv.org/abs/1306.1332).'
  answer_sources: &id001
  - Zeek arp.log
  - Windows Event ID 4688
  - Windows Security Event ID 4703
  - 'NAI: Process Control Network (PCN) switches, managed industrial switches, network taps/sensors within
    the PCN, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA servers, Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: 'from arp.log where op == "reply" or is_gratuitous == true

      let pair = (src_ip, src_mac)

      where src_ip in CRITICAL_ICS_ASSETS and pair not in IP_MAC_ALLOWLIST

      | emit alert(severity=high, reason="off-allowlist IP-MAC binding", ip=src_ip, mac=src_mac)

      // where static bindings impractical: active_probe(src_ip) and alert if probe_mac != src_mac'
  - technology: SIEM/Rule pseudocode (Windows EID 4688)
    query: "from win_event where EventID == 4688\nwhere (lower(CommandLine) matches \"arp(\\.exe)? +-s\"\
      \ or\n       lower(CommandLine) matches \"netsh +interface +ipv4 +add +neighbors\")\nand CommandLine\
      \ contains any(CRITICAL_ICS_ASSET_IPS)\nand Host in ENGINEERING_WORKSTATIONS\n| emit alert(severity=high,\
      \ reason=\"static ARP cache edit\", host=Host, cmd=CommandLine)"
- question: '[Collection] MAC flapping above baseline: Can you determine, using the ''MAC flapping above
    baseline'' (Statistical Method) approach, the following? Whether any critical ICS asset''s IP-to-MAC
    mapping changes more often than its established baseline (or a static floor of 3 distinct MACs) within
    a sliding 5-minute window, indicating contention consistent with active ARP poisoning?'
  context: 'Why this matters: During the Collection tactic, active ARP poisoning makes a critical IP rapidly
    oscillate between the legitimate MAC and the attacker''s MAC as the real host and the poisoner contend
    for the binding -- so-called MAC flapping. From Zeek arp.log, in a sliding 5-minute window count the
    unique MAC addresses bound to each critical IP and alert when the count exceeds the 99th percentile
    of the 30-day change-frequency baseline or a static floor of 3, whichever is breached. Keep the deterministic
    floor of 3 even when the dynamic threshold drifts upward, so a quiet link is never allowed to silently
    accept flapping. A positive result -- flap count above threshold -- points to an in-progress poisoning
    attack against that asset; pivot to the competing MACs and switch ports to identify the rogue node.
    A negative result is reassuring for that asset but should be corroborated with the gratuitous-ARP
    and reply-without-request signals, since a single, brief spoof may not raise the windowed count.
    Citations: [Intelligent ARP Spoofing Detection using Multi-layered Machine Learning Techniques for
    IoT Networks](https://arxiv.org/abs/2507.21087).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "from arp.log where src_ip in CRITICAL_ICS_ASSETS\nwindow sliding 5m by src_ip\n  flap = count_distinct(src_mac)\n\
      \  thr = max(3, p99(flap_baseline_30d[src_ip]))\nwhere flap > thr\n| emit alert(ip=src_ip, distinct_macs=flap,\
      \ threshold=thr)"
- question: '[Collection] Reply-without-request and gratuitous-ARP rate (failure-mode): Can you determine,
    using the ''Reply-without-request and gratuitous-ARP rate (failure-mode)'' (Statistical Method) approach,
    the following? Whether, per network segment, the rate of gratuitous-ARP packets per minute or the
    rate of ARP replies that have no matching prior request (''reply-without-request'') exceeds the rolling
    baseline (mean + 3 sigma) or a static floor, both hallmarks of an active poisoning flood?'
  context: 'Why this matters: The Collection tactic''s AiTM poisoning is sustained by continuously re-asserting
    the forged binding, which produces two abnormal-state signals: a high rate of gratuitous ARP and a
    high rate of ARP replies for which no host ever issued a request. Profile both per segment from Zeek
    arp.log -- (Frequency) gratuitous-ARP packets/min and (State) reply-without-request count/min -- and
    alert when either exceeds mean + 3 sigma over a 7-day rolling baseline or a static floor (for example,
    more than 5 unsolicited replies/min). Derive the dataset-specific sigma from quiet maintenance windows
    so normal ARP chatter does not inflate the threshold. A positive result -- a burst of unsolicited
    or gratuitous replies -- indicates an ongoing poisoning flood on that segment; pivot to the source
    MAC and the IPs being claimed. A negative result helps rule out a noisy flooding-style attack but
    not a surgical, low-rate spoof, so corroborate with the allowlist and flap-count checks. Citations:
    [Intelligent ARP Spoofing Detection using Multi-layered Machine Learning Techniques for IoT Networks](https://arxiv.org/abs/2507.21087).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "from arp.log group by segment, bin(1m)\n  grat_rate = count(is_gratuitous == true)\n  rwr_rate\
      \  = count(op == \"reply\" and no_matching_request == true)\nlet base = rolling_baseline(7d, by=segment)\n\
      where grat_rate > max(base.grat.mean + 3*base.grat.sigma, 5)\n   or rwr_rate  > max(base.rwr.mean\
      \ + 3*base.rwr.sigma, 5)\n| emit alert(segment=segment, grat=grat_rate, reply_without_request=rwr_rate)"
- question: '[Collection] LSTM/autoencoder model for gratuitous ARP spikes: Can you determine, using the
    ''LSTM/autoencoder model for gratuitous ARP spikes'' (Machine Learning) approach, the following? Whether
    an unsupervised autoencoder ensemble trained on damped-window ARP statistics (gratuitous-ARP volume,
    reply/request ratio, per-segment packet rate, jitter) flags reconstruction-error spikes indicative
    of an ARP-based AiTM, and which top-3 features drove each alert?'
  context: 'Why this matters: For the Collection tactic, ARP-based AiTM may evade fixed thresholds by
    ramping slowly or blending with maintenance activity, so an unsupervised model that learns the normal
    multivariate ARP rhythm can catch deviations that rules miss. Train an online autoencoder ensemble
    (Kitsune-style) on damped-window ARP statistics aggregated in 1-minute intervals -- gratuitous-ARP
    volume, reply/request ratio, per-segment packet rate, and jitter -- and flag reconstruction-error
    spikes; the Kitsune dataset explicitly contains an ARP MitM scenario, validating this for AiTM. Critically,
    each alert must list the top-3 contributing features (e.g., gratuitous-ARP rate, IP-MAC churn, reply-without-request
    ratio) via feature attribution so analysts can triage the reason rather than receive a bare anomaly
    score. A positive result -- a reconstruction-error spike attributed to ARP-churn features -- warrants
    pivoting to the implicated segment and MACs and correlating with the symbolic-logic checks. A negative
    result lowers suspicion of ARP-based AiTM but says nothing about proxy- or certificate-based interception
    covered by the other questions. Citations: [Kitsune: An Ensemble of Autoencoders for Online Network
    Intrusion Detection](https://arxiv.org/abs/1802.09089); [xNIDS: Explaining Deep Learning-based Network
    Intrusion Detection Systems](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode (autoencoder ensemble)
    query: "features = damped_window(arp.log, 1m): [grat_arp_volume, reply_request_ratio,\n          per_segment_pkt_rate,\
      \ jitter, ip_mac_churn]\nmodel = KitsuneEnsemble.fit(normal_arp_features)   # offline/online\nscore\
      \ = model.reconstruction_error(live_features)\nwhere score > anomaly_threshold\n| emit alert(segment=segment,\
      \ score=score, top3=shap_topk(features,3))"
- question: '[Collection] Unapproved proxy hop in communication path: Can you determine, using the ''Unapproved
    proxy hop in communication path'' (Symbolic Logic) approach, the following? Whether a connection from
    a critical ICS asset A to an IP B that is NOT an approved proxy/gateway/data diode is immediately
    (within ~1 second) followed by a connection from B to a known partner C of A, or whether any proxy_host
    in Zeek http.log is off the approved allowlist, indicating an interposed intermediary?'
  context: 'Why this matters: Under the Collection tactic, an adversary can interpose an unauthorized
    proxy/relay so that traffic that should flow A->C is silently rerouted A->B->C, giving the attacker
    full block/log/modify/inject control. Codify the legitimate communication paths and approved intermediaries
    (data diodes, firewalls, gateways) as explicit allow/deny specifications per critical ICS protocol
    (Modbus, DNP3, IEC 61850). Using Zeek conn.log, trigger when a connection from critical asset A to
    an unapproved IP B is followed within 1 second by a B-to-C connection where C is a known partner of
    A; enforce protocol semantics (valid function codes, command/response pairing, addressing) so injected
    or out-of-spec messages traversing the new hop are flagged deterministically. Correlate with Zeek
    http.log to alert on any proxy_host not on the approved allowlist. A positive result -- a matched
    A->B->C relay through an unapproved node -- is high-confidence evidence of an interposed AiTM; pivot
    to B''s host identity, switch port, and the protocol traffic it is relaying. A negative result reduces
    suspicion of a proxy hop but should be corroborated with timing-drift and graph anomaly checks, since
    a transparent bridge may not create a distinct second flow. Citations: [On Specification-based Cyber-Attack
    Detection in Smart Grids](https://arxiv.org/abs/2209.04354); [Distributed Intrusion Detection System
    using Semantic-based Rules for SCADA in Smart Grid](https://arxiv.org/abs/2412.07917).'
  answer_sources: &id002
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Network backbone switches within the PCN, firewalls/routers at PCN-DMZ/Enterprise boundaries,
    SCADA servers, Historian servers, network taps/sensors deployed at critical communication choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: 'spec = APPROVED_PATHS  // per-protocol allow/deny: Modbus, DNP3, IEC61850

      from conn.log as f1 where f1.orig in CRITICAL_ASSETS and f1.resp == B and B not in APPROVED_INTERMEDIARIES

      join conn.log as f2 on f2.orig == B and (f2.ts - f1.ts) <= 1s and f2.resp in partners_of(f1.orig)

      | emit alert(reason="unapproved A->B->C relay", A=f1.orig, B=B, C=f2.resp)

      also from http.log where proxy_host not in PROXY_ALLOWLIST | emit alert(proxy=proxy_host)'
- question: '[Collection] RTT, timing-phase and byte-distribution drift: Can you determine, using the
    ''RTT, timing-phase and byte-distribution drift'' (Statistical Method) approach, the following? Whether
    a critical path (e.g., HMI-to-PLC) shows round-trip-time deviation >3 sigma, automaton/phase violations
    (missing, delayed, extra, or reordered messages), a significant byte-distribution shift (Chi-squared),
    or low-probability/injected Modbus request-response pairs consistent with an interposed intermediary?'
  context: 'Why this matters: ICS PLC-to-SCADA traffic is highly periodic and deterministic-finite-automaton
    (DFA) modelable, so an AiTM intermediary inserted under the Collection tactic perturbs timing and message
    ordering even when it forwards traffic faithfully. For each critical path baseline the round-trip
    time, inter-arrival periodicity, and orig_bytes vs resp_bytes from Zeek conn.log, then alert on RTT
    deviation greater than 3 sigma, on automaton/phase violations (missing, delayed, extra, or reordered
    messages), or on a significant byte-distribution shift measured by Chi-squared. Layer probabilistic
    scoring of Modbus transactions to flag low-probability or injected request-response pairs introduced
    by the intermediary. A positive result -- timing or phase anomalies on a normally clockwork path --
    suggests an interposed device adding latency or reordering frames; pivot to the path endpoints and
    look for a relay. A negative result is reassuring for that path but should be combined with the connection-state
    and graph signals, since a high-performance relay may keep timing within tolerance. Citations: [Temporal
    Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068); [Probability Risk Identification
    Based Intrusion Detection System for SCADA Systems](https://arxiv.org/abs/1711.02826).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "from conn.log where path in CRITICAL_PATHS  // e.g. HMI->PLC\nbase = baseline(path): [rtt,\
      \ inter_arrival_period, orig_bytes, resp_bytes, DFA_phase]\nwhere abs(rtt - base.rtt.mean) > 3*base.rtt.sigma\n\
      \   or dfa_violation(phase)  // missing/delayed/extra/reordered\n   or chi_squared(byte_dist, base.byte_dist)\
      \ significant\n   or modbus_txn_probability(req,resp) < p_low\n| emit alert(path=path, reason=\"\
      timing/phase/byte drift\")"
- question: '[Collection] Blocked/failed connection and retransmit rate (failure-mode): Can you determine,
    using the ''Blocked/failed connection and retransmit rate (failure-mode)'' (Statistical Method) approach,
    the following? Whether a critical path shows an abnormal connection-state distribution -- elevated
    Zeek conn.log S0/REJ/RSTO states, TCP retransmissions, or half-open/reset counts per minute above
    mean + 3 sigma (or a static floor) -- together with drops in reporting frequency, consistent with
    AiTM interception?'
  context: 'Why this matters: AiTM interception under the Collection tactic frequently breaks or resets
    connections as the attacker injects, blocks, or fumbles the relayed stream, producing abnormal connection
    state. Track per critical path the Zeek conn.log conn_state distribution (S0/REJ/RSTO), the TCP retransmission
    rate, and half-open/reset counts per minute, and alert when failed or reset connections exceed mean
    + 3 sigma over a 7-day baseline or a static floor (for example, more than 10 resets/min on a normally
    clean link). Pair this with drops in reporting frequency detected as matrix-profile discords for corroboration,
    since blocked reporting is a documented AiTM follow-on. A positive result -- a surge of resets/retransmits
    with a reporting gap -- indicates probable interception on that link; pivot to the endpoints and the
    timing of the first failures. A negative result helps rule out a disruptive relay but not a clean,
    transparent bridge, so corroborate with the proxy-hop and certificate checks. Citations: [Probability
    Risk Identification Based Intrusion Detection System for SCADA Systems](https://arxiv.org/abs/1711.02826);
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "from conn.log where path in CRITICAL_PATHS group by path, bin(1m)\n  fail = count(conn_state\
      \ in [\"S0\",\"REJ\",\"RSTO\"]) + reset_count + half_open\n  retx = tcp_retransmission_rate\nbase\
      \ = rolling_baseline(7d, by=path)\nwhere fail > max(base.fail.mean + 3*base.fail.sigma, 10)\ncorroborate\
      \ matrix_profile_discord(reporting_frequency[path])\n| emit alert(path=path, resets=fail, retransmits=retx)"
- question: '[Collection] Graph anomaly detection for new hops: Can you determine, using the ''Graph anomaly
    detection for new hops'' (Machine Learning) approach, the following? Whether modeling the PCN as a
    directed graph (nodes=IPs, edges=Zeek conn.log connections) and applying inductive node-level graph
    learning (GraphSAGE) flags the insertion of a new intermediary node into a previously direct, well-established
    path between critical assets, and which top-3 features drove each alert?'
  context: 'Why this matters: The structural signature of Collection via an interposed device is a new
    node inserted into a path that was historically direct and stable, which graph learning detects even
    when per-flow features look normal. Model the PCN as a directed graph (nodes=IPs, edges=Zeek conn.log
    connections) and apply inductive node-level graph learning (GraphSAGE) to flag structural anomalies
    such as insertion of a new intermediary node into a previously direct, well-established path between
    critical assets. Attribute each alert to the responsible nodes/edges and surface the top-3 contributing
    features (new edge, degree change, path elongation) in the alert text so analysts can triage. A positive
    result -- a newly inserted node lengthening a critical path -- is strong corroboration of an AiTM
    relay; pivot to the new node''s identity and the assets whose path it now intercepts. A negative result
    lowers suspicion of a topology-changing relay but should be combined with timing and connection-state
    signals, since a layer-2 bridge may not appear as a new graph node. Citations: [ThreaTrace: Detecting
    and Tracing Host-based Threats in Node Level Through Provenance Graph Learning](https://arxiv.org/abs/2111.04333);
    [xNIDS: Explaining Deep Learning-based Network Intrusion Detection Systems](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode (GraphSAGE)
    query: 'G = build_directed_graph(conn.log)  // nodes=IPs, edges=connections

      model = GraphSAGE.fit(historical_G)

      for node in live_G: anomaly = model.node_anomaly(node)

      where anomaly and inserted_into_previously_direct_path(node, CRITICAL_ASSETS)

      | emit alert(node=node, top3=["new_edge","degree_change","path_elongation"])'
- question: '[Collection] Certificate/JA4 fingerprint mismatch or invalid status: Can you determine, using
    the ''Certificate/JA4 fingerprint mismatch or invalid status'' (Symbolic Logic) approach, the following?
    Whether any encrypted session to a critical ICS asset uses a certificate whose SHA1 fingerprint or
    JA4X/JA4S fingerprint is off the known-good baseline, whose validation_status is not ''ok'', or that
    is self-signed for a service that should be CA-signed -- all signatures of a TLS interception proxy?'
  context: 'Why this matters: When the Collection target is an encrypted ICS service (EWS, Historian,
    SCADA, VPN), a TLS interception proxy must present its own certificate and TLS stack to the client,
    changing the server and certificate fingerprints the client sees. Maintain a baseline of known-good
    certificate fingerprints (SHA1) plus server/certificate JA4S/JA4X fingerprints for every encrypted
    service on critical ICS assets. Using Zeek x509.log and ssl.log, raise a high-severity alert when
    a connection to a critical asset uses a certificate whose fingerprint or JA4X is off-baseline, whose
    validation_status is not ''ok'', or that is self-signed for a service that should be CA-signed. A
    positive result -- an off-baseline or invalid certificate on a critical encrypted service -- is high-confidence
    evidence of TLS interception; pivot to the client, server, and the presenting IP to locate the proxy.
    A negative result reduces suspicion of TLS-based AiTM but not of plaintext-protocol interception covered
    by the ARP and flow questions. Citations: [JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4).'
  answer_sources: &id003
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Network taps/sensors at the perimeter of the PCN, network gateways, SCADA servers, Historian
    servers, remote access VPN concentrators, Engineering Workstations (EWS) that establish encrypted
    sessions.'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: "from ssl.log join x509.log where resp_h in CRITICAL_ICS_ASSETS\nwhere cert.sha1 not in CERT_BASELINE[service]\n\
      \   or ja4x not in JA4X_BASELINE[service] or ja4s not in JA4S_BASELINE[service]\n   or validation_status\
      \ != \"ok\"\n   or (is_self_signed and service in CA_SIGNED_REQUIRED)\n| emit alert(severity=high,\
      \ server=resp_h, fp=cert.sha1, status=validation_status)"
- question: '[Collection] High-entropy certificate subjects and TLS error rate (failure-mode): Can you
    determine, using the ''High-entropy certificate subjects and TLS error rate (failure-mode)'' (Statistical
    Method) approach, the following? Whether newly observed certificates on critical assets have subject/issuer
    common-name fields whose Shannon entropy exceeds the 99th percentile of historical certs (algorithmically
    generated), and whether the per-asset rate of TLS handshakes with validation_status != ''ok'' exceeds
    mean + 3 sigma over the 30-day average?'
  context: 'Why this matters: Interception proxies used in Collection often auto-generate certificates
    with random, non-human-readable subject/issuer names and produce bursts of validation failures as
    clients reject the substituted certificate. For newly observed certificates in Zeek x509.log, compute
    the Shannon entropy of subject/issuer common-name fields and alert above the 99th percentile of historical
    certs, catching algorithmically generated names. Separately profile the (State) failure signal: the
    rate of TLS handshakes with validation_status != ''ok'' per critical asset, alerting when it exceeds
    mean + 3 sigma over the 30-day rolling average. Derive the per-asset sigma from baselines so a service
    with naturally messy certs is not over-alerted. A positive result -- high-entropy cert names or a
    TLS-error burst on a critical asset -- suggests an interception proxy; pivot to the cert details and
    the clients seeing the failures. A negative result helps rule out a sloppy interception proxy but
    not a well-provisioned one with a valid-looking certificate, so corroborate with the fingerprint-baseline
    check. Citations: [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "from x509.log where first_seen and resp_h in CRITICAL_ICS_ASSETS\n  ent = shannon_entropy(cert.subject_cn)\
      \ ; ient = shannon_entropy(cert.issuer_cn)\nwhere ent > p99(hist_cert_entropy) or ient > p99(hist_cert_entropy)\n\
      | emit alert(reason=\"algorithmically-generated cert name\", server=resp_h)\nfrom ssl.log group\
      \ by resp_h, bin(1m): err = rate(validation_status != \"ok\")\nwhere err > base30d[resp_h].mean\
      \ + 3*base30d[resp_h].sigma | emit alert(server=resp_h, tls_err=err)"
- question: '[Collection] One-class/autoencoder model for certificate anomalies: Can you determine, using
    the ''One-class/autoencoder model for certificate anomalies'' (Machine Learning) approach, the following?
    Whether a one-class SVM or autoencoder trained on feature vectors from baselined good certificates
    (key length, signature algorithm, validity period, extension count, JA4X components) flags outliers
    or high reconstruction error during live monitoring, with each alert ranking the top-3 contributing
    features?'
  context: 'Why this matters: A capable Collection interception proxy may produce a certificate that passes
    individual rules yet is collectively anomalous compared with the asset''s normal certificates, which
    a multivariate outlier model can catch. Train a one-class SVM or autoencoder on feature vectors from
    baselined good certificates -- key length, signature algorithm, validity period, extension count,
    and JA4X components -- and flag outliers or high reconstruction error during live monitoring. Use
    SHAP-style attribution so each flagged certificate alert ranks the top-3 contributing features (for
    example, issuer entropy, short validity, unusual extension set) rather than emitting a bare score,
    enabling fast triage. A positive result -- a certificate outlier attributed to suspicious features
    -- warrants pivoting to the cert, the server presenting it, and the affected clients, and correlating
    with the fingerprint and entropy checks. A negative result lowers suspicion of certificate-based AiTM
    but should be combined with the network-flow and ARP questions for a complete picture. Citations:
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374);
    [Explainable Anomaly Detection for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode (one-class SVM / autoencoder)
