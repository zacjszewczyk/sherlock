name: 'T0865: Spearphishing Attachment'
id: 3eda821d-fcc1-493f-b415-62206fc3352e
description: 'Investigate whether an adversary is attempting to gain initial access to the ICS/OT environment
  through spearphishing attachments. This playbook helps an analyst hunt the full kill chain of a malicious-attachment
  campaign: (1) inbound delivery, where a high-value ICS recipient (e.g., members of ICS_Engineers or
  OT_Operators) receives an external email carrying a high-risk attachment (executables, scripts, macro-enabled
  Office documents, archive/ISO containers, or ICS project files such as .ACD/.PCV/.S7P), often with ICS-themed
  lures (PLC, HMI, SCADA, firmware, vendor names) and frequently from spoofed or authentication-failing
  senders; and (2) post-delivery execution, where opening the attachment causes a productivity or mail
  application to spawn an anomalous interpreter/LOLBin child process, drop a new executable or script
  under user-writable paths, and initiate outbound network egress shortly after receipt. The questions
  combine deterministic symbolic-logic detections (watchlists, SPF/DMARC enforcement, MIME/extension mismatch,
  Office child-process rules), statistical baselining (sender rarity, campaign bursts, filename/subject
  entropy, authentication-failure profiling, egress anomalies), and machine-learning classifiers (explainable
  phishing scoring, static PE malware classification, process-chain anomaly scoring) so a SOC analyst
  can confirm targeting, delivery, and execution.'
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did an external sender deliver an email carrying a high-risk or ICS-specific attachment to
    a watchlisted high-value ICS recipient (e.g., a member of ICS_Engineers or OT_Operators), particularly
    one whose hash matches threat intelligence or whose filename/subject contains ICS lure keywords?
  context: 'This is the primary delivery indicator for a spearphishing-attachment intrusion against the
    OT enterprise. Maintain three watchlists: high-value ICS personnel addresses and AD groups (ICS_Engineers,
    OT_Operators); high-risk extensions including executables (.exe, .scr, .com, .pif), scripts (.js,
    .jse, .vbs, .wsf, .hta), macro-enabled Office (.docm, .xlsm, .pptm), containers (.iso, .img, .zip,
    .rar, .7z, .lnk), and ICS project files (.ACD, .PCV, .S7P, .ap16); and ICS lure keywords (PLC, HMI,
    firmware, SCADA, vendor names, project codes). Join Zeek smtp.log to files.log on the ''fuid'' to
    attribute an attachment to its delivering message. A hit on known-bad TI is an immediate high-confidence
    indicator; a high-risk MIME/extension combined with a lure keyword to a watchlisted recipient strongly
    suggests ICS-targeted social engineering as documented in the CISA AA21-201A pipeline campaign. A
    positive result warrants endpoint review of the recipient host for execution; a negative result reduces
    likelihood of an active delivery against that recipient set.'
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  smtp = load smtp.log; files = load files.log\n  join smtp, files on fuid\n  where rcpt\
      \ in WATCHLIST_RECIPIENTS and is_external(mailfrom)\n  and (file.md5 in TI_BADHASH\n       or ((file.mime_type\
      \ in HIGHRISK_MIME or ext(file.filename) in HIGHRISK_EXT)\n           and contains_any(lower(subject+\"\
      \ \"+file.filename), ICS_KEYWORDS)))\n  emit alert priority=high"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=email recipient IN [ICS_Engineers, OT_Operators] sender_external=true\n  | where\
      \ attachment_hash IN ti_badhash\n      OR (match(attachment_ext, HIGHRISK_EXT) AND match(subject.\"\
      \ \".attachment_name, ICS_KEYWORDS))\n  | eval severity=\"high\" | table _time,sender,recipient,subject,attachment_name,attachment_hash"
- question: Did an attachment-bearing email destined for a watchlisted ICS recipient fail or misalign
    SPF/DMARC authentication, or present multiple/ambiguous From headers or a MAIL FROM (RFC5321) versus
    From (RFC5322) domain mismatch indicating spoofing?
  context: Email authentication is the deterministic floor for spotting forged senders. Alert when an
    attachment-bearing message to a watchlisted ICS recipient fails or is misaligned under SPF (RFC 7208)
    or DMARC (RFC 7489). Because some providers still deliver spoofed mail that nominally passes (Hu &
    Wang) and MTA/client parser inconsistencies can forge passing mail (Composition Kills), additionally
    re-parse and normalize headers and flag messages with multiple or ambiguous From headers, or an RFC5321
    envelope-from domain that does not match the RFC5322 header From domain. Record the authentication
    verdict (pass/fail/none) on every alert so the state is preserved for triage and correlation. A failure
    or mismatch on an ICS-targeted attachment email is a strong spoofing signal consistent with adversary
    impersonation of vendors or internal staff during initial access.
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  smtp = load smtp.log\n  where has_attachment and rcpt in WATCHLIST_RECIPIENTS\n  let\
      \ spf=spf_result, dmarc=dmarc_result\n  if spf in {fail,softfail,none} or dmarc in {fail,none}\n\
      \     or count(from_headers)>1 or domain(mailfrom)!=domain(header_from)\n  emit alert(auth_verdict=spf+\"\
      /\"+dmarc)"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=email has_attachment=true recipient IN WATCHLIST\n  | where spf_result!=\"pass\"\
      \ OR dmarc_result!=\"pass\"\n      OR header_from_domain!=envelope_from_domain OR from_header_count>1\n\
      \  | eval auth_verdict=spf_result.\"/\".dmarc_result"
- question: Does any delivered attachment exhibit a MIME/magic-versus-extension mismatch, a double extension,
    or a high-risk file embedded inside a container (ISO/IMG/ZIP) - classic gateway/MotW bypass patterns
    for spearphishing attachments aimed at OT staff?
  context: Adversaries disguise payloads to evade gateways and Mark-of-the-Web protections. Using Zeek
    files.log, alert when an attachment's declared extension does not match its detected MIME/magic bytes
    (for example a .pdf that is actually application/x-dosexec), when it carries a double extension (.pdf.exe),
    or when it is a container (.iso/.img/.zip) whose embedded file is a high-risk executable or script
    type. Combine with the ICS keyword and extension watchlists from CISA AA21-201A. A mismatch on a message
    to an OT recipient is a deliberate evasion indicator and should raise confidence that the attachment
    is malicious even when the surface extension looks benign. A negative result means the attachment's
    container/type is consistent and lowers (but does not eliminate) concern.
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files = load files.log; join smtp on fuid\n  where rcpt in WATCHLIST_RECIPIENTS\n  if\
      \ mime_type != mime_for_ext(ext(filename))      # declared vs magic mismatch\n     or has_double_extension(filename)\n\
      \     or (is_container(filename) and embedded_type(file) in HIGHRISK_MIME)\n  emit alert(reason=\"\
      mime_ext_mismatch\")"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=email_attachments\n  | eval mismatch=if(declared_mime!=detected_mime,1,0)\n  |\
      \ eval dbl=if(like(name,\"%.%.exe\") OR like(name,\"%.%.scr\"),1,0)\n  | where mismatch=1 OR dbl=1\
      \ OR (container=1 AND match(embedded_type,HIGHRISK))"
- question: Did a high-risk attachment arrive from a never-before-seen or statistically rare external
    sender domain for the targeted OT recipient group, or did multiple ICS recipients receive similar
    attachments within a short burst suggesting a coordinated campaign?
  context: 'Targeted campaigns originate from senders that deviate from an organization''s normal correspondence
    and often arrive as bursts. Build a 90-day rolling baseline of external sender-domain to recipient-group
    communication frequency. Using a Directed-Anomaly-Scoring approach (Ho et al.), alert when a high-risk
    attachment arrives from a never-before-seen sender domain or one below the 1st percentile of observed
    frequency for that OT recipient group, ranking candidates by combined sender-rarity and display-name
    novelty to keep daily alert volume within a review budget. Add burst detection: flag when at least
    N (start N=3 and tune) watchlisted recipients receive similar attachments (same hash/filename/subject)
    within 24 hours, reflecting the campaign clustering measured by Simoiu et al. A rare-sender or burst
    hit against OT staff is a strong indicator of deliberate targeting rather than commodity spam.'
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = stats count by sender_domain, recipient_group over last 90d\n  | inbound\
      \ where attachment_risk=high and recipient_group in OT_GROUPS\n  | eval rarity = pct_rank(sender_domain\
      \ freq within recipient_group)\n  | where unseen(sender_domain) OR rarity < 0.01\n  | sort by (rarity\
      \ + displayname_novelty) desc | head review_budget"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  inbound attachment_risk=high recipient IN WATCHLIST\n  | bin _time span=24h\n  | stats\
      \ dc(recipient) as recips by _time, coalesce(att_hash,att_name,subject)\n  | where recips >= 3 \
      \ # campaign burst"
- question: Does an attachment filename or email subject show abnormally high Shannon entropy (randomized/obfuscated
    naming), or does a known/internal sender deviate from its historical composition profile (X-Mailer/MUA,
    MIME structure, header layout, send-hour) in a way consistent with a compromised genuine account?
  context: Two complementary statistical signals are at play. First, compute Shannon entropy of the attachment
    filename (files.log) and subject (smtp.log) and alert when either exceeds the 99th percentile of its
    baseline, indicating randomized or obfuscated naming common to automated payload generation. Second,
    for trusted internal or known senders, baseline per-sender composition - mail client/X-Mailer, MIME
    structure, header layout, and typical send-hour - and flag deviations that suggest a compromised-but-genuine
    account (per Stringhini & Thonnard and the stylometric baselines of Dewan et al.). This is critical
    because internally originated spoofed or account-takeover mail bypasses SPF/DKIM and must be caught
    via recipient-profile and sender-profile anomaly (Ho et al. lateral phishing). A positive result on
    either axis raises suspicion of an obfuscated payload or a hijacked trusted account being used to
    reach OT staff.
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  inbound with attachment\n  | eval fn_entropy=shannon(attachment_name), subj_entropy=shannon(subject)\n\
      \  | where fn_entropy > pctl99(baseline_fn_entropy)\n       OR subj_entropy > pctl99(baseline_subj_entropy)"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  sender_profile = baseline(xmailer,mime_struct,header_layout,send_hour) by sender over\
      \ 90d\n  | inbound where sender in KNOWN_SENDERS\n  | eval dev = profile_distance(this_msg, sender_profile)\n\
      \  | where dev > threshold  # possible account takeover"
- question: Is there a sudden spike in authentication failures (DMARC/SPF), gateway-quarantined/blocked
    attachments, or rejected messages targeting OT staff, which often precedes or accompanies a successfully
    delivered message in the same campaign?
  context: 'Failure-mode signals should be profiled as features, not discarded. Track, over a rolling
    window, per-sender-domain and per-recipient-group rates of DMARC/SPF failures, gateway-quarantined
    or blocked attachments, and rejected messages. Alert on a sudden spike in authentication failures
    or blocked high-risk attachments aimed at OT staff. Such spikes frequently precede or accompany a
    successful delivery within the same campaign as the adversary iterates on evasion, and widespread
    weak-policy delivery is documented by Hu & Wang. A spike is an early-warning signal: even if every
    blocked message was stopped, it indicates active targeting and should trigger a hunt for any message
    that did get through to the same recipient group.'
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  email events last 90d\n  | bin _time span=1h\n  | stats sum(eval(auth_fail OR att_blocked\
      \ OR rejected)) as fails by _time, recipient_group, sender_domain\n  | eventstats avg(fails) as\
      \ mu, stdev(fails) as sd by recipient_group\n  | where fails > mu + 3*sd and recipient_group in\
      \ OT_GROUPS"
- question: When scored by an explainable supervised phishing classifier over email metadata, does any
    inbound message to a watchlisted ICS recipient exceed a critical phishing probability (>0.90), and
    what top contributing features drive that score?
  context: A supervised classifier (gradient boosting / random forest) scores phishing probability per
    inbound message using features such as sender-domain rarity/age, SPF/DKIM/DMARC results, ICS-keyword
    density, attachment MIME type and filename entropy, container/double-extension flags, and 90-day sender-recipient
    frequency. Alert at critical severity when the probability exceeds 0.90 for a watchlisted recipient,
    and require the alert to surface the top-3 contributing features (e.g., 'new sender domain', 'macro-enabled
    attachment', 'DMARC fail') following the explainability of ChatSpamDetector, the DistilBERT/LIME approach,
    and the interpretable platform of Al-Subaiey et al.; optionally fuse an LLM-generated natural-language
    rationale for triage. The classifier captures combinations of weak signals that no single rule would
    flag; the required feature attribution lets the analyst validate the verdict against the raw email
    rather than trusting a black box.
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [sender_domain_rarity, sender_domain_age, spf, dkim, dmarc,\n           \
      \  ics_keyword_density, attach_mime, filename_entropy,\n             container_flag, double_ext_flag,\
      \ sender_recipient_freq_90d]\n  p = phish_model.predict_proba(features)\n  if p > 0.90 and recipient\
      \ in WATCHLIST:\n      alert(prob=p, top3=explain(features))  # LIME/SHAP attribution"
- question: When PE/executable attachments (including those extracted from archives or ISOs) are scored
    offline by a static malware classifier, do any addressed to OT recipients classify as malicious, and
    what static features drive the verdict?
  context: For executable or PE-bearing attachments - including files extracted from archives and ISO/IMG
    containers - score them offline with a static classifier trained on first-party file features such
    as imports, section and overall entropy, byte and string histograms, and header anomalies, using the
    EMBER feature set and a LightGBM baseline. Alert when an attachment to an OT recipient classifies
    as malicious and surface the top contributing static features (e.g., high section entropy, suspicious
    imports) in the alert. Retain deterministic hash/AV matching in parallel so known-bad is never missed.
    This catches novel or repacked payloads that lack TI signatures; a malicious verdict on an attachment
    to an engineer or operator is a strong execution-precursor indicator warranting endpoint isolation
    review.
  answer_sources:
  - Zeek smtp.log
  - Zeek files.log
  - Zeek dns.log
  - Zeek x509.log
  - Active Directory Logs
  - 'NAI: Corporate Email Gateway, OT Network Mail Relay (if present), Corporate-to-OT DMZ, Engineering
    Workstations (local email client logs), Control System Network (for internal email traffic if applicable)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  for att in attachments where is_pe(att) or extracted_pe(att):\n      feats = ember_features(att)\
      \   # imports, entropy, byte/string hist, header\n      score = lgbm_static_model.predict(feats)\n\
      \      if score == malicious and recipient in OT_GROUPS:\n          alert(top_features=explain(feats))\n\
      \      if att.hash in TI_BADHASH or av_hit(att): alert(reason=\"known_bad\")"
- question: After an attachment was delivered, did a productivity or mail application (WINWORD/EXCEL/POWERPNT/OUTLOOK
    or an archive/ISO mount handler) spawn a command interpreter or LOLBin (cmd, powershell, wscript,
    cscript, mshta, regsvr32, rundll32, certutil) on an engineering workstation or OT-adjacent host?
  context: This is the highest-fidelity confirmation that an opened attachment achieved execution (User
    Execution, T0863). Alert when a productivity or mail application (WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE,
    OUTLOOK.EXE, or an archive/ISO mount handler) spawns a command interpreter or LOLBin (cmd.exe, powershell.exe,
    wscript.exe, cscript.exe, mshta.exe, regsvr32.exe, rundll32.exe, certutil.exe) per Sysmon Event ID
    1 or Windows Security 4688, implementing the SigmaHQ Office child-process rule. Maintain an environment-specific
    benign parent-child allowlist to tune false positives - do not delete the rule. On engineering workstations
    and operator HMIs with reachability to OT networks, such a chain immediately following email receipt
    is a strong indicator that initial access has succeeded and should trigger host containment and lineage
    review.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Windows Security Event ID 4688
  - Sysmon Event ID 11 (File Create)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Engineering Workstations, Operator HMIs with email/document access, Corporate-to-OT DMZ jump
    hosts, any host running Office/Outlook with reachability to OT networks'
  range: Last 90 days; pivot to a +/- 30 minute window around the related attachment email receipt
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (Sysmon EID=1 OR Security EID=4688)\n  | where lower(ParentImage) in {winword.exe,excel.exe,powerpnt.exe,outlook.exe,\
      \ archive/iso handlers}\n      and lower(Image) in {cmd.exe,powershell.exe,wscript.exe,cscript.exe,mshta.exe,regsvr32.exe,rundll32.exe,certutil.exe}\n\
      \  | where NOT allowlisted(ParentImage,Image,CommandLine)\n  | eval severity=\"high\""
- question: Within a short window of an attachment-bearing email reaching a user, did an Office or mail-client
    process write a new executable or script (.exe/.dll/.js/.vbs/.hta/.lnk) under a user-writable path
    such as %TEMP%, %APPDATA%, or Downloads?
  context: 'Dropping a payload to disk is a common post-open step. Correlate Sysmon Event ID 11 file-create
    events for new .exe/.dll/.js/.vbs/.hta/.lnk files written under user-writable paths (%TEMP%, %APPDATA%,
    Downloads) by an Office or mail-client process within a short window (<=5 minutes) of an attachment-bearing
    email to that user - joining to Zeek smtp.log by recipient and time. Include Volume context in the
    alert: the byte size and write count of the dropped payload. A new executable/script written by WINWORD
    or OUTLOOK moments after email receipt is strong evidence that the attachment executed and staged
    a second-stage payload, justifying immediate endpoint review on engineering workstations and OT-adjacent
    hosts.'
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Windows Security Event ID 4688
  - Sysmon Event ID 11 (File Create)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Engineering Workstations, Operator HMIs with email/document access, Corporate-to-OT DMZ jump
    hosts, any host running Office/Outlook with reachability to OT networks'
  range: Last 90 days; correlate within <=5 minutes of related email receipt
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  Sysmon EID=11\n  | where lower(Image) in {winword.exe,excel.exe,powerpnt.exe,outlook.exe}\n\
      \      and ext(TargetFilename) in {exe,dll,js,vbs,hta,lnk}\n      and path(TargetFilename) in {%TEMP%,%APPDATA%,Downloads}\n\
      \  | join recipient,_time [ Zeek smtp.log has_attachment=true ] within 5m\n  | table _time,host,Image,TargetFilename,file_size,write_count"
- question: Did a process whose lineage traces back to a document or mail application initiate an outbound
    network connection - especially to a new external destination with no baseline of activity - shortly
    after the related email was received?
  context: Post-execution egress is the bridge from initial access to command-and-control. Flag an outbound
    connection (Sysmon Event ID 3 / Zeek conn.log) initiated by a process whose lineage traces to a document
    or mail application and which has no baseline of network activity, especially to a new external destination
    shortly after email receipt. Report Volume (bytes out/in), Frequency (connections per minute, beacon
    regularity), and State (connection success versus blocked/failed) so that failed or blocked C2 attempts
    are profiled as a distinct signal rather than discarded. On OT-adjacent hosts, an Office-descendant
    process reaching out to an unfamiliar external endpoint is a high-severity indicator; even blocked
    attempts confirm that execution occurred and that the payload tried to call home.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Windows Security Event ID 4688
  - Sysmon Event ID 11 (File Create)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Engineering Workstations, Operator HMIs with email/document access, Corporate-to-OT DMZ jump
    hosts, any host running Office/Outlook with reachability to OT networks'
  range: Last 90 days; pivot to a +/- 30 minute window around related email receipt
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn = load conn.log; join host process lineage from Sysmon EID=3/EID=1\n  where root_ancestor(process)\
      \ in {winword,excel,powerpnt,outlook}\n     and is_external(resp_h) and unseen(host -> resp_h)\n\
      \  emit alert(bytes_out=orig_bytes, bytes_in=resp_bytes,\n             freq=conns_per_min, state=conn_state)\
      \  # incl S0/REJ blocked"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  Sysmon EID=3\n  | where ancestor(Image) in OFFICE_MAILAPPS and dest_is_external=true\n\
      \  | where new_dest_for_host=true\n  | stats sum(bytes_out),sum(bytes_in),count by host,dest,conn_state"
- question: When process-creation chains are scored by a supervised anomaly model (parent-child name probabilities,
    command-line tokens, graph context), do any rare Office->interpreter->network sequences appear that
    would follow user execution of a malicious attachment, and what features drive the score?
  context: A machine-learning model generalizes beyond fixed rules. Score process-creation chains with
    a supervised model over parent-child name probabilities, command-line tokens, and graph context as
    in ProblemChild (XGBoost), surfacing rare Office->interpreter->network sequences that follow user
    execution of a malicious attachment. The alert must list the top-3 contributing features (e.g., 'rare
    parent-child', 'encoded PowerShell command', 'new network egress') and should run in parallel with
    the deterministic Sigma child-process rule rather than replacing it. This catches obfuscated or LOLBin-creative
    execution chains that evade static signatures; the required feature attribution lets the analyst confirm
    the chain against raw telemetry. A high-anomaly Office-rooted chain on an OT-adjacent host is a strong
    execution indicator warranting containment.
  answer_sources:
  - Sysmon Event ID 1 (Process Creation)
  - Windows Security Event ID 4688
  - Sysmon Event ID 11 (File Create)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - Zeek smtp.log
  - 'NAI: Engineering Workstations, Operator HMIs with email/document access, Corporate-to-OT DMZ jump
    hosts, any host running Office/Outlook with reachability to OT networks'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  chain = build_process_tree(Sysmon EID=1)\n  feats = [parent_child_name_prob, cmdline_tokens,\
      \ graph_context, net_egress_flag]\n  score = problemchild_xgb.predict_proba(feats)\n  if score >\
      \ threshold and root(chain) in OFFICE_MAILAPPS:\n      alert(top3=explain(feats))  # run alongside\
      \ Sigma rule, not instead"
