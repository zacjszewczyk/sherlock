      \ > 0.85:\n    residual = abs(observed_next_state - CNN.predict_next_state())\n    alert(high, shap=top3_features(features),\
      \ confirm=residual>thr)"
- question: Are any mined process invariants (predicates over correlated sensor/actuator values that must
    always hold during normal operation) being violated at runtime, even when each individual register
    value appears plausible?
  context: Beyond static safe limits, mine deterministic invariants from historian/process logs - predicates
    over correlated sensor/actuator values that must always hold, e.g., motor-current consistent with
    commanded speed, pump-on implies tank-level rising, valve-open implies downstream-flow >0 - and enforce
    them as runtime checks. A damage-inducing command typically breaks at least one invariant even when
    each individual value looks normal, making invariants a powerful complement to threshold rules. Alert
    at high severity on any invariant violation, naming the specific invariant and the tags whose relationship
    broke so analysts can map the alert to physical equipment. Derive the invariant set per site from
    labeled physical-process datasets. Under Impact, an invariant break is strong evidence that the physical
    process has been pushed into an unsafe/inconsistent state by manipulation.
