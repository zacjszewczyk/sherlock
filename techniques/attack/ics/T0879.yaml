name: 'T0879: Damage to Property'
id: 8dbee6e1-da34-42ac-a5fb-4cdea0b24108
description: Investigate whether an adversary has executed actions that caused, or were intended to cause,
  physical damage to operational technology (OT) equipment, infrastructure, and the surrounding environment.
  This playbook helps an analyst hunt for ICS write commands that drive equipment outside documented safe
  physical limits (over-speed, over-pressure, over-temperature), rapid oscillatory actuator cycling indicative
  of mechanical-fatigue attacks, simultaneous conflicting commands to interdependent process tags, and
  sustained 'red zone' operation in historian data without operator acknowledgment. It also correlates
  physical evidence of damage or failure (CMMS work orders, protection-system trips, condition-monitoring
  anomalies, faulted equipment states) with preceding cyber-intrusion indicators such as unauthorized
  write commands, off-hours remote access, suspicious host process executions, and first-seen source IPs.
  Detection blends deterministic safety-matrix and invariant rules, statistical baselines and CUSUM/change-point
  methods, and supervised/unsupervised machine-learning models, with the hard specification rules retained
  as a floor beneath any ML layer because process-based detectors can be evaded by physically-plausible
  spoofing.
