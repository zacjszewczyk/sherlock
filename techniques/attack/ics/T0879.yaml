  range: Last 90 days; baseline 90 days, event-centered correlation +/- 24h
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each tag IN historian_process_data\n  p99 = baseline_percentile(tag, 99, window=90d)\n\
      \  hmax = baseline_max(tag, 90d)\n  IF value > p99 for >30s -> alert(medium)\n  IF value > p99 for\
      \ >5min AND no SCADA ack within 2min -> alert(high)\n  IF value > 1.10*hmax -> alert(critical)\n\
      \  IF rate_of_change(tag) > baseline_rate_mean + 3*sd -> alert(high)\n  cusum = CUSUM(residual =\
      \ value - expected); ALERT IF cusum > bound"
- question: Does a supervised damage-intent classifier label any individual write command or command sequence
    as 'Attack-Intent-Damage' (confidence >0.85), and does an unsupervised process-effect detector confirm
    the predicted physical consequence?
  context: 'Deploy a supervised classifier (Random Forest / Gradient Boosting) trained on labeled normal
    operations versus documented damage-inducing scenarios from testbeds, simulations, or historical incidents.
    Engineer features from ICS protocol logs: written values normalized against safety limits (volume);
    time-series features such as rate-of-change, variance, and oscillation frequency; contextual features
    such as source-IP reputation, time-of-day, presence of a change-management record, and authentication
    success/failure state; and physical-correlation features such as ratios between interdependent parameters
    (motor current vs. speed, heater power vs. system temperature). Classify each command/sequence as
    ''Safe'', ''Unsafe-Non-Malicious'', or ''Attack-Intent-Damage'' and alert on the latter with confidence
    >0.85, attaching the top-3 SHAP-contributing features so analysts triage on named tags rather than
    an opaque score. Complement the command-level model with an unsupervised process-effect detector (e.g.,
    a CNN predicting next sensor/actuator values, thresholding the residual) to catch the physical consequence.
    Keep the deterministic safe-envelope and invariant rules underneath, because ML-only ICS detectors
    are evadable via adversarial sensor perturbation. This supports Impact by flagging intent and effect
    even when raw values look individually plausible.'
