      \     OR EXISTS new_remote_session[ctrl, win]:\n    alert(high, asset=alarm.asset, trigger=alarm.type)"
- question: Do equipment failure rates, protection-system activation counts, or condition-monitoring readings
    (vibration, bearing temperature, acoustic emission) breach their statistical baselines, and do ICS
    write commands target the affected controller within the preceding 6 hours?
  context: Establish a 180-day baseline of failure rates (failures/month from CMMS) and protection-system
    activation rates (activations/day from SCADA alarms), computing mean+3sd thresholds with failure/trip
    rates treated as first-class signals. Monitor weekly aggregated failure rates and daily protection
    activation counts, alerting when thresholds are exceeded, and apply change-point detection (CUSUM/PELT/Bayesian
    online CPD) to catch an abrupt rise that a static threshold would lag. For condition-monitoring systems,
    baseline vibration amplitude, bearing temperature, and acoustic-emission distributions per asset and
    alert when readings exceed the 99.5th percentile for >10 minutes, reinforced with a stateful CUSUM
    on the residual to catch slow stealthy drift toward failure. Cross-correlate each physical anomaly
    with ICS network activity by querying for write commands to the affected controller in the preceding
    6-hour window, escalating priority when such commands - especially from unauthorized sources - are
    present. This statistical layer reveals damage trends and impending failures that single-event rules
    miss, supporting the Impact PIR.
