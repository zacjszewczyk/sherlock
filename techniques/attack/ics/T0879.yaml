      \ OR CUSUM(residual) > bound\nON any physical alert: IF EXISTS ics_write[ctrl, last 6h] -> escalate"
- question: Does a fused multi-modal model that combines cyber-stream and physical-stream anomaly scores
    (accounting for cyber anomalies preceding physical anomalies by 1-24 hours) raise a high-confidence
    'Cyber-Attack-Induced Damage' alert?
  context: 'Develop a multi-modal anomaly framework fusing cyber and physical streams. Cyber stream: extract
    command frequency, command parameter distributions, source-IP entropy, connection patterns, and failed-connection/logon
    rates from ICS network logs, training a One-Class SVM or Isolation Forest on known-good behavior.
    Physical stream: extract process-parameter stability (variance), equipment state-transition frequencies,
    and sensor-health metrics from historian and condition-monitoring data, training a normal-only detector
    (DNN or one-class SVM) that flags deviations without labeled attack data, and use a sequence-to-sequence
    predictor to localize which equipment point is deviating to aid triage. Fusion layer: combine per-stream
    scores (e.g., via Dempster-Shafer evidence theory) accounting for the temporal relationship in which
    cyber anomalies precede physical anomalies by 1-24 hours. Raise high-confidence ''Cyber-Attack-Induced
    Damage'' alerts when the fused score exceeds threshold, attaching SHAP-based top-3 contributing features
    (specific sensors/actuators and cyber indicators) so the alert is explainable. Keep the deterministic
    CMMS/protection-trip correlation rules underneath, since process-based ML can be evaded by physically-plausible
    spoofing. This fused approach is the most comprehensive evidence for the Impact tactic, tying a cyber
    cause to a physical damage effect.'
