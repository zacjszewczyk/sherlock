questions:
- question: Are any ICS write commands setting control parameters to values that exceed the documented
    safe operating limits for the targeted equipment (e.g., motor speed >120% rated RPM, pressure above
    max PSI, temperature above max operating temperature)?
  context: This is the primary specification-based defense for damage-to-property in ICS. Build and maintain
    an equipment safety matrix that, for each critical PLC register or device tag, records the equipment
    type/manufacturer, maximum safe operating values (speed, pressure, temperature, flow), minimum safe
    intervals between state changes, and lists of interdependent parameters that must hold a fixed relationship
    (e.g., heater-on requires cooling-flow >X). Parse Zeek ICS protocol logs (modbus/dnp3/enip/s7comm)
    and cross-reference each write value against the matrix. Because ICS traffic is predictable and physics-constrained,
    rule-based detection yields very low false positives and should be the deterministic floor under any
    ML layer. A positive result is any write that exceeds a safety limit, an oscillatory pattern, or a
    conflicting command pair; enrich by correlating the source IP with Windows authentication (4624) and
    the change-management API for an authorized maintenance window, and escalate if the source is unauthorized
    or the timing is unplanned. This directly serves the Impact tactic because a successful unsafe command
    can mechanically or thermally destroy equipment.
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Historian Process Data
  - SCADA Alarm Logs
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Equipment Asset Database
  - Change Management System Logs
  - 'NAI: Critical Process Equipment Controllers (PLCs, RTUs, IEDs controlling motors, pumps, valves,
    heaters, turbines), Safety Instrumented Systems (SIS), Engineering Workstations (EWS), HMI Systems,
    Process Historian Servers (Purdue Levels 0-2).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FOR each write_cmd IN (zeek_modbus, zeek_dnp3, zeek_enip, zeek_s7comm)\n  matrix = lookup\
      \ safety_matrix[write_cmd.tag]\n  IF write_cmd.value > matrix.max_safe_value\n     OR conflicting(write_cmd,\
      \ recent_writes[tag in matrix.interdependent], window=30s)\n  THEN alert(severity=critical, type='Unsafe\
      \ Control Command',\n            enrich=join(EventID4624 on src_ip), change_mgmt=lookup_window(time))\n\
      \       escalate IF src_ip NOT IN ews_hmi_allowlist OR no_change_ticket"
- question: Is any single actuator or valve receiving rapid alternating on/off or open/close commands
    (5 or more toggles within a 2-second window), or sustained high-frequency cycling across a shift,
    consistent with a mechanical-fatigue attack?
  context: 'Detect oscillatory control patterns by counting alternating state-change commands to the same
    actuator in Zeek protocol logs. Legitimate ICS command cadence is predictable, so 5+ toggles inside
    a 2-second window for one actuator/valve is a strong frequency-based signal of an attempt to wear
    out or break equipment, especially when the source is not an approved HMI/EWS. Track both per-window
    toggle count (frequency) and cumulative toggle count per actuator per shift (volume): a stealthy attacker
    may keep each 2-second window just under threshold while sustaining damaging high-frequency cycling,
    so a separate rolling-count rule should trip on abnormal cumulative cycling. Under the Impact tactic,
    repeated cycling causes cumulative mechanical fatigue that can lead to physical breakdown and downstream
    loss of safety.'
