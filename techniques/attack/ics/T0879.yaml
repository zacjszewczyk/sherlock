      \      alert(high, invariant=inv.name, tags=inv.involved_tags)"
- question: For closed-loop equipment (level, flow, temperature, speed control), does the residual between
    the real process trajectory and a model-predicted reference trajectory trip a nonparametric CUSUM
    detector, indicating false-data injection or unsafe setpoints driving the loop toward a damaging state?
  context: For closed-loop controlled equipment, compute a residual between the real-time process trajectory
    and a model-predicted reference trajectory (model predictive control co-design approach), then feed
    the residual to a nonparametric CUSUM detector to surface false-data injection or unsafe setpoints
    that push the loop toward damaging states. Alert when the CUSUM statistic exceeds its tuned bound
    and report the residual magnitude, the loop/tag involved, and the time since divergence began so the
    alert is immediately actionable. Where no plant model exists, substitute an LSTM forecaster on normal
    multivariate telemetry and threshold the forecasting error. This method catches stealthy manipulation
    that keeps instantaneous values within limits but steers the controlled process toward equipment damage,
    directly addressing the Impact tactic.
  answer_sources:
