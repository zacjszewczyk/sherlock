    query: 'FROM (zeek_modbus, zeek_dnp3, zeek_enip, zeek_s7comm)

      WHERE cmd IN (''on'',''off'',''open'',''close'')

      BUCKET by actuator_tag, window=2s

      COUNT alternating_state_changes AS toggles

      ALERT IF toggles >= 5 AND src_ip NOT IN hmi_ews_allowlist

      -- volume rule:

      ROLLING_COUNT toggles BY actuator_tag PER shift AS cum_toggles

      ALERT IF cum_toggles > shift_baseline_p99'
- question: For each critical equipment controller and its process tags, do real-time operating parameters
    exceed their 90-day statistical baselines (99th percentile, or 110% of historical maximum), or change
    at an abnormal rate, without a corresponding operator alarm acknowledgment?
  context: 'Establish a 90-day baseline of operational parameter distributions during normal production
    for each controller/tag, calculating both upper-bound percentiles and mechanical-stress indicators
    (rate-of-change per second for temperature, pressure). Apply multi-condition logic: medium severity
    when a parameter exceeds its 99th percentile for >30s; high severity when it stays >99th percentile
    for >5 minutes AND no operator alarm acknowledgment appears in SCADA within 2 minutes of the breach;
    critical when a parameter exceeds 110% of its historical maximum. Also compute the time-derivative
    for temperature/pressure and alert when the rate exceeds 3 standard deviations from baseline, flagging
    thermal-shock or mechanical-stress conditions. To catch stealthy attackers who hold each sample just
    under the static threshold, run a stateful CUSUM on the residual between expected and observed state,
    and use change-point methods (CUSUM/PELT/Bayesian online CPD) to detect abrupt regime shifts such
    as ramp or oscillation onset. Sustained red-zone operation without acknowledgment is a direct Impact
    indicator of equipment being driven toward damage.'
  answer_sources:
