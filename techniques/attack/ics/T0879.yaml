      \ > tuned_bound:\n    alert(high, loop=loop.tag, residual=magnitude, divergence_age=t-since_start)"
- question: Has a CMMS work order indicating physical damage (keywords like 'burned', 'failed', 'damaged',
    'ruptured', 'tripped') been created within 24 hours of anomalous cyber activity targeting the affected
    equipment's controller, HMI, or EWS?
  context: 'Integrate CMMS work-order creation APIs with the SIEM to ingest maintenance events in real
    time, then run correlation rules that: (1) query CMMS for newly created work orders containing damage
    keywords; (2) for each damage work order, automatically execute a 24-hour lookback against ICS network
    logs (Zeek conn.log and protocol logs) and host logs (Windows Event IDs 4688, 4624, 4663) for the
    affected equipment''s controller IP and associated HMI/EWS; and (3) score the presence of anomalous
    cyber activity - unauthorized write commands, off-hours access, suspicious process executions, first-seen
    source IPs, and failed-logon bursts treated as a distinct signal. Generate a ''Cyber-Physical Damage
    Correlation'' alert when the cyber-anomaly score exceeds a threshold (e.g., >3 distinct anomalies).
    This deterministic correlation runs entirely on first-party logs and is favored in ICS for its low
    false-positive rate, and it is the core mechanism for tying physical damage back to a cyber cause
    under the Impact tactic.'
