- question: Did SCADA alarm logs record an emergency shutdown, interlock trip, or breaker event for a
    specific asset within 6 hours AFTER unauthorized ICS write commands or new remote-access sessions
    to the corresponding controller?
  context: 'This is a focused temporal-correlation rule: alert when SCADA alarm logs show protection-system
    activations (emergency shutdowns, interlock trips, breaker events) for a specific asset and Zeek logs
    show unauthorized ICS write commands or new remote-access sessions to that asset''s controller within
    the prior 6 hours. Protection-system trips are the equipment''s last-line defense; when they fire
    shortly after suspicious access or commands, it strongly suggests an attacker drove the process to
    the protective limit, risking or causing damage. A positive result links a discrete physical safety
    event to a preceding cyber action, providing high-confidence evidence for the Impact tactic and a
    clear investigative lead.'
