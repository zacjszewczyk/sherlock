name: 'T1695.001: Serial COM'
id: f66079a9-477f-4c9f-b41c-7bd361d37510
description: 'Investigate whether an adversary is blocking access to serial COM ports on control system
  devices by monopolizing the Ethernet side of a serial-to-Ethernet converter, preventing command and
  configuration messages from reaching field devices and blocking reporting messages back to masters (MITRE
  ATT&CK T1695.001, Block Communications: Serial COM). This playbook helps an analyst hunt for the held-open,
  idle TCP socket signature on converter ports (e.g., telnet 10.0.0.1 20001) that pins one of the few
  available serial ports, for connections to converters from hosts that do not normally perform maintenance
  or from a sudden churn of new source IPs, and for the downstream symptom where SCADA masters, HMIs,
  and historians report communication failures while the converter''s TCP session remains established.
  It combines deterministic symbolic-logic rules, statistical baselines and change-point detection, and
  explainable machine learning across Zeek conn.log and modbus.log, Suricata flow telemetry, Windows process-creation
  and logon events, and Windows Application event logs to confirm the loss of serial command flow and
  attribute it to the responsible session.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there established TCP sessions to known serial-to-Ethernet converter ports (e.g., 20001-2000N)
    that remain open far longer than any legitimate maintenance window while transferring near-zero bytes,
    indicating a pinned, idle socket that monopolizes a serial COM port?
  context: 'This is the core signature of T1695.001: an adversary opens a TCP/IP connection to the Ethernet
    side of a converter (for example, telnet 10.0.0.1 20001) and simply holds it open, making that serial
    port unavailable to legitimate masters. Because a converter typically exposes only a few ports mapped
    one-to-one to physical serial COMs, a single held-open socket can sever command and reporting traffic
    to a field device while everything looks reachable on the network. Look for conn_state=established
    with duration well beyond the site maintenance window paired with orig_bytes+resp_bytes near zero.
    A positive result is a long, silent, pinned socket; a negative result is a normally short or actively
    transferring session. Bound concurrent established sessions per converter port to one, and confirm
    the initiating client and process on the source host to support attribution.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: OT network segments that host serial-to-Ethernet converters, including PCN edge networks, IDMZ
    gateways, and supervisory-control zones.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      conn.log
      | where resp_p in CONVERTER_PORTS (20001..2000N) and conn_state == "established"
      | where duration > MAINT_WINDOW (start 300s, tune per device)
      | where (orig_bytes + resp_bytes) < 512
      | summarize by uid, id.orig_h, id.resp_h, resp_p, duration, orig_bytes, resp_bytes
      | alert "Pinned idle serial converter socket"
  - technology: Suricata/pseudocode
    query: |-
      alert tcp any -> CONVERTER_NET CONVERTER_PORTS (flow:established;
        threshold: type threshold, track by_dst, count 2, seconds 1;
        msg:"More than one concurrent established session per converter port";)
  - technology: SIEM/Rule pseudocode
    query: |-
      join converter_alert (Zeek uid) with WinEventID=4688 on src host, time window
      | where NewProcessName in (telnet.exe, ssh.exe, ncat.exe, plink.exe, custom_maint_tool)
      | output initiating_user, process, command_line for attribution
- question: While a converter port is held open, has the expected serial command flow stopped, i.e., no
    master->device Modbus function codes are observed and Modbus exception responses are rising on that
    path?
  context: 'A held-open socket only matters if it actually blocks traffic. Correlate the suspect converter
    session against Zeek modbus.log: if the port is pinned but no master->device function codes traverse
    it and exception responses climb, the serial path is functionally blocked even though the TCP socket
    is alive. This state-deviation check distinguishes a benign long session (still carrying function
    codes) from an attack that severs command flow. A positive result is a pinned session coincident with
    the disappearance of legitimate function codes and a rise in exceptions; a negative result shows continued
    normal Modbus request/response activity on the converter. This directly evidences the Inhibit Response
    Function objective by confirming that operator commands cannot reach the device.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: OT network segments that host serial-to-Ethernet converters, including PCN edge networks, IDMZ
    gateways, and supervisory-control zones.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      let pinned = conn.log | where resp_p in CONVERTER_PORTS and conn_state=="established" and duration>MAINT_WINDOW
      | join modbus.log on id.resp_h, time window of pinned session
      | summarize req_func_codes = countif(direction=="request"),
                 exceptions = countif(exception != "")
      | where req_func_codes == 0 and exceptions > 0
      | alert "Serial path blocked: pinned socket, no function codes, rising exceptions"
- question: For each converter port, does the current session stand out as a duration outlier above the
    99th percentile while simultaneously falling below the 1st-percentile byte volume relative to a >=90-day
    rolling baseline?
  context: 'Static thresholds miss device-specific norms, so build a per-port rolling baseline (>=90 days)
    of connection duration, orig_bytes, resp_bytes, and bytes-per-second from Zeek conn.log. A held-open
    block manifests as a session that is unusually long AND unusually quiet: above the 99th-percentile
    duration and below the 1st-percentile byte volume at the same time. Requiring both conditions reduces
    false positives from naturally long but active engineering sessions and from short idle probes. A
    positive result is a joint duration/byte-volume outlier on a converter port; a negative result is
    a session within normal envelopes. This availability-monitoring baseline supports detecting the subtle
    resource-monopolization behavior of Serial COM blocking.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: OT network segments that host serial-to-Ethernet converters, including PCN edge networks, IDMZ
    gateways, and supervisory-control zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = conn.log last 90d | where resp_p in CONVERTER_PORTS
        | per resp_p,id.resp_h compute p99(duration), p1(orig_bytes+resp_bytes)
      current = conn.log last 1h | where resp_p in CONVERTER_PORTS
      | join baseline on resp_p,id.resp_h
      | where duration > p99_duration AND (orig_bytes+resp_bytes) < p1_bytes
      | alert "Converter session is duration outlier with minimal traffic"
- question: Is there an abrupt, sustained change-point in a converter port's session-duration or byte-rate
    time series that marks the onset of a held-open block, detectable without fixed percentile thresholds?
  context: CUSUM or likelihood-ratio change-point detection on per-port session-duration and byte-rate
    series catches the step change at block onset with bounded false alarms, even when absolute values
    drift over time. This complements percentile baselines by flagging the moment behavior shifts rather
    than only steady-state outliers, which is valuable for catching the transition from normal maintenance
    to a pinned socket. A positive result is a detected sustained shift (e.g., duration jumps and byte-rate
    collapses simultaneously); a negative result shows stationary behavior. Pinpointing onset time also
    helps correlate with the responsible source host and process.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: OT network segments that host serial-to-Ethernet converters, including PCN edge networks, IDMZ
    gateways, and supervisory-control zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for each converter port series s in {session_duration, byte_rate}:
        CUSUM(s) with drift k, threshold h tuned for bounded FAR
        detect change-point t* where cumulative deviation exceeds h
      | alert if duration series steps UP and byte_rate series steps DOWN near same t*
- question: Does an unsupervised anomaly model (Isolation Forest / Extended Isolation Forest or a streaming
    autoencoder) isolate a converter-port session that pins the port without the expected serial payload,
    and can the alert surface the top contributing features?
  context: Train an unsupervised Isolation Forest or Extended Isolation Forest on converter-port flow
    features (duration, orig_bytes, resp_bytes, bytes-per-second ratio, concurrent sessions, source identity,
    time-of-day) so that a held-open, payload-less pin is isolated from the normal maintenance population.
    Surface the top-3 contributing features (e.g., duration, byte-ratio, new-source) via EIF per-feature
    contribution or SHAP so analysts can triage quickly. For OT-edge streaming, Kitsune's autoencoder
    ensemble over incremental flow statistics gives lightweight online scoring. Keep the deterministic
    held-session rule running in parallel so an adversary who evades learned thresholds still trips the
    hard rule. A positive result is a high anomaly score with explanatory features pointing at duration/byte-ratio/new-source;
    a negative result is a low score consistent with normal maintenance.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Windows Event ID 4688
  - 'NAI: OT network segments that host serial-to-Ethernet converters, including PCN edge networks, IDMZ
    gateways, and supervisory-control zones.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [duration, orig_bytes, resp_bytes, bytes_per_sec_ratio,
                 concurrent_sessions, src_identity, time_of_day]
      model = IsolationForest()  # or ExtendedIsolationForest / Kitsune for streaming
      model.fit(historical_converter_flows)
      score = model.decision_function(current_flow)
      if score < anomaly_threshold:
        explain = SHAP_or_EIF_contributions(current_flow); report top-3 features
        alert "Anomalous converter-pin session"
      # run deterministic held-session rule in parallel as detection floor
- question: Did a converter port receive a TCP session from a source host that is not on the approved
    per-converter maintenance/engineering allow-list, and which user session and process initiated it?
  context: Maintain a per-converter allow-list of approved engineering/maintenance source hosts and approved
    converter ports. Any Zeek conn.log session to a converter port from an off-list source IP is suspicious
    and consistent with unauthorized monopolization of the limited serial ports. This deterministic check
    is the detection floor for unauthorized access. On candidate Windows source hosts, pivot to Event
    ID 4624 (logon) and 4688 (process creation) to identify the user session and the exact process/command
    line that opened the connection. A positive result is an off-list source touching a converter port;
    a negative result is access only from approved maintenance hosts. Attribution to a user and process
    strengthens incident response for this Inhibit Response Function technique.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: IT/OT DMZ boundary systems, engineering workstations, supervisory hosts, and network segments
    directly adjacent to serial-to-Ethernet converters.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      conn.log | where resp_p in CONVERTER_PORTS
      | where id.orig_h NOT in ALLOWLIST[converter=id.resp_h]
      | alert "Converter access from non-maintenance source"
      | enrich with WinEventID 4624 (logon) + 4688 (process) on id.orig_h, time window
      | output src_user, logon_type, NewProcessName, command_line
- question: Are new sessions or rejected/blocked connections to a converter port arriving faster than
    a defined rate (e.g., more than N in T seconds), indicating probing or rapid reconnection attempts?
  context: Use Suricata threshold/rate_filter tracked by destination to alert when new sessions or rejected/blocked
    connections to a converter port exceed N in T seconds (start at N=5/min and tune per site). A burst
    of connection attempts can indicate an adversary probing the converter, scripting reconnection after
    being denied, or racing to grab a freed port. This bounds noisy reconnection behavior and provides
    early warning before a port is successfully pinned. A positive result is a sustained burst above the
    rate; a negative result is sparse, expected maintenance connections. Pair with the allow-list and
    held-session rules for full coverage.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: IT/OT DMZ boundary systems, engineering workstations, supervisory hosts, and network segments
    directly adjacent to serial-to-Ethernet converters.'
  range: Last 90 days
  queries:
  - technology: Suricata/pseudocode
    query: |-
      alert tcp any -> CONVERTER_NET CONVERTER_PORTS (
        flags:S; track by_dst;
        rate_filter: track by_dst, count 5, seconds 60;
        msg:"Elevated new/blocked sessions to converter port (probing)";)
- question: Has the Shannon entropy of the source-IP distribution to a converter dropped sharply (one
    host monopolizing access) or has the count of new source IPs risen above the 99th percentile (probing)
    relative to a 90-day baseline?
  context: 'Build a 90-day baseline of distinct source IPs, connection counts, and the Shannon entropy
    of the source-IP distribution per converter. Two opposite anomalies both matter: a sharp entropy drop
    means a single host is now dominating access (consistent with monopolizing the port), while a spike
    in new source IPs above the 99th percentile suggests broad probing. Tracking entropy shifts over Zeek
    conn.log is robust to absolute volume changes. A positive result is either a sudden entropy collapse
    or a new-source-IP spike on a converter; a negative result is stable, diverse, expected access patterns.
    This frames who is accessing the converter and how that access concentration is changing.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: IT/OT DMZ boundary systems, engineering workstations, supervisory hosts, and network segments
    directly adjacent to serial-to-Ethernet converters.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per converter (id.resp_h): window=1h
        H = -sum(p_i * log2(p_i)) over src-IP distribution
        new_src = count(src not seen in baseline)
      baseline 90d: mean/std of H, p99(new_src)
      | alert if H << baseline_mean (sharp drop) OR new_src > p99
      | label drop->monopolization, spike->probing
- question: Are blocked/rejected TCP connections (conn_state S0/REJ) and Modbus exception responses to
    a converter showing a sustained increase, as legitimate masters fail to reach a monopolized port?
  context: When a converter port is monopolized, legitimate masters attempting to connect surface as failed
    connections (conn_state S0 or REJ) and as Modbus exception responses. Track these as distinct features
    per converter and alert on sustained increases. This failure-mode profiling detects the collateral
    evidence of blocking even if the pinning session itself is missed. A positive result is a sustained
    rise in S0/REJ and/or Modbus exceptions on a converter; a negative result is baseline-level failures.
    This aligns with the ICS DoS taxonomy where availability loss manifests as accumulating connection
    and protocol failures, directly supporting the Inhibit Response Function question.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: IT/OT DMZ boundary systems, engineering workstations, supervisory hosts, and network segments
    directly adjacent to serial-to-Ethernet converters.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      conn.log | where resp_p in CONVERTER_PORTS and conn_state in ("S0","REJ")
        | summarize fails = count() by id.resp_h, bin(5m)
      modbus.log | summarize exc = countif(exception!="") by id.resp_h, bin(5m)
      | join; baseline 30d mean/std
      | alert if fails or exc sustained > mean+3*std for >5min
- question: Does a supervised classifier trained on labeled authorized/unauthorized converter sessions
    flag a current session as high-confidence unauthorized, and what features drive that decision?
  context: Train a supervised classifier on historical Zeek conn.log sessions labeled authorized vs unauthorized,
    using source and destination IP, destination port, protocol, duration, time-of-day, and source-host
    identity. Flag high-confidence unauthorized sessions and surface the top-3 driving features via SHAP
    so analysts understand why a session was flagged (e.g., off-hours, unknown source, atypical duration).
    Retain the deterministic allow-list rule in parallel as the detection floor so the model augments
    rather than replaces hard rules. A positive result is a high-confidence unauthorized classification
    with explanatory features; a negative result is a session confidently classified authorized. This
    helps catch subtle unauthorized access that an allow-list alone might not contextualize.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: IT/OT DMZ boundary systems, engineering workstations, supervisory hosts, and network segments
    directly adjacent to serial-to-Ethernet converters.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [src_ip, dst_ip, dst_port, proto, duration, time_of_day, src_identity]
      model = SupervisedClassifier().fit(labeled_sessions)  # authorized/unauthorized
      p = model.predict_proba(current_session)
      if p(unauthorized) > 0.9:
        report SHAP top-3 features; alert "High-confidence unauthorized converter access"
      # keep allow-list rule as parallel detection floor
- question: Are Windows Application Event Log communication-failure alarms occurring at the same time
    a long-duration TCP session to the same converter remains established, with no master->device function
    codes and rising Modbus exceptions?
  context: This correlates the operator-visible symptom with the network cause. When a SCADA master, HMI,
    or historian logs communication-failure alarms in the Windows Application Event Log while Zeek conn.log
    shows a long-duration, established session pinning the same converter, and modbus.log shows no master->device
    function codes plus rising exceptions, you have the protocol-valid-but-impossible state characteristic
    of a serial-path block. Raise a high-priority alert in this combination. A positive result is the
    alarms-plus-pinned-session-plus-stalled-protocol triad on one converter; a negative result is alarms
    with no corresponding pinned session (likely a different fault). This is strong, attributable evidence
    for Inhibit Response Function via Serial COM blocking.
  answer_sources:
  - Windows Event Log (Application)
  - Zeek conn.log
  - Zeek modbus.log
  - 'NAI: SCADA masters, historian servers, HMI terminals, and engineering workstations that depend on
    serial-connected field assets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      alarms = WinEventLog Application | where message ~ "comm failure|timeout|no response"
      pinned = conn.log | where resp_p in CONVERTER_PORTS and conn_state=="established" and duration>MAINT_WINDOW
      stalled = modbus.log | summarize req=countif(direction=="request"), exc=countif(exception!="") by id.resp_h
      | join alarms+pinned+stalled on converter/device, time window
      | where req==0 and exc>0
      | high_priority_alert "Comm-failure alarms while converter pinned and protocol stalled"
- question: Has the communication-failure alarm count per affected device exceeded three standard deviations
    (or a modified Z-score) above a 30-day baseline for more than five minutes, indicating functional
    blocking rather than transient slowness?
  context: Track communication-failure alarm counts per affected device and compare against a 30-day baseline.
    A surge beyond three standard deviations (or a robust modified Z-score) sustained for over five minutes
    indicates the converter is functionally blocking traffic, not merely slow or experiencing a momentary
    hiccup. The sustained-duration requirement filters out brief, self-recovering glitches. A positive
    result is a persistent alarm-rate surge on a device dependent on a serial converter; a negative result
    is alarm rates within normal variation. This statistical view of the operator-facing impact complements
    the network-side detections and helps confirm real loss of response function.
  answer_sources:
  - Windows Event Log (Application)
  - Zeek conn.log
  - Zeek modbus.log
  - 'NAI: SCADA masters, historian servers, HMI terminals, and engineering workstations that depend on
    serial-connected field assets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      WinEventLog Application | comm-failure alarms
      | summarize cnt = count() by device, bin(1m)
      baseline 30d: mean, std (or median, MAD for modified Z-score)
      | alert if cnt > mean + 3*std (or |modZ|>3.5) sustained > 5 min
- question: Does change-point detection on a device's communication-failure-rate series identify an abrupt,
    sustained onset of blocked communications with bounded false alarms?
  context: Apply CUSUM or likelihood-ratio change-point detection to the per-device communication-failure-rate
    series to pinpoint the exact onset of blocked communications, rather than only flagging steady-state
    elevation. This is robust to gradual baseline drift and provides bounded false alarms, making it well-suited
    to identifying the moment a converter port is pinned and serial responses stop. A positive result
    is a detected sustained step up in the failure rate at a specific time; a negative result is a stationary
    failure rate. The detected onset time is valuable for correlating with the responsible network session
    and source host, tying operator impact to the attacker action.
  answer_sources:
  - Windows Event Log (Application)
  - Zeek conn.log
  - Zeek modbus.log
  - 'NAI: SCADA masters, historian servers, HMI terminals, and engineering workstations that depend on
    serial-connected field assets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      series = per-device comm-failure-rate, 1-min bins
      CUSUM(series) with drift k, threshold h tuned for bounded FAR
      | detect change-point t* where failure rate steps up and stays elevated
      | alert "Onset of blocked communications at t*"; correlate t* with conn.log sessions
- question: Does a sequence-to-sequence model of normal periodic polling/response patterns produce a clear
    prediction-error spike when a serial channel stalls?
  context: Train a sequence-to-sequence RNN on the normal periodic polling and response patterns of each
    serial-connected device so the model learns expected request/response cadence. When the serial channel
    stalls because the converter port is blocked, the model's prediction error spikes sharply, flagging
    the disruption even if absolute counts are ambiguous. Validate on ICS benchmarks such as SWaT. A positive
    result is a sustained prediction-error spike coincident with a stalled channel; a negative result
    is low prediction error consistent with normal polling. This temporal modeling captures the loss of
    the expected back-and-forth that defines a healthy serial path, directly evidencing inhibited response
    function.
  answer_sources:
  - Windows Event Log (Application)
  - Zeek conn.log
  - Zeek modbus.log
  - 'NAI: SCADA masters, historian servers, HMI terminals, and engineering workstations that depend on
    serial-connected field assets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      model = Seq2SeqRNN().fit(normal polling/response sequences per device)
      err = |model.predict(next_window) - observed|
      | alert if err > error_threshold sustained (channel stalled)
      # validate thresholds on SWaT or similar ICS benchmark
- question: Which active TCP connection most likely caused the communication loss, per a probabilistic
    model that combines Zeek conn.log session features with application alarm timing?
  context: Use a Bayesian or other probabilistic model that fuses Zeek conn.log session features (duration,
    byte volume, source, persistence) with application alarm timing to estimate which active connection
    best explains the observed communication loss. The model prioritizes the connection that most closely
    matches the timing of the alarm change and exhibits the persistence consistent with a pinned port,
    and reports the top contributing features for triage. This turns multiple candidate sessions into
    a ranked root-cause hypothesis. A positive result is one connection scoring as the most probable cause
    with clear supporting features; a negative result is no connection convincingly explaining the loss
    (suggesting a non-blocking fault). This accelerates attribution during response.
  answer_sources:
  - Windows Event Log (Application)
  - Zeek conn.log
  - Zeek modbus.log
  - 'NAI: SCADA masters, historian servers, HMI terminals, and engineering workstations that depend on
    serial-connected field assets.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      candidates = active conn.log sessions to affected converter near alarm onset
      for c in candidates:
        P(cause | c) propto likelihood(alarm_timing | c.persistence, c.byte_volume, c.duration)
      rank candidates by P(cause); report top connection + top contributing features
      | alert "Most probable blocking connection: <uid>"
