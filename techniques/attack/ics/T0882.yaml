questions:
- question: Did any critical ICS asset on the watchlist (Engineering Workstation, Data Historian, SCADA
    server) connect to a known-malicious IP, a newly registered (within 30 days) or high-Shannon-entropy
    (>3.5) domain, issue NULL/TXT DNS records or abnormally long encoded labels, or open a network tunnel
    - all consistent with covert-channel exfiltration of operational data?
  context: 'During Impact an adversary exfiltrates stolen operational information to attacker infrastructure,
    frequently disguising the transfer as DNS or using a covert tunnel rather than an obvious bulk upload.
    Build a watchlist of critical ICS asset IPs and deterministically match their conn.log destinations
    against threat-intel indicators, and their dns.log queries against newly registered / high-entropy
    domains, NULL/TXT record types, and abnormally long encoded labels (per the DNS-tunnel heuristics
    of Tatang et al and the n-gram label scoring of NgViz), plus per-domain query-rate and resolver-correlation
    rules from MITRE DET0400. Any entry in Zeek tunnel.log from a watchlist asset is itself an alertable
    signal because ICS assets should rarely originate tunnels. A positive result - a watchlist asset talking
    to malicious or encoded-data infrastructure - is a strong indicator that operational information is
    leaving the environment; a clean result lowers (but does not eliminate) the likelihood of network
    exfiltration. Citations: [Below the Radar: Spotting DNS Tunnels in Newly Observed Hostnames, Tatang
    et al](https://docs.apwg.org/ecrimeresearch/2019/Nov13_DennisTatang.pdf); [NgViz, Born and Gustafson](https://arxiv.org/pdf/1004.4359);
    [MITRE DET0400, Behavioral Detection of DNS Tunneling and Application Layer Abuse](https://attack.mitre.org/detectionstrategies/DET0400/).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek tunnel.log
  - DNP3/Modbus protocol logs
  - 'NAI: OT-to-IT network gateways, ICS firewalls, Engineering Workstations, Data Historians, DMZ segments,
    internal network segments hosting critical ICS servers, Internet egress points, SCADA network segments.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "watch = set(critical_ics_asset_ips)\nconn.log where id.orig_h IN watch\n  | lookup ti_feed\
      \ ON id.resp_h -> if match emit alert(critical, 'malicious dest')\ndns.log where id.orig_h IN watch\n\
      \  | eval ent=shannon_entropy(query), reg_age=domain_age(query)\n  | where ent > 3.5 OR reg_age\
      \ < 30d OR qtype IN ('NULL','TXT') OR maxlabellen(query) > 50\n  | emit alert(high, 'encoded/covert\
      \ DNS')\ntunnel.log where id.orig_h IN watch | emit alert(high, 'tunnel from ICS asset')"
- question: On DNP3/Modbus/IEC 61850 segments, did any device issue function codes, source/destination
    device pairings, or register/point ranges outside the engineered allowlist - for example unauthorized
    read or bulk-poll messages, or out-of-baseline extra messages - that could be harvesting process data?
  context: 'Theft of operational information can occur over the control protocols themselves: an adversary
    issues bulk read/poll requests to a PLC or RTU to siphon process values, setpoints, and configuration.
    Specification-based detection allowlists the legitimate function codes, device pairs, and register/point
    ranges for each segment and alerts on anything outside that contract (per the auto-generated semantic
    SCADA rule sets of Mohan et al). Modeling each PLC-to-SCADA channel as a deterministic finite automaton
    with phase-shift tracking (Kleinmann et al) catches out-of-baseline bulk reads and ''extra'' messages
    that violate the normal request/response cadence. A positive result is an unauthorized read or an
    anomalous poll volume against an ICS device, indicating either reconnaissance or active extraction
    of operational data over the native protocol. Citations: [Distributed Intrusion Detection System using
    Semantic-based Rules for SCADA, Mohan et al](https://arxiv.org/abs/2412.07917); [Temporal Phase Shifts
    in SCADA Networks, Kleinmann et al](https://arxiv.org/abs/1808.05068).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek tunnel.log
  - DNP3/Modbus protocol logs
  - 'NAI: OT-to-IT network gateways, ICS firewalls, Engineering Workstations, Data Historians, DMZ segments,
    internal network segments hosting critical ICS servers, Internet egress points, SCADA network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (dnp3_log, modbus_log, iec61850_log)\n  | where (func_code NOT IN allowlist(segment))\
      \ \n     OR (src,dst) NOT IN device_pair_allowlist\n     OR register_range NOT IN point_allowlist(device)\n\
      \     OR msg_type='bulk_read'\n  | emit alert('unauthorized SCADA read/poll')\n;; model channel\
      \ as DFA(phase); if extra_msg OR out_of_phase_bulk_read: emit alert"
- question: Did a critical ICS asset's outbound data volume in any one-hour window exceed the 99th percentile
    of its 30-day rolling baseline, or did its count of unique destination ports exceed 3 standard deviations
    above its historical hourly mean?
  context: 'Bulk exfiltration of operational information shows up as outbound byte volume far above what
    an ICS asset normally produces, and port fan-out beyond its usual handful of destinations. For each
    critical asset establish a 30-day rolling baseline of total hourly outbound bytes (orig_bytes) from
    conn.log and compute the 99th percentile; alert when any hour exceeds it. Separately baseline the
    hourly count of unique destination ports and alert above mean + 3 standard deviations. Derive thresholds
    per asset class from your own data, since an Engineering Workstation and a Historian have very different
    normal profiles - volume/frequency baselining of egress is the core robust signal validated by Ahmed
    et al. A positive result is an hour of anomalously large or anomalously dispersed egress, the network
    footprint of operational-data theft; a negative result indicates egress within the asset''s normal
    envelope. Citations: [Real-Time Detection of DNS Exfiltration and Tunneling, Ahmed et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek tunnel.log
  - DNP3/Modbus protocol logs
  - 'NAI: OT-to-IT network gateways, ICS firewalls, Engineering Workstations, Data Historians, DMZ segments,
    internal network segments hosting critical ICS servers, Internet egress points, SCADA network segments.'
  range: Last 90 days (hourly aggregation; baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "conn.log where id.orig_h IN critical_assets\n  | bin 1h | stats sum(orig_bytes) AS bph, dcount(id.resp_p)\
      \ AS uports BY id.orig_h, window\n  | join baseline_30d ON id.orig_h  // p99 bytes, mean/sd ports\n\
      \  | where bph > p99_bytes OR uports > mean_ports + 3*sd_ports\n  | emit alert"
- question: For each registered domain queried by a watchlist asset, does the per-query Shannon entropy,
    label length, character distribution, or unique-subdomain request rate deviate sustainedly from baseline,
    and is there a concurrent spike in NXDOMAIN responses or firewall-blocked connections indicating an
    active covert channel?
  context: 'Low-throughput DNS exfiltration hides operational data inside query names, so per-domain lexical
    and information-content features reveal it even when total byte volume looks normal. Per registered
    domain queried by a watchlist asset, baseline per-query Shannon entropy, label length, character counts,
    and unique-subdomain request rate, alerting on sustained deviation (Ahmed et al; the low-throughput
    per-domain features of Nadler et al), and track per-domain encoded information content as streaming
    heavy hitters with bounded memory (Ozery et al). Critically, profile each asset''s NXDOMAIN rate and
    firewall-blocked-connection rate as a distinct failure-state signal: a sharp rise in failed resolutions
    or blocked egress concurrent with high label entropy is a hallmark of an active tunnel, because encoded
    subdomains frequently fail to resolve. A positive result - sustained high-entropy, high-rate subdomain
    queries plus a failure spike - strongly indicates covert exfiltration of operational information.
    Citations: [Real-Time Detection of DNS Exfiltration and Tunneling, Ahmed et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf);
    [Detection of Malicious and Low Throughput Data Exfiltration Over DNS, Nadler et al](https://arxiv.org/abs/1709.08395);
    [Information-Based Heavy Hitters for Real-Time DNS Data Exfiltration Detection, Ozery et al](https://www.ndss-symposium.org/wp-content/uploads/2024-388-paper.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek tunnel.log
  - DNP3/Modbus protocol logs
  - 'NAI: OT-to-IT network gateways, ICS firewalls, Engineering Workstations, Data Historians, DMZ segments,
    internal network segments hosting critical ICS servers, Internet egress points, SCADA network segments.'
  range: Last 90 days (per-query and per-domain aggregation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "dns.log where id.orig_h IN watch\n  | eval ent=shannon_entropy(query), llen=label_len(query),\
      \ subrate=unique_subdomains_rate(domain)\n  | join domain_baseline ON registered_domain\n  | where\
      \ sustained_deviation(ent,llen,subrate)\n  | emit alert('DNS lexical anomaly')\n;; per asset: stats\
      \ count(rcode='NXDOMAIN') AS nx, count(blocked) AS blk BY id.orig_h, bin(5m)\n  | where (nx > nx_baseline\
      \ OR blk > blk_baseline) AND concurrent_high_entropy\n  | emit alert('covert-channel failure spike')"
- question: Does an unsupervised anomaly detector (Extended Isolation Forest, or a poisoning-robust One-Class
    SVM) flag a critical ICS asset's hourly network behavior as anomalous, and which top-3 features (e.g.
    outbound bytes, unique-destination count, label entropy) drove the score?
  context: 'Some exfiltration is anomalous across several dimensions at once - moderate byte volume but
    to many destinations, with an unusual byte ratio and protocol mix - in ways no single threshold catches.
    Train an unsupervised detector per critical ICS asset on historical conn.log features: hourly orig_bytes,
    resp_bytes, connection duration, count of unique destination IPs/ports, byte ratio, and protocol distribution.
    Use Extended Isolation Forest for robust low-latency tabular scoring (Hariri et al), with a One-Class
    SVM trained only on benign traffic as a more poisoning-robust alternative (Scientific Reports 2025).
    This model runs in parallel with - never replacing - the deterministic and statistical rules above.
    Every alert MUST surface the top-3 contributing features via LIME-style attribution, not just a bare
    anomaly score, so an analyst can immediately judge whether the flagged hour represents operational-data
    exfiltration. A positive result is a high-scoring hour whose feature attribution points at egress
    behavior. Citations: [Extended Isolation Forest, Hariri et al](https://arxiv.org/abs/1811.02141);
    [code](https://github.com/sahandha/eif); [Robust IoT security using isolation forest and one class
    SVM, Scientific Reports 2025](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek tunnel.log
  - DNP3/Modbus protocol logs
  - 'NAI: OT-to-IT network gateways, ICS firewalls, Engineering Workstations, Data Historians, DMZ segments,
    internal network segments hosting critical ICS servers, Internet egress points, SCADA network segments.'
  range: Last 90 days (hourly scoring; train on >=90 days)
  queries:
  - technology: ML/pseudocode
    query: "feats = conn.log per asset/hour: orig_bytes,resp_bytes,duration,\n        dcount(resp_h),dcount(resp_p),byte_ratio,proto_dist\n\
      model = ExtendedIsolationForest().fit(train_90d)   // or OneClassSVM(benign_only)\nscore = model.score(feats)\n\
      if score > p99(scores):\n    top3 = lime_attribute(model, feats)  // e.g. outbound_bytes, uniq_dest,\
      \ label_entropy\n    emit alert(asset, score, top3)"
- question: Was an archiving or compression utility (7z.exe, rar.exe, tar, PowerShell Compress-Archive)
    executed on a critical ICS asset with a command line or script block referencing sensitive ICS file
    extensions or keywords (.L5K, .ACD, .ap16, project, recipe, design)?
  context: Before exfiltration an adversary typically stages stolen operational data by compressing the
    target files into a single archive. Query Windows Event ID 4688 (process creation) and PowerShell
    Event ID 4104 (script block logging) on critical ICS assets and alert when the process or script matches
    a watchlist of archiving utilities AND the command line / script content references sensitive ICS
    file extensions or project/recipe/design keywords. This is a high-fidelity deterministic signal because
    ICS engineering hosts rarely have a legitimate reason to bulk-archive .L5K/.ACD/.ap16 project files.
    A positive result is an archiving invocation targeting operational files - a direct staging indicator
    that should be triaged immediately and correlated with subsequent egress; a negative result means
    no archive-based staging of sensitive files was observed in the window.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4663
  - 'NAI: Engineering Workstations, ICS Application Servers, File servers hosting project data, SCADA/HMI
    servers, Historian servers, PLC programming stations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventID=4688, WinEventID=4104) where Computer IN critical_ics\n  | where (NewProcessName\
      \ MATCHES_ANY ['7z.exe','rar.exe','tar*','*Compress-Archive*'])\n  | where (CommandLine|ScriptBlockText)\
      \ MATCHES_ANY\n        ['.L5K','.ACD','.ap16','project','recipe','design']\n  | emit alert(high,\
      \ 'archiving of sensitive ICS files')"
- question: Is an archiving utility being run by a user-host pair for the first time, by a user whose
    archiver use diverges from peers, at a daily count exceeding 3 standard deviations above the historical
    mean, or accompanied by failed/aborted archive operations and access-denied reads?
  context: 'Even legitimate archiving tools become suspicious when used by someone who never uses them
    or far more than usual. From Windows Event ID 4688 establish a per-user-host baseline of process execution
    and alert on first-seen archiver use, escalating via peer-group comparison (Microsoft Sentinel UEBA)
    when a user''s archiver behavior diverges from peers in the same role. For known user-host-archiver
    combinations, alert when the daily execution count exceeds mean + 3 standard deviations. Separately
    profile failed/aborted archive operations and access-denied file reads during archiving (Event ID
    4663 failures) as a distinct failure-state signal of staging against protected files. A positive result
    - a novel, peer-anomalous, or high-volume archiver invocation, or a burst of denied reads during archiving
    - indicates likely staging of operational information for theft. Citations: [Microsoft Sentinel User
    and Entity Behavior Analytics](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4663
  - 'NAI: Engineering Workstations, ICS Application Servers, File servers hosting project data, SCADA/HMI
    servers, Historian servers, PLC programming stations.'
  range: Last 90 days (baseline 30 days; daily aggregation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "WinEventID=4688 where archiver(NewProcessName)\n  | eval pair=(SubjectUserName,Computer)\n\
      \  | where pair NOT IN seen_pairs_90d -> emit alert('first-seen archiver use')\n  | peer_compare(SubjectUserName,\
      \ role) -> if diverges emit alert('peer-anomalous')\n  | stats count BY pair, bin(1d) | join daily_baseline\n\
      \       | where count > mean + 3*sd | emit alert('archiver volume spike')\n;; WinEventID=4663 failures\
      \ during archiving | emit alert('denied reads while staging')"
- question: Does an unsupervised behavioral model over command-line telemetry flag an archiving invocation
    on a critical ICS asset as a high-scoring anomaly, and does the alert name the top-3 contributing
    tokens/features (e.g. rare flag combination, sensitive extension, off-hours)?
  context: 'Adversaries vary tool names, flags, and paths to evade static watchlists, so a model that
    learns the shape of normal command lines catches archiving that deterministic rules miss. Build an
    unsupervised model from historical Windows Event ID 4688/4104 data on critical ICS assets, engineering
    features for parent process, user context, time of day, and the command line; embed the tokenized
    command line with BERT-style embeddings and score with outlier detectors (COPOD, Isolation Forest,
    PCA, autoencoder) as in CrowdStrike''s command-line anomaly work. Alert when an archiving invocation
    receives a high anomaly score and emit the top-3 contributing tokens/features in the alert text (per
    the explainability approach of the Scientific Reports 2025 study) so the analyst can triage. This
    runs in parallel with the deterministic watchlist rule, not in place of it. A positive result is an
    anomalous archiver command line whose drivers point at sensitive staging. Citations: [BERT Embeddings
    for Command Line Anomaly Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/);
    [Robust IoT security using isolation forest and one class SVM, Scientific Reports 2025](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4663
  - 'NAI: Engineering Workstations, ICS Application Servers, File servers hosting project data, SCADA/HMI
    servers, Historian servers, PLC programming stations.'
  range: Last 90 days (train on >=90 days)
  queries:
  - technology: ML/pseudocode
    query: "X = featurize(WinEventID=4688/4104: parent_proc,user,hour, cmdline_tokens)\nemb = BERT_embed(tokenize(cmdline))\n\
      score = outlier_detect(emb)  // COPOD / IsolationForest / PCA / autoencoder\nif archiver(proc) AND\
      \ score > threshold:\n    top3 = attribute_tokens(emb)  // rare_flag, sensitive_ext, offhours\n\
      \    emit alert(host,user,score,top3)"
- question: Did a read access (Event ID 4663 with AccessList containing %%4416 or ReadData) target a watchlisted
    sensitive ICS file path or extension (e.g. *\projects\*.L5K, *\configs\*.ACD) by a SubjectUserName
    that is not on the approved list of authorized engineering accounts?
  context: Theft of operational information begins with reading the target files, so monitoring read access
    to sensitive ICS paths catches collection at the source. Continuously query Windows Event ID 4663
    on the NAIs for read attempts (AccessList contains %%4416 or ReadData) and alert when the ObjectName
    matches a watchlist of sensitive ICS file paths/extensions and the SubjectUserName is not an approved
    engineering account. Enforcing this allowlist of who may read project/design files turns every unauthorized
    read into a high-fidelity alert. A positive result is a non-authorized account reading operational
    design files - a direct indicator of collection preceding theft; a negative result indicates reads
    stayed within the authorized engineering population.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - USB/removable-media device events
  - 'NAI: File servers containing operational design documents, PLC/HMI project repositories, Engineering
    Workstations, Historian file shares, SCADA client machines, central configuration management servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WinEventID=4663 where Computer IN nai_hosts\n  | where AccessList CONTAINS ('%%4416' OR 'ReadData')\n\
      \  | where ObjectName MATCHES_ANY ['*\\\\projects\\\\*.L5K','*\\\\configs\\\\*.ACD', sensitive_ics_paths]\n\
      \  | where SubjectUserName NOT IN authorized_engineering_accounts\n  | emit alert(high, 'unauthorized\
      \ read of operational file')"
- question: In any 10-minute window, did a user's count of unique sensitive files accessed (Event ID 4663)
    or the Shannon entropy of the accessed file extensions exceed 3 standard deviations above their historical
    mean?
  context: Programmatic harvesting touches many distinct files and many file types in a short burst, unlike
    a human opening a handful of documents. Aggregate Event ID 4663 file-access events per user into 10-minute
    windows and baseline both the count of unique files accessed and the Shannon entropy of file extensions.
    Alert when either metric exceeds mean + 3 standard deviations for that user, indicating an unusual
    volume or variety of access. The entropy dimension is important because exfiltration of a whole project
    directory pulls in diverse extensions (.L5K, .ACD, .ap16, docs, configs) and raises extension entropy
    above the user's norm. A positive result - a window with anomalously high unique-file count or extension
    entropy - suggests automated or mass collection of operational files; normal focused work stays within
    baseline.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - USB/removable-media device events
  - 'NAI: File servers containing operational design documents, PLC/HMI project repositories, Engineering
    Workstations, Historian file shares, SCADA client machines, central configuration management servers.'
  range: Last 90 days (10-minute aggregation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "WinEventID=4663 where ObjectName IN sensitive_ics_files\n  | bin 10m | stats dcount(ObjectName)\
      \ AS uniq, shannon_entropy(fileext(ObjectName)) AS ent\n        BY SubjectUserName, window\n  |\
      \ join user_baseline ON SubjectUserName  // mean,sd of uniq and ent\n  | where uniq > mean_uniq\
      \ + 3*sd_uniq OR ent > mean_ent + 3*sd_ent\n  | emit alert"
- question: Does a UEBA/sequence model over Windows Event IDs 4656/4663 flag a user's file-access pattern
    (access rate, directory-traversal sequence, access-type distribution) as a low-probability mass-read,
    and does the alert surface the top-3 contributing features?
  context: 'Mass-read activity can evade fixed thresholds yet still be improbable given a user''s normal
    access sequence and peer group. Implement User and Entity Behavior Analytics on Windows Event IDs
    4656/4663, profiling each user''s normal access rate, directory-traversal sequence, and access-type
    distribution with peer-group comparison (Microsoft Sentinel UEBA). Train a sequence model on normal
    access sequences and flag low-probability mass-read sequences with per-event diagnosis, following
    the LSTM log-sequence approach of DeepLog (Du et al). Validate and tune thresholds against labeled
    exfiltration scenarios in the CERT Insider Threat Test Dataset. Alerts MUST surface the top-3 contributing
    features (e.g. unique-file count, extension entropy, off-baseline directory) alongside the score,
    and the model runs in parallel with the deterministic read-watchlist rule. A positive result is an
    improbable mass-read sequence indicating collection of operational data. Citations: [Microsoft Sentinel
    User and Entity Behavior Analytics](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [DeepLog, Du et al](https://doi.org/10.1145/3133956.3134015); [CERT Insider Threat Test Dataset, CMU
    SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - USB/removable-media device events
  - 'NAI: File servers containing operational design documents, PLC/HMI project repositories, Engineering
    Workstations, Historian file shares, SCADA client machines, central configuration management servers.'
  range: Last 90 days (train on >=90 days; validate on CERT dataset)
  queries:
  - technology: ML/pseudocode
    query: "events = load(WinEventID=4656, WinEventID=4663)\nprofile = ueba(user: access_rate, traversal_seq,\
      \ access_type_dist) + peer_group\nseq_model = LSTM().fit(normal_access_sequences)   // DeepLog\n\
      p = seq_model.prob(user_session_sequence)\nif p < low_prob_threshold:\n    top3 = attribute(unique_file_count,\
      \ ext_entropy, offbaseline_dir)\n    emit alert(user, p, top3)   // validate thresholds vs CERT\
      \ Insider Threat"
- question: Were high-volume reads of sensitive project/design files (Event ID 4663) on an Engineering
    Workstation or Historian followed by writes to a removable/USB device that is not on the approved-device
    allowlist?
  context: 'A common theft path is to copy collected operational files straight to a USB drive, bypassing
    network monitoring entirely. Correlate high-volume sensitive-file reads (Windows Event ID 4663) on
    Engineering Workstations and Historians with USB/removable-media insertion and unapproved-device events,
    and alert when bulk reads of project/design files are followed by writes to a removable device not
    on the approved-device allowlist (per the USB device-identification and host-monitoring approach of
    Sen et al). This correlation is powerful because it ties the collection (mass reads) to the exfiltration
    mechanism (unapproved media) in one timeline. A positive result - bulk sensitive reads immediately
    preceding writes to an unauthorized USB device - is a strong indicator of operational-information
    theft via removable media; it warrants immediate device and user investigation. Citations: [Enhancing
    SCADA Security: A Host-Based Intrusion Detection System, Sen et al](https://arxiv.org/abs/2402.14599).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - USB/removable-media device events
  - 'NAI: File servers containing operational design documents, PLC/HMI project repositories, Engineering
    Workstations, Historian file shares, SCADA client machines, central configuration management servers.'
  range: Last 90 days (event-centered correlation across read-then-write within minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "reads = WinEventID=4663 where Computer IN (EWS,Historian)\n      AND ObjectName IN project_design_files\
      \ AND high_volume_in(window)\nusb = removable_media_events where action='insert' OR action='write'\n\
      \     AND device_id NOT IN approved_device_allowlist\n  | correlate reads THEN usb_write within\
      \ 10m on (Computer, SubjectUserName)\n  | emit alert(high, 'bulk read followed by write to unapproved\
      \ USB')"
- question: Per user and per host, did the rate of failed/denied file-open events (Event ID 4656 access-denied,
    4663 failures) spike into a rare, risky burst that deviates from the historical distribution?
  context: 'Before an adversary successfully reads operational files they often probe directories and
