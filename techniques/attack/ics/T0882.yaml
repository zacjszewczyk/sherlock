name: 'T0882: Theft of Operational Information'
id: dfd6f871-efcb-4d94-8a15-c8d138f8a6da
description: 'Investigate whether an adversary has stolen operational information from the ICS environment
  - design documents, schedules, rotational data, recipes, or process data (e.g. .L5K, .ACD, .ap16 project
  files) - for personal gain or to inform future operations, as seen when adversaries probed systems for
  operational data in the Bowman Dam incident. This playbook helps an analyst hunt across three behavioral
  surfaces: (1) network exfiltration, where critical ICS assets such as Engineering Workstations and Data
  Historians transfer anomalously large data volumes to external or unusual internal destinations, often
  via newly registered or high-entropy domains, covert DNS/ICMP channels, or unauthorized SCADA protocol
  reads, accompanied by spikes in failure states (NXDOMAIN, blocked connections); (2) staging via archiving/compression
  utilities (7z, rar, tar, Compress-Archive) that target sensitive operational files or directories, especially
  by users or at times that break baseline; and (3) mass or unauthorized reads of sensitive operational
  files, including high-volume diverse file access, correlation with removable-media writes, and bursts
  of denied/failed access that betray reconnaissance. It combines symbolic-logic rules, statistical baselining,
  and machine-learning methods across Zeek network telemetry, ICS protocol logs, and Windows endpoint
  auditing to surface theft of operational information.'
type: technique
related:
- tactic_id: TA0105
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
