name: 'T0834: Native API'
id: bf784730-2363-4542-b9df-1b3da8319b03
description: 'Investigate whether an adversary is executing unauthorized code on critical ICS assets (HMI,
  EWS, SCADA/DCS application servers, data historians, and Process Control Network domain controllers)
  by directly interacting with the operating system''s native API. This playbook helps an analyst hunt
  for three families of abnormal behavior by whitelisted, critical ICS processes: (1) suspicious process
  execution and library loads - a critical process spawning unauthorized interpreters, unsigned binaries,
  processes from user-writable or temporary directories, anomalous parent-child pairs, or requesting process-memory
  write access (injection precursor); (2) anomalous network behavior - an ICS process using IT protocols
  (HTTP, RDP, SMB) on industrial segments, connecting to destinations outside the approved OT address
  space, or resolving non-whitelisted domains; and (3) unauthorized file and registry tampering - a critical
  process writing executables to protected system directories, modifying autorun keys, or rewriting its
  own on-disk binary. It combines symbolic-logic rules, statistical baselining (rarity, modified Z-score,
  entropy, HMMs), and machine-learning detectors (Isolation Forest, One-Class SVM, online autoencoders,
  embedding-based command-line outliers, and provenance-graph node anomaly models) to surface native-API
  abuse for explainable triage.'
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a critical ICS process (e.g., HMI_Runtime.exe) spawn a child process that is an unauthorized
    interpreter, an unsigned/untrusted binary, or an executable launched from a user-writable or temporary
    directory - or request process-memory write access to another process?
  context: This Execution detection looks for whitelisted, critical ICS parent processes spawning children
    that should never appear in a deterministic OT environment. Maintain a watchlist of critical ICS parent
    process names (HMI_Runtime.exe, SCADA/DCS runtimes, EWS engineering tools). A positive result is a
    process-creation event (Windows Event ID 4688 or Sysmon Event ID 1) where the parent is on the watchlist
    AND the child is a known interpreter (cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe,
    rundll32.exe, regsvr32.exe), or the child signature is invalid/untrusted, or the child path is in
    %TEMP% or C:\Users\Public\. Also flag library-load events (Sysmon Event ID 7) where a critical process
    loads scripting/automation or in-memory execution DLLs never seen in baseline, and Windows Event ID
    4656 where a critical process requests PROCESS_VM_WRITE (AccessMask containing 0x40) to another process
    - a direct injection precursor and native-API abuse tell. Translate portable rules from the SigmaHQ
    corpus and follow Palantir ADS-004 for unusual host-process behavior. A positive result strongly indicates
    adversary code execution via the native API on a critical asset.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMI), ICS Application Servers (SCADA/DCS),
    Data Historian Servers, Domain Controllers within the Process Control Network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      process_creation where ParentImage in CRITICAL_ICS_WATCHLIST and (
          Image_basename in {cmd.exe,powershell.exe,wscript.exe,cscript.exe,mshta.exe,rundll32.exe,regsvr32.exe}
          or Signed == false or SignatureStatus != 'Valid'
          or Image_path matches '%TEMP%|C\\Users\\Public\\')
        | alert priority=high
  - technology: SIEM/Rule pseudocode
    query: |-
      image_load (Sysmon EID 7) where Image in CRITICAL_ICS_WATCHLIST and
          ImageLoaded in {scripting/automation/in-memory-exec DLLs} and
          ImageLoaded not in baseline_loads[Image] | alert priority=high
  - technology: SIEM/Rule pseudocode
    query: |-
      handle_request (Windows EID 4656) where SourceImage in CRITICAL_ICS_WATCHLIST and
          ObjectType=='Process' and (AccessMask & 0x40)  // PROCESS_VM_WRITE
        | alert priority=high
- question: For critical ICS processes where host syscall/API tracing is available, do observed short
    fixed-length system-call sequences (n-grams) deviate from the process's established normal behavior
    baseline?
  context: Where host syscall/API tracing is available, build a per-critical-process database of normal
    short fixed-length system-call sequences (n-gram lookahead) following Forrest et al.'s 'A Sense of
    Self for Unix Processes'. Deterministically flag any monitored sequence not present in the baseline
    and raise an alert when the mismatch density in a sliding window exceeds a tuned floor (start at >0.5%
    of sequences, then tune per asset). This catches native-API invocation chains absent from the process's
    normal behavior, which is precisely how injected or hijacked code reveals itself even when process
    names look legitimate. A positive result - a cluster of never-before-seen syscall sequences from a
    critical process - indicates execution of foreign code paths; a negative result means the process
    is exercising only known, baselined API sequences.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMI), ICS Application Servers (SCADA/DCS),
    Data Historian Servers, Domain Controllers within the Process Control Network.'
  range: Last 90 days
  queries:
  - technology: Host syscall tracing/pseudocode
    query: |-
      baseline[proc] = set of normal length-k syscall n-grams
        for window in stream(proc.syscalls):
          mismatch = count(ngram not in baseline[proc]) / count(ngram)
          if mismatch > 0.005: alert(proc, window, mismatch)
- question: Is a critical ICS parent process producing statistically rare child processes, anomalous command-line
    length/entropy, low-probability syscall sequences, or a spike in failed/access-denied process creations?
  context: For each critical parent, build a 30-day rolling baseline of child process names and command-line
    Shannon entropy. Raise a medium alert when a parent-child pair falls in the 99th percentile of historical
    rarity. Apply the robust median/MAD-based modified Z-score (escalate at |Mi|>3.5) on command-line
    length and entropy so legitimate batch/maintenance jobs do not distort thresholds. Model normal native-API/syscall
    sequence likelihood with HMMs over system calls plus call-stack context (Hoang & Hu) and flag low-probability
    sequences. Separately baseline per-parent rates of failed process creations and access-denied (0xC0000022)
    events - a spike is a distinct State-physics signal of attempted-but-blocked execution. A positive
    result is a rare child, an entropy/length outlier, or a failure-rate spike that correlates with other
    indicators, indicating attempted native-API-driven execution.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMI), ICS Application Servers (SCADA/DCS),
    Data Historian Servers, Domain Controllers within the Process Control Network.'
  range: Last 90 days; compare against a 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline_30d per ParentImage: child_name_freq, cmdline_len, cmdline_entropy
        alert medium if rarity(parent,child) >= p99
        Mi = 0.6745*(x - median)/MAD  // on cmdline_len and entropy
        escalate high if |Mi| > 3.5
  - technology: SIEM/Stats pseudocode
    query: |-
      per ParentImage: rate(failed_proc_create), rate(status==0xC0000022)
        alert if rate >> baseline_30d_mean  // attempted-but-blocked execution
- question: When scored by an Isolation Forest trained on historical process-creation telemetry, do live
    process-creation events on critical ICS assets fall in the top 2% anomaly band - and do command lines
    appear as embedding-based outliers consistent with obfuscation?
  context: Train an Isolation Forest on historical process-creation data (Sysmon Event ID 1) using features
    ParentProcessName, NewProcessName, command_line_length, command_line_entropy, and boolean is_signed
    and is_in_system_directory. Score events in real time and flag the top 2% (98th percentile). For explainability,
    emit the top-3 contributing features in the alert text so an analyst can triage quickly. In parallel,
    score command lines with embedding-based outlier detection (COPOD/Isolation Forest/autoencoder over
    BERT-style embeddings) per CrowdStrike's command-line anomaly approach to catch obfuscated invocations
    that evade keyword rules. A positive result is a high-anomaly process creation whose contributing
    features (e.g., unsigned binary, high command-line entropy, non-system directory) point to native-API
    abuse; a negative result is an event scoring within the normal density.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMI), ICS Application Servers (SCADA/DCS),
    Data Historian Servers, Domain Controllers within the Process Control Network.'
  range: Last 90 days; model trained on 90+ days of history
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [ParentProcessName, NewProcessName, cmdline_len, cmdline_entropy, is_signed, is_in_system_dir]
        model = IsolationForest.fit(history)
        score = model.decision_function(event)
        if score in top 2%: alert(event, top3_contributing_features)
  - technology: ML/pseudocode
    query: |-
      emb = bert_embed(command_line)
        if COPOD/IForest/autoencoder(emb) > threshold: alert('obfuscated command-line outlier')
- question: Does whole-system provenance built from host audit telemetry contain anomalous process->native-API->resource
    causal nodes or edges, as flagged by node-level provenance-learning models?
  context: Build whole-system provenance graphs from host audit telemetry and detect anomalous process->native-API->resource
    causal structure using node-level provenance learning. Candidate models include ThreaTrace (GraphSAGE),
    the temporal GNN autoencoder KAIROS, and the masked graph autoencoder MAGIC. These surface the specific
    anomalous nodes/edges for explainable triage rather than a single opaque score, which is essential
    in an ICS environment where false positives can disrupt operations; the ICS-domain survey by Luo et
    al. frames model selection for EWS/HMI/SCADA telemetry. A positive result is a flagged node/edge such
    as a critical ICS process making an unusual native-API call that touches a sensitive resource, indicating
    possible execution of adversary code; a negative result is a provenance subgraph that matches learned-normal
    causal patterns.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Windows Event ID 4656
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMI), ICS Application Servers (SCADA/DCS),
    Data Historian Servers, Domain Controllers within the Process Control Network.'
  range: Last 90 days; model trained on benign provenance history
  queries:
  - technology: ML/Provenance-graph pseudocode
    query: |-
      G = build_provenance_graph(host_audit_telemetry)
        scores = ThreaTrace|KAIROS|MAGIC.score_nodes_edges(G)
        for n in G where scores[n] anomalous:
          alert(node=n, path=process->native_api->resource)
- question: Is a whitelisted critical ICS process initiating a network connection over a common IT protocol
    (HTTP, HTTPS, RDP, SMB) to a destination outside the approved OT address space, or resolving a domain
    that is not on the ICS domain whitelist?
  context: This Execution-stage network detection binds each critical ICS process to its network 5-tuple
    by correlating process-network telemetry (Sysmon Event ID 3 or Windows Event ID 5156) with connection
    logs (Zeek conn.log) by source IP and timestamp, per the Elastic Sysmon EID3 reference. Raise a high-priority
    alert if a whitelisted ICS process is the source of a connection whose destination port is a common
    IT protocol (80, 443, 3389, 445) AND the destination IP is outside approved OT address space - industrial
    processes on segregated Purdue Level 2/3 segments should speak industrial protocols (Modbus, DNP3),
    not browse the web or use RDP/SMB externally. Also alert if the process makes a DNS query (Zeek dns.log)
    for a domain not on the ICS domain whitelist. A positive result suggests adversary-controlled code
    on the ICS asset is reaching out for C2, tooling, or exfiltration; a negative result keeps the process
    within its expected OT traffic profile.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: Network sensors at the perimeter of ICS Network Segments (Purdue Levels 2/3), Industrial Demilitarized
    Zone (IDMZ) egress points, DNS resolvers serving the OT environment, Internet gateway proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM correlation pseudocode
    query: |-
      join (Sysmon EID3 | Windows EID5156) with conn.log on src_ip,ts -> bind proc to 5-tuple
        alert high if proc in ICS_WHITELIST and resp_p in {80,443,3389,445} and resp_ip not in OT_CIDRS
  - technology: Zeek/pseudocode
    query: |-
      dns.log where query bound to ICS_WHITELIST proc and query not in ICS_DOMAIN_WHITELIST
        | alert high
- question: For each critical ICS application, has it contacted a destination port never seen in baseline,
    exceeded its 95th-percentile daily data volume, or generated a spike in rejected connections / NXDOMAIN
    responses indicative of beaconing to unreachable infrastructure?
  context: For each critical ICS application, maintain a 30-day rolling baseline from Zeek conn.log of
    total bytes (orig_bytes+resp_bytes, Volume), connection rate per minute (Frequency), and the set of
    unique destination ports. Raise a medium alert on a destination port never seen in baseline (0th percentile).
    Escalate to high when daily data volume exceeds the 95th percentile or the robust median/MAD-based
    modified Z-score exceeds |Mi|>3.5. As a failure-mode (State-physics) signal, separately baseline rejected/blocked
    connection counts (conn_state S0/REJ) and NXDOMAIN responses (Zeek dns.log rcode); a rise indicates
    scanning or beaconing to unreachable infrastructure. A positive result is a new port, a volume outlier,
    or a failure-rate spike that corroborates anomalous execution-driven network activity; a negative
    result is traffic consistent with the application's deterministic baseline.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: Network sensors at the perimeter of ICS Network Segments (Purdue Levels 2/3), Industrial Demilitarized
    Zone (IDMZ) egress points, DNS resolvers serving the OT environment, Internet gateway proxies.'
  range: Last 90 days; compare against a 30-day rolling baseline
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      baseline_30d per app: seen_ports, daily_bytes, conn_rate_per_min
        alert medium if resp_p not in seen_ports
        escalate high if daily_bytes > p95 or |modified_z(daily_bytes)| > 3.5
  - technology: Zeek/Stats pseudocode
    query: |-
      per app: rate(conn_state in {S0,REJ}), rate(dns.rcode==NXDOMAIN)
        alert if rate >> baseline_30d_mean  // scanning/beaconing to unreachable infra
- question: When evaluated by a per-application One-Class SVM and an online ensemble-autoencoder over
    Zeek flow features, do a critical ICS process's network connections register as outliers or produce
    high reconstruction error?
  context: Train a per-application One-Class SVM on normal Zeek conn.log features (duration, orig_bytes,
    resp_bytes, id.resp_p, one-hot proto and conn_state) and flag outliers, using LIME to surface the
    top-3 contributing features in the alert. In parallel, run an online ensemble-autoencoder detector
    (Kitsune) over incremental flow-rate/jitter features and alert on reconstruction error (RMSE) above
    the auto-calibrated threshold. These complementary unsupervised models catch anomalous connections
    that fixed rules miss, including slow beacons and novel protocols. A positive result is a connection
    the OC-SVM marks as out-of-distribution or that drives autoencoder RMSE above threshold - both consistent
    with adversary code communicating from a critical ICS asset; a negative result is a flow within the
    learned-normal manifold.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - 'NAI: Network sensors at the perimeter of ICS Network Segments (Purdue Levels 2/3), Industrial Demilitarized
    Zone (IDMZ) egress points, DNS resolvers serving the OT environment, Internet gateway proxies.'
  range: Last 90 days; models trained on benign flow history
  queries:
  - technology: ML/pseudocode
    query: |-
      feats = [duration, orig_bytes, resp_bytes, id.resp_p, onehot(proto), onehot(conn_state)]
        ocsvm = OneClassSVM.fit(normal_flows[app])
        if ocsvm.predict(flow) == -1: alert(flow, LIME_top3)
  - technology: ML/pseudocode
    query: |-
      kitsune = EnsembleAutoencoder(flow_rate_jitter_features)  // online
        if kitsune.rmse(flow) > auto_threshold: alert(flow, rmse)
- question: Did a whitelisted critical ICS process write or delete a protected resource - an executable
    in a system directory, an autorun registry key (HKLM\...\Run), or its own on-disk binary - or generate
    access-denied attempts against such protected paths?
  context: 'Configure SACLs on critical directories and registry hives so that write/delete operations
    are audited. Raise a high-priority alert on Sysmon events (11 file create, 12/13 registry) or Windows
    Security events (4663 file access, 4657 registry value change) when a critical ICS process writes
    or deletes a protected resource: executables in system directories (C:\Windows\System32), autorun
    keys (HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run), or the application''s own binary. Translate
    portable file/registry rules from the SigmaHQ corpus. As a failure-mode signal, separately track access-denied
    (0xC0000022) write attempts to protected paths as a distinct indicator of blocked-but-attempted tampering.
    A positive result indicates the process - or code injected into it via the native API - is establishing
    persistence or modifying system state; a negative result means the process touched only its normal,
    baselined resources.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - 'NAI: File systems and registries of critical ICS assets, including Engineering Workstations (EWS),
    Human-Machine Interfaces (HMI), and Application Servers. Specifically monitor critical directories
    (''C:\Windows\System32'', application installation folders) and registry hives (''HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'').'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      (Sysmon EID 11/12/13 or Windows EID 4663/4657) where Image in CRITICAL_ICS_WATCHLIST and
          (TargetFilename in 'C\\Windows\\System32\\*.exe'
           or TargetObject matches 'HKLM\\...\\CurrentVersion\\Run'
           or TargetFilename == Image_own_binary)
        | alert priority=high
  - technology: SIEM/Rule pseudocode
    query: |-
      where Image in CRITICAL_ICS_WATCHLIST and status==0xC0000022 and Target in PROTECTED_PATHS
        | alert 'blocked-but-attempted tampering'
- question: For each critical ICS application, is it writing to a file or registry path that is statistically
    rare relative to its 30-day baseline, or showing an anomalous per-path write count or write byte-volume
    by modified Z-score?
  context: For each critical ICS application, build a 30-day baseline of all file and registry paths it
    writes. Compute a rarity score per path from historical access frequency and alert on writes in the
    99th percentile of rarity. Apply the robust median/MAD-based modified Z-score (|Mi|>3.5) to per-path
    write counts and write byte-volume so deployment/patch bursts do not mask anomalies. ICS applications
    are highly deterministic in the files and keys they touch, so a write to a path the process has essentially
    never used is a strong anomaly. A positive result is a rare path write or a write-count/volume outlier
    that may indicate native-API-driven tampering or staging; a negative result is write activity consistent
    with the application's established baseline.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - 'NAI: File systems and registries of critical ICS assets, including Engineering Workstations (EWS),
    Human-Machine Interfaces (HMI), and Application Servers. Specifically monitor critical directories
    (''C:\Windows\System32'', application installation folders) and registry hives (''HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'').'
  range: Last 90 days; compare against a 30-day rolling baseline
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline_30d per app: write_path_freq, per_path_write_count, per_path_write_bytes
        alert if rarity(path) >= p99
        Mi = 0.6745*(x - median)/MAD  // per-path count and bytes
        escalate if |Mi| > 3.5
- question: When evaluated by a character-level autoencoder trained on each critical application's normal
    write paths (and complemented by provenance-graph models), do observed file/registry write paths register
    high reconstruction error indicating syntactically anomalous or algorithmically generated paths?
  context: Train a character-level autoencoder on the corpus of file/registry paths normally written by
    each critical ICS application; a high reconstruction error flags syntactically anomalous (randomized
    or algorithmically generated) paths, with the highest-error path tokens surfaced for explainability
    per CrowdStrike's embedding-based anomaly detection. Complement this with provenance-graph models
    (KAIROS / MAGIC) that detect the process->native-API->file/registry edge as anomalous; see ICS-domain
    guidance in Luo et al. for model selection on EWS/HMI/SCADA telemetry. A positive result is a write
    path the autoencoder cannot reconstruct (e.g., a randomized dropper path) or a provenance edge flagged
    as anomalous, both consistent with native-API abuse; a negative result is a path that reconstructs
    cleanly and fits learned-normal causal structure.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4657
  - Sysmon Event ID 11
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - 'NAI: File systems and registries of critical ICS assets, including Engineering Workstations (EWS),
    Human-Machine Interfaces (HMI), and Application Servers. Specifically monitor critical directories
    (''C:\Windows\System32'', application installation folders) and registry hives (''HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'').'
  range: Last 90 days; models trained on benign write-path history
  queries:
  - technology: ML/pseudocode
    query: |-
      ae = CharAutoencoder.fit(normal_write_paths[app])
        if ae.reconstruction_error(path) > threshold:
          alert(path, highest_error_tokens)
  - technology: ML/Provenance-graph pseudocode
    query: |-
      G = build_provenance_graph(host_audit_telemetry)
        if KAIROS|MAGIC flags edge(process -> native_api -> file/registry):
          alert(anomalous_write_edge)
