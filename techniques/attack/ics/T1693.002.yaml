questions:
- question: '[Impair Process Control] Validate module firmware transfer sessions: Can you determine whether
    a firmware or module-image transfer to a critical ICS asset (PLC, RTU, or a modular Ethernet/communication/I/O
    card within a field device) uses TFTP, FTP, SSH/SCP, HTTP, or a similar update path from a source
    that is not an approved engineering workstation or vendor host, occurs outside the maintenance window,
    or matches a file hash, name, size, or entropy that is not expected for that module family. The transfer
    pattern is consistent with an unauthorized module reflash rather than routine maintenance and indicates
    module-level tampering. -- specifically, by applying the ''Validate module firmware transfer sessions''
    approach (Symbolic Logic)?'
  context: 'Why this matters: Under the Impair Process Control tactic (TA0106), an adversary installs
    malicious or vulnerable firmware onto a modular hardware device (such as the Ethernet/communication/I/O
    card inside a PLC or RTU), which can grant persistent, low-visibility access and enable delayed, random,
    or worm-like attacks against the physical process. This evidence centers on the condition that A firmware
    or module-image transfer to a critical ICS asset (PLC, RTU, or a modular Ethernet/communication/I/O
    card within a field device) uses TFTP, FTP, SSH/SCP, HTTP, or a similar update path from a source
    that is not an approved engineering workstation or vendor host, occurs outside the maintenance window,
    or matches a file hash, name, size, or entropy that is not expected for that module family. The transfer
    pattern is consistent with an unauthorized module reflash rather than routine maintenance and indicates
    module-level tampering. The ''Validate module firmware transfer sessions'' approach (Symbolic Logic)
    works as follows: Correlate Zeek conn.log, Zeek files.log, and the protocol logs for TFTP, FTP, SSH/SCP,
    and HTTP against an allowlist of engineering hosts, vendor hosts, target modules, designated transfer
    protocols, and maintenance windows. Identify firmware-like files by magic-byte/file signature and
    extension per [Costin et al. (large-scale firmware analysis)](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf),
    and treat source/destination/protocol allowlisting and maintenance-window enforcement as deterministic
    OT controls per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    Alert when a firmware-like file is transferred from an unapproved source, over a non-designated protocol,
    or when the file metadata matches a disallowed module image. A positive result -- a rule match, statistical
    outlier, or model alert -- is a strong indicator of module-level firmware tampering or its aftermath;
    pivot to the source and destination hosts, the targeted module and its parent field device, the transfer
    protocol and file metadata (hash/name/size/entropy/signature), the timing relative to the maintenance
    window, and the device''s subsequent OT polling behavior to scope the compromise. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since a sophisticated actor may stage a delayed attack, mimic an approved source, or reflash
    within a maintenance window to evade any single method.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek files.log
  - Zeek tftp.log
  - Zeek ftp.log
  - Zeek ssh.log
  - Zeek http.log
  - Windows Event ID 4688
  - 'NAI: Network taps monitoring north-south traffic between the enterprise network and the PCN, and
    east-west traffic within the PCN, particularly segments containing critical controllers and Engineering
    Workstations (EWS).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic OT control: correlate transfer/protocol logs against allowlists\nfiles =\
      \ load(Zeek files.log, conn.log, tftp/ftp/ssh/http logs)\nfw = files where (magic_bytes is firmware\
      \ OR ext in firmware_exts)\nalert if fw.src NOT in approved_eng_or_vendor_hosts\n      OR fw.dst\
      \ NOT in target_module_allowlist\n      OR fw.proto NOT in designated_transfer_protocols\n     \
      \ OR fw.time NOT in maintenance_window\n      OR fw.sha256 NOT in per_model_golden_hashes\n    \
      \  OR fw.code_signature invalid\n      OR module attestation/measurement mismatch\nemit {src,dst,module,proto,sha256,signed,window}\
      \ for triage"
