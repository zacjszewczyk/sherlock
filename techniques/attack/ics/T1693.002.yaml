    outside maintenance periods per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    Derive per-model thresholds from at least 6 months of update history. A positive result -- a rule
    match, statistical outlier, or model alert -- is a strong indicator of module-level firmware tampering
    or its aftermath; pivot to the source and destination hosts, the targeted module and its parent field
