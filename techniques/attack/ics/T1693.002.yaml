name: 'T1693.002: Module Firmware'
id: 1bc8ddec-589b-4c09-9277-ee54b22b7db0
description: 'This playbook helps an analyst investigate whether an adversary has installed malicious
  or vulnerable firmware onto modular hardware devices within an ICS environment (MITRE ATT&CK T1693.002,
  Module Firmware). Control system field devices -- PLCs, RTUs, and the modular Ethernet/communication/I/O
  cards inside them -- often run their own firmware that is separate from, and less rigorously integrity-checked
  than, the main controller firmware, making the modules (especially the network-facing Ethernet card)
  an attractive foothold for delayed attacks, device bricking, random/timed failures, field-device worms,
  and pivoting to other cards such as the CPU module. The hunt pursues this behavior from two complementary
  angles. First, it scrutinizes module/firmware-image transfer sessions: firmware-like files moved over
  TFTP, FTP, SSH/SCP, or HTTP from sources that are not approved engineering workstations or vendor hosts,
  outside maintenance windows, or with unexpected hash/name/size/entropy, and validates code signatures,
  golden-image hashes, and device attestation to confirm authenticity. Second, it watches for the downstream
  effects of a successful or failed reflash: a module that stops answering expected polls/heartbeats,
  descends into repeated resets and timeouts, or begins emitting new listeners, protocols, or egress destinations
  absent from its baseline. Detection methods combine deterministic symbolic-logic controls (source/destination/protocol
  allowlisting, maintenance-window enforcement, signature/hash/attestation verification, semantic OT command/response
  pairing, post-update listener and egress alerting), statistical baselining (image size and Shannon-entropy
  profiling, transfer frequency and source diversity, failed/blocked transfer rates, traffic-drop and
  recovery-time z-scores, protocol exception and poll-timeout rates, periodicity phase-shift analysis),
  and machine learning (Isolation Forest/Random Forest anomalous-update scoring and time-series anomaly
  models distinguishing benign reboots from bricked/unstable states, both with SHAP/feature-importance
  attribution), applied across Zeek conn/files/tftp/ftp/ssh/http and OT protocol logs (dnp3, modbus, cip,
  dns) plus Windows process-creation events, so the analyst can corroborate suspected module-level tampering
  against host, network, protocol, and behavioral context.'
type: technique
related:
- tactic_id: TA0106
  tactic_name: Impair Process Control
