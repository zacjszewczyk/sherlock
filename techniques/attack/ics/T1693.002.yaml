  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per-model baseline (>=6 months history) then deviation test\nbaseline = stats by (device_model,\
      \ module) over training_window:\n    mean/std of {image_size_bytes, shannon_entropy}\n    p99 of\
      \ {transfer_count, source_diversity, failed_xfer_rate}\n    p95 of {recovery_time, traffic_drop}\n\
      for each event e:\n    z_size = (e.size - mean_size)/std_size\n    z_ent  = (e.entropy - mean_entropy)/std_entropy\n\
      \    alert if abs(z_size) > 3 OR abs(z_ent) > 3\n          OR e.transfer_count > p99 OR e.source_diversity\
      \ > p99\n          OR e.failed_xfer_burst precedes successful_xfer\n          OR clustered outside\
      \ maintenance_periods"
