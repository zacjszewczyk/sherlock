questions:
- question: Did a write command targeting a critical control-system parameter (e.g., a Modbus holding
    register for a turbine speed setpoint or a DNP3 analog output for a valve position) come from a source
    IP or user account that is not on the authorized asset/user allowlist, set a value outside documented
    engineering safety limits, or violate a known physical process invariant?
  context: 'Tied to Impact (TA0105): an adversary who can write out-of-bounds or invariant-violating values
    to ICS parameters can drive equipment and processes to dangerous states, producing loss of productivity,
    revenue, or physical damage. Maintain allowlists of source IPs, user accounts, and critical parameter
    addresses with documented safe ranges, and encode physical process invariants (per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    [Adepu & Mathur](https://link.springer.com/chapter/10.1007/978-3-319-33630-5_7), and the auto-generated
    semantic rules of [Mohan et al.](https://arxiv.org/abs/2412.07917)). Alert when a write originates
    from a non-allowlisted source, sets a value outside its safe range, or violates an invariant; suppress
    writes that match an open, authorized change ticket within its maintenance window. A positive result
    — an unauthorized or out-of-range write — is high-fidelity evidence of malicious parameter modification;
    a negative result means observed writes stayed within authorized sources and safe bounds.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Historian Process Data
  - Change Management System Logs
  - 'NAI: ICS Control Network (Purdue Model Levels 1 & 2) for PLC/RTU traffic; Engineering Workstations
    (EWS) and HMIs for host logs and command origination context; Process Historian servers for correlating
    network events with physical process impact.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ICS_WRITE = modbus.log OR dnp3.log OR enip.log OR s7comm.log where op == 'write'\njoin Event4624\
      \ on src_host to resolve user\nalert if (src_ip NOT in AUTH_IP_ALLOWLIST OR user NOT in AUTH_USER_ALLOWLIST)\n\
      \   OR (param_addr in CRITICAL_PARAMS AND (value < safe_min[param] OR value > safe_max[param]))\n\
      \   OR violates_invariant(param_addr, value)\nsuppress if open_change_ticket(param_addr, now) AND\
      \ now in maintenance_window"
- question: For each critical ICS parameter, does the written value or the write frequency deviate sharply
    from its 30-day rolling baseline — specifically a value beyond 3 standard deviations from the mean
    or a write rate above the 99th percentile?
  context: 'Tied to Impact (TA0105): subtle manipulation may stay within hard safety limits yet still
    deviate strongly from normal operating values or cadence. Baseline written values and writes/hour
    per parameter over 30 days and flag values beyond 3 standard deviations or write frequency above the
    99th percentile (per [Marsden et al.](https://arxiv.org/abs/1711.02826) PRI-IDS and the feature distributions
    of [Anton et al.](https://arxiv.org/abs/1907.10374)), enriching each event with the originating parent
    process from Windows Event ID 4688. Derive per-parameter thresholds from benign captures such as those
    indexed by [Conti et al.](https://arxiv.org/abs/2102.05631) A positive result flags a statistically
    anomalous value or burst worth correlating with process effects; a negative result indicates the write
    is consistent with historical norms.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Historian Process Data
  - Change Management System Logs
  - 'NAI: ICS Control Network (Purdue Model Levels 1 & 2) for PLC/RTU traffic; Engineering Workstations
    (EWS) and HMIs for host logs and command origination context; Process Historian servers for correlating
    network events with physical process impact.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for param in CRITICAL_PARAMS:\n  mu, sigma = mean_std(values[param], window=30d)\n  p99 =\
      \ percentile(writes_per_hour[param], 99, window=30d)\nalert if abs(value - mu) > 3*sigma OR writes_last_hour[param]\
      \ > p99\nenrich with parent_process from Event4688"
- question: Is there a spike of failed or rejected ICS writes and protocol exceptions (e.g., Modbus exception
    0x03 illegal data value) or failed Windows logons (Event ID 4625) from a single source, particularly
    one immediately followed by a successful out-of-range write?
  context: 'Tied to Impact (TA0105): probing and trial-and-error often precede a successful malicious
    write. Track per-source counts of protocol exception responses, rejected writes, and failed logons
    (Event ID 4625) as a distinct probing signal and alert on a spike of failures followed by a successful
    out-of-range write (per [Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf)).
    A positive result — a failure burst that resolves into a successful anomalous write — strongly suggests
    adversary experimentation against the controller; a negative result indicates writes are succeeding
    cleanly without abnormal error rates.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Historian Process Data
  - Change Management System Logs
  - 'NAI: ICS Control Network (Purdue Model Levels 1 & 2) for PLC/RTU traffic; Engineering Workstations
    (EWS) and HMIs for host logs and command origination context; Process Historian servers for correlating
    network events with physical process impact.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EXC = protocol exception responses (e.g., modbus exception==0x03) per src

      FAIL = rejected writes + Event4625 per src

      baseline mean failures/src; alert if failures > p99

      escalate if failure_spike(src) THEN successful_out_of_range_write(src) within 10m'
- question: When a classifier scores ICS write traffic, do the protocol features (function code, register
    address, written value, timing), user identity, parent process, and time context indicate a malicious
    parameter modification — and which top features drove that decision?
  context: 'Tied to Impact (TA0105): deterministic rules can miss novel or blended attacks, so an explainable
    ML layer adds coverage. Train a Random Forest on protocol features (function code, register address,
    written value, timing), user identity, parent process, and time context, surfacing the top-3 feature
    contributions in alert text (per [Anton et al.](https://arxiv.org/abs/1907.10374)), and corroborate
    with a process-aware model that flags the physical effects of the write (per [Kravchik & Shabtai](https://arxiv.org/abs/1806.08110)).
    Treat ML as a parallel layer above the deterministic rules given the evasion risk demonstrated by
    [Erba et al.](https://arxiv.org/abs/1907.07487) A positive result is a high-confidence, explainable
    classification of a write as malicious that should be triaged against the rule-based floor; a negative
    result lowers but does not eliminate suspicion.'
  answer_sources:
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Historian Process Data
  - Change Management System Logs
  - 'NAI: ICS Control Network (Purdue Model Levels 1 & 2) for PLC/RTU traffic; Engineering Workstations
    (EWS) and HMIs for host logs and command origination context; Process Historian servers for correlating
    network events with physical process impact.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [func_code, reg_addr, written_value, inter_write_dt, user, parent_proc, hour]

      model = RandomForest.train(labeled_writes)

      score = model.predict_proba(features); alert if score >= threshold

      emit top3 = shap_or_importance(features)

      corroborate with process_aware_model(physical_effect); keep deterministic rule as floor'
- question: Does an ICS 'Write' command set a critical parameter (e.g., a PLC register for a pump setpoint)
    to a value outside its predefined, documented safe operating range or that violates an encoded physical
    process invariant?
  context: 'Tied to Impair Process Control (TA0106): writing values outside safe ranges or violating invariants
    directly disrupts control logic and the physical process. Maintain a watchlist of critical parameter
    addresses with documented safe ranges and encode physical process invariants, then alert when a write
    sets a value outside the safe range or violates an invariant (per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    [Adepu & Mathur](https://link.springer.com/chapter/10.1007/978-3-319-33630-5_7), and [Sen et al.](https://arxiv.org/abs/2209.04354)).
    A positive result is a deterministic, high-fidelity indication of an unsafe parameter change; a negative
    result means the value remained within documented bounds.'
  answer_sources:
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN) Segments, PLC/RTU Controllers, SCADA Servers, Data Historians'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WRITE = modbus.log OR s7comm.log OR dnp3.log OR enip.log where op=='write'\nfor w in WRITE\
      \ where w.param in CRITICAL_PARAMS:\n  alert if w.value < safe_min[w.param] OR w.value > safe_max[w.param]\n\
      \       OR violates_invariant(w.param, w.value)"
- question: Over a 90-day baseline of written values per parameter, does a new write value exceed 3 standard
    deviations from that parameter's historical mean?
  context: 'Tied to Impair Process Control (TA0106): statistically anomalous values can signal manipulation
    even within nominal safety limits. Baseline written values per parameter over 90 days and alert when
    a new value exceeds 3 standard deviations from the mean, following the per-message value distributions
    of [Anton et al.](https://arxiv.org/abs/1907.10374) and the probabilistic transaction modeling of
    [Marsden et al.](https://arxiv.org/abs/1711.02826); derive thresholds from datasets indexed by [Conti
    et al.](https://arxiv.org/abs/2102.05631) A positive result is a value far outside normal operating
    distribution that warrants investigation; a negative result indicates the value is statistically typical.'
  answer_sources:
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN) Segments, PLC/RTU Controllers, SCADA Servers, Data Historians'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for param in PARAMS:\n  mu, sigma = mean_std(written_values[param], window=90d)\nalert if\
      \ abs(new_value - mu[param]) > 3*sigma[param]"
- question: When an anomaly model scores historical written values for a parameter, does the current write
    fall in the top 1st percentile of anomaly scores, and does a process-aware reconstruction-error detector
    corroborate an abnormal physical effect?
  context: 'Tied to Impair Process Control (TA0106): rare value modifications can be caught by unsupervised
    models. Train an Isolation Forest on historical written values and alert on the top 1st percentile
    of anomaly scores; corroborate with a process-aware PCA reconstruction-error detector that surfaces
    the top contributing process variables (per [Kravchik & Shabtai](https://arxiv.org/abs/1907.01216)),
    keeping the deterministic range rule as the floor given the evasion risk in [Erba et al.](https://arxiv.org/abs/1907.07487)
    A positive result is a rare, model-flagged value with corroborating process impact; a negative result
    means the value is unremarkable to the models, though the deterministic rule still applies.'
  answer_sources:
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN) Segments, PLC/RTU Controllers, SCADA Servers, Data Historians'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'if = IsolationForest.train(written_values[param])

      score = if.anomaly_score(new_value); alert if score in top 1 percentile

      pca = PCA.train(process_vars); err = recon_error(current_state)

      corroborate if err high; emit top contributing process variables; keep range rule as floor'
- question: Is an ICS 'Write' command observed originating from a source IP that is not on the documented
    allowlist of authorized Engineering Workstations (EWS) or Human-Machine Interfaces (HMIs), or using
    a function code not permitted for that source?
  context: 'Tied to Impair Process Control (TA0106): legitimate parameter writes should come only from
    sanctioned EWS/HMI hosts. Maintain a watchlist of authorized EWS/HMI IPs and the permitted function
    codes per source, and alert on write commands from sources not on the list (per the command-allowlisting
    guidance of [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    and the source/destination flow rules of [Mohan et al.](https://arxiv.org/abs/2412.07917)). A positive
    result — a write from an unauthorized host or an unexpected function code — indicates a rogue device
    or compromised foothold issuing control commands; a negative result confirms writes came from sanctioned
    engineering stations.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: IT/OT Network Boundary, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Remote
    Access VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "WRITE = ics protocol logs where op=='write'\nalert if WRITE.src_ip NOT in AUTH_EWS_HMI_IPS\n\
      \     OR WRITE.func_code NOT in PERMITTED_FUNCS[WRITE.src_ip]"
- question: Does an ICS write command originate from a source IP in the bottom 1st percentile of historical
    write frequency or from a first-seen source over a 90-day baseline?
  context: 'Tied to Impair Process Control (TA0106): a host that almost never (or has never) issued writes
    suddenly doing so is suspicious even if not yet blocklisted. Baseline write frequency per source IP
    over 90 days and alert when a write originates from a source in the bottom 1st percentile of historical
    frequency or from a first-seen source, following the low-probability transaction approach of [Marsden
    et al.](https://arxiv.org/abs/1711.02826) (PRI-IDS). A positive result is a rare or novel write source
    warranting validation against the asset inventory; a negative result indicates the source routinely
    issues writes.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: IT/OT Network Boundary, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Remote
    Access VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq[src] = count(writes by src, window=90d)

      p1 = percentile(freq.values, 1)

      alert if freq[src] <= p1 OR src is first_seen(write)'
- question: Is there a spike of Modbus/DNP3 exception responses and rejected or failed writes from a single
    source that precedes a subsequently successful write?
  context: 'Tied to Impair Process Control (TA0106): error responses concentrated at one source can reveal
    an adversary probing function codes or address ranges. Count Modbus/DNP3 exception responses and rejected/failed
    writes per source as a distinct probing signal, alerting on a failure spike that precedes a successful
    write (per [Mitchell & Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf)). A positive
    result — a burst of protocol errors followed by a clean write from the same source — indicates reconnaissance
    that culminated in a control action; a negative result shows writes succeeding without abnormal error
    rates.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: IT/OT Network Boundary, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Remote
    Access VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ERR[src] = count(exception_responses + rejected_writes) per src, sliding window

      baseline mean/std; alert if ERR[src] spikes above p99

      escalate if spike(src) THEN successful_write(src) within window'
- question: When ICS-targeting connections are clustered on conn.log features, are write-command connections
    classified as outlier (noise) points — and which features (peer, port, duration, bytes) make them
    anomalous?
  context: 'Tied to Impair Process Control (TA0106): unsupervised clustering can surface control traffic
    that does not fit any normal communication group. Train DBSCAN on conn.log features for ICS-targeting
    traffic and alert when write-command connections are classified as noise points, surfacing the contributing
    features (peer, port, duration, bytes) in the alert, consistent with the network-level ML detection
    reviewed by [Umer et al.](https://arxiv.org/abs/2202.11917) A positive result is a write connection
    that lies outside all established communication clusters and merits triage; a negative result means
    the connection fits a known, benign traffic pattern.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: IT/OT Network Boundary, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Remote
    Access VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = conn.log[peer, resp_port, duration, orig_bytes, resp_bytes] for ICS flows

      labels = DBSCAN(eps, min_samples).fit(features)

      alert if write_conn.label == -1 (noise)

      emit contributing features per flow'
- question: Is an ICS 'Write' command from an authorized EWS/HMI preceded within 5 minutes by a successful
    Windows logon (Event ID 4624) on that same host from a forbidden user account or a non-allowlisted
    source?
  context: 'Tied to Impair Process Control (TA0106): even an authorized host can be abused if the interactive
    session belongs to an unauthorized user. Correlate Event ID 4624 logons on EWS/HMI with write commands
    within 5 minutes and alert if the prior logon is from a forbidden user account or a non-allowlisted
    source (per access-control guidance in [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    A positive result links a control write to an unauthorized session and is strong evidence of account
    misuse; a negative result confirms the write followed an authorized logon.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for w in WRITE from AUTH_EWS_HMI:\n  logon = last Event4624 on w.host within 5m before w.time\n\
      \  alert if logon.user in FORBIDDEN_USERS OR logon.src NOT in ALLOWLIST"
- question: Does a write command follow an off-hours logon that falls in a user's 99th-percentile of off-hours
    activity, and are there elevated failed logons (Event ID 4625) for that account?
  context: 'Tied to Impair Process Control (TA0106): off-hours control activity and credential probing
    are classic precursors to misuse. Baseline normal logon hours per user over 90 days and alert when
    a write follows an off-hours logon in the user''s 99th percentile of off-hours activity, while tracking
    failed logons (Event ID 4625) per account as a distinct credential-probing signal (per [Mitchell &
    Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf)). A positive result — an unusual-hours
    session driving a write, especially alongside failed-logon spikes — indicates possible account compromise;
    a negative result shows the activity matches the user''s normal schedule.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for user: hist = logon_hour_distribution(user, 90d)

      off_hours = hours below p1/above p99 of hist

      alert if write follows logon in off_hours[user]

      track Event4625 count per account; flag spike as credential probing'
- question: When an autoencoder scores user-session features (from Event ID 4624 and conn.log) for sessions
    preceding ICS writes, do any sessions show high reconstruction error, and what are the top contributing
    features?
  context: 'Tied to Impair Process Control (TA0106): anomalous sessions can be detected even when no single
    rule fires. Train an autoencoder on user-session features from Event ID 4624 and conn.log, score recent
    sessions preceding writes, and alert on high reconstruction error while surfacing the top-3 contributing
    features; treat the score as a parallel layer above the deterministic correlation rule (per [Umer
    et al.](https://arxiv.org/abs/2202.11917) and the evasion findings of [Erba et al.](https://arxiv.org/abs/1907.07487)).
    A positive result is a session that deviates strongly from learned-normal behavior and ties to a control
    write; a negative result indicates the session resembles normal activity.'
  answer_sources:
  - Windows Event ID 4624
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'session_feats = join(Event4624, conn.log) per user-session preceding writes

      ae = Autoencoder.train(normal_sessions)

      err = ae.reconstruction_error(recent_session); alert if err > threshold

      emit top3 contributing features; run parallel to deterministic correlation rule'
- question: Is a single critical control parameter subjected to a rapid burst of writes — for example
    more than 10 writes within 60 seconds — suggesting oscillatory manipulation or denial of control?
  context: 'Tied to Impair Process Control (TA0106): rapidly toggling a setpoint can destabilize a process
    or deny operators control. Use a static threshold (e.g., >10 writes in 60 seconds) per critical parameter
    and alert when exceeded, consistent with the bounded write-rate expectations of predictable OT traffic
    in [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    A positive result is an abnormal write burst against one parameter that warrants immediate review;
    a negative result indicates write cadence stayed within expected bounds.'
  answer_sources:
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: PLC/RTU Controllers, Process Control Network (PCN) Segments, SCADA/Historian Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for param in CRITICAL_PARAMS:\n  count = writes[param] in sliding 60s window\n  alert if count\
      \ > 10"
- question: Does the current write frequency for a parameter exceed the 99th percentile of its writes-per-minute
    computed over a 90-day baseline?
  context: 'Tied to Impair Process Control (TA0106): an adaptive, per-parameter rate threshold catches
    abnormal bursts that a single static value would miss. Compute the 99th percentile of writes/minute
    per parameter over 90 days and alert when current frequency exceeds the baseline (per the transaction-probability
    modeling of [Marsden et al.](https://arxiv.org/abs/1711.02826)); derive per-parameter rates from datasets
    indexed by [Conti et al.](https://arxiv.org/abs/2102.05631) A positive result is a parameter being
    written far faster than its historical norm; a negative result indicates normal write cadence.'
  answer_sources:
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: PLC/RTU Controllers, Process Control Network (PCN) Segments, SCADA/Historian Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for param in PARAMS:\n  p99 = percentile(writes_per_minute[param], 99, window=90d)\nalert\
      \ if current_writes_per_minute[param] > p99"
- question: When a time-series forecaster predicts a parameter or related process value, do rapid writes
    drive the value persistently outside the model's confidence interval, and which point is affected?
  context: 'Tied to Impair Process Control (TA0106): forecasting models can detect forced or oscillatory
    changes that push the process off its expected trajectory. Train a time-series forecaster (seq2seq/CNN)
    on historical parameter and process values and alert when rapid writes drive values persistently outside
    the model''s confidence interval, localizing the affected point (per [Kim et al.](https://arxiv.org/abs/1911.04831)
    and [Kravchik & Shabtai](https://arxiv.org/abs/1806.08110)); corroborate with an unsupervised DNN/OCSVM
    detector (per [Inoue et al.](https://arxiv.org/abs/1709.05342)). A positive result is a sustained
    departure from predicted behavior tied to write activity, pinpointing the manipulated point; a negative
    result indicates the value tracks its forecast.'
  answer_sources:
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek dnp3.log
