name: 'T0836: Modify Parameter'
id: 6b5e78e6-9331-4d00-9790-3e90444f75a7
description: Investigate suspected modification of industrial control system (ICS) parameters — the values
  that instruct PLCs, RTUs, and other controllers how and when to act (e.g., motor run-time, pump/valve
  setpoints, turbine speed). Adversaries may write dangerous, out-of-bounds, or invalid parameter values
  to damage equipment, disrupt control processes, and cause loss of productivity, revenue, or safety (Impact,
  TA0105), or to impair process control more directly (Impair Process Control, TA0106). This playbook
  helps an analyst examine ICS protocol write operations (Modbus, DNP3, EtherNet/IP, S7comm) for values
  that fall outside documented engineering safety limits, violate physical process invariants, deviate
  from statistical baselines, originate from unauthorized source IPs or user accounts, occur outside maintenance
  windows, or arrive as rapid oscillatory write bursts. It correlates network protocol evidence with host
  authentication (Windows Event IDs 4624/4625/4688), historian process data, and change-management records,
  and layers symbolic-logic allowlists/invariant checks, statistical baselining of values and write frequency,
  and explainable machine-learning anomaly detection to surface malicious parameter modification while
  remaining resilient to evasion.
type: technique
related:
- tactic_id: TA0105
  tactic_name: Impact
- tactic_id: TA0106
  tactic_name: Impair Process Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
