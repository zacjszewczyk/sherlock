questions:
- question: '[Inhibit Response Function] Unauthorized alarm file change: Can you determine whether an
    unauthorized user account or an unexpected process modifies, deletes, or renames a critical alarm
    configuration file or executable on an HMI, EWS, or SCADA server, particularly outside of a scheduled
    maintenance window. -- specifically, using the ''Unauthorized alarm file change'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Inhibit Response Function tactic, an adversary suppresses protection-function
    alarms so that operators are not notified of dangerous process conditions, hindering safety, protection,
    and operator-intervention safeguards and often masking concurrent Impact activity. This evidence focuses
    on the condition that An unauthorized user account or an unexpected process modifies, deletes, or
    renames a critical alarm configuration file or executable on an HMI, EWS, or SCADA server, particularly
    outside of a scheduled maintenance window. The ''Unauthorized alarm file change'' approach (Symbolic
    Logic) works as follows: Maintain a list of critical alarm-related file paths (e.g., C:\SCADA\Alarms.xml,
    alarm_service.exe, alarm DB/config) and a whitelist of authorized accounts/processes and maintenance
    windows, per OT allow-listing guidance in [Guide to Operational Technology (OT) Security (NIST SP
    800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf). Alert on Windows
    Event ID 4663 where Object Name matches a critical file, Accesses includes ''WriteData''/''DELETE''/''AppendData'',
    and SubjectUserName or ProcessName is not whitelisted, or the event falls outside an approved change
    window (state: success vs failed access via 4656 audit failures). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable alarm suppression; pivot to the responsible
    host, account, process, or source IP, the targeted alarm file/service/register or process variable,
    and the timing relative to maintenance windows and any concurrent process disturbance to scope whether
    operators were actually deprived of a needed alarm. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land suppression.'
