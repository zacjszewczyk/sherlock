    renames a critical alarm configuration file or executable on an HMI, EWS, or SCADA server, particularly
    outside of a scheduled maintenance window. The ''Spike in alarm file modifications'' approach (Statistical
    Method) works as follows: For each critical host, baseline hourly counts of alarm-file modifications
    (Event ID 4663) over 30 days and alert when the current hourly count exceeds the 99th percentile (Volume/Frequency).
    Apply a stateful CUSUM change-point test to the per-host modification rate to catch slow, low-volume
    tampering that stays under the per-hour cap, following the stateful-vs-stateless detector design of
    [Limiting the Impact of Stealthy Attacks on Industrial Control Systems, Urbina et al.](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf).
    Derive dataset-specific thresholds from your own 30-90 day history. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable alarm suppression; pivot to the responsible
    host, account, process, or source IP, the targeted alarm file/service/register or process variable,
    and the timing relative to maintenance windows and any concurrent process disturbance to scope whether
    operators were actually deprived of a needed alarm. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land suppression.'
