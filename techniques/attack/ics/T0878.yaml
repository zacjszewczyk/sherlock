- question: '[Inhibit Response Function] Alarm delay, flat-line and CUSUM residual detection: Can you
    determine whether a critical process variable (e.g., temperature, pressure) monitored via ICS network
    traffic exceeds its defined alarm threshold for a sustained period, while the expected corresponding
    alarm event is absent from the alarm server''s application logs within a predefined time window. --
    specifically, using the ''Alarm delay, flat-line and CUSUM residual detection'' (Statistical Method)
    approach?'
  context: 'Why this matters: Under the Inhibit Response Function tactic, an adversary suppresses protection-function
    alarms so that operators are not notified of dangerous process conditions, hindering safety, protection,
    and operator-intervention safeguards and often masking concurrent Impact activity. This evidence focuses
    on the condition that A critical process variable (e.g., temperature, pressure) monitored via ICS
    network traffic exceeds its defined alarm threshold for a sustained period, while the expected corresponding
    alarm event is absent from the alarm server''s application logs within a predefined time window. The
    ''Alarm delay, flat-line and CUSUM residual detection'' approach (Statistical Method) works as follows:
    Baseline the time delta between a threshold breach (Zeek) and the corresponding alarm log and alert
    when an observed delay exceeds mean+3 std (Frequency/State). Apply an SPC chart to detect PV values
    held abnormally static just below an alarm setpoint (''flat-lining''). Add a stateful CUSUM/MPC-residual
    test on PV trajectories so slow, stealthy suppression that keeps each sample under the threshold still
    accumulates and triggers, per [Limiting the Impact of Stealthy Attacks on Industrial Control Systems,
    Urbina et al.](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf) and [A Physics-Based Attack
    Detection Technique in CPS, Chamanbaz et al.](https://arxiv.org/abs/1910.03162). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable alarm suppression; pivot
    to the responsible host, account, process, or source IP, the targeted alarm file/service/register
    or process variable, and the timing relative to maintenance windows and any concurrent process disturbance
    to scope whether operators were actually deprived of a needed alarm. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land suppression.'
