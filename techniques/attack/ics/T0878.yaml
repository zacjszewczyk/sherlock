    stateful SIEM rule that alerts when a PV exceeds its threshold for a defined duration (>30 s) AND
    the corresponding alarm log is NOT present within a grace period (60 s) — this is a direct violation
    of a process/alarm invariant per [A Systematic Framework to Generate Invariants for Anomaly Detection
    in Industrial Control Systems, Feng et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf),
