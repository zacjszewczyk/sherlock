name: 'T0878: Alarm Suppression'
id: b280ae29-4b01-433d-8898-90fceb4d459c
description: 'This playbook helps an analyst investigate whether an adversary is suppressing protection-function
  alarms in an ICS/OT environment to prevent operators from being notified of critical, hazardous, or
  unsafe process conditions (MITRE ATT&CK ICS T0878, Alarm Suppression). Alarm suppression supports the
  Inhibit Response Function tactic and is frequently used to provide cover for, or follow through on,
  destructive Impact activity by ensuring expected alarms are never raised or never reach operators. The
  hunt pursues the behavior from several complementary angles: unauthorized modification, deletion, or
  renaming of critical alarm configuration files or executables on HMIs, EWS, SCADA, and historian servers
  (Windows object-access and process-creation auditing), including access-denied probing that precedes
  a successful tamper; unauthorized ICS network write commands (Modbus function codes 5/6/15/16, S7Comm
  Write Var) from non-whitelisted source IPs to PLC/RTU registers, coils, or memory that hold alarm states,
  thresholds, or suppression flags; process/alarm invariant violations where a critical process variable
  breaches its alarm threshold for a sustained period yet the expected alarm event is absent from the
  alarm server logs; and unexpected termination, disabling, or crashing of alarm management services together
  with the resulting loss of periodic alarm/heartbeat traffic. Detection methods combine deterministic
  symbolic-logic rules (critical-file and authorized-account/maintenance-window allow-listing, access-denied
  burst profiling, register/coil write whitelists, PV-vs-alarm-bit invariants, threshold-breach-without-alarm
  correlation, service stop/disable detection, and loss-of-heartbeat monitoring), statistical baselining
  (per-host modification-rate percentiles and CUSUM change-point tests, write-frequency and register-entropy
  anomalies, alarm-delay and flat-line SPC/CUSUM residual tests, and service downtime/crash-frequency
  outliers), and machine learning (Isolation Forest/one-class models with SHAP-style feature attribution,
  predictive 1D-CNN/Seq2Seq telemetry models for missed alarms, and FFT+PCA service-state/periodicity
  detectors), applied across Windows Event Logs, Zeek modbus/s7comm/conn logs, operational historian/alarm
  databases, and custom application logs, so the analyst can corroborate suspected alarm suppression against
  host, account, network, process, and physical-process context.'
type: technique
