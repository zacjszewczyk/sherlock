- question: '[Inhibit Response Function] Correlate service stops with suspicious inbound connections:
    Can you determine, using the ''Correlate service stops with suspicious inbound connections'' (Symbolic
    Logic) approach, whether a critical ICS service stop event (Windows Event ID 7036) is preceded within
    a 5-minute window by one or more anomalous inbound network connections to the same host, identified
    in Zeek conn.log. Anomalies include connections from rare source IPs, use of non-standard remote administration
    ports, or statistically unusual data transfer volumes.'
  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary stops
    or disables services to render them unavailable -- inhibiting safety, protection, monitoring, and
    operator-intervention functions or enabling damage and data destruction in the ICS environment. This
    evidence focuses on the condition that a critical ICS service stop event (Windows Event ID 7036) is
    preceded within a 5-minute window by one or more anomalous inbound network connections to the same
    host, identified in Zeek conn.log. Anomalies include connections from rare source IPs, use of non-standard
    remote administration ports, or statistically unusual data transfer volumes. The ''Correlate service
    stops with suspicious inbound connections'' approach (Symbolic Logic) works as follows: Upon a critical
    service stop (Windows Event ID 7036), query Zeek conn.log and dce_rpc.log for events where id.resp_h
    matches the host IP in the prior 5 minutes. Alert if: (a) id.orig_h is from untrusted/non-corporate
    IP space; (b) id.resp_p is a remote-admin port (3389, 5985, 445) and id.orig_h is not a designated
    jump host; OR (c) a dce_rpc.log event shows a Service Control Manager ("scmr") operation. This causal
    correlation of remote access with service control reflects layered ICS detection guidance in the [AI-based
    ICS IDS comparative study](https://arxiv.org/abs/2008.00088). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates a probable adversary service stop; pivot to the responsible host,
    the user/account and parent process that initiated the action, the targeted service and its criticality,
    the resulting service state (stopped vs crash vs access-denied), and any preceding remote access or
    command activity to scope impact and intent. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, living-off-the-land, or direct-API terminations.'
