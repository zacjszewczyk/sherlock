    any has a source IP in the bottom 5% of historical frequency, a total byte count above the 95th-percentile
    baseline (Volume), or an elevated count of failed/blocked connection attempts (conn_state S0/REJ —
    Failure-mode signal). OT-realistic process/network baselining is exemplified by the [HAI ICS dataset](https://www.usenix.org/conference/cset20/presentation/shin).
