    host, identified in Zeek conn.log. Anomalies include connections from rare source IPs, use of non-standard
    remote administration ports, or statistically unusual data transfer volumes. The ''Baseline inbound
    rarity and byte volume before stops'' approach (Statistical Method) works as follows: For each critical
    host maintain a 30-day rolling baseline from Zeek conn.log of (a) the frequency distribution of inbound
    source IPs (id.orig_h) and (b) the 95th percentile of connection bytes (orig_bytes+resp_bytes), using
    count/standard-deviation baselining ([Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)).
