name: 'T0881: Service Stop'
id: 285a0c7f-2a67-4c59-8fa4-fdbd73f669c0
description: 'This playbook helps an analyst investigate whether an adversary is stopping or disabling
  services to inhibit critical ICS response functions or further an Impact objective (MITRE ATT&CK for
  ICS T0881, Service Stop). Stopping safety, protection, monitoring, antivirus, backup, or database services
  on operational technology assets can blind operators, defeat safeguards, or enable Data Destruction
  by releasing locks on running data stores. The hunt pursues the behavior from several complementary
  angles on critical assets such as Engineering Workstations (EWS), Human Machine Interfaces (HMIs), Historian
  Servers, OPC Servers, Application Servers, Domain Controllers, and Jump Servers within the Process Control
  Network (PCN) or OT DMZ: process-creation events invoking service-control utilities (sc.exe, net.exe,
  PowerShell Stop-Service, taskkill.exe) correlated with actual service-state changes (Windows Event ID
  7036) for critical ICS services; ransomware-style mass stops of multiple protective services within
  a short window; user/parent-process/time baselining of legitimate stops; anomalous inbound network connections
  (Zeek conn.log/dce_rpc.log, remote-admin ports, SCM operations) preceding a stop; and the highest-fidelity
  signal of an unexplained ''stopped'' state with no preceding stop command and no service crash (Event
  ID 7034), indicating a direct-API or non-standard termination. Detection methods combine deterministic
  symbolic-logic rules (command-to-state correlation, mass-stop volume thresholds, negative lookbehind,
  remote-access correlation), statistical baselining (per-service user/parent/hour risk scoring, inbound
  rarity and byte-volume baselines, z-score and change-point detection of spontaneous stops), and machine
  learning (Isolation Forest on command-line features, autoencoder network anomaly detection, SARIMA/time-series
  forecasting, and LSTM/provenance-graph sequence modeling such as DeepLog and KAIROS), applied across
  Windows Security and Sysmon events and Zeek network logs so the analyst can corroborate a suspected
  service stop against host, user, process, network, and timing context.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
