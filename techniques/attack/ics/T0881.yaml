    a probable adversary service stop; pivot to the responsible host, the user/account and parent process
    that initiated the action, the targeted service and its criticality, the resulting service state (stopped
    vs crash vs access-denied), and any preceding remote access or command activity to scope impact and
    intent. A negative result helps rule out this particular vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, living-off-the-land, or
    direct-API terminations.'
