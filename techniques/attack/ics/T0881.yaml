questions:
- question: '[Inhibit Response Function] Correlate service stop commands with service stops: Can you determine,
    using the ''Correlate service stop commands with service stops'' (Symbolic Logic) approach, whether
    a process creation event (Windows Event ID 4688 or Sysmon Event ID 1) is recorded where the command
    line invokes a service stop utility (e.g., ''sc.exe stop'', ''net.exe stop'', ''Stop-Service'') targeting
    a critical ICS service. This is correlated with a subsequent service stop event (Windows Event ID
    7036) for the same service on the same host within a 15-second window.'
  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary stops
    or disables services to render them unavailable -- inhibiting safety, protection, monitoring, and
    operator-intervention functions or enabling damage and data destruction in the ICS environment. This
    evidence focuses on the condition that a process creation event (Windows Event ID 4688 or Sysmon Event
    ID 1) is recorded where the command line invokes a service stop utility (e.g., ''sc.exe stop'', ''net.exe
    stop'', ''Stop-Service'') targeting a critical ICS service. This is correlated with a subsequent service
    stop event (Windows Event ID 7036) for the same service on the same host within a 15-second window.
    The ''Correlate service stop commands with service stops'' approach (Symbolic Logic) works as follows:
    Join process creation events (Windows Event ID 4688/Sysmon Event ID 1) with service status events
    (Windows Event ID 7036) on Hostname within a 15-second window. Alert if: (a) ProcessName is "sc.exe",
    "net.exe", "powershell.exe", or "taskkill.exe" AND CommandLine matches stop/disable patterns (e.g.,
    "stop", " config "+"start"+"disabled", "/F") per the [SigmaHQ sc.exe disable rule](https://raw.githubusercontent.com/SigmaHQ/sigma/master/rules/windows/process_creation/proc_creation_win_sc_disable_service.yml);
    (b) the targeted service name matches the ServiceName in Event 7036 and is on a maintained list of
    critical ICS services; AND (c) the initiating user account is not on an approved admin list or the
    event is outside a pre-defined maintenance window. Escalate when the service-control utility is spawned
    by a script interpreter (cmd/powershell/wscript/cscript/mshta) per [Elastic: Service Control Spawned
    via Script Interpreter](https://www.elastic.co/guide/en/security/current/service-control-spawned-via-script-interpreter.html).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable adversary
    service stop; pivot to the responsible host, the user/account and parent process that initiated the
    action, the targeted service and its criticality, the resulting service state (stopped vs crash vs
    access-denied), and any preceding remote access or command activity to scope impact and intent. A
    negative result helps rule out this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land, or direct-API terminations.'
