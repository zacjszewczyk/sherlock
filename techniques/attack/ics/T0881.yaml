  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary stops
    or disables services to render them unavailable -- inhibiting safety, protection, monitoring, and
    operator-intervention functions or enabling damage and data destruction in the ICS environment. This
    evidence focuses on the condition that a process creation event (Windows Event ID 4688 or Sysmon Event
    ID 1) is recorded where the command line invokes a service stop utility (e.g., ''sc.exe stop'', ''net.exe
    stop'', ''Stop-Service'') targeting a critical ICS service. This is correlated with a subsequent service
    stop event (Windows Event ID 7036) for the same service on the same host within a 15-second window.
    The ''Baseline user and parent process for service stops'' approach (Statistical Method) works as
    follows: For each critical ICS service on each host, establish a 90-day baseline of legitimate stops
    (approved accounts) profiling user, parent process, and hour-of-day, using simple count/standard-deviation
    baselining as in [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).
    For each new stop generate a risk score: +1 if the user has never stopped this service, +1 if the
    parent process has never initiated a stop for this service, +1 if the time is in the bottom 5th percentile
    of historical stop times. Alert if cumulative score >=2. Include the top-3 contributing factors (e.g.,
    new user, new parent, off-hours) in the alert text. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates a probable adversary service stop; pivot to the responsible host,
    the user/account and parent process that initiated the action, the targeted service and its criticality,
    the resulting service state (stopped vs crash vs access-denied), and any preceding remote access or
    command activity to scope impact and intent. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, living-off-the-land, or direct-API terminations.'
