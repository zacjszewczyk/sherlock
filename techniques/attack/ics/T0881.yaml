    stop event (Windows Event ID 7036) for the same service on the same host within a 15-second window.
    The ''Detect ransomware-style mass service stops (Volume/Frequency)'' approach (Symbolic Logic) works
    as follows: Count DISTINCT critical/security services (antivirus, backup, database) transitioning
    to "stopped" (Event ID 7036) or being disabled (Event ID 4688 sc/net stop) on the same Hostname within
