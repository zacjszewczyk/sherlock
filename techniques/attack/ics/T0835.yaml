questions:
- question: '[Inhibit Response Function] Unauthorized force command and process check (Symbolic Logic):
    For the observed behavior -- A Modbus ''Force Single Coil'' (Function Code 5) or ''Force Multiple
    Coils'' (Function Code 15) command is observed where the source IP is not on an authorized Engineering
    Workstation (EWS) allowlist, OR the command originates from an unapproved process on an authorized
    EWS, OR the command is executed outside of a defined maintenance or operational window for the target
    PLC. -- how can an analyst apply the ''Unauthorized force command and process check'' approach (Symbolic
    Logic) to determine whether an adversary is manipulating the I/O image of a PLC (T0835) to inhibit
    its response function?'
  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary uses Manipulate
    I/O Image (T0835) to override the status of physical inputs or force the logic driving physical output
    coils, preventing a PLC from functioning as expected and inhibiting safety, protection, or operator
    intervention responses. This evidence focuses on: A Modbus ''Force Single Coil'' (Function Code 5)
    or ''Force Multiple Coils'' (Function Code 15) command is observed where the source IP is not on an
    authorized Engineering Workstation (EWS) allowlist, OR the command originates from an unapproved process
    on an authorized EWS, OR the command is executed outside of a defined maintenance or operational window
    for the target PLC. The ''Unauthorized force command and process check'' approach works as follows:
    Trigger on Zeek modbus.log events where ''function_code'' is 5 (Force Single Coil) or 15 (Force Multiple
    Coils). Alert if ANY of: (1) source IP (''id.orig_h'') not in the authorized EWS allowlist; (2) source
    is authorized but the correlated Windows Event ID 4688 ''ProcessName'' on the EWS is not in the approved
    engineering-software allowlist (e.g., Studio5000.exe, TIA Portal); (3) the command ''ts'' falls outside
    a documented maintenance/change window for the target PLC (''id.resp_h''). Deny-by-default conduit
    ACLs, command/protocol allowlisting, and change-window enforcement follow [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    encode valid function-code/source-destination/point relationships as semantic specification rules
    per [Distributed IDS using Semantic-based Rules for SCADA, Mohan et al.](https://arxiv.org/abs/2412.07917)
    and [Specification-based detection in smart grids, Sen et al.](https://arxiv.org/abs/2209.04354).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable forced/overridden
    I/O image; pivot to the source host (validate it against the Engineering Workstation allowlist and
    approved engineering software), the target PLC and affected coil/register/process tags, the timing
    relative to any documented maintenance or change window, and the corresponding physical sensor/actuator
    response, then correlate network writes with historian telemetry and PLC force/override diagnostics.
    A negative result lowers but does not eliminate suspicion -- overrides applied locally via engineering
    software or direct memory manipulation may leave no network command, so corroborate with the process-divergence
    checks. Keep deterministic symbolic-logic and CUSUM checks authoritative and run any ML strictly in
    parallel, never gating alerting on the model alone.'
