name: 'T0835: Manipulate I-O Image'
id: 12a14faf-2794-441f-b14a-088ca9794258
description: 'This playbook helps an analyst investigate whether an adversary is manipulating the I/O
  image of a Programmable Logic Controller (MITRE ATT&CK for ICS T0835, Manipulate I/O Image) to prevent
  it from functioning as expected and to inhibit safety, protection, quality-assurance, or operator-intervention
  response functions. During each scan cycle a PLC reads inputs into an image table, solves its logic,
  and writes the output image table to physical I/O modules; an adversary can override discrete inputs
  or force output coils via direct memory manipulation, the PLC''s test/override function, or unauthorized
  protocol writes. The hunt pursues this from several complementary angles: unauthorized or out-of-window
  Modbus Force Coil (FC5/FC15) and Preset Register (FC6/FC16) commands from hosts or processes not on
  the Engineering Workstation allowlist or writing values outside safe operational ranges; first-seen
  force/write behavior, out-of-sequence frames in periodic master-to-PLC traffic, and command-frequency
  spikes; and -- critically -- physical divergence where a PLC''s reported coil/register state or an actuator/sensor
  reading no longer matches what the running control logic should produce, including frozen/pinned points
  and outputs with no corresponding sensor response, which catches overrides applied locally with no visible
  network command. Detection methods combine deterministic symbolic-logic specification rules (allowlists,
  safe ranges, process invariants, DFA sequence/timing models), statistical baselining (per-pair percentile
  thresholds, 3-sigma register deviation, CUSUM residual accumulation, PCA/FFT loss-of-periodicity), and
  machine learning (Random Forest/gradient-boosting classifiers, Isolation Forest/autoencoder scoring,
  predict-then-residual deep models with SHAP explanations), applied across Zeek modbus/conn logs, Windows
  process and logon events, ICS/SCADA historian process tags, OPC-UA/Modbus polled I/O state, and PLC
  force-status diagnostics, so the analyst can corroborate a suspected forced I/O image against network,
  host, and physical-process context.'
type: technique
related:
