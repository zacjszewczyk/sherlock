    or ''Force Multiple Coils'' (Function Code 15) command is observed where the source IP is not on an
    authorized Engineering Workstation (EWS) allowlist, OR the command originates from an unapproved process
    on an authorized EWS, OR the command is executed outside of a defined maintenance or operational window
    for the target PLC. The ''Force command context anomaly model'' approach works as follows: Run a supervised
    Random Forest/Gradient Boosting classifier on FC5/15 events with features source IP, dest IP, function
    code, coil address, value, hour-of-day, day-of-week (Zeek), enriched with originating ''ProcessName''
    (Windows 4688). Surface the top-3 contributing features in alert text using feature importance / SHAP
    per [Anomaly-based Intrusion Detection with SVM and Random Forests, Duque Anton et al.](https://arxiv.org/abs/1907.10374)
    and [Explainable Anomaly Detection for ICS, Ha et al.](https://arxiv.org/abs/2205.01930). Alert at
    prediction probability > 0.9. Because supervised ML fails on novel attacks (>99%->3-15% on unknown
    attacks, [Kus et al.](https://arxiv.org/abs/2205.09199)), run this strictly in parallel with the symbolic
    and CUSUM checks above; never gate alerting on the model alone. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates a probable forced/overridden I/O image; pivot to
