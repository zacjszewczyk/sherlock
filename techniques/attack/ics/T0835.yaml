    authorized Engineering Workstation (EWS) allowlist, OR the command originates from an unapproved process
    on an authorized EWS, OR the command is executed outside of a defined maintenance or operational window
    for the target PLC. The ''Out-of-sequence force frame in periodic traffic'' approach works as follows:
    Build a per-PLC deterministic finite automaton (DFA) of the periodic master-to-PLC Modbus message
    sequence and inter-arrival timing, with automatic phase-shift handling, per [Temporal Phase Shifts
    in SCADA Networks, Kleinmann et al.](https://arxiv.org/abs/1808.05068). Alert when an FC5/15 force
    frame appears as an extra/out-of-sequence transition or violates the learned inter-arrival timing
    model, indicating an injected command rather than a scheduled engineering action. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates a probable forced/overridden I/O
    image; pivot to the source host (validate it against the Engineering Workstation allowlist and approved
    engineering software), the target PLC and affected coil/register/process tags, the timing relative
    to any documented maintenance or change window, and the corresponding physical sensor/actuator response,
