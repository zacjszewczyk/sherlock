  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary uses Manipulate
    I/O Image (T0835) to override the status of physical inputs or force the logic driving physical output
    coils, preventing a PLC from functioning as expected and inhibiting safety, protection, or operator
    intervention responses. This evidence focuses on: A Modbus ''Force Single Coil'' (Function Code 5)
    or ''Force Multiple Coils'' (Function Code 15) command is observed where the source IP is not on an
    authorized Engineering Workstation (EWS) allowlist, OR the command originates from an unapproved process
    on an authorized EWS, OR the command is executed outside of a defined maintenance or operational window
    for the target PLC. The ''Forced-coil physical divergence (residual/CUSUM)'' approach works as follows:
    After an FC5/15 force, verify the physical input that should accompany the new output state actually
    changes. Track the residual between the commanded/forced coil state and the corresponding sensor reading
    and apply a stateful CUSUM test that accumulates small persistent gaps, per [Limiting the Impact of
    Stealthy Attacks on ICS, Urbina et al.](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf); alert
    when the CUSUM statistic exceeds its tuned bound. This realizes the mined process-invariant ''output
    forced => expected input transitions'' from [A Systematic Framework to Generate Invariants for ICS,
    Feng et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf)
    (datasets SWaT/WADI). A positive result -- a rule match, statistical outlier, or model alert -- indicates
    a probable forced/overridden I/O image; pivot to the source host (validate it against the Engineering
    Workstation allowlist and approved engineering software), the target PLC and affected coil/register/process
    tags, the timing relative to any documented maintenance or change window, and the corresponding physical
    sensor/actuator response, then correlate network writes with historian telemetry and PLC force/override
    diagnostics. A negative result lowers but does not eliminate suspicion -- overrides applied locally
    via engineering software or direct memory manipulation may leave no network command, so corroborate
    with the process-divergence checks. Keep deterministic symbolic-logic and CUSUM checks authoritative
    and run any ML strictly in parallel, never gating alerting on the model alone.'
