- question: '[Inhibit Response Function] Forced-coil physical divergence (residual/CUSUM) (Statistical
    Method): For the observed behavior -- A Modbus ''Force Single Coil'' (Function Code 5) or ''Force
    Multiple Coils'' (Function Code 15) command is observed where the source IP is not on an authorized
    Engineering Workstation (EWS) allowlist, OR the command originates from an unapproved process on an
