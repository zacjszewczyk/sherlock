  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary uses Manipulate
    I/O Image (T0835) to override the status of physical inputs or force the logic driving physical output
    coils, preventing a PLC from functioning as expected and inhibiting safety, protection, or operator
