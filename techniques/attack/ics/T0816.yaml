name: 'T0816: Device Restart-Shutdown'
id: 1c20c634-a87d-44d5-9ac5-96d68d0c5736
description: Investigate evidence that an adversary forcibly restarted or shut down a device in the ICS
  environment (T0816) to disrupt physical processes, inhibit safety/response functions, or provide cover
  for impact. This playbook helps an analyst determine whether a critical ICS asset (HMI, EWS, operator
  station, SCADA server, historian, PLC, RTU, or IED) experienced an unexpected restart or shutdown outside
  of an approved maintenance window. It correlates host-based shutdown/restart events (Windows Event IDs
  1074, 6006, 6008 with logon and process context), ICS protocol restart/reset function codes (DNP3 cold/warm
  restart, Modbus function 8 sub-function 1, EtherNet/IP Reset, OPC UA), sustained loss of expected periodic
  controller communications, and network-based service-disruption (SYN/ICMP/UDP floods) confirmed against
  HMI communication-loss alarms and historian reporting gaps. Detection methods span deterministic allow-listing/symbolic
  logic, statistical baselining (percentile, standard-deviation, entropy, and CUSUM tests), and machine-learning
  models, with deterministic rules retained as the floor because ICS ML detectors are adversarially evadable.
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
- tactic_id: TA0105
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a critical Windows-based ICS asset (HMI, EWS, operator station, SCADA server, or historian)
    record a user-initiated shutdown/restart (Event ID 1074/6006) or an unexpected dirty shutdown (Event
    ID 6008) outside an approved maintenance window or initiated by a non-whitelisted process?
  context: Within the Inhibit Response Function tactic, an unexpected restart or shutdown of a control-system
    host can prevent expected safety and response functions from operating during a critical state, and
    can also signal malicious device modification that requires a reboot to take effect. Alert on every
    Event ID 6008 (unexpected/dirty shutdown) for critical ICS assets, and for Event IDs 1074/6006 alert
    when the event falls outside approved maintenance windows or the initiating process is not on the
    approved allow-list, per NIST SP 800-82r3 (allow-list authorized maintenance, alarm on the unexpected).
    Correlate with 4624 logons and Zeek conn.log to validate that the source is legitimate; treat a burst
    of preceding 4625 failed logons as a distinct escalation signal indicating an attacker rather than
    an operator. A positive result is an undocumented shutdown by an unauthorized account/process; a negative
    result is a shutdown that maps cleanly to a change-management ticket and an authorized maintainer.
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Operator Stations, SCADA Servers,
    and Data Historians within the Process Control Network (PCN) and OT DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "host IN critical_ics_assets AND (\n  (EventID == 6008)\n  OR (EventID IN (1074,6006) AND (event_time\
      \ NOT IN maintenance_window\n       OR initiating_process NOT IN approved_process_allowlist))\n\
      )\n| join (EventID==4624) on host within 10m to resolve source/account\n| enrich Zeek conn.log for\
      \ remote source legitimacy\n| raise_escalation if count(EventID==4625) within 15m before > 5\n=>\
      \ alert 'Unexpected/unauthorized ICS host shutdown'"
- question: Does the rate of shutdown/restart events (Event ID 1074/6006) on a critical ICS host exceed
    its own 90-day non-maintenance baseline, or does a previously unseen ShutdownReason code appear?
  context: Repeated low-volume unexpected shutdowns can be missed by single-event rules but accumulate
    into a meaningful Inhibit Response Function signal. Build a 90-day baseline of hourly shutdown counts
    (1074/6006) measured only during non-maintenance periods, and alert when hourly counts exceed the
    99th percentile or when a ShutdownReason code that never appeared in the baseline is observed. Apply
    a stateful CUSUM test on the shutdown-event residual so a slow drip of unexpected shutdowns triggers
    before a single threshold is crossed (Urbina et al.). Derive percentile and CUSUM thresholds per asset
    from its own history rather than a global value, because legitimate reboot cadence differs widely
    across HMIs, EWS, and servers. A positive result is a host shutting down more often than it ever has,
    or for a reason it has never reported.
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Operator Stations, SCADA Servers,
    and Data Historians within the Process Control Network (PCN) and OT DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = EventID IN (1074,6006) WHERE host IN critical_ics_assets AND time NOT IN maintenance_window\n\
      baseline = per_host hourly_count over 90d ; p99 = percentile(baseline,99)\nknown_reasons = distinct\
      \ ShutdownReason in baseline\nfor each host,hour:\n  if hourly_count > p99[host] OR ShutdownReason\
      \ NOT IN known_reasons[host]: alert\n  cusum += (hourly_count - mean[host]); if cusum > h_threshold[host]:\
      \ alert 'accumulated unexpected shutdowns'"
- question: Do the log-key sequences leading up to a shutdown/restart on a critical ICS host deviate from
    normal patterns, indicating a maliciously induced restart?
  context: Beyond counts, the ordering of events around a shutdown carries signal. Model normal shutdown/restart
    log-key sequences with an LSTM (DeepLog) over Windows and application logs, flagging low-probability
    sequences and novel ShutdownReason values; optionally add a supervised classifier over EventID, time
    of day, day of week, maintenance-window flag, initiating process, and 4624 user context. Surface the
    top-3 contributing features (e.g., initiating process, hour, logon type) in the alert text so an analyst
    can triage quickly. Run the ML in parallel with the deterministic rules above, never as a replacement,
    because ML detection collapses on unseen attacks (Kus et al.). In the Inhibit Response Function context,
    a low-probability pre-shutdown sequence suggests an attacker drove the reboot to disable a safety
    or response function rather than an operator performing routine maintenance.
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6006
  - Windows Event ID 6008
  - Windows Event ID 4624
  - Windows Event ID 4634
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Operator Stations, SCADA Servers,
    and Data Historians within the Process Control Network (PCN) and OT DMZ.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered log_keys per host in window ending at shutdown

      model = LSTM_DeepLog.train(normal pre-shutdown sequences)

      if model.prob(next_key | seq) < epsilon OR ShutdownReason is novel: flag

      clf = classifier(EventID,hour,dow,maint_flag,init_process,user_ctx)

      if clf.predict == malicious: alert with top3_feature_importances

      # run alongside deterministic rules; never replace them'
- question: Were any ICS protocol restart/reset commands (DNP3 Cold/Warm Restart, Modbus function 8 sub-function
    1 'Restart Communications Option', EtherNet/IP Reset, OPC UA equivalents) observed targeting a critical
    PLC, RTU, or IED from an unauthorized source or outside a maintenance window?
  context: ICS protocols expose built-in restart/reset functions that an adversary can invoke directly
    over the wire to disrupt a controller without ever touching a host OS. Alert when restart/reset commands
    are observed (DNP3 COLD_RESTART/WARM_RESTART, Modbus function 8 sub-function 1, EtherNet/IP Reset)
    using protocol-semantic function-code allow-listing (semantic-based SCADA IDS rules). Enrich with
    asset inventory and escalate if the source IP is not in the authorized engineering-workstation list,
    or if the command is unpaired/out-of-spec (e.g., a request with no legitimate session context). For
    Inhibit Response Function, such a command can knock a protective controller offline at exactly the
    moment its response is needed. A positive result is a restart function code from a non-engineering
    source or outside maintenance; a negative result is a documented maintenance reset from an authorized
    EWS.
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek opcua.log
  - 'NAI: Network taps or SPAN ports monitoring traffic between Purdue Levels 0 (Process), 1 (Basic Control),
    and 2 (Supervisory Control), particularly at network aggregation points for PLCs, RTUs, and IEDs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "dnp3.log function IN (COLD_RESTART,WARM_RESTART)\nOR modbus.log func==8 AND sub_function==0x0001\n\
      OR enip.log service==Reset\nOR opcua.log restart-equivalent\nWHERE dest IN critical_controllers\n\
      | enrich asset_inventory\n| if src_ip NOT IN authorized_ews_list OR time NOT IN maintenance_window\
      \ OR command_unpaired:\n    alert 'Unauthorized ICS restart command'"
- question: Does the daily count of restart-related ICS commands per critical device exceed its 30-day
    baseline, occur outside maintenance, or come from an unusually narrow set of source IPs (low source
    entropy)?
  context: Even authorized-looking restart commands can be anomalous in aggregate. Baseline daily counts
    of restart-related commands per critical device over 30 days and alert when counts exceed the 99th
    percentile or occur outside maintenance windows. Compute per-device source-IP entropy and alert when
    entropy drops below the 5th percentile, which indicates a single unusual commander is issuing restarts
    where many sources normally would (or vice-versa, a new sole source). Profile failed/rejected command
    responses as a distinct signal, since an attacker probing restart functions may generate rejections.
    Derive thresholds per device from its own history, consistent with NIST SP 800-82r3 baselining guidance.
    In the Inhibit Response Function context this catches a stealthy actor repeatedly cycling a controller.
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek opcua.log
  - 'NAI: Network taps or SPAN ports monitoring traffic between Purdue Levels 0 (Process), 1 (Basic Control),
    and 2 (Supervisory Control), particularly at network aggregation points for PLCs, RTUs, and IEDs.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'cmds = restart_related_commands per (device,day) over 30d

      p99 = percentile(cmds,99) per device

      entropy = shannon(src_ip distribution) per device

      if daily_count > p99[device] OR time NOT IN maintenance_window: alert

      if entropy < percentile(entropy_hist,5): alert ''single unusual commander''

      track rejected_command_rate as separate signal'
- question: Do the protocol, function-code, source/destination, and inter-command timing features of restart
    commands form an anomalous sequence relative to learned normal controller traffic?
  context: Sophisticated actors blend restart commands into otherwise normal-looking traffic. Train an
    Isolation Forest, or a Random Forest with feature-importance output (Duque Anton et al.), on protocol,
    function code, source/destination IPs, and inter-command time deltas from 30+ days of baseline traffic,
    and report the top-3 features driving each alert. Validate against DFA/timing models of per-PLC periodicity
    (temporal phase shifts) so a restart that breaks the controller's expected rhythm stands out. Keep
    the symbolic function-code rule as the floor, since ICS ML IDS are adversarially evadable. A positive
    result is a restart command whose context (timing, source pairing, sequence position) does not match
    how the device is normally operated, even if the command itself is technically valid.
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek opcua.log
  - 'NAI: Network taps or SPAN ports monitoring traffic between Purdue Levels 0 (Process), 1 (Basic Control),
    and 2 (Supervisory Control), particularly at network aggregation points for PLCs, RTUs, and IEDs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [protocol,function_code,src_ip,dst_ip,inter_command_delta]

      model = IsolationForest.fit(baseline_30d)  # or RandomForest w/ importances

      score = model.decision_function(event)

      if score < anomaly_threshold: alert with top3_features

      cross_check DFA periodicity model per PLC

      # symbolic function-code allow-list remains the floor'
- question: Has a critical controller stopped sending its expected periodic communications (keep-alives,
    status polls) for longer than its defined polling timeout, outside of any planned maintenance?
  context: A restart or shutdown frequently manifests as a sustained loss of expected periodic traffic
    from a controller, which is a strong corroborating indicator under Inhibit Response Function. Track
    last-seen communication timestamps per critical controller and alert when time since the last packet
    exceeds a defined polling timeout outside maintenance windows; model each PLC's expected periodicity
    as a deterministic finite automaton so missing or delayed messages flag deterministically (temporal
    phase shifts). A device-down condition also violates mined process invariants (Feng et al.). Correlate
    with recent TCP resets in Zeek conn.log, which can mark the moment the controller dropped. A positive
    result is a controller that went silent without a maintenance window; a negative result is silence
    that aligns with planned downtime.
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek opcua.log
  - 'NAI: Core switches in the Process Control Network (PCN) and aggregation switches at Purdue Levels
    1 and 2, where network traffic from PLCs, RTUs, and IEDs is concentrated and can be monitored.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for each controller in critical_controllers:\n  last_seen = max(ts where src/dst == controller)\n\
      \  if (now - last_seen) > polling_timeout[controller] AND now NOT IN maintenance_window:\n    alert\
      \ 'controller communication timeout'\n  validate against DFA periodicity model + mined invariants\n\
      \  correlate recent conn.log TCP RST to/from controller"
- question: Do inter-packet arrival gaps for a critical controller exceed its 30-day distribution, or
    does a stateful CUSUM/spectral test show a sustained shortfall in expected periodic traffic?
  context: A controller need not go fully silent to indicate trouble; a frozen or degraded channel shows
    up as growing inter-packet gaps. Baseline inter-packet arrival distributions per controller over 30
    days and alert when gaps exceed the 99.9th percentile. Accumulate sustained low-rate shortfalls with
    a stateful CUSUM test on the per-minute packet-count residual so a slowly freezing channel accumulates
    to an alert (Urbina et al.); flag the loss of expected periodicity via FFT/PCA reconstruction residual
    (Kravchik and Shabtai). This catches the gradual onset of a restart/shutdown impact that a simple
    timeout might miss. In the Inhibit Response Function context, loss of periodicity means the controller
    may no longer respond to a hazardous state.
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek opcua.log
  - 'NAI: Core switches in the Process Control Network (PCN) and aggregation switches at Purdue Levels
    1 and 2, where network traffic from PLCs, RTUs, and IEDs is concentrated and can be monitored.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'gaps = inter_packet_intervals per controller over 30d ; p999 = percentile(gaps,99.9)

      if current_gap > p999[controller]: alert

      resid = per_minute_packet_count - expected[controller]

      cusum += resid ; if cusum exceeds h: alert ''sustained traffic shortfall''

      fft/pca_reconstruction_residual > threshold: alert ''lost periodicity'''
- question: Does a forecast model of per-minute packet/heartbeat counts predict materially higher traffic
    than observed, indicating an imminent or ongoing communication drop-off for a controller?
  context: Predictive models can detect a controller going down before a fixed timeout fires. Forecast
    per-minute packet/heartbeat counts with a 1D-CNN or LSTM predictor and alert when observed counts
    fall below the model's 99% confidence interval for three consecutive minutes (predict-then-threshold-residual,
    Kravchik and Shabtai); a flatlined channel also deviates from a normal-only DNN/OCSVM manifold (Inoue
    et al.). Surface the top-3 controllers/features driving the alert and retain the deterministic timeout
    rule as the floor (Kus et al.). Under Inhibit Response Function, an early, confident prediction that
    a controller's traffic is collapsing gives an operator the chance to intervene before a safety function
    is lost. A positive result is sustained observed traffic below predicted bounds.
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek opcua.log
  - 'NAI: Core switches in the Process Control Network (PCN) and aggregation switches at Purdue Levels
    1 and 2, where network traffic from PLCs, RTUs, and IEDs is concentrated and can be monitored.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = LSTM_or_1DCNN.train(per_minute_counts per controller)

      pred,ci = model.forecast(next_minute)

      if observed < ci.lower for 3 consecutive minutes: alert with top3_controllers

      cross_check OCSVM/DNN normal-manifold deviation

      # deterministic timeout rule remains the floor'
- question: Is a single source flooding a critical ICS device with SYN, ICMP, or small UDP packets at
    volumes that could cause a denial-of-service restart/communication loss, and does it coincide with
    an HMI communication-loss alarm and a historian reporting gap?
  context: Under the Impact tactic, a network flood can force a controller offline (effectively a restart/shutdown)
    and disrupt the physical process. Alert when a single source sends >1,000 SYN attempts to a critical
    device in 1 minute, >500 ICMP packets/sec, or >1,000 small UDP packets/sec to a critical destination;
    allow-list expected OT flows and alarm on unexpected denial-of-service patterns per NIST SP 800-82r3.
    Critically, correlate the flood with a coincident HMI communication-loss alarm and a gap in historian
    reporting to confirm real process impact rather than benign scanning. A positive result is a concentrated
    flood plus confirmed loss of device communication and data reporting, which evidences an Impact-level
    disruption to operations.
  answer_sources:
  - Zeek conn.log
  - Zeek tcp.log
  - Zeek udp.log
  - Zeek icmp.log
  - HMI Alarm Logs
  - Historian Process Data
  - 'NAI: ICS Control and Supervisory Networks (Purdue Model Levels 1, 2, 3) to monitor traffic to/from
    critical controllers, servers, and HMIs; Network boundaries and gateways between IT and OT networks
    to detect cross-domain flood attempts.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "window = 1min ; per (src_ip,dst in critical_devices):\n  syn_count = count(conn.log history\
      \ has 'S' no establish)\n  icmp_rate, udp_small_rate from icmp.log/udp.log\nif syn_count>1000 OR\
      \ icmp_rate>500/s OR udp_small_rate>1000/s:\n  if HMI_alarm('comm_loss', dst) within window AND\
      \ historian_gap(dst):\n    alert 'DoS-induced device disruption (Impact)'"
- question: Do a critical device's RTT, connection failure ratio (Zeek S0/S1/REJ states), and source entropy
    deviate from baseline by more than 3 standard deviations / a >50% entropy drop, indicating a service-disruption
    event?
  context: Statistical deviation reveals disruption even when raw volumes stay under flood thresholds.
    Baseline average RTT, connections per minute, and the failed-to-success ratio (Zeek S0/S1/REJ states)
    over 30 days and alert when metrics exceed 3 standard deviations and source entropy drops >50% from
    the 24-hour average (concentration on a single attacking source). Profile blocked/failed connection
    rates as a distinct signal and accumulate sustained sub-threshold RTT/failure growth with a CUSUM
    test (Urbina et al.). In the Impact context, a sustained RTT climb plus a spike in half-open/rejected
    connections to a controller indicates the device is being driven toward a communication loss or restart,
    threatening process availability and revenue.
  answer_sources:
  - Zeek conn.log
  - Zeek tcp.log
  - Zeek udp.log
  - Zeek icmp.log
  - HMI Alarm Logs
  - Historian Process Data
  - 'NAI: ICS Control and Supervisory Networks (Purdue Model Levels 1, 2, 3) to monitor traffic to/from
    critical controllers, servers, and HMIs; Network boundaries and gateways between IT and OT networks
    to detect cross-domain flood attempts.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per device over 30d: mean/std of RTT, conns/min, fail_ratio(S0+S1+REJ / total)\n\
      if RTT > mean+3*std AND fail_ratio > mean+3*std AND entropy_drop(src_ip,24h) > 50%:\n  alert 'service\
      \ disruption'\ncusum on RTT and fail_ratio residuals for sustained sub-threshold growth\ntrack blocked/failed\
      \ connection rate separately"
- question: Does an autoencoder over per-minute traffic features (orig/resp bytes, packet counts, connection-state
    counts) for a critical device show reconstruction error above its 99th-percentile threshold, indicating
    an anomalous heartbeat?
  context: Multivariate ML captures disruption patterns that single metrics miss. Train an LSTM/CNN autoencoder
    over orig/resp bytes, packet counts, and connection-state counts per minute and alert when reconstruction
    error exceeds the 99th-percentile threshold (Kravchik and Shabtai; Luo et al. survey). Report the
    top-3 features (e.g., REJ count, ingress packet rate, RTT) in the alert so analysts understand what
    drove it, and keep the deterministic flood thresholds as the floor, since ICS ML detectors are evadable.
    Under Impact, a high reconstruction error on a controller's traffic heartbeat -- especially alongside
    an HMI alarm or historian gap -- corroborates that the device's normal communication pattern has been
    disrupted by a restart/shutdown-causing attack.
  answer_sources:
  - Zeek conn.log
  - Zeek tcp.log
  - Zeek udp.log
  - Zeek icmp.log
  - HMI Alarm Logs
  - Historian Process Data
  - 'NAI: ICS Control and Supervisory Networks (Purdue Model Levels 1, 2, 3) to monitor traffic to/from
    critical controllers, servers, and HMIs; Network boundaries and gateways between IT and OT networks
    to detect cross-domain flood attempts.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = per_minute [orig_bytes,resp_bytes,pkt_counts,conn_state_counts] per device

      ae = LSTM_or_CNN_autoencoder.train(normal X)

      err = reconstruction_error(ae, X_now)

      if err > percentile(err_hist,99): alert with top3_features

      # deterministic flood thresholds remain the floor'
- question: Was an unscheduled shutdown/restart (Event ID 1074, or 6008 with no preceding authorized 1074)
    of a critical ICS asset initiated by a suspicious process (powershell.exe, cmd.exe, psexec, wmic.exe)
    or an unauthorized administrator account, without a matching change ticket?
  context: Under the Impact tactic, an adversary may deliberately power down a controller (e.g., a turbine
    PLC or safety-system HMI) to damage property or halt production. Alert when Event ID 1074 occurs on
    critical hosts and the user is not authorized or the initiating process is in a suspicious list (powershell.exe,
    cmd.exe, psexec.svc, wmic.exe). Alert on Event ID 6008 not preceded by an authorized 1074 within 5
    minutes. Allow-list approved maintenance and administrators per NIST SP 800-82r3, and treat preceding
    4625 failed logons or 4648 explicit-credential use as escalation signals indicating remote, hands-on-keyboard
    compromise. A positive result is a shutdown driven by a remote-execution tool or unknown admin with
    no change ticket -- a strong indicator of intentional, impactful disruption.
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6008
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 4672
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek smb.log
  - 'NAI: Human-Machine Interfaces (HMIs), Process Historians, SCADA Servers, Engineering Workstations,
    Domain Controllers within the ICS environment, Network boundary sensors for ICS segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "host IN critical_ics_assets AND (\n  (EventID==1074 AND (user NOT IN authorized_admins OR\
      \ init_process IN (powershell.exe,cmd.exe,psexec,wmic.exe)))\n  OR (EventID==6008 AND NOT exists(authorized\
      \ 1074 within 5m before))\n) AND NOT change_ticket_matches(event)\n| escalate if 4625 burst OR 4648\
      \ explicit-cred use precedes within 15m\n=> alert 'Suspicious ICS host shutdown (Impact)'"
- question: Does shutdown frequency on a critical host exceed its 30-day baseline, or is a shutdown preceded
    by an unusually high number of unique RDP source IPs or failed logons?
  context: Impactful shutdowns often follow a burst of remote-access activity. Baseline 1074/6008 frequency
    over 30 days excluding maintenance and alert if 24-hour counts exceed the 99th percentile. Baseline
    hourly unique RDP source IPs and alert if a shutdown is preceded by a count above the 95th percentile,
    which suggests credential spraying or lateral movement converging on the asset; profile failed-logon
    (4625) rates and blocked connections as distinct precursors. Accumulate repeated low-volume unexpected
    shutdowns with a CUSUM residual test (Urbina et al.). A positive result is a shutdown that follows
    abnormal RDP/logon activity, indicating an adversary reached the asset and forced it down to cause
    Impact-level disruption.
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6008
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 4672
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek smb.log
  - 'NAI: Human-Machine Interfaces (HMIs), Process Historians, SCADA Servers, Engineering Workstations,
    Domain Controllers within the ICS environment, Network boundary sensors for ICS segments.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'shutdowns = EventID IN (1074,6008) excluding maintenance, per host over 30d

      if rolling_24h_count > percentile(baseline,99): alert

      rdp_sources = unique src_ip per host per hour (Zeek rdp.log)

      if rdp_sources before shutdown > percentile(baseline,95): alert

      track 4625 rate + blocked conns as precursors ; cusum on shutdown residual'
- question: Do machine-learning models flag a shutdown event or its preceding activity as malicious or
    novel, based on event features, pre-shutdown log sequences, and clustering of pre-shutdown behavior?
  context: To catch impactful shutdowns that evade static rules, train a classifier on 1074 events using
    time, admin status, logon type, process name, external-IP flag, and command-line indicators, and model
    normal pre-shutdown log sequences with an LSTM (DeepLog); use DBSCAN on pre-shutdown activity to flag
    novel clusters of behavior that precede a shutdown. Surface the top-3 contributing features in each
    alert and run the ML in parallel with the deterministic rules, since ML detection rates collapse on
    unseen attacks (Kus et al.). Under Impact, a shutdown that the classifier scores as malicious -- or
    that is preceded by a never-before-seen activity cluster -- points to a deliberate, adversary-driven
    shutdown intended to damage property or halt operations, warranting immediate investigation.
  answer_sources:
  - Windows Event ID 1074
  - Windows Event ID 6008
  - Windows Event ID 4624
  - Windows Event ID 4648
  - Windows Event ID 4672
  - Windows Event ID 4688
  - Zeek conn.log
