      \  Stage2 AttnRNN(per-session 4663 sequence) -> seq_logprob; flag low prob; emit top3 events\n \
      \ Stage3 ProvenanceGraph(KAIROS/ThreaTrace over users,procs,files,conns)\n     -> anomalous edge:\
      \ low_rep_proc reads>=N sensitive files AND opens external conn\n  ALERT when stages agree; reconstruct\
      \ subgraph; output top-3 contributing nodes+score"
- question: Is a scripting engine (powershell.exe, python.exe, wscript.exe, cscript.exe) enumerating ICS
    project directories or filtering for ICS file extensions, reading files in rapid automated bursts,
    and then archiving them prior to an outbound transfer?
  context: 'Automated collection leaves a recognizable script->enumerate->read->archive->exfil chain.
    Implement three correlated SIEM rules. Rule 1 (Script with File Enumeration): alert on Event ID 4688/4104
    where the process is a scripting engine AND the command line contains enumeration keywords (Get-ChildItem,
    dir, findstr, -Filter) together with ICS extension references (.ACD, .L5K, .SCX, .HMI). Rule 2 (Rapid
    Sequential Access): windowed aggregation of Event ID 4663 per process per 10-second window; alert
    when count >10 and inter-event time variance <0.5s (an automation signature humans cannot produce).
    Rule 3 (Archive then Transfer): detect archiving-tool execution (7z.exe, tar.exe, Compress-Archive)
    followed by archive creation (Sysmon Event ID 11, .zip/.7z >5 MB), then correlate with Zeek for an
    outbound SMB copy or HTTP POST from the same host within 30 minutes. Assign cumulative severity and
    raise critical when multiple rules fire for one host within an hour. Also track denied reads (4663
    access-denied) and NXDOMAIN bursts in Zeek dns.log as distinct enumeration/tunneling failure signals.
    Multiple rules firing together strongly indicates staged data theft from an OT asset. Detection references:
    portable rules via [SigmaHQ](https://github.com/SigmaHQ/sigma) with pseudocode/templates in [MITRE
    CAR](https://github.com/mitre-attack/car); NXDOMAIN-burst and other failure features per [Nadler et
    al.](https://arxiv.org/abs/1709.08395).'
