- question: When run in parallel with the deterministic rules, do the ML models (process-behavior classifier,
    file-access sequence analyzer, and provenance-graph engine) flag a host where a low-reputation process
    classifies as suspicious, executes a low-probability file-access sequence, and reads many sensitive
    files while opening external connections?
  context: 'Deploy a layered ML pipeline that augments, never replaces, the symbolic and statistical detections.
    Stage 1, a Random Forest over Event ID 4688 features (process name, parent, command-line entropy,
    user context, time-of-day) labels each execution Benign/Administrative/Suspicious, using command-line
    entropy/token features from Revoke-Obfuscation. Stage 2, an attention-augmented RNN models normal
    per-session file-access sequences (Brown et al.) and flags low-probability sequences, emitting the
    top-3 contributing events. Stage 3, a provenance-graph learner (KAIROS or node-level ThreaTrace) models
    users, processes, files, and connections, alerting on anomalous edges where a low-reputation process
    reads many sensitive files and opens external connections, and auto-reconstructs the attack subgraph
    for triage. Every model alert must surface its top-3 contributing features/nodes alongside the score
    so an analyst can validate it. Agreement across stages, particularly Stage 3''s read-many-files-then-egress
    edge, is a high-confidence indicator of an active collection-and-exfiltration operation on a critical
    OT asset. Detection references: command-line entropy/token features from [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    attention-augmented RNN as in [Brown et al.](https://arxiv.org/abs/1803.04967); provenance-graph learners
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) ([code](https://github.com/ProvenanceAnalytics/kairos))
    and node-level [ThreaTrace](https://arxiv.org/pdf/2111.04333) ([code](https://github.com/threaTrace-detector/threaTrace)).'
