questions:
- question: Are files with sensitive ICS extensions (e.g., .ACD, .L5K, .SCX, .HMI, .APX, .S7P, .ZAP, .RSP,
    .TIA, .cfg, .ini, .db, .bak, .sql) on critical OT assets being read by processes that are NOT on the
    approved application allowlist for that asset, or being read in abnormally high volume by a single
    process or user?
  context: 'Under the Collection tactic, an adversary who has reached an engineering workstation, HMI,
    historian, or ICS file server will read local project, configuration, and schematic files to build
    domain knowledge of the control system. Legitimate access to these file types comes from a small,
    known set of ICS engineering tools (e.g., RSLinx.exe reading .L5K), so a read of a sensitive extension
    by an unexpected process (powershell.exe, cmd.exe, a generic copy utility, or an unsigned binary)
    is a strong signal of malicious collection. Maintain an inventory of (a) the sensitive file-extension
    allowlist, (b) the directory paths that hold sensitive files (e.g., C:\ProgramData\Rockwell\, C:\Projects\HMI\),
    and (c) a process->file-type authorization map. Parse Windows Event ID 4663 for read access (AccessMask
    READ_DATA 0x1) and alert when a non-allowlisted process touches a sensitive file, or when one process
    reads more than ~20 unique sensitive files in 5 minutes (tune per asset). Separately count 4663 access-denied
    results per process: a burst of denied reads against sensitive paths is reconnaissance/brute file
    enumeration even when no data leaves. A positive result, especially when correlated within 2 hours
    with large SMB/HTTP egress, indicates active data collection and possible exfiltration; a negative
    result helps exonerate routine engineering activity. Detection references: implement portable detections
    with [SigmaHQ](https://github.com/SigmaHQ/sigma) and the analytics in the [MITRE Cyber Analytics Repository](https://github.com/mitre-attack/car).'
