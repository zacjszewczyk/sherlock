    query: "  baseline: per tool t, set parents(t), children(t) over 90d\n  stream: for each proc event\n\
      \  | where parent NOT in parents(NewProcessName) AND reads_sensitive_files\n  | rank by rarity(parent->child\
      \ edge)"
- question: Do current sensitive-file access metrics for a given user or host (hourly volume of unique
    files, hour-of-day/day-of-week timing, set of directories touched, and successful-vs-denied read ratio)
    deviate significantly from that account's or asset's 90-day behavioral baseline?
  context: 'Manual allowlists miss novel tooling, so build a statistical behavioral baseline per user
    and per host from Windows Event ID 4663 and 5145: hourly count of unique sensitive files (volume),
    timing distribution (frequency), set of directories normally accessed (state), and the ratio of successful
    to access-denied reads (failure state). Compute z-scores and apply online forecasting bounds (ARIMA-style
    prediction intervals). Raise a medium-severity alert when the current hourly access count exceeds
    mean+3 sigma, when access happens outside the user''s 99th-percentile typical hours, when a never-before-seen
    directory is touched (first-seen rarity scoring as in Hopper), or when the denied-read rate spikes
    above the 99th percentile. Corroborate suspected egress with byte-frequency/length payload models
    (PAYL). Derive thresholds per environment and calibrate against the CERT Insider Threat Test Dataset.
    Escalate when multiple thresholds breach at once and embed the breached metrics (count, hour, directory)
    in the alert text. This catches both external intruders operating off-hours and insiders straying
    from their normal footprint. Detection references: online forecasting bounds from [Online Forecasting
    and Anomaly Detection Based on the ARIMA Model](https://www.mdpi.com/2076-3417/11/7/3194); first-seen
    rarity scoring as in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf); byte-frequency/length
    payload models from [PAYL (Wang and Stolfo)](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11);
    calibrate thresholds against the [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
