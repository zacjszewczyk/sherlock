    query: "  R1: WINEVENT (4688 OR 4104) ProcessName in {powershell,python,wscript,cscript}\n      AND\
      \ cmdline ~ (Get-ChildItem|dir|findstr|-Filter) AND cmdline ~ (.ACD|.L5K|.SCX|.HMI)\n  R2: from\
      \ 4663 bin span=10s by host,ProcessId\n      stats count, var(_time) | where count>10 AND var<0.5\n\
      \  R3: proc in {7z.exe,tar.exe,Compress-Archive} THEN Sysmon11 archive(.zip|.7z)>5MB\n      THEN\
      \ Zeek smb_files/http POST same host within 30m\n  severity = cumulative; CRITICAL if >=2 rules\
      \ per host within 1h"
  - technology: Zeek/pseudocode
    query: "  dns.log: group by host bin 5m; count(rcode==NXDOMAIN) high => tunneling/enum failure signal\n\
      \  smb_files.log/http.log: outbound bytes from host after archive event"
- question: Are large archive files (.zip, .7z, .rar >5 MB) being created in staging directories (%TEMP%,
    C:\ProgramData\, %APPDATA%) by scripting engines and then followed by an outbound connection to a
    non-internal IP within 30 minutes?
  context: 'Staging is the bridge between collection and exfiltration. Adversaries compress harvested
    ICS files into an archive placed in a transient directory, then ship it out. Alert when a scripting
    engine creates a large archive (>5 MB; keep the threshold a tunable hard floor) in %TEMP%, C:\ProgramData\,
    or %APPDATA%, and any outbound connection to a non-internal IP follows within 30 minutes. Corroborate
    the egress with byte-frequency payload profiling (PAYL) to distinguish compressed/encrypted exfil
    from normal traffic composition. A positive result, an archive born in a staging path immediately
    preceding external egress, is a high-fidelity exfil-preparation signal; routine backups by approved
    tooling to internal destinations should be allowlisted to avoid noise. Detection references: archiving/staging
    rules in [SigmaHQ](https://github.com/SigmaHQ/sigma); corroborate egress with byte-frequency profiling
    from [PAYL (Wang and Stolfo)](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
