name: 'T0893: Data from Local System'
id: d8ae93f6-96c5-4c2c-97cc-fb3fd3c4f000
description: 'Investigate whether an adversary is collecting sensitive data from local file systems on
  critical ICS assets (engineering workstations, HMIs, historians, SCADA and configuration-management
  servers, file servers, and jump servers across Purdue Levels 2-3). This playbook helps an analyst hunt
  two complementary patterns: (1) unusual interactive or process-driven access to files containing sensitive
  operational data, engineering projects, schematics, and system configurations (e.g., ICS-specific extensions
  such as .ACD, .L5K, .SCX, .HMI, .APX, .S7P, .ZAP, .RSP, .TIA, .cfg, .db, .bak), including access by
  non-allowlisted processes, suspicious parent-process lineages, off-hours activity, and abnormal read
  volumes versus a per-user/per-host baseline; and (2) automated or scripted collection characterized
  by scripting-engine file enumeration, rapid sequential reads at sub-second intervals, and archive/compression
  staging followed by network exfiltration. It combines deterministic symbolic-logic detections, statistical
  baselining, and machine-learning models, and ties local file-access evidence to temporally correlated
  network egress indicators (SMB, HTTP/HTTPS, DNS tunneling) to confirm collection and data theft.'
type: technique
