- question: Running in parallel with the rules, does the ML ensemble (command-line classifier, file-access
    sequence model, and provenance/exfil correlator) reach 2-of-3 agreement that a host executed collection-intent
    commands, anomalous file-access sequences, and a script->file->archive->network chain?
  context: 'Run an ensemble alongside the deterministic detections to catch obfuscated or novel automated
    collection. Component 1, a command-line classifier (TF-IDF/entropy + XGBoost or a fine-tuned transformer)
    over PowerShell/command-line strings, detects collection intent using Revoke-Obfuscation features.
    Component 2, an attention-augmented RNN (Brown et al.) over per-session event sequences, flags abnormal
    sequences and emits the top-3 contributing events, grounded in the self/non-self sequence concept
    from ''A Sense of Self for Unix Processes''. Component 3, a provenance/exfil correlator, detects the
    script->file->archive->network chain with a provenance-graph learner (KAIROS, ThreaTrace) and detects
    the abnormal outbound transfer online with an autoencoder ensemble (Kitsune) whose per-feature reconstruction
    error names the contributing statistics. Fuse via weighted voting and raise a high-confidence alert
    when 2 of 3 components agree, always emitting the top-3 contributing features/nodes with the score.
    Consensus across components on a single host is strong evidence of an automated collection pipeline
    staging ICS data for theft. Detection references: obfuscation features from [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    attention-augmented RNN [Brown et al.](https://arxiv.org/abs/1803.04967) grounded in [A Sense of Self
    for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf); provenance-graph
    learners [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) and [ThreaTrace](https://arxiv.org/pdf/2111.04333);
    online autoencoder ensemble [Kitsune](https://arxiv.org/abs/1802.09089) ([code](https://github.com/ymirsky/Kitsune-py)).'
