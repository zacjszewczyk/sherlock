- question: Do a user's or workstation's current scripting and archiving behaviors (daily script executions
    by type, script-driven file-access rate, archive sizes, target directories, and read success/failure
    ratio) exceed their 90-day baseline thresholds?
  context: 'Baseline legitimate scripting and file operations per user and per workstation over 90 days:
    daily script executions by type (volume), average file-access rate in files/min during script execution
    (frequency), historical archiving-tool use and typical archive sizes (volume), and the success/failure
    ratio of script-driven reads (state). Apply online ARIMA prediction-interval bounds and 95th-percentile
    thresholds. Alert when script frequency exceeds the user''s 95th percentile/day, when the script-driven
    file-access rate exceeds baseline by >200%, when archive size exceeds the user''s historical max by
    >50% or it is a first-ever use of archiving tools, or when a first-time ICS project directory is targeted
    (rarity scoring as in Hopper). Score command-line obfuscation statistically with Revoke-Obfuscation
    entropy/token features. Calibrate against the CERT Insider Threat Test Dataset and include the specific
    breached metric in the alert. This surfaces a normally-quiet operator account suddenly automating
    bulk file collection, which is consistent with either compromise or insider misuse. Detection references:
    online ARIMA prediction-interval bounds from [Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194);
    first-time-directory rarity scoring as in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf);
    command-line obfuscation entropy/token features from [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    calibrate against the [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
