  - 'NAI: Engineering Workstations (EWS), HMI Systems, Historian Servers, SCADA Servers, Configuration
    Management Systems, File Servers hosting ICS project repositories, Jump Servers with access to OT
    networks (Purdue Levels 2-3).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  WINEVENT EventID=4663 AccessMask has 0x1 (READ_DATA)\n  AND ObjectName matches sensitive_ext_list\
      \ (.ACD,.L5K,.SCX,.HMI,.APX,.S7P,.ZAP,.RSP,.TIA,.cfg,.ini,.db,.bak,.sql)\n  AND ObjectName under\
      \ sensitive_dirs\n  AND ProcessName NOT in process_allowlist[file_ext]\n  => ALERT high \"sensitive\
      \ ICS file read by non-allowlisted process\""
  - technology: SIEM/Stats pseudocode
    query: "  from WINEVENT EventID=4663 where ObjectName matches sensitive_ext_list\n  bin span=5m by\
      \ host, ProcessId\n  stats dcount(ObjectName) as uniq_files, count(eval(Result=\"AccessDenied\"\
      )) as denied\n  | where uniq_files > 20 OR denied > 20\n  | enrich corr with Zeek smb_files.log/http.log\
      \ host within 2h (egress_MB>100)"
- question: Are processes that access sensitive ICS files being spawned by uncommon or untrusted parent
    processes (e.g., w3wp.exe, inetinfo.exe, winword.exe, excel.exe) or are unsigned binaries, rather
    than by legitimate ICS engineering tooling?
  context: 'Collection on ICS hosts frequently follows initial access through a web shell or a malicious
    Office document. When the process reading sensitive files descends from a web server (w3wp.exe, inetinfo.exe)
    or an Office application (winword.exe, excel.exe), or is an unsigned/low-reputation binary, the lineage
    itself betrays the intrusion even before the data leaves. Legitimate engineering tools have a stable,
    short set of normal parent/child relationships; a tool issuing mass file reads outside its known profile
    is anomalous (the self/non-self process-sequence idea from ''A Sense of Self for Unix Processes'').
    Build per-tool baselines of expected parents and children from Event ID 4688 / Sysmon Event ID 1,
    join them to sensitive-file reads (Event ID 4663), and alert on the deviant lineages. A positive result
    places a likely web-shell or macro-launched collector on a critical OT asset; a clean lineage reduces
    suspicion to routine tooling. Detection references: use [MITRE CAR](https://github.com/mitre-attack/car)
    lineage analytics and [SigmaHQ](https://github.com/SigmaHQ/sigma) process-creation rules over Event
    ID 4688/Sysmon Event ID 1; the self/non-self process-sequence concept is from [A Sense of Self for
    Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
