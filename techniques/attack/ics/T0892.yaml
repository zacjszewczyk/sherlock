questions:
- question: Is ICS engineering software (e.g., TIA Portal, Studio 5000, PADT) being launched on an Engineering
    Workstation by a user who is NOT on that EWS's authorized-user allowlist, or via a remote (Type 10)
    logon from an IP outside the remote-access allowlist?
  context: Under Inhibit Response Function, credential changes on ICS devices are made through engineering/configuration
    software running on an EWS. The first observable precursor is unauthorized use of that software. Build
    a SIEM rule on Windows Event ID 4688 (process creation) on designated EWS hosts that fires when NewProcessName
    matches an allowlist of ICS engineering tools (e.g., TIA Portal.exe, Studio5000.exe, PADT.exe) AND
    SubjectUserName is not on the per-EWS authorized-user list, or when the associated logon (4624) is
    Type 10 (RemoteInteractive) from an IP not on the remote-access allowlist. Gate alerts by change-management
    windows; any credential/config tool use outside a scheduled window is high-severity and consistent
    with OT least-privilege and remote-access whitelisting ([NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [NSA/CISA AA20-205A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-205a)). A positive
    result is a strong lead toward unauthorized configuration or credential modification; tune the allowlist
    rather than deleting this deterministic floor ([Mitchell and Chen](https://people.cs.vt.edu/~irchen/ps/Mitchell-CSUR14.pdf)).
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Active Directory Servers, and
    network gateways within the Process Control Network (PCN) and DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "PROCESS_CREATE host IN EWS_list AND NewProcessName IN ICS_tool_allowlist\n  AND (SubjectUserName\
      \ NOT IN authorized_user[host]\n       OR (LogonId.LogonType==10 AND src_ip NOT IN remote_access_allowlist))\n\
      \  AND event_time NOT IN change_mgmt_window -> alert(severity=high)"
- question: Does an authorized EWS account show engineering-tool usage at an anomalous hour or from an
    unusual source subnet, or an abrupt change in its failed-to-successful logon ratio, relative to its
    own 90-day baseline?
  context: 'Authorized accounts can be abused, so build a 90-day per-account baseline from Windows Event
    IDs 4688/4624/4625 capturing: engineering-tool launches per day/hour (frequency), the ratio of failed
    (4625) to successful (4624) logons (state), and typical logon hours and source subnets for Type 10
    logons. Alert when a launch hour exceeds 2 standard deviations from the account mean, when a remote
    logon comes from outside the baseline subnet, or when the failed-logon rate crosses a change-point.
    An abrupt loss of successful operator logons or a burst of failures is a primary lockout signal under
    Inhibit Response Function, not noise ([Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/);
    [Urbina et al](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf)). Derive thresholds per site
    from your own 4624/4625 history.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Active Directory Servers, and
    network gateways within the Process Control Network (PCN) and DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[acct] = stats(4688/4624/4625 over 90d): launches_per_hour, fail_succ_ratio, hours,\
      \ subnets\n  alert if launch_hour > mean+2*std\n  OR remote_logon.src_subnet NOT IN baseline.subnets\n\
      \  OR changepoint(fail_succ_ratio)"
- question: Has a previously-unseen (user, EWS, logon-type) authentication relationship appeared, indicating
    a first-time user-to-EWS or source-subnet-to-EWS edge consistent with credential abuse?
  context: Model authentication as a graph where (user, EWS, logon-type) tuples are edges and score first-time
    edges with a Bayesian new-edge model. A credential-abuse session typically creates a previously-unseen
    user->EWS or source-subnet->EWS relationship that scores as a high-probability anomaly ([Metelli and
    Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)).
    This complements volumetric baselines by catching a single novel access even when counts look normal.
    Output per-edge anomaly probability and rank the top-N new edges per day for triage; a high-scoring
    new edge into an EWS that hosts engineering software is a priority lead for inhibit-response credential
    lockout.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Active Directory Servers, and
    network gateways within the Process Control Network (PCN) and DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Graph-analytics pseudocode
    query: "edges = {(user,EWS,logon_type)}\n  for e in today_edges: p = bayes_new_edge(e | history)\n\
      \  rank top_N by p; alert on high-probability first-time edges"
- question: When EWS sessions are scored with an Isolation Forest or temporal link-prediction model over
    historical logon/process/network features, which sessions are flagged as anomalous and what are the
    top contributing features?
  context: Train an Isolation Forest (or a temporal graph link-prediction model such as Euler) on historical
    EWS logs (4688/4624/4625 enriched with Zeek conn.log). Features include User ID, Process Name, Day-of-Week,
    Hour, source-IP subnet/ASN, failed-vs-success logon ratio, and the user->host edge history. Score
    new sessions in near real-time and, per the Explainability principle, emit the top-3 contributing
    features in the alert (e.g., 'rare process for user; logon hour +3.1 sigma; new source subnet') rather
    than a bare score ([King and Huang, Euler](https://dl.acm.org/doi/10.1145/3588771); [Ha et al, SHAP](https://arxiv.org/abs/2205.01930);
    [Wei et al, xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng)). Run
    this in parallel with the deterministic allowlist rule so the ML catches novel patterns while the
    rule provides a defensible floor for inhibit-response credential abuse.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Active Directory Servers, and
    network gateways within the Process Control Network (PCN) and DMZ.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = IsolationForest.fit(features[user,proc,dow,hour,subnet,asn,fail_ratio,edge_hist])\n\
      \  score = model.decision(session); if score>thr: alert(top3=shap(session))"
- question: Is a credential- or security-object-modifying ICS function code being sent on the wire (S7COMM
    Setup Communication 0xF0 with password params, Modbus FC16 to documented credential registers, or
    EtherNet/IP Set_Attribute_Single on a security class) from a source that is NOT the allowlisted EWS
    for that destination device?
  context: 'Direct network observation catches the credential write itself. Create a SIEM/IDS specification
    rule on Zeek protocol logs that fires on credential/security-object writes: S7COMM function 0xF0 (''Setup
    Communication'') with password-setup params, Modbus FC16 (Write Multiple Registers) targeting vendor-documented
    credential registers, or EtherNet/IP Set_Attribute_Single on security class IDs, when the source is
    not the allowlisted EWS for that destination device. Encode legitimate function codes, command/response
    pairing, source/destination relationships, and register/point ranges as a specification rule set so
    any out-of-spec credential write is deterministic and explainable ([Mohan et al](https://arxiv.org/abs/2412.07917);
    [Sen et al](https://arxiv.org/abs/2209.04354); [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    Suppress only for allowlisted IPs during scheduled maintenance. A hit is direct evidence of an inhibit-response
    credential change.'
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), or Intelligent
    Electronic Devices (IEDs), including network taps at aggregation switches and firewalls separating
    these zones.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "filter s7comm.func==0xF0(password) OR modbus.func==16 AND reg IN cred_registers\n  OR enip.service==Set_Attribute_Single\
      \ AND class IN security_classes\n  WHERE src_ip != allowlisted_EWS[dst_device] -> alert"
- question: Do operational traffic invariants (e.g., 'only host X issues security-object writes to device
    Z' and 'a config/heartbeat response must follow within T seconds') hold, or has a credential change
    broken the expected post-change management response state?
  context: Mine deterministic invariants from operational traffic of the form 'only host X issues security-object
    writes to device Z' and 'a config/heartbeat response must follow within T seconds,' then enforce them
    as runtime checks. A lockout breaks the expected post-change state (stale or missing management responses),
    and the violated invariant names the offending host and object ([Feng et al, NDSS 2019](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf)).
    This is powerful for inhibit-response because it detects not just the write but the resulting loss
    of legitimate management access. A violated invariant pinpoints which host wrote which security object
    and whether the device stopped responding to its authorized manager.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), or Intelligent
    Electronic Devices (IEDs), including network taps at aggregation switches and firewalls separating
    these zones.'
  range: Last 90 days
  queries:
  - technology: Zeek/Invariant-check pseudocode
    query: "invariants = mine(traffic): {only host X writes sec-obj to Z; resp within T s}\n  on each\
      \ event: if violates(invariant): alert(host, object, invariant)"
- question: For each source-EWS/destination-controller pair, is a credential-modifying command appearing
    that is normally in the bottom 1st percentile of observed function codes, and are error/exception
    responses or blocked connections spiking after it?
  context: Profile the 30-day distribution of all ICS function codes per source-EWS/destination-controller
    pair (volume = bytes/command counts; frequency = commands/min). In a 1-hour sliding window, alert
    when a credential-modifying code appears that is normally in the bottom 1st percentile, scoring it
    as a low-probability/high-risk transaction ([Marsden et al, PRI-IDS](https://arxiv.org/abs/1711.02826)).
    Separately profile the state dimension - error/exception responses (Modbus exception codes, S7 NACK)
    and blocked connections - as a distinct failure-mode signal, since failed re-authentication spikes
    after a credential change ([Urbina et al](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf)).
    Derive percentiles from your own captures. A rare credential write followed by an exception/blocked
    spike is a high-confidence inhibit-response lockout indicator.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), or Intelligent
    Electronic Devices (IEDs), including network taps at aggregation switches and firewalls separating
    these zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "profile[src,dst] = pctile(func_code dist over 30d)\n  window 1h: if cred_func.pctile < 1:\
      \ alert(low_prob_high_risk)\n  track exception/NACK/blocked rate -> separate failure signal"
- question: Modeling each EWS-to-controller channel as a deterministic finite automaton with phase handling,
    does an injected credential-change command appear as a missing, extra, or out-of-sequence message
    or as abnormal inter-arrival timing?
  context: ICS command channels are highly periodic. Model each EWS<->controller channel as a deterministic
    finite automaton (DFA) with phase-shift handling so the learned model captures the normal message
    sequence and timing. An injected credential-change command surfaces as a missing/extra/out-of-sequence
    message or as abnormal inter-arrival timing relative to the learned phase ([Kleinmann et al](https://arxiv.org/abs/1808.05068)).
    This catches credential modifications that masquerade as valid function codes but break the channel's
    temporal/sequence structure, a subtle inhibit-response tactic. A phase or sequence violation on a
    management channel warrants investigation for unauthorized credential writes.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), or Intelligent
    Electronic Devices (IEDs), including network taps at aggregation switches and firewalls separating
    these zones.'
  range: Last 90 days
  queries:
  - technology: DFA/Timing-model pseudocode
    query: "dfa = learn_DFA(channel msgs + phase)\n  on stream: flag missing/extra/out-of-seq msg OR inter_arrival\
      \ anomaly"
- question: When OT flows are classified by a supervised model (Random Forest/SVM) using source/destination,
    function code, timing, and payload statistics, which credential-write flows are labeled unauthorized
    and what are the top contributing features?
  context: Train a Random Forest/SVM on labeled OT flows using source/destination, function code, timing,
    payload-byte statistics, and command-count features to separate authorized from unauthorized credential
    writes. Random Forest feature-importance surfaces the top-3 drivers (e.g., function code, source host,
    register range) in each alert per the Explainability principle ([Anton et al](https://arxiv.org/abs/1907.10374)).
    Augment opaque deep-NIDS scores with feature-attribution explanations so flagged flows name their
    contributing fields ([Wei et al, xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng)).
    Layer this in parallel with the specification rules so ML generalizes to novel credential-write patterns
    while the rules provide a deterministic floor for inhibit-response detection.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network segments within the Process Control Network (PCN) where Engineering Workstations (EWS)
    communicate with Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), or Intelligent
    Electronic Devices (IEDs), including network taps at aggregation switches and firewalls separating
    these zones.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "clf = RandomForest.fit(flows[src,dst,func,timing,payload_stats,cmd_count], label)\n  pred\
      \ = clf(flow); if pred==unauthorized: alert(top3=feature_importance)"
- question: 'Within a short time window, does the full kill chain complete: a remote (Type 10) logon to
    an EWS from a non-allowlisted IP, then execution of engineering software by the same user, then a
    credential-change command from that EWS to a controller?'
  context: 'Build a stateful multi-stage SIEM rule. Stage 1: successful 4624 (Type 10) to an EWS from
    a source IP not on the remote-access allowlist. Stage 2: within 5 minutes, a 4688 on the same host
    by the same user for a monitored engineering process. Stage 3: within 10 minutes, a Zeek-observed
    credential-change command (S7COMM 0xF0 / Modbus FC16 / EtherNet/IP Set_Attribute_Single) from the
    EWS IP to a controller IP. Fire high-severity only when the full sequence completes, and elevate further
    if a subsequent device alarm or failed operator logon (4625) is observed downstream, consistent with
    OT remote-access and least-privilege guidance ([NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [NSA/CISA AA20-205A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-205a)). A completed
    chain is high-confidence evidence of a deliberate inhibit-response credential lockout.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Engineering Workstations (EWS), Active Directory/Authentication Servers, VPN concentrators,
    and network perimeter devices between the IT and OT networks.'
  range: Last 90 days (correlate events within a 15-minute window)
  queries:
  - technology: SIEM/Stateful-correlation pseudocode
    query: "STATE1: 4624 type10 -> EWS, src_ip NOT IN remote_allowlist\n  STATE2 within 5m: 4688 same\
      \ host/user IN ICS_tools\n  STATE3 within 10m: zeek cred_cmd EWS_ip->controller_ip\n  if all: alert(high);\
      \ elevate if downstream device_alarm OR 4625"
- question: Does the composite risk score for an EWS user's logon-process-command sequence (source-IP
    rarity, logon-time z-score, process rarity, ICS-command rarity, and post-event failed-logon rate via
    CUSUM) exceed the 99th percentile of the prior 30 days?
  context: 'For each EWS user, compute a composite risk score over the sequence (logon -> process -> command)
    summing weighted factors: (1) rarity of source-IP ASN/subnet; (2) z-score of logon time-of-day vs.
    baseline; (3) rarity of the process for that user; (4) rarity score of the ICS command ([Marsden et
    al](https://arxiv.org/abs/1711.02826)); and (5) state = post-event failed/blocked operator-logon rate
    applied as a CUSUM term so gradual lockout accumulates ([Urbina et al](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf);
    [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)). Alert when the score
    exceeds the 99th percentile of the prior 30 days and list the contributing terms in the alert. Folding
    the post-event failure rate into the score ties the credential write to its inhibit-response consequence
    in one signal.'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
