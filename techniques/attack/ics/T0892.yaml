name: 'T0892: Change Credential'
id: 775437a6-a062-4ad7-87f6-90d49d78a736
description: 'Investigate whether an adversary is changing or adding credentials on critical ICS devices
  to lock out operators and responders and inhibit response functions. This playbook helps an analyst
  hunt for the precursors and consequences of malicious credential modification: unauthorized or anomalous
  use of ICS engineering software on Engineering Workstations (EWS); credential-modifying ICS protocol
  commands seen on the wire (S7COMM Setup Communication, Modbus Write Multiple Registers to vendor-documented
  credential registers, EtherNet/IP Set_Attribute_Single on security objects); the correlated remote-logon
  to engineering-tool to credential-write kill chain; and the first-party lockout consequence itself -
  device password/security-key-change alarms paired with an abrupt surge of failed operator logons or
  disappearance of successful logons. It combines deterministic allowlist/specification rules with statistical
  baselining, change-point/CUSUM, Bayesian new-edge scoring, and explainable ML so a SOC analyst can detect
  and triage credential-change lockouts even when the modifying command is not directly observed.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
