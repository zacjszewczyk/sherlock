    query: "score = w1*rarity(src_asn)+w2*z(logon_hour)+w3*rarity(proc|user)\n        +w4*rarity(ics_cmd)+w5*CUSUM(post_fail_logon_rate)\n\
      \  if score > pctile99(30d): alert(list_terms)"
- question: Do the hops of the access chain (user->host and host->controller) introduce previously-unseen
    edges that a Bayesian new-edge model flags as anomalous?
  context: 'Score each hop of the chain (user->host, host->controller) as a graph edge. A credential-abuse
    lockout typically introduces previously-unseen user->EWS and/or EWS->controller edges that a Bayesian
    new-edge model flags with per-edge probability ([Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)).
    This catches the lateral path of an inhibit-response attack even if individual events look in-policy:
    the novelty of the relationship is the tell. Rank new edges by probability and prioritize new EWS->controller
    edges, since an EWS that has never before talked to a given controller suddenly sending it credential
    commands is a strong lockout lead.'
  answer_sources:
