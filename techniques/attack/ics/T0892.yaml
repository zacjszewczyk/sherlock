    query: "for hop in [(user,host),(host,controller)]: p=bayes_new_edge(hop)\n  alert on previously-unseen\
      \ edges; prioritize new EWS->controller"
- question: Does the ordered event chain (logon, tool launch, config write, device alarm) per host match
    the learned normal sequence, or does a DeepLog-style LSTM flag an out-of-sequence or never-before-seen
    credential-change event?
  context: Train a DeepLog-style LSTM on normal ordered event sequences (logon, tool launch, config write,
    device alarm) per host. An out-of-sequence or never-before-seen credential-change event, or an abnormal
    failed-logon surge, breaks the learned model and is flagged with per-event diagnosis identifying which
    step deviated ([Du et al, DeepLog](https://doi.org/10.1145/3133956.3134015)). For inhibit-response,
    this surfaces credential changes that occur outside the normal operational rhythm or in an unexpected
    order. The per-event diagnosis tells the analyst exactly which step in the chain deviated, accelerating
    triage of suspected credential lockouts.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Zeek conn.log
