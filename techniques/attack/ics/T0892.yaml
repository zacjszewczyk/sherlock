- question: Has a device emitted an alarm for a management-password or security-key change (e.g., enabling
    a previously-unset key) that does NOT correlate with an approved change ticket and an allowlisted
    source host?
  context: 'First-party detection of the lockout consequence: where a device emits an alarm for a management-password
    or security-key change (such as enabling a previously-unset BCU key as in the German BAS lockout incident),
    forward it to the SIEM and fire high-severity unless it correlates with an approved change-management
    ticket and an allowlisted source host. Treat a credential change on a safety/management interface
    as critical because recovery may require a factory reset or vendor return ([NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)).
    Many devices do not alarm, so pair this with the network specification rules ([Mohan et al](https://arxiv.org/abs/2412.07917)).
    An uncorrelated key-change alarm is direct evidence of an inhibit-response credential lockout in progress.'
  answer_sources:
  - Device Alarm (DC0108)
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - Network Traffic Content (DC0085)
  - 'NAI: ICS device alarm/historian feeds (Operational Databases), authentication logs for EWS/HMI and
    device management interfaces, and network monitors on the Process Control Network where management/credential
    sessions occur.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "if device_alarm.type IN {password_change, key_change}\n  AND NOT matches_change_ticket AND\
