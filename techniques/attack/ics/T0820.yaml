name: 'T0820: Exploitation for Evasion'
id: a1359408-0bef-4aba-acc1-806e1b83d423
description: 'This playbook helps an analyst investigate whether an adversary is exploiting software,
  firmware, or kernel vulnerabilities in ICS environments to disable, circumvent, or blind security controls
  and thereby evade detection (MITRE ATT&CK for ICS T0820, Exploitation for Evasion). Such exploitation
  often targets device security features known in advance through remote system information discovery
  -- for example, defeating firmware RAM/ROM consistency checks to enable malicious system firmware. The
  hunt pursues the behavior from several complementary angles across the OT estate (Process Control Network,
  Engineering Workstations, HMIs, jump servers, the IT/OT boundary, and the Industrial DMZ): anomalous
  network connections to/from PLCs, RTUs, and HMIs using non-standard or unapproved protocols, off-spec
  ports, or out-of-spec OT control/programming messages (DNP3/Modbus/IEC 61850); volume, frequency, timing,
  and failure-state deviations in machine-to-machine traffic; anomalous process creation on critical ICS
  hosts (unsigned binaries, non-standard execution paths, high-entropy command lines, LOLBins with outbound
  connections); unauthorized or out-of-window firmware, configuration, and project-file transfers that
  violate hash/source/schedule allowlists or break mined process/state invariants; and direct security-control
  tampering (audit-log clears, security-service stops, audit-policy and security-registry modifications).
  Detection methods combine deterministic symbolic-logic rules (protocol/port and OT-specification allowlists,
  Sigma process-creation and tamper rules, firmware/project hash and maintenance-window allowlists), statistical
  baselining (3-sigma/99th-percentile volume and fan-out thresholds, DFA timing models, command-line entropy
  and rare-lineage scoring, CUSUM/invariant change-point detection, and log-volume-drop and rare-service-change
  signals), and machine learning (Kitsune/KitNET online autoencoders, DeepLog LSTM event-sequence models,
  and Random Forest/gradient-boosted classifiers with explainable top-feature output), applied across
  Zeek conn/notice/files/dce_rpc/rdp logs and Windows Event IDs (4688, 5156, 4663, 1102, 7040, 4719, 4657),
  so the analyst can corroborate suspected exploitation-for-evasion against network, host, file, and ICS
  process-state context.'
type: technique
