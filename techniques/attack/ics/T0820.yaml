questions:
- question: '[Evasion] Enforce protocol and port allowlists: Can you determine whether an anomalous network
    connection to or from an ICS asset (e.g., PLC, RTU, HMI) characterized by the use of a non-standard
    or unapproved protocol (e.g., RDP, SMB, FTP), a non-standard port for an approved protocol, or connection
    metrics (byte volume, packet count, duration) that deviate more than 3 standard deviations from an
    established 30-day baseline for the specific source-destination-port-protocol tuple. -- specifically
    by applying the ''Enforce protocol and port allowlists'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Evasion tactic (TA0103), an adversary exploits a software vulnerability
    in ICS software, firmware, or kernel code to disable, circumvent, or blind security features and evade
    detection on control devices. This evidence focuses on the condition that an anomalous network connection
    to or from an ICS asset (e.g., PLC, RTU, HMI) characterized by the use of a non-standard or unapproved
    protocol (e.g., RDP, SMB, FTP), a non-standard port for an approved protocol, or connection metrics
    (byte volume, packet count, duration) that deviate more than 3 standard deviations from an established
    30-day baseline for the specific source-destination-port-protocol tuple. The ''Enforce protocol and
    port allowlists'' approach (Symbolic Logic) works as follows: Per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    and [CISA defense-in-depth](https://www.cisa.gov/sites/default/files/recommended_practices/NCCIC_ICS-CERT_Defense_in_Depth_2016_S508C.pdf),
    maintain allowlists for authorized source-destination-protocol/port tuples across the IT/OT boundary
    and IDMZ; alert on any non-approved protocol (RDP/SMB/FTP) or off-spec port to/from a PLC/RTU/HMI,
    correlating with Zeek notice.log exploit signatures. Keep these hard rules as the deterministic floor.
    What the analyst is looking for: deviations from the approved/known-good baseline described above
    that would accompany exploitation aimed at evading ICS defenses. A positive result -- a deterministic
    rule match, a statistical outlier beyond the stated threshold, or a model alert -- indicates probable
    exploitation-for-evasion activity; pivot to the involved ICS asset (PLC/RTU/HMI/EWS), the source host
    and account, the protocol/port or file/firmware object, and the surrounding event timeline to scope
    impact and confirm whether a security control was actually disabled or bypassed. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land exploitation;
    run deterministic rules as the floor and treat statistical/ML detections as parallel corroboration
    given documented adversarial evasion of ICS ML IDS.'
