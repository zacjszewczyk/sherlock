questions:
- question: '[Discovery] Correlate fan-out with scan tools: Can you determine whether an adversary is
    conducting a port scan against ICS assets by applying the ''Correlate fan-out with scan tools'' (Symbolic
    Logic) approach to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Correlate
    fan-out with scan tools'' approach (Symbolic Logic) works as follows: Identify a single source IP
    generating repeated TCP SYNs or UDP probes to many destination ports/hosts within a short window (e.g.,
    >20 distinct ports or >10 distinct hosts in 60s for a non-scanner host), then correlate the source
    with Windows Event ID 4688 and 5156 records for scanning tools such as nmap, masscan, netcat, or scripted
    port checks. Fan-out and failed-connection-ratio rules for unauthorized probing are formalized in
    [Network Intrusion Detection and Prevention](https://doi.org/10.1007/978-0-387-88771-5). Suppress
    alerts for approved vulnerability-management or maintenance systems. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable port-scanning reconnaissance; pivot to the
    responsible source host/IP, the targeted destinations and ports, any scanning process and its command
    line, the success/failure pattern of the probes, and whether the source is a sanctioned scanner or
    maintenance system before escalating. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land scanning on ICS segments.'
  answer_sources:
  - Zeek conn.log
  - Network PCAP
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Industrial Control Network, Engineering Workstations, DMZ Jump Hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from conn.log within sliding 60s window\n| stats dc(id.resp_p) as distinct_ports dc(id.resp_h)\
      \ as distinct_hosts by id.orig_h\n| where (distinct_ports>20 OR distinct_hosts>10) AND id.orig_h\
      \ NOT IN approved_scanners\n| join id.orig_h -> host [ Windows EventCode IN (4688,5156)\n    where\
      \ Application/Process IN (nmap, masscan, ncat, netcat, *port*scan*) ]\n| alert 'Port scan fan-out\
      \ + scan tool' with src, ports, hosts, process"
- question: '[Discovery] Match scan command lines: Can you determine whether an adversary is conducting
    a port scan against ICS assets by applying the ''Match scan command lines'' (Symbolic Logic) approach
    to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
