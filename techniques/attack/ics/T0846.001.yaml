    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Match scan
    command lines'' approach (Symbolic Logic) works as follows: Search process command lines (Event ID
    4688) for enumeration options such as ''-sS'', ''-sU'', ''-sT'', ''-p-'', ''--top-ports'', ''--open'',
    or scripted port loops, and tie those executions to the same host''s outbound flow burst in Zeek conn.log.
    These deterministic flow/flag features (SYN/ACK ratios, distinct destination ports, flow duration)
    are the dominant scan signals confirmed in [Machine Learning and Port Scans: A Systematic Review](https://arxiv.org/abs/2301.13581);
    a SCADA host IDS that pairs such signatures with host anomaly rules is described in [Enhancing SCADA
    Security](https://arxiv.org/abs/2402.14599). Prioritize hosts that are not known engineering workstations
    or sanctioned scanners. A positive result -- a rule match, statistical outlier, or model alert --
    indicates probable port-scanning reconnaissance; pivot to the responsible source host/IP, the targeted
    destinations and ports, any scanning process and its command line, the success/failure pattern of
    the probes, and whether the source is a sanctioned scanner or maintenance system before escalating.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    scanning on ICS segments.'
