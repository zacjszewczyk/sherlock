    query: "X = per-source flow aggregates [distinct_ports, distinct_hosts, byte_volume,\n    syn_ratio,\
      \ failed_conn_ratio]\nmodel = IsolationForest(); anomaly_score = model.decision_function(X)\nwhere\
      \ anomaly_score in outlier tail:\n  alert with src and features of largest isolation contribution"
- question: '[Discovery] Explainable ICS anomaly attribution: Can you determine whether an adversary is
    conducting a port scan against ICS assets by applying the ''Explainable ICS anomaly attribution''
    (Machine Learning) approach to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Explainable
    ICS anomaly attribution'' approach (Machine Learning) works as follows: Run a VAE/LSTM anomaly detector
    over OT network telemetry and attach SHAP-based attribution so each anomaly score is reported with
    its top-3 contributing features for analyst triage, as demonstrated in [Explainable Anomaly Detection
    for Industrial Control System Cybersecurity](https://arxiv.org/abs/2205.01930). Tune for the very
    low false-positive rates required in ICS, consistent with the recommendations in [Machine Learning
    for Intrusion Detection in Industrial Control Systems](https://arxiv.org/abs/2202.11917). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable port-scanning reconnaissance;
    pivot to the responsible source host/IP, the targeted destinations and ports, any scanning process
    and its command line, the success/failure pattern of the probes, and whether the source is a sanctioned
    scanner or maintenance system before escalating. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land scanning on ICS segments.'
  answer_sources:
  - Zeek conn.log
  - Network PCAP
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Industrial Control Network, Engineering Workstations, DMZ Jump Hosts'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = VAE/LSTM anomaly detector over OT network telemetry\nscore each interval; if anomaly_score\
      \ > ICS-tuned (low-FPR) threshold:\n  compute SHAP attribution; report top-3 contributing features\n\
      \  alert 'Explainable ICS scan anomaly' with src, score, top3_features"
