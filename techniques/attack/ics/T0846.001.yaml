  queries:
  - technology: ML/pseudocode
    query: "train autoencoder ensemble (Kitsune-style) on normal host->host/host->port interactions\n\
      for each new flow window: err = reconstruction_error(x)\nif err > learned_threshold AND pattern\
      \ = sparse rapidly-expanding ports:\n  attribute top-3 features (xNIDS) and alert 'Anomalous scan\
