- question: '[Discovery] Sequential failure-rate test (Threshold Random Walk): Can you determine whether
    an adversary is conducting a port scan against ICS assets by applying the ''Sequential failure-rate
    test (Threshold Random Walk)'' (Symbolic Logic) approach to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Sequential
    failure-rate test (Threshold Random Walk)'' approach (Symbolic Logic) works as follows: Over Zeek
    conn.log connection states, treat each connection a source makes to a previously-uncontacted destination
    as success (established/SF) or failure (S0, REJ, RSTO, RSTOS0 = no listening service/unreachable).
    Accumulate a sequential likelihood ratio and flag the source as a scanner after a small number of
    failures (Threshold Random Walk typically decides within ~4-5 attempts), per [Fast Portscan Detection
    Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf). This State-aware
    (success/fail) rule catches scans even when total volume is low. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable port-scanning reconnaissance; pivot to the
    responsible source host/IP, the targeted destinations and ports, any scanning process and its command
    line, the success/failure pattern of the probes, and whether the source is a sanctioned scanner or
    maintenance system before escalating. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land scanning on ICS segments.'
  answer_sources:
  - Zeek conn.log
  - Network PCAP
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Industrial Control Network, Engineering Workstations, DMZ Jump Hosts'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from conn.log\nfor each src_ip, ordered by ts:\n  for each new (uncontacted) dst:\n    outcome\
      \ = SUCCESS if conn_state in (SF, S1, RSTR) else FAILURE if conn_state in (S0, REJ, RSTO, RSTOS0)\n\
      \    update sequential likelihood ratio (Threshold Random Walk)\n  if LR crosses scanner threshold\
      \ (typically ~4-5 failures):\n    alert 'Port scan (TRW)' with src_ip, failed_dsts, success_dsts"
