- question: '[Discovery] Port fan-out baseline: Can you determine whether an adversary is conducting a
    port scan against ICS assets by applying the ''Port fan-out baseline'' (Statistical Method) approach
    to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Port fan-out
    baseline'' approach (Statistical Method) works as follows: Baseline the number of unique destination
    ports and unique destination hosts contacted per source host and per source-target pair over sliding
    5-minute and 30-minute windows. Flag hosts whose fan-out exceeds their historical mean by more than
    3 standard deviations or crosses the 99.5th percentile. Use a median-absolute-deviation / modified
    Z-score so a single benign maintenance burst does not inflate the baseline, per [Modified Z-Score
    for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    Derive per-segment thresholds from labeled scan traffic in [CIC-IDS2017](https://www.unb.ca/cic/datasets/ids-2017.html).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable port-scanning
    reconnaissance; pivot to the responsible source host/IP, the targeted destinations and ports, any
    scanning process and its command line, the success/failure pattern of the probes, and whether the
    source is a sanctioned scanner or maintenance system before escalating. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land scanning on ICS segments.'
  answer_sources:
  - Zeek conn.log
  - Network PCAP
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Industrial Control Network, Engineering Workstations, DMZ Jump Hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from conn.log per src (and per src-target pair) over sliding 5m and 30m windows

      | stats dc(id.resp_p) as ports dc(id.resp_h) as hosts by id.orig_h, window

      | compute baseline median and MAD per host; modified_z = 0.6745*(x-median)/MAD

      | where ports>mean+3*std OR ports>=p99_5 OR modified_z>3.5

      | alert ''Fan-out baseline deviation (scan)'' with src, ports, hosts'
- question: '[Discovery] Burst dispersion and port-entropy threshold: Can you determine whether an adversary
    is conducting a port scan against ICS assets by applying the ''Burst dispersion and port-entropy threshold''
    (Statistical Method) approach to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Burst dispersion
    and port-entropy threshold'' approach (Statistical Method) works as follows: Measure the Shannon entropy
    of destination ports and the dispersion of destination IP/port combinations contacted by each host
    during short intervals and compare to its normal periodic polling pattern. Alert when a host shows
    a sudden spike in low-duration connections with high port entropy plus a sustained rise in failed/reset
    connections. Per-flow temporal features that quantify this burstiness are detailed in [Single Flow
    Time Series Analysis](https://dl.acm.org/doi/abs/10.5555/3581644.3581681). A positive result -- a
    rule match, statistical outlier, or model alert -- indicates probable port-scanning reconnaissance;
    pivot to the responsible source host/IP, the targeted destinations and ports, any scanning process
    and its command line, the success/failure pattern of the probes, and whether the source is a sanctioned
    scanner or maintenance system before escalating. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land scanning on ICS segments.'
  answer_sources:
  - Zeek conn.log
  - Network PCAP
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Industrial Control Network, Engineering Workstations, DMZ Jump Hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from conn.log per src per 60s interval

      | eval port_entropy = shannon_entropy(id.resp_p)

      | eval short_conns = count(duration < 0.5s), fail_conns = count(conn_state IN (S0,REJ,RSTO))

      | compare port_entropy and short_conns to host''s periodic-polling baseline

      | where port_entropy spikes AND short_conns spikes AND fail_conns rising

      | alert ''High port-entropy burst (scan)'' with src, port_entropy, fail_conns'
- question: '[Discovery] Failed-connection ratio profiling: Can you determine whether an adversary is
    conducting a port scan against ICS assets by applying the ''Failed-connection ratio profiling'' (Statistical
    Method) approach to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Failed-connection
    ratio profiling'' approach (Statistical Method) works as follows: Profile the ratio of failed/rejected/reset
    connections (Zeek S0/REJ/RSTO states; firewall denies; Windows 5157 blocked, 5156 absent of reply)
    to total connections per source over a window, and alert when this ratio exceeds a tuned bound (commonly
    >40-60% for active scanning of sparse OT services). High failure rate is the core scanner discriminator
    in [Fast Portscan Detection](https://www.icir.org/vern/papers/portscan-oak04.pdf); apply robust scoring
    per [Modified Z-Score](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).
    Failure of probes is treated as a first-class signal distinct from successful connections. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable port-scanning reconnaissance;
    pivot to the responsible source host/IP, the targeted destinations and ports, any scanning process
    and its command line, the success/failure pattern of the probes, and whether the source is a sanctioned
    scanner or maintenance system before escalating. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land scanning on ICS segments.'
  answer_sources:
  - Zeek conn.log
  - Network PCAP
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Industrial Control Network, Engineering Workstations, DMZ Jump Hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from conn.log + firewall denies + Windows 5157/5156 per src per window

      | eval failed = count(conn_state IN (S0,REJ,RSTO,RSTOS0)) + count(5157 blocked)

      | eval total = count(all connections)

      | eval fail_ratio = failed/total

      | apply modified Z-score (median/MAD) to fail_ratio per segment

      | where fail_ratio > 0.4 OR modified_z > 3.5

      | alert ''High failed-connection ratio (scan)'' with src, fail_ratio'
- question: '[Discovery] Scan traffic classifier: Can you determine whether an adversary is conducting
    a port scan against ICS assets by applying the ''Scan traffic classifier'' (Machine Learning) approach
    to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
    from one source to many destination ports on ICS assets, especially short-lived SYN-heavy or connection-failed
    flows that do not match normal control traffic. If the scan is launched locally, the same host may
    also show process creation for scanning utilities or scripted discovery commands. The ''Scan traffic
    classifier'' approach (Machine Learning) works as follows: Train a Random Forest or gradient-boosted
    classifier on flow features such as packet/byte counts, SYN-to-ACK ratio, destination-port entropy/dispersion,
    inter-arrival time, flow duration, and failed-connection ratio to distinguish routine ICS polling
    from malicious scanning. Random Forest reproducibly achieves >0.99 F1 with interpretable feature importances
    ([Reproducing Random Forest Efficacy in Detecting Port Scanning](https://arxiv.org/abs/2302.09317);
    [Machine Learning and Port Scans review](https://arxiv.org/abs/2301.13581)), trained/validated on
    [CIC-IDS2017](https://www.unb.ca/cic/datasets/ids-2017.html). The alert MUST list the top-3 contributing
    features (e.g., distinct ports, SYN ratio, failed-conn ratio) and the offending source so analysts
    can separate scans from approved diagnostics. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable port-scanning reconnaissance; pivot to the responsible source
    host/IP, the targeted destinations and ports, any scanning process and its command line, the success/failure
    pattern of the probes, and whether the source is a sanctioned scanner or maintenance system before
    escalating. A negative result helps rule out this particular vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    scanning on ICS segments.'
  answer_sources:
  - Zeek conn.log
  - Network PCAP
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Industrial Control Network, Engineering Workstations, DMZ Jump Hosts'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [pkt_count, byte_count, syn_to_ack_ratio, dport_entropy, dport_dispersion,\n  \
      \          inter_arrival_time, flow_duration, failed_conn_ratio]\nmodel = RandomForest/GradientBoosting\
      \ trained on CIC-IDS2017 (scan vs polling)\nscore per src flow aggregate; if predicted == scan:\n\
      \  alert with src and TOP-3 contributing features (e.g., distinct_ports, syn_ratio, fail_ratio)"
- question: '[Discovery] Rare interaction autoencoding: Can you determine whether an adversary is conducting
    a port scan against ICS assets by applying the ''Rare interaction autoencoding'' (Machine Learning)
    approach to the available telemetry?'
  context: 'Why this matters: Under the Discovery tactic (TA0102), an adversary scans a system, device,
    or network to enumerate live hosts, open ports, and running services, then uses those results to plan
    lateral movement and target vulnerabilities -- a behavior that is especially disruptive and detectable
    in otherwise quiet, deterministic OT/ICS networks. Evidence to look for: Repeated TCP or UDP probes
