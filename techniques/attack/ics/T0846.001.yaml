    autoencoding'' approach (Machine Learning) works as follows: Train an autoencoder ensemble on normal
    host-to-host and host-to-port interaction patterns in the OT network, then flag high reconstruction
    error for sparse, rapidly expanding port interactions that do not fit the learned baseline; an online
    plug-and-play autoencoder NIDS is given by [Kitsune](https://doi.org/10.14722/ndss.2018.23204). Surface
    the top-3 features driving the reconstruction error using an attribution method such as [xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng)
    so the stealthy scan is explainable rather than just scored. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable port-scanning reconnaissance; pivot to the responsible
    source host/IP, the targeted destinations and ports, any scanning process and its command line, the
    success/failure pattern of the probes, and whether the source is a sanctioned scanner or maintenance
    system before escalating. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land scanning on ICS segments.'
