name: 'T0846.001: Port Scan'
id: bc29c5db-0ee4-4ced-91f4-c3cf476310c7
description: 'This playbook helps an analyst investigate whether an adversary is performing a port scan
  against an Industrial Control System (ICS) network to identify live hosts, enumerate open ports and
  running services, fingerprint operating systems, and map the network (MITRE ATT&CK for ICS T0846.001,
  Active Scanning: Port Scan). The results of such reconnaissance commonly feed adversary Discovery, Lateral
  Movement, and vulnerability-exploitation decisions, and are frequently produced with tools such as nmap,
  masscan, netcat, or scripted port loops. The hunt pursues the behavior from several complementary angles:
  a single source generating repeated TCP SYN or UDP probes to many destination ports/hosts in a short
  window (fan-out) correlated with process-creation and filtering-platform records for scanning utilities;
  scan-style command-line options (-sS, -sU, -sT, -p-, --top-ports, --open) tied to outbound flow bursts;
  a sequential failure-rate (Threshold Random Walk) test over Zeek connection states; SMB/DCE-RPC enumeration
  via MITRE BZAR; statistical baselining of unique-port/host fan-out, port-entropy and burst dispersion,
  and failed-connection ratios using robust (modified Z-score) scoring; and machine-learning detectors
  (Random Forest/gradient-boosted flow classifiers, autoencoder reconstruction-error, Isolation Forest
  outliers, and explainable VAE/LSTM attribution) that distinguish routine ICS polling from malicious
  scanning. Detection methods span Zeek conn.log, network PCAP, and Windows Event IDs 4688/5156/5157,
  applied across the Industrial Control Network, Engineering Workstations, and DMZ jump hosts, so the
  analyst can corroborate suspected port scanning against host, process, and network context while suppressing
  approved vulnerability-management and maintenance activity.'
type: technique
related:
- tactic_id: TA0102
  tactic_name: Discovery
