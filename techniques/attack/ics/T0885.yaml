name: 'T0885: Commonly Used Port'
id: 643ab774-1b72-489f-bd10-d5aeef846287
description: 'Investigate suspected adversary Command and Control over commonly used ICS or IT ports within
  the ICS environment. Adversaries communicate over well-known ports (e.g., TCP/80 HTTP, TCP/443 HTTPS,
  TCP/UDP/53 DNS, TCP/502 Modbus, TCP/102 S7comm/ISO-TSAP, TCP/20000 DNP3, TCP/44818 EtherNet/IP) to bypass
  firewalls and network detection and to blend in with normal traffic, sometimes carrying a completely
  different protocol than the port implies. This playbook helps an analyst hunt for and confirm such activity
  by: detecting port-to-service mismatches and OT protocol-grammar violations in Zeek conn.log; identifying
  unauthorized outbound connections from critical ICS assets (PLCs, EWS, HMIs, historians) to external/non-whitelisted
  IPs; spotting behavioral anomalies such as abnormal duration, volume, payload entropy, DNS tunneling,
  and suspicious TLS/JA3 fingerprints; and uncovering low-and-slow C2 beaconing from non-browser processes
  on Windows ICS endpoints. It combines deterministic symbolic-logic rules, statistical baselining, and
  machine-learning detectors across network (Zeek) and endpoint (Windows Event ID 4688/5156) telemetry
  spanning Purdue Model Levels 1-3.'
type: technique
related:
- tactic_id: TA0101
  tactic_name: Command And Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are there network connections on common ICS or IT ports where Zeek's dynamically identified
    application protocol (the 'service' field) does not match the protocol normally expected on that destination
    port?
  context: 'Adversaries deliberately run one protocol over a port associated with another to slip past
    port-based firewalls and to blend with normal traffic, so the destination port alone is insufficient
    evidence of legitimacy. Zeek performs dynamic protocol detection and records the identified application
    protocol in the ''service'' field of conn.log independent of the port. A mismatch between a well-known
    port and the detected service (for example service != ''ssl'' on 443, service != ''modbus'' on 502,
    service != ''dns'' on 53, service not in {''cotp'',''s7comm''} on 102) is a strong indicator of protocol
    masquerading for Command and Control. A positive result warrants immediate triage of the endpoints,
    payload, and asset roles; a clean window lowers suspicion of this vector. This maps directly to the
    Command and Control tactic, where operators mimic expected ICS/IT traffic on open ports to avoid detailed
    inspection. References: [Command & Control: Understanding, Denying and Detecting, Gardiner et al](https://arxiv.org/abs/1408.1136);
    [Zeek conn.log Documentation](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors monitoring the IT/OT boundary, ICS DMZ, and internal ICS network segments (Purdue
    Model Levels 1-3).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from conn.log\nwhere (id.resp_p=502 AND service!='modbus')\n   OR (id.resp_p=443 AND service!='ssl')\n\
      \   OR (id.resp_p=53  AND service!='dns')\n   OR (id.resp_p=102 AND service NOT IN ('cotp','s7comm'))\n\
      \   OR (id.resp_p=20000 AND service!='dnp3')\n   OR (id.resp_p=44818 AND service!='enip')\nselect\
      \ ts, id.orig_h, id.resp_h, id.resp_p, service, proto, conn_state\nsort by ts"
- question: On OT control ports (502 Modbus, 20000 DNP3, 102 S7comm, 44818 EtherNet/IP), is the traffic
    violating the expected protocol grammar -- for example carrying invalid or unexpected function codes,
    breaking command/response pairing, or addressing non-existent registers/points?
  context: 'For OT protocols, validating only the port or even the detected service is not enough; an
    adversary can speak a syntactically valid-looking protocol while issuing semantically illegitimate
    commands. Auto-generated, semantic SCADA rules for DNP3/Modbus/IEC 61850 and mined deterministic invariants
    let you check protocol semantics: alert when a control port carries function codes outside the allowed
    set for that device, when requests have no matching responses (or vice versa), or when registers/points
    outside the known process map are addressed. Each violation should carry an explainable field naming
    the exact invariant broken, which makes triage fast and defensible. A positive result indicates either
    a masqueraded channel or an attacker manipulating the control protocol itself -- both high-priority
    under Command and Control. Pair this with the port/service mismatch check for layered coverage. References:
    [Distributed Intrusion Detection System using Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917);
    [A Systematic Framework to Generate Invariants for Anomaly Detection in ICS, Feng et al](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors monitoring the IT/OT boundary, ICS DMZ, and internal ICS network segments (Purdue
    Model Levels 1-3).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each OT flow on id.resp_p IN (502,20000,102,44818):\n  parse function_code, transaction_id,\
      \ register/point address\n  ALERT if function_code NOT IN allowed_codes[device_profile]\n  ALERT\
      \ if request has no matching response within window (broken pairing)\n  ALERT if address NOT IN\
      \ known_process_map[device]\n  emit violated_invariant field for analyst triage"
- question: For each source IP showing protocol mismatches on common ports, does the daily count of mismatch
    events exceed its historical 95th-percentile baseline, or is the connection-failure state (S0/REJ/RSTO)
    rate rising abnormally?
  context: 'A single mismatch may be noise, but a source that suddenly produces many mismatched connections,
    or a surge of rejected/half-open attempts, is behaving like a masquerading or probing C2 host. Establish
    a 30-day baseline of the daily mismatch count per source IP (id.orig_h) and alert when the current
    day exceeds the historical 95th percentile. Separately profile conn_state: a rising rate of S0 (no
    reply), REJ (rejected), and RSTO (reset) on these ports is a distinct signal of masqueraded or scanning
    traffic. Derive thresholds per network segment because OT traffic is far more uniform and predictable
    than IT traffic, so even small deviations are meaningful in OT segments. A positive result narrows
    the hunt to specific noisy sources; a flat baseline suggests no volumetric masquerade activity. This
    supports Command and Control detection by surfacing the hosts most likely running covert channels.
    References: [Zeek conn.log Documentation](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors monitoring the IT/OT boundary, ICS DMZ, and internal ICS network segments (Purdue
    Model Levels 1-3).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per id.orig_h, daily count of port-service-mismatch events over trailing 30d

      ALERT if today_count(id.orig_h) > p95(baseline[id.orig_h])

      --

      failrate = per id.orig_h on common ports, count(conn_state IN (S0,REJ,RSTO)) / total

      ALERT if failrate > segment_threshold (tune per Purdue segment)'
- question: Does a supervised classifier (e.g., Random Forest) trained on labeled conn.log features flag
    connections on common ports as protocol masquerade, and which features drive each prediction?
  context: 'Deterministic rules miss novel masquerade variants, so run a supervised classifier in parallel
    (never as a replacement) over conn.log records. Train on labeled data using features proto, id.resp_p,
    service, duration, orig_bytes, resp_bytes, conn_state, and a derived binary port_service_match. Random
    Forests provide interpretable feature-importance, so each alert should surface its top-3 contributing
    features for analyst triage. Because ML-based industrial intrusion detection collapses on unseen attack
    patterns, keep the symbolic-logic and statistical detectors active alongside it. A positive (masquerade)
    prediction with strong port_service_match / service contributions corroborates the rule-based findings;
    disagreement between model and rules is itself worth reviewing. This rounds out the Command and Control
    coverage with a generalizing detector while preserving explainability. References: [Anomaly-based
    Intrusion Detection in Industrial Data with SVM and Random Forests, Duque Anton et al](https://arxiv.org/abs/1907.10374);
    [xNIDS: Explaining Deep Learning-based Network Intrusion Detection Systems, Feng et al](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng);
    [A False Sense of Security? Revisiting ML-Based Industrial Intrusion Detection, Kus et al](https://arxiv.org/abs/2205.09199).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network sensors monitoring the IT/OT boundary, ICS DMZ, and internal ICS network segments (Purdue
    Model Levels 1-3).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [proto, id.resp_p, service, duration, orig_bytes, resp_bytes, conn_state, port_service_match]

      model = RandomForestClassifier.fit(labeled_conn_log)

      score each conn.log record -> P(masquerade)

      ALERT if P(masquerade) > threshold

      attach top3 feature_importances to alert

      run in parallel with deterministic rules'
- question: Is any critical ICS asset (PLC, EWS, HMI) initiating an outbound connection to a non-private,
    non-whitelisted external IP on a common IT or OT port, and if Windows-based, which process initiated
    it?
  context: 'Per NIST SP 800-82r3, control segments should enforce protocol/port allow-listing and alert
    on unauthorized egress. Critical ICS assets should essentially never originate external connections,
    so any outbound flow from a watchlisted asset to a non-RFC1918, non-whitelisted destination on a common
    port is high-fidelity evidence of C2 or exfiltration. Filter Zeek conn.log for id.orig_h in the critical-asset
    watchlist, id.resp_h external and not whitelisted, and id.resp_p a common port. For Windows-based
    assets, pivot to Windows Event ID 5156 (Filtering Platform connection) by timestamp/IP to identify
    the connection, then to Windows Event ID 4688 (process creation) to name the initiating process, alerting
    if it is not on the application whitelist. A positive result is a strong, actionable Command and Control
    indicator demanding containment review. References: [Guide to Operational Technology (OT) Security
    (NIST SP 800-82r3), Stouffer et al](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Zeek conn.log Documentation](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Critical ICS assets including Engineering Workstations (EWS), Human-Machine Interfaces (HMIs),
    and controllers on ICS network Levels 1 (Basic Control) and 2 (Supervisory Control).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from conn.log\nwhere id.orig_h IN critical_ics_assets\n  AND id.resp_h NOT IN (rfc1918 OR\
      \ approved_whitelist)\n  AND id.resp_p IN common_ports\nselect ts, id.orig_h, id.resp_h, id.resp_p,\
      \ service, orig_bytes, resp_bytes"
  - technology: SIEM/Rule pseudocode
    query: 'join Zeek match -> WinEventID=5156 (by 5-tuple+time) -> WinEventID=4688 (by PID/time)

      ALERT high if initiating Image NOT IN application_whitelist'
- question: For each critical ICS asset, do daily outbound connection count, total data volume, or outbound:inbound
    byte ratio to external IPs exceed three standard deviations above a 14-day rolling baseline, and are
    failed/blocked outbound attempts rising?
  context: 'Even when a single connection looks benign, a shift in aggregate outbound behavior from a
    normally quiet ICS asset signals C2 or exfiltration. Build a 14-day rolling baseline per asset for
    daily external connection count, total data volume (orig_bytes+resp_bytes), and the outbound:inbound
    byte ratio, then alert when a day exceeds three standard deviations above the moving average. Use
    role-aware, baseline-driven thresholds so benign scheduled traffic (e.g., periodic polling) is not
    flagged. Separately track failed/blocked outbound attempts (conn_state S0/REJ) as a distinct exfil/C2-probe
    signal -- repeated blocked egress often precedes a successful channel. A positive result identifies
    an asset whose outbound profile has changed; a stable profile is reassuring. This statistical lens
    complements the deterministic egress rule for the Command and Control tactic. References: [Modeling,
    Analysis and Characterization of Periodic Traffic on a Campus Edge Network, Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Critical ICS assets including Engineering Workstations (EWS), Human-Machine Interfaces (HMIs),
    and controllers on ICS network Levels 1 (Basic Control) and 2 (Supervisory Control).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each asset in critical_ics_assets:\n  baseline_14d = moving_avg/std of {daily_ext_conn_count,\
      \ daily_volume(orig+resp), out:in_ratio}\n  ALERT if metric_today > mean + 3*std\n--\nblocked =\
      \ count(conn_state IN (S0,REJ)) outbound per asset per day\nALERT on abnormal rise in blocked attempts"
- question: Do density-based clustering or autoencoder-based anomaly scoring of outbound connection metadata
    from critical ICS assets reveal rare/outlier flows that fall outside the dense clusters of normal
    operational traffic?
  context: 'Normal repetitive ICS operational traffic forms tight, dense clusters in feature space, so
    rare outbound flows show up as noise/outliers that merit investigation. Apply density-based clustering
    (e.g., HDBSCAN) to outbound connection metadata from critical assets using features id.resp_h (categorical),
    id.resp_p, duration, orig_bytes, and the byte ratio; points classified as noise are candidate C2/exfil
    flows. As an online unsupervised alternative, score per-flow reconstruction error with an autoencoder
    ensemble (Kitsune-style) over streaming bandwidth/jitter/inter-arrival statistics. Always report the
    features driving each outlier so analysts can triage efficiently. A flow appearing as a cluster outlier
    to a never-before-seen external host is a strong Command and Control lead; flows inside known dense
    clusters are likely benign operations. References: [Kitsune: An Ensemble of Autoencoders for Online
    Network Intrusion Detection, Mirsky et al](https://arxiv.org/abs/1802.09089); [xNIDS, Feng et al](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Critical ICS assets including Engineering Workstations (EWS), Human-Machine Interfaces (HMIs),
    and controllers on ICS network Levels 1 (Basic Control) and 2 (Supervisory Control).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = outbound metadata from critical_ics_assets [id.resp_h(cat), id.resp_p, duration, orig_bytes,
      byte_ratio]

      clusters = HDBSCAN.fit(X)

      ALERT on points labeled noise/outlier

      -- online alternative --

      ae_ensemble = Kitsune(stream stats: bandwidth, jitter, inter-arrival)

      ALERT if reconstruction_error > threshold; attach driving features'
- question: On common cleartext-expected ports, are there protocol-abuse artifacts -- oversized/high-entropy
    DNS queries or TXT/NULL records on port 53, or self-signed certificates and anomalous JA3/JA3S TLS
    fingerprints on port 443 -- indicating a covert channel?
  context: 'Adversaries abuse permissive ports like 53 and 443 to tunnel C2 or exfiltrate data. For DNS,
    search Zeek dns.log for queries with query_length > 255, abnormally high label entropy, or qtype_name
    in (''TXT'',''NULL'') carrying encoded data, and profile the NXDOMAIN/response-failure ratio per domain
    as a distinct covert-channel signal (tunnels generate many failed lookups). For HTTPS, search Zeek
    ssl.log for self-signed certificates or JA3/JA3S hashes absent from a known-good baseline, since custom
    C2 clients produce unusual TLS fingerprints. A positive result on either channel is strong evidence
    of Command and Control masquerading on a common web/name-resolution port; absence across the window
    reduces suspicion of these specific tunneling techniques. Correlate hits with the originating asset''s
    role and reputation of the destination. References: [Real-Time Detection of DNS Exfiltration and Tunneling,
    Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf); [Command & Control, Gardiner
    et al](https://arxiv.org/abs/1408.1136).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Network sensors at the ICS DMZ, core network switches, and DNS servers within the Purdue Model
    Levels 2 and 3.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from dns.log

      where length(query) > 255 OR label_entropy(query) high OR qtype_name IN (''TXT'',''NULL'')

      also: per-domain NXDOMAIN_ratio > threshold

      --

      from ssl.log

      where self_signed=true OR ja3 NOT IN known_good OR ja3s NOT IN known_good

      select ts, id.orig_h, id.resp_h, server_name, ja3, ja3s'
- question: Do individual flows on common IT/OT ports deviate by more than three standard deviations from
    a 30-day per-5-tuple baseline of duration/bytes, or do their payload byte-distributions or Shannon
    entropy deviate from the normal model for that service?
  context: 'Behavioral outliers expose covert channels even when the protocol looks correct. For each
    unique 5-tuple flow, build a 30-day baseline for duration, orig_bytes, and the resp_bytes:orig_bytes
    ratio and alert when a new connection deviates by more than three standard deviations -- abnormally
    long or voluminous sessions on a control or web port are suspect. Where payload bytes are available
    via Zeek scripts/file extraction, build per-port, per-length byte-frequency profiles (PAYL-style)
    and flag payloads whose byte distribution deviates from the normal model for that service using Mahalanobis
    distance. Compute Shannon entropy of the initial payload to catch encrypted/encoded tunnels on cleartext-expected
    ports (high entropy where plaintext is expected indicates obfuscation). Positive results identify
    anomalous flows for deep inspection under the Command and Control tactic; baseline-conforming flows
    are deprioritized. References: [Anomalous Payload-Based Network Intrusion Detection (PAYL), Wang and
    Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11); [Real-Time Detection of DNS
    Exfiltration and Tunneling, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Network sensors at the ICS DMZ, core network switches, and DNS servers within the Purdue Model
    Levels 2 and 3.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline_30d per 5-tuple {duration, orig_bytes, resp:orig_ratio}

      ALERT if |flow_metric - mean| > 3*std

      --

      PAYL: per (port,length) byte-frequency model

      ALERT if Mahalanobis_distance(payload_byte_dist, model) > threshold

      --

      ALERT if shannon_entropy(initial_payload) high on cleartext-expected port'
- question: On critical OT ports (502/102/20000), does time-series anomaly detection over per-minute bytes
    and connection counts reveal windows with high reconstruction error or violations of the normal periodic
    industrial rhythm?
  context: 'ICS machine-to-machine traffic is highly periodic with sharp, repeating phases, so deviations
    from that cadence are meaningful. Implement time-series anomaly detection (e.g., an LSTM Autoencoder)
    on aggregated metrics for critical OT ports -- bytes-per-minute and connection-count-per-minute --
    modeling per-PLC cadence, and flag windows with high reconstruction error or phase violations as departures
    from normal industrial rhythm (a new C2 channel adds traffic that breaks the periodic pattern). For
    unsupervised online scoring, use an autoencoder ensemble over streaming statistics. Keep the deterministic
    protocol-abuse rules active in parallel because ML alone misses unseen variants. A positive result
    points to a time window and PLC for focused review; consistent periodicity indicates normal operation.
    This addresses Command and Control attempts hidden within otherwise expected OT traffic. References:
    [Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068); [Kitsune, Mirsky et al](https://arxiv.org/abs/1802.09089);
    [A False Sense of Security?, Kus et al](https://arxiv.org/abs/2205.09199).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek ssl.log
  - 'NAI: Network sensors at the ICS DMZ, core network switches, and DNS servers within the Purdue Model
    Levels 2 and 3.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'agg = per OT port (502,102,20000): bytes_per_min, conn_count_per_min

      model = LSTM_Autoencoder.fit(per_PLC cadence)

      ALERT if reconstruction_error(window) high OR phase_violation

      -- online alt: autoencoder ensemble over streaming stats --

      keep deterministic protocol-abuse rules running in parallel'
- question: Is a non-whitelisted, non-browser process on a Windows ICS endpoint (EWS, HMI, historian)
    establishing outbound connections to an external IP on web ports 80/443?
  context: 'ICS endpoints should not originate external web traffic, and with application allow-listing
    in place any such egress is high-fidelity. Correlate process creation with network connections: filter
    Windows Event ID 4688 for new processes that are not on the whitelist, then find matching connections
    in Windows Event ID 5156. For any connection to an external IP on port 80/443, pivot to Zeek conn.log
    by 5-tuple/timestamp to confirm the flow and check destination reputation. A non-browser process (not
    the sanctioned browser/updater) reaching the internet on a web port is a classic C2 setup. A positive
    result identifies the offending process and host for immediate triage and containment; a negative
    result reduces suspicion of process-driven C2. This directly supports detection of Command and Control
    over commonly used web ports. References: [Guide to Operational Technology (OT) Security (NIST SP
    800-82r3), Stouffer et al](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Windows-based endpoints in the ICS environment, including Engineering Workstations (EWS), HMIs,
    and data historians located at Purdue Model Levels 2 and 3.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'p = WinEventID=4688 where NewProcessName NOT IN application_whitelist AND not browser

      c = WinEventID=5156 where Image=p.NewProcessName AND DestPort IN (80,443) AND DestAddress external

      ALERT and pivot to Zeek conn.log by 5-tuple+ts; check dest reputation'
- question: Are there outbound flows to a fixed external IP/port that show beaconing signatures -- low
    coefficient-of-variation of inter-arrival times, FFT periodicity, low Bowley skewness, and consistently
    small connection sizes -- after suppressing known benign periodic services?
  context: 'Low-and-slow C2 beaconing shows up as regular, small, repetitive connections to the same destination.
    Group Zeek conn.log by the 4-tuple (id.orig_h, id.resp_h, id.resp_p, proto) over 24-hour windows and
    compute inter-arrival deltas. Flag beaconing when there is a low coefficient-of-variation of inter-arrival
    times, low Bowley skewness, strong FFT periodicity/autocorrelation, and consistently small connection
    sizes (orig_bytes+resp_bytes < 2048) with at least 5 connections -- the RITA approach. Combine FFT/autocorrelation
    regularity with whitelisting of benign periodic services (software updates, NTP) to suppress false
    positives at scale (BAYWATCH), and tune thresholds against a periodic-traffic baseline. A positive
    result names a beaconing source/destination pair for investigation; whitelisted periodic services
    are excluded. This is core Command and Control detection on commonly used ports. References: [RITA
    (Real Intelligence Threat Analytics), Active Countermeasures](https://github.com/activecm/rita); [BAYWATCH:
    Robust Beaconing Detection, Hassan et al](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    [Modeling, Analysis and Characterization of Periodic Traffic, Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Windows-based endpoints in the ICS environment, including Engineering Workstations (EWS), HMIs,
    and data historians located at Purdue Model Levels 2 and 3.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group conn.log by (id.orig_h,id.resp_h,id.resp_p,proto) per 24h\ndeltas = inter-arrival times\n\
      ALERT if CV(deltas) low AND FFT_periodicity strong AND bowley_skew low\n  AND median(orig_bytes+resp_bytes)\
      \ < 2048 AND conn_count >= 5\nsuppress known periodic services (updates, NTP) via whitelist"
- question: Does a supervised classifier (Gradient Boosting / Random Forest) distinguish beaconing sessions
    from normal browsing on ICS endpoints, and which features drive each beaconing alert?
  context: 'To catch beaconing cadences that static thresholds miss, train a supervised binary classifier
    (e.g., Gradient Boosting or Random Forest) to separate beaconing sessions from normal browsing using
    features: standard deviation of inter-arrival times, mean/variance of packet sizes, outbound:inbound
    byte ratio, destination-IP entropy, and connection-count per window. Tree ensembles provide interpretable
    feature importance, so surface the top-3 contributing features in each alert for triage. Keep the
    deterministic RITA/BAYWATCH statistics running in parallel because ML generalizes poorly to unseen
    C2 cadences. A positive (beaconing) prediction corroborated by the statistical detectors is a strong
    Command and Control finding; disagreement between model and rules should still be reviewed. This complements
    the timing-regularity checks with a generalizing detector while preserving explainability for analysts.
    References: [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests, Duque
    Anton et al](https://arxiv.org/abs/1907.10374); [xNIDS, Feng et al](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng);
    [A False Sense of Security?, Kus et al](https://arxiv.org/abs/2205.09199).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Windows-based endpoints in the ICS environment, including Engineering Workstations (EWS), HMIs,
    and data historians located at Purdue Model Levels 2 and 3.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [std(inter_arrival), mean/var(pkt_size), out:in_byte_ratio, dest_ip_entropy, conn_count_per_window]

      model = GradientBoosting/RandomForest.fit(labeled sessions)

      ALERT if P(beaconing) > threshold; attach top3 feature_importances

      run in parallel with RITA/BAYWATCH statistics'
