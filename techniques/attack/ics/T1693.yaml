name: 'T1693: Modify Firmware'
id: 3c35674f-48b9-4e14-ade8-4d09ac9213a5
description: 'This playbook helps an analyst investigate whether an adversary has modified firmware on
  an ICS asset or associated management host (MITRE ATT&CK T1693, Modify Firmware). Firmware is low-level
  software embedded in PLCs, RTUs, safety controllers, field modules, and x86-based engineering workstations,
  HMIs, and historians; an adversary who installs malicious, vulnerable, or downgraded firmware can achieve
  persistence, impair process control, and inhibit response functions through rootkit/hooking behavior,
  privilege escalation, or denial of service. The hunt pursues the behavior from two complementary phases.
  First, the delivery and staging phase: a firmware image or update package is transferred to or staged
  for a controller or management host via an unauthorized source, unexpected protocol (FTP/TFTP/SSH or
  ICS file-transfer function codes), an out-of-window change, or a hash/size/version absent from the approved
  firmware inventory or lacking a valid vendor signature. Second, the post-update phase: after an update
  the device shows a new or downgraded firmware version, unexpected alarms, reboots, or loss of normal
  communications inconsistent with the approved change record, indicating the firmware was altered, downgraded,
  or corrupted rather than legitimately patched. Detection methods combine deterministic symbolic-logic
  specifications (firmware-transfer allowlists, signed-update and inventory enforcement, platform BIOS/UEFI/EFI
  integrity scans with CHIPSEC, post-update integrity checks, and runtime/control-flow attestation), statistical
  baselining (package size and timing baselines, transfer frequency and failure-rate profiling, reboot/recovery
  timing baselines, and periodicity/phase-shift modeling of M2M traffic), and machine learning (Random
  Forest/SVM firmware workflow models with feature-importance explanations, reconstruction-based post-update
  instability detectors with physics cross-checks, and out-of-band AC power side-channel classifiers),
  applied across Zeek conn/files/ftp/tftp/ssh and ICS protocol logs (DNP3/Modbus/CIP), device alarm logs,
  firmware inventory and change-management records, process historian/sensor telemetry, and device power
  telemetry, so the analyst can corroborate suspected firmware modification against network, device, process,
  and change-control context.'
type: technique
related:
- tactic_id: TA0106
  tactic_name: Impair Process Control
