questions:
- question: '[Impair Process Control] Firmware transfer allowlist: Can you determine whether a firmware
    image or update package is transferred to, or staged for, an ICS asset such as a PLC, RTU, safety
    controller, or associated management host, and the transfer is unusual because it uses an unauthorized
    source, an unexpected protocol, an out-of-window change window, or a file hash and size that do not
    match the approved firmware inventory, indicating a suspicious firmware change workflow. -- specifically,
    using the ''Firmware transfer allowlist'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impair Process Control tactic (TA0106), an adversary modifies
    firmware on an ICS asset or management host to gain persistence, impair process control, or inhibit
    response functions, often delivering the malicious or vulnerable image via removable media, supply-chain
    compromise, or remote services and then leveraging it for rootkit/hooking, privilege escalation, or
    denial-of-service effects. This evidence focuses on the condition that a firmware image or update
    package is transferred to, or staged for, an ICS asset such as a PLC, RTU, safety controller, or associated
    management host, and the transfer is unusual because it uses an unauthorized source, an unexpected
    protocol, an out-of-window change window, or a file hash and size that do not match the approved firmware
    inventory, indicating a suspicious firmware change workflow. The ''Firmware transfer allowlist'' approach
    (Symbolic Logic) works as follows: Alert when Zeek files.log or ICS protocol logs show a firmware-sized
    file (or a firmware-update function code) being transferred to a controller from any source IP, protocol,
    or maintenance window not explicitly approved for that asset. Encode authorized source/protocol/window
    and valid function codes / command-response pairing as explicit specifications per [On Specification-based
    Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354) and [Distributed IDS using
    Semantic-based Rules for SCADA in Smart Grid](https://arxiv.org/abs/2412.07917). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates a probable firmware modification
    or coerced update; pivot to the affected device or host, the source of the transfer, the protocol
    and function codes used, the firmware version/hash/size and signature status, the change-management
    record, and the post-update alarm, reboot, and communications state to scope whether the firmware
    was altered, downgraded, or corrupted. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy
    firmware rootkits that spoof telemetry or evade in-band integrity checks.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek tftp.log
  - Zeek ssh.log
  - ICS Protocol Logs (DNP3/Modbus/CIP file-transfer functions)
  - Device Alarm Logs
  - Firmware Inventory
  - Change Management Records
  - 'NAI: Process Control Network segments containing PLCs, RTUs, safety controllers, and firmware management
    hosts; Engineering Workstations and IDMZ remote-access paths used to deliver update packages.'
  range: Last 90 days; pivot to event-centered window around the firmware transfer/update
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_files, ics_protocol_logs\nWHERE (file_size IN firmware_size_range OR function_code\
      \ IN firmware_update_funcs)\n  AND dest_ip IN controller_assets\n  AND NOT (src_ip IN approved_sources[dest_ip]\n\
      \           AND protocol IN approved_protocols[dest_ip]\n           AND timestamp IN approved_change_window[dest_ip]\n\
      \           AND function_code IN valid_funcs[dest_ip])\n-> ALERT 'unauthorized firmware transfer\
      \ to controller'"
