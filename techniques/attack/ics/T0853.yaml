    entropy exceed the 99.5th percentile?
  context: 'Scripted Collection produces measurable volume, frequency, and failure signatures. Baseline
    per-user sensitive-file open Frequency (opens/min), total bytes read from project shares and bytes
    egressed (Volume), and failed/blocked exfil connections plus NXDOMAIN (State/failure) using multivariate
    Isolation Forest outlier scoring, and measure script content entropy per Revoke-Obfuscation. Alert
    on script entropy above the 99.5th percentile or usage spikes beyond 3 standard deviations, derived
    from a 30-day per-user baseline. A positive result indicates a user/script collecting and staging
    far more ICS data than normal — the statistical fingerprint of bulk collection — even when no single
    keyword rule fires. Source references: [Liu et al.](https://doi.org/10.1145/2133360.2133363); [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
