name: 'T0853: Scripting'
id: dcc72777-c8f7-48a6-95b4-55ee8dce19a1
description: 'Investigate adversary abuse of scripting language interpreters (PowerShell/pwsh, Python,
  and Windows Script Host wscript/cscript) to execute arbitrary or weaponized code on critical ICS assets
  such as Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
  Servers, Jump Servers, and the OT DMZ. This playbook helps an analyst confirm whether scripts are running
  outside of approved administrative or vendor activity by correlating process creation, command-line
  arguments, script-block and module logging, DLL/module loads, application-control block events, and
  outbound network behavior. It covers two adversary goals: (1) Execution of unauthorized scripts (high-risk
  PowerShell flags and download cradles, unmanaged or embedded PowerShell hosted in non-interpreter processes,
  unauthorized Python interpreters and freshly-written scripts, and script hosts spawned by Office/browser/PDF
  parents from user-writable directories); and (2) Collection, where scripts read multiple sensitive ICS
  project and configuration files (.ACD, .L5K, .SCX, .HMI) and stage, compress, encode, or exfiltrate
  them. It pairs deterministic symbolic-logic rules (the defensible floor) with statistical baselining
  (entropy, command-line length, frequency, volume, failure and block states) and machine-learning classifiers
  and outlier detectors (AST/hybrid-feature script classifiers, Isolation Forest, One-Class SVM, DeepLog)
  to surface obfuscated and novel scripted activity that signature rules alone would miss.'
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
- tactic_id: TA0100
  tactic_name: Collection
