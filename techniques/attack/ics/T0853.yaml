      OR (Zeek conn.log orig_proc IN (wscript.exe,cscript.exe) AND conn_state IN (S0,REJ))

      OR (Zeek dns.log query_by (wscript|cscript) AND rcode_name==NXDOMAIN)

      => ALERT; group by host'
- question: Does the wscript/cscript command-line length exceed the host's 99th-percentile 90-day baseline,
    are rare script extensions executing, or do the referenced script file's content entropy, non-alphanumeric
    ratio, and per-process bytes-out deviate sharply from baseline?
  context: 'Obfuscated and encoded WSH scripts often have unusually long command lines and high-entropy
    content. Alert when the wscript/cscript command-line length exceeds the host''s 99th-percentile 90-day
    baseline or when rare script extensions execute. Additionally baseline the referenced script file''s
    content entropy and non-alphanumeric ratio (per Revoke-Obfuscation and Lee Holmes) and the per-process
    bytes-out Volume, alerting on >3-sigma deviations. This statistical Execution-tactic check surfaces
    obfuscated WSH payloads and large data egress that keyword rules miss; combine with the parent-child
    and directory rules to prioritize true positives. Source references: [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    [Lee Holmes](https://www.leeholmes.com/more-detecting-obfuscated-powershell/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Servers,
    Jump Servers, OT DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per host over 90d for image IN (wscript.exe,cscript.exe):\n  cmdlen=len(cmdline)\n\
      alert if cmdlen > p99(baseline.cmdlen) OR ext NOT IN common_exts\nfor referenced_script: entropy=shannon(content);\
      \ nonalnum_ratio; bytes_out\nalert if entropy>3sigma OR nonalnum_ratio>3sigma OR bytes_out>3sigma"
- question: When wscript/cscript execution feature vectors are clustered with DBSCAN/Isolation Forest
    and script-file content is classified with an AST model, which executions fall out as noise/outliers
    or score as malicious, and what features explain them?
  context: 'Cluster wscript/cscript execution feature vectors with DBSCAN or Isolation Forest (Liu et
    al.) and alert on noise/outlier points that do not fit normal execution clusters; optionally classify
    script-file content with an AST-based model (Rusak et al.). This Execution-tactic analytic catches
    anomalous script-host activity that evades static thresholds. Surface the top-3 contributing features
