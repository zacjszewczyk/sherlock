  - Zeek http.log
  - Zeek smb.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Process Control Servers, Data
    Historians, OT Network Segments, Jump Servers, OT DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "alert if (script_hash NOT IN seen_hashes[host])  # first-seen\nbaseline 30d per asset:\n \
      \ idf_domain = log(N_hosts / hosts_querying(domain))\n  alert if idf_domain in top1% for OT_segment\n\
      \  alert if conn_rate > mean+3std OR bytes_out > mean+3std\nDeepLog: alert if seq_loglik < thr ;\
      \ IsolationForest outlier check"
- question: When Python execution features and script content are scored with One-Class SVM/Isolation
    Forest and an AST/gradient-boosting classifier, which executions are flagged anomalous or malicious,
    and what features drove the score?
  context: 'To detect malicious Python beyond rules and rarity, apply a One-Class SVM or Isolation Forest
    (Liu et al.) over Python execution features and a gradient-boosting/AST classifier on script content
    (Fang et al.; Rusak et al.). This Execution-tactic analytic flags scripts whose individual attributes
    appear benign but whose combination is anomalous or whose code structure resembles known-malicious
    patterns. Emit the top-3 contributing features alongside the score so the analyst can validate; treat
    ML hits as corroborating leads against the deterministic and statistical signals rather than standalone
    verdicts. Source references: [Liu et al.](https://doi.org/10.1145/2133360.2133363); [Fang et al.](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099);
    [Rusak et al.](https://dl.acm.org/doi/10.1145/3243734.3278496).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - Zeek smb.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Process Control Servers, Data
    Historians, OT Network Segments, Jump Servers, OT DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X_exec = [path_rarity, parent_rarity, bytes_out, conn_rate, child_count, file_writes]

      anom = OneClassSVM.predict(X_exec)  # or IsolationForest

      p_mal = AST_GBM.predict_proba(features(script_content))

      alert if anom==-1 OR p_mal>0.8

      emit top3_features'
- question: Are wscript.exe/cscript.exe executing .js/.vbs/.wsf scripts from user-writable directories
    (%TEMP%, %APPDATA%, C:\Users\Public) or being spawned by Office/browser/PDF parents, with correlated
    temp-directory script creation and TI-matched or first-seen outbound connections?
  context: 'Windows Script Host abuse is a classic phishing-to-Execution chain: a document or browser
    drops a .js/.vbs/.wsf into a user-writable path and invokes wscript/cscript. Per Red Canary parent-child
    guidance, alert on wscript.exe/cscript.exe executing those extensions from %TEMP%, %APPDATA%, or C:\Users\Public,
    or spawned by Office/browser/PDF parents (Windows Event ID 4688 / Sysmon Event ID 1). Correlate temp-directory
    script creation (Sysmon Event ID 11) with the execution and alert on TI-matched or first-seen outbound
    destinations (Sysmon Event ID 3 / Zeek conn.log). On ICS hosts these script hosts are rarely legitimate,
    so a positive result is high-fidelity for initial-access-driven scripting. Source references: [Red
    Canary](https://redcanary.com/threat-detection-report/techniques/powershell/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Servers,
    Jump Servers, OT DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc := (4688|Sysmon=1) WHERE image IN (wscript.exe,cscript.exe)\nalert if cmdline MATCHES\
      \ /\\\\(Temp|AppData|Users\\\\Public)\\\\.*\\.(js|vbs|wsf)/i\n   OR parent_image IN (winword.exe,excel.exe,powerpnt.exe,*browser*,acrord32.exe,*pdf*)\n\
      correlate Sysmon=11 script_create in same dir within 10m\nalert if conn(Sysmon=3|conn.log) resp_h\
      \ IN TI_feed OR resp_h NOT IN seen_dest[host]"
- question: Are there AppLocker/WDAC block events for Windows Script Host launches, or failed/blocked
    outbound connections (Zeek S0/REJ) and NXDOMAIN bursts attributed to wscript/cscript on ICS assets?
  context: 'As with PowerShell, WSH failure and block states are distinct Execution-tactic signals. Application-control
    telemetry showing an AppLocker/WDAC-blocked WSH launch (recommended in NSA/CISA guidance) proves a
    disallowed script host was attempted, while failed/blocked outbound connections (Zeek conn.log S0/REJ)
    or NXDOMAIN bursts from wscript/cscript indicate beaconing or exfiltration to dead infrastructure.
    Treat each as its own high-value signal; clustering of these around a host or time window strengthens
    confidence in an active scripted intrusion partially contained by controls. Source references: [NSA/CISA
    Keeping PowerShell](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF).'
  answer_sources:
