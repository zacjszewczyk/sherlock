questions:
- question: Are PowerShell (powershell.exe/pwsh.exe) processes executing on critical ICS assets with high-risk
    command-line arguments such as -EncodedCommand/-enc/-ec, -ExecutionPolicy Bypass, -NonInteractive,
    or -WindowStyle Hidden, or with in-line download cradles (IEX, (New-Object Net.WebClient).DownloadString,
    Invoke-WebRequest), particularly when spawned by an off-allow-list parent or reaching a TI-matched
    or first-seen destination?
  context: 'On ICS assets PowerShell should run rarely and only from known administrative or vendor tooling,
    so encoded/obfuscated invocation, execution-policy bypass, hidden windows, and download cradles are
    strong Execution-tactic signals of adversary code delivery and on-the-fly scripting. Apply the Sigma
    ''Suspicious Encoded PowerShell Command Line'' and ''Suspicious PowerShell Download and Execute Pattern''
    rules to Windows Event ID 4688 / Sysmon Event ID 1, treating these literal argument and download-cradle
    matches as the deterministic floor. Raise severity when the parent is off the per-asset allow-list
    (e.g., winword.exe/excel.exe/browser to powershell.exe) per Red Canary, and correlate the powershell.exe
    outbound connection (Sysmon Event ID 3 / Zeek conn.log) with threat-intel-matched or first-seen destinations.
    A positive result strongly indicates malicious scripted execution staging further discovery, collection,
    or impact; a negative result helps scope benign administrative usage. Source references: [Suspicious
    Encoded PowerShell Command Line](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/);
    [Suspicious PowerShell Download and Execute Pattern](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_susp_download_patterns.yml);
    [Red Canary](https://redcanary.com/threat-detection-report/techniques/powershell/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Servers,
    Jump Servers, Domain Controllers, OT DMZ, Remote Access Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (WinEventID=4688, Sysmon=1) AND image IN (powershell.exe,pwsh.exe)\n  AND (cmdline\
      \ MATCHES /-enc|-ec |-EncodedCommand|-ExecutionPolicy\\s+Bypass|-NonInteractive|-WindowStyle\\s+Hidden/i\n\
      \       OR cmdline MATCHES /IEX|New-Object\\s+Net\\.WebClient|DownloadString|Invoke-WebRequest|iwr\
      \ /i)\n=> raise ALERT; severity=HIGH if parent_image NOT IN per_asset_allowlist[asset]\n   (e.g.,\
      \ parent IN (winword.exe,excel.exe,*browser*))"
  - technology: Zeek/pseudocode
    query: 'conn := conn.log WHERE orig_proc=="powershell.exe"

      join TI feed on conn.id.resp_h OR resp_h NOT IN host_seen_dest[src]

      => ALERT correlate with 4688/Sysmon-1 powershell launch within +/-5m'
- question: Is the PowerShell engine being loaded reflectively in-memory by a process other than powershell.exe/pwsh.exe
    (i.e., System.Management.Automation.dll or *.ni.dll loaded by a SCADA/vendor or other host process
    not on the allow-list)?
  context: 'Adversaries evade interpreter-focused detection by hosting PowerShell inside another process
    via the automation DLL, so the interpreter binary never launches. Per Palantir ADS-004, alert when
    System.Management.Automation.dll or System.Management.Automation.ni.dll is loaded (Sysmon Event ID
    7) by a host process that is not powershell.exe/pwsh.exe and not on the per-asset allow-list. On ICS
    assets this catches reflective in-memory PowerShell embedded in SCADA, HMI, or vendor processes, a
    stealthy Execution technique. A positive result is high-fidelity; tune the allow-list to known managed
    PowerShell hosts (e.g., legitimate management agents) to control false positives. Source references:
    [Palantir ADS-004](https://github.com/palantir/alerting-detection-strategy-framework/blob/master/ADS-Examples/004-Unusual-Powershell-Host-Process.md).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Servers,
    Jump Servers, Domain Controllers, OT DMZ, Remote Access Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=Sysmon EventID=7\n  AND ImageLoaded MATCHES /System\\.Management\\.Automation(\\.ni)?\\\
      .dll/i\n  AND Image NOT IN (powershell.exe,pwsh.exe)\n  AND Image NOT IN ps_host_allowlist[asset]\n\
      => ALERT high (unmanaged/embedded PowerShell host)"
- question: Are there application-control block events (WDAC/AppLocker) for interpreter launches, AMSI-blocked
    script content, or bursts of failed outbound connections (Zeek conn_state S0/REJ) and NXDOMAIN responses
    originating from powershell.exe on ICS assets?
  context: 'Failure and block states are distinct, high-priority Execution-tactic signals: a WDAC/AppLocker
    block proves something attempted to run a disallowed interpreter, an AMSI block proves malicious script
    content was scanned, and bursts of S0/REJ connections or NXDOMAIN from powershell.exe indicate beaconing
    or exfiltration to dead/sinkholed infrastructure. NSA/CISA ''Keeping PowerShell'' recommends enabling
    these controls plus Deep Script Block Logging. Treat each as its own signal rather than noise; clustered
    block/failure events around a single host or time window strongly suggest an active intrusion being
    partially contained by controls. Source references: [NSA/CISA Keeping PowerShell](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Servers,
    Jump Servers, Domain Controllers, OT DMZ, Remote Access Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventID IN (AppLocker/WDAC block, AMSI block) AND target_image IN (powershell.exe,pwsh.exe))

      OR (Zeek conn.log orig_proc=powershell.exe AND conn_state IN (S0,REJ))

      OR (Zeek dns.log query_by powershell.exe AND rcode_name==NXDOMAIN)

      => ALERT high; group by host, dedup window 10m'
- question: Do PowerShell script blocks (Event ID 4104) or command lines on a given user-host show abnormal
    Shannon entropy, low letter-frequency similarity to a benign reference, high non-alphanumeric ratio,
    or command-line length beyond the host baseline, and are egress volume/spawn frequency/failure ratios
    deviating sharply from normal?
  context: 'Obfuscated PowerShell defeats keyword rules, so a statistical baseline per user-host over
    30 days catches it. Following Revoke-Obfuscation and Lee Holmes, baseline script-block (Event ID 4104)
    Shannon entropy, letter-frequency cosine similarity to a benign profile, and non-alphanumeric character
    ratio; alert on entropy above the 98th percentile or command-line length above 3 standard deviations.
    Also baseline Volume (bytes egressed by powershell.exe), Frequency (powershell spawns/min), and State
    (failed/blocked connection ratio) and alert on >3-sigma deviations. This supports the Execution tactic
    by surfacing obfuscated and high-volume scripted activity that signature rules miss; pair anomalies
    with the deterministic rules to prioritize. Source references: [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    [Lee Holmes](https://www.leeholmes.com/more-detecting-obfuscated-powershell/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Servers,
    Jump Servers, Domain Controllers, OT DMZ, Remote Access Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per (user,host) over 30d on EventID=4104:\n  entropy=shannon(ScriptBlockText); nonalnum_ratio;\
      \ cmdlen=len(cmdline);\n  cos=letterfreq_cosine(ScriptBlockText, benign_profile)\nalert if entropy\
      \ > p98(baseline.entropy)\n   OR cmdlen > mean+3*std(baseline.cmdlen)\n   OR cos < p2(baseline.cos)\n\
      also baseline bytes_out, spawns_per_min, failed_conn_ratio; alert >3sigma"
- question: When deobfuscated PowerShell content (Event ID 4104 / AMSI captures) and per-execution behavioral
    features are scored by ML classifiers and an Isolation Forest, which executions are flagged as malicious
    or anomalous, and what are the top contributing features?
  context: 'To catch novel and obfuscated scripts beyond rules and simple statistics, score harvested
    4104/AMSI post-deobfuscation content with a hybrid-feature classifier (Fang et al.), an AST-structure
    classifier (Rusak et al.), or an embedding/CNN classifier (Hendler et al.), and run an Isolation Forest
    (Liu et al.) over per-execution features (command-line length, child-process count, bytes out, connection
    rate, rare path/parent flags) in parallel with the deterministic rules. This Execution-tactic analytic
    surfaces malicious scripts whose surface features look benign. Always surface the top-3 contributing
    features in the alert so an analyst can validate; treat ML hits as leads to corroborate against symbolic-logic
    and statistical signals. Source references: [Fang et al.](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099);
    [Rusak et al.](https://dl.acm.org/doi/10.1145/3243734.3278496); [Hendler et al.](https://arxiv.org/pdf/1905.09538);
    [Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Servers,
    Jump Servers, Domain Controllers, OT DMZ, Remote Access Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X_content = features(deobfuscate(4104/AMSI))  # hybrid + AST + embedding

      p_mal = classifier.predict_proba(X_content)

      X_exec = [cmdlen, child_count, bytes_out, conn_rate, rare_path, rare_parent]

      score = IsolationForest.decision_function(X_exec)

      alert if p_mal>0.8 OR score<contamination_thr

      emit top3_features(SHAP)'
- question: Is python.exe/pythonw.exe launching on a critical ICS asset from a path off the per-asset
    allow-list, executing a .py/.pyc written to disk within the previous 10 minutes, spawned by a non-allow-listed
    parent (not the SCADA application), or connecting to a TI-matched destination?
  context: 'Python interpreters on OT hosts should be tightly allow-listed; an off-list interpreter path,
    a just-written script, an unexpected parent, or an outbound connection to known-bad infrastructure
    all indicate adversary scripted Execution. Enforce allow-listing via WDAC/AppLocker (NSA/CISA) and
    correlate process creation (Sysmon Event ID 1 / Windows Event ID 4688) with recent file writes (Sysmon
    Event ID 11 / Zeek files.log) and outbound connections (Sysmon Event ID 3 / Zeek conn.log). Alert
    within 15 minutes of file creation to catch write-then-run chains. A positive result indicates unauthorized
    Python execution; tune the allow-list to legitimate engineering/vendor scripts to reduce noise. Source
    references: [NSA/CISA Keeping PowerShell](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - Zeek smb.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Process Control Servers, Data
    Historians, OT Network Segments, Jump Servers, OT DMZ'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc := (4688|Sysmon=1) WHERE image IN (python.exe,pythonw.exe)\nalert if image_path NOT IN\
      \ py_allowlist[asset]\n   OR EXISTS file_write(Sysmon=11|files.log) of (*.py|*.pyc) within 10m before\
      \ proc\n   OR parent_image NOT IN parent_allowlist[asset]\n   OR conn(Sysmon=3|conn.log) resp_h\
      \ IN TI_feed\nwindow=15m from file_create"
- question: Are Python processes generating bursts of NXDOMAIN responses or blocked/failed connections
    (Zeek conn_state S0/REJ/RSTO) above the host baseline, indicating beaconing or exfiltration to dead
    infrastructure?
  context: 'Failure-mode telemetry is a distinct Execution-tactic signal: a Python implant beaconing to
    taken-down or sinkholed C2 produces clustered NXDOMAIN (Zeek dns.log) and S0/REJ/RSTO connection attempts
    (Zeek conn.log) that look different from normal Python network behavior. Attribute these failures
    to the originating Python process and alert when the rate exceeds 3 standard deviations over the host
    baseline. A positive result points to malicious automated retry behavior even when the C2 endpoint
    is offline; corroborate with process-creation and file-write context to confirm.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
  - Zeek files.log
  - Zeek http.log
  - Zeek smb.log
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Process Control Servers, Data
    Historians, OT Network Segments, Jump Servers, OT DMZ'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "failures := union(\n  dns.log WHERE rcode_name==NXDOMAIN AND orig_proc=python*,\n  conn.log\
      \ WHERE conn_state IN (S0,REJ,RSTO) AND orig_proc=python*)\nrate := count(failures) per host per\
      \ 5m\nalert if rate > mean+3*std(baseline_rate[host])"
- question: Are first-seen Python script paths/hashes executing on a host, DNS queries with top-1% inverse-domain-frequency
    (rarest) for the OT segment, or >3-sigma spikes in per-process connection rate or bytes out occurring?
  context: 'Rarity is a powerful Execution-tactic indicator in stable OT environments. Alert on first-seen
    Python script path/hash per host, on DNS queries whose inverse-domain-frequency (IDF) ranks in the
    top 1% (rarest) for the OT segment, and on per-process connection-rate (Frequency) or bytes-out (Volume)
    spikes beyond 3 standard deviations. Model novel rare events with DeepLog sequence likelihood and
    outlier scoring with Isolation Forest, deriving thresholds from a 30-day per-asset baseline. A positive
    result highlights anomalous, never-before-seen scripting and rare-domain resolution consistent with
    new tooling or C2; a negative result confirms only known scripts and domains are in use. Source references:
    [DeepLog (Du et al.)](https://doi.org/10.1145/3133956.3134015); [Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Sysmon Event ID 11
