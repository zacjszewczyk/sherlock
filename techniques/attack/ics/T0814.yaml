questions:
- question: '[Inhibit Response Function] Correlate traffic floods with protocol errors: Can you determine
    whether a sustained, anomalous increase in network traffic volume (bytes or packets per second) or
    connection rate directed at a critical ICS device (e.g., PLC, RTU, HMI), where traffic metrics exceed
    the 99th percentile of a 30-day historical baseline for three consecutive 60-second intervals. This
    traffic surge is correlated with a simultaneous spike in ICS protocol-specific errors, such as Modbus
    exception codes, EtherNet/IP status errors, or DNP3 errors. -- specifically, using the ''Correlate
    traffic floods with protocol errors'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary uses a
    Denial-of-Service attack to render critical ICS devices unresponsive so they cannot perform expected
    response or control functions. This evidence focuses on: A sustained, anomalous increase in network
    traffic volume (bytes or packets per second) or connection rate directed at a critical ICS device
    (e.g., PLC, RTU, HMI), where traffic metrics exceed the 99th percentile of a 30-day historical baseline
    for three consecutive 60-second intervals. This traffic surge is correlated with a simultaneous spike
    in ICS protocol-specific errors, such as Modbus exception codes, EtherNet/IP status errors, or DNP3
    errors. The ''Correlate traffic floods with protocol errors'' approach (Symbolic Logic) works as follows:
    Per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    conduit allow-lists, alert when connection volume to a critical ICS device on its ICS ports (Modbus
    502, DNP3 20000, S7 102, EtherNet/IP 44818/2222) exceeds a hard rate (e.g., >500 conns/60s, tunable)
    in the SAME 60s window as a burst of protocol-specific errors (Modbus exception codes, DNP3 IIN error
    bits, EtherNet/IP status errors) from that device in Zeek logs. Implement the rate ceiling with [Suricata
    thresholding/rate_filter](https://docs.suricata.io/en/latest/rules/thresholding.html) (`detection_filter
    track by_dst, count N, seconds 60`) and correlate weak signals per [Ghorbani et al.](https://link.springer.com/book/10.1007/978-0-387-88771-5).
    Include Volume (bytes/packets), Frequency (conns/min), and State (error count) so the rule fires on
    the physics, not style. A positive result -- a rule match, statistical outlier, or model alert --
    is strong evidence of an in-progress or successful ICS DoS; pivot to the targeted device and its NAI,
    the source IP(s) and their concentration/entropy, the protocol and error/rejection counts, the traffic
    volume and timing, and any correlated host crash or service termination to scope the availability
    impact on the physical process. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since model-free detectors are evadable
    and a low-and-slow or crafted-packet DoS may evade a single method.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek ether_ip.log
  - Zeek dnp3.log
  - Zeek s7comm.log
  - 'NAI: ICS Network Segments (Purdue Levels 1-3), Control System DMZ, and network interfaces of critical
    devices (PLCs, RTUs, IEDs, HMIs, EWS, Historians).'
  range: Last 90 days; for correlation, pivot to a +/- 5 minute window around each candidate event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'alert when (conns_to_critical_dev on ports {502,20000,102,44818,2222} > 500 in 60s)

      AND (count(modbus_exception OR dnp3_IIN_error OR enip_status_error OR s7_error) burst in same 60s
      window)

      track by dst (detection_filter track by_dst, count 500, seconds 60); include volume,frequency,state'
- question: '[Inhibit Response Function] Baseline traffic volume and source entropy: Can you determine
    whether a sustained, anomalous increase in network traffic volume (bytes or packets per second) or
    connection rate directed at a critical ICS device (e.g., PLC, RTU, HMI), where traffic metrics exceed
    the 99th percentile of a 30-day historical baseline for three consecutive 60-second intervals. This
    traffic surge is correlated with a simultaneous spike in ICS protocol-specific errors, such as Modbus
    exception codes, EtherNet/IP status errors, or DNP3 errors. -- specifically, using the ''Baseline
    traffic volume and source entropy'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Inhibit Response Function tactic (TA0107), an adversary uses a
    Denial-of-Service attack to render critical ICS devices unresponsive so they cannot perform expected
    response or control functions. This evidence focuses on: A sustained, anomalous increase in network
    traffic volume (bytes or packets per second) or connection rate directed at a critical ICS device
    (e.g., PLC, RTU, HMI), where traffic metrics exceed the 99th percentile of a 30-day historical baseline
    for three consecutive 60-second intervals. This traffic surge is correlated with a simultaneous spike
    in ICS protocol-specific errors, such as Modbus exception codes, EtherNet/IP status errors, or DNP3
    errors. The ''Baseline traffic volume and source entropy'' approach (Statistical Method) works as
    follows: For each critical device, baseline 1-minute totals of bytes, packets, and new connections
    over 30 days; alert if any exceed the 99th percentile for three consecutive minutes (use [change-point/CUSUM
    survey](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5464762/) CUSUM to confirm a sustained shift
    rather than a transient). Strengthen when destination-IP entropy collapses and few sources dominate,
    the targeted-flood signature in [normalized traffic-entropy tracking, Lapolli et al.](https://arxiv.org/abs/2104.05117).
    Profile the failure mode explicitly: track the rate of protocol exception codes as a distinct series
    and alert on its own percentile breach. Derive thresholds per asset from the site''s own baseline;
    benchmark with [CIC-DDoS2019](https://www.unb.ca/cic/datasets/ddos-2019.html). A positive result --
    a rule match, statistical outlier, or model alert -- is strong evidence of an in-progress or successful
    ICS DoS; pivot to the targeted device and its NAI, the source IP(s) and their concentration/entropy,
    the protocol and error/rejection counts, the traffic volume and timing, and any correlated host crash
    or service termination to scope the availability impact on the physical process. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since model-free detectors are evadable and a low-and-slow or crafted-packet DoS may evade
    a single method.'
