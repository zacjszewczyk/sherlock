name: 'T0814: Denial of Service'
id: 5593616d-435c-4939-96c2-936cd9e1879b
description: 'This playbook helps an analyst investigate whether an adversary is performing a Denial-of-Service
  (DoS) attack to disrupt expected industrial control system (ICS) device functionality (MITRE ATT&CK
  for ICS T0814, Denial of Service). DoS against ICS can render PLCs, RTUs, IEDs, HMIs, engineering workstations,
  historians, and OPC/SCADA servers unresponsive -- so they cannot send or receive requests or perform
  expected response functions -- through high-volume request floods, malformed/crafted packets that a
  device does not know how to handle, resource-exhaustion exploits, or even a permanent DoS (PDoS) that
  bricks a device. The hunt pursues the behavior from complementary angles: sustained anomalous surges
  in traffic volume, connection rate, byte counts, and source-entropy collapse directed at critical ICS
  assets; bursts of ICS protocol-specific errors (Modbus exception codes, DNP3 IIN error bits, EtherNet/IP/S7
  status errors) correlated with those floods; concentrated rejected/aborted connection storms (Zeek conn_state
  REJ/RSTO/RSTR/S0) from a small set of sources; external flood attempts paired with Zeek scan notices
  against the same target; unexpected Windows host crashes and service terminations (Event IDs 1000, 1002,
  7031, 7034, 7024) on ICS hosts that are temporally correlated with preceding network floods and that
  fail to recover; and the stalled telemetry / frozen-value signature of a successful DoS on the underlying
  process. Detection methods combine deterministic symbolic-logic rules (per-destination rate ceilings
  with Suricata thresholding, allow-list/conduit enforcement per NIST SP 800-82r3, flood-plus-error and
  crash-after-flood correlation, service-crash-without-restart logic), statistical baselining (30-day
  99th/99.9th-percentile thresholds, CUSUM change-point detection, destination/source-IP entropy tracking,
  MTBF and rare-error-code analysis, PAYL-style byte-frequency deviation), and machine learning (Kitsune
  online autoencoder ensembles, Extended Isolation Forest / DBSCAN flow and rejection clustering, seq2seq
  and 1D-CNN sequence models for crash prediction, with SHAP feature attribution), applied across Zeek
  conn/modbus/dnp3/ether_ip/s7comm/notice logs and Windows Event Logs, so the analyst can corroborate
  a suspected ICS DoS against network, protocol, host, and process context.'
