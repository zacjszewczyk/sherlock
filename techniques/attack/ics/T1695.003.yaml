questions:
- question: Are 802.11 de-authentication or disassociation frames being directed at (or spoofed from)
    critical wireless OT clients/BSSIDs above a deterministic threshold, and are duplicate or spoofed
    beacon frames advertising an OT SSID from an unexpected BSSID or channel?
  context: Deauthentication and disassociation floods are a low-cost way to forcibly knock wireless OT
    clients off their access point, denying control and status messages while leaving wired infrastructure
    intact -- a direct Inhibit Response Function effect. Alert when deauth/disassoc frames targeting a
    critical wireless OT BSSID or client exceed a deterministic floor (e.g., >5 deauth/disassoc frames
    per client per 10s, or any deauth burst against an OT client outside a maintenance window), and when
    duplicate beacons carry the same SSID but a different/spoofed BSSID or appear on an unexpected channel.
    These attacks still succeed against WPA3 and evade stock IDS, so deploy explicit signatures and prefer
    802.11w management-frame protection. A positive result is a burst of management frames followed by
    client disconnect and loss of periodic reporting; a negative result is normal roaming with sustained
    telemetry. Pay special attention to disconnects that immediately precede wireless-service disablement.
  answer_sources:
  - Wireless LAN controller syslog/telemetry (association, disassociation, deauth, carrier-sense/CCA counters)
  - Access point logs/telemetry (RSSI, SNR, retries, delivery ratio, client state)
  - Wireless intrusion detection/prevention (WIDS/WIPS) alerts
  - PCAP / 802.11 monitor-mode captures
  - Wireless client OS logs (adapter enable/disable, wireless service state)
  - RF spectrum analyzer / SDR sensor data
  - SCADA/HMI connectivity and communication-failure alarm logs
  - OT process historian (reporting volume/frequency, telemetry timestamps)
  - 'NAI: Wireless OT access points, plant-floor wireless zones, wireless client endpoints, and RF monitoring
    locations around the control network.'
  range: Last 90 days
  queries:
  - technology: WIDS/Stats pseudocode
    query: |-
      monitor 802.11 mgmt frames where frame_type in (deauth, disassoc)
      | filter target_bssid in OT_CRITICAL_BSSIDS or src spoofed
      | bin 10s by client
      | where count > 5 or (count >= 1 and not in_maintenance_window)
      ALSO alert beacon where ssid in OT_SSIDS and (bssid not in AUTHORIZED_BSSIDS or channel != expected_channel)
- question: At the AP/WLAN controller, are stations transmitting while the medium is sensed busy, and
    do intervals of high channel energy / CCA-busy time coincide with near-zero successful frame delivery,
    indicating a reactive or constant jammer rather than congestion?
  context: RF jamming blocks Wi-Fi without touching any host, making it a stealthy Inhibit Response Function
    technique. The distinguishing signature of jamming versus ordinary congestion is a medium that is
    sensed busy (high CCA-busy time / channel energy) while almost no frames are successfully delivered
    -- legitimate congestion still produces successful transmissions. Flag carrier-sense (CSMA/CA) violations
    where a station transmits despite a busy medium, and RF intervals where high channel energy coincides
    with delivery-ratio collapse. Model this as carrier-sense hypothesis testing and account for hidden-terminal
    effects from the AP vantage point. A positive result is sustained CCA-busy with delivery collapse
    localized to the OT cell; a negative result is busy-with-throughput (real congestion).
  answer_sources:
  - Wireless LAN controller syslog/telemetry (association, disassociation, deauth, carrier-sense/CCA counters)
  - Access point logs/telemetry (RSSI, SNR, retries, delivery ratio, client state)
  - Wireless intrusion detection/prevention (WIDS/WIPS) alerts
  - PCAP / 802.11 monitor-mode captures
  - Wireless client OS logs (adapter enable/disable, wireless service state)
  - RF spectrum analyzer / SDR sensor data
  - SCADA/HMI connectivity and communication-failure alarm logs
  - OT process historian (reporting volume/frequency, telemetry timestamps)
  - 'NAI: Wireless OT access points, plant-floor wireless zones, wireless client endpoints, and RF monitoring
    locations around the control network.'
  range: Last 90 days
  queries:
  - technology: WLAN-controller/Stats pseudocode
    query: |-
      from ap_telemetry
      | compute cca_busy_ratio, channel_energy, delivery_ratio per 5s per cell
      | where cca_busy_ratio > 0.7 and delivery_ratio < 0.1
      | OR detect tx_while_medium_busy (carrier_sense_violation)
      | exclude hidden_terminal_explained
      -> alert reactive/constant jammer
- question: Is any access point servicing OT clients advertising an authorized SSID while its BSSID, upstream
    gateway/forwarding identity, or physical location does not match the sanctioned wireless inventory?
  context: An evil-twin or rogue AP lets an adversary perform Adversary-in-the-Middle and selectively
    drop OT traffic, inhibiting response functions while appearing as the legitimate network. Validate
    every AP serving OT clients against an authorized inventory of BSSID, gateway/forwarding identity,
    and physical location; alert on any AP advertising a sanctioned SSID whose upstream gateway or forwarding
    information does not match approved infrastructure. Centralized SDN-style validation enables deterministic
    blocking. A positive result is an AP with a known SSID but an unknown BSSID or an upstream path that
    does not lead to sanctioned gateways; a negative result is a full match against inventory.
  answer_sources:
  - Wireless LAN controller syslog/telemetry (association, disassociation, deauth, carrier-sense/CCA counters)
  - Access point logs/telemetry (RSSI, SNR, retries, delivery ratio, client state)
  - Wireless intrusion detection/prevention (WIDS/WIPS) alerts
  - PCAP / 802.11 monitor-mode captures
  - Wireless client OS logs (adapter enable/disable, wireless service state)
  - RF spectrum analyzer / SDR sensor data
  - SCADA/HMI connectivity and communication-failure alarm logs
  - OT process historian (reporting volume/frequency, telemetry timestamps)
  - 'NAI: Wireless OT access points, plant-floor wireless zones, wireless client endpoints, and RF monitoring
    locations around the control network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for each ap advertising ssid in OT_SSIDS:
        if bssid not in AUTHORIZED_INVENTORY.bssid
           or upstream_gateway not in SANCTIONED_GATEWAYS
           or location not in AUTHORIZED_INVENTORY.location:
             alert 'rogue/evil-twin AP servicing OT clients'
- question: Do wireless client adapter-disable, profile-change, or wireless-service-stop events (or unexpected
    termination of ICS automation/protocol processes) correlate with an immediate loss of association
    to the expected AP on OT hosts?
  context: An adversary can block Wi-Fi by disabling the network interface, stopping the wireless service,
    or killing ICS automation/protocol processes on the client -- a host-side Inhibit Response Function
    approach. Correlate adapter-disable, wireless-profile-change, and service-stop events (and unexpected
    ICS process termination) with an immediate loss of association to the expected AP. Escalate when the
    disconnect is isolated to the OT wireless cell, the client stops sending control/status messages,
    and other hosts on the segment remain reachable -- this rules out a broad outage and points to targeted
    inhibition. A positive result is service-stop/adapter-down immediately followed by association loss
    and reporting silence on a single OT host.
  answer_sources:
  - Wireless LAN controller syslog/telemetry (association, disassociation, deauth, carrier-sense/CCA counters)
  - Access point logs/telemetry (RSSI, SNR, retries, delivery ratio, client state)
  - Wireless intrusion detection/prevention (WIDS/WIPS) alerts
  - PCAP / 802.11 monitor-mode captures
