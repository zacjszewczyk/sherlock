  - RF spectrum analyzer / SDR sensor data
  - SCADA/HMI connectivity and communication-failure alarm logs
  - OT process historian (reporting volume/frequency, telemetry timestamps)
  - 'NAI: Wireless OT access points, plant-floor wireless zones, wireless client endpoints, and RF monitoring
    locations around the control network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      join host_events (adapter_disable | wlan_profile_change | wlan_service_stop |
                       ics_process_termination)
        with wireless_assoc_loss within 60s on same host
      | where host in OT_WIRELESS_CELL and reporting_messages stop
      | and peer_hosts_on_segment still_reachable
      -> escalate targeted wireless inhibition
- question: Do mined invariant predicates over correlated sensor/actuator values break, or does the periodic
    PLC-to-server reporting cadence (modeled as a deterministic finite automaton) show missing, delayed,
    or out-of-sequence messages consistent with a blocked wireless link?
  context: When Wi-Fi is blocked, telemetry from the affected link goes stale or missing; enforcing mined
    invariant predicates over correlated sensor/actuator values means stale/missing data breaks a hard
    predicate and raises an explainable alert. Complement this by modeling the periodic PLC-to-server
    reporting cadence as a deterministic finite automaton (DFA) and flagging missing, delayed, or out-of-sequence
    messages as model violations. This does not directly observe the blocking mechanism but provides strong
    corroborating evidence of communication loss tied to the Inhibit Response Function objective. A positive
    result is a predicate/automaton violation coincident with wireless anomalies; a negative result is
    on-cadence, invariant-consistent reporting.
  answer_sources:
  - Wireless LAN controller syslog/telemetry (association, disassociation, deauth, carrier-sense/CCA counters)
