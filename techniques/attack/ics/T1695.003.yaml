  - 'NAI: Wireless OT access points, plant-floor wireless zones, wireless client endpoints, and RF monitoring
    locations around the control network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      collect rssi_vectors per ssid/bssid from distributed_sensors
      | cluster(rssi_vectors)
      | if cluster_count(ssid) > 1: alert 'two physical transmitters for one identity (evil twin)'
      | localize via centroid
- question: Can a supervised classifier over PHY/MAC features separate malicious RF jamming from environmental
    noise, and do its top contributing features correlate with SCADA communication-failure alarms?
  context: Distinguishing malicious jamming from benign interference or configuration errors is hard with
    thresholds alone. Train a supervised classifier (e.g., Random Forest for interpretable feature importance)
    on PHY/MAC features -- delivery ratio, CCA/CCA-busy time, retry spikes, channel occupancy, RSSI/SNR,
    spectral energy distribution -- and evaluate with probability of detection, false-alarm, and miss-detection
    rates. Prefer cross-layer models trained on over-the-air data with adaptive classifier selection,
    and fall back to protocol-independent one-class/autoencoder RF anomaly detection where host logs are
    absent. Surface the top-3 contributing features (e.g., delivery-ratio collapse, RSSI delta, retry
    spike) in the alert and correlate with SCADA communication-failure alarms to separate physical interference
    from configuration errors. A positive result is a high-confidence jamming classification corroborated
    by OT alarms.
