      features = [delivery_ratio, cca_busy_time, retry_spikes, channel_occupancy, rssi, snr,
                  spectral_energy_distribution]
      model = RandomForest.train(labeled: jamming vs noise)
      pred = model.predict(features); report top3_feature_importance
      | if pred == jamming: alert + correlate with scada_comm_failure_alarms
- question: Does an unsupervised online autoencoder ensemble over incrementally-computed wireless flow
    statistics (bandwidth, packet rate, jitter) show elevated reconstruction error indicating degraded
    or lost OT flows, with explainable attribution to driving signals?
  context: Where labels are unavailable, unsupervised anomaly detection can flag degraded or lost OT flows
    from wireless blocking. Apply an online autoencoder ensemble (e.g., Kitsune-style) over incrementally-computed
    wireless flow statistics -- bandwidth, packet rate, jitter -- so reconstruction error rises when flows
    degrade, runnable on low-power edge sensors without labels. Pair an LSTM variational autoencoder with
    SHAP over the reporting/telemetry stream to attribute each communication-loss anomaly to its top driving
    signals, producing analyst-actionable explainable alerts. A positive result is a sustained reconstruction-error
    spike on OT flows aligned with wireless control-plane anomalies; a negative result is stable, low
    reconstruction error.
