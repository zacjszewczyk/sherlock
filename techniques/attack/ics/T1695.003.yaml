    query: |-
      for each reporting_stream:
        check invariant_predicates(correlated_sensor_actuator_values)
        run dfa(expected_cadence) over message_timestamps
      | flag predicate_break or (missing | delayed | out_of_sequence) messages
      | correlate with wireless_anomaly window
- question: For stationary wireless OT assets, has RSSI, SNR, retry rate, delivery ratio, or reconnect
    interval shown an abrupt, sustained collapse (via change-point detection) distinct from gradual environmental
    drift?
  context: Stationary OT wireless assets have stable signal characteristics, so an abrupt, sustained collapse
    in RSSI/SNR/delivery ratio or a spike in retries/reconnects is a strong indicator of jamming or blocking
    rather than slow environmental change. Establish per-device baselines and apply change-point detection
    (CUSUM/PELT/Bayesian online) to catch the step change. Tune thresholds per cell from 2-4 weeks of
    baseline -- for example, alert on an RSSI drop > 15 dB sustained > 30s, or delivery ratio < 50% of
    baseline. A positive result is a sharp, persistent shift in signal quality; gradual drift over days
    is benign environmental change.
  answer_sources:
