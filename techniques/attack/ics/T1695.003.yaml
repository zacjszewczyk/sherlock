      per wireless_ot_endpoint: model expected report_bytes, report_count, frequency
      | cusum(residual) -> alert when statistic exceeds threshold (slow/stealthy drop)
      | matrix_profile(reporting_timeseries) -> flag discords (sudden frequency drop)
- question: Do RSSI vectors collected from distributed sensors for a single SSID/BSSID form two distinct
    clusters, indicating two physical transmitters (a genuine AP plus an evil twin) used to intercept
    and drop OT traffic?
  context: A genuine AP and an evil twin occupy different physical locations, so RSSI measurements from
    distributed sensors for the same SSID/BSSID will form two distinct clusters when an evil twin is present.
    Collect RSSI vectors per advertised SSID from multiple sensors and cluster them; two clusters reveal
    two transmitters, and cluster centroids can help localize the rogue AP for physical response. This
    addresses the AitM/evil-twin path to Wi-Fi blocking. A positive result is a bimodal RSSI distribution
    for one identity; a negative result is a single coherent cluster consistent with one physical AP.
  answer_sources:
