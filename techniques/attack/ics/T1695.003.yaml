  - 'NAI: Wireless OT access points, plant-floor wireless zones, wireless client endpoints, and RF monitoring
    locations around the control network.'
  range: Last 90 days (baseline 2-4 weeks; event-centered +/- 1h on alerts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline per device: rssi, snr, retry_rate, delivery_ratio, reconnect_interval (2-4 weeks)
      | changepoint(CUSUM | PELT | BayesianOnline) on each metric
      | alert if rssi_drop > 15dB sustained > 30s
             or delivery_ratio < 0.5 * baseline sustained
      | only stationary OT assets
- question: Are association/disassociation churn, client-silence duration, retry spikes, reconnect counts,
    or communication-failure alarms per wireless OT device elevated beyond historical roaming/maintenance
    behavior, especially across multiple clients in one RF zone?
  context: Wireless blocking often manifests as repeated association/disassociation churn, prolonged client
    silence, retry spikes, and rising communication-failure alarms. Profile these failure rates per device
    against historical roaming and maintenance behavior. Flag a cell when multiple clients drop within
    the same RF zone (suggesting jamming/zone-wide effect) or when a single client repeatedly reconnects
    but never resumes normal command/status exchange (suggesting AitM drop or targeted inhibition). A
    positive result is churn/failure rates well above baseline correlated in space or persistent without
    traffic recovery; a negative result is occasional roaming that resumes normal exchange.
  answer_sources:
