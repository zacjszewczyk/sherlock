name: 'T1695.003: Wi-Fi'
id: 4e441e05-4313-4654-8e12-0940790b4623
description: This playbook helps an analyst investigate whether an adversary has blocked Wi-Fi communications
  to prevent instructions, commands, configurations, or reporting messages from reaching target OT/ICS
  systems and devices (MITRE ATT&CK T1695.003, Inhibit Response Function). Wi-Fi may be blocked by disabling
  network interfaces, stopping wireless services or ICS automation processes, conducting an Adversary-in-the-Middle
  attack and dropping traffic, deploying a rogue/evil-twin access point, or jamming the RF spectrum. The
  playbook guides the analyst through correlating wireless control-plane telemetry (association/disassociation
  churn, deauthentication/disassociation frames, beacon anomalies, RSSI/SNR collapse, retry spikes, delivery-ratio
  drops, carrier-sense/CCA violations, and RF energy without successful frame delivery) with OT process
  evidence (loss of periodic telemetry, communication-failure alarms, reporting-cadence violations, and
  unexpected process/service termination). It combines deterministic symbolic-logic detections, statistical
  baselining and change-point methods, and machine-learning classifiers to distinguish malicious wireless
  inhibition from benign interference, roaming, or configuration errors.
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
