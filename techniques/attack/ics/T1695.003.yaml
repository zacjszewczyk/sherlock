- question: Does expected reporting volume (byte/message counts) and frequency per wireless OT endpoint
    show a stateful CUSUM accumulation or a Matrix-Profile discord consistent with frozen, missing, or
    slowly-degrading telemetry?
  context: Stealthy blocking may slowly degrade or freeze telemetry rather than cut it cleanly. Model
    expected reporting volume and frequency per wireless OT endpoint and apply a stateful CUSUM residual
    test so frozen or missing telemetry accumulates the statistic and triggers even under slow degradation.
    Run the near-parameter-free Matrix Profile over the reporting time series to surface sudden frequency
    drops as discords. A positive result is a sustained CUSUM excursion or a clear discord aligned with
    wireless anomalies; a negative result is reporting volume within normal variation.
