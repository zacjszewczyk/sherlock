name: 'T0845: Program Upload'
id: fd4d7e71-01ee-4b1d-b970-cc0414a24121
description: 'This playbook helps an analyst investigate whether an adversary is uploading (reading out)
  the control logic from a Programmable Logic Controller (PLC) for reconnaissance or analysis (MITRE ATT&CK
  for ICS T0845, Program Upload). Under the Collection tactic, an actor uses vendor engineering software
  (e.g., Siemens TIA Portal, Rockwell Studio 5000/RSLogix) or crafted ICS protocol traffic to acquire
  and study the program running on a PLC, typically as a precursor to manipulating the process. The hunt
  pursues the behavior from several complementary angles: ICS programming-port sessions (e.g., TCP/102
  S7comm, TCP/44818 EtherNet/IP, Allen-Bradley PCCC) carrying upload/read-logic function codes or anomalously
  large PLC-to-client transfers indicative of a full logic readout; engineering applications launched
  on an Engineering Workstation (EWS) by an unauthorized user, from a non-standard path, or by an unusual
  parent process (powershell.exe, cmd.exe) and immediately followed by a PLC connection; and anomalous
  interactive or remote logons to an EWS that precede PLC upload activity. Detection methods combine deterministic
  symbolic-logic rules (protocol function-code and source/destination allowlisting, specification/invariant
  enforcement, engineering-tool execution allowlists, and logon-to-upload correlation), statistical baselining
  (per-pair upload byte-volume baselines, rare-transaction probability scoring, failed/partial-upload
  profiling, command-line entropy baselines, and logon risk scoring), and machine learning (unsupervised
  reconstruction/seq2seq flow models, supervised execution classifiers, and explainable UEBA session scoring),
  applied across Zeek conn/s7comm/enip logs and Windows process-creation, network-connection, and logon
  events, so the analyst can corroborate suspected PLC program upload against network, host, user, and
  process context. The NAIs span Process Control Network (PCN) taps between Purdue Level 1 and Level 2,
  EDR/host logging on EWS and HMIs at Level 2, and Active Directory domain controllers.'
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
