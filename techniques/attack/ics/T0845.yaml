questions:
- question: '[Collection] Alert on unauthorized PLC program upload commands: Can you determine whether
    a network session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP)
    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
    contains specific program upload function codes. -- specifically, using the ''Alert on unauthorized
    PLC program upload commands'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic, an adversary uploads (reads out) PLC control
    logic to acquire and study the underlying program, gathering the domain knowledge needed to plan,
    execute, or revise an ICS attack against the process. This evidence focuses on the condition that
    a network session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP)
    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
    contains specific program upload function codes. The ''Alert on unauthorized PLC program upload commands''
    approach (Symbolic Logic) works as follows: Query ICS protocol logs (e.g., Zeek s7comm.log, enip.log)
    for function codes that read/upload program or data blocks (e.g., S7comm job "Upload"/"PLC Upload"
    subfunctions and Read-SZL, EtherNet/IP CIP "Get_Attribute_All" (0x01) / "Read Tag" services on Program/Logic
    objects, and Allen-Bradley PCCC upload functions which are observable and reconstructable on the wire
    per [SCADA Network Forensics of the PCCC Protocol](https://www.sciencedirect.com/science/article/pii/S1742287617301988)).
    Correlate the requesting client IP against a maintained allowlist of authorized Engineering Workstations
    (EWS) and the destination against the authorized PLC, per the command/protocol allowlisting and maintenance-window
    controls in [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    Trigger a high-priority alert if an upload/read-logic command is issued by an unauthorized device,
    to an unexpected PLC, or outside a documented maintenance window. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates a probable PLC program upload; pivot to the responsible
    host or Engineering Workstation, the user/account, the source and destination IPs, the targeted PLC
    and programming port/protocol (S7comm TCP/102, EtherNet/IP TCP/44818, PCCC), the function codes and
    byte volume of the transfer, and the surrounding logon and process-creation activity to scope intent
    and whether the logic was actually read out. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, partial, or living-off-the-land upload activity, and not all PLCs emit alarms when their
    program is read.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek enip.log
  - 'NAI: Network taps or SPAN ports on Process Control Network (PCN) switches, specifically monitoring
    traffic between Purdue Model Level 1 (Control Devices) and Level 2 (Supervisory Control).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: FROM s7comm.log, enip.log WHERE funccode IN (S7_UPLOAD, S7_PLC_UPLOAD, READ_SZL, CIP_GET_ATTRIBUTE_ALL(0x01),
      CIP_READ_TAG, PCCC_UPLOAD) AND (orig_h NOT IN (authorized_EWS_allowlist) OR resp_h NOT IN (authorized_PLC)
      OR ts NOT IN maintenance_window) => ALERT high
  - technology: SIEM/Spec-rule pseudocode
    query: ALLOWED := {(src,dst,funccode,block_range)} /* mined invariants */; FROM ics_proto_log WHERE
      is_upload(funccode) AND (src,dst,funccode,block_range) NOT IN ALLOWED => DENY+ALERT /* incl. PLC-to-PLC
      or non-EWS upload */
- question: '[Collection] Enforce protocol-semantic specification rules for upload flows: Can you determine
    whether a network session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP)
    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
    contains specific program upload function codes. -- specifically, using the ''Enforce protocol-semantic
    specification rules for upload flows'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic, an adversary uploads (reads out) PLC control
    logic to acquire and study the underlying program, gathering the domain knowledge needed to plan,
    execute, or revise an ICS attack against the process. This evidence focuses on the condition that
    a network session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP)
    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
    contains specific program upload function codes. The ''Enforce protocol-semantic specification rules
    for upload flows'' approach (Symbolic Logic) works as follows: Encode legitimate (source, destination,
    function code, point/block range) tuples as specification rules so that any upload/read message violating
    the allowed protocol semantics or communication flow is flagged deterministically, following the auto-generated
    semantic rule sets in [Distributed IDS using Semantic-based Rules for SCADA, Mohan et al.](https://arxiv.org/abs/2412.07917)
    and the graph-based specification whitelisting in [On Specification-based Cyber-Attack Detection in
    Smart Grids, Sen et al.](https://arxiv.org/abs/2209.04354). Additionally enforce mined communication
    invariants (e.g., "program-upload sessions originate only from EWS X during maintenance windows")
    as explainable runtime checks per [A Systematic Framework to Generate Invariants for ICS, Feng et
    al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf); a non-EWS
    or off-hours upload breaks the invariant. PLC-to-PLC or non-EWS upload/download sessions are a concrete
    deny-condition demonstrated by [PLC-Blaster, Spenneberg et al.](https://www.blackhat.com/docs/asia-16/materials/asia-16-Spenneberg-PLC-Blaster-A-Worm-Living-Solely-In-The-PLC-wp.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable PLC
