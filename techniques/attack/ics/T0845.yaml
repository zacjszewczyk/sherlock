    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
    contains specific program upload function codes. The ''Score rare upload transactions probabilistically''
    approach (Statistical Method) works as follows: Model the per-device distribution of ICS transactions
    (function code x source x destination x time-of-day) and assign a low-probability/high-risk score
    to rare upload/read-logic transactions, following the probabilistic transaction modeling of [Probability
