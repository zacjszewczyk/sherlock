    source host, byte count) in the alert text. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a probable PLC program upload; pivot to the responsible host or Engineering
    Workstation, the user/account, the source and destination IPs, the targeted PLC and programming port/protocol
    (S7comm TCP/102, EtherNet/IP TCP/44818, PCCC), the function codes and byte volume of the transfer,
    and the surrounding logon and process-creation activity to scope intent and whether the logic was
    actually read out. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, partial, or living-off-the-land
    upload activity, and not all PLCs emit alarms when their program is read.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: model P(funccode x src x dst x hour) per device; FROM ics_txn WHERE P(txn) < tuned_floor OR
      (src,dst,funccode) == first_seen => ALERT (surface funccode, src, byte_count)
- question: '[Collection] Profile failed and partial upload sessions: Can you determine whether a network
    session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP) originating
    from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or contains specific
    program upload function codes. -- specifically, using the ''Profile failed and partial upload sessions''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Collection tactic, an adversary uploads (reads out) PLC control
    logic to acquire and study the underlying program, gathering the domain knowledge needed to plan,
    execute, or revise an ICS attack against the process. This evidence focuses on the condition that
    a network session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP)
    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
    contains specific program upload function codes. The ''Profile failed and partial upload sessions''
    approach (Statistical Method) works as follows: Explicitly count and baseline failure-mode signals
    as distinct metrics: firewall-blocked connection attempts to programming ports (e.g., denied TCP/102,
