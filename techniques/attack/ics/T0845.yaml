    terminated before the expected full-logic byte volume). Alert on bursts of blocked or failed upload
    attempts (e.g., >=3 blocked connections from one source in 5 minutes) which indicate reconnaissance
    or an upload attempt against access controls, consistent with the failure-rate signal emphasis in
    [Machine Learning for Intrusion Detection in ICS, Umer et al.](https://arxiv.org/abs/2202.11917).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable PLC
    program upload; pivot to the responsible host or Engineering Workstation, the user/account, the source
    and destination IPs, the targeted PLC and programming port/protocol (S7comm TCP/102, EtherNet/IP TCP/44818,
    PCCC), the function codes and byte volume of the transfer, and the surrounding logon and process-creation
    activity to scope intent and whether the logic was actually read out. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, partial, or living-off-the-land upload activity, and not all PLCs
    emit alarms when their program is read.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: metrics = count(fw_denied to dport in (102,44818)), count(ics_error/abort), count(tcp_rst),
      count(partial_upload< expected_bytes); FROM blocked WHERE count_by(src,5m) >= 3 => ALERT /* recon
      or upload attempt vs access controls */
- question: '[Collection] Detect anomalous PLC upload traffic patterns: Can you determine whether a network
