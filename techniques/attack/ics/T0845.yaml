    engineering application launches'' approach (Symbolic Logic) works as follows: Enforce a strict execution
    allowlist for ICS engineering software per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
