- question: '[Collection] Baseline PLC-to-client upload byte volumes: Can you determine whether a network
    session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP) originating
    from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or contains specific
    program upload function codes. -- specifically, using the ''Baseline PLC-to-client upload byte volumes''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Collection tactic, an adversary uploads (reads out) PLC control
    logic to acquire and study the underlying program, gathering the domain knowledge needed to plan,
    execute, or revise an ICS attack against the process. This evidence focuses on the condition that
    a network session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP)
    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
    contains specific program upload function codes. The ''Baseline PLC-to-client upload byte volumes''
    approach (Statistical Method) works as follows: For each unique PLC-to-client IP pair on ICS programming
    ports, establish a 30-day rolling baseline of the mean and standard deviation for "resp_bytes" from
    Zeek conn.log, aggregated in 5-minute intervals. Generate an alert when aggregated "resp_bytes" for
    an interval exceeds the 99th percentile or deviates by more than 3 standard deviations from its historical
    mean, indicating an unusually large transfer from the PLC (a full logic upload). Treat the byte-volume
    and transaction-frequency deviations as discords using the near-parameter-free Matrix Profile and
    rank contributing features per [Anomaly-based Intrusion Detection with SVM and Random Forests, Anton
    et al.](https://arxiv.org/abs/1907.10374); derive dataset-specific thresholds from public ICS captures
    catalogued by [A Survey on ICS Testbeds and Datasets, Conti et al.](https://arxiv.org/abs/2102.05631).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable PLC
    program upload; pivot to the responsible host or Engineering Workstation, the user/account, the source
    and destination IPs, the targeted PLC and programming port/protocol (S7comm TCP/102, EtherNet/IP TCP/44818,
    PCCC), the function codes and byte volume of the transfer, and the surrounding logon and process-creation
    activity to scope intent and whether the logic was actually read out. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, partial, or living-off-the-land upload activity, and not all PLCs
    emit alarms when their program is read.'
  answer_sources: *id001
  range: Last 90 days; build per-entity baselines over a trailing 30-day window
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'FOR each (PLC,client) on dport in (102,44818): baseline = rolling_30d(mean,std of resp_bytes
      per 5m); FROM conn.log WHERE sum(resp_bytes,5m) > p99 OR sum(resp_bytes,5m) > mean+3*std => ALERT
      /* large PLC->client transfer = full logic upload; matrix-profile discord */'
- question: '[Collection] Score rare upload transactions probabilistically: Can you determine whether
    a network session on an ICS programming port (e.g., TCP/102 for S7comm, TCP/44818 for EtherNet/IP)
    originating from a PLC where the data transferred to the client (e.g., EWS) is anomalously large or
