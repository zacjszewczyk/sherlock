name: 'T0888: Remote System Information Discovery'
id: 9f3cf6c7-4cd5-4f2a-8974-c507af4a951b
description: Investigate whether an adversary is performing Remote System Information Discovery against
  ICS assets to enumerate make/model, operational role, and configuration of remote devices and their
  peripherals in order to shape targeting and follow-on actions. This playbook helps an analyst detect
  unauthorized or anomalous device-identification activity over ICS protocols (e.g., Modbus function code
  43 Read Device Identification, DNP3 object group 0/10, EtherNet/IP ListIdentity) and over enterprise
  enumeration protocols (SMB/DCE-RPC, WinRM, DCOM, ICMP), including allowlist violations, sequential IP
  sweeps, fan-out to many devices, connection-failure-ratio scan patterns, volume/frequency baseline deviations
  on authorized hosts, periodicity/timing anomalies in machine-to-machine polling, and unsupervised flow
  anomalies. It also covers host-centric evidence such as un-allowlisted or office/browser-spawned processes
  on Engineering Workstations, HMIs, SCADA servers, historians, and jump hosts that rapidly connect to
  multiple ICS device IPs shortly after launch, correlating Windows process-creation and logon events
  with Zeek ICS protocol traffic so the analyst can confirm reconnaissance and scope the affected OT segments.
type: technique
related:
- tactic_id: TA0102
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any source IP that is not on the authorized OT management allowlist issuing ICS device-identification
    requests (Modbus FC43 Read Device Identification, DNP3 object group 0/10, EtherNet/IP ListIdentity/GetAttributesAll),
    and is any single unauthorized source contacting more than 5 unique ICS device IPs within a 60-second
    window?
  context: Discovery against ICS depends on querying devices for their identity and configuration. Under
    a deny-by-default policy (NIST SP 800-82 Rev. 3), only specific OT management hosts should ever issue
    identification functions to a given device/protocol. By filtering Zeek ICS logs for the identification
    function codes and checking each source IP against the per-destination/protocol allowlist, an analyst
    can deterministically flag any request from an unauthorized host. Enforce protocol semantics (valid
    function code, command/response pairing, correct source->destination relationship, and point/register
    range) to reject malformed or spec-violating requests with low false positives. A non-allowlisted
    source touching more than 5 unique destination IPs in 60 seconds is a strong indicator of a discovery
    sweep and should escalate to critical. A positive result means an unauthorized host is enumerating
    ICS devices to map targets; a negative result means identification traffic is confined to sanctioned
    managers.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - 'NAI: OT network segments (e.g., Process Control Network VLANs, Safety Instrumented System networks),
    network traffic aggregation points (e.g., span ports on core switches), Industrial Demilitarized Zone
    (IDMZ) gateways, and subnets containing SCADA servers, Engineering Workstations, or Data Historians.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      ICS_ID := (modbus.func==43) OR (dnp3.obj_group in [0,10]) OR (enip.command in ['ListIdentity','GetAttributesAll'])

      filter ICS_ID

      | where id.orig_h NOT IN allowlist[id.resp_h, proto]
         OR violates_spec(func, command_response_pairing, register_range)
      | emit high_alert(src=id.orig_h, dst=id.resp_h, proto)

      | by id.orig_h within 60s: dcount(id.resp_h) as fanout

      | where fanout > 5 -> escalate critical 'discovery sweep'
- question: Is a single source querying sequential destination IP addresses (e.g., last octet incrementing)
    for device identification across more than 5 targets within 60 seconds, indicating an IP sweep even
    when the source is otherwise authorized?
  context: Adversaries frequently enumerate a subnet by walking sequential addresses. Detecting an ordered
    progression of destination IPs from one source for identification functions reveals sweep behavior
    that a simple per-host allowlist check might miss when the source is a compromised but authorized
    manager. Flag the sweep regardless of source authorization and require correlation to an approved
    change ticket; legitimate bulk polling should map to a documented maintenance activity. Because some
    ENIP/PROFINET discovery uses broadcast/multicast, exclude known broadcast/multicast destination groups
    before alerting to suppress false positives. A positive result (sequential targeting plus no change
    ticket) strongly suggests reconnaissance; a negative result suggests scheduled or ticketed activity.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - 'NAI: OT network segments (e.g., Process Control Network VLANs, Safety Instrumented System networks),
    network traffic aggregation points (e.g., span ports on core switches), Industrial Demilitarized Zone
    (IDMZ) gateways, and subnets containing SCADA servers, Engineering Workstations, or Data Historians.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      filter ICS_ID and id.resp_h NOT IN broadcast_multicast_groups

      | by id.orig_h within 60s: sort id.resp_h asc

      | detect sequential_run(last_octet, step=1) and dcount(id.resp_h) > 5

      | enrich change_ticket(id.orig_h)

      | where change_ticket is null -> alert 'sequential IP sweep'
- question: Are OT-adjacent hosts performing host/service/system enumeration over enterprise protocols
    (SMB/DCE-RPC, WinRM, DCOM, ICMP), and is any non-allowlisted host invoking remote-enumeration RPC
    operations against more than 3 unique hosts within 5 minutes?
  context: Beyond native ICS protocols, adversaries enumerate OT-adjacent Windows infrastructure using
    enterprise protocols and remote management RPC. Deploying BZAR Zeek analytics deterministically identifies
    host/service/system enumeration DCE-RPC operations. Alerting when a non-allowlisted host enumerates
    more than 3 unique hosts in 5 minutes captures lateral discovery that precedes movement into the OT
    environment. A positive result indicates enterprise-protocol reconnaissance from an unsanctioned host;
    a negative result means enumeration RPC is limited to authorized management stations.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - 'NAI: OT network segments (e.g., Process Control Network VLANs, Safety Instrumented System networks),
    network traffic aggregation points (e.g., span ports on core switches), Industrial Demilitarized Zone
    (IDMZ) gateways, and subnets containing SCADA servers, Engineering Workstations, or Data Historians.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      load BZAR enumeration signatures (SMB/DCE-RPC, WinRM, DCOM, ICMP host/service/system enum ops)

      filter enum_op == true

      | where id.orig_h NOT IN enterprise_mgmt_allowlist

      | by id.orig_h within 5m: dcount(id.resp_h) as hosts

      | where hosts > 3 -> alert 'enterprise-protocol enumeration'
- question: Does the ratio of failed versus successful connection/identification outcomes per source IP
    across distinct destinations indicate scanning behavior under a Threshold Random Walk sequential hypothesis
    test?
  context: Scanners contact many hosts, a high fraction of which fail. The Threshold Random Walk (Jung
    et al.) accumulates a per-source likelihood ratio over success/failure outcomes across distinct destinations
    and decides 'scanner' when the ratio crosses an upper threshold (default false-positive 0.01, detection
    0.99). Treat Modbus exception responses, ENIP error status, TCP RST, ICMP unreachable, and timeouts
    as failures. This statistical method detects probing even when per-event volume is modest, because
    it is the pattern of failures across many destinations that matters. Surface failed/total counts and
    unique destinations in the alert. A positive decision indicates a probing/scanning source; staying
    below the threshold indicates normal, mostly-successful interactions.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - 'NAI: OT network segments (e.g., Process Control Network VLANs, Safety Instrumented System networks),
    network traffic aggregation points (e.g., span ports on core switches), Industrial Demilitarized Zone
    (IDMZ) gateways, and subnets containing SCADA servers, Engineering Workstations, or Data Historians.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      for each id.orig_h:
        for each distinct id.resp_h outcome (first contact):
          failure := modbus_exception OR enip_error OR tcp_rst OR icmp_unreach OR timeout
          Lambda *= (failure ? P_fail|scan/P_fail|benign : P_succ|scan/P_succ|benign)
          if Lambda >= eta1 -> decide SCANNER (FP=0.01, TP=0.99)
          if Lambda <= eta0 -> decide BENIGN
      emit alert with failed/total, dcount(id.resp_h)
- question: Is any authorized host exceeding both its own 95th-percentile historical baseline for identification
    request rate and for unique-destination fan-out within the same 5-minute window?
  context: A compromised but authorized manager may be abused to perform discovery. Per-entity behavioral
    baselining (Dwyer & Truta) over a 30-day history captures (a) total identification requests/min, (b)
    unique destination IPs in 5-minute windows, and (c) bytes sent, segmented by time-of-day, using mean+k*sigma
    thresholds; rare-function-code probability modeling (Marsden et al.) adds sensitivity to unusual functions.
    Alert at medium severity when a host exceeds both its 95th-percentile request rate and fan-out in
    the same window, and correlate with user logons (Windows Event ID 4624) to attribute the activity.
    Keep the deterministic >5-unique-destinations/60s rule running in parallel. A positive result indicates
    anomalous self-deviation consistent with abuse of a trusted host; a negative result means activity
    is within the host's normal envelope.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - 'NAI: OT network segments (e.g., Process Control Network VLANs, Safety Instrumented System networks),
    network traffic aggregation points (e.g., span ports on core switches), Industrial Demilitarized Zone
    (IDMZ) gateways, and subnets containing SCADA servers, Engineering Workstations, or Data Historians.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline per host (30d, by hour-of-day): rate=req/min, fanout=dcount(resp)/5m, vol=bytes

      thresholds: mu + k*sigma; track p95(rate), p95(fanout)

      current 5m window:
        if rate > p95(rate) AND fanout > p95(fanout) -> alert medium
      enrich logon = Windows EID 4624 (user, src)

      parallel deterministic rule: dcount(resp)/60s > 5 -> alert
- question: Do extra or injected identification messages appear outside the expected periodic machine-to-machine
    polling schedule, or does inter-arrival timing deviate beyond the learned per-PLC band?
  context: 'Legitimate vendor/manager polling of ICS devices is typically periodic and predictable. Modeling
    normal manager-to-device polling as periodic (a per-PLC DFA with phase-shift handling, Kang et al.)
    lets an analyst detect manually injected enumeration: identification messages that occur off-schedule
    or whose inter-arrival timing falls outside the learned per-PLC band. This separates scheduled vendor
    polling from interactive, human-driven reconnaissance. A positive result (off-cycle or irregularly-timed
    identification messages) suggests injected discovery; a negative result means timing matches the established
    automation rhythm.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - 'NAI: OT network segments (e.g., Process Control Network VLANs, Safety Instrumented System networks),
    network traffic aggregation points (e.g., span ports on core switches), Industrial Demilitarized Zone
    (IDMZ) gateways, and subnets containing SCADA servers, Engineering Workstations, or Data Historians.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      learn per (manager, PLC) polling period T and phase from history (DFA + phase shift)

      for each identification message:
        expected := nearest scheduled tick(T, phase)
        if abs(arrival - expected) > band OR message_not_in_schedule:
           alert 'off-schedule/injected enumeration' (manager, PLC, delta)
- question: Do per-source 1-minute flow feature vectors (identification request count, unique destinations,
    unique function codes, bytes sent, failed-response ratio) score as anomalous under an explainable
    unsupervised model for two consecutive minutes?
  context: When attacker tooling is novel, signature and allowlist rules may miss it, so an unsupervised
    anomaly model adds coverage. Aggregating per-source 1-minute flow features and scoring with Isolation
    Forest or an online autoencoder ensemble (KitNET/Kitsune) flags outliers in discovery behavior. Pair
    the model with LIME/feature-attribution to surface the top-3 contributing features (e.g., unique-destination
    fan-out, failed-response ratio, request rate) so alerts are explainable and triage-able. Alert at
    medium severity when the score exceeds threshold for two consecutive minutes to suppress transient
    noise. Because ML detection collapses on unseen attacks (Kus et al.), run this only in parallel with
    the deterministic allowlist/sweep rules and track false-negative rate. A positive result is an explainable
    anomaly cluster; a negative result is behavior consistent with the learned normal manifold.
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Windows Event ID 4624
  - 'NAI: OT network segments (e.g., Process Control Network VLANs, Safety Instrumented System networks),
    network traffic aggregation points (e.g., span ports on core switches), Industrial Demilitarized Zone
    (IDMZ) gateways, and subnets containing SCADA servers, Engineering Workstations, or Data Historians.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      features[src,1m] = {id_req_count, dcount(resp), dcount(func), bytes_sent, failed_ratio}

      score := IsolationForest.decision(features)  # or KitNET autoencoder RMSE

      if score > threshold for 2 consecutive minutes:
         attribution := LIME(features); alert medium with top-3 features
      run in parallel with deterministic allowlist/sweep rules; log FN rate
- question: On critical OT hosts, is a newly created process whose file hash is not on the approved application
    allowlist connecting to more than 3 unique ICS device IPs on common ICS ports (502, 20000, 44818)
    within 30 seconds of launch?
  context: Host-based evidence of discovery often appears as an unsanctioned tool that, immediately after
    launch, fans out to ICS devices. Monitoring Windows Event ID 4688 and checking each new process's
    file hash against a deny-by-default allowlist (NIST SP 800-82 Rev. 3) identifies unapproved binaries.
    Correlating with Zeek conn.log for connections within 30 seconds of process creation to ICS ports
    and identification function codes confirms the process is performing discovery. Raising a high-priority
    alert when an un-allowlisted process contacts more than 3 unique ICS device IPs, enriched with process
    details, user context (Event ID 4624), and targeted devices, gives the analyst an immediate, actionable
    lead. A positive result indicates host-resident discovery tooling; a negative result means new processes
    are approved and not enumerating ICS devices.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interface (HMI) Workstations, SCADA Servers, Data
    Historians, and Jump Servers/Bastion Hosts within the Industrial Demilitarized Zone (IDMZ) or OT network
    segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      src = Windows EID 4688 (NewProcessName, Hashes, ProcessId, host, user)

      if Hashes NOT IN approved_app_allowlist:
         net = Zeek conn.log where orig_h==host AND ts within 30s of process_start
                AND resp_p in (502,20000,44818) AND ICS_ID_func
         if dcount(net.resp_h) > 3:
            alert high enrich(process, user=EID4624, targets=net.resp_h)
- question: Is a discovery-capable process (nmap.exe, python.exe, powershell.exe, plcscan, etc.) on an
    OT host being spawned by an Office or browser parent process and then connecting to ICS ports within
    60 seconds?
  context: Phishing-driven intrusions often spawn tooling from Office or browser processes. Alerting when
    a discovery-capable process is launched by an Office/browser parent on an OT host and initiates connections
    to ICS ports within 60 seconds catches user-executed reconnaissance delivered via document or web
    payloads. For enterprise-protocol enumeration spawned this way, correlate with BZAR Zeek detections
    of SMB/DCE-RPC enumeration from the same host to confirm the activity. A positive result indicates
    likely malicious, user-triggered discovery tooling; a negative result means discovery-capable processes
    are not being spawned by suspicious parents.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interface (HMI) Workstations, SCADA Servers, Data
    Historians, and Jump Servers/Bastion Hosts within the Industrial Demilitarized Zone (IDMZ) or OT network
    segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      child = EID 4688 where NewProcessName in (nmap.exe,python.exe,powershell.exe,plcscan,*)

      parent in (winword.exe,excel.exe,outlook.exe,chrome.exe,msedge.exe,firefox.exe)

      net within 60s: orig_h==host AND resp_p in (502,20000,44818)

      if net exists: alert high

      correlate BZAR SMB/DCE-RPC enum from host -> confirm
- question: For allowlisted processes, does first-60-seconds network behavior exceed the per-process baseline
    of unique ICS destinations, unique function codes, and bytes sent, or does the failed/successful connection
    ratio indicate scanning?
  context: Even approved software can be abused or behave abnormally if hijacked. Baselining each allowlisted
    process's normal first-60-seconds network behavior with per-entity mean+k*sigma (Dwyer & Truta) over
    unique ICS destinations, unique function codes, and bytes sent detects deviations; applying the Jung
    et al. failed/successful connection-ratio test flags processes generating many failed ICS connections
    (RST/ICMP unreachable/Modbus exceptions). Alert at medium severity if an allowlisted process exceeds
    its 99th-percentile fan-out baseline, or if an un-allowlisted process contacts more than 3 unique
    ICS IPs. A positive result indicates a process behaving outside its norm consistent with discovery;
    a negative result means process network behavior matches the learned baseline.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interface (HMI) Workstations, SCADA Servers, Data
    Historians, and Jump Servers/Bastion Hosts within the Industrial Demilitarized Zone (IDMZ) or OT network
    segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline per process (first 60s): mu+k*sigma over dcount(resp), dcount(func), bytes

      for new process instance:
         if allowlisted AND fanout > p99(baseline.fanout): alert medium
         if NOT allowlisted AND dcount(resp ICS) > 3: alert medium
      TRW failure test: failed/success ratio per process -> flag scanner
- question: Does a supervised, explainable classifier (e.g., Random Forest) trained on process-creation
    and network features label a new process as 'malicious-discovery' with high confidence?
  context: A supervised model can distinguish benign vendor discovery from malicious enumeration when
    given labeled examples. Build a dataset from Event ID 4688 (benign-discovery vs malicious-discovery)
    with features for parent process, command-line entropy, and Zeek-derived network metrics (unique destination
    IPs, unique ports/function codes, bytes sent, failed-response ratio) over the first 60 seconds. Train
    a Random Forest, which exposes per-feature importance for explainable alerts (Duque Anton et al.);
    surface the top-3 contributing features in alert text. Classify new processes and raise high-priority
    alerts on confident 'malicious-discovery'. Validate against unseen tools and keep the deterministic
    allowlist rule as the floor (Kus et al.); do not rely on the model alone. A positive result is a confident
    malicious classification with explanation; a negative result is a benign classification, still backstopped
    by deterministic rules.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interface (HMI) Workstations, SCADA Servers, Data
    Historians, and Jump Servers/Bastion Hosts within the Industrial Demilitarized Zone (IDMZ) or OT network
    segments.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      features = {parent_process, cmdline_entropy, dcount(resp), dcount(ports/func), bytes, failed_ratio}

      model = RandomForest.fit(labeled[benign-discovery, malicious-discovery])

      pred, proba := model.predict(features)

      if pred=='malicious-discovery' and proba>=conf:
         alert high with feature_importance top-3
      keep deterministic allowlist rule as floor; validate vs unseen tools
