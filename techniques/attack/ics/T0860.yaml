name: 'T0860: Wireless Compromise'
id: c5778acd-304b-488a-84ee-747ab124d190
description: Investigate whether an adversary has gained communications access to, or unauthorized control
  over, an ICS wireless network as an initial-access vector. Wireless compromise can be performed remotely
  from outside the physical perimeter by abusing rogue or compromised wireless devices, by transmitting
  on the same RF frequency as the legitimate network, or by capturing and replaying wireless control signals
  (as in the Lodz tram case). This playbook guides an analyst across three observation surfaces. First,
  the appearance of previously unobserved MAC addresses on ICS wireless segments that are absent from
  the authorized wireless asset inventory, especially when they target Level 1 (PLCs, RTUs) or Level 2
  (HMIs, control servers) devices. Second, authorized wireless devices that drift outside their established
  communication baseline -- new destinations, unapproved ports/protocols, unexpected ICS function codes
  (e.g., a read-only device suddenly issuing register/coil writes), or abnormal data volumes. Third, RF-layer
  attack indicators such as rogue/evil-twin access points, 802.11 deauthentication/disassociation floods,
  and jamming evidenced by collapsing packet-delivery ratio with anomalous RSSI/noise-floor. For each
  surface the playbook pairs deterministic symbolic-logic allow-list rules (the defensible floor) with
  statistical baselining and machine-learning anomaly/RF-fingerprinting models so detection is granular,
  explainable, and resilient even when ML degrades on unknown attacks.
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Has a previously unobserved MAC address (id.orig_l2_addr or wifi.client_mac) connected on
    an ICS wireless segment when that address is not present in the authorized ICS wireless asset inventory,
    and did it communicate with a Level 1 (PLC/RTU) or Level 2 (HMI/control server) device?
  context: 'Wireless compromise often begins with an unauthorized radio or device joining the ICS WLAN.
    Continuously monitor Zeek conn.log and wifi.log on segments identified by SSID/BSSID or subnet and
    treat the asset-inventory / SSID-BSSID allow-list as the deterministic floor per the wireless monitoring
    guidance in [Establishing Wireless Robust Security Networks: A Guide to IEEE 802.11i (NIST SP 800-97)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-97.pdf)
    and OT asset-inventory allow-listing in [Guide to Operational Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    Generate a high-severity alert for any connection whose source or destination MAC is not on the allow-list,
    escalating when it targets Level 1/2 control assets. The alert must name the offending MAC, the AP/BSSID,
    the SSID, and the targeted device so responders can locate the rogue radio. A positive hit is a candidate
    initial-access foothold; a negative result confirms only enrolled, expected devices are present on
    the wireless control network.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek wifi.log
  - ICS Wireless Asset Inventory
  - 'NAI: Wireless Access Points (WAPs) within the Process Control Network (PCN) and Manufacturing Zone,
    network taps or SPAN ports on wireless network infrastructure connecting to Level 1/2 devices, dedicated
    wireless sensor network gateways.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: conn.log OR wifi.log where (segment IN ics_wireless_segments BY ssid/bssid/subnet) AND (id.orig_l2_addr
      NOT IN authorized_wireless_inventory OR wifi.client_mac NOT IN authorized_wireless_inventory) =>
      raise HIGH alert; escalate if id.resp_h IN level1_level2_assets; include mac, bssid, ssid, target_device
  - technology: Zeek/pseudocode
    query: 'for rec in conn.log: if rec.id.orig_l2_addr not in allowlist and rec.id.resp_h in ics_assets:
      emit alert(mac=rec.id.orig_l2_addr, ap=rec.bssid, ssid=rec.ssid, target=rec.id.resp_h)'
- question: For connections involving an unknown MAC, is the (proto, id.resp_p) pair statistically rare
    versus the per-segment 30-day baseline, is destination-port Shannon entropy abnormally high (service
    discovery/scanning), or are failed/aborted connection states (S0, REJ, RSTO) spiking per source MAC?
  context: Once an unknown radio appears, statistical rarity and failure-mode signals reveal reconnaissance
    and brute-force behavior characteristic of initial access. Compute the rarity of each (proto, id.resp_p)
    pair against a 30-day per-segment baseline and alert below the 5th percentile. Monitor destination-port
    (id.resp_p) Shannon entropy over 10-minute windows and alert above the 99th percentile of historical
    entropy, which indicates port sweeping/service discovery. As a distinct failure-mode signal, count
    failed/aborted connections (conn_state S0, REJ, RSTO) per source MAC per minute and alert when the
    failure ratio exceeds 3 standard deviations above its baseline (flow and time-series discord methods
    validated for industrial traffic in [Anomaly-based Intrusion Detection in Industrial Data with SVM
    and Random Forests, Duque Anton et al.](https://arxiv.org/abs/1907.10374)). Derive every percentile/sigma
    threshold from each segment's own baseline. Positive results indicate an adversary probing the wireless
    control network rather than a benign enrolled device.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline_30d per segment of (proto,id.resp_p) freq; for unknown_mac flows: if pct_rank(proto,resp_p)
      < 5 => alert; window=10m entropy(id.resp_p); if entropy > p99_hist => alert(scan)'
  - technology: Zeek/pseudocode
    query: 'per source_mac per minute: fails = count(conn_state in [S0,REJ,RSTO]); if fails > mean+3*std(baseline)
      => alert(failure_spike, mac)'
- question: Do unsupervised flow-anomaly models (Isolation Forest / KitNET autoencoder) on ICS wireless
    conn.log flag outlier flows -- particularly from unknown MACs with short-duration/non-zero-byte profiles
    -- or does radiometric RF fingerprinting show a 'known' MAC whose physical signature does not match
    its enrolled fingerprint (MAC spoofing)?
  context: Sophisticated wireless intrusions can evade allow-lists by spoofing authorized MACs or by blending
    into normal traffic. Train an unsupervised model (Isolation Forest, or an online autoencoder ensemble
    such as KitNET from [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089), code [Kitsune-py](https://github.com/ymirsky/Kitsune-py))
    on >=90 days of normal Zeek conn.log from ICS wireless segments using features orig_bytes, resp_bytes,
    duration, orig_pkts, proto, service, and conn_state; alert on high reconstruction-error/outlier flows,
    emphasizing unknown MACs and short-duration non-zero-byte profiles. In parallel, where PHY-layer capture
    exists, apply radiometric RF fingerprinting (SVM/k-NN over carrier-frequency offset, I/Q imbalance,
    phase/magnitude error per [Wireless Device Identification with Radiometric Signatures, Brik et al.](https://pages.cs.wisc.edu/~suman/pubs/paradis.pdf);
    deep-learning I/Q variants per [A Comprehensive Survey on RF Fingerprinting, Jagannath et al.](https://arxiv.org/abs/2201.00680))
    to flag any 'known' MAC whose physical signature deviates from its enrolled fingerprint, exposing
    MAC spoofing that defeats address checks. Every alert must list the top-3 contributing features for
    analyst triage; validate against unknown-attack degradation ([A False Sense of Security?, Kus et al.](https://arxiv.org/abs/2205.09199))
    and keep deterministic allow-list rules running in parallel.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: model = IsolationForest|KitNET.train(conn.log[wireless], features=[orig_bytes,resp_bytes,duration,orig_pkts,proto,service,conn_state],
      window>=90d); score flows; if score>thr => alert(top3_features); prioritize unknown_mac & short_dur_nonzero_byte
  - technology: RF-fingerprint/pseudocode
    query: 'for frame in phy_capture: sig=radiometric(cfo,iq_imbalance,phase_err,mag_err); if claimed_mac
      in enrolled and dist(sig, enrolled[claimed_mac]) > thr => alert(mac_spoof, top3_features)'
- question: Has an authorized ICS wireless device violated its strict per-device communication specification
    -- contacting a non-whitelisted peer IP, using an unapproved port/protocol, or issuing unexpected
    ICS function codes (e.g., a read-only device suddenly issuing coil/register writes) in conn.log, modbus.log,
    or dnp3.log?
  context: After compromising a wireless link, an adversary may pivot through a legitimate device, so
    deviations from each device's known-good behavior are key. Enforce a strict per-device communication
    specification (allowed peer IPs, ports, protocols, and ICS function codes) and alert on any deviation
    in Zeek conn.log and ICS protocol logs (modbus.log, dnp3.log). The highest-fidelity case is a function-code
    change of intent -- a device that should only issue read function codes suddenly issuing writes --
    which directly threatens process integrity. Build whitelists from graph-based specifications ([On
    Specification-based Cyber-Attack Detection in Smart Grids, Sen et al.](https://arxiv.org/abs/2209.04354))
    and auto-generated DNP3/Modbus/IEC 61850 semantic payload/flow/time rules ([Distributed Intrusion
    Detection System using Semantic-based Rules for SCADA, Mohan et al.](https://arxiv.org/abs/2412.07917)),
    consistent with the allow-listing baseline in [Guide to Operational Technology (OT) Security (NIST
    SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf). A positive
    result is a strong indicator that an authorized device is being driven by an unauthorized actor; a
    negative result confirms the device stayed within specification.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Communication Baseline Policy
  - 'NAI: Process Control Network (PCN) segments where HMIs, EWS, Historian Servers, and other wireless-connected
    ICS field devices reside; network taps on switch uplinks for these segments; ICS protocol deep packet
    inspection (DPI) sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for flow in conn.log+modbus.log+dnp3.log where src in authorized_wireless_devices: if (peer_ip
      NOT IN spec[src].peers OR resp_p NOT IN spec[src].ports OR proto NOT IN spec[src].protos OR func_code
      NOT IN spec[src].func_codes) => raise alert(device=src, violation)'
  - technology: Zeek/pseudocode
    query: if src.role == read_only and modbus.func in [WriteSingleCoil,WriteMultipleRegisters,...] =>
      alert(unexpected_write, src)
- question: For each authorized wireless device, does total bytes (orig_bytes + resp_bytes) or connection
    count exceed 3 standard deviations from its 30-day moving average, is destination-port entropy abnormally
    high, or are failed connection states (S0/REJ/RSTO) and failed logons (Windows Event ID 4625) surging?
  context: Volumetric and failure-rate shifts on an authorized wireless device can reveal C2, exfiltration,
    or credential abuse following wireless compromise. For each device compute the daily mean and standard
    deviation of total bytes (orig_bytes + resp_bytes) and connection count, and alert when either exceeds
    3 standard deviations from its 30-day moving average. Compute destination-port (id.resp_p) Shannon
    entropy over 15-minute windows and alert above the 99th percentile to catch scanning. As an explicit
    failure-mode signal, profile per-device failed-connection states (S0/REJ/RSTO) and failed logon counts
    (Windows Event ID 4625) and alert on surges that suggest brute-force or misdirected sessions. Flow/time-series
    feature selection follows [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random
    Forests, Duque Anton et al.](https://arxiv.org/abs/1907.10374); derive thresholds per device from
    its own history so quiet field devices and chatty servers are judged independently.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per device daily: bytes=sum(orig_bytes+resp_bytes); conns=count(); if bytes>ma30+3*std or
      conns>ma30+3*std => alert; window=15m entropy(id.resp_p); if entropy>p99 => alert(scan)'
  - technology: SIEM/Rule pseudocode
    query: 'per device: fails=count(conn_state in [S0,REJ,RSTO]) + count(EventID=4625); if fails > baseline_surge
      => alert(failure_surge, device)'
- question: Does a supervised Random Forest on per-device wireless flow features classify traffic as anomalous,
    or does an unsupervised time-series detector (Matrix Profile discords / forecasting) on a critical
    device's daily byte volume flag spikes (C2/exfil) or drops (RF jamming/DoS) outside the 99% interval?
  context: Machine learning catches subtle multi-feature deviations that single-metric rules miss. Train
    a supervised Random Forest on per-device flow features (bytes, packets, duration, port, function code,
    inter-arrival timing) labeled benign vs. anomalous and surface the top-3 feature-importance contributors
    in each alert ([Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests,
    Duque Anton et al.](https://arxiv.org/abs/1907.10374)). In parallel, run an unsupervised time-series
    detector (Matrix Profile discords or a forecasting model) on each critical device's daily byte volume
    trained on >=90 days of data, alerting outside the 99% interval to catch both spikes (C2/exfiltration)
    and drops (RF jamming/DoS). Where labeling is scarce, use human-in-the-loop active learning to prioritize
    uncertain flows for analyst labeling ([Active Learning for Wireless IoT Intrusion Detection, Yang
    et al.](https://arxiv.org/abs/1808.01412)). Keep deterministic specification and statistical rules
    running in parallel because ML degrades on unknown attacks ([A False Sense of Security?, Kus et al.](https://arxiv.org/abs/2205.09199)).
    Positive results warrant correlation with the specification and volumetric findings above.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: rf = RandomForest.train(per_device_flows, features=[bytes,pkts,duration,port,func_code,iat],
      labels=[benign,anomalous]); predict; if pred==anomalous => alert(top3_importance)
  - technology: ML/pseudocode
    query: 'for crit_device: ts=daily_bytes(>=90d); MatrixProfile|forecast; if value outside 99%_interval
      => alert(spike|drop); active_learning(uncertain_flows -> analyst)'
- question: Is a beaconing access point advertising a BSSID/SSID/channel outside the authorized allow-list
    (rogue or evil-twin AP), or are 802.11 deauthentication/disassociation frames exceeding a hard threshold
    (>5 frames per client per 10s), failing to match an active association, or carrying anomalous reason
    codes?
  context: 'RF-layer attacks are a primary wireless initial-access and disruption vector. Maintain an
    allow-list of authorized BSSIDs, SSIDs, channels, and AP MACs and alert on any beaconing AP outside
    it, and on any BSSID advertising an authorized SSID from an unauthorized MAC/channel (rogue/evil-twin),
    per the rogue-AP and continuous RF-monitoring guidance in [Establishing Wireless Robust Security Networks:
    A Guide to IEEE 802.11i (NIST SP 800-97)](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-97.pdf).
    Separately, alert when 802.11 deauthentication/disassociation frames exceed a hard threshold (e.g.,
    >5 frames per client per 10 seconds), do not match an active association session, or carry an anomalous
    reason code -- the classic precursor to forcing clients onto an evil-twin AP ([Preventing Wireless
    Deauthentication Attacks over 802.11 Networks, Arora](https://arxiv.org/abs/1901.07301)). Include
    BSSID, SSID, client MAC, channel, and frame counts in the alert. A positive result indicates an active
    RF attack against the ICS WLAN; a clean result confirms only authorized APs and normal session management.'
  answer_sources: &id003
  - Zeek wifi.log
  - Wireless IDS/RF Sensor (802.11 management frames)
  - Wireless LAN Controller Logs
  - RF Spectrum/RSSI Telemetry
  - ICS Wireless Asset Inventory
  - 'NAI: RF coverage area of WAPs serving the Process Control Network and Manufacturing Zone; dedicated
    802.11 monitor-mode WIDS sensors; wireless LAN controllers; spectrum analyzers at field/sensor-network
    gateways.'
  range: Last 90 days
  queries:
  - technology: WIDS/Rule pseudocode
    query: 'for beacon in wifi.log/wids: if (bssid NOT IN allowlist) OR (ssid IN authorized_ssids AND
      (ap_mac NOT IN allowlist OR channel NOT IN allowlist[ssid])) => alert(rogue_evil_twin, bssid, ssid,
      channel)'
  - technology: WIDS/Rule pseudocode
    query: 'per client per 10s: deauth=count(deauth/disassoc frames); if deauth>5 OR frame_not_in_active_session
      OR anomalous_reason_code => alert(deauth_flood, client_mac, bssid, count)'
- question: Has the per-link packet-delivery ratio (PDR) collapsed below a site-derived floor (e.g., <70%
    of baseline) while RSSI/noise-floor is anomalously high, and are CRC/bad-packet ratio or retransmission
    rate exceeding 3 standard deviations from per-AP baseline (jamming)?
  context: Jamming is a remote wireless attack that can deny ICS control communications. Compute per-link
    packet-delivery ratio (PDR) and packet-send ratio over rolling 10-second windows and alert when PDR
    collapses below a site-derived floor (e.g., <70% of baseline) while received signal strength (RSS/RSSI)
    or noise-floor is anomalously high -- the joint low-PDR/high-RSS condition reliably distinguishes
    jamming from benign link degradation ([Jamming Attacks and Anti-Jamming Strategies in Wireless Networks,
    Pirayesh and Zeng](https://arxiv.org/abs/2101.00292)). Also track CRC/bad-packet ratio and retransmission
    rate per AP as volume/state metrics and alert above 3 standard deviations from baseline. Derive PDR/RSS/noise
    thresholds per AP from its own RF history because coverage varies. A positive result suggests active
    RF denial-of-service against the wireless control segment, which can mask or accompany a wireless
    compromise.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per link window=10s: pdr=delivered/sent; if pdr < 0.7*baseline AND (rssi > p99 OR noise_floor
      > p99) => alert(jamming, link)'
  - technology: SIEM/Stats pseudocode
    query: 'per AP: crc_ratio, retransmit_rate; if value > mean+3*std(baseline) => alert(rf_degradation,
      ap)'
- question: When a frame claims an authorized BSSID/MAC, does its radiometric fingerprint (carrier-frequency
    offset, I/Q origin offset, magnitude/phase error, SYNC correlation) fail to match the enrolled signature
    for that device -- indicating an evil-twin/impersonation that defeats MAC and credential checks?
  context: Evil-twin and impersonation attacks spoof legitimate identifiers, so address and credential
    checks alone are insufficient. Enroll radiometric fingerprints (carrier-frequency offset, I/Q origin
    offset, magnitude/phase error, SYNC correlation) for each authorized AP and wireless field device
    using SVM/k-NN classifiers ([Wireless Device Identification with Radiometric Signatures, Brik et al.](https://pages.cs.wisc.edu/~suman/pubs/paradis.pdf)),
    with deep-learning I/Q approaches surveyed in [A Comprehensive Survey on RF Fingerprinting, Jagannath
    et al.](https://arxiv.org/abs/2201.00680). Alert when a frame claiming an authorized BSSID/MAC presents
    a fingerprint that does not match the enrolled signature -- exposing evil-twin/impersonation that
    defeats MAC and credential checks. Surface the top-3 deviating radiometric features in the alert for
    analyst explainability, keep the BSSID allow-list rule running in parallel as the deterministic floor,
    and re-enroll fingerprints periodically to handle channel/temperature drift. A positive result is
    high-confidence evidence of a hardware impostor on the ICS WLAN.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: RF-fingerprint/pseudocode
    query: 'enroll[ap/device] = radiometric(cfo,iq_origin_offset,mag_err,phase_err,sync_corr) via SVM|kNN;
      for frame: if dist(fingerprint(frame), enroll[frame.claimed_mac]) > thr => alert(evil_twin_impersonation,
      top3_features)'
  - technology: ML/pseudocode
    query: periodically re_enroll(fingerprints) for drift; keep bssid_allowlist_rule running in parallel
      as deterministic floor
