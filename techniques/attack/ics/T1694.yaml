name: 'T1694: Insecure Credentials'
id: ca468878-80a2-42e7-9df3-e70900920aba
description: Investigate the use of insecure credentials (default, factory-set, shared, or hard-coded
  accounts) to access, persist on, or move laterally between ICS/OT assets such as PLCs, RTUs, HMIs, engineering
  workstations, SCADA servers, jump servers, and remote-access gateways. This playbook helps an analyst
  find successful authentication or management-protocol sessions that use known-default usernames, privileged
  protocol writes from sources outside the approved maintenance path, and Windows interactive/remote logons
  by default accounts that are followed by remote-administration tooling and onward lateral access to
  other control assets. It combines deterministic correlation rules across Zeek protocol logs and Windows/Sysmon
  events, statistical baselining and change-point detection of rare credential use and failed-logon bursts,
  and machine-learning anomaly and authentication-graph analysis to surface out-of-spec credentialed activity
  in the OT environment.
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any successful authentication or management-protocol session to a critical ICS asset (PLC,
    RTU, HMI, engineering workstation, or remote-access gateway) use a username from the curated default/factory-credential
    watchlist, or produce an authenticated write/control/config action from a source segment that is not
    on the approved-maintenance allowlist for that asset?
  context: Default and factory-set credentials on OT devices are well documented per device family and
    are frequently forgotten by asset owners, making them a low-effort path for an adversary to gain a
    foothold and pivot through the ICS environment (Lateral Movement). Correlate Zeek conn.log with the
    protocol-specific logs (ssh, telnet, rdp, modbus, dnp3, enip, s7comm) on timestamp, source IP, destination
    IP, and UID. Fire deterministically when a successful session to a critical asset uses a watchlisted
    default username (maintained per NIST SP 800-82r3 and known hard-coded-secret lists), or when a protocol
    log shows a credentialed write/control/config action from a source not on the approved-maintenance
    allowlist. Encode valid function-code, command/response, and source-role semantics so an out-of-spec
    credentialed write fires deterministically, and treat any unauthorized IT->OT path as an incident.
    Keep clear-text protocols (Telnet, unencrypted Modbus/DNP3/S7) and Sigma-style default/explicit-credential
    logon rules as hard rules. A positive result indicates weak credential hygiene and likely adversary
    reuse of insecure credentials; a negative result still warrants confirming the allowlist and watchlist
    are current.
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - 'NAI: OT management VLANs, SCADA supervisory segments, engineering workstation subnets, and remote
    access paths between the IT/OT DMZ and Level 2/1 assets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join Zeek conn.log with [ssh.log, telnet.log, rdp.log, modbus.log, dnp3.log, enip.log, s7comm.log]\n\
      \  on (timestamp_window=5m, src_ip, dst_ip, uid)\nwhere session.success == true AND dst_ip in CRITICAL_ICS_ASSETS\n\
      alert if username in DEFAULT_CREDENTIAL_WATCHLIST[device_family]\n   OR (protocol.action in {write,\
      \ control, config}\n       AND src_segment NOT in APPROVED_MAINTENANCE_ALLOWLIST[dst_ip])\n   OR\
      \ (protocol in {telnet, unenc_modbus, unenc_dnp3, unenc_s7} AND auth_present)\nraise INCIDENT if\
      \ src is IT_segment AND dst is OT_segment  // unauthorized IT->OT path"
  - technology: Zeek/pseudocode
    query: "for s in (ssh.log, telnet.log, rdp.log): if s.auth_success and s.user in DEFAULT_LIST: emit\
      \ alert\nfor w in (modbus.log, dnp3.log, enip.log, s7comm.log):\n  if w.func_code in WRITE_CODES\
      \ and w.src not in APPROVED_MAINTENANCE[w.dst]: emit alert"
- question: Within each ICS asset's authentication history, did a default account appear with a rarity
    score above the 99th percentile, or did a burst of failed authentication attempts (password spraying)
    precede a successful logon, or did login frequency / byte volume abruptly shift in a way that marks
    the onset of credential reuse?
  context: Insecure-credential abuse for Lateral Movement often shows up as statistically rare account/source
    combinations and as failure-then-success patterns. Build a 30-day per-asset baseline of successful
    usernames, source IPs, protocol families, session counts, and byte volume (Volume/Frequency). For
    each authentication event compute a rarity score from username frequency and source-to-asset frequency;
    alert when a default account appears and exceeds the 99th percentile for that asset or device family.
    Add a State layer that counts failed-auth attempts and distinct targeted accounts per source over
    a sliding window and raises severity when a failure burst precedes a success on the same asset. Apply
    change-point detection (CUSUM/PELT) to login-frequency and byte-volume series to flag the abrupt shift
    that marks credential-reuse onset. Derive all thresholds from your own logs. A positive result suggests
    an account being used in an anomalous, likely unauthorized manner.
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - 'NAI: OT management VLANs, SCADA supervisory segments, engineering workstation subnets, and remote
    access paths between the IT/OT DMZ and Level 2/1 assets.'
  range: Last 90 days (30-day baseline per asset; sliding-window failure bursts)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_asset_30d(success_user_freq, src_to_asset_freq, session_count, byte_volume)\n\
      for evt in auth_events:\n  rarity = combine(1/user_freq[evt.user], 1/src_asset_freq[evt.src,evt.dst])\n\
      \  if evt.user in DEFAULT_LIST and rarity > p99[evt.dst|device_family]: alert\n# failed-logon burst\
      \ -> success (State)\nwindow = sliding(15m)\nif count(fail by src) > T and distinct(targeted_accounts\
      \ by src) > A and followed_by(success same asset):\n  raise_severity()"
  - technology: SIEM/Stats pseudocode
    query: 'series = login_freq_and_byte_volume(asset)

      cp = change_point_detect(series, method=CUSUM|PELT)

      if cp.detected and cp.shift_up: alert(''credential reuse onset'', asset, cp.time)'
- question: Do any network-authentication sessions to OT assets deviate sharply from the learned normal
    pattern for that device family — for example an anomalous combination of username, source segment,
    protocol/port, duration, and byte counts — especially when the session also performs a privileged
    protocol write?
  context: 'Unsupervised and supervised ML can surface insecure-credential abuse that rule lists miss.
    Train an anomaly detector (Isolation Forest / One-Class SVM with LIME attribution) on historical network-auth
    features from Zeek conn.log and the protocol-specific logs: username, source IP, destination asset
    type, protocol, port, duration, byte counts, and success/fail state. Flag sessions whose reconstruction
    error deviates sharply from the normal pattern for the device family, especially when the session
    includes a privileged write. For supervised classification of authorized vs. default-credentialed
    sessions, use SVM/Random-Forest on flow features with feature-importance explanations. Alert text
    must surface the top-3 contributing features (e.g., default username, unapproved source segment, rare
    protocol/port). In the Lateral Movement context, a high-scoring session is a candidate for an adversary
    leveraging weak credentials to reach or control a control asset.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek telnet.log
  - Zeek rdp.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek s7comm.log
  - Windows Event ID 4624
  - 'NAI: OT management VLANs, SCADA supervisory segments, engineering workstation subnets, and remote
    access paths between the IT/OT DMZ and Level 2/1 assets.'
  range: Last 90 days (train on longer historical window where available)
  queries:
  - technology: ML/pseudocode
    query: "features = [username, src_ip, dst_asset_type, protocol, port, duration, orig_bytes, resp_bytes,\
      \ state]\nmodel = IsolationForest().fit(normal_sessions[device_family])  # or OCSVM\nscore = model.anomaly_score(session)\n\
      if score > threshold[device_family]:\n  att_top3 = LIME_explain(model, session)\n  severity = HIGH\
      \ if session.has_privileged_write else MED\n  alert(session, top_features=att_top3)"
  - technology: ML/pseudocode
    query: 'clf = RandomForest/SVM.fit(labeled_flows[authorized vs default_credentialed])

      pred = clf.predict(flow); if pred == default_credentialed: alert(flow, importances=clf.feature_importance(flow))'
- question: On a Windows-based OT asset, did a default/shared/factory account perform an interactive (Type
    2) or remote (Type 10) logon that was followed within minutes by remote-administration tooling or
    a remote shell and then an onward connection to another ICS host — indicating the credential was used
    to move laterally rather than only to access the first system?
  context: This is the core Lateral Movement signature for insecure credentials on Windows OT assets.
    Trigger on Event ID 4624 Logon Type 2 or 10 when the account matches a default/shared/factory watchlist
    and the host is an OT administrative asset (engineering workstation, jump server, remote-access host,
    SCADA server, Windows HMI). Correlate by Logon ID within five minutes to Event ID 4688 or 4104 indicating
    remote-access tooling or a remote shell, then confirm with Zeek conn.log/ssh.log/rdp.log showing a
    subsequent connection to another ICS asset. Layer BZAR Zeek analytics for credentialed lateral movement
    over SMB/DCE-RPC (remote service/scheduled-task creation, admin-share copy, WMI/registry, remote exec)
    and Sigma default/explicit-credential and off-hours logon rules. Enforce remote-access source-IP allowlisting
    and alert on any logon from outside the approved maintenance path. A positive chain is a strong indicator
    of active adversary lateral movement using a weak credential.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - 'NAI: Engineering Workstations, jump servers, remote-access hosts, SCADA servers, and Windows-based
    HMIs in the IT/OT DMZ and Process Control Network.'
  range: Last 90 days (5-minute Logon ID correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EID4624 where LogonType in {2,10} AND AccountName in DEFAULT_SHARED_WATCHLIST AND host in\
      \ OT_ADMIN_ASSETS\n  -> correlate by LogonID within 5m to:\n     EID4688 (proc in REMOTE_ACCESS_TOOLING)\
      \ OR EID4104 (remote shell / suspicious scriptblock)\n  -> confirm Zeek conn.log/ssh.log/rdp.log:\
      \ subsequent connection host -> OTHER_ICS_ASSET\nalert as LATERAL_MOVEMENT\nalso alert if logon\
      \ src_ip NOT in REMOTE_ACCESS_ALLOWLIST (approved maintenance path)"
  - technology: Zeek/pseudocode (BZAR)
    query: 'apply BZAR: detect SMB/DCE-RPC remote_service_create, scheduled_task, admin_share_copy, WMI,
      remote_exec from host that just had default-account logon -> emit lateral_movement alert'
- question: For each administrative OT host/account, did a default or shared account session show abnormal
    destination-host fan-out, rare post-logon processes, or an elevated failed-vs-successful logon ratio
    that exceeds the established baseline?
  context: Lateral movement with insecure credentials produces measurable statistical anomalies. Establish
    a 30-day baseline per administrative host/account capturing process rarity, destination-host diversity,
    lateral-connection counts per session (Volume/Frequency), and the failed-vs-successful logon ratio
    (State). Compute a session risk score from the negative log-probability of each post-logon process
    and destination, and alert when a default/shared account session exceeds the 98th percentile for that
    host or user. Add failed-logon burst counting per source to catch password spraying, and apply change-point
    detection to the per-account destination-fan-out series to catch the step increase that marks lateral
    spread. Derive thresholds from your own host/account history. A positive result indicates a default
    account behaving like a pivot point rather than a routine local logon.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - 'NAI: Engineering Workstations, jump servers, remote-access hosts, SCADA servers, and Windows-based
    HMIs in the IT/OT DMZ and Process Control Network.'
  range: Last 90 days (30-day baseline per host/account)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = per_host_account_30d(process_rarity, dest_host_diversity, lateral_conn_count, fail_success_ratio)\n\
      for sess in default_or_shared_sessions:\n  risk = sum(-log P(proc)) + sum(-log P(dest)) for post-logon\
      \ procs/dests\n  if risk > p98[host|user]: alert(sess, risk)\nif fail_burst(src) and ratio_fail_success\
      \ > baseline: raise_severity()"
  - technology: SIEM/Stats pseudocode
    query: 'fanout_series = dest_host_count_per_session(account)

      cp = change_point_detect(fanout_series)

      if cp.shift_up: alert(''lateral spread step increase'', account, cp.time)'
- question: Do authentication and process-event sequences reveal a causal login path that crosses a credential-switch
    boundary to a previously-unvisited ICS host, a rare/new authentication edge between OT hosts, or a
    logon-to-logoff event chain (logon, process creation, PowerShell, network connection) with high reconstruction
    error that starts with a default account and ends in a connection to a separate ICS host?
  context: Graph- and sequence-based ML can reconstruct lateral movement that single-event rules miss.
    Infer login paths (Hopper-style) and score causal paths that cross a credential-switch boundary to
    a previously-unvisited ICS host. Complement with authentication-graph link prediction (Euler) and
    unsupervised graph anomaly scoring (CyberGraph) to flag rare/new auth edges between OT hosts, and
    whole-system provenance modeling (KAIROS) to link a default logon to follow-on remote-admin and lateral
    connections and reconstruct an explainable attack-summary subgraph. Train an LSTM autoencoder on normal
    logon-to-logoff event chains (logon, process creation, PowerShell, network connection) and flag sessions
    with high reconstruction error, especially those starting with a default account and ending in a connection
    to a separate ICS host. Alert text must surface the top-3 contributing features (account, anomalous
    edge/path, rare process/destination). A positive result provides an explainable lateral-movement narrative
    for triage.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek rdp.log
  - 'NAI: Engineering Workstations, jump servers, remote-access hosts, SCADA servers, and Windows-based
    HMIs in the IT/OT DMZ and Process Control Network.'
  range: Last 90 days (graph/sequence models trained on longer history)
  queries:
  - technology: ML/pseudocode (graph)
    query: "auth_graph = build_graph(nodes=hosts/accounts, edges=auth_events)\npaths = hopper_infer_login_paths(auth_graph)\n\
      for p in paths:\n  if p.crosses_credential_switch and p.dest in NEW_ICS_HOSTS(account): alert(p)\n\
      edge_scores = euler_link_predict(auth_graph) + cybergraph_anomaly(auth_graph)\nalert rare/new edges\
      \ between OT hosts\nkairos_provenance.link(default_logon -> remote_admin -> lateral_conn); emit\
      \ attack_summary_subgraph"
  - technology: ML/pseudocode (sequence)
    query: "chain = [logon, proc_create, powershell, net_conn]  # per session\nae = LSTM_autoencoder.fit(normal_chains)\n\
      err = ae.reconstruction_error(chain)\nif err > threshold and chain.start_account in DEFAULT_LIST\
      \ and chain.end_dst in OTHER_ICS_ASSETS:\n  alert(chain, top3=explain(ae, chain))"
