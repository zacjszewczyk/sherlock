name: 'T0819: Exploit Public-Facing Application'
id: 6eaee36a-892b-45e4-9c3c-be3ca0bc31e9
description: 'Investigate potential exploitation of public-facing ICS applications (e.g., Historians,
  Web HMIs, Remote Access Gateways, OPC UA/SCADA servers, ICS API Gateways) exposed in the Purdue Level
  3.5 DMZ for initial access into the OT environment. This playbook helps an analyst hunt for: anomalous
  inbound network traffic and exploit signatures against ICS application ports and protocols (HTTP, Modbus,
  DNP3, OPC UA); brute-force and TI-flagged source activity; unauthorized child processes spawned by ICS
  application processes (interactive shells, transfer utilities, recon tools); web-shell or tool-implant
  file creation correlated with external HTTP POSTs; and unauthorized DMZ-to-OT egress that may indicate
  a pivot toward PLCs, RTUs, and Engineering Workstations. It combines deterministic (symbolic-logic)
  signatures and ICS function-code whitelisting, statistical baselining, and explainable machine-learning
  detection to confirm exploitation and reconstruct the exploit-to-foothold chain.'
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there exploit signatures, ICS function-code violations, or inbound-to-outbound callback
    correlations against a public-facing ICS application in the DMZ?
  context: Initial Access via exploiting a public-facing application often begins with a recognizable
    exploit payload (SQLi, XSS, RCE, path traversal) or an out-of-cycle ICS command. Run WAF anomaly-scoring
    signatures from the OWASP ModSecurity Core Rule Set and Sigma web-attack rules against http.log, and
    whitelist legitimate ICS function codes and message cycles per HMI-PLC channel using a deterministic-finite-automaton
    (DFA) approach so that unknown or diagnostic codes (Modbus FC 43, DNP3 COLD_RESTART, out-of-cycle
    commands) are flagged. Confirm successful exploitation by correlating an inbound exploit payload with
    a resulting outbound LDAP/RMI/DNS callback from the same server within 60 seconds (as in Log4Shell
    detection), and correlate >5 failed logins in 60 seconds followed by a success from the same source
    (Windows 4625 -> 4624). A positive result on the inbound->outbound callback correlation is high-confidence
    evidence of exploitation; a signature hit alone may be reconnaissance or a failed attempt.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek notice.log
  - Zeek weird.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Network DMZ segment (Purdue Level 3.5) hosting public-facing ICS applications (e.g., Historians,
    Web HMIs, Remote Access Gateways, OPC UA Servers, SCADA Servers, ICS API Gateways)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source=http.log\n  | apply OWASP_CRS, Sigma_web_attack rules (sqli|xss|rce|traversal)\n\
      \  | where crs_anomaly_score >= threshold\n  | join (source=(modbus.log OR dnp3.log) where function_code\
      \ NOT IN channel_whitelist[src,dst]\n          OR function_code IN {Modbus:43, DNP3:COLD_RESTART})\n\
      \  | output alert"
  - technology: Zeek/pseudocode
    query: "  inbound = conn where service in (http,modbus,dnp3,opcua) AND payload matches exploit_sig\n\
      \  outbound = conn where orig=server AND service in (ldap,rmi,dns) within 60s of inbound\n  emit\
      \ alert if inbound JOIN outbound on server"
  - technology: SIEM/Rule pseudocode
    query: "  source=(EventID=4625) by src_ip bucket 60s\n  | where failed_count > 5\n  | join EventID=4624\
      \ same src_ip within next 60s\n  | enrich src_ip with threat_intel; alert if hit OR brute_then_success"
- question: Do inbound connection counts, byte volume, request structure, payload byte-frequency, or failure-mode
    ratios against ICS applications deviate statistically from established baselines?
  context: Exploitation campaigns and scanning produce statistical anomalies even when no single signature
    fires. Baseline inbound connection counts and byte volume per source and alert on >3 standard deviations
    above the 30-day moving average within a 15-minute window. Profile request parameters (length, character
    distribution via Chi-squared, structure, token set) with a multi-model detector, and model payload
    byte-frequency per port/length with Mahalanobis distance (PAYL). Flag high URI entropy and low-variance
    inter-arrival scanning. Explicitly baseline failure-mode ratios (HTTP 404 rate, auth-failure rate,
    blocked-connection rate) and alert when they exceed the 99th percentile. A spike in failure ratios
    or byte-frequency divergence pointed at an ICS port suggests targeted probing or exploitation attempts
    against the DMZ.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek notice.log
  - Zeek weird.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Network DMZ segment (Purdue Level 3.5) hosting public-facing ICS applications (e.g., Historians,
    Web HMIs, Remote Access Gateways, OPC UA Servers, SCADA Servers, ICS API Gateways)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  source=conn.log dst_port in (80,443,502,20000,4840)\n  | bin 15m by src_ip\n  | stats count,\
      \ sum(bytes) as vol\n  | compare to 30d_moving_avg, std\n  | where count > avg+3*std OR vol > avg+3*std\
      \ -> alert"
  - technology: SIEM/Stats pseudocode
    query: "  source=http.log\n  | compute uri_len, char_chi2, token_set, uri_entropy\n  | model payload\
      \ byte_freq via Mahalanobis(port,len)\n  | where chi2_pval < .001 OR mahalanobis > thr OR uri_entropy\
      \ > p99 -> alert"
  - technology: SIEM/Stats pseudocode
    query: "  source=(http.log,conn.log)\n  | stats rate(status=404) as err404, rate(auth_fail) as af,\
      \ rate(blocked) as bk by 15m\n  | where err404 > p99 OR af > p99 OR bk > p99 -> alert"
- question: Does an explainable ML model flag anomalous inbound traffic to a public-facing ICS application,
    with the top contributing flow features surfaced?
  context: When attacker behavior evades signatures and simple thresholds, unsupervised ML can score novel
    flows. Use time-series models for inbound connections/bytes and an Isolation Forest on flow features,
    run in parallel with an unsupervised autoencoder ensemble (Kitsune/KitNET) for OT-edge online scoring.
    Critically, every alert must surface the top-3 contributing flow features (e.g., source novelty, byte
    ratio, function-code rarity) following an explainable-NIDS approach so an analyst can triage quickly.
    High anomaly scores with explanations centered on source novelty or function-code rarity against an
    ICS port warrant investigation as possible initial-access exploitation.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek notice.log
  - Zeek weird.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Network DMZ segment (Purdue Level 3.5) hosting public-facing ICS applications (e.g., Historians,
    Web HMIs, Remote Access Gateways, OPC UA Servers, SCADA Servers, ICS API Gateways)'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  features = flow(src_novelty, byte_ratio, fc_rarity, conn_rate, iat_var)\n  score = IsolationForest(features);\
      \ ts_score = KitNET_autoencoder(stream)\n  if score > thr OR ts_score > thr:\n    explain = top3_SHAP(features);\
      \ emit alert(score, explain)"
- question: Did a public-facing ICS application process spawn a non-whitelisted child process such as
    an interactive shell, transfer utility, or reconnaissance tool?
  context: Successful exploitation of a web/ICS application frequently results in the application process
    spawning a command shell or tooling it would never legitimately run. Enforce parent-child allowlists
    for ICS application processes and alert on interactive shells (powershell.exe, cmd.exe, sh, bash),
    transfer utilities (certutil.exe, bitsadmin.exe), or recon tools (whoami, ipconfig, net, nmap, plink)
    with risky command-line arguments, using Sigma process-lineage rules and anomalous web-server child-process
    detection guidance. Prioritize any such child spawned within 300 seconds of a suspicious inbound connection
    (TOR node or exploit pattern) from an external IP. A historian or HMI server launching powershell
    is a strong post-exploitation indicator.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Public-facing ICS application servers (e.g., Windows-based HMI servers, data historians, engineering
    workstations in DMZ) located in the Purdue Level 3.5 DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source=(EventID=4688 OR Sysmon=1)\n  | where parent in ICS_app_procs\n    AND child in {powershell,cmd,sh,bash,certutil,bitsadmin,whoami,ipconfig,net,nmap,plink}\n\
      \    AND (parent,child) NOT IN operational_allowlist\n  | join inbound_conn(server, external_ip,\
      \ tor OR exploit) within 300s\n  | output alert"
- question: Are there rare (parent, child, user) process tuples, anomalous command-line entropy, or unseen
    system-call sequences on the ICS application server?
  context: Even shells disguised under odd names betray themselves statistically. Alert when (parent,
    child, user) tuples fall in the bottom 1st percentile of observed frequency, or when command-line
    entropy deviates >2 standard deviations from baseline (indicating obfuscated/encoded commands). Baseline
    normal process behavior with system-call short-sequence (n-gram) modeling and flag sequences absent
    from the learned normal database. A rare tuple involving a service account on a DMZ ICS server, or
    a high-entropy command line, is a high-value lead for exploitation follow-on.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Public-facing ICS application servers (e.g., Windows-based HMI servers, data historians, engineering
    workstations in DMZ) located in the Purdue Level 3.5 DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  source=(EventID=4688 OR Sysmon=1)\n  | stats count by (parent,child,user)\n  | where percentile_rank\
      \ < 1\n  | eval cmd_entropy=shannon(command_line)\n  | where cmd_entropy > mean+2*std -> alert"
  - technology: EDR/pseudocode
    query: "  seq = syscall_ngrams(process, n=6)\n  if any ngram NOT IN normal_db(process): emit alert"
- question: Does an explainable ML model with data provenance flag an anomalous process creation and reconstruct
    the exploit-to-process chain?
  context: Train an Isolation Forest on Event ID 4688/Sysmon-1 features and alert on highly anomalous
    process creations, especially those under service accounts that should never spawn interactive tooling.
    Reconstruct the exploit->process chain with a temporal-GNN provenance system (KAIROS) and surface
    the top-3 contributing features in the alert. This both detects the anomaly and provides the causal
    narrative (inbound exploit -> app process -> spawned shell) needed for confident attribution to initial
    access.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Public-facing ICS application servers (e.g., Windows-based HMI servers, data historians, engineering
    workstations in DMZ) located in the Purdue Level 3.5 DMZ.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  features = proc(parent,child,user,cmdline_stats,integrity,is_service_acct)\n  score = IsolationForest(features)\n\
      \  if score > thr:\n    chain = KAIROS_provenance(node=process_event)\n    explain = top3_features(features);\
      \ emit alert(score, chain, explain)"
- question: Did a DMZ (Level 3.5) server make a connection into the OT/ICS network (Levels 0-3) that violates
    the egress allowlist or used lateral-movement / unauthorized ICS protocols?
  context: After gaining a foothold in the DMZ, an adversary pivots toward OT. Alert on any DMZ-to-ICS
    connection violating the strict firewall/communication whitelist, and on ICS write/stop function codes
    not on the operational whitelist using a per-channel DFA model. Detect lateral-movement protocols
    (SMB 445, RDP 3389, DCE-RPC) into OT using MITRE BZAR Zeek analytics over SMB/DCE-RPC traffic, and
    flag unauthorized ICS protocols (Modbus 502, S7COMM 102) to critical assets (PLC, RTU, EWS). Any such
    crossing of the IT/OT boundary not explicitly permitted is a critical pivot indicator.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network boundary between the IT/DMZ (Purdue Level 3.5) and the OT/ICS network (Purdue Levels
    0-3), specifically monitoring traffic egressing the DMZ.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "  source=conn.log\n  | where src in PurdueL3_5 AND dst in PurdueL0_3\n    AND (src,dst,port)\
      \ NOT IN firewall_allowlist\n  | where service in (smb,rdp,dce_rpc) -> apply BZAR analytics\n  \
      \  OR service in (modbus,s7comm) AND fc in write/stop NOT IN op_whitelist\n  | output alert"
  - technology: SIEM/Rule pseudocode
    query: "  source=(EventID=5156)\n  | where src_zone=DMZ AND dst_zone=OT AND dst in {PLC,RTU,EWS}\n\
      \    AND rule NOT IN approved_flows -> alert"
- question: Have the destination sets, connection durations, or failed-connection rates of DMZ servers
    shifted from their baseline?
  context: A pivoting host suddenly talks to new internal destinations. Compare rolling destination sets
    per DMZ server with Jaccard similarity and alert on drops below threshold (indicating new destinations
    appearing). Alert on connection durations above the 99th percentile (long interactive sessions or
    tunnels). Explicitly profile blocked/failed connection rates from the DMZ as a distinct signal and
    alert on spikes, since scanning for reachable OT assets generates many failures. Thresholds should
    be derived from labeled ICS traffic baselines. A drop in destination-set similarity combined with
    a failure spike strongly suggests internal reconnaissance from the DMZ.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network boundary between the IT/DMZ (Purdue Level 3.5) and the OT/ICS network (Purdue Levels
    0-3), specifically monitoring traffic egressing the DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  source=conn.log src in DMZ\n  | window 1d: dst_set_today vs dst_set_baseline\n  | eval jac\
      \ = jaccard(today, baseline)\n  | where jac < thr -> alert\n  | also where duration > p99 OR rate(failed_conn)\
      \ > spike_thr -> alert"
- question: Does a host communication-graph model flag a new persistent edge from a DMZ server into PLC/EWS
    communities, with explainable provenance?
  context: Model the environment as a host communication graph and flag new persistent edges from DMZ
    servers into PLC/EWS communities that did not exist before. Use a temporal-GNN provenance approach
    (KAIROS) to detect and reconstruct the pivot, surfacing the top-3 contributing features. Because legitimate
    DMZ-to-OT communication is tightly constrained, any newly formed durable edge into a control-asset
    community is highly suspicious and the provenance reconstruction shows whether it traces back to an
    exploited application process.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network boundary between the IT/DMZ (Purdue Level 3.5) and the OT/ICS network (Purdue Levels
    0-3), specifically monitoring traffic egressing the DMZ.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  G = comm_graph(hosts, edges=flows, window=temporal)\n  new_edges = edges(DMZ_server -> PLC/EWS_community)\
      \ NOT IN historical_G\n  for e in new_edges if persistent(e):\n    score, chain = KAIROS(e); explain\
      \ = top3_features(e)\n    emit alert(score, chain, explain)"
- question: Was a web-shell-style file created in a web-accessible directory on the ICS application server,
    correlated with a recent external HTTP POST?
  context: Web shells are a primary persistence/initial-access mechanism on public-facing applications.
    Correlate web-directory file creations (.aspx/.jsp/.php/.ps1/.exe/.dll) with recent external HTTP
    POSTs and flag scriptable extensions or upload MIME types using NSA/ASD Mitigating Web Shells YARA/Sigma
    content and known-good file comparison, plus Sigma web-shell file-write rules. A scriptable file appearing
    in the webroot within minutes of an external POST, especially one not present in the known-good baseline,
    is strong evidence of a successful upload exploit.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Webroot directories, temporary file directories, and application configuration folders on public-facing
    ICS application servers in the DMZ (Purdue Level 3.5).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source=(EventID=4663 OR Sysmon=11)\n  | where path in webroot AND ext in {.aspx,.jsp,.php,.ps1,.exe,.dll}\n\
      \    AND file NOT IN known_good_baseline\n  | join http.log (method=POST, external_src, same_server)\
      \ within 5m\n  | match YARA/Sigma webshell rules -> alert"
- question: Are newly created files in web directories anomalous in size or Shannon entropy relative to
    per-directory baselines?
  context: Packed or encrypted implants and minimal web shells deviate from normal static content. Alert
    on scriptable files below the 5th percentile in size (tiny one-line shells) or with Shannon entropy
    above the 98th percentile for their MIME type (entropy >7.0 indicates packed/encrypted content). Profile
    per-directory baselines so high-entropy uploads stand out from normal static content. A high-entropy
    .aspx or a suspiciously tiny .php dropped into the webroot is a strong lead even without a signature
    match.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Webroot directories, temporary file directories, and application configuration folders on public-facing
    ICS application servers in the DMZ (Purdue Level 3.5).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  source=(EventID=4663 OR Sysmon=11) path in web_dirs\n  | eval size, entropy=shannon(content)\n\
      \  | per (directory,mime): baseline size_p5, entropy_p98\n  | where (scriptable AND size < size_p5)\
      \ OR entropy > max(entropy_p98, 7.0) -> alert"
- question: Does an explainable ML model classify a file creation or its associated request payload as
    malicious (web shell, command injection, or SQLi)?
  context: Train a Gradient Boosting model on file-creation features and alert on high-probability malicious
    classifications. Classify associated request payloads with a deep-learning command-injection detector
    and a cascaded NLP SQLi pipeline, surfacing the top-3 contributing features per an explainable-NIDS
    approach. This catches obfuscated web shells and injection payloads that evade signatures and links
    the dropped file to the malicious request that created it, confirming exploitation of the public-facing
    ICS application.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - Zeek http.log
  - Zeek files.log
  - 'NAI: Webroot directories, temporary file directories, and application configuration folders on public-facing
    ICS application servers in the DMZ (Purdue Level 3.5).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  file_feat = file(ext,size,entropy,path,header_mismatch)\n  p_mal = GradientBoosting(file_feat)\n\
      \  req_mal = CmdInjection_DL(payload) OR SQLi_NLP_pipeline(payload)\n  if p_mal > thr OR req_mal:\n\
      \    explain = top3_features(file_feat); emit alert(p_mal, explain)"
