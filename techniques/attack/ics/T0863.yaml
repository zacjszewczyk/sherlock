- question: Over a 30-day baseline of per-process network behavior, which connections show rare ports/ASNs,
    near-zero beaconing jitter (low inter-arrival variance), outbound/inbound byte ratios above the 98th
    percentile, orig_bytes above the per-process 99th percentile, or anomalous connection-state and NXDOMAIN
    rates?
  context: 'Initial Access tactic: statistical profiling of per-process network behavior detects C2 beaconing
    and data movement following a spearphishing foothold. Baseline destination ports, protocols, byte
    volumes, and inter-arrival intervals per process over 30 days with fleet-wide rarity scoring. Frequency:
    alert on rare ports/ASNs and near-zero beaconing jitter (low inter-arrival variance). Volume: flag
    outbound/inbound byte ratios above the 98th percentile and orig_bytes above the per-process 99th percentile.
    State: incorporate connection success vs. RST/blocked and NXDOMAIN rate. Rank suspicious events with
    Directed Anomaly Scoring. A document-descended process exhibiting low-jitter periodic connections
    to a rare ASN is a strong beaconing indicator confirming initial access. References: [Using Frequency
    Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [Outlier Parents of Cmd (CAR-2014-11-002), MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/);
