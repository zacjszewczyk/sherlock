name: 'T0863: User Execution'
id: cb15b892-51d5-4bea-b2ae-7d9e6f9a8207
description: Investigate whether an adversary has relied on ICS operator or engineer interaction to execute
  malicious code, and whether that interaction was the entry vector for initial access into the OT environment
  via spearphishing attachments or trojanized files. This playbook helps an analyst hunt for Office/PDF
  and email-client applications spawning command interpreters or LOLBins, executions from user-writable/temp
  directories with missing or invalid code signatures, anomalous elevated-token process creation outside
  strict ICS change-control allowlists, and the outbound network connections (low-reputation destinations,
  newly registered domains, suspicious TLS/JA3 fingerprints, and C2 beaconing) that frequently follow
  user execution. It combines deterministic symbolic-logic rules, statistical baselining (rarity, volume,
  frequency, entropy), and machine-learning anomaly/provenance models across endpoint (Windows Event IDs),
  network (Zeek, PCAP), and email telemetry to surface successful user execution on Engineering Workstations,
  HMIs, historians, and ICS DMZ assets.
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
- tactic_id: TA0108
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: On ICS hosts (EWS, HMI, historians, DMZ servers), are approved Office or PDF applications
    (winword.exe, excel.exe, powerpnt.exe, acrord32.exe, mspub.exe, visio.exe) spawning command interpreters
    or LOLBins (cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe,
    certutil.exe, bitsadmin.exe), and do the child command lines show obfuscation (base64/-enc, excessive
    carets, download cradles) or an outbound connection within 15 seconds of creation?
  context: 'Execution tactic: user execution of a malicious document is one of the most reliable ways
    an adversary turns a tricked operator into code execution on a control-system host. A document viewer
    or productivity app has no legitimate reason to launch a shell or scripting engine on an EWS or HMI,
    so any such parent->interpreter spawn is treated as a hard alert. The analyst should confirm the full
    parent->child lineage, inspect the command line for base64/-enc flags, caret obfuscation, or download/execution
    cradles, and pivot to Zeek conn.log/dns.log for an outbound connection within ~15s to a non-RFC1918
    destination, a low-reputation IP, or a newly registered domain. Treat a paired DNS NXDOMAIN/SERVFAIL
    or firewall-blocked egress as a STRONGER signal (failed C2 retrieval), not a weaker one. A positive
    result is a strong indicator of successful user execution; alert text must name the parent, child,
    full command line, and destination. References: [Suspicious Microsoft Office Child Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/);
    [Unusual Parent Process For Cmd.EXE, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/);
    [Suspicious Encoded PowerShell Command Line, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek pe.log
  - 'NAI: Endpoint devices within the ICS network, including Engineering Workstations (EWS), Human-Machine
    Interfaces (HMIs), Data Historians, and ICS DMZ servers; network traffic monitoring points at ICS
    zone boundaries and egress points.'
  range: Last 90 days; pivot +/- 15 seconds around child process creation for the correlated egress connection.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=WinEventID:4688 OR Sysmon:1\n  | where ParentImage IN (winword.exe,excel.exe,powerpnt.exe,acrord32.exe,mspub.exe,visio.exe)\n\
      \  | where ChildImage IN (cmd.exe,powershell.exe,wscript.exe,cscript.exe,mshta.exe,rundll32.exe,regsvr32.exe,certutil.exe,bitsadmin.exe)\n\
      \  | eval susp = match(CommandLine, \"(?i)-enc|base64|\\^{3,}|IEX|DownloadString|FromBase64\")\n\
      \  | join host,15s [ Zeek:conn where resp_h NOT in RFC1918 ]\n  | alert fields=ParentImage,ChildImage,CommandLine,resp_h,resp_p"
  - technology: Zeek/pseudocode
    query: ">-\n  conn | join dns on uid\n  | where orig_h==ics_host AND (resp_h not in RFC1918)\n  |\
      \ flag dns.rcode in (NXDOMAIN,SERVFAIL) OR conn.conn_state in (REJ,S0) as failed_c2\n  | correlate\
      \ to 4688 child within 15s -> raise_severity"
- question: Across the ICS fleet, which parent-child process pairs, command-line tokens, command-line
    lengths/entropy, and child-process outbound byte counts are statistically rare or anomalous relative
    to a 90-day baseline, indicating possible obfuscated user-execution payloads?
  context: 'Execution tactic: sophisticated actors blend in, so deterministic rules are paired with statistical
    rarity scoring to catch novel parent->interpreter activity. Build a 90-day baseline of (parent,child)
    pairs, command-line tokens, and per-pair command-line length and entropy, then score fleet-wide rarity
    as a malice prior. Alert on command-line length above the per-pair 99th percentile, child outbound
    byte counts above the host 98th percentile, any (parent,child) pair with count 0 in the baseline,
    or a host exceeding its 14-day mean spawn rate by more than 3 sigma. Track child success/failure state
    (exit codes, blocked egress, NXDOMAIN rate) and use character-distribution/entropy deviation from
    a benign script corpus to score obfuscation. A first-seen pair plus high entropy strongly suggests
    a malicious document-borne payload. References: [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [Outlier Parents of Cmd (CAR-2014-11-002), MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/);
    [Revoke-Obfuscation, Bohannon and Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek pe.log
  - 'NAI: Endpoint devices within the ICS network, including Engineering Workstations (EWS), Human-Machine
    Interfaces (HMIs), Data Historians, and ICS DMZ servers; network traffic monitoring points at ICS
    zone boundaries and egress points.'
  range: Last 90 days (rolling baseline); evaluate new events against the trailing 14-day rate for sigma
    deviation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=WinEventID:4688\n  | stats count, p99(cmdline_len), entropy(CommandLine) by ParentImage,ChildImage\n\
      \  | where pair_count==0 OR cmdline_len>p99_pair OR entropy>benign_corpus_mean+3sd\n  | append host_spawn_rate\
      \ > mean_14d + 3*stdev_14d\n  | alert"
  - technology: Zeek/pseudocode
    query: ">-\n  conn | stats p98(orig_bytes) by host\n  | where child_outbound_bytes > p98_host\n  |\
      \ join NXDOMAIN_rate, blocked_conn_rate per child -> rarity_score"
- question: When process-creation events are scored by an unsupervised anomaly model and provenance graph,
    which document->interpreter->network/file execution chains fall in the top 0.5% of anomaly scores,
    and what are the top contributing features?
  context: 'Execution tactic: ML provides a final tier to catch user-execution chains that evade signatures
    and simple baselines. Train an Isolation Forest / One-Class SVM on process-creation and correlated
    network features (parent hash, child path, command-line entropy, signed status, destination reputation,
    port prevalence, bytes out/in, NXDOMAIN/blocked-connection counts) and alert on the top 0.5% anomaly
    scores. In parallel, model the document->interpreter->network/file chain as an anomalous provenance
    subgraph. Crucially, never ship a bare score: emit the top-3 contributing features (e.g., ''parent=winword.exe'',
    ''enc cmdline entropy 5.9'', ''first-seen dest ASN'') with LIME-style attribution so the analyst can
    triage. A high anomaly score with a document parent and obfuscated, network-touching child is a high-confidence
    user-execution lead. References: [Robust IoT Security Using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4);
    [KAIROS: Intrusion Detection using Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - Zeek pe.log
  - 'NAI: Endpoint devices within the ICS network, including Engineering Workstations (EWS), Human-Machine
    Interfaces (HMIs), Data Historians, and ICS DMZ servers; network traffic monitoring points at ICS
    zone boundaries and egress points.'
  range: Last 90 days for model training; score in near-real-time and review top 0.5% daily.
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [parent_hash, child_path, cmdline_entropy, signed, dest_reputation, port_prevalence,\
      \ bytes_out, bytes_in, nxdomain_cnt, blocked_cnt]\n  model = IsolationForest().fit(baseline_features)\n\
      \  score = model.decision_function(event_features)\n  if percentile(score) >= 99.5: emit_alert(top3_features=LIME(event))"
  - technology: Provenance/pseudocode
    query: ">-\n  build_subgraph(document -> interpreter -> {network,file})\n  anomaly = graph_recon_error(subgraph)\
      \  # KAIROS-style\n  if anomaly > threshold: alert(path_nodes, top_edges)"
- question: Are processes executing on ICS hosts from user-writable or temporary directories (C:\Users\*\Downloads,
    *\AppData\Local\Temp, C:\ProgramData, C:\PerfLogs) with binaries absent from the approved installer/inventory
    allowlist, missing/mismatched OriginalFileName or Description, or absent/invalid Authenticode signatures,
    and do they connect outbound within 30 seconds to a non-whitelisted external IP on a non-standard
    port?
  context: 'Execution tactic: trojanized installers and document-dropped payloads typically run from user-writable
    or temp paths rather than vetted install locations on a controlled ICS host. Detect Event ID 4688
    where NewProcessPath is in such directories and the binary is not on the approved installer/inventory
    allowlist. Keep hard rules: missing/mismatched OriginalFileName-Description, absent or invalid Authenticode
    signature, or a hash absent from the known-good inventory each warrant an alert. Apply a parent-lineage
    allowlist to spot unusual parent-child relationships, and corroborate with an outbound connection
    within 30s to a non-whitelisted external IP on a non-standard port. Log blocked-egress and NXDOMAIN
    attempts from the new process as distinct first-class signals of failed C2. A positive finding indicates
    an unvetted, likely user-delivered binary running on a system that should be strictly controlled.
    References: [Unusual Parent-Child Relationship, Elastic](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek x509.log
  - Zeek files.log
  - Zeek pe.log
  - 'NAI: Endpoint devices such as Engineering Workstations (EWS), HMIs, Maintenance Laptops, and Jump
    Boxes within ICS zones; network egress points from the ICS network; ICS DMZ network segments where
    software updates might be staged.'
  range: Last 90 days; pivot +/- 30 seconds around process creation for the corroborating egress connection.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=WinEventID:4688\n  | where NewProcessPath MATCHES \"(?i)\\\\Users\\\\.*\\\\Downloads|\\\
      \\AppData\\\\Local\\\\Temp|\\\\ProgramData|\\\\PerfLogs\"\n  | where hash NOT in known_good_inventory\n\
      \  | where signature in (absent,invalid) OR OriginalFileName!=NewProcessName\n  | join host,30s\
      \ [ Zeek:conn where resp_h not in whitelist AND resp_p in nonstandard ]\n  | alert"
  - technology: Zeek/pseudocode
    query: ">-\n  conn | join x509,files,dns on uid\n  | where orig_h==ics_host AND resp_h not in approved_whitelist\n\
      \  | flag conn_state in (REJ,S0) OR dns.rcode==NXDOMAIN as failed_egress -> first_class_signal"
- question: Over a 60-day baseline, which executions involve rare destination ASNs/countries (<0.5% of
    historical connections), never-before-seen ports, first-execution-of-hash on a host group, anomalous
    byte ratios, or command lines with low similarity and high entropy to prior lines for the same process
    name?
  context: 'Execution tactic: statistical rarity flags unvetted binaries and obfuscated commands that
    slip past allowlists. Baseline destination ASN/country/port and process prevalence over 60 days and
    score fleet-wide rarity. Volume: flag outbound/inbound byte ratios above the 98th percentile. Frequency:
    alert on rare ASN/country (<0.5% of historical connections), never-before-seen ports, or first-execution-of-hash
    on the host group. State: profile connection success vs. blocked/RST and per-process NXDOMAIN rate.
    Flag command lines with low Jaccard similarity (<0.2) to historical lines for the same process name
    combined with high character entropy. A first-seen hash reaching a rare ASN on a novel port is a strong
    indicator of a freshly delivered payload establishing C2 after user execution. References: [Using
    Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [Outlier Parents of Cmd (CAR-2014-11-002), MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/);
    [Revoke-Obfuscation, Bohannon and Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek x509.log
  - Zeek files.log
  - Zeek pe.log
  - 'NAI: Endpoint devices such as Engineering Workstations (EWS), HMIs, Maintenance Laptops, and Jump
    Boxes within ICS zones; network egress points from the ICS network; ICS DMZ network segments where
    software updates might be staged.'
  range: Last 60 days (rolling baseline) for destination/port/hash prevalence; score new events continuously.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | stats count by hash,host_group\n  | eval first_exec = (count==1)\n  | join Zeek conn\
      \ stats: prevalence(dest_asn,dest_country,dest_port)\n  | where dest_asn_pct<0.5% OR port_first_seen\
      \ OR first_exec OR byte_ratio>p98\n  | alert rarity_score"
  - technology: SIEM/Stats pseudocode
    query: ">-\n  | for each proc compute jaccard(cmdline, historical_cmdlines[proc]) and entropy(cmdline)\n\
      \  | where jaccard<0.2 AND entropy>threshold\n  | alert novel_obfuscated_cmdline"
- question: When a supervised gradient-boosted or one-class model scores executions using path, command-line
    entropy, signature status, destination reputation, port prevalence, byte volumes, and failed-connection/NXDOMAIN
    features, which executions classify as malicious, and what top-3 features and provenance subgraph
    drive each verdict?
  context: 'Execution tactic: ML classification adds context that pure path/signature rules miss while
    those deterministic rules stay running as the floor. Train a supervised gradient-boosted or one-class
    model on path features, command-line entropy, signature status, destination reputation, port prevalence,
    bytes out/in, and failed-connection/NXDOMAIN counts, and reconstruct the execution provenance subgraph
    for context. Surface the top-3 features driving each classification (e.g., ''path=AppData\Temp'',
    ''unsigned'', ''dest port 8443 first-seen'') in the alert. A malicious classification with an unsigned
    temp-path binary reaching a first-seen port is a high-confidence user-execution finding worth immediate
    triage and host isolation consideration. References: [Robust IoT Security Using Isolation Forest and
    One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4); [KAIROS: Intrusion Detection using
    Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek x509.log
  - Zeek files.log
  - Zeek pe.log
  - 'NAI: Endpoint devices such as Engineering Workstations (EWS), HMIs, Maintenance Laptops, and Jump
    Boxes within ICS zones; network egress points from the ICS network; ICS DMZ network segments where
    software updates might be staged.'
  range: Last 60-90 days for training; score continuously, review malicious-classified events promptly.
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [path_class, cmdline_entropy, signature_status, dest_reputation, port_prevalence,\
      \ bytes_out, bytes_in, failed_conn_cnt, nxdomain_cnt]\n  clf = GradientBoosting().fit(labeled) #\
      \ or OneClassSVM on benign\n  if clf.predict(event)==malicious: emit_alert(top3=SHAP(event), subgraph=provenance(event))"
- question: Are processes created with a full elevated token (Windows Event ID 4688, Token Elevation Type
    '%%1937'/Type 2) whose name/path/hash is NOT on the strict ICS admin-tool allowlist, or where the
    subject user (correlated via 4624) is non-admin, the binary is unsigned, or it runs from a user-writable
    directory?
  context: 'Execution tactic: malicious code delivered via user execution often requests elevation to
    broaden impact, and ICS change control means only a tightly curated set of admin tools should ever
    run elevated. Trigger on 4688 events with Token Elevation Type ''%%1937'' (full token) where the process
    name/path/hash is not in the admin-tool allowlist, or where the subject user (correlated via 4624)
    is non-admin, applying an expected-parent allowlist to catch unusual parent-child relationships. Keep
    hard rules: an unsigned elevated binary or an elevated process from a user-writable directory is always
    an alert. Correlate with preceding failed-elevation or failed-logon (4625) bursts for the same user
    as an escalation signal. A non-admin operator suddenly running an unsigned elevated process is a strong
    sign of post-user-execution privilege abuse on a controlled asset. References: [Unusual Parent-Child
    Relationship, Elastic](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: All Windows-based ICS assets requiring strict change control, including Engineering Workstations,
    SCADA servers, Data Historians, and Domain Controllers in the process control network.'
  range: Last 90 days; correlate with 4624/4625 events for the same user in the surrounding session window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=WinEventID:4688 | where TokenElevationType==\"%%1937\"\n  | where NOT (NewProcessName,NewProcessPath,hash)\
      \ in admin_tool_allowlist\n  | join 4624 on LogonId: subject_user\n  | where subject_user in non_admin_roles\
      \ OR signature==absent OR NewProcessPath in user_writable\n  | append correlate 4625 bursts(user,\
      \ 10m)\n  | alert"
- question: Across a 90-day baseline of privileged process usage per user and per parent, which elevated
    executions are first-time-for-a-user/role, involve an unusual parent, or exceed the 14-day mean privileged-spawn
    count by more than 3 sigma, and how do failed-vs-successful elevation ratios and off-hours timing
    deviate?
  context: 'Execution tactic: rare privileged-execution patterns reveal accounts being abused after a
    user is tricked into running code. Baseline privileged process usage per user and parent over 90 days
    with fleet-wide rarity scoring. Frequency: alert on the first-time privileged process for a user/role,
    an unusual parent, or a daily privileged-spawn count exceeding the 14-day mean by more than 3 sigma.
    Volume: track the count of distinct privileged binaries per host per day. State: incorporate failed
    vs. successful elevation ratios and off-hours execution as deviation features. An operator role that
    ''never elevates'' suddenly spawning privileged binaries, especially off-hours and from an unusual
    parent, is a high-value lead for post-execution privilege abuse. References: [Using Frequency Analysis
    to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [Outlier Parents of Cmd (CAR-2014-11-002), MITRE CAR](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: All Windows-based ICS assets requiring strict change control, including Engineering Workstations,
    SCADA servers, Data Historians, and Domain Controllers in the process control network.'
  range: Last 90 days (rolling baseline); evaluate daily spawn counts against the trailing 14-day mean.
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=WinEventID:4688 where TokenElevationType==\"%%1937\"\n  | stats count, dc(NewProcessName)\
      \ by user,role,ParentImage,date\n  | eval first_for_role = (historical_count[user,proc]==0)\n  |\
      \ where first_for_role OR ParentImage not in expected_parents OR daily_count>mean_14d+3*sd_14d\n\
      \  | join failed_vs_success_elev_ratio, offhours_flag -> rarity_score | alert"
- question: When an unsupervised anomaly model (Isolation Forest/OCSVM), optionally with a time-series
    component on per-host privileged counts and a provenance-graph check, scores privileged-execution
    feature vectors per host and role, which elevated executions are anomalous and what top-3 features
    explain them?
  context: 'Execution tactic: ML detects anomalous privileged-execution rhythms that static thresholds
    miss, while the symbolic allowlist remains the deterministic floor. Apply an unsupervised anomaly
    model (Isolation Forest / OCSVM) on privileged-execution feature vectors per host and role, optionally
    with a time-series component on per-host privileged counts, and corroborate via provenance-graph anomaly.
    Report the top-3 contributing features (e.g., ''role=operator never elevates'', ''parent=excel.exe'',
    ''cmdline entropy high'') in the alert text. An elevated process with an Office parent and high-entropy
    command line on a role that never elevates is a strong indicator that user execution led to privileged
    malicious activity. References: [Robust IoT Security Using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4);
    [KAIROS: Intrusion Detection using Whole-system Provenance](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: All Windows-based ICS assets requiring strict change control, including Engineering Workstations,
    SCADA servers, Data Historians, and Domain Controllers in the process control network.'
  range: Last 90 days for training; score continuously with a per-host time-series view of privileged
    counts.
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = priv_exec_vectors(host, role) # [proc, parent, cmdline_entropy, hour, elev_fail_ratio,\
      \ signed]\n  model = IsolationForest().fit(X_baseline)\n  ts = forecast(per_host_priv_count); resid\
      \ = actual-ts\n  if anomaly(model,event) OR resid>3sd: emit_alert(top3=explain(event), provenance=subgraph(event))"
- question: On ICS assets, are email clients or document readers (OUTLOOK.EXE, WINWORD.EXE, EXCEL.EXE,
    ACRORD32.EXE) spawning command interpreters, scripting engines, or LOLBins (cmd.exe, powershell.exe,
    wscript.exe, mshta.exe, bitsadmin.exe, certutil.exe) not in the allowlist, particularly within minutes
    of the user receiving a suspicious impersonation email?
  context: 'Initial Access tactic: spearphishing attachments that require user action are a documented
    entry vector into ICS environments (e.g., CISA AA21-201A). Alert on 4688 events where email/document
    handlers spawn LOLBins/interpreters not in the allowlist, and inspect command lines for base64/-enc
    and download cradles. Keep the hard rule and raise severity when the spawn occurs within minutes of
    a suspicious inbound email matching impersonation criteria (unknown sender domain, display-name spoof).
    Correlate PowerShell script-block/module logging (4104/4103) and the logon (4624) for user context.
    A blocked egress or NXDOMAIN from the spawned child strengthens the alert. An OUTLOOK.EXE->powershell.exe
    chain minutes after a spoofed email is a high-confidence initial-access-via-user-execution event.
    References: [Suspicious Microsoft Office Child Process, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/);
    [Unusual Parent Process For Cmd.EXE, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/);
    [Suspicious Encoded PowerShell Command Line, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd/);
    [Detecting Credential Spearphishing Attacks in Enterprise Settings, Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho);
    [CISA AA21-201A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-201a).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 4103
  - Windows Event ID 4624
  - 'NAI: Engineering Workstations, Human-Machine Interfaces (HMIs), Operator Consoles, Jump Servers within
    the OT network, Data Historians'
  range: Last 90 days; tightly correlate the process spawn with inbound email receipt within a few minutes.
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=WinEventID:4688\n  | where ParentImage IN (OUTLOOK.EXE,WINWORD.EXE,EXCEL.EXE,ACRORD32.EXE)\n\
      \  | where ChildImage IN (cmd.exe,powershell.exe,wscript.exe,mshta.exe,bitsadmin.exe,certutil.exe)\
      \ AND ChildImage not in allowlist\n  | eval enc = match(CommandLine,\"(?i)-enc|base64|DownloadString|IEX\"\
      )\n  | join email on recipient,5m [ email where sender_domain unknown OR display_name_spoof ]\n\
      \  | raise_severity | alert ParentImage,ChildImage,CommandLine"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  correlate 4104/4103 scriptblock with 4688 child\n  | where blocked_egress OR nxdomain\
      \ from child -> strengthen_alert"
- question: Over a 60-day baseline, which (parent,child) process pairs and command-line tokens involving
    document/email handlers are novel or below the 1st percentile, and which inbound emails score as anomalous
    by sender/domain reputation and per-sender behavioral deviation (stylometry, header/MUA fingerprint,
