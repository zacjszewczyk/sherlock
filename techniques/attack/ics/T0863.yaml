  context: 'Initial Access tactic: sequence-based ML detects evolving C2 patterns from spearphishing payloads
    that point-in-time stats miss, with IOC/TI symbolic rules running in parallel. Train an unsupervised
    model (LSTM autoencoder or Isolation Forest/OCSVM) on per-host/per-process flow-sequence features
    (ports, bytes, intervals, failed-conn and NXDOMAIN counts) and alert on high reconstruction error
