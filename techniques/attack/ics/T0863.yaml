- question: Does a suspicious process descended from a document/email handler (e.g., powershell.exe spawned
    by WINWORD.EXE) initiate outbound connections (Zeek conn/ssl/dns, Windows 5156) to a threat-intel
    destination, a newly observed or self-signed TLS SNI/certificate, a JA3/JA3S fingerprint tied to known
    C2, with unusually large data volume, or periodic beaconing timing?
  context: 'Initial Access tactic: after a spearphishing attachment executes, the payload typically reaches
    out for C2 or staging, so network corroboration confirms a successful foothold. Correlate 4688/5156
    to Zeek conn.log/ssl.log/dns.log and alert when a document-handler-descended process connects to a
    destination IP/domain/SNI/JA3 matching threat intel, uses a self-signed or newly-observed certificate,
    or resolves a newly registered domain. Keep deterministic IOC matching as the floor. Profile NXDOMAIN/SERVFAIL
    bursts and firewall-blocked connections from the suspect process as distinct C2-failure signals. A
    document-descended process beaconing to a TI-listed host or a rare JA3 fingerprint is strong evidence
    the spearphish achieved initial access. References: [CISA AA21-201A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-201a);
    [Detecting Credential Spearphishing Attacks in Enterprise Settings, Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho).'
