name: 'T1692.002: Reporting Message'
id: 829ccb88-ec36-4ecf-be4e-6e5c07ea008f
description: Investigate potential spoofing of ICS reporting (telemetry) messages used for evasion and
  to impair process control. Adversaries who can forge reporting messages may state that a process is
  operating normally while it is not, or inject misleading errors to distract operators from the real
  problem. This playbook helps an analyst hunt for telemetry streams that exhibit sequence-number or timing
  anomalies (duplicate identifiers, non-monotonic resets, dropped ranges, off-cadence inter-arrival times),
  reporting gaps where real reports are suppressed while fakes are injected, telemetry values that are
  physically implausible or contradict trusted correlated sources (historian, SIS, redundant sensors,
  downstream meters), and reporting messages that originate from a source IP/MAC, VLAN, or subnet inconsistent
  with the authoritative OT asset inventory. It combines deterministic specification/invariant rules,
  statistical baselining (cadence, entropy, byte-volume, cross-correlation, CUSUM, watermarking), and
  machine-learning models across DNP3, Modbus, and IEC 61850 traffic and OT host and process logs.
type: technique
related:
- tactic_id: TA0103
  tactic_name: Evasion
