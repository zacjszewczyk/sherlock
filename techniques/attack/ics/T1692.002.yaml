questions:
- question: Do reporting messages from a given field device show sequence-number or reset anomalies, such
    as a DNP3 sequence number or Modbus transaction ID repeating from the same source within one reporting
    interval, sequence numbers decreasing without a matching protocol reset, dropped ranges, or out-of-spec
    / unpaired command-response function codes?
  context: 'Telemetry from a healthy PLC/RTU/IED advances through a predictable sequence and always pairs
    commands with responses. A spoofer that injects forged reports often reuses or resets identifiers,
    produces non-monotonic counters without a legitimate protocol reset, or emits reports with no matching
    request. Encode valid DNP3 / Modbus / IEC 61850 function codes and command/response pairing and model
    each PLC''s sequence and timing as a deterministic finite automaton so duplicates, non-monotonic resets,
    and dropped ranges surface as explicit state violations. Because this is an Evasion technique, deterministic
    catches here are valuable: a positive result is a strong, low-false-positive indicator that the legitimate
    stream is being tampered with rather than merely noisy. References: [Distributed IDS Semantic Rules](https://arxiv.org/abs/2412.07917);
    [Temporal Phase Shifts in SCADA](https://arxiv.org/abs/1808.05068).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek conn.log
  - 'NAI: Network segments monitoring Level 1 (Basic Control) devices (PLCs, RTUs, IEDs), the Level 2
    (Supervisory Control) network, and Industrial Demilitarized Zone (IDMZ) network segments where ICS
    protocol traffic (DNP3, Modbus, IEC 61850) is captured and processed.'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Rule pseudocode
    query: "for each (src, device) in [dnp3.log, modbus.log]:\n  alert if dnp3.seq_num or modbus.trans_id\
      \ repeats from same src within one configured reporting interval;\n  alert if seq_num decreases\
      \ without preceding protocol reset/maintenance flag;\n  alert if function_code not in valid_codes(device)\
      \ or response has no paired request;\n  maintain per-PLC DFA(state=seq,timing); flag duplicate IDs,\
      \ non-monotonic resets, dropped ranges as state violations"
- question: Has the legitimate reporting stream for a device gone silent or degraded, for example reports-per-minute
    dropping to zero or below its floor, expected periodic reports missing for more than two cadence intervals,
    or the reporting flow's conn.log connection state showing S0, REJ, or RSTO?
  context: 'Treat absence and error as distinct signals from value anomalies. An adversary who suppresses
    real reports while injecting fakes leaves a detectable gap or phase break in the genuine stream. Alert
    when the device''s report frequency collapses, when periodic reports are missing beyond two cadence
    intervals, or when the reporting connection shows half-open/rejected/reset states. A positive result
    combined with anomalous injected traffic strongly suggests an evasion-oriented spoof that is masking
    the true device state from operators. References: [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html);
    [Temporal Phase Shifts in SCADA](https://arxiv.org/abs/1808.05068).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek conn.log
  - 'NAI: Network segments monitoring Level 1 (Basic Control) devices (PLCs, RTUs, IEDs), the Level 2
    (Supervisory Control) network, and Industrial Demilitarized Zone (IDMZ) network segments where ICS
    protocol traffic (DNP3, Modbus, IEC 61850) is captured and processed.'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Stats pseudocode
    query: 'reports_per_min = count(reports) by device, 1m;

      alert if reports_per_min == 0 or < device_floor;

      alert if no periodic report seen for > 2 * cadence_interval(device);

      alert if conn.log conn_state in (S0, REJ, RSTO) for device.reporting_flow'
- question: Does a device's reporting cadence, volume, or sequence-increment entropy deviate from its
    own established baseline, for example inter-arrival times falling outside the 5th-95th percentile
    band, sudden entropy drops or frozen/constant values (replay), or small persistent cadence/value drift
    accumulating over time?
  context: 'Cadence differs by point and protocol, so baselines must be per-device. Compute inter-arrival
    percentiles over a 30-day window and flag reporting that falls outside the normal band. Track report
    volume (bytes/min) and frequency (reports/min) along with the Shannon entropy of sequence increments:
    a sudden entropy drop or frozen value indicates a replayed/spoofed stream that lost its natural variability.
    A stateful CUSUM test accumulates small persistent drifts to catch low-and-slow spoofing tuned to
    evade single-sample thresholds. This statistical layer catches stealthy evasion that deterministic
    rules miss. References: [Temporal Phase Shifts in SCADA](https://arxiv.org/abs/1808.05068); [Limiting
    the Impact of Stealthy Attacks on ICS](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek conn.log
  - 'NAI: Network segments monitoring Level 1 (Basic Control) devices (PLCs, RTUs, IEDs), the Level 2
    (Supervisory Control) network, and Industrial Demilitarized Zone (IDMZ) network segments where ICS
    protocol traffic (DNP3, Modbus, IEC 61850) is captured and processed.'
  range: Last 90 days; baseline cadence/entropy over a rolling 30-day window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline[device] = inter_arrival percentiles over 30d;

      alert if inter_arrival outside [p5, p95] band;

      compute volume=bytes/min, freq=reports/min, H=ShannonEntropy(seq_increments);

      alert if H drops sharply or value frozen/constant;

      CUSUM(cadence_drift, value_drift) over time; alert when CUSUM > threshold(operating_point)'
- question: For controllers that superimpose a private random excitation (watermark) on control inputs,
    do the reported responses pass a hypothesis test on the expected cross-correlation/variance, or does
    the reporting stream fail to reproduce the secret watermark statistics?
  context: 'Dynamic watermarking injects a controller-private random signal into actuation; a genuine
    sensor/reporting loop reflects that excitation in its responses with a known statistical signature.
    A replayed or spoofed reporting stream cannot reproduce the secret watermark, so a hypothesis test
    on the cross-correlation/variance between expected and reported responses fails. This is one of the
    most robust evasion detectors because it does not rely on the adversary making an observable mistake
    in sequence or value space - failing the test is direct evidence the telemetry is not coming from
    the live physical process. References: [Dynamic Watermarking, Satchidanandan and Kumar](https://arxiv.org/abs/1606.06381).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek conn.log
  - 'NAI: Network segments monitoring Level 1 (Basic Control) devices (PLCs, RTUs, IEDs), the Level 2
    (Supervisory Control) network, and Industrial Demilitarized Zone (IDMZ) network segments where ICS
    protocol traffic (DNP3, Modbus, IEC 61850) is captured and processed.'
  range: Last 90 days
  queries:
  - technology: Controller/Stats pseudocode
    query: 'inject private watermark e_t into control input;

      expected_resp = model_response(e_t);

      test_stat = crosscorr/variance(reported_resp, expected_resp);

      alert if hypothesis_test(test_stat) rejects ''watermark present'''
- question: Does a per-device machine-learning model of telemetry timing (1D-CNN or LSTM autoencoder over
    sequence numbers, inter-arrival timing, and payload size) produce a reconstruction/forecast residual
    that exceeds the normal moving baseline for multiple consecutive intervals?
  context: 'Train a lightweight prediction-based model per device on sequence numbers, inter-arrival timing,
    and payload size, and alert when the residual stays above the normal moving baseline across several
    consecutive intervals (requiring persistence reduces false positives). Surface the top-3 contributing
    features (e.g., inter-arrival z-score, payload-size delta, sequence-gap) in the alert so analysts
    can triage quickly. Because LSTM time-series IDS are evadable by sensor-perturbing adversaries, keep
    the deterministic sequence and CUSUM checks running in parallel - the ML model is a sensitive supplement,
    not a replacement, for the evasion detectors. References: [Detecting Cyberattacks in ICS Using CNNs,
    Kravchik and Shabtai](https://arxiv.org/abs/1806.08110); [Luo et al.](https://arxiv.org/abs/2003.13213);
    [Adversarial Attacks on ICS Time-Series IDS](https://arxiv.org/abs/1911.04278).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek conn.log
  - 'NAI: Network segments monitoring Level 1 (Basic Control) devices (PLCs, RTUs, IEDs), the Level 2
    (Supervisory Control) network, and Industrial Demilitarized Zone (IDMZ) network segments where ICS
    protocol traffic (DNP3, Modbus, IEC 61850) is captured and processed.'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'model[device] = 1DCNN_or_LSTM_AE(features=[seq_num, inter_arrival, payload_size]);

      residual = |forecast - observed| (or reconstruction error);

      alert if residual > moving_baseline for N consecutive intervals;

      emit top3 feature contributions; run alongside deterministic seq + CUSUM checks'
- question: Does a trusted source such as the operational historian or Safety Instrumented System indicate
    a limit breach or abnormal condition while the device's protocol telemetry still reports nominal values
    for the same point within a short window?
  context: 'When independent, trusted instrumentation (historian trends, SIS) records a limit breach but
    the OT protocol telemetry for the same device keeps reporting normal values, the reporting message
    is likely suppressed or spoofed. Encode the expected protocol/process relationship as an explicit
    specification and require the discrepancy to persist across at least two consecutive reports before
    escalating, which suppresses transient mismatches. A persistent contradiction is a hallmark of evasion:
    the adversary is keeping the visible telemetry green to hide a real process deviation that the SIS/historian
    still sees. References: [On Specification-based Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - Windows Application Event Logs
  - Operational Historian Logs
  - Safety Instrumented System (SIS) Logs
  - 'NAI: SCADA servers, Process Historian servers, HMI workstations, Engineering Workstations, and network
    segments where ICS protocol traffic is captured (e.g., Level 2 Supervisory Control Network, Industrial
    Demilitarized Zone).'
  range: Last 90 days
  queries:
  - technology: SIEM correlation pseudocode
    query: "for each device:\n  hist_breach = historian/SIS shows limit_breach;\n  proto_nominal = protocol_telemetry\
      \ within nominal_range;\n  if hist_breach and proto_nominal persists >= 2 consecutive reports: alert(spoof/suppression)"
- question: Does any reporting message violate a learned process invariant - a predicate over correlated
    sensor/actuator values that must always hold (e.g., valve CLOSED implies downstream flow ~ 0, or pump
    ON implies discharge pressure > P_min)?
  context: 'Process invariants capture plant physics: relationships between correlated points that hold
    in all normal operation. Mine and enforce these invariants and alert immediately when a reporting
    message breaks one, because a spoofed value that ignores physics (e.g., a closed valve reported alongside
    significant downstream flow) cannot satisfy the invariant. This deterministic physics-grounded check
    is highly defensible against evasion - the adversary would have to forge every correlated point consistently
    to avoid tripping it. References: [A Systematic Framework to Generate Invariants for Anomaly Detection
    in ICS, Feng et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - Windows Application Event Logs
  - Operational Historian Logs
  - Safety Instrumented System (SIS) Logs
  - 'NAI: SCADA servers, Process Historian servers, HMI workstations, Engineering Workstations, and network
    segments where ICS protocol traffic is captured (e.g., Level 2 Supervisory Control Network, Industrial
    Demilitarized Zone).'
  range: Last 90 days
  queries:
  - technology: SIEM/Invariant-engine pseudocode
    query: 'invariants = mine_invariants(normal_history);  // e.g. valve==CLOSED -> flow~0

      for each report: evaluate all invariants involving its point;

      alert immediately if any invariant violated'
- question: Do paired or redundant signals lose their normal cross-correlation, with residuals exceeding
    the 95th percentile of historical error over five-minute windows, a small constant offset accumulating
    via CUSUM, or a Matrix Profile discord indicating a frozen or abruptly shifted reporting value?
  context: 'Redundant or physically linked signals track each other closely; spoofing one of them breaks
    that relationship. Run continuous cross-correlation over five-minute windows and alert when correlation
    drops materially below baseline or residuals exceed the 95th percentile of historical error. Accumulate
    persistent small residuals with CUSUM to catch a stealthy constant-offset spoof that stays under single-window
    thresholds, and add near-parameter-free Matrix Profile discord detection to flag frozen or abruptly
    shifted reporting. Together these catch evasion attempts that keep a value plausible in isolation
    but inconsistent with its partner signal. References: [Limiting the Impact of Stealthy Attacks on
    ICS](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf); [Anomaly-based IDS with SVM and Random
    Forests, Duque Anton et al.](https://arxiv.org/abs/1907.10374).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - Windows Application Event Logs
  - Operational Historian Logs
  - Safety Instrumented System (SIS) Logs
  - 'NAI: SCADA servers, Process Historian servers, HMI workstations, Engineering Workstations, and network
    segments where ICS protocol traffic is captured (e.g., Level 2 Supervisory Control Network, Industrial
    Demilitarized Zone).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for paired_signals (a,b) over 5m windows:\n  corr = crosscorr(a,b); resid = a - predict(a|b);\n\
      \  alert if corr << baseline_corr or |resid| > p95(historical_error);\n  CUSUM(resid); alert on\
      \ persistent constant offset;\n  MatrixProfile(signal); alert on discord (frozen/abrupt shift)"
- question: Does a classifier of paired telemetry distinguish divergent from normal states - a supervised
    Random Forest over redundant-sensor deltas, device mode, and rate-of-change flagging high-confidence
    divergence, or an unsupervised one-class SVM/autoencoder flagging spoofed flatlines that fall off
    the learned normal manifold?
  context: 'Train a supervised Random Forest on paired telemetry, device mode, and deltas between redundant
    sensors to classify normal vs. divergent states, alerting on high-confidence predictions and emitting
    the top-3 feature-importance values (redundant-sensor delta, mode mismatch, rate-of-change). Complement
    it with an unsupervised one-class SVM/DNN or autoencoder trained only on normal telemetry to flag
    spoofed flatlines that deviate from the learned manifold even when no labeled attack data exists.
    Keep the deterministic invariant checks running in parallel because ML detectors are evadable; the
    ML layer broadens coverage of subtle evasion that escapes hand-written rules. References: [Anomaly-based
    IDS with SVM and Random Forests, Duque Anton et al.](https://arxiv.org/abs/1907.10374); [Anomaly Detection
    for a Water Treatment System, Inoue et al.](https://arxiv.org/abs/1709.05342); [Adversarial Attacks
    on ICS Time-Series IDS](https://arxiv.org/abs/1911.04278).'
  answer_sources:
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - Windows Application Event Logs
  - Operational Historian Logs
  - Safety Instrumented System (SIS) Logs
  - 'NAI: SCADA servers, Process Historian servers, HMI workstations, Engineering Workstations, and network
    segments where ICS protocol traffic is captured (e.g., Level 2 Supervisory Control Network, Industrial
    Demilitarized Zone).'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'rf = RandomForest(features=[redundant_delta, device_mode, rate_of_change]);

      alert if rf.predict==divergent and confidence high; emit top3 importances;

      ocsvm/AE = train_on_normal_only(telemetry);

      alert if sample off learned manifold (e.g. spoofed flatline);

      run alongside deterministic invariant checks'
- question: Is any ICS reporting message arriving from a source IP or MAC address that does not match
    the authoritative OT asset inventory for that field device, or arriving on a VLAN/subnet not designated
    for process-control traffic?
  context: 'Maintain a SIEM watchlist of OT device IP/MAC mappings and their authorized VLAN/subnet, then
    alert when conn.log or protocol logs show a reporting source whose id.orig_h / id.resp_h does not
    match the registered device identity, or whose traffic appears on a non-process-control VLAN. A reporting
    message from an unexpected origin is a direct indicator of injected or relayed (spoofed) telemetry,
    supporting both the evasion goal (masking true state) and the broader spoofing of the field device''s
    identity. References: [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - OT Asset Inventory
  - 'NAI: Level 0 (Process Control) and Level 1 (Basic Control) network segments, Level 2 (Supervisory
    Control) network segments, Industrial Demilitarized Zone (IDMZ), and network gateways between IT and
    OT environments.'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Rule pseudocode
    query: "watchlist = {device: (ip, mac, vlan/subnet)};\nfor each report in [conn.log, dnp3.log, modbus.log,\
      \ iec61850.log]:\n  alert if id.orig_h/mac not in watchlist[device] or vlan not authorized_for_PCN"
- question: Does a reporting message that is protocol-valid nonetheless originate from an unauthorized
    speaker or carry out-of-scope addressing/function codes for the device it claims to be, per auto-generated
    semantic rules that bind each device to its expected protocol, function codes, and addressing?
  context: 'Spec-based detection binds each device to the precise protocol, function codes, and addressing
    it is allowed to use. Auto-generated semantic rules then flag a reporting message that is well-formed
    at the protocol level but comes from an unauthorized speaker or references addressing outside the
    device''s defined scope. This catches a more sophisticated spoofer who crafts valid-looking ICS frames;
    deterministic spec-binding makes such evasion attempts explicit rather than relying on statistical
    deviation. References: [Distributed IDS Semantic Rules](https://arxiv.org/abs/2412.07917).'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - OT Asset Inventory
  - 'NAI: Level 0 (Process Control) and Level 1 (Basic Control) network segments, Level 2 (Supervisory
    Control) network segments, Industrial Demilitarized Zone (IDMZ), and network gateways between IT and
    OT environments.'
  range: Last 90 days
  queries:
  - technology: Zeek/Semantic-rule pseudocode
    query: "spec[device] = {protocol, allowed_function_codes, allowed_addresses, allowed_speakers};\n\
      for each report: if protocol_valid but speaker not in spec.allowed_speakers\n  or address out of\
      \ spec.allowed_addresses or fc out of spec.allowed_function_codes: alert"
- question: Does the byte-volume profile of a device's reporting flow (orig_bytes, resp_bytes, and their
    ratio) deviate by more than three standard deviations from its 60-day baseline, suggesting spoofed
    or relayed telemetry?
  context: 'Genuine reporting flows for a given device have a stable byte volume and request/response
    ratio. Baseline orig_bytes, resp_bytes, and their ratio over a 60-day window and alert when a new
    connection deviates by more than three standard deviations. A relay or spoofing proxy frequently changes
    the size or ratio of the telemetry exchange, so a volume outlier can reveal an injected or relayed
    reporting source even when addressing appears legitimate. References: [Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - OT Asset Inventory
  - 'NAI: Level 0 (Process Control) and Level 1 (Basic Control) network segments, Level 2 (Supervisory
    Control) network segments, Industrial Demilitarized Zone (IDMZ), and network gateways between IT and
    OT environments.'
  range: Last 90 days; baseline byte volume over a rolling 60-day window.
  queries:
  - technology: Zeek/SIEM Stats pseudocode
    query: 'baseline[device] = mean,std of (orig_bytes, resp_bytes, ratio) over 60d;

      for new conn: alert if any metric > mean + 3*std or < mean - 3*std'
- question: Has the per-device rate of rejected or half-open reporting flows (conn_state S0, REJ, or RSTO)
    risen to a statistically significant level above its baseline, which often accompanies spoofed-source
    injection or relayed sessions?
  context: 'Profile connection failure/error rate as a signal in its own right. Baseline the per-device
    rate of rejected or half-open reporting flows (conn_state S0, REJ, RSTO) and alert on a statistically
    significant increase. Spoofed-source injection and session relaying frequently generate a burst of
    failed or half-open connections as the attacker probes or competes with the legitimate device, so
    a rise in failure rate is a useful corroborating indicator of telemetry spoofing. References: [Zeek
    conn.log](https://docs.zeek.org/en/master/logs/conn.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - OT Asset Inventory
  - 'NAI: Level 0 (Process Control) and Level 1 (Basic Control) network segments, Level 2 (Supervisory
    Control) network segments, Industrial Demilitarized Zone (IDMZ), and network gateways between IT and
    OT environments.'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM Stats pseudocode
    query: 'fail_rate[device] = count(conn_state in (S0,REJ,RSTO)) / total_flows, per window;

      baseline = historical fail_rate distribution;

      alert if current fail_rate significantly > baseline (e.g. z>3 or poisson test)'
- question: Does an Isolation Forest over per-device flow features (byte ratio, duration, destination-port
    diversity, protocol frequency, failure-state rate) produce a high anomaly score indicating an unusual
    reporting source or path?
  context: 'Train an Isolation Forest per device on flow features such as byte ratio, duration, destination-port
    diversity, protocol frequency, and failure-state rate, and alert on high anomaly scores that signal
    an unusual reporting source or path, listing the top-3 contributing features in the alert. Select
    scoring and thresholds per the CPS anomaly-detection taxonomy. This unsupervised model catches spoofed
    or relayed telemetry whose multivariate flow signature differs from the device''s norm even when no
    single feature is individually out of bounds, broadening evasion coverage beyond the deterministic
    and single-metric statistical checks. References: [Anomaly-based IDS with SVM and Random Forests,
    Duque Anton et al.](https://arxiv.org/abs/1907.10374); [Luo et al.](https://arxiv.org/abs/2003.13213).'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek iec61850.log
  - OT Asset Inventory
  - 'NAI: Level 0 (Process Control) and Level 1 (Basic Control) network segments, Level 2 (Supervisory
    Control) network segments, Industrial Demilitarized Zone (IDMZ), and network gateways between IT and
    OT environments.'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'iforest[device] = IsolationForest(features=[byte_ratio, duration, dport_diversity, proto_freq,
      fail_rate]);

      score = iforest.anomaly_score(flow);

      alert if score > threshold; emit top3 contributing features'
