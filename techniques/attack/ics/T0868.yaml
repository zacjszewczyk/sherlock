name: 'T0868: Detect Operating Mode'
id: 718f9983-eba2-42d8-8ce1-c142767a3c9b
description: Investigate whether an adversary is attempting to determine the operating mode (e.g., Program,
  Run, Remote, Stop, Reset, Test/Monitor) of PLCs or controllers in the ICS/OT environment. Knowledge
  of a controller's operating mode tells an adversary whether the device can be reprogrammed (Program
  Upload/Download) and is a precursor to disruptive manipulation. This playbook helps an analyst hunt
  for ICS protocol queries that READ a device's operating mode (e.g., Modbus FC17 Report Server ID, S7COMM
  Read SZL, ENIP Get_Attribute_Single, DNP3 read) originating from hosts that are not authorized Engineering
  Workstations (EWS) or OT-management servers, as well as authorized-but-compromised hosts that exhibit
  anomalous volume, frequency, fan-out, timing/periodicity, or failure/exception rates of mode reads.
  It also correlates anomalous remote logons to EWS endpoints (Windows Event ID 4624 Logon Type 10) with
  subsequent operating-mode queries against PLCs, combining deterministic allow-list/invariant rules,
  statistical baselining (percentile, CUSUM, periodicity), and machine-learning anomaly detection run
  in parallel.
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are ICS protocol queries that READ a PLC's operating mode (Modbus FC17 Report Server ID, S7COMM
    Read SZL, ENIP Get_Attribute_Single on a Key Switch/controller object, DNP3 read) originating from
    any source IP that is NOT on the authorized Engineering Workstation (EWS) / OT-management allowlist?
  context: Under the Collection tactic, an adversary reads a controller's operating mode to learn whether
    it can be reprogrammed (Program Upload/Download is only possible in certain modes). Per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    protocol allow-listing and EWS access control, only a small set of authorized EWS and OT-management
    servers should ever issue mode-read functions. A mode-read function/object whose id.orig_h is absent
    from that maintained allowlist is a high-fidelity indicator of unauthorized reconnaissance. Encode
    read-vs-write/diagnostic intent semantically using BZAR-style first-party rules ([BZAR](https://github.com/mitre-attack/bzar))
    and semantic-based SCADA rules ([Distributed IDS using Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917))
    so legitimate writes are not confused with reads. On a positive result, correlate the source IP with
    Windows Event ID 4688 on the source host (if an EWS) for suspicious process execution (plcscan.py,
    nmap.exe, vendor engineering tools) within a 15-minute window. A negative result means every mode
    read came from a sanctioned host.
  answer_sources: &id001
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek enip.log
  - Zeek dnp3.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Network sensors (TAPs/SPANs) at the IT/OT boundary, within the Process Control Network (PCN),
    and in Cell/Area zones. Log aggregators for Engineering Workstations (EWS), SCADA servers, and data
    historians.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LET mode_read = (modbus.func==17) OR (s7comm.func=="ReadSZL") OR (enip.service=="Get_Attribute_Single"
      AND enip.class IN keyswitch_objs) OR (dnp3.func=="read")

      FROM modbus.log,s7comm.log,enip.log,dnp3.log WHERE mode_read AND id.orig_h NOT IN authorized_EWS_OT_allowlist

      EMIT alert(src=id.orig_h, dst=id.resp_h, proto, func)'
  - technology: SIEM/Rule pseudocode
    query: 'JOIN mode_read_alert s ON s.src = p.host (WinEventID=4688) WITHIN 15m

      WHERE p.process IN {plcscan.py, nmap.exe, vendor_eng_tools}

      RAISE high_severity'
- question: Has any host used a protocol method to read operating mode that it has NEVER used before,
    or queried operating mode across multiple vendor protocol types within a short window (first-seen
    / cross-vendor enumeration)?
  context: Maintain a per-vendor allowlist of the normal protocol functions used to read operating mode
    (Modbus FC17, S7COMM Read SZL, ENIP Get_Attribute_Single, DNP3 read). A host that suddenly uses a
    mode-read method it has never used before, or that probes mode across multiple vendor protocol types
    within a 10-minute window, is behaving like an enumeration tool rather than a normal engineering client,
    as in [On Specification-based Cyber-Attack Detection in Smart Grids](https://arxiv.org/abs/2209.04354).
    Express the normal behavior as a mined invariant (e.g., 'mode reads originate only from the EWS subnet
    during maintenance windows') per [A Systematic Framework to Generate Invariants](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf)
    so the alert can name the violated predicate for explainability. A positive result indicates specification-based
    deviation worth investigating; a negative result means all mode reads matched known per-host/per-vendor
    methods.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FOR each (host, mode_read_method): IF method NOT IN host_method_history[host] THEN EMIT first_seen_method(host,
      method)

      WINDOW 10m: IF COUNT(DISTINCT vendor_proto WHERE mode_read AND src=host) > 1 THEN EMIT cross_vendor_mode_enum(host)

      ANNOTATE violated_invariant="mode reads only from EWS subnet in maintenance window"'
- question: Is any source generating an anomalous rate of FAILED or EXCEPTION operating-mode reads (rejected/aborted
    reads, Modbus illegal-function/illegal-data-address exceptions, OT-firewall blocked connections) consistent
    with blind enumeration?
  context: Failure-mode signals are a distinct, high-value counter. An adversary blindly enumerating unsupported
    functions or non-existent devices produces a burst of rejected/aborted reads, protocol exception codes
    (e.g., Modbus 'illegal function' / 'illegal data address'), and OT-firewall blocks. Profile failed
    reads per source and alert when the per-source failed-read count or failed:success ratio exceeds the
    99th percentile of a 30-day rolling baseline, tuned to the site's normal scan/poll error rate. This
    follows the residual/anomaly accounting in [Anomaly-based IDS with SVM and Random Forests](https://arxiv.org/abs/1907.10374).
    A positive result is a strong signal of probing; a negative result means failure rates are within
    normal operational noise.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'PER src over 30d: fail = COUNT(mode_read WHERE exception OR aborted OR fw_blocked); succ =
      COUNT(mode_read WHERE ok)

      ratio = fail/(succ+1); baseline_p99 = pctl(historical_per_src_fail, 99)

      ALERT IF fail > baseline_p99 OR ratio > pctl(historical_ratio,99)'
- question: Has any source IP exceeded its own historical baseline for the number of DISTINCT PLCs queried
    for operating mode, or for mode-read volume per 5-minute window (distinct-PLC / volume spike)?
  context: A compromised-but-authorized host (e.g., a legitimate EWS taken over by an adversary) will
    fan out across many controllers it does not normally touch. For each source IP compute a 30-day rolling
    baseline of (a) distinct destination PLCs queried for operating mode and (b) mode-read count per 5-minute
    window (Volume/Frequency metrics). Alert when a source exceeds the 99th percentile of its own history,
    and treat previously-unseen source->PLC mode-query edges as new-edge anomalies via the entity-volume
    profiling in the [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518). Deriving thresholds
    from each source's own distribution rather than a global constant avoids alert fatigue. A positive
    result surfaces anomalous enumeration; a negative result means fan-out and volume are consistent with
    normal polling.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'PER src, 5m window: vol = COUNT(mode_read); distinct_plc = COUNT(DISTINCT id.resp_h WHERE
      mode_read)

      baseline = rolling_30d_per_src; ALERT IF vol > pctl(baseline.vol,99) OR distinct_plc > pctl(baseline.distinct_plc,99)

      ALERT IF (src->plc) edge NOT IN known_edges[src]  // new-edge anomaly'
- question: Is there low-and-slow operating-mode enumeration that stays under any single fixed threshold
    but accumulates a statistically significant deviation over time (CUSUM)?
  context: A patient adversary spreads mode reads thinly to evade fixed-rate thresholds. A stateful cumulative-sum
    (CUSUM) test over the per-source (or per source-destination pair) mode-read rate accumulates small
    deviations from the learned mean and fires when the accumulated drift crosses a calibrated bound,
    per [Limiting the Impact of Stealthy Attacks on ICS](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf).
    This catches stealthy enumeration that volume/frequency percentile rules miss. Tune the slack/threshold
    to a target false-alarm rate. A positive result indicates sustained, deliberate enumeration; a negative
    result means no persistent upward drift in mode-read activity.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'PER src (or src,dst): mu = learned_mean(mode_read_rate); S = max(0, S_prev + (rate - mu -
      slack_k))

      ALERT IF S > CUSUM_threshold_h  // calibrate k,h to target FAR

      RESET S=0 after alert'
- question: Are operating-mode reads arriving with aperiodic, off-phase, or abnormal inter-arrival timing
    inconsistent with the normally periodic machine-to-machine EWS/SCADA-to-PLC polling (interactive human-driven
    reconnaissance)?
  context: Legitimate EWS/SCADA-to-PLC polling is highly periodic and machine-driven. Model that periodicity
    with a deterministic finite automaton and phase tracking as in [Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068),
    then alert on aperiodic, off-phase, or extra mode-read messages and abnormal inter-arrival timing
    characteristic of interactive, human-driven reconnaissance. This distinguishes a person manually probing
    modes from scheduled polling. A positive result (off-phase/aperiodic mode reads) suggests hands-on-keyboard
    activity; a negative result means timing matches the established polling cadence.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'BUILD DFA of expected poll phase/period per (src,dst) from history

      FOR each mode_read: compute phase_error, inter_arrival_delta

      ALERT IF aperiodic OR phase_error > tol OR extra_message_outside_schedule'
- question: Does a time-series forecasting model (ARIMA/LSTM/1D-CNN) of operating-mode read frequency
    and timing per source-destination pair show residuals exceeding the calibrated threshold?
  context: As an ML layer run IN PARALLEL with (never replacing) the deterministic allowlist and invariant
    rules, train a time-series/forecasting model (ARIMA, LSTM, or the lightweight 1D-CNN predict-then-threshold-residual
    approach of [Detecting Cyberattacks in ICS Using CNNs](https://arxiv.org/abs/1806.08110) and [Lightweight
    NN + PCA](https://arxiv.org/abs/1907.01216)) on >=90 days of Zeek ICS logs, modeling the frequency
    and timing of mode reads per source-destination pair, and alert when the prediction residual exceeds
    a calibrated threshold. Because LSTM ICS detectors are evadable via adversarial perturbation ([Adversarial
    Attacks on Time-Series IDS for ICS](https://arxiv.org/abs/1911.04278)), this must complement deterministic
    rules. The alert MUST surface the top-3 contributing features (e.g., source IP, destination PLC fan-out,
    off-baseline timing) using Random Forest feature-importance ([Anomaly-based IDS with SVM and Random
    Forests](https://arxiv.org/abs/1907.10374)); see the [Deep Learning CPS survey](https://arxiv.org/abs/2003.13213)
    for model selection and explainability caveats. A positive result flags an emerging anomaly for analyst
    review with explainable drivers; a negative result means observed mode-read behavior matches the forecast.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'TRAIN forecaster (ARIMA|LSTM|1D-CNN) on >=90d mode_read freq/timing per (src,dst)

      residual = |actual - predicted|; ALERT IF residual > calibrated_threshold

      EMIT top3_features (src_ip, dst_fanout, timing_offset)  // run parallel to rule layer'
- question: Did a successful REMOTE logon to an Engineering Workstation (Windows Event ID 4624, Logon
    Type 10) from a non-allowlisted/geofenced source get followed within 30 minutes by ICS operating-mode
    queries originating from that same EWS IP?
  context: This correlation links initial access to OT reconnaissance. Per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    EWS access-control guidance, a successful remote interactive logon (Event ID 4624, Logon Type 10)
    to an EWS from a source IP not on a geofenced/IP allowlist, followed within 30 minutes by Zeek-observed
    ICS operating-mode read queries from that EWS's IP, strongly suggests an adversary logged in remotely
    and immediately began profiling controller modes. Match the read functions semantically as in [Distributed
    IDS using Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917). A positive result is
    a high-priority chain to investigate; a negative result means remote logons were not followed by mode
    queries (or came from allowlisted sources).
  answer_sources: &id002
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Zeek enip.log
  - Windows Event ID 4688
  - 'NAI: Log sources on Engineering Workstation (EWS) endpoints, Active Directory Domain Controllers,
    and remote access infrastructure (VPN concentrators, jump boxes). Network traffic sensors at the IT/OT
    boundary and monitoring EWS subnets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'A = WinEventID 4624 WHERE LogonType=10 AND src_ip NOT IN geofence_allowlist (host=EWS)

      B = Zeek mode_read WHERE id.orig_h = EWS.ip

      ALERT IF A THEN B WITHIN 30m  (correlate on EWS host/ip)'
- question: Did an RDP session to an EWS originate from a source that is NOT on the approved jump-host
    / VPN-ingress allowlist and then lead to operating-mode queries within 30 minutes (jump-host policy
    violation)?
  context: EWS remote access should only traverse approved jump hosts and VPN ingress IPs. Maintain that
    allowlist and alert when an RDP session to an EWS (Zeek rdp.log or Windows Event ID 4624 Logon Type
    10) originates from any non-approved source and is followed by operating-mode queries within 30 minutes.
    Express the constraint as a mined invariant ('EWS reached only via approved jump hosts') per [A Systematic
    Framework to Generate Invariants](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf)
    so the alert names the violated rule. This catches adversaries bypassing the sanctioned access path.
    A positive result indicates a policy-violating access path immediately preceding OT reconnaissance;
    a negative result means all EWS RDP access came through approved jump hosts.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'rdp_in = Zeek rdp.log OR WinEventID 4624 LogonType=10 (dst=EWS)

      ALERT IF rdp_in.src NOT IN approved_jump_hosts_vpn AND EXISTS mode_read FROM EWS WITHIN 30m

      ANNOTATE violated_invariant="EWS reached only via approved jump hosts"'
- question: Did a burst of FAILED remote logons (Windows Event ID 4625) precede a successful Type-10 logon
    to an EWS that was then followed within 30 minutes by ICS mode queries (brute-force/spray-then-access)?
  context: Authentication failure rate is a distinct precursor signal. Baseline per-account/per-host failed
    remote-logon counts (Event ID 4625) and alert when a burst of failures (e.g., >5 in 10 minutes, tuned
    to site baseline) precedes a successful Type-10 logon that is then followed within 30 minutes by ICS
    mode queries from that EWS — the classic brute-force/spray-then-access-then-recon pattern. Use the
    same statistical accounting of anomalous volume as in [Limiting the Impact of Stealthy Attacks on
    ICS](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf) to set the burst threshold. A positive
    result chains credential attack to OT reconnaissance; a negative result means successful logons were
    not preceded by failure bursts.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = COUNT(WinEventID 4625) PER (account|host) 10m window; burst IF fails > max(5, site_baseline)

      ALERT IF burst THEN success(WinEventID 4624 LogonType=10) THEN mode_read FROM EWS WITHIN 30m'
- question: Does a new remote logon to an EWS score as anomalous on logon attributes (hour-of-day, source
    ISP, source country, session duration), especially when followed within 30 minutes by an ICS mode
    query?
  context: For each user, baseline remote-logon attributes (hour-of-day, source ISP, source country, session
    duration) and compute an anomaly score from attribute rarity (z-score/percentile) for each new logon,
    modeling previously-unseen source->EWS edges as new-edge anomalies per the [Unified Host and Network
    Data Set](https://arxiv.org/abs/1708.07518). Raise a low-priority alert above the 95th percentile,
    and escalate to high priority if the logon is followed within 30 minutes by an ICS mode query from
    the same EWS. This surfaces logons that are statistically unusual for a given user even if individually
    permitted. A positive escalated result is a strong recon precursor; a negative result means logon
    attributes are typical for the user.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'PER user: baseline {hour, isp, country, duration}; score = rarity_zscore(new_logon)

      ALERT low IF score > pctl95 OR (src->EWS) edge new

      ESCALATE high IF mode_read FROM same EWS WITHIN 30m'
- question: Does a UEBA clustering model (e.g., DBSCAN) flag an EWS remote-logon session as an outlier/noise
    point, and is that outlier session followed within 30 minutes by ICS mode queries from the same EWS?
  context: Run a UEBA clustering model (e.g., DBSCAN) on EWS remote-logon events (Windows Event ID 4624,
    Zeek rdp.log) with features source IP, user, time, and session duration, flagging noise-point (outlier)
    sessions. Create a high-severity correlated alert when a noise session is followed within 30 minutes
    by network traffic from that EWS IP containing ICS mode queries. The alert MUST list the top-3 features
    driving the outlier classification for triage (per the explainability emphasis of the [Deep Learning
    CPS survey](https://arxiv.org/abs/2003.13213)). Run this IN PARALLEL with the deterministic jump-host/geofence
    rules, since ML detectors are evadable ([Adversarial Attacks on Time-Series IDS for ICS](https://arxiv.org/abs/1911.04278)).
    A positive result is a high-severity recon chain with explainable drivers; a negative result means
    no outlier logons preceded mode queries.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'DBSCAN(features={src_ip,user,time,session_duration}) on EWS logons (4624, rdp.log)

      IF session classified as noise/outlier AND mode_read FROM same EWS WITHIN 30m THEN ALERT high

      EMIT top3_features  // run parallel to deterministic geofence/jump-host rules'
