name: 'T0861: Point & Tag Identification'
id: d9cf9e7a-cb10-4942-992f-641dc1307715
description: 'This playbook helps an analyst investigate whether an adversary is collecting point and
  tag values to map an industrial control process (MITRE ATT&CK for ICS T0861, Point & Tag Identification).
  Points are process variables such as inputs, outputs, memory locations, and setpoints; tags are the
  human-readable identifiers operators assign to those points. By harvesting tags an adversary builds
  a semantic map of the process -- what each value means and how inputs, outputs, and intermediate values
  relate -- which informs target selection and later manipulation of the physical process. The hunt pursues
  this behavior from three complementary collection vectors: (1) anomalous ICS protocol read activity
  on the process-control network (Modbus, DNP3, EtherNet/IP, OPC-UA) such as new or non-allow-listed hosts
  issuing read functions, statistically significant spikes in read volume, frequency, or unique point/register
  addresses contacted, read functions or addresses that violate protocol-semantic or process-invariant
  profiles, and bursts of illegal-address exception responses that fingerprint sequential point/tag scanning;
  (2) anomalous read access to ICS project files (.ACD, .L5K, .L5X, .S7P) and tag-export files (.CSV,
  .XML) on Engineering Workstations, project repositories, and file servers by unauthorized users, scripting/CLI
  utilities, or by authorized users exceeding their access baseline; and (3) suspicious activity against
  the Process Data Historian, including connections from new or unauthorized clients, brute-force-then-success
  logon sequences, and anomalously large historian-to-client data transfers consistent with bulk tag-database
  export. Detection methods combine deterministic symbolic-logic rules (host allowlists, protocol-semantic
  and function-code validation, SACL-audited file-access allowlists, illegal-address/failed-logon failure-mode
  detection, brute-force-then-success correlation), statistical baselining (per-host/per-user rolling
  percentile thresholds on volume, frequency, and unique destinations, CUSUM cumulative-sum tests for
  low-and-slow enumeration, change-point detection, periodic-polling/timing models, and Matrix Profile
  discord detection), and machine learning (Isolation Forest, KitNET autoencoder ensembles, one-class
  SVM/DNN normal-behavior models, UEBA, and DeepLog-style LSTM sequence modeling with SHAP-style feature
  attribution), applied across Zeek ICS protocol and conn logs and Windows object-access, process-creation,
  and logon events, so the analyst can corroborate suspected point-and-tag collection against host, user,
  protocol, and volume context.'
type: technique
related:
