      train per-host on >=30d normal: IsolationForest + KitNET autoencoder ensemble

      score streaming traffic; if score > host_p95: alert(MEDIUM)

      attach SHAP top-3 features (unique_addr, read_rate, resp_bytes)

      # runs in parallel with allowlist/semantic floor, never replaces it'
- question: '[Collection] Alert on unauthorized reads of ICS project files: Can you determine whether
    anomalous read access to sensitive ICS project files (e.g., .ACD, .L5K) or tag export files (e.g.,
    .CSV, .XML) on Engineering Workstations or file servers. This is evidenced by access from an unauthorized
    user or process, or by an authorized user accessing an unusually high volume of files compared to
    their individual baseline. -- specifically, using the ''Alert on unauthorized reads of ICS project
    files'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary collects point and tag
    values to build a semantic map of the ICS process so they can identify which inputs, outputs, and
    variables to track or manipulate during an operation. This evidence focuses on: Anomalous read access
    to sensitive ICS project files (e.g., .ACD, .L5K) or tag export files (e.g., .CSV, .XML) on Engineering
    Workstations or file servers. This is evidenced by access from an unauthorized user or process, or
    by an authorized user accessing an unusually high volume of files compared to their individual baseline.
    The ''Alert on unauthorized reads of ICS project files'' approach (Symbolic Logic) works as follows:
    Enable SACLs on directories holding ICS project and tag-export files to generate Windows Event ID
    4663 for read access (AccessMask 0x1), per least-privilege guidance in [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    and [CISA Defense-in-Depth](https://www.cisa.gov/sites/default/files/recommended_practices/NCCIC_ICS-CERT_Defense_in_Depth_2016_S508C.pdf).
    Maintain an allowlist of authorized accounts and parent processes (e.g., Studio5000.exe, TIA Portal).
    Trigger a high-priority alert when 4663 is logged for a monitored file type (.ACD,.L5K,.L5X,.CSV,.XML,.S7P,.APB)
    and the SubjectUserName or ProcessName is off-allowlist, especially scripting/CLI utilities (powershell.exe,
    cscript.exe, cmd.exe, robocopy.exe). FAILURE-MODE: separately alert on bursts of access-denied reads
    (Event ID 4656/4663 with failure status) that signal probing for readable project/tag stores. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable point-and-tag collection;
    pivot to the responsible host or account, the source IP and network segment (Purdue level), the ICS
    protocol or file/historian asset touched, the specific points/registers/tags or project files accessed,
    and the volume and timing of the activity to scope what process knowledge may have been exposed. A
    negative result helps rule out this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: File system and object access audit logs on Engineering Workstations (EWS), project file repositories,
    and version control servers, typically located in Purdue Model Level 3 or 2; Central file servers
    in the business network (Level 4) that store backups of ICS project files; Document management systems
    where tag databases might be stored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=wineventlog EventCode=4663 AccessMask=0x1\n  ObjectName IN (*.ACD,*.L5K,*.L5X,*.CSV,*.XML,*.S7P,*.APB)\n\
      | lookup proj_file_allowlist SubjectUserName ProcessName OUTPUT authorized\n| where isnull(authorized)\
      \ OR ProcessName IN (powershell.exe,cscript.exe,cmd.exe,robocopy.exe)\n| eval severity=\"HIGH\"\n\
      # FAILURE-MODE: alert on bursts of 4656/4663 failure-status (access-denied) reads"
  - technology: Windows/pseudocode
    query: "enable SACL audit READ on ICS project/tag-export dirs\non EventID 4663 (read) for monitored\
      \ filetype:\n  if SubjectUserName OR ProcessName off-allowlist: alert(HIGH)"
