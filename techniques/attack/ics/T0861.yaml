      \ -> discords\nif extra_poll OR out_of_phase_burst OR jitter > learned_bound:\n  alert(MEDIUM, 'injected/irregular\
      \ read poll', src)"
- question: '[Collection] Anomaly detection for ICS tag reads with feature attribution: Can you determine
    whether anomalous ICS protocol read activity on the process-control network, characterized by: 1)
    a host using an ICS protocol (Modbus, DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2)
    an authorized host exhibiting a statistically significant increase in read-request volume/frequency
    or the number of unique endpoints or unique register/point addresses contacted versus its baseline;
    3) read functions/addresses violating protocol-semantic or process-invariant profiles; or 4) a spike
    in protocol exception/illegal-address responses indicating sequential point/tag scanning. -- specifically,
    using the ''Anomaly detection for ICS tag reads with feature attribution'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary collects point and tag
    values to build a semantic map of the ICS process so they can identify which inputs, outputs, and
    variables to track or manipulate during an operation. This evidence focuses on: Anomalous ICS protocol
    read activity on the process-control network, characterized by: 1) a host using an ICS protocol (Modbus,
    DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2) an authorized host exhibiting a statistically
    significant increase in read-request volume/frequency or the number of unique endpoints or unique
    register/point addresses contacted versus its baseline; 3) read functions/addresses violating protocol-semantic
    or process-invariant profiles; or 4) a spike in protocol exception/illegal-address responses indicating
    sequential point/tag scanning. The ''Anomaly detection for ICS tag reads with feature attribution''
    approach (Machine Learning) works as follows: Train per-host unsupervised models on >=30 days of normal
    Zeek features (hourly ICS packet counts, unique destination IPs, unique point/register addresses,
    read/write function-code ratios, response bytes). Use an Isolation Forest plus an online autoencoder
    ensemble (KitNET) over streaming bandwidth/packet-rate/jitter features for label-free scoring ([Mirsky
    et al.](https://arxiv.org/abs/1802.09089), [code](https://github.com/ymirsky/Kitsune-py)); a one-class
    SVM/DNN normal-behavior model is an alternative ([Inoue et al.](https://arxiv.org/abs/1709.05342)).
    Alert (medium) when the anomaly score exceeds the host''s 95th historical percentile. EXPLAINABILITY:
    attach SHAP/feature-importance attribution so each alert names the top-3 contributing features (e.g.,
    unique-address count, read-rate, response bytes) ([Ha et al.](https://arxiv.org/abs/2205.01930); [Duque
    Anton et al.](https://arxiv.org/abs/1907.10374)). Run in parallel with the deterministic allowlist/semantic
    floor; never replace it. A positive result -- a rule match, statistical outlier, or model alert --
    indicates probable point-and-tag collection; pivot to the responsible host or account, the source
    IP and network segment (Purdue level), the ICS protocol or file/historian asset touched, the specific
    points/registers/tags or project files accessed, and the volume and timing of the activity to scope
    what process knowledge may have been exposed. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land enumeration.'
