questions:
- question: '[Collection] Alert on non-allow-listed ICS protocol sources: Can you determine whether anomalous
    ICS protocol read activity on the process-control network, characterized by: 1) a host using an ICS
    protocol (Modbus, DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2) an authorized host
    exhibiting a statistically significant increase in read-request volume/frequency or the number of
    unique endpoints or unique register/point addresses contacted versus its baseline; 3) read functions/addresses
    violating protocol-semantic or process-invariant profiles; or 4) a spike in protocol exception/illegal-address
    responses indicating sequential point/tag scanning. -- specifically, using the ''Alert on non-allow-listed
    ICS protocol sources'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary collects point and tag
    values to build a semantic map of the ICS process so they can identify which inputs, outputs, and
    variables to track or manipulate during an operation. This evidence focuses on: Anomalous ICS protocol
    read activity on the process-control network, characterized by: 1) a host using an ICS protocol (Modbus,
    DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2) an authorized host exhibiting a statistically
    significant increase in read-request volume/frequency or the number of unique endpoints or unique
    register/point addresses contacted versus its baseline; 3) read functions/addresses violating protocol-semantic
    or process-invariant profiles; or 4) a spike in protocol exception/illegal-address responses indicating
    sequential point/tag scanning. The ''Alert on non-allow-listed ICS protocol sources'' approach (Symbolic
    Logic) works as follows: Maintain a static allowlist of authorized ICS host IPs (HMIs, EWS, historians)
    per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    and [CISA Defense-in-Depth](https://www.cisa.gov/sites/default/files/recommended_practices/NCCIC_ICS-CERT_Defense_in_Depth_2016_S508C.pdf).
    For all ICS protocol traffic (Modbus, DNP3, EtherNet/IP, OPC-UA) compare source IP (id.orig_h) against
    the allowlist and a dynamic 30-day baseline of known communicating IPs; generate a high-priority alert
    if a source is on neither list, especially when it issues read functions ([NSA/CISA AA20-205A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-205a)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable point-and-tag
    collection; pivot to the responsible host or account, the source IP and network segment (Purdue level),
    the ICS protocol or file/historian asset touched, the specific points/registers/tags or project files
    accessed, and the volume and timing of the activity to scope what process knowledge may have been
    exposed. A negative result helps rule out this particular vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    enumeration.'
  answer_sources:
  - Zeek modbus.log
  - Zeek ethernetip.log
  - Zeek dnp3.log
  - Zeek opcua.log
  - Zeek conn.log
  - 'NAI: Network segments corresponding to Purdue Model Levels 0, 1, and 2, specifically traffic between
    PLCs, RTUs, and HMIs; Network taps or SPAN ports on switches within the Process Control Network (PCN);
    Firewall and NIDS logs at the boundary between the IT network (Level 4/5) and the OT DMZ (Level 3.5)
    and between the DMZ and the PCN (Level 3).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "load modbus.log, dnp3.log, ethernetip.log, opcua.log\nallowlist = static_authorized_ics_hosts\
      \ UNION dynamic_baseline_30d(id.orig_h)\nfor rec where is_read_function(rec.func):\n  if rec.id.orig_h\
      \ NOT IN allowlist:\n    alert(HIGH, 'non-allowlisted ICS read source', rec.id.orig_h, rec.id.resp_h,\
      \ rec.func)"
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek (sourcetype=modbus OR sourcetype=dnp3 OR sourcetype=ethernetip OR sourcetype=opcua)

      | lookup ics_host_allowlist orig_h OUTPUT authorized

      | where isnull(authorized) AND func_is_read=1

      | eval severity="HIGH"'
- question: '[Collection] Validate ICS protocol semantics and read function codes: Can you determine whether
    anomalous ICS protocol read activity on the process-control network, characterized by: 1) a host using
    an ICS protocol (Modbus, DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2) an authorized
    host exhibiting a statistically significant increase in read-request volume/frequency or the number
    of unique endpoints or unique register/point addresses contacted versus its baseline; 3) read functions/addresses
    violating protocol-semantic or process-invariant profiles; or 4) a spike in protocol exception/illegal-address
    responses indicating sequential point/tag scanning. -- specifically, using the ''Validate ICS protocol
    semantics and read function codes'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary collects point and tag
    values to build a semantic map of the ICS process so they can identify which inputs, outputs, and
    variables to track or manipulate during an operation. This evidence focuses on: Anomalous ICS protocol
    read activity on the process-control network, characterized by: 1) a host using an ICS protocol (Modbus,
    DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2) an authorized host exhibiting a statistically
    significant increase in read-request volume/frequency or the number of unique endpoints or unique
    register/point addresses contacted versus its baseline; 3) read functions/addresses violating protocol-semantic
    or process-invariant profiles; or 4) a spike in protocol exception/illegal-address responses indicating
    sequential point/tag scanning. The ''Validate ICS protocol semantics and read function codes'' approach
    (Symbolic Logic) works as follows: Apply protocol-semantic rules per [Mohan et al.](https://arxiv.org/abs/2412.07917)
    and process invariants per [Feng et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf):
    for each source-destination pair maintain the allowed set of read function codes (Modbus FC 1/2/3/4,
    DNP3 g/v reads, EtherNet/IP Get_Attribute_All/Single, OPC-UA Read) and the valid register/point/address
    ranges. Generate a high-priority alert when a host issues read functions or addresses outside its
    established profile, or reads tag combinations that violate mined invariants (e.g., enumerating rarely-correlated
    points). FAILURE-MODE: separately count protocol exception/error responses (Modbus exception code
    02 ''illegal data address'', code 01 ''illegal function'', DNP3/OPC-UA status errors) per source;
    a spike in illegal-address replies is a direct fingerprint of sequential point/tag scanning. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable point-and-tag collection;
    pivot to the responsible host or account, the source IP and network segment (Purdue level), the ICS
    protocol or file/historian asset touched, the specific points/registers/tags or project files accessed,
    and the volume and timing of the activity to scope what process knowledge may have been exposed. A
    negative result helps rule out this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Zeek modbus.log
  - Zeek ethernetip.log
  - Zeek dnp3.log
  - Zeek opcua.log
  - Zeek conn.log
  - 'NAI: Network segments corresponding to Purdue Model Levels 0, 1, and 2, specifically traffic between
    PLCs, RTUs, and HMIs; Network taps or SPAN ports on switches within the Process Control Network (PCN);
    Firewall and NIDS logs at the boundary between the IT network (Level 4/5) and the OT DMZ (Level 3.5)
    and between the DMZ and the PCN (Level 3).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "profile[src,dst] = allowed_read_funcs (Modbus FC1/2/3/4, DNP3 reads, EIP Get_Attribute, OPC-UA\
      \ Read)\n                  + valid_address_ranges\nfor rec in ics_read_logs:\n  if rec.func NOT\
      \ IN profile[src,dst].funcs OR rec.addr OUTSIDE profile[src,dst].ranges:\n    alert(HIGH, 'read\
      \ outside semantic profile', rec)\n# FAILURE-MODE\ncount exception responses per src (Modbus exc\
      \ 01/02, DNP3/OPC-UA status err)\nif illegal_address_replies[src] > baseline: alert(HIGH, 'sequential\
      \ point/tag scan', src)"
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek ics_read=1 | lookup semantic_profile src dst OUTPUT allowed_funcs allowed_ranges

      | where NOT match(func,allowed_funcs) OR NOT inrange(addr,allowed_ranges)

      | append [ search index=zeek exception_code IN (01,02) | stats count by src | where count>threshold
      ]'
- question: '[Collection] Baseline read request volume, frequency, and unique destinations: Can you determine
    whether anomalous ICS protocol read activity on the process-control network, characterized by: 1)
    a host using an ICS protocol (Modbus, DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2)
    an authorized host exhibiting a statistically significant increase in read-request volume/frequency
    or the number of unique endpoints or unique register/point addresses contacted versus its baseline;
    3) read functions/addresses violating protocol-semantic or process-invariant profiles; or 4) a spike
    in protocol exception/illegal-address responses indicating sequential point/tag scanning. -- specifically,
    using the ''Baseline read request volume, frequency, and unique destinations'' (Statistical Method)
    approach?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary collects point and tag
    values to build a semantic map of the ICS process so they can identify which inputs, outputs, and
    variables to track or manipulate during an operation. This evidence focuses on: Anomalous ICS protocol
    read activity on the process-control network, characterized by: 1) a host using an ICS protocol (Modbus,
    DNP3, EtherNet/IP, OPC-UA) for the first time in 30 days; 2) an authorized host exhibiting a statistically
    significant increase in read-request volume/frequency or the number of unique endpoints or unique
    register/point addresses contacted versus its baseline; 3) read functions/addresses violating protocol-semantic
    or process-invariant profiles; or 4) a spike in protocol exception/illegal-address responses indicating
    sequential point/tag scanning. The ''Baseline read request volume, frequency, and unique destinations''
    approach (Statistical Method) works as follows: For each authorized ICS host establish a 7-day rolling
    baseline of (A) read requests per minute (Frequency), (B) total bytes of read responses per hour (Volume),
    and (C) unique destination devices and unique register/point addresses contacted per hour. Compute
    the 99th percentile per metric and alert (medium) when current activity exceeds it. Layer a stateful
    CUSUM cumulative-sum test on the read-rate and unique-point series to catch low-and-slow enumeration
    that stays under the per-sample percentile ([Urbina et al.](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf)),
    and a change-point detector (PELT/Bayesian online) to flag the abrupt cadence shift at enumeration
    onset ([Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)). Derive thresholds
    per environment from at least 14 days of clean traffic. STATE: also baseline the per-source ratio
    of error/exception responses to successful reads and alert on departures. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable point-and-tag collection; pivot to
    the responsible host or account, the source IP and network segment (Purdue level), the ICS protocol
    or file/historian asset touched, the specific points/registers/tags or project files accessed, and
    the volume and timing of the activity to scope what process knowledge may have been exposed. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Zeek modbus.log
  - Zeek ethernetip.log
  - Zeek dnp3.log
  - Zeek opcua.log
  - Zeek conn.log
  - 'NAI: Network segments corresponding to Purdue Model Levels 0, 1, and 2, specifically traffic between
    PLCs, RTUs, and HMIs; Network taps or SPAN ports on switches within the Process Control Network (PCN);
    Firewall and NIDS logs at the boundary between the IT network (Level 4/5) and the OT DMZ (Level 3.5)
    and between the DMZ and the PCN (Level 3).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per src over 7d: reads_per_min, resp_bytes_per_hr, unique_dst, unique_addr

      p99 = percentile(metric,99)

      if current > p99: alert(MEDIUM)

      CUSUM(read_rate, unique_point_series) -> flag low-and-slow enumeration

      PELT/Bayesian_online_changepoint(cadence) -> flag enumeration onset

      baseline error_to_success_ratio per src; alert on departure'
- question: '[Collection] Model periodic polling timing for injected reads: Can you determine whether
