name: 'T1691: Block Operational Technology Message'
id: af1999db-e406-4db6-9514-7ac2673858e6
description: 'Investigate suspected blocking of Operational Technology (OT) messages in an ICS/SCADA environment,
  where reporting (telemetry) or command (control) messages fail to reach their intended destinations
  and thereby inhibit safety, protection, and operator-response functions. This playbook helps an analyst
  determine whether an adversary has severed or selectively dropped critical OT communications by: detecting
  historian flatlines where field telemetry stops arriving even though devices remain powered and reachable;
  correlating PLC/RTU command timeout, no-response, and transaction-expired errors with failed control
  attempts at the HMI or engineering workstation; identifying sustained loss of specific OT protocol requests
  or responses on the network while adjacent traffic stays stable; and catching unexpected termination
  of critical automation services on SCADA servers and HMIs. It combines deterministic watchdog rules,
  statistical baselining of update intervals, protocol ratios, and failure rates, and machine-learning
  continuity/anomaly models to distinguish blocked communications from legitimate downtime, supporting
  timely response before a physical or safety impact occurs.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Have one or more high-priority process tags stopped updating in the historian or alarm server
    for longer than their normal scan interval while the source field devices are still reachable on the
    control network, with no planned outage or maintenance to explain the gap?
  context: An adversary blocking reporting messages produces a flatline in critical process tags and suppresses
    operator visibility even though the devices remain powered and otherwise reachable; the absence of
    expected telemetry is itself the indicator. Within the Inhibit Response Function tactic, this matters
    because loss of visibility can mask an unsafe state and prevent safety/protection responses. The analyst
    looks for tags that stop updating beyond the expected polling interval while Zeek/ICS parsers still
    show the device reachable, and correlates that gap with the lack of a planned outage, maintenance
    ticket, or device-offline alarm. A positive result (tag silent + device reachable + no maintenance)
    strongly suggests blocked reporting, matching the comms-severing pattern of the 2015 Ukraine attack;
    a negative result usually indicates legitimate downtime.
  answer_sources:
  - Operational Historian Logs
  - ICS Alarm Server Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Process Control Network (PCN), Data Historian Servers, Human-Machine Interface (HMI) stations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'for each high_priority_tag: if (now - last_update_time) > scan_interval AND device_reachable(zeek_ics)
      == true AND no planned_outage AND no maintenance_ticket AND no device_offline_alarm: alert("historian
      flatline, device reachable", tag, device)'
- question: For each critical sensor tag, does the recent update interval or expected-to-observed sample
    ratio deviate far enough from its established baseline (below the 1st percentile of normal continuity
    or beyond a 5-sigma inter-update gap) to indicate that reporting messages are being dropped, especially
    when multiple tags on the same PLC fail together?
  context: Highly regular OT signals have predictable update cadences, so statistically modeling each
    tag's update interval (rolling mean/standard deviation) and the expected-to-observed sample ratio
    over a 24-hour window exposes blocked reporting as a collapse in update continuity. This supports
    the Inhibit Response Function detection by quantifying when telemetry stops arriving rather than relying
    on a single threshold. The analyst derives per-tag thresholds from a clean 30-day baseline and flags
    tags below the 1st percentile of normal continuity or beyond a 5-sigma gap; simultaneous failure of
    multiple tags on one PLC raises confidence that a shared communications path was blocked. A positive
    result indicates abnormal loss of reporting; values within baseline argue against blocking.
  answer_sources:
  - Operational Historian Logs
  - ICS Alarm Server Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Process Control Network (PCN), Data Historian Servers, Human-Machine Interface (HMI) stations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_tag rolling mean/std of update_interval and expected/observed sample_ratio
      over clean 30d; window=24h: for tag: if continuity_ratio < p1(baseline) OR inter_update_gap > mean
      + 5*std: flag(tag); escalate if count(flagged tags on same PLC) > 1'
- question: Have any critical tag values become frozen or stale (the identical value repeated past N scan
    cycles) or shown forecast residuals that collapse to a flatline or spike, indicating a frozen/missing-signal
    fault distinct from ordinary noisy readings?
  context: Blocked reporting often manifests not as noise but as frozen/stale values or missing samples,
    which must be profiled as a distinct State failure. Applying a per-tag forecast-residual threshold
    and alerting when residuals collapse to a flatline (or spike) captures the frozen/missing-signal fault,
    and PCA on the residuals localizes which variables drove the anomaly for explainable triage. For the
    Inhibit Response Function tactic, distinguishing a held-last-value from a live reading is critical
    because a frozen tag can deceive operators into believing the process is healthy. A positive result
    is a tag stuck or residual flatline beyond expected cycles; a negative result shows normal value variation
    consistent with live reporting.
  answer_sources:
  - Operational Historian Logs
  - ICS Alarm Server Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Process Control Network (PCN), Data Historian Servers, Human-Machine Interface (HMI) stations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for tag: if value == previous_value for > N scan_cycles: flag("frozen/stale"); resid = forecast(tag)
      - observed; if resid collapses_to_flatline OR resid spikes beyond threshold: flag; run PCA(residuals)
      -> report top contributing tags'
- question: Does a multivariate model trained on normal tag values, update cadence, and device-to-historian
    flow predict continued normal reporting yet observe a sustained missing-data pattern or a collapse
    in reporting diversity, consistent with blocked OT messages?
  context: A temporal autoencoder/LSTM or 1D-CNN predictor trained only on normal telemetry can learn
    the joint behavior of many tags, their update cadence, and device-to-historian flow; scoring windows
    where it predicts normal continuity but observes sustained missing data or reduced reporting diversity
    surfaces blocked reporting that single-tag rules may miss. This unsupervised, predict-then-threshold-residual
    approach is validated on SWaT/WADI. Within Inhibit Response Function, it provides a higher-coverage
    detector that runs in parallel with the deterministic flatline watchdog. A positive result is a high
    reconstruction/prediction error driven by missing telemetry; surface the top-3 contributing tags so
    an analyst can verify the affected devices. A low score indicates normal reporting continuity.
  answer_sources:
  - Operational Historian Logs
  - ICS Alarm Server Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Process Control Network (PCN), Data Historian Servers, Human-Machine Interface (HMI) stations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = train LSTM/temporal_autoencoder/1D-CNN on normal {tag_values, update_cadence, device_to_historian_flow};
      for window: err = |predict(window) - observe(window)|; if err > residual_threshold AND pattern==sustained_missing_data:
      alert; report top-3 contributing tags; run alongside deterministic flatline watchdog'
- question: Do PLC or RTU diagnostics record command timeout, no-response, or transaction-expired errors
    at the same time and for the same device that an HMI or engineering workstation logs a failed control
    attempt, with the network showing a request/response mismatch or missing ACK?
  context: 'Blocked command messages appear as a three-way correlation: the operator action is recorded
    at the source (HMI/engineering workstation), the network shows a request/response mismatch or missing
    acknowledgment, and the controller records a timeout or no-response error for the same device and
    time window. This specification-based correlation of expected command/response behavior confirms that
    control instructions are not being delivered. For Inhibit Response Function, blocked commands prevent
    operators from intervening in a dangerous scenario. A positive result is all three signals aligning
    on one device/time window; if the controller acknowledges the command or no operator action exists,
    blocking is unlikely.'
  answer_sources:
  - PLC Diagnostic Logs
  - RTU Event Logs
  - HMI Application Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Level 1 ICS Controllers, Engineering Workstations, Distributed Control System (DCS) Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join hmi_command(device,ts) with zeek_ics(request,response,ack,device,ts) and plc_rtu_diag(error,device,ts)
      on device, time_window: if hmi_command present AND (response missing OR ack missing) AND diag.error
      in {timeout,no_response,transaction_expired}: alert(device, ts)'
- question: Has the per-device rate of command timeout, rejected-command, or transaction-expired errors
    exceeded the 99th percentile of its normal baseline for more than one scan cycle, or have multiple
    controllers in the same cell/area zone spiked together?
  context: Treating controller failure codes (timeout, rejected, transaction-expired) as a first-class
    signal and tracking their per-device rate against a rolling 30-day baseline reveals blocked command
    delivery as an abnormal spike in failures. The analyst alerts when a controller/RTU exceeds the 99th
    percentile of its normal failure rate for more than one scan cycle, and especially when several controllers
    in the same cell/area zone spike simultaneously, indicating a shared blocked path. For Inhibit Response
    Function this distinguishes a transient glitch from a sustained inability to command devices. A positive
    result is a sustained or correlated failure-rate spike; rates within baseline indicate normal control
    operations.
  answer_sources:
  - PLC Diagnostic Logs
  - RTU Event Logs
  - HMI Application Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Level 1 ICS Controllers, Engineering Workstations, Distributed Control System (DCS) Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_device rate of {timeout,rejected,transaction_expired} over 30d; if device.failure_rate
      > p99(baseline) for > 1 scan_cycle: flag(device); escalate if count(flagged devices in same cell/area
      zone) > 1'
- question: Does a sequence/classification model trained on HMI commands, PLC diagnostics, and ICS flow
    features predict a normal command-completion path but instead observe repeated failures or missing
    responses, consistent with blocked command messages?
  context: A classifier trained on HMI commands, PLC diagnostics, and ICS flow features (request/response
    timing, packet counts, function codes, error codes) can learn what a successful command-completion
    sequence looks like; flagging sequences where it expects completion but observes repeated failures
    or missing responses captures blocked commands beyond simple rate thresholds. SVM/Random Forest on
    OT flow features discriminate dropped/blocked traffic and expose top contributing features for explainable
    alerting. For Inhibit Response Function, this adds coverage for subtle or intermittent blocking. Keep
    the deterministic timeout correlation as the floor and report the top-3 features so analysts can validate
    the prediction; a normal-path prediction with completed commands indicates no blocking.
  answer_sources:
  - PLC Diagnostic Logs
  - RTU Event Logs
  - HMI Application Logs
  - Zeek modbus.log
  - Zeek dnp3.log
  - 'NAI: Level 1 ICS Controllers, Engineering Workstations, Distributed Control System (DCS) Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = train classifier(SVM/RandomForest) on {hmi_commands, plc_diag, flow_features: req/resp_timing,
      packet_counts, function_codes, error_codes}; for sequence: if predict==normal_completion BUT observe
      repeated_failures/missing_responses: alert; report top-3 features; floor = deterministic timeout
      correlation'
- question: On each monitored control-network link, has the request or response packet count for a critical
    OT protocol dropped below its allowlist-based minimum for more than one polling interval, or has one
    direction of the conversation disappeared while the rest of the segment remains active?
  context: 'Using Zeek ICS parsers to count request and response packets per critical OT protocol per
    link enforces an expected-protocol/expected-conduit allowlist model and detects selective blocking:
    the targeted protocol or one direction of its conversation falls silent while adjacent non-OT traffic
    stays stable. For Inhibit Response Function, this pinpoints where a command or reporting path is being
    severed at the network layer. A positive result is a protocol''s request or response count dropping
    below its allowlist minimum for more than one polling interval, or a one-directional disappearance;
    balanced, expected protocol counts across the link indicate normal operation.'
  answer_sources:
  - Zeek (ICS Parsers)
  - NetFlow/IPFIX
  - 'NAI: Network Taps at Level 1/2 boundaries, Core Switches in the Process Control Network.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'for each link, each critical_protocol: req=count(requests), resp=count(responses) per polling_interval:
      if req < allowlist_min OR resp < allowlist_min for > 1 interval: alert; if one_direction==0 while
      segment_total_traffic stable: alert("directional protocol loss", link, protocol)'
- question: Has the ratio of OT-protocol traffic to total traffic on a control-network path fallen below
    the 5th percentile of its 30-day baseline, or has the request-to-response ratio per link diverged
    beyond 3 standard deviations from its normal balance?
  context: Computing a rolling ratio of OT-protocol traffic to total traffic, and a request-to-response
    ratio per link, against a 30-day baseline (Volume + State) detects selective blocking even when overall
    link traffic looks busy. A protocol ratio below the 5th percentile or a request/response asymmetry
    beyond 3 standard deviations indicates that one protocol family or message direction is being suppressed.
    For Inhibit Response Function this catches partial blocking that absolute counts might miss. A positive
    result is a statistically significant drop in protocol share or growing request/response imbalance
    for a link; ratios within baseline suggest normal traffic mix.
  answer_sources:
  - Zeek (ICS Parsers)
  - NetFlow/IPFIX
  - 'NAI: Network Taps at Level 1/2 boundaries, Core Switches in the Process Control Network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline(30d) per link: ot_protocol/total ratio and request/response ratio; if ot_ratio <
      p5(baseline) OR |req_resp_ratio - mean| > 3*std: investigate(link)'
- question: Does an autoencoder/1D-CNN or PCA model trained on OT flow features reconstruct recent traffic
    windows poorly because a protocol family or message direction has gone missing, a strong indicator
    of blocked communications?
  context: Training an autoencoder/1D-CNN or PCA model on OT flow features (bytes, packets, duration,
    inter-arrival time, request/response balance) learns the normal shape of control-network traffic;
    windows reconstructed poorly because a protocol family or message direction disappeared are flagged
    as blocked communications. Frequency-domain PCA and lightweight CNN/autoencoder detection with variable-level
    localization provide explainability across SWaT/WADI/BATADAL. For Inhibit Response Function, this
    gives broad network-layer coverage for selective blocking. A positive result is a high reconstruction
    error driven by missing protocol/direction features; surface the top-3 contributing flow features.
    Low reconstruction error indicates normal flow composition.
  answer_sources:
  - Zeek (ICS Parsers)
  - NetFlow/IPFIX
  - 'NAI: Network Taps at Level 1/2 boundaries, Core Switches in the Process Control Network.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = train autoencoder/1D-CNN/PCA on OT flow_features{bytes,packets,duration,inter_arrival,req_resp_balance};
      for window: err = reconstruction_error(window); if err > threshold (missing protocol/direction):
      alert; report top-3 contributing flow features'
- question: Have any critical automation services (e.g., RSLinx, WinCC, Ignition) on SCADA servers or
    HMIs terminated unexpectedly per Windows Event ID 7034/7036 or Linux Syslog and failed to restart
    automatically within 60 seconds, correlating with a loss of process visibility?
  context: Adversaries can block OT message processing by terminating the automation services that move
    telemetry and commands. Monitoring system logs (Windows Event ID 7034/7036 or Linux Syslog) for unexpected
    termination of critical automation services and alerting when they stop and do not auto-restart within
    60 seconds detects this directly. For Inhibit Response Function, a downed historian/SCADA service
    silently halts reporting and command handling; KillDisk-driven service/host destruction to block OT
    messaging was central to the 2015 Ukraine attack. A positive result is a named automation service
    stopping with no restart within 60 seconds, especially alongside loss of process visibility; an immediate
    clean restart indicates a benign transient.
  answer_sources:
  - Windows Event ID 7034
  - Linux Syslog
  - Process Monitoring Logs
  - 'NAI: SCADA Servers, HMI Workstations, History Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'watch Windows EventID in {7034,7036} OR linux_syslog for service in {RSLinx,WinCC,Ignition,...critical_automation}:
      on stop: if no start within 60s: alert(service, host); correlate with loss_of_process_visibility'
- question: Across automation-related processes, does a service start/stop/restart transition matrix reveal
    a highly improbable state sequence, such as multiple core services stopping in parallel across different
    servers?
  context: Baselining the frequency of service starts, stops, and restarts for all automation processes
    and modeling them as a transition matrix lets the analyst flag improbable sequences, most importantly
    multiple core services stopping in parallel across different servers (correlated State-failure Volume).
    Failed-restart events are profiled as a distinct signal. For Inhibit Response Function, coordinated
    parallel service termination is a hallmark of a deliberate effort to block OT messaging rather than
    a random crash. A positive result is a low-probability transition such as simultaneous multi-server
    service stops or repeated failed restarts; normal start/stop cadence indicates routine operations.
  answer_sources:
  - Windows Event ID 7034
  - Linux Syslog
  - Process Monitoring Logs
  - 'NAI: SCADA Servers, HMI Workstations, History Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline transition_matrix of {start,stop,restart} per automation_service; for observed sequence:
      p = matrix_probability(sequence); if p < improbable_threshold OR (multiple core services stop in
      parallel across servers): alert; flag failed_restart events'
- question: Does an ensemble model trained on system-health telemetry (CPU/memory, open file handles,
    service states) predict a high likelihood of a coordinated service-level denial-of-service intended
    to block OT message processing?
  context: Training an ensemble (Random Forest, SVM) on system-health telemetry (CPU/memory, open file
    handles, service states) lets the analyst predict the likelihood of a coordinated service-level DoS
    aimed at blocking OT message processing, with feature-importance output for explainable, top-feature
    alerting. For Inhibit Response Function, this catches resource-exhaustion or orchestrated kill patterns
    that precede or accompany service termination. Keep the deterministic 60-second restart rule as the
    floor and report the top-3 contributing health features so analysts can validate. A positive result
    is a high predicted likelihood of coordinated service DoS; healthy, stable telemetry indicates normal
    host operation.
  answer_sources:
  - Windows Event ID 7034
  - Linux Syslog
  - Process Monitoring Logs
  - 'NAI: SCADA Servers, HMI Workstations, History Servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = train ensemble(RandomForest,SVM) on system_health{cpu,memory,open_file_handles,service_states};
      score = P(coordinated_service_DoS); if score > threshold: alert; report top-3 health features; floor
      = deterministic 60s restart rule'
