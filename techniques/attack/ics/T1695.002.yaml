name: 'T1695.002: Ethernet'
id: 491ad383-286e-4e2b-b59d-558939808486
description: Investigate whether an adversary has blocked Ethernet communications on an OT segment to
  prevent control instructions, configuration messages, or reporting traffic from reaching target PLCs,
  RTUs, HMIs, and historians (an Inhibit Response Function objective). This playbook helps an analyst
  hunt for loss or suppression of expected wired control traffic caused by disabled network interfaces,
  Service Stop (T0881), dropped frames, or an Adversary-in-the-Middle device placed in-path (T0830). Look
  for repeated communication-failure alarms, missing request/response pairs, flatlined or frozen process
  values, link-down or port-disabled switch events, retry/timeout and blocked-connection bursts, and abrupt
  changes in connectivity graphs. The guidance combines symbolic-logic correlation and whitelisting, statistical
  change-point and residual detection, and machine-learning anomaly and sequence models to distinguish
  deliberate, segment-localized, sustained inhibition from benign maintenance, power-cycling, or congestion.
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Are SCADA/HMI/historian loss-of-communication alarms occurring at the same time as managed-switch
    link-down, port-disabled, STP topology-change, or MAC-flap events on the same documented OT path,
    with the protocol capture showing missing request/response pairs or a clean break in cyclic polling?
  context: 'This symbolic-logic correlation ties an application-layer symptom (a device going silent)
    to an infrastructure-layer cause (a switch port or link state change) on the same documented control
    path. Per [NIST SP 800-82 Rev. 3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    documented OT links must remain reachable and availability/heartbeat monitoring is mandatory, so a
    correlated alarm plus port-disable plus a clean break in cyclic polling is strong evidence of deliberate
    Ethernet blocking rather than noise. The key discriminator for the Inhibit Response Function tactic
    is locality: escalate when the loss is segment-localized while adjacent devices on the same segment
    stay connected. A positive result is a loss-of-comms alarm co-timed with a link-down/port-disable
    event and an abrupt stop in polling between a specific device pair; a negative result is an alarm
    with no corresponding switch event and continued polling (likely a transient). Alert text should list
    the affected segment/port, the silent device pair, and time since the last good poll.'
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days; correlate events within a +/- 5 minute window around each loss-of-comms alarm
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Correlate app-layer loss-of-comms with switch port/link state on same OT path

      let alarms = SCADA_HMI_alarms where type in ("LossOfComm","CommFailure")

      let switchev = switch_syslog where event in ("link-down","port-disable","STP-topology-change","MAC-flap")

      join alarms, switchev on documented_path within 5m

      let broken = protocol_capture where missing_request_response_pairs(device_pair) OR cyclic_poll_break(device_pair)

      where segment_localized(device_pair) AND adjacent_devices_still_connected(segment)

      emit ALERT(segment, port, silent_device_pair, now - last_good_poll)'
- question: Has any required cyclic control-loop communication edge (an expected source/destination pair,
    function code, or polling transaction over Modbus, DNP3, or EtherNet/IP) gone silent, leaving a PLC/RTU
    isolated from the flows it normally participates in?
  context: This symbolic-logic method encodes the expected cyclic request/response flows, function codes,
    source/destination pairs, and required communication edges for each control loop as a specification/whitelist,
    then flags any required edge that disappears. It draws on specification-based IDS work ([Mohan et
    al.](https://arxiv.org/abs/2412.07917), [Sen et al.](https://arxiv.org/abs/2209.04354)) and extends
    per-transaction whitelisting ([Marsden et al. PRI-IDS](https://arxiv.org/abs/1711.02826)) so that
    the disappearance of a normally high-probability cyclic transaction deterministically raises an alert.
    It runs entirely on Zeek conn/modbus/dnp3 logs with no external API lookups. For Inhibit Response
    Function, a vanished required edge means a control loop has lost its instruction or reporting channel.
    A positive result is a baseline-required edge with zero matching transactions in a polling interval
    while its peers continue; a negative is intermittent traffic still within tolerance. Identify which
    edge/control loop went silent in the alert.
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Whitelist required cyclic edges per control loop; alert on silent required edge\nrequired_edges\
      \ = baseline_edges(proto in (modbus,dnp3,enip)) where prob_cyclic high\nfor edge in required_edges:\n\
      \  txns = zeek_logs(conn/modbus/dnp3) where matches(edge.src, edge.dst, edge.func) in last_poll_interval\n\
      \  if count(txns) == 0 and peers_active(edge.control_loop):\n    emit ALERT(\"required edge silent\"\
      , edge.control_loop, edge.src, edge.dst, edge.func)"
- question: Are per-link TCP retransmission/timeout counts, RST or blocked-connection bursts, protocol
    exception/timeout responses, and unanswered polls rising on an OT link while keepalive or status traffic
    continues normally?
  context: This symbolic-logic method treats error and failure rates as first-class signals distinct from
    raw volume, tracking per-link retransmissions, timeouts, RST/blocked-connection bursts, protocol exception
    responses, and missing poll responses per minute. Per the [Umer et al. ICS IDS survey](https://arxiv.org/abs/2202.11917)
    emphasis on failure modes, the most telling pattern is failed or unanswered polls climbing while keepalive/status
    traffic still flows, which indicates selective suppression (e.g., an in-path device dropping specific
    frames) rather than a complete outage. For Inhibit Response Function, selective suppression of commands/responses
    lets the process appear partially healthy while safeguards are blinded. A positive result is a sustained
    rise in failed/unanswered polls and RST bursts on a specific link with continued keepalives; a negative
    is failures that track a full link outage (all traffic stops). Report failed-poll count, retry rate,
    and last successful transaction time.
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days; evaluate per-minute over rolling 60-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per-link failure/retry profiling; flag selective suppression\nfor link in OT_links:\n \
      \ retx = count(tcp_retransmit|timeout) per minute\n  rst  = count(tcp_RST|blocked_conn) per minute\n\
      \  exc  = count(proto_exception|timeout_resp) per minute\n  unanswered = polls_sent - poll_responses\
      \ per minute\n  keepalive_ok = keepalive_or_status_rate(link) within baseline\n  if (unanswered\
      \ rising OR retx rising OR rst burst) AND keepalive_ok:\n    emit ALERT(link, failed_poll_count,\
      \ retry_rate, last_successful_txn_time)"
- question: Has any control loop or protocol pair (Modbus TCP, EtherNet/IP, DNP3) experienced an abrupt,
    sustained drop in poll frequency, heartbeat regularity, or packet/byte volume relative to its established
    per-asset baseline?
  context: This statistical method builds per-asset baselines for poll frequency (count/min), heartbeat
    interval, packet/byte volume and ratios, and retry behavior, then applies sequential change-point
    tests (CUSUM / Shiryaev-Roberts per [Polunchenko, Tartakovsky & Mukhopadhyay](https://arxiv.org/abs/1202.2849))
    plus a localized high-dimensional change-point method (TopRank per [Levy-Leduc & Roueff](https://arxiv.org/abs/0908.2310))
    to detect and pinpoint an abrupt, sustained traffic drop with a controlled false-alarm rate. Control
    limits are tuned to a per-site false-alarm budget and known maintenance windows are suppressed. For
    Inhibit Response Function, a sharp persistent decline in cyclic traffic is the network fingerprint
    of blocked Ethernet. A positive result is a change-point with a sustained post-change rate well below
    baseline that is not in a maintenance window; a negative is a transient dip that recovers within tolerance.
    Surface baseline-vs-observed rate and detection delay in the alert.
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days for baseline; evaluate continuously for change-points
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Sequential change-point on cyclic traffic rate per control loop\nfor asset in control_loops(proto\
      \ in (modbus_tcp,enip,dnp3)):\n  base = baseline(poll_rate_per_min, heartbeat_interval, pkt_byte_volume)\n\
      \  series = observed_rate(asset)\n  cp = CUSUM_or_ShiryaevRoberts(series, base, far_budget=site_limit)\n\
      \  cp = TopRank_localize(cp)  // localize in high-dim\n  if cp.detected AND not in_maintenance_window(asset)\
      \ AND post_rate << base:\n    emit ALERT(asset, baseline=base, observed=post_rate, detection_delay=cp.delay)"
- question: Are historian or process tag values flatlined or frozen — with update gaps exceeding the baseline
    cadence by a tuned multiple (e.g., >3-5x) — indicating that expected process updates have stopped
    arriving?
  context: This statistical method builds per-signal predictors of expected process values and their update
    cadence, then runs a stateful CUSUM on the residual between predicted and observed values (per [Urbina
    et al.](https://dl.acm.org/doi/10.1145/2976749.2978388)) to catch sustained loss of expected updates.
    It is reinforced with engineered timing/inter-arrival and flow-count statistics ([Anton et al.](https://arxiv.org/abs/1907.10374))
    to separate normal congestion from suppression. For Inhibit Response Function, blocked reporting messages
    manifest downstream as stalled telemetry even when the wire looks partly alive. A positive result
    is a tag whose update gap exceeds its baseline interval by the tuned multiple while the residual CUSUM
    stays accumulated (frozen value); a negative is jitter within normal cadence. Report the stalled tag
    and the gap duration so the analyst can trace it to the silent device.
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days for cadence baseline; evaluate per update interval
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Stateful CUSUM on predicted-vs-observed; detect frozen/flatlined tags\nfor tag in process_tags:\n\
      \  pred = predictor(tag)\n  resid = pred.value - observed(tag)\n  S = stateful_CUSUM(resid)\n  gap\
      \ = now - last_update_time(tag)\n  if gap > baseline_interval(tag) * MULT(3..5) AND S accumulated:\n\
      \    emit ALERT(\"frozen tag\", tag, gap_duration=gap)"
- question: Does an unsupervised online anomaly detector flag an abrupt drop or spike in per-channel bandwidth,
    packet-rate, or inter-arrival jitter on the OT span/tap consistent with blocked or in-path-dropped
    Ethernet traffic?
  context: This machine-learning method deploys an unsupervised online detector (Kitsune autoencoder ensemble
    per [Mirsky et al.](https://arxiv.org/abs/1802.09089), [code](https://github.com/ymirsky/Kitsune-py))
    over per-channel bandwidth, packet-rate, and inter-arrival-jitter features from an OT span/tap, complemented
    by a CNN-LSTM smart-grid DoS detector ([Alsaiari & Ilyas](https://arxiv.org/abs/2509.07208)), to flag
    abrupt drops/spikes characteristic of blocked or dropped Ethernet. Deterministic thresholds run in
    parallel so an anomaly score is corroborated, not trusted blindly. For Inhibit Response Function,
    a sudden collapse in a channel's packet rate is consistent with an interface disable or in-path frame
    drop. A positive result is a high reconstruction/anomaly score driven by a collapsed packet-rate channel;
    a negative is elevated score from benign bursty traffic that thresholds do not confirm. Alerts must
    list the top contributing features (e.g., which channel's packet rate collapsed).
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days for model training; score in near real time
  queries:
  - technology: ML/pseudocode
    query: "// Unsupervised online detector on OT span/tap features + parallel thresholds\nfeatures =\
      \ per_channel(bandwidth, packet_rate, interarrival_jitter)\nscore = Kitsune_autoencoder_ensemble(features)\
      \   // + CNN_LSTM_dos(features)\nif score > anomaly_threshold AND deterministic_threshold_confirms(features):\n\
      \  top = top_contributing_features(score)  // e.g., channel packet_rate collapse\n  emit ALERT(score,\
      \ top_features=top)"
- question: Do sequence or reconstruction models trained on normal ICS time-series show elevated prediction/reconstruction
    error indicating missing, out-of-sequence, or frozen telemetry — the downstream effect of blocked
    control or reporting messages?
  context: This machine-learning method trains sequence/reconstruction models only on normal ICS time-series
    (1D-CNN per [Kravchik & Shabtai](https://arxiv.org/abs/1806.08110), seq2seq per [Kim et al.](https://arxiv.org/abs/1911.04831),
    and a package-signature+LSTM traffic predictor per [Feng et al.](https://ieeexplore.ieee.org/document/8054575))
    to flag the downstream effect of blocked control/reporting messages via prediction/reconstruction
    error and to localize the affected point. Dataset and threshold guidance follow the [Umer et al. survey](https://arxiv.org/abs/2202.11917).
    For Inhibit Response Function, blocked Ethernet breaks the expected temporal structure of telemetry;
    the model sees deviation from learned normal even if individual values look plausible. A positive
    result is sustained high reconstruction error localized to a specific point/tag coinciding with missing
    or frozen telemetry; a negative is transient error within learned variability. Report the localized
    affected point alongside the error trajectory.
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days for training; evaluate continuously
  queries:
  - technology: ML/pseudocode
    query: "// Reconstruction/prediction error on normal-trained sequence models\nmodels = [CNN1D, seq2seq,\
      \ pkgsig_LSTM] trained on normal_ics_timeseries\nfor point in telemetry_points:\n  err = reconstruction_or_prediction_error(models,\
      \ window(point))\n  if sustained(err > threshold(point)):\n    emit ALERT(\"telemetry deviation\"\
      , localized_point=point, error=err)"
- question: Can a supervised classifier separate benign maintenance/congestion from deliberate Ethernet
    blocking, and does it weight cases where configuration/command messages disappear while status or
    keepalive traffic continues (selective suppression)?
  context: 'This machine-learning method trains a supervised classifier (SVM/Random Forest) on packet
    inter-arrival times, protocol mix, alarm timing, retry/failure counts, and switch-port telemetry to
    distinguish maintenance/congestion from deliberate Ethernet blocking. Random-Forest feature importance
    ([Anton et al.](https://arxiv.org/abs/1907.10374)) — or token-grounded LLM explanations ([Kong et
    al.](https://arxiv.org/abs/2604.26079)) — surfaces the top-3 contributing features in the alert. For
    Inhibit Response Function, the decisive pattern is selective suppression: cases are weighted higher
    when configuration/command messages vanish while status or keepalive traffic continues, indicating
    targeted blocking rather than a total outage. A positive result is a ''blocking'' classification driven
    by disappearing command traffic amid continued keepalives; a negative is a ''maintenance/congestion''
    classification or a planned-window match. The explanation must name the top-3 features so an analyst
    can validate the call.'
  answer_sources:
  - SCADA/HMI alarm logs
  - ICS network flow records
  - PCAP
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Managed switch syslog/SNMP traps (link down, port disable, STP changes, MAC flaps)
  - HMI and engineering workstation service/process logs
  - NetFlow data
  - 'NAI: OT network segments, managed industrial switches, HMIs, engineering workstations, and PLC/RTU
    uplinks.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Supervised classifier maintenance/congestion vs deliberate blocking\nX = features(interarrival_times,\
      \ protocol_mix, alarm_timing, retry_failure_counts, switch_port_telemetry)\nlabel = RandomForest_or_SVM.predict(X)\n\
      if label == \"ethernet_blocking\":\n  if command_config_msgs_absent(X) AND keepalive_status_present(X):\n\
      \    weight = HIGH  // selective suppression\n  top3 = feature_importance_or_LLM_explanation(X)\n\
      \  emit ALERT(label, weight, top3_features=top3)"
