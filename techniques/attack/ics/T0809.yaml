questions:
- question: >-
    Alert on known data-destruction commands: as part of investigating possible Data Destruction under
    the Inhibit Response Function tactic, can you determine whether alert on known data-destruction commands
    applies to the evidence described — namely, Anomalous process creation on a critical ICS asset, indicated
    by a Windows Event ID 4688 CommandLine field containing known data destruction utility keywords (e.g.,
    'sdelete', 'killdisk', 'cipher /w', 'wevtutil cl'), or a command line whose character entropy or length
    exceeds a statistical baseline for that specific process and host.
  context: >-
    This question pursues the 'Symbolic Logic' approach. Alert on Windows 4688 / Sysmon EID 1 command
    lines containing secure-erase or destructive-cleanup tokens — 'sdelete'/'sdelete64' with overwrite/free-space
    flags (-p, -z, -c, -s) per [SDelete, Microsoft Sysinternals](https://learn.microsoft.com/en-us/sysinternals/downloads/sdelete),
    plus 'killdisk', 'cipher /w', 'wevtutil cl', 'format', 'diskpart clean', and the native deletion command
    lines (del /f /q, Remove-Item -Force, rm -rf, shred -u) catalogued in [Atomic Red Team T1070.004 File
    Deletion](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1070.004/T1070.004.md).
    On Linux/Unix OT hosts apply the image+command-line pattern (rm, rmdir, shred, unlink targeting /var/log/
    and project paths) from [Linux Logs Clearing Attempts, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml).
    Maintain a per-host allow-list of approved administrative/maintenance scripts (signed, scheduled,
    known parent) and suppress only for exact matches; do not delete this deterministic floor when ML
    is added. In the context of the Inhibit Response Function tactic, a positive result indicates an adversary
    may be destroying operational data, project files, historian records, or backups to inhibit response
    functions or cover impact; a negative result helps rule out destructive activity for the observed
    assets. Focus on the named area of interest (Engineering Workstations (EWS), Human-Machine Interfaces
    (HMIs), Data Historians, Process Control Servers (PCS), Operator Workstations) and corroborate across
    the listed data sources before escalating.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers (PCS), Operator Workstations'
  range: Last 90 days, with event-centered correlation around suspected destruction.
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      events = win_4688 OR sysmon_eid1;
      tokens = ['sdelete','sdelete64','-p','-z','-c','-s','killdisk','cipher /w','wevtutil cl','format','diskpart clean','del /f /q','remove-item -force','rm -rf','shred -u'];
      alert when any(token in lower(CommandLine)) and host in critical_ics_assets
        and not (signed_scheduled_known_parent allowlist exact match);
- question: >-
    Correlate wiper kernel-driver loads (BYOVD): as part of investigating possible Data Destruction under
    the Inhibit Response Function tactic, can you determine whether correlate wiper kernel-driver loads
    (BYOVD) applies to the evidence described — namely, Anomalous process creation on a critical ICS asset,
    indicated by a Windows Event ID 4688 CommandLine field containing known data destruction utility keywords
    (e.g., 'sdelete', 'killdisk', 'cipher /w', 'wevtutil cl'), or a command line whose character entropy
    or length exceeds a statistical baseline for that specific process and host.
  context: >-
    This question pursues the 'Symbolic Logic' approach. Per [The Anatomy of Wiper Malware, Part 3, CrowdStrike](https://www.crowdstrike.com/en-us/blog/the-anatomy-of-wiper-malware-part-3/),
    correlate a newly installed kernel service (Windows EID 7045) or driver load (Sysmon EID 6) pointing
    to a rare/unsigned-or-revoked driver path that is immediately (<60s) followed by destructive raw-disk
    activity from the same process; alert and treat as high severity on ICS assets where no driver installs
    are expected. In the context of the Inhibit Response Function tactic, a positive result indicates
    an adversary may be destroying operational data, project files, historian records, or backups to inhibit
    response functions or cover impact; a negative result helps rule out destructive activity for the
    observed assets. Focus on the named area of interest (Engineering Workstations (EWS), Human-Machine
    Interfaces (HMIs), Data Historians, Process Control Servers (PCS), Operator Workstations) and corroborate
    across the listed data sources before escalating.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers (PCS), Operator Workstations'
  range: Last 90 days, with event-centered correlation around suspected destruction.
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      svc = win_eid7045 OR sysmon_eid6 where driver_path is rare/unsigned/revoked;
      disk = process raw_disk_write/destructive_io same process;
      alert when disk.ts - svc.ts < 60s on assets where no driver installs expected; severity=high;
- question: >-
    Baseline command-line length and entropy: as part of investigating possible Data Destruction under
    the Inhibit Response Function tactic, can you determine whether baseline command-line length and entropy
    applies to the evidence described — namely, Anomalous process creation on a critical ICS asset, indicated
    by a Windows Event ID 4688 CommandLine field containing known data destruction utility keywords (e.g.,
    'sdelete', 'killdisk', 'cipher /w', 'wevtutil cl'), or a command line whose character entropy or length
    exceeds a statistical baseline for that specific process and host.
  context: >-
    This question pursues the 'Statistical Method' approach. Build 30-day per-process, per-host baselines
    for command-line length and Shannon character entropy and alert on >3 standard-deviation deviations
    or first-seen process images in 30 days, using fleet-wide rarity (a process/hash seen on very few
    hosts is suspicious). Also profile the State/failure signal: count process-creation attempts that
    fail (4688 with non-zero exit / blocked by application control) as a distinct series. In the context
    of the Inhibit Response Function tactic, a positive result indicates an adversary may be destroying
    operational data, project files, historian records, or backups to inhibit response functions or cover
    impact; a negative result helps rule out destructive activity for the observed assets. Focus on the
    named area of interest (Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians,
    Process Control Servers (PCS), Operator Workstations) and corroborate across the listed data sources
    before escalating.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers (PCS), Operator Workstations'
  range: Last 90 days, with 30-day baseline training and event-centered correlation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = per(process,host) mean,std of len(CommandLine) and shannon_entropy(CommandLine) over 30d;
      alert when len or entropy > mean + 3*std OR image first_seen_in_30d OR fleet_rarity(image,hash) low;
      series2 = count(4688 with nonzero_exit OR appcontrol_blocked) per host;
