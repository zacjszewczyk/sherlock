name: 'T0809: Data Destruction'
id: 5311584a-7e55-4fe9-8ecf-859e1e476aa0
description: >-
  Investigate suspected Data Destruction in the ICS environment, where an adversary deliberately deletes,
  overwrites, or wipes critical operational data, project files, configurations, historian records, or
  backups to inhibit safety, protection, and operator-intervention response functions or to provide cover
  for impact. This playbook helps an analyst hunt for: anomalous process creation invoking secure-erase
  or destructive-cleanup utilities (e.g., SDelete, KillDisk, cipher /w, wevtutil cl, vssadmin/wbadmin)
  on engineering workstations, HMIs, historians, and process-control servers; bursty or high-volume file-deletion
  activity targeting critical ICS directories; deletions of high-value ICS-specific file extensions (.ACD,
  .S7P, .PCV, etc.) and backup artifacts; bring-your-own-vulnerable-driver wiper kernel-driver loads followed
  by raw-disk activity; malicious executable transfers crossing the IT-to-OT boundary; and the destruction
  of recovery data manifesting as historian/SCADA write-volume flatlines or ICS-invariant violations indicating
  an unresponsive operator interface. It combines deterministic symbolic-logic rules, statistical baselining
  and change-point detection, and explainable machine-learning approaches across endpoint, network, and
  ICS-telemetry sources.
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
contributors:
- Zachary Szewczyk
