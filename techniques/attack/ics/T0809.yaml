    files, historian records, or backups to inhibit response functions or cover impact; a negative result
    helps rule out destructive activity for the observed assets. Focus on the named area of interest (Engineering
    Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control Servers (PCS),
    Operator Workstations) and corroborate across the listed data sources before escalating.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers (PCS), Operator Workstations'
  range: Last 90 days, with 30-day baseline training and event-centered correlation.
  queries:
  - technology: ML/pseudocode
    query: |-
      features=[image_rarity,parent_child_lineage,cmdline_len,cmdline_entropy,token_on_watchlist,user,host_criticality,time_of_day];
      model = ExtendedIsolationForest(); score = model.decision(features);
      alert when anomaly; emit top3 contributing features; complement DeepLog seq model on host event stream;
- question: >-
    Alert on bursty delete activity in critical directories: as part of investigating possible Data Destruction
    under the Inhibit Response Function tactic, can you determine whether alert on bursty delete activity
    in critical directories applies to the evidence described — namely, A high volume of file deletion
    events (Windows Event ID 4663 with 'DELETE' in Accesses field) from a single user or process within
    a short time frame (e.g., >50 events in 60 seconds), targeting directories with critical ICS project
    files, configurations, or backups (e.g., C:\Siemens\, D:\HistorianData\).
  context: >-
    This question pursues the 'Symbolic Logic' approach. Alert when Windows 4663 DELETE (or Sysmon EID
    23/26 FileDelete) events exceed 50 in 60 seconds for a single user/process targeting critical directories
    (project files, configs, historian data, backups), excluding approved backup/maintenance accounts
    during change windows, consistent with the deny-by-default critical-asset protection in [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    Derive the 50/60s floor from the per-user/process deletion baseline; keep it as a hard threshold even
    when ML is layered. In the context of the Inhibit Response Function tactic, a positive result indicates
    an adversary may be destroying operational data, project files, historian records, or backups to inhibit
    response functions or cover impact; a negative result helps rule out destructive activity for the
    observed assets. Focus on the named area of interest (ICS File Servers, Data Historians, ICS Backup
    Servers, Engineering Workstations (EWS), Process Control Servers (PCS)) and corroborate across the
    listed data sources before escalating.
  answer_sources:
  - Windows Event ID 4663
  - 'NAI: ICS File Servers, Data Historians, ICS Backup Servers, Engineering Workstations (EWS), Process
    Control Servers (PCS)'
  range: Last 90 days, with event-centered correlation around suspected destruction.
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      dels = win_4663 where 'DELETE' in Accesses OR sysmon_eid23/26 FileDelete;
      group by (user,process) sliding 60s window over critical_dirs;
      alert when count > 50 in 60s and not approved_backup_acct in change_window;
- question: >-
    Baseline delete counts, funneling and extension entropy: as part of investigating possible Data Destruction
    under the Inhibit Response Function tactic, can you determine whether baseline delete counts, funneling
    and extension entropy applies to the evidence described — namely, A high volume of file deletion events
    (Windows Event ID 4663 with 'DELETE' in Accesses field) from a single user or process within a short
    time frame (e.g., >50 events in 60 seconds), targeting directories with critical ICS project files,
    configurations, or backups (e.g., C:\Siemens\, D:\HistorianData\).
  context: >-
    This question pursues the 'Statistical Method' approach. Baseline deletion counts per user/process
    (template: [Microsoft 365 Unusual Volume of File Deletion, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/m365/threat_management/microsoft365_unusual_volume_of_file_deletion.yml))
    and alert on >3σ spikes or above the 99.5th percentile. Add the per-process Volume/funneling indicators
    from [CryptoDrop, Scaife et al.](https://faculty.cc.gatech.edu/~traynor/papers/scaife-icdcs16.pdf)
    (deletion bursts, file-type funneling, content-similarity drop, write entropy) and the multi-scale
    features (fraction of directory tree touched, file-type access entropy) from [ShieldFS, Continella
    et al.](https://conand.me/publications/continella-shieldfs-2016.pdf). Profile the failure State explicitly:
    count access-denied/blocked deletions (4663 failure audits) as a distinct signal of attempted destruction
    against protected paths. In the context of the Inhibit Response Function tactic, a positive result
    indicates an adversary may be destroying operational data, project files, historian records, or backups
    to inhibit response functions or cover impact; a negative result helps rule out destructive activity
    for the observed assets. Focus on the named area of interest (ICS File Servers, Data Historians, ICS
    Backup Servers, Engineering Workstations (EWS), Process Control Servers (PCS)) and corroborate across
    the listed data sources before escalating.
  answer_sources:
  - Windows Event ID 4663
  - 'NAI: ICS File Servers, Data Historians, ICS Backup Servers, Engineering Workstations (EWS), Process
    Control Servers (PCS)'
  range: Last 90 days, with 30-day baseline training and event-centered correlation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = per(user,process) deletion_count distribution;
      alert when count > 99.5th_percentile OR > mean+3*std;
      add features: deletion_burst, filetype_funneling, content_similarity_drop, write_entropy,
        fraction_dir_tree_touched, filetype_access_entropy; series2 = count(4663 access_denied);
