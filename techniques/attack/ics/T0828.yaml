  range: Last 90 days (to mine invariants); evaluate runtime continuously
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each invariant (cmd_tag -> effect_tag, N, tol):\n  if historian[cmd_tag]==RUN and not\
      \ (historian[effect_tag] > 0 within N seconds):\n    raise alert sev=HIGH \"Invariant break\" with\
      \ cmd_tag, effect_tag\n  if historian[state_tag]==running and variance(historian[throughput_tag],\
      \ window)==0:\n    raise alert \"Static throughput while running\" with throughput_tag\n  if abs(kw_demand\
      \ - expected_kw(count_running_equipment)) > tol:\n    raise alert \"Energy/equipment mismatch\""
- question: What is the cumulative production loss over time, and have throughput, runtime-%, or kW-demand
    series exhibited an abrupt change-point (level shift) or a sustained degradation that accumulates
    beyond baseline, or have SCADA alarm/failed-command rates exceeded 3 standard deviations above baseline?
  context: 'This quantifies and statistically confirms the impact for the Impact tactic. For each production
    line establish a 90-day rolling baseline of hourly throughput and equipment availability %. Compute
    cumulative production loss in real time by integrating expected-minus-actual throughput, escalating
    at >10% hourly shortfall (medium), >25% (high), and loss persisting >1 hour (critical). In parallel
    run online change-point detection (CUSUM / Bayesian online CPD) on throughput, runtime-%, and kW-demand
    to flag the abrupt level shift of a halt without static per-line thresholds (Aminikhanghahi and Cook).
    Use a stateful CUSUM residual (predicted vs observed) to accumulate slow degradation a single-sample
    threshold would miss, with a tuned false-alarm bound (Urbina et al.). For the failure-mode signal,
    track 30-day variance of SCADA alarm counts and the rejected/failed-command rate, alerting when the
    current hourly rate exceeds 3 sigma. A positive result both proves and sizes the revenue impact; the
    change-point timestamp anchors the network correlation window. References: [A Survey of Methods for
    Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/);
    [Limiting the Impact of Stealthy Attacks on Industrial Control Systems, Urbina et al.](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf);
    [A Survey on Industrial Control System Testbeds and Datasets for Security Research, Conti et al.](https://arxiv.org/abs/2102.05631).'
