  range: Last 90 days rolling baseline; real-time integration and change-point scoring
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling_90d(hourly_throughput, availability_pct) per line\nloss = integral(expected_throughput\
      \ - actual_throughput) over time\nif hourly_shortfall>0.10: sev=MED; >0.25: sev=HIGH; if loss persists>1h:\
      \ sev=CRIT\ncp = CUSUM_or_BOCPD(series=[throughput, runtime_pct, kw_demand])\nif cp.level_shift:\
      \ raise alert \"Change-point/halt\" at cp.time\nif hourly_alarm_rate > mean+3*std(baseline_alarm)\
      \ or\n   failed_cmd_rate > mean+3*std(baseline_failed_cmd): raise alert \"Failure-mode spike\""
- question: Does an unsupervised multivariate anomaly detector trained on normal operations flag the current
    cyber-physical state (historian tags, equipment state vectors, kW demand, and Zeek per-device connection/byte/command
    counts) above the 99th percentile of training scores - for example flatlined or withheld telemetry
    and loss of normal periodicity - and which top features explain it?
  context: 'Under Impact, sophisticated manipulation may evade fixed thresholds, so train an unsupervised
    multivariate detector on normal-only data: a lightweight 1D-CNN forecasts next telemetry and you threshold
    the prediction residual (Kravchik and Shabtai), augmented with PCA and frequency-domain (FFT) reconstruction
    error to capture the loss of periodicity that normally accompanies steady production and reporting.
    Features are 5-minute bins of historian tags (throughput, pressure, temperature, flow), equipment
    state vectors (running/stopped/faulted), kW demand, and Zeek-derived per-device connection count and
    byte volume to/from PLCs/HMIs (Volume), write-command rate (Frequency), and rejected-command/missed-report
    counts (State). One-class baselines (DNN vs OCSVM) flag flatlined or withheld telemetry, and a Random
    Forest cross-check supplies interpretable feature importance. Alert when the anomaly score exceeds
    the 99th percentile of training scores and surface the top-3 contributing features via SHAP in the
    alert text. Combine process-level and network-level models. A positive, well-explained anomaly directs
    the analyst to the specific tags/devices driving the production loss. References: [Detecting Cyberattacks
    in Industrial Control Systems Using Convolutional Neural Networks, Kravchik and Shabtai](https://arxiv.org/abs/1806.08110);
    [Efficient Cyber Attack Detection in ICS Using Lightweight Neural Networks and PCA, Kravchik and Shabtai](https://arxiv.org/abs/1907.01216);
    [Anomaly Detection for a Water Treatment System Using Unsupervised Machine Learning, Inoue et al.](https://arxiv.org/abs/1709.05342);
    [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests, Anton et al.](https://arxiv.org/abs/1907.10374);
    [Explainable Anomaly Detection for Industrial Control System Cybersecurity, Ha et al.](https://arxiv.org/abs/2205.01930);
    [Machine Learning for Intrusion Detection in ICS: Applications, Challenges, and Recommendations, Umer
    et al.](https://arxiv.org/abs/2202.11917).'
