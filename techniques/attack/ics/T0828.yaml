- question: In any 10-minute rolling window, do at least two of three failure indicators - hourly counts
    of device-offline events, unique SCADA alarm types, and system-shutdown events - exceed their 99.9th-percentile
    baseline, and do per-segment device-availability or alarm-rate series show an abrupt change-point
    or accumulating CUSUM residual consistent with a coordinated cessation?
  context: 'This statistically confirms the coordinated-cessation pattern for the Impact tactic. Per critical
    segment establish a 90-day baseline distribution of hourly counts of device-offline events, unique
    SCADA alarm types, and system-shutdown events, and compute 99.9th-percentile thresholds. Aggregate
    into 10-minute rolling windows and raise high severity when any two of the three exceed their thresholds
    in the same window. Run online change-point/CUSUM detection on per-segment device-availability and
    alarm-rate series to catch the abrupt regime shift of a coordinated cessation (Aminikhanghahi and
    Cook), using a stateful residual CUSUM so cascading-but-gradual dropouts accumulate above a bounded
    false-alarm rate (Urbina et al.). Flatline check: alert when a critical analog tag''s 10-minute sliding
    variance drops to zero for tags whose historical variance exceeds 0.1. Failure-mode signal: profile
    blocked/failed-connection and failed-logon spikes on control hosts as a distinct correlated indicator.
    A positive multi-indicator result corroborates an attack-driven shutdown over isolated noise and times
    the event for forensic correlation. References: [A Survey of Methods for Time Series Change Point
    Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); [Limiting
    the Impact of Stealthy Attacks on Industrial Control Systems, Urbina et al.](https://users.soe.ucsc.edu/~alacarde/papers/ccs16.pdf);
    [A Survey on Industrial Control System Testbeds and Datasets for Security Research, Conti et al.](https://arxiv.org/abs/2102.05631).'
