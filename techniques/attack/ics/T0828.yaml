questions:
- question: Has any critical production metric (line throughput in units/hour, equipment runtime %, or
    facility kW demand) fallen below its 5th-percentile baseline for more than 30 consecutive minutes
    during a scheduled production window AND coincided with ICS network anomalies (unauthorized write/function-code
    commands, unbaselined source IPs, or device communication gaps) in the preceding 2 hours?
  context: 'This targets the core impact signature of T0828 under the Impact tactic: adversary action
    producing a sustained, measurable production drop while leaving correlating cyber tracks. Maintain
    a baseline dictionary of each critical metric and its expected range per scheduled production window,
    derived from the historian and documented production schedule (NIST SP 800-82 Rev. 3). A SIEM correlation
    polls historian exports every 5 minutes and raises a high-severity "Production Impact" alert when
    a metric stays below its 5th-percentile threshold for >30 minutes during a scheduled window AND a
    preceding 2-hour ICS network anomaly is present. Encode the legitimate command/flow envelope as auto-generated
    specification rules (authorized source->device, function code, register range, expected periodic reporting
    cadence) so missing periodic reports or out-of-envelope writes become deterministic precursors. Track
    Volume (bytes/commands per device/min), Frequency (write-command count/min), and State (failed/rejected
    commands, missed report intervals). A positive result strongly implicates deliberate disruption over
    benign variance; triage by pulling the last 30 minutes of Zeek modbus/dnp3/enip commands to the affected
    line. A metric drop with no network anomaly points toward maintenance or equipment failure. References:
    [Guide to Operational Technology (OT) Security (NIST SP 800-82 Rev. 3), Stouffer et al.](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Distributed Intrusion Detection System using Semantic-based Rules for SCADA in Smart Grid, Mohan
    et al.](https://arxiv.org/abs/2412.07917); [On Specification-based Cyber-Attack Detection in Smart
    Grids, Sen et al.](https://arxiv.org/abs/2209.04354).'
