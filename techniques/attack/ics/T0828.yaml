- question: Did 3 or more critical PLCs/RTUs go silent (no Zeek conn.log activity for >5 minutes) within
    a 10-minute window, cross-correlated with control-host shutdown events (Windows Event ID 1074/6008)
    on SCADA/HMI servers and a simultaneous SCADA alarm spike, indicating a coordinated system failure?
  context: 'This detects the abrupt, coordinated cessation pattern central to T0828 Impact. From a maintained
    inventory of critical control-system IPs/hostnames and their expected communication cadence (NIST
    SP 800-82 Rev. 3), implement a stateful SIEM rule tracking device last-seen timestamps from Zeek conn.log.
    Raise a critical "Coordinated System Failure" alert if >=3 critical assets simultaneously go silent
    (no comms >5 min) within a 10-minute window, cross-correlated with Windows Event ID 1074/6008 (shutdown)
    on SCADA/HMI hosts and a SCADA alarm spike. Treat the cessation of expected periodic reporting as
    a specification violation. Auto-preserve the last 30 minutes of ICS protocol commands (Zeek modbus/dnp3)
    to the affected devices for forensics. State signal: count of devices with missed report intervals;
    Frequency: offline-event count/min. A positive result indicates a likely deliberate or cascading takedown
    rather than a single device fault; the correlated shutdown events may reveal the host vector (e.g.,
    ransomware, malicious shutdown command). References: [Guide to Operational Technology (OT) Security
    (NIST SP 800-82 Rev. 3), Stouffer et al.](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Distributed Intrusion Detection System using Semantic-based Rules for SCADA in Smart Grid, Mohan
    et al.](https://arxiv.org/abs/2412.07917); [On Specification-based Cyber-Attack Detection in Smart
    Grids, Sen et al.](https://arxiv.org/abs/2209.04354).'
