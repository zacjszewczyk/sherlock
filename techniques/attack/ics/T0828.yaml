  - 'NAI: Production Line Control Systems (PLCs, RTUs), Manufacturing Execution Systems (MES), Historian
    Servers, SCADA HMI Systems, Energy Management Systems, Critical Process Equipment monitoring points
    (Purdue Levels 0-2).'
  range: Last 90 days (baseline); correlate the impacted window with the preceding 2 hours of ICS network
    activity
  queries:
  - technology: SIEM/Rule pseudocode
    query: "poll historian_export every 5m\nfor each metric in {throughput_uph, runtime_pct, kw_demand}\
      \ per line:\n  if scheduled_window(now) and value < pctile_5(baseline_90d[metric, window])\n   \
      \  sustained_for >= 30m:\n    net = lookup ics_net_anomaly where device in line.devices and time\
      \ in [now-2h, now]\n        having (unauthorized_write or new_src_ip or comms_gap)\n    if net:\
      \ raise alert sev=HIGH \"Production Impact\" with line, metric, net.evidence"
  - technology: Zeek/pseudocode
    query: "# precursor envelope check across modbus/dnp3/enip logs\nfor rec in (modbus.log, dnp3.log,\
      \ enip.log) to line.devices:\n  if rec.id.orig_h not in authorized_sources[rec.id.resp_h]\n    \
      \ or rec.func not in allowed_funcs[rec.id.resp_h]\n     or rec.register not in allowed_range[rec.id.resp_h]:\n\
      \    emit ics_net_anomaly(type=unauthorized_write, dev=rec.id.resp_h)\n# missed periodic report\
      \ = comms gap\nif now - last_seen[device] > expected_cadence[device]*2: emit comms_gap"
- question: Are there broken process invariants where a control command is present but the expected physical
    effect is absent (e.g., a conveyor/pump commanded RUN with no non-zero downstream flow/throughput
    within N seconds, or energy demand not tracking running-equipment count)?
  context: 'Under Impact, adversaries can stall or manipulate a process so that the control logic appears
    to command production while the physical reality has stopped. Mine invariant predicates that must
    hold in normal operation and enforce them as runtime checks (Feng et al.). A violated invariant -
    command present but physical response absent, or a throughput tag static while state=running - deterministically
    distinguishes a real production stall or manipulation from benign variance, and names the offending
    tag pair in the alert. Tune N (response latency) and tolerance per line, and never remove these hard
    predicates; layer statistical and ML detection in parallel. A positive result is high-confidence evidence
    of physical disruption or spoofed feedback; the named tag pair guides immediate field verification.
    References: [A Systematic Framework to Generate Invariants for Anomaly Detection in Industrial Control
    Systems, Feng et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf).'
