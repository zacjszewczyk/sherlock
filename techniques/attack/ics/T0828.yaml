- question: Has a critical analog tag that historically varies (e.g., pressure, flow, level) flatlined
    - reporting constant values with zero variance for more than 10 minutes - while equipment state indicates
    the line is running, indicating a frozen or manipulated data feed or a genuine stoppage?
  context: 'Under Impact, a flatline during active production is a deterministic invariant break revealing
    either a frozen/spoofed feed or a real cessation. Enforce mined invariants linking control state to
    physical effect (Feng et al.): during active production a critical analog tag must exhibit variance
    and a running line must show non-zero downstream flow. A flatline (variance==0 for >10 minutes on
    a tag whose historical variance is non-trivial) while equipment state=running deterministically indicates
    a frozen/manipulated feed or genuine stoppage. Keep these hard checks regardless of ML coverage. A
    positive result is high-confidence and names the affected tag, distinguishing a sensor/feed manipulation
    (operators may still see ''normal'' values) from a visible halt - critical because manipulated feeds
    can mask ongoing physical impact. References: [A Systematic Framework to Generate Invariants for Anomaly
    Detection in Industrial Control Systems, Feng et al.](https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_07A-3_Feng_paper.pdf).'
