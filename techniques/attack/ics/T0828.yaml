      \ >= 2: raise alert sev=HIGH \"Coordinated failure (stats)\" with exceed\ncp = CUSUM(device_availability,\
      \ alarm_rate) per segment\nif cp.regime_shift: raise alert \"Availability change-point\"\nif failed_conn_rate\
