name: 'T0828: Loss of Productivity and Revenue'
id: 450e4fd2-036f-444c-baf7-5fd0bc67dca9
description: 'Investigate suspected adversary-caused loss of productivity and revenue in an ICS/OT environment,
  where disruption or damage to control-system operations, devices, and processes degrades or halts production.
  This playbook helps an analyst confirm and characterize two complementary impact patterns: (1) a sustained,
  measurable deviation in operational process metrics (production-line throughput below baseline, critical
  equipment in stopped/faulted states, energy/kW demand dropping sharply during scheduled production)
  correlated with anomalous ICS network activity in the preceding hours, and (2) an abrupt, unplanned
  cessation of operations shown by coordinated multi-device offline events, SCADA alarm storms, multi-host
  control-system shutdowns, and process-variable flatlines. It correlates historian process data and SCADA
  alarm logs with Zeek ICS-protocol logs (modbus/dnp3/enip/conn) and Windows control-host events (4663,
  1074, 6008, 4688) so the analyst can distinguish benign operational variance or maintenance from adversary
  manipulation, quantify the production/revenue loss, and localize the affected line, device, or tag.'
type: technique
