- question: Does a multi-stream unsupervised model (device availability, SCADA alarm event counts, and
    process-variable variance) flag the current state above the 99.5th percentile of validation scores,
    and can it localize the affected sensor/actuator point driving a multi-domain failure?
  context: 'Under Impact, fusing cyber and physical streams improves detection and localization of coordinated
    failures. Train multi-stream unsupervised models on normal data: device availability (Zeek conn.log
    parsed to per-minute online/offline states), SCADA alarm event counts, and process-variable variance,
    using per-stream forecasting with a Seq2Seq encoder-decoder that both detects via prediction error
    and localizes the affected point, with explicit false-positive/false-negative profiling (Kim et al.).
    Complement with lightweight 1D-CNN/PCA residual scoring for fast edge inference and one-class baselines
    trained on normal-only operation. Fuse streams with a final layer learning cyber-physical correlation;
    score live operations every 5 minutes and alert above the 99.5th percentile of validation scores.
    Surface the top-3 contributing streams/features via SHAP and combine network- and process-level detectors.
    A positive, localized result accelerates response by naming the device/point at the center of the
    cessation and quantifying confidence. References: [Anomaly Detection for Industrial Control Systems
    Using Sequence-to-Sequence Neural Networks, Kim et al.](https://arxiv.org/abs/1911.04831); [Detecting
    Cyberattacks in Industrial Control Systems Using Convolutional Neural Networks, Kravchik and Shabtai](https://arxiv.org/abs/1806.08110);
    [Efficient Cyber Attack Detection in ICS Using Lightweight Neural Networks and PCA, Kravchik and Shabtai](https://arxiv.org/abs/1907.01216);
    [Anomaly Detection for a Water Treatment System Using Unsupervised Machine Learning, Inoue et al.](https://arxiv.org/abs/1709.05342);
    [Explainable Anomaly Detection for Industrial Control System Cybersecurity, Ha et al.](https://arxiv.org/abs/2205.01930);
    [Machine Learning for Intrusion Detection in ICS: Applications, Challenges, and Recommendations, Umer
    et al.](https://arxiv.org/abs/2202.11917).'
