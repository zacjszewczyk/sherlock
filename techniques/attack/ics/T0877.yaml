name: 'T0877: I-O Image'
id: 63815308-1e2d-4e4c-8573-ac039cecc8ae
description: >-
  Investigate whether an adversary is collecting a PLC's I/O image - the input/output process-image tables
  a PLC reads and writes each scan cycle - to understand or prepare to manipulate the industrial process.
  This playbook helps a SOC/OT analyst hunt for ICS protocol read activity (S7COMM 'Read Var', Modbus
  FC03/FC04, EtherNet/IP 'Read Tag') against PLC memory from unauthorized or first-seen sources, abnormal
  read volume or byte/coverage from otherwise authorized HMIs/EWS that may be compromised, out-of-spec
  function codes or memory targets, elevated illegal-function/illegal-address error rates indicative of
  I/O image enumeration, and low-and-slow exfiltration of process values. It pairs deterministic allow-list
  and specification-based detection (the authoritative floor) with statistical baselining (first-seen,
  percentile/sigma outliers, CUSUM, entropy) and machine-learning models, and correlates network PLC-read
  anomalies with host-based events on the source EWS/HMI (process creation, object access) to confirm
  operator-pivot tradecraft.
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any source IP that is NOT on the authorized allow-list (HMIs, EWS, Historians) sending
    ICS protocol read commands (S7COMM 'Read Var', Modbus FC03/FC04, EtherNet/IP 'Read Tag') to a PLC's
    I/O memory space?
  context: >-
    Tied to the Collection tactic, this is the deterministic detection floor for I/O image theft. Maintain
    a static allow-list of authorized source IPs (HMIs, EWS, Historians) permitted to issue read function
    codes for each PLC or PLC group, scoped on the Level 2<->Level 1 process-control segment per Purdue/IDMZ
    guidance (NIST SP 800-82r3). Ingest Zeek protocol logs and raise a high-severity alert when the id.orig_h
    of a read is not on the allow-list for the target id.resp_h. A positive result means an unauthorized
    host is reading PLC process-image memory and should be treated as active collection; a clean result
    raises confidence that only sanctioned supervisory hosts poll the PLC. This protocol/role allow-listing
    mirrors auto-generated semantic SCADA rules.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN) segments, specifically network traffic between Level 2 (Supervisory)
    and Level 1 (Control) zones, captured via SPAN ports or network taps on switches connected to PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip)
      | where function in (READ_VAR, FC03, FC04, READ_TAG)
      | lookup plc_read_allowlist resp=id.resp_h orig=id.orig_h OUTPUT authorized
      | where authorized != true
      | eval severity="high"
      | table _time id.orig_h id.resp_h proto function mem_area
      | alert
- question: Even for an allow-listed source, is the requested PLC memory area / register range and function
    code outside the published, baselined specification for that specific source->PLC communication path
    (for example a host that should only read one block now reading the I/O image registers)?
  context: >-
    For the Collection tactic, source-IP allow-listing alone is insufficient because a legitimate host
    can be abused to read memory it never normally touches. Deterministically validate that the requested
    memory area/register range and function code fall within the published, baselined specification for
    that source->PLC path, so reads of I/O image registers (Modbus input registers / S7 process-image
    areas) from a host that should only read another block are flagged. This specification-based, invariant-predicate
    check names the offending source, function code, and target register range. A hit indicates targeted
    I/O image collection or staging for manipulation; no hits means observed reads stay within documented
    engineering specs.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN) segments, specifically network traffic between Level 2 (Supervisory)
    and Level 1 (Control) zones, captured via SPAN ports or network taps on switches connected to PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip)
      | where function in (READ_VAR, FC03, FC04, READ_TAG)
      | lookup path_spec orig=id.orig_h resp=id.resp_h OUTPUT allowed_funcs allowed_ranges
      | where NOT (function in allowed_funcs AND mem_range within allowed_ranges)
      | eval severity="high", reason="out-of-spec read: "+id.orig_h+" fc="+function+" range="+mem_range
      | alert
- question: For each destination PLC, has a read command arrived from a source IP that has never before
    been observed reading that PLC in the trailing 30-day window, and is that source generating an elevated
    rate of protocol error/exception responses (Modbus 0x02 illegal data address, S7 NACK) consistent
    with I/O image probing?
  context: >-
    Supporting the Collection tactic, this profiles, for each destination PLC, the set of source IPs issuing
    read commands over a 30-day rolling window and raises a medium 'first-seen' alert when a read originates
    from a never-before-seen source. It also profiles the State dimension - per-source successful reads
    vs protocol error/exception responses (Modbus 0x02 illegal data address, S7 NACK) - because an adversary
    mapping the I/O image generates an elevated illegal-address/error rate distinct from steady operation.
    A new source plus a burst of address errors is a strong reconnaissance signal; a familiar source with
    low error rate is likely benign polling.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN) segments, specifically network traffic between Level 2 (Supervisory)
    and Level 1 (Control) zones, captured via SPAN ports or network taps on switches connected to PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip) function in (READ_*)
      | stats earliest(_time) as first_seen count as reads,
              sum(eval(resp_status="error")) as errs by id.resp_h id.orig_h
      | eval err_rate=errs/reads
      | where first_seen > now()-30d OR err_rate > baseline_err_rate(id.resp_h)
      | eval severity="medium" | alert
- question: When a supervised classifier scores a new PLC read request, is it labeled 'unauthorized' above
    the tuned confidence threshold based on source IP, destination PLC, port, protocol, function code,
    requested address range, request rate, and asset-inventory device types?
  context: >-
    For the Collection tactic, a supervised Random Forest (chosen for explainability) trained on labeled
    historical traffic classifies new reads as authorized/unauthorized using source IP, destination PLC,
    port, protocol, function code, requested address range, request rate, and asset-inventory device types.
    Alert above a tuned confidence (start 0.95, derive per-site) and surface the top-3 contributing features
    via feature importance. This catches authorization violations the static rules miss, but it is kept
    strictly secondary to the allow-list because ICS ML-IDS metrics are often inflated and evadable -
    treat a model hit as a lead to corroborate, not a verdict.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Process Control Network (PCN) segments, specifically network traffic between Level 2 (Supervisory)
    and Level 1 (Control) zones, captured via SPAN ports or network taps on switches connected to PLCs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      features = [src_ip, dst_plc, port, proto, function, addr_range, req_rate,
                  src_dev_type, dst_dev_type]
      model = RandomForestClassifier.load("plc_read_authz.pkl")
      p = model.predict_proba(features)["unauthorized"]
      if p >= 0.95:  # tune per-site on validation
          alert(severity="medium", top3=model.feature_importances_top(3))
      # secondary to allow-list; ICS ML-IDS metrics are evadable
- question: For each critical source->PLC pair, does the number of read requests in any 60-second sliding
    window exceed the hard ceiling (e.g., 500/min) derived from documented poll cycles?
  context: >-
    For the Collection tactic, even authorized HMIs/EWS poll at steady, documented rates, so a hard per-pair
    ceiling on reads per minute (e.g., 500/min from documented poll cycles) gives a deterministic Volume/Frequency
    tripwire. Raise a high-severity alert on exceedance within a 60-second sliding window. A breach suggests
    a compromised legitimate host is being driven to bulk-collect the I/O image faster than any normal
    scan cycle; staying under the cap does not clear the host but removes the loudest exfiltration mode.
    Derive the per-pair value from observed scan-cycle periodicity.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network tap points or SPAN ports on managed switches within PCN segments, monitoring traffic
    flows between Level 3 (Manufacturing Operations Management) devices like HMIs and EWS, and Level 2
    (Control Systems) devices like PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip) function in (READ_*)
      | bin _time span=60s
      | stats count as reads by _time id.orig_h id.resp_h
      | lookup pair_caps orig=id.orig_h resp=id.resp_h OUTPUT max_reads_per_min
      | where reads > max_reads_per_min
      | eval severity="high" | alert
- question: For each authorized source->PLC pair, does the per-minute read count, the read-response byte
    volume, or the distinct count of registers/tags read in a 1-minute window exceed the 99th percentile
    / 3-sigma of the 30-day time-of-day baseline (indicating possible bulk I/O image collection)?
  context: >-
    For the Collection tactic, this baselines reads/min per authorized source->PLC pair over a 30-day
    rolling window by time-of-day and alerts (medium) when a 1-minute window exceeds the 99th percentile
    or 3 sigma above the mean. It also tracks read-response byte volume and the distinct count of registers/tags
    read per window, because bulk I/O image collection inflates unique-address coverage even when the
    request rate looks normal. A spike in distinct registers with normal rate is a classic enumeration
    tell; tune the percentile/sigma per pair on validation data to control false positives.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network tap points or SPAN ports on managed switches within PCN segments, monitoring traffic
    flows between Level 3 (Manufacturing Operations Management) devices like HMIs and EWS, and Level 2
    (Control Systems) devices like PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip) function in (READ_*)
      | bin _time span=60s
      | stats count as reads, sum(resp_bytes) as bytes, dc(addr) as distinct_regs
              by _time id.orig_h id.resp_h hour_of_day
      | join id.orig_h id.resp_h hour_of_day [baseline mean,std,p99 per pair/hour]
      | where reads>p99 OR reads>mean+3*std OR distinct_regs>p99_regs OR bytes>p99_bytes
      | eval severity="medium" | alert
- question: Does a stateful CUSUM cumulative-sum test on a source->PLC pair's read-rate (and distinct-register-count)
    residual versus baseline cross the tuned bound, revealing a low-and-slow attacker who stays under
    per-window thresholds but sustains a persistent small excess of reads?
  context: >-
    For the Collection tactic, a stateful CUSUM cumulative-sum test on the per-pair read-rate (and distinct-register-count)
    residual versus baseline accumulates small persistent deviations and alerts when the statistic crosses
    a tuned bound. This is designed to catch the low-and-slow adversary who deliberately stays under per-window
    percentile/cap thresholds but sustains a small steady excess of reads to siphon the I/O image over
    hours or days. A crossing indicates patient, stealthy collection; the cumulative design makes it far
    harder to evade than single-window outlier tests.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network tap points or SPAN ports on managed switches within PCN segments, monitoring traffic
    flows between Level 3 (Manufacturing Operations Management) devices like HMIs and EWS, and Level 2
    (Control Systems) devices like PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for each (orig,resp) pair, per minute:
        resid = reads - baseline_mean
        S = max(0, S_prev + resid - slack_k)
        if S > H_threshold:
           alert(severity="medium", reason="sustained slow read excess (CUSUM)")
           S = 0
      # also run CUSUM on distinct_register_count residual
- question: For high-consequence source->PLC pairs, does a time-series model (CNN/autoencoder or LSTM,
    augmented with FFT and PCA reconstruction-error features) trained on normal cyclical read-frequency
    patterns produce a forecast/reconstruction error above the dynamically tuned threshold, indicating
    loss or change of polling periodicity?
  context: >-
    For the Collection tactic and high-consequence pairs, a predict-then-threshold-residual time-series
    model (CNN/autoencoder or LSTM) learns the normal cyclical read-frequency pattern and alerts when
    forecast/reconstruction error exceeds a dynamically tuned threshold. Frequency-domain (FFT) and PCA
    reconstruction-error features flag loss or change of periodicity from injected polling and make scores
    explainable; a Matrix Profile offers a near-parameter-free alternative surfacing read bursts as discords.
    Report the top-3 contributing windows. Pair with deterministic caps because time-series detectors
    are adversarially evadable.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Network tap points or SPAN ports on managed switches within PCN segments, monitoring traffic
    flows between Level 3 (Manufacturing Operations Management) devices like HMIs and EWS, and Level 2
    (Control Systems) devices like PLCs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      series = read_rate_per_min(orig,resp)  # + FFT + PCA features
      pred = ts_model.forecast(series)
      resid = abs(series - pred)
      if resid > dynamic_threshold(resid_history):
          alert(severity="medium", top3_windows=rank_residuals(3))
      # pair with deterministic caps; LSTM detectors are adversarially evadable
- question: For each authorized source->PLC pair, is an ICS read/diagnostic function code being used that
    is outside the vendor-documented and operationally baselined allow-list (e.g., diagnostic or block/array
    reads where only simple register reads are expected)?
  context: >-
    For the Collection tactic, this is the function-code-aware deterministic floor: for each authorized
    source->PLC pair, define an allow-list of accepted read/diagnostic function codes from vendor documentation
    and operational baselining, and raise a high-severity alert on any code outside it (e.g., diagnostic
    or block/array reads where only simple register reads are expected). Such block/diagnostic reads are
    an efficient way to lift large swaths of the I/O image. A hit means the source is exercising capabilities
    outside its normal role; deep-packet inspection at the L3<->L2 boundary makes this semantic check
    reliable.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Deep Packet Inspection (DPI) points on network taps or SPAN ports within PCN segments where
    Level 3 devices (e.g., EWS, HMIs) communicate with Level 2 devices (e.g., PLCs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip)
      | lookup func_allowlist orig=id.orig_h resp=id.resp_h OUTPUT allowed_funcs
      | where NOT (function in allowed_funcs)
      | eval severity="high", reason="disallowed fc "+function+" on "+id.orig_h+"->"+id.resp_h
      | alert
- question: Per source, does the rate of protocol error/exception responses (Modbus 0x01 illegal function
    / 0x02 illegal data address, S7 error class, EtherNet/IP general status error) exceed the 95th percentile
    of that source's history, indicating enumeration of the I/O image or probing of supported functions?
  context: >-
    For the Collection tactic, this profiles the State dimension per source: baseline the rate of error/exception
    responses (Modbus 0x01 illegal function / 0x02 illegal data address, S7 error class, EtherNet/IP general
    status error). A source enumerating the I/O image or probing which functions a PLC supports generates
    a distinct spike in illegal-function/illegal-address responses, so alert (medium) when the failed-read
    rate exceeds the 95th percentile of that source's history. This failure-mode signal complements volume
    metrics and is hard for an attacker to avoid while still discovering valid addresses.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Deep Packet Inspection (DPI) points on network taps or SPAN ports within PCN segments where
    Level 3 devices (e.g., EWS, HMIs) communicate with Level 2 devices (e.g., PLCs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip)
      | bin _time span=5m
      | stats sum(eval(resp_status in (ILLEGAL_FUNC,ILLEGAL_ADDR,S7_ERR,ENIP_ERR))) as fails,
              count as total by _time id.orig_h
      | eval fail_rate=fails/total
      | where fail_rate > p95_history(id.orig_h)
      | eval severity="medium" | alert
- question: For each source communicating with PLCs, does the Shannon entropy of its function-code distribution
    over a rolling 60-minute window exceed the 95th percentile of its historical baseline (an unusually
    varied command set consistent with reconnaissance)?
  context: >-
    For the Collection tactic, this computes the Shannon entropy of each source's function-code distribution
    over a rolling 60-minute window and compares to the source's historical baseline, alerting (medium)
    above the 95th percentile. Normal supervisory hosts use a narrow, repetitive set of codes, so a sudden
    rise in entropy signals an unusually varied command set consistent with reconnaissance or capability
    discovery against the PLC. Combine with the distinct-function-code count and per-code volume so the
    alert reports exactly which new codes drove the spike for fast triage.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Deep Packet Inspection (DPI) points on network taps or SPAN ports within PCN segments where
    Level 3 devices (e.g., EWS, HMIs) communicate with Level 2 devices (e.g., PLCs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      idx=zeek (s7comm OR modbus OR enip)
      | bin _time span=60m
      | stats count by _time id.orig_h function
      | eval entropy = shannon_entropy(function distribution) per (_time,id.orig_h)
      | join id.orig_h [baseline p95_entropy per source]
      | where entropy > p95_entropy
      | eval severity="medium", new_codes=diff_codes_vs_baseline
      | alert
- question: When an unsupervised model (Isolation Forest) trained per authorized source on normal per-window
    function-code frequency vectors scores a new window, is that window flagged an outlier, and which
    function codes drove the deviation?
  context: >-
    For the Collection tactic, an unsupervised Isolation Forest trained per authorized source on per-window
    function-code frequency vectors during normal operation flags windows scored as outliers, with the
    top-3 deviating function codes surfaced for explainability. This catches subtle shifts in the command
    mix that a static allow-list (which only checks membership) would miss. The function-code allow-list
    remains authoritative; treat the model as a secondary corroborating signal given documented inflated-metrics
    cautions for ICS ML-IDS, and tune the anomaly cutoff on validation data.
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - 'NAI: Deep Packet Inspection (DPI) points on network taps or SPAN ports within PCN segments where
    Level 3 devices (e.g., EWS, HMIs) communicate with Level 2 devices (e.g., PLCs).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      vec = func_code_freq_vector(source, window)
      model = IsolationForest.load(f"funcdist_{source}.pkl")
      if model.decision_function(vec) < anomaly_cutoff:
          alert(severity="medium", top3=deviating_function_codes(vec,3))
      # function-code allow-list stays authoritative; ML is secondary
- question: When a network PLC-read anomaly fires, do host logs from the source EWS/HMI (Windows Event
    ID 4688 process creation, 4663 object access) within a +/-10 minute window show a blacklisted tool
    (plink.exe, ncat.exe, python-snap7, pymodbus) or suspicious command lines (-enc, whoami, raw socket
    / Modbus scripting)?
  context: >-
    For the Collection tactic, EWS/HMI hosts are high-value pivots, so on any network PLC-read anomaly
    automatically query the source host's logs (Event ID 4688 process creation, 4663 object access) for
    a +/-10 minute window and escalate to critical if a process matches a known-tool blacklist (plink.exe,
    ncat.exe, python ICS libraries such as python-snap7/pymodbus) or command lines contain suspicious
    patterns (-enc, whoami, raw socket/Modbus scripting). Linking the network anomaly to attacker tooling
    on the operator station converts an ambiguous read pattern into high-confidence evidence of adversary-driven
    collection.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4663
  - 'NAI: Endpoint devices identified as EWS or HMIs within the Level 3 (Manufacturing Operations Management)
    zone, and network tap points monitoring traffic between these endpoints and Level 2 (Control Systems)
    PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      trigger: plc_read_anomaly(src_host, t0)
      | join host=src_host time in [t0-10m, t0+10m]
        [search idx=win (EventID=4688 OR EventID=4663)]
      | where match(NewProcessName, "plink|ncat|snap7|pymodbus|python")
           OR match(CommandLine, "-enc|whoami|socket|modbus")
      | eval severity="critical" | alert
- question: Around a network PLC-read anomaly, do processes on the source EWS/HMI (Event ID 4688) include
    first-seen process names or statistically rare parent-child relationships (e.g., a document reader
    or powershell.exe spawning an ICS-protocol client) versus the host's baseline?
  context: >-
    For the Collection tactic, this baselines common process names and parent-child relationships per
    EWS/HMI from Event ID 4688. When a network PLC-read anomaly fires, processes on the source host in
    the surrounding window are scored for rarity; first-seen processes or statistically rare parent-child
    pairs (e.g., a document reader or powershell.exe spawning an ICS-protocol client) are presented as
    correlated evidence with the rarity score and the read-anomaly Volume/Frequency context. This finds
    novel or living-off-the-land tooling that no static blacklist enumerates, strengthening attribution
    of the read activity to a compromised operator station.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4663
  - 'NAI: Endpoint devices identified as EWS or HMIs within the Level 3 (Manufacturing Operations Management)
    zone, and network tap points monitoring traffic between these endpoints and Level 2 (Control Systems)
    PLCs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = proc_name + parent_child freq per host (EventID 4688)
      trigger: plc_read_anomaly(src_host, t0)
      | search idx=win EventID=4688 host=src_host time in [t0-10m,t0+10m]
      | eval rarity = 1 - freq(parent->child, host)
      | where first_seen(NewProcessName,host) OR rarity > 0.99
      | eval note="correlate with read Volume/Frequency context" | alert
- question: Does an LSTM sequence model trained on time-ordered combined host+network event types (e.g.,
    [PLC Read Request, Process Execution, New Network Connection]) score the current sequence as high-confidence
    malicious, and which events contributed most?
  context: >-
    For the Collection tactic, an LSTM sequence model trained on time-ordered combined host+network event
    types (e.g., [PLC Read Request, Process Execution, New Network Connection]) over benign operational
    sequences and known attack paths alerts on high-confidence malicious sequences and surfaces the top-3
    contributing events. This models the temporal choreography of an operator-station pivot into I/O image
    collection that individual rules miss. Keep deterministic correlation rules primary because such sequence
    detectors are evadable; use the model to prioritize and explain multi-stage activity for analyst review.
  answer_sources:
  - Zeek conn.log
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4663
  - 'NAI: Endpoint devices identified as EWS or HMIs within the Level 3 (Manufacturing Operations Management)
    zone, and network tap points monitoring traffic between these endpoints and Level 2 (Control Systems)
    PLCs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      seq = ordered_events(host+network) for src_host window
      model = LSTMSequenceClassifier.load("host_net_linkage.pkl")
      p = model.predict(seq)
      if p >= malicious_threshold:
          alert(severity="high", top3_events=model.attribute(seq,3))
      # deterministic correlation rules stay primary; sequence models are evadable
