name: 'T0877: I-O Image'
id: 63815308-1e2d-4e4c-8573-ac039cecc8ae
description: Investigate whether an adversary is collecting a PLC's I/O image - the input/output process-image
  tables a PLC reads and writes each scan cycle - to understand or prepare to manipulate the industrial
  process. This playbook helps a SOC/OT analyst hunt for ICS protocol read activity (S7COMM 'Read Var',
  Modbus FC03/FC04, EtherNet/IP 'Read Tag') against PLC memory from unauthorized or first-seen sources,
  abnormal read volume or byte/coverage from otherwise authorized HMIs/EWS that may be compromised, out-of-spec
  function codes or memory targets, elevated illegal-function/illegal-address error rates indicative of
  I/O image enumeration, and low-and-slow exfiltration of process values. It pairs deterministic allow-list
  and specification-based detection (the authoritative floor) with statistical baselining (first-seen,
  percentile/sigma outliers, CUSUM, entropy) and machine-learning models, and correlates network PLC-read
  anomalies with host-based events on the source EWS/HMI (process creation, object access) to confirm
  operator-pivot tradecraft.
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
contributors:
- Zachary Szewczyk
