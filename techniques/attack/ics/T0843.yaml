questions:
- question: '[Lateral Movement] Allow-list authorized program-download sources and windows: Can you determine
    whether an ICS program download or write operation (e.g., S7Comm ''Download Block'', ''Write Var'')
    is observed in network traffic, where the connection originates from an IP address not on a managed
    allow-list of authorized Engineering Workstations (EWS) or the activity occurs outside of a scheduled
    maintenance window. -- specifically, using the ''Allow-list authorized program-download sources and
    windows'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0109), an adversary performs an ICS
    program download to transfer or modify a controller''s user program, abusing engineering access to
    reprogram PLCs and manipulate the physical process while moving through the ICS environment. This
    evidence focuses on the condition that an ICS program download or write operation (e.g., S7Comm ''Download
    Block'', ''Write Var'') is observed in network traffic, where the connection originates from an IP
    address not on a managed allow-list of authorized Engineering Workstations (EWS) or the activity occurs
    outside of a scheduled maintenance window. The ''Allow-list authorized program-download sources and
    windows'' approach (Symbolic Logic) works as follows: Detect S7Comm ''Download Block''/''Write Var''
    (and equivalent Modbus/DNP3/EtherNit-IP write/program function codes) and alert when the source IP/host
    is not on the documented Engineering Workstation (EWS) allow-list, the account is unauthorized, or
    the activity falls outside a scheduled maintenance window. Encode valid function codes, command/response
    pairing, and source-destination addressing as deterministic specification rules so out-of-spec downloads
    flag with low false positives ([Mohan et al](https://arxiv.org/abs/2412.07917); [Sen et al](https://arxiv.org/abs/2209.04354);
    [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)). Treat
    any controller-to-controller (PLC source IP) download as inherently malicious peer-reprogramming ([Spenneberg
    et al](https://www.blackhat.com/docs/asia-16/materials/asia-16-Spenneberg-PLC-Blaster-A-Worm-Living-Solely-In-The-PLC-wp.pdf)).
    Note that S7CommPlus downloads may be cryptographically valid yet malicious, so source/window rules
    are required in addition to protocol validity ([Biham et al](https://i.blackhat.com/USA-19/Thursday/us-19-Bitan-Rogue7-Rogue-Engineering-Station-Attacks-On-S7-Simatic-PLCs-wp.pdf)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable program
    download; pivot to the responsible source IP/host and account, the targeted PLC and protocol (e.g.,
    S7Comm/Modbus/DNP3), the function codes and logic blocks involved, the operating-mode state, and the
    timing relative to authorized maintenance windows to scope what was changed. A negative result helps
    rule out this particular vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy online-edit, replay, or living-off-the-land programming activity.'
  answer_sources:
  - Zeek s7.log
  - Zeek conn.log
  - 'NAI: Network choke points such as firewall and switch SPAN ports monitoring traffic between the IT/OT
    DMZ and the Process Control Network (PCN), Engineering Workstation subnet, and network taps at key
    aggregation points in the PCN.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek:s7 OR zeek:conn OR win:security\nWHERE event MATCHES program-download/write/online-edit/cpu-control\
      \ function\n  AND (src_ip NOT IN ews_allow_list OR account NOT IN authorized_engineers\n       OR\
      \ time NOT IN maintenance_windows)\nALERT 'unauthorized program download / out-of-spec ICS write'"
  - technology: Zeek/pseudocode
    query: "for rec in s7.log:\n  if rec.func in {DownloadBlock, WriteVar, InsertBlock, CPU_Control} \\\
      \n     and (rec.src not in EWS_ALLOWLIST or rec.src is_plc or off_window(rec.ts)):\n    emit_alert(rec)"
- question: '[Lateral Movement] Baseline program-download volume and frequency per PLC: Can you determine
    whether an ICS program download or write operation (e.g., S7Comm ''Download Block'', ''Write Var'')
    is observed in network traffic, where the connection originates from an IP address not on a managed
    allow-list of authorized Engineering Workstations (EWS) or the activity occurs outside of a scheduled
    maintenance window. -- specifically, using the ''Baseline program-download volume and frequency per
    PLC'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0109), an adversary performs an ICS
    program download to transfer or modify a controller''s user program, abusing engineering access to
    reprogram PLCs and manipulate the physical process while moving through the ICS environment. This
    evidence focuses on the condition that an ICS program download or write operation (e.g., S7Comm ''Download
    Block'', ''Write Var'') is observed in network traffic, where the connection originates from an IP
    address not on a managed allow-list of authorized Engineering Workstations (EWS) or the activity occurs
    outside of a scheduled maintenance window. The ''Baseline program-download volume and frequency per
    PLC'' approach (Statistical Method) works as follows: Baseline per-PLC hourly download/write counts
    and downloaded byte volume (Volume + Frequency); alert when non-maintenance-window counts exceed mean
    + 3 standard deviations or when byte volume per session exceeds the per-PLC 95th percentile. Derive
    thresholds from 30+ days of site-specific traffic. Because SCADA polling is clock-like, also model
    per-PLC inter-arrival timing with a DFA and automatic phase-shift tracking so non-periodic download
    bursts surface as timing violations ([Lin and Nadjm-Tehrani](https://arxiv.org/abs/1808.05068)); score
    individually-authorized-looking but improbable transactions via packet-pattern probability modeling
    ([Marsden et al](https://arxiv.org/abs/1711.02826)). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates a probable program download; pivot to the responsible source
    IP/host and account, the targeted PLC and protocol (e.g., S7Comm/Modbus/DNP3), the function codes
    and logic blocks involved, the operating-mode state, and the timing relative to authorized maintenance
    windows to scope what was changed. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy
    online-edit, replay, or living-off-the-land programming activity.'
