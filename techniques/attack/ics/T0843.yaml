name: 'T0843: Program Download'
id: 07aec608-0e1b-49ad-98fa-19a106a826bc
description: 'This playbook helps an analyst investigate whether an adversary is performing an ICS program
  download to transfer or modify a controller''s user program (MITRE ATT&CK for ICS T0843, Program Download).
  A program download -- whether a full download-all, an online edit, or a program append -- is the vendor-specific
  suite of API calls (e.g., S7CommPlus, TriStation, Modbus, DNP3, EtherNet/IP) used to reconfigure a controller''s
  logic memory, and adversaries abuse it during Lateral Movement to reprogram PLCs and alter the physical
  process. The hunt pursues this behavior from several complementary angles: ICS program-download/write
  function codes seen in network traffic from sources that are not allow-listed Engineering Workstations
  (EWS) or that occur outside maintenance windows; remote logons and process creations on EWS that are
  immediately followed by connections to PLCs on ICS protocol ports; Stop-then-Download command sequences
  (e.g., CPU change to STOP followed by Download Block) that match the Rogue7 tradecraft; and stealthy
  online edits (''Insert Block'', program append) that modify running logic without a preceding Stop,
  including binary-vs-source divergence consistent with rogue program injection. Detection methods combine
  deterministic symbolic-logic rules (function-code/source/window allow-lists, EWS-to-PLC correlation,
  Stop+Download sequence signatures, online-edit and source-binary consistency checks), statistical baselining
  (per-PLC download volume/frequency, inter-arrival timing via DFA, failure/error-rate profiling, rare
  user-process-PLC tuples, stop-to-download timing, rarely-modified block detection), and machine learning
  (Isolation Forest/DBSCAN outlier scoring, Random Forest tool classification, HMM/seq2seq command-sequence
  modeling) applied across Zeek s7.log/conn.log network telemetry and Windows Security and process-creation
  events, so the analyst can corroborate a suspected program download against host, account, network,
  and process context.'
type: technique
related:
- tactic_id: TA0109
  tactic_name: Lateral Movement
