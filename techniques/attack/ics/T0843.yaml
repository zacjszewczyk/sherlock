  range: Last 90 days (baseline over 30+ days; correlate within event-centered windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM zeek:s7 OR win:security\nSTATS count(downloads), sum(bytes), interarrival(ts) BY plc,\
      \ src, bin(1h)\nBASELINE over 30d (exclude maintenance windows)\nALERT WHERE count > mean+3*stddev\
      \ OR bytes > p95 OR interarrival violates DFA/phase model\n       OR failure_count > daily_baseline"
