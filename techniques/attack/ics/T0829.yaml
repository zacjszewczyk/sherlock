name: 'T0829: Loss of View'
id: 1383e0fb-9e20-4034-84a5-4fd32c4ce68c
description: 'Investigate whether an adversary is causing a sustained or permanent Loss of View, blinding
  operators to the true state of the industrial process. This playbook helps an analyst confirm or refute
  three convergent symptoms: (1) instability or abnormal termination of critical Human-Machine Interface
  (HMI)/historian processes (e.g., iFIX.exe, FactoryTalkView.exe, OPC servers) seen as application error/hang
  events, process terminations without an expected automatic restart, or a cessation of application logging;
  (2) a sustained, statistically significant reduction in expected periodic telemetry from Level 0/1 devices
  (PLCs, RTUs) to Level 2/3 systems (Historian, HMI) over Modbus, DNP3, EtherNet/IP, and OPC UA, observed
  as stalled, frozen, or below-baseline reporting in Zeek logs; and (3) an anomalous surge in failed or
  blocked connections to a critical HMI server indicative of denial-of-service or resource exhaustion
  that denies legitimate operator access. For each symptom the playbook provides deterministic (symbolic-logic)
  floors, statistical-baseline outlier tests, and machine-learning anomaly detection so the visibility
  loss can be detected even when it occurs without affecting the underlying physical process.'
type: technique
related:
- tactic_id: TA0105
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are critical HMI or historian processes (e.g., iFIX.exe, FactoryTalkView.exe, OPC servers)
    crashing, hanging, or terminating without the expected automatic restart on supervisory hosts?
  context: A Loss of View frequently begins with the operator-facing software itself failing on a Level
    2/3 host. Maintain a watchlist of critical HMI/historian process names and look for Windows Event
    ID 1000 (Application Error) or 1002 (Application Hang) where the faulting process is on the watchlist,
    alerting when more than 2 such events occur on a single host within a 60-second window. Separately,
    correlate Event ID 4689 (Process Termination) for a watched process against a matching 4688 (Process
    Creation) on the same host within 30 seconds; a termination with no follow-on creation means the visibility-providing
    process did not come back. NIST SP 800-82r3 designates unexpected termination/loss-of-view functions
    on supervisory hosts as high-priority OT alerting conditions, justifying these deterministic floors.
    A positive result indicates operators may be blind on that console; tune the watchlist and restart-grace
    values per site from asset inventory. This directly supports the Impact tactic by catching the adversary
    hiding the present state of operations.
  answer_sources: &id001
  - Windows Event ID 1000
  - Windows Event ID 1002
  - Windows Event ID 4688
  - Windows Event ID 4689
  - 'NAI: Critical Operator Workstations and HMI Servers within the Level 2 (Supervisory) and Level 3
    (Site Control) zones of the Process Control Network (PCN), including any associated DMZ for remote
    HMI access.'
  range: Last 90 days; correlate 4688/4689 pairs within a 30s event-centered window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'watchlist = [iFIX.exe, FactoryTalkView.exe, OPCServer.exe]

      // crashes/hangs

      EventID IN (1000,1002) AND faulting_process IN watchlist

      | stats count BY host, bin(60s)

      | where count > 2

      // termination without restart

      EventID=4689 AND process IN watchlist AS term

      | join host, process: EventID=4688 within 30s AS create

      | where create IS NULL -> alert "HMI process not restarted"'
- question: Has the rate of HMI application errors/hangs, or the delay before a watched process restarts,
    deviated significantly from its established per-host baseline?
  context: 'Subtle or building instability may not trip a fixed threshold, so baseline each critical HMI
    process over 14 days: the count of Event IDs 1000/1002 per 10-minute interval (take the 99th percentile)
    and, for processes that normally auto-restart, the time delta between 4689 termination and 4688 restart.
    Alert in real time when the 10-minute error count exceeds the 99th percentile, or when a process is
    not restarted within a delay exceeding 3 standard deviations from its mean (tracking restart success/failure
    as a state metric). Apply a CUSUM cumulative-sum statistic to the per-interval error count so small,
    sustained increases preceding a crash accumulate and trip before a single-window threshold would.
    A positive result signals a degrading HMI that may be heading toward a Loss of View; tune percentiles
    to per-host baselines. This ties to Impact by surfacing the slow erosion of operator visibility.'
  answer_sources: *id001
  range: Last 90 days; 14-day baseline, 10-minute evaluation intervals
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// 14-day baseline of errors per 10-min

      baseline = pctile(count(EventID IN (1000,1002)) per 10m, 99) BY host, process

      live: count per 10m > baseline -> alert

      // restart delay

      delay = time(4688) - time(4689) BY host, process

      where delay > mean(delay)+3*stddev(delay) OR no_restart -> alert

      // CUSUM on per-interval error count

      S = max(0, S_prev + (count - mean)); where S > h -> alert'
- question: Does an unsupervised model of HMI host stability flag the current pattern of errors, hangs,
    terminations, and restart failures as anomalous?
  context: 'Build a per-minute time-series dataset from HMI hosts with features: count of Event ID 1000,
    count of Event ID 1002, count of 4689 terminations, count of 4688 creations, and a restart-failure
    flag. Train an unsupervised Extended Isolation Forest on at least 30 days of history to learn normal
    HMI stability, then score live data and alert above a tuned anomaly-score threshold. The model''s
    random-slope splits remove axis bias and yield per-feature contributions, so the alert can name the
    top-3 driving features (e.g., ''1002 hang count, missing restart, 1000 error count''); pair this with
    SHAP-style attribution so analysts immediately see which stalled processes are responsible. Because
    ML detectors are evadable, keep the symbolic and CUSUM floors active. A positive score points to an
    abnormal stability profile consistent with an emerging Loss of View under the Impact tactic.'
  answer_sources: *id001
  range: Last 90 days; train on >=30 days, score per-minute
  queries:
  - technology: ML/pseudocode
    query: 'features per host per minute = [c1000, c1002, c4689, c4688, restart_fail_flag]

      model = ExtendedIsolationForest.fit(history>=30d)

      score = model.decision_function(live)

      if score > threshold: alert(top3_features = shap(model, live))

      // keep symbolic + CUSUM floors active'
- question: Has expected periodic polling traffic between specific PLC/RTU and Historian/HMI pairs stopped
    or exceeded its maximum normal interval?
  context: Loss of View on the wire shows up as telemetry that simply stops arriving. Define critical
    communication pairs (e.g., PLC_IP -> Historian_IP on 502/TCP Modbus, 20000/TCP DNP3, 44818/TCP EtherNet/IP,
    4840/TCP OPC UA) and the expected maximum polling interval for each, then query Zeek conn.log and
    protocol logs in real time, alerting if no communication is seen for a pair for more than 3x its normal
    interval (e.g., >15s for a 5s poll). Enforce protocol-semantic specifications (valid function codes
    and request/response pairing) so suppressed or unpaired reporting is flagged deterministically, and
    model each PLC<->SCADA flow as a deterministic finite automaton with phase handling to catch missing,
    delayed, or extra messages. A positive result means upstream device state is no longer reaching the
    supervisory layer — the canonical Loss-of-View symptom under Impact.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek opcua.log
  - 'NAI: Network sensors monitoring critical network segments at the Level 1.5 (Industrial Demilitarized
    Zone/IDMZ) and Level 2 (Supervisory) boundaries within the Process Control Network (PCN), specifically
    those carrying traffic between Level 0/1 devices (PLCs, RTUs) and Level 2/3 systems (HMI, Historian,
    Engineering Workstations).'
  range: Last 90 days; real-time evaluation against per-pair polling intervals
  queries:
  - technology: Zeek/pseudocode
    query: "pairs = {(PLC_IP,Hist_IP,502):5s,(PLC_IP,Hist_IP,20000):..,(.,.,44818):..,(.,.,4840):..}\n\
      for (src,dst,port),interval in pairs:\n  last = max(ts) FROM conn.log/proto.log WHERE id.orig=src,id.resp=dst,id.resp_p=port\n\
      \  if now-last > 3*interval: alert \"polling gap\"\n// also: flag invalid func_code or unpaired\
      \ request/response (DFA per flow)"
- question: Do mined process invariants over correlated tag values show telemetry going stale or frozen
    rather than continuing to update as expected?
  context: Beyond simple polling gaps, telemetry can keep flowing while values are frozen. Mine invariant
    predicates over correlated tag values from historian/Zeek-decoded telemetry — for example, a given
    register must update at least once per N seconds, or a downstream tag must track an upstream tag within
    tolerance — and enforce them as runtime checks that fire when telemetry goes stale or frozen. This
    catches the canonical Loss-of-View symptom where the operator sees an unchanging, stale picture. The
    alert text must name the violated invariant and the specific stale tag or flow so the analyst can
    pinpoint which part of the process view is compromised. A positive result is strong evidence that
    operators are being shown a non-current state, supporting the Impact tactic.
  answer_sources: *id002
  range: Last 90 days; continuous runtime invariant checking
  queries:
  - technology: SIEM/Rule pseudocode
    query: "invariants = mine(historian_tags)   // e.g. reg_X updates >=1/Ns; tagB tracks tagA +/- tol\n\
      for inv in invariants:\n  if violated(inv, live_telemetry):\n    alert(\"invariant \" + inv.id +\
      \ \" broken; stale tag/flow=\" + inv.target)"
- question: Has the volume, frequency, success ratio, or command diversity of critical ICS flows dropped
    below its statistical baseline for a sustained period?
  context: For each critical flow establish a 7-day rolling baseline per 1-minute interval of total bytes
    (orig_bytes+resp_bytes from conn.log), message count from protocol logs (volume/frequency), and the
    response/request success ratio (state). Compute the 5th percentile and alert when the current 1-minute
    value drops below it for 3 consecutive minutes. Also compute Shannon entropy of the function_code
    field in modbus.log over a 5-minute window and alert if it falls below the 10th percentile of baseline,
    indicating a loss of command diversity. Run a Matrix Profile over per-flow message-rate series so
    abrupt reporting drops surface as discords, and add an FFT/PCA periodicity check so loss of steady
    periodic reporting is detected as spectral-energy collapse. A positive result indicates suppressed
    or degraded telemetry — operators losing view — under the Impact tactic.
  answer_sources: *id002
  range: Last 90 days; 7-day rolling baseline, 1-minute intervals
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// 7-day baseline per 1-min per flow

      base_bytes_p5 = pctile(orig_bytes+resp_bytes,5); base_msg_p5=pctile(msg_count,5)

      if cur_bytes<base_bytes_p5 AND cur_msg<base_msg_p5 for 3 consecutive min: alert

      // command diversity

      H = shannon_entropy(modbus.function_code over 5m)

      if H < pctile(baseline_H,10): alert "loss of command diversity"

      // matrix profile discord + FFT/PCA periodicity collapse on msg-rate series'
- question: Does a forecasting model of critical PLC-to-HMI/Historian traffic show observed volume falling
    below the predicted lower bound for a sustained window?
  context: For each critical PLC-to-HMI/Historian flow build a 5-minute time series (total bytes, packet
    count, duration variance, protocol message counts) and train a forecasting model — SARIMA or a 1D-CNN/seq2seq
    predictor on 30+ days of history. Alert when observed volume falls below the lower bound of the 99%
    prediction interval for a sustained window (>10 minutes). This predict-then-threshold-residual design
    specifically flags suppressed or frozen telemetry that a static baseline might miss because it adapts
    to time-of-day and operational cycles. Surface the top-3 contributing flows/features in the alert
    via SHAP attribution, and keep the symbolic and statistical floors active given ML evasion risk. A
    positive result indicates a quantified telemetry shortfall consistent with Loss of View under the
    Impact tactic.
  answer_sources: *id002
  range: Last 90 days; train on 30+ days, sustained residual window >10 min
  queries:
  - technology: ML/pseudocode
    query: 'ts = per-flow 5-min [total_bytes, pkt_count, dur_var, proto_msg_counts]

      model = SARIMA or 1D-CNN/seq2seq .fit(history>=30d)

      pred, lo99 = model.forecast()

      if observed < lo99 for >10min: alert(top3=shap(model))

      // retain symbolic/statistical floors'
- question: Is a critical HMI server experiencing a surge of failed or blocked inbound connections consistent
    with denial-of-service or resource exhaustion?
  context: An adversary can deny operator visibility by flooding or exhausting the HMI server. Maintain
    HMI server IPs and application ports, then query Zeek conn.log for connections to these assets with
    conn_state 'S0', 'REJ', or 'RSTO' and alert if a single source IP generates more than 30 such connections
    in 30 seconds OR the total from all sources exceeds 100 in 60 seconds (volume plus state-failure metric).
    Separately query Windows Filtering Platform Event ID 5156/5157 on HMI servers and alert when inbound
    blocked packets from one source exceed 50 in 60 seconds. NIST SP 800-82r3 frames denial-of-service
    and communication disruption against supervisory assets as high-priority OT conditions warranting
    deterministic thresholds. A positive result means legitimate operators may be unable to reach the
    HMI — a direct Loss of View under the Impact tactic; derive per-asset counts from baselines.
  answer_sources: &id003
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 5157
  - 'NAI: Network sensors and host logs on critical HMI Servers within the Level 2 (Supervisory) zone
    of the Process Control Network (PCN) and any associated IDMZ or enterprise DMZ enabling remote access
    to HMI systems.'
  range: Last 90 days; 30-60 second evaluation windows
  queries:
  - technology: Zeek/pseudocode
    query: 'hmi = {HMI_IPs, app_ports}

      conn.log WHERE id.resp IN hmi AND conn_state IN (''S0'',''REJ'',''RSTO'')

      | (count BY src in 30s > 30) OR (count all in 60s > 100) -> alert

      // host firewall

      EventID IN (5156,5157) AND direction=inbound AND blocked

      | count BY src in 60s > 50 -> alert'
- question: Have both the new-connection rate and the failed-to-total connection ratio on an HMI server
    simultaneously exceeded their statistical baselines?
  context: For each HMI server, baseline over 7 days the 5-minute rolling average of (a) total new connections
    and (b) the failed-to-total ratio ('S0','REJ','RSTO' over all). Compute the 99th percentile for (a)
    and the 95th for (b) and alert when both are exceeded simultaneously, explicitly profiling the failure/blocked-connection
    rate as a distinct signal. Feed damped-window packet/byte-rate, jitter, and inter-arrival statistics
    into a per-flow online scoring ensemble (Kitsune-style autoencoders) to capture connection-rate surges,
    and apply a CUSUM statistic to the failed-connection rate so a sustained low-rate flood accumulates
    and trips. A positive result indicates abnormal connection pressure and failure on the HMI consistent
    with a DoS that produces Loss of View under the Impact tactic.
  answer_sources: *id003
  range: Last 90 days; 7-day baseline, 5-minute rolling windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// 7-day 5-min baseline per HMI

      new_conn_p99 = pctile(new_conn_rate,99)

      fail_ratio_p95 = pctile(count(S0,REJ,RSTO)/count(all),95)

      if new_conn>new_conn_p99 AND fail_ratio>fail_ratio_p95: alert

      // CUSUM on failed-conn rate; Kitsune autoencoder per-flow score'
- question: Does an unsupervised network model flag the traffic pattern to an HMI server as a denial-of-service
    or aggressive-scanning anomaly?
  context: 'From conn.log traffic to HMI servers build per-minute feature vectors: connection rate, Shannon
    entropy of source IPs and source ports, ratio of ''S0'' to ''SF'' states, blocked-packet count (Event
    ID 5156), and average connection duration. Train an unsupervised detector (One-Class SVM or Extended
    Isolation Forest) on at least 30 days of normal traffic and alert on outliers consistent with DoS
    or aggressive scanning. Random-Forest/Extended-Isolation-Forest feature importance names the top-3
    drivers (e.g., ''connection rate, S0:SF ratio, source-port entropy'') in the alert. Retain the deterministic
    and statistical floors above because time-series ICS detectors are demonstrably evadable. A positive
    result points to abnormal network behavior against the HMI that can blind operators — Loss of View
    under the Impact tactic.'
  answer_sources: *id003
  range: Last 90 days; train on >=30 days, score per-minute
  queries:
  - technology: ML/pseudocode
    query: 'watchlist = [iFIX.exe, FactoryTalkView.exe, OPCServer.exe]

      // crashes/hangs

      EventID IN (1000,1002) AND faulting_process IN watchlist

      | stats count BY host, bin(60s)

      | where count > 2

      // termination without restart

      EventID=4689 AND process IN watchlist AS term

      | join host, process: EventID=4688 within 30s AS create

      | where create IS NULL -> alert "HMI process not restarted"0'
