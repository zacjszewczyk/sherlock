name: 'T0847: Replication Through Removable Media'
id: 09195329-6167-497b-a141-d24e63c83d31
description: Investigate suspected adversary use of removable media (USB drives, removable disks) to replicate
  malware onto ICS endpoints that are physically accessible but isolated from the enterprise or untrusted
  networks. This playbook helps an analyst hunt for unauthorized or anomalous removable-device attachments
  against a per-asset hardware allowlist and historical insertion-rate baseline; for processes launched
  directly from removable volumes whose hashes, command lines, parent lineage, or PE characteristics indicate
  malicious or obfuscated/packed binaries; for post-execution network behavior such as connections to
  known-bad or never-before-seen destinations, anomalous TLS/DNS, SMB/RPC peer-to-peer propagation, and
  egress bursts indicative of C2 or beaconing; and for persistence mechanisms (services, scheduled tasks,
  autorun registry keys, kernel drivers) created shortly after a removable-media execution. It combines
  symbolic-logic correlation rules, statistical baselining and change-point detection, and explainable
  machine learning so a SOC analyst can detect air-gap relay tooling and worm-style propagation (e.g.,
  Stuxnet-class threats) across Engineering Workstations, HMIs, Historians, SCADA servers, data gateways,
  and technician laptops.
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
