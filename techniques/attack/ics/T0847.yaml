questions:
- question: Has a removable storage device whose vendor ID, product ID, or serial number is not on the
    approved per-asset hardware allowlist been attached to any Windows-based ICS endpoint, and was the
    attaching account outside the approved maintenance group?
  context: 'Initial Access via removable media begins the moment an unapproved device is plugged into
    a physically accessible but network-isolated ICS host. Windows Plug-and-Play audit event 6416 records
    the device ClassId/ClassName, vendor ID (VID), product ID (PID), and serial number for each newly
    recognized external device. Because ICS hosts change hardware very rarely, maintaining a per-asset
    (or asset-class) allowlist of approved VID:PID:Serial tuples yields very low false positives; any
    mass-storage-class device not on that allowlist is a high-severity event. A positive result is an
    unknown USB/removable device attached to an EWS, HMI, historian, or SCADA host - especially when the
    attaching SubjectUserSid is outside the sanctioned maintenance group, which strongly suggests an unauthorized
    or third-party-introduced device used to seed malware. A negative result (device matches the allowlist
    and account is authorized) supports benign maintenance activity. References: [6416(S): A new external
    device was recognized by the System, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [Enhancing SCADA Security: A Host-Based Intrusion Detection System, Sen et al.](https://arxiv.org/abs/2402.14599);
    [USB-based attacks, Nissim, Yahalom & Elovici](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Operator
    Consoles, Data Gateways, SCADA Servers, portable technician laptops, any Windows-based ICS endpoint
    with USB/removable media access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule device_attach:\n  src = WinEvent 6416\n  extract ClassId, ClassName, vid, pid, serial,\
      \ SubjectUserSid from src\n  if ClassName == 'mass-storage' and (vid:pid:serial) NOT IN approved_allowlist[asset]:\n\
      \    severity = high\n    if SubjectUserSid NOT IN approved_maintenance_group: severity = critical\n\
      \    alert(host, vid, pid, serial, SubjectUserSid)"
- question: Does the rate of removable-device attachment events on any ICS asset deviate sharply from
    its rolling historical baseline, or is there an abrupt sustained shift or a spike in policy-denied
    (blocked) insertion attempts?
  context: 'Worm-driven media churn and repeated unauthorized insertion attempts both manifest as anomalies
    in the time series of removable-device attachments. For each ICS asset, build a rolling baseline (>=60
    days) of attachment counts (Windows Event ID 6416) per day and per operator shift, then alert when
    a window exceeds the historical mean by k standard deviations (start at k=3) using an explainable
    mean+k*sigma approach. Running change-point detection (CUSUM or Bayesian online change point) on the
    same series flags abrupt, sustained shifts in insertion rate while tolerating normal diurnal/shift
    seasonality. Separately tracking the count of rejected/blocked (policy-denied) 6416 events is a distinct
    failure-mode signal: a burst of denials indicates someone repeatedly trying to insert unauthorized
    media. A positive result is a statistically significant insertion spike or change point, or a cluster
    of blocked attempts, on a host that normally sees stable, low device activity - consistent with Initial
    Access attempts via removable media. References: [Finding Anomalies in Windows Event Logs Using Standard
    Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf); [A
    Survey of Methods for Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Operator
    Consoles, Data Gateways, SCADA Servers, portable technician laptops, any Windows-based ICS endpoint
    with USB/removable media access.'
  range: Last 90 days (baseline window >=60 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats per asset:\n  series = count(WinEvent 6416) by host, day, shift over >=60d\n  mean,sigma\
      \ = baseline(series)\n  alert if today_count > mean + 3*sigma\n  changepoint = CUSUM(series); alert\
      \ on sustained shift\n  denied = count(WinEvent 6416 where status='blocked/denied') by host, window\n\
      \  alert if denied spikes vs baseline"
- question: Was a process created on an ICS endpoint from a removable media volume whose SHA256 hash is
    not on that asset's software allowlist, or that shows propagation signatures such as an unexpected
    parent, autorun.inf/.lnk launch, hidden/system attributes, or a system-mimicking filename?
  context: 'Once malicious code is on removable media, execution from that volume is the pivotal Initial
    Access step. Detect process-creation events (Windows Event ID 4688 or Sysmon Event ID 1) whose image
    path matches a removable drive letter (regex ^[D-Z]:\\.*), correlating the drive letter back to a
    prior removable-media mount via event 6416. For each match, look up the process SHA256 against an
    asset-specific software allowlist and raise a high-severity alert when the hash is unknown, following
    the stable-host binary-allowlisting model. Escalate when the parent process is not explorer.exe or
    another known legitimate initiator, or when the binary was auto-loaded via autorun.inf/.lnk, carries
    hidden/system attributes, or uses a system-mimicking filename - all documented removable-media propagation
    signatures (e.g., Stuxnet). A positive result is an unapproved binary running off USB on an ICS host;
    a negative result is an allowlisted, expected tool launched interactively by an operator. References:
    [6416(S): A new external device was recognized by the System, Microsoft](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-6416);
    [Enhancing SCADA Security: A Host-Based Intrusion Detection System, Sen et al.](https://arxiv.org/abs/2402.14599);
    [W32.Stuxnet Dossier, Falliere, O Murchu & Chien](https://docs.broadcom.com/doc/security-response-w32-stuxnet-dossier-11-en);
    [USB-based attacks, Nissim et al.](https://www.sciencedirect.com/science/article/abs/pii/S0167404817301578).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Operator
    Consoles, Data Gateways, SCADA Servers, Portable technician laptops, any Windows-based ICS endpoint
    with USB/removable media access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule exec_from_removable:\n  proc = (WinEvent 4688 OR Sysmon 1) where image_path ~= '^[D-Z]:\\\
      \\.*'\n  mount = correlate WinEvent 6416 (drive_letter == proc.drive)\n  if proc.sha256 NOT IN allowlist[asset]:\
      \ severity = high\n  if parent_image != 'explorer.exe' OR autorun_or_lnk OR hidden_system_attr OR\
      \ mimic_name:\n    severity = critical\n  alert(host, proc.image_path, proc.sha256, parent_image)"
- question: For processes launched from removable media on an ICS asset, does the command-line entropy
    exceed that asset's 95th-percentile baseline, does the executable's byte/section entropy exceed the
    ~7.0 packing threshold, or does the per-process read/copy envelope show unusual bulk reads from the
    media?
  context: 'Obfuscated command lines and packed payloads are common evasion traits of malware staged on
    removable media. For each ICS asset keep a 90-day rolling baseline of Shannon entropy of command lines
    for processes launched from removable media and alert above the 95th percentile, which indicates obfuscation.
    In parallel compute the byte/section entropy of the executable itself and flag values above ~7.0,
    the established packing threshold. Use the explainable mean+k*sigma baselining method, and profile
    the per-process operation envelope (open/read/copy counts) so unusual bulk reads from removable media
    stand out against the host''s normal-behavior profile. A positive result is a high-entropy command
    line or packed binary, or anomalous mass reads from the media, on an otherwise predictable ICS host
    - all consistent with malware attempting Initial Access via removable media. A negative result is
    entropy and I/O within normal bounds for known engineering tools. References: [EMBER, Anderson & Roth](https://arxiv.org/abs/1804.04637);
    [Finding Anomalies in Windows Event Logs, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [A Sense of Self for Unix Processes, Forrest et al.](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Operator
    Consoles, Data Gateways, SCADA Servers, Portable technician laptops, any Windows-based ICS endpoint
    with USB/removable media access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats per asset:\n  for proc launched from removable media:\n    cl_entropy = shannon(command_line)\n\
      \    alert if cl_entropy > p95(baseline_cl_entropy[asset])\n    pe_entropy = byte_section_entropy(image)\n\
      \    alert if pe_entropy > 7.0\n    io = open/read/copy counts; alert if io > mean + 3*sigma (bulk\
      \ read)"
- question: Does an explainable machine-learning classifier score a process executed from removable media
    as malicious (probability > 0.90) based on static-PE features, suspicious parent-child lineage, or
    anomalous runtime API-call sequences?
  context: 'Allowlists and entropy thresholds miss novel or polymorphic variants, so layer machine learning
    over removable-media executions. Deploy an explainable gradient-boosted classifier (e.g., LightGBM)
    that scores executions in real time on static-PE features (section/header metadata, imports, byte-entropy
    histogram, signer status), complemented by a parent-child lineage classifier that flags removable-media
    binaries spawning powershell/wscript/cmd, and a runtime API-call sequence model (LSTM/GRU or TF-IDF+XGBoost)
    for deeper coverage of novel variants. Trigger investigation when malicious probability exceeds 0.90,
    and require the alert to surface the top-3 contributing features (e.g., section entropy, unsigned
    binary, anomalous parent) so analysts can act without re-deriving the score. A positive result is
    a high-confidence malicious classification of a USB-launched binary on an ICS host - strong evidence
    of attempted Initial Access via removable media. References: [EMBER, Anderson & Roth](https://arxiv.org/abs/1804.04637);
    [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676); [Mal-API-2019, Catak](https://github.com/ocatak/malware_api_class).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Operator
    Consoles, Data Gateways, SCADA Servers, Portable technician laptops, any Windows-based ICS endpoint
    with USB/removable media access.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model removable_exec_classifier:\n  features = static_PE(section_entropy, imports, byte_hist,\
      \ signer)\n  + lineage(parent->child spawns powershell/wscript/cmd)\n  + api_seq(LSTM/GRU or tfidf+xgboost)\n\
      \  p = predict_proba(proc)\n  if p > 0.90: alert(host, proc, top3_feature_attribution)"
- question: Within 5 minutes of a removable-media execution on an ICS host, did that host connect to a
    threat-intel-listed IP/domain, present a known-bad JA3/JA3S or self-signed external certificate, or
    initiate SMB/RPC (port 445) peer-to-peer traffic or insert->execute->write-back loops to the media?
  context: 'After Initial Access via removable media, malware frequently reaches out for command and control
    or propagates to peers. Build a stateful correlation rule that fires when a host generating a removable-media
    execution alert also produces a network connection (Zeek conn.log) within a 5-minute window. Raise
    a critical alert if the destination IP/domain (correlated via Zeek dns.log) is in a threat-intel feed,
    if a Zeek ssl.log record shows a known-bad JA3/JA3S or a self-signed certificate on an external connection,
    or if the host initiates SMB/RPC on port 445 - the peer-to-peer update channel used by Stuxnet. Also
    flag insert->execute->write-back loops to removable media characteristic of air-gap relay tooling
    (e.g., USBStealer/Sednit). A positive result is removable-media execution immediately followed by
    malicious or propagation-style network activity; a negative result is no correlated network activity
    or only known-good destinations, supporting a benign verdict. References: [W32.Stuxnet Dossier, Falliere
    et al.](https://docs.broadcom.com/doc/security-response-w32-stuxnet-dossier-11-en); [Sednit/USBStealer,
    ESET](https://www.welivesecurity.com/2014/11/11/sednit-espionage-group-attacking-air-gapped-networks/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek files.log
  - 'NAI: The IT/OT network boundary, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs),
    Historian Servers, Perimeter firewalls, Network Intrusion Detection Systems (NIDS) at the IT/OT boundary,
    ICS network switches and routers where Zeek sensors are deployed.'
  range: Last 90 days, with 5-minute event-centered correlation after each removable-media execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule exec_to_network:\n  exec = removable_media_exec_alert(host, t0)\n  conn = Zeek conn.log\
      \ where host==exec.host and ts in [t0, t0+5m]\n  dom = correlate Zeek dns.log; ssl = correlate Zeek\
      \ ssl.log\n  if conn.dest in threat_intel OR ssl.ja3/ja3s in badlist OR ssl.self_signed_external:\n\
      \    alert critical\n  if conn.dport==445 (SMB/RPC peer): alert critical\n  if insert->execute->writeback\
      \ loop to media: alert"
- question: In the hour following a removable-media execution, does the ICS asset use a destination port
    never before seen from it, transfer bytes exceeding its 99th-percentile baseline, or show a spike
    in failed/blocked connections, NXDOMAIN responses, or rejected egress at the IT/OT boundary?
  context: 'Beaconing, C2 discovery, and data movement after Initial Access produce statistical deviations
    from an asset''s normal network profile. For each ICS asset establish a 30-day rolling baseline of
    unique destination ports and average data volume (orig_bytes + resp_bytes) per connection. After a
    removable-media execution, monitor the asset for one hour and alert when a connection uses a never-before-seen
    destination port or total bytes exceed the 99th percentile of baseline, using mean+k*sigma/percentile
    baselining and change-point detection on the connection-rate series. Explicitly profile the failure
    state: a spike in failed/blocked connections, NXDOMAIN responses, or rejected egress at the IT/OT
    boundary following execution is itself a high-value signal of beaconing or C2 discovery. A positive
    result is post-execution network behavior that breaks the asset''s tight baseline; ICS hosts normally
    talk to a small fixed set of peers, so deviations are meaningful and low-noise. References: [Finding
    Anomalies in Windows Event Logs, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek files.log
  - 'NAI: The IT/OT network boundary, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs),
    Historian Servers, Perimeter firewalls, Network Intrusion Detection Systems (NIDS) at the IT/OT boundary,
    ICS network switches and routers where Zeek sensors are deployed.'
  range: Last 90 days (baseline 30 days), 1-hour post-execution monitoring window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats per asset (baseline 30d unique dports, p99 bytes):\n  after removable_media_exec(host,\
      \ t0):\n    for conn in [t0, t0+1h]:\n      alert if conn.dport NOT IN seen_ports[asset]\n     \
      \ alert if (orig_bytes+resp_bytes) > p99(bytes[asset])\n    alert if spike in failed/blocked conns\
      \ OR NXDOMAIN OR rejected egress at IT/OT boundary"
- question: Does an Extended Isolation Forest scoring 60-second aggregations of an ICS host's network
    traffic flag the 10 minutes after a removable-media execution as anomalous based on new connections,
    unique destination ports, byte volume, byte ratio, and failed connections?
  context: 'Subtle post-compromise network bursts that evade single-metric thresholds can be caught with
    multivariate anomaly detection. Score 60-second time-series aggregations of a host''s traffic with
    an Extended Isolation Forest (random-slope splits for robust, artifact-free scoring) over features:
    count of new connections, count of unique destination ports, total bytes, outbound/inbound byte ratio,
    and count of failed/blocked connections. When a removable-media execution is detected, score the subsequent
    10 minutes; an anomaly score beyond a tuned threshold raises an alert that must list the top-3 contributing
    features (per-feature attribution) so analysts see why the burst is anomalous. A positive result is
    an anomalous post-execution network burst on a normally stable ICS asset, consistent with C2 or propagation
    after Initial Access via removable media; a negative result is traffic that stays within the learned
    normal envelope. References: [Extended Isolation Forest, Hariri, Kind & Brunner](https://arxiv.org/abs/1811.02141).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek files.log
  - 'NAI: The IT/OT network boundary, Engineering Workstations (EWS), Human-Machine Interfaces (HMIs),
    Historian Servers, Perimeter firewalls, Network Intrusion Detection Systems (NIDS) at the IT/OT boundary,
    ICS network switches and routers where Zeek sensors are deployed.'
  range: Last 90 days, 10-minute scoring window after each removable-media execution.
  queries:
  - technology: ML/pseudocode
    query: "model net_burst_eif:\n  agg = 60s windows of [new_conns, uniq_dports, total_bytes, out/in_ratio,\
      \ failed_conns]\n  after removable_media_exec(host, t0):\n    score = ExtendedIsolationForest(agg\
      \ in [t0, t0+10m])\n    if score > threshold: alert(host, top3_feature_attribution)"
- question: Within 10 minutes of a removable-media execution, was a new service, scheduled task, or autorun
    registry value created on the ICS host pointing to a temporary or user-writable directory, or was
    a kernel-mode driver/service registered with a signing anomaly?
  context: 'Establishing persistence shortly after execution is a hallmark of malware seeking to survive
    reboots on ICS assets. Build a correlation rule linking a removable-media process execution (Sysmon
    Event ID 1) to a subsequent persistence-creation event (Windows Event ID 7045/4698 or Sysmon Event
    ID 12/13/14) on the same host within 10 minutes. Alert when the new service/task ImagePath or autorun
    registry value points to a temporary or user-writable directory (e.g., C:\ProgramData\ or AppData\Local\Temp),
    or when a kernel-mode driver/service is registered with a signing anomaly - mirroring the rootkit
    driver-load persistence (mrxnet.sys/mrxcls.sys) documented in the Stuxnet case. A positive result
    is fresh persistence tied temporally to a USB execution on an ICS host, strongly indicating successful
    Initial Access and footholding; a negative result is no new persistence or only expected, signed,
    properly located entries. References: [W32.Stuxnet Dossier, Falliere et al.](https://docs.broadcom.com/doc/security-response-w32-stuxnet-dossier-11-en).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 7045
  - Windows Event ID 4698
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, SCADA Servers,
    any Windows-based ICS endpoint with USB/removable media access.'
  range: Last 90 days, with 10-minute event-centered correlation after each removable-media execution.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "rule exec_to_persistence:\n  exec = Sysmon 1 from removable media (host, t0)\n  pers = (WinEvent\
      \ 7045/4698 OR Sysmon 12/13/14) where host==exec.host and ts in [t0, t0+10m]\n  if pers.image_path\
      \ ~ ('ProgramData' OR 'AppData\\\\Local\\\\Temp' OR user-writable):\n    alert high\n  if pers is\
      \ kernel-mode driver with signing_anomaly: alert critical"
- question: When a new persistence entry follows a removable-media event, is its primary identifier (service
    name, scheduled-task command line, or autorun registry key-value pair) absent from the known-good
    baseline for that ICS asset class?
  context: 'ICS asset classes (EWS, HMI, historian) run a small, stable set of services, tasks, and autorun
    entries, so first-seen persistence is highly suspicious. Maintain a historical baseline of all known-good
    service names, scheduled-task command lines, and autorun registry key-value pairs per ICS asset class.
    When a new persistence entry follows a removable-media event, check whether its primary identifier
    (name, path, value) exists in the baseline; flag any zero-day/first-seen entry for immediate analyst
    review, tracking the count of never-before-seen persistence entries per window as an explainable mean+k*sigma
    deviation. A positive result is a persistence identifier never observed before on that asset class
    appearing right after a USB execution - a strong Initial Access/persistence indicator; a negative
    result is a known, baselined entry, supporting benign maintenance. References: [Finding Anomalies
    in Windows Event Logs, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 7045
  - Windows Event ID 4698
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, SCADA Servers,
    any Windows-based ICS endpoint with USB/removable media access.'
  range: Last 90 days (baseline derived from full known-good history).
  queries:
  - technology: SIEM/Stats pseudocode
    query: "stats persistence_baseline per asset_class:\n  known_good = {service_names, task_cmdlines,\
      \ autorun_kv}\n  on new persistence after removable_media_event:\n    if identifier(name/path/value)\
      \ NOT IN known_good: flag first_seen for review\n  track count(first_seen per window); alert if\
      \ > mean + 3*sigma"
- question: Does a one-class outlier model (one-class SVM or Extended Isolation Forest) flag a persistence
    entry created after a removable-media event as anomalous based on name/path string entropy, path depth,
    creating account type, and binary signature status?
  context: 'Some malicious persistence entries are crafted to look plausible, so train a one-class model
    on features of known-benign persistence entries (name/path string entropy, path depth, creating account
    type, binary signature status) and classify each new entry created after a removable-media event.
    Alert on outliers with the top-3 contributing features surfaced for explainability, using the robust
    per-feature attribution of Extended Isolation Forest. A positive result is a persistence entry whose
    feature profile (e.g., high-entropy name, deep temp path, unsigned binary, unusual creating account)
    places it outside the benign cluster on an ICS host that just executed code from removable media -
    indicating likely malicious footholding; a negative result is an entry that fits the learned benign
    distribution. References: [Extended Isolation Forest, Hariri et al.](https://arxiv.org/abs/1811.02141).'
  answer_sources:
  - Windows Event ID 6416
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 7045
  - Windows Event ID 4698
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, SCADA Servers,
    any Windows-based ICS endpoint with USB/removable media access.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model persistence_oneclass:\n  train on benign persistence features [name/path_entropy, path_depth,\
      \ account_type, signature_status]\n  on new persistence after removable_media_event:\n    if outlier(entry):\
      \ alert(host, top3_feature_attribution)"
- question: Does a DeepLog-style LSTM log-sequence model flag the host event chain device-mount (6416)
    -> execute-from-removable (Sysmon 1) -> persistence (7045/4698, Sysmon 12/13) as anomalous because
    the observed sequence or its parameters fall outside the top-g predicted next keys?
  context: 'The full removable-media kill chain - mount, execute, persist - forms a recognizable event
    sequence that deviates from normal per-host behavior. Train an LSTM log-sequence model (DeepLog-style)
    on normal per-host event-key sequences so the scripted chain device-mount (6416) -> execute-from-removable
    (Sysmon 1) -> persistence (7045/4698, Sysmon 12/13) is flagged when the observed sequence or its parameters
    (unexpected paths, byte counts) fall outside the top-g predicted next keys. The model''s workflow
    reconstruction provides the deviating step for triage; complement with a per-process syscall-sequence
    self-profile. A positive result is an event sequence on an ICS host that does not match the learned
