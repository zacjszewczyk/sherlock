name: 'T0894: System Binary Proxy Execution'
id: 92203e32-5d5a-435f-9d01-4ebf57d845a8
description: Investigate whether an adversary is abusing signed, trusted, or vendor-supplied binaries
  to proxy the execution of malicious commands or payloads on ICS hosts, thereby bypassing process- and
  signature-based defenses. This playbook helps an analyst hunt for trusted ICS application binaries (e.g.,
  ProjectLoader.exe, HMI applications, SCADA server binaries) and native Microsoft-signed LOLBAS binaries
  (rundll32.exe, mshta.exe, regsvr32.exe, certutil.exe, msiexec.exe) that are invoked with suspicious
  command-line arguments, that initiate unapproved outbound network connections, or that spawn unauthorized
  child processes such as command shells, script interpreters, or dual-use admin tools. It correlates
  Windows process-creation telemetry (Event ID 4688) with Zeek network flow, DNS, and TLS logs to surface
  proxy execution, command-and-control egress, and anomalous process chains across engineering workstations,
  HMIs, SCADA/Historian servers, data gateways, and jump hosts. Symbolic-logic allow-list/ruleset detections
  run in parallel with statistical baselines (command-line length/entropy, rare ports/protocols/JA3, beaconing
  periodicity, rare parent-child pairs) and machine-learning models (supervised command-line classification,
  unsupervised flow anomaly detection, and provenance-graph anomaly detection) so deterministic floors
  remain while anomaly models add explainable coverage for a sophisticated adversary living off trusted
  binaries.
type: technique
related:
- tactic_id: TA0103
  tactic_name: Evasion
