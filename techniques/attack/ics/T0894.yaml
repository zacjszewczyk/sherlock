questions:
- question: Did a trusted ICS application binary or a native Microsoft-signed LOLBAS binary (e.g., rundll32.exe,
    mshta.exe, regsvr32.exe, certutil.exe, msiexec.exe, or a vendor tool like ProjectLoader.exe) execute
    with command-line arguments containing known proxy-execution abuse patterns such as base64/encoded
    commands, download-and-execute cradles, scriptlet or remote handlers (javascript:, vbscript:, http://,
    https://, UNC paths), or script file extensions (.js, .vbs, .ps1, .hta, .sct)?
  context: 'System Binary Proxy Execution lets an adversary bypass signature- and process-based defenses
    by hiding malicious activity behind a signed or operator-trusted binary, which is the core of the
    Evasion tactic in ICS. Query Windows Event ID 4688 process-creation events where the image or parent
    is a known ICS application or a LOLBAS-cataloged signed binary, and apply a deterministic ruleset
    to the CommandLine field for documented abuse patterns: download/execute cradles (''IEX'', ''DownloadString'',
    ''DownloadFile''), base64 (-enc/-EncodedCommand), scriptlet/remote handlers (javascript:, vbscript:,
    http://, https://, \\<untrusted_ip>), and script extensions (.js, .vbs, .ps1, .hta, .sct). Prioritize
    rundll32/mshta/regsvr32/certutil/msiexec invocations that reference remote URLs. A positive match
    is a strong, deterministic indicator of proxy execution and should alert; a negative result narrows
    the hunt but does not clear statistical/ML checks. Preserve the concrete binary/keyword/regex indicators
    as the deterministic floor.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Historian Servers,
    Data Gateways within the OT network, and Jump Hosts used for remote OT access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID=4688 AND (new_process IN ics_trusted_binaries OR new_process IN lolbas_signed_binaries
      OR parent_process IN ics_trusted_binaries) AND command_line MATCHES /(IEX|DownloadString|DownloadFile|-enc|-EncodedCommand|javascript:|vbscript:|https?:\/\/|\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}|\.(js|vbs|ps1|hta|sct))/i
      => raise alert
- question: For each trusted ICS process, does a new process-creation event have a command-line length
    or Shannon entropy above its 30-day 99th-percentile baseline, and does the command-line character
    distribution also diverge sharply (high KL-divergence) from a known-good/English baseline, or show
    abnormal execution-frequency bursts?
  context: Adversaries abusing trusted binaries frequently pass long, obfuscated, or encoded arguments
    that differ from how operators normally launch the same ICS application, so statistical drift in the
    command line is a tactic-relevant Evasion signal. For each unique trusted process name (e.g., HMI_App.exe)
    build a 30-day rolling baseline of CommandLine length and Shannon entropy from Windows Event ID 4688
    and compute the 99th percentile of each; flag any event exceeding either threshold. To suppress false
    positives from legitimately high-entropy strings (GUIDs, hashes), additionally compute Kullback-Leibler
    divergence of the command-line character distribution against an English/known-good baseline and alert
    only when divergence is also high. Track per-process execution frequency (executions/min) and flag
    bursts beyond the baseline 99th percentile, and record argument count and the presence of redirection/pipe
    tokens as state. A combined length/entropy + KL anomaly is a high-confidence lead; a single metric
    alone warrants enrichment rather than immediate escalation.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Historian Servers,
    Data Gateways within the OT network, and Jump Hosts used for remote OT access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = stats over last 30d by process_name: p99(len(command_line)), p99(shannon_entropy(command_line)),
      p99(exec_per_min); for each new EventID=4688: if len(command_line)>baseline.len_p99 OR entropy(command_line)>baseline.entropy_p99
      then if KL_divergence(charDist(command_line), known_good_dist)>threshold OR exec_per_min>baseline.freq_p99
      => raise alert'
- question: When a supervised classifier scores the command line of a trusted-binary process creation
    event (Windows Event ID 4688) above the tuned malicious-probability threshold (e.g., 0.90), what TF-IDF
    n-gram features drove the score, and does it corroborate the deterministic and statistical checks?
  context: To catch novel obfuscation that escapes static rules, train a supervised classifier (Random
    Forest or XGBoost) on TF-IDF n-gram vectors of benign vs. malicious command-line arguments specific
    to the ICS environment, then score each new Windows Event ID 4688 CommandLine and alert above a tuned
    probability such as 0.90. This model runs in parallel with the deterministic ruleset and never replaces
    it, preserving the Evasion-tactic detection floor. Include in every alert the top-3 contributing TF-IDF
    tokens/features via SHAP so analysts can see why the command line scored malicious and quickly validate
    or dismiss it. A high score with intelligible malicious tokens (encoded blobs, remote URLs, scriptlet
    handlers) is actionable; a high score with benign-looking drivers usually signals model drift and
    should feed retraining.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Historian Servers,
    Data Gateways within the OT network, and Jump Hosts used for remote OT access.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: score = RF_or_XGBoost.predict_proba(tfidf_ngrams(command_line)); if score>=0.90 then explain
      = SHAP_top3(features); raise alert with [score, explain]; run in parallel with deterministic ruleset
- question: Did a trusted ICS application or native Windows binary (correlated by process ID/GUID from
    Event ID 4688 to a Zeek conn.log flow) initiate an outbound connection to a destination IP, subnet,
    port, or protocol that is not on its approved allow-list, or to a domain/IP matching known C2 threat
    intelligence?
  context: A trusted binary reaching out to the internet or across the OT/IT boundary is a classic sign
    that proxy execution is being used for command-and-control or staging, directly supporting the Evasion
    tactic by hiding C2 behind a signed process. Correlate Windows Event ID 4688 with Zeek conn.log by
    process GUID/ID and source IP, and maintain a strict allow-list of approved destination IPs, subnets,
    ports, and protocols per critical ICS application; alert when a trusted process connects outside its
    allow-list. Apply the proxy-binary egress pattern in which a signed binary (mshta/rundll32/regsvr32)
    initiates outbound HTTP/S or spawns a child that connects, and detect SMB/DCE-RPC remote execution/file-write
    staging. Match destination IPs/domains (Zeek dns.log) against threat intel of known C2. A hit outside
    the allow-list, especially to an external or newly-registered destination, is high priority; allow-listed
    flows are expected baseline.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: ICS Network Segments (e.g., Control Network, Process Network), Industrial Demilitarized Zone
    (IDMZ), SCADA Firewalls, and network taps at key egress/ingress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'correlate EventID=4688.process_guid with conn.log by source_ip+pid; for trusted_process flows:
      if (resp_h NOT IN allowlist[process].ips) OR (resp_p NOT IN allowlist[process].ports) OR (proto
      NOT IN allowlist[process].protocols) OR (dns.log query IN c2_intel) => raise alert'
- question: Over a 30-day Zeek baseline per trusted process, did the process use a destination port, protocol,
    or JA3/JA3S fingerprint that is new or in the bottom 5th percentile of rarity, show beaconing-like
    periodicity (low coefficient of variation of inter-arrival time and consistent payload size), exhibit
    high-entropy/DGA-like DNS query names, or have anomalous failed-connection / NXDOMAIN rates?
  context: Adversaries using trusted binaries for C2 often betray themselves through rare network attributes
    and regular callback timing rather than overt rule matches, which is the statistical complement to
    allow-listing for the Evasion tactic. Profile each trusted process's network behavior over a 30-day
    Zeek baseline and alert when it uses a destination port, protocol, or JA3/JA3S fingerprint (Zeek ssl.log)
    that is new or in the bottom 5th percentile of rarity. Detect periodic low-volume C2 callbacks using
    beaconing analysis on conn.log (FFT periodicity and coefficient of variation of inter-arrival time
    and payload size; alert on CV < ~0.1 with consistent byte counts). Compute Shannon entropy and KL-divergence
    of DNS query names and alert above the 95th percentile for DGA. Track volume (orig/resp byte ratio),
    frequency (connections/min), and state by explicitly profiling failed/blocked connection and NXDOMAIN
    rates per process as distinct signals. Convergence of rare fingerprint + steady beacon is strong;
    isolated rarity warrants enrichment.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: ICS Network Segments (e.g., Control Network, Process Network), Industrial Demilitarized Zone
    (IDMZ), SCADA Firewalls, and network taps at key egress/ingress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per trusted_process over 30d from conn.log/ssl.log/dns.log; alert if resp_p OR proto
      OR ja3/ja3s is new or rarity<p05; OR beaconing: CV(inter_arrival)<0.1 AND stddev(payload_bytes)~0;
      OR entropy(dns_query)>p95 OR KL(dns_query)>p95; OR failed_conn_rate/nxdomain_rate>baseline => raise
      alert'
- question: Does an unsupervised model (Isolation Forest, compared against One-Class SVM) trained on baseline
    Zeek conn.log flows for trusted processes assign a high anomaly score to a live flow, and which features
    (rare ASN, abnormal byte ratio, unseen port, unusual duration) drove that score?
  context: Unsupervised modeling catches trusted-process network behavior that is anomalous without matching
    any predefined rule or rare-attribute threshold, extending Evasion-tactic coverage to novel C2 channels.
    Train an unsupervised model (Isolation Forest, with One-Class SVM as a robustness comparator) on baseline
    Zeek conn.log flows attributed to trusted processes using features proto, resp_p, duration, orig_bytes,
    resp_bytes, and destination ASN, then apply it to live traffic and alert on high anomaly scores. Surface
    the top-3 contributing features (e.g., rare ASN, abnormal byte ratio, unseen port) in the alert using
    LIME/SHAP so the analyst can triage quickly. This model runs in parallel with the deterministic allow-list,
    never replacing it. A high score whose drivers point to external/rare infrastructure is actionable;
    benign drivers indicate baseline drift and feed retraining.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: ICS Network Segments (e.g., Control Network, Process Network), Industrial Demilitarized Zone
    (IDMZ), SCADA Firewalls, and network taps at key egress/ingress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = IsolationForest(features=[proto,resp_p,duration,orig_bytes,resp_bytes,dest_asn]) trained
      on trusted_process baseline flows; for each live flow: s=model.anomaly_score(flow); if s>threshold
      then explain=SHAP_or_LIME_top3(flow); raise alert; run in parallel with allow-list'
- question: Did a trusted ICS binary or a critical Windows system process (e.g., services.exe, lsass.exe,
    winlogon.exe) spawn a child process that is not on the environment's allow-list of legitimate parent-child
    pairs — particularly a command shell, script interpreter, or dual-use binary (cmd.exe, powershell.exe,
    wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, bitsadmin.exe, psexec.exe)?
  context: Proxy execution frequently manifests as an unexpected parent-child relationship in which a
    trusted or system process launches an interpreter or admin tool, a high-fidelity Evasion indicator
    on stable ICS hosts where the process tree rarely changes. Maintain a strict allow-list of legitimate
    parent-child pairs observed in the stable ICS environment from Windows Event ID 4688 and alert on
    any pair not on the list, especially a trusted ICS binary or critical system process (services.exe,
    lsass.exe, winlogon.exe) spawning a shell/interpreter/dual-use binary (cmd.exe, powershell.exe, wscript.exe,
    cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, bitsadmin.exe, psexec.exe). Use the unusual-parent-process-for-cmd
    pattern as reference and enumerate abusable binaries from the LOLBAS project. Keep concrete process-name
    pairs as the deterministic floor; any off-list spawn of an interpreter under a trusted parent is immediately
    suspicious.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Historian Servers,
    Jump Hosts, and Domain Controllers within the OT network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID=4688 where (parent_process IN ics_trusted_binaries OR parent_process IN ['services.exe','lsass.exe','winlogon.exe'])
      AND new_process IN ['cmd.exe','powershell.exe','wscript.exe','cscript.exe','mshta.exe','rundll32.exe','regsvr32.exe','bitsadmin.exe','psexec.exe']
      AND (parent_process,new_process) NOT IN approved_pairs => raise alert
- question: Over a 60-day window, is an observed parent-child process pair new to the environment or in
    the bottom 1st percentile of frequency (weighted higher when the child is a command interpreter or
    admin tool), and is there a burst of spawns or repeated rapid spawn-and-exit of a shell under a trusted
    binary?
  context: Statistically rare process lineage is a robust way to surface proxy execution that does not
    match an explicit allow-list rule, complementing deterministic detection within the Evasion tactic.
    Over a 60-day window build a frequency table of unique parent-child pairs from Windows Event ID 4688
    and alert when an observed pair is new to the environment or falls in the bottom 1st percentile of
    frequency, weighting higher when the child is a command interpreter or admin tool. Track per-pair
    frequency (spawns/min) and flag bursts beyond baseline, and record process exit/failure state — repeated
    rapid spawn-and-exit of a shell under a trusted binary is a distinct signal of scripted or automated
    proxy execution. A rare pair plus a burst or rapid spawn-exit cycle is high-confidence; a single rare-but-stable
    pair may be benign rare maintenance.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Historian Servers,
    Jump Hosts, and Domain Controllers within the OT network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq = count over last 60d by (parent_process,new_process) from EventID=4688; for each new
      pair: if pair NOT IN freq OR freq[pair].rank<p01 (weight x2 if new_process IN interpreters/admin_tools)
      OR spawns_per_min>baseline_burst OR rapid_spawn_and_exit(pair) => raise alert'
- question: When process/file/network events are modeled as a provenance graph, does an inductive GNN
    (GraphSAGE) or graph temporal autoencoder (KAIROS-style) flag a trusted ICS binary taking an unseen
    structural role — parenting a never-before-seen process type or originating an unusually deep chain
    — and what anomalous subgraph and nodes explain it?
  context: Multi-stage proxy execution often spans several processes, files, and network connections that
    look individually benign but form an anomalous chain, which graph modeling captures for the Evasion
    tactic. Model process/file/network events as a provenance graph and learn normal structure with an
    inductive GNN (GraphSAGE), scoring each new node/edge and alerting when a trusted ICS binary takes
    an unseen structural role (parents a process type never seen, or originates an unusually deep chain).
    For correlated multi-stage detection and automatic reconstruction of the attack subgraph, apply a
    graph temporal autoencoder over whole-system provenance. Surface the anomalous subgraph and top contributing
    nodes/features in the alert for explainable triage, and run alongside the deterministic allow-list.
    A reconstructed subgraph linking a trusted binary to interpreters, file writes, and egress is strong
    evidence; isolated structural novelty warrants enrichment.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), SCADA Servers, Historian Servers,
    Jump Hosts, and Domain Controllers within the OT network.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'build provenance graph from process/file/network events; model=GraphSAGE (or KAIROS temporal
      autoencoder) trained on normal structure; for each new node/edge: s=model.score(node); if s>threshold
      (trusted_binary parents unseen process_type OR chain_depth>baseline) then reconstruct anomalous
      subgraph; alert with subgraph + SHAP_top_nodes; run alongside allow-list'
