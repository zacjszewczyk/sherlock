    the browser process and its children, the source domain/URL and serving infrastructure, any downloaded
    files or written artifacts, and the timing relative to the user''s browsing session to scope the intrusion
    and any movement toward OT assets. A negative result helps rule out this particular vector but should
    be corroborated with the other questions in this playbook, since obfuscation, encryption, and living-off-the-land
    tradecraft let a single method miss a stealthy watering-hole exploit.'
