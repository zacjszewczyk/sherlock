  context: 'Why this matters: Under the Initial Access tactic (TA0108), an adversary uses Drive-by Compromise
    (T0817) to gain an initial foothold when a user simply visits a compromised or watering-hole website,
    exploiting the browser without further interaction -- a vector repeatedly used against ICS/OT trade
