name: 'T0817: Drive-by Compromise'
id: 7dd489c6-3bd2-4b74-8cf3-802e9ea5596b
description: 'This playbook helps an analyst investigate whether an adversary has gained initial access
  to a host in the ICS or supporting corporate environment through a drive-by compromise (MITRE ATT&CK
  for ICS T0817, Drive-by Compromise), in which a user''s web browser is exploited simply by visiting
  a compromised or watering-hole website -- a vector documented against ICS/OT trade publications and
  trusted third-party suppliers in campaigns such as Dragonfly against the Western energy sector. The
  hunt pursues the behavior from several complementary angles: browser processes (chrome.exe, msedge.exe,
  iexplore.exe, firefox.exe) on critical OT assets spawning anomalous children such as command shells,
  script interpreters, or unsigned binaries from user-writable paths; DNS queries and connections to known-malicious,
  newly registered, algorithmically generated, or anomalous-TLS-certificate domains; browser downloads
  of executable/script files with risky MIME types, file-type/extension mismatches, or low-prevalence
  hashes; outbound HTTP/S requests bearing suspicious, outdated, rare, or process-mismatched User-Agent
  strings and non-browser TLS fingerprints; and retrieved web content containing exploit-kit or watering-hole
  obfuscation such as hidden iframes, dense eval/unescape usage, heap-spray patterns, and high-entropy
  strings. Detection methods combine deterministic symbolic-logic rules, statistical baselining (prevalence,
  entropy, volume, frequency, and failure-state profiling with 3-sigma and percentile thresholds), and
  machine learning (Random Forest/gradient-boosting process and download classifiers, Isolation Forest
  DNS anomaly detection, encrypted-traffic and JS/AST classifiers, all with SHAP explanations), applied
  across Zeek conn/dns/ssl/x509/http/files logs, web proxy response bodies, and Windows/Sysmon process,
  file, and network events, so the analyst can corroborate a suspected drive-by against host, network,
  file, and content context.'
type: technique
