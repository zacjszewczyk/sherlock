questions:
- question: '[Initial Access] Alert on browser-spawned suspicious processes (Symbolic Logic): For the
    observed behavior -- A web browser process (e.g., chrome.exe, iexplore.exe) on a critical ICS asset,
    such as an engineering workstation or HMI, spawns a child process not typically associated with web
    browsing. Anomalous child processes include command shells (cmd.exe, powershell.exe), script interpreters
    (wscript.exe, cscript.exe), or unsigned executables executing from a temporary or user-writable path
    such as `C:\Users\<user>\AppData\Local\Temp\`. -- how can an analyst use the ''Alert on browser-spawned
    suspicious processes'' approach (Symbolic Logic) to determine whether a drive-by compromise has occurred
    on a host in the ICS or supporting environment?'
  context: 'Why this matters: Under the Initial Access tactic (TA0108), an adversary uses Drive-by Compromise
    (T0817) to gain an initial foothold when a user simply visits a compromised or watering-hole website,
    exploiting the browser without further interaction -- a vector repeatedly used against ICS/OT trade
    publications and trusted third-party suppliers (e.g., the Dragonfly energy-sector campaign). This
    evidence focuses on: A web browser process (e.g., chrome.exe, iexplore.exe) on a critical ICS asset,
    such as an engineering workstation or HMI, spawns a child process not typically associated with web
    browsing. Anomalous child processes include command shells (cmd.exe, powershell.exe), script interpreters
    (wscript.exe, cscript.exe), or unsigned executables executing from a temporary or user-writable path
    such as `C:\Users\<user>\AppData\Local\Temp\`. The ''Alert on browser-spawned suspicious processes''
    approach works as follows: Alert when a browser (chrome.exe, msedge.exe, iexplore.exe, firefox.exe)
    spawns cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe, or rundll32.exe, or any unsigned
    binary from a user-writable path (%TEMP%, %APPDATA%, %USERPROFILE%\Downloads); also flag command lines
    with exploit/cradle patterns (mshta http, rundll32 javascript:, IEX/DownloadString, -enc base64).
    On OT hosts the legitimate browser-child allowlist is tiny so any such lineage is high-fidelity [Suspicious
    Browser Child Process](https://github.com/elastic/detection-rules/blob/main/rules/macos/execution_initial_access_suspicious_browser_childproc.toml)
    [Sigma](https://github.com/SigmaHQ/sigma). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable drive-by compromise; pivot to the responsible host (engineering
    workstation, HMI, operator console, or historian), the browser process and its children, the source
    domain/URL and serving infrastructure, any downloaded files or written artifacts, and the timing relative
    to the user''s browsing session to scope the intrusion and any movement toward OT assets. A negative
    result helps rule out this particular vector but should be corroborated with the other questions in
    this playbook, since obfuscation, encryption, and living-off-the-land tradecraft let a single method
    miss a stealthy watering-hole exploit.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Zeek conn.log
  - 'NAI: Endpoint hosts including Engineering Workstations, Human-Machine Interface (HMI) terminals,
    operator consoles, and data historians within the Supervisory Control (Purdue Level 2) and Site Operations
    (Purdue Level 3) networks where process creation logs are collected.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on browser-spawned suspicious processes

      // Sources: Windows Event ID 4688, Windows Event ID 1 (Sysmon), Zeek conn.log

      FILTER events scoped to NAI assets

      MATCH the symbolic conditions described: Alert when a browser (chrome.exe, msedge.exe, iexplore.exe,
      firefox.exe) spawns cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe, or rundll32.exe,
      or any unsigned binary from a user-writable path (%TEMP%, %APPDATA%, %USERPROFILE%\Downloads); also
      flag command lines with exploit/cradle pa

      WHERE host IN nai_assets

      => RAISE alert with host, user, process/parent, domain/url, file/hash context'
