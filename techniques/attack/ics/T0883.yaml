name: 'T0883: Internet Accessible Device'
id: 5827e757-0ea1-4a20-9acc-d62d338bc777
description: Investigate whether an adversary is reaching ICS/OT assets that are exposed directly to the
  internet for remote access, allowing entry into the control system network without exploiting a vulnerability.
  This playbook helps an analyst examine inbound connections from external, non-allowlisted addresses
  to ICS-specific ports (e.g., 102/S7, 502/Modbus, 20000/DNP3, 44818/EtherNet-IP, 47808/BACnet) and remote-access
  ports (22/SSH, 3389/RDP, 5900/VNC); bursts of failed remote logins and password-spray/brute-force behavior
  against internet-facing HMIs, EWS, and jump servers; successful but anomalous remote logins that deviate
  from a user's behavioral profile (new geo/ASN, off-hours, non-allowlisted source); and suspicious post-login
  egress such as new outbound ports, low-reputation DNS, or large data transfers. It combines deterministic
  rules, statistical baselining, and machine-learning models to detect scanning, credential abuse, and
  follow-on command-and-control consistent with the Internet Accessible Device initial-access vector.
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
