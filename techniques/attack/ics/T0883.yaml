  - 'NAI: Endpoint security logs on internet-facing Windows-based assets in the process control or supervisory
    networks (Purdue Levels 2-3), authentication logs from Domain Controllers in the IT/OT DMZ (Purdue
    Level 3.5), and network security monitoring sensors at the network perimeter.'
  range: Last 90 days, with 14-day baseline and 5-minute entropy windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  per asset: baseline 14d hourly count(4625 ext, types 3/10); Mz=(x-median)/(1.4826*MAD);\n\
      \  alert if x>p99 or |Mz|>3.5;\n  per source over 5m: H = ShannonEntropy(TargetAccountName); low\
      \ H=brute-force, high H=spray;\n  score first-time (source->asset) auth edge via Bayesian new-edge\
      \ prediction"
- question: Does a supervised classifier separate benign from malicious external login attempts to OT
    assets with high confidence based on auth, flow, and RDP features?
  context: 'When labeled history is available, train a supervised Random Forest or Gradient Boosting classifier
    to distinguish benign from malicious external login attempts. Engineer features from Event ID 4625
    (Logon Type, Status/Sub-Status code, failures/min, distinct accounts), conn.log (geo, ASN, hour),
    and rdp.log (cookie, client name); Random Forests on industrial flow/auth features yield strong accuracy
    with interpretable feature importance, with an Isolation Forest fallback for unlabeled outliers. Alert
    on confidence > 0.9 and include the top-3 contributing features (e.g., failures/min, distinct-account
    count, source ASN reputation) in the alert text. Keep the deterministic 4625 thresholds active in
    parallel so novel attacks are still caught. A positive result is a high-confidence malicious classification
    of an external login attempt against an OT asset.


    References: [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests, Duque
    Anton et al](https://arxiv.org/abs/1907.10374); [Isolation Forest](https://doi.org/10.1145/2133360.2133363)'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - 'NAI: Endpoint security logs on internet-facing Windows-based assets in the process control or supervisory
    networks (Purdue Levels 2-3), authentication logs from Domain Controllers in the IT/OT DMZ (Purdue
    Level 3.5), and network security monitoring sensors at the network perimeter.'
  range: Last 90 days for training; near-real-time scoring.
  queries:
  - technology: ML/Pseudocode
    query: "  X = features(4625: LogonType, Status/SubStatus, failures_per_min, distinct_accounts;\n \
      \              conn.log: geo, ASN, hour; rdp.log: cookie, client_name);\n  clf = RandomForest/GradientBoosting(train\
      \ on labeled benign vs malicious);\n  fallback = IsolationForest(unlabeled outliers);\n  alert if\
      \ clf.confidence>0.9; emit top-3 feature importances; keep 4625 thresholds active"
- question: Did a successful remote login (Event ID 4624, Logon Type 10/3) to an OT asset originate from
    an external IP that is not on the pre-approved per-account allowlist or expected VPN/third-party range?
  context: 'A successful external login that bypasses the IDMZ/jump host is the clearest sign that an
    internet-accessible device has yielded initial access. Raise a high-priority alert for any successful
    login (Event ID 4624, Logon Type 10/3) where Source Network Address is external (not RFC1918) and
    not on the pre-approved per-account IP allowlist. If no per-user allowlist exists, alert on any external
    login not sourced from the corporate VPN or an approved third-party range. NIST SP 800-82r3 makes
    direct external remote access to OT assets an exception-only event, and the exposed-device entry vector
    is well documented. A positive result is an out-of-policy successful remote logon to a control asset
    that demands immediate triage; a negative result confirms successful remote access is coming only
    through sanctioned paths.


    References: [Guide to Operational Technology (OT) Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Uncovering Vulnerable Industrial Control Systems from the Internet Core](https://arxiv.org/abs/1901.04411)'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Approved Remote Access IP Whitelist
  - Active Directory Logs
  - 'NAI: Endpoint security logs on internet-facing Windows-based OT assets, authentication logs from
    central servers (Domain Controllers, RADIUS) in the IT/OT DMZ, and an Identity and Access Management
    (IAM) system or asset database containing whitelists of approved remote access IPs and user roles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  logins = EventID==4624 and LogonType in [10,3] and SourceNetworkAddress not in RFC1918;\n\
      \  alert if SourceNetworkAddress not in per_account_allowlist;\n  if no per_account_allowlist: alert\
      \ if SourceNetworkAddress not in [corp_vpn, approved_third_party_ranges];\n  priority=high; enrich\
      \ with AD account/role context"
- question: Does a successful remote login deviate from the account's 90-day behavioral profile enough
    to exceed its personal risk-score threshold, or create a never-before-seen source-to-asset edge?
  context: 'Compromised-but-valid credentials produce successful logins that look legitimate per-event
    but drift from a user''s history. For each remote-access account, build a 90-day profile (source countries/ASNs,
    typical hours/days, prior source subnets) and score each new successful login by summing deviation
    points (new country +3, unusual hour +1, new subnet +1), alerting above the 98th percentile of that
    user''s historical scores with robust median/MAD scaling so a few off-hours events do not inflate
    the baseline. Treat a never-before-seen source-to-asset login edge as a strong independent signal
    via Bayesian new-edge prediction. A positive result is a successful OT login that materially departs
    from how that account normally behaves, suggesting credential misuse following internet-accessible-device
    access.


    References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [On Bayesian new edge prediction and anomaly detection in computer networks, Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)'
