      \ procs correlate to egress by host_ip and timestamp; retain full session capture"
- question: In the session after an anomalous login, does the asset's outbound activity deviate from its
    30-day baseline (new port, abnormal volume, DNS/connection failure bursts)?
  context: 'Follow-on activity from a compromised OT asset shows up as egress that breaks the host''s
    tight baseline. For the session after an anomalous login, compare each new outbound connection from
    the asset (id.orig_h) against its 30-day baseline on destination country/ASN, id.resp_p, and bytes
    (orig_bytes+resp_bytes), alerting on a never-before-used port or a transfer above the 99th percentile
    (robust median/MAD threshold). As failure-mode signals, profile DNS failure rate (NXDOMAIN bursts
    in dns.log) and blocked-connection (REJ/S0) rate from the host as distinct beaconing/exfil indicators.
    First-time external destination edges are scored via Bayesian new-edge prediction. A positive result
    indicates exfiltration or C2 behavior after the suspicious login; a negative result indicates post-login
    egress matches normal operations.


    References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [On Bayesian new edge prediction and anomaly detection in computer networks, Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)'
