questions:
- question: Are external, non-allowlisted source IP addresses connecting inbound to ICS-specific or remote-access
    ports on assets inside the OT network, with connection states that look like scanning or probing?
  context: 'Internet-exposed control assets are a primary initial-access vector for the Initial Access
    tactic: an adversary who can simply reach an HMI, PLC, or jump host over the internet can move directly
    into the control system network without an exploit. Build a deterministic rule over Zeek conn.log
    that flags inbound sessions where the source is not RFC1918 and not on the approved remote-access
    allowlist, the destination is within the defined OT range, and the destination port is in the ICS/remote-access
    watchlist (22, 102, 502, 9600, 20000, 44818, 47808, 3389, 5900). Per NIST SP 800-82r3, any inbound
    external connection to a process-control/IDMZ segment should be exception-only, so a hit is inherently
    suspicious. Rejected (''REJ'') or half-open (''S0'') states indicate scanning; very short successful
    (''SF'') sessions with minimal bytes indicate probing. Completed ICS sessions should additionally
    be validated for in-spec function codes. A positive result means an external party is touching OT
    services that should never be internet-reachable; a negative result helps confirm the boundary is
    holding.


    References: [Uncovering Vulnerable Industrial Control Systems from the Internet Core](https://arxiv.org/abs/1901.04411);
    [Guide to Operational Technology (OT) Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [Distributed Intrusion Detection System using Semantic-based Rules for SCADA in Smart Grid](https://arxiv.org/abs/2412.07917);
    [ICSLure: A Very High Interaction Honeynet for PLC-based Industrial Control Systems](https://arxiv.org/abs/2509.04080)'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network security monitoring sensors at the IT/OT boundary (Purdue Level 3.5/DMZ), internet gateway
    firewalls, and network taps within the supervisory control network (Purdue Level 2).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  inbound = conn.log where id.orig_h not in RFC1918 and id.orig_h not in remote_access_allowlist\n\
      \    and id.resp_h in OT_RANGE and id.resp_p in [22,102,502,9600,20000,44818,47808,3389,5900];\n\
      \  alert if conn_state in ['S0','REJ'];\n  alert if conn_state=='SF' and duration<5 and (orig_bytes+resp_bytes)<100;\n\
      \  for completed ICS sessions: validate function_code/command-response pairing, alert on out-of-spec;\n\
      \  log every inbound OT session in full for triage"
- question: Is there a statistically abnormal burst of distinct external source IPs contacting a given
    OT port, or an external source sweeping many OT ports, compared to the established baseline?
  context: 'Coordinated scanning and reconnaissance against internet-accessible devices precedes initial
    access. Rather than relying on fixed thresholds, baseline the hourly count of unique external source
    IPs per OT destination port over a 14-day rolling window and alert when the current count exceeds
    the 99th percentile, using a median/MAD modified Z-score (|Mz| > 3.5) so occasional batch activity
    does not distort the threshold. Separately, compute the Shannon entropy of destination ports each
    external source contacts within a one-hour window — high entropy indicates a port sweep. Also track
    per-source counts of ''REJ''/''S0'' connections as a horizontal-scan signal, and build a per-source
    attack-pattern vector from the OT function codes/ports touched to group related scanners. A positive
    result indicates organized scanning interest in the OT estate; a negative result indicates inbound
    interest is within normal bounds.


    References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [ICSTrace: A Malicious IP Traceback Model for Attacking Data of Industrial Control System](https://arxiv.org/abs/1912.12828)'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network security monitoring sensors at the IT/OT boundary (Purdue Level 3.5/DMZ), internet gateway
    firewalls, and network taps within the supervisory control network (Purdue Level 2).'
  range: Last 90 days, with 14-day rolling baseline and 1-hour evaluation windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  per (id.resp_p): baseline 14d hourly distinct(id.orig_h) external; Mz=(x-median)/(1.4826*MAD);\n\
      \  alert if x>p99 or |Mz|>3.5;\n  per (id.orig_h, 1h): entropy = ShannonEntropy(id.resp_p set);\
      \ alert on high entropy (port sweep);\n  per (id.orig_h): count(conn_state in ['REJ','S0']) as horizontal_scan_signal;\n\
      \  group sources by attack-pattern vector of OT function_codes/ports touched"
- question: Does an unsupervised anomaly model over inbound flow statistics to OT ports flag connections
    with high reconstruction error or outlier scores indicative of novel scanning or access attempts?
  context: 'Deterministic rules and statistical baselines can miss novel or slow scanning patterns, so
    run an unsupervised online anomaly detector over incrementally computed inbound flow features (bandwidth,
    packet/connection rate, jitter, bytes) to OT ports — an ensemble-of-autoencoders NIDS (Kitsune) alerting
    on high reconstruction error, with an Isolation Forest baseline over the same per-source features
    for low-latency outlier scoring. Train on at least 90 days of historical Zeek conn.log faceted by
    conn_state. Each alert must surface the top-3 contributing features (e.g., unique-dest-port count,
    REJ ratio, connection rate) so an analyst can judge it quickly. Because ICS ML detectors degrade on
    unseen attacks, this runs in parallel with — and never replaces — the deterministic rules. A positive
    result is a flow profile unlike anything in the baseline; a negative result means inbound flows resemble
    normal traffic.


    References: [Kitsune: An Ensemble of Autoencoders for Online Network Intrusion Detection](https://arxiv.org/abs/1802.09089);
    [Isolation Forest](https://doi.org/10.1145/2133360.2133363)'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network security monitoring sensors at the IT/OT boundary (Purdue Level 3.5/DMZ), internet gateway
    firewalls, and network taps within the supervisory control network (Purdue Level 2).'
  range: Last 90 days for training; near-real-time scoring.
  queries:
  - technology: ML/Pseudocode
    query: "  features = incremental_flow_stats(inbound to OT ports: bandwidth, pkt_rate, conn_rate, jitter,\
      \ bytes) faceted by conn_state;\n  model_ae = Kitsune(autoencoder ensemble); score_ae = reconstruction_error(features);\n\
      \  model_if = IsolationForest(per-source features); score_if = anomaly_score(features);\n  alert\
      \ if score_ae high or score_if outlier; emit top-3 contributing features;\n  run in parallel with\
      \ deterministic rules; train on >=90d conn.log"
- question: Is a single external IP generating a burst of failed remote logins (Event ID 4625, Logon Type
    3/10) against an internet-facing OT asset, or spraying single failures across many accounts?
  context: 'Brute-force and password-spray against internet-facing OT assets (HMIs, EWS, jump servers)
    is a direct attempt at initial access — the Bowman dam incident showed an internet-reachable device
    falling to brute force. Aggregate Windows Event ID 4625 (Logon Types 3/10) by Source Network Address
    over a 60-second sliding window and trigger when a single non-RFC1918 source exceeds 5 failures. Also
    detect low-and-slow spray: at least one failure across 10+ distinct Target Account Names from one
    source within 30 minutes. Confirm the external network path via Zeek conn.log and enrich with rdp.log
    (cookie/client name) or ssh.log (client version). Under NIST SP 800-82r3, remote authentication to
    control assets should occur only via the IDMZ and approved jump hosts, so direct external auth attempts
    are exception-only. A positive result is active credential guessing against OT; a negative result
    indicates no concentrated failed-auth activity.


    References: [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf);
    [Detecting Password Spraying Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Guide to Operational Technology (OT) Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - 'NAI: Endpoint security logs on internet-facing Windows-based assets in the process control or supervisory
    networks (Purdue Levels 2-3), authentication logs from Domain Controllers in the IT/OT DMZ (Purdue
    Level 3.5), and network security monitoring sensors at the network perimeter.'
  range: Last 90 days, with 60-second and 30-minute sliding windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  fails = EventID==4625 and LogonType in [3,10] and SourceNetworkAddress not in RFC1918;\n\
      \  burst: per SourceNetworkAddress over 60s window -> alert if count(fails)>5;\n  spray: per SourceNetworkAddress\
      \ over 30m -> alert if distinct(TargetAccountName)>=10 with >=1 fail each;\n  enrich path via conn.log;\
      \ rdp.log(cookie,client_name) or ssh.log(client_version)"
- question: Does the failed-login rate from an external source exceed the asset's robust baseline, and
    does the entropy of targeted account names reveal brute-force versus spray behavior?
  context: 'To catch credential attacks that hide under fixed thresholds, baseline each internet-facing
    OT asset''s hourly rate of external failed logins (Event ID 4625, Types 3/10) over 14 days and alert
    when a single source exceeds the 99th percentile, using a median/MAD modified Z-score (|Mz| > 3.5)
    to resist skew. Compute the Shannon entropy of Target Account Name per source over a 5-minute window:
    low entropy means a brute-force focus on one account, while high entropy means a spray across many
    accounts. Treat a first-time external-source-to-asset authentication edge as an additional anomaly
    via Bayesian new-edge scoring. A positive result reveals statistically abnormal failed-auth pressure
    and characterizes its style; a negative result keeps the asset''s auth pattern within expected bounds,
    supporting the Initial Access investigation.


    References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf);
    [On Bayesian new edge prediction and anomaly detection in computer networks, Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)'
  answer_sources:
  - Windows Event ID 4625
