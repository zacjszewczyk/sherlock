- question: Does a log-sequence model flag the post-login chain of process, DNS, and connection events
    on the OT asset as an improbable (anomalous) sequence?
  context: 'Some malicious follow-on activity is only visible as an unusual ordering of otherwise normal
    events. Model normal post-login event sequences (Event ID 4688 process creations -> dns.log lookups
    -> conn.log connections) with an LSTM log-sequence detector (DeepLog) and alert when the observed
    sequence has low predicted probability — for example, a command interpreter spawning an outbound connection
    to a newly observed domain. Use the model''s per-event diagnosis to surface the top-3 anomalous events
    in the alert. Operate in parallel with the deterministic C2 correlation rule. A positive result is
    a low-probability post-login behavior chain on an OT asset, suggesting hands-on-keyboard or malware
    activity following internet-accessible-device access; a negative result means the sequence matches
    learned normal behavior.


    References: [DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep Learning, Du et
    al](https://doi.org/10.1145/3133956.3134015)'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: Network security monitoring sensors (Zeek) at the ICS perimeter and IT/OT DMZ, endpoint detection
    and response (EDR) logs on the source OT asset (capturing process creation and network filtering events),
    and DNS server logs.'
  range: Last 90 days for training; event-centered scoring after each login.
  queries:
  - technology: ML/Pseudocode
