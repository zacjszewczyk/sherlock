- question: Does an unsupervised UEBA model flag a successful remote login as outside the learned per-user
    behavioral boundary (new ASN, impossible travel, off-hours, unusual client)?
  context: 'To detect anomalous remote access that simple rules miss, train an unsupervised per-user/per-group
    UEBA model (Isolation Forest or one-class SVM) on successful-login features: time since last login,
    geo distance from the prior login, source ASN/reputation, RDP client name (rdp.log), and day/hour.
    Flag logins that fall outside the learned boundary and emit the top-3 contributing features (e.g.,
    new ASN, impossible-travel distance, off-hours) for analyst triage. Run this alongside the deterministic
    allowlist rule rather than replacing it. A positive result is a successful OT login whose feature
    combination is unlike the account''s norm — a hallmark of credential theft exploiting an internet-accessible
    device; a negative result means the login fits learned behavior.


    References: [Isolation Forest](https://doi.org/10.1145/2133360.2133363)'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek rdp.log
