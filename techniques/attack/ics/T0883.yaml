    query: "  X = features(4624 success: time_since_last_login, geo_distance_from_prior, source_ASN/reputation,\n\
      \               rdp.log client_name, day/hour);\n  model = IsolationForest / OneClassSVM per user|group;\n\
      \  alert if outside learned boundary; emit top-3 contributing features;\n  run alongside deterministic\
      \ allowlist rule"
- question: After an anomalous login to an OT asset, did a process on that host initiate an outbound connection
    to a known C2 IP/domain within 60 minutes?
  context: 'Successful initial access via an internet-accessible device is often followed by command-and-control.
    On an anomalous-login alert, run a triggered search: alert if within 60 minutes a process on the host
    (Event ID 4688) initiates an outbound connection (conn.log) to an external IP/domain on a C2 intel
    list, correlating by host IP and timestamp. OT assets have tightly constrained, predictable egress
    under segmentation guidance, so any new outbound external session warrants review, and full session
    capture should be retained for forensic triage. A positive result links a suspicious OT logon to attacker
    infrastructure and elevates the incident; a negative result reduces the likelihood that the anomalous
    login established C2.


    References: [Guide to Operational Technology (OT) Security NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf);
    [ICSLure: A Very High Interaction Honeynet for PLC-based Industrial Control Systems](https://arxiv.org/abs/2509.04080)'
