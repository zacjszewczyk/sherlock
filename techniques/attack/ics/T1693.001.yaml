name: 'T1693.001: System Firmware'
id: a1f9687a-c3a5-486e-bdee-bfb5bfbd31e1
description: Investigate suspected malicious modification of ICS system firmware (T1693.001), in which
  an adversary abuses the firmware-update feature of accessible field devices (PLCs, RTUs, IEDs) or the
  vendor flashing utilities on Engineering Workstations and HMIs to upload malicious, out-of-date, or
  unauthorized firmware images. Because PLC firmware-update mechanisms frequently lack authentication
  or integrity validation, a successful unauthorized image can grant root-level control of the device
  at one of the lowest programming abstraction layers, enabling persistent manipulation of the physical
  process. This playbook helps an analyst determine whether a firmware image was transferred to a critical
  ICS device under anomalous conditions (off-hours, unauthorized source, wrong protocol, missing/invalid
  signature, unknown hash, or anomalous size/entropy) and whether a vendor firmware-flashing utility was
  executed on an EWS/HMI under suspicious context (unauthorized account, non-allowlisted binary, anomalous
  parent process, unknown target device, or outside a change-controlled maintenance window). It combines
  deterministic allowlist and authenticity checks with statistical baselining and machine-learning anomaly
  detection to surface trial-and-error firmware pushes, brute-force attempts, and stealthy implant delivery.
type: technique
related:
- tactic_id: TA0106
  tactic_name: Impair Process Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any firmware-image transfer to a critical ICS device (PLC, RTU, IED) or engineering host
    violate the firmware-transfer allowlist for authorized source, destination, protocol, or maintenance
    window?
  context: Under Impair Process Control (TA0106), an adversary abuses the firmware-update path to load
    an unauthorized image that can grant root-level control of a field device. Enforce allowlists that
    define which sources (authorized EWS/vendor update-server IPs) may push firmware, which destination
    ICS device IPs (from the asset inventory) may receive it, which transfer protocols are designated
    (e.g., TFTP/FTP rather than ad-hoc HTTP/SMB), and which pre-approved maintenance windows are valid.
    Identify firmware images by file extension, MIME type 'application/octet-stream', or magic-byte signature,
    then alert on any image transfer to a critical device that violates the allowlist. Segmentation and
    maintenance-window enforcement are deterministic controls (NIST SP 800-82r3). A positive result (a
    transfer breaking any allowlist dimension) is high-fidelity evidence of unauthorized firmware delivery;
    a negative result narrows the investigation to in-policy update activity.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek tftp.log
  - Zeek smb_files.log
  - Firmware Inventory
  - 'NAI: Process Control Network (PCN) segments hosting PLCs/RTUs, Network segments containing Engineering
    Workstations (EWS), Industrial Demilitarized Zone (IDMZ) for vendor remote access, Enterprise/ICS
    network boundary points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "files.log | where (filename matches firmware_ext OR mime_type == \"application/octet-stream\"\
      \ OR magic_bytes in firmware_signatures)\n| join conn.log on uid\n| where dst_ip in critical_ics_inventory\n\
      | where (src_ip not in authorized_firmware_sources)\n   OR (service not in [\"tftp\",\"ftp\"])\n\
      \   OR (timestamp not within approved_maintenance_window)\n| emit alert \"Firmware transfer allowlist\
      \ violation\""
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek (sourcetype=files OR sourcetype=conn)

      | eval is_firmware = match(filename, firmware_regex) OR mime=="application/octet-stream"

      | where is_firmware AND dst_ip IN (ics_assets)

      | where NOT (src_ip IN (allow_src) AND proto IN ("tftp","ftp") AND in_window(_time))

      | table _time src_ip dst_ip proto filename'
- question: For each firmware image transferred, did it carry a valid vendor code signature and match
    the per-model golden-reference hash, or was it unsigned, signature-invalid, an unknown hash, or a
    rolled-back version?
  context: Within Impair Process Control (TA0106), verifying firmware authenticity is the strongest deterministic
    guard against malicious modification. For every transferred image, require a valid vendor code signature
    and confirm its SHA256/measurement matches the per-model golden reference (NIST SP 800-193). Alert
    and, where possible, block on unsigned, signature-invalid, unknown-hash, or rolled-back (downgraded)
    images. When an exact hash is unknown, use fuzzy hashing (ssdeep) plus magic-byte/structure analysis
    to decide whether the image is a near-variant of known-good firmware or unrelated/tampered. A signature
    or hash mismatch strongly indicates a tampered or out-of-date implant; a high fuzzy-hash distance
    from all known-good baselines warrants escalation even when no exact reference exists.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek tftp.log
  - Zeek smb_files.log
  - Firmware Inventory
  - 'NAI: Process Control Network (PCN) segments hosting PLCs/RTUs, Network segments containing Engineering
    Workstations (EWS), Industrial Demilitarized Zone (IDMZ) for vendor remote access, Enterprise/ICS
    network boundary points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "firmware_transfers\n| lookup golden_reference model OUTPUT expected_sha256, signer\n| eval\
      \ verdict = case(\n    signature_valid==false, \"unsigned_or_invalid\",\n    sha256 != expected_sha256\
      \ AND sha256 NOT IN known_hashes, \"unknown_hash\",\n    version < installed_version, \"rollback\"\
      ,\n    true(), \"ok\")\n| where verdict != \"ok\"\n| emit alert verdict"
  - technology: Python/pseudocode
    query: "for img in transferred_images:\n    if not verify_vendor_signature(img): alert(\"invalid_signature\"\
      , img)\n    elif sha256(img) not in golden_hashes[img.model]:\n        sim = max(ssdeep_compare(img,\
      \ g) for g in golden[img.model])\n        if sim < 90: alert(\"tampered_or_unrelated\", img, sim)"
- question: Did any firmware transfer's size or Shannon entropy deviate more than 3 standard deviations
    from the known-good baseline for that device model, or occur outside the historical maintenance window?
  context: Under Impair Process Control (TA0106), statistical baselining catches firmware tampering that
    evades signature checks. Baseline per device model the firmware image size (bytes), Shannon entropy,
    transfer frequency, and time-of-day from at least 6 months of update history. Alert when transfer
    size or entropy deviates >3 standard deviations (a Volume metric) from the known-good distribution,
    or when timing/source falls outside the historical maintenance window (a Frequency metric). Anomalously
    high whole-file entropy is a strong indicator of packing or encryption of an implant. A deviation
    does not prove malice on its own but, combined with allowlist or authenticity findings, sharply raises
    confidence; a within-baseline result supports routine update activity.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek tftp.log
  - Zeek smb_files.log
  - Firmware Inventory
  - 'NAI: Process Control Network (PCN) segments hosting PLCs/RTUs, Network segments containing Engineering
    Workstations (EWS), Industrial Demilitarized Zone (IDMZ) for vendor remote access, Enterprise/ICS
    network boundary points.'
  range: Last 180 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'firmware_transfers | by device_model

      | eventstats avg(size) as mu_s, stdev(size) as sd_s, avg(entropy) as mu_e, stdev(entropy) as sd_e

      | eval z_size=abs(size-mu_s)/sd_s, z_ent=abs(entropy-mu_e)/sd_e

      | where z_size>3 OR z_ent>3 OR NOT in_window(_time)

      | table _time device_model size entropy z_size z_ent'
- question: Was there a burst of failed, aborted, or blocked firmware transfers to a device (TFTP error
    opcodes, FTP failure replies, connection resets, segmentation blocks) preceding a successful transfer?
  context: Within Impair Process Control (TA0106), the rate of failed/aborted/blocked firmware transfers
    per device is a distinct State signal. Track TFTP error opcodes, FTP failure replies, connection resets,
    and segmentation-blocked attempts. A burst of failures immediately preceding a successful transfer
    indicates trial-and-error firmware pushing, where an adversary iterates on image format, protocol,
    or credentials until one succeeds. Apply failure-mode evaluation discipline so benign retries are
    distinguished from adversarial probing. A failure burst followed by success is a high-priority correlation;
    sporadic isolated failures during a maintenance window are likely benign.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek tftp.log
  - Zeek smb_files.log
  - Firmware Inventory
  - 'NAI: Process Control Network (PCN) segments hosting PLCs/RTUs, Network segments containing Engineering
    Workstations (EWS), Industrial Demilitarized Zone (IDMZ) for vendor remote access, Enterprise/ICS
    network boundary points.'
  range: Last 90 days; correlate failures in the 24 hours preceding any successful firmware transfer
  queries:
  - technology: SIEM/Stats pseudocode
    query: "firmware_attempts | by dst_ip, bin(_time, 1h)\n| stats count(eval(status in [\"tftp_error\"\
      ,\"ftp_fail\",\"rst\",\"blocked\"])) as fails,\n        count(eval(status==\"success\")) as ok\n\
      | where fails >= 5 AND ok >= 1\n| emit alert \"Failed-transfer burst preceding success\""
- question: Does an unsupervised anomaly model flag any firmware transfer as a top-1% outlier, and what
    top-3 features (off-hours timing, unauthorized source, anomalous size/entropy, fuzzy-hash distance)
    drive the score?
  context: Under Impair Process Control (TA0106), train an Isolation Forest or Random Forest on first-party
    Zeek firmware-transfer features (size, entropy, protocol, source/destination, time-of-day, bytes/duration,
    fuzzy-hash similarity) and alert on outliers in the top 1%. The alert MUST list the top-3 contributing
    features using feature-importance/SHAP attribution so an analyst can triage quickly (e.g., off-hours
    timing, unauthorized source IP, anomalous size). Validate the model against unknown-attack generalization
    and keep the deterministic allowlist rules as the non-removable floor so the ML layer augments rather
    than replaces high-confidence logic. A top-1% outlier with corroborating top features is an investigative
    lead; a low score does not clear a transfer that already broke an allowlist rule.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek tftp.log
  - Zeek smb_files.log
  - Firmware Inventory
  - 'NAI: Process Control Network (PCN) segments hosting PLCs/RTUs, Network segments containing Engineering
    Workstations (EWS), Industrial Demilitarized Zone (IDMZ) for vendor remote access, Enterprise/ICS
    network boundary points.'
  range: Last 90 days (model trained on >=6 months of history)
  queries:
  - technology: Python/pseudocode
    query: "X = features(zeek_firmware_transfers)  # size, entropy, proto, src, dst, hour, bytes/dur,\
      \ fuzzy_sim\nmodel = IsolationForest(contamination=0.01).fit(X_train)\nscores = model.decision_function(X)\n\
      for row, s in flagged_top1pct(scores):\n    top3 = shap_top_features(model, row, k=3)\n    alert(\"\
      firmware_delivery_anomaly\", row, top3)"
- question: Was a vendor firmware-flashing utility (e.g., ControlFLASH, Step7/TIA) executed by a non-authorized
    account, with a non-allowlisted hash/signer, against an unknown target IP, or outside an approved
    maintenance window?
  context: Under Impair Process Control (TA0106), the flashing utility on an EWS/HMI is the operator-side
    path to push firmware to field devices. Maintain allowlists of approved utilities (hash + signer),
    the authorized 'ICS Firmware Admins' accounts/group, asset-inventory target IPs, the expected parent
    process, and approved maintenance windows. Alert when the executing process hash/signer is not allowlisted,
    the user is not authorized, the command-line target IP is unknown, or the run is off-cycle. Restrict
    firmware/maintenance tooling to authorized accounts and managed EWS (NIST SP 800-82r3). Even a vendor-signed
    utility is suspicious when its execution context contradicts a planned, change-controlled update.
    A violation on any dimension is a strong lead toward unauthorized flashing.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4672
  - Active Directory security logs
  - Software Inventory
  - 'NAI: Engineering Workstations (EWS) in the Process Control Network, Human-Machine Interfaces (HMIs)
    in the control room, Active Directory domain controllers for the ICS environment, Identity and Access
    Management (IAM) systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=wineventlog EventCode=4688 NewProcessName IN (flashing_utilities)\n| lookup util_allowlist\
      \ hash, signer\n| where NOT allowlisted_binary\n   OR SubjectUserName NOT IN (ics_firmware_admins)\n\
      \   OR cmdline_target_ip NOT IN (ics_assets)\n   OR NOT in_window(_time)\n| table _time host SubjectUserName\
      \ NewProcessName cmdline"
- question: Was a firmware-flashing utility spawned by an unexpected parent process (outlook.exe, winword.exe,
    powershell.exe, cmd.exe) rather than explorer.exe or services.exe?
  context: Within Impair Process Control (TA0106), the parent-child execution chain reveals whether the
    flashing utility was launched interactively by an operator or driven by phishing-delivered or scripted
    code. Alert when a firmware utility is spawned by outlook.exe, winword.exe, powershell.exe, or cmd.exe
    instead of explorer.exe/services.exe, indicating a document macro, script, or remote command initiated
    the run. Corroborate with peer-device program/firmware downloads from non-EWS sources, which is a
    worm-spread observable (PLC-Blaster). A suspicious parent strongly suggests adversary-driven execution
    on the EWS/HMI; an explorer.exe parent during a maintenance window aligns with normal operator behavior.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4672
  - Active Directory security logs
  - Software Inventory
  - 'NAI: Engineering Workstations (EWS) in the Process Control Network, Human-Machine Interfaces (HMIs)
    in the control room, Active Directory domain controllers for the ICS environment, Identity and Access
    Management (IAM) systems.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventCode=4688 NewProcessName IN (flashing_utilities)

      | where ParentProcessName IN ("outlook.exe","winword.exe","excel.exe","powershell.exe","cmd.exe","wscript.exe")

      | emit alert "Firmware utility spawned by anomalous parent"'
- question: Does the firmware-utility execution frequency, time-of-day, target-device set, or parent process
    deviate from the per-host baseline (Z-score > 3 / 99th percentile) over the last 30+ days?
  context: Under Impair Process Control (TA0106), baseline per host the firmware-utility execution frequency,
    time-of-day, and the set of target devices over at least 30 days. Alert on rare parent processes,
    off-hours runs, target-diversity outliers (a host suddenly flashing many or new devices), or execution
    counts exceeding a per-host Z-score >3 (99th percentile) of historical Windows 4688 telemetry. This
    statistical layer catches authorized-but-abnormal activity that allowlist rules pass, such as a legitimate
    utility used at unusual scale or timing. A baseline deviation is an investigative trigger to confirm
    change-control authorization; stable in-baseline activity is consistent with routine maintenance.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4672
  - Active Directory security logs
  - Software Inventory
  - 'NAI: Engineering Workstations (EWS) in the Process Control Network, Human-Machine Interfaces (HMIs)
    in the control room, Active Directory domain controllers for the ICS environment, Identity and Access
    Management (IAM) systems.'
  range: Last 90 days (baseline computed over >=30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EventCode=4688 NewProcessName IN (flashing_utilities) | by host, bin(_time,1d)

      | eventstats avg(daily_runs) as mu, stdev(daily_runs) as sd by host

      | eval z=(daily_runs-mu)/sd

      | where z>3 OR off_hours==true OR distinct_targets > target_baseline

      | table _time host daily_runs z distinct_targets'
- question: Did firmware-utility runs coincide with spikes in failed logons (Event ID 4625), privilege-assignment
    events (4672), or repeated utility crashes/non-zero exits?
  context: Within Impair Process Control (TA0106), correlate firmware-utility runs with authentication
    and privilege telemetry as a distinct State signal. Spikes in failed logons (Event ID 4625), special-privilege
    assignment (Event ID 4672), or repeated utility crashes/non-zero exits around a flash attempt indicate
    brute-forcing of credentials or trial-and-error flashing. Apply failure-mode discipline to separate
    benign retries from adversarial probing. Elevated failure rates clustered around a flash attempt are
    a high-priority correlation, especially when paired with an allowlist or parent-process anomaly; clean
    authentication around an in-policy run is reassuring.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4672
  - Active Directory security logs
  - Software Inventory
  - 'NAI: Engineering Workstations (EWS) in the Process Control Network, Human-Machine Interfaces (HMIs)
    in the control room, Active Directory domain controllers for the ICS environment, Identity and Access
    Management (IAM) systems.'
  range: Last 90 days; correlate authentication events within +/- 1 hour of each utility run
  queries:
  - technology: SIEM/Stats pseudocode
    query: "let runs = EventCode=4688 NewProcessName IN (flashing_utilities)\n| join host, time_window=1h\
      \ with (EventCode IN (4625,4672))\n| stats count(eval(EventCode==4625)) as failed_logons,\n    \
      \    count(eval(EventCode==4672)) as priv_assign by host, run_time\n| where failed_logons >= 5 OR\
      \ priv_assign_anomaly\n| emit alert \"Auth/privilege spike around firmware flash\""
- question: Does a UEBA or sequence model flag any firmware-update session as a high-scoring anomaly,
    and what top-3 features (rare parent, new target device, off-hours, new host) explain it?
  context: Under Impair Process Control (TA0106), train a UEBA or sequence model on per-user/per-host
    execution metadata (account context, parent process, target devices, timing) and alert on high-scoring
    anomalies. Surface the top-3 contributing features in the alert text (e.g., rare parent process, a
    never-before-seen target device, off-hours execution, a new host running the utility) for fast triage.
    Keep deterministic allowlist rules as the non-removable floor and validate the model's generalization
    to unseen behavior. A high-scoring session with explanatory features is an investigative lead toward
    unauthorized flashing; a low score does not override an existing deterministic allowlist or parent-process
    hit.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 4672
  - Active Directory security logs
  - Software Inventory
  - 'NAI: Engineering Workstations (EWS) in the Process Control Network, Human-Machine Interfaces (HMIs)
    in the control room, Active Directory domain controllers for the ICS environment, Identity and Access
    Management (IAM) systems.'
  range: Last 90 days (model trained on >=30 days of behavior)
  queries:
  - technology: Python/pseudocode
    query: "sessions = build_sessions(win4688, win4624, ad_logs)  # user, host, parent, targets, hour\n\
      model = UEBA_sequence_model().fit(history)\nfor s in sessions:\n    score = model.anomaly_score(s)\n\
      \    if score > threshold:\n        alert(\"firmware_session_anomaly\", s, top_features(model, s,\
      \ k=3))"
