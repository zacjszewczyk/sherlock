    with a deterministic finite automaton with automatic phase-shift detection so out-of-sequence or abnormally
    timed transitions are flagged. This supports Execution detection by distinguishing a hurried scripted
    attack or an unusually slow staged change from normal operator-driven downloads. A positive result
    is a sequence whose internal timing deviates from the controller's learned rhythm, prompting closer
    review of the surrounding commands.
