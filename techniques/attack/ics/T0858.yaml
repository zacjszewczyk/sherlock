- question: Does a supervised model trained on combined host features (process lineage, signer, image
    path) and network features (function code, target mode, inter-command timing, success/fail State)
    classify an EWS-initiated mode change as malicious with high confidence, and what are the top-3 contributing
    features?
  context: Fusing host and network context yields the most discriminating view of whether an EWS-initiated
    mode change is legitimate engineering or attacker Execution. Train a supervised model on combined
    host (process lineage, signer, image path) and network (function code, target mode, inter-command
    timing, success/fail State) features and alert on high-confidence malicious classification, surfacing
    the top-3 contributing features for explainability with deployment/drift guidance. This catches malicious
    mode changes that look benign from either the host or network vantage point alone. A high-confidence
    positive is a strong, explainable lead combining who ran what on the host with what it did to the
    controller; the feature attribution focuses the analyst's triage.
