- question: 'Was the complete three-step program-modification sequence observed from one source to one
    controller within a 15-minute window: (1) mode change to PROGRAM/REMOTE, (2) program/block download
    (S7comm ''Download Block'' function_code 0x1B or EtherNet/IP file/PCCC program transfer), then (3)
    mode change back to RUN?'
  context: 'This ordered sequence is the canonical Execution pattern for unauthorized logic modification:
    unlock the controller, push new program logic, then return it to RUN to mask the change. Correlate
    the three steps from a single source to a single controller within a 15-minute window and alert on
    the full sequence as a high-fidelity program-modification indicator, using protocol-semantic correlation.
    A completed sequence is among the strongest possible signals that controller logic was altered - it
    should drive immediate response, forensic capture of the downloaded block, and comparison against
    the known-good project. Because the steps may be spread across the window, stateful correlation (not
    single-event rules) is required.'
  answer_sources:
  - Zeek s7comm.log
  - Zeek enip.log
  - Zeek conn.log
  - 'NAI: Network monitoring points on Level 1 (Control Network) segments housing critical PLCs, and Level
