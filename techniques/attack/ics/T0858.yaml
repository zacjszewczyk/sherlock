- question: Was an operating-mode write (S7comm 0x29 / EtherNet/IP Set Attribute Single) to a controller
    issued from a source 5-tuple that is NOT on the authoritative allowlist of Engineering Workstations,
    jump servers, and maintenance laptops permitted to issue control writes to that controller?
  context: Only a small, known set of hosts should ever change a controller's operating mode. Correlate
    each mode-change write against an authoritative allowlist of EWS, jump servers, and maintenance laptops
    and alert when the source is not authorized to issue control writes to that specific controller, enforcing
    deny-by-default per NIST SP 800-82r3. This directly counters Evasion attempts where an adversary abuses
    a non-engineering host (a compromised HMI, historian, or foothold workstation) to masquerade as a
    legitimate control source. A positive result - a mode change from an unlisted source - is a strong
    unauthorized-access indicator; mapping the source 5-tuple to asset inventory helps the analyst identify
    the offending host immediately.
