name: 'T0858: Change Operating Mode'
id: 3a4d1be6-a12a-48fa-ba31-57f9f3d91086
description: 'Investigate whether an adversary is changing the operating mode of a programmable controller
  (PLC) - for example to PROGRAM, REMOTE, or STOP - in order to evade security controls or to enable unauthorized
  engineering functions such as Program Download. Operating-mode changes are a high-value precursor: PROGRAM/REMOTE
  unlock logic upload/download, while STOP halts execution and forces outputs off, producing real process
  impact. This playbook helps an analyst detect mode-change writes carried over ICS management protocols
  (S7comm ''Set CPU Mode'' function_code 0x29; EtherNet/IP ''Set Attribute Single'' service 0x10, Class
  0x91 Identity, Instance 1, Attribute 8), correlate them against approved maintenance windows and an
  authoritative allowlist of Engineering Workstations, jump servers, and maintenance laptops, and surface
  the tell-tale Evasion and Execution patterns: rejected/failed mode-change attempts (probing or insufficient
  privilege), first-seen source IPs, blocked connections to control ports (TCP/102, TCP/44818), the full
  PROGRAM->Download Block->RUN program-modification sequence within a short window, and host-side precursors
  on engineering hosts (non-allowlisted process creation, outbound connection to a PLC, USB insertion,
  process-memory injection). Symbolic-logic, statistical, and machine-learning methods are provided side-by-side
  so deterministic allowlist and maintenance-window rules run in parallel with baselines and anomaly models
  for defensible, explainable alerting, including detection of the physical consequences (halted logic,
  frozen sensors, forced-off outputs) of an illicit mode change.'
type: technique
