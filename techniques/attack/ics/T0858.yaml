questions:
- question: Was an ICS operating-mode write (S7comm 'Set CPU Mode' function_code 0x29, or EtherNet/IP
    'Set Attribute Single' service 0x10 to Class 0x91 Identity, Instance 1, Attribute 8) setting a controller
    to PROGRAM, REMOTE, or STOP observed at a time that does NOT fall inside a pre-approved, scheduled
    maintenance window?
  context: An adversary trying to avoid defenses (Evasion) will flip a controller into PROGRAM/REMOTE
    to unlock engineering functions, or into STOP to silence it, ideally during normal production when
    no change is authorized. Deterministically decode the ICS management protocol, extract the target
    mode, and join the command timestamp against the authoritative maintenance schedule. Enforce a per-controller
    allowlist of permitted modes with deny-by-default for STOP/PROGRAM during production per NIST SP 800-82r3.
    A positive result - a mode write outside any approved window - is a high-fidelity indicator of unauthorized
    state change; a negative result aligns the write with a sanctioned maintenance activity. The unauthenticated
    S7comm stop/start mechanics make this trivial for an attacker with network access, so out-of-window
    writes deserve immediate attention.
  answer_sources:
  - Zeek s7comm.log
  - Zeek enip.log
  - Zeek conn.log
  - Maintenance Schedule Data
  - 'NAI: Network monitoring points (e.g., network taps, SPAN ports) on Level 1 (Control Network) and
    Level 2 (Supervisory Network) segments, and at the boundary of the Industrial DMZ (IDMZ) to capture
    all PLC-related traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: s7comm.log where rosctr=job AND function_code==0x29 (Set CPU Mode) AND new_mode IN ['PROGRAM','REMOTE','STOP']
      OR enip.log where service==0x10 AND class==0x91 AND instance==1 AND attribute==8 AND new_mode IN
      ['PROGRAM','REMOTE','STOP'] => lookup ts against maintenance_schedule; if NOT within approved_window
      THEN alert
- question: Are there S7comm error-class PDUs (error_class != 0x00) or EtherNet/IP responses carrying
    a non-zero General Status (e.g., 0x0E Attribute Not Settable, 0x08 Service Not Supported) immediately
    following a Set CPU Mode / Set Attribute mode-change attempt, and do they cluster into a burst against
    one or more controllers?
  context: 'Rejected and failed mode-change attempts are a distinct State signal that often reveals an
    actor probing for access or operating with insufficient privilege before a successful change - a hallmark
    of the reconnaissance that precedes Evasion. Treat negative/error responses as their own event stream:
    alert when error responses follow a mode-change request, and especially when several rejected writes
    cluster in a short window against a controller. A burst suggests trial-and-error against protections
    or credential/role limits; a single isolated error may be a benign misconfiguration. Pair this with
    the successful-write detection so both completed and attempted mode changes are visible to the analyst.'
  answer_sources:
  - Zeek s7comm.log
  - Zeek enip.log
  - Zeek conn.log
  - Maintenance Schedule Data
  - 'NAI: Network monitoring points (e.g., network taps, SPAN ports) on Level 1 (Control Network) and
