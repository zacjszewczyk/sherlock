    all PLC-related traffic.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: s7comm.log where error_class!=0x00 following a function_code==0x29 request OR enip.log where
      general_status!=0x00 (e.g., 0x0E,0x08) following a Set Attribute Single mode write => count per
      (src,plc) over 10m; if count>=N THEN alert(burst of rejected mode-change attempts)
- question: Does the hourly count of operating-mode changes for a given PLC (and source pair) exceed its
    empirically derived 99th-percentile baseline, or does a stateful CUSUM test over the deviation cross
    a bounded-false-alarm threshold indicating slow accumulating drift?
  context: Even when each individual mode change looks plausible, an adversary evading defenses may issue
    them at an abnormal rate, or drift slowly above normal in a low-and-slow campaign. Baseline per-PLC,
    per-source-pair mode-change volume (count/hour) over at least 30 days, then alert when the hourly
    count exceeds the 99th percentile AND a CUSUM test over the cumulative deviation crosses a threshold
    tuned for a bounded false-alarm rate, so gradual drift is caught without flooding the analyst. Additionally
    score the rarity of each individual transaction per controller with a probability model. A positive
    result flags either a sudden spike or a sustained creep in mode-change activity that warrants investigation
    against the maintenance record.
  answer_sources:
  - Zeek s7comm.log
  - Zeek enip.log
  - Zeek conn.log
  - Maintenance Schedule Data
  - 'NAI: Network monitoring points (e.g., network taps, SPAN ports) on Level 1 (Control Network) and
    Level 2 (Supervisory Network) segments, and at the boundary of the Industrial DMZ (IDMZ) to capture
    all PLC-related traffic.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'stats: baseline per (plc,src_pair) hourly mode_change_count over >=30d => p99=percentile(99);
      CUSUM_t = max(0, CUSUM_{t-1} + (count_t - mean) - k); alert if count_t>p99 AND CUSUM_t>h; also score
      per-transaction rarity via probability_model(plc,target_mode)'
- question: Does a sequence/time-series anomaly model (seq2seq or autoencoder) trained on normal per-PLC
    mode-change cadence and protocol-field features flag a high reconstruction error for a recent mode-change
    transaction, and which top-3 features (source IP, target mode, time-since-last-change) drive the anomaly?
  context: Symbolic rules and simple baselines can miss novel attacker behavior that violates the learned
    shape of normal operations. Train a sequence/time-series model on normal per-PLC mode-change cadence
    plus protocol-field features and alert on high reconstruction error, then surface the top-3 contributing
    features via SHAP attribution so the analyst gets an explainable lead (e.g., an unusual source IP
    targeting STOP at an unusual interval). This supports Evasion detection by catching mode-change patterns
    that deviate from the controller's historical behavior even when no single field is individually out
    of policy. A positive result is a model-flagged anomaly requiring triage; explainability keeps it
    actionable and reduces false positives.
  answer_sources:
  - Zeek s7comm.log
  - Zeek enip.log
  - Zeek conn.log
  - Maintenance Schedule Data
