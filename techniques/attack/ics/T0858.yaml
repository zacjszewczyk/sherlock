    in-progress or unauthorized program-change attempt that single-shot rules would miss. This supports
    Execution detection by catching attempts that error out due to privilege, locking, or protocol issues.
    A positive result - clustered failures around download or mode-transition steps - tells the analyst
    an actor is actively trying to modify logic, warranting investigation before a retry succeeds.'
