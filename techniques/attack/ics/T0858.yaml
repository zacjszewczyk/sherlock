- question: After an observed mode change (especially to STOP or PROGRAM), does process telemetry and
    controller-state show physical consequences - halted logic, frozen/stale sensor channels, or forced-off
    outputs - that confirm the mode change had real operational impact?
  context: 'The ultimate goal of an Evasion-driven mode change may be to disable protection or halt the
    process while masking the cause. In parallel with command-level detection, model normal process telemetry
    and controller-state invariants and alert when a mode change is followed by halted logic, frozen sensor
    channels, or forced-off outputs - reconstruction-residual forecasting plus mined state invariants.
    Correlating the network command with downstream physical effect raises confidence enormously: a STOP
    write followed by frozen analog values and de-energized outputs is near-certain malicious impact,
    whereas a mode change with no telemetry change may be benign monitoring. This evidence also helps
    the analyst scope blast radius and prioritize response.'
