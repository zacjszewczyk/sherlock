- question: Does the rate of industrial-firewall denies and failed TCP handshakes to PLC control ports
    (TCP/102 S7comm, TCP/44818 EtherNet/IP) for a given controller exceed its baseline 99th percentile,
    indicating an unauthorized host probing for mode-change access?
  context: Before a successful mode change an attacker frequently probes for reachable control ports,
    producing firewall denies and failed handshakes. Treat these blocked/failed connections to PLC control
    ports as a distinct Failure-Mode signal and alert when their rate to a controller exceeds the baseline
    99th percentile, consistent with the segmentation and deny-by-default model of NIST SP 800-82r3. A
    spike of denied/failed connection attempts to TCP/102 or TCP/44818 from a host that should not be
    reaching the controller strongly suggests reconnaissance preceding an Evasion attempt. A positive
    result helps the analyst identify the probing source early, before any state change occurs.
