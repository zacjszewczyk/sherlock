    newly compromised or newly introduced hosts that may not yet be on a deny list but have never legitimately
    controlled the asset. A first-seen source issuing a mode change is inherently suspicious in a stable
    OT environment where control relationships rarely change; a positive result should be triaged against
    asset inventory and change records to confirm whether the new source is sanctioned.
