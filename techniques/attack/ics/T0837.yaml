    [Specification-based Detection in Smart Grids](https://arxiv.org/abs/2209.04354)), monitor industrial
    protocol writes (OPC-UA/Modbus/S7comm/DNP3) and HMI audit logs against these tags. Alert high if a
    write modifies a critical tag from an IP/user not on the authorized operator/engineer list. Alert
    critical if any write — regardless of source — moves a tag to a less-safe State (raising a high-pressure
