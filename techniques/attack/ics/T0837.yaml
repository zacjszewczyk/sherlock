name: 'T0837: Loss of Protection'
id: f073e33f-c856-4eb3-8ca3-ec0e99194727
description: 'This playbook helps an analyst investigate whether an adversary has compromised or degraded
  protective system functions in an ICS/OT environment (MITRE ATT&CK T0837, Loss of Protection). Loss
  of Protection occurs when safety-critical functions -- Safety Instrumented Systems (SIS), safety PLCs,
  protective relays, and alarm/trip configurations -- are disabled or weakened so that faults and abnormal
  conditions go unchecked, risking equipment damage, prolonged process disruption, and hazards to personnel.
  The hunt pursues this behavior from several complementary angles: unauthorized safety-critical commands
  (''Stop CPU'', logic/program download, key-switch/mode change) sent to SIS controllers from non-whitelisted
  IPs, unauthorized users, or outside maintenance windows; unauthorized or unsafe writes to critical alarm
  tags (setpoints, deadbands, inhibit flags) that move parameters toward a less-safe state; and protective
  devices going silent by ceasing their expected heartbeat, cyclic, or GOOSE traffic. Detection methods
  combine deterministic symbolic-logic rules (deny-by-default allowlists, engineering RBAC, semantic protocol/specification
  validation, safe-range checks, failed/rejected-command bursts, and heartbeat/timeout monitoring), statistical
  baselining (per-controller and per-user volume/frequency sigma and percentile thresholds, probabilistic
  transaction scoring, low-volume availability floors, and physics-based residual/CUSUM detection of setpoint
  moves), and machine learning (Isolation Forest, supervised RF/XGBoost classifiers, LSTM/seq2seq and
  LSTM-VAE anomaly models, SARIMA/Prophet forecasting, and IEC 61850 GOOSE temporal/multi-view autoencoders)
  -- with explainable top-3 feature attribution and the strict requirement that ML runs only in parallel
  with the deterministic and physics/timing checks. These are applied across Zeek industrial-protocol
  logs (s7comm, modbus, enip, dnp3, bacnet, opc-ua, conn), ICMP logs, HMI application audit logs, and
  Windows Security/process-creation events so the analyst can corroborate suspected tampering with protective
  functions against device, user, network, and process-physics context.'
type: technique
