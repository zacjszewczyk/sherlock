questions:
- question: '[Impact] Unauthorized SIS safety commands from non-whitelisted sources: Can you determine
    whether a safety-critical command (e.g., ''Stop CPU'', ''Program/Logic Download'', ''Key Switch/Mode
    Change'') is sent to a Safety Instrumented System (SIS) controller, and the command''s context is
    anomalous. Anomalous context is defined by one or more of the following: the command originates from
    an IP address not on the approved Engineering Workstation (EWS) whitelist; the associated user account
    is not a member of the authorized SIS engineering group; or the command occurs outside a scheduled
    and documented maintenance window. -- specifically, using the ''Unauthorized SIS safety commands from
    non-whitelisted sources'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0105), adversaries compromise protective system
    functions (Safety Instrumented Systems, protective relays, safety PLCs, and alarm/trip configurations)
    designed to prevent the effects of faults and abnormal conditions, which can result in equipment damage,
    prolonged process disruptions, and hazards to personnel; disabling protection is frequently a prerequisite
    to a larger impact attack or a way to let future faults go unchecked. This evidence focuses on the
    condition that a safety-critical command (e.g., ''Stop CPU'', ''Program/Logic Download'', ''Key Switch/Mode
    Change'') is sent to a Safety Instrumented System (SIS) controller, and the command''s context is
    anomalous. Anomalous context is defined by one or more of the following: the command originates from
    an IP address not on the approved Engineering Workstation (EWS) whitelist; the associated user account
    is not a member of the authorized SIS engineering group; or the command occurs outside a scheduled
    and documented maintenance window. The ''Unauthorized SIS safety commands from non-whitelisted sources''
    approach (Symbolic Logic) works as follows: Following deny-by-default allowlisting and engineering
    RBAC guidance in [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    maintain watchlists of critical SIS controller IPs and approved Engineering Workstation (EWS) source
    IPs, plus the set of safety-impacting commands/function codes ("Stop CPU", "Program/Logic Download",
    "Key Switch/Mode Change"). Using semantic protocol rules that validate function code, command/response
    pairing, and source/destination relationships ([Distributed Semantic-Rule IDS for SCADA](https://arxiv.org/abs/2412.07917),
    [Specification-based Detection in Smart Grids](https://arxiv.org/abs/2209.04354)), monitor Zeek s7comm.log/modbus.log/enip.log/dnp3.log
    for any such command targeting an SIS IP. Generate a high-severity alert if the source IP is not on
    the EWS whitelist. Correlate source IP+timestamp with Windows Event ID 4624 logons on the EWS to identify
    the user; if the user is not in the authorized SIS-engineer AD group, or the action is outside a documented
    maintenance window, escalate to critical. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a probable loss of protection; pivot to the implicated protective device
    (SIS controller, safety PLC, protective relay) and its IP, the source IP/host and user account that
    issued the command, the specific safety command/function code or alarm tag affected, the before/after
    parameter values relative to the safe operating range, and whether the activity fell inside a documented
    and approved maintenance window. Validate against change-management records and confirm the protective
    function is still armed and responsive. A negative result helps rule out this particular vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land tampering with safety systems -- and ML detectors in particular
    must run only alongside the deterministic rules and physics/timing checks, never as a replacement.'
  answer_sources:
  - Zeek s7comm.log
  - Zeek modbus.log
  - Zeek enip.log
  - Zeek dnp3.log
  - Zeek bacnet.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - 'NAI: SIS network segments (Level 0/1), Engineering Workstation (EWS) network segment (Level 2/3),
    Process Control Network (PCN) segments where EWS communicate with SIS devices, Active Directory Domain
    Controllers'
  range: Last 90 days; evaluate continuously in 5-minute windows for new events
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic allowlist / specification rule\nwatchlist critical_devices, approved_sources,\
      \ safety_commands\nfor each event in (industrial_protocol_logs OR HMI_audit_logs OR conn.log):\n\
      \  if event matches protective-function condition above:\n    if source_ip NOT in approved_sources\
      \ OR user NOT in authorized_group\n       OR value moves tag to less-safe state\n       OR event\
      \ outside documented maintenance_window:\n      raise alert(severity=high..critical,\n         \
      \         device, source_ip, user, command/tag, old_value, new_value)\n  // correlate src_ip+ts\
      \ with Windows 4624/4625 to resolve user & failures"
- question: '[Impact] Baseline SIS logic downloads and file integrity: Can you determine whether a safety-critical
    command (e.g., ''Stop CPU'', ''Program/Logic Download'', ''Key Switch/Mode Change'') is sent to a
    Safety Instrumented System (SIS) controller, and the command''s context is anomalous. Anomalous context
    is defined by one or more of the following: the command originates from an IP address not on the approved
    Engineering Workstation (EWS) whitelist; the associated user account is not a member of the authorized
    SIS engineering group; or the command occurs outside a scheduled and documented maintenance window.
    -- specifically, using the ''Baseline SIS logic downloads and file integrity'' (Statistical Method)
    approach?'
  context: 'Why this matters: Under the Impact tactic (TA0105), adversaries compromise protective system
    functions (Safety Instrumented Systems, protective relays, safety PLCs, and alarm/trip configurations)
    designed to prevent the effects of faults and abnormal conditions, which can result in equipment damage,
    prolonged process disruptions, and hazards to personnel; disabling protection is frequently a prerequisite
    to a larger impact attack or a way to let future faults go unchecked. This evidence focuses on the
    condition that a safety-critical command (e.g., ''Stop CPU'', ''Program/Logic Download'', ''Key Switch/Mode
    Change'') is sent to a Safety Instrumented System (SIS) controller, and the command''s context is
    anomalous. Anomalous context is defined by one or more of the following: the command originates from
    an IP address not on the approved Engineering Workstation (EWS) whitelist; the associated user account
    is not a member of the authorized SIS engineering group; or the command occurs outside a scheduled
    and documented maintenance window. The ''Baseline SIS logic downloads and file integrity'' approach
    (Statistical Method) works as follows: For each SIS controller establish a 60-day baseline of logic-download
    events from industrial protocol logs, profiling Volume (download bytes) and Frequency (downloads per
    hour). Compute mean ($$ \mu $$) and standard deviation ($$ \sigma $$); derive controller-specific
    thresholds rather than global ones because download size/rate varies by program. Alert (medium) if
    a download''s size exceeds $$ \mu + 3\sigma $$; alert (high) if hourly download frequency exceeds
    its $$ \mu + 3\sigma $$. Probabilistic transaction modeling as in [Probability Risk Identification
    IDS for SCADA](https://arxiv.org/abs/1711.02826) can replace fixed sigma thresholds where rates are
    non-Gaussian, scoring rare/low-probability download transactions. If a download''s file hash/checksum
    changes outside a scheduled window, generate a critical alert. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates a probable loss of protection; pivot to the implicated
    protective device (SIS controller, safety PLC, protective relay) and its IP, the source IP/host and
    user account that issued the command, the specific safety command/function code or alarm tag affected,
    the before/after parameter values relative to the safe operating range, and whether the activity fell
    inside a documented and approved maintenance window. Validate against change-management records and
    confirm the protective function is still armed and responsive. A negative result helps rule out this
    particular vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, low-and-slow, or living-off-the-land tampering with safety systems -- and
    ML detectors in particular must run only alongside the deterministic rules and physics/timing checks,
    never as a replacement.'
