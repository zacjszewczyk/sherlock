name: 'T0801: Monitor Process State'
id: 8e73788b-7888-4a2b-8b6b-913b100d5189
description: 'This playbook helps an analyst investigate whether an adversary is monitoring ICS process
  state (MITRE ATT&CK T0801, Monitor Process State) -- gathering information about the physical process
  via OPC tags, historian data, specific PLC block reads, or network traffic, either to deepen understanding
  of the process or to use process state as a trigger for malicious action. The hunt pursues this behavior
  from several complementary angles across the OT/Purdue model: ICS protocol read requests (Modbus FC
  0x03/0x04, DNP3 FC 0x01/0x02, OPC) to critical assets such as Data Historians, PLCs, and RTUs from sources
  outside an authorized allow-list of (source IP, user, destination) tuples; out-of-specification function
  codes, register/point addressing, or unpaired request/response and per-channel automaton violations;
  read-volume and byte-transfer baselines exceeded by approved sources; spikes in read failures, protocol
  exceptions, and denied object access; hosts (HMI/EWS) sweeping an anomalous number of unique ICS devices
  or ports outside their documented zone; out-of-spec poll cadence; high-risk remote logons (RDP/Type
  10) to ICS hosts followed by multi-device read fan-out; and failed-logon precursors. Detection methods
  combine deterministic symbolic-logic rules (allow-lists, protocol-semantic rules, communication maps,
  DFA/automaton models, high-risk-logon rules), statistical baselining (99th/95th-percentile read counts
  and byte volumes, unique-destination spikes, blocked-connection and denial-rate profiling, post-logon
  device-query outliers, failed-logon profiling), and machine learning (Extended Isolation Forest and
  Kitsune autoencoder anomaly scoring with SHAP attribution, DeepLog LSTM log-sequence modeling of the
  logon-to-read workflow, and Random Forest classification of malicious-precursor sessions). Sources span
  Zeek conn/modbus/dnp3/opc/rdp logs and Windows Security/process events (4624, 4625, 4648, 4663, 4688,
  5156/5157), so the analyst can corroborate suspected process-state monitoring against host, user, network,
  and protocol context.'
type: technique
related:
- tactic_id: TA0100
  tactic_name: Collection
