- question: '[Collection] Read volume exceeds baseline: Can you determine whether the condition described
    in this evidence holds -- "A network connection from an unapproved source IP or user account makes
    an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period." -- specifically by applying the ''Read volume
    exceeds baseline'' (Statistical Method) detection approach for T0801 (Monitor Process State)?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary performing Monitor Process
    State (T0801) gathers information about the physical process state -- via OPC tags, historian data,
    PLC block reads, or network traffic -- to understand the process or to time malicious actions. This
    evidence focuses on the condition: A network connection from an unapproved source IP or user account
    makes an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period. The ''Read volume exceeds baseline'' approach
    (Statistical Method) works as follows: For each authorized source (IP/user), establish a 30-day rolling
    baseline of daily ICS read counts and total bytes transferred using Zeek logs, using stateless count/byte-ratio
    features over sliding windows as in [Real-Time Detection of DNS Exfiltration and Tunneling, Nadler
    et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf). Calculate the 99th percentile for
    both metrics per source (derive the exact cutoff from your own 30-day data; tune up if benign batch
    historian pulls inflate it). Alert if either the daily read count or daily byte volume for an approved
    source exceeds its 99th percentile threshold. A positive result -- a rule match, statistical outlier,
    or model alert -- is a strong indicator of unauthorized monitoring or reconnaissance of process state;
    pivot immediately to the responsible source host and account, the source IP/subnet and its OT zone
    (Purdue level), the targeted asset (Historian, PLC/RTU, HMI, EWS) and ICS protocol/function code used,
    and the volume, cadence, and timing of the reads to scope what process data was exposed. A negative
    result helps rule out this specific vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land collection
    from authorized hosts.'
