questions:
- question: '[Collection] Unauthorized ICS read request: Can you determine whether the condition described
    in this evidence holds -- "A network connection from an unapproved source IP or user account makes
    an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period." -- specifically by applying the ''Unauthorized
    ICS read request'' (Symbolic Logic) detection approach for T0801 (Monitor Process State)?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary performing Monitor Process
    State (T0801) gathers information about the physical process state -- via OPC tags, historian data,
    PLC block reads, or network traffic -- to understand the process or to time malicious actions. This
    evidence focuses on the condition: A network connection from an unapproved source IP or user account
    makes an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period. The ''Unauthorized ICS read request'' approach
    (Symbolic Logic) works as follows: Maintain an allow-list of (Source IP, User Account, Destination
    Asset IP) tuples authorized for ICS read operations, per the least-privilege and host-to-device allow-listing
    prescribed in [Guide to Operational Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
    and the rule formalism in [Network Intrusion Detection and Prevention, Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).
    Monitor Zeek ICS protocol logs (modbus.log, dnp3.log, opc.log) for read function codes (Modbus 0x03/0x04,
    DNP3 0x01/0x02). Alert if a request''s tuple is not in the allow-list. Enrich alerts by correlating
    the source IP with Windows logon events (Event ID 4624) on the destination asset within a 5-minute
    window. A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator
    of unauthorized monitoring or reconnaissance of process state; pivot immediately to the responsible
    source host and account, the source IP/subnet and its OT zone (Purdue level), the targeted asset (Historian,
    PLC/RTU, HMI, EWS) and ICS protocol/function code used, and the volume, cadence, and timing of the
    reads to scope what process data was exposed. A negative result helps rule out this specific vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land collection from authorized hosts.'
  answer_sources:
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek opc.log
  - Windows Event ID 4624
  - Windows Event ID 4663
  - 'NAI: Data Historian servers (Level 3), Process Control Network (PCN) gateways (Level 3/2), PLC subnets
    (Level 1/2), HMI/EWS subnets (Level 2.5/2), DMZ between IT and OT networks.'
  range: Last 90 days (correlate event-centered windows of +/- 10 minutes around suspect logons and read
    bursts)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Unauthorized ICS read request (Symbolic Logic)

      source IN [Zeek conn.log, Zeek modbus.log, Zeek dnp3.log, Zeek opc.log, Windows Event ID 4624, Windows
      Event ID 4663]

      | filter destination IN process-state NAIs (Data Historian servers (Level 3), Process Control Network
      (PCN) gateways (Level 3/2), PLC subnets (Level 1/2), HMI/EWS subnets (Level 2.5/2), DMZ between
      IT and OT networks.)

      | approach: Maintain an allow-list of (Source IP, User Account, Destination Asset IP) tuples authorized
      for ICS read operations, per the least-privilege and host-to-device allow-listing prescribed in
      [Guide to Operational Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
      and the rule formalism in [Network Intrusion Detection and Prevention, Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).
      Monitor Zeek ICS protocol logs (modbus.log, dnp3.log, opc.log) for read function codes (Modbus 0x03/0x04,
      DNP3 0x01/0x02).

      | emit alert with entity context (src_ip, src_subnet/zone, user, src_host, dst_asset, ics_protocol,
      function_code, point/register, read_count, bytes, timestamp)'
  - technology: Zeek/pseudocode
    query: '# Unauthorized ICS read request -- Zeek/ICS implementation

      event zeek.conn/modbus/dnp3/opc (+ Windows auth/process events as available)

      | where resp_h in process_state_assets AND function_code in read_codes

      | apply symbolic logic logic: Maintain an allow-list of (Source IP, User Account, Destination Asset
      IP) tuples authorized for ICS read operations, per the least-privilege and host-to-device allow-listing
      prescribed in [Guide to Operational Technology (OT) Security (NIST SP 800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf)
      and the rule formalism in [Network Intrusion Detection and Prevention, Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).
      Monitor Zeek ICS protocol logs (modbus.log, dnp3.log, opc.log) for read function codes (Modbus 0x03/0x04,
      DNP3 0x01/0x02).

      | output ts, id.orig_h, id.resp_h, id.resp_p, function, unit/point, request, response, uid'
- question: '[Collection] Out-of-spec read function code or address: Can you determine whether the condition
    described in this evidence holds -- "A network connection from an unapproved source IP or user account
    makes an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period." -- specifically by applying the ''Out-of-spec
    read function code or address'' (Symbolic Logic) detection approach for T0801 (Monitor Process State)?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary performing Monitor Process
    State (T0801) gathers information about the physical process state -- via OPC tags, historian data,
    PLC block reads, or network traffic -- to understand the process or to time malicious actions. This
    evidence focuses on the condition: A network connection from an unapproved source IP or user account
    makes an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period. The ''Out-of-spec read function code or address''
    approach (Symbolic Logic) works as follows: Apply protocol-semantic rules over DNP3/Modbus/IEC 61850
    traffic (valid function codes, command/response pairing, register/point addressing) auto-generated
    as in [Distributed Intrusion Detection System using Semantic-based Rules for SCADA in Smart Grid,
    Mohan et al.](https://arxiv.org/abs/2412.07917) and the graph-based specification approach of [On
    Specification-based Cyber-Attack Detection in Smart Grids, Sen et al.](https://arxiv.org/abs/2209.04354).
    Alert when a read targets a point/register or uses a function code outside the device''s documented
    specification, or when a read has no matching response (or vice versa). Additionally model each PLC-to-server
    channel as a deterministic finite automaton per [Temporal Phase Shifts in SCADA Networks, Markman,
    Wool, and Cardenas](https://arxiv.org/abs/1808.05068) and alert on injected/extra read messages that
    violate the per-channel automaton. A positive result -- a rule match, statistical outlier, or model
    alert -- is a strong indicator of unauthorized monitoring or reconnaissance of process state; pivot
    immediately to the responsible source host and account, the source IP/subnet and its OT zone (Purdue
    level), the targeted asset (Historian, PLC/RTU, HMI, EWS) and ICS protocol/function code used, and
    the volume, cadence, and timing of the reads to scope what process data was exposed. A negative result
    helps rule out this specific vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or living-off-the-land collection from authorized
    hosts.'
