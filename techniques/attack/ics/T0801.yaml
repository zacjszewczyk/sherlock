- question: '[Collection] Read failure and denial-rate spike: Can you determine whether the condition
    described in this evidence holds -- "A network connection from an unapproved source IP or user account
    makes an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period." -- specifically by applying the ''Read failure
    and denial-rate spike'' (Statistical Method) detection approach for T0801 (Monitor Process State)?'
  context: 'Why this matters: Under the Collection tactic (TA0100), an adversary performing Monitor Process
    State (T0801) gathers information about the physical process state -- via OPC tags, historian data,
    PLC block reads, or network traffic -- to understand the process or to time malicious actions. This
    evidence focuses on the condition: A network connection from an unapproved source IP or user account
    makes an ICS protocol read request (e.g., Modbus Function Code 0x03/0x04, DNP3 Function Code 0x01/0x02)
    to a critical asset like a Data Historian or PLC. Alternatively, an approved source initiates a volume
    of read requests or transfers a data volume that exceeds its statistically established high-water
    mark (e.g., 99th percentile) over a 24-hour period. The ''Read failure and denial-rate spike'' approach
    (Statistical Method) works as follows: Profile read failure modes as a distinct signal, since reconnaissance
    generates abnormal error rates as noted in [Guide to Operational Technology (OT) Security (NIST SP
    800-82r3)](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf). For each source,
    baseline the rate of denied object-access (Windows Event ID 4663 access-denied to historian files/objects),
    Modbus/DNP3 exception responses, and blocked/rejected ICS connections (Zeek conn.log state S0/REJ).
    Alert when any source''s denial/exception count in a 15-minute window exceeds its 99th-percentile
    baseline, or when failed reads are immediately followed by a successful read (success-after-failure).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    unauthorized monitoring or reconnaissance of process state; pivot immediately to the responsible source
    host and account, the source IP/subnet and its OT zone (Purdue level), the targeted asset (Historian,
    PLC/RTU, HMI, EWS) and ICS protocol/function code used, and the volume, cadence, and timing of the
    reads to scope what process data was exposed. A negative result helps rule out this specific vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land collection from authorized hosts.'
