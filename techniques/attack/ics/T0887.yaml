- question: Is the Shannon entropy of detected-frequency distribution in protected ICS bands within its
    30-day 99th-percentile baseline, or has it exceeded that baseline for three consecutive 1-minute windows—indicating
    scanning—and are channel-hop rate and band-occupancy span elevated?
  context: 'A scanning tool sweeps many frequencies, raising the unpredictability (Shannon entropy) of
    the detected-frequency distribution. Continuously computing this entropy over rolling 1-minute windows
    and comparing against a 30-day rolling 99th-percentile baseline, then alerting when it is exceeded
    for three consecutive intervals, flags statistically significant scanning. Baselining channel-hop
    rate and band-occupancy span adds corroboration. A sustained entropy spike is a statistical reconnaissance
    indicator. Tactic relevance: detects active spectrum enumeration of wireless ICS frequencies under
    Discovery. Reference: [Deep Predictive Coding Neural Network for RF Anomaly Detection in Wireless
    Networks](https://arxiv.org/abs/1803.06054).'
