- question: Is a single source IP that is not in the asset inventory generating more than 20 connection
    attempts to an ICS gateway in under one minute with Zeek conn.log states 'S0', 'REJ', or 'RSTOS0',
    and is that activity followed by a successful authentication (Event ID 4624) from the same IP within
    10 minutes?
  context: 'Reconnaissance of wireless gateways produces a burst of failed/rejected connections, failed
    logons, and malformed/unsupported protocol requests. A SIEM rule firing on >20 connection attempts
    in <1 minute from an unknown source with conn.log states S0/REJ/RSTOS0 captures the probing signal;
    escalating when a successful Event ID 4624 follows within 10 minutes flags a probe-then-access transition
    worth urgent attention. Treating failed logons (4625) and malformed/unsupported protocol notices as
    distinct probing signals adds protocol-semantic coverage. A match indicates active gateway enumeration.
    Tactic relevance: directly answers whether an adversary is discovering wireless ICS protocols/services
    by probing the gateway. References: [Analysis, classification and detection methods of attacks via
    wireless sensor networks in SCADA systems](https://arxiv.org/abs/1412.2387) and [Distributed Intrusion
    Detection System using Semantic-based Rules for SCADA in Smart Grid](https://arxiv.org/abs/2412.07917).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Windows Event ID 5156
  - Wireless Gateway Authentication Logs
  - 'NAI: Network interfaces of ICS wireless gateways, associated authentication servers (RADIUS/TACACS+),
    and Domain Controllers handling ICS-related authentication.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM zeek_conn WHERE src_ip NOT IN asset_inventory AND dst IN ics_gateways AND conn_state IN
      ('S0','REJ','RSTOS0') | stats count by src_ip over 1m | where count > 20 -> alert gateway_probing;
      ESCALATE if win4624 from same src_ip WITHIN 10m
- question: For each source IP on the wireless segment, does its composite risk score S = w1*Z_rej + w2*Z_auth
    + w3*Z_proto (Z-scores for rejected connections, failed authentications, and protocol notices over
    a 14-day baseline) exceed its dynamic threshold—indicating multi-faceted anomalous probing from a
    single source?
  context: 'Single-signal rules miss adversaries who keep each individual behavior below threshold. A
    composite risk score combines weighted Z-scores for rejected connections (Zeek conn.log), failed authentications
    (Event ID 4625), and protocol notices (Zeek notice.log), each baselined over a 14-day rolling window.
    Alerting when the weighted sum exceeds a dynamic threshold catches multi-faceted reconnaissance that
    no single metric would flag. A high composite score is a statistical probing indicator concentrating
    attention on the riskiest source. Tactic relevance: detects subtle, distributed-signal Discovery activity
    against wireless gateways. Reference: [Analysis, classification and detection methods of attacks via
    wireless sensor networks in SCADA systems](https://arxiv.org/abs/1412.2387).'
