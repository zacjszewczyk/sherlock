- question: For each static authorized wireless device, is its real-time RSSI within its 14-day rolling
    baseline, or does the absolute Z-score exceed 3.5 for more than 60 consecutive seconds—suggesting
    the signal now originates from a different physical location (possible spoofing)?
  context: 'A fixed sensor or actuator should present a stable received-signal-strength profile from its
    known location. Establishing a 14-day rolling RSSI mean/standard deviation per authorized MAC from
    Zeek wifi.log and computing a per-minute Z-score lets the analyst flag sustained deviations (|Z| >
    3.5 for >60s) that indicate the transmitter moved or is being impersonated from a different position.
    This RSSI/CSI hypothesis-testing approach is the standard physical-layer location-consistency check.
    A sustained high Z-score is a statistical spoofing indicator; brief spikes are likely multipath/noise.
    Tactic relevance: surfaces device impersonation enabling wireless Collection. References: [A Survey
    of Machine Learning-based Physical-Layer Authentication in Wireless Communications](https://arxiv.org/abs/2411.09906)
    and [Rejecting the Attack: Source Authentication for Wi-Fi Management Frames using CSI Information](https://arxiv.org/abs/1208.0412).'
