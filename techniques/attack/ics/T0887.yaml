- question: For frames claiming a fixed device's identifier, is the channel state information (CSI) consistent
    with that device's established channel signature, or does the CSI indicate the frame originated from
    a different location—i.e., a spoofed identifier?
  context: 'CSI decorrelates rapidly over space and is independent of transmit power, making it a robust
    physical-layer source authenticator. Even when MAC/identifier fields match a known device, a frame
    whose CSI is inconsistent with that device''s known fixed channel signature is deterministically flagged
    as spoofed. This catches an adversary who has captured a legitimate device''s identifier and is transmitting
    from elsewhere. A CSI mismatch is a high-confidence spoofing indicator. Tactic relevance: detects
    identifier impersonation that supports Collection (e.g., joining/masquerading on the wireless network
    to capture traffic). Reference: [Rejecting the Attack: Source Authentication for Wi-Fi Management
    Frames using CSI Information](https://arxiv.org/abs/1208.0412).'
