- question: Where raw IQ samples are available from SDR/RF sensors, does the RF/IQ hardware fingerprint
    of a frame match the authorized radio that owns the claimed identifier, or is it classified as a different
    physical radio—indicating impersonation despite forged MAC/protocol fields?
  context: 'A CNN trained on transmitter-chain hardware imperfections (I/Q imbalance, DC offset, phase
    noise) can fingerprint each authorized radio at the physical layer. A frame carrying an authorized
    identifier but classified as a different physical radio reveals impersonation even when MAC and protocol
    fields are perfectly forged—something upper-layer checks cannot catch. The alert should surface the
    closest-matching legitimate radio and confidence. A fingerprint mismatch is a strong impersonation
    indicator. Tactic relevance: detects radios masquerading as field devices to capture or inject wireless
    ICS traffic under Collection. References: [ORACLE: Optimized Radio clAssification through Convolutional
    neuraL nEtworks](https://arxiv.org/abs/1812.01124) and [A Survey of Machine Learning-based Physical-Layer
    Authentication in Wireless Communications](https://arxiv.org/abs/2411.09906).'
