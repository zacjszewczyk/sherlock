      norm(params), time_delta]); thr = p99(reconstruction_error(clean_val)); for window in rolling_5m:
      err = recon_error(window); if err > thr: alert(top3_feature_errors); run_parallel_with deterministic_rules'
- question: Is any wireless device identifier (MAC address, WirelessHART Network/Device ID) transmitting
    on an operational ICS frequency or SSID that is NOT on the authorized asset-inventory allow-list?
  context: 'Sniffing often requires the adversary to interact with or impersonate devices on the wireless
    network, and rogue transmitters are a detectable artifact. Continuously cross-referencing source MAC
    and WirelessHART IDs from Zeek wifi.log/Wireless IDS logs against a managed inventory of authorized
    wireless devices, and alerting on any transmission on an operational ICS band/SSID from an unknown
    identifier, implements standard WIDS allowlisting. A positive result identifies an unauthorized emitter
    that may be sniffing, injecting, or spoofing; a negative result means all active identifiers are known.
    Tactic relevance: under Collection, an unsanctioned wireless device near field assets is a prime candidate
    for capturing or replaying RF traffic. References: [A Wireless Intrusion Detection System for 802.11
    WPA3 Networks](https://arxiv.org/abs/2110.04259) and [Analysis, classification and detection methods
    of attacks via wireless sensor networks in SCADA systems](https://arxiv.org/abs/1412.2387).'
