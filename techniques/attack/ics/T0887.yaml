- question: Is there a persistent (>30s) unauthorized RF signal within or adjacent to protected ICS bands
    whose signature does not match an authorized transmitter AND which exhibits rapid channel hopping
    (>5 channels/min) or a power fluctuation >10 dBm—consistent with reconnaissance?
  context: 'Spectrum reconnaissance leaves observable RF behavior even when network-layer capture is passive.
    A deterministic rule in a spectrum-analysis tool/SIEM triggers when a signal is (1) within a protected
    ICS band (e.g., 902-928 MHz), (2) not matched to a pre-defined authorized-transmitter signature (modulation/bandwidth),
    and (3) hopping >5 channels/min or fluctuating >10 dBm, persisting for >30s to suppress noise. This
    allowlist-plus-behavior logic reflects WIDS practice for rogue/unknown emitters. A match indicates
    a likely scanner/sniffer surveying the spectrum. Tactic relevance: directly answers the Discovery
    question of whether an adversary is enumerating wireless ICS protocols and frequencies. References:
    [A Wireless Intrusion Detection System for 802.11 WPA3 Networks](https://arxiv.org/abs/2110.04259)
    and [Analysis, classification and detection methods of attacks via wireless sensor networks in SCADA
    systems](https://arxiv.org/abs/1412.2387).'
