name: 'T0887: Wireless Sniffing'
id: 9f6b03ae-6337-4604-bf58-f135e1ff86eb
description: 'Investigate suspected Wireless Sniffing of ICS radio-frequency communications and its downstream
  abuse. Adversaries can passively capture unencrypted RF traffic (WirelessHART, Zigbee, WIA-FA, 700 MHz
  public-safety spectrum, 900 MHz/2.4 GHz industrial bands) using SDRs, handheld radios, or tuned demodulators,
  then replay recorded command broadcasts to manipulate physical processes (as in the 2017 Dallas siren
  incident). Because purely passive sniffing is effectively undetectable, this playbook focuses on the
  observable artifacts that surround it: replay-attack signatures in wireless write traffic (out-of-hours
  commands, redundant state-change commands, duplicate application-layer payloads, command cascades),
  unauthorized or spoofed wireless device identifiers and physical-layer (RSSI/CSI/IQ) inconsistencies,
  persistent unauthorized RF emissions and spectrum-scanning behavior in protected ICS bands, and probing/reconnaissance
  surges against ICS wireless gateways. It supports both the Collection objective (capturing wireless
  ICS communications for later replay) and the Discovery objective (enumerating wireless ICS protocols
  and frequencies), pairing deterministic symbolic-logic rules with statistical baselines and machine-learning
  models so analysts retain a defensible detection floor.'
