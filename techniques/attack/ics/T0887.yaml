    query: 'S_0 = 0; for each t: S_t = max(0, S_{t-1} + llr(innovation_t, watermark_t)); calibrate threshold
      h on clean 14d window for target FAR; if S_t > h: alert cusum_replay_detected'
- question: Does an LSTM autoencoder trained on six months of legitimate ICS command sequences reconstruct
    rolling five-minute command windows within its dynamic error threshold (99th percentile of clean validation
    error), or does reconstruction error spike—flagging an anomalous (possibly replayed) command sequence?
  context: 'An LSTM autoencoder learns the temporal structure of normal ICS command vectors (one-hot function
    code, normalized numeric parameters, time delta from previous command) from Zeek dnp3.log/modbus.log.
    In production, rolling 5-minute windows are scored; reconstruction error above a dynamic 99th-percentile
    threshold flags sequences that do not match learned behavior, including replays. Alerts must surface
    the top-3 per-feature reconstruction errors (function code, time delta, register value) for triage.
    This ML layer runs in parallel with—never instead of—the deterministic replay rules, because ML detection
    collapses on unseen attack variants. A high reconstruction error warrants investigation alongside
    the deterministic findings. Tactic relevance: catches novel replay/sequence anomalies in Collection-related
    wireless command traffic. Reference: [A False Sense of Security? Revisiting the State of Machine Learning-Based
    Industrial Intrusion Detection](https://arxiv.org/abs/2205.09199).'
  answer_sources:
