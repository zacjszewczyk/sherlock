questions:
- question: Are wireless ICS write commands (Modbus/DNP3 from a wireless gateway) exhibiting replay signatures,
    such as execution outside documented operational hours, a target value that already matches the historian's
    last recorded state, the absence of a corresponding authorized operator HMI process or login within
    the preceding two minutes, or two-or-more byte-identical application-layer payloads (same function
    code, register, value) within five minutes?
  context: 'This is the core deterministic test for replayed wireless control commands captured by sniffing
    and re-injected. An adversary who has recorded legitimate RF command broadcasts can replay them verbatim,
    so the payload looks valid while the surrounding context does not: it arrives at the wrong time, asks
    for a state the process is already in, lacks an authorizing operator action, or appears as an exact
    duplicate. Correlating Zeek modbus.log/dnp3.log writes from wireless-gateway IPs against operational-hours
    lists, historian tag state, and HMI/login telemetry, while also enforcing protocol-semantic validity
    (legal function codes, command/response pairing, in-range addressing), lets out-of-spec or unpaired
    writes fire deterministically. A positive result indicates a likely replay against the process; a
    negative result reduces (but does not eliminate) replay suspicion. Tactic relevance: under Collection
    the captured traffic is the precursor, and replayed writes are the observable payoff. Reference: [Distributed
    Intrusion Detection System using Semantic-based Rules for SCADA in Smart Grid](https://arxiv.org/abs/2412.07917).'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog from field devices (PLCs, RTUs)
  - ICS Historian Database Logs (e.g., OSIsoft PI)
  - HMI Application Event Logs
  - 'NAI: Network segments connecting wireless gateways to the ICS network, Wireless Access Points/Gateways,
    Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Data Historian servers, and PLC/RTU
    network interfaces.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM zeek_modbus, zeek_dnp3 WHERE op IN ('write_single_register','write_multiple','direct_operate','write')
      AND src_ip IN wireless_gateway_ips AND ( hour(ts) NOT IN operational_hours OR value == historian_last_state(tag)
      OR NOT EXISTS(sysmon1 OR win4624 from authorized_operator WITHIN 2m BEFORE ts) ) | ALSO flag count(payload_hash)
      >= 2 WITHIN 5m -> replay_candidate
  - technology: SIEM/Stats pseudocode
    query: group writes by application_payload_hash over sliding 5m | where distinct_count >= 2 and distinct(net_timestamp
      or seq_no) > 1 -> alert duplicate_payload_replay
- question: When the controller supports it, does a watermarked/excitation control input produce a measured
    physical response that matches the injected challenge within tolerance, or do responses fail the watermark
    check, indicating a pre-recorded/replayed command independent of payload content?
  context: 'Active physical watermarking injects a known random excitation into control inputs and verifies
    that the plant''s measured response correlates with the challenge. A genuine live command produces
    a response that tracks the watermark; a replayed (pre-recorded) command cannot, because the attacker''s
    captured stream has no knowledge of the fresh challenge. Evaluating the watermark-response correlation
    against a configured chi-square threshold flags replayed commands even when their byte content is
    perfectly valid. A mismatch beyond threshold is a strong, content-independent replay indicator. Tactic
    relevance: directly counters Collection-then-replay by defeating verbatim re-injection of sniffed
    commands. Reference: [Physical Watermarking for Replay Attack Detection in Continuous-time Systems](https://arxiv.org/abs/2103.00790).'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Syslog from field devices (PLCs, RTUs)
  - ICS Historian Database Logs (e.g., OSIsoft PI)
  - HMI Application Event Logs
  - 'NAI: Network segments connecting wireless gateways to the ICS network, Wireless Access Points/Gateways,
    Human-Machine Interfaces (HMIs), Engineering Workstations (EWS), Data Historian servers, and PLC/RTU
    network interfaces.'
  range: Last 90 days
  queries:
  - technology: Controller/Watermark pseudocode
    query: 'inject watermark w_t into control input u_t; observe response y_t; compute chi_square(residual(y_t,
      expected(w_t))); if chi_square > threshold: alert watermark_mismatch_replay(command_id)'
- question: Do observed command-pair transitions on critical PLCs/RTUs follow historically normal sequences,
    or has a command sequence with a very low historical transition probability (e.g., <1%) occurred,
    and are device reporting-interval and packet-size fingerprints stable or disrupted?
  context: 'Legitimate ICS operations follow predictable command grammars (e.g., ''start pump'' is typically
    followed by ''confirm flow rate'' within seconds). Modeling transition probabilities between command
    states as a Markov chain from historical Zeek logs lets the analyst flag illogical or out-of-order
    operations consistent with replay, where a recorded command is injected out of its normal context.
    Baselining each device''s periodic reporting interval and packet-size distribution adds a complementary
    timing/volume fingerprint—stable enough to be both exploited by an attacker and monitored by a defender.
    A low-probability transition or a disrupted timing fingerprint is a statistical replay indicator.
    Tactic relevance: surfaces Collection-driven replays that individually look valid but break the learned
    operational sequence. Reference: [ZLeaks: Passive Inference Attacks on Zigbee based Smart Homes](https://arxiv.org/abs/2107.10830).'
