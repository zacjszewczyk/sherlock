  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per src_ip: Z_rej=z(rejected_conns), Z_auth=z(failed_auth_4625), Z_proto=z(notice_entries)
      over rolling_14d; S = w1*Z_rej + w2*Z_auth + w3*Z_proto; if S > dynamic_threshold: alert composite_wireless_probing(src_ip)'
- question: Does an Isolation Forest scored on 5-minute per-source-IP traffic aggregates (distinct destination
    ports, SYN-to-established ratio, destination-port entropy, protocol-notice count, average packet size)
    place any wireless-segment source IP in the top 1% (most anomalous) of scores?
  context: 'An Isolation Forest trained on 30 days of benign wireless-segment traffic flags source IPs
    whose 5-minute behavioral aggregate is highly distinct from normal, surfacing scanning/probing that
    fixed rules miss. Features include distinct destination-port count, TCP SYN-to-established ratio,
    destination-port entropy, protocol-notice count, and average packet size; a top-1% anomaly score warrants
    investigation, with the top-3 contributing features listed per alert. Complement with a supervised
    Random Forest (benign vs. probing) for explainable feature importance, and keep the deterministic
    failed-connection rule as the floor because ML degrades on unseen attacks. A top-percentile score
    is an investigative lead. Tactic relevance: catches novel Discovery probing of wireless gateways.
    References: [Anomaly-based Intrusion Detection in Industrial Data with SVM and Random Forests](https://arxiv.org/abs/1907.10374)
    and [A False Sense of Security? Revisiting the State of Machine Learning-Based Industrial Intrusion
    Detection](https://arxiv.org/abs/2205.09199).'
