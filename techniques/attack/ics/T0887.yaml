    query: 'build markov P(cmd_b | cmd_a) from historical zeek modbus/dnp3 sequences; for each live transition
      (a->b): if P(b|a) < 0.01: alert low_prob_transition; also baseline per_device reporting_interval,
      packet_size_dist -> alert on deviation'
- question: When watermarked control inputs are in use, does a sequential CUSUM test on the joint statistics
    of innovation and watermark signals stay within its tuned bound, or does it cross threshold—indicating
    a replayed measurement/command stream whose statistics otherwise mimic legitimate traffic?
  context: 'A replay attack can be crafted so its first-order statistics match legitimate traffic; a cumulative-sum
    (CUSUM) sequential change-detection test on the joint innovation-and-watermark statistics catches
    the divergence over time. The KL divergence between pre- and post-attack distributions governs detection
    delay. Tuning the CUSUM threshold to a target false-alarm rate over a clean 14-day window provides
    resilient detection of replayed streams that evade snapshot tests. A threshold crossing is a statistically
    robust replay indicator. Tactic relevance: defeats carefully-timed replays of Collection-captured
    wireless command/measurement streams. Reference: [Sequential detection of Replay attacks](https://arxiv.org/abs/2012.10748).'
  answer_sources:
