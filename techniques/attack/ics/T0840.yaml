name: 'T0840: Network Connection Enumeration'
id: ff101caa-8d9f-4eec-9b5e-cb0537b26811
description: 'Investigate whether an adversary is performing network connection enumeration against the
  ICS environment to map device communication patterns, roles, and topology of the control network ahead
  of lateral movement or targeted disruption. This playbook helps an analyst hunt for three classes of
  evidence: (1) execution of host-based network enumeration utilities (netstat, arp, ipconfig, nbtstat,
  route, nbtscan and their PowerShell equivalents) on critical OT assets such as Engineering Workstations,
  HMIs, Historians, Data Gateways, and Operator Workstations in anomalous user, parent-process, or temporal
  contexts; (2) high fan-out internal connection behavior in which an ICS host reaches an unusually large
  number of unique destination IPs or ports in a short window, indicative of scanning; and (3) ICS-protocol
  communications (Modbus, DNP3, S7, EtherNet/IP, OPC UA, IEC 104) originating from hosts not on a version-controlled
  allow-list for that protocol and segment. For each class the playbook pairs a deterministic symbolic-logic
  floor with statistical baselining and unsupervised machine-learning outlier detection so scanning and
  protocol probing are caught even when adversaries use native tools and legitimate-looking traffic.'
type: technique
related:
- tactic_id: TA0102
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: On critical ICS endpoints, is a host-based network enumeration utility (netstat.exe, arp.exe,
    nbtstat.exe, ipconfig.exe, route.exe, nbtscan.exe) or its PowerShell equivalent being executed from
    an interactive shell, by an account outside the approved service/admin allow-list, or outside an authorized
    maintenance window?
  context: 'Supports Discovery (TA0102): an adversary with a foothold on an OT host frequently runs native
    network-configuration and connection-listing tools to learn IP/MAC addressing and infer the role of
    devices before moving laterally. On HMIs, EWS, and Historians these utilities are rarely launched
    interactively, so an execution spawned by cmd.exe, powershell.exe, pwsh.exe, wscript.exe, cscript.exe,
    or explorer.exe and run by an account not on the approved allow-list is a high-fidelity signal. For
    PowerShell, inspect script-block logging (Event ID 4104) for Get-NetTCPConnection, Get-NetNeighbor,
    Test-NetConnection, or ''arp -a'' that does not originate from allow-listed administrative tooling.
    Apply Purdue-zone allow-listing to keep this a deterministic floor; a hit is anomalous reconnaissance,
    a miss confirms expected administration. Corroborate with network-side Discovery analytics.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices of critical ICS assets (Engineering Workstations, HMIs, Historian Servers,
    Data Gateways, Operator Workstations)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: FROM process_creation (Sysmon EID 1 OR WinEvent 4688) WHERE host IN ics_critical_assets AND
      ProcessName IN ['netstat.exe','arp.exe','nbtstat.exe','ipconfig.exe','route.exe','nbtscan.exe']
      AND ParentProcessName IN ['cmd.exe','powershell.exe','pwsh.exe','wscript.exe','cscript.exe','explorer.exe']
      AND UserName NOT IN approved_service_admin_allowlist | ALERT 'Anomalous network enumeration utility
      on OT host'
  - technology: SIEM/Rule pseudocode
    query: FROM powershell_scriptblock (WinEvent 4104) WHERE host IN ics_critical_assets AND ScriptBlockText
      MATCHES /(Get-NetTCPConnection|Get-NetNeighbor|Test-NetConnection|arp\s+-a)/ AND ScriptName NOT
      IN allowlisted_admin_tools | ALERT 'PowerShell network enumeration on OT host'
- question: For each critical ICS host, does the current hourly execution count of any network enumeration
    utility deviate sharply (z-score > 3 or above the seasonal forecast bound) from its 30-day baseline,
    including bursts of distinct utilities by one account or repeated access-denied invocations?
  context: 'Supports Discovery (TA0102): even when individual executions look legitimate, a spike in frequency
    or breadth of enumeration is a strong reconnaissance signal. Establish a 30-day per-host baseline
    of hourly execution counts per utility and alert when z>3; strengthen with seasonal time-series decomposition
    (trend + weekly seasonality) so patch/maintenance cycles do not generate false positives, alerting
    only when the observed count exceeds the forecast confidence bound. Additionally track the count of
    distinct enumeration utilities run by a single account within a 10-minute window (frequency signal)
    and the rate of failed/access-denied invocations (state signal) as separate enrichments. Derive host-specific
    thresholds from labeled ICS captures. A breach of the bound during a non-maintenance period suggests
    active mapping of the environment.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices of critical ICS assets (Engineering Workstations, HMIs, Historian Servers,
    Data Gateways, Operator Workstations)'
  range: Last 90 days (30-day baseline, hourly buckets)
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM process_creation WHERE host IN ics_critical_assets AND ProcessName IN enum_utils | bin
      1h | stats count BY host,ProcessName,bin | baseline mean,std over trailing 30d | eval z=(count-mean)/std
      | WHERE z>3 | ALERT
  - technology: SIEM/Stats pseudocode
    query: FROM process_creation WHERE host IN ics_critical_assets | window 10m BY UserName | eval distinct_utils=dc(ProcessName
      WHERE ProcessName IN enum_utils), denied=count(status='access_denied') | WHERE distinct_utils>=3
      OR denied>=5 | ALERT 'Enumeration burst / repeated denials'
  - technology: SIEM/Stats pseudocode
    query: '# seasonal: forecast hourly enum count via STL(trend+weekly); ALERT WHERE observed > forecast_upper_95'
- question: Does an unsupervised process-execution model (Isolation Forest) flag a network-enumeration
    process event on an ICS host as an outlier, and do the top contributing features (parent process,
    user, command-line entropy, prior-10-min enumeration count) explain why?
  context: 'Supports Discovery (TA0102): adversaries blend reconnaissance into normal activity, so a model
    that learns the joint distribution of process attributes can surface combinations the symbolic and
    statistical layers miss. Train an Isolation Forest on historical Sysmon EID 1 process-creation data
    using features: ProcessName (one-hot), ParentProcessName (one-hot), UserName (frequency-encoded),
    command-line length and Shannon entropy, count of network-utility executions in the prior 10 minutes,
    failed-execution count, hour-of-day, and day-of-week. Flag outliers for analyst review and surface
    the top-3 contributing features via SHAP/LIME so the alert is explainable and actionable. Run this
    in parallel with — never replacing — the deterministic rule. A flagged outlier with enumeration-related
    features is a candidate for hands-on triage.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: Endpoint devices of critical ICS assets (Engineering Workstations, HMIs, Historian Servers,
    Data Gateways, Operator Workstations)'
  range: Last 90 days (train on >=60 days history)
  queries:
  - technology: ML/pseudocode
    query: features = onehot(ProcessName,ParentProcessName) + freq_encode(UserName) + [cmdline_len, cmdline_entropy,
      enum_count_prior_10m, failed_exec_count, hour_of_day, day_of_week]; model = IsolationForest(contamination=auto).fit(history);
      score = model.decision_function(today); WHERE score in bottom percentile -> ALERT with top3 SHAP
      features
- question: Is a single ICS source host connecting to more than ~20 unique internal destination IPs within
    a 5-minute window, particularly with a high ratio (>80%) of failed-state connections (S0, REJ, RSTOS0)
    indicative of scanning?
  context: 'Supports Discovery (TA0102): scanning and connection enumeration produce a characteristic
    fan-out — one source touching many previously-uncontacted hosts — and a high fraction of failed connections
    because most targets do not offer the probed service. From Zeek conn.log, alert when a single id.orig_h
    in the NAI connects to >20 unique id.resp_h on the internal network within 5 minutes, especially where
    conn_state IN [''S0'',''REJ'',''RSTOS0''] exceeds 80%. This failure-state floor implements the Threshold
    Random Walk insight that a scanner can be declared after only 4–5 failed connections to new hosts.
    Tune the unique-destination count to the segment''s normal fan-out (PCN hosts are typically very deterministic)
    and keep the threshold in place. A hit is likely active host enumeration; a benign cause might be
    a misconfigured polling service.'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: ICS network segments (Process Control Network - PCN), Network choke points between IT and OT
    networks (DMZ, Purdue Model Zone 3.5), SCADA/DCS networks'
  range: Last 90 days (5-minute windows)
  queries:
  - technology: Zeek/pseudocode
    query: FROM conn.log WHERE id.orig_h IN nai_segments | window 5m BY id.orig_h | eval uniq_dst=dc(id.resp_h),
      fail_ratio=count(conn_state IN ['S0','REJ','RSTOS0'])/count() | WHERE uniq_dst>20 AND fail_ratio>0.8
      | ALERT 'High fan-out internal scan'
- question: In 5-minute windows, does an ICS source host exceed its 99th-percentile baseline for unique
    destination IPs, unique destination ports, destination-IP Shannon entropy, or fraction of S0/REJ connections,
    and does a sequential success/failure likelihood ratio confirm scanning intent?
  context: 'Supports Discovery (TA0102): scanning inflates the dispersion of a host''s traffic. Build
    a 30-day per-source baseline in 5-minute windows of (a) unique destination IP count, (b) unique destination
    port count, (c) Shannon entropy of destination IPs H(X) = -sum P(x_i) log2 P(x_i), and (d) the fraction
    of S0/REJ connections. Destination-IP/port entropy spikes when one source touches many hosts/ports
    — the basis for entropy-threshold scan detection. Alert when any metric exceeds its 99th historical
    percentile, and incorporate the sequential success/failure likelihood ratio (Threshold Random Walk)
    to confirm scanning intent rather than transient bursts. This catches slow or distributed enumeration
    that a fixed count threshold would miss; pairing entropy with the likelihood ratio reduces false positives
    from legitimate multicast/polling.'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: ICS network segments (Process Control Network - PCN), Network choke points between IT and OT
    networks (DMZ, Purdue Model Zone 3.5), SCADA/DCS networks'
  range: Last 90 days (30-day baseline, 5-minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM conn.log WHERE id.orig_h IN nai_segments | window 5m BY id.orig_h | eval uniq_dst=dc(id.resp_h),
      uniq_port=dc(id.resp_p), H=entropy(id.resp_h), fail_frac=count(conn_state IN ['S0','REJ'])/count()
      | baseline p99 over 30d | WHERE uniq_dst>p99 OR uniq_port>p99 OR H>p99 OR fail_frac>p99 | apply
      TRW_likelihood_ratio | ALERT
- question: Does a time-series model (SARIMA) of hourly unique-destination-IP counts per high-value asset,
    or an online autoencoder/Isolation Forest over per-window Zeek features, flag a scan/flood that exceeds
    the seasonal forecast, with the top contributing features surfaced?
  context: 'Supports Discovery (TA0102): legitimate ICS traffic is highly periodic, so a forecast model
    can isolate deviations precisely. Model the hourly count of unique destination IPs per high-value
    asset as a time series and use SARIMA to capture daily/weekly seasonality, alerting when the observed
    count exceeds the 99% forecast upper bound. In parallel, score per-5-minute Zeek feature vectors (unique
    dst IPs/ports, S0/REJ ratio, bytes, duration) with an online autoencoder ensemble (Kitsune-style)
    that detects scans and floods without labels, or with an Isolation Forest, and surface the top-3 contributing
    features per alert for explainability. The two views are complementary: SARIMA catches volume anomalies
    on known assets, the autoencoder catches novel multi-feature patterns. A correlated hit across both
    is strong evidence of enumeration.'
  answer_sources:
  - Zeek conn.log
  - Firewall Logs
  - 'NAI: ICS network segments (Process Control Network - PCN), Network choke points between IT and OT
    networks (DMZ, Purdue Model Zone 3.5), SCADA/DCS networks'
  range: Last 90 days (train SARIMA on >=4 weeks)
  queries:
  - technology: ML/pseudocode
    query: ts = hourly dc(id.resp_h) per asset; model=SARIMA(seasonal=daily,weekly).fit(ts); ALERT WHERE
      observed > forecast_upper_99
  - technology: ML/pseudocode
    query: feat = per_5m[unique_dst_ip,unique_dst_port,s0_rej_ratio,bytes,duration]; ae=KitsuneAutoencoderEnsemble()
      OR IsolationForest(); ALERT WHERE reconstruction_error>thresh with top3 contributing features
- question: Is a connection using an ICS-specific protocol (Modbus/502, S7/102, DNP3/20000, EtherNet-IP/44818,
    OPC UA/4840, IEC 104/2404) originating from a source IP that is not on the version-controlled allow-list
    for that protocol and segment, or carrying malformed/out-of-spec protocol semantics?
  context: 'Supports Discovery (TA0102): an adversary probing field controllers will speak ICS protocols
    from hosts that are not normally authorized to do so. Maintain a version-controlled allow-list of
    authorized [Source_IP, Destination_IP, Destination_Port, Protocol] tuples for the PCN under deny-by-default
    conduit guidance. From Zeek conn.log or firewall logs, alert on any connection where id.orig_h is
    not on the allow-list AND id.resp_p IN [502,102,20000,44818,4840,2404], or where the Zeek service
    field is an ICS protocol from a non-allow-listed source. Pair this with protocol-semantic specification
    rules (valid function codes, command/response pairing, register ranges) so malformed or out-of-spec
    probes are flagged deterministically; mined invariants offer an explainable equivalent. A hit is an
    unauthorized device speaking control protocols — a hallmark of enumeration or staging.'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Firewall Logs
  - 'NAI: Process Control Network (PCN) subnets containing PLCs, RTUs, and other field controllers, ICS
    DMZ, Control Server segment'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: FROM conn.log WHERE (id.resp_p IN [502,102,20000,44818,4840,2404] OR service IN ['modbus','dnp3','s7comm','enip','opcua','iec104'])
      AND [id.orig_h,id.resp_h,id.resp_p,service] NOT IN ics_allowlist | ALERT 'Unauthorized ICS protocol
      connection'
  - technology: Zeek/pseudocode
    query: FROM modbus.log,dnp3.log,s7comm.log WHERE func_code NOT IN valid_funcs[proto] OR register_addr
      OUTSIDE allowed_range OR unmatched_request_response | ALERT 'Out-of-spec ICS protocol semantics'
- question: Within a 1-hour window, does a non-allow-listed source IP contact more than one unique destination
    on ICS ports (multi-target probing), exhibit low-probability ICS transaction types, or send out-of-cadence
    bursts relative to the periodic M2M baseline?
  context: 'Supports Discovery (TA0102): a single misconfiguration usually touches one device, whereas
    enumeration sweeps multiple targets. For traffic from IPs not on the PCN allow-list, count unique
    destination IPs contacted on ICS ports within a 1-hour window and alert when the count exceeds one
    (multi-target probing). Augment with a probabilistic baseline of normal Modbus/ICS transaction types
    and frequencies so low-probability read/identify requests are scored as enumeration. Because SCADA
    M2M traffic is highly periodic, compare inter-arrival cadence against per-link DFA/phase baselines
    and flag out-of-cadence bursts. Explicitly profile rejected/refused ICS connections (state) as a distinct
    probing signal. Multi-target reach plus abnormal cadence or refused connections strongly indicates
    active reconnaissance rather than a benign device fault.'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Firewall Logs
  - 'NAI: Process Control Network (PCN) subnets containing PLCs, RTUs, and other field controllers, ICS
    DMZ, Control Server segment'
  range: Last 90 days (1-hour windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: FROM conn.log WHERE id.orig_h NOT IN pcn_allowlist AND id.resp_p IN ics_ports | window 1h BY
      id.orig_h | eval uniq_dst=dc(id.resp_h), refused=count(conn_state='REJ') | WHERE uniq_dst>1 OR refused>0
      | ALERT 'Multi-target ICS probing from non-allowlisted host'
  - technology: SIEM/Stats pseudocode
    query: '# probabilistic: score(txn)=P(func_code|link) from baseline; ALERT WHERE P<epsilon; cadence:
      compare inter_arrival vs per-link DFA phase; ALERT on out-of-cadence burst'
- question: Does clustering (DBSCAN) of per-source Zeek feature vectors over a 1-hour window flag a host
    as an outlier (label -1) consistent with an unauthorized device performing ICS enumeration, corroborated
    by Isolation Forest / SVM-RF / Matrix-Profile and explained by top contributing features?
  context: 'Supports Discovery (TA0102): unauthorized enumeration hosts behave differently from established
    control devices across many dimensions at once. Build per-source feature vectors from Zeek logs over
    a 1-hour window: connection count, ICS-to-non-ICS port ratio, unique destination-host count, rejected-connection
    (conn_state=''REJ'') ratio, and mean duration. Cluster with DBSCAN and flag outliers (label -1) as
    potential unauthorized devices performing enumeration. Corroborate with an Isolation Forest and an
    SVM/Random-Forest or Matrix-Profile discord detector validated on Modbus SCADA data, surface the top-3
    contributing features per alert, and derive thresholds from labeled ICS datasets. A host that is an
    outlier across multiple detectors is a high-confidence candidate for an unauthorized device mapping
    the control network.'
  answer_sources:
  - Zeek conn.log
  - Zeek dnp3.log
  - Zeek modbus.log
  - Zeek s7comm.log
  - Firewall Logs
  - 'NAI: Process Control Network (PCN) subnets containing PLCs, RTUs, and other field controllers, ICS
    DMZ, Control Server segment'
  range: Last 90 days (1-hour windows)
  queries:
  - technology: ML/pseudocode
    query: feat = per_source_1h[conn_count, ics_to_nonics_port_ratio, uniq_dst_host, rej_ratio, mean_duration];
      labels=DBSCAN(eps,min_samples).fit_predict(feat); outliers = feat[labels==-1]; corroborate IsolationForest
      + SVM/RF + MatrixProfile_discord; ALERT outliers with top3 features
