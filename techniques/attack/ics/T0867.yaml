name: 'T0867: Lateral Tool Transfer'
id: cef502fa-81d7-4aa9-a28f-f5973d158294
description: Investigate possible Lateral Tool Transfer within an ICS/OT environment, where an adversary
  copies executables, libraries, scripts, or ICS project/logic files (e.g., .exe, .dll, .ps1, .vbs, .bat,
  .ACD, .L5K, .XEF, .PC5) between internal assets to stage tooling and support lateral movement and remote
  execution. This playbook helps an analyst determine whether unauthorized tools or files are being pushed
  to critical assets such as Engineering Workstations (EWS), HMIs, Historians, and SCADA servers over
  SMB, FTP/SFTP, or HTTP, and whether transferred files are subsequently executed. It pairs deterministic
  detections (admin-share writes to C$/ADMIN$, source-host whitelisting, write-then-execute correlation
  of Windows Event ID 5145 and 4688) with statistical baselining of transfer volume, frequency, file prevalence/entropy,
  and failed/blocked push attempts, plus machine-learning anomaly models — covering both the Lateral Movement
  that delivers the tooling and the resulting Impact on operations.
type: technique
related:
- tactic_id: TA0105
  tactic_name: Impact
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Is an internal OT host transferring an executable, library, script, or ICS project/logic file
    (e.g., .exe, .dll, .ps1, .vbs, .bat, .ACD, .L5K, .XEF, .PC5) over SMB/FTP/HTTP to another OT asset
    from a source that is not on the authorized tool-distribution whitelist, to an administrative share,
    or with execution follow-on within five minutes?
  context: Lateral Tool Transfer that ultimately enables Impact on the industrial process begins with
    staging tooling on OT assets. Inspect Zeek smb_files.log/files.log/ftp.log (modeled on [BZAR](https://github.com/mitre-attack/bzar)
    SMB/DCE-RPC inspection and translatable [Sigma](https://github.com/SigmaHQ/sigma) admin-share/remote-copy
    rules) for high-risk or ICS file types moving between hosts. Treat a transfer as suspicious when the
    source host (id.orig_h) is absent from the approved distribution whitelist, the SMB path includes
    an administrative share (C$, ADMIN$), or a matching Windows Event ID 4688 process creation whose NewProcessName
    equals the written path occurs on the destination within 300 seconds. A positive result indicates
    staged adversary tooling that may be used to manipulate or disrupt the process; a negative result
    narrows the activity to sanctioned distribution. Validate the rules with [Atomic Red Team T1021.002](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.002/T1021.002.md)
    emulation telemetry.
  answer_sources:
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5145
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian servers, SCADA servers, file shares within the
    OT network, and network segments (Purdue Level 2/3 and the IT/OT boundary at Level 3.5) where SMB
    or file-transfer traffic is monitored.'
  range: Last 90 days (correlate file write with process execution within a 300-second window)
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log OR smb_files.log OR ftp.log\n  WHERE filename MATCHES /\\.(exe|dll|ps1|vbs|bat|ACD|L5K|XEF|PC5)$/\n\
      \  AND (id.orig_h NOT IN authorized_distribution_whitelist OR smb_path MATCHES /(C\\$|ADMIN\\$)/)\n\
      \  | join Win:EventID=4688 ON dest_host WHERE NewProcessName == written_path AND (t_4688 - t_write)\
      \ <= 300s"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  ALERT WHEN (Zeek transfer of high-risk/ICS extension between OT hosts)\n  AND (source_host\
      \ NOT IN whitelist OR target_share IN [C$, ADMIN$]\n       OR EventID4688.NewProcessName == transferred_path\
      \ WITHIN 300s ON dest)"
- question: Does any observed tool or ICS project-file transfer to a critical OT asset fall outside the
    approved specification of permitted source-destination-protocol tuples?
  context: Because labeled OT attack data is scarce, a specification/semantic whitelist of allowed (source,
    destination, protocol, share) tuples generalizes better than signatures, as in [Distributed IDS with
    Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917) and [Specification-based Detection
    in Smart Grids](https://arxiv.org/abs/2209.04354). Maintain an explicit allow-list for the OT segment
    and deterministically alert on any tool/project-file transfer to a critical asset that uses an unapproved
    host, protocol, or share. A positive result is a high-confidence deviation from sanctioned engineering
    workflows that could stage capability for Impact; a negative result confirms the transfer matched
    policy. Keep the specification current with maintenance schedules to avoid false positives.
  answer_sources:
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5145
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian servers, SCADA servers, file shares within the
    OT network, and network segments (Purdue Level 2/3 and the IT/OT boundary at Level 3.5) where SMB
    or file-transfer traffic is monitored.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  ALERT WHEN transfer.dest IN critical_assets\n  AND (transfer.src, transfer.dest, transfer.protocol,\
      \ transfer.share) NOT IN approved_specification"
- question: Do transfer volume, frequency, or file prevalence to a given OT destination deviate from its
    30-day baseline — for example bytes-per-transfer or transfers-per-hour above the 98th percentile /
    3 standard deviations, or a file whose SHA-256 or filename has prevalence below 5 in the prior 90
    days?
  context: Adversary tool staging often manifests as statistically unusual transfers. Using Zeek conn.log/files.log
    baselining as in [RITA](https://github.com/activecm/rita), build a per-destination 30-day rolling
    baseline of bytes-per-transfer (Volume) and transfers-per-hour (Frequency), and alert on values exceeding
    the 98th percentile or >3 standard deviations. Also alert on low-prevalence files (SHA-256 or filename
    prevalence < 5 in the prior 90 days), filename Shannon-entropy outliers, and first-seen source-destination
    pairs. A positive result flags rare or bursty deliveries consistent with staging; a negative result
    indicates routine volumes. Derive per-asset thresholds from labeled [Security Datasets](https://github.com/OTRF/Security-Datasets).
  answer_sources:
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5145
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian servers, SCADA servers, file shares within the
    OT network, and network segments (Purdue Level 2/3 and the IT/OT boundary at Level 3.5) where SMB
    or file-transfer traffic is monitored.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = STATS p98(bytes), p98(transfers_per_hour), mean+3*stdev BY dest OVER 30d\n\
      \  ALERT WHEN bytes > p98_bytes OR transfers_per_hour > mean+3*stdev\n  OR prevalence(sha256|filename,\
      \ 90d) < 5 OR entropy(filename) OUTLIER OR first_seen(src,dest)"
- question: Are failed or blocked tool-push attempts (SMB STATUS_ACCESS_DENIED / denied Event ID 5145
    writes, FTP 5xx, or 4625 failed logons) to critical OT assets exceeding the historical mean by more
    than three standard deviations within a 10-minute window?
  context: Before a successful transfer an actor frequently probes for a writable path, producing a spike
    in access-denied and failed-write responses. Track the state of transfer attempts and baseline normal
    rates of SMB STATUS_ACCESS_DENIED, denied Event ID 5145 writes, FTP 5xx responses, and 4625 failed
    logons per source host. Alert when failed/blocked push attempts to critical OT assets exceed the historical
    mean by >3 standard deviations within a 10-minute window. A positive result suggests reconnaissance
    for a writable transfer path preceding staging for Impact; a negative result indicates normal authentication/permission
    failure rates.
  answer_sources:
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5145
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian servers, SCADA servers, file shares within the
    OT network, and network segments (Purdue Level 2/3 and the IT/OT boundary at Level 3.5) where SMB
    or file-transfer traffic is monitored.'
  range: Last 90 days (10-minute sliding window for spike detection)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  failures = COUNT(SMB_ACCESS_DENIED OR EventID5145_denied OR FTP_5xx OR EventID4625)\
      \ BY src_host, 10m\n  baseline = mean,stdev BY src_host OVER 90d\n  ALERT WHEN failures > mean +\
      \ 3*stdev AND dest IN critical_assets"
- question: Does a supervised or reconstruction-error ML model flag a transfer/flow as anomalous based
    on features such as file size, extension, source/destination subnet, protocol, time-of-day, and transfer
    count?
  context: To catch staging that evades static rules, train a supervised classifier (Random Forest or
    SVM, per [Anomaly-based IDS with SVM and Random Forests](https://arxiv.org/abs/1907.10374)) on transfer/flow
    features and/or a reconstruction-error model (per [CNN/autoencoder ICS detection](https://arxiv.org/abs/1806.08110)).
    Every alert should surface the top-3 contributing features (e.g., file size, extension, first-seen
    pair) so an analyst can triage quickly. Run this in parallel with — never as a replacement for — the
    deterministic rules. A positive result is an anomalous transfer warranting investigation as potential
    tool staging supporting Impact; a negative result means the flow resembles learned-normal behavior.
  answer_sources:
  - Zeek smb_files.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5145
  - 'NAI: Engineering Workstations (EWS), HMIs, Historian servers, SCADA servers, file shares within the
    OT network, and network segments (Purdue Level 2/3 and the IT/OT boundary at Level 3.5) where SMB
    or file-transfer traffic is monitored.'
  range: Last 90 days (model trained on historical baseline)
  queries:
  - technology: ML/pseudocode
    query: ">-\n  features = [file_size, extension, src_subnet, dst_subnet, protocol, time_of_day, transfer_count]\n\
      \  model = RandomForest|SVM | autoencoder(reconstruction_error)\n  ALERT WHEN score > threshold\
      \ ; REPORT top3_feature_importances"
- question: Does a SIEM query of Zeek logs show a file with a high-risk extension (.exe, .dll, .ps1, .bat,
    .sh, .zip, .rar) or an ICS project/logic extension (.ACD, .PC5, .XEF, .L5K) being transferred to a
    critical ICS asset, or a write to an administrative share, from a source IP that is not on the authorized
    whitelist?
  context: This is the core deterministic detection for Lateral Tool Transfer over the network. Query
    Zeek smb_files.log, ftp.log, and files.log for transfers destined to critical ICS assets (EWS, HMIs,
    Historians) and trigger when the filename ends in a high-risk or ICS project/logic extension, or when
    the SMB path includes an administrative share (C$, ADMIN$) and the source IP (id.orig_h) is not on
    the pre-defined whitelist of authorized administrative/engineering systems. Base SMB/DCE-RPC inspection
    on [BZAR](https://github.com/mitre-attack/bzar) and translatable [Sigma](https://github.com/SigmaHQ/sigma)
    rules. A positive result indicates an unauthorized tool/file being pushed to a control asset to enable
    lateral movement; a negative result narrows to sanctioned transfers. Validate with [Atomic Red Team
    T1021.002](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.002/T1021.002.md).
  answer_sources:
  - Zeek smb_files.log
  - Zeek ftp.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic sensors deployed at key chokepoints, such as the IT/OT boundary (Purdue Level
    3.5), between control and supervisory zones (Purdue Level 2/3), and monitoring traffic to and from
    critical assets like Engineering Workstations (EWS), Human Machine Interfaces (HMIs), and Historian
    databases.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  smb_files.log OR ftp.log OR files.log\n  WHERE id.resp_h IN critical_ics_assets\n  AND\
      \ (filename MATCHES /\\.(exe|dll|ps1|bat|sh|zip|rar|ACD|PC5|XEF|L5K)$/\n       OR (smb_path MATCHES\
      \ /(C\\$|ADMIN\\$)/ AND id.orig_h NOT IN whitelist))"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  ALERT WHEN dest IN critical_ics_assets AND (high_risk_or_ics_extension(file)\n  OR (admin_share\
      \ AND src_ip NOT IN authorized_whitelist))"
- question: Does any OT file transfer to a critical asset fall outside the explicit specification of permitted
    source-destination-protocol tuples?
  context: Specification-based detection generalizes where labeled OT attack data is scarce. Maintain
    an explicit allow-list of permitted (source, destination, protocol) tuples for OT file transfers,
    following [Distributed IDS with Semantic-based Rules for SCADA](https://arxiv.org/abs/2412.07917)
    and [Specification-based Detection in Smart Grids](https://arxiv.org/abs/2209.04354), and deterministically
    alert on any transfer to a critical asset outside the approved specification. A positive result is
    a high-confidence policy deviation indicative of lateral movement; a negative result confirms compliance
    with sanctioned engineering workflows.
  answer_sources:
  - Zeek smb_files.log
  - Zeek ftp.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic sensors deployed at key chokepoints, such as the IT/OT boundary (Purdue Level
