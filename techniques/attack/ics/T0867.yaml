- question: Do file transfers to a critical ICS asset breach its 30-day rolling baseline of file size,
    transfers-per-hour, filename entropy, or unique source-destination pairs — for example size/entropy
    above the 98th percentile, hourly count above 3 standard deviations, or a first-seen source-destination
    pair?
  context: Anomalous transfer characteristics often reveal lateral tool staging. Using Zeek-only baselining
    as in [RITA](https://github.com/activecm/rita), establish for each critical destination a 30-day rolling
    baseline of file sizes (Volume), transfers-per-hour (Frequency), filename Shannon entropy, and unique
    source-destination IP pairs. Alert when a new transfer's size or entropy exceeds the 98th percentile,
    the hourly transfer count exceeds 3 standard deviations, or the source-destination pair is seen for
    the first time in the window. A positive result flags statistically unusual delivery consistent with
    lateral movement; a negative result indicates routine activity.
  answer_sources:
  - Zeek smb_files.log
  - Zeek ftp.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic sensors deployed at key chokepoints, such as the IT/OT boundary (Purdue Level
    3.5), between control and supervisory zones (Purdue Level 2/3), and monitoring traffic to and from
    critical assets like Engineering Workstations (EWS), Human Machine Interfaces (HMIs), and Historian
    databases.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  baseline = p98(file_size), p98(entropy(filename)), mean+3*stdev(transfers_per_hour),\
