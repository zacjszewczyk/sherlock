    query: ">-\n  features = [hourly_transfer_count, volume, ext_distribution, unique_src_subnets, unique_dst_subnets,\
      \ protocol]\n  model = RandomForest|SVM | autoencoder\n  ALERT WHEN anomaly_score > threshold ;\
      \ REPORT top3_features"
- question: On a critical ICS host, does a Windows Event ID 5145 show a network-share write (Accesses
    contains WriteData or AppendData, mask 0x2) to an administrative share or a sensitive directory (e.g.,
    PLC project files) from a source address or account not on the whitelist for that host and share?
  context: Detailed file-share auditing reveals tool transfers landing on the destination host. Filter
    Event ID 5145 on critical ICS hosts (HMIs, EWS, Historians, SCADA servers) and alert when the Accesses
    field contains WriteData or AppendData, the ShareName is an administrative share (e.g., \\*\C$) or
    the RelativeTargetName points to a sensitive directory (such as those holding PLC project files),
    and the SourceAddress or AccountName is not on the pre-defined whitelist for that host. Align share/path
    content with [BZAR](https://github.com/mitre-attack/bzar) and [Sigma](https://github.com/SigmaHQ/sigma)
    admin-share rules. A positive result indicates an unauthorized write that may be staging adversary
    tooling; a negative result confirms an authorized writer. Validate with [Atomic Red Team T1021.002](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.002/T1021.002.md).
  answer_sources:
  - Windows Event ID 5145
  - 'NAI: Critical ICS hosts (e.g., HMIs, Engineering Workstations, Historians, SCADA servers) where Windows
    security auditing for detailed file share access is enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  EventID=5145 ON critical_ics_hosts\n  WHERE Accesses CONTAINS (WriteData OR AppendData)\n\
      \  AND (ShareName MATCHES /\\\\.*\\\\C\\$/ OR RelativeTargetName IN sensitive_dirs)\n  AND (SourceAddress\
      \ NOT IN whitelist OR AccountName NOT IN whitelist)"
- question: Do share writes (Event ID 5145) on a critical ICS host deviate from its 30-day baseline of
    SourceAddress-AccountName-ShareName combinations — for example an hourly write count above 3 standard
    deviations, a never-before-seen writer, or a never-before-seen file extension in that context?
  context: Baseline normal write activity per critical ICS host using Event ID 5145 grouped by unique
    SourceAddress-AccountName-ShareName combinations, tracking event frequency and the set of file extensions
    written. Alert when the hourly write count for a combination exceeds three standard deviations from
    its historical mean, a write occurs from a SourceAddress/AccountName never seen writing to that share,
    or a file extension never seen in that context appears. A positive result flags anomalous write behavior
    consistent with lateral tool transfer; a negative result indicates routine writes. Derive per-host
    thresholds using labeled [Security Datasets](https://github.com/OTRF/Security-Datasets).
  answer_sources:
  - Windows Event ID 5145
  - 'NAI: Critical ICS hosts (e.g., HMIs, Engineering Workstations, Historians, SCADA servers) where Windows
    security auditing for detailed file share access is enabled.'
  range: Last 90 days (30-day baseline)
  queries:
