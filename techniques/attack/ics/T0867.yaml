- question: On the same ICS host, is a Windows Event ID 5145 write (WriteData) followed within 300 seconds
    by a Windows Event ID 4688 process creation whose NewProcessName exactly matches the written RelativeTargetName,
    with a non-whitelisted parent process or source account?
  context: Write-then-execute is a hallmark of lateral tool transfer culminating in remote execution.
    Create a high-priority correlation rule that fires when an Event ID 5145 (WriteData) on an ICS host
    is followed within 300 seconds by an Event ID 4688 on the same host where EventID_5145.RelativeTargetName
    matches EventID_4688.NewProcessName. Refine by alerting only when the 4688 ParentProcessName is not
    on a whitelist (e.g., explorer.exe, services.exe, approved deployment tools) and the source account
    is not an approved administrative/service account. A positive result strongly indicates an adversary
    staging and executing a transferred tool; a negative result reflects legitimate software deployment.
    Validate with [Atomic Red Team T1021.002](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1021.002/T1021.002.md).
  answer_sources:
  - Windows Event ID 5145
  - Windows Event ID 4688
  - 'NAI: Critical ICS hosts (e.g., HMIs, Engineering Workstations, Historians) with security event logging
    enabled for both detailed file share auditing and process creation.'
  range: Last 90 days (300-second write-to-execute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  CORRELATE EventID=5145(Accesses CONTAINS WriteData) AS w\n  WITH EventID=4688 AS p ON\
      \ same_host\n  WHERE p.NewProcessName == w.RelativeTargetName AND (p.time - w.time) <= 300s\n  AND\
      \ p.ParentProcessName NOT IN whitelist AND p.SourceAccount NOT IN approved_accounts"
- question: For a process executed from a network share, is the write-then-execute occurrence statistically
    rare (fewer than 5 times in 90 days), is the write-to-execution time delta below the 5th percentile,
