  context: Train a multivariate anomaly model on historical Zeek log data — Random Forest/SVM ([Anomaly-based
    IDS with SVM and Random Forests](https://arxiv.org/abs/1907.10374)) or a reconstruction-error model
    ([CNN/autoencoder ICS detection](https://arxiv.org/abs/1806.08110)). Features should include hourly
    transfer count, volume transferred, distribution of file extensions, unique source/destination subnets,
    and protocol (SMB, FTP, etc.). Surface the top-3 contributing features in each alert (e.g., a spike
    in .exe transfers to HMIs, or transfers from a never-before-seen source subnet to an EWS), and deploy
    in parallel with the deterministic rules. A positive result is an anomalous transfer pattern warranting
    lateral-movement investigation; a negative result resembles learned-normal behavior.
  answer_sources:
  - Zeek smb_files.log
  - Zeek ftp.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic sensors deployed at key chokepoints, such as the IT/OT boundary (Purdue Level
