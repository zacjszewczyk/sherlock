      \ OR (src,dst) NOT IN seen_pairs"
- question: Are SMB access-denied / failed-write responses or FTP 5xx errors per source toward a critical
    asset exceeding the historical mean by more than three standard deviations within a 10-minute window?
  context: Profiling failed/blocked transfers exposes an actor probing for a writable path before a successful
    push. Baseline the state of transfers by tracking SMB access-denied/failed-write responses and FTP
    5xx error rates per source toward critical assets, and alert when failed/blocked attempts to an EWS/HMI/Historian
    exceed the historical mean by >3 standard deviations in a 10-minute window. Periodic OT timing baselines
    ([Temporal Phase Shifts in SCADA Networks](https://arxiv.org/abs/1808.05068)) help distinguish scheduled
    maintenance pushes from anomalous bursts. A positive result indicates path-probing reconnaissance
    preceding lateral movement; a negative result reflects normal failure rates.
  answer_sources:
  - Zeek smb_files.log
  - Zeek ftp.log
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic sensors deployed at key chokepoints, such as the IT/OT boundary (Purdue Level
    3.5), between control and supervisory zones (Purdue Level 2/3), and monitoring traffic to and from
