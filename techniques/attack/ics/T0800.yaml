name: 'T0800: Activate Firmware Update Mode'
id: 5ab7354a-0346-4425-9820-f031cfe7dc56
description: 'Investigate whether an adversary has placed a critical ICS device (e.g., PLC, RTU, or protection
  relay) into firmware update mode to inhibit its safety, protection, and operator-intervention functions.
  This playbook helps an analyst correlate suspicious engineering-workstation activity (firmware utilities
  or scripting engines invoked with firmware/mode keywords) with network evidence such as large image
  transfers and unauthorized ICS state-change commands (Modbus Write Multiple Registers / diagnostics,
  DNP3 Cold Restart, EtherNet/IP Set_Attribute_Single). It also guides detection of the tell-tale aftermath
  of a forced mode change: a device that remains reachable at the network layer (ICMP) but stops answering
  application-layer health/status queries, sustained polling/heartbeat gaps, anomalous write-to-read ratios,
  protocol exception spikes, and hung TCP sessions. Symbolic-logic, statistical, and machine-learning
  approaches are provided so deterministic allowlist/maintenance-window rules run in parallel with anomaly
  models for defensible, explainable alerting.'
type: technique
related:
- tactic_id: TA0107
  tactic_name: Inhibit Response Function
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did an engineering workstation, HMI, or jump server execute a known firmware/flash utility
    or scripting engine with command-line arguments referencing firmware, flashing, reset, maintenance,
    or mode changes, and was that execution followed within ~90 seconds by a large file transfer to a
    critical ICS device or a sustained loss of that device's communications?
  context: 'Forcing a device into firmware update mode usually begins from a trusted engineering host.
    Look for Windows Event ID 4688 process creation events where the new process is a vendor tool or scripting
    engine (e.g., UnityPro.exe, Studio5000.exe, TiaPortal.exe, powershell.exe, putty.exe) and the command
    line contains keywords like ''firmware'', ''update'', ''flash'', ''reset'', ''maintenance'', or ''mode''.
    Per NIST SP 800-82r3, gate the alert on an approved engineering-station allowlist and a documented
    maintenance window, escalating if either fails. Correlate within 90 seconds with Zeek network logs:
    a connection from the host to a critical ICS asset where conn.log orig_bytes > 1MB on a control port
    (21, 69, 80, 502, 44818), or files.log shows a firmware-related filename or application/octet-stream
    MIME type. This pairing of host intent plus a large image transfer is the precursor to a forced mode
    change in the Inhibit Response Function tactic; a positive result means a likely firmware push that
    can halt protection functions, while a benign result is a sanctioned, allowlisted maintenance update.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek files.log
  - Zeek ftp.log
  - Zeek http.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), and Jump Servers within the
    Process Control and Supervisory network segments (Purdue Level 2/3), and network TAPs monitoring traffic
    to and from these assets.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: EventID=4688 AND host IN ews_hmi_nai AND new_process IN ['UnityPro.exe','Studio5000.exe','TiaPortal.exe','powershell.exe','putty.exe']
      AND command_line MATCHES /(firmware|update|flash|reset|maintenance|mode)/i AND NOT (host IN approved_eng_allowlist
      AND maintenance_window=active) => raise alert
  - technology: Zeek/pseudocode
    query: 'correlate within 90s: conn.log where id.orig_h=ews AND id.resp_h IN critical_ics AND id.resp_p
      IN [21,69,80,502,44818] AND orig_bytes>1000000 OR files.log where tx_host=ews AND (filename ~ firmware
      OR mime_type=''application/octet-stream'')'
- question: On an engineering workstation, did a process run with command-line arguments that are statistically
    novel compared to its 30-day history, and did the targeted ICS device's periodic heartbeat then exceed
    its expected inter-arrival time (a sustained >120 second polling gap) within the next 5 minutes?
  context: Adversary mode-change commands rarely match the routine argument patterns engineers use. For
    each EWS, build a 30-day rolling baseline of command-line argument sets per process, then compute
    the Jaccard similarity between each new execution's argument set and history; similarity below 0.2
    indicates a novel command structure worth attention. In parallel, baseline each target device's heartbeat
    inter-arrival time using the Modbus DFA periodicity model of Goldenberg and Wool with phase-shift
    correction (Temporal Phase Shifts in SCADA Networks) to suppress scheduled-change false positives.
    Escalate when a host command-line anomaly is followed by the device's heartbeat inter-arrival time
    exceeding the 99.9th percentile of its phase-corrected baseline within 5 minutes. Thresholds must
    be derived per device because polling rates differ. A positive result links anomalous operator intent
    to a device that has gone quiet, the signature of an inhibited response function.
  answer_sources: *id001
  range: Last 90 days; baseline 30 days, correlate host anomaly with device heartbeat over the following
    5 minutes
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each EventID=4688 on ews: jac = jaccard(arg_set, baseline_arg_set[process,30d]); flag
      if jac < 0.2'
  - technology: Zeek/Stats pseudocode
    query: 'baseline per device: heartbeat_iat ~ phase_corrected_periodicity; if host_cmd_anomaly then
      within 5m: alert if device_heartbeat_iat > p99.9(baseline) (gap > 120s)'
- question: Does a supervised classifier label an engineering-workstation process-creation event as a
    suspicious firmware/update action, and does a network-flow autoencoder then flag anomalous Zeek flow
    behavior to the targeted ICS device with explainable top contributing features?
  context: This ML approach augments (never replaces) the deterministic rules per 'A False Sense of Security'.
    Train a Random Forest on labeled Windows Event ID 4688 data using features such as process name, parent
    process name, command-line entropy, special-character count, user context, and time-of-day, emitting
    the top-3 feature importances for explainability. Classify each event as 'Benign', 'Authorized Maintenance',
    or 'Suspicious-Update'. Feed 'Suspicious-Update' events into an online autoencoder (Kitsune-style)
    over 1-minute Zeek flow aggregations (byte volume, packet count, protocol mix, inter-arrival jitter)
    and alert when reconstruction error spikes, surfacing the top contributing features via SHAP. A positive
    result is a high-confidence, explainable indication that a suspicious firmware push coincided with
    abnormal device communications, supporting the Inhibit Response Function hypothesis; analysts should
    always confirm against the symbolic-logic rules.
  answer_sources: *id001
  range: Last 90 days; 1-minute flow aggregations
  queries:
  - technology: ML/pseudocode
    query: 'rf = RandomForest(features=[proc,parent,cmd_entropy,special_chars,user,tod]); label=rf.predict(event);
      emit top3 importances; if label==''Suspicious-Update'': ae=Kitsune(zeek_flow_1min[byte_vol,pkt_cnt,proto_mix,iat_jitter]);
      alert if ae.recon_error spikes; explain via SHAP'
- question: Was a low-prevalence ICS state-change or diagnostic command (e.g., Modbus FC 8/16/17/43, DNP3
    FC 13 Cold Restart, or EtherNet/IP Set_Attribute_Single on a state/mode object) sent to a critical
    asset from a source or context not on the approved allowlist or outside a maintenance window?
  context: Entering firmware update mode is typically triggered by a specific protocol command. Deploy
    SIEM rules on Zeek ICS protocol logs for state-change/diagnostic function codes targeting critical
    PLCs, RTUs, and protection relays. Following semantic/specification rule sets (Distributed IDS using
    Semantic-based Rules for SCADA; On Specification-based Cyber-Attack Detection in Smart Grids), validate
    the function code, command/response pairing, and target register against a documented allowlist; per
    NIST SP 800-82r3, require the source IP to be an approved engineering station inside a maintenance
    window. If either check fails, raise a high-priority alert. A positive result is an unauthorized command
    capable of halting the device's protective functions; a negative result indicates a sanctioned diagnostic/maintenance
    action by an approved station.
  answer_sources: &id002
  - Zeek conn.log
  - Zeek modbus.log
  - Zeek dnp3.log
  - Zeek enip.log
  - Zeek weird.log
  - 'NAI: Network sensor appliances (e.g., Zeek sensors) deployed on SPAN ports or network TAPs at the
    boundaries between Purdue Levels 1 (Basic Control), 2 (Area Supervisory Control), and 3 (Site Control),
    with a focus on traffic flows involving critical PLCs, RTUs, and protection relays.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: (log='zeek_modbus.log' AND function_code IN ['8','16','17','43']) OR (log='zeek_dnp3.log' AND
      function_code='13') OR (log='zeek_enip.log' AND service='Set_Attribute_Single' AND object IN state_mode_objects)
      AND target IN critical_assets AND NOT (orig_h IN approved_eng_station AND maintenance_window=active
      AND register IN allowlist) => high alert
- question: Within 5 minutes of a candidate state-change command, did the targeted device's write-to-read
    function-code ratio exceed its 99th percentile or its polling-response gap exceed its 99.5th percentile
    (>120 seconds), indicating the device has been inhibited?
  context: 'Build a 30-day rolling baseline of each critical device''s communication profile from Zeek
    protocol logs, tracking the write-to-read function-code ratio (Volume) and the mean inter-arrival
    time of polling requests (Frequency), modeling each channel''s periodicity per Goldenberg and Wool
    and Temporal Phase Shifts in SCADA Networks. Alert if, within 5 minutes of a candidate state-change
    command, the write-to-read ratio exceeds the device''s 99th percentile OR the polling-response gap
    exceeds its 99.5th percentile for more than 120 seconds, signalling the device has stopped its normal
    cyclic exchange. Frequency-domain loss of periodicity can be scored directly (Efficient Cyber Attack
    Detection in ICS Using Lightweight NN and PCA). Derive all percentiles per device. A positive result
    couples the triggering command with the device falling silent, the State: device inhibited condition
    central to Inhibit Response Function.'
  answer_sources: *id002
  range: Last 90 days; baseline 30 days, evaluate 5-minute window after candidate command
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per device 30d: wr_ratio=writes/reads, poll_iat; on candidate state_change_cmd: within
      5m alert if wr_ratio > p99(device) OR poll_gap > p99.5(device) (> 120s)'
- question: Did the targeted device's protocol error/failure rate (Modbus exceptions, DNP3 IIN error bits,
    Zeek weird.log entries, TCP RST/retransmissions, refused control-port connections) spike above its
    baseline coincident with a state-change command?
  context: 'A device entering firmware-update mode typically begins rejecting or failing to acknowledge
    subsequent application requests. Profile each device''s error/failure rate as a distinct signal: Modbus
    exception responses, DNP3 IIN error bits, Zeek weird.log entries, TCP RSTs/retransmissions, and blocked/refused
    connections on control ports. Baseline the normal exception rate per device and alert on a sustained
    spike (e.g., above the 99th percentile over a 5-minute window) coincident with a state-change command.
    Specification rules (On Specification-based Cyber-Attack Detection in Smart Grids) treat this as an
    out-of-spec protocol state. A positive result indicates the device has shifted into a non-serving
    mode right after a suspicious command, supporting the inhibited-response hypothesis.'
  answer_sources: *id002
  range: Last 90 days; 5-minute evaluation window around candidate command
  queries:
  - technology: Zeek/Stats pseudocode
    query: err_rate = count(modbus_exception, dnp3_iin_err, weird.log, tcp_rst/retrans, refused_conn)
      per device per 5m; baseline p99(device); alert if err_rate > p99 AND coincides with state_change_cmd
- question: Does a multivariate time-series model (VAE or seq2seq predictor) over a device's Zeek communication
    features produce a reconstruction/prediction error above the 99.8th percentile of clean training,
    with explainable top contributing features?
  context: 'Implement a per-device-group multivariate anomaly model (Variational Autoencoder, or a sequence-to-sequence
    predictor as in Anomaly Detection for ICS Using Seq2Seq Neural Networks, HAI dataset). Build the feature
    vector from 1-minute Zeek aggregations: connection count, total bytes, destination-port entropy, Modbus
    function-code distribution, DNP3 object-group counts, ENIP service-call rate, and exception rate.
    Alert when the reconstruction/prediction error exceeds the 99.8th percentile of a clean-training baseline
    (mirroring CNN reconstruction-error approaches), and surface the top-3 contributing features via SHAP.
    Keep this parallel to the deterministic rules per ''A False Sense of Security''. A positive result
    is a holistic, explainable anomaly in the device''s communications consistent with a forced state/mode
    change in the Inhibit Response Function tactic.'
  answer_sources: *id002
  range: Last 90 days; 1-minute aggregations
  queries:
  - technology: ML/pseudocode
    query: feat = zeek_1min[conn_cnt,total_bytes,dport_entropy,modbus_fc_dist,dnp3_objgrp,enip_svc_rate,err_rate];
      model=VAE_or_seq2seq(per_device_group); alert if recon_error > p99.8(clean_train); explain via SHAP
      top3
- question: Is a critical ICS device still answering ICMP echo requests (reachable) while it has stopped
    responding to application-layer health/status queries (Modbus/DNP3/ENIP) for more than 10 minutes,
    outside any maintenance window?
  context: An inhibited or update-mode device is often online at the network layer but dead at the application
    layer. Maintain a state table of critical ICS assets with 'last_app_response' (updated by Modbus/DNP3/ENIP
    responses in Zeek) and 'last_icmp_response' (from Zeek icmp.log). Per the operational state checks
    in NIST SP 800-82r3, trigger a high-priority alert when (now() - last_app_response > 10 minutes) AND
    (now() - last_icmp_response < 2 minutes) and no maintenance window is active. The device is reachable
    but not performing its function, the signature of an inhibited/update-mode device. The >10-minute
    threshold distinguishes this from a normal reboot. A positive result is strong evidence the device's
    response functions have been disabled.
  answer_sources: &id003
  - Zeek conn.log
  - Zeek icmp.log
  - Zeek modbus.log
  - 'NAI: Network TAPs monitoring traffic to and from critical controllers (PLCs, RTUs, IEDs) in Purdue
    Level 1 and 2, and the central network core where ICMP traffic might be observed.'
  range: Last 90 days; near-real-time state evaluation
  queries:
  - technology: SIEM/Rule pseudocode
    query: maintain state[asset]{last_app_response (from modbus/dnp3/enip resp), last_icmp_response (icmp.log)};
      alert if (now()-last_app_response > 10m) AND (now()-last_icmp_response < 2m) AND maintenance_window
      != active
- question: Are there TCP sessions to a device's control ports (502, 20000, 44818) that remain ESTABLISHED
    with zero application-layer data transfer for longer than the 98th percentile of historical session
    durations for that device-port pair?
  context: A hung process or non-operational mode often leaves TCP sessions open but idle. For each critical
    device, baseline TCP session duration on control ports (502, 20000, 44818) from Zeek conn.log using
    the per-channel periodicity model of Goldenberg and Wool. Alert if a session stays ESTABLISHED with
    zero application-layer data transfer (orig_bytes and resp_bytes static, Volume=0) for longer than
    the 98th percentile of historical session durations for that device-port pair, indicating a hung process
    or non-operational mode. Also profile blocked/refused reconnection attempts as a distinct failure-mode
    signal. A positive result suggests the device is online but non-functional, consistent with firmware
    update mode inhibiting normal response functions.
  answer_sources: *id003
  range: Last 90 days; baseline historical session durations per device-port pair
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'from conn.log per device-port in [502,20000,44818]: baseline p98(session_duration); alert
      if conn_state=ESTAB AND orig_bytes==0 AND resp_bytes==0 AND duration > p98(device,port); also flag
      refused reconnections'
- question: Does a time-series forecasting model show a device's application-layer response count dropping
    to zero for consecutive 1-minute bins where the forecast was significantly positive, while ICMP confirms
    the device is still online?
  context: Develop a time-series forecasting model (seq2seq RNN, or predictive CNN) for each device's
    expected application-layer response count in 1-minute bins, learning daily/weekly seasonality and
    normal maintenance periods. Alert when the observed count is zero for consecutive bins where the forecast
    (with uncertainty interval) was significantly positive (Frequency drop). Cross-validate with ICMP
    responsiveness to confirm the device is still online before escalating, and surface the top contributing
    temporal features via SHAP. This separates true inhibition from expected idle periods. A positive
    result, where forecasted activity vanishes but the device still answers ICMP, is a strong indicator
    the device's primary functions are inhibited as in firmware update mode under the Inhibit Response
    Function tactic.
  answer_sources: *id003
  range: Last 90 days; 1-minute bins with daily/weekly seasonality
  queries:
  - technology: ML/pseudocode
    query: forecast app_resp_count per device per 1m bin (seq2seq/CNN, seasonal); alert if observed==0
      for consecutive bins where forecast_lower>0 AND icmp_alive(device)==true; explain via SHAP
