name: 'T0886: Remote Services'
id: 65096cf4-e381-4454-9968-fc5472f9f0a5
description: 'Investigate adversary abuse of remote services (RDP, VNC, SSH, SMB, Telnet) to gain initial
  access to and move laterally within an ICS/OT environment. This playbook helps an analyst hunt for:
  anomalous remote-service connections to critical OT assets (HMIs, EWS, data historians, PLCs/RTUs) that
  violate the ICS DMZ/jump-host allow list or the OT communication matrix; brute-force and password-spraying
  patterns against externally-facing OT remote-access servers followed by a successful authentication;
  first-time internal source-destination-port-user connection tuples that indicate pivoting; and admin-share
  (C$, ADMIN$, IPC$) writes of executables, scripts, or ICS project files (.exe, .ps1, .L5K, .ACD) followed
  by remote execution. It combines deterministic allow-list/sequence rules, statistical baselining (fan-out,
  destination entropy, byte volume, failed-login rate, login hour-of-day), and unsupervised/sequence machine-learning
  models (Isolation Forest, autoencoders, graph link-prediction, HMM/LSTM) so analysts can detect both
  noisy and low-and-slow remote-access abuse against IT/OT conduits and internal OT segments.'
type: technique
related:
- tactic_id: TA0108
  tactic_name: Initial Access
- tactic_id: TA0109
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any successful remote-service connection (RDP/3389, SSH/22, VNC/5900) reach a critical
    OT asset from a (source IP, user, destination, port) tuple that is NOT on the authorized ICS DMZ/jump-host
    allow list, or that occurred outside the defined maintenance window?
  context: 'Initial access via remote services is a high-fidelity entry vector into ICS because legitimate
    operator and vendor access is tightly scoped. Per [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf),
    maintain an explicit allow list of authorized (Source IP, User, Destination Asset, Port) remote-access
    tuples derived from ICS DMZ/jump-host conduit ACLs. Ingest Zeek conn/ssh/rdp logs and Windows Event
    ID 4624/21, treating first-party logs as authoritative. A successful connection (conn_state=''SF'',
    ssh auth_success=T, 4624 Logon Type 10) on 22/3389/5900 to a critical asset whose tuple is absent
    from the allow list, or that falls outside the maintenance window, is a strong positive for Initial
    Access. In parallel, alert on the scan-then-login precursor ([Hopper](https://www.usenix.org/system/files/sec21-ho.pdf)):
    a source generating >10 blocked/failed attempts (conn_state S0/REJ, 4625) to OT remote-service ports
    within 5 minutes. A clean negative (all tuples allow-listed, within window) lowers but does not eliminate
    valid-account-abuse suspicion.'
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Microsoft-Windows-TerminalServices-LocalSessionManager/Operational Event ID 21
  - 'NAI: IT/OT Network Perimeter (ICS DMZ), Jump Servers, VPN Concentrators, Engineering Workstations
    (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control Networks (PCN).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "remote = events where (zeek.proto in [rdp,ssh] AND zeek.conn_state='SF')\n      OR (zeek.ssh.auth_success=true)\n\
      \      OR (win.EventID=4624 AND LogonType=10)\n      OR (win.EventID=21)\nremote = filter dest_port\
      \ in [22,3389,5900] AND dest_asset in CRITICAL_OT\nalert if tuple(src_ip,user,dest_asset,dest_port)\
      \ NOT in ALLOWLIST\n   OR event_time NOT within MAINTENANCE_WINDOW(dest_asset)"
  - technology: SIEM/Rule pseudocode
    query: 'fail = events where (zeek.conn_state in [S0,REJ]) OR (win.EventID=4625)

      fail = filter dest_port in [22,3389,5900] AND dest_asset in CRITICAL_OT

      alert if count(fail) by src_ip over 5m > 10   // scan-then-login precursor'
- question: For each critical OT asset, do any new remote-access sessions accumulate a risk score >=2
    across rare source ASN, off-hours login, abnormally long duration, high byte volume, or a preceding
    failed-auth burst from the same source?
  context: 'Deterministic allow-lists miss subtle abuse, so layer a statistical risk score per asset.
    Build a 60-day baseline of (a) known source ASNs/subnets, (b) login hour-of-day distribution, (c)
    session duration, and (d) bytes transferred (orig_bytes+resp_bytes) from Zeek conn.log, using robust
    percentiles / median-absolute-deviation ([Bohara et al. Unsupervised Multi-Detector](https://mnoureddine.com/files/17BOH01.pdf))
    and damped-window rate/volume features ([Kitsune](https://arxiv.org/abs/1802.09089)). Score each new
    session: +1 new/rare ASN, +1 login-hour >2 SD from mean, +1 duration >95th percentile, +1 byte volume
    >95th percentile (possible data-staging), +1 if the session followed failed auth from the same source.
    Alert at cumulative score >=2 and include the contributing terms in the alert text so the analyst
    knows which dimensions deviated. Derive thresholds per-asset from your own logs and validate against
    the [LANL Unified Host and Network](https://arxiv.org/abs/1708.07518) dataset. A high score with multiple
    contributing terms strongly suggests anomalous initial access; a score below threshold is consistent
    with routine operator activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Microsoft-Windows-TerminalServices-LocalSessionManager/Operational Event ID 21
  - 'NAI: IT/OT Network Perimeter (ICS DMZ), Jump Servers, VPN Concentrators, Engineering Workstations
    (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control Networks (PCN).'
  range: Last 90 days (60-day baseline + scoring window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per dest_asset over 60d: asn_set, hour_mean/sd, dur_p95, bytes_p95\nfor each new\
      \ session s to dest_asset:\n  score = 0\n  score += 1 if s.src_asn not in asn_set\n  score += 1\
      \ if abs(s.hour - hour_mean) > 2*hour_sd\n  score += 1 if s.duration > dur_p95\n  score += 1 if\
      \ (s.orig_bytes+s.resp_bytes) > bytes_p95\n  score += 1 if failed_auth(s.src_ip, dest_asset) within\
      \ prior 30m\n  alert if score >= 2 with contributing_terms"
- question: Does an unsupervised anomaly model (Extended Isolation Forest / autoencoder ensemble) flag
    any remote session to OT assets as high-anomaly, and what are the top-3 contributing features (e.g.,
    rare ASN, off-hours, high resp_bytes)?
  context: 'To catch abuse that no single rule or threshold captures, train an unsupervised [Extended
    Isolation Forest](https://arxiv.org/abs/1811.02141) (or [Kitsune](https://arxiv.org/abs/1802.09089)-style
    autoencoder ensemble) on historical remote sessions. Per-session features: source ASN/geo, allow-list
    boolean, destination criticality, hour, day-of-week, protocol, session duration, bytes in/out, and
    prior failed-auth count from the same source. Score new sessions in real time and alert on high anomaly
    scores. For explainability, surface the top-3 contributing features via per-feature attribution so
    the analyst can triage quickly. Critically, keep the deterministic allow-list rule running in parallel:
    ML augments the floor, it does not replace it. A high anomaly score with interpretable drivers (rare
    ASN + off-hours + large outbound transfer) warrants immediate investigation of possible adversary
    initial access; low scores indicate the session matches learned-normal behavior.'
  answer_sources:
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - Microsoft-Windows-TerminalServices-LocalSessionManager/Operational Event ID 21
  - 'NAI: IT/OT Network Perimeter (ICS DMZ), Jump Servers, VPN Concentrators, Engineering Workstations
    (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control Networks (PCN).'
  range: Last 90 days (longer history for training)
  queries:
  - technology: ML/pseudocode
    query: "X = sessions[asn,geo,allowlist_bool,dest_criticality,hour,dow,proto,duration,\n          \
      \   bytes_in,bytes_out,prior_failed_auth]\nmodel = ExtendedIsolationForest().fit(X_train_history)\n\
      for s in new_sessions:\n  a = model.anomaly_score(s)\n  if a > THRESH: alert(session=s, top3=feature_attribution(model,s,k=3))\n\
      // run deterministic allow-list rule in parallel"
- question: Did a single source IP generate >20 failed remote-service logins within 5 minutes (or >10
    distinct accounts in 30 minutes), and was that burst followed by a SUCCESSFUL login from the same
    source to a targeted OT asset within 15 minutes?
  context: 'Brute-force and password-spraying against externally-facing OT remote access is a classic
    initial-access precursor. Per [Splunk Threat Research: Detecting Password Spraying](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    and [JPCERT/CC Detecting Lateral Movement through Tracking Event Logs](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf),
    trigger when a single source IP generates >20 failed logins (Event ID 4625 or Zeek ssh.log auth_success=F)
    to one or more OT assets within 5 minutes, OR attempts >10 distinct accounts in 30 minutes (the spray
    pattern). Escalate to high severity if a successful login (4624 / ssh auth_success=T) from the same
    source to any targeted destination follows within 15 minutes, which indicates the attack likely succeeded.
    Report failed-vs-success counts and the specific account that succeeded in the alert so responders
    can immediately disable/rotate that credential. A fail-burst with no following success is still worth
    a medium alert (exposure/attempt); a fail-burst followed by success is a probable compromise.'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Externally-facing remote access servers, Jump Servers, ICS DMZ, Engineering Workstations (EWS),
    Human-Machine Interfaces (HMIs), Active Directory Domain Controllers within the OT environment.'
  range: Last 90 days (correlate fail-burst and success within 15m)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "fail = (win.EventID=4625) OR (zeek.ssh.auth_success=false)\nsucc = (win.EventID=4624) OR (zeek.ssh.auth_success=true)\n\
      spray = (count(fail) by src_ip over 5m > 20)\n     OR (distinct(account) of fail by src_ip over\
      \ 30m > 10)\nalert HIGH if spray AND exists succ where succ.src_ip=fail.src_ip\n  AND succ.dest\
      \ in fail.dest_set AND succ.time within 15m after burst\nreport fail_count, succ_count, succeeded_account"
- question: Does any source IP exceed its per-asset 99th-percentile failed-login rate (or trigger an account-lockout
    4740 spike), and was a successful login from that anomalous source observed within 30 minutes?
  context: 'Fixed thresholds miss attackers who tune their rate below them, so treat failure rate as a
    first-class statistical signal ([Splunk Threat Research: Detecting Password Spraying](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)).
    For each OT asset, baseline the failed-login rate (count/min) per source IP over 30 days and compute
    the 99th percentile. Alert when a source exceeds its 99th-percentile failed-login rate, or when account-lockout
    (Event ID 4740) frequency spikes. Score residual low-and-slow attempts with an [Extended Isolation
    Forest](https://arxiv.org/abs/1811.02141) over (failed_count, distinct_accounts, inter-attempt jitter)
    to catch deliberately paced spraying. Escalate if a successful login from the anomalous source occurs
    within 30 minutes. A statistically anomalous failure rate followed by success is a strong indicator
    of credential-guessing initial access; a rate within baseline reflects normal mistyped-password noise.'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Externally-facing remote access servers, Jump Servers, ICS DMZ, Engineering Workstations (EWS),
    Human-Machine Interfaces (HMIs), Active Directory Domain Controllers within the OT environment.'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per dest_asset over 30d: fail_rate_p99[src_ip]\nalert if fail_rate(src_ip,dest_asset,\
      \ 1m) > fail_rate_p99\n   OR spike(count(win.EventID=4740)) vs baseline\nlow_slow = EIF.score([failed_count,distinct_accounts,interattempt_jitter])\n\
      escalate if successful_login(src_ip) within 30m of anomaly"
- question: Modeling each source-destination login stream as an event sequence, does a sequence model
    (HMM / DeepLog LSTM) detect a transition into a 'Successful Compromise' state where a success follows
    a high-failure brute-force state?
  context: Sequence models capture the temporal shape of an attack that point rules miss. Model each source-destination
    login stream as an event sequence and learn normal patterns with a Hidden Markov Model, the [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)
    LSTM log-sequence approach, or the authentication-log sequence classifier of [Bian et al. Uncovering
    Lateral Movement Using Authentication Logs](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).
    Define states 'Normal' (low fail/success), 'Brute-Force' (high fail rate), and 'Successful Compromise'
    (success following the brute-force state). Alert when the most-probable state path transitions into
    'Successful Compromise', and surface the triggering fail-burst count and succeeding account in the
    alert text. This detects credential attacks whose individual events stay under static thresholds but
    whose overall sequence reveals guessing-then-success. A state-path entering 'Successful Compromise'
    is a high-confidence initial-access indicator; staying in 'Normal' indicates benign login patterns.
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Externally-facing remote access servers, Jump Servers, ICS DMZ, Engineering Workstations (EWS),
    Human-Machine Interfaces (HMIs), Active Directory Domain Controllers within the OT environment.'
  range: Last 90 days (longer history for training)
  queries:
  - technology: ML/pseudocode
    query: "seq = order login events per (src_ip,dest) by time -> [fail/success tokens]\nmodel = HMM(states=[Normal,BruteForce,SuccessfulCompromise]).fit(history)\n\
      \  # or DeepLog LSTM / Bian et al. auth-sequence classifier\npath = model.viterbi(seq)\nif transition(path)\
      \ -> SuccessfulCompromise:\n  alert(fail_burst_count, succeeding_account, src_ip, dest)"
- question: Was there a successful internal remote connection (RDP/SSH/SMB) between two OT assets whose
    (source_host, destination_host, destination_port, user_account) tuple is new versus a 90-day baseline
    or that violates the OT communication matrix (e.g., a Data Historian initiating RDP to an HMI)?
  context: Once inside, adversaries pivot using legitimate remote services, so first-time internal connection
    tuples are a key lateral-movement signal. Baseline all observed (source_host, destination_host, destination_port,
    user_account) tuples for internal RDP/SSH/SMB from 90 days of Zeek conn.log and Windows Event ID 4624;
    this encodes the OT communication matrix recommended by [NIST SP 800-82r3](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf).
    Alert on any successful internal remote connection whose tuple is new (the first-time-access + credential-switch
    heuristic formalized in [Hopper](https://www.usenix.org/system/files/sec21-ho.pdf)), e.g., a Data
    Historian initiating RDP to an HMI, which would never occur in normal operations. As a failure-mode
    signal, also alert on bursts of rejected internal connections (conn_state S0/REJ, 4625) indicating
    intra-segment scanning before a successful pivot. A brand-new internal tuple, especially one inverting
    the expected client/server role, is a high-fidelity pivot indicator; an all-known-tuple result indicates
    routine operations.
  answer_sources:
  - Zeek rdp.log
  - Zeek conn.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers, Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), Internal OT network
    segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "baseline TUPLES = {(src_host,dst_host,dst_port,user)} from 90d\n  of zeek.conn(rdp/ssh/smb)\
      \ + win.EventID=4624 (internal only)\nfor each successful internal remote conn c:\n  if (c.src,c.dst,c.dport,c.user)\
      \ NOT in TUPLES: alert NEW_TUPLE\n  if violates OT_COMM_MATRIX(c): alert MATRIX_VIOLATION\nscan\
      \ = count(conn_state in [S0,REJ] OR 4625) by src over 5m\nalert if scan > THRESH  // intra-segment\
      \ scanning"
- question: For each internal OT host, does daily fan-out (unique RDP/SSH/SMB destinations), destination
    Shannon entropy, or outbound byte volume exceed its per-host 95th percentile, indicating scanning
    or anomalous pivoting?
  context: Lateral movement often manifests as a host suddenly talking to many more peers than usual.
    For each internal host, use a 30-day rolling window to baseline fan-out (unique RDP/SSH/SMB destinations),
    destination Shannon entropy, and outbound byte volume, scoring deviations with robust percentiles
    / median-absolute-deviation ([Bohara et al. Unsupervised Multi-Detector](https://mnoureddine.com/files/17BOH01.pdf)).
    Alert when daily fan-out, destination entropy, or byte volume exceeds the per-host 95th percentile.
    Include the offending destination count and top new destinations in the alert so the analyst can see
    the spread. Derive thresholds from internal data and validate against the [LANL Unified Host and Network](https://arxiv.org/abs/1708.07518)
    dataset. A spike in fan-out/entropy from a host that normally talks to a handful of peers is a classic
    pivot/scan signature; values within baseline reflect normal, stable OT communication patterns.
  answer_sources:
  - Zeek rdp.log
  - Zeek conn.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers, Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), Internal OT network
    segments.'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per src_host over 30d: fanout_p95, dstentropy_p95, outbytes_p95\ndaily per src_host:\n  fanout\
      \ = distinct(dst_host) over rdp/ssh/smb\n  H = shannon_entropy(dst_host distribution)\n  vol = sum(orig_bytes)\n\
      \  alert if fanout>fanout_p95 OR H>dstentropy_p95 OR vol>outbytes_p95\n  include dst_count, top_new_destinations"
- question: Modeling the OT network as a directed connection graph, does a graph-embedding / link-prediction
    model flag any new low-probability remote-access edge (e.g., HMI->HMI RDP), and what are the top-3
    contributing factors?
  context: Pivoting creates connection edges that are structurally improbable for the OT topology. Model
    the OT network as a directed authentication/connection graph (nodes=hosts, edges=successful remote
    connections) enriched with asset type/criticality, protocol, and user. Learn normal structure with
    unsupervised graph embeddings + link prediction ([CyberGraph](https://www.usenix.org/system/files/raid20-bowman.pdf)),
    and add temporal link prediction ([EULER](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf))
    so newly appearing hosts/edges are handled gracefully. Alert on low-probability new edges (e.g., HMI->HMI
    RDP) and surface the top-3 factors (edge probability, source/destination type, user rarity) in the
    alert. Run this alongside the deterministic new-tuple rule, not instead of it. A low-probability edge
    between asset types that should never directly communicate is a strong lateral-movement indicator;
    high-probability edges match the learned OT communication structure.
  answer_sources:
  - Zeek rdp.log
  - Zeek conn.log
  - Zeek ssh.log
  - Windows Event ID 4624
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers, Programmable Logic Controllers (PLCs), Remote Terminal Units (RTUs), Internal OT network
    segments.'
  range: Last 90 days (longer history for graph training)
  queries:
  - technology: ML/pseudocode
    query: "G = directed graph(nodes=hosts{type,criticality}, edges=success_conn{proto,user})\nemb = graph_embeddings(G_history)\
      \  // CyberGraph + EULER temporal\nfor new_edge e in G_now:\n  p = link_prediction(emb, e)\n  if\
      \ p < THRESH: alert(edge=e, top3=[edge_prob,src_dst_type,user_rarity])\n// run deterministic new-tuple\
      \ rule in parallel"
- question: Did the sequence occur where a source accessed an administrative share (C$, ADMIN$, IPC$)
    on a critical OT asset, then wrote a suspicious file type (.exe, .dll, .ps1, .bat, .L5K, .ACD), and
    then that file was executed on the destination within 10 minutes?
  context: 'Remote file copy to an admin share followed by execution is a hallmark SMB lateral-movement
    pattern, and in ICS it can deliver ICS project files (.L5K, .ACD) for Program Download. Per [JPCERT/CC
    Detecting Lateral Movement through Tracking Event Logs](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf)
    and the [BZAR](https://github.com/mitre-attack/bzar) SMB/DCE-RPC analytics, detect the chain: 1) access
    to an administrative share (C$, ADMIN$, IPC$) on a critical OT asset (Event ID 5145 or Zeek smb_mapping.log),
    then 2) a write of a suspicious file type (.exe,.dll,.ps1,.bat,.L5K,.ACD) from the same source (Zeek
    smb_files.log), then 3) process creation for that filename on the destination (Event ID 4688) within
    10 minutes. Alert on completion of the three-step chain. Also flag remote service creation (Event
    ID 7045) or scheduled task (Event ID 4698) from the same source as alternate execution stages. Completion
    of the full write-then-execute chain to a critical OT asset is a high-confidence lateral-movement/staging
    indicator; isolated admin-share access alone may be benign administration.'
  answer_sources:
  - Zeek smb_mapping.log
  - Zeek smb_files.log
  - Windows Event ID 5145
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers, Domain Controllers within the OT network, File Servers, Internal OT network segments.'
  range: Last 90 days (correlate chain within 10m)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "step1 = (win.EventID=5145 share in [C$,ADMIN$,IPC$]) OR zeek.smb_mapping(admin share)\n  \
      \      on dest in CRITICAL_OT\nstep2 = zeek.smb_files write where ext in [exe,dll,ps1,bat,L5K,ACD]\n\
      \        same src->dest as step1\nstep3 = win.EventID=4688 NewProcessName matches step2.filename\
      \ on dest\nalert if step1 -> step2 -> step3 within 10m (same src,dest)\nalso flag win.EventID=7045\
      \ (service) OR 4698 (sched task) from same src"
- question: Did any user access an administrative share for the first time in 30 days, or did an SMB transfer
    between a source-destination pair exceed 3 standard deviations in byte volume (bulk staging) or collapse
    in file-extension entropy toward a single non-standard type (targeted tool drop)?
  context: Statistical baselining of SMB behavior catches staging that does not match a known execution
    chain. Per user, baseline the set of administrative shares normally accessed over 30 days and alert
    on first-time access to a new admin share. Per source-destination pair, baseline SMB transfer byte
    volume and the Shannon entropy of file extensions in Zeek smb_files.log, scoring with the volume/rate
    features of [Kitsune](https://arxiv.org/abs/1802.09089) and robust deviation per [Bohara et al. Unsupervised
    Multi-Detector](https://mnoureddine.com/files/17BOH01.pdf). Alert when transfer volume exceeds 3 standard
    deviations from the mean (bulk staging) or when extension entropy collapses toward a single non-standard
    file type (targeted tool drop). First-time admin-share access by a user who never administers that
    asset, an abnormal bulk transfer, or a sudden single-extension write pattern all indicate possible
    lateral-movement staging; behavior within baseline reflects routine file sharing.
  answer_sources:
  - Zeek smb_mapping.log
  - Zeek smb_files.log
  - Windows Event ID 5145
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Data Historians, Process Control
    Servers, Domain Controllers within the OT network, File Servers, Internal OT network segments.'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per user over 30d: ADMIN_SHARES_SEEN

      alert if user accesses admin_share NOT in ADMIN_SHARES_SEEN  // first-time

      per (src,dst) over 30d: bytes_mean/sd, extension_entropy baseline

      alert if smb_transfer_bytes > mean + 3*sd        // bulk staging

      alert if extension_entropy collapses to single non-standard ext  // tool drop'
- question: Treating per-SMB-session feature vectors with DBSCAN clustering (or a sequence model over
    authentication logs), are there noise-point/anomalous sessions, and what are the top-3 deviating features
    (e.g., new share, .ps1 write, off-hours)?
  context: Unsupervised clustering surfaces SMB sessions that do not fit any learned normal group. Build
    per-SMB-session feature vectors (user, source host, destination type, share name, file-extension category,
    file size, hour) and cluster normal behavior with DBSCAN, or model the authentication-log sequence
    with the approach of [Bian et al. Uncovering Lateral Movement Using Authentication Logs](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf);
    the multi-detector ensemble of [Bohara et al. Unsupervised Multi-Detector](https://mnoureddine.com/files/17BOH01.pdf)
    reduces false positives. Treat DBSCAN noise points as anomalies and surface the top-3 deviating features
    (e.g., 'new share, .ps1 write, off-hours') in the alert. Keep the deterministic admin-share-write-then-execute
    correlation running in parallel as the detection floor. A session falling into DBSCAN noise with interpretable
    deviating features warrants triage for lateral movement; sessions assigned to dense normal clusters
    reflect established administrative workflows.
  answer_sources:
  - Zeek smb_mapping.log
  - Zeek smb_files.log
