name: 'T0807: Command-Line Interface'
id: 7d5bcd8c-4c05-445a-bb65-43f5e73d2958
description: Investigate adversary use of command-line interfaces (CLIs) to interact with and execute
  commands on critical ICS assets such as Engineering Workstations (EWS), HMIs, Historian Servers, Process
  Control Servers (PCS), Data Gateways, jump/terminal servers, and exposed network/embedded device CLIs.
  This playbook helps an analyst spot suspicious shell parent-child process relationships, LOLBin and
  recon command usage, obfuscated or high-entropy command lines, remote interactive logons (RDP/SSH) that
  are immediately followed by command execution, and CLI-driven enumeration, copy, and archiving of sensitive
  ICS project files and configuration data (e.g., .ACD, .L5K, .SCX, .HMI, .cfg, .bak, .sql). It pairs
  deterministic allowlist/Sigma-style detections with statistical baselining and machine-learning anomaly
  detection across endpoint (Windows Event ID 4688/4624, Sysmon), network (Zeek conn/rdp/ssh/smb_files),
  and application/historian logs to surface both Execution (TA0104) and Collection (TA0100) behavior on
  the OT network.
type: technique
related:
- tactic_id: TA0104
  tactic_name: Execution
- tactic_id: TA0100
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: On critical ICS assets, is a command shell (cmd.exe, powershell.exe, or a vendor CLI such
    as Rockwell RSHelper.exe or Siemens WinCCExplorer.exe) spawning child processes that are not on the
    approved per-host parent-child allowlist?
  context: 'Supports the Execution tactic. Adversaries frequently abuse native shells to run reconnaissance
    binaries (net.exe, whoami.exe, ipconfig.exe, nmap.exe) and LOLBins (certutil, bitsadmin, mshta) once
    they reach an EWS, HMI, or historian. Maintain strict per-host parent-child allowlists over Windows
    Event ID 4688 / Sysmon EID 1 and alert on shell-spawned children that are not explicitly approved.
    Pay special attention to cmd.exe/powershell.exe spawned by atypical parents such as services.exe,
    wmiprvse.exe, or historian/web/Office processes, and apply content signatures for the LOLBins and
    recon binaries above. A positive result on an OT host where these tools are never run interactively
    is high-fidelity. Also count access-denied / blocked execution attempts so a burst of failed launches
    becomes an alertable precursor in its own right. References: [Sigma](https://github.com/SigmaHQ/sigma)
    [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Process
    Control Servers (PCS), Data Gateways, Application Servers within the Process Control Network (PCN)
    and Manufacturing Zone (MZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=edr (EventCode=4688 OR sysmon_event=1)\n| where parent_image IN (\"cmd.exe\",\"powershell.exe\"\
      ,\"RSHelper.exe\",\"WinCCExplorer.exe\")\n| lookup parent_child_allowlist host parent_image child_image\
      \ OUTPUT approved\n| where isnull(approved) OR approved!=\"yes\"\n   OR child_image IN (\"net.exe\"\
      ,\"whoami.exe\",\"ipconfig.exe\",\"nmap.exe\",\"certutil.exe\",\"bitsadmin.exe\",\"mshta.exe\")\n\
      \   OR parent_image IN (\"services.exe\",\"wmiprvse.exe\",\"w3wp.exe\",\"winword.exe\",\"excel.exe\"\
      )\n| stats count by host, user, parent_image, child_image, status\n| alert"
  - technology: Sigma/pseudocode
    query: "detection:\n  selection:\n    ParentImage|endswith: ['\\\\cmd.exe','\\\\powershell.exe']\n\
      \    Image|endswith: ['\\\\net.exe','\\\\whoami.exe','\\\\certutil.exe','\\\\nmap.exe']\n  condition:\
      \ selection and not host_allowlist"
- question: Which child processes are statistically rare for a given parent shell on a given ICS host
    — previously unseen or below the 0.01st percentile of that parent's children over the prior 30 days?
  context: 'Supports the Execution tactic. Allowlists miss novel-but-unflagged tools, so build 90-day
    baselines of child-process frequency per parent per host and alert when a child is previously unseen
    or falls below the 0.01st percentile of that parent''s children over the prior 30 days. Escalate when
    the rare child is a LOLBin or carries recon parameters. Derive percentile thresholds per host and
    per role because EWS, HMI, and historian baselines differ substantially — a tool that is routine on
    one role may be a clear outlier on another. A positive result indicates execution behavior that departs
    from the host''s learned norm and warrants triage of the full process tree and the responsible logon
    session. References: [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Process
    Control Servers (PCS), Data Gateways, Application Servers within the Process Control Network (PCN)
    and Manufacturing Zone (MZ).'
  range: Last 90 days (baseline 90 days; rarity window prior 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr EventCode=4688 earliest=-30d

      | stats count as child_count by host, parent_image, child_image

      | eventstats sum(child_count) as parent_total, p0_01(child_count) as p_thresh by host, parent_image

      | eval freq = child_count/parent_total

      | where child_count <= p_thresh OR NOT [ search seen_last_90d | fields host parent_image child_image
      ]

      | eval escalate = if(match(child_image,"(?i)certutil|bitsadmin|net|whoami|nmap|mshta"),1,0)

      | alert'
- question: Do per-host command/process-event sequences contain a shell-spawned child that deviates from
    the next-event predicted by a learned sequence model, corroborated by provenance node-anomaly scoring?
  context: 'Supports the Execution tactic. Model per-host command/process-event sequences with an LSTM-style
    log model (e.g., DeepLog) and alert when an observed child process deviates from the predicted next-events,
    then corroborate with provenance node-anomaly scoring (e.g., threaTrace) to reduce false positives.
    Surface the top-3 contributing features (parent image, child image, sequence-rarity) directly in the
    alert text so analysts can triage quickly. Keep this model in parallel with the deterministic allowlist
    rather than replacing it, because model-free / adversarial concealment against learned detectors is
    feasible. A positive result flags an execution pattern that is contextually unexpected even if each
    individual process looks benign. References: [DeepLog](https://doi.org/10.1145/3133956.3134015) [Deep
    Learning-based Log Analysis benchmark](https://arxiv.org/abs/2107.05908) [threaTrace](https://arxiv.org/pdf/2111.04333)
    [Erba & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Process
    Control Servers (PCS), Data Gateways, Application Servers within the Process Control Network (PCN)
    and Manufacturing Zone (MZ).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = DeepLog(sequence='process_events', key_by='host')\nstream = read(index='edr', EventCode=4688)\n\
      for ev in stream:\n    pred = model.predict_next(ev.host, ev.context_window)\n    if ev.child_image\
      \ not in pred.topk(k=9):\n        prov = threaTrace.node_anomaly(ev)\n        if prov.score > 0.8:\n\
      \            alert(host=ev.host, top3=[ev.parent_image, ev.child_image, ev.seq_rarity])"
- question: Is a remote interactive logon (RDP/SSH) to a critical ICS asset followed within ~90 seconds
    by command-line process creation under the same logon session, from a source outside approved OT remote-access
    ranges or with recon/LOLBin command patterns?
  context: 'Supports the Execution tactic. Adversaries who pivot into the OT network via remote access
    typically begin issuing commands almost immediately. Link a remote interactive logon (Windows Event
    ID 4624 logon type 10, corroborated by Zeek rdp.log/ssh.log) to Event ID 4688 process creation within
    90 seconds under the same logon session, and alert when the source IP is outside approved OT remote-access
    ranges or the command line contains recon/LOLBin patterns. A positive result on a jump server, terminal
    server, or EWS — especially from an unexpected subnet or outside maintenance windows — is a strong
    intrusion signal. As a failure mode, also profile failed logons (Event ID 4625) and blocked remote-access-gateway
    connections from the same source as a distinct precursor indicating credential brute-force or spray
    preceding the session. References: [Sigma](https://github.com/SigmaHQ/sigma) [BZAR](https://github.com/mitre-attack/bzar).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - 'NAI: ICS DMZ/Perimeter, Remote Access Gateways, Engineering Workstations (EWS), Human-Machine Interfaces
    (HMIs), Jump Servers, and Terminal Servers within the ICS network.'
  range: 'Last 90 days (event-centered: correlate logon and process events within a 90-second window)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=win (EventCode=4624 Logon_Type=10)

      | join logon_id [ search index=win EventCode=4688 ]

      | where (proc_time - logon_time) <= 90

      | lookup ot_remote_access_ranges src_ip OUTPUT approved

      | where approved!="yes" OR match(command_line,"(?i)net |whoami|ipconfig|nmap|certutil|bitsadmin|powershell
      -enc")

      | join host [ search index=zeek (source="rdp.log" OR source="ssh.log") ]

      | alert'
  - technology: Zeek/pseudocode
    query: '# correlate session establishment then watch for failed attempts from same src

      rdp.log/ssh.log: select id.orig_h, id.resp_h, ts where auth_success==T

      join win 4625 by src_ip -> flag brute-force precursor spikes per src_ip'
- question: Does a remote session deviate from a user's 90-day remote-access baseline — new user-to-host-to-source
    edge, off-hours, low command similarity — enough to exceed a composite risk threshold?
  context: 'Supports the Execution tactic. Build 90-day per-user baselines covering source subnet/ASN,
    operational hours, and command Jaccard similarity, plus a first-time user-to-host-to-source edge model.
    Compute a composite risk score and alert when it exceeds threshold, weighting a new edge plus off-hours
    activity plus low command similarity most heavily. This catches credential misuse and lateral movement
    that individually look plausible but jointly are anomalous. Track failed-logon rate spikes per source
    as a separate score so that brute-force or password-spray activity is detected before the successful
    interactive session. A positive composite score on an OT jump server or EWS should drive review of
    the session''s commands and downstream process tree. References: [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/)
    [Deep Learning-based Log Analysis benchmark](https://arxiv.org/abs/2107.05908).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - 'NAI: ICS DMZ/Perimeter, Remote Access Gateways, Engineering Workstations (EWS), Human-Machine Interfaces
    (HMIs), Jump Servers, and Terminal Servers within the ICS network.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=win EventCode=4624 Logon_Type=10 earliest=-90d

      | eval new_edge = if([user,host,src_subnet] not in baseline_edges,1,0)

      | eval off_hours = if(NOT match(hour,"08-17") OR is_weekend,1,0)

      | eval cmd_sim = jaccard(session_cmds, baseline_cmds[user])

      | eval risk = 3*new_edge + 2*off_hours + 2*(1-cmd_sim)

      | where risk >= 5

      | append [ search EventCode=4625 | stats count by src_ip | where count > spray_threshold ]

      | alert'
- question: Are there outlier remote sessions when an unsupervised model is trained on remote-session
    feature vectors and whole-system provenance edges?
  context: 'Supports the Execution tactic. Train an unsupervised model on remote-session feature vectors
    (timing, source, command profile, byte counts) and whole-system provenance edges (e.g., KAIROS/threaTrace)
    and alert on outlier sessions. For each alert, reconstruct the explainable attack subgraph and list
    the top-3 anomalous features for triage. Run this in parallel with the deterministic correlation rules
    because model-free detectors can be concealed against by a careful adversary. A positive result identifies
    a remote session whose overall behavior — not just one attribute — is inconsistent with the learned
    norm, which is valuable for catching novel intrusion tradecraft on ICS access infrastructure. References:
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) [threaTrace](https://arxiv.org/pdf/2111.04333)
    [Erba & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek rdp.log
  - Zeek ssh.log
  - 'NAI: ICS DMZ/Perimeter, Remote Access Gateways, Engineering Workstations (EWS), Human-Machine Interfaces
    (HMIs), Jump Servers, and Terminal Servers within the ICS network.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "feats = build_session_vectors(win_4624, win_4688, zeek_rdp, zeek_ssh, zeek_conn)\ngraph =\
      \ provenance_graph(feats)\nmodel = KAIROS.fit(graph)   # unsupervised, whole-system edges\nfor session\
      \ in feats:\n    if model.anomaly(session) > threshold:\n        subgraph = model.explain(session)\n\
      \        alert(session=session.id, top3=model.top_features(session,3), subgraph=subgraph)"
- question: Do command lines on ICS assets match known malicious patterns — PowerShell encoding flags,
    download cradles, file-transfer LOLBins with URLs, or cmd.exe obfuscation?
  context: 'Supports the Execution tactic. Apply regex/Sigma rules over Event ID 4688 command lines for
    encoding flags (powershell -enc/-e, FromBase64String), download cradles (IEX, DownloadString, Invoke-WebRequest),
    file-transfer LOLBins with URLs (certutil -urlcache, bitsadmin /transfer), and cmd.exe obfuscation
    such as caret insertion or environment-variable substring substitution. In OT specifically, extend
    coverage to engineering-software CLIs used to push logic/config to controllers, as abused in TRISIS-style
    attacks against safety systems. A positive match is high-fidelity, especially on hosts where scripting
    and downloads are not part of normal operation; treat any controller-logic push from an unexpected
    user or host as critical. References: [Sigma](https://github.com/SigmaHQ/sigma) [DOSfuscation](https://cloud.google.com/blog/topics/threat-intelligence/dosfuscation-exploring-obfuscation-and-detection-techniques/)
    [TRISIS](https://www.dragos.com/blog/industry-news/trisis-malware-analysis-of-safety-system-targeted-malware/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows-based ICS assets, including HMIs, EWS, Historian Servers, Process Control Servers
    (PCS), and Data Gateways within the Process Control Network (PCN) and higher zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=edr EventCode=4688\n| where match(command_line,\"(?i)(-enc |-e |frombase64string|iex|downloadstring|invoke-webrequest|\"\
      \n   . \"certutil.*-urlcache|bitsadmin.*/transfer|\\\\^|%[a-z]+:~)\")\n   OR match(command_line,\"\
      (?i)(rslogix|studio5000|step7|tia ?portal|triconex).*(download|push|write)\")\n| stats count by\
      \ host, user, parent_image, command_line\n| alert"
  - technology: Sigma/pseudocode
    query: "detection:\n  enc: CommandLine|contains: [' -enc ',' -e ','FromBase64String']\n  cradle: CommandLine|contains:\
      \ ['IEX','DownloadString','Invoke-WebRequest']\n  lolbin: CommandLine|contains: ['certutil -urlcache','bitsadmin\
      \ /transfer']\n  condition: enc or cradle or lolbin"
- question: Which command lines exhibit high Shannon entropy (e.g., > 4.5) or anomalous non-alphanumeric
    / token-length ratios indicative of encoding or obfuscation?
  context: 'Supports the Execution tactic. Compute Shannon entropy and non-alphanumeric / token-length
    ratios per command line and alert above a fixed floor (entropy > 4.5 on cmd args) or per-executable
    baseline-derived limits, tuning per host. Encoded or obfuscated arguments (Base64 blobs, character-substitution
    tricks) characteristically raise entropy and special-character ratios well above benign administrative
    commands. A positive result identifies likely encoded payloads or evasion attempts even when no specific
    signature exists; pair it with the signature rules to catch both known and novel obfuscation. On OT
    hosts where command lines are normally short and predictable, a high-entropy argument is especially
    suspicious. References: [Obfuscated Command Line Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/)
    [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)
    [DOSfuscation](https://cloud.google.com/blog/topics/threat-intelligence/dosfuscation-exploring-obfuscation-and-detection-techniques/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows-based ICS assets, including HMIs, EWS, Historian Servers, Process Control Servers
    (PCS), and Data Gateways within the Process Control Network (PCN) and higher zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=edr EventCode=4688

      | eval ent = shannon_entropy(command_line)

      | eval nonalnum_ratio = nonalnum_count(command_line)/len(command_line)

      | eval maxtok = max_token_length(command_line)

      | eventstats avg(ent) as mu, stdev(ent) as sd by image

      | where ent > 4.5 OR nonalnum_ratio > 0.30 OR ent > (mu + 4*sd)

      | stats count by host, user, image, command_line, ent, nonalnum_ratio

      | alert'
- question: Does a gradient-boosted classifier score a command line as malicious above 0.9 confidence
    based on character, token, and entropy features?
  context: 'Supports the Execution tactic. Score command lines with a gradient-boosted classifier built
    on character/token/entropy features and alert above 0.9 confidence, surfacing the top-3 features (entropy,
    special-character ratio, suspicious token) that drove the score so analysts understand the rationale.
    This learned approach generalizes beyond fixed regex and entropy floors, catching obfuscation variants
    designed to slip past static thresholds. A high-confidence positive on an ICS host warrants immediate
    review of the full process context, parentage, and the responsible session. Keep the classifier alongside
    the signature and entropy detections for layered coverage. References: [Obfuscated Command Line Detection
    Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/)
    [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows-based ICS assets, including HMIs, EWS, Historian Servers, Process Control Servers
    (PCS), and Data Gateways within the Process Control Network (PCN) and higher zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "clf = GradientBoostedClassifier(features=['char_ngrams','token_stats','entropy','special_ratio'])\n\
      for ev in read(index='edr', EventCode=4688):\n    p = clf.predict_proba(ev.command_line)\n    if\
      \ p.malicious > 0.9:\n        alert(host=ev.host, user=ev.user, score=p.malicious,\n           \
      \   top3=clf.explain(ev.command_line, k=3))"
- question: Is a command-line interpreter enumerating or copying sensitive ICS files (.ACD/.L5K/.SCX/.HMI/.cfg/.bak/.sql),
    then accessing sensitive shares (Event ID 5145) and invoking an archiving utility — with a parent
    process not on the allowlist?
  context: 'Supports the Collection tactic. Adversaries stage ICS project files and configuration data
    for exfiltration using built-in tools. Alert when Event ID 4688 command lines show sensitive file
    access by enumeration/copy utilities (dir, findstr, copy, xcopy, robocopy, certutil, bitsadmin) followed
    within 60 seconds by Event ID 5145 access to sensitive shares and invocation of an archiving utility
    (tar/zip/7z), especially when the parent process is not on the allowlist (e.g., the command originates
    from a web server or Office process instead of explorer.exe). This sequence — enumerate, read sensitive
    shares, compress — is the classic collection-to-staging chain. As a failure mode, also profile access-denied
    5145 events as a distinct enumeration/spraying signal indicating reconnaissance of shares the actor
    cannot yet read. References: [Sigma](https://github.com/SigmaHQ/sigma) [BZAR](https://github.com/mitre-attack/bzar).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5145
  - Zeek conn.log
  - Zeek smb_files.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Data Historians,
    Asset Management Servers, Process Control Servers, File Shares hosting ICS project files (e.g., .ACD,
    .L5K, .SCX, .HMI), and Jump Servers providing access to the OT network.'
  range: 'Last 90 days (event-centered: 60-second correlation window)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=edr EventCode=4688\n| where match(command_line,\"(?i)(dir|findstr|copy|xcopy|robocopy|certutil|bitsadmin).*\\\
      \\.(acd|l5k|scx|hmi|cfg|bak|sql)\")\n| transaction host maxspan=60s\n   [ search index=win EventCode=5145\
      \ Relative_Target_Name IN sensitive_shares ]\n   [ search index=edr EventCode=4688 (Image=*tar*\
      \ OR Image=*zip* OR Image=*7z*) ]\n| lookup parent_allowlist host parent_image OUTPUT approved\n\
      | where approved!=\"yes\"\n| alert"
  - technology: Zeek/pseudocode
    query: 'smb_files.log: select id.orig_h, name, action where name matches ''\\.(acd|l5k|scx|hmi|cfg|bak|sql)$''

      flag access-denied results separately as enumeration/spraying signal'
- question: Does the volume of unique sensitive files accessed or bytes read by a user/process exceed
    their 30-day baseline (composite z-score > ~4, or 5-minute unique-file count above the 99th percentile)?
  context: 'Supports the Collection tactic. Build 30-day baselines of unique sensitive files accessed
    and bytes read per user/process, and alert when composite z-scores exceed roughly 4 or the 5-minute
    unique-file count exceeds the 99th percentile of the user''s baseline. This catches bulk collection
    that signature rules miss — for example, a slow, broad sweep across many project files. Derive percentile
    and z-score thresholds per share and per host so high-traffic historians do not drown out subtle EWS
    anomalies. A positive result indicates an abnormal burst of sensitive-data access consistent with
    staging for exfiltration and should be correlated with subsequent archiving or outbound transfer.
    References: [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/) [Deep Learning-based
    Log Analysis benchmark](https://arxiv.org/abs/2107.05908).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5145
  - Zeek conn.log
  - Zeek smb_files.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Data Historians,
    Asset Management Servers, Process Control Servers, File Shares hosting ICS project files (e.g., .ACD,
    .L5K, .SCX, .HMI), and Jump Servers providing access to the OT network.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=win EventCode=5145 sensitive=true

      | bin _time span=5m

      | stats dc(file) as uniq_files, sum(bytes) as bytes by _time, user, share, host

      | eventstats avg(uniq_files) as mu_f, stdev(uniq_files) as sd_f, p99(uniq_files) as p99_f by user,
      share

      | eval z = (uniq_files-mu_f)/sd_f

      | where z > 4 OR uniq_files > p99_f

      | alert'
- question: Do unsupervised models over hourly file-access frequency, data-volume, and command-line features
    flag bursty CLI-driven collection on ICS assets?
  context: 'Supports the Collection tactic. Apply unsupervised anomaly detection over hourly file-access
    frequency and data-volume features (autoencoder / Isolation-Forest-style) plus DBSCAN over command-line
    features to flag bursty collection. Surface the top-3 contributing features (data volume, unique-file
    count, parent image) and an explainable subgraph for triage. Keep ML parallel to the deterministic
    correlation rules, since model-free detectors are evadable. This catches collection campaigns whose
    tempo or shape is anomalous even when individual file reads are authorized. A positive cluster/outlier
    identifies a host-user pair whose collection behavior departs from learned norms and should be reviewed
    for staging and exfiltration. References: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) [Explainable
    Anomaly Detection for ICS](https://arxiv.org/abs/2205.01930) [Erba & Tippenhauer](https://arxiv.org/abs/2012.03586).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5145
  - Zeek conn.log
  - Zeek smb_files.log
  - 'NAI: Engineering Workstations (EWS), Human-Machine Interfaces (HMIs), Historian Servers, Data Historians,
    Asset Management Servers, Process Control Servers, File Shares hosting ICS project files (e.g., .ACD,
    .L5K, .SCX, .HMI), and Jump Servers providing access to the OT network.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "X = hourly_features(win_5145, win_4688, zeek_smb_files,\n      cols=['file_access_freq','data_volume','uniq_files','parent_image_enc'])\n\
      iso = IsolationForest().fit(X)\nclusters = DBSCAN(eps, min_samples).fit(commandline_features)\n\
      for row in X:\n    if iso.anomaly(row) or clusters.is_noise(row):\n        alert(host=row.host,\
      \ user=row.user,\n              top3=explain(row,['data_volume','uniq_files','parent_image']),\n\
      \              subgraph=provenance(row))"
