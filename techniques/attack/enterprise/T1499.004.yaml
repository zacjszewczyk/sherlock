name: 'T1499.004: Application or System Exploitation'
id: 22cd98eb-f340-4017-89eb-c288b315fd31
description: Investigate adversary attempts to deny availability by exploiting software vulnerabilities
  (known CVEs or zero-days) that crash or repeatedly restart applications and systems, producing a denial-of-service
  (DoS) condition. This playbook helps an analyst correlate exploit-bearing network traffic (DoS signatures,
  malformed/oversized payloads, zip/fork bombs, request-rate and source-IP entropy anomalies) with host-side
  failure evidence such as application crashes (Windows Event ID 1000/1001, Linux SIGSEGV/segfaults via
  auditd and journald, macOS unified-log crash entries), resource-exhaustion events (Windows Event ID
  2004), unexpected restarts (Windows Event ID 41/6005/6006), service stop/restart loops (Event ID 7031/7034),
  and cloud workload terminations (AWS CloudTrail TerminateInstances, CloudWatch crash patterns). It guides
  single-host triage as well as fleet-wide analysis across server estates, VDI pools, and Kubernetes nodes
  to distinguish exploitation-driven crashes from benign faults and legitimate peak load, using symbolic-logic
  signatures, statistical baselining, and machine-learning models.
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did inbound network traffic to a public-facing service match a known DoS or CVE crash-exploit
    signature in Zeek notice.log, and did that detection coincide with a measurable service-availability
    impact (e.g., an HTTP 503 spike)?
  context: Adversaries pursuing Impact via Application or System Exploitation often deliver a recognizable
    exploit payload before a service fails. Monitoring Zeek notice.log for IDS signatures tied to DoS
    tooling and CVE crash payloads gives early, high-confidence warning. Because default signature sets
    miss many exploit variants ([On the Detection Capabilities of Signature-Based IDS in the Context of
    Web Attacks](https://www.mdpi.com/2076-3417/12/2/852)), maintain and tune a curated rule set, and
    enforce protocol/argument/body size limits at web and reverse-proxy tiers using anomaly-scored rules
    ([OWASP ModSecurity Core Rule Set](https://github.com/coreruleset/coreruleset)). A positive result
    is a signature hit on a DMZ/public asset correlated in time with degraded availability; a negative
    result still warrants reviewing the statistical methods below for signatureless variants.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek http.log
  - Windows Event ID 1000
  - Windows Event ID 1001
  - 'NAI: DMZ network segment, Public-facing web servers, Internet gateways, Load balancers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  notice.log\n  | where note in (DoS_exploit_signatures, CVE_crash_payloads)\n  | join\
      \ (http.log | where status_code==503) on id.resp_h, ts within 5m\n  | alert"
- question: Are inbound request payloads to a given destination port statistically anomalous in their
    byte distribution compared to a learned normal profile, suggesting a malformed or oversized crash
    payload without a matching signature?
  context: Signatureless exploitation evades IDS rules, so model the 1-gram (byte-frequency) distribution
    of normal request payloads per destination port and per payload length, then score each inbound payload
    by Mahalanobis distance ([Anomalous Payload-Based Network Intrusion Detection (PAYL)](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11)).
    High-distance payloads flag NOP sleds, abnormal binary blobs, and oversized inputs characteristic
    of crash exploits. This catches zero-day or variant DoS attempts that precede an application crash.
    A positive result is a high anomaly score correlated with a downstream crash; combine with the host
    crash evidence for confirmation.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek http.log
  - Windows Event ID 1000
  - Windows Event ID 1001
  - 'NAI: DMZ network segment, Public-facing web servers, Internet gateways, Load balancers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  profile = byte_freq_1gram(normal_payloads) per (dst_port, length_bucket)\n  score =\
      \ mahalanobis(payload.byte_freq, profile.mean, profile.cov)\n  | where score > threshold\n  | alert\
      \ as malformed_payload"
- question: Has the 95th-percentile connection duration to a service exceeded its 30-day baseline (mean
    + 3 standard deviations), or has the per-service HTTP 503/unavailability rate breached its baseline
    upper bound?
  context: Successful exploitation that crashes or hangs a service distorts connection-timing and error-rate
    behavior. Flag destinations whose 95th-percentile connection duration exceeds mean + 3 stddev of the
    30-day baseline (indicative of hung/stalled handlers), and in parallel alert when the per-service
    503/unavailability rate breaches its baseline upper bound ([Online Forecasting and Anomaly Detection
    Based on ARIMA](https://www.mdpi.com/2076-3417/11/7/3194)). Derive thresholds per asset and revalidate
    monthly. Positive results point to an availability impact tied to exploitation; correlate with payload
    anomalies and host crashes for attribution.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek http.log
  - Windows Event ID 1000
  - Windows Event ID 1001
  - 'NAI: DMZ network segment, Public-facing web servers, Internet gateways, Load balancers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline_30d(conn_duration_p95) per service\n  | where conn_duration_p95 > base.mean\
      \ + 3*base.stddev\n  | union (http_503_rate > forecast_upper_bound per service)\n  | alert"
- question: Do incoming web requests to an application deviate from learned per-parameter profiles (length,
    character distribution, structural model), indicating candidate crash-inducing malformed inputs?
  context: Crash exploits frequently appear as malformed application-layer parameters. Learn per-application
    parameter profiles from access logs - parameter length, character distribution (chi-square test),
    and structural order (Markov model) - then flag requests deviating from the profile ([Anomaly Detection
    of Web-based Attacks](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf)).
    This surfaces fuzzed or malformed inputs that target parser/handler vulnerabilities. A positive result
    is a high anomaly score on a parameter immediately preceding an Event ID 1000 crash on the serving
    host.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek http.log
  - Windows Event ID 1000
  - Windows Event ID 1001
  - 'NAI: DMZ network segment, Public-facing web servers, Internet gateways, Load balancers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  profile = learn(param_length, char_dist_chisq, markov_structure) per app per param\n\
      \  | where request.param deviates_from profile\n  | alert as malformed_input"
- question: Does the forecasted count of DoS-related Zeek notices exceed its upper confidence interval,
    and what are the top contributing features (signature, source IP, target service, observed rate) for
    triage?
  context: Volume of DoS-related notices is itself a leading indicator of exploitation-driven impact.
    Forecast notice counts with ARIMA/Prophet and alert when observed counts exceed the upper confidence
    interval. Surface the top-3 contributing features (signature name, source IP, target service, observed
    rate) in the alert so an analyst can triage rapidly ([A Systematic Review on the Integration of Explainable
    AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    A positive result reveals an emerging DoS campaign; the contributing features speed scoping and blocking
    decisions.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek http.log
  - Windows Event ID 1000
  - Windows Event ID 1001
  - 'NAI: DMZ network segment, Public-facing web servers, Internet gateways, Load balancers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  forecast = ARIMA_or_Prophet(dos_notice_count_timeseries)\n  | where observed_count >\
      \ forecast.upper_ci\n  | annotate top3_features(signature, src_ip, target_service, rate)\n  | alert"
- question: Was an application crash (Windows Event ID 1000) immediately preceded by transfer of a file
    whose uncompressed size exceeds 1000x its transferred size (zip bomb) in Zeek files.log?
  context: Decompression bombs (zip/gzip) crash applications by exhausting memory/CPU on expansion - a
    low-effort DoS via exploitation of a parser. Alert on Zeek files.log entries where uncompressed size
    exceeds 1000x the transferred size for zip/gzip payloads, and apply portable Sigma rules for crash/exploit
    child-process lineage and decompression-bomb indicators ([SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma)).
    A positive result is a high-ratio file delivery temporally adjacent to an Event ID 1000 crash on the
    receiving host, indicating a deliberate availability attack.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Windows Event ID 1000
  - 'NAI: Critical application servers, User workstations, File servers, Web servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  files.log | where mime_type in (zip,gzip) and (total_bytes/seen_bytes) > 1000\n  | join\
      \ (WinEventLog Application EventCode=1000) on host, ts within 2m\n  | alert as zip_bomb"
- question: Did a single parent process spawn an anomalously high number of child processes (exceeding
    the 99th percentile of its 30-day baseline), indicating a fork bomb that precedes an application crash?
  context: Fork bombs exhaust process-table and memory resources, crashing applications and systems. Baseline
    child-process counts per parent over 30 days and flag events exceeding the 99th percentile; also profile
    the failure state by counting abnormal process terminations per parent ([A Sense of Self for Unix
    Processes](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes)). Use Windows
    Event ID 4688 (or auditd) to reconstruct lineage. A positive result is an explosive child-process
    count from one parent immediately preceding an Event ID 1000 crash, signaling resource-exhaustion
    DoS.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Windows Event ID 1000
  - 'NAI: Critical application servers, User workstations, File servers, Web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline_30d(child_count) per parent_image\n  | where child_count > base.p99\n\
      \  | correlate (EventCode=1000) within 5m\n  | alert as fork_bomb"
- question: Do short system-call sequences for a critical binary contain novel n-grams (abnormal mmap/clone/abort
    patterns) that precede a crash, indicating an exploited or misbehaving process?
  context: Exploitation drives processes through abnormal execution paths visible as unusual syscall sequences.
    Model normal short syscall sequences (n-grams, length 3-6) per critical binary from auditd/ETW and
    flag novel sequences (abnormal mmap/clone/abort patterns) that precede a crash; such deviations reliably
    indicate exploited or misbehaving processes ([A Sense of Self for Unix Processes](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes)).
    A positive result is a never-before-seen syscall n-gram on a critical binary just before its termination,
    strengthening the case for exploitation over a benign fault.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Windows Event ID 1000
  - 'NAI: Critical application servers, User workstations, File servers, Web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  model = learn_ngrams(syscall_seq, n=3..6) per critical_binary\n  | where current_seq.ngram\
      \ not in model\n  | correlate process_crash within 1m\n  | alert as syscall_anomaly"
- question: Does a machine-learning classifier flag a transferred file as crash-inducing based on its
    compression ratio, file type, and proximity to a host crash, and what features drove that decision?
  context: Beyond simple ratio thresholds, train a decision tree / Random Forest on file compression ratios,
    file type, and host crash proximity to classify uploads as crash-inducing, then report the top-3 driving
    features in the alert text ([A Systematic Review on the Integration of Explainable AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    This captures multi-factor crash-file patterns that a single rule misses. A positive result is a high-confidence
    classification correlated with an Event ID 1000 crash; the surfaced features help an analyst confirm
    the malicious delivery vector.
  answer_sources:
  - Windows Event ID 4688
  - Zeek files.log
  - Windows Event ID 1000
  - 'NAI: Critical application servers, User workstations, File servers, Web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [compression_ratio, file_type, crash_proximity]\n  pred = RandomForest.predict(features)\n\
      \  | where pred == crash_inducing\n  | annotate top3_features\n  | alert"
- question: Was a resource-exhaustion event (Windows Event ID 2004) observed on a critical asset, and
    was it followed by service stop/restart sequences (Event ID 7031/7034/41)?
  context: Resource-exhaustion events are a direct precursor to exploitation-driven crashes and restarts.
    Trigger alerts immediately when Event ID 2004 (Windows Resource-Exhaustion Detector) fires on critical
    assets, and apply Sigma rules for unexpected service stop/restart sequences (Event ID 7031/7034/41)
    on those hosts ([SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma)). A positive result is
    a 2004 event followed by an unexpected restart or service crash loop on a database/virtualization/terminal
    server or domain controller, indicating an active availability impact rather than routine load.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 2004
  - Windows Event ID 6006
  - Windows Event ID 41
  - 'NAI: Database servers, Virtualization hosts, Terminal servers, Domain Controllers, Critical application
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  WinEventLog | where EventCode==2004 and asset in critical_assets\n  | correlate (EventCode\
      \ in (7031,7034,41)) within 10m\n  | alert as resource_exhaustion_crash"
- question: Has the 5-minute rate of resource-exhaustion events (Event ID 2004) exceeded mean + 3 standard
    deviations of the per-asset baseline, and does a forecast indicate an impending crash?
  context: Statistical spikes in resource events reveal exploitation that gradually exhausts memory/handles
    before a crash. Flag current 5-minute Event ID 2004 rates exceeding mean + 3 stddev of the per-asset
    baseline; forecast expected resource-event and crash counts and alert on confidence-interval breaches
    ([Online Forecasting and Anomaly Detection Based on ARIMA](https://www.mdpi.com/2076-3417/11/7/3194)).
    A positive result is a sharp, baseline-breaking rise in resource events on a critical asset, providing
    lead time to intervene before the Event ID 1000/41/6006 failure occurs.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 2004
  - Windows Event ID 6006
  - Windows Event ID 41
  - 'NAI: Database servers, Virtualization hosts, Terminal servers, Domain Controllers, Critical application
    servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline(EventCode2004_rate_5m) per asset\n  | where rate_5m > base.mean + 3*base.stddev\n\
      \  | union (forecast_breach(resource_events, crash_count))\n  | alert"
- question: Do application/system log-key sequences exhibit error->restart->error loops or memory/thread
    spikes consistent with an LSTM-modeled crash precursor pattern?
  context: 'Exploitation-driven crashes often manifest as repeating error->restart->error loops with resource
    spikes. Model application/system log-key sequences and parameter-value vectors with an LSTM ([DeepLog:
    Anomaly Detection and Diagnosis from System Logs through Deep Learning](https://doi.org/10.1145/3133956.3134015))
    to detect these loops and the memory/thread spikes that precede crashes, providing per-event diagnosis
    for triage. A positive result is a deviation from learned normal log sequences forming a crash loop,
    which both detects the DoS and points the analyst to the failing component for response.'
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 2004
  - Windows Event ID 6006
  - Windows Event ID 41
  - 'NAI: Database servers, Virtualization hosts, Terminal servers, Domain Controllers, Critical application
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = DeepLog_LSTM(log_key_seq, param_vectors)\n  | where seq_prob < threshold or\
      \ detected(error->restart->error loop)\n  | annotate per_event_diagnosis\n  | alert"
- question: Did any single source IP issue more than 100 requests per second to a single URI on a public-facing
    service, indicating a high-rate flood targeting an exploited endpoint?
  context: Volumetric request floods against a specific URI can both trigger and amplify an exploitation-based
    DoS. Alert when a source IP issues >100 requests per second to a single URI, and enforce request-rate
    and argument-size limits at the web/reverse-proxy tier ([OWASP ModSecurity Core Rule Set](https://github.com/coreruleset/coreruleset)).
    A positive result is a concentrated high-rate burst against an internet gateway, load balancer, or
    API endpoint coinciding with service unavailability, distinguishing a deliberate attack from distributed
    legitimate traffic.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Load balancers, Public-facing API endpoints, DNS servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  http.log | bin 1s by src_ip, uri | count requests\n  | where requests_per_sec > 100\n\
      \  | alert as high_rate_uri"
- question: Did a service experience a drop in 1-minute source-IP Shannon entropy below the 5th percentile
    (traffic concentrating onto few attackers) while connections-per-second exceeded mean + 3 standard
    deviations?
  context: When an exploited service is being overwhelmed, traffic concentrates onto a small set of attacking
    sources, collapsing source-IP entropy even as connection rate spikes. Flag services whose 1-minute
    source-IP Shannon entropy falls below the 5th percentile while connections-per-second exceeds mean
    + 3 stddev; model the per-service request series and alert on departures from the forecasted normal
    band ([Intrusion Detection for Web Services Based on Time Series](https://ieeexplore.ieee.org/document/7129383/)).
    A positive result strongly indicates a focused DoS against an exploited endpoint rather than organic
    demand.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Load balancers, Public-facing API endpoints, DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per service per 1m: ent = shannon_entropy(src_ip); cps = conn_per_sec\n  | where ent\
      \ < p5(ent_baseline) and cps > mean+3*stddev\n  | alert as entropy_drop"
- question: Can a supervised classifier distinguish DoS-driven overload of an exploited service from normal
    peak load using request rate/volume and error-response features?
  context: Legitimate traffic peaks resemble attacks superficially, causing false positives. Train a supervised
    classifier (neural network) on request rate/volume and error-response features to distinguish DoS-driven
    overload of an exploited service from normal peak load ([Detection of Denial of Service Attacks against
    Domain Name System Using Neural Networks](https://arxiv.org/abs/0912.1815)). A positive result is
    a high-confidence DoS classification during a service-unavailability window, giving the analyst confidence
    that the disruption is adversarial and warrants blocking/mitigation rather than capacity scaling.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Load balancers, Public-facing API endpoints, DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = [request_rate, request_volume, error_response_ratio]\n  pred = NN.predict(features)\n\
      \  | where pred == dos_overload\n  | alert"
- question: Do Zeek conn.log connections form new dense clusters or outliers when scored with Isolation
    Forest on duration, bytes, protocol, state, and connections-per-second, and what features drive the
    anomaly?
  context: Unsupervised anomaly detection surfaces DoS patterns that supervised rules miss. Score Zeek
    conn.log features (duration, bytes, protocol, state, conn/s) with Isolation Forest ([Isolation Forest](https://doi.org/10.1145/2133360.2133363))
    and investigate new dense clusters or outliers, reporting the top-3 contributing features in the alert
    ([A Systematic Review on the Integration of Explainable AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    A positive result is an emergent cluster of short, repetitive, high-rate connections to a service
    experiencing unavailability, indicating a coordinated exploitation-driven flood.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Internet gateways, Load balancers, Public-facing API endpoints, DNS servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = conn.log[duration, bytes, proto, conn_state, conn_per_sec]\n  scores = IsolationForest.fit_score(features)\n\
      \  | where anomaly or new_dense_cluster\n  | annotate top3_features\n  | alert"
- question: Did more than 10% of assets in a fleet group report unexpected restarts (Windows Event ID
    41/6008) within a 15-minute window outside of a scheduled maintenance window?
  context: Mass simultaneous restarts across similar assets signal a fleet-wide exploitation-driven DoS
    rather than isolated faults. Alert if >10% of assets in a group report unexpected restarts (Event
    ID 41/6008) within 15 minutes outside a maintenance window, using portable service-stop/restart Sigma
    rules ([SigmaHQ Detection Rules](https://github.com/SigmaHQ/sigma)). A positive result is a synchronized
    restart wave across a server estate, VDI pool, or Kubernetes node group with no change-management
    justification, indicating coordinated impact.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 6005
  - Windows Event ID 6006
  - Windows Event ID 41
  - 'NAI: All enterprise servers, All user workstations, Virtual Desktop Infrastructure (VDI) pools, Kubernetes
    nodes, Change management database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  WinEventLog | where EventCode in (41,6008)\n  | bin 15m by asset_group | pct = distinct(asset)/group_size\n\
      \  | where pct > 0.10 and not in_maintenance_window\n  | alert as fleet_restart_spike"
- question: Does a fleet group's hourly crash count exceed mean + 3 standard deviations (or the 99th percentile)
    of its historical baseline after validating against change management, and does a forecast confirm
    an upper-bound breach?
  context: Fleet-level crash baselining catches distributed exploitation that per-host alerts would treat
    as noise. Flag group hourly crash counts exceeding mean + 3 stddev (or 99th percentile) after validating
    against change management, and forecast expected fleet crash counts to alert on upper-bound breaches
    ([Online Forecasting and Anomaly Detection Based on ARIMA](https://www.mdpi.com/2076-3417/11/7/3194)).
    A positive result is an unexplained, baseline-breaking surge of Event ID 1000/41 crashes across a
    homogeneous fleet outside maintenance, indicating systemic exploitation impacting availability.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 6005
  - Windows Event ID 6006
  - Windows Event ID 41
  - 'NAI: All enterprise servers, All user workstations, Virtual Desktop Infrastructure (VDI) pools, Kubernetes
    nodes, Change management database'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = baseline(hourly_crash_count) per fleet_group\n  | where count > max(base.mean+3*base.stddev,\
      \ base.p99) and not change_approved\n  | union (forecast_upper_bound_breach)\n  | alert"
- question: Does change-point detection (Bayesian online / CUSUM / PELT) on the aggregated fleet crash-and-restart
    time series reveal an abrupt level shift marking DoS onset?
  context: A coordinated DoS produces a sharp shift in the aggregate fleet failure rate. Apply Bayesian
    online change-point detection / CUSUM / PELT to the aggregated fleet crash-and-restart time series
    and alert on abrupt level shifts marking DoS onset ([A Survey of Methods for Time Series Change Point
    Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)). A positive result is a detected step
    change in the combined crash/restart rate that pinpoints the start time of the impact, helping the
    analyst scope the incident window and correlate with network exploitation evidence.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 6005
  - Windows Event ID 6006
  - Windows Event ID 41
  - 'NAI: All enterprise servers, All user workstations, Virtual Desktop Infrastructure (VDI) pools, Kubernetes
    nodes, Change management database'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  series = aggregate(crash_count + restart_count) per fleet_group over time\n  cp = changepoint_detect(series,\
      \ method in [BOCPD, CUSUM, PELT])\n  | where abrupt_level_shift\n  | alert as dos_onset"
- question: Does a Bayesian network fusing weak per-host signals (payload anomaly, syscall anomaly, crash
    spike, request-rate change) yield a single calibrated, false-positive-reduced detection, and what
    evidence dominates?
  context: Individually weak signals become decisive when fused. Combine per-host signals (payload anomaly,
    syscall anomaly, crash spike, request-rate change) with a Bayesian network to produce a single calibrated,
    false-positive-reduced detection that surfaces the dominant contributing evidence ([Bayesian Event
    Classification for Intrusion Detection](https://ieeexplore.ieee.org/document/1254306/)). A positive
    result is a high-posterior fused alert that confidently identifies exploitation-driven DoS while suppressing
    noise, and the dominant evidence directs the analyst's response and confirmation steps.
  answer_sources:
  - Windows Event ID 1000
  - Windows Event ID 1001
  - Windows Event ID 6005
  - Windows Event ID 6006
  - Windows Event ID 41
  - 'NAI: All enterprise servers, All user workstations, Virtual Desktop Infrastructure (VDI) pools, Kubernetes
    nodes, Change management database'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  evidence = [payload_anomaly, syscall_anomaly, crash_spike, request_rate_change]\n  posterior\
      \ = BayesianNetwork.infer(evidence)\n  | where posterior > threshold\n  | annotate dominant_evidence\n\
      \  | alert"
