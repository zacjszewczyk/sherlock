- question: Did a host-based firewall add an allow rule or new permit within 5 minutes of a block burst
    from the same source IP that is now permitted?
  context: Alert when a Windows Firewall rule add (Event ID 4950) or new permit (5156) - or a Linux auditd
    execve of iptables/nft/ufw/firewall-cmd adding an allow rule - occurs within 5 minutes of a burst
    of block events (5157) from the same source IP that is now permitted. This is the knock->firewall-open
    pivot from deGraaf et al., using first-party host logs only; a source that was being blocked and is
    suddenly allowed is the smoking gun of a port-knock-driven firewall change. Under the Stealth tactic
    the adversary tries to hide and conceal their signaling so that it blends in with normal traffic;
    this question helps an analyst surface the concealed trigger/activation behavior that the actor is
    relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Windows Event ID 5157
  - Windows Event ID 5156
  - Windows Event ID 4950
  - 'NAI: Host-based firewalls on critical servers (e.g., Domain Controllers, database servers) and administrator
    workstations.'
  range: Last 90 days, event-centered correlation within a 5-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for allow in (WinEID4950 add | WinEID5156 permit | auditd[iptables/nft/ufw/firewall-cmd add]):
        blocks = WinEID5157 deny from same src to same host within [allow-5m, allow]
        if blocks and allow now permits that src: alert(src, port=allow.port, host)
