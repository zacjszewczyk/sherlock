- question: Did a single source send more than 10 connections with unusual flag combinations (Zeek conn_state
    OTH, history S2/S3, NULL/XMAS/FIN-SYN) to one destination within a minute?
  context: Alert when a single source generates more than 10 connections with Zeek conn_state 'OTH' or
    a history containing 'S2'/'S3' (unusual flag combinations such as FIN/SYN, NULL, XMAS) to one destination
    within 1 minute. Unusual-flag probes are an explicit traffic-signaling variant noted in deGraaf et
    al.; keep the count threshold tunable. Crafted flags are often the signal itself or firewall-rule
    discovery preceding it. Under the Stealth tactic the adversary tries to hide and conceal their signaling
    so that it blends in with normal traffic; this question helps an analyst surface the concealed trigger/activation
    behavior that the actor is relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network firewalls, intrusion detection systems, externally facing hosts, and internal network
    choke points between security zones.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      group conn by (src,dst) in 60s:
        weird = [c for c in group if c.conn_state=='OTH' or 'S2' in c.history or 'S3' in c.history]
        if len(weird) > 10: alert(src,dst,count=len(weird))
- question: Is a source's failed-to-successful connection ratio above the 98th percentile across all sources?
  context: For each source IP compute the ratio of failed/rejected to successful connections across destinations
    over 5 minutes, then alert when the ratio exceeds the 98th percentile for all sources - the failure-rate
    discriminator established by Jung et al. TRW for distinguishing probing from legitimate use. Report
    the ratio, distinct-port count and dominant conn_state. Under the Stealth tactic the adversary tries
    to hide and conceal their signaling so that it blends in with normal traffic; this question helps
    an analyst surface the concealed trigger/activation behavior that the actor is relying on to stay
    indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network firewalls, intrusion detection systems, externally facing hosts, and internal network
    choke points between security zones.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for src in 5m window:
        ratio = failed(src)/max(success(src),1)
        if ratio > pctl98(all_sources_ratio):
          alert(ratio, distinct_ports=count_dports(src), dominant_state=mode(conn_state))
