- question: Was a Wake-on-LAN magic packet (6x0xFF + 16xMAC) seen on broadcast UDP port 7/9 from a source
    not on the management allowlist?
  context: Detect the exact magic-packet structure - 6 bytes of 0xFF followed by 16 repetitions of a target
    MAC, typically broadcast UDP destination port 7 or 9 per the AMD Magic Packet spec (e.g., Zeek WakeOnLan::Found).
    Alert for any such packet whose source IP is not on the allowlist of authorized network-management
    servers. Keep the byte pattern and allowlist as the deterministic floor; an unauthorized WoL is an
    adversary powering on a target for lateral movement. Under the Stealth tactic the adversary tries
    to hide and conceal their signaling so that it blends in with normal traffic; this question helps
    an analyst surface the concealed trigger/activation behavior that the actor is relying on to stay
    indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network sensors monitoring broadcast traffic on all internal VLANs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      event WakeOnLan::Found(src_ip, target_mac):
        if payload starts FFx6 + MACx16 and dport in [7,9] and src_ip not in mgmt_allowlist:
          alert(src_ip, target_mac)
- question: Did a single source exceed the per-VLAN WoL baseline by 3 standard deviations, or wake a MAC
