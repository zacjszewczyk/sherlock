questions:
- question: Did any UDP or TCP packet carry a known magic-value byte sequence, Cobalt Strike artifact,
    or matching JA3/JA3S fingerprint that activates a dormant implant?
  context: This is the deterministic signature floor. Deploy Zeek/Suricata content rules that match known
    magic-value byte sequences in UDP/TCP payloads, apply the Cobalt Strike YARA rules (signature-base
    apt_cobaltstrike.yar) to files.log-extracted content and HTTP POST bodies, and fingerprint the encrypted
    callback with JA3/JA3S. A match means a non-standard trigger or implant artifact crossed the sensor
    and warrants immediate host triage; keep concrete byte/JA3 patterns and tune rather than delete them.
    Under the Stealth tactic the adversary tries to hide and conceal their signaling so that it blends
    in with normal traffic; this question helps an analyst surface the concealed trigger/activation behavior
    that the actor is relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek notice.log
  - 'NAI: Network traffic sensors at internet gateways, traffic between VLANs (especially server/workstation
    segments), and on host endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: Zeek/Suricata signature
    query: |-
      rule match: payload =~ known_magic_value_regex OR ja3 IN known_c2_ja3 OR ja3s IN known_c2_ja3s
        OR yara_match(files.log.extracted, apt_cobaltstrike.yar)
      => alert(severity=high, evidence={src,dst,dport,proto,match_name})
- question: Did a small inbound packet (<64 bytes) to a closed/non-listening port show abnormally high
    Shannon entropy from a rarely-seen source IP?
  context: For inbound packets with payloads under 64 bytes compute Shannon entropy; flag when entropy
    exceeds the 98th percentile for that destination port AND the connection ends in a failed/non-listening
    state (Zeek conn_state REJ/S0/RSTO, the probing failure-mode discriminator from Jung et al. TRW).
    Then check source rarity and alert if the source IP was seen fewer than 5 times in the last 30 days.
    High entropy in a tiny failed packet from a stranger is the fingerprint of a crafted/encrypted trigger;
    surface the entropy value, port, conn_state and source frequency. Under the Stealth tactic the adversary
    tries to hide and conceal their signaling so that it blends in with normal traffic; this question
    helps an analyst surface the concealed trigger/activation behavior that the actor is relying on to
    stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek notice.log
  - 'NAI: Network traffic sensors at internet gateways, traffic between VLANs (especially server/workstation
    segments), and on host endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for pkt in inbound where payload_len < 64:
        e = shannon_entropy(pkt.payload)
        if e > pctl98(entropy_by_dport[pkt.dport]) and pkt.conn_state in [REJ,S0,RSTO]
           and count_30d(src_ip) < 5:
           alert(entropy=e, dport=pkt.dport, conn_state=pkt.conn_state, src_freq=count_30d(src_ip))
- question: Does a supervised classifier plus an unsupervised autoencoder flag an inbound packet as a
    likely crafted trigger, with SHAP explaining why?
  context: Train a Gradient Boosting classifier on labeled sessions using payload entropy, packet size,
    protocol, src/dst-port rarity, success/fail state, source reputation and JA3/JA3S, and in parallel
    run a Kitsune/KitNET packet-reconstruction-error autoencoder to catch novel crafted packets without
    labels. Every alert must list the top-3 contributing features (e.g., entropy, port rarity, fail-state)
    per the SHAP-in-IDS review so analysts can trust and triage it. The ML layer catches signals that
    evade fixed byte signatures. Under the Stealth tactic the adversary tries to hide and conceal their
    signaling so that it blends in with normal traffic; this question helps an analyst surface the concealed
    trigger/activation behavior that the actor is relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek notice.log
  - 'NAI: Network traffic sensors at internet gateways, traffic between VLANs (especially server/workstation
    segments), and on host endpoints themselves.'
  range: Last 90 days
  queries:
  - technology: ML pseudocode
    query: |-
      score_s = gbm.predict_proba(features=[entropy,size,proto,sport_rarity,dport_rarity,state,src_rep,ja3])
      score_u = kitnet.reconstruction_error(packet)
      if score_s > thr_s or score_u > thr_u:
        alert(prob=score_s, recon_err=score_u, top3=shap_top3(features))
- question: Did a process load wpcap.dll/npcap.dll or open a raw/AF_PACKET socket when its user is not
    an authorized network analyst?
  context: Alert when a process loads wpcap.dll or npcap.dll (Sysmon Event ID 7) and the user is not in
    an authorized network-analyst group, or on Linux when auditd shows a non-allowlisted process running
    tcpdump/tshark or opening an AF_PACKET/raw socket. Sniffer-based observation of trigger packets is
    the original cd00r/libpcap technique (deGraaf et al.); a non-analyst process gaining packet-capture
    capability is a strong sign of a signal-listening implant. Under the Stealth tactic the adversary
    tries to hide and conceal their signaling so that it blends in with normal traffic; this question
    helps an analyst surface the concealed trigger/activation behavior that the actor is relying on to
    stay indistinguishable from benign activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, application servers, administrator workstations, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      win: Sysmon EID7 where ImageLoaded in [wpcap.dll,npcap.dll] and User not in NetAnalystGroup => alert
      linux: auditd execve in [tcpdump,tshark] or socket(AF_PACKET|SOCK_RAW) and proc not in allowlist => alert
- question: Is the (process, loaded-library) pair enterprise-rare, such as outlook.exe loading wpcap.dll?
  context: Baseline (process name, loaded DLL/library) pairs per host and across the enterprise, then
    alert on pairs in the bottom 1st percentile of observed frequency. A capture library bound to a process
    that has no business sniffing traffic (e.g., outlook.exe -> wpcap.dll) is anomalous. Report the pair,
    the count of distinct hosts where it has been seen, and the user context. Under the Stealth tactic
    the adversary tries to hide and conceal their signaling so that it blends in with normal traffic;
    this question helps an analyst surface the concealed trigger/activation behavior that the actor is
    relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, application servers, administrator workstations, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = freq(process_name, loaded_library) over enterprise
      for ev in EID7:
        if baseline[(ev.process,ev.library)] <= pctl1(baseline):
          alert(pair=(ev.process,ev.library), host_count=distinct_hosts(pair), user=ev.user)
- question: Does an Isolation Forest flag an unusual process loading a capture library, with SHAP showing
    the drivers?
  context: Train an Isolation Forest on Sysmon Event ID 7 events using process-hash, parent-process-hash,
    loaded-library-hash and user account, then flag unusual processes loading capture libraries. Attach
    the top-3 features driving the anomaly score (e.g., rare parent, non-admin user) per the SHAP-in-IDS
    review so the analyst sees why the load is suspicious before pivoting to the host. Under the Stealth
    tactic the adversary tries to hide and conceal their signaling so that it blends in with normal traffic;
    this question helps an analyst surface the concealed trigger/activation behavior that the actor is
    relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 7
  - 'NAI: Domain Controllers, application servers, administrator workstations, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: ML pseudocode
    query: |-
      model = IsolationForest(features=[proc_hash,parent_hash,lib_hash,user])
      score = model.anomaly_score(EID7_event)
      if score > thr: alert(score=score, top3=shap_top3(features))
- question: Did a single source make N failed attempts to distinct closed ports then a successful connect
    to a newly opened port within T seconds?
  context: Track per source->destination connection outcomes. If N failed attempts (Zeek conn_state REJ/S0
    or TCP RST) to distinct closed ports are followed by one successful connect (SF) within a T-second
    window (default N=3, T=15), alert. This encodes the canonical port-knock artifact (closed-port burst
    -> firewall opens port -> successful connect) from deGraaf et al. Keep N/T as tunable deterministic
    thresholds; a positive is the textbook knock-then-open and demands host investigation. Under the Stealth
    tactic the adversary tries to hide and conceal their signaling so that it blends in with normal traffic;
    this question helps an analyst surface the concealed trigger/activation behavior that the actor is
    relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5157
  - Windows Event ID 5156
  - 'NAI: Externally facing servers (e.g., web servers, VPN concentrators), DMZ bastion hosts, and critical
    internal servers that should have a very restricted set of open ports.'
  range: Last 90 days, event-centered correlation within a 15-second window
  queries:
  - technology: Zeek/pseudocode
    query: |-
      group conn by (src,dst) order by ts:
        fails = [c for c in window if c.conn_state in [REJ,S0] and c.dport closed and distinct]
        if len(fails) >= N and exists success(SF) within T sec after last fail:
          alert(src,dst,knock_ports=fails.dports,open_port=success.dport)
- question: Does a Threshold Random Walk/SPRT plus destination-port entropy identify a source as a probing
    knocker?
  context: Apply a Threshold Random Walk / SPRT over each source's ordered connection success-vs-failure
    outcomes (Jung et al. TRW); probing sources show a far higher fail:success ratio and are flagged within
    ~4-5 events with tunable likelihood ratios, more robustly than raw counts. Additionally compute Shannon
    entropy of destination ports per source in a sliding 1-minute window; high entropy (>99th pct for
    the host) followed by a successful connect confirms a likely knock. Report fail:success ratio and
    port-entropy. Under the Stealth tactic the adversary tries to hide and conceal their signaling so
    that it blends in with normal traffic; this question helps an analyst surface the concealed trigger/activation
    behavior that the actor is relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5157
  - Windows Event ID 5156
  - 'NAI: Externally facing servers (e.g., web servers, VPN concentrators), DMZ bastion hosts, and critical
    internal servers that should have a very restricted set of open ports.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      for src: run SPRT(outcomes=success/fail, theta0,theta1) -> if walk crosses upper bound: suspect
        dport_entropy = shannon(dport_counts in 60s)
        if suspect and dport_entropy > pctl99(host) and later_success(src):
          alert(fail_success_ratio, dport_entropy)
- question: Does a seasonal spike model plus Kitsune flag an un-forecast failed-connect burst from one
    source followed by a success?
  context: Model the per-host stream of failed connections (Windows 5157 / Zeek REJ) with a seasonal anomaly
    detector (S-H-ESD) and in parallel score packet-rate/jitter bursts with Kitsune. A sharp un-forecast
    failed-connect spike from one source immediately followed by a success is high-confidence knocking.
    Surface the top-3 features (fail-count delta, distinct closed ports, time-to-success) per the SHAP-in-IDS
    review. Under the Stealth tactic the adversary tries to hide and conceal their signaling so that it
    blends in with normal traffic; this question helps an analyst surface the concealed trigger/activation
    behavior that the actor is relying on to stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5157
  - Windows Event ID 5156
  - 'NAI: Externally facing servers (e.g., web servers, VPN concentrators), DMZ bastion hosts, and critical
    internal servers that should have a very restricted set of open ports.'
  range: Last 90 days
  queries:
  - technology: ML pseudocode
    query: |-
      resid = SH_ESD(failed_connects_per_host_timeseries)
      if resid.is_anomaly and kitsune.score(packet_burst) > thr and success_follows(src):
        alert(top3=shap_top3([fail_delta,distinct_closed_ports,time_to_success]))
- question: Did a host boot outside business hours without an authorized Wake-on-LAN magic packet from
    an allowlisted management server in the prior 5 minutes?
  context: Correlate boot events (Windows Event ID 6005) with network logs. Alert if a boot occurs outside
    business hours and is NOT preceded within 5 minutes by a valid WoL magic packet (6x0xFF + 16xMAC per
    the AMD Magic Packet spec) from an allowlisted management/SCCM server. Keep the authorized-source
    allowlist as the deterministic gate. An unauthorized off-hours wake suggests an adversary turning
    on a system to enable lateral movement. Under the Stealth tactic the adversary tries to hide and conceal
    their signaling so that it blends in with normal traffic; this question helps an analyst surface the
    concealed trigger/activation behavior that the actor is relying on to stay indistinguishable from
    benign activity.
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - Windows Event ID 6005
  - Zeek notice.log
  - 'NAI: All endpoint subnets, especially those containing workstations that are regularly powered down
    overnight, and server subnets where systems are expected to be online 24/7.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      for boot in WinEID6005 where boot.time outside business_hours:
        wol = find WoL_magic(target_mac==boot.host.mac) within [boot-5m, boot]
        if not wol or wol.src_ip not in mgmt_allowlist:
          alert(host=boot.host, time=boot.time)
