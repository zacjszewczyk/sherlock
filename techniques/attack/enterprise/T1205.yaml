    signal, flag WoL packets targeting a MAC that does NOT subsequently boot or appear in DHCP/conn logs
    - repeated unanswered wakes suggest reconnaissance or spoofed targets. Under the Stealth tactic the
    adversary tries to hide and conceal their signaling so that it blends in with normal traffic; this
    question helps an analyst surface the concealed trigger/activation behavior that the actor is relying
    on to stay indistinguishable from benign activity.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network sensors monitoring broadcast traffic on all internal VLANs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = moving_avg_30d(wol_count[vlan]); sd = stddev_30d
      if src.wol_count > base + 3*sd: alert(volume_anomaly)
      if wol.target_mac not in (boots ∪ dhcp ∪ conn within 10m): alert(unanswered_wake, target_mac)
