name: 'T1205: Traffic Signaling'
id: df9d4b61-7d83-40bc-8ac6-6917601ad4d8
description: Investigate whether an adversary is using traffic signaling (port knocking, crafted/unusual-flag
  packets, magic-value payloads, Wake-on-LAN magic packets, or libpcap/raw-socket sniffers) to covertly
  open closed ports, activate dormant implants, enable services on network devices, or power on systems
  for follow-on access. This playbook helps an analyst correlate network evidence (closed-port knock bursts
  followed by a successful connect, high-entropy small packets to non-listening ports, WoL magic packets,
  unusual TCP flag combinations, trigger-then-callback sequences, and post-signal beaconing) with host
  evidence (non-analyst processes loading packet-capture libraries, host-based firewall allow rules appearing
  right after block bursts, and off-hours boots without authorized wakes). It spans the Stealth, Command
  and Control, and Persistence tactics and combines deterministic signatures, statistical baselines, and
  explainable machine-learning detections across Zeek/network logs, Windows Event Logs, Sysmon, auditd,
  macOS unified logs, and network-device syslog.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0011
  tactic_name: Command and Control
- tactic_id: TA0003
  tactic_name: Persistence
