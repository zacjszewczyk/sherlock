- question: '[Defense Impairment] PowerShell v2 argument and engine-version detection: Can you determine
    whether a PowerShell process is initiated with command-line arguments explicitly requesting version
    2 (e.g., ''-v 2'', ''-version 2''), which lacks modern security features like Script Block Logging
    and AMSI. -- specifically, using the ''PowerShell v2 argument and engine-version detection'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary attempts to evade
    or undermine security controls by downgrading system features, interpreters, protocols, or boot components
    to less-secure versions that lack modern logging and integrity protections. This evidence focuses
    on the condition that a PowerShell process is initiated with command-line arguments explicitly requesting
    version 2 (e.g., ''-v 2'', ''-version 2''), which lacks modern security features like Script Block
    Logging and AMSI. The ''PowerShell v2 argument and engine-version detection'' approach (Symbolic Logic)
    works as follows: Alert on PowerShell process creations supplying ''-v 2''/''-version 2'', AND independently
    alert on Windows PowerShell classic Event ID 400 where EngineVersion < 5.0 - the latter also catches
    host-application downgrades (e.g., Empire psinject loading the v2 engine inside another process) that
    command-line parsing misses. Treat the absence of an expected Event ID 4104 script block for a session
    as a corroborating failure-mode signal [Detecting and Preventing PowerShell Downgrade Attacks](https://www.leeholmes.com/detecting-and-preventing-powershell-downgrade-attacks/)
    [about_Logging (Windows)](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows?view=powershell-7.4)
    [Keeping PowerShell, NSA/CISA](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF).
