- question: '[Defense Impairment] Critical service modification rule: Can you determine whether a registry
    modification event (Windows Event ID 4657) is observed that disables a security feature. This is indicated
    by a specific registry value being set to an insecure state, such as `HKLM\SOFTWARE\Policies\Microsoft\Windows
    Defender\DisableAntiSpyware` set to `1` or `HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity\Enabled`
    set to `0`. -- specifically, using the ''Critical service modification rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary attempts to evade
    or undermine security controls by downgrading system features, interpreters, protocols, or boot components
    to less-secure versions that lack modern logging and integrity protections. This evidence focuses
    on the condition that a registry modification event (Windows Event ID 4657) is observed that disables
    a security feature. This is indicated by a specific registry value being set to an insecure state,
    such as `HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\DisableAntiSpyware` set to `1` or `HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity\Enabled`
    set to `0`. The ''Critical service modification rule'' approach (Symbolic Logic) works as follows:
    Alert when watchlist security keys are set to insecure values (e.g., Defender DisableAntiSpyware=1,
    HVCI Enabled=0), and extend the watchlist to Secure Boot revocation state - alert on rollback or removal
    of the AvailableUpdates/DBX revocation values that would otherwise block downgraded boot managers
    [KB5025885 Secure Boot Boot Manager Revocations](https://support.microsoft.com/en-us/topic/kb5025885-how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023-24932-41a975df-beb2-40c1-99a3-b3ff139f832d)
