questions:
- question: '[Defense Impairment] Name and path IOC detection for vulnerable binaries: Can you determine
    whether a process is executed (Windows Event ID 4688) or a service is created (Windows Event ID 7045)
    using a vulnerable or outdated binary, utility, or driver that is known to bypass security controls.
    -- specifically, using the ''Name and path IOC detection for vulnerable binaries'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary attempts to evade
    or undermine security controls by downgrading system features, interpreters, protocols, or boot components
    to less-secure versions that lack modern logging and integrity protections. This evidence focuses
    on the condition that a process is executed (Windows Event ID 4688) or a service is created (Windows
    Event ID 7045) using a vulnerable or outdated binary, utility, or driver that is known to bypass security
    controls. The ''Name and path IOC detection for vulnerable binaries'' approach (Symbolic Logic) works
    as follows: Alert when process or service creations (Event ID 4688/7045) match known vulnerable binary,
    driver, or boot-manager names, signed paths, or command-line arguments associated with downgrade abuse
    (BYOVD and bring-your-own-vulnerable-bootloader). Match against known-vulnerable file hashes only
    when telemetry records hashes, and cross-check hashes against the UEFI/SBAT revocation list so a still-trusted-but-revoked
    binary is flagged [There''s a Hole in the Boot (BootHole)](https://eclypsium.com/blog/theres-a-hole-in-the-boot/)
    [KB5025885 Secure Boot Boot Manager Revocations](https://support.microsoft.com/en-us/topic/kb5025885-how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023-24932-41a975df-beb2-40c1-99a3-b3ff139f832d)
    [Sigma Rules](https://github.com/SigmaHQ/sigma). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable downgrade-based defense impairment; pivot to the responsible
    host, user/account, parent and child processes, the binary/interpreter/protocol or boot component
    involved, command-line arguments or negotiated version/cipher, and the surrounding timeline of registry,
    service, and integrity changes to scope intent and impact. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land downgrade activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 7045
  - 'NAI: Domain Controllers, Critical Application Servers, Endpoint Workstations of privileged users,
    Systems with EDR/AV agents'
