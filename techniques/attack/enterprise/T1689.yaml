      | approach: Alert when process or service creations (Event ID 4688/7045) match known vulnerable
      binary, driver, or boot-manager names, signed paths, or command-line arguments associated with downgrade
      abuse (BYOVD and bring-your-own-vulnerable-bootloader). Match against known-vulnerable file hashes
      only when telemetry records hashes, and cross-check hashes against the UEFI/SBAT revocation list
      so a still-trusted-but-revoked binary is flagged [There''s a Hole in the Boot (BootHole)](https://eclypsium.com/blog/theres-a-hole-in-the-boot/)
      [KB5025885 Secure Boot Boot Manager Revocations](https://support.microsoft.com/en-us/topic/kb5025885-how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023-24932-41a975df-beb2-40c1-99a3-b3ff139f832d)
      [Sigma Rules](https://github.com/SigmaHQ/sigma).

