name: 'T1689: Downgrade Attack'
id: 2bbce510-9176-4d3f-9c56-22e2e751a05a
description: 'This playbook helps an analyst investigate whether an adversary is impairing defenses by
  forcing systems, interpreters, protocols, or boot components into older, weaker, and less-monitored
  modes of operation (MITRE ATT&CK T1689, Downgrade Attack). Downgrade attacks abuse backward compatibility
  to defeat security controls and visibility: executing legacy or vulnerable binaries/drivers/boot managers
  (BYOVD and bring-your-own-vulnerable-bootloader), invoking PowerShell v2 to evade Script Block Logging
  and AMSI, disabling Defender/HVCI or rolling back Secure Boot revocations via the registry, negotiating
  deprecated or cleartext network protocols (SSLv3, TLS 1.0/1.1, HTTP on 443, FREAK/Logjam/POODLE fallback),
  staging older signed-but-vulnerable boot loaders to the EFI System Partition (BlackLotus/baton-drop),
  and chaining multiple defense-evasion actions under one parent process in a short window. The hunt pursues
  this behavior across endpoint, network, and boot-integrity telemetry from several complementary angles
  -- name/path/hash IOC matching against vulnerable-binary and UEFI/SBAT revocation lists, PowerShell
  engine-version and missing-script-block detection, watchlist registry-value monitoring, weak/cleartext
  TLS and capability-vs-negotiation gap analysis, bcdedit/manage-bde argument and ESP-write detection,
  and parent-driven multi-event tamper-chain correlation. Detection methods combine deterministic symbolic-logic
  rules, statistical baselining and rarity/frequency scoring (prevalence percentiles, sigma/ratio thresholds,
  entropy and event-rate counts), and machine learning (XGBoost/Random Forest, logistic regression, ARIMA/STL
  forecasting, Isolation Forest, one-class SVM, and LSTM/HMM sequence models), applied to Windows Event
  IDs (4688, 7045, 400, 4104, 4657, 7040, 4663), auditd/syslog and macOS unified logs, EDR/FIM telemetry,
  and Zeek conn/ssl/http logs, so the analyst can corroborate suspected downgrade activity against host,
  user, process, protocol, and boot-integrity context.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
