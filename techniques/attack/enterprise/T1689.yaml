      registry_key, service, protocol_version, cipher, file_path)'
- question: '[Defense Impairment] Rarity and failure-rate scoring for vulnerable binary prevalence: Can
    you determine whether a process is executed (Windows Event ID 4688) or a service is created (Windows
    Event ID 7045) using a vulnerable or outdated binary, utility, or driver that is known to bypass security
    controls. -- specifically, using the ''Rarity and failure-rate scoring for vulnerable binary prevalence''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary attempts to evade
    or undermine security controls by downgrading system features, interpreters, protocols, or boot components
    to less-secure versions that lack modern logging and integrity protections. This evidence focuses
    on the condition that a process is executed (Windows Event ID 4688) or a service is created (Windows
    Event ID 7045) using a vulnerable or outdated binary, utility, or driver that is known to bypass security
    controls. The ''Rarity and failure-rate scoring for vulnerable binary prevalence'' approach (Statistical
    Method) works as follows: Flag vulnerable binaries appearing below the 5th percentile of 90-day prevalence
    on a host/user baseline, especially first-seen in an administrative context. Also profile driver/binary
    load failures and signature-validation failures as a distinct State signal - older signed-but-vulnerable
    loaders are staged precisely to pass validation while bypassing integrity, so a successful load of
    a revoked/old version is anomalous [BlackLotus UEFI Bootkit](https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable downgrade-based
    defense impairment; pivot to the responsible host, user/account, parent and child processes, the binary/interpreter/protocol
    or boot component involved, command-line arguments or negotiated version/cipher, and the surrounding
    timeline of registry, service, and integrity changes to scope intent and impact. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land downgrade
    activity.'
