questions:
- question: Did any Linux host execute a process whose binary file hash matches a known indicator of compromise
    for malware families (such as BPFDoor or XorDdos) that rewrite /proc/[pid]/cmdline or other in-memory
    argument surfaces to masquerade as system daemons?
  context: Argument-spoofing Linux backdoors like BPFDoor and XorDdos overwrite argv[0] (consumed by /proc)
    to disguise themselves as legitimate daemons, but the on-disk binary still has a fixed hash. Joining
    process.hash from Sysmon for Linux EID 1 (or osquery/auditd/EDR process telemetry) against a curated
    threat-intelligence feed of these malware hashes gives a high-confidence, low-noise signal supporting
    the Stealth/Defense Evasion hunt. On a match, raise a high-severity alert and immediately snapshot
    the initial /proc/[pid]/cmdline and the /proc/[pid]/exe target so later masquerading can be proven
    by comparison. A positive result on a critical server is an active compromise; a negative result does
    not clear the host because adversaries recompile or pack tooling to change hashes.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = FILTER SysmonLinux_EID1 OR auditd_execve OR osquery_processes\nALERT WHERE proc.binary_sha256\
      \ IN threat_intel_argv_spoof_hashes\n  ON MATCH: severity=high; snapshot(proc.pid, /proc/[pid]/cmdline,\
      \ /proc/[pid]/exe)"
- question: Is any running process backed by a binary whose /proc/[pid]/exe link target is marked '(deleted)',
    or whose resolved on-disk binary basename does not match the displayed command/process name?
  context: An adversary can rewrite the in-memory argv shown by ps and /proc/[pid]/cmdline, but they cannot
    rewrite the /proc/[pid]/exe symlink, which always points at the real executable inode. BPFDoor and
    similar implants often run from a deleted binary (so the link target shows '(deleted)') and always
    exhibit a name-vs-exe mismatch when masquerading. Resolving /proc/[pid]/exe for every process and
    alerting on a deleted target or a basename that differs from the displayed name catches the invariant
    the masquerade cannot hide, directly supporting the Stealth detection. A positive result is highly
    suspicious and warrants binary retrieval from memory; benign deleted-binary cases (e.g., a package
    updated while a service runs) should be allow-listed.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: Endpoint/osquery pseudocode
    query: "FOR each pid:\n  exe_target = readlink(/proc/[pid]/exe)\n  ALERT WHERE exe_target ENDSWITH\
      \ '(deleted)'\n     OR basename(exe_target) != displayed_process_name(pid)\n  EXCLUDE allowlist(service_updates)"
- question: Which executed binaries have extremely rare file-hash prevalence across the fleet (seen on
    <0.1% of endpoints or only once) AND are unsigned by a trusted publisher, especially when also bearing
    a daemon-like name, beaconing on the network, or writing to sensitive directories?
  context: Bespoke or freshly built argument-spoofing implants are rare by nature. Computing per-hash
    prevalence across the fleet over 30 days and flagging hashes seen on <0.1% of endpoints (cutoff derived
    from the observed hash-frequency distribution) that are also unsigned surfaces first-seen binaries.
    Correlating that rarity with masquerade context -- a daemon-style process name, outbound beaconing,
    or writes to sensitive paths -- separates benign rare admin tools from active stealth tooling (provenance-rarity
    weighting, ProvDetector). A high-rarity unsigned binary matching this context on a critical host is
    a strong lead for the Stealth hunt; common signed binaries are deprioritized.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prevalence[hash] = COUNT_DISTINCT(host) / total_hosts OVER last 30d\ncutoff = low_percentile(prevalence_distribution)\n\
      ALERT WHERE prevalence[hash] < max(0.001, cutoff) AND NOT signed_by_trusted(hash)\n  AND (daemon_like_name\
      \ OR network_beacon OR writes_sensitive_dir)"
- question: When a machine-learning classifier scores process-creation events for argument-spoofing likelihood,
    which processes rank highest, and what features (e.g., unsigned rare hash, unexpected parent, name
    != /proc/exe) drive each high score?
  context: A gradient-boosted or random-forest classifier trained on process-creation features -- binary
    hash prevalence, parent process name, user context, command-line length, and a name-vs-/proc/exe mismatch
    flag -- using labeled incident and known-good data can rank processes by their likelihood of masquerading
    via in-memory argument overwrite. Critically, the alert must emit the top-3 contributing features
    (e.g., 'unsigned rare hash; parent=nginx; name!=exe') so an analyst can triage the decision rather
    than chase an opaque score. High-ranked, well-explained processes on critical Linux hosts advance
    the Stealth investigation; the feature attribution lets the analyst quickly confirm or dismiss.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [hash_prevalence, parent_name, user_ctx, cmdline_len, name_exe_mismatch]

      model = GradientBoostedClassifier.fit(labeled_incident + known_good)

      score = model.predict_proba(features)

      ALERT WHERE score > threshold WITH top3 = explain(model, features)'
- question: Does the command line recorded at a process's creation differ from the command line read from
    /proc/[pid]/cmdline a short time later or on a periodic sweep?
  context: 'In-memory argv overwriting is most directly proven by capturing the command line at process
    creation (Sysmon for Linux EID 1) and then re-reading /proc/[pid]/cmdline after a 1-2 second delay
    and on a periodic sweep, then alerting when the two differ. This is the literal signature of the technique:
    the original arguments are erased and a spoofed argv[0] is written, so the values diverge. A divergence
    -- especially where the later value mimics a benign daemon -- is high-confidence evidence of masquerading
    for the Stealth hunt. Benign self-renaming software (some interpreters/servers set their own title)
    should be baselined and allow-listed to control false positives.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - ebpf:tracepoints
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: 'Last 90 days; event-centered: compare creation-time cmdline to reads at +1-2s and on each periodic
    sweep'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ON SysmonLinux_EID1(pid): store initial_cmdline[pid]\nAT +1-2s AND periodic_sweep: current\
      \ = read(/proc/[pid]/cmdline)\nALERT WHERE current != initial_cmdline[pid]\n  EXCLUDE allowlist(self_titling_processes)"
- question: Did any process invoke the syscall primitives used to overwrite its own argument/name memory
    -- prctl(PR_SET_NAME), process_vm_writev, ptrace, or writes to /proc/[pid]/mem -- shortly after execve?
  context: 'The argv overwrite must be performed by a concrete primitive: prctl(PR_SET_NAME), process_vm_writev,
    ptrace, or a direct write to /proc/[pid]/mem. Instrumenting these via eBPF (e.g., Tracee) or auditd
    and alerting when a process modifies its own argument/name memory region shortly after execve catches
    the act itself rather than its residue. This is a powerful Stealth-tactic detection because legitimate
    programs rarely rewrite their own argv memory immediately after launch. A positive result, correlated
    with a name/exe mismatch, is strong confirmation; note that some runtimes legitimately call prctl(PR_SET_NAME)
    for thread naming, so combine with other masquerade signals.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - ebpf:tracepoints
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: 'Last 90 days; event-centered: within seconds of execve'
  queries:
  - technology: eBPF/auditd pseudocode
    query: "TRACE syscalls: prctl(PR_SET_NAME), process_vm_writev, ptrace, write(/proc/self|[pid]/mem)\n\
      ALERT WHERE syscall_targets_own_argv_or_name_region\n  AND (now - execve_time[pid]) < few_seconds"
- question: Within what time window after process creation do in-memory argument modifications cluster,
    and which modifications fall inside that high-confidence attack window while also showing a name/exe
    mismatch?
  context: 'Computing the distribution of the create-to-modification time delta across all observed argument-modification
    events reveals an attack-window profile: argument-spoofing implants typically rewrite argv very shortly
    after launch, often tightly clustered (e.g., 95% within 500-1500ms post-creation). Modifications inside
    this window combined with a name/exe mismatch are high-severity, whereas benign late-lifecycle changes
    fall outside it. The window should be derived per environment from observed deltas. This statistical
    framing for the Stealth hunt lets an analyst prioritize the modifications most consistent with deliberate
    masquerading.'
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - ebpf:tracepoints
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'delta = modification_time - creation_time PER event

      window = percentile_band(delta_distribution, 2.5, 97.5)

      ALERT WHERE delta IN window AND name_exe_mismatch THEN severity=high'
- question: When modeling each process's startup as a sequence of syscalls/event keys, which processes
    contain out-of-vocabulary memory-modification steps (e.g., prctl(PR_SET_NAME) or process_vm_writev)
    that deviate from learned benign startup sequences?
  context: Benign daemons have characteristic, repeatable startup syscall sequences. Modeling per-process
    startup as a sequence of syscall/event keys (DeepLog-style) and flagging out-of-vocabulary memory-modification
    steps -- such as a prctl(PR_SET_NAME) or process_vm_writev inserted into an otherwise normal launch
    -- surfaces argv-overwrite behavior as a sequence anomaly. The detector should surface the offending
    step and the preceding context so the analyst can triage. For the Stealth hunt this catches novel
    implants that don't match a known hash but still perform the tell-tale memory write during startup;
    expected benign sequences keep noise low.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - osquery process table snapshots
  - auditd:SYSCALL
  - ebpf:tracepoints
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "seq = ordered_syscall_keys(process_startup)\nmodel = DeepLog.fit(benign_startup_sequences)\n\
      ALERT WHERE model.predict_next(seq) flags OOV memory_mod step\n  REPORT offending_step + preceding_context"
- question: Did a process bearing a commonly spoofed daemon name (such as rsyslogd, systemd-journald,
    dbus-daemon, or [kworker]) initiate a network connection to an IP on a command-and-control blocklist?
  context: BPFDoor and XorDdos masquerade under common daemon names while reaching out to attacker infrastructure.
    Joining process-creation events (Sysmon for Linux EID 1) with network-connection events (Zeek conn.log
    or Sysmon EID 3) by host and time, then alerting when a process named like a core daemon connects
    to a C2 blocklist IP, ties the masquerade to malicious egress. Kernel worker threads ([kworker]) never
    make network connections, so any such connection is itself anomalous. A positive result is a high-confidence
    Stealth/C2 finding warranting host isolation; absence of a blocklist hit does not exonerate, since
    fresh C2 IPs are common -- pair with the baselining questions below.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Sysmon for Linux Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., internet gateway), DNS resolvers, and critical Linux servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "j = JOIN proc(SysmonLinux_EID1) WITH net(Zeek_conn OR SysmonLinux_EID3) ON host, time_window\n\
      ALERT WHERE proc.name IN [rsyslogd, systemd-journald, dbus-daemon, '[kworker]', sshd, cron]\n  AND\
      \ net.dest_ip IN c2_blocklist"
- question: For each common daemon name, does any instance exceed its learned network baseline -- bytes
    out or connection rate above the 99th percentile, a destination port outside the learned set, or a
    destination country seen in fewer than 1% of that process's connections?
  context: Even without a blocklist hit, a masqueraded process betrays itself by deviating from the network
    profile of the daemon it impersonates. Per daemon name, build a baseline of volume (bytes_out), frequency
    (connections/min), the set of destination ports, geographic distribution, and destination entropy
    (H(X) = -sum P(x_i) log2 P(x_i)). Flag instances exceeding the 99th percentile of bytes or connection
    rate, using a port outside the learned set, or reaching a country present in <1% of that process's
    connections, with thresholds derived per environment. For the Stealth hunt this catches implants hiding
    under daemon names but communicating in ways the real daemon never would; a deviation on an egress
    point is a strong lead.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Sysmon for Linux Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., internet gateway), DNS resolvers, and critical Linux servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[name] = {bytes_out_p99, connrate_p99, port_set, geo_dist, dest_entropy}\nALERT WHERE\
      \ inst.bytes_out > baseline.bytes_out_p99\n  OR inst.connrate > baseline.connrate_p99\n  OR inst.dest_port\
      \ NOT IN baseline.port_set\n  OR geo_freq(inst.dest_country) < 0.01"
- question: Does any process running under a common daemon name show an elevated rate of failed/blocked
    egress, refused connections, or DNS NXDOMAIN responses versus its own baseline (e.g., greater than
    3 sigma)?
  context: Beaconing and C2 reconnaissance from a masqueraded process often produce a distinctive failure
    signature -- refused connections, blocked egress, and NXDOMAIN lookups -- as the implant probes for
    live infrastructure or rotates through dead domains. Tracking failed/blocked egress, refused connections,
    and NXDOMAIN rates per (process-name, host) and flagging a masqueraded process whose failure rate
    exceeds ~3 sigma above its baseline isolates this behavior, which is distinct from benign daemon traffic.
    For the Stealth hunt this is a complementary signal that works even when the eventual C2 destination
    is unknown; a spike on a DNS resolver or egress point merits deeper inspection of the process's connections.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Sysmon for Linux Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., internet gateway), DNS resolvers, and critical Linux servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fail[name,host] = rate(refused_conn + blocked_egress + dns_nxdomain)

      ALERT WHERE fail[name,host] > mean_baseline + 3*sigma_baseline'
- question: When time-series modeling is applied to a daemon-named process's outbound bytes and connection
    frequency, does any host exhibit periodic beaconing that diverges from the legitimate process's baseline?
  context: Periodic, low-and-slow beaconing is a hallmark of C2 from a masqueraded process. Applying time-series
    modeling (ARIMA or LSTM) to per-(process-name, host) bytes_out and connection frequency detects regular
    periodicity that diverges from the legitimate daemon's normal traffic shape. The alert should report
    the detected period and amplitude so the analyst can judge whether the cadence matches known beacon
    intervals. For the Stealth hunt this surfaces stealthy implants that stay under volume thresholds
    but reveal themselves through rhythmic communication; a confirmed beacon period on a critical host
    is strong evidence of active C2.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - Sysmon for Linux Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., internet gateway), DNS resolvers, and critical Linux servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ts = series(bytes_out, conn_freq) PER (process_name, host)

      model = ARIMA_or_LSTM.fit(legitimate_baseline)

      ALERT WHERE periodicity(ts) deviates_from baseline REPORT period, amplitude'
- question: Is any process with a common daemon name running with an invalid parent process or from a
    non-standard executable path -- for example [kworker] whose parent is not kthreadd, or sshd executing
    from somewhere other than /usr/sbin/sshd?
  context: A masquerade can rewrite the displayed argv but not the genuine parent-child lineage or the
    executable path recorded by the kernel. Maintaining allow-lists of the legitimate parent and executable
    path per critical daemon -- e.g., (name='[kworker]' AND parent!='kthreadd') or (name='sshd' AND exe_path
    NOT IN ('/usr/sbin/sshd')) -- and alerting on violations catches the invariants masquerading cannot
    rewrite. For the Stealth hunt, an [kworker] with a userland parent or an sshd running from /tmp is
    near-certain evidence of impersonation. These rules are high-fidelity once the per-environment allow-lists
    are tuned for legitimate alternate paths (e.g., containerized daemons).
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd:SYSCALL
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE (name='[kworker]' AND parent != 'kthreadd')\n  OR (name='sshd' AND exe_path NOT\
      \ IN allowlist['sshd'])\n  OR (name=daemon AND (parent NOT IN allowlist_parent[daemon]\n       OR\
      \ exe_path NOT IN allowlist_path[daemon]))"
- question: Which parent-child process pairs are statistically rare across the fleet (occurring fewer
    than ~5 times over 30 days), particularly rare lineages involving daemon-named children such as (parent=web-shell,
    child=sshd)?
  context: Beyond explicit allow-lists, computing the fleet-wide frequency of all parent-child pairs over
    30 days and flagging pairs that occur fewer than ~5 times (tuned to fleet size) surfaces anomalous
    lineage without needing to enumerate every legitimate combination. A rare pairing like (parent=web-shell,
    child=sshd) is a strong masquerade indicator for the Stealth hunt because legitimate daemons have
    stable, common parentage. A positive result points the analyst to processes whose ancestry contradicts
    their claimed identity; common pairs are deprioritized automatically by the frequency model.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd:SYSCALL
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq[(parent,child)] = COUNT OVER fleet last 30d

      ALERT WHERE freq[(parent,child)] < ~5  (tune to fleet size)'
- question: When process lineage is modeled as a provenance graph, which subgraphs show anomalous structure
    -- rare parentage or unexpected execution chains for a daemon name -- and what explainable attack
    subgraph can be reconstructed for triage?
  context: Graph-learning approaches (KAIROS, ThreaTrace, MAGIC, UNICORN) model process lineage as a provenance
    graph and flag subgraphs whose structure is anomalous -- rare parentage or execution chains that don't
    fit a daemon name -- then reconstruct an explainable attack subgraph. This captures multi-step masquerading
    context that pairwise rules miss, for example a web shell spawning an interpreter that then launches
    a process spoofed as a daemon. For the Stealth hunt the value is an explainable subgraph the analyst
    can walk from initial access through the masquerade, accelerating scoping; the structural anomaly
    score helps prioritize the most suspicious lineages.
  answer_sources:
  - Sysmon for Linux Event ID 1
  - auditd:SYSCALL
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = provenance_graph(process_lineage)\nmodel = GraphLearner.fit(benign_subgraphs)\nALERT WHERE\
      \ anomaly_score(subgraph) high\n  RECONSTRUCT explainable_attack_subgraph"
- question: Does any non-kernel process have a /proc/[pid]/cmdline that is empty or consists entirely
    of null bytes, while not being on an allow-list of processes legitimately permitted to have no command
    line?
  context: Argument erasure -- overwriting argv with null bytes -- is the first step of the technique,
    performed before a spoofed argv[0] is written; sometimes the spoof is never completed, leaving an
    empty or all-null command line. Periodically querying process tables (osquery processes) and alerting
    when cmdline is empty or all-null for any non-kernel process not on an allow-list catches this residue
    directly. For the Stealth hunt, an unexpected empty cmdline on a userland process is suspicious because
    most legitimate userland processes retain their arguments. Kernel threads legitimately have empty
    cmdline, so they (and any known benign exceptions) must be allow-listed to avoid noise.
  answer_sources:
  - osquery process table snapshots
  - Sysmon for Linux Event ID 1
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: Endpoint/osquery pseudocode
    query: "FOR each proc IN osquery_processes WHERE NOT is_kernel_thread(proc):\n  ALERT WHERE (cmdline\
      \ == '' OR all_null(cmdline)) AND proc NOT IN allowlist"
- question: For each process name, is any instance's command-line length below the learned 1st-percentile
    low-water mark, indicating possible truncation or erasure of its arguments?
  context: A masqueraded process often shows an abnormally short command line after its original arguments
    are erased. Establishing a command-line-length baseline per process name and computing the 1st-percentile
    low-water mark over 30 days, then flagging instances below it, surfaces truncation/erasure even when
    the cmdline isn't fully empty. Pairing this with a name/exe mismatch sharply reduces false positives.
    For the Stealth hunt this is a statistical complement to the empty-cmdline rule that catches partial
    erasure; a sub-baseline length on a process that also fails the name/exe invariant is a strong lead
    worth deeper memory inspection.
  answer_sources:
  - osquery process table snapshots
  - Sysmon for Linux Event ID 1
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'lowwater[name] = percentile(cmdline_len[name], 1) OVER 30d

      ALERT WHERE inst.cmdline_len < lowwater[inst.name] AND name_exe_mismatch'
- question: When clustering running processes on features like command-line length, name, executable path,
    and user context, which processes are outliers with abnormally short or empty command lines that separate
    from legitimate clusters?
  context: Unsupervised clustering (DBSCAN) of running processes on features including cmdline length,
    name, exe path, and user context groups normal processes together and isolates anomalies. Processes
    with abnormally short or empty command lines that fall outside legitimate clusters are flagged as
    outliers, and the detector reports the distinguishing features so the analyst understands why. For
    the Stealth hunt this catches argument erasure without predefined per-name baselines, adapting to
    whatever the environment looks like; an outlier with an empty cmdline plus an unusual path or user
    context is a prioritized lead for confirming masquerading.
  answer_sources:
  - osquery process table snapshots
  - Sysmon for Linux Event ID 1
  - EDR Telemetry
  - 'NAI: Critical Linux servers (e.g., web servers, database servers, authentication servers), container
    environments, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = [cmdline_len, name, exe_path, user_ctx] PER running_process\nclusters = DBSCAN.fit(features)\n\
      ALERT WHERE process is outlier AND cmdline short/empty\n  REPORT distinguishing_features"
