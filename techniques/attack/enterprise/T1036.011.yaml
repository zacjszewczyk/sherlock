name: 'T1036.011: Masquerading: Overwrite Process Arguments'
id: abcb0d5e-f489-4b3f-8899-de1a0e357696
description: 'Hunt for adversaries on Linux who overwrite a running process''s in-memory command-line
  arguments (argv[0] and the rest of argv) to masquerade as a legitimate or benign process, evading defenses
  by blending in with normal daemon activity (MITRE ATT&CK T1036.011, Stealth/Defense Evasion). Because
  Linux stores argv in user-space stack memory at launch and surfaces it through /proc/[pid]/cmdline,
  an unprivileged process can erase its original arguments with null bytes and write a spoofed command
  (e.g., ''cat resolv.conf'', ''[kworker]'', ''sshd'') that tools like ps then display. This playbook
  guides an analyst through: matching process binaries against IOC hashes for argument-spoofing malware
  (BPFDoor, XorDdos); flagging deleted-binary and name-versus-/proc/exe mismatches; detecting differences
  between the command line recorded at creation and the one read later from /proc/[pid]/cmdline; hooking
  the argv-overwrite primitives (prctl(PR_SET_NAME), process_vm_writev, ptrace, /proc/[pid]/mem); correlating
  daemon-named processes with C2 connections and anomalous network behavior; surfacing invalid process
  parentage or execution paths; and identifying empty, truncated, or null-byte command lines. For each
  lead it pairs symbolic-logic rules, statistical baselining, and machine-learning approaches across endpoint
  (Sysmon for Linux, auditd, eBPF, osquery, EDR) and network (Zeek) telemetry so a SOC analyst can confirm
  or refute in-memory argument masquerading on critical Linux servers, container environments, and developer
  workstations.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
