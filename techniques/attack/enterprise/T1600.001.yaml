questions:
- question: '[Defense Impairment] Network device hash watch: Can you determine whether a file transfer
    logged in Zeek files.log shows a destination IP address matching a managed network device asset, and
    the file''s MD5, SHA1, or SHA256 hash matches an entry in a threat intelligence feed of known malicious
    firmware. -- specifically, using the ''Network device hash watch'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary weakens the encryption
    on a compromised network device by reducing the cryptographic key size or downgrading the allowed
    cipher suites/protocol versions, dramatically reducing the effort required to decrypt intercepted
    communications without the key; this is typically delivered through a modified system image and specialized
    network-device CLI commands. This evidence focuses on the condition that a file transfer logged in
    Zeek files.log shows a destination IP address matching a managed network device asset, and the file''s
    MD5, SHA1, or SHA256 hash matches an entry in a threat intelligence feed of known malicious firmware.
    This Symbolic Logic approach works as follows: Alert when a Zeek files.log event has `id.resp_h` in
    the network-device asset inventory and the `md5`/`sha1`/`sha256` matches a known-malicious firmware
    hash from an integrated TI feed. Maintain a per-model known-GOOD hash allowlist and alert when an
    image transferred to a device matches NEITHER known-good nor any prior-seen image hash for that model,
    since key-space reduction is typically delivered via a modified system image (SYNful Knock, Mandiant;
    Costin et al.). Treat unsigned or signature-invalid images as high severity (NIST SP 800-193). A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable tampering aimed
    at weakening encryption on network infrastructure; pivot to the targeted network device and its asset
    record, the responsible administrative user or source host, the transferred image or executed CLI/config
    command, the change-management ticket (or lack of one), and the device''s negotiated-cipher and traffic
    profile before and after the change to scope the impact and confirm whether key space was actually
    reduced. A negative result helps rule out this particular weakened-encryption vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, out-of-band,
    or carefully staged modifications to a device''s crypto configuration.


    Citations: [SYNful Knock, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/);
    [Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf);
    [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).'
