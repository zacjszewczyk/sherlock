    as follows: Per device, build a 30-day rolling time series of counts per `cipher`/`version` (Volume)
    from ssl.log. Alert when the count of any weak cipher/version in a 1-hour window exceeds the 99th
    percentile of its history, or use a two-proportion/Chi-squared test to flag a significant rise in
