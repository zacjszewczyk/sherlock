name: 'T1600.001: Weaken Encryption: Reduce Key Space'
id: 2d3163e0-570d-4048-8503-d5ec4f5f1921
description: 'This playbook helps an analyst investigate whether an adversary has weakened the encryption
  protecting network communications by reducing cryptographic key space on a compromised network device
  (MITRE ATT&CK T1600.001, Weaken Encryption: Reduce Key Space). By shrinking key sizes (e.g., ''crypto
  key generate rsa modulus 512'') or downgrading allowed cipher suites and protocol versions -- often
  delivered via a modified system image or specialized Network Device CLI commands -- an adversary dramatically
  lowers the effort needed to decrypt intercepted traffic. The hunt centers on network infrastructure
  (core routers/switches, VPN concentrators, firewalls) and the administrative hosts that manage them,
  and pursues the behavior from several complementary angles: file transfers of suspicious or known-malicious
  firmware images to device assets (Zeek files.log/conn.log with hash, size, and entropy analysis); administrative
  command-line activity on jump boxes invoking management tools (plink/scp/tftp) with firmware or key-weakening
  tokens (Windows Event ID 4688); observed downgrades in negotiated cipher suites, TLS/SSH versions, key-exchange
  and MAC algorithms on the wire (Zeek ssl.log/ssh.log); correlated transfer-reboot-then-anomalous-traffic
  sequences indicative of image replacement; device communications that violate role-based protocol/peer
  baselines (Zeek conn.log/dns.log); and device configuration/CLI changes that directly reduce key size
  or enable weak ciphers (networkdevice:config and networkdevice:cli). Detection methods combine deterministic
  symbolic-logic rules (threat-intel hash watches, weak-cipher and key-size watchlists, command-line rules,
  stateful transfer-reboot sequences, protocol allowlists), statistical baselining (size/entropy outliers,
  command-line entropy, cipher-usage and handshake-failure profiling, config-diff invariant checks, rare-peer
  and connection-failure analysis), and machine learning (transfer classifiers, LSTM command-sequence
  autoencoders, per-device negotiation outlier models, multi-stage reboot/traffic anomaly pipelines, GNN
  topology models, and config-change classifiers), so the analyst can corroborate suspected key-space
  reduction against image provenance, administrative actions, on-wire crypto parameters, and device configuration
  state.'
type: technique
