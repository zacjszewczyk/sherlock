- question: '[Defense Impairment] Weak cipher and key-exchange watch: Can you determine whether analysis
    of Zeek ssl.log and ssh.log shows a statistically significant increase in connections to or from a
    managed network device that use deprecated protocols (`version` field), weak ciphers (`cipher` field),
    or weak SSH key exchange/MAC algorithms (`kex_alg`, `mac_alg` fields). -- specifically, using the
    ''Weak cipher and key-exchange watch'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary weakens the encryption
    on a compromised network device by reducing the cryptographic key size or downgrading the allowed
    cipher suites/protocol versions, dramatically reducing the effort required to decrypt intercepted
    communications without the key; this is typically delivered through a modified system image and specialized
    network-device CLI commands. This evidence focuses on the condition that analysis of Zeek ssl.log
    and ssh.log shows a statistically significant increase in connections to or from a managed network
    device that use deprecated protocols (`version` field), weak ciphers (`cipher` field), or weak SSH
    key exchange/MAC algorithms (`kex_alg`, `mac_alg` fields). This Symbolic Logic approach works as follows:
    High-severity alert when a Zeek ssl.log/ssh.log entry involving a managed network device contains
    a deprecated/weak value: `version` in {SSLv2, SSLv3, TLS 1.0, TLS 1.1}; `cipher` containing EXPORT/RC4/NULL/DES/3DES;
    small `curve`/DH group; SSH `kex_alg` = diffie-hellman-group1-sha1, `mac_alg` = hmac-md5*, or `cipher_alg`
    in {3des-cbc, arcfour, arcfour128}; or a changed SSH `host_key`. These are the exact weakened parameters
    exploited by export/downgrade attacks (Logjam; FREAK; DROWN) and map to disallowed strengths in NIST
    SP 800-57; fields per the Zeek SSL and Zeek SSH analyzers. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable tampering aimed at weakening encryption on network infrastructure;
    pivot to the targeted network device and its asset record, the responsible administrative user or
    source host, the transferred image or executed CLI/config command, the change-management ticket (or
    lack of one), and the device''s negotiated-cipher and traffic profile before and after the change
    to scope the impact and confirm whether key space was actually reduced. A negative result helps rule
    out this particular weakened-encryption vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, out-of-band, or carefully staged modifications
    to a device''s crypto configuration.


    Citations: [Logjam](https://weakdh.org/imperfect-forward-secrecy-ccs15.pdf); [FREAK](https://www.ieee-security.org/TC/SP2015/papers-archived/6949a535.pdf);
    [DROWN](https://drownattack.com/drown-attack-paper.pdf); [NIST SP 800-57](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf);
    [Zeek SSL](https://docs.zeek.org/en/master/scripts/base/protocols/ssl/main.zeek.html); [Zeek SSH](https://docs.zeek.org/en/master/scripts/base/protocols/ssh/main.zeek.html).'
