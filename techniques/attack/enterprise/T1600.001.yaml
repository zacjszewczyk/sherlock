- question: '[Defense Impairment] File transfer size and entropy outlier: Can you determine whether a
    file transfer logged in Zeek files.log shows a destination IP address matching a managed network device
    asset, and the file''s MD5, SHA1, or SHA256 hash matches an entry in a threat intelligence feed of
    known malicious firmware. -- specifically, using the ''File transfer size and entropy outlier'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary weakens the encryption
    on a compromised network device by reducing the cryptographic key size or downgrading the allowed
    cipher suites/protocol versions, dramatically reducing the effort required to decrypt intercepted
    communications without the key; this is typically delivered through a modified system image and specialized
    network-device CLI commands. This evidence focuses on the condition that a file transfer logged in
    Zeek files.log shows a destination IP address matching a managed network device asset, and the file''s
    MD5, SHA1, or SHA256 hash matches an entry in a threat intelligence feed of known malicious firmware.
    This Statistical Method approach works as follows: For file transfers to network devices, keep a 30-day
    rolling baseline of file `size` and `mime_type` (files.log). Alert when size exceeds the 95th percentile
    or `mime_type` is first-seen in 30 days. Where payload bytes are available, compute Shannon entropy:
    code/firmware sections typically <6.5 bits/byte while encrypted/packed blobs run >7.0; flag images
    whose entropy profile deviates from the known-good baseline for that model (Costin et al.). Correlate
    every alert with authorized change-management tickets (State). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable tampering aimed at weakening encryption
    on network infrastructure; pivot to the targeted network device and its asset record, the responsible
    administrative user or source host, the transferred image or executed CLI/config command, the change-management
    ticket (or lack of one), and the device''s negotiated-cipher and traffic profile before and after
    the change to scope the impact and confirm whether key space was actually reduced. A negative result
    helps rule out this particular weakened-encryption vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, out-of-band, or carefully staged
    modifications to a device''s crypto configuration.


    Citations: [Costin et al.](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-costin.pdf).'
