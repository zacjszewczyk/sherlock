questions:
- question: Did any process execute the 'mount' utility with bind or remap flags (--bind, --rbind, -o
    bind, --move, or -B), and did the source or destination path reference the /proc filesystem?
  context: This question supports the Stealth tactic by hunting the core hiding primitive of T1564.013.
    Bind-overlaying a benign /proc/<pid> directory onto a malicious process's /proc/<pid> directory is
    how adversaries deceive ps, top, and other user-space tools into displaying benign metadata. Generate
    a high-priority alert on any 'mount' process creation whose command line contains a bind/remap token,
    and escalate to critical when '/proc/' appears in the source or destination. A positive result on
    a production host is high fidelity because legitimate /proc bind mounts are rare outside container
    runtime startup. Confirm by inspecting the parent process, user/UID, and full command line; legitimate
    container init may explain some bind mounts but /proc/<pid> targets warrant investigation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon for Linux Event ID 1
  - auditd SYSCALL/PATH
  - eBPF (Tracee/Falco) mount & security_sb_mount hook
  - 'NAI: Critical Linux servers, container host nodes (Kubernetes, Docker), and developer workstations
    using Windows Subsystem for Linux (WSL).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      rule mount_bind_exec:
        on process_create where image endswith '/mount'
        if cmdline matches /(--bind|--rbind|-o\s+bind|--move|-B)/ -> alert(HIGH)
        if cmdline contains '/proc/' -> escalate(CRITICAL)
- question: Where command-line auditing is insufficient or evadable, do kernel-level traces of the mount(2)/setns(2)
    syscalls or the security_sb_mount LSM hook show bind-flag mounts targeting /proc, especially on container
    host nodes?
  context: Supporting Stealth, this question hardens detection against attackers who evade process-creation
    logging. Hooking mount(2)/setns(2) and the security_sb_mount LSM hook with eBPF (Tracee/Falco) captures
    the operation at the kernel boundary with container-aware metadata, so a bind mount onto /proc is
    visible even if the 'mount' binary is renamed or the call is made via a library. Falco's sensitive-mount
    and namespace-change rules and Tracee provide reference implementations. Prioritize Docker/Kubernetes
    host nodes, the primary abuse environment. A match indicates an in-kernel bind/remap of /proc and
    should be treated as critical; absence of matches on monitored hosts increases confidence the primitive
    was not used there.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon for Linux Event ID 1
  - auditd SYSCALL/PATH
  - eBPF (Tracee/Falco) mount & security_sb_mount hook
  - 'NAI: Critical Linux servers, container host nodes (Kubernetes, Docker), and developer workstations
    using Windows Subsystem for Linux (WSL).'
  range: Last 90 days
  queries:
  - technology: eBPF/Falco pseudocode
    query: >-
      trace syscall in (mount, setns) OR lsm_hook == security_sb_mount
        where flags has MS_BIND and target startswith '/proc'
        enrich container_id, image -> alert(CRITICAL, prioritize=container_hosts)
- question: Per host and user, do daily 'mount' execution counts, /proc-targeted mount counts, or FAILED/EPERM
    mount attempt counts exceed a statistical control limit derived from a 30-day baseline?
  context: This statistical approach supports Stealth by surfacing anomalous mount activity that individual
    rules may miss. Baseline each host's 'mount' executions per user over 30 days, compute the 99th percentile
    of daily frequency, and apply a Statistical Process Control C-chart (mean + 3sigma) to daily counts.
    Track /proc-targeted mounts and FAILED/EPERM mount attempts as distinct Volume/Frequency/State features,
    since both are rare on production hosts and EPERM denials suggest an attacker probing for sufficient
    privilege. Alert when any signal exceeds its threshold. A breach of the upper control limit is a strong
    lead even without a single obviously malicious event, because it reflects a deviation from the host's
    established behavior.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon for Linux Event ID 1
  - auditd SYSCALL/PATH
  - eBPF (Tracee/Falco) mount & security_sb_mount hook
  - 'NAI: Critical Linux servers, container host nodes (Kubernetes, Docker), and developer workstations
    using Windows Subsystem for Linux (WSL).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per host,user: daily_mount = count(mount_exec) by day
        ucl = mean(30d) + 3*stddev(30d)   // C-chart
        proc_mounts = count(target startswith '/proc')
        failed = count(result in (EPERM,FAIL))
        alert if daily_mount > ucl OR proc_mounts > 0 OR failed > ucl
- question: When each 'mount' event is scored by an Isolation Forest or logistic-regression model over
    features such as parent process, user/UID, bind-flag presence, /proc target, container context, and
    hour-of-day, which events are anomalous, and what top-3 features drive each alert?
  context: This machine-learning method supports Stealth by ranking mount events by anomaly rather than
    relying solely on fixed rules. Features include parent process (bash/sshd/dockerd), user/UID (root,
    www-data), bind-flag presence, target-path-is-/proc, container context, and hour-of-day. For explainability,
    every alert must surface the top-3 contributing features (e.g., 'target=/proc, parent=dockerd, UID=root').
    Complement with syscall-sequence anomaly models that learn each program's normal mount/namespace behavior
    and flag divergence. A high anomaly score with /proc target and root UID is a strong indicator; the
    explainability output lets the analyst quickly validate or dismiss the alert.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon for Linux Event ID 1
  - auditd SYSCALL/PATH
  - eBPF (Tracee/Falco) mount & security_sb_mount hook
  - 'NAI: Critical Linux servers, container host nodes (Kubernetes, Docker), and developer workstations
    using Windows Subsystem for Linux (WSL).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [parent_proc, uid, bind_flag, target_is_proc, container_ctx, hour]
        score = IsolationForest.decision(features)
        if score < threshold -> alert(top3_features(features))
- question: Does a periodic comparison of a kernel-aware/eBPF process listing against a 'ls /proc' directory
    listing (and against directory hard-link counts) reveal any disagreement indicating a hidden process?
  context: 'This cross-view reconciliation supports Stealth by detecting concealment directly rather than
    the act of mounting. The ''ask the same question multiple ways'' principle compares independent views:
    a kernel/eBPF process listing versus a user-space ''/proc'' directory listing, and directory st_nlink
    versus visible-entry counts. ANY disagreement is critical because a process visible to the kernel
    but absent from user-space tools, or a link-count mismatch, is high-fidelity evidence of hiding by
    construction. A negative result across views increases confidence that no process is being masked
    on that host at the time of the check.'
  answer_sources:
  - EDR kernel-level process listings
  - Osquery ('processes' table)
  - /proc/self/mountinfo
  - Custom audit script comparing kernel-truth vs 'ls /proc'
  - 'NAI: High-value Linux servers, bastion hosts, servers hosting sensitive data, and containerized environments.'
  range: Last 90 days
  queries:
  - technology: Osquery/pseudocode
    query: >-
      kproc = ebpf_process_list()
        uproc = list_dir('/proc' where name is numeric)
        if set(kproc) != set(uproc) -> alert(CRITICAL)
        if dir.st_nlink != count(visible_entries) -> alert(CRITICAL)
- question: When parsing /proc/self/mountinfo, is any /proc/<pid> path itself a mount point, and are the
    overlaid /proc/<pid>/exe, cmdline, and cgroup internally consistent?
  context: Supporting Stealth, this invariant check exploits the fact that the kernel still exposes the
    bind overlay in /proc/self/mountinfo even when ps and top are deceived. Alert whenever any '/proc/<pid>'
    path appears as a mount target. Then cross-check that the overlaid /proc/<pid>/exe, cmdline, and cgroup
    are internally consistent; a mismatch (e.g., exe points to a different binary than cmdline implies,
    or cgroup does not match the claimed process) indicates masking. This is a deterministic, low-false-positive
    signal and is one of the most reliable ways to confirm bind-mount-based process hiding.
  answer_sources:
  - EDR kernel-level process listings
  - Osquery ('processes' table)
  - /proc/self/mountinfo
  - Custom audit script comparing kernel-truth vs 'ls /proc'
  - 'NAI: High-value Linux servers, bastion hosts, servers hosting sensitive data, and containerized environments.'
  range: Last 90 days
  queries:
  - technology: Linux/pseudocode
    query: >-
      for line in read('/proc/self/mountinfo'):
        if line.mount_point matches '/proc/[0-9]+' -> alert(CRITICAL)
          if inconsistent(exe, cmdline, cgroup of pid) -> flag(MASKING)
- question: Per host, does the count of mismatched PIDs (kernel-visible minus user-space-visible) over
    time exceed the upper control limit of an SPC C-chart?
  context: This statistical method supports Stealth by treating the reconciliation-mismatch count as a
    State signal tracked over time. Apply an SPC C-chart (mean + 3sigma) to the per-host count of PIDs
    visible to the kernel but not to user-space enumeration, and trigger when the count exceeds the upper
    control limit. Because a healthy host should consistently show zero mismatches, a nonzero value is
    high-fidelity by construction, and the control chart helps distinguish transient race conditions from
    a sustained hidden-process condition.
  answer_sources:
  - EDR kernel-level process listings
  - Osquery ('processes' table)
  - /proc/self/mountinfo
  - Custom audit script comparing kernel-truth vs 'ls /proc'
  - 'NAI: High-value Linux servers, bastion hosts, servers hosting sensitive data, and containerized environments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      per host: mismatch = count(kernel_pids) - count(userspace_pids)
        ucl = mean(mismatch) + 3*stddev(mismatch)   // C-chart
        alert if mismatch > ucl OR mismatch > 0
- question: When an unsupervised autoencoder scores process-table state vectors (total process count,
    per-user distribution, count of /proc mount points, reconciliation-mismatch count), which hosts show
    high reconstruction error, and what features drive it?
  context: This machine-learning method supports Stealth by modeling the holistic state of the process
    table and flagging deviations. Train an autoencoder on state vectors including total process count,
    per-user process distribution, count of /proc mount points, and reconciliation-mismatch count; high
    reconstruction error flags deviation, and the alert should report the top-3 features driving the error.
    For full-context detection, model host activity as a whole-system provenance graph and flag anomalous
    mount/proc nodes with node-level or graph autoencoders. A spike in reconstruction error driven by
    /proc mount-point or mismatch features points the analyst directly at concealment activity.
  answer_sources:
  - EDR kernel-level process listings
  - Osquery ('processes' table)
  - /proc/self/mountinfo
  - Custom audit script comparing kernel-truth vs 'ls /proc'
  - 'NAI: High-value Linux servers, bastion hosts, servers hosting sensitive data, and containerized environments.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: >-
      vec = [proc_count, per_user_dist, proc_mountpoints, mismatch_count]
        err = autoencoder.reconstruction_error(vec)
        if err > threshold -> alert(top3_features(vec))
- question: After a 'mount --bind' (or /proc mountpoint) event on a host, does that host's Zeek conn.log/dns.log
    within the next 60 minutes show connections to known threat-intel C2 indicators?
  context: This correlation supports Stealth by chaining the concealment primitive to malicious outcomes.
    A SIEM correlation rule fires when a bind-mount or /proc mountpoint event is observed, then searches
    the next 60 minutes of that host's Zeek conn.log and dns.log for connections to threat-intel C2 indicators,
    generating a critical alert on match. Cryptominers that use bind mounts to hide their miner process
    still must reach their pool/C2 infrastructure, so a match strongly links concealment to active malicious
    operation. A match elevates the host to immediate response; no match still leaves the bind-mount finding
    to be triaged on its own.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, critical Linux servers, and developer workstations.'
  range: Last 90 days; correlate network activity within a 60-minute window after each bind-mount event
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      on bind_mount_event(host, t0):
        hits = search(zeek.conn|zeek.dns where host==host and ts in [t0, t0+60m]
          and dest in threat_intel.c2)
        if hits -> alert(CRITICAL)
- question: In the 60-minute window after a bind-mount event, do any repeating outbound destinations show
    low inter-arrival time standard deviation (e.g., < 2s) or a suspicious bytes-out/connection ratio,
    and what are the failed-connection and NXDOMAIN rates?
  context: This statistical method supports Stealth by characterizing beaconing that follows concealment.
    For each repeating destination in the host's 60-minute conn.log window, compute the standard deviation
    of inter-arrival times and the bytes-out/connection ratio; a very low std-dev indicates automated,
    machine-driven beaconing rather than human activity. Also profile the FAILED/blocked connection count
    and NXDOMAIN rate over the same window as distinct failure-mode signals, since dead or rotating C2
    produces failed resolutions. Regular timing plus a hidden process is a strong indicator of an active
    implant beaconing out.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, critical Linux servers, and developer workstations.'
  range: Last 90 days; analyze the 60-minute window after each bind-mount event
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      on bind_mount_event(host, t0):
        for dest in repeating(conn.log[host, t0..t0+60m]):
          iat_std = stddev(inter_arrival_times(dest))
          if iat_std < 2s -> alert(BEACON)
        track failed_conn_count, nxdomain_rate
- question: After a bind-mount event, does an LSTM autoencoder over the host's per-host network time series
    (bytes_out, duration, packets_out) show a significant spike in anomaly score, and what flow features
    drive it?
  context: This machine-learning method supports Stealth by detecting anomalous network behavior emanating
    from a host that just performed concealment. Deploy an LSTM autoencoder on per-host network time series
    from conn.log (bytes_out, duration, packets_out); after a bind-mount event, alert on a significant
    spike in that host's anomaly score, which indicates the concealed process is initiating anomalous
    traffic. Surface the top-3 contributing flow features in the alert. Provenance-graph models can causally
    link the mount node to the subsequent anomalous network nodes, strengthening the case that the concealed
    process is responsible.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS resolvers, critical Linux servers, and developer workstations.'
  range: Last 90 days; score the network time series following each bind-mount event
  queries:
  - technology: ML/pseudocode
    query: >-
      on bind_mount_event(host, t0):
        ts = series(bytes_out, duration, packets_out)[host, after t0]
        score = lstm_autoencoder.anomaly(ts)
        if score >> baseline -> alert(top3_flow_features)
- question: For any host on a 'suspected bind-mount activity' watchlist, do its outbound DNS queries (Zeek
    dns.log) match threat-intel malicious-domain feeds?
  context: This supports Stealth by maintaining pressure on hosts already implicated by deterministic
    mount or cross-view detections. Build the watchlist from the mount-execution and reconciliation detections
    above, then join each watchlisted host's outbound DNS queries against threat-intel malicious-domain
    feeds and alert critically on match. Because the population is pre-filtered to suspicious hosts, even
    a single IOC match is highly significant and likely indicates the concealed process is resolving its
    C2 domain. A match confirms malicious intent and should trigger containment of the host.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network traffic logs at the internet gateway, internal network segments, and from corporate
    DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      for host in watchlist:
        for q in zeek.dns[host].query:
          if q in threat_intel.malicious_domains -> alert(CRITICAL)
- question: For watchlisted hosts, which requested domains fall in the 99.9th rarity percentile of enterprise-wide
    30-day query frequency, and what is the per-host NXDOMAIN/failed-resolution rate?
  context: This statistical method supports Stealth by surfacing rare destinations from suspect hosts
    without relying on known IOCs. Compute a rarity score per requested domain from enterprise-wide 30-day
    query frequency and alert when a watchlisted host queries domains in the 99.9th rarity percentile
    (almost never seen across the enterprise). Track the per-host NXDOMAIN/failed-resolution rate as a
    distinct failure-mode signal indicative of DGA or dead-C2 behavior. A watchlisted host suddenly resolving
    extremely rare domains, especially with elevated NXDOMAIN, is a strong lead toward concealed C2 communication.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network traffic logs at the internet gateway, internal network segments, and from corporate
    DNS servers.'
  range: Last 90 days; rarity baselined over 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      rarity(domain) = 1 - freq_30d(domain)/total_queries
        for host in watchlist:
          if rarity(queried_domain) >= p99.9 -> alert
        track nxdomain_rate per host
- question: Using a 'new destination' detector (DBSCAN or Isolation Forest) over each host's historical
    destination ASNs/countries, do watchlisted hosts initiate connections that fall outside established
    clusters, and what features distinguish them?
  context: This machine-learning method supports Stealth by detecting novel network topology from suspect
    hosts. Build a per-host model of historical destination ASNs and countries from conn.log using DBSCAN
    or Isolation Forest, then flag connections from watchlisted hosts that fall outside established clusters,
    reporting the top-3 distinguishing features. On container hosts, complement with Bag-of-System-Calls
    frequency anomaly detection to catch the syscall burst that accompanies mount/namespace abuse. A connection
    to a previously unseen ASN or country from a watchlisted host points toward newly established C2 or
    exfiltration infrastructure.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network traffic logs at the internet gateway, internal network segments, and from corporate
    DNS servers.'
  range: Last 90 days; destination clusters baselined over historical traffic
  queries:
  - technology: ML/pseudocode
    query: >-
      model = DBSCAN(host.history(dest_asn, dest_country))
        for c in conn.log[watchlist_host]:
          if cluster(c) == NOISE -> alert(top3_features(c))
        // container hosts: add Bag-of-System-Calls freq anomaly
