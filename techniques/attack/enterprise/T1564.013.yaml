name: 'T1564.013: Hide Artifacts: Bind Mounts'
id: 198080ab-eb18-46f9-9ca0-3b5414b28926
description: >-
  Investigate adversary abuse of Linux bind mounts to hide processes, files, and artifacts from native
  inspection utilities such as ps, top, and ls. Attackers with sudo access can run 'mount -o bind' (or
  -B) to overlay a benign /proc/<pid> directory onto a malicious process's /proc/<pid> directory, causing
  user-space tools that follow the bind to report the benign process's metadata instead of the attacker's
  real process. This playbook helps an analyst hunt for the core hiding primitive (bind/remap mount operations,
  especially targeting /proc), detect the resulting concealment via cross-view reconciliation between
  kernel-truth and user-space process listings, parse /proc/self/mountinfo for /proc mount points, and
  chain confirmed bind-mount activity to follow-on command-and-control beaconing and rare outbound network
  destinations. It covers symbolic-logic detection rules, statistical baselining/control charts, and machine-learning
  anomaly models across endpoint (auditd, eBPF, osquery, EDR) and network (Zeek) telemetry, prioritizing
  critical Linux servers, container host nodes (Docker/Kubernetes), bastion hosts, and WSL developer workstations.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
