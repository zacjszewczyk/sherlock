    connection to a known text storage site within a short time window (e.g., under 5 minutes). -- specifically,
    using the ''Configure SACLs on critical file shares to generate Windows Event ID 4663 on access, and
    enable Sysmon file creation logging (Event ID 11)'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network by uploading it to a public or private text storage (paste) site rather than over their primary
    command-and-control channel, blending the transfer into normal-looking web traffic and potentially
    using site encryption or paid features to conceal the content. This evidence focuses on the condition
    that a timed sequence of events on a single host where a process first accesses a file on a designated
    sensitive network share or local directory, and then the same process or its child initiates an outbound
    network connection to a known text storage site within a short time window (e.g., under 5 minutes).
    This Symbolic Logic approach works as follows: Configure SACLs on critical shares to emit Windows
    Event ID 4663 and enable Sysmon file-creation logging (Event ID 11). Trigger a SIEM correlation when
    a `ProcessGuid` from Sysmon EID 1 is associated with a 4663/EID 11 on a sensitive file and is followed
    within 5 minutes by a Sysmon EID 3 network connection from the same `ProcessGuid` to a text storage
    destination (MITRE T1567.003, Zeek ssl.log). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable exfiltration to a text storage site; pivot to the responsible
    process and its parent lineage, the user, host, and any sensitive files read beforehand, the destination
    paste-site domain and TLS fingerprint, and the byte volume and timing of the upload to scope what
    data may have left. A negative result helps rule out this particular exfiltration vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    living-off-the-land, low-and-slow, or CDN-fronted uploads.'
