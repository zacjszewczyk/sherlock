questions:
- question: '[Exfiltration] Maintain a threat intelligence list of known text storage site hostnames,
    IPs, and SSL certificate subjects: Can you determine whether an outbound HTTP POST request is made
    to a known text storage site, or a TLS connection is established where the Server Name Indication
    (SNI) in the client hello matches a known text storage site domain. The connection involves a data
    upload. -- specifically, using the ''Maintain a threat intelligence list of known text storage site
    hostnames, IPs, and SSL certificate subjects'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary steals data from the
    network by uploading it to a public or private text storage (paste) site rather than over their primary
    command-and-control channel, blending the transfer into normal-looking web traffic and potentially
    using site encryption or paid features to conceal the content. This evidence focuses on the condition
    that an outbound HTTP POST request is made to a known text storage site, or a TLS connection is established
    where the Server Name Indication (SNI) in the client hello matches a known text storage site domain.
    The connection involves a data upload. This Symbolic Logic approach works as follows: Maintain a curated
    watchlist of text storage site hostnames, IPs, and SSL certificate subjects (pastebin.com, hastebin.com,
    ghostbin, privatebin, paste.ee, controlc.com, dpaste, 0bin, termbin, etc.). Alert on any connection
    where `id.resp_h` (Zeek conn.log), `host` (Zeek http.log), or `server_name`/SNI (Zeek ssl.log) matches
    the list, especially where http.log `method` is ''POST'' or ''PUT'' and `request_body_len` is non-trivial
    (MITRE T1567.003, Zeek ssl.log). Deploy maintained Sigma rules for these endpoints as the deterministic
    floor (SigmaHQ). A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable exfiltration to a text storage site; pivot to the responsible process and its parent lineage,
    the user, host, and any sensitive files read beforehand, the destination paste-site domain and TLS
    fingerprint, and the byte volume and timing of the upload to scope what data may have left. A negative
    result helps rule out this particular exfiltration vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, living-off-the-land, low-and-slow,
    or CDN-fronted uploads.'
