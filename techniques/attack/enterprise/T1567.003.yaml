name: 'T1567.003: Exfiltration to Text Storage Sites'
id: 3ecb877e-b51d-433f-a798-fb7295a3025e
description: 'This playbook helps an analyst investigate whether an adversary has exfiltrated collected
  data by uploading it to public or private text storage (paste) sites such as pastebin.com, hastebin.com,
  ghostbin, privatebin, paste.ee, controlc.com, dpaste, 0bin, or termbin, instead of using their primary
  command-and-control channel (MITRE ATT&CK T1567.003, Exfiltration to Text Storage Sites). Such sites
  are normal developer tools, which lets adversaries blend exfiltration into otherwise routine web traffic
  and, with paid or encryption features, conceal what they upload. The hunt spans Windows, Linux, macOS,
  and ESXi endpoints plus network egress telemetry, and pursues the behavior from several complementary
  angles: outbound HTTP POST/PUT or TLS (SNI-matched) connections to watchlisted text-storage domains
  that carry an upload payload; command-line and PowerShell script-block invocations of upload-capable
  tools (curl, wget, Invoke-RestMethod/Invoke-WebRequest, osascript) carrying data-upload flags and a
  paste-site URL; per-host volume, frequency, and cadence baselines that surface anomalously large or
  automated low-and-slow uploads; non-browser processes initiating connections to paste sites; and timed
  sequences where a process reads sensitive files or shares and then uploads to a text-storage site within
  minutes. Detection methods combine deterministic symbolic-logic rules (threat-intel watchlists, JA3/JA4
  TLS fingerprinting, LOLBin command-line regex, SACL-audited file access correlation), statistical baselining
  (bytes-out percentiles/IQR, request success-failure profiling, conditional-probability sequence scoring,
  FFT cadence analysis, entropy of command lines), and machine learning (random forest/XGBoost classifiers,
  Isolation Forest/One-Class SVM egress and command-line outlier scoring, process-lineage scoring, and
  ARIMA/STL/Prophet time-series anomaly detection), applied across Zeek conn/http/ssl logs, Windows Security
  and Sysmon events, PowerShell script-block logs, and auditd, so the analyst can corroborate suspected
  paste-site exfiltration against process lineage, file access, network fingerprints, and upload volume.'
