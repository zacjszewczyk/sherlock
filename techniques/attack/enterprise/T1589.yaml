    information (usernames, emails, credentials, MFA configuration) to plan phishing, credential stuffing,
    or valid-account access before attempting initial access. This evidence focuses on the condition that
    a single source IP generates a high volume of failed authentication events with an error code indicating
    the username does not exist, indicating a systematic attempt to validate a list of potential usernames
    (Username Enumeration). The ''Threshold enumeration failures'' approach (Symbolic Logic) works as
    follows: Alert when a single IP generates >20 ''username does not exist'' failures (Win EID 4625 status
    0xC0000064, Entra 50053) in 10 minutes. Username enumeration is exposed by valid-vs-invalid response/timing/status
    differentials, so also alert on systematic probing that distinguishes existing from non-existing accounts
    at login/registration/reset endpoints per [Testing for Account Enumeration, OWASP WSTG](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/03-Identity_Management_Testing/04-Testing_for_Account_Enumeration_and_Guessable_User_Account).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong signal of active
    identity reconnaissance; pivot to the source IP/ASN and its reputation, the targeted accounts and
    endpoints, the success/failure state of each attempt, the user-agent and timing cadence, and any subsequent
    successful authentication or follow-on phishing so you can scope which identities were exposed and
    pre-position resets, MFA enforcement, and source blocks. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss distributed, low-and-slow, or proxy-fronted reconnaissance.'
  answer_sources:
  - Windows Event ID 4625
  - Microsoft Entra ID Sign-in logs (Error code 50053, 50126)
  - Okta System Log (event `user.session.start` with reason `INVALID_CREDENTIALS`)
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS), RADIUS servers, Cloud Identity
    Provider logs'
  range: Last 90 days (pivot to event-centered +/- 24h windows on match)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from (win4625 status==0xC0000064) or (entra error in (50053)) or (okta user.session.start
      reason==INVALID_CREDENTIALS)

      by src_ip bin 10m

      if count(nxuser_failures)>20: alert "username enumeration"

      also alert on valid-vs-invalid response/status/timing differential at login/register/reset endpoints'
- question: '[Reconnaissance] Failure-mode code profiling: Can you determine whether a single source IP
    generates a high volume of failed authentication events with an error code indicating the username
    does not exist, indicating a systematic attempt to validate a list of potential usernames (Username
    Enumeration). Specifically, apply the ''Failure-mode code profiling'' (Statistical Method) approach:
    Profile per-source the distribution of failure reason codes and flag a high ratio of ''no such user''
    (NXUSER: 4625 0xC0000064, Entra 50034) relative to ''bad password'' (0xC000006A, Entra 50126); a dominance
    of NXUSER over a 15-minute window is the signature of enumeration rather than password guessing per
    [Password Spray Attacks, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
