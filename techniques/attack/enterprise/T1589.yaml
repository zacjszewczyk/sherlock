- question: '[Reconnaissance] Threshold enumeration failures: Can you determine whether a single source
    IP generates a high volume of failed authentication events with an error code indicating the username
    does not exist, indicating a systematic attempt to validate a list of potential usernames (Username
    Enumeration). Specifically, apply the ''Threshold enumeration failures'' (Symbolic Logic) approach:
    Alert when a single IP generates >20 ''username does not exist'' failures (Win EID 4625 status 0xC0000064,
    Entra 50053) in 10 minutes. Username enumeration is exposed by valid-vs-invalid response/timing/status
    differentials, so also alert on systematic probing that distinguishes existing from non-existing accounts
    at login/registration/reset endpoints per [Testing for Account Enumeration, OWASP WSTG](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/03-Identity_Management_Testing/04-Testing_for_Account_Enumeration_and_Guessable_User_Account).'
