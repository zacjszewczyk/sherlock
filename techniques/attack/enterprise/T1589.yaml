    50126); a dominance of NXUSER over a 15-minute window is the signature of enumeration rather than
    password guessing per [Password Spray Attacks, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong signal of active
    identity reconnaissance; pivot to the source IP/ASN and its reputation, the targeted accounts and
    endpoints, the success/failure state of each attempt, the user-agent and timing cadence, and any subsequent
    successful authentication or follow-on phishing so you can scope which identities were exposed and
    pre-position resets, MFA enforcement, and source blocks. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss distributed, low-and-slow, or proxy-fronted reconnaissance.'
  answer_sources:
  - Windows Event ID 4625
  - Microsoft Entra ID Sign-in logs (Error code 50053, 50126)
  - Okta System Log (event `user.session.start` with reason `INVALID_CREDENTIALS`)
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS), RADIUS servers, Cloud Identity
    Provider logs'
  range: Last 90 days (rolling baseline; evaluate in 10-60 minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from auth_failures bin 15m by src_ip

      nxuser = countif(code in (0xC0000064, 50034))  // no such user

      badpw  = countif(code in (0xC000006A, 50126))  // bad password

      ratio = nxuser/(nxuser+badpw)

      alert if ratio dominant (e.g. >0.8) -> enumeration signature, not password guessing'
- question: '[Reconnaissance] High username entropy: Can you determine whether a single source IP generates
    a high volume of failed authentication events with an error code indicating the username does not
    exist, indicating a systematic attempt to validate a list of potential usernames (Username Enumeration).
    Specifically, apply the ''High username entropy'' (Statistical Method) approach: Flag IPs whose attempted
    usernames show entropy above the 98th percentile over a 15-minute window, indicating dictionary/automated
