questions:
- question: '[Reconnaissance] Compare source IPs to TI: Can you determine whether an authentication attempt
    or web request originates from a source IP address listed on a high-confidence threat intelligence
    feed as a known scanner, open proxy, or TOR exit node. Specifically, apply the ''Compare source IPs
    to TI'' (Symbolic Logic) approach: Alert when inbound connection or authentication logs show source
    IPs on high-confidence scanner/proxy/TOR-exit threat feeds, and maintain a watchlist of known automated-validation
    infrastructure (e.g., default-credential scanners that brute-force dictionaries over Telnet/SSH/HTTP)
    per [Understanding the Mirai Botnet, Antonakakis et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).
    Include the matched feed name and category in the alert text.'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers victim identity
    information (usernames, emails, credentials, MFA configuration) to plan phishing, credential stuffing,
    or valid-account access before attempting initial access. This evidence focuses on the condition that
    an authentication attempt or web request originates from a source IP address listed on a high-confidence
    threat intelligence feed as a known scanner, open proxy, or TOR exit node. The ''Compare source IPs
    to TI'' approach (Symbolic Logic) works as follows: Alert when inbound connection or authentication
    logs show source IPs on high-confidence scanner/proxy/TOR-exit threat feeds, and maintain a watchlist
    of known automated-validation infrastructure (e.g., default-credential scanners that brute-force dictionaries
    over Telnet/SSH/HTTP) per [Understanding the Mirai Botnet, Antonakakis et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).
    Include the matched feed name and category in the alert text. A positive result -- a rule match, statistical
    outlier, or model alert -- is a strong signal of active identity reconnaissance; pivot to the source
    IP/ASN and its reputation, the targeted accounts and endpoints, the success/failure state of each
    attempt, the user-agent and timing cadence, and any subsequent successful authentication or follow-on
    phishing so you can scope which identities were exposed and pre-position resets, MFA enforcement,
    and source blocks. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss distributed, low-and-slow,
    or proxy-fronted reconnaissance.'
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Proxy Logs
  - WAF Logs
  - Microsoft Entra ID Sign-in logs
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Externally-facing authentication services (e.g., VPN, OWA, M365), public web servers, network
    firewalls/gateways'
  range: Last 90 days (pivot to event-centered +/- 24h windows on match)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let ti = lookup(threat_intel) where category in ("scanner","open_proxy","tor_exit","default_cred_scanner")
      and confidence=="high"

      from (firewall_logs, proxy_logs, waf_logs, zeek_conn, entra_signin, okta_syslog, win4624)

      where src_ip in ti.ip

      alert msg="T1589 inbound from known recon infra", feed=ti.feed_name, category=ti.category, src_ip=src_ip,
      dst_service=service'
  - technology: Zeek/pseudocode
    query: conn.log | where id.orig_h in ti_watchlist(scanner|proxy|tor) | summarize attempts=count(),
      services=dcount(id.resp_p) by id.orig_h
- question: '[Reconnaissance] Anomalous Authentication Failure Rate: Can you determine whether an authentication
    attempt or web request originates from a source IP address listed on a high-confidence threat intelligence
    feed as a known scanner, open proxy, or TOR exit node. Specifically, apply the ''Anomalous Authentication
    Failure Rate'' (Statistical Method) approach: For any single source IP, compute the failed:successful
    authentication ratio and total volume over a 1-hour window; flag IPs with failure rate >95% AND >20
    attempts. Treat success-after-many-failures as a distinct, higher-severity state signal per [Password
    Spray Attacks, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
    Derive thresholds per service by baselining the 99th percentile of benign per-IP failure counts.'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary gathers victim identity
    information (usernames, emails, credentials, MFA configuration) to plan phishing, credential stuffing,
    or valid-account access before attempting initial access. This evidence focuses on the condition that
    an authentication attempt or web request originates from a source IP address listed on a high-confidence
    threat intelligence feed as a known scanner, open proxy, or TOR exit node. The ''Anomalous Authentication
    Failure Rate'' approach (Statistical Method) works as follows: For any single source IP, compute the
    failed:successful authentication ratio and total volume over a 1-hour window; flag IPs with failure
    rate >95% AND >20 attempts. Treat success-after-many-failures as a distinct, higher-severity state
    signal per [Password Spray Attacks, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
    Derive thresholds per service by baselining the 99th percentile of benign per-IP failure counts. A
    positive result -- a rule match, statistical outlier, or model alert -- is a strong signal of active
    identity reconnaissance; pivot to the source IP/ASN and its reputation, the targeted accounts and
    endpoints, the success/failure state of each attempt, the user-agent and timing cadence, and any subsequent
    successful authentication or follow-on phishing so you can scope which identities were exposed and
    pre-position resets, MFA enforcement, and source blocks. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss distributed, low-and-slow, or proxy-fronted reconnaissance.'
  answer_sources:
  - Firewall Logs
  - Zeek conn.log
  - Proxy Logs
  - WAF Logs
  - Microsoft Entra ID Sign-in logs
  - Okta System Log
  - Windows Event ID 4624
  - 'NAI: Externally-facing authentication services (e.g., VPN, OWA, M365), public web servers, network
    firewalls/gateways'
  range: Last 90 days (rolling baseline; evaluate in 10-60 minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from auth_logs | bin 1h | by src_ip

      compute fails=countif(outcome=="fail"), succ=countif(outcome=="success"), total=count()

      fail_rate = fails/total

      baseline p99 = percentile(per_ip_fail_count, 99) per service

      alert if fail_rate>0.95 and total>20 ; raise severity if succ>0 after >=20 fails (success-after-failures)'
- question: '[Reconnaissance] Score auth attempts with logistic regression: Can you determine whether
    an authentication attempt or web request originates from a source IP address listed on a high-confidence
    threat intelligence feed as a known scanner, open proxy, or TOR exit node. Specifically, apply the
    ''Score auth attempts with logistic regression'' (Machine Learning) approach: Score attempts using
    IP reputation, ASN, geolocation, time-of-day, and failure rate, alerting above 0.9; surface the top-3
    contributing features in the alert text. As an unsupervised, explainable alternative, score per-source
    feature vectors with Isolation Forest and report the most anomalous features per [Isolation Forest,
    Liu et al.](https://doi.org/10.1145/2133360.2133363).'
