- question: '[Reconnaissance] Alert on password spraying vs stuffing: Can you determine whether a large-scale
    authentication anomaly is detected, characterized by either (1) a one-to-many pattern of a single
    source IP attempting to authenticate against numerous accounts (Password Spraying), or (2) a many-to-one
    pattern of numerous source IPs attempting to authenticate against a single account (Credential Stuffing).
    Specifically, apply the ''Alert on password spraying vs stuffing'' (Symbolic Logic) approach: Alert
    when a single IP attempts >15 distinct accounts with few passwords each (spraying) or a single account
    is targeted by >10 source IPs (stuffing) within a 30-minute window, per [Detecting Password Spraying
    Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    (code: [security_content](https://github.com/splunk/security_content)) and [Password Spray Attacks,
    ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
    Include account-count, IP-count, and password-cardinality in the alert.'
