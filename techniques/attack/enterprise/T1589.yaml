  answer_sources:
  - Windows Event ID 4625
  - Microsoft Entra ID Sign-in logs (Error code 50053, 50126)
  - Okta System Log (event `user.session.start` with reason `INVALID_CREDENTIALS`)
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS), RADIUS servers, Cloud Identity
    Provider logs'
  range: Last 90 days (rolling baseline; evaluate in 10-60 minute windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from failed_logins bin 15m by src_ip

      entropy = shannon_entropy(distinct attempted_usernames)

      baseline per service ; alert if entropy > percentile(98) -> dictionary/automated generation'
- question: '[Reconnaissance] Username Enumeration Likelihood: Can you determine whether a single source
    IP generates a high volume of failed authentication events with an error code indicating the username
    does not exist, indicating a systematic attempt to validate a list of potential usernames (Username
    Enumeration). Specifically, apply the ''Username Enumeration Likelihood'' (Machine Learning) approach:
    Train a model on failed-login features (source IP, user agent, inter-attempt timing, username entropy,
    NXUSER ratio) to predict enumeration vs legitimate user error, surfacing the top-3 features in alerts.
    Alternatively, model benign per-source authentication-event sequences with an LSTM and flag deviation
    from top-k predicted next events per [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015).'
