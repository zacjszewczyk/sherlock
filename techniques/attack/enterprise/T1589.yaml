name: 'T1589: Gather Victim Identity Information'
id: 6b23a419-f424-4f24-84f9-e4656f8e2f05
description: 'This playbook helps an analyst investigate whether a sophisticated external actor, a routine
  threat actor, or commodity automation is actively gathering the organization''s identity information
  to support targeting (MITRE ATT&CK T1589, Gather Victim Identity Information, Reconnaissance tactic
  TA0043). Adversaries collect personal data (employee names, email addresses, security-question answers)
  and sensitive details such as credentials and MFA configurations by probing authentication services
  for valid usernames, harvesting identity data exposed on public web pages or in breach/paste corpora,
  and scraping employee directory and profile endpoints. Because this activity precedes phishing, credential
  stuffing, and valid-account abuse, catching it early disrupts the adversary lifecycle before initial
  access. The hunt spans externally-facing authentication services (VPN, OWA, M365), domain controllers,
  ADFS/RADIUS, cloud identity providers (Microsoft Entra ID, Okta), public web servers, WAFs, API gateways,
  and external breach/paste monitoring feeds. It pursues the behavior from several complementary angles:
  connections and authentications originating from known scanner/proxy/TOR infrastructure; username-enumeration
  bursts distinguished by ''no such user'' failure codes and high username entropy; large-scale password
  spraying (one source, many accounts) and credential stuffing (many sources, one account); corporate
  credentials surfacing in breach or paste-site corpora; and robotic scraping of identity-bearing web
  pages and APIs. Detection methods combine deterministic symbolic-logic rules (threat-intel matching,
  failure-code thresholds, honey/canary credentials, sensitive-URI spray rules), statistical baselining
  (per-IP failure ratios, failure-mode-code profiling, username entropy, structural login rarity, geographic/ASN
  entropy, ratio and percentile outliers, robotic-cadence and directed-anomaly scoring, leaked-credential
  volume spikes), and machine learning (logistic-regression and multi-class authentication classifiers,
  Isolation Forest, LSTM/DeepLog sequence modeling, ARIMA/Prophet volume forecasting), so the analyst
  can corroborate suspected identity reconnaissance across firewall, proxy, Zeek, web, WAF, and cloud
  identity telemetry.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
