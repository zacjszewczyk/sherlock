questions:
- question: '[Execution] Correlate plist file events in launch directories with threat intelligence: Can
    you determine whether a .plist file is created or modified in `/Library/LaunchAgents`, `/Library/LaunchDaemons`,
    or `~/Library/LaunchAgents` whose file hash matches a known malicious signature or whose ''ProgramArguments''
    key contains a known malicious IP address, domain, or URL. -- specifically, using the ''Correlate
    plist file events in launch directories with threat intelligence'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary abuses launchctl to run
    commands and to load or start malicious Launch Agents/Daemons on macOS, leaving traces across plist
    file activity in launch directories, launchctl process execution and lineage, code-signing state,
    and any network activity the spawned payload generates. This evidence focuses on the condition that
    a .plist file is created or modified in `/Library/LaunchAgents`, `/Library/LaunchDaemons`, or `~/Library/LaunchAgents`
    whose file hash matches a known malicious signature or whose ''ProgramArguments'' key contains a known
    malicious IP address, domain, or URL. This Symbolic Logic approach works as follows: On any file create/modify
    of a `.plist` in `/Library/LaunchAgents`, `/Library/LaunchDaemons`, or `~/Library/LaunchAgents`, parse
    `ProgramArguments`/`Program` and extract IPs, domains, URLs; alert on any match to the IOC database,
    and independently alert on a `Program` whose code signature is absent/invalid or whose path is user-writable
    (a distinct State signal). Real-time monitoring of these persistence locations is the deterministic
    floor ([BlockBlock, Objective-See](https://objective-see.org/products/blockblock.html); [How Malware
    Persists on macOS](https://www.sentinelone.com/blog/how-malware-persists-on-macos/)). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable launchctl abuse for code
    execution or persistence-backed execution; pivot to the responsible launchctl invocation and its parent-process
    lineage, the host and user context, the referenced .plist file (its path, Label, Program/ProgramArguments,
    and code-signature state), and any subsequent process execution or outbound network connection the
    payload makes. A negative result helps rule out this particular launchctl execution vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    signed, or living-off-the-land abuse of native macOS service-management tooling.'
