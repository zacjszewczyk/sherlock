name: 'T1569.001: Launchctl'
id: 82197c58-310b-46d0-b258-04ebe70eaf0e
description: 'This playbook helps an analyst investigate whether an adversary is abusing launchctl --
  the command-line interface to launchd, the macOS service-management framework -- to execute commands
  or programs and to load, start, or unload malicious Launch Agents (T1543.001) and Launch Daemons (T1543.004)
  as part of the Execution tactic. Adversaries commonly drop or modify a property-list (.plist) file in
  /Library/LaunchAgents, /Library/LaunchDaemons, or ~/Library/LaunchAgents and then run subcommands such
  as `launchctl load -w`, `launchctl start`, or `launchctl unload` to invoke their payload. The hunt spans
  macOS endpoint telemetry (unified logs / EDR process-creation, file-modification, and service-creation
  events) and network telemetry (Zeek dns.log, http.log, and conn.log from DNS servers and egress points).
  It guides the analyst across several behavioral angles: correlating plist create/modify events in launch
  directories with threat intelligence and code-signature/path State signals; profiling resolution and
  connection-failure rates of domains referenced inside plist ProgramArguments; baselining domain and
  directory prevalence to surface rare references; YARA-scanning plist content invoked by launchctl load
  for obfuscation and Apple-imitating Labels; measuring entropy of Label/Program strings; alerting on
  launchctl loads from world-writable or temporary directories; detecting launchctl spawned by anomalous
  parents such as browsers, office apps, or exploited shells; and reconstructing the create-load-execute-delete
  anti-forensic sequence. Detection methods combine symbolic-logic rules, statistical baselining/forecasting,
  and machine-learning models (feature classifiers, clustering, provenance/graph and sequence models)
  so the analyst can corroborate suspected launchctl abuse against process lineage, plist content and
  location, code-signing state, and downstream network activity.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
