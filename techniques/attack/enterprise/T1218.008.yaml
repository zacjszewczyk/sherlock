- question: '[Stealth] Detect REGSVR/INSTALLDRIVER/response-file invocations: As part of investigating
    odbcconf.exe proxy execution, can you determine whether execution of odbcconf.exe with command-line
    (or response-file) actions used to register and execute a DLL: the ''/A {REGSVR ...}'' pattern, the
    ''/A {INSTALLDRIVER ...|Driver=...dll...}'' pattern, or a ''-f/ /f <file>.rsp'' response file that
    loads such an action off the command line. Use process creation telemetry for command-line, parent-process,
    and user context, and file-create telemetry to capture .rsp response-file contents. -- specifically
    using the ''Detect REGSVR/INSTALLDRIVER/response-file invocations'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary abuses the Microsoft-signed odbcconf.exe
    utility to proxy execution of malicious DLLs and blend in with legitimate, trusted binary activity
    to evade application control and detection. This evidence focuses on the condition that Execution
    of odbcconf.exe with command-line (or response-file) actions used to register and execute a DLL: the
    ''/A {REGSVR ...}'' pattern, the ''/A {INSTALLDRIVER ...|Driver=...dll...}'' pattern, or a ''-f/ /f
    <file>.rsp'' response file that loads such an action off the command line. Use process creation telemetry
    for command-line, parent-process, and user context, and file-create telemetry to capture .rsp response-file
    contents. This Symbolic Logic approach works as follows: Alert when odbcconf.exe command lines match
    `(?i)/a\s*\{?\s*regsvr` OR `(?i)installdriver[^\r\n]*driver\s*=` OR `(?i)\s/?-?f\s+\S+\.rsp`. The
    .rsp response-file and INSTALLDRIVER variants hide the malicious REGSVR action from naive command-line
    rules; per [Odbcconf LOLBin trifecta, Hexacorn](https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/)
    and the [Odbcconf LOLBAS entry](https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/) you must
    cover all three. For response files, ingest the .rsp content via Sysmon 11 file-create and re-apply
    the REGSVR/INSTALLDRIVER regex to the file body. Codify with the [SigmaHQ odbcconf rules](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_odbcconf_response_file.yml);
    allowlist installer-spawned odbcconf using the documented legitimate flag grammar in [ODBCCONF.EXE,
    Microsoft](https://learn.microsoft.com/en-us/sql/odbc/odbcconf-exe). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates that odbcconf.exe is likely being used as an execution
    proxy rather than for legitimate ODBC configuration; pivot to the responsible odbcconf.exe process,
    its command line, parent lineage, the user/integrity context, the specific DLL/.rsp loaded, and any
    follow-on child processes or outbound network activity. A negative result helps reduce the likelihood
    of this vector but should be corroborated with the other questions in this playbook, since a single
    method can miss obfuscated, response-file-hidden, or low-and-slow LOLBin abuse.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Detect odbcconf REGSVR / INSTALLDRIVER / .rsp invocations\nproc = Process(4688/Sysmon1)\
      \ WHERE image ENDSWITH 'odbcconf.exe'\nALERT WHEN proc.command_line MATCHES\n  (?i)/a\\s*\\{?\\\
      s*regsvr\n  OR (?i)installdriver[^\\r\\n]*driver\\s*=\n  OR (?i)\\s/?-?f\\s+\\S+\\.rsp\n# Re-scan\
      \ .rsp body captured via Sysmon 11 FileCreate with same regex\nALLOWLIST installer-spawned odbcconf\
      \ using documented legitimate flag grammar"
