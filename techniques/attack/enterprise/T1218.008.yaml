questions:
- question: '[Stealth] Match odbcconf DLL loads to intel: As part of investigating odbcconf.exe proxy
    execution, can you determine whether an odbcconf.exe process loads a DLL module whose file hash (e.g.,
    SHA256) is present on a threat intelligence feed of known malicious indicators. Use process creation
    telemetry for command-line, parent-process, and user context. Use module-load telemetry to confirm
    which DLLs or payloads were actually loaded. -- specifically using the ''Match odbcconf DLL loads
    to intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary abuses the Microsoft-signed odbcconf.exe
    utility to proxy execution of malicious DLLs and blend in with legitimate, trusted binary activity
    to evade application control and detection. This evidence focuses on the condition that An odbcconf.exe
    process loads a DLL module whose file hash (e.g., SHA256) is present on a threat intelligence feed
    of known malicious indicators. Use process creation telemetry for command-line, parent-process, and
    user context. Use module-load telemetry to confirm which DLLs or payloads were actually loaded. This
    Symbolic Logic approach works as follows: Correlate process creation (Event ID 4688 / Sysmon 1), module
    load (Sysmon 7), and file create (Sysmon 11) for odbcconf.exe before applying the rule. Compare each
    DLL hash loaded by odbcconf.exe against threat-intelligence indicator feeds and alert on any match.
    Per [Identifying and Mitigating LOTL, CISA/NSA](https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques),
    signed-binary execution is not itself the signal: pair the hash hit with the loading-process context
    (parent, command line, user). Note odbcconf legitimately loads odbc*.dll/system drivers, so deterministically
    allowlist Microsoft-signed modules under C:\Windows\System32 and SysWOW64 to keep the floor of deterministic
    matching low-noise. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    that odbcconf.exe is likely being used as an execution proxy rather than for legitimate ODBC configuration;
    pivot to the responsible odbcconf.exe process, its command line, parent lineage, the user/integrity
    context, the specific DLL/.rsp loaded, and any follow-on child processes or outbound network activity.
    A negative result helps reduce the likelihood of this vector but should be corroborated with the other
    questions in this playbook, since a single method can miss obfuscated, response-file-hidden, or low-and-slow
    LOLBin abuse.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match odbcconf DLL loads to threat intel

      proc = Process WHERE image ENDSWITH ''odbcconf.exe'' (EventID 4688 / Sysmon 1)

      mod  = ModuleLoad (Sysmon 7) WHERE process_guid = proc.guid

      JOIN proc, mod, FileCreate(Sysmon 11) ON host, process_guid

      ALLOWLIST mod.signed=Microsoft AND mod.path IN (C:\Windows\System32, C:\Windows\SysWOW64)

      ALERT WHEN mod.sha256 IN threat_intel_feed

      ENRICH with proc.parent_image, proc.command_line, proc.user'
- question: '[Stealth] Score rare DLL hashes: As part of investigating odbcconf.exe proxy execution, can
    you determine whether an odbcconf.exe process loads a DLL module whose file hash (e.g., SHA256) is
    present on a threat intelligence feed of known malicious indicators. Use process creation telemetry
    for command-line, parent-process, and user context. Use module-load telemetry to confirm which DLLs
    or payloads were actually loaded. -- specifically using the ''Score rare DLL hashes'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary abuses the Microsoft-signed odbcconf.exe
    utility to proxy execution of malicious DLLs and blend in with legitimate, trusted binary activity
    to evade application control and detection. This evidence focuses on the condition that An odbcconf.exe
    process loads a DLL module whose file hash (e.g., SHA256) is present on a threat intelligence feed
    of known malicious indicators. Use process creation telemetry for command-line, parent-process, and
    user context. Use module-load telemetry to confirm which DLLs or payloads were actually loaded. This
    Statistical Method approach works as follows: Establish rolling host, user, and enterprise baselines
    before scoring rarity. Using fleet-wide DLL prevalence as in [Using Frequency Analysis to Defend Office
    365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365),
    track each DLL hash/path prevalence over 90 days and flag modules loaded by odbcconf.exe seen on <5
    hosts or <0.1% of endpoints. Derive the percentile cutoff per environment (start at the 1st percentile
    of module prevalence). Volume/State signal: also score whether the DLL load succeeded vs. failed (Sysmon
    7 vs. a 4688 with immediate exit) — repeated failed loads of the same rare path indicate iterative
    attacker testing. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    that odbcconf.exe is likely being used as an execution proxy rather than for legitimate ODBC configuration;
    pivot to the responsible odbcconf.exe process, its command line, parent lineage, the user/integrity
    context, the specific DLL/.rsp loaded, and any follow-on child processes or outbound network activity.
    A negative result helps reduce the likelihood of this vector but should be corroborated with the other
    questions in this playbook, since a single method can miss obfuscated, response-file-hidden, or low-and-slow
    LOLBin abuse.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Score rarity of DLLs loaded by odbcconf over 90d

      loads = ModuleLoad(Sysmon 7) WHERE process_image ENDSWITH ''odbcconf.exe''

      baseline = COUNT_DISTINCT(host) BY mod.sha256, mod.path OVER last_90d

      prevalence_pct = baseline / total_hosts * 100

      ALERT WHEN baseline < 5 OR prevalence_pct < 0.1   # ~1st percentile

      ADD load_failed = (Sysmon7 absent but 4688 immediate_exit)

      ESCALATE on repeated failed loads of same rare path'
