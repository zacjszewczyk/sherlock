name: 'T1218.008: System Binary Proxy Execution: Odbcconf'
id: 4f7935e0-d105-4fcc-8d60-ff7af8878280
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Windows ODBC
  configuration utility odbcconf.exe to proxy the execution of malicious code and bypass application control
  or other defenses (MITRE ATT&CK T1218.008, System Binary Proxy Execution: Odbcconf), under the Stealth
  tactic. odbcconf.exe is a Microsoft-signed binary that, similar to regsvr32, can load and execute arbitrary
  DLLs via its REGSVR action, the INSTALLDRIVER action, or a .rsp response file, making it a living-off-the-land
  (LOLBin) execution proxy. The playbook guides the hunt across several complementary angles: matching
  DLLs loaded by odbcconf.exe against threat-intelligence hashes and scoring DLL rarity/prevalence; detecting
  REGSVR/INSTALLDRIVER/response-file command-line and .rsp content patterns plus obfuscation/entropy scoring
  of those command lines; flagging odbcconf.exe spawned by anomalous parent processes (Office apps, script
  hosts, browsers); correlating DLL/.rsp drops to user-writable directories with subsequent odbcconf loads
  within a short time window; and spotting suspicious child shells or anomalous post-execution network/C2
  activity. Detection methods combine symbolic-logic rules, statistical baselining, and machine-learning
  models applied to Windows Security/Sysmon process, module-load, file-create, and network telemetry plus
  Zeek conn.log and dns.log, so the analyst can corroborate suspected odbcconf abuse against module provenance,
  command-line content, process lineage, file-drop timing, and egress context.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
