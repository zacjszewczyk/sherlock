name: 'T1059: Command and Scripting Interpreter'
id: 1eb55da6-27c9-4811-b50f-1b3e0c94ae22
description: 'This playbook helps an analyst investigate adversary abuse of built-in command and script
  interpreters (PowerShell, Windows Command Shell, Unix shells, Python, JavaScript, VBScript, and platform
  CLIs) to execute commands, scripts, or binaries across Windows, Linux, macOS, ESXi, network devices,
  and cloud platforms. It guides the hunt across several behaviors: interpreter command lines that carry
  threat-intelligence indicators or known-malicious script hashes; command lines exhibiting high entropy,
  encoding, or download-and-execute cradles indicative of obfuscation; interpreters spawned by unusual
  parent processes such as Office, browser, or mail applications; script files written to world-writable
  directories and immediately executed (drop-and-run staging); and interpreter processes initiating suspicious
  outbound network connections consistent with C2 or exfiltration. For each behavior it pairs symbolic-logic
  rules, statistical baselining, and machine-learning approaches so a SOC analyst can triage and confirm
  malicious interpreter use under the Execution tactic.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any script-interpreter executions (powershell.exe, cmd.exe, wscript.exe) contain command-line
    arguments with domains, IP addresses, or executed-script hashes that exactly match a known-malicious
    threat-intelligence indicator?
  context: 'Adversaries abusing interpreters for Execution often embed attacker infrastructure (C2 domains/IPs)
    directly in command lines or fetch known-malicious scripts. Parse Sysmon EID 1 / Windows 4688 command
    lines and PowerShell 4104 script-block content (ensure Deep Script Block and Module Logging are enabled)
    to extract IPs, domains, and file hashes, then alert on exact matches to threat-intelligence feeds.
    Corroborate any matched domain against Zeek dns.log to confirm it actually resolved. A positive match
    is a high-confidence indicator of malicious interpreter use; a negative result still leaves obfuscation
    and behavioral checks to run. Enable Deep Script Block Logging and Module Logging per [Keeping PowerShell:
    Security Measures to Use and Embrace](https://media.defense.gov/2022/Jun/22/2003021689/-1/-1/0/CSI_KEEPING_POWERSHELL_SECURITY_MEASURES_TO_USE_AND_EMBRACE_20220622.PDF).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FROM (sysmon_eid1 OR win_4688 OR powershell_4104)

      LET tokens = extract_iocs(CommandLine, ScriptBlockText)  // ips, domains, hashes

      WHERE tokens.ip IN ti_feed.ips OR tokens.domain IN ti_feed.domains OR tokens.hash IN ti_feed.hashes

      JOIN zeek_dns ON zeek_dns.query == tokens.domain  // confirm resolution

      ALERT process, user, host, matched_indicator'
- question: When interpreter command lines reference external domains or IPs, are any of those destinations
    statistically rare (below the 5th percentile of 30-day prevalence) or do they return NXDOMAIN / blocked
    connections indicating C2 staging?
  context: 'Beyond exact threat-intel matches, novel attacker infrastructure shows up as rarely-seen domains/IPs.
    Score each extracted domain/IP by its 30-day prevalence and flag the bottom 5th percentile. Per Principle
    5, separately profile the resolution/connection failure state: a flagged domain returning NXDOMAIN
    or a blocked/failed connection is a distinct C2-staging signal observable in Zeek dns.log/conn.log.
    This catches first-contact callbacks before a feed catches up, supporting the Execution-stage hunt
    for adversary-controlled code reaching out. Rare-indicator and failure-state scoring follow [SCADE](https://arxiv.org/abs/2412.04259).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM (sysmon_eid1 OR win_4688 OR powershell_4104)

      LET dom = extract_domains(CommandLine, ScriptBlockText)

      STATS prevalence = count_distinct(host) OVER last_30d BY dom

      WHERE percentile_rank(prevalence) < 5

      JOIN zeek_dns, zeek_conn ON dom

      FLAG WHEN dns.rcode == ''NXDOMAIN'' OR conn.state IN (''REJ'',''S0'',''RSTO'')

      ALERT dom, host, process, failure_state'
- question: Does a machine-learning classifier scoring interpreter command lines on length, entropy, special-character
    ratio, keyword flags, and domain-rarity flag any execution as high-probability malicious?
  context: Malicious script lines tend to differ from benign administrative ones across multiple correlated
    features. Train a gradient-boosted classifier on command length, Shannon entropy, special-character
    ratio, keyword flags (download cradles, encoding switches), and domain-rarity score to flag high-probability
    malicious interpreter invocations. Surface the top-3 contributing features in the alert text so the
    analyst can quickly judge why it fired. This complements rule-based IOC matching by catching novel,
    never-before-seen malicious lines during the Execution phase. Approach per [Obfuscated Command Line
    Detection Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "MODEL gbm_cmdline = load('cmdline_malice_gbm')\nFROM (sysmon_eid1 OR win_4688 OR powershell_4104)\n\
      LET feats = [len(CommandLine), shannon_entropy(CommandLine), special_char_ratio(CommandLine),\n\
      \             keyword_flags(CommandLine), domain_rarity(CommandLine)]\nLET score, top3 = gbm_cmdline.predict_with_explain(feats)\n\
      WHERE score > 0.9\nALERT process, host, user, score, top3"
- question: Do any interpreter command lines or PowerShell script blocks contain download-and-execute
    cradles (IEX, DownloadString, Invoke-WebRequest), Base64 encoding switches (-enc/-e), or cmd.exe parser-abuse
    primitives (caret insertion, %var:~% substring, string reversal)?
  context: Obfuscation and download cradles are hallmark techniques for delivering and executing second-stage
    payloads via interpreters. Regex-scan Sysmon EID 1 / Win 4688 arguments and PowerShell 4104 content
    for cradle keywords, Base64 flags, and DOSfuscation-style parser-abuse primitives. A match strongly
    suggests an adversary is staging or executing obfuscated code under the Execution tactic. Tune against
    known-benign admin scripts to limit false positives, and pivot on matched hosts to the parent-process
    and network checks in this playbook. Parser-abuse primitives are documented in [DOSfuscation](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf).
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User Workstations, Web Servers, Mail Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM (sysmon_eid1 OR win_4688 OR powershell_4104)\nLET text = lower(CommandLine + ' ' + ScriptBlockText)\n\
      WHERE text MATCHES /iex|downloadstring|invoke-webrequest|-enc(odedcommand)?|-e\\s/  \n   OR text\
      \ MATCHES /\\^|%\\w+:~[-0-9]+(,[-0-9]+)?%|\\[string\\]::reverse/  // DOSfuscation\nALERT process,\
      \ host, user, matched_pattern, CommandLine"
- question: Are any interpreter command lines statistically anomalous in Shannon entropy, length, or special-character
    ratio relative to the host-process baseline (e.g., above the 98th percentile), indicating encoding
    or obfuscation?
  context: Encoded or obfuscated commands deviate measurably from normal administrative usage. Score command-line
    Shannon entropy, length, and special-character ratio per host-process baseline and flag executions
    above the 98th percentile (a strong indicator of encoded commands). Augment with character-frequency
    / token / AST distribution deviation from a benign corpus (Revoke-Obfuscation approach). Derive percentiles
    from your own 30-day telemetry so thresholds reflect your environment. High scores warrant decoding
    the command and pivoting to IOC and parent-process checks. Entropy thresholding per [High Command
    Line Entropy Detected for Privileged Commands](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html);
    character-frequency/token/AST deviation per [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf).
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User Workstations, Web Servers, Mail Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM (sysmon_eid1 OR win_4688 OR powershell_4104)\nLET ent = shannon_entropy(CommandLine),\
      \ ln = len(CommandLine), scr = special_char_ratio(CommandLine)\nSTATS p98_ent = percentile(ent,98),\
      \ p98_ln = percentile(ln,98), p98_scr = percentile(scr,98)\n      OVER last_30d BY host, process_name\n\
      WHERE ent > p98_ent OR ln > p98_ln OR scr > p98_scr\nALERT process, host, user, ent, ln, scr, CommandLine"
- question: Does a machine-learning obfuscation detector (character-level DNN, XGBoost on hybrid text/token/AST
    features, or a small ELECTRA model) classify any command line as obfuscated or malicious?
  context: 'Statistical thresholds miss adversaries who obfuscate while keeping entropy moderate. Apply
    an ML obfuscation detector: a character-level DNN on raw command text, an XGBoost model on hybrid
    text/token/AST features, or a lightweight ELECTRA small language model. Report the top-3 contributing
    features (e.g., entropy, char-array casting, token rarity) in the alert to aid triage. Positive classifications
    indicate likely obfuscated execution and should be deobfuscated and correlated with the IOC, lineage,
    and network questions in this playbook. Detector options include a character-level DNN [Detecting
    Malicious PowerShell Commands using Deep Neural Networks](https://cris.bgu.ac.il/en/publications/detecting-malicious-powershell-commands-using-deep-neural-network),
    XGBoost on hybrid features [Effective Method for Detecting Malicious PowerShell Scripts Based on Hybrid
    Features](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099), and a small ELECTRA
    model [Command-line Obfuscation Detection using Small Language Models](https://arxiv.org/html/2408.02637v1).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: User Workstations, Web Servers, Mail Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL obf = load(''powershell_obfuscation_detector'')  // char-DNN | XGBoost-hybrid | ELECTRA-small

      FROM (sysmon_eid1 OR win_4688 OR powershell_4104)

      LET score, top3 = obf.predict_with_explain(CommandLine, ScriptBlockText)

      WHERE score > 0.85

      ALERT process, host, user, score, top3'
- question: Is a command interpreter (cmd.exe, powershell.exe, wscript.exe, mshta) spawned as a child
    of an Office, browser, or mail application (WINWORD.EXE, EXCEL.EXE, OUTLOOK.EXE, chrome.exe) or another
    parent that does not normally launch interpreters?
  context: Office/browser/mail applications spawning interpreters is a classic phishing-to-execution lineage
    and a high-fidelity Execution indicator. Alert when Sysmon EID 1 / Win 4688 record documented suspicious
    parent-child pairs (e.g., WINWORD/EXCEL/OUTLOOK/chrome -> cmd/powershell/wscript/mshta) or when cmd.exe
    is launched by uncommon parents. Apply equivalent logic to auditd execve on Linux/macOS process lineage.
    A match indicates likely macro/exploit-driven code execution; pivot to the spawned process's command
    line and network activity. Suspicious parent-child pairs per [Suspicious Microsoft Office Child Process](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/)
    and [Unusual Parent Process For Cmd.EXE](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/).
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: User Workstations, Remote Desktop Servers, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM (sysmon_eid1 OR win_4688 OR auditd_execve)\nLET parent = lower(ParentImage), child =\
      \ lower(Image)\nWHERE parent IN ('winword.exe','excel.exe','powerpnt.exe','outlook.exe','chrome.exe','msedge.exe','firefox.exe')\n\
      \  AND child IN ('cmd.exe','powershell.exe','pwsh.exe','wscript.exe','cscript.exe','mshta.exe','bash','sh','python')\n\
      ALERT parent, child, host, user, CommandLine"
- question: Are there first-seen or statistically improbable parent-child process tuples, or bursts of
    interpreter spawns exceeding the host baseline?
  context: Living-off-the-land actors reuse trusted binaries in unusual lineages. Track first-seen parent-child
    tuples per host and flag entirely new combinations or those below the 1st-percentile lineage probability.
    Also profile interpreter-spawn frequency (count per minute) and flag bursts exceeding the host baseline.
    These behavioral signals catch novel execution chains that static blocklists miss, supporting the
    Execution-stage hunt. Investigate flagged lineages by reviewing the full process tree and associated
    command lines. Behavioral lineage signals emphasized in [Identifying and Mitigating Living Off the
    Land Techniques](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: User Workstations, Remote Desktop Servers, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM (sysmon_eid1 OR win_4688 OR auditd_execve)\nLET tuple = ParentImage + '->' + Image\n\
      STATS first_seen = min(_time) BY host, tuple\n      lineage_prob = count(tuple)/count(*) OVER last_30d\
      \ BY host\n      spawn_rate = count(*) PER 1m BY host, Image\nWHERE first_seen > now()-1d OR percentile_rank(lineage_prob)\
      \ < 1 OR spawn_rate > baseline(host,Image)*3\nALERT tuple, host, user, lineage_prob, spawn_rate"
- question: Does a process-graph anomaly model (supervised XGBoost plus graph-rarity) score any parent-child
    relationship and its command-line features as anomalous?
  context: 'Sophisticated actors mutate LOTL syntax to evade rules. Score parent-child relationships and
    command-line features with a supervised XGBoost + graph-rarity model (ProblemChild-style) that surfaces
    the top-3 contributing features. Maintain coverage against evolving LOTL syntax with an active-learning
    loop. Anomalous scores indicate execution chains worth manual review; combine with the obfuscation
    and IOC questions to corroborate. This catches abuse that neither static blocklists nor simple frequency
    baselines detect. Model per [ProblemChild: Discovering Anomalous Patterns based on Parent-Child Process
    Relationships](https://ar5iv.labs.arxiv.org/html/2008.04676); active-learning coverage per [Living-Off-The-Land
    Command Detection Using Active Learning](https://arxiv.org/abs/2111.15039).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: User Workstations, Remote Desktop Servers, Mail Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL pc = load(''problemchild_xgb_graphrarity'')

      FROM (sysmon_eid1 OR win_4688 OR auditd_execve)

      LET feats = graph_and_cmdline_features(ParentImage, Image, CommandLine, ancestry)

      LET score, top3 = pc.predict_with_explain(feats)

      WHERE score > 0.9

      ALERT ParentImage, Image, host, user, score, top3

      FEEDBACK active_learning_queue  // label hard cases'
- question: Is a script file (.ps1, .bat, .vbs, .js, .py, .sh) written to a world-writable directory (%TEMP%,
    %PUBLIC%, %APPDATA%, /tmp) and then executed by an interpreter within roughly 10 seconds?
  context: Drop-and-run staging—writing a script to a temp/world-writable path and immediately executing
    it—is a common LOTL execution pattern. Correlate Sysmon EID 11 script writes in world-writable directories
    with Sysmon EID 1 (or auditd execve) executions of the same path within a 10-second window. A tight
    write-then-execute pairing in a temp location is a strong Execution-stage signal; review the script
    content and the executing process's parent and network activity to confirm intent. Drop-and-run staging
    behavior described in [Identifying and Mitigating Living Off the Land Techniques](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: User Workstations, File Servers, Web Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM sysmon_eid11 AS w\nWHERE w.TargetFilename MATCHES /\\.(ps1|bat|vbs|js|py|sh)$/i\n  AND\
      \ w.TargetFilename IN_DIR ('%TEMP%','%PUBLIC%','%APPDATA%','/tmp','/var/tmp')\nJOIN (sysmon_eid1\
      \ OR auditd_execve) AS x\n  ON x.CommandLine CONTAINS w.TargetFilename\n  AND x._time - w._time\
      \ BETWEEN 0s AND 10s\nALERT w.TargetFilename, x.Image, host, user"
- question: Are scripts being executed from statistically rare directories (bottom 5th percentile by 30-day
    frequency) or is there a spike in script-write volume to any directory?
  context: Malicious staging tends to occur in uncommon directories and in bursts. Score script-execution
    directories by 30-day frequency and flag the bottom 5th percentile (uncommon locations). Rank rare
    write paths/filenames using BM25 / log-entropy IR scoring, and track script-write volume (count per
    minute per directory) to flag spikes. Rare-location execution and write-volume spikes both indicate
    possible payload staging during the Execution phase; investigate the offending paths and the writing/executing
    processes. Rare write paths/filenames ranked via BM25/log-entropy IR scoring per [SCADE](https://arxiv.org/abs/2412.04259).
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: User Workstations, File Servers, Web Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM (sysmon_eid1 OR auditd_execve)\nLET dir = dirname(script_path(CommandLine))\nSTATS freq\
      \ = count(*) OVER last_30d BY dir\n      write_rate = count(*) PER 1m BY dir   // from sysmon_eid11\n\
      LET rarity = bm25_log_entropy(dir)\nWHERE percentile_rank(freq) < 5 OR rarity_high(rarity) OR write_rate\
      \ > baseline(dir)*3\nALERT dir, host, process, freq, write_rate"
- question: Does a forecasting model flag a sudden spike in per-directory script-write rates, and does
    a content classifier rate the dropped script as malicious?
  context: Time-series anomalies in script-write rates combined with malicious content scoring give high-confidence
    staging detection. Forecast benign script-write rates per directory via SARIMA/LSTM and alert on sudden
    spikes. Classify the dropped script's content with a hybrid feature model and surface the top-3 features
    in the alert. A spike co-occurring with a malicious content score is a strong Execution-stage staging
    indicator; isolate the host and review the script and its execution chain. Content classification
    per [Effective Method for Detecting Malicious PowerShell Scripts Based on Hybrid Features](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099).
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: User Workstations, File Servers, Web Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL fcast = load(''script_write_sarima_lstm'')

      MODEL content = load(''script_content_hybrid_clf'')

      FROM sysmon_eid11 WHERE TargetFilename MATCHES /\.(ps1|bat|vbs|js|py|sh)$/i

      LET expected = fcast.predict(dir, _time)

      WHERE observed_rate(dir) > expected + k*sigma

      LET cscore, top3 = content.predict_with_explain(read(TargetFilename))

      WHERE cscore > 0.8

      ALERT dir, TargetFilename, host, cscore, top3'
- question: Does a script-interpreter process (powershell.exe, cscript.exe, python) initiate an outbound
    connection to an IP/domain matching threat intelligence, or directly perform HTTP/S egress that would
    normally come from a browser?
  context: Interpreters making outbound connections—especially direct HTTP/S not via a browser—are a strong
    sign of C2 or payload retrieval during Execution. Correlate Sysmon EID 3 interpreter-initiated connections
    with Zeek conn/dns/ssl logs and alert when the destination matches threat intelligence or when an
    interpreter directly initiates outbound HTTP/S (atypical non-browser egress). Confirm by tying the
    process back to its parent and command line. This bridges Execution to Command-and-Control behavior.
    Atypical non-browser egress per [Identifying and Mitigating Living Off the Land Techniques](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM sysmon_eid3\nWHERE lower(Image) IN ('powershell.exe','pwsh.exe','cscript.exe','wscript.exe','python.exe','python')\n\
      JOIN zeek_conn z ON z.id_orig_h==host AND z.id_resp_h==DestinationIp AND near_time(z,_time)\nLEFT\
      \ JOIN zeek_dns, zeek_ssl ON DestinationIp\nWHERE DestinationIp IN ti_feed.ips OR DestinationHostname\
      \ IN ti_feed.domains\n   OR (z.service IN ('http','ssl') )  // interpreter doing direct web egress\n\
      ALERT Image, DestinationIp, host, user, z.service"
- question: Do interpreter network flows exhibit rare JA3/JA3S hashes, uncommon destination ports, anomalous
    bytes-out/bytes-in ratios, or bursts of blocked/failed connections indicating beaconing or exfiltration?
  context: 'C2 and exfiltration leave statistical fingerprints in interpreter network traffic. Monitor
    JA3/JA3S hashes, destination ports, bytes-out/bytes-in ratio, and connection duration from interpreter
    flows; flag values appearing in fewer than 1% of that process''s connections. Per Principle 5, profile
    the failure state too: bursts of blocked connections or repeated failed TCP handshakes from an interpreter
    indicate beaconing/exfil attempts (visible in Zeek conn.log). Rare TLS fingerprints and lopsided byte
    ratios warrant deep inspection of the destination and payload. Rarity and failure-state network scoring
    per [SCADE](https://arxiv.org/abs/2412.04259).'
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FROM sysmon_eid3 JOIN zeek_conn, zeek_ssl ON flow\nWHERE Image IN ('powershell.exe','cscript.exe','python.exe','pwsh.exe')\n\
      LET ratio = bytes_out/(bytes_in+1)\nSTATS p_ja3 = freq(ja3), p_port = freq(dest_port) OVER last_30d\
      \ BY Image\nWHERE p_ja3 < 0.01 OR p_port < 0.01 OR ratio > p99(ratio)\n   OR count(conn.state IN\
      \ ('REJ','S0','RSTO')) PER 5m > baseline  // failed/blocked bursts\nALERT Image, dest_ip, ja3, dest_port,\
      \ ratio, host"
- question: Does an unsupervised clustering/outlier model on interpreter process-destination network metrics
    flag any flow as a C2 or exfiltration outlier?
  context: 'Beaconing and exfil flows form outliers in multidimensional network-behavior space. Cluster
    process-destination metrics (bytes, duration, inter-arrival regularity) via DBSCAN and flag outliers/noise
    points as potential C2 or exfiltration. Alternatively embed command+network context and apply unsupervised
    outlier detectors (COPOD, Isolation Forest), surfacing the top-3 anomalous features. Outliers—particularly
    highly regular, low-variance beacons or large asymmetric transfers—merit investigation of the destination,
    the interpreter command line, and the host''s broader activity to confirm malicious Execution-driven
    C2. Unsupervised outlier detection on embedded command+network context per [BERT Embeddings: A New
    Approach for Command-Line Anomaly Detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'MODEL net = load(''interp_net_dbscan'')  // or COPOD / IsolationForest on embeddings

      FROM sysmon_eid3 JOIN zeek_conn ON flow

      WHERE Image IN (''powershell.exe'',''cscript.exe'',''python.exe'',''pwsh.exe'')

      LET feats = [bytes_out, bytes_in, duration, inter_arrival_regularity, ja3]

      LET label, top3 = net.predict_with_explain(feats)

      WHERE label == ''outlier'' OR label == ''noise''

      ALERT Image, dest_ip, host, top3'
