questions:
- question: '[Impact] Threat feed high-rate detection: Can you determine whether A sustained rate of SYN
    or ACK packets from a single source IP, exceeding a threshold of 1,000 packets per second for over
    60 seconds, where the source IP is present on an active threat intelligence feed for DoS activity
    or botnets. -- specifically, using the ''Threat feed high-rate detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary launches a TCP state-exhaustion
    flood (SYN flood or out-of-state ACK flood) to exhaust the operating system''s self-imposed connection
    and memory limits, denying service to legitimate users without necessarily saturating raw bandwidth
    or CPU. This evidence focuses on the condition that a sustained rate of SYN or ACK packets from a
    single source IP, exceeding a threshold of 1,000 packets per second for over 60 seconds, where the
    source IP is present on an active threat intelligence feed for DoS activity or botnets. This Symbolic
    Logic approach looks for the following signal: Correlate Zeek conn.log flows ([Zeek conn.log](https://docs.zeek.org/en/master/logs/conn.html))
    with CTI DoS/botnet IP feeds and alert when a feed-matched source sends >1,000 SYN or ACK packets/sec
    for >60s to a critical asset; implement as a per-source rate rule (track by_src, count/seconds) per
    [Suricata thresholds](https://docs.suricata.io/en/latest/configuration/global-thresholds.html). Many-low-rate-source
    botnet floods also warrant aggregating feed-matched sources per destination ([Understanding the Mirai
    Botnet](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf)). A
    positive result -- a rule match, statistical outlier, or model alert -- indicates that an external
    source (or botnet) is driving abnormal, handshake-incomplete or out-of-state TCP traffic at a victim
    asset and that the OS may be shedding or dropping connections; pivot to the targeted destination IP/port,
    the offending source(s), the half-open/state backlog metrics, any concurrent host exhaustion events,
    and the affected service''s success rate to confirm availability impact and scope the attack. A negative
    result helps rule out this OS-exhaustion vector for the window examined but should be corroborated
    with the other questions in this playbook, since distributed low-rate floods, spoofed sources, and
    bandwidth-only attacks can evade any single method.'
  answer_sources: &id001
  - Zeek conn.log
  - 'NAI: Internet Gateway, Perimeter Firewalls, Core Routers'
  range: Last 90 days (alert in near-real-time; correlate within 5-minute windows)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat feed high-rate detection

      source IN [Zeek conn.log]

      | WHERE matches_action_criteria("Threat feed high-rate detection")

      // Correlate Zeek conn.log flows (Zeek conn.log) with CTI DoS/botnet IP feeds and alert when a feed-mat

      | ALERT enrich(dest_ip, dest_port, src_ip, syn_pps, ack_pps, s0_count, host_event)'
  - technology: Zeek/pseudocode
    query: '# OS-exhaustion flood correlation (Zeek)

      conn.log [http.log, dns.log]

      | AGG per (id.resp_h, id.resp_p, 1min): syn_count, ack_count, count(conn_state=S0), count(conn_state=SF)

      | COMPUTE half_open_fraction, S0/SF ratio, out_of_state_ack_rate

      | flag destinations exceeding baseline / threshold per action criteria'
- question: '[Impact] Packet rate deviation scoring: Can you determine whether A sustained rate of SYN
    or ACK packets from a single source IP, exceeding a threshold of 1,000 packets per second for over
    60 seconds, where the source IP is present on an active threat intelligence feed for DoS activity
    or botnets. -- specifically, using the ''Packet rate deviation scoring'' (Statistical Method) approach?'
