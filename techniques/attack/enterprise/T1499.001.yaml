name: 'T1499.001: OS Exhaustion Flood'
id: 5d40fab7-2cb0-4662-8c98-440176e818ad
description: 'This playbook helps an analyst investigate whether an adversary is conducting an Endpoint
  Denial of Service via OS Exhaustion Flood (T1499.001) under the Impact tactic, where TCP state-exhaustion
  attacks such as SYN floods and ACK floods overwhelm the operating system''s finite connection-tracking
  and memory-pool limits rather than the raw hardware resources. It guides the hunt across complementary
  network- and host-based angles: detecting sustained high-rate SYN/ACK packet bursts from threat-intelligence-flagged
  sources; fingerprinting automated flood tooling via source-port entropy collapse, fixed TTL/TCP-window
  values, and session clustering; tracking the broken-handshake invariant where half-open (''S0'') connections
  vastly outnumber established (''SF'') connections; identifying out-of-state ACK floods that force the
  OS to fruitlessly scan its state table; correlating first-party host exhaustion evidence (Windows Event
  IDs 4227/2019/2020, Linux TcpExtListenOverflows/TcpExtListenDrops, macOS accept-queue overflow) with
  concurrent network floods; and measuring service-availability impact through collapsing transaction
  success rates against rising inbound packet volume. Detection methods combine symbolic-logic threshold
  rules, statistical baselining and change-point detection, and machine-learning models (autoencoders,
  clustering/CNN, Random Forest, Bayesian networks) applied to Zeek conn.log/http.log/dns.log, NSM firewall/flow
  telemetry, and Windows/Linux/macOS host status logs, so the analyst can corroborate suspected OS exhaustion
  against packet rate, handshake completion, host failure signals, and degraded service health.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
