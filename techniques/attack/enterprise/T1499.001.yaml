- question: '[Impact] Regression deviation anomaly: Can you determine whether The success rate for a monitored
    service (e.g., ratio of HTTP 2xx status codes to all codes in http.log) drops below the 1st percentile
    of its historical baseline, while the inbound packet rate to the service''s host concurrently exceeds
    its 99th percentile. -- specifically, using the ''Regression deviation anomaly'' (Machine Learning)
    approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary launches a TCP state-exhaustion
    flood (SYN flood or out-of-state ACK flood) to exhaust the operating system''s self-imposed connection
    and memory limits, denying service to legitimate users without necessarily saturating raw bandwidth
    or CPU. This evidence focuses on the condition that the success rate for a monitored service (e.g.,
    ratio of HTTP 2xx status codes to all codes in http.log) drops below the 1st percentile of its historical
    baseline, while the inbound packet rate to the service''s host concurrently exceeds its 99th percentile.
    This Machine Learning approach looks for the following signal: Model expected success rate as a function
    of traffic volume (or use a compact CNN over flow features per [LUCID](https://doi.org/10.1109/TNSM.2020.2971776))
    and alert when observed success rate is far below predicted during high-volume events, reporting the
    top-3 contributing features ([SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that an external
    source (or botnet) is driving abnormal, handshake-incomplete or out-of-state TCP traffic at a victim
    asset and that the OS may be shedding or dropping connections; pivot to the targeted destination IP/port,
    the offending source(s), the half-open/state backlog metrics, any concurrent host exhaustion events,
    and the affected service''s success rate to confirm availability impact and scope the attack. A negative
    result helps rule out this OS-exhaustion vector for the window examined but should be corroborated
    with the other questions in this playbook, since distributed low-rate floods, spoofed sources, and
    bandwidth-only attacks can evade any single method.'
