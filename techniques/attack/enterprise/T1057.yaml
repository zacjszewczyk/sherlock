name: 'T1057: Process Discovery'
id: f2c40c8d-8078-481a-be97-776f582d7070
description: 'This playbook helps an analyst investigate Process Discovery (T1057), in which an adversary
  enumerates running processes to understand installed software, security tooling, and the environment
  before shaping follow-on actions. It guides hunting across Windows, Linux, macOS, ESXi, and network
  devices for: execution of known discovery tools matched against threat intelligence (e.g., Seatbelt,
  SharpView, ADRecon); use of native enumeration utilities with verbose arguments (tasklist /v, wmic process
  list full, Get-Process | Format-List *, ps aux, ps -ef, reads of /proc/*/status, esxcli system process
  list, and ''show processes''); discovery utilities spawned by anomalous parent processes such as Office
  applications or web-server worker processes; bursts of many discovery commands from a single host or
  account indicating automated reconnaissance; and process-enumeration commands issued to network devices
  over remote sessions from anomalous sources. Each question pairs symbolic-logic, statistical, and machine-learning
  detection methods with concrete query pseudocode and the relevant named areas of interest so a SOC analyst
  can confirm or refute adversary process discovery activity.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any process execute whose executable file hash matches a curated threat-intelligence feed
    of known process-discovery tools (e.g., Seatbelt, SharpView, ADRecon), as seen in Windows Event ID
    4688 or Sysmon Event ID 1?
  context: 'Adversaries pursuing Discovery frequently drop and run purpose-built enumeration tools. Matching
    the hash of every created executable against a curated discovery-tool feed gives a high-confidence,
    first-party detection that needs no runtime API lookup. A positive match means a known discovery binary
    ran on the host and should be triaged immediately against the process lineage and user context; a
    negative result does not rule out living-off-the-land discovery using native utilities. Maintain the
    feed from ATT&CK''s T1057 procedure inventory and tooling repositories, and ensure hashes are computed
    for both 4688 (if enabled) and Sysmon EID 1 where the ImageHash field is populated. References: [Process
    Discovery (T1057)](https://attack.mitre.org/techniques/T1057/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User Workstations, Domain Controllers, Application Servers, Web Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search EventCode=4688 OR (source=Sysmon EventCode=1)

      | eval h=coalesce(ProcessHash, Hashes)

      | lookup discovery_tool_feed sha256 AS h OUTPUT tool_name

      | where isnotnull(tool_name)

      | table _time, host, User, Image, ParentImage, h, tool_name'
- question: Among process-creation hashes that matched the discovery-tool feed, which executables are
    rare across the environment (e.g., present on fewer than 5 hosts or under 0.1% of endpoints over the
    last 30 days) and therefore warrant elevated priority?
  context: 'Not every match is equally suspicious; widely deployed admin tooling generates noise. Computing
    30-day prevalence per hash and weighting rare binaries higher focuses analysts on anomalous discovery
    activity consistent with a targeted intrusion. A binary seen on only one or two hosts is far more
    likely to represent adversary tooling than one on hundreds. Derive site-specific thresholds from the
    1st-percentile of your own per-binary host-count distribution rather than a fixed number, since environments
    differ. References: [SCADE](https://arxiv.org/abs/2412.04259).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User Workstations, Domain Controllers, Application Servers, Web Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EventCode=4688 OR (source=Sysmon EventCode=1) earliest=-30d

      | eval h=coalesce(ProcessHash,Hashes)

      | lookup discovery_tool_feed sha256 AS h OUTPUT tool_name | where isnotnull(tool_name)

      | stats dc(host) AS host_count by h, tool_name

      | where host_count < 5

      | sort host_count'
- question: When a discovery-tool hash matches, what is the model-derived risk score given the surrounding
    context (parent process, user privilege, command-line token rarity), and which top-3 features drove
    that score?
  context: 'A supervised classifier (Random Forest or Gradient Boosting) trained on labeled benign/malicious
    discovery executions reduces false positives by weighing context beyond the raw hash match: an unusual
    parent, a service or guest account, or rare command-line tokens all raise risk. Surfacing the top-3
    contributing features makes the alert explainable and speeds triage. A high score with an Office or
    web-worker parent and a privileged token is a strong indicator of adversary Discovery; a low score
    on a sanctioned admin host can be safely deprioritized. References: [CrowdStrike BERT command-line
    anomaly detection](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User Workstations, Domain Controllers, Application Servers, Web Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=discovery_risk_rf

      | features: hash_match, parent_image, user_priv, cmdline_token_rarity, host_prevalence

      | score each EID4688/Sysmon1 discovery event

      | where risk_score >= 0.8

      | annotate top3_features

      | table _time, host, User, Image, ParentImage, risk_score, top3_features'
- question: Did any host execute native enumeration utilities with verbose arguments (e.g., 'tasklist
    /v', 'wmic process list full', 'Get-Process | Format-List *', 'ps aux', 'ps -ef', 'esxcli system process
    list', 'show processes') across Windows, PowerShell, auditd, or macOS logs?
  context: 'Living-off-the-land Discovery relies on built-in tools rather than dropped binaries, so signature
    matching on verbose command-line arguments is essential. These specific argument forms are designed
    to dump comprehensive process detail and map directly to MITRE CAR-2016-03-001 and ATT&CK T1057. A
    match on Event ID 4688/Sysmon 1 command line, PowerShell 4104 script block, auditd execve, or macOS
    unified logs indicates active process enumeration; correlate the user, host, and timing to distinguish
    administration from reconnaissance. References: [MITRE CAR Host Discovery Commands (CAR-2016-03-001)](https://car.mitre.org/analytics/CAR-2016-03-001/),
    [ATT&CK T1057](https://attack.mitre.org/techniques/T1057/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 4104
  - 'NAI: User Workstations, Domain Controllers, Critical Servers, Development Environments, Centralized
    Log Management Platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (EventCode=4688 OR EventCode=1 OR EventCode=4104 OR source=auditd OR source=macos_unifiedlog)

      | regex CommandLine="(?i)(tasklist\s+/v|tasklist\s+/m|wmic\s+process\s+list\s+full|Get-Process\s*\|\s*Format-List|ps\s+aux|ps\s+-ef|esxcli\s+system\s+process\s+list|show\s+process)"

      | table _time, host, User, ParentImage, CommandLine'
- question: On which hosts does the hourly frequency of discovery commands exceed mean+3σ, or does the
    command-line Shannon entropy exceed the per-context high-entropy threshold, indicating bulk or obfuscated
    enumeration?
  context: 'Beyond static signatures, statistical baselining catches volume and obfuscation. Tracking
    hourly discovery-command frequency per host and alerting at mean+3σ flags abnormal bursts, while command-line
    Shannon entropy catches encoded or padded commands that evade regex. Weighting rare discovery tokens
    by BM25/log-entropy rarity (per SCADE) further isolates unusual usage. A simultaneous frequency and
    entropy spike is a strong indicator of scripted, possibly obfuscated, reconnaissance. References:
    [Elastic High Command Line Entropy](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html),
    [SCADE](https://arxiv.org/abs/2412.04259).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 4104
  - 'NAI: User Workstations, Domain Controllers, Critical Servers, Development Environments, Centralized
    Log Management Platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search discovery_commands earliest=-90d

      | bin _time span=1h

      | eval ent=shannon_entropy(CommandLine)

      | stats count AS freq, max(ent) AS max_ent by host, _time

      | eventstats avg(freq) AS m, stdev(freq) AS s by host

      | where freq > m+3*s OR max_ent > entropy_threshold'
- question: Are there command lines whose structure suggests encoding or character-substitution obfuscation
    of process-enumeration logic (e.g., Base64-encoded PowerShell process listing) as flagged by a language-model
    classifier?
  context: 'Sophisticated actors obfuscate discovery commands to bypass regex detections. An ELECTRA-style
    small language model trained with Invoke-DOSfuscation augmentation scores command-line text for obfuscation
    indicative of hidden enumeration. Including the top contributing tokens makes the alert actionable.
    A high obfuscation score on a command that decodes to process listing is a strong indicator of deliberate
    evasion; combine with parent/user context to confirm. References: [Tran et al. command-line obfuscation
    detection](https://arxiv.org/html/2408.02637v1).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 4104
  - 'NAI: User Workstations, Domain Controllers, Critical Servers, Development Environments, Centralized
    Log Management Platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=cmdline_obfuscation_electra

      | score CommandLine for EID4688/4104/auditd execve

      | where obfuscation_score >= 0.85

      | decode_payload CommandLine

      | where decoded matches process-enumeration intent

      | table _time, host, User, CommandLine, decoded, top_tokens'
- question: For each user or host, do observed discovery-command execution rates deviate significantly
    from a Seasonal-ARIMA forecast of their normal behavior?
  context: 'Discovery activity often appears as a deviation from an entity''s established rhythm. A Seasonal-ARIMA
    model per user/host forecasts expected discovery-command counts accounting for daily/weekly seasonality,
    and alerts when observed counts diverge from the forecast interval. This complements multi-order sequence
    baselines and catches both sudden spikes and unusual off-hours activity. A large positive residual
    on an account that rarely runs enumeration is a meaningful lead. References: [Statistical Learning
    for Anomaly Detection (Huang et al.)](https://ieeexplore.ieee.org/document/7065233/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - Windows Event ID 4104
  - 'NAI: User Workstations, Domain Controllers, Critical Servers, Development Environments, Centralized
    Log Management Platform (SIEM)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'search discovery_commands earliest=-90d

      | timechart span=1h count by user

      | forecast SARIMA(user) horizon=1

      | eval residual=actual-forecast

      | where residual > forecast_upper_bound

      | table _time, user, actual, forecast, residual'
- question: Was a process-discovery utility (tasklist.exe, Get-Process, wmic.exe, ps) launched by a parent
    that is not a shell or admin console — such as WINWORD.EXE, EXCEL.EXE, CHROME.EXE, w3wp.exe, httpd.exe,
    or java.exe?
  context: 'Legitimate process enumeration is typically initiated from a shell or administrative console.
    When a document application, browser, or web-server worker process spawns a discovery utility, it
    strongly suggests exploitation or a malicious macro/webshell performing post-compromise Discovery.
    This parent-lineage allowlist pattern (per SigmaHQ and CISA/NSA LOTL guidance) is a high-fidelity
    indicator. A positive result should trigger investigation of the parent process for initial-access
    or execution compromise. References: [Unusual Parent Process For Cmd.EXE](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/),
    [CISA/NSA LOTL](https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-038a).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User Workstations (especially for high-value users), Public-Facing Web Servers, Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search (EventCode=4688 OR EventCode=1)

      | where lower(Image) IN ("tasklist.exe","wmic.exe","powershell.exe","ps")

      | where lower(ParentImage) IN ("winword.exe","excel.exe","chrome.exe","w3wp.exe","httpd.exe","java.exe")

      | table _time, host, User, ParentImage, Image, CommandLine'
- question: For discovery commands, which parent-child process pairs have a conditional probability P(child
    | parent) below a learned rarity threshold (e.g., <0.0001), indicating an anomalous spawn relationship?
  context: 'Rather than a fixed allowlist, a frequency table of parent-child pairs lets you quantify how
    unusual a given spawn is. Alerting when P(discovery-child | parent) falls into the lower tail (per
    MITRE CAR-2014-11-002) surfaces rare lineages that signatures may miss. Derive the threshold from
    your own distribution. A discovery utility spawned by a parent that almost never spawns it is a statistically
    defensible anomaly worth triage. References: [MITRE CAR Outlier Parents of Cmd (CAR-2014-11-002)](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User Workstations (especially for high-value users), Public-Facing Web Servers, Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search (EventCode=4688 OR EventCode=1) earliest=-90d

      | where Image IN (discovery_utils)

      | stats count by ParentImage, Image

      | eventstats sum(count) AS ptot by ParentImage

      | eval p_child_given_parent=count/ptot

      | where p_child_given_parent < 0.0001'
- question: Do the process-creation and process-access edges around discovery activity form structurally
    anomalous subgraphs (e.g., an Office app directly spawning tasklist.exe) when scored by a provenance-graph
    model?
  context: 'Provenance-graph learning (KAIROS temporal GNN autoencoder, ThreaTrace GraphSAGE) models normal
    process-tree structure and flags edges that are structurally improbable. This captures multi-step
    lineages that pairwise rules miss and can reconstruct the causal subgraph for explainable triage.
    A high anomaly score on a subgraph linking initial access to discovery utilities is a strong indicator
    of intrusion; the reconstructed subgraph guides the analyst to the root cause. References: [KAIROS
    temporal GNN autoencoder](https://tfjmp.org/publications/2024-sp.pdf), [ThreaTrace GraphSAGE node-level](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User Workstations (especially for high-value users), Public-Facing Web Servers, Application
    Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=provenance_gnn (KAIROS/ThreaTrace)

      | ingest process_creation + process_access edges

      | score nodes/edges for discovery utilities

      | where edge_anomaly_score >= threshold

      | reconstruct causal_subgraph

      | table _time, host, root_process, anomalous_edge, subgraph'
- question: Did any single host or user account execute more than 20 distinct discovery commands (tasklist,
    ps, Get-Process, wmic process, systeminfo, whoami) within a five-minute window?
  context: 'Automated reconnaissance scripts fire many discovery commands in rapid succession, a pattern
    unlike interactive administration. A threshold rule (>20 distinct discovery commands in 5 minutes)
    per MITRE CAR-2016-03-001 reliably flags this scripted enumeration. A positive result indicates likely
    automated Discovery and should be triaged against the originating process and account; legitimate
    inventory scripts can be allowlisted by host/account. References: [MITRE CAR Host Discovery Commands
    (CAR-2016-03-001)](https://car.mitre.org/analytics/CAR-2016-03-001/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, VPN Concentrators, Active Directory Domain Controllers'
  range: Last 24 hours
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search discovery_commands

      | bin _time span=5m

      | stats dc(CommandLine) AS distinct_cmds, values(CommandLine) AS cmds by host, User, _time

      | where distinct_cmds > 20'
- question: Which users exceed their rolling 1-hour discovery-command baseline (count > mean+3σ, Z-score
    > 3), and are there clusters of access-denied process-access failures (Sysmon EID 10 failures, auditd
    EACCES on /proc) indicating unprivileged enumeration attempts?
  context: Static thresholds miss users with naturally high or low activity, so rolling per-user baselines
    with a Z-score>3 trigger adapt to each entity. Separately, access-denied process-access failures reveal
    attempts to enumerate processes the account cannot read — a distinct signal of an unprivileged adversary
    probing the system. Together they cover both successful bursts and failed enumeration. Investigate
    accounts that spike above baseline or generate repeated access-denied process reads.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, VPN Concentrators, Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search discovery_commands earliest=-90d

      | bin _time span=1h

      | stats count by User, _time

      | eventstats avg(count) AS m, stdev(count) AS s by User

      | eval z=(count-m)/s | where z > 3

      | append [search (Sysmon EventCode=10 Granted=0) OR (auditd openat /proc EACCES) | stats count by
      User, host]'
- question: Do any per-user command sequences follow low-probability transitions that culminate in process
    enumeration, as scored by a multi-order Markov/n-gram model?
  context: 'The order in which commands occur carries signal: a transition into process enumeration from
    an unusual preceding state is suspicious even when individual commands are benign. A multi-order Markov/n-gram
    model of normal per-user command flow (per Huang et al. and Warrender et al.) flags improbable sequences
    ending in discovery. Surfacing the specific improbable transition explains the alert. This catches
    scripted reconnaissance whose individual commands evade thresholds. References: [Statistical Learning
    for Anomaly Detection (Huang et al.)](https://ieeexplore.ieee.org/document/7065233/), [Warrender et
    al.](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, VPN Concentrators, Active Directory Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=cmd_sequence_markov per user

      | score command transition probabilities

      | where seq_prob < 1e-5 AND terminal_cmd IN (discovery_utils)

      | table _time, User, host, command_sequence, improbable_transition, seq_prob'
- question: Do discovery-command events form dense micro-clusters in (host_id, user_id, timestamp) space,
    as detected by DBSCAN, that represent automated reconnaissance scripts?
  context: Automated enumeration produces tightly grouped events in time on a single host/user. DBSCAN
    on (host_id, user_id, timestamp) features surfaces these dense micro-clusters without a preset count
    threshold, adapting to varied script behaviors. Reporting the contributing commands and time window
    makes the cluster actionable. A dense cluster of varied discovery commands on one account within seconds
    is a strong indicator of an automated reconnaissance script.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: All Endpoints and Servers, VPN Concentrators, Active Directory Domain Controllers'
  range: Last 7 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=DBSCAN(eps, min_samples)

      | features: host_id, user_id, timestamp(discovery commands)

      | fit/predict clusters

      | where cluster_id != -1 AND cluster_density high

      | table cluster_id, host, User, window_start, window_end, commands'
- question: Did any post-authentication remote session to a network device or ESXi host (SSH/Telnet on
    ports 22/23) execute process-enumeration commands ('show processes', 'esxcli system process list',
    'ps') from a source outside the administrative allowlist?
  context: 'Network devices and hypervisors are high-value targets where process enumeration via native
    CLI signals adversary orientation. Correlating Zeek conn.log sessions on ports 22/23 with authentication
    logs, then flagging post-auth execution of discovery commands from non-allowlisted sources, ties the
    discovery action to a specific, possibly unauthorized, session. A positive result on a core router
    or ESXi host from an unexpected source IP warrants immediate investigation for device compromise.
    References: [ATT&CK T1057](https://attack.mitre.org/techniques/T1057/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Network Management Subnet, Core Routers and Switches, Firewalls, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search source=zeek_conn (id.resp_p=22 OR id.resp_p=23)

      | join cid [search source=device_auth result=success]

      | join cid [search source=device_cmd command IN ("show processes","esxcli system process list","ps")]

      | where NOT cidrmatch(admin_allowlist, id.orig_h)

      | table ts, id.orig_h, user, device, command'
- question: Which device administration sessions that include process discovery deviate on two or more
    baseline metrics (source IP ASN, login hour, session duration), and are there correlated failed logons
    or blocked connections in Zeek conn.log?
  context: 'Per-admin baselines for source ASN, login hours, and session duration let you flag process-discovery
    sessions that look unlike that admin''s norm. Requiring deviation on two or more metrics reduces false
    positives. Profiling failure-mode signals — failed logons and blocked/rejected connections — as distinct
    indicators catches unauthorized access attempts preceding successful discovery. A session deviating
    on multiple metrics that also runs enumeration is a strong indicator of compromised or stolen admin
    access. References: [CISA/NSA LOTL](https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-038a).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Network Management Subnet, Core Routers and Switches, Firewalls, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search source=zeek_ssh OR source=device_auth earliest=-90d

      | stats by admin, src_asn, login_hour, duration

      | eval dev_asn=..., dev_hour=..., dev_dur=...

      | eval deviations=dev_asn+dev_hour+dev_dur

      | where session_has_discovery AND deviations >= 2

      | append [search source=zeek_conn (conn_state=REJ OR REJ failed_login) | stats count by id.orig_h,
      device]'
- question: Do any network-device administration sessions follow low-probability command transitions ending
    in process discovery (e.g., 'show version' -> 'show arp' -> 'show processes'), as scored by a Markov/n-gram
    model of legitimate device commands?
  context: 'Legitimate device administration follows habitual command patterns; adversaries exploring
    an unfamiliar device produce atypical sequences. A Markov chain or n-gram model trained on legitimate
    device command sequences (per Warrender et al. and Huang et al.) flags sessions whose transitions
    are improbable and terminate in process enumeration. Including the anomalous transition in the alert
    aids triage. A low-probability path ending in ''show processes'' from a remote session is a meaningful
    Discovery lead on critical network infrastructure. References: [Warrender et al.](https://ieeexplore.ieee.org/document/766910),
    [Statistical Learning for Anomaly Detection (Huang et al.)](https://ieeexplore.ieee.org/document/7065233/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Network Management Subnet, Core Routers and Switches, Firewalls, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=device_cmd_markov

      | score session command transitions

      | where seq_prob < 1e-4 AND terminal_cmd IN ("show processes","ps","esxcli system process list")

      | table ts, device, src_ip, user, command_sequence, anomalous_transition, seq_prob'
