name: 'T1592.003: Firmware'
id: 02c039f9-2703-4e2b-9c95-7127d4d566a7
description: 'Investigate evidence that an adversary is actively gathering information about the organization''s
  host and device firmware to support targeting (MITRE ATT&CK T1592.003, Reconnaissance). Firmware reconnaissance
  lets an actor infer host configuration, purpose, age, and patch level - revealing exploitable weaknesses
  and informing later initial-access or supply-chain operations. This playbook helps an analyst hunt for:
  external HTTP/S fingerprinting of device web assets, version-disclosing paths, and scanner User-Agents
  in web/WAF/Zeek logs; horizontal and vertical network scans visible in firewall, VPC flow, and Netflow
  data; probes against management-plane ports and protocols (IPMI, SNMP, Telnet, Redfish/BMC) that enumerate
  system or firmware identity; and post-compromise local discovery of firmware/hardware details via Windows
  commands and WMI/CIM queries, and via Linux/macOS tooling such as dmidecode, lshw, lspci, system_profiler,
  ioreg, and reads of /sys/class/dmi/id. Each question pairs symbolic-logic watchlists, statistical baselining,
  and machine-learning anomaly detection so analysts can confirm or rule out firmware-focused reconnaissance.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are inbound HTTP/S requests in web server, WAF, or Zeek http.log carrying URIs, User-Agent
    strings, or header combinations that match known device/firmware fingerprinting or scanner signatures?
  context: During Reconnaissance an adversary fingerprints public-facing devices by requesting default
    web assets, version-disclosing paths, and vendor admin pages to infer firmware type and version. Matching
    requests against a curated signature list (built from SigmaHQ web rules and the firmware/banner fingerprint
    catalogue in Costin et al.) flags this enumeration. A positive hit means an external client is probing
    for device-specific assets; a clean result lowers suspicion of HTTP fingerprinting against that asset.
    Pivot on the source IP to correlate with scanning and management-port activity.
  answer_sources: &id001
  - Web Server Access Logs
  - WAF Logs
  - Zeek http.log
  - 'NAI: Public-facing web servers, API gateways, management interfaces for network appliances, load
    balancers, Web Application Firewalls (WAFs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search web/waf/zeek_http logs

      | where uri MATCHES firmware_fingerprint_regex OR user_agent IN scanner_ua_list OR header_combo
      IN fingerprint_headers

      | stats count, values(uri) by src_ip

      | alert'
- question: Which external source IPs exhibit an abnormally high ratio of failed (401/403/404/5xx) fingerprinting
    requests, indicating blind enumeration of firmware/device endpoints?
  context: Scanners performing blind enumeration generate many errors because they request paths that
    do not exist on most hosts. Profiling each source IP's share of error responses and comparing against
    the 95th percentile of a 30-day benign distribution surfaces enumeration even at low request volumes.
    Apply the Jung et al. sequential (TRW/SPRT) approach so a high failed-to-successful ratio fires after
    only a handful of requests. A high error ratio is strong evidence of automated firmware reconnaissance.
  answer_sources: *id001
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search web/waf logs over 30d

      | stats fail=countif(status>=400), total=count by src_ip

      | eval err_ratio = fail/total

      | where err_ratio > p95(err_ratio_baseline)

      | apply SPRT(success,fail) -> scanner_verdict

      | alert on scanner_verdict'
- question: Are there source IPs sending high-volume requests with low-entropy or empty User-Agent strings
    characteristic of default tooling, rather than real browsers?
  context: Automated scanners commonly use empty or static, low-variability User-Agent strings (tooling
    defaults). Flagging source IPs whose UA-string entropy falls in the bottom 5th percentile AND whose
    request rate exceeds the per-source 99th percentile captures the automated-scanner physics described
    in the ZMap paper. A match indicates non-human, bulk fingerprinting traffic; legitimate browsers and
    APIs produce richer, more varied UAs.
  answer_sources: *id001
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search web/waf logs

      | eval ua_entropy = shannon_entropy(user_agent)

      | stats min(ua_entropy) as ent, count as reqs by src_ip

      | where ent <= p5(ua_entropy_dist) AND reqs >= p99(req_rate_dist)

      | alert'
- question: Does a trained URI classifier flag inbound web traffic as firmware/device fingerprinting based
    on non-public asset paths, default-credential parameters, or version endpoints?
  context: A supervised classifier trained on URI patterns tied to firmware/device fingerprinting (non-public
    JS/asset paths, default-credential GET parameters, version endpoints) generalizes beyond static regex.
    Labels are derived from SigmaHQ and the Costin et al. fingerprint corpora. Score inbound web logs
    and emit the top-3 contributing tokens/features per alert so analysts can validate the verdict. High-confidence
    positives warrant pivoting on the source for broader recon activity.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Web-log classifier
    query: "model = load(firmware_uri_classifier)\nfor req in web_logs:\n    score, top_tokens = model.predict(features(req.uri,\
      \ req.params))\n    if score > threshold: alert(req.src_ip, score, top_tokens)"
- question: Which external sources are flagged as anomalous when their per-source web request feature
    vectors are scored with an Isolation Forest?
  context: Per-source request feature vectors (URI length, special-char count, UA entropy, header set,
    byte volume, error ratio) capture multidimensional scanner behavior that single rules miss. Scoring
    with an Isolation Forest highlights sources that deviate from the bulk of benign clients. Surface
    the top-3 features driving each high anomaly score for triage. Anomalous clusters often correspond
    to coordinated firmware fingerprinting; benign API/browser traffic clusters densely and scores low.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Web-log classifier
    query: 'X = per_source_features(web_logs)  # uri_len, special_chars, ua_entropy, header_set, bytes,
      err_ratio

      model = IsolationForest().fit(X)

      scores = model.score(X)

      alert sources where score in top anomalies, report top3 features'
- question: Is any single external source IP contacting more than ~50 unique internal hosts (horizontal
    scan) or more than ~100 unique ports on one host (vertical scan) within a 5-minute window?
  context: Mass scanning fans out across many hosts or ports quickly. Fixed thresholds grounded in the
    ZMap fan-out documentation (>50 unique internal hosts, or >100 unique ports on one host, within 5
    minutes) catch this reliably. Tune the counts and window to the site baseline but keep a floor. A
    breach of either threshold is strong evidence of network reconnaissance preceding firmware fingerprinting;
    pivot to see whether the same source hits management ports or web fingerprint paths.
  answer_sources: &id002
  - Firewall Logs
  - VPC Flow Logs
  - Netflow/sFlow
  - 'NAI: Perimeter firewalls, network tap at the internet edge, cloud VPC flow logs, cloud security group
    flow logs.'
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search firewall/flow logs window=5m

      | stats dc(dst_host) as hosts, dc(dst_port) as ports by src_ip, dst_host

      | where hosts > 50 OR ports > 100

      | alert'
- question: Which external IPs have unique-host/unique-port fan-out or total flow volume exceeding the
    99.5th percentile of the 30-day per-source distribution, including slow scanners below fixed thresholds?
  context: Slow or 'low-and-slow' scanners stay under fixed thresholds but still stand out statistically.
    Flagging IPs whose fan-out or flow volume exceeds the 99.5th percentile of a 30-day per-source distribution
    catches them (per ZMap). This complements the fixed-threshold rule by detecting patient reconnaissance.
    A source in the extreme tail of fan-out is likely enumerating the environment to inventory devices
    and firmware.
  answer_sources: *id002
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search flow logs over 30d

      | stats dc(dst_host) as hosts, dc(dst_port) as ports, sum(bytes) as vol by src_ip

      | where hosts > p99_5(host_dist) OR ports > p99_5(port_dist) OR vol > p99_5(vol_dist)

      | alert'
- question: Do external sources show a high ratio of failed first-contact connections (blocked, RST, no-response)
    that a sequential hypothesis test classifies as scanning?
  context: Scanners contact many endpoints that reject or do not answer, producing a high failed-to-successful
    first-contact ratio. Applying the Threshold Random Walk / SPRT from Jung et al. to each source's success/fail
    state yields a scanner verdict within 4-5 attempts with a bounded false-positive rate. This is a fast,
    statistically principled scan detector. A scanner verdict on a source probing internal/management
    hosts indicates active reconnaissance.
  answer_sources: *id002
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each src_ip, stream first-contact outcomes (success/fail)

      | update TRW/SPRT likelihood ratio

      | if LR crosses scanner threshold (within ~4-5 attempts): verdict=scanner

      | alert'
- question: Are there rhythmic or periodic connection-timing patterns from a source whose ARIMA residuals
    exceed 3 sigma, indicating automated scanning?
  context: Automated scanners often connect with machine-regular timing. Training ARIMA on benign per-source
    connection inter-arrival timing and flagging residuals beyond 3 sigma surfaces rhythmic/periodic scanning
    that human traffic rarely produces. A strong periodic residual signature points to scripted enumeration;
    benign user traffic is bursty and irregular.
  answer_sources: *id002
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'build per-source inter-arrival time series

      fit ARIMA(benign)

      resid = observed - predicted

      alert where |resid| > 3*sigma (periodic/rhythmic pattern)'
- question: Which inbound network flows produce high reconstruction error when scored with a Kitsune-style
    autoencoder ensemble, indicating scanning/recon behavior?
  context: An autoencoder ensemble (Kitsune) learns normal flow structure and spikes its reconstruction
    error on anomalous traffic. Scoring inbound flow feature vectors (unique-host/port fan-out, bytes,
    packet rate, jitter, failed-connection count) and alerting on error spikes detects novel scanning
    without explicit signatures. Report the top-3 contributing channel features per alert. High reconstruction
    error on fan-out features is consistent with reconnaissance scanning.
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/Network anomaly pipeline
    query: 'X = flow_features(inbound)  # fan_out, bytes, pkt_rate, jitter, failed_conn

      ae = Kitsune(); err = ae.score(X)

      alert flows where err > threshold, report top3 feature channels'
- question: Are external IPs connecting to watchlisted management ports (IPMI 623, SNMP 161, Telnet 23,
    Redfish/BMC, appliance SSH) or sending enumeration queries to retrieve system/firmware info?
  context: Management-plane services expose rich firmware and hardware identity. Alerting when external
    IPs hit watchlisted management ports/protocols (built from SigmaHQ and ZMap scanning behaviors) or
    send enumeration queries flags direct firmware reconnaissance against the management plane. External
    access to these ports is rarely legitimate; a positive hit on a BMC/IPMI/SNMP probe strongly suggests
    targeted device reconnaissance.
  answer_sources: &id003
  - Firewall Logs
  - Zeek conn.log
  - Zeek weird.log
  - Zeek snmp.log
  - 'NAI: Network segments hosting IoT/OT devices, data center management networks, network appliance
    management interfaces, blade server chassis management interfaces.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search firewall/zeek_conn logs

      | where src_ip is external AND dst_port IN (623,161,23, redfish, bmc, appliance_ssh)

      | OR enumeration_query detected (snmp.log/weird.log)

      | stats count by src_ip, dst_host, dst_port

      | alert'
- question: Has any external IP attempted to connect to a sensitive unencrypted management port (Telnet
    23, FTP 21) on a device that should only expose encrypted management?
  context: Devices that should be administered only over encrypted channels should never receive external
    Telnet (23) or FTP (21) connection attempts. Any such attempt from an external IP is anomalous and
    may indicate an adversary probing legacy management interfaces that often leak firmware/version banners.
    This is a high-fidelity, low-false-positive signal; investigate the target device's exposure immediately.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search firewall/zeek_conn logs

      | where src_ip is external AND dst_port IN (23,21) AND dst_host in encrypted_only_mgmt_assets

      | alert'
- question: Which source IPs have an unusually high ratio of management-port to web-port connection attempts,
    with denied management connections above the 95th percentile?
  context: Reconnaissance focused on devices skews toward management ports rather than ordinary web traffic.
    Flagging IPs whose management-to-web connection ratio is in the top 2 percentile of the 30-day distribution,
    and whose blocked/denied management connections exceed the 95th percentile (per Jung et al.), surfaces
    sources specifically targeting the management plane. A high ratio with many denials indicates blind
    probing for firmware/device interfaces.
  answer_sources: *id003
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search conn logs over 30d

      | stats mgmt=countif(port in mgmt_ports), web=countif(port in web_ports), denied=countif(action=deny
      AND port in mgmt_ports) by src_ip

      | eval ratio = mgmt/(web+1)

      | where ratio > p98(ratio_dist) AND denied > p95(denied_dist)

      | alert'
- question: Which sources are flagged anomalous when Zeek weird.log/snmp.log feature rows are scored with
    an Isolation Forest?
  context: Protocol anomalies and SNMP enumeration leave traces in Zeek weird.log and snmp.log. Scoring
    feature rows (event-type counts, byte volume, source fan-out, failed-query rate) with an Isolation
    Forest highlights sources behaving unlike normal traffic. Surface the top-3 features per high-anomaly
    alert. Anomalous SNMP/weird activity from external sources is consistent with firmware/device enumeration;
    benign management traffic scores low.
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/Network anomaly pipeline
    query: 'X = features(zeek_weird, zeek_snmp)  # event_type_counts, bytes, src_fanout, failed_query_rate

      model = IsolationForest().fit(X)

      alert rows where score in top anomalies, report top3 features'
- question: Do Windows process-creation or PowerShell logs show firmware/hardware discovery commands (wmic
    bios, wmic baseboard, systeminfo, msinfo32, Get-WmiObject win32_bios, Get-CimInstance Win32_BIOS),
    especially several in rapid succession?
  context: Post-compromise, an adversary enumerates local/remote firmware and hardware to profile the
    host. Watchlisting these commands in Sysmon EID 1 and PowerShell EID 4103, and burst-correlating several
    discovery commands in rapid succession on one host (per CAR-2016-03-001 and SigmaHQ), flags this discovery.
    Isolated use can be legitimate admin activity; a burst of varied firmware queries on one host is a
    strong discovery signal warranting host investigation.
  answer_sources: &id004
  - Sysmon Event ID 1 (ProcessCreate)
  - Windows PowerShell Event ID 4103
  - 'NAI: Domain Controllers, administrator workstations, virtualization hosts, critical application servers,
    endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search sysmon(EID=1) OR powershell(EID=4103)

      | where cmdline MATCHES (''wmic bios'',''wmic baseboard'',''systeminfo'',''msinfo32'',''Get-WmiObject
      win32_bios'',''Get-CimInstance Win32_BIOS'')

      | stats count, dc(cmd_pattern) as variety by host, user, 10m_window

      | where count high OR variety >= 3

      | alert'
- question: Are firmware/hardware discovery utilities on Windows being spawned by new or rare parent processes
    (web server, Office, scripting host) versus their normal parents?
  context: Discovery utilities launched by anomalous parents (w3wp, winword, wscript) often indicate execution
    via exploitation or malware rather than an administrator. Building a multi-week per-host baseline
    of normal parent processes for these utilities and alerting on new/rare parents (per CAR-2014-11-002)
    catches this. A discovery command spawned by a web server or Office application is high-fidelity evidence
    of post-compromise reconnaissance.
  answer_sources: *id004
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline parent_proc distribution per host for discovery_utils (multi-week)

      search new events

      | where parent_proc NOT IN baseline_parents[host] (rare/new)

      | alert (e.g., w3wp/winword/wscript -> systeminfo/wmic)'
- question: Do any hosts or users show discovery-command frequency in a 1-hour window exceeding 3 sigma
    over baseline, or rare command-sequence n-grams?
  context: A surge of discovery commands over normal levels indicates active enumeration. Baselining discovery-command
    frequency per host/user and flagging 1-hour windows beyond 3 sigma, plus rare-n-gram scoring of command
    sequences (t-stide model of Warrender et al.), detects both volume spikes and unusual orderings. Spikes
    coupled with rare sequences strengthen confidence that automated or scripted firmware discovery is
    underway.
  answer_sources: *id004
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline discovery_cmd freq per host/user (hourly)

      flag windows where count > mean + 3*sigma

      also score command n-grams with t-stide; flag rare n-grams

      | alert'
- question: Does a DeepLog-style LSTM flag low-probability discovery command chains on Windows (e.g.,
    systeminfo -> wmic bios -> reg query HARDWARE)?
  context: Adversary discovery follows characteristic chains that differ from benign sequences. Training
    a DeepLog-style LSTM on benign command/event sequences and flagging low-probability discovery chains,
    while reporting the deviating step, detects scripted enumeration even when individual commands are
    common. A low-probability chain ending in firmware/hardware reads is a strong post-compromise discovery
    indicator.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/Sequence/Graph model
    query: "model = DeepLog_LSTM(trained on benign cmd sequences)\nfor seq in host_command_streams:\n\
      \    p, dev_step = model.next_prob(seq)\n    if p < threshold: alert(host, seq, dev_step)"
- question: Does a ThreaTrace provenance GNN localize anomalous process/registry (or /sys/class/dmi) nodes
    performing bulk firmware/hardware identity reads?
  context: Provenance graphs link processes, files, and registry/keys; bulk firmware/hardware identity
    reads (Win32_BIOS, HKLM\HARDWARE, or /sys/class/dmi/id) form anomalous subgraphs. Applying the ThreaTrace
    GraphSAGE model localizes the anomalous node for triage rather than just flagging a log line. The
    implicated node and its lineage show how the discovery occurred, supporting scoping of a post-compromise
    intrusion.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/Sequence/Graph model
    query: 'G = build_provenance_graph(host telemetry)

      ThreaTrace_GraphSAGE.score_nodes(G)

      alert nodes with high anomaly performing bulk reads of Win32_BIOS / HKLM\HARDWARE / /sys/class/dmi/id

      surface node + lineage'
- question: Do Linux/macOS execution logs show firmware/hardware discovery commands (dmidecode, lshw,
    lspci, system_profiler SPHardwareDataType, ioreg, reads of /sys/class/dmi/id), particularly several
    in rapid succession?
  context: On Linux/macOS, adversaries enumerate firmware/hardware with dmidecode, lshw, lspci, system_profiler,
    ioreg, or by reading /sys/class/dmi/id. Alerting on these via auditd, macOS Unified Logs, osquery,
    or bash history - and on several executing in rapid succession (per CAR-2016-03-001 and SigmaHQ) -
    flags post-compromise discovery. A burst of varied hardware queries on one host indicates active reconnaissance
    rather than routine administration.
  answer_sources: &id005
  - Linux auditd logs
  - macOS Unified Logs (process execution)
  - osquery
  - Bash history
  - 'NAI: Linux servers, macOS endpoints, administrator workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search auditd/unified_logs/osquery/bash_history

      | where exec IN (''dmidecode'',''lshw'',''lspci'',''system_profiler SPHardwareDataType'',''ioreg'')
      OR file_read MATCHES ''/sys/class/dmi/id/''

      | stats count, dc(tool) as variety by host, user, 10m_window

      | where count high OR variety >= 3

      | alert'
- question: Are Linux/macOS firmware discovery tools being run by unexpected users, from anomalous parent
    processes, or at unusual times, or with frequency above 3 sigma?
  context: Legitimate hardware-inspection tools are typically run by admins at predictable times from
    known parents. Baselining who/when/parent for these tools and alerting on execution by an unexpected
    (non-root/non-admin) user, anomalous parent, or unusual time (baseline-and-subtract per CAR-2014-11-002),
    plus flagging 1-hour frequency beyond 3 sigma (Warrender et al.), catches stealthy discovery. Off-baseline
    execution of dmidecode/lshw by a service account or web process is high-fidelity evidence of compromise.
  answer_sources: *id005
  range: Last 90 days (build baseline over 30+ days; correlate +/- 1 hour around events)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline user/time/parent for discovery_tools per host (multi-week)

      search new events

      | where user NOT IN expected_users OR parent rare OR time unusual

      | also flag hourly freq > mean + 3*sigma

      | alert'
- question: Does a DeepLog-style sequence model flag low-probability post-compromise discovery chains
    on Linux/macOS (e.g., whoami -> uname -a -> dmidecode)?
  context: Post-compromise enumeration follows recognizable chains that differ from normal usage. A DeepLog-style
    sequence model trained on benign command sequences flags low-probability discovery chains and names
    the deviating step. A chain such as whoami -> uname -a -> dmidecode scoring as improbable is strong
    evidence of scripted reconnaissance; the named deviating step accelerates analyst triage.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: ML/Sequence/Graph model
    query: "model = DeepLog_seq(trained on benign shell sequences)\nfor seq in host_command_streams:\n\
      \    p, dev_step = model.next_prob(seq)\n    if p < threshold: alert(host, seq, dev_step)  # e.g.\
      \ whoami->uname->dmidecode"
- question: Does a ThreaTrace provenance GNN localize anomalous process/registry (or /sys/class/dmi) nodes
    performing bulk firmware/hardware identity reads?
  context: Provenance graphs link processes, files, and registry/keys; bulk firmware/hardware identity
    reads (Win32_BIOS, HKLM\HARDWARE, or /sys/class/dmi/id) form anomalous subgraphs. Applying the ThreaTrace
    GraphSAGE model localizes the anomalous node for triage rather than just flagging a log line. The
    implicated node and its lineage show how the discovery occurred, supporting scoping of a post-compromise
    intrusion.
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: ML/Sequence/Graph model
    query: 'G = build_provenance_graph(host telemetry)

      ThreaTrace_GraphSAGE.score_nodes(G)

      alert nodes with high anomaly performing bulk reads of Win32_BIOS / HKLM\HARDWARE / /sys/class/dmi/id

      surface node + lineage'
