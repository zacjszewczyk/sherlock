name: 'T1555.002: Securityd Memory'
id: 25e98766-f39b-4952-8c08-10d2b30baa18
description: Investigate whether an adversary with root or equivalent privileges has attempted to extract
  credentials by reading the memory of the macOS securityd daemon (or analogous Linux credential daemons).
  securityd caches the user's logon master key (PBKDF2-derived) in memory, so a privileged attacker can
  scan its heap to recover the keychain master key and decrypt plaintext passwords for users, WiFi, mail,
  browsers, certificates, and secure notes. This playbook helps an analyst hunt for execution of keychain/securityd
  credential-dumping tooling (e.g., keychaindump, OSX/Keydnap), suspicious use of memory-inspection utilities
  (gdb, lldb, dtrace, strings, vmmap) against securityd, unauthorized memory-read API calls (task_for_pid,
  mach_vm_read, ptrace, /proc/<pid>/mem), heap-scan read-volume bursts and failed master-key trials, and
  the full kill chain of securityd PID discovery -> memory read -> outbound exfiltration. It combines
  symbolic-logic detections, statistical rarity and anomaly scoring, and machine-learning models across
  endpoint (macOS Unified Log, ESF, auditd) and network (Zeek) telemetry.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
