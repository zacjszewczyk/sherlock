- question: Do network-flow autoencoders flag traffic from remote-session hosts as structurally anomalous
    compared with normal remote-access usage?
  context: 'Flow-level autoencoders are useful when host telemetry is partial but network behavior still
    looks unusual in timing, packet sizes, or byte ratios. Analysts should review the per-feature reconstruction
    error to understand whether the anomaly reflects scanning, staging, tunneling, or a benign but previously
    unseen remote workflow. Authoritative sources: [Mirsky et al., ''Kitsune: An Ensemble of Autoencoders
    for Online Network Intrusion Detection,'' NDSS, 2018](https://doi.org/10.14722/ndss.2018.23204); [Kitsune-py
    code](https://github.com/ymirsky/Kitsune-py).'
