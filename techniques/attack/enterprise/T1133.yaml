      score>=0.85; OUTPUT top_shap_3.
- question: Do successful remote sessions form isolated clusters based on geography, ASN, user-agent,
    MFA outcome, duration, and transferred bytes that differ from normal access patterns?
  context: 'Cluster analysis helps catch suspicious access that is not obviously bad in any single field
    but is unusual as a full session profile. Analysts should inspect small or isolated clusters containing
    successful logins because they can represent one-off intrusion sessions rather than routine remote
    work. Authoritative sources: [Liu et al., ''Isolation-Based Anomaly Detection,'' ACM TKDD, 2012](https://doi.org/10.1145/2133360.2133363).'
