  - technology: IdP/SIEM correlation pseudocode
    query: SEARCH successful external logins WHERE (mfa_not_required OR mfa_bypassed OR mfa_failed_before_success)
      AND device_id_or_user_agent first_seen_for user in 90d; RETURN user, source_ip, device_id, ua, mfa_status.
- question: Do any successful external logins rely on legacy or password-only authentication methods that
    should no longer be used for remote access?
  context: 'Legacy authentication is valuable to investigate because it can bypass modern controls and
    often indicates policy drift or deliberate abuse. The analyst should validate whether the method is
    truly sanctioned for the user, device, and source location before treating it as benign. Authoritative
    sources: [SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma).'
  answer_sources:
