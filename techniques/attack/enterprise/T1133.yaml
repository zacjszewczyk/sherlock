- question: Are outbound byte volume or internal-host counts during a remote session above the user's
    normal historical percentile for the same time of day?
  context: 'Time-of-day conditioning matters because normal remote work during office hours may differ
    significantly from late-night or weekend access. Analysts should check whether the current session
    is unusually expansive compared with the user''s own historical behavior at comparable times. Authoritative
    sources: [Kent, ''Cybersecurity Data Sources for Dynamic Network Research,'' Dynamic Networks and
    Cyber-Security, 2015](https://doi.org/10.1142/9781786340757_0002).'
