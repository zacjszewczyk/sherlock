  range: Last 90 days, with rolling 30-day per-user baselines and a 60-minute lookback for prior failures.
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline user+service over 30d for source_country, source_asn, device_fingerprint; FLAG success
      events below 5th percentile or first-seen combinations; ANNOTATE prior failure bursts from same
      source.
- question: Are there source IPs whose failed-authentication rate is abnormally high for the environment
    and that still achieve at least one successful remote login?
  context: 'Failure rate is a useful signal because an operator using stolen or guessed credentials often
    produces many misses before one success. Analysts should look for ratios that are extreme relative
    to the baseline and confirm that a success occurred in the same period. Authoritative sources: [Siadati
    and Memon, ''Detecting Structurally Anomalous Logins Within Enterprise Networks,'' ACM CCS, 2017](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
