name: 'T1133: External Remote Services'
id: b196916d-658e-4bb3-9982-889cba196336
description: Investigate adversary use of internet-facing remote access paths such as VPN, RDP gateways,
  SSH, cloud identity providers, exposed administrative services, and container control planes. This playbook
  covers malicious-source logins, exposed admin-port access, anomalous post-auth behavior, MFA and device
  anomalies, password spraying, failure-to-success compromise patterns, unusual client fingerprints, dormant-account
  reactivation, and scripted reauthentication patterns that can indicate both initial access and persistence
  through external remote services.
type: technique
related:
- tactic_id: TA0001
  tactic_name: Initial Access
- tactic_id: TA0003
  tactic_name: Persistence
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.2'
tags: none
questions:
- question: Are any successful remote-service authentications originating from known malicious IPs, TOR
    exits, or anonymizing infrastructure that are not approved enterprise access paths?
  context: 'Start by normalizing successful logins across VPN, RDP, SSH, and cloud IdP telemetry and enriching
    them with threat reputation. This gives analysts a direct, deterministic answer about whether the
    organization is being accessed from infrastructure already associated with abuse. Authoritative sources:
    [MITRE ATT&CK T1133 — External Remote Services](https://attack.mitre.org/techniques/T1133/); [SigmaHQ
    Detection Rules Repository](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 1149
  - Zeek conn.log
  - Zeek ssh.log
  - VPN authentication logs
  - Azure AD Sign-In logs
  - Okta System Log
  - AWS CloudTrail logs
  - 'NAI: VPN Concentrators, RDP Gateways, Citrix/VMware Horizon Infrastructure, Cloud Identity Providers
    (Azure AD, Okta), Network Perimeter'
  range: Last 90 days, prioritizing successful remote logins from the last 24 hours.
  queries:
  - technology: SIEM/Enrichment pseudocode
    query: auth = normalize_successful_remote_logins(); enrich auth.source_ip WITH tor_exit_list, malicious_ip_feeds,
      approved_access_ranges; ALERT where reputation_hit=true AND allowlisted=false; OUTPUT user, source_ip,
      service, timestamp, match_reason.
- question: Can a suspicious remote authentication be confirmed by matching the identity event to a completed
    external network session on an internet-facing service?
  context: 'Authentication records alone can be incomplete or ambiguous, especially when services are
    proxied. Correlating them to network sessions confirms that the login translated into a real external
    connection and gives the analyst host, port, duration, and transfer context. Authoritative sources:
    [Ghorbani, Lu, and Tavallaee, ''Network Intrusion Detection and Prevention,'' Springer, 2010](https://doi.org/10.1007/978-0-387-88771-5);
    [Cortex XSOAR T1133 Playbook](https://xsoar.pan.dev/docs/reference/index).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 1149
  - Zeek conn.log
  - Zeek ssh.log
  - VPN authentication logs
  - Azure AD Sign-In logs
  - Okta System Log
  - AWS CloudTrail logs
  - 'NAI: VPN Concentrators, RDP Gateways, Citrix/VMware Horizon Infrastructure, Cloud Identity Providers
    (Azure AD, Okta), Network Perimeter'
  range: Last 90 days, using 10-minute auth-to-session joins.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN remote_auth_success TO Zeek_conn_or_ssh ON source_ip, destination, service, time_window<=10m;
      FLAG internet_facing assets with unapproved source IPs; RETURN host, port, duration, bytes, user.
- question: Is any external source producing repeated failed authentications against one user on a remote
    service, even if the activity never reaches a successful login?
  context: 'Failed logins are an important detection floor because many brute-force or password-spray
    attempts never result in success during the same observation period. Analysts should capture the attacking
    source, targeted account, and timing so the event can feed blocking or identity hardening actions.
    Authoritative sources: [SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma); [Siadati
    and Memon, ''Detecting Structurally Anomalous Logins Within Enterprise Networks,'' ACM CCS, 2017](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Windows Event ID 1149
  - Zeek conn.log
  - Zeek ssh.log
  - VPN authentication logs
  - Azure AD Sign-In logs
  - Okta System Log
  - AWS CloudTrail logs
  - 'NAI: VPN Concentrators, RDP Gateways, Citrix/VMware Horizon Infrastructure, Cloud Identity Providers
    (Azure AD, Okta), Network Perimeter'
  range: Last 90 days, with 15-minute failed-auth windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: GROUP failed_remote_auth BY source_ip,user,service,15m; ALERT where failure_count>=3; OUTPUT
      source_ip, user, service, first_failure, last_failure.
- question: Do any successful remote logins come from countries, ASNs, or device fingerprints that are
    extremely rare for that user and service?
  context: 'User-specific baselines are valuable because a suspicious login is often ''normal'' at the
    enterprise level but very abnormal for the account involved. Analysts should inspect geography, network
    provider, and device familiarity together with recent failures to decide whether the account was likely
    compromised. Authoritative sources: [Turcotte, Kent, and Hash, ''Unified Host and Network Data Set,''
    arXiv:1708.07518, 2017](https://arxiv.org/abs/1708.07518); [Unified Host and Network Data Set](https://csr.lanl.gov/data/2017/).'
  answer_sources:
