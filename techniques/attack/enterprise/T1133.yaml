  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline bytes by dst_port over 30d => median, p99; FLAG sessions on admin ports where bytes_in
      or bytes_out > p99; RETURN src, dst, port, duration, bytes.
- question: Does outlier scoring identify targeted external administrative access sessions that do not
    resemble bulk internet scanning or normal management traffic?
  context: 'Isolation-based anomaly detection is helpful when attackers use normal ports but abnormal
    pacing, duration, and byte patterns. Analysts should review the contributing features to decide whether
    the session reflects deliberate remote access rather than commodity scanning noise. Authoritative
    sources: [Liu et al., ''Isolation-Based Anomaly Detection,'' ACM TKDD, 2012](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
