  queries:
  - technology: Kubernetes audit pseudocode
    query: SEARCH kubernetes_audit WHERE source_ip OUTSIDE cluster_cidr AND (user.username='system:anonymous'
      OR groups CONTAINS 'system:unauthenticated'); RETURN verb, resource, response_code, src_ip.
- question: Have daily counts of unique external sources successfully reaching administrative services
    spiked above normal levels for a given asset or hour of day?
  context: 'Connection-count spikes can reveal opportunistic scanning, newly exposed services, or targeted
    attention from multiple external addresses. Analysts should compare both successful and rejected connection
    counts to determine whether the host is under reconnaissance or already receiving accepted admin sessions
    at an abnormal rate. Authoritative sources: [Turcotte, Kent, and Hash, ''Unified Host and Network
    Data Set,'' arXiv:1708.07518, 2017](https://arxiv.org/abs/1708.07518).'
  answer_sources:
