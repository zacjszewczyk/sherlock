- question: Are successful remote logins occurring with a first-seen device, unusual user agent, or bypassed,
    skipped, or failed MFA sequence that still resulted in access?
  context: 'Device novelty and MFA weakness often indicate credential abuse rather than normal remote
    work. Analysts should confirm whether the organization expected the device and whether MFA was truly
    enforced, bypassed through policy, or failed before eventual success. Authoritative sources: [MITRE
    ATT&CK T1133 — External Remote Services](https://attack.mitre.org/techniques/T1133/).'
