  queries:
  - technology: SIEM/Stats pseudocode
    query: GROUP BY asset,hour_of_day,day => unique_external_success_ips, unique_external_reject_ips;
      ALERT when success_count or reject_count > mean+3sigma OR when baseline<5 and success_count>=10.
- question: Do any administrative-port sessions transfer unusually large volumes compared with normal
    traffic for that port and service?
  context: 'Large byte counts on admin ports can indicate tool upload, staging, or post-login exfiltration.
    Analysts should compare the session against the normal byte distribution for the specific port so
    legitimate short control traffic is separated from suspicious bulk transfer. Authoritative sources:
    [Bortolameotti et al., ''DECANTeR,'' ACSAC, 2017](https://doi.org/10.1145/3134600.3134605).'
  answer_sources:
  - Zeek conn.log
