- question: Does sequence modeling identify any remote session as suspicious based on the ordered progression
    from authentication to process execution, network access, and file activity?
  context: 'Event-sequence models help the analyst detect behavioral chains that do not fit routine administration
    or user workflows. The most useful outputs are the subsequences that drove the anomaly score, especially
    when they include discovery tools and first-time host access. Authoritative sources: [Du et al., ''DeepLog:
    Anomaly Detection and Diagnosis from System Logs through Deep Learning,'' ACM CCS, 2017](https://doi.org/10.1145/3133956.3134015).'
