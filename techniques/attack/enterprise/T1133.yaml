  range: Last 90 days, with rolling 60-minute ratios compared to a 30-day baseline.
  queries:
  - technology: SIEM/Stats pseudocode
    query: CALCULATE per source_ip,60m => failed_auths, total_attempts, successes, failure_rate; ALERT
      when failure_rate>=baseline_p99 AND successes>=1; OUTPUT raw counts and baseline comparison.
- question: Does a remote-access classifier mark any new login as high risk based on source ASN, distance
    from the user's norm, time-of-day deviation, device novelty, protocol, MFA outcome, and recent failures?
  context: 'A supervised risk model is appropriate when no single feature is decisive but several weak
    signals combine into a suspicious pattern. Analysts should rely on the top feature attributions rather
    than the raw score alone when deciding whether to escalate or force credential resets. Authoritative
    sources: [Bohara et al., ''An Unsupervised Multi-Detector Approach for Identifying Malicious Lateral
    Movement,'' IEEE SRDS, 2017](https://doi.org/10.1109/SRDS.2017.31).'
  answer_sources:
