  range: Last 90 days, using a 30-day training window and clustering on completed remote sessions.
  queries:
  - technology: ML pipeline pseudocode
    query: vectorize session features [geo, asn, ua_hash, mfa_outcome, prior_failures, duration, bytes];
      cluster = dbscan(vectors); FLAG isolated clusters of successful logins; OUTPUT cluster_id, nearest_neighbor_distance,
      contributing features.
- question: Are external IPs successfully connecting to administrative ports on assets that should not
    expose SSH, RDP, WinRM, Docker, Kubernetes, or similar services to the internet?
  context: 'Exposure of administrative services is a direct initial-access risk even when no authentication
    logs are available. Analysts should confirm the asset is internet-facing, the source is not a managed
    admin network, and the connection actually completed rather than being merely attempted. Authoritative
    sources: [MITRE ATT&CK T1133 — External Remote Services](https://attack.mitre.org/techniques/T1133/);
    [NSA/CISA Kubernetes Hardening Guide, 2022](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Windows Event ID 5156
  - Linux auditd logs
  - VPC Flow Logs
  - Azure NSG Flow Logs
  - Kubernetes audit logs
  - 'NAI: DMZ network segments, Cloud environment subnets (AWS VPC, Azure VNet), Container orchestration
    platforms, Internet-facing network infrastructure, Perimeter firewalls'
  range: Last 90 days, emphasizing completed external sessions on admin ports.
  queries:
  - technology: SIEM/Rule pseudocode
    query: SELECT successful external connections to ports [22,3389,5985,5986,2375, 2376,6443,10250] ON
      internet_facing_assets; ALERT when source_ip NOT IN approved_management_ranges; RETURN src, dst,
      port, bytes, duration.
- question: Can a suspicious external administrative connection be validated by correlating network telemetry
    with host-level acceptance events on the destination system?
  context: 'Host and network agreement materially raises confidence because it proves that the port exposure
    translated into actual service acceptance on the target host. Analysts should use both views to resolve
    uncertainty from NAT, proxies, or incomplete flow logging. Authoritative sources: [Ghorbani, Lu, and
    Tavallaee, ''Network Intrusion Detection and Prevention,'' Springer, 2010](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
