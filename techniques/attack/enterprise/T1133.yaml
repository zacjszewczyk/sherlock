  queries:
  - technology: ML pipeline pseudocode
    query: features = [per_source_rate, inter_arrival_time, session_duration, bytes_transferred, destination_port];
      anomaly = isolation_forest.score( features); ALERT on high-score targeted sessions; OUTPUT top_features.
- question: After a successful external remote login, does the session launch discovery or administrative
    tooling and reach internal hosts that the user has not touched before?
  context: 'This is a classic post-authentication behavior chain for adversaries who use valid remote
    access to pivot inward. Analysts should tie the successful login to process launches and internal
    connections so the investigation immediately moves from access confirmation to scoping of lateral
    movement. Authoritative sources: [MITRE ATT&CK T1133 — External Remote Services](https://attack.mitre.org/techniques/T1133/);
    [Du et al., ''DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep Learning,'' ACM
    CCS, 2017](https://doi.org/10.1145/3133956.3134015).'
