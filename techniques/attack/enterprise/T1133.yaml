    platforms, Internet-facing network infrastructure, Perimeter firewalls'
  range: Last 90 days, using short network-to-host correlation windows around accepted connections.
  queries:
  - technology: SIEM/Correlation pseudocode
    query: JOIN accepted_host_events (Windows 5156 or auditd ACCEPT) TO network sessions ON dst_host,
      source_ip, port, time_window<=5m; FLAG assets not designated as public admin endpoints.
- question: Do Kubernetes audit logs show anonymous or unauthenticated API activity from outside the cluster
    address space, including failed reconnaissance requests?
  context: 'Anonymous Kubernetes API access is high value because it can expose the cluster without valid
    credentials and often appears during reconnaissance before full compromise. Analysts should inspect
    the requesting IP, verb, resource, and response code to understand whether the activity was probing
    or successful control-plane abuse. Authoritative sources: [NSA/CISA Kubernetes Hardening Guide, 2022](https://media.defense.gov/2022/Aug/29/2003066362/-1/-1/0/CTR_KUBERNETES_HARDENING_GUIDANCE_1.2_20220829.PDF).'
