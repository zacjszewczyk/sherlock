      prior_90d_set.
- question: Does any remote-access session move enough outbound data in the first hour after login to
    suggest immediate staging or exfiltration?
  context: 'Byte movement is a hard physical constraint that adversaries cannot hide indefinitely. Analysts
    should measure cumulative outbound volume after login and determine whether the destination is an
    external IP or cloud storage service consistent with data theft. Authoritative sources: [Bortolameotti
    et al., ''DECANTeR,'' ACSAC, 2017](https://doi.org/10.1145/3134600.3134605).'
