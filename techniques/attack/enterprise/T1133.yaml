- question: Do any remote sessions have a composite statistical profile that is far outside the user's
    normal duration, host access count, process diversity, and outbound byte patterns?
  context: 'Composite z-scoring lets the analyst combine several moderate anomalies into one high-confidence
    outlier. This is especially useful for valid-account abuse where each individual behavior might still
    look plausible in isolation. Authoritative sources: [Turcotte, Kent, and Hash, ''Unified Host and
    Network Data Set,'' arXiv:1708.07518, 2017](https://arxiv.org/abs/1708.07518).'
