name: 'T1538: Cloud Service Dashboard'
id: 259b267a-da72-4789-818c-9fe8f8315d2d
description: 'This playbook helps an analyst investigate whether an adversary is using a cloud service
  dashboard GUI with stolen or valid credentials to discover cloud resources, services, and configuration
  as part of the Discovery tactic (T1538). Because the graphical console can reveal more than an API and
  leaves a distinct GUI/browser fingerprint, the hunt spans several behavioral angles: anomalous console/portal
  sign-ins (Tor/proxy/new-ASN source infrastructure, weak or bypassed MFA, failed-login bursts preceding
  success, impossible travel, and per-user/peer-group behavioral deviation across AWS CloudTrail ConsoleLogin,
  Azure AD Sign-in, GCP Audit, Okta System Log, and M365/SaaS sign-in logs); suspicious User-Agent strings
  indicative of offensive tooling (e.g., Pacu) or rare scripts; high-volume, multi-service read-only enumeration
  bursts (List*/Describe*/Get*) and AccessDenied density from a single session; and targeted discovery
  of sensitive resources such as secrets, encryption keys, and IAM permissions by principals that do not
  normally touch them. Detection methods combine symbolic-logic rules, statistical baselining/forecasting
  (modified Z-score, Prophet, first-seen novelty), and machine-learning models (identity anomaly scoring,
  user-agent classifiers, LSTM API-sequence models, and graph link-prediction) applied to cloud control-plane
  and identity telemetry, so the analyst can corroborate suspected GUI-driven reconnaissance against source
  trust, session behavior, enumeration volume, and sensitive-resource access context.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: '[Discovery] Cloud login TI correlation: As part of investigating cloud service dashboard
    reconnaissance, can you determine whether cloud account sign-in telemetry shows anomalous console
    access patterns consistent with adversary reconnaissance: suspicious source infrastructure (Tor/proxy/new
    ASN), unusual geo/ASN context, weak/bypassed MFA outcomes, failed-login bursts preceding success,
    and timing that deviates from per-user and peer-group behavioral baselines. -- specifically applying
    the ''Cloud login TI correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary who has obtained valid
    cloud credentials may sign in to a cloud service dashboard GUI (e.g., AWS Management Console, Azure
    Portal, GCP Security Command Center, Microsoft 365 Admin Center, Okta/Identity portals, or SaaS admin
    consoles) to enumerate services, resources, and configuration without making manual API calls. This
    evidence focuses on the condition that Cloud account sign-in telemetry shows anomalous console access
    patterns consistent with adversary reconnaissance: suspicious source infrastructure (Tor/proxy/new
    ASN), unusual geo/ASN context, weak/bypassed MFA outcomes, failed-login bursts preceding success,
    and timing that deviates from per-user and peer-group behavioral baselines. This Symbolic Logic approach
    pursues that signal by: Correlate cloud console logins (AWS CloudTrail ConsoleLogin, Azure AD/Okta
    sign-in) with TI-listed malicious IPs, Tor exit nodes, anonymizer, or proxy sources and alert on matches,
    mirroring built-in anonymous-IP/Tor policies in [Create anomaly detection policies, Microsoft Defender
    for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy). A
    positive result -- a rule match, statistical outlier, or model alert -- indicates that a console/portal
    session is behaving like adversary reconnaissance rather than legitimate administration; pivot to
    the principal/identity, the source IP/ASN/device fingerprint, the MFA outcome, the sequence of dashboard
    pages or read-only API calls, and any sensitive resources touched. A negative result helps rule out
    this vector for the session but should be corroborated with the other questions in this playbook,
    since GUI-driven discovery can blend with normal admin activity and evade any single detection method.'
  answer_sources:
  - AWS CloudTrail Logs (ConsoleLogin event)
  - Azure AD Sign-In logs
  - Google Cloud Audit Logs (Admin Activity)
  - Okta System Log
  - VPN authentication logs
  - 'NAI: Cloud IAM infrastructure, Internet gateways and proxies, Endpoint devices of privileged users'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Cloud login TI correlation (Symbolic Logic)

      # Evidence: Cloud account sign-in telemetry shows anomalous console access patterns consistent with
      adversary reconnaissance: suspicious source infrastructure (Tor/proxy/new ASN), unusual geo/ASN
      context, weak/bypassed MFA outcomes, failed-login bursts preceding success, and timing that deviates
      from per-user and peer-group behavioral baselines.

      source IN [AWS CloudTrail Logs (ConsoleLogin event), Azure AD Sign-In logs, Google Cloud Audit Logs
      (Admin Activity), Okta System Log, VPN authentication logs]

      // Approach: Correlate cloud console logins (AWS CloudTrail ConsoleLogin, Azure AD/Okta sign-in)
      with TI-listed malicious IPs, Tor exit nodes, anonymizer, or proxy sources and alert on matches,
      mirroring built-in anonymous-IP/Tor policies in [Create anomaly detection policies, Microsoft Defender
      for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).

      MATCH session/login events to the symbolic condition above

      WHERE the rule predicate is TRUE (TI/regex/threshold match)

      ALERT with principal, sourceIP, ASN, userAgent, MFA_outcome, actions'
