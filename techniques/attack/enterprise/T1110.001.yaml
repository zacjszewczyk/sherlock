name: 'T1110.001: Password Guessing'
id: 58b75ca0-a596-4353-9374-5928e0e7db1c
description: 'Investigate evidence that an adversary is attempting to gain access to one or more accounts
  through password guessing, including brute-force (one-to-one / many-to-one) and password spraying (one-to-many
  / many-to-many) against externally and internally facing authentication surfaces. This playbook helps
  an analyst correlate authentication failures and successes across Windows Security logs (4625/4624/4740),
  Linux/macOS sshd and authd logs, network device syslog, cloud and SaaS sign-in logs, and Zeek network
  telemetry to surface: source IPs or User-Agents matching credential-stuffing threat intelligence; high-volume
  failures against common/default usernames; spray-versus-brute fan-out patterns between source IPs and
  target accounts; spikes in account lockouts temporally correlated with failure bursts; and persistent
  low-and-slow campaigns engineered to evade simple rate thresholds. It combines deterministic detection
  rules, statistical baselining and change-point analysis, and machine-learning anomaly detection so the
  analyst can confirm whether observed authentication anomalies represent a genuine password-guessing
  operation.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any authentication events (successful or failed) originate from a source IP address or
    carry a User-Agent string that matches a known-bad entry on a credential-stuffing or brute-force threat
    intelligence feed, and does the attempted username or password appear on a default-account or breached-credential
    watchlist?
  context: 'Sophisticated and commodity actors frequently reuse infrastructure and credential corpora
    that are already cataloged in threat intelligence and breach datasets. By correlating Windows 4625/4624
    and Zeek conn/http/ssh records against (a) source IPs and User-Agents on credential-stuffing feeds
    and (b) breached or known-bad credential watchlists, the analyst can quickly flag authentication activity
    tied to known adversary tooling. Prioritize accounts whose attempted password appears in breach corpora
    and match attempted usernames against a default-account watchlist (admin, root, guest, administrator).
    A positive match against threat intel plus a successful 4624 is high-confidence evidence of credential
    access; matches with only failures still warrant blocking and account review. This question directly
    supports the Credential Access objective by tying observed logins to known password-guessing infrastructure.
    References: [Protecting accounts from credential stuffing with password breach alerting, Thomas et
    al](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas); [Detecting Password Spraying
    Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssh.log
  - 'NAI: Externally-facing Web Applications (e.g., OWA, SharePoint), VPN Concentrators, Network Edge
    Firewalls, Cloud Service Provider Portals, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'auth = WinEventLog:4625 OR WinEventLog:4624 OR zeek.conn OR zeek.http OR zeek.ssh

      join threat_intel on auth.src_ip == ti.ip OR auth.user_agent == ti.user_agent

      join breach_watchlist on auth.target_user == wl.user OR auth.password_hash IN breach_corpus

      join default_accounts on lower(auth.target_user) IN [admin, root, guest, administrator]

      where ti.match OR breach.match OR default.match

      emit alert(src_ip, user_agent, target_user, outcome, matched_feed)'
- question: For each external source IP, is the ratio of failed to successful logins and the rate of attempts
    per minute abnormally high relative to the 30-day baseline, indicating automated password guessing?
  context: 'Automated guessing produces a characteristic burst of failures with few or no successes. For
    each external source IP over a sliding one-hour window, compute the failed:successful login ratio
    (State) and attempts/minute (Frequency), and flag values above the 95th percentile of the trailing
    30-day baseline. Explicitly profile blocked or failed connection counts as a distinct failure-mode
    signal because some appliances reject before generating an auth event. A high failure ratio with a
    sudden later success is especially suspicious as it may mark the moment of a cracked credential. This
    statistical approach catches noisy brute-force activity that deterministic rules may miss and is tunable
    per environment to manage false positives from misconfigured service accounts. References: [Detecting
    Password Spraying Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssh.log
  - 'NAI: Externally-facing Web Applications (e.g., OWA, SharePoint), VPN Concentrators, Network Edge
    Firewalls, Cloud Service Provider Portals, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = WinEventLog:4625 OR WinEventLog:4624 OR zeek.conn\nfilter src_ip is external\nbucket\
      \ span=1h by src_ip\nstats count(eval(outcome=failure)) as fails, count(eval(outcome=success)) as\
      \ oks,\n      (fails/(oks+1)) as fail_ratio, fails/60 as attempts_per_min,\n      count(eval(conn_state\
      \ in [REJ,RSTR])) as blocked by src_ip\nbaseline = pctile_30d(fail_ratio, 95)\nwhere fail_ratio\
      \ > baseline OR attempts_per_min > pctile_30d(attempts_per_min,95)\nemit alert(src_ip, fail_ratio,\
      \ attempts_per_min, blocked)"
- question: Does a machine-learning model scoring authentication events on reputation, user-agent rarity,
    attempt rate, failure ratio, byte volume, and protocol features flag any events as anomalous password
    guessing above the tuned threshold?
  context: 'Tree-ensemble and Isolation Forest models can detect password-guessing behavior that evades
    static thresholds by jointly weighing IP reputation, user-agent rarity, attempts/min, failure ratio,
    byte volume, and protocol. Score authentication events and alert when the anomaly score exceeds a
    tuned threshold (~0.9), surfacing the top-3 contributing features in the alert text so analysts can
    triage rapidly. Train and validate on labeled brute-force flows (e.g., CIC-IDS2017). A high-scoring
    event combined with a successful authentication is strong evidence of credential access; the model''s
    feature attribution helps confirm whether the anomaly is guessing versus benign automation. This complements
    the symbolic and statistical methods for the Credential Access tactic. References: [Isolation Forest,
    Liu et al](https://doi.org/10.1109/ICDM.2008.17); [Enhance the Detection of DoS and Brute Force Attacks
    within the MQTT Environment, Alqahtani et al](https://arxiv.org/abs/2408.00480); [CIC-IDS2017, UNB](https://www.unb.ca/cic/datasets/ids-2017.html).'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek http.log
  - Zeek ssh.log
  - 'NAI: Externally-facing Web Applications (e.g., OWA, SharePoint), VPN Concentrators, Network Edge
    Firewalls, Cloud Service Provider Portals, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = load("brute_force_isolation_forest")

      features = [ip_reputation, ua_rarity, attempts_per_min, failure_ratio, byte_volume, protocol]

      for ev in auth_events: score = model.score(features(ev))

      where score > 0.9

      emit alert(ev.src_ip, ev.target_user, score, top3_features(ev))'
- question: Is a single source IP producing failed logons against more than five watchlisted or distinct
    usernames within a 15-minute window, suggesting a sweep across common/default accounts?
  context: 'A hallmark of opportunistic password guessing is a single source rapidly trying many common
    or default usernames (admin, root, guest, test). Alert when one source IP produces failed logons (Windows
    4625 or sshd ''Failed password'') for more than five watchlisted or distinct usernames within 15 minutes.
    Retain this concrete threshold but tune it per environment, since shared NAT egress or vulnerability
    scanners can trip it benignly. A positive result against default accounts on domain controllers, RADIUS/Kerberos
    servers, or network appliances strongly indicates dictionary-style guessing and supports the Credential
    Access hypothesis. Correlate hits with any subsequent successful logon from the same IP to prioritize
    response. References: [Detecting Password Spraying Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html);
    [Password Spray Attacks Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Domain Controllers, Authentication Servers (RADIUS, Kerberos), Application Servers with default
    accounts, Network Appliances (routers, switches)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = WinEventLog:4625 OR linux:sshd \"Failed password\"\nbucket span=15m by src_ip\nstats\
      \ dc(target_user) as distinct_users,\n      dc(eval(target_user in watchlist)) as watchlist_users\
      \ by src_ip\nwhere distinct_users > 5 OR watchlist_users >= 1\nemit alert(src_ip, distinct_users,\
      \ values(target_user))"
- question: For each source IP, are the distinct-username count and the Shannon entropy of attempted usernames
    over a 30-minute window above the 98th percentile of baseline, indicating a dictionary username sweep?
  context: 'Dictionary attacks iterate through a large, varied set of usernames, which produces both a
    high distinct-username count (Volume) and high Shannon entropy of the attempted username strings.
    For each source IP, compute the 30-minute distinct-username count and username entropy and flag values
    above the 98th percentile of baseline; track the failed-attempt rate as the Frequency component. High
    entropy distinguishes a broad dictionary sweep from a focused brute-force against one account. This
    statistical method catches guessing that uses non-default or randomized usernames not covered by a
    static watchlist, reinforcing the Credential Access investigation. Tune the percentile to account
    for legitimate bulk authentication systems. References: [Detecting Password Spraying Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Domain Controllers, Authentication Servers (RADIUS, Kerberos), Application Servers with default
    accounts, Network Appliances (routers, switches)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "events = WinEventLog:4625 OR linux:sshd \"Failed password\"\nbucket span=30m by src_ip\nstats\
      \ dc(target_user) as user_vol, shannon_entropy(target_user) as user_entropy,\n      count/30 as\
      \ fail_rate by src_ip\nwhere user_vol > pctile(user_vol,98) OR user_entropy > pctile(user_entropy,98)\n\
      emit alert(src_ip, user_vol, user_entropy, fail_rate)"
- question: Do clustering models group authentication failures into clusters whose IP, username-set, timing,
    and failure-ratio characteristics match known dictionary-attack behavior?
  context: 'Cluster failure events using DBSCAN or Isolation Forest on features such as source IP, username-set,
    timing, and failure ratio, and alert on clusters matching dictionary-attack behavior. List the top-3
    features that drove each cluster (distinct usernames, attempts/min, username entropy) so analysts
    understand the alert. Clustering surfaces coordinated dictionary sweeps even when no single threshold
    is exceeded, and helps separate distinct campaigns sharing a target. A cluster centered on default-account
    servers with high distinct-username counts is strong evidence of password guessing for the Credential
    Access tactic. Validate clusters against known scanners to manage false positives. References: [Isolation
    Forest, Liu et al](https://doi.org/10.1109/ICDM.2008.17).'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek ssh.log
  - 'NAI: Domain Controllers, Authentication Servers (RADIUS, Kerberos), Application Servers with default
    accounts, Network Appliances (routers, switches)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [src_ip, username_set_size, inter_arrival, failure_ratio, username_entropy]\nclusters\
      \ = DBSCAN(failure_events, features)\nfor c in clusters: if matches_dictionary_profile(c):\n   \
      \ emit alert(c.id, c.members, top3_features=[distinct_users, attempts_per_min, username_entropy])"
- question: Does the source-to-account and account-to-source fan-out reveal either a password spray (one
    IP targeting more than 20 accounts with three or fewer failures each) or a brute-force (a single account
    receiving more than 50 failures from any IP within 30 minutes)?
  context: 'Spraying and brute-forcing have opposite fan-out signatures. Compute source->account and account->source
    fan-out and alert when a source IP targets more than 20 accounts with three or fewer failures each
    (one-to-many spray) or when a single account receives more than 50 failures from any IP within 30
    minutes (many-to-one brute force). These deterministic thresholds make the spray-versus-brute distinction
    explicit and actionable for analysts, and should be tuned per environment. Positive spray hits against
    cloud portals, VPN concentrators, or web apps indicate broad credential access attempts, while brute
    hits against a single high-value account indicate a focused attack. Correlate with subsequent 4624
    successes to assess compromise. References: [Detecting Password Spraying Attacks, Splunk](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, Cloud Service Provider Portals (e.g., Azure AD, AWS Console), VPN Concentrators,
    Externally-facing Web Applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = WinEventLog:4625 OR WinEventLog:4624 OR zeek.conn\nbucket span=30m\nspray = stats\
      \ dc(target_user) as accts, max(per_user_fails) as max_fail by src_ip\n        where accts > 20\
      \ AND max_fail <= 3\nbrute = stats count(eval(outcome=failure)) as fails by target_user, src_ip\n\
      \        where fails > 50\nemit alert(union(spray, brute), pattern_type)"
- question: Are the hourly counts of distinct accounts per source IP and distinct source IPs per account
    more than three standard deviations above the 30-day average, and do those spikes correlate with subsequent
    successful logons?
  context: 'Track distinct accounts per IP and distinct IPs per account hourly (Volume) plus attempts/min
    (Frequency), alerting on counts more than three sigma above 30-day averages. Then correlate spikes
    with subsequent successful (4624) logons as the State signal that indicates the guessing may have
    succeeded. A spike in accounts-per-IP suggests spraying; a spike in IPs-per-account suggests distributed
    brute-forcing of one target. This statistical baseline adapts to each environment and detects deviations
    that fixed thresholds miss. A correlated success following a spike is high-priority evidence of credential
    access and should drive immediate containment. References: [Password Spray Attacks Detection and Mitigation
    Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, Cloud Service Provider Portals (e.g., Azure AD, AWS Console), VPN Concentrators,
    Externally-facing Web Applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events = WinEventLog:4625 OR WinEventLog:4624

      bucket span=1h

      stats dc(target_user) as accts_per_ip by src_ip

      stats dc(src_ip) as ips_per_acct by target_user

      where accts_per_ip > avg_30d + 3*std_30d OR ips_per_acct > avg_30d + 3*std_30d

      correlate followed_by(success 4624 same target_user)

      emit alert(src_ip, target_user, accts_per_ip, ips_per_acct, success_after)'
- question: Does an Isolation Forest applied to the unique-accounts-per-IP and unique-IPs-per-account
    streams surface coordinated, distributed password-spray campaigns spread across many source IPs?
  context: 'Apply Isolation Forest to the two streams (unique accounts per IP, unique IPs per account)
    and cluster distributed sources to surface coordinated campaigns, reporting the top-3 contributing
    features per alert. This dual-stream view detects campaigns that deliberately spread activity across
    many IPs so that no single source crosses a threshold. Coordinated low-volume sources converging on
    a common set of accounts is a strong indicator of an organized credential-access operation. The model''s
    feature attribution helps analysts validate whether the pattern is a genuine distributed spray versus
    benign multi-region authentication. Tune the contamination parameter to control alert volume. References:
    [Isolation Forest, Liu et al](https://doi.org/10.1109/ICDM.2008.17); [Hunting for Low and Slow Password
    Sprays Using Machine Learning, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).'
  answer_sources:
  - Windows Event ID 4625
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, Cloud Service Provider Portals (e.g., Azure AD, AWS Console), VPN Concentrators,
    Externally-facing Web Applications'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'stream_a = unique_accounts_per_ip(1h)

      stream_b = unique_ips_per_account(1h)

      model = IsolationForest(features=[stream_a, stream_b, attempts_per_min, shared_error_code])

      anomalies = model.predict(events)

      campaigns = cluster(anomalies by shared_target_accounts)

      emit alert(campaign.id, campaign.src_ips, top3_features)'
- question: For each Windows account lockout (Event ID 4740), do the preceding 15 minutes of failed logons
    (Event ID 4625) for the same user show a single source IP exceeding the account-lockout threshold?
  context: 'Account lockouts are a downstream symptom of failed guessing. On each Windows 4740 lockout,
    query the prior 15 minutes of 4625 failures for the same user and raise an alert when a single source
    IP exceeds the account-lockout threshold, tying the lockout (State) to its preceding failure burst
    (Volume). This rule confirms that a lockout was caused by concentrated guessing from one source rather
    than a forgotten password across the user''s own devices. Lockouts on domain controllers or ADFS servers
    tied to a single external IP are clear evidence of brute-force credential access. Use the source IP
    to pivot to other targeted accounts. References: [Password Spray Attacks Detection and Mitigation
    Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  answer_sources:
  - Windows Event ID 4740
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS) Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for lockout in WinEventLog:4740:\n    fails = WinEventLog:4625 where target_user==lockout.user\
      \ AND time in [lockout.time-15m, lockout.time]\n    stats count by src_ip in fails\n    if max(count_by_src_ip)\
      \ >= lockout_threshold:\n        emit alert(lockout.user, top_src_ip, fail_count)"
- question: Does change-point detection on the hourly account-lockout (Event ID 4740) time series reveal
    an abrupt upward regime change beyond the 99th-percentile baseline?
  context: 'Model hourly lockout (4740) counts as a time series and apply change-point detection (CUSUM,
    PELT, or Bayesian online CPD) plus a 99th-percentile baseline, flagging abrupt upward regime changes.
    Profile the lockout rate as a distinct failure-mode signal because a sudden organization-wide rise
    in lockouts often marks the onset of a spray campaign that trips lockout policies. Unlike a fixed
    threshold, change-point detection adapts to normal daily/weekly cycles and catches the moment behavior
    shifts. A detected change point coincident with elevated 4625 failures strongly supports the password-guessing
    hypothesis for Credential Access. References: [A Survey of Methods for Time Series Change Point Detection,
    Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4740
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS) Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'series = timechart span=1h count(WinEventLog:4740) as lockouts

      cp = change_point_detect(series, method=PELT|CUSUM)

      base99 = pctile_baseline(series, 99)

      where cp.upward_shift OR series.value > base99

      emit alert(cp.time, series.value, base99)'
- question: Does an LSTM model of per-account authentication event sequences flag low-probability orderings
    (e.g., 4625->4625->4740) that indicate a guessing burst?
  context: 'Model per-account authentication event-key sequences (such as 4625->4625->4740 ordering and
    parameters) with an LSTM and flag low-probability sequences indicating a guessing burst, returning
    the diverging events for triage. Sequence modeling captures the temporal structure of guessing-then-lockout
    that aggregate counts miss, and distinguishes a rapid machine-driven failure cascade from sporadic
    human typos. Low-probability sequences ending in a lockout, or in an unexpected success, are strong
    evidence of automated credential-access attempts. The returned diverging events let analysts confirm
    the timing and source of the burst quickly. Retrain periodically to track normal authentication behavior.
    References: [DeepLog: Anomaly Detection and Diagnosis from System Logs through Deep Learning, Du et
    al](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Windows Event ID 4740
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, Active Directory Federation Services (ADFS) Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = LSTM_seq_model(trained_on=normal_auth_sequences)\nfor acct in accounts:\n    seq =\
      \ ordered_event_keys(acct, window=24h)  # e.g. [4625,4625,4740]\n    p = model.sequence_probability(seq)\n\
      \    if p < threshold: emit alert(acct, seq, diverging_events)"
- question: Is any single source IP logging at least one failed attempt per hour for six or more consecutive
    hours across three or more accounts, indicating a deliberately sub-threshold low-and-slow campaign?
  context: 'Patient adversaries pace their guessing to stay under rate-based alarms. Monitor each source
    IP over 24 hours and alert when it logs at least one failed attempt per hour for six or more consecutive
    hours across three or more accounts, the deterministic floor for sub-threshold campaigns. Retain and
    tune this rule per environment. Low-and-slow activity against high-value asset servers, domain controllers,
    executive workstations, or cloud admin accounts is particularly concerning because it signals a targeted,
    evasive operation. A positive result warrants enrichment of the source IP and review of any successful
    authentications it produced, directly supporting the Credential Access investigation. References:
    [Hunting for Low and Slow Password Sprays Using Machine Learning, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: High-Value Asset Servers, Domain Controllers, Executive user workstations, Cloud administrative
    accounts'
  range: Last 30 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'events = WinEventLog:4625 OR zeek.conn

      bucket span=1h by src_ip over 24h

      stats count as hourly_fails, dc(target_user) as accts by src_ip, hour

      consec = count_consecutive_hours(hourly_fails >= 1)

      where consec >= 6 AND total_distinct_accts >= 3

      emit alert(src_ip, consec, total_distinct_accts)'
- question: Does each source IP's 24-hour failure profile show sustained upward drift via change-point
    detection and Z-scores above 2.0 maintained for three days, revealing a low-and-slow shift that never
    trips a single-window threshold?
  context: 'Maintain each IP''s 24-hour failure profile (Volume + Frequency) and detect sustained upward
    drift via change-point detection and Z-scores greater than 2.0 sustained for three days. This catches
    low-and-slow shifts where any single window looks benign but the cumulative trend is clearly anomalous.
    By tracking the trajectory rather than instantaneous rate, the analyst can identify patient guessing
    campaigns that are designed to evade burst detection. A persistent drift converging on sensitive accounts
    is strong evidence of a deliberate credential-access effort and should trigger source-IP blocking
    and account review. References: [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: High-Value Asset Servers, Domain Controllers, Executive user workstations, Cloud administrative
    accounts'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for src_ip:\n    profile = timechart span=24h count(failures) by src_ip\n    z = zscore(profile)\n\
      \    cp = change_point_detect(profile)\n    where cp.upward AND count_days(z > 2.0) >= 3\n    emit\
      \ alert(src_ip, drift_magnitude, days_sustained)"
- question: Does clustering of sign-in failures across source IPs, applications, and users reveal a coordinated
    low-volume spray spread over many IPs (each below per-IP thresholds), corroborated by inter-arrival-time
    modeling?
  context: 'Cluster sign-in failures across source IPs, applications, and users to surface coordinated
    low-volume spray spread over many IPs, each below per-IP thresholds, and complement with an inter-arrival-time
    HMM or Isolation Forest. Report the top-3 features (distinct accounts, inter-arrival regularity, shared
    error code) per alert. This is the most evasive password-guessing variant: distributed across infrastructure
    and paced to defeat both rate and per-IP detection. Shared error codes and machine-regular inter-arrival
    timing across otherwise unrelated IPs betray a single orchestrated campaign. Detecting it provides
    high-value evidence of a sophisticated external actor pursuing credential access and warrants coordinated
    blocking and account protection. References: [Hunting for Low and Slow Password Sprays Using Machine
    Learning, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052);
    [Isolation Forest, Liu et al](https://doi.org/10.1109/ICDM.2008.17).'
  answer_sources:
  - Windows Event ID 4625
  - Zeek conn.log
  - 'NAI: High-Value Asset Servers, Domain Controllers, Executive user workstations, Cloud administrative
    accounts'
  range: Last 30 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "events = sign_in_failures (cloud + on-prem)\nclusters = cluster(events, features=[src_ip,\
      \ app, target_user, error_code])\nfor c in clusters:\n    iat = HMM_or_IsolationForest(inter_arrival_times(c))\n\
      \    if c.distributed AND iat.regular AND c.shared_error_code:\n        emit alert(c.id, c.src_ips,\
      \ top3=[distinct_accounts, iat_regularity, shared_error_code])"
