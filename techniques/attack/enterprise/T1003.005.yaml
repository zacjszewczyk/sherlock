name: 'T1003.005: Cached Domain Credentials'
id: ad1bf73d-fcb7-415e-b781-83b7e659235e
description: 'Investigate adversary attempts to access cached domain credentials (DCC2 / MS-Cache v2 hashes
  on Windows, and SSSD or Quest/VAS credential caches on Linux) that allow authentication when a domain
  controller is unavailable. This playbook helps an analyst hunt for credential-dumping tooling and tradecraft:
  execution of known dumping utilities (Mimikatz, secretsdump.py, Linikatz, reg.exe, tdbdump), command
  lines bearing dumping signatures, unauthorized access to the SECURITY/SYSTEM/SAM registry hives, suspicious
  process handles to LSASS memory, reads of Linux SSSD/Quest cache databases, and the multi-stage follow-on
  activity (lateral movement, credential reuse, lockouts) that indicates cracked DCC2 hashes are being
  used. It combines symbolic-logic detections, statistical baselining of rare/first-seen behavior, profiling
  of failed/denied attempts, and machine-learning classification across Windows (Event IDs 4688/4663/4656)
  and Linux (auditd, Sysmon for Linux) endpoint telemetry plus network/authentication logs.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
