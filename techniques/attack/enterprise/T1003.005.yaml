- question: Are there permission-denied (EACCES) reads on the SSSD/Quest cache files indicating an under-privileged
    actor attempting to dump cached credentials?
  context: 'Dumping the Linux credential cache requires root/sudo, so an under-privileged actor generates
    EACCES failures while probing. Treat permission-denied (EACCES) reads on the cache files as a distinct
    signal of an attempted cached-credential dump, not noise; reference Atomic Red Team T1003.005 for
    expected access patterns. A cluster of denied reads on `cache_*.ldb` from a non-privileged user often
    precedes a privilege-escalation attempt followed by a successful dump, so it is an early Credential
    Access warning that should prompt review of the actor''s escalation activity. Source citation: [Atomic
    Red Team T1003.005](https://www.atomicredteam.io/docs/atomics/T1003.005).'
