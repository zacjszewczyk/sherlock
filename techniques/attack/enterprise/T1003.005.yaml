- question: Which processes or users reading the SSSD/Quest caches are first-seen, or show access-count
    spikes beyond the mean+3sigma baseline?
  context: 'Renamed tools and novel access patterns evade exact-path signatures, so baselining helps.
    Build a baseline of processes and users that read the SSSD/Quest caches and flag first-seen processes
    or commands and access-count spikes beyond a mean+3sigma threshold. Because legitimate access is dominated
    by a small set of service accounts, any new reader or sudden burst is anomalous. This statistical
    method extends Linux Credential Access coverage beyond known tooling and helps catch a careful actor
    reading the cache via an uncommon utility or copying the database for offline dumping. Source citation:
    [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
