- question: On Linux hosts, are non-root/non-sssd processes reading `/var/lib/sss/db/cache_*.ldb` or `/var/opt/quest/vas/authcache/vas_auth.vdb`,
    or invoking `tdbdump`/Linikatz against those paths?
  context: 'Linux systems joined to Active Directory cache domain credential hashes in SSSD and Quest/VAS
    databases, which adversaries dump with tools like tdbdump or Linikatz. Use auditd to alert when non-root/non-sssd
    processes read `/var/lib/sss/db/cache_*.ldb` or `/var/opt/quest/vas/authcache/vas_auth.vdb`, or when
    command lines invoke `tdbdump` or Linikatz against these paths. Only specific service accounts should
    ever touch these files, so any other reader is a strong Credential Access indicator. A positive match
    names the process and user dumping the Linux credential cache and should trigger immediate host triage.
    Source citations: [linikatz](https://github.com/CiscoCXSecurity/linikatz) and [OS Credential Dumping:
    Cached Domain Credentials](https://attack.mitre.org/techniques/T1003/005/).'
