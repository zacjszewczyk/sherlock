    > 3 against the per-user/per-host mean, applying the sliding-window frequency-threshold approach of
    [Warrender, Forrest, Pearlmutter](https://ieeexplore.ieee.org/document/766910). Profile the failure
    case explicitly: a non-admin token attempting bcdedit (Event ID 4688 with subsequent access-denied)
