    ransomware precedent. A positive result -- a deterministic rule match, a statistical outlier, or a
    model alert -- is a strong indicator of Safe Mode Boot abuse; pivot to the responsible host, the user/SID
    and token privilege, the full process lineage of any bcdedit.exe/bootcfg.exe or reg.exe execution,
