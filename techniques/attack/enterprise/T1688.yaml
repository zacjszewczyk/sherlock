questions:
- question: '[Defense Impairment] Boot utility and command-line match: Can you determine whether A process
    execution event (Windows Event ID 4688) shows a boot-configuration utility or suspicious script being
    run from an unusual parent process or path to force the system into Safe Mode. -- specifically, using
    the ''Boot utility and command-line match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary abuses Windows
    Safe Mode to start the host with a minimal set of drivers and services so that third-party security
    software (EDR/AV) does not load, leaving the system blind while malicious payloads run. This evidence
    focuses on the condition that A process execution event (Windows Event ID 4688) shows a boot-configuration
    utility or suspicious script being run from an unusual parent process or path to force the system
    into Safe Mode. This Symbolic Logic approach works as follows: Collect process creation events (Windows
    Event ID 4688 / Sysmon Event ID 1) and alert when boot utilities are run with Safe Mode arguments,
    matching on both Image|endswith and OriginalFileName for `bcdedit.exe`/`bootcfg.exe` AND CommandLine
    containing `set` plus `safeboot`/`minimal`/`network` (e.g., `bcdedit /set {current} safeboot minimal`),
    or scripts modifying boot settings from unusual paths. Mirror the deterministic token logic of [Boot
    Configuration Tampering Via Bcdedit.EXE, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcdedit_boot_conf_tamper.yml)
    and the broad first-pass match in [Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE,
    SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_bcdedit_susp_execution.yml);
    validate with [Atomic Red Team T1688](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1688/T1688.md).
    Per [Microsoft bcdedit /set](https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/bcdedit--set),
    legitimate use is rare and should originate from interactive admin sessions. A positive result --
    a deterministic rule match, a statistical outlier, or a model alert -- is a strong indicator of Safe
    Mode Boot abuse; pivot to the responsible host, the user/SID and token privilege, the full process
    lineage of any bcdedit.exe/bootcfg.exe or reg.exe execution, the exact SafeBoot/Run registry values
    written, the timing of any reboot, and the state of EDR/AV service-start telemetry and post-boot egress
    after the next boot to scope whether defenses were actually disabled. A negative result helps rule
    out this particular evasion vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, low-and-slow, or living-off-the-land variants.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Windows Endpoints, Critical Application Servers, Domain Controllers, Executive Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Boot utility and command-line match

      SEARCH process_creation OR registry OR service/boot events as described above

      // match bcdedit.exe/bootcfg.exe Image+OriginalFileName, CommandLine tokens

      //   (set, safeboot, minimal, network, safebootalternateshell),

      //   or SafeBoot\{Minimal,Network}/Run key writes and ''*''-prefixed values

      | WHERE actor NOT IN approved_admin_context AND NOT IN vendor_allowlist

      | ALERT high severity and log host/user/process-lineage for review'
- question: '[Defense Impairment] Process Parent-Child Rarity Analysis: Can you determine whether A process
