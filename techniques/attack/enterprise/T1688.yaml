name: 'T1688: Safe Mode Boot'
id: ae7aece8-be3b-44e6-b7f0-e6301c08923a
description: 'This playbook helps an analyst investigate whether an adversary is abusing Windows Safe
  Mode to disable or evade endpoint defenses (MITRE ATT&CK T1688, Safe Mode Boot). Safe Mode starts Windows
  with a minimal set of drivers and services, and third-party security software such as EDR and AV frequently
  does not load in that limited environment -- a fact ransomware crews (e.g., Snatch, MedusaLocker, REvil)
  have weaponized to detonate payloads while defenses are blind. Under the Defense Impairment tactic,
  this hunt spans all Windows endpoints, critical application and infrastructure servers, domain controllers,
  executive workstations, network egress points, and authentication servers. It pursues the behavior from
  several complementary angles: process executions of boot-configuration utilities (bcdedit.exe, bootcfg.exe)
  carrying safeboot/minimal/network tokens, especially from rare or non-admin parents; registry persistence
  written under HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\{Minimal,Network} and Run keys with asterisk-prefixed
  value names that force execution in Safe Mode; post-boot telemetry showing absent EDR/AV service starts,
  anomalous process sets, or unexpected egress consistent with a Safe Mode environment; and full multi-stage
  attack-chain correlation (boot edit -> reboot -> anomalous post-boot activity or missing defensive telemetry)
  on a single host. Detection methods combine deterministic symbolic-logic rules (command-line and registry-path
  token matches, service-absence and chain-completion logic), statistical baselining (parent-child and
  process-key rarity, Z-score frequency outliers, post-boot process/destination entropy, weighted sequence
  risk scoring), and machine learning (Random Forest/XGBoost/Isolation Forest scoring, LSTM/DeepLog and
  KAIROS/HOLMES provenance and HMM sequence models), applied across Windows Event IDs 4688/4657/6005/7036/1074,
  Sysmon Event IDs 1/12/13, and Zeek conn.log.'
type: technique
