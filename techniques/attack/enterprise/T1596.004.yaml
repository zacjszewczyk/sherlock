  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches CDN data
    and misconfigurations to map the organization''s origin infrastructure, find non-public content, and
    identify weakly protected assets that enable follow-on active scanning, infrastructure acquisition,
    or initial access. This evidence focuses on the condition that an HTTP request to a CDN-hosted asset
    originates from an IP address on a threat intelligence blocklist, or the request contains a User-Agent
    string matching a known reconnaissance tool (e.g., Nuclei, Nmap, Zgrab, Dirb), as observed in network
    logs. The ''High-rate CDN traffic with failure-state tracking'' approach (Statistical Method) works
    as follows: Baseline per-minute CDN request counts (Volume/Frequency) per external IP over a rolling
    30 days and flag those exceeding the 95th percentile; jointly compute each IP''s HTTP 4xx/5xx-to-total
    ratio (State) and escalate when both rate and failure ratio are elevated, since scanners generate
    disproportionate failures ([Anomaly Detection of Web-based Attacks, Kruegel & Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf);
    success/fail sequential model in [Fast Portscan Detection, Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf)).
    Derive site-specific percentile/ratio thresholds from your own traffic. A positive result -- a deterministic
    rule match, a statistical outlier, or a model alert -- indicates probable CDN-focused reconnaissance
    or CDN-bypass against your environment; pivot to the source IP/ASN and its reputation, the targeted
    URIs/subdomains/origin IPs, the response codes and TLS/HTTP fingerprints, and the timing and volume
    of the activity to scope intent and whether it advanced toward access. A negative result helps rule
    out this specific vector but should be corroborated with the other questions in this playbook, since
    any single method can miss low-and-slow, distributed, or off-network reconnaissance.'
