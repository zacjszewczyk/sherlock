questions:
- question: '[Reconnaissance] Using the ''Threat-intel and scanner fingerprint correlation'' (Symbolic
    Logic) approach: can you determine whether an HTTP request to a CDN-hosted asset originates from an
    IP address on a threat intelligence blocklist, or the request contains a User-Agent string matching
    a known reconnaissance tool (e.g., Nuclei, Nmap, Zgrab, Dirb), as observed in network logs. This investigates
    the condition described and applies the symbolic logic technique to confirm or rule out adversary
    CDN reconnaissance.'
  context: 'Why this matters: Under the Reconnaissance tactic (TA0043), an adversary searches CDN data
    and misconfigurations to map the organization''s origin infrastructure, find non-public content, and
    identify weakly protected assets that enable follow-on active scanning, infrastructure acquisition,
    or initial access. This evidence focuses on the condition that an HTTP request to a CDN-hosted asset
    originates from an IP address on a threat intelligence blocklist, or the request contains a User-Agent
    string matching a known reconnaissance tool (e.g., Nuclei, Nmap, Zgrab, Dirb), as observed in network
    logs. The ''Threat-intel and scanner fingerprint correlation'' approach (Symbolic Logic) works as
    follows: Correlate Zeek conn.log source IPs against TI blocklists/TOR exit lists and match http.log
    User-Agent and uri fields to a recon-tool watchlist (Nuclei, zgrab, dirb, Nmap, masscan) using community
    rule packs ([SigmaHQ](https://github.com/SigmaHQ/sigma)); in parallel deny-list known scanner TLS/HTTP
    stacks via Zeek ssl.log [JA3/JA3S](https://github.com/salesforce/ja3) and version-resilient [JA4+/JA4H
    header-order](https://github.com/FoxIO-LLC/ja4) fingerprints, and alert when a client presents a non-browser
    JA3/JA4 while claiming a browser User-Agent. Keep these deterministic matches as a floor. A positive
    result -- a deterministic rule match, a statistical outlier, or a model alert -- indicates probable
    CDN-focused reconnaissance or CDN-bypass against your environment; pivot to the source IP/ASN and
    its reputation, the targeted URIs/subdomains/origin IPs, the response codes and TLS/HTTP fingerprints,
    and the timing and volume of the activity to scope intent and whether it advanced toward access. A
    negative result helps rule out this specific vector but should be corroborated with the other questions
    in this playbook, since any single method can miss low-and-slow, distributed, or off-network reconnaissance.'
