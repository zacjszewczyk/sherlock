    query: "# Threat-intel and scanner fingerprint correlation (Symbolic Logic)\n# Evidence: An HTTP request\
      \ to a CDN-hosted asset originates from an IP address on a threat intelligence blocklist, or the\
      \ request contains a User-Agent string matching a known reconnaissance tool (e.g., Nuclei, Nmap,\
      \ Zgrab, Dirb), as observed in network logs.\nsource = Zeek logs (http/conn/dns/ssl as applicable)\n\
      alert WHERE matches_watchlist_or_indicator(record)\n  # e.g. src_ip in TI_blocklist OR user_agent\
      \ in RECON_TOOLS\n  #      OR uri in SENSITIVE_PATHS OR ja3/ja4 in SCANNER_FINGERPRINTS\n  #   \
      \   OR cmdline ~ CDN_SECRET_KEYWORDS (Win 4688 / Sysmon 1)\n  # deploy maintained SigmaHQ rule packs\
      \ as deterministic floor\nOUTPUT src_ip, user_agent, uri, status_code, ja3/ja4, host"
- question: '[Reconnaissance] Using the ''High-rate CDN traffic with failure-state tracking'' (Statistical
    Method) approach: can you determine whether an HTTP request to a CDN-hosted asset originates from
    an IP address on a threat intelligence blocklist, or the request contains a User-Agent string matching
    a known reconnaissance tool (e.g., Nuclei, Nmap, Zgrab, Dirb), as observed in network logs. This investigates
    the condition described and applies the statistical method technique to confirm or rule out adversary
