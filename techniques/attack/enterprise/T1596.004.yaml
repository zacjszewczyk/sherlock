name: 'T1596.004: CDNs'
id: 1cec4ae8-0f6a-44c5-ac8e-f7d8354912ba
description: 'This playbook helps an analyst investigate whether an adversary is gathering information
  about the organization by abusing its Content Delivery Network (CDN) footprint (MITRE ATT&CK T1596.004,
  Search Open Technical Databases: CDNs). CDNs host content across distributed, load-balanced edge servers,
  and adversaries mine CDN data and misconfigurations to enumerate origin servers, discover content not
  meant to be public, and find login portals or assets lacking the protections present on the main site
  -- feeding later active scanning, infrastructure acquisition, or initial access. Because much of this
  reconnaissance happens off-network and at high volume, the hunt focuses on the observable edges: HTTP
  requests to CDN-hosted assets from threat-intel-listed IPs or carrying recon-tool User-Agents and non-browser
  TLS/HTTP fingerprints; probing of sensitive, non-public URI paths (/.git/config, /.env, /actuator/health)
  that draw 4xx/5xx errors; high-rate subdomain enumeration (NXDOMAIN bursts) and directory brute-forcing
  with high-entropy paths; external non-CDN hosts connecting directly to origin server IPs to bypass the
  CDN (CDN-piercing), corroborated via TLS certificate/JA3S matches and Certificate Transparency monitoring;
  and internal hosts or processes searching for CDN-related secrets (origin_server, cdn_api_key) or querying
  CDN management portals. Detection methods combine deterministic symbolic-logic rules (TI/scanner watchlists,
  JA3/JA4 fingerprinting, sensitive-URI and keyword rule packs, Certificate Transparency and origin allow-lists),
  statistical baselining (per-IP request-rate and error-ratio percentiles, Threshold Random Walk sequential
  failure testing, chi-square/KL-divergence character-distribution scoring, ASN prevalence/rarity, ARIMA/Prophet
  forecasting), and machine learning (Isolation Forest / logistic-regression request scoring with LIME
  attribution, LSTM/n-gram URI sequence models, DBSCAN scanner clustering, and peer-group outlier detection),
  applied across Zeek http/conn/dns/ssl logs and Windows process and object-access events, so the analyst
  can corroborate suspected CDN reconnaissance from multiple angles.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
