name: 'T1205.002: Traffic Signaling: Socket Filters'
id: 157bd407-1cb4-4258-9216-b2c65d02dfde
description: 'Investigate adversary use of socket filters (e.g., libpcap/BPF on Unix-like hosts, WinPcap/Npcap
  on Windows) to implant a passive, traffic-triggered backdoor for persistence and command and control.
  Implants such as BPFDoor open no listening port and are invisible to netstat: a process attaches a BPF
  program to a raw/packet socket, lies dormant, and only acts when a crafted ''magic packet'' that matches
  the filter arrives — at which point it spawns a reverse/bind shell or beacons back to the trigger source.
  This playbook helps an analyst hunt the full kill chain across endpoint and network telemetry: (1) the
  deterministic host floor of raw-socket creation plus filter attach (auditd/eBPF socket()+setsockopt
  SO_ATTACH_FILTER/SO_ATTACH_BPF, bpf(BPF_PROG_LOAD), /dev/bpf* opens, Windows WFP 5152/5156 filter adds,
  Sysmon module/driver loads of wpcap/packet/npf); (2) durable host artifacts such as execution from tmpfs
  (/dev/shm, /tmp, /run), deleted/anonymous binaries, and daemon-name masquerade; (3) the inbound trigger
  itself in Zeek conn.log (single small one-way packet, rare/high port, exotic protocol, low TTL, fragmentation
  anomalies, C2-reputation source); and (4) post-activation effects — shell spawns, first outbound connections
  back to the trigger origin, DGA/NXDOMAIN bursts, anti-forensic log clearing, and periodic beaconing.
  It supplies symbolic-logic, statistical, and machine-learning methods so a SOC analyst can detect both
  the dormant implant and its moment of activation across Stealth, Command and Control, and Persistence
  tactics.'
