questions:
- question: Which non-allowlisted processes on Linux/Unix hosts created a raw or packet socket (AF_PACKET/AF_INET,
    SOCK_RAW) and then attached a BPF program via setsockopt(SO_ATTACH_FILTER/SO_ATTACH_BPF) or bpf(BPF_PROG_LOAD)?
  context: 'This is the deterministic floor for socket-filter implants such as BPFDoor, which open no
    listening port and are therefore invisible to netstat — supporting Persistence and Command and Control
    while staying Stealthy. Using eBPF (Tracee/Falco) or auditd, look for the syscall chain socket(AF_PACKET|AF_INET,
    SOCK_RAW) followed by setsockopt with SO_ATTACH_FILTER/SO_ATTACH_BPF or a bpf(BPF_PROG_LOAD), where
    the executable is NOT on a sniffer allowlist (tcpdump, wireshark/dumpcap, tshark, dhclient, zeek,
    nmap). A positive match means a non-sniffer program is silently arming itself to watch raw traffic
    — the exact behavior BPFDoor exhibits. Surface PID, exe path, cap_net_raw, parent process, and user
    so the analyst can immediately triage provenance; a benign result is typically an allowlisted capture
    tool or DHCP client. Sources: [ExaTrack](https://www.exatrack.com/public/Tricephalic_Hellkeeper.pdf);
    [Tracee](https://github.com/aquasecurity/tracee); [Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux).'
  answer_sources:
  - auditd:SYSCALL
  - linux:osquery
  - WinEventLog:Sysmon
  - 'NAI: Linux servers/workstations with auditd or eBPF agent (Sysmon for Linux / Tracee / Falco), osquery
    fleet, internet-facing hosts running libpcap'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (auditd:SYSCALL, eBPF, WinEventLog:Sysmon)\n  | where syscall=socket AND (domain=AF_PACKET\
      \ OR domain=AF_INET) AND type=SOCK_RAW\n  | join same pid/exe where syscall=setsockopt AND optname\
      \ IN (SO_ATTACH_FILTER, SO_ATTACH_BPF)\n     OR syscall=bpf AND cmd=BPF_PROG_LOAD\n  | where exe\
      \ NOT IN allowlist(tcpdump,dumpcap,tshark,wireshark,dhclient,zeek,nmap)\n  | emit pid, exe, parent,\
      \ uid, cap_net_raw, cmdline -> alert"
- question: Across the fleet, which executables that hold an AF_PACKET/SOCK_RAW socket are statistically
    rare — below 0.1% environment-wide frequency or never previously seen on that host?
  context: 'Legitimate raw-socket use is dominated by a tiny set of capture tools, so a per-host and environment-wide
    frequency table of raw-socket-capable executables makes implants stand out. Alert when a process holding
    a raw/packet socket falls below the 0.1% environment frequency, or when it is a never-before-seen
    executable on that host — treating both the low count (Frequency) and the never-before-seen condition
    (State) as distinct signals. This rarity baseline catches Stealthy persistence implants that masquerade
    as ordinary binaries but have no benign history of touching raw sockets. A positive is a rare/new
    binary with raw-socket capability; benign noise is usually a newly deployed but legitimate monitoring
    agent, which the analyst confirms against change records. Sources: [Sandfly](https://sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis).'
  answer_sources:
  - auditd:SYSCALL
  - linux:osquery
  - WinEventLog:Sysmon
  - 'NAI: Linux servers/workstations with auditd or eBPF agent (Sysmon for Linux / Tracee / Falco), osquery
    fleet, internet-facing hosts running libpcap'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (auditd:SYSCALL, linux:osquery) where has_raw_socket=true\n  | stats count\
      \ by exe, host\n  | eventstats sum(count) as total, dc(host) as hosts\n  | eval env_freq = count/total\n\
      \  | where env_freq < 0.001 OR first_seen_on_host within range\n  | emit exe, host, count, env_freq,\
      \ first_seen -> alert"
- question: Do raw-socket process events score as outliers when evaluated by an Isolation Forest over
    syscall-context features (exe path depth, uid, cap_net_raw, parent name, hour, filter length)?
  context: 'Where simple allowlists and frequency tables miss novel tooling, an unsupervised Isolation
    Forest trained on benign raw-socket process events learns the normal envelope and flags low-score
    anomalies — e.g., a deleted-binary path, a non-root parent, an atypical hour, or an unusually long
    filter program. This supports Stealth and Persistence detection by catching implants whose individual
    attributes look plausible but whose combination is abnormal. Per explainable-NIDS guidance, the alert
    should emit the top-3 contributing features so the analyst understands why the event scored anomalous.
    A low anomaly score with suspicious top features warrants host triage; high scores (normal) reflect
    routine capture activity. Sources: [Isolation Forest](https://doi.org/10.1145/2133360.2133363); [xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources:
  - auditd:SYSCALL
  - linux:osquery
  - WinEventLog:Sysmon
  - 'NAI: Linux servers/workstations with auditd or eBPF agent (Sysmon for Linux / Tracee / Falco), osquery
    fleet, internet-facing hosts running libpcap'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = IsolationForest(features=[exe_path_depth, uid, cap_net_raw, parent_name, hour,\
      \ filter_len])\n  | score raw_socket_events\n  | where anomaly_score < threshold\n  | emit event,\
      \ top3_features(shap) -> alert"
- question: Which processes that hold a raw/packet socket are executing from memory-backed or temporary
    paths (/dev/shm, /tmp, /var/run), from a deleted/anonymous binary, or under a name that masquerades
    a system daemon?
  context: 'BPFDoor-class implants copy themselves to /dev/shm and run from a deleted binary with a spoofed
    daemon-like name to achieve Stealthy Persistence. Alert when a process holding AF_PACKET/SOCK_RAW
    has an executable path under /dev/shm, /tmp, or /var/run, OR whose /proc/<pid>/exe readlink ends with
    '' (deleted)'', OR whose comm masquerades a known daemon while running from a non-package path. This
    combines raw-socket ownership (capability) with disreputable provenance (artifact). A positive is
    a strong implant indicator; benign hits are rare and usually involve short-lived scripts or installers
    running from /tmp, which the analyst can dismiss after confirming they lack a raw socket. Sources:
    [Elastic](https://www.elastic.co/security-labs/a-peek-behind-the-bpfdoor); [Sandfly](https://sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis).'
  answer_sources:
  - auditd:SYSCALL
  - WinEventLog:Sysmon
  - linux:osquery
  - 'NAI: Linux hosts with eBPF/auditd, osquery process+open-sockets tables, EDR with deleted-executable
    detection'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (auditd:SYSCALL, linux:osquery) where has_raw_socket=true\n  | where exe_path\
      \ MATCHES \"^(/dev/shm|/tmp|/var/run|/run)/\"\n     OR exe_readlink ENDSWITH \" (deleted)\"\n  \
      \   OR (comm IN system_daemon_names AND exe_path NOT IN package_db)\n  | emit pid, comm, exe_path,\
      \ deleted_flag, uid -> alert"
- question: Is the per-host-role rate of executions originating from tmpfs/shared-memory paths abnormally
    elevated (above mean + 3σ), and does any tmpfs execution co-occur with raw-socket ownership?
  context: 'In a healthy fleet, executions from tmpfs/shared-memory are near-zero for most host roles,
    so tracking the per-role rate and alerting beyond mean + 3σ exposes anomalous bursts of memory-resident
    execution typical of fileless or Stealthy implants. Most importantly, a tmpfs execution that co-occurs
    with raw-socket ownership is essentially never benign and should alert on its own. This statistical
    baseline complements the deterministic rule by catching implants that vary their exact path. A positive
    indicates either a spike of tmpfs execution or the highly specific tmpfs+raw-socket combination; benign
    spikes correlate with deployment/maintenance windows. Sources: [Sandfly](https://sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis).'
  answer_sources:
  - auditd:SYSCALL
  - WinEventLog:Sysmon
  - linux:osquery
  - 'NAI: Linux hosts with eBPF/auditd, osquery process+open-sockets tables, EDR with deleted-executable
    detection'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=process_exec | eval tmpfs = exe_path MATCHES \"^(/dev/shm|/tmp|/run)/\"\n  |\
      \ bin _time span=1d | stats count(eval(tmpfs)) as tmpfs_execs by host_role, _time\n  | eventstats\
      \ mean(tmpfs_execs) as m, stdev(tmpfs_execs) as s by host_role\n  | where tmpfs_execs > m + 3*s\
      \ OR (tmpfs AND has_raw_socket)\n  | emit host, host_role, tmpfs_execs -> alert"
- question: Which raw-socket processes fail to fit any benign cluster when their process-provenance features
    (path class, deleted-flag, comm-vs-path mismatch, uid, capabilities) are clustered with DBSCAN/Isolation
    Forest?
  context: 'Clustering process-provenance features lets benign raw-socket processes form dense groups
    while implants land as noise points or low-density outliers — useful for Stealthy Persistence hunting
    where the attacker mimics legitimate binaries. Apply DBSCAN (or Isolation Forest) over features such
    as path class (package vs tmpfs vs deleted), deleted-flag, comm-vs-path mismatch, uid, and capability
    set, and surface the top-3 distinguishing features for each isolated point. A process that does not
    belong to any benign cluster — especially one combining a deleted backing inode with a daemon-spoofed
    comm — is a prime implant candidate; tightly clustered points are routine and need no triage. Sources:
    [Isolation Forest](https://doi.org/10.1145/2133360.2133363); [xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources:
  - auditd:SYSCALL
  - WinEventLog:Sysmon
  - linux:osquery
  - 'NAI: Linux hosts with eBPF/auditd, osquery process+open-sockets tables, EDR with deleted-executable
    detection'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = features(path_class, deleted_flag, comm_path_mismatch, uid, caps) for raw_socket_procs\n\
      \  | DBSCAN(eps, min_samples) -> labels\n  | where label == -1  // noise / no benign cluster\n \
      \ | emit proc, top3_distinguishing_features -> alert"
- question: Are there inbound Zeek conn.log records matching a 'magic packet' trigger profile — a single
    packet (orig_pkts==1), small payload (orig_ip_bytes < 100), one-way state (S0/REJ/OTH), and either
    a non-standard port (>1024) or a C2-reputation source IP?
  context: 'The activation packet for a socket-filter backdoor is low-volume and one-way: the implant
    consumes it via BPF without the OS stack ever completing a handshake, so it appears as a single unanswered
    small packet. Fire a SIEM rule on conn.log inbound records with orig_pkts==1 and orig_ip_bytes < 100,
    conn_state in (S0,REJ,OTH), and either a non-standard destination port or a source IP on a C2 intel
    list — noting that triggers may also piggyback on already-open ports such as HTTP. This is the primary
    Command and Control trigger signature. A positive is a candidate trigger to correlate with on-host
    activation; benign matches include scanners and backscatter, which the analyst filters by reputation
    and target. Sources: [ExaTrack](https://www.exatrack.com/public/Tricephalic_Hellkeeper.pdf); [SPA
    survey](https://www.diva-portal.org/smash/get/diva2:1112494/FULLTEXT01.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network sensors at internet egress/ingress points, Virtual network taps in cloud environments
    (e.g., VPC Traffic Mirroring), Core network switch SPAN ports'
  range: Last 90 days; when a candidate is found, pivot to a +/- 15 s host-centered window for on-host
    activation
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  conn.log where local_resp=true\n  | where orig_pkts==1 AND orig_ip_bytes<100 AND conn_state\
      \ IN (\"S0\",\"REJ\",\"OTH\")\n  | where id.resp_p>1024 OR id.orig_h IN c2_intel_set\n  | emit ts,\
      \ id.orig_h, id.resp_h, id.resp_p, proto, conn_state -> notice"
- question: Per host, which inbound connections fall in the bottom 1% of destination-port frequency or
    more than 3σ below the host's mean packet/byte counts, and which hosts show a spike in S0/REJ/OTH
    (failed/one-way) ratios?
  context: 'Baselining each host''s inbound flow attributes (dport, proto, TCP flags, packet/byte counts)
    turns the rarity and one-way nature of a trigger into a statistical signal even without intel. Alert
    when a connection uses a bottom-1% port for that host OR is >3σ below the host mean for packets/bytes,
    and separately profile the S0/REJ/OTH ratio per host so a spike of unanswered single packets is itself
    flagged. This catches Command and Control triggers that avoid known-bad IPs. A positive is an anomalously
    rare/small/one-way inbound flow; benign deviations include occasional misconfigured clients, distinguished
    by repetition and source legitimacy. Sources: [ExaTrack](https://www.exatrack.com/public/Tricephalic_Hellkeeper.pdf);
    [Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network sensors at internet egress/ingress points, Virtual network taps in cloud environments
    (e.g., VPC Traffic Mirroring), Core network switch SPAN ports'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  conn.log inbound | stats count by resp_h, resp_p ; compute port_freq per host\n  | eventstats\
      \ mean(orig_pkts) as mp, stdev(orig_pkts) as sp,\n               mean(orig_ip_bytes) as mb, stdev(orig_ip_bytes)\
      \ as sb by resp_h\n  | where port_freq_pct < 0.01 OR orig_pkts < mp-3*sp OR orig_ip_bytes < mb-3*sb\n\
      \  | timechart ratio(conn_state in S0,REJ,OTH) by resp_h -> flag spikes"
- question: Do the bytes of small inbound payloads deviate sharply from the per-port/per-length service
    norm when scored with a PAYL-style 1-gram byte-frequency model (Mahalanobis distance)?
  context: 'Crafted trigger bytes rarely look like the legitimate service that normally uses a port. Build
    PAYL-style per-port, per-length byte-frequency (1-gram) models from benign traffic and score each
    small inbound payload by Mahalanobis distance from the expected distribution; a high distance means
    the payload''s byte composition is anomalous for that service — exactly what a hand-crafted magic
    packet looks like, even when piggybacked on an open port. This is a content-aware Command and Control
    trigger detector. A positive is a payload whose byte histogram diverges from the service norm; benign
    high-distance results often stem from encrypted or compressed legitimate traffic, which the analyst
    rules out by service context. Sources: [Wang & Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network sensors at internet egress/ingress points, Virtual network taps in cloud environments
    (e.g., VPC Traffic Mirroring), Core network switch SPAN ports'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  for each inbound payload with len L on port P:\n    model = PAYL[P][L]  // benign 1-gram\
      \ byte freq + covariance\n    d = mahalanobis(bytefreq(payload), model.mean, model.cov)\n    if\
      \ d > threshold[P][L]: emit ts, src, dst, P, L, d -> alert"
- question: Which inbound conn.log flows receive low anomaly scores from an Isolation Forest (or high
    reconstruction error from a Kitsune autoencoder) trained on benign flow features?
  context: 'An unsupervised model over benign conn.log flows (port, proto, duration, byte/pkt counts,
    flags) learns normal network behavior and flags candidate triggers as low-score (Isolation Forest)
    or high-reconstruction-error (Kitsune online autoencoder) outliers, catching novel Command and Control
    trigger patterns that escape fixed thresholds. Surface the top-3 contributing features for each flagged
    flow to speed triage. A positive is an inbound flow that is anomalous across multiple dimensions at
    once; benign anomalies (new legitimate services, backups) are confirmed by recurrence and endpoint
    identity. Kitsune''s streaming mode suits line-rate scoring at sensors. Sources: [Isolation Forest](https://doi.org/10.1145/2133360.2133363);
    [Kitsune](https://arxiv.org/abs/1802.09089); [xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Network sensors at internet egress/ingress points, Virtual network taps in cloud environments
    (e.g., VPC Traffic Mirroring), Core network switch SPAN ports'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = IsolationForest|KitsuneAE(features=[port,proto,duration,orig_bytes,resp_bytes,orig_pkts,flags])\n\
      \  | score inbound conn.log flows\n  | where anomaly_score < thr OR recon_error > thr\n  | emit\
      \ flow, top3_features -> alert"
- question: On Windows, which process-creation (4688 / Sysmon EID 1) or module-load (Sysmon EID 7) events
    reference packet-capture/raw-socket primitives (pcap, libpcap, winpcap, npcap, setsockopt, SO_ATTACH_FILTER,
    wpcap.dll, packet.dll, npf.sys), especially from user-writable paths?
  context: 'Windows socket-filter implants are the analogue of libpcap-based ones, relying on WinPcap/Npcap.
    Alert when 4688/Sysmon EID 1 command lines contain pcap/libpcap/winpcap/npcap/setsockopt/SO_ATTACH_FILTER,
    OR Sysmon EID 7 shows wpcap.dll/packet.dll/npf.sys loaded by a process not on a network/security-tool
    allowlist — particularly when the image runs from C:\Users\, C:\ProgramData\, or C:\Temp\. This supports
    Persistence and Stealth detection on Windows endpoints. A positive is non-allowlisted capture tooling,
    often the implant or its loader; benign hits are legitimate sniffers (Wireshark, Nmap) which the analyst
    confirms by path and signer. Sources: [ExaTrack](https://www.exatrack.com/public/Tricephalic_Hellkeeper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon
  - 'NAI: Endpoint security logs from all workstations and servers, Centralized Windows Event Log collection
    system, Live memory analysis on suspicious hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (EventID=4688 OR Sysmon EID=1) AND CommandLine MATCHES /(pcap|libpcap|winpcap|npcap|setsockopt|SO_ATTACH_FILTER)/i\n\
      \  OR (Sysmon EID=7 AND ImageLoaded IN (wpcap.dll, packet.dll, npf.sys) AND Image NOT IN allowlist)\n\
      \  | where Image MATCHES /^C:\\\\(Users|ProgramData|Temp)\\\\/i\n  | emit Image, CommandLine, ParentImage,\
      \ User, Signed -> alert"
- question: Which Windows process launches exceed the 99th percentile of command-line length or Shannon
    entropy for that NewProcessName, indicating obfuscated or encoded launch strings?
  context: 'Implants frequently launch with encoded/obfuscated command lines to evade string matching.
    Baseline per-NewProcessName command-line length and Shannon entropy and flag launches above the 99th
    percentile for that executable, which exposes packed or base64-encoded arguments even when the keyword
    list misses them — a Stealth-defeating statistical complement to the keyword rule. A positive is an
    unusually long/high-entropy command line for a given binary; benign cases include legitimate tools
    that pass encoded blobs (some installers, management agents), which the analyst validates by parent
    and signer. Sources: [Ghorbani et al.](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon
  - 'NAI: Endpoint security logs from all workstations and servers, Centralized Windows Event Log collection
    system, Live memory analysis on suspicious hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  EventID=4688 | eval cl_len=len(CommandLine), cl_ent=shannon_entropy(CommandLine)\n \
      \ | eventstats perc99(cl_len) as p99_len, perc99(cl_ent) as p99_ent by NewProcessName\n  | where\
      \ cl_len > p99_len OR cl_ent > p99_ent\n  | emit NewProcessName, CommandLine, cl_len, cl_ent, ParentProcessName\
      \ -> alert"
- question: Which Windows process-creation events are isolated as rare raw-socket tooling when DBSCAN/Isolation
    Forest is applied to features such as parent name, path class, command-line length/entropy, and signer?
  context: 'Clustering process-creation features groups routine launches together and isolates rare raw-socket/capture
    tooling as outliers, catching novel or renamed implants on Windows endpoints (Persistence/Stealth).
    Use parent name, path class (system vs user-writable), command-line length and entropy, and code-signing
    status as features; emit the top-3 features driving each outlier score. A positive is a process whose
    feature combination is unlike normal launches — e.g., an unsigned binary from C:\Temp with a high-entropy
    command line spawned by an unusual parent; dense-cluster launches are routine and need no action.
    Sources: [Isolation Forest](https://doi.org/10.1145/2133360.2133363); [xNIDS](https://www.usenix.org/conference/usenixsecurity23/presentation/wei-feng).'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon
  - 'NAI: Endpoint security logs from all workstations and servers, Centralized Windows Event Log collection
    system, Live memory analysis on suspicious hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = features(parent_name, path_class, cl_len, cl_entropy, signer) for 4688/EID1 events\n\
      \  | IsolationForest|DBSCAN -> outliers\n  | emit process, top3_features -> alert"
- question: On any host, did a single small inbound packet get followed within ~15 seconds by a previously
    dormant process spawning a shell (cmd/powershell/bash/sh) or opening its first outbound connection
    — ideally back to the trigger source IP?
  context: 'This temporal correlation is the core activation signature of a socket-filter backdoor and
    ties the Command and Control trigger to on-host effect. Maintain state on suspected trigger packets
    (single small inbound packet) and alert if, within 15 s on the same host, a dormant process spawns
    a shell or makes its first outbound connection — strongest when that connection returns to the trigger
    source IP, matching the BPFDoor activation chain. This correlation is far more specific than either
    signal alone. A positive is the trigger→activation chain on one host within the window; benign coincidences
    are rare and easily dismissed when the outbound destination differs from the inbound source. Sources:
    [Elastic](https://www.elastic.co/security-labs/a-peek-behind-the-bpfdoor); [ExaTrack](https://www.exatrack.com/public/Tricephalic_Hellkeeper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon
  - Zeek conn.log
  - auditd:SYSCALL
  - 'NAI: Centralized SIEM capable of correlating endpoint and network logs, Data lake with host and network
    telemetry, Endpoint Detection and Response (EDR) platform logs'
  range: Last 90 days; correlate within a 15 s host-centered window around each candidate trigger packet
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  trig = inbound flows where orig_pkts==1 AND orig_ip_bytes<100 (state-stored by host)\n\
      \  | join host, _time +0..15s with\n     (4688/EID1 where Image IN (cmd,powershell,bash,sh) AND\
      \ parent_dormant)\n     OR (Sysmon EID3/conn.log first outbound from host)\n  | where outbound.dest\
      \ == trig.src  // strongest case\n  | emit host, trig.src, child_proc, outbound.dest -> alert"
- question: After a rare inbound packet, does a host's process-creation or outbound-connection count exceed
    mean + 3σ within the activation window?
  context: 'Activation often produces a measurable burst of child processes and outbound connections where
    the host was previously quiet. Track per-host process-creation rate and outbound-connection State,
    and alert when a rare inbound packet is followed by a spawn/outbound count exceeding mean + 3σ within
    the window — capturing both the Volume and Frequency of triggered execution. This statistical view
    catches Command and Control activations even when the exact child process or destination varies. A
    positive is an anomalous post-trigger spike on an otherwise idle host; benign spikes correlate with
