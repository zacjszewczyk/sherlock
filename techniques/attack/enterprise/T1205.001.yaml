- question: Did a successful TCP connection (conn_state SF) land on a (host,port) pair that has accepted
    no connections in the last 30 days, within 10 seconds of 3 or more failed attempts (REJ/S0) from the
    same source to different ports on that host?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. The payoff
    of knocking is the first successful connection to a port that was previously closed. Track (host,port)
    pairs with successful SF over the last 30 days; when a new SF occurs on an unseen pair, require at
    least 3 preceding failed attempts (REJ/S0) from the same source within 30s before firing. This captures
    the closed->open state transition central to knocking and avoids alerting on normal new services that
    lack a preceding failed burst. A new SF on a never-before-seen port immediately following a same-source
    failed burst is the open-pinhole-then-connect signature and warrants immediate investigation of what
    now listens on that port. Sources: [Improved Port Knocking with Strong Authentication](https://www.acsac.org/2005/papers/156.pdf);
    [Single Packet Authorization with Fwknop](https://www.linuxjournal.com/article/9621). [Method: Base
    new connections against recent history (Symbolic Logic)]'
  answer_sources: &id005
  - Zeek conn.log
  - 'NAI: DMZ Servers, Externally-facing Application Gateways, Network Taps'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "seen = set((host,port) with SF in last_30d)\nfor c in zeek_conn where conn_state=='SF' and\
      \ (c.resp_h,c.resp_p) not in seen:\n  pre = count(failed REJ/S0 from c.orig_h to c.resp_h other\
      \ ports within 30s before c)\n  if pre>=3: alert(c.resp_h, c.resp_p, c.orig_h)"
- question: For each host, how surprising is a new SF on an unfamiliar port given a preceding failed burst
    (probability above mean+3sigma), with the burst itself confirmed by the TRW failed/successful walk?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Profile
    each host''s listening ports over 30 days and compute the conditional probability of a new SF on an
    unfamiliar port given a preceding failed burst; flag events whose surprise exceeds mean+3sigma, and
    confirm the preceding burst with the Threshold Random Walk failed/successful test. This grades the
    novelty of the opened port rather than treating all new ports equally, so a connection to a port the
    host has never offered, immediately after a failing burst, scores highest. Report the surprise score
    and the confirming TRW verdict so analysts can prioritize the most improbable activations. Sources:
    [Fast Portscan Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).
    [Method: Score rare post-knock connections (Statistical Method)]'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "p_port = port_profile_30d(host)\nfor c in SF on host:\n  surprise = -log(p_port[c.resp_p]\
      \ given preceding_failed_burst)\n  if surprise > mean+3*std and trw(burst)=='malicious': alert(host,c.resp_p,surprise)"
- question: When an Isolation Forest / autoencoder scores benign connection 5-tuples and volume features,
    which SF anomalies are temporally linked to 3 or more failed knocks within 30s, and what top-3 features
    (port novelty, failed-ratio, byte volume) explain them?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Train an
    Isolation Forest / autoencoder on benign connection 5-tuples (src_ip, dst_ip, dst_port, proto, conn_state)
    plus volume features (orig_bytes/resp_bytes); when an SF anomaly is temporally linked to >=3 failed
    knocks within 30s, classify it as a successful knock and surface the top-3 features (e.g., port novelty,
    failed-ratio, byte volume) via attribution. This learns the host''s normal connection manifold and
    flags the unusual post-knock session even when the port number alone looks ordinary. A high anomaly
