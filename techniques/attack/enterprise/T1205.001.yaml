questions:
- question: Is a single external source touching a short ordered run of distinct closed ports (3 to 10
    distinct destination ports, conn_state REJ/RSTO/S0, zero SF) on one internal host inside a 30-second
    window, where that source IP also appears on a high-confidence threat-intelligence feed?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. This is
    the canonical inbound port-knock signature: a deterministic, failure-only burst against a small set
    of closed ports that primes a host-based firewall pinhole. Filter Zeek conn.log to failed connection
    states (REJ, RSTO, S0), apply a 30-second sliding window grouped by (src_ip, dst_ip), count distinct
    dst_port, and require the burst be 100% failed (no SF to the same host in-window). Fire when the distinct-port
    count is between 3 and 10 AND the source matches your highest-fidelity CTI list. The 3-10 floor is
    the documented knock-sequence length; tune MinSeqLen/MaxSeqLen per environment but never delete the
    floor or you will drown in benign single-port retries. A positive result with a CTI hit is a strong,
    actionable lead; a positive structure without CTI should be downgraded but retained for correlation
    with later evidence (firewall change, first successful connect). Sources: [Improved Port Knocking
    with Strong Authentication](https://www.acsac.org/2005/papers/156.pdf); [Single Packet Authorization
    with Fwknop](https://www.linuxjournal.com/article/9621). [Method: Match knock sequences to threat
    intel (Symbolic Logic)]'
  answer_sources: &id001
  - Zeek conn.log
  - 'NAI: Internet Gateway Firewall, DMZ Network Segments, Cloud VPC Flow Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'from zeek_conn where conn_state in (''REJ'',''RSTO'',''S0'')

      | window 30s sliding by src_ip,dst_ip

      | stats dcount(dst_port) as nports, count(eval(conn_state==''SF'')) as nsf by src_ip,dst_ip,window

      | where nports>=3 and nports<=10 and nsf==0

      | lookup threat_intel_high_conf on src_ip

      | where ti_match==true | alert'
  - technology: Zeek/pseudocode
    query: 'knock = filter(conn.log, conn_state in {REJ,RSTO,S0})

      group knock by (id.orig_h,id.resp_h) within 30s

      if distinct(id.resp_p) in [3,10] and count(SF)==0 and in_intel(id.orig_h): raise(''knock+CTI'')'
- question: Across the gateway, which source IPs exhibit a statistically anomalous failed-connection walk
    (a sequential-probability-ratio verdict after ~4-5 failures) combined with a high knock-score driven
    by failed-burst frequency and a high-entropy destination-port sequence?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Pure signatures
    miss novel sequences, so model each source''s connection outcomes as a random walk and apply a Threshold
    Random Walk / sequential probability ratio test on the failed-to-successful ratio so a verdict fires
    after roughly 4-5 failures with bounded false positives. In parallel compute a per-IP knock score
    from failed-burst frequency (bursts/min) and the Shannon entropy of the dst_port sequence, and flag
    IPs in the 99th percentile of knock score with entropy > 2.0 (ordered, varied closed ports rather
    than a single repeated port). Derive the percentile cutoff from a rolling 30-day per-gateway baseline
    so the threshold adapts to the site. A high SPRT-positive, high-entropy, high-frequency source is
    a likely knocker even with no CTI match. Sources: [Fast Portscan Detection Using Sequential Hypothesis
    Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf). [Method: Score rare, high-entropy knock
    behavior (Statistical Method)]'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = pctl_30d(knock_score, 99) by gateway\nfor src in sources:\n  sprt = trw(failed,success)\
      \  # accept H1 ~4-5 failures\n  ks = freq(failed_bursts) ; ent = shannon(dst_port_seq)\n  if sprt=='malicious'\
      \ and ks>=baseline and ent>2.0: alert(src, observed=ks, ent)"
- question: When an ordered connection sequence is scored by a trained RNN/LSTM, does it classify as a
    malicious port-knock (P>0.9) rather than benign scanning, and what top-3 features (distinct-port count,
    failed-ratio, inter-arrival) drove that call?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Ordered
    knocks differ from broad scans in their structure: a short, ordered, low-volume run with consistent
    inter-arrival timing versus a wide, fan-out sweep. Train an RNN/LSTM on ordered sequences using timestamp-delta,
    dst_port, TCP flags, and conn_state as features to discriminate ordered knocks from benign scanning,
    training the benign class only on validated normal flows. Elevate when P(malicious knock) > 0.9 and
    surface the top-3 contributing features via per-prediction attribution so an analyst can sanity-check
    the verdict. A high-confidence classification with sensible attribution (e.g., tight distinct-port
    count, near-100% failed-ratio, regular inter-arrival) is a strong indicator; a low-confidence or oddly-attributed
    score should be triaged with the symbolic and statistical checks. Sources: [Robust IoT Security Using
    Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4); [Malware
    Detection for IoT Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/).
    [Method: Classify sequences with an RNN (Machine Learning)]'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = order_by_time(conn[src,dst]); X = [dt,dst_port,tcp_flags,conn_state]

      p = lstm_knock.predict(X)

      if p>0.9: alert(src,dst, p, top3=explain(lstm_knock,X))'
- question: Has any monitored endpoint executed a known port-knocking/SPA daemon, its configuration file,
    or a libpcap/raw-socket sniffer used to observe knock packets (e.g., knockd, fwknopd, knockd.conf,
    tcpdump, tshark) as seen in process-creation telemetry?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. The most
    direct evidence of a knock implant is the daemon itself or the sniffer it uses to watch for trigger
    packets. Maintain a watchlist of knock/SPA binaries and configs (knockd, fwknopd, knockd.conf) plus
    libpcap/raw-socket consumers (tcpdump, tshark) that such daemons use to observe the signal. Match
    Windows Event ID 4688 and Sysmon EID 1 on NewProcessName, Image, CommandLine, OriginalFileName, or
    Hashes and trigger on any hit. On Windows these tools are unusual outside of admin/IR contexts, so
    a hit on a server or workstation is high-value; confirm by checking the parent process, signer, and
    whether the host also shows the network knock structure or a new listening port. Sources: [Single
    Packet Authorization with Fwknop](https://www.linuxjournal.com/article/9621); [Improved Port Knocking
    with Strong Authentication](https://www.acsac.org/2005/papers/156.pdf). [Method: Alert on known knock
    daemons (Symbolic Logic)]'
  answer_sources: &id002
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Critical Server Subnets, Domain Controllers, User Workstation VLANs, Endpoint Detection and
    Response (EDR) platform logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'watch = {knockd,knockd.exe,fwknopd,fwknopd.exe,knockd.conf,tcpdump,tshark,WinDivert}

      from (win4688 or sysmon1)

      | where lower(Image) in watch or match(CommandLine, watch) or OriginalFileName in watch or Hashes
      in known_knock_hashes

      | alert host,user,ParentImage,CommandLine'
- question: Among new process executions, which command lines are both enterprise-rare (99.9th percentile
    by frequency over 30 days) AND contain knock/firewall tokens such as 'knock', 'fwknop', '--passwd',
    'iptables -A', 'firewall-cmd', or pcap filter expressions?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Adversaries
    rename binaries, so rarity plus token content beats name-matching alone. Baseline command-line frequency
    enterprise-wide over 30 days; for each new 4688/EID1 record compute a rarity score and flag the 99.9th
    percentile that also contains knock/firewall tokens or pcap filter expressions. Report the observed
    count versus baseline mean in the alert so the analyst sees how unusual the command truly is. A vanishingly
    rare command line that manipulates firewall rules or installs a packet filter on a server that has
    never run such commands is a strong lead, especially when paired with the network knock evidence.
    [Method: Score rare knock-related command lines (Statistical Method)]'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "freq = count_30d(cmdline_norm) by enterprise\nfor e in (win4688|sysmon1):\n  rscore = rarity(e.CommandLine,\
      \ freq)\n  if rscore>=pctl(99.9) and contains(e.CommandLine,{knock,fwknop,'--passwd','iptables -A','firewall-cmd',pcap_filter}):\n\
      \    alert(e, observed=cnt, baseline_mean=mean)"
- question: When new executions are scored by a one-class SVM / Isolation Forest trained on legitimate
    command lines, which port/firewall-related executions are flagged as anomalies, and what top-3 tokens
    drove the score?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Token lists
    are brittle against obfuscation, so learn the shape of normal command lines and flag outliers. Train
    a one-class SVM / Isolation Forest on 30 days of legitimate command lines, score new executions, and
    flag port/firewall-related anomalies, surfacing the top-3 driving tokens via LIME-style attribution.
    This catches novel knock tooling and encoded invocations that token rules miss. A strong anomaly whose
    attribution points at firewall/port manipulation or packet capture is worth pivoting on; benign-but-rare
    admin scripts will surface too, so corroborate with the network and firewall-change evidence before
    escalating. Sources: [Malware Detection for IoT Using One-Class Classification](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/);
    [Robust IoT Security Using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4).
    [Method: Detect anomalous command lines with SVM (Machine Learning)]'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = ocsvm.fit(legit_cmdlines_30d)\nfor e in new_exec:\n  s = model.score(vectorize(e.CommandLine))\n\
      \  if s<thr and firewall_or_port_related(e): alert(e, top3=lime(model,e))"
- question: Within 5 seconds of the final attempt in a suspected inbound knock burst, did the targeted
    host add/modify a Windows Firewall rule (Event ID 4946/4950), open a new listening port (Event ID
    5154), or have a process begin listening (Sysmon EID 3)?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. The defining
    behavior of knockd/fwknop is to insert a dynamic firewall pinhole immediately after a valid sequence
    and before the first allowed connection. Alert when a suspected knock (a Zeek conn.log failed burst)
    is followed within 5 seconds by Windows Event ID 4946/4950/5154 or Sysmon EID 3 on the same targeted
    host. Keep the 5-second floor and widen only with measured clock skew between the network sensor and
    the endpoint. This temporal join is one of the highest-confidence detections in the playbook: a failed
    knock burst that immediately precedes a firewall rule add and a new listener on the same host is very
    hard to explain benignly. Sources: [Single Packet Authorization with Fwknop](https://www.linuxjournal.com/article/9621).
    [Method: Correlate knocks with firewall events (Symbolic Logic)]'
  answer_sources: &id003
  - Zeek conn.log
  - Windows Event ID 5154
  - Windows Event ID 4946
  - Windows Event ID 4950
  - Sysmon Event ID 3
  - 'NAI: Firewall Management Interfaces, Critical Application Servers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'knock = knock_bursts(zeek_conn)  # failed burst per (src,dst)

      fw = (win4946|win4950|win5154|sysmon3) by host,time

      join knock to fw on dst_host where fw.time - knock.last_attempt <= 5s

      | alert dst_host, src_ip, fw.rule, fw.port'
- question: Does a host show a change-point step in its firewall-rule-add rate or a newly-listening port
    that breaks from its own established baseline (detected via CUSUM/PELT/Bayesian online change-point),
    beyond a mean+3sigma backstop?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. A fixed
    mean+3sigma threshold misreacts to bursty admin activity, so model each host''s firewall-change/listener-start
    time-series and apply change-point detection (CUSUM, PELT, or Bayesian online) to flag a knock-induced
    step change in rule-add rate or a newly-listening port with bounded false positives. Retain mean+3sigma
    as a deterministic backstop. A host that has been stable for weeks and then exhibits a sudden, sustained
    shift in firewall mutations or a brand-new listener is suspicious, particularly when the shift coincides
    with inbound failed-connection bursts. Report the detected change-point time so it can be aligned
    with network evidence. Sources: [A Survey of Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    [Method: Flag anomalous firewall changes (Statistical Method)]'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ts = per_host_count(fw_rule_add | listener_start) by minute

      cp = changepoint(ts, method=''PELT|CUSUM|BOCPD'')

      if cp.detected and ts.post > mean+3*std: alert(host, cp_time=cp.t, rate_pre, rate_post)'
- question: Modeling hosts/IPs/processes as nodes and knock-attempt, firewall-change, and listener-start
    as edges, does a knock-attempt edge connect via a short path to a firewall-change or listener-start
    edge on the same host within the window?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Graph reasoning
    links events that simple joins miss and yields an explainable path. Model events as a graph (nodes:
    hosts/IPs/processes; edges: knock-attempt, firewall-change, listener-start). On a knock-attempt edge,
    search for a short path to a firewall-change/listener-start edge on the same host within the window
    and report the discovered path (the top-3 edges) as the explanation. A short, time-ordered path of
    knock -> firewall-change -> listener on one host is the full attack chain made visible; the path itself
    becomes the analyst''s evidence and pivot set. Sources: [Robust IoT Security Using Isolation Forest
    and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4). [Method: Graph knock-to-listener
    paths (Machine Learning)]'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: Graph/pseudocode
    query: "G = build_graph(knock_edges, fw_change_edges, listener_edges)\nfor k in knock_edges:\n  path\
      \ = shortest_path(G, k, target={fw_change,listener}, same_host=True, within=window)\n  if path and\
      \ len(path)<=3: alert(host, path)"
- question: Does a knock sequence (3 to 10 failed connections to distinct closed ports within 30 seconds,
    no SF in-window) originate from an IP listed by CTI as an anonymization service such as a TOR exit,
    public proxy, or commercial VPN?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Adversaries
    frequently knock from anonymizing infrastructure to mask origin. Detect the knock structure (3-10
    failed connections to distinct closed ports within 30s, failure-dominated) and join src_ip against
    anonymizer CTI feeds, alerting whenever a knock source matches a listed anonymization service. Legitimate
    users rarely arrive at internal closed ports via TOR/VPN exit nodes in a deterministic failed burst,
    so the combination of knock structure plus anonymizer origin is a meaningful escalation even absent
    other evidence. Keep the anonymizer feed fresh, since exit-node lists churn rapidly. Sources: [Improved
    Port Knocking with Strong Authentication](https://www.acsac.org/2005/papers/156.pdf). [Method: Join
    knock sequences with anonymizer feeds (Symbolic Logic)]'
  answer_sources: &id004
  - Zeek conn.log
  - 'NAI: Internet Gateway, Egress Network Filters, Proxy Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'knock = knock_bursts(zeek_conn)  # 3-10 distinct ports, 30s, 0 SF

      | lookup anonymizer_cti on src_ip

      | where anon_type in (''tor_exit'',''proxy'',''vpn'') | alert src_ip,dst,anon_type'
- question: Among knock sources, which fall in the 99th percentile of ASN/country rarity (over a 30-day
    baseline) AND also carry a genuine failure-dominated SPRT verdict, so only rare-anonymizer-ASN, truly-failing
    bursts escalate?
  context: 'In the context of Stealth (TA0005), port knocking keeps the triggered port closed to ordinary
    scanners and buries the activation traffic inside everyday failed-connection noise, so this check
    is about surfacing the concealed signal that an adversary is relying on to stay invisible. Enrich
    knock sources with geo/ASN and, over a 30-day baseline, compute the rarity of each ASN/country pair,
    flagging the 99th percentile. Combine this with the failed/successful SPRT (Threshold Random Walk)
    verdict so that only genuine failure-dominated bursts from rare anonymizer ASNs escalate, suppressing
    benign traffic from common networks. This catches knockers using less-known VPN/hosting ASNs that
    may not yet be on an explicit anonymizer feed. Report the ASN, country, and observed rarity so the
    analyst can judge whether the origin is plausible for the targeted asset. Sources: [Fast Portscan
    Detection Using Sequential Hypothesis Testing](https://www.icir.org/vern/papers/portscan-oak04.pdf).
    [Method: Score rare ASN/country pairs (Statistical Method)]'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "rarity = pctl_30d(count_by(asn,country),99)\nfor k in knock_bursts:\n  if rarity(k.asn,k.country)>=p99\
      \ and trw(k.failed,k.success)=='malicious':\n    alert(k.src_ip, asn=k.asn, country=k.country)"
- question: When a Random Forest classifies suspected knock sources using CTI presence, ASN, reverse-DNS
