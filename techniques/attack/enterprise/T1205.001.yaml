name: 'T1205.001: Traffic Signaling: Port Knocking'
id: 527e59cd-8627-464e-be38-51bbaac62298
description: 'Investigate whether an adversary is using Port Knocking (T1205.001) traffic signaling to
  hide and activate ports for persistence or command and control across Windows, Linux, macOS, and network
  devices. This playbook helps an analyst detect the full knock chain: a short, ordered burst of failed
  connections to distinct closed ports (inbound or as an outbound ''reverse knock''), the dynamic firewall
  rule change or newly-listening port that follows on the targeted host, and the first successful connection
  or management session that the knock unlocks. It combines network evidence (Zeek conn.log and dns.log,
  NSM flow, network-device syslog) with endpoint evidence (Windows 4688/4946/4950/5154, Sysmon 1/3, auditd)
  and CTI enrichment (threat-intel, anonymizer, and C2 feeds). For each question it offers a deterministic
  symbolic-logic check, a statistical/baseline method, and a machine-learning approach so the analyst
  can confirm port-knocking used for Stealth, Command and Control, and Persistence, including knock-conditioned
  beaconing, long-lived interactive C2 sessions, and SYNful Knock-style network-device implants.'
type: technique
