name: 'T1590.004: Network Topology'
id: 7941270b-2f31-4547-acc5-41f830eda750
description: 'Investigate evidence that an external adversary is performing reconnaissance to map the
  organization''s network topology (MITRE ATT&CK T1590.004). This playbook helps a SOC analyst hunt for
  and triage active external scanning observed at the network perimeter: high-volume connection attempts
  from threat-intel-listed source IPs, traffic bearing recon-tool fingerprints (scanner User-Agents, illegal
  TCP flag combinations such as NULL/FIN/Xmas, and tool default port lists), horizontal host sweeps and
  vertical port scans against exposed ranges, low-and-slow probing of sensitive/management ports (22,
  3389, 5985, 161, 5900, 445), and sequential enumeration of live hosts across owned CIDR blocks. It combines
  deterministic symbolic-logic rules, statistical baselining (entropy, percentile, inter-arrival, and
  failure-ratio models), and machine-learning approaches (Random Forest/gradient boosting, DBSCAN/k-means
  clustering, seasonal time-series anomaly detection, and online autoencoders) so that both noisy commodity
  scanners and timing-evasive sophisticated actors can be surfaced and prioritized.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there external source IPs that appear on threat-intelligence feeds (scanner, mass-scanner,
    or TOR-exit categories) AND that initiate an unusually high volume of connections (more than ~100
    in a single hour) against our perimeter?
  context: During Reconnaissance an adversary often probes the perimeter from infrastructure already burned
    and cataloged on threat-intel feeds. By joining Zeek conn.log source IPs against intel.log hits and
    requiring a connection burst (>100/hour), you raise a deterministic, high-confidence flag while filtering
    background Internet radiation, which scans public ranges constantly. Maintain explicit allowlists
    for known partners and SaaS so legitimate high-volume integrations do not generate noise. A positive
    result means a reputationally bad host is actively engaging your network and warrants blocking and
    deeper review; a negative result does not clear the host, since intel coverage is incomplete.
  answer_sources:
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Perimeter firewalls, Internet gateways, Cloud provider network flow logs (e.g., AWS VPC Flow
    Logs), Threat Intelligence Platform integration points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Join conn.log against intel.log; alert on TI match + burst\nintel_ips = SELECT id_orig_h\
      \ FROM intel.log WHERE seen.indicator_type='Intel::ADDR'\n            AND meta.source IN ('scanner','mass-scanner','tor-exit')\n\
      conn_counts = SELECT id_orig_h, COUNT(*) AS c FROM conn.log\n              WHERE ts >= now-1h GROUP\
      \ BY id_orig_h\nALERT WHERE id_orig_h IN intel_ips AND c > 100\n  AND id_orig_h NOT IN partner_saas_allowlist"
- question: Which external source IPs exhibit a connection failure-state ratio (SYN-without-completion,
    RST, or ICMP-unreachable over total connections) above 0.9 within any 10-minute window, even when
    no threat-intel hit is present?
  context: 'Failure state is the single strongest deterministic discriminator of scanners: a host that
    is enumerating services produces mostly half-open or rejected connections rather than completed sessions.
    Computing the failed/total ratio per source over short windows catches recon that evades reputation-based
    detection (fresh or rented infrastructure). A ratio >0.9 over a meaningful number of attempts strongly
    indicates probing rather than legitimate use. Tune the minimum-attempt floor to avoid flagging tiny,
    transient failures, and exclude known health-check and monitoring sources.'
  answer_sources:
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Perimeter firewalls, Internet gateways, Cloud provider network flow logs (e.g., AWS VPC Flow
    Logs), Threat Intelligence Platform integration points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// conn.log state-based failure ratio per source over 10-min windows\nWINDOW 10m PER id_orig_h:\n\
      \  total = COUNT(*)\n  failed = COUNT(conn_state IN ('S0','REJ','RSTOS0','RSTR','SH') OR icmp_unreachable)\n\
      \  ALERT WHERE total >= 20 AND (failed/total) > 0.9"
- question: Which external source IPs show hourly connection counts that exceed three standard deviations
    above their own 30-day rolling mean (or the network-wide 99th percentile for first-seen IPs)?
  context: Statistical baselining catches volume anomalies that fixed thresholds miss and adapts to each
    source's normal behavior. Comparing the current hour's count to a 30-day rolling mean+3σ flags sudden
    bursts; for never-before-seen IPs (no history) fall back to the network-wide 99th percentile. Prioritize
    lower-confidence watchlist sources for triage. Derive thresholds from your own perimeter logs and
    validate against labeled benchmarks (e.g., CICIDS2017). A positive result is a statistically unusual
    surge worth correlating with failure-ratio and intel signals.
  answer_sources:
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Perimeter firewalls, Internet gateways, Cloud provider network flow logs (e.g., AWS VPC Flow
    Logs), Threat Intelligence Platform integration points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per-source hourly count vs rolling baseline\nbaseline = ROLLING(mean, stddev) OVER last\
      \ 30d PER src_ip BY hour\nFOR each src_ip, current_hour_count:\n  IF has_history: ALERT WHERE count\
      \ > baseline.mean + 3*baseline.stddev\n  ELSE: ALERT WHERE count > network_99th_percentile_hourly"
- question: When per-source features (reputation, ASN, country, distinct-host/port counts, byte/packet
    volume, failure ratio) are scored by a trained classifier, which external sources receive a high scanner
    probability, and which features drive that score?
  context: 'A supervised Random Forest or gradient-boosting model fuses many weak signals into a single
    scanner-probability score, capturing nonlinear combinations a single rule cannot. Train on labeled
    scan data and engineer features per source: reputation, ASN, geo, distinct destination hosts/ports,
    byte/packet volume, and failure ratio. Critically, the alert must list the top-3 contributing features
    (e.g., failure_ratio, distinct_dst_ports, conn_rate) from model feature-importance so analysts can
    validate the verdict. A high score with explainable drivers is strong, triage-ready evidence of reconnaissance.'
  answer_sources:
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Perimeter firewalls, Internet gateways, Cloud provider network flow logs (e.g., AWS VPC Flow
    Logs), Threat Intelligence Platform integration points.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Supervised scanner-probability scoring with explainability\nfeatures = [reputation, asn,\
      \ country, distinct_hosts, distinct_ports,\n            bytes, packets, failure_ratio, conn_rate]\
      \ PER src_ip\np = RandomForest.predict_proba(features)\nALERT WHERE p > 0.8 WITH top3 = feature_importance(features)"
- question: Is any external source generating HTTP/S traffic whose User-Agent matches known scanner strings
    (masscan, zgrab, Nmap NSE, Nuclei, sqlmap) or producing illegal TCP flag combinations (NULL, FIN,
    Xmas) or tool default port lists in weird.log?
  context: Many recon tools leave reliable fingerprints. Zeek http.log User-Agents frequently still carry
    tool identifiers, and weird.log records protocol violations such as NULL/FIN/Xmas flag combinations
    that no legitimate stack emits. Matching against a curated signature list provides high-precision
    detection of off-the-shelf scanning. A positive hit is near-certain malicious or unauthorized scanning;
    a negative does not clear sophisticated actors who randomize User-Agents or use well-formed packets,
    so pair this with statistical and ML checks.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: External-facing web servers, Application load balancers, DMZ, Web Application Firewalls (WAFs),
    Intrusion Detection/Prevention Systems (IDS/IPS).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Scanner UA and illegal-flag fingerprints\nALERT WHERE http.log user_agent MATCHES /(masscan|zgrab|nmap|nuclei|sqlmap)/i\n\
      \   OR weird.log name IN ('null_scan','fin_scan','xmas_scan','bad_TCP_checksum')\n   OR conn.log\
      \ dst_port IN tool_default_portlist"
- question: Does any single external source exceed a probe-rate ceiling (for example more than ~500 connections
    per minute, or full-CIDR coverage in under 60 seconds) consistent with stateless high-rate scanners?
  context: Stateless scanners like ZMap and masscan can sweep enormous address space in seconds, producing
    connection rates no human-driven or normal application client reaches. Setting a probe-rate ceiling
    tuned to your perimeter capacity gives a simple, robust trip-wire for high-rate scanning. Full-CIDR
    coverage in under a minute is an especially clear signal of automated enumeration. A breach of the
    ceiling warrants immediate blocking and correlation with the source's reputation and failure ratio.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: External-facing web servers, Application load balancers, DMZ, Web Application Firewalls (WAFs),
    Intrusion Detection/Prevention Systems (IDS/IPS).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Per-source rate ceiling and coverage speed\nWINDOW 1m PER id_orig_h:\n  ALERT WHERE COUNT(*)\
      \ > 500\n     OR distinct_dst_covering_full_cidr_within < 60s"
- question: Which external sources show high Shannon entropy in their destination-port or URI distribution
    (broad dispersion) while the source itself stays concentrated, computed over rolling 5-minute windows?
  context: 'Scanning has a characteristic information-theoretic signature: a single source touching many
    different ports or URIs spreads its destination distribution wide (high entropy) while the source
    distribution stays narrow. Tracking entropy as a time series over 5-minute windows exposes this dispersion
    even when raw volume is moderate. A sustained entropy spike on destination ports/URIs from one source
    indicates broad enumeration rather than normal, focused client behavior, and complements simple count
    thresholds.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: External-facing web servers, Application load balancers, DMZ, Web Application Firewalls (WAFs),
    Intrusion Detection/Prevention Systems (IDS/IPS).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Shannon entropy of dst_port/URI per source over 5-min windows\nWINDOW 5m PER src_ip:\n\
      \  H_port = shannon_entropy(dst_port_distribution)\n  H_uri  = shannon_entropy(uri_distribution)\n\
      \  ALERT WHERE H_port > port_entropy_threshold OR H_uri > uri_entropy_threshold"
- question: Which external sources sit in the upper tail of the per-source HTTP error rate (404/400/403)
    or TCP RST rate distribution (for example >90% errors), independent of their raw request volume?
  context: 'Tools enumerating paths and services generate disproportionate error responses because most
    guessed URIs and probed ports do not exist. Modeling per-source error rate as its own distribution
    separates this signal from request volume: a low-volume but high-error source is still probing. Sources
    in the upper tail (>90% 404/400/403 or high RST rate) are likely enumerating. This is a distinct,
    additive signal best correlated with entropy and UA fingerprints for confident triage.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: External-facing web servers, Application load balancers, DMZ, Web Application Firewalls (WAFs),
    Intrusion Detection/Prevention Systems (IDS/IPS).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per-source HTTP error-rate and RST-rate distribution\nPER src_ip OVER window:\n  err_rate\
      \ = COUNT(status IN (400,403,404)) / COUNT(*)\n  rst_rate = COUNT(conn_state IN ('RSTR','RSTO'))\
      \ / total_conns\n  ALERT WHERE err_rate > 0.9 OR rst_rate > upper_tail_threshold"
- question: When per-source streaming statistics (request rate, byte ratio, jitter) are fed to an online
    autoencoder ensemble, which sources produce reconstruction-error spikes indicating novel scanner tooling,
    and which features drive the error?
  context: Signature and threshold rules miss unknown or custom tooling. An online autoencoder ensemble
    such as KitNET learns the normal manifold of per-source streaming behavior and flags inputs it cannot
    reconstruct well. A reconstruction-error spike marks a source whose behavior departs from learned
    norms — exactly what novel scanners do — without needing labels or signatures. Surface the top-3 highest-error
    features in the alert so analysts can interpret why the source is anomalous and decide whether it
    is reconnaissance.
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek weird.log
  - 'NAI: External-facing web servers, Application load balancers, DMZ, Web Application Firewalls (WAFs),
    Intrusion Detection/Prevention Systems (IDS/IPS).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Online autoencoder (KitNET) over streaming per-source stats\nstream_features = [req_rate,\
      \ byte_ratio, jitter, ...] PER src_ip\nerr = KitNET.score(stream_features)\nALERT WHERE err > dynamic_error_threshold\n\
      \  WITH top3 = features_by_reconstruction_error(stream_features)"
- question: Is any external source contacting more than ~100 distinct destination hosts (horizontal scan)
    or more than ~50 distinct ports on a single host (vertical scan) within one minute?
  context: 'Horizontal and vertical scans are the core mechanics of topology mapping: horizontal scans
    find live hosts across a range, vertical scans enumerate services on a host. Simple distinct-count
    thresholds over a 1-minute window deterministically catch both. Adjust the counts to your environment
    size and exposed surface, and exempt authorized vulnerability scanners via allowlist to avoid recurring
    false positives. A breach is a clear scanning indicator that should be correlated with the source''s
    reputation and failure ratio.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ subnets, Public IP address ranges, Edge routers, Cloud security groups and network ACLs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Distinct host / port thresholds per source per minute\nWINDOW 1m PER id_orig_h:\n  ALERT\
      \ WHERE COUNT(DISTINCT id_resp_h) > 100   // horizontal\n     OR MAX_PER_HOST(COUNT(DISTINCT id_resp_p))\
      \ > 50  // vertical\n  AND id_orig_h NOT IN authorized_scanner_allowlist"
- question: When a Threshold Random Walk is applied per source over its connection success/failure outcomes,
    which sources cross the 'scanner' decision bound (typically after ~4-5 failed attempts)?
  context: Threshold Random Walk (TRW) is a sequential hypothesis test that accumulates a likelihood ratio
    from each connection's success or failure, declaring a source a scanner once an upper bound is crossed
    — usually within a handful of failed attempts. This gives very fast detection with mathematically
    bounded false-positive and false-negative rates, far quicker than waiting for volume thresholds. It
    is ideal for catching scans early. A source that crosses the bound is statistically confirmed as probing
    and should be acted on promptly.
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ subnets, Public IP address ranges, Edge routers, Cloud security groups and network ACLs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Threshold Random Walk per source\nPER src_ip, FOR each new connection outcome:\n  IF success:\
      \ L *= theta1/theta0   ELSE: L *= (1-theta1)/(1-theta0)\n  IF L >= upper_bound: DECLARE scanner\n\
      \  IF L <= lower_bound: DECLARE benign; reset"
- question: Which external sources exceed the rolling 99th percentile of distinct destination hosts or
    ports observed in 5-minute windows, baselined against the constant scan background?
  context: Rather than a fixed count, this method derives the alerting boundary from your own conn.log
    history so it adapts to the ambient scan background that always touches public ranges. Sources exceeding
    the rolling 99th percentile of distinct hosts/ports in a 5-minute window are genuine outliers above
    the noise floor. This reduces false positives versus a static threshold while still catching aggressive
    enumeration. Recompute percentiles regularly so the baseline tracks seasonal and growth changes in
    your environment.
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ subnets, Public IP address ranges, Edge routers, Cloud security groups and network ACLs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Rolling 99th-percentile distinct host/port counts\np99_hosts = PERCENTILE(distinct_dst_hosts_5m,\
      \ 99) OVER trailing_history\np99_ports = PERCENTILE(distinct_dst_ports_5m, 99) OVER trailing_history\n\
      WINDOW 5m PER src_ip:\n  ALERT WHERE distinct_dst_hosts > p99_hosts OR distinct_dst_ports > p99_ports"
- question: When per-IP feature vectors (distinct hosts, distinct ports, flow duration, failure ratio,
    total bytes) are clustered, which sources fall into low-density/outlier clusters indicative of scanning
    cohorts?
  context: Unsupervised clustering (DBSCAN or k-means) groups sources by behavior without labels, isolating
    scanning cohorts as low-density or outlier clusters distinct from the dense mass of normal clients.
    Feature vectors per IP — distinct hosts, distinct ports, flow duration, failure ratio, total bytes
    — let the algorithm separate enumeration patterns automatically, even discovering coordinated scanning
    groups. Report the defining features of any flagged cluster so analysts understand the behavior and
    can confirm reconnaissance during triage.
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ subnets, Public IP address ranges, Edge routers, Cloud security groups and network ACLs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// DBSCAN clustering of per-IP behavior\nX = [distinct_hosts, distinct_ports, flow_duration,\
      \ failure_ratio, total_bytes] PER src_ip\nlabels = DBSCAN(eps, min_samples).fit(X)\nALERT sources\
      \ WHERE label == -1 (noise) OR in low-density cluster\n  WITH defining_features = cluster_centroid_deltas"
- question: When bidirectional flows are classified by a model trained on CICFlowMeter features (distinct
    ports/hosts, fwd/bwd packet & byte counts, flag counts, inter-arrival times), which flows are labeled
    as scanning, and what features drive each verdict?
  context: A supervised Random Forest trained on rich bidirectional flow features (as in CICIDS2017) can
    distinguish scan flows from benign traffic with high accuracy. CICFlowMeter-style features — distinct
    ports/hosts, forward/backward packet and byte counts, TCP flag counts, and inter-arrival statistics
    — capture the shape of scanning. Output the top-3 feature-importance contributors per alert so the
    analyst can validate the classification. This complements the deterministic and statistical methods
    by catching subtler patterns those rules miss.
  answer_sources:
  - Zeek conn.log
  - 'NAI: DMZ subnets, Public IP address ranges, Edge routers, Cloud security groups and network ACLs.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Supervised flow classification (Random Forest on CICFlowMeter features)\nf = cicflowmeter_features(bidirectional_flow)\n\
      label, p = RandomForest.predict(f)\nALERT WHERE label == 'scan' AND p > 0.8\n  WITH top3 = feature_importance(f)"
- question: Are external IPs not on the partner allowlist attempting connections to high-sensitivity/management
    ports (22, 3389, 5985, 161, 5900, 445), regardless of how slow or infrequent the attempts are?
  context: Low-and-slow recon deliberately stays under rate-based thresholds, so the most reliable trip-wire
    for sensitive ports is presence, not rate. Management and remote-access ports (SSH 22, RDP 3389, WinRM
    5985, SNMP 161, VNC 5900, SMB 445) are prime topology and recon targets and common tool defaults.
    Alerting on any external, non-allowlisted attempt to these ports — even a single, long-interval probe
    — surfaces patient adversaries that volume rules ignore. Keep the partner allowlist current so legitimate
    remote administration is not flagged.
  answer_sources:
  - Zeek conn.log
  - 'NAI: VPN concentrators, Remote access gateways, Servers hosting sensitive applications, Management
    interfaces of network appliances, Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Watchlist sensitive/management ports from non-allowlisted externals\nALERT WHERE conn.log\
      \ id_resp_p IN (22,3389,5985,161,5900,445)\n  AND is_external(id_orig_h)\n  AND id_orig_h NOT IN\
      \ partner_allowlist"
- question: Which external sources show high mean and variance of connection inter-arrival times combined
    with low total connection count and high failure ratio over a multi-hour window?
  context: 'Timing-evasive scanners space their probes out to defeat fixed-rate rules, producing a distinctive
    statistical signature: long, irregular gaps between connections (high mean and variance of inter-arrival
    time), few total connections, yet a high failure ratio because most probes hit nothing useful. Modeling
    these jointly over a multi-hour window catches slow scans that per-minute thresholds never trip. A
    source matching this profile is likely conducting deliberate, stealthy reconnaissance and merits enrichment
    and watchlisting.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: VPN concentrators, Remote access gateways, Servers hosting sensitive applications, Management
    interfaces of network appliances, Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Long/irregular inter-arrival with low count, high failure\nWINDOW 6h PER src_ip:\n  iat_mean,\
      \ iat_var = stats(inter_arrival_times)\n  ALERT WHERE iat_mean > T_mean AND iat_var > T_var\n  \
      \   AND total_conns < N_low AND failure_ratio > 0.7"
- question: Is the Shannon entropy of the set of unique source IPs targeting any given sensitive port
    rising over rolling windows, indicating a growing number of distinct sources probing one management
    port?
  context: 'Distributed slow reconnaissance spreads probes across many source IPs so no single source
    trips a threshold. Tracking the entropy of the unique-source set per sensitive port reveals this:
    a subtle rise in distinct sources probing one management port increases source-set entropy even when
    each source is quiet. This per-port view catches coordinated or botnet-driven recon that per-source
    analysis misses. A sustained entropy rise on a critical port warrants correlating the contributing
    sources for shared infrastructure or intent.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: VPN concentrators, Remote access gateways, Servers hosting sensitive applications, Management
    interfaces of network appliances, Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Entropy of unique-source set per sensitive port\nFOR port IN (22,3389,5985,161,5900,445):\n\
      \  WINDOW rolling:\n    H = shannon_entropy(unique_src_ips_targeting(port))\n    ALERT WHERE H rising_above\
      \ baseline_for(port)"
- question: When hourly unique-source counts per sensitive port are modeled as a seasonal time series,
    which ports show residual outliers beyond expected daily/weekly patterns?
  context: Probing of sensitive ports has natural daily and weekly rhythms; a robust seasonal model (e.g.,
    Seasonal-Hybrid ESD) learns these patterns and flags only residual outliers — observations far above
    the expected seasonal value. This catches anomalous surges in distinct sources hitting a management
    port that a flat threshold would miss or that would be lost in normal variation. The alert should
    report the port, observed-vs-expected counts, and the contributing time window so analysts can quickly
    assess whether it represents coordinated recon.
  answer_sources:
  - Zeek conn.log
  - 'NAI: VPN concentrators, Remote access gateways, Servers hosting sensitive applications, Management
    interfaces of network appliances, Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Seasonal-Hybrid ESD on hourly unique-source counts per port\nFOR port IN sensitive_ports:\n\
      \  series = hourly_unique_source_count(port)\n  anomalies = SeasonalHybridESD(series)\n  ALERT anomalies\
      \ WITH (port, observed, expected, window)"
- question: When previously-unseen external sources are scored by an online autoencoder over streaming
    per-source statistics, which ones show sustained moderate reconstruction error consistent with persistent
    low-rate probing?
  context: Patient probers do not produce spikes; they produce a low, steady departure from normal that
    burst-detection misses. An online autoencoder (KitNET) over streaming per-source stats flags rare/never-seen
    sources whose behavior yields sustained moderate reconstruction error rather than a sharp peak. This
    is well suited to catching low-and-slow recon from fresh infrastructure. Include the top-error features
    in the alert so analysts can see which behaviors are anomalous and judge whether the source is conducting
    stealthy reconnaissance.
  answer_sources:
  - Zeek conn.log
  - 'NAI: VPN concentrators, Remote access gateways, Servers hosting sensitive applications, Management
    interfaces of network appliances, Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Online autoencoder novelty scoring for rare sources\nFOR src_ip IN first_seen_or_rare:\n\
      \  err_series = KitNET.score_stream(per_source_stats)\n  ALERT WHERE sustained(err_series, level=moderate,\
      \ duration=long)\n    WITH top3 = features_by_reconstruction_error()"
- question: Is any external source contacting more than ~10 sequential/contiguous destination IPs within
    our owned CIDR blocks in one minute (a ping sweep or SYN sweep), correlating conn.log, icmp.log, and
    weird.log?
  context: Live-host enumeration often walks an address range sequentially (x.x.x.1, .2, .3 ...). Detecting
    contiguous-IP runs from a single source within your owned CIDR blocks deterministically catches ping
    and SYN sweeps. Correlating conn.log with icmp.log (echo/unreachable) and weird.log strengthens confidence
    by capturing the responses that reveal which hosts are live. Tune the run-length to subnet size. A
    source walking contiguous addresses is mapping your topology and should be blocked and investigated
    for follow-on activity.
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Zeek weird.log
  - 'NAI: Organization''s allocated CIDR blocks, Edge router logs, Network Address Translation (NAT) logs.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Sequential/contiguous destination IP sweep across owned CIDRs\nWINDOW 1m PER id_orig_h\
      \ WHERE id_resp_h IN owned_cidrs:\n  run = longest_contiguous_run(sorted(distinct id_resp_h))\n\
      \  ALERT WHERE run > 10\n  ENRICH WITH icmp.log (echo/unreachable), weird.log"
- question: When a Threshold Random Walk is applied across the destinations a source sweeps, does a run
    of failed or ICMP-unreachable responses to contiguous IPs cross the scanner decision bound within
    a few hosts?
  context: Sweeps across mostly-empty address space produce a rapid run of failed/ICMP-unreachable responses.
    Applying TRW to these outcomes confirms a scanner within just a few contiguous hosts, providing fast
    deterministic confirmation with bounded error rates — much sooner than count thresholds. This is especially
    effective against sparse internal ranges where most addresses are unused. A source crossing the bound
    is statistically confirmed as enumerating live hosts and should be actioned immediately.
  answer_sources:
  - Zeek conn.log
  - Zeek icmp.log
  - Zeek weird.log
  - 'NAI: Organization''s allocated CIDR blocks, Edge router logs, Network Address Translation (NAT) logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// TRW over sweep destination success/failure\nPER src_ip walking owned_cidrs:\n  FOR each\
      \ dst outcome (alive/unreachable):\n    update likelihood ratio L\n    IF L >= upper_bound: DECLARE\
      \ sweeper"
- question: Which external sources show a connection failure ratio (RST/ICMP-unreachable/timeout over
    total) above 0.9 over 10 minutes against our owned ranges?
  context: Live-host enumeration against owned ranges yields overwhelmingly failed connections because
