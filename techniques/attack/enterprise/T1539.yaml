    services as an authenticated principal -- frequently sidestepping multi-factor authentication -- leaving
    traces across process-execution, file-access, process-memory, network, and identity-provider telemetry.
    This evidence focuses on the condition that a previously stolen session cookie or authentication token
    is replayed to a web application or SaaS/IdP from an unusual source IP, geolocation, device, or user
    agent, without a corresponding interactive authentication or MFA event, indicating use of a hijacked
    session. This Machine Learning approach works as follows: Build an authentication/login graph and
    score residual logins (after pruning benign causal paths) with the anomaly model of [Hopper](https://www.usenix.org/conference/usenixsecurity21/presentation/ho),
    or score per-session feature vectors (IP rarity, device rarity, geo distance, time-of-day, MFA-state)
    with an [Isolation Forest](https://ieeexplore.ieee.org/document/4781136). Surface the top-3 contributing
    features in the alert per [SHAP Integration in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable theft,
    scraping, or replay of session cookies/tokens; pivot to the responsible process and its parent lineage,
    the user and device context, the targeted browser cookie store or memory region, the destination/relay
    infrastructure, and any subsequent authenticated session reuse. A negative result helps rule out this
    particular cookie-theft vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, living-off-the-land, or AiTM-proxied activity.'
