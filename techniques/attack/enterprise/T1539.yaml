name: 'T1539: Steal Web Session Cookie'
id: 4cfbc706-2514-4b46-a015-3d589816210f
description: 'This playbook helps an analyst investigate whether an adversary has stolen web application
  or service session cookies (and authentication tokens) to impersonate a legitimate user and access web
  apps, SaaS, and cloud services without credentials -- often bypassing MFA -- as part of the Credential
  Access tactic. Session cookies live on disk (browser SQLite cookie stores such as Chromium Network\Cookies,
  Firefox cookies.sqlite, plus Login Data/Local State for the DPAPI key), in browser process memory, and
  in TLS-protected network traffic, so the hunt spans Windows, Linux, macOS, Office Suite, and SaaS telemetry.
  It guides the analyst across several behavioral angles: execution of known cookie-stealing tooling matched
  by hash and connections to Adversary-in-the-Middle (AiTM) reverse-proxy phishing infrastructure (Evilginx2/Muraena);
  command lines and PowerShell script-blocks referencing cookie-theft strings and browser-profile paths;
  unauthorized file reads of browser cookie databases (via SACL-audited 4663/4656); high-privilege handle
  grabs (PROCESS_VM_READ) into browser processes indicating memory scraping and injection; TLS/HTTP network
  anomalies such as unexpected certificate issuers, rare JA3/JA3S fingerprints, and oversized cookie headers
  signaling AiTM relays; browsers spawning anomalous child shells/script hosts; and replay of stolen tokens
  to SaaS/IdP (Okta, Google Workspace, Azure AD) from new IPs, devices, or user agents without reauthentication
  or MFA. Detection methods combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning
  models applied to Windows Security/Sysmon events, PowerShell script-block logs, auditd, macOS unified
  logs, Zeek conn/http/ssl/dns/files logs, and SaaS/IdP audit logs, so the analyst can corroborate suspected
  cookie theft against process lineage, file and memory access, network fingerprints, and downstream session
  reuse.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
