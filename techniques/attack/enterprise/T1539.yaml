questions:
- question: '[Credential Access] Match known cookie-stealer hashes and AiTM infrastructure: Can you determine
    whether an executable file with a hash matching a known cookie-stealing tool is observed on an endpoint,
    or a network connection is established to a domain or IP address associated with Adversary-in-the-Middle
    (AitM) phishing infrastructure. -- specifically, using the ''Match known cookie-stealer hashes and
    AiTM infrastructure'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary steals web session
    cookies or authentication tokens to impersonate a user and access web applications and SaaS/cloud
    services as an authenticated principal -- frequently sidestepping multi-factor authentication -- leaving
    traces across process-execution, file-access, process-memory, network, and identity-provider telemetry.
    This evidence focuses on the condition that an executable file with a hash matching a known cookie-stealing
    tool is observed on an endpoint, or a network connection is established to a domain or IP address
    associated with Adversary-in-the-Middle (AitM) phishing infrastructure. This Symbolic Logic approach
    works as follows: Compare file hashes from Windows Event ID 4688 and Zeek files.log against threat
    intelligence for known cookie-stealing malware and known AitM infrastructure. Correlate destination
    IPs and server names from Zeek conn.log, http.log, and dns.log with malicious-proxy feeds and with
    reverse-proxy AiTM relay signatures (added round-trip latency, TLS certificate/cipher discrepancies,
    and request-header ordering) described in [Catching Transparent Phish](https://catching-transparent-phish.github.io/);
    alert on any hash or destination match. Treat repeated MFA prompts or SMS/OTP fallback to the same
    IdP session as a corroborating AiTM signal per [Implementing Phishing-Resistant MFA](https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable theft,
    scraping, or replay of session cookies/tokens; pivot to the responsible process and its parent lineage,
    the user and device context, the targeted browser cookie store or memory region, the destination/relay
    infrastructure, and any subsequent authenticated session reuse. A negative result helps rule out this
    particular cookie-theft vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, living-off-the-land, or AiTM-proxied activity.'
