- question: '[Discovery] Scripted UA detection: Can you determine whether a user session interacting with
    a container management web UI (e.g., Kubernetes Dashboard) shows behavior consistent with automated
    scanning, defined by an unusually high request rate or a User-Agent string associated with scripting
    tools. -- specifically, using the ''Scripted UA detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that a user session interacting with a container management web UI (e.g., Kubernetes
    Dashboard) shows behavior consistent with automated scanning, defined by an unusually high request
    rate or a User-Agent string associated with scripting tools. This Symbolic Logic approach works as
    follows: Alert on Zeek http.log sessions to container UIs (Dashboard, Rancher, OpenShift) whose `user_agent`
    matches scripting libraries or enumeration tools and originate from non-approved automation hosts;
    Dashboard/exposed-interface scraping is an explicit discovery vector in the [Threat Matrix for Kubernetes](https://microsoft.github.io/Threat-Matrix-for-Kubernetes/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable container/resource
    reconnaissance; pivot to the responsible source IP, account, service account, and process lineage,
    the targeted API verbs and resource types, the network segment of origin, and any sensitive resources
    read, to scope the adversary''s knowledge of the environment. A negative result helps reduce suspicion
    of this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Web servers hosting container management UIs (Kubernetes Dashboard, Rancher, OpenShift) — an
    ''exposed sensitive interface'' per the Kubernetes threat matrix.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for h in http.log where host in [k8s_dashboard,rancher,openshift]:\n  if h.user_agent matches\
      \ /(python-requests|curl|wget|go-http|scanner)/\n     and h.id_orig_h not in approved_automation:\n\
      \    alert('scripted UA on container UI', h.id_orig_h, h.user_agent, h.host)"
- question: '[Discovery] Session URI ratio anomaly: Can you determine whether a user session interacting
