- question: '[Discovery] Replica/peer divergence anomaly: Can you determine whether a single source IP
    makes API calls to list or get three or more distinct resource types (e.g., pods, secrets, deployments,
    nodes) within a 5-minute window, indicating broad reconnaissance. -- specifically, using the ''Replica/peer
    divergence anomaly'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that a single source IP makes API calls to list or get three or more distinct resource
    types (e.g., pods, secrets, deployments, nodes) within a 5-minute window, indicating broad reconnaissance.
    This Machine Learning approach works as follows: For homogeneous pods, compare live kernel-event/API-access
    distributions across identical replicas with [ReplicaWatcher](https://www.ndss-symposium.org/wp-content/uploads/2024-286-paper.pdf);
    flag the replica whose enumeration-breadth distribution diverges from its peers without per-app training,
    reporting the divergent resource types. Alternatively build a bipartite source-to-resource graph and
    flag weakly connected discovery nodes. A positive result -- a rule match, statistical outlier, or
    model alert -- indicates probable container/resource reconnaissance; pivot to the responsible source
    IP, account, service account, and process lineage, the targeted API verbs and resource types, the
    network segment of origin, and any sensitive resources read, to scope the adversary''s knowledge of
    the environment. A negative result helps reduce suspicion of this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land enumeration.'
  answer_sources:
  - Kubernetes API server audit log
  - Zeek http.log
  - 'NAI: Kubernetes API server, container nodes (for pod-to-API traffic).'
  range: Last 90 days (training baseline); score current events
  queries:
  - technology: SIEM/ML pseudocode
    query: "for replica_set in homogeneous_pods:\n  dist = api_access_distribution(each replica)\n  outlier\
      \ = ReplicaWatcher.diverging(dist)\n  if outlier: alert('replica divergence', outlier.pod, outlier.resource_types)"
- question: '[Discovery] Sensitive endpoint allowlist: Can you determine whether a single API response
    for a sensitive resource (e.g., secrets, configmaps, pod logs) has an anomalously large size, or a
    client accesses these resources using a User-Agent not associated with approved administrative tools.
    -- specifically, using the ''Sensitive endpoint allowlist'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that a single API response for a sensitive resource (e.g., secrets, configmaps, pod
    logs) has an anomalously large size, or a client accesses these resources using a User-Agent not associated
    with approved administrative tools. This Symbolic Logic approach works as follows: Alert when the
    audit log or Zeek http.log shows `get`/`list` on secrets, configmaps, or `/logs` from a source/account
    outside the admin allowlist; enforce least-privilege reads on these resources per [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf)
    and audit/deny with [Kyverno](https://kyverno.io/policies/other/audit-event-on-exec/audit-event-on-exec/).
    Falco''s service-account-token read rule provides the in-container corollary ([Falco rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable container/resource
    reconnaissance; pivot to the responsible source IP, account, service account, and process lineage,
    the targeted API verbs and resource types, the network segment of origin, and any sensitive resources
    read, to scope the adversary''s knowledge of the environment. A negative result helps reduce suspicion
    of this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Kubernetes API server audit log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Kubernetes API server (endpoints for secrets, configmaps, and pod logs).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from (k8s_audit OR zeek_http) where verb in [get,list]\n  and objectRef.resource in [secrets,configmaps]\
      \ or uri matches /\\/logs/\n  and source not in admin_allowlist\n| alert('sensitive endpoint access\
      \ out-of-allowlist', source, objectRef.resource)"
  - technology: Falco/pseudocode
    query: "rule: read serviceaccount token in container\n  condition: open_read and fd.name startswith\
      \ /var/run/secrets/kubernetes.io\n  output: container=%container.name proc=%proc.cmdline"
