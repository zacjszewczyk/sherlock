questions:
- question: '[Discovery] Threat-intel container API match: Can you determine whether an API call targeting
    a container platform endpoint (e.g., Kubernetes API, Docker API) originates from a source IP address
    listed on a current threat intelligence feed of known malicious hosts. -- specifically, using the
    ''Threat-intel container API match'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that an API call targeting a container platform endpoint (e.g., Kubernetes API, Docker
    API) originates from a source IP address listed on a current threat intelligence feed of known malicious
    hosts. This Symbolic Logic approach works as follows: In Zeek conn.log/http.log and the Kubernetes
    API-server audit log, correlate each container-API connection with current threat intelligence. Alert
    when `id.orig_h`/`sourceIPs` matches a malicious IP and the destination is a known container API/kubelet
    port (6443, 443, 2375, 2376, 10250), surfacing the feed entry, API verb, and target resource for triage.
    Restrict legitimate API access to dedicated management segments per [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf);
    the canonical discovery destinations (API server, kubelet, instance-metadata) are scoped by the [Threat
    Matrix for Kubernetes](https://microsoft.github.io/Threat-Matrix-for-Kubernetes/). A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable container/resource reconnaissance;
    pivot to the responsible source IP, account, service account, and process lineage, the targeted API
    verbs and resource types, the network segment of origin, and any sensitive resources read, to scope
    the adversary''s knowledge of the environment. A negative result helps reduce suspicion of this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Kubernetes API server audit log
  - 'NAI: Kubernetes API server (6443/443), Docker daemon (2375/2376), kubelet (10250), internet gateway,
    reverse proxies, cloud provider control plane endpoints.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ti = load_threatintel(malicious_ips)\nfor c in conn.log + http.log:\n  if c.id_resp_p in [6443,443,2375,2376,10250]\
      \ and c.id_orig_h in ti:\n    alert('TI container-API hit', src=c.id_orig_h, dst_port=c.id_resp_p,\
      \ feed=ti[c.id_orig_h])"
  - technology: SIEM/Rule pseudocode
    query: 'from k8s_audit where sourceIPs[*] in threatintel_malicious

      | eval target=objectRef.resource, verb=verb

      | alert severity=high fields(sourceIPs, verb, target, feed_entry)'
- question: '[Discovery] New-source rate anomaly: Can you determine whether an API call targeting a container
    platform endpoint (e.g., Kubernetes API, Docker API) originates from a source IP address listed on
    a current threat intelligence feed of known malicious hosts. -- specifically, using the ''New-source
    rate anomaly'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that an API call targeting a container platform endpoint (e.g., Kubernetes API, Docker
    API) originates from a source IP address listed on a current threat intelligence feed of known malicious
    hosts. This Statistical Method approach works as follows: Compute the hourly count of newly seen source
    IPs accessing container API ports and maintain a 30-day baseline using the dynamic per-source baselining
    method of [Lin et al.](https://doi.org/10.1109/CLOUD53861.2021.00063). Fire when the current hour
    exceeds the 95th percentile of its baseline, signaling possible reconnaissance scanning; derive site-specific
    percentiles from your own audit-log history. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable container/resource reconnaissance; pivot to the responsible source
    IP, account, service account, and process lineage, the targeted API verbs and resource types, the
    network segment of origin, and any sensitive resources read, to scope the adversary''s knowledge of
    the environment. A negative result helps reduce suspicion of this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Kubernetes API server audit log
  - 'NAI: Kubernetes API server (6443/443), Docker daemon (2375/2376), kubelet (10250), internet gateway,
    reverse proxies, cloud provider control plane endpoints.'
  range: Last 90 days (baseline); evaluate over the method's stated short windows for the current period
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = pct95(hourly_count_of_new_src_ips_on_container_ports, last_30d)

      cur = count(distinct first_seen_src_ip this_hour where dst_port in [6443,443,2375,2376,10250])

      if cur > baseline: alert(''new-source rate anomaly'', cur, baseline)'
- question: '[Discovery] API session risk classifier: Can you determine whether an API call targeting
    a container platform endpoint (e.g., Kubernetes API, Docker API) originates from a source IP address
    listed on a current threat intelligence feed of known malicious hosts. -- specifically, using the
    ''API session risk classifier'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that an API call targeting a container platform endpoint (e.g., Kubernetes API, Docker
    API) originates from a source IP address listed on a current threat intelligence feed of known malicious
    hosts. This Machine Learning approach works as follows: Score each API connection with a model (e.g.,
    Random Forest) trained on features such as source-IP reputation, ASN, country, time-of-day, API verb,
    target resource, and a new-IP indicator; label training data from the [ITU Kubernetes misuse dataset](https://www.itu.int/dms_pub/itu-s/opb/jnl/S-JNL-VOL4.ISSUE2-2023-A26-PDF-E.pdf).
    Raise alerts when predicted maliciousness crosses a tuned threshold and include the top-3 contributing
    features (e.g., via SHAP, per the [AI-Driven Container Security survey](https://arxiv.org/pdf/2302.13865))
    in the alert text. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable container/resource reconnaissance; pivot to the responsible source IP, account, service account,
    and process lineage, the targeted API verbs and resource types, the network segment of origin, and
    any sensitive resources read, to scope the adversary''s knowledge of the environment. A negative result
    helps reduce suspicion of this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Kubernetes API server audit log
  - 'NAI: Kubernetes API server (6443/443), Docker daemon (2375/2376), kubelet (10250), internet gateway,
    reverse proxies, cloud provider control plane endpoints.'
  range: Last 90 days (training baseline); score current events
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [src_reputation, asn, country, hour, api_verb, target_resource, is_new_ip]\nscore\
      \ = rf_model.predict_proba(features)\nif score > tuned_threshold:\n  alert('risky API session',\
      \ score, top3=shap(features))"
- question: '[Discovery] Discovery CLI rule: Can you determine whether the execution of a container-native
    command-line tool (`kubectl.exe`, `docker.exe`) includes discovery-oriented subcommands (e.g., `get`,
    `describe`, `ps`, `images`) and is initiated by a non-interactive parent process (e.g., not `explorer.exe`
    or `cmd.exe`), an unauthorized user, or on a non-administrative host. -- specifically, using the ''Discovery
    CLI rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that the execution of a container-native command-line tool (`kubectl.exe`, `docker.exe`)
    includes discovery-oriented subcommands (e.g., `get`, `describe`, `ps`, `images`) and is initiated
    by a non-interactive parent process (e.g., not `explorer.exe` or `cmd.exe`), an unauthorized user,
    or on a non-administrative host. This Symbolic Logic approach works as follows: Monitor process creation
    (Windows EID 4688, Linux execve/auditd) for `kubectl`/`docker`/`crictl`/`oc` with discovery subcommands
    (`get`, `describe`, `ps`, `images`, `get nodes`, `get secrets`) whose parent is not an interactive
    shell. Pair with [Falco](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml)
    rules for in-container discovery — contact to the K8s API server or cloud instance-metadata service
    from a container and service-account token reads (`/var/run/secrets/kubernetes.io/...`). Raise alerts
    on matches, excluding allowlisted automation accounts. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable container/resource reconnaissance; pivot to the responsible
    source IP, account, service account, and process lineage, the targeted API verbs and resource types,
    the network segment of origin, and any sensitive resources read, to scope the adversary''s knowledge
    of the environment. A negative result helps reduce suspicion of this particular vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd/execve
  - Falco syscall alerts
  - 'NAI: Administrative workstations, jump servers, CI/CD runners, container nodes, in-cluster pods.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "from proc_create (EID4688 OR auditd_execve)\nwhere image in [kubectl,docker,crictl,oc]\n \
      \ and cmdline matches /(get|describe|ps|images|get nodes|get secrets)/\n  and parent not in [explorer.exe,cmd.exe,bash,zsh]\n\
      \  and user not in allowlist_automation\n| alert('discovery CLI', user, host, parent, cmdline)"
  - technology: Falco/pseudocode
    query: "rule: in-container discovery\n  condition: container and (outbound to k8s_api or cloud_metadata\n\
      \    or open_read /var/run/secrets/kubernetes.io/serviceaccount/token)\n  output: container=%container.name\
      \ user=%user.name proc=%proc.cmdline"
- question: '[Discovery] Command syscall-frequency spike: Can you determine whether the execution of a
    container-native command-line tool (`kubectl.exe`, `docker.exe`) includes discovery-oriented subcommands
    (e.g., `get`, `describe`, `ps`, `images`) and is initiated by a non-interactive parent process (e.g.,
    not `explorer.exe` or `cmd.exe`), an unauthorized user, or on a non-administrative host. -- specifically,
    using the ''Command syscall-frequency spike'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that the execution of a container-native command-line tool (`kubectl.exe`, `docker.exe`)
    includes discovery-oriented subcommands (e.g., `get`, `describe`, `ps`, `images`) and is initiated
    by a non-interactive parent process (e.g., not `explorer.exe` or `cmd.exe`), an unauthorized user,
    or on a non-administrative host. This Statistical Method approach works as follows: Per workload,
    model syscall frequency vectors over sliding windows using [Bag of System Calls](https://arxiv.org/abs/1611.03053);
    a discovery payload spawning recon tooling shifts the distribution. Alert when the window''s divergence
    from the learned benign profile exceeds three standard deviations above the historical mean. Also
    track a 5-minute sliding window of command-line argument entropy per user/host for scripted enumeration.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable container/resource
    reconnaissance; pivot to the responsible source IP, account, service account, and process lineage,
    the targeted API verbs and resource types, the network segment of origin, and any sensitive resources
    read, to scope the adversary''s knowledge of the environment. A negative result helps reduce suspicion
    of this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd/execve
  - Falco syscall alerts
  - 'NAI: Administrative workstations, jump servers, CI/CD runners, container nodes, in-cluster pods.'
  range: Last 90 days (baseline); evaluate over the method's stated short windows for the current period
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per workload: vec = bag_of_syscalls(sliding_window)

      div = divergence(vec, benign_profile)

      if div > mean + 3*std: alert(''syscall-frequency spike'', workload, div)

      also: track 5min entropy(cmdline_args) per user/host for scripted enum'
- question: '[Discovery] Discovery clustering anomaly: Can you determine whether the execution of a container-native
    command-line tool (`kubectl.exe`, `docker.exe`) includes discovery-oriented subcommands (e.g., `get`,
    `describe`, `ps`, `images`) and is initiated by a non-interactive parent process (e.g., not `explorer.exe`
    or `cmd.exe`), an unauthorized user, or on a non-administrative host. -- specifically, using the ''Discovery
    clustering anomaly'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that the execution of a container-native command-line tool (`kubectl.exe`, `docker.exe`)
    includes discovery-oriented subcommands (e.g., `get`, `describe`, `ps`, `images`) and is initiated
    by a non-interactive parent process (e.g., not `explorer.exe` or `cmd.exe`), an unauthorized user,
    or on a non-administrative host. This Machine Learning approach works as follows: Cluster process-execution
    events by parent process, user, host, and tokenized command line (DBSCAN), or score in-container behavior
    with the explainable classifiers benchmarked in [container syscall-representation IDS](https://www.sciencedirect.com/science/article/pii/S0167404825001270).
    Flag sessions in small, isolated clusters separate from dense admin behavior, surfacing the top contributing
    features in the alert. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable container/resource reconnaissance; pivot to the responsible source IP, account, service account,
    and process lineage, the targeted API verbs and resource types, the network segment of origin, and
    any sensitive resources read, to scope the adversary''s knowledge of the environment. A negative result
    helps reduce suspicion of this particular vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Linux auditd/execve
  - Falco syscall alerts
  - 'NAI: Administrative workstations, jump servers, CI/CD runners, container nodes, in-cluster pods.'
  range: Last 90 days (training baseline); score current events
  queries:
  - technology: SIEM/ML pseudocode
    query: "events = features(parent_proc, user, host, tokenize(cmdline))\nclusters = DBSCAN(events)\n\
      for s in sessions:\n  if cluster_size(s) small and isolated_from(dense_admin_clusters):\n    alert('discovery\
      \ clustering anomaly', s, top_features)"
- question: '[Discovery] Unauthorized zone port access: Can you determine whether a single source IP generates
    a volume of API calls to container endpoints that exceeds a statistical baseline, or originates from
    a network segment not explicitly authorized for container management. -- specifically, using the ''Unauthorized
    zone port access'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that a single source IP generates a volume of API calls to container endpoints that
    exceeds a statistical baseline, or originates from a network segment not explicitly authorized for
    container management. This Symbolic Logic approach works as follows: Generate high-severity alerts
    when Zeek conn.log or the audit log shows a non-admin subnet/account hitting container API endpoints
    (6443, 10250, 2375/2376) outside the approved management segment defined by [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf).
    Enforce/audit the boundary with [Kyverno policy-as-code](https://kyverno.io/policies/other/audit-event-on-exec/audit-event-on-exec/)
    so over-broad reads emit first-party events. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable container/resource reconnaissance; pivot to the responsible source
    IP, account, service account, and process lineage, the targeted API verbs and resource types, the
    network segment of origin, and any sensitive resources read, to scope the adversary''s knowledge of
    the environment. A negative result helps reduce suspicion of this particular vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Kubernetes API server audit log
  - 'NAI: Kubernetes API server, Docker daemon hosts, internal network firewalls and switches, management
    segment boundary.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for c in conn.log:\n  if c.id_resp_p in [6443,10250,2375,2376]\n     and subnet(c.id_orig_h)\
      \ not in approved_mgmt_segment:\n    alert(severity=high, 'unauthorized zone port access', c.id_orig_h,\
      \ c.id_resp_p)"
  - technology: SIEM/Rule pseudocode
    query: 'from k8s_audit where sourceIPs[*] not in mgmt_segment and verb in [get,list]

      | alert(''non-admin subnet reading API'', sourceIPs, objectRef.resource)'
