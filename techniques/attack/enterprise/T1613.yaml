name: 'T1613: Container and Resource Discovery'
id: 1e88e4ed-5e0e-4cec-8887-d6d42a81a7be
description: 'This playbook helps an analyst investigate whether an adversary is performing Container
  and Resource Discovery (MITRE ATT&CK T1613) -- enumerating containers, images, deployments, pods, nodes,
  secrets, configmaps, and overall cluster state within a containerized environment to orient before lateral
  movement, privilege escalation, or execution. Such reconnaissance is conducted against the Kubernetes
  API server, the Docker daemon, the kubelet, container metadata endpoints, and web management UIs (Kubernetes
  Dashboard, Rancher, OpenShift), or by running container-native CLI tooling (kubectl, docker, crictl,
  oc) with discovery subcommands (get, describe, ps, images, get nodes, get secrets). The hunt spans containerized
  platforms plus the endpoint and network telemetry that surrounds them, and pursues the behavior from
  several complementary angles: container-API connections originating from known-malicious source IPs
  on threat-intel feeds; discovery-oriented CLI executions launched by non-interactive or unauthorized
  parents; single sources generating anomalous volumes of API calls or reaching API ports from unauthorized
  network segments; bursts of HTTP 401/403 forbidden responses indicative of an under-privileged adversary
  probing the API; scripted scanning of management web UIs by automation User-Agents; a single source
  enumerating three or more distinct resource types within a short window; and anomalously large responses
  or out-of-allowlist access to sensitive resources such as secrets, configmaps, and pod logs. Detection
  methods combine deterministic symbolic-logic rules (threat-intel matching, discovery-CLI and Falco rules,
  unauthorized-zone port access, multi-resource stateful correlation, sensitive-endpoint allowlists),
  statistical baselining (new-source rate anomalies, per-IP and per-source count percentiles, forbidden-response
  bursts, syscall- and entropy-frequency spikes, session URI-ratio anomalies, resource-type Shannon entropy,
  response-size outliers, and ARIMA/Prophet rate forecasting), and machine learning (API session risk
  classifiers, discovery clustering with DBSCAN, LSTM autoencoders on UI navigation, ReplicaWatcher peer-divergence
  analysis, and one-class SVM/Isolation Forest endpoint-access models), applied across Zeek conn/http
  logs, the Kubernetes API server audit log, Docker daemon logs, Windows Event ID 4688, Linux auditd/execve,
  and Falco syscall alerts, so the analyst can corroborate suspected container reconnaissance against
  source reputation, process lineage, network segmentation, API verbs, and resource breadth.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
