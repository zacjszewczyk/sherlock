  - Zeek conn.log
  - Zeek http.log
  - Kubernetes API server audit log
  - 'NAI: Kubernetes API server, Docker daemon hosts, internal network firewalls and switches, management
    segment boundary.'
  range: Last 90 days (baseline); evaluate over the method's stated short windows for the current period
  queries:
  - technology: SIEM/Stats pseudocode
    query: "from k8s_audit per source:\n  forb = count(responseStatus.code in [401,403]) in 5min\n  ratio\
      \ = count(403)/max(count(200),1)\nif forb > 10 or ratio > pct99(ratio_baseline):\n  alert('forbidden-response\
      \ burst', source, forb, ratio)"
