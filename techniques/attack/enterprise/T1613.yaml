    enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Kubernetes API server audit log
  - 'NAI: Kubernetes API server, Docker daemon hosts, internal network firewalls and switches, management
    segment boundary.'
  range: Last 90 days (baseline); evaluate over the method's stated short windows for the current period
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per src_ip: counts = container_api_conns per 1min window

      baseline = pct99(counts, src_history)

      if any_window > baseline: alert(''per-IP scanning'', src_ip, window_count, baseline)'
- question: '[Discovery] Forbidden-response burst (failure mode): Can you determine whether a single source
    IP generates a volume of API calls to container endpoints that exceeds a statistical baseline, or
