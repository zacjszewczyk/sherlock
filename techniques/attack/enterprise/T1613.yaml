    a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Kubernetes API server audit log
  - Zeek http.log
  - 'NAI: Kubernetes API server, container nodes (for pod-to-API traffic).'
  range: Last 90 days (baseline); evaluate over the method's stated short windows for the current period
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per source within 10min window:\n  H = shannon_entropy(objectRef.resource types)\nif H > 3.0\
