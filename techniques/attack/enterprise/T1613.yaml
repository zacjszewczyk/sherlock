    Alert when either exceeds the 98th percentile, flagging likely scanning. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable container/resource reconnaissance;
    pivot to the responsible source IP, account, service account, and process lineage, the targeted API
    verbs and resource types, the network segment of origin, and any sensitive resources read, to scope
    the adversary''s knowledge of the environment. A negative result helps reduce suspicion of this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Web servers hosting container management UIs (Kubernetes Dashboard, Rancher, OpenShift) — an
    ''exposed sensitive interface'' per the Kubernetes threat matrix.'
  range: Last 90 days (baseline); evaluate over the method's stated short windows for the current period
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per session(src_ip,user_agent):\n  uri_ratio = unique_uris/total_requests\n  rate = total_requests/duration\n\
      if uri_ratio > pct98 or rate > pct98:\n  alert('session URI ratio anomaly', session, uri_ratio,\
      \ rate)"
