  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - 'NAI: Web servers hosting container management UIs (Kubernetes Dashboard, Rancher, OpenShift) — an
    ''exposed sensitive interface'' per the Kubernetes threat matrix.'
  range: Last 90 days (training baseline); score current events
  queries:
  - technology: SIEM/ML pseudocode
    query: "ae = LSTM_autoencoder(train=legit_uri_sequences)\nerr = ae.reconstruction_error(session.uri_sequence)\n\
      if err > threshold:\n  alert('scripted UI navigation', session, top_error_uris)"
- question: '[Discovery] Multi-resource stateful rule: Can you determine whether a single source IP makes
    API calls to list or get three or more distinct resource types (e.g., pods, secrets, deployments,
    nodes) within a 5-minute window, indicating broad reconnaissance. -- specifically, using the ''Multi-resource
    stateful rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary attempts to discover containers
    and related resources (images, deployments, pods, nodes, secrets, cluster status) to inform their
    next steps such as lateral movement, privilege escalation, and execution. This evidence focuses on
    the condition that a single source IP makes API calls to list or get three or more distinct resource
    types (e.g., pods, secrets, deployments, nodes) within a 5-minute window, indicating broad reconnaissance.
    This Symbolic Logic approach works as follows: Trigger when a single source IP/user issues `list`/`get`
    requests for three or more distinct `objectRef.resource` types (e.g., pods, secrets, deployments,
    nodes) within 5 minutes in the [Kubernetes audit log](https://www.datadoghq.com/blog/key-kubernetes-audit-logs-for-monitoring-cluster-security/);
    the audit schema fields are defined in the [Kubernetes Auditing docs](https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable container/resource
    reconnaissance; pivot to the responsible source IP, account, service account, and process lineage,
    the targeted API verbs and resource types, the network segment of origin, and any sensitive resources
    read, to scope the adversary''s knowledge of the environment. A negative result helps reduce suspicion
    of this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, low-and-slow, or living-off-the-land enumeration.'
  answer_sources:
  - Kubernetes API server audit log
  - Zeek http.log
  - 'NAI: Kubernetes API server, container nodes (for pod-to-API traffic).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from k8s_audit where verb in [list,get]

      | bucket 5min by sourceIPs

      | stats dc(objectRef.resource) as restypes by sourceIPs, bucket

      | where restypes >= 3

      | alert(''broad multi-resource recon'', sourceIPs, restypes)'
