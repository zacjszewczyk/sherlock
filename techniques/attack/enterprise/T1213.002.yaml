- question: Does a user's daily SharePoint download volume (bytes) or file count exceed their robust baseline
    (|Z|>3.5) or the departmental peer 98th percentile?
  context: 'Volumetric baselining detects anomalous bulk downloads in Collection. Baseline per-user daily
    download volume (bytes) and file count, then flag days exceeding the median/MAD modified z-score (|Z|>3.5)
    or peer 98th percentile, deriving thresholds from the legitimate busiest-day distribution. A positive
    result is a download spike inconsistent with the user''s history and peers; tune to legitimate bulk-sync
    events. References: [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [UEBA, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileDownloaded, FileSyncDownloadedFull)
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: SharePoint Farm Servers, User Workstations, Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=m365:unified Operation IN (FileDownloaded,FileSyncDownloadedFull)\n  | bin _time\
      \ span=1d\n  | stats sum(bytes) AS vol, count AS files BY UserId, _time\n  | eventstats median(vol)\
      \ AS med, p50(abs(vol-med)) AS mad, p98(vol) AS peer98 BY dept\n  | eval mz=0.6745*(vol-med)/mad\n\
      \  | where mz>3.5 OR vol>peer98\n  | table _time, UserId, vol, files, mz"
- question: When an online DNN/LSTM predicts a user's expected outbound/download volume and the observed
    volume produces a large positive residual, which per-feature contributions explain the anomaly?
  context: 'Residual-based volume modeling catches gradual or novel exfiltration tied to Collection. Predict
    expected per-user outbound/download volume with an online DNN/LSTM and alert on large positive residuals,
    decomposing the score into per-feature contributions for triage. Validate on labeled insider exfiltration
    (CERT dataset). A positive residual indicates the user moved far more data than the model expected;
    feature decomposition guides the analyst to the cause. References: [Deep Learning for Unsupervised
    Insider Threat Detection, Tuor et al](https://arxiv.org/abs/1710.00811); [CERT, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
