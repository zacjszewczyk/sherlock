name: 'T1213.002: Sharepoint'
id: 22cfbf37-73fc-4318-910c-5bb7dd508285
description: 'Investigate whether an adversary is mining sensitive information from internal SharePoint
  repositories (T1213.002). SharePoint frequently stores high-value content such as policies and procedures,
  network and system-architecture diagrams, technical documentation, work/project schedules, source-code
  snippets, embedded credentials, and links to internal shares. This playbook helps an analyst detect
  and triage abnormal SharePoint data collection: access to sensitive-keyword or sensitivity-labelled
  objects by users outside the approved group, bursts of denied-access permission probing, impossible-travel
  access, statistically anomalous unique-document or download volumes versus a user''s own 30-day baseline
  and departmental peers, privileged-account access outside documented administrative duties, SharePoint
  reconnaissance tooling seen in HTTP and PowerShell logs, and sensitive access followed quickly by new
  internal/external connections, archival utility execution, or large outbound transfers indicative of
  staging and exfiltration. It combines deterministic symbolic-logic rules, robust statistical baselining,
  and explainable machine-learning models across M365/SharePoint unified audit logs, Azure AD sign-in
  logs, Windows event logs, Active Directory, and Zeek network telemetry.'
type: technique
