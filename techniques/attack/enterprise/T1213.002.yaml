- question: Does a privileged account deviate from its documented activity baseline (allowed sites, hours,
    source IPs) or access content sites for the first time, and is it generating denied/failed attempts?
  context: 'Baselining privileged behavior refines detection of Collection. Build a baseline of documented
    privileged activity (allowed sites, hours, source IPs), flag deviations and first-ever content-site
    access, and profile failed/denied attempts as a distinct probing signal. A positive result shows a
    privileged account operating outside its known envelope; a negative keeps it within sanctioned bounds.
    Use UEBA peer/self comparison and keep the baseline current as duties change. References: [CloudTrail
    Anomaly Detector, Netflix-Skunkworks](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly); [UEBA,
    Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
