- question: Is a SharePoint download exceeding 500MB followed within one hour by execution of an archival
    utility (7z/rar/tar/zip) on the same host (Windows Event 4688)?
  context: 'Compression after bulk download is a classic staging step bridging Collection and exfiltration.
    Alert when a >500MB SharePoint download (sum of FileDownloaded/FileSyncDownloadedFull bytes) is followed
    within an hour by 7z/rar/tar/zip process creation (Windows 4688) on the same host. A positive result
    strongly suggests data is being packaged for transfer; investigate subsequent network egress. Map
    host identity to the SharePoint UserId for attribution. References: [Audit log activities, Microsoft
    Purview](https://learn.microsoft.com/en-us/purview/audit-log-activities); [SigmaHQ](https://github.com/SigmaHQ/sigma).'
