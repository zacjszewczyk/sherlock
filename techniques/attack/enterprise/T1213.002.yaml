questions:
- question: Are user accounts accessing or downloading SharePoint documents, list items, or search results
    whose title, path, sensitivity label, or content matches a sensitive-keyword watchlist while the user
    falls outside the approved AD/SharePoint group for that label?
  context: 'This question targets the core of the Collection tactic for SharePoint data mining: an adversary
    or insider reading sensitive content they are not authorized to see. Build a watchlist of sensitive
    keywords, SiteUrls, and SensitivityLabelIds, then monitor M365 unified audit FileAccessed/FileDownloaded/SearchQueried
    operations for matches where the UserId is not a member of the approved group. A positive result is
    high-fidelity because it pairs a sensitive object with an unauthorized identity; a negative result
    still leaves volumetric and behavioral detections to cover authorized-but-abnormal access. Use documented
    Purview audit fields and existing Sigma/Splunk m365 rules as ready logic. References: [Audit log activities,
    Microsoft Purview](https://learn.microsoft.com/en-us/purview/audit-log-activities); [SigmaHQ](https://github.com/SigmaHQ/sigma);
    [Splunk](https://research.splunk.com/cloud/).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileDownloaded, SearchQueried)
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: SharePoint Farm Servers, Domain Controllers, Internet Gateway/VPN Concentrators, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=m365:unified Operation IN (FileAccessed, FileDownloaded, SearchQueried)\n  |\
      \ where match(SourceFileName, $sensitive_kw) OR SiteUrl IN $sensitive_sites OR SensitivityLabelId\
      \ IN $sensitive_labels OR match(SearchQueryText, $sensitive_kw)\n  | lookup approved_label_members\
      \ UserId OUTPUT member\n  | where isnull(member)\n  | table _time, UserId, Operation, SourceFileName,\
      \ SiteUrl, SensitivityLabelId, ClientIP"
- question: Is any single user account accumulating more than 10 AccessDenied / access-request-denied
    events (or Windows 4625 failed logons) against sensitive SharePoint sites within a 10-minute window,
    indicating permission probing before successful collection?
  context: 'Failure states are a distinct enumeration signal in the Collection tactic. Before successfully
    collecting data, an adversary often probes which sensitive sites and libraries they can reach, generating
    a burst of denied-access events. Counting AccessDenied operations (and correlating Windows 4625 failed
    logons) per UserId in tight windows surfaces this reconnaissance even when no successful read occurred.
    A positive result warrants review of what the account subsequently accessed; a low count is normal
    noise. Threshold should be tuned to the environment''s legitimate denied-access baseline. References:
    [Audit log activities, Microsoft Purview](https://learn.microsoft.com/en-us/purview/audit-log-activities).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileDownloaded, SearchQueried)
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: SharePoint Farm Servers, Domain Controllers, Internet Gateway/VPN Concentrators, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=m365:unified Operation IN (AccessDenied, \"access-request-denied\")\n  | bin\
      \ _time span=10m\n  | stats count AS denials, dc(SiteUrl) AS sites BY UserId, _time\n  | where denials\
      \ > 10\n  | table _time, UserId, denials, sites"
- question: Does the same user account access sensitive SharePoint documents from two geolocations whose
    implied travel velocity is physically infeasible (e.g., greater than 900 km/h after allow-listing
    known VPN egress IPs)?
  context: 'Impossible travel exposes credential theft or shared/compromised accounts feeding the Collection
    tactic. Compute the great-circle distance between consecutive ClientIP geolocations for a single UserId
    and divide by elapsed time; flag sensitive-document access when the implied velocity is infeasible.
    Allow-list known VPN egress and cloud-provider ranges to avoid false positives. A positive result
    strongly suggests the credential is being used from more than one place; correlate with sign-in logs
    and conditional-access evaluations. References: [Detecting impossible travel WO2018085161A1, Microsoft](https://patents.google.com/patent/WO2018085161A1/en).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileDownloaded, SearchQueried)
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: SharePoint Farm Servers, Domain Controllers, Internet Gateway/VPN Concentrators, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=m365:unified Operation IN (FileAccessed, FileDownloaded) sensitive=true\n  |\
      \ sort UserId, _time\n  | streamstats current=f last(ClientIP) AS prev_ip last(_time) AS prev_time\
      \ BY UserId\n  | eval km=geo_distance(geoip(prev_ip), geoip(ClientIP)), hrs=(_time-prev_time)/3600\n\
      \  | where NOT cidrmatch($vpn_egress, ClientIP) AND hrs>0 AND (km/hrs)>900\n  | table _time, UserId,\
      \ prev_ip, ClientIP, km, hrs"
- question: Does a user's daily count of sensitive keyword/label hits exceed their own 30-day robust baseline
    (modified z-score |Z|>3.5) and their departmental peer 95th percentile?
  context: 'This statistical detection catches authorized users whose sensitive-content access spikes
    abnormally, a hallmark of staged Collection. Baseline each user''s daily keyword/label-hit count over
    30 days and use the median/MAD modified z-score (|Z|>3.5) rather than mean +/- 3 sigma, which resists
    skew from power users and batch jobs. Cross-check against the departmental peer 95th percentile so
    a genuinely high-volume role does not auto-trigger. A positive result indicates a behavioral break
    worth investigating; a negative keeps the user within normal bounds. References: [Modified Z-Score,
    Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileDownloaded, SearchQueried)
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: SharePoint Farm Servers, Domain Controllers, Internet Gateway/VPN Concentrators, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=m365:unified sensitive_hit=true\n  | bin _time span=1d\n  | stats count AS hits\
      \ BY UserId, _time\n  | eventstats median(hits) AS med, p50(abs(hits-med)) AS mad BY UserId\n  |\
      \ eval mz=0.6745*(hits-med)/mad\n  | where mz>3.5\n  | table _time, UserId, hits, mz"
- question: Is a user accessing a sensitive site, library, or sensitivity-label class for the first time
    ever, or issuing a never-before-seen SearchQueried term against sensitive content?
  context: 'First-seen access is a cheap, explainable rarity signal for Collection. Maintain a per-user
    lookback set of accessed sites/libraries/label classes and search terms; alert when a user touches
    a sensitive class for the first time, or searches a novel sensitive term. Compare against dynamic
    role-peer sets so new joiners and role changes are contextualized. A positive result flags exploratory
    behavior; benign first-seen events are common, so combine with sensitivity and volume context for
    triage. References: [CloudTrail Anomaly Detector, Netflix-Skunkworks](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly);
    [UEBA, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileDownloaded, SearchQueried)
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: SharePoint Farm Servers, Domain Controllers, Internet Gateway/VPN Concentrators, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=m365:unified Operation IN (FileAccessed, SearchQueried)\n  | lookup user_seen_sites\
      \ UserId SiteUrl OUTPUT seen\n  | where isnull(seen) AND SiteUrl IN $sensitive_sites\n  | table\
      \ _time, UserId, SiteUrl, SourceFileName, SearchQueryText"
- question: When a supervised/anomaly model scores a SharePoint access event as suspicious using features
    like role, geolocation, hour, history, sensitivity label, and failed-access ratio, what top-3 SHAP/LIME
    features explain the alert?
  context: 'An explainable ML classifier provides higher-order detection for Collection by fusing many
    weak signals. Score events with a Random Forest or Isolation Forest over features (role, geolocation,
    hour, access history, sensitivity label, failed-access ratio) and require each alert to list the top-3
    SHAP/LIME contributing features rather than a bare probability, so analysts can act. Train and validate
    on labeled insider scenarios (e.g., the CERT Insider Threat Test Dataset). A positive result with
    clear feature attribution accelerates triage; opaque scores should be distrusted. References: [SHAP
    Integration in IDS, Frontiers AI](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Isolation Forest, Liu et al](https://doi.org/10.1145/2133360.2133363); [CERT Insider Threat Test
    Dataset, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileDownloaded, SearchQueried)
  - Azure AD Sign-in Logs
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: SharePoint Farm Servers, Domain Controllers, Internet Gateway/VPN Concentrators, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  features = vectorize(role, geo, hour, hist_access, sensitivity_label, failed_ratio)\n\
      \  score = isolation_forest.decision_function(features)\n  if score < threshold:\n      explain\
      \ = shap_top_k(model, features, k=3)\n      emit_alert(UserId, score, explain)"
- question: Do HTTP requests to SharePoint match User-Agent or URI signatures for SharePoint enumeration
    tooling, and do Windows PowerShell ScriptBlock logs (Event ID 4104) show unauthorized Get-SPOSite/Get-SPOList/Get-PnP*
    cmdlets?
  context: 'This detects active SharePoint reconnaissance feeding the Collection tactic. Match Zeek http.log
    user_agent and uri fields against signatures for known enumeration tools, and search Event ID 4104
    for SharePoint enumeration cmdlets run by non-administrators. The SharePoint/m365 Sigma corpus is
    a baseline signature source. A positive result shows tooling-driven discovery of sites and lists;
    correlate the source host/user with subsequent access. Custom or renamed tooling may evade signatures,
    so pair with behavioral models. References: [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4104
  - 'NAI: SharePoint Web Front-End Servers, User Workstations, Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  source=zeek:http\n  | where match(user_agent, $sp_recon_ua) OR match(uri, $sp_recon_uri)\n\
      \  | table ts, id.orig_h, host, uri, user_agent"
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source=WinEventLog:Microsoft-Windows-PowerShell/Operational EventCode=4104\n  | where\
      \ match(ScriptBlockText, \"Get-SPOSite|Get-SPOList|Get-PnP\")\n  | lookup sp_admins User OUTPUT\
      \ admin | where isnull(admin)\n  | table _time, Computer, User, ScriptBlockText"
- question: Do /_api/ and /_vti_bin/ request parameters deviate from a learned per-endpoint profile of
    attribute length, character distribution, structure, token finiteness, and request timing?
  context: 'Web-attack anomaly modeling exposes scripted SharePoint API abuse supporting Collection. Profile
    per-endpoint /_api/ and /_vti_bin/ parameters using attribute length (Chebyshev bound), character
    distribution (chi-square), structural Markov/grammar inference, token finiteness, and request-frequency/inter-request-time.
    Alert on multi-model deviations and surface which model triggered so analysts understand the anomaly.
    A positive result indicates parameter tampering or atypical automated access; legitimate app traffic
    should fit the learned grammar. References: [Anomaly Detection of Web-based Attacks, Kruegel and Vigna](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4104
  - 'NAI: SharePoint Web Front-End Servers, User Workstations, Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  source=zeek:http uri IN (\"/_api/*\", \"/_vti_bin/*\")\n  | foreach endpoint: score\
      \ = combine(cheby_len, chisq_charDist, markov_struct, token_finite, freq_iat)\n  | where any_model_anomalous(score)\n\
      \  | table ts, id.orig_h, uri, offending_model, score"
- question: Is any IP or user generating a burst of /_api/ requests per 5-minute window beyond their robust
    baseline (|Z|>3.5), or an elevated 404/403/AccessDenied response rate indicative of scraping?
  context: 'Volumetric API profiling catches bulk SharePoint scraping in the Collection tactic. Baseline
    per-IP/user /_api/ request counts per 5-minute window and flag bursts using the median/MAD modified
    z-score (|Z|>3.5). Separately profile the 404/403/AccessDenied response rate as a distinct failure/enumeration
    signal. A positive volume result suggests automated harvesting; a high error rate suggests blind enumeration.
    Tune to legitimate sync clients and integrations. References: [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4104
  - 'NAI: SharePoint Web Front-End Servers, User Workstations, Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  source=zeek:http uri=\"/_api/*\"\n  | bin ts span=5m\n  | stats count AS reqs, sum(eval(status_code>=400))\
      \ AS errs BY id.orig_h, ts\n  | eventstats median(reqs) AS med, p50(abs(reqs-med)) AS mad BY id.orig_h\n\
      \  | eval mz=0.6745*(reqs-med)/mad\n  | where mz>3.5 OR (errs/reqs)>0.5\n  | table ts, id.orig_h,\
      \ reqs, errs, mz"
- question: Does the ordered sequence of /_api/ and /_vti_bin/ operations for a user or IP deviate from
    a learned DeepLog-style model, producing out-of-top-k next-call predictions or anomalous volumes?
  context: 'Sequence modeling detects abnormal SharePoint API workflows in Collection that volume thresholds
    miss. Model ordered /_api/ and /_vti_bin/ operation sequences per user/IP with a DeepLog-style stacked
    LSTM, flagging next-calls outside the top-k predictions and anomalous volumes. Use attention to expose
    which call drove the anomaly. A positive result indicates an unusual automation pattern; legitimate,
    repetitive app sequences should be highly predictable. References: [DeepLog, Du et al](https://doi.org/10.1145/3133956.3134015);
    [RNN Attention, Brown et al](https://arxiv.org/abs/1803.04967).'
  answer_sources:
  - Zeek http.log
  - Windows Event ID 4104
  - 'NAI: SharePoint Web Front-End Servers, User Workstations, Network Egress/Ingress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = ordered_api_ops(user_or_ip, window)\n  pred = deeplog_lstm.next_topk(seq, k=9)\n\
      \  if observed_next not in pred or volume_anomalous(seq):\n      emit_alert(entity, attention_step(seq))"
- question: Has a user accessed more than 1,000 unique SharePoint object URLs in one hour, or downloaded
    more than 500 unique files, after deduplicating FileAccessedExtended continuation events?
  context: 'A deterministic bulk-collection floor anchors detection of Collection. Alert when a user accesses
    >1,000 unique SharePoint object URLs (deduplicating FileAccessedExtended continuation events) in 1
    hour, or >500 unique downloads. Derive site-specific thresholds from the busiest legitimate 99th-percentile
    day so normal heavy use does not trip the rule. A positive result is a strong bulk-collection indicator;
    investigate the destination of the accessed data. References: [Audit log activities, Microsoft Purview](https://learn.microsoft.com/en-us/purview/audit-log-activities);
    [Splunk](https://research.splunk.com/cloud/).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileAccessedExtended, FileDownloaded)
  - Active Directory Logs
  - 'NAI: SharePoint Farm Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=m365:unified Operation IN (FileAccessed, FileAccessedExtended, FileDownloaded)\n\
      \  | bin _time span=1h\n  | stats dc(ObjectId) AS uniq_obj, dc(eval(if(Operation=\"FileDownloaded\"\
      ,ObjectId,null))) AS uniq_dl BY UserId, _time\n  | where uniq_obj>1000 OR uniq_dl>500\n  | table\
      \ _time, UserId, uniq_obj, uniq_dl"
- question: Does a user's hourly count of unique documents accessed and access frequency exceed their
    robust baseline (|Z|>3.5) and the departmental peer 99th percentile?
  context: 'This statistical detection adapts bulk-access thresholds per user for Collection. Baseline
    per-user hourly unique-document counts (volume) and access frequency (count/min), then flag events
    exceeding the median/MAD modified z-score (|Z|>3.5) and the peer 99th percentile. UEBA-style peer
    comparison prevents flagging users whose role legitimately requires high access. A positive result
    is an account-specific behavioral spike; a negative keeps the user within normal range. References:
    [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [UEBA, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileAccessedExtended, FileDownloaded)
  - Active Directory Logs
  - 'NAI: SharePoint Farm Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=m365:unified Operation IN (FileAccessed, FileAccessedExtended, FileDownloaded)\n\
      \  | bin _time span=1h\n  | stats dc(ObjectId) AS uniq BY UserId, _time\n  | eventstats median(uniq)\
      \ AS med, p50(abs(uniq-med)) AS mad, p99(uniq) AS peer99 BY dept\n  | eval mz=0.6745*(uniq-med)/mad\n\
      \  | where mz>3.5 AND uniq>peer99\n  | table _time, UserId, uniq, mz, peer99"
- question: When an Isolation Forest / OCSVM scores a SharePoint session anomalous on features like unique
    files, distinct sites, off-hours ratio, byte volume, and failed-access rate, what top-3 LIME/SHAP
    features explain it?
  context: 'Per-session outlier modeling captures multivariate bulk-collection behavior in Collection.
    Score session feature vectors (unique files, distinct sites, off-hours ratio, byte volume, failed-access
    rate) with Isolation Forest or OCSVM and list the top-3 LIME/SHAP contributing features in each alert.
    Validate on labeled exfiltration scenarios (CERT dataset). A positive result with clear attribution
    highlights which behaviors are abnormal; opaque scores need corroboration. References: [Isolation
    Forest, Liu et al](https://doi.org/10.1145/2133360.2133363); [Robust IoT IF/OCSVM, Scientific Reports](https://www.nature.com/articles/s41598-025-20445-4);
    [CERT, CMU SEI](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - SharePoint/M365 Unified Audit Logs (FileAccessed, FileAccessedExtended, FileDownloaded)
  - Active Directory Logs
  - 'NAI: SharePoint Farm Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  feats = session_vector(uniq_files, distinct_sites, offhours_ratio, bytes, failed_rate)\n\
      \  score = isolation_forest.decision_function(feats)\n  if score < threshold:\n      emit_alert(UserId,\
      \ score, shap_top_k(model, feats, 3))"
- question: Are highly privileged AD/Entra accounts (Domain/Enterprise Admin, SharePoint/Global Admin)
    reading SharePoint content libraries outside documented administrative paths?
  context: 'Privileged accounts have broad access, making their misuse a serious Collection risk. Alert
    on any SharePoint FileAccessed/FileDownloaded by privileged accounts that touches content libraries
    rather than the documented administrative paths their role requires. A positive result indicates an
    admin (or someone abusing admin credentials) reading business content they have no operational reason
    to read; correlate with change tickets. Maintain an accurate privileged-account and approved-path
    inventory. References: [Audit log activities, Microsoft Purview](https://learn.microsoft.com/en-us/purview/audit-log-activities);
    [SigmaHQ](https://github.com/SigmaHQ/sigma).'
  answer_sources:
