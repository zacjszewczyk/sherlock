- question: When a one-class SVM / Isolation Forest trained on legitimate admin access profiles scores
    a privileged SharePoint action as anomalous, what top-3 features (site, hour, volume) explain the
    alert?
  context: 'A one-class model learns the narrow envelope of legitimate admin behavior to detect Collection
    abuse. Train an OCSVM or Isolation Forest on legitimate admin access profiles and alert when privileged
    actions score anomalous, surfacing the top-3 contributing features (site, hour, volume) via LIME.
    A positive result indicates admin behavior unlike anything in training; explanations let analysts
    judge whether it is benign drift or abuse. References: [Robust IoT IF/OCSVM, Scientific Reports](https://www.nature.com/articles/s41598-025-20445-4);
    [SHAP in IDS, Frontiers AI](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
