- question: After a sensitive SharePoint FileAccessed/FileDownloaded, does the same host or IP initiate
    new SMB connections (Windows Event 5145) or external connections within 30 minutes?
  context: 'This correlation links Collection to staging/exfiltration. After a sensitive SharePoint access,
    alert on new SMB shares (Windows 5145) or external connections from the same host/IP within 30 minutes.
    A positive result suggests data is being moved toward an internal staging point or out of the environment
    shortly after collection; a negative leaves the access isolated. Tie host identity to the SharePoint
    UserId via sign-in and asset data. References: [Audit log activities, Microsoft Purview](https://learn.microsoft.com/en-us/purview/audit-log-activities).'
