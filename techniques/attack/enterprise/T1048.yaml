name: 'T1048: Exfiltration Over Alternative Protocol'
id: 545103b6-ba3f-4254-abbf-4abe928368fb
description: This playbook helps an analyst investigate suspected Exfiltration Over Alternative Protocol
  (T1048), where an adversary steals data over a protocol other than the primary command-and-control channel
  (for example FTP, SMTP, HTTP/S, DNS, SMB, ICMP, or cloud storage APIs), often to an alternate network
  destination. It guides the analyst through correlating outbound network connections and DNS queries
  against threat intelligence, detecting first-seen and rare external destinations that receive large
  uplinks, profiling egress connection-state failures, hunting data-transfer utilities (curl, certutil,
  bitsadmin, scp, PowerShell) and anomalous parent-child process chains, identifying DNS and ICMP tunneling
  via volume/entropy/record-type and information-content analysis, baselining per-service and per-host
  outbound data volume and directional byte-ratio asymmetry, spotting beaconing periodicity, detecting
  protocol-on-wrong-port (dynamic protocol detection) violations, and monitoring cloud and ESXi egress.
  It combines symbolic-logic rules, statistical baselining, and machine-learning models across network,
  endpoint, and cloud telemetry to surface defensible, actionable exfiltration leads.
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any internal asset establish an outbound connection or DNS query to an external IP or
    domain that appears on a threat-intelligence feed categorized as malware, command-and-control, or
    exfiltration, or to a first-seen external destination (not observed in the prior 30 days) that received
    more than 1 MB of uploaded data?
  context: 'Match Zeek conn.log destination IPs and dns.log queried domains against curated threat-intelligence
    feeds and alert on any hit in the malware, C2, or exfiltration categories. Because adversaries frequently
    rotate to fresh infrastructure not yet on any feed, also flag FIRST-SEEN external destinations that
    were not contacted in the prior 30 days and that receive orig_bytes > 1MB, prioritizing rare destinations
    the way newly observed hostname analysis recommends. A positive result is a strong, high-confidence
    exfiltration lead; pivot on the host, user, and the data staged before transfer. A negative result
    reduces but does not eliminate suspicion, since brand-new attacker infrastructure may not yet be categorized.
    This supports the Exfiltration tactic (TA0010): the adversary is trying to steal collected data, and
    T1048 specifically moves it over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewall, Corporate DNS Resolvers, Cloud Egress Points (e.g., NAT Gateways),
    Proxy Servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'LOAD conn.log, dns.log

      JOIN conn.id.resp_h, dns.query AGAINST ti_feed[category IN (''malware'',''command and control'',''exfiltration'')]

      ALERT on any match

      # rare/first-seen branch

      firstseen = dest NOT IN seen_destinations(prior 30d)

      ALERT WHERE firstseen AND orig_bytes > 1MB'
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek (sourcetype=conn OR sourcetype=dns)

      | lookup ti_feed dest OUTPUT category

      | where category IN ("malware","command and control","exfiltration")

      | append [ search index=zeek sourcetype=conn | where NOT [|inputlookup seen_dest_30d] | where orig_bytes>1000000
      ]'
- question: For external destinations not seen in the prior 30 days, is the ratio of bytes sent to bytes
    received anomalously high (orig_bytes > 1 MB and ratio in the 99th percentile for that subnet), indicating
    asymmetric outbound data movement consistent with exfiltration?
  context: 'For new destinations not observed in 30 days, compute orig_bytes/resp_bytes per connection
    and aggregate volume per destination (not per packet). Alert when orig_bytes > 1MB and the ratio falls
    in the 99th percentile for that subnet/role, deriving the cutoff from a 30-day baseline of the same
    subnet. Legitimate browsing is download-heavy (low orig:resp), so a sustained upload-heavy ratio to
    a novel destination is the physical signature of data theft. A positive result warrants identifying
    what data left and over which service; a negative result is expected for normal client traffic. This
    supports the Exfiltration tactic (TA0010): the adversary is trying to steal collected data, and T1048
    specifically moves it over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewall, Corporate DNS Resolvers, Cloud Egress Points (e.g., NAT Gateways),
    Proxy Servers'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: Zeek/Stats pseudocode
    query: "baseline = ratio_percentiles(orig_bytes/resp_bytes) per subnet over 30d\nfor conn WHERE dest\
      \ NOT IN seen(30d):\n  ratio = orig_bytes / max(resp_bytes,1)\n  ALERT IF orig_bytes > 1MB AND ratio\
      \ >= baseline.p99[subnet]"
  - technology: SIEM/Stats pseudocode
    query: 'index=zeek sourcetype=conn

      | eval ratio=orig_bytes/(resp_bytes+1)

      | where NOT [|inputlookup seen_dest_30d]

      | eventstats perc99(ratio) as p99 by subnet

      | where orig_bytes>1000000 AND ratio>=p99'
- question: Is any host generating an unusually high number of failed or blocked outbound connection attempts
    (Zeek conn_state S0/REJ/RSTO) to new external destinations, such as more than 20 failures in 5 minutes
    or a failed-to-successful ratio above 3:1, suggesting exfiltration staging or a blocked channel?
  context: 'Profile per-host outbound connection state and alert when a host produces more than 20 failed/blocked
    external attempts (S0/REJ/RSTO) in five minutes, or a failed:successful ratio greater than 3:1 to
    new destinations. This pattern reflects an actor probing for a working exfil channel or hitting egress
    controls, a distinct signal from successful transfers. Connection-state flags are validated discriminative
    features for malicious traffic. A positive result indicates active channel probing; correlate with
    the process attempting the connections. This supports the Exfiltration tactic (TA0010): the adversary
    is trying to steal collected data, and T1048 specifically moves it over a protocol or to a destination
    separate from the main C2 channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewall, Corporate DNS Resolvers, Cloud Egress Points (e.g., NAT Gateways),
    Proxy Servers'
  range: Last 90 days (5-minute correlation windows)
  queries:
  - technology: Zeek/pseudocode
    query: 'bucket conn by host, 5min

      failed = count(conn_state IN (''S0'',''REJ'',''RSTO'') AND dest external)

      succ   = count(conn_state IN (''SF'',''S1'') AND dest external)

      ALERT IF failed > 20 OR (failed/max(succ,1)) > 3 AND new_dest'
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek sourcetype=conn dest=external

      | bin _time span=5m

      | eval failed=if(conn_state IN("S0","REJ","RSTO"),1,0), ok=if(conn_state IN("SF","S1"),1,0)

      | stats sum(failed) as f sum(ok) as s by host,_time

      | where f>20 OR f/(s+1)>3'
- question: When Zeek connection features (duration, protocol, service, byte counts, conn_state, packet
    counts, JA3/JA3S, domain age, public suffix) are scored by a trained gradient-boosted model, which
    connections receive a high exfiltration probability, and what top SHAP feature contributions explain
    the score?
  context: 'Train an XGBoost/Random Forest on conn.log features plus JA3/JA3S fingerprints, domain age,
    and public suffix to score the probability that a connection is exfiltration. Surface the top-3 SHAP
    feature contributions (for example uplink bytes, destination rarity, JA3) in the alert text so the
    analyst can triage rationale quickly, and validate against a benign-only one-class baseline to control
    false positives. A high score with intuitive drivers (large uplink to a young, rare domain) is actionable;
    investigate the host and data. This supports the Exfiltration tactic (TA0010): the adversary is trying
    to steal collected data, and T1048 specifically moves it over a protocol or to a destination separate
    from the main C2 channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet Gateway, Egress Firewall, Corporate DNS Resolvers, Cloud Egress Points (e.g., NAT Gateways),
    Proxy Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [duration, proto, service, orig_bytes, resp_bytes, conn_state,\n            orig_pkts,\
      \ resp_pkts, ja3, ja3s, domain_age, public_suffix]\nscore = xgboost_model.predict_proba(features)\n\
      ALERT IF score > 0.9\nEMIT top3 = shap_values(features).top(3)"
- question: Did a process-creation event (Windows Event ID 4688) for a data-transfer utility such as certutil.exe
    (-urlcache -split -f), bitsadmin.exe (/transfer), curl.exe, or powershell.exe (Invoke-WebRequest/Invoke-RestMethod)
    occur within 60 seconds of an outbound Zeek connection from the same host to a non-corporate IP?
  context: 'Detect Event ID 4688 for known living-off-the-land transfer utilities and script interpreters
    with upload-indicative arguments, then correlate within 60 seconds with a Zeek conn.log outbound connection
    to a non-corporate destination. The temporal join ties the executing tool to the egress channel, distinguishing
    genuine transfer activity from benign tool use. Maintain coverage of the same channels exercised by
    common exfil toolkits (DNS/ICMP/HTTP/S/SMTP/FTP). A positive result is a strong endpoint-to-network
    exfil lead; capture the command line and destination. This supports the Exfiltration tactic (TA0010):
    the adversary is trying to steal collected data, and T1048 specifically moves it over a protocol or
    to a destination separate from the main C2 channel.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Virtual Desktop Infrastructure (VDI)'
  range: Last 90 days (60-second correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "4688 = EventID=4688 AND (Image IN (certutil.exe,bitsadmin.exe,curl.exe,powershell.exe))\n\
      \       AND CommandLine MATCHES ('-urlcache','-split','/transfer','Invoke-WebRequest','Invoke-RestMethod')\n\
      JOIN zeek_conn ON host WHERE conn.dest external AND |conn.ts - 4688.ts| <= 60s\nALERT"
- question: Does a new execution of curl, certutil, or PowerShell have a command-line string entropy exceeding
    the enterprise baseline by more than three standard deviations (mu+3sigma), indicating encoded or
    obfuscated arguments associated with data staging or upload?
  context: 'Baseline command-line string entropy for curl, certutil, and powershell across the enterprise
    and alert when a new execution exceeds mu+3sigma for that process. High character entropy of encoded
    arguments (base64 blobs, packed URLs/payloads) mirrors entropy/lexical separation used in n-gram malware
    analysis. A positive result flags an unusual, possibly obfuscated invocation worth decoding and correlating
    with network egress; a negative result means the command resembles normal usage. This supports the
    Exfiltration tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically
    moves it over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Virtual Desktop Infrastructure (VDI)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline mu,sigma = entropy(CommandLine) per Image over enterprise\nfor new 4688 WHERE Image\
      \ IN (curl.exe,certutil.exe,powershell.exe):\n  e = shannon_entropy(CommandLine)\n  ALERT IF e >\
      \ mu[Image] + 3*sigma[Image]"
- question: From auditd connect() syscalls, are transfer utilities repeatedly failing to connect (ECONNREFUSED/ETIMEDOUT)
    before a successful upload, indicating channel or destination probing prior to exfiltration?
  context: 'Inspect auditd connect() syscalls and flag transfer utilities whose outbound connects repeatedly
    fail (ECONNREFUSED/ETIMEDOUT) immediately before a successful upload. This failure-then-success pattern
    is a distinct signal of an actor probing destinations or ports to find a working exfil channel. Connection-state
    features are discriminative for malicious flows. A positive result pinpoints the probing process and
    the eventually-successful destination for follow-up. This supports the Exfiltration tactic (TA0010):
    the adversary is trying to steal collected data, and T1048 specifically moves it over a protocol or
    to a destination separate from the main C2 channel.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Virtual Desktop Infrastructure (VDI)'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: 'filter SYSCALL=connect AND comm IN (curl,scp,ftp,wget,python)

      seq per pid: count fails (exit=ECONNREFUSED|ETIMEDOUT) then success (exit=0)

      ALERT IF fails >= 3 followed_by success within 5m'
- question: Do any rare parent-child process chains correlated with network behavior appear, such as Office
    spawning cmd.exe then powershell.exe making large HTTP POSTs, that deviate from learned typical execution
    sequences?
  context: 'Use sequence mining or character-level models to learn typical parent-child process chains
    and their associated network behavior, then flag rare chains such as Office -> cmd.exe -> powershell.exe
    issuing large HTTP POSTs. Report the top-3 contributing chain/flow features in the alert so the analyst
    sees why it fired. These anomalous chains are classic delivery-to-exfil patterns. A positive result
    is a high-value lead linking initial execution context to outbound data movement. This supports the
    Exfiltration tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically
    moves it over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User Workstations, Application Servers, Domain Controllers, Virtual Desktop Infrastructure (VDI)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = sequence_model(parent->child chains + net features)\nfor chain in process_tree:\n\
      \  p = model.rarity(chain, post_bytes)\n  ALERT IF p anomalous (e.g., office->cmd->powershell AND\
      \ http_post_bytes large)\n  EMIT top3 features"
- question: Is a single source IP issuing more than 50 DNS TXT or NULL queries to one registered domain
    within 5 minutes, or are Zeek icmp.log Echo Request/Reply payloads consistently larger than 128 bytes,
    indicating DNS or ICMP tunneling exfiltration?
  context: 'Alert when one source IP issues more than 50 DNS TXT/NULL queries to a single registered domain
    within five minutes, or when icmp.log shows Echo Request/Reply payloads larger than 128 bytes. Rare
    resource-record types (NULL/TXT/CNAME) and oversized ICMP payloads are deterministic covert-channel
    signatures. Prioritizing rare record types and label structure follows newly-observed-hostname research.
    A positive result strongly suggests tunneling; identify the domain operator and the host''s encoded
    outbound content. This supports the Exfiltration tactic (TA0010): the adversary is trying to steal
    collected data, and T1048 specifically moves it over a protocol or to a destination separate from
    the main C2 channel.'
  answer_sources:
  - Zeek dns.log
  - Zeek icmp.log
  - 'NAI: Internal DNS Servers, Internet Gateway, Network Egress Points, Domain Controllers'
  range: Last 90 days (5-minute windows)
  queries:
  - technology: Zeek/pseudocode
    query: '# DNS branch

      bucket dns by src,registered_domain,5min

      ALERT IF count(qtype IN (''TXT'',''NULL'')) > 50

      # ICMP branch

      ALERT IF icmp.payload_len > 128 (sustained echo req/reply)'
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek sourcetype=dns qtype IN ("TXT","NULL")

      | bin _time span=5m | stats count by src,registered_domain,_time | where count>50

      | append [ search index=zeek sourcetype=icmp | where payload_len>128 ]'
- question: Using a bounded-memory per-registered-domain accumulator of compressed (post-gzip/bzip2) query-label
    information, do any domains carry encoded information greatly exceeding the legitimate baseline, indicating
    a high-capacity DNS covert channel?
  context: 'Maintain a streaming, bounded-memory accumulator per registered domain of the encoded information
    in concatenated query labels (measured as post-gzip/bzip2 bytes) and alert on domains whose compressed
    information greatly exceeds the legitimate baseline. This applies provable bounds on surreptitious
    DNS communication via a heavy-hitter design, capturing channels that simple per-minute rate rules
    miss because it measures actual information content rather than query count. A positive result identifies
    the highest-capacity covert DNS channels for priority investigation. This supports the Exfiltration
    tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically moves it
    over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek dns.log
  - Zeek icmp.log
  - 'NAI: Internal DNS Servers, Internet Gateway, Network Egress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each dns query:\n  blob[registered_domain] += concat(query_labels)\n  info[domain] = len(gzip(blob[domain]))\
      \  # bounded-memory heavy-hitter\nALERT domains WHERE info[domain] >> baseline_info[domain]"
- question: Does any host exceed the 99th percentile for TXT/NULL DNS query proportion, show a mean query-name
    entropy above 3.5, or exhibit a spike in NXDOMAIN (failed lookup) rate, indicating DNS tunneling or
    exfiltration staging?
  context: 'Baseline per-host DNS query-type distribution and flag hosts exceeding the 99th percentile
    for TXT/NULL queries or with mean query-name entropy above 3.5. Additionally treat an NXDOMAIN-rate
    spike as a distinct tunneling/exfil-staging signal, since encoded subdomains frequently resolve to
    non-existent names. Lexical and entropy features are established DNS exfiltration indicators. A positive
    result identifies a host whose DNS behavior departs from its norm; decode the query names and check
    for paired outbound channels. This supports the Exfiltration tactic (TA0010): the adversary is trying
    to steal collected data, and T1048 specifically moves it over a protocol or to a destination separate
    from the main C2 channel.'
  answer_sources:
  - Zeek dns.log
  - Zeek icmp.log
  - 'NAI: Internal DNS Servers, Internet Gateway, Network Egress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per host: qtype_dist, entropy(query), nxdomain_rate\nALERT IF txt_null_pct > p99(host_pop)\n\
      \     OR mean_entropy(query) > 3.5\n     OR nxdomain_rate > baseline + spike"
- question: When Zeek dns.log records are clustered by query length, subdomain count, entropy, TXT/A ratio,
    and uplink bytes, do any outlier clusters emerge that correspond to DNS tunnels?
  context: 'Cluster dns.log tuples (query length, subdomain count, entropy, TXT/A ratio, uplink bytes)
    with DBSCAN or Isolation Forest and investigate outlier clusters as DNS tunnels. Emit the top-3 distinguishing
    features per cluster so the analyst understands what made it anomalous. Clustering captures coordinated
    tunneling behavior that single-feature thresholds miss. A positive result (a tight outlier cluster
    of long, high-entropy, subdomain-rich queries) is a strong tunneling lead. This supports the Exfiltration
    tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically moves it
    over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek dns.log
  - Zeek icmp.log
  - 'NAI: Internal DNS Servers, Internet Gateway, Network Egress Points, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = dns features[query_len, subdomain_count, entropy, txt_a_ratio, uplink_bytes]

      labels = DBSCAN(eps, min_samples).fit(X)   # or IsolationForest

      investigate outlier_clusters

      EMIT top3 distinguishing features per cluster'
- question: When DNS features are aggregated per second-level domain over long (multi-hour) windows and
    scored with Isolation Forest, do any low-and-slow channels surface that evade per-minute rate rules?
  context: 'Aggregate features per second-level domain over long windows (hours) and score with Isolation
    Forest to catch low-and-slow exfiltration channels that deliberately stay under per-minute rate thresholds.
    Tune on a labeled DNS exfiltration benchmark to calibrate sensitivity. This complements the burst-oriented
    rules by extending the observation window. A positive result reveals patient, throttled tunneling
    that volume rules cannot see; investigate the domain and originating hosts. This supports the Exfiltration
    tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically moves it
    over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek dns.log
  - Zeek icmp.log
  - 'NAI: Internal DNS Servers, Internet Gateway, Network Egress Points, Domain Controllers'
  range: Last 90 days (multi-hour aggregation windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: "for sld in domains:\n  feats = aggregate(dns[sld], window=hours)  # counts, entropy, bytes,\
      \ qtype mix\n  score = IsolationForest.decision_function(feats)\n  ALERT IF score anomalous  # low-and-slow\
      \ channels"
- question: Did a workstation make an external connection with orig_bytes greater than 100 MB and resp_bytes
    less than 1 MB (excluding known corporate backup or file-sharing destinations), indicating a large
    asymmetric outbound transfer?
  context: 'Alert when a workstation connects externally with orig_bytes > 100MB and resp_bytes < 1MB,
    excluding sanctioned corporate backup/file-sharing destinations. The directional volume asymmetry
    is the core physical signature of bulk exfiltration, consistent with content/volume anomaly modeling.
    Maintaining an allowlist of legitimate high-upload destinations controls false positives. A positive
    result is a high-confidence bulk-exfil lead; determine what was sent and to whom. This supports the
    Exfiltration tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically
    moves it over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek smb_files.log
  - 'NAI: Internet Gateway, Core Network Switches, Servers Hosting Sensitive Data (e.g., file shares,
    databases)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for conn WHERE host IS workstation AND dest external:\n  ALERT IF orig_bytes > 100MB AND resp_bytes\
      \ < 1MB\n          AND dest NOT IN corporate_backup_allowlist"
  - technology: SIEM/Rule pseudocode
    query: 'index=zeek sourcetype=conn dest=external

      | where orig_bytes>104857600 AND resp_bytes<1048576

      | search NOT [|inputlookup backup_allowlist]'
- question: For each service (ssl, dns, smb, ftp, smtp) per host/role, does daily outbound byte volume
    exceed the 30-day mean by more than three standard deviations (mu+3sigma)?
  context: 'Track the 30-day mean and sigma of daily outbound bytes per service (ssl, dns, smb, ftp, smtp)
    per host/role and alert when totals exceed mu+3sigma. Thresholds must be derived per service because
    baselines differ widely (a host''s normal SSL volume dwarfs its normal DNS volume). Per-service aggregation
    prevents large-but-normal channels from masking small anomalous ones. A positive result identifies
    which protocol carried the anomalous uplink, focusing the investigation. This supports the Exfiltration
    tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically moves it
    over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek smb_files.log
  - 'NAI: Internet Gateway, Core Network Switches, Servers Hosting Sensitive Data (e.g., file shares,
    databases)'
  range: Last 90 days (30-day baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline mu,sigma = daily_outbound_bytes per (host,role,service) over 30d\nfor today (host,service):\n\
      \  ALERT IF sum(orig_bytes) > mu[host,service] + 3*sigma[host,service]"
- question: Do any (host, destination) connection time series exhibit a dominant period (detected via
    FFT and confirmed by autocorrelation) indicating cadenced or scheduled upload callbacks, including
    regular small uploads that volume thresholds miss?
  context: 'Build per (host,destination) connection time series and extract dominant periods via FFT confirmed
    by autocorrelation to detect cadenced/scheduled upload callbacks that are robust to jitter. This flags
    regular small uploads (beaconing exfil) that volume thresholds never trigger on. A positive result
    reveals automated, periodic egress to a destination; correlate with the process and payload. Strong,
    jitter-tolerant periodicity to an external host is a classic C2/exfil indicator. This supports the
    Exfiltration tactic (TA0010): the adversary is trying to steal collected data, and T1048 specifically
    moves it over a protocol or to a destination separate from the main C2 channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek smb_files.log
  - 'NAI: Internet Gateway, Core Network Switches, Servers Hosting Sensitive Data (e.g., file shares,
    databases)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for (host,dest):\n  ts = connection_interarrival_series\n  peak = FFT(ts).dominant_period\n\
      \  if autocorrelation(ts, peak) strong:\n    ALERT beaconing period=peak  # robust to jitter"
- question: For high-value assets, does actual hourly outbound byte volume exceed the upper confidence/reconstruction-error
    bound of an online forecast model (ARIMA or autoencoder ensemble), and which features or time-windows
    drove the deviation?
  context: 'Forecast hourly outbound bytes for high-value assets (ARIMA or an online autoencoder ensemble)
    and alert when actual volume exceeds the upper confidence or reconstruction-error bound. KitNET-style
    incremental statistics give label-free, line-rate scoring. Report the top-3 features/time-windows
    driving the deviation for triage. This catches volume spikes that static thresholds miss because it
    adapts to each asset''s diurnal pattern. A positive result flags an unexpected uplink surge on a sensitive
    asset. This supports the Exfiltration tactic (TA0010): the adversary is trying to steal collected
    data, and T1048 specifically moves it over a protocol or to a destination separate from the main C2
    channel.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Zeek smb_files.log
  - 'NAI: Internet Gateway, Core Network Switches, Servers Hosting Sensitive Data (e.g., file shares,
    databases)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = ARIMA_or_online_autoencoder(hourly_outbound_bytes per asset)\nfor hour:\n  pred, bound\
      \ = model.forecast()\n  ALERT IF actual > bound\n  EMIT top3 features/time-windows"
- question: Does Zeek dpd.log show a protocol/analyzer mismatched to its port (e.g., SSH on TCP/443, non-DNS
    on UDP/53), or do conn.log TCP/443 entries lack a corresponding ssl.log uid (non-TLS traffic on the
    TLS port)?
  context: 'Alert when dpd.log shows a mismatched proto/analyzer (analyzer != DNS on port 53, SSH on TCP/443,
    etc.) or when conn.log TCP/443 entries have no matching ssl.log uid (non-TLS on the TLS port). Protocol-on-wrong-port
