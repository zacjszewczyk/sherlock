name: 'T1555.005: Password Managers'
id: 04bfb14d-59b9-44d7-a70b-65d531c78a11
description: 'This playbook helps an analyst investigate whether an adversary is stealing user credentials
  from third-party password managers (KeePass/KeePassXC, 1Password, LastPass, Bitwarden, gnome-keyring,
  pass) as part of the Credential Access tactic. Password managers keep credentials in encrypted vault
  files on disk (*.kdbx, *.opvault, *.agilekeychain, *.ldb, ~/.password-store/*, ~/.local/share/keepassxc/*)
  and, once the user enters the master password, decrypt the master password and plaintext entries into
  process memory -- making live memory scraping while the vault is unlocked the primary theft vector,
  alongside vault-file reads and brute-forcing of the master password. The hunt spans Windows, Linux,
  and macOS endpoint telemetry plus network egress logs. It guides the analyst across several behavioral
  angles: execution of known credential-theft tooling matched by hash and connections to credential-exfiltration
  infrastructure; memory-dumping utilities (procdump, comsvcs.dll MiniDump, createdump) invoked against
  a manager process; cross-process handle opens requesting PROCESS_VM_READ into manager processes and
  Linux ptrace/proc-mem access; unauthorized reads of vault database files by non-allowlisted processes;
  anomalous parent-child process relationships involving managers; and rapid vault-read-to-outbound-exfiltration
  sequences. Detection methods combine deterministic symbolic-logic rules, statistical baselining/forecasting
  (prevalence, entropy, volume, frequency, sequence), and machine-learning models (one-class/isolation-forest
  anomaly detection, command-line NLP, provenance-graph learning) applied to Windows Security/Sysmon events,
  auditd, macOS unified logs, osquery, and Zeek conn/dns logs, so the analyst can corroborate suspected
  password-manager theft against process lineage, file and memory access, and downstream network exfiltration.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
