questions:
- question: '[Credential Access] Hash and domain blocklist correlation: Can you determine whether a process
    creation event is logged with a file hash matching a known password manager credential theft tool,
    or a network connection is initiated by any process to a destination IP or domain known to be associated
    with credential exfiltration. -- specifically, using the ''Hash and domain blocklist correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary acquires user
    credentials from third-party password managers -- typically by scraping the unlocked vault''s master
    password and plaintext entries from memory, reading the encrypted vault database off disk, or brute-forcing
    the master password -- leaving traces across process-execution, process-memory, file-access, and network
    telemetry. This evidence focuses on the condition that a process creation event is logged with a file
    hash matching a known password manager credential theft tool, or a network connection is initiated
    by any process to a destination IP or domain known to be associated with credential exfiltration.
    This Symbolic Logic approach works as follows: Match the SHA256 hash from Windows Event ID 4688 /
    Sysmon Event ID 1 process creations against threat intelligence of password-stealing malware while
    simultaneously checking Zeek conn.log and dns.log destinations against high-confidence C2/exfil domains.
    Treat this as a deterministic floor and never remove confirmed-bad indicators. A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable unauthorized access to or
    theft of password-manager credentials; pivot to the responsible process and its parent lineage, the
    user and host context, the targeted manager process or vault file, the GrantedAccess/handle or syscall
    details, and any subsequent outbound connection or data transfer. A negative result helps rule out
    this particular password-manager theft vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, living-off-the-land, or low-and-slow credential
    theft.'
