questions:
- question: Are files being written to removable drives whose filename or hash matches known C2 staging
    indicators, or that are created with hidden+system attributes or system-mimicking names?
  context: 'This question hunts for the signature staging behavior of USB courier-relay implants (USBStealer,
    USBCulprit). For Command and Control through removable media, the first observable is a malicious
    file deposited onto a removable volume. Ingest threat-intelligence feeds of known staging filenames/hashes
    and watch file-creation events on removable-drive paths (Sysmon EID 11, Windows EID 4663, auditd write/open,
    macOS DiskArbitration+fs_usage). A hash/filename match is a high-severity positive. Independently
    flag any removable write that sets the hidden+system attributes or uses a system-mimicking name, because
    legitimate users rarely create such files and couriers use them to hide payloads. A negative result
    (no matches, no hidden/system writes) lowers but does not eliminate suspicion since novel implants
    may evade TI. References: [Sednit Espionage Group Attacking Air-Gapped Networks, ESET](https://www.welivesecurity.com/2014/11/11/sednit-espionage-group-attacking-air-gapped-networks/);
    [Cycldek: Bridging the (air) gap, Kaspersky](https://securelist.com/cycldek-bridging-the-air-gap/97157/).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: User workstations, servers with USB ports, air-gapped systems, and high-security network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'file_create = (Sysmon EID=11) OR (WinEvent EID=4663 AccessMask=WriteData) OR (auditd write/open)
      OR (macos fs_usage write)

      WHERE target_path matches removable_drive_path

      JOIN ti_feed ON (file_hash IN ti_staging_hashes) OR (file_name IN ti_staging_names)

      OR (file_attributes CONTAINS ''Hidden'' AND ''System'')

      OR (file_name matches system_mimicking_regex)

      => ALERT severity=high, label=''removable C2 staging'''
- question: On a per-host and per-user basis, do removable-drive mounts show anomalous spikes in bytes
    written, file write counts, or unusually rare filenames compared with a rolling 30-day baseline?
  context: 'Covert removable channels still emit measurable write I/O, so volumetric and frequency baselining
    catches staging activity even without a TI match. For each host/user, baseline bytes written per mount,
    files written per mount, and filename rarity over a rolling 30-day window. Flag mounts exceeding mean+3sigma
    on bytes or write-count, or filenames in the bottom 1st percentile of observed rarity. Treat deliberate,
    repetitive patterned writes (steady identical-size bursts) as suspicious because covert USB channels
    emit periodic write bursts. In the Command and Control context, an air-gapped host suddenly writing
    far more (or far more rarely-named) data to USB than its norm suggests courier staging. Tune percentiles
    against copy-to-removable logs to avoid flagging routine backups. References: [Finding Anomalies in
    Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [USBee, Guri et al.](https://arxiv.org/abs/1608.08397); [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: User workstations, servers with USB ports, air-gapped systems, and high-security network segments.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling_30d per (host,user): mean,std of bytes_written_per_mount, files_per_mount;\
      \ filename_rarity_dist\nFOR each mount:\n  IF bytes_written > mean_bytes + 3*std_bytes OR files_written\
      \ > mean_files + 3*std_files\n     OR filename_rarity <= 1st_percentile\n     OR detect_periodic_identical_size_bursts(writes)\n\
      \  => ALERT 'anomalous removable write volume/frequency'"
- question: Does a machine-learning model trained on labeled removable-write events score any current
    write as malicious with high confidence, and which features drive that score?
  context: 'Where deterministic rules and simple statistics miss novel staging, a supervised model generalizes
    across feature combinations. Train a Random Forest on labeled removable writes using features such
    as filename entropy, filename length, extension, parent process, hidden/system attribute, bytes written,
    and hash-known status, using insider-threat removable-media logs as a labeling template. Alert when
    P(malicious) exceeds 0.90 and surface the top-3 contributing features in the alert so analysts can
    triage quickly (e.g., high entropy + hidden attribute + unusual parent). For Command and Control via
    removable media this catches courier staging that does not match any single rule. Validate precision
    regularly to keep alert volume manageable. References: [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: User workstations, servers with USB ports, air-gapped systems, and high-security network segments.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [filename_entropy, filename_len, extension, parent_process, hidden_system_attr,\
      \ bytes_written, hash_known]\nmodel = RandomForest.load('removable_write_clf')  # trained on insider-threat\
      \ removable logs\np = model.predict_proba(features)\nIF p_malicious > 0.90:\n  ALERT message='malicious\
      \ removable write', top_features=model.top3_contributions(features)"
- question: Is a high-risk executable extension (.exe, .dll, .ps1, .vbs, .scr) or a hidden-attribute file
    being written to a removable drive by a parent process outside the approved set of legitimate removable
    writers?
  context: 'Legitimate writes of executables to removable media come from a small, predictable set of
    processes (backup tools, IT imaging utilities). Maintain a high-risk extension list and an allow-list
    of approved removable writers, monitor Sysmon EID 11 on removable volumes, and alert when a high-risk
    extension or hidden-attribute file is created by an unapproved parent (browser, office app, side-loaded
    signed binary). Weight the alert heavily when the writer is an abused/side-loaded signed binary, the
    exact delivery pattern used by USBCulprit and Stuxnet. For Command and Control through removable media,
    this catches the moment a payload is dropped onto the courier medium. References: [Cycldek: Bridging
    the (air) gap, Kaspersky](https://securelist.com/cycldek-bridging-the-air-gap/97157/); [W32.Stuxnet
    Dossier, Symantec](https://docs.broadcom.com/doc/security-response-w32-stuxnet-dossier-11-en).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - 'NAI: All endpoint devices with removable media access, administrative jump boxes, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "write = Sysmon EID=11 WHERE target_path IN removable_drive_path\nhigh_risk = extension IN\
      \ ['.exe','.dll','.ps1','.vbs','.scr'] OR attribute CONTAINS 'Hidden'\nIF high_risk AND parent_image\
      \ NOT IN approved_removable_writers:\n  sev = high IF parent_is_signed_but_sideloaded ELSE medium\n\
      \  ALERT 'high-risk file written to USB by unapproved parent'"
- question: For removable writes, does the conditional probability P(extension | parent process) fall
    below 0.01, indicating an anomalous parent/extension pairing?
  context: 'Rather than a static allow-list, model the learned association between a parent process and
    the file extensions it normally writes to removable media over a 30-day window. Compute P(extension|parent)
    and flag events where this probability falls below 0.01 - for example, winword.exe writing a .scr,
    or a browser writing a .dll, to a USB drive. These rare pairings are statistically unusual and often
    indicate that a compromised or abused process is staging a payload for courier relay. A low probability
    is a positive signal; common pairings (backup.exe writing .zip) score high and are suppressed. This
    complements the allow-list approach by adapting to each environment. References: [Finding Anomalies
    in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - 'NAI: All endpoint devices with removable media access, administrative jump boxes, and developer workstations.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR removable writes over 30d: compute P(extension | parent_process)\nFOR each new write:\n\
      \  IF P(extension | parent_process) < 0.01:\n    ALERT 'anomalous parent/extension pairing on removable\
      \ write'"
- question: Is a single host generating repeated access-denied or failed removable-write attempts (more
    than 5 in 10 minutes), consistent with malware probing a device-control or write-protection policy?
  context: 'Failed/blocked removable writes are a distinct and often overlooked signal. When device-control
    or write-protect policies are enforced, malware attempting to stage a payload to USB will generate
    access-denied failures. Profile Windows EID 4663 failure audits and auditd EACCES on removable paths,
    and alert when a host produces repeated failed removable-write attempts (>5 in 10 minutes). In the
    Command and Control context, this reveals an implant actively trying (and failing) to use the courier
    medium, which is high-value because it indicates intent even when staging is prevented. A clean host
    shows essentially no failed removable writes. References: [Bridgeware: The Air-Gap Malware, Guri &
    Elovici](https://arxiv.org/abs/1808.06636).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - 'NAI: All endpoint devices with removable media access, administrative jump boxes, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "failed = (WinEvent EID=4663 Audit=Failure) OR (auditd result=EACCES) WHERE target_path IN\
      \ removable_drive_path\nstats = count by host over sliding_10min\nIF count > 5:\n  ALERT 'repeated\
      \ blocked removable-write attempts (device-control probing)'"
- question: When clustering removable-write events by parent process, extension, file attributes, and
    bytes written, do any events fall into sparse or noise clusters indicating rare combinations?
  context: 'Unsupervised clustering surfaces unusual combinations without labeled data. Vectorize removable
    write events using parent process, extension, file attributes, and bytes written, then apply DBSCAN.
    Events landing in sparse or noise clusters represent rare combinations that warrant review; report
    the nearest dense cluster and the top-3 differing features for explainability. For Command and Control
    through removable media, courier staging tends to look different from routine USB usage and so isolates
    as noise. Train/validate against insider-threat removable-media data. A positive is membership in
    a noise cluster; the majority of normal writes form dense, benign clusters. References: [CERT Insider
    Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - 'NAI: All endpoint devices with removable media access, administrative jump boxes, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "vectors = removable_writes -> [parent_process, extension, file_attributes, bytes_written]\n\
      labels = DBSCAN(vectors, eps, min_samples)\nFOR e WHERE labels[e] == -1 (noise) OR cluster_size\
      \ < min:\n  ALERT 'rare removable-write combination', nearest_cluster, top3_diff_features"
- question: Does a process read a file from a removable drive and then, within five minutes, initiate
    an outbound connection to an external destination (the courier relay leg)?
  context: 'This read-then-egress sequence is the invariant of the two-stage courier model: the internet-connected
    host reads data the air-gapped host placed on the removable medium and relays it out (or pulls new
    commands in). Detect removable-media read events (Windows EID 4663 with ReadData AccessMask; auditd/fs_usage
    reads on removable mounts), correlate with the same process''s subsequent outbound connection (Zeek
    conn.log, Sysmon EID 3) within 5 minutes, and enrich destinations with C2 threat intelligence. A correlated
    read+egress, especially to a TI-flagged or rare destination, is a strong Command and Control positive.
    Absence of egress after removable reads is benign normal usage. References: [Bridgeware: The Air-Gap
    Malware, Guri & Elovici](https://arxiv.org/abs/1808.06636); [Sednit Espionage Group Attacking Air-Gapped
    Networks, ESET](https://www.welivesecurity.com/2014/11/11/sednit-espionage-group-attacking-air-gapped-networks/).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet-connected workstations with USB access, network egress points (firewalls, proxies),
    and DNS servers.'
  range: Last 90 days (correlate read and connection within a 5-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'reads = (WinEvent EID=4663 AccessMask=ReadData) OR (auditd/fs_usage read) WHERE path IN removable_drive_path

      conns = (Sysmon EID=3) outbound

      JOIN ON same pid/process WHERE conn.time - read.time <= 5min AND dest is external

      enrich dest WITH c2_ti

      => ALERT ''removable read followed by external egress (courier relay)'''
  - technology: Zeek/pseudocode
    query: 'conn.log: filter outbound conns by endpoint host with recent removable read (from endpoint
      feed)

      dns.log: correlate query names; enrich resp_h/query against c2_ti

      => flag read-to-egress within 5min window'
- question: Following removable reads, does a process show anomalous outbound throughput, rare destination
    ports, or elevated connection failure rates compared with baseline?
  context: 'After a removable read, the courier leg''s network behavior reveals relay/exfil activity.
    Profile each process''s outbound behavior following removable reads and flag three distinct signals:
    Volume (bytes sent within 10 minutes above the 95th percentile), rare destination ports, and elevated
    failure-state (spikes in blocked connections, NXDOMAIN, or 4xx responses indicating probing or failed
    C2). Baseline benign periodic services to avoid false positives. In Command and Control via removable
    media, a process that just read from USB and then pushes an abnormal volume to an unusual port is
    highly suspicious. Validate detection at scale against enterprise network telemetry. References: [Finding
    Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Modeling Periodic Traffic on a Campus Edge Network, Mack et al.](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf);
    [LANL cyber1](https://csr.lanl.gov/data/cyber1/).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet-connected workstations with USB access, network egress points (firewalls, proxies),
    and DNS servers.'
  range: Last 90 days (evaluate the 10-minute window after each removable read)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per process: 95th pct bytes_sent_10min, common dest_ports, normal failure_rate\n\
      FOR processes with preceding removable read:\n  IF bytes_sent_10min > p95 OR dest_port IN rare_ports\n\
      \     OR failure_rate(blocked/NXDOMAIN/4xx) > baseline_spike\n  => ALERT 'anomalous post-read network\
      \ behavior' (exclude known periodic services)"
- question: Do processes that read from removable media exhibit periodic, beacon-like outbound connection
    timing (regular inter-arrival deltas)?
  context: 'Courier implants often beacon on a schedule to fetch commands or exfiltrate. Build a time-series
    of connection inter-arrival deltas for processes that read from removable media, then apply FFT/autocorrelation
    regularity analysis and Bowley-skewness scoring to detect strong periodic signals indicative of beaconing.
    For Command and Control through removable media, regular timing combined with a removable-read provenance
    is a strong indicator of an automated relay. Highly regular, low-jitter intervals score as positives;
    bursty, human-driven traffic does not. This catches low-and-slow channels that volume thresholds miss.
    References: [RITA, Active Countermeasures](https://github.com/activecm/rita).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet-connected workstations with USB access, network egress points (firewalls, proxies),
    and DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "FOR processes that read from removable media:\n  deltas = inter_arrival_times(outbound_conns)\n\
      \  score = FFT_autocorrelation_regularity(deltas); skew = bowley_skewness(deltas)\n  IF score >\
      \ regularity_threshold AND low_jitter:\n    ALERT 'periodic beaconing after removable read'"
- question: Does the cross-host chain of drive-mount -> removable-read -> process-execution -> outbound-connection
    form a rare causal relay path when represented as a provenance graph?
  context: 'The full courier model is a multi-step causal chain spanning hosts. Represent it as a whole-system
    provenance subgraph (drive mount -> removable read -> process execution -> outbound connection) and
    score edges with a temporal graph-neural-network autoencoder, emitting an analyst-readable attack-summary
    graph that names the contributing nodes. Alternatively, isolate rare causal relay paths using IDF
    path-rarity combined with Local Outlier Factor. For Command and Control through removable media, this
    reconstructs and surfaces the entire relay chain rather than isolated events, giving analysts the
    provenance needed to confirm and scope an incident. A common, frequently-seen path is benign; a rare
    causal path is the positive. References: [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf);
    [ProvDetector, Wang et al.](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Internet-connected workstations with USB access, network egress points (firewalls, proxies),
    and DNS servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph = build_provenance(drive_mount -> removable_read -> process_exec -> outbound_conn)\n\
      gnn = TemporalGNN_Autoencoder; edge_scores = gnn.score(graph)\nOR path_rarity = IDF(path) + LOF(path_embedding)\n\
      IF rare_causal_relay_path:\n  ALERT attack_summary_graph(contributing_nodes)"
- question: Does a single process perform mass file reads from local user/system directories (more than
    500 unique reads in 5 minutes) and then write a compressed/archive file to a removable drive within
    the next 5 minutes?
  context: 'This collect-then-archive-then-USB sequence is exactly USBCulprit''s staging routine: harvest
    local files, compress them, and drop a single archive onto removable media for courier exfiltration.
    Track Windows EID 4663 reads per process and trigger when one process exceeds >500 unique reads in
    5 minutes, then alert if it is followed within 5 minutes by a Sysmon EID 11 write of an archive/compressed
    file to a removable volume. For Command and Control through removable media, this two-step pattern
    strongly indicates staging for relay. Routine usage rarely combines mass reads with an immediate single
    archive write to USB, so the false-positive rate is low. References: [Cycldek: Bridging the (air)
    gap, Kaspersky](https://securelist.com/cycldek-bridging-the-air-gap/97157/).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - auditd:SYSCALL
  - 'NAI: File servers, database servers, user workstations with sensitive data, and developer workstations
    with source-code access.'
  range: Last 90 days (correlate mass reads and archive write within a 5-minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "reads = WinEvent EID=4663 AccessMask=ReadData grouped by process over 5min\nIF unique_read_count\
      \ > 500:\n  THEN look for Sysmon EID=11 WHERE target_path IN removable_drive_path AND extension\
      \ IN archive_types\n       AND write.time - read_window.end <= 5min\n  => ALERT 'mass read then\
      \ archive-to-USB staging'"
- question: For files staged to removable media, is the filename Shannon entropy above the 98th percentile,
    or does a single write consolidate a disproportionate volume of recently-read bytes?
  context: 'Archived/encrypted staging files often have high-entropy (random-looking) names and consolidate
    large amounts of previously-read data into one write. Compute filename Shannon entropy and the Volume
    ratio (removable-write bytes vs. bytes read in the preceding window) for staged writes, maintain a
    baseline, and flag entropy above the 98th percentile or a single write that consolidates a disproportionate
    read volume. In Command and Control via removable media, this catches the compressed exfil archive
    even when the read-count rule does not fire. High filename entropy plus a high consolidation ratio
    is the positive; normal document writes have low entropy and modest ratios. References: [Finding Anomalies
    in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - auditd:SYSCALL
  - 'NAI: File servers, database servers, user workstations with sensitive data, and developer workstations
    with source-code access.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR staged removable writes:\n  ent = shannon_entropy(filename)\n  ratio = removable_write_bytes\
      \ / bytes_read_preceding_window\n  IF ent > 98th_percentile OR ratio > consolidation_threshold:\n\
      \    ALERT 'high-entropy/consolidated staging write'"
- question: Does an autoencoder trained on normal per-process behavior produce high reconstruction error
    for mass-read-plus-single-write chains, and is the staging subgraph a rare causal path?
  context: 'Model normal per-process behavior and let deviations surface staging. Encode per-process activity
    (local reads, removable writes, bytes, network) into vectors and train an online autoencoder on normal
    behavior; alert when reconstruction error spikes for mass-read+single-write chains. Complement this
    with rare-causal-path scoring of the collection-to-staging provenance subgraph, surfacing the top
    contributing path for triage. For Command and Control through removable media, this detects collection-and-staging
    behavior that does not match any fixed threshold. A high reconstruction error or a rare causal path
    is the positive; routine activity reconstructs cleanly and follows common paths. References: [Kitsune,
    Mirsky et al.](https://arxiv.org/abs/1802.09089); [ProvDetector, Wang et al.](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - auditd:SYSCALL
  - 'NAI: File servers, database servers, user workstations with sensitive data, and developer workstations
    with source-code access.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "vec = per_process[local_reads, removable_writes, bytes, network]\nae = OnlineAutoencoder.train(normal_behavior)\n\
      IF reconstruction_error(vec) > threshold (esp. mass_read+single_write):\n  ALERT\nALSO rare_causal_path_score(collection_to_staging_subgraph)\
      \ -> surface top path"
- question: Is a process executing from an image path that resides on a removable drive, particularly
    when the binary is unsigned or spawned by an unusual parent such as svchost.exe or explorer.exe via
    autorun/LNK?
  context: 'Direct execution from removable media is Stuxnet''s autorun/LNK propagation and relay primitive.
    Monitor Sysmon EID 1 / Windows EID 4688 for processes whose Image resides on a removable-drive path
    and raise severity when the binary is unsigned or lacks trusted-hash attribution. Autorun/LNK launches
    frequently appear with parents like explorer.exe or svchost.exe. For Command and Control through removable
    media, code running from USB is the mechanism by which relayed commands are executed on the receiving
    host. An unsigned removable-path executable with an anomalous parent is a strong positive; signed,
    allow-listed removable tools are benign. References: [W32.Stuxnet Dossier, Symantec](https://docs.broadcom.com/doc/security-response-w32-stuxnet-dossier-11-en).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4663
  - auditd:SYSCALL
  - 'NAI: All endpoint devices, particularly those used by privileged users or in physically unsecured
    areas.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "exec = (Sysmon EID=1) OR (WinEvent EID=4688)\nIF image_path IN removable_drive_path:\n  sev\
      \ = high IF (unsigned OR hash NOT IN trusted) ELSE medium\n  boost IF parent_image IN ['svchost.exe','explorer.exe']\
      \ via autorun/LNK\n  => ALERT 'process executed from removable drive'"
- question: When a process executes from a removable path, does it appear with a novel or rare parent
    process (fewer than 5 prior occurrences over a 90-day baseline)?
  context: 'Parent-child relationships are stable in normal operations, so a removable-path process launched
    by a rarely-seen parent is suspicious. Baseline parent-child process relationships over 90 days and
    alert when a removable-path process appears with a novel or rare parent (<5 prior occurrences). For
    Command and Control through removable media, an implant executing from USB often inherits an unusual
    parent (autorun handler, abused service) that has never legitimately launched that image. Validate
    frequency baselines against real enterprise process telemetry. A rare/novel parent is the positive;
