name: 'T1092: Communication Through Removable Media'
id: 1cbab6bd-b64f-49f8-be75-4c373510673b
description: Investigate potential adversary command and control conducted through removable media, where
  commands, tools, and stolen data are relayed by USB or other removable drives between an air-gapped
  or isolated host and an internet-connected courier host. This playbook helps an analyst detect the staging
  of known-bad or hidden/system-attributed files on removable volumes, execution of binaries directly
  from removable drives, high-risk executables written by abnormal parent processes, the read-then-egress
  courier pattern where a process reads from removable media and immediately initiates outbound connections,
  and the mass-collect-then-archive-to-USB staging routine characteristic of implants such as USBStealer,
  USBCulprit, and Stuxnet. It combines threat-intelligence matching, statistical baselining of volume/frequency/parent-child
  rarity, and machine-learning scoring across Windows, Linux, and macOS endpoint telemetry as well as
  network logs.
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
