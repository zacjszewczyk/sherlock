name: 'T1499: Endpoint Denial of Service'
id: 3587dfed-9a66-4dc2-bce4-9b1f6e4b92f0
description: 'This playbook helps an analyst investigate Endpoint Denial of Service (T1499), in which
  an adversary degrades or blocks the availability of a hosted service (websites, email, DNS, databases,
  web apps) by exhausting the resources of the system the service runs on or by driving it into a persistent
  crash condition, as part of the Impact tactic. It guides the hunt across complementary angles spanning
  Windows, Linux, macOS, container, and IaaS endpoints: a high volume of inbound connections to a single
  service from CTI-flagged botnet/stresser source IPs; execution of known DoS tooling (LOIC, HOIC, hping3,
  Slowloris, GoldenEye, slowhttptest) or low-and-slow connection patterns that hold worker threads with
  minimal data transfer; sustained CPU/memory/disk-I/O saturation on critical hosts that correlates in
  time with a specific process or an inbound connection surge; anomalous spikes in application/service
  crash and unexpected-termination events (Windows Event IDs 1000/7031/7034, Linux OOM-killer, kernel
  panics, systemd unit failures, Kubernetes CrashLoopBackOff/OOMKilled); and sustained anomalous request
  rates with abnormal source-IP distributions against load balancers, web servers, API gateways, and DNS.
  Detection methods combine symbolic-logic correlation rules, statistical baselining/change-point/entropy
  scoring, and machine-learning models (Random Forest/LUCID, LSTM/autoencoder ensembles, VAR, Isolation
  Forest, DeepLog, Seasonal Hybrid ESD, DBSCAN) applied to Zeek conn/http/dns logs, Windows Event and
  Sysmon telemetry, auditd/syslog/journald, CloudWatch/CloudTrail/VPC flow logs, and Kubernetes/Docker
  events, so the analyst can distinguish flood-driven and crash-driven DoS from legitimate load spikes
  and pivot to the responsible source IPs, processes, and degraded services.'
type: technique
related:
- tactic_id: TA0040
  tactic_name: Impact
