questions:
- question: '[Impact] Threat feed DoS correlation: Can you determine whether a high volume of inbound
    connections to a single endpoint service from source IP addresses that are present on a threat intelligence
    feed for known botnets or DoS-for-hire services. -- specifically, using the ''Threat feed DoS correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary degrades or blocks service
    availability by saturating endpoint resources or forcing a persistent crash condition, leaving traces
    in network-flow, process-execution, resource-utilization, and service-crash telemetry. This evidence
    focuses on the condition that a high volume of inbound connections to a single endpoint service from
    source IP addresses that are present on a threat intelligence feed for known botnets or DoS-for-hire
    services. This Symbolic Logic approach looks for the following signal: Correlate Zeek conn.log id.orig_h
    with CTI feeds tagged botnet/DDoS/stresser, filter for critical service ports (80/443/53/22/3389),
    and raise enriched alerts listing connection counts, total/avg bytes (Volume), and the conn_state
    breakdown. Treat a high proportion of half-open/rejected states (S0/REJ) with no completed handshakes
    as corroborating evidence of flood rather than legitimate clients [Cumulative Sum Algorithm for Detecting
    SYN Flooding Attacks](https://arxiv.org/abs/1212.5129). A positive result -- a rule match, statistical
    outlier, or model alert -- suggests a service is being deliberately overwhelmed or crashed rather
    than experiencing organic load, so pivot to the implicated source IPs/subnets, the responsible process
    and its lineage, the affected service and host, and the correlated resource or crash events to scope
    impact and confirm intent. A negative result helps rule out this DoS vector but should be corroborated
    with the other questions in this playbook, since a single method can miss distributed, low-and-slow,
    or crash-loop DoS that only emerges across multiple signals.'
  answer_sources: &id001
  - Zeek conn.log
  - 'NAI: Perimeter firewalls, Public-facing web servers, External DNS servers, API Gateways, Load Balancers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat feed DoS correlation

      source IN [Zeek conn.log]

      | WHERE matches_action_criteria("Threat feed DoS correlation")

      // Correlate Zeek conn.log id.orig_h with CTI feeds tagged botnet/DDoS/stresser, filter for critical
      service ports (80/443/

      | ALERT enrich(service, host, source_ips, process, conn_state)'
  - technology: Zeek/pseudocode
    query: '# DoS network correlation

      conn.log, http.log, dns.log

      | AGG per (id.resp_h, service, 1min): conn_rate, orig/resp_bytes, conn_state ratios, src-IP entropy,
      5xx/SERVFAIL ratio

      | COMPARE to per-service baseline + CTI/botnet source enrichment

      | flag saturation/low-and-slow/flood patterns per action criteria'
- question: '[Impact] Connection rate percentile escalation: Can you determine whether a high volume of
    inbound connections to a single endpoint service from source IP addresses that are present on a threat
    intelligence feed for known botnets or DoS-for-hire services. -- specifically, using the ''Connection
    rate percentile escalation'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Impact tactic (TA0040), an adversary degrades or blocks service
    availability by saturating endpoint resources or forcing a persistent crash condition, leaving traces
    in network-flow, process-execution, resource-utilization, and service-crash telemetry. This evidence
    focuses on the condition that a high volume of inbound connections to a single endpoint service from
    source IP addresses that are present on a threat intelligence feed for known botnets or DoS-for-hire
    services. This Statistical Method approach looks for the following signal: Compute sliding 1-minute
    connection rates per service and compare to the 95th percentile per-service baseline; escalate to
    critical when rate exceeds baseline and connections >100 within five minutes (Frequency). Add a non-parametric
    CUSUM change-point test on the rate series to catch gradual ramp-ups that never trip a single-window
    threshold; derive baselines per service over >=30 days excluding maintenance windows [A Survey of
    Methods for Time Series Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a service is being
    deliberately overwhelmed or crashed rather than experiencing organic load, so pivot to the implicated
    source IPs/subnets, the responsible process and its lineage, the affected service and host, and the
    correlated resource or crash events to scope impact and confirm intent. A negative result helps rule
    out this DoS vector but should be corroborated with the other questions in this playbook, since a
    single method can miss distributed, low-and-slow, or crash-loop DoS that only emerges across multiple
    signals.'
