name: 'T1588: Obtain Capabilities'
id: f8395ae5-64e6-49da-8d30-d5cb6e2404b8
description: 'This playbook helps an analyst investigate whether an adversary is obtaining capabilities
  to support their operation (MITRE ATT&CK T1588, Obtain Capabilities) under the Resource Development
  tactic, by purchasing, freely downloading, or stealing malware, software and licenses, exploits, code-signing/SSL-TLS
  certificates, and vulnerability information rather than developing them in-house. Because much of the
  acquisition itself occurs outside the target''s visibility, this hunt focuses on the observable downstream
  artifacts that obtained tooling leaves behind across network and endpoint telemetry. It pursues the
  behavior from several complementary angles: outbound connections to threat-intelligence watchlisted
  malware distribution points, exploit-kit C2, or tool repositories (with JA3/JA3S and JA4/JA4X TLS fingerprinting
  of fixed offensive-framework stacks); per-host failure-signal profiling (NXDOMAIN, HTTP 403/404/407,
  TLS handshake failures, blocked egress) that betrays staging against takedown-churned infrastructure;
  entropy, MIME-rarity, and volume scoring of downloaded files; host outbound-transfer forecasting; process-creation
  IOC, command-line regex, and image-hash matching against MaaS and cracked frameworks (e.g., Cobalt Strike,
  Metasploit); Cobalt Strike default named-pipe detection; parent-child rarity and frequency analysis;
  SSL/TLS certificate indicator matching (default C2 serials, issuers, subjects), Malleable C2 profile/handshake
  signatures, typosquatting and brief-validity certificate scoring, and certificate anomaly clustering;
  and correlated download-execute-beacon chains with jitter/size/frequency beacon analysis. Detection
  methods combine deterministic symbolic-logic rules (IOC watchlists, JA3/JA4 and JA4X fingerprinting,
  command-line and certificate regex, named-pipe matching, correlated sequence rules) as the floor, statistical
  baselining (entropy, MIME and validity percentiles, parent-child prevalence, beacon coefficient-of-variation/Bowley-skewness/FFT
  cadence, failure-rate profiling), and machine learning (ARIMA/Prophet transfer forecasting, random-forest/gradient-boosting
  process classifiers, DBSCAN/isolation-forest certificate clustering, HMM/LSTM/transformer sequence and
  high-jitter beacon models) with explainable top-3 feature attribution, applied across Zeek conn/dns/files/http/ssl/x509
  logs and Windows Security 4688 / Sysmon events, so an analyst can corroborate suspected use of obtained
  capabilities.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: '[Resource Development] Can you determine whether an internal host established an outbound
    connection whose destination IP, requested domain, transferred file hash, or TLS client fingerprint
    (JA3/JA4/JA4X) matches a high-confidence threat-intelligence watchlist of known malware distribution
    points, exploit-kit C2, or offensive-tool repositories -- using continuous IOC and TLS-fingerprint
    correlation across Zeek conn.log, dns.log, files.log, and ssl.log?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary obtains capabilities
    (malware, exploits, tooling) by retrieving them from third-party distribution points, criminal marketplaces,
    or tool repositories; the resulting download or callback often touches infrastructure already catalogued
    in threat intelligence. This Symbolic Logic approach maintains a watchlist of high-confidence malicious
    IPs, domains, and file hashes from validated feeds (abuse.ch SSLBL/URLhaus, MalwareBazaar) and continuously
    joins Zeek conn.log, dns.log, and files.log against it, enriching every hit with host and user context.
    It adds deterministic JA3/JA3S and version-resilient JA4/JA4X TLS fingerprint matching against known
    malware and offensive-framework fingerprints, because obtained commodity tooling ships a fixed TLS
    stack that remains detectable even when the certificate and SNI look benign. A positive result --
    an IOC or fingerprint match -- indicates probable retrieval or use of an obtained capability; pivot
    to the host, the responsible process, the user, the destination reputation, and any downloaded file.
    A negative result helps rule out known-bad infrastructure but should be corroborated with the statistical
    and ML methods below, since fresh or untracked infrastructure will not appear on any feed.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internet gateways, egress firewalls, corporate DNS resolvers, and web proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      watch_ip, watch_dom, watch_hash, watch_ja3, watch_ja4 = load_threat_intel()
      conn = Zeek.conn.log; dns = Zeek.dns.log; files = Zeek.files.log; ssl = Zeek.ssl.log
      alerts = conn[conn.id_resp_h in watch_ip]
            + dns[dns.query in watch_dom]
            + files[files.sha256 in watch_hash]
            + ssl[(ssl.ja3 in watch_ja3) or (ssl.ja3s in watch_ja3) or (ssl.ja4 in watch_ja4)]
      enrich(alerts, with=[host, user, dest_reputation]); emit(alerts)
- question: '[Resource Development] Can you identify a single internal host generating an abnormal burst
    of failure signals -- DNS NXDOMAIN responses, HTTP 403/404/407 errors, TLS handshake failures, and
    blocked/denied egress connections -- toward newly seen or low-reputation infrastructure within a rolling
    one-hour window, indicating staging or retrieval against takedown-churned malware distribution points?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), infrastructure that hosts
    obtained capabilities is frequently taken down and re-stood-up, so a host attempting to retrieve tooling
    often probes many dead or blocked endpoints before succeeding. Per Principle 5, this Symbolic Logic
    approach profiles per-host failure signals as a distinct detector: it counts DNS NXDOMAIN responses
    (Zeek dns.log rcode), HTTP 403/404/407 and TLS handshake failures (Zeek http.log/ssl.log), and blocked
    or denied egress connections (firewall logs) in rolling one-hour windows, then alerts when a single
    host exceeds a baseline-derived threshold (for example, >50 NXDOMAIN/hr or >30 blocked conns/hr) directed
    at newly seen or low-reputation infrastructure. A positive result is a hallmark of capability staging
    or retrieval; pivot to the destinations the host eventually reached successfully and the responsible
    process. A negative result reduces the likelihood of noisy retrieval activity but will not catch a
    single clean download to known-good-looking infrastructure.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internet gateways, egress firewalls, corporate DNS resolvers, and web proxies'
  range: Last 90 days; evaluate in rolling 1-hour windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      window = 1h
      per host:
        nxdomain = count(dns.log where rcode == 'NXDOMAIN')
        http_err = count(http.log where status_code in [403,404,407])
        tls_fail = count(ssl.log where handshake_failed)
        blocked  = count(firewall where action in ['deny','block'])
      baseline = rolling_30d_threshold(per_host)
      alert if (nxdomain > max(50, baseline.nx)) or (blocked > max(30, baseline.blk))
              and dest_reputation in ['new','low']
- question: '[Resource Development] For files downloaded by internal hosts, can you flag those whose filename
    Shannon entropy exceeds the 99th percentile of the enterprise distribution, whose MIME type sits in
    the bottom 5% of prevalence (e.g., application/x-dosexec), and whose transferred byte count or download-to-upload
    ratio exceeds the per-host 99th percentile -- surfacing combined anomalies that suggest acquisition
    of an obtained capability?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), obtained malware and tooling
    often arrives as rare executable content with machine-generated or packed filenames and unusual transfer
    volumes relative to a host''s norm. This Statistical Method computes, for every downloaded file in
    Zeek files.log, the Shannon entropy of the filename and flags scores above the 99th percentile of
    the enterprise distribution; checks the MIME type against the bottom 5% of prevalence (e.g., application/x-dosexec);
    and adds Volume metrics (Principle 2) by flagging transferred byte counts and download-to-upload ratio
    above the per-host 99th percentile. Percentiles are tuned per data set from a 30-day baseline and
    combined anomalies are surfaced for triage. A positive result -- a download that is simultaneously
    high-entropy, rare-MIME, and high-volume -- warrants investigation of the file and the receiving process.
    A negative result lowers suspicion of bulk or executable retrieval but will not catch small, common-MIME
    payloads.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internet gateways, egress firewalls, corporate DNS resolvers, and web proxies'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      files = Zeek.files.log
      ent_p99 = percentile(shannon(files.filename), 99)
      mime_rare = bottom_prevalence(files.mime_type, 5%)
      per host: vol_p99 = percentile(files.total_bytes, 99); ratio_p99 = percentile(down/up, 99)
      alert if shannon(f.filename) > ent_p99
              and f.mime_type in mime_rare
              and (f.total_bytes > vol_p99 or f.down_up_ratio > ratio_p99)
- question: '[Resource Development] Can you forecast each host''s expected outbound byte volume from history
    and alert when a host''s daily transfer exceeds three standard deviations (z-score) of the forecast
    while it is communicating with a low-reputation or newly seen external endpoint, indicating capability-staging
    activity?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), retrieving obtained capabilities
    can drive a host''s outbound (and total) transfer well above its normal pattern, especially toward
    fresh or low-reputation infrastructure. This Machine Learning approach trains ARIMA or Prophet models
    on historical bytes-per-host from Zeek conn.log, enriched with destination reputation, computes real-time
    z-scores for daily volumes, and alerts when a host exceeds three standard deviations while talking
    to a low-reputation or newly seen external endpoint. Per Principle 4, the alert text surfaces the
    top-3 contributing features (e.g., bytes-out z-score, destination newness, MIME rarity), building
    on explainable-attribution practice to highlight staging activity. A positive result flags a host
    whose transfer behavior broke from forecast in a suspicious direction; corroborate with the IOC, entropy,
    and failure-signal methods. A negative result indicates transfer volumes within forecast but will
    not catch low-and-slow retrieval below the model''s sensitivity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek files.log
  - 'NAI: Internet gateways, egress firewalls, corporate DNS resolvers, and web proxies'
  range: Last 90 days; train on >=60 days history, score daily
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      model = ARIMA_or_Prophet(train = per_host_daily_bytes_out[60d], exog = dest_reputation)
      for each host, day:
        forecast, sigma = model.predict(host, day)
        z = (actual_bytes_out - forecast) / sigma
        if z > 3 and dest_reputation in ['new','low']:
          alert(top3_features=[bytes_out_z, dest_newness, mime_rarity])
- question: '[Resource Development] Can you detect a process-creation event whose command line matches
    signatures of obtained tooling (e.g., `powershell -enc`, `certutil -urlcache`, `rundll32` with network
    arguments) or whose image hash matches a curated feed of MaaS/cracked-framework binaries, using Windows
    Event ID 4688 and Sysmon Event ID 1?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary frequently
    executes capabilities they obtained rather than built, and these tools have recognizable command-line
    patterns and known image hashes. This Symbolic Logic approach scans process-creation events (Windows
    Event ID 4688 and Sysmon Event ID 1) for command lines matching regexes tied to obtained tooling (`powershell
    -enc`, `certutil -urlcache`, `rundll32` with network args), correlates Sysmon image hashes against
    a curated feed of MaaS/cracked-framework binaries (e.g., EMBER2024 PE baselines), and alerts with
    host and user context. A positive result -- a regex or hash match -- is high-fidelity evidence of
    obtained-tool execution; pivot to the parent process, user, and subsequent network activity. A negative
    result reduces suspicion of known tooling but will not catch renamed, recompiled, or obfuscated variants,
    so pair it with the statistical and ML methods below.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain Controllers, user workstations, and application servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      proc = events(4688) + Sysmon(1)
      cli_re = ['powershell.*-enc', 'certutil.*-urlcache', 'rundll32.*(http|\\\\)']
      alert if regex_any(proc.command_line, cli_re)
              or proc.image_sha256 in maas_cracked_hash_feed
      enrich(host, user, parent_image)
- question: '[Resource Development] Can you match Sysmon named-pipe events (Event ID 17 pipe created /
    18 pipe connected) against Cobalt Strike default post-exploitation pipe patterns (\msagent_##, \status_##,
    \postex_####, \MSSE-####, \windows.####), giving high-fidelity host detection of obtained Cobalt Strike
    independent of network evasion?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), cracked or otherwise obtained
    Cobalt Strike commonly retains its default configuration, including the named pipes its post-exploitation
    modules create. This Symbolic Logic approach matches Sysmon Event ID 17/18 (pipe created/connected)
    against the default Cobalt Strike pipe patterns (\msagent_##, \status_##, \postex_####, \MSSE-####,
    \windows.####). Because these defaults persist in obtained copies, a match provides high-fidelity
    host detection that is independent of network-level evasion such as malleable profiles or domain fronting.
    A positive result strongly suggests Cobalt Strike beacon activity on the host; isolate and pivot to
    the owning process and its lineage. A negative result does not rule out a customized build that renames
    its pipes, so corroborate with command-line, hash, and network detections.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain Controllers, user workstations, and application servers'
  range: Last 90 days
  queries:
  - technology: Sysmon/Rule pseudocode
    query: |-
      pipes = Sysmon(17) + Sysmon(18)
      cs_re = ['\\msagent_..', '\\status_..', '\\postex_....', '\\MSSE-....', '\\windows\\..']
      alert if regex_any(pipes.PipeName, cs_re)
      enrich(host, process_image, ProcessGuid)
- question: '[Resource Development] Can you flag rare parent-child process pairings (e.g., a new child
    below a 1% environment-wide occurrence threshold for parents like winword.exe, powershell.exe, outlook.exe)
    and abnormally high child-spawn rates from a single parent (above its per-host 99th percentile), while
    profiling process-launch failures as a distinct signal?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), obtained tooling is often
    launched through unusual process lineages -- an Office or browser process spawning a shell or LOLBin
    -- and may spawn children at abnormal rates during deployment. This Statistical Method aggregates
    child processes per common parent (winword.exe, powershell.exe, outlook.exe), computes prevalence
    across the environment, and flags new pairings below a 1% occurrence threshold. It adds Frequency
    state (Principle 2) by alerting when a single parent spawns children above its per-host 99th percentile
    (e.g., >N/min) and profiles process-launch failures and exit-with-error codes as a distinct signal
    (Principle 5). A positive result -- a rare lineage or a spawn-rate spike -- merits review of the child''s
    command line and hash. A negative result indicates normal lineage but will not catch obtained tools
    that masquerade under common, well-established parent-child relationships.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain Controllers, user workstations, and application servers'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      pairs = group(proc, by=[parent_image, child_image])
      prevalence = count(pairs)/total_proc
      alert if prevalence < 0.01 and parent_image in [winword.exe, powershell.exe, outlook.exe]
      per host,parent: rate = children_per_min
      alert if rate > percentile(rate, 99)
      profile(launch_failures, nonzero_exit) as distinct_signal
- question: '[Resource Development] Can a supervised classifier (random forest or gradient boosting) trained
    on command-line length/entropy, parent process, process path, and executable-hash features score process-creation
    events as likely obtained-tool execution, with deterministic IOC/regex rules kept as the floor and
    the top-3 contributing features emitted per alert?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), obtained tools evade simple
    signatures through renaming and obfuscation, so a learned model can generalize across variants. This
    Machine Learning approach trains a random forest or gradient-boosting classifier on labeled process-creation
    events using command-line length/entropy, parent process, process path, and executable hash features
    (e.g., Mal-API-2019); for dynamic execution it can be complemented with early API-sequence classifiers
    (EarlyMalDetect) that predict malicious intent from the first calls. Per Principle 1, the deterministic
    IOC/regex rules above remain the floor, and per Principle 4 the model emits the top-3 contributing
    features in each alert. A positive result flags a probable obtained-tool execution for analyst review
    with its driving features; a negative result indicates the event resembles benign activity but should
    be corroborated by the symbolic-logic detections, since novel tradecraft can fall outside the training
    distribution.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: Domain Controllers, user workstations, and application servers'
  range: Last 90 days; retrain periodically on labeled data
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      feats = [cli_len, cli_entropy, parent_image, process_path, image_sha256]
      model = RandomForest_or_GBM(train=labeled_proc_events)
      score = model.predict_proba(proc, feats)
      alert if score > threshold OR ioc_regex_floor_hit(proc)
      emit(top3_features = model.explain(proc))
- question: '[Resource Development] Can you query Zeek ssl.log and x509.log for issuer strings, subjects,
    or serial numbers matching default configurations of obtained C2 frameworks (e.g., the Cobalt Strike
    default certificate, serial 146473198) and correlate JA3S server and JA4X certificate fingerprints
    against threat intelligence to alert on hits?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), adversaries who obtain a
    C2 framework frequently deploy it with its default SSL/TLS certificate, which carries recognizable
    issuer, subject, and serial-number values. This Symbolic Logic approach queries Zeek ssl.log and x509.log
    for those default configuration artifacts (e.g., Cobalt Strike default certificate serial 146473198),
    correlates JA3S server fingerprints and JA4X certificate fingerprints against threat intelligence,
    and alerts on hits. A positive result -- a default-certificate or fingerprint match -- is strong evidence
    of an obtained C2 framework in use; pivot to the internal host(s) communicating with that server and
    the surrounding session. A negative result reduces suspicion of default-configured frameworks but
    will not catch operators who replaced the default certificate, so pair it with the statistical and
    ML certificate methods.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Internet gateways, encrypted traffic inspection points (e.g., SSL/TLS offloading proxies), internal
    Certificate Authorities, and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: |-
      ssl = Zeek.ssl.log; x509 = Zeek.x509.log
      alert if x509.serial in default_c2_serials  # e.g., 146473198
              or x509.issuer in c2_default_issuers
              or x509.subject in c2_default_subjects
              or ssl.ja3s in ti_ja3s or x509_ja4x in ti_ja4x
      enrich(internal_host, dest, session)
- question: '[Resource Development] Can you apply regex signatures for default or customized Malleable
    C2 profile artifacts -- URI paths, HTTP header order, User-Agent strings, and default ports 50050/8080
    -- against Zeek http.log/ssl.log to catch obtained tooling that reuses default profiles?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), obtained C2 frameworks often
    ship with or reuse well-known Malleable C2 profiles whose request structure is documented. This Symbolic
    Logic approach applies regex signatures for default and customized Malleable C2 profile artifacts
    (URI paths, header order, User-Agent, default ports 50050/8080) against Zeek http.log/ssl.log to identify
    reuse of those profiles. A positive result -- traffic matching a known profile -- indicates probable
    obtained-framework C2; correlate with the certificate and named-pipe detections and pivot to the host.
    A negative result lowers suspicion of default-profile C2 but will not catch heavily customized or
    non-HTTP profiles, so corroborate with beaconing and certificate-anomaly methods.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Internet gateways, encrypted traffic inspection points (e.g., SSL/TLS offloading proxies), internal
    Certificate Authorities, and DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: |-
      http = Zeek.http.log; ssl = Zeek.ssl.log
      prof_uri = [known_malleable_uri_regex...]
      alert if regex_any(http.uri, prof_uri)
              or http.header_order in known_profile_orders
              or http.user_agent in known_profile_uas
              or conn.id_resp_p in [50050, 8080] and matches_profile
- question: '[Resource Development] For each external certificate in x509.log, can you compute the Damerau-Levenshtein
    distance between its subject common name and a list of high-value domains (flagging distance 1-2 from
    unfamiliar issuers), alert on certificates from non-standard CAs with validity below 30 days, and
    profile certificate-validation failure rates per host?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), obtained or adversary-generated
    certificates frequently impersonate legitimate services via typosquatting and are issued with short
    validity windows from non-standard CAs. This Statistical Method computes, for each external certificate
    in x509.log, the Damerau-Levenshtein distance between the subject common name and a list of high-value
    domains, flags distance 1-2 from unfamiliar issuers, and alerts on certificates from non-standard
    CAs with validity below 30 days (lower percentile). It also profiles certificate-validation failure
    rates (TLS handshake/verify errors per host) as a distinct signal (Principle 5), with thresholds tuned
    from a 30-day baseline. A positive result -- a near-miss subject name, a short-lived non-standard
    certificate, or a host with abnormal validation failures -- warrants review of the destination and
    session. A negative result reduces suspicion of impersonation or throwaway certificates but will not
    catch certificates issued by reputable CAs for plausible names.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Internet gateways, encrypted traffic inspection points (e.g., SSL/TLS offloading proxies), internal
    Certificate Authorities, and DNS resolvers'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: |-
      x509 = Zeek.x509.log
      for cert in x509[external]:
        d = min(damerau_levenshtein(cert.subject_cn, hv) for hv in high_value_domains)
        alert if 1 <= d <= 2 and cert.issuer not in familiar_issuers
        alert if cert.issuer in nonstandard_cas and cert.validity_days < 30
      per host: profile(tls_verify_errors) as distinct_signal
- question: '[Resource Development] Can DBSCAN or isolation forest over certificate features (validity
    duration, public-key algorithm, key length, subject/issuer attributes, JA4X structure) isolate certificates
    that deviate from legitimate norms, surfacing the top-3 distinguishing features per flagged certificate
    for analyst review of campaign-specific certificate generation?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), adversaries who obtain tooling
    often auto-generate certificates with subtly anomalous parameter combinations that no single signature
    captures. This Machine Learning approach runs DBSCAN or isolation forest on certificate features (validity
    duration, public-key algorithm, key length, subject/issuer attributes, JA4X structure) to isolate
    clusters deviating from legitimate norms, and surfaces the top-3 distinguishing features per flagged
    certificate (Principle 4) drawing on explainability practice. A positive result -- an outlier certificate
    with explained features -- points to possible campaign-specific certificate generation; pivot to the
    hosts using it. A negative result indicates certificates within normal feature space but should be
    corroborated with the deterministic indicator and typosquatting methods, since a single well-crafted
    certificate can blend into the legitimate distribution.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Internet gateways, encrypted traffic inspection points (e.g., SSL/TLS offloading proxies), internal
    Certificate Authorities, and DNS resolvers'
  range: Last 90 days; baseline trailing 30 days
  queries:
  - technology: Zeek/ML pseudocode
    query: |-
      feats = [validity_days, pubkey_alg, key_len, subject_attrs, issuer_attrs, ja4x]
      model = DBSCAN_or_IsolationForest(fit=x509[external], feats)
      outliers = model.flag_anomalies(x509)
      for c in outliers: emit(cert=c, top3_features=model.explain(c))
- question: '[Resource Development] Can you alert when, for the same host within a 5-minute window, Zeek
    files.log records an externally downloaded executable (MIME application/x-dosexec), a Sysmon Event
    ID 1 shows a process launched from a temp/download directory matching that filename, and the same
    ProcessGUID then makes an outbound connection in Zeek conn.log to a non-corporate IP?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the canonical signature
    of using an obtained capability is a tight chain: retrieve the tool, run it from a user-writable directory,
    and have it call out. This Symbolic Logic approach alerts when, for the same host within a 5-minute
    window, Zeek files.log records an externally downloaded executable (MIME application/x-dosexec), a
    Sysmon Event ID 1 shows a process launched from a temp/download directory whose name matches the downloaded
    file, and that ProcessGUID generates an outbound connection in Zeek conn.log to a non-corporate IP.
    Per Principle 1 this deterministic chain is kept as the floor. A positive result is high-confidence
    evidence of obtained-capability execution and initial callback; isolate the host and scope the C2.
    A negative result means the full chain was not observed, but partial chains (download without execution,
    or execution without callback) should still be reviewed via the statistical and ML beacon methods.'
  answer_sources:
  - Zeek conn.log
  - Zeek files.log
  - Windows Event ID 4688
  - Windows Event ID 1 (Sysmon)
  - 'NAI: User workstations, public-facing web servers, and egress points to the internet'
  range: Last 90 days; correlate within 5-minute event windows
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      window = 5m; per host:
        dl = files.log where mime_type == 'application/x-dosexec' and source == external
        exec = Sysmon(1) where image_dir in [%PUBLIC%,%APPDATA%\\Local\\Temp,downloads]
                           and basename(image) == dl.filename
        beacon = conn.log where ProcessGuid == exec.ProcessGuid and id_resp_h not in corp_space
      alert if dl AND exec AND beacon within window
- question: '[Resource Development] For every outbound non-browser connection, can you compute the rolling
    coefficient of variation of inter-arrival time and byte size plus Bowley skewness per source-destination
    pair (flagging low-CV/high-count pairs as beacons), add FFT-based dominant-period detection with whitelisting,
    and profile the failed/blocked callback ratio as a distinct signal?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an obtained tool that successfully
    installs typically establishes periodic, low-volume C2 beaconing. This Statistical Method computes,
