  queries:
  - technology: SIEM/Stats pseudocode
    query: '| eval ent=shannon_entropy(CommandLine)

      | where process="powershell.exe" AND ent > pct99(ent)

      | append [ stats count by admin _time | change_point(mfa_cmdlet_count per admin) ]'
