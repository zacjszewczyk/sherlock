    used for MFA enforcement. Generate a high-priority alert whenever a member removal event (Windows
    Event IDs 4729, 4733, 4757) targets one of these groups, capturing subject and target accounts. State
    signal: correlate the removal with the target''s next successful logon (4624) and flag if it succeeds
    WITHOUT a corresponding MFA-challenge event (fail-open), the direct post-condition of MFA removal
    ([SigmaHQ](https://github.com/SigmaHQ/sigma); [CISA AA22-074A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-074a)).'
