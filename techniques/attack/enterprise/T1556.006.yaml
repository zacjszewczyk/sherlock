questions:
- question: Is a user account being removed from an Active Directory security group that enforces MFA
    (Windows Event IDs 4729, 4733, or 4757), and does that account's next successful logon (4624) then
    succeed without a corresponding MFA challenge?
  context: 'Maintain an authoritative list of the SIDs of the AD groups that drive MFA enforcement (e.g.,
    Conditional Access scoping groups). Generate a high-priority alert whenever a member-removal event
    (4729 global, 4733 local, 4757 universal) targets one of those groups, capturing both the subject
    (who made the change) and the target (whose MFA was lifted). The high-fidelity state signal is to
    then correlate that removal with the target''s next successful logon (4624) and flag it if the logon
    succeeds with no matching MFA-challenge event - the direct fail-open post-condition of MFA removal.
    A positive result is an account that lost MFA enforcement and then authenticated unchallenged. In
    the context of Defense Impairment, this matters because the adversary is actively degrading or disabling
    MFA so that defensive controls can no longer be trusted to enforce strong authentication; a positive
    finding here means a security mechanism has been weakened and subsequent authentications cannot be
    assumed to be MFA-protected. Source detail: Symbolic Logic: Maintain a list of critical Active Directory
    group SIDs used for MFA enforcement. Generate a high-priority alert whenever a member removal event
    (Windows Event IDs 4729, 4733, 4757) targets one of these groups, capturing subject and target accounts.
    State signal: correlate the removal with the target''s next successful logon (4624) and flag if it
    succeeds WITHOUT a corresponding MFA-challenge event (fail-open), the direct post-condition of MFA
    removal ([SigmaHQ](https://github.com/SigmaHQ/sigma); [CISA AA22-074A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-074a)).'
  answer_sources:
  - Windows Event ID 4729
  - Windows Event ID 4733
  - Windows Event ID 4757
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days; pivot to a tight event-centered window (registration/removal/policy-change time
    +/- 1 hour) for correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=wineventlog (EventCode=4729 OR EventCode=4733 OR EventCode=4757) TargetSid IN $MFA_GROUP_SIDS

      | table _time SubjectUserName TargetUserName GroupName EventCode

      | join TargetUserName [ search EventCode=4624 | where _time>removal_time AND _time<removal_time+86400
      AND mfa_challenge=false ]

      | alert priority=high'
- question: Is a specific administrator removing members from critical MFA-enforcing groups at a volume
    or frequency that is statistically far above that admin's own historical baseline or the peer-group
    norm?
  context: 'For each administrator, build a baseline of removals from critical MFA groups per week (volume)
    and per hour (frequency) over a 30-90 day window. Alert when activity exceeds 3 standard deviations
    above the admin''s own baseline or above the peer-group mean, or when a change-point algorithm (CUSUM/PELT)
    marks an abrupt step increase in group-modification volume. This catches a compromised or rogue admin
    account whose behavior suddenly diverges from how it normally operates; a positive result is a burst
    of MFA-group removals that breaks the established pattern. In the context of Defense Impairment, this
    matters because the adversary is actively degrading or disabling MFA so that defensive controls can
    no longer be trusted to enforce strong authentication; a positive finding here means a security mechanism
    has been weakened and subsequent authentications cannot be assumed to be MFA-protected. Source detail:
    Statistical Method: For each administrator establish a baseline of removals from critical MFA groups
    per week (Volume) and per hour (Frequency) over 30-90 days. Alert when activity exceeds 3 standard
    deviations above the admin''s own baseline or the peer-group mean, or when a change-point (CUSUM/PELT)
    marks an abrupt step increase in group-modification volume ([A Survey of Change Point Detection, Aminikhanghahi
    & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); [LANL Auth Dataset](https://csr.lanl.gov/data/auth/)).'
  answer_sources:
  - Windows Event ID 4729
  - Windows Event ID 4733
  - Windows Event ID 4757
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog (EventCode=4729 OR EventCode=4733 OR EventCode=4757) TargetSid IN $MFA_GROUP_SIDS

      | bin _time span=1h | stats count by SubjectUserName _time

      | eventstats avg(count) as mu stdev(count) as sd by SubjectUserName

      | where count > mu + 3*sd

      | append [ ... CUSUM/PELT change-point on weekly volume per SubjectUserName ]'
- question: Do MFA-group membership changes, when modeled as edges in a temporal identity graph, create
    improbable access edges or strip a privileged user out of an MFA security context in a way a temporal
    link-prediction model deems anomalous?
  context: 'Model users and groups as a temporal authentication/identity graph where memberships are edges,
    and use temporal link prediction (e.g., Euler) to flag membership changes that create improbable low-privilege-to-access
    edges or that remove a privileged user from an MFA security context. The alert must surface the top-3
    contributing features (group criticality, actor rarity, edge improbability) so an analyst can triage.
    A positive result is a structurally improbable membership change that a rule based on counts alone
    would miss. In the context of Defense Impairment, this matters because the adversary is actively degrading
    or disabling MFA so that defensive controls can no longer be trusted to enforce strong authentication;
    a positive finding here means a security mechanism has been weakened and subsequent authentications
    cannot be assumed to be MFA-protected. Source detail: Machine Learning: Model users and groups as
    a temporal authentication/identity graph (memberships as edges) and use temporal link prediction to
    flag membership changes that create improbable low-privilege-to-access edges or that strip a privileged
    user from an MFA security context. Alert text must surface the top-3 contributing features (e.g.,
    group criticality, actor rarity, edge improbability) ([Euler: Temporal Link Prediction, King & Huang](https://arxiv.org/abs/2009.05624);
    trained/evaluated on the [LANL Auth Dataset](https://csr.lanl.gov/data/auth/)).'
  answer_sources:
  - Windows Event ID 4729
  - Windows Event ID 4733
  - Windows Event ID 4757
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "build temporal_identity_graph(nodes=users+groups, edges=memberships, t)\nmodel = TemporalLinkPredictor(Euler).fit(history)\n\
      for change in membership_changes:\n  score = model.anomaly(change)\n  if score > threshold: alert(top3_features=[group_criticality,\
      \ actor_rarity, edge_improbability])"
- question: Was a new MFA device/method registered for a user (Entra ID 'registered security info' / Windows
    4738) and then followed within ~5 minutes by a successful login (4624) from a different country, or
    registered for a dormant/disabled account being reactivated?
  context: 'Correlate an MFA registration event with a subsequent successful login for the same user within
    a 5-minute window. Alert if the login source-IP country (from Zeek conn.log / sign-in geo) differs
    from the registration country, or if the registration is for a dormant or recently re-enabled account.
    Help-desk-initiated password/MFA resets immediately preceding a registration are a documented Scattered
    Spider hallmark. A positive result is the self-enrollment pattern adversaries use after credential
    theft to plant their own second factor. In the context of Defense Impairment, this matters because
    the adversary is actively degrading or disabling MFA so that defensive controls can no longer be trusted
    to enforce strong authentication; a positive finding here means a security mechanism has been weakened
    and subsequent authentications cannot be assumed to be MFA-protected. Source detail: Symbolic Logic:
    Correlate an MFA registration event (e.g., Entra ID ''User registered all required security info'',
    Windows 4738) with a subsequent successful login (4624) for the same user within 5 minutes. Alert
    if the login source-IP country (Zeek conn.log) differs from the registration country, or if the registration
    is for a dormant/disabled account being reactivated. Help-desk-initiated resets immediately preceding
    registration are a Scattered Spider hallmark ([CISA AA23-320A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a);
    [SigmaHQ](https://github.com/SigmaHQ/sigma)).'
  answer_sources:
  - Windows Event ID 4738
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - 'NAI: Identity Provider Servers, VPN Concentrators, Cloud Identity Platforms (e.g., Entra ID)'
  range: Last 90 days; pivot to a tight event-centered window (registration/removal/policy-change time
    +/- 1 hour) for correlation.
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventCode=4738 OR action="registered security info")

      | join user [ search EventCode=4624 | where _time>reg_time AND _time<reg_time+300 ]

      | where login_country!=reg_time_country OR account_state IN ("dormant","disabled","recently_enabled")

      | alert priority=high'
- question: After a new MFA registration, is the subsequent login coming from a country/ASN the user has
    never used in 90 days, or does the implied travel speed between consecutive logins exceed a physically
    plausible threshold (impossible travel)?
  context: 'Maintain a per-user profile of historical login countries and ASNs. After a new MFA registration,
    score the next login: flag locations unseen in 90 days or in the bottom 5th percentile of frequency.
    Add an impossible-travel check computing the implied speed between consecutive logons and alert above
    a physically implausible threshold. A positive result is a freshly enrolled factor immediately exercised
    from an anomalous location, indicating the registration was adversary-controlled. In the context of
    Defense Impairment, this matters because the adversary is actively degrading or disabling MFA so that
    defensive controls can no longer be trusted to enforce strong authentication; a positive finding here
    means a security mechanism has been weakened and subsequent authentications cannot be assumed to be
    MFA-protected. Source detail: Statistical Method: Maintain a per-user profile of historical login
    countries/ASNs. After a new MFA registration, score the subsequent login: flag locations unseen in
    90 days or in the bottom 5th percentile of frequency. Add an impossible-travel check computing implied
    speed between consecutive logons and alerting above a physically implausible threshold ([Impossible
    Travel Detection, Microsoft WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en);
    baselines from the [LANL Auth Dataset](https://csr.lanl.gov/data/auth/)).'
  answer_sources:
  - Windows Event ID 4738
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - 'NAI: Identity Provider Servers, VPN Concentrators, Cloud Identity Platforms (e.g., Entra ID)'
  range: Last 90 days; pivot to a tight event-centered window (registration/removal/policy-change time
    +/- 1 hour) for correlation.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "profile[user] = set(countries,ASNs over 90d)\nfor login after mfa_registration:\n  if login.country\
      \ not in profile[user] or freq_pct(login.location)<5: flag\n  speed = geo_dist(prev_login, login)/dt\n\
      \  if speed > MAX_PLAUSIBLE_KMH: flag impossible_travel"
- question: Does a user's authentication event sequence deviate from the learned normal order so that
    the chain 'MFA registration -> success from new ASN -> sensitive access' appears with low next-event
    probability?
  context: 'Train a per-user LSTM log-sequence model (DeepLog-style) on the normal order of events (login
    -> MFA challenge -> success -> activity). Flag the sequence ''MFA registration -> success from a new
    ASN -> sensitive access'' as a high-reconstruction-error / low next-event-probability anomaly, and
    report the ranked candidate events that were expected but missing for explainability. A positive result
    is a session whose ordering is improbable given the user''s history, pointing to attacker-driven enrollment-then-access.
    In the context of Defense Impairment, this matters because the adversary is actively degrading or
    disabling MFA so that defensive controls can no longer be trusted to enforce strong authentication;
    a positive finding here means a security mechanism has been weakened and subsequent authentications
    cannot be assumed to be MFA-protected. Source detail: Machine Learning: Train an LSTM log-sequence
    model per user on normal event order (login -> MFA challenge -> success -> activity). Flag the sequence
    ''MFA registration -> success from new ASN -> sensitive access'' as high reconstruction/low next-event
    probability, and report the ranked candidate events that were expected but missing for explainability
    ([DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf)).'
  answer_sources:
  - Windows Event ID 4738
  - Windows Event ID 4624
  - Zeek conn.log
  - azure:signinlogs
  - 'NAI: Identity Provider Servers, VPN Concentrators, Cloud Identity Platforms (e.g., Entra ID)'
  range: Last 90 days; pivot to a tight event-centered window (registration/removal/policy-change time
    +/- 1 hour) for correlation.
  queries:
  - technology: ML/pseudocode
    query: "model = DeepLog_LSTM.fit(per_user_event_sequences)\nfor seq in live_sessions:\n  p = model.next_event_prob(seq)\n\
      \  if p < threshold: alert(anomaly=seq, missing_expected=model.topk_expected(seq))"
- question: Is the Windows hosts file (C:\Windows\System32\drivers\etc\hosts) being modified by an unauthorized
    process - especially adding a line that maps an MFA/identity-provider domain to 127.0.0.1 or 0.0.0.0?
  context: 'Monitor file-write events (4663 / Sysmon 11) to ...\drivers\etc\hosts. Alert if the writing
    process is not an authorized installer/admin tool, or if 4688 shows echo/powershell/cmd editing the
    file. Highest fidelity is alerting when an added line maps an MFA or identity-provider domain to a
    loopback/null address - the exact CISA-documented fail-open technique that makes MFA calls fail so
    a fail-open policy grants access. A positive result is a hosts-file redirect of MFA infrastructure.
    In the context of Defense Impairment, this matters because the adversary is actively degrading or
    disabling MFA so that defensive controls can no longer be trusted to enforce strong authentication;
    a positive finding here means a security mechanism has been weakened and subsequent authentications
    cannot be assumed to be MFA-protected. Source detail: Symbolic Logic: Monitor file write events (4663
    / Sysmon 11) to ''...\drivers\etc\hosts''. Alert if the writing process is not an authorized installer/admin
    tool, or if 4688 shows ''echo''/''powershell''/''cmd'' editing the file. Highest fidelity: alert when
    an added line maps an MFA/identity-provider domain to 127.0.0.1 or 0.0.0.0 — the exact CISA-documented
    fail-open technique ([CISA AA22-074A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-074a);
    [SigmaHQ](https://github.com/SigmaHQ/sigma)).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Endpoints and Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventCode=4663 OR sysmon_id=11) TargetFilename="*\\drivers\\etc\\hosts"

      | where Process NOT IN $AUTHORIZED_INSTALLERS

      | eval mfa_redirect=match(added_line, "(mfa|duo|okta|auth|adfs).*(127\.0\.0\.1|0\.0\.0\.0)")

      | where Process IN ("cmd.exe","powershell.exe") OR mfa_redirect=1

      | alert priority=high'
- question: Does the endpoint's hosts file deviate from the approved corporate SHA256 baseline, or is
    the fleet-wide rate of hosts-file edits spiking above normal?
  context: 'Baseline an approved SHA256 of the corporate hosts file and alert on any deviation (state:
    changed vs approved). Track per-endpoint change frequency and alert above the enterprise 99th percentile,
    and apply change-point detection to flag an abrupt rise in hosts-file edits across the fleet. A positive
    result is either an individual host whose hosts file no longer matches the gold image, or a coordinated
    wave of edits suggesting scripted MFA-redirect deployment. In the context of Defense Impairment, this
    matters because the adversary is actively degrading or disabling MFA so that defensive controls can
    no longer be trusted to enforce strong authentication; a positive finding here means a security mechanism
    has been weakened and subsequent authentications cannot be assumed to be MFA-protected. Source detail:
    Statistical Method: Baseline an approved SHA256 of the corporate hosts file; alert on any deviation
    (State: changed vs approved). Track per-endpoint change Frequency and alert above the enterprise 99th
    percentile, and apply change-point detection to flag an abrupt rise in hosts-file edits across the
    fleet ([Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Endpoints and Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for host: if sha256(hosts_file) != APPROVED_HASH: alert(state=changed)

      edits_per_host = count(hosts edits, 30d)

      if edits_per_host > pct99(fleet): alert

      change_point(fleet_daily_edit_count) -> alert on abrupt rise'
- question: When the hosts file changes, does an Isolation Forest over change features (writing-process
    lineage, interactive vs service session, lines added, loopback+domain token, time-of-day) isolate
    the change as a malicious single-line loopback redirect rather than a legitimate installer change?
  context: 'Use an Isolation Forest over hosts-file change features - writing process lineage, interactive
    vs service session, number of lines added, presence of a loopback+domain token, and time-of-day -
    to isolate malicious single-line loopback redirects from benign installer changes, and report the
    top-3 contributing features in the alert. A positive result is a statistically isolated change whose
    feature profile matches MFA-redirect tampering, useful where simple rules over-fire on legitimate
    edits. In the context of Defense Impairment, this matters because the adversary is actively degrading
    or disabling MFA so that defensive controls can no longer be trusted to enforce strong authentication;
    a positive finding here means a security mechanism has been weakened and subsequent authentications
    cannot be assumed to be MFA-protected. Source detail: Machine Learning: Use an Isolation Forest over
    change features (writing process lineage, interactive vs service session, lines added, presence of
    loopback+domain token, time-of-day) to isolate malicious single-line loopback redirects from legitimate
    installer changes; report the top-3 contributing features in the alert ([Isolation Forest, Liu et
    al.](https://ieeexplore.ieee.org/document/4781136)).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Endpoints and Critical Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'feats = [proc_lineage, interactive_session, lines_added, loopback_domain_token, hour]

      model = IsolationForest().fit(historical_hosts_changes)

      for change: if model.score(feats)<thr: alert(top3=model.feature_contrib(feats))'
- question: Is a process command-line (4688) or PowerShell script block (4104) invoking cmdlets/parameters
    known to alter MFA configuration (e.g., Set-MsolUser, -StrongAuthenticationRequirements, Update-MgPolicy...AuthenticationMethod,
    Set-AdfsRelyingPartyTrust, -Exclude) without an approved change ticket?
  context: 'Monitor process command-lines (4688) and PowerShell script blocks (4104) for MFA-configuration
    keywords such as Set-AdfsRelyingPartyTrust, Set-MsolUser, -StrongAuthenticationRequirements, Update-MgPolicy...AuthenticationMethod,
    and -Exclude. Alert on any match that is not tied to an approved change ticket. A positive result
    is hands-on-keyboard or scripted modification of MFA policy/attributes, a common path to disabling
    MFA from a compromised admin context. In the context of Defense Impairment, this matters because the
    adversary is actively degrading or disabling MFA so that defensive controls can no longer be trusted
    to enforce strong authentication; a positive finding here means a security mechanism has been weakened
    and subsequent authentications cannot be assumed to be MFA-protected. Source detail: Symbolic Logic:
    Monitor process command-lines (4688) and PowerShell script blocks (4104) for keywords such as ''Set-AdfsRelyingPartyTrust'',
    ''Set-MsolUser'', ''-StrongAuthenticationRequirements'', ''Update-MgPolicy...AuthenticationMethod'',
    and ''-Exclude''. Alert on any match not tied to an approved change ticket ([SigmaHQ](https://github.com/SigmaHQ/sigma)).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: ADFS Servers, Domain Controllers, and Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventCode=4688 OR EventCode=4104) CommandLine IN_REGEX ("Set-MsolUser|StrongAuthenticationRequirements|Update-MgPolicy.*AuthenticationMethod|Set-AdfsRelyingPartyTrust|-Exclude")

      | lookup change_tickets approved_window

      | where ticket_match=false

      | alert'
- question: Are powershell.exe argument strings exhibiting unusually high Shannon entropy (obfuscation)
