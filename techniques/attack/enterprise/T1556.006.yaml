    per week (Volume) and per hour (Frequency) over 30-90 days. Alert when activity exceeds 3 standard
    deviations above the admin''s own baseline or the peer-group mean, or when a change-point (CUSUM/PELT)
    marks an abrupt step increase in group-modification volume ([A Survey of Change Point Detection, Aminikhanghahi
