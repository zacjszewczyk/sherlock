    then correlate that removal with the target''s next successful logon (4624) and flag it if the logon
    succeeds with no matching MFA-challenge event - the direct fail-open post-condition of MFA removal.
    A positive result is an account that lost MFA enforcement and then authenticated unchallenged. In
    the context of Persistence, this matters because weakening or removing MFA lets the adversary reuse
    stolen credentials indefinitely without being re-challenged; a positive finding indicates the adversary
    may have engineered durable, low-friction re-entry to the account or environment. Source detail: Symbolic
    Logic: Maintain a list of critical Active Directory group SIDs used for MFA enforcement. Generate
    a high-priority alert whenever a member removal event (Windows Event IDs 4729, 4733, 4757) targets
    one of these groups, capturing subject and target accounts. State signal: correlate the removal with
    the target''s next successful logon (4624) and flag if it succeeds WITHOUT a corresponding MFA-challenge
    event (fail-open), the direct post-condition of MFA removal ([SigmaHQ](https://github.com/SigmaHQ/sigma);
    [CISA AA22-074A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-074a)).'
