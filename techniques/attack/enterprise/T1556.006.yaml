name: 'T1556.006: Modify Authentication Process: Multi-Factor Authentication'
id: 44445820-696e-49f1-8094-53a37acd8b3e
description: 'This playbook helps an analyst investigate adversary attempts to disable or modify multi-factor
  authentication (MFA) so they can persist with stolen credentials and bypass strong authentication. It
  covers MFA tampering across Windows, Linux, macOS, Identity Providers, IaaS, Office Suite, and SaaS:
  removal of accounts from MFA-enforcing Active Directory groups; self-enrollment of new/attacker-controlled
  MFA methods followed by anomalous logins; hosts-file redirects of MFA service domains to loopback to
  trigger fail-open; PowerShell/command-line modification of MFA policy (Set-MsolUser, StrongAuthenticationRequirements,
  Conditional Access, ADFS); lsass/identity-agent outbound connections indicating token theft; tampering
  with third-party MFA agents (Duo/Okta); MFA-fatigue/push-bombing; Adversary-in-the-Middle relayed sessions
  (JA3/JA3S); fail-open detection where MFA-enrolled accounts authenticate single-factor; cloud Conditional
  Access exclusions and per-user MFA disablement; Linux PAM MFA module removal; and macOS SecurityAgent
  authorization-plugin tampering. For each evidence type it provides symbolic-logic rules, statistical
  baselines, and machine-learning approaches to surface the activity and explain why it is suspicious.'
type: technique
