    disabling MFA so that defensive controls can no longer be trusted to enforce strong authentication;
    a positive finding here means a security mechanism has been weakened and subsequent authentications
    cannot be assumed to be MFA-protected. Source detail: Symbolic Logic: Trigger when, for one user/source-IP,
    more than 10 MFA-denial failures (4625) occur within 5 minutes followed immediately by a success (4624).
    This is the push-bombing/MFA-fatigue signature; keep the concrete >10-in-5min threshold and tune per
    environment ([CISA AA23-320A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a);
    throttling baseline in [NIST SP 800-63B](https://pages.nist.gov/800-63-3/sp800-63b.html)).'
