    may have engineered durable, low-friction re-entry to the account or environment. Source detail: Symbolic
    Logic: Monitor file write events (4663 / Sysmon 11) to ''...\drivers\etc\hosts''. Alert if the writing
    process is not an authorized installer/admin tool, or if 4688 shows ''echo''/''powershell''/''cmd''
    editing the file. Highest fidelity: alert when an added line maps an MFA/identity-provider domain
    to 127.0.0.1 or 0.0.0.0 — the exact CISA-documented fail-open technique ([CISA AA22-074A](https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-074a);
