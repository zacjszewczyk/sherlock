    obfuscated administrative commands hiding MFA tampering or an abnormal surge of MFA-config activity
    from a given operator. In the context of Defense Impairment, this matters because the adversary is
    actively degrading or disabling MFA so that defensive controls can no longer be trusted to enforce
    strong authentication; a positive finding here means a security mechanism has been weakened and subsequent
    authentications cannot be assumed to be MFA-protected. Source detail: Statistical Method: Compute
    Shannon entropy of ''powershell.exe'' argument strings and the Frequency of MFA-cmdlet invocations
    per admin. Flag entropy above the 99th percentile (obfuscation) or a change-point spike in MFA-cmdlet
    usage versus the admin''s baseline ([Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: ADFS Servers, Domain Controllers, and Administrator Workstations'
