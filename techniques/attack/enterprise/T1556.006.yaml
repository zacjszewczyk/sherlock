- question: Is lsass.exe (or an MFA/identity agent) initiating an outbound connection (WFP 5156) to a
    destination outside trusted internal ranges, and is the byte volume/connection frequency to that external
    tuple anomalous?
  context: 'Raise a high-severity alert for any Windows Filtering Platform event (5156) where the application
    is C:\Windows\System32\lsass.exe (or an identity agent) and the destination is outside trusted internal
    ranges; corroborate with Zeek conn.log byte counts (volume) and connection frequency to the external
    tuple. lsass talking to the internet strongly suggests credential/token tampering or exfiltration.
    A positive result is lsass/identity-agent egress to a non-RFC1918 address. In the context of Defense
    Impairment, this matters because the adversary is actively degrading or disabling MFA so that defensive
    controls can no longer be trusted to enforce strong authentication; a positive finding here means
    a security mechanism has been weakened and subsequent authentications cannot be assumed to be MFA-protected.
    Source detail: Symbolic Logic: High-severity alert for any Windows Filtering Platform event (5156)
    where Application is ''C:\Windows\System32\lsass.exe'' and the destination is outside trusted internal
    ranges; corroborate with Zeek conn.log byte counts (Volume) and connection Frequency to the external
    tuple ([SigmaHQ](https://github.com/SigmaHQ/sigma)).'
  answer_sources:
  - Windows Event ID 5156
  - Zeek conn.log
  - 'NAI: Domain Controllers and User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventCode=5156 Application="C:\\Windows\\System32\\lsass.exe" DestAddress NOT IN $TRUSTED_INTERNAL

      | join DestAddress [ zeek conn.log | stats sum(orig_bytes) as bytes count as conns by dest ]

      | alert priority=high'
- question: Is lsass.exe or an identity agent connecting to a (process, dest_ip, dest_port) tuple that
    is novel or in the bottom 1st percentile of frequency for that host, or moving byte volumes above
    the host's 99th percentile?
  context: 'Baseline the legitimate (process, dest_ip, dest_port) tuples for lsass.exe and identity agents
