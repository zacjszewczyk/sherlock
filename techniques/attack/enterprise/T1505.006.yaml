questions:
- question: '[Persistence] Match VIB hashes with TI: Can you determine whether a file with a `.vib` or
    `.vgz` extension is transferred over the network to an ESXi host (vmk0 management interface), and
    the file''s SHA256 hash matches an entry on a threat intelligence feed of known-malicious VIBs (e.g.,
    VIRTUALPITA/VIRTUALPIE), or the transfer originates from a host that has never before sent a VIB to
    this hypervisor. -- specifically, using the ''Match VIB hashes with TI'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses malicious vSphere
    Installation Bundles to persist on ESXi hypervisors across reboots, leaving traces in network file
    transfers, esxcli command execution, ESXi boot/update logs, persistent-partition file changes, and
    post-install C2 traffic. This evidence focuses on the condition that a file with a `.vib` or `.vgz`
    extension is transferred over the network to an ESXi host (vmk0 management interface), and the file''s
    SHA256 hash matches an entry on a threat intelligence feed of known-malicious VIBs (e.g., VIRTUALPITA/VIRTUALPIE),
    or the transfer originates from a host that has never before sent a VIB to this hypervisor. This Symbolic
    Logic approach looks for the following signal: Hash `.vib`/`.vgz` files seen in Zeek files.log, confirm
    the destination is an ESXi host via Zeek conn.log, and alert on matches to threat intelligence of
    known-malicious VIBs such as VIRTUALPITA/VIRTUALPIE ([Bad VIB(E)s, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/esxi-hypervisors-malware-persistence/)).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a VIB-based persistence
    mechanism is being installed or is already active on the hypervisor in a way that deviates from sanctioned
    VMware administration; pivot to the source of the transfer, the installing user/account, the esxcli
    arguments used, the affected ESXi host and acceptance level, any modified boot paths, and subsequent
    outbound connections to confirm scope. A negative result helps rule out this VIB-persistence vector
    for the evidence examined but should be corroborated with the other questions in this playbook, since
    a single method can miss forced, masqueraded, or low-and-slow installs.'
  answer_sources: &id001
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network traffic sensors monitoring traffic to and from the ESXi management network (vmk0 interfaces)
    and vCenter servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match VIB hashes with TI

      source IN [Zeek files.log, Zeek conn.log]

      | WHERE matches_action_criteria("Match VIB hashes with TI")

      // Hash `.vib`/`.vgz` files seen in Zeek files.log, confirm the destination is an ESXi host via
      Zeek conn.log, and alert on

      | ALERT enrich(host, src_ip, user, esxcli_args, vib_file, acceptance_level, dest)'
  - technology: Zeek/pseudocode
    query: '# ESXi VIB network correlation

      files.log, conn.log, dns.log, http.log

      | FILTER transfers/connections involving ESXi management hosts (vmk0)

      | ENRICH file hash/TI, source allowlist, JA3, dest rarity, NXDOMAIN, ports

      | flag malicious/unexpected VIB transfers or post-install C2 per action criteria'
- question: '[Persistence] Score new VIB-source edges: Can you determine whether a file with a `.vib`
    or `.vgz` extension is transferred over the network to an ESXi host (vmk0 management interface), and
    the file''s SHA256 hash matches an entry on a threat intelligence feed of known-malicious VIBs (e.g.,
    VIRTUALPITA/VIRTUALPIE), or the transfer originates from a host that has never before sent a VIB to
    this hypervisor. -- specifically, using the ''Score new VIB-source edges'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses malicious vSphere
