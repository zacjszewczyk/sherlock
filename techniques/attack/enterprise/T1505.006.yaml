name: 'T1505.006: vSphere Installation Bundles'
id: 88638891-e38c-4485-bd03-2176aced0c68
description: 'This playbook helps an analyst investigate whether an adversary is abusing vSphere Installation
  Bundles (VIBs) to establish persistent access to VMware ESXi hypervisors. Because ESXi runs from an
  in-memory filesystem where most changes are lost on reboot, attackers package malicious payloads as
  VIBs (a .vgz payload archive, a signature file, and an XML descriptor) to survive reboots — creating
  startup tasks, custom firewall rules, listeners on hardcoded ports, and backdoors such as VIRTUALPITA/VIRTUALPIE,
  often forcing installation with `--force`/`--no-sig-check` or lowering the acceptance level to CommunitySupported,
  and masquerading malicious VIBs as PartnerSupported. The playbook guides the hunt across complementary
  angles: network transfers of .vib/.vgz files to ESXi management interfaces (vmk0) matched against threat
  intelligence or originating from unexpected/non-allowlisted sources; esxcli command lines that bypass
  signature/acceptance controls observed on vCenter (VCSA or Windows), ESXi shell.log, and esxupdate.log
  (including failed/rejected installs); post-install or post-reboot outbound C2 callbacks, rare-port listeners,
  and NXDOMAIN bursts from ESXi hosts; unauthorized users or out-of-maintenance-window installs validated
  against AD group membership and change windows; and file-integrity changes to the few persistent boot
  paths (/etc/rc.local.d/local.sh, /store/packages, /locker, /etc/init.d). Detection methods combine symbolic-logic
  rules, statistical baselining/change-point/forecasting, and machine-learning models (Random Forest/LightGBM,
  HMM/CT-HMM, DBSCAN, XGBoost, DeepLog-style LSTM) applied to Zeek files/conn/dns/http logs, Windows Event
  ID 4688, esxi:shell, esxi:esxupdate, esxi:syslog, and linux:fim telemetry, so the analyst can corroborate
  suspected VIB persistence against transfer provenance, command intent, boot-path changes, and C2 behavior.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
