    Method approach looks for the following signal: Baseline VIB-transfer source IP frequency per hypervisor
    and flag transfers from IPs in the bottom 5th percentile; in parallel score never-before-seen source->ESXi
    edges with a Bayesian new-edge model and alert on first-time senders ([Sanna Passino & Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf);
