    being installed or is already active on the hypervisor in a way that deviates from sanctioned VMware
    administration; pivot to the source of the transfer, the installing user/account, the esxcli arguments
    used, the affected ESXi host and acceptance level, any modified boot paths, and subsequent outbound
    connections to confirm scope. A negative result helps rule out this VIB-persistence vector for the
    evidence examined but should be corroborated with the other questions in this playbook, since a single
    method can miss forced, masqueraded, or low-and-slow installs.'
