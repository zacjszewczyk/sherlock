questions:
- question: '[Persistence] Compare AppInit DLL hashes against threat intel and imphash: Can you determine
    whether a modification to the HKLM\Software\...\Windows\AppInit_DLLs registry value references a DLL
    whose SHA256 file hash is present on a threat intelligence feed of known malicious indicators. --
    specifically, using the ''Compare AppInit DLL hashes against threat intel and imphash'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), the mission question is: "Is the
    adversary maintaining persistence by loading a malicious AppInit DLL?" Adversaries abuse the AppInit_DLLs
    registry value so that user32.dll loads their DLL into nearly every GUI process, granting durable
    persistence and a path to run code in higher-integrity contexts. This evidence focuses on the condition
    that a modification to the HKLM\Software\...\Windows\AppInit_DLLs registry value references a DLL
    whose SHA256 file hash is present on a threat intelligence feed of known malicious indicators. This
    Symbolic Logic approach looks for the following signal: Trigger on any registry value modification
    (Windows Event ID 4657 or Sysmon Event ID 13/14) to `AppInit_DLLs` under either `HKLM\Software\Microsoft\Windows
    NT\CurrentVersion\Windows` or the `Wow6432Node` path; both hives are abused per SigmaHQ New DLL Added
    to AppInit_DLLs. Extract every DLL path from the (space/semicolon-delimited) value, compute the on-disk
    SHA256 (Sysmon Event ID 11 for the drop) AND the PE import hash (imphash) as described in Mandiant
    import hashing, and exact-match both against your CTI store. Any match is a high-confidence alert.
    The `AppInit_DLLs` value being non-empty is itself rare in modern fleets (Elastic process-injection
    survey), so treat all entries as candidates. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates likely AppInit DLL abuse aligned with the Persistence tactic; pivot to
    the writing process and its integrity level, the referenced DLL''s hash/imphash/signer and on-disk
    path, the set of processes that subsequently loaded that DLL, and any child-process spawns, integrity-level
    jumps, LSASS access, or outbound connections that follow. A negative result helps rule out this AppInit
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, signed, or low-and-slow abuse.'
