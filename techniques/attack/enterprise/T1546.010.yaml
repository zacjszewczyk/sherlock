name: 'T1546.010: AppInit DLLs'
id: f41ad524-e988-4ce6-b475-6912f0697561
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Windows AppInit_DLLs
  mechanism to establish persistence and/or escalate privileges by forcing a malicious DLL to be loaded
  into nearly every process that imports user32.dll (T1546.010). It guides the hunt across two tactics
  — Persistence (TA0003) and Privilege Escalation (TA0004) — and several behavioral angles centered on
  the registry keys HKLM\Software\Microsoft\Windows NT\CurrentVersion\Windows and the Wow6432Node equivalent.
  Investigative threads include: detecting modifications to the AppInit_DLLs value that reference DLLs
  matched by SHA256/imphash against threat intelligence (including privilege-escalation tooling such as
  Mimikatz components and UAC-bypass DLLs); flagging AppInit entries that are unsigned, fail signature
  verification, or point at user-writable/temporary/public load paths (C:\Users\, \AppData\, C:\Windows\Temp\,
  C:\ProgramData, UNC); spotting tampering with the RequireSignedAppInit_DLLs (set to 0) and LoadAppInit_DLLs
  (set to 1) security gates, especially the disable-then-populate sequence; correlating AppInit registry
  writes with the same new DLL loading into many unrelated user32 GUI processes (explorer.exe, outlook.exe,
  winlogon.exe), those processes spawning shells (cmd.exe/powershell.exe/rundll32.exe) or beaconing to
  rare destinations; and tracing privilege-escalation chains where a Medium-integrity process modifies
  AppInit_DLLs and a subsequent High/System-integrity process loads the same DLL, accesses LSASS, or deviates
  from its baseline. Detection methods combine deterministic symbolic-logic rules, robust statistical
  baselining (MAD modified Z-score, fleet prevalence/first-seen, Jaccard drift), and machine-learning
  models (gradient boosting/Random Forest, Isolation Forest, log-sequence and provenance-graph models)
  applied to Windows Security Event ID 4657/4673/4674, Sysmon Event IDs 1/3/7/10/11/13/14, and Zeek conn/dns/http
  logs, so the analyst can corroborate suspected AppInit DLL abuse against registry state, DLL provenance,
  integrity-level transitions, and downstream execution/network context.'
type: technique
