questions:
- question: 'Can you determine, using deterministic rule logic, whether ''Desktop hash IOC'' reveals XDG
    Autostart Entries (T1547.013) activity for the Persistence tactic? Specifically: Scan [Sysmon for
    Linux](https://github.com/Sysinternals/SysmonForLinux) EID 11 / auditd creat-open file-creation events
    for `.desktop` writes in `/etc/xdg/autostart` and `~/.config/autostart`, hash both the `.desktop`
    file and the binary in its `Exec=` line, and alert when either SHA256 matches CTI/IOC feeds (e.g.,
    NetWire Linux IOCs, [Red Canary](https://redcanary.com/blog/threat-intelligence/netwire-remote-access-trojan-on-linux/)).
    Use eBPF lineage to capture the writing process and user ([Tracee](https://github.com/aquasecurity/tracee)).'
  context: 'Tactic context (Persistence): The adversary is trying to maintain their foothold. T1547.013
    (XDG Autostart Entries) covers adversaries adding or modifying `.desktop` Desktop Entry files in XDG
    autostart directories (`/etc/xdg/autostart` system-wide, `~/.config/autostart` per-user, and any `$XDG_CONFIG_DIRS`
    locations) so a malicious binary or command in the `Exec=` directive runs automatically when a user
    logs in and the desktop environment loads. Evidence under investigation: A new or modified XDG autostart
    .desktop file is observed, where the SHA256 hash of the file itself, or the SHA256 hash of the executable
    referenced in its ''Exec='' line, matches a known-bad hash from a threat intelligence source. Approach
    (Desktop hash IOC): Scan [Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux) EID 11
    / auditd creat-open file-creation events for `.desktop` writes in `/etc/xdg/autostart` and `~/.config/autostart`,
    hash both the `.desktop` file and the binary in its `Exec=` line, and alert when either SHA256 matches
    CTI/IOC feeds (e.g., NetWire Linux IOCs, [Red Canary](https://redcanary.com/blog/threat-intelligence/netwire-remote-access-trojan-on-linux/)).
    Use eBPF lineage to capture the writing process and user ([Tracee](https://github.com/aquasecurity/tracee)).
    A positive result indicates likely abuse of XDG autostart entries for persistence on the affected
    Linux host; a negative result means the observed autostart entries, command lines, and process/network
    behavior match expected baselines and installed-package provenance. Pivot from any hit to the writing
    user and process lineage, the `.desktop` file and its `Exec=` target, the login session, and any downstream
    network, file, or privilege activity.'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - 'NAI: Linux endpoints (workstations and servers) with desktop environments; specifically, the contents
    of the /etc/xdg/autostart/ and ~/.config/autostart/ directories, and any directories specified by
    $XDG_CONFIG_DIRS.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Hash .desktop files + Exec= binaries in XDG autostart vs CTI\nMATCH file_create (Sysmon-Linux\
      \ EID 11 | auditd creat/open)\n  WHERE path IN ['/etc/xdg/autostart','~/.config/autostart', $XDG_CONFIG_DIRS]\n\
      \        AND path ENDSWITH '.desktop'\n  h1 = sha256(file); h2 = sha256(resolve(parse_exec(file)))\n\
      \  IF h1 IN cti_iocs OR h2 IN cti_iocs   // e.g. NetWire Linux IOCs\n  THEN alert(severity='high',\
      \ enrich=[writing_proc, user, exec_path])"
