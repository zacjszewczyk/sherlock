name: 'T1547.013: XDG Autostart Entries'
id: 03657c75-a3fa-45b7-8609-68e1b0549fcf
description: 'This playbook helps an analyst investigate adversary abuse of XDG Autostart Entries (T1547.013)
  on XDG-compliant Linux hosts, where malicious `.desktop` Desktop Entry files in `/etc/xdg/autostart`
  (system-wide), `~/.config/autostart` (per-user), or `$XDG_CONFIG_DIRS` run an attacker-controlled binary
  or command from the `Exec=` directive automatically when a user logs in and the desktop environment
  loads. It covers both the Persistence use case (re-establishing a foothold across logins) and the Privilege
  Escalation use case (system-wide autostart entries running with elevated context). The questions guide
  the analyst across the full kill chain: detecting new or modified `.desktop` files whose file hash or
  `Exec=` target hash matches threat intelligence; spotting suspicious `Exec=` structures (interpreters
  running scripts from /tmp or /dev/shm, download-and-execute pipelines, obfuscated/high-entropy arguments);
  identifying masquerading entries whose Name/Comment impersonate legitimate apps while Exec points to
  unsigned or user-writable binaries; correlating autostart-spawned processes with C2 network connections,
  rare ASNs/countries, rare JA3/JA3S, beaconing cadence, and rapid self-deletion of the `.desktop` file;
  flagging non-root or non-package-manager writes to system-wide autostart; detecting privilege-escalation
  primitives (sudo, pkexec, setuid/setcap, sudoers edits, local exploits) and writes to sensitive system
  paths (/etc/passwd, /usr/bin, /boot). Detection blends symbolic-logic rules, statistical baselining
  (prevalence/entropy/edit-distance/percentile/periodicity and failure-mode signals), and machine learning
  (Isolation Forest, XGBoost/Random Forest, transformer/BERT command-line scoring, LSTM/HMM sequence models,
  autoencoders, and provenance GNNs) to produce explainable, evasion-resistant alerts for Linux endpoint
  and network telemetry.'
type: technique
