name: 'T1597.002: Purchase Technical Data'
id: 541eca78-b630-41d7-a0b4-f55a977bedb5
description: 'Investigate whether an adversary has purchased technical data about the enterprise — such
  as breached credentials, employee contact details, or infrastructure/vulnerability specifics — and is
  now operationalizing it for targeted reconnaissance or initial access. This playbook helps an analyst
  correlate threat-intelligence reporting of data sales with observable activity on enterprise telemetry:
  authentication attempts matching breached-credential corpora, anomalous spikes in external scanning
  or authentication failures within hours of a reported sale, low-entropy targeted port probing of purchased
  infrastructure data, impossible-travel logins from stolen credentials, exploit traffic against non-public
  web applications enumerated from purchased vulnerability data, and cloud sessions from novel IP/ASN
  sources followed by abnormal data egress. Each question pairs a deterministic IOC/symbolic floor with
  statistical baselining and machine-learning detection so the analyst can confirm or refute adversary
  use of purchased technical data.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any successful (4624) or failed (4625) authentication events match a username or credential
    hash present in a breached-credential corpus or threat-intelligence feed that an adversary could have
    purchased?
  context: Adversaries who purchase breached-credential dumps (T1597.002) will replay those usernames
    and password hashes against the enterprise. Continuously refresh a breached-credential database and
    use k-anonymity hash-prefix lookups so plaintext is never stored. A successful 4624 by any corpus-matched
    account is high severity and indicates purchased credentials are working; a failed-only (4625) match
    is lower severity but still corroborating — tune the failed path to suppress lockout/typo noise. A
    positive result here is a strong signal that purchased data is being operationalized for initial access
    against the Reconnaissance-to-access pivot. See [Protecting accounts from credential stuffing with
    password breach alerting, Thomas et al.](https://www.usenix.org/conference/usenixsecurity19/presentation/thomas)
    for the k-anonymity hash-prefix breach-alerting approach.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Authentication servers (Domain Controllers, ADFS), VPN Concentrators, Cloud Identity Providers
    (e.g., Azure AD)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=auth (EventCode=4624 OR EventCode=4625)\n  | eval cred_prefix=sha1_prefix(account_name,\
      \ ntlm_hash)\n  | lookup breached_corpus hash_prefix AS cred_prefix OUTPUT match\n  | where match=\"\
      true\"\n  | eval severity=if(EventCode=4624,\"high\",\"medium\")\n  | table _time, host, account_name,\
      \ src_ip, EventCode, severity"
- question: For each source IP and target account, do the counts of distinct accounts attempted and the
    failed-to-success logon ratio exceed learned per-user/per-source baselines, indicating spraying of
    a purchased credential list?
  context: 'Purchased credential lists are commonly sprayed: one source touches many accounts with mostly
    failures, or a single corpus-matched account suddenly exceeds its historical failure volume. Count
    distinct accounts and the 4625:4624 ratio per source over 5-minute and per-day windows. Compute the
    per-user 95th-percentile daily 4625 count over 90 days and alert when a corpus-matched account exceeds
    it (volume signal), OR when one source IP shows >0.9 failure ratio against >10 distinct accounts (frequency+state
    signal). Profile NXLOGON/bad-password failure sub-codes explicitly. A positive result distinguishes
    targeted spraying of purchased data from benign auth noise. Spraying thresholds follow [Detecting
    Password Spraying Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Authentication servers (Domain Controllers, ADFS), VPN Concentrators, Cloud Identity Providers
    (e.g., Azure AD)'
  range: Last 90 days; evaluate in 5-minute and per-day windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=auth (EventCode=4624 OR EventCode=4625)\n  | bin _time span=5m\n  | stats dc(account_name)\
      \ AS distinct_accts,\n          count(eval(EventCode=4625)) AS fails,\n          count(eval(EventCode=4624))\
      \ AS succ by src_ip, _time\n  | eval fail_ratio=fails/(fails+succ)\n  | where (fail_ratio>0.9 AND\
      \ distinct_accts>10)\n          OR fails > pctl95_daily_baseline(account_name)"
- question: When a successful login is scored by a classifier using features such as hour-of-day, source
    ASN/geo, new-device flag, breach-list membership, and recent failure rate, does it exceed the suspicious
    threshold — and what top-3 features drive that score?
  context: A gradient-boosted or logistic-regression classifier trained on historical logins can flag
    successful logins that look like stolen-credential use even when no single rule fires. Escalate logins
    scored >0.8 and pair with an unsupervised Isolation Forest over the same features as a label-free
    backstop. The alert MUST list the top-3 contributing features (e.g., 'breach-list=1, ASN-new=1, hour=03:00')
    so an analyst can triage quickly. A high score with breach-list membership among the top features
    strongly suggests purchased credentials in use. Pair with an unsupervised [Isolation Forest, Liu,
    Ting and Zhou](https://doi.org/10.1145/2133360.2133363) over the same features as a label-free backstop.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Authentication servers (Domain Controllers, ADFS), VPN Concentrators, Cloud Identity Providers
    (e.g., Azure AD)'
  range: Last 90 days for training; score in near-real-time
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model = load(\"login_risk_gbm\")\n  features = [hour, src_asn, geo, new_device, breach_list_member,\
      \ recent_fail_rate]\n  score = model.predict_proba(features)\n  if score > 0.8 or isolation_forest(features).anomaly:\n\
      \      alert(top3=shap_top_features(features), account, src_ip, score)"
- question: After ingesting a threat-intelligence report of the organization's data being sold, do any
    connections (Zeek conn.log) or authentication failures (4625) originate from the IOCs (IPs/domains/ASNs)
    named in that report within the next 7 days?
  context: When TI reports the sale of the organization's technical data, immediately instantiate a time-bound
    (7-day) correlation rule that alerts on any network connection or auth failure from the report's IOCs.
    This deterministic IOC floor runs regardless of model output and directly links Reconnaissance-stage
    data purchase to observable enterprise activity. A hit means an entity associated with the data sale
    is already probing the enterprise.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - 'NAI: Internet Gateways, Demilitarized Zone (DMZ) Servers, Threat Intelligence Platforms'
  range: 7 days from TI trigger
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  // on TI report ingest, arm 7-day rule\n  index=(conn OR auth) earliest=ti_report_time\
      \ latest=ti_report_time+7d\n  | lookup ti_sale_iocs ioc AS src_ip OUTPUT ioc_type\n  | where isnotnull(ioc_type)\
      \ AND (sourcetype=\"zeek_conn\" OR EventCode=4625)\n  | table _time, src_ip, ioc_type, dest, sourcetype"
- question: Within 72 hours of a high-confidence TI trigger, does CUSUM change-point detection identify
    a statistically significant upward shift in daily connection attempts to non-public services or in
    failed-logon counts?
  context: Maintain 30-day rolling baselines of (a) daily connection attempts to non-public services and
    (b) failed-logon counts, then apply CUSUM change-point detection. Alert on a significant upward change
    point within 72h of a TI trigger. Track the blocked/REJ connection rate and NXDOMAIN rate as separate
    CUSUM series so failure-mode surges aren't masked by accepted-traffic volume. A change point coinciding
    with the reported sale indicates adversary action driven by purchased data. Apply CUSUM change-point
    detection per [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - 'NAI: Internet Gateways, Demilitarized Zone (DMZ) Servers, Threat Intelligence Platforms'
  range: 30-day rolling baseline; evaluate 72h post-trigger
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=(conn OR auth)\n  | timechart span=1d count AS attempts,\n            count(eval(conn_state\
      \ IN(\"REJ\",\"S0\"))) AS blocked,\n            count(eval(EventCode=4625)) AS fails\n  | cusum(attempts,\
      \ baseline=30d) AS cp_attempts\n  | cusum(fails, baseline=30d) AS cp_fails\n  | where (cp_attempts.signif\
      \ OR cp_fails.signif)\n          AND _time within 72h of ti_trigger"
- question: Does observed scan and authentication-failure volume exceed the 99% prediction interval of
    a seasonal forecast (SARIMA) for more than an hour after a TI trigger, or drive high reconstruction
    error in a streaming flow autoencoder?
  context: Forecast expected scan and auth-failure volume with SARIMA capturing weekly seasonality; alert
    when observed volume exceeds the 99% prediction interval for >1h after a trigger. Optionally score
    streaming flow features with an online autoencoder ensemble (Kitsune) and surface the top-3 features
    driving reconstruction error. This catches surges that exceed normal seasonality even when absolute
    counts look plausible, tying anomalous activity to the purchased-data sale window. The streaming flow
    autoencoder ensemble is [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089) ([code](https://github.com/ymirsky/Kitsune-py)).
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4625
  - 'NAI: Internet Gateways, Demilitarized Zone (DMZ) Servers, Threat Intelligence Platforms'
  range: Train on 90+ days for seasonality; score continuously post-trigger
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  forecast = SARIMA(history, seasonal=weekly).predict(interval=0.99)\n  if observed_volume\
      \ > forecast.upper for >1h after ti_trigger:\n      alert(metric, observed_volume, forecast.upper)\n\
      \  ae = kitsune(flow_features)\n  if ae.recon_error > threshold:\n      alert(top3=ae.top_features())"
- question: Is there any external connection to an internal IP on a port that is NOT on the dynamic allowlist
    of public-facing services derived from the asset-inventory database?
  context: Maintain a dynamic allowlist of public-facing services/ports from the asset-inventory database
    and alert on any external connection to an internal IP on a non-allowlisted port. This deterministic
    floor catches probing of services that should never be reachable externally — exactly what an adversary
    does after buying infrastructure data. A hit means an external entity is touching internal services
    outside the sanctioned attack surface.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 3
  - 'NAI: Network Taps at Internet Egress/Ingress Points, Firewall Log Aggregators, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=conn sourcetype=zeek_conn\n  | where is_external(src_ip) AND is_internal(dest_ip)\n\
      \  | lookup asset_public_ports dest_ip, dest_port OUTPUT allowed\n  | where allowed!=\"true\"\n\
      \  | table _time, src_ip, dest_ip, dest_port, conn_state"
- question: Per external source IP, is the Shannon entropy of destination ports anomalously LOW (below
    the 5th percentile of background traffic) combined with a Threshold Random Walk crossing the scanner
    bound on connection success-vs-failure states?
  context: 'Targeted probing of purchased infrastructure data hits a few specific ports (low destination-port
    entropy) with many refused/failed states. Compute Shannon entropy of destination ports per source
    in a 5-minute window and alert when it falls below the 5th percentile of background traffic. Combine
    with the Threshold Random Walk sequential hypothesis test: accumulate conn_state S0/REJ/RSTO (failed)
    vs SF (success) and flag the source once the failure-weighted likelihood ratio crosses the scanner
    bound. The failed-connection ratio is the primary failure-mode signal distinguishing targeted probing
    from broad scanning. Entropy thresholds follow [Using Entropy Analysis to Find Encrypted and Packed
    Malware, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989); the connection-state sequential
    test is the Threshold Random Walk of [Fast Portscan Detection Using Sequential Hypothesis Testing,
    Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 3
  - 'NAI: Network Taps at Internet Egress/Ingress Points, Firewall Log Aggregators, Critical Servers'
  range: Last 90 days; 5-minute entropy windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=conn sourcetype=zeek_conn | where is_external(src_ip)\n  | bin _time span=5m\n\
      \  | stats list(dest_port) AS ports,\n          count(eval(conn_state IN(\"S0\",\"REJ\",\"RSTO\"\
      ))) AS fail,\n          count(eval(conn_state=\"SF\")) AS succ by src_ip,_time\n  | eval port_entropy=shannon(ports)\n\
      \  | where port_entropy < pctl5(background_entropy)\n          AND trw_likelihood(fail,succ) > scanner_bound"
- question: When connection events are clustered by source IP, destination IP, destination port, protocol,
    and conn_state, do small dense clusters appear that are separated from the large background-internet
    cluster?
  context: Cluster connection events with DBSCAN; small dense clusters separated from the large 'background
    internet' cluster represent focused, repeatable probing behavior — the fingerprint of an adversary
    working from purchased infrastructure data. For each flagged cluster report the top-3 distinguishing
    features (e.g., 'dest_port set={5985,3389}, conn_state=REJ, single /24 target') to make the alert
    explainable. A tight off-pattern cluster targeting non-public services warrants investigation as purchased-data-driven
    reconnaissance.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 3
  - 'NAI: Network Taps at Internet Egress/Ingress Points, Firewall Log Aggregators, Critical Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = events[[src_ip,dest_ip,dest_port,proto,conn_state]]\n  labels = DBSCAN(eps, min_samples).fit_predict(encode(X))\n\
      \  for c in small_dense_clusters(labels):\n      alert(cluster=c, top3=distinguishing_features(c))"
- question: Does any successful login (4624 or cloud audit log) originate from a source-IP geolocation
    in a high-risk or non-business country on the denylist, excluding known corporate VPN egress IPs?
  context: Enrich every successful login with source-IP geolocation and raise a low-severity alert when
    the source country is on a high-risk/non-business denylist, excluding known corporate VPN egress IPs.
    This deterministic geo floor is the first cheap signal that purchased credentials/contact data are
    being used from an unexpected location. It is intentionally low-severity to feed corroboration, not
    stand alone.
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication Servers (Domain Controllers), VPN Concentrators, Network Flow Collectors, Cloud
    Identity Providers (e.g., Azure AD)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=auth EventCode=4624 OR sourcetype=cloud_audit action=login_success\n  | iplocation\
      \ src_ip\n  | where Country IN(geo_denylist) AND NOT (src_ip IN(corp_vpn_egress))\n  | eval severity=\"\
      low\"\n  | table _time, account_name, src_ip, Country, severity"
- question: For each new successful login, does the great-circle distance from the prior successful login
    divided by elapsed time imply a travel velocity exceeding commercial-flight feasibility (~500 mph),
    after adjusting for known VPN/proxy egress?
  context: Impossible-travel is often the first observable sign of purchased credentials being used. For
    each new successful login compute great-circle distance to the prior successful login divided by elapsed
    time; alert when the required velocity exceeds ~500 mph, adjusting for known VPN/proxy egress. Track
    the count of failed (4625) attempts preceding the impossible-travel success as a corroborating failure-mode
    signal. A positive result means the same account authenticated from two physically irreconcilable
    locations — a hallmark of stolen-credential reuse. Compute required travel velocity per [Impossible
    Travel Detection, Microsoft Patent WO2018085161A1](https://patents.google.com/patent/WO2018085161A1/en).
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication Servers (Domain Controllers), VPN Concentrators, Network Flow Collectors, Cloud
    Identity Providers (e.g., Azure AD)'
  range: Last 90 days; per-account sequential comparison
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=auth EventCode=4624 | iplocation src_ip | sort 0 account_name,_time\n  | streamstats\
      \ current=f last(lat) AS plat last(lon) AS plon\n            last(_time) AS ptime by account_name\n\
      \  | eval km=haversine(plat,plon,lat,lon)\n  | eval mph=(km*0.621)/((_time-ptime)/3600)\n  | where\
      \ mph>500 AND NOT (src_ip IN(vpn_proxy_egress))"
- question: When new logins are scored against per-user behavioral profiles (typical countries, ASNs,
    login hours, devices) with an Isolation Forest / UEBA model, are any flagged as outliers — and what
    top-3 factors explain the anomaly?
  context: Build per-user behavioral profiles and score new logins with an Isolation Forest baseline plus
    Sentinel-style entity analytics (UEBA). Flag outliers and emit the top-3 contributing factors (e.g.,
    'new ASN, new country, 02:14 login') in the alert. This catches stolen-credential use that evades
    fixed geo/velocity rules by learning each user's normal pattern. A strong outlier with novel-location
    features supports the hypothesis that purchased credentials are being exercised. Score with an [Isolation
    Forest, Liu, Ting and Zhou](https://doi.org/10.1145/2133360.2133363) baseline and Sentinel-style entity
    analytics per [Identify advanced threats with UEBA, Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Authentication Servers (Domain Controllers), VPN Concentrators, Network Flow Collectors, Cloud
    Identity Providers (e.g., Azure AD)'
  range: Last 90 days for profiling; score in near-real-time
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  profile = ueba_profile(account_name)\n  features = [country,asn,login_hour,device]\n\
      \  if isolation_forest(profile).score(features) > threshold:\n      alert(account_name, top3=entity_top_factors(features))"
- question: Do external source IPs send known exploit URI patterns or signatures (Zeek http.log / notice.log)
    against unpatched non-public services identified by correlating vulnerability-scan results with the
    asset inventory?
  context: Correlate vulnerability-scan results with asset inventory to identify unpatched non-public
    services, then alert on known exploit patterns (specific URIs in http.log, signatures in notice.log)
    targeting them from external IPs. This deterministic signature floor catches exploitation following
    enumeration of purchased infrastructure/vulnerability data, and runs in parallel with ML. A hit means
    an external actor is attacking a service whose weakness may have been learned from purchased data.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - 'NAI: Web Application Servers (DMZ and Internal), Intrusion Detection System (IDS) Sensors, Network
    Taps'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=zeek (sourcetype=zeek_http OR sourcetype=zeek_notice)\n  | where is_external(src_ip)\n\
      \  | lookup vuln_assets dest_ip OUTPUT cve, unpatched\n  | where unpatched=\"true\"\n  | search\
      \ (uri IN(exploit_uri_signatures) OR note IN(exploit_notices))\n  | table _time, src_ip, dest_ip,\
      \ uri, note, cve"
- question: Do external sources request URIs in the bottom 1st percentile of a 90-day per-app rarity distribution
    (hidden/forgotten endpoint enumeration), and is there a coincident spike in that source's 4xx/5xx
    error rate?
  context: 'Build a 90-day URI frequency distribution per non-public app and alert on requests to URIs
    in the bottom 1st percentile of rarity, indicating enumeration of hidden/forgotten endpoints. Simultaneously
    baseline the per-source 404/403/500 rate; a spike in 4xx/5xx from one source is the explicit failure-mode
    signal of brute-force discovery. Enrich any callback domains with passive-DNS scoring. Together these
    reveal an actor methodically probing an app — consistent with using purchased vulnerability data.
    Enrich any callback domains with passive-DNS scoring per [EXPOSURE: Finding Malicious Domains Using
    Passive DNS Analysis, Bilge et al.](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - 'NAI: Web Application Servers (DMZ and Internal), Intrusion Detection System (IDS) Sensors, Network
    Taps'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=zeek_http | where is_external(src_ip)\n  | eval uri_freq=lookup_rarity(app,uri)\n\
      \  | stats count AS reqs, avg(uri_freq) AS rarity,\n          count(eval(status>=400)) AS errs by\
      \ src_ip,app\n  | eval err_rate=errs/reqs\n  | where rarity < pctl1(uri_freq) OR err_rate > baseline_err_rate(app)"
- question: When web sessions are modeled as URI-request sequences with an LSTM autoencoder trained on
    normal navigation, do any external-IP sessions produce high reconstruction error — and what top-3
    features explain it?
  context: Model web sessions as URI-request sequences and train an LSTM autoencoder on normal navigation;
    flag external-IP sessions with high reconstruction error. For online/label-free coverage use Kitsune
    over flow features. Surface the top-3 features (e.g., 'rare URI, 18 distinct 404s, no Referer') in
    the alert. Sessions that don't resemble legitimate navigation patterns suggest automated enumeration/exploitation
    guided by purchased data rather than normal use. For online/label-free coverage use [Kitsune, Mirsky
    et al.](https://arxiv.org/abs/1802.09089) over flow features.
  answer_sources:
  - Zeek http.log
  - Zeek files.log
  - Zeek notice.log
  - Windows Event ID 4688
  - 'NAI: Web Application Servers (DMZ and Internal), Intrusion Detection System (IDS) Sensors, Network
    Taps'
  range: Train on 90 days of normal sessions; score continuously
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  seq = sessionize(http_requests, by=src_ip)\n  err = lstm_autoencoder.reconstruction_error(seq)\n\
      \  if err > threshold and is_external(src_ip):\n      alert(session=src_ip, top3=seq_top_features(seq))"
- question: Is a successful cloud login from a new country/ASN (cloud audit logs) followed within 1 hour
    by DNS requests (Zeek dns.log) to file-sharing/exfiltration domains from the same internal source?
  context: Correlate a successful cloud login from a new country/ASN with subsequent DNS requests to file-sharing/exfil
    domains from the same internal source within 1h. This deterministic floor includes built-in cloud
    impossible-travel and infrequent-country detections. The login-then-exfil-DNS pattern is a downstream
    effect of purchased credentials/technical data being used to reach sensitive cloud repositories. A
    correlated hit is a strong exfiltration-precursor signal. The floor includes built-in cloud impossible-travel
    and infrequent-country detections per [Anomaly detection policies, Microsoft Defender for Cloud Apps](https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy).
  answer_sources:
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Cloud Log Aggregator (SIEM), Cloud Identity Provider, Network Flow Collectors monitoring traffic
    to cloud provider IP ranges'
  range: Last 90 days; 1-hour correlation window
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  index=cloud_audit action=login_success\n  | where new_country=\"true\" OR new_asn=\"\
      true\"\n  | join src_internal_host [search sourcetype=zeek_dns\n        | lookup exfil_domains query\
      \ OUTPUT is_exfil | where is_exfil=\"true\"]\n  | where dns_time - login_time < 3600\n  | table\
      \ login_time, account, src_ip, country, asn, query"
- question: Per user, does daily egress volume from key cloud stores exceed the 30-day mean plus 4 standard
    deviations (especially after an anomalous login), and are there elevated denied API calls (403/AccessDenied)
    indicating enumeration with limited stolen credentials?
  context: Compute a 30-day moving average and standard deviation of daily egress bytes from key cloud
    stores per user; alert when daily egress exceeds mean + 4 standard deviations, especially following
    an anomalous login. Track failed/denied API call counts (403/AccessDenied) per session as a distinct
    failure-mode signal of enumeration with stolen-but-limited credentials. A large egress spike after
    a novel login, or a burst of access-denied probing, both point to misuse of purchased credentials
    against cloud data.
  answer_sources:
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Cloud Log Aggregator (SIEM), Cloud Identity Provider, Network Flow Collectors monitoring traffic
    to cloud provider IP ranges'
  range: 30-day moving baseline per user
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  index=cloud_audit | bin _time span=1d\n  | stats sum(egress_bytes) AS bytes,\n     \
      \     count(eval(status IN(\"403\",\"AccessDenied\"))) AS denied by user,_time\n  | eventstats avg(bytes)\
      \ AS mu, stdev(bytes) AS sd by user\n  | where bytes > mu + 4*sd OR denied > denied_baseline(user)"
- question: When users are clustered into peer groups by role/usage (K-Means) and scored on deviation
    from their assigned centroid, do any users show anomalous behavior — and what top-3 features (e.g.,
    download volume vs peer median, new ASN, off-hours) drive it?
  context: Cluster users into peer groups by role/usage with K-Means and score deviation from the assigned
    centroid; surface anomalies and contributing factors via UEBA. The alert text must list the top-3
    features (e.g., 'download 12x peer median, new ASN, off-hours') for analyst triage. Peer-group analysis
    catches a compromised account whose behavior diverges from its role cohort even if it stays within
    its own historical noise — a downstream effect of purchased credentials granting access beyond normal
    use. Surface anomalies and contributing factors via UEBA per [Identify advanced threats with UEBA,
    Microsoft Sentinel](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).
  answer_sources:
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Cloud Log Aggregator (SIEM), Cloud Identity Provider, Network Flow Collectors monitoring traffic
    to cloud provider IP ranges'
  range: Last 90 days for peer-group modeling
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  groups = KMeans(k).fit(user_role_usage_features)\n  for u in users:\n      dist = distance(u.features,\
      \ groups.centroid(u.group))\n      if dist > threshold:\n          alert(user=u, top3=ueba_top_features(u))"
