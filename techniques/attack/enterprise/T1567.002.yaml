questions:
- question: '[Exfiltration] Continuously join destination IP addresses from Zeek conn.log and Server Name
    Indication (SNI) from Zeek ssl.log against an allow-list of sanctioned cloud providers and a deny-list
    from CTI feeds -- specifically, using the Symbolic Logic approach to investigate the following evidence:
    A TCP/UDP network connection from an internal host to a domain or IP address that is present on a
    threat intelligence list of known malicious infrastructure or is an unsanctioned cloud storage provider
    not approved for corporate use.'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary exfiltrates sensitive
    data to a cloud storage service (e.g., Dropbox, Google Drive, OneDrive, Box, AWS S3, MEGA) instead
    of, or in addition to, the primary command-and-control channel, blending in with legitimate traffic
    when hosts already talk to these providers. This evidence focuses on the condition: A TCP/UDP network
    connection from an internal host to a domain or IP address that is present on a threat intelligence
    list of known malicious infrastructure or is an unsanctioned cloud storage provider not approved for
    corporate use. This Symbolic Logic approach works as follows: Continuously join destination IPs (Zeek
    conn.log) and SNI (Zeek ssl.log) against an allow-list of sanctioned cloud providers and a CTI deny-list,
    per MITRE [DET0570 / T1567.002](https://attack.mitre.org/techniques/T1567/002/). Alert on any TLS
    connection whose SNI resolves to a cloud-storage provider NOT on the corporate allow-list (e.g., mega.nz,
    pcloud.com, anonfiles, mediafire) or that matches the deny-list. Primary logic uses first-party Zeek
    logs only; CTI enrichment is optional, not mandatory. A positive result -- a rule match, statistical
    outlier, or model alert -- is a strong indicator of staging and bulk data movement to external cloud
    storage; pivot to the responsible process and its parent lineage, the user/account and logon context,
    the source host and the files/directories accessed, and the destination cloud domain, ASN, and volume
    transferred, then determine whether the destination is sanctioned and the data sensitive. A negative
    result helps rule out this specific exfil vector but should be corroborated with the other questions
    in this playbook, since a single method can miss low-and-slow, living-off-the-land, or sanctioned-channel-abuse
    activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway / Egress Points, Enterprise DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ALLOW = sanctioned_cloud_providers; DENY = cti_storage_domains\nJOIN conn.log (id.resp_h,\
      \ id.resp_p) WITH ssl.log (server_name)\nWHERE classify_sni(server_name) == 'cloud_storage'\n  AND\
      \ (server_name NOT IN ALLOW OR server_name IN DENY OR id.resp_h IN DENY)\nALERT host=id.orig_h,\
      \ dest=server_name, reason='unsanctioned/deny-listed cloud storage'"
- question: '[Exfiltration] Identify non-browser / non-sanctioned-client TLS sessions to cloud-storage
    domains using JA3/JA4 client fingerprints -- specifically, using the Symbolic Logic approach to investigate
    the following evidence: A TCP/UDP network connection from an internal host to a domain or IP address
    that is present on a threat intelligence list of known malicious infrastructure or is an unsanctioned
    cloud storage provider not approved for corporate use.'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary exfiltrates sensitive
    data to a cloud storage service (e.g., Dropbox, Google Drive, OneDrive, Box, AWS S3, MEGA) instead
    of, or in addition to, the primary command-and-control channel, blending in with legitimate traffic
    when hosts already talk to these providers. This evidence focuses on the condition: A TCP/UDP network
    connection from an internal host to a domain or IP address that is present on a threat intelligence
    list of known malicious infrastructure or is an unsanctioned cloud storage provider not approved for
    corporate use. This Symbolic Logic approach works as follows: Compute [JA3/JA3S](https://github.com/salesforce/ja3)
    or [JA4+](https://github.com/FoxIO-LLC/ja4) fingerprints on TLS handshakes to cloud-storage SNIs and
    compare against an allow-list of fingerprints for sanctioned clients (corporate browser builds, OneDrive/Drive
    sync agents). Alert when a host reaches a sanctioned storage domain with an unrecognized fingerprint
    (rclone, curl, custom uploader), which indicates exfil tooling masquerading behind a legitimate destination.
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    staging and bulk data movement to external cloud storage; pivot to the responsible process and its
    parent lineage, the user/account and logon context, the source host and the files/directories accessed,
    and the destination cloud domain, ASN, and volume transferred, then determine whether the destination
    is sanctioned and the data sensitive. A negative result helps rule out this specific exfil vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    low-and-slow, living-off-the-land, or sanctioned-channel-abuse activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway / Egress Points, Enterprise DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'GOOD_FP = ja3_allowlist(corporate_browsers, onedrive_sync, gdrive_sync)

      FROM ssl.log WHERE classify_sni(server_name)==''cloud_storage''

      COMPUTE fp = ja3 (or ja4)

      WHERE fp NOT IN GOOD_FP

      ALERT host=id.orig_h, dest=server_name, ja3=fp, reason=''non-sanctioned TLS client to storage'''
- question: '[Exfiltration] Calculate the frequency of connections to all cloud storage provider domains
    across the enterprise over a 30-day window -- specifically, using the Statistical Method approach
    to investigate the following evidence: A TCP/UDP network connection from an internal host to a domain
    or IP address that is present on a threat intelligence list of known malicious infrastructure or is
    an unsanctioned cloud storage provider not approved for corporate use.'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary exfiltrates sensitive
    data to a cloud storage service (e.g., Dropbox, Google Drive, OneDrive, Box, AWS S3, MEGA) instead
    of, or in addition to, the primary command-and-control channel, blending in with legitimate traffic
    when hosts already talk to these providers. This evidence focuses on the condition: A TCP/UDP network
    connection from an internal host to a domain or IP address that is present on a threat intelligence
    list of known malicious infrastructure or is an unsanctioned cloud storage provider not approved for
    corporate use. This Statistical Method approach works as follows: Calculate per-domain connection
    frequency to all cloud-storage providers over a 30-day enterprise window. Flag domains in the bottom
    1st percentile of connection frequency or first-seen in the last 90 days as potentially unsanctioned/new
    adversary infrastructure. Failure-mode signal: separately track TLS handshake failures, resets, and
    proxy-blocked (HTTP 403/407) connection attempts to storage domains as a distinct indicator of probing
    or misconfigured exfil tooling, per [Nadler et al.](https://arxiv.org/abs/1709.08395). A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong indicator of staging and
    bulk data movement to external cloud storage; pivot to the responsible process and its parent lineage,
    the user/account and logon context, the source host and the files/directories accessed, and the destination
    cloud domain, ASN, and volume transferred, then determine whether the destination is sanctioned and
    the data sensitive. A negative result helps rule out this specific exfil vector but should be corroborated
    with the other questions in this playbook, since a single method can miss low-and-slow, living-off-the-land,
    or sanctioned-channel-abuse activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway / Egress Points, Enterprise DNS Resolvers'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'WINDOW = 30d

      freq = count_connections per cloud_storage_domain over WINDOW (enterprise-wide)

      FLAG domain WHERE percentile_rank(freq) <= 1 OR first_seen(domain) within last 90d

      -- failure-mode signal

      failures = count(tls_handshake_fail | rst | http_status in (403,407)) per storage_domain

      ALERT on rising probe/failure counts to storage domains'
- question: '[Exfiltration] Develop and deploy a Random Forest classification model trained on features
