    the files/directories accessed, and the destination cloud domain, ASN, and volume transferred, then
    determine whether the destination is sanctioned and the data sensitive. A negative result helps rule
    out this specific exfil vector but should be corroborated with the other questions in this playbook,
    since a single method can miss low-and-slow, living-off-the-land, or sanctioned-channel-abuse activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Internet Gateway / Egress Points, Enterprise DNS Resolvers'
  range: Last 90 days (training window; score in near-real-time)
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [sni, ja3, ja3s, resp_asn, duration, orig_bytes, resp_bytes, orig_bytes/resp_bytes]

      model = RandomForest.fit(labeled benign(sanctioned) vs malicious(cti/redteam))

      score = model.predict_proba(new_conn to cloud_storage)

      IF score.malicious > threshold: ALERT including top_3_feature_importances'
- question: '[Exfiltration] On endpoint command line logs (Windows Event ID 4688, PowerShell Event ID
    4104), apply regular expression matching to detect known exfiltration tool syntax, such as ''rclone
    copy'', ''aws s3 cp'', ''az storage blob upload'', ''curl -T'', or PowerShell''s ''Write-S3Object''
    cmdlet. -- specifically, using the Symbolic Logic approach to investigate the following evidence:
    The execution of a command-line utility with syntax known for uploading data to cloud storage services,
    such as ''rclone copy'', ''aws s3 cp'', or ''curl --upload-file''.'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary exfiltrates sensitive
    data to a cloud storage service (e.g., Dropbox, Google Drive, OneDrive, Box, AWS S3, MEGA) instead
    of, or in addition to, the primary command-and-control channel, blending in with legitimate traffic
    when hosts already talk to these providers. This evidence focuses on the condition: The execution
    of a command-line utility with syntax known for uploading data to cloud storage services, such as
    ''rclone copy'', ''aws s3 cp'', or ''curl --upload-file''. This Symbolic Logic approach works as follows:
    On command-line logs (Windows 4688, Sysmon EID 1, PowerShell 4104, auditd EXECVE), regex-match known
    cloud-exfil syntax: ''rclone (copy|sync|--config|--no-check-certificate|--transfers)'', ''aws s3 cp'',
    ''az storage blob upload'', ''gsutil cp'', ''curl -T/--upload-file'', ''Write-S3Object''. Mirrors
    the [PUA Rclone Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_rclone_execution.yml)
    and the rclone artifacts (rclone.conf, MEGA destinations) documented by [NCC Group](https://research.nccgroup.com/2021/05/27/detecting-rclone-an-effective-tool-for-exfiltration/)
    and the [DFIR Report REvil case](https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator of
    staging and bulk data movement to external cloud storage; pivot to the responsible process and its
    parent lineage, the user/account and logon context, the source host and the files/directories accessed,
    and the destination cloud domain, ASN, and volume transferred, then determine whether the destination
    is sanctioned and the data sensitive. A negative result helps rule out this specific exfil vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    low-and-slow, living-off-the-land, or sanctioned-channel-abuse activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Zeek http.log
  - 'NAI: User Workstations, Production Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "SOURCES: WinEventID 4688, Sysmon EID 1, PowerShell 4104, auditd EXECVE\nREGEX cmdline ~ 'rclone\
      \ (copy|sync|--config|--no-check-certificate|--transfers)'\n      OR 'aws s3 cp' OR 'az storage\
      \ blob upload' OR 'gsutil cp'\n      OR 'curl (-T|--upload-file)' OR 'Write-S3Object'\nALERT host,\
      \ user, process, cmdline"
- question: '[Exfiltration] Alert on creation or access of rclone configuration files and renamed-binary
