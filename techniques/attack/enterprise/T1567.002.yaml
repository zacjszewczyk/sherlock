    to investigate the following evidence: The creation of a large compressed file (e.g., .zip, .rar,
    .7z) on a host, immediately followed by a high-volume data upload from that same host to a cloud storage
    provider within a 15-minute window.'
  context: 'Why this matters: Under the Exfiltration tactic (TA0010), an adversary exfiltrates sensitive
