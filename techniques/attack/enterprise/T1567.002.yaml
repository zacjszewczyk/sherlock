name: 'T1567.002: Exfiltration to Cloud Storage'
id: 52ade4c2-dcbc-47e1-86e6-d2940b48f43a
description: 'This playbook helps an analyst investigate whether an adversary has exfiltrated sensitive
  data to a cloud storage service (such as Dropbox, Google Drive, OneDrive, Box, AWS S3, or MEGA) rather
  than, or in addition to, their primary command-and-control channel, as part of the Exfiltration tactic.
  Because many enterprises already communicate with these providers, this technique gives an adversary
  significant cover, so the hunt spans network egress telemetry (Zeek conn/ssl/dns/http/files logs), endpoint
  command-line and process telemetry (Windows Event ID 4688/4104, Sysmon, auditd, macOS unified logs),
  and authentication context (Windows Event ID 4624). It guides the analyst across several behavioral
  angles: connections to unsanctioned or threat-intel-flagged cloud storage domains; non-sanctioned TLS
  clients identified by JA3/JA4 fingerprints; execution of known exfil tooling syntax (rclone, aws s3
  cp, curl --upload-file, Write-S3Object) and rclone configuration/renamed-binary artifacts; the archive-then-upload
  staging chain; anomalously large or asymmetric upload volumes and low-and-slow scheduled exfil; and
  uploads initiated by system or non-interactive accounts and unexpected process/user/destination tuples.
  Detection methods combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning
  models (Random Forest, one-class SVM, HMM/LSTM, SARIMA, DBSCAN/Isolation Forest) so the analyst can
  corroborate suspected cloud exfiltration against process lineage, file access, account context, network
  fingerprints, and transferred data volume.'
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
