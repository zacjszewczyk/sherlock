    query: 'file_event WHERE path matches ''%APPDATA%\\rclone\\rclone.conf'' OR ''~/.config/rclone/rclone.conf''

      OR process WHERE PE.OriginalFileName==''Rsync for cloud storage'' AND image_name != ''rclone.exe''

      ALERT ''rclone config access or renamed rclone binary'', host, user, process'
- question: '[Exfiltration] For each command line execution event, calculate the Shannon entropy of the
    full command-line string -- specifically, using the Statistical Method approach to investigate the
    following evidence: The execution of a command-line utility with syntax known for uploading data to
    cloud storage services, such as ''rclone copy'', ''aws s3 cp'', or ''curl --upload-file''.'
