  - technology: SIEM/Stats pseudocode
    query: "FOR each cmdline event:\n  H = shannon_entropy(cmdline)\nbaseline per process_name (powershell.exe,\
      \ cmd.exe, ...)\nmz = modified_zscore(H, median, MAD)   # robust\nALERT WHERE mz > 3.5  (obfuscation\
