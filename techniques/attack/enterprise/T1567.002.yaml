    of a command-line utility with syntax known for uploading data to cloud storage services, such as
    ''rclone copy'', ''aws s3 cp'', or ''curl --upload-file''. This Statistical Method approach works
    as follows: Compute Shannon entropy of each command line and maintain a per-process-name baseline
    (e.g., powershell.exe, cmd.exe). Alert when entropy exceeds 3 standard deviations above the process-specific
    baseline, indicating obfuscation, embedded credentials, or base64 blobs. Use the outlier-robust modified
    Z-score (MAD) variant from [Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)
    to avoid distortion from a few long legitimate commands. A positive result -- a rule match, statistical
    outlier, or model alert -- is a strong indicator of staging and bulk data movement to external cloud
    storage; pivot to the responsible process and its parent lineage, the user/account and logon context,
