    `cloudfunctions.functions.create`/`sourceCodeSet` (GCP), or Azure Functions deploy where the request
    passes a privileged role via `iam:PassRole`/`iam.serviceAccounts.actAs`, attaches high-risk permissions
    (`iam:CreatePolicyVersion`, `sts:AssumeRole`, `iam:CreateAccessKey`), or contains wildcards (`"*"`)
    in action/resource. The PassRole+CreateFunction and actAs+function-deploy combinations are canonical
    privilege-escalation primitives ([AWS IAM Privilege Escalation, Rhino Security Labs](https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation/);
    [GCP Privilege Escalation Part 1, Rhino Security Labs](https://rhinosecuritylabs.com/gcp/privilege-escalation-google-cloud-platform-part-1/)).
    Also alert on event-driven persistence (CreateFunction + PutRule/PutTargets binding a function to
    events such as CreateUser) ([Backdooring an AWS Account, Grzelak](https://danielgrzelak.com/backdooring-an-aws-account-da007d36f8f9))
    and on `UpdateFunctionCode` overwrites of existing production functions ([Stratus Red Team: Overwrite
    Lambda Function Code](https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.lambda-overwrite-code/)).
    Event-name reference: [Serverless Execution (T1648), Threat Technique Catalog for AWS](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.html).
    Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive result indicates adversary-controlled
    serverless or hybrid code execution (and possible privilege escalation, persistence, or exfiltration)
    and warrants escalation and scoping; a negative result helps rule out abuse for the inspected function,
    account, host, or flow.'
