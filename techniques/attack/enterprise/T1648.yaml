    sharing links for files, or use the ''HTTP'' connector to send data to an external, non-corporate
    web service. Detection method (Symbolic Logic): Trigger on Microsoft 365 Unified Audit Log records
    where `Operation` is `FlowCreated` or `FlowUpdated` and the flow definition (`FlowDetails`) contains
    sensitive action names (''Send_an_email_V2'', ''Create_sharing_link_for_a_file_or_folder'', ''Response'',
    ''HTTP'') combined with external destinations or anonymous link settings — the covert M365 exfiltration
    pattern documented by [Using Power Automate for Covert Data Exfiltration in Microsoft 365, Varonis](https://www.varonis.com/blog/power-automate-data-exfiltration).
    Correlate with downstream `New-InboxRule` forwarding and anonymous SharePoint/OneDrive link creation
    events on the same user. Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive
    result indicates adversary-controlled serverless or hybrid code execution (and possible privilege
    escalation, persistence, or exfiltration) and warrants escalation and scoping; a negative result helps
    rule out abuse for the inspected function, account, host, or flow.'
  answer_sources:
  - Microsoft 365 Unified Audit Log
  - 'NAI: Microsoft 365 environment, User mailboxes (Exchange Online), Document libraries (SharePoint
    Online, OneDrive), Power Platform admin center.'
