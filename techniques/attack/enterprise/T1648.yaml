name: 'T1648: Serverless Execution'
id: f12a2a11-412e-464b-9572-63e18d81ac2a
description: Investigate suspected abuse of serverless computing, integration, and automation services
  to execute arbitrary code in cloud and hybrid environments. This playbook helps an analyst hunt for
  adversaries who create, modify, or overwrite serverless functions (AWS Lambda, Azure Functions, Google
  Cloud Functions) and SaaS/office automations (Power Automate flows, Google Apps Script) to run malicious
  code such as crypto-mining payloads, to escalate privilege via iam:PassRole / iam.serviceAccounts.actAs,
  and to establish event-triggered persistence. It correlates cloud audit logs (AWS CloudTrail, Azure
  Activity, GCP Audit, M365 Unified Audit Log) and function metrics with endpoint telemetry (Windows Event
  IDs 4688/4624) from hybrid service accounts and network egress evidence (Zeek conn.log/dns.log) to surface
  anomalous function lifecycle changes, abnormal invocation physics, suspicious process lineage, first-time
  internal access, and large outbound data transfers indicative of execution, privilege escalation, persistence,
  and exfiltration.
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any outbound connections originating from cloud serverless compute IP ranges reaching
    IPs or domains on a threat-intelligence feed, crypto-mining pools, or DoH resolvers used for covert
    C2?
  context: 'Evidence: An outbound network connection is initiated from a known cloud provider serverless
    compute IP range to an external IP address or domain on a threat intelligence feed of known malicious
    indicators. The connection may also exhibit anomalously high data transfer volume (e.g., >95th percentile
    of typical outbound volume from serverless functions). Detection method (Symbolic Logic): Continuously
    ingest and update lists of cloud provider serverless IP ranges (AWS/GCP/Azure published ranges) and
    a threat intelligence feed of malicious IPs/domains. Join Zeek conn.log records where `id.orig_h`
    is in the serverless IP list with the TI feed on the destination IP (`id.resp_h`); alert on any match.
    Additionally alert on egress from serverless ranges to known crypto-mining pools or public DNS-over-HTTPS
    resolvers (e.g., 1.1.1.1, 8.8.8.8, dns.google) by non-DNS function workloads, the exact evasion used
    by Denonia to hide C2/pool resolution ([Cado Discovers Denonia, the First Malware Targeting Lambda](https://www.cadosecurity.com/blog/cado-discovers-denonia-the-first-malware-specifically-targeting-lambda)).
    Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive result indicates adversary-controlled
    serverless or hybrid code execution (and possible privilege escalation, persistence, or exfiltration)
    and warrants escalation and scoping; a negative result helps rule out abuse for the inspected function,
    account, host, or flow.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, Internet gateways, DNS resolvers, Cloud provider serverless compute environments
    (e.g., AWS Lambda, Azure Functions, Google Cloud Functions).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>- ingest serverless_ranges (AWS/GCP/Azure published CIDRs) and ti_feed (malicious IPs/domains)

      from zeek_conn where id.orig_h in serverless_ranges

      join ti_feed on id.resp_h == ti.ip

      OR id.resp_h in mining_pool_list

      OR (dns.query in {1.1.1.1,8.8.8.8,dns.google} and function_workload != ''dns'')

      -> alert ''serverless egress to malicious/evasive destination'''
- question: Does any serverless function egress show outbound volume above the 95th percentile or a regular
    low-variance beacon cadence indicative of exfiltration or periodic callbacks?
  context: 'Evidence: An outbound network connection is initiated from a known cloud provider serverless
    compute IP range to an external IP address or domain on a threat intelligence feed of known malicious
    indicators. The connection may also exhibit anomalously high data transfer volume (e.g., >95th percentile
    of typical outbound volume from serverless functions). Detection method (Statistical Method): For
    connections originating from the serverless IP range (`id.orig_h`), establish a 30-day rolling baseline
    of outbound data volume (`orig_bytes`) and per-destination connection frequency (count/min). Calculate
    the 95th percentile for session volume and alert when a new connection''s `orig_bytes` exceeds it
    (potential exfiltration). In parallel, score inter-arrival/size regularity (low coefficient of variation)
    to surface periodic callbacks even when destination reputation is benign, and apply a modified Z-score
    (|Mz|>3.5) so batch jobs do not distort thresholds ([Detecting Threats in AWS CloudTrail Logs Using
    Machine Learning, Elastic](https://www.elastic.co/blog/detecting-threats-in-aws-cloudtrail-logs-using-machine-learning)).
    Failure mode: separately profile failed/blocked outbound connections and NXDOMAIN rates per function,
    which spike when an implant resolves dead C2/pool domains. Relevance to Execution (TA0002) for Serverless
    Execution (T1648): a positive result indicates adversary-controlled serverless or hybrid code execution
    (and possible privilege escalation, persistence, or exfiltration) and warrants escalation and scoping;
    a negative result helps rule out abuse for the inspected function, account, host, or flow.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, Internet gateways, DNS resolvers, Cloud provider serverless compute environments
    (e.g., AWS Lambda, Azure Functions, Google Cloud Functions).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">- baseline = rolling_30d(zeek_conn where id.orig_h in serverless_ranges)\np95 = percentile(baseline.orig_bytes,\
      \ 95)\nfor conn in new:\n  if conn.orig_bytes > p95: alert 'volume spike'\n  cv = stddev(inter_arrival)/mean(inter_arrival)\n\
      \  if cv < 0.1: alert 'periodic beacon'\n  if modified_zscore(conn.orig_bytes) > 3.5: alert\ntrack\
      \ NXDOMAIN / failed-conn rate per function for dead-C2 spikes"
- question: Does a trained classifier label outbound connections from serverless IP ranges as malicious
    C2 with high confidence, and which features drive that verdict?
  context: 'Evidence: An outbound network connection is initiated from a known cloud provider serverless
    compute IP range to an external IP address or domain on a threat intelligence feed of known malicious
    indicators. The connection may also exhibit anomalously high data transfer volume (e.g., >95th percentile
    of typical outbound volume from serverless functions). Detection method (Machine Learning): Train
    a Random Forest (or gradient-boosted) classifier on labeled Zeek conn.log records to identify malicious
    C2 traffic. Engineer features such as `duration`, `orig_bytes`, `resp_bytes`, `proto`, destination
    port, connection state (`conn_state`), failed-connection ratio, and the entropy of the destination
    domain (from dns.log). Apply to new outbound connections from serverless IPs, alert when classified
    malicious with confidence > 0.9, and surface the top-3 contributing features (e.g., domain entropy,
    byte ratio, beacon CV) in the alert text for triage ([A systematic review on the integration of explainable
    AI in IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    Generate labeled detonation telemetry for tuning with adversary-emulation tooling ([Stratus Red Team:
    Overwrite Lambda Function Code](https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.lambda-overwrite-code/)).
    Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive result indicates adversary-controlled
    serverless or hybrid code execution (and possible privilege escalation, persistence, or exfiltration)
    and warrants escalation and scoping; a negative result helps rule out abuse for the inspected function,
    account, host, or flow.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, Internet gateways, DNS resolvers, Cloud provider serverless compute environments
    (e.g., AWS Lambda, Azure Functions, Google Cloud Functions).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">- model = RandomForest/GBM trained on labeled zeek_conn\nfeatures = [duration,orig_bytes,resp_bytes,proto,resp_port,conn_state,failed_ratio,domain_entropy]\n\
      for conn in serverless_egress:\n  score = model.predict_proba(features)\n  if score > 0.9: alert\
      \ with top3_features(SHAP)"
- question: Did a dedicated hybrid-cloud service account launch processes whose command lines match known
    offensive tools, reconnaissance commands, or suspicious LOLBAS usage?
  context: 'Evidence: A process is created on a host (Windows Event ID 4688) by a dedicated service account
    used for hybrid cloud operations, and the process command line includes tools or parameters associated
    with reconnaissance, credential access, or execution of suspicious scripts (e.g., LOLBAS, PowerShell).
    Detection method (Symbolic Logic): Maintain a list of dedicated service accounts for hybrid cloud
    functions. Correlate successful logons (Event ID 4624) by these accounts with subsequent process creation
    events (Event ID 4688) using the `Logon ID`. Scan the `CommandLine` field with regular expressions
    for known malicious tools (`mimikatz`, `procdump`), reconnaissance commands (`whoami`, `nltest /dclist:*`,
    `net user`), or suspicious LOLBAS usage (`certutil.exe -urlcache`, `mshta.exe http://...`). Alert
    on any match. Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive result
    indicates adversary-controlled serverless or hybrid code execution (and possible privilege escalation,
    persistence, or exfiltration) and warrants escalation and scoping; a negative result helps rule out
    abuse for the inspected function, account, host, or flow.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Hybrid application servers, On-premise data stores, Endpoints of cloud administrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">- accounts = hybrid_service_account_list\njoin evt4624 (logon) with evt4688 (proc) on Logon\
      \ ID where SubjectUserName in accounts\nif regex(CommandLine, /(mimikatz|procdump|whoami|nltest\
      \ /dclist|net user|certutil.*-urlcache|mshta .*http)/i)\n  -> alert 'suspicious command by hybrid\
      \ service account'"
