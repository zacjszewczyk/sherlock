- question: Is a serverless-function service account authenticating or connecting to an internal host
    that is not on its explicit allow-list?
  context: 'Evidence: A service account associated with a serverless function authenticates (Windows Event
    ID 4624) or connects (Zeek conn.log) to an internal host for the first time, or the number of unique
    internal hosts accessed by the account in a 24-hour period exceeds a learned baseline by more than
    3 standard deviations. Detection method (Symbolic Logic): For each hybrid service account, maintain
    an explicit allow-list of internal hostnames/IPs it is authorized to access. Monitor Windows Event
    ID 4624 (`TargetServerName`, `IpAddress`) and Zeek conn.log (`id.resp_h`) for any authentication or
    connection attempt by the service account to a destination not on its specific allow-list. Alert immediately
    on any violation. Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive result
    indicates adversary-controlled serverless or hybrid code execution (and possible privilege escalation,
    persistence, or exfiltration) and warrants escalation and scoping; a negative result helps rule out
    abuse for the inspected function, account, host, or flow.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Internal network segments, Authentication servers (e.g., Domain Controllers, RADIUS), High-value
    data repositories (e.g., file servers, database servers), Crown jewel application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>- allowlist = per_account_allowed_hosts

      from evt4624(TargetServerName,IpAddress) + zeek_conn(id.resp_h) where account in service_accounts

      if dest not in allowlist[account]: alert ''access outside allow-list'''
