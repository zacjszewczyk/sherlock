- question: Does any function breach hard ceilings on duration/CPU/memory/egress or run continuously and
    beacon to mining pools, or is it invoked far more often than its known trigger schedule?
  context: 'Evidence: A serverless function exhibits anomalous execution physics consistent with abuse:
    invocation count/minute, execution duration, memory/CPU consumption, or per-invocation egress bytes
    far exceed the function''s historical baseline. This is the signature of crypto-mining or long-running
    malicious code embedded in a function (e.g., Denonia XMRig in AWS Lambda). Detection method (Symbolic
    Logic): Define per-function hard ceilings (e.g., duration approaching the configured timeout on most
    invocations, sustained max-memory use, or any single invocation transferring > N MB outbound) and
    alert when breached. Crypto-mining functions run at maximum duration/CPU for the full timeout and
    beacon to mining pools ([Cado Discovers Denonia, the First Malware Targeting Lambda](https://www.cadosecurity.com/blog/cado-discovers-denonia-the-first-malware-specifically-targeting-lambda)).
    Also alert on functions invoked far more frequently than their known trigger schedule ([Serverless
    Execution (T1648), Threat Technique Catalog for AWS](https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.html)).
    Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive result indicates adversary-controlled
    serverless or hybrid code execution (and possible privilege escalation, persistence, or exfiltration)
    and warrants escalation and scoping; a negative result helps rule out abuse for the inspected function,
    account, host, or flow.'
  answer_sources:
  - Cloud provider audit logs (e.g., AWS CloudTrail InvokeFunction)
  - Cloud function metrics/logs (e.g., AWS CloudWatch Lambda metrics, GCP Cloud Functions metrics)
  - Zeek conn.log
  - 'NAI: Serverless compute environments (AWS Lambda, Azure Functions, Google Cloud Functions), Cloud
    metric/billing pipelines, Network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">- per_function ceilings = {duration~timeout, sustained_max_mem, egress > N MB}\nfrom function_metrics\
      \ + cloudtrail InvokeFunction + zeek_conn\nif invocation breaches ceiling OR runs at max duration/CPU\
      \ full timeout OR invoke_rate >> trigger_schedule\n  -> alert 'crypto-mining / abusive function\
      \ execution'"
