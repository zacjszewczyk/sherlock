    data transfer to an external destination, where the session occurs within a short time window (e.g.,
    15 minutes) after a successful authentication by a hybrid service account on that same host. Detection
    method (Symbolic Logic): Correlate successful logons by hybrid service accounts (Windows Event ID
    4624 on a specific host) with subsequent outbound network connections from that same host''s IP address
    (Zeek conn.log `id.orig_h`) within a 15-minute window. Alert if the destination (`id.resp_h` or associated
    DNS query) is a known file-sharing or paste site (e.g., pastebin.com, mega.nz, anonfiles.com) or a
    public cloud storage bucket not owned by the organization. Relevance to Execution (TA0002) for Serverless
    Execution (T1648): a positive result indicates adversary-controlled serverless or hybrid code execution
    (and possible privilege escalation, persistence, or exfiltration) and warrants escalation and scoping;
    a negative result helps rule out abuse for the inspected function, account, host, or flow.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network Egress Points, Data staging servers, File shares, Hosts accessed by hybrid service accounts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">- join evt4624(host,time) with zeek_conn(id.orig_h==host, t within +15min)\nif id.resp_h/dns\
      \ in {pastebin.com,mega.nz,anonfiles.com, foreign_buckets}\n  -> alert 'post-logon exfil to external\
      \ sharing site'"
