- question: Did a hybrid service account spawn a high-risk parent-child process pair on a deny-list (e.g.,
    w3wp.exe->cmd.exe, sqlservr.exe->powershell.exe)?
  context: 'Evidence: A process created by a hybrid service account (Windows Event ID 4688) has an anomalous
    parent-child relationship that deviates from established operational norms, such as a web server process
    (`w3wp.exe`) spawning a command shell (`cmd.exe`) or a script interpreter (`python.exe`) spawning
    `powershell.exe`. Detection method (Symbolic Logic): Define and maintain a deny-list of high-risk
    parent-child process relationships for hybrid service accounts (e.g., Parent: `w3wp.exe`, Child: `cmd.exe`;
    Parent: `sqlservr.exe`, Child: `powershell.exe`; Parent: `python.exe`, Child: `rundll32.exe`). Create
    a rule to monitor Windows Event ID 4688 events where the `SubjectUserName` is a hybrid service account
    and the `CreatorProcessName` and `NewProcessName` fields match a forbidden pair. Alert on any match.
    Relevance to Execution (TA0002) for Serverless Execution (T1648): a positive result indicates adversary-controlled
    serverless or hybrid code execution (and possible privilege escalation, persistence, or exfiltration)
    and warrants escalation and scoping; a negative result helps rule out abuse for the inspected function,
    account, host, or flow.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Application servers running hybrid workloads, Web servers, Database servers, Critical infrastructure
    hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>- denylist = [(w3wp.exe,cmd.exe),(sqlservr.exe,powershell.exe),(python.exe,rundll32.exe),...]

      from evt4688 where SubjectUserName in hybrid_accounts

      if (CreatorProcessName, NewProcessName) in denylist: alert ''forbidden process lineage'''
