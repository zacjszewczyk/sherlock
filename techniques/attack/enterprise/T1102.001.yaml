questions:
- question: 'Using the symbolic logic approach ''Resolver-to-C2 correlation'', can you determine whether
    an adversary is operating a dead drop resolver against this environment? Specifically: Continuously
    ingest threat intelligence (malicious IPs/domains and known resolver platforms such as pastebin.com/raw,
    raw.githubusercontent.com, gist API, paste/note services) and join Zeek http.log/ssl.log and conn.log
    by source host and time; alert when a host fetches a resolver platform and, within five minutes, connects
    to a threat-listed, low-reputation, or newly-registered (<30 days) destination. Keep this hard 5-minute
    window and TI/age thresholds as deterministic floors [MITRE ATT&CK T1102.001](https://attack.mitre.org/techniques/T1102/001/),
    [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).'
  context: 'Tactic context (Command and Control): the adversary is trying to communicate with and control
    compromised systems while blending into legitimate, expected web traffic. In Dead Drop Resolver (T1102.001)
    the adversary posts obfuscated/encoded pointers to secondary C2 on trusted web services, so victims
    first fetch the resolver and are then redirected to dynamic back-end infrastructure. Evidence under
    investigation: An internal host connects to a URI on a known content-hosting platform (e.g., GitHub,
    Pastebin), and within a 5-minute window, initiates a new network connection to a destination that
    is either on a threat intelligence list, has a low reputation score, or is a newly registered domain
    (registered < 30 days ago). Approach (''Resolver-to-C2 correlation'', Symbolic Logic): Continuously
    ingest threat intelligence (malicious IPs/domains and known resolver platforms such as pastebin.com/raw,
    raw.githubusercontent.com, gist API, paste/note services) and join Zeek http.log/ssl.log and conn.log
    by source host and time; alert when a host fetches a resolver platform and, within five minutes, connects
    to a threat-listed, low-reputation, or newly-registered (<30 days) destination. Keep this hard 5-minute
    window and TI/age thresholds as deterministic floors [MITRE ATT&CK T1102.001](https://attack.mitre.org/techniques/T1102/001/),
    [Detecting Popular Cobalt Strike Malleable C2 Profile Techniques, Unit 42](https://unit42.paloaltonetworks.com/cobalt-strike-malleable-c2/).
    A positive result indicates a host is fetching dead-drop content and/or being steered to attacker-controlled
    C2 in a way that is inconsistent with normal browser-driven web activity; a negative result means
    the observed traffic and process behavior match expected baselines for that service. Pivot from any
    hit to the originating process and account, the resolver object that was fetched, and any downstream
    beaconing, redirection, or data transfer to the secondary C2 endpoint.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet Gateway/Egress Points, Corporate DNS Servers, Web Proxy Servers'
  range: Last 90 days (correlate related events within a 5-10 minute window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic logic: resolver fetch -> rapid C2 connection within 5 minutes\nLET resolver_hosts\
      \ = [\"raw.githubusercontent.com\",\"pastebin.com\",\"gist.githubusercontent.com\",\n          \
      \            \"*paste*\",\"*note*\",\"*gist*\"]\nJOIN zeek_http AS f, zeek_conn AS c ON f.src_ip\
      \ == c.src_ip\nWHERE f.host IN resolver_hosts\n  AND c.ts BETWEEN f.ts AND f.ts + 5min\n  AND (c.dst_ip\
      \ IN ti_malicious OR reputation(c.dst_ip) < LOW\n       OR domain_age(c.dst_domain) < 30d)\nEMIT\
      \ alert(src_ip, resolver=f.host, c2=c.dst_ip, gap=c.ts-f.ts)"
- question: 'Using the symbolic logic approach ''Resolver fetch failure profiling'', can you determine
    whether an adversary is operating a dead drop resolver against this environment? Specifically: Treat
    resolver-fetch error responses (HTTP 404/403/410, TLS reset, or blocked egress) as a distinct signal
    because stale or rotated dead-drops produce characteristic error bursts; alert when a single host
    generates >=3 failed fetches to raw-content URLs within 10 minutes followed by a successful fetch,
    indicating retry-until-live resolver behavior [MITRE ATT&CK T1102.001](https://attack.mitre.org/techniques/T1102/001/).'
