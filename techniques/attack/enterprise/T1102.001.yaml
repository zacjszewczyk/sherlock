name: 'T1102.001: Dead Drop Resolver'
id: fab67535-5282-4587-9d49-1996ec2c863f
description: 'This playbook helps an analyst determine whether an adversary is using a Dead Drop Resolver
  (T1102.001): abusing a legitimate external web service (e.g., GitHub/Gist, Pastebin, social media, raw-content
  hosts) to stage obfuscated or encoded pointers to back-end command-and-control (C2) infrastructure.
  Infected hosts fetch the resolver content and are then redirected to a secondary, dynamically changeable
  C2 endpoint, often hidden inside expected, SSL/TLS-encrypted web noise. Investigative angles include:
  correlating a fetch of a known resolver/raw-content platform with a rapid (<=5 minute) follow-on connection
  to a threat-listed, low-reputation, or newly-registered destination; profiling resolver-fetch error
  bursts that betray stale/rotated dead drops; flagging non-standard or rare programmatic User-Agent strings
  and anomalous JA3/JA4/JA4H TLS client fingerprints toward resolver hosts; detecting periodic low-jitter
  ''heartbeat'' beacons and volume/timing deviations from a per-host/service baseline; tying resolver
  connections back to unsigned, non-browser, or temp-path processes via host telemetry (Windows Event
  ID 4688/5156, Sysmon); and measuring URI/payload Shannon entropy and direct raw-content URL fetches.
  Detection blends symbolic-logic rules, statistical baselining (prevalence, percentiles, standard-deviation
  and beacon scoring), and machine learning (sequence/time-series models, clustering, autoencoders, Isolation
  Forest/Random Forest with SHAP explanations) to produce evasion-resistant, explainable alerts for the
  Command and Control tactic.'
type: technique
