name: 'T1559.001: Component Object Model'
id: 974b1c9f-e4bc-44e9-a4b6-e3c9e9ee59dc
description: 'Investigate adversary abuse of the Windows Component Object Model (COM) for local and remote
  (DCOM) code execution. COM is an inter-process communication facility in the native Windows API that
  lets a client object invoke methods of server objects implemented as DLLs (InProcServer32) or EXEs (LocalServer32).
  Adversaries activate COM objects by CLSID/ProgID to execute arbitrary code, create scheduled tasks,
  perform fileless download/execution, escalate privileges, or persist via COM hijacking. This playbook
  helps an analyst hunt for: process creation events referencing malicious or rare CLSIDs/ProgIDs and
  COM server binaries; COM surrogate host processes (dllhost.exe, svchost.exe, wmiprvse.exe, mmc.exe,
  explorer.exe) spawning script interpreters or LOLBAS children; COM host processes making anomalous or
  threat-intelligence-matched network connections (potential C2/exfiltration); inbound RPC Endpoint Mapper
  (TCP/135) traffic followed by network logons indicative of DCOM lateral movement; and registry modifications
  to CLSID class-store keys (HKCR/HKCU Software\Classes\CLSID, InProcServer32, LocalServer32, TreatAs)
  that precede execution and signal COM hijacking. It combines symbolic-logic detections, statistical
  prevalence/baselining methods, and machine learning approaches across endpoint and network telemetry.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any process creation events referencing a CLSID or ProgID that matches a known-malicious
    COM identifier from threat intelligence, or executing a COM server binary whose hash matches a known-bad
    blocklist?
  context: Adversaries activate COM objects by CLSID/ProgID (for example, dllhost.exe '/Processid:{CLSID}')
    to gain local code execution under the Execution tactic. Querying process creation logs for command
    lines that embed CLSIDs/ProgIDs flagged by a threat-intelligence feed, and comparing the activated
    COM server process/DLL hash against a blocklist of known malicious COM servers, gives a high-confidence
    detection. Enumerate the HKCR\CLSID class store to resolve identifiers. A positive match should generate
    a high-severity alert and warrant immediate host triage; a negative result reduces but does not eliminate
    suspicion because adversaries rotate CLSIDs and binaries.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EventID IN (4688,1)\n| where CommandLine matches /\\{[0-9A-Fa-f-]{36}\\}/ \n| extract clsid,\
      \ progid from CommandLine\n| lookup ti_clsid_feed on clsid OR progid\n| join hash from (Sysmon EventID=1\
      \ or 4688) to ti_com_server_blocklist on Hash\n| where ti_match=true | alert severity=high"
  - technology: Sysmon/pseudocode
    query: 'EventID=7 ImageLoaded where ImageLoaded path under InProcServer32

      | compute SHA256(ImageLoaded)

      | lookup com_server_blocklist | where match=true | alert'
- question: Which CLSIDs and COM server binaries are statistically rare across the enterprise, and which
    hosts show failed or access-denied COM activation attempts?
  context: 'Malicious COM artifacts tend to be extremely rare across a fleet (industry observation: roughly
    99.7% of malicious artifacts are uncommon). For each process creation event, parse the command line
    for GUID-formatted CLSIDs and resolve the activated COM server DLL/EXE via Sysmon Event ID 7 (ImageLoaded
    under an InProcServer32 path). Compute enterprise-wide prevalence of each CLSID and server hash over
    a rolling 30-day window and flag those below the 5th percentile (tune per environment). Separately,
    count failed/denied COM activations (Event ID 4663/4656 ACCESS_DENIED on CLSID keys) per host as a
    distinct anomaly that can indicate probing or misconfigured abuse attempts. Rare-but-benign software
    updates can cause false positives, so corroborate with signer state and parent process.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EventID IN (4688,1)

      | extract clsid from CommandLine

      | join ImageLoaded_hash from Sysmon EventID=7

      | stats dcount(host) as prevalence by clsid, ImageLoaded_hash over 30d

      | eventstats perc5(prevalence) as p5

      | where prevalence < p5 | alert'
  - technology: SIEM/Stats pseudocode
    query: 'EventID IN (4663,4656) where ObjectName contains ''CLSID'' AND Access=ACCESS_DENIED

      | stats count by host | where count > threshold | alert label=''failed_com_activation'''
- question: Does a supervised model score any COM activation event as high-probability malicious based
    on parent process, command-line entropy, CLSID prevalence, COM server load path/signer, and activation
    frequency?
  context: 'Train a classification model (Random Forest or Gradient Boosting) on labeled process-creation
    and module-load features: parent process name/host, command-line entropy, CLSID prevalence (volume),
    COM server load path and signer state, and count of activations per minute (frequency). Score new
    events and alert above a tuned confidence (e.g., >0.9). For explainable triage under the Execution
    tactic, surface the top-3 contributing features (for example ''CLSID prevalence=0.01%'', ''unsigned
    InProcServer32 DLL'', ''parent=Office''). This catches novel COM execution that evades static signatures
    while keeping analyst-readable rationale. Periodically retrain to address drift and monitor precision
    to control alert fatigue.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Application Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = [parent_proc, host, cmdline_entropy, clsid_prevalence, com_load_path, signer_state,
      activations_per_min]

      model = RandomForest/GradientBoosting(trained on labeled COM events)

      score = model.predict_proba(features)

      if score > 0.9: alert(top3=explain(features))'
- question: Is a COM surrogate host process (dllhost.exe, mmc.exe, wmiprvse.exe, svchost.exe/DComLaunch,
    or explorer.exe) spawning a script interpreter or LOLBAS such as powershell.exe, cmd.exe, cscript.exe,
    wscript.exe, mshta.exe, rundll32.exe, or certutil.exe?
  context: COM/DCOM activation frequently surfaces as a surrogate host process spawning an interpreter
    or living-off-the-land binary. The mmc.exe/MMC20.Application and wmiprvse.exe surrogate-spawn chains
    are canonical remote-activation (DCOM lateral movement) indicators, while dllhost.exe and svchost.exe
    (DComLaunch) chains indicate local COM execution. Monitor these high-risk parent-child pairs in process
    creation telemetry and trigger an immediate alert on any match. A positive result strongly suggests
    COM-based execution and should prompt examination of the child command line, network activity, and
    originating host; benign administrative automation must be allowlisted to reduce noise.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Web Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "EventID IN (4688,1)\n| where ParentImage IN (dllhost.exe,mmc.exe,wmiprvse.exe,svchost.exe,explorer.exe)\n\
      \  AND ChildImage IN (powershell.exe,cmd.exe,cscript.exe,wscript.exe,mshta.exe,rundll32.exe,certutil.exe)\n\
      | where not allowlisted(parent,child,cmdline) | alert severity=high"
- question: For each COM host process, which child-process and command-line argument combinations are
    previously unseen or historically rare, or which spawn-rate bursts exceed the host's normal ceiling?
  context: Build a 30-day baseline of each COM host's children, child command-line arguments, and spawn
    frequency (children/min). Compute the probability of each parent-child-argument tuple and alert on
    previously unseen tuples or those with historical probability below 1%, and on spawn-rate bursts exceeding
    the host's 99th percentile. This statistical approach catches abuse that uses otherwise-legitimate
    interpreters by focusing on rarity and burstiness rather than fixed signatures. Triage by separating
    benign admin automation from remote-origin activity (correlate with inbound RPC/network logon). A
    positive flag indicates anomalous execution worthy of deeper review.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Web Servers, Domain Controllers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'EventID IN (4688,1) where ParentImage IN (com_hosts)

      | stats count by ParentImage, ChildImage, arg_tuple over 30d -> prob

      | where prob < 0.01 OR first_seen=true | alert

      | also: stats spawn_rate by host,minute | where rate > perc99(host) | alert label=''spawn_burst'''
- question: Do clustering models isolate COM-host child processes as outliers based on command-line length,
    argument count, entropy, child image prevalence, and spawn frequency?
  context: 'Apply clustering (e.g., DBSCAN) to feature vectors derived from COM-host child processes:
    command-line length, argument count, character entropy, child image prevalence, and spawn frequency.
    Normal execution forms dense clusters; investigate small/isolated clusters and noise points as deviations.
    Report the top-3 features driving each flagged point (for example ''entropy=5.8'', ''rare child image'',
    ''parent=dllhost surrogate'') for explainability. This unsupervised method surfaces novel COM execution
    patterns that signature and rarity rules miss, supporting the Execution tactic hunt. Validate flagged
    points against known benign automation before escalation.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Application Servers, Web Servers, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = vectorize(com_child_events, [cmdline_len, arg_count, entropy, child_prevalence, spawn_freq])

      labels = DBSCAN(eps, min_samples).fit(X)

      for point in noise_or_small_clusters: alert(top3=explain(point))'
- question: Is a COM surrogate host (dllhost.exe, wmiprvse.exe, mmc.exe) initiating a network connection
    to a destination IP or domain present on a threat-intelligence feed?
  context: After local COM execution, a compromised COM surrogate may reach out for C2 or to download
    additional payloads. Correlate process creation (Event ID 4688) with network connection events (Sysmon
    Event ID 3 / Zeek conn.log) by host and timestamp, and alert if a COM surrogate host initiates a connection
    to a TI-flagged destination IP/domain. Legitimate COM/DCOM activation hosts have well-understood network
    behavior; deviations toward known-bad infrastructure are highly suspicious. A positive match should
    trigger containment review of the host and pivoting on the destination. Keep TI feeds current to limit
    stale-indicator misses.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint Devices, Network Egress Points (Firewalls/Gateways), DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join (EventID=4688 where Image IN (dllhost.exe,wmiprvse.exe,mmc.exe))\n  with (Sysmon EventID=3\
      \ OR Zeek conn.log) on host,time_window\n| lookup ti_feed on dest_ip OR dest_domain\n| where ti_match=true\
      \ | alert severity=high"
- question: Which COM host network connections deviate from the process's 30-day baseline of destinations,
    ports, frequency, and outbound volume, or show beaconing periodicity, NXDOMAIN, or failed-connection
    spikes?
  context: 'Baseline 30 days of network behavior per COM host: destination prevalence, destination ports,
    connections/hour (frequency), and outbound orig_bytes (volume). Maintain the common-port set and the
    95th-percentile volume threshold; alert on connections exceeding the volume threshold, to non-baseline
    ports, or to bottom-percentile-prevalence destinations. Add beaconing-cadence detection via FFT to
    catch periodic C2. As a failure-mode signal, track NXDOMAIN (Zeek dns.log) and blocked/failed connection
    ratios from COM hosts as distinct exfil/C2 indicators. This statistical layer detects anomalous egress
    even to non-TI infrastructure, supporting C2/exfiltration hunting tied to COM execution.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint Devices, Network Egress Points (Firewalls/Gateways), DNS Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline per com_host over 30d: dest_prevalence, port_set, conn_per_hour, perc95(orig_bytes)

      | alert if orig_bytes>perc95 OR port not in port_set OR dest_prevalence in bottom5pct

      | FFT(conn_timestamps) -> flag periodic beacon'
  - technology: Zeek/pseudocode
    query: 'dns.log: stats nxdomain_ratio by orig_host; conn.log: stats failed_conn_ratio by orig_host

      | where ratio > threshold AND orig_host runs com surrogate | alert'
- question: Does a time-series model flag sharp deviations in hourly outbound bytes or connection counts
    for a COM host versus its forecast, indicating possible C2 or exfiltration?
  context: Build a time-series anomaly model (Seasonal-ARIMA or LSTM) on hourly outbound orig_bytes and
    connection counts per COM host. Flag sharp deviations from the forecast as potential C2/exfiltration
    and surface the top-3 contributors (for example 'orig_bytes 12x forecast', 'new destination ASN',
    'periodic 60s interval'). Robust periodicity ranking helps suppress benign periodic services so true
    beacons stand out. This catches volumetric and rhythmic anomalies that fixed thresholds miss. A positive
    forecast deviation warrants correlation with the COM host's process lineage and destination reputation
    before escalation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Endpoint Devices, Network Egress Points (Firewalls/Gateways), DNS Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'series = hourly(orig_bytes, conn_count) per com_host

      model = SARIMA/LSTM.fit(series)

      residual = observed - forecast

      if abs(residual) > k*sigma: alert(top3=explain(residual, dest_asn, periodicity))'
- question: Does a network logon (Event ID 4624, Logon Type 3) on a critical server follow inbound TCP/135
    (RPC Endpoint Mapper) traffic within five minutes from a source not on the administrative allowlist,
    with a subsequent DCOM surrogate spawn?
  context: DCOM lateral movement activates remote COM objects over the RPC Endpoint Mapper (TCP/135).
    Maintain an allowlist of authorized administrative source IPs for critical servers, then join Zeek
    conn.log on TCP/135 with network logons (Event ID 4624, Logon Type 3) on the destination and the subsequent
    DCOM surrogate spawn. Alert if a logon follows a TCP/135 connection within 5 minutes from a non-allowlisted
    source. This sequence is a strong incoming-DCOM lateral-movement indicator. A positive result suggests
    an attacker pivoting between hosts and should trigger investigation of both source and destination,
    including the spawned surrogate's children.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, Member Servers, Internal Network Segments, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'join (Zeek conn.log where dest_port=135) -> (EventID=4624 LogonType=3 on dest) within 5m

      | where src_ip not in admin_allowlist

      | join subsequent DCOM surrogate spawn (dllhost/mmc/wmiprvse) on dest | alert severity=high'
- question: Which source-destination host pairs involving TCP/135 are first-seen or in the bottom 5th
    percentile of frequency, and which sources show spikes in failed network logons or RPC access-denied
    responses?
  context: Build a 30-day graph of source-destination host pairs involving TCP/135 (Zeek conn.log). Score
    each edge by first-seen status and frequency, and alert on first-occurrence edges or those in the
    bottom 5th percentile, indicating an unusual lateral-movement path and structural-login deviation.
    As a failure-mode signal, profile failed network logons (Event ID 4625) and RPC access-denied responses
    per source as distinct brute-force/abuse indicators. Rare RPC edges between hosts that never normally
    communicate are a hallmark of DCOM-based lateral movement. Corroborate flagged edges with logon outcomes
    and the spawned process lineage before escalation.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, Member Servers, Internal Network Segments, VPN Concentrators'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'graph edges (src,dst) where port=135 over 30d

      | score by first_seen, frequency

      | where first_seen=true OR frequency in bottom5pct | alert

      | also: stats failed_logon(4625), rpc_access_denied by src | where spike | alert'
- question: Do graph-ML models flag a new DCOM/RPC edge that bridges previously disconnected host communities,
    indicating anomalous lateral movement?
  context: Model hosts as nodes and DCOM/RPC interactions as edges. Use unsupervised graph embedding /
    community detection to learn normal operational clusters and alert when a new edge bridges previously
    disconnected communities. Report the top-3 contributing factors (for example 'new source-dest edge',
    'cross-community bridge', 'edge frequency=0'). Bridging edges between otherwise-isolated clusters
    are a strong signal of an attacker traversing the network via DCOM, which simple pairwise rarity may
    miss. Validate against legitimate new administrative relationships (e.g., onboarding of a new jump
    host) before escalating.
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4624
  - Windows Event ID 4625
  - 'NAI: Domain Controllers, Member Servers, Internal Network Segments, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = graph(nodes=hosts, edges=dcom_rpc_interactions)

      emb = node_embedding(G); communities = detect(emb)

      for new_edge: if bridges(community_a, community_b): alert(top3=[''new edge'',''cross-community bridge'',''freq=0''])'
- question: Is a registry write to a CLSID class-store key (HKCR\CLSID, HKCU\Software\Classes\CLSID, or
    InProcServer32/LocalServer32/TreatAs) followed within five minutes by creation of the associated application,
    or a COM host loading an InProcServer32 DLL from a user-writable or unsigned path?
  context: 'COM hijacking abuses the class-store lookup order: per-user CLSID entries (HKCU\Software\Classes\CLSID)
    shadow machine-wide HKLM entries, and InProcServer32/LocalServer32/TreatAs redirection points a legitimate
    CLSID at attacker-controlled code. Trigger when such a registry write (Event ID 4657 / Sysmon Event
    ID 13) is followed within 5 minutes on the same host by creation (Event ID 4688) of the associated
    application, establishing the hijack-then-execute pattern. Also flag a COM host loading an InProcServer32
    DLL from a user-writable/unsigned path (Sysmon Event ID 7). A positive result indicates likely COM
    hijacking for persistence or privilege escalation and warrants registry/DLL forensics.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Terminal Servers, Enterprise Registry Hives'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "join (EventID=4657 OR Sysmon EventID=13 where ObjectName contains 'Classes\\\\CLSID' OR 'InProcServer32'\
      \ OR 'LocalServer32' OR 'TreatAs')\n  -> (EventID=4688 of associated app) within 5m on same host\
      \ | alert\n| also: Sysmon EventID=7 where InProcServer32 DLL path is user-writable OR unsigned |\
      \ alert"
- question: Does a host's count of registry modifications to COM-related keys exceed three standard deviations
    above its 7-day baseline in a one-hour window, and is the targeted CLSID rare across the fleet?
  context: Automated COM tampering produces bursts of registry writes to CLSID keys. For each host, baseline
    the frequency (count/hour) of registry modifications to COM-related keys using a 7-day moving average
    and standard deviation, then alert when a one-hour count exceeds 3 standard deviations above baseline,
    indicating automated tampering. Cross-check the rarity of the targeted CLSID against fleet prevalence
    to distinguish broad legitimate software changes from targeted hijacking. This statistical method
    catches scripted COM-hijack deployment. A positive spike combined with a rare CLSID is high-confidence
    and should be triaged with the correlated process-creation evidence.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Terminal Servers, Enterprise Registry Hives'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host: baseline mean,std of com_registry_mods/hour over 7d (moving avg)

      | where count_1h > mean + 3*std | alert

      | lookup clsid_fleet_prevalence | where prevalence low -> raise severity'
- question: Does a provenance/sequence model flag a low-probability causal chain such as registry write
    -> COM activation -> module load -> process spawn?
  context: Train a provenance/sequence model (whole-system provenance graph autoencoder or LSTM) on typical
    event chains (registry write -> COM activation -> module load -> process spawn) and flag low-probability
    causal subgraphs, surfacing the reconstructed path for triage. Report the top-3 anomalous edges (for
    example 'HKCU CLSID write', 'unsigned InProcServer32 load', 'rare parent->child') for explainability.
    Modeling the full causal sequence catches COM hijacking and execution chains that look benign when
    each event is viewed in isolation. A flagged subgraph should be reviewed end-to-end against known-good
    software behavior before escalation, supporting the Execution tactic investigation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 7
  - 'NAI: User Workstations, Terminal Servers, Enterprise Registry Hives'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'build provenance graph: reg_write -> com_activation -> module_load -> process_spawn

      model = GraphAutoencoder/LSTM.fit(normal_chains)

      if reconstruction_prob(subgraph) < threshold: alert(top3_edges=explain(subgraph))'
