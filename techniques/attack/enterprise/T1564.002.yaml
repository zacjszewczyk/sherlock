name: 'T1564.002: Hide Artifacts: Hidden Users'
id: fa25cb8b-cfea-4e20-9fb3-849988f197d2
description: 'Investigate whether an adversary is using hidden user accounts to conceal the presence of
  accounts they created or modified, thereby evading discovery while maintaining covert access. This playbook
  helps an analyst hunt across Windows, macOS, and Linux for the create-then-hide tradecraft: new accounts
  whose names deviate from naming conventions (a trailing ''$'', high entropy, or tool-generated patterns);
  Windows registry edits that set HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList
  to 0 to hide an account from the logon screen; reg.exe/PowerShell command lines that perform that hiding;
  tight create-to-hide event sequences on the same host; authentications and network activity attributed
  to confirmed hidden accounts; macOS dscl IsHidden/UniqueID<500, Hide500Users plist edits, and chflags
  hidden on home folders; and Linux display-manager/greeter changes (gsettings disable-user-list, /etc/gdm3,
  /etc/lightdm, AccountsService SystemAccount=true). For each behavior it offers deterministic rules,
  statistical/anomaly scoring, and machine-learning approaches so the analyst can confirm hidden-account
  abuse and scope follow-on activity.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
