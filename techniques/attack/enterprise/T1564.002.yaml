questions:
- question: Was a new Windows user account created (Event ID 4720) whose Target User Name ends in '$'
    or matches a watchlist/regex of tool-generated names, suggesting a deliberately disguised hidden account?
  context: Adversaries hiding accounts often give them machine-like names ending in '$' or synthetic names
    produced by tooling so they blend into account noise. As a Stealth (TA0005) behavior the goal is to
    keep a foothold account from standing out. Build a deterministic rule on Event ID 4720 that fires
    when Target User Name ends in '$' (excluding legitimate machine and HomeGroupUser$ accounts) or matches
    a watchlist/regex of known tool patterns such as /^support_[a-f0-9]{6}$/, per the SigmaHQ hidden-user-creation
    rule and the create-then-hide tradecraft in The DFIR Report 'SELECT XMRig FROM SQLServer'. A positive
    result is a high-confidence lead to inspect the account, its creator, and any immediate hide action;
    a negative result does not clear the host since attackers may use convention-compliant names. Validate
    with Atomic Red Team T1564.002.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search EventCode=4720\n| where (TargetUserName endswith \"$\" AND TargetUserName NOT IN machine_account_allowlist\
      \ AND TargetUserName!=\"HomeGroupUser$\")\n   OR match(TargetUserName, \"^support_[a-f0-9]{6}$\"\
      )\n   OR TargetUserName IN tool_name_watchlist\n| table _time, host, SubjectUserName, TargetUserName"
- question: Does the Target User Name of any new account (Event ID 4720) show abnormally high character
    entropy or KL divergence relative to the organization's legitimate-username corpus, indicating a randomly
    generated or synthetic hidden account?
  context: Tool-generated account names tend to look random compared to human-chosen names. For Stealth
    (TA0005), scoring name randomness catches disguised accounts that evade a fixed regex. For each 4720,
    compute Shannon entropy and KL divergence of the Target User Name against a baseline distribution
    of legitimate usernames; alert when entropy exceeds the 98th percentile or KL divergence versus the
    org name corpus is high (KL divergence outperforms raw entropy on short strings). Correlate with bursts
    of failed logons (4625) naming the new account as a failure-mode signal. Derive percentile thresholds
    per environment from 30-90 days of 4720 names. A high score warrants account inspection; thresholds
    should be tuned to control false positives from legitimate service accounts.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EventCode=4720

      | eval ent=shannon_entropy(TargetUserName), kl=kl_divergence(TargetUserName, org_name_corpus)

      | eventstats perc98(ent) as ent_p98

      | where ent>ent_p98 OR kl>kl_threshold

      | join TargetUserName [search EventCode=4625 | stats count as failed_logons by TargetUserName]

      | table _time, host, TargetUserName, ent, kl, failed_logons'
- question: When scored by an unsupervised model trained on legitimate username character n-grams, is
    any new account name (Event ID 4720) flagged as an outlier, and which features drive that anomaly?
  context: A label-free model generalizes beyond fixed rules and entropy thresholds to catch novel hidden-account
    naming. For Stealth (TA0005), train a one-class SVM or autoencoder on character trigram frequencies
    of existing legitimate usernames and classify each new 4720 name as inlier/outlier, emitting the top-3
    contributing n-grams/features for analyst triage. An Isolation Forest over name features (entropy,
    length, n-grams, digit ratio) provides a fast parallel score. Outliers should be reviewed alongside
    who created the account and any subsequent hide actions; explainable feature output keeps the alert
    actionable and reduces blind trust in the model.
  answer_sources:
  - Windows Event ID 4720
  - 'NAI: Domain Controllers, Member Servers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = OneClassSVM(features=char_trigram_freq) trained on legit_usernames\nfor name in EventCode=4720.TargetUserName:\n\
      \    score = model.decision_function(name)\n    if score < inlier_threshold:\n        alert(name,\
      \ top3_contrib_ngrams(name))\n# parallel: IsolationForest(features=[entropy,length,ngram,digit_ratio])"
- question: Did a registry modification (Sysmon Event ID 13/14 or Windows Event ID 4657) set a UserList
    subkey under Winlogon\SpecialAccounts to DWORD 0, hiding an account from the Windows logon screen?
  context: Setting a user's value to 0 under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList
    removes that account from the logon screen - the canonical Windows hidden-user technique. This is
    core Stealth (TA0005) tradecraft. Build a high-fidelity deterministic alert when a registry set (Sysmon
    13 or EID 4657) targets an object containing '\Winlogon\SpecialAccounts\UserList' with value 0 / 'DWORD
    (0x00000000)', per the SigmaHQ SpecialAccounts rule and CISA Alert TA18-074A. Keep this deterministic
    threshold as the floor - it is rarely benign. A positive result identifies the hidden account and
    host; pivot to the writing process and the account's creation event.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - 'NAI: Windows Endpoint and Server Registries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search (EventCode=13 OR EventCode=14 OR EventCode=4657)\n| where like(TargetObject, \"%\\\\\
      Winlogon\\\\SpecialAccounts\\\\UserList%\")\n   AND (Details=\"DWORD (0x00000000)\" OR NewValue=0)\n\
      | table _time, host, Image, TargetObject, Details"
- question: Is the parent/writing process that modified the SpecialAccounts\UserList key a statistically
    rare one (e.g., winword.exe, user-directory PowerShell, sqlservr.exe) for that operation?
  context: Legitimate hiding of accounts via UserList is itself uncommon, and when it does occur it tends
    to come from a narrow set of admin tools. For Stealth (TA0005), profiling the writing/parent process
    exposes abuse where an unexpected process performs the edit - the sqlservr.exe lineage seen in The
    DFIR Report. Maintain a frequency baseline of parent process names that modify the UserList key and
    compute the conditional probability P(parent | UserList-write) over 30-90 days, alerting when a rare
    parent writes it below an environment-tuned threshold. A low-probability parent (Office app, browser,
    database service) is a strong abuse indicator even if the rule floor also fires.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - 'NAI: Windows Endpoint and Server Registries'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search (EventCode=13 OR EventCode=4657) TargetObject="*\\SpecialAccounts\\UserList*"

      | eval parent=ParentImage

      | eventstats count as total, count(eval(parent==parent)) as pc by parent

      | eval p_parent = pc/total

      | where p_parent < rarity_threshold

      | table _time, host, parent, Image, TargetObject, p_parent'
- question: Does the per-host hourly volume of SpecialAccounts\UserList writes exceed a forecasted baseline,
    indicating scripted or bulk account-hiding?
  context: A spike of UserList modifications suggests automation hiding multiple accounts at once - a
    sign of broader compromise rather than a single admin action. For Stealth (TA0005), forecast per-host
    hourly counts of SpecialAccounts\UserList writes (e.g., SARIMA) and alert when observed volume exceeds
    forecast plus its confidence interval, surfacing the top-3 drivers (host, parent process, count vs
    forecast). A UEBA rare-operation score offers an explainable managed alternative. Exceeding the forecast
    warrants immediate scoping of all accounts hidden in that window; normal low/zero volume is expected
    on most hosts.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - 'NAI: Windows Endpoint and Server Registries'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "series = hourly_count(UserList_writes) by host\nforecast = SARIMA(series).predict()\nif observed\
      \ > forecast + CI_upper:\n    alert(host, observed, forecast, top3_drivers=[host,parent,count])"
- question: Did a process creation event (Event ID 4688 / Sysmon Event ID 1) show reg.exe or PowerShell
    adding a SpecialAccounts\UserList subkey with /d 0 to hide a user account?
  context: The hide action is frequently performed from the command line via reg.exe add ... /d 0, which
    leaves a clear command-line artifact even when registry auditing is incomplete. This is direct Stealth
    (TA0005) tradecraft. Inspect the CommandLine in process creation (4688/Sysmon 1) for reg.exe with
    all of [SpecialAccounts\UserList, add, /v, /d 0], per the SigmaHQ command-line rule; a representative
    regex is /reg\.exe\s+add\s+"HKLM\\.*Winlogon\\SpecialAccounts\\UserList.*"\s+/d\s+0/i. Tune, do not
    delete, this threshold. A match gives both the hidden account and the executing user/parent process
    for rapid scoping.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Command-Line Logs, Server Command-Line Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search (EventCode=4688 OR EventCode=1)\n| where match(CommandLine, \"(?i)reg(\\.exe)?\\s+add\\\
      s+.*Winlogon\\\\SpecialAccounts\\\\UserList.*\\s+/d\\s+0\")\n   OR (CommandLine LIKE \"%SpecialAccounts\\\
      \\UserList%\" AND CommandLine LIKE \"%/d 0%\")\n| table _time, host, User, ParentImage, CommandLine"
- question: For reg.exe executions touching SpecialAccounts\UserList, is the parent-child process relationship
    statistically improbable or the command line abnormally high-entropy?
  context: Even when the command-line content matches, the lineage tells you whether it is admin activity
    or abuse. For Stealth (TA0005), score the parent-child probability from historical data for every
    reg.exe execution that touches SpecialAccounts\UserList and alert on low-probability parents (Office,
    browsers, sqlservr.exe), per The DFIR Report. Also score command-line entropy/length as a tunable
    statistical signal, following Elastic's high-command-line-entropy approach. A rare parent or anomalously
    complex/obfuscated command line elevates an otherwise routine reg.exe event into a priority lead.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Command-Line Logs, Server Command-Line Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search (EventCode=4688 OR EventCode=1) CommandLine="*SpecialAccounts\\UserList*"

      | eval pair=ParentImage.">".Image, ent=shannon_entropy(CommandLine)

      | eventstats count as tot, count(eval(pair==pair)) as pc by pair

      | eval p_pair=pc/tot

      | where p_pair < rarity_threshold OR ent > entropy_threshold

      | table _time, host, ParentImage, Image, p_pair, ent, CommandLine'
- question: When command lines are embedded and scored by an unsupervised/ML classifier, is the reg.exe
    hidden-account command flagged as an outlier, and which tokens drive the score?
  context: Attackers vary syntax to dodge fixed regexes; an embedding model captures semantic similarity
    to hiding behavior regardless of exact wording. For Stealth (TA0005), embed command lines with a BERT-style
    model and apply unsupervised outlier detection (COPOD/Isolation Forest/PCA/autoencoder), or train
    a Random Forest on features (arg entropy, length, parent name, presence of 'SpecialAccounts'/'Winlogon'/'/d
    0'), reporting the top-3 contributing tokens/features per alert, per CrowdStrike's command-line anomaly
    work. Flagged commands with tokens like 'SpecialAccounts' and '/d 0' are strong leads; explainable
    output prevents blind reliance on the model.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint Command-Line Logs, Server Command-Line Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "emb = BERT_embed(CommandLine)\nscore = IsolationForest/COPOD(emb).score()\n# or RF on [arg_entropy,length,parent,has_SpecialAccounts,has_/d\
      \ 0]\nif score outlier:\n    alert(host, CommandLine, top3_tokens)"
- question: Was an account creation (Event ID 4720) followed within ~5 minutes by a SpecialAccounts\UserList
    hide event for the same account on the same host (the canonical create-then-hide chain)?
  context: The strongest single signal of malicious hidden-account use is creating an account and immediately
    hiding it - legitimate admins rarely do both in quick succession. For Stealth (TA0005), implement
    a stateful SIEM correlation that fires when a 4720 for a Target User Name on a host is followed by
    a SpecialAccounts\UserList hide event (Sysmon 13 / 4657 / reg.exe 4688) for the same user on the same
    host within 5 minutes, per CISA Alert TA18-074A and The DFIR Report. A firing correlation is high
    confidence and should trigger account disablement review and host investigation.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers, Endpoint Device Event Logs, Server Event Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "search EventCode=4720\n| join type=inner host, TargetUserName max=1 [\n    search (EventCode=13\
      \ OR EventCode=4657 OR EventCode=4688)\n    (TargetObject=\"*SpecialAccounts\\\\UserList*\" OR CommandLine=\"\
      *SpecialAccounts\\\\UserList*\") ]\n| eval delta=hide_time-create_time\n| where delta>=0 AND delta<=300\n\
      | table _time, host, TargetUserName, create_time, hide_time, delta"
- question: Is the time delta between account creation (4720) and the corresponding hide event abnormally
    short (below the 5th percentile) for the environment?
  context: Rather than a fixed 5-minute window, an environment-derived percentile adapts to local admin
    behavior and catches near-instant create-then-hide automation. For Stealth (TA0005), track the time
    delta between 4720 and the hide event per host and alert when the delta falls below the 5th percentile
    (typically <5 min), since legitimate account creation is rarely followed immediately by hiding. Treat
    repeated sub-minute deltas (volume/frequency) as escalation. A sub-5th-percentile delta, especially
    repeated, strongly indicates scripted attacker behavior; derive the percentile from environment history.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers, Endpoint Device Event Logs, Server Event Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '<paired 4720->hide events per host/user>

      | eval delta=hide_time-create_time

      | eventstats perc5(delta) as d_p5

      | where delta < d_p5

      | stats count as occurrences min(delta) as fastest by host, TargetUserName

      | where occurrences>=1'
- question: Does an event-sequence model (HMM) flag the transition from account creation to a SpecialAccounts
    hide as a low-probability sequence compared to normal account lifecycles?
  context: Normal accounts follow predictable event sequences (4720 -> 4624 -> 4634); a creation immediately
    followed by hiding is an improbable transition a sequence model will surface. For Stealth (TA0005),
    train an HMM on normal user-event sequences and flag low-probability transitions such as 4720 -> SpecialAccounts
    hide, reporting the improbable transition and its likelihood in the alert. This catches create-then-hide
    chains even when timing or syntax varies from the deterministic rule, and the reported likelihood
    helps analysts prioritize. Low-probability sequences merit account and host review.
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers, Endpoint Device Event Logs, Server Event Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "hmm = HMM().fit(normal_sequences=[4720,4624,4634,...])\nfor seq in per_account_event_sequences:\n\
      \    p = hmm.score(seq)\n    if contains_transition(seq, '4720->SpecialAccounts_hide') and p < threshold:\n\
      \        alert(account, host, transition, p)"
- question: Is there any authentication (Event ID 4624, logon types 2/3/10) or network flow (Zeek conn.log/dns.log)
    attributed to an account confirmed hidden via SpecialAccounts\UserList=0 or hidden macOS/Linux attributes?
  context: A hidden account that is actually being used for logon or network activity confirms active
    adversary operations, not merely staging. For Stealth (TA0005), periodically enumerate hidden users
    (Windows SpecialAccounts\UserList=0; macOS dscl IsHidden/UID<500) into a high-priority watchlist and
    raise a critical alert on any 4624 (types 2/3/10) or Zeek flow attributed to a watchlisted account,
    per MITRE CAR-2016-04-004 and the enumeration commands in MITRE T1564.002. Any hit here is a confirmed-active
    hidden account and should drive immediate containment and scoping of its connections.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Authentication Servers, Network Gateway, DNS Servers, Endpoint Device Event Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '| inputlookup hidden_user_watchlist

      | join TargetUserName [search EventCode=4624 LogonType IN (2,3,10)]

      | append [search index=zeek sourcetype IN (conn,dns) user IN hidden_user_watchlist]

      | table _time, host, TargetUserName, LogonType, src_ip, dest_ip, query'
- question: Do hidden accounts exhibit anomalous failed-logon (4625) or access-denied rates, or successful
    logons from geolocations/ISPs with near-zero historical probability?
  context: Hidden accounts used by adversaries often show failure-mode bursts (password spraying/lateral
    attempts) or successful logons from unusual sources. For Stealth (TA0005), profile failure-mode signals
    distinctly - count 4625 failed-logon and access-denied events per hidden account - and enrich successful
    4624 (type 3/10) source IPs with geolocation, alerting when a hidden account logs in from a country/ISP
    with near-zero historical probability or generates anomalous failed/blocked-connection rates. Anomalous
    geo or failure rates on a hidden account are strong indicators of remote adversary use; tune against
    the account's own history.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Authentication Servers, Network Gateway, DNS Servers, Endpoint Device Event Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search (EventCode=4624 OR EventCode=4625) TargetUserName IN hidden_user_watchlist

      | iplocation src_ip

      | stats count(eval(EventCode=4625)) as fails, dc(Country) as geos, values(Country) as countries
      by TargetUserName

      | eval geo_prob=hist_prob(TargetUserName,Country)

      | where fails>fail_baseline OR geo_prob<0.01'
- question: When modeled as a user-host-IP behavior graph with an 'is_hidden' attribute, do hidden-account
    nodes show unusual centrality, new asset communities, or first-time actions?
  context: Graph/UEBA analytics reveal hidden accounts that behave unlike their peers - reaching new hosts,
    joining new communities, or taking first-time actions. For Stealth (TA0005), build a user-host-IP
    behavior graph with an 'is_hidden' node attribute derived from registry/dscl state and apply graph
    anomaly detection (or managed UEBA peer-group scoring) to surface hidden nodes with unusual centrality,
    new asset communities, or first-time actions, emitting the top-3 contributing features. Anomalous
    hidden nodes indicate lateral movement or expanding access; the feature output guides which connections
    to investigate first.
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4625
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Authentication Servers, Network Gateway, DNS Servers, Endpoint Device Event Logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "G = build_graph(nodes=[user,host,ip], edges=auth+flows, attr=is_hidden)\nscores = graph_anomaly(G)\
      \  # or UEBA peer-group score\nfor n in G.nodes where is_hidden:\n    if scores[n] high (centrality/new_community/first_time):\n\
      \        alert(n, top3_features)"
- question: On macOS, was a user created or modified to be hidden via 'dscl . -create /Users/* IsHidden
    1' or UniqueID<500, a Hide500Users=TRUE plist edit, or 'chflags hidden' on a home folder?
  context: 'macOS hides users through several mechanisms: dscl IsHidden 1, low UniqueID (<500) combined
    with Hide500Users=TRUE in /Library/Preferences/com.apple.loginwindow, and chflags hidden on /Users
    home folders. All are Stealth (TA0005) behaviors. Alert on execution of ''dscl . -create /Users/*
    IsHidden 1'' or UniqueID < 500, on writes setting Hide500Users to TRUE in com.apple.loginwindow, and
    on ''chflags hidden'' against /Users/* home folders, per Apple Support, MITRE T1564.002, and Atomic
    Red Team T1564.002; related dscl admin-group manipulation is covered by the SigmaHQ macOS rule. A
    match identifies the hidden account; pivot to the spawning process and account creation.'
  answer_sources:
  - macOS Unified Log
  - Command Execution
  - File Modification
  - 'NAI: macOS Endpoints'
  range: Last 90 days
  queries:
  - technology: macOS/Unified Log pseudocode
    query: "search source=macos:unifiedlog\n| where match(command, \"dscl .* -create /Users/.* IsHidden\
      \ 1\")\n   OR match(command, \"dscl .* UniqueID ([0-9]|[1-9][0-9]|[1-4][0-9][0-9])$\")\n   OR (file=\"\
      /Library/Preferences/com.apple.loginwindow*\" AND value=\"Hide500Users=TRUE\")\n   OR match(command,\
      \ \"chflags hidden /Users/.*\")\n| table _time, host, user, ppid_name, command"
- question: Was dscl spawned by an unusual parent process, or are IsHidden/UniqueID<500 arguments rare
    for the host fleet, indicating illegitimate hidden-user creation?
  context: Legitimate dscl invocations come from a narrow set of parents (MDM agents, installers); a shell
    spawned from a downloaded payload calling dscl is suspicious. For Stealth (TA0005), baseline which
    parent processes legitimately invoke dscl and the frequency of IsHidden/UniqueID arguments, then alert
    when dscl is spawned by an unusual parent or when UniqueID<500 creation is rare across the fleet.
    Score command-line entropy of the dscl invocation as a tunable signal. A rare parent or rare hidden-attribute
    argument elevates the event for review even absent an exact rule match.
  answer_sources:
  - macOS Unified Log
  - Command Execution
  - File Modification
  - 'NAI: macOS Endpoints'
  range: Last 90 days
  queries:
  - technology: macOS/Stats pseudocode
    query: 'search source=macos:unifiedlog command="dscl*"

      | eval parent=ppid_name, ent=shannon_entropy(command)

      | eventstats count as tot, count(eval(parent==parent)) as pc by parent

      | eval p_parent=pc/tot

      | where p_parent<rarity_threshold OR command LIKE "%IsHidden%" OR ent>entropy_threshold

      | table _time, host, parent, command, p_parent, ent'
- question: When dscl/security-tool command lines are scored by an embedding-based outlier model trained
    on benign macOS admin activity, is the hidden-user command flagged, and which tokens drive it?
  context: An ML model trained on benign macOS admin activity catches obfuscated or novel hidden-user
    creation that rules miss. For Stealth (TA0005), score dscl/security-tool command lines via embedding-based
    outlier detection (Isolation Forest/autoencoder) trained on benign macOS admin activity, surfacing
    the top-3 contributing tokens (IsHidden, UniqueID, /Users), per CrowdStrike's command-line anomaly
    work and the Isolation Forest method. Outliers featuring tokens like IsHidden or UniqueID are strong
    leads; the explainable output keeps the alert actionable for analysts unfamiliar with the host's norms.
  answer_sources:
  - macOS Unified Log
  - Command Execution
  - File Modification
  - 'NAI: macOS Endpoints'
  range: Last 90 days
  queries:
  - technology: macOS/ML pseudocode
    query: "emb = embed(dscl_command_lines)\nmodel = IsolationForest/autoencoder.fit(benign_admin_cmds)\n\
      for c in dscl_commands:\n    if model.score(emb(c)) outlier:\n        alert(host, c, top3_tokens=[IsHidden,UniqueID,/Users])"
- question: On Linux, was an account hidden from the greeter via 'gsettings set org.gnome.login-screen
    disable-user-list true' or edits to /etc/gdm3/*, /etc/lightdm/*, or AccountsService SystemAccount=true?
  context: 'Linux hides accounts from the login greeter through display-manager configuration: gsettings
    disable-user-list, edits to GDM/LightDM config, or per-user AccountsService overrides setting SystemAccount=true.
    These are Stealth (TA0005) behaviors. Alert on auditd EXECVE of ''gsettings set org.gnome.login-screen
    disable-user-list true'' (or ''sudo -u gdm ...'') and on file modifications to /etc/gdm3/*, /etc/lightdm/*,
    or /var/lib/AccountsService/users/* setting SystemAccount=true, per MITRE T1564.002. Pair with useradd/usermod
    creation events for create-then-hide correlation. A match identifies the greeter change; pivot to
    the account it conceals and the executing user.'
  answer_sources:
  - auditd:EXECVE
  - auditd:PATH
  - 'NAI: Linux Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: "search type=EXECVE\n| where match(cmdline, \"gsettings set org.gnome.login-screen disable-user-list\
      \ true\")\n   OR match(cmdline, \"sudo -u gdm gsettings .* disable-user-list true\")\n| append [search\
      \ type=PATH name IN (\"/etc/gdm3/*\",\"/etc/lightdm/*\",\"/var/lib/AccountsService/users/*\") (value=\"\
      SystemAccount=true\")]\n| table _time, host, auid, exe, cmdline, name"
- question: Are greeter/display-manager configuration changes out-of-band for the host's baseline, or
    do they occur within minutes of an account creation (sub-5th-percentile delta)?
  context: Greeter/display-manager config changes are rare administrative events; an out-of-band change,
    especially right after creating an account, signals create-then-hide abuse. For Stealth (TA0005),
    treat these changes as rare events, baseline their frequency per host, and alert on out-of-band changes
    - especially when correlated within minutes of account creation (sub-5th-percentile time delta). Profile
    failure signals (failed sudo, denied file writes) as distinct indicators. A rare config change tightly
    coupled to a useradd is high confidence; isolated config changes still merit review against the host
    baseline.
  answer_sources:
  - auditd:EXECVE
  - auditd:PATH
  - 'NAI: Linux Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: auditd/Stats pseudocode
    query: 'search (type=EXECVE cmdline="*disable-user-list*") OR (type=PATH name IN ("/etc/gdm3/*","/etc/lightdm/*"))

      | eventstats avg(daily_count) as base by host

      | where today_count > base*spike_factor

      | join host [search type=EXECVE cmdline IN ("useradd*","usermod*")]

      | eval delta=config_time-create_time | where delta<300'
- question: Does a sequence/HMM model flag improbable Linux admin transitions such as 'useradd' followed
    by 'gsettings disable-user-list'?
  context: Modeling normal admin command sequences exposes the create-then-hide chain on Linux even when
    timing or syntax varies. For Stealth (TA0005), model normal admin command/event sequences and flag
    improbable transitions such as useradd -> gsettings disable-user-list using an HMM or sequence anomaly
    detector, reporting the low-probability transition. A flagged useradd -> disable-user-list transition
    strongly indicates an account being created and immediately concealed; the reported likelihood helps
    prioritize the alert for investigation of the new account.
  answer_sources:
  - auditd:EXECVE
  - auditd:PATH
  - 'NAI: Linux Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: auditd/ML pseudocode
    query: "hmm = HMM().fit(normal_admin_cmd_sequences)\nfor seq in per_session_command_sequences:\n \
      \   if contains(seq,'useradd->gsettings disable-user-list') and hmm.score(seq)<threshold:\n    \
      \    alert(host, auid, transition, likelihood)"
