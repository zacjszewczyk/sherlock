name: 'T1586.003: Cloud Accounts'
id: 31a7532d-8d3c-40df-a7fe-b091a24c3bdf
description: 'Investigate evidence that an adversary has compromised cloud accounts to develop resources
  in support of later operations. Although much of this activity occurs outside the victim''s visibility,
  this playbook focuses on the observable seams: internal hosts reaching known-malicious cloud-hosted
  infrastructure, unauthorized use of cloud management CLI tooling, abnormal outbound data volume to cloud
  storage/compute, high-entropy DNS and TLS to cloud API/console endpoints, provisioning-style sequences
  across identity/compute/storage services, anomalous cloud sign-ins (impossible travel, anonymizing IPs,
  failed-logon bursts), and first-seen IAM/control-plane actions. It combines symbolic-logic rules, statistical
  baselining, and machine-learning approaches across network (Zeek), endpoint (Windows Event ID 4688),
  and cloud audit/identity sources to help a SOC analyst confirm or refute compromise of cloud accounts.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any internal host establish an outbound connection to a cloud-hosted domain or IP that
    appears on a curated threat-intelligence feed of known-malicious C2, phishing, or anonymization infrastructure?
  context: Adversaries who compromise cloud accounts often stand up C2, phishing, or anonymization services
    inside reputable cloud provider networks so traffic blends with legitimate cloud usage. Match Zeek
    dns.log/conn.log destinations against curated TI lists of malicious cloud-hosted domains/IPs and alert
    on any successful connection, pairing with tooling/user-agent fingerprints. The alert should list
    the top-3 contributing fields (matched indicator, destination FQDN/ASN, internal host). A positive
    match is a strong lead that a host is communicating with adversary cloud infrastructure; supports
    Resource Development by revealing adversary-built capability.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Corporate DNS Resolvers, Proxy Servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "for conn in conn.log join dns.log:\n  if conn.resp_h in TI_cloud_malicious_ips\n     or dns.query\
      \ in TI_cloud_malicious_domains:\n    if conn.conn_state in ('SF','S1','ESTAB'):\n      alert(indicator,\
      \ dest_fqdn, dest_asn, src_host)"
- question: Is any single internal host accumulating an abnormally high rate of blocked or failed outbound
    connection attempts to cloud provider IP space?
  context: Repeated firewall/proxy denies and TLS resets toward cloud ranges are a failure-mode signal
    of an adversary or tool probing for reachable cloud infrastructure. Treat denies/resets to cloud ranges
    as a distinct state signal and alert when a single host accrues more than 20 blocked outbound attempts
    per hour to cloud provider IP space. A spike indicates scripted/automated attempts consistent with
    resource development; isolate the host and review what cloud endpoints were targeted.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Corporate DNS Resolvers, Proxy Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'filter (action=deny OR tls_reset) AND dest_ip in CLOUD_RANGES

      | bin time span=1h by src_host

      | count as blocked

      | where blocked > 20

      | alert(src_host, blocked, top_dest_ranges)'
- question: Are internal hosts connecting to newly registered cloud-hosted domains or producing an abnormal
    NXDOMAIN ratio indicative of algorithmic or throwaway domains?
  context: Adversary cloud infrastructure is frequently young. Enrich cloud-hosted domains with WHOIS
    registration age, compute the enterprise 5th-percentile age, and flag connections to newer domains.
    Jointly track per-host NXDOMAIN ratio over a 1-hour window as a failure-rate feature (threshold derived
    from your DNS baseline, typically >0.2). Connections to very young domains combined with high NXDOMAIN
    ratios suggest contact with freshly provisioned or DGA-style adversary cloud resources.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Corporate DNS Resolvers, Proxy Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'enrich dns.query with whois_age

      | p5 = percentile(whois_age, 5) over enterprise

      | flag where whois_age < p5

      | per src_host, 1h window: nxd_ratio = nxdomain/total

      | alert where flag AND nxd_ratio > baseline_thresh(~0.2)'
- question: Does a machine-learning classifier flag any cloud-bound network flow as high-probability malicious
    or beaconing based on connection and DNS features?
  context: Train a Random Forest on conn/dns features (ASN, query length, TTL, duration, orig/resp_bytes,
    inter-arrival regularity) and a beaconing classifier using periodicity signal processing. Alert on
    high-probability malicious flows and surface the top-3 feature importances. ML captures subtle, automated
    cloud egress (regular beacon intervals, anomalous byte ratios) that static rules miss, helping reveal
    adversary command-and-control or staging built on compromised cloud accounts.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Corporate DNS Resolvers, Proxy Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "features = [asn, query_len, ttl, duration, orig_bytes, resp_bytes, iat_regularity]\nscore\
      \ = RandomForest.predict_proba(features)\nbeacon = periodicity_score(flow.iat_series)\nif score\
      \ > 0.8 or beacon > thresh:\n  alert(flow, top3_feature_importances)"
- question: Was a cloud management CLI tool (aws.exe, az.cmd, gcloud.cmd, terraform.exe) executed by a
    user who is not a member of the authorized Cloud Admins group?
  context: Compromised credentials are often wielded through cloud CLI/SDK tooling on hosts that should
    never run them. Alert when cloud CLI tools execute (Windows Event ID 4688) under users outside the
    Cloud Admins AD group, optionally corroborated by Zeek HTTP user-agents indicating CLI/SDK use. Include
    user, host, and parent process as the top-3 alert fields. Execution by a non-admin principal is a
    high-fidelity indicator of cloud account misuse for resource development.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Server Subnets (excluding designated admin hosts), Developer Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'filter EventID=4688 AND process_name in (aws.exe,az.cmd,gcloud.cmd,terraform.exe)

      | lookup user in AD_group ''Cloud Admins''

      | where not member

      | alert(user, host, parent_process)'
- question: Is a cloud CLI process executing on a host where such activity is statistically rare compared
    to the last 30 days?
  context: Compute inverse host frequency for cloud CLI process executions over 30 days (association/frequency
    mining) and flag runs on non-admin workstations when rarity exceeds the 99th percentile. Corroborate
    with first-seen principal/region in CloudTrail. Rare-host cloud CLI execution suggests an adversary
    operating from an atypical foothold rather than a sanctioned admin workstation, indicating credential
    compromise.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Server Subnets (excluding designated admin hosts), Developer Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'over 30d: freq[host] = count(cloud_cli_exec on host)

      rarity = 1/freq[host]

      | where rarity > p99(rarity) AND host not in admin_hosts

      | corroborate first_seen(principal, region) in CloudTrail

      | alert(host, user, rarity)'
- question: Are any hosts migrating from normal user behavior toward administrator-like behavioral clusters
    driven by cloud CLI use?
  context: Cluster hosts by process/network feature vectors (counts of processes, protocols, destinations)
    and flag hosts migrating from user clusters toward admin-like clusters driven by cloud CLI use. Report
    the top-3 cluster-distance-driving features. A user workstation suddenly behaving like an admin host
    is consistent with an attacker leveraging compromised access to provision cloud resources.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: User Endpoints, Server Subnets (excluding designated admin hosts), Developer Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "vectors = host_feature_vectors(process_counts, proto_counts, dest_counts)\nclusters = cluster(vectors)\n\
      for host: if drift(host, user_cluster -> admin_cluster):\n  alert(host, top3_distance_features)"
- question: Did any non-backup host transfer more than 1 GB of outbound data to cloud storage provider
    IP ranges within a single hour?
  context: A deterministic floor catches bulk staging/exfiltration to cloud storage built on compromised
    accounts. Alert when any non-backup host sends >1GB in an hour to cloud storage provider IP ranges
    using an up-to-date provider list; tune the byte threshold per environment. Crossing this floor warrants
    immediate review of the host and destination, as it can indicate data staging for the adversary's
    cloud resources.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, All Corporate Subnets, VPN User IP Pools'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'filter dest_ip in CLOUD_STORAGE_RANGES AND host not in BACKUP_HOSTS

      | bin time span=1h by src_host

      | sum(orig_bytes) as bytes

      | where bytes > 1GB

      | alert(src_host, bytes, dest_service)'
- question: Does a host's hourly outbound volume or byte-ratio to cloud ranges exceed its own or its peer
    group's 99th percentile, with associated upload failures?
  context: Baseline per-host hourly orig_bytes and orig/resp byte-ratio to cloud ranges over 30 days and
    alert when current volume exceeds the host's or peer group's 99th percentile. Jointly track upload-attempt
    failures/resets as a distinct state signal. Sustained statistically significant increases above baseline,
    especially with retry/failure patterns, point to abnormal exfiltration or staging to adversary cloud
    storage.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, All Corporate Subnets, VPN User IP Pools'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'over 30d per host,1h: baseline orig_bytes, ratio=orig/resp to CLOUD_RANGES

      | p99 = percentile(orig_bytes,99) per host & peer_group

      | where current_bytes > p99

      | track upload_failures/resets as state

      | alert(host, bytes, ratio, failures)'
- question: Does a time-series model flag any host-service pair's outbound volume as exceeding its predicted
    upper confidence bound?
  context: Apply ARIMA (or seasonal-decomposition) to hourly outbound volume per host-service pair and
    flag hours exceeding the upper confidence bound. Surface the top-3 contributors (observed vs predicted
    bytes, destination service, deviation magnitude). Time-series anomaly detection accounts for normal
    diurnal/seasonal patterns, isolating genuinely anomalous bursts to cloud services that may represent
    exfiltration enabled by compromised cloud accounts.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, All Corporate Subnets, VPN User IP Pools'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for (host,service): model = ARIMA(hourly_orig_bytes)\nupper = model.forecast().conf_int_upper\n\
      if observed > upper:\n  alert(host, service, observed, predicted, deviation)"
- question: Did a non-admin host access a cloud management web console (console.aws.amazon.com, portal.azure.com,
    console.cloud.google.com), especially from an anonymizing/Tor source IP?
  context: Direct browsing to cloud management consoles from a host not designated for cloud administration
    is suspicious. Alert when Zeek ssl.log records cloud console server_name values from non-admin source
    IPs, and treat anonymizing/Tor source IPs as an additional deterministic trigger. Include source IP,
    server_name, and user as the top-3 fields. Console access from unexpected hosts/anonymized IPs indicates
    possible interactive misuse of compromised cloud credentials.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points, VPN Concentrators, Administrative Workstations'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'filter ssl.log server_name in (console.aws.amazon.com, portal.azure.com, console.cloud.google.com)

      | where src_ip not in ADMIN_HOSTS OR src_ip in TOR_ANON_IPS

      | alert(src_ip, server_name, user)'
- question: Is any source IP generating high-entropy DNS for cloud API endpoints or an abnormal request
    rate / NXDOMAIN ratio compared to peers?
  context: Compute 1-hour Shannon entropy of each source IP's subdomains under cloud providers plus request
    rate, distinct-subdomain count, and NXDOMAIN ratio, alerting when scores deviate more than 2 standard
    deviations from peer-group baselines. High subdomain entropy and elevated failure rates indicate scripted
    enumeration of cloud API endpoints, consistent with an adversary mapping resources accessible via
    compromised accounts.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points, VPN Concentrators, Administrative Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per src_ip, 1h: entropy=shannon(subdomains under CLOUD_PROVIDERS),\n  rate=count, distinct=distinct(subdomain),\
      \ nxd_ratio\n| z = zscore(features vs peer_group)\n| where any(z) > 2\n| alert(src_ip, entropy,\
      \ rate, nxd_ratio)"
- question: Does a host produce low-probability DNS/API access sequences or periodic beaconing inconsistent
    with normal cloud-admin patterns?
  context: Model normal admin DNS/API access sequences (Markov or neural classifier) and flag low-probability
    sequences and periodic beaconing from other hosts. Surface the top-3 lowest-probability transitions.
    Deviations from learned legitimate access sequences, or robotic periodicity, suggest automated tooling
    driving cloud API access via compromised accounts rather than human admin work.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Network Egress Points, VPN Concentrators, Administrative Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = MarkovOrNN(admin_dns_api_sequences)\nfor host: p = model.sequence_prob(host.access_seq)\n\
      beacon = periodicity_score(host.api_intervals)\nif p < thresh or beacon > thresh:\n  alert(host,\
      \ top3_lowprob_transitions)"
- question: Did a non-admin host query identity, then compute, then storage cloud service endpoints in
    a logical provisioning order within a short time window?
  context: 'Infrastructure provisioning follows a recognizable pattern: authenticate/identity, spin up
    compute, attach storage. Alert when non-admin hosts query identity -> compute -> storage service endpoints
    within 15 minutes. Report the matched ordered triad and host as top-3 fields. This ordered burst across
    service categories from an unexpected host is consistent with an adversary provisioning resources
    using a compromised cloud account.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, Developer Subnets, Corporate DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "per src_host, 15m window:\n  seen_identity = any(dns.query in IDENTITY_ENDPOINTS)\n  seen_compute\
      \  = any(dns.query in COMPUTE_ENDPOINTS)\n  seen_storage  = any(dns.query in STORAGE_ENDPOINTS)\n\
      if ordered(identity -> compute -> storage) AND host not in ADMIN_HOSTS:\n  alert(host, matched_triad)"
- question: Does a host's daily cloud service-category access pattern diverge sharply (low cosine similarity)
    from its own history and peer group?
  context: Compare each host's daily service-category vector to its 30-day average and peer group and
    flag cosine similarity below ~0.7 (tune from your data). A sudden shift in the mix of cloud services
    a host touches indicates the host is being used for new activity — such as provisioning infrastructure
    — that departs from its established role, a hallmark of compromised-account-driven resource development.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, Developer Subnets, Corporate DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host,day: vec = service_category_counts

      sim_self = cosine(vec, host.30d_avg_vec)

      sim_peer = cosine(vec, peer_group_avg_vec)

      | where min(sim_self, sim_peer) < 0.7

      | alert(host, sim_self, sim_peer, top_changed_categories)'
- question: Is a host touching rare or novel combinations of cloud services that fall below learned support/confidence
    thresholds for legitimate admin activity?
  context: Mine association rules for legitimate admin service pairs and flag hosts touching rare itemsets
    below support/confidence thresholds. List the top-3 novel service combinations driving the alert.
    Novel service combinations not seen in legitimate admin behavior suggest exploratory or provisioning
    activity by an adversary leveraging a compromised cloud account.
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, Developer Subnets, Corporate DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "rules = apriori(admin_service_itemsets, min_support, min_conf)\nfor host: itemset = host.service_set\n\
      if support(itemset) < min_support or itemset not in rules:\n  alert(host, top3_novel_service_combos)"
- question: Did a cloud principal sign in from two locations implying physically impossible travel between
    consecutive successful logons?
  context: For consecutive successful sign-ins of the same principal, compute geodesic distance / elapsed
    time and alert when implied velocity exceeds a feasible threshold (e.g., >900 km/h), excluding known
    VPN egress and trusted networks. Report distance, elapsed time, and the two source IPs as top-3 fields.
    Impossible travel strongly indicates that a credential is being used concurrently by the legitimate
    user and an attacker, evidencing cloud account compromise.
  answer_sources:
  - Entra ID / Azure AD Sign-in Logs
  - AWS CloudTrail ConsoleLogin
  - VPN/Authentication Logs
  - 'NAI: Identity Provider, Cloud Console Auth Endpoints, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for consecutive successful signins per principal:\n  v = geodesic(ip1,ip2) / elapsed_time\n\
      \  if v > 900km/h AND ip1,ip2 not in VPN_TRUSTED:\n    alert(principal, distance, elapsed, ip1,\
      \ ip2)"
- question: Did a successful cloud sign-in immediately follow an abnormal burst of failed authentications
    for the same principal?
  context: Count failed authentications per principal/source over a 10-minute window and alert when failures
    exceed the per-account 99th percentile (or a floor of >=10) immediately preceding a success. A failed-logon
    burst culminating in success is the classic signature of a password-spray or brute-force attack that
    successfully compromised a cloud account, enabling subsequent resource development.
  answer_sources:
  - Entra ID / Azure AD Sign-in Logs
  - AWS CloudTrail ConsoleLogin
  - VPN/Authentication Logs
  - 'NAI: Identity Provider, Cloud Console Auth Endpoints, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "per principal, 10m window: fails = count(auth_failure)\nthresh = max(p99(fails per account),\
      \ 10)\nif fails > thresh AND followed_by success:\n  alert(principal, fails, success_ip)"
- question: Does a UEBA model score any cloud sign-in as anomalous against the user's and peer group's
    behavioral baseline (first-time country/ASN/device, uncommon-for-peers)?
  context: Score sign-ins against per-entity and peer-group behavioral baselines (first-time country/ASN/device,
    uncommon-for-peers) and emit the top-3 contributing anomaly factors plus a blast-radius/priority score.
    UEBA catches subtle account takeover signals that single rules miss — a login from a never-before-seen
    country/device that is also unusual for the user's peers strongly suggests compromise.
  answer_sources:
  - Entra ID / Azure AD Sign-in Logs
  - AWS CloudTrail ConsoleLogin
  - VPN/Authentication Logs
  - 'NAI: Identity Provider, Cloud Console Auth Endpoints, VPN Concentrators'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "score = UEBA.signin_anomaly(principal, country, asn, device,\n          peer_group_baseline)\n\
      if score > thresh:\n  alert(principal, top3_anomaly_factors, blast_radius_priority)"
- question: Did a cloud principal create IAM users or access keys (or equivalent credential/role creation)
    using a userAgent matching known attacker tooling such as S3 Browser?
  context: Alert on CloudTrail CreateUser/CreateAccessKey (or equivalent role/credential creation) where
    userAgent matches known attacker tooling. Include principal, eventName, and userAgent as top-3 fields.
    Credential/role creation via attacker-associated tooling is a high-fidelity indicator that a compromised
    cloud account is being used to establish persistence and develop further resources.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Logs
  - GCP Audit Logs
  - 'NAI: Cloud Control Plane, IAM Service, Cloud Audit Log Pipeline'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'filter eventName in (CreateUser, CreateAccessKey, CreateRole, role_assignment)

      | where userAgent in ATTACKER_TOOLING_UA (e.g., ''S3 Browser'')

      | alert(principal, eventName, userAgent)'
- question: Is a cloud principal performing first-seen API actions or operating in first-seen regions,
    or generating an abnormal volume of authorization-failure error codes?
  context: Baseline each principal's set of API actions and regions over a 30-90 day lookback and alert
    on first-seen actions/regions, while separately tracking the per-principal authorization-failure (AccessDenied/error-code)
    rate as a distinct state signal. First-seen privileged actions/regions and bursts of AccessDenied
    errors indicate an account exploring beyond its norm — consistent with an adversary probing the access
    afforded by a compromised cloud account.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Logs
  - GCP Audit Logs
  - 'NAI: Cloud Control Plane, IAM Service, Cloud Audit Log Pipeline'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'over 30-90d per principal: known_actions, known_regions

      | flag eventName not in known_actions OR region not in known_regions

      | track err_rate = count(AccessDenied)/count(events)

      | alert(principal, first_seen_action_or_region, err_rate)'
- question: Does a graph-based model surface cross-service behavioral anomalies for a cloud principal
    indicative of an early-stage compromised account?
  context: Build dynamic user-service-activity graphs from cloud audit logs and score cross-service behavioral
    anomalies with GNN temporal embeddings for early detection of compromised accounts. Surface the top-3
    anomalous service/action edges. Graph models capture relationships across services that point-anomaly
    methods miss, enabling earlier detection of an account being repurposed for adversary resource development.
  answer_sources:
  - AWS CloudTrail
  - Azure Activity Logs
  - GCP Audit Logs
  - 'NAI: Cloud Control Plane, IAM Service, Cloud Audit Log Pipeline'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "graph = build_user_service_activity_graph(cloud_audit_logs)\nemb = GNN_temporal_embeddings(graph)\n\
      score = anomaly_score(emb per principal)\nif score > thresh:\n  alert(principal, top3_anomalous_edges)"
