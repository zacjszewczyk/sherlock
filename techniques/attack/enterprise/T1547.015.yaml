name: 'T1547.015: Login Items'
id: 5ddb4002-a5c5-440d-a2ce-7c4682de9dfa
description: 'Investigate adversary abuse of macOS Login Items (T1547.015) for persistence (TA0003) and
  privilege escalation (TA0004). Adversaries add login items via the Background Task Management framework
  (writing `~/Library/Application Support/com.apple.backgroundtaskmanagementagent/backgrounditems.btm`),
  via AppleScript that tells ''System Events'' to `make login item`, or via the Service Management framework
  (`SMLoginItemSetEnabled`/`SMAppService.register`) which installs a helper in an app bundle''s `Contents/Library/LoginItems`.
  This playbook helps an analyst hunt for: suspicious BTM launch-item-add and backgrounditems.btm modifications;
  osascript-driven login item creation; low-prevalence, unsigned, or ad-hoc-signed registrants and helpers
  whose bundle id mismatches the parent app; login-spawned processes (children of launchd/loginwindow)
  that beacon to low-reputation or newly-registered C2; credential-prompting via `AuthorizationExecuteWithPrivileges`
  or `osascript ... with administrator privileges` from masqueraded/typosquatted apps; and writes to system-wide
  persistence directories by non-root, non-installer processes. Detection methods span deterministic rules,
  statistical prevalence/anomaly scoring, and machine-learning provenance and parent-child models.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
