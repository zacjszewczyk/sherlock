name: 'T1564.003: Hide Artifacts: Hidden Window'
id: 8069e0c1-ca46-4f34-a547-718b3d8cc248
description: 'Investigate adversary use of hidden windows and hidden desktops to conceal malicious activity
  from users on Windows, macOS, and Linux endpoints. This playbook helps an analyst hunt for and triage
  stealth behaviors that suppress on-screen GUI artifacts: PowerShell/cscript launched with window-hiding
  flags (-WindowStyle Hidden, //B, encoded commands), registry edits that push console windows off-screen
  (HKCU\Console WindowPosition), CreateDesktop()-spawned hidden desktops and hVNC (an extra explorer.exe
  with no matching interactive logon, or explorer.exe beaconing externally), macOS plist modifications
  setting apple.awt.UIElement/LSUIElement to hide Dock icons, and Linux GUI binaries launched with suppressed
  DISPLAY/windowing. It pairs deterministic IOC and rule-based detections with statistical prevalence/timing
  scoring and machine-learning classifiers, process-lineage graph analysis, and cross-view desktop enumeration
  so the analyst can confirm whether an adversary is hiding processes from the user''s view to evade defenses.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any process creation event (Windows Event ID 4688) execute a binary whose MD5/SHA1/SHA256
    file hash matches a threat-intelligence indicator tagged for hidden-window/hidden-desktop malware
    (T1564.003)?
  context: 'This is the deterministic floor for the Stealth tactic: adversaries hiding windows still drop
    a binary on disk, and if that binary''s hash is already known to threat intelligence you can attribute
    it to a threat family immediately. Continuously ingest TI feeds containing hashes of malware that
    uses hidden windows/hVNC and join them against the image hash recorded in every 4688 event. A match
    is a high-confidence hit warranting host isolation and full triage; a clean result lowers but does
    not eliminate suspicion, so keep the statistical and ML detections running alongside it. Sources:
    [MITRE T1564.003](https://attack.mitre.org/techniques/T1564/003/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All managed Windows endpoints, including user workstations, Virtual Desktop Infrastructure (VDI)
    instances, and application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4688

      | eval h=coalesce(SHA256,SHA1,MD5)

      | lookup ti_hidden_window_hashes hash AS h OUTPUT threat_family

      | where isnotnull(threat_family)

      | table _time,Computer,NewProcessName,h,threat_family'
- question: Which executable hashes seen in process creation are rare across the enterprise (present on
    <1% or <5 hosts), especially unsigned images or those launched with window-hiding flags?
  context: 'Stealthy hidden-window tooling is typically bespoke and low-prevalence, unlike ubiquitous
    legitimate binaries. Compute enterprise-wide prevalence (distinct host count) for every unique image
    hash over a rolling 30-day window and alert on hashes appearing on fewer than 1% of endpoints (or
    <5 hosts), deriving the floor from the 1st percentile of the observed distribution. Prioritize unsigned
    images and those whose command line carries window-suppression flags. Also track the failure state
    of hashes that execute then immediately exit (very short lifetime) as a distinct staging/loader signal.
    A rare, unsigned, hidden-flagged binary is a strong lead. Sources: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All managed Windows endpoints, including user workstations, Virtual Desktop Infrastructure (VDI)
    instances, and application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 earliest=-30d

      | eval h=coalesce(SHA256,SHA1,MD5)

      | stats dc(Computer) AS hosts values(Signed) AS signed by h

      | eventstats count AS total_hosts

      | where hosts<5 OR (hosts/total_hosts)<0.01

      | sort hosts'
- question: Does a machine-learning file classifier score any newly observed executable as malicious with
    high confidence based on entropy, PE header anomalies, and import/string features?
  context: 'Even when a hidden-window binary is unknown to TI, its static characteristics often betray
    it. Score new executables with a Gradient Boosting/Random Forest model over file entropy, PE header
    anomalies (non-standard section names), import/export tables, and string features, alerting above
    a high-confidence probability (e.g., >0.9). Use entropy as an interpretable corroborator: packed/encrypted
    images run >7.2 while native code is ~5.0-6.5. Surface the top-3 contributing features so the analyst
    can validate the verdict. High score plus high entropy plus rarity is a strong concealment indicator
    under the Stealth tactic. Sources: [Using Entropy Analysis to Find Encrypted and Packed Malware, Lyda
    & Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All managed Windows endpoints, including user workstations, Virtual Desktop Infrastructure (VDI)
    instances, and application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'input: new_executable

      features = [entropy, pe_section_names, imports, exports, strings]

      p = gbm_model.predict_proba(features)

      if p > 0.9: alert(top3=shap(features), entropy_flag = entropy>7.2)'
- question: Did any process command line (Windows Event ID 4688, Sysmon EID 1, or PowerShell 4104) explicitly
    invoke window-hiding capabilities such as -WindowStyle Hidden, cscript //B, -nop, -ep bypass, or -enc?
  context: 'This is the canonical, documented signature of deliberate UI suppression for the Stealth tactic.
    Run SIEM/EDR regex over process command lines matching window-suppression tokens: -w(in|indowstyle)?
    \s+ h(id|idden)?, //B, -nop/-noprofile, -ep bypass, and -e(nc|ncodedcommand)?. Each token maps to
    real powershell.exe/cscript parameters and community Sigma detections. Alert on any single match and
    escalate when several co-occur (e.g., hidden + encoded + bypass), which strongly implies an attacker
    hiding a launcher rather than a benign admin task. Sources: [about_PowerShell.exe, Microsoft](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe?view=powershell-5.1);
    [SigmaHQ process-creation rules](https://github.com/SigmaHQ/sigma/tree/master/rules/windows/process_creation).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows endpoints and servers with enabled scripting engines (e.g., PowerShell, WScript,
    CScript), particularly administrative workstations and jump boxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(source=WinEventLog:Security EventCode=4688) OR (source=WinEventLog:Microsoft-Windows-PowerShell/Operational
      EventCode=4104)

      | regex CommandLine="(?i)-w(in|indowstyle)?\s+h(id|idden)?|//B|-nop|-noprofile|-ep\s+bypass|-e(nc|ncodedcommand)?"

      | eval hits=mvcount(matches)

      | table _time,Computer,User,CommandLine'
- question: Does any scripting-host command line exceed the 99th-percentile length or Shannon entropy
    (>7.0) baseline for that image, indicating Base64/obfuscated hidden-window payloads?
  context: 'Obfuscated and encoded launchers used to hide windows are statistically longer and higher-entropy
    than routine admin commands. Per scripting image (powershell.exe, cmd.exe, cscript.exe, wscript.exe)
    maintain a baseline distribution of command-line length and Shannon entropy from 30 days of history,
    then alert when a new command line exceeds the 99th percentile for that image or has entropy >7.0.
    Character-frequency deviation versus a benign corpus is an additional explainable score. A long, high-entropy
    PowerShell line is a classic encoded hidden-window launcher and merits decoding and review. Sources:
    [Revoke-Obfuscation, Bohannon & Holmes](https://github.com/danielbohannon/Revoke-Obfuscation); [Using
    Entropy Analysis to Find Encrypted and Packed Malware, Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows endpoints and servers with enabled scripting engines (e.g., PowerShell, WScript,
    CScript), particularly administrative workstations and jump boxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:* (EventCode=4688 OR EventCode=4104) earliest=-30d

      | eval img=lower(Image), len=len(CommandLine), ent=shannon_entropy(CommandLine)

      | eventstats perc99(len) AS p99 by img

      | where len>p99 OR ent>7.0

      | table _time,Computer,img,len,ent,CommandLine'
- question: Does a machine-learning command-line/script classifier flag any execution as a malicious hidden-window
    launcher using text, token, and AST features?
  context: 'When obfuscation defeats regex, ML over the script''s structure can still catch it. Train
    an XGBoost classifier on labeled command lines/scripts using hybrid text, token (PSParser), and AST
    features, classify in real time, and alert on high-confidence malicious predictions, surfacing the
    top-3 feature importances. Where AMSI is enabled, classify the post-deobfuscation content with contextual
    embeddings to catch encoded hidden-window launchers after they are unpacked in memory. A high-confidence
    verdict on a script that ultimately hides its window is a strong Stealth-tactic detection. Sources:
    [Effective Method for Detecting Malicious PowerShell Scripts Based on Hybrid Features, Fang et al.](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099);
    [AMSI-Based Detection, Hendler et al.](https://arxiv.org/pdf/1905.09538).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows endpoints and servers with enabled scripting engines (e.g., PowerShell, WScript,
    CScript), particularly administrative workstations and jump boxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'input: command_line OR amsi_deobfuscated_script

      features = text_features + psparser_tokens + ast_features

      p = xgboost_model.predict_proba(features)

      if p > threshold: alert(top3=feature_importance(features))'
- question: Was a normally interactive child process (e.g., chrome.exe, msedge.exe, powershell.exe) spawned
    by an anomalous non-interactive parent (services.exe, svchost.exe, wmiprvse.exe, taskhostw.exe), or
    did cmd.exe spawn DeviceCredentialDeployment.exe?
  context: 'Hidden-window and hVNC tooling often breaks normal process lineage: GUI applications that
    should descend from explorer.exe instead appear under service/host processes, and LOLBins like DeviceCredentialDeployment.exe
    are abused to hide a window. Maintain lists of interactive child images and non-interactive parents
    and alert when a child-list image is spawned by a parent-list image, plus the specific cmd.exe ->
    DeviceCredentialDeployment.exe window-hiding pattern. A match indicates the adversary is launching
    GUI/scripting activity outside the normal interactive desktop lineage, a strong Stealth-tactic lead.
    Sources: [DeviceCredentialDeployment.exe, LOLBAS](https://lolbas-project.github.io/lolbas/Binaries/DeviceCredentialDeployment/);
    [SigmaHQ process-creation rules](https://github.com/SigmaHQ/sigma/tree/master/rules/windows/process_creation).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User workstations, application servers, and network egress points instrumented with Zeek sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source=WinEventLog:Security EventCode=4688\n| eval child=lower(NewProcessName), parent=lower(ParentProcessName)\n\
      | where (child IN (\"chrome.exe\",\"msedge.exe\",\"powershell.exe\") AND parent IN (\"services.exe\"\
      ,\"svchost.exe\",\"wmiprvse.exe\",\"taskhostw.exe\"))\n   OR (parent=\"cmd.exe\" AND child=\"devicecredentialdeployment.exe\"\
      )\n| table _time,Computer,parent,child,CommandLine"
- question: Which parent-child process image pairs are newly observed or rare (<5 occurrences) enterprise-wide,
    and does the child make external network connections shortly after?
  context: 'Concealed execution chains produce parent-child pairs the environment has never legitimately
    seen. Aggregate all parent-child image pairs from 4688 over 30 days, compute pair frequency, and alert
    on newly observed pairs or pairs seen fewer than 5 times, deriving the rarity floor from the 1st percentile
    per environment. Enrich by correlating the child PID with Zeek conn.log / Sysmon EID 3 connections
    within 60 seconds and record whether egress succeeded or was blocked. A rare lineage pair whose child
    immediately reaches out to the internet strongly suggests a hidden process initiating C2. Sources:
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User workstations, application servers, and network egress points instrumented with Zeek sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 earliest=-30d

      | eval pair=lower(ParentProcessName)."->".lower(NewProcessName)

      | stats count AS c values(Computer) AS hosts by pair

      | where c<5

      | join child_pid [search source=zeek:conn] | where conn_within_60s

      | table pair,c,hosts,dest_ip,egress_state'
- question: Does a process-lineage graph anomaly detector flag any execution chain (scripting host ->
    hidden GUI child -> external connection) as structurally unlike the learned benign baseline?
  context: 'Sophisticated actors vary individual indicators but the overall provenance structure of a
    hidden-window attack remains anomalous. Model process lineage as a provenance graph and apply node-level
    GNN anomaly detection to flag execution chains structurally unlike a learned benign baseline, prioritizing
    anomalous nodes that initiate network activity and emitting the top contributing nodes/edges for triage.
    Alternatively encode the hidden-window TTP (scripting host -> hidden GUI child -> external connection)
    as a query graph and match it against kernel-audit provenance. A flagged subgraph that terminates
    in egress is a high-value Stealth-tactic detection. Sources: [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333);
    [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf); [POIROT, Milajerdi et al.](https://dl.acm.org/doi/10.1145/3319535.3363217).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: User workstations, application servers, and network egress points instrumented with Zeek sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'build provenance_graph from 4688 + Sysmon EID3

      scores = gnn_node_anomaly(provenance_graph)

      alert nodes where score>threshold AND node.initiates_network

      OR poirot_match(query_graph = scripting_host -> hidden_gui_child -> external_conn)'
- question: Was a second explorer.exe created within a user logon session that is NOT preceded (within
    1 minute) by an interactive logon (Windows Event ID 4624, Logon Type 2 or 10)?
  context: 'A second explorer.exe per logon session without a matching interactive logon is the canonical
    signature of a CreateDesktop()-spawned hidden desktop / hVNC session. Implement a stateful rule that
    tracks the explorer.exe count per user logon session ID and alerts when the count increments from
    1 to 2 while no interactive logon (Type 2 console or Type 10 RDP) occurred in the preceding minute.
    The extra explorer.exe parents the attacker''s GUI applications on an invisible desktop, so a hit
    here is strong evidence of active concealment under the Stealth tactic and warrants immediate live-session
    review. Sources: [MITRE T1564.003](https://attack.mitre.org/techniques/T1564/003/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: User Workstations, Remote Desktop Session Hosts, Virtual Desktop Infrastructure (VDI) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 NewProcessName="*\\explorer.exe"

      | stats count AS exp_count by LogonId

      | where exp_count>=2

      | join LogonId [search EventCode=4624 (Logon_Type=2 OR Logon_Type=10)]

      | where (process_time - logon_time) > 60s OR isnull(logon_time)'
- question: On any host, does the running explorer.exe count exceed mean+3 sigma, or is an explorer.exe
    instance parented by something other than userinit.exe?
  context: 'Beyond the stateful rule, anomalous explorer.exe counts reveal hidden desktops statistically.
    Per host, compute a moving mean and standard deviation of the running explorer.exe count and alert
    when the current count exceeds mean+3 sigma, excluding legitimate multi-session hosts (RDS/terminal
    servers). Separately track any explorer.exe whose parent is NOT userinit.exe as a distinct state anomaly,
    since legitimate shells are launched by userinit.exe. An off-baseline count or an oddly-parented explorer.exe
    points to a concealed desktop spawned by an adversary. Sources: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: User Workstations, Remote Desktop Session Hosts, Virtual Desktop Infrastructure (VDI) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Security EventCode=4688 NewProcessName="*\\explorer.exe"

      | where NOT match(host_role,"RDS|terminal")

      | stats count AS exp by Computer,_time_bucket

      | eventstats mean(exp) AS m stdev(exp) AS s by Computer

      | where exp > m+3*s OR lower(ParentProcessName)!="userinit.exe"'
- question: Does clustering of active explorer.exe processes flag any as noise points or sparse-cluster
    members based on parent image, session ID, command line, and start time?
  context: 'Hidden-desktop explorer.exe instances deviate from the tight cluster formed by legitimate
    ones. Cluster active explorer.exe processes with DBSCAN on features parent image (expected userinit.exe),
    session ID, command line (expected empty/standard), and start time, then flag noise points or sparse-cluster
    members as candidate hidden desktops, surfacing the deviating features in the alert. A legitimate
    shell sits inside the dense cluster; an outlier with an unusual parent or non-empty command line is
    a candidate hVNC desktop worth investigating under the Stealth tactic. Sources: [Isolation Forest,
    Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: User Workstations, Remote Desktop Session Hosts, Virtual Desktop Infrastructure (VDI) servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = features[parent_image, session_id, command_line, start_time] for explorer.exe procs

      labels = DBSCAN(eps, min_samples).fit_predict(X)

      alert procs where label==-1 (noise) OR cluster_size<min

      report deviating_features'
- question: Did explorer.exe (which normally makes no direct external connections) initiate a network
    connection (Sysmon EID 3) to a threat-intel-listed C2 destination, or repeatedly hit a dead C2 (refused/blocked/NXDOMAIN)?
  context: 'explorer.exe initiating direct external connections is itself abnormal and, combined with
    C2 intelligence, a strong hidden-window follow-on signal. Join host network events (Sysmon EID 3)
    with C2 threat intel and alert when explorer.exe connects to a listed destination. Profile failure
    states separately: repeated connection-refused/blocked/NXDOMAIN from explorer.exe indicates a beacon
    hammering a dead C2, which is just as telling. A hit means the hidden desktop''s applications are
    likely tunneling through explorer.exe to command and control. Sources: [MITRE T1564.003](https://attack.mitre.org/techniques/T1564/003/).'
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Windows endpoints with Sysmon installed, and network egress points instrumented with Zeek
    sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Sysmon EventCode=3 Image="*\\explorer.exe"

      | lookup c2_intel dest_ip OUTPUT threat

      | where isnotnull(threat) OR conn_status IN ("refused","blocked","nxdomain")

      | table _time,Computer,dest_ip,dest_port,conn_status,threat'
- question: Does explorer.exe show low-variance, periodic connection timing to an external destination
    consistent with C2 beaconing?
  context: 'Hidden-window C2 channels beacon at regular intervals. Group connections by source host and
    process (explorer.exe), compute inter-arrival time deltas to each destination, and measure the coefficient
    of variation / standard deviation: low variance over more than ~10 connections (e.g., sigma <5s) indicates
    beaconing. Apply DFFT periodicity scoring and account for jitter, and score the success-vs-blocked
    connection ratio as a distinct frequency signal. Regular, low-jitter callbacks from explorer.exe --
    a process that should never beacon -- are a high-confidence indicator of concealed C2 under the Stealth
    tactic. Sources: [RITA, Active Countermeasures](https://github.com/activecm/rita).'
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Windows endpoints with Sysmon installed, and network egress points instrumented with Zeek
    sensors.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'from conn.log where orig_proc="explorer.exe"

      group by id.orig_h,id.resp_h

      compute deltas=diff(ts); cv=stdev(deltas)/mean(deltas)

      if count>10 AND stdev(deltas)<5s: beacon_score=dfft_periodicity(deltas); alert'
- question: Does a one-class anomaly model flag any explorer.exe network connection as anomalous on destination
    port, bytes, duration, and JA3/JA3S?
  context: 'Because benign explorer.exe network activity is essentially empty, almost any connection it
    makes is an outlier. Train a One-Class SVM / Isolation Forest on the near-empty set of benign explorer.exe
    connections using destination port, bytes sent, bytes received, duration, and JA3/JA3S TLS fingerprints,
    then alert on any connection scored anomalous and report the top contributing features. This catches
    novel C2 infrastructure not yet in threat intel and unusual TLS fingerprints, providing ML coverage
    for hidden-desktop egress under the Stealth tactic. Sources: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Windows endpoints with Sysmon installed, and network egress points instrumented with Zeek
    sensors.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'train OneClassSVM/IsolationForest on benign explorer.exe conns

      features=[dest_port,bytes_sent,bytes_recv,duration,ja3,ja3s]

      score each new explorer.exe conn; if anomalous: alert(top_features)'
- question: Did a registry write (Sysmon EID 13/14 or Windows Event ID 4657) set WindowPosition / window-placement
    values under HKCU\Console keys to off-screen or maximum coordinates?
  context: 'Editing the HKCU\Console WindowPosition subkey to off-screen/maximum coordinates makes PowerShell
    and other console windows open invisibly off the visible desktop -- a documented hidden-window technique.
    Alert on Sysmon EID 13/14 (or 4657) modifications to WindowPosition / console window-placement values
    under HKCU\Console keys, especially when the written coordinates fall outside connected display bounds,
    and correlate with subsequent hidden process execution. A write placing a console window beyond screen
    geometry is a deliberate concealment act under the Stealth tactic. Sources: [MITRE T1564.003](https://attack.mitre.org/techniques/T1564/003/);
    [SigmaHQ process-creation rules](https://github.com/SigmaHQ/sigma/tree/master/rules/windows/process_creation).'
  answer_sources:
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Windows Event ID 4657
  - 'NAI: All managed Windows endpoints, particularly administrative workstations and jump boxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=WinEventLog:Sysmon (EventCode=13 OR EventCode=14) TargetObject="*\\Console\\*"

      | where match(TargetObject,"WindowPosition|WindowPlacement")

      | eval offscreen=(x>max_x OR y>max_y OR x<0 OR y<0)

      | where offscreen

      | table _time,Computer,User,TargetObject,Details'
- question: Does a written WindowPosition coordinate exceed the 99th percentile of observed coordinates
    or lie beyond the maximum display resolution for that host?
  context: 'Off-screen placement can be detected statistically against each host''s display geometry.
    Baseline normal WindowPosition coordinate ranges per host/display configuration and alert when a written
    value exceeds the 99th percentile of observed coordinates or lies beyond the maximum display resolution
    (an off-screen state), deriving the bounds from enumerated monitor geometry. This distinguishes a
    legitimate user dragging a window to the edge from an adversary writing extreme coordinates to render
    a console invisible, supporting the Stealth-tactic hunt. Sources: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Sysmon Event ID 13
  - Sysmon Event ID 14
  - Windows Event ID 4657
  - 'NAI: All managed Windows endpoints, particularly administrative workstations and jump boxes.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=WinEventLog:Sysmon (EventCode=13 OR EventCode=14) TargetObject="*\\Console\\*WindowPosition*"

      | eval x=hi16(Details), y=lo16(Details)

      | eventstats perc99(x) AS px perc99(y) AS py max(monitor_w) AS mw max(monitor_h) AS mh by Computer

      | where x>px OR y>py OR x>mw OR y>mh'
- question: Was a plist file created or modified to set apple.awt.UIElement or LSUIElement to true (especially
    under LaunchAgents/LaunchDaemons or app bundles), and was the referenced binary then executed as a
    hidden agent?
  context: 'On macOS, setting apple.awt.UIElement / LSUIElement to true makes a Java/Cocoa app run with
    no Dock icon or visible window -- a known backdoor concealment trick. Alert on file modifications
    (EndpointSecurity/unified log) to plist files, especially under LaunchAgents/LaunchDaemons and app
    bundles, that set these keys to true, and correlate with execution of the referenced binary as a hidden
    agent. A plist that hides an app''s UI combined with that app running is strong evidence of a concealed
    macOS agent under the Stealth tactic and should be triaged for persistence too. Sources: [New Mac
    Backdoor Using Antiquated Code, Malwarebytes](https://www.malwarebytes.com/blog/news/2017/01/new-mac-backdoor-using-antiquated-code);
    [MITRE T1564.003](https://attack.mitre.org/techniques/T1564/003/).'
  answer_sources:
  - macos:unifiedlog
  - File Modification (ESF/EndpointSecurity)
  - 'NAI: All managed macOS endpoints, including user laptops and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=macos:unifiedlog OR source=esf:file

      | where event="file_modify" AND match(path,"\\.plist$")

      | where content_match("apple.awt.UIElement|LSUIElement") AND value=true

      | join referenced_binary [search esf:exec]

      | table _time,host,path,referenced_binary'
- question: Which macOS apps that set UIElement/LSUIElement true are rare across the fleet (<5 hosts)
    or had their plist written outside software-install windows?
  context: 'Legitimate menu-bar/tray apps that hide their Dock icon are common and widely deployed; malicious
    hidden agents are rare and installed off-schedule. Enumerate processes whose bundles set UIElement/LSUIElement
    true, compute fleet-wide prevalence, and alert on rare (<5 host) hidden apps and on UIElement plists
    written outside normal software-install windows, deriving the rarity floor from the prevalence distribution.
    A hidden app present on only a handful of machines, or installed at an odd time, is a prime candidate
    for a concealed macOS implant under the Stealth tactic. Sources: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - macos:unifiedlog
  - File Modification (ESF/EndpointSecurity)
  - 'NAI: All managed macOS endpoints, including user laptops and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=macos:unifiedlog hidden_flag IN ("UIElement","LSUIElement")

      | stats dc(host) AS hosts values(install_window) AS iw by bundle_id

      | where hosts<5 OR iw="outside_maintenance"

      | sort hosts'
- question: Does a cross-view enumeration of desktop objects and top-level windows reveal GUI artifacts
    that exist on the system but are not rendered on the interactive (WinSta0\Default) desktop?
  context: 'Hidden desktops created via CreateDesktop() are invisible to the interactive user but still
    exist as kernel objects. Periodically enumerate desktop objects and top-level windows from a trusted
    vantage point and diff against what is rendered on the interactive WinSta0\Default desktop, alerting
    on desktop objects or window-owning processes that exist but are not displayed. This cross-view differential
    is the defining signature of concealment: anything present in the system view but absent from the
    user view is, by definition, hidden. A positive diff strongly indicates an active hidden desktop /
    hVNC session under the Stealth tactic. Sources: [VMwatcher, Jiang, Wang & Xu](https://www.cs.purdue.edu/homes/dxu/pubs/CCS07.pdf);
    [MITRE T1564.003](https://attack.mitre.org/techniques/T1564/003/).'
  answer_sources:
  - EDR process/window telemetry
  - Sysmon Event ID 1
  - 'NAI: User workstations, Remote Desktop Session Hosts, and VDI servers where hVNC/hidden-desktop abuse
    is plausible.'
  range: Last 90 days
  queries:
  - technology: EDR/pseudocode
    query: 'system_view = EnumDesktops() + EnumWindows()  // trusted vantage

      user_view  = windows_rendered_on(WinSta0\Default)

      hidden = system_view - user_view

      if hidden: alert(hidden_desktops, owning_processes)'
- question: Does the hidden-desktop TTP (CreateDesktop -> second explorer.exe -> child apps -> network)
    match as a query subgraph against kernel-audit/provenance graphs?
  context: 'The full hidden-desktop attack leaves a recognizable provenance shape even as individual artifacts
    vary. Match the hidden-desktop TTP (CreateDesktop -> second explorer.exe -> child apps -> network)
    as a query subgraph against kernel-audit/provenance graphs, or score it via node-level provenance
    learning, returning the matched/contributing nodes for explainability. A subgraph match correlates
    the desktop creation, the extra explorer.exe, the child GUI apps it parents, and their egress into
    a single high-confidence detection, giving the analyst an explainable, end-to-end picture of the concealment
    under the Stealth tactic. Sources: [POIROT, Milajerdi et al.](https://dl.acm.org/doi/10.1145/3319535.3363217);
    [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - EDR process/window telemetry
  - Sysmon Event ID 1
  - 'NAI: User workstations, Remote Desktop Session Hosts, and VDI servers where hVNC/hidden-desktop abuse
    is plausible.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'query_graph = CreateDesktop -> explorer.exe(2nd) -> child_apps -> external_conn

      matches = poirot_subgraph_match(query_graph, provenance_graph)

      OR scores = threatrace_node_scores(provenance_graph)

      alert matches/high-score nodes with contributing_nodes'
