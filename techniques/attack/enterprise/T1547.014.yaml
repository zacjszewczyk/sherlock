questions:
- question: Does any newly created or modified StubPath value under HKLM\SOFTWARE\Microsoft\Active Setup\Installed
    Components\, or the SHA256 hash of the binary it references, match a known threat-intelligence blocklist?
  context: 'Active Setup StubPath values execute automatically at every user logon under that user''s
    context, so any write to this hive is high-value persistence telemetry. Collect Sysmon EID 12/13 and
    Windows EID 4657 events that create or modify a StubPath value, resolve the file path the value points
    to, and hash that file using the Sysmon EID 1 ImageHash for the spawned process. Compare both the
    raw StubPath value string and the resolved file hash against curated threat-intelligence blocklists.
    A positive match is a strong, high-confidence indicator of malicious persistence under MITRE ATT&CK
    T1547.014 and should be escalated immediately; a negative match does not clear the host because novel/unknown
    binaries will not appear on any blocklist and must be triaged with the other questions in this playbook.
    References: [MITRE ATT&CK T1547.014](https://attack.mitre.org/techniques/T1547/014/); [SigmaHQ rule
    corpus](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry hives (specifically HKLM\SOFTWARE\Microsoft\Active Setup\Installed Components\) on
    all Windows endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (Sysmon EID 12, Sysmon EID 13, WinEventLog EID 4657)\n  WHERE registry_path MATCHES\
      \ \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Active Setup\\\\Installed Components\\\\*\\\\StubPath\"\n \
      \ | resolve referenced_file FROM value_string\n  | join Sysmon EID 1 ON Image == referenced_file\
      \ -> get ImageHash(SHA256)\n  | WHERE value_string IN ti_blocklist OR ImageHash IN ti_hash_blocklist\n\
      \  | ALERT severity=high"
- question: Was any Active Setup StubPath value created or modified by a process lineage that is NOT an
    approved installer, patch agent, or SCCM/Intune deployment process?
  context: 'Writes to the Active Setup hive are extremely rare on a managed, steady-state endpoint and
    are normally produced only by trusted installers or configuration-management tooling (SCCM, Intune,
    MSI installers) during defined patch/deployment windows. Treat ANY StubPath create/modify whose parent
    process lineage is not on the approved-installer allowlist as a deterministic floor alert, regardless
    of statistical score. Additionally count StubPath writes per host per day: any count greater than
    zero outside an approved patch window is suspicious. This catches a sophisticated actor who plants
    persistence manually or via a non-standard tool, and is tactic-specific to Persistence because the
    write itself is the persistence act.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry hives (specifically HKLM\SOFTWARE\Microsoft\Active Setup\Installed Components\) on
    all Windows endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (Sysmon EID 12/13, WinEventLog EID 4657)\n  WHERE registry_path MATCHES \"*\\\\\
      Active Setup\\\\Installed Components\\\\*\\\\StubPath\"\n  | enrich writing_process_lineage\n  |\
      \ WHERE parent_lineage NOT IN approved_installer_allowlist (msiexec, TrustedInstaller, ccmexec,\
      \ IntuneMgmt)\n  | ALERT  // deterministic floor\n  | STATS count BY host, bin(1d) | WHERE count\
      \ > 0 AND NOT in_patch_window"
- question: How prevalent across the fleet is each observed StubPath value string and its referenced binary,
    and which are rare enough to warrant investigation?
  context: 'Roughly 99.7% of genuine threats are rare across a population, so prevalence is a powerful
    triage signal. Compute the fleet-wide prevalence of every distinct StubPath value string and referenced
    binary (how many hosts/users have ever exhibited it). Flag any value with prevalence below 0.1% or
    seen on fewer than five hosts. For Persistence this is meaningful because legitimate Active Setup
    components (deployed by software and Windows itself) are common across the fleet, while attacker-planted
    StubPath entries are typically unique or appear on only a handful of compromised hosts. A low-prevalence
    hit is a lead to investigate, not a verdict; correlate with IOC and interpreter checks before escalating.
    References: [What''s the deal with prevalence?](https://blog.f-secure.com/whats-the-deal-with-prevalence/).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry hives (specifically HKLM\SOFTWARE\Microsoft\Active Setup\Installed Components\) on
    all Windows endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  index=registry path=\"*Active Setup*StubPath\"\n  | STATS dc(host) AS host_count, dc(value_string)\
      \ BY value_string, referenced_binary\n  | EVAL prevalence = host_count / total_hosts\n  | WHERE\
      \ prevalence < 0.001 OR host_count < 5\n  | SORT prevalence asc"
- question: When a StubPath value's engineered features are scored by a trained classifier, is it predicted
    malicious, and which features drove that prediction?
  context: 'Train a Random Forest / XGBoost ensemble on static StubPath features: value-string length,
    Shannon entropy, path depth, presence of interpreter keywords (powershell, cmd, wscript, mshta, rundll32),
    signer status of the referenced file, and fleet prevalence of that file. Score new StubPath writes
    and surface the top-three feature contributions in the alert so the analyst gets an explainable rationale.
    Ensemble-on-static-features approaches achieve high accuracy on zero-day-style detection. For Persistence
    this complements IOC and rarity checks by catching never-before-seen malicious StubPath entries whose
    feature profile resembles known-bad ones. A high model score with interpreter/entropy contributions
    is a strong lead; verify against process execution context. References: [Performance Comparative Study
    on Zero Day Malware Detection Using XGBoost and Random Forest Classifiers](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry hives (specifically HKLM\SOFTWARE\Microsoft\Active Setup\Installed Components\) on
    all Windows endpoints.'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "  features = [str_len, shannon_entropy, path_depth, has_interpreter_kw, signer_status, ref_file_prevalence]\n\
      \  model = RandomForest/XGBoost.load(\"stubpath_clf\")\n  score = model.predict_proba(features)\n\
      \  IF score >= threshold: ALERT with top3 = shap_feature_contributions(features)"
- question: Does any new StubPath value invoke a scripting interpreter (powershell.exe, cmd.exe, wscript.exe,
    mshta.exe, rundll32.exe) or reference an executable located in a user-writable directory?
  context: 'Legitimate Active Setup components launch vendor binaries from protected program directories;
    they rarely call generic script interpreters or run executables out of user-writable locations. Alert
    when a StubPath value matches interpreter binary names or matches a regex for user-writable roots
    such as \Users\Public\, \AppData\, \Temp\, or \ProgramData\. These patterns are classic living-off-the-land
    persistence indicators reused from the SigmaHQ registry-persistence signatures. A match strongly suggests
    the adversary configured logon execution of a script or a dropped payload; pivot to the referenced
    file and its hash. Tactic relevance: this is the persistence configuration itself, evaluated before
    any logon execution occurs. References: [SigmaHQ rule corpus](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry and process execution logs on all Windows endpoints, with a focus on standard user
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source IN (Sysmon EID 12/13, WinEventLog EID 4657)\n  WHERE registry_path MATCHES \"*Active\
      \ Setup*StubPath\"\n  | WHERE value_string MATCHES_REGEX \"(?i)(powershell|cmd|wscript|cscript|mshta|rundll32)\\\
      .exe\"\n     OR value_string MATCHES_REGEX \"(?i)\\\\\\\\(Users\\\\\\\\Public|AppData|Temp|ProgramData)\\\
      \\\\\\\"\n  | ALERT"
- question: Are there access-denied or failed RegSetValue attempts against the Active Setup hive that
    indicate a low-privilege actor probing for persistence?
  context: Writing under HKLM requires elevation, so a low-privilege adversary may attempt and fail to
    set a StubPath value before finding another way in. Track Windows EID 4657 access-denied / failed
    RegSetValue events targeting HKLM\...\Active Setup\Installed Components as a distinct precursor signal.
    A burst of failed writes from a standard-user context is an early warning that an actor is attempting
    Active Setup persistence but lacks privilege; it can precede a successful write after escalation.
    For Persistence this failure-mode profiling surfaces attempts that would otherwise be invisible because
    they produced no lasting registry change. Correlate the source process and user with later successful
    writes.
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry and process execution logs on all Windows endpoints, with a focus on standard user
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  source=WinEventLog EID 4657\n  WHERE object_path MATCHES \"*Active Setup*Installed Components*\"\
      \n     AND (access_result IN (access_denied, failure) OR status != SUCCESS)\n  | STATS count BY\
      \ user, source_process, host\n  | WHERE count >= 1 | ALERT severity=medium"
- question: For StubPath paths not in the host baseline, do their string entropy and length exceed a robust
    anomaly threshold suggestive of obfuscation or randomized payload names?
  context: 'Malicious StubPath payloads are often dropped with high-entropy or unusually long randomized
    filenames/paths. For each StubPath path not already in the host''s baseline, compute Shannon entropy
    and string length, then flag values exceeding a robust modified Z-score threshold (|Mi| > 3.5) computed
    with the median absolute deviation. Using MAD rather than mean/standard deviation resists skew from
    the occasional legitimate installer that writes a long path. For Persistence this isolates obfuscated
    payload references planted in Active Setup. A flagged value is a lead; combine with prevalence and
    interpreter checks. Negative results are common for cleanly named legitimate components. References:
    [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry and process execution logs on all Windows endpoints, with a focus on standard user
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  values = stubpath_paths NOT IN host_baseline\n  med = median(len_and_entropy); mad = median(|x\
      \ - med|)\n  Mi = 0.6745 * (x - med) / mad\n  WHERE abs(Mi) > 3.5 | ALERT"
- question: Does a host's daily count of Active Setup hive writes deviate significantly from its role-based
    baseline?
  context: 'Establish per-host (and per-role) daily counts of Active Setup hive writes and alert on standard-deviation
    deviations from the role baseline. Most endpoints in a role exhibit near-zero Active Setup write activity,
    so a host suddenly producing several writes in a day stands out. For Persistence this volumetric baseline
    catches scripted or repeated persistence attempts and mass-deployment of malicious StubPath entries
    that a single-event rule might rate-limit or miss. A statistically significant spike is a lead to
    enumerate the specific writes on that host and inspect their values; a flat baseline gives confidence
    the host is unaffected. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry and process execution logs on all Windows endpoints, with a focus on standard user
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  index=registry path=\"*Active Setup*\" action=write\n  | STATS count AS writes BY host,\
      \ role, bin(1d)\n  | EVENTSTATS mean(writes) AS mu, stdev(writes) AS sd BY role\n  | WHERE writes\
      \ > mu + 3*sd | ALERT"
- question: When runonce.exe-launched processes are clustered on path, command line, hash, and signer,
    which form small or noise clusters indicating novel Active Setup-spawned payloads?
  context: 'runonce.exe is a canonical launcher of Active Setup logon execution. Cluster all runonce.exe-launched
    child processes on features such as image path, command line, file hash, and signer. Legitimate Active
    Setup executions form large, tight clusters of well-known signed binaries; attacker payloads appear
    as small or noise clusters. Investigate those outliers and emit each cluster''s distinguishing features.
    Unsupervised reconstruction-error scoring (Kitsune-style) can additionally rank novel runonce children
    by how anomalous they are. For Persistence this surfaces never-before-seen logon-execution payloads
    without prior signatures. Small clusters are leads; pivot to the StubPath value that referenced them.
    References: [Kitsune](https://doi.org/10.14722/ndss.2018.23204).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry and process execution logs on all Windows endpoints, with a focus on standard user
    workstations.'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "  procs = processes WHERE parent_image == \"runonce.exe\"\n  X = vectorize(image_path, command_line,\
      \ hash, signer)\n  clusters = DBSCAN/HDBSCAN(X)\n  FOR c IN clusters WHERE size(c) small OR label\
      \ == noise:\n     ALERT with distinguishing_features(c)"
- question: Within 120 seconds of an interactive logon, did a process not on the per-host allowlist spawn
    from runonce.exe or explorer.exe?
  context: 'The canonical Active Setup logon-execution lineage is runonce.exe (or explorer.exe) spawning
    a child shortly after an interactive logon. Correlate Windows EID 4624 LogonType 2 (interactive) or
    10 (RemoteInteractive) to EID 4688 process creations within 120 seconds, and alert when a child spawned
    from runonce.exe/explorer.exe is not on the per-host allowlist of expected startup processes. This
    anomalous parent-child logic is adapted from established unusual-parent-child detection rules. For
    Persistence this confirms that a planted StubPath actually executed at logon. A non-allowlisted child
    is a strong lead; correlate it back to the StubPath write and forward to the network/IOC checks. References:
    [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Process creation and user logon logs from all Windows endpoints, especially those of privileged
    users.'
  range: Last 90 days; correlate within 120s of each interactive logon event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  logons = EID 4624 WHERE LogonType IN (2,10)\n  procs  = EID 4688 / Sysmon EID 1 WHERE ParentImage\
      \ IN (runonce.exe, explorer.exe)\n  | join ON host AND procs.time BETWEEN logon.time AND logon.time+120s\n\
      \  | WHERE child_image NOT IN per_host_startup_allowlist\n  | ALERT"
- question: Does the observed sequence logon -> runonce -> process -> network match the Active Setup persistence
    pattern when encoded as logic facts?
  context: 'Encode the end-to-end behavior (interactive logon, then runonce execution, then child process
    creation, then outbound network connection) as logic facts and evaluate them against a rule that defines
    the Active Setup persistence pattern, yielding a human-readable rationale (MalpMiner-style ASP reasoning).
    This produces an explainable verdict an analyst can defend, listing exactly which facts fired. For
    Persistence this links the registry-configured autostart to actual logon execution and any resulting
    beaconing. A satisfied rule with a complete chain is high-confidence; a partial chain (e.g., logon->runonce
    but no network) is a lower-priority lead worth monitoring. References: [MalpMiner ASP framework](https://doi.org/10.1109/ACCESS.2023.3266562).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Process creation and user logon logs from all Windows endpoints, especially those of privileged
    users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  fact logon(H,U,T0); fact runonce_exec(H,T1) WHERE T1>T0;\n  fact child_proc(H,P,T2) WHERE\
      \ parent=runonce, T2>T1;\n  fact net_conn(H,P,Dst,T3) WHERE T3>T2;\n  persistence(H) :- logon, runonce_exec,\
      \ child_proc, net_conn within window\n  | EMIT rationale(facts) | ALERT"
- question: Is a post-logon startup process below the user-specific 5th-percentile frequency, and is its
    logon-to-execution latency anomalous for that user's cohort?
  context: 'Baseline each user''s normal post-logon startup processes and flag any startup process below
    that user''s 5th-percentile frequency (rarely or never seen for them). Additionally score the logon-to-execution
    latency with a MAD-based modified Z-score, and use peer-group/UEBA baselining (Microsoft Sentinel
    UEBA) to surface hosts deviating from their cohort. For Persistence, an attacker-planted StubPath
    produces a startup process that is anomalous for that user and may execute at an unusual latency relative
    to peers. A rare process plus anomalous latency is a strong lead; common processes at typical latency
    are benign. This is user-centric rather than fleet-centric, catching targeted persistence on a single
    account. References: [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Process creation and user logon logs from all Windows endpoints, especially those of privileged
    users.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  per_user_freq = freq(startup_process | user)\n  WHERE per_user_freq < p5(user)\n  | EVAL\
      \ latency = exec_time - logon_time\n  | EVAL Mz = 0.6745*(latency - median_user)/mad_user\n  | WHERE\
      \ abs(Mz) > 3.5 OR rare_process | ALERT"
- question: Does an LSTM model of benign post-logon event sequences flag the current sequence with high
    reconstruction error or low next-event probability?
  context: 'Train an LSTM (DeepLog-style) on benign post-logon event sequences so it learns the normal
    ordering of events following an interactive logon. Score live sequences and alert when reconstruction
    error is high or the next-event probability is low, surfacing the specific offending event and its
    diagnostic context. For Persistence, an Active Setup payload injects an unexpected execution event
    into the post-logon sequence that the model did not expect, producing a high anomaly score. A flagged
    sequence is a lead pinpointing the anomalous step; the analyst then inspects that process and its
    StubPath origin. Benign, well-modeled logon sequences score low and require no action. References:
    [DeepLog](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Process creation and user logon logs from all Windows endpoints, especially those of privileged
    users.'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "  seq = ordered_events_after_logon(host, session)\n  err, p_next = lstm_deeplog.score(seq)\n\
      \  IF err > thr OR p_next < eps:\n     ALERT offending_event = argmax_anomaly(seq), context=window"
- question: When the logon process subtree is scored with a node-level GNN, is there an anomalous node
    localizing a StubPath-spawned process, and does whole-system graph scoring link it to the registry
    write?
  context: 'Build a provenance graph of the logon process subtree and score each node with a node-level
    GNN (ThreaTrace-style) to localize the anomalous StubPath-spawned process node. Then apply whole-system
    temporal-graph scoring (KAIROS-style) to link the earlier registry write to the later logon execution,
    reconstructing the full persistence chain. For Persistence this provides the strongest causal evidence:
    it ties the Active Setup StubPath modification directly to the anomalous process executed at logon.
    A flagged node with a graph edge back to the registry write is high-confidence persistence; isolated
    benign nodes score normally. Use this to confirm and scope the incident. References: [ThreaTrace](https://arxiv.org/pdf/2111.04333);
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Sysmon Event ID 1
  - Zeek conn.log
  - 'NAI: Process creation and user logon logs from all Windows endpoints, especially those of privileged
    users.'
  range: Last 90 days
  queries:
  - technology: ML/Model pseudocode
    query: "  G = provenance_graph(logon_session)\n  node_scores = threatrace_gnn(G)\n  anomalous = nodes\
      \ WHERE node_scores > thr\n  chain = kairos_temporal_link(registry_write -> anomalous_process)\n\
      \  IF chain: ALERT localize(anomalous), evidence=chain"
- question: Was an Active Setup StubPath value created/modified to execute a known auto-elevating binary
    (fodhelper.exe, sdclt.exe, eventvwr.exe, cmstp.exe) whose child process is non-Microsoft-signed, matching
    a UAC-bypass pattern?
  context: 'Adversaries chain Active Setup with auto-elevating Windows binaries to bypass UAC and run
    code at high integrity. Correlate StubPath writes with subsequent execution of auto-elevating binaries
    (eventvwr, fodhelper, sdclt, cmstp) where the resulting child process is non-Microsoft-signed, alerting
    on the known bypass patterns documented by Elastic and the SigmaHQ corpus. For Privilege Escalation
    this is the core abuse: the StubPath sets up logon execution and the auto-elevating binary grants
    elevation. A non-signed child spawned by one of these binaries after a StubPath write is high-confidence;
    legitimate use of these binaries spawns signed Microsoft children. Escalate and inspect the spawned
    payload. References: [Bypass UAC via Event Viewer](https://www.elastic.co/guide/en/security/current/bypass-uac-via-event-viewer.html);
    [SigmaHQ rule corpus](https://github.com/SigmaHQ/sigma).'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry hives and process command-line logs on all Windows workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  stub = registry_write WHERE path MATCHES \"*Active Setup*StubPath\"\n  elev = EID 4688/Sysmon1\
      \ WHERE Image IN (fodhelper,sdclt,eventvwr,cmstp).exe\n  | join ON host within session\n  | WHERE\
      \ elev.child.signer != \"Microsoft\" OR elev.child NOT trusted\n  | ALERT severity=high"
- question: Within the same logon session as an Active Setup StubPath modification, was a known UAC-bypass
    hijack registry key written (e.g., ms-settings\shell\open\command or mscfile\shell\open\command)?
  context: Known UAC-bypass techniques write command-handler hijack keys such as HKCU\Software\Classes\ms-settings\shell\open\command
    or mscfile\shell\open\command, which auto-elevating binaries then read. Alert deterministically (a
    floor, regardless of score) whenever such a hijack key write co-occurs with an Active Setup StubPath
    modification in the same logon session. For Privilege Escalation, the co-occurrence is a near-unambiguous
    signal that the adversary is staging both persistence (Active Setup) and elevation (hijack key). This
    deterministic floor ensures the combination is never rate-limited away. Inspect both writes, the user
    context, and any auto-elevating binary executed afterward.
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4688
  - Sysmon Event ID 13
  - Sysmon Event ID 1
  - Sysmon Event ID 12
  - 'NAI: Registry hives and process command-line logs on all Windows workstations.'
  range: Last 90 days; correlate within a single logon session.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  hijack = registry_write WHERE path MATCHES_ANY(\n     \"*\\\\Classes\\\\ms-settings\\\\\
      shell\\\\open\\\\command\",\n     \"*\\\\Classes\\\\mscfile\\\\shell\\\\open\\\\command\")\n  stub\
      \ = registry_write WHERE path MATCHES \"*Active Setup*StubPath\"\n  | WHERE same_logon_session(hijack,\
      \ stub) | ALERT  // deterministic floor"
- question: Do auto-elevating binary executions have command-line length or entropy exceeding the robust
    per-binary baseline, suggesting injected or obfuscated arguments?
  context: 'Auto-elevating binaries normally run with short, predictable command lines. For each such
    binary, baseline its command-line length and entropy, then flag executions exceeding the robust modified
    Z-score threshold (MAD-based) of that per-binary baseline. For Privilege Escalation, an adversary
    abusing fodhelper/eventvwr/sdclt/cmstp often passes unusual or obfuscated arguments, inflating length/entropy
    beyond normal. A flagged execution is a lead indicating possible weaponized invocation; correlate
    with the StubPath write and child signer. Using MAD makes the threshold resistant to occasional legitimate
    long invocations, reducing false positives compared to mean/standard-deviation methods. References:
    [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
