    query: "  fact stub_write(H,R,T0); fact elev_proc(H,P,T1) WHERE T1 in [T0,T0+5m];\n  fact resource_access(H,P,R,T2)\
      \ WHERE T2 in [T1,T0+5m]\n  elevation_chain(H) :- stub_write, elev_proc, resource_access\n  | EMIT\
      \ facts | ALERT"
- question: Were there failed or blocked elevation attempts (UAC-deny, EID 4657 access-denied, blocked
    CreateProcess) preceding a successful elevation tied to Active Setup?
  context: Adversaries frequently trigger failed elevations before a successful one. Profile UAC-deny
    events, EID 4657 access-denied results, and blocked CreateProcess attempts as a distinct precursor
    signal that precedes successful escalation. For Privilege Escalation this surfaces the noisy trial-and-error
    phase of a UAC-bypass attempt that a success-only rule would miss, and provides early warning. A cluster
    of failed elevations from a context later associated with an Active Setup StubPath write/execution
    strongly suggests an active escalation attempt. Correlate the failing user/process with subsequent
    success and treat the pre-success failures as part of the same incident timeline.
