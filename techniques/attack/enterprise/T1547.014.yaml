      \ threshold AND followed_by(success_elevation)\n  | ALERT severity=medium"
- question: How probable is each observed parent-child process transition (e.g., runonce->fodhelper, explorer->cmstp),
    and which low-probability transitions stand out?
  context: 'Model conditional probabilities of parent-child process transitions across the fleet and flag
    low-probability pairs, augmenting with peer baselining via Microsoft Sentinel UEBA. Combinations like
    runonce->fodhelper or explorer->cmstp are rare in benign activity and characteristic of Active Setup-driven
    UAC bypass. For Privilege Escalation, a low-P transition concentrates attention on the exact lineage
    an adversary uses to chain logon execution into elevation. A statistically improbable transition is
    a lead; pivot to the command line, signer, and integrity level of the child. Common, high-probability
    transitions are benign and filtered out, keeping volume manageable. References: [Microsoft Sentinel
    UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
