- question: Does the per-host frequency of a (parent, child, integrity-level) tuple fall outside the standard-deviation
    baseline, indicating an anomalous elevation lineage?
  context: 'Track per-host frequency of (parent process, child process, integrity-level) tuples and alert
    on standard-deviation outliers. The integrity-level dimension is key for Privilege Escalation: a tuple
    where a normally medium-integrity lineage suddenly produces a high-integrity child is a hallmark of
    successful elevation. A rare tuple on a host whose baseline never showed it is a lead pointing at
    the specific elevation lineage to investigate. This volumetric/statistical approach complements the
    probability scoring by being host-specific, catching escalations that are common fleet-wide but novel
    for a particular endpoint. References: [Finding Anomalies in Windows Event Logs Using Standard Deviation](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
