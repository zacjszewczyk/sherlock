      \ | ALERT"
- question: When a GNN is trained on process-file-registry graphs, does it flag an anomalous subgraph
    representing the UAC-bypass chain, and can the chain be reconstructed?
  context: 'Train a GNN on process-file-registry graphs and flag anomalous subgraphs that represent the
    bypass chain, localizing the offending nodes (ThreaTrace-style) and reconstructing the chain end to
    end (KAIROS-style). For Privilege Escalation this gives causal, graph-based evidence linking the StubPath
    write, the auto-elevating process, and the elevated action into one explainable subgraph. A flagged
    subgraph spanning registry write -> auto-elevating binary -> elevated resource access is high-confidence
    escalation evidence and ideal for scoping the incident. Benign sessions produce normal subgraphs that
    score low. Use the node localization to identify exactly which process/resource to remediate. References:
    [ThreaTrace](https://arxiv.org/pdf/2111.04333); [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
