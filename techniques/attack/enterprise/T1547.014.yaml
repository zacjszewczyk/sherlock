      \  model = GradientBoosting/RandomForest.load(\"autoelev_clf\")\n  IF model.predict_proba(features)\
      \ >= thr:\n     ALERT top3 = feature_importance(features)"
- question: On a single host, was a StubPath write followed within 5 minutes by an auto-elevating process
    creation and then access to the resource referenced by the StubPath?
  context: 'The integrity-elevation chain is: (1) StubPath value modified, (2) an auto-elevating binary
    executes, (3) that binary accesses the file or registry key the StubPath referenced. Alert when this
    ordered sequence completes within 5 minutes on one host, and encode the chain as logic facts for explainable
    matching (MalpMiner-style). For Privilege Escalation this is direct evidence that the Active Setup
    configuration was used to drive an elevation, not merely planted. A completed three-step chain is
    high-confidence and should be escalated with its fact list as rationale. A partial chain (e.g., write
    + elevation but no resource access) is a lower-confidence lead worth correlating with the other evidence
    streams. References: [MalpMiner ASP framework](https://doi.org/10.1109/ACCESS.2023.3266562).'
  answer_sources:
