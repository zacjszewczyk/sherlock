      \ mad=median(|x-med|)\n  Mz = 0.6745*(x - med)/mad\n  WHERE abs(Mz) > 3.5 | ALERT  // cmd_metric\
      \ = length and shannon_entropy"
- question: When an auto-elevating execution is scored by a trained model on parent lineage, arguments,
    integrity level, logon timing, and registry context, is it predicted malicious, and which features
    contributed most?
  context: 'Train a Gradient Boosting / Random Forest model on features spanning parent process lineage,
    command-line arguments, integrity level, logon timing, and surrounding registry context to score auto-elevating
    executions, reporting the top-three contributing features. For Privilege Escalation this synthesizes
    the weak signals (suspicious parent, odd timing relative to logon, nearby StubPath/hijack-key writes,
    high integrity) into a single explainable verdict. A high model score with contributions like non-standard
    parent + StubPath context + high integrity strongly indicates an Active Setup-driven UAC bypass. The
    top-feature explanation lets the analyst validate quickly. Use alongside the deterministic hijack-key
    and UAC-pattern rules for coverage of both known and novel bypasses. References: [Performance Comparative
    Study on Zero Day Malware Detection Using XGBoost and Random Forest Classifiers](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers).'
