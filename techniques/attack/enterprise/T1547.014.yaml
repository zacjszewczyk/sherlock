    query: "  G = build_graph(processes, files, registry, session)\n  sub_scores = gnn.score_subgraphs(G)\n\
      \  anomalous = subgraphs WHERE sub_scores > thr\n  chain = kairos_reconstruct(anomalous)\n  IF chain:\
      \ ALERT localize_nodes(anomalous), evidence=chain"
- question: Did a process whose ancestry traces back to an Active Setup execution subsequently create
    a service (EID 7045), modify a Run key, or write to System32?
  context: 'Successful escalation manifests as privileged actions a standard user could not perform. Correlate
    process ancestry that traces back to an Active Setup execution with subsequent service creation (EID
    7045), HKLM Run-key writes, or writes into C:\Windows\System32, reusing parent-lineage logic from
    established unusual-parent-child rules. For Privilege Escalation this confirms the chain produced
    real elevated capability, not just a high-integrity token. A privileged action with Active Setup ancestry
    is high-confidence escalation evidence; escalate and inspect the created service/Run-key/binary. Correlating
    ancestry avoids false positives from legitimate admin tooling that has no Active Setup origin. References:
    [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).'
