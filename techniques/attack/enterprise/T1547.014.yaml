name: 'T1547.014: Active Setup'
id: a05edf49-26ca-430d-aeba-c656cd243c13
description: 'Investigate adversary abuse of the Windows Active Setup mechanism (HKLM\SOFTWARE\Microsoft\Active
  Setup\Installed Components\) to establish persistence and escalate privileges. Adversaries create or
  modify a StubPath value so that an attacker-controlled program runs automatically at user logon under
  the logging-in account''s context. This playbook helps an analyst hunt for and triage: (1) creation/modification
  of Active Setup StubPath values that match threat-intelligence IOCs, invoke scripting interpreters,
  or point to user-writable directories; (2) rare or anomalous StubPath values and referenced binaries
  scored against fleet-wide prevalence and entropy baselines; (3) processes that spawn from runonce.exe/explorer.exe
  shortly after an interactive logon with unusual parent-child lineage; and (4) the privilege-escalation
  chain where a StubPath write leads to execution of auto-elevating binaries (fodhelper.exe, sdclt.exe,
  eventvwr.exe, cmstp.exe), UAC-bypass hijack-key writes, and subsequent privileged actions such as service
  creation, Run-key writes, or writes into protected system directories. Symbolic-logic rules, statistical
  anomaly scoring, and machine-learning models are provided for each evidence stream so the analyst can
  confirm or refute Active Setup abuse across persistence and privilege-escalation tactics.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
