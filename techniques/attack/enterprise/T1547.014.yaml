- question: Does a session's weighted count of privileged actions exceed the user-role 99th percentile,
    indicating an abnormal concentration of escalation activity?
  context: 'Score each session by a weighted count of privileged actions (service creations, Run-key writes,
    System32 writes, integrity transitions) and alert when the score exceeds the user-role 99th percentile,
    deriving robust thresholds with the modified Z-score. For Privilege Escalation this catches an Active
    Setup-driven session that accumulates an abnormal amount of privileged activity relative to peers
    in the same role, even if no single action is individually alarming. A session above the 99th-percentile
    risk score is a strong lead to review holistically. Role-relative, MAD-based thresholds keep admin
    roles (which legitimately do privileged work) from drowning out standard-user anomalies. References:
    [Modified Z-Score for Anomaly Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
