      \ ON ancestry == active_setup_desc\n  | ALERT severity=high"
- question: Was there ANY write to an HKLM Run key, to System32, or any new service creation whose process
    lineage includes an Active Setup execution?
  context: 'Apply a deterministic floor: alert on ANY HKLM Run-key write, System32 file write, or new
    service creation whose lineage includes an Active Setup execution, regardless of any statistical score.
    For Privilege Escalation these actions require elevation, so their occurrence from an Active Setup-rooted
    lineage is itself proof the adversary obtained and used elevated privilege. The floor guarantees this
    combination is never suppressed by rate limits or scoring thresholds. Each hit warrants immediate
    triage of the written artifact (service binary, Run-key target, or System32 file) and the originating
    StubPath. This catches both noisy commodity malware and careful targeted actors.'
