      \ | ALERT"
- question: Does an Isolation Forest over the time-series of process events (RegSetValue, CreateFile,
    CreateService) flag an anomalous escalation sequence, and what per-feature attribution explains it?
  context: 'Run an Isolation Forest over the time-series of process events (RegSetValue, CreateFile, CreateService)
    to flag anomalous sequences with per-feature attribution, optionally adding an LSTM next-event model
    (DeepLog-style) for diagnostic context. For Privilege Escalation the StubPath-driven elevation produces
    an unusual ordering/combination of registry, file, and service events that the Isolation Forest isolates
    with few splits. A flagged sequence with attribution pointing at, say, a RegSetValue followed by CreateService
    is a lead localizing the escalation behavior. The LSTM adds which next event was unexpected. Benign
    sequences require many splits to isolate and score low, keeping noise down. References: [Isolation
    Forest](https://doi.org/10.1145/2133360.2133363); [DeepLog](https://doi.org/10.1145/3133956.3134015).'
