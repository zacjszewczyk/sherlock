  context: Statistical deviation from expected permissions catches subtle tampering. Flag files whose
    permissions deviate from the established norm (executables 755, configuration files 644) and count
    deviation events per host with a MAD-based modified Z-score, flagging values above 3.5. The robust
    median/MAD statistic resists skew from rare legitimate changes. A cluster of permission deviations
