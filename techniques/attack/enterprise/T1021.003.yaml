name: 'T1021.003: Distributed Component Object Model'
id: a93ced71-4830-43e8-ad33-7dc4d99e946d
description: Investigate adversary lateral movement via Distributed Component Object Model (DCOM) on Windows,
  where an actor uses valid (often privileged) accounts to remotely activate COM objects over DCE/RPC
  and execute code as the logged-on user. This playbook correlates inbound DCOM/DCE-RPC traffic (TCP 135
  plus negotiated dynamic high ports) with remote Type-3 logons (Event ID 4624/4625) and execution-related
  RPC operations; hunts for COM-host parents (mmc.exe, explorer.exe, Office apps, mshta.exe) and the COM
  surrogate dllhost.exe spawning interpreters or loading rare modules; profiles DCOM connection bursts,
  fan-out/out-degree, and segmentation violations across east-west network flows; and detects registry
  tampering of DCOM permissions and COM server registration (AppID LaunchPermission/RunAs, CLSID LocalServer32/InprocServer32)
  preceding remote logon. It blends deterministic symbolic-logic rules, statistical baselining (MAD, percentiles,
  conditional probability, entropy), and machine-learning detectors (supervised classifiers, Isolation
  Forest/DBSCAN, temporal graph link prediction, sequence models) so an analyst can confirm or refute
  DCOM-based remote code execution under Lateral Movement.
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
