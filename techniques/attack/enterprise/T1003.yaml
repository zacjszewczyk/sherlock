- question: Are SAM/LSA access events occurring outside normal time windows (outside the 5th-95th percentile)
    or in counts beyond the host/role baseline (mean + 3 sigma)?
  context: 'Legitimate access to SAM/LSA follows predictable timing (e.g., backups, patching). Baseline
    normal access time windows and counts per host/role and flag events outside the 5th-95th percentile
    of the timing distribution or beyond mean + 3 sigma in count. Off-hours or unusually frequent SAM/LSA
    access, even by a normally-allowed process, can indicate misuse or a masquerading process worth investigating.
    References: [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
