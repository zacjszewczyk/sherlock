    versus their own baseline or peer group (mean + 3 sigma). A burst of LSA-key changes, especially clustered
    with other indicators, suggests an adversary weakening credential protections. References: [Finding
    Anomalies in Windows Event Logs Using Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
