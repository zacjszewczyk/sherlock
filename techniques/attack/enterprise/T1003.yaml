    Event IDs 4663/4656/4657 log access to %SystemRoot%\system32\config\SAM or HKLM\SECURITY\Policy\Secrets
    by processes outside a strict allowlist (lsass.exe, services.exe, System, approved backup agents),
    and on reg.exe save of HKLM\SAM|SYSTEM|SECURITY. These are textbook T1003 actions; validate via Atomic
    Red Team T1003.001. References: [OS Credential Dumping (T1003), MITRE ATT&CK](https://attack.mitre.org/techniques/T1003/);
    [Atomic Red Team T1003.001](https://www.atomicredteam.io/docs/atomics/T1003.001).'
