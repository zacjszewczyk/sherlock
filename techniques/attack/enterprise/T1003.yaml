- question: Does an autoencoder trained on golden-image security-registry values flag a host's configuration
    (e.g., RunAsPPL) as drifted via high reconstruction error, and can the change be tied to a causal
    process chain?
  context: 'Configuration drift away from a hardened baseline is a leading indicator of defense weakening.
    Train an autoencoder on golden-image values for security registry keys including RunAsPPL and alert
    when a host''s configuration yields high reconstruction error, surfacing the top deviating keys. A
    provenance autoencoder (KAIROS-style) can additionally tie the change to the causal process chain
    so the analyst sees who/what disabled the protection. References: [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf).'
