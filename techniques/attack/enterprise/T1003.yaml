    in DC cluster, off-hours timing, broad object scope). This catches DCSync from compromised hosts that
    mimic protocol details but differ in behavioral profile. References: [Comprehensive evaluation of
    Mal-API-2019 by machine learning](https://arxiv.org/abs/2403.02232).'
