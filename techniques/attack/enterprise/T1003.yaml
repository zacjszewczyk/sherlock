  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE (Event12.source='Wininit'\n  AND message CONTAINS 'LSA was not started as a protected\
      \ process')\nOR (Event4657.key ENDSWITH '\\\\Control\\\\Lsa\\\\RunAsPPL'\n  AND new_value IN [0,\
      \ removed])"
