  - technology: SIEM/Stats pseudocode
    query: "t_lo,t_hi = PERCENTILE(access_hour,[5,95]) PER host/role\nmu,sigma = BASELINE(access_count)\
      \ PER host/role OVER 90d\nALERT WHERE access_hour NOT IN [t_lo,t_hi]\n  OR access_count > mu + 3*sigma"
- question: Did non-allowlisted processes generate failed handle requests (Event ID 4656 with failure
    result) to the SAM or SECURITY objects?
  context: 'Failed access to SAM/SECURITY is itself diagnostic: a process that tries and is denied is
    probing for credentials. Track failed handle requests to SAM/SECURITY by non-allowlisted processes
    as a distinct signal and alert on any occurrence or on spikes beyond baseline. Because legitimate
    processes rarely fail accessing these objects, even a single denied attempt by an unexpected process
    is a meaningful Credential Access lead. References: [Finding Anomalies in Windows Event Logs Using
    Standard Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
