- question: Did Wininit log Event ID 12 stating 'LSA was not started as a protected process', or did Event
    ID 4657 record a modification to HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL disabling it?
  context: 'Disabling LSA protected process (RunAsPPL) removes the main barrier to LSASS memory dumping
    and is a common precursor step. Trigger immediately on Event ID 12 (Wininit) containing ''LSA was
    not started as a protected process'' and on Event ID 4657 changes to HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL
    that disable it. On a DC or PAW this is critical: a RunAsPPL regression should be treated as an imminent-LSASS-dumping
    warning. References: [OS Credential Dumping (T1003), MITRE ATT&CK](https://attack.mitre.org/techniques/T1003/).'
  answer_sources:
  - Windows Event ID 12
  - Windows Event ID 4657
  - 'NAI: All Windows 8.1/Server 2012 R2 and newer systems, especially Domain Controllers and PAWs'
