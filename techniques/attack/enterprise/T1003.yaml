  - technology: ML/Autoencoder pseudocode
    query: "X = security_registry_values(host)  // incl. RunAsPPL\nerr = Autoencoder(golden_image).recon_error(X)\n\
      ALERT WHERE err > threshold WITH top_deviating_keys\n  ENRICH causal_process_chain via provenance_graph"
