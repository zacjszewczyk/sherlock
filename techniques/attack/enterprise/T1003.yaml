- question: Does a one-class model trained on legitimate SAM/LSA access traces flag an event or trace
    as falling outside the learned normal boundary?
  context: 'When allowlists are incomplete, anomaly detection fills the gap. Train a one-class SVM or
    leverage-based scorer on legitimate SAM/LSA access traces (process, user, timing, access type) and
    flag events or traces that fall outside the learned boundary, reporting the deviating features. This
    catches novel or masquerading processes accessing credential stores that no static rule anticipated.
    References: [Business Process Event Log Anomaly Detection based on Statistical Leverage](https://ceur-ws.org/Vol-2952/paper_291a.pdf).'
