- question: '[Persistence] Obfuscated startup command detection (Symbolic Logic): For Registry Run Keys
    - Startup Folder (T1547.001), can you determine whether a new or modified startup item contains command-line
    arguments indicative of obfuscation, remote script execution, or the use of living-off-the-land binaries
    (LOLBAS), particularly from non-standard directories. -- specifically, applying the ''Obfuscated startup
    command detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), adversaries abuse Windows Registry
    Run/RunOnce/RunServices keys and Startup-folder items to automatically execute code at logon or boot,
    blending malicious autostart entries in with legitimate ones. This evidence focuses on the condition
    that a new or modified startup item contains command-line arguments indicative of obfuscation, remote
    script execution, or the use of living-off-the-land binaries (LOLBAS), particularly from non-standard
    directories. This Symbolic Logic approach works as follows: Inspect the value DATA written to Run
    keys and the command line of Startup-folder items (Sysmon EID 1/13, Windows 4657/4688) for obfuscation/LOLBAS
    markers — -enc/-encodedcommand, -w hidden, FromBase64String, IEX/Invoke-Expression, DownloadString/DownloadFile,
    IWR/Invoke-WebRequest, certutil, bitsadmin, mshta — especially launching from temp/user-writable paths,
    per the [SigmaHQ PowerShell-in-Run-keys rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_powershell_in_run_keys.yml);
    alert on any hit. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    an autostart entry or its referenced payload deviates from sanctioned, baselined software and warrants
    triage: pivot to the responsible process and its parent lineage, the writing user and their privilege
    level, the resolved binary/script on disk, and any subsequent network activity. A negative result
    helps reduce confidence in this specific persistence vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, masqueraded, or living-off-the-land
    persistence.'
