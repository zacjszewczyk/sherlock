questions:
- question: '[Persistence] Startup IOC comparison (Symbolic Logic): For Registry Run Keys - Startup Folder
    (T1547.001), can you determine whether a newly created file, shortcut, or registry value in a designated
    startup location has a hash, path, or value that matches a known indicator of compromise (IOC) from
    an integrated threat intelligence platform. -- specifically, applying the ''Startup IOC comparison''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), adversaries abuse Windows Registry
    Run/RunOnce/RunServices keys and Startup-folder items to automatically execute code at logon or boot,
    blending malicious autostart entries in with legitimate ones. This evidence focuses on the condition
    that a newly created file, shortcut, or registry value in a designated startup location has a hash,
    path, or value that matches a known indicator of compromise (IOC) from an integrated threat intelligence
    platform. This Symbolic Logic approach works as follows: On every write to a Run/RunOnce/RunOnceEx/RunServices
    key or a Startup-folder shortcut (Sysmon EID 11/13, Windows 4657/4663), resolve the referenced binary,
    hash it, and compare against (1) a first-party allowlist built from a fleet-wide [Autoruns/autorunsc](https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns)
    baseline of signed, prevalent autostart entries and (2) local IOC sets before any external TI lookup;
    alert on IOC match (confidence >80%) or on any value not on the allowlist. Use the authoritative ASEP
    key inventory in [Hexacorn ASEP catalog](https://www.hexacorn.com/blog/2017/01/13/beyond-good-ol-run-key-part-55/)
    and the legitimate-value semantics in [Microsoft Run/RunOnce docs](https://learn.microsoft.com/en-us/windows/win32/setupapi/run-and-runonce-registry-keys)
    (e.g., RunOnce ''!''/''*'' prefixes) to suppress benign installer churn. A positive result -- a rule
    match, statistical outlier, or model alert -- indicates an autostart entry or its referenced payload
    deviates from sanctioned, baselined software and warrants triage: pivot to the responsible process
    and its parent lineage, the writing user and their privilege level, the resolved binary/script on
    disk, and any subsequent network activity. A negative result helps reduce confidence in this specific
    persistence vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, masqueraded, or living-off-the-land persistence.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: All workstations and servers; Registry hives including HKLM\Software\Microsoft\Windows\CurrentVersion\Run,
    HKCU\Software\Microsoft\Windows\CurrentVersion\Run; Filesystem paths including C:\ProgramData\Microsoft\Windows\Start
    Menu\Programs\Startup, C:\Users\[Username]\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Startup IOC comparison (Symbolic Logic)

      source IN [Windows Event ID 4657, Windows Event ID 4663, Windows Event ID 4688, Sysmon Event ID
      1, Sysmon Event ID 11]

      // scope: Registry Run/RunOnce/RunServices/Policies\Explorer\Run keys,

      //        Session Manager BootExecute, and Startup-folder items

      // implement: On every write to a Run/RunOnce/RunOnceEx/RunServices key or a Startup-folder shortcut
      (Sysmon EID 11/13, Windows 4657/4663), resolve the referenced binary, hash it, and compare against
      (1) a first-party allowlist built from a fleet-wide [Autoruns/autorunsc](https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns)
      baseline of signed, prevalent autostart entries and (2) local IOC sets before any external TI lookup;
      alert on IOC match (confidence >80%) or on any value not on the allowlist. Use the authoritative
      ASEP key inventory in [Hexacorn ASEP catalog](https://www.hexacorn.com/blog/2017/01/13/beyond-good-ol-run-key-part-55/)
      and the legitimate-value semantics in [Microsoft Run/RunOnce docs](https://learn.microsoft.com/en-us/windows/win32/setupapi/run-and-runonce-registry-keys)
      (e.g., RunOnce ''!''/''*'' prefixes) to suppress benign installer churn.

      // emit: host, user, privilege_level, autostart_key/path, resolved_binary,

      //       hash, signer, parent_process, network_dest, score'
- question: '[Persistence] Rare startup scoring (Statistical Method): For Registry Run Keys - Startup
    Folder (T1547.001), can you determine whether a newly created file, shortcut, or registry value in
    a designated startup location has a hash, path, or value that matches a known indicator of compromise
    (IOC) from an integrated threat intelligence platform. -- specifically, applying the ''Rare startup
    scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), adversaries abuse Windows Registry
    Run/RunOnce/RunServices keys and Startup-folder items to automatically execute code at logon or boot,
    blending malicious autostart entries in with legitimate ones. This evidence focuses on the condition
    that a newly created file, shortcut, or registry value in a designated startup location has a hash,
    path, or value that matches a known indicator of compromise (IOC) from an integrated threat intelligence
    platform. This Statistical Method approach works as follows: Baseline 90-day prevalence and PE/byte
    Shannon entropy of autostart binaries; flag entries seen on <5 hosts (below 5th percentile prevalence)
    AND whose section entropy exceeds the packed/encrypted thresholds from [Lyda & Hamrock entropy analysis](https://ieeexplore.ieee.org/document/4140989)
    (packed ~6.8, encrypted ~7.2 bits/byte). Report Volume (file size, bytes written), Frequency (writes/host/day),
    and State (signed vs unsigned, present-in-baseline yes/no) so triage sees concrete deltas, not just
    a label. A positive result -- a rule match, statistical outlier, or model alert -- indicates an autostart
    entry or its referenced payload deviates from sanctioned, baselined software and warrants triage:
    pivot to the responsible process and its parent lineage, the writing user and their privilege level,
    the resolved binary/script on disk, and any subsequent network activity. A negative result helps reduce
    confidence in this specific persistence vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, masqueraded, or living-off-the-land persistence.'
