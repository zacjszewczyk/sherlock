- question: '[Persistence] Startup risk classifier (Machine Learning): For Registry Run Keys - Startup
    Folder (T1547.001), can you determine whether a newly created file, shortcut, or registry value in
    a designated startup location has a hash, path, or value that matches a known indicator of compromise
    (IOC) from an integrated threat intelligence platform. -- specifically, applying the ''Startup risk
    classifier'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), adversaries abuse Windows Registry
    Run/RunOnce/RunServices keys and Startup-folder items to automatically execute code at logon or boot,
    blending malicious autostart entries in with legitimate ones. This evidence focuses on the condition
    that a newly created file, shortcut, or registry value in a designated startup location has a hash,
    path, or value that matches a known indicator of compromise (IOC) from an integrated threat intelligence
    platform. This Machine Learning approach works as follows: Score each autostart binary with a gradient-boosted
    classifier over static PE features (byte/entropy histograms, imports, sections, header fields, signer
    status, path depth) using the [EMBER](https://arxiv.org/abs/1804.04637) feature schema and an [XGBoost/Random
    Forest ensemble](https://arxiv.org/abs/2403.02232) model; alert at predicted-malicious probability
    >0.85 and surface the top-3 contributing features via [TreeSHAP rule/feature extraction](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9)
    (e.g., ''unsigned'', ''section entropy 7.4'', ''imports VirtualAllocEx'') in the alert text. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates an autostart entry or its
    referenced payload deviates from sanctioned, baselined software and warrants triage: pivot to the
    responsible process and its parent lineage, the writing user and their privilege level, the resolved
    binary/script on disk, and any subsequent network activity. A negative result helps reduce confidence
    in this specific persistence vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, masqueraded, or living-off-the-land persistence.'
