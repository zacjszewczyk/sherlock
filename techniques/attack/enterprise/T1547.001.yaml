name: 'T1547.001: Registry Run Keys - Startup Folder'
id: e2be73d2-fde5-4c88-b9ce-d35d65be581e
description: 'This playbook helps an analyst investigate whether an adversary is abusing Windows Registry
  Run keys (Run/RunOnce/RunOnceEx/RunServices/RunServicesOnce, Policies\Explorer\Run, the Winlogon load
  value, and the Session Manager BootExecute value) or Startup-folder items to persist across reboots
  and, on multi-user systems, to escalate privileges. It guides the hunt across complementary angles:
  matching newly created startup files, shortcuts, or registry values against allowlists and IOCs; detecting
  obfuscated or LOLBAS-laden startup command lines (encoded PowerShell, IEX/DownloadString, certutil,
  bitsadmin, mshta) launched from temp/user-writable paths; correlating rare autostart-launched processes
  with their first outbound connections shortly after logon/boot, including failure-state staging signals
  (NXDOMAIN, 404, RST); spotting modification of pre-existing legitimate entries and DACL changes that
  grant write access to non-admins; flagging standard (non-administrator) users writing to machine-wide
  autostart locations; reconstructing cross-user creator-to-executor execution chains where a lower-privileged
  user plants an entry that a higher-privileged user later runs; and enforcing the BootExecute whitelist.
  Detection methods combine symbolic-logic rules, statistical baselining/prevalence-and-entropy scoring,
  and machine-learning models (gradient-boosted PE classifiers, TF-IDF/DBSCAN command clustering, Isolation
  Forests, sequence models, and provenance-graph GNNs) applied to Windows Security events (4657, 4663,
  4670, 4688, 4624), Sysmon (EID 1, 3, 11, 13, 14), and Zeek conn/dns telemetry, so the analyst can corroborate
  suspected autostart persistence and privilege escalation against registry/file writes, process lineage,
  user privilege, and network context.'
type: technique
