questions:
- question: '[Stealth] Using the symbolic logic approach "Ptrace to beacon correlation", can you determine
    whether a process, within a 5-minute window of being the target of a ptrace system call (PTRACE_ATTACH/SEIZE
    followed by PTRACE_POKETEXT/POKEDATA or PTRACE_SETREGS), initiates an outbound network connection
    or resolves a domain present on a high-confidence threat intelligence feed, or exhibits beacon-like
    volume/frequency. This matters for Stealth because the adversary may be concealing malicious execution
    inside a legitimate process so it blends in with normal activity.'
  context: 'Information requirement: Has the adversary escalated privileges using ptrace system calls?
    Evidence sought: A process, within a 5-minute window of being the target of a ptrace system call (PTRACE_ATTACH/SEIZE
    followed by PTRACE_POKETEXT/POKEDATA or PTRACE_SETREGS), initiates an outbound network connection
    or resolves a domain present on a high-confidence threat intelligence feed, or exhibits beacon-like
    volume/frequency. Detection method (Symbolic Logic) — Trigger when an auditd `ptrace` event carries
    an injection-relevant request (`PTRACE_POKETEXT`, `PTRACE_POKEDATA`, `PTRACE_SETREGS`, `PTRACE_ATTACH`,
    `PTRACE_SEIZE`) per the request-filtering approach in PTRACE attached to process (Falco rule) and
    Ptrace Code Injection signature (Tracee). Within 5 minutes on the same host, correlate the target
    PID with a new connection in Zeek conn.log/Sysmon for Linux or a DNS query in Zeek dns.log, and join
    the destination IP/domain against a TI feed. Alert on any match; include in alert text the top-3 evidence
    fields: ptrace request type, source exe, and matched IOC. In the context of Stealth (TA0005), a positive
    result indicates an adversary is likely using ptrace system-call injection to conceal malicious execution
    inside a legitimate process so it blends in with normal activity; pivot on the source executable,
    the target PID/EUID, the ptrace request type, and the downstream behavior to confirm. A negative result
    lowers but does not eliminate suspicion, since stealthy injectors may stay within baseline — corroborate
    with the other questions in this playbook (privilege transitions, security-agent targeting, network
    setup, and file access).'
  answer_sources:
  - Linux auditd (syscall=ptrace,connect)
  - Sysmon for Linux Event ID 3 (Network connection)
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical Linux servers (e.g., web, database), Internet gateway/egress points'
  range: Last 90 days; correlate events within the method's stated window (seconds to 5 minutes) around
    each ptrace event
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'auditd syscall=ptrace AND a0_request IN (PTRACE_POKETEXT,PTRACE_POKEDATA,PTRACE_SETREGS,PTRACE_ATTACH,PTRACE_SEIZE)

      | join target_pid within 5m to (zeek_conn new outbound OR sysmon_linux EID3 OR zeek_dns query)

      | lookup dest_ip/domain in TI_feed

      | where TI_match

      | alert fields=[ptrace_request, source_exe, matched_ioc]'
