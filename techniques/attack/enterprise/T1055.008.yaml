name: 'T1055.008: Process Injection: Ptrace System Calls'
id: a9f8dd48-8096-4ec7-9a88-69df989894ab
description: 'Investigate suspected ptrace-based process injection on Linux (MITRE ATT&CK T1055.008),
  where an adversary attaches to a live process with ptrace (PTRACE_ATTACH/SEIZE) and writes/redirects
  code (PTRACE_POKETEXT/POKEDATA/SETREGS) to run arbitrary code inside a legitimate process. This playbook
  helps an analyst answer whether an adversary used ptrace to evade process-based defenses (Stealth) and/or
  to escalate privileges (Privilege Escalation). It correlates auditd ptrace syscalls and their request
  types with downstream behavior of the injected target: new or beaconing network connections to threat-intel
  or rare destinations; ptrace initiated by executables outside an allowlist of legitimate debuggers and
  container runtimes; low-to-high privilege attaches (non-root source, root target) followed by suspicious
  image loads or shell spawns; volume/frequency anomalies and EPERM failure spikes from injectors probing
  protected targets; ptrace targeting security agents; trusted services drifting from their behavioral
  baseline; sensitive credential-file access; and post-injection bind/reverse-shell network setup. Each
  question pairs symbolic-logic, statistical, and machine-learning detection approaches across auditd,
  Sysmon for Linux, osquery, and Zeek telemetry.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0004
  tactic_name: Privilege Escalation
