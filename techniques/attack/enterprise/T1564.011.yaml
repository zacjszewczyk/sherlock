name: 'T1564.011: Hide Artifacts: Ignore Process Interrupts'
id: c4f00911-6654-4125-86c2-6a9fec514ea8
description: 'This playbook helps an analyst investigate whether an adversary is evading defenses by ensuring
  a process continues execution despite interruptions -- the Ignore Process Interrupts technique (hiding
  from signals such as SIGHUP). Adversaries invoke processes with nohup, setsid, disown, a trailing ''&'',
  trap on SIGHUP, PowerShell -ErrorAction SilentlyContinue / $ErrorActionPreference, Start-Process -WindowStyle
  Hidden, or syscall-level setsid/double-fork and signal(SIGHUP, SIG_IGN) so that malware and C2 survive
  user logoff, parent-terminal exit, or defender termination attempts. The hunt spans Windows, Linux,
  and macOS endpoint telemetry plus network logs: it covers exact command-line IOC matching against interrupt-ignoring
  threat intel; regex and keyword detection of interrupt/error-suppression primitives in process command
  lines (Event ID 4688, Sysmon EID 1, auditd execve) and PowerShell script-block logs (4104); orphan/detached
  process correlation where a child outlives its parent or user logoff (4634) by more than a threshold;
  correlation of flagged processes to rare or malicious outbound network connections (Zeek conn.log/dns.log,
  Sysmon EID 3) that survive the session; and Linux/macOS syscall-level detach detection (setsid reparenting
  to PID 1, SIGHUP SIG_IGN) via auditd, macOS unified logs, and eBPF (Falco/Tetragon). Detection methods
  combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning models (command-line
  classifiers, log-sequence models, syscall-sequence models, and provenance-graph learning) so the analyst
  can corroborate suspected interrupt evasion across process lineage, session survival, syscall behavior,
  and downstream C2.'
