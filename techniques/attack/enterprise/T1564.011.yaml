questions:
- question: '[Stealth] Exact command IOC detection: Can you determine whether a process creation event
    contains a command-line string that is an exact, case-sensitive match to a known malicious command
    string from a threat-intelligence feed specifically cataloged for ignoring process interrupts, making
    the intent to suppress termination explicit. -- specifically, using the ''Exact command IOC detection''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the adversary executes commands or processes
    designed to ignore process-interrupt signals (e.g., nohup, setsid, disown, trailing ''&'', PowerShell
    -ErrorAction SilentlyContinue) so that malicious commands, malware, and C2 connections continue running
    even after the spawning session logs off, the parent terminal exits, or a defender/analyst attempts
    to pause or terminate the process. Unlike Trap, this does not re-invoke a terminated process -- it
    simply keeps the current one alive -- so the analyst is hunting for processes that survive events
    which normally end them. This evidence focuses on the condition that a process creation event contains
    a command-line string that is an exact, case-sensitive match to a known malicious command string from
    a threat-intelligence feed specifically cataloged for ignoring process interrupts, making the intent
    to suppress termination explicit. This Symbolic Logic approach works as follows: Maintain a high-fidelity,
    regularly updated list of complete command-line strings cataloged for ignoring process interrupts
    (e.g., specific `nohup <c2> &`, `setsid`, `disown`, `powershell -EncodedCommand... -ErrorAction SilentlyContinue`
    invocations). Apply an exact, case-sensitive match against the CommandLine field of Windows Event
    ID 4688 / Sysmon Event ID 1 and auditd execve `a*` arguments. Primitive semantics are defined by [signal(7)](https://man7.org/linux/man-pages/man7/signal.7.html),
    [nohup(1)](https://man7.org/linux/man-pages/man1/nohup.1.html), and PowerShell''s [about_CommonParameters](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_commonparameters?view=powershell-7.4).
    Any exact match is high-severity and works on first-party logs without external lookup. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates a process is likely evading
    interrupts to persist execution or maintain C2; pivot to the responsible process and its full command
    line, the parent/session lineage and Logon ID, the user and host context, any reparenting to PID 1/init,
    and any outbound network connections that outlive the parent session. A negative result helps rule
    out this particular interrupt-evasion vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy or living-off-the-land variants.'
