questions:
- question: Has any internal host established a successful, confirmed outbound connection to — or resolved
    a domain matching — an IP address or domain that appears on a high-confidence threat-intelligence
    feed of known botnet command-and-control (C2) infrastructure?
  context: 'A confirmed, established egress to known botnet C2 is one of the strongest indicators that
    a host has been recruited into a botnet (Resource Development: the adversary is building/operating
    infrastructure that your host now talks to). Match Zeek conn.log connections in an established/successful
    state (SF, S1), Windows Event ID 5156 (allowed outbound), and dns.log resolutions against curated,
    multi-source threat-intel watchlists of botnet C2 IPs/domains. Require a successful connection state
    (not merely a SYN) so you are scoring real communication, and record bytes_out to gauge how much data
    the host may have exchanged or exfiltrated. Restrict feeds to high-confidence, multi-source lists
    to limit false positives. A positive result — an established session or successful resolution to a
    listed C2 — warrants immediate host isolation and triage; a negative result reduces but does not eliminate
    suspicion, since IP/domain rotation defeats static lists. References: [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "( conn.log conn_state IN (SF,S1) OR EventID=5156 OR dns.log answer ) \nAND ( dest_ip IN ti_botnet_c2_ips\
      \ OR query_domain IN ti_botnet_c2_domains )\nWHERE ti_confidence>=high\n| record bytes_out, dest_ip,\
      \ host | alert"
  - technology: Zeek/pseudocode
    query: 'conn.log | where conn_state in ["SF","S1"] and id.resp_h in TI_C2_IPS

      | join dns.log where query in TI_C2_DOMAINS

      | emit src=id.orig_h, dst=id.resp_h, bytes=orig_bytes'
- question: Are there repeated BLOCKED or denied outbound connection attempts from an internal host toward
    IP addresses or domains on a known-botnet-C2 threat-intel feed (a failure-state signal that an infected
    host is trying, but failing, to reach its controller)?
  context: 'Even when egress filtering prevents a host from reaching its C2, the repeated failed attempts
    are themselves a high-fidelity indicator of infection. Separately from established connections, alert
    on Windows Event ID 5157 (Filtering Platform connection denied) and firewall/proxy deny logs that
    show repeated BLOCKED outbound attempts to TI-listed botnet C2. This failure-state telemetry often
    catches compromise that succeeded at the malware level but was contained at the network boundary.
    Threshold at >=5 blocked attempts to the same C2 destination within a 10-minute window to suppress
    one-off noise. A positive result strongly implies a resident implant beaconing into a blocked egress
    path; investigate the source host immediately. References: [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '( EventID=5157 OR fw_action=DENY OR proxy_action=BLOCKED )

      AND dest IN ti_botnet_c2

      | stats count BY src_host, dest over 10m

      | where count>=5 | alert'
- question: Does any internal host present a TLS client fingerprint (JA3/JA4, JA4H, JA4T) that matches
    a known botnet or implant client stack, regardless of the destination IP address?
  context: 'Botnet operators rotate C2 IPs and domains constantly, defeating IP/domain watchlists, but
    the client TLS stack of an implant changes far less often. Matching Zeek ssl.log JA3/JA4 (and JA4H/JA4T)
    fingerprints against known botnet/implant client stacks catches the malware by how it speaks TLS,
    independent of where it connects. Prefer JA4+ over classic JA3 because JA4+ is resilient to GREASE
    values and TLS-extension shuffling that adversaries use to randomize and evade JA3 hashes. A fingerprint
    hit is a strong, IP-rotation-resistant indicator of a specific malware family on the host; pivot on
    the source host and the destinations it contacts to scope the compromise. References: [JA4+](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssl.log | where ja3 in BOTNET_JA3 or ja4 in BOTNET_JA4 or ja4h in BOTNET_JA4H

      | emit src=id.orig_h, dst=id.resp_h, fingerprint, family'
  - technology: SIEM/Rule pseudocode
    query: ssl.log ja3/ja4 IN botnet_fingerprint_list | alert WITH src_host, family
- question: Which internal hosts have destinations flagged by an unusually large number of distinct threat-intelligence
    feeds within a one-hour window, exceeding their normal multi-feed risk profile?
  context: 'A single low-confidence feed hit is weak evidence, but a destination flagged by many independent
    feeds is much more likely to be true botnet C2. Score each host by the count of distinct TI feeds
    flagging its destinations within 1 hour, weight each contribution by feed confidence, and alert when
    a host''s score exceeds the 99th percentile of its own 30-day per-host distribution. This statistical,
    multi-feed corroboration suppresses single-source noise while surfacing hosts whose traffic consistently
    lands on broadly-agreed-upon malicious infrastructure. A high score concentrates analyst attention
    on the most credibly compromised hosts. References: [FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per host: score = sum_over_dests( distinct_count(ti_feeds_flagging_dest) * feed_confidence
      ) in 1h

      | compare to host_30d_distribution

      | where score > p99(host_30d) | alert'
- question: Does a supervised Random Forest classifier, scoring outbound connection features, flag any
    host's traffic as botnet C2 with probability greater than 0.90?
  context: 'Static rules and watchlists miss novel or rotated infrastructure. A Random Forest trained
    on connection-level features — duration, bytes_out/bytes_in ratio, packet counts, destination port,
    destination novelty/rarity, and connection state — learns the statistical shape of C2 traffic and
    generalizes beyond known indicators. Alert when the model''s predicted probability of ''botnet C2''
    exceeds 0.90. Crucially, the alert MUST surface the top-3 contributing features (for example, an extreme
    bytes ratio, a rare destination, or periodicity) so the analyst can triage the verdict rather than
    chase a black box. A high-confidence ML hit with explainable drivers is an actionable lead even when
    no TI feed or fingerprint matched. References: [Machine Learning DDoS Detection, Doshi et al.](https://arxiv.org/abs/1804.04159).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [duration, bytes_out/bytes_in, pkts_out, pkts_in, dest_port, dest_novelty, conn_state]

      p = RandomForest.predict_proba(features)[''botnet_c2'']

      | where p > 0.90 | alert WITH top3_shap_features'
- question: Do any internal hosts produce TLS connections whose JA3/JA4 client fingerprints match known
    botnet malware-family fingerprints, indicating automated C2 rather than legitimate browsing?
  context: 'Automated C2 channels frequently use bespoke TLS client stacks distinct from real browsers.
    Matching Zeek ssl.log JA3/JA4 hashes against curated botnet fingerprint lists identifies malware-family
    C2 even when the destination is previously unseen. Prefer JA4+ for resilience against GREASE and TLS-extension
    shuffling that adversaries deploy to randomize JA3 and evade signature matching. A fingerprint match
    is a strong indicator that the connecting process is automated malware; correlate the source host
    with its destinations, DNS behavior, and process telemetry to confirm. References: [JA4+](https://github.com/FoxIO-LLC/ja4).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'ssl.log | where ja3 in BOTNET_JA3 or ja4 in BOTNET_JA4

      | emit src=id.orig_h, dst=id.resp_h, server_name, fingerprint, family'
- question: Are internal hosts querying domains with abnormally high character entropy or large KL-divergence
    from normal English-language n-gram patterns, consistent with domain-generation-algorithm (DGA) C2
    rendezvous?
  context: 'DGA malware generates large numbers of pseudo-random domains to find its C2, producing FQDNs
    that look statistically unlike human-registered domains. Score queried domains by Shannon entropy
    and by KL-divergence against an English-bigram baseline. Alert when entropy exceeds roughly 3.5-4.0
    bits/char, deriving the precise threshold per-environment from the 98th percentile of your benign
    domains to control false positives (CDNs and cloud providers also use random-looking names). A cluster
    of high-entropy queries from one host strongly suggests DGA-based botnet C2; pivot to NXDOMAIN ratios
    and resolved IPs to corroborate. References: [NIOM-DGA](https://www.sciencedirect.com/science/article/pii/S0167404825002500);
    [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns.log | compute shannon_entropy(query), kl_divergence(query_bigrams, english_bigrams)

      | where entropy > p98(benign_entropy)  // ~3.5-4.0 bits/char

      | stats count BY src_host | where count > N | alert'
- question: Does any host exhibit an abnormally high ratio of NXDOMAIN (non-existent domain) responses
    to total DNS queries within short windows, indicating DGA C2 rendezvous failures?
  context: 'When DGA malware cycles through generated domains, most do not resolve, producing a burst
    of NXDOMAIN responses — an explicit failure-state signal of botnet C2 attempting rendezvous. Profile
    each host''s NXDOMAIN-to-total-query ratio in 10-minute windows and alert when the ratio exceeds 0.30
    AND total query volume exceeds the host''s 30-day baseline by more than 3 sigma. Requiring both conditions
    avoids flagging benign hosts that occasionally hit dead domains. A high NXDOMAIN ratio combined with
    a query-volume spike is a classic DGA fingerprint; correlate with high-entropy queries and the LSTM
    classifier below. References: [FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns.log | window 10m per src_host

      | ratio = count(rcode=NXDOMAIN)/count(*)

      | where ratio>0.30 AND total_queries > baseline_30d + 3*sigma | alert'
- question: Are queried domains resolving to an unusually large and rapidly-changing set of IP addresses,
    networks, and ASNs with short TTLs, indicative of fast-flux botnet C2 hosting?
  context: 'Fast-flux is a botnet hosting technique in which a single domain rapidly rotates through many
    compromised IPs to keep C2 resilient and evade takedown. For each resolved domain, track the count
    of distinct A-record IPs, distinct /16 networks, distinct ASNs, and the TTL values. Alert when a domain
    maps to many distinct IPs/ASNs with characteristically short TTLs. Legitimate CDNs share some of these
    traits, so weight on ASN/network diversity and unusually short TTLs to separate fast-flux from CDN
    behavior. A positive result indicates the host is talking to fast-flux C2 infrastructure typical of
    botnets. References: [FluxBuster](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'dns.log | group BY query

      | distinct_ips=dcount(answer_A), distinct_16=dcount(net16(answer)), distinct_asn=dcount(asn(answer)),
      min_ttl=min(ttl)

      | where distinct_ips>=N AND distinct_asn>=M AND min_ttl<300 | alert'
- question: Does a character-level LSTM DGA classifier label any queried FQDN as algorithmically generated
    (and attribute it to a malware family) based on the domain string alone, even absent NXDOMAIN responses?
  context: 'Some botnets register DGA domains in advance so that resolutions succeed and NXDOMAIN-based
    detection misses them. A character-level LSTM trained on benign vs. DGA domains classifies a domain
    — and can attribute its generating family — purely from the string, without needing to observe resolution
    failures. Score each queried FQDN and surface the predicted family plus the confidence score in the
    alert. This catches DGA C2 that resolves cleanly and gives the analyst a family attribution to guide
    response. Corroborate hits with entropy, NXDOMAIN, and fast-flux signals where available. References:
    [Predicting DGAs with LSTM, Woodbridge et al.](https://arxiv.org/abs/1611.00791).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "for fqdn in dns.log.query:\n    score, family = LSTM_DGA.predict(fqdn)\n    if score > 0.90:\
      \ alert WITH src_host, fqdn, predicted_family, score"
- question: Does an LSTM autoencoder modeling each host's NXDOMAIN-ratio and query-rate time series produce
    reconstruction-error spikes that flag anomalous DNS behavior?
  context: 'Hard thresholds on NXDOMAIN ratio can miss subtle or slow DGA activity and can misfire on
    naturally noisy hosts. An LSTM autoencoder learns each host''s normal DNS time-series behavior (NXDOMAIN-to-query
    ratio, query rate, mean entropy) and flags time windows whose reconstruction error spikes — i.e.,
    behavior the model cannot explain from normal patterns. Report the top-3 deviating features (NXDOMAIN
    ratio, query rate, mean entropy) in the alert so the analyst sees what drove the anomaly. This unsupervised
    approach detects novel DGA/C2 behavior that no static rule anticipated; treat large reconstruction-error
    spikes as leads for deeper DNS triage. References: [Kitsune, Mirsky et al.](https://arxiv.org/abs/1802.09089).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Internet Egress Points (Firewalls, Proxies), Internal DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'ts = per_host_series([nxdomain_ratio, query_rate, mean_entropy])

      err = LSTM_Autoencoder.reconstruction_error(ts)

      | where err > anomaly_threshold | alert WITH top3_deviating_features'
- question: Are non-browser, unsigned processes on internal hosts spawning persistent outbound network
    connections on non-standard ports, consistent with a botnet implant beaconing to C2?
  context: 'Legitimate outbound connections usually come from signed browsers and known applications over
    standard ports; botnet implants are frequently unsigned, non-browser binaries reaching out on unusual
    ports. Correlate Windows Event ID 4688 (process creation) to identify unsigned, non-browser process
    images with Event ID 5156 (allowed outbound connection) showing persistent connections on non-standard
    ports. Record the process image, signer status, and destination for triage. A persistent outbound
    channel from an unsigned, unexpected process is a strong host-side beaconing indicator; pivot to the
    destination''s reputation and the beacon-regularity scoring below to confirm. References: [RITA](https://github.com/activecm/rita).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: General User Workstation Subnets, Server Subnets, Internet Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'EventID=4688 process NOT IN known_browsers AND signature_status!=signed

      | join EventID=5156 ON pid where dest_port NOT IN (80,443)

      | where connection_persistent | alert WITH image, signer, dest'
- question: Is any internal host performing high-rate horizontal scanning of telnet/SSH ports (23, 2323,
    22) followed by login attempts using known default credentials — the self-propagation/recruitment
    pattern of IoT botnets such as Mirai?
  context: 'IoT botnets like Mirai grow by scanning the network for telnet/SSH-exposed devices and brute-forcing
    well-known default credentials. Detecting an internal host that scans ports 23/2323/22 across many
    destinations and then attempts default-credential logins reveals a host actively recruiting others
    into a botnet — a clear sign it is already compromised. Threshold at >100 SYNs to distinct destinations
    per minute from a single host, then look for follow-on default-credential authentication attempts.
    A match indicates active worm-like spread; isolate the host and hunt for already-recruited peers.
    References: [Understanding the Mirai Botnet, Antonakakis et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: General User Workstation Subnets, Server Subnets, Internet Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn.log | where id.resp_p in [23,2323,22]

      | stats dcount(id.resp_h) AS dests BY id.orig_h, 1m

      | where dests>100

      | join auth_attempts where cred in DEFAULT_CRED_LIST | alert'
- question: Do any host-to-destination pairs exhibit highly regular, low-jitter connection timing (low
    coefficient of variation in inter-arrival times and payload sizes), characteristic of automated C2
    beaconing?
  context: 'Human-driven traffic is irregular; beaconing malware tends to call home on a fixed cadence,
    producing tight, repetitive timing and payload sizes. For each (host, destination) pair with sufficient
    volume (>=24 connections/hour), compute the coefficient of variation (CV), median absolute deviation
    (MAD), and Bowley skewness of inter-arrival times and payload sizes. Flag pairs with CV < 0.1 (very
    low jitter) as beaconing, deriving the precise threshold from the 1st percentile of benign pairs.
    Low-jitter regularity to a single destination is a hallmark of C2 beaconing; corroborate with process
    and reputation context. Note that legitimate software updates and keepalives can be regular, so confirm
    against the destination and process. References: [RITA](https://github.com/activecm/rita); [BAYWATCH,
    Hu et al.](https://dsail.kaist.ac.kr/files/WWW17.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: General User Workstation Subnets, Server Subnets, Internet Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn.log | per (src,dst) with >=24 conns/hr

      | cv_iat = stdev(iat)/mean(iat); mad_iat=mad(iat); skew=bowley(iat); cv_bytes=stdev(bytes)/mean(bytes)

      | where cv_iat < 0.1 | alert AS beacon'
- question: When a per-pair connection time series is transformed with an FFT, does a dominant frequency
    emerge that reveals jittered or hidden C2 beaconing cadence?
  context: 'Sophisticated implants add random jitter to evade simple regularity tests, but an underlying
    periodic cadence often persists in the frequency domain. Build a per-(host,destination) connection
    time series and extract the dominant frequency via Fast Fourier Transform, applying multi-stage whitelist
    filtering to remove known-benign periodic services. This approach surfaces jittered C2 cadence at
    scale and is robust to random jitter and missed observations that defeat time-domain CV tests. A strong
    dominant frequency to an external destination is a beaconing indicator even when timing looks noisy;
    pivot to destination reputation and process context. References: [BAYWATCH, Hu et al.](https://dsail.kaist.ac.kr/files/WWW17.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: General User Workstation Subnets, Server Subnets, Internet Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn.log | per (src,dst) build evenly-binned connection-count series

      | spectrum = FFT(series); f_dom, power = dominant_peak(spectrum)

      | filter known_periodic_whitelist

      | where power > significance_threshold | alert WITH period=1/f_dom'
- question: Does any host show a high ratio of unanswered outbound SYNs (SYN without SYN/ACK) together
    with an abnormally large number of unique destinations per minute, indicating network scanning?
  context: 'Scanning hosts spray connection attempts across many destinations, most of which never complete
    the TCP handshake — a clear failure-state signal. Profile each host''s outbound SYN-without-reply
    ratio and unique-destination cardinality per minute. Alert when unique destinations/min exceeds the
    host''s baseline by more than 3 sigma AND the unanswered-SYN ratio exceeds 0.7. The combination distinguishes
    deliberate scanning from normal fan-out. A positive result indicates the host is probing the network
    — possibly recruiting for or operating within a botnet — and should be isolated and investigated for
    the default-credential follow-on described above. References: [Understanding the Mirai Botnet, Antonakakis
    et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: General User Workstation Subnets, Server Subnets, Internet Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn.log | per src_host, 1m

      | unanswered = count(history~''^S$'' OR no_synack)/count(SYN)

      | uniq_dests = dcount(id.resp_h)

      | where uniq_dests > baseline + 3*sigma AND unanswered > 0.7 | alert'
- question: Does DBSCAN clustering of connection metadata reveal dense beaconing clusters or sparse high-fanout
    scanning clusters that, when cross-correlated, expose a coordinated botnet cohort of internal hosts?
  context: 'Individual hosts may look benign, but botnet members share behavioral signatures. Cluster
    connection metadata (inter-arrival times, byte volumes, destination cardinality) with DBSCAN to find
    dense regions corresponding to coordinated beaconing and sparse regions corresponding to high-fanout
    scanning. Cross-correlate communication-plane clusters (who talks how) with activity-plane clusters
    (what they do) — the BotMiner approach — to expose groups of hosts acting in concert, which is the
    defining trait of a botnet. List the top-3 cluster features in the alert for triage. A multi-host
    cluster sharing C2-like behavior is far stronger evidence than any single host and should drive a
    coordinated containment effort. References: [BotMiner, Gu et al.](https://www.usenix.org/legacy/event/sec08/tech/full_papers/gu/gu.pdf).'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 4688
  - Windows Event ID 5156
  - 'NAI: General User Workstation Subnets, Server Subnets, Internet Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = per_conn_features([iat, bytes, dest_cardinality])

      C = DBSCAN(eps, min_samples).fit(X)

      | correlate comm_plane_clusters WITH activity_plane_clusters

      | emit cohort_hosts, top3_cluster_features'
- question: Has Zeek raised any DDoS-related notices (e.g., Scan::Address_Scan, Attack::DOS) targeting
    a single public-facing host, indicating an inbound denial-of-service attack potentially driven by
    a botnet?
  context: Zeek's notice framework can directly flag denial-of-service and scanning behavior against your
    services. Alert on DDoS-related notices (Scan::Address_Scan, Attack::DOS) in notice.log that target
    single destination hosts, and include the attack vector (SYN, UDP, HTTP) and peak connection rate
    in the alert. This is the fastest, lowest-effort signal that a public-facing service is under attack
    — quite possibly from an adversary-controlled botnet performing a coordinated DDoS. A positive result
    should trigger DDoS mitigation playbooks and upstream/ISP coordination; correlate with the volumetric
    and source-distribution analytics below to confirm scale and origin.
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - 'NAI: Public-Facing Services (Web Servers, VPN Concentrators), DMZ Network Segments, Internet Ingress
    Points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'notice.log | where note in ["Scan::Address_Scan","Attack::DOS"]

      | emit target=dst, vector, peak_conn_rate | alert'
- question: Has a public-facing service experienced a simultaneous spike in both inbound connection volume
    and the cardinality of unique source IPs/ASNs that exceeds 3 standard deviations above its 30-day
    baseline, indicating a distributed (botnet) DDoS?
  context: 'A volumetric DDoS from a botnet manifests as a sudden surge in connection volume coming from
