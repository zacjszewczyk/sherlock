  context: 'Spam botnets distribute a single payload (attachment or URL) across many bots, so the same
    content arrives from many distinct senders in a short time. Alert when 50+ unique source IPs send
    emails with the identical attachment hash or URL domain within an hour, correlating Zeek smtp.log
    with files.log. This coordinated-delivery pattern — many sources, one payload — is a strong botnet
    signature that single-message inspection would miss. A positive result indicates an active spam/phishing
    campaign from a botnet; quarantine the shared content, block the URL domain, and hunt for any users
    who already interacted. References: [BotMiner, Gu et al.](https://www.usenix.org/legacy/event/sec08/tech/full_papers/gu/gu.pdf).'
