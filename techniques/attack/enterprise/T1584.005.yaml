- question: During a traffic spike against a public-facing service, is the inbound half-open ratio (SYNs
    that never complete the SYN/ACK-ACK handshake) abnormally high, indicating a SYN-flood DDoS?
  context: 'SYN-flood DDoS attacks deliberately leave TCP handshakes incomplete to exhaust server resources,
