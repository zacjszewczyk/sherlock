    targeted service, and alert when the half-open ratio exceeds 0.8 during a volume spike. Tying the
    failure-ratio test to a concurrent volume spike avoids false alarms from ordinary packet loss. A high
    half-open ratio under load is characteristic of a botnet SYN flood; apply SYN-flood mitigations (SYN
    cookies, rate limiting) and trace the distributed sources. References: [Machine Learning DDoS Detection,
