- question: Does DBSCAN clustering of email features reveal high-volume clusters whose member messages
    originate from an unusually diverse set of ASNs, exposing botnet-coordinated spam delivery?
  context: 'A botnet campaign couples consistent content with diverse, distributed origins. Cluster inbound
    email features (subject, attachment hash, URL domain, headers) with DBSCAN, then flag clusters whose
    member messages come from an unusually diverse set of ASNs. Cross-plane correlation — linking sending
    behavior (where it came from) with content (what was sent) — exposes the coordination that defines
    a botnet, per the BotMiner methodology. List the top-3 cluster features in the alert for triage. A
    tight content cluster with broad ASN dispersion is a high-confidence botnet-spam indicator; quarantine
    the cluster''s content and block its infrastructure. References: [BotMiner, Gu et al.](https://www.usenix.org/legacy/event/sec08/tech/full_papers/gu/gu.pdf).'
