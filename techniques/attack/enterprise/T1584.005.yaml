- question: Does the source-IP/ASN entropy of inbound mail spike more than 3 standard deviations above
    baseline within 10-minute windows, indicating a sudden geographically dispersed sending set typical
    of a botnet?
  context: 'A legitimate sender population is relatively stable; a botnet campaign abruptly broadens the
    diversity of sending sources. Monitor source-IP/ASN entropy of inbound mail in 10-minute windows and
    flag spikes exceeding 3 standard deviations above baseline. A sharp entropy increase means mail is
    suddenly arriving from a much wider, more dispersed set of origins — consistent with distributed botnet
    senders. Correlate the entropy spike with shared-content clustering to confirm it represents a coordinated
    campaign rather than benign traffic growth. A confirmed spike should trigger campaign-scoping and
    content quarantine. References: [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
