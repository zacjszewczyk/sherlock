  queries:
  - technology: SIEM/Stats pseudocode
    query: 'smtp.log | window 10m | entropy = shannon(src_ip_dist), asn_entropy = shannon(src_asn_dist)

      | where entropy > baseline + 3*sigma | alert'
- question: Does a high-volume cluster of similar inbound emails also exhibit a high rate of SPF/DKIM/DMARC
    authentication failures and non-reputable sources, confirming spoofed botnet-origin mail?
  context: 'Botnet-sent spam typically originates from compromised hosts that are not authorized senders
    for the spoofed domains, so it fails sender-authentication checks at high rates. Profile the SPF/DKIM/DMARC
    failure rate and non-reputable-source rate per content cluster as a failure-state signal, and alert
    when a high-volume content cluster also shows >70% authentication failures. Combining shared content
    with mass auth failure strongly distinguishes a botnet campaign from legitimate bulk mail (newsletters,
    which generally pass authentication). A positive result confirms spoofed, botnet-origin delivery;
    enforce DMARC rejection and quarantine the campaign. References: [Understanding the Mirai Botnet,
    Antonakakis et al.](https://www.usenix.org/system/files/conference/usenixsecurity17/sec17-antonakakis.pdf).'
