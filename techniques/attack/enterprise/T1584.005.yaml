name: 'T1584.005: Botnet'
id: 572beb1d-c1f7-4cd3-b51d-260fd23f6879
description: 'Investigate whether an internal host has been recruited into an adversary-controlled botnet,
  or whether the organization is being targeted by one. This playbook helps a SOC analyst hunt for evidence
  across the full botnet lifecycle: (1) outbound connections or DNS resolutions to known botnet command-and-control
  (C2) infrastructure from high-confidence threat-intelligence feeds, including both established and blocked/failed
  egress attempts; (2) automated C2 traffic patterns such as DGA/NXDOMAIN bursts, high-entropy domains,
  fast-flux resolution, non-standard ports, and JA3/JA4 TLS client fingerprints matching known malware
  families; (3) host-side beaconing (rhythmic, low-jitter callbacks) and high-fanout scanning (e.g., Mirai-style
  telnet/SSH recruitment with default credentials); (4) inbound volumetric/distributed denial-of-service
  (DDoS) against public-facing services from large, distributed source sets; and (5) coordinated spam/phishing
  delivery to the mail gateway from geographically dispersed, non-reputable senders sharing common content.
  Because most botnet construction occurs outside the victim''s visibility, detection focuses on the observable
  downstream effects on local endpoint, network, DNS, and mail telemetry, combining symbolic-logic rules,
  statistical baselining, and machine-learning classifiers.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
