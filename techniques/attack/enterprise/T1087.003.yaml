questions:
- question: 'Using deterministic rule logic, can you determine whether ''Email-account discovery watchlist''
    indicates email account discovery activity? Specifically: Monitor process creation (Windows Event
    ID 4688) and PowerShell script-block logs (Windows Event ID 4104) for GAL/recipient enumeration cmdlets
    such as `Get-GlobalAddressList`, `Get-Recipient`, `Get-Mailbox`, `Get-EXOMailbox`, `Get-User`, `Get-Contact`,
    and MailSniper functions (e.g., `Get-GlobalAddressList`, `Invoke-SelfSearch`). Alert when these run
    from a non-mail-admin workstation, a web-shell/scripted parent, or an account outside the Exchange-admin
    RBAC baseline. GAL/recipient cmdlets normally execute only from Exchange management endpoints under
    an authenticated RBAC session [Get-GlobalAddressList (ExchangePowerShell), Microsoft](https://learn.microsoft.com/en-us/powershell/module/exchange/get-globaladdresslist?view=exchange-ps);
    MailSniper implements exactly this enumeration as a non-admin user [MailSniper, Beau Bullock](https://github.com/dafthack/MailSniper)
    [Attacking Exchange with MailSniper, BHIS](https://www.blackhillsinfosec.com/attacking-exchange-with-mailsniper/).'
  context: 'Tactic context (Discovery): adversaries enumerate email accounts, mailboxes, and the Global
    Address List to map an organization''s users and prioritize targets for phishing, collection, or lateral
    movement before acting. Evidence under investigation: Email-account discovery shows up as enumeration
    of mailboxes, recipients, distribution groups, aliases, or inbox metadata from Exchange, Microsoft
    365, or similar email systems. The evidence is a burst of commands or API calls that list user mail
    objects from an admin host or automation account that does not normally perform broad mailbox queries.
    Approach (Email-account discovery watchlist): Monitor process creation (Windows Event ID 4688) and
    PowerShell script-block logs (Windows Event ID 4104) for GAL/recipient enumeration cmdlets such as
    `Get-GlobalAddressList`, `Get-Recipient`, `Get-Mailbox`, `Get-EXOMailbox`, `Get-User`, `Get-Contact`,
    and MailSniper functions (e.g., `Get-GlobalAddressList`, `Invoke-SelfSearch`). Alert when these run
    from a non-mail-admin workstation, a web-shell/scripted parent, or an account outside the Exchange-admin
    RBAC baseline. GAL/recipient cmdlets normally execute only from Exchange management endpoints under
    an authenticated RBAC session [Get-GlobalAddressList (ExchangePowerShell), Microsoft](https://learn.microsoft.com/en-us/powershell/module/exchange/get-globaladdresslist?view=exchange-ps);
    MailSniper implements exactly this enumeration as a non-admin user [MailSniper, Beau Bullock](https://github.com/dafthack/MailSniper)
    [Attacking Exchange with MailSniper, BHIS](https://www.blackhillsinfosec.com/attacking-exchange-with-mailsniper/).
    A positive result means an identity, host, or process is enumerating mail/directory objects in a pattern
    inconsistent with its baseline (e.g., rare GAL/recipient cmdlets, bulk LDAP filters, abnormal read
    volume/frequency, or high failure/empty ratios); a negative result means the observed activity matches
    expected administrative or sync behavior. Investigate the named area of interest (Domain Controllers,
    Exchange Servers, Administrative Workstations, User Endpoints) and pivot from any hit to the originating
    account, OAuth app, host, and process lineage, then to downstream collection, credential access, or
    lateral-movement attempts.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Exchange Admin Audit Logs
  - Microsoft 365 Unified Audit Log
  - 'NAI: Domain Controllers, Exchange Servers, Administrative Workstations, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: cloud GAL / directory-read enumeration\nMATCH audit_events\
      \ WHERE\n  Operation IN ['Get-GlobalAddressList','Get-Recipient','Get-Mailbox',\n              \
      \  'users.list','groups.list','AddressBookDownload','GALSync']\n  AND (actor NOT IN exchange_admin_rbac_baseline\n\
      \       OR oauth_app NOT IN approved_directory_apps\n       OR service_principal NOT IN known_sync_apps)\n\
      GROUP BY actor, oauth_app OVER 1h\nHAVING objects_returned > directory_read_threshold OR page_count_near_max\n\
      THEN alert(severity='high', enrich=[actor, app, token, objects_returned])"
- question: 'Using statistical baselining, can you determine whether ''Rare mailbox-query volume/frequency
    anomaly'' indicates email account discovery activity? Specifically: Build a 30-day per-account and
    per-host baseline of mailbox/recipient/group enumeration events and the count of objects returned.
    Alert on Volume (objects returned > mean + 3*sigma or above the IQR upper fence Q3+1.5*IQR), Frequency
    (enumeration events/min exceeding the 99th percentile), and on the first appearance of a GAL/recipient
    cmdlet for that account, especially after long dormancy [Standard-Deviation Thresholding, Dwyer](https://www.sciencedirect.com/science/article/pii/S2666281720300214).
    Derive thresholds per environment from the admin/service-account population; legitimate GAL reads
    come from a small, stable set of identities [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
