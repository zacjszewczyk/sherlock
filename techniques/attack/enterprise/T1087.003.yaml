- question: 'Using statistical baselining, can you determine whether ''Failure/state ratio of enumeration''
    indicates email account discovery activity? Specifically: Track State (success vs failure/empty/throttled)
    of mailbox/recipient queries per source and apply sequential hypothesis testing (SPRT / Threshold
    Random Walk): broad enumeration produces a distinctive ratio of failed or empty lookups, AccessDenied,
    and throttling that a benign admin querying a known mailbox does not, allowing a fast decision after
    few observations [Fast Portscan Detection Using Sequential Hypothesis Testing, Jung et al.](https://www.icir.org/vern/papers/portscan-oak04.pdf).
    Alert when the failure-weighted random walk crosses the malicious threshold.'
