name: 'T1087.003: Email Account'
id: ee3ab48c-9d8d-4cfe-aaa2-f085e9b2aab2
description: 'This playbook helps an analyst determine whether an adversary is performing Email Account
  discovery (T1087.003): enumerating mailboxes, recipients, distribution groups, aliases, and the Global
  Address List (GAL) across on-premises Exchange, Microsoft 365 / Exchange Online, and Google Workspace,
  as well as the underlying Active Directory directory. It correlates host telemetry (PowerShell script-block
  logging Event ID 4104, process creation Event ID 4688, network connection Event ID 5156, and LDAP client
  query Event ID 1644) with network telemetry (Zeek ldap.log, dce_rpc.log, conn.log) and cloud audit telemetry
  (Microsoft 365 Unified Audit Log, Exchange Admin Audit Logs, Entra ID sign-in logs, and Google Workspace
  admin/login/token audit logs). Investigative angles include: GAL/recipient enumeration cmdlets such
  as Get-GlobalAddressList, Get-Recipient, Get-Mailbox, Get-EXOMailbox and MailSniper functions; bulk
  LDAP filters like (mail=*), (objectClass=user), and (objectCategory=person); abnormal directory-read
  volume, frequency, and failure/empty ratios; rare process-to-directory/mail connections; obfuscated
  high-entropy PowerShell cradles; and high-volume Directory API or GAL reads from unusual identities,
  OAuth apps, or service principals. Detection blends symbolic-logic watchlists, statistical baselining
  (percentiles, standard-deviation thresholds, entropy, sequential hypothesis testing), and machine learning
  (contextual embeddings, log-sequence models, one-class SVM/autoencoders, density clustering, provenance-graph
  scoring) to produce evasion-resistant, explainable alerts for the Discovery tactic.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
