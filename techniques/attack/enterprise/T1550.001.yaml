questions:
- question: '[Lateral Movement] Match API calls to TI indicators: Can you determine whether a successful
    token-based API authentication event (e.g., HTTP status 200 OK) that originates from an IP address
    or contains a User-Agent string present on a high-confidence threat intelligence feed of known malicious
    indicators. -- specifically, using the ''Match API calls to TI indicators'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Lateral Movement tactic (TA0008), the information requirement
    is "Is the adversary evading defenses using application access tokens?" Adversaries who steal application
    access tokens (OAuth/SAML, AWS STS/GCP/Entra federation tokens, or container service-account tokens)
    authenticate non-interactively, defeat MFA, and operate within seemingly legitimate API workflows,
    making this behavior hard to spot without baselining and correlation. This evidence focuses on the
    condition that a successful token-based API authentication event (e.g., HTTP status 200 OK) that originates
    from an IP address or contains a User-Agent string present on a high-confidence threat intelligence
    feed of known malicious indicators. This Symbolic Logic approach works as follows: Inner join source
    IP addresses and User-Agent strings from successful token-based API calls (Zeek http.log/conn.log)
    with high-confidence CTI feeds of malicious IPs and known adversary-tool User-Agents (e.g., pacu,
    gds-tools). Alert on any confirmed match. Treat TI as enrichment only; because stolen application
    access tokens are used non-interactively and align with legitimate workflows, primary logic must not
    depend on external lookups ([Detecting Microsoft 365 and Azure Active Directory Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/)).
    A positive result -- a rule match, statistical outlier, or model alert -- is evidence that a token
    may have been stolen and replayed to access resources or move laterally; pivot to the implicated principal/account,
    the source IP/ASN/region and User-Agent, the token''s scope and the resources or APIs it touched,
    any preceding interactive logon or its absence, and downstream high-impact actions. A negative result
    helps rule out this token-abuse vector on the inspected telemetry but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, low-and-slow, or workflow-aligned
    token misuse.'
