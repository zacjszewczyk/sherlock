name: 'T1550.001: Use Alternate Authentication Material: Application Access Token'
id: 0f8f8c7f-9733-42e7-97fa-c78064c3afd7
description: 'This playbook helps an analyst investigate whether an adversary is using stolen application
  access tokens (OAuth/SAML access and refresh tokens, AWS STS/GCP/Entra federation and service-account
  tokens, and container-mounted service account tokens) to bypass normal authentication and act on remote
  systems and cloud/SaaS resources (T1550.001). Because token-based access is non-interactive, negates
  MFA, and often blends with legitimate API workflows, the hunt spans eight evidence angles: (1) token-based
  API authentications that match threat-intelligence indicators or use rare User-Agents/ASNs, exhibit
  abnormal token-auth failure (401/403/AccessDenied) bursts, or score as outliers in a per-principal anomaly
  model; (2) endpoint token-theft tooling and browser credential/cookie store access via process creation
  telemetry; (3) token-based authentications showing impossible travel, new User-Agent, and no preceding
  interactive logon; (4) anomalous cloud identity API calls (AWS STS AssumeRole/GetFederationToken, GCP
  generateAccessToken, Entra acquireToken) by unexpected principals, regions, or spikes; (5) first-seen
  or dormant internal cloud resource communications, especially after a prior alert; (6) inbound API calls
  immediately followed by reconnaissance/lateral-movement process creation; (7) network logons to critical
  servers from ephemeral or non-corporate cloud assets; and (8) high-impact, destructive cloud API actions
  (IAM CreateUser, role assignments, setIamPolicy, OAuth consent grants, service-principal credential
  additions) inconsistent with the principal''s baseline. Detection methods combine symbolic-logic rules,
  statistical baselining (modified Z-score rarity, Bayesian new-edge scoring, first-seen tuples, failure-rate
  profiling), and machine learning (Isolation Forest/One-Class SVM, LSTM sequence models, graph/GNN anomaly
  detection, supervised risk scoring with SHAP) across Zeek network logs, Windows Security events, and
  cloud audit logs (AWS CloudTrail, Azure Activity, Google Cloud Audit, M365/Entra, Kubernetes), so the
  analyst can corroborate suspected stolen-token use against authentication context, source/principal
  reputation, behavioral baselines, and downstream actions.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
