      from (Sysmon EventCode=11 (FileCreate), Sysmon EventCode=7 (ImageLoad), Sysmon EventCode=1 (ProcessCreate),
      Security EventCode=4688 (ProcessCreate), Security EventCode=4697 (ServiceInstall), Security EventCode=4698
      (ScheduledTaskCreate), Sysmon EventCode=13 (RegistryValueSet))

      | where matches_condition()   // On a DLL file-creation event (Sysmon Event ID 11) compute the hash
