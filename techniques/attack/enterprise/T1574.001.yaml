- question: 'For the Stealth tactic (TA0005), can we alert on hijacked DLL names in non-system directories
    to detect Hijack Execution Flow: DLL abuse? Specifically, are we observing the scenario where a DLL
    file is created with a name identical to a legitimate system DLL (e.g., ''version.dll'', ''dwrite.dll'',
    ''uxtheme.dll'') but is placed in an application''s local directory instead of the expected system
    directory (e.g., ''C:\Windows\System32''). The hosting application is subsequently configured for
    persistence via a new service, scheduled task, or Run key.'
