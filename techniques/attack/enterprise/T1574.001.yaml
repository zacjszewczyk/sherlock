questions:
- question: 'For the Stealth tactic (TA0005), can we correlate DLL creation hashes with persistence events
    to detect Hijack Execution Flow: DLL abuse? Specifically, are we observing the scenario where a DLL
    file is written to disk, and its file hash matches a known-bad entry in a threat intelligence database.
    Within a short time window (e.g., 10 minutes), this DLL is loaded by a process associated with a known
    persistence mechanism (e.g., a new service, scheduled task, or a process spawned from a Registry Run
    key).'
  context: 'Information requirement: Is the adversary establishing persistence via DLL search order hijacking
    or sideloading? This question supports the Stealth (TA0005) tactic for Hijack Execution Flow: DLL
    (T1574.001). Scenario under investigation: A DLL file is written to disk, and its file hash matches
    a known-bad entry in a threat intelligence database. Within a short time window (e.g., 10 minutes),
    this DLL is loaded by a process associated with a known persistence mechanism (e.g., a new service,
    scheduled task, or a process spawned from a Registry Run key). Approach (Symbolic Logic): On a DLL
    file-creation event (Sysmon Event ID 11) compute the hash (use Sysmon Event ID 7/15 Hashes field;
    no external API required) and match it against an internally maintained known-bad hash set. On a match,
    correlate by ImageLoaded path to a subsequent module load (Sysmon Event ID 7) within 10 minutes, and
    to a persistence-creation State event (service install Windows Event ID 4697, scheduled task 4698,
    or a Run-key write Sysmon Event ID 13). Alert with the matched hash, load path, and persistence artifact
    in the alert text. Failure-mode signal: also raise if the hash match coincides with a phantom load
    (a previously-missing DLL that now loads successfully), per Hijacking DLLs in Windows and 4 Ways Adversaries
    Hijack DLLs. A positive match is high-fidelity and should be triaged immediately: confirm the DLL
    provenance (signer, hash, on-disk path), the loading process lineage, and any follow-on persistence,
    child process, or network activity. A negative result narrows but does not eliminate the hypothesis,
    since novel names/paths or in-memory loads may evade a fixed rule. In the Stealth context, adversaries
    abuse DLL search order, side-loading, phantom, redirection, and substitution to run code inside a
    trusted process; correlating the DLL write/load with process, persistence, and network behavior separates
    benign software from hijacking.'
