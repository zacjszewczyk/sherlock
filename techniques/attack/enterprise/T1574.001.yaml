    a DLL with a filename matching a critical system or security software DLL (e.g., ''ntdll.dll'', ''amsi.dll''),
    but the file''s on-disk path is not the legitimate, protected system directory (e.g., not ''C:\Windows\System32'').'
  context: 'Information requirement: Is the adversary establishing persistence via DLL search order hijacking
    or sideloading? This question supports the Execution (TA0002) tactic for Hijack Execution Flow: DLL
    (T1574.001). Scenario under investigation: A process loads a DLL with a filename matching a critical
    system or security software DLL (e.g., ''ntdll.dll'', ''amsi.dll''), but the file''s on-disk path
    is not the legitimate, protected system directory (e.g., not ''C:\Windows\System32''). Approach (Symbolic
    Logic): Maintain a dictionary of critical DLLs and their single correct path (e.g., ntdll.dll -> C:\Windows\System32\ntdll.dll,
    amsi.dll). Alert on any module load (Sysmon Event ID 7) where a dictionary key loads from a path other
    than its canonical value - the system-DLL-from-wrong-location detector implemented by Potential System
    DLL Sideloading From Non System Locations. Include expected vs. actual path. A positive match is high-fidelity
    and should be triaged immediately: confirm the DLL provenance (signer, hash, on-disk path), the loading
    process lineage, and any follow-on persistence, child process, or network activity. A negative result
    narrows but does not eliminate the hypothesis, since novel names/paths or in-memory loads may evade
    a fixed rule. In the Execution context, adversaries abuse DLL search order, side-loading, phantom,
    redirection, and substitution to run code inside a trusted process; correlating the DLL write/load
    with process, persistence, and network behavior separates benign software from hijacking.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: System folders (C:\Windows\System32), Security product installation directories (e.g., C:\Program
    Files\CrowdStrike), Application directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// intent: Alert on critical DLL path mismatches

      from (Sysmon EventCode=7 (ImageLoad))

      | where matches_condition()   // Maintain a dictionary of critical DLLs and their single correct
      path (e.g., ntdll.dll -> C:\Windows\System32\ntdll.dll, amsi.dll). Alert on any module load (Sysmon
      Event ID 7) where a dictionary key loads from a path other than its canonical value - the system-DLL-from-wrong-location
      detector implem

      | eval evidence=[key_fields, paths, hashes, signer]

      | alert(priority=high, detail=evidence)'
- question: 'For the Execution tactic (TA0002), can we flag low-frequency DLL path anomalies to detect
    Hijack Execution Flow: DLL abuse? Specifically, are we observing the scenario where a process loads
    a DLL with a filename matching a critical system or security software DLL (e.g., ''ntdll.dll'', ''amsi.dll''),
    but the file''s on-disk path is not the legitimate, protected system directory (e.g., not ''C:\Windows\System32'').'
  context: 'Information requirement: Is the adversary establishing persistence via DLL search order hijacking
    or sideloading? This question supports the Execution (TA0002) tactic for Hijack Execution Flow: DLL
    (T1574.001). Scenario under investigation: A process loads a DLL with a filename matching a critical
    system or security software DLL (e.g., ''ntdll.dll'', ''amsi.dll''), but the file''s on-disk path
    is not the legitimate, protected system directory (e.g., not ''C:\Windows\System32''). Approach (Statistical
    Method): Per DLL name build a fleet frequency distribution of load paths; for a system DLL the canonical
    System32 path should be >99.9% of loads, so any long-tail path (e.g., C:\Users\Public\ntdll.dll) is
    a severe anomaly, per Using Frequency Analysis to Defend Office 365. Report the path''s prevalence
    count and the dominant legitimate path. A flagged outlier warrants enrichment and analyst review rather
    than automatic action: compare the anomalous value against the established baseline, verify the host/process
    role, and corroborate with deterministic signals before escalating. A clean result means the activity
    falls within learned norms for this environment. In the Execution context, adversaries abuse DLL search
    order, side-loading, phantom, redirection, and substitution to run code inside a trusted process;
    correlating the DLL write/load with process, persistence, and network behavior separates benign software
    from hijacking.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: System folders (C:\Windows\System32), Security product installation directories (e.g., C:\Program
    Files\CrowdStrike), Application directories.'
  range: Last 90 days (baseline over 30 days; evaluate against rolling window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// intent: Flag low-frequency DLL path anomalies

      from (Sysmon EventCode=7 (ImageLoad)) over last 30d as baseline

      | build_distribution(key=[name,path,process])   // Per DLL name build a fleet frequency distribution
      of load paths; for a system DLL the canonical System32 path should be >99.9% of loads, so any long-tail
      path (e.g., C:\Users\Public\ntdll.dll) is a severe anomaly, per Using Frequency Analysis to Defend
      Office 365.

      | score new_event by rarity / zscore / percentile

      | where score in tail (e.g. <5th pct or >3 stddev)

      | report volume, frequency, prevalence_count

      | alert'
- question: 'For the Execution tactic (TA0002), can we detect outliers via K-Means on DLL path data to
    detect Hijack Execution Flow: DLL abuse? Specifically, are we observing the scenario where a process
    loads a DLL with a filename matching a critical system or security software DLL (e.g., ''ntdll.dll'',
    ''amsi.dll''), but the file''s on-disk path is not the legitimate, protected system directory (e.g.,
    not ''C:\Windows\System32'').'
  context: 'Information requirement: Is the adversary establishing persistence via DLL search order hijacking
    or sideloading? This question supports the Execution (TA0002) tactic for Hijack Execution Flow: DLL
    (T1574.001). Scenario under investigation: A process loads a DLL with a filename matching a critical
    system or security software DLL (e.g., ''ntdll.dll'', ''amsi.dll''), but the file''s on-disk path
    is not the legitimate, protected system directory (e.g., not ''C:\Windows\System32''). Approach (Machine
    Learning): Cluster (DLL filename, normalized path, prevalence) with K-Means/DBSCAN; legitimate loads
    form dense canonical clusters while a singleton/outlier (e.g., ntdll.dll from C:\Users\Public\Music)
    is flagged - the unsupervised outlier framing of ThreaTrace. Optionally confirm with ETW call-stack
    image backing per Doubling Down: Detecting In-Memory Threats with Kernel ETW Call Stacks. Emit cluster
    distance and the canonical path. A ''suspicious/anomalous'' verdict should be triaged using the emitted
    top contributing features and confirmed against deterministic rules running in parallel, so known-bad
    always alerts regardless of model score. A benign verdict reflects similarity to learned normal behavior
    and lowers, but does not zero, suspicion. In the Execution context, adversaries abuse DLL search order,
    side-loading, phantom, redirection, and substitution to run code inside a trusted process; correlating
    the DLL write/load with process, persistence, and network behavior separates benign software from
    hijacking.'
  answer_sources:
  - Sysmon Event ID 7
  - 'NAI: System folders (C:\Windows\System32), Security product installation directories (e.g., C:\Program
    Files\CrowdStrike), Application directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '// intent: Detect outliers via K-Means on DLL path data

      model = train/load(features=[process,dll_name,dll_path,prevalence,entropy,signature,publisher,integrity])

      from (Sysmon EventCode=7 (ImageLoad))

      | featurize() ; score = model.predict(event)   // Cluster (DLL filename, normalized path, prevalence)
      with K-Means/DBSCAN; legitimate loads form dense canonical clusters while a singleton/outlier (e.g.,
      ntdll.dll from C:\Users\Public\Music) is flagged - the unsupervised outlier framing of ThreaTrace.

      | where score == suspicious/anomalous

      | emit top3_contributing_features

      | alert'
