name: 'T1574.001: Hijack Execution Flow: DLL'
id: 9618f2e9-098f-4ee5-a004-f32c2acbe71d
description: Investigate potential DLL-based Hijack Execution Flow (T1574.001) across Windows endpoints
  and servers, covering DLL side-loading, search-order hijacking, phantom DLL hijacking, DLL redirection,
  DLL substitution, and remote/preload hijacking used by adversaries for persistence, privilege escalation,
  execution, and defense evasion. The playbook helps an analyst correlate DLL file-creation, module-load,
  process-creation, registry, and network telemetry (Sysmon, Windows Security events, and Zeek) to spot
  known-bad DLL hashes loaded by persistence or LOLBin processes, system-named DLLs loaded from non-system
  directories, DLLs written to user-writable paths then quickly loaded, remote DLL reads over SMB/WebDAV,
  high-integrity processes loading from writable locations, trusted processes loading untrusted/unsigned
  modules, and post-load chains into shells, child processes, or C2. Each question pairs symbolic-logic
  detections with statistical baselining and machine-learning approaches so deterministic known-bad always
  alerts while anomaly methods surface novel hijacks.
type: technique
