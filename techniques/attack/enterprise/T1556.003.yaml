- question: Is any PAM shared-object module (such as pam_unix.so) or other file under the module directories
    (/lib/security/, /lib64/security/, /usr/lib64/security/, /usr/lib/x86_64-linux-gnu/security/) being
    written, replaced, or renamed by a process that is NOT a sanctioned package manager or PAM tool?
  context: 'Within the Persistence tactic, this matters because a backdoored PAM module or configuration
    grants the adversary durable, reusable re-entry that survives password resets, key rotation, and reboots;
    a positive result indicates the foothold may persist long after the initial compromise is remediated.
    PAM module binaries normally change only during package transactions (dpkg, rpm, apt, yum, dnf) or
    sanctioned PAM tooling, so any other writer is high-severity and consistent with an in-place backdoor
    or credential-harvesting patch of the module. Deploy auditd file watches on the module directories
    and key modules (auditctl -w /lib/security/ -p wa -k pam_mod, etc.) and alert on any open-for-write
    or rename SYSCALL whose process is not on the allowlist, mirroring the benign-process allowlist pattern
    in the Falco default rules. A hit by a shell, interpreter, compiler, or temp-path binary is a strong
    indicator; a write by an allowlisted package manager during a patch window is benign. (Detection method:
    Symbolic Logic. Source action: Audit-watch PAM module paths with writer allowlist.) Evidence under
    investigation: A PAM shared-object module (e.g., pam_unix.so) or any file under module directories
    (/lib/security/, /lib64/security/, /usr/lib64/security/, /usr/lib/x86_64-linux-gnu/security/) is written,
    replaced, or renamed by a process that is NOT a package manager or sanctioned PAM tool, indicating
    an in-place backdoor or credential-harvesting patch of the module binary. Source citations: [auditctl(8)](https://man7.org/linux/man-pages/man8/auditctl.8.html);
    [Falco default rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml); [MITRE
    T1556.003](https://attack.mitre.org/techniques/T1556/003/); [linux-pam-backdoor](https://github.com/zephrax/linux-pam-backdoor).'
  answer_sources:
  - auditd:SYSCALL
  - Sysmon for Linux EID 11
  - File Modification
  - 'NAI: All Linux servers and multi-user hosts (jump boxes, bastions, dev servers), Domain-joined Linux,
    VPN/RADIUS Linux appliances'
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: 'watch_paths = [''/lib/security/'',''/lib64/security/'',''/usr/lib64/security/'',''/usr/lib/x86_64-linux-gnu/security/'']

      allow = [''dpkg'',''rpm'',''apt'',''apt-get'',''yum'',''dnf'',''authselect'',''pam-auth-update'']

      FROM auditd:SYSCALL WHERE key=''pam_mod'' AND syscall IN (open,openat,rename,renameat) AND a2 CONTAINS
