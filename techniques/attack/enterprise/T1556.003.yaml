name: 'T1556.003: Modify Authentication Process: Pluggable Authentication Modules'
id: 0b78f428-1f33-41e5-b9f9-a77e6bb1cd30
description: 'Investigate possible adversary modification of the Linux/macOS Pluggable Authentication
  Modules (PAM) subsystem to backdoor authentication, bypass logging/MFA, or harvest plaintext credentials.
  This playbook helps an analyst hunt for: tampering with PAM shared-object modules (e.g., pam_unix.so)
  and configuration files under /etc/pam.d/ (including risky pam_exec.so/pam_permit.so/nullok edits);
  login-triggered backdoors that spawn interpreters from suspect paths; anomalous PAM grantor sets and
  ''magic password'' logins that bypass pam_unix verification; reads of /etc/shadow followed by writes
  to temp paths and exfiltration; macOS PAM/SecurityAgent plugin tampering; and the downstream abuse of
  stolen credentials against Windows assets (hardcoded backdoor usernames, periodic/beacon-like logins
  from Linux hosts, off-hours/impossible-travel logins, RADIUS logins without MFA, segmentation-violating
  pivots, account-policy probing, password spraying, C2/DNS-tunneling exfiltration, and follow-on credential
  dumping). It spans the Defense Impairment, Persistence, and Credential Access tactics and pairs symbolic-logic
  rules, statistical baselining, and machine-learning detectors across endpoint (auditd, Sysmon for Linux,
  osquery), network (Zeek), and Windows event-log telemetry.'
type: technique
