questions:
- question: Is any PAM shared-object module (such as pam_unix.so) or other file under the module directories
    (/lib/security/, /lib64/security/, /usr/lib64/security/, /usr/lib/x86_64-linux-gnu/security/) being
    written, replaced, or renamed by a process that is NOT a sanctioned package manager or PAM tool?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. PAM module binaries normally change only
    during package transactions (dpkg, rpm, apt, yum, dnf) or sanctioned PAM tooling, so any other writer
    is high-severity and consistent with an in-place backdoor or credential-harvesting patch of the module.
    Deploy auditd file watches on the module directories and key modules (auditctl -w /lib/security/ -p
    wa -k pam_mod, etc.) and alert on any open-for-write or rename SYSCALL whose process is not on the
    allowlist, mirroring the benign-process allowlist pattern in the Falco default rules. A hit by a shell,
    interpreter, compiler, or temp-path binary is a strong indicator; a write by an allowlisted package
    manager during a patch window is benign. (Detection method: Symbolic Logic. Source action: Audit-watch
    PAM module paths with writer allowlist.) Evidence under investigation: A PAM shared-object module
    (e.g., pam_unix.so) or any file under module directories (/lib/security/, /lib64/security/, /usr/lib64/security/,
    /usr/lib/x86_64-linux-gnu/security/) is written, replaced, or renamed by a process that is NOT a package
    manager or sanctioned PAM tool, indicating an in-place backdoor or credential-harvesting patch of
    the module binary. Source citations: [auditctl(8)](https://man7.org/linux/man-pages/man8/auditctl.8.html);
    [Falco default rules](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml); [MITRE
    T1556.003](https://attack.mitre.org/techniques/T1556/003/); [linux-pam-backdoor](https://github.com/zephrax/linux-pam-backdoor).'
  answer_sources:
  - auditd:SYSCALL
  - Sysmon for Linux EID 11
  - File Modification
  - 'NAI: All Linux servers and multi-user hosts (jump boxes, bastions, dev servers), Domain-joined Linux,
    VPN/RADIUS Linux appliances'
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: 'watch_paths = [''/lib/security/'',''/lib64/security/'',''/usr/lib64/security/'',''/usr/lib/x86_64-linux-gnu/security/'']

      allow = [''dpkg'',''rpm'',''apt'',''apt-get'',''yum'',''dnf'',''authselect'',''pam-auth-update'']

      FROM auditd:SYSCALL WHERE key=''pam_mod'' AND syscall IN (open,openat,rename,renameat) AND a2 CONTAINS
      O_WRONLY|O_RDWR

      WHERE comm NOT IN allow

      ALERT severity=high WITH host, exe, comm, path, ppid, parent_exe'
- question: Has a PAM module's cryptographic hash, size, or mtime changed relative to its package-verified
    baseline, and is the resulting module hash rare across the fleet?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Maintain a baseline hash, size, and mtime
    for every PAM module (from rpm -V / dpkg --verify or a golden image). Per host the expected count
    of module-content changes outside a patch window is ~0, so flag any change as a >99th-percentile volume/frequency
    anomaly. Then compute the fraction of fleet hosts sharing each module hash and flag rare hashes (bottom
    1st percentile of prevalence): a uniquely-modified pam_unix.so is a strong backdoor indicator. A common
    hash matching the vendor package is benign; a one-off hash on a single long-lived host is suspicious.
    (Detection method: Statistical Method. Source action: Score module-hash change vs package state.)
    Evidence under investigation: A PAM shared-object module (e.g., pam_unix.so) or any file under module
    directories (/lib/security/, /lib64/security/, /usr/lib64/security/, /usr/lib/x86_64-linux-gnu/security/)
    is written, replaced, or renamed by a process that is NOT a package manager or sanctioned PAM tool,
    indicating an in-place backdoor or credential-harvesting patch of the module binary. Source citations:
    [linux-pam-backdoor](https://github.com/zephrax/linux-pam-backdoor); [pam_unix(8)](https://www.man7.org/linux/man-pages/man8/pam_unix.8.html).'
  answer_sources:
  - auditd:SYSCALL
  - Sysmon for Linux EID 11
  - File Modification
  - 'NAI: All Linux servers and multi-user hosts (jump boxes, bastions, dev servers), Domain-joined Linux,
    VPN/RADIUS Linux appliances'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = expected_hash_per_module (rpm -V / dpkg --verify / golden image)

      FOR each host,module: IF current_hash != baseline.hash OR size/mtime drift outside patch_window
      THEN anomaly

      fleet_prevalence = count(hosts sharing hash)/total_hosts

      FLAG IF fleet_prevalence < p01  -> rare/unique module hash

      ALERT host, module, current_hash, prevalence'
- question: Does process/file provenance show a rare edge in which an unusual process (compiler, cp, mv,
    install) writes a PAM module under a security directory, when scored by a provenance-graph anomaly
    detector?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Feed process/file provenance from Sysmon
    for Linux or auditd into a provenance-graph detector such as KAIROS or node-level ThreaTrace. A compiler/patcher
    (gcc, cp, mv, install) writing a module under /lib*/security is a rare edge/node versus the benign
    baseline of package-manager writes. The detector should surface the top-3 contributing edges (writing
    process, target module path, parent lineage) and the reconstructed subgraph so an analyst can triage
    quickly. A high anomaly score on the write edge warrants investigation; baseline package transactions
    score as normal. (Detection method: Machine Learning. Source action: Score the write as a rare provenance
    edge.) Evidence under investigation: A PAM shared-object module (e.g., pam_unix.so) or any file under
    module directories (/lib/security/, /lib64/security/, /usr/lib64/security/, /usr/lib/x86_64-linux-gnu/security/)
    is written, replaced, or renamed by a process that is NOT a package manager or sanctioned PAM tool,
    indicating an in-place backdoor or credential-harvesting patch of the module binary. Source citations:
    [Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux); [KAIROS](https://tfjmp.org/publications/2024-sp.pdf);
    [code](https://github.com/ProvenanceAnalytics/kairos); [ThreaTrace](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - auditd:SYSCALL
  - Sysmon for Linux EID 11
  - File Modification
  - 'NAI: All Linux servers and multi-user hosts (jump boxes, bastions, dev servers), Domain-joined Linux,
    VPN/RADIUS Linux appliances'
  range: Last 90 days
  queries:
  - technology: ML/Provenance-graph pseudocode
    query: 'graph = build_provenance(sysmon_linux|auditd: process->file write edges)

      model = KAIROS|ThreaTrace.fit(benign_window)

      score = model.score(edge: proc --write--> /lib*/security/*.so)

      IF score > threshold: ALERT top3_edges=[writer_proc,target_path,parent_lineage], subgraph'
- question: Is a PAM configuration file under /etc/pam.d/ or /etc/pam.conf being modified to insert a
    risky or unexpected module line (pam_exec.so, pam_permit.so, an absolute path outside standard module
    dirs, or nullok added to pam_unix)?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Watch the PAM config tree with auditd (auditctl
    -w /etc/pam.d/ -p wa -k pam_cfg; -w /etc/pam.conf -p wa -k pam_cfg). On each change by a non-allowlisted
    process, diff the file and alert when an added line references pam_exec.so (which runs an external
    script), pam_permit.so (which always succeeds), an absolute module path outside standard directories,
    or nullok added to pam_unix (which permits empty passwords). These edits enable a login-triggered
    backdoor or authentication bypass. Changes by authselect/pam-auth-update during a change window are
    benign. (Detection method: Symbolic Logic. Source action: Audit-watch /etc/pam.d and diff for risky
    modules.) Evidence under investigation: A PAM configuration file under /etc/pam.d/ or /etc/pam.conf
    is modified to insert a new or unexpected module line (e.g., pam_exec.so running an external script,
    pam_permit.so, or a path to a non-standard module), enabling a login-triggered backdoor or auth bypass.
    Source citations: [auditctl(8)](https://man7.org/linux/man-pages/man8/auditctl.8.html); [Falco](https://github.com/falcosecurity/rules/blob/main/rules/falco_rules.yaml);
    [MITRE T1556.003](https://attack.mitre.org/techniques/T1556/003/).'
  answer_sources:
  - auditd:SYSCALL
  - Sysmon for Linux EID 11
  - File Modification
  - 'NAI: All Linux servers and multi-user hosts, SSH bastions, RADIUS/VPN Linux appliances'
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: 'FROM auditd:SYSCALL WHERE key=''pam_cfg'' AND op=write AND comm NOT IN [''authselect'',''pam-auth-update'',''dpkg'',''rpm'']

      new_lines = diff(prev_version, current_version)

      ALERT IF new_lines MATCH [''pam_exec.so'',''pam_permit.so'',''nullok'',''/(?!lib|usr).*\\.so'']

      WITH host, file, added_line, comm, ppid'
- question: How frequently is /etc/pam.d being written on each host, and is a write being performed by
    a rare or unexpected binary?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Baseline the per-host frequency of /etc/pam.d
    writes (normally ~0 between patch cycles). Flag any host whose daily pam.d write count exceeds 0 outside
    a change window, and rank the event by the rarity of the writing binary (process-image prevalence
    across the fleet). A write by an interactive shell, interpreter, or temp-path binary is a top-percentile
    anomaly versus the expected authselect/pam-auth-update writers. Frequent legitimate writes during
    patching are benign; a single write by an oddball process is the signal. (Detection method: Statistical
    Method. Source action: Score config-change frequency per host.) Evidence under investigation: A PAM
    configuration file under /etc/pam.d/ or /etc/pam.conf is modified to insert a new or unexpected module
    line (e.g., pam_exec.so running an external script, pam_permit.so, or a path to a non-standard module),
    enabling a login-triggered backdoor or auth bypass. Source citations: [auditctl(8)](https://man7.org/linux/man-pages/man8/auditctl.8.html).'
  answer_sources:
  - auditd:SYSCALL
  - Sysmon for Linux EID 11
  - File Modification
  - 'NAI: All Linux servers and multi-user hosts, SSH bastions, RADIUS/VPN Linux appliances'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_host_daily_write_count(''/etc/pam.d'') ~ 0

      FOR each write event: IF outside change_window AND count>0 THEN candidate

      proc_prevalence = fleet_freq(writer_exe)

      rank = 1 - proc_prevalence

      FLAG IF writer in {shell,interpreter,/tmp,/dev/shm} OR rank > p99'
- question: After a PAM configuration change, do the resulting authentication log-key sequences in /var/log/auth.log
    deviate from the learned-normal sequence (e.g., a new pam_exec invocation or a session missing the
    expected pam_unix key)?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Train DeepLog on /var/log/auth.log and PAM
    session log-key sequences. A config change that injects a new module produces new or abnormal log
    keys, such as a pam_exec invocation appearing in the session flow, or a session lacking the expected
    pam_unix key. Surface the top-k predicted-versus-observed log keys as the explanation. Sequences matching
    the learned model are normal; a divergent key sequence following a config edit corroborates a backdoor.
    (Detection method: Machine Learning. Source action: Model auth.log sequence shift after config change.)
    Evidence under investigation: A PAM configuration file under /etc/pam.d/ or /etc/pam.conf is modified
    to insert a new or unexpected module line (e.g., pam_exec.so running an external script, pam_permit.so,
    or a path to a non-standard module), enabling a login-triggered backdoor or auth bypass. Source citations:
    [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [code](https://github.com/wuyifan18/DeepLog).'
  answer_sources:
  - auditd:SYSCALL
  - Sysmon for Linux EID 11
  - File Modification
  - 'NAI: All Linux servers and multi-user hosts, SSH bastions, RADIUS/VPN Linux appliances'
  range: Last 90 days
  queries:
  - technology: ML/Log-sequence pseudocode
    query: 'model = DeepLog.fit(normal auth.log key sequences)

      FOR session: observed_keys = parse(auth.log, pam session)

      IF observed_key NOT IN model.topk_predictions: anomaly

      ALERT session, host, divergent_keys=topk(predicted vs observed)'
- question: Is an SSH/login session immediately spawning a shell or scripting interpreter (sh/bash/dash/zsh/perl/python/php/ruby/lua)
    as a child of sshd/login from a suspicious path such as /tmp, /dev/shm, /var/tmp, or /run?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Apply the Elastic ''Potential Backdoor Execution
    Through PAM_EXEC'' logic: alert on an sshd/ssh session change followed within ~3 seconds by exec of
    an interpreter whose parent is ssh/sshd, with a short (2-arg) command line and an executable under
    /tmp, /dev/shm, /var/tmp, /run, or other unusual paths. This pattern is the signature of a pam_exec.so
    directive launching a login-triggered backdoor for persistence and command execution. Collect process
    lineage with Sysmon for Linux. A normal login shell from a standard path is benign. (Detection method:
    Symbolic Logic. Source action: Detect login-spawned interpreters from suspect paths.) Evidence under
    investigation: An SSH/login session immediately spawns a shell or scripting interpreter as a child
    of sshd/login (via a pam_exec.so directive), executing from a suspicious path — a login-triggered
    PAM backdoor for persistence and command execution. Source citations: [Elastic ''Potential Backdoor
    Execution Through PAM_EXEC'' rule](https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_pluggable_authentication_module_pam_exec_backdoor_exec.toml);
    [Sysmon for Linux](https://github.com/Sysinternals/SysmonForLinux).'
  answer_sources:
  - Sysmon for Linux EID 1
  - auditd:SYSCALL execve
  - Process Creation
  - 'NAI: All Linux servers exposed to SSH, bastions, multi-user hosts'
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: 'FROM process_creation (auditd execve | sysmon EID1)

      WHERE parent_comm IN [''sshd'',''ssh'',''login''] AND exe BASENAME IN [''sh'',''bash'',''dash'',''zsh'',''perl'',''python'',''php'',''ruby'',''lua'']

      AND exe_path MATCHES [''/tmp/'',''/dev/shm/'',''/var/tmp/'',''/run/''] AND argc <= 2

      AND time_since(session_change) < 3s

      ALERT host, user, parent, child, cmdline, lineage'
- question: Is sshd/login spawning a child process that is rare for that host, particularly an interpreter
    launched from a temp/world-writable path or with a network-callback command line?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Baseline the set and frequency of direct
    child processes of sshd/login per host. The expected child is typically a user login shell, so flag
    interpreter children launched from temp/world-writable paths or with network-callback command lines
    as bottom-percentile-rarity events. Track frequency (such execs per login) because a PAM backdoor
    fires on every authentication. A consistently-seen login shell is benign; a rare interpreter child
    appearing on each login is the anomaly described by self/non-self process modeling. (Detection method:
    Statistical Method. Source action: Score rare children of authentication daemons.) Evidence under
    investigation: An SSH/login session immediately spawns a shell or scripting interpreter as a child
    of sshd/login (via a pam_exec.so directive), executing from a suspicious path — a login-triggered
    PAM backdoor for persistence and command execution. Source citations: [Forrest et al., A Sense of
    Self for Unix Processes](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf).'
  answer_sources:
  - Sysmon for Linux EID 1
  - auditd:SYSCALL execve
  - Process Creation
  - 'NAI: All Linux servers exposed to SSH, bastions, multi-user hosts'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = per_host distribution of children(sshd|login)

      FOR each child: rarity = 1 - freq(child_exe | parent)

      FLAG IF rarity > p99 OR exe_path IN {/tmp,/dev/shm,/var/tmp} OR cmdline has net-callback

      TRACK execs_per_login (backdoor fires every auth)'
- question: Does the causal path sshd -> pam_exec -> interpreter -> outbound-connection rank among the
    rarest causal paths in process provenance?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Use ProvDetector to mine the K rarest causal
    paths in process provenance; the sshd -> pam_exec -> interpreter -> outbound-connection path scores
    as a top-rarity outlier (LOF over doc2vec path embeddings). The alert must list the rare path nodes
    (parent daemon, module, interpreter, destination) so an analyst can confirm the login-triggered execution
    chain. Common login paths embed near the cluster center; the backdoor chain sits far out as an outlier.
    (Detection method: Machine Learning. Source action: Rank the login->exec causal path as rare.) Evidence
    under investigation: An SSH/login session immediately spawns a shell or scripting interpreter as a
    child of sshd/login (via a pam_exec.so directive), executing from a suspicious path — a login-triggered
    PAM backdoor for persistence and command execution. Source citations: [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Sysmon for Linux EID 1
  - auditd:SYSCALL execve
  - Process Creation
  - 'NAI: All Linux servers exposed to SSH, bastions, multi-user hosts'
  range: Last 90 days
  queries:
  - technology: ML/Provenance-path pseudocode
    query: 'paths = extract_causal_paths(provenance)

      emb = doc2vec(paths); scores = LOF(emb)

      target = path(sshd->pam_exec->interpreter->net_send)

      IF LOF(target) in top_K_rarest: ALERT nodes=[daemon,module,interpreter,dest]'
- question: On successful Linux authentications, does the auditd grantors field contain an unexpected
    PAM module that should not be authorizing the session?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Apply the Elastic ''Unusual PAM Grantor''
    logic: on successful authentication events (event.action=authenticated, outcome=success), inspect
    the auditd grantors field (the ordered list of PAM modules that granted the session) and alert when
    it contains an unexpected module, excluding known-benign grantors (pam_rootok, pam_cap, pam_permit
    where sanctioned). This is state-aware because it ties the success outcome to which module authorized
    it, exposing a replaced/added module such as a backdoored pam_unix.so or an inserted pam_permit/custom
    module. A grantor set matching the host''s known stack is benign. (Detection method: Symbolic Logic.
    Source action: Alert on anomalous PAM grantor set.) Evidence under investigation: A successful Linux
    authentication is granted by an unusual or newly-appearing set of PAM modules (auditd grantors), indicating
    a replaced/added module in the authentication stack (e.g., a backdoored pam_unix.so or an inserted
    pam_permit/custom module). Source citations: [Elastic ''Unusual PAM Grantor'' rule](https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_unusual_pam_grantor.toml);
    [MITRE T1556.003](https://attack.mitre.org/techniques/T1556/003/).'
  answer_sources:
  - auditd:USER_AUTH / USER_ACCT (grantors)
  - Logon Session Creation
  - 'NAI: All Linux servers, bastions, RADIUS/VPN appliances, IdM-integrated Linux'
  range: Last 90 days
  queries:
  - technology: auditd/Rule pseudocode
    query: 'FROM auditd:USER_AUTH|USER_ACCT WHERE res=success

      expected = known_grantor_set(host,service)

      benign = [''pam_rootok'',''pam_cap'',''pam_permit(sanctioned)'']

      ALERT IF any(grantor NOT IN expected AND grantor NOT IN benign)

      WITH host, service, user, grantors'
- question: Is an observed PAM grantor combination rare or never-before-seen for that service and host?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Build a per-service (sshd, sudo, login)
    and per-host baseline distribution of grantor sets. Compute the frequency of each observed grantor
    combination and flag any combination in the bottom 1st percentile or never previously observed for
    that service. A first-seen grantor on a long-lived host is a strong signal of a modified auth stack.
    Long-established grantor combinations are benign; a novel combination after a config or module change
    is the anomaly. (Detection method: Statistical Method. Source action: Score grantor-set rarity per
    service/host.) Evidence under investigation: A successful Linux authentication is granted by an unusual
    or newly-appearing set of PAM modules (auditd grantors), indicating a replaced/added module in the
    authentication stack (e.g., a backdoored pam_unix.so or an inserted pam_permit/custom module). Source
    citations: [Elastic Unusual PAM Grantor](https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_unusual_pam_grantor.toml).'
  answer_sources:
  - auditd:USER_AUTH / USER_ACCT (grantors)
  - Logon Session Creation
  - 'NAI: All Linux servers, bastions, RADIUS/VPN appliances, IdM-integrated Linux'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = freq(grantor_set | host,service) over 90d

      FOR each auth: p = baseline.get(grantor_set,0)

      FLAG IF p==0 (first-seen) OR p < p01

      ALERT host, service, grantor_set, first_seen_flag'
- question: Do per-(account,host,service) authentication feature vectors (grantor-set hash, off-hours
    count, distinct source IPs, grantor count) score as unsupervised outliers?
  context: 'Within the Defense Impairment tactic, this matters because a tampered Pluggable Authentication
    Module (PAM) stack lets the adversary degrade, disable, or bypass the very authentication and logging
    controls defenders depend on to see and trust account activity; a positive result here means a core
    security mechanism may no longer be reporting truthfully. Encode per-(account,host,service) authentication
    feature vectors — grantor-set hash, off-hours auth count, distinct source IPs, count of grantors —
