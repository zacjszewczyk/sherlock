- question: Which process-creation events involve parent-child pairs whose enterprise prevalence is below
    0.1%, marking them as rare relationships that may stem from a tampered binary?
  context: Rare parent-child relationships are a reliable proxy for anomalous execution. Computing the
    enterprise-wide prevalence of each parent-child pair and flagging creation events below a 0.1% frequency
    cutoff surfaces unusual chains — such as a trusted binary suddenly spawning an interpreter or network
    tool it normally never launches. Derive the cutoff from your own fleet distribution and allowlist
    rare-but-benign admin tooling, so the remaining low-prevalence pairs concentrate on genuinely suspicious
    behavior consistent with a compromised host binary.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  index=win EventCode=4688\n  | stats count by ParentImage, Image\n  | eventstats sum(count)\
      \ AS total\n  | eval prevalence = count/total\n  | where prevalence < 0.001 AND NOT (ParentImage,Image)\
      \ IN admin_allowlist\n  | sort prevalence"
- question: Does a graph model of parent-child and whole-system provenance score a specific process node
    as anomalous, identifying a tampered-binary node whose subgraph can be reconstructed for triage?
  context: Whole-system provenance captures the relationships a single rule cannot. Embedding parent-child
    and system-wide provenance graphs and scoring nodes for anomaly (node-level ThreaTrace, KAIROS) pinpoints
    the specific tampered-binary process node and reconstructs its subgraph — the files it touched, processes
    it spawned, and connections it made — for rapid triage. Reporting the top-3 contributing edges/features
    in the alert explains why the node scored high, helping the analyst confirm compromise and scope the
    incident around the modified host binary.
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  G = provenance_graph(process, file, module, network events)\n  emb = graph_embed(G); scores\
      \ = anomaly_score(emb, G.nodes)\n  for n in scores where score>threshold:\n      sub = reconstruct_subgraph(G,\
      \ n)\n      ALERT(host, node=n, top_edges=top3(n), subgraph=sub)"
- question: Does an LSTM model of normal process/file/module event sequences flag a trusted binary that
    begins emitting an out-of-profile sequence or parameters after tampering?
  context: A tampered binary changes the order and content of the events it generates. Modeling the normal
    sequence of process/file/module events with an LSTM (as in DeepLog) and flagging deviating execution
    paths or anomalous parameters per-event catches a trusted binary that starts behaving differently
    after being modified — for example loading unusual modules, touching unexpected files, or running
    steps out of its established order. A sequence anomaly on a normally-predictable binary is a behavioral
    indicator that its code path has been altered for persistence.
  answer_sources: *id004
  range: Last 90 days (train on benign sequences; score continuously)
  queries:
  - technology: ML/pseudocode
    query: "  seq = ordered_events(process)  # process/file/module event tokens\n  model = DeepLog_LSTM.load()\n\
      \  for i, ev in enumerate(seq):\n      if ev NOT IN model.topk_predicted(seq[:i]):\n          ALERT(host,\
      \ Image, position=i, observed=ev, expected=model.topk)"
