- question: 'Using statistical baselining, can you determine whether ''publisher prevalence and name-entropy
    baseline'' indicates a software supply chain compromise (T1195.002)? Specifically: Maintain a 90-day
    rolling baseline of all observed publisher subjects and their frequency; flag executables signed by
    a publisher absent from baseline or in the bottom 5th percentile of frequency. Compute Shannon entropy
    of the publisher subject name (entropy > 4.0 suggests a randomly generated name). Add State metric:
    per-publisher ratio of valid vs. invalid/expired signatures over time — a previously-trusted publisher
    suddenly producing invalid-signature binaries is high-signal, consistent with the trust-breach measurements
    in Certified Malware (https://doi.org/10.1145/3133956.3133958). Derive thresholds from the environment''s
    empirical publisher-frequency distribution.'
