- question: 'Using statistical baselining, can you determine whether ''Z-score on size/entropy and Jaccard
    on imports across versions'' indicates a software supply chain compromise (T1195.002)? Specifically:
    For each monitored package establish a historical baseline of file size, mean section entropy, and
    the imported-function set (IMPHASH). On a new version (file-write events or Zeek pe.log), compute
    the Z-score of file size and mean section entropy and the Jaccard similarity of imports vs. the prior
