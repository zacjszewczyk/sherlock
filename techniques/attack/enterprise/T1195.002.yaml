name: 'T1195.002: Compromise Software Supply Chain'
id: 90241612-f82b-40cb-aa14-5d8a6c935734
description: 'This playbook helps an analyst determine whether an adversary gained initial access by compromising
  a software supply chain (T1195.002) - tampering with application source code, hijacking an update/distribution
  mechanism, or replacing a compiled release with a trojanized version before it reaches the victim, as
  seen in the SolarWinds/SUNBURST (CISA AA20-352A) and CCleaner campaigns. It correlates network telemetry
  (Zeek files.log, http.log, conn.log, dns.log, ssl.log, pe.log) with host and package telemetry (Windows
  Event ID 4688/4663/4698/4657, Sysmon Event ID 1/3/6/7/11/13, Microsoft-Windows-CodeIntegrity/Operational,
  auditd execve, journald package transactions, macOS unified log/Endpoint Security) to expose tampered
  installers, updaters, and dependencies. Investigative angles include: downloaded executables whose hash
  or delivery infrastructure matches threat-intelligence IOCs; unsigned, invalidly-signed, or rare-publisher
  binaries (including the validly-signed-but-altered ''Bad Digest'' pattern); signed updates that deviate
  statistically from prior versions in size, imports, or section entropy; updater processes beaconing
  to non-baselined domains/IPs or DGA C2; post-update follow-on behavior such as persistence, security-control
  tampering, or C2; unauthorized writes to protected program directories; and malicious package-manager
  dependencies whose install hooks spawn shells or make egress. Detection blends symbolic-logic rules
  (IOC/hash matching, Authenticode and in-toto/SLSA provenance verification, allowlists, SACL auditing,
  provenance query graphs), statistical baselining (rarity percentiles, Z-score, Jaccard on imports, publisher
  prevalence and name entropy, conditional parent-child probability, beacon regularity), and machine learning
  (Isolation Forest, DBSCAN, LSTM autoencoders, provenance-graph learners such as KAIROS/MAGIC/POIROT,
  and explainable supervised classifiers with SHAP/LIME) to produce defensible, explainable alerts for
  the Initial Access tactic.'
type: technique
