- question: 'Using a machine-learning model, can you determine whether ''explainable supervised classification
    of downloads'' indicates a software supply chain compromise (T1195.002)? Specifically: Deploy a supervised
    classifier (Random Forest/XGBoost/LightGBM) using features from Zeek logs and the downloaded PE (http.log
    user-agent, files.log MIME type, conn.log duration/bytes, ssl.log JA3/JA3S, dns.log domain age, plus
    static PE features — byte/entropy histograms, imports, certificate fields) following the feature schema
    of EMBER (https://arxiv.org/abs/1804.04637); static section entropy is especially predictive for unseen
    binaries per zero-day XGBoost/Random Forest study (https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers).
