questions:
- question: 'Using deterministic rule logic, can you determine whether ''real-time IOC match on downloaded/created
    executables and their delivery infrastructure'' indicates a software supply chain compromise (T1195.002)?
    Specifically: For every new executable observed via network download (Zeek files.log) or process creation
    (Windows Event ID 4688), compute its SHA256 and query it against threat-intelligence feeds of known-malicious
    hashes, and correlate source IP (Zeek conn.log) and hostname (Zeek http.log/dns.log) against malicious-infrastructure
    feeds and campaign IOCs such as the SUNBURST hashes and avsvmcloud[.]com C2 published in CISA AA20-352A
    (https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-352a). Generate a high-severity alert
    on any match. Where supply-chain provenance/attestation is available, also alert when a downloaded
    artifact lacks a valid in-toto/SLSA attestation linking it to an authorized build per in-toto (https://www.usenix.org/system/files/sec19-torres-arias.pdf).
    Failure-mode signal: separately count and alert on bursts of blocked/denied egress or 404/NXDOMAIN
    to the same download host (firewall deny, proxy 4xx), which indicate failed payload retrieval attempts.'
  context: 'Tactic context (Initial Access / TA0001): adversaries seek an initial foothold by compromising
    the software supply chain - manipulating source code, hijacking the update/distribution mechanism,
    or replacing compiled releases - so that trusted, expected software delivers the adversary''s payload.
    Evidence under investigation: A downloaded executable file''s hash matches a known-malicious signature,
    or the file is downloaded from a URL or IP address present on a threat intelligence feed. Approach
    (real-time IOC match on downloaded/created executables and their delivery infrastructure): For every
    new executable observed via network download (Zeek files.log) or process creation (Windows Event ID
    4688), compute its SHA256 and query it against threat-intelligence feeds of known-malicious hashes,
    and correlate source IP (Zeek conn.log) and hostname (Zeek http.log/dns.log) against malicious-infrastructure
    feeds and campaign IOCs such as the SUNBURST hashes and avsvmcloud[.]com C2 published in CISA AA20-352A
    (https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-352a). Generate a high-severity alert
    on any match. Where supply-chain provenance/attestation is available, also alert when a downloaded
    artifact lacks a valid in-toto/SLSA attestation linking it to an authorized build per in-toto (https://www.usenix.org/system/files/sec19-torres-arias.pdf).
    Failure-mode signal: separately count and alert on bursts of blocked/denied egress or 404/NXDOMAIN
    to the same download host (firewall deny, proxy 4xx), which indicate failed payload retrieval attempts.
    A positive result indicates that delivered or installed software, an updater, or a dependency has
    been tampered with or is serving/contacting adversary infrastructure - corroborated by IOC/hash matches,
    signature/provenance failures, statistical deviation from known-good versions, anomalous updater egress,
    suspicious post-update follow-on, unauthorized writes to trusted directories, or malicious package
    hooks; a negative result means the artifact and its behavior are consistent with the legitimate, baselined
    supply chain. Investigate the named area of interest (Network Egress Points (e.g., Firewalls, Proxies),
    DNS Resolvers) and pivot from any hit to the originating process, account, user, host, and destination
    - then hunt for related persistence, defense evasion, command and control, and downstream lateral
    movement.'
  answer_sources:
  - Zeek files.log
  - Zeek http.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Network Egress Points (e.g., Firewalls, Proxies), DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// IOC match on downloaded/created executables + delivery infra\nFOR EACH new exe (Zeek files.log\
      \ download OR WinEvent 4688 process create):\n  h = sha256(file)\n  IF h IN ti_malicious_hashes\
      \ THEN alert(severity='high')        // e.g. SUNBURST hashes\n  IF conn.log.id.resp_h IN ti_bad_ips\
      \ OR http/dns host IN ti_bad_hosts THEN alert  // avsvmcloud[.]com\n  IF provenance_available AND\
      \ NOT valid_intoto_slsa_attestation(file) THEN alert\n// failure-mode: bursts of denied egress /\
      \ 404 / NXDOMAIN to same host = failed retrieval"
- question: 'Using statistical baselining, can you determine whether ''rarity, volume, and failure profiling
    of executable-serving sources'' indicates a software supply chain compromise (T1195.002)? Specifically:
    Profile every source IP/domain serving executables over a 90-day baseline and score historical rarity;
    flag sources in the 99th percentile for rarity (rarely/never seen) that serve executables. Add Physics-of-the-attack
    metrics: total bytes downloaded per artifact and downloads/min from the source (Volume/Frequency),
    and the ratio of successful (HTTP 200) to failed (404/403/timeouts) requests to that host (State)
    — a source that is both rare and shows abnormal volume or a spike in failed/blocked requests gets
    an elevated cumulative score. Use an unsupervised baseline such as Isolation Forest (https://doi.org/10.1145/2133360.2133363)
    over [rarity, bytes, rate, fail-ratio] to score multi-feature download records. Derive thresholds
    per environment from the empirical 99th percentile of these features.'
