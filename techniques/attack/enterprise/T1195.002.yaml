- question: 'Using deterministic rule logic, can you determine whether ''verify Authenticode and recompute
    digest, alert on invalid signature or copied signer'' indicates a software supply chain compromise
    (T1195.002)? Specifically: For each new executable creation (Windows Event ID 4688) or download (Zeek
    pe.log), verify digital-signature status and recompute the Authenticode digest; alert when the file
    is unsigned, the signature is invalid/expired (Microsoft-Windows-CodeIntegrity/Operational), or —
    critically — when SignatureStatus=Invalid yet the embedded signer subject is a known-good vendor,
    the canonical ''Bad Digest'' (0x80096010) tampering pattern measured in Certified Malware (https://doi.org/10.1145/3133956.3133958).
    Also alert on any binary whose signer/publisher is on an explicit blocklist, or that fails in-toto/SLSA
    provenance verification per in-toto (https://www.usenix.org/system/files/sec19-torres-arias.pdf).
    Failure-mode signal: count signature-validation failures per host/publisher per hour as a distinct
    metric.'
