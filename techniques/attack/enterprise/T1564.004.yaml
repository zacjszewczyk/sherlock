name: 'T1564.004: Hide Artifacts: NTFS File Attributes'
id: 6120aa9e-97d3-4bf5-aa80-7eb7ede5333e
description: 'Investigate adversary abuse of NTFS file attributes-primarily Alternate Data Streams (ADS)
  and Extended Attributes (EA)-used to hide malicious data, payloads, or complete binaries inside file
  metadata to evade static scanners and anti-virus. This playbook helps an analyst hunt for ADS creation
  and execution across Windows endpoints and servers: command lines and stream-creation events bearing
  colon ADS syntax (file.ext:stream) that match threat intel; executable content (PE/Imphash) hidden in
  streams; rare or high-entropy stream/path pairings; processes with no ADS baseline interacting with
  streams; write-then-execute sequences from a stream path; high-risk document or web-service parents
  spawning ADS-manipulating children; and ADS-launched processes initiating suspicious outbound connections
  or beaconing. It pairs symbolic-logic detections, statistical baselining, and machine learning across
  host, PowerShell, and network telemetry to answer whether the adversary is evading defenses with NTFS
  file attributes.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Does any process command line (Windows Event ID 4688) or named-stream creation (Sysmon Event
    ID 15) reference an Alternate Data Stream path, stream name, or content hash that exactly matches
    a known-malicious threat-intelligence indicator?
  context: 'Tactic: Stealth (TA0005). Adversaries hide payloads in NTFS Alternate Data Streams to defeat
    static AV and indicator scanning. This is the highest-fidelity check: ingest TI feeds of known-bad
    file paths, ADS stream names, and stream-content hashes, then scan the CommandLine/NewProcessName
    field of EID 4688 for colon ADS syntax (file.ext:stream) and exact-match those indicators. Also exact-match
    the Hash and TargetFilename fields of Sysmon EID 15, which records every named-stream creation with
    its content hash. Use the documented filename:streamname:$DATA model so you do not match the benign
    default data stream. A positive match is a confirmed compromise indicator warranting high-severity
    alert and host isolation; a negative result does not clear the host because novel streams will not
    be in TI-continue with the statistical and ML checks. References: [System Monitor (Sysmon), Microsoft](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon),
    [File Streams, Microsoft](https://learn.microsoft.com/en-us/windows/win32/fileio/file-streams).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'let ti = lookup(''ti_ads_iocs'')  // paths, stream_names, hashes

      (EID=4688 AND (CommandLine matches /[^\\:]+\.[A-Za-z0-9]+:[^:\s]+/))

      OR (Sysmon=15 AND TargetFilename contains '':'')

      | where TargetFilename in (ti.paths) OR stream_name in (ti.stream_names) OR Hash in (ti.hashes)

      | alert severity=high'
- question: Was any Alternate Data Stream created that contains a portable executable (PE) binary, identified
    by a non-null Imphash in the Sysmon Event ID 15 Hash field?
  context: 'Tactic: Stealth (TA0005). Hiding an executable inside a stream is structurally rare and high-fidelity:
    legitimate streams hold metadata (Zone.Identifier, SmartScreen, Wof), not code. Alert when a created
    ADS contains a PE binary, indicated by Hash containing IMPHASH= with a non-zero value in Sysmon EID
    15. Maintain an allow-list of installer/browser parents that are expected false positives, and exclude
    the benign streams Zone.Identifier, SmartScreen, and Wof. A positive result strongly suggests a staged
    payload hidden in the stream and should be triaged immediately; benign software rarely embeds executable
    content in named streams. References: [Hidden Executable In NTFS ADS, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/create_stream_hash/create_stream_hash_ads_executable.yml),
    [Unusual File Creation - ADS, Elastic](https://www.elastic.co/guide/en/security/current/unusual-file-creation-alternate-data-stream.html).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'Sysmon=15

      | where Hash contains ''IMPHASH='' AND Hash not contains ''IMPHASH=00000000000000000000000000000000''

      | where stream_name not in (''Zone.Identifier'',''SmartScreen'',''Wof'')

      | where Image not in (allowlist_installers_browsers)

      | alert severity=high'
- question: Is a newly observed ADS parent-path/stream-name pairing statistically rare (bottom 5th percentile
    of a 30-day rolling frequency baseline) and/or does the stream content exhibit high Shannon entropy
    (>7.2) indicating a packed or encrypted payload?
  context: 'Tactic: Stealth (TA0005). Novel malicious streams will not appear in TI, so rarity and content
    physics catch them. For every EID 4688/EID 15 event containing ADS syntax, parse the parent path and
    stream name and maintain 30-day rolling frequency counts; alert (medium) when a new path/stream pairing
    has both elements in the bottom 5th percentile. Augment with content entropy: compute Shannon entropy
    of the EID 15 stream content/hash bytes and flag entropy >7.2 (packed/encrypted payload). Optionally
    model expected byte-frequency distribution for the parent file type and flag divergence indicating
    embedded executable bytes. Derive percentile and entropy thresholds per-environment from a rolling
    30-day baseline. A rare, high-entropy stream is a strong hidden-payload signal even with no TI match.
    References: [Using Entropy Analysis, Lyda & Hamrock](https://ieeexplore.ieee.org/document/4140989),
    [PAYL, Wang & Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events = (EID=4688 OR Sysmon=15) where name contains '':''

      | parse parent_path, stream_name

      | join freq30d on (parent_path, stream_name)

      | eval rare = pctile(parent_freq)<5 AND pctile(stream_freq)<5

      | eval ent = shannon_entropy(stream_bytes)

      | where rare OR ent > 7.2

      | alert severity=medium'
- question: When a supervised classifier and command-line embedding outlier model score all new ADS events,
    which invocations are flagged as anomalous, and what are the top-3 contributing features?
  context: 'Tactic: Stealth (TA0005). Train a supervised classifier (e.g., Gradient Boosting) on features
    from ADS command lines and EID 15 records: command-line length, character entropy, content entropy,
    stream byte count, keyword presence (''powershell'',''cmd'',''certutil'',''wmic''), parent extension,
    and stream extension (''.exe'',''.dll'',''.ps1''). For command-line tokens, use BERT-style embeddings
    with unsupervised outlier detectors (Isolation Forest/COPOD/autoencoder) to flag rarely-seen ADS invocations.
    Score all new ADS events; the alert must surface the top-3 contributing features (e.g., content entropy,
    stream extension, parent process) so an analyst can quickly validate. This catches obfuscated invocations
    that evade exact-match and simple rarity rules. References: [BERT Embeddings for Command Line Anomaly
    Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "feats = extract(cmdline_len, char_entropy, content_entropy, stream_bytes,\n              \
      \  kw_powershell/cmd/certutil/wmic, parent_ext, stream_ext)\nscore_gbm = gbm.predict_proba(feats)\n\
      emb = bert_embed(cmdline_tokens); score_if = isolation_forest(emb)\n| where score_gbm > 0.8 OR score_if\
      \ anomalous\n| annotate top3 = shap_top_features(feats)\n| alert severity=medium"
- question: Is any process that is NOT on the allow-list of legitimate stream writers (e.g., explorer.exe,
    chrome.exe, msedge.exe, firefox.exe, benign Zone.Identifier/SmartScreen writers) observed creating
    or accessing a file object whose name contains ADS syntax (a colon)?
  context: 'Tactic: Stealth (TA0005). Most ADS activity comes from a handful of known processes (browsers
    writing Zone.Identifier, Explorer, SmartScreen). Define that allow-list and fire on any EID 4688/EID
    4663 (requires SACL auditing) or Sysmon EID 15 event where the process is NOT allow-listed and the
    object/stream name contains ADS syntax. Sysmon EID 15 gives the most reliable, low-noise stream-creation
    signal; align exclusions with a curated benign-stream list. A non-allow-listed process touching a
    stream-especially utilities like powershell, cmd, certutil, or unknown binaries-is suspicious and
    should be investigated. This is a behavioral complement to TI matching that catches unknown tooling.
    References: [File Streams, Microsoft](https://learn.microsoft.com/en-us/windows/win32/fileio/file-streams),
    [System Monitor (Sysmon), Microsoft](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon),
    [Unusual File Creation - ADS, Elastic](https://www.elastic.co/guide/en/security/current/unusual-file-creation-alternate-data-stream.html).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: User Workstations, Web Servers, and Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EID=4688 OR EID=4663 OR Sysmon=15)

      | where ObjectName contains '':'' OR CommandLine matches /\.[A-Za-z0-9]+:[^:\s]+/

      | where Image not in allowlist(''explorer.exe'',''chrome.exe'',''msedge.exe'',''firefox.exe'', zone_id_writers)

      | alert severity=medium'
- question: Does any process exceed its 30-day baseline of daily ADS event counts by more than 3 standard
    deviations, or show a surge in access-denied (EID 4663) attempts against a stream indicating blocked/probing
    writes?
  context: 'Tactic: Stealth (TA0005). Baseline 30-day ADS event counts (EID 4688/4663/Sysmon 15) per process
    name, per host, per day, and compute mean and standard deviation. Alert when a process exceeds its
    daily mean by >3 sigma-a sudden burst of ADS activity from an otherwise quiet process suggests staging
    or mass-hiding of artifacts. Separately profile the failure-mode rate of denied file-access attempts
    (EID 4663 with access-denied status) to a stream as a distinct signal of probing or blocked writes,
    which can reveal an actor attempting ADS abuse against hardened paths. Derive sigma thresholds per
    host-role from the baseline so a busy web server is judged differently from a quiet workstation.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: User Workstations, Web Servers, and Application Servers'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = stats by process,host over 30d: mean=avg(daily_ads_cnt), sd=stdev(daily_ads_cnt)

      today = count ADS events by process,host (EID 4688/4663/Sysmon15)

      | where today > mean + 3*sd

      | union (EID=4663 status=ACCESS_DENIED AND ObjectName contains '':'' | surge vs baseline)

      | alert severity=medium'
- question: When ADS events are vectorized and clustered (Isolation Forest / DBSCAN), which events fall
    outside the large benign clusters as noise or tiny anomalous clusters, and what are their top-3 contributing
    features?
  context: 'Tactic: Stealth (TA0005). Routine ADS activity (browser Zone.Identifier writes during work
    hours) forms large, dense clusters; malicious activity tends to be noise or small outlier clusters.
    Vectorize each ADS event using process, parent, user, target/stream extension, stream byte count,
    content entropy, and hour-of-day, then apply Isolation Forest or DBSCAN. Events flagged as noise/outliers
    warrant review. Isolation Forest path-length attribution supplies the top-3 contributing features
    that must appear in the alert text so the analyst sees, e.g., unusual user, off-hours, and .exe stream
    extension. This unsupervised approach surfaces novel patterns without prior labels. References: [Isolation
    Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: User Workstations, Web Servers, and Application Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = vectorize(process, parent, user, stream_ext, stream_bytes, content_entropy, hour)

      model = IsolationForest().fit(X)  # or DBSCAN(eps,min_samples)

      | where model.is_outlier(x)  # noise / tiny cluster

      | annotate top3 = path_length_attribution(x)

      | alert severity=medium'
- question: Was a file write to an Alternate Data Stream (Sysmon EID 15 or EID 4663 with a colon in the
    Object Name) followed within 5 minutes by a process creation (EID 4688) launched from that same stream
    path on the same host, or a PowerShell Script Block (EID 4104) that writes content to a stream and
    then launches it?
  context: 'Tactic: Stealth (TA0005). The write-then-execute sequence is the core malicious pattern: an
    actor stages a payload in a stream and immediately runs it. Implement a stateful rule-on a stream
    write for a host/path, if a process creation from the same host and matching stream path occurs within
    5 minutes, raise a high-confidence alert. Also fire on the script-layer primitive: PowerShell Script
    Block Logging (EID 4104) showing content written to a stream then launched via Start-Process or $env:comspec
    with redirection. Sysmon EID 15 provides the authoritative write event. A positive correlation is
    high-confidence malicious staging-isolate the host and capture the stream content for analysis. References:
    [Powershell Store File In ADS, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_store_file_in_alternate_data_stream.yml),
    [System Monitor (Sysmon), Microsoft](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - Windows Event ID 4104 (PowerShell Script Block)
  - 'NAI: Critical System Directories (e.g., C:\Windows\System32), User Profile Directories, and Temporary
    File Directories'
  range: Last 90 days (event-centered, 5-minute correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'write = (Sysmon=15 OR (EID=4663 AND ObjectName contains '':''))

      exec  = EID=4688 where NewProcessName contains '':''

      | join write,exec on host AND stream_path within 5m (write before exec)

      | union (EID=4104 where ScriptBlock matches /:.*$DATA/ AND /Start-Process|comspec/)

      | alert severity=high'
- question: For observed write-and-execute ADS sequences, is the write-to-execute time delta a statistical
    outlier-below the 1st percentile (immediate programmatic execution) or above the 99th percentile (delayed/scheduled
    execution)-or does the execute attempt fail?
  context: 'Tactic: Stealth (TA0005). Benign workflows that touch streams have a characteristic write-to-execute
    timing distribution. Compute the write-to-execute time delta for all ADS write-and-execute sequences
    and baseline it for benign apps; flag outliers below the 1st percentile (immediate programmatic execution,
    typical of droppers) or above the 99th percentile (delayed/scheduled execution used to evade timeline
    correlation). Also track the state/failure dimension: sequences where the execute attempt fails (process
    exits non-zero or EID 4663 denies access to the stream) are profiled as a distinct signal of attempted-but-blocked
    execution. Derive percentile bounds from a rolling 30-day baseline. This adds timing-based fidelity
    to the correlation rule above.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - Windows Event ID 4104 (PowerShell Script Block)
  - 'NAI: Critical System Directories (e.g., C:\Windows\System32), User Profile Directories, and Temporary
    File Directories'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'seq = join write,exec on host,stream_path

      | eval delta = exec_time - write_time

      | eval p = percentile_rank(delta, baseline_30d)

      | where p < 1 OR p > 99 OR exec_exit_code != 0 OR exec_access_denied

      | alert severity=medium'
- question: Does the enterprise-wide hourly time series of write-and-execute ADS events deviate significantly
    from a seasonal forecast (Prophet/LSTM autoencoder), and does provenance-graph learning reconstruct
    a stream-write -> process-create attack subgraph?
  context: 'Tactic: Stealth (TA0005). Coordinated or widespread ADS abuse appears as a deviation from
    normal daily/weekly seasonality. Aggregate enterprise write-and-execute ADS counts per hour into a
    time series and apply Prophet or an LSTM autoencoder that learns seasonality; alert on significant
    deviation from prediction. Complement with provenance-graph learning (KAIROS, ThreaTrace) that models
    the stream-write -> process-create causal edge directly and reconstructs the surrounding attack subgraph
    for analysts. Alerts must list the top-3 contributing features/nodes. This catches campaign-scale
    activity and gives an analyst the causal context-which process wrote, which executed, and the connected
    nodes-rather than isolated events. References: [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf),
    [ThreaTrace, Wang et al.](https://arxiv.org/pdf/2111.04333).'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - Windows Event ID 4104 (PowerShell Script Block)
  - 'NAI: Critical System Directories (e.g., C:\Windows\System32), User Profile Directories, and Temporary
    File Directories'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ts = hourly_count(write_execute_ads_events)

      fc = Prophet().fit(ts)  // or LSTM autoencoder

      | where abs(actual - fc.yhat) > fc.interval

      graph = provenance_graph(stream_write -> process_create)

      | gnn_score(graph) anomalous -> reconstruct_subgraph()

      | annotate top3 nodes/edges; alert severity=medium'
- question: Does a high-risk parent process that should never spawn ADS-manipulating children (WINWORD.EXE,
    EXCEL.EXE, POWERPNT.EXE, OUTLOOK.EXE, w3wp.exe) appear in EID 4688 with a child command line containing
    ADS syntax, or as the image in a Sysmon EID 15 stream-creation event?
  context: 'Tactic: Stealth (TA0005). Document-handling apps and IIS worker processes are common initial-access
    footholds; if WINWORD.EXE or w3wp.exe creates or executes from a stream, that is a strong exploitation
    signal. Maintain a high-risk parent list and alert when such a parent appears in EID 4688 where the
    child command line contains ADS syntax, or when these parents are the image in a Sysmon EID 15 stream-creation
    event. Targeting the structural artifact (stream creation/EA write) rather than content follows indicator-design
    best practice and resists evasion. A positive result indicates likely macro/exploit-driven payload
    staging via ADS and should be triaged as potential initial access plus defense evasion. References:
    [Host-Based Threat Modeling, SpecterOps](https://posts.specterops.io/host-based-threat-modeling-indicator-design-a875c9c0bbe3).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: Microsoft Office Servers (e.g., Exchange), Web Servers (e.g., IIS), and User Workstations running
    Office applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'hi_risk = (''WINWORD.EXE'',''EXCEL.EXE'',''POWERPNT.EXE'',''OUTLOOK.EXE'',''w3wp.exe'')

      (EID=4688 AND ParentProcessName in hi_risk AND CommandLine matches /\.[A-Za-z0-9]+:[^:\s]+/)

      OR (Sysmon=15 AND Image in hi_risk)

      | alert severity=high'
- question: Over a 90-day baseline, is the (ParentProcessName, ChildProcessName) pair for an ADS-involving
    child a rare lineage (seen fewer than 5 times enterprise-wide), or does the ADS child crash / have
    its stream access denied (EID 4663)?
  context: 'Tactic: Stealth (TA0005). Rare process lineage is a classic anomaly signal for novel attack
    tooling. Over a 90-day baseline, count parent-child process pairs whose child involves ADS. For each
    new event, look up the (ParentProcessName, ChildProcessName) frequency and flag pairs seen fewer than
    5 times enterprise-wide as rare lineage. Also track the failure dimension: ADS child processes that
    crash or whose stream access is denied (EID 4663) are profiled separately, since failed attempts still
    indicate adversary activity. Derive the rarity count threshold per-environment. This statistical complement
    catches uncommon parent/child combinations that signature rules miss.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: Microsoft Office Servers (e.g., Exchange), Web Servers (e.g., IIS), and User Workstations running
    Office applications'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = count by (ParentProcessName, ChildProcessName) over 90d where child involves ADS

      | for new_event: lookup pair_freq

      | where pair_freq < 5

      | union (EID=4663 ACCESS_DENIED on stream by ADS child OR child_exit != 0)

      | alert severity=medium'
- question: When a provenance/lineage graph is scored with node/edge GNN models (GraphSAGE, KAIROS, MAGIC),
    which new ADS-involving edges from document/web parents are anomalous, and what are the top-3 anomalous
    nodes/edges?
  context: 'Tactic: Stealth (TA0005). Build a provenance/lineage graph of process, file/stream, and network
    nodes and learn benign structure; new ADS-involving edges are scored as anomalous via node-level GraphSAGE
    (ThreaTrace), temporal edge-level GNN with attack-graph reconstruction (KAIROS), or self-supervised
    masked graph autoencoder with drift adaptation (MAGIC). Surface the top-3 anomalous nodes/edges in
    the alert. This models the relationship between an Office/IIS parent and an ADS child in graph terms,
    catching subtle structural deviations-such as a web worker process suddenly connected to a stream-creation
    and execution chain-that flat rules and frequency counts cannot represent. References: [ThreaTrace,
    Wang et al.](https://arxiv.org/pdf/2111.04333), [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf),
    [MAGIC, Jia et al.](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - 'NAI: Microsoft Office Servers (e.g., Exchange), Web Servers (e.g., IIS), and User Workstations running
    Office applications'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'G = provenance_graph(process, file/stream, network nodes)

      model = GraphSAGE/KAIROS/MAGIC.fit(benign_G)

      | score new ADS edges from {WINWORD,EXCEL,w3wp,...} parents

      | where edge_anomaly_score high

      | annotate top3 anomalous nodes/edges; alert severity=medium'
- question: Does a process whose executable path is an Alternate Data Stream (or that maps to a Sysmon
    EID 15 stream-created executable) initiate an outbound network connection (EID 5156 / Zeek conn.log)
    to a destination IP matching a known-malicious threat-intelligence indicator?
  context: 'Tactic: Stealth (TA0005). An ADS-launched process making network connections suggests the
    hidden payload is active and possibly establishing C2 or exfiltration. Join EID 4688 process creation
    with network events (EID 5156 / Zeek conn.log) by Process ID on a single host; raise high severity
    if the process image path contains ADS syntax (or the process maps to a Sysmon EID 15 stream-created
    executable) AND the destination IP matches a known-malicious TI indicator. A positive match is a confirmed
    active ADS payload communicating with adversary infrastructure-treat as an incident, isolate the host,
    and block the destination. This correlates host-level hiding with network-level intent. References:
    [System Monitor (Sysmon), Microsoft](https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: DMZ Servers, Internet Gateways, and Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc = EID=4688 where NewProcessName contains '':'' OR pid in sysmon15_stream_execs

      net  = (EID=5156 OR zeek_conn)

      | join proc,net on host,pid

      | where dest_ip in ti_malicious_ips

      | alert severity=high'
- question: For connections from ADS-launched processes, do destination ports show low-rarity (below 1st
    percentile) or port-entropy spikes (scanning), and do interval/byte regularity (FFT) analyses reveal
    periodic beaconing, or a surge in blocked/refused connections?
  context: 'Tactic: Stealth (TA0005). Active ADS payloads often beacon or scan. For connections from ADS-launched
    processes, baseline destination ports and compute Shannon entropy of the per-host port distribution
    over 24h; spikes suggest scanning, and connections to ports below the 1st percentile rarity are flagged.
    Apply frequency/jitter beaconing analysis (interval and byte-count regularity, FFT) to surface periodic
    C2 (BAYWATCH, RITA). Also profile the failure-mode rate of blocked/denied connections (EID 5156 deny,
    high conn-refused/RST counts in Zeek) as a distinct C2-probing signal. Together these reveal covert
    channels and infrastructure probing that single-connection rules would miss. References: [BAYWATCH,
    Hu et al.](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks),
    [RITA, Active Countermeasures](https://github.com/activecm/rita).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Sysmon Event ID 15 (FileCreateStreamHash)
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: DMZ Servers, Internet Gateways, and Domain Controllers'
  range: Last 90 days (24h port window, 30-day baseline)
  queries:
  - technology: Zeek/pseudocode
    query: 'conns = zeek_conn where src_pid in ads_launched_procs

      | eval port_entropy = shannon(dport over 24h per host)

      | eval rare_port = percentile_rank(dport) < 1

      | beacon = fft_regularity(interval, bytes)  // BAYWATCH/RITA

      | where port_entropy spike OR rare_port OR beacon periodic OR rst_ratio high

      | alert severity=medium'
