- question: 'Using a machine-learning model, can you determine whether ''Browser connection classifier''
    indicates browser session hijacking activity for the Collection tactic? Specifically: Train a Gradient
    Boosting model on Zeek flow features enriched with reputation, ASN, and domain age, and escalate browser
    flows predicted as malicious with confidence >0.9; surface the top-3 contributing features (e.g.,
    domain age, byte ratio, JA4 rarity) in the alert. Beware that ClientHello randomization makes any
    single TLS fingerprint unstable, so weight behavior/volume features over fingerprint rarity ([JA3
    Fingerprints Fade as Browsers Embrace TLS Extension Randomization](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization)).'
