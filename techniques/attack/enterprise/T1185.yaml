questions:
- question: 'Using deterministic rule logic, can you determine whether ''Browser C2 TI correlation'' indicates
    browser session hijacking activity for the Collection tactic? Specifically: Join Windows Event 5156
    / Zeek conn.log + dns.log, filter on known browser processes (chrome.exe, msedge.exe, iexplore.exe,
    firefox.exe), and alert when the destination matches a curated C2/malware intelligence feed. Corroborate
    with TLS fingerprinting so a browser-named process presenting a non-browser TLS ClientHello stack
    is flagged even without a feed hit ([JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3),
    [JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4)).'
  context: 'Tactic context (Collection): adversaries hijack a user''s browser session to inherit its authenticated
    context, pivot into the intranet, and collect sensitive data, often bypassing 2-factor authentication.
    Evidence under investigation: A standard user-facing browser process (e.g., chrome.exe, msedge.exe)
    initiates a network connection to a destination IP address or domain categorized as a command and
    control (C2) or malware hosting site on a threat intelligence feed. Approach (Browser C2 TI correlation):
    Join Windows Event 5156 / Zeek conn.log + dns.log, filter on known browser processes (chrome.exe,
    msedge.exe, iexplore.exe, firefox.exe), and alert when the destination matches a curated C2/malware
    intelligence feed. Corroborate with TLS fingerprinting so a browser-named process presenting a non-browser
    TLS ClientHello stack is flagged even without a feed hit ([JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3),
    [JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4)). A positive result indicates
    browser session hijacking, injection, pivoting, or stolen-token replay consistent with T1185; a negative
    result means the activity matches expected browser/user baselines. Investigate the named area of interest
    (Enterprise web proxy, DNS resolvers, and all user endpoints.) and pivot from any hit to the originating
    process, account, session token, and downstream lateral-movement or data-collection activity.'
