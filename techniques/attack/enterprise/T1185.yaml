    Profile DNS NXDOMAIN and TLS/HTTP failure (RST, 4xx/5xx, conn_state S0/REJ in Zeek conn.log) rates
    per browser process; a browser generating a burst of failed resolutions/connections (>20/min) to young
    or low-reputation domains indicates injected-proxy C2 retry behavior, a distinct signal from successful
