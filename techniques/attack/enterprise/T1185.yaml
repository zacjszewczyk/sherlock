  context: 'Tactic context (Collection): adversaries hijack a user''s browser session to inherit its authenticated
    context, pivot into the intranet, and collect sensitive data, often bypassing 2-factor authentication.
    Evidence under investigation: A user''s browser-generated network traffic exhibits anomalous characteristics
    when compared to their own historical baseline, such as a sudden increase in connections to internal
    IP addresses, use of non-standard ports, or a significant change in data upload/download ratios. Approach
    (Internal pivot rule): Correlate Windows 5156 + Zeek conn.log and alert when browser processes connect
    to RFC1918/DMZ hosts on service ports like 22/139/445/3389/1433, or when a browser process itself
    begins listening on/serving a new local port (injected proxy) — browser-originated intranet service
