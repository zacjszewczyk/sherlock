- question: 'Using statistical baselining and anomaly scoring, can you determine whether ''Rare domain
    scoring'' indicates browser session hijacking activity for the Collection tactic? Specifically: Track
    each user''s browser destination prevalence, flagging domains in the bottom 1st percentile of organizational
    coverage that are <=30 days old for analyst review; derive the percentile cut and domain-age threshold
    from your own 30-day proxy/DNS baseline rather than fixed values ([Hopper: Modeling and Detecting
    Lateral Movement](https://www.usenix.org/system/files/sec21-ho.pdf)).'
