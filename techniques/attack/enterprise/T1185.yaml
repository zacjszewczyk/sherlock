name: 'T1185: Browser Session Hijacking'
id: defe01d9-dd0b-464a-9348-cd0e3fe1ebbb
description: 'This playbook helps an analyst investigate Browser Session Hijacking (T1185): adversaries
  abusing vulnerabilities and inherent browser functionality to inject into, proxy through, or steal sessions
  from a user''s web browser in order to inherit cookies, HTTP sessions, SSL client certificates, and
  authenticated intranet access. It correlates host telemetry (Windows 4688 command lines, 4663 object
  access, Sysmon Event 8/10/7 for remote-thread, process-access, and module-load injection primitives,
  and privilege/logon events 4672/4673/4624/4648) with network telemetry (Zeek conn.log/dns.log/http.log,
  Windows 5156 filtering) to surface browser pivoting and man-in-the-browser activity. Investigative angles
  include: browser processes beaconing to C2/malware infrastructure or presenting non-browser TLS fingerprints;
  non-browser processes reading browser cookie/credential stores; browsers spawning shells or being targeted
  by cross-process injection; browser-originated intranet service connections and pivot reconnaissance;
  and stolen session tokens replayed from anomalous IPs, geolocations, or User-Agents. Detection blends
  symbolic-logic rules, statistical baselining (percentiles, sigma bands, velocity, failure-rate profiling),
  and machine learning (Gradient Boosting, Isolation Forest, autoencoders, LSTM and graph anomaly models)
  to produce explainable, evasion-resistant alerts for the Collection tactic.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
