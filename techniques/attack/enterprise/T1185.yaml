    query: "// Symbolic Logic detection for: Browser C2 TI correlation\n// Evidence: A standard user-facing\
      \ browser process (e.g., chrome.exe, msedge.exe) initiates a network connection to a destination\
      \ IP address or domain categorized as a command and control (C2) or malware hosting site on a threat\
