      ANALYZE events FROM Zeek conn.log, Zeek dns.log, Windows Event ID 5156, Windows Event ID 4688\n\
      \  IMPLEMENT: Join Windows Event 5156 / Zeek conn.log + dns.log, filter on known browser processes\
      \ (chrome.exe, msedge.exe, iexplore.exe, firefox.exe), and alert when the destination matches a\
      \ curated C2/malware intelligence feed. Corroborate with TLS fingerprinting so a browser-named process\
      \ presenting a non-browser TLS ClientHello stack is flagged even without a feed hit ([JA3 TLS Client\
      \ Fingerprinting](https://github.com/salesforce/ja3), [JA4+ Network Fingerprinting Suite](https://github.com/FoxIO-LLC/ja4)).\n\
      OUTPUT alert WITH context (host, user, process, dest, session) FOR analyst triage"
- question: 'Using deterministic rule logic, can you determine whether ''Failure-rate profiling'' indicates
    browser session hijacking activity for the Collection tactic? Specifically: Profile DNS NXDOMAIN and
    TLS/HTTP failure (RST, 4xx/5xx, conn_state S0/REJ in Zeek conn.log) rates per browser process; a browser
    generating a burst of failed resolutions/connections (>20/min) to young or low-reputation domains
    indicates injected-proxy C2 retry behavior, a distinct signal from successful browsing ([Hopper: Modeling
    and Detecting Lateral Movement](https://www.usenix.org/system/files/sec21-ho.pdf)).'
  context: 'Tactic context (Collection): adversaries hijack a user''s browser session to inherit its authenticated
    context, pivot into the intranet, and collect sensitive data, often bypassing 2-factor authentication.
