- question: 'Using deterministic rule logic, can you determine whether ''Internal pivot rule'' indicates
    browser session hijacking activity for the Collection tactic? Specifically: Correlate Windows 5156
    + Zeek conn.log and alert when browser processes connect to RFC1918/DMZ hosts on service ports like
    22/139/445/3389/1433, or when a browser process itself begins listening on/serving a new local port
    (injected proxy) — browser-originated intranet service connections are the signature of a pivot ([Browser
