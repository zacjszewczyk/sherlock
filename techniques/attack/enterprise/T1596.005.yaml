name: 'T1596.005: Scan Databases'
id: 9ffc8b03-c972-46cb-8381-a5778162e1ea
description: This playbook helps an analyst investigate whether an adversary is leveraging public Internet
  scan databases (e.g., Shodan, Censys, GreyNoise) to perform reconnaissance and target exposed assets.
  It correlates inbound perimeter connections against known scanner threat intelligence, identifies scanning/exploitation
  signatures in HTTP/S requests to public-facing applications, detects port-set overlap with publicly-indexed
  exposure, watches for post-exposure traffic spikes after configuration changes, and surfaces password
  spraying against recently-indexed services. Together these questions distinguish scan-database-driven
  targeting from benign traffic and link reconnaissance to follow-on initial access attempts.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
