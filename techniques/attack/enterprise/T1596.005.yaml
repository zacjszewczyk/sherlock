questions:
- question: 'For the Reconnaissance concern around T1596.005 (Scan Databases), can you confirm ''Scanner
    IP correlation''? Specifically, investigate the following evidence: Multiple inbound connection attempts
    from a source IP address listed on a public threat intelligence feed of known internet-wide scanners
    (e.g., Shodan, Censys) or general malicious actors. Apply the symbolic logic approach to determine
    whether this activity is present.'
  context: 'This question supports the Reconnaissance information requirement: "Is the adversary conducting
    reconnaissance by leveraging information from public scan databases?". Alert when Zeek conn.log source
    IPs match a scanner threat-intel list (Censys/Shodan scanner ranges, GreyNoise, internet-wide scanner
    ranges), regardless of connection state, and additionally flag the single-SYN, no-retransmission,
    high-fan-out signature characteristic of stateless internet-wide scanners [ZMap: Fast Internet-wide
    Scanning](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf).
    Scan databases such as [Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf) are built from this
    exact traffic. A positive result indicates an external actor is likely using public scan-database
    intelligence to identify and target exposed services on Perimeter network devices, including internet-facing
    firewalls, web servers, and VPN concentrators.; a negative result helps reduce noise and rule out
    reconnaissance-driven targeting. Pivot on the source IP, targeted service/port, and timing relative
    to any exposure changes to confirm intent.'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Perimeter network devices, including internet-facing firewalls, web servers, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
