- question: 'For the Reconnaissance concern around T1596.005 (Scan Databases), can you confirm ''IDS signature
    correlation for scanning requests''? Specifically, investigate the following evidence: Inbound HTTP/S
    requests to public-facing applications containing URI paths, User-Agent strings, or request payloads
    that match signatures of automated scanning or exploitation tools (e.g., Nuclei, Metasploit, nmap
    scripts). Apply the symbolic logic approach to determine whether this activity is present.'
  context: 'This question supports the Reconnaissance information requirement: "Is the adversary conducting
    reconnaissance by leveraging information from public scan databases?". Match Zeek http.log requests
    against IDS signatures for scanning User-Agents, URI patterns, and exploit payloads (e.g., JNDI/${jndi:ldap,
    Log4Shell obfuscation variants, Nuclei/nmap/Metasploit markers) and alert; correlate an inbound payload
    hit with any outbound LDAP/RMI/HTTP callback from the same host to confirm successful exploitation
    (state) versus a harmless probe [Log4Shell Reconnaissance and Post-Exploitation Network Detection](https://www.nccgroup.com/research-blog/log4shell-reconnaissance-and-post-exploitation-network-detection/).
    A positive result indicates an external actor is likely using public scan-database intelligence to
