- question: 'For the Reconnaissance concern around T1596.005 (Scan Databases), can you confirm ''Pre-compiled
    port list attack detection''? Specifically, investigate the following evidence: A single external
    IP address initiates connections to a set of destination ports on an internal host that has a high
