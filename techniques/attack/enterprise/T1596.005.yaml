    Shodan), all occurring within a condensed timeframe (e.g., under 10 minutes). Apply the symbolic logic
    approach to determine whether this activity is present.'
  context: 'This question supports the Reconnaissance information requirement: "Is the adversary conducting
    reconnaissance by leveraging information from public scan databases?". Generate per-host known-exposed
    port lists from scan-database APIs ([Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf)) and
    alert when an external IP hits more than five distinct ports on that list within ten minutes — high
    overlap with the publicly-indexed exposure implies the source pre-queried a scan database rather than
    blind-scanning. A positive result indicates an external actor is likely using public scan-database
