questions:
- question: 'Using deterministic rule logic, can you confirm whether ''SID injection command detection''
    reveals SID-History Injection activity for the Stealth tactic? Specifically: Alert when a process
    creation event (Windows Event ID 4688 / Sysmon 1) on a Domain Controller has a command line matching
    known SID-History injection patterns: ''sid::add'', ''sid::patch'', ''lsadump::dcsync'', ''Invoke-SIDHistory'',
    ''Add-DomainObjectSidHistory'', ''DCShadow'', or mimikatz/known tool image names. These tools are
    the documented mechanism for SID injection (Sneaky AD Persistence #14: SID History, Metcalf). This
    is the deterministic floor; do not remove. Tune image-name exclusions per environment, not the keyword
    list.'
  context: 'Tactic context (Stealth): Has the adversary escalated privileges using SID-History Injection?
    (PIR) Evidence under investigation: A process creation event is logged on a Domain Controller for
    a known SID-History injection tool, such as mimikatz.exe, with command-line arguments specific to
    SID manipulation like ''sid::add'' or ''sid::patch''. Approach (SID injection command detection):
    Alert when a process creation event (Windows Event ID 4688 / Sysmon 1) on a Domain Controller has
    a command line matching known SID-History injection patterns: ''sid::add'', ''sid::patch'', ''lsadump::dcsync'',
    ''Invoke-SIDHistory'', ''Add-DomainObjectSidHistory'', ''DCShadow'', or mimikatz/known tool image
    names. These tools are the documented mechanism for SID injection (Sneaky AD Persistence #14: SID
    History, Metcalf). This is the deterministic floor; do not remove. Tune image-name exclusions per
    environment, not the keyword list. A positive result indicates an sIDHistory change or its downstream
    abuse that is inconsistent with an approved, documented domain migration - i.e., a likely privilege-escalation
    or stealthy persistence action - and should be escalated; a negative result means the observed activity
    matches sanctioned migration/maintenance baselines. Pivot from any hit into the named area of interest
    (Domain Controllers, SIEM/Log Aggregator): identify the originating account, source host/IP and bind
    identity, the exact SID added, and follow the account forward into subsequent logons and privileged
    actions to confirm whether the injected SID is being exercised.'
