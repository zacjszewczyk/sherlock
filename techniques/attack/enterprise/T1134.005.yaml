      ''lsadump::dcsy

      EMIT alert WITH subject_account, source_host, target_account, sid_value, event_id'
- question: 'Using statistical baselining, can you detect whether ''Command volume and rarity'' reveals
    SID-History Injection activity for the Stealth tactic? Specifically: Beyond entropy, profile the PHYSICS
    of DC process activity. Volume: byte-length of the command line; Frequency: count of distinct admin
    tools spawned per host per hour; State: parent-process success. Flag commands whose length exceeds
    the 98th percentile of the per-host baseline OR that invoke a tool never before seen on that DC (rarity
    in the 1st percentile). Also retain Shannon-entropy >98th-percentile as an obfuscation indicator.
    Derive percentiles from 30 days of local 4688 data.'
