  - 'NAI: Domain Controllers, SIEM/Log Aggregator'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Deterministic detection for: SID injection command detection

      MATCH events FROM Windows Event ID 4688

      WHERE matches_rule("SID injection command detection")

      // Alert when a process creation event (Windows Event ID 4688 / Sysmon 1) on a Domain Controller
