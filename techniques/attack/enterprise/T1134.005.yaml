- question: 'Using statistical baselining, can you detect whether ''Logon rarity and failure scoring''
    reveals SID-History Injection activity for the Stealth tactic? Specifically: Maintain a historical
    baseline of user-to-host logon pairs and score each post-edit logon by rarity; alert on first-time
    pairs or pairs below normal frequency thresholds, with site-specific percentiles derived from data
    such as the LANL auth dataset (Detecting Structurally Anomalous Logins, Siadati & Memon). Failure-mode
    signal: also count failed logons (4625) and Kerberos failures by the same account in the window, as
    injection probing often produces failures before success.'
