    is modified (Windows Event ID 5136), and this is immediately followed by a successful logon (Windows
    Event ID 4624) by that same user to a critical system (e.g., Domain Controller, primary database)
    where they have no history of prior access. Approach (Post-modification logon chase): Stateful correlation
    linking an sIDHistory modification (Event ID 5136, or 4765) to a subsequent successful logon (Event
    ID 4624) by the same account within 30 minutes to a host on the critical-asset watchlist where the
