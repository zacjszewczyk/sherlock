name: 'T1134.005: Access Token Manipulation: SID-History Injection'
id: 710552bd-8141-4496-8a92-6d8ee205e6f2
description: 'This playbook helps an analyst determine whether an adversary has performed SID-History
  Injection (T1134.005) to escalate privileges and bypass access controls in an Active Directory environment.
  With Domain Administrator (or equivalent) rights, an adversary can insert harvested or well-known privileged
  SID values (e.g., Enterprise Admins -519, Domain Admins -512) into the sIDHistory attribute of a target
  account so that those SIDs are silently included in the account''s access token, granting effective
  privileges that the account''s explicit group memberships do not justify. The playbook covers the full
  behavior chain: execution of known injection tooling on Domain Controllers (mimikatz ''sid::add''/''sid::patch'',
  DCShadow, PowerShell Add-DomainObjectSidHistory), the directory modification itself (Windows Event ID
  5136/4765 success, 4766 failure, or Zeek ldap.log Modify), and the follow-on abuse (rare logons to critical
  assets, privileged group changes, and resource access that exceeds explicit rights). Investigative angles
  include privileged/undocumented/same-domain SID values added to sIDHistory, modifications from accounts
  or hosts not on the migration allow-list, edits targeting dormant or service accounts, bulk modification
  spikes, and periodic reconciliation of populated sIDHistory against change-management records. Detection
  blends symbolic-logic rules, statistical baselining (percentiles, change-point detection, rarity and
  failure-rate scoring), and machine learning (Isolation Forest, One-Class SVM, sequence/graph models,
  NLP documentation matching) to produce evasion-resistant, explainable alerts supporting the Privilege
  Escalation and Stealth tactics.'
