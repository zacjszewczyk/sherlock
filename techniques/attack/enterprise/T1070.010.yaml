questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match relocated files to malicious
    hashes'' indicates that an adversary has relocated malware to evade defenses? Specifically: Query
    the SIEM for file creation, rename, move, or execution events (Windows Event ID 4663, Windows Event
    ID 4688, Sysmon Event IDs 1, 11, and 23) where the SHA256 hash matches a known-malicious IOC list
    from threat intelligence. Alert on any match and preserve BOTH the original and relocated full paths
    so analysts can confirm the same payload moved between locations. Maintain a portable rule set for
    these file/process events using community detection content ([SigmaHQ](https://github.com/SigmaHQ/sigma)),
    and apply behavioral baselining of expected binary locations per [CISA/NSA Living off the Land guidance](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).'
  context: 'Tactic context (Stealth / TA0005): the adversary is trying to hide and conceal their actions
    by relocating a delivered payload so it blends into trusted locations and is separated from the events
    that first drew defender attention. Evidence under investigation: A file with a hash matching a known
    malicious indicator is copied, moved, renamed, or created in a new or uncommon disk location, and
    the destination path later becomes the file''s execution path. The source and destination records
    show that the same payload was repositioned to blend into a trusted or exclusion-bypassing location
    rather than installed as a normal application. Approach (Match relocated files to malicious hashes):
    Query the SIEM for file creation, rename, move, or execution events (Windows Event ID 4663, Windows
    Event ID 4688, Sysmon Event IDs 1, 11, and 23) where the SHA256 hash matches a known-malicious IOC
    list from threat intelligence. Alert on any match and preserve BOTH the original and relocated full
    paths so analysts can confirm the same payload moved between locations. Maintain a portable rule set
    for these file/process events using community detection content ([SigmaHQ](https://github.com/SigmaHQ/sigma)),
    and apply behavioral baselining of expected binary locations per [CISA/NSA Living off the Land guidance](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).
    A positive result means a payload was repositioned to a stealthier or exclusion-bypassing location
    (e.g., the same malicious hash in multiple paths, a deceptively named binary, a trusted process name
    from the wrong path, or a create-move-execute-delete lifecycle); a negative result means the observed
    file/process activity matches expected baselines for that host and software. Investigate the named
    area of interest and pivot from any hit to the originating user, parent process, source/destination
    paths, and any follow-on execution, persistence, or outbound network activity.'
