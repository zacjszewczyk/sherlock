  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Match relocated files to malicious hashes\nMATCH file_and_process_events\n\
      WHERE (sha256 IN known_malicious_iocs\n       OR filename MATCHES /(\\.(exe|scr|com)\\.[a-z]{2,4}$|svchost|lsass|RTLO|homoglyph)/\n\
      \       OR (image_name IN critical_proc_watchlist\n           AND (image_path NOT IN approved_paths[image_name]\n\
      \                OR parent_name NOT IN approved_parents[image_name])))\n  AND dest_path IN (trusted_paths\
      \ UNION av_exclusion_paths UNION persistence_paths)\nPRESERVE source_path, dest_path, parent, signer\n\
      THEN alert(severity='high')"
- question: 'Using statistical baselining, can you determine whether ''Flag rare hashes and destination
    paths indicating relocation'' indicates that an adversary has relocated malware to evade defenses?
    Specifically: For each execution/file event, compute the enterprise-wide prevalence of the file hash
    and of the destination directory over a rolling 30 days. Flag hashes present on fewer than 1% of endpoints
    (derive the exact percentile from your fleet size) or destination directories that are bottom-percentile-rare
    for that software family, since low prevalence is characteristic of non-standard relocation. Track
    Volume (file size copied), Frequency (copies/min for that hash across hosts), and State (failed copy/access-denied
    4663 events) as distinct signals; a burst of identical-hash writes to multiple paths is high-signal.
    Lexical rarity scoring of paths/names follows the stateless feature approach of [Ahmed/Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
