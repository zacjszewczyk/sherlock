- question: 'Using deterministic rule logic, can you determine whether ''Watch critical processes outside
    trusted paths'' indicates that an adversary has relocated malware to evade defenses? Specifically:
    Maintain a watchlist of critical Windows process names with their legitimate absolute path(s) AND
    legitimate parent process(es), then query process creation (Windows Event ID 4688, Sysmon Event ID
    1) where the name is on the watchlist but the image path or parent is not approved. The canonical
    example is svchost.exe not spawned by services.exe or running outside System32 ([Non-Services.exe
    Spawn Svchost.exe](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/), and
    the parent-allowlist pattern in [Unusual Parent Process For Cmd.EXE](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/)).
    Alert on any deviation: the binary is masquerading under a legitimate name from an unexpected location.'
  context: 'Tactic context (Stealth / TA0005): the adversary is trying to hide and conceal their actions
    by relocating a delivered payload so it blends into trusted locations and is separated from the events
    that first drew defender attention. Evidence under investigation: A process executes using a legitimate
    system file name such as svchost.exe or lsass.exe but from a non-standard file path where it does
    not normally reside, such as C:\Users\Public or a temporary directory. The mismatch between the filename
    and path is a strong relocation signal because the payload has been copied into a location that mimics
    trusted software while remaining executable. Approach (Watch critical processes outside trusted paths):
