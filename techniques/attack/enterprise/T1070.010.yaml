name: 'T1070.010: Indicator Removal: Relocate Malware'
id: 5d942a13-c132-4c9c-b4d7-6012a3632860
description: 'This playbook helps an analyst determine whether an adversary is relocating malware to evade
  defenses (T1070.010): copying, moving, or renaming a delivered payload into a new on-disk location to
  remove evidence, blend into the local environment, target AV/path exclusions, or stage for persistence.
  It correlates host file and process telemetry (Windows Event IDs 4660/4663/4688 and Sysmon Event IDs
  1/11/23, auditd PATH/SYSCALL, macOS unified log and osquery file_events, network device command audit)
  with network egress telemetry (Zeek conn.log/ssl.log). Investigative angles include: matching relocated
  files to known-malicious hashes and detecting the same hash appearing in multiple locations; flagging
  rare hashes and rare destination paths; deceptive filenames (high Shannon entropy, double extensions,
  typosquatting, homoglyphs, RTLO); legitimate system process names (svchost.exe, lsass.exe) executing
  from non-standard paths or with unexpected parents; the create-move-execute-delete lifecycle within
  a short window; and processes launching from AV-excluded directories making rare or anomalous outbound
  connections. Detection blends symbolic-logic rules, statistical baselining (prevalence, entropy, percentiles,
  frequency/volume/state signals), and machine learning (Random Forest/XGBoost classifiers, Isolation
  Forest, LSTM sequence models and autoencoders, provenance-graph models) to produce evasion-resistant,
  explainable alerts for the Stealth tactic.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
