- question: 'Using statistical baselining, can you determine whether ''Alert on high filename entropy''
    indicates that an adversary has relocated malware to evade defenses? Specifically: Compute Shannon
    entropy of the filename (and optionally file content) and compare to a per-environment, per-host-role
    baseline; flag the 95th percentile or higher, especially in user-writable paths. Use empirically grounded
    content-entropy bands (native ~5.0-6.5, packed ~6.8, encrypted >7.2) to corroborate ([Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989))
    and stateless lexical features (length, char-type ratios) per [Ahmed/Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
    Also track Frequency (count/min of newly created executables per directory) and State (write failures)
    to separate noisy installers from stealthy relocation.'
