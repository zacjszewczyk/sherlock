    query: "// Statistical baselining for: Flag rare hashes and destination paths indicating relocation\n\
      FOR each file/process event OVER rolling 30-90d:\n  prevalence = count_distinct_hosts(sha256) /\
      \ fleet_size\n  path_rarity = percentile_rank(dest_dir, software_family)\n  name_entropy = shannon(filename)\n\
