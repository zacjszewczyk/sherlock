      \ >= p95\n        OR burst_of_identical_hash_writes_to_multiple_paths\nTHEN alert(severity='medium',\
      \ enrich=[prevalence, path_rarity])"
- question: 'Using a machine-learning model, can you determine whether ''Score relocation via file classification
    model'' indicates that an adversary has relocated malware to evade defenses? Specifically: Deploy
    a supervised file classifier (Random Forest/XGBoost) scoring executables on section entropy, path,
    signer, name n-grams, and whether the same hash was observed in more than one location within a short
    window; static-PE entropy features reach ~98% accuracy on unseen malware ([XGBoost/RF zero-day study](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers)).
    The alert MUST surface the top-3 contributing features (e.g., multi-location hash, high entropy, rare
    signer). Correlate high-probability alerts with file creation/execution telemetry to confirm relocation
    of a newly staged payload.'
