name: 'T1036: Masquerading'
id: 040e9c6c-e6d4-415b-bd4b-20811fb392e3
description: Masquerading is a defense-evasion (Stealth) behavior in which an adversary manipulates the
  name, path, metadata, digital signature, or icon of an artifact so that malicious activity blends in
  with legitimate operating-system or application behavior. This playbook helps an analyst investigate
  whether such concealment is occurring across Windows, Linux, macOS, container, and ESXi platforms. It
  guides the hunt for renamed LOLBINs and system utilities, malicious binaries carrying the name of trusted
  system processes (e.g., svchost.exe, lsass.exe, cmd.exe) but with untrusted hashes, deceptive filenames
  using Right-to-Left-Override and double extensions, execution of system binaries from non-standard or
  user-writable directories, mismatches between an on-disk filename and the embedded PE OriginalFilename/InternalName,
  anomalous parent-child process lineages, invalid or non-Microsoft signatures on trusted binaries, and
  obfuscated command lines. Each question pairs symbolic-logic detections, statistical baselining, and
  machine-learning approaches so the analyst can confirm or refute masquerading and distinguish a single
  staging event from mass deployment.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any running processes that carry the name of a critical, commonly-masqueraded system binary
    (svchost.exe, lsass.exe, explorer.exe, services.exe, cmd.exe) executing with a file hash that matches
    a high-confidence threat-intelligence feed of known malware?
  context: Adversaries frequently name their malware after trusted Windows system binaries so it blends
    into the process list and evades casual review, directly supporting Stealth and answering whether
    masquerading is occurring. Join each process-creation hash against curated TI; a hit on a process
    named like a core system binary is a high-fidelity masquerading indicator. Per CAR-2013-05-009 enforce
    that one critical name maps to a known-good hash set and one hash maps to one name. A positive result
    warrants immediate host triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      watchlist = {svchost.exe, lsass.exe, explorer.exe, services.exe, csrss.exe, cmd.exe}

      from process_creation (WinEventLog:Security EventCode=4688 OR WinEventLog:Sysmon EventCode=1)

      | lookup ti_feed on Hashes -> ti_match

      | where lower(Image basename) in watchlist AND ti_match==true

      | alert priority=critical
- question: For each critical system-binary name (lsass.exe, csrss.exe, etc.), is an execution being observed
    whose file hash is absent from the known-good hash set built from the golden image or software inventory?
  context: Even without a TI hit, a critical system binary running with an unrecognized hash strongly
    suggests a renamed or replaced binary masquerading as the original. Maintain a per-name allowlist
    of known-good hashes (CAR-2013-05-009) and treat the first unknown-hash execution on a host as high
    priority. Track the daily count of first-seen-hash events and the unknown-to-known ratio; a host crossing
    0 -> >=1 unknown-hash critical-binary execution is the escalation trigger.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      knowngood = lookup(golden_image_hashes) keyed by binary_name

      from process_creation

      | where lower(Image basename) in critical_binaries

      | where Hashes NOT in knowngood[Image basename]

      | stats count, dc(Hashes) as new_hashes by host, Image

      | where new_hashes>=1 | alert
- question: Can a supervised model score each process-creation event for masquerading likelihood using
    process name, parent name, command-line length/entropy, enterprise hash prevalence, and a TI-hit flag,
    and surface the features that drove a high score?
  context: When symbolic and statistical rules miss novel masquerading, a tree-ensemble (Random Forest/XGBoost)
    trained on labeled process events can generalize, mirroring static-PE work reaching ~98% on unseen
    samples. Features include process/parent name, command-line length and entropy, enterprise hash prevalence
    (Volume - how many hosts have ever run this hash), and the boolean TI hit. To keep alerts actionable
    for the SOC, surface the top-3 SHAP contributors (e.g., 'hash prevalence=1 host', 'TI match=true',
    'name=lsass.exe') in the alert text.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      model = RandomForest/XGBoost(labeled process_creation)

      features = [process_name, parent_name, cmdline_len, cmdline_entropy, hash_prevalence, ti_hit]

      score = model.predict_proba(event)

      if score > threshold: alert(top3=shap(event))
- question: Do any process-creation events show filenames containing deceptive patterns such as the Right-to-Left-Override
    character (U+202E), other bidirectional/zero-width Unicode, multiple file extensions (e.g., report.pdf.exe),
    or a trailing space?
  context: These tricks make a malicious file appear to be a benign document or a different file type
    to the user and to log reviewers, a classic Stealth maneuver. A SIEM regex over NewProcessName/Image
    catches RTLO (\u202E), bidirectional/zero-width ranges (U+200B-200F, U+202A-202E), double extensions
    like \.(pdf|docx|txt|jpg)\.exe$, and trailing-space names. Cross-reference renamed signed utilities
    against the LOLBAS canonical name set. Any match is a near-certain masquerading signal.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints, email gateways, web proxies, and file shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      from process_creation

      | where Image matches /\u202E/ OR Image matches /[\u200B-\u200F\u202A-\u202E]/
          OR Image matches /\.(pdf|docx|txt|jpg)\.exe$/i
          OR Image matches / $/
      | alert priority=high
- question: Are processes executing with names that are near-misses (high string similarity but not identical)
    to critical system process names, indicating typosquatting like svch0st.exe?
  context: 'Typosquatted binary names (svch0st.exe, scvhost.exe) fool quick visual inspection while evading
    exact-match allowlists. Compute Levenshtein or Jaro-Winkler distance between each new process basename
    and the critical-name list; flag those with high similarity but not exact (Jaro-Winkler > 0.95 and
    < 1.0) for review. Also profile the failure mode: count typosquat executions blocked by AppLocker/WDAC
    per host/day as a distinct escalation signal showing attempted but denied masquerading.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints, email gateways, web proxies, and file shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      crit = [svchost.exe, lsass.exe, services.exe, explorer.exe, csrss.exe]

      from process_creation

      | eval sim = max(jaro_winkler(basename(Image), c) for c in crit)

      | where sim > 0.95 AND sim < 1.0

      | alert ; also stats count by host where blocked_by=AppLocker
- question: Can a character-level model classify new filenames as suspicious versus benign, catching deceptive
    naming patterns that fixed regex rules miss, with the contributing character n-grams reported?
  context: Adversaries continually invent new deceptive naming schemes that static regex cannot anticipate.
    A character-level CNN trained on benign vs malicious filenames, or learned command/string embeddings
    (CrowdStrike BERT approach), generalizes from character-sequence patterns. Classify each new filename
    and, for explainability, report the top-3 contributing character n-grams/tokens in the alert so an
    analyst can judge why a name was flagged.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints, email gateways, web proxies, and file shares'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      model = CharCNN(train=benign+malicious filenames)

      label = model.classify(basename(Image))

      if label=='suspicious': alert(top3_ngrams=explain(Image))
- question: Is any process named like a critical system binary (svchost.exe, powershell.exe) executing
    from a path that is NOT its standard expected directory (e.g., not C:\Windows\System32\)?
  context: Legitimate system binaries always run from fixed locations; the same name executing from C:\Users\,
    C:\ProgramData, C:\Temp, or C:\Perflogs is a hallmark of masquerading. Maintain a strict name-to-path
    allowlist seeded from LOLBAS canonical paths and alert when the name is on the list but the path is
    not allowed. This is high-confidence and low-noise for true system binaries.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints (workstations, servers), especially user-writable directories (e.g.,
    C:\Users\*, C:\ProgramData, C:\Temp, C:\Perflogs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      allow = {svchost.exe:'C:\\Windows\\System32\\', powershell.exe:'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\'}

      from process_creation

      | where basename(Image) in keys(allow) AND dirpath(Image) != allow[basename(Image)]

      | alert priority=high
- question: For each critical process name, is an execution occurring from a path in the bottom 1st percentile
    of that name's execution-path frequency across the enterprise over a 30-day baseline?
  context: A frequency distribution of execution paths per binary name (host-centric baselining, Beehive)
    reveals rare staging locations even when the path is not explicitly forbidden. Alert when a binary
    runs from a path in the bottom 1st percentile for that name. Add Volume/Frequency context - distinct
    hosts running from the anomalous path and executions/min - to distinguish a single staging event from
    mass deployment of masqueraded binaries.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints (workstations, servers), especially user-writable directories (e.g.,
    C:\Users\*, C:\ProgramData, C:\Temp, C:\Perflogs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = stats count by Image_name, path over 30d -> freq

      from process_creation

      | where pct_rank(freq[Image_name][path]) < 0.01

      | stats count, dc(host) as hosts, rate by Image_name, path | alert
- question: Can an anomaly model isolate small dense clusters of system binaries executing from anomalous
    locations using path-derived features (directory depth, user names in path, Temp/Public/tmp/dev-shm
    tokens, writable-location flag)?
  context: Isolation Forest or DBSCAN over path features surfaces masquerading staging that hides in the
    long tail (e.g., rundll32.exe from C:\Users\Public\Music\). Engineered features include directory
    depth, presence of a username in the path, presence of writable-location tokens, and a writable flag.
    Surface the top-3 features that isolated the anomaly (path depth, writable flag, user-in-path) so
    the analyst understands the verdict.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints (workstations, servers), especially user-writable directories (e.g.,
    C:\Users\*, C:\ProgramData, C:\Temp, C:\Perflogs)'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      X = features(path: depth, has_username, temp_public_tmp_token, writable_flag)

      model = IsolationForest()/DBSCAN()

      score = model.fit_predict(X)

      if anomaly(score): alert(top3=explain(path))
- question: Does any running process have an on-disk filename whose basename does not match the OriginalFilename/InternalName
    embedded in its PE metadata, especially for sensitive utilities (powershell.exe, cmd.exe, rundll32.exe,
    certutil.exe, mshta.exe, psexec)?
  context: 'Because the embedded OriginalFileName survives a rename on disk, comparing it to the actual
    filename is a rename-proof way to catch renamed LOLBINs - a core masquerading technique. Configure
    Sysmon to collect PE header fields and apply the SigmaHQ renamed-binary logic: alert when basename(Image)
    != OriginalFileName and OriginalFileName is a sensitive utility. This works entirely on first-party
    Sysmon Event ID 1.'
  answer_sources:
  - Sysmon Event ID 1
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      sensitive = {powershell.exe, cmd.exe, rundll32.exe, certutil.exe, mshta.exe, psexec.exe}

      from Sysmon EventCode=1

      | where lower(OriginalFileName) in sensitive AND lower(basename(Image)) != lower(OriginalFileName)

      | alert priority=high
- question: Are newly observed or rare (Image basename, OriginalFileName, InternalName) triplets appearing,
    or is a single OriginalFileName mapping to more than one on-disk name?
  context: 'Baselining the observed name triplets and their enterprise frequency exposes renaming even
    for utilities not on the sensitive list. Alert on first-seen triplets or those below a frequency threshold
    (CAR-2013-05-009 one-hash-one-name corollary). Track cardinality: when the number of distinct on-disk
    names mapping to one OriginalFileName exceeds 1, renaming is occurring - a direct masquerading signal.'
  answer_sources:
  - Sysmon Event ID 1
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      from Sysmon EventCode=1

      | stats count, dc(basename(Image)) as name_card by OriginalFileName, InternalName

      | where triplet_is_new OR freq < threshold OR name_card > 1

      | alert
- question: Can a tree ensemble score processes for masquerading using PE-header and execution features
    including boolean name-match flags (Image==OriginalFileName, Image==InternalName), signer, section
    entropy, and imports?
  context: A supervised tree ensemble (XGBoost/RF) trained on PE-header plus execution features captures
    renamed-binary masquerading that rigid rules miss, including the boolean mismatches between disk name
    and embedded names, the signer, section entropy, and import table. Emit the top-3 SHAP contributors
    per alert so the analyst can validate the model's reasoning.
  answer_sources:
  - Sysmon Event ID 1
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      features = [Image==OriginalFileName, Image==InternalName, signer, section_entropy, imports]

      model = XGBoost/RandomForest(labeled)

      if model.score(event) > threshold: alert(top3=shap(event))
- question: Is a system process being spawned by a forbidden parent (e.g., winword.exe -> powershell.exe,
    outlook.exe -> cmd.exe, non-wininit.exe -> lsass.exe, non-services.exe -> svchost.exe)?
  context: The Windows boot/service process tree is immutable; deviations indicate injection or a masqueraded
    process pretending to be a core service. Codify forbidden parent-child pairs (Elastic Unusual Parent-Child,
    Splunk Non-Services.exe Spawning Svchost.exe) and alert on any match. Office or mail clients spawning
    shells, or core services spawned by the wrong parent, are high-confidence indicators tied directly
    to Stealth.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints, especially user workstations and application servers running software
    like Microsoft Office or Adobe Reader.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      forbidden = [(winword.exe,powershell.exe),(outlook.exe,cmd.exe),(NOT wininit.exe,lsass.exe),(NOT
      services.exe,svchost.exe)]

      from process_creation

      | where (ParentImage, Image) matches forbidden

      | alert priority=high
- question: Over a 30-day baseline, are parent-child pairs occurring whose conditional probability P(Child|Parent)
    is below a very low threshold or that are first-seen?
  context: Modeling P(Child|Parent) (CAR-2014-11-002 outlier parents) catches anomalous lineages beyond
    the hard-coded forbidden list. Alert when probability < 0.01% or the pair is first-seen for the environment.
    Add Frequency/Volume - edges/min and distinct child instances - to separate a one-off masquerading
    event from automated, repeated abuse.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints, especially user workstations and application servers running software
    like Microsoft Office or Adobe Reader.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = P(child|parent) over 30d

      from process_creation

      | where P(Image|ParentImage) < 0.0001 OR pair_first_seen

      | stats count, dc(child_pid) by ParentImage, Image | alert
- question: Can a graph-anomaly model (ProblemChild-style supervised XGBoost fused with parent-child edge-rarity)
    flag low-weight edges connecting otherwise disconnected process communities, e.g., an Office app reaching
    a system tool?
  context: ProblemChild combines a supervised classifier over command/process features with unsupervised
    edge-rarity in the process graph. Rare edges linking normally separate communities (Office application
    -> system tool) reveal masquerading or injection lineages invisible to simple pair lists. Report the
    top-3 contributing features (edge rarity, child command tokens, parent identity) in the alert for
    analyst validation.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All enterprise endpoints, especially user workstations and application servers running software
    like Microsoft Office or Adobe Reader.'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      graph = build_process_graph(parent->child edges)

      edge_rarity = unsupervised(graph)

      clf = XGBoost(command+process features)

      if clf.score + edge_rarity high: alert(top3=[edge_rarity, child_tokens, parent_id])
- question: Is any process named like a critical Microsoft-signed binary (lsass.exe, winlogon.exe, explorer.exe)
    running while unsigned, with an invalid signature, or signed by a publisher other than an authorized
    Microsoft signer?
  context: Genuine Microsoft system binaries carry valid Microsoft signatures; a same-named process that
    is unsigned or signed by another publisher is almost certainly a masqueraded impostor. Using Sysmon
    Event ID 1, check the SignatureStatus and Signature of processes on the critical-binary list (seeded
    from LOLBAS canonical metadata) and alert on anything other than Valid/authorized-Microsoft-signer.
    This is a high-fidelity Stealth detection.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints (workstations, servers), code signing servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      crit = {lsass.exe, winlogon.exe, csrss.exe, services.exe, explorer.exe}

      from Sysmon EventCode=1

      | where lower(basename(Image)) in crit AND (SignatureStatus != 'Valid' OR Signature NOT in authorized_ms_signers)

      | alert priority=critical
- question: For binaries almost always signed by Microsoft (>99.9% of instances), is a new non-Microsoft
    signer or an unsigned execution appearing, and how many signature-validation failures occur per host/day?
  context: Baselining (Process Name, Signer) pairs (Beehive) lets you flag when a normally-Microsoft-signed
    process suddenly appears with a new signer or unsigned - indicating replacement or masquerading. Explicitly
    count signature-validation failures and unsigned-execution attempts per host/day as a distinct failure-mode
    signal, separate from valid-but-rare signers, to catch evasion attempts in progress.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints (workstations, servers), code signing servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = stats by ProcessName, Signer -> ms_ratio

      from process_creation

      | where ms_ratio[ProcessName] > 0.999 AND (Signer new_nonMS OR is_signed==false)

      | stats count(sig_fail), count(unsigned) by host | alert
- question: Can a classifier flag executions where the combination of process_name, is_signed, signature_status,
    signer_name, signer prevalence, and section entropy is anomalous, such as a technically valid but
    rarely-seen signer on a critical process?
  context: A Naive Bayes baseline or Isolation Forest unsupervised scorer over signature and PE features
    catches subtle masquerading - e.g., a valid signature from an unusual signer on a critical process,
    which rule logic would pass. Flag anomalous feature combinations and surface the top-3 driving features
    (SHAP/LIME) in the alert so the analyst can decide whether the rare signer is legitimate.
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All enterprise endpoints (workstations, servers), code signing servers'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      features = [process_name, is_signed, signature_status, signer_name, signer_prevalence, section_entropy]

      model = NaiveBayes / IsolationForest

      if anomalous(model.score(event)): alert(top3=explain(event))
- question: Are common system utilities (powershell.exe, rundll32.exe, certutil.exe) being run with command
    lines containing known obfuscation or LOLBAS abuse indicators (-enc, -encodedcommand, FromBase64String,
    -e bypass -noprofile -w hidden, certutil -urlcache)?
  context: Masquerading often pairs a trusted utility name with hidden, encoded instructions. A SIEM rule
    scanning CommandLine/ProcessCommandLine for encoding flags, Base64 decode calls, hidden-window/bypass
    switches, and LOLBAS download patterns (catalogued by the LOLBAS Project) catches the abusive intent
    behind a legitimately-named binary. Matches indicate the trusted utility is being weaponized under
    cover of normalcy.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek http.log
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      from process_creation

      | where CommandLine matches /-enc|-encodedcommand|FromBase64String|-e\s+bypass|-noprofile|-w\s+hidden|certutil.*-urlcache/i

      | alert priority=high
- question: For each key utility (powershell.exe, cmd.exe, cscript.exe), is a new execution exceeding
    the 98th percentile of its per-process baseline for command-line length or Shannon entropy?
  context: Encoded/obfuscated commands are abnormally long and high-entropy relative to a utility's normal
    usage. Build per-utility baselines for command-line length and Shannon entropy and alert when an execution
    crosses the 98th percentile for that specific utility (Elastic high command-line entropy). Track Volume
    (arg byte count) and Frequency (encoded-command executions/min/host) to gauge scale of the masquerading
    activity.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek http.log
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline = per-utility pctl(cmdline_len), pctl(shannon_entropy) over 30d

      from process_creation

      | where len(CommandLine) > p98_len[util] OR entropy(CommandLine) > p98_entropy[util]

      | stats count, sum(arg_bytes), rate by host, util | alert
- question: Can a gradient-boosted model classify obfuscated command lines using interpretable features
    (special-character counts, character entropy, non-alphanumeric ratio, token statistics, keyword presence),
    or BERT embeddings fed to unsupervised detectors, with top contributing features reported?
  context: Mandiant's obfuscated-command-line ML and CrowdStrike's BERT command-line embeddings detect
    obfuscation that signatures miss. Train a GBDT on interpretable features or score BERT embeddings
    with COPOD/Isolation Forest/PCA/autoencoders. Report the top-3 contributing features/tokens per alert
    so the analyst can confirm the command is truly obfuscated rather than merely long, supporting confident
    Stealth detection.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek http.log
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      features = [special_char_count, char_entropy, nonalnum_ratio, token_stats, keyword_presence]

      model = GBDT(labeled) OR unsupervised(BERT_embeddings: COPOD/IsolationForest/PCA/AE)

      if score>threshold: alert(top3=explain(CommandLine))
- question: Can clustering of TF-IDF-vectorized command lines group benign administrative activity and
    isolate small outlier clusters of anomalous commands for investigation?
  context: K-Means/DBSCAN over TF-IDF-vectorized command lines groups similar activity; benign admin commands
    form large dense clusters while masquerading/obfuscated usage forms small outliers worth investigation.
    Pair with embedding-based outlier scoring (CrowdStrike BERT) to improve separation. Outlier clusters
    that differ markedly from known-good administrative clusters merit analyst review.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Zeek http.log
  - 'NAI: All Enterprise Endpoints (Workstations and Servers), Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: >-
      X = TFIDF(command_lines)

      clusters = KMeans/DBSCAN(X)

      small_outlier_clusters = clusters where size < min_size AND dist_to_benign high

      alert(small_outlier_clusters)
