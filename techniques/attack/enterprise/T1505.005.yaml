questions:
- question: '[Persistence] Alert on ServiceDll pointer change: Can you determine whether terminal Services
    service DLL telemetry shows replacement or modification of `termsrv.dll` (or an alternate `ServiceDll`)
    with binaries that are malicious, rare, or highly suspicious, indicating persistence via compromised
    RDP service components. -- specifically by applying the ''Alert on ServiceDll pointer change'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Microsoft Terminal
    Services / Remote Desktop Services components -- most notably the Terminal Services DLL (termsrv.dll)
    and its ServiceDll registry pointer in HKLM\System\CurrentControlSet\services\TermService\Parameters\
    -- to achieve persistent and often enhanced RDP access (for example, enabling concurrent sessions
    via a patched termsrv.dll or RDP Wrapper). This evidence focuses on the condition that terminal Services
    service DLL telemetry shows replacement or modification of `termsrv.dll` (or an alternate `ServiceDll`)
    with binaries that are malicious, rare, or highly suspicious, indicating persistence via compromised
    RDP service components. This Symbolic Logic approach implements the following: Alert on ANY write
    to `HKLM\System\CurrentControlSet\services\TermService\Parameters\ServiceDll` (Windows Event ID 4657
    / Sysmon Event ID 13) and on any resolved value other than `%SystemRoot%\System32\termsrv.dll`, per
    the production Sigma RDP-tampering rule that explicitly flags this key as RDP hijacking RDP Sensitive
    Settings Changed (Sigma). A positive result -- a rule match, statistical outlier, or model alert --
    indicates that the Terminal Services service DLL, its on-disk binary, the modifying process chain,
    or the resulting RDP session state has deviated from the trusted baseline; pivot to the responsible
    process and its parent lineage, the user and host context, the integrity/signature of the loaded module,
    and any concurrent or anomalous RDP sessions that follow. A negative result helps rule out this Terminal
    Services DLL persistence vector for the window examined but should be corroborated with the other
    questions in this playbook, since a single method can miss a stealthy in-memory patch, a signed-but-trojanized
    DLL, or living-off-the-land administrative tooling.'
  answer_sources:
  - Windows Event ID 4657
  - Windows Event ID 4663
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - Sysmon Event ID 25
  - Windows Defender Event ID 1116
  - 'NAI: File systems and registries of all Windows endpoints and servers, especially Remote Desktop
    Gateway servers and multi-user session hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Alert on ServiceDll pointer change

      source IN [Windows Event ID 4657, Windows Event ID 4663, Sysmon Event ID 7, Sysmon Event ID 11,
      Sysmon Event ID 25, Windows Defender Event ID 1116]

      | where matches_condition_for(''Alert on ServiceDll pointer change'')  // Alert on ANY write to
      `HKLM\System\CurrentControlSet\services\TermService\Parameters\ServiceDll` (Windows Event ID 4657
      / Sysmon Event ID 13

      | where modifying_process NOT IN trusted_updater_allowlist (TrustedInstaller, Windows Update, SCCM/Intune)

      | alert'
