name: 'T1505.005: Terminal Services DLL'
id: e54f703c-26d4-4ddd-b452-25a3e0d00c85
description: 'This playbook helps an analyst investigate whether an adversary has achieved persistence
  by abusing Microsoft Terminal Services / Remote Desktop Services components on Windows -- specifically
  by modifying or replacing the Terminal Services DLL (termsrv.dll) or redirecting the ServiceDll registry
  value under HKLM\System\CurrentControlSet\services\TermService\Parameters\ to load an arbitrary or patched
  DLL (e.g., RDP Wrapper) that enables persistent and enhanced RDP access. It guides the hunt across several
  behavioral angles: registry tampering with the ServiceDll pointer and on-disk overwrite/patch of termsrv.dll;
  the module actually loaded by the svchost.exe -k termsvcs process (signer, path, and hash allowlisting
  plus TI hash matching against known-bad such as rdpwrap.dll); the documented administrative patch sequence
  (takeown -> icacls -> sc/net stop TermService -> file overwrite -> sc start, and reg add against ServiceDll)
  and the parentage of the termsvcs service host; statistical prevalence, size/entropy, and rarity analysis
  of the loaded DLL and modifying processes; and the downstream effect of multiple concurrent interactive
  RDP sessions (Logon Type 10) on client SKUs or anomalous session spikes on servers. Detection methods
  combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning models (static
  PE classification, sequence models, isolation forests, and provenance-graph reconstruction) applied
  to Windows Security events (4657/4663/4688/4624/4625/4634/4778/4779), Sysmon (1/7/11/13/25), Windows
  Defender (1116), and Zeek conn.log, so the analyst can corroborate suspected Terminal Services DLL persistence
  against registry/file integrity, module provenance, process lineage, and RDP session context.'
