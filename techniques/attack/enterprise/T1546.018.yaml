questions:
- question: '[Persistence] Detect suspicious modification of Python customization modules: Can you determine
    whether creation or modification of Python startup hook files (sitecustomize.py, usercustomize.py)
    in directories that are searched during Python initialization, resulting in code execution whenever
    Python is invoked on the host. -- specifically, using the ''Detect suspicious modification of Python
    customization modules'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Python''s startup
    mechanisms -- path configuration (.pth) files and the sitecustomize.py / usercustomize.py modules
    that the interpreter auto-loads at initialization -- so attacker code runs every time Python is invoked,
    giving durable persistence (and, where system-wide or privileged interpreters are involved, elevated
    execution). This evidence focuses on the condition that creation or modification of Python startup
    hook files (sitecustomize.py, usercustomize.py) in directories that are searched during Python initialization,
    resulting in code execution whenever Python is invoked on the host. This Symbolic Logic approach looks
    for the following signal: Monitor file create/write events for `sitecustomize.py` and `usercustomize.py`
    across all interpreter-searched locations enumerated in the [Python `site` module documentation](https://docs.python.org/3/library/site.html)
    (system-wide `site-packages`/`dist-packages`, the per-user site directory from `site.getusersitepackages()`,
    and Windows `Lib\site-packages`). On Windows use EID 4663/4656 (object access) and EID 4657 (registry
    not applicable here); on Linux use auditd PATH watches and Sysmon-for-Linux EID 11; on macOS use Endpoint
    Security file events. Capture the responsible user and process via [Wazuh File Integrity Monitoring](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html)
    whodata and correlate the writer to process creation (EID 4688 / Sysmon EID 1 / auditd execve). Flag
    writes performed by non-package-manager processes (command shells, downloaders, archivers, editors)
    — mirror the package-manager allowlist (dnf, pacman, podman, dockerd, restic, kaniko, pip/conda) used
    by the [Elastic Python Path File (pth) Creation rule](https://detection.fyi/elastic/detection-rules/linux/persistence_pth_file_creation/)
    — and any write of a customize module to a system-wide directory by a non-administrative account.
    Apply [SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma) process-lineage rules
    for the python interpreter spawning shells/network tools shortly after. Content signal: inspect the
    written file (report_changes diff) for obfuscated/base64 payloads as in [Volexity CVE-2024-3400](https://www.volexity.com/blog/2024/04/12/zero-day-exploitation-of-unauthenticated-remote-code-execution-vulnerability-in-globalprotect-cve-2024-3400/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that a Python
    startup hook may have been planted or triggered on the host; pivot to the responsible writer process
    and its lineage, the user/privilege context, the exact hook file and its contents (look for import-prefixed
    lines or base64 payloads), and any subsequent interpreter executions, child processes, or outbound
    connections. A negative result helps rule out this persistence vector for the window examined but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-volume, or living-off-the-land hook abuse.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Windows Event ID 4656
  - auditd:SYSCALL (execve)
  - auditd:PATH (file write/create)
  - Sysmon for Linux Event ID 11
  - macOS Unified Logs (Endpoint Security file events)
  - 'NAI: Endpoints and servers where Python is installed or commonly used (automation hosts, admin workstations,
    CI/CD runners); Python installation directories and per-user Python paths; user profile directories;
    software deployment locations; high-value servers where scheduled automation or maintenance scripts
    run.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Detect suspicious modification of Python customization modules\nsource IN [Windows Event\
      \ ID 4688, Windows Event ID 4663, Windows Event ID 4656, auditd:SYSCALL (execve), auditd:PATH (file\
      \ write/create), Sysmon for Linux Event ID 11, macOS Unified Logs (Endpoint Security file events)]\n\
      | WHERE matches_action_criteria(\"Detect suspicious modification of Python customization modules\"\
      )\n// Monitor file create/write events for `sitecustomize.py` and `usercustomize.py` across all\
      \ interpreter-searched locations enumerated in the Python `site` module \n| ALERT enrich(host, user,\
      \ process, parent, hook_file, file_content, child_proc, dest)"
- question: '[Persistence] Baseline who writes to Python library paths and alert on rare writers: Can
    you determine whether creation or modification of Python startup hook files (sitecustomize.py, usercustomize.py)
    in directories that are searched during Python initialization, resulting in code execution whenever
    Python is invoked on the host. -- specifically, using the ''Baseline who writes to Python library
    paths and alert on rare writers'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Python''s startup
    mechanisms -- path configuration (.pth) files and the sitecustomize.py / usercustomize.py modules
    that the interpreter auto-loads at initialization -- so attacker code runs every time Python is invoked,
    giving durable persistence (and, where system-wide or privileged interpreters are involved, elevated
    execution). This evidence focuses on the condition that creation or modification of Python startup
    hook files (sitecustomize.py, usercustomize.py) in directories that are searched during Python initialization,
    resulting in code execution whenever Python is invoked on the host. This Statistical Method approach
    looks for the following signal: Over >=30 days build per-host/per-user baselines of (a) accounts that
    legitimately modify Python library directories, (b) maintenance windows, and (c) legitimate parent/writer
    processes. Apply mean+k*sigma thresholds per [Finding Anomalies in Windows Event Logs Using Standard
    Deviation, Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf) and
    fleet-wide prevalence per [Using Frequency Analysis to Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)
    to surface first-seen (writer, directory) tuples and rare customize-module hashes/filenames. Quantify
    the physics: Volume (bytes written / file length — a benign customize module is tiny, an injected
    loader is large), Frequency (customize-module changes per host per day; interpreter launches per minute
    after the write), and State (write success/fail, interpreter exit code). Alert when writes fall outside
    normal windows, by a writer above the 99th historical-frequency percentile, or with anomalous Volume.
    Track failure modes separately: count NXDOMAIN/404/blocked egress from the interpreter after a hook
    change. A positive result -- a rule match, statistical outlier, or model alert -- indicates that a
    Python startup hook may have been planted or triggered on the host; pivot to the responsible writer
    process and its lineage, the user/privilege context, the exact hook file and its contents (look for
    import-prefixed lines or base64 payloads), and any subsequent interpreter executions, child processes,
    or outbound connections. A negative result helps rule out this persistence vector for the window examined
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-volume, or living-off-the-land hook abuse.'
