name: 'T1546.018: Event Triggered Execution: Python Startup Hooks'
id: d20de664-3f72-4fd9-8c55-ac4e9a07bbbb
description: 'This playbook helps an analyst investigate whether an adversary has abused Python startup
  hooks (T1546.018) -- path configuration (.pth) files and the sitecustomize.py / usercustomize.py modules
  that the interpreter automatically loads at initialization -- to execute arbitrary code whenever Python
  runs, establishing persistence and, where system-wide or privileged interpreters are involved, privilege
  escalation. It guides the hunt across several behavioral angles on Linux, macOS, and Windows: creation
  or modification of sitecustomize.py / usercustomize.py and .pth files in system-wide site-packages/dist-packages,
  per-user site directories, and framework paths; inspection of written hook content for import-prefixed
  lines or obfuscated/base64 loader payloads (as in Volexity CVE-2024-3400); correlation of the writer
  to its process lineage and logon/privilege context; Python interpreter executions immediately followed
  by unexpected child processes or outbound connections; elevated (SYSTEM/root) writes to system-wide
  hook locations enabling broad or privileged execution; user-scope plants that later trigger under a
  privileged interpreter; and lateralized persistence across multiple profiles. Detection methods combine
  symbolic-logic rules, statistical baselining/prevalence analysis, and machine-learning models (Isolation
  Forest, DeepLog sequence modeling, and whole-system provenance graph learning such as KAIROS/ThreaTrace/MAGIC)
  applied to Windows Security/Sysmon events, auditd SYSCALL/PATH records, Sysmon-for-Linux, macOS Unified/Endpoint
  Security logs, Wazuh FIM who-data, and Zeek network telemetry, so the analyst can corroborate suspected
  hook abuse against file writes, interpreter execution, privilege context, and egress.'
type: technique
