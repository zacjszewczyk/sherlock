- question: '[Privilege Escalation] Correlate elevated contexts with startup-hook writes and subsequent
    python runs: Can you determine whether a Python startup hook is placed or modified in a system-wide
    location and then python is invoked by a privileged process or service account, resulting in elevated
    execution of the hook code. -- specifically, using the ''Correlate elevated contexts with startup-hook
    writes and subsequent python runs'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), an adversary abuses Python''s
    startup mechanisms -- path configuration (.pth) files and the sitecustomize.py / usercustomize.py
    modules that the interpreter auto-loads at initialization -- so attacker code runs every time Python
    is invoked, giving durable persistence (and, where system-wide or privileged interpreters are involved,
    elevated execution). This evidence focuses on the condition that a Python startup hook is placed or
    modified in a system-wide location and then python is invoked by a privileged process or service account,
    resulting in elevated execution of the hook code. This Symbolic Logic approach looks for the following
    signal: Identify privileged sessions (EID 4672 on Windows; uid=0/euid=0 via auditd on Linux/macOS)
    and track writes (EID 4663/4656 or auditd PATH) to system-wide startup-hook artifacts (`sitecustomize.py`/`usercustomize.py`/`.pth`)
    in the directories defined by the [Python `site` module documentation](https://docs.python.org/3/library/site.html),
    using the [Elastic Python Path File (pth) Creation rule](https://detection.fyi/elastic/detection-rules/linux/persistence_pth_file_creation/)
    path globs/allowlist. Then detect subsequent python executions (EID 4688 / Sysmon EID 1 / auditd execve)
    by privileged principals (service/admin accounts) and correlate to immediate outbound connections
    (Zeek conn.log / Sysmon EID 3). Flag the sequence: privileged write -> python run by privileged principal
    -> suspicious network/child ([SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma)
    lineage rules). Inspect `.pth` for `import`+base64 per [Volexity CVE-2024-3400](https://www.volexity.com/blog/2024/04/12/zero-day-exploitation-of-unauthenticated-remote-code-execution-vulnerability-in-globalprotect-cve-2024-3400/);
    capture who-data with [Wazuh File Integrity Monitoring](https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that a Python
    startup hook may have been planted or triggered on the host; pivot to the responsible writer process
    and its lineage, the user/privilege context, the exact hook file and its contents (look for import-prefixed
    lines or base64 payloads), and any subsequent interpreter executions, child processes, or outbound
    connections. A negative result helps rule out this persistence vector for the window examined but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-volume, or living-off-the-land hook abuse.'
