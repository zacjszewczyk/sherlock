name: 'T1007: System Service Discovery'
id: cf20759f-0b67-4b22-abb4-057a5bdb12db
description: This playbook helps an analyst investigate System Service Discovery (T1007), in which an
  adversary enumerates registered local services, daemons, and scheduled tasks to orient themselves after
  gaining a foothold. It guides triage of built-in service-enumeration utilities on Windows (sc.exe, net.exe,
  tasklist.exe, query.exe, wmic, and PowerShell/WMI cmdlets such as Get-Service and Get-WmiObject Win32_Service),
  Linux (systemctl, service --status-all, chkconfig, initctl, crontab, and reads of /etc/init.d and /etc/systemd/system),
  and macOS (launchctl list/print, systemsetup, ps | grep com.apple., and reads of LaunchDaemons/LaunchAgents).
  It covers deterministic command-line and script-block matching, anomalous parent-child spawn detection,
  per-host rare-argument and frequency/burst baselining, entropy and n-gram rarity scoring, supervised
  command-line and script classifiers, provenance-graph and sequence/HMM anomaly modeling, and correlation
  of service discovery with follow-on discovery (T1018, T1049) and lateral movement (T1021) to expose
  internal reconnaissance before the adversary acts on it.
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which Windows hosts show built-in service- or task-enumeration utilities (sc.exe, net.exe,
    tasklist.exe, query.exe, wmic service) being run with broad-reconnaissance arguments, and is the output
    being redirected or piped for collection?
  context: 'During the Discovery tactic an adversary leans on living-off-the-land binaries to inventory
    services without dropping new tooling. Match Windows Event ID 4688 / Sysmon Event ID 1 command lines
    against known T1007/LOLBAS enumeration patterns: `sc query` (especially `type= service state= all`),
    `sc queryex`, `net start`, `tasklist /svc`, `tasklist /v`, `query.exe`, and `wmic service`. Deploy
    the corresponding SigmaHQ process_creation rules as the deterministic floor. Raise severity when output
    is redirected to a file (`>`, `>>`, `| Out-File`, `Tee-Object`) or piped to `findstr`/`find`, which
    indicates bulk collection for staging rather than a one-off admin check. A positive hit on a workstation,
    domain controller, or application server with redirection is a strong reconnaissance signal; an isolated
    interactive admin invocation is likely benign.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and Application Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:Security EventCode=4688, Sysmon EventCode=1)

      | where match(CommandLine, /(?i)(sc\.exe\s+query|sc\s+queryex|net\s+start|tasklist\s+\/(svc|v)|query\.exe|wmic\s+service)/)

      | eval staging = match(CommandLine, /(?i)(>|>>|Out-File|Tee-Object|\|\s*find(str)?)/)

      | eval severity = if(staging OR match(CommandLine,/(?i)state=\s*all/), "high", "medium")

      | table _time, host, User, ParentImage, Image, CommandLine, severity'
- question: On each Windows host, does the observed argument string for sc.exe, net.exe, tasklist.exe,
    or query.exe fall into the rarest 1% of historically seen argument vectors for that host or its peer
    group?
  context: Service-enumeration binaries are common, so presence alone is weak; context is what matters.
    Following Red Canary's context-over-presence guidance, maintain a 30-90 day per-host and per-peer-group
    frequency table of full argument strings for sc.exe, net.exe, tasklist.exe, and query.exe. Alert when
    an observed argument vector falls in the bottom 1% of historical frequency for that host or peer group,
    and augment with character/token n-gram rarity scoring (NgViz-style) to catch automated or obfuscated
    argument strings. The alert must surface the top-3 contributing features (the rare argument token,
    whether redirection is present, and low peer-group prevalence) so an analyst can triage quickly. A
    rare argument vector on an otherwise quiet host suggests scripted or hands-on-keyboard reconnaissance;
    a common vector matching the host's baseline is expected administration.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and Application Servers.'
  range: Last 90 days (baseline 30-90 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source EventCode=4688 Image IN (sc.exe,net.exe,tasklist.exe,query.exe)

      | stats count by host, peer_group, CommandLine

      | eventstats sum(count) as total by host

      | eval freq = count/total

      | eval ngram_rarity = ngram_score(CommandLine)

      | where freq < 0.01 OR ngram_rarity > p95

      | eval top_features = mvappend("rare_arg_token","redirection","low_peer_prevalence")

      | table host, CommandLine, freq, ngram_rarity, top_features'
- question: Does a supervised command-line classifier score any Windows service-discovery command line
    as malicious, and which interpretable features drove that score?
  context: 'To add parallel coverage beyond static strings, train a logistic-regression or gradient-boosted
    classifier on labeled benign vs. malicious command lines using interpretable features: command length,
    argument count, special-character ratio, redirection flags, token n-gram TF-IDF, and parent-process
    prevalence. Surface the top-3 SHAP/coefficient contributors in each alert so triage is explainable,
    consistent with provenance-learning detectors such as ThreaTrace. Keep the deterministic SigmaHQ string
    rules running in parallel as a floor — the model only adds coverage for novel or obfuscated variants
    it has learned to generalize. A high model score with corroborating features (e.g., high special-character
    ratio plus an unusual parent) warrants investigation; a low score on a clearly benign admin command
    is expected.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and Application Servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = load("cmdline_clf")

      events = source EventCode=4688 Image IN (sc.exe,net.exe,tasklist.exe,query.exe,wmic.exe)

      features = extract(len, arg_count, special_char_ratio, redirection_flag, ngram_tfidf, parent_prevalence)

      score, contributors = model.predict_proba(features), model.shap(features)

      | where score > 0.8

      | table host, CommandLine, score, top3(contributors)'
- question: Is a service-discovery utility (sc.exe, tasklist.exe, net.exe, wmic) being spawned by a parent
    process that is not on the allowlist of legitimate parents — for example winword.exe, excel.exe, outlook.exe,
    w3wp.exe, mshta.exe, or wscript.exe?
  context: 'Enumeration spawned from an unexpected parent is a hallmark of post-exploitation: a phished
    Office document, an exploited web server, or a script interpreter launching discovery binaries. Build
    and maintain an allowlist of legitimate parents for sc.exe, tasklist.exe, net.exe, and wmic (e.g.,
    explorer.exe -> cmd.exe/powershell.exe, services.exe, or sanctioned management agents). Alert on any
    spawn outside the allowlist, explicitly flagging winword.exe, excel.exe, outlook.exe, w3wp.exe, mshta.exe,
    and wscript.exe as parents, per Elastic''s unusual parent-child relationship modeling and Red Canary
    LOLBins guidance. A discovery binary parented by an Office app or web server process is a high-confidence
    lead; a spawn from cmd.exe under an interactive admin session is likely benign.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Web Servers, and Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source EventCode=4688 Image IN (sc.exe,tasklist.exe,net.exe,wmic.exe)

      | where NOT (ParentImage IN allowlist[Image])

      | eval flagged_parent = ParentImage IN (winword.exe,excel.exe,outlook.exe,w3wp.exe,mshta.exe,wscript.exe)

      | eval severity = if(flagged_parent,"high","medium")

      | table host, ParentImage, Image, CommandLine, severity'
- question: For each Windows parent process, how rare is it historically for that parent to spawn a service-discovery
    utility, and did the spawned process succeed or fail?
  context: Allowlists miss novel-but-rare parentage, so score it probabilistically. For each parent process
    name on a host, compute the historical conditional probability P(child|parent) of it spawning a service-discovery
    utility over a 30-day baseline, applying the context-over-presence principle. Alert when P(child|parent)
    < 0.001 (derive the threshold per environment from the empirical distribution). Also record whether
    the spawned process exited 0 (success) versus non-zero/blocked (the State dimension) and the spawns/min
    from that parent (Frequency). Include the observed probability and the top-3 rarest attributes in
    the alert. A very low conditional probability combined with rapid repeated spawns or a burst of access-denied
    exits points to automated reconnaissance; a routine high-probability pairing is normal.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Web Servers, and Application Servers'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source EventCode=4688

      | eval is_disco = Image IN (sc.exe,tasklist.exe,net.exe,wmic.exe)

      | stats count(eval(is_disco)) as disco, count as total by host, ParentImage

      | eval p_child_given_parent = disco/total

      | where is_disco AND p_child_given_parent < 0.001

      | eval state = if(ExitCode=0,"success","failed/blocked")

      | table host, ParentImage, Image, p_child_given_parent, state, spawns_per_min'
- question: Does a provenance-graph anomaly detector flag the parent-child edge or node neighborhood around
    a service-discovery process as anomalous within full system context?
  context: Single parent-child probabilities ignore the wider execution context an attacker creates. Model
    process lineage as a provenance graph and score the rarity of parent-child edges and node neighborhoods
    with a graph-learning detector such as ThreaTrace (GraphSAGE, node-level) or KAIROS (temporal GNN
    over whole-system provenance). These detect anomalous enumeration nodes/edges in full process/file/network
    context and can reconstruct the surrounding subgraph for explainable triage; both were evaluated on
    the DARPA Transparent Computing provenance datasets. A discovery node embedded in an otherwise anomalous
    subgraph (unusual file writes, network beacons, rare ancestry) is far more suspicious than the same
    command in a benign neighborhood.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Web Servers, and Application Servers'
  range: Last 90 days
  queries:
  - technology: Provenance-GNN/pseudocode
    query: 'G = build_provenance_graph(process,file,network events)

      scores = ThreaTrace.node_score(G) ; edge_scores = KAIROS.temporal_score(G)

      | where node.Image IN (sc.exe,tasklist.exe,net.exe,wmic.exe) AND (scores > thr OR edge_scores >
      thr)

      | emit reconstructed_subgraph(node) for triage'
- question: Do PowerShell script-block logs (Event ID 4104) contain service-discovery cmdlets such as
    Get-Service, Get-WmiObject/Get-CimInstance Win32_Service, gwmi Win32_Service, or Get-ScheduledTask,
    especially alongside obfuscation indicators?
  context: Adversaries increasingly enumerate services through PowerShell and WMI to blend into management
    activity and to obfuscate intent. Scan Event ID 4104 (Script Block Logging) for `Get-Service`, `Get-WmiObject
    Win32_Service`, `gwmi Win32_Service`, `Get-CimInstance Win32_Service`, and `Get-ScheduledTask`, and
    for obfuscation indicators (`FromBase64String`, `IEX`, `-enc`, char-array casting, heavy concatenation).
    Deploy the relevant SigmaHQ PowerShell rules and treat the T1007 cmdlet patterns as the baseline.
    A discovery cmdlet wrapped in encoding or executed remotely is a strong signal; a plain Get-Service
    in an admin maintenance script is expected.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 5861
  - 'NAI: All Windows Endpoints and Servers with PowerShell v5+ Script Block Logging and WMI Activity
    logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source WinEventLog:PowerShell EventCode=4104

      | where match(ScriptBlockText, /(?i)(Get-Service|Get-WmiObject\s+Win32_Service|gwmi\s+Win32_Service|Get-CimInstance\s+Win32_Service|Get-ScheduledTask)/)

      | eval obfuscation = match(ScriptBlockText, /(?i)(FromBase64String|IEX|-enc|\[char\]|\+\s*[''\"])/)

      | eval severity = if(obfuscation,"high","medium")

      | table host, User, ScriptBlockText, obfuscation, severity'
- question: Among PowerShell script blocks that invoke service-discovery cmdlets, which exhibit unusually
    high Shannon entropy or rare n-gram tokens, and how many discovery cmdlets fire per host within a
    5-minute window?
  context: Obfuscated or auto-generated discovery scripts stand out statistically even when keywords are
    masked. Compute Shannon entropy and n-gram token rarity (NgViz-style) of 4104 script blocks; baseline
    legitimate admin scripts and alert when a block contains a service-discovery cmdlet AND its entropy
    exceeds the 95th percentile (derived per environment). Also count discovery-cmdlet invocations per
    host per 5 minutes (the Frequency dimension) to catch scripted bulk enumeration. High entropy on a
    discovery-bearing block suggests encoding/packing; a sudden burst of discovery cmdlets suggests automated
    sweeping. Normal interactive admin scripts will have low entropy and low invocation rates.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 5861
  - 'NAI: All Windows Endpoints and Servers with PowerShell v5+ Script Block Logging and WMI Activity
    logging enabled.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source EventCode=4104

      | eval is_disco = match(ScriptBlockText, /(?i)(Get-Service|Win32_Service|Get-ScheduledTask)/)

      | eval entropy = shannon_entropy(ScriptBlockText), rarity = ngram_score(ScriptBlockText)

      | where is_disco AND entropy > p95

      | bin _time span=5m | stats count as disco_per_5m by host, _time

      | table host, entropy, rarity, disco_per_5m'
- question: Does a text classifier over PowerShell script-block content flag a discovery-bearing block
    as malicious, or does a sequence model find the host's stream of script blocks out-of-distribution?
  context: Beyond keywords and entropy, a learned model can generalize to novel malicious scripts. Train
    a TF-IDF + classifier (logistic regression or Naive Bayes) on benign vs. malicious PowerShell to score
    4104 blocks containing service-discovery cmdlets, reporting the top-3 contributing tokens per alert.
    Alternatively, treat the per-host stream of script-block keys as a sequence and apply an LSTM next-event
    model like DeepLog to flag out-of-distribution discovery sequences. Keep the deterministic keyword
    rules in parallel as a floor. A high classifier score with telling tokens, or a discovery cmdlet appearing
    in a sequence the model deems improbable for that host, justifies investigation.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows Event ID 5861
  - 'NAI: All Windows Endpoints and Servers with PowerShell v5+ Script Block Logging and WMI Activity
    logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'clf = load("ps_tfidf_clf"); seq = load("deeplog_lstm")

      blocks = source EventCode=4104 where contains_discovery_cmdlet

      score, tokens = clf.predict(blocks), clf.top_tokens(blocks)

      ood = seq.is_out_of_distribution(per_host_block_stream)

      | where score > 0.8 OR ood

      | table host, ScriptBlockText, score, top3(tokens), ood'
- question: Does any single host or user execute more than ~10 distinct service-discovery commands (sc.exe,
    net.exe, tasklist.exe, Get-Service, systemctl, launchctl) within a 5-minute window?
  context: Automated discovery scripts and hands-on-keyboard reconnaissance produce bursts of enumeration
    that a human admin rarely matches. Alert when a single host/user executes more than 10 distinct service-discovery
    commands (sc.exe, net.exe, tasklist.exe, Get-Service, systemctl, launchctl) within a 5-minute window,
    per the burst-detection rationale in Red Canary's guidance. Tune the count to the noisiest legitimate
    admin host before deploying to avoid flooding on jump boxes and management servers. A tight cluster
    of varied discovery commands is a strong reconnaissance indicator; sporadic single commands across
    the day are normal.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Security Information and Event Management (SIEM) system or data lake containing aggregated endpoint
    logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source (EventCode=4688 OR EventCode=4104 OR auditd OR macos:unifiedlog)

      | where is_service_discovery_command(CommandLine)

      | bin _time span=5m

      | stats dc(CommandLine) as distinct_disco by host, User, _time

      | where distinct_disco > 10

      | table _time, host, User, distinct_disco'
- question: For each host, does the number of service-discovery events in a 5-minute bin exceed its own
    learned baseline (mu + 3 sigma), and is the failure/access-denied ratio elevated?
  context: A static threshold misfits hosts with very different baselines, so model each host dynamically.
    Aggregate discovery events into 5-minute bins per host; compute baseline mean (mu) and standard deviation
    (sigma) over 30 days and alert when a bin exceeds mu + 3*sigma. Track Volume (total commands), Frequency
    (commands/min), and State (ratio of failed/access-denied invocations) separately, since an elevated
    failure rate is itself a distinct signal of automated scanning by an underprivileged process. A statistically
    significant spike on a normally quiet host — especially with many access-denied results — indicates
    probing; a spike on a known patch-management server may be benign and should be peer-grouped.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Security Information and Event Management (SIEM) system or data lake containing aggregated endpoint
    logs.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source where is_service_discovery_command(CommandLine)

      | bin _time span=5m | stats count as vol, count(eval(status="denied")) as fails by host,_time

      | eventstats avg(vol) as mu, stdev(vol) as sigma by host

      | eval fail_ratio = fails/vol

      | where vol > mu + 3*sigma

      | table host, _time, vol, mu, sigma, fail_ratio'
- question: Does a sequence or seasonal anomaly model identify the host's stream of service-discovery
    events as an abnormal burst or out-of-distribution pattern relative to its learned daily/weekly rhythm?
  context: Discovery activity has natural temporal rhythm (business hours, scheduled jobs) that statistical
    thresholds miss. Apply a next-event sequence model (DeepLog LSTM) or an HMM (Forrest et al.; HMM +
    call-stack) to the per-host stream of discovery events to learn normal daily/weekly rhythm and flag
    unusual bursts or out-of-distribution sequences. Emit the predicted-vs-observed events as explanation
    so analysts can see exactly which events broke the pattern. Discovery occurring at an unusual time,
    in an unusual order, or at an unusual volume for that host is the signal; activity matching the learned
    seasonal pattern is expected.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Security Information and Event Management (SIEM) system or data lake containing aggregated endpoint
    logs.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = load("deeplog_or_hmm")

      stream = per_host_sequence(service_discovery_events)

      predicted = model.next_event(stream)

      | where observed NOT IN predicted.topk

      | table host, _time, observed, predicted.topk'
- question: After a service-discovery command on a host, is it followed within 30 minutes by other discovery
    techniques (T1018 net view, T1049 netstat) or by an outbound SMB/WinRM connection to a new internal
    host?
  context: 'Service discovery rarely happens in isolation; it is a step in a reconnaissance-then-move
    chain. Implement a sequence-correlation rule: IF T1007 (e.g., `sc query`) on Host X is followed within
    30 minutes by another discovery technique (T1018 `net view`, T1049 `netstat`) OR an outbound SMB/WinRM
    connection to a new internal host in Zeek conn.log (T1021), THEN raise a high-severity alert. This
    chaining-of-weak-signals approach turns several individually-noisy events into a high-confidence detection
    and aligns with T1007''s automated-discovery context. A discovery-to-lateral-movement chain from one
    host is a strong intrusion signal; service discovery with no follow-on activity is lower priority.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Centralized log aggregation platform (SIEM/Data Lake) capable of correlating endpoint and network
    data.'
  range: 'Last 90 days (event-centered: 30-minute correlation window after each T1007 event)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "let t1007 = source EventCode=4688 where is_service_discovery_command(CommandLine)\njoin host\
      \ [ search (EventCode=4688 where match(CommandLine,/(?i)(net\\s+view|netstat)/))\n           OR\
      \ (Zeek:conn where service IN (smb,winrm) AND dest_is_new_internal_host) ]\n| where followon._time\
      \ - t1007._time <= 30m AND followon._time >= t1007._time\n| eval severity=\"high\"\n| table host,\
      \ t1007.CommandLine, followon.event, delta_minutes"
- question: Based on a per-host technique transition matrix, how improbable is the observed chain that
    begins with T1007, and what is the failed-connection/access-denied rate during that session?
  context: Probabilistic sequence modeling catches novel chains that fixed rules miss. Build a per-host
    transition matrix of conditional probabilities P(T_next | T_now) over 60-minute sessions; alert on
    technique chains starting with T1007 whose joint probability is below an empirically derived threshold,
    extending the sequence-anomaly principle of Forrest et al. Include in the alert the failed-connection
    / NXDOMAIN / access-denied rate during the session as a distinct State signal of scanning. A low-probability
    technique chain combined with a high failure rate strongly suggests automated reconnaissance; a high-probability,
    low-failure session reflects routine operations.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Centralized log aggregation platform (SIEM/Data Lake) capable of correlating endpoint and network
    data.'
  range: Last 90 days (60-minute session windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'sessions = sessionize(per_host technique events, gap=60m)

      | eval joint_p = product(P(T_next | T_now)) for chain starting T1007

      | eval fail_rate = (failed_conn + nxdomain + access_denied)/total_attempts

      | where joint_p < threshold

      | table host, session_id, chain, joint_p, fail_rate'
- question: Does a provenance-graph path detector or HMM intent model identify a rare multi-stage path
    (Discovery -> Lateral Movement) originating from a service-discovery event?
  context: Multi-stage intrusions are best seen as paths through whole-system provenance or as latent
    attacker intent. Detect anomalous multi-stage chains by scoring rare paths in whole-system provenance
    with KAIROS, or model latent attacker intent (Discovery -> Lateral Movement) with an HMM over observed
    techniques as in Forrest et al. and HMM + call-stack context. KAIROS additionally reconstructs the
    attack subgraph, surfacing the contributing events for explainable triage; it was evaluated on DARPA
    TC/OpTC. A rare provenance path that threads service discovery into lateral movement, or an HMM that
    infers a transition into a Lateral-Movement state, is a high-value lead for hunt and response.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Centralized log aggregation platform (SIEM/Data Lake) capable of correlating endpoint and network
    data.'
  range: Last 90 days
  queries:
  - technology: Provenance-GNN/HMM pseudocode
    query: 'G = whole_system_provenance(); paths = KAIROS.rare_paths(G)

      intent = HMM.infer_states(per_host technique sequence)

      | where path.contains(T1007) AND path.score > thr OR intent.transition(Discovery->LateralMovement)

      | emit reconstructed_subgraph(path) for triage'
- question: Which Linux hosts show service/daemon and scheduled-task enumeration (systemctl list-units
    --type=service, service --status-all, chkconfig --list, initctl list, crontab -l, reads of /etc/init.d
    or /etc/systemd/system), and is the parent a web-server/service account or non-interactive shell?
  context: On Linux, adversaries who land via a web-app exploit or stolen service credentials enumerate
    daemons and cron jobs to understand the host. On auditd EXECVE / Sysmon-for-Linux process events,
    match `systemctl` with `list-units`/`--type=service`/`list-unit-files`, `service --status-all`, `chkconfig
    --list`, `initctl list`, `crontab -l`, and reads of `/etc/init.d` or `/etc/systemd/system`, per T1007
    and LOLBAS reference syntaxes (mapped via SigmaHQ Linux rules). Raise severity when the parent is
    a web-server/service account (www-data, apache, nginx) or a non-interactive shell — that combination
    strongly suggests post-exploitation rather than admin work. Routine enumeration by an interactive
    root/admin session during maintenance is expected.
  answer_sources:
  - auditd:EXECVE
  - auditd:SYSCALL
  - Linux Process Creation
  - 'NAI: Linux servers and workstations, especially internet-facing application/web servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source auditd:EXECVE\n| where match(cmd, /(systemctl\\s+(list-units|--type=service|list-unit-files)|service\\\
      s+--status-all|chkconfig\\s+--list|initctl\\s+list|crontab\\s+-l)/)\n   OR (syscall=open AND path\
      \ IN (/etc/init.d/*, /etc/systemd/system/*))\n| eval susp_ctx = (auid_user IN (www-data,apache,nginx))\
      \ OR (tty=\"(none)\")\n| eval severity = if(susp_ctx,\"high\",\"medium\")\n| table host, auid_user,\
      \ ppid_comm, cmd, severity"
- question: On each Linux host and account, are these service-enumeration commands in the rarest 1% of
    historical usage, and is there an elevated rate of permission-denied/failed systemctl calls?
  context: Rarity and failure patterns distinguish reconnaissance from administration. Baseline per-host
    and per-account frequency of these commands over 30 days and alert on bottom-1% rarity, applying the
    context-over-presence principle. Profile the State dimension — counts of permission-denied/failed
    systemctl calls — as a distinct signal of an unprivileged process probing services it cannot control.
    A rarely-seen enumeration command run by an account that does not normally do so, especially with
    many permission-denied results, indicates an adversary mapping the host; familiar commands by an admin
    account are benign.
  answer_sources:
  - auditd:EXECVE
  - auditd:SYSCALL
  - Linux Process Creation
  - 'NAI: Linux servers and workstations, especially internet-facing application/web servers.'
  range: Last 90 days (baseline 30 days)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source auditd:EXECVE where is_linux_service_enum(cmd)

      | stats count by host, auid_user, cmd

