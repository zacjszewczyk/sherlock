questions:
- question: '[Stealth] Threat-intel email correlation (Symbolic Logic): Can you determine whether zeek
    smtp.log, dns.log, or http.log shows an inbound message whose source IP, sender domain, or embedded
    URL matches a known malicious indicator associated with impersonation campaigns -- specifically, by
    applying the ''Threat-intel email correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log, dns.log, or http.log shows an inbound message whose source IP, sender
    domain, or embedded URL matches a known malicious indicator associated with impersonation campaigns.
    This Symbolic Logic approach works as follows: Join smtp.log, dns.log, and http.log and alert when
    id.orig_h, queried domains, or requested URLs match TI indicators. Layer the deterministic authentication
    floor: alert when the message claims a protected internal/partner domain but shows spf=fail or DMARC
    misalignment per [RFC 7208 SPF](https://www.rfc-editor.org/rfc/rfc7208) and [RFC 7489 DMARC](https://www.rfc-editor.org/rfc/rfc7489),
    since providers still deliver such mail to the inbox ([Hu & Wang](https://www.usenix.org/conference/usenixsecurity18/presentation/hu)).
    Keep TI/IOC matches as a hard rule that never relies on external API lookups at alert time. A positive
    result -- a rule match, a statistical outlier, or a model alert -- is a meaningful indicator that
    an inbound or outbound message is part of an impersonation/BEC attempt; pivot to the sender''s true
    SMTP origin (IP/ASN), the authentication verdicts (SPF/DKIM/DMARC), the recipient role and whether
    they hold financial or privileged authority, the reply-to and embedded URLs, any attachments, and
    -- for outbound cases -- the sending account''s recent logon history to determine whether the mailbox
    is compromised. A negative result lowers suspicion for this particular vector but should be corroborated
    with the other questions in this playbook, since impersonation campaigns can pass authentication (lateral
    phishing from a compromised account), use freshly registered lookalike domains that no feed yet lists,
    or carry no attachment at all and rely purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Email Gateway, DNS Resolvers, Web Proxy, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'load ti = cache(feed=''impersonation_iocs'', refresh=''1h'')

      search zeek_smtp JOIN zeek_dns JOIN zeek_http on session

      | where id.orig_h in ti.ip OR query in ti.domain OR url in ti.url

      | OR (mailfrom_domain in protected_domains AND (spf_result==''fail'' OR dmarc_aligned==false))

      | emit alert'
- question: '[Stealth] Grey domain rarity scoring (Statistical Method): Can you determine whether zeek
    smtp.log, dns.log, or http.log shows an inbound message whose source IP, sender domain, or embedded
    URL matches a known malicious indicator associated with impersonation campaigns -- specifically, by
    applying the ''Grey domain rarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log, dns.log, or http.log shows an inbound message whose source IP, sender
    domain, or embedded URL matches a known malicious indicator associated with impersonation campaigns.
    This Statistical Method approach works as follows: Score grey-listed sender domains by their 90-day
    frequency and flag those below the 5th percentile, and separately profile the failure rate (NXDOMAIN
    resolutions in dns.log and SMTP 4xx/5xx in smtp.log) for the sender domain as a distinct signal, since
    fresh impersonation infrastructure produces rare domains with elevated resolution/delivery failures
    ([Ho et al. DAS](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    A positive result -- a rule match, a statistical outlier, or a model alert -- is a meaningful indicator
    that an inbound or outbound message is part of an impersonation/BEC attempt; pivot to the sender''s
    true SMTP origin (IP/ASN), the authentication verdicts (SPF/DKIM/DMARC), the recipient role and whether
    they hold financial or privileged authority, the reply-to and embedded URLs, any attachments, and
    -- for outbound cases -- the sending account''s recent logon history to determine whether the mailbox
    is compromised. A negative result lowers suspicion for this particular vector but should be corroborated
    with the other questions in this playbook, since impersonation campaigns can pass authentication (lateral
    phishing from a compromised account), use freshly registered lookalike domains that no feed yet lists,
    or carry no attachment at all and rely purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Email Gateway, DNS Resolvers, Web Proxy, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search zeek_smtp earliest=-90d

      | stats count as freq by sender_domain

      | eventstats perc5(freq) as p5

      | join sender_domain [search zeek_dns | stats count(eval(rcode==''NXDOMAIN'')) as nx, count as q
      by query]

      | join sender_domain [search zeek_smtp | stats count(eval(reply_code>=400)) as fail by sender_domain]

      | where freq < p5 OR (nx/q) > baseline_failrate OR fail > 0

      | emit alert'
- question: '[Stealth] High-risk email classifier (Machine Learning): Can you determine whether zeek smtp.log,
    dns.log, or http.log shows an inbound message whose source IP, sender domain, or embedded URL matches
    a known malicious indicator associated with impersonation campaigns -- specifically, by applying the
    ''High-risk email classifier'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log, dns.log, or http.log shows an inbound message whose source IP, sender
    domain, or embedded URL matches a known malicious indicator associated with impersonation campaigns.
    This Machine Learning approach works as follows: Score emails with features like IP reputation, domain
    age, SPF/DKIM/DMARC verdict, and TI hits, alerting when scores exceed 0.85, and surface the top-3
    contributing features in the alert text using interpretable fusion of per-signal scores ([modular
    adaptive BEC system](https://arxiv.org/abs/2308.10776)). Run in parallel with the deterministic floor
    above; tune the 0.85 threshold per-org against labeled mail. A positive result -- a rule match, a
    statistical outlier, or a model alert -- is a meaningful indicator that an inbound or outbound message
    is part of an impersonation/BEC attempt; pivot to the sender''s true SMTP origin (IP/ASN), the authentication
    verdicts (SPF/DKIM/DMARC), the recipient role and whether they hold financial or privileged authority,
    the reply-to and embedded URLs, any attachments, and -- for outbound cases -- the sending account''s
    recent logon history to determine whether the mailbox is compromised. A negative result lowers suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    impersonation campaigns can pass authentication (lateral phishing from a compromised account), use
    freshly registered lookalike domains that no feed yet lists, or carry no attachment at all and rely
    purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Email Gateway, DNS Resolvers, Web Proxy, Threat Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = load(''bec_risk_classifier'')

      search zeek_smtp

      | eval feats=[ip_reputation, domain_age, spf_dkim_dmarc_verdict, ti_hit]

      | eval score=model.predict_proba(feats)

      | where score > 0.85

      | eval top3=model.explain(feats, k=3)

      | emit alert(score, top3)'
- question: '[Stealth] High-value display name detection (Symbolic Logic): Can you determine whether zeek
    smtp.log shows a display name in the From header that matches a high-value internal identity while
    the actual sender domain is external and not on an allowlist of approved partner domains -- specifically,
    by applying the ''High-value display name detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log shows a display name in the From header that matches a high-value
    internal identity while the actual sender domain is external and not on an allowlist of approved partner
    domains. This Symbolic Logic approach works as follows: Alert when a high-value internal display name
    appears in the SMTP From header but the sender domain is external and not on the partner allowlist
    — the name-spoofing rule (known display name paired with a never-before-seen From address) from [Ho
    et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho). Additionally
    re-parse headers and flag multiple/ambiguous From headers or RFC5321-vs-RFC5322 mismatch ([Composition
    Kills](https://www.usenix.org/conference/usenixsecurity20/presentation/chen-jianjun)). Build the high-value
    name list from Directory Services/HR feeds, not external APIs. A positive result -- a rule match,
    a statistical outlier, or a model alert -- is a meaningful indicator that an inbound or outbound message
    is part of an impersonation/BEC attempt; pivot to the sender''s true SMTP origin (IP/ASN), the authentication
    verdicts (SPF/DKIM/DMARC), the recipient role and whether they hold financial or privileged authority,
    the reply-to and embedded URLs, any attachments, and -- for outbound cases -- the sending account''s
    recent logon history to determine whether the mailbox is compromised. A negative result lowers suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    impersonation campaigns can pass authentication (lateral phishing from a compromised account), use
    freshly registered lookalike domains that no feed yet lists, or carry no attachment at all and rely
    purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Email Gateway, Directory Services, HR Information System'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'load hv = directory_high_value_names()  // from AD/HR, not external API

      load allow = partner_domain_allowlist()

      search zeek_smtp

      | eval disp=lower(from_display_name)

      | where disp in hv AND sender_domain not in allow

      | OR count_from_headers > 1 OR rfc5321_from != rfc5322_from

      | emit alert'
- question: '[Stealth] Display/local-part similarity scoring (Statistical Method): Can you determine whether
    zeek smtp.log shows a display name in the From header that matches a high-value internal identity
    while the actual sender domain is external and not on an allowlist of approved partner domains --
    specifically, by applying the ''Display/local-part similarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log shows a display name in the From header that matches a high-value
    internal identity while the actual sender domain is external and not on an allowlist of approved partner
    domains. This Statistical Method approach works as follows: Calculate Levenshtein distance between
    display name and sender local-part, flagging distances above the 95th percentile of the baseline,
    and track the count/min of distinct display-name-vs-address mismatches per recipient to capture campaign
    frequency. Profile bounced/failed replies to the reply-to address as a distinct failure signal ([Ho
    et al. DAS](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    A positive result -- a rule match, a statistical outlier, or a model alert -- is a meaningful indicator
    that an inbound or outbound message is part of an impersonation/BEC attempt; pivot to the sender''s
    true SMTP origin (IP/ASN), the authentication verdicts (SPF/DKIM/DMARC), the recipient role and whether
    they hold financial or privileged authority, the reply-to and embedded URLs, any attachments, and
    -- for outbound cases -- the sending account''s recent logon history to determine whether the mailbox
    is compromised. A negative result lowers suspicion for this particular vector but should be corroborated
    with the other questions in this playbook, since impersonation campaigns can pass authentication (lateral
    phishing from a compromised account), use freshly registered lookalike domains that no feed yet lists,
    or carry no attachment at all and rely purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Email Gateway, Directory Services, HR Information System'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search zeek_smtp earliest=-90d

      | eval dist=levenshtein(from_display_name, from_local_part)

      | eventstats perc95(dist) as p95

      | stats max(dist) as md, dc(eval(dist>p95)) as mismatches, count(eval(reply_failed)) as bounces
      by recipient

      | where md > p95

      | emit alert'
- question: '[Stealth] Impersonation cluster detection (Machine Learning): Can you determine whether zeek
    smtp.log shows a display name in the From header that matches a high-value internal identity while
    the actual sender domain is external and not on an allowlist of approved partner domains -- specifically,
    by applying the ''Impersonation cluster detection'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log shows a display name in the From header that matches a high-value
    internal identity while the actual sender domain is external and not on an allowlist of approved partner
    domains. This Machine Learning approach works as follows: Cluster display names, domains, and TLDs
    via DBSCAN and alert on small clusters distinct from legitimate traffic; complement with a Siamese-CNN
    visual-similarity embedding that detects homoglyph/lookalike display names where edit-distance fails
    ([Detecting Homoglyph Attacks with a Siamese Neural Network](https://arxiv.org/abs/1805.09738)). Surface
    the nearest legitimate identity and the three most similar fields in the alert. A positive result
    -- a rule match, a statistical outlier, or a model alert -- is a meaningful indicator that an inbound
    or outbound message is part of an impersonation/BEC attempt; pivot to the sender''s true SMTP origin
    (IP/ASN), the authentication verdicts (SPF/DKIM/DMARC), the recipient role and whether they hold financial
    or privileged authority, the reply-to and embedded URLs, any attachments, and -- for outbound cases
    -- the sending account''s recent logon history to determine whether the mailbox is compromised. A
    negative result lowers suspicion for this particular vector but should be corroborated with the other
    questions in this playbook, since impersonation campaigns can pass authentication (lateral phishing
    from a compromised account), use freshly registered lookalike domains that no feed yet lists, or carry
    no attachment at all and rely purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - 'NAI: Email Gateway, Directory Services, HR Information System'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = dbscan(eps=0.3, min_samples=5)

      search zeek_smtp

      | eval features=[display_name_vec, domain_vec, tld]

      | eval cluster=model.fit_predict(features)

      | where cluster_size(cluster) < small_threshold

      | eval visual=siamese_cnn_similarity(display_name, legit_identities)

      | where visual.score > 0.9

      | emit alert(nearest_identity, top3_fields)'
- question: '[Stealth] Typosquat distance detection (Symbolic Logic): Can you determine whether zeek smtp.log
    and dns.log show an inbound email from a sender domain that differs by only one or two characters
    from the organization''s primary domain or a trusted partner domain, consistent with typosquatting
    -- specifically, by applying the ''Typosquat distance detection'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log and dns.log show an inbound email from a sender domain that differs
    by only one or two characters from the organization''s primary domain or a trusted partner domain,
    consistent with typosquatting. This Symbolic Logic approach works as follows: Calculate Levenshtein/Damerau
    distance between new sender domains and approved brand/partner domains, alerting on distances of 1
    or 2 and on the typosquat models (omission, substitution, insertion, permutation, homophone, TLD-swap)
    enumerated by the [typosquatting taxonomy](https://arxiv.org/abs/1603.02767). Keep this as a deterministic
    rule sourced from an internal allowlist of protected domains. A positive result -- a rule match, a
    statistical outlier, or a model alert -- is a meaningful indicator that an inbound or outbound message
    is part of an impersonation/BEC attempt; pivot to the sender''s true SMTP origin (IP/ASN), the authentication
    verdicts (SPF/DKIM/DMARC), the recipient role and whether they hold financial or privileged authority,
    the reply-to and embedded URLs, any attachments, and -- for outbound cases -- the sending account''s
    recent logon history to determine whether the mailbox is compromised. A negative result lowers suspicion
    for this particular vector but should be corroborated with the other questions in this playbook, since
    impersonation campaigns can pass authentication (lateral phishing from a compromised account), use
    freshly registered lookalike domains that no feed yet lists, or carry no attachment at all and rely
    purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Email Gateway, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'load brands = protected_domain_allowlist()

      search zeek_smtp earliest=-1d

      | eval d=min(map(brands, b -> damerau_levenshtein(sender_domain, b)))

      | where d in (1,2) OR matches_typosquat_model(sender_domain, brands)  // omission/substitution/insertion/permutation/homophone/TLD-swap

      | emit alert'
- question: '[Stealth] Domain risk scoring (Statistical Method): Can you determine whether zeek smtp.log
    and dns.log show an inbound email from a sender domain that differs by only one or two characters
    from the organization''s primary domain or a trusted partner domain, consistent with typosquatting
    -- specifically, by applying the ''Domain risk scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary impersonates a trusted person
    or organization so their fraudulent request blends in with legitimate correspondence and survives
    normal scrutiny -- the goal is to remain indistinguishable from benign business email while persuading
    a victim to wire money, divulge credentials, or disclose sensitive data. This evidence focuses on
    the condition that zeek smtp.log and dns.log show an inbound email from a sender domain that differs
    by only one or two characters from the organization''s primary domain or a trusted partner domain,
    consistent with typosquatting. This Statistical Method approach works as follows: Compute R = w1(1/f)
    + w2(1/d) over 90-day sender frequency f and edit distance d, flagging domains above the 98th percentile,
    and add a failure-rate term for NXDOMAIN/expired-resolution and SMTP delivery failures of the candidate
    domain (Volume + State signals) ([Ho et al. DAS](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    A positive result -- a rule match, a statistical outlier, or a model alert -- is a meaningful indicator
    that an inbound or outbound message is part of an impersonation/BEC attempt; pivot to the sender''s
    true SMTP origin (IP/ASN), the authentication verdicts (SPF/DKIM/DMARC), the recipient role and whether
    they hold financial or privileged authority, the reply-to and embedded URLs, any attachments, and
    -- for outbound cases -- the sending account''s recent logon history to determine whether the mailbox
    is compromised. A negative result lowers suspicion for this particular vector but should be corroborated
    with the other questions in this playbook, since impersonation campaigns can pass authentication (lateral
    phishing from a compromised account), use freshly registered lookalike domains that no feed yet lists,
    or carry no attachment at all and rely purely on persuasive text.'
  answer_sources:
  - Zeek smtp.log
  - Zeek dns.log
  - 'NAI: Email Gateway, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search zeek_smtp earliest=-90d

      | stats count as f by sender_domain

      | eval d=min_edit_distance(sender_domain, protected_domains)

      | eval R = w1*(1.0/f) + w2*(1.0/d)

      | join sender_domain [search zeek_dns | stats count(eval(rcode==''NXDOMAIN'')) as nx by query]

      | eval R = R + w3*nx

      | eventstats perc98(R) as p98 | where R > p98 | emit alert'
- question: '[Stealth] Visual-similarity domain outlier (Machine Learning): Can you determine whether
