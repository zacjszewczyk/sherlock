  queries:
  - technology: SIEM/ML pseudocode
    query: 'model = siamese_cnn_homoglyph()

      search zeek_smtp

      | where is_new_domain(sender_domain)

      | eval img=render_to_image(sender_domain)

      | eval sim=model.score(img, protected_domain_images)

      | where sim.distance < threshold

      | emit alert(target_domain=sim.match, visual_distance=sim.distance)'
