name: 'T1684.001: Social Engineering: Impersonation'
id: 3cec0825-2eb1-4fd5-87ac-014ecab192df
description: 'This playbook helps an analyst investigate whether an adversary is impersonating a trusted
  person or organization -- an executive, colleague, or third-party vendor -- to persuade a user to perform
  an action on the adversary''s behalf (MITRE ATT&CK T1684.001, Social Engineering: Impersonation, examined
  here under the Stealth tactic TA0005, since impersonation is designed to blend in with legitimate correspondence
  and evade detection). Impersonation underpins business email compromise (BEC), email fraud, and lateral
  spearphishing, and is typically preceded by reconnaissance and infrastructure acquisition (lookalike/typosquat
  domains) and followed by financial theft or data disclosure. The hunt pursues the behavior from several
  complementary angles using primarily first-party telemetry: matching inbound mail source IPs, sender
  domains, and embedded URLs against threat-intelligence indicators and the deterministic SPF/DKIM/DMARC
  authentication floor; detecting high-value internal display names paired with external, non-allowlisted
  sender domains and malformed/ambiguous From headers; identifying typosquat and homoglyph lookalike domains
  a character or two away from protected brand/partner domains; flagging urgency language, high-value
  recipient roles, and risky attachment types (.iso, .img, .html, double extensions); correlating anomalous
  post-login outbound mail blasts from compromised internal accounts (Windows Event ID 4624/4625 joined
  to outbound volume); and fusing impersonated sender identity, reply-to, and URL metadata against transport-layer
  origin. Detection methods combine deterministic symbolic-logic rules, statistical baselining (frequency/percentile
  rarity, edit-distance and entropy scoring, per-user volume and recipient-profile baselines, failure/bounce-rate
  profiling, Directed Anomaly Scoring), and machine learning (high-risk email classifiers, DBSCAN clustering,
  Siamese-CNN visual-similarity embeddings, one-class SVM domain outliers, ARIMA/Prophet time-series forecasting,
  and explainable transformer intent classifiers), applied across Zeek smtp/dns/http/conn/files logs,
  Windows Security event logs, mail server and SaaS/M365 audit logs, so the analyst can corroborate suspected
  impersonation across content, identity, infrastructure, authentication, and behavioral cadence.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
