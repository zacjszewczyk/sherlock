name: 'T1588.001: Malware'
id: de7cfb94-47e0-43fc-8af6-25b2a64fcd43
description: 'This playbook helps a SOC analyst investigate whether an adversary has deployed acquired,
  purchased, stolen, or downloaded malware — payloads, droppers, loaders, post-compromise tools, backdoors,
  packers, and C2 frameworks such as Cobalt Strike — within the environment (MITRE ATT&CK T1588.001, Malware,
  under Resource Development). Although the acquisition itself happens outside the target''s visibility,
  the playbook pivots to the post-compromise deployment of that malware and pursues it from several complementary
  angles: files traversing the network or written to disk whose cryptographic hashes match threat-intel
  watchlists or YARA content signatures; outbound connections to known malware-distribution or C2 domains/IPs,
  plus newly registered, rare, or algorithmically generated (DGA) domains; process creation matching commodity
  dropper/loader command-line patterns and rare parent-child lineages; unsigned or masquerading binaries
  making first-contact external connections; network traffic exhibiting beaconing cadence, non-standard
  SSL ports, self-signed certificates, or low-prevalence destinations; and files showing evasion traits
  such as high-entropy or double-extension filenames and MIME/extension mismatches. Detection methods
  combine deterministic symbolic-logic rules (hash/domain/IP watchlists, Sigma/YARA signatures, named-pipe
  correlation), statistical baselining (hash and domain prevalence, Shannon entropy of files and filenames,
  parent-child rarity, beacon jitter via FFT/autocorrelation, STL decomposition), and machine learning
  (Random Forest/Gradient Boosting/CNN-GRU file classifiers, DGA models, command-line LSTMs, DBSCAN/Isolation
  Forest/autoencoder anomaly detection with SHAP/LIME explanations), applied across Zeek conn/dns/http/ssl/files
  logs, Windows Security and Sysmon events, so the analyst can corroborate suspected malware deployment
  across file, process, and network telemetry.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
