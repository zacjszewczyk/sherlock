- question: '[Resource Development] DGA detection model: For evidence where an endpoint initiates a network
    connection to an external IP address, domain, or URL that is present on a threat intelligence feed
    of known malware distribution points or Command and Control (C2) servers. how can an analyst identify
    this using the Machine Learning approach — specifically, Train/apply a DGA model with lexical features
    (domain length, Shannon entropy, n-grams, digit ratio, consonant ratio) scoring every DNS query to
    identify algorithmically generated C2 domains, reporting the top-3 contributing features per alert
    ([NIOM-DGA: Nature-Inspired Feature Selection for DGA Detection](https://www.sciencedirect.com/science/article/pii/S0167404825002500)).
