    domain, or URL that is present on a threat intelligence feed of known malware distribution points
    or Command and Control (C2) servers. Using a Symbolic Logic method, the analyst should: Query Zeek
    dns.log, Zeek conn.log, and HTTP/SSL logs for domains/IPs matching C2/malware-distribution watchlists
    and alert on any matches. Add a first-party behavioral rule by fingerprinting each host''s normal
    outbound HTTP (User-Agent, header order, byte sizes) and alerting on deviating flows characteristic
    of unknown backdoors/C2 even when the destination is not on a feed ([DECANTeR: DEteCtion of Anomalous
    outbouNd HTTP TRaffic](https://doi.org/10.1145/3134600.3134605)). A positive result — a watchlist
    hit, a statistical outlier, or a high model score — is a strong indicator that acquired or commodity
    malware has been deployed in the environment and warrants escalation, host isolation, and forensic
    triage; a negative result reduces but does not eliminate suspicion, since acquired malware is frequently
    repacked or re-hosted to evade static indicators, so corroborate across the other detection methods
    in this playbook. Focus collection on the named area of interest: Network egress points, DNS resolvers,
    Web proxies, User endpoints.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - Sysmon Event ID 3
  - 'NAI: Network egress points, DNS resolvers, Web proxies, User endpoints'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '// DNS/connection IOC correlation

      // Sources: Zeek dns.log, conn.log, http.log, ssl.log, Sysmon Event ID 3

      load Zeek dns.log/conn.log/http.log/ssl.log

      JOIN query_domain | dest_ip == C2_or_malware_distribution_watchlist

      EMIT alert on match; enrich with host, user, destination

      // first-party rule: per-host HTTP fingerprint (User-Agent, header order, byte sizes); alert deviating
      flows'
  - technology: SIEM/Rule pseudocode
    query: '// DNS/connection IOC correlation

      // Sources: Sysmon Event ID 3, proxy/DNS logs

      FROM network_connection/dns/proxy events

      WHERE domain IN (c2_watchlist) OR dest_ip IN (c2_watchlist)

      EMIT alert with matched indicator, host, user, destination'
- question: '[Resource Development] Domain age and rarity scoring: For evidence where an endpoint initiates
    a network connection to an external IP address, domain, or URL that is present on a threat intelligence
    feed of known malware distribution points or Command and Control (C2) servers. how can an analyst
    identify this using the Statistical Method approach — specifically, For external domains in Zeek dns.log,
    calculate age and query prevalence, flagging domains < 30 days old with low query counts (< 0.1% of
    hosts). Add a Failure-Mode signal by profiling per-host NXDOMAIN rates and unique-subdomain counts
    per registered domain: spikes indicate DGA callbacks or DNS tunneling/C2 ([Real-Time Detection of
    DNS Exfiltration and Tunneling from Enterprise Networks](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)).'
