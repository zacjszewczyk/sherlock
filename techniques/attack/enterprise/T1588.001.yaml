- question: '[Resource Development] DNS/connection IOC correlation: For evidence where an endpoint initiates
    a network connection to an external IP address, domain, or URL that is present on a threat intelligence
    feed of known malware distribution points or Command and Control (C2) servers. how can an analyst
    identify this using the Symbolic Logic approach — specifically, Query Zeek dns.log, Zeek conn.log,
    and HTTP/SSL logs for domains/IPs matching C2/malware-distribution watchlists and alert on any matches.
    Add a first-party behavioral rule by fingerprinting each host''s normal outbound HTTP (User-Agent,
    header order, byte sizes) and alerting on deviating flows characteristic of unknown backdoors/C2 even
    when the destination is not on a feed ([DECANTeR: DEteCtion of Anomalous outbouNd HTTP TRaffic](https://doi.org/10.1145/3134600.3134605)).'
  context: 'This question supports the information requirement "Has the adversary deployed acquired malware
    within the environment? (PIR)" under the Resource Development (TA0042) tactic for Malware (T1588.001).
