  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Domain age and rarity scoring\n// Sources: Zeek dns.log (+ conn/http/ssl)\nfor external\
      \ domain in dns.log:\n  age = now - first_seen | whois_creation\n  prevalence = count(distinct host\
      \ querying) / total_hosts\n  FLAG age < 30d AND prevalence < 0.1%\n// failure-mode signal: per-host\
