questions:
- question: '[Resource Development] Hash IOC watchlist correlation: For evidence where a file observed
    traversing the network or written to an endpoint has a cryptographic hash (MD5, SHA1, SHA256) that
    matches a known malicious indicator from an integrated threat intelligence platform. how can an analyst
    identify this using the Symbolic Logic approach — specifically, Join SHA256 hashes from Sysmon Event
    ID 11, Sysmon Event ID 1, and Zeek file.log against known malicious file-hash watchlists and alert
    on hits. Because acquired/commodity malware is frequently repacked (changing hashes), layer content
    signatures by scanning the same files with YARA rules for known commodity tooling such as Cobalt Strike
    beacons ([apt_cobaltstrike.yar — Cobalt Strike YARA Signature Base](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar)).'
  context: 'This question supports the information requirement "Has the adversary deployed acquired malware
    within the environment? (PIR)" under the Resource Development (TA0042) tactic for Malware (T1588.001).
    The underlying evidence is: A file observed traversing the network or written to an endpoint has a
    cryptographic hash (MD5, SHA1, SHA256) that matches a known malicious indicator from an integrated
    threat intelligence platform. Using a Symbolic Logic method, the analyst should: Join SHA256 hashes
    from Sysmon Event ID 11, Sysmon Event ID 1, and Zeek file.log against known malicious file-hash watchlists
    and alert on hits. Because acquired/commodity malware is frequently repacked (changing hashes), layer
    content signatures by scanning the same files with YARA rules for known commodity tooling such as
    Cobalt Strike beacons ([apt_cobaltstrike.yar — Cobalt Strike YARA Signature Base](https://github.com/Neo23x0/signature-base/blob/master/yara/apt_cobaltstrike.yar)).
    A positive result — a watchlist hit, a statistical outlier, or a high model score — is a strong indicator
    that acquired or commodity malware has been deployed in the environment and warrants escalation, host
    isolation, and forensic triage; a negative result reduces but does not eliminate suspicion, since
    acquired malware is frequently repacked or re-hosted to evade static indicators, so corroborate across
    the other detection methods in this playbook. Focus collection on the named area of interest: Network
    egress points, Internal file servers, Web content filters, User endpoints.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Network egress points, Internal file servers, Web content filters, User endpoints'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: '// Hash IOC watchlist correlation

      // Sources: Zeek files.log, Windows Event ID 4663, Sysmon Event ID 1, Sysmon Event ID 11

      collect file hashes (MD5/SHA1/SHA256) from Sysmon EID 11 (FileCreate), Sysmon EID 1 (Image), Zeek
      files.log

      JOIN file_hash == threat_intel_hash_watchlist

      EMIT alert on any match; enrich with host, user, file path

      // repack-resistant layer: rescan same files with YARA commodity rules (e.g., apt_cobaltstrike.yar)'
  - technology: SIEM/Rule pseudocode
    query: '// Hash IOC watchlist correlation

      // Sources: Windows Event ID 4663, Sysmon Event ID 1, Sysmon Event ID 11

      FROM file_create/file_access events

      WHERE sha256 IN (malicious_hash_watchlist) OR yara_rule_hit

      EMIT alert with matched hash/rule, host, user, file path'
- question: '[Resource Development] Hash prevalence rarity scoring: For evidence where a file observed
    traversing the network or written to an endpoint has a cryptographic hash (MD5, SHA1, SHA256) that
    matches a known malicious indicator from an integrated threat intelligence platform. how can an analyst
    identify this using the Statistical Method approach — specifically, Calculate 24-hour prevalence counts
    for each file hash across the enterprise and flag hashes appearing on fewer than 5 endpoints or below
    the 1st percentile. Add a Volume/State signal by computing per-file Shannon entropy: native PE code
    clusters ~4.7-6.5 while packed/encrypted payloads exceed ~7.0-7.2, so flag low-prevalence files whose
    section entropy crosses that threshold as likely obfuscated commodity malware ([Using Entropy Analysis
    to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989)).'
  context: 'This question supports the information requirement "Has the adversary deployed acquired malware
    within the environment? (PIR)" under the Resource Development (TA0042) tactic for Malware (T1588.001).
    The underlying evidence is: A file observed traversing the network or written to an endpoint has a
    cryptographic hash (MD5, SHA1, SHA256) that matches a known malicious indicator from an integrated
    threat intelligence platform. Using a Statistical Method method, the analyst should: Calculate 24-hour
    prevalence counts for each file hash across the enterprise and flag hashes appearing on fewer than
    5 endpoints or below the 1st percentile. Add a Volume/State signal by computing per-file Shannon entropy:
    native PE code clusters ~4.7-6.5 while packed/encrypted payloads exceed ~7.0-7.2, so flag low-prevalence
    files whose section entropy crosses that threshold as likely obfuscated commodity malware ([Using
    Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989)).
    A positive result — a watchlist hit, a statistical outlier, or a high model score — is a strong indicator
    that acquired or commodity malware has been deployed in the environment and warrants escalation, host
    isolation, and forensic triage; a negative result reduces but does not eliminate suspicion, since
    acquired malware is frequently repacked or re-hosted to evade static indicators, so corroborate across
    the other detection methods in this playbook. Focus collection on the named area of interest: Network
    egress points, Internal file servers, Web content filters, User endpoints.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Network egress points, Internal file servers, Web content filters, User endpoints'
  range: Last 90 days; for cadence/beaconing analysis correlate over rolling 24-hour windows centered
    on suspect activity
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Hash prevalence rarity scoring

      // Sources: Zeek files.log, Sysmon Event ID 1, Sysmon Event ID 11

      window = 24h

      prevalence[hash] = count(distinct host where hash observed)

      FLAG hash WHERE prevalence < 5 OR prevalence <= 1st_percentile

      entropy = shannon_entropy(file_sections)

      FLAG low-prevalence files WHERE section_entropy > 7.0   // packed/encrypted (native PE ~4.7-6.5)'
- question: '[Resource Development] File metadata classifier: For evidence where a file observed traversing
    the network or written to an endpoint has a cryptographic hash (MD5, SHA1, SHA256) that matches a
    known malicious indicator from an integrated threat intelligence platform. how can an analyst identify
    this using the Machine Learning approach — specifically, Train a classifier (Random Forest/Gradient
    Boosting/CNN-GRU) on static file metadata (MIME type, size, section entropy, hash prevalence, PE header/import
    features) labeled by threat intelligence, and alert on high-confidence malicious scores. Surface the
    top-3 contributing features (e.g., VirtualAllocEx/WriteProcessMemory imports, high entropy, low prevalence)
    in the alert via SHAP/LIME so analysts can triage the decision ([A Hybrid CNN-GRU Model with XAI-Driven
    Interpretability Using LIME and SHAP for Static Analysis in Malware Detection](https://peerj.com/articles/cs-3258/)).
    For unlabeled coverage of novel families, run an unsupervised Isolation Forest on the same features
    and review top anomalies ([Isolation Forest](https://doi.org/10.1145/2133360.2133363)).'
