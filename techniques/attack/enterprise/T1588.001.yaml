  answer_sources:
  - Zeek files.log
  - Windows Event ID 4663
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: Network egress points, Internal file servers, Web content filters, User endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '// File metadata classifier

      // Sources: Zeek files.log, Sysmon Event ID 1, Sysmon Event ID 11

      features = [mime_type, size, section_entropy, hash_prevalence, PE_header_features, imports]

