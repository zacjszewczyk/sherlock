    query: 'open  = Sysmon(EventCode=10) WHERE src_integrity < tgt_integrity

      alloc = Sysmon(EventCode=8) | union etw_vallocex

      sort  = etw_win32k WHERE msg == LVM_SORTITEMS AND target_class == SysListView32

      | sequence by target_pid within 5s: open -> alloc -> sort

      | emit alert(src_image, tgt_image, target_pid, host)'
- question: Has any source process exceeded the 99th percentile of its own baseline rate of ProcessAccess
    events targeting higher-integrity processes, or produced a burst of access-DENIED handle attempts
    against sensitive processes?
  context: 'In the context of Privilege Escalation (TA0004), this Statistical Method approach addresses
    the requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Baseline,
    per source process name, the rate (count/min and count/day) of Sysmon EID 10 ProcessAccess events
    that target higher-integrity processes using sliding-window frequency vectors. Alert when an instance
    exceeds its 99th-percentile baseline. Separately, treat a burst of access-DENIED (masked GrantedAccess
    / STATUS_ACCESS_DENIED) handle attempts as its own injection-probing signal, since a low-integrity
    injector often fails before it succeeds. Escalate when the target is lsass.exe, winlogon.exe or csrss.exe.
    This catches both successful and attempted cross-integrity access characteristic of the privilege-escalation
    path. Source detection guidance (Statistical Method): For each source process name, baseline the rate
    (count/min and count/day) of Sysmon Event ID 10 ProcessAccess events that target higher-integrity
    processes, using sliding-window frequency vectors per [Bag of System Calls](https://arxiv.org/abs/1611.03053).
    Alert when an instance exceeds the 99th percentile of its baseline, and separately profile the failure
    mode — a burst of access-DENIED (GrantedAccess masked / STATUS_ACCESS_DENIED) handle attempts is itself
    a distinct signal of injection probing. Escalate when the target is lsass.exe, winlogon.exe or csrss.exe.'
  answer_sources:
