name: 'T1055.015: Process Injection: ListPlanting'
id: fd3054e4-6872-43b7-ba75-6cb519cd6b48
description: 'This playbook helps an analyst investigate Process Injection: ListPlanting (T1055.015),
  a message-passing "shatter"-style injection in which an adversary copies code into a victim GUI process
  that uses a list-view (SysListView32) control and triggers it by sending an LVM_SORTITEMS window message
  so the payload runs as the ListView_SortItems sort callback. Because execution is masked under a legitimate,
  trusted process (commonly explorer.exe or mmc.exe) and the payload can be copied two bytes at a time
  via LVM_SETITEMPOSITION/LVM_GETITEMPOSITION messages to avoid the heavily monitored WriteProcessMemory
  API, this technique supports both defense evasion/stealth and privilege escalation. The questions below
  guide the analyst across the full attack chain: identifying ListPlanting tooling and rare executables,
  detecting the OpenProcess -> memory-allocation -> LVM_SORTITEMS handle-and-message sequence between
  processes of differing integrity, spotting console/non-GUI processes that abuse list-view messaging,
  catching anomalous child processes and DLL/RWX execution from trusted GUI hosts, and uncovering post-injection
  actions such as suspicious egress, beaconing, domain-generation traffic, and file-staging for exfiltration.
  Each question offers symbolic-logic, statistical, and machine-learning approaches over endpoint (Sysmon/Windows
  Event Log), API/EDR, and network (Zeek) telemetry.'
type: technique
