questions:
- question: Did any host execute a binary whose file hash matches a known ListPlanting/InvisiMole loader,
    or whose memory contains a registered ListView_SortItems/LVGroupCompare callback pointing into an
    unbacked private RWX region?
  context: 'In the context of Stealth (TA0005), this Symbolic Logic approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". This is the deterministic,
    highest-confidence check for ListPlanting. Join process-creation telemetry against curated threat-intel
    hash feeds of documented ListPlanting tooling (e.g., InvisiMole loaders from ESET), and in parallel
    run EDR/YARA memory scans for the technique''s structural fingerprint: a list-view sort callback (ListView_SortItems
    / LVGroupCompare) whose target address lies in a private RWX region not backed by any module on disk.
    A positive match is near-conclusive evidence of injection tooling on the host; a negative result does
    not rule out novel tooling, so pair it with the prevalence and classifier questions. Source detection
    guidance (Symbolic Logic): Join process creation logs (Sysmon Event ID 1 / 4688) with a threat-intel
    feed of file hashes known to be used for ListPlanting (e.g., InvisiMole loaders documented by [ESET](https://www.welivesecurity.com/wp-content/uploads/2020/06/ESET_InvisiMole.pdf)).
    In parallel, run EDR/YARA memory scans for ListPlanting code patterns — a registered ListView_SortItems/LVGroupCompare
    callback whose target lies in a private RWX region not backed by a module on disk, as described by
    [Hexacorn](https://www.hexacorn.com/blog/2019/04/25/listplanting-yet-another-code-injection-trick/)
    and [modexp](https://modexp.wordpress.com/2019/04/25/seven-window-injection-methods/). Flag any match
    deterministically.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, Administrative workstations, Terminal servers, Enterprise SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (Sysmon:EventCode=1, WinEventLog:4688)

      | join hash == threat_intel_listplanting_hashes.sha256

      | union (edr_memscan WHERE callback IN (ListView_SortItems, LVGroupCompare) AND region.protect ==
      RWX AND region.backed_by_module == false)

      | emit alert(host, image, hash, pid, parent_image)'
- question: Across the fleet, which executables are extremely rare (seen on only 1-2 hosts / lowest prevalence
    percentile) and were launched by a common GUI host such as explorer.exe or mmc.exe?
  context: 'In the context of Stealth (TA0005), this Statistical Method approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". ListPlanting loaders are
    typically bespoke and low-prevalence. Compute enterprise-wide prevalence (distinct host count and
    execution count) for every file hash observed in process creation over a rolling 30 days, then alert
    on images in the lowest percentile (<0.01%), weighting the score with the rarity/entropy of the full
    command line. Escalate when the parent is a GUI host, since that is the staging context for ListPlanting.
    Maintain first-seen state so a given rare-but-benign binary is not re-alerted indefinitely. A positive
    result surfaces never-before-seen tooling for triage. Source detection guidance (Statistical Method):
    Compute enterprise-wide prevalence (count of distinct hosts, count of executions) for every file hash
    seen in process creation over a rolling 30 days. Alert on execution of any image with host-prevalence
    in the lowest percentile (e.g., seen on 1-2 hosts, <0.01%), weighting the score with rarity/entropy
    of the full command line as in [SCADE](https://arxiv.org/abs/2412.04259); escalate when the parent
    is a common GUI host such as explorer.exe or mmc.exe. Track first-seen state so the same rare binary
    is not re-alerted forever.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, Administrative workstations, Terminal servers, Enterprise SIEM'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'events = proc_create(last=30d)

      | stats dc(host) as host_prev, count as execs, by hash, image, cmdline

      | eval cmd_entropy = shannon(cmdline)

      | where host_prev <= 2 OR percentile_rank(host_prev) < 0.01

      | eval score = rarity(host_prev) * (1 + cmd_entropy)

      | where parent_image IN (explorer.exe, mmc.exe) AND first_seen(hash)

      | sort -score'
- question: Does a supervised process classifier (Random Forest / Gradient Boosting) flag a newly executed
    process as malicious based on parent image, command line, path, integrity, hash prevalence and PE
    header subsystem/imports, and what top-3 SHAP features drove the score?
  context: 'In the context of Stealth (TA0005), this Machine Learning approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". Train a supervised model
    on process metadata; PE structural and import features tend to dominate ListPlanting-relevant detections.
    Rather than emitting a bare probability, surface the top-3 SHAP contributions (e.g., ''parent=explorer.exe'',
    ''subsystem=console'', ''hash_prevalence=1'') so the analyst can validate the reasoning. Prioritize
    high-probability hits whose parent is a GUI host, the classic ListPlanting launch pattern. A high-confidence
    hit with intuitive feature attributions warrants immediate memory inspection of both the launching
    and target process. Source detection guidance (Machine Learning): Train a supervised classifier (Random
    Forest / Gradient Boosting) on process metadata (parent image, command line, path, user/integrity,
    hash prevalence, PE header subsystem/imports). PE structural and import features dominate such models,
    so emit the top-3 SHAP feature contributions in every alert per [Anthony et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9)
    (e.g., ''parent=explorer.exe'', ''subsystem=console'', ''hash_prevalence=1'') rather than a bare score;
    investigate high-probability hits originating from GUI hosts.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, Administrative workstations, Terminal servers, Enterprise SIEM'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(parent_image, cmdline, path, user_integrity, hash_prevalence, pe_subsystem, pe_imports)

      model = GradientBoosting.load(''proc_clf'')

      p = model.predict_proba(X)

      top3 = shap_top_k(model, X, k=3)

      if p > 0.9: emit alert(host, pid, image, p, top3)'
- question: Within a 5-second window, did a lower-integrity process open a handle to a higher-integrity
    process, cause a memory allocation/protection change in it, and then send an LVM_SORTITEMS message
    to its SysListView32 control (instead of using WriteProcessMemory)?
  context: 'In the context of Stealth (TA0005), this Symbolic Logic approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". This ordered chain is the
    canonical ListPlanting injection signature. Correlate on a shared target PID: (1) Sysmon EID 10 ProcessAccess
    where SourceImage integrity < TargetImage integrity (a successful cross-integrity OpenProcess), (2)
    a memory allocation/protect-change in the target via Sysmon EID 8 or ETW (the allocate+execute correlation
    that is the core injection observable), and (3) an LVM_SORTITEMS trigger to the target''s list-view
    control rather than the heavily monitored WriteProcessMemory. Requiring the events to share the target
    PID and arrive in order makes this high-fidelity; a match is strong evidence of an active injection
    and likely privilege escalation when the target is high/system integrity. Source detection guidance
    (Symbolic Logic): Alert when one source/target process pair produces, within 5 seconds, the ordered
    chain: (1) Sysmon Event ID 10 ProcessAccess where SourceImage integrity < TargetImage integrity (a
    successful OpenProcess), (2) a memory allocation/protection change in the target observed via Sysmon
    Event ID 8 or ETW (the allocation+execute correlation shown to be the core injection observable by
    [Springer/IJIS](https://link.springer.com/article/10.1007/s10207-024-00836-w)), and (3) an LVM_SORTITEMS
    message sent to the target''s SysListView32 control instead of WriteProcessMemory, the exact ListPlanting
    trigger documented by [Hexacorn](https://www.hexacorn.com/blog/2019/04/25/listplanting-yet-another-code-injection-trick/)
    and [modexp](https://modexp.wordpress.com/2019/04/25/seven-window-injection-methods/). Require the
    events to share the target PID; ordered-chain matching follows the API-sequence alignment of [Cho
    et al.](https://journals.sagepub.com/doi/full/10.1155/2015/659101).'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: User workstations, Domain Controllers (if admin tools are used), Management servers with GUI
    tools'
  range: Last 7 days; correlate events within a 5-second window per target PID
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'open  = Sysmon(EventCode=10) WHERE src_integrity < tgt_integrity

      alloc = Sysmon(EventCode=8) | union etw_vallocex

      sort  = etw_win32k WHERE msg == LVM_SORTITEMS AND target_class == SysListView32

      | sequence by target_pid within 5s: open -> alloc -> sort

      | emit alert(src_image, tgt_image, target_pid, host)'
- question: Has any source process exceeded the 99th percentile of its own baseline rate of ProcessAccess
    events targeting higher-integrity processes, or produced a burst of access-DENIED handle attempts
    against sensitive processes?
  context: 'In the context of Stealth (TA0005), this Statistical Method approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". Baseline, per source process
    name, the rate (count/min and count/day) of Sysmon EID 10 ProcessAccess events that target higher-integrity
    processes using sliding-window frequency vectors. Alert when an instance exceeds its 99th-percentile
    baseline. Separately, treat a burst of access-DENIED (masked GrantedAccess / STATUS_ACCESS_DENIED)
    handle attempts as its own injection-probing signal, since a low-integrity injector often fails before
    it succeeds. Escalate when the target is lsass.exe, winlogon.exe or csrss.exe. This catches both successful
    and attempted cross-integrity access characteristic of the privilege-escalation path. Source detection
    guidance (Statistical Method): For each source process name, baseline the rate (count/min and count/day)
    of Sysmon Event ID 10 ProcessAccess events that target higher-integrity processes, using sliding-window
    frequency vectors per [Bag of System Calls](https://arxiv.org/abs/1611.03053). Alert when an instance
    exceeds the 99th percentile of its baseline, and separately profile the failure mode — a burst of
    access-DENIED (GrantedAccess masked / STATUS_ACCESS_DENIED) handle attempts is itself a distinct signal
    of injection probing. Escalate when the target is lsass.exe, winlogon.exe or csrss.exe.'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: User workstations, Domain Controllers (if admin tools are used), Management servers with GUI
    tools'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'acc = Sysmon(EventCode=10) WHERE tgt_integrity > src_integrity

      | bin span=1m | stats count by src_image, window

      | eventstats p99(count) as thr by src_image

      | where count > thr

      | append (acc WHERE granted_access_denied=true | stats count as denied by src_image,tgt_image |
      where denied > burst_thr)

      | eval sev = if(tgt_image IN (lsass.exe,winlogon.exe,csrss.exe),''high'',''med'')'
- question: Does a seasonal time-series model detect a sharp spike in LVM_SORTITEMS/LVM_SETITEMPOSITION/LVM_GETITEMPOSITION
    messages between a specific source/target process pair of differing integrity?
  context: 'In the context of Stealth (TA0005), this Machine Learning approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". The two-bytes-at-a-time payload
    copy via LVM_SETITEMPOSITION/LVM_GETITEMPOSITION and the LVM_SORTITEMS trigger produce a distinctive
    message-frequency signature per process pair. Model per-pair message frequency with a seasonal anomaly
    detector (e.g., S-H-ESD) and flag sharp spikes, especially across an integrity boundary. Surface the
    top-3 contributing features (message type, pair integrity delta, count vs. baseline) so the analyst
    understands the alert. A spike between a low-integrity source and a high-integrity GUI target is a
    strong ListPlanting indicator. Source detection guidance (Machine Learning): Model the per-process-pair
    frequency of LVM_SORTITEMS/LVM_SETITEMPOSITION/LVM_GETITEMPOSITION messages (the two-bytes-at-a-time
    payload-copy primitive described by [modexp](https://modexp.wordpress.com/2019/04/25/seven-window-injection-methods/)
    and used in the wild by [InvisiMole](https://www.welivesecurity.com/wp-content/uploads/2020/06/ESET_InvisiMole.pdf))
    with a seasonal time-series detector (e.g., S-H-ESD). Flag sharp spikes between processes of differing
    integrity, and surface the top-3 contributing features (message type, pair integrity delta, count
    vs. baseline) in the alert per [Anthony et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: User workstations, Domain Controllers (if admin tools are used), Management servers with GUI
    tools'
  range: Last 30 days; per-pair message-frequency baselining
  queries:
  - technology: ML/pseudocode
    query: 'ts = counts(msg IN (LVM_SORTITEMS,LVM_SETITEMPOSITION,LVM_GETITEMPOSITION)) by (src_pid,tgt_pid),
      bin=1m

      anom = SH_ESD(ts, season=''1d'')

      | where anom AND integrity_delta(src,tgt) > 0

      | emit alert(src_image, tgt_image, top3=[msg_type, integrity_delta, count_vs_baseline])'
- question: Did a process whose PE header lacks IMAGE_SUBSYSTEM_WINDOWS_GUI (a console app, service, or
    non-windowed binary) emit more than ~50 SendMessage/PostMessage calls carrying LVM_* arguments within
    one minute?
  context: 'In the context of Stealth (TA0005), this Symbolic Logic approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". List-view messaging is fundamentally
    a GUI primitive, so a non-GUI binary driving large volumes of LVM_* SendMessage/PostMessage traffic
    is anomalous and consistent with the ListPlanting payload-copy/trigger primitives. Alert when a non-GUI
    process exceeds a tuned per-minute threshold (~50) of LVM_* messages. Tune the count to your busiest
    legitimate console GUI automation to manage false positives. A positive result identifies the injector
    itself, even when it never used WriteProcessMemory. Source detection guidance (Symbolic Logic): Alert
    when a process whose PE header lacks IMAGE_SUBSYSTEM_WINDOWS_GUI (a console app, service, or non-windowed
    binary) emits more than 50 SendMessage/PostMessage calls carrying LVM_* arguments within a one-minute
    window — anomalous because list-view messaging is a GUI primitive, per [Hexacorn](https://www.hexacorn.com/blog/2019/04/25/listplanting-yet-another-code-injection-trick/)
    and [modexp](https://modexp.wordpress.com/2019/04/25/seven-window-injection-methods/). Tune the count
    threshold to your environment''s busiest legitimate console GUI automation.'
  answer_sources:
  - API Monitoring Logs
  - EDR Telemetry
  - 'NAI: User workstations, Application servers, Endpoint Detection and Response (EDR) platform'
  range: Last 7 days; evaluate in 1-minute windows
  queries:
  - technology: EDR/API-monitor pseudocode
    query: 'api = api_monitor WHERE func IN (SendMessage,PostMessage) AND arg LIKE ''LVM_%''

      | where proc.pe_subsystem != IMAGE_SUBSYSTEM_WINDOWS_GUI

      | bin span=1m | stats count by proc.pid, proc.image, window

      | where count > 50

      | emit alert(host, image, pid, count)'
- question: Does any process exceed mean + 3 standard deviations of its baseline SendMessage/PostMessage
    rate (calls/min), particularly process types whose baseline is normally ~0, and are LVM_SETITEMPOSITION/LVM_GETITEMPOSITION
    round-trips returning errors?
  context: 'In the context of Stealth (TA0005), this Statistical Method approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". Profile per-process-name
    the distribution of SendMessage/PostMessage volume (calls/min) and alert on instances exceeding mean
    + 3 SD, with special attention to console apps and services whose legitimate baseline mean is near
    zero. Additionally track the failure mode: LVM_SETITEMPOSITION/LVM_GETITEMPOSITION round-trips that
    return error/zero indicate failed payload-staging copies. Both the volume anomaly and the failed-copy
    signal point to active ListPlanting staging. Source detection guidance (Statistical Method): For each
    process name, profile the distribution of SendMessage/PostMessage (Volume: calls/min) and alert when
    an instance exceeds mean + 3 standard deviations, especially for process types whose baseline mean
    is ~0 (console apps, services), using frequency-vector baselining from [Bag of System Calls](https://arxiv.org/abs/1611.03053).
    Also track the failure-mode signal: LVM_SETITEMPOSITION/LVM_GETITEMPOSITION round-trips that return
    error/zero (failed copies during payload staging).'
  answer_sources:
  - API Monitoring Logs
  - EDR Telemetry
  - 'NAI: User workstations, Application servers, Endpoint Detection and Response (EDR) platform'
  range: Last 30 days; evaluate in 1-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'm = api_monitor WHERE func IN (SendMessage,PostMessage)

      | bin span=1m | stats count as cpm by image, window

      | eventstats mean(cpm) avg, stdev(cpm) sd by image

      | where cpm > avg + 3*sd

      | append (api_monitor WHERE arg IN (LVM_SETITEMPOSITION,LVM_GETITEMPOSITION) AND ret IN (0,ERROR)
      | stats count as failed by image)'
- question: When clustering processes on LVM_* messaging frequency, PE subsystem flag, window-handle count
    and image path, which processes fall out as outliers exhibiting heavy LVM_* messaging but lacking
    GUI characteristics?
  context: 'In the context of Stealth (TA0005), this Machine Learning approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". Use a density-based clusterer
    (e.g., DBSCAN) over features that separate genuine GUI apps from injectors: LVM_* SendMessage/PostMessage
    frequency, PE subsystem flag, window-handle count, and image path. Investigate outliers/noise points
    that show high LVM_* messaging yet lack GUI traits (no window handles, console subsystem). Report
    the top-3 features driving the outlier assignment (e.g., ''subsystem=console'',''lvm_sortitems/min=120'',''has_window=false'')
    so the analyst can confirm the contradiction between behavior and process type. Source detection guidance
    (Machine Learning): Cluster processes (e.g., DBSCAN) on features including LVM_* SendMessage/PostMessage
    frequencies, PE subsystem flag, window-handle count, and image path. Investigate outliers exhibiting
    high LVM_* messaging but lacking GUI characteristics; report the top-3 features driving the outlier
    assignment per [Anthony et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9) so
    analysts see why (e.g., ''subsystem=console'',''lvm_sortitems/min=120'',''has_window=false'').'
  answer_sources:
  - API Monitoring Logs
  - EDR Telemetry
  - 'NAI: User workstations, Application servers, Endpoint Detection and Response (EDR) platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = features(lvm_send_freq, lvm_post_freq, pe_subsystem, window_handle_count, image_path)

      labels = DBSCAN(eps, min_samples).fit_predict(X)

      | where labels == -1 AND pe_subsystem == console AND lvm_freq high

      | emit alert(image, pid, top3_features)'
- question: Did explorer.exe (or another high-integrity GUI host such as mmc.exe) spawn a command-line
    interpreter or script host such as cmd.exe, powershell.exe, cscript.exe, wscript.exe or rundll32.exe?
  context: 'In the context of Stealth (TA0005), this Symbolic Logic approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". A trusted GUI host launching
    a shell or script interpreter is an unusual parent-child relationship and a high-fidelity injection/privilege-escalation
    indicator: after ListPlanting executes inside explorer.exe, payload-spawned children inherit its integrity.
    Alert on these parent-child pairs while maintaining a per-environment allow-list of legitimate explorer-launched
    helpers (some software does legitimately spawn helpers from explorer). A match warrants reviewing
    the explorer.exe process for injected memory and the child''s command line. Source detection guidance
    (Symbolic Logic): Alert when ''C:\\Windows\\explorer.exe'' (or another high-integrity GUI host such
    as mmc.exe) spawns cmd.exe, powershell.exe, cscript.exe, wscript.exe or rundll32.exe — an unusual
    parent-child relationship treated as a high-fidelity injection/priv-esc indicator by [Elastic](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).
    Maintain a per-environment allow-list for legitimate explorer-launched helpers.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, Network egress points, DNS servers, Core network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "Sysmon(EventCode=1) | union WinEventLog(4688)\n| where parent_image IN ('C:\\Windows\\explorer.exe','*\\\
      mmc.exe')\n  AND child_image IN (cmd.exe,powershell.exe,cscript.exe,wscript.exe,rundll32.exe)\n\
      \  AND NOT allowlisted(parent_image, child_image, cmdline)\n| emit alert(host, parent_image, child_image,\
      \ cmdline)"
- question: Against a 90-day frequency distribution of explorer.exe child images/command lines, did a
    rare child (<0.1%) appear, or did explorer.exe connect to a destination IP/domain in the bottom 1st
    percentile of fleet popularity?
  context: 'In the context of Stealth (TA0005), this Statistical Method approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". Maintain a 90-day frequency
    distribution of child image names and command lines per common parent (explorer.exe) and alert on
    children in low-frequency categories (<0.1%), scoring with rarity/log-entropy weighting. Apply the
    same rarity test to explorer.exe network destinations (bottom 1st percentile of fleet popularity).
    Rare children or rare destinations from a normally-predictable GUI host suggest injected behavior.
    A positive result narrows triage to genuinely anomalous activity rather than common helper launches.
    Source detection guidance (Statistical Method): For each common parent (explorer.exe), maintain a
    90-day frequency distribution of child image names and command lines; alert on children in low-frequency
    categories (<0.1%), scoring with rarity/log-entropy weighting as in [SCADE](https://arxiv.org/abs/2412.04259).
    Apply the same rarity test to destination IP/domain for explorer.exe network connections (bottom 1st
    percentile of fleet popularity).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, Network egress points, DNS servers, Core network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = proc_create(last=90d) WHERE parent_image==''explorer.exe'' | stats count by child_image,
      cmdline | eval freq = count/total

      | where freq < 0.001

      | append (net WHERE proc==''explorer.exe'' | stats count by dest | eval pop=percentile_rank(count)
      | where pop < 0.01)

      | eval score = rarity(freq)*log_entropy(cmdline)'
- question: Compared against the fleet of explorer.exe peers (process tree, child names, network destinations,
    loaded modules), does a given explorer.exe instance deviate more than 3 standard deviations from the
    peer centroid?
  context: 'In the context of Stealth (TA0005), this Machine Learning approach addresses the requirement
    "Has the adversary attempted to elevate privileges using ListPlanting?". explorer.exe should look
    broadly similar across endpoints. Build a cross-fleet baseline of explorer.exe instances using features
    like child-process set, network destinations, and loaded modules, then flag instances that sit >3
    SD from the peer centroid and list the top-3 deviating features in the alert. An injected explorer.exe
    will diverge from its peers precisely because the payload adds atypical children, modules or connections.
    This catches novel post-injection behavior that signature rules miss. Source detection guidance (Machine
    Learning): Compare a given explorer.exe instance against the fleet of explorer.exe peers (process
    tree, child names, network destinations, loaded modules), the cross-fleet baselining advocated by
    [Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies).
    Flag instances >3 SD from the peer centroid and list the top-3 deviating features in the alert per
    [Anthony et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: User workstations, Network egress points, DNS servers, Core network switches'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'P = feature_matrix(explorer_instances: child_set, net_dests, loaded_modules, tree_shape)

      centroid, sd = robust_stats(P)

      | foreach inst: z = (inst - centroid)/sd

      | where max(z) > 3

      | emit alert(host, pid, top3=argsort(z)[:3])'
- question: Did explorer.exe initiate a network connection to a destination IP/domain on a C2 threat-intel
    feed, or one whose JA3/JA3S/HASSH fingerprint matches a known-malicious signature?
  context: 'In the context of Stealth (TA0005), this Symbolic Logic approach addresses the requirement
