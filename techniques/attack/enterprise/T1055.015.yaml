    strong ListPlanting indicator. Source detection guidance (Machine Learning): Model the per-process-pair
    frequency of LVM_SORTITEMS/LVM_SETITEMPOSITION/LVM_GETITEMPOSITION messages (the two-bytes-at-a-time
    payload-copy primitive described by [modexp](https://modexp.wordpress.com/2019/04/25/seven-window-injection-methods/)
    and used in the wild by [InvisiMole](https://www.welivesecurity.com/wp-content/uploads/2020/06/ESET_InvisiMole.pdf))
    with a seasonal time-series detector (e.g., S-H-ESD). Flag sharp spikes between processes of differing
    integrity, and surface the top-3 contributing features (message type, pair integrity delta, count
    vs. baseline) in the alert per [Anthony et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
