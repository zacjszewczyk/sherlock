- question: Did a trusted process (explorer.exe, mmc.exe) load a DLL from a user-writable path (C:\Users\,
    C:\Temp\, C:\ProgramData\) or execute code from a private RWX region not backed by a file on disk?
  context: 'In the context of Privilege Escalation (TA0004), this Symbolic Logic approach addresses the
    requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Trusted GUI processes
    normally load DLLs from system directories and execute file-backed code. Alert on Sysmon EID 7 ImageLoad
    for a trusted process where ImageLoaded resides under a user-writable path, OR when execution occurs
    from a private RWX region with no backing file on disk (the unbacked-execution observable strongly
    correlated with injection). Either condition is highly suspicious for ListPlanting, where the payload
    lives in injected memory or a planted DLL rather than a legitimate signed module. Source detection
    guidance (Symbolic Logic): Alert on Sysmon Event ID 7 ImageLoad for a trusted process (explorer.exe,
    mmc.exe) when ImageLoaded is under a user-writable path (C:\\Users\\, C:\\Temp\\, C:\\ProgramData\\),
    OR when execution occurs from a private RWX region not backed by a file on disk — the unbacked-execution
    observable correlated with injection by [Springer/IJIS](https://link.springer.com/article/10.1007/s10207-024-00836-w).'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - 'NAI: User workstations, Critical servers with GUI management tools, Endpoint Detection and Response
    (EDR) platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "Sysmon(EventCode=7) WHERE image IN (explorer.exe,mmc.exe)\n  AND image_loaded LIKE ('C:\\\
      Users\\%','C:\\Temp\\%','C:\\ProgramData\\%')\n| union (Sysmon(EventCode=8)/memscan WHERE region.protect==RWX\
      \ AND backed_by_file==false AND host_image IN (explorer.exe,mmc.exe))\n| emit alert(host, image,\
      \ image_loaded)"
- question: Among DLLs loaded by explorer.exe across the fleet, did any load have host-prevalence below
    threshold (e.g., <5 hosts), or carry an unsigned/invalid signature?
  context: 'In the context of Privilege Escalation (TA0004), this Statistical Method approach addresses
    the requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Baseline
    all DLL hashes loaded by explorer.exe across the fleet and alert on loads whose host-prevalence is
    below threshold (e.g., <5 hosts), rarity-scored. Track unsigned/invalid-signature loads as a distinct
    state. A rare or unsigned DLL loaded into a trusted GUI host is a classic planted-payload indicator;
    combining prevalence with signature status reduces noise from legitimate but uncommon plugins while
    still surfacing genuinely suspicious loads. Source detection guidance (Statistical Method): Baseline
    all DLL hashes loaded by explorer.exe across the fleet and alert on loads whose host-prevalence is
    below threshold (e.g., <5 hosts), rarity-scored as in [SCADE](https://arxiv.org/abs/2412.04259). Track
    unsigned/invalid-signature loads as a distinct state.'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - 'NAI: User workstations, Critical servers with GUI management tools, Endpoint Detection and Response
    (EDR) platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'loads = Sysmon(EventCode=7) WHERE image==''explorer.exe''

      | stats dc(host) as host_prev by dll_hash, image_loaded, signed, sig_status

      | where host_prev < 5 OR signed==false OR sig_status!=''valid''

      | eval score = rarity(host_prev) + if(signed==false,1,0)

      | sort -score'
- question: Does a sequence model (HMM/LSTM) trained on benign explorer.exe event sequences assign a low
    probability to an observed chain such as remote allocation (EID 8) -> ImageLoad from temp (EID 7)
    -> new network connection (EID 3)?
  context: 'In the context of Privilege Escalation (TA0004), this Machine Learning approach addresses
    the requirement "Has the adversary attempted to elevate privileges using ListPlanting?". ListPlanting
    and its follow-on actions produce an ordered event chain that is rare in benign explorer.exe behavior.
    Train an HMM or LSTM on benign explorer.exe event sequences and flag low-probability chains, e.g.,
    remote memory allocation followed by an ImageLoad from a temp path followed by a new outbound connection.
    Report the top-3 events/features driving the low likelihood. This captures the allocate->execute->communicate
    progression of injection even when each individual event looks innocuous in isolation. Source detection
    guidance (Machine Learning): Train a sequence model (HMM or LSTM) on benign explorer.exe event sequences
    and flag low-probability chains such as remote allocation (EID 8) -> ImageLoad from temp (EID 7) ->
    new network connection (EID 3); ordered-chain detection follows the API-sequence alignment of [Cho
    et al.](https://journals.sagepub.com/doi/full/10.1155/2015/659101) and the allocation->execute correlation
    of [Springer/IJIS](https://link.springer.com/article/10.1007/s10207-024-00836-w). Report the top-3
    events/features driving the low likelihood per [Anthony et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 8
  - 'NAI: User workstations, Critical servers with GUI management tools, Endpoint Detection and Response
    (EDR) platform'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'seq = ordered_events(explorer.exe: [EID8_alloc, EID7_imageload_temp, EID3_newconn])

      ll = LSTM.load(''explorer_seq'').log_likelihood(seq)

      | where ll < threshold

      | emit alert(host, pid, seq, top3_low_prob_events)'
- question: Did explorer.exe spawn an archiving/compression utility such as 7z.exe, rar.exe, tar.exe,
    zip.exe or compact.exe?
  context: 'In the context of Privilege Escalation (TA0004), this Symbolic Logic approach addresses the
    requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Spawning an archiver
    from explorer.exe is staging behavior incongruent with an interactive shell host and consistent with
    post-injection collection/exfil preparation. Alert when Sysmon EID 1 shows explorer.exe as the parent
    of an archiving utility. While users do double-click archives in Explorer, the launched process is
    normally the archiver''s GUI in a different process tree context; programmatic archiving spawned by
    injected code is the concern. Correlate with file-creation bursts and egress to confirm staging-then-exfil.
    Source detection guidance (Symbolic Logic): Alert when Sysmon Event ID 1 shows explorer.exe as parent
    of an archiving utility (7z.exe, rar.exe, tar.exe, zip.exe) or compact.exe — staging behavior incongruent
    with an interactive shell host, consistent with the post-injection action chains noted by [Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies).'
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: File servers, User workstations, Document management systems, Endpoint logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "Sysmon(EventCode=1) | union WinEventLog(4688)\n| where parent_image=='explorer.exe'\n  AND\
      \ child_image IN (7z.exe,rar.exe,tar.exe,zip.exe,compact.exe)\n| emit alert(host, child_image, cmdline)"
- question: Did explorer.exe exceed the 99.5th percentile of its per-host hourly file-creation count for
    that hour-of-week, or generate a burst of failed/access-denied file operations?
  context: 'In the context of Privilege Escalation (TA0004), this Statistical Method approach addresses
    the requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Baseline,
    per host, hourly file-creation counts (Sysmon EID 11) attributed to explorer.exe and alert above the
    99.5th percentile for that hour-of-week using sliding-window frequency baselining, which accounts
    for normal daily/weekly rhythms. Also track failed writes / access-denied file operations as a distinct
    burst signal, since an injector may probe locations it cannot write. A sustained, off-baseline write
    burst from explorer.exe suggests bulk data staging for exfiltration. Source detection guidance (Statistical
    Method): Per host, baseline hourly file-creation counts (Sysmon Event ID 11) from explorer.exe and
    alert above the 99.5th percentile for that hour-of-week, using sliding-window frequency baselining
    per [Bag of System Calls](https://arxiv.org/abs/1611.03053). Also track failed writes / access-denied
    file operations as a distinct burst signal.'
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: File servers, User workstations, Document management systems, Endpoint logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'w = Sysmon(EventCode=11) WHERE image==''explorer.exe''

      | bin span=1h | stats count as writes by host, hour_of_week

      | eventstats p99.5(writes) as thr by host, hour_of_week

      | where writes > thr

      | append (file_ops WHERE result==''ACCESS_DENIED'' AND image==''explorer.exe'' | bin 1h | stats
      count as denied | where denied > burst)'
- question: Compared against the peer fleet, does an explorer.exe instance's file-I/O profile (read:write
    ratio, unique directories touched, entropy of created file extensions) sit more than 3 standard deviations
    from the peer centroid?
  context: 'In the context of Privilege Escalation (TA0004), this Machine Learning approach addresses
    the requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Compare explorer.exe
    file-I/O feature vectors against the peer fleet and flag instances >3 SD from the peer centroid, surfacing
    the top-3 deviating features. Features like a skewed read:write ratio, an unusually large number of
    unique directories touched, and high entropy of created file extensions distinguish an instance staging
    diverse data from normal interactive use. This peer-relative approach adapts to environments without
    needing fixed thresholds and explains why an instance was flagged. Source detection guidance (Machine
    Learning): Compare explorer.exe file-I/O feature vectors (read:write ratio, unique directories touched,
    entropy of created file extensions) against the peer fleet per [Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies);
    flag instances >3 SD from the peer centroid and surface the top-3 deviating features per [Anthony
    et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: File servers, User workstations, Document management systems, Endpoint logs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'F = vectors(explorer_instances: rw_ratio, unique_dirs, ext_entropy, files_per_min)

      centroid, sd = robust_stats(F)

      | foreach inst: z = (inst-centroid)/sd

      | where max(z) > 3

      | emit alert(host, pid, top3=argsort(z)[:3])'
- question: Did explorer.exe send far more bytes than it received (e.g., orig_bytes:resp_bytes > 100:1
    and >10MB total) to an external destination not on a corporate/cloud allow-list?
  context: 'In the context of Privilege Escalation (TA0004), this Symbolic Logic approach addresses the
    requirement "Has the adversary attempted to elevate privileges using ListPlanting?". A large outbound:inbound
    byte asymmetry from a trusted GUI process is a volume/state signature typical of exfiltration through
    a hijacked process. Correlate Sysmon EID 3 from explorer.exe with Zeek conn.log and alert when orig_bytes
    greatly exceeds resp_bytes (e.g., >100:1 ratio and >10MB total) to an external destination not on
    a corporate/cloud allow-list. A match indicates likely data exfiltration via the injected explorer.exe
    and should trigger containment and scoping of what data left. Source detection guidance (Symbolic
    Logic): Correlate Sysmon Event ID 3 from explorer.exe with Zeek conn.log and alert when orig_bytes
    >> resp_bytes (e.g., >100:1 ratio and >10MB total) to an external destination not on a corporate/cloud
    allow-list — a volume/state asymmetry typical of exfiltration via a hijacked trusted process per [Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 3
  - 'NAI: Network egress points, DNS servers, Core switches providing flow data'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "join Sysmon(EventCode=3) AS p, conn.log AS c ON p.conn_id==c.uid\n| where p.image=='explorer.exe'\
      \ AND c.dest NOT IN corp_cloud_allowlist AND is_external(c.dest)\n  AND c.orig_bytes > 100*c.resp_bytes\
      \ AND c.orig_bytes > 10MB\n| emit alert(host, dest, orig_bytes, resp_bytes)"
- question: For any explorer.exe source/destination pair, is the standard deviation of inter-connection
    time deltas near zero (<1s jitter) over a sustained run (>10 connections), or are there repeated blocked/rejected
    (S0/REJ) attempts to one destination?
  context: 'In the context of Privilege Escalation (TA0004), this Statistical Method approach addresses
    the requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Automated
    C2 beaconing produces highly regular connection timing. For each explorer.exe source/destination pair,
    compute the standard deviation of inter-connection time deltas in conn.log; near-zero jitter (<1s)
    over a sustained run (>10 connections) indicates machine-driven beaconing rather than human activity.
    Separately profile the failure mode: repeated blocked/rejected (S0/REJ) connection attempts to a single
    destination is its own beaconing signal. Either pattern from explorer.exe points to injected C2. Source
    detection guidance (Statistical Method): For each explorer.exe source/destination pair, compute the
    standard deviation of inter-connection time deltas in conn.log; a near-zero deviation (<1s jitter)
    over a sustained run (>10 connections) indicates automated C2 beaconing. Separately profile the failure
    mode — repeated blocked/rejected (S0/REJ) connection attempts to one destination — as its own beaconing
    signal, complementing the network-anomaly approach of [Akamai](https://www.akamai.com/blog/security-research/novel-detection-methodology-process-injection-using-network-anomalies).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 3
  - 'NAI: Network egress points, DNS servers, Core switches providing flow data'
  range: Last 14 days; require sustained runs of >10 connections
  queries:
  - technology: Zeek/pseudocode
    query: 'c = conn.log attributed_to(explorer.exe via Sysmon EID3)

      | sort ts | streamstats by src,dest: delta = ts - prev(ts)

      | stats stdev(delta) as jitter, count as n by src, dest

      | where n > 10 AND jitter < 1s

      | append (conn.log WHERE proc==''explorer.exe'' AND conn_state IN (S0,REJ) | stats count by dest
      | where count > thr)'
- question: Does a one-class SVM or Isolation Forest trained on benign explorer.exe connection vectors
    (dest port, bytes sent/received, duration, dest reputation, inter-arrival jitter) score a new explorer.exe
    connection as an outlier?
  context: 'In the context of Privilege Escalation (TA0004), this Machine Learning approach addresses
    the requirement "Has the adversary attempted to elevate privileges using ListPlanting?". Train a one-class
    model on benign explorer.exe connection vectors and score new connections, alerting on outliers; report
    the top-3 contributing features. By learning the normal envelope of explorer.exe network behavior
    (ports, byte volumes, durations, destination reputation, jitter), the model flags connections that
    fall outside it without needing labeled malicious data. This catches novel C2/exfil channels through
    an injected trusted process while the feature attributions guide analyst triage. Source detection
    guidance (Machine Learning): Train a one-class SVM (or Isolation Forest, as used for stateless flow
    features by [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)) on benign explorer.exe
    connection vectors (dest port, bytes sent/received, duration, dest reputation, inter-arrival jitter)
    and score new connections, alerting on outliers; report the top-3 contributing features in the alert
    per [Anthony et al.](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Sysmon Event ID 3
  - 'NAI: Network egress points, DNS servers, Core switches providing flow data'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'X = conn_vectors(explorer.exe: dest_port, bytes_out, bytes_in, duration, dest_reputation,
      ia_jitter)

      model = OneClassSVM.load(''explorer_net'')  # or IsolationForest

      s = model.decision_function(X)

      | where s < 0

      | emit alert(host, dest, top3_features)'
