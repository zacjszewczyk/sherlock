    traffic is anomalous and consistent with the ListPlanting payload-copy/trigger primitives. Alert when
    a non-GUI process exceeds a tuned per-minute threshold (~50) of LVM_* messages. Tune the count to
    your busiest legitimate console GUI automation to manage false positives. A positive result identifies
    the injector itself, even when it never used WriteProcessMemory. Source detection guidance (Symbolic
    Logic): Alert when a process whose PE header lacks IMAGE_SUBSYSTEM_WINDOWS_GUI (a console app, service,
    or non-windowed binary) emits more than 50 SendMessage/PostMessage calls carrying LVM_* arguments
    within a one-minute window — anomalous because list-view messaging is a GUI primitive, per [Hexacorn](https://www.hexacorn.com/blog/2019/04/25/listplanting-yet-another-code-injection-trick/)
    and [modexp](https://modexp.wordpress.com/2019/04/25/seven-window-injection-methods/). Tune the count
    threshold to your environment''s busiest legitimate console GUI automation.'
