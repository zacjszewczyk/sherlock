- question: Within a 5-second window, did a lower-integrity process open a handle to a higher-integrity
    process, cause a memory allocation/protection change in it, and then send an LVM_SORTITEMS message
    to its SysListView32 control (instead of using WriteProcessMemory)?
  context: 'In the context of Privilege Escalation (TA0004), this Symbolic Logic approach addresses the
    requirement "Has the adversary attempted to elevate privileges using ListPlanting?". This ordered
    chain is the canonical ListPlanting injection signature. Correlate on a shared target PID: (1) Sysmon
    EID 10 ProcessAccess where SourceImage integrity < TargetImage integrity (a successful cross-integrity
    OpenProcess), (2) a memory allocation/protect-change in the target via Sysmon EID 8 or ETW (the allocate+execute
    correlation that is the core injection observable), and (3) an LVM_SORTITEMS trigger to the target''s
    list-view control rather than the heavily monitored WriteProcessMemory. Requiring the events to share
    the target PID and arrive in order makes this high-fidelity; a match is strong evidence of an active
    injection and likely privilege escalation when the target is high/system integrity. Source detection
    guidance (Symbolic Logic): Alert when one source/target process pair produces, within 5 seconds, the
    ordered chain: (1) Sysmon Event ID 10 ProcessAccess where SourceImage integrity < TargetImage integrity
    (a successful OpenProcess), (2) a memory allocation/protection change in the target observed via Sysmon
    Event ID 8 or ETW (the allocation+execute correlation shown to be the core injection observable by
    [Springer/IJIS](https://link.springer.com/article/10.1007/s10207-024-00836-w)), and (3) an LVM_SORTITEMS
    message sent to the target''s SysListView32 control instead of WriteProcessMemory, the exact ListPlanting
    trigger documented by [Hexacorn](https://www.hexacorn.com/blog/2019/04/25/listplanting-yet-another-code-injection-trick/)
    and [modexp](https://modexp.wordpress.com/2019/04/25/seven-window-injection-methods/). Require the
    events to share the target PID; ordered-chain matching follows the API-sequence alignment of [Cho
    et al.](https://journals.sagepub.com/doi/full/10.1155/2015/659101).'
  answer_sources:
  - Sysmon Event ID 10
  - Sysmon Event ID 8
  - 'NAI: User workstations, Domain Controllers (if admin tools are used), Management servers with GUI
    tools'
