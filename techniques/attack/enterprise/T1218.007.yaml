name: 'T1218.007: System Binary Proxy Execution: Msiexec'
id: 50155f6d-52be-4267-be3c-7dce10c352c1
description: Investigate suspected abuse of msiexec.exe, the signed native Windows Installer utility,
  for proxy execution of malicious payloads. Adversaries use msiexec.exe to install local or network-accessible
  MSI packages, apply malicious remote transforms (.mst), execute DLLs via DllRegisterServer/DllUnregisterServer
  (/y, /z), perform silent remote installs (/q /i http...), masquerade as a renamed installer, and escalate
  to SYSTEM via the AlwaysInstallElevated policy or repair-driven custom actions. This playbook helps
  an analyst examine msiexec download activity and IOC matches, suspicious switch combinations, anomalous
  parent-child lineage (Office/scripting/browser spawning msiexec), obfuscated or high-entropy command
  lines, post-execution C2 network behavior, path/signer masquerade and module-load anomalies, and privilege-escalation
  chains. It correlates Windows process-creation telemetry (Event ID 4688), Sysmon module-load and network
  events, registry auditing, and Zeek network logs (conn, http, dns, ssl, files) to distinguish legitimate
  enterprise software deployment from defense-evasion abuse.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did msiexec.exe initiate a network download of an .msi package or remote transform (.mst)
    from a URL, IP address, or UNC path whose destination, downloaded file hash, or failure pattern matches
    threat-intelligence or known-malicious indicators?
  context: Legitimate enterprise installs almost never pull packages directly from arbitrary Internet
    hosts; they use locally cached packages or managed software-deployment tooling. Correlate msiexec
    process creation (command line, parent, user) with Zeek conn/http/dns/files telemetry before applying
    the rule, then enrich destinations and hashes against threat intel. A positive result is an msiexec
    command line containing /i http(s), /i \\ (UNC), or TRANSFORMS="http where the destination IP/domain
    is known-bad or the downloaded file hash is known-malicious. Under the Stealth tactic this exposes
    payload retrieval masked by a trusted signed Microsoft binary.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: User workstations and servers; Network egress points including forward proxies and perimeter
    firewalls; DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      proc_creation where image=''msiexec.exe'' and command_line matches

      (''/i http*'' or ''/i https*'' or ''/i \\\\*'' or ''TRANSFORMS="http*'')

      | join (host, time +/-5m) Zeek conn/http/dns/files

      | where dest in threat_intel.indicators or file.sha256 in malicious_hashes

      | alert'
- question: Across msiexec downloads, do any hosts show clusters of failed or blocked retrievals (HTTP
    404/403/5xx, TCP refused/blocked) or transfer byte volumes far above the environment baseline, indicating
    rotating/dead C2 or anomalous payloads?
  context: Establish rolling host, user, and enterprise baselines before scoring. For each msiexec download
    track response bytes (Volume), attempts per minute (Frequency), and connection State by counting HTTP
    404/403/5xx and TCP refused/blocked per destination. Alert when an msiexec-attributed host shows >=3
    failed/blocked attempts within 5 minutes (rotating or dead C2 infrastructure) or transfers more than
    2x the per-environment 95th-percentile MSI byte size. Legitimate install endpoints are stable and
    reliable, so repeated failures or outsized transfers are strong defense-evasion signals.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: User workstations and servers; Network egress points including forward proxies and perimeter
    firewalls; DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfilter proc=msiexec.exe with network activity\n| stats count(http_status in [404,403,5xx])\
      \ as fails,\n        count(tcp_state in [refused,blocked]) as blocked,\n        sum(resp_bytes)\
      \ as bytes by host, dest, 5m_window\n| where (fails+blocked) >= 3\n   or bytes > 2 * percentile95(env_msi_bytes)\n\
      | alert"
- question: Does a machine-learning classifier score an msiexec remote-package execution as malicious
    (probability > 0.90) based on URL, domain, network, and reputation features?
  context: Train on benign and known-malicious process, file, and network features such as URL entropy,
    query-parameter count, destination port, domain TLD/age, response bytes, failure ratio, and reputation.
    Alert when the malicious score exceeds 0.90 and surface the top-3 contributing features (e.g., domain
    age <30 days, high URL entropy, elevated 404 ratio) in the alert text for triage. This catches novel
    remote-install abuse that fixed signatures miss while keeping analysts informed of why the model fired,
    supporting Stealth-tactic detection of disguised payload delivery.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek http.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: User workstations and servers; Network egress points including forward proxies and perimeter
    firewalls; DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nfeatures = [url_entropy, query_param_count, dest_port, domain_tld,\n            domain_age_days,\
      \ resp_bytes, failure_ratio, ti_reputation]\nscore = model.predict_proba(features)\nif score > 0.90:\
      \ alert(top3_features(features))"
- question: Was msiexec.exe executed with suspicious switch combinations such as DLL execution (/y, /z),
    silent remote install (/q /i http...), administrative extraction (/a), or a remote/UNC TRANSFORMS=
    parameter?
  context: These switches are uncommon in normal enterprise installs, which rely on packaged software-deployment
    tooling and locally cached packages. Alert when msiexec.exe command lines contain /y or /z (DllRegisterServer/DllUnregisterServer
    proxy execution), match * /q* /i http* (silent remote install), or contain TRANSFORMS= referencing
    a remote/UNC path. Allowlist legitimate deployment switch patterns to control false positives. A positive
    finding is a strong indicator of LOLBin abuse to proxy malicious code through a signed Microsoft binary.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows endpoints and servers; Centralized SIEM platform with command-line argument logging
    enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nproc_creation where image='msiexec.exe' and (\n  command_line matches '* /y*' or '* /z*'\
      \ or\n  command_line matches '* /q* /i http*' or\n  command_line matches '*TRANSFORMS=*\\\\\\\\\
      *' or '*TRANSFORMS=*http*' or\n  command_line matches '* /a *')\nand command_line not in deployment_allowlist\n\
      | alert"
- question: Which msiexec argument combinations are statistically rare for a host or user, especially
    when paired with abnormal installer exit codes (1603/1619)?
  context: Baseline normalized msiexec argument (switch) sets over 90 days per host and user. Track executions
    per day (Frequency) and install State (success vs error exit codes 1603/1619). Alert when a combination
    falls in the bottom 1st percentile of frequency or has never been observed for that host, especially
    when paired with a non-zero or abnormal exit code. Repeated failed silent installs indicate scripted
    abuse rather than legitimate deployment, exposing attacker experimentation under the cover of a trusted
    utility.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows endpoints and servers; Centralized SIEM platform with command-line argument logging
    enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nnormalize msiexec switches -> switch_set\n| stats count as freq, values(exit_code) by\
      \ host, user, switch_set over 90d\n| where freq <= percentile01(freq by host)\n   or switch_set\
      \ never_seen_for host\n| where exit_code in [1603,1619] or exit_code != 0\n| alert"
- question: Does a one-class model trained on benign msiexec argument strings flag a new command-line
    as a significant deviation (e.g., silent flags plus remote sources or DLL switches)?
  context: Train a one-class SVM or boosting ensemble on TF-IDF or word-embedding vectorized benign argument
    strings, then alert when new combinations deviate significantly. Word-embedding command-line representations
    are effective for LOLBin abuse detection. Report the top-3 influential tokens in the alert to speed
    triage. This surfaces previously unseen malicious switch combinations that escape static rules, reinforcing
    Stealth-tactic detection of msiexec proxy execution.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows endpoints and servers; Centralized SIEM platform with command-line argument logging
    enabled.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\nX = tfidf_or_embedding(benign_msiexec_arg_strings)\nmodel = OneClassSVM().fit(X)\nif model.decision_function(vectorize(new_args))\
      \ < threshold:\n    alert(top3_tokens(new_args))"
- question: Was msiexec.exe spawned by a parent process not associated with software installation, such
    as Office applications, scripting engines, browsers, or mshta.exe?
  context: Legitimate installs are spawned by software-deployment agents, services.exe, explorer.exe (interactive
    admin), or other installers. Raise an alert when msiexec.exe is spawned by parents like winword.exe,
    excel.exe, powerpnt.exe, outlook.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe, chrome.exe,
    msedge.exe, or firefox.exe. This is the canonical document/interpreter-to-LOLBin execution chain and
    a high-fidelity indicator of phishing-driven or scripted abuse leveraging a trusted binary to evade
    defenses.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows workstations and servers configured to log process creation events with parent process
    information.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nproc_creation where image='msiexec.exe' and parent_image in (\n  'winword.exe','excel.exe','powerpnt.exe','outlook.exe',\n\
      \  'powershell.exe','wscript.exe','cscript.exe','mshta.exe',\n  'chrome.exe','msedge.exe','firefox.exe')\n\
      | alert"
- question: Which msiexec parent-child relationships are statistically rare for a host or user, particularly
    where the parent image runs from a user-writable path (Temp, Downloads, AppData)?
  context: Establish rolling host and user baselines of parent-child spawn frequencies. Flag msiexec.exe
    executions where the parent occurs in less than 1% of historical msiexec spawns or has never been
    seen for that host, and weight the score higher when the parent image runs from a user-writable path
    such as Temp, Downloads, or AppData. Rare parentage combined with user-writable execution paths strongly
    suggests adversary-staged tooling proxying through msiexec rather than managed software deployment.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows workstations and servers configured to log process creation events with parent process
    information.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats count as cnt by host, parent_image where child=''msiexec.exe'' over baseline

      | where cnt/total_msiexec(host) < 0.01 or parent_image never_seen_for host

      | where parent_path matches ''*\\Temp\\*'' or ''*\\Downloads\\*'' or ''*\\AppData\\*'' -> boost_score

      | alert'
- question: Does a graph-based lineage model flag an msiexec process tree as a low-probability attack
    sequence (e.g., browser/Office to msiexec)?
  context: Apply the ProblemChild supervised graph approach over parent-child lineage and command-line
    features to score msiexec chains. The model groups disparate events into attack sequences and suppresses
    common benign chains, alerting on low-probability paths and surfacing the top-3 lineage/command features
    driving the score. This connects the dots across multi-stage execution that single-event rules miss,
    exposing stealthy LOLBin chains rooted in documents or interpreters.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: All Windows workstations and servers configured to log process creation events with parent process
    information.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '>-

      graph = build_lineage_graph(process_events)

      score = problemchild.score(subtree_rooted_at(msiexec))

      if score < benign_threshold: alert(top3_lineage_cmd_features)'
- question: Within minutes of an msiexec.exe execution, did the host establish or repeatedly fail to establish
    network connections to an external destination matching C2 threat intelligence unrelated to the package
    download?
  context: msiexec loaders frequently retrieve a payload and then beacon to second-stage C2. Correlate
    msiexec.exe events with Zeek conn.log within five minutes and alert when destinations (per dns.log)
    match C2 threat intel not related to the installer download. Also account for repeated blocked/refused
    connections to candidate C2. A positive result links post-delivery network behavior to the msiexec
    execution, exposing the loader-to-C2 pattern characteristic of stealthy proxy execution.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Perimeter firewalls and network taps capturing egress traffic; DNS resolvers; All Windows workstations
    and servers.'
  range: Last 90 days; correlate network within 5 minutes of each msiexec execution
  queries:
  - technology: Zeek/pseudocode
    query: ">-\nfor each msiexec.exe proc_creation event:\n  window = [t, t+5m]\n  match conn.log/dns.log\
      \ dest in window against c2_threat_intel\n  exclude installer_download_dest\n| alert on match or\
      \ on repeated refused/blocked attempts"
- question: After msiexec executions, do outbound connections show rare JA3/JA3S TLS fingerprints, high-entropy
    or self-signed certificates, or clusters of blocked/NXDOMAIN responses indicative of failed beaconing?
  context: Establish enterprise baselines, then analyze JA3/JA3S hashes on post-msiexec connections and
    flag those seen in less than 0.1% of connections or with high certificate-name entropy (self-signed).
    Explicitly track State by counting blocked/refused outbound attempts and NXDOMAIN responses per host
    after msiexec, since failed beacons to dead C2 are a distinct signal. Rare TLS fingerprints and self-signed
    certs reveal custom malware tooling attempting to blend into encrypted egress traffic.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Perimeter firewalls and network taps capturing egress traffic; DNS resolvers; All Windows workstations
    and servers.'
  range: Last 90 days; correlate network within 5 minutes of each msiexec execution
  queries:
  - technology: Zeek/pseudocode
    query: ">-\npost_msiexec ssl.log\n| where ja3 in rarest_0.1pct or cert_name_entropy high or self_signed\n\
      | stats count(conn_state in [refused,blocked]) as fails,\n        count(dns_rcode=NXDOMAIN) as nx\
      \ by host\n| alert"
- question: Does a forecasting model show outbound byte volume or connection count after msiexec exceeding
    the expected baseline by more than 3 standard deviations?
  context: Use ARIMA (or a seasonal-naive model) to forecast expected orig_bytes and connection count
    per host, and alert when actual volume after an msiexec execution exceeds the forecast by more than
    3 standard deviations. Include the observed-vs-expected delta and the destination as the top contributing
    features in the alert. Unexpected egress volume spikes following msiexec can indicate data staging,
    payload pull, or active C2 traffic that static thresholds would miss.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Perimeter firewalls and network taps capturing egress traffic; DNS resolvers; All Windows workstations
    and servers.'
  range: Last 90 days; correlate network within 5 minutes of each msiexec execution
  queries:
  - technology: ML/pseudocode
    query: ">-\nbaseline = ARIMA.fit(host.orig_bytes_timeseries)\nexpected = baseline.forecast(window_after_msiexec)\n\
      if actual > expected + 3*sigma:\n    alert(delta=actual-expected, dest=top_destination)"
- question: Does any msiexec.exe command line contain obfuscation markers such as powershell -e, certutil,
    rundll32, environment-variable substitution, or long Base64 strings?
  context: Obfuscation hides payload references and intent within otherwise trusted msiexec invocations.
    Alert when msiexec.exe command lines contain substrings like powershell -e, certutil, rundll32, environment-variable
    obfuscation, or long Base64 strings matching [A-Za-z0-9+/=]{50,}. These are known markers of command-line
    obfuscation paired with LOLBins. A positive result indicates an attacker is encoding or chaining payloads
    to evade keyword-based detection while leveraging a signed binary.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Centralized SIEM or data lake containing command-line logs from all Windows endpoints and servers.'
  range: Last 30 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nproc_creation where image='msiexec.exe' and command_line matches (\n  '*powershell -e*'\
      \ or '*certutil*' or '*rundll32*' or\n  '*%*%*' (env-var subst) or regex '[A-Za-z0-9+/=]{50,}')\n\
      | alert"
- question: Which msiexec command lines are both rare (occurring fewer than 5 times) and high entropy
    (99th percentile Shannon entropy) over a 30-day baseline?
  context: Baseline unique msiexec command strings over 30 days, compute Shannon entropy, and alert when
    a command occurs fewer than 5 times AND its entropy falls in the 99th percentile for that utility,
    surfacing the contributing command text for triage. High character-level entropy combined with rarity
    signals encoded payloads, caret/quote insertion, or long Base64 blobs that obfuscate intent. This
    statistical approach catches novel obfuscation that fixed substring rules do not enumerate.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Centralized SIEM or data lake containing command-line logs from all Windows endpoints and servers.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      stats count as freq by command_line where image=''msiexec.exe'' over 30d

      | eval entropy = shannon(command_line)

      | where freq < 5 and entropy >= percentile99(entropy)

      | alert with command_line'
- question: Does a language-model anomaly detector flag a new msiexec command line as a high reconstruction
    or anomaly score relative to legitimate command patterns?
  context: Train a character-level LSTM autoencoder or an ELECTRA-style small language model with command-aware
    preprocessing (collapse GUIDs, paths, and hex to general tokens) on legitimate msiexec command lines,
    then alert on high reconstruction or anomaly score for new commands. Report the highest-scoring obfuscated
    tokens for triage. Language models capture the structure of normal command lines and flag subtle obfuscation
    that escapes regex and entropy thresholds, strengthening Stealth-tactic detection.
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Centralized SIEM or data lake containing command-line logs from all Windows endpoints and servers.'
  range: Last 30 days
  queries:
  - technology: ML/pseudocode
    query: ">-\npreproc = collapse(GUIDs, paths, hex -> tokens)\nmodel = LSTM_autoencoder.fit(preproc(benign_msiexec_cmds))\n\
      if model.recon_error(preproc(new_cmd)) > threshold:\n    alert(highest_scoring_tokens(new_cmd))"
- question: Did a process claiming msiexec identity (OriginalFileName/Description=msiexec or image msiexec.exe)
    execute from a path other than System32/SysWOW64, or run without a valid Microsoft Authenticode signature?
  context: Legitimate msiexec.exe runs only from C:\Windows\System32 or C:\Windows\SysWOW64 and is Microsoft-signed.
    Alert when a process with OriginalFileName/Description msiexec (or image name msiexec.exe) executes
    from any other path, or is not Microsoft-signed with a valid Authenticode signature. This detects
    renamed or masqueraded installers used to bypass name-based application control, a hallmark of defense
    evasion under the Stealth tactic.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=7
  - 'NAI: All Windows workstations and servers with image-path, OriginalFileName/signer, and module-load
    (Sysmon Event ID 7) logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nproc_creation where (original_file_name='msiexec' or image='msiexec.exe')\nand image_path\
      \ not in (\n  'C:\\\\Windows\\\\System32\\\\msiexec.exe',\n  'C:\\\\Windows\\\\SysWOW64\\\\msiexec.exe')\n\
      or signature_status != 'valid_microsoft'\n| alert"
- question: Which processes loaded the Windows Installer modules (msi.dll/msihnd.dll) for the first time,
    or loaded msiexec from an unexpected image path, over a 30-day baseline?
  context: Baseline which processes load msi.dll/msihnd.dll over 30 days. Alert when a process never previously
    observed loading these modules does so, or when msiexec.exe appears as the loaded image under an unexpected
    image path (rarity in the bottom 1st percentile). A non-installer process loading Windows Installer
    modules can indicate masquerading or in-memory abuse of installer functionality to evade name-based
    controls.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=7
  - 'NAI: All Windows workstations and servers with image-path, OriginalFileName/signer, and module-load
    (Sysmon Event ID 7) logging enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nmodule_load (Sysmon EID 7) where module in ('msi.dll','msihnd.dll')\n| stats values(image)\
      \ by module over 30d\n| where image never_seen_loading module\n   or (image='msiexec.exe' and image_path\
      \ rare bottom_1pct)\n| alert"
- question: Does a classifier flag a process as a likely msiexec masquerade based on image-path deviation,
    signer status, OriginalFileName mismatch, and parent rarity?
  context: Score processes on features combining image-path deviation from System32/SysWOW64, Authenticode
    signer status, OriginalFileName mismatch, and parent rarity, then alert on high masquerade probability
    and surface the top-3 features (path mismatch, invalid signature, rare parent) in the alert. This
    consolidates multiple weak masquerade signals into a single high-confidence verdict, catching renamed
    installers that any single check might miss.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Sysmon EventCode=7
  - 'NAI: All Windows workstations and servers with image-path, OriginalFileName/signer, and module-load
    (Sysmon Event ID 7) logging enabled.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: '>-

      features = [path_deviation, signer_invalid, origname_mismatch, parent_rarity]

      score = masquerade_model.predict_proba(features)

      if score > threshold: alert(top3_features(features))'
- question: Is the AlwaysInstallElevated policy enabled (both HKLM and HKCU set to 1) and is msiexec.exe
    installing packages as SYSTEM/elevated integrity for a non-administrative invoking user?
  context: AlwaysInstallElevated lets any user install MSI packages with SYSTEM privileges, a documented
    escalation primitive. Alert when both HKLM\Software\Policies\Microsoft\Windows\Installer\AlwaysInstallElevated
    and the matching HKCU value are set to 1, and when msiexec.exe installs a package at SYSTEM/elevated
    integrity for a non-administrative invoking user. A positive result indicates privilege escalation
    via the Windows Installer that an adversary can use to deepen access while appearing as routine installation.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Security EventCode=4657
  - WinEventLog:Sysmon EventCode=13
  - 'NAI: All Windows workstations and servers; registry-auditing for installer policy keys.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nregistry where key endswith 'Windows\\\\Installer\\\\AlwaysInstallElevated'\nand value=1\
      \ for both HKLM and HKCU\n| join proc_creation where image='msiexec.exe'\n  and integrity_level\
      \ in ('System','High')\n  and invoking_user not in administrators\n| alert"
- question: Are msiexec repair operations (/fa, /f) or SYSTEM-context msiexec child processes occurring
    at abnormal frequency or via previously unseen lineage on a host?
  context: Baseline msiexec repair operations (/fa, /f) and SYSTEM-context msiexec children per host over
    90 days. Alert when frequency exceeds the per-host 99th percentile or when a child process spawned
    from msiexec runs at SYSTEM where that lineage was never previously observed. Repair-driven custom
    actions can spawn SYSTEM-context children, providing a stealthy escalation path; statistical baselining
    surfaces abuse hidden among legitimate maintenance activity.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Security EventCode=4657
  - WinEventLog:Sysmon EventCode=13
  - 'NAI: All Windows workstations and servers; registry-auditing for installer policy keys.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfilter image='msiexec.exe' and (command_line matches '* /fa*' or '* /f *')\n| stats count\
      \ as cnt, values(child_lineage) by host over 90d\n| where cnt > percentile99(host)\n   or (child.integrity='System'\
      \ and lineage never_seen_for host)\n| alert"
- question: Does a graph-based lineage model flag an msiexec-rooted process tree that gains SYSTEM integrity
    as a low-probability escalation chain?
  context: Apply graph-based lineage scoring to msiexec-rooted process trees that gain SYSTEM integrity,
    flag low-probability elevation paths, and surface the top-3 features (integrity-level jump, repair
    switch, rare child) in the alert. By modeling the full escalation chain rather than isolated events,
    this detects privilege escalation via Windows Installer that blends into normal install/repair activity,
    supporting the Stealth tactic.
  answer_sources:
  - Windows Event ID 4688
  - WinEventLog:Security EventCode=4657
  - WinEventLog:Sysmon EventCode=13
  - 'NAI: All Windows workstations and servers; registry-auditing for installer policy keys.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\ngraph = build_lineage_graph(process_events)\ntree = subtree_rooted_at(msiexec) where gains\
      \ integrity='System'\nscore = problemchild.score(tree)\nif score < benign_threshold:\n    alert(top3_features=[integrity_jump,\
      \ repair_switch, rare_child])"
