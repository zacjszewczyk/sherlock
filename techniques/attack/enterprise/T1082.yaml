    obfuscated command line, unusual fan-out, or anomalous cloud read API use); a negative result means
    observed activity matches expected administrative or productivity behavior. Investigate the named
    area of interest (All Windows hosts with command-line and PowerShell script block logging enabled,
    especially servers hosting sensitive applications and administrative workstations.) and pivot from
    any hit to the originating process, account, host role, and any follow-on lateral movement, collection,
    or exfiltration.'
