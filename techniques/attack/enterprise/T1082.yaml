  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Rare inventory-command prevalence\nFOR each (host, user, process_type)\
      \ OVER trailing 30d:\n  compute baseline = {mean, stddev, p1, p99, entropy_p99} of discovery_cmd\
      \ metrics\n  metrics = {count_per_interval, cmdline_len, cmdline_entropy, redirect_bytes,\n    \
      \         fail_ratio /*nonzero exit, access-denied*/}\nEVALUATE current_window AGAINST baseline:\n\
      \  FLAG IF count > mean+3*stddev OR count < p1 OR entropy > p99\n         OR fail_ratio > p99_baseline\n\
      \  RAISE confidence IF >=3 distinct inventory cmds back-to-back\nALERT include observed_vs_expected,\
      \ contributing_commands, timing_deviation"
- question: 'Using a machine-learning model (''System-info sequence classifier''), can you detect system
    information discovery hidden among routine activity? Specifically: Train a classifier on process-tree
    features, parent-child conditional probabilities, command-line tokens/embeddings, host role, and follow-on
    network behavior to separate routine administration from discovery, following parent-child anomaly
    scoring in [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676) and embedding-based
    command-line outlier detection in [BERT Embeddings for Command-Line Anomaly Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/).
    For multi-stage intrusions, correlate discovery into a causal chain using provenance-graph models
    [KAIROS: Whole-system Provenance Intrusion Detection, Cheng et al](https://tfjmp.org/publications/2024-sp.pdf).
    Alert text MUST surface the top-3 contributing features (e.g., improbable parent, rare command token,
    off-baseline timing) and group related commands into a single reconstructed reconnaissance sequence
    for triage.'
