- question: 'Using statistical baselining (''Command-line entropy and obfuscation baseline''), can you
    identify system information discovery that deviates from normal behavior? Specifically: For each host,
    compute Shannon entropy and character-frequency features of command lines per process, baselining
    typical values for `cmd.exe`/`powershell.exe`. Alert when entropy exceeds the 99th percentile for
    that host/process type (indicating obfuscation or scripted complexity), and treat repeated parse-error/failed
    executions as a distinct signal. Use obfuscation-aware features from [Command-line Obfuscation Detection
    using Small Language Models, Tran et al](https://arxiv.org/html/2408.02637v1) and embedding-outlier
    scoring from [BERT Embeddings for Command-Line Anomaly Detection, CrowdStrike](https://www.crowdstrike.com/en-us/blog/bert-embeddings-new-approach-for-command-line-anomaly-detection/);
    derive the entropy cutoff per environment from observed distributions.'
