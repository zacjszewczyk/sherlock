name: 'T1082: System Information Discovery'
id: 4ed8c2d0-5f27-4789-9de7-ca93f38b2479
description: 'This playbook helps an analyst determine whether an adversary has performed System Information
  Discovery (T1082): enumerating the operating system, hostname, domain membership, patch/hotfix level,
  architecture, hardware profile, virtualization state, and installed software of compromised assets to
  shape follow-on actions. It correlates host-based process and script telemetry (Windows 4688/Sysmon
  EID 1, PowerShell 4104, auditd execve, macOS unified log, ESXi vmkernel, network-device syslog) with
  cloud control-plane and network telemetry to surface inventory activity across Windows, Linux, macOS,
  ESXi, network devices, and IaaS. Investigative angles include: execution of native inventory utilities
  (systeminfo, hostname, ver, wmic, Get-ComputerInfo, uname, lscpu, sw_vers, esxcli, show version); discovery
  commands launched by anomalous parents (Office apps, browsers, service binaries) or under service-account
  context; command-line obfuscation and high entropy; bursts of discovery commands that exceed per-entity
  baselines; remote-administration fan-out sweeps (WinRM/RPC/SMB/SSH) to many unique hosts; and anomalous
  cloud read/enumeration API calls (ec2:Describe*, compute.instances.get, virtualMachines/read). Detection
  blends symbolic-logic watchlists and rules, statistical baselining (percentiles, mu+3sigma, entropy,
  IQR, stack counting), and machine learning (provenance/graph models, isolation forests, time-series
  residual outlier detection, command-line embeddings, IAM behavior graphs) to produce evasion-resistant,
  explainable alerts for the Discovery tactic.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
