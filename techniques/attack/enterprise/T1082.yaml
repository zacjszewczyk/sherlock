    frequency (count/min), command-line length, output-redirection byte volume, and process exit-code
    success/failure over a rolling 30-day window. Flag events below the 1st percentile of historical prevalence
    for that host or above the 99th percentile of command-line entropy, and separately profile failed/error
    executions (non-zero exit codes, access-denied) as a distinct signal of automated enumeration. Apply
    MITRE''s rare-parent baseline logic [CAR-2014-11-002: Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/);
    derive thresholds per dataset by computing each host''s own percentiles before deployment. Raise confidence
    when >=3 distinct inventory commands run back-to-back from a host that rarely performs admin discovery.
    A positive result means an entity is gathering system-inventory information in a pattern inconsistent
    with its established baseline or role (e.g., improbable parent process, off-baseline volume/timing,
    obfuscated command line, unusual fan-out, or anomalous cloud read API use); a negative result means
    observed activity matches expected administrative or productivity behavior. Investigate the named
    area of interest (Endpoint Detection and Response (EDR) logs and Windows Event Logs from all workstations
    and servers, with a focus on Domain Controllers, administrative jump boxes, and developer workstations.)
    and pivot from any hit to the originating process, account, host role, and any follow-on lateral movement,
    collection, or exfiltration.'
