- question: 'Using a machine-learning model (''Discovery-volume forecasting with residual outlier detection''),
    can you detect system information discovery hidden among routine activity? Specifically: Use a time-series
    forecasting model (ARIMA/Prophet) to predict expected discovery-command volume (count/min) per user/host,
    then run an unsupervised outlier detector such as [Extended Isolation Forest, Hariri et al](https://doi.org/10.1109/TKDE.2019.2947676)
    on the forecast residuals to flag spikes consistent with automated reconnaissance. Surface the top-3
    contributing features (observed-vs-expected count, contributing command names, time-of-day deviation)
    in the alert so analysts can validate quickly.'
