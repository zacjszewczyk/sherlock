- question: 'Using deterministic rule logic (''Remote admin-port fan-out rule''), can you determine whether
    system information discovery is occurring? Specifically: Trigger when a single source IP in Zeek conn.log
    opens new connections on remote-administration ports (135/tcp, 445/tcp, 5985/tcp, 5986/tcp, 22/tcp)
    to more than 20 unique destinations within 10 minutes. Pair with failed/half-open connection state
    (Zeek `conn_state` S0/REJ/RSTOS0) to distinguish scanning sweeps from legitimate admin sessions, an
    explicit failure-mode signal, and treat enumeration sweeps as graph outliers per [An Unsupervised
    Multi-Detector Approach for Identifying Malicious Lateral Movement, Bohara et al](https://doi.org/10.1109/SRDS.2017.31).'
