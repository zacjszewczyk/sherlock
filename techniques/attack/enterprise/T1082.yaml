questions:
- question: 'Using deterministic rule logic (''Discovery-command watchlist''), can you determine whether
    system information discovery is occurring? Specifically: Monitor process creation (Windows 4688 /
    Sysmon EID 1) and PowerShell script-block logs (4104) for system-information utilities such as `systeminfo`,
    `hostname`, `ver`, `wmic os get`, `wmic computersystem`, `Get-ComputerInfo`, `Get-WmiObject Win32_OperatingSystem`,
    `reg query HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion`, plus `uname -a`, `lscpu`, `cat /etc/os-release`,
    `sw_vers`, `system_profiler`, `systemsetup -getcomputername`, and network-device `show version`. Alert
    when launched by anomalous parents (Office apps, browsers, service binaries) per [Unusual Parent Process
    For Cmd.EXE, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/)
    and [CAR-2021-02-002: Get System Elevation](https://car.mitre.org/analytics/CAR-2021-02-002/), or
    when chained with output redirection (`>`, `| Out-File`). Maintain these as a tuned floor rather than
    the sole detection, as recommended by [Identifying and Mitigating Living off the Land Techniques,
    CISA/NSA](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF)
    and [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/).'
  context: 'Tactic context (Discovery / TA0007): adversaries enumerate host and environment details to
    orient themselves and decide whether and how to fully compromise the target before acting. Evidence
    under investigation: Discovery commands and scripts enumerate the local operating system, hostname,
    domain membership, patch level, architecture, hardware profile, virtualization state, and installed
    software. The observable evidence is the execution of common system inventory tools or script blocks
    that request host information rather than normal user productivity functions. Approach (Discovery-command
    watchlist - Symbolic Logic): Monitor process creation (Windows 4688 / Sysmon EID 1) and PowerShell
    script-block logs (4104) for system-information utilities such as `systeminfo`, `hostname`, `ver`,
    `wmic os get`, `wmic computersystem`, `Get-ComputerInfo`, `Get-WmiObject Win32_OperatingSystem`, `reg
    query HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion`, plus `uname -a`, `lscpu`, `cat /etc/os-release`,
    `sw_vers`, `system_profiler`, `systemsetup -getcomputername`, and network-device `show version`. Alert
    when launched by anomalous parents (Office apps, browsers, service binaries) per [Unusual Parent Process
    For Cmd.EXE, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/)
    and [CAR-2021-02-002: Get System Elevation](https://car.mitre.org/analytics/CAR-2021-02-002/), or
    when chained with output redirection (`>`, `| Out-File`). Maintain these as a tuned floor rather than
    the sole detection, as recommended by [Identifying and Mitigating Living off the Land Techniques,
    CISA/NSA](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF)
    and [LOLBins Abuse, Red Canary](https://redcanary.com/blog/blog/lolbins-abuse/). A positive result
    means an entity is gathering system-inventory information in a pattern inconsistent with its established
    baseline or role (e.g., improbable parent process, off-baseline volume/timing, obfuscated command
    line, unusual fan-out, or anomalous cloud read API use); a negative result means observed activity
    matches expected administrative or productivity behavior. Investigate the named area of interest (Endpoint
    Detection and Response (EDR) logs and Windows Event Logs from all workstations and servers, with a
    focus on Domain Controllers, administrative jump boxes, and developer workstations.) and pivot from
    any hit to the originating process, account, host role, and any follow-on lateral movement, collection,
    or exfiltration.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Endpoint Detection and Response (EDR) logs and Windows Event Logs from all workstations and
    servers, with a focus on Domain Controllers, administrative jump boxes, and developer workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Discovery-command watchlist\nMATCH events WHERE\n  cmdline\
      \ MATCHES /(systeminfo|hostname|ver|wmic\\s+(os|computersystem)\\s+get|Get-ComputerInfo|Get-WmiObject.*Win32_(OperatingSystem|ComputerSystem)|reg\
      \ query .*CurrentVersion|uname\\s+-a|lscpu|cat\\s+\\/etc\\/os-release|sw_vers|system_profiler|systemsetup|esxcli\\\
      s+system|show\\s+version)/i\n  AND (parent_image NOT IN approved_parent_allowlist\n       OR account_type\
      \ == 'service'\n       OR cmdline MATCHES /(&&|\\||;|>|Out-File)/)\nALERT include matched_utility,\
      \ parent_image, account, host_role"
- question: 'Using statistical baselining (''Rare inventory-command prevalence''), can you identify system
    information discovery that deviates from normal behavior? Specifically: Build a per-host and per-host-role
    baseline of discovery-command frequency (count/min), command-line length, output-redirection byte
    volume, and process exit-code success/failure over a rolling 30-day window. Flag events below the
    1st percentile of historical prevalence for that host or above the 99th percentile of command-line
    entropy, and separately profile failed/error executions (non-zero exit codes, access-denied) as a
    distinct signal of automated enumeration. Apply MITRE''s rare-parent baseline logic [CAR-2014-11-002:
    Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/); derive thresholds per dataset
    by computing each host''s own percentiles before deployment. Raise confidence when >=3 distinct inventory
    commands run back-to-back from a host that rarely performs admin discovery.'
  context: 'Tactic context (Discovery / TA0007): adversaries enumerate host and environment details to
