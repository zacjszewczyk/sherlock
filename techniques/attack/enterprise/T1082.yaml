- question: 'Using deterministic rule logic (''Approved-parent allow-list''), can you determine whether
    system information discovery is occurring? Specifically: Maintain an allow-list of approved parent
    processes for discovery commands (e.g., `explorer.exe`, `powershell.exe`, `cmd.exe`, known admin tooling).
    Alert when a discovery command is spawned by a parent not on the list (Office apps, browsers, web/app
    server processes) or under a service-account context on a non-admin server, aligned with [Unusual
    Parent Process For Cmd.EXE, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/)
    and the rare-parent rationale in [CAR-2014-11-002: Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
