- question: 'Using deterministic rule logic (''Discovery command-line regex rules''), can you determine
    whether system information discovery is occurring? Specifically: Create SIEM rules using regular expressions
    against the command-line field (Windows 4688, Sysmon EID 1) or script-block text (4104) for known
    discovery commands (`systeminfo`, `hostname`, `ipconfig /all`, `netstat -an`, `wmic os get`, `Get-WmiObject
    -Class Win32_ComputerSystem`). Flag command-chaining operators (`&&`, `|`, `;`) or output redirection
    (`>`) used with these commands, and use the utility/argument watchlists in [CAR-2021-02-002: Get System
    Elevation](https://car.mitre.org/analytics/CAR-2021-02-002/). Keep this deterministic layer even when
    ML is added, per [Identifying and Mitigating Living off the Land Techniques, CISA/NSA](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).'
  context: 'Tactic context (Discovery / TA0007): adversaries enumerate host and environment details to
    orient themselves and decide whether and how to fully compromise the target before acting. Evidence
    under investigation: Observed command-line arguments or PowerShell script block content contain specific
    strings or patterns indicative of system information discovery, such as `systeminfo`, `wmic os get`,
    `Get-ComputerInfo`, `ver`, or multiple discovery commands chained together. Approach (Discovery command-line
    regex rules - Symbolic Logic): Create SIEM rules using regular expressions against the command-line
    field (Windows 4688, Sysmon EID 1) or script-block text (4104) for known discovery commands (`systeminfo`,
    `hostname`, `ipconfig /all`, `netstat -an`, `wmic os get`, `Get-WmiObject -Class Win32_ComputerSystem`).
    Flag command-chaining operators (`&&`, `|`, `;`) or output redirection (`>`) used with these commands,
    and use the utility/argument watchlists in [CAR-2021-02-002: Get System Elevation](https://car.mitre.org/analytics/CAR-2021-02-002/).
    Keep this deterministic layer even when ML is added, per [Identifying and Mitigating Living off the
    Land Techniques, CISA/NSA](https://media.defense.gov/2024/Feb/07/2003389936/-1/-1/0/JOINT-GUIDANCE-IDENTIFYING-AND-MITIGATING-LOTL.PDF).
