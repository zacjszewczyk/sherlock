name: 'T1187: Forced Authentication'
id: 140f6b67-b4e7-4c74-bacf-64bec0950fbd
description: 'Investigate possible Forced Authentication (T1187), in which an adversary coerces a Windows
  host into automatically sending the current user''s credential material (NetNTLM hashes) to an attacker-controlled
  endpoint over SMB (TCP/139,445) or WebDAV (HTTP/HTTPS on TCP/80,443). This playbook helps an analyst
  hunt the full chain: lure files that reference remote resources (.lnk/.scf/.url with UNC or file://
  targets, Office/HTML documents with embedded external template/OLE references such as file://[remote]/Normal.dotm),
  the subsequent outbound NTLM authentication those lures trigger, and protocol coercion methods such
  as MS-EFSRPC (EfsRpcOpenFileRaw) used to drive NTLM relay. It correlates endpoint file creation/modification
  and process telemetry (Sysmon EID 1/11, Windows EID 4688/4663) with network evidence (Zeek conn/smb/ntlm/http/files/dns
  logs) to surface outbound SMB/WebDAV egress to external or threat-intel-flagged infrastructure, rare
  GeoIP/ASN destinations, challenge/failure spikes, abnormal workstation-to-workstation SMB fan-out indicative
  of relay, and statistically anomalous unique-destination counts. Symbolic-logic rules, statistical baselining,
  and machine-learning classifiers are provided so the analyst can determine whether observed activity
  reflects benign enterprise behavior or active credential theft via forced authentication.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Is any internal RFC1918 host initiating outbound SMB (TCP/139,445) or WebDAV (TCP/80,443)
    to an external destination that appears on a threat-intelligence feed of known-malicious infrastructure?
  context: 'Forced authentication exfiltrates NetNTLM credential material the instant a host touches an
    attacker resource. Joining Zeek conn.log with curated TI lets you catch the highest-confidence cases:
    an internal id.orig_h reaching an external id.resp_h on the feed over 445/139, or over 80/443 where
    http.log shows WebDAV verbs (PROPFIND/OPTIONS/MOVE) or an ''Authorization: NTLM'' header on the same
    connection — the rogue-WebDAV capture pattern produced by tools like Responder. A positive result
    is strong evidence of credential theft to known-bad infrastructure and warrants immediate host isolation
    and credential reset. A negative result does not clear the host; combine with the TI-independent egress
    rule below. This is tactic-specific to Credential Access because the captured hashes feed offline
    brute force or live NTLM relay.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateways, DNS resolvers, Perimeter firewalls, Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      conn = load(Zeek conn.log) where id.orig_h in RFC1918 and id.resp_h not in RFC1918
      join ti = threat_intel_feed on conn.id.resp_h == ti.ip
      alert if conn.id.resp_p in (445,139)
      OR (conn.id.resp_p in (80,443) AND exists http.log where http.method in ('PROPFIND','OPTIONS','MOVE') or header 'Authorization: NTLM' on same uid)
  - technology: Zeek/pseudocode
    query: |-
      for c in conn.log:
        if c.id.orig_h in RFC1918 and c.id.resp_h in ti_malicious and c.id.resp_p in {139,445}: emit alert
        if c.id.resp_p in {80,443} and ntlm.log has uid==c.uid: emit alert(webdav_ntlm)
- question: Independent of threat intelligence, is any internal RFC1918 host initiating SMB to a non-RFC1918
    destination on TCP/139,445 or WebDAV/HTTP with NTLMSSP to an external host?
  context: Legitimate workstations never authenticate over SMB to the public Internet, so ANY outbound
    SMB egress is near-zero-false-positive and CISA explicitly recommends blocking outbound TCP/445 at
    the perimeter (AA20-258A). This rule does not rely on TI, so it catches first-use attacker infrastructure
    that no feed has yet labeled. Parse Zeek smb.log/ntlm.log/dce_rpc fields to confirm an actual authentication
    attempt rather than a stray SYN. A positive result should be treated as a likely forced-authentication
    credential leak; ideally the egress is also blocked. For Credential Access this is the broadest safety
    net for hash exfiltration over the perimeter.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateways, DNS resolvers, Perimeter firewalls, Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      alert when id.orig_h in RFC1918 AND id.resp_h not in RFC1918 AND (
        id.resp_p in (139,445)
        OR (proto=http AND ntlmssp_present=true))
      enrich with smb.log/ntlm.log/dce_rpc to confirm auth; action=block+alert
- question: Are outbound SMB/WebDAV connections going to rare destination countries or ASNs relative to
    a 30-day baseline?
  context: 'Rarity is a high-precision heuristic: roughly 99.7% of real threats are rare within a population.
    Enrich Zeek conn.log with GeoIP/ASN and build a 30-day frequency distribution of destination countries
    and ASNs for outbound 139/445/80/443; alert on any destination in the bottom 5%. A positive result
    flags an unusual external endpoint that merits inspection for NTLM capture even absent a TI hit. A
    negative result means the destination is common in your environment, lowering (but not eliminating)
    suspicion. For Credential Access, attacker capture servers are typically novel and geographically/ASN-rare
    versus normal enterprise traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateways, DNS resolvers, Perimeter firewalls, Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = freq_dist(country, asn) over last 30d for outbound conn where resp_p in (139,445,80,443)
      for c in today.conn: if percentile(base, c.country)<5 or percentile(base, c.asn)<5: alert(rare_geo_asn)
- question: Are there spikes in SMB/WebDAV challenge or failure activity — blocked outbound 445, WebDAV
    401/NTLM-challenge loops, or EFSRPC/SMB authentication failures — on any host?
  context: Error and failure states are a distinct signal. Coercion and relay attempts frequently produce
    bursts of failed or challenged authentication. Baseline per-host rates of blocked outbound 445 connections,
    WebDAV HTTP 401/NTLM-challenge loops, and EFSRPC/SMB auth failures, then alert on sudden spikes. A
    positive result suggests active coercion (e.g., PetitPotam-style EFSRPC abuse) or relay handshakes
    in progress; correlate with KB5005413 mitigations. A negative result means authentication outcomes
    are stable. This is tactic-specific because relayed/coerced credential flows generate abnormal challenge/failure
    patterns during the theft.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateways, DNS resolvers, Perimeter firewalls, Web proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per host: count(blocked_445), count(http_401_ntlm_loop), count(smb_efsrpc_auth_fail) per hour
      baseline 30d mean/stddev; alert if current > mean + 3*stddev
- question: Can a supervised classifier flag reconnaissance/forced-auth connections by scoring destination
    reputation, rarity, duration, service, byte profile, and domain age?
  context: Train a Random Forest / gradient-boosting classifier on labeled connection data using features
    such as destination reputation, ASN/country rarity, connection duration, Zeek-identified service,
    byte volume/ratio, and whether the destination FQDN is newly registered. Emit the top-3 contributing
    features in the alert for explainability, and complement with low-probability authentication-edge
    scoring from graph models (CyberGraph/Bowman, Euler). A high-score connection is a candidate forced-auth
    egress for analyst triage; the feature attribution speeds adjudication. For Credential Access this
    captures subtle capture-server connections that single rules miss.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet gateways, DNS resolvers, Perimeter firewalls, Web proxies'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = features(dest_reputation, asn_rarity, country_rarity, duration, service, bytes_ratio, fqdn_age)
      model = RandomForest/GBM trained on labeled conn corpus
      score = model.predict_proba(X); if score>threshold: alert(top3=shap_features(X))
- question: Was a .lnk, .scf, or .url file created on an endpoint whose target (or icon path) is a UNC
    (\\...) or file:// reference pointing to an external IP or a non-allowlisted domain?
  context: 'This is the classic auto-credential lure: a shortcut/.scf/.url with an icon or target on a
    remote share so that merely rendering the icon or opening the file triggers SMB/WebDAV authentication
    to the attacker. Monitor Sysmon Event ID 11 (FileCreate) for TargetFilename ending in .lnk/.scf/.url,
    parse the file content/properties to extract the target and (for .lnk) the icon path, and alert when
    it begins with \\ or file:// pointing at a non-RFC1918 IP or a domain not on the allowlist. A positive
    result is a planted lure designed to harvest hashes; locate it (desktop, share, Startup) and identify
    exposed users. For Credential Access these files are the trigger mechanism for forced authentication.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: User workstations, Shared network drives, Publicly accessible file shares, Terminal servers,
    Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      on Sysmon EID 11 where TargetFilename ~ /\.(lnk|scf|url)$/:
        tgt = parse_link_target_and_icon(file)
        if tgt startswith '\\\\' or 'file://' and host(tgt) not in RFC1918 and domain(tgt) not in allowlist: alert
  - technology: EDR/pseudocode
    query: detect file_create(ext in {lnk,scf,url}) -> extract UNC/file:// target -> match external ->
      raise
- question: Does a newly created link file reference a first-seen or low-prevalence target host relative
    to a 90-day baseline?
  context: Track server/host names extracted from .lnk/.scf/.url files over a 90-day window and alert
    when a file references a first-seen or low-prevalence target (outside the top 99th-percentile frequency
    list), weighting first-seen destinations most heavily. Threat rarity makes novel target hosts high-value
    indicators. A positive result means a shortcut points somewhere your environment has essentially never
    gone — typical of an attacker capture host. A negative result indicates the target is a well-known
    internal resource. For Credential Access, lure files reference attacker infrastructure that is by
    definition rare in normal link-file telemetry.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: User workstations, Shared network drives, Publicly accessible file shares, Terminal servers,
    Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      hosts = extract_target_host(all link_files over 90d); prevalence = freq(hosts)
      on new link_file: if target_host first_seen or prevalence_percentile<1: alert(weight=first_seen?high:med)
- question: Can a classifier distinguish malicious link-file target paths using length, entropy, raw-IP
    presence, TLD/domain rarity, and file:///UNC keywords?
  context: Train a classifier on path strings with features like total length, Shannon entropy, presence
    of raw IP addresses, TLD/domain rarity, and file:///UNC keywords; score new paths and surface the
    top-3 features driving the score for analyst triage. A high score marks a shortcut whose target structurally
    resembles a forced-auth lure. The feature attribution lets the analyst quickly confirm why (e.g.,
    raw IP + UNC + high entropy). For Credential Access this generalizes beyond hard allowlists to catch
    obfuscated or novel lure targets.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 11
  - Sysmon Event ID 1
  - 'NAI: User workstations, Shared network drives, Publicly accessible file shares, Terminal servers,
    Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = features(path_len, shannon_entropy, has_raw_ip, tld_rarity, has_unc_or_fileuri)
      model.predict(X); if malicious_prob>threshold: alert(top3=feature_importance(X))
- question: Was an Office document (.docx/.xlsx/.rtf/.dotm) or HTML file transferred over the network
    that embeds an external SMB/WebDAV resource via a file:// or \\ URI (e.g., template injection)?
  context: Template-injection lures embed an OLE object, picture, or template reference that auto-loads
    a remote resource such as file://[remote]/Normal.dotm when the document opens, forcing SMB/WebDAV
    authentication. Scan Zeek files.log/http.log content for \\host\ and file:// URIs via regex and correlate
    with Sysmon Event ID 1 to reveal the opening process (winword.exe/excel.exe). A positive result identifies
    a weaponized document and the user/process that would trigger the hash leak; pull the file for analysis
    and check whether it was opened. For Credential Access this is a primary spearphishing delivery path
    for forced authentication.
  answer_sources:
  - Zeek files.log
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Email gateways, Web proxies, Endpoint download directories, Network file shares'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: |-
      for f in files.log where mime in {office,html}: if regex_content(f, /(\\\\[^\\]+\\)|file:\/\//): record uri
      join http.log on uid; correlate Sysmon EID 1 (winword.exe/excel.exe opening file) -> alert
  - technology: SIEM/Rule pseudocode
    query: match transferred doc containing external file:// or UNC ref -> join process_create(winword|excel|powerpnt)
      -> alert
- question: Are embedded file:// or UNC destinations inside transferred documents first-seen or in the
    bottom 1% of a 30-day frequency distribution and not internal resources?
  context: Build a 30-day frequency distribution of embedded file:///UNC destinations across transferred
    documents and flag first-seen or bottom-1% URIs that are not internal resources. This exploits threat
    rarity to separate routine internal template references from novel external lures. A positive result
    means a document points to an essentially unseen external share — a hallmark of template injection
    for credential capture. A negative result indicates a common internal template. For Credential Access,
    attacker capture URIs embedded in documents are inherently rare versus legitimate corporate template
    paths.
  answer_sources:
  - Zeek files.log
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Email gateways, Web proxies, Endpoint download directories, Network file shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = freq_dist(embedded_uri) over 30d from doc transfers
      on new doc: for uri in embedded_uris: if uri first_seen or percentile(base,uri)<1 and host(uri) not in RFC1918: alert
- question: Can a gradient-boosting classifier score document maliciousness from external file:///UNC
    targets, raw-IP targets, hidden/auto-loaded links, VBA presence, template references, and metadata?
  context: Train a gradient-boosting classifier on document features — count of external file:///UNC targets,
    raw-IP targets, hidden/auto-loaded links, VBA presence, template references, and metadata — to score
    malice, exposing the top-3 contributing features in the alert. A high score flags a document that
    structurally resembles a forced-authentication lure even if no single rule fires. The feature attribution
    helps the analyst confirm (e.g., auto-loaded external template + raw IP). For Credential Access this
    catches obfuscated template-injection documents designed to leak NetNTLM hashes.
  answer_sources:
  - Zeek files.log
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: Email gateways, Web proxies, Endpoint download directories, Network file shares'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = features(ext_fileuri_count, raw_ip_targets, hidden_autoload_links, has_vba, template_refs, metadata)
      model = GradientBoosting; score=model.predict_proba(X); if score>threshold: alert(top3=feature_importance(X))
- question: Does a single internal host contact more than ~10 unique external (non-RFC1918) destinations
    over SMB/WebDAV within 60 minutes?
  context: Any external SMB egress is already anomalous per perimeter policy (CISA AA20-258A), so a host
    fanning out to many distinct external destinations on 139/445/80/443 within an hour is a strong signal
    of scripted forced-auth attempts or capture-server cycling. Alert when a single host makes >10 SMB/WebDAV
    connections to unique external IPs within 60 minutes. A positive result indicates automated/abusive
    outbound authentication behavior; isolate and investigate. A negative result does not clear low-and-slow
    single-destination capture. For Credential Access, multi-destination external SMB is consistent with
    tooling attempting repeated hash exfiltration.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Zeek http.log
  - 'NAI: Network egress points, Internet gateways, Firewall logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      window=60min; group by id.orig_h where id.resp_h not in RFC1918 and id.resp_p in (139,445,80,443)
      if count(distinct id.resp_h) > 10: alert(external_smb_fanout)
- question: Has a host's daily count of unique external SMB/WebDAV destinations exceeded 3 sigma above
    its 30-day mean (or the 98th percentile)?
  context: Baseline 30-day daily unique-external-destination counts per host (a volume metric) and flag
    values >3σ above the mean or >98th percentile, deriving host/role-specific thresholds empirically.
    This adapts to each host's normal behavior so even servers with some external traffic are judged against
    themselves. A positive result is a statistically significant surge in external authentication targets
    — consistent with forced-auth campaigns. A negative result means the host is within its historical
    envelope. For Credential Access this detects sustained increases in credential-leaking egress that
    fixed thresholds would miss.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Zeek http.log
  - 'NAI: Network egress points, Internet gateways, Firewall logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per host: daily_unique_ext_dest over 30d -> mean, stddev, p98
      if today.daily_unique_ext_dest > mean + 3*stddev or > p98: alert(3sigma_dest)
- question: Does Seasonal-Hybrid ESD applied to hourly connection / unique-destination counts reveal bursty
    forced-authentication egress?
  context: Run Seasonal-Hybrid ESD (S-H-ESD) on hourly connection and unique-destination counts. Its STL
    decomposition plus median/MAD design resists seasonality and contamination and flags both global and
    local anomalies, robustly catching bursty forced-auth egress that 3-sigma baselines may smear. A positive
    result is an hour where outbound SMB/WebDAV volume deviates anomalously after accounting for normal
    diurnal/weekly cycles. A negative result means the time series is within seasonal norms. For Credential
    Access this catches short, intense bursts of hash exfiltration that blend into daily totals.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Zeek http.log
  - 'NAI: Network egress points, Internet gateways, Firewall logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      ts = hourly_counts(conn or unique_dest) per host over 90d
      anomalies = SeasonalHybridESD(ts, period=24, max_anoms=0.05)
      if now in anomalies: alert(sh_esd_burst)
- question: Do new authentication edges from a host score as low-probability under a temporal link-prediction/graph
    model?
  context: Feed the destination edges to a temporal link-prediction/graph model (Euler, CyberGraph/Bowman)
    that scores the probability of each new edge given history, ranking survivors and surfacing the top-3
    path features. Relayed or coerced credentials manifest as low-probability new edges — connections
    this host has never made and the graph deems unlikely. A positive (low-probability) edge is a candidate
    forced-auth/relay event for analyst review. The feature attribution explains why the edge is anomalous.
    For Credential Access this models the authentication graph to expose abnormal credential flow created
    by relay.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Zeek http.log
  - 'NAI: Network egress points, Internet gateways, Firewall logs'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      G = temporal_auth_graph(history)
      for edge in new_edges(today): p = model.score(edge | G)
      rank ascending by p; alert(low_prob_edges, top3=path_features)
- question: Did a user workstation (not a designated management/scanning system) initiate SMB (TCP/445)
    to more than 50 unique internal workstations within one hour?
  context: Workstation-to-workstation SMB is normally near zero. A non-admin workstation fanning out to
    >50 unique internal workstations in an hour is a hallmark of relayed/coerced credentials authenticating
    broadly, or lateral spread. Alert on this fan-out (excluding designated management/scanning systems)
    and pair with Zeek/BZAR SMB and DCE-RPC parsing to confirm authentication and flag MS-EFSRPC coercion
    interfaces. A positive result indicates likely relay/lateral credential abuse; isolate and hunt the
    source of the relayed credentials. A negative result means internal SMB fan-out is normal. For Credential
    Access this exposes the downstream use of forced/relayed authentication across the internal network.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Windows Event ID 4624
  - 'NAI: Internal network segments, VLANs for user workstations, Domain Controller security logs, Core
    network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      window=60min; src in workstation_subnet and src not in mgmt_scanners
      if count(distinct internal_dst where resp_p=445) > 50: alert; enrich with BZAR smb/dce_rpc (EFSRPC interface?)
  - technology: Zeek/pseudocode
    query: 'group smb.log by id.orig_h within 1h; if distinct id.resp_h (internal) >50 and orig not mgmt:
      alert; flag dce_rpc EfsRpcOpenFileRaw'
- question: Does any workstation exceed the 99th percentile of SMB out-degree or violate its learned login
    template?
  context: Baseline SMB out-degree and structural login patterns for every workstation and flag hosts
    exceeding the 99th percentile or whose logins violate learned login templates. Broad, atypical authentication
    is the side-effect of relayed/coerced credentials. A positive result is a host behaving outside its
    structural norm — connecting to far more peers, or with login patterns that break its template. A
    negative result means the host's authentication structure is consistent. For Credential Access this
    detects the structural footprint that forced-auth-driven relay leaves on the login graph.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Windows Event ID 4624
  - 'NAI: Internal network segments, VLANs for user workstations, Domain Controller security logs, Core
    network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per host: smb_out_degree distribution -> p99; learn login_template(src,dst,time,account)
      if out_degree>p99 or login violates template: alert
- question: Is the ratio of failed (4625) to successful (4624) NTLM logons, and blocked SMB attempts,
    surging on a high-fan-out source host?
  context: Track the ratio of failed (Event ID 4625) to successful (4624) NTLM logons and blocked SMB
    attempts per source host. A surge in failures during high fan-out is a distinct state signal of credential
    abuse and relay (correlate with KB5005413 NTLM-relay mitigations). A positive result — many failures
    alongside broad SMB fan-out — strongly suggests relayed credentials being tried against many targets.
    A negative result indicates stable, successful authentication. For Credential Access this distinguishes
    noisy relay/coercion attempts from legitimate authenticated access.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Windows Event ID 4624
  - 'NAI: Internal network segments, VLANs for user workstations, Domain Controller security logs, Core
    network switches'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      per src host per hour: fail=count(EID 4625 NTLM), succ=count(EID 4624 NTLM), blocked=count(blocked_smb)
      ratio = fail/(succ+1); baseline 30d; alert if ratio spike AND high fanout
- question: Does an unsupervised ensemble (PCA, k-means/DBSCAN, MAD) flag any host as an SMB-behavior
    outlier from its peers?
  context: Vectorize each host's SMB metrics — out-degree, unique destinations, byte volume/ratio, failed/success
    ratio — and apply an unsupervised ensemble (PCA, k-means/DBSCAN, MAD) to surface outliers without
    labels, reporting the top-3 features per flagged host. This finds anomalous behavior even where no
    rule or labeled model exists. A positive result is a host whose SMB profile diverges sharply from
    the population — a candidate for relay/forced-auth abuse. The feature attribution guides triage. For
    Credential Access this provides label-free detection of the behavioral footprint of credential relay
    across workstations.
  answer_sources:
  - Zeek conn.log
  - Zeek smb.log
  - Windows Event ID 4624
  - 'NAI: Internal network segments, VLANs for user workstations, Domain Controller security logs, Core
    network switches'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: |-
      X = per_host_vector(out_degree, unique_dst, bytes_ratio, fail_succ_ratio)
      ensemble = PCA + (kmeans|DBSCAN) + MAD; outliers = consensus(ensemble, X)
      for h in outliers: alert(top3=feature_contribution(h))
