name: 'T1217: Browser Information Discovery'
id: c9edaeb9-8641-4001-9571-f39a35f7cd29
description: 'This playbook helps an analyst investigate whether an adversary is performing Browser Information
  Discovery (T1217) on compromised Windows, Linux, or macOS hosts to enumerate bookmarks, saved accounts/credentials,
  autofill data, cookies, and browsing history that can reveal personal information, internal network
  resources (servers, tools, dashboards), and additional targets. Under the Discovery tactic, it guides
  the hunt across several behavioral angles: execution of known browser/credential-harvesting tooling
  matched by image name, original filename, or hash (e.g., LaZagne, WebBrowserPassView, HackBrowserData)
  and native discovery utilities with anomalous parent-child lineage; scripting interpreters or utilities
  invoked with command-lines that reference sensitive browser profile paths and database filenames (User
  Data\Default\Cookies, Login Data, Web Data, History, places.sqlite, cookies.sqlite, ~/.config/google-chrome,
  ~/Library/Safari); unauthorized read access to browser secret stores by non-allowlisted processes; correlated
  read->stage->egress chains where a browser file read is followed by staging-directory file creation
  and outbound network connections; and non-standard utilities opening browser process memory with PROCESS_VM_READ
  to scrape secrets. Detection methods combine symbolic-logic rules, statistical baselining/rarity-and-volume
  scoring, and machine-learning models (Random Forest/gradient boosting, LSTM/transformer sequence models,
  Isolation Forest, provenance-graph learners) applied to Windows Security/Sysmon events, PowerShell script-block
  logs, auditd, macOS unified/osquery logs, and Zeek/Sysmon network telemetry, so the analyst can corroborate
  suspected browser reconnaissance against process lineage, file-access patterns, data volume, and exfiltration
  context.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
