questions:
- question: '[Discovery] Browser credential tool IOC correlation: Can you determine whether a process
    execution event is observed where the process name or file hash corresponds to a known browser information
    or credential harvesting utility. -- specifically, using the ''Browser credential tool IOC correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary enumerates locally stored
    browser artifacts -- bookmarks, saved accounts and credentials, autofill, cookies, and history --
    to learn about the user, the environment, internal resources, and follow-on targets, leaving traces
    in process-execution, command-line, file-access, memory-access, and network telemetry. This evidence
    focuses on the condition that a process execution event is observed where the process name or file
    hash corresponds to a known browser information or credential harvesting utility. This Symbolic Logic
    approach looks for the following signal: Alert on process creation (4688/Sysmon 1) where Image, OriginalFileName,
    or hash matches known browser/credential harvesters and their command-line modules (e.g., lazagne.exe
    with `browsers`/`-Mozilla`/`-ChromiumBased`/`all`, WebBrowserPassView, HackBrowserData), per [HackTool
    - LaZagne Execution, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_lazagne.yml).
    Keep launch-path IOCs (Temp, AppData, Downloads, Public) as concrete thresholds and tune, do not delete.
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a process on the
    host is reading or scraping browser data in a way that deviates from the browser''s own signed processes
    and normal user behavior; pivot to the responsible process, its parent lineage, the user/device context,
    the specific browser files or memory accessed, any files staged to disk, and subsequent outbound transfers.
    A negative result helps rule out this browser-reconnaissance vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy, living-off-the-land,
    or context-triggered enumeration.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User workstations, Developer workstations, Administrative jump boxes, Critical servers'
  range: Last 90 days
  queries:
