  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Match IDE connections to threat intel\nsource IN [Windows Event ID 4688, Windows Event ID\
      \ 5156, Zeek conn.log, Zeek dns.log, Zeek ssl.log]\n| WHERE matches_action_criteria(\"Match IDE\
      \ connections to threat intel\")\n// In your SIEM, correlate process creation events (Windows Event\
      \ ID 4688/Sysmon EID 1; auditd execve) for IDE executables with network connection events (Windows\
      \ \n| ALERT enrich(host, user, ide_process, cmdline, dest_domain, sni, ja4, bytes, duration)"
  - technology: Zeek/pseudocode
    query: "# Match IDE connections to threat intel (network telemetry)\nzeek conn.log + dns.log + ssl.log\n\
      | join IDE process->flow by host/time\n// In your SIEM, correlate process creation events (Windows\
      \ Event ID 4688/Sysmon EID 1; auditd execve) for IDE executables with network connection events\
      \ (Windows \n| ALERT on tunnel-domain/SNI/JA4 anomaly with enrich(host, dest, ja4, sni)"
