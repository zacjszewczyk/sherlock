questions:
- question: '[Command and Control] Match IDE connections to threat intel: Can you determine whether a
    remote-development client process (code.exe/code, jetbrains_client, jetbrains-gateway) initiates outbound
    communication to infrastructure linked to malware or command-and-control, or to dev-tunnel infrastructure
    that is not sanctioned by policy. IDE tunneling encapsulates an interactive shell, file access, and
    port forwarding inside TLS to trusted cloud endpoints (e.g., *.devtunnels.ms), so trusted developer
    tooling can be repurposed for covert C2. -- specifically, using the ''Match IDE connections to threat
    intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Command and Control tactic (TA0011), an adversary abuses Integrated
    Development Environment (IDE) software with remote development/tunneling features (e.g., Visual Studio
    Code ''code tunnel'', JetBrains Gateway) to establish an interactive, TLS-encapsulated command-and-control
    channel that blends in with legitimate developer workflows and can auto-reconnect for persistence.
    This evidence focuses on the condition that a remote-development client process (code.exe/code, jetbrains_client,
    jetbrains-gateway) initiates outbound communication to infrastructure linked to malware or command-and-control,
    or to dev-tunnel infrastructure that is not sanctioned by policy. IDE tunneling encapsulates an interactive
    shell, file access, and port forwarding inside TLS to trusted cloud endpoints (e.g., *.devtunnels.ms),
    so trusted developer tooling can be repurposed for covert C2. This Symbolic Logic approach looks for
    the following signal: In your SIEM, correlate process creation events (Windows Event ID 4688/Sysmon
    EID 1; auditd execve) for IDE executables with network connection events (Windows Event ID 5156, Zeek
    conn.log) from the same host. Extract the destination IP/resolved domain (Zeek dns.log). Alert if
    the destination matches a high-confidence C2/malware threat-intel feed. Real IDE-tunnel C2 egresses
    to dev-tunnel domains and parallel SSH backdoors per Operation Digital Eye. A positive result -- a
    rule match, statistical outlier, or model alert -- suggests an IDE-tunneling C2 or persistence channel
    rather than sanctioned remote development; pivot to the responsible IDE process and command line,
    the executing user and host role, the destination tunnel domain/SNI/JA-fingerprint, any tunnel config
    artifacts written to disk, and the session''s duration, volume, and cadence. A negative result helps
    reduce suspicion of this IDE-tunneling vector but should be corroborated with the other questions
    in this playbook, since a single method can miss policy-aware, low-and-slow, or living-off-the-land
    tunneling that hides inside trusted developer tooling.'
