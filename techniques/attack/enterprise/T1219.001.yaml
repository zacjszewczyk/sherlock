name: 'T1219.001: IDE Tunneling'
id: 8b312962-2dd5-4ae8-bcef-89f98a7ea40a
description: 'This playbook helps an analyst investigate whether an adversary is abusing Integrated Development
  Environment (IDE) remote-development and tunneling features -- such as Visual Studio Code''s ''code
  tunnel'' CLI, JetBrains Gateway, and related dev-tunnel infrastructure (*.devtunnels.ms, tunnels.api.visualstudio.com)
  -- to establish a covert, interactive command-and-control channel and persistence under the Command
  and Control tactic. IDE tunneling encapsulates an interactive shell, file access, port forwarding, and
  debugging inside TLS to trusted cloud endpoints, often authenticated through GitHub or JetBrains accounts,
  so trusted developer tooling can be repurposed for stealthy C2 (as seen in Operation Digital Eye and
  Stately Taurus). It guides the hunt across several behavioral angles on Windows, Linux, and macOS: IDE
  processes (code.exe/code, jetbrains_client, jetbrains-gateway, pycharm64.exe) contacting threat-intel-flagged
  or non-allowlisted dev-tunnel destinations; execution of tunneling CLI commands (''code tunnel'', ''gh
  cs tunnel'', ''--tunnel'') with persistence/non-interactive flags; creation of tunnel config artifacts
  (~/.vscode-cli/code_tunnel.json); IDE execution or service/scheduled-task persistence (winsw ''Visual
  Studio Code Service'', startcode.bat, systemd units, launch agents) on non-developer hosts including
  servers and DCs; and anomalous tunnel sessions exhibiting excessive duration, large transfers, or periodic
  beaconing cadence. Detection methods combine symbolic-logic rules, statistical baselining (prevalence,
  peer-group deviation, JA3/JA4 fingerprint baselines, FFT/periodicity scoring), and machine-learning
  models (supervised domain classification, DBSCAN clustering, one-class/Isolation Forest, and LSTM/transformer
  time-series) applied to Windows Security/Sysmon events, auditd, macOS unified logs, and Zeek conn/dns/ssl
  telemetry, so the analyst can corroborate suspected IDE tunneling against process lineage, host role,
  destination reputation, TLS fingerprint, config artifacts, and traffic volume/cadence.'
type: technique
