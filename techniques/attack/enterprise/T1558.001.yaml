  - Windows Event ID 4769
  - Zeek conn.log
  - Zeek kerberos.log
  - 'NAI: All servers and workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog EventCode=4624 LogonType=3 earliest=-30d

      | bin _time span=1h

      | stats dc(ComputerName) as targets by _time, TargetUserName

      | eventstats p99(targets) as p99 by TargetUserName

      | where targets>p99

      | table _time, TargetUserName, targets, p99'
- question: Do causal login-path graphs (Hopper-style) or temporal link prediction (Euler) score privilege-gaining
    lateral paths that lack a benign cause and improbable new edges after a ticket event, listing the
    rare edge and privilege gain as top features?
  context: 'Hopper builds causal login paths and flags movement that gains privilege without a benign
    cause; Euler performs temporal link prediction to score improbable new edges over time. Forged-ticket
    lateral movement produces exactly such uncaused, privilege-gaining, improbable edges shortly after
    a ticket event. The alert should list the rare edge and the privilege gain as top features. A positive
    result is a flagged privilege-gaining path with no legitimate cause; a negative result is movement
    explained by benign login chains. This supports Credential Access by modeling the causal and temporal
    improbability of forged-ticket lateral spread. References: [Hopper, Ho et al.](https://www.usenix.org/system/files/sec21-ho.pdf);
    [Euler, King & Huang](https://dl.acm.org/doi/10.1145/3588771); [Euler code](https://github.com/iHeartGraph/Euler).'
