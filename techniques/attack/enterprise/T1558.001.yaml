- question: Do 4769/4624/4672 PAC, transited-services, or SID-History fields grant privileged SIDs (e.g.,
    Domain Admins 512, Enterprise Admins 519) that are NOT present in the account's directory membership?
  context: 'Enhanced Golden Tickets embed forged PAC group claims or SID-History entries that hand the
    account privileged SIDs (such as Domain Admins 512 or Enterprise Admins 519) it does not legitimately
    hold in Active Directory. Comparing the SIDs/privileges asserted in ticket and logon events against
    the account''s true directory membership exposes this manipulation. A positive result is a ticket/logon
    claiming privileged SIDs absent from the account''s groups; a negative result matches directory membership.
    This supports Credential Access by detecting forged authorization claims that grant illegitimate privilege.
    References: [Metcalf SID-History](https://adsecurity.org/?p=1640); [Metcalf](https://adsecurity.org/?p=1515).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4624
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=wineventlog EventCode IN (4769,4624,4672)

      | lookup ad_membership TargetUserName OUTPUT group_sids

      | eval claimed=mvappend(PAC_SIDs, SidHistory, TransitedServices)

      | where ("S-1-5-21-*-512" IN claimed OR "S-1-5-21-*-519" IN claimed) AND NOT (claimed IN group_sids)

      | table _time, TargetUserName, claimed, group_sids, ComputerName'
- question: When the privilege level implied by each account's ticket claims and logon token (4672 special
    privileges) is baselined, which logons show a token privilege score that is a strong outlier for that
    account?
  context: 'Most accounts exhibit a stable privilege footprint. A forged ticket can suddenly elevate an
    ordinary account''s effective privileges, visible as special-privilege assignments (4672) and elevated
    token claims out of line with that account''s history. Baselining a privilege score per account from
    ticket claims and logon tokens and flagging strong outliers surfaces such elevation. A positive result
    is a logon whose privilege score is anomalously high for the account; a negative result matches its
    norm. This supports Credential Access by quantifying illegitimate privilege gain from forged tickets.
    References: [Authentication Graphs, Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001); [LogonTracer,
    JPCERT/CC](https://github.com/JPCERTCC/LogonTracer).'
  answer_sources:
  - Windows Event ID 4769
  - Windows Event ID 4624
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog EventCode IN (4672,4624)

      | eval priv_score=mvcount(PrivilegeList)

      | eventstats avg(priv_score) as mu, stdev(priv_score) as sd by TargetUserName

      | where priv_score > (mu+3*sd)

      | table _time, TargetUserName, priv_score, mu, PrivilegeList, ComputerName'
- question: Does a model trained on PAC/group-claim and edge-rarity features prioritize tickets whose
    authorization claims look forged or manipulated, surfacing the anomalous SID and host in the alert?
  context: 'Combining PAC/group-claim features with authentication-edge rarity lets a model rank tickets
    by how forged their authorization claims appear, catching subtle manipulations that single rules miss.
    The model should surface the anomalous SID and the host involved so analysts can validate quickly.
    A positive result is a ticket prioritized for forged-looking claims plus rare edges; a negative result
    is normal claims on familiar edges. This supports Credential Access by fusing authorization-claim
    and graph-rarity signals to prioritize the most likely forged tickets. References: [Siadati & Memon](https://doi.org/10.1145/3133956.3134003);
    [CyberGraph/Bowman et al.](https://www.usenix.org/system/files/raid20-bowman.pdf).'
