questions:
- question: On Domain Controllers, are there TGS requests (4769) or interactive/network logons (4624)
    for an account that have NO preceding TGT (4768) within the ticket lifetime, or that use RC4-HMAC
    (0x17/0x18) where the domain expects AES (0x11/0x12)?
  context: 'Forged Golden Tickets are minted on the attacker''s machine, so the KDC never records an AS-REQ
    (4768) for them; a TGS or logon with no matching TGT inside the ticket lifetime is the canonical Golden
    Ticket invariant. Likewise, Mimikatz commonly defaults to RC4-HMAC, so a downgraded encryption type
    in a domain that has standardized on AES is suspicious. Correlate 4768/4769/4624/4634 per account
    on Domain Controllers and alert on the missing-TGT condition or the unexpected cipher. Also watch
    KDC provider Event ID 42 RC4 downgrade errors. A positive result (TGS/logon without TGT, or RC4 where
    AES expected) strongly indicates forged credential access; a negative result means tickets followed
    the normal AS->TGS->logon chain. This directly supports the Credential Access tactic by exposing forged
    authentication material. References: [Metcalf](https://adsecurity.org/?p=1515); [Microsoft 4769](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769);
    [Microsoft 4768](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768);
    [SigmaHQ CVE-2022-37966 RC4 downgrade rule](https://github.com/SigmaHQ/sigma/blob/master/rules-emerging-threats/2022/Exploits/CVE-2022-37966/win_system_exploit_cve_2022_37966_kdcsvc_rc4_downgrade.yml).'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Windows Event ID 4776
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=wineventlog (EventCode=4768 OR EventCode=4769 OR EventCode=4624)\n| transaction TargetUserName\
      \ maxspan=10h\n| where (EventCode IN (4769,4624)) AND NOT match(events,\"4768\")\n   OR (TicketEncryptionType\
      \ IN (\"0x17\",\"0x18\") AND domain_standard=\"AES\")\n| eval also_check=\"KDC Event ID 42 RC4 downgrade\"\
      \n| table _time, TargetUserName, EventCode, TicketEncryptionType, IpAddress"
- question: When ticket lifetime, cipher type, and source host are baselined per (user, service), which
    Kerberos tickets deviate beyond the 95th/99th percentile or 3 sigma, and which exceed the domain Kerberos
    policy maximum (default 10h TGT / 7d renewal)?
  context: 'Mimikatz-forged tickets default to roughly a 10-year lifetime, far beyond any legitimate domain
    Kerberos policy. By baselining lifetime, cipher, and source host per (user, service) you can flag
    statistical outliers, and treat ANY lifetime exceeding policy as a hard outlier regardless of baseline.
    The alert should surface which field deviated (lifetime, cipher, or host) so an analyst can triage
    quickly. A positive result is a ticket whose lifetime/cipher/source is anomalous for that pairing
    or exceeds policy; a negative result is normal-duration tickets. This supports Credential Access by
    catching the abnormal longevity that forged tickets exhibit. References: [Authentication Graphs, Kent
    et al.](https://doi.org/10.1016/j.cose.2014.09.001); [Metcalf](https://adsecurity.org/?p=1515).'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Windows Event ID 4776
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog (EventCode=4768 OR EventCode=4769)

      | stats avg(TicketLifetime) as mu, stdev(TicketLifetime) as sd, p99(TicketLifetime) as p99 by TargetUserName,
      ServiceName

      | eval policy_max=36000  /* 10h in seconds */

      | where TicketLifetime > (mu+3*sd) OR TicketLifetime > p99 OR TicketLifetime > policy_max

      | table TargetUserName, ServiceName, TicketLifetime, TicketEncryptionType, IpAddress'
- question: Which accounts show successful logons or TGS requests with ZERO prior pre-authentication failures
    (4768 result 0x18) or TGS failures (4769 failure code), an inverted pattern compared with normal or
    brute-force authentication?
  context: 'Legitimate accounts accumulate occasional pre-auth failures (mistyped passwords, expired tickets).
    A forged-ticket account typically produces clean, immediate success with no preceding failed authentication
    because it never performs a real AS exchange. Tracking the per-account pre-auth failure rate (4768
    result 0x18) and TGS failure codes as a distinct state signal lets you flag the inverted pattern:
    high-value access with no failure history. A positive result is meaningful privileged activity from
    an account with an unnaturally pristine failure record; a negative result is normal failure-then-success
    behavior. This supports Credential Access by distinguishing forged-ticket use from real brute-force
    attempts. References: [Microsoft 4768](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768).'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Windows Event ID 4776
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "index=wineventlog EventCode IN (4768,4769)\n| stats count(eval(EventCode=4768 AND Result=\"\
      0x18\")) as preauth_fail,\n        count(eval(EventCode=4769 AND Failure!=\"0x0\")) as tgs_fail,\n\
      \        count(eval(match(EventCode,\"4769|4624\"))) as success by TargetUserName\n| where success>0\
      \ AND preauth_fail=0 AND tgs_fail=0\n| table TargetUserName, success, preauth_fail, tgs_fail"
- question: Does an explainable LSTM sequence model of per-user Kerberos event chains (4768->4769->4624)
    flag any logon/TGS that lacks the expected preceding TGT as a sequence anomaly, and what are the top
    contributing features?
  context: 'DeepLog-style LSTM models learn the normal ordering of per-user Kerberos events. A forged
    Golden Ticket breaks the expected 4768->4769->4624 sequence because the TGT step is absent, so the
    model registers it as a high-anomaly sequence. The model must be explainable: the alert should list
    the top-3 contributing features such as the missing-TGT flag, RC4 encryption type, and lifetime z-score,
    so analysts can validate it rather than chase a black-box score. Validate against the LANL authentication
    dataset before production. A positive result is a sequence flagged with forged-ticket features; a
    negative result is sequences matching learned norms. This supports Credential Access by modeling the
    abnormal authentication flow forged tickets create. References: [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015);
    [DeepLog code](https://github.com/wuyifan18/DeepLog); [LANL](https://csr.lanl.gov/data/cyber1/).'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Windows Event ID 4624
  - Windows Event ID 4771
  - Windows Event ID 4776
  - Zeek kerberos.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = DeepLog(window=10)\nfor user in users:\n  seq = events_for(user, types=[4768,4769,4624])\n\
      \  score, feats = model.score(seq)\n  if score > anomaly_threshold:\n     alert(user, top3=feats[:3])\
      \  /* missing_TGT, rc4_type, lifetime_z */\n# train/validate on LANL cyber1 auth data"
- question: Is any single account or source IP requesting many distinct service SPNs (>=15 unique services)
    within a 5-minute window via 4769, especially concentrated on RC4-HMAC (0x17) tickets?
  context: 'Once an adversary holds a forged TGT they can rapidly request TGS tickets for many services
    (Kerberoasting-style enumeration). A burst of >=15 unique SPNs in 5 minutes from one account or source
    IP, particularly RC4-HMAC tickets, indicates automated service-ticket harvesting enabled by forged
    TGT access. Alert when the unique-SPN count crosses the threshold in the window. A positive result
    is a tight burst of diverse SPN requests; a negative result is the slow, varied TGS pattern of normal
    users. This supports Credential Access by catching mass ticket harvesting that follows ticket forgery.
    References: [Metcalf](https://adsecurity.org/?p=1515); [Microsoft 4769](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769).'
  answer_sources:
  - Windows Event ID 4769
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=wineventlog EventCode=4769

      | bin _time span=5m

      | stats dc(ServiceName) as uniq_spns, values(TicketEncryptionType) as enc by _time, TargetUserName,
      IpAddress

      | where uniq_spns>=15 AND ("0x17" IN enc)

      | table _time, TargetUserName, IpAddress, uniq_spns, enc'
- question: When unique-SPN counts and TGS-per-minute volume are baselined per account over rolling 5-minute
    windows, which accounts exceed the 99th percentile or 3 standard deviations above their own norm?
  context: 'Static thresholds miss low-and-slow enumeration and over-alert on busy service accounts. Baselining
    each account''s unique-SPN count and TGS-per-minute frequency over a 30-day history and flagging rolling
    5-minute windows above the 99th percentile or 3-sigma gives a per-environment, per-account sensitive
    signal. A positive result is an account whose SPN fan-out or TGS rate is abnormal for itself; a negative
    result is volume within that account''s learned range. This supports Credential Access by adapting
    to each account''s normal Kerberos footprint to surface forged-ticket-driven bursts. References: [Authentication
    Graphs, Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001).'
  answer_sources:
  - Windows Event ID 4769
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog EventCode=4769 earliest=-30d

      | bin _time span=5m

      | stats dc(ServiceName) as spns, count as tgs by _time, TargetUserName

      | eventstats avg(spns) as mu, stdev(spns) as sd, p99(spns) as p99 by TargetUserName

      | where spns > (mu+3*sd) OR spns > p99

      | table _time, TargetUserName, spns, tgs'
- question: What is the ratio of failed TGS requests (4769 non-zero failure code) to successful ones per
    account, and which accounts show bursts of successful TGS with an abnormally LOW failure ratio against
    many rare SPNs?
  context: 'Automated, forged-ticket-driven TGS requests tend to succeed cleanly because the underlying
    TGT is valid (forged) and the tooling targets known SPNs, producing an abnormally low failure ratio
    compared with organic activity. Profiling the failed-to-successful TGS ratio per account, and flagging
    bursts of successful TGS with near-zero failures against many rare SPNs, gives a distinct state signal
    of automation. A positive result is high-volume, low-failure TGS against unusual services; a negative
    result is the mixed success/failure pattern of normal use. This supports Credential Access by exposing
    the machine-like cleanliness of forged-ticket service enumeration. References: [Microsoft 4769](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769).'
  answer_sources:
  - Windows Event ID 4769
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog EventCode=4769

      | stats count(eval(Failure!="0x0")) as fail, count(eval(Failure="0x0")) as ok, dc(ServiceName) as
      spns by TargetUserName

      | eval fail_ratio=fail/(fail+ok+1)

      | where ok>20 AND fail_ratio<0.02 AND spns>=10

      | table TargetUserName, ok, fail, fail_ratio, spns'
- question: Does time-series/change-point anomaly detection on TGS volume by account and hour surface
    ticket bursts, and does the alert report the contributing account, SPN count, and cipher type?
  context: 'ChangeFinder-style change-point detection (as used in LogonTracer) on hourly TGS volume per
    account detects sudden bursts that static thresholds and even percentile baselines may smear. When
    a forged ticket is used to harvest service tickets, the per-account hourly volume spikes sharply,
    registering as a change point. The alert must report the contributing account, SPN count, and cipher
    type so analysts can act. A positive result is a detected change point with a burst of TGS activity;
    a negative result is steady-state volume. This supports Credential Access by catching the temporal
    signature of forged-ticket roasting. References: [LogonTracer, JPCERT/CC](https://github.com/JPCERTCC/LogonTracer).'
  answer_sources:
  - Windows Event ID 4769
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "series = hourly_tgs_count(account)\ncp = ChangeFinder(r=0.05, order=1).score(series)\nif cp\
      \ > threshold:\n   alert(account, spn_count=dc_spn(account,hour), cipher=enc_types(account,hour))\n\
      # ref: LogonTracer ChangeFinder"
- question: Are there successful member-server logons (4624) for an account where no matching DC-issued
    TGT (4768) exists for that account within the configured ticket lifetime?
  context: 'This is the canonical Golden Ticket invariant applied to member servers: a forged TGT bypasses
    the AS exchange, so the DC never logs a 4768 for it, yet the resulting service ticket is accepted
    and a 4624 logon occurs. Correlating member-server logons against DC TGT issuance within the ticket
    lifetime exposes the gap. A positive result is a successful logon with no corresponding TGT in the
    window; a negative result is logons backed by a legitimate, logged TGT. This supports Credential Access
    by detecting forged authentication material reaching member servers without ever transiting the KDC''s
    AS step. References: [Metcalf](https://adsecurity.org/?p=1515); [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=wineventlog EventCode=4624 host=member_server

      | join type=left TargetUserName [search index=wineventlog EventCode=4768 earliest=-10h | stats latest(_time)
      as tgt_time by TargetUserName]

      | where isnull(tgt_time) OR (_time - tgt_time) > ticket_lifetime

      | table _time, TargetUserName, ComputerName, IpAddress, tgt_time'
- question: When the (account, source host, service) triple is compared with each user's historical baseline,
    which combinations fall in the top rarity band (rare or novel authentication edges), such as a workstation
    account authenticating to a Domain Controller?
  context: 'Forged tickets are reused from atypical source hosts to atypical targets, producing rare or
    never-before-seen (account, source host, service) edges in the authentication graph. Scoring each
    triple against the user''s history and flagging the top rarity band surfaces improbable access, e.g.,
    a workstation account authenticating directly to a Domain Controller. A positive result is a high-rarity/novel
    edge; a negative result is an edge consistent with the user''s history. This supports Credential Access
    by leveraging authentication-graph rarity to catch forged-ticket reuse that ordinary thresholds miss.
    References: [Siadati & Memon](https://doi.org/10.1145/3133956.3134003); [Authentication Graphs, Kent
    et al.](https://doi.org/10.1016/j.cose.2014.09.001).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog EventCode IN (4624,4769) earliest=-30d

      | stats count as freq by TargetUserName, IpAddress, ServiceName

      | eventstats sum(freq) as user_total by TargetUserName

      | eval rarity=1-(freq/user_total)

      | where rarity>0.99 OR freq=1  /* novel edge */

      | table TargetUserName, IpAddress, ServiceName, freq, rarity'
- question: Does graph link-prediction (node2vec plus a classifier) over authentication edges flag improbable
    new (account->host) edges produced by forged-ticket reuse, and does the alert report the rare edge
    and its probability score?
  context: 'Authentication activity forms a graph of (account->host) edges. Forged-ticket reuse creates
    edges that legitimate behavior would not predict. Embedding the graph with node2vec and training a
    classifier to score the likelihood of each new edge lets you flag improbable edges with a calibrated
    probability. The alert should name the rare edge and its score. Validate against the LANL dataset.
    A positive result is a low-probability new edge consistent with forged-ticket lateral access; a negative
    result is an edge the model considers likely. This supports Credential Access by modeling the structural
    improbability of forged-ticket authentication. References: [CyberGraph/Bowman et al.](https://www.usenix.org/system/files/raid20-bowman.pdf);
    [LANL](https://csr.lanl.gov/data/cyber1/).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4768
  - Windows Event ID 4769
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "emb = node2vec(auth_graph)\nclf = train_edge_classifier(emb, labeled_edges)\nfor (acct,host)\
      \ in new_edges:\n  p = clf.predict_proba(emb[acct], emb[host])\n  if p < edge_threshold:\n     alert(edge=(acct,host),\
      \ score=p)\n# validate on LANL cyber1"
- question: Are there 4768/4769 events whose ticket lifetime exceeds domain Kerberos policy (default 10h
    TGT, 7d renewal) or matches known forged-ticket durations (~10 years), or that use RC4-HMAC where
    AES is expected?
  context: 'Forged tickets frequently carry lifetimes far beyond legitimate policy (Mimikatz default ~10
    years) and may use RC4-HMAC. Alerting directly on lifetime fields that exceed the configured policy
    maximum, match the ~10-year forged signature, or use an unexpected cipher provides a high-confidence
    symbolic-logic detection. A positive result is a ticket whose lifetime or cipher violates policy expectations;
    a negative result is tickets within policy. This supports Credential Access by catching the unmistakable
    longevity/encryption anomalies of forged Kerberos material. References: [Metcalf](https://adsecurity.org/?p=1515);
    [Microsoft 4768](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768).'
  answer_sources:
  - Windows Event ID 4768
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "index=wineventlog EventCode IN (4768,4769)\n| where TicketLifetime > 36000  /* >10h */\n \
      \  OR TicketLifetime > 86400*365*5  /* ~multi-year forged */\n   OR (TicketEncryptionType IN (\"\
      0x17\",\"0x18\") AND domain_standard=\"AES\")\n| table _time, TargetUserName, TicketLifetime, TicketEncryptionType,\
      \ IpAddress"
- question: When ticket issuance time-of-day and lifetime are compared against each user's historical
    distribution, which events are 95th-percentile outliers, especially when combined with source-IP rarity?
  context: 'Forged tickets are often issued (or first observed) at unusual times and from unusual source
    IPs relative to the user''s norm. Comparing issuance time-of-day and lifetime against each user''s
    historical distribution and flagging 95th-percentile outliers, then combining with source-IP rarity,
    raises precision over either signal alone. A positive result is an off-hours or abnormally long ticket
    from a rare source; a negative result fits the user''s temporal/source profile. This supports Credential
    Access by fusing temporal and source anomalies to spot forged-ticket use. References: [Authentication
    Graphs, Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001); [Siadati & Memon](https://doi.org/10.1145/3133956.3134003).'
  answer_sources:
  - Windows Event ID 4768
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'index=wineventlog EventCode=4768 earliest=-30d

      | eval hod=strftime(_time,"%H")

      | eventstats p95(TicketLifetime) as life95, count as src_freq by TargetUserName

      | eventstats count as ip_freq by TargetUserName, IpAddress

      | where TicketLifetime>life95 AND ip_freq<=2

      | table _time, TargetUserName, hod, TicketLifetime, IpAddress, ip_freq'
- question: Do change-point/forecasting models on ticket-age and source-time patterns identify tickets
    that remain valid far beyond normal behavior, surfacing the lifetime z-score and source host as top
    features?
  context: 'Forecasting and change-point models learn the expected evolution of ticket age and source-time
    patterns per user. A forged ticket persists and is used far longer than any legitimate ticket, breaking
    the forecast and producing a large residual/z-score. The model should surface the lifetime z-score
    and source host as the top contributing features for analyst validation. A positive result is a ticket
    whose age/source pattern diverges sharply from the forecast; a negative result tracks the expected
    pattern. This supports Credential Access by detecting the abnormal persistence of forged tickets over
    time. References: [LogonTracer, JPCERT/CC](https://github.com/JPCERTCC/LogonTracer).'
  answer_sources:
  - Windows Event ID 4768
  - Zeek kerberos.log
  - Zeek conn.log
  - 'NAI: Domain Controllers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "series = ticket_age_and_source_time(user)\nfc = forecast_model.fit(series)\nresid = series.latest\
      \ - fc.predict()\nz = resid/fc.std()\nif abs(z) > z_thresh:\n   alert(user, lifetime_z=z, source_host=current_src)\n\
      # ref: LogonTracer-style forecasting"
- question: Is one account using the same ticket material to log on (4624) to many hosts (>=5 distinct
    targets) within a short window after a ticket-issuance event, while the expected source workstation
    is absent from the auth trail?
  context: 'After forging a ticket, adversaries reuse it to authenticate across many hosts quickly, producing
    a fan-out of network logons from a single account that is not anchored to the user''s normal workstation.
    Alerting when an account hits >=5 distinct targets in a short window following a ticket event, with
    no expected source workstation in the trail, catches this lateral spread. A positive result is rapid
    multi-host access tied to one ticket without a benign source; a negative result is normal, gradual
    access from the expected host. This supports Credential Access (and the lateral movement it enables)
    by exposing forged-ticket reuse across the estate. References: [Metcalf](https://adsecurity.org/?p=1515);
    [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Zeek conn.log
  - Zeek kerberos.log
  - 'NAI: All servers and workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'index=wineventlog EventCode=4624 LogonType=3

      | bin _time span=10m

      | stats dc(ComputerName) as targets, values(ComputerName) as hosts, values(IpAddress) as srcs by
      _time, TargetUserName

      | where targets>=5 AND NOT (expected_workstation IN srcs)

      | table _time, TargetUserName, targets, hosts, srcs'
- question: When host fan-out (distinct logon targets) is baselined per user, which accounts show bursts
    above the 99th percentile that coincide with a fresh ticket-issuance event?
  context: 'Each account has a typical breadth of hosts it touches. Baselining distinct logon-target counts
    per user and flagging bursts above the 99th percentile that coincide with a fresh ticket event isolates
    suspicious lateral expansion driven by forged tickets, while tolerating accounts that legitimately
    touch many hosts. A positive result is an out-of-character fan-out aligned with a new ticket; a negative
    result stays within the account''s learned breadth. This supports Credential Access by quantifying
    abnormal lateral reach following ticket forgery. References: [Authentication Graphs, Kent et al.](https://doi.org/10.1016/j.cose.2014.09.001).'
  answer_sources:
