name: 'T1558.001: Golden Ticket'
id: d24189da-8d55-45c1-ace6-219b25d05498
description: 'Investigate suspected forging of Kerberos ticket-granting tickets (Golden Tickets) by an
  adversary who has obtained the KRBTGT account password hash. Because a forged TGT is minted client-side,
  the KDC never logs the AS-REQ, so this playbook helps an analyst hunt for the tell-tale invariants:
  TGS requests (4769) or logons (4624) that lack a preceding DC-issued TGT (4768) inside the ticket lifetime,
  anomalous ticket lifetimes exceeding domain Kerberos policy (Mimikatz defaults to ~10 years), RC4-HMAC
  encryption where AES is expected, forged PAC/SID-History claims granting privileged SIDs the account
  does not legitimately hold, bursts of TGS requests across many SPNs, and lateral spread of a single
  account across many hosts after a ticket event. It combines symbolic-logic correlations, statistical
  baselining of ticket lifetime/cipher/source/privilege/fan-out, and machine-learning sequence and graph
  models to surface forged-ticket credential access.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
