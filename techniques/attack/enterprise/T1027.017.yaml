name: 'T1027.017: Obfuscated Files or Information: SVG Smuggling'
id: 215b5c9a-0ad0-4106-8c82-5b5a188f2728
description: 'Hunt for adversaries smuggling malicious payloads inside seemingly benign SVG (Scalable
  Vector Graphics) files to bypass content filters and evade detection (MITRE ATT&CK T1027.017). Because
  SVGs are XML-based, they can legitimately carry <script> tags, embedded JavaScript, and href/xlink references,
  which adversaries abuse to assemble or download second-stage payloads, redirect users to malicious infrastructure,
  or render fake login forms and download buttons. This playbook helps an analyst investigate SVGs delivered
  via email, web browsing, or cloud file sharing for: embedded delivery infrastructure matching threat
  intel or exhibiting suspicious lexical/entropy traits; client-side reconstruction logic (atob, Blob,
  URL.createObjectURL, download-attribute manipulation, programmatic anchor clicks, hidden iframes, scripted
  redirects); dense encoded content whose decoded bytes resemble executable, archive, script, or HTML
  payload headers; and post-open execution chains where opening an SVG is followed within minutes by script-interpreter
  or LOLBin execution, rare outbound network connections, or newly reconstructed payload files written
  to disk. It combines symbolic-logic matching, statistical baselining, and machine-learning approaches
  across email gateway, network (Zeek), and endpoint (Sysmon, Windows 4688, auditd, macOS) telemetry.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any embedded references inside observed SVG files (hashes, URLs, href/xlink:href targets,
    or script-referenced destinations) match known-malicious payload-delivery, phishing, or staging infrastructure,
    or exhibit high-entropy/numeric-heavy domain characteristics?
  context: 'Tactic TA0005 (Stealth): adversaries hide payload delivery inside image files to blend in
    with benign traffic. Extract every hash, URL, href/xlink:href target, and script-referenced destination
    from each SVG seen on the wire or in mail, then alert when any value matches threat intelligence for
    malware delivery, phishing, or payload staging. Because external lookups may be unavailable or stale,
    layer first-party lexical screening per [EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf):
    flag destinations whose domain has high n-gram/character entropy or a high numeric-character ratio,
    or that match the client-side reconstruction patterns documented for SVG smuggling in [HTML smugglers
    turn to SVG images](https://blog.talosintelligence.com/html-smugglers-turn-to-svg-images/). A positive
    match (or a strongly anomalous domain) suggests the SVG is a delivery
    vehicle rather than a benign graphic; the alert should surface the matched indicator(s), the SVG SHA256,
    and the delivery channel so an analyst can confirm provenance and scope.'
  answer_sources: &id001
  - Email Gateway Attachment Logs
  - Zeek files.log
  - Zeek http.log
  - Zeek dns.log
  - Sysmon Event ID 11
  - 'NAI: Enterprise Web Proxy, Mail Gateway, Cloud Access Security Broker, User Workstations, Threat
    Intelligence Platform'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Extract indicators from each SVG, match TI + lexical screen\nfor svg in svg_files:\n  iocs\
      \ = extract(svg, [sha256, urls, 'href', 'xlink:href', script_dst])\n  for d in iocs.domains:\n \
      \   if d in threat_intel(malware|phishing|staging)\n       or domain_entropy(d) > T_ent\n      \
      \ or numeric_ratio(d) > T_num:\n       alert(matched=ioc, sha256=svg.sha256, channel=svg.delivery_channel)"
- question: Which SVGs reference external destinations that are rare or never-before-seen for the sending
    user, business unit, or delivery channel, or whose referenced infrastructure shows elevated NXDOMAIN
    / HTTP 404 / blocked-connection rates or more than three distinct external references?
  context: 'Tactic TA0005 (Stealth): malicious SVGs frequently point to freshly registered or short-lived
    staging domains that do not appear in normal enterprise image traffic. Build a 30-day baseline of
    destinations referenced inside benign SVGs keyed by sender, business unit, and delivery channel, then
    flag SVGs whose referenced domains fall below the 1st percentile of enterprise prevalence or were
    never seen before. Add state/failure-mode signals: profile NXDOMAIN and HTTP 404/blocked-connection
    rates (newly registered or unresolvable staging domains spike these) and count distinct external references
    per SVG (alert when >3), per [EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).
    A positive result indicates an SVG reaching out to atypical
    infrastructure; emit the top-3 contributing features (prevalence rank, domain entropy, resolution-failure
    rate) for triage.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = prevalence(svg_refs, by=[sender,bu,channel], window=30d)\nfor svg in svg_files:\n\
      \  refs = external_refs(svg)\n  if prevalence_pct(refs, baseline) < 1\n     or count(distinct refs)\
      \ > 3\n     or nxdomain_rate(refs) high or http404_rate(refs) high:\n     alert(top3=[prevalence_rank,\
      \ domain_entropy, resolution_failure_rate])"
- question: When SVG feature vectors (script count, external-reference count, domain age, sender reputation,
    delivery channel, embedded URL structure) are scored by a supervised classifier, which files exceed
    the tuned operating threshold for malicious delivery?
  context: 'Tactic TA0005 (Stealth): single static rules are evadable, so a supervised model that combines
    structural SVG features with URL-string modeling can catch novel smuggling variants. Train a classifier
    on labeled SVG feature vectors and score embedded URLs directly from raw strings with a character/word-level
    model ([URLNet](https://arxiv.org/abs/1802.03162)), combined with the static HTML/JS feature filter
    from [Prophiler](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf). Escalate files
    above
    the tuned threshold. The alert must list the top-3 contributing features (not just a probability)
    so analysts can validate the verdict, distinguishing a genuinely malicious delivery SVG from a benign
    graphic that happens to share one suspicious attribute.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'features = vectorize(svg, [script_cnt, ext_ref_cnt, domain_age, sender_rep, channel, url_struct])

      url_score = URLNet(svg.embedded_urls)

      static = Prophiler_html_js(svg)

      p = clf.predict_proba([features, url_score, static])

      if p > tuned_threshold: alert(top3=top_features(clf))'
- question: Does an SVG's XML and embedded JavaScript co-occur with the canonical client-side payload-reconstruction
    API chain (e.g., atob + Blob/URL.createObjectURL + download-attribute manipulation, programmatic anchor
    .click(), hidden iframe creation, or scripted redirects)?
  context: 'Tactic TA0005 (Stealth): the hallmark of SVG/HTML smuggling is reassembling a payload entirely
    in the browser so nothing malicious traverses the network as a file. Parse SVG XML and embedded JavaScript
    and alert on the unitary reconstruction workflow that combines suspicious APIs/tokens such as atob,
    Blob, URL.createObjectURL, download-attribute manipulation, programmatic anchor .click(), hidden iframe
    creation, or scripted redirects. This is the canonical client-side payload-assembly chain described
    in [HTML smugglers turn to SVG images](https://blog.talosintelligence.com/html-smugglers-turn-to-svg-images/)
    and [MITRE T1027.017](https://attack.mitre.org/techniques/T1027/017/). Require co-occurrence (e.g.,
    decode + Blob/object-URL + download/redirect) to suppress benign single-API use. A positive match strongly
    implies smuggling; report which APIs matched so the analyst can read the script and confirm intent.'
  answer_sources: &id002
  - Email Gateway Attachment Logs
  - Zeek files.log
  - Zeek http.log
  - Sysmon Event ID 11
  - 'NAI: Mail Gateway, Enterprise Web Proxy, Sandbox Detonation Service, User Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "tokens = parse_xml_js(svg)\napis = match(tokens, [atob, Blob, 'URL.createObjectURL', download_attr,\
      \ anchor_click, hidden_iframe, redirect])\nif cooccur(decode) and cooccur(blob|object_url) and cooccur(download|redirect):\n\
      \  alert(matched_apis=apis, sha256=svg.sha256)"
- question: Which SVGs have JavaScript API usage, script-to-markup length ratio, encoded-string counts,
    or longest-encoded-string length that exceed the 99th percentile for benign design/marketing graphics?
  context: 'Tactic TA0005 (Stealth): benign SVGs are overwhelmingly script-free, so any inline executable
    script is itself a strong rarity signal. Maintain frequency baselines for JavaScript API usage, script-to-markup
    length ratio (Volume), count of encoded strings (Frequency), and longest encoded-string length across
    enterprise SVG traffic, then flag files whose values exceed the 99th percentile for benign graphics,
    using HTML/JS statistical features (eval/unescape density, script entropy, max string length) validated
    in [Prophiler](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf). A positive result
    means the SVG''s scripting profile is far outside normal for its workflow;
    the alert should list the top-3 deviating metrics.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = pctile(benign_svgs, [api_usage, script_markup_ratio, enc_str_cnt, max_enc_len])\n\
      for svg in svg_files:\n  m = measure(svg)\n  if any(m[k] > p99(baseline[k]) for k in metrics):\n\
      \     alert(top3=top_deviating(m, baseline))"
- question: When abstract-syntax-tree and token/data-flow features are extracted from embedded SVG scripts
    and scored by an obfuscation-resilient classifier, which scripts exhibit malicious intent such as
    a decode-to-download dependency?
  context: 'Tactic TA0005 (Stealth): adversaries obfuscate SVG scripts to defeat simple string matching,
    so AST- and data-flow-aware models are needed. Extract AST and token/data-flow features and score
    them with an obfuscation-resilient classifier — AST naive-Bayes context features ([ZOZZLE](https://www.usenix.org/legacy/event/sec11/tech/full_papers/Curtsinger.pdf)),
    syntactic-unit n-grams ([JaSt](https://swag.cispa.saarland/papers/fass2018jast.pdf)), or multi-representation
    token/AST/CFG/PDG ensembles ([JStap](https://swag.cispa.saarland/papers/fass2019jstap.pdf)) whose PDG
    view captures the decode-to-download dependency. Escalate scripts above threshold and surface the top-3
    contributing
    AST/data-flow features in the alert so the analyst can see why the script is suspicious even when
    the source is minified or encoded.'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'ast = build_ast(svg.scripts)

      feat = extract(ast, [naive_bayes_ctx(ZOZZLE), ngrams(JaSt), dataflow_pdg(JStap)])

      score = model.predict(feat)

      if score > threshold: alert(top3=top_ast_dataflow_features(feat))'
- question: 'After decoding inline Base64 and data: URI content from an SVG, do the resulting bytes contain
    executable, archive, script, or HTML magic values (e.g., MZ, PK, ELF, <html, <?php, <script) indicating
    a concealed second-stage artifact?'
  context: 'Tactic TA0005 (Stealth): SVG smuggling conceals a real payload inside what looks like an image.
    Decode inline Base64 and data: URI content and inspect the resulting bytes for executable, archive,
    script, or HTML magic values such as MZ, PK, ELF, <html, <?php, or <script, alerting when embedded
    material resolves into a plausible payload rather than image metadata — consistent with the reconstructed
    ZIP/EXE delivery in [HTML smugglers turn to SVG images](https://blog.talosintelligence.com/html-smugglers-turn-to-svg-images/)
    and signatures akin to [Neo23x0 signature-base](https://github.com/Neo23x0/signature-base). A positive
    result is high-fidelity evidence
    the SVG carries a hidden artifact; report the detected magic value and decoded byte size so the analyst
    can carve and detonate the payload.'
  answer_sources: &id003
  - Email Gateway Attachment Logs
  - Zeek files.log
  - Zeek http.log
  - Sysmon Event ID 11
  - 'NAI: Mail Gateway, Web Proxy, File Analysis Sandbox, File Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for blob in decode_base64_and_datauri(svg):\n  magic = first_bytes(blob)\n  if magic in ['MZ','PK','ELF','<html','<?php','<script']:\n\
      \     alert(magic=magic, decoded_size=len(blob), sha256=svg.sha256)"
- question: Which SVGs contain encoded blocks whose decoded entropy exceeds ~7.0 bits/byte, or whose encoded-string
    length, decoded byte size, or encoded-content fraction exceed the 98th percentile for their workflow?
  context: 'Tactic TA0005 (Stealth): packed or encrypted payloads hidden in SVGs produce abnormally dense,
    high-entropy encoded blocks that legitimate vector graphics rarely contain. Baseline encoded-string
    length, Shannon entropy, decoded byte size (Volume), and the percentage of the document occupied by
    encoded content for benign SVGs, then surface files whose decoded blocks exceed ~7.0 bits/byte entropy
    or whose metrics exceed the 98th percentile for their workflow, using thresholds grounded in [Using
    Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989)
    and [Baseline Payload Entropy Values for Common Internet Services](https://www.mdpi.com/1999-5903/16/12/470).
    A positive result suggests concealed compressed/encrypted content;
    alert with the top-3 metrics (entropy, decoded size, encoded-fraction).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = pctile(benign_svgs, [enc_str_len, entropy, decoded_size, enc_fraction])\nfor svg\
      \ in svg_files:\n  for blob in encoded_blocks(svg):\n    if shannon_entropy(blob) > 7.0\n      \
      \ or metric_exceeds(svg, p98(baseline)):\n       alert(top3=[entropy, decoded_size, enc_fraction])"
- question: When an unsupervised anomaly model scores SVGs on file size, entropy, encoded-block count,
    decoded content type, and script density, which files are structurally unlike known-good enterprise
    graphics?
  context: 'Tactic TA0005 (Stealth): payload-bearing SVGs occupy a structurally distinct region of feature
    space versus normal graphics, even when no single threshold is tripped. Use an unsupervised anomaly
    model (e.g., [Extended Isolation Forest](https://arxiv.org/pdf/1811.02141)) over file size, entropy,
    encoded-block count, decoded content type, and script density to flag SVGs structurally unlike known-good
    enterprise graphics, complementing the static feature set in [Prophiler](https://sites.cs.ucsb.edu/~chris/research/doc/www11_prophiler.pdf).
    Escalate high-anomaly files and output the top-3 features driving
    the anomaly score for triage, so analysts can quickly judge whether the structural outlier is a benign
    edge case or a smuggling artifact.'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = features(svg, [file_size, entropy, enc_block_cnt, decoded_type, script_density])\nscore\
      \ = ExtendedIsolationForest.decision_function(X)\nif score < anomaly_threshold:\n  alert(top3=top_anomaly_features(X))"
- question: Within a 5-minute window after a browser, mail client, or document reader opens an SVG, does
    the same host spawn script interpreters or LOLBins (powershell.exe, mshta.exe, rundll32.exe, wscript.exe,
    cscript.exe, osascript, bash/python, archive utilities), write a new file, or make outbound connections
    indicative of payload reconstruction?
  context: 'Tactic TA0005 (Stealth): the payoff of SVG smuggling is execution, so correlating the SVG
    open with immediate follow-on activity catches the technique in action. Correlate browser, mail-client,
    or document-reader access to an SVG with subsequent child-process launches, file writes, or outbound
    connections from the same host within a 5-minute window, alerting when the sequence includes interpreters
    such as powershell.exe, mshta.exe, rundll32.exe, wscript.exe, cscript.exe, osascript, bash/python,
    or archive utilities indicative of payload reconstruction, as described in [MITRE T1027.017](https://attack.mitre.org/techniques/T1027/017/)
    and the SVG smuggling kill chain in [HTML smugglers turn to SVG images](https://blog.talosintelligence.com/html-smugglers-turn-to-svg-images/);
    combine with download-then-execute patterns like [SigmaHQ susp download patterns](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_susp_download_patterns.yml).
    A positive correlation is strong evidence of successful smuggling-to-execution and should drive host
    isolation and payload retrieval.'
  answer_sources: &id004
  - Zeek http.log
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: User Workstations, DNS Resolvers, Network Egress Points, Endpoint Detection Platform'
  range: Last 90 days; correlate within a 5-minute window around each SVG-open event
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for open_evt in svg_opens(browser|mail|docreader):\n  win = events(host=open_evt.host, t in\
      \ [open_evt.t, open_evt.t+5m])\n  if win.child_proc in [powershell,mshta,rundll32,wscript,cscript,osascript,bash,python,archive]\n\
      \     or win.new_file_write or win.outbound_conn(rare_dst):\n     alert(seq=win, sha256=open_evt.svg_sha256)"
- question: Which SVG-driven execution chains fall below the 1st percentile of normal for their application's
    parent-child process pairs, follow-on DNS lookups, and file-write patterns, or coincide with elevated
    NXDOMAIN and blocked/failed outbound connections?
  context: 'Tactic TA0005 (Stealth): normal image opens have a predictable, narrow behavioral footprint,
    so a smuggled-payload chain stands out statistically. Build per-application baselines for parent-child
    process pairs, follow-on DNS lookups (Frequency), and file-write patterns after benign image opens,
    then score new SVG-driven sequences and alert when the combined chain falls below the 1st percentile
    of normal. Add failure-mode signals: count NXDOMAIN responses and blocked/failed outbound connections
    in the window (staging infra is often newly registered or sinkholed), per [EXPOSURE](https://www.ndss-symposium.org/wp-content/uploads/2017/09/12_3.pdf).
    Surface the top-3 anomalous chain elements so the analyst can see exactly which step diverged from baseline.'
  answer_sources: *id004
  range: Last 90 days; correlate within a 5-minute window around each SVG-open event
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = pctile_per_app(benign_image_opens, [parent_child, dns_followon, file_writes])\n\
      for seq in svg_driven_chains:\n  if chain_pctile(seq, baseline) < 1\n     or nxdomain_count(seq.window)\
      \ high\n     or blocked_conn_count(seq.window) high:\n     alert(top3=top_anomalous_chain_elements(seq))"
- question: When a sequence/graph model scores each SVG-centered event chain of process, file, and network
    activity, which chains diverge from learned benign document- and image-open patterns?
  context: 'Tactic TA0005 (Stealth): multi-step kill chains are best modeled as sequences or graphs rather
    than isolated events. Train a sequence/graph model on host telemetry around benign document and image
    opens, then score each SVG-centered event chain and escalate sequences whose reconstructed process,
    file, and network activity diverge from learned benign patterns; data-flow/dependency features ([JStap](https://swag.cispa.saarland/papers/fass2019jstap.pdf))
    help link the SVG script to its spawned execution. Report the top-3 contributing events (e.g., interpreter
    spawn, rare destination, new file write) so the analyst understands which part of the chain drove
    the score and can corroborate with raw telemetry.'
  answer_sources: *id004
  range: Last 90 days; correlate within a 5-minute window around each SVG-open event
  queries:
  - technology: ML/pseudocode
    query: "model = train_seq_graph(benign_doc_image_open_telemetry)\nfor chain in svg_centered_chains:\n\
      \  g = build_graph(chain.proc, chain.file, chain.net) + dataflow(JStap)\n  score = model.score(g)\n\
      \  if score > divergence_threshold:\n     alert(top3=[interpreter_spawn, rare_destination, new_file_write])"
