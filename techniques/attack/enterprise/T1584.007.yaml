- question: '[Resource Development] URI entropy thresholding: Can you determine whether an outbound HTTP
    request, captured in Zeek http.log, to a known serverless domain pattern (e.g., *.workers.dev, *.lambda-url.*.on.aws)
    contains a URI path, query parameters, or a User-Agent string that matches a regular expression signature
    for a known command-and-control framework. -- specifically, using the ''URI entropy thresholding''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary establishes
    or compromises serverless cloud infrastructure to host command-and-control or proxy exfiltration so
    that malicious traffic appears to come from trusted cloud-provider subdomains, frustrating attribution
    and IP-based blocking. This evidence focuses on the condition that an outbound HTTP request, captured
    in Zeek http.log, to a known serverless domain pattern (e.g., *.workers.dev, *.lambda-url.*.on.aws)
    contains a URI path, query parameters, or a User-Agent string that matches a regular expression signature
    for a known command-and-control framework. This Statistical Method approach works as follows: Compute
    Shannon entropy of URI paths and query strings for requests to serverless domains and compare against
    the per-service baseline; alert when entropy exceeds 3 standard deviations from the mean or sits in
    the encrypted/encoded band (~>7.0), indicating encoded C2 payloads ([Using Entropy Analysis to Find
    Encrypted and Packed Malware, Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989)). Track
    request/response byte volume and asymmetry as parallel Physics-of-the-attack metrics. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable adversary use of serverless
    infrastructure for C2 or exfiltration; pivot to the responsible host and (where available) the process
