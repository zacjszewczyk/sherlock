- question: '[Resource Development] Domain classifier for algorithmic serverless C2: Can you determine
    whether an internal host generates a DNS query (Zeek dns.log) or an HTTP request (Zeek http.log) for
    a domain or URL that has a positive match against a curated threat intelligence feed of known malicious
