- question: '[Resource Development] Failure-rate profiling for serverless resolution: Can you determine
    whether an internal host generates a DNS query (Zeek dns.log) or an HTTP request (Zeek http.log) for
    a domain or URL that has a positive match against a curated threat intelligence feed of known malicious
    serverless infrastructure. -- specifically, using the ''Failure-rate profiling for serverless resolution''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary establishes
    or compromises serverless cloud infrastructure to host command-and-control or proxy exfiltration so
    that malicious traffic appears to come from trusted cloud-provider subdomains, frustrating attribution
    and IP-based blocking. This evidence focuses on the condition that an internal host generates a DNS
    query (Zeek dns.log) or an HTTP request (Zeek http.log) for a domain or URL that has a positive match
    against a curated threat intelligence feed of known malicious serverless infrastructure. This Statistical
    Method approach works as follows: Treat resolution/connection failures as a distinct signal. Per host,
    track the NXDOMAIN rate and ratio of failed (RCODE!=0) to successful serverless-domain lookups in
    Zeek dns.log and blocked/reset connections in conn.log; a burst of failed lookups to algorithmically
    named serverless subdomains indicates dead/rotated infrastructure ([Real-Time Detection of DNS Exfiltration
    and Tunneling, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf)). Alert when
    failed-lookup count exceeds 3.5 modified-Z over the host baseline. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable adversary use of serverless infrastructure
    for C2 or exfiltration; pivot to the responsible host and (where available) the process and its parent
    lineage, the user, the specific serverless FQDN and provider/ASN, the TLS fingerprint (JA3/JA4), the
    byte volume, direction, and cadence of the traffic, and any follow-on internal discovery, authentication,
    or file-access activity to scope the intrusion. A negative result helps rule out this particular serverless
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, jittered, low-and-slow, or domain-fronted serverless C2 that imitates benign cloud
    traffic.'
