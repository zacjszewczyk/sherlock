questions:
- question: '[Resource Development] IOC correlation for serverless domains: Can you determine whether
    an internal host generates a DNS query (Zeek dns.log) or an HTTP request (Zeek http.log) for a domain
    or URL that has a positive match against a curated threat intelligence feed of known malicious serverless
    infrastructure. -- specifically, using the ''IOC correlation for serverless domains'' (Symbolic Logic)
    approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary establishes
    or compromises serverless cloud infrastructure to host command-and-control or proxy exfiltration so
    that malicious traffic appears to come from trusted cloud-provider subdomains, frustrating attribution
    and IP-based blocking. This evidence focuses on the condition that an internal host generates a DNS
    query (Zeek dns.log) or an HTTP request (Zeek http.log) for a domain or URL that has a positive match
    against a curated threat intelligence feed of known malicious serverless infrastructure. This Symbolic
    Logic approach works as follows: Ingest threat-intelligence feeds tracking malicious serverless endpoints
    (specific *.workers.dev, *.lambda-url.*.on.aws, *.execute-api.*.amazonaws.com, *.azurewebsites.net,
    script.google.com FQDNs) and deploy portable rules ([Sigma](https://github.com/SigmaHQ/sigma)) that
    query Zeek dns.log and http.log for matches. Alert on any positive hit. Corroborate with TLS-stack
    rarity by joining Zeek ssl.log JA3/JA4 hashes ([JA3](https://github.com/salesforce/ja3), [JA4+](https://github.com/FoxIO-LLC/ja4))
    so non-browser clients reaching these benign-SNI cloud fronts are surfaced even without an IOC hit,
    since serverless redirectors hide the real C2 IP ([AWS Lambda Redirector](https://redsiege.com/blog/2020/11/aws-lambda-redirector/)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable adversary
    use of serverless infrastructure for C2 or exfiltration; pivot to the responsible host and (where
    available) the process and its parent lineage, the user, the specific serverless FQDN and provider/ASN,
    the TLS fingerprint (JA3/JA4), the byte volume, direction, and cadence of the traffic, and any follow-on
    internal discovery, authentication, or file-access activity to scope the intrusion. A negative result
    helps rule out this particular serverless vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, jittered, low-and-slow, or domain-fronted
    serverless C2 that imitates benign cloud traffic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Threat Intelligence Feeds
  - Internet Scan
  - 'NAI: Internet egress points (e.g., firewalls, web proxies), Enterprise DNS resolvers, SIEM or log
    aggregation platform'
  range: Last 90 days (correlate event-centered windows of +/- 10 minutes around the serverless connection)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# IOC correlation for serverless domains (Symbolic Logic)

      source IN [''Zeek conn.log'', ''Zeek dns.log'', ''Zeek http.log'', ''Threat Intelligence Feeds'',
      ''Internet Scan'']

      | approach: Ingest threat-intelligence feeds tracking malicious serverless endpoints (specific *.workers.dev,
      *.lambda-url.*.on.aws, *.execute-api.*.amazonaws.com, *.azurewebsites.net, script.google.com FQDNs)
      and deploy portable rules ([Sigma](https:/

      | correlate over NAI: Internet egress points (e.g., firewalls, web proxies), Enterprise DNS resolvers,
      SIEM or log aggregation platform

      | emit alert with contributing fields and entity context (host, process, user, serverless FQDN,
      provider/ASN, JA3/JA4, bytes, cadence)'
  - technology: Zeek/pseudocode
    query: '# IOC correlation for serverless domains (Zeek view)

      watch conn.log/dns.log/http.log/ssl.log for traffic to serverless patterns (*.workers.dev, *.lambda-url.*.on.aws,
      *.execute-api.*.amazonaws.com, *.azurewebsites.net, script.google.com)

      | join dns/http/ssl on uid/host; enrich with JA3/JA4 and provider ASN

      | evaluate per host-dest: request count, bytes orig:resp, inter-arrival jitter, subdomain entropy,
      failure rate

      | emit candidate serverless C2/exfil with host, dest FQDN, bytes, cadence, JA3/JA4'
- question: '[Resource Development] Frequency scoring for serverless domain requests: Can you determine
    whether an internal host generates a DNS query (Zeek dns.log) or an HTTP request (Zeek http.log) for
    a domain or URL that has a positive match against a curated threat intelligence feed of known malicious
    serverless infrastructure. -- specifically, using the ''Frequency scoring for serverless domain requests''
    (Statistical Method) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary establishes
    or compromises serverless cloud infrastructure to host command-and-control or proxy exfiltration so
    that malicious traffic appears to come from trusted cloud-provider subdomains, frustrating attribution
    and IP-based blocking. This evidence focuses on the condition that an internal host generates a DNS
    query (Zeek dns.log) or an HTTP request (Zeek http.log) for a domain or URL that has a positive match
    against a curated threat intelligence feed of known malicious serverless infrastructure. This Statistical
    Method approach works as follows: Per host, count daily requests to generic serverless domains. Flag
    hosts above the 99th percentile, but compute the cut with a median-absolute-deviation modified Z-score
    (|Mz|>3.5) so batch jobs and noisy baselines do not distort the threshold ([Modified Z-Score for Anomaly
    Detection](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly)). Derive provider-specific
    baselines per environment (legitimate apps using Lambda URLs raise the floor). A positive result --
    a rule match, statistical outlier, or model alert -- indicates probable adversary use of serverless
    infrastructure for C2 or exfiltration; pivot to the responsible host and (where available) the process
    and its parent lineage, the user, the specific serverless FQDN and provider/ASN, the TLS fingerprint
    (JA3/JA4), the byte volume, direction, and cadence of the traffic, and any follow-on internal discovery,
    authentication, or file-access activity to scope the intrusion. A negative result helps rule out this
    particular serverless vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, jittered, low-and-slow, or domain-fronted serverless C2 that
    imitates benign cloud traffic.'
