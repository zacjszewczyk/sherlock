name: 'T1584.007: Serverless'
id: d12d00ee-e7c2-41f5-9086-d61e2b41ae7f
description: 'This playbook helps an analyst investigate whether an adversary is leveraging compromised
  or purpose-built serverless cloud infrastructure -- such as Cloudflare Workers (*.workers.dev), AWS
  Lambda function URLs (*.lambda-url.*.on.aws, *.execute-api.*.amazonaws.com), Azure (*.azurewebsites.net),
  or Google Apps Script (script.google.com) -- for command-and-control (C2) or data exfiltration (MITRE
  ATT&CK T1584.007, Serverless, under Resource Development TA0042). Because serverless redirectors make
  traffic appear to originate from common cloud-provider subdomains, adversaries use them to hide the
  true C2 IP and blend malicious traffic into ordinary cloud usage. Much of the resource-development activity
  occurs outside the target''s visibility, so this playbook focuses detection on the observable stages
  where internal hosts actually touch that infrastructure. It pursues the behavior from several complementary
  angles: threat-intelligence IOC correlation against Zeek dns.log/http.log for known serverless C2 endpoints
  (corroborated with JA3/JA4 TLS fingerprint rarity); per-host frequency and DNS/connection failure-rate
  profiling using modified Z-scores; entropy- and lexical-feature classifiers that separate algorithmically
  generated serverless subdomains from legitimate service names; regex and TLS-fingerprint signatures
  for known C2 frameworks (Cobalt Strike, Sliver) plus domain-fronting SNI/Host-header mismatch detection;
  URI/payload entropy thresholding; beacon detection on Zeek conn.log via high-count/low-volume thresholds,
  jitter/byte coefficient-of-variation scoring, and FFT/HMM/LSTM periodicity analysis; endpoint process-to-connection
  correlation (Windows Event ID 5156 joined to 4688) surfacing unapproved or temp-path binaries and rare
  process lineage scored with Isolation Forest; and stateful sequence detection that ties a serverless
  connection to subsequent internal discovery, failed logons, or anomalous file access. Detection methods
  span deterministic symbolic-logic rules, statistical baselining, and machine learning, applied across
  Zeek conn/dns/http/ssl logs and Windows Security event logs, so the analyst can corroborate suspected
  serverless C2/exfiltration against network fingerprints, beaconing cadence, process lineage, and follow-on
  adversary behavior.'
type: technique
