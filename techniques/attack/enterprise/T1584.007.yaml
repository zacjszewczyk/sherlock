  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary establishes
    or compromises serverless cloud infrastructure to host command-and-control or proxy exfiltration so
    that malicious traffic appears to come from trusted cloud-provider subdomains, frustrating attribution
    and IP-based blocking. This evidence focuses on the condition that an internal host generates a DNS
    query (Zeek dns.log) or an HTTP request (Zeek http.log) for a domain or URL that has a positive match
    against a curated threat intelligence feed of known malicious serverless infrastructure. This Machine
    Learning approach works as follows: Train a Random Forest on serverless subdomain features (length,
    Shannon entropy and entropy band, n-gram/character distribution, digit ratio, label count) to separate
    legitimate service names from algorithmically generated ones; entropy bands above ~4.5-6.5 toward
    random strings are a strong discriminator ([Using Entropy Analysis to Find Encrypted and Packed Malware,
    Lyda and Hamrock](https://ieeexplore.ieee.org/document/4140989)). Emit the top-3 contributing features
    (e.g., entropy, digit-ratio, n-gram rarity) in the alert for triage. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable adversary use of serverless infrastructure
    for C2 or exfiltration; pivot to the responsible host and (where available) the process and its parent
    lineage, the user, the specific serverless FQDN and provider/ASN, the TLS fingerprint (JA3/JA4), the
    byte volume, direction, and cadence of the traffic, and any follow-on internal discovery, authentication,
    or file-access activity to scope the intrusion. A negative result helps rule out this particular serverless
    vector but should be corroborated with the other questions in this playbook, since a single method
