name: 'T1596.003: Digital Certificates'
id: cfe23948-bfe7-459a-bd9e-a4b977fbb123
description: 'Investigate evidence that an adversary is conducting reconnaissance by harvesting public
  digital certificate data about the organization. Adversaries query Certificate Transparency (CT) logs
  and certificate-lookup services (e.g., crt.sh, censys.io) to enumerate hostnames, subdomains, organizational
  identity, and infrastructure exposed in SSL/TLS certificate subject and Subject Alternative Name (SAN)
  fields, then use that intelligence to scope active scanning, phishing, capability development, and initial
  access. This playbook helps an analyst look two ways: (1) internal hosts reaching out to certificate-recon
  services and CT log endpoints in ways that suggest scripted enumeration (anomalous volume, diversity,
  failure rates, automated tool/User-Agent and JA4 fingerprints, and behavior inconsistent with peer baselines),
  and (2) external source IPs hammering the organization''s own public-facing servers with many SSL/TLS
  handshakes across a wide range of SNI names to harvest the certificates served. It combines symbolic-logic
  threat-intel correlation, statistical baselining/change-point methods, and machine-learning anomaly
  detection across Zeek DNS/HTTP/SSL/conn logs and Windows endpoint telemetry.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any single internal host resolve DNS for, or connect to, threat-intel watchlisted certificate-reconnaissance
    services (crt.sh, censys.io, CT log endpoints) or known scanner/C2 infrastructure, and what process
    initiated it?
  context: 'This is the symbolic-logic backbone for the internal-reconnaissance hunt under the Reconnaissance
    tactic. Adversaries (or compromised insiders pivoting outward) use certificate-recon services and
    CT log endpoints to enumerate the organization''s hostnames, subdomains, and certificate-derived identity.
    Maintain a watchlist of the Censys/CT ecosystem and known ZMap/ZGrab scan sources, then alert when
    Zeek dns.log or conn.log shows a resolution or connection to a watchlisted domain/IP. Correlate the
    connection with Windows Event ID 4688 process-creation lineage to attribute the activity to a specific
    binary (a browser is plausibly benign; python.exe, curl, go-based tooling, or an unsigned binary is
    suspicious). Surface certificate subject/SAN fields to triage what was harvested. A positive result
    is an internal host plus an unexpected initiating process reaching recon infrastructure; a negative
    result is no watchlist hits or only browser-driven analyst activity. References: [Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf),
    [Certificate Transparency, RFC 6962](https://www.rfc-editor.org/rfc/rfc6962.txt), [ZMap](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf),
    [Threat Hunting with TLS/SSL Certificates](https://www.splunk.com/en_us/blog/security/threat-hunting-with-tls-ssl-certificates.html).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Firewalls, Proxies), Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  (dns.log.query IN cert_recon_watchlist) OR (conn.log.resp_h IN scanner_ip_watchlist)\n\
      \  | join host, time +/- 5m with (EventID=4688)\n  | output src_host, query, resp_h, NewProcessName,\
      \ ParentProcessName, cert_subject, cert_san"
  - technology: Zeek/pseudocode
    query: ">-\n  dns.log | where query in cert_recon_watchlist => emit src, query, answers;\n  conn.log\
      \ | where resp_h in scanner_ip_watchlist => emit src, resp_h, service"
- question: Has any internal host's count of unique certificate-recon domains or total query volume deviated
    sharply from its own rolling 30-day baseline and from its peer group, or shown an abrupt change-point
    onset?
  context: 'This statistical method detects scripted enumeration that the watchlist alone would miss.
    Track per-host hourly counts of unique recon domains AND total query volume over a rolling 30-day
    window, compare each host to its peer-group baseline, and alert when either exceeds the 98th percentile.
    Layer CUSUM/PELT change-point detection to flag an abrupt onset of recon lookups that is distinct
    from gradual baseline drift - a sudden step-change is a strong signal of a newly introduced tool or
    compromised host beginning reconnaissance. Derive percentile thresholds per environment because a
    security team or developer workstation will legitimately carry higher recon-domain traffic. A positive
    result is a host whose recon-domain breadth or volume spikes above peers with a clear change-point;
    a negative result is steady, peer-consistent traffic. References: [change-point detection survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Firewalls, Proxies), Endpoints'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host, hour: u = dcount(recon_domain), v = count(queries)\n  baseline_30d per host\
      \ & peer_group\n  alert if u > p98(peer) OR v > p98(peer)\n  changepoint(CUSUM|PELT) on host series\
      \ => alert on abrupt onset"
- question: Is any internal host showing a spike in NXDOMAIN responses or blocked/failed egress toward
    recon domains co-occurring with elevated unique-domain fanout?
  context: 'Failure-rate is a distinct first-class signal of automated enumeration. Profile the per-host
    NXDOMAIN ratio and the blocked-egress/connection-failure count toward recon domains. Scripted certificate-recon
    tooling iterates over candidate hostnames and frequently produces failed resolutions and reset/blocked
    connections, whereas human browsing rarely does. A spike in failed resolutions or connection failures
    that co-occurs with elevated unique-domain fanout indicates programmatic enumeration rather than interactive
    use. This is tactic-specific to Reconnaissance: the adversary is probing breadth, not reaching a single
    known destination. A positive result is high failure ratio plus broad fanout from one host; a negative
    result is normal failure ratios consistent with everyday DNS noise. References: [Real-Time Detection
    of DNS Exfiltration, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf), [Detecting
    Password Spraying Attacks](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Firewalls, Proxies), Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host, window: nx_ratio = count(rcode=NXDOMAIN)/count(all)\n  fail = count(conn blocked|reset\
      \ toward recon_domains)\n  fanout = dcount(recon_domain)\n  alert if nx_ratio high AND fanout high,\
      \ or fail spikes with fanout"
- question: After modeling daily/weekly seasonality, does any host show a burst in recon-domain connection
    volume that is not explained by its normal periodic peaks?
  context: 'Seasonal-Hybrid ESD (STL decomposition plus robust median/MAD ESD) models the daily and weekly
    periodicity in a host''s recon-domain connection volume so that normal recurring peaks (e.g., morning
    logon surges, scheduled jobs) do not generate alerts, while genuine anomalous bursts do. This reduces
    false positives relative to a static threshold and is well-suited to the Reconnaissance tactic where
    an adversary''s enumeration burst is short and out-of-pattern. Include the contributing day/hour bucket
    and feature in the alert text so the analyst can immediately see when and why the host tripped. A
    positive result is a residual burst flagged by S-H ESD after seasonality is removed; a negative result
    is volume fully explained by seasonal structure. References: [Seasonal-Hybrid ESD](https://arxiv.org/pdf/1704.07706).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Firewalls, Proxies), Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  series = per_host_hourly(recon_domain_conn_volume)\n  decomp = STL(series, period=daily,weekly)\n\
      \  resid = decomp.residual\n  flag = ESD_median_MAD(resid)\n  alert with host, day/hour bucket,\
      \ contributing feature"
- question: Do any host feature vectors (unique recon-domain count, query rate, NXDOMAIN ratio, inter-request
    delta) score as outliers under Isolation Forest, and which features drove the score?
  context: 'Isolation Forest / Extended Isolation Forest scores multi-dimensional per-host behavior and
    isolates anomalies via short average path-length, capturing combinations of features that no single
    threshold would catch. Build per-host feature vectors from unique recon-domain count, query rate,
    NXDOMAIN ratio, and inter-request delta, then alert on short path-length outliers. Surface the top-3
    contributing features (LIME-style attribution) in the alert so the analyst understands whether, for
    example, the host is anomalous because of extreme domain breadth combined with a machine-like inter-request
    delta. For Reconnaissance, this catches stealthy enumeration that stays under individual metric thresholds
    but is jointly anomalous. A positive result is a low isolation path-length with interpretable driving
    features; a negative result is a host scoring near the normal population. References: [Isolation Forest](https://doi.org/10.1109/ICDM.2008.17),
    [Extended Isolation Forest](https://arxiv.org/abs/1811.02141), [Robust IoT IF/OCSVM with LIME](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Network Egress Points (e.g., Firewalls, Proxies), Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = per_host[unique_recon_domains, query_rate, nx_ratio, inter_req_delta]\n  model =\
      \ IsolationForest|ExtendedIF fit X\n  score = model.path_length(X)\n  alert if score in outlier\
      \ tail; attach top3 features via LIME"
- question: Are any internal HTTP/S requests to Certificate Transparency log domains matching recon-tool
    User-Agent regexes or automated-client JA4/JA4H/JA4X fingerprints, even when the User-Agent is spoofed?
  context: 'This symbolic-logic check identifies automated certificate-recon tooling reaching CT log domains.
    Match Zeek http.log against regexes for reconnaissance-tool User-Agents (masscan, censys, sublist3r,
    Python/Go/curl libraries) and suspicious scripted URI query patterns toward CT log domains. Because
    User-Agent strings are trivially spoofed, ALSO match the JA4/JA4H/JA4X client fingerprint of automated
    TLS stacks, which reveals the true client library regardless of the advertised UA. Enrich hits with
    the certificate subject/SAN fields and the recon-service inventory to understand what is being queried.
    Under Reconnaissance, a CT log query with a scripting-language client fingerprint is a strong indicator
    of programmatic harvesting. A positive result is a CT-domain request with a recon UA or automated
    JA4 fingerprint; a negative result is ordinary browser traffic. References: [JA4+](https://github.com/FoxIO-LLC/ja4),
    [Threat Hunting with TLS/SSL Certificates](https://www.splunk.com/en_us/blog/security/threat-hunting-with-tls-ssl-certificates.html),
    [Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf), [Certificate Transparency, RFC 6962](https://www.rfc-editor.org/rfc/rfc6962.txt).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Web Proxies with SSL/TLS Decryption, Network Egress Points, Endpoint Detection and Response
    (EDR) agents'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  http.log | where host in ct_log_domains\n    and (user_agent =~ /(masscan|censys|sublist3r|python-requests|Go-http|curl)/i\n\
      \         or uri =~ scripted_query_pattern)\n  join ssl.log on uid | where ja4 in automated_client_fingerprints\n\
      \  => emit src, host, user_agent, ja4, cert_subject, cert_san"
- question: For traffic to CT log domains, has any host's User-Agent entropy, request frequency, or HTTP
    error-response ratio exceeded three standard deviations above its 30-day mean?
  context: 'This statistical method baselines per-host behavior toward CT domains over one-hour windows
    along three axes: (1) User-Agent string entropy, (2) request frequency (requests/min) and total bytes
    to CT domains, and (3) the HTTP 404/error-response ratio. Alert when entropy or rate exceeds three
    standard deviations above the 30-day mean, or when the error ratio spikes alongside volume. High UA
    entropy can indicate randomized/rotating agents; high request frequency indicates scripted iteration;
    an error-ratio spike indicates blind enumeration of candidate paths. Tied to Reconnaissance, this
    captures automated CT harvesting that evades signature matching. A positive result is a 3-sigma excursion
    on any axis; a negative result is behavior within normal bounds. References: [Real-Time Detection
    of DNS Exfiltration, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf), [Detecting
    Password Spraying Attacks](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Web Proxies with SSL/TLS Decryption, Network Egress Points, Endpoint Detection and Response
    (EDR) agents'
  range: Last 90 days (30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host, 1h window toward ct_log_domains:\n    ua_entropy = entropy(user_agent)\n \
      \   rate = count/min ; bytes = sum(resp_bytes)\n    err_ratio = count(status>=400)/count(all)\n\
      \  alert if ua_entropy > mean30d+3sd OR rate > mean30d+3sd\n        OR (err_ratio spikes AND volume\
      \ high)"
- question: Does a supervised classifier trained on CT log HTTP request features flag any request as malicious
    with probability greater than 0.9, and which features explain the score?
  context: 'Train a Random Forest / Gradient Boosting classifier on CT log HTTP requests using features
    such as User-Agent length and entropy, recon-keyword presence, query-parameter ratios, inter-request
    delta, and error ratio, then flag requests whose malicious probability exceeds 0.9. Surface the top-3
    contributing features in the alert for explainability so the analyst can validate whether, for example,
    a short scripted UA plus a high query-parameter ratio drove the decision. This supervised approach
    complements the unsupervised methods by learning the joint signature of known recon tooling against
    CT logs. For the Reconnaissance tactic, a high-confidence classification points to deliberate certificate
    harvesting. A positive result is probability > 0.9 with sensible feature attribution; a negative result
    is low malicious probability. References: [Isolation Forest](https://doi.org/10.1109/ICDM.2008.17),
    [Robust IoT IF/OCSVM with LIME](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - Zeek dns.log
  - 'NAI: Web Proxies with SSL/TLS Decryption, Network Egress Points, Endpoint Detection and Response
    (EDR) agents'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  feats = [ua_len, ua_entropy, keyword_present, qparam_ratio, inter_req_delta, err_ratio]\n\
      \  model = RandomForest|GradientBoosting (trained labeled CT requests)\n  p = model.predict_proba(feats)\n\
      \  alert if p > 0.9; attach top3 contributing features"
- question: Did any host in a low-risk business group (e.g., finance, HR) query Certificate Transparency
    log domains, and which process on that host initiated the lookup?
  context: 'This symbolic-logic check leverages the expectation that certain business units have no legitimate
    reason to query CT log infrastructure. Alert when hosts in low-risk groups (finance, HR) query CT
    log domains, and correlate with Windows Event ID 5156 (filtering-platform network connection allowed)
    and Event ID 4688 (process creation) to identify the initiating process. Scope the CT-domain list
    from the CT ecosystem. A finance workstation suddenly resolving crt.sh or other CT logs - especially
    driven by a scripting interpreter rather than a browser - is highly anomalous and may indicate a compromised
    host being used for reconnaissance. A positive result is a low-risk-group host querying CT domains
    with an unexpected initiating process; a negative result is no such queries or benign browser-driven
    access. References: [Certificate Transparency, RFC 6962](https://www.rfc-editor.org/rfc/rfc6962.txt),
    [Censys](https://jhalderm.com/pub/papers/censys-ccs15.pdf).'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Domain Controllers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  dns.log | where query in ct_log_domains and src_host in low_risk_groups\n  | join host,\
      \ time +/- 5m with (EventID=5156 or EventID=4688)\n  | output src_host, query, NewProcessName, ParentProcessName,\
      \ dest_addr"
- question: For each host, do hourly CT query count and second-level-domain lexical entropy/unique-query
    ratio both exceed their 99th percentiles, and what is the NXDOMAIN ratio?
  context: 'This dual-metric statistical method requires two independent indicators to fire together,
    reducing false positives. Monitor per-host hourly CT query count and the second-level-domain lexical
    entropy / unique-query ratio, alerting only when BOTH exceed their 99th percentiles. Add the per-host
    NXDOMAIN ratio as a distinct failure-mode signal. High query count alone could be a busy host; high
    lexical entropy / unique-query diversity indicates enumeration of varied hostnames; together they
    strongly suggest scripted CT harvesting. Under Reconnaissance, this discriminates broad automated
    certificate enumeration from incidental lookups. A positive result is both metrics above the 99th
    percentile (with an elevated NXDOMAIN ratio reinforcing the finding); a negative result is either
    metric within normal range. References: [Real-Time Detection of DNS Exfiltration, Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf),
    [change-point detection survey](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Domain Controllers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per host, hour toward ct_log_domains:\n    cnt = count(queries)\n    ent = lexical_entropy(sld)\
      \ ; uniq_ratio = dcount(query)/cnt\n    nx_ratio = count(NXDOMAIN)/cnt\n  alert if cnt > p99 AND\
      \ (ent > p99 OR uniq_ratio > p99); annotate nx_ratio"
- question: Does a one-class model trained only on a host's benign CT query patterns flag current behavior
    as a deviation, and which features drove it?
  context: 'Train a one-class SVM (or Isolation Forest) on each host''s benign CT query patterns - volume,
    unique domains, NXDOMAIN ratio, and time-of-day - so the model learns normality from clean data only
    and flags any departure. This is valuable where labeled malicious examples are scarce. Use LIME to
    surface the top-3 contributing features in the alert so the analyst can see, for instance, that a
    host deviated because of unusual query volume at an off-hours time. For the Reconnaissance tactic,
    this catches hosts whose CT-query behavior shifts away from their established personal baseline, a
    hallmark of new tooling or compromise. A positive result is a one-class deviation with interpretable
    features; a negative result is behavior consistent with the host''s learned normal profile. References:
    [Robust IoT IF/OCSVM with LIME](https://www.nature.com/articles/s41598-025-20445-4), [Isolation Forest](https://doi.org/10.1109/ICDM.2008.17).'
  answer_sources:
  - Zeek dns.log
  - Windows Event ID 5156
  - Windows Event ID 4688
  - 'NAI: Internal DNS Resolvers, Domain Controllers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X_benign = per_host[ct_volume, unique_domains, nx_ratio, hour]\n  model = OneClassSVM|IsolationForest\
      \ fit X_benign\n  alert if model.predict(current) == outlier\n  attach top3 features via LIME"
- question: Did any threat-intel-listed scanning IP initiate SSL/TLS handshakes against the organization's
    DMZ or public cloud servers, and what SNI/certificate fields were requested?
  context: 'This symbolic-logic check faces outward: adversaries harvest the organization''s served certificates
    by connecting to public-facing endpoints. Alert (or block) when TI-listed scanning IPs initiate SSL/TLS
    handshakes (Zeek ssl.log) with DMZ or public cloud servers. Derive the scanner watchlist from observed
    internet-wide scan sources (e.g., ZMap-based scanners) and surface the requested SNI and certificate
    subject/SAN fields per certificate threat-hunting practice so the analyst can see what infrastructure
    was probed. For Reconnaissance, a known scanner touching the org''s TLS endpoints is direct evidence
    of certificate-data harvesting against the organization. A positive result is a watchlisted scanner
    IP completing or attempting TLS handshakes with the org''s servers; a negative result is no scanner-sourced
    handshakes. References: [An Internet-Wide View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf),
    [ZMap](https://www.usenix.org/system/files/conference/usenixsecurity13/sec13-paper_durumeric.pdf),
    [Threat Hunting with TLS/SSL Certificates](https://www.splunk.com/en_us/blog/security/threat-hunting-with-tls-ssl-certificates.html).'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Network DMZ, Public-facing Web Servers, Edge Routers, Load Balancers, Cloud-hosted Application
    Frontends'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  ssl.log | where id.orig_h in scanner_ip_watchlist\n            and id.resp_h in dmz_or_cloud_servers\n\
      \  => emit orig_h, resp_h, server_name(SNI), cert_subject, cert_san, ja3s"
- question: Does any external source IP exceed the 99.5th percentile for unique destination hosts or unique
    SNI names in a five-minute window, and is it accompanied by a surge of failed/reset handshakes?
  context: 'This statistical method detects the high-fanout signature of internet-wide scanning against
    the organization. Per external source IP every five minutes, count unique destination hosts and unique
    SNI names (volume/frequency) and track handshake success versus reset/incomplete counts (state). Alert
    when unique hosts or SNIs exceed the 99.5th percentile, escalating to high severity when both do.
    A surge of failed/reset handshakes is a distinct enumeration signal indicating the source is probing
    rather than transacting. Tied to Reconnaissance, a single external IP requesting certificates across
    a wide, diverse range of SNI names in a compressed timeframe is the classic certificate-harvesting
    fanout pattern. A positive result is fanout above the 99.5th percentile, especially with elevated
    handshake failures; a negative result is normal per-IP host/SNI diversity. References: [An Internet-Wide
    View of Internet-Wide Scanning](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf),
    [Detecting Password Spraying Attacks](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html).'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Network DMZ, Public-facing Web Servers, Edge Routers, Load Balancers, Cloud-hosted Application
    Frontends'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per src_ip, 5m window:\n    uhost = dcount(resp_h) ; usni = dcount(server_name)\n  \
      \  fails = count(handshake reset|incomplete)\n  alert if uhost > p99.5 OR usni > p99.5 (HIGH if\
      \ both); flag fails surge"
- question: When clustering external connection events by source IP, destination port, unique SNI count,
    and inter-connection timing, are any points labeled noise or placed in small clusters consistent with
    scanners?
  context: 'This machine-learning method uses DBSCAN to cluster external connection events on source IP,
    destination port, unique SNI count, and inter-connection timing. Dense clusters represent normal client
    populations, while points labeled noise or sitting in tiny clusters stand out as scanners with atypical
    fanout/timing. Report which feature (e.g., unique-SNI count) drove the noise label for explainability,
    and corroborate with Isolation Forest scoring to increase confidence. For the Reconnaissance tactic,
    this captures certificate-harvesting scanners whose behavior is structurally distinct from legitimate
    clients even if no single threshold is tripped. A positive result is a DBSCAN noise/small-cluster
    point corroborated by an Isolation Forest outlier score; a negative result is membership in a dense,
    normal client cluster. References: [DBSCAN](https://cdn.aaai.org/KDD/1996/KDD96-037.pdf), [Isolation
    Forest](https://doi.org/10.1109/ICDM.2008.17).'
  answer_sources:
  - Zeek ssl.log
  - Zeek conn.log
  - 'NAI: Network DMZ, Public-facing Web Servers, Edge Routers, Load Balancers, Cloud-hosted Application
    Frontends'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  X = per_conn[src_ip, dst_port, unique_sni_count, inter_conn_delta]\n  labels = DBSCAN(eps,\
      \ min_samples).fit(X)\n  flag = points where label == noise or small_cluster\n  corroborate with\
      \ IsolationForest score; report driving feature"
