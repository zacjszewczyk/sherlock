    must surface the top-3 contributing accounts/hosts and the RC4 fraction for explainable triage. This
    advances Defense Impairment (TA0112), Persistence (TA0003), and Credential Access (TA0006) detection
    of authentication downgrades caused by DC tampering. Sources: [Microsoft Sentinel UEBA peer-group
    anomaly detection](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - 'NAI: Domain Controllers'' Kerberos authentication logs'
  range: Last 180 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'ts=per_DC(etype_distribution) ; model=anomaly_detector(ts)

