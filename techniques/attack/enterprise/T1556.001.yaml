- question: After a network logon (Type 3), did a user account access predefined crown-jewel assets it
    is not authorized for, as seen in post-logon connections (Zeek conn.log correlated with Kerberos 4769
    service tickets)?
  context: 'A master credential enables broad lateral movement. Tracking post-logon connections (Zeek
    conn.log correlated with 4769 ticket requests) and alerting when an account touches crown-jewel assets
    outside its authorization catches abuse of the backdoor for access. This supports Credential Access
    (TA0006) and the downstream lateral-movement goal. A positive result shows the adversary pivoting
    to sensitive systems. Sources: [Detecting Lateral Movement through Tracking Event Logs, JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
