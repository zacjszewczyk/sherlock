    (TA0112) by detecting tampering even if the auditing rule was evaded. A hash mismatch on cryptdll.dll/msv1_0.dll
    is a near-certain compromise indicator. Sources: [Finding Anomalies in Windows Event Logs Using Standard
    Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
