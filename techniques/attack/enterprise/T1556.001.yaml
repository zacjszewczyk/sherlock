  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=4624 | sort by user,_time

      | eval dist=greatcircle(prev_geo,geo), dt=_time-prev_time, v=dist/dt

      WHERE v>600mph -> alert impossible_travel'
- question: Does clustering of a user's typical geographic logon locations (office/home/carrier) flag
    logons outside established clusters and track velocity for improbable jumps, with the top-3 features
