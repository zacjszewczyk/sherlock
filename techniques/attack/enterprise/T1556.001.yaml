      WHERE dst IN crown_jewel_assets AND account NOT IN authorized(dst)

      -> alert("Unauthorized access to crown-jewel asset")'
- question: Did an account connect to a number of distinct destination hosts within one hour that exceeds
    the 99th percentile of its own 30-day rolling baseline (fan-out)?
  context: 'Lateral fan-out is a hallmark of credential abuse. Building a 30-day rolling baseline of distinct
    destination hosts per account per hour and alerting above the 99th percentile detects an account suddenly
    reaching many hosts. This UBA method supports Credential Access (TA0006) and lateral-movement detection.
    A sharp fan-out spike from a normally low-touch account is a strong lead. Sources: [Microsoft Sentinel
    UEBA peer-group anomaly detection](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
