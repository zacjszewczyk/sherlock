- question: Was a failed logon (4625, Status 0xc000006d 'bad password') followed within 5 seconds by a
    successful logon (4624) for the same user account from the same source IP address?
  context: 'When the real password fails (0xc000006d) and the injected Skeleton-Key password immediately
    succeeds, you get a rapid fail-then-succeed pair for the same user/IP. This behavioural signature
    of master-credential use is detectable by correlating 4625 -> 4624 within a 5-second window per user/IP.
    It supports Credential Access (TA0006) and Persistence (TA0003). Tune against benign typo-correction
    with the timing/context methods below. Sources: [Skeleton Key Malware Analysis, Secureworks CTU](https://www.secureworks.com/research/skeleton-key-malware-analysis).'
