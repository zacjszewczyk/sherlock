- question: Does a sequence model over the per-session event chain (VPN connect -> Windows logon -> MFA
    success) flag a missing or late MFA step, with the top-3 deviating steps reported?
  context: 'Normal remote access produces an ordered chain culminating in MFA success. A sequence model
