    each 4624 (Type 3/10) with the MFA provider''s logs for a success on the same user/IP within +/- 2
    minutes; absence is suspicious. This supports Defense Impairment (TA0112) and Credential Access (TA0006)
    by detecting authentication that sidesteps enforced MFA. Tune for break-glass and cached-credential
    exceptions. Sources: [Skeleton Key Malware Analysis, Secureworks CTU](https://www.secureworks.com/research/skeleton-key-malware-analysis).'
