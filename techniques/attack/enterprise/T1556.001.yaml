- question: On a domain controller, are Kerberos AS-REQ/TGS-REQ tickets (4768/4769) being issued with
    Ticket Encryption Type 0x17 (RC4_HMAC) for accounts or a realm whose established baseline is AES (0x11/0x12),
    excluding allow-listed legacy accounts/services?
  context: 'The injected Skeleton-Key authentication logic does not support AES, so after tampering the
    DC forces a downgrade to RC4 (etype 0x17) for accounts/realm that previously negotiated AES. This
    is a deterministic post-deployment network signature. Alerting on 4768/4769 RC4 tickets where AES
    was the norm, with an allow-list for genuinely legacy RC4 accounts/services, is high fidelity for
    Defense Impairment (TA0112), Persistence (TA0003), and Credential Access (TA0006). A realm-wide shift
    to RC4 is a strong indicator of authentication tampering. Sources: [Skeleton Key Malware Analysis,
    Secureworks CTU](https://www.secureworks.com/research/skeleton-key-malware-analysis); [T1556.001,
    MITRE ATT&CK](https://attack.mitre.org/techniques/T1556/001/).'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - 'NAI: Domain Controllers'' Kerberos authentication logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (4768,4769) host IN domain_controllers TicketEncryptionType=0x17

      WHERE TargetUserName NOT IN legacy_rc4_allowlist AND baseline_etype(TargetUserName) IN (0x11,0x12)

      -> alert("Kerberos RC4 downgrade on DC")'
- question: Per domain controller, did the hourly RC4(0x17)-to-AES(0x12) ticket ratio step up from a near-zero
    baseline, and how many distinct accounts suddenly began issuing RC4 tickets?
  context: 'Computing the per-DC ratio of RC4 to AES tickets per hour and the count of distinct accounts
    newly issuing RC4 tickets converts the downgrade signature into a measurable change-point. A step
    increase from a near-zero baseline indicates tampering, and the RC4 failure/fallback rate is a distinct
    corroborating signal. This statistical method supports Defense Impairment (TA0112) and Credential
    Access (TA0006) by both alerting and scoping the affected accounts. Sources: [A Survey of Methods
    for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4768
  - Windows Event ID 4769
  - 'NAI: Domain Controllers'' Kerberos authentication logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4768,4769) host IN domain_controllers

      | timechart span=1h by host eval rc4_ratio=count(etype=0x17)/count(etype=0x12), distinct_rc4_accounts=dc(TargetUserName
      WHERE etype=0x17)

      | change_point_detect(rc4_ratio) WHERE step_up_from_zero -> alert scope=distinct_rc4_accounts'
- question: Does a model of the per-DC Kerberos encryption-type distribution flag an anomalous surge in
