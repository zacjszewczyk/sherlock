      | join user,src_ip [mfa_provider success WHERE _time BETWEEN win._time +/- 120s]

      WHERE mfa_success IS NULL -> alert("Primary logon without MFA")'
- question: Per user, did the rolling 24-hour ratio of successful remote Windows logons to successful
    MFA logons drop sharply from its expected ~1.0?
  context: 'When MFA is functioning, each remote Windows logon pairs with an MFA success, giving a per-user
    ratio near 1.0. A sudden drop (many Windows logons, few MFA) is a failure-mode signal of MFA bypass.
    Computing this ratio over a rolling 24h window and applying change-point detection flags the shift.
    This statistical method supports Defense Impairment (TA0112) and Credential Access (TA0006). Sources:
    [A Survey of Methods for Time Series Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
