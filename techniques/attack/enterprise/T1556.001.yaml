name: 'T1556.001: Modify Authentication Process: Domain Controller Authentication'
id: 1ff79b8b-febb-46a3-bd4a-98a72a4579e0
description: 'This playbook helps an analyst determine whether an adversary has patched the authentication
  process on a domain controller to create a master-credential backdoor (e.g., Skeleton Key) that lets
  a single injected password authenticate as any domain account. It spans three adversary goals served
  by the same tradecraft: maintaining persistence on the DC (TA0003), impairing defenses and the trustworthiness
  of authentication (TA0112), and gaining credential access to any account (TA0006). It guides investigation
  of the tell-tale artifacts and behaviours: modification of the LSA ''Security Packages'' registry value,
  Mimikatz skeleton-key command lines and tooling on a DC, unauthorized access to and writes into lsass.exe
  memory, modification of authentication DLLs (cryptdll.dll, msv1_0.dll, samsrv.dll) in System32, and
  the downstream authentication anomalies a patched DC produces: successful logons by disabled or honey-token
  accounts, fail-then-immediate-success logon pairs, missing MFA correlations, Kerberos encryption downgrades
  to RC4, first-time interactive DC logons, lateral fan-out, and impossible-travel logons. Each question
  pairs symbolic-logic, statistical, and machine-learning detection methods so an analyst can confirm,
  scope, and triage suspected domain-controller authentication tampering.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: On any domain controller, was the LSA 'Security Packages' multi-string registry value (HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Security
    Packages or the OSConfig variant) modified to add a DLL/package name that is not in the environment's
    curated known-good Security Support Provider allow-list?
  context: 'Skeleton-Key-style authentication tampering and Mimikatz ''misc::memssp'' register a malicious
    Security Support Provider by writing a new DLL name into the LSA ''Security Packages'' value, which
    LSASS then loads into the authentication pipeline. This sits at the heart of Persistence (TA0003)
    and Defense Impairment (TA0112): the rogue SSP survives and silently subverts authentication. Compare
    every SET on this value against an allow-list of legitimate packages (kerberos, msv1_0, schannel,
    wdigest, tspkg, pku2u, cloudAP); any addition outside the list, especially an unsigned DLL or a non-Microsoft
    DLL such as mimilib.dll, is high fidelity. A positive result is a near-certain compromise; a negative
    result helps rule out the SSP persistence variant but does not exclude in-memory-only patching. Sources:
    [Security Support Provider Added to LSA Configuration, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/registry/registry_event/registry_event_ssp_added_lsa_config/);
    [T1556.001, MITRE ATT&CK](https://attack.mitre.org/techniques/T1556/001/).'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers'' registry'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (WinEventLog:Security EventCode=4657, WinEventLog:Sysmon EventCode=13)

      AND registry_path MATCHES "*\\Lsa\\Security Packages" AND operation="SetValue"

      AND host IN domain_controllers

      | eval added=diff(new_value, old_value)

      WHERE NOT added IN (kerberos,msv1_0,schannel,wdigest,tspkg,pku2u,cloudAP)

      -> alert("Unauthorized SSP added to LSA Security Packages")'
- question: Across the DC fleet, is a DLL listed in 'Security Packages' present on only a single domain
    controller (a prevalence outlier), or did the count of 'Security Packages' SetValue events on any
    DC step above its near-zero baseline outside an approved patch window?
  context: 'Legitimate SSP configuration is uniform across domain controllers and changes only during
    controlled patch/change windows, so its baseline event count is typically zero. Statistically profiling
    fleet-wide DLL prevalence surfaces a package that exists on just one DC, and change-point detection
    (CUSUM/BOCPD/PELT) plus standard-deviation baselining flag any step above the normal-zero rate. This
    supports Persistence (TA0003) and Defense Impairment (TA0112) hunting by catching rare, off-cycle
    tampering even when the DLL name itself is not yet known-bad. Any modification not tied to an approved
    change request is anomalous. Sources: [A Survey of Methods for Time Series Change Point Detection,
    Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/); [Finding Anomalies in
    Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers'' registry'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4657, Sysmon:13) registry_path="*\\Lsa\\Security Packages" host IN domain_controllers

      | stats dc(host) as dc_count by dll_name

      | where dc_count==1  -> prevalence_outlier

      ;; AND timechart span=1d count by host | CUSUM(count) baseline=0 -> alert step_above_baseline outside
      patch_window'
- question: Does a time-series forecast of 'Security Packages' modification events flag an out-of-forecast
    change, and does a PE classifier score the newly added DLL as suspicious (high entropy, anomalous
    import-hash, unsigned), with the top-3 contributing features surfaced for triage?
  context: 'A forecasting model learns the normal patch cadence of ''Security Packages'' changes; a modification
    outside the predicted window is anomalous on its own. Combining that with a classifier over the new
    DLL''s PE properties (entropy, imphash, signature status) prioritizes likely-malicious SSPs and reduces
    false positives from legitimate patches. Surfacing the top-3 features (e.g., ''unsigned'', ''single-DC
    prevalence'', ''out-of-window'') keeps the alert explainable for analyst triage. This advances Persistence
    (TA0003) and Defense Impairment (TA0112) detection against novel/renamed rogue SSPs. Sources: [Security
    Support Provider Added to LSA Configuration, SigmaHQ](https://detection.fyi/sigmahq/sigma/windows/registry/registry_event/registry_event_ssp_added_lsa_config/).'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers'' registry'
  range: Last 180 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'model=forecast(ts_of(SecurityPackages_set_events)) ; residual=actual-predicted

      clf=pe_classifier(features=[entropy,imphash,signed,single_dc_prevalence,out_of_window])

      WHERE residual>threshold OR clf.score>0.8 -> alert with top3_features(clf)'
- question: Was a process created on a domain controller whose command line contains Mimikatz skeleton-key
    or credential-tampering keywords such as 'misc::skeleton', 'privilege::debug', 'sekurlsa::', or 'misc::memssp',
    and is it part of a remote delivery chain (PsExec/remote service install spawning rundll32 or an installer
    DLL)?
  context: 'Deploying Skeleton Key requires running Mimikatz directly on the DC; its command syntax is
    distinctive. Searching DC process-creation logs (4688/Sysmon 1) for these substrings is high fidelity,
    and correlating the delivery chain (a remote service or PsExec spawning rundll32 or an installer DLL)
    captures how the tool is pushed to the DC. This is central to Credential Access (TA0006) and Persistence
    (TA0003). A match strongly indicates active tampering in progress; absence does not rule out renamed
    or obfuscated tooling (see the ML method). Sources: [Detecting Lateral Movement through Tracking Event
    Logs, JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf); [T1556.001,
    MITRE ATT&CK](https://attack.mitre.org/techniques/T1556/001/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers'' process execution logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (4688, Sysmon:1) host IN domain_controllers

      WHERE CommandLine MATCHES_ANY ("misc::skeleton","privilege::debug","sekurlsa::","misc::memssp")

      OR (ParentImage IN (psexesvc.exe,services.exe) AND Image IN (rundll32.exe))

      -> alert("Skeleton Key / Mimikatz command on DC")'
- question: On domain controllers, do any command lines exhibit anomalously high Shannon entropy or special-character
    ratio above the 95th percentile for their parent process, or rare parent-child process tuples (e.g.,
    services.exe -> rundll32.exe with a non-system DLL path)?
  context: 'Adversaries obfuscate or encode command lines to evade keyword rules. Baselining entropy and
    special-character ratio per parent process flags encoded payloads, and standard-deviation baselining
    of parent-child tuples surfaces unusual execution chains used to launch credential-tampering tooling.
    This statistical layer backstops the keyword rule for Credential Access (TA0006) and Persistence (TA0003)
    when exact strings are hidden. High entropy on a DC command line that normally runs clean, scripted
    admin commands is a strong lead. Sources: [Finding Anomalies in Windows Event Logs Using Standard
    Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers'' process execution logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4688, Sysmon:1) host IN domain_controllers

      | eval H=shannon(CommandLine), sc=special_char_ratio(CommandLine)

      | percentile by ParentImage | where H>p95 OR sc>p95

      ;; stats count by ParentImage,Image | stddev_baseline -> flag rare tuples (services.exe->rundll32.exe
      non-system DLL)'
- question: Does a command-line classifier (trained on length, special-character count, keyword presence,
    n-gram frequency, and entropy) label any domain-controller command as malicious/obfuscated, catching
    renamed tooling, with the top-3 driving features shown?
  context: 'A supervised classifier generalizes beyond literal keywords to recognize malicious or obfuscated
    command lines and renamed Mimikatz variants that evade blocklists. Training on lexical and statistical
    features separates benign DC administration from credential-tampering commands. Surfacing the top-3
    contributing features makes the alert explainable. This strengthens Credential Access (TA0006) detection
    against evasive tooling on domain controllers. Sources: [Detecting Malicious Windows Command Lines
    using Machine Learning](https://www.semanticscholar.org/search?q=Detecting%20Malicious%20Windows%20Command%20Lines%20using%20Machine%20Learning).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers'' process execution logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'clf=cmdline_classifier(features=[len,special_count,keyword_flags,ngram_freq,entropy])

      apply clf TO (4688/Sysmon:1 WHERE host IN domain_controllers)

      WHERE clf.label="malicious" -> alert with top3_features(clf)'
- question: Was a successful logon (Logon Type 2, 3, 9, or 10) recorded on a domain controller for a user
    account whose Active Directory userAccountControl is flagged ACCOUNTDISABLE?
  context: 'A disabled account must always fail authentication. A Skeleton-Key master password lets a
    single injected credential authenticate as ANY account, including disabled ones, so a successful logon
    for a disabled TargetUserName is a high-fidelity signal of master-credential bypass. Maintain a SIEM
    watchlist of disabled accounts from AD and join it to successful 4624 events. This directly tests
    Credential Access (TA0006) and confirms the backdoor is in active use (Persistence, TA0003). Any hit
    warrants immediate investigation and likely DC reboot/IR. Sources: [Skeleton Key Malware Analysis,
    Secureworks CTU](https://www.secureworks.com/research/skeleton-key-malware-analysis).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'lookup disabled_accounts (uac & 0x2) FROM AD

      source=4624 host IN domain_controllers LogonType IN (2,3,9,10)

      WHERE TargetUserName IN disabled_accounts -> alert("Disabled account successful logon")'
- question: Is the count of successful disabled-account logons non-zero over any interval, and how many
    distinct disabled accounts and what per-hour rate are involved?
  context: 'The baseline for successful disabled-account logons is exactly zero, so any non-zero count
    is an infinite deviation and a change-point from the invariant. Reporting the per-hour rate and the
    count of distinct disabled accounts quantifies the scope of backdoor use. This statistical framing
    supports Credential Access (TA0006) and Persistence (TA0003) by both alerting and scoping. A growing
    distinct-account count indicates broadening exploitation. Sources: [A Survey of Methods for Time Series
    Change Point Detection, Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=4624 host IN domain_controllers WHERE TargetUserName IN disabled_accounts

      | timechart span=1h count as logons, dc(TargetUserName) as distinct_disabled

      | where logons>0 -> alert change_point_from_zero(scope=distinct_disabled, rate=logons)'
- question: Does a UEBA/time-series model show a spike from zero in the volume of distinct disabled accounts
    authenticating, with growing account variety, and are the top-3 features (account, source host, logon
    type) surfaced?
  context: 'Modeling the volume of distinct disabled accounts that authenticate over time detects active
    backdoor use: a spike from a zero baseline combined with increasing account variety signals an adversary
    leveraging the master credential broadly. Surfacing the top-3 features (account, source host, logon
    type) makes the alert actionable. This advances Credential Access (TA0006) detection and helps scope
    persistence (TA0003). Sources: [Microsoft Sentinel UEBA peer-group anomaly detection](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'ts=volume(distinct disabled_account logons on DCs)

      ueba_anomaly(ts) WHERE spike_from_zero AND rising_variety -> alert with top3_features(account,source_host,logon_type)'
- question: Was an interactive (Type 2/10) or remote-interactive (Type 7) logon to a domain controller
    performed by an account that is NOT in the AD group/lookup of accounts authorized for interactive
    DC logon?
  context: 'Interactive logon to a DC should be restricted to a small set of authorized admins. Filtering
    4624 on DCs for Logon Types 2, 7, and 10 and alerting on any account outside the authorized set catches
    both unauthorized administration and the hands-on-keyboard activity used to deploy or operate a Skeleton-Key
    backdoor. This supports Persistence (TA0003) and Defense Impairment (TA0112). A positive result identifies
    who/what accessed the DC console or RDP outside policy. Sources: [Detecting Lateral Movement through
    Tracking Event Logs, JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'' authentication logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=4624 host IN domain_controllers LogonType IN (2,7,10)

      WHERE TargetUserName NOT IN authorized_dc_interactive_logon

      -> alert("Unauthorized interactive DC logon")'
- question: For each account, does a 90-day rolling profile show a first-seen interactive logon to a domain
    controller (historical frequency of zero for that logon type)?
  context: 'Building a per-account 90-day profile of logon types to DCs lets you flag a first-ever interactive
    DC logon as a state change. A first-seen interactive logon (frequency 0 -> 1) is risk-scored with
    standard-deviation baselining and is suspicious even for accounts that are nominally allowed but never
    actually use console/RDP access. This statistical layer supports Persistence (TA0003) and Defense
    Impairment (TA0112) hunting for novel DC access patterns. Sources: [Finding Anomalies in Windows Event
    Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'' authentication logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=4624 host IN domain_controllers LogonType IN (2,7,10)

      | stats earliest(_time) as first_seen, count by TargetUserName,LogonType over 90d

      | where first_seen within alert_window AND prior_count==0 -> flag first_time_interactive_logon'
- question: Does behavioural clustering of accounts (by logon types, frequency, time-of-day, source host)
    show an account, especially a service account, shifting from a non-interactive cluster to an interactive
    cluster, with the top-3 features explaining the shift?
  context: 'Clustering accounts by logon behaviour establishes peer baselines; a service account that
    has only ever logged on non-interactively suddenly appearing in an interactive cluster is a state-change
    anomaly that often accompanies hands-on DC tampering. Reporting the top-3 features driving the cluster
    shift makes the result explainable. This strengthens Persistence (TA0003) and Defense Impairment (TA0112)
    detection of abnormal DC access. Sources: [Microsoft Sentinel UEBA peer-group anomaly detection](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4624
  - 'NAI: Domain Controllers'' authentication logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features=per_account(logon_types,freq,tod,source_host)

      cluster(features) ; detect membership_shift(noninteractive->interactive)

      -> alert with top3_features'
- question: Was a process created on a domain controller whose Image name or PE OriginalFileName matches
    a known malicious credential-dumping or authentication-patching tool (e.g., mimikatz.exe), or whose
    hash matches a known-bad list?
  context: 'Comparing the Image and OriginalFileName fields (Sysmon 1) and file hashes on DCs against
    a catalogue of known malicious tools catches tooling even when the file has been renamed but the PE
    metadata persists. This is a direct Credential Access (TA0006) and Persistence (TA0003) indicator.
    A match on a DC is high severity; OriginalFileName is more robust than the on-disk name because attackers
    rename binaries. Sources: [Detecting Lateral Movement through Tracking Event Logs, JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers'' process execution logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (4688, Sysmon:1) host IN domain_controllers

      WHERE OriginalFileName IN known_bad_tool_names OR Hashes IN known_bad_hashes

      OR basename(Image) IN known_bad_tool_names -> alert("Known malicious tool on DC")'
- question: On domain controllers, are any process names in the lowest 1st percentile of frequency (e.g.,
    seen only once in 30 days), particularly unsigned ones?
  context: 'Baselining all process names on DCs by frequency exposes rare executables; a name seen once
    in 30 days, especially when unsigned, is a strong lead for newly introduced tooling that evades known-bad
    lists. Standard-deviation/rarity baselining supports Credential Access (TA0006) and Persistence (TA0003).
    DCs run a tightly bounded, predictable software set, so rarity is highly meaningful here. Sources:
    [Finding Anomalies in Windows Event Logs Using Standard Deviation, Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers'' process execution logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source IN (4688, Sysmon:1) host IN domain_controllers

      | stats count by Image,Signed over 30d

      | where count<=p01 AND Signed=false -> flag rare_unsigned_process_on_dc'
- question: Does a lexical classifier (character-level n-grams and lexical features) flag any DC process
    name as a likely malicious-tool variant (e.g., m1m1katz.exe, mimikatz_alt.exe), with the top-3 lexical
    features shown?
  context: 'Attackers defeat exact-match blocklists with typosquatted or modified tool names. A character-level
    n-gram/lexical classifier scores names for similarity to known malicious tooling, catching variants
    that string rules miss. Surfacing the top-3 lexical features keeps it explainable. This improves Credential
    Access (TA0006) detection on domain controllers against renamed tools. Sources: [Detecting Malicious
    Windows Command Lines using Machine Learning](https://www.semanticscholar.org/search?q=Detecting%20Malicious%20Windows%20Command%20Lines%20using%20Machine%20Learning).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers'' process execution logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'clf=lexical_name_classifier(features=[char_ngrams,len,vowel_ratio,digit_subst])

      apply TO process_names on domain_controllers

      WHERE clf.score>0.8 -> alert with top3_lexical_features'
- question: On a domain controller, did a process other than an allow-listed legitimate caller (wininit.exe,
    services.exe, approved EDR) request access to lsass.exe memory, especially with GrantedAccess including
    write/operation masks (e.g., 0x1010, 0x1410, 0x143A => PROCESS_VM_WRITE/PROCESS_VM_OPERATION)?
  context: 'Skeleton Key must open and WRITE lsass.exe memory to patch the authentication routines, so
    a non-allow-listed process opening LSASS with write/operation access on a DC is a core indicator.
    Sysmon Event 10 with TargetImage lsass.exe, filtered to disallowed SourceImages and write-capable
    GrantedAccess masks, is high fidelity for Credential Access (TA0006) and Persistence (TA0003). Read-only
    access can indicate dumping; write/operation access indicates in-memory patching. Sources: [Suspicious
    LSASS Process Access, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml);
    [Skeleton Key Malware Analysis, Secureworks CTU](https://www.secureworks.com/research/skeleton-key-malware-analysis).'
  answer_sources:
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers'' process memory access logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source=Sysmon:10 host IN domain_controllers TargetImage="*\\lsass.exe"

      WHERE SourceImage NOT IN (wininit.exe,services.exe,approved_edr)

      AND GrantedAccess IN (0x1010,0x1410,0x143A,0x0F01FF) -> alert("Suspicious LSASS access on DC")'
- question: Modeling each LSASS-access session by volume (total bytes read) and frequency (number of open/read
    attempts), are there first-time source processes or access-mask outliers that read/write large or
    structured memory regions?
  context: 'Benign LSASS callers touch few bytes; credential theft or injection reads or writes large/structured
    regions. Profiling per-session volume and frequency, plus flagging first-time source processes and
    access-mask outliers, captures the behavioural signature of dumping/patching on a DC. This statistical
    method backstops the allow-list rule for Credential Access (TA0006). A first-time process opening
    LSASS with high byte volume is a strong lead. Sources: [Effective Detection of Credential Thefts from
    Windows Memory, Ah-Fat et al.](https://www.usenix.org/system/files/raid20-ah-fat.pdf).'
  answer_sources:
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers'' process memory access logs'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=Sysmon:10 TargetImage="*\\lsass.exe" host IN domain_controllers

      | stats sum(bytes) as vol, count as freq, earliest(_time) as first_seen by SourceImage,GrantedAccess

      | where first_seen within window OR vol>p99 OR GrantedAccess outlier -> flag'
- question: Does a sequence model (LSTM/autoencoder) over the events preceding LSASS access (process creation
    from an unusual path -> suspicious DLL load -> handle open) flag a deviation from learned benign sequences,
    with the top-3 anomalous steps listed?
  context: 'Credential-tampering tradecraft produces a characteristic event chain before touching LSASS.
    A sequence model trained on benign chains flags deviations such as an unusual-path process creation
    followed by a suspicious DLL load and an LSASS handle open. Listing the top-3 anomalous steps aids
    triage. This advances Credential Access (TA0006) and Persistence (TA0003) detection of multi-step
    LSASS attacks on DCs. Sources: [DeepLog: Anomaly Detection and Diagnosis from System Logs, Du et al.](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers'' process memory access logs'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq=ordered_events(proc_create,module_load,lsass_handle_open) per host_session on DCs

      model=deeplog/autoencoder(seq) ; WHERE reconstruction_error>thr -> alert top3_anomalous_steps'
- question: Was a critical authentication DLL (cryptdll.dll, msv1_0.dll, samsrv.dll) in C:\Windows\System32
    on a domain controller written or deleted by any process other than TrustedInstaller.exe?
  context: 'cryptdll.dll and msv1_0.dll are the exact routines Skeleton Key patches; legitimate modification
    of these files happens only via Windows servicing (TrustedInstaller). Enabling object-access auditing
    on System32 and alerting on Write/Delete to this curated DLL list by any non-TrustedInstaller process
    is high fidelity for Persistence (TA0003), Defense Impairment (TA0112), and Credential Access (TA0006).
    A positive result is strong evidence of on-disk authentication tampering. Sources: [Skeleton Key Malware
    Analysis, Secureworks CTU](https://www.secureworks.com/research/skeleton-key-malware-analysis).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - 'NAI: Domain Controllers'' C:\Windows\System32 directory'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (Sysmon:11, 4663) host IN domain_controllers

      TargetFilename IN ("*\\System32\\cryptdll.dll","*\\System32\\msv1_0.dll","*\\System32\\samsrv.dll")

      AND AccessMask IN (WRITE,DELETE) AND ProcessName!="*\\TrustedInstaller.exe"

      -> alert("Auth DLL modified by non-TrustedInstaller on DC")'
- question: Do the SHA256 hashes of authentication DLLs on any DC mismatch the maintained post-patch baseline,
    or did the frequency of System32 modifications spike outside a patch window?
  context: 'Maintaining baseline SHA256 hashes per authentication DLL across all DCs makes any hash mismatch
    high fidelity, and tracking System32 modification frequency with standard-deviation baselining flags
