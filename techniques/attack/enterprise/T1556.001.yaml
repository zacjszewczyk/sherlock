- question: Across two successful logons for the same user from different source IPs, does the great-circle
    distance and time delta imply an impossible travel velocity above ~600 mph (965 kph)?
  context: 'Impossible-travel analysis enriches each logon with geolocation, computes the great-circle
    distance and time gap from the prior logon, derives the implied velocity, and alerts when it exceeds
    a feasible threshold (~600 mph). Two near-simultaneous logons from distant locations indicate credential
    sharing/theft consistent with a master credential. This statistical method supports Credential Access
    (TA0006). Tune for VPN egress and cloud-proxy artifacts. Sources: [Impossible Travel Detection Patent
    WO2018085161A1, Microsoft](https://patents.google.com/patent/WO2018085161A1/en).'
  answer_sources:
