    query: 'source=4624 LogonType=3 (+ Zeek conn.log)

      | stats dc(dest_host) as fanout by account span=1h

      | baseline 30d per account | where fanout>p99 -> alert lateral_fanout'
- question: Does an authentication-graph model score new/rare user-to-host edges (node2vec link-prediction)
