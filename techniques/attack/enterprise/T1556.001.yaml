  - 'NAI: Domain Controllers, Active Directory Database'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: source=4624 WHERE TargetUserName IN honey_token_accounts -> alert("Honey-token account authenticated")
- question: Is the count of honey-token logons non-zero, and how many distinct honey-tokens have authenticated
    over time?
  context: 'The baseline for honey-token logons is zero; any success is an infinite deviation and a clear
