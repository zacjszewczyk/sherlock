      -> alert("Fail-then-immediate-success logon")'
- question: Per user/source, is the distribution of 4625->4624 inter-arrival deltas clustered near zero,
    which is anomalous versus normal retry behaviour?
  context: 'Modeling the inter-arrival time between a bad-password failure and the subsequent success
    per user/source reveals that benign typo correction has variable, human-scale gaps, while a master-credential
    bypass clusters near zero seconds. Change-point/standard-deviation baselining flags a near-zero cluster.
    This statistical method backstops the symbolic rule for Credential Access (TA0006). Sources: [Finding
