- question: Was a successful logon (4624) recorded for a designated honey-token account (a disabled, high-privilege
    account with no legitimate use case)?
  context: 'Honey-token accounts are disabled high-privilege decoys that should NEVER authenticate. Because
    a Skeleton-Key master password authenticates any account, these decoys will succeed where they should
    always fail, making any successful 4624 for a honey-token TargetUserName an immediate, high-fidelity
    tripwire. This is a powerful confirmation for Credential Access (TA0006) and Persistence (TA0003).
    A single hit should trigger IR. Sources: [Skeleton Key Malware Analysis, Secureworks CTU](https://www.secureworks.com/research/skeleton-key-malware-analysis).'
