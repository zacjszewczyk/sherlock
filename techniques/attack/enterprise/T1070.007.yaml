questions:
- question: Did any process whose image hash matches a known anti-forensic or history-clearing utility
    (e.g., SDelete, CCleaner, BleachBit, PrivaZer, srm, shred) execute on a host where remote access is
    common?
  context: 'Faithful to the Symbolic Logic action ''Match known history-clearing tool hashes''. Adversaries
    operating under the Stealth tactic run dedicated wiping tools to destroy RDP/connection history and
    impede forensic reconstruction. Monitor process creation (Sysmon Event ID 1, Windows Event ID 4688,
    auditd execve) and compare each process image SHA256 against a curated, threat-intel-fed list of anti-forensic/history-clearing
    tools. A hash match is a high-confidence deterministic signal; pair it with the RDP-artifact deletion
    rules so a tool execution that precedes artifact disappearance is escalated. A positive result means
    a wiping utility ran and its surrounding activity (who, when, what disappeared) should be reconstructed
    immediately. Source citations: [Sigma RDP history-cleared](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_delete/registry_delete_mstsc_history_cleared.yml).'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4657
  - Windows Event ID 4663
  - auditd:SYSCALL execve
  - macos:unifiedlog
  - 'NAI: User workstations, Application servers, and Jump Boxes where remote access is common.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'tool_hashes = load_intel_list([''SDelete'',''CCleaner'',''BleachBit'',''PrivaZer'',''srm'',''shred''])

      FROM process_creation (Sysmon EID 1, WinEID 4688, auditd execve)

      WHERE sha256(Image) IN tool_hashes

      ALERT host, user, Image, sha256, CommandLine

      | join RDP_artifact_deletion ON host WITHIN 15m -> raise severity'
- question: Are there low-prevalence or newly-introduced binaries that executed from user-writable directories
    (%TEMP%, %APPDATA%, /tmp) and were followed within 15 minutes by deletion of connection-history artifacts?
  context: 'Faithful to the Statistical Method action ''Score low-prevalence anti-forensic binaries by
    rarity''. Compute fleet-wide prevalence for every executed binary (distinct hosts/users that ran the
    hash over 30-90 days) and flag binaries seen on under ~0.5% of hosts (tune per environment) that run
    from user-writable staging directories and are followed shortly by connection-artifact deletion. Rarity
    is a validated heuristic because the overwhelming majority of genuine threats are rare within a user
    population. In a Stealth context a rare binary launching cleanup separates one-off admin tooling from
    purpose-built anti-forensics. Track Volume (low-prevalence executions per host/day), Frequency (executions/min),
    and State (exit status). Source citations: [F-Secure Labs](https://blog.f-secure.com/whats-the-deal-with-prevalence/).'
  answer_sources: *id001
  range: Last 90 days (prevalence baseline 30-90 days; correlate cleanup within 15 minutes)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "prevalence = COUNT(distinct host) per sha256 OVER last 30-90d\nFROM process_creation\nWHERE\
      \ prevalence/total_hosts < 0.005\n  AND Image startswith ('%TEMP%','%APPDATA%','/tmp')\n  AND EXISTS\
      \ connection_artifact_delete ON same host WITHIN 15m\nEMIT host, user, Image, prevalence, exit_status"
- question: Do any newly observed process names or command lines exhibit abnormally high Shannon entropy
    (>3 standard deviations above the per-user mean) or large KL-divergence from a natural-language baseline,
    especially when run from non-standard directories?
  context: 'Faithful to the Statistical Method action ''Flag process and command-line strings with abnormal
    entropy''. For new process names and command lines (Sysmon Event ID 1) calculate Shannon entropy and
    maintain per-user baselines (mean/std); flag entropy more than 3 standard deviations above the per-user
    mean or KL-divergence far from the natural-language baseline, and correlate with execution from unusual
    paths. Obfuscated or packed clearing tooling and encoded command lines raise entropy, helping reveal
    stealthy cleanup that evades simple keyword rules. A positive result warrants pivoting to what the
    high-entropy process touched on disk and in the registry. Source citations: [Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[user] = mean,std of Shannon_entropy(proc_name, cmdline)\nFROM process_creation (Sysmon\
      \ EID 1) WHERE first_seen=true\nLET e = Shannon_entropy(CommandLine)\nWHERE e > baseline[user].mean\
      \ + 3*baseline[user].std\n   OR KL_divergence(cmdline, natural_lang) > T\n   AND dir NOT IN standard_paths\n\
      EMIT host, user, proc_name, e"
- question: When the process-anomaly model scores an execution as anomalous, which top contributing features
    (parent process, command-line length/entropy, prevalence, directory, time-since-logon, user role)
    explain it as likely malicious cleanup?
  context: 'Faithful to the Machine Learning action ''Score process events with explainable anomaly modeling''.
    Train an unsupervised Extended Isolation Forest on per-execution features and emit the top-3 contributing
    features in alert text rather than a bare score, so analysts can validate quickly. Where labeled benign/malicious
    cleanup executions exist, also train a Random Forest/Gradient Boosting classifier and run both in
    parallel with the deterministic hash rule. This catches novel anti-forensic tooling that has no known
    hash while keeping outputs explainable and defensible for the Stealth detection mission. Source citations:
    [Extended Isolation Forest](https://arxiv.org/pdf/1811.02141); [code](https://github.com/sahandha/eif).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [parent_proc, cmd_len, cmd_entropy, name_entropy, prevalence, dir, time_since_logon,
      user_role]

      model = ExtendedIsolationForest.fit(features over benign window)

      score = model.score(event)

      IF score > threshold: EMIT event, top3_features(model, event)

      # parallel: RandomForest/GBM classifier if labels exist; run with hash rule'
- question: Were built-in utilities (reg.exe, wevtutil.exe, powershell.exe, rm/shred/truncate/sed, journalctl
    --vacuum, pfctl -F, or device log/config erase) invoked with arguments that delete RDP connection
    history, clear connection logs, remove .rdp files, or wipe connection-configuration artifacts?
  context: 'Faithful to the Symbolic Logic action ''Detect connection-history clearing command patterns''.
    Use regular expressions over command lines (Sysmon Event ID 1, Event ID 4688, auditd execve) and PowerShell
    script blocks (Event ID 4104) for patterns such as ''reg delete .*Terminal Server Client'', ''Remove-Item
    .*\.rdp'', ''wevtutil cl'', ''Clear-EventLog'', and on Linux/macOS ''rm|shred|truncate .*/var/log'',
    ''journalctl --vacuum'', and on devices ''log erase''/''clear logging''. Escalate when run by non-admins
    or under SYSTEM. This living-off-the-land cleanup is a core Stealth behavior; cross-reference the
    expected RDP/connection artifact catalog to confirm which evidence the command would destroy. Source
    citations: [Sigma RDP history-cleared](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_delete/registry_delete_mstsc_history_cleared.yml);
    [Sigma Linux logs clearing](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml);
    [Elastic System Log File Deletion](https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_log_files_deleted.toml);
    [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
