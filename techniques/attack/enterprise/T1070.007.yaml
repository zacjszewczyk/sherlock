- question: Has any host or account exceeded its baseline rate and diversity of deletion-related arguments
    (delete, cl, Remove-Item, shred, truncate) against sensitive registry/log paths by more than 3 standard
    deviations, and how many of those deletions failed (access-denied)?
  context: 'Faithful to the Statistical Method action ''Alert on z-score spikes in deletion commands''.
    Per host/account, baseline the rate and diversity of deletion-related arguments targeting sensitive
    registry and log paths, then flag a count exceeding mean + 3 standard deviations versus the entity''s
    own history or its peer group. Separately profile access-denied/failed deletion attempts as their
    own Failure-Mode series, because blocked cleanup still reveals adversary intent. A spike that departs
    from peer behavior during the Stealth phase indicates batch anti-forensic activity rather than routine
    maintenance. Source citations: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'del_args = count(cmdline ~ /(delete|\bcl\b|Remove-Item|shred|truncate)/ AGAINST sensitive_paths)
      per host,account per window

      baseline = mean,std per entity & peer_group

      WHERE del_args > mean + 3*std: ALERT spike

      SEPARATE series: count(access_denied deletions) AS failure_mode'
- question: Does an interpretable sequence model classify a command line or PowerShell script block as
    'history clearing' rather than 'benign administration', and which weighted tokens drove that decision?
  context: 'Faithful to the Machine Learning action ''Classify command intent with interpretable sequence
    modeling''. Tokenize command lines/script blocks and apply an attention-augmented LSTM to classify
    intent, surfacing the top-3 weighted tokens for analyst review. This adds contextual understanding
    beyond keyword matching, catching obfuscated or reordered clearing commands while remaining explainable.
    In the Stealth context it distinguishes a genuine cleanup of connection history from legitimate admin
    scripting that merely contains similar verbs. Source citations: [Brown et al.](https://arxiv.org/pdf/1803.04967).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'tokens = tokenize(cmdline | script_block)

      intent, weights = AttentionLSTM.predict(tokens)

      WHERE intent == ''history_clearing'' AND confidence > T

      EMIT host, user, cmdline, top3_tokens(weights)'
- question: Were RDP history registry keys (HKCU\...\Terminal Server Client\Default or \Servers) deleted,
    or were Default.rdp and RDP bitmap cache files (*.bin) removed via file-deletion events?
  context: 'Faithful to the Symbolic Logic action ''Alert on RDP artifact deletions''. Trigger on registry
    key/value deletion (Sysmon Event IDs 12/13 with EventType Delete) where TargetObject ends with ''\Terminal
    Server Client\Default'' or ''\Terminal Server Client\Servers'', and on file-deletion events (Sysmon
    Event ID 11) for ''Default.rdp'' or files under the RDP bitmap cache. This is the deterministic core
    of clearing RDP connection history; enrich with the artifact map to understand which past connections
    were erased. A positive result is strong evidence of deliberate Stealth cleanup of remote-access evidence.
    Source citations: [Sigma''s Terminal Server Client history-cleared rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_delete/registry_delete_mstsc_history_cleared.yml);
    [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
  answer_sources: &id003
  - Sysmon Event ID 11
  - Sysmon Event ID 12
  - Sysmon Event ID 13
  - Windows Event ID 4660
  - Windows Event ID 4663
  - auditd:SYSCALL PATH
  - 'NAI: Windows Registry and file system on endpoints/servers accessed via RDP, and *nix log directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM registry (Sysmon EID 12/13, EventType=Delete)\nWHERE TargetObject endswith '\\Terminal\
      \ Server Client\\Default'\n   OR endswith '\\Terminal Server Client\\Servers'\nUNION FROM file_delete\
      \ (Sysmon EID 11)\nWHERE TargetFilename == 'Default.rdp' OR path CONTAINS 'Terminal Server Client\\\
      Cache'\nEMIT host, user, TargetObject"
- question: Within any short window (e.g., 5 minutes), did modification/deletion events for RDP history
    artifacts exceed the host's 98th percentile, or did a change-point detector flag an abrupt drop-to-zero
    in the artifact-presence series?
  context: 'Faithful to the Statistical Method action ''Baseline and change-point RDP artifact counts''.
    With object-access auditing enabled, build a per-host time series of modification/deletion events
    for RDP history artifacts. Alert when a short window exceeds the 98th percentile (mean + 3 std) of
    the host''s distribution, and apply CUSUM/Bayesian online change-point detection to catch a sudden
    level shift (a drop to zero) in the artifact-presence series. Watching both the spike of deletions
    (Volume/Frequency) and the resulting absence of expected artifacts (State) detects Stealth cleanup
    even when individual deletions look ordinary. Source citations: [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf);
    [Aminikhanghahi & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'ts = per_host count(modify|delete RDP_artifacts) bucket=5m  (WinEID 4660/4663, auditd PATH)

      WHERE bucket_count > p98(host_history)  (mean+3*std)

      ALSO CUSUM/BOCPD(artifact_presence_series): IF level_shift -> 0 ALERT

      EMIT host, window, count, change_point'
- question: Does a DeepLog-style LSTM over object-access events for RDP artifacts flag missing expected
    log keys or out-of-order sequences consistent with deletion/truncation?
  context: 'Faithful to the Machine Learning action ''Detect RDP artifact sequence anomalies via LSTM''.
    Model the normal rhythm of object-access events for RDP artifacts with a DeepLog-style LSTM; deletion/truncation
    produces missing expected log keys and out-of-order sequences that are flagged via top-k predicted-vs-observed
    comparison, which doubles as explainable evidence of what should have occurred but did not. This catches
    subtle Stealth tampering with the access-history record that threshold rules might miss. Source citations:
    [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [code](https://github.com/wuyifan18/DeepLog).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "seq = object_access events for RDP_artifacts per host\nmodel = DeepLog_LSTM.fit(normal seq)\n\
      WHERE observed_key NOT IN model.topk_predicted(context)\n   OR out_of_order(seq)\nEMIT host, missing_keys,\
      \ anomaly_score"
- question: Did a successful remote logon (Windows 4624 Logon Type 10, or an SSH/screen-sharing session)
    get followed within 15 minutes on the same host by the same logon identity executing a history-clearing
    command or deleting RDP artifacts?
  context: 'Faithful to the Symbolic Logic action ''Correlate remote logons with clearing activity''.
    Build a SIEM correlation: a successful remote logon (Windows Event ID 4624 Logon Type 10, or an SSH
    session) followed within 15 minutes on the same host/logon ID by a history-clearing command (Sysmon
    Event ID 1 / Event ID 4104) or direct RDP-artifact deletion (Sysmon Event ID 11/12/13). Enrich with
    the source IP from Zeek rdp.log/conn.log and per-tool artifact expectations. This access-then-cleanup
    sequence is a hallmark of Stealth: an actor connects, acts, then erases the very evidence of the connection.
    Source citations: [JPCERT/CC](https://www.jpcert.or.jp/english/pub/sr/20170612ac-ir_research_en.pdf).'
