      \ cmdline MATCHES /reg delete .*Terminal Server Client/i\n   OR /Remove-Item .*\\.rdp/i OR /wevtutil\\\
      s+cl/i OR /Clear-EventLog/i\n   OR /(rm|shred|truncate).*\\/var\\/log/ OR /journalctl --vacuum/\n\
