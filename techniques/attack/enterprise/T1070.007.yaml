name: 'T1070.007: Indicator Removal: Clear Network Connection History and Configurations'
id: afdbb335-91f5-4601-8935-1dad70b5a358
description: 'Investigate adversary attempts to clear or remove evidence of malicious network connections
  and tamper with network configuration in order to defeat forensic analysis (MITRE ATT&CK T1070.007,
  Indicator Removal: Clear Network Connection History and Configurations). This playbook helps an analyst
  hunt for and triage: execution of anti-forensic/history-clearing utilities (e.g., SDelete, CCleaner,
  BleachBit, srm, shred) and low-prevalence binaries that run shortly before connection artifacts disappear;
  built-in command-line clearing of RDP history (reg delete of Terminal Server Client keys, removal of
  Default.rdp and bitmap cache files), Windows/Linux/macOS log clearing (wevtutil cl, Clear-EventLog,
  rm/shred/truncate of /var/log, journalctl --vacuum, pfctl -F), and network-device config/log erasure
  (clear logging, write erase, erase startup-config); anomalous volumes of deletion/modification events
  against RDP registry keys and file artifacts or *nix connection logs; access-then-cleanup sequences
  where a remote logon (RDP Logon Type 10, SSH, or screen sharing) is quickly followed by history clearing
  by the same identity; unauthorized host- and device-firewall rule changes that remove a recently used
  access path; and integrity-gap / telemetry-loss signals such as Windows Event 1102 (audit log cleared),
  4719 (audit policy changed), broken EventRecordID sequences, broken log hash-chains, and silenced logging
  agents. Detection approaches span deterministic symbolic-logic rules, statistical baselining/change-point
  analysis, and explainable machine-learning models across Windows, Linux, macOS, and network-device telemetry.'
type: technique
