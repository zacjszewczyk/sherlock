- question: 'Using statistical baselining, can you determine whether ''Command entropy outlier scoring''
    indicates clipboard data collection (T1115) activity? Specifically: Score clipboard command lines
    by Shannon entropy against a 95th-percentile baseline of admin scripts; encoded/packed staging produces
    entropy >7.2 per [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989),
    so flag high-entropy outliers and report the measured entropy value.'
