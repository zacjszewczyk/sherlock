name: 'T1115: Clipboard Data'
id: 892aaf8a-467d-46c4-80ce-84af9b6b9084
description: 'This playbook helps an analyst determine whether an adversary is collecting Clipboard Data
  (T1115): reading, monitoring, or replacing the contents of the system clipboard to capture sensitive
  values (passwords, tokens, crypto-wallet addresses, IBANs) copied within or between applications. It
  correlates host process telemetry (Windows Event ID 4688, Sysmon 1, auditd execve, macOS unified log)
  for native clipboard utilities -- clip.exe, Get-Clipboard/Set-Clipboard, pbpaste/pbcopy, xclip/xsel,
  and osascript ''the clipboard'' -- with file-creation (Sysmon 11) and network telemetry (Sysmon 3, Zeek
  conn.log/dns.log) to surface the full collection-to-staging-to-exfiltration chain. Investigative angles
  include: threat-intel hash matches on clipper/scraper tools; clipboard reads chained via redirection
  or pipes to files, interpreters (iex), or network utilities (nc/curl/scp); clipboard utilities spawned
  by non-interactive parents (w3wp, services, lsass, LaunchAgents) or with no controlling TTY; high-frequency
  clipboard polling indicative of a clipper loop; background processes overwriting the clipboard with
  wallet/IBAN patterns (clipboard hijacking / Transmitted Data Manipulation, T1565.002); and clipboard
  access immediately followed by rare/uncategorized outbound connections. Detection blends symbolic-logic
  rules, statistical baselining (prevalence, entropy, frequency, write/read ratios, percentiles), and
  machine learning (Isolation Forest, One-Class SVM, XGBoost, DBSCAN, HMM/LSTM sequence models, provenance-graph
  autoencoders) to produce evasion-resistant, explainable alerts for the Collection tactic.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
