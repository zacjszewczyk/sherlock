- question: 'Using deterministic rule logic, can you determine whether ''Clipboard command regex detection''
    indicates clipboard data collection (T1115) activity? Specifically: Regex-scan command lines for clipboard-utility
    redirection/pipe patterns documented in [Atomic Red Team T1115](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1115/T1115.md)
    — e.g., `Get-Clipboard | Out-File`, `Get-Clipboard | iex`, `clip < file`, `pbpaste | nc`, `xclip -o
    > file` — building on the deterministic [clip.exe Sigma rule](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_clip_execution.yml);
    alert when a clipboard read is chained to file/network/interpreter output.'
