  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: All user workstations and remote access servers (RDP/Citrix).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// ML scoring for: Clipboard process classifier\nfeatures = [proc.path, parent, user, signing_status,\
      \ child_count,\n            cmdline_tokens, cmdline_ast, clipboard_freq, write_read_ratio,\n   \
      \         content_type_match, dest_rarity, bytes_sent, fail_conn_count]\nmodel = OneClassSVM|IsolationForest|XGBoost|DBSCAN|HMM|LSTM|GraphAutoencoder\n\
