questions:
- question: 'Using deterministic rule logic, can you determine whether ''Threat-intel hash correlation''
    indicates clipboard data collection (T1115) activity? Specifically: Query process-creation hashes
    (Win 4688/Sysmon 1, auditd execve, macOS unified log) against a curated clipboard-scraper/clipper
    IOC feed (e.g., the malicious RubyGems clipper documented in [Mining for Malicious Ruby Gems](https://www.reversinglabs.com/blog/mining-for-malicious-ruby-gems))
    and alert on exact matches; never remove this exact-match floor even after adding ML.'
  context: 'Tactic context (Collection / TA0009): the adversary is trying to gather data of interest to
    their goal, and clipboard contents frequently hold passwords, crypto-wallet addresses, tokens, and
    other sensitive values copied between applications. Evidence under investigation: A process creation
    event is logged where the executable''s hash matches a known malicious signature associated with clipboard
    data collection or clipboard-hijacking (clipper) tools. Approach (Threat-intel hash correlation):
    Query process-creation hashes (Win 4688/Sysmon 1, auditd execve, macOS unified log) against a curated
    clipboard-scraper/clipper IOC feed (e.g., the malicious RubyGems clipper documented in [Mining for
    Malicious Ruby Gems](https://www.reversinglabs.com/blog/mining-for-malicious-ruby-gems)) and alert
    on exact matches; never remove this exact-match floor even after adding ML. A positive result means
    a process is reading or replacing clipboard contents in a manner inconsistent with normal interactive
    use (e.g., non-interactive parent, chained staging/exfil, abnormal frequency, or a clipper rewriting
    high-value patterns); a negative result means the activity matches expected user/clipboard baselines.
    Investigate the named area of interest (All user workstations and remote access servers (RDP/Citrix).)
    and pivot from any hit to the originating process, user, parent lineage, and any subsequent staging
    or exfiltration.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: All user workstations and remote access servers (RDP/Citrix).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Threat-intel hash correlation\nMATCH process_creation (Win\
      \ 4688 / Sysmon 1 / auditd execve / macOS unifiedlog) WHERE\n  proc.name IN ['clip.exe','powershell.exe','pwsh.exe','pbpaste','pbcopy','xclip','xsel','osascript']\n\
      \  AND (cmdline MATCHES /(Get-Clipboard|Set-Clipboard|pbpaste|pbcopy|xclip|xsel|the clipboard)/i)\n\
      \  AND (\n        hash IN clipper_ioc_feed                         // exact-match IOC floor\n  \
      \   OR cmdline MATCHES /(\\||>|Out-File|iex|nc |curl |scp )/  // chained to file/net/interpreter\n\
      \     OR parent.name IN ['w3wp.exe','services.exe','lsass.exe'] // non-interactive parent\n    \
      \ OR tty == NONE\n     OR clipboard_write_value MATCHES /(0x[a-fA-F0-9]{40}|[13][a-km-zA-HJ-NP-Z1-9]{25,34}|[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30})/\
      \ // wallet/IBAN\n  )\nTHEN alert(severity='high', enrich=[hash, parent, user, cmdline])"
- question: 'Using statistical baselining, can you determine whether ''Parent prevalence scoring'' indicates
    clipboard data collection (T1115) activity? Specifically: When a hash match occurs, score the parent
    process by enterprise prevalence (seen on <5% of hosts over 30 days) and by code-signing state (unsigned
    = higher), elevating the alert and emitting the prevalence percentile in the alert text.'
  context: 'Tactic context (Collection / TA0009): the adversary is trying to gather data of interest to
    their goal, and clipboard contents frequently hold passwords, crypto-wallet addresses, tokens, and
    other sensitive values copied between applications. Evidence under investigation: A process creation
    event is logged where the executable''s hash matches a known malicious signature associated with clipboard
    data collection or clipboard-hijacking (clipper) tools. Approach (Parent prevalence scoring): When
    a hash match occurs, score the parent process by enterprise prevalence (seen on <5% of hosts over
    30 days) and by code-signing state (unsigned = higher), elevating the alert and emitting the prevalence
    percentile in the alert text. A positive result means a process is reading or replacing clipboard
    contents in a manner inconsistent with normal interactive use (e.g., non-interactive parent, chained
    staging/exfil, abnormal frequency, or a clipper rewriting high-value patterns); a negative result
    means the activity matches expected user/clipboard baselines. Investigate the named area of interest
    (All user workstations and remote access servers (RDP/Citrix).) and pivot from any hit to the originating
    process, user, parent lineage, and any subsequent staging or exfiltration.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: All user workstations and remote access servers (RDP/Citrix).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Parent prevalence scoring\nWINDOW = 1m..1h  // tune per signal\n\
      FOR EACH user-host-process clipboard event:\n  prevalence    = pct_hosts_seen(parent.hash, 30d)\
      \        // raise risk when <5%\n  cmd_entropy   = shannon_entropy(cmdline)                // staging\
      \ packs entropy >7.2\n  freq          = count(clipboard_exec) per minute        // clipper polls\
      \ in tight loop\n  write_ratio   = count(set_clipboard) / count(get_clipboard)\n  dest_rarity  \
      \ = pct_prevalence(egress_domain, 90d)\nCOMPUTE per-entity baseline (mean, sigma, percentiles)\n\
      ALERT WHEN prevalence < 5% OR cmd_entropy > 7.2\n  OR freq > mean+3*sigma OR write_ratio > p99 OR\
      \ dest_rarity in bottom 1%\nTHEN report measured value(s) in alert"
- question: 'Using a machine-learning model, can you determine whether ''Clipboard process classifier''
    indicates clipboard data collection (T1115) activity? Specifically: Feed process metadata (path, parent,
    user, signing status, child count) into a one-class model (Isolation Forest / One-Class SVM) trained
    on benign clipboard-tool executions and surface the top-3 contributing features via LIME in the alert,
    as shown for robust IoT anomaly detection in [Robust IoT Security Using Isolation Forest and One-Class
    SVM](https://www.nature.com/articles/s41598-025-20445-4).'
