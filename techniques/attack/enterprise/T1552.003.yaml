- question: '[Credential Access] Score session activity with a provenance graph model: Can you determine
    whether a correlated sequence of host and network events on a single system within a short time window:
    1) Enumeration in a user''s home directory, 2) Direct access to a shell history file, and 3) A subsequent
    outbound network connection or creation of a new remote session. -- specifically, using the ''Score
    session activity with a provenance graph model'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the command
    history on compromised Linux, macOS, and Windows systems for insecurely stored credentials -- usernames,
    passwords, tokens, and API keys that users typed on the command line and that shells such as Bash
    and Zsh (and PowerShell''s PSReadline) persist to history files like ~/.bash_history, ~/.zsh_history,
    and ConsoleHost_history.txt. This evidence focuses on the condition that a correlated sequence of
    host and network events on a single system within a short time window: 1) Enumeration in a user''s
    home directory, 2) Direct access to a shell history file, and 3) A subsequent outbound network connection
    or creation of a new remote session. This Machine Learning approach works as follows: Represent the
    session as a provenance graph (process/file/network nodes and edges) and score its anomalousness with
    a temporal graph autoencoder per [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) ([code](https://github.com/ProvenanceAnalytics/kairos))
    or node-level GraphSAGE per [ThreaTrace](https://arxiv.org/pdf/2111.04333); KAIROS additionally reconstructs
    the attack subgraph (enumerate -> read history -> exfil) to provide an explainable, triage-ready footprint.
    Validated on [DARPA TC](https://github.com/darpa-i2o/Transparent-Computing). A positive result --
    a deterministic rule match, a statistical outlier, or a model alert -- indicates probable harvesting
    (or destruction/exfiltration) of credentials from shell history; pivot to the responsible process
    and its parent lineage, the user and host context, the specific history file and reader process, the
    search keywords used, and any follow-on archive/transfer or new outbound session. A negative result
    helps rule out this particular vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, living-off-the-land, or low-and-slow activity.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Windows Event ID 4624
  - Auditd
  - Windows Event ID 4104
  - 'NAI: Domain Controllers (for authentication events), Critical servers and developer workstations
    (for process and network events), Network choke points (for observing outbound connections).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Score session activity with a provenance graph model (Machine Learning)

      source IN [Windows Event ID 4688, Zeek conn.log, Windows Event ID 4624, Auditd, Windows Event ID
      4104]

      | approach: Represent the session as a provenance graph (process/file/network nodes and edges) and
      score its anomalousness with a temporal graph autoencoder per [KAIROS](https://tfjmp.org/publications/2024-sp.pdf)
      ([code](https://github.com/ProvenanceAnalytics/kairos)) or node-level GraphSAGE per [ThreaTrace](https://arxiv.org/pdf/2111.04333);
      KAIROS additionally reconstructs the attack subgraph (enumerate -> read history -> exfil) to provide
      an explainable, triage-ready footprint. Validated on [DARPA TC](https://github.com/darpa-i2o/Transparent-Computing).

      | scope to NAI: Domain Controllers (for authentication events), Critical servers and developer workstations
      (for process and network events), Network choke points (for observing outbound connections).

      | emit alert with contributing fields and entity context'
