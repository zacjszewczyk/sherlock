    Add deterministic special-char/keyword feature thresholds from [Obfuscated Command Line Detection
    Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).
    Derive per-environment thresholds from 30 days of baseline command telemetry. A positive result --
