- question: '[Credential Access] Flag high-entropy / obfuscated commands accessing history files: Can
    you determine whether command execution telemetry shows targeted parsing of shell history artifacts
    with credential-focused search terms, indicating probable attempts to recover secrets from previously
    typed commands. -- specifically, using the ''Flag high-entropy / obfuscated commands accessing history
