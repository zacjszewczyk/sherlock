questions:
- question: '[Credential Access] Detect credential harvesting from shell history: Can you determine whether
    command execution telemetry shows targeted parsing of shell history artifacts with credential-focused
    search terms, indicating probable attempts to recover secrets from previously typed commands. -- specifically,
    using the ''Detect credential harvesting from shell history'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the command
    history on compromised Linux, macOS, and Windows systems for insecurely stored credentials -- usernames,
    passwords, tokens, and API keys that users typed on the command line and that shells such as Bash
    and Zsh (and PowerShell''s PSReadline) persist to history files like ~/.bash_history, ~/.zsh_history,
    and ConsoleHost_history.txt. This evidence focuses on the condition that command execution telemetry
    shows targeted parsing of shell history artifacts with credential-focused search terms, indicating
    probable attempts to recover secrets from previously typed commands. This Symbolic Logic approach
    works as follows: Alert on command-lines or PowerShell script blocks that reference history files
    (`.bash_history`, `.zsh_history`, `ConsoleHost_history.txt`; persistent path per [about_History](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_history))
    AND credential keywords (`password`, `passwd`, `secret`, `token`, `apikey`, `api_key`, `access_key`,
    `aws_secret`, `-p `, `--password`) via search utilities (`grep`, `egrep`, `awk`, `sed`, `Select-String`,
    `findstr`). Model the deterministic process.name+process.args matching on [Suspicious Windows Command
    Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/).
    Keep keyword and path lists as hard floors. A positive result -- a deterministic rule match, a statistical
    outlier, or a model alert -- indicates probable harvesting (or destruction/exfiltration) of credentials
    from shell history; pivot to the responsible process and its parent lineage, the user and host context,
    the specific history file and reader process, the search keywords used, and any follow-on archive/transfer
    or new outbound session. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, living-off-the-land,
    or low-and-slow activity.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Linux auditd logs
  - Windows Event ID 4104
  - 'NAI: All endpoints (Linux, macOS, Windows), especially servers and developer workstations.'
