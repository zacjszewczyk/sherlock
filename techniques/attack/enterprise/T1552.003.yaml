name: 'T1552.003: Bash History'
id: df6a6650-f2fc-4134-816b-2d3d9c85cec6
description: 'This playbook helps an analyst investigate whether an adversary is attempting to harvest
  credentials from shell history files (Bash History, T1552.003) as part of the Credential Access tactic.
  On Linux and macOS, shells persist typed commands to per-user history files (~/.bash_history, ~/.zsh_history);
  on Windows, PowerShell''s PSReadline persists ConsoleHost_history.txt. Because users frequently pass
  usernames, passwords, tokens, and API keys as command-line arguments, these files become a rich source
  of insecurely stored secrets that adversaries parse with search utilities such as grep, awk, sed, Select-String,
  and findstr. It guides the analyst across several behavioral angles: command execution that parses history
  artifacts with credential-focused keywords; history-file access by anomalous or service processes (httpd,
  nginx, php-fpm, mysqld, svchost.exe); commands that clear, disable, or redirect history logging (history
  -c, unset HISTFILE, Clear-History, file deletion); harvest-to-export chains where history reads are
  followed by archiving and transfer tooling; network exfiltration of files named like shell history artifacts;
  and correlated host-and-network sequences (home-directory enumeration -> history read -> outbound connection).
  Detection methods combine symbolic-logic rules, statistical baselining/UEBA peer scoring, and machine-learning
  models (Random Forest, Isolation Forest, BERT/ELECTRA command-line embeddings, LSTM sequence models,
  and GraphSAGE/temporal-graph provenance scoring) applied to Windows Security and PowerShell logs (4688,
  4104, 4663, 4660, 4624), Sysmon Event ID 1, Linux auditd (SYSCALL/EXECVE), macOS Unified Log and EndpointSecurity,
  and Zeek conn.log/files.log, so the analyst can corroborate suspected shell-history credential harvesting
  across process lineage, file access, command content, and downstream exfiltration.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
