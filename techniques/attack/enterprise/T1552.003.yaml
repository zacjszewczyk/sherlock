    and ConsoleHost_history.txt. This evidence focuses on the condition that command execution telemetry
    shows targeted parsing of shell history artifacts with credential-focused search terms, indicating
    probable attempts to recover secrets from previously typed commands. This Statistical Method approach
    works as follows: Baseline command-line Shannon entropy for commands that touch shell-history paths
    and flag the 95th percentile; for short strings prefer Kullback-Leibler divergence vs a natural-language
    baseline to cut false positives, per [Using Entropy in Threat Hunting](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)
