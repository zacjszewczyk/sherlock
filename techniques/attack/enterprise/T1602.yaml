- question: '[Collection] OID entropy + rate spike: Can you determine whether an SNMP GET/GETBULK request
    targeting a sensitive Object Identifier (OID) known to retrieve device configurations, or the execution
    of a network management/scanning tool (e.g., snmpwalk, nmap) on a host not designated for network
