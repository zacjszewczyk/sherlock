name: 'T1602: Data from Configuration Repository'
id: a019e98c-53a6-4d13-b2b8-d5187f975784
description: 'This playbook helps an analyst investigate whether an adversary has collected sensitive
  system administration data from configuration repositories (MITRE ATT&CK T1602, Data from Configuration
  Repository). Configuration repositories -- Network Management System (NMS) servers, TFTP servers, core
  network infrastructure (routers and switches), Domain Controllers hosting Group Policy Objects, cloud
  management consoles and API endpoints, and version control systems (Git/SVN) storing infrastructure-as-code
  -- store large quantities of device configuration data that align with adversary discovery objectives
  and can be exposed over SNMP, NETCONF/RESTCONF, TFTP, HTTPS, and SSH. The hunt pursues the behavior
  from several complementary angles: connections or authentications to repository assets that originate
  from threat-intel IPs or use compromised credentials; SNMP GET/GETBULK requests against sensitive configuration-bearing
  OIDs and execution of network management/scanning tools (snmpwalk, nmap) on non-administrative hosts;
  connections to repositories from network segments or hosts outside authorized admin subnets; abnormally
  large data transfers (resp_bytes) consistent with bulk startup/running-config exfiltration over TFTP
  or SMI (TCP/4786); anomalous authentication events (impossible travel, off-hours, brute/spray-then-success);
  and unauthorized file-system reads of configuration files and backup archives on repository hosts. Detection
  methods combine deterministic symbolic-logic rules (threat-intel correlation, OID watchlists, admin-subnet
  allowlists, large-transfer thresholds, failed-login surge correlation, SACL-audited file-access allowlists),
  statistical baselining (ASN/country and subnet rarity scoring, OID entropy and GETBULK rate spikes with
  change-point detection, resp_bytes z-scores, impossible-travel and logon-rate baselines, file-access
  frequency deviation), and machine learning (logistic regression/random forest session and file-access
  classifiers with SHAP explanations, Isolation Forest and One-Class SVM outlier detection, HMM/LSTM SNMP
  sequence modeling, DBSCAN/k-means connection clustering, ARIMA/Prophet and autoencoder volume forecasting,
  and authentication-graph link prediction), applied across Zeek conn/snmp/ssh/ssl logs and Windows Security
  and process-creation events, so the analyst can corroborate suspected configuration-repository collection
  against host, user, network, and volume context.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
