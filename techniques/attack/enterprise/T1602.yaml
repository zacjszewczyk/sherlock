questions:
- question: '[Collection] Threat feed source correlation: Can you determine whether a network connection
    (e.g., SNMP, TFTP, HTTPS, SSH) or authentication event to a configuration repository that originates
    from an IP address on a high-confidence threat intelligence feed or uses credentials known to be compromised.
    -- specifically, using the ''Threat feed source correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary collects sensitive system
    administration data from configuration repositories, where device configurations and credentials can
    be harvested in bulk to enable further discovery, lateral movement, and persistence across network
    infrastructure. This evidence focuses on the condition that a network connection (e.g., SNMP, TFTP,
    HTTPS, SSH) or authentication event to a configuration repository that originates from an IP address
    on a high-confidence threat intelligence feed or uses credentials known to be compromised. The ''Threat
    feed source correlation'' approach (Symbolic Logic) works as follows: Correlate Zeek conn.log/ssh.log/snmp.log
    connections and Windows Event ID 4624 authentications to repository NAIs against threat-intel IPs
    and compromised-credential lists; alert on matches and log host/user context. Also alert when a threat-listed
    IP appears in failed/blocked connections (SMI TCP/4786 scans, SNMPv1/v2c default-community attempts)
    per documented network-infrastructure tradecraft ([CISA TA18-106A](https://www.cisa.gov/news-events/alerts/2018/04/16/russian-state-sponsored-cyber-actors-targeting-network-infrastructure),
    [CISA TA17-156A](https://www.cisa.gov/news-events/alerts/2017/06/05/reducing-risk-snmp-abuse)). First-party
    logs only; no mandatory external lookup beyond the cached feed. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable collection from a configuration repository;
    pivot to the responsible host, user/account, source IP and subnet, the targeted repository asset and
    protocol (SNMP/TFTP/HTTPS/SSH/NETCONF), the configuration data or OIDs accessed, and the volume and
    timing of the transfer to scope what was exposed. A negative result helps rule out this particular
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, low-and-slow, or living-off-the-land repository access.'
  answer_sources:
  - Zeek conn.log
  - Zeek snmp.log
  - Zeek ssh.log
  - Zeek ssl.log
  - Windows Event ID 4624
  - 'NAI: Network Management System (NMS) servers, TFTP servers, Core network infrastructure (routers,
    switches), Domain Controllers hosting Group Policy Objects, Cloud management consoles and API endpoints,
    Version control systems (e.g., Git, SVN) storing infrastructure-as-code'
  range: Last 90 days (correlate event-centered windows of +/- 5 minutes around the activity)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Threat feed source correlation (Symbolic Logic)

      source IN [Zeek conn.log, Zeek snmp.log, Zeek ssh.log, Zeek ssl.log, Windows Event ID 4624]

      | filter destinations IN configuration-repository NAIs

      | approach: Correlate Zeek conn

      | correlate over NAI: Network Management System (NMS) servers, TFTP servers, Core network infrastructure
      (routers, switches), Domain Controllers hosting Group Policy Objects, Cloud management consoles
      and API endpoints, Version control systems (e.g., Git, SVN) storing infrastructure-as-code

      | emit alert with contributing fields and entity context (src_ip, subnet, user, host, protocol,
      oid, resp_bytes)'
  - technology: Zeek/pseudocode
    query: '# Threat feed source correlation -- Zeek implementation

      event zeek.conn/snmp/ssh/ssl

      | where resp_h in repository_assets

      | apply symbolic logic logic: Correlate Zeek conn

      | output id.orig_h, id.resp_h, id.resp_p, service, resp_bytes, uid'
- question: '[Collection] ASN/country rarity scoring: Can you determine whether a network connection (e.g.,
    SNMP, TFTP, HTTPS, SSH) or authentication event to a configuration repository that originates from
    an IP address on a high-confidence threat intelligence feed or uses credentials known to be compromised.
    -- specifically, using the ''ASN/country rarity scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary collects sensitive system
    administration data from configuration repositories, where device configurations and credentials can
    be harvested in bulk to enable further discovery, lateral movement, and persistence across network
    infrastructure. This evidence focuses on the condition that a network connection (e.g., SNMP, TFTP,
    HTTPS, SSH) or authentication event to a configuration repository that originates from an IP address
    on a high-confidence threat intelligence feed or uses credentials known to be compromised. The ''ASN/country
    rarity scoring'' approach (Statistical Method) works as follows: Using Zeek conn.log metadata, baseline
    ASNs/countries per repository over 30 days and alert when a source falls in the 99th percentile of
    rarity, scoring first-time source->repository edges with a Bayesian new-edge probability ([Metelli
    & Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf)).
    Track both successful and failed/blocked connection counts (State) so brute-force-then-success is
    distinguishable. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable collection from a configuration repository; pivot to the responsible host, user/account,
    source IP and subnet, the targeted repository asset and protocol (SNMP/TFTP/HTTPS/SSH/NETCONF), the
    configuration data or OIDs accessed, and the volume and timing of the transfer to scope what was exposed.
    A negative result helps rule out this particular vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    repository access.'
