  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic-logic: outlook.exe child-process allowlist\nALLOWLIST = {'winword.exe','excel.exe','iexplore.exe'}\n\
      HIGH_SEV = {'cmd.exe','powershell.exe','pwsh.exe','wscript.exe',\n            'cscript.exe','mshta.exe','rundll32.exe'}\n\
