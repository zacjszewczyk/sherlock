- question: 'Using deterministic rule logic, can you determine whether ''Child allowlist enforcement''
    reveals persistence established via malicious Outlook custom forms? Specifically: Alert when outlook.exe
    spawns any process outside a tight allowlist (e.g., winword.exe, excel.exe, iexplore.exe for legacy
    home pages), prioritizing cmd.exe/powershell.exe/pwsh.exe/wscript.exe/cscript.exe/mshta.exe/rundll32.exe
    as high-severity per Microsoft''s "new process starts that originate from the Outlook PID" guidance
    ([Microsoft](https://learn.microsoft.com/en-us/defender-office-365/detect-and-remediate-outlook-rules-forms-attack));
    Office apps should rarely/never spawn interpreters ([Process Injection, Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/)).'
  context: 'Tactic context (Persistence): the adversary is trying to maintain their foothold, and malicious
    Outlook forms give them code execution that reloads every time Outlook starts and re-triggers when
    a crafted email is received. Evidence under investigation: The Outlook process (outlook.exe) spawns
    a child process — particularly a command interpreter or scripting engine (cmd, powershell, wscript,
    cscript, mshta, rundll32) — inconsistent with the user/organization baseline. Microsoft notes the
    endpoint signature is "new process starts that originate from the Outlook PID." Approach (Child allowlist
    enforcement): Alert when outlook.exe spawns any process outside a tight allowlist (e.g., winword.exe,
    excel.exe, iexplore.exe for legacy home pages), prioritizing cmd.exe/powershell.exe/pwsh.exe/wscript.exe/cscript.exe/mshta.exe/rundll32.exe
