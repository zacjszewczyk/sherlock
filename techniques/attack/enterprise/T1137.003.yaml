name: 'T1137.003: Outlook Forms'
id: 860e4cdd-eb0b-4ab6-a531-76b2aa8ba768
description: 'This playbook helps an analyst determine whether an adversary is maintaining persistence
  on a compromised system through malicious Microsoft Outlook custom forms (T1137.003). Outlook forms
  act as templates for message presentation and functionality; an attacker (commonly using tooling such
  as Ruler) can inject a custom form containing executable VBScript into a victim''s mailbox so that it
  loads when Outlook starts and executes when a specially crafted email is delivered. Because the form
  lives in the cloud/Exchange mailbox, this persistence survives endpoint reimaging. The playbook guides
  investigation across the full kill chain of this technique: enumerating mailbox custom forms whose message
  class deviates from approved defaults or whose definitions embed script tokens; baselining and rarity-scoring
  form prevalence tenant-wide; classifying embedded form script with NLP/ML models; detecting outlook.exe
  spawning interpreters/scripting engines (cmd, powershell, wscript, cscript, mshta, rundll32) outside
  an allowlist; flagging obfuscated or download-and-execute child command lines; correlating outlook.exe
  (and child) network egress with threat intelligence, newly-registered domains, geo/ASN novelty, and
  beacon-like periodicity; and watching for unauthorized writes to Outlook form files, caches (.oft, .fdm,
  FAV), and persistence registry keys. Detection blends symbolic-logic rules, statistical baselining (frequency
  analysis, entropy scoring, interval analysis, time-series forecasting), and machine learning (text classifiers,
  Isolation Forest/One-Class SVM, gradient boosting, LSTM sequence models) to produce explainable, evasion-resistant
  alerts for the Persistence tactic.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
