  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical: fleet-wide message-class / form-name frequency analysis\nbaseline = freq(message_class)\
      \ OVER all_mailboxes\nFOR form IN new_or_existing_forms:\n  prevalence = baseline[form.message_class]\
      \ / total_mailboxes\n  ent = shannon_entropy(form.name)\n  IF prevalence < 0.001 OR first_seen(form.message_class)\n\
