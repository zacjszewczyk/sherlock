questions:
- question: 'Using deterministic rule logic, can you determine whether ''Mailbox form enumeration'' reveals
    persistence established via malicious Outlook custom forms? Specifically: Enumerate all mailbox custom
    forms tenant-wide and alert on (a) any form whose message class is not in the approved default set
    and (b) any form definition whose body contains script tokens (CreateObject, Wscript.Shell, .Run,
    Shell(, Item_Open, GetObject) per Microsoft''s IoCs "Custom forms present saved as their own message
    class" and "Message class contains executable code" ([Detect and Remediate Outlook Rules and Custom
    Forms Injection Attacks, Microsoft](https://learn.microsoft.com/en-us/defender-office-365/detect-and-remediate-outlook-rules-forms-attack));
    collect with [Get-AllTenantRulesAndForms.ps1](https://github.com/OfficeDev/O365-InvestigationTooling/blob/master/Get-AllTenantRulesAndForms.ps1).
    Known attacker tooling injects these forms ([Outlook Forms and Shells, SensePost](https://sensepost.com/blog/2017/outlook-forms-and-shells/);
    [Ruler](https://github.com/sensepost/ruler)).'
  context: 'Tactic context (Persistence): the adversary is trying to maintain their foothold, and malicious
    Outlook forms give them code execution that reloads every time Outlook starts and re-triggers when
    a crafted email is received. Evidence under investigation: An Outlook custom form is present in a
    user''s mailbox saved as its own non-standard message class (deviating from defaults such as IPM.Note/IPM.Appointment),
    and/or its form definition contains executable script (VBScript in an event handler such as Item_Open).
    This is the most direct first-party indicator of T1137.003 and persists in the cloud mailbox across
    reimaging. Approach (Mailbox form enumeration): Enumerate all mailbox custom forms tenant-wide and
    alert on (a) any form whose message class is not in the approved default set and (b) any form definition
    whose body contains script tokens (CreateObject, Wscript.Shell, .Run, Shell(, Item_Open, GetObject)
    per Microsoft''s IoCs "Custom forms present saved as their own message class" and "Message class contains
    executable code" ([Detect and Remediate Outlook Rules and Custom Forms Injection Attacks, Microsoft](https://learn.microsoft.com/en-us/defender-office-365/detect-and-remediate-outlook-rules-forms-attack));
    collect with [Get-AllTenantRulesAndForms.ps1](https://github.com/OfficeDev/O365-InvestigationTooling/blob/master/Get-AllTenantRulesAndForms.ps1).
    Known attacker tooling injects these forms ([Outlook Forms and Shells, SensePost](https://sensepost.com/blog/2017/outlook-forms-and-shells/);
    [Ruler](https://github.com/sensepost/ruler)). A positive result indicates activity consistent with
    malicious Outlook form persistence (an anomalous form, an unexpected outlook.exe child process, obfuscated
    command line, suspicious egress, or an unauthorized form-file/registry modification); a negative result
    means the observed activity matches expected baselines for the user, host, or tenant. Investigate
    the named area of interest (Exchange/M365 mailboxes, Mail servers (Exchange), User profile (forms
    cache .OST/.FAV), Outlook Application event log) and pivot from any hit to the affected mailbox, user
    account, host, and any downstream execution or callback to scope the compromise and drive remediation
    (form removal).'
  answer_sources:
  - Exchange Online PowerShell (Get-AllTenantRulesAndForms)
  - m365:unified
  - WinEventLog:Application
  - 'NAI: Exchange/M365 mailboxes, Mail servers (Exchange), User profile (forms cache .OST/.FAV), Outlook
    Application event log'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Symbolic-logic: enumerate mailbox custom forms tenant-wide\nforms = Get-AllTenantRulesAndForms()\n\
      APPROVED = {'IPM.Note','IPM.Appointment','IPM.Contact','IPM.Task','IPM.StickyNote'}\nSCRIPT_TOKENS\
      \ = /CreateObject|Wscript\\.Shell|\\.Run|Shell\\(|Item_Open|GetObject/i\nFOR form IN forms:\n  IF\
      \ form.message_class NOT IN APPROVED\n     OR form.definition MATCHES SCRIPT_TOKENS:\n       ALERT(mailbox=form.mailbox,\
      \ class=form.message_class, name=form.name)"
- question: 'Using statistical baselining and anomaly scoring, can you determine whether ''Form rarity
    scoring'' reveals persistence established via malicious Outlook custom forms? Specifically: Baseline
    message-class prevalence across all mailboxes via fleet-wide frequency analysis and flag custom message
    classes/form names appearing in <0.1% of mailboxes or seen for the first time, and score the form/class
    name string for high entropy/low n-gram likelihood (randomized names) ([Using Frequency Analysis to
    Defend Office 365, Microsoft](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365);
    [NgViz, Dusi](https://arxiv.org/pdf/1004.4359)). Track Frequency (new custom-form-create operations
    per mailbox per day) and State (whether the form survived a prior remediation).'
