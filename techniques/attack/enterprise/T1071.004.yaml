    adversaries abuse DNS because it is ubiquitous, often permitted before authentication, and rich in
    fields where data can be concealed, letting C2 traffic blend with normal resolution.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: DNS Resolvers, Endpoint Devices, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = [entropy, label_len, query_rate, rcode]

      score = isolation_forest(features)

      clusters = cluster_anomalies(score)

      ALERT where cluster_size>=min_size AND persistence>=min_windows'
- question: Can a semi-supervised autoencoder detect abnormal query strings via high reconstruction loss
