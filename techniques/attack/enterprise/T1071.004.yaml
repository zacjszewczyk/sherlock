name: 'T1071.004: DNS'
id: 572eea19-bf2d-439a-933d-26bee8c72513
description: Investigate DNS application-layer command-and-control (T1071.004), including DNS tunneling
  and beaconing, by combining passive DNS infrastructure analysis, beacon/tunneling behavior detection,
  encoded-query (QNAME payload) detection, low-and-slow exfiltration-pattern detection, and endpoint process-to-DNS
  correlation. This playbook helps an analyst surface low-prevalence and fast-rotating domains, low TTL
  and high answer churn, fixed-cadence host-to-domain beaconing, high-entropy or overly long labels, NXDOMAIN/empty-answer
  asymmetry indicative of query-name uploads, and high-risk process lineage issuing DNS lookups. It supports
  the threat model of a sophisticated external actor abusing DNS to blend into normal traffic for C2 under
  TA0011 Command and Control, while remaining realistic for routine threats, commodity malware, and insiders
  across Zeek/PCAP network telemetry and Windows/Linux/macOS/ESXi endpoint logs.
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.2'
tags: none
questions:
- question: Are any internal clients resolving or connecting to registered domains, answer IPs, or ASNs
    that match curated DNS C2 threat intelligence and are not covered by an allowlist?
  context: 'Normalize FQDNs from Zeek dns.log to their registered (eTLD+1) domains and join against curated
    C2 intelligence in Zeek intel.log on domain, IP, and ASN. A positive hit without an allowlist match
    is a direct overlap with known malicious infrastructure and warrants immediate triage; a negative
    result narrows attention to behavior-based methods. Preserve enrichment (domain age, IP/ASN reputation,
    client prevalence) so analysts can prioritize. Tie findings to TA0011 Command and Control: adversaries
    abuse DNS because it is ubiquitous, often permitted before authentication, and rich in fields where
    data can be concealed, letting C2 traffic blend with normal resolution. Reference: [Detecting and
    Controlling Hidden DNS Tunnel Attacks](https://fidelissecurity.com/threatgeek/learn/dns-tunneling-detection/).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'dns_norm = normalize_to_registered_domain(dns.qname)

      matches = JOIN dns_norm WITH intel ON domain OR answer_ip OR answer_asn

      ALERT where matches AND NOT allowlisted

      OUTPUT client_ip, qname, registered_domain, answer_ip, asn, first_seen, last_seen'
- question: Which DNS resolutions are followed by outbound connections to the resolved infrastructure
    within 1-5 minutes, especially when CNAME chains and newly seen domains suggest disposable C2 routing?
  context: 'Correlate DNS answer events with subsequent Zeek conn.log flows in a 1-5 minute window (client_ip,
    qname, answer_ip, uid, conn tuple) and retain the full CNAME chain, TTLs, answer set, and first-seen
    timestamp. Real DNS C2 typically requires successful post-resolution connectivity, so this correlation
    suppresses benign failed lookups while highlighting reachable rotating infrastructure. Tie findings
    to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous, often permitted before
    authentication, and rich in fields where data can be concealed, letting C2 traffic blend with normal
    resolution. Reference: [Behavioral Detection of DNS Tunneling and Application Layer Abuse (DET0400)](https://attack.mitre.org/detectionstrategies/DET0400/).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'dns = normalize_and_expand_cname(dns.log)

      conns = conn.log WHERE ts BETWEEN dns.ts AND dns.ts+5m AND dst_ip IN dns.answer_ips AND src_ip=dns.client_ip

      joined = JOIN dns WITH conns

      ALERT on newly_seen_domain OR list_hit

      OUTPUT cname_chain, ttl_stats, answer_set, conn_tuple, first_seen_ts'
- question: Which registered domains show fast-flux style behavior with low median TTL and frequent answer-set
    churn or high IP/ASN diversity, using passive features only?
  context: 'Over rolling 1-hour windows flag domains with median TTL under 300s AND at least three answer-set
    changes for the same domain enterprise-wide, OR notably high IP/ASN diversity in answers. Prefer passive
    features to avoid tipping off the adversary via active probing. Rapid rotation is how adversaries
    keep C2 reachable while evading blocklists. Tie findings to TA0011 Command and Control: adversaries
    abuse DNS because it is ubiquitous, often permitted before authentication, and rich in fields where
    data can be concealed, letting C2 traffic blend with normal resolution. Reference: [Early Detection
    of Malicious Flux Networks via Large-Scale Passive DNS Traffic Analysis (FluxBuster)](https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/Stats pseudocode
    query: "FOR each registered_domain, 1h_window:\n  compute median_ttl, answer_change_count, answer_ip_diversity,\
      \ answer_asn_diversity\nALERT if (median_ttl<300 AND answer_change_count>=3) OR high_diversity"
- question: Are there low-prevalence domains with low TTL plus extreme answer churn or high NXDOMAIN rate
    that should rank as high-risk DNS C2 candidates?
  context: 'Statistically filter for domains seen on <=5 hosts/day AND median TTL <300 AND (top-1% churn
    OR NXDOMAIN rate >30%), then rank alerts by affected_hosts x churn_score. This prioritizes sparse
    but dangerous infrastructure that single thresholds miss, distinguishing it from rare-but-benign lookups.
    Tie findings to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous, often
    permitted before authentication, and rich in fields where data can be concealed, letting C2 traffic
    blend with normal resolution.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'daily = GROUP BY registered_domain, day => unique_hosts, median_ttl, churn_score, nxdomain_rate

      risk = unique_hosts * churn_score

      ALERT where unique_hosts<=5 AND median_ttl<300 AND (churn_score>=p99 OR nxdomain_rate>0.30) ORDER
      BY risk DESC'
- question: Which domains are statistical outliers against rolling environment baselines for prevalence,
    query count, NXDOMAIN rate, median TTL, answer churn, and CNAME depth?
  context: 'Maintain rolling per-domain baselines for unique hosts, query count, NXDOMAIN rate, median
    TTL, answer-churn, and CNAME depth; alert when unique hosts <=5/day AND median TTL <300 AND churn
    or NXDOMAIN rate sits in the top 1-2% of the environment. This catches subtle, persistent C2 infrastructure
    that evades fixed-threshold rules. Tie findings to TA0011 Command and Control: adversaries abuse DNS
    because it is ubiquitous, often permitted before authentication, and rich in fields where data can
    be concealed, letting C2 traffic blend with normal resolution. Reference: [EXPOSURE: A Passive DNS
    Analysis Service](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = rolling_30d_metrics(registered_domain,[unique_hosts,query_count,nxdomain_rate,median_ttl,churn,cname_depth])

      today = current_metrics(registered_domain)

      outlier = percentile_rank(today,[churn,nxdomain_rate])>=98

      ALERT where unique_hosts<=5 AND median_ttl<300 AND outlier'
- question: Does a supervised domain risk scorer flag domains as likely malicious from passive DNS and
    operational features, and can analysts see the top contributing features for each score?
  context: 'Train a supervised risk scorer on passive DNS plus operational features using locally labeled
    benign/malicious domains, and require explainability output (e.g., SHAP top-3 features) rather than
    an opaque probability. Explainable scoring builds analyst trust, speeds triage, and supports defensible
    escalation decisions. Tie findings to TA0011 Command and Control: adversaries abuse DNS because it
    is ubiquitous, often permitted before authentication, and rich in fields where data can be concealed,
    letting C2 traffic blend with normal resolution. Reference: [DomainDynamics](https://doi.org/10.1016/j.cose.2025.104366).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - Zeek intel.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = build_domain_features(passive_dns + operational_context)

      score = supervised_model.predict_proba(features)

      explain = shap_top3(features)

      ALERT where score>=risk_threshold

      OUTPUT score, explain, supporting_telemetry'
- question: Do DNS queries match known tunneling and beacon signatures, such as repeated TXT lookups,
    fixed label templates, and response characteristics tied to common DNS C2 tooling?
  context: 'Apply signature-based matching over Zeek dns.log using query type, regex label patterns, and
    response characteristics (e.g., repeated TXT lookups, fixed label templates) for known DNS C2 tool
    families. This gives fast coverage of established tooling and should run alongside anomaly methods
    for novel tradecraft. Tie findings to TA0011 Command and Control: adversaries abuse DNS because it
    is ubiquitous, often permitted before authentication, and rich in fields where data can be concealed,
    letting C2 traffic blend with normal resolution.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/Signature pseudocode
    query: 'MATCH dns.log WHERE rrtype IN [TXT,NULL,CNAME] AND qname REGEX known_c2_patterns AND response_pattern
      IN suspicious_templates

      ALERT with signature_id, host, registered_domain, count'
- question: Is a host issuing >=20 TXT/NULL queries within 30 minutes to one registered domain with labels
    in a tight length band but distinct values, consistent with chunked payload exchange?
  context: 'Flag (src_ip, registered_domain) when >=20 TXT/NULL queries occur in 30 minutes AND the longest
    label length stays within +/-3 chars while labels remain distinct. Tight-banded yet distinct labels
    indicate fixed-size chunking of command or data over DNS rather than ordinary resolution. Tie findings
    to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous, often permitted before
    authentication, and rich in fields where data can be concealed, letting C2 traffic blend with normal
    resolution.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'GROUP BY src_ip, registered_domain, 30m: txt_null_count, distinct_labels, label_len_stddev

      ALERT where txt_null_count>=20 AND label_len_stddev<=3 AND distinct_labels high'
- question: Which host-domain pairs show a stable beacon cadence (e.g., 30s/60s/120s/300s with low jitter)
    sustained over many queries and minutes?
  context: 'For each (src_ip, registered_domain) compute inter-query intervals; alert when median interval
    is in {30,60,120,300}s with jitter <=+/-10% and >=40 queries over >=20 minutes. Emit cadence, first/last
    timestamps, RRType distribution, and sample queries. Deterministic periodicity is a strong C2 tasking/keepalive
    signal. Tie findings to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous,
    often permitted before authentication, and rich in fields where data can be concealed, letting C2
    traffic blend with normal resolution. Reference: [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Time-series pseudocode
    query: 'series = inter_arrival_times(src_ip, registered_domain)

      cadence = median(series); jitter = pct_deviation(series, cadence)

      ALERT where cadence IN [30,60,120,300] AND jitter<=0.10 AND query_count>=40 AND duration>=20m

      OUTPUT cadence, rrtype_mix, first_ts, last_ts, samples'
- question: Are there host-domain pairs with tunnel-leaning RRType concentration, such as high TXT ratio
    or any NULL usage combined with a high unique-subdomain rate?
  context: 'Alert on (src_ip, registered_domain) when TXT/NULL queries exceed a high ratio (start >=50%
    in a 30-60 min window) OR any NULL is observed, and the pair also shows a high unique-subdomain rate.
    TXT/NULL records are uncommon in normal enterprise traffic and are favored carriers for DNS command
    exchange. Tie findings to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous,
    often permitted before authentication, and rich in fields where data can be concealed, letting C2
    traffic blend with normal resolution. Reference: [Below the Radar](https://docs.apwg.org/ecrimeresearch/2019/Nov13_DennisTatang.pdf).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'GROUP BY src_ip, registered_domain, window: txt_ratio, null_seen, unique_subdomain_rate

      ALERT where (txt_ratio>=0.50 OR null_seen) AND unique_subdomain_rate high'
- question: Which host-domain pairs are extreme periodicity outliers relative to host-role or network-segment
    baselines?
  context: 'Aggregate queries per minute per (src_ip, registered_domain) and compute coefficient of variation
    of inter-arrival, autocorrelation peak strength, and spectral peak score; flag pairs that are extreme
    periodicity outliers against role/segment baselines. Comparing to peers avoids penalizing legitimately
    periodic software. Tie findings to TA0011 Command and Control: adversaries abuse DNS because it is
    ubiquitous, often permitted before authentication, and rich in fields where data can be concealed,
    letting C2 traffic blend with normal resolution.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'per_min = aggregate_queries_per_min(src_ip, registered_domain)

      metrics = [cv_interarrival, acf_peak, spectral_peak]

      z = compare_to_role_baseline(metrics, host_role, segment)

      ALERT where z>=threshold'
- question: Do rolling 30-minute DNS behavior sequences for a host (query-type transitions, label-length
    changes, response codes, timing) score as low-likelihood under a per-host model?
  context: 'Train a per-host sequence model on normal DNS behavior and score rolling 30-minute windows,
    alerting on low-likelihood sequences. This detects previously unseen tool behavior that static signatures
    miss; a low-likelihood window indicates the host''s DNS pattern has shifted toward structured exchange.
    Tie findings to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous, often
    permitted before authentication, and rich in fields where data can be concealed, letting C2 traffic
    blend with normal resolution.'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'seq = build_dns_sequences_per_host([rrtype,label_len,rcode,delta_t])

      ll = sequence_model.log_likelihood(seq_30m)

      ALERT where ll < anomaly_threshold'
- question: Can a sequence model both detect low-likelihood DNS beaconing and classify the likely tunnel/tool
    family while emitting the features and timepoints that drove the decision?
  context: 'Train a per-host sequence model over DNS events to detect low-likelihood sequences and classify
    known tunnel/tool families, requiring the alert to emit decisive features/timepoints. This broadens
    detection beyond signatures and gives responders actionable triage context for attribution. Tie findings
    to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous, often permitted before
    authentication, and rich in fields where data can be concealed, letting C2 traffic blend with normal
    resolution. Reference: [Domainator](https://arxiv.org/html/2505.22220v1).'
  answer_sources:
  - Zeek dns.log
  - Zeek conn.log
  - 'NAI: Network Egress Points, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'model = train_or_load_sequence_classifier()

      pred = model.predict(window_features)

      explain = feature_timepoint_importance(pred)

      ALERT where pred.class in tunnel_families OR pred.anomaly

      OUTPUT class, confidence, explain'
- question: Are there DNS queries with QNAME length over 200 or any label >=50 chars matching base32/base64/hex-like
    charsets, outside approved high-entropy domains?
  context: 'Alert on Zeek dns.log queries where total QNAME length >200 OR any label >=50 chars matches
    encoded character sets, excluding approved high-entropy domains (CDNs, security vendors). Long encoded
    labels are a hallmark of QNAME payload smuggling rather than legitimate name resolution. Tie findings
    to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous, often permitted before
    authentication, and rich in fields where data can be concealed, letting C2 traffic blend with normal
    resolution.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: DNS Resolvers, Endpoint Devices, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: ALERT FROM dns.log WHERE (len(qname)>200 OR (max_label_len>=50 AND charset IN [base32,base64,hex]))
      AND registered_domain NOT IN approved_high_entropy_domains
- question: Do repeated high-entropy, distinct subdomain labels occur in bursts paired with NXDOMAIN or
    empty answers, indicating probable chunked DNS tunneling?
  context: 'Flag repeated queries to the same registered domain where labels are high-entropy and distinct,
    occur in bursts (>=30 queries/10 min), and are paired with NXDOMAIN or empty-answer responses. The
    combination is far more reliable than any single attribute and points to payload transfer using the
    query name as the channel. Tie findings to TA0011 Command and Control: adversaries abuse DNS because
    it is ubiquitous, often permitted before authentication, and rich in fields where data can be concealed,
    letting C2 traffic blend with normal resolution.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: DNS Resolvers, Endpoint Devices, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: 'GROUP BY src_ip, registered_domain, 10m: high_entropy_count, distinct_label_ratio, nxdomain_or_empty_ratio

      ALERT where high_entropy_count>=30 AND distinct_label_ratio high AND nxdomain_or_empty_ratio high'
- question: Which DNS queries breach hard limits on QNAME/label length, encoded charset, label count,
    or dot density associated with DNS exfiltration?
  context: 'Flag queries where total QNAME length >200 OR any single label >=50 chars matching base32/base64/hex-like
    charsets, and also flag excessive label counts and high dot density. These structural hard limits
    catch overt encoding even when overall throughput is low. Tie findings to TA0011 Command and Control:
    adversaries abuse DNS because it is ubiquitous, often permitted before authentication, and rich in
    fields where data can be concealed, letting C2 traffic blend with normal resolution. Reference: [Real-Time
    Detection of DNS Exfiltration](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: DNS Resolvers, Endpoint Devices, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: Zeek/Rule pseudocode
    query: ALERT FROM dns.log WHERE len(qname)>200 OR (max_label_len>=50 AND charset_like_encoded) OR
      label_count>hard_limit OR dot_density>hard_limit
- question: Do new query strings deviate strongly from benign n-gram fingerprints for the host's business
    unit or network segment?
  context: 'Maintain benign n-gram fingerprints of subdomain strings per major business unit/segment,
    score new query strings by distance from those fingerprints, and alert on persistent high-distance
    hosts/domains. This catches algorithmically generated or encoded labels that simple length/entropy
    rules miss. Tie findings to TA0011 Command and Control: adversaries abuse DNS because it is ubiquitous,
    often permitted before authentication, and rich in fields where data can be concealed, letting C2
    traffic blend with normal resolution. Reference: [NgViz](https://arxiv.org/pdf/1004.4359).'
  answer_sources:
  - Zeek dns.log
  - 'NAI: DNS Resolvers, Endpoint Devices, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Feature-scoring pseudocode
    query: 'fingerprint = benign_ngram_model(segment)

      score = ngram_distance(current_subdomain_string, fingerprint)

      ALERT where score>=distance_threshold AND persistent(host, registered_domain)'
- question: Are hosts producing high-entropy DNS queries at rates exceeding both their role's 99th percentile
    and 10x their own 30-day baseline?
  context: 'Compute Shannon entropy for the longest label, full QNAME, and concatenated subdomain prefixes;
    alert when a host''s high-entropy query rate exceeds the 99th percentile for its role AND is >=10x
    its 30-day baseline. Combining peer-relative and self-relative thresholds yields robust detection
    of encoded-label bursts. Tie findings to TA0011 Command and Control: adversaries abuse DNS because
    it is ubiquitous, often permitted before authentication, and rich in fields where data can be concealed,
    letting C2 traffic blend with normal resolution.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: DNS Resolvers, Endpoint Devices, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'entropy_metrics = calc_entropy([longest_label, full_qname, prefix_concat])

      rate = high_entropy_query_rate(host)

      ALERT where rate>role_p99 AND rate>=10*host_baseline_30d'
- question: Do anomalous DNS events (entropy, label length, query rate, response code) form persistent
    clusters that diverge from baseline lookup traffic?
  context: 'Use an anomaly detector (e.g., Isolation Forest) trained on Zeek dns.log features and alert
    when anomalous events form persistent clusters. Requiring persistence over multiple windows suppresses
