  queries:
  - technology: SIEM/Rule pseudocode
    query: 'GROUP BY src_ip, registered_domain, 10m: qcount

      peer_prev = distinct_hosts_querying_domain(segment)

      ALERT where qcount>500 AND NOT allowlisted AND peer_prev low'
