name: "T1071.004: DNS"
id: "572eea19-bf2d-439a-933d-26bee8c72513"
description: "Investigate DNS-based command-and-control by combining passive DNS infrastructure analysis, beacon/tunneling behavior detection, encoded-query detection, exfiltration-pattern detection, and endpoint process-to-DNS correlation. This playbook focuses on low-prevalence domains, low TTL and answer churn, periodic host-domain communication, high-entropy and long labels, NXDOMAIN/empty-answer asymmetry, and high-risk process lineage that can indicate DNS C2 and tunneling under TA0011 Command and Control."
type: "technique"
related:
  - tactic_id: "TA0011"
    tactic_name: "Command and Control"
contributors:
  - "Zachary Szewczyk"
created: "2026-02-18"
modified: "2026-02-18"
version: "1.0"
tags: "none"
questions:
  - question: "Are any internal clients resolving or connecting to registered domains or answer infrastructure that match curated DNS C2 intelligence and are not allowlisted?"
    context: "Use symbolic logic to normalize FQDNs from Zeek dns.log to registered domains and join with curated intelligence from Zeek intel.log (domain, IP, ASN). The investigative purpose is to quickly surface direct overlaps with known malicious C2 infrastructure while reducing noise through explicit allowlist checks. Preserve enrichment fields so analysts can triage by domain age, IP/ASN reputation, and client prevalence. Source method: DNS C2 intel match (Symbolic Logic), with reference https://fidelissecurity.com/threatgeek/learn/dns-tunneling-detection/."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Zeek intel.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "Last 90 days, with priority triage on the most recent 24 hours."
    queries:
      - technology: "SIEM/SQL-like pseudocode"
        query: "dns_norm = normalize_to_registered_domain(Zeek_dns.qname); matches = JOIN dns_norm WITH Zeek_intel ON domain OR answer_ip OR answer_asn; ALERT where matches=true AND allowlisted=false; OUTPUT client_ip, qname, registered_domain, answer_ip, asn, first_seen, last_seen."

  - question: "Which DNS resolutions are followed by outbound connections to resolved infrastructure within 1-5 minutes, especially when CNAME chains and newly seen domains suggest disposable C2 routing?"
    context: "Use symbolic correlation to connect DNS answer events to subsequent Zeek conn.log flows within a 1-5 minute window and retain full CNAME chains, TTL history, answer-set membership, and first-seen values. This question is meaningful because real DNS C2 often requires successful post-resolution connectivity, and correlation reduces false positives from benign failed lookups. Source method: DNS infrastructure correlation and post-resolution connection check (Symbolic Logic), with reference https://attack.mitre.org/detectionstrategies/DET0400/."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Zeek intel.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "Last 90 days, with 1-5 minute DNS-to-connection joins per event."
    queries:
      - technology: "SIEM/Correlation pseudocode"
        query: "dns = normalize_and_expand_cname(Zeek_dns); conns = Zeek_conn WHERE ts BETWEEN dns.ts AND dns.ts+5m AND dst_ip IN dns.answer_ips AND src_ip=dns.client_ip; joined = JOIN dns WITH conns; ALERT on newly_seen_domain OR list_hit; OUTPUT cname_chain, ttl_stats, answer_set, conn_tuple, first_seen_ts."

  - question: "Do newly seen registered domains exhibit fast-flux patterns with very low TTL and frequent answer-set changes across a common client population?"
    context: "Apply symbolic thresholds for fast-flux style DNS: TTL below 300 seconds, at least three answer-set changes in one hour, and domain-newness constraints. This matters because adversaries rotate infrastructure rapidly to evade blocklists while retaining command reachability. Source method: Fast-flux and dynamic DNS rules (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Zeek intel.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "Last 90 days, evaluated in rolling 1-hour windows."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "GROUP BY registered_domain, hour_window: calc median_ttl, answer_set_change_count, distinct_clients, domain_first_seen; ALERT where median_ttl<300 AND answer_set_change_count>=3 AND domain_first_seen_within=30d."

  - question: "Which domains satisfy enterprise-scale fast-flux guardrails based on low median TTL, high one-hour answer churn, and high IP/ASN diversity without requiring active probing?"
    context: "Use passive symbolic detection over rolling one-hour windows to identify domains with median TTL below 300s and at least three answer changes, or notably high IP/ASN diversity in returned answers. The rationale is to prioritize passive, defensible indicators that scale across enterprise sensors and align with flux-network behavior. Source method: Fast-flux style answer churn and low-TTL guardrail (Symbolic Logic), with reference https://www.theshifters.it/wp-content/uploads/2022/02/FLuxBusterTDSC2012-1.pdf."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Zeek intel.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "Last 90 days, rolling 1-hour detection windows and weekly trend checks."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "FOR each registered_domain, 1h_window: compute median_ttl, answer_change_count, answer_ip_diversity, answer_asn_diversity; ALERT if (median_ttl<300 AND answer_change_count>=3) OR high_diversity=true."

  - question: "Are there low-prevalence domains with low TTL plus extreme churn or NXDOMAIN behavior that rank as high-risk for DNS C2?"
    context: "Use statistical filtering to find domains seen on five or fewer hosts per day with median TTL below 300 and either top-1% churn or NXDOMAIN rate above 30%. Ranking by affected hosts multiplied by churn score helps prioritize sparse but dangerous infrastructure. Source method: Rare low-TTL domains (Statistical Method)."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Zeek intel.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "Last 90 days, daily prevalence baselines with hourly refresh."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: "daily = GROUP BY registered_domain, day => unique_hosts, median_ttl, churn_score, nxdomain_rate; risk = affected_hosts*churn_score; ALERT where unique_hosts<=5 AND median_ttl<300 AND (churn_score>=p99 OR nxdomain_rate>0.30) ORDER BY risk DESC."

  - question: "Which domains are statistical outliers when compared against rolling environment baselines for prevalence, churn, NXDOMAIN rate, and CNAME depth?"
    context: "Maintain rolling per-domain baselines for unique hosts, total queries, NXDOMAIN rate, median TTL, answer-churn, and CNAME depth, then detect top 1-2% outliers under low-prevalence constraints. This question captures subtle but persistent C2 infrastructure that may evade single-threshold rules. Source method: Low-prevalence plus dynamism statistical outliers (Statistical Method), with reference https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Zeek intel.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "Last 90 days, with rolling 30-day baseline windows."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: "baseline = rolling_30d_metrics(registered_domain,[unique_hosts,query_count,nxdomain_rate,median_ttl,churn,cname_depth]); today = current_metrics(...); outlier = percentile_rank(today,[churn,nxdomain_rate])>=98; ALERT where unique_hosts<=5 AND median_ttl<300 AND outlier=true."

  - question: "Does supervised risk scoring identify domains as likely malicious based on passive DNS and operational features, and can analysts see the top drivers for each score?"
    context: "Use machine learning to score registered domains with labeled benign/malicious outcomes and require explainability output (for example SHAP top contributors) rather than opaque probabilities. This is meaningful because explainable scoring supports analyst trust, triage speed, and defensible escalation decisions. Source method: Domain risk scoring with explainable features (Machine Learning), with reference https://doi.org/10.1016/j.cose.2025.104366."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Zeek intel.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "Last 90 days for feature extraction, model retraining cadence as locally defined."
    queries:
      - technology: "ML pipeline pseudocode"
        query: "features = build_domain_features(passive_dns + operational_context); score = supervised_model.predict_proba(features); explain = shap_top3(features); ALERT where score>=risk_threshold; OUTPUT score, explain, supporting telemetry."

  - question: "Do DNS queries match known tunneling and beacon signatures, including repeated TXT lookups and fixed label templates associated with common DNS C2 tooling?"
    context: "Apply signature-based symbolic logic over query type, regex label patterns, and response characteristics to detect established DNS C2 behavior families. This question gives fast initial coverage for known tooling and should be used alongside anomaly methods for unknown tradecraft. Source method: DNS C2 signature beacons (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "Last 90 days, with near-real-time matching for new events."
    queries:
      - technology: "SIEM/Signature pseudocode"
        query: "MATCH Zeek_dns WHERE rrtype IN [TXT,NULL,CNAME] AND qname REGEX known_c2_patterns AND response_pattern IN suspicious_templates; ALERT with signature_id, host, domain, count."

  - question: "Is a host issuing TXT or NULL queries to one domain in a way that suggests fixed-size chunked payload exchange?"
    context: "Use symbolic thresholding for at least 20 TXT/NULL queries in 30 minutes where labels remain in a tight length band (+/-3 characters) but are distinct. This pattern can indicate structured command or exfiltration chunking over DNS rather than ordinary resolution behavior. Source method: Structured TXT/NULL chunking (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "Last 90 days, assessed in 30-minute windows."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "GROUP BY src_ip, registered_domain, 30m: txt_null_count, distinct_labels, label_len_stddev; ALERT where txt_null_count>=20 AND label_len_stddev<=3 AND distinct_labels high."

  - question: "Which host-domain pairs demonstrate stable beacon cadence at 30s, 60s, 120s, or 300s intervals with low jitter and sustained volume?"
    context: "Compute inter-query intervals for each host-domain pair and flag deterministic cadence when jitter is within +/-10% and at least 40 queries occur over at least 20 minutes. Stable periodicity is a strong C2 signal, especially when paired with unusual RRType distributions. Source method: Fixed-cadence host-domain beacon detector (Symbolic Logic), with reference https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "Last 90 days, rolling 20-minute and 2-hour windows."
    queries:
      - technology: "SIEM/Time-series pseudocode"
        query: "series = inter_arrival_times(src_ip,registered_domain); cadence = median(series); jitter = pct_deviation(series,cadence); ALERT where cadence IN [30,60,120,300] AND jitter<=0.10 AND query_count>=40 AND duration>=20m; OUTPUT rrtype_mix,samples."

  - question: "Are there host-domain pairs with tunnel-leaning RRType concentration, such as high TXT or any NULL usage combined with high unique-subdomain rates?"
    context: "Use symbolic logic to flag pairs where TXT/NULL query ratios exceed initial thresholds (for example >=50% in a 30-60 minute window) or any NULL appears, then require elevated unique-subdomain rates to reduce false positives. This question targets command exchange channels hidden in DNS record types not dominant in normal enterprise traffic. Source method: RRType concentration and tunnel-leaning patterns (Symbolic Logic), with reference https://docs.apwg.org/ecrimeresearch/2019/Nov13_DennisTatang.pdf."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "Last 90 days, rolling 30-60 minute windows."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "GROUP BY src_ip,registered_domain,window: txt_ratio, null_seen, unique_subdomain_rate; ALERT where (txt_ratio>=0.50 OR null_seen=true) AND unique_subdomain_rate high."

  - question: "Which host-domain pairs are periodicity outliers compared with peers in the same host role or network segment?"
    context: "Compute statistical periodicity metrics including inter-arrival coefficient of variation, autocorrelation peak strength, and spectral peak score from per-minute query aggregates. Compare each pair against role/segment baselines to identify suspiciously regular communications that differ from expected software behavior. Source method: Spectral/ACF periodicity scoring with role baselines (Statistical Method)."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "Last 90 days, baseline windows of at least 30 days and minute-level scoring."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: "per_min = aggregate_queries_per_min(src_ip,registered_domain); metrics = [cv_interarrival, acf_peak, spectral_peak]; z = compare_to_role_baseline(metrics,host_role,segment); ALERT where z>=threshold."

  - question: "Do rolling 30-minute DNS behavior sequences for a host show low likelihood under normal sequence patterns?"
    context: "Train a lightweight per-host sequence model using query-type transitions, label-length changes, response codes, and timing, then score rolling windows for anomaly. This question helps detect previously unseen tool behavior that does not match static signatures. Source method: DNS sequence anomaly (Machine Learning Lightweight)."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "Last 90 days, scored in rolling 30-minute windows."
    queries:
      - technology: "ML pipeline pseudocode"
        query: "seq = build_dns_sequences_per_host([rrtype,label_len,rcode,delta_t]); ll = sequence_model.log_likelihood(seq_30m); ALERT where ll < anomaly_threshold."

  - question: "Can sequence modeling both detect beaconing anomalies and classify likely DNS tunnel/tool families with explainable decision points?"
    context: "Use machine learning over DNS event sequences to detect low-likelihood behavior and classify known tool families, and require output of decisive features and timestamps driving each alert. This provides both broader detection and actionable triage context for responders. Source method: Sequence model for DNS beaconing and tool-family differentiation (Machine Learning), with reference https://arxiv.org/html/2505.22220v1."
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "Last 90 days for training and validation, near-real-time classification on incoming windows."
    queries:
      - technology: "ML pipeline pseudocode"
        query: "model = train_or_load_sequence_classifier(); pred = model.predict(window_features); explain = feature_timepoint_importance(pred); ALERT where pred.class in tunnel_families OR pred.anomaly=true; OUTPUT class, confidence, explain."

  - question: "Are there DNS queries with unusually long QNAMEs or labels that match base32/base64/hex-like patterns outside approved high-entropy domains?"
    context: "Apply symbolic hard rules for total QNAME length over 200 characters or any label at least 50 characters with encoded character sets, while excluding approved CDN and security-vendor domains. This question is effective for identifying overt DNS tunneling payload carriers quickly. Source method: High-entropy label rules (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "Last 90 days, with immediate alerting on new matches."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "ALERT FROM Zeek_dns WHERE (len(qname)>200 OR max_label_len>=50 AND charset IN [base32,base64,hex]) AND registered_domain NOT IN approved_high_entropy_domains."

  - question: "Do repeated high-entropy and distinct subdomain labels occur in bursts with NXDOMAIN or empty answers, indicating probable chunked DNS tunneling?"
    context: "Use symbolic logic to detect bursts of at least 30 queries in 10 minutes to the same registered domain where labels are high-entropy, mostly distinct, and coupled with NXDOMAIN or empty-answer responses. The combined pattern is more reliable than any single attribute and highlights likely payload transfer behavior. Source method: Chunked high-entropy labels (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "Last 90 days, evaluated in 10-minute burst windows."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "GROUP BY src_ip,registered_domain,10m: high_entropy_count, distinct_label_ratio, nxdomain_or_empty_ratio; ALERT where high_entropy_count>=30 AND distinct_label_ratio high AND nxdomain_or_empty_ratio high."

  - question: "Which DNS queries breach hard limits on QNAME/label length, charset, label count, or dot density that align with DNS exfiltration patterns?"
    context: "Use symbolic thresholds for total QNAME length over 200, single labels at least 50 with encoded character sets, and additional structural anomalies such as excessive label counts and dot density. The rationale is to capture overt encoding behavior even when throughput is low. Source method: QNAME/label length and charset hard limits (Symbolic Logic), with reference https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "Last 90 days, with rolling 24-hour trend review for repeated offenders."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "ALERT FROM Zeek_dns WHERE (len(qname)>200 OR max_label_len>=50 AND charset_like_encoded=true OR label_count>hard_limit OR dot_density>hard_limit)."

  - question: "Do new query strings significantly deviate from benign n-gram fingerprints for the host's business unit or network segment?"
    context: "Maintain benign n-gram language fingerprints for subdomain strings per business unit or segment, score new strings by distance, and alert on persistent high-distance host/domain pairs. This question helps detect encoded or algorithmic label generation not captured by simple length/entropy rules. Source method: N-gram fingerprint deviation rule (Symbolic Logic), with reference https://arxiv.org/pdf/1004.4359."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "Last 90 days, with fingerprint baselines refreshed from the prior 30 days."
    queries:
      - technology: "SIEM/Feature-scoring pseudocode"
        query: "fingerprint = benign_ngram_model(segment); score = ngram_distance(current_subdomain_string,fingerprint); ALERT where score>=distance_threshold for persistent host/domain occurrences."

  - question: "Are hosts producing high-entropy DNS queries at rates that exceed both role-based percentiles and their own 30-day baselines?"
    context: "Compute Shannon entropy for longest label, full QNAME, and concatenated prefixes, then flag hosts whose high-entropy query rate exceeds the 99th role percentile and is at least 10x the host baseline. This balances peer-based and self-based anomaly detection for robustness. Source method: Entropy-rate baseline and burst outliers (Statistical Method)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "Last 90 days, minimum 30-day baseline required."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: "entropy_metrics = calc_entropy([longest_label,full_qname,prefix_concat]); rate = high_entropy_query_rate(host); ALERT where rate>role_p99 AND rate>=10*host_baseline_30d."

  - question: "Do anomalous DNS events form persistent clusters in feature space that diverge from baseline lookup traffic?"
    context: "Train a lightweight anomaly detector such as Isolation Forest on DNS features including entropy, label length, query rate, and response code, then alert when anomalous points cluster persistently. The clustering requirement reduces one-off noise and emphasizes active campaigns. Source method: DNS label anomaly clustering (Machine Learning Lightweight)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "Last 90 days for training and cluster persistence checks over hourly windows."
    queries:
      - technology: "ML pipeline pseudocode"
        query: "features = [entropy,label_len,query_rate,rcode]; score = isolation_forest(features); clusters = cluster_anomalies(score); ALERT where cluster_size>=min_size AND persistence>=min_windows."

  - question: "Can semi-supervised modeling detect abnormal query strings while producing analyst-readable explanations for why the strings are suspicious?"
    context: "Train an autoencoder on benign subdomain/prefix strings and alert on high reconstruction loss, then generate a white-box surrogate explanation such as a decision tree with top driving features. This preserves detection power and interpretability required for operational triage. Source method: Explainable anomaly detection of query strings (Machine Learning), with reference https://www.mdpi.com/2073-431X/14/9/375."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "Last 90 days, with model retraining on rolling benign corpora."
    queries:
      - technology: "ML pipeline pseudocode"
        query: "loss = autoencoder.reconstruction_loss(subdomain_string); if loss>threshold then explain = surrogate_tree(top_features); ALERT with loss, explain, sample_queries."

  - question: "Which host-domain pairs show sustained fixed-interval DNS cadence with low jitter consistent with beaconing keepalive behavior?"
    context: "Use symbolic cadence detection at common intervals (30s, 60s, 120s) with +/-10% jitter and require at least 20 minutes and 40 queries before escalation. The purpose is to isolate deterministic communications that differ from human-driven or bursty software traffic. Source method: Fixed-cadence beaconing (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "Last 90 days, scored in 20-minute and 2-hour windows."
    queries:
      - technology: "SIEM/Time-series pseudocode"
        query: "pairs = interarrival_stats(src_ip,registered_domain); ALERT where cadence IN [30,60,120] AND jitter<=0.10 AND duration>=20m AND queries>=40; OUTPUT cadence_sparkline."

  - question: "Are any sources generating very high DNS volume to a single domain in short windows, and is that behavior rare among peers?"
    context: "Use symbolic floor rules to detect more than 500 queries to one registered domain in 10 minutes (tuned by segment), exclude allowlisted infrastructure, and include peer prevalence to separate fleet software from isolated compromise. This highlights potential tunnel channels with strong concentration. Source method: High-volume single-domain floor rule (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "Last 90 days, evaluated in 10-minute windows."
    queries:
      - technology: "SIEM/Rule pseudocode"
        query: "GROUP BY src_ip,registered_domain,10m: qcount; peer_prev = distinct_hosts_querying_domain(segment); ALERT where qcount>500 AND allowlisted=false AND peer_prev low."

  - question: "Does suspected beacon cadence persist across both short and long windows, supporting high-confidence paging?"
    context: "Require cadence confirmation in multiple windows (for example 20-minute and 2-hour) and include cadence, jitter, and window counts in output. Multi-window persistence reduces alerts from short-lived anomalies and supports decisive escalation. Source method: Beacon cadence confirmation with multi-window persistence (Symbolic Logic)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "Last 90 days, with simultaneous 20-minute and 2-hour evaluations."
    queries:
      - technology: "SIEM/Correlation pseudocode"
        query: "short = detect_cadence(window=20m); long = detect_cadence(window=2h); ALERT where short=true AND long=true; OUTPUT cadence,jitter,short_count,long_count."

  - question: "Which host-domain pairs rank highest when combining periodicity strength, query volume, and persistence across days?"
    context: "Use statistical ranking by periodicity times volume times persistence-days, with thresholds tuned by host role to prevent bias from normal infrastructure services. This produces an ordered queue for analysts instead of binary output. Source method: Periodicity plus volume composite ranking (Statistical Method)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "Last 90 days, including daily persistence scoring."
    queries:
      - technology: "SIEM/Stats pseudocode"
        query: "metrics = compute([periodicity_score,query_volume,persistence_days], by=src_ip+registered_domain); rank = periodicity_score*query_volume*persistence_days; ALERT_TOP where rank>=segment_threshold(host_role)."

  - question: "Do per-host per-domain DNS volumes exceed forecasted upper bounds for at least three consecutive windows?"
    context: "Apply lightweight time-series forecasting (for example seasonal autoregressive models) and alert only when observed values remain above model bounds across three windows. This question targets sustained deviations indicative of beaconing/tunneling rather than brief spikes. Source method: Time-series forecast residuals (Machine Learning Lightweight)."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "Last 90 days for model training and validation; active scoring in short windows."
    queries:
      - technology: "ML time-series pseudocode"
        query: "forecast, upper = seasonal_ar_model(train_90d, key=src_ip+domain); breaches = consecutive_windows(observed>upper); ALERT where breaches>=3."

  - question: "Can real-time sequence classification distinguish benign DNS behavior from tunnel families with low latency and explanation output?"
    context: "Deploy a lightweight sequential model using tokenized domain embeddings and numeric DNS features, run in parallel with deterministic cadence rules, and require explanation output for each alert. This supports fast detection while preserving analyst confidence and accountability. Source method: Low-latency sequential detector for sustained tunnel/beacon behavior (Machine Learning), with reference https://arxiv.org/abs/2512.09565."
    answer_sources:
      - "Zeek dns.log"
      - "Recursive resolver query logs (if available)"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "Last 90 days for model preparation, real-time scoring for active detections."
