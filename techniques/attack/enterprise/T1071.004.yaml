name: "T1071.004: DNS"
id: "84aad042-47da-47cd-97b3-f9f7bda658ea"
description: >
  This playbook guides investigation of DNS-based command and control by focusing on
  DNS telemetry that shows ties to known C2 infrastructure, fast-changing or low-prevalence
  domains, long or high-entropy labels indicative of tunneling, sustained periodic query
  patterns, and endpoint processes that should not be generating DNS traffic. It combines
  network- and host-level observations to identify suspicious DNS activity consistent with
  C2 beaconing, tunneling, or data staging over DNS.
type: "technique"
related:
  - "TA0011: Command and Control"
contributors:
  - "Zachary Szewczyk"
created: "2026-02-18"
modified: "2026-02-18"
version: "1.0"
tags: "none"
questions:
  - question: >
      Are any internal hosts resolving or connecting to domains or IPs tied to known C2
      infrastructure, including recent CNAME chains that immediately precede outbound
      connections?
    context: >
      DNS-based C2 frequently relies on known or previously identified infrastructure.
      Normalizing and correlating DNS answers to subsequent outbound connections helps
      confirm whether a host actually used a suspicious response. This question prioritizes
      high-confidence matches by checking both DNS resolutions and near-term connections,
      and captures full CNAME chains to preserve investigative context.
    answer_sources:
      - "Zeek dns.log"
      - "Zeek intel.log"
      - "Zeek conn.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "last 90 days"
    queries:
      - "Zeek: normalize QNAME -> registered_domain; join dns.log with intel.log on domain/IP; alert on matches without allowlist"
      - "Zeek: join dns.log answers to conn.log dst_ip within 5m of DNS response; include CNAME chain"

  - question: >
      Do any domains show fast-flux or dynamic-DNS behavior (very low TTL, frequent answer
      churn, repeated CNAME indirection) that is newly observed in the environment?
    context: >
      Disposable C2 infrastructure often uses dynamic DNS or fast-flux patterns to evade
      blocking. By measuring TTLs, answer churn, and novelty, analysts can isolate domains
      that change quickly in ways consistent with infrastructure rotation rather than
      legitimate service usage.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "last 90 days"
    queries:
      - "Zeek: per registered_domain compute TTL stats and answer churn; flag TTL <300s and >=3 answer changes/hour"
      - "Zeek: filter to newly seen domains; output timeline of answer changes and affected hosts"

  - question: >
      Which newly seen domains are low-prevalence yet exhibit low TTL and high churn or
      elevated NXDOMAIN rates compared to the environment baseline?
    context: >
      C2 domains often appear briefly and are queried by only a few hosts. Combining
      low-prevalence with low TTL and churn/NXDOMAIN rates helps separate likely C2 from
      benign typos and reduces alert volume by ranking the most anomalous domains.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "last 90 days"
    queries:
      - "Zeek: rolling windows (1h, 24h) compute host count, query volume, median TTL, churn, NXDOMAIN rate, first_seen"
      - "Zeek: flag domains with <=5 hosts/day AND median TTL <300 AND (top 1% churn OR NXDOMAIN >30%)"

  - question: >
      Do machine-learning scores flag newly seen domains as likely C2 based on DNS feature
      patterns such as TTL, entropy, query length, and CNAME depth?
    context: >
      Supervised models can synthesize multiple DNS features to estimate the probability
      that a domain is used for C2. This provides a defensible, repeatable signal when
      compared against labeled benign/C2 training sets and helps prioritize investigations.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "last 90 days"
    queries:
      - "ML: train classifier on DNS features (TTL, entropy, length, NXDOMAIN, host prevalence, CNAME depth)"
      - "ML: score newly seen domains daily; alert above tuned threshold; store top feature contributions"

  - question: >
      Are there host-domain pairs with atypical ratios of TXT/NULL/CNAME queries combined
      with periodic cadence or high distinct-subdomain rates?
    context: >
      DNS tunneling and beaconing often leverage non-standard query types and repeated
      subdomain variation. Measuring query-type ratios, cadence, and subdomain diversity
      highlights structured traffic that deviates from normal resolver behavior.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "last 90 days"
    queries:
      - "Zeek: per src_ip x domain per hour compute TXT/NULL/CNAME ratio, inter-query CV, distinct-subdomain rate"
      - "Zeek: flag pairs above 98th percentile ratio AND (CV <0.3 OR top 1% subdomain rate)"

  - question: >
      Do per-host DNS query sequences appear anomalous, particularly repetitive TXT/CNAME
      queries with stable cadence across multiple windows?
    context: >
      Sequence modeling can expose structured DNS protocols that are not obvious from
      single-event thresholds. Persistent low-likelihood sequences clustered by domain
      suggest coordinated C2 activity across hosts.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers, DNS Forwarders"
    range: "last 90 days"
    queries:
      - "ML: train per-host sequence model on query types, entropy, response codes, timing"
      - "ML: score 30m windows; alert on low-likelihood sequences dominated by repetitive TXT/CNAME"

  - question: >
      Do DNS queries contain very long or high-entropy labels consistent with encoded
      data, and are they originating from unapproved domains?
    context: >
      High-entropy or unusually long labels are a hallmark of DNS tunneling, where data is
      embedded into the query name. Identifying these queries and excluding known benign
      high-entropy domains helps isolate suspicious activity without excessive noise.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "last 90 days"
    queries:
      - "Zeek: alert on QNAME length >200 OR longest label >=50 with base32/base64/hex-like charset"
      - "Zeek: exclude approved high-entropy domains; group by host-domain pair"

  - question: >
      Are there bursts of repeated high-entropy labels to the same domain with frequent
      NXDOMAIN or empty-answer responses, suggesting chunked data uploads?
    context: >
      DNS tunneling commonly splits data into multiple encoded labels sent in rapid bursts.
      When paired with NXDOMAIN or empty responses, this pattern indicates upload-by-query
      behavior rather than normal resolution.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "last 90 days"
    queries:
      - "Zeek: flag bursts >=30 queries/10m to same domain with distinct high-entropy labels"
      - "Zeek: require NXDOMAIN or empty answers; output burst windows and sample labels"

  - question: >
      Which hosts show a spike in high-entropy DNS queries relative to their subnet or
      role-based baseline over the past month?
    context: >
      Entropy outlier detection controls for differences in host roles (e.g., dev vs.
      user workstations) and highlights sudden behavior changes. A sharp increase in
      high-entropy queries is a strong indicator of tunneling or covert DNS usage.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "last 90 days"
    queries:
      - "Zeek: compute Shannon entropy for longest label and full QNAME"
      - "Zeek: baseline by subnet/role; flag hosts above 99th percentile and >10x their 30d baseline"

  - question: >
      Do anomaly-detection clusters highlight persistent high-entropy DNS activity for
      specific host-domain pairs?
    context: >
      Clustering anomalous DNS transactions can reveal sustained tunneling sessions even
      when individual events appear only mildly suspicious. Persistent clusters across
      windows indicate structured behavior deserving deeper investigation.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Internal DNS Resolvers, Endpoint Devices, Network Egress Points"
    range: "last 90 days"
    queries:
      - "ML: train Isolation Forest on entropy, label length/count, query rate, subdomain rate, response codes"
      - "ML: alert on persistent anomalous clusters per host-domain; summarize median entropy/length"

  - question: >
      Is any host sending unusually high volumes of DNS queries to a single domain within
      short windows, and is that domain unexpected for the network segment?
    context: >
      Sustained high-volume queries to one domain can indicate C2 beaconing or tunnel
      keepalive traffic. This question also checks whether the domain is common in that
      segment to reduce false positives.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "Zeek: alert on >500 queries per src_ip x domain within 10m; exclude allowlisted domains"
      - "Zeek: identify other hosts querying same domain in prior 24h"

  - question: >
      Do any host-domain pairs show fixed-cadence DNS querying (e.g., 30s/60s/120s with low
      jitter) over sustained periods?
    context: >
      Beaconing behavior often uses consistent intervals to check in for tasking. Detecting
      stable cadence and summarizing timing patterns helps confirm structured C2 behavior.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "Zeek: detect host-domain cadence with ±10% jitter for >=20m and >=40 queries"
      - "Zeek: output top cadence values, timestamp sparkline, dominant query type"

  - question: >
      Which host-domain pairs exhibit statistically significant periodicity and elevated
      volume compared to role-based baselines?
    context: >
      Combining periodicity metrics with volume thresholds focuses attention on the most
      suspicious beacons and reduces noise from occasional periodic jobs or monitoring.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "Zeek: aggregate queries per minute per host-domain; compute inter-arrival CV and autocorrelation"
      - "Zeek: flag CV <0.3 and autocorrelation above threshold plus volume >99th percentile"

  - question: >
      Do time-series forecast residuals indicate sustained DNS query spikes for specific
      host-domain pairs?
    context: >
      Forecasting models can identify deviations from expected DNS behavior even when
      absolute volumes are not extreme. Repeated residual spikes across windows can signal
      consistent C2 activity.
    answer_sources:
      - "Zeek dns.log"
      - "NAI: Client Network Subnets, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "ML: fit rolling baseline model per host-domain; alert when observed exceeds upper bound for 3 windows"
      - "ML: output expected vs observed and residual statistics"

  - question: >
      Are long DNS queries producing NXDOMAIN or empty answers, especially for TXT/NULL/CNAME
      types, in patterns consistent with tunneling?
    context: >
      Tunneling via query names often results in minimal or empty responses. This question
      looks for long queries with empty answers and groups them to distinguish tunneling
      from transient misconfigurations.
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "Zeek: flag QNAME length >80 AND (NXDOMAIN OR NOERROR with empty answers) for TXT/NULL/CNAME"
      - "Zeek: compute empty/NXDOMAIN fraction per host-domain"

  - question: >
      Do sequential queries to the same domain show fixed-size changes in query length with
      predominantly empty responses?
    context: >
      Chunking data into fixed-size segments is a common tunneling pattern. Identifying
      stepwise query length changes and pairing them with empty responses provides a clear
      signal of encoded uploads over DNS.
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "Zeek: for host-domain sequences compute QNAME length deltas; flag fixed-size steps"
      - "Zeek: require NXDOMAIN or empty NOERROR; output ordered lengths and response codes"

  - question: >
      Which host-domain pairs show sustained high query-size characteristics with minimal
      response content compared to baseline?
    context: >
      A high query-to-response size ratio indicates data being sent outward in the query
      name rather than normal resolution. Joining dns.log with conn.log (where available)
      provides a more complete view of byte patterns.
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "Zeek: join dns.log with conn.log on uid; compute query length proxy and response bytes"
      - "Zeek: flag host-domain pairs top 1% query-size and top 1% empty-answer rate in 1h window"

  - question: >
      Do clustered DNS transaction patterns suggest a structured protocol layer being
      carried over DNS for specific hosts?
    context: >
      Clustering reveals consistent, protocol-like patterns that differ from baseline
      lookup traffic. Persistent clusters across windows indicate a likely tunneling
      session rather than random anomalous queries.
    answer_sources:
      - "Zeek dns.log"
      - "Zeek conn.log"
      - "NAI: Network Egress Points, Internal DNS Resolvers"
    range: "last 90 days"
    queries:
      - "ML: cluster transactions by query type, QNAME length/entropy, response code, empty-answer rate, timing"
      - "ML: alert on tight clusters that persist across windows for a host"

  - question: >
      Are high-risk Windows processes or binaries in user-writable paths generating DNS
      queries to non-allowlisted domains, and do those domains exhibit suspicious
      characteristics?
    context: >
      DNS-based C2 often runs under script interpreters or LOLBins. Correlating Sysmon
      DNS events with process lineage and domain risk attributes provides strong evidence
      of malicious activity and helps prioritize response.
    answer_sources:
      - "Windows Sysmon Event ID 22"
      - "Windows Sysmon Event ID 1"
      - "Windows Sysmon Event ID 3"
      - "Zeek dns.log"
      - "NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Linux servers, macOS endpoints, ESXi management networks"
    range: "last 90 days"
    queries:
      - "Sysmon: filter EventID 22 where Image in LOLBins or path in %TEMP%/%APPDATA%/%PUBLIC%; exclude allowlist"
      - "Sysmon: join to EventID 1 for parent/command line; enrich with domain novelty/entropy from Zeek"

  - question: >
      Do unsigned or untrusted-signer processes initiate DNS queries that are periodic or
      target high-entropy/long-label domains, and do they also create suspicious network
      connections?
    context: >
      Unsigned binaries using DNS in suspicious ways are a strong indicator of malicious
      tooling. Correlating DNS queries with outbound connections (Sysmon 3) helps confirm
      broader C2 staging beyond DNS alone.
    answer_sources:
      - "Windows Sysmon Event ID 22"
      - "Windows Sysmon Event ID 1"
      - "Windows Sysmon Event ID 3"
      - "Zeek dns.log"
      - "NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Linux servers, macOS endpoints, ESXi management networks"
    range: "last 90 days"
    queries:
      - "Sysmon: flag EventID 22 from unsigned/untrusted processes; check for high-entropy domains or periodic querying"
      - "Sysmon: join to EventID 3 for concurrent outbound connections to non-standard ports"

  - question: >
      Are there rare process-to-domain pairs that are first-ever for a host and also rare
      across the fleet, especially when the domain is low-prevalence in network DNS?
    context: >
      Rare process-domain pairings are strong outlier signals for endpoint-based DNS C2.
      Combining endpoint rarity with network-level low-prevalence domains improves precision
      and highlights likely compromises.
    answer_sources:
      - "Windows Sysmon Event ID 22"
      - "Windows Sysmon Event ID 1"
      - "Zeek dns.log"
      - "NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Linux servers, macOS endpoints, ESXi management networks"
    range: "last 90 days"
    queries:
      - "Sysmon: baseline (process image -> registered domain) pair frequency over 30d"
      - "Sysmon: flag first-ever pairing for host AND top 1% rarity across fleet; boost if domain low-prevalence in Zeek"

  - question: >
      Do endpoint DNS chains (parent lineage, command line, signer status, DNS features)
      match high-risk patterns indicative of DNS-based C2?
    context: >
      Combining process lineage with DNS telemetry provides context-rich signals. ML
      scoring of endpoint DNS chains can identify subtle but consistent patterns such as
      Office -> PowerShell -> periodic TXT queries to low-prevalence domains.
    answer_sources:
      - "Windows Sysmon Event ID 1"
      - "Windows Sysmon Event ID 22"
      - "Windows Sysmon Event ID 3"
      - "Zeek dns.log"
      - "NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Linux servers, macOS endpoints, ESXi management networks"
    range: "last 90 days"
    queries:
      - "ML: train model on Sysmon 1/22/3 features (lineage tokens, cmdline, signer, cadence, entropy, connection metadata)"
      - "ML: alert on high-risk chains; store score and top feature contributions"

  - question: >
      Are Linux hosts executing DNS utilities or tunneling-capable tools in ways that
      correlate with spikes in DNS activity from the same host IP?
    context: >
      On Linux, DNS tunneling often leverages common utilities or scripting languages.
      Auditing process execution and correlating with network DNS spikes provides strong
      host attribution for suspicious DNS activity.
    answer_sources:
      - "Linux auditd logs"
      - "Zeek dns.log"
      - "NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Linux servers, macOS endpoints, ESXi management networks"
    range: "last 90 days"
    queries:
      - "Auditd: execve for dig/nslookup/host/iodine/dnscat2/python/perl with long subdomain or TXT arguments"
      - "Zeek: correlate auditd host IP with dns.log spikes in same time window"

  - question: >
      Do macOS scripting environments generate DNS requests to domains that are high-entropy
      or low-prevalence in the network baseline?
    context: >
      Script-driven DNS requests on macOS can indicate malware or abusive tooling. Aligning
      unified log process context with network DNS risk scoring helps confirm suspicious
      activity and reduces noise from normal system services.
    answer_sources:
      - "macOS Unified Log"
      - "Zeek dns.log"
      - "NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Linux servers, macOS endpoints, ESXi management networks"
    range: "last 90 days"
    queries:
      - "macOS: search unified logs for dns_request events tied to osascript/AppleScript/shell/curl"
      - "Zeek: enrich domains with entropy/low-prevalence scores and flag matches"

  - question: >
      Are ESXi management-plane hosts generating outbound DNS queries to external or
      low-prevalence domains, or showing new periodic DNS behavior?
    context: >
      ESXi DNS behavior is typically limited and stable. New outbound DNS destinations or
      beacon-like patterns are strong indicators of compromise on virtualization hosts and
      warrant immediate investigation.
    answer_sources:
      - "ESXi syslog (/var/log/syslog.log)"
      - "Zeek dns.log"
      - "NAI: Endpoint Devices (Workstations and Servers), Domain Controllers, Linux servers, macOS endpoints, ESXi management networks"
    range: "last 90 days"
    queries:
      - "ESXi: baseline outbound DNS destinations and volumes; flag new external or low-prevalence domains"
      - "Zeek: confirm periodic DNS patterns from ESXi host IPs"
