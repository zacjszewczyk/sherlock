  range: Last 90 days
  queries:
  - technology: ML pipeline pseudocode
    query: 'loss = autoencoder.reconstruction_loss(subdomain_string)

      if loss>threshold: explain = surrogate_tree(top_features)

      ALERT with loss, explain, sample_queries'
- question: Which host-domain pairs show sustained fixed-interval DNS cadence with low jitter consistent
