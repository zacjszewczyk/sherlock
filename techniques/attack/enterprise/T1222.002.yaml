questions:
- question: '[Defense Impairment] Detect suspicious chmod/chown invocations on sensitive paths: Can you
    determine whether chmod or chown activity applies risky permission or ownership changes such as world-writable
    bits, recursive `-R`, mass `+x`, or ownership reassignment to untrusted principals on sensitive Linux
    or macOS paths, consistent with defense-evasion permission tampering. -- specifically, using the ''Detect
    suspicious chmod/chown invocations on sensitive paths'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies file/directory
    permissions, ownership, or attributes on Linux or macOS to evade access control lists, reach protected
    files, block remediation, or hide persistence, leaving traces in process-execution, syscall, file-metadata,
    and audit telemetry. This addresses the information requirement: Is an adversary attempting to evade
    defenses by modifying file or directory permissions on Linux or macOS systems? (PIR) This evidence
    focuses on the condition that chmod or chown activity applies risky permission or ownership changes
    such as world-writable bits, recursive `-R`, mass `+x`, or ownership reassignment to untrusted principals
    on sensitive Linux or macOS paths, consistent with defense-evasion permission tampering. This Symbolic
    Logic approach looks for the following signal: Using auditd EXECVE/SYSCALL, [osquery File Integrity
    Monitoring](https://osquery.readthedocs.io/en/stable/deployment/file-integrity-monitoring/), [Sysmon
    for Linux](https://github.com/Sysinternals/SysmonForLinux), or the Apple [Endpoint Security Framework](https://developer.apple.com/documentation/endpointsecurity),
    flag chmod/chown/chgrp/setfacl that set world-writable (`0777`, `o+w`), recursive `-R`, mass `+x`,
    or reassign ownership to non-root/service principals on sensitive targets (`/etc`, `/usr/bin`, `/usr/sbin`,
    web roots, service configs, `~/.ssh`), consistent with the tradecraft in [MITRE ATT&CK T1222.002](https://attack.mitre.org/techniques/T1222/002/).
    Escalate when launched by an unexpected parent (shell, interpreter, web service), a remote/SSH session,
    or a non-admin identity on a protected host. A positive result -- a rule match, statistical outlier,
    or model alert -- suggests a principal on the host is altering permissions/ownership/attributes in
    a way that deviates from sanctioned administration and hardening workflows; pivot to the responsible
    process, its parent lineage, the acting user/identity, the targeted paths and their criticality, the
    success/failure state of the change, and any subsequent file access, process execution, service disruption,
    or outbound network activity. A negative result helps rule out this permission-tampering vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-volume, or living-off-the-land permission changes.'
  answer_sources: &id001
  - Linux auditd EXECVE records
  - Linux auditd SYSCALL/PATH records
  - macOS Unified Logs
  - OpenBSM audit logs
  - 'NAI: Crown jewel servers (e.g., authentication, database, code repositories), web servers, developer
    endpoints, and shared file servers.'
