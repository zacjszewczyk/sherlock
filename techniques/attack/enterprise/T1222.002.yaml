name: 'T1222.002: File and Directory Permissions Modification: Linux and Mac Permissions'
id: f2970bb6-a140-4c1b-8daf-ba37ff73dd69
description: 'This playbook helps an analyst investigate whether an adversary is modifying file or directory
  permissions, ownership, or attributes on Linux and macOS systems to evade access controls, access protected
  files, prevent remediation, or hide persistence as part of the Defense Impairment tactic. It guides
  the hunt across three behavioral angles drawn from the underlying telemetry: (1) suspicious chmod/chown/chgrp/setfacl
  invocations that apply risky permission or ownership changes -- world-writable bits (0777, o+w), recursive
  -R, mass +x, or ownership reassignment to untrusted principals -- on sensitive paths such as /etc, /usr/bin,
  /usr/sbin, web roots, service configs, and ~/.ssh, including failed/blocked attempts (EPERM/EACCES)
  and tampering with security-control binaries (EDR, auditd, rsyslog, PAM, sshd, backup agents); (2) chattr
  immutable (+i) or append-only (+a) attribute changes on system binaries, configs, scripts, and logs
  that thwart remediation or conceal persistence, corroborated by downstream rm/open/unlink failures;
  and (3) high-volume bursts of permission or ownership syscalls (chmod, fchmodat, chown, setxattr) by
  a single process across many files in seconds, concentrated on one critical directory tree, consistent
  with scripted mass tampering. Detection methods combine symbolic-logic rules, robust statistical baselining
  (Modified Z-Score with median+MAD, Gini/Herfindahl concentration, syscall n-gram self-profiles), and
  machine-learning models (Isolation Forest / One-Class SVM, command-sequence transformers, log-sequence
  models such as DeepLog, and provenance-graph models such as KAIROS, ThreaTrace, and MAGIC) applied to
  Linux auditd EXECVE/SYSCALL/PATH records, osquery/Sysmon-for-Linux process telemetry, macOS Unified
  Logs, fsevents, OpenBSM audit logs, and Zeek conn.log, so the analyst can corroborate suspected permission
  tampering against process lineage, target criticality, success/failure state, volume, and surrounding
  host and network context.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
