      5156/4688 against a threat-intelligence list of malicious malvertising IPs/domains/URLs and raise
      an alert for any match; blacklist matching is the deterministic first-party baseline catalogued
      in Malicious URL Det

      | correlate over NAI: User Workstations, Internet Gateway, Internal DNS Resolvers

      | emit alert with contributing fields and entity context (browser process, child process, user,
      host, ad referer, redirect chain, dest domain/NRD, file hash, bytes)'
  - technology: Zeek/pseudocode
    query: '# Match malvertising IOC traffic (Zeek view)

      watch dns.log/conn.log/http.log/files.log for ad-network referers and malvertising IOCs

      | filter referer in ad_networks OR domain/ip/url in malvertising_intel OR final-hop is NRD/low-reputation

      | evaluate redirect-chain length, NRD/NXDOMAIN ratio, file prevalence/entropy, query-string entropy

      | emit candidate malvertising events with host, dest, redirect chain, file hash'
