name: 'T1583.008: Malvertising'
id: 0b294c86-6bc3-480a-8ba4-24565f402437
description: 'This playbook helps an analyst investigate evidence that an adversary is leveraging malvertising
  infrastructure (MITRE ATT&CK T1583.008, Malvertising) against the environment or its users -- that is,
  purchasing online advertisements to distribute malware, position trojanized software prominently in
  search results, impersonate trusted brands, and route victims through ad-network redirect chains to
  newly registered or low-reputation malicious landing pages. Because much of the adversary''s setup happens
  outside the organization''s visibility, this playbook focuses detection on the observable interaction
  points: direct network connections or DNS queries from internal hosts to threat-intel-flagged malvertising
  IPs/domains/URLs (Zeek conn/dns/http plus Windows Event IDs 5156/4688); long HTTP 30x redirect chains
  originating at known ad networks and terminating on newly registered or poorly-rated domains; rare,
  high-entropy files downloaded via ad-network referers and written to disk; browsers spawning scripting-engine
  children (powershell, wscript, mshta, cmd) shortly after contacting malvertising infrastructure; and
  enterprise-wide surges in newly-registered-domain DNS resolutions correlated with ad-network web traffic.
  Detection methods combine deterministic symbolic-logic rules (threat-intel/IOC matching, redirect-chain
  signatures, ad-referer-to-download correlation, browser-child process correlation, NRD-after-ad correlation),
  statistical baselining (per-IOC contact frequency, blocked/failed connection rates, redirect-entropy
  and chain-length baselining, file prevalence/entropy, NXDOMAIN/failed-resolution and NRD-volume baselining,
  command-line entropy), and machine learning (SARIMA/Isolation Forest time-series anomaly detection on
  IOC and download volume, gradient-boosting/random-forest classification of redirect chains and browser-child
  launches, URLNet deep-learning scoring of landing URLs, and passive-DNS behavioral NRD classification),
  applied across Zeek dns/conn/http/files logs and Windows Security and Sysmon events, so the analyst
  can corroborate suspected malvertising exposure against process lineage, file activity, redirect structure,
  domain reputation, and traffic volume.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
