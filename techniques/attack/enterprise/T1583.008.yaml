questions:
- question: '[Resource Development] Match malvertising IOC traffic: Can you determine whether A direct
    network connection or DNS query from an internal host to a domain, IP address, or URL found on a high-confidence
    threat intelligence feed specifically categorized as malvertising infrastructure, with Windows Event
    ID 5156 confirming the connection and Event ID 4688 revealing the initiating process. -- specifically,
    using the ''Match malvertising IOC traffic'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), the adversary is establishing
    resources to support later operations -- here, purchasing and abusing online advertising (malvertising)
    infrastructure to distribute malware, favorably position malicious artifacts in search results, impersonate
    trusted brands, and funnel victims through ad-network redirect chains to newly registered or low-reputation
    malicious landing pages. This evidence focuses on the condition that A direct network connection or
    DNS query from an internal host to a domain, IP address, or URL found on a high-confidence threat
    intelligence feed specifically categorized as malvertising infrastructure, with Windows Event ID 5156
    confirming the connection and Event ID 4688 revealing the initiating process. This Symbolic Logic
    approach works as follows: Continuously join Zeek conn.log, dns.log, and http.log records with Windows
    Event IDs 5156/4688 against a threat-intelligence list of malicious malvertising IPs/domains/URLs
    and raise an alert for any match; blacklist matching is the deterministic first-party baseline catalogued
    in Malicious URL Detection using Machine Learning: A Survey. Keep this hard rule even as ML is layered
    in parallel. A positive result -- a rule match, statistical outlier, or model alert -- indicates probable
    interaction with adversary malvertising infrastructure or a malvertising-delivered payload; pivot
    to the initiating browser process and its child processes (Event ID 4688/Sysmon 1), the user and host,
    the ad-network referer and full redirect chain, the resolved domains and their registration age/reputation,
    any files written to disk and their prevalence/entropy, and the byte volume and timing of the activity
    to scope the exposure. A negative result helps rule out this particular malvertising vector but should
    be corroborated with the other questions in this playbook, since a single method can miss cloaked,
    dynamically-routed, or low-and-slow malvertising that evades any one signal. Source citations for
    this method: [Malicious URL Detection using Machine Learning: A Survey](https://arxiv.org/abs/1701.07179).'
