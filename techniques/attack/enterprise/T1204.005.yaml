  - technology: SIEM/Rule pseudocode
    query: '# Detect package install tooling followed by suspicious execution and egress

      source IN [Windows Event ID 4688, Windows Event ID 4624, Zeek conn.log, Zeek dns.log, Zeek http.log,
      Zeek ssl.log]

      | WHERE matches_action_criteria("Detect package install tooling followed by suspicious execution
      and egress")

      // Identify process executions of package managers and build tooling (Event ID 4688 / Sysmon EID
      1 / auditd execve), such as pip/pip3/`python -

      | ALERT enrich(host, user, package, process, parent, file, dest)'
  - technology: Zeek/pseudocode
    query: '# malicious-library install/execute network correlation

      conn.log, dns.log, http.log, ssl.log

      | JOIN install/interpreter host/process to outbound flows on (id.orig_h, time-window)

