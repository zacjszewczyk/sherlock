questions:
- question: '[Execution] Detect package install tooling followed by suspicious execution and egress: Can
    you determine whether a package installation event occurs via a language package manager (e.g., pip,
    npm) or a developer workflow, followed shortly by execution of interpreter or build tooling (e.g.,
    python.exe, node.exe) that initiates unexpected outbound network connections or spawns suspicious
    child processes, consistent with a malicious install script or import-time execution. -- specifically,
    using the ''Detect package install tooling followed by suspicious execution and egress'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary relies on a user or automated
    build process installing a malicious library from a package manager or code repository so that adversary-controlled
    code runs at install time (lifecycle hooks) or first import, frequently leading to persistence, credential
    theft, or cryptomining. This evidence focuses on the condition that a package installation event occurs
    via a language package manager (e.g., pip, npm) or a developer workflow, followed shortly by execution
    of interpreter or build tooling (e.g., python.exe, node.exe) that initiates unexpected outbound network
    connections or spawns suspicious child processes, consistent with a malicious install script or import-time
    execution. This Symbolic Logic approach looks for the following signal: Identify process executions
    of package managers and build tooling (Event ID 4688 / Sysmon EID 1 / auditd execve), such as pip/pip3/`python
    -m pip`, npm/yarn/pnpm, node-gyp, gem, brew, or msbuild/gradle invoking node/python, and git clone
    of dependencies. Most malicious-package payloads fire at install time via lifecycle hooks (npm pre/postinstall,
    Python setup.py) or first import, so correlate within a 60-300s window to subsequent interpreter executions
    (python.exe/node.exe) and flag if they (a) spawn LOLBins (cmd.exe/powershell.exe/wscript.exe/cscript.exe/rundll32.exe/regsvr32.exe/mshta.exe)
    or (b) initiate >=1 new outbound connection (Zeek conn.log + dns/http/ssl) to a destination not in
    this host''s 30-day baseline. Derive the window per environment from observed benign install->test
    latency ([Backstabber''s Knife Collection](https://arxiv.org/abs/2005.09535); [Towards Measuring Supply
    Chain Attacks (MalOSS)](https://arxiv.org/abs/2002.01139)). A positive result -- a rule match, statistical
    outlier, or model alert -- suggests that a freshly installed or updated dependency executed adversary
    code on the host; pivot to the responsible package and version, the installing user/process and parent
    lineage, the host role (developer workstation vs CI/CD runner), the dependency directory touched,
    any secrets read, and the outbound destinations contacted. A negative result helps rule out this malicious-library
    vector for the window examined but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, delayed, or low-volume supply-chain payloads.'
