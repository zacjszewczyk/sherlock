name: 'T1204.005: Malicious Library'
id: 66d684fb-947d-4c77-80a5-c87301764331
description: 'This playbook helps an analyst investigate whether a user or an automated build process
  installed and executed a malicious software library (T1204.005) pulled from a language package manager
  (pip/PyPI, npm, gem, Homebrew) or a public code repository, resulting in adversary-controlled code execution
  under the Execution tactic. It guides the hunt across several behavioral angles spanning Windows, Linux,
  and macOS developer endpoints, CI/CD runners, and build servers: package-manager and build-tool process
  executions (pip/pip3, npm/yarn/pnpm, node-gyp, gem, brew, msbuild/gradle, git clone) followed within
  a tight time window by interpreter execution (python.exe/node.exe), suspicious LOLBin child processes,
  or first-seen outbound connections consistent with npm pre/postinstall hooks, Python setup.py, or import-time
  payloads; install-time payload signatures in fetched dependency content (os.system, subprocess, eval/exec,
  base64 decode, socket/requests in setup.py or postinstall); anomalous outbound access to package registries
  and code hosts (unapproved or typosquatted/lookalike domains, non-standard mirrors, CI runners bypassing
  internal mirrors, DNS NXDOMAIN/HTTP 404 bursts indicative of dependency confusion); interpreter access
  to dependency directories (site-packages, node_modules, virtualenvs) immediately preceding egress; suspicious
  build process trees spawning scripting hosts and system utilities (powershell, cmd, certutil, rundll32,
  regsvr32, mshta, wscript/cscript); and credential/data access to secret-bearing paths (~/.ssh, ~/.aws,
  .env files, browser credential stores, environment dumps) shortly after install, followed by exfiltration-like
  outbound transfers. Detection methods combine symbolic-logic rules, statistical baselining, and machine-learning
  models applied to Windows Security Event Logs (4688/4624/4663/4656), Sysmon, auditd, macOS unified logs,
  and Zeek conn/dns/http/ssl telemetry, so the analyst can corroborate suspected malicious-library execution
  against process lineage, install->execute timing, dependency-directory access, registry destinations,
  and exfiltration context.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
