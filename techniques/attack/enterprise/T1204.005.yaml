    vs CI/CD runner), the dependency directory touched, any secrets read, and the outbound destinations
    contacted. A negative result helps rule out this malicious-library vector for the window examined
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, delayed, or low-volume supply-chain payloads.'
  answer_sources: *id005
  range: Last 90 days (train on 30-90 day history; score rolling windows)
  queries:
  - technology: SIEM/ML pseudocode
    query: '# Detect exfiltration-like sequences after secret access

      source IN [Windows Event ID 4663, Windows Event ID 4656, Windows Event ID 4688, Zeek conn.log, Zeek
      dns.log, Zeek ssl.log]

      | FEATURIZE events (tool/process/parent/cmd/file/dependency/flow features)

      | SCORE model.predict(features)

      // Model sequences combining (a) package install/execution, (b) sensitive-file reads, and (c) outbound
      connections, with features for read volu

      | WHERE score > threshold | ALERT with top-3 feature attribution'
  - technology: Zeek/pseudocode
    query: '# malicious-library install/execute network correlation

      conn.log, dns.log, http.log, ssl.log

      | JOIN install/interpreter host/process to outbound flows on (id.orig_h, time-window)

      | AGG dest novelty, registry allowlist match, NXDOMAIN/404 rate, orig_bytes, JA4/SNI per (id.orig_h)

      | flag unapproved-registry / typosquat / first-seen egress from package installers per action criteria'
