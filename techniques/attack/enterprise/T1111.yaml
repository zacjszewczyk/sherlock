- question: 'Can you determine, using deterministic rule logic, whether ''JA3/JA4/User-Agent IOC matching''
    reveals multi-factor authentication interception activity? Specifically: Match Zeek ssl/http logs
    at the authentication portal against known AiTM fingerprints using [JA3/JA3S, Salesforce](https://github.com/salesforce/ja3)
    and the GREASE-resilient [JA4+/JA4H, FoxIO](https://github.com/FoxIO-LLC/ja4); alert when a client
    claims a mainstream browser User-Agent but presents a non-browser JA3/JA4 stack or an HTTP header
    order/case (JA4H) inconsistent with that browser, a hallmark of reverse-proxy phishing kits relaying
    the login flow.'
  context: 'Tactic context (Credential Access): the adversary is trying to steal account names, passwords,
    and authentication factors. T1111 covers interception or bypass of MFA — keylogging smart-card PINs
    and OTP/SecurID input, AiTM reverse-proxy phishing that relays the login and steals session tokens,
    MFA fatigue/push-bombing, and reuse of stolen tokens. Evidence under investigation: Observed network
    traffic to an authentication portal exhibits client-side artifacts, such as specific User-Agent strings
    or TLS JA3/JA3S hashes, that are known fingerprints of AiTM phishing toolkits like Evilginx2 or Modlishka.
    Approach (JA3/JA4/User-Agent IOC matching): Match Zeek ssl/http logs at the authentication portal
    against known AiTM fingerprints using [JA3/JA3S, Salesforce](https://github.com/salesforce/ja3) and
    the GREASE-resilient [JA4+/JA4H, FoxIO](https://github.com/FoxIO-LLC/ja4); alert when a client claims
    a mainstream browser User-Agent but presents a non-browser JA3/JA4 stack or an HTTP header order/case
    (JA4H) inconsistent with that browser, a hallmark of reverse-proxy phishing kits relaying the login
    flow. A positive result indicates likely MFA interception or bypass against the affected user/host;
    a negative result means observed activity matches expected baselines. Pivot from any hit to the affected
    account, source host/IP, authentication context, and any downstream persistence (new MFA device, forwarding
    rules) or lateral movement.'
  answer_sources:
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet gateway network sensors and web proxies'
