questions:
- question: 'Can you determine, using deterministic rule logic, whether ''Threat intel correlation on
    AiTM domains'' reveals multi-factor authentication interception activity? Specifically: Alert when
    Zeek conn/dns/http/ssl data matches high-confidence AiTM phishing domains, IPs, or certificates (e.g.,
    look-alike SSO domains and harvesting infrastructure from [Detecting Scatter Swine, Okta](https://sec.okta.com/scatterswine)
    and live MITM toolkit IOCs in [Catching Transparent Phish, Kondracki et al.](https://catching-transparent-phish.github.io/));
    preserve the destination host and the authentication context (user, portal, timestamp). Treat any
    hit within +/-2 minutes of an SSO sign-in as high severity.'
  context: 'Tactic context (Credential Access): the adversary is trying to steal account names, passwords,
    and authentication factors. T1111 covers interception or bypass of MFA — keylogging smart-card PINs
    and OTP/SecurID input, AiTM reverse-proxy phishing that relays the login and steals session tokens,
    MFA fatigue/push-bombing, and reuse of stolen tokens. Evidence under investigation: An endpoint initiates
    a connection to a domain or IP address that is a confirmed Adversary-in-the-Middle (AiTM) phishing
    infrastructure indicator of compromise, often immediately before or during an authentication attempt.
    Approach (Threat intel correlation on AiTM domains): Alert when Zeek conn/dns/http/ssl data matches
    high-confidence AiTM phishing domains, IPs, or certificates (e.g., look-alike SSO domains and harvesting
    infrastructure from [Detecting Scatter Swine, Okta](https://sec.okta.com/scatterswine) and live MITM
    toolkit IOCs in [Catching Transparent Phish, Kondracki et al.](https://catching-transparent-phish.github.io/));
    preserve the destination host and the authentication context (user, portal, timestamp). Treat any
    hit within +/-2 minutes of an SSO sign-in as high severity. A positive result indicates likely MFA
    interception or bypass against the affected user/host; a negative result means observed activity matches
    expected baselines. Pivot from any hit to the affected account, source host/IP, authentication context,
    and any downstream persistence (new MFA device, forwarding rules) or lateral movement.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Zeek ssl.log
  - 'NAI: Internet gateway network sensors, DNS resolvers, and web proxies'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Threat-intel correlation on AiTM phishing infrastructure\nLOAD aitm_iocs = feed(domains,\
      \ ips, ja3, cert_hashes)  // Okta ScatterSwine, MITM-toolkit IOCs\nMATCH zeek.conn|dns|http|ssl\
      \ WHERE\n  dest_host IN aitm_iocs.domains OR dest_ip IN aitm_iocs.ips\n  OR ssl.cert_hash IN aitm_iocs.certs\n\
      JOIN sso_signin s ON src_ip WHERE abs(conn.ts - s.ts) <= 120s\nTHEN alert(severity='high', enrich=[user,\
      \ portal, dest_host, ts])"
