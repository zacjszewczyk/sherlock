  queries:
  - technology: Zeek/pseudocode
    query: "// Browser UA claim vs non-browser TLS/HTTP fingerprint (reverse-proxy kit)\nMATCH zeek.ssl\
      \ JOIN zeek.http ON uid AT auth_portal\nIF http.user_agent CLAIMS mainstream_browser\n   AND (ssl.ja3/ja4\
      \ IN known_aitm_fp\n        OR ssl.ja3/ja4 NOT IN browser_fp_for(user_agent)\n        OR ja4h_header_order\
