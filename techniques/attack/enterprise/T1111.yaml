name: 'T1111: Multi-Factor Authentication Interception'
id: 17f17dbc-37ee-4237-86b5-358b8d54d4b4
description: 'This playbook helps an analyst determine whether an adversary is intercepting or bypassing
  multi-factor authentication (MFA) to obtain credentialed access (T1111). It guides investigation across
  the full MFA-interception kill chain: network-side detection of Adversary-in-the-Middle (AiTM) reverse-proxy
  phishing infrastructure (Evilginx2/Modlishka-style kits) via threat-intel correlation, newly-registered/rare-domain
  profiling, TLS/HTTP client fingerprinting (JA3/JA4/JA4H, User-Agent), relay round-trip-time anomalies,
  and decryption-free flow classification; endpoint detection of keyloggers and credential/token theft
  tools that capture smart-card PINs, RSA SecurID/OTP input, or browser session cookies; and identity-side
  detection of MFA fatigue/push-bombing bursts, authenticator downgrade to weaker fallback factors, post-login
  persistence actions (new MFA-device registration, inbox forwarding rules), and impossible-travel/concurrent-session
  reuse indicative of stolen tokens. Detection blends symbolic-logic rules, statistical baselining (entropy,
  percentiles, Mahalanobis distance, RTT deviation), and machine learning (PHOCA-style AiTM classifiers,
  LSTM header-sequence models, explainable ensemble keylogger detection, time-series and DBSCAN anomaly
  detection) to produce evasion-resistant, explainable alerts for the Credential Access tactic.'
type: technique
