- question: 'Can you determine, using deterministic rule logic, whether ''IOC matching on credential theft
    and keylogging behavior'' reveals multi-factor authentication interception activity? Specifically:
    Alert on process creations matching credential-dumping or browser-token-theft signatures and suspicious
    parent-child relationships, and on keylogging artifacts — `SetWindowsHookEx`/`GetAsyncKeyState` polling,
    raw `/dev/input` reads, or driver loads — that capture smart-card PINs or OTP/SecurID input per [The
    Evolution of Keylogger Technologies, Ahmed et al.](https://arxiv.org/abs/2312.10445); enrich with
    command line and signer. Also alert on unauthorized modification of authentication-portal pages/files
    (web-inject keylogging) per [Virtual Private Keylogging, Volexity](https://www.volexity.com/blog/2015/10/07/virtual-private-keylogging-cisco-web-vpns-leveraged-for-access-and-persistence/).'
