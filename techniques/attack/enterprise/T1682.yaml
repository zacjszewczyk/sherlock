name: 'T1682: Query Public AI Services'
id: 24b18556-0884-4563-9743-d51e287f0601
description: >-
  Investigate whether an adversary is querying publicly accessible AI services (such as LLM web applications
  or API endpoints) to support reconnaissance and targeting against the organization, its personnel, or
  its infrastructure. This playbook helps an analyst hunt across DNS, HTTP, TLS, and web proxy telemetry
  for hosts or users contacting public AI services where flows carry organizational terms, hostnames,
  IP ranges, employee names, or document titles, or show iterative prompt/upload behavior. It treats each
  AI query as a potential information-aggregation/upload channel and measures Volume (bytes uploaded),
  Frequency (requests/min), and State (HTTP 200 vs 429/401/403 and proxy-blocked). Detection methods range
  from deterministic allowlist matching and client fingerprinting, through statistical baselining of query
  intensity and information-content ranking, to machine-learning clustering and sequence modeling of reconnaissance
  AI sessions. Because much of this activity occurs outside the visibility of the target, focus on egress
  points, browser workstations, and high-value endpoints with access to sensitive data.
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any hosts, servers, or service accounts contacting public AI service destinations (LLM
    web apps or API endpoints) that fall outside your curated sanctioned-AI allowlist, and do those flows
    carry internal hostnames, employee names, project codenames, or oversized POST uploads?
  context: Maintain a curated list of public AI service domains, TLS SNI values, and CIDRs, then alert
    on contact from any host not on the sanctioned-AI allowlist by joining DNS (Zeek dns.log), TLS SNI
    and validation_status (Zeek ssl.log), HTTP, and web proxy logs. Hard-fire when AI contact originates
    from servers or service accounts that should never browse, or when a single POST exceeds 1 MB. Keyword/payload
    rules for internal hostnames, employee names, or project codenames are justified by documented adversary
    use of LLMs for organization, personnel, and technology research during Reconnaissance. A positive
    result is a non-sanctioned AI contact, especially from a non-browsing identity; a negative result
    is contact confined to allowlisted services from expected hosts.
  answer_sources: &id001
  - DNS query logs (Zeek dns.log)
  - HTTP logs (Zeek http.log)
  - TLS logs (Zeek ssl.log)
  - Web proxy logs
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - 'NAI: Corporate internet egress points, browser workstations, and high-value user endpoints with access
    to sensitive organizational information.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: >-
      ai_dest = (dns.query in AI_DOMAINS) OR (ssl.server_name in AI_SNI) OR (dst_ip in AI_CIDRS)

      join dns.log, ssl.log, http.log, proxy.log on host/session

      alert if ai_dest AND src_host NOT IN sanctioned_AI_allowlist

      hard_fire if ai_dest AND (src is server/service_account) OR (http.request_body_len > 1MB)

      flag if payload/uri/headers contain internal_hostnames|employee_names|project_codenames
- question: Which clients contacting public AI endpoints are scripted API/SDK callers rather than human
    browser sessions, and are any of them originating from non-developer endpoints?
  context: Extract client TLS/HTTP fingerprints to separate human browser sessions from scripted API/SDK
    clients hitting AI endpoints. Alert on non-browser JA3 or JA4/JA4H fingerprints, API user-agents (python-requests,
    Go-http-client, openai-python, anthropic), or programmatic request cadence contacting AI services,
    especially from endpoints that are not developer workstations. JA4/JA4H are preferred over JA3 because
    they resist GREASE/extension-shuffling evasion. In a Reconnaissance context, scripted automation against
    AI services suggests bulk information harvesting rather than ad-hoc interactive use; a positive result
    is a non-browser fingerprint or API user-agent from an unexpected host.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: >-
      for session where dst is AI_service:
        fp = JA4/JA4H(session)
        if fp NOT IN browser_fp_set OR user_agent IN {python-requests,Go-http-client,openai-python,anthropic}:
          alert(scripted_AI_client, src_host)
        if request_cadence is_periodic(src_host) AND src_host NOT IN developer_hosts:
          alert(programmatic_AI_access)
- question: Has any host made a first-ever or low-prevalence contact with a public AI service domain,
    or rotated across multiple distinct AI services within a short window?
  context: Flag first-seen or low-prevalence AI service domains per host using passive-DNS prevalence
    and dynamism scoring (EXPOSURE-style). Prioritize a workstation's first-ever contact with an AI endpoint
    and rotation across multiple distinct AI services in a short window, which can indicate an adversary
    probing several tools while researching the target. A positive result is novel AI-domain contact from
    a host with no prior AI history; a negative result is contact with long-established, frequently used
    services.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      compute per_host prevalence(domain) from passive_dns over 30d

      for ai_domain contact by host:
        if first_seen(host, ai_domain) OR prevalence < low_threshold:
          score_up(host, ai_domain)
        if count_distinct(ai_domains by host in 1h) >= N:
          alert(AI_service_rotation, host)
- question: Which users or hosts show AI query intensity (request count, session duration, request size,
    upload bytes, unique AI destinations) far above their own historical baseline or above their department
    peer group?
  context: Build per-user and per-host baselines for request count, session duration, request size, upload
    bytes, and unique AI destinations over a 30-day window; flag deviations above the 95th percentile
    or 3 MAD/robust-z, and compare each user against department peer groups so a user querying AI far
    above peers is surfaced (UEBA approach). Treat AI queries as an upload channel and apply the volume/frequency/timing/entropy
    feature taxonomy of exfiltration detection. Derive thresholds from the organization's own egress baseline.
    In Reconnaissance, an outlier in AI query intensity may be an adversary or insider aggregating organizational
    information at scale.
  answer_sources: *id001
  range: Last 90 days (30-day baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline[user] = rolling_30d(req_count, session_dur, req_size, upload_bytes, distinct_ai_dst)

      for user in window:
        z = robust_z(metric, baseline[user])
        peer = dept_peer_group(user)
        if metric > p95(baseline[user]) OR z > 3 OR metric > p95(peer):
          alert(AI_query_intensity_outlier, user)
- question: When ranking AI/SaaS destinations by information content (entropy times uploaded bytes) rather
    than raw request counts, which hosts are pushing disproportionate unique payload bytes consistent
    with low-and-slow bulk document submission?
  context: For low-and-slow bulk document submission, rank AI/SaaS destinations by information content
    (entropy x uploaded bytes) rather than raw request counts, so a host pushing disproportionate unique
    payload bytes is prioritized over trivial chat use. This counters adversaries who avoid high request
    volumes but still upload large, information-dense payloads (e.g., documents) to AI services. A positive
    result is a host ranking high on information content despite modest request counts.
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      for host, ai_dst in window:
        info_content = sum(entropy(payload) * uploaded_bytes)
      rank hosts by info_content desc

      alert top_k where info_content >> peer_median AND req_count low
- question: Are there surges in AI-egress error/state signals (HTTP 429 rate-limits, 401/403 auth/key
    churn, proxy-blocked counts) or an inverted byte ratio (large upload, small download) indicating automation
    rather than interactive chat?
  context: 'Explicitly baseline and alert on error/state surges that indicate automation rather than interactive
    chat: spikes in HTTP 429 (rate-limit), 401/403 (auth/key churn), proxy-blocked counts, and an inverted
    byte ratio (large upload, small download). These state/volume features are core exfiltration discriminators;
    derive failure-rate thresholds per environment. In Reconnaissance, scripted harvesting tends to trigger
    rate-limits and auth failures as keys are rotated, and pushes more bytes up than it pulls down. A
    positive result is an anomalous failure/state surge or inverted byte ratio against an AI destination.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: >-
      baseline failure_rate per host/dst over 30d

      for host, ai_dst:
        rate429 = count(status=429)/total
        rate_auth = count(status in {401,403})/total
        blocked = proxy_blocked_count
        byte_ratio = upload_bytes / max(download_bytes,1)
        if rate429 > thr OR rate_auth > thr OR blocked > thr OR byte_ratio > thr:
          alert(AI_automation_state_signal, host, ai_dst)
- question: Can AI-egress sessions be clustered and sequenced (file access -> AI-service contact -> repeated
    prompts) to separate sanctioned use from iterative information-harvesting, including when SNI is encrypted
    (ECH) or destinations rotate?
  context: Cluster AI-egress sessions on cadence, destination, payload size, upload/download ratio, and
    host identity to separate sanctioned use from iterative information-harvesting; model the user's workflow
    as a sequence (file access -> AI-service contact -> repeated prompts) to detect harvesting patterns.
    Where SNI is encrypted (ECH) or destinations rotate, classify the AI application from flow metadata
    and detect anomalous sessions with label-free self-supervised flow/handshake models. Every alert must
    surface the top-3 contributing features (e.g., upload 8x baseline; first contact with domain; non-browser
    JA4) via SHAP/XAI. Keep the deterministic allowlist/fingerprint rules running in parallel as the detection
    floor. A positive result is a session clustered with harvesting behavior or a reconnaissance sequence
    preceding AI contact.
  answer_sources: *id001
  range: 'Last 90 days (event-centered: correlate file-access events preceding AI contact)'
  queries:
  - technology: ML/pseudocode
    query: >-
      features = [cadence, dst, payload_size, up_down_ratio, host_id]

      clusters = cluster(sessions, features)

      flag clusters matching harvesting_profile

      seq_model: detect pattern(file_access -> ai_contact -> repeated_prompts)

      if ECH/SNI_encrypted: classify_app_from_flow_metadata(session)

      anomaly = self_supervised_flow_model(session)

      emit alert with top3 SHAP features
