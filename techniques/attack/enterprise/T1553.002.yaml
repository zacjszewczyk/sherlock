name: 'T1553.002: Subvert Trust Controls: Code Signing'
id: 271af3a1-4c65-40c6-bd9a-36d58e5966b6
description: 'This playbook helps an analyst investigate whether an adversary is abusing code signing
  -- by creating, acquiring, or stealing code-signing certificates to apply a VALID signature to malware,
  drivers, or tooling -- in order to bypass execution and trust controls and impair defenses on Windows
  and macOS endpoints. Unlike an invalid-signature forgery, this activity produces a genuinely valid signature,
  so the hunt centers on signer trust and context rather than signature validity alone. It guides the
  analyst across several angles: matching executed binaries and certificate thumbprints against threat
  intel for known-malicious hashes and revoked/stolen/BYOVD signers; treating signature failure-states
  (revoked, expired, broken chain) that still execute as high-signal; enforcing allow-lists of approved
  CA Issuers and flagging Subjects that mimic trusted publishers via Jaro-Winkler/Damerau-Levenshtein
  similarity; alerting on self-signed and freshly minted certificates; detecting signed binaries launched
  from user-writable directories; correlating a signed process with suspicious follow-on actions (unsigned
  child, persistence registry writes, high-entropy/newly-registered domain callbacks) within a short window;
  spotting coordinated or near-synchronized mass execution of a non-allow-listed signed hash; and, on
  macOS, catching codesign/spctl/notarization (stapler) failures that still execute and low-prevalence
  Developer Team IDs. Detection methods combine symbolic-logic rules, statistical baselining (modified
  z-score/MAD prevalence and age outliers, timestamp dispersion), and machine learning (supervised classifiers,
  Isolation Forest, provenance/graph models, DBSCAN, API-sequence models) with SHAP feature attribution,
  applied to Windows Security/Sysmon events (4688, EID 1/3/7/11/13/22), Code Integrity events (3002/3004),
  Zeek files/dns logs, and macOS unified-log/ESF code-signing telemetry, so the analyst can corroborate
  suspected code-signing abuse against certificate identity, prevalence, execution context, and downstream
  behavior.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
