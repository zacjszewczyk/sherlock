questions:
- question: '[Defense Impairment] Ingest high-confidence threat intel for malicious hashes and revoked/stolen
    certificate thumbprints: Can you determine whether a process executes from a binary whose file hash
    (e.g., SHA256) or certificate thumbprint is present on a high-confidence threat intelligence feed
    of known malicious indicators. -- specifically, using the ''Ingest high-confidence threat intel for
    malicious hashes and revoked/stolen certificate thumbprints'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary creates, acquires,
    or steals code-signing materials so that malware, drivers, or tooling carry a valid digital signature
    and pass execution and trust controls (Gatekeeper, WDAC/Code Integrity, AppLocker, driver signature
    enforcement) -- letting malicious code masquerade as authentic, trusted software and undermining defenders''
    ability to detect it. This directly answers the information requirement: Is the adversary leveraging
    valid or malicious code signing certificates to bypass execution controls and evade defenses? (PIR)
    This evidence focuses on the condition that a process executes from a binary whose file hash (e.g.,
    SHA256) or certificate thumbprint is present on a high-confidence threat intelligence feed of known
    malicious indicators. This Symbolic Logic approach works as follows: Ingest high-confidence threat-intelligence
    feeds for malicious file hashes and compromised/revoked/stolen code-signing certificate thumbprints
    (including BYOVD signer hashes from [LOLDrivers](https://www.loldrivers.io/) and [Microsoft Recommended
    Driver Block Rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules)).
    Create a real-time rule to query all process creation events (Windows Event ID 4688, Sysmon Event
    ID 1), module loads (Sysmon Event ID 7), and file creation events (Zeek files.log) and generate a
    high-priority alert on any hash or thumbprint match. [Certified Malware (Kim et al., CCS 2017)](https://users.umiacs.umd.edu/~tdumitra/papers/CCS-2017.pdf)
    shows stolen/revoked certificates keep signing malware for years, so match on signer thumbprint as
    well as file hash. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable abuse of code signing to legitimize malicious code; pivot to the signed binary and its certificate
    (thumbprint, Issuer/Subject, validity window, revocation state), the executing host and user, the
    process lineage and any unsigned child payloads, the on-disk path, and any follow-on network or persistence
    activity, then check the signer''s enterprise prevalence and threat-intel reputation. A negative result
    helps rule out this particular code-signing abuse vector but should be corroborated with the other
    questions in this playbook, since a sophisticated actor wielding a stolen or freshly issued valid
    certificate can defeat any single detection method.'
