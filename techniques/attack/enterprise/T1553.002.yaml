- question: '[Defense Impairment] For every observed certificate thumbprint, calculate enterprise prevalence
    and compare to external intel: Can you determine whether a process executes from a binary whose file
    hash (e.g., SHA256) or certificate thumbprint is present on a high-confidence threat intelligence
    feed of known malicious indicators. -- specifically, using the ''For every observed certificate thumbprint,
    calculate enterprise prevalence and compare to external intel'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary creates, acquires,
