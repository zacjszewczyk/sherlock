questions:
- question: Has any process written an Info.plist to add or change the LSUIElement key to 1/true, causing
    an application to run in the background with no Dock or menu-bar presence, and was the writer something
    other than a trusted platform binary or notarized installer?
  context: 'Setting LSUIElement=1 hides an application from the Dock and menu bar, a common way adversaries
    run code invisibly to the user (Defense Impairment). Using first-party file-write telemetry (Endpoint
    Security Framework ES_EVENT_TYPE_NOTIFY_WRITE, or osquery file_events on /Applications/**/Contents/Info.plist
    and ~/Applications/**), alert whenever a write adds or changes LSUIElement to a truthy value. Raise
    severity when the writing process is NOT a platform binary or notarized installer/dev tool (not installer,
    softwareupdated, or Xcode). Treat as high-confidence if a host exceeds more than one LSUIElement flip
    per day, or any flip on an app the user launched interactively in the last 24h. This deterministic
    rule must remain even after ML is layered in. References: [Endpoint Security Framework, Apple](https://developer.apple.com/documentation/endpointsecurity),
    [File Integrity Monitoring, osquery](https://osquery.readthedocs.io/en/stable/deployment/file-integrity-monitoring/),
    [How Malware Persists on macOS, Stokes (SentinelOne)](https://www.sentinelone.com/blog/how-malware-persists-on-macos/),
    [Methods of Malware Persistence on Mac OS X, Wardle](https://www.virusbulletin.com/uploads/pdf/conference/vb2014/VB2014-Wardle.pdf).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically within application bundles (.app) located in /Applications/
    and ~/Applications/.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "file_event WHERE path MATCHES '/Applications/**/Contents/Info.plist' OR '~/Applications/**'\n\
      \  AND change ADDS_OR_SETS key 'LSUIElement' TO ('1' OR 'true')\n  AND writer.process NOT IN (installer,\
      \ softwareupdated, Xcode)\n  ALERT; severity++ IF host.lsuielement_flips_24h > 1 OR target_app.launched_interactively_24h"
- question: Which bundle IDs in the fleet are setting LSUIElement=1 with statistically rare or never-before-seen
    prevalence, indicating an app being newly hidden rather than a legitimate background/menu-bar agent?
  context: 'Many legitimate menu-bar/background agents ship LSUIElement=1, so raw alerting is noisy. Build
    an enterprise allowset of bundle IDs that legitimately use LSUIElement (fleet sweep with KnockKnock).
    For each modification compute prevalence = (#hosts with this bundleID setting LSUIElement)/(fleet)
    and flag bundle IDs in the bottom 1st percentile or never-before-seen. Pair with parent-prevalence
    scoring (CAR-2014-11-002, first-seen writer of an Info.plist). A rare bundle ID newly enabling background
    execution is suspicious in the context of defense evasion. References: [KnockKnock, Objective-See](https://github.com/objective-see/KnockKnock),
    [CAR-2014-11-002 Outlier Parents of Cmd, MITRE](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically within application bundles (.app) located in /Applications/
    and ~/Applications/.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "allowset = bundleIDs WHERE legitimately ship LSUIElement=1 (fleet KnockKnock sweep)\n  prevalence(bundleID)\
      \ = count(hosts setting LSUIElement)/fleet_size\n  FLAG bundleID WHERE prevalence < p01 OR first_seen\n\
      \  JOIN writer first-seen score (CAR-2014-11-002)"
- question: When the maliciousness classifier scores an Info.plist editor, which writes are flagged as
    high-risk and what are the top contributing features (e.g., unsigned writer, parent=Terminal, target
    user-writable) that justify analyst triage?
  context: 'Train a gradient-boosted classifier (ProblemChild-style) on writer features: process name,
    parent lineage, code-signing team ID/platform-binary flag, responsible UID, command line, and whether
    the target is user-writable. Output a maliciousness score and surface the top-3 contributing features
    so an analyst can triage quickly. Validate the false-positive rate against the legitimate-installer
    baseline. The deterministic LSUIElement rule must not be suppressed by the model. References: [ProblemChild,
    Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically within application bundles (.app) located in /Applications/
    and ~/Applications/.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "score = gbt_classify(features=[proc_name,parent_lineage,team_id,is_platform_binary,resp_uid,cmdline,target_user_writable])\n\
      \  ALERT WHERE score > threshold; EMIT top3_features\n  validate FP vs legitimate_installer_baseline;\
      \ DO NOT suppress deterministic rule"
- question: Does any newly created or modified .plist in key persistence directories contain Program,
    ProgramArguments, LSEnvironment, Label, or KeepAlive values that match internal threat-intelligence
    IOCs (malicious domains, IPs, paths, or argument patterns)?
  context: 'On every .plist create/modify in ~/Library/LaunchAgents, /Library/LaunchAgents, /Library/LaunchDaemons,
    and ~/Library/Preferences/com.apple.dock.plist (captured via ESF or osquery FIM), parse the persistence-relevant
    keys and match them against internal IOC feeds. Any exact match is a high-confidence detection of
    attacker tooling staging persistence to impair defenses. The file-path watch pattern mirrors the SigmaHQ
    MacOS Emond Launch Daemon rule. Keep exact IOC/string matches as a non-suppressible floor regardless
    of ML scoring. References: [Endpoint Security Framework, Apple](https://developer.apple.com/documentation/endpointsecurity),
    [File Integrity Monitoring, osquery](https://osquery.readthedocs.io/en/stable/deployment/file-integrity-monitoring/),
    [MacOS Emond Launch Daemon (Sigma), SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/macos/file_event/file_event_macos_emond_launch_daemon.yml).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically user and system-level LaunchAgent/LaunchDaemon directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "file_event WHERE path IN (~/Library/LaunchAgents, /Library/LaunchAgents, /Library/LaunchDaemons,\
      \ ~/Library/Preferences/com.apple.dock.plist)\n  parse keys [Program, ProgramArguments, LSEnvironment,\
      \ Label, KeepAlive]\n  ALERT IF any value IN threat_intel_iocs(domains, ips, paths, arg_patterns)"
- question: Which plists contain ProgramArguments/Program token n-grams that are statistically rare relative
    to the fleet baseline, or whose writer->plist->referenced-binary provenance path is low-prevalence?
  context: 'Tokenize ProgramArguments/Program values into bi/tri-grams and compare frequency against a
    fleet baseline of legitimate plists; flag plists containing n-grams below the 1st percentile of rarity.
    Reinforce with rare causal-path scoring (ProvDetector): score the (writer-process -> plist -> referenced-binary)
    path by TF-IDF rarity and flag low-prevalence paths. Rare content/provenance signals novel persistence
    tooling even without a known IOC. References: [ProvDetector, Wang et al.](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically user and system-level LaunchAgent/LaunchDaemon directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "ngrams = bigrams+trigrams(ProgramArguments, Program)\n  FLAG plist WHERE min(ngram_freq vs\
      \ fleet_baseline) < p01\n  provpath = (writer_proc -> plist -> referenced_binary); FLAG WHERE tfidf_rarity(provpath)\
      \ high"
- question: When a BERT-style text classifier scores plist string fields (ProgramArguments, Label, LSEnvironment),
    which plists exceed the calibrated maliciousness threshold, and what high-attribution tokens (e.g.,
    base64, an IP literal, a /tmp path) drive the score?
  context: 'Apply a LogBERT-style text model to plist string fields and alert when maliciousness probability
    exceeds a calibrated threshold (start at 0.85, then tune to your data). Emit the top-3 highest-attribution
    tokens in the alert for explainability. This catches obfuscated or novel malicious configuration content
    that escapes exact IOC matching while remaining explainable for analyst review. References: [LogBERT,
    Guo et al.](https://arxiv.org/abs/2103.04475).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically user and system-level LaunchAgent/LaunchDaemon directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "p = logbert_classify(fields=[ProgramArguments,Label,LSEnvironment])\n  ALERT WHERE p > 0.85\
      \ (tune); EMIT top3_attribution_tokens"
- question: For each new or modified plist, does the binary it references fail basic sanity checks - missing
    at the Program path, invalid code signature, or first execution producing failed/blocked outbound
    connections or NXDOMAIN responses?
  context: 'Failure-mode awareness: track State outcomes of the binary referenced by a new/modified plist
    - file-not-present at the Program path, code-signature-invalid, or first execution generating failed/blocked
    outbound connections or NXDOMAIN responses (as seen with RUSTBUCKET). A plist whose target produces
    these failure signals is high-suspicion even with no IOC match, because legitimate persistence references
    existing, signed binaries that connect successfully. References: [The DPRK strikes using a new variant
    of RUSTBUCKET, Elastic](https://www.elastic.co/security-labs/DPRK-strikes-using-a-new-variant-of-rustbucket).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically user and system-level LaunchAgent/LaunchDaemon directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR plist IN new_or_modified:\n  bin = resolve(plist.Program)\n  FLAG IF NOT exists(bin) OR\
      \ signature_invalid(bin)\n     OR first_run(bin) yields failed_conn OR NXDOMAIN"
- question: Does any modified plist's Program or ProgramArguments key reference an executable in a non-standard
    directory (/tmp, /var/tmp, /Users/Shared, ~/Downloads, ~/Documents, hidden dot-directories), or violate
    launchd ownership rules (user-writable or non-root-owned target for a LaunchDaemon)?
  context: 'Maintain a watchlist of non-standard executable directories and alert when a plist Program/ProgramArguments
    points there. Cross-check against the legitimate-LaunchDaemon baseline: per Apple guidance, daemons
    must be root-owned and reference system-owned paths, so flag user-writable or non-root-owned Program
    targets as ownership violations. Legitimate software runs from /Applications and system paths; persistence
    pointing at temp/user-shared/hidden locations strongly indicates malicious staging. References: [Methods
    of Malware Persistence on Mac OS X, Wardle](https://www.virusbulletin.com/uploads/pdf/conference/vb2014/VB2014-Wardle.pdf),
    [How Malware Persists on macOS, Stokes (SentinelOne)](https://www.sentinelone.com/blog/how-malware-persists-on-macos/),
    [Creating Launch Daemons and Agents, Apple](https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CreatingLaunchdJobs.html).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, focusing on file systems within user home directories and system-wide
    temporary locations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "watchdirs = [/tmp/, /var/tmp/, /Users/Shared/, ~/Downloads/, ~/Documents/, ~/.*]\n  ALERT\
      \ IF plist.Program OR plist.ProgramArguments[0] startswith any watchdir\n  ALERT IF plist is LaunchDaemon\
      \ AND (target NOT root_owned OR target user_writable)"
- question: Which plists reference executable parent directories in the bottom 5th percentile of fleet
    prevalence, and is any single host creating a burst (>3/hr) of such rare-directory plists indicating
    mass persistence?
  context: 'Build a fleet baseline of executable parent directories referenced in plists; for each new/modified
    plist compute directory prevalence and flag the bottom 5th percentile (KnockKnock-style sweep). Add
    a Volume metric: count distinct rare-directory plists created per host per hour - a burst (>3/hr)
    indicates mass persistence deployment. Rare directories combined with volume distinguish targeted
    persistence from normal admin activity. References: [KnockKnock, Objective-See](https://github.com/objective-see/KnockKnock).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, focusing on file systems within user home directories and system-wide
    temporary locations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "dir_prev(d) = count(plists referencing d)/total\n  FLAG plist WHERE dir_prev(parent_dir(Program))\
      \ < p05\n  Volume: COUNT distinct rare-dir plists per host per hour; ALERT IF > 3/hr"
- question: When a path classifier evaluates plist executable paths using features like directory depth,
    hidden status, user-space/tmp location, character entropy, and root-ownership, which new plist paths
    are labeled suspicious and what features drive the decision?
  context: 'Train a random forest (ProblemChild-style) on path features (directory depth, is_hidden, is_in_user_space,
    is_in_tmp, char-set entropy, is_root_owned) to classify new plist paths suspicious/benign, surfacing
    the top-3 features driving each decision. Keep the deterministic watchlist as a non-suppressible floor.
    This generalizes beyond a static directory list to catch novel anomalous paths used for persistence
    and defense evasion. References: [ProblemChild, Elastic](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, focusing on file systems within user home directories and system-wide
    temporary locations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "label = rf_classify(features=[depth,is_hidden,is_in_user_space,is_in_tmp,charset_entropy,is_root_owned])\n\
      \  ALERT WHERE label=suspicious; EMIT top3_features; keep watchlist as floor"
- question: Does any modified plist's ProgramArguments invoke a scripting interpreter (python, osascript,
    bash, zsh, perl) with suspicious flags (-c, -e) or download-execute tokens (curl, wget, base64), and
    was the change made by defaults write or plutil?
  context: 'Alert on any plist whose ProgramArguments invokes an interpreter with suspicious flags or
    download-execute tokens, and detect the modifying tool (defaults write, plutil) via ESF. Interpreter-driven
    launchd persistence with inline/obfuscated commands is real-world tradecraft (e.g., osascript-in-LaunchAgent
    in RUSTBUCKET). This identifies fileless or download-stage persistence that evades binary-focused
    detection. References: [Persistence via Login or Logout Hook, Elastic](https://detection.fyi/elastic/detection-rules/macos/persistence_login_logout_hooks_defaults/),
    [Endpoint Security Framework, Apple](https://developer.apple.com/documentation/endpointsecurity),
    [The DPRK strikes using a new variant of RUSTBUCKET, Elastic](https://www.elastic.co/security-labs/DPRK-strikes-using-a-new-variant-of-rustbucket).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically monitoring LaunchAgent and LaunchDaemon plist configurations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT IF plist.ProgramArguments[0] IN (python,osascript,bash,zsh,perl)\n     AND (args CONTAINS\
      \ ('-c' OR '-e') OR args CONTAINS (curl|wget|base64))\n  AND writer.process IN (defaults, plutil)"
- question: Which plist interpreter arguments exhibit Shannon entropy above the 95th percentile of a legitimate-script
    baseline or exceed a length threshold (>512 chars) characteristic of inline base64 payloads?
  context: 'Compute Shannon entropy of the script/argument string and flag values above the 95th percentile
    of a legitimate-script baseline. Add a Volume metric: flag arguments exceeding a length threshold
    (e.g., >512 chars, typical of inline base64 payloads) and count such plists per host. High entropy
    and excessive length indicate obfuscated or encoded payloads embedded in persistence configuration
    rather than normal command lines.'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically monitoring LaunchAgent and LaunchDaemon plist configurations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "e = shannon_entropy(join(ProgramArguments))\n  FLAG IF e > p95(legit_script_baseline) OR length(args)\
      \ > 512\n  COUNT such plists per host"
- question: When clustering plist script arguments by feature vector (length, entropy, char frequency,
    special-char count), which arguments fall into small/sparse outlier clusters separate from the dense
    benign cluster, and what features distinguish them?
  context: 'Cluster argument feature vectors with DBSCAN and investigate small/sparse clusters separate
    from the dense benign cluster; for each outlier report the top-3 distinguishing features. Complement
    with one-class modeling (Isolation Forest / One-Class SVM) where labeled malicious scripts are scarce.
    Unsupervised clustering surfaces novel obfuscated interpreter persistence that signature rules miss.
    References: [Robust IoT Security (Isolation Forest / One-Class SVM), Scientific Reports](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - macOS EDR File Modification Events
  - macOS EDR Process Creation Events
  - 'NAI: All managed macOS endpoints, specifically monitoring LaunchAgent and LaunchDaemon plist configurations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "vectors = featurize(args=[length,entropy,char_freq,special_char_count])\n  clusters = DBSCAN(vectors);\
      \ INVESTIGATE small/sparse clusters\n  EMIT top3_distinguishing_features; fallback IsolationForest/OneClassSVM"
- question: Is any process whose parent is launchd (PID 1) and whose executable path appears in a plist
    modified within the last hour connecting to a destination IP or domain that matches internal C2 threat
    intelligence?
  context: 'Join process launches whose parent is launchd (PID 1) to Zeek conn.log; if the executable
    path appears in a plist modified within the last hour (ESF file events), check the destination IP/domain
    against internal C2 threat intel and alert on match. This is the canonical plist -> launchd -> C2
    chain seen in RUSTBUCKET and OSX.EvilQuest, directly linking a freshly-planted persistence mechanism
    to active command-and-control. References: [Endpoint Security Framework, Apple](https://developer.apple.com/documentation/endpointsecurity),
    [The DPRK strikes using a new variant of RUSTBUCKET, Elastic](https://www.elastic.co/security-labs/DPRK-strikes-using-a-new-variant-of-rustbucket),
    [OSX.EvilQuest Uncovered, Objective-See](https://objective-see.org/blog/blog_0x59.html).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS servers, and all managed macOS endpoints.'
  range: Last 90 days (correlate launchd exec to plist writes within 1 hour)
  queries:
  - technology: Zeek/pseudocode
    query: "JOIN proc_create(parent=launchd,pid=1) WITH zeek_conn ON host,proc\n  WHERE exe_path IN plists_modified_last_1h\n\
      \  ALERT IF conn.dest IN c2_threat_intel"
- question: For launchd-spawned processes tied to a recently modified plist, which destination domains
    fall in the bottom 1 percentile of fleet DNS query frequency, and are any producing bursts of NXDOMAIN
    or connection-refused responses?
  context: 'For launchd-spawned processes tied to a recently modified plist, compute PSL+1 domain rarity
    from Zeek dns.log fleet query frequency and alert on the bottom 1 percentile. Failure-mode awareness:
    separately profile NXDOMAIN rate and connection-refused/blocked rate per destination - a new plist''s
    process generating bursts of NXDOMAIN/failed connections is a strong DGA or dead-C2 signal even before
    reputation data confirms it.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS servers, and all managed macOS endpoints.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR proc IN launchd_spawned WHERE exe IN plist_modified_recent:\n  rarity = freq(psl1(dest_domain)\
      \ in zeek_dns fleet)\n  ALERT IF rarity < p01\n  separately profile nxdomain_rate, conn_refused_rate\
      \ per dest"
- question: Does the per-host volume of new launchd-spawned processes exceed the upper confidence interval
    of a time-series forecast, or do plist-write -> launchd-load -> exec -> egress sequences deviate from
    the learned normal event ordering?
  context: 'Forecast per-host volume of new launchd-spawned processes with a time-series model (ARIMA/Prophet)
    and alert when observed volume exceeds the upper confidence interval, indicating a mass-persistence
    event. Model normal event ordering with DeepLog to flag anomalous plist-write -> launchd-load -> exec
    -> egress sequences. Surface the contributing time window and top destinations in the alert for triage.
    References: [DeepLog, Du et al.](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points, DNS servers, and all managed macOS endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "forecast = ARIMA/Prophet(per_host new_launchd_proc_volume)\n  ALERT IF observed > upper_CI\n\
      \  seq_model = DeepLog(plist_write->launchd_load->exec->egress); ALERT on anomalous order\n  EMIT\
      \ time_window, top_destinations"
