name: 'T1647: Plist File Modification'
id: 8038dad5-9de4-4d36-85fb-926c0a93a603
description: 'Investigate adversary modification of macOS property list (plist) files used to alter application
  behavior, hide execution, and establish persistence while evading defenses. This playbook helps an analyst
  hunt for: Info.plist edits that set LSUIElement to run an app invisibly (no Dock/menu-bar presence);
  plist files in LaunchAgent/LaunchDaemon and other auto-run directories whose ProgramArguments, Program,
  LSEnvironment, Label, or KeepAlive fields contain known-bad IOCs (domains, IPs, paths, argument patterns);
  plists referencing executables in anomalous locations such as /tmp, /var/tmp, /Users/Shared, Downloads,
  or hidden directories; plists invoking scripting interpreters (python, osascript, bash, zsh, perl) with
  high-entropy, obfuscated, or download-execute arguments; plists modified by processes outside an allowlist
  of legitimate installers and admin tools (e.g., browsers or document readers); and the canonical plist
  -> launchd (PID 1) -> exec -> C2 egress chain observed in real macOS intrusions. It combines deterministic
  symbolic-logic rules, statistical baselining/rarity/entropy scoring, and machine learning classification/clustering/forecasting,
  keeping exact-match detections as a non-suppressible floor.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
