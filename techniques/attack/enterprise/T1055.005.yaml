      \ callstack (frames in unbacked memory)\n  | alert"
- question: Can you observe the complete sequential injection primitive — remote memory allocation, then
    a remote write into the target's PE/TLS region, then remote thread/APC/callback execution — all referencing
    the same target PID and overlapping memory address within a short (~120s) window?
  context: 'Alerting on a single handle request produces noise; requiring the ordered allocate -> write
    -> execute chain against the same target PID and overlapping address range dramatically reduces false
    positives because benign software almost never performs all three steps cross-process. Emit only when
    the full chain completes within a tight time window. A completed chain into a target''s TLS directory
    region is essentially diagnostic of TLS callback injection. In the context of the Privilege Escalation
    tactic (TA0004), this directly supports the mission question: "Is the adversary attempting privilege
    escalation using thread local storage callbacks?" Source detection method (Symbolic Logic): Require
    the sequential injection primitive rather than a single event. Per [Can You Run My Code? A Close Look
    at Process Injection in Windows Malware](https://dl.acm.org/doi/10.1145/3708821.3736206), correlate
    remote memory allocation -> remote write (into the target''s PE/TLS region) -> remote thread/APC/callback
    execution where all three reference the same target PID and overlapping memory address, within a short
    window (e.g., 120s). Emitting only when the full chain completes sharply reduces false positives versus
    alerting on the handle request alone.'
