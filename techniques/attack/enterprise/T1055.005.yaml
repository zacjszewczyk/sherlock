- question: Which processes are requesting handles with memory-write or thread-creation rights (PROCESS_VM_WRITE
    0x0020, PROCESS_VM_OPERATION 0x0008, PROCESS_CREATE_THREAD 0x0002, or full-access 0x1F0FFF/0x1438)
    against privileged system processes such as lsass.exe, services.exe, or wininit.exe, and does the
    source executable's SHA256 match a known-bad threat-intelligence indicator?
  context: 'TLS callback injection requires the injector to first obtain a writable/executable handle
    into the target so it can plant the malicious TLS callback pointer. Cross-process VM-write or thread-create
    against core system processes is extremely rare in legitimate operation, so query handle-request telemetry
    (Windows Event ID 4656 / Sysmon Event ID 10), filter the Accesses/GrantedAccess mask for write or
    thread-create flags, then join the source Process ID back to the process-creation event (Event ID
    4688 / Sysmon Event ID 1) to recover the source image hash and enrich it against threat intelligence.
    A hash match on top of a write-handle to lsass/services is a high-confidence injection lead; treat
    the behavior as suspicious even without a TI hit and except only verified known-good pairs. In the
    context of the Privilege Escalation tactic (TA0004), this directly supports the mission question:
    "Is the adversary attempting privilege escalation using thread local storage callbacks?" Source detection
    method (Symbolic Logic): Query for handle requests (Windows Event ID 4656 or Sysmon Event ID 10) where
    the target process is a privileged system process (lsass.exe, services.exe, wininit.exe) and the ''Accesses''
    or ''GrantedAccess'' field contains flags for memory writing or thread creation (e.g., PROCESS_VM_WRITE
    (0x0020), PROCESS_VM_OPERATION (0x0008), PROCESS_CREATE_THREAD (0x0002)), or the full-access mask
    0x1F0FFF/0x1438. Join the source ''Process ID'' with process creation events (Windows Event ID 4688
    or Sysmon Event ID 1) to retrieve the source executable''s hash. Alert if this hash matches a known-bad
    indicator from threat intelligence feeds. Per [The Sysmon Community Guide: CreateRemoteThread](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md),
    legitimate cross-process VM-write/thread-create is rare, so log all and except only verified known-good
    pairs.'
