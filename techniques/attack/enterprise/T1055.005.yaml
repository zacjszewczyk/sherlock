- question: Is a write-access handle request to a process like explorer.exe followed within 60 seconds
    by that target spawning a shell (cmd.exe, powershell.exe, pwsh.exe, cscript.exe, wscript.exe) whose
    Parent PID equals the handle's Target PID?
  context: 'Injected code commonly launches a command interpreter from the host process. Trigger when
    a write-handle to a process such as explorer.exe is followed within 60 seconds by a child-process
    creation whose Parent PID matches the handle''s Target PID and whose image is a shell or script interpreter.
    Lineage invariants (e.g., what should and shouldn''t spawn shells) sharpen confidence that the spawn
    is injection-driven rather than user-driven. In the context of the Privilege Escalation tactic (TA0004),
    this directly supports the mission question: "Is the adversary attempting privilege escalation using
    thread local storage callbacks?" Source detection method (Symbolic Logic): Trigger when a write-access
    handle request (Event ID 4656/Sysmon 10) to a process like ''explorer.exe'' is followed within 60
    seconds by a process creation (Event ID 4688/Sysmon 1) whose Parent PID matches the handle''s Target
    PID and New Process Name is a shell (cmd.exe, powershell.exe, pwsh.exe, cscript.exe, wscript.exe).
    Reinforce with lineage invariants from [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/)
    and [Non-Services.exe Spawn Svchost.exe](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/).'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers'
  range: Last 90 days; correlate within 60 seconds
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  h = (4656 OR Sysmon10) write to target T (e.g., explorer.exe)\n  c = (4688 OR Sysmon1)\
      \ where ParentPID==T AND\n      NewProcess in (cmd.exe,powershell.exe,pwsh.exe,cscript.exe,wscript.exe)\n\
      \  | join within 60s | alert"
- question: After a write-access handle request, does the target process spawn a child that falls in the
    bottom 5th percentile of its 30-day child-process frequency distribution, or form an unusual parent-child
    pair?
  context: 'Build a 30-day frequency distribution of each common process''s immediate children. Following
    a write-handle to that process, flag children in the bottom 5th percentile of historical frequency
    or known-unusual parent-child pairs. A rare child appearing right after a write-handle suggests the
    new child was launched by injected code rather than normal application behavior. In the context of
    the Privilege Escalation tactic (TA0004), this directly supports the mission question: "Is the adversary
    attempting privilege escalation using thread local storage callbacks?" Source detection method (Statistical
    Method): For each common process (explorer.exe, chrome.exe), build a 30-day frequency distribution
    of immediate children. Following a write-access handle request, flag children in the bottom 5th percentile
    of historical frequency. Track Volume (children/hour) and unusual parent-child pairs per [Unusual
    Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).'
  answer_sources:
