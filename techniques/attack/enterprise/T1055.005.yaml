      \ subgraph, surface top edges"
- question: Is any never-talk system process (lsass.exe, smss.exe, wininit.exe, csrss.exe) making an outbound
    network connection to a destination outside the corporate address space?
  context: 'Certain core system processes have a behavioral invariant: they never initiate external network
    connections. Any egress from lsass/smss/wininit/csrss to an external IP violates that invariant and
    strongly suggests injected code is using the trusted process as cover. Implement as a zero-tolerance
    rule across Windows Event ID 5156, Sysmon Event ID 3, and Zeek conn.log. In the context of the Stealth
    tactic (TA0005), this directly supports the mission question: "Is the adversary attempting privilege
    escalation using thread local storage callbacks?" Source detection method (Symbolic Logic): Zero-tolerance
    rule: alert on any network connection event (Windows Event ID 5156, Sysmon Event ID 3, or Zeek conn.log)
    where the source process is ''lsass.exe'', ''smss.exe'', ''wininit.exe'', or ''csrss.exe'' and the
    destination IP is external to the corporate address space. This behavioral invariant for never-talk
    system processes is documented in [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/).'
  answer_sources:
