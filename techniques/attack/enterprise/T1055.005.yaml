      \  | where dst_ip NOT in corporate_cidr\n  | alert (zero-tolerance)"
- question: Are system processes making network connections while their command line is empty/zero-length,
    indicating shellcode running without the original argv after hollowing/injection?
  context: 'When a process is hollowed or injected, the executing shellcode often lacks the original command-line
    arguments, leaving a zero-length cmdline. A system process with an empty command line that also makes
    network connections is a strong indicator of injection. Combine the process-creation cmdline field
    with network telemetry to catch this. In the context of the Stealth tactic (TA0005), this directly
    supports the mission question: "Is the adversary attempting privilege escalation using thread local
    storage callbacks?" Source detection method (Symbolic Logic): Detect hollowed/injected hosts whose
    shellcode runs without the original argv by alerting on system processes that make network connections
    while their command-line is empty/zero-length, per [Windows Processes With Zero-length Command-line
    Arguments Making Network Connections](https://research.splunk.com/endpoint/54fa06c5-96a2-4406-a4a7-44d93ddbd173/).'
