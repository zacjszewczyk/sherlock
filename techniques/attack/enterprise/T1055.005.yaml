- question: For system processes with rare but legitimate network activity (e.g., services.exe), are there
    Z-score>3 spikes in daily connections to non-standard ports, lookups to domains under 30 days old,
    high-entropy (>7.2) domain names, or NXDOMAIN bursts?
  context: 'Some system processes do talk to the network occasionally, so apply outlier statistics rather
    than zero-tolerance. Z-score the daily connection count per destination port (Z>3 to a non-standard
    port is anomalous), correlate DNS lookups against domain age (<30 days) and Shannon entropy (>7.2
    packed/DGA threshold), and track NXDOMAIN/SERVFAIL bursts as a failure-state signal of DGA beaconing.
    Together these profile injected C2 hiding in an otherwise-trusted process. In the context of the Privilege
    Escalation tactic (TA0004), this directly supports the mission question: "Is the adversary attempting
    privilege escalation using thread local storage callbacks?" Source detection method (Statistical Method):
    For system processes with legitimate but rare network activity (e.g., services.exe), monitor outliers.
    Apply a Z-score to the daily connection count per destination port; $$ Z > 3 $$ to a non-standard
    port is anomalous. Correlate DNS lookups to domains <30 days old (Zeek dns.log) and score domain Shannon
    entropy against the >7.2 packed/DGA threshold from [Using Entropy Analysis to Find Encrypted and Packed
    Malware](https://ieeexplore.ieee.org/document/4140989). Track NXDOMAIN bursts as a distinct failure-state
    signal of DGA beaconing.'
  answer_sources:
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Domain Controllers, DNS Servers'
  range: Last 90 days; daily aggregation
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  per system_proc, per dst_port: Z = (count - mean)/stddev\n  | flag Z > 3 to non-standard\
      \ port\n  | join dns.log: domain_age < 30d OR entropy(domain) > 7.2\n  | track NXDOMAIN burst rate\
      \ as state signal | alert"
- question: Does a one-class SVM / isolation forest trained only on legitimate system-process network
    connections flag a new connection as outside the learned boundary, and which top-3 features (port,
    protocol, bytes, duration, frequency, JA3) deviate?
  context: 'Train an unsupervised one-class model on the normal network behavior of system processes using
    features such as destination port, protocol, bytes sent, connection duration, frequency, and JA3 hash.
    Connections falling outside the learned boundary are anomalies that may represent injected C2. Report
    the top-3 deviating features in the alert to speed triage. In the context of the Privilege Escalation
    tactic (TA0004), this directly supports the mission question: "Is the adversary attempting privilege
    escalation using thread local storage callbacks?" Source detection method (Machine Learning): Train
    a one-class SVM (or isolation forest) only on legitimate network connections from system processes;
    new connections outside the learned boundary are anomalies. Features: destination port, protocol,
    bytes sent (Volume), connection duration, connection frequency, and JA3 hash (Zeek ssl.log). Report
    the top-3 deviating features in the alert for triage.'
  answer_sources:
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Domain Controllers, DNS Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = sysproc_conns(dst_port,proto,bytes,duration,freq,ja3)\n  model = OneClassSVM|IsolationForest.fit(X_legit)\n\
      \  | alert where predict(x) == outlier with top3 deviating features"
- question: Are processes executing from user-writable or masquerading paths (C:\Users\*, C:\ProgramData\*,
    C:\PerfLogs\, C:\Windows\Temp\) requesting PROCESS_ALL_ACCESS (0x1F0FFF) handles to privileged processes,
    and do svchost.exe targets lack the expected services.exe parent?
  context: 'Correlate handle requests (Event ID 4656 / Sysmon 10) with process creation (Event ID 4688
    / Sysmon 1) by source PID, and alert when the source image path matches suspicious-location regexes
    and the request asks for high-privilege masks like PROCESS_ALL_ACCESS against a privileged target.
    Cross-check process lineage — svchost.exe should be parented by services.exe — to catch masquerading.
    Execution from a user-writable directory plus a full-access handle to a privileged process is a classic
    injector pattern. In the context of the Privilege Escalation tactic (TA0004), this directly supports
    the mission question: "Is the adversary attempting privilege escalation using thread local storage
    callbacks?" Source detection method (Symbolic Logic): Correlate handle request events (Event ID 4656/Sysmon
    10) with process creation events (Event ID 4688/Sysmon 1) via source PID. Alert if the source path
    matches suspicious-location regexes (e.g., `^C:\\Users\\.*`, `^C:\\ProgramData\\.*`, `^C:\\PerfLogs\\.*`,
    `^C:\\Windows\\Temp\\.*`) and the request targets a privileged process with high-privilege masks like
    PROCESS_ALL_ACCESS (0x1F0FFF). Cross-check that svchost.exe targets are parented by services.exe per
    [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  h = (4656 OR Sysmon10) join (4688 OR Sysmon1) on SourcePID\n  | where SourcePath matches\
      \ ^C:\\Users\\ | ^C:\\ProgramData\\ |\n      ^C:\\PerfLogs\\ | ^C:\\Windows\\Temp\\\n  | where TargetIsPrivileged\
      \ AND AccessMask == 0x1F0FFF\n  | where TargetImage==svchost.exe AND ParentImage != services.exe\
      \ -> boost\n  | alert"
- question: Using fleet-wide frequency stacking, which source paths that request handles to privileged
    processes fall below the 5th-percentile prevalence, and are they requesting write/execute access (with
    granted-vs-denied state noted)?
  context: 'Rather than predefining bad paths, compute the prevalence of every source path that requests
    handles to privileged processes across the fleet. Paths below the 5th percentile are rare; alerting
    when such a rare-path process requests write/execute access surfaces novel injectors organically.
    Include Volume (request count) and State (granted vs. denied) to enrich and prioritize. In the context
    of the Privilege Escalation tactic (TA0004), this directly supports the mission question: "Is the
    adversary attempting privilege escalation using thread local storage callbacks?" Source detection
    method (Statistical Method): Compute the prevalence of all source paths that request handles to privileged
    processes using fleet-wide frequency stacking per [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Paths below a 5th-percentile frequency are rare; alert when a rare-path process requests write/execute
    access. This finds outliers without predefining ''bad'' paths and includes Volume (request count)
    and State (granted vs. denied) attributes.'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  t = handle_requests(target privileged)\n  | stats count by SourcePath, granted_state\n\
      \  | eval pct = percent_rank(count)\n  | alert where pct <= 5 AND access in (write,execute)"
- question: When process executions are clustered with DBSCAN on tokenized path, parent name, command-line
    tokens, and signer status, does a process from a noise/outlier cluster subsequently request a handle
    to a privileged process?
  context: 'Unsupervised clustering groups normal process behavior; outliers (DBSCAN noise points) represent
    processes unlike anything benign. If such an outlier process then requests a handle to a privileged
    process (Sysmon 10), raise a high-confidence alert and list the cluster-defining features so the analyst
    understands why it is anomalous. This finds novel injectors without labeled data. In the context of
    the Privilege Escalation tactic (TA0004), this directly supports the mission question: "Is the adversary
    attempting privilege escalation using thread local storage callbacks?" Source detection method (Machine
    Learning): Cluster process execution events (Sysmon 1) with DBSCAN using features such as tokenized
    path, parent name, command-line tokens, and signer status. If a process from an anomalous (noise/outlier)
    cluster subsequently requests a handle to a privileged process (Sysmon 10), raise a high-confidence
    alert and list the cluster-defining features. Validate generalization with API-sequence sequence modeling
    per [Deep LSTM based Malware Analysis](https://github.com/ocatak/lstm_malware_detection).'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = features(Sysmon1): tokens(path), parent, tokens(cmdline), signer\n  labels = DBSCAN.fit_predict(X)\n\
      \  | for proc in noise(-1): if later requests handle to privileged (Sysmon10)\n      -> alert with\
      \ cluster-defining features"
- question: When a process whose hash matches a threat-intelligence feed is created, does that PID later
    become the source of a write/execute handle request targeting common host processes (explorer.exe,
    svchost.exe)?
  context: 'On each process creation, check the executable hash against threat intelligence; on a match,
    watch that PID and alert immediately if it later requests a write/execute handle into a common injection
    host such as explorer.exe or svchost.exe. First-party telemetry is primary — the rule should still
    fire on the handle/unbacked-thread behavior even without a TI hit — but a TI match plus injection
    behavior is high-confidence. In the context of the Privilege Escalation tactic (TA0004), this directly
    supports the mission question: "Is the adversary attempting privilege escalation using thread local
    storage callbacks?" Source detection method (Symbolic Logic): On a process creation event (Event ID
    4688/Sysmon 1), check the executable hash against a threat-intelligence feed. On a match, watch that
    PID and alert immediately if it is later the source in a handle request (Event ID 4656/Sysmon 10)
    targeting common host processes (explorer.exe, svchost.exe) with write/execute rights. Note that first-party
    telemetry is primary; the TI lookup is enrichment, so the rule still fires on the handle/unbacked-thread
    behavior even without a feed hit per [Threat Hunting Process Injection with Sysmon](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/).'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: All Enterprise Workstations and Servers, VDI Environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  create = (4688 OR Sysmon1) | lookup Hash in threat_intel -> watchlist PID\n  handle\
      \ = (4656 OR Sysmon10) where SourcePID in watchlist\n      AND TargetImage in (explorer.exe,svchost.exe)\
      \ AND access in (write,exec)\n  | alert; also fire on handle behavior without TI hit"
- question: For each common injection target (explorer.exe, svchost.exe), which source processes requesting
    handles to it fall outside the top 95% of historical frequency — especially with write masks (GrantedAccess
    includes 0x20) — and are denied requests rising as a probing indicator?
  context: 'Profile, per common target, the set of source processes that legitimately request handles
    to it. Requesters not in the top 95% of frequency are rare; combined with a write mask they are suspicious.
    Profile denied requests separately as a probing indicator that an adversary is testing access against
    the target before a successful injection. In the context of the Privilege Escalation tactic (TA0004),
    this directly supports the mission question: "Is the adversary attempting privilege escalation using
    thread local storage callbacks?" Source detection method (Statistical Method): For each common injection
    target (explorer.exe, svchost.exe), build a profile of source processes that legitimately request
    handles to it. Flag requesters not in the top 95% of frequency (rarity), especially with write masks
    (GrantedAccess includes 0x20), using prevalence stacking per [Using Frequency Analysis to Defend Office
    365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Profile denied requests (State) separately as a probing indicator.'
