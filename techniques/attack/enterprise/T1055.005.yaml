- question: Is a user-facing process (explorer.exe, chrome.exe) connecting to a destination that is blocklisted
    / has poor reputation, or to a domain registered within the last 30 days, per TI-enriched Zeek conn.log/dns.log?
  context: 'Enrich first-party flow logs (Zeek conn.log/dns.log) with threat intelligence for IP/domain
    reputation and domain age; the flow log remains the primary trigger and TI is enrichment. Alert when
    a user-facing process connects to a blocklisted/malicious-reputation destination or a newly registered
    (<30 days) domain. Pair with unbacked-memory egress context to tie the connection back to injected
    code masquerading inside a trusted user app. In the context of the Privilege Escalation tactic (TA0004),
    this directly supports the mission question: "Is the adversary attempting privilege escalation using
    thread local storage callbacks?" Source detection method (Symbolic Logic): Enrich Zeek conn.log/dns.log
    with TI for IP/domain reputation and domain age (enrichment layered on first-party flow logs, which
    remain the primary trigger). Alert if a user-facing process (explorer.exe, chrome.exe) connects to
    a blocklisted/malicious-reputation destination or a domain registered within 30 days. Pair with the
    unbacked-memory egress context from [Doubling Down on ETW Callstacks](https://www.elastic.co/security-labs/doubling-down-etw-callstacks).'
  answer_sources:
