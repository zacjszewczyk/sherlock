- question: Did an unsigned (or non-trusted-publisher) process request a write/execute handle to a privileged
    process and, within 60 seconds, did that targeted privileged process initiate an outbound network
    connection or spawn an unexpected child process?
  context: 'Injection success is confirmed by the target''s subsequent behavior. Trigger on a write/execute
    handle request from an unsigned source (signer validated via Sysmon Event ID 1) to a privileged process,
    then watch the target PID: if it makes a network connection (Event ID 5156 / Sysmon 3 / Zeek conn.log)
    or spawns a child (Event ID 4688 / Sysmon 1) within 60 seconds, raise a high-severity alert. Processes
    like lsass.exe should never spawn children, so unsigned-handle-plus-anomalous-target-behavior is a
    high-confidence injection sequence. In the context of the Privilege Escalation tactic (TA0004), this
    directly supports the mission question: "Is the adversary attempting privilege escalation using thread
    local storage callbacks?" Source detection method (Symbolic Logic): Create a rule that triggers on
    a handle request (Event ID 4656/Sysmon 10) with write/execute access to a privileged process from
    an unsigned source process (validated via Sysmon Event ID 1). Correlate by the target process''s PID.
    If a network connection (Event ID 5156/Sysmon 3/Zeek conn.log) or process creation (Event ID 4688/Sysmon
    1) event originates from that target PID within 60 seconds, generate a high-severity alert. Reinforce
    with the invariant from [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/)
    that processes like lsass.exe should never spawn children.'
