questions:
- question: Which processes are requesting handles with memory-write or thread-creation rights (PROCESS_VM_WRITE
    0x0020, PROCESS_VM_OPERATION 0x0008, PROCESS_CREATE_THREAD 0x0002, or full-access 0x1F0FFF/0x1438)
    against privileged system processes such as lsass.exe, services.exe, or wininit.exe, and does the
    source executable's SHA256 match a known-bad threat-intelligence indicator?
  context: 'TLS callback injection requires the injector to first obtain a writable/executable handle
    into the target so it can plant the malicious TLS callback pointer. Cross-process VM-write or thread-create
    against core system processes is extremely rare in legitimate operation, so query handle-request telemetry
    (Windows Event ID 4656 / Sysmon Event ID 10), filter the Accesses/GrantedAccess mask for write or
    thread-create flags, then join the source Process ID back to the process-creation event (Event ID
    4688 / Sysmon Event ID 1) to recover the source image hash and enrich it against threat intelligence.
    A hash match on top of a write-handle to lsass/services is a high-confidence injection lead; treat
    the behavior as suspicious even without a TI hit and except only verified known-good pairs. In the
    context of the Stealth tactic (TA0005), this directly supports the mission question: "Is the adversary
    attempting privilege escalation using thread local storage callbacks?" Source detection method (Symbolic
    Logic): Query for handle requests (Windows Event ID 4656 or Sysmon Event ID 10) where the target process
    is a privileged system process (lsass.exe, services.exe, wininit.exe) and the ''Accesses'' or ''GrantedAccess''
    field contains flags for memory writing or thread creation (e.g., PROCESS_VM_WRITE (0x0020), PROCESS_VM_OPERATION
    (0x0008), PROCESS_CREATE_THREAD (0x0002)), or the full-access mask 0x1F0FFF/0x1438. Join the source
    ''Process ID'' with process creation events (Windows Event ID 4688 or Sysmon Event ID 1) to retrieve
    the source executable''s hash. Alert if this hash matches a known-bad indicator from threat intelligence
    feeds. Per [The Sysmon Community Guide: CreateRemoteThread](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/create-remote-thread.md),
    legitimate cross-process VM-write/thread-create is rare, so log all and except only verified known-good
    pairs.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source = (EventID==4656 OR Sysmon==10)\n  | where TargetImage in (lsass.exe, services.exe,\
      \ wininit.exe, csrss.exe)\n  | where AccessMask has_any (0x0020,0x0008,0x0002) OR AccessMask in\
      \ (0x1F0FFF,0x1438)\n  | join SourcePID -> (EventID==4688 OR Sysmon==1) to get SourceHash\n  | lookup\
      \ SourceHash in threat_intel\n  | alert if ti_match OR source_pair not in known_good_allowlist"
- question: Are threads being created in, or callbacks firing from, a remote process where the start address
    resolves to private/RX 'UNKNOWN' memory that is not backed by an image on disk?
  context: 'The end state of TLS callback injection is attacker code executing from memory not mapped
    to any module on disk. Using kernel call-stacks from the Threat-Intelligence ETW provider and Sysmon
    Event ID 8 StartAddress/StartModule fields, look for remote thread creation (or callback execution)
    whose start address resolves to private, executable, unbacked memory rather than a legitimate mapped
    module. Unbacked RX memory executing in another process''s address space is one of the strongest single
    signals of injection; correlate with the source process to scope the injector. In the context of the
    Stealth tactic (TA0005), this directly supports the mission question: "Is the adversary attempting
    privilege escalation using thread local storage callbacks?" Source detection method (Symbolic Logic):
    TLS callback injection ultimately executes attacker code from memory that is not backed by an image
    on disk. Using kernel call-stacks from the Threat-Intelligence ETW provider as described in [Doubling
    Down on ETW Callstacks](https://www.elastic.co/security-labs/doubling-down-etw-callstacks) and the
    Sysmon Event ID 8 StartAddress/StartModule fields, alert when a thread is created in (or a callback
    fires from) a remote process whose start address resolves to private/RX ''UNKNOWN'' memory rather
    than a mapped module. Correlate with the hunt workflow in [Threat Hunting Process Injection with Jupyter
    Notebook and Sysmon](https://www.activecountermeasures.com/threat-hunting-process-injection-with-jupyter-notebook-and-sysmon/).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source = Sysmon==8 (CreateRemoteThread)\n  | where SourcePID != TargetPID\n  | where\
      \ StartModule == UNKNOWN OR StartAddress in private_RX_region\n  | enrich with ETW threat-intel\
      \ callstack (frames in unbacked memory)\n  | alert"
- question: Can you observe the complete sequential injection primitive — remote memory allocation, then
    a remote write into the target's PE/TLS region, then remote thread/APC/callback execution — all referencing
    the same target PID and overlapping memory address within a short (~120s) window?
  context: 'Alerting on a single handle request produces noise; requiring the ordered allocate -> write
    -> execute chain against the same target PID and overlapping address range dramatically reduces false
    positives because benign software almost never performs all three steps cross-process. Emit only when
    the full chain completes within a tight time window. A completed chain into a target''s TLS directory
    region is essentially diagnostic of TLS callback injection. In the context of the Stealth tactic (TA0005),
    this directly supports the mission question: "Is the adversary attempting privilege escalation using
    thread local storage callbacks?" Source detection method (Symbolic Logic): Require the sequential
    injection primitive rather than a single event. Per [Can You Run My Code? A Close Look at Process
    Injection in Windows Malware](https://dl.acm.org/doi/10.1145/3708821.3736206), correlate remote memory
    allocation -> remote write (into the target''s PE/TLS region) -> remote thread/APC/callback execution
    where all three reference the same target PID and overlapping memory address, within a short window
    (e.g., 120s). Emitting only when the full chain completes sharply reduces false positives versus alerting
    on the handle request alone.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days; correlate events within a 120-second window
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  alloc = remote VirtualAllocEx(target=T, addr=A)\n  write = remote WriteProcessMemory(target=T,\
      \ addr~=A)\n  exec  = remote CreateRemoteThread/QueueAPC/TLS-callback(target=T, addr~=A)\n  | join\
      \ on TargetPID==T AND addr_overlap(A) AND span(alloc,exec) <= 120s\n  | alert when all three present"
- question: Which source process paths requesting handles to privileged processes have anomalously high
    Shannon entropy (top 98th percentile vs. a 30-day baseline, exceeding the ~7.2 packed/random threshold)
    indicating randomized or obfuscated executable naming?
  context: 'Adversaries often drop injectors with randomized file names to evade path-based detection.
    Native Windows paths/strings cluster between 5.0 and 6.5 Shannon entropy, while packed or randomly
    named binaries exceed 7.2. Establish a 30-day baseline of source-path entropy for processes that request
    handles to privileged processes, then flag any source path in the top 98th percentile. A high-entropy
    source path requesting a write-handle into lsass/services is a strong obfuscation signal. In the context
    of the Stealth tactic (TA0005), this directly supports the mission question: "Is the adversary attempting
    privilege escalation using thread local storage callbacks?" Source detection method (Statistical Method):
    For all handle requests to privileged processes (Event ID 4656/Sysmon 10), calculate the Shannon entropy
    of the source process path string. Using thresholds from [Using Entropy Analysis to Find Encrypted
    and Packed Malware](https://ieeexplore.ieee.org/document/4140989) (normal native strings/paths cluster
    5.0-6.5; packed/random >7.2), establish a 30-day baseline of legitimate interactions and flag any
    source process path with an entropy score in the top 98th percentile, indicating randomized/obfuscated
    naming used to evade path-based detection.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days; baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = handle_requests(target privileged) over 30d\n  | eval H = shannon_entropy(SourceImagePath)\n\
      \  | compute p98 = percentile(H,98)\n  | alert where H >= p98 OR H > 7.2"
- question: Across the fleet, which (source image hash, source path) pairs that request VM-write/thread-create
    handles to privileged processes are in the bottom 1st percentile of prevalence, and are there bursts
    of denied handles (0xC0000022) indicating probing?
  context: 'Frequency/prevalence analysis surfaces rare injectors without predefining ''bad''. Build a
    fleet-wide prevalence table of (hash, path) pairs that request write/thread-create handles to privileged
    processes, tracking Volume (requests/hour), Frequency (requests/min), and State (granted vs. denied).
    Injectors in the bottom 1st percentile are rare enough to warrant review; a burst of denied handle
    requests is a distinct probing signal that an injector is testing access before succeeding. In the
    context of the Stealth tactic (TA0005), this directly supports the mission question: "Is the adversary
    attempting privilege escalation using thread local storage callbacks?" Source detection method (Statistical
    Method): Build a fleet-wide prevalence table of (source image hash, source path) pairs that legitimately
    request VM-write/thread-create handles to privileged processes, following the bucketed frequency approach
    in [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Track Volume (count of such handle requests per source per hour), Frequency (requests/min), and State
    (granted vs. denied/0xC0000022 access). Flag injectors in the bottom 1st percentile of fleet prevalence,
    and separately profile denied-handle bursts as a distinct probing signal.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  t = handle_requests(target privileged)\n  | stats count by SourceHash, SourcePath, granted_state\n\
      \  | eval prevalence_pct = percent_rank(count)\n  | alert where prevalence_pct <= 1\n  | also alert\
      \ where denied_count(0xC0000022) bursts per source"
- question: Does a supervised model (logistic regression / random forest) trained on Sysmon Events 1,
    8, and 10 score a given handle request as malicious with P(malicious) > 0.9, and which top-3 features
    (e.g., unbacked start address, access mask 0x1F0FFF, unsigned source) drove the decision?
  context: 'A supervised classifier combines weak individual signals — source path entropy, command-line
    length/entropy, signer status, one-hot requested access mask, target-is-privileged, parent process,
    and unbacked-start-address — into a calibrated probability that a handle request is malicious. Train
    on labeled history, alert when P(malicious) > 0.9, and include SHAP/LIME top-3 contributing features
    in the alert so analysts can triage quickly. This generalizes beyond hard-coded rules to novel injectors.
    In the context of the Stealth tactic (TA0005), this directly supports the mission question: "Is the
    adversary attempting privilege escalation using thread local storage callbacks?" Source detection
    method (Machine Learning): Develop a logistic regression or random forest model trained on labeled
    historical data (Sysmon Events 1, 8, 10). Features: source process path entropy, command-line length/entropy,
    signer status, one-hot requested access mask, target-is-privileged boolean, parent process name, and
    whether the source thread start address is unbacked. Validate against ETW memory-event detection per
    [A new approach for detecting process injection attacks using memory analysis](https://link.springer.com/article/10.1007/s10207-024-00836-w)
    (reported 99.93% accuracy, 0.068% FPR). Alert on $$ P(malicious) > 0.9 $$ and, per [explainable CNN-GRU
    with SHAP/LIME](https://peerj.com/articles/cs-3258/), include the top-3 contributing features (e.g.,
    ''unbacked start address'', ''access mask 0x1F0FFF'', ''unsigned source'') in the alert text.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Sysmon Event ID 10
  - Sysmon Event ID 1
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = features(Sysmon 1,8,10): path_entropy, cmdline_len, cmdline_entropy,\n      signer_status,\
      \ onehot(access_mask), target_is_privileged, parent_name,\n      unbacked_start_addr\n  model =\
      \ LogisticRegression|RandomForest.fit(X_train,y)\n  | score requests\n  | alert where P(malicious)\
      \ > 0.9 with shap_top3(features)"
- question: Did an unsigned (or non-trusted-publisher) process request a write/execute handle to a privileged
    process and, within 60 seconds, did that targeted privileged process initiate an outbound network
    connection or spawn an unexpected child process?
  context: 'Injection success is confirmed by the target''s subsequent behavior. Trigger on a write/execute
    handle request from an unsigned source (signer validated via Sysmon Event ID 1) to a privileged process,
    then watch the target PID: if it makes a network connection (Event ID 5156 / Sysmon 3 / Zeek conn.log)
    or spawns a child (Event ID 4688 / Sysmon 1) within 60 seconds, raise a high-severity alert. Processes
    like lsass.exe should never spawn children, so unsigned-handle-plus-anomalous-target-behavior is a
    high-confidence injection sequence. In the context of the Stealth tactic (TA0005), this directly supports
    the mission question: "Is the adversary attempting privilege escalation using thread local storage
    callbacks?" Source detection method (Symbolic Logic): Create a rule that triggers on a handle request
    (Event ID 4656/Sysmon 10) with write/execute access to a privileged process from an unsigned source
    process (validated via Sysmon Event ID 1). Correlate by the target process''s PID. If a network connection
    (Event ID 5156/Sysmon 3/Zeek conn.log) or process creation (Event ID 4688/Sysmon 1) event originates
    from that target PID within 60 seconds, generate a high-severity alert. Reinforce with the invariant
    from [Red Canary Process Injection](https://redcanary.com/threat-detection-report/techniques/process-injection/)
    that processes like lsass.exe should never spawn children.'
  answer_sources:
  - Windows Event ID 4656
  - Sysmon Event ID 10
  - Windows Event ID 5156
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Sysmon Event ID 8
  - 'NAI: Domain Controllers, Enterprise DNS Servers, Network Egress Points'
  range: Last 90 days; correlate target behavior within 60 seconds
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  h = (4656 OR Sysmon10) write/exec to privileged target T, SourceSigner==unsigned\n \
      \ followup = (5156 OR Sysmon3 OR conn.log OR 4688 OR Sysmon1) where PID==T\n  | join within 60s\n\
      \  | alert high-severity"
- question: Is there a Sysmon Event ID 25 process-tampering (image replaced/hollowed) event on the same
    target PID that received an unsigned-source write handle, followed by egress or child-spawn?
  context: 'Sysmon Event ID 25 directly evidences the memory tamper (image replacement/hollowing) used
    to plant TLS callbacks. Correlate a tamper event with the unsigned-source handle request to the same
    target PID; a tamper plus subsequent outbound connection or unexpected child process is one of the
    highest-confidence injection sequences available from endpoint telemetry. In the context of the Stealth
    tactic (TA0005), this directly supports the mission question: "Is the adversary attempting privilege
    escalation using thread local storage callbacks?" Source detection method (Symbolic Logic): Confirm
    the underlying memory tamper that plants TLS callbacks by correlating Sysmon Event ID 25 (Process
    Tampering: image replaced/hollowed) per [Detecting Process Injection Attacks with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/)
    with the unsigned-source handle request to the same target PID. A tamper event plus subsequent egress/child-spawn
    is a high-confidence injection sequence.'
  answer_sources:
