name: 'T1055.005: Process Injection: Thread Local Storage'
id: 0302ac87-9570-43fb-a1e6-e8fdec0188cf
description: 'This playbook helps an analyst investigate Process Injection via Thread Local Storage (TLS)
  callback injection (T1055.005), in which an adversary manipulates pointers in a portable executable
  to redirect a live process to malicious code before its legitimate entry point, executing attacker code
  inside a trusted process to evade process-based defenses and potentially elevate privileges. It guides
  the analyst through the full injection lifecycle: cross-process handle requests for memory-write/thread-create
  rights against privileged or commonly abused host processes; the ordered allocate-write-execute primitive;
  execution from unbacked private/RX memory; hollowing/tamper confirmation (Sysmon Event ID 25); and the
  post-injection effects such as never-talk system processes making network connections, trusted processes
  spawning shells, drop-and-inject document sequences, and C2 to newly registered or high-entropy domains.
  It combines symbolic-logic rules, statistical baselining/rarity/entropy analysis, and machine-learning
  models across endpoint (Windows Event Logs, Sysmon) and network (Zeek) telemetry to detect both sophisticated
  external actors and commodity malware abusing TLS callbacks.'
type: technique
