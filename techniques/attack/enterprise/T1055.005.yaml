- question: When a browser connects to a domain first-seen for that host (vs. a 30-day rolling baseline),
    is the domain's Shannon entropy in the top 5th percentile / above 7.2, and are NXDOMAIN/SERVFAIL rates
    elevated for that host?
  context: 'Maintain a per-host 30-day rolling baseline of queried domains. For a browser reaching a host-first-seen
    domain, compute Shannon entropy and alert when it is in the top 5th percentile or exceeds the 7.2
    packed/DGA threshold — a hallmark of algorithmically generated C2 domains. Track per-host NXDOMAIN/SERVFAIL
    rates as a distinct failure-state signal of DGA beaconing where many generated domains do not resolve.
    In the context of the Privilege Escalation tactic (TA0004), this directly supports the mission question:
    "Is the adversary attempting privilege escalation using thread local storage callbacks?" Source detection
    method (Statistical Method): Per host, maintain a 30-day rolling baseline of queried domains (Zeek
    dns.log). For a browser connecting to a host-''first seen'' domain, compute Shannon entropy and alert
    when it is in the top 5th percentile / exceeds the >7.2 packed/DGA threshold from [Using Entropy Analysis
    to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989). Track NXDOMAIN/SERVFAIL
    rates per host as a distinct failure-state DGA signal.'
  answer_sources:
