- question: Did a non-installer process (WINWORD.EXE, OUTLOOK.EXE, ACROBAT.EXE) write a new executable
    (.exe/.dll) to disk and then, within 5 minutes, request a write-access handle to another process —
    a 'drop and inject' sequence?
  context: 'Trigger on a file-creation event (Sysmon Event ID 11) where the created file is an executable
    and the creator is on a non-installer list (office apps, browsers, PDF readers). If that same PID
    then issues a write-access handle request to another process within 5 minutes, raise a high-severity
    alert. Confirm with the ordered allocate-write-execute chain and Sysmon Event ID 25 tamper confirmation.
    The drop-then-inject pattern is a strong, low-noise sign of a malicious document or loader. In the
    context of the Privilege Escalation tactic (TA0004), this directly supports the mission question:
    "Is the adversary attempting privilege escalation using thread local storage callbacks?" Source detection
    method (Symbolic Logic): Trigger on a file creation event (Sysmon Event ID 11) where the created file
    is an executable (.dll, .exe) and the creating process (e.g., winword.exe, outlook.exe, acrobat.exe)
    is on a non-installer list. If the same PID then issues a handle request (Event ID 4656/Sysmon 10)
    with write access to another process within 5 minutes, issue a high-severity alert. Confirm with the
    ordered allocate-write-execute chain from [Can You Run My Code?](https://dl.acm.org/doi/10.1145/3708821.3736206)
    and Sysmon Event ID 25 tamper confirmation per [Detecting Process Injection Attacks with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/).'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4656
  - Sysmon Event ID 10
