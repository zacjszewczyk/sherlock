    attempting privilege escalation using thread local storage callbacks?" Source detection method (Symbolic
    Logic): Trigger on a file creation event (Sysmon Event ID 11) where the created file is an executable
    (.dll, .exe) and the creating process (e.g., winword.exe, outlook.exe, acrobat.exe) is on a non-installer
    list. If the same PID then issues a handle request (Event ID 4656/Sysmon 10) with write access to
    another process within 5 minutes, issue a high-severity alert. Confirm with the ordered allocate-write-execute
    chain from [Can You Run My Code?](https://dl.acm.org/doi/10.1145/3708821.3736206) and Sysmon Event
    ID 25 tamper confirmation per [Detecting Process Injection Attacks with Wazuh](https://wazuh.com/blog/detecting-process-injection-attacks-with-wazuh/).'
