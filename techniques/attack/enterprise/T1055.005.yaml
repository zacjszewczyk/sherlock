- question: After a write-access handle request to a privileged process, does that target drift from its
    30-day baseline — spawning a rare child, connecting to a bottom-1st-percentile IP/port, or exceeding
    outbound bytes of baseline mean + 3 sigma — and are blocked/failed connections rising?
  context: 'Build a 30-day baseline of each privileged process''s normal children, destination IPs/ports,
    and outbound byte volume. Following a write-handle request, monitor the target PID for statistical
    drift: a rare child or destination (bottom 1st percentile) or outbound bytes beyond mean + 3 sigma
    indicates the process is now doing something it never did before — consistent with injected code.
    Count blocked/failed connections (firewall deny / TCP RST) separately as a State signal of C2 attempts.
    In the context of the Privilege Escalation tactic (TA0004), this directly supports the mission question:
    "Is the adversary attempting privilege escalation using thread local storage callbacks?" Source detection
    method (Statistical Method): For each privileged process (e.g., lsass.exe), build a 30-day baseline
    of normal child processes, destination IPs/ports, and outbound byte Volume. Following a write-access
    handle request (Event ID 4656/Sysmon 10), monitor the target PID. Flag when it spawns a child or connects
    to an IP/port in the bottom 1st percentile of historical frequency, or when outbound bytes exceed
    baseline mean + 3 sigma. Separately count blocked/failed connections (firewall deny / TCP RST) as
    a distinct State signal.'
