    privilege escalation using thread local storage callbacks?" Source detection method (Statistical Method):
    Build a frequency table of which processes create executables on disk (Sysmon Event ID 11) via fleet
    prevalence per [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Creators outside the top 95% (e.g., a browser/office app writing a .dll) are anomalous. Increase the
