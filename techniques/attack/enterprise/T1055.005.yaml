      \ to target T\n  | after trigger, flag if child/dst in bottom 1pct freq\n     OR bytes_out > mean\
      \ + 3*stddev\n  | separately count deny/RST as state signal"
- question: Does a time-series anomaly model (Prophet / LSTM autoencoder) over a critical process's outbound-byte
    volume and unique-destination frequency flag a statistically significant spike that temporally follows
    a write-access handle request to that process?
  context: 'Injected code frequently establishes C2, producing anomalous outbound volume or fan-out. Model
    each critical process''s outbound-byte Volume and unique-destination Frequency as a time series; a
    significant spike that correlates with a preceding write-handle (Sysmon 10) to that process is classified
    anomalous. Reconstruct the surrounding causal/provenance subgraph and surface the top contributing
    features and edges so the analyst sees the injection-to-egress chain. In the context of the Stealth
    tactic (TA0005), this directly supports the mission question: "Is the adversary attempting privilege
    escalation using thread local storage callbacks?" Source detection method (Machine Learning): Use
    a time-series anomaly model (e.g., Prophet/LSTM autoencoder) over outbound-byte Volume and unique-destination
    Frequency per critical process. A statistically significant spike temporally correlated with a preceding
    write-access handle request (Sysmon 10) to that process is classified anomalous. Reconstruct the surrounding
    causal subgraph with provenance learning per [ThreaTrace](https://arxiv.org/pdf/2111.04333) and surface
    the top contributing features/edges in the alert.'
  answer_sources:
