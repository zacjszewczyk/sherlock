- question: For system processes with rare but legitimate network activity (e.g., services.exe), are there
    Z-score>3 spikes in daily connections to non-standard ports, lookups to domains under 30 days old,
    high-entropy (>7.2) domain names, or NXDOMAIN bursts?
  context: 'Some system processes do talk to the network occasionally, so apply outlier statistics rather
    than zero-tolerance. Z-score the daily connection count per destination port (Z>3 to a non-standard
    port is anomalous), correlate DNS lookups against domain age (<30 days) and Shannon entropy (>7.2
    packed/DGA threshold), and track NXDOMAIN/SERVFAIL bursts as a failure-state signal of DGA beaconing.
    Together these profile injected C2 hiding in an otherwise-trusted process. In the context of the Stealth
    tactic (TA0005), this directly supports the mission question: "Is the adversary attempting privilege
    escalation using thread local storage callbacks?" Source detection method (Statistical Method): For
    system processes with legitimate but rare network activity (e.g., services.exe), monitor outliers.
    Apply a Z-score to the daily connection count per destination port; $$ Z > 3 $$ to a non-standard
    port is anomalous. Correlate DNS lookups to domains <30 days old (Zeek dns.log) and score domain Shannon
    entropy against the >7.2 packed/DGA threshold from [Using Entropy Analysis to Find Encrypted and Packed
    Malware](https://ieeexplore.ieee.org/document/4140989). Track NXDOMAIN bursts as a distinct failure-state
    signal of DGA beaconing.'
