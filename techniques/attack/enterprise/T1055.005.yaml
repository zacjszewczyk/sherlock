  range: Last 90 days; baseline over trailing 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  base = per-parent child frequency over 30d\n  | after write-handle to parent P, flag\
      \ child in bottom 5pct freq(P)\n     OR unusual parent-child pair | alert"
- question: Does provenance-graph learning over process lineage (node-level GNN / graph temporal autoencoder)
    detect an anomalous subgraph (e.g., explorer.exe -> powershell.exe -> rundll32.exe) that correlates
    with a preceding handle request to the subgraph root?
  context: 'Model process lineage as a provenance graph and apply node-level GNN detection or graph temporal
    autoencoders to find anomalous subgraphs. Correlate detected anomalous subgraphs with preceding handle
    requests (Sysmon 10) to the subgraph root, and emit the reconstructed subgraph as explainable evidence.
    This captures multi-step injection-driven execution chains that simple parent-child rules miss. In
    the context of the Privilege Escalation tactic (TA0004), this directly supports the mission question:
    "Is the adversary attempting privilege escalation using thread local storage callbacks?" Source detection
    method (Machine Learning): Apply provenance-graph learning over process lineage (Sysmon 1) using node-level
    GNN detection per [ThreaTrace](https://arxiv.org/pdf/2111.04333) ([code](https://github.com/threaTrace-detector/threaTrace))
    or graph temporal autoencoders per [KAIROS](https://tfjmp.org/publications/2024-sp.pdf) ([code](https://github.com/ProvenanceAnalytics/kairos)).
    Detect anomalous subgraphs (e.g., explorer.exe -> powershell.exe -> rundll32.exe) and correlate with
    preceding handle requests (Sysmon 10) to the subgraph root; emit the reconstructed subgraph as explainable
    evidence.'
  answer_sources:
