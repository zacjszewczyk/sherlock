questions:
- question: '[Credential Access] Match registry harvest tooling to threat intel: Can you determine whether
    process and script telemetry shows targeted registry credential discovery against known secret-bearing
    key paths (for example `Winlogon\DefaultPassword` and remote tool credential stores), with indicators
    suggesting intentional credential harvesting rather than routine administration. -- specifically,
    using the ''Match registry harvest tooling to threat intel'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), an adversary searches the Windows
    Registry on compromised systems for insecurely stored credentials and passwords -- such as autologon
    secrets, saved remote-tool credentials (PuTTY, WinSCP, VNC), and service/application secrets -- that
    can be reused to expand access while blending in with legitimate administration. This evidence focuses
    on the condition that Process and script telemetry shows targeted registry credential discovery against
    known secret-bearing key paths (for example `Winlogon\DefaultPassword` and remote tool credential
    stores), with indicators suggesting intentional credential harvesting rather than routine administration.
    This Symbolic Logic approach works as follows: Correlate process creation (Windows Event ID 4688 /
    Sysmon Event ID 1) and script block telemetry (Windows Event ID 4104) against a watchlist of known
    credential-harvester hashes and command fragments — notably `reg query ... /f password /t REG_SZ /s`
    and high-risk key paths (`Winlogon\DefaultPassword`, `HKCU\Software\SimonTatham\PuTTY\Sessions`, VNC/WinSCP/SNMP
    credential stores) per [Stored Credentials, Pentestlab](https://pentestlab.blog/2017/04/19/stored-credentials/)
    and [Atomic Red Team T1552.002](https://www.atomicredteam.io/docs/atomics/T1552.002); raise high-confidence
    alerts on direct IOC matches. A positive result -- a rule match, statistical outlier, or model alert
    -- indicates probable credential-discovery activity against the registry; pivot to the responsible
    process and its parent lineage, the user and privilege context, the specific credential-bearing keys
    touched, and any subsequent authentication, lateral movement, or data access from the same host/account.
    A negative result helps rule out this particular vector for the time window examined but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land registry enumeration.'
