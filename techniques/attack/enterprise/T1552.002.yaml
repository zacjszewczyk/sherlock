name: 'T1552.002: Credentials in Registry'
id: 7151d911-7fd6-4cc1-9efc-f430f78f84c1
description: 'This playbook helps an analyst investigate whether an adversary is harvesting credentials
  by querying the Windows Registry (T1552.002) as part of the Credential Access tactic. Attackers search
  the registry for insecurely stored secrets -- autologon passwords (Winlogon\DefaultPassword), saved
  remote-tool credentials (PuTTY sessions, WinSCP, VNC, SNMP), and service/application secrets -- often
  via recursive reg.exe queries (reg query HKLM /f password /t REG_SZ /s) or PowerShell equivalents (Get-ItemProperty,
  Get-ChildItem HKLM:). It guides the analyst across several behavioral angles: matching registry-harvest
  tooling and command fragments to threat intelligence; deterministic reg.exe/PowerShell credential-query
  rules; escalating sensitive-key reads from unexpected user, privilege, or parent-process contexts; statistical
  baselining of query rarity, command entropy/keyword density, sweep velocity, and failure rates; rare
  (process, user, key) tuple and first-seen scoring; machine-learning classification and clustering of
  credential-search behaviors; and correlation of registry discovery with short-window follow-on credential
  reuse, network logons, and lateral movement (SMB/RDP/WMI). Detection methods combine symbolic-logic
  rules, statistical anomaly detection, and machine-learning models applied to Windows Security events
  (4688, 4663, 4624, 4648, 4625, 5156), Sysmon (Event ID 1, 13, 14), PowerShell script-block logging (4104),
  Windows Defender events, and Zeek conn.log, so the analyst can corroborate suspected registry credential
  discovery against process lineage, key access, account context, and downstream movement.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
