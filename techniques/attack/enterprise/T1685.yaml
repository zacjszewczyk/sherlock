- question: Did a discovery command (e.g., tasklist) get followed within 5 minutes by a taskkill or sc
    stop targeting a known security agent on the same host?
  context: 'The discover-then-kill pattern is a tight behavioral signature of Defense Impairment (the
    adversary is breaking or blinding security controls so defenders cannot see or trust what is happening):
    the actor enumerates running defenses, then terminates them. A stateful correlation rule over process-creation
    streams (4688/Sysmon 1) with a 5-minute window catches this even when individual commands look ordinary.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint workstations, Servers with interactive user logins, Privileged Access Workstations
    (PAWs)'
  range: Last 90 days; correlate within a 5-minute window
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'sequence by host within 5m: A=CommandLine~/tasklist|Get-Process|sc query/ THEN B=CommandLine~/taskkill|sc(\.exe)?
      stop|Stop-Service/ AND B targets security_service_list | alert'
- question: Which discovery->termination command pairs are statistically rare for the specific user/host
