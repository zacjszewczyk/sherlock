questions:
- question: Did any host execute a binary whose file hash or code-signing certificate matches a curated
    list of known tools used to stop security agents, redirect telemetry, or alter log-collection settings,
    especially from a privileged context?
  context: In support of Defense Impairment (the adversary is breaking or blinding security controls so
    defenders cannot see or trust what is happening), adversaries frequently bring purpose-built or dual-use
    utilities (e.g., EDR killers, ETW patchers, log redirectors) onto a host before disabling defenses.
    Matching process-creation hashes and signers (Windows Event ID 4688 / Sysmon Event ID 1) against a
    curated tool set gives a high-fidelity, low-noise signal. A hit launched under an elevated/SYSTEM
    token is especially significant because privilege is the prerequisite for tampering. A positive result
    indicates likely staged tooling for telemetry suppression; a negative result reduces but does not
    eliminate suspicion since attackers rename or recompile tools.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint workstations, Critical servers (e.g., Domain Controllers, file servers), Log aggregation
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: search EventID IN (4688,1) | where Hashes IN (known_tool_hash_list) OR Signer IN (known_tool_signers)
      | where TokenElevation="%%1937" OR IntegrityLevel IN ("High","System") | alert
- question: Which utilities, by hash or signed binary, are rare across the estate (below ~0.5% prevalence)
    yet suddenly appear on multiple hosts, and how often do they run successfully versus return Access-Denied?
  context: 'Under Defense Impairment (the adversary is breaking or blinding security controls so defenders
    cannot see or trust what is happening), a defense-impairment tool that is unusual fleet-wide but appears
    on several hosts at once is a strong outbreak signal. Measuring per-binary prevalence over a 30-day
    window and flagging sub-0.5% binaries that spread, while profiling execution frequency and success/failure
    (Access-Denied) state, separates noisy admin tools from targeted suppression attempts. Failed privilege
    attempts are themselves an indicator of an actor probing for the ability to disable tools. Source
    reference: [host-centric PCA baselining (Beehive)](https://doi.org/10.1145/2523649.2523670).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint workstations, Critical servers (e.g., Domain Controllers, file servers), Log aggregation
    servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: stats dc(host) as hostspread count as runs by Hashes, ResultStatus over 30d | eval prevalence=hostspread/total_hosts
      | where prevalence<0.005 AND hostspread>1 | sort -runs
- question: Do process executions score as anomalous telemetry-disabling tools when evaluated by an Isolation
    Forest or supervised tree ensemble using parent process, token privilege, byte size, entropy, signer,
    and path features?
  context: 'Renamed or novel tools evade hash lists, so under Defense Impairment (the adversary is breaking
    or blinding security controls so defenders cannot see or trust what is happening) an ML model scoring
    process metadata can surface previously unseen disablers. The model must output the top-3 contributing
    features (e.g., unsigned image, rare parent, high entropy) so an analyst can triage the alert rather
    than chase a bare anomaly score. High scores from unsigned, high-entropy binaries spawned by unusual
    parents warrant immediate review. Source reference: [Isolation Forest](https://doi.org/10.1109/ICDM.2008.17).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Endpoint workstations, Critical servers (e.g., Domain Controllers, file servers), Log aggregation
    servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=IsolationForest(features=[parent_image,token_priv,bytes,entropy,signer,path]) | score
      process_creation_events | where score>threshold | output top3_features
- question: Are any command lines or PowerShell script blocks explicitly manipulating event logs, ETW
    providers, firewall rules, or registry keys that control log collection and forwarding (e.g., wevtutil
    cl, Clear-EventLog, Set-EtwTraceProvider, sc stop Sysmon64, netsh advfirewall, EventLog/Autologger
    registry edits)?
  context: These commands are the canonical living-off-the-land mechanics of Defense Impairment (the adversary
    is breaking or blinding security controls so defenders cannot see or trust what is happening). Deterministic
    regex against command-line (4688/Sysmon 1) and script-block (4104) logs catches direct attempts to
    clear logs, kill the Sysmon service, reconfigure ETW autologgers, or block collector traffic. A positive
    is high-fidelity; ensure rules fire even on failed/Access-Denied attempts because the intent is evident.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Endpoint workstations, Servers with local administrative privileges, PowerShell execution environments'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: search EventID IN (4688,1,4104) | where CommandLine matches /(wevtutil\s+cl|Clear-EventLog|Set-EtwTraceProvider|sc(\.exe)?\s+stop\s+Sysmon|netsh\s+advfirewall|Autologger|Services\\EventLog)/i
      | alert
- question: Which logging- or firewall-targeting commands have a length or Shannon entropy above the 99th
    percentile for the specific user/process pair, and which users show bursts of repeated blocked/failed
    executions?
  context: 'Obfuscated or encoded commands used to hide tampering stand out as length/entropy outliers
    relative to a user''s own baseline. Under Defense Impairment (the adversary is breaking or blinding
    security controls so defenders cannot see or trust what is happening), tracking per-user command frequency
    (count/min) and treating repeated blocked/failed executions as a distinct burst signal reveals automated
    scripts iterating through logging/firewall controls. Outliers that also target telemetry controls
    are high priority. Source reference: [count-vector statistical baselining (He et al.)](https://jiemingzhu.github.io/pub/slhe_issre2016.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Endpoint workstations, Servers with local administrative privileges, PowerShell execution environments'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: stats by user,process | eval ent=shannon(CommandLine),len=len(CommandLine) | where ent>p99(ent)
      OR len>p99(len) | where CommandLine targets logging|firewall | count failed/min as burst
- question: Does a transformer log-sequence model score a sliding window of commands as telemetry suppression
    or log tampering, and does it show a discovery-to-evasion transition?
  context: 'Isolated commands can look benign; semantics over a window reveal intent. Under Defense Impairment
    (the adversary is breaking or blinding security controls so defenders cannot see or trust what is
    happening), a LogBERT-style model scoring command sequences flags high-risk manipulations resembling
    log tampering and surfaces the contributing tokens plus any discovery->evasion pivot. The alert should
    name the tokens that drove the score so analysts can confirm. Source reference: [LogBERT](https://arxiv.org/abs/2103.04475).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: Endpoint workstations, Servers with local administrative privileges, PowerShell execution environments'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=LogBERT(window=last_N_commands) | score sessions | where risk>0.85 | output contributing_tokens,
      discovery_to_evasion_transition
- question: Were any Windows log-integrity events generated, such as Security log cleared (1102), Sysmon
    configuration change (16), firewall rule modification (4947), or blocked telemetry (5152), and what
    privileged process preceded them?
  context: 'These events are direct evidence of Defense Impairment (the adversary is breaking or blinding
    security controls so defenders cannot see or trust what is happening): clearing logs, swapping a Sysmon
    config, or modifying firewall rules to break collection. Triggering immediately and correlating to
    the preceding privileged process that changed logging/firewall state gives both detection and attribution.
    A 1102 or unexpected Sysmon 16 outside change windows is high severity.'
  answer_sources:
  - Sysmon Event ID 16
  - Windows Event ID 1102
  - Windows Event ID 4947
  - Windows Event ID 5152
  - 'NAI: All Windows endpoints and servers, Domain Controllers, Systems with host-based firewalls enabled,
    Network gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: search EventID IN (1102,16,4947,5152) | join host,time +/-5m EventID IN (4688,1) where IntegrityLevel
      IN (High,System) | alert with preceding_process
- question: Are there manual firewall rule changes made by non-admins, or rule changes that alter access
    to known collector/SIEM IPs, that deviate from the host's 30-day maintenance baseline?
  context: 'Blocking outbound traffic to collectors is a stealthy form of Defense Impairment (the adversary
    is breaking or blinding security controls so defenders cannot see or trust what is happening). Comparing
    firewall rule-add volume and targets to a 30-day maintenance baseline, and weighting drop rules aimed
    at SIEM/collector IPs heavily, reveals attempts to silently cut telemetry. Non-admin authorship is
    itself anomalous. Source reference: [host-centric PCA baselining (Beehive)](https://doi.org/10.1145/2523649.2523670).'
  answer_sources:
  - Sysmon Event ID 16
  - Windows Event ID 1102
  - Windows Event ID 4947
  - Windows Event ID 5152
  - 'NAI: All Windows endpoints and servers, Domain Controllers, Systems with host-based firewalls enabled,
    Network gateways'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: baseline fw_rule_adds by host over 30d | flag if author not in admins OR dest_ip in collector_ips
      OR rule_add_count>3sigma | weight drop_outbound_to_collector high
- question: Does an LSTM next-event model detect tampering chains such as suspicious login -> log clear
    -> telemetry drop that diverge from learned normal administrative workflows?
  context: 'Multi-step blinding sequences are best caught as sequences, not isolated events. Under Defense
    Impairment (the adversary is breaking or blinding security controls so defenders cannot see or trust
    what is happening), a DeepLog model trained on normal admin workflows flags divergent chains and reports
    the offending event with predicted-vs-observed divergence, helping analysts see the whole tampering
    arc rather than one alert. Source reference: [DeepLog](https://doi.org/10.1145/3133956.3134015).'
  answer_sources:
  - Sysmon Event ID 16
  - Windows Event ID 1102
  - Windows Event ID 4947
  - Windows Event ID 5152
  - 'NAI: All Windows endpoints and servers, Domain Controllers, Systems with host-based firewalls enabled,
    Network gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: model=DeepLog(next_event) | input host_event_stream | flag if observed not in topk_predicted
      | report offending_event, divergence
- question: Did any host stop sending log telemetry for more than 30 minutes while Zeek conn.log shows
    it is still generating network traffic, and was a WFP filter created beforehand (as EDRSilencer does)?
  context: 'A host that is network-alive but log-silent is a hallmark of active suppression under Defense
    Impairment (the adversary is breaking or blinding security controls so defenders cannot see or trust
    what is happening), distinct from a shutdown. Correlating ingestion gaps with continued Zeek conn.log
    activity, and checking for preceding WFP filter creation used by tools like EDRSilencer, distinguishes
    suppression from outage. Positive results justify isolation. Source reference: [EDRSilencer](https://github.com/netero1010/EDRSilencer).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network chokepoints (e.g., core switches, internet gateway), SIEM/Log Aggregator ingestion points,
    All log-generating endpoints and servers'
  range: 'Last 90 days; event-centered: inspect 30 min before the gap'
  queries:
  - technology: Zeek/pseudocode
    query: 'stream conn.log | per host: alive=any(conn in last 30m) | join siem_ingest where last_log>30m
      ago | if alive AND silent: alert; check WFP filter create (EventID 5447) before gap'
- question: Which log sources show hourly volume sustained more than 3 sigma below their 30-day rolling
    mean while the host remains network-active?
  context: 'Quantifying telemetry loss against a per-source 30-day baseline catches gradual or partial
    blinding under Defense Impairment (the adversary is breaking or blinding security controls so defenders
    cannot see or trust what is happening). Requiring corroborating network-active state before alerting
    separates active suppression from a genuine outage, reducing false positives from patching or power-off.
    Source reference: [count-vector statistical baselining (He et al.)](https://jiemingzhu.github.io/pub/slhe_issre2016.pdf).'
  answer_sources:
  - Zeek conn.log
  - 'NAI: Network chokepoints (e.g., core switches, internet gateway), SIEM/Log Aggregator ingestion points,
    All log-generating endpoints and servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: stats count by source bin=1h | eval mean=rolling_mean(30d),sd=rolling_std(30d) | where count<mean-3*sd
      sustained | require host_network_active(zeek) | alert
