name: 'T1685: Disable or Modify Tools'
id: 312c1802-dd13-4fb8-a8fa-4d1def9c9398
description: Investigate adversary attempts to disable, degrade, redirect, or otherwise tamper with security
  tooling and telemetry pipelines (MITRE ATT&CK T1685, Disable or Modify Tools). This playbook helps an
  analyst hunt for the killing or stopping of AV/EDR processes and services, tampering with ETW providers,
  Sysmon, auditd, syslog/nxlog, or cloud and network device logging, registry and configuration changes
  that weaken tamper protection or add broad exclusions, clearing of Windows event logs (1102/104), Bring
  Your Own Vulnerable Driver (BYOVD) process killers, host-based firewall and Windows Filtering Platform
  (WFP) rules that block outbound telemetry to collectors, and the resulting statistically significant
  drops or silences in log volume from hosts that remain active on the network. It combines deterministic
  IOC/regex matching, statistical baselining and anomaly scoring, and machine-learning sequence/graph
  models across Windows, Linux, macOS, ESXi, container, cloud, and network-device telemetry to distinguish
  active suppression from benign outages.
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
