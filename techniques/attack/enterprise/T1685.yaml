    the often-missed Safe Mode boot abuse that disables security drivers entirely. Rules over 4688/Sysmon
    1/4104 must trigger even on failed (Access Denied) attempts, since intent is unambiguous. Source references:
    [SigmaHQ](https://github.com/SigmaHQ/sigma), [The DFIR Report](https://thedfirreport.com/2022/11/28/emotet-strikes-again-lnk-file-leads-to-domain-wide-ransomware/).'
