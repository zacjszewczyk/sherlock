  context: 'Modeling command pairs as n-grams against a per-user/host baseline surfaces unusual transitions
    characteristic of Defense Impairment (the adversary is breaking or blinding security controls so defenders
    cannot see or trust what is happening). Weighting pairs whose second command targets security tooling
    and counting repeated kill attempts per minute distinguishes targeted disabling from routine administration.
    Source reference: [host-centric PCA baselining (Beehive)](https://doi.org/10.1145/2523649.2523670).'
  answer_sources:
