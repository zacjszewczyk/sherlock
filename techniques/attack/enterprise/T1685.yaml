- question: Did a process matching a high-fidelity IOC feed or blocklisted name correlate (within ~5 seconds)
    with a Sysmon Event ID 6 driver load of a signed-but-vulnerable driver (e.g., procexp.sys, RTCore64.sys,
    gdrv.sys), or did vulnerable-driver service creation (7045) precede bursts of protected-process termination?
  context: 'BYOVD is a leading method to kill protected EDR processes under Defense Impairment (the adversary
    is breaking or blinding security controls so defenders cannot see or trust what is happening). Correlating
    process creation with driver loads (Sysmon 6) against the Microsoft vulnerable-driver blocklist, and
    treating vulnerable-driver service creation (7045) followed by protected-process termination as a
    pre-ransomware precursor, catches this powerful tampering path. Positive results are critical and
    often immediately pre-ransomware. Source references: [Elastic Security Labs (BYOVD)](https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks),
    [Sophos AuKill](https://www.sophos.com/en-us/blog/aukill-edr-killer-malware-abuses-process-explorer-driver/).'
  answer_sources:
  - Windows Event ID 4688
