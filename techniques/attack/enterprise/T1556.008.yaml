name: 'T1556.008: Modify Authentication Process: Network Provider DLL'
id: 531d374e-41fc-4042-a10c-89abaf8e09a1
description: 'Investigate the possible registration and abuse of a malicious Windows network provider
  DLL (MITRE ATT&CK T1556.008, the NPPSpy technique) to capture cleartext credentials during interactive
  or network logon. Adversaries register a rogue credential-manager DLL via the registry (HKLM\System\CurrentControlSet\Control\NetworkProvider\Order
  and per-service HKLM\SYSTEM\CurrentControlSet\Services\<Name>\NetworkProvider\ProviderPath) so that
  mpnotify.exe relays each logon''s plaintext credentials to the attacker''s DLL via NPLogonNotify().
  This playbook helps an analyst hunt for the defining telemetry of this technique: new or unapproved
  provider names in the Order key, provider DLLs loaded from non-standard or user-writable paths, unsigned/untrusted/typosquatted/high-entropy
  DLLs, hash and signature anomalies, and the downstream credential-theft behaviors such as mpnotify.exe
  writing files or making outbound connections, lsass.exe/winlogon.exe staging credential dump files,
  and credential processes beaconing to rare or low-reputation destinations. It supports the Defense Impairment,
  Persistence, and Credential Access tactics, combining symbolic-logic correlation, statistical rarity/frequency
  analysis, and machine-learning anomaly detection across Windows endpoint and network telemetry.'
type: technique
