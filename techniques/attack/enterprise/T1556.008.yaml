questions:
- question: Does any DLL that is registered as a Windows network provider have a SHA256 file hash matching
    a known-bad entry on a threat-intelligence blocklist?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: A file hash for a DLL registered
    as a network provider matches a hash on a threat intelligence blocklist. Detection approach (Symbolic
    Logic): Symbolic Logic: Join registry value set events (Sysmon Event ID 13 / Windows Event ID 4657)
    for ''HKLM\System\CurrentControlSet\Control\NetworkProvider\Order'' and per-service ''HKLM\SYSTEM\CurrentControlSet\Services\<Name>\NetworkProvider\ProviderPath''
    with file creation events (Sysmon Event ID 11) for the referenced DLL path. The registry+DLL plant
    is the defining telemetry shape of this technique ([NPPSpy PoC](https://github.com/gtworek/PSBits/tree/master/PasswordStealing/NPPSpy),
    [Network Provider API](https://learn.microsoft.com/en-us/windows/win32/secauthn/network-provider-api)).
    Calculate the SHA256 of the created DLL and compare against a TI blocklist; an exact match triggers
    a high-severity alert ([MITRE T1556.008](https://attack.mitre.org/techniques/T1556/008/)). A positive
    result is a strong lead that an adversary has implanted or is operating a malicious network provider
    DLL to harvest credentials and maintain access; corroborate with the other questions in this playbook
    (registry plant, DLL load path/signature/entropy, and downstream mpnotify/lsass/winlogon behavior)
    before escalating. A negative result lowers but does not fully eliminate suspicion for this tactic.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, Authentication Servers (e.g., ADFS, RADIUS), Critical Workstations (e.g.,
    administrator jump boxes), Enterprise Certificate Authority'
  range: Last 90 days
  queries: &id001
  - technology: SIEM/Rule pseudocode
    query: "join (registry_set WHERE target_object IN ('HKLM\\\\System\\\\CurrentControlSet\\\\Control\\\
      \\NetworkProvider\\\\Order',\n  'HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\*\\\\NetworkProvider\\\
      \\ProviderPath'))\nwith (file_create WHERE TargetFilename = provider_dll_path) on host\n| eval sha256\
      \ = hash(provider_dll_path)\n| lookup ti_blocklist sha256 OUTPUT verdict\n| where verdict == 'malicious'\n\
      | alert severity=high"
- question: Across the enterprise, is a network-provider DLL hash present on fewer than 0.1% of endpoints,
    marking it as a statistically rare outlier compared with the prevalence distribution of known-good
    providers?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: A file hash for a DLL registered
    as a network provider matches a hash on a threat intelligence blocklist. Detection approach (Statistical
    Method): Statistical Method: For all DLLs registered as network providers, stack-count file-hash prevalence
    across the enterprise. A hash on <0.1% of endpoints (Volume: host count; Frequency: first-seen rate)
    is an outlier; flag scores in the 99.9th percentile of rarity ([Using Frequency Analysis to Defend
    Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    Derive the per-environment cutoff from the observed prevalence distribution of known-good providers.
    A positive result is a strong lead that an adversary has implanted or is operating a malicious network
    provider DLL to harvest credentials and maintain access; corroborate with the other questions in this
    playbook (registry plant, DLL load path/signature/entropy, and downstream mpnotify/lsass/winlogon
    behavior) before escalating. A negative result lowers but does not fully eliminate suspicion for this
    tactic.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, Authentication Servers (e.g., ADFS, RADIUS), Critical Workstations (e.g.,
    administrator jump boxes), Enterprise Certificate Authority'
  range: Last 90 days
  queries: &id002
  - technology: SIEM/Stats pseudocode
    query: 'registry_set provider DLLs | join file_create -> sha256

      | stats dc(host) AS host_count, min(_time) AS first_seen BY sha256

      | eventstats count(host) AS fleet_size

      | eval prevalence = host_count / fleet_size

      | where prevalence < 0.001  /* 99.9th percentile of rarity */

      | sort prevalence asc'
- question: When a new network-provider DLL appears, does a supervised classifier trained on static PE
    features (size, Shannon entropy, import count, signature status, fleet prevalence) score it as malicious
    / NPPSpy-class?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: A file hash for a DLL registered
    as a network provider matches a hash on a threat intelligence blocklist. Detection approach (Machine
    Learning): Machine Learning: Train a supervised classifier (Random Forest/XGBoost) on static PE features
    (size, Shannon entropy, import count, signature status, fleet hash prevalence), labeling standard
    Windows provider DLLs good and NPPSpy-class samples bad; ~98% accuracy is achievable on unseen samples
    ([Zero-Day XGBoost/RF](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers)).
    Surface the top-3 contributing features (e.g., entropy, prevalence, signer) in the alert text for
    explainability. A positive result is a strong lead that an adversary has implanted or is operating
    a malicious network provider DLL to harvest credentials and maintain access; corroborate with the
    other questions in this playbook (registry plant, DLL load path/signature/entropy, and downstream
    mpnotify/lsass/winlogon behavior) before escalating. A negative result lowers but does not fully eliminate
    suspicion for this tactic.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - 'NAI: Domain Controllers, Authentication Servers (e.g., ADFS, RADIUS), Critical Workstations (e.g.,
    administrator jump boxes), Enterprise Certificate Authority'
  range: Last 90 days
  queries: &id003
  - technology: ML/pseudocode
    query: "features = extract_pe(provider_dll)  # size, entropy, imports, signed, fleet_prevalence\n\
      score = rf_xgb_model.predict_proba(features)[bad]\nif score > threshold:\n    alert(top3_features=explain(features),\
      \ score=score)"
- question: Has the NetworkProvider Order registry value been modified to add a provider name that is
    not on the allowlist of vendor-documented providers (LanmanWorkstation, RDPNP, webclient, Pnplogon)?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: The list of providers in the
    ''HKLM\System\CurrentControlSet\Control\NetworkProvider\Order'' registry value is modified to include
    a provider name not on an established allowlist. Detection approach (Symbolic Logic): Symbolic Logic:
    Continuously monitor ''HKLM\System\CurrentControlSet\Control\NetworkProvider\Order'' for modification
    (Sysmon Event ID 13 / Windows Event ID 4657). Maintain an explicit allowlist of vendor-documented
    provider names (''LanmanWorkstation'',''RDPNP'',''webclient'',''Pnplogon'') ([Network Provider API](https://learn.microsoft.com/en-us/windows/win32/secauthn/network-provider-api)).
    Trigger on any added name not on the list — the exact mechanism NPPSpy abuses ([NPPSpy PoC](https://github.com/gtworek/PSBits/tree/master/PasswordStealing/NPPSpy)).
    A positive result is a strong lead that an adversary has implanted or is operating a malicious network
    provider DLL to harvest credentials and maintain access; corroborate with the other questions in this
    playbook (registry plant, DLL load path/signature/entropy, and downstream mpnotify/lsass/winlogon
    behavior) before escalating. A negative result lowers but does not fully eliminate suspicion for this
    tactic.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers, Authentication Servers (e.g., ADFS, RADIUS), Critical Workstations (e.g.,
    administrator jump boxes)'
  range: Last 90 days
  queries: &id004
  - technology: SIEM/Rule pseudocode
    query: 'registry_set WHERE target_object = ''HKLM\\System\\CurrentControlSet\\Control\\NetworkProvider\\Order''

      | eval new_names = split(Details, '','')

      | mvexpand new_names

      | where new_names NOT IN (''LanmanWorkstation'',''RDPNP'',''webclient'',''Pnplogon'')

      | alert severity=high'
- question: Is a provider name observed in the Order key present on only a single machine (below the 1st
    percentile of enterprise occurrence), or does the count of entries deviate from the host's baseline?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: The list of providers in the
    ''HKLM\System\CurrentControlSet\Control\NetworkProvider\Order'' registry value is modified to include
    a provider name not on an established allowlist. Detection approach (Statistical Method): Statistical
    Method: Compute enterprise-wide frequency for each provider name observed in the Order key; names
    present on a single machine (< 1st percentile of occurrence) are anomalous ([Using Frequency Analysis
    to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365)).
    Track the State of the value (count of entries vs. baseline) and Frequency of modifications per host
    (baseline ~0). A positive result is a strong lead that an adversary has implanted or is operating
    a malicious network provider DLL to harvest credentials and maintain access; corroborate with the
    other questions in this playbook (registry plant, DLL load path/signature/entropy, and downstream
    mpnotify/lsass/winlogon behavior) before escalating. A negative result lowers but does not fully eliminate
    suspicion for this tactic.'
  answer_sources:
