      | where host_count <= p1  /* present on ~1 machine */

      | table provider_name host_count mods'
- question: Does a one-class autoencoder trained on legitimate Order-value compositions produce a high
    reconstruction error for the current provider list, indicating an anomalous addition or reordering?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: The list of providers in the
    ''HKLM\System\CurrentControlSet\Control\NetworkProvider\Order'' registry value is modified to include
    a provider name not on an established allowlist. Detection approach (Machine Learning): Machine Learning:
    Train a one-class autoencoder on legitimate Order-value compositions/sequences; a high reconstruction
    error flags anomalous additions or reordering ([Malware Detection IoT One-Class](https://pmc.ncbi.nlm.nih.gov/articles/PMC11243998/)).
    Report the specific token(s) driving the error (top-3 contributing positions) in the alert for explainability.
    A positive result is a strong lead that an adversary has implanted or is operating a malicious network
    provider DLL to harvest credentials and maintain access; corroborate with the other questions in this
    playbook (registry plant, DLL load path/signature/entropy, and downstream mpnotify/lsass/winlogon
    behavior) before escalating. A negative result lowers but does not fully eliminate suspicion for this
    tactic.'
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers, Authentication Servers (e.g., ADFS, RADIUS), Critical Workstations (e.g.,
    administrator jump boxes)'
  range: Last 90 days
  queries: &id006
  - technology: ML/pseudocode
    query: "seq = tokenize(order_value)\nrecon_err = autoencoder.reconstruction_error(seq)\nif recon_err\
      \ > threshold:\n    alert(top3_positions=argmax_positions(recon_err), err=recon_err)"
- question: Is a registered network-provider DLL being loaded by a process from a path outside C:\Windows\System32\,
    especially a user-writable location such as C:\ProgramData\, C:\Users\Public\, %APPDATA%, or %TEMP%?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: A DLL registered as a network
    provider is loaded by a process from a non-standard or user-writable file path, such as ''%APPDATA%''
    or ''C:\Users\Public\''. Detection approach (Symbolic Logic): Symbolic Logic: Correlate registry monitoring
    (Sysmon Event ID 13) identifying DLLs under ''HKLM\SYSTEM\CurrentControlSet\Services\<ProviderName>\NetworkProvider''
    with image load events (Sysmon Event ID 7). Alert when a registered provider DLL loads from outside
    ''C:\Windows\System32\''; prioritize user-writable locations (''C:\ProgramData\'',''C:\Users\Public\'',''%APPDATA%'',''%TEMP%'')
    — a core DLL-abuse indicator ([4 Ways Adversaries Hijack DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/),
    [Network Provider API](https://learn.microsoft.com/en-us/windows/win32/secauthn/network-provider-api)).
    A positive result is a strong lead that an adversary has implanted or is operating a malicious network
    provider DLL to harvest credentials and maintain access; corroborate with the other questions in this
    playbook (registry plant, DLL load path/signature/entropy, and downstream mpnotify/lsass/winlogon
    behavior) before escalating. A negative result lowers but does not fully eliminate suspicion for this
    tactic.'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 13
  - Windows Event ID 4624
  - 'NAI: Domain Controllers, Authentication Servers, All Windows Endpoints'
  range: Last 90 days
  queries: &id007
  - technology: SIEM/Rule pseudocode
    query: 'registry_set WHERE target_object LIKE ''HKLM\\SYSTEM\\CurrentControlSet\\Services\\%\\NetworkProvider%''

      | eval prov_dll = registry_provider_path

      | join image_load (Sysmon EID 7) ON ImageLoaded = prov_dll

      | where NOT match(ImageLoaded, ''^C:\\Windows\\System32\\'')

      | where match(ImageLoaded, ''ProgramData|Users\\Public|AppData|Temp'')

      | alert severity=high'
