- question: Is a newly registered network-provider DLL unsigned, carrying an invalid signature, or signed
    by a publisher that is not on the trusted-publisher allowlist?
  context: 'Tactic: Defense Impairment (TA0112). Information requirement: Is the adversary maintaining
    persistence by implanting a malicious network provider DLL? Evidence: A DLL registered as a network
    provider lacks a digital signature, has an invalid signature, or is signed by a publisher not on an
    established allowlist. Detection approach (Symbolic Logic): Symbolic Logic: On a new provider DLL
    (Sysmon Event ID 13), read the signature from its image load (Sysmon Event ID 7). Alert if ''SignatureStatus''
    is ''Unsigned''/''Invalid'' or the ''Signature'' publisher is not on a trusted-publisher allowlist
    ([4 Ways Adversaries Hijack DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/),
    [SigmaHQ](https://github.com/SigmaHQ/sigma)). A positive result is a strong lead that an adversary
    has implanted or is operating a malicious network provider DLL to harvest credentials and maintain
    access; corroborate with the other questions in this playbook (registry plant, DLL load path/signature/entropy,
    and downstream mpnotify/lsass/winlogon behavior) before escalating. A negative result lowers but does
    not fully eliminate suspicion for this tactic.'
  answer_sources:
  - Sysmon Event ID 7
  - Sysmon Event ID 13
  - 'NAI: Domain Controllers, Authentication Servers, Critical Workstations, All Windows Endpoints'
  range: Last 90 days
  queries: &id010
  - technology: SIEM/Rule pseudocode
    query: "registry_set (Sysmon EID 13) new provider DLL\n| join image_load (Sysmon EID 7) ON ImageLoaded\
      \ = provider_dll\n| where SignatureStatus IN ('Unsigned','Invalid')\n   OR Signature NOT IN (trusted_publisher_allowlist)\n\
      | alert severity=high"
