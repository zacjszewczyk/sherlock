name: 'T1110.002: Password Cracking'
id: 16020549-9d22-4ff8-bf53-f3727a3bc72c
description: 'This playbook helps an analyst determine whether an adversary has obtained usable credentials
  through Password Cracking (T1110.002): the offline recovery of plaintext passwords from captured credential
  material such as Windows SAM/NTDS.dit hashes, LSASS-derived secrets, *nix shadow hashes, or harvested
  network-device configuration hashes, typically cracked on adversary-controlled systems with tools like
  Hashcat, John the Ripper, Cain & Abel, ophcrack, or rcracki/rainbow tables. Because the cracking itself
  usually happens off-network, this playbook stitches together the observable precursors and consequences:
  (1) transfer or execution of password-cracking utilities and the high CPU/GPU and large wordlist/dictionary
  I/O they generate; (2) credential-dumping command lines (Mimikatz sekurlsa/lsadump, ntdsutil IFM, vssadmin
  shadow copies, reg save of SAM/SYSTEM) that acquire the hashes; (3) non-allowlisted process access to
  LSASS memory, the SAM file, or NTDS.dit; (4) anomalous successful authentications - especially logons
  with zero preceding failures from a novel source for an account whose hash was recently dumped, consistent
  with a directly-used cracked credential; and (5) correlated credential-theft sequences (dump -> large
  egress -> external login), including the network-device path (TFTP config exfil, Cisco Smart Install
  port 4786, SNMP harvesting) called out in CISA TA18-106A. Detection blends deterministic IOC/regex rules
  (the precise, tunable floor), statistical baselining (per-host GPU/CPU and I/O profiles, command-argument
  entropy, change-point detection, LSASS read-volume and rarity scoring, geolocation/risk scoring, one-class
  egress volume), and machine learning (obfuscation-aware command classifiers, LSASS access classifiers,
  authentication-graph and sequence models) to produce evasion-resistant, explainable alerts for the Credential
  Access tactic.'
type: technique
