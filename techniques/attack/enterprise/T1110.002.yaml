questions:
- question: 'Using deterministic rule logic, can you identify the transfer or execution of a known password-cracking
    utility on a host that should not be running one? Specifically: alert on Windows Event 4688 / Sysmon
    EID 1 process creation or Zeek files.log file transfers where the file name or hash matches a curated
    cracking-tool list (hashcat, john, hashcat.exe, cain, ophcrack, rcracki) OR where the command line
    contains Hashcat mode/attack syntax such as `-a 0 -m 1000 -r`.'
  context: 'Password cracking is the offline stage of credential access; the cracking binary itself is
    the most direct artifact when it touches the target network (downloaded to staging, copied to a dev
    box with GPUs, or run by an insider). Match the curated tool name/hash list and known Hashcat attack/mode
    flags (per the validated Atomic Red Team T1110.002 emulation) against process-creation and file-transfer
    telemetry. Keep this exact-match list as the deterministic floor and tune an allowlist for legitimate
    security-team systems rather than deleting the rule. A positive hit means a cracking tool is present
    or executing - pivot to where the hashes came from and whether cracked credentials were subsequently
    used; a negative result only means the literal IOCs were absent, so pair it with the statistical and
    ML methods below. Source action (Cracking tool IOC rule): Symbolic Logic: Alert on Windows Event 4688/Sysmon
    EID 1 or Zeek files.log when the file name/hash matches a curated password-cracking tool list (hashcat,
    john, hashcat.exe, cain, ophcrack, rcracki) OR when command line contains hashcat mode/attack syntax
    such as `-a 0 -m 1000 -r` per the validated emulation in [Atomic Red Team T1110.002](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1110.002/T1110.002.md).
    Keep this exact-match list as the deterministic floor; tune the allowlist for legitimate security-team
    systems rather than deleting it.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint workstations, Development servers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Cracking tool IOC rule\nCRACK_NAMES = ['hashcat','hashcat.exe','john','john.exe','cain','ophcrack','rcracki','rcracki_mt']\n\
      MATCH (proc_creation[4688,Sysmon1] OR zeek_files) WHERE\n  lower(file_name|image) IN CRACK_NAMES\n\
      \  OR file_hash IN cracking_tool_hash_list\n  OR cmdline MATCHES /-a\\s*[0-9]+.*-m\\s*[0-9]+|-m\\\
      s*[0-9]+.*-a\\s*[0-9]+|--wordlist|\\.potfile/\nAND host NOT IN security_team_allowlist\nTHEN alert(severity='high',\
      \ enrich=[image,hash,cmdline,user,parent])"
- question: 'Using statistical baselining, can you detect the sustained high CPU/GPU utilization and large
    dictionary/wordlist reads that characterize local password cracking, even when the binary is renamed?
    Specifically: profile per-host CPU/GPU utilization and hash/wordlist file reads, and flag processes
    that read wordlist files >100MB or sustain >90% GPU for >5 minutes on hosts that normally do neither,
    using baseline+3 sigma thresholds derived per host.'
  context: 'Cracking is compute-bound: it pegs the GPU (or CPU) for sustained periods and streams very
    large wordlist/dictionary files. By baselining each host''s normal utilization over ~30 days and computing
    dataset-specific sigma (per Dwyer & Truta), you can flag hosts that suddenly exhibit a cracking workload
    regardless of the tool''s name. The reading of a >100MB wordlist combined with >90% GPU for >5 minutes
    on a host that normally does neither is a strong behavioral signal for the Credential Access tactic.
    Surface the deviating metric (GPU %, sustained duration, wordlist bytes read) in the alert. A positive
    result warrants confirming the process identity and the source of any hash files; a low-and-slow cracker
    run elsewhere will not appear here, so combine with dump/access evidence. Source action (GPU/compute
    volume baseline): Statistical Method: Profile per-host sustained high CPU/GPU utilization and large
    hash/wordlist file reads. Flag processes that read wordlist/dictionary files >100MB or sustain >90%
    GPU for >5 min on hosts that normally do neither, using baseline+3σ thresholds derived per-host as
    in [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf). Derive dataset-specific
    σ from 30 days of per-host utilization; surface the deviating metric in the alert.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint workstations, Development servers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: GPU/compute volume baseline\nPER host: baseline mean,sigma\
      \ of gpu_util, cpu_util, wordlist_read_bytes over 30d\nFOR EACH process_session:\n  IF (gpu_util\
      \ > 90% sustained > 5min) OR (wordlist_read_bytes > 100MB)\n     AND metric > host_baseline_mean\
      \ + 3*host_baseline_sigma\n  THEN alert(host, process, deviating_metric=[gpu_util,duration,wordlist_bytes])"
- question: 'Using statistical baselining, can you catch renamed cracking binaries by scoring the entropy
    and token rarity of their command-line arguments? Specifically: score process command arguments by
    entropy and token rarity and flag executions above the 95th percentile for that command name.'
  context: 'Adversaries frequently rename cracking tools (e.g., svchost.exe carrying Hashcat) to evade
    name-based IOCs, but the command line still carries unusual, high-entropy, rare tokens (mode/attack
    flags, rule files, hash-format specifiers, long file paths). By baselining the distribution of argument
    entropy and token rarity per command name and flagging executions above the 95th percentile, you surface
    anomalous invocations even under a benign-looking image name. This is a behavioral complement to the
    IOC rule for the Credential Access tactic. A positive result means the arguments are unusually complex/rare
    for that binary - inspect the full command line and parent process; a negative result indicates ordinary
    usage. Source action (Argument entropy baseline): Statistical Method: Score process command arguments
    by entropy and token rarity, flagging executions above the 95th percentile for that command name to
    catch renamed cracking binaries.'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint workstations, Development servers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Argument entropy baseline\nPER command_name: baseline distribution\
      \ of shannon_entropy(cmdline) and token_rarity\nFOR EACH proc_creation:\n  e = shannon_entropy(cmdline_tokens)\n\
      \  r = mean_token_rarity(cmdline_tokens)  // inverse global token frequency\n  IF e > p95(command_name)\
      \ OR r > p95(command_name)\n  THEN alert(image, cmdline, entropy=e, rarity=r)"
- question: 'Using a machine-learning model, can you classify obfuscated or renamed cracking/dump command
    lines that evade literal signatures? Specifically: apply NLP/token command-line models with active
    learning to catch renamed/obfuscated cracking and dump tools, deploying AMIDES-style rule-evasion
    detection that preserves signature precision and surfaces the top-3 contributing tokens in the alert.'
  context: 'Sophisticated actors pad, reorder, and obfuscate command lines to defeat regex rules. NLP/token
    classifiers (Wang et al.) trained with active learning (Ongun et al.) generalize beyond exact strings,
    and AMIDES specifically targets rule-evasion while preserving the precision of existing signatures.
    Deploying this over process-creation telemetry for the Credential Access tactic catches cracking and
    dump invocations that the deterministic floor misses. Always surface the top-3 contributing tokens
    so an analyst can validate the verdict; a high-confidence positive should be triaged like an IOC hit,
    while explainability lets you dismiss benign false positives quickly. Source action (Obfuscated cracking-command
    classifier): Machine Learning: Classify command lines with NLP/token models per [Wang et al.](https://doi.org/10.1007/978-3-030-12942-2_13)
    and active-learning per [Ongun et al.](https://arxiv.org/abs/2111.15039) to catch renamed/obfuscated
    cracking and dump tools; deploy AMIDES-style rule-evasion detection that preserves signature precision
    and surfaces the top-3 contributing tokens in the alert per [AMIDES](https://www.usenix.org/system/files/usenixsecurity24-uetz.pdf)
    ([code](https://github.com/fkie-cad/amides)).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: Endpoint workstations, Development servers, Network egress points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// ML scoring for: Obfuscated cracking-command classifier\nfeatures = tokenize(cmdline) +\
      \ [image, parent_image, user, entropy, length]\nmodel = NLP_token_classifier(active_learning) +\
      \ AMIDES_rule_evasion\nscore = model.predict(features)\nIF score > threshold THEN\n  alert(score,\
      \ top3_tokens = explain(model, features), image, cmdline)"
- question: 'Using deterministic rule logic, can you detect the credential-dumping commands that acquire
    the hashes destined for offline cracking? Specifically: match patterns such as `sekurlsa`, `lsadump::sam`,
    `ntdsutil ac i ntds`, `vssadmin create shadow`, `reg save HKLM\SAM`, and `reg save HKLM\SYSTEM` in
    Windows 4688 / Sysmon EID 1 and alert.'
  context: 'Password cracking presupposes that hashes were obtained; the dump command is the upstream,
    observable step. Match the literal Mimikatz/ntdsutil/vssadmin/reg-save tokens (aligned to the Sigma
    Mimikatz command-line rule and MITRE T1110.002) on Domain Controllers, member servers, and PAWs. Keep
    these literal patterns as the deterministic floor. A positive hit is a high-value lead - immediately
    scope which accounts'' hashes were exposed so you can watch those accounts for the zero-prior-failure
    logons in the authentication evidence; a negative result does not rule out LOLBin or API-based dumping,
    so combine with LSASS-access and statistical methods. Source action (Credential dump regex rule):
    Symbolic Logic: Match credential-dumping command patterns (`sekurlsa`, `lsadump::sam`, `ntdsutil ac
    i ntds`, `vssadmin create shadow`, `reg save HKLM\SAM`, `reg save HKLM\SYSTEM`) in Windows 4688/Sysmon
    EID 1 and alert, aligned to [MITRE T1110.002](https://attack.mitre.org/techniques/T1110/002/) and
    the token logic in [Sigma Mimikatz command line](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml).
    Keep these literal patterns as the deterministic floor.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations (PAWs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Credential dump regex rule\nMATCH proc_creation[4688,Sysmon1]\
      \ WHERE cmdline MATCHES\n  /sekurlsa|lsadump::sam|lsadump::lsa|ntdsutil.*ac\\s+i\\s+ntds|vssadmin\\\
      s+create\\s+shadow|reg\\s+save\\s+HKLM\\\\SAM|reg\\s+save\\s+HKLM\\\\SYSTEM/i\nTHEN alert(severity='high',\
      \ host, user, cmdline, parent_image)"
- question: 'Using statistical baselining, can you flag abnormal ntdsutil/vssadmin usage that indicates
    credential-store extraction outside legitimate backup activity? Specifically: baseline ntdsutil.exe/vssadmin
    usage per host and flag if the `ifm` subcommand or shadow-copy creation executes outside typical backup
    systems (>0 occurrences on non-backup hosts) or outside the scheduled backup window.'
  context: 'ntdsutil''s Install-From-Media (IFM) and vssadmin shadow copies are legitimate backup operations
    on backup infrastructure but are classic NTDS.dit extraction techniques elsewhere. Baseline which
    hosts and time windows normally run these, then flag any IFM/shadow creation on a non-backup host
    or outside the backup window as anomalous for the Credential Access tactic. Because the legitimate
    baseline is narrow, even a single occurrence off-baseline (>0 on non-backup hosts) is meaningful.
    A positive result means a DC/server is being dumped of its credential store - escalate and identify
    affected accounts; a negative result reflects normal backup behavior. Source action (ntdsutil IFM
    scoring): Statistical Method: Baseline ntdsutil.exe/vssadmin usage per host and flag if the `ifm`
    subcommand or shadow-copy creation executes outside typical backup systems (>0 occurrences on non-backup
    hosts) or outside the scheduled backup window.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations (PAWs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: ntdsutil IFM scoring\nbackup_hosts = known_backup_infrastructure\n\
      backup_window = scheduled_backup_times\nFOR EACH ntdsutil|vssadmin execution:\n  IF (cmdline CONTAINS\
      \ 'ifm' OR 'create shadow')\n     AND (host NOT IN backup_hosts OR time NOT IN backup_window)\n\
      \  THEN alert(host, user, cmdline, count_on_host_vs_baseline)"
- question: 'Using statistical baselining, can you detect a sudden spike in credential-dumping command
    frequency via change-point analysis? Specifically: apply CUSUM/PELT/Bayesian change-point detection
    to per-host ntdsutil/vssadmin/reg-save execution counts to capture sudden frequency spikes outside
    backup windows, reporting the change-point time and pre/post rates.'
  context: 'Beyond single occurrences, a campaign may dramatically increase the rate of dump-related commands.
    Change-point detectors (CUSUM/PELT/Bayesian, per Aminikhanghahi & Cook) identify the moment a host''s
    execution-count time series shifts regime, which is robust to slow baseline drift and surfaces bursts
    that fixed thresholds miss. Applied to ntdsutil/vssadmin/reg-save counts for the Credential Access
    tactic, a detected change-point outside the backup window with a higher post-rate indicates emerging
    credential-theft activity. Report the change-point timestamp and the pre/post rates so the analyst
    can scope the window; absence of a change-point means steady-state behavior. Source action (Dump-frequency
    change-point detector): Statistical Method: Apply CUSUM/PELT/Bayesian change-point detection per [Aminikhanghahi
    & Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/) to per-host ntdsutil/vssadmin/reg-save
    execution counts to capture sudden frequency spikes outside backup windows; report the change-point
    time and pre/post rates in the alert.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations (PAWs)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Dump-frequency change-point detector\nseries = per_host hourly\
      \ count(ntdsutil|vssadmin|reg save)\ncp = changepoint_detect(series, method='CUSUM|PELT|Bayesian')\n\
      FOR EACH cp WHERE post_rate > pre_rate AND time NOT IN backup_window:\n  alert(host, changepoint_time=cp.t,\
      \ pre_rate, post_rate)"
- question: 'Using a machine-learning model, can you flag credential-dump commands that evade literal
    patterns through renaming, padding, or argument reordering? Specifically: apply NLP/active-learning
    command-line models and rule-evasion-aware AMIDES to flag evasive dump commands, emitting the top-3
    contributing tokens.'
  context: 'Adversaries obfuscate dump commands (encoded PowerShell, renamed binaries, reordered/padded
    arguments) to slip past the credential-dump regex rule. The NLP/active-learning models of Ongun et
    al. plus AMIDES rule-evasion detection generalize to these variants while preserving signature precision,
    applied to process-creation telemetry for the Credential Access tactic. Emit the top-3 contributing
    tokens so analysts can confirm the verdict and tune. A confident positive should be triaged like a
    direct dump-rule hit and scoped to affected accounts; explainability supports fast dismissal of benign
    matches. Source action (Obfuscated dump-command classifier): Machine Learning: Apply the NLP/active-learning
    command-line models of [Ongun et al.](https://arxiv.org/abs/2111.15039) and rule-evasion-aware [AMIDES](https://www.usenix.org/system/files/usenixsecurity24-uetz.pdf)
    to flag dump commands that evade literal patterns (renaming, padding, argument reordering), emitting
    the top-3 contributing tokens.'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations (PAWs)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// ML scoring for: Obfuscated dump-command classifier\nfeatures = tokenize(cmdline) + [image,\
      \ parent_image, user, entropy, length]\nmodel = NLP_token_classifier(active_learning) + AMIDES_rule_evasion\n\
      score = model.predict(features)\nIF score > threshold THEN\n  alert(score, top3_tokens = explain(model,\
      \ features), host, user, cmdline)"
- question: 'Using deterministic rule logic, can you detect a non-allowlisted process opening LSASS memory
    or reading SAM/NTDS.dit to harvest hashes? Specifically: alert when a non-allowlisted process requests
    LSASS memory rights (access masks 0x1010/0x1410/0x143a) or reads SAM/NTDS.dit, using access-mask and
    call-trace logic (dbghelp.dll/dbgcore.dll) on Sysmon EID 10 / Windows 4656/4663.'
  context: 'Reading LSASS process memory or the SAM/NTDS.dit files is the canonical way to obtain the
    hashes that are then cracked offline. The Sigma LSASS memdump logic keys on specific access masks
    (0x1010/0x1410/0x143a) and dump-related call traces through dbghelp.dll/dbgcore.dll, applied to Sysmon
    process-access (EID 10) and Windows object-access (4656/4663) events with a tuned allowlist of legitimate
    accessors (AV/EDR/LSASS protection). A positive result is a strong credential-theft indicator for
    the Credential Access tactic - identify the source process, parent, and user, and treat any hashes
    as compromised; a negative result should be backed up by the read-volume and rarity scoring below
    to catch handle-duplication and stealthier access. Source action (LSASS access rule): Symbolic Logic:
    Alert when a non-allowlisted process requests LSASS memory rights (access masks 0x1010/0x1410/0x143a)
    or reads SAM/NTDS.dit, using the access-mask and call-trace logic (dbghelp.dll/dbgcore.dll) of [Sigma
    LSASS memdump](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_access/proc_access_win_lsass_memdump.yml)
    on Sysmon EID 10 / Windows 4656/4663.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: LSASS access rule\nMATCH (Sysmon10 access OR 4656/4663 object_access)\
      \ WHERE\n  (TargetImage ENDSWITH 'lsass.exe' AND GrantedAccess IN ['0x1010','0x1410','0x143a'])\n\
      \  OR ObjectName IN ['\\\\Windows\\\\System32\\\\config\\\\SAM','\\\\NTDS\\\\ntds.dit']\nAND SourceImage\
      \ NOT IN lsass_access_allowlist\nAND (CallTrace CONTAINS 'dbghelp.dll' OR 'dbgcore.dll' OR ObjectName\
      \ matches SAM/NTDS)\nTHEN alert(severity='high', SourceImage, parent, user, GrantedAccess)"
- question: 'Using statistical baselining, can you distinguish credential-theft LSASS access from benign
    access by the volume of memory read? Specifically: model each LSASS access session by total bytes
    read and number of read operations and flag sessions whose volume matches credential-theft profiles
    rather than benign access; derive thresholds from your own benign baseline and report bytes-read in
    the alert.'
  context: 'Many processes open handles to LSASS for benign reasons, but credential theft reads large
    regions of LSASS memory (or repeatedly), producing a distinct bytes-read/read-count profile (per Ah-Fat
    et al., RAID 2020). Baseline benign LSASS access volume in your environment, then flag sessions whose
    read volume matches the credential-theft profile for the Credential Access tactic. Reporting bytes-read
    and read-count in the alert lets the analyst judge severity. A positive result indicates a likely
    memory dump rather than a metadata query; a low-volume access is more likely benign but should still
    be cross-checked against the rarity score. Source action (LSASS read-volume scoring): Statistical
    Method: Model each LSASS access session by total bytes read and number of read operations and flag
    sessions whose volume matches credential-theft profiles rather than benign access, per [Ah-Fat et
    al. (RAID 2020)](https://www.usenix.org/system/files/raid20-ah-fat.pdf); derive thresholds from your
    own benign baseline and report bytes-read in the alert.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: LSASS read-volume scoring\nbaseline benign LSASS sessions:\
      \ dist(total_bytes_read, read_op_count)\nFOR EACH lsass_access_session:\n  IF total_bytes_read >>\
      \ benign_p99 OR read_op_count >> benign_p99\n  THEN alert(SourceImage, user, bytes_read=total_bytes_read,\
      \ reads=read_op_count)"
- question: 'Using statistical baselining, can you surface rare, never-before-seen processes accessing
    LSASS across the fleet? Specifically: score `(SourceImage, TargetImage, CallTrace)` tuples and flag
    accessors observed on <1% of hosts or <5 times in 30 days, with standard-deviation baselining.'
  context: 'Legitimate LSASS accessors are few and ubiquitous; a malicious accessor is typically rare
    across the fleet. By scoring the rarity of (SourceImage, TargetImage, CallTrace) tuples (per Dwyer
    & Truta) and flagging those seen on under 1% of hosts or fewer than 5 times in 30 days, you catch
    novel tools and renamed binaries touching LSASS for the Credential Access tactic. A positive (rare)
    result is a strong lead even when access masks look ordinary; commonness across many hosts lowers
    suspicion but does not exonerate, so combine with the read-volume and access-rule signals. Source
    action (LSASS rarity scoring): Statistical Method: Score `(SourceImage, TargetImage, CallTrace)` tuples
    and flag accessors observed on <1% of hosts or <5 times in 30 days, with standard-deviation baselining
    per [Dwyer & Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: LSASS rarity scoring\nFOR EACH lsass access tuple t=(SourceImage,TargetImage,CallTrace):\n\
      \  host_prevalence = distinct_hosts(t)/total_hosts\n  freq30d = count(t over 30d)\n  IF host_prevalence\
      \ < 0.01 OR freq30d < 5\n  THEN alert(tuple=t, host_prevalence, freq30d)"
- question: 'Using a machine-learning model, can you classify malicious LSASS access from its full behavioral
    context? Specifically: train a classifier on source/parent/user context, access mask, call-stack rarity,
    and bytes-read/read-count features to classify malicious LSASS accesses, surfacing the top-3 contributing
    features in the alert.'
  context: 'Single heuristics (mask, volume, rarity) each miss some attacks; a classifier that fuses source/parent/user
    context, the requested access mask, call-stack rarity, and the bytes-read/read-count features (per
    Ah-Fat et al.) produces a higher-fidelity verdict on LSASS access for the Credential Access tactic.
    Surface the top-3 contributing features so an analyst can validate the call. A high-confidence positive
    should be treated as credential theft and the affected hashes considered compromised; explainability
    lets you tune away benign EDR/AV access patterns. Source action (LSASS access classifier): Machine
    Learning: Train a classifier on source/parent/user context, access mask, call-stack rarity, and bytes-read/read-count
    features (per [Ah-Fat et al.](https://www.usenix.org/system/files/raid20-ah-fat.pdf)) to classify
    malicious LSASS accesses; surface the top-3 contributing features in the alert text.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Sysmon Event ID 10
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "// ML scoring for: LSASS access classifier\nfeatures = [SourceImage, parent_image, user, GrantedAccess,\n\
      \            calltrace_rarity, total_bytes_read, read_op_count, host_prevalence]\nmodel = GBM|RandomForest(trained\
      \ on labeled benign/malicious LSASS access)\nscore = model.predict(features)\nIF score > threshold\
      \ THEN\n  alert(score, top3_features = SHAP(model, features), SourceImage, user)"
- question: 'Using deterministic rule logic, can you flag successful logons by privileged or recently-dumped
    accounts from known-malicious IPs? Specifically: alert on Windows 4624 (logon type 2/3/10) for privileged
    or recently-dumped accounts originating from threat-intel-listed malicious IPs.'
  context: 'Once a hash is cracked, the plaintext is used to log in directly. A successful interactive/network/RDP
    logon (types 2/3/10) by a privileged account - or one whose hash was recently observed dumped - from
    a threat-intel-flagged malicious IP is a high-confidence indicator that cracked credentials are being
    used for the Credential Access tactic. A positive result should trigger immediate containment of the
