name: 'T1592.004: Client Configurations'
id: f9832069-7f4c-4253-99b8-564f8de667d2
description: 'Investigate whether an adversary is actively gathering your organization''s client configuration
  details (OS/version, virtualization, architecture, language, time zone, browser/TLS stack) for targeting.
  This playbook helps an analyst hunt for: outbound connections to known reconnaissance, watering-hole,
  or client-fingerprinting infrastructure (e.g., ScanBox); outbound HTTP requests carrying fingerprinting
  script names, dense Client-Hint/attribute-harvesting headers, or anomalous User-Agent/JA4 stacks; inbound
  active scanning that touches many internal hosts or ports in a short window; per-client anomalies in
  DNS unique-domain query rates, NXDOMAIN volume, and HTTP header structure; and local system-enumeration
  commands that immediately precede outbound connections to newly observed external IPs. It pairs deterministic
  threat-intel and signature matching with statistical baselining (entropy/KL, SPRT, 3-sigma, TF-IDF)
  and machine-learning methods (DGA detection, Random Forest, Isolation Forest, DBSCAN, HMM, LSTM) so
  analysts can detect client-configuration reconnaissance across network and endpoint telemetry.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are any internal hosts establishing outbound connections to domains or IP addresses on our
    threat-intel blocklist of reconnaissance, watering-hole, or client-fingerprinting infrastructure (e.g.,
    the TA423/ScanBox IOC set)?
  context: 'Under Reconnaissance, adversaries collecting client configuration data often host or redirect
    victims to fingerprinting and watering-hole infrastructure (ScanBox). Deterministically matching Zeek
    conn.log/dns.log/http.log destinations against a CTI-curated blocklist of recon/watering-hole/ScanBox
    domains and IPs gives a high-fidelity early warning. Keep the blocklist refreshed from feeds. A match
    means an internal client touched known-malicious recon infrastructure and should be triaged immediately;
    no match lowers but does not eliminate suspicion since infrastructure rotates. Detection method: Symbolic
    Logic. Source guidance: Symbolic Logic: Alert when Zeek conn.log/dns.log/http.log destinations match
    CTI-derived reconnaissance/watering-hole/ScanBox domains and IPs (e.g., the TA423 ScanBox IOC set)
    ([Chasing Currents: ScanBox, Proofpoint & PwC](https://www.proofpoint.com/us/blog/threat-insight/chasing-currents-espionage-south-china-sea));
    maintain as a deterministic blocklist refreshed from feeds.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Corporate web proxy, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: INPUT conn.log, dns.log, http.log; LOAD ti_blocklist = recon/wateringhole/ScanBox domains+IPs
      (refresh from feeds); ALERT WHERE dest_ip IN ti_blocklist OR query IN ti_blocklist OR http.host
      IN ti_blocklist
- question: Does any internal client present a JA4/JA4H TLS+HTTP fingerprint that fails our approved-browser
    allowlist even though its User-Agent claims to be a standard browser?
  context: 'Reconnaissance toolkits frequently spoof a browser User-Agent while their underlying TLS stack
    and HTTP header ordering differ from real browsers. Computing JA4/JA4H fingerprints from Zeek ssl.log/http.log
    and comparing them to an allowlist of approved browser fingerprints exposes this mismatch. A User-Agent
    that claims Chrome/Firefox but whose JA4 does not match any approved browser stack strongly indicates
    an automated/custom client doing fingerprinting or callback. A clean match suggests a legitimate browser.
    Detection method: Symbolic Logic. Source guidance: Symbolic Logic: Alert when a client''s JA4/JA4H
    fingerprint (TLS stack + HTTP header order) on Zeek ssl.log/http.log fails to match the approved-browser
    allowlist while the User-Agent claims to be a browser ([JA4+ Suite, FoxIO](https://github.com/FoxIO-LLC/ja4)).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Corporate web proxy, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'FOR each ssl/http session: COMPUTE ja4 = JA4(tls), ja4h = JA4H(http_headers); ALERT WHERE
      user_agent ~ /Chrome|Firefox|Edge|Safari/ AND ja4 NOT IN approved_browser_allowlist'
- question: Which internal hosts are contacting rare (<0.1% org prevalence) or newly registered domains
    while also exceeding baselines for bytes out, callback frequency, or DNS/connection failure rates
    (NXDOMAIN/REJ)?
  context: 'Recon callbacks tend to go to destinations almost no one else in the org contacts, or to freshly
    registered domains, and they often generate elevated failure rates as automation probes infrastructure.
    Profiling per-host destination prevalence, cumulative bytes out, callbacks per minute, and NXDOMAIN/REJ
    counts against a reference baseline (e.g., the Unified Host and Network Data Set) surfaces hosts whose
    behavior deviates. Treat NXDOMAIN volume as its own recon signal. High deviation on multiple dimensions
    is a strong lead; isolated rarity may be benign. Detection method: Statistical Method. Source guidance:
    Statistical Method: Flag hosts whose destinations are rare (<0.1% org prevalence) or newly registered,
    and whose cumulative per-host volume (bytes out), frequency (callbacks/min), and failure rate (NXDOMAIN/REJ
    counts) exceed baselines derived from a reference set like the [Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518);
    profile NXDOMAIN volume as a distinct recon signal.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Corporate web proxy, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE org_prevalence(domain), per_host bytes_out, callbacks_per_min, nxdomain_cnt, rej_cnt;
      ALERT WHERE prevalence(domain)<0.001 OR domain_age<30d, AND (bytes_out>baseline OR callbacks_per_min>baseline
      OR nxdomain_cnt>baseline)
- question: Do any non-allowlisted destination FQDNs score as algorithmically generated based on Shannon
    entropy and KL divergence from natural-language n-gram baselines?
  context: 'Algorithmically generated domains used for recon callbacks have character distributions unlike
    human-readable names. Scoring unallowlisted FQDNs with Shannon entropy and KL divergence against natural-language
    n-gram baselines flags high-entropy, low-linguistic-probability domains. High scores indicate likely
    DGA/recon callback domains worth investigating; low scores are consistent with normal domains. This
    is a lightweight statistical pre-filter that complements the ML DGA model. Detection method: Statistical
    Method. Source guidance: Statistical Method: Score unallowlisted FQDNs with Shannon entropy and KL
    divergence against natural-language n-gram baselines, flagging algorithmically generated recon callback
    domains ([Downing, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Corporate web proxy, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR fqdn NOT IN allowlist: e = shannon_entropy(fqdn); kl = KL(ngram(fqdn) || natural_language_ngram);
      ALERT WHERE e > e_thresh AND kl > kl_thresh'
- question: Does a trained DGA-detection model classify any non-allowlisted domains contacted by internal
    hosts as algorithmically generated, and what are the top-3 features driving each classification?
  context: 'A supervised DGA model using entropy, Levenshtein distance, and n-gram lexical features can
    detect recon callback domains more accurately than single statistics. Run it over unallowlisted domains
    and require the alert to list the top-3 contributing features (e.g., entropy, vowel ratio, length)
    so analysts can validate. A high-confidence DGA classification on a domain an internal host is calling
    out to is a strong reconnaissance/C2-staging indicator; feature explanations let the analyst confirm
    or dismiss false positives. Detection method: Machine Learning. Source guidance: Machine Learning:
    Run a DGA detection model on unallowlisted domains using entropy, Levenshtein, and n-gram lexical
    features ([NIOM-DGA, Computers & Security 2025](https://www.sciencedirect.com/science/article/pii/S0167404825002500));
    alert text must list the top-3 contributing features (e.g., entropy, vowel ratio, length).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Corporate web proxy, DNS resolvers, and network egress points.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: features = [entropy, levenshtein, ngram_lexical, vowel_ratio, length]; score = DGA_model.predict(features);
      ALERT WHERE score>thresh; EMIT top3_features(score)
- question: Do any outbound HTTP requests contain known client-fingerprinting script names (e.g., fingerprint.js),
    ScanBox plugin URIs/POST patterns, or anomalous User-Agents matched by community Sigma rules?
  context: 'Client fingerprinting toolkits like ScanBox leave recognizable artifacts in URIs, parameters,
    request bodies, and User-Agent strings. Matching Zeek http.log against community rules (SigmaHQ) and
    curated ScanBox patterns provides high-fidelity detection of in-progress client-configuration harvesting
    under Reconnaissance. A match means a client loaded or posted to fingerprinting tooling, indicating
    a likely watering-hole or phishing-for-information attack; the visited site should be reviewed for
    compromise. Detection method: Symbolic Logic. Source guidance: Symbolic Logic: Alert when Zeek http.log
    URIs, parameters, or bodies match known client-fingerprinting script names/parameters (e.g., fingerprint.js,
    ScanBox plugin URIs/POST patterns) and anomalous User-Agents via community rules ([SigmaHQ](https://github.com/SigmaHQ/sigma);
    [Chasing Currents: ScanBox](https://www.proofpoint.com/us/blog/threat-insight/chasing-currents-espionage-south-china-sea)).'
  answer_sources:
  - Zeek http.log
  - 'NAI: Corporate web proxy, network egress points, and any device capable of making outbound HTTP requests.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: INPUT http.log; ALERT WHERE uri ~ /fingerprint\.js/ OR uri/params/body MATCH scanbox_patterns
      OR user_agent IN anomalous_ua_list (sigma rules)
- question: Does any single request or page session emit a dense set of fingerprinting attributes (≥3
    Sec-CH-UA-*/Client-Hint headers, or canvas/WebGL/font-enumeration calls) characteristic of fingerprinting
    scripts?
  context: 'Browser-fingerprinting scripts harvest many client attributes at once. Detecting requests
    or sessions that emit three or more Client-Hint headers, or that trigger canvas/WebGL/font enumeration,
    identifies active client-attribute harvesting. A dense burst of these attributes from a single page
    session is characteristic of fingerprinting (per Laperdrix et al.) rather than normal browsing, and
    indicates the visited content is profiling the client''s configuration. Detection method: Symbolic
    Logic. Source guidance: Symbolic Logic: Alert when a single request or page session emits a dense
    set of fingerprinting attributes (≥3 Sec-CH-UA-* / Client-Hint headers, canvas/WebGL/font-enumeration
    calls) characteristic of fingerprinting scripts ([Browser Fingerprinting: A Survey, Laperdrix et al.](https://arxiv.org/pdf/1905.01051)).'
  answer_sources:
  - Zeek http.log
  - 'NAI: Corporate web proxy, network egress points, and any device capable of making outbound HTTP requests.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'PER request OR page_session: cnt = count(headers MATCH /Sec-CH-UA|Client-Hint/) + count(canvas|webgl|font_enum
      calls); ALERT WHERE cnt>=3'
- question: Which outbound HTTP requests have query-string entropy/KL divergence above the per-site 99th-percentile
    baseline, or POST body byte-volumes that deviate from the page's norm (possible config-blob exfil)?
  context: 'Fingerprinting toolkits encode collected configuration data into long, high-entropy query
    strings or large POST bodies. Flagging requests whose query-string entropy/KL divergence exceeds the
    per-site 99th percentile, and whose POST byte volume deviates from the page norm, surfaces likely
    config-blob exfiltration. High-entropy queries or anomalously large POSTs to a given site suggest
    data harvesting rather than normal interaction. Detection method: Statistical Method. Source guidance:
    Statistical Method: Flag requests whose query-string entropy/KL divergence exceeds the per-site 99th-percentile
    baseline, and whose POST body byte-volume (config-blob exfil) deviates from the page''s norm ([Downing,
    Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)).'
  answer_sources:
  - Zeek http.log
  - 'NAI: Corporate web proxy, network egress points, and any device capable of making outbound HTTP requests.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE per_site query_entropy_p99, post_bytes_norm; ALERT WHERE entropy(query_string)>p99
      OR KL(query)>thresh OR post_body_bytes >> post_bytes_norm
- question: Does any host's outbound HTTP application fingerprint (header set/order, User-Agent, language)
    deviate from its established per-host baseline?
  context: 'DECANTeR-style profiling builds a per-host outbound HTTP fingerprint from the set and order
    of headers, User-Agent, and language. Deviations from a host''s learned baseline can reveal a new
    automated client (fingerprinting script or implant) operating from that host. A structural shift in
    a host''s HTTP fingerprint, especially toward unusual header orderings or User-Agents, is a behavioral
    signal of recon/fingerprinting tooling that complements signature matching. Detection method: Statistical
    Method. Source guidance: Statistical Method: Build a per-host outbound HTTP application fingerprint
    (header set/order, User-Agent, language) and flag deviations from the established baseline ([DECANTeR,
    Bortolameotti et al.](https://doi.org/10.1145/3134600.3134605)).'
  answer_sources:
  - Zeek http.log
  - 'NAI: Corporate web proxy, network egress points, and any device capable of making outbound HTTP requests.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: BUILD per_host_fp = {header_set, header_order, user_agent, accept_language}; ALERT WHERE current_request_fp
      != baseline_fp(host)
- question: Does a Random Forest classifier flag any outbound HTTP requests as fingerprinting based on
    URI length, query-param count, header count/order, and User-Agent, and what top-3 features drive each
    high-confidence hit?
  context: 'A Random Forest trained on features such as URI length, query-parameter count, header count/order,
    and User-Agent (per DECANTeR) can classify fingerprinting requests with high confidence. Require the
    alert to surface the top-3 contributing features so analysts can validate. High-confidence positives
    indicate automated client-configuration harvesting; the feature breakdown helps distinguish true fingerprinting
    from benign requests with unusual structure. Detection method: Machine Learning. Source guidance:
    Machine Learning: Score requests with a Random Forest on features like URI length, query-param count,
    header count/order, and User-Agent, flagging high-confidence fingerprinting and surfacing the top-3
    contributing features in the alert ([DECANTeR, Bortolameotti et al.](https://doi.org/10.1145/3134600.3134605)).'
  answer_sources:
  - Zeek http.log
  - 'NAI: Corporate web proxy, network egress points, and any device capable of making outbound HTTP requests.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: features = [uri_len, query_param_cnt, header_cnt, header_order_hash, user_agent]; p = RF.predict_proba(features);
      ALERT WHERE p>thresh; EMIT top3_features
- question: Do any inbound source IPs match known scanner/TOR/recon lists, and do stateful scan policies
    (distinct dest hosts/ports, S0/REJ/RSTO states) plus the hard floor of >20 unique internal hosts OR
    >50 unique destination ports in 5 minutes trip?
  context: 'Active scanning of external-facing infrastructure is a core Reconnaissance behavior. Matching
    inbound Zeek conn.log sources against known scanner/TOR/recon IPs and applying stateful scan policies
    that count distinct destination hosts/ports and connection states (S0/REJ/RSTO) detects probing. Retain
    the deterministic floor: more than 20 unique internal hosts OR more than 50 unique destination ports
    from one source in 5 minutes. Tripping this in the DMZ/VPN edge indicates an external actor mapping
    the attack surface. Detection method: Symbolic Logic. Source guidance: Symbolic Logic: Alert when
    inbound Zeek conn.log sources match known scanner/TOR/recon IPs, and apply stateful scan policies
    counting distinct destination hosts/ports and connection states (S0/REJ/RSTO) ([Paxson, Bro/Zeek](https://www.icir.org/vern/papers/bro-CN99.pdf)).
    Retain the hard floor: >20 unique internal hosts OR >50 unique destination ports from one source in
    5 minutes.'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: External-facing firewalls, DMZ network segments, and VPN concentrators.'
  range: Last 7 days
  queries:
  - technology: Zeek/pseudocode
    query: INPUT inbound conn.log; ALERT WHERE src_ip IN scanner/tor/recon_list OR (distinct_dst_hosts>20
      OR distinct_dst_ports>50 within 5min) WITH state IN (S0,REJ,RSTO)
- question: Does the Threshold Random Walk sequential hypothesis test flag any external source as a scanner
    based on a high failed-to-successful first-contact connection ratio?
  context: 'Scanners contact many hosts they cannot successfully connect to, producing a high REJ/S0 ratio.
    Modeling each first-contact connection''s success/failure as a Bernoulli trial and applying the TRW
    SPRT (Jung et al.) flags scanners after only ~4-5 observations with bounded error. This catches stealthy
    or slow scanners that stay under volumetric thresholds, because it reacts to the failure pattern rather
    than raw counts. A TRW positive on an edge source is strong evidence of active scanning. Detection
    method: Statistical Method. Source guidance: Statistical Method: Model each first-contact connection''s
    success/failure as a Bernoulli trial and apply the Threshold Random Walk SPRT; scanners exhibit a
    high failed-to-successful (REJ/S0) ratio and are flagged after ~4-5 observations with bounded error
    ([Jung et al., TRW](https://www.icir.org/vern/papers/portscan-oak04.pdf)).'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: External-facing firewalls, DMZ network segments, and VPN concentrators.'
  range: Last 7 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FOR each src_ip first-contacts: trial = success?0:1 (REJ/S0=fail); UPDATE TRW_SPRT(likelihood_ratio);
      ALERT WHERE LR crosses scanner_threshold (~4-5 obs)'
- question: Which external sources have unique destination host/port counts or destination-port entropy
    exceeding 3σ over a per-segment baseline?
  context: 'Rather than fixed thresholds alone, computing segment-specific baselines and flagging sources
    whose unique destination host/port counts or destination-port entropy exceed 3 standard deviations
    adapts to local traffic norms (using a reference like the Unified Host and Network Data Set). High
    port-entropy or fan-out beyond the segment baseline indicates horizontal/vertical scanning. This statistical
    approach catches scanning that is anomalous for a given segment even if below global hard floors.
    Detection method: Statistical Method. Source guidance: Statistical Method: Flag sources whose unique
    destination host/port counts or destination-port entropy exceed 3σ over a per-segment baseline; derive
    segment-specific thresholds from local data ([Unified Host and Network Data Set](https://arxiv.org/abs/1708.07518)).'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: External-facing firewalls, DMZ network segments, and VPN concentrators.'
  range: Last 7 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE per_segment mean,std of distinct_dst_hosts, distinct_dst_ports, dst_port_entropy;
      ALERT WHERE metric > mean + 3*std
- question: Does an Isolation Forest flag any external source as anomalous based on its flow vector (connection
    count, destination IP/port entropy, failed-connection ratio), and what are the top-3 contributing
    features?
  context: 'An Isolation Forest scoring per-source flow vectors (connection count, destination IP/port
    entropy, failed-connection ratio) isolates sources whose behavior is statistically distant from normal
    traffic, with no need for labeled data. Surfacing the top-3 features explains why a source was isolated.
    An isolated edge source with high port entropy and failed-connection ratio is a likely scanner; the
    feature breakdown supports rapid triage. Detection method: Machine Learning. Source guidance: Machine
    Learning: Score per-source flow vectors (connection count, destination IP/port entropy, failed-connection
    ratio) with an Isolation Forest and alert on isolated sources, surfacing the top-3 features ([Isolation
    Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363)).'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: External-facing firewalls, DMZ network segments, and VPN concentrators.'
  range: Last 7 days
  queries:
  - technology: SIEM/ML pseudocode
    query: vec = [conn_count, dst_ip_entropy, dst_port_entropy, failed_conn_ratio]; s = IForest.score(vec);
      ALERT WHERE s>thresh; EMIT top3_features
- question: Does DBSCAN clustering of inbound flow features separate any dense scanning clusters from
    benign traffic, and which source IPs belong to those clusters?
  context: 'DBSCAN density-based clustering can separate dense, structurally similar scanning traffic
    from benign background flows without predefining the number of clusters. Sources that fall into a
    dense scan cluster (or appear as outliers relative to normal clusters) are candidate scanners. This
    unsupervised approach complements Isolation Forest and helps identify coordinated or distributed scanning
    campaigns against the edge. Detection method: Machine Learning. Source guidance: Machine Learning:
    Use DBSCAN to separate dense scanning clusters from benign traffic and alert on cluster-member sources.'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: External-facing firewalls, DMZ network segments, and VPN concentrators.'
  range: Last 7 days
  queries:
  - technology: SIEM/ML pseudocode
    query: X = per_source flow_features; labels = DBSCAN(eps,min_samples).fit(X); ALERT src_ip WHERE label
      IN dense_scan_clusters OR label == outlier
- question: Do any outbound requests include ≥3 Sec-CH-UA-*/Client-Hint headers directed to unknown domains,
    indicating active client-attribute harvesting?
  context: 'A request carrying three or more Client-Hint headers to an unknown domain is a strong sign
    the destination is harvesting client attributes (browser, platform, architecture) for Reconnaissance.
    This deterministic rule (per Laperdrix et al.) is cheap and high-signal. A positive means a client
    is volunteering detailed configuration data to an unfamiliar destination, which warrants checking
    whether the site is a watering hole or fingerprinting page. Detection method: Symbolic Logic. Source
    guidance: Symbolic Logic: Alert when requests include ≥3 Sec-CH-UA-* / Client-Hint headers to unknown
    domains, indicating active client-attribute harvesting ([Browser Fingerprinting: A Survey, Laperdrix
    et al.](https://arxiv.org/pdf/1905.01051)).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate DNS resolvers, web proxies, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: INPUT http.log; ALERT WHERE count(headers MATCH /Sec-CH-UA/)>=3 AND http.host NOT IN known_domains
- question: Which clients show a unique-domain DNS query rate or NXDOMAIN failure rate above their own
    98th-percentile baseline?
  context: 'A sudden spike in the number of unique domains a client queries, or in NXDOMAIN responses,
    can indicate recon enumeration or DGA-driven callback attempts. Flagging clients whose unique-domain
    query rate (count/min) or NXDOMAIN rate exceeds their 98th-percentile baseline catches these behaviors,
    and profiling NXDOMAIN volume separately captures the DGA/recon failure mode. A per-client spike beyond
    baseline is a behavioral lead distinct from destination-reputation matching. Detection method: Statistical
    Method. Source guidance: Statistical Method: Flag clients whose unique-domain query rate (frequency,
    count/min) or NXDOMAIN failure rate exceeds their 98th-percentile baseline; profile NXDOMAIN volume
    separately as a recon/DGA failure-mode signal ([Downing, Red Canary](https://redcanary.com/blog/threat-detection/threat-hunting-entropy/)).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate DNS resolvers, web proxies, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: BASELINE per_client unique_domain_rate_p98, nxdomain_rate_p98; ALERT WHERE unique_domain_rate>p98
      OR nxdomain_rate>p98
- question: Does any client's outbound HTTP header structure deviate from its learned per-host fingerprint,
    such as a spike in non-standard header count?
  context: 'Comparing each client''s outbound HTTP header structure to its learned per-host fingerprint
    (DECANTeR) reveals structural deviations like a sudden spike in non-standard or Client-Hint header
    counts. Such a shift can indicate a new fingerprinting script or automated client operating from the
    host. A structural deviation, especially toward many non-standard headers, is a behavioral indicator
    of client-attribute harvesting that complements rate-based DNS detection. Detection method: Statistical
    Method. Source guidance: Statistical Method: Compare each client''s outbound HTTP header structure
    to its learned per-host fingerprint and flag structural deviations such as a spike in non-standard
    header count ([DECANTeR, Bortolameotti et al.](https://doi.org/10.1145/3134600.3134605)).'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate DNS resolvers, web proxies, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: COMPARE client.http_header_structure TO learned_per_host_fp; ALERT WHERE nonstandard_header_count
      >> baseline OR structure_distance>thresh
- question: Does an LSTM/autoencoder trained on per-client DNS unique-domain query-rate time series produce
    high reconstruction errors for any client, and which intervals/features drive them?
  context: 'An LSTM or autoencoder learns each client''s normal DNS unique-domain query-rate time series;
    high reconstruction error flags anomalous temporal spikes consistent with recon enumeration or DGA
    bursts. Requiring the alert to list the top-3 contributing intervals/features lets analysts pinpoint
    when and how the behavior deviated. High reconstruction error on a client''s DNS rate is a strong
    temporal-anomaly lead for Reconnaissance activity. Detection method: Machine Learning. Source guidance:
    Machine Learning: Train an LSTM/autoencoder on per-client DNS unique-domain query-rate time series
    and flag high reconstruction errors; alert text must list the top-3 contributing intervals/features.'
  answer_sources:
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Corporate DNS resolvers, web proxies, and endpoint devices.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ts = per_client unique_domain_query_rate series; err = |ts - LSTM_autoenc.reconstruct(ts)|;
      ALERT WHERE err>thresh; EMIT top3_intervals
- question: Do any hosts run system-enumeration commands (systeminfo, wmic product/os get, reg query HKLM\SOFTWARE)
    recorded in Event ID 4688/4104 within 60 seconds before an outbound connection to a newly observed
    external IP?
  context: 'Local reconnaissance that feeds client-configuration data to an external destination is a
    high-confidence pattern. Correlating system-enumeration commands in Windows Event ID 4688 (process
    creation) and 4104 (PowerShell script block) with a subsequent Zeek conn.log connection to a newly
    observed external IP within 60 seconds, matched against community Sigma rules, ties local discovery
    to egress. A positive sequence (enumerate then call out to a brand-new IP) strongly suggests host
    fingerprinting being exfiltrated under Reconnaissance. Detection method: Symbolic Logic. Source guidance:
