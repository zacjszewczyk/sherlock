- question: When new tasks/services are scored by a classifier using run-as context, trigger details,
    command entropy, executable rarity, and parent-process anomaly, which are flagged as malicious and
    why?
  context: 'A model fuses many weak signals into one decision. Train a gradient-boosting classifier (e.g.,
    XGBoost) to score new tasks/services using features: run-as context (SYSTEM/user), trigger details
    (is_off_hours, is_logon_trigger), command-line entropy, executable rarity, and parent-process anomaly
    (e.g., winword.exe creating a task). Use an Isolation Forest as an unsupervised baseline where labels
    are scarce. Every alert must surface the top-3 contributing features via SHAP. A high score with attributions
    like off-hours trigger + high entropy + anomalous parent is a strong persistence lead; signed, common,
    system-context tasks created by legitimate installers are the benign profile the model should learn
    to pass. Citations: [Liu et al](https://doi.org/10.1145/2133360.2133363); [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
