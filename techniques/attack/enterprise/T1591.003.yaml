name: 'T1591.003: Identify Business Tempo'
id: 07f31a56-8795-4c9d-97fa-568e2044f9a2
description: 'Investigate whether an external adversary is profiling your organization''s business tempo
  (operational hours, days, recurring schedules, and procurement/shipment cadence) as reconnaissance to
  plan future operations, or whether an actor is already leveraging tempo knowledge to act under cover
  of low-visibility windows. Because T1591.003 activity (Identify Business Tempo) largely occurs outside
  the target''s visibility, this playbook pivots to detectable downstream signals: confirmed communication
  with known reconnaissance infrastructure (IP/domain/JA3-JA4 fingerprint matches), low-and-slow probing
  of public-facing authentication services (VPN/OWA/SSO) with no associated logons, long-duration high-variety
  port scanning, privileged account activity during defined non-business hours that deviates from baseline,
  and scheduled tasks/services configured to fire off-hours with suspicious actions. For each, symbolic-logic,
  statistical, and machine-learning methods are provided to detect and triage the behavior across network
  (Zeek) and endpoint (Windows Event) telemetry.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did any internal or perimeter host communicate with IPs, domains, or TLS fingerprints that
    match a threat-intelligence feed of known reconnaissance infrastructure?
  context: 'During Reconnaissance an adversary frequently fronts tempo-profiling and probing from infrastructure
    or tooling already catalogued in threat intelligence. Continuously matching source/destination IPs,
    requested domains, and TLS client fingerprints (JA3/JA3S, and version-agnostic JA4+ to resist randomized-extension
    evasion) in Zeek conn.log, dns.log, and ssl.log against a curated recon-infrastructure feed surfaces
    confirmed contact. A match is high-confidence, but apply connection-state/port logic to confirm probing
    rather than benign access, and allowlist ubiquitous research scanners (Shodan/Censys) to suppress
    noise. A positive result means a host touched known recon infrastructure and warrants immediate enrichment
    and pivot; a negative result lowers but does not eliminate suspicion since recon often uses fresh
    infrastructure. Citations: [JA3, Salesforce](https://github.com/salesforce/ja3); [JA4+, FoxIO](https://github.com/FoxIO-LLC/ja4);
    [Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5); [Durumeric et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Perimeter firewalls, forward/reverse proxies, public-facing DNS servers, and external-facing
    web application firewalls (WAFs).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "LOAD conn.log, dns.log, ssl.log\nJOIN ti_feed ON (id.orig_h IN ti.ips OR id.resp_h IN ti.ips\n\
      \  OR dns.query IN ti.domains OR ssl.ja3 IN ti.ja3 OR ssl.ja4 IN ti.ja4)\nWHERE src NOT IN benign_scanner_allowlist\n\
      EMIT high_priority_alert WITH match_field, ti_source"
- question: For any externally flagged IP, does its connection behavior over a rolling 7-day window show
    low-and-slow persistence (low volume, multi-day presence, and an elevated failed-connection ratio)?
  context: 'Tempo-profiling reconnaissance is deliberately quiet to stay under volume-based alerting.
    For each IP flagged by threat intelligence, profile Volume (total bytes), Frequency (connections/day),
    and State (ratio of failed/rejected S0/REJ/RSTO to successful SF connections) over a 7-day window.
    Score deviation with a robust median-absolute-deviation modified Z-score rather than mean/percentile
    alone so a few outliers do not skew thresholds. Flag IPs below the 10th percentile for connection
    volume that persist across 3+ days AND show an elevated failure ratio - the signature of low-and-slow
    recon. Derive percentile/MAD cutoffs from your own 30-day external-IP baseline. A positive result
    indicates patient, persistent profiling; corroborate with the IOC match before escalation. Citations:
    [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Perimeter firewalls, forward/reverse proxies, public-facing DNS servers, and external-facing
    web application firewalls (WAFs).'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each flagged_ip IN ti_matches OVER last 7d:\n  volume = sum(orig_bytes+resp_bytes)\n \
      \ freq = count(conn)/days_seen\n  fail_ratio = count(state IN [S0,REJ,RSTO]) / count(state=SF)\n\
      \  zmod = 0.6745*(x - median)/MAD   # per metric vs 30d baseline\nFLAG WHERE volume < p10 AND days_seen\
      \ >= 3 AND fail_ratio > baseline_fail_p90"
- question: When inbound external sources are scored by an unsupervised anomaly model over Zeek-derived
    features, which sources are flagged as reconnaissance-like, and which features drive each score?
  context: 'Where rules and statistics miss novel recon, unsupervised models generalize. Engineer per-IP
    features from Zeek logs (connection duration, bytes sent/received, byte ratio, protocol, conn_state/failure-ratio
    distribution, unique destination ports/IPs, and a binary threat-intel match) and score with an Isolation
    Forest and/or an online autoencoder (Kitsune); add a supervised Random Forest where labels exist.
    For every alert, surface the top-3 contributing features via SHAP/LIME (e.g., high failed-connection
    ratio, high port variety, low byte volume) so analysts can triage rather than chase opaque scores.
    A high anomaly score with recon-consistent feature attributions is a strong lead; benign-but-rare
    traffic (new partners, research scanners) is the main false positive to rule out. Citations: [Liu
    et al](https://doi.org/10.1145/2133360.2133363); [Kitsune, Mirsky et al](https://arxiv.org/abs/1802.09089);
    [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Aboueata et al](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Perimeter firewalls, forward/reverse proxies, public-facing DNS servers, and external-facing
    web application firewalls (WAFs).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_ip(duration, bytes_out, bytes_in, byte_ratio, proto,\n  conn_state_dist, fail_ratio,\
      \ uniq_dst_ports, uniq_dst_ips, ti_match)\nmodel = IsolationForest().fit(features_30d)   # + Kitsune\
      \ autoencoder\nscores = model.score(features_today)\nFOR each alert: explain = SHAP(model, ip);\
      \ EMIT score, top3(explain)"
- question: Is any external source IP repeatedly connecting to public-facing authentication services (VPN,
    OWA, SSO) yet generating zero successful and zero failed login events?
  context: 'Probing authentication endpoints to learn when they are reachable or maintained, without ever
    attempting a logon, is a distinct tempo-reconnaissance signal separating it from credential attacks.
    Join Zeek conn.log to Windows authentication logs (4624 success, 4625 failure) on source IP and alert
    when a source connects to a predefined list of auth-service IPs/ports more than 20 times in a 14-day
    period but has zero associated logon attempts (no 4624 AND no 4625). Prioritize sources that are first-time/new
    edges to that endpoint using Bayesian new-edge scoring. A positive result - persistent connection
    State with no authentication - points to an actor mapping availability/tempo rather than guessing
    credentials; benign monitoring or health-check probes are the chief false positives to allowlist.
    Citations: [Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5); [Metelli and Heard](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-13/issue-4/On-Bayesian-new-edge-prediction-and-anomaly-detection-in-computer/10.1214/19-AOAS1286.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: VPN concentrators, Outlook Web Access (OWA) portals, single sign-on (SSO) platforms, and other
    external-facing authentication gateways.'
  range: Last 14 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'conn = Zeek.conn WHERE id.resp_h IN auth_service_ips AND id.resp_p IN auth_ports

      auth = WinEvent IN (4624,4625)

      JOIN conn LEFT auth ON conn.id.orig_h = auth.IpAddress (last 14d)

      GROUP BY conn.id.orig_h

      ALERT WHERE conn_count > 20 AND logon_count = 0

      RANK BY bayesian_new_edge_score(src, endpoint)'
- question: Do connections from external IPs to authentication services arrive with machine-like regularity
    (low inter-arrival variance / strong periodicity), indicating automated scheduled probing?
  context: 'Automated tempo-probing tends to recur on a fixed schedule, producing highly regular inter-arrival
    times. For each source IP connecting to authentication services, compute inter-arrival times across
    30 days and quantify regularity via standard deviation / coefficient of variation, corroborated by
    FFT/autocorrelation periodicity ranking (BAYWATCH-style beaconing detection). Distinguish benign scheduled
    traffic using campus-edge periodicity baselines, and apply change-point detection (CUSUM/PELT) to
    per-endpoint connection-volume series to catch the onset of probing. Flag IPs in the bottom 5th percentile
    of inter-arrival standard deviation. A positive result signals automated, persistent profiling; legitimate
    cron-driven integrations and monitors are the expected benign matches to exclude. Citations: [BAYWATCH,
    Hassan et al](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks);
    [Mack et al](https://cspages.ucalgary.ca/~cwill/papers/2018/Mack-MASCOTS2018.pdf); [Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: VPN concentrators, Outlook Web Access (OWA) portals, single sign-on (SSO) platforms, and other
    external-facing authentication gateways.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each src->auth_service OVER 30d:\n  iat = diff(sort(timestamps))\n  cv = std(iat)/mean(iat)\n\
      \  periodic = fft_autocorr_rank(timestamps)\n  cp = PELT(per_endpoint_volume_series)\nFLAG WHERE\
      \ std(iat) <= p5 OR (periodic_strong AND src NOT IN benign_periodic)"
- question: When each high-value authentication service's connection stream is modeled with seasonal forecasting
    or an autoencoder, which off-hours low-volume deviations from unknown external sources stand out?
  context: 'Some probing is only visible as a subtle deviation from the normal seasonal rhythm of an auth
    service. Model each high-value service''s connection stream with seasonal ARIMA (time-of-day/day-of-week
    terms) or an autoencoder (Kitsune) and flag periods whose volume residual deviates significantly -
    especially low-volume, persistent deviations from unknown external sources during off-hours. Output
    the top-3 features driving each anomaly (hour-of-day residual, source novelty, zero-logon ratio) via
    SHAP so analysts can confirm the recon hypothesis. A positive result is an unexpected off-hours connection
    pattern tied to a novel source with no logons; routine seasonal shifts (maintenance windows, business
    cycles) should be absorbed by the model and not alert. Citations: [Pena et al](https://www.mdpi.com/2076-3417/11/7/3194);
    [Kitsune, Mirsky et al](https://arxiv.org/abs/1802.09089); [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Windows Event ID 4625
  - Windows Event ID 4624
  - 'NAI: VPN concentrators, Outlook Web Access (OWA) portals, single sign-on (SSO) platforms, and other
    external-facing authentication gateways.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR each auth_service:\n  model = SeasonalARIMA(volume, season=[hour,dow])   # or Kitsune\
      \ AE\n  resid = actual - forecast\n  ALERT WHERE resid significant AND source_novel AND zero_logon_ratio\
      \ high\n        AND hour IN off_hours\n  explain = SHAP -> top3(hour_residual, source_novelty, zero_logon_ratio)"
- question: Is any external source IP contacting many distinct destination ports with minimal payload
    (wide port variety, low data, and elevated failed/unanswered connections) outside the approved scanner
    allowlist?
  context: 'Long-duration, high-variety port scanning maps an organization''s exposed services and their
    availability over time. For each external source IP, count unique destination ports contacted over
    30 days and alert when an IP touches more than 10 unique ports but sends less than ~1KB to each (low
    payload) and is not on an approved scanner/service allowlist. Strengthen with Threshold Random Walk
    (TRW): track the ratio of failed/unanswered to successful connections and flag a source after ~4-5
    failures via sequential hypothesis testing with a bounded false-positive rate. Use benign-scanner
    profiles to allowlist and apply port/state logic to confirm. A positive result indicates deliberate
    service enumeration; internal vulnerability scanners and known research scanners are the primary benign
    sources to exclude. Citations: [Jung et al](https://www.icir.org/vern/papers/portscan-oak04.pdf);
    [Durumeric et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf);
    [Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network DMZ, public cloud subnets (VPCs/VNETs), public-facing application servers, and external
    DNS servers.'
  range: Last 30 days
  queries:
  - technology: Zeek/pseudocode
    query: "FOR each external src OVER 30d:\n  uniq_ports = distinct(id.resp_p)\n  low_payload = avg(orig_bytes)\
      \ < 1024\n  trw = seq_test(failed_or_unanswered / successful)\nALERT WHERE uniq_ports > 10 AND low_payload\n\
      \      AND src NOT IN scanner_allowlist\n      OR trw.decision = SCANNER   # after ~4-5 failures"
- question: Which external source IPs combine very high destination-port entropy with very low connection
    counts and an elevated failure ratio, the statistical hallmark of low-frequency, high-variety scanning?
  context: 'Stealthy scanners spread few connections across many ports, producing high port entropy but
    low total volume. Over a 30-day window, compute per external source IP: (1) Shannon entropy of destination
    ports in Zeek conn.log, (2) total connection count (Frequency), (3) total bytes (Volume), and (4)
    failed/rejected connection ratio (State). Isolate IPs in the top 98th percentile of port entropy but
    bottom 25th percentile of connection count AND with an elevated failure ratio. Use modified Z-score
    / MAD thresholds to resist skew and derive cutoffs from your own external-IP distribution. A positive
    result is a quiet, broad scanner profiling your perimeter; high-volume legitimate services with naturally
    diverse ports should fall outside the low-count band and not alert. Citations: [Durumeric et al](https://www.usenix.org/system/files/conference/usenixsecurity14/sec14-paper-durumeric.pdf);
    [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network DMZ, public cloud subnets (VPCs/VNETs), public-facing application servers, and external
    DNS servers.'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each external src OVER 30d:\n  port_entropy = shannon(distribution(id.resp_p))\n  conn_count\
      \ = count(conn)\n  bytes = sum(orig_bytes+resp_bytes)\n  fail_ratio = failed/total\nFLAG WHERE port_entropy\
      \ >= p98 AND conn_count <= p25 AND fail_ratio > baseline\n# thresholds via modified_zscore(MAD)"
- question: When unsupervised clustering/outlier detection is run over all external source IPs, which
    IPs are isolated as noise or small distinct clusters that match neither normal users nor common internet
    scanners?
  context: 'Unsupervised models catch scan patterns that fixed thresholds miss. Run DBSCAN and/or Isolation
    Forest over all external source IPs from the last 30 days with per-IP features: total connection count,
    unique destination ports/IPs, average bytes transferred, byte ratio, failed-connection ratio, and
    standard deviation of inter-connection arrival times. Investigate points labeled noise or forming
    small distinct clusters that do not match normal users or common internet scanners. Surface the top-3
    features behind each flagged IP via SHAP/LIME. A positive result is an IP whose behavioral fingerprint
    sits apart from both legitimate users and benign scanners - a strong scanning lead; recognized research
    scanners and large CDNs are the benign clusters to confirm and exclude. Citations: [Liu et al](https://doi.org/10.1145/2133360.2133363);
    [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full);
    [Aboueata et al](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Network DMZ, public cloud subnets (VPCs/VNETs), public-facing application servers, and external
    DNS servers.'
  range: Last 30 days
  queries:
  - technology: ML/pseudocode
    query: "features = per_ip(conn_count, uniq_ports, uniq_ips, avg_bytes,\n  byte_ratio, fail_ratio,\
      \ std_iat) OVER 30d\nlabels = DBSCAN(features)   # + IsolationForest score\nINVESTIGATE WHERE label\
      \ = noise OR small_distinct_cluster\n  AND NOT matches(normal_users, known_scanners)\nexplain =\
      \ SHAP -> top3 per flagged ip"
- question: Did a privileged account log on interactively during a defined non-business period and immediately
    run discovery tooling (net.exe, whoami.exe, nltest.exe, gpresult.exe)?
  context: 'An adversary who has learned the organization''s tempo will favor non-business windows to
    operate with minimal scrutiny. Raise a high-severity alert when a logon (Windows Event ID 4624, Logon
    Type 2 or 10) for a member of a privileged group (e.g., Domain Admins) is immediately followed by
    process creation (4688) for a discovery tool during a company-defined non-business period (e.g., 22:00-06:00
    local, weekends, holidays). Maintain the explicit non-business calendar as a deterministic floor and
    apply event-correlation logic; corroborate with failed-logon (4625) volume from the same account/host
    as a distinct state signal. A positive result is privileged off-hours reconnaissance on the endpoint;
    legitimate maintenance windows performed by known admins are the benign cases to validate against
    change records. Citations: [Ghorbani et al](https://doi.org/10.1007/978-0-387-88771-5).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: Domain Controllers, certificate authorities, critical file servers, privileged user workstations,
    database servers, and hypervisor management consoles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'logon = 4624 WHERE LogonType IN (2,10) AND account IN privileged_groups

      proc  = 4688 WHERE NewProcessName IN [net.exe,whoami.exe,nltest.exe,gpresult.exe]

      SEQUENCE logon -> proc (same host, same user, within 5m)

      WHERE event_time IN non_business_calendar

      ALERT high_severity ; enrich with 4625 count(account,host)'
- question: Against each privileged user's 90-day behavioral baseline, does current activity accrue enough
    risk points (off-hours logon, rare process, first-time server) to indicate tempo-aware misuse?
  context: 'Flat off-hours thresholds generate noise; baselining each user is more defensible. For each
    privileged user build a 90-day baseline of login times, processes executed, and servers accessed,
    and model normal hour-of-day/day-of-week with seasonal ARIMA so off-hours activity is scored against
    expected tempo. Assign robust risk points using MAD modified Z-score per metric (e.g., +1 if logon
    hour >3.5 MAD from median, +1 for a rare process, +1 for first-time server access). Apply change-point
    detection to flag a sustained shift toward off-hours activity. Sum and alert above a tuned threshold.
    A high cumulative score is a strong indicator of tempo-aware misuse or an account operating outside
    its norm; gradual legitimate role changes should be absorbed by re-baselining. Citations: [Pena et
    al](https://www.mdpi.com/2076-3417/11/7/3194); [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: Domain Controllers, certificate authorities, critical file servers, privileged user workstations,
    database servers, and hypervisor management consoles.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "FOR each priv_user (90d baseline):\n  expected = SeasonalARIMA(activity, season=[hour,dow])\n\
      \  risk = 0\n  risk += 1 if zmod(logon_hour) > 3.5\n  risk += 1 if process rare vs baseline\n  risk\
      \ += 1 if server first_time\n  risk += changepoint(off_hours_rate)\nALERT WHERE risk >= tuned_threshold"
- question: When per-user behavioral models (One-Class SVM / peer-group UEBA) score privileged activity,
    which off-hours actions or peer-group deviations are flagged as outliers?
  context: 'Behavioral modeling captures multivariate normality better than single metrics. Build per-user
    models (One-Class SVM or peer-group UEBA) over features such as hour of logon, source workstation,
    processes launched, and servers connected to; classify new activity as inlier/outlier and investigate
    off-hours outliers and peer-group deviations. Develop and validate off-hours/insider models on the
    labeled CERT Insider Threat Test Dataset. Each alert must list the top-3 contributing features (e.g.,
    off-hours logon, rare workstation, unusual process) via SHAP. A positive result is privileged activity
    that is anomalous both for the user and relative to peers during non-business hours - consistent with
    tempo-aware operation; legitimate on-call work by the same admin is the benign pattern to confirm.
    Citations: [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [CERT Insider Threat Test Dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/);
    [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4624
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - 'NAI: Domain Controllers, certificate authorities, critical file servers, privileged user workstations,
    database servers, and hypervisor management consoles.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "FOR each priv_user:\n  model = OneClassSVM(features=[logon_hour, src_workstation, processes,\
      \ servers])\n  # or peer-group UEBA\n  pred = model.predict(new_activity)\nINVESTIGATE WHERE pred\
      \ = outlier AND hour IN off_hours OR peer_group_deviation\nexplain = SHAP -> top3(off_hours, rare_workstation,\
      \ unusual_process)"
- question: Was a new or modified scheduled task or service configured to trigger during non-business
    hours with a suspicious action (script interpreter, LOLBin in non-standard path, or obfuscation flags)?
  context: 'Adversaries time persistence to fire when nobody is watching. Alert on creation of a new scheduled
    task (Windows Event ID 4698) or service (4697) where (1) the trigger targets non-business hours (XML
    TimeTrigger or service start type) AND (2) the action/executable involves a script interpreter (powershell.exe,
    cscript.exe), a living-off-the-land binary in a non-standard path, or obfuscation flags (-enc, -w
    hidden). Apply production-grade triage (non-system creator, parent process, run-as user, integrity
    level, code signature) and keep documented benign exclusions. A positive result is off-hours persistence
    with a suspicious payload; legitimate scheduled maintenance and signed vendor tasks are the benign
    cases to allowlist. Citations: [Elastic''s Local Scheduled Task Creation rule](https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_local_scheduled_task_creation.toml).'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Microsoft-Windows-TaskScheduler/Operational Event ID 106
  - Windows Event ID 4688
  - Windows Event ID 4697
  - 'NAI: All Windows endpoints and servers, particularly Domain Controllers, application servers, and
    administrator workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'task = 4698 OR TaskScheduler/Operational 106 ; svc = 4697

      WHERE trigger IN non_business_hours (XML TimeTrigger / service start)

      AND action MATCHES (powershell.exe|cscript.exe | LOLBin in non_std_path | -enc | -w hidden)

      ENRICH creator, parent_process, run_as, integrity, signature

      ALERT unless IN benign_exclusions'
- question: Does a host exceed its 90-day baseline for scheduled-task/service creation, or do new tasks
    carry abnormally high command-line/path entropy indicating obfuscation?
  context: 'Bursts of task/service creation or obfuscated commands betray automated or hidden persistence.
    Per host, baseline scheduled-task/service creation frequency over 90 days and alert when a host exceeds
    the 99th percentile, scored with a robust modified Z-score to resist batch/patch-window skew. For
    each new task/service, compute Shannon entropy of the command line/executable path and flag values
    well above the host''s historical mean (obfuscation/randomization). Add a change-point test on per-host
    creation rate to catch sudden onset of scheduled activity. A positive result is an unusual volume
    or obfuscated task on a host; software deployment and patch windows are the benign spikes to account
    for via baselining. Citations: [Modified Z-Score, Detection Engineering](https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    [Aminikhanghahi and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/).'
  answer_sources:
  - Windows Event ID 4698
  - Windows Event ID 4702
  - Microsoft-Windows-TaskScheduler/Operational Event ID 106
  - Windows Event ID 4688
  - Windows Event ID 4697
  - 'NAI: All Windows endpoints and servers, particularly Domain Controllers, application servers, and
    administrator workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
