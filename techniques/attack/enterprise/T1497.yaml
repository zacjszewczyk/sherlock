name: 'T1497: Virtualization/Sandbox Evasion'
id: 3bc45d72-158b-4478-86ca-510ba5f35159
description: 'This playbook helps a SOC analyst investigate whether an adversary is performing Virtualization/Sandbox
  Evasion (T1497) -- detecting analysis environments and then disengaging, stalling, or concealing payload
  logic to defeat defenders. It addresses both the Stealth (TA0005) and Discovery (TA0007) framings of
  the same behavior, since the actor both gathers environment intelligence and uses it to blend in. The
  hunt spans Windows, Linux, and macOS endpoints plus network sensors and covers: execution of known evasion
  tooling matched by SHA256 hash (Pafish, al-khaser and bundling malware); processes querying virtualization/sandbox
  artifacts in the registry, file system, and WMI (VirtualBox/VMware drivers, Win32_PortConnector, debugger
  keys); ''check-then-quit'' early process termination with no children/files/network; sleep-and-stall
  delayed execution before first C2 connection; command-line and PowerShell script-block strings unique
  to evasion tools (IsDebuggerPresent, rdtsc, pafish); piped enumeration-and-filter chains hunting security/analysis
  tools (tasklist | findstr sysmon); rapid humanity/hardware checks (mouse movement, recent files, low
  core count, short uptime); and low-volume internet-connectivity canary checks to high-reputation services.
  Each evidence item is investigated three ways -- a deterministic symbolic-logic floor, a statistical-baselining
  layer, and a machine-learning model -- across Windows Security and Sysmon events, PowerShell 4104 script-block
  logs, auditd, macOS unified logs, and Zeek conn/dns telemetry, so the analyst can corroborate suspected
  evasion through hashes, artifact sequences, process lifespan, timing, command-line entropy, and flow
  behavior.'
type: technique
