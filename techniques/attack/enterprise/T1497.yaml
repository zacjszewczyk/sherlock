    short amount of time with minimal system interaction, such as creating no child processes, writing
    no files, and initiating no network connections. The ''Multi alert process rule'' method (Symbolic
    Logic) pursues this signal as follows: Create a stateful rule that triggers when a process (Sysmon
    ProcessGUID) generates an ''Artifact Query'' alert (Evidence 2) and is then followed by a process
    termination (Sysmon Event ID 5) within 5 seconds, with no intervening File Create (ID 11), Network
    Connection (ID 3), or Child Process (ID 1) events for that ProcessGUID. This ''check-then-quit'' pattern
    reflects the disengage-on-detection logic confirmed by DISARM. Keep the 5-second threshold as the
    floor; tune per environment. A positive result -- a deterministic rule match, a statistical outlier,
    or a model alert -- indicates a process is probing for or reacting to an analysis environment; pivot
