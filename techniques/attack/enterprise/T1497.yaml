questions:
- question: '[Stealth] Known VM hash match: Can you determine whether a process creation event is observed
    where the file hash (e.g., SHA256) of the executable image matches a known indicator of compromise
    for tools or malware documented to use T1497. -- specifically, applying the ''Known VM hash match''
    (Symbolic Logic) approach to surface this virtualization/sandbox-evasion behavior?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the mission question is "Is the adversary
    attempting to evade defenses related to virtualization or sandboxing?" Adversaries detect analysis
    environments (VMs, sandboxes, debuggers, security tooling) and then disengage, sleep, or conceal payload
    logic so their malware never reveals itself to defenders. This evidence focuses on the condition that
    a process creation event is observed where the file hash (e.g., SHA256) of the executable image matches
    a known indicator of compromise for tools or malware documented to use T1497. The ''Known VM hash
    match'' method (Symbolic Logic) pursues this signal as follows: Implement a detection rule that continuously
    compares the SHA256 hash of every new process executable (from Sysmon Event ID 1 or Windows Event
    ID 4688) against a threat intelligence feed of known sandbox evasion tools and malware that bundle
    the artifact checks catalogued in Pafish and al-khaser. Generate a high-severity alert upon a match.
    Keep this exact-match floor; do not delete it when layering statistical/ML methods. A positive result
    -- a deterministic rule match, a statistical outlier, or a model alert -- indicates a process is probing
    for or reacting to an analysis environment; pivot to the responsible process, its hash, command line,
    parent lineage, user/host context, and the timing/sequence of its system queries and network behavior
    to confirm intent. A negative result helps reduce the likelihood of this specific evasion behavior
    but should be corroborated with the other questions in this playbook, since sophisticated actors split
    checks across stages and any single method can miss stealthy, context-triggered logic. Tie findings
    back to Stealth: confirming evasion shapes how much of the kill chain remains hidden and what follow-on
    discovery or stealth behaviors to expect. Source citations for this method: [Pafish](https://github.com/a0rtega/pafish),
    [al-khaser](https://github.com/ayoubfaouzi/al-khaser).'
  answer_sources:
