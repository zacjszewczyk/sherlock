    keys. The alert must report the top-3 anomalous events (predicted-vs-observed log keys) so analysts
    see which artifact queries drove the score, distinguishing ordered evasion logic from random benign
    queries. A positive result -- a deterministic rule match, a statistical outlier, or a model alert
    -- indicates a process is probing for or reacting to an analysis environment; pivot to the responsible
