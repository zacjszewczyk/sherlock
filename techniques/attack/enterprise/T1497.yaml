    logic so their malware never reveals itself to defenders. This evidence focuses on the condition that
    a process executes one or more queries for specific file system, registry, or WMI artifacts that are
    indicative of a virtualized environment (e.g., VMware, VirtualBox) or the presence of common analysis
    tools (e.g., Wireshark, Sysinternals Process Monitor). The ''Sandbox GUID correlation'' method (Symbolic
    Logic) pursues this signal as follows: Create a correlation rule that triggers when a single process
    (identified by its ProcessGUID in Sysmon) accesses 3 or more items from a curated list of virtualization/sandbox
    artifacts within a short time window (e.g., 10 seconds). Seed the list directly from Pafish and al-khaser:
    registry keys (HKLM\SOFTWARE\Oracle\VirtualBox), file paths (C:\windows\System32\Drivers\VBoxGuest.sys),
    and WMI queries (''SELECT * FROM Win32_PortConnector ...''). Prioritize the highest-value artifacts
    (uniform hardware, accelerated time, missing user history) identified by SandPrint. The count threshold
    (N=3) is the deterministic floor; tune N and window per environment. A positive result -- a deterministic
    rule match, a statistical outlier, or a model alert -- indicates a process is probing for or reacting
    to an analysis environment; pivot to the responsible process, its hash, command line, parent lineage,
    user/host context, and the timing/sequence of its system queries and network behavior to confirm intent.
    A negative result helps reduce the likelihood of this specific evasion behavior but should be corroborated
