questions:
- question: '[Resource Development] Identify AI-synthesized metadata in documents: Can you determine whether
    any email attachment, cloud-synced document, or staged file carries authoring metadata, a generator
    string, or forensic fingerprints indicating it was produced by a consumer AI tool or otherwise synthesized
    -- for example an EXIF/XMP/Office generator field naming an AI tool from an account not approved to
    use it, media missing camera-acquisition metadata, double-JPEG-compression or GAN upsampling artifacts,
    missing PRNU, or impossible/zero edit-duration sequences (e.g., edit_duration < 5s for a multi-page
    document)?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary creates or
    generates content -- written materials, images, audio, or video -- to build personas, impersonate
    trusted parties, and support phishing, fraud, or influence activity (T1683, Generate Content). Because
    the generation occurs off-network (PRE), the most reliable first-party signal is the residual metadata
    and forensic fingerprints left on the artifact when it lands in your environment. This Symbolic Logic
    approach correlates attachment metadata, document authoring fields, and file version history and applies
    deterministic rules: flag any EXIF/XMP/Office generator string referencing a consumer AI tool from
    an unapproved account, media with absent camera-acquisition metadata, double JPEG compression, GAN
    upsampling artifacts, missing PRNU, or impossible zero/short edit durations. These forensic fingerprints
    are reliable hard signals (see Media Forensics and DeepFakes overview, and DeepFakes and Beyond).
    Keep concrete thresholds and tune per environment, and surface the offending metadata field in the
    alert. A positive result means the artifact''s claimed provenance conflicts with its embedded evidence
    -- pivot to the delivering sender, the file lineage, and any campaign of similar artifacts; a negative
    result does not clear the content, since metadata can be stripped, so rely on the lineage, statistical,
    and ML layers as well.'
  answer_sources: &id001
  - Email gateway logs (SMTP headers, SPF/DKIM/DMARC results, attachment metadata)
  - Chat/collaboration platform logs
  - Cloud storage audit logs
  - File metadata and version history (EXIF/XMP/Office authoring fields)
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Web proxy logs
  - 'NAI: Email gateways, corporate messaging platforms, public-facing web servers, and high-value target
    (HVT) endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each file in (email_attachments, cloud_docs, staged_files):\n  meta = extract_metadata(file)\
      \  /* EXIF, XMP, Office authoring fields */\n  if meta.generator matches AI_TOOL_LIST and meta.account\
      \ not in APPROVED_AI_USERS: alert('ai_generator_string', field=meta.generator)\n  if file.type in\
      \ (jpg,png,heic) and meta.camera_make is null and meta.acquisition is null: alert('missing_camera_metadata')\n\
      \  if forensic(file).double_jpeg or forensic(file).gan_upsample or forensic(file).prnu_missing:\
      \ alert('forensic_fingerprint')\n  if meta.edit_duration < 5s and meta.page_count > 1: alert('impossible_edit_duration',\
      \ dur=meta.edit_duration)"
  - technology: ExifTool/pseudocode
    query: 'exiftool -Software -Creator -CreatorTool -EditTime -Pages -Make -Model <file>

      => compare against AI_TOOL_LIST and approved-author allow-list; emit offending field'
- question: '[Resource Development] Correlate authoring sessions with file lineage: Can you determine
    whether the account claimed as the author of a document or media file actually handled it -- by joining
    file creation/upload events (Sysmon EID 11, cloud editor audit logs) to the process launches (Sysmon
    EID 1, Windows Event ID 4688) and account ownership, and flagging artifacts whose creation path, device,
    or tenant history conflicts with the normal workflow for that sender or department (e.g., an Office
    doc claimed by user X but no editor process ever ran under X)?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), generated content is often
    attributed to a spoofed or impersonated persona to lend it credibility (T1683, Generate Content).
    A powerful first-party check is provenance: does the recorded authoring activity on your endpoints
    and in your cloud audit logs actually support the claimed author? This Symbolic Logic approach joins
    file creation and upload events to the process launches and account ownership that produced them,
    confirming whether the claimed author truly handled the content. Flag artifacts whose creation path,
    device, or tenant history conflicts with the normal workflow for the sender/department -- for example
    an Office document claimed by user X when no editor process (winword.exe, excel.exe, etc.) ever ran
    under X. This authoring-to-lineage provenance join, and persona-to-header/style allow-lists, follow
    the attribution constraints in Authorship Attribution for Neural Text Generation. A positive result
    (claimed author with no supporting lineage) strongly suggests externally generated, impersonating
    content; pivot to the real origin device/account and the delivery path. A negative result corroborates
    legitimate internal authorship.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "file_events = (Sysmon EID 11 file_create) UNION (cloud_editor_audit create/upload)\nproc_events\
      \ = (Sysmon EID 1) UNION (Windows EID 4688)\njoin file_events f to proc_events p on host, time_window(+/-\
      \ 10m), session\nfor each artifact a with claimed_author = a.metadata.author:\n  if not exists p\
      \ where p.user == claimed_author and p.image in EDITOR_PROCESSES and p.host == a.host:\n    alert('author_without_lineage',\
      \ artifact=a.path, claimed=claimed_author)\n  if a.creation_path/device/tenant not in WORKFLOW_BASELINE[sender_dept]:\
      \ alert('lineage_workflow_mismatch')"
  - technology: Splunk/SPL pseudocode
    query: 'index=sysmon (EventCode=11 OR EventCode=1) OR index=cloudaudit action=upload

      | transaction host file_hash maxspan=10m

      | where claimed_author!=editor_process_user OR isnull(editor_process_user)

      | table _time host artifact claimed_author editor_process_user'
- question: '[Resource Development] Token-level statistical screening of text: Can you determine whether
    the text of an inbound message or attachment exhibits the statistical signature of machine generation
    -- for example more than 90% of tokens falling within a reference language model''s top-10 predictions,
    perplexity below the 5th percentile of the sender''s baseline, low predictive entropy, or anomalous
    log-probability curvature -- using reference-LM token statistics (GLTR) and log-probability curvature
    (DetectGPT)?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), adversaries increasingly
    use LLMs to draft phishing and pretext content (T1683, Generate Content). Machine-generated text leaves
    a statistical fingerprint distinct from human writing. This Statistical Method scores inbound message
    and attachment text with reference-LM token statistics -- probability rank, top-k membership fraction,
    and predictive entropy (per GLTR) -- and log-probability curvature (per DetectGPT). Apply deterministic
    floors such as flagging passages where >90% of tokens fall in the reference model''s top-10 predictions,
    or perplexity below the 5th percentile of the sender baseline. Per the LLM-Generated Text Detection
    survey, combine perplexity, burstiness, and log-rank, and report which statistic tripped in the alert.
    A positive result indicates likely machine-generated prose; combine it with metadata/lineage and ML
    layers before acting, since paraphrase and homoglyph attacks can evade token statistics. A negative
    result lowers but does not eliminate suspicion.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each text in (inbound_message_body, attachment_text):\n  s = score_with_reference_LM(text)\
      \  /* GLTR + DetectGPT */\n  topk_frac = fraction(tokens in ref_LM.top10)\n  ppl = perplexity(text)\n\
      \  if topk_frac > 0.90: alert('gltr_topk', value=topk_frac)\n  if ppl < percentile(sender_baseline_ppl,\
      \ 5): alert('low_perplexity', value=ppl)\n  if abs(detectgpt_curvature(text)) > CURVATURE_THRESHOLD:\
      \ alert('detectgpt_curvature')\n  emit tripped_statistic in alert"
- question: '[Resource Development] Detect linguistic anomalies in communications: Can you determine whether
    a message deviates from a sender''s or department''s writing baseline -- in sentence length, lexical
    diversity (type-token ratio), punctuation density, personalization rate, perplexity, or draft-to-send
    latency -- using percentile thresholds or modified z-scores (median absolute deviation) to highlight
    unusually uniform style, repeated boilerplate, or a turnaround inconsistent with human drafting?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), generated content used for
    impersonation often reads subtly differently from a person''s genuine writing, or is produced and
    sent faster than a human could plausibly draft it (T1683, Generate Content). This Statistical Method
    builds sender- and department-level baselines for sentence length, lexical diversity (type-token ratio),
    punctuation density, personalization rate, perplexity, and drafting latency, then uses percentile
    thresholds or modified z-scores (median absolute deviation) to flag outliers. Track volume (token/character
    counts), frequency (messages/min per sender), and state (draft-to-send latency). Re-derive thresholds
    per domain and per adversarial setting (paraphrase, homoglyph) as shown in RAID. A positive result
    -- e.g., a long, polished message with near-zero drafting latency or uncharacteristically uniform
    style -- suggests the content was machine-generated or pasted from an external source; pivot to the
    sender''s recent activity and corroborate with metadata/lineage. A negative result indicates the writing
    is consistent with the established human baseline.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[sender] = rolling_stats(sentence_len, ttr, punct_density, personalization, ppl, draft_latency)\n\
      for each message m:\n  for feature f in baseline[m.sender]:\n    mz = 0.6745 * (m[f] - median(baseline.f))\
      \ / MAD(baseline.f)\n    if abs(mz) > 3.5: alert('linguistic_anomaly', feature=f, mz=mz)\n  if m.draft_to_send_latency\
      \ < HUMAN_MIN_LATENCY and m.token_count > 200: alert('impossible_drafting_speed')"
- question: '[Resource Development] Profile delivery and authentication failure rates: Can you determine
    whether there is a spike in SPF/DKIM/DMARC failures, attachment-scan failures, bounce/NDR rates, or
    mismatched display-name vs envelope-from for senders associated with suspect AI-generated content
    -- treating error/failure telemetry as a distinct signal that co-occurs with stylistically anomalous
    mass mailings?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), persona and impersonation
    campaigns built on generated content frequently trip email authentication and delivery controls because
    the sending infrastructure does not legitimately belong to the impersonated party (T1683, Generate
    Content). This Statistical Method treats error/failure telemetry as a first-class signal: baseline
    and alert on spikes in SPF/DKIM/DMARC failures, attachment-scan failures, bounce/NDR rates, and mismatched
    display-name vs envelope-from for senders linked to suspect content. Sudden bursts of authentication
    failures co-occurring with stylistically anomalous mass mailings indicate persona/impersonation campaigns,
    complementing the content classifiers in ChatSpamDetector. A positive result -- a failure spike correlated
    in time with anomalous content -- strongly suggests an active campaign; pivot to the full recipient
    set, the sending IPs/domains, and the message content. A negative result means delivery and authentication
    are nominal, which lowers but does not eliminate suspicion since well-resourced actors may pass authentication.'
  answer_sources: *id001
  range: Last 30 days; pivot to event-centered +/- 24h windows around any failure spike
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = rolling_rate_per_sender(spf_fail, dkim_fail, dmarc_fail, attach_scan_fail, ndr,\
      \ displayname_envfrom_mismatch)\nfor each 1h bucket b, sender s:\n  if rate(b,s).any_failure > mean(baseline[s])\
      \ + 3*stddev(baseline[s]): flag_spike(s,b)\n  if flag_spike(s,b) and exists anomalous_content(s,\
      \ b.window): alert('persona_campaign', sender=s, window=b)"
- question: '[Resource Development] Classify synthetic media with deep learning: Can you determine whether
    images, audio, or video contain generation artifacts indicative of synthetic media -- using a generalizing
    CNN image detector (ResNet-50 with augmentation that transfers across unseen generators), XceptionNet-style
    facial-manipulation detection robust to compression, and spectral/cepstral voice countermeasures --
    and retaining high-confidence hits with full message/attachment lineage and the top-3 contributing
    features?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), adversaries generate deepfake
    images, voice, and video to impersonate executives or trusted parties for fraud and social engineering
    (T1683, Generate Content). This Machine Learning approach applies media classifiers to detect generation
    artifacts: a generalizing CNN image detector (ResNet-50 trained with augmentation that transfers across
    unseen generators, per ''CNN-generated images are surprisingly easy to spot''), XceptionNet-style
    facial-manipulation detection robust to compression (per FaceForensics++), and spectral/cepstral voice
    countermeasures (per ASVspoof 2019). Retain high-confidence hits with full message/attachment lineage
    and surface the top-3 contributing features (GAN-artifact region, spectral irregularity, compression
    mismatch) in alert text. Because detectors degrade against unseen generators and recompression, ML
    must run alongside the symbolic and statistical layers, never as the sole signal. A positive high-confidence
    result flags likely synthetic media for human review and lineage pivoting; a negative result does
    not clear the artifact.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: "for each media in (image, audio, video) extracted from messages/files:\n  if media.is_image:\
      \ score = resnet50_gen_detector(media)\n  elif media.is_video: score = xception_faceforensics(media)\n\
      \  elif media.is_audio: score = asvspoof_cepstral_cm(media)\n  if score > HIGH_CONF_THRESHOLD:\n\
      \    alert('synthetic_media', score=score, top3_features=explain(media), lineage=message_attachment_lineage(media))"
- question: '[Resource Development] Classify machine-generated text and phishing content: Can you determine
    whether message or attachment text is machine-generated or phishing -- using a supervised neural text
    detector (fine-tuned RoBERTa GPT-2 Output Detector baseline) and an LLM-based content judge that emits
    a human-readable rationale -- run in parallel with (never instead of) the deterministic metadata/lineage
    and statistical layers, requiring the model to output its top-3 contributing features/tokens?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), AI-generated phishing and
    pretext content is a primary use of generated material (T1683, Generate Content). This Machine Learning
    approach runs a supervised neural text detector (fine-tuned RoBERTa GPT-2 Output Detector baseline,
    per Release Strategies and the Social Impacts of Language Models) and an LLM-based content judge that
    emits a human-readable rationale (per ChatSpamDetector), in parallel with the deterministic and statistical
    layers -- never as the sole signal. Because detectors collapse under recursive paraphrase and recompression
    (per ''Can AI-Generated Text be Reliably Detected?'' and RAID), keep the symbolic metadata/lineage
    floor authoritative and require the model to output its top-3 contributing features/tokens for triage.
    A positive result with a clear rationale supports escalation and recipient scoping; treat low-confidence
    or evasion-suspected results as inputs to the human-reviewed symbolic and statistical evidence rather
    than as standalone verdicts.'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/Pipeline pseudocode
    query: "for each text in (message_body, attachment_text):\n  p_ml = roberta_gpt2_output_detector(text)\n\
      \  judge = llm_content_judge(text)  /* returns label + rationale */\n  if p_ml > THRESHOLD or judge.label\
      \ == 'phishing':\n    if symbolic_or_stats_layer_also_flags(text):\n      alert('machine_generated_text',\
      \ p_ml=p_ml, rationale=judge.rationale, top3_tokens=explain(text))\n    else: enqueue_human_review(text,\
      \ p_ml, judge.rationale)  /* never sole signal */"
