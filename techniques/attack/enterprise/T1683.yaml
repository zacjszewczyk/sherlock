name: 'T1683: Generate Content'
id: 3b9a33e8-c54d-4be5-b53b-70db78941aa7
description: 'This playbook helps an analyst investigate whether an adversary has generated or developed
  synthetic content -- AI-written phishing emails, fake documents, manipulated or wholly synthetic images,
  audio, and video (deepfakes) -- to establish personas, impersonate trusted people or organizations,
  and support social engineering, fraud, phishing, or influence operations (MITRE ATT&CK T1683, Generate
  Content). Because the generation itself happens off-network (PRE) and outside the target''s visibility,
  the hunt relies on first-party email, file, cloud-audit, and endpoint telemetry rather than external
  lookups, and corroborates suspect artifacts from several complementary angles: deterministic inspection
  of authoring metadata, generator strings, EXIF/XMP/Office fields, and forensic fingerprints (double
  JPEG compression, GAN upsampling artifacts, missing camera PRNU, impossible edit durations); provenance
  joins that tie file-creation and upload events to the process lineage and account that supposedly authored
  the content; token-level statistical screening of text against reference language models (probability
  rank, top-k membership, perplexity, log-rank curvature); linguistic baselining of sender and department
  writing style and drafting latency; profiling of SPF/DKIM/DMARC, bounce/NDR, and attachment-scan failure
  rates that betray persona/impersonation campaigns; and machine-learning classifiers for synthetic media
  and machine-generated text. Detection methods deliberately keep the symbolic metadata/lineage layer
  authoritative because statistical and ML detectors collapse under recursive paraphrase and recompression,
  so the analyst can triage AI-generated content with defensible, explainable evidence across email gateways,
  collaboration platforms, cloud storage, file version history, and high-value-target endpoints.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
