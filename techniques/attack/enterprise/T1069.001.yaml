- question: 'Tripwire on cross-host fan-out and remote RPC enumeration? (Symbolic Logic) Specifically,
    for the behavior: A single source account or host remotely enumerating local groups across many unique
    destination hosts in a short window (fan-out), indicating automated/scripted discovery; includes remote
    SAMR/LSARPC enumeration behind `net localgroup \\host`.'
  context: 'Tactic: Discovery. Symbolic Logic: Trigger when a single account generates a local-group-membership-enumerated
    event (Windows Event ID 4798) or security-enabled-local-group-membership event (4799) on more than
    a fixed number of hosts (e.g., 10) within one hour, a high-fidelity brute-force-discovery tripwire.
    Corroborate with remote DCE-RPC SAMR/LSARPC operations detected by [BZAR''s Zeek ATT&CK analytics](https://github.com/mitre-attack/bzar)
    over SMB. As a distinct State signal, separately count access-denied/failed remote enumerations per
    source, since scanning frequently hits hosts where the account lacks rights. This question targets
    the evidence: "A single source account or host remotely enumerating local groups across many unique
    destination hosts in a short window (fan-out), indicating automated/scripted discovery; includes remote
    SAMR/LSARPC enumeration behind `net localgroup \\host`." A positive result indicates likely local-group
