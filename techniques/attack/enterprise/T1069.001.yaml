  context: 'Tactic: Discovery. Statistical Method: For each user/host, establish a 30-day baseline of
    enumeration-command frequency (count/day and count/min burst rate) and the Volume of distinct groups
    queried per session; compute mean and standard deviation ($$\mu$$, $$\sigma$$) and alert when a daily
    count exceeds $$\mu + 3\sigma$$ or when a short burst (e.g., >5 enumeration commands/min) appears.
