name: 'T1069.001: Local Groups'
id: 2b19e1e4-30e3-4ce8-b6b5-294e1d50dd87
description: 'Investigate adversary attempts to enumerate local system groups and their members in order
  to map permissions, identify privileged accounts (e.g., the local administrators group), and orient
  before privilege abuse or lateral movement. This playbook helps an analyst hunt for: execution of known-malicious
  reconnaissance/post-exploitation tooling (PowerSploit, BloodHound/SharpHound, Empire, Cobalt Strike)
  by hash and behavior; abuse of built-in Windows utilities (net.exe, net1.exe, whoami.exe, dsquery) with
  local-group enumeration arguments, especially with anomalous parent lineage; PowerShell script blocks
  using Get-LocalGroup / Get-LocalGroupMember and ADSI accelerators (plaintext or obfuscated); single
  source accounts fanning out to remotely enumerate local groups across many hosts via SAMR/LSARPC; temporal
  clustering of local-group enumeration with other discovery techniques; and native Linux/macOS group
  enumeration (groups, id, getent group, cat /etc/group, dscl, dscacheutil). For each behavior the playbook
  supplies symbolic-logic, statistical, and machine-learning approaches spanning Windows Event Logs, Sysmon,
  auditd, macOS unified logs, and Zeek network telemetry.'
type: technique
