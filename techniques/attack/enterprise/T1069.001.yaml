questions:
- question: 'Query process creation logs for executed process hashes and match against known-bad intelligence?
    (Symbolic Logic) Specifically, for the behavior: Execution of a process whose file hash (e.g., SHA256)
    matches a known-malicious signature for reconnaissance/post-exploitation tooling (PowerSploit, BloodHound/SharpHound,
    Empire, Cobalt Strike) frequently used to enumerate local groups and members.'
  context: 'Tactic: Discovery. Symbolic Logic: Query process creation logs (Windows Event ID 4688, Sysmon
    Event ID 1) for all executed process hashes and compare each against a curated list of known-malicious
    hashes from threat-intelligence feeds and tool signatures, generating a critical alert on any direct
    match. Pair hash matching with command-line/image-name rules for the local-group enumeration tradecraft
    enumerated by [MITRE ATT&CK T1069.001](https://attack.mitre.org/techniques/T1069/001/) and the rule
    corpus in [SigmaHQ](https://github.com/SigmaHQ/sigma) so renamed binaries are still caught by behavior.
    This question targets the evidence: "Execution of a process whose file hash (e.g., SHA256) matches
    a known-malicious signature for reconnaissance/post-exploitation tooling (PowerSploit, BloodHound/SharpHound,
    Empire, Cobalt Strike) frequently used to enumerate local groups and members." A positive result indicates
    likely local-group enumeration (MITRE T1069.001 Local Groups) as part of discovery, where the adversary
    is mapping group membership and privileged accounts to plan privilege abuse or lateral movement; corroborate
    with the account, host, parent process, and surrounding discovery activity before escalating. A negative
    or low-confidence result helps scope out benign administrative usage but should be tuned against your
    own environment baselines and allowlists to limit false positives.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations, User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'from winlog where EventCode=4688 or sysmon EventCode=1

      | lookup ti_known_bad_hashes on Hashes

      | where ti_match=true

      | emit critical_alert(host, user, Image, Hashes)

      // pair with image/command-line behavior rules for renamed binaries'
- question: 'For processes not matching known-bad hashes, score by enterprise-wide prevalence (Volume)?
    (Statistical Method) Specifically, for the behavior: Execution of a process whose file hash (e.g.,
    SHA256) matches a known-malicious signature for reconnaissance/post-exploitation tooling (PowerSploit,
    BloodHound/SharpHound, Empire, Cobalt Strike) frequently used to enumerate local groups and members.'
  context: 'Tactic: Discovery. Statistical Method: For hashes with no known-bad match, compute prevalence
    across the fleet and flag those present on a very small number of endpoints (e.g., fewer than 5 hosts
    or below the 1st percentile), per the fleet-wide rarity approach in [Using Frequency Analysis to Defend
    Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Derive the host-count cutoff per environment from your own 30-day prevalence distribution; ubiquitous
    signed binaries are suppressed while rare unsigned executables are escalated. This question targets
