name: 'T1555.004: Windows Credential Manager'
id: 54e586bd-96ed-435f-8fbd-2841a44b5161
description: 'Investigate whether an adversary has accessed credentials stored in the Windows Credential
  Manager (Credential Lockers / Windows Vaults). This playbook helps an analyst hunt for and triage credential
  theft from the Credential Manager via multiple vectors: execution of known credential-dumping tools
  (Mimikatz, LaZagne, Invoke-WCMDump); enumeration through native ''vaultcmd.exe'' with /list, /listcreds,
  /listschema, or /listproperties switches; credential backup abuse via ''rundll32.exe keymgr.dll KRShowKeyMgr'';
  direct reads of encrypted ''.vcrd'' credential files and the ''Policy.vpol'' key file under the user''s
  Vault/Credentials directories; and programmatic enumeration through Windows APIs such as CredEnumerateA,
  CredReadA, and VaultEnumerateItems. It also correlates credential-store access with suspicious parent-child
  process lineage (Office apps and scripting engines spawning credential tooling) and with anomalous outbound
  network activity that may indicate exfiltration of stolen credentials. Each question pairs symbolic-logic
  detections, statistical baselining, and machine-learning approaches so the analyst can confirm, scope,
  and attribute Credential Access activity.'
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any process execute whose file hash or image name matches a known credential-dumping tool
    (Mimikatz, LaZagne, Invoke-WCMDump) that targets the Windows Credential Manager?
  context: Adversaries pursuing Credential Access frequently deploy off-the-shelf credential-store dumping
    utilities to harvest secrets from the Windows Credential Manager. By querying process-creation telemetry
    for SHA256 hashes and image names and comparing them against a curated threat-intelligence feed of
    known tools (e.g., Mimikatz vault::cred, LaZagne, Invoke-WCMDump), the analyst can rapidly confirm
    tool usage. A positive match on a privileged or user workstation is a high-fidelity indicator of credential
    theft; a negative result does not rule out custom or living-off-the-land tradecraft, so pair this
    with the behavioral hunts below.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Privileged Access Workstations (PAWs), Domain Controllers, Member Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (WinEventLog:Security EventCode=4688, WinEventLog:Sysmon EventCode=1)\n  |\
      \ eval sha256=lower(Hashes_or_SHA256)\n  | lookup credtool_ioc_feed sha256 OUTPUT tool_name\n  |\
      \ where isnotnull(tool_name) OR ImageFileName IN (\"*mimikatz*\",\"*lazagne*\",\"*wcmdump*\")\n\
      \  | table _time, host, user, ImageFileName, sha256, tool_name"
- question: For unknown executables interacting with the credential store, which are low-prevalence across
    the enterprise and show repeated AppLocker/WDAC blocks or crash exit codes?
  context: Sophisticated actors often use novel or custom binaries that will not match IOC feeds. This
    statistical approach computes 30-day enterprise prevalence for each hash and flags those running on
    fewer than 0.1% of endpoints under non-system accounts. In parallel, it profiles the failure mode
    by counting AppLocker/WDAC blocked executions (Event IDs 8003/8004) and non-zero process exit codes
    for the same image. A cluster of low-prevalence binaries with repeated blocked or crashing launches
    near credential-store access is a strong anomaly signal warranting deeper review.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Privileged Access Workstations (PAWs), Domain Controllers, Member Servers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (EventCode=4688, Sysmon EventCode=1)\n  | stats dc(host) as host_count values(user)\
      \ as users by sha256, ImageFileName\n  | eval prevalence=host_count/total_hosts\n  | where prevalence\
      \ < 0.001 AND NOT match(user,\"SYSTEM|LOCAL SERVICE\")\n  | join sha256 [ search EventCode IN (8003,8004)\
      \ OR ProcessExitCode!=0 | stats count as fail_count by sha256 ]\n  | where fail_count > 0\n  | sort\
      \ - fail_count"
- question: Does a machine-learning classifier score any recent process execution as likely-malicious
    based on command-line entropy, parent process, signature status, and API profile?
  context: To catch tooling that evades both IOC and prevalence filters, train a Gradient Boosting classifier
    on features such as process-name and command-line entropy, parent process, user context, signature
    status, and import/API profile (using API-sequence corpora such as Mal-API-2019). Score new executions
    and require the alert to surface the top-3 contributing features (e.g., unsigned image, rare parent,
    high command-line entropy) so analysts can validate the verdict. High-scoring unsigned processes with
    rare parents near Credential Manager activity merit immediate triage.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Privileged Access Workstations (PAWs), Domain Controllers, Member Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model=gbm_process_classifier\n  features = [cmdline_entropy, name_entropy, parent_image,\
      \ user_context, signed_flag, api_profile]\n  | apply model to (EventCode=4688 OR Sysmon EventCode=1)\n\
      \  | where malicious_score > 0.85\n  | table _time, host, ImageFileName, malicious_score, top3_features"
- question: Was 'vaultcmd.exe' executed with credential-enumeration switches such as /list, /listcreds:,
    /listschema, or /listproperties?
  context: '''vaultcmd.exe'' is the native Windows utility for interacting with the Credential Locker,
    and its enumeration switches are a direct means of listing stored credentials. Alert on Event ID 4688
    or Sysmon Event ID 1 when vaultcmd.exe (OriginalFileName VAULTCMD.EXE) runs with /list, /listcreds:,
    /listschema, or /listproperties, particularly when spawned by a non-interactive parent. This is a
    high-signal symbolic detection; validate coverage with Atomic Red Team T1555.004. A match indicates
    active credential enumeration and should be triaged against the user''s expected behavior.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (EventCode=4688, Sysmon EventCode=1)\n  | where (OriginalFileName=\"VAULTCMD.EXE\"\
      \ OR ImageFileName=\"*\\\\vaultcmd.exe\")\n    AND match(CommandLine, \"(?i)/list(creds|schema|properties)?\"\
      )\n  | table _time, host, user, ParentImage, CommandLine"
- question: Is the frequency or parent process of 'vaultcmd.exe' executions anomalous for a given user
    or host, and are there bursts of failed enumerations?
  context: Legitimate vaultcmd.exe usage is rare and predictable. Baseline per-user/per-host execution
    frequency and the set of parent processes, then alert on spikes greater than 3 standard deviations
    or on a first-ever/95th-percentile-rare parent. Profile the failure mode by counting non-zero exit
    codes and access-denied results, since a burst of failed enumerations often indicates scripted brute
    enumeration. This rare-tuple scoring complements the symbolic rule by catching abuse that uses unusual
    context rather than unusual switches.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (EventCode=4688, Sysmon EventCode=1) ImageFileName=\"*vaultcmd.exe\"\n  |\
      \ bin _time span=1d\n  | stats count as exec_count values(ParentImage) as parents by host, user,\
      \ _time\n  | eventstats avg(exec_count) as mu stdev(exec_count) as sd by host, user\n  | where exec_count\
      \ > mu + 3*sd OR NOT parent_in_baseline\n  | append [ search ImageFileName=\"*vaultcmd.exe\" ProcessExitCode!=0\
      \ | stats count as fail_burst by host,user ]"
- question: Does an anomaly model flag unusual parent-child chains involving 'vaultcmd.exe', especially
    from Office apps or scripting engines?
  context: Train an Isolation Forest (with LIME-style explanation) on legitimate parent-child chains and
    flag anomalous sequences involving vaultcmd.exe, especially when launched from Office applications
    or scripting engines (winword.exe, powershell.exe, wscript.exe). The alert should surface the top-3
    contributing features. This unsupervised method detects novel attack chains that neither IOC nor simple-frequency
    rules capture, tying credential enumeration back to a likely initial-access or execution vector.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Terminal Servers, Application Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model=isolation_forest_proc_chains\n  features = [parent_image, grandparent_image, user_context,\
      \ cmdline_tokens]\n  | apply model to events where ImageFileName=\"*vaultcmd.exe\"\n  | where anomaly_score\
      \ > threshold\n  | table _time, host, ParentImage, CommandLine, anomaly_score, top3_features"
- question: Did a process outside a verified allowlist access Windows Vault credential files (*.vcrd,
    Credentials\*, or Policy.vpol)?
  context: Adversaries can bypass vaultcmd.exe by directly reading the encrypted credential files and
    the Policy.vpol key file from the user's Vault/Credentials directories. Alert when Event ID 4663 or
    Sysmon Event ID 11 reports access to '*\Microsoft\Vault\*\*.vcrd', '*\Microsoft\Credentials\*', or
    '*\Policy.vpol' by processes outside a verified allowlist (e.g., lsass.exe, explorer.exe), aggregating
    SourceImage/CallTrace. A non-allowlisted reader of these paths is strong evidence of file-based credential
    theft and should be escalated.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Servers hosting user profiles, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (EventCode=4663, Sysmon EventCode=11)\n  | where match(ObjectName, \"(?i)\\\
      \\Microsoft\\\\Vault\\\\.*\\.vcrd|\\\\Microsoft\\\\Credentials\\\\|Policy\\.vpol\")\n    AND NOT\
      \ (SourceImage IN allowlist(lsass.exe, explorer.exe))\n  | stats values(ObjectName) values(CallTrace)\
      \ by host, SourceImage, user"
- question: Does any process read an abnormally large number of vault files or bytes, or generate a burst
    of access-denied results on vault paths?
  context: 'Apply a volume/frequency model: per process, count distinct vault files opened and total bytes
    read, alerting when a process enumerates more than a host-derived threshold of ''.vcrd'' files (for
    example reading all vault items plus Policy.vpol in one burst). Separately track the state/failure
    rate of access-denied (0xc0000022) object accesses on vault paths as a distinct signal of unauthorized
    enumeration. Wholesale reads of the credential store in a short window are a hallmark of automated
    harvesting rather than normal application access.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Servers hosting user profiles, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (EventCode=4663, Sysmon EventCode=11) ObjectName=\"*\\\\Microsoft\\\\Vault\\\
      \\*\"\n  | stats dc(ObjectName) as files_read sum(bytes) as total_bytes by host, SourceImage\n \
      \ | where files_read > host_vcrd_threshold\n  | append [ search EventCode=4663 AccessMask_status=0xc0000022\
      \ ObjectName=\"*Vault*\" | stats count as denied by host, SourceImage ]"
- question: Does provenance-based anomaly detection flag an unusual process node or edge reading the credential
    store?
  context: Model host file/process provenance and flag anomalous nodes/edges that read the credential
    store, using node-level provenance learning such as ThreaTrace. The alert must localize and report
    the top-3 anomalous features (rare reader process, abnormal byte volume, rare lineage). This graph-based
    approach catches stealthy readers that operate within normal volume thresholds but exhibit anomalous
    lineage, providing defense-in-depth over the symbolic and volume detections for file-based Credential
    Access.
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User Workstations, Servers hosting user profiles, Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model=threatrace_provenance\n  build graph from (file reads of Vault/Credentials paths\
      \ joined to process lineage)\n  | score nodes/edges\n  | where node_anomaly_score > threshold\n\
      \  | table host, reader_process, lineage, top3_features"
- question: Was Windows Credential Manager access followed within minutes by an anomalous outbound connection
    to a newly-seen or threat-intel destination?
  context: Credential theft is usually a means to an end; stolen credentials are often exfiltrated shortly
    after harvesting. Correlate T1555.004 events (vaultcmd execution, vault file reads, credential APIs)
    with outbound Zeek conn.log/dns.log connections within a 5-minute window to newly-seen or threat-intel
    destinations on the same host, and alert. A tight temporal coupling between credential-store access
    and an unusual egress connection strongly suggests active exfiltration and warrants immediate containment.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Internet Gateway, DNS Servers, Proxy Servers'
  range: Last 90 days; event-centered correlation, 5-minute window after credential access
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  let cred = search (vaultcmd exec OR vault file read OR credential API) | table _time,\
      \ host\n  | join host [ search Zeek conn.log OR dns.log\n      | where dest_newly_seen OR dest_in_threat_intel\
      \ ]\n  | where abs(conn_time - cred_time) <= 300\n  | table cred_time, host, dest_ip, dest_host,\
      \ service"
- question: After credential access, were there outbound connections to low-prevalence destinations, high-volume
    transfers, or bursts of NXDOMAIN/refused connections?
  context: After T1555.004 activity, flag outbound destinations in the bottom 1% of enterprise frequency
    or with orig_bytes above the host's 95th percentile (volume signal). Explicitly profile the failure
    mode by counting NXDOMAIN/dns.log rcode!=0 and refused/blocked conn.log attempts in the same window,
    since C2 resolution failures often precede successful exfil. This statistical view catches exfiltration
    to rare infrastructure and the noisy reconnaissance that often accompanies a freshly stood-up C2 channel.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Internet Gateway, DNS Servers, Proxy Servers'
  range: Last 90 days; event-centered correlation after credential access
  queries:
  - technology: Zeek/pseudocode
    query: ">-\n  after cred_access on host:\n  conn.log | stats sum(orig_bytes) as bytes count by host,\
      \ dest\n  | eval dest_prev=lookup_prevalence(dest)\n  | where dest_prev < 0.01 OR bytes > host_p95_bytes\n\
      \  | append [ dns.log rcode!=0 | stats count as nxdomain by host ]\n  | append [ conn.log conn_state\
      \ IN (REJ,S0) | stats count as refused by host ]"
- question: Does a sequence model flag a high-risk transition path of credential access followed by outbound
    connection on the same host?
  context: Model the host event stream (credential access then outbound connection) with a Hidden Markov
    Model and alert on high-risk transition paths, or use an LSTM over native Windows audit logs. The
    alert should report the top-3 sequence features driving the score. Sequence-based modeling captures
    the temporal signature of the harvest-then-exfil kill chain even when individual events look benign,
    providing a behavioral backstop to the correlation and statistical detections.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Internet Gateway, DNS Servers, Proxy Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model=hmm_or_lstm_host_sequence\n  input = ordered host events [cred_access -> network_connect]\n\
      \  | score transition paths\n  | where path_risk > threshold\n  | table host, sequence, path_risk,\
      \ top3_features"
- question: Did an initial-access or execution process (winword.exe, excel.exe, powershell.exe, wscript.exe,
    mshta.exe) spawn a child that interacts with the Credential Manager (vaultcmd.exe or rundll32.exe
    keymgr.dll KRShowKeyMgr)?
  context: A common attack chain has a malicious document or script directly spawning credential tooling.
    Flag process creations where suspicious parents (winword.exe, excel.exe, powershell.exe, wscript.exe,
    mshta.exe) spawn vaultcmd.exe or 'rundll32.exe keymgr.dll KRShowKeyMgr' (the credential-backup abuse
    vector). This symbolic detection ties Credential Access back to an initial-access foothold; a match
    indicates a likely end-to-end intrusion and should be triaged with high priority.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Email Gateway Servers, Web Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (EventCode=4688, Sysmon EventCode=1)\n  | where ParentImage IN (\"*winword.exe\"\
      ,\"*excel.exe\",\"*powershell.exe\",\"*wscript.exe\",\"*mshta.exe\")\n    AND ( ImageFileName=\"\
      *vaultcmd.exe\"\n      OR (ImageFileName=\"*rundll32.exe\" AND match(CommandLine,\"(?i)keymgr\\\
      .dll.*KRShowKeyMgr\")) )\n  | table _time, host, user, ParentImage, ImageFileName, CommandLine"
- question: Are there rare parent-child process pairs involving the Credential Manager that have been
    seen fewer than five times across the enterprise?
  context: Build parent-child frequency tables and alert on pairs involving the credential manager seen
    fewer than five times enterprise-wide, using a rare-tuple mining approach. This catches novel or unexpected
    launch chains (e.g., a service or scheduled task spawning vaultcmd.exe) that the hardcoded suspicious-parent
    list would miss. Rarity is a strong proxy for maliciousness when the child process is a credential-store
    tool, since legitimate credential enumeration is highly predictable.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Email Gateway Servers, Web Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (EventCode=4688, Sysmon EventCode=1)\n  | where ImageFileName IN (\"*vaultcmd.exe\"\
      ,\"*rundll32.exe\") AND match(CommandLine,\"(?i)keymgr|/list\")\n  | stats count as pair_count by\
      \ ParentImage, ImageFileName\n  | where pair_count < 5\n  | table ParentImage, ImageFileName, pair_count"
- question: Does provenance-graph anomaly detection identify suspicious multi-hop paths leading to credential-manager
    interaction (e.g., winword.exe -> cmd.exe -> vaultcmd.exe)?
  context: Apply provenance-graph anomaly detection to identify anomalous edges/paths such as 'winword.exe
    -> cmd.exe -> vaultcmd.exe', using graph temporal autoencoders with attack-graph reconstruction (KAIROS).
    Surface the top-3 contributing edges/features in the alert. This catches multi-hop intermediary chains
    that simple parent-child rules miss, reconstructing the full lineage from initial access to Credential
    Access and giving analysts the context to scope the intrusion.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations, Email Gateway Servers, Web Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  model=kairos_provenance_graph\n  build temporal graph from process-creation lineage\n\
      \  | reconstruct and score paths ending at (vaultcmd.exe OR keymgr.dll KRShowKeyMgr)\n  | where\
      \ path_anomaly_score > threshold\n  | table host, path, top3_edges"
- question: Did a non-allowlisted process call credential-enumeration APIs such as CredEnumerateA, CredReadA,
    or VaultEnumerateItems?
  context: Adversaries can enumerate credentials programmatically through Windows APIs, bypassing both
    vaultcmd.exe and direct file reads. Alert when EDR/ETW telemetry records CredEnumerateA, CredReadA,
    or VaultEnumerateItems from non-allowlisted processes, using a caller-allowlist plus call-trace aggregation
    pattern. A non-trusted process invoking these credential APIs is a high-fidelity indicator of in-memory
    credential harvesting and should be triaged against the process's signature and lineage.
  answer_sources:
  - EDR Telemetry (API Calls)
  - 'NAI: User Workstations, Privileged Access Workstations (PAWs), Critical Servers'
  range: Last 90 days
  queries:
  - technology: EDR/pseudocode
    query: ">-\n  source = EDR_API_telemetry (ETW)\n  | where ApiName IN (\"CredEnumerateA\",\"CredReadA\"\
      ,\"VaultEnumerateItems\")\n    AND NOT (CallerImage IN credential_api_allowlist)\n  | stats values(ApiName)\
      \ values(CallTrace) by host, CallerImage, user"
- question: Is a process calling credential APIs far more frequently than baseline or for the first time,
    with a burst of not-found/access-denied return codes?
  context: Baseline per-host/per-process credential-API call frequency and flag processes exceeding the
    99th percentile or calling these APIs for the first time. Explicitly profile the failure mode by counting
    ERROR_NOT_FOUND/ERROR_ACCESS_DENIED return codes, since rapid enumeration loops produce a distinctive
    burst of not-found results. This statistical view distinguishes a benign single lookup from an automated
    VaultEnumerateItems -> CredRead harvesting loop characteristic of credential theft.
  answer_sources:
  - EDR Telemetry (API Calls)
  - 'NAI: User Workstations, Privileged Access Workstations (PAWs), Critical Servers'
  range: Last 90 days
  queries:
  - technology: EDR/Stats pseudocode
    query: ">-\n  source = EDR_API_telemetry\n  | where ApiName IN (\"CredEnumerateA\",\"CredReadA\",\"\
      VaultEnumerateItems\")\n  | stats count as calls by host, CallerImage\n  | eventstats perc99(calls)\
      \ as p99 by host\n  | where calls > p99 OR first_seen=true\n  | append [ search ReturnCode IN (\"\
      ERROR_NOT_FOUND\",\"ERROR_ACCESS_DENIED\") | stats count as fail_burst by host, CallerImage ]"
- question: Does a sequence model classify a process's credential-API call sequence as a high-probability
    malicious enumeration chain (e.g., VaultEnumerateItems -> CredRead loops)?
  context: Classify credential-API call sequences with a model trained on API-sequence corpora (Mal-API-2019)
    using sequence-alignment or LSTM features, flagging high-probability malicious enumeration chains
    such as VaultEnumerateItems followed by repeated CredRead loops, and reporting the top-3 contributing
    features. This sequence-aware approach detects the structured pattern of programmatic credential harvesting
    that frequency thresholds alone may miss, completing the API-based detection coverage.
  answer_sources:
  - EDR Telemetry (API Calls)
  - 'NAI: User Workstations, Privileged Access Workstations (PAWs), Critical Servers'
  range: Last 90 days
  queries:
  - technology: EDR/ML pseudocode
    query: ">-\n  model=api_sequence_classifier (seq-align or LSTM, trained on Mal-API-2019)\n  input\
      \ = ordered credential-API call sequence per process\n  | score sequences\n  | where malicious_prob\
      \ > 0.85\n  | table host, CallerImage, sequence, malicious_prob, top3_features"
