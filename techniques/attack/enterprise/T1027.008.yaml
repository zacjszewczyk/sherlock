name: 'T1027.008: Obfuscated Files or Information: Stripped Payloads'
id: 72a49eb9-cb1f-456a-94a2-20f10d96fbdd
description: Investigate whether an adversary is using stripped payloads - executables or scripts with
  symbols, strings, version metadata, and other human-readable information deliberately removed - to hinder
  reverse engineering and evade detection. This playbook helps an analyst hunt for newly observed PE,
  ELF, Mach-O, and script payloads that match known stripped malware hashes/YARA rules, that lack symbol
  tables (.symtab/.strtab), VersionInfo/.rsrc resources, or DWARF/symbol sections (while retaining Go
  pclntab runtime metadata), that exhibit abnormally high section entropy with sparse strings, that execute
  from user-writable or non-standard directories, that masquerade as trusted system binaries from outside
  System32, and that initiate regular beacon-like outbound connections. It pairs deterministic symbolic-logic
  detections with statistical baselining and explainable machine-learning models across Windows, Linux,
  macOS, and network telemetry, profiling both successful drops/executions and failed/blocked transfers
  as distinct signals.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Do any executables or scripts seen being transferred over the network or written to disk match
    a known stripped/packed malware sample by hash, YARA rule, or threat-intelligence IOC, whether the
    drop or execution succeeded or was blocked?
  context: 'This is the deterministic detection floor for the Stealth tactic: adversaries strip payloads
    precisely so static analysis is harder, but a hash never lies. Take SHA256/MD5 hashes captured in
    Zeek files.log network transfers and in Sysmon Event ID 11 file-creation events, compare them against
    threat-intelligence feeds and YARA rules built for stripped/packed binaries (e.g. Neo23x0 signature-base),
    and alert when a known sample is written or executed. Profile failed/blocked transfers as a distinct
    signal because scripted retries from a stripped dropper often appear first as repeated blocked drops.
    A positive match is high-confidence and should trigger containment; maintain this hash/IOC floor independent
    of any statistical or ML scoring so a known-bad payload is never missed because a model under-scored
    it. References: [Neo23x0 signature-base](https://github.com/Neo23x0/signature-base).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, User workstations, Critical application servers, File shares,
    Email gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (zeek_files, sysmon_eid11)\n  | eval h = coalesce(sha256, md5)\n  | lookup\
      \ ti_iocs hash AS h OUTPUT ti_source, ti_label\n  | yara_match(file_bytes) AS yara_rule\n  | where\
      \ isnotnull(ti_label) OR isnotnull(yara_rule)\n  | table _time, host, path, h, ti_source, yara_rule,\
      \ action_status"
  - technology: Zeek/pseudocode
    query: ">-\n  files.log: for each f -> if f.sha256 in ti_hash_set or yara(f) matches\n  stripped_ruleset\
      \ -> emit alert{host, conn_uid, sha256, mime_type}"
- question: Is a host suddenly creating or receiving an abnormal volume of previously-unseen executable
    hashes, or showing a spike in blocked/failed transfers and failed executions, compared with its own
    30-day baseline?
  context: 'Stripped-payload staging often shows up as a burst of brand-new binaries or repeated failed
    drops as the adversary iterates. Count unique previously-unseen executable hashes per hour per host
    (Volume) and track the rate of blocked/failed transfers and failed executions (State/Failure) over
    a rolling 30-day baseline segmented by host and file type. Alert when the unseen-hash count exceeds
    three standard deviations above that host''s normal, or when the failed-drop rate spikes - the latter
    can indicate scripted retries by a dropper whose payload is being blocked by EDR. This statistical
    view catches novel stripped samples that have no TI/YARA match yet. A positive result is a deviation
    from the host''s established norm; correlate with the hash/YARA check and with what process is creating
    the files. References: [EMBER, Anderson and Roth](https://arxiv.org/abs/1804.04637).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, User workstations, Critical application servers, File shares,
    Email gateways'
  range: Last 90 days (30-day rolling baseline, 1-hour evaluation windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (zeek_files, sysmon_eid11, eid4688)\n  | bin _time span=1h\n  | stats dc(eval(if(first_seen_hash,hash,null)))\
      \ AS new_hashes,\n          count(eval(status IN (\"blocked\",\"failed\"))) AS fail_drops BY host,\
      \ file_type, _time\n  | eventstats avg(new_hashes) AS mu, stdev(new_hashes) AS sd BY host, file_type\n\
      \  | where new_hashes > mu + 3*sd OR fail_drops > fail_baseline"
- question: When suspicious-file static features are scored by an explainable gradient-boosted model,
    which newly observed files exceed a malicious probability of 0.8, and which static features (string
    density, .rsrc size, entropy) drove that score?
  context: 'Stripped payloads change the static fingerprint of a file - fewer strings, lower printable
    density, smaller/absent resources, higher entropy. Train a gradient-boosted tree (XGBoost/LightGBM)
    on EMBER-style static features (file size, byte/section entropy, string count and printable density,
    import/export counts, signer presence, source context) and triage files whose malicious probability
    exceeds 0.8. Crucially, include the top-3 SHAP contributing features in the alert text so the analyst
    can see WHY the model flagged it (e.g. extremely low string-density plus tiny .rsrc plus high entropy
    is the signature of stripping). This supports the Stealth-tactic hunt by surfacing samples engineered
    to defeat human analysis. A high-probability hit with stripping-consistent SHAP features warrants
    sandbox detonation and the deterministic hash/YARA cross-check. References: [EMBER, Anderson and Roth](https://arxiv.org/abs/1804.04637);
    [Zero-Day Malware Detection Using XGBoost and Random Forest](https://www.researchgate.net/publication/386124227_Performance_Comparative_Study_on_Zero_Day_Malware_Detection_Using_XGBoost_and_Random_Forest_Classifiers);
    [Rule Extraction and Interaction-Aware Explainability](https://link.springer.com/chapter/10.1007/978-3-032-08887-1_9).'
  answer_sources:
  - Zeek files.log
  - Windows Event ID 11 (Sysmon)
  - Windows Event ID 4688
  - 'NAI: Network egress/ingress points, User workstations, Critical application servers, File shares,
    Email gateways'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  feats = ember_static_features(file)  # size, entropy, strings, imports, signer\n  p\
      \ = gbt_model.predict_proba(feats)\n  if p >= 0.8:\n      top3 = shap_top_features(gbt_model, feats,\
      \ k=3)\n      emit alert{file, host, p, top3}"
- question: Do any newly observed PE, ELF, or Mach-O files show static structural evidence of stripping
    - a missing/tiny symbol table, absent .rsrc/VersionInfo, no DWARF sections, or UPX markers - relative
    to legitimate software of the same family?
  context: 'This is the core symbolic-logic test for the technique. Submit new binaries to static analysis
    and alert when: a PE lacks a .rsrc/VersionInfo or exposes an unusually small symbol table; an ELF
    has stripped .symtab/.strtab or carries UPX packer markers; or a Go binary lacks DWARF/symbol sections
    yet retains pclntab runtime metadata (a tell-tale of a stripped Go malware build). Use osquery elf_info
    and Zeek pe.log/files.log plus auditd file writes to gather the structural facts. The lack of human-readable
    symbols and strings is the defining property of T1027.008 and directly hinders downstream analysis.
    A positive result - structurally stripped binary that is not a known signed legitimate tool - is a
    strong lead for sandbox detonation and provenance investigation. References: [ELF Malware Analysis
    101, Intezer](https://intezer.com/blog/malware-analysis/elf-malware-analysis-101-linux-threats-no-longer-an-afterthought/);
    [Golang Internals and Symbol Recovery, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/golang-internals-symbol-recovery/).'
  answer_sources:
  - Zeek files.log
  - Zeek pe.log
  - Windows Event ID 11 (Sysmon)
  - auditd:SYSCALL
  - linux:osquery
  - 'NAI: File sandboxes, User workstations, Application servers, Network file shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (zeek_pe, zeek_files, osquery_elf_info, sysmon_eid11, auditd_syscall)\n  |\
      \ eval pe_strip = (format==\"PE\" AND (rsrc_size==0 OR symtab_count < 5))\n  | eval elf_strip =\
      \ (format==\"ELF\" AND (symtab_stripped==true OR upx_marker==true))\n  | eval go_strip = (has_pclntab==true\
      \ AND has_dwarf==false)\n  | where pe_strip OR elf_strip OR go_strip\n  | table _time, host, path,\
      \ format, symtab_count, rsrc_size, has_pclntab"
  - technology: Linux/osquery pseudocode
    query: ">-\n  SELECT path, sha256 FROM elf_info\n  WHERE has_symtab=0 OR has_debug=0;  -- join to\
      \ file_metadata for provenance"
- question: Which files fall below the 5th percentile of import/export counts and printable-string density
    for their software family, indicating abnormally sparse human-readable content?
  context: 'String and section statistics are among the strongest discriminators for packed or stripped
    binaries. Compute import/export counts and printable-string density (string count, mean string length,
    string entropy) for each new file and compare them to per-software-family baselines, flagging files
    below the 5th percentile. The reasoning is that legitimate compiled software carries a predictable
    richness of symbols and strings; deliberately stripped malware sits in the extreme low tail. This
    statistical method generalizes beyond known samples and supports the Stealth hunt by catching novel
    stripped payloads. A low-percentile result, especially combined with the structural strip checks,
    indicates an intentionally minimized payload meriting deeper analysis. References: [EMBER, Anderson
    and Roth](https://arxiv.org/abs/1804.04637); [Analysis of Machine Learning Approaches to Packing Detection,
    Mantovani et al.](https://arxiv.org/abs/2105.00473).'
  answer_sources:
  - Zeek files.log
  - Zeek pe.log
  - Windows Event ID 11 (Sysmon)
  - auditd:SYSCALL
  - linux:osquery
  - 'NAI: File sandboxes, User workstations, Application servers, Network file shares'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (zeek_pe, zeek_files, osquery_elf_info)\n  | stats values(string_count) string_density\
      \ imports exports BY file, family\n  | eventstats perc5(string_density) AS p5_sd, perc5(imports)\
      \ AS p5_imp BY family\n  | where string_density < p5_sd OR imports < p5_imp"
- question: When static feature vectors are clustered, which files emerge as outliers separate from the
    bulk of normal software, and which features make them anomalous?
  context: 'Stripped payloads are statistically unusual, so unsupervised clustering can isolate them without
    labels. Apply DBSCAN or Isolation Forest to static feature vectors (section layout, symbol count,
    string density, metadata presence) and investigate files that fall outside dense clusters or score
    as anomalies. Report the top-3 deviating features for each outlier so triage is explainable (e.g.
    this file is an outlier because of near-zero symbols, missing VersionInfo, and abnormal section count).
    This complements the percentile method by capturing multivariate combinations of anomalies. An outlier
    consistent with stripping is a hunting lead; cross-reference against TI/YARA and execution context
    before escalating. References: [Analysis of Machine Learning Approaches to Packing Detection, Mantovani
    et al.](https://arxiv.org/abs/2105.00473).'
  answer_sources:
  - Zeek files.log
  - Zeek pe.log
  - Windows Event ID 11 (Sysmon)
  - auditd:SYSCALL
  - linux:osquery
  - 'NAI: File sandboxes, User workstations, Application servers, Network file shares'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  X = static_feature_matrix(new_files)  # sections, symbols, strings, metadata\n  labels\
      \ = DBSCAN(eps, min_samples).fit_predict(X)  # or IsolationForest\n  for f where labels==-1 or iforest_score(f)\
      \ high:\n      emit alert{f, top3_deviating_features(f)}"
- question: For stripped binaries, does an ML function-boundary recovery model recover many functions
    while the file declares few or no symbols - the hallmark of deliberate symbol stripping?
  context: 'A binary can be stripped of declared symbols yet still contain plenty of real code. Run an
    RNN/ML function-boundary recovery model over each stripped candidate and compare the number of recovered
    functions against the number of declared symbols. A large gap - many recovered functions but few/no
    declared symbols - is strong evidence that symbols were intentionally removed rather than simply being
    a small, simple binary. This directly operationalizes the definition of T1027.008 (removal of symbols/strings
    to hinder analysis). A pronounced recovered-vs-declared gap should be reported with both counts as
    evidence and routed to reverse engineering, especially for binaries already flagged by the structural
    or statistical checks. References: [Recognizing Functions in Binaries with Neural Networks, Shin et
    al.](https://www.usenix.org/system/files/conference/usenixsecurity15/sec15-paper-shin.pdf).'
  answer_sources:
  - Zeek files.log
  - Zeek pe.log
  - Windows Event ID 11 (Sysmon)
  - auditd:SYSCALL
  - linux:osquery
  - 'NAI: File sandboxes, User workstations, Application servers, Network file shares'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  recovered = rnn_function_boundary_model(binary)\n  declared = count_declared_symbols(binary)\n\
      \  if len(recovered) > N and declared <= k:\n      emit alert{binary, recovered=len(recovered),\
      \ declared, gap=len(recovered)-declared}"
- question: Do any PE files show a .text section with Shannon entropy above 7.2 combined with a missing,
    tiny, or stripped .rsrc resource section that would normally carry version or UI metadata?
  context: 'High code-section entropy is a reliable signature of packed or encrypted code, and when paired
    with absent resources it strongly suggests a stripped/packed payload rather than benign software.
    Alert when static analysis reports .text entropy above 7.2 while the .rsrc section is missing, tiny,
    or stripped of expected VersionInfo. Empirically, entropy above ~7.2 separates packed/encrypted code
    from legitimate code, which typically sits at 5.0-6.5. This deterministic rule supports the Stealth
    hunt by flagging payloads engineered to resist static inspection. A positive result is a packed/stripped
    PE; detonate it and correlate with execution context and the hash/YARA floor. Tune the .rsrc threshold
    to your environment to limit benign installers/compressors. References: [Using Entropy Analysis to
    Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989); [Baseline Payload
    Entropy Values for Common Internet Services](https://www.mdpi.com/1999-5903/16/12/470).'
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: File sandboxes, Network egress/ingress points, User workstations, Endpoint Detection and Response
    (EDR) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (zeek_pe, zeek_files, eid4688)\n  | where format==\"PE\" AND text_entropy\
      \ > 7.2\n        AND (rsrc_size==0 OR rsrc_size < rsrc_min OR rsrc_versioninfo==false)\n  | table\
      \ _time, host, path, text_entropy, rsrc_size"
- question: Which files have .text entropy or .rsrc size values that fall outside the interquartile/percentile
    bounds of your known-good software baseline for the same family?
  context: 'Fixed entropy constants are brittle, so derive thresholds from your own gold corpus. Use interquartile
    range and percentile thresholds to identify .text entropy and .rsrc size values that deviate from
    known-good software baselines per family. This adapts the high-entropy idea to your environment''s
    actual software distribution, reducing false positives from legitimately compressed or protected applications
    while still catching outliers. It supports the Stealth-tactic hunt by surfacing files whose entropy/resource
    profile is anomalous relative to peers. A value beyond the upper entropy fence with an anomalously
    small resource section is a strong stripped/packed lead; combine with execution and provenance context
    before escalating. References: [Analysis of Machine Learning Approaches to Packing Detection, Mantovani
    et al.](https://arxiv.org/abs/2105.00473).'
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: File sandboxes, Network egress/ingress points, User workstations, Endpoint Detection and Response
    (EDR) platforms'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source IN (zeek_pe, zeek_files)\n  | stats values(text_entropy) values(rsrc_size) BY\
      \ file, family\n  | eventstats perc75(text_entropy) AS q3, perc25(text_entropy) AS q1 BY family\n\
      \  | eval upper = q3 + 1.5*(q3-q1)\n  | where text_entropy > upper OR rsrc_size < perc5_rsrc"
- question: When per-section entropy vectors are scored by an autoencoder trained on normal software,
    which files produce high reconstruction error, and which section drove that error?
  context: 'An autoencoder learns the normal joint distribution of [.text, .data, .rsrc] entropy and flags
    files it cannot reconstruct well. Train it on known-good entropy profiles and alert on files with
    high reconstruction error, surfacing which section contributed most to the error for explainability.
    This captures multivariate entropy anomalies (e.g. high .text with empty .rsrc) that single-threshold
    rules miss, and it adapts as your software baseline shifts. It supports the Stealth hunt by detecting
    packing/stripping patterns without needing labeled malware. A high-error file with the error localized
    to a high-entropy code section and a starved resource section is a packed/stripped candidate for detonation.
    References: [Isolation Forest vs. Autoencoders for Zero-Day Network Attack Detection](https://ieeexplore.ieee.org/document/10143005/).'
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: File sandboxes, Network egress/ingress points, User workstations, Endpoint Detection and Response
    (EDR) platforms'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  v = [text_entropy, data_entropy, rsrc_entropy]\n  recon = autoencoder.predict(v)\n \
      \ err = mse(v, recon)\n  if err > thr:\n      emit alert{file, err, worst_section=argmax(abs(v-recon))}"
- question: When a raw-byte CNN (MalConv) classifies executables directly from bytes, which stripped payloads
    score as malicious, and which byte sub-regions drove the decision?
  context: 'When symbols and strings are absent, engineered features degrade - but a raw-byte CNN like
    MalConv classifies executables straight from their bytes and can localize the contributing byte sub-regions.
    Apply MalConv to candidate executables and alert on malicious classifications, including the highlighted
    byte regions in the alert so an analyst can focus reverse engineering. This is especially valuable
    against deliberately stripped payloads that defeat string/symbol-based methods, directly addressing
    the Stealth tactic. A malicious MalConv verdict with coherent highlighted regions is a strong lead;
    corroborate with the deterministic hash/YARA floor and detonation, since deep models can be evaded
    and should not be the sole signal. References: [Malware Detection by Eating a Whole EXE (MalConv),
    Raff et al.](https://arxiv.org/abs/1710.09435).'
  answer_sources:
  - Zeek pe.log
  - Zeek files.log
  - Windows Event ID 4688
  - 'NAI: File sandboxes, Network egress/ingress points, User workstations, Endpoint Detection and Response
    (EDR) platforms'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  bytes = read_raw(file)\n  p, attribution = malconv.predict_with_attribution(bytes)\n\
      \  if p >= thr:\n      emit alert{file, p, top_byte_regions=attribution.topk()}"
- question: Does a process spawned from a stripped executable in a non-standard directory (such as %APPDATA%
    or C:\Users\Public) make outbound connections - successful or failed - to threat-intelligence-listed
    infrastructure within 60 seconds of launch?
  context: Stripped payloads often run as droppers/implants from user-writable directories and immediately
    call out to C2. For executables flagged as stripped, correlate process creation (Event ID 4688) with
    Zeek conn.log/dns.log connections to TI-listed IPs/domains within a 60-second window and alert on
    matches. This event-centered correlation ties a stealthy file artifact to a network behavior, sharply
    raising confidence. Track failed connections too (NXDOMAIN, blocked, refused) because a stripped implant
    whose C2 is down still reveals intent. A positive correlation - stripped binary from %APPDATA% talking
    to known-bad infrastructure - is high-confidence malicious activity warranting isolation and C2 blocking.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User workstations, Domain Controllers, Network egress/ingress points, DNS servers'
  range: Last 90 days (correlate within 60 seconds of process start)
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  let stripped = (eid11 OR scan results where stripped==true)\n  source=eid4688 [process\
      \ from stripped image, path in user_writable_dirs]\n  | join host, time +/-60s [source IN (zeek_conn,\
      \ zeek_dns)\n        | lookup ti_infra dest AS ip_or_domain OUTPUT ti_label]\n  | where isnotnull(ti_label)\n\
      \  | table _time, host, image, path, dest, ti_label, conn_status"
- question: Which processes from stripped executables exhibit near-constant beacon timing or byte-volume
    regularity, or an abnormal rate of NXDOMAIN/blocked/refused connections, indicating automated C2?
  context: 'Human activity is irregular; automated beacons are not. Measure inter-arrival-time and byte-volume
    variance over 10-minute windows (Frequency/Volume) for outbound traffic from processes tied to stripped
    binaries and flag those with near-constant timing or volume. Separately count NXDOMAIN/blocked/refused
    connections per process (Failure/State) - a stripped implant retrying dead or sinkholed C2 produces
    an abnormal failure profile. Both rigid regularity and abnormal failure rates indicate machine-driven
    communication. This statistical method supports the Stealth hunt by exposing the network rhythm of
    a concealed implant even when the payload itself resists static analysis. Low timing/volume variance
    or a failure spike is a strong beaconing lead to correlate with the TI and process context. References:
    [Anomalous Payload-Based Network Intrusion Detection (PAYL), Wang and Stolfo](https://link.springer.com/chapter/10.1007/978-3-540-30143-1_11).'
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User workstations, Domain Controllers, Network egress/ingress points, DNS servers'
  range: Last 90 days (10-minute analysis windows)
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  source=zeek_conn [src process tied to stripped image]\n  | bin _time span=10m\n  | stats\
      \ var(interarrival) AS iat_var, var(bytes) AS vol_var,\n          count(eval(status IN (\"NXDOMAIN\"\
      ,\"blocked\",\"refused\"))) AS fails BY proc, host, _time\n  | where iat_var < eps OR vol_var <\
      \ eps OR fails > fail_thr"
- question: Does an ARIMA model fit a host's outbound traffic with unusually low forecast error - a sign
    that the traffic is machine-generated beaconing rather than human activity?
  context: Beaconing is highly predictable, so a time-series model will forecast it almost perfectly.
    Apply ARIMA to outbound traffic from hosts running stripped executables and alert when the model repeatedly
    fits the behavior with unusually low forecast error, indicating machine-driven beaconing. Report the
    fitted period and residual as evidence so the analyst can see the cadence (e.g. a 300-second period
    with near-zero residual). This complements variance-based detection by explicitly recovering the beacon
    interval. Consistently low forecast error on traffic from a stripped-payload process is strong evidence
    of automated C2; pivot to the destination, the TI check, and the process lineage to confirm.
  answer_sources:
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User workstations, Domain Controllers, Network egress/ingress points, DNS servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: ">-\n  ts = outbound_volume_series(host, bin=60s)\n  model = ARIMA(ts).fit()\n  if rolling_forecast_error(model)\
      \ < thr:\n      emit alert{host, period=model.seasonal_period, residual=model.resid_std}"
- question: Are any processes using the names of trusted Windows binaries but executing from outside System32,
    or showing hash/signature mismatches, while looking like stripped payloads rather than signed Microsoft
    binaries?
  context: 'Masquerading is a Stealth staple: a stripped implant named svchost.exe or lsass.exe but run
    from C:\Users\Public is trying to blend in. Trigger on Event ID 4688/Sysmon Event ID 11 when trusted
    process names execute from non-System32 paths or show hash/signature mismatches, prioritizing binaries
    already flagged as stripped or unsigned (cross-reference Neo23x0 signature-base). The combination
    of a trusted name in the wrong location with stripped/unsigned metadata is rarely benign. A positive
    result strongly indicates masqueraded malware; verify the image path, signer, and parent process,
    then isolate and hunt for lateral movement, since system-binary impersonation often accompanies privileged
    activity. References: [Neo23x0 signature-base](https://github.com/Neo23x0/signature-base).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 11 (Sysmon)
  - 'NAI: Domain Controllers, User workstations, Critical application servers, System Registry'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  source IN (eid4688, sysmon_eid11)\n  | where process_name IN (system_binary_names)\n\
      \        AND (NOT match(image_path, \"\\\\\\\\System32\\\\\\\\\")\n             OR signature_status!=\"\
      signed\" OR hash NOT IN known_good_hash[process_name])\n  | eval strip_flag = lookup_stripped(image_path)\n\
      \  | table _time, host, process_name, image_path, signature_status, strip_flag"
- question: Which system binaries show new parent-child process relationships that fall below the 1st
    percentile of historical prevalence, or an abnormal number of failed/denied launches?
  context: Legitimate system processes have stable, well-known parentage; a stripped masquerading binary
    often produces a parent-child pairing never seen before. Baseline parent-child relationships and execution
    counts (Frequency) for system binaries and flag new pairings below the 1st percentile of historical
    prevalence. Separately track failed/denied launches as a distinct State signal, since a misconfigured
    or blocked implant may repeatedly fail to start. This statistical approach supports the Stealth hunt
    by detecting impersonation through anomalous process lineage even when the binary name and location
