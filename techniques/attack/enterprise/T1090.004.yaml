- question: 'Using deterministic rule logic, can you determine whether ''Match CDN JA3 to TI'' indicates
    domain fronting C2 activity? Specifically: Filter Zeek ssl.log for connections to known CDN IP ranges
    and extract JA3/JA3S ([JA3](https://github.com/salesforce/ja3)) and, preferably, the extension-order-resilient
    JA4/JA4S ([JA4+](https://github.com/FoxIO-LLC/ja4)) fingerprints. Match against TI lists of fingerprints
    tied to known frameworks (Cobalt Strike, Metasploit, meek). Because browser TLS extension randomization
    destabilizes JA3 and inflates false positives ([JA3 fingerprints fade](https://www.stamus-networks.com/blog/ja3-fingerprints-fade-browsers-embrace-tls-extension-randomization)),
    prefer JA4 for allow/deny lists and treat fingerprint hits as corroborating—not sole—evidence.'
