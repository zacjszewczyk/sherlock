questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match mismatches to TI'' indicates
    domain fronting C2 activity? Specifically: Join Zeek ssl.log and http.log by connection UID and isolate
    sessions where ssl.log.server_name != http.log.host OR (ssl.log.server_name is null/empty AND http.log.host
    is not null) — the defining domain-fronting and ''domainless'' observable per [Blocking-resistant
    communication through domain fronting](https://www.scitepress.org/Papers/2016/57407/57407.pdf). Join
    to conn.log on UID, extract http.log.host and conn.log.id.resp_h, and match against a high-fidelity
    threat-intel feed of malicious domains/IPs. Alert on any match. Keep this deterministic rule as the
    floor of detection; do not delete the explicit mismatch/blank-SNI comparison.'
  context: 'Tactic context (TA0011 / Command and Control): the adversary is trying to communicate with
    compromised systems while mimicking normal, expected HTTPS traffic to avoid detection; domain fronting
    abuses shared CDN/cloud routing so traffic appears destined for a benign domain while reaching attacker
    C2. Evidence under investigation: A network connection exhibits a mismatch between the TLS Server
    Name Indication (SNI) and the inner HTTP Host header, where the inner HTTP Host header domain or the
    destination IP address matches a known malicious indicator from a high-fidelity threat intelligence
    feed. Approach (Match mismatches to TI): Join Zeek ssl.log and http.log by connection UID and isolate
    sessions where ssl.log.server_name != http.log.host OR (ssl.log.server_name is null/empty AND http.log.host
    is not null) — the defining domain-fronting and ''domainless'' observable per [Blocking-resistant
    communication through domain fronting](https://www.scitepress.org/Papers/2016/57407/57407.pdf). Join
    to conn.log on UID, extract http.log.host and conn.log.id.resp_h, and match against a high-fidelity
    threat-intel feed of malicious domains/IPs. Alert on any match. Keep this deterministic rule as the
    floor of detection; do not delete the explicit mismatch/blank-SNI comparison. A positive result indicates
    a session or host is masking its true C2 destination behind a CDN front (SNI/Host mismatch, blank/ECH
    SNI, rare or beaconing CDN traffic, high inner-host fan-out, or a suspicious source process); a negative
    result means the observed TLS/HTTP behavior matches legitimate CDN usage. Investigate the named area
    of interest (Egress points (e.g., internet gateways, forward proxies) and security infrastructure
    (e.g., SIEM, TIP).) and pivot from any hit to the connection UID, source host and process, inner Host/destination,
    and any downstream C2 or exfiltration activity.'
  answer_sources:
  - Zeek ssl.log
  - Zeek http.log
  - Zeek conn.log
  - 'NAI: Egress points (e.g., internet gateways, forward proxies) and security infrastructure (e.g.,
    SIEM, TIP).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic: Match SNI/Host mismatches to threat intel (evidence 1)\nJOIN ssl.log s,\
      \ http.log h ON s.uid == h.uid\nJOIN conn.log c ON c.uid == s.uid\nWHERE (s.server_name != h.host)\n\
      \   OR (isEmpty(s.server_name) AND notEmpty(h.host))   // 'domainless' fronting\nEXTRACT inner_host\
      \ = h.host, dst = c.id.resp_h\nMATCH inner_host OR dst AGAINST high_fidelity_TI_feed  // malicious\
      \ domains/IPs\nTHEN alert(severity='high', technique='T1090.004', pivot=[uid, src_ip, inner_host,\
      \ dst])\n// Ref: Blocking-resistant communication through domain fronting (scitepress 57407)"
- question: 'Using statistical baselining, can you determine whether ''Flag rare mismatch pairs'' indicates
    domain fronting C2 activity? Specifically: From all SNI/Host mismatches, compute enterprise-wide prevalence
    of each destination IP (id.resp_h) and inner Host (http.log.host) over a 30-day baseline (apply external-destination
    rarity scoring as in [RITA](https://github.com/activecm/rita)). Flag pairs where the inner Host or
    destination IP falls below the 5th percentile of prevalence. Derive the percentile threshold per environment
    from the observed prevalence distribution. As a distinct failure-mode signal, separately track the
    per-pair rate of TLS handshake failures and HTTP 4xx/5xx responses behind the front — high failure
    ratios on a rare front are strong C2/sinkhole indicators.'
