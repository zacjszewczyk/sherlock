name: 'T1090.004: Domain Fronting'
id: 741a796c-4380-4cbd-af7f-02b186c7db54
description: 'This playbook helps an analyst determine whether an adversary is using Domain Fronting (T1090.004)
  to communicate with command and control (C2) infrastructure by abusing Content Delivery Networks (CDNs)
  and multi-tenant cloud services. The defining observable is a mismatch between the TLS Server Name Indication
  (SNI) and the inner HTTP Host header on the same HTTPS session (or a blank/encrypted SNI in ''domainless''/ECH
  variants), letting traffic appear destined for one benign CDN domain while the CDN routes it to an attacker
  backend. Investigative angles include: correlating Zeek ssl.log and http.log by connection UID to surface
  SNI/Host mismatches and blank-SNI sessions and matching the inner Host or destination IP against threat
  intelligence; baselining per-host mismatch rates and flagging rare (SNI, Host) pairs, prevalence outliers,
  and change points; profiling connections to CDN IP ranges for beaconing (low inter-arrival variance,
  FFT/autocorrelation periodicity), anomalous data volumes, and rare or malicious JA3/JA4 TLS fingerprints;
  detecting high-cardinality/high-entropy fan-out of inner Host headers behind a single outer SNI; correlating
  fronting flows back to the originating process via Sysmon to flag non-browser, unsigned, or temp-path
  binaries; and handling ECH/encrypted-SNI evasion via payload entropy/popcount heuristics and payload-agnostic
  flow-feature models. Detection blends deterministic symbolic-logic rules, statistical baselining (percentiles,
  entropy, rolling sigma, change-point detection), and machine learning (Random Forest/Gradient Boosting
  classifiers, Isolation Forest/DBSCAN outlier detection, CT-HMM/LSTM time-series models, self-supervised
  encrypted-traffic models) with SHAP-based explanations to produce evasion-resistant, explainable alerts
  for the Command and Control tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
