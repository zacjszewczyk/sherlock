  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: Flag rare mismatch pairs\nWINDOW = 1h   // also maintain 7-30d\
      \ rolling baseline per host/pair\nFOR EACH src (id.orig_h) and (SNI, inner_host) pair among mismatch/blank-SNI\
      \ sessions:\n  mismatch_ratio = count(mismatch) / count(total_tls)\n  pair_prevalence = enterprise_prevalence(inner_host,\
      \ dst_ip)   // rarity score\n  inner_host_entropy = shannon_entropy(inner_hosts)\n  fail_ratio =\
      \ count(tls_fail OR http_4xx_5xx OR NXDOMAIN/404) / count(total)\nCOMPUTE per-env baseline (mean,\
      \ sigma, percentiles)\nALERT WHEN pair_prevalence < p5 OR mismatch_ratio > mean+3*sigma\n  OR inner_host_entropy\
      \ > p99 OR change_point_detected(CUSUM/PELT)\n  OR fail_ratio anomalously high   // distinct failure-mode\
      \ signal"
- question: 'Using a machine-learning model, can you determine whether ''Classify mismatch events'' indicates
    domain fronting C2 activity? Specifically: Train a supervised classifier (Random Forest / Gradient
    Boosting) on labeled benign (legitimate CDN) vs. malicious mismatches, using payload-agnostic flow
    features that survive TLS 1.3/ECH ([Extending C2 detection from TLS 1.2 to 1.3](https://dl.acm.org/doi/10.1145/3678890.3678921)):
    inner-host domain age/registration, destination ASN reputation, JA3/JA4 rarity, orig/resp byte ratio,
    total bytes, connection duration, and beacon cadence. Score new mismatches in near real-time. Surface
    the top-3 contributing features (e.g., ''inner host 3 days old'', ''JA3 rare'', ''byte ratio 0.02'')
    in the alert via SHAP ([SHAP for explainable IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full))
    so analysts can triage without re-deriving the score.'
