- question: 'Using deterministic rule logic, can you determine whether ''Watch allowlist mismatches''
    indicates domain fronting C2 activity? Specifically: Maintain an allowlist of known-good (SNI, Host)
    pairs and legitimate blank-SNI applications derived from established enterprise traffic. Correlate
    Zeek ssl.log and http.log by UID and alert on any connection where ssl.log.server_name != http.log.host
    OR (ssl.log.server_name is null AND http.log.host is not null) whose (SNI, Host) pair is absent from
    the allowlist — the core fronting/domainless signal from [Blocking-resistant communication through
    domain fronting](https://www.scitepress.org/Papers/2016/57407/57407.pdf). Enrich each hit with the
    client JA3/JA4 fingerprint ([JA3](https://github.com/salesforce/ja3), [JA4+](https://github.com/FoxIO-LLC/ja4))
    to attribute the blank-SNI app to a known stack.'
