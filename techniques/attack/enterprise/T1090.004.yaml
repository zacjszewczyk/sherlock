- question: 'Using statistical baselining, can you determine whether ''Spot low-variance CDN bursts''
    indicates domain fronting C2 activity? Specifically: For CDN connections grouped by (id.orig_h, server_name),
    score beaconing via inter-arrival regularity — low coefficient of variation, Bowley skewness, and
    MAD as implemented in [RITA](https://github.com/activecm/rita) — and via FFT/autocorrelation periodicity
    with benign-service whitelisting at scale ([BAYWATCH](https://dsail.kaist.ac.kr/files/WWW17.pdf));
    a time-delta standard deviation near zero (e.g., <1s) indicates machine-generated callbacks. For Volume
    physics, compute the 95th percentile of session data volume (orig_bytes+resp_bytes) and the orig/resp
    byte ratio per user→CDN-service and flag sessions exceeding the volume threshold or with exfil-like
    asymmetric ratios.'
