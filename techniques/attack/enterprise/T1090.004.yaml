- question: 'Using statistical baselining, can you determine whether ''Score mismatch ratio spikes'' indicates
    domain fronting C2 activity? Specifically: For each internal source host (id.orig_h) compute the hourly
    ratio of mismatched/blank-SNI connections to total TLS connections; maintain a 7-day rolling mean
    and standard deviation per host and alert at >3 standard deviations above baseline. Complement the
    rolling-sigma rule with online change-point detection (CUSUM/PELT/Bayesian, [A Survey of Time Series
    Change Point Detection](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/)) to catch the abrupt onset
    of a new fronting regime. Track failed/blocked outbound connection counts per host as a separate state
    feature, since fronting setup often produces bursts of failed handshakes before a stable channel forms.'
