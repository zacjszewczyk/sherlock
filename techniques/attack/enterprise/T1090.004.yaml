- question: 'Using statistical baselining, can you determine whether ''Score payload entropy/popcount''
    indicates domain fronting C2 activity? Specifically: For sessions lacking a usable SNI, compute byte-distribution
    heuristics over the first N application-data bytes — Shannon entropy near the encrypted range (~7.0-7.2
    bits/byte, [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989))
    and the fraction of set bits (popcount) in the ~0.4-0.6 random band with low printable-ASCII ratio
    ([How the GFW Detects and Blocks Fully Encrypted Traffic](https://www.usenix.org/system/files/usenixsecurity23-wu-mingshi.pdf)).
    Flag fully-encrypted/random-looking flows on common ports. Track the rate of such flows per host and
    alert on deviations from a rolling baseline.'
  context: 'Tactic context (TA0011 / Command and Control): the adversary is trying to communicate with
    compromised systems while mimicking normal, expected HTTPS traffic to avoid detection; domain fronting
    abuses shared CDN/cloud routing so traffic appears destined for a benign domain while reaching attacker
    C2. Evidence under investigation: When Encrypted Client Hello (ECH) or encrypted SNI defeats the SNI/Host-mismatch
    comparison, an outbound HTTPS/TLS session to a CDN/cloud IP range carries a fully-encrypted, high-entropy,
    random-looking byte stream with no readable SNI, indicating a domainless/ECH-tunneled fronting channel.
    Approach (Score payload entropy/popcount): For sessions lacking a usable SNI, compute byte-distribution
    heuristics over the first N application-data bytes — Shannon entropy near the encrypted range (~7.0-7.2
    bits/byte, [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989))
    and the fraction of set bits (popcount) in the ~0.4-0.6 random band with low printable-ASCII ratio
    ([How the GFW Detects and Blocks Fully Encrypted Traffic](https://www.usenix.org/system/files/usenixsecurity23-wu-mingshi.pdf)).
    Flag fully-encrypted/random-looking flows on common ports. Track the rate of such flows per host and
    alert on deviations from a rolling baseline. A positive result indicates a session or host is masking
    its true C2 destination behind a CDN front (SNI/Host mismatch, blank/ECH SNI, rare or beaconing CDN
    traffic, high inner-host fan-out, or a suspicious source process); a negative result means the observed
    TLS/HTTP behavior matches legitimate CDN usage. Investigate the named area of interest (Egress points
    (internet gateways, forward proxies) and TLS-inspecting firewalls/NSM sensors.) and pivot from any
    hit to the connection UID, source host and process, inner Host/destination, and any downstream C2
    or exfiltration activity.'
