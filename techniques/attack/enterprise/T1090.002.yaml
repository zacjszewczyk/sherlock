name: 'T1090.002: External Proxy'
id: d3948aa7-ddac-448e-821a-43178c3f3898
description: 'This playbook helps an analyst determine whether an adversary is using an External Proxy
  (T1090.002): routing command-and-control traffic through an intermediary such as a VPN, TOR exit node,
  commercial proxy/anonymizer, compromised host, VPS, or CDN to mask the true C2 destination and ride
  over trusted communication paths. It correlates network telemetry (Zeek conn.log, dns.log, ssl.log,
  x509.log, weird.log) with host process telemetry (Windows Event ID 4688, Sysmon EID 1/3, auditd, macOS
  unified log/osquery, ESXi shell) and firewall/NAT policy changes to surface relayed egress. Investigative
  angles include: destination IPs/domains that match curated proxy/VPN/TOR/anonymizer and C2 threat-intel
  feeds; deterministic proxy-only egress enforcement (direct TCP/80/443 to non-corporate-proxy cloud/hosting/VPN
  ASNs); known proxy/tunnel tool binaries and command-line syntax (ngrok, chisel, frp, plink, htran, gost,
  socat, ssh -R/-L/-D); JA3/JA3S/JA4 TLS fingerprints tied to proxy tools and C2 frameworks; processes
  that do not normally make network connections or run from unusual paths initiating outbound connections;
  and anomalous flow characteristics such as periodic beaconing, skewed byte ratios, and low-volume regular
  cadence. Detection blends symbolic-logic rules, statistical baselining (prevalence, frequency/volume
  spikes, entropy, coefficient of variation, FFT/autocorrelation), and machine learning (Isolation Forest,
  autoencoders, DBSCAN/K-Means clustering, LDA topic modeling, seasonal/LSTM time-series, Louvain/GCN
  graph community detection) to produce evasion-resistant, explainable alerts for the Command and Control
  tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
