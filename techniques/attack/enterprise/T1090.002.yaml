tags: none
questions:
- question: Do any internal hosts connect to destination IPs or resolve domains that match curated feeds
    of known proxy, VPN, TOR exit-node, or anonymizer infrastructure, and does any user-subnet TCP/80/443
    connection egress directly to a cloud/hosting/VPN ASN rather than the corporate proxy?
  context: 'Tactic context (Command and Control): adversaries relay C2 through intermediary infrastructure
    to hide the true destination and blend with trusted paths. This question implements a deterministic
    threat-match: continuously join Zeek conn.log destination IPs and dns.log queried domains against
    curated proxy/VPN/TOR/anonymizer feeds and general C2 threat intelligence (SigmaHQ). Any match should
    alert with the source host, destination, ASN, and matched indicator. Add a deterministic egress floor:
    alert on any user-subnet TCP/80/443 connection whose destination is NOT a corporate proxy IP and resolves
    to a cloud/hosting/VPN ASN. A positive result indicates a host talking to anonymizing relay infrastructure
    consistent with external-proxy C2; a negative result means egress matches known enterprise destinations.
    Pivot from any hit to the originating process, account, and concurrent beaconing or data-transfer
    behavior.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Egress Network Gateways and Corporate DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Threat-match proxy/anonymizer infrastructure\nMATCH conn IN Zeek_conn.log\n  WHERE conn.dest_ip\
      \ IN threat_feed(proxy, vpn, tor_exit, anonymizer, c2)\nMATCH dns IN Zeek_dns.log\n  WHERE dns.query\
      \ IN threat_feed(proxy_domains, anonymizer_domains)\nALERT WITH src_host, dest_ip, asn, matched_indicator\n\
      // Deterministic egress floor\nMATCH conn IN Zeek_conn.log\n  WHERE conn.src_ip IN user_subnets\
      \ AND conn.dest_port IN [80,443]\n    AND conn.dest_ip NOT IN corporate_proxy_ips\n    AND asn(conn.dest_ip)\
      \ IN cloud_hosting_vpn_asns\nALERT"
- question: Has any cloud, VPS, VPN, or hosting ASN suddenly begun receiving traffic from many new internal
    source hosts, or shown a sharp spike in bytes sent or connection frequency, compared with its 30-day
    baseline?
  context: 'Tactic context (Command and Control): a newly stood-up external proxy often manifests as a
    previously quiet ASN that abruptly attracts many internal clients. For each destination ASN, baseline
    over 30 days the number of unique internal source hosts, total bytes sent (Volume), and connection
    frequency per hour (Frequency). Flag any cloud/VPS/VPN/hosting ASN whose daily values exceed the 99th
    percentile or a 3-sigma increase, per the prevalence principle in Microsoft frequency analysis. Profile
    State explicitly: track failed/blocked connection attempts and NXDOMAIN responses to candidate relay
    domains as distinct signals. A positive result is an emergent proxy endpoint gathering internal clients;
    a negative result is steady, expected ASN usage. Investigate which hosts drove the spike and whether
    the destination is a known service.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Egress Network Gateways and Corporate DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per-ASN volume & spike anomaly\nFOR each dest_asn IN cloud_vps_vpn_hosting_asns:\n  baseline_30d\
      \ = stats(unique_src_hosts, total_bytes_sent, conn_per_hour)\n  today = current_day_values(dest_asn)\n\
      \  IF today.unique_src_hosts > p99(baseline) OR today.value > mean+3*stddev:\n    ALERT(dest_asn,\
      \ contributing_src_hosts)\n// State signals\nTRACK blocked_conn_attempts, nxdomain_responses TO\
      \ candidate_relay_domains"
- question: When an unsupervised anomaly model is trained on benign-only Zeek flow and DNS features, do
    any outbound connections score as highly anomalous in a way consistent with relayed or encrypted proxy
    traffic?
  context: 'Tactic context (Command and Control): external-proxy traffic may not match any known indicator
    yet still deviate from benign flow shape. Train an unsupervised anomaly model (Isolation Forest or
    autoencoder) on benign-only Zeek conn.log/dns.log features (duration, orig_bytes, resp_bytes, byte
    ratio, protocol, dest port, DNS query length, TTL), validated by one-class NetFlow detection. For
    encrypted relays, use version-agnostic flow features (Novo & Morla, RAID 2024) or self-supervised
    representations (ET-SSL). Alert text must surface the top-3 contributing features (e.g., byte ratio,
    rare ASN, reconstruction error) so analysts can triage without re-deriving the score. A positive result
    is an outlier flow worth investigating; a negative result is flow consistent with baseline. Use the
    contributing features to pivot to the host and destination.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Egress Network Gateways and Corporate DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Unsupervised flow anomaly model\nfeatures = [duration, orig_bytes, resp_bytes, byte_ratio,\
      \ proto, dest_port,\n            dns_query_len, ttl]\nmodel = IsolationForest().fit(benign_only_flows[features])\n\
      score = model.decision_function(new_flow[features])\nIF score < anomaly_threshold:\n  ALERT(flow,\
      \ top_3_contributing_features)"
- question: Was any process created whose name or file hash matches a known external-proxy or tunneling
    tool such as ngrok, chisel, frp, plink, htran, gost, or socat?
  context: 'Tactic context (Command and Control): adversaries deploy off-the-shelf tunnel/proxy tools
    on endpoints to relay C2. Match ProcessName/NewProcessName or file hash (SHA256, MD5) from Windows
    4688 / Sysmon EID 1 against a curated list of proxy/tunnel tool names and hashes (ngrok, chisel, frp,
    plink, htran, gost, socat) using SigmaHQ rules. Alert on any exact match, and complement with payload
    YARA for beacons and default TLS certs (Florian Roth Cobalt Strike YARA). A positive result is direct
    evidence a proxy/tunnel tool ran on a host; a negative result means no known tool name/hash was observed
    (note renamed or custom tools may evade this and are covered by the statistical and ML questions).
    Pivot to the parent process, user, and any outbound connections that tool made.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Match known proxy/tunnel tool binaries\nMATCH proc IN [WinEventID_4688, Sysmon_EID_1]\n\
      \  WHERE lower(proc.process_name) IN ['ngrok','chisel','frp','frpc','frps',\n        'plink','htran','gost','socat']\n\
      \     OR proc.sha256 IN proxy_tool_hashes\n     OR proc.md5 IN proxy_tool_hashes\nALERT(host, user,\
      \ parent_process, proc)\n// Complement: scan payloads with Cobalt Strike / beacon YARA"
- question: Across the fleet, which process names or hashes are rare (seen on fewer than 0.1% of hosts
    or fewer than 5 hosts) and therefore candidate custom or renamed proxy tools?
  context: 'Tactic context (Command and Control): sophisticated actors rename or custom-build proxy tools
    to defeat name/hash matching, but such binaries remain rare across an enterprise. Compute fleet-wide
    prevalence of each process name/hash over a 30-day rolling window using round-robin frequency logging
    (Microsoft frequency analysis). Flag binaries below a dynamic threshold (seen on < 0.1% of hosts or
    < 5 hosts) for review as potential custom/rare proxy tools. A positive result is a low-prevalence
    binary worth triage, especially if it also makes external connections; a negative result is a common,
    well-known binary. Combine with network evidence to prioritize rare binaries that egress to cloud/VPN
    ASNs.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Fleet-wide prevalence of process name/hash (30-day rolling)\nFOR each (process_name, sha256):\n\
      \  host_count = distinct_hosts_seen(process_name, sha256, window=30d)\n  pct = host_count / total_hosts\n\
      \  IF host_count < 5 OR pct < 0.001:\n    FLAG_FOR_REVIEW(process_name, sha256, host_count)"
- question: When an Isolation Forest is trained on process-execution features, which executions score
    as highly anomalous in ways consistent with proxy-tool deployment, and what are the top contributing
    features?
  context: 'Tactic context (Command and Control): proxy tooling can be surfaced as an execution outlier
    even when its name and hash are unknown. Train an Isolation Forest on process-execution features (process-name
    entropy, parent process, file-path depth, signing status, prevalence). Flag highly anomalous executions
    for review; alert text must list the top-3 contributing features so analysts can triage without re-deriving
    the score (one-class detection). A positive result is an execution that deviates sharply from normal
    program-launch patterns (e.g., high-entropy name, unsigned, deep/odd path, rare); a negative result
    is an ordinary execution. Pivot from anomalous executions to their network behavior and parent lineage.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Isolation Forest on process-execution features\nfeatures = [name_entropy, parent_process,\
      \ path_depth, signed, prevalence]\nmodel = IsolationForest().fit(historical_executions[features])\n\
      score = model.decision_function(new_execution[features])\nIF score < threshold:\n  ALERT(execution,\
      \ top_3_contributing_features)"
- question: Did any process launch with command-line arguments containing tunnel/port-forward syntax such
    as '-listen', '-tran', '-proxy', 'ssh -R/-L/-D', '-R:<port>:', '-L:<port>:', 'c:s', 'c:c', or an IP:port
    pair?
  context: 'Tactic context (Command and Control): proxy and tunnel establishment leaves characteristic
    switches on the command line even when the binary itself is benign or renamed (e.g., ssh, plink).
    Scan command-line arguments in Windows 4688 / Sysmon EID 1 with regexes for tunnel/forward syntax:
    ''-listen'', ''-tran'', ''-proxy'', ''ssh .*-[RLD]'', ''-R:[0-9]{1,5}:'', ''-L:[0-9]{1,5}:'', ''c:s'',
    ''c:c'', and IP:port, using SigmaHQ process-creation rules. Alert on any match. A positive result
    is a command line configuring a proxy or tunnel; a negative result means no such syntax appeared.
    Pivot to the resulting network connections, the listening/forwarded ports, and the remote endpoint
    specified.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Match proxy/tunnel command-line syntax\nMATCH proc IN [WinEventID_4688, Sysmon_EID_1]\n\
      \  WHERE proc.command_line MATCHES ANY(\n    /-listen/, /-tran/, /-proxy/, /ssh\\s.*-[RLD]\\b/,\n\
      \    /-R:[0-9]{1,5}:/, /-L:[0-9]{1,5}:/, /\\bc:s\\b/, /\\bc:c\\b/,\n    /\\b\\d{1,3}(\\.\\d{1,3}){3}:\\\
      d{1,5}\\b/)\nALERT(host, user, proc.command_line)"
- question: Do any process command lines exceed the 98th percentile of character-level entropy for that
    process name, suggesting obfuscated, packed, or encoded proxy invocation?
  context: 'Tactic context (Command and Control): attackers obfuscate proxy invocations to evade keyword
    matching, which raises the randomness of the command line. Compute character-level entropy of command
    lines per process and baseline per process name (e.g., svchost.exe). Flag executions exceeding the
    98th percentile of that process''s historical entropy as possible obfuscated/packed proxy invocation;
    profile failed launches as a distinct signal. A positive result is an unusually high-entropy command
    line for a given program; a negative result is a typical, low-entropy invocation. Decode/expand the
    flagged command line and correlate with subsequent network connections.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per-process command-line entropy baseline\nFOR each process_name:\n  hist = entropy(command_line)\
      \ for historical executions\n  p98 = percentile(hist, 98)\nFOR new execution:\n  IF entropy(command_line)\
      \ > p98[process_name]:\n    FLAG(execution)\nTRACK failed_launches AS distinct_signal"
- question: When LDA topic modeling is applied to the command-line corpus, do any new executions score
    with high probability against topics for network configuration, remote access, or proxying?
  context: 'Tactic context (Command and Control): proxy/tunnel command lines share latent vocabulary even
    when exact tokens vary, which topic modeling can capture. Apply NLP topic modeling (LDA) over the
    command-line corpus to learn topics for network configuration, remote access, and proxying; flag new
    executions with high probability of those topics. Surface the top-3 driving tokens in the alert for
    explainability. A positive result is an execution semantically aligned with proxying/remote-access
    intent; a negative result aligns with ordinary administrative or application activity. Use the driving
    tokens to confirm intent and pivot to network behavior.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: All Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// LDA topic modeling over command-line corpus\ntopics = LDA(num_topics=k).fit(command_line_corpus)\n\
      target_topics = {network_config, remote_access, proxying}\nFOR new execution:\n  p = topic_distribution(execution.command_line)\n\
      \  IF max(p[t] for t in target_topics) > threshold:\n    ALERT(execution, top_3_driving_tokens)"
- question: Does any outbound TLS connection present a JA3/JA3S (or JA4+) fingerprint that matches threat-intel
    fingerprint lists for proxy tools or C2 frameworks, or HTTP requests matching Malleable C2 URI/header
    patterns?
  context: 'Tactic context (Command and Control): proxy and C2 clients often share recognizable TLS handshake
    fingerprints and HTTP profiles. Match JA3/JA3S from Zeek ssl.log against threat-intel fingerprint
    lists for proxy tools and C2 frameworks (JA3); for TLS 1.3 and randomized clients use stable JA4+
    fingerprints. Add Unit 42 Malleable C2 URI/header regexes for relayed HTTP C2. A positive result is
    a session whose fingerprint or HTTP profile matches known malicious tooling; a negative result is
    a common, benign fingerprint. Pivot from a fingerprint hit to the source host, destination, x509 certificate
    details, and process.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Correlate JA3/JA3S/JA4 fingerprints to proxy/C2 tooling\nMATCH ssl IN Zeek_ssl.log\n  WHERE\
      \ ssl.ja3 IN c2_proxy_ja3_list\n     OR ssl.ja3s IN c2_proxy_ja3s_list\n     OR ssl.ja4 IN c2_proxy_ja4_list\n\
      ALERT(src_host, dest_ip, ssl.server_name)\n// HTTP Malleable C2 profile\nMATCH http IN Zeek_http.log\n\
      \  WHERE http.uri MATCHES malleable_c2_uri_regex\n     OR http.headers MATCH malleable_c2_header_regex\n\
      ALERT"
- question: Which JA3/JA4 TLS fingerprints are new or very low prevalence (under 0.05% of hosts) and are
    connecting to uncategorized, high-risk, or cloud/VPS destinations?
  context: 'Tactic context (Command and Control): a rare TLS fingerprint reaching risky infrastructure
    is a strong indicator of non-browser proxy/C2 tooling. Baseline JA3/JA4 prevalence over 30 days; flag
    new or very-low-prevalence fingerprints (< 0.05% of hosts) connecting to uncategorized/high-risk or
    cloud/VPS destinations (Microsoft frequency analysis). Note JA3 instability under extension randomization
    (Stamus) and prefer JA4 for baselining. A positive result is an uncommon fingerprint paired with a
    suspicious destination; a negative result is a widely-seen fingerprint or a benign destination. Pivot
    to the host, process, and destination ASN/category.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Low-prevalence TLS fingerprint to risky destinations\nbaseline = prevalence(ja4 OR ja3)\
      \ over 30d\nFOR each ssl_session:\n  pct = baseline[session.ja4] / total_hosts\n  IF (pct < 0.0005\
      \ OR session.ja4 is new)\n     AND dest_category(session.dest_ip) IN {uncategorized, high_risk,\
      \ cloud_vps}:\n    ALERT(session)   // prefer JA4 over JA3 (extension randomization)"
- question: When TLS sessions are clustered on handshake and certificate features, do any small clusters
    fail to match known-good traffic and thus warrant investigation as proxy/C2 activity?
  context: 'Tactic context (Command and Control): proxy/C2 clients form tight, small clusters distinct
    from the bulk of benign TLS. Cluster (DBSCAN/K-Means) ssl.log + x509.log features (JA4, cipher suites,
    cert issuer/validity, SNI) plus version-agnostic flow features (Novo & Morla, RAID 2024); investigate
    small clusters that do not match known-good traffic. Report the top-3 features distinguishing the
    cluster. A positive result is a small anomalous cluster (e.g., self-signed certs, odd cipher choice,
    unusual SNI); a negative result is membership in large benign clusters. Pivot from the cluster to
    its member hosts and destinations.'
  answer_sources:
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Cluster TLS sessions and surface small anomalous clusters\nfeatures = [ja4, cipher_suites,\
      \ cert_issuer, cert_validity, sni, flow_features]\nclusters = DBSCAN().fit(ssl_x509_sessions[features])\n\
      FOR c IN clusters:\n  IF c.size < small_threshold AND not matches_known_good(c):\n    ALERT(c.members,\
      \ top_3_distinguishing_features)"
- question: Did any process that is not on the allowlist of expected network initiators — especially one
    running from C:\Temp\, C:\Users\Public\, or another non-standard path — make an outbound external
    connection?
  context: 'Tactic context (Command and Control): proxy relays are frequently spawned by processes that
    normally never touch the network, or run from staging directories. Correlate Sysmon EID 3 with process
    info; maintain an allowlist of processes expected to make external connections. Alert on any non-allowlisted
    process initiating an external connection, especially from C:\Temp\, C:\Users\Public\, or other non-standard
    paths (SigmaHQ). A positive result is an unexpected process reaching out externally; a negative result
    is connections only from approved network-facing programs. Pivot to the destination, the parent process,
    and any matching tool/command-line evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Alert on disallowed network initiators\nJOIN Sysmon_EID_3 net WITH process_info proc ON\
      \ net.process_guid\nWHERE proc.process_name NOT IN network_initiator_allowlist\n  AND net.dest_ip\
      \ IS external\n  AND (proc.path MATCHES /\\\\Temp\\\\/ OR /\\\\Users\\\\Public\\\\/\n       OR proc.path\
      \ NOT IN standard_install_paths)\nALERT(host, proc, net.dest_ip)"
- question: Compared with its 30-day baseline, does any process connect on a never-before-seen port, to
    a new ASN, or with anomalous bytes-sent volume or connection frequency?
  context: 'Tactic context (Command and Control): when a legitimate process is co-opted for proxying,
    its network behavior shifts away from its own historical norm. Baseline per-process network behavior
    over 30 days (distinct destination ports/ASNs, bytes sent, connection frequency). Flag a process that
    connects on a never-before-seen port, to a new ASN, or with anomalous Volume/Frequency; profile blocked/failed
    connections as a distinct State signal. A positive result is a process deviating from its own learned
    network profile; a negative result is behavior within historical bounds. Pivot to the new destination
    and correlate with binary/command-line evidence.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Per-process network behavior baseline\nFOR each process_name:\n  baseline = {dest_ports,\
      \ dest_asns, bytes_sent_dist, conn_freq} over 30d\nFOR new connection:\n  IF dest_port NOT IN baseline.dest_ports\n\
      \     OR dest_asn NOT IN baseline.dest_asns\n     OR bytes_sent > mean+3*stddev OR conn_freq anomalous:\n\
      \    FLAG(process, connection)\nTRACK blocked/failed connections AS distinct State signal"
- question: When a classifier scores executions on process name, parent, command-line length, and path
    characteristics, do any 'suspicious' executions correlate with Sysmon EID 3 outbound network activity?
  context: 'Tactic context (Command and Control): combining a suspiciousness score with observed network
    egress narrows attention to processes likely acting as proxies. Train a classifier (logistic regression
    or gradient boosting) to score executions from process name, parent, command-line length, and path
    characteristics, then correlate ''suspicious'' scores with Sysmon EID 3 network activity. Output the
    top-3 contributing features in the alert (explainable one-class detection). A positive result is a
    high-scoring execution that also makes outbound connections; a negative result is benign-looking or
    non-networking processes. Use the contributing features and destination to triage and pivot.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 3
  - Zeek conn.log
  - 'NAI: All Endpoints and Servers, Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "// Classify executions, correlate with network activity\nfeatures = [process_name, parent,\
      \ cmdline_len, path_chars]\nmodel = GradientBoosting().fit(labeled_executions[features])\nscore\
      \ = model.predict_proba(new_execution[features])\nIF score > threshold AND has_outbound(Sysmon_EID_3,\
      \ new_execution):\n  ALERT(execution, dest_ip, top_3_contributing_features)"
- question: Does Zeek weird.log record protocol violations such as 'ssl_not_ssl', 'possible_split_routing',
    or 'http_on_unusual_port' that, when correlated with conn.log, reveal hosts tunneling or evading via
    external relays?
  context: 'Tactic context (Command and Control): proxy/tunnel traffic often violates expected protocol
    semantics, which Zeek flags as ''weird'' events. Monitor Zeek weird.log for ''ssl_not_ssl'', ''possible_split_routing'',
    ''http_on_unusual_port'' and correlate with conn.log to find hosts tunneling/evading via external
    relays (SigmaHQ). A positive result is a protocol anomaly tied to an external destination consistent
    with relaying; a negative result is clean, conformant protocol use. Pivot from the weird event to
    the associated connection, destination, and originating host/process.'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "// Protocol-violation correlation\nMATCH w IN Zeek_weird.log\n  WHERE w.name IN ['ssl_not_ssl','possible_split_routing','http_on_unusual_port']\n\
      JOIN conn IN Zeek_conn.log ON w.uid\nWHERE conn.dest_ip IS external\nALERT(conn.src_ip, conn.dest_ip,\
      \ w.name)"
- question: For each source-destination(-dport) pair, is the connection cadence highly regular (near-zero
    coefficient of variation or periodic by FFT/autocorrelation) with a skewed orig:resp byte ratio over
    10:1 and low total volume, indicating beaconing through an external proxy?
  context: 'Tactic context (Command and Control): beaconing to a relayed C2 produces regular, low-volume,
    outbound-heavy flows. Per source-destination(-dport) pair, compute the coefficient of variation and
    standard deviation of inter-arrival deltas over 24h and apply DFFT/autocorrelation for hidden periodicity,
    as in RITA/RITA-J and BAYWATCH. Flag near-zero CV (regular cadence) AND orig:resp byte ratio > 10:1
    with total volume < 10KB. Whitelist benign periodic services using baselines from Mack & Williamson.
    A positive result is a periodic, low-volume, outbound-skewed channel consistent with a beacon; a negative
    result is irregular or bidirectional bulk traffic. Pivot to the destination ASN, JA3/JA4 fingerprint,
    and originating process.'
  answer_sources:
  - Zeek conn.log
  - Zeek weird.log
  - 'NAI: Egress Network Gateways'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Periodic beaconing detection\nFOR each (src, dest, dport):\n  deltas = inter_arrival_times(conn.log,\
