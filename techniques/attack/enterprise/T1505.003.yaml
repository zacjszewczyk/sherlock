    op=, pass=, key=). This catches typical operator-only web shell access patterns where the shell is
    unindexed and absent from sitemaps. Threshold guidance: require URI age > 1 day to suppress legitimate
    dev endpoints; whitelist documented admin URIs. Operationally validated as a baseline in the [SigmaHQ
    web rules](https://github.com/SigmaHQ/sigma). A positive result -- a deterministic match, a statistical
    outlier, or a model alert -- indicates likely web-shell presence or operator interaction with a planted
    shell; pivot to the responsible web-server process and its child process tree, the source IP and its
    request history, any script files written into web roots, and subsequent outbound connections to characterize
    the foothold and scope of access. A negative result helps rule out this particular web-shell vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    obfuscated, encrypted, or low-and-slow operator activity.'
