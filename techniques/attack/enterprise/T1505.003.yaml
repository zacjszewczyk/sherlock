questions:
- question: '[Persistence] Match inbound web requests to web shell threat intelligence: Can you determine
    whether a web server receives an inbound HTTP/S request from a source IP address or to a URI that
    matches known web shell threat intelligence. -- specifically, using the ''Match inbound web requests
    to web shell threat intelligence'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary plants a web shell on
    an internet-facing or internal web server to keep a durable foothold that survives reboots, credential
    changes, and patching, using the server as a gateway to run commands, pivot, and exfiltrate data.
    This evidence focuses on the condition that a web server receives an inbound HTTP/S request from a
    source IP address or to a URI that matches known web shell threat intelligence. This Symbolic Logic
    approach looks for the following signal: For each inbound HTTP/S request to a DMZ web server, join
    Zeek http.log (host, uri, user_agent, method) and Zeek conn.log (id.orig_h, id.resp_h) and compare
    against curated TI feeds enumerating known web shell paths and family signatures (e.g., /shell.php,
    /reGeorg.php, China Chopper z1/z2/ant parameter conventions, JspSpy, AntSword default User-Agents,
    Behinder/Godzilla AES POST-body signatures) and known offensive infrastructure source IPs/ASNs. Maintain
    the family-signature dictionary directly from the [NSA/ASD Mitigating Web Shells advisory](https://github.com/nsacyber/Mitigating-Web-Shells)
    and the [Neo23x0 webshell YARA pack](https://github.com/Neo23x0/signature-base). Alert on any match
    and enrich with conn_state, duration, orig_bytes, resp_bytes, and the trailing 10 requests from the
    same source IP for analyst triage. Explicitly include failed requests (4xx/5xx, RST connections) as
    a separate alert class because operator reconnaissance against unindexed shell paths is dominated
    by error responses [Volexity research on Sophos XG web shell exploitation](https://www.volexity.com/blog/2020/04/26/active-exploitation-of-sophos-xg-firewall-by-deathnote-apt/).
    A positive result -- a deterministic match, a statistical outlier, or a model alert -- indicates likely
    web-shell presence or operator interaction with a planted shell; pivot to the responsible web-server
    process and its child process tree, the source IP and its request history, any script files written
    into web roots, and subsequent outbound connections to characterize the foothold and scope of access.
    A negative result helps rule out this particular web-shell vector but should be corroborated with
    the other questions in this playbook, since a single method can miss obfuscated, encrypted, or low-and-slow
    operator activity.'
