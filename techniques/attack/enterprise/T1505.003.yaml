    correction across sources to control false positives. Approach derives from the multi-model HTTP anomaly
    detection of [Kruegel and Vigna, ACM CCS 2003](https://sites.cs.ucsb.edu/~vigna/publications/2003_kruegel_vigna_ccs03.pdf).
