    approach looks for the following signal: Establish a 30-day per-application baseline of HTTP method
    ratios in Zeek http.log. For each source IP, compute the POST/(GET+POST) ratio per day and the total
    request count. Alert when a source''s POST ratio exceeds the 95th percentile of the application''s
    distribution AND the source has fewer than 10 total requests (indicating targeted operator access
