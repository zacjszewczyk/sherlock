name: 'T1505.003: Web Shell'
id: a20d2bca-ff17-413f-a1ad-a7462b99359d
description: 'This playbook helps an analyst investigate whether an adversary has backdoored a web server
  with a web shell (T1505.003) to establish persistent, gateway access into the network as part of the
  Persistence tactic. It guides the hunt across the full web-shell lifecycle on Windows (IIS/w3wp.exe),
  Linux (apache2/nginx/php-fpm), macOS (httpd), and Java/Tomcat servers: inbound HTTP/S requests matching
  web-shell threat intelligence (known shell paths, China Chopper / AntSword / Behinder / Godzilla / reGeorg
  / JspSpy family signatures, offensive source IPs/ASNs) and singleton-source operator access to rare,
  unindexed URIs; request content carrying server-side execution primitives, code-evaluation wrappers,
  and obfuscated/encrypted POST bodies; web-server processes spawning unexpected command interpreters,
  reconnaissance utilities, and LOLBAS binaries; anomalous outbound connections, reverse-shell connect-back,
  and C2 beaconing from web servers; and write-and-execute behavior where the web server itself creates
  server-executable script files in web-accessible directories. Detection methods combine deterministic
  symbolic-logic rules, statistical baselining (median/MAD outliers, entropy and compression-distance
  novelty, KS tests, FFT beaconing detection), and machine-learning models (gradient-boosted classifiers,
  sequence/BiLSTM models, Isolation Forest, multi-view AST/opcode fusion, provenance-graph TGNNs) applied
  to Zeek http/conn/dns logs, PCAP, Windows Event ID 4688/4663/5156, Sysmon Event ID 1/3/11, and Linux
  auditd, so the analyst can corroborate suspected web-shell activity across network, process-lineage,
  file-write, and egress context.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
