    injects). This Symbolic Logic approach looks for the following signal: Scan process-creation command
    lines (Windows EID 4688, auditd/Sysmon-for-Linux execve) for container processes using regexes for
    reverse shells, certutil/curl/wget download cradles, and cryptominer names, and alert on matches;
