    feed, or generates abnormal egress (high blocked-connection/NXDOMAIN failure rates) shortly after
    first deployment of the new image version. This Statistical Method approach looks for the following
    signal: Baseline JA3/JA3S hashes per image name/version using Zeek ssl.log and alert on any hash absent
    from the image-specific roster, per [JA3 TLS Client Fingerprinting](https://github.com/salesforce/ja3);
    separately profile failure state (blocked connections, NXDOMAIN, TLS handshake failures per minute)
    as a distinct beacon/exfil signal. A positive result -- a rule match, statistical outlier, or model
