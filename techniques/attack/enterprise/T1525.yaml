    line containing syntax associated with reverse shells, remote file download/execution, or known cryptomining
    tools (e.g., the reverse-shell CMD overwrite that CCAT injects). -- specifically, using the ''Regex
    detection for malicious command lines'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary implants malicious code
