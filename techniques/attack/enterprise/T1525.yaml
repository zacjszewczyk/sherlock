name: 'T1525: Implant Internal Image'
id: 0fec6d83-d846-448f-b5ed-eb20b0db3f6f
description: 'This playbook helps an analyst investigate whether an adversary is establishing persistence
  by implanting malicious code into internal cloud or container images (AWS AMIs/custom images, GCP/Azure
  images, or Docker images) so that infrastructure provisioning repeatedly redeploys the backdoor as part
  of the Persistence tactic. It guides the hunt across several behavioral angles spanning container hosts
  (Windows and Linux), cloud instances, image registries, and the cloud control plane: network egress
  from freshly deployed image versions to C2 indicators or to anomalous/failing destinations (Zeek conn/dns/ssl,
  JA3/JA3S baselining, per-image traffic forecasting); malicious process execution inside containers and
  instances (reverse shells, download cradles, cryptominers via Windows EID 4688, auditd/Sysmon-for-Linux
  execve, novel/entropy-heavy commands, and ML command-line classifiers); registry and control-plane image
  pushes/registrations from unauthorized IPs, principals, or off-hours (Zeek http.log, Windows EID 4624,
  AWS CloudTrail RegisterImage/CreateImage/CopyImage/ModifyImageAttribute/ecr:PutImage, allowlist and
  signed-provenance gating, behavioral risk scoring, Isolation Forest); post-update behavioral drift in
  a deployed container/instance including unexpected IMDS access and new IAM role assumption; high-volume
  discovery/enumeration against the registry or image catalog preceding an implant; and image-content
  diffing for embedded persistence (SSH authorized_keys, baked-in credentials, new users/cron/services)
  followed by RunInstances launches. Detection methods combine symbolic-logic rules, statistical baselining/forecasting,
  and machine-learning models so the analyst can corroborate a suspected internal image implant across
  image provenance, runtime behavior, identity context, and network egress.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
