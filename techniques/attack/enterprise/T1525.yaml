questions:
- question: '[Persistence] Match container traffic to C2 indicators: Can you determine whether a container
    or cloud instance, deployed from a recently created or modified internal image, initiates a network
    connection to a destination IP/FQDN on a high-confidence C2 threat-intelligence feed, or generates
    abnormal egress (high blocked-connection/NXDOMAIN failure rates) shortly after first deployment of
    the new image version. -- specifically, using the ''Match container traffic to C2 indicators'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary implants malicious code
    into an internal cloud or container image so that automated provisioning keeps redeploying the backdoor,
    granting durable, hard-to-evict access; the implant leaves traces in image-build/registry events,
    control-plane API calls, container/instance runtime behavior, and network egress. This evidence focuses
    on the condition that a container or cloud instance, deployed from a recently created or modified
    internal image, initiates a network connection to a destination IP/FQDN on a high-confidence C2 threat-intelligence
    feed, or generates abnormal egress (high blocked-connection/NXDOMAIN failure rates) shortly after
    first deployment of the new image version. This Symbolic Logic approach looks for the following signal:
    Filter Zeek conn.log/dns.log traffic from hosts running the new image version and alert when destination
    IPs/domains appear on high-confidence C2 feeds, including source container/image name+tag; corroborate
    with runtime egress rules (''Unexpected outbound connection'' from a container) per [Falco Default
    Runtime Security Rules](https://falco.org/docs/reference/rules/default-rules/). Reverse-shell/dropper
    egress from freshly deployed artifacts is the dominant implant payload behavior in [Backstabber''s
    Knife Collection](https://arxiv.org/abs/2005.09535). A positive result -- a rule match, statistical
    outlier, or model alert -- suggests that an internal image has been backdoored or that a container/instance
    deployed from a recently changed image is behaving maliciously; pivot to the responsible image name+tag/AMI
    ID and its registration/push event, the principal and source IP that created or pushed it, the deploying
    provisioning pipeline, the running container/instance, and any resulting C2 or lateral-movement activity.
    A negative result helps rule out this implant vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy, slow, or living-off-the-land image-implant
    persistence.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - 'NAI: Container host nodes, cloud instances, network egress points, internal DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match container traffic to C2 indicators

      source IN [Zeek conn.log, Zeek dns.log, Zeek ssl.log]

      | WHERE matches_action_criteria("Match container traffic to C2 indicators")

      // Filter Zeek conn.log/dns.log traffic from hosts running the new image version and alert when
      destination IPs/domains app

      | ALERT enrich(host, principal, image, container, src_ip, dest)'
  - technology: Zeek/pseudocode
    query: '# Image-implant network correlation

      conn.log, dns.log, ssl.log, http.log

      | JOIN deployed-image host/container to outbound flows on (id.orig_h, image, time-window)

      | AGG dest rarity, C2-feed match, JA3/JA3S, bytes, NXDOMAIN/blocked per (id.orig_h, image)

      | flag C2/anomalous egress from freshly deployed image versions per action criteria'
- question: '[Persistence] Detect unknown TLS fingerprints per image: Can you determine whether a container
    or cloud instance, deployed from a recently created or modified internal image, initiates a network
    connection to a destination IP/FQDN on a high-confidence C2 threat-intelligence feed, or generates
    abnormal egress (high blocked-connection/NXDOMAIN failure rates) shortly after first deployment of
    the new image version. -- specifically, using the ''Detect unknown TLS fingerprints per image'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary implants malicious code
