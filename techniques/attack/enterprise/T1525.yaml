    below binary dirs) from [Falco Default Runtime Security Rules](https://falco.org/docs/reference/rules/default-rules/).
    The implanted reverse-shell CMD is exactly the [CCAT](https://rhinosecuritylabs.com/cloud-security/cloud-container-attack-tool/)
