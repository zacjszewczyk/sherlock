name: 'T1127.003: Trusted Developer Utilities Proxy Execution: JamPlus'
id: d1c671e4-b6b9-4cf2-b8cc-9be38f52ec9c
description: 'This playbook helps an analyst determine whether an adversary is abusing the JamPlus build
  utility (jam.exe / JamPlus.exe) to proxy the execution of malicious scripts via crafted .jam files (T1127.003),
  a living-off-the-land technique that can subvert application control systems such as Smart App Control
  by running attacker code from a reputable, signed developer tool. It correlates Windows process-creation
  telemetry (Event ID 4688 / Sysmon EID1) with network telemetry (Zeek conn/dns/http/ssl) and Windows
  CodeIntegrity events to surface JamPlus abuse. Investigative angles include: JamPlus executing from
  unapproved paths or on hosts that are not developer workstations or build servers; JamPlus spawned by
  anomalous parents (Office apps, browsers, scripting hosts); JamPlus spawning post-exploitation utilities
  (powershell, cmd, certutil, bitsadmin, rundll32, regsvr32, mshta) instead of compilers/linkers; unsigned
  or untrusted module loads during JamPlus runtime; and JamPlus-attributed network sessions that exhibit
  beaconing, DGA/dead-drop DNS, TLS anomalies, or threat-intel matches. Detection blends symbolic-logic
  rules (allowlists, blocklists, TI correlation, CodeIntegrity floors), statistical baselining (rarity,
  Shannon entropy, percentile thresholds, failure-rate and beacon-timing analysis), and machine learning
  (Isolation Forest, gradient-boosted and Naive Bayes/Logistic classifiers, provenance-graph anomaly detection,
  and flow autoencoders) to produce evasion-resistant, explainable alerts spanning the Defense Evasion/Stealth
  and Execution tactics.'
type: technique
