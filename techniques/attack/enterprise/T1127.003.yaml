questions:
- question: 'Using deterministic rule logic, can you determine whether ''Correlate JamPlus artifacts to
    TI'' indicates abuse of the JamPlus build utility to proxy execution of malicious code? Specifically:
    Correlate jam.exe/JamPlus.exe process creation (EventID 4688 / Sysmon EID1) and the .jam command-line
    argument with Zeek conn/dns/http/ssl records, and alert when the binary hash (e.g., known reputation-hijack
    hash 4e213bd0a127f1bb24c4c0d971c2727097b04eed9c6e62a57110d168ccc3ba10), destination IP, domain, or
    URL matches threat intelligence on build-tool abuse [Dismantling Smart App Control](https://www.elastic.co/security-labs/dismantling-smart-app-control).'
  context: 'Tactic context (Stealth / Stealth): Is an adversary using the JamPlus build utility to evade
    defenses and execute malicious code? (TA0005 - Defense Evasion) Evidence under investigation: JamPlus.exe
    or jam.exe is launched from a build-like path and then creates suspicious child processes or outbound
    network traffic that does not align with the host''s approved build workflow, project roots, or developer
    asset role. Approach (Correlate JamPlus artifacts to TI): Correlate jam.exe/JamPlus.exe process creation
    (EventID 4688 / Sysmon EID1) and the .jam command-line argument with Zeek conn/dns/http/ssl records,
    and alert when the binary hash (e.g., known reputation-hijack hash 4e213bd0a127f1bb24c4c0d971c2727097b04eed9c6e62a57110d168ccc3ba10),
    destination IP, domain, or URL matches threat intelligence on build-tool abuse [Dismantling Smart
    App Control](https://www.elastic.co/security-labs/dismantling-smart-app-control). A positive result
    means JamPlus is being used outside a legitimate, approved build workflow to proxy execution or communicate
    with attacker infrastructure; a negative result means the observed JamPlus activity matches the expected
    developer/build baseline. Investigate the named area of interest (Developer Workstations, CI/CD Build
    Servers, Network Egress Points, DNS Servers) and pivot from any hit to the originating .jam file,
    parent and child processes, the executing account and host role, and any downstream network or post-exploitation
    activity.'
  answer_sources:
  - Windows Event ID 4688
  - Zeek http.log
  - Zeek dns.log
  - Zeek conn.log
  - Zeek ssl.log
  - 'NAI: Developer Workstations, CI/CD Build Servers, Network Egress Points, DNS Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Deterministic detection for: Correlate JamPlus artifacts to TI

      MATCH events WHERE jamplus_abuse_condition_holds

      // Correlate jam.exe/JamPlus.exe process creation (EventID 4688 / Sysmon EID1) and the .jam command-line
      argument with Zeek conn/dns/http/ssl records, and alert when the binary hash (e.g., known reputation-hijack
      hash 4e213bd0a127f1bb24c4c0d971c2727097b04eed9c6e62a57110d168ccc3ba10), destination IP, domain,
      or URL matches threat intelligence on build-tool abuse Dismantling Smart App Control.

      THEN alert(severity=''high'', enrich=[host, user, parent_image, child_image, dst])'
