questions:
- question: Do newly created internal messages or documents contain credential prompts, urgency cues,
    impersonated brand language, or embedded links/macros, and does the claimed sender or author fail
    to match the approved internal creators, templates, and distribution path that should have produced
    that content?
  context: 'Adversaries authoring written content for later phishing or social engineering often leave
    deception fingerprints in the draft itself. Inspect new messages and documents for concrete deception
    indicators - credential prompts, urgency/time-pressure cues, sender or display-name mismatches, brand
    impersonation, and suspicious URLs or macros - enumerating each indicator per item rather than emitting
    a single verdict, mirroring the LLM-as-detector approach of [ChatSpamDetector](https://arxiv.org/abs/2402.18093)
    and [Devising and Detecting Phishing, Heiding et al.](https://arxiv.org/abs/2308.12287). Compare the
    claimed author/sender against an allowlist of approved internal creators and templates, and flag any
    item whose branding, template, or distribution path does not match the legitimate business process
    that should have produced it. Critically, do not rely on grammar quality: AI-authored lures are fluent
    and target-tailored ([Spear Phishing With Large Language Models, Hazell](https://arxiv.org/abs/2305.06972)),
    so a clean document is not exculpatory. A positive result (multiple indicators plus a branding/path
    mismatch) marks likely staged lure material supporting Resource Development; a negative result still
    warrants delivery-stage corroboration.'
  answer_sources:
  - Web proxy logs (translation services, persona sites, AI writing tools)
  - Endpoint file creation and metadata (document author, edit-time, creation hour, path)
  - Windows Event ID 4688
  - Sysmon Event ID 1 (process create) and Event ID 11 (file create)
  - PowerShell logs (Event ID 4104)
  - Cloud application audit logs (Microsoft 365, Google Workspace, OneDrive/Drive file events)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "items = new(messages, documents) over window\nindicators = count(credential_prompt, urgency,\
      \ brand_impersonation, embedded_link/macro,\n                   display_name_vs_from_mismatch) per\
      \ item\nmismatch = item.author/sender NOT in APPROVED_CREATORS\n           OR item.template NOT\
      \ in APPROVED_TEMPLATES\n           OR item.distribution_path != expected_business_process\nalert\
      \ when indicators >= 2 AND mismatch   # do NOT gate on grammar quality\nemit per-item indicator\
      \ list as evidence"
- question: Were draft files created in temp/staging paths or by authoring/translation/AI tools that are
    not on the organization's approved allowlist, and do candidate passages show a machine-sampled token-rank
    signature where most tokens fall within a reference language model's top-k predictions?
  context: This combines an allowlist control with an explainable AI-text heuristic. Maintain an allowlist
    of approved authoring tools and writing/translation/AI services, then flag draft files created in
    temp/staging directories or produced by tools off the allowlist - a common pattern when content is
    prepared outside sanctioned workflows. As a transparent secondary check, run candidate passages through
    GLTR-style per-token statistics from a reference LM and flag passages where 80-90%+ of tokens fall
    in the model's top-10/top-100 predictions, the hallmark of machine-sampled text, surfacing the highlighted
    tokens so an analyst can see the evidence ([GLTR, Gehrmann et al.](https://arxiv.org/abs/1906.04043),
    code https://github.com/HendrikStrobelt/detecting-fake-text). Derive the top-k threshold from a local
    human-written corpus so the rule reflects your population rather than a vendor default. A positive
    result (off-allowlist tooling plus a strong top-k token signature) flags likely AI-assisted draft
    lure or persona content; treat the token statistic as supporting, never sole, evidence.
  answer_sources:
  - Web proxy logs (translation services, persona sites, AI writing tools)
  - Endpoint file creation and metadata (document author, edit-time, creation hour, path)
  - Windows Event ID 4688
  - Sysmon Event ID 1 (process create) and Event ID 11 (file create)
  - PowerShell logs (Event ID 4104)
  - Cloud application audit logs (Microsoft 365, Google Workspace, OneDrive/Drive file events)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "drafts = file_create where path in TEMP/STAGING OR creating_tool NOT in ALLOWLIST_TOOLS\n\
      for each draft passage:\n  topk_frac = fraction(tokens in reference_LM.top_k_predictions)  # GLTR-style\n\
      \  k, threshold derived from LOCAL_HUMAN_CORPUS  # e.g. top-10/top-100, >0.80-0.90\nalert when draft\
      \ off-allowlist AND topk_frac > threshold\nemit highlighted top-k tokens as evidence"
- question: Does a draft deviate sharply from per-team, per-author baselines for authoring tool, language
    mix, edit duration, file path, creation hour, template reuse, or writing style - for example produced
    implausibly fast, via unexpected consumer translation/AI services, or with stylometry unlike the claimed
    author?
  context: Establish per-team and per-author baselines for authoring tool, language mix, edit duration,
    file path, creation hour, and template reuse, then use robust z-scores and percentile thresholds (|z|>=3
    or >99th percentile) to surface drafts produced implausibly fast (very low edit-time per character),
    drafts using consumer translation or AI-writing services unexpectedly, or drafts diverging sharply
    from historical template reuse. Add per-sender stylometric baselines - vocabulary richness, readability,
    sentiment, and function-word distribution ([Analyzing Social and Stylometric Features, Dewan et al.](https://arxiv.org/abs/1406.3692))
    - and flag drafts that deviate from a known author's established style, which can indicate ghost-authored
    or AI-generated content. Track Volume (character/byte counts, count of near-duplicate drafts), Frequency
    (drafts and AI-service requests per hour), and State (success/failure of cloud uploads, blocked DLP
    events) as distinct features. A statistically extreme deviation across multiple facets is a strong
    supporting signal that content was machine- or third-party-authored for Resource Development.
  answer_sources:
  - Web proxy logs (translation services, persona sites, AI writing tools)
  - Endpoint file creation and metadata (document author, edit-time, creation hour, path)
  - Windows Event ID 4688
  - Sysmon Event ID 1 (process create) and Event ID 11 (file create)
  - PowerShell logs (Event ID 4104)
  - Cloud application audit logs (Microsoft 365, Google Workspace, OneDrive/Drive file events)
  - 'NAI: TBD'
  range: Last 90 days (per-team/per-author rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per (team, author): tool, language_mix, edit_time/char, path, creation_hour,\n  \
      \                           template_reuse, stylometry(vocab,readability,sentiment,fn_words)\nz\
      \ = modified_zscore(draft.feature vs baseline)  # robust median/MAD\nalert when any |z| >= 3 OR\
      \ feature > p99\nfeatures: Volume=char/byte_count, near_dup_count; Frequency=drafts&AI_reqs/hr;\n\
      \          State=upload success/fail, DLP_blocked"
- question: Do documents receive high zero-shot synthetic-text scores from probability-curvature (DetectGPT)
    and perplexity-ratio (Binoculars) detectors calibrated to a local false-positive budget - while explicitly
    de-weighting known failure modes such as non-native-English writing and paraphrase evasion so no alert
    fires on an AI-text score alone?
  context: 'Compute zero-shot synthetic-likelihood scores per document using probability curvature ([DetectGPT,
    Mitchell et al.](https://arxiv.org/abs/2301.11305), code https://github.com/eric-mitchell/detect-gpt)
    and the perplexity/cross-perplexity ratio of two related LLMs ([Binoculars, Hans et al.](https://arxiv.org/abs/2401.12070),
    code https://github.com/ahans30/Binoculars). Calibrate the decision threshold to a fixed false-positive
    budget against a local human-written corpus rather than relying on a vendor default, so the score
    reflects your population. Crucially, profile and de-weight known failure modes: non-native-English
    writing tends to score machine-like, and recursive paraphrase/rewrite collapses detector accuracy
    ([Can AI-Generated Text be Reliably Detected?, Sadasivan et al.](https://arxiv.org/abs/2303.11156);
    [Survey on LLM-Generated Text Detection, Wu et al.](https://arxiv.org/abs/2310.14724)). Because of
    this, never alert on an AI-text score alone - use it only to rank and corroborate items already flagged
    by authoring-context, stylometric, or delivery-stage signals. A high, well-calibrated synthetic score
    on content that also impersonates a brand or targets executives raises confidence the material was
    machine-authored to support targeting.'
  answer_sources:
  - Web proxy logs (translation services, persona sites, AI writing tools)
  - Endpoint file creation and metadata (document author, edit-time, creation hour, path)
  - Windows Event ID 4688
  - Sysmon Event ID 1 (process create) and Event ID 11 (file create)
  - PowerShell logs (Event ID 4104)
  - Cloud application audit logs (Microsoft 365, Google Workspace, OneDrive/Drive file events)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each document:\n  s1 = DetectGPT.curvature_score(doc)\n  s2 = Binoculars.cross_perplexity_ratio(doc)\n\
      threshold = calibrate(LOCAL_HUMAN_CORPUS, fixed_FP_budget)\nde-weight when doc=non_native_english\
      \ OR suspected_paraphrase  # known failure modes\nrank (do NOT alert on score alone) when s1>thr\
      \ OR s2>thr\nalert only when high score CORROBORATED by context/impersonation signal"
- question: Does a supervised text classifier label a file or message as a phishing lure, persona narrative,
    fabricated job posting, or translated/AI-assisted draft - especially items that repeatedly score synthetic
    and that target executives, vendors, or recruiting themes - with explainable top contributing tokens/features?
  context: Train a supervised text classifier (transformer/DistilBERT or random forest) on legitimate
    internal writing versus phishing lures, persona narratives, fabricated job postings, and translated
    drafts, using features such as perplexity, burstiness, named-entity patterns, and sentiment shifts.
    Prioritize files and messages that repeatedly score synthetic and that target executives, vendors,
    or recruiting themes relevant to the organization - the themes most useful for downstream phishing,
    financial theft, or persona establishment. Surface the top-3 contributing tokens/features in each
    alert via LIME or attention attribution rather than emitting only a score, giving analysts auditable
    reasoning ([An Explainable Transformer-based Model for Phishing Email Detection](https://arxiv.org/abs/2402.13871);
    [ChatSpamDetector](https://arxiv.org/abs/2402.18093)). To resist paraphrase-based evasion, use an
    adversarially-trained detector ([RADAR, Hu et al.](https://arxiv.org/abs/2307.03838), models https://github.com/IBM/RADAR).
    A consistent malicious prediction on themed, repeat-offender content is a strong indicator of AI-assisted
    lure/persona authoring under Resource Development.
  answer_sources:
  - Web proxy logs (translation services, persona sites, AI writing tools)
  - Endpoint file creation and metadata (document author, edit-time, creation hour, path)
  - Windows Event ID 4688
  - Sysmon Event ID 1 (process create) and Event ID 11 (file create)
  - PowerShell logs (Event ID 4104)
  - Cloud application audit logs (Microsoft 365, Google Workspace, OneDrive/Drive file events)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'model = Classifier(DistilBERT|RandomForest).train(legit_writing vs lures/persona/jobs/translated)

      features = [perplexity, burstiness, NER_patterns, sentiment_shift]

      pred = model.predict_proba(item)

      prioritize when pred.malicious high AND theme in [exec, vendor, recruiting] AND repeat_synthetic

      use RADAR adversarial detector to resist paraphrase

      emit top-3 tokens/features via LIME/attention'
- question: Do staged or outbound narratives and documents cluster into near-duplicate groups sharing
    templates, with content homogeneity and synchronized creation timing across many identities, indicating
    fabricated-persona material sustained at scale?
  context: Cluster outbound and staged narratives and documents by near-duplicate text and shared templates,
    then apply feature-based persona/bot classification over content homogeneity, synchronized posting/creation
    timing, and timing entropy to surface fabricated-persona material sustained across many identities
    ([The Rise of Social Bots, Ferrara et al.](https://arxiv.org/abs/1407.5225), Botometer https://botometer.osome.iu.edu).
    Adversaries maintaining many sock-puppet personas reuse templates and produce content in coordinated
    bursts, so Volume (number of accounts/files sharing one template) and Frequency (creation bursts)
    drive cluster significance. A tight cluster of near-duplicate documents spread across numerous identities
    or accounts, especially with low timing entropy, indicates an orchestrated persona-content operation
    rather than organic activity - a direct supporting signal for Written Content used to establish and
    sustain accounts.
  answer_sources:
  - Web proxy logs (translation services, persona sites, AI writing tools)
  - Endpoint file creation and metadata (document author, edit-time, creation hour, path)
  - Windows Event ID 4688
  - Sysmon Event ID 1 (process create) and Event ID 11 (file create)
  - PowerShell logs (Event ID 4104)
  - Cloud application audit logs (Microsoft 365, Google Workspace, OneDrive/Drive file events)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: 'clusters = cluster(narratives+docs by near_duplicate_text & shared_template)  # minhash/embeddings

      for each cluster: features = [content_homogeneity, sync_creation_timing, timing_entropy]

      persona_score = persona/bot_classifier(features)

      significance: Volume = accounts/files per template; Frequency = creation_burst_rate

      alert when persona_score high AND Volume large AND low timing_entropy'
- question: Do document creation timestamps line up with browser/application visits to AI writing assistants,
    translation sites, or cloud editors - particularly short bursts of drafts by accounts or devices that
    do not normally use those services, or blocked/failed attempts to reach them?
  context: 'Match document creation timestamps and browser or application telemetry against visits to
    writing assistants, translation sites, and cloud editors used to prepare content ([Spear Phishing
    With Large Language Models, Hazell](https://arxiv.org/abs/2305.06972)). Flag drafts produced in short
    bursts by accounts or devices that do not normally access those services, which ties the authoring
    artifact to the tool that likely generated it. Importantly, profile failed and blocked attempts as
    a distinct signal: proxy-blocked AI endpoints and DLP-blocked uploads show that authoring or exfiltration
    of drafts was attempted even if it did not succeed (State). A temporal correlation between a fast
    burst of new drafts and an unusual visit to an AI/translation service - or a cluster of blocked attempts
    - is strong supporting evidence that written content was being machine-assisted for targeting, and
    should be corroborated with delivery-stage detection.'
  answer_sources:
  - Web proxy logs (translation services, persona sites, AI writing tools)
  - Endpoint file creation and metadata (document author, edit-time, creation hour, path)
  - Windows Event ID 4688
  - Sysmon Event ID 1 (process create) and Event ID 11 (file create)
  - PowerShell logs (Event ID 4104)
  - Cloud application audit logs (Microsoft 365, Google Workspace, OneDrive/Drive file events)
  - 'NAI: TBD'
  range: Last 90 days (correlate draft creation with AI-service access within minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ai_access = proxy/app where dest in AI_WRITING|TRANSLATION|CLOUD_EDITOR services\ndrafts =\
      \ file_create events per account/device\nalert when burst(drafts) within minutes of ai_access\n\
      \             AND account/device NOT in normal_users(service)\nalso alert on State: proxy_blocked\
      \ AI_endpoint OR DLP_blocked upload (attempted authoring)"
- question: Does inbound or internal mail fail DMARC alignment or SPF/DKIM, or match impersonation patterns
    such as a known display name paired with a never-before-seen From address, sender domains within 1-2
    edits of a protected brand/partner domain, or a per-sender header/MIME/MUA fingerprint deviation -
    and what were the SPF/DKIM/DMARC and lookalike-domain resolution outcomes?
  context: 'At the delivery stage, enforce DMARC alignment and SPF/DKIM as a deterministic authentication
    floor and flag misaligned mail. Layer content-agnostic impersonation rules that survive AI paraphrasing
    of the body: a known display name paired with a never-before-seen From address; sender domains within
    1-2 edits (Levenshtein/Damerau) of a protected brand or partner domain; and per-sender header/MIME/MUA
    fingerprint deviation ([Detecting Credential Spearphishing, Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho);
    [Reading Between the Lines, Gascon et al.](https://mlsec.org/docs/2018-raid.pdf)). These rules key
    on transport and identity rather than wording, so they remain effective even when an adversary used
    AI to author a flawless lure body. Profile State explicitly - SPF/DKIM pass vs. fail, DMARC pass/quarantine/reject,
    and NXDOMAIN/404 outcomes on referenced lookalike domains - so the analyst can see whether the message
    cleared authentication and whether its links resolve. A misaligned message from a lookalike domain
    impersonating a trusted display name is a high-confidence delivery of written-content lure material.'
  answer_sources:
  - Email gateway logs (SMTP headers, SPF/DKIM/DMARC results, attachment metadata)
  - Mailbox audit logs (Microsoft 365, Google Workspace)
  - Web proxy logs (URL clicks, lookalike domains)
  - DNS resolver logs (NXDOMAIN, newly-registered/lookalike domains)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "mail = inbound UNION internal\nauth_fail = mail where DMARC != aligned OR SPF=fail OR DKIM=fail\n\
      impersonation = (display_name in KNOWN AND from_addr never_seen)\n             OR levenshtein(from_domain,\
      \ PROTECTED_DOMAINS) in [1,2]\n             OR per_sender header/MIME/MUA fingerprint deviation\n\
      alert when auth_fail OR impersonation\nemit State: SPF/DKIM pass|fail, DMARC pass|quarantine|reject,\
      \ lookalike NXDOMAIN/404"
- question: When inbound messages are ranked along impersonation and volume axes (never-before-seen sender
    plus trusted display name, first contact reaching many recipients, urgency lure text) with non-parametric
    Directed Anomaly Scoring, which messages rise to the top of a bounded daily alert budget?
  context: Rather than fixed per-feature thresholds, rank inbound messages along impersonation and volume
    axes - a never-before-seen sender combined with a trusted display name, a first-contact sender reaching
    many recipients, and urgency lure text - using non-parametric Directed Anomaly Scoring ([Detecting
    Credential Spearphishing, Ho et al.](https://www.usenix.org/conference/usenixsecurity17/technical-sessions/presentation/ho)).
    DAS produces a bounded daily alert count at high recall by surfacing the most anomalous messages relative
    to the whole population, which keeps analyst workload predictable. Track Volume (recipients per message,
    attachment byte counts), Frequency (messages/min from a new sender), and State (click success/fail),
    and tune the alert budget (e.g., ~10/day) to local mail volume. Messages that top the ranking combine
    the impersonation and mass-delivery characteristics typical of a freshly authored lure campaign reaching
    the organization, making this an efficient triage layer over the deterministic authentication floor.
  answer_sources:
  - Email gateway logs (SMTP headers, SPF/DKIM/DMARC results, attachment metadata)
  - Mailbox audit logs (Microsoft 365, Google Workspace)
  - Web proxy logs (URL clicks, lookalike domains)
  - DNS resolver logs (NXDOMAIN, newly-registered/lookalike domains)
  - 'NAI: TBD'
  range: Last 90 days (daily alert budget)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "features per message = [new_sender + trusted_display_name, first_contact_to_many,\n      \
      \                  urgency_lure_text]\nscore = DirectedAnomalyScoring(messages)  # non-parametric,\
      \ population-relative\nrank desc; alert top-N where N tuned to local volume (~10/day)\ntrack Volume=recipients,attach_bytes;\
      \ Frequency=msgs/min/new_sender; State=click success/fail"
- question: Do messages that pass authentication (from compromised internal accounts or look-alike senders)
    still show recipient-set anomalies relative to the sender's historical contacts, poor URL reputation,
    and phishing-intent text - and can an explainable intent classifier name the urgency/lure/impersonation
    tokens driving the verdict?
  context: Some delivered lures pass the authentication floor because they originate from compromised
    internal accounts or convincing look-alike senders. Detect these with a random forest over recipient-profile
    anomaly (does the recipient set deviate from the sender's historical contacts), URL reputation, and
    phishing-intent text features, operating entirely on internal mail logs ([Detecting and Characterizing
    Lateral Phishing at Scale, Ho et al.](https://www.usenix.org/conference/usenixsecurity19/presentation/ho)).
    A sender suddenly emailing an unusual recipient set with risky URLs is a hallmark of account takeover
    used to deliver authored lures internally. Pair the random forest with an explainable transformer
    intent classifier that surfaces the urgency/lure/impersonation tokens driving each decision ([An Explainable
    Transformer-based Model for Phishing Email Detection](https://arxiv.org/abs/2402.13871)), so analysts
    get auditable reasoning rather than an opaque score. A positive result indicates internal/lateral
    delivery of written-content lures and should be escalated quickly, since authenticated mail bypasses
    many perimeter controls.
  answer_sources:
  - Email gateway logs (SMTP headers, SPF/DKIM/DMARC results, attachment metadata)
  - Mailbox audit logs (Microsoft 365, Google Workspace)
  - Web proxy logs (URL clicks, lookalike domains)
  - DNS resolver logs (NXDOMAIN, newly-registered/lookalike domains)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "rf = RandomForest over [recipient_profile_anomaly(sender historical contacts),\n         \
      \               url_reputation, phishing_intent_text]  # internal mail logs only\npred = rf.predict_proba(message)\n\
      intent = ExplainableTransformer.classify(message)  # surfaces urgency/lure/impersonation tokens\n\
      alert when pred.malicious high (esp. authenticated/internal sender)\nemit intent tokens for analyst-auditable\
      \ triage"
- question: For high-priority mail queues, when an LLM is prompted with parsed headers and body to classify
    a message, does it produce a natural-language rationale naming the specific deception or persona tactic
    - and is that advisory verdict corroborated by the deterministic authentication floor rather than
    trusted on its own?
  context: 'For high-priority queues, prompt an LLM with parsed headers plus body to classify the message
    and emit a natural-language rationale naming the specific deception or persona tactic used ([ChatSpamDetector,
    Koide et al.](https://arxiv.org/abs/2402.18093); [Devising and Detecting Phishing, Heiding et al.](https://arxiv.org/abs/2308.12287)).
    This supports analyst-auditable triage by explaining why a message looks malicious - for example identifying
    a fabricated-vendor persona, a fake invoice narrative, or an impersonated executive request - rather
    than returning an opaque score. Treat the verdict strictly as advisory and corroborate with the deterministic
    authentication floor (DMARC/SPF/DKIM and impersonation rules), because AI-text and intent scores are
    evadable by paraphrase ([Can AI-Generated Text be Reliably Detected?, Sadasivan et al.](https://arxiv.org/abs/2303.11156)).
    The value here is explanation and prioritization: a clear rationale that aligns with an authentication
    failure or lookalike-domain finding gives analysts a fast, defensible read on delivered written-content
    lures, while a rationale unsupported by the floor should lower confidence.'
  answer_sources:
  - Email gateway logs (SMTP headers, SPF/DKIM/DMARC results, attachment metadata)
  - Mailbox audit logs (Microsoft 365, Google Workspace)
  - Web proxy logs (URL clicks, lookalike domains)
  - DNS resolver logs (NXDOMAIN, newly-registered/lookalike domains)
  - 'NAI: TBD'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "for message in HIGH_PRIORITY_QUEUE:\n  verdict, rationale = LLM.classify(parsed_headers +\
      \ body)  # names deception/persona tactic\n  treat verdict as ADVISORY only\nalert when verdict=malicious\
      \ AND corroborated by auth_floor(DMARC/SPF/DKIM, impersonation)\nlower confidence when rationale\
      \ unsupported by floor (paraphrase-evadable)\nstore rationale for analyst-auditable triage"
