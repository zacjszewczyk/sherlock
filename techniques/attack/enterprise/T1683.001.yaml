name: 'T1683.001: Written Content'
id: daa66df5-dbfe-4264-9259-f05fbb42648d
description: 'Investigate adversary creation or tailoring of written materials used to support targeting
  and malicious operations under Resource Development. Such materials include phishing lures, fraudulent
  financial communications, fabricated job postings, fabricated employment credentials and documentation,
  decoy documents, social-media persona content, and supporting narratives used to sustain fabricated
  personas over time. Content may be authored manually, commissioned through third parties, or produced
  with AI-assisted writing and translation tools, and may impersonate legitimate government correspondence,
  diplomatic communications, or internal organizational documents. Because authoring largely occurs outside
  the victim''s visibility, this playbook treats endpoint and cloud authoring artifacts as supporting
  signals to be corroborated with delivery-stage detection. It helps an analyst hunt for: draft lures,
  persona scripts, translated messages, and fabricated documents staged in temp/staging paths, mailboxes,
  or cloud workspaces; suspicious author metadata and implausibly fast edit times; browser/proxy sessions
  reaching AI-writing or translation services; near-duplicate drafts produced in short bursts; and, at
  the delivery stage, inbound or internal email that fails authentication, impersonates trusted senders,
  or carries AI-tailored deception. The playbook combines deterministic symbolic-logic rules, robust statistical
  baselining and AI-text scoring, and machine-learning classification/clustering across web proxy, endpoint,
  email, mailbox, DNS, and cloud-application telemetry.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
