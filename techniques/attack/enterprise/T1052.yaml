name: 'T1052: Exfiltration Over Physical Medium'
id: 0dca8510-b570-490c-912a-1bfc0465b527
description: Investigate potential exfiltration of data over a physical medium such as a removable USB
  drive, external hard disk, cellular phone, MP3 player, or other removable storage device. This playbook
  helps an analyst determine whether an adversary or insider is copying sensitive data to removable media,
  including cases where the medium is used as the final exfiltration point or to hop between otherwise
  disconnected or air-gapped systems. It correlates removable-device insertion (PnP) events with follow-on
  file writes and the writing process, detects copy and archiving utilities staging sensitive directories
  to removable mounts, profiles per-user removable-media write behavior against 30-day baselines, and
  surfaces probing activity evidenced by bursts of blocked-device and denied-write attempts. Guidance
  spans Windows (Security/Sysmon/System events), Linux (auditd), and macOS (unified log, osquery, fs_usage)
  endpoints.
type: technique
related:
- tactic_id: TA0010
  tactic_name: Exfiltration
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Which processes wrote files to a removable device shortly after it was mounted, and does the
    writing binary's hash, signer, or path match known malicious tooling or fall outside approved enterprise
    transfer utilities?
  context: 'This targets the core physical-exfiltration pattern under the Exfiltration tactic: an actor
    connecting removable media and immediately writing data to it. Anchor on the removable-device insertion
    (Windows PnP audit Event 6416, also surfaced by the SigmaHQ external-device rule) and correlate the
    device vendor/product/serial with follow-on file writes (Sysmon EID 11, Windows 4663) and the writing
    process (Sysmon EID 1 / 4688). A positive result is a write whose process hash, signer, or path matches
    known malicious tooling, is unsigned where a signed enterprise transfer utility is expected, or whose
    device serial is not on the approved-media allowlist. Allowlisting devices and reader processes is
    high-fidelity on stable endpoints; an unrecognized writer or unknown serial strongly indicates exfiltration
    rather than benign transfer.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - Sysmon Event ID 11
  - 'NAI: All endpoints (desktops, laptops), servers with accessible physical ports (e.g., USB), and workstations
    used by privileged accounts or users with access to sensitive data repositories.'
  range: Last 90 days (correlate device-insertion 6416 with file writes within 5 minutes)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  device_insert = search EventCode=6416  // PnP removable media\n  writes = search (Sysmon\
      \ EID=11 OR Security EID=4663) WHERE TargetPath matches removable_mount\n  join device_insert, writes\
      \ on host, device_serial within 5m\n  writer = lookup process (Sysmon EID=1 OR EID=4688) by pid\n\
      \  ALERT if writer.hash in known_malicious\n         OR writer.signer NOT in approved_signers\n\
      \         OR writer.path NOT in approved_transfer_utils\n         OR device_serial NOT in approved_media_allowlist"
- question: Are any removable-media write sessions statistically rare for their process-user-host combination
    or for the volume and file-count of data transferred compared with a 30-day baseline?
  context: 'For the Exfiltration tactic, even an approved utility can be abused, so this question hunts
    for rare context rather than known-bad binaries. Maintain 30-day baselines for processes, users, host
    roles, and file types involved in removable-media writes, and capture the physics of the transfer:
    Volume (total bytes), Frequency (files/min), and State (write success vs. denied). Score each new
    session and alert when the process-user-host tuple or the byte/file-count mix falls below the 1st
    percentile of benign usage, prioritizing rare or first-seen writer binaries and device serials by
    fleet prevalence and peer-group (cohort) outlier comparison. A low-percentile, first-seen writer moving
    large volumes is a strong exfiltration lead; a common writer with typical volume is likely benign.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - Sysmon Event ID 11
  - 'NAI: All endpoints (desktops, laptops), servers with accessible physical ports (e.g., USB), and workstations
    used by privileged accounts or users with access to sensitive data repositories.'
  range: Last 90 days (with 30-day rolling baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  baseline = stats over 30d by process,user,host_role,file_type\n            -> p1(total_bytes),\
      \ p1(files_per_min), prevalence(writer_hash), prevalence(device_serial)\n  per new removable_write_session:\n\
      \    score = percentile_rank(session vs baseline)\n    ALERT if tuple(process,user,host) below 1st\
      \ percentile\n           OR writer_hash first_seen/rare across fleet\n           OR device_serial\
      \ first_seen\n    compare against peer cohort (same role) for outlier confirmation"
- question: Does a trained classifier flag a removable-media write session as high-risk for data theft,
    and which features (byte volume, unknown signer, off-hours, file sensitivity) drive that score?
  context: Under the Exfiltration tactic this applies behavioral modeling to removable-media writes. Train
    a classifier on write sessions using features such as device-insertion timing, process lineage, signer
    status, file sensitivity, byte volume, file-count burst, and destination-drive characteristics; insider
    data-theft-to-USB is well captured by such models on the CERT insider-threat dataset. Use an online
    per-feature autoencoder (Kitsune) so the alert surfaces the top-3 contributing features driving the
    score. A high score with explainable drivers (e.g., large volume + unknown signer + off-hours) is
    an actionable exfiltration lead; the feature attribution lets the analyst quickly confirm or dismiss.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 6416
  - Sysmon Event ID 11
  - 'NAI: All endpoints (desktops, laptops), servers with accessible physical ports (e.g., USB), and workstations
    used by privileged accounts or users with access to sensitive data repositories.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  features = [insertion_timing, process_lineage, signer_status, file_sensitivity,\n      \
      \       byte_volume, file_count_burst, dest_drive_chars]\n  model = autoencoder/classifier trained\
      \ on labeled USB-write sessions (CERT-style)\n  for session in removable_write_sessions:\n    risk\
      \ = model.score(features(session))\n    ALERT if risk > threshold\n    emit top_3_contributing_features(session)"
- question: Were any file-copy or transfer commands executed (xcopy, robocopy, Copy-Item, bitsadmin, tar,
    rsync) whose source is a monitored sensitive directory and whose destination resolves to a removable-media
    mount?
  context: This addresses Exfiltration via explicit copy commands. In process-creation logs with command
    lines (Windows 4688, PowerShell 4104, Sysmon EID 1), apply a rule for transfer utilities where the
    source is a monitored sensitive path (e.g., C:\Data\Finance\, \\fileshare\HR) and the destination
    resolves to a removable-media mount, correlating the drive letter back to a PnP Event 6416 insertion.
    Alert on any match; the device-connect + bulk-copy sequence is the canonical insider data-theft pattern.
    A positive result is a sensitive-to-removable copy command; the source path and utility used scope
    the data at risk.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All endpoints and servers with command-line auditing enabled, administrative jump boxes, developer
    workstations, and servers hosting critical data.'
  range: Last 90 days (correlate command with 6416 device insertion)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  cmds = search (EID=4688 OR PowerShell 4104 OR Sysmon EID=1)\n  WHERE process IN (xcopy,robocopy,Copy-Item,bitsadmin,tar,rsync)\n\
      \    AND cmdline.source IN monitored_sensitive_paths\n    AND cmdline.dest resolves_to removable_mount\n\
      \  removable_mount confirmed via EventCode=6416 insertion on same host\n  ALERT on any match"
- question: Do command-line copies to removable media show anomalous source/destination path entropy or
    file counts well above a user's historical norm, including spikes in denied/failed copies?
  context: For the Exfiltration tactic, this statistically prioritizes copy commands. For command-line
    copies to removable media, compute Shannon entropy of source/destination paths and the Volume/Frequency
    metrics (total bytes, file count). Baseline per user and flag path entropy above the 95th percentile
    (possible obfuscation) or file counts above the user's historical mean + 3 sigma (e.g., wildcard copy
    of >1000 files). Score combined feature vectors with Isolation Forest to rank outlier copy sessions,
    and separately profile copy failures/denied access as a probing signal. High entropy or massive file
    counts indicate bulk or obfuscated exfiltration; elevated failures suggest probing for an unmonitored
    path.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All endpoints and servers with command-line auditing enabled, administrative jump boxes, developer
    workstations, and servers hosting critical data.'
  range: Last 90 days (with per-user historical baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  for copy_cmd to removable_media:\n    path_entropy = shannon(source_path)+shannon(dest_path)\n\
      \    vol=total_bytes; fcount=file_count\n  baseline per user: mean,std(fcount); p95(path_entropy)\n\
      \  ALERT if path_entropy > p95 OR fcount > mean+3*std\n  rank multivariate sessions with IsolationForest\n\
      \  separately flag spikes in denied/failed copy attempts"
- question: Does a sequence model of command-line activity flag a copy-to-removable command as structurally
    anomalous, and which tokens or arguments are the most unusual?
  context: Under Exfiltration this models command-line structure. Treat command lines as token sequences
    and train a sequence model (LSTM autoencoder or next-token predictor) on benign command-line activity;
    high reconstruction error or low next-token likelihood flags anomalous structure, mirroring log-key
    approaches (DeepLog) and temporal insider models. Emit the top-3 anomalous tokens/arguments in the
    alert for analyst triage. A high reconstruction error on a copy command targeting removable media,
    with unusual arguments (rare switches, unexpected paths), is an actionable lead; common, well-formed
    admin commands score low.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Sysmon Event ID 1
  - 'NAI: All endpoints and servers with command-line auditing enabled, administrative jump boxes, developer
    workstations, and servers hosting critical data.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  tokens = tokenize(command_line)\n  model = LSTM_autoencoder trained on benign command lines\n\
      \  for cmd in copy_to_removable_cmds:\n    err = reconstruction_error(model, tokens(cmd))\n    ALERT\
      \ if err > threshold\n    emit top_3_anomalous_tokens(cmd)"
- question: Was an archive file (.zip/.rar/.7z) created and then written to a removable device by the
    same user or host within a short (e.g., 10-minute) window?
  context: This captures the collection->staging->physical-exfil chain central to Exfiltration. Use stateful
    correlation triggering when, within a 10-minute window on one host, (1) an archiving tool (7z.exe,
    WinRAR.exe, tar.exe) creates an archive file (Sysmon EID 11 / 4688) and (2) that same archive is written
    (Windows 4663 / Sysmon EID 11) to a removable-media mount tied to a PnP Event 6416 insertion. Alert
    on the correlated stage-then-exfil sequence. A positive result is a freshly created archive landing
    on removable media; this is a high-confidence indicator of deliberate data packaging for physical
    removal.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User workstations, file servers, staging servers, and temporary directories (`C:\Users\*\AppData\Local\Temp`,
    `C:\Windows\Temp`) on application servers.'
  range: Last 90 days (10-minute stateful correlation window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  arch_create = search (Sysmon EID=11 OR EID=4688)\n               WHERE process IN (7z.exe,WinRAR.exe,tar.exe)\
      \ AND file matches *.zip|*.rar|*.7z\n  arch_write = search (Security 4663 OR Sysmon EID=11)\n  \
      \            WHERE TargetPath in removable_mount AND file == arch_create.file\n  removable_mount\
      \ confirmed via EventCode=6416\n  ALERT if arch_write within 10m of arch_create on same host"
- question: Among correlated archive-then-copy sequences, which show an unusually large archive size combined
    with an unusually short delay between archive creation and copy to removable media?
  context: For the Exfiltration tactic this prioritizes staging sequences statistically. For each correlated
    stage-and-copy sequence, measure archive size (Volume), file-count, and the time delta between archive
    creation and copy. Baseline both metrics; a sequence with archive size in the top 2nd percentile (e.g.,
    >1 GB) and a time delta in the bottom 2nd percentile (e.g., <30 s) is high priority. Rank multivariate
    sessions with Isolation Forest and compare against peer cohorts. A large archive copied almost immediately
    suggests an automated or pre-planned exfiltration; small archives copied after long delays are likely
    benign.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User workstations, file servers, staging servers, and temporary directories (`C:\Users\*\AppData\Local\Temp`,
    `C:\Windows\Temp`) on application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  for seq in archive_then_copy_sequences:\n    size=archive_bytes; fcount=file_count; delta=copy_time-create_time\n\
      \  baseline size, delta across fleet\n  ALERT if size >= p98(size) AND delta <= p2(delta)\n  rank\
      \ with IsolationForest; compare to peer cohort"
- question: Does a temporal/provenance model flag the per-host event pattern 'spawn archiver -> create
    large archive -> write to USB' as an anomalous subgraph?
  context: Under Exfiltration this models the full staging chain. Model the per-host event stream (process/file
    creations, writes) and score the temporal pattern spawn archiver -> create large archive -> write
    to USB. Use sequence/log-key anomaly detection (DeepLog) or provenance-graph autoencoders (MAGIC,
    KAIROS) that flag the anomalous device->process->file->archive subgraph and reconstruct an explainable
    subgraph for the analyst. A flagged subgraph linking an archiver to a removable-media write is a strong,
    explainable exfiltration lead; routine archiving that never touches removable media will not match
    the device subgraph.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: User workstations, file servers, staging servers, and temporary directories (`C:\Users\*\AppData\Local\Temp`,
    `C:\Windows\Temp`) on application servers.'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  build provenance graph per host: process->file->archive->device edges\n  model = graph_autoencoder/log-key\
      \ model (DeepLog/MAGIC/KAIROS)\n  score subgraph: spawn_archiver -> create_large_archive -> write_to_USB\n\
      \  ALERT if subgraph anomaly_score > threshold\n  return reconstructed explainable subgraph"
- question: Did any user write more than a small threshold (e.g., >5) of distinct high-risk file types
    (.pst, .ost, .bak, .sql, .pfx, .kdbx, .nsf, .mdb) to removable media within a one-hour window?
  context: This targets bulk copying of sensitive file types for Exfiltration. Per user, count files written
    to removable media in a 1-hour window with high-risk extensions and alert when the count exceeds a
    static, per-environment threshold (e.g., >5 distinct high-risk files). These extensions represent
    mailboxes, databases, backups, and credential stores; bulk copies of them to removable media are classic
    insider data-exfiltration indicators. A positive result is a concentrated burst of sensitive file
    types to removable media, identifying both the user and the categories of data at risk.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Sysmon Event ID 11
  - 'NAI: All endpoints with object access auditing enabled for removable storage, particularly those
    used by privileged users, executives, or personnel in sensitive roles (e.g., HR, Finance, R&D).'
  range: Last 90 days (1-hour sliding window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  writes = search (Security 4663 OR Sysmon EID=11) WHERE TargetPath in removable_mount\n \
      \ high_risk = file_ext IN (.pst,.ost,.bak,.sql,.pfx,.kdbx,.nsf,.mdb)\n  count distinct high_risk\
      \ files by user in 1h window\n  ALERT if count > 5  // tune per environment"
- question: Has a user's removable-media write activity deviated on two or more metrics (total volume,
    file count, unique extensions, average file size, or denied-write rate) by Z>=3 from their 30-day
    baseline within 24 hours?
  context: For the Exfiltration tactic this detects multi-faceted behavioral shifts. Maintain a 30-day
    rolling per-user baseline of daily removable-media activity (total Volume in bytes, file count, unique
    extensions, average file size) plus a State baseline of denied/blocked write attempts. Compute Z-scores
    and alert when two or more metrics exceed Z=3, indicating multi-faceted deviation. Derive thresholds
    empirically from your own logs. Simultaneous spikes across several metrics are far more indicative
    of exfiltration than a single noisy metric; peer-group baselining reduces false positives.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Sysmon Event ID 11
  - 'NAI: All endpoints with object access auditing enabled for removable storage, particularly those
    used by privileged users, executives, or personnel in sensitive roles (e.g., HR, Finance, R&D).'
  range: Last 90 days (30-day rolling baseline, 24-hour evaluation)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  baseline per user over 30d: mean,std of {total_bytes, file_count,\n     unique_exts, avg_file_size,\
      \ denied_write_count}\n  for each user last 24h:\n    z[m] = (value[m]-mean[m])/std[m] for each\
      \ metric m\n  ALERT if count(z[m] >= 3) >= 2"
- question: Does nightly clustering of users' removable-media behavior show any user becoming a density
    outlier or jumping to a higher-risk behavioral cluster?
  context: Under Exfiltration this groups peers and finds behavioral shifts. Nightly, featurize each user's
    last-24h removable-media activity (total volume, file count, time-of-day distribution, file-type entropy,
    failure rate) and cluster (DBSCAN/K-Means) into behavioral cohorts; alert when a user becomes a density
    outlier (DBSCAN) or jumps to a higher-risk cluster (K-Means). Use Isolation Forest for linear-time
    outlier scoring and report the top-3 deviating features. A user separating from their normal cohort
    or moving into a high-volume/high-failure cluster is an exfiltration lead; stable cohort membership
    is benign.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 4656
  - Sysmon Event ID 11
  - 'NAI: All endpoints with object access auditing enabled for removable storage, particularly those
    used by privileged users, executives, or personnel in sensitive roles (e.g., HR, Finance, R&D).'
  range: Last 90 days (nightly 24-hour featurization)
  queries:
  - technology: ML/pseudocode
    query: "  nightly: features per user = [total_volume, file_count, tod_distribution,\n     file_type_entropy,\
      \ failure_rate]\n  cluster users with DBSCAN/K-Means\n  ALERT if user is DBSCAN density-outlier\
      \ OR jumped to higher-risk cluster\n  score with IsolationForest; emit top_3_deviating_features"
- question: Is any single user or host producing a burst of blocked removable-device connections, repeated
    non-allowlisted device insertions, or denied removable-media write attempts (e.g., >=5 in 10 minutes)?
  context: This detects probing for an unmonitored exfiltration path under the Exfiltration tactic. Alert
    when a single user/host produces a burst of Device Control/WPD removable-storage denials, repeated
    unrecognized Event 6416 insertions of non-allowlisted media, or failed object-access requests (4656/4663
    with failure access mask) targeting removable volumes within a short window (e.g., >=5 in 10 minutes).
    Off-hours device-connect attempts amplify priority. Repeated failures suggest an actor testing different
    devices or paths to find one that is not blocked or monitored; a positive result warrants reviewing
    what the user was attempting to copy.
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Windows Event ID 6416
  - Microsoft-Windows-Windows Defender/Operational (Device Control)
  - Sysmon Event ID 1
  - 'NAI: All endpoints with removable-storage device control and object-access auditing enabled, especially
    hosts of privileged users and personnel in sensitive roles (HR, Finance, R&D).'
  range: Last 90 days (10-minute burst window)
  queries:
  - technology: SIEM/Rule pseudocode
    query: "  denials = search (Defender Device Control/WPD removable denials)\n          OR (EID=6416\
      \ non_allowlisted_serial)\n          OR (Security 4656/4663 failure_access_mask AND target in removable_mount)\n\
      \  count by user,host in 10m window\n  ALERT if count >= 5\n  raise priority if off_hours"
- question: Does a user's or host's removable-media failure rate (blocked-device count, denied-write count,
    or fail/success ratio) exceed the 99th percentile of its baseline?
  context: 'For the Exfiltration tactic this treats denial spikes as a distinct probing signal. Maintain
    a per-user/per-host baseline of removable-media failure State: blocked-device count, denied-write
    count, and the ratio of failed-to-successful access. Alert when the failure count or fail/success
    ratio exceeds the 99th percentile of the baseline, treating denial spikes as a probing signal separate
    from successful-copy volume metrics. A sudden jump in failures or in the fail/success ratio indicates
    an actor repeatedly attempting and being blocked from removable-media access; normal users rarely
    accumulate many denials.'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Windows Event ID 6416
  - Microsoft-Windows-Windows Defender/Operational (Device Control)
  - Sysmon Event ID 1
  - 'NAI: All endpoints with removable-storage device control and object-access auditing enabled, especially
    hosts of privileged users and personnel in sensitive roles (HR, Finance, R&D).'
  range: Last 90 days (with per-user/host baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "  baseline per user/host: distribution of {blocked_device_count,\n     denied_write_count,\
      \ fail_success_ratio}\n  for current window:\n    ALERT if blocked_device_count > p99\n        \
      \   OR denied_write_count > p99\n           OR fail_success_ratio > p99"
- question: When failure features (blocked-device rate, denied-access rate, fail/success ratio) are added
    to the per-session feature vector, does an unsupervised model flag probing behavior, and which features
    drive the score?
  context: Under Exfiltration this enriches anomaly scoring with probing signals. Include failure features
    (blocked-device rate, denied-access rate, fail/success ratio) in the per-session feature vector scored
    by an unsupervised detector (Isolation Forest) or online autoencoder (Kitsune); these capture probing
    where an actor repeatedly fails to mount or read media, and the model surfaces the top-3 contributing
    features (e.g., denial rate, off-hours, non-allowlisted serial) in the alert. A high score driven
    by failure features identifies an actor hunting for an open exfiltration path even before any successful
    copy occurs.
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4663
  - Windows Event ID 6416
  - Microsoft-Windows-Windows Defender/Operational (Device Control)
  - Sysmon Event ID 1
  - 'NAI: All endpoints with removable-storage device control and object-access auditing enabled, especially
    hosts of privileged users and personnel in sensitive roles (HR, Finance, R&D).'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "  features = base_session_features + [blocked_device_rate, denied_access_rate,\n     fail_success_ratio,\
      \ off_hours, non_allowlisted_serial]\n  model = IsolationForest / Kitsune autoencoder\n  for session\
      \ in removable_media_sessions:\n    score = model.score(features(session))\n    ALERT if score >\
      \ threshold\n    emit top_3_contributing_features(session)"
