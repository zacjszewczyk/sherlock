- question: '[Stealth] Disk utility command rule: Can you determine whether a process creation event for
    a disk management utility (e.g., diskpart.exe, mountvol.exe, fsutil.exe) with command-line arguments
    used to delete a volume mount point, create a new file of a specific size, or execute a script to
    manipulate partitions, which can create unallocated or hidden space. -- specifically, using the ''Disk
    utility command rule'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the adversary conceals malicious components
    and file input/output from users and security tools by maintaining a hidden or virtual file system
    -- carved into unallocated/reserved disk space, dropped as an opaque partition-image file, mounted
    by a kernel driver via raw disk I/O, or stored in boot areas/registry -- so the activity blends in
    with normal operations and leaves defensive telemetry intact. This evidence focuses on the condition
    that a process creation event for a disk management utility (e.g., diskpart.exe, mountvol.exe, fsutil.exe)
    with command-line arguments used to delete a volume mount point, create a new file of a specific size,
    or execute a script to manipulate partitions, which can create unallocated or hidden space. This Symbolic
    Logic approach works as follows: Alert on process creation (Windows Event ID 4688 / Sysmon 1) for
    `mountvol.exe` with `/d`, `diskpart.exe` running a script containing `create partition`/`delete volume`/`shrink`,
    or `fsutil.exe file createnew`, which can carve unallocated or reserved space used to host a hidden
    file system ([Virtual File Systems for Beginners](http://www.malwaretech.com/2014/11/virtual-file-systems-for-beginners.html)).
    Whitelist known administrative parents (`mmc.exe`, deployment agents) and signed installer command-line
    patterns to control false positives. A positive result -- a rule match, statistical outlier, or model
    alert -- is a strong indicator that an adversary is staging, carving, mounting, or reading/writing
    a hidden file system to conceal tooling or stolen data; pivot to the responsible process and its parent
    lineage, the user and host context, the implicated disk region/driver/registry key or container file,
