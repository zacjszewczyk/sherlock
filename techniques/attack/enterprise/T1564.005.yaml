- question: '[Stealth] Blob/installer entropy and volume scoring: Can you determine whether a file transfer
    containing an executable or archive where the file hash, name, or embedded metadata (e.g., product
    name, internal name) matches a known utility for creating hidden file systems (e.g., VeraCrypt, TrueCrypt,
    E4sh, BestCrypt), indicating staging of tooling that can carve or conceal disk space. -- specifically,
    using the ''Blob/installer entropy and volume scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the adversary conceals malicious components
    and file input/output from users and security tools by maintaining a hidden or virtual file system
    -- carved into unallocated/reserved disk space, dropped as an opaque partition-image file, mounted
    by a kernel driver via raw disk I/O, or stored in boot areas/registry -- so the activity blends in
    with normal operations and leaves defensive telemetry intact. This evidence focuses on the condition
    that a file transfer containing an executable or archive where the file hash, name, or embedded metadata
    (e.g., product name, internal name) matches a known utility for creating hidden file systems (e.g.,
    VeraCrypt, TrueCrypt, E4sh, BestCrypt), indicating staging of tooling that can carve or conceal disk
    space. This Statistical Method approach works as follows: For executables and archives observed in
    Zeek files.log, compute Shannon entropy of both the filename and (where reconstructed) file bytes.
    Encrypted container images and packed droppers exceed ~7.0-7.2 bits/byte versus ~4.5-6.5 for ordinary
    code/text ([Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989)).
    Build a rolling 30-day baseline; alert on filename entropy above the 95th percentile OR file-content
    entropy >7.2 with size >1 MB, excluding an allow-list of known installers. Report the entropy value
    and matched size band in the alert (Volume metric). A positive result -- a rule match, statistical
    outlier, or model alert -- is a strong indicator that an adversary is staging, carving, mounting,
    or reading/writing a hidden file system to conceal tooling or stolen data; pivot to the responsible
    process and its parent lineage, the user and host context, the implicated disk region/driver/registry
    key or container file, and any associated encryption keys or network transfers. A negative result
    helps rule out this particular hidden-file-system vector but should be corroborated with the other
    questions in this playbook, since a single method can miss stealthy, kernel-level, or living-off-the-land
    implementations.'
