questions:
- question: '[Stealth] Hidden file transfer IOC watchlist: Can you determine whether a file transfer containing
    an executable or archive where the file hash, name, or embedded metadata (e.g., product name, internal
    name) matches a known utility for creating hidden file systems (e.g., VeraCrypt, TrueCrypt, E4sh,
    BestCrypt), indicating staging of tooling that can carve or conceal disk space. -- specifically, using
    the ''Hidden file transfer IOC watchlist'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), the adversary conceals malicious components
    and file input/output from users and security tools by maintaining a hidden or virtual file system
    -- carved into unallocated/reserved disk space, dropped as an opaque partition-image file, mounted
    by a kernel driver via raw disk I/O, or stored in boot areas/registry -- so the activity blends in
    with normal operations and leaves defensive telemetry intact. This evidence focuses on the condition
    that a file transfer containing an executable or archive where the file hash, name, or embedded metadata
    (e.g., product name, internal name) matches a known utility for creating hidden file systems (e.g.,
    VeraCrypt, TrueCrypt, E4sh, BestCrypt), indicating staging of tooling that can carve or conceal disk
    space. This Symbolic Logic approach works as follows: Maintain a watchlist of file hashes, names,
    and embedded PE metadata (ProductName/InternalName) for known hidden/virtual file system and full-disk-encryption
    utilities (VeraCrypt, TrueCrypt, BestCrypt, E4sh) plus tooling that drops partition images. Query
    Zeek files.log to alert on any transferred file matching the watchlist, and correlate with conn.log
    to recover source/destination, ASN, and port. Hidden file systems are frequently staged as carrier
    tooling or as dropped partition images ([Virtual File Systems for Beginners](http://www.malwaretech.com/2014/11/virtual-file-systems-for-beginners.html),
    [ComRAT v4](https://www.welivesecurity.com/wp-content/uploads/2020/05/ESET_Turla_ComRAT.pdf)). A positive
    result -- a rule match, statistical outlier, or model alert -- is a strong indicator that an adversary
    is staging, carving, mounting, or reading/writing a hidden file system to conceal tooling or stolen
    data; pivot to the responsible process and its parent lineage, the user and host context, the implicated
    disk region/driver/registry key or container file, and any associated encryption keys or network transfers.
    A negative result helps rule out this particular hidden-file-system vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, kernel-level,
    or living-off-the-land implementations.'
