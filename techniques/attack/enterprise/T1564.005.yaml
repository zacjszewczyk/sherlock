name: 'T1564.005: Hide Artifacts: Hidden File System'
id: ea58d7b8-5359-4f9c-a34f-3d44e35b6b6b
description: 'This playbook helps an analyst investigate whether an adversary is using a hidden or virtual
  file system to conceal malicious activity from users and security tools, as part of the Stealth tactic.
  Hidden file systems can be implemented by carving unallocated or reserved disk space, dropping a self-contained
  partition image as an opaque high-entropy file (e.g., the Turla ComRAT FAT16 VFS), fragmenting data
  across the existing file system, or mounting volumes via kernel drivers that perform raw disk I/O outside
  standard file-system APIs. It guides the analyst across several behavioral angles: network staging of
  hidden/virtual-FS and full-disk-encryption tooling (VeraCrypt, TrueCrypt, BestCrypt, E4sh) caught in
  Zeek files/conn/http logs by hash, name, PE metadata, and entropy; disk-management command-line abuse
  (diskpart, mountvol, fsutil) that carves or hides space; unsigned/known-bad kernel driver service creation
  (Event ID 7045) and Code Integrity blocks (Event ID 3033) enriched against LOLDrivers; unauthorized
  raw disk handle access via SACL-audited Event IDs 4656/4663 to \\.\PhysicalDrive and \Device\HarddiskVolume
  objects; boot-area and registry modifications (Event ID 4657) targeting NTFS/BootExecute/Session Manager
  keys and the EFI System Partition; periodic disk-geometry audits that reveal unallocated gaps filled
  with high-entropy data; and the discovery of opaque container files repeatedly read/written by a single
  resident process with a registry-stored key. Detection methods combine symbolic-logic rules, statistical
  baselining, entropy and change-point analysis, and machine-learning models (Random Forest, Isolation
  Forest, One-Class SVM, DBSCAN, autoencoders, sequence models) applied to Windows Security/Sysmon events,
  auditd, macOS unified logs, and Zeek network logs, so the analyst can corroborate suspected hidden-file-system
  activity across network staging, process execution, driver/registry/boot changes, raw disk access, and
  on-disk container artifacts.'
type: technique
