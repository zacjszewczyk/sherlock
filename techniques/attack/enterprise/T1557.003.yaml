- question: '[Credential Access] Detect multi-offer transactions: Can you determine, using the "Detect
    multi-offer transactions" (Symbolic Logic) approach, whether a DHCP transaction ID (xid) receives
    Offers from multiple distinct server IPs within 2 seconds, and Windows Event ID 1042 records the conflicting
    leases. Per RFC 2131 a single xid should normally be answered by one authorized server; competing
    OFFERs indicate a race between the legitimate and rogue server.'
  context: 'Why this matters under the Credential Access tactic (TA0006): DHCP Spoofing places an attacker
    as a rogue DHCP server to hand clients malicious DNS/gateway configuration and seize an Adversary-in-the-Middle
