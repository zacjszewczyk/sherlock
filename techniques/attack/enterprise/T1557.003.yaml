    from multiple distinct server IPs within 2 seconds, and Windows Event ID 1042 records the conflicting
    leases. Per RFC 2131 a single xid should normally be answered by one authorized server; competing
    OFFERs indicate a race between the legitimate and rogue server. This Symbolic Logic approach works
    as follows: Alert when Zeek dhcp.log and Windows Event ID 1042 show a single trans_id receiving OFFERs
    from >1 distinct server identifier within two seconds ([RFC 2131](https://www.rfc-editor.org/rfc/rfc2131.txt));
    the second/unexpected server-identifier is the prime rogue suspect ([Classification of DHCP Spoofing
    and Effectiveness of DHCP Snooping](https://doi.org/10.5220/0008099002330238)). A positive result
    is a strong indicator of rogue-DHCP/AiTM activity -- pivot to the offending server IP/MAC/port, the
    affected client subnet, the assigned DNS/gateway values, and any downstream cleartext-credential,
