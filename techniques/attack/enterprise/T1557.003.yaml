  - Zeek dhcp.log
  - Windows Event ID 1042
  - 'NAI: Endpoint subnets, Core network switch SPAN/TAP ports'
  range: Last 30 days
  queries:
  - technology: Zeek/SIEM rule pseudocode
    query: '// Detect multi-offer transactions (Symbolic Logic)

      FROM zeek_dhcp.log JOIN windows_event(id=1042)

      GROUP BY trans_id WITHIN 2s

      ALERT when distinct server_identifier count > 1

      // the second/unexpected server-identifier is the prime rogue suspect'
