    Per RFC 2131 a transaction should be answered by a single authorized server with approved option values.
    This Symbolic Logic approach works as follows: Alert on any server-role message (OFFER/ACK/Advertise/Reply)
    observed on an untrusted access port or from a MAC/port not bound as the authorized DHCP server, the
    deterministic DHCPv6-Shield / SAVI control ([RFC 7610](https://www.rfc-editor.org/rfc/rfc7610.txt);
    [RFC 7513](https://www.rfc-editor.org/rfc/rfc7513.txt)). A positive result is a strong indicator of
    rogue-DHCP/AiTM activity -- pivot to the offending server IP/MAC/port, the affected client subnet,
    the assigned DNS/gateway values, and any downstream cleartext-credential, DNS-redirection, or traffic-reroute
    behavior. A negative result helps rule out this specific vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy or low-and-slow spoofing.'
  answer_sources:
  - Zeek dhcp.log
  - Windows Event ID 1042
  - 'NAI: Network segments containing client endpoints, Core network switch SPAN/TAP ports, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM rule pseudocode
    query: "// Enforce L2 trusted-port floor (DHCPv6-Shield / SAVI)\nFROM dhcp_server_role_messages (OFFER/ACK/Advertise/Reply)\n\
      WHERE ingress_port NOT IN trusted_dhcp_ports\n   OR (src_mac, src_port) NOT bound_as authorized_dhcp_server\n\
      ALERT"
- question: '[Credential Access] Spot rare DNS/gateway assignments: Can you determine, using the "Spot
    rare DNS/gateway assignments" (Statistical Method) approach, whether a DHCP Offer/ACK assigns a client
    a DNS (option 6) or gateway (option 3) IP that is TI-listed or not in the site''s approved resolver/gateway
    set, with Zeek dhcp.log and Windows lease/event telemetry showing the rogue server handed out the
