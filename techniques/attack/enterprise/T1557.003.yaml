    6) or gateway (option 3) IP that is TI-listed or not in the site''s approved resolver/gateway set,
    with Zeek dhcp.log and Windows lease/event telemetry showing the rogue server handed out the configuration.
    Per RFC 2131 a transaction should be answered by a single authorized server with approved option values.
    This Statistical Method approach works as follows: Flag assignments whose DNS/gateway IP falls below
    the subnet''s 1st percentile historical frequency (most clients receive the same one or two values);
    score newly-resolved domains the redirected resolver returns with EXPOSURE prevalence/TTL features
    ([EXPOSURE](https://sites.cs.ucsb.edu/~chris/research/doc/tissec14_exposure.pdf)). Reference Windows
    1042 entries for corroboration. A positive result is a strong indicator of rogue-DHCP/AiTM activity
    -- pivot to the offending server IP/MAC/port, the affected client subnet, the assigned DNS/gateway
    values, and any downstream cleartext-credential, DNS-redirection, or traffic-reroute behavior. A negative
    result helps rule out this specific vector but should be corroborated with the other questions in
    this playbook, since a single method can miss stealthy or low-and-slow spoofing.'
  answer_sources:
  - Zeek dhcp.log
  - Windows Event ID 1042
  - 'NAI: Network segments containing client endpoints, Core network switch SPAN/TAP ports, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Spot rare DNS/gateway assignments (Statistical Method)

      baseline = freq_distribution(assigned_dns, assigned_gw) by subnet over history

      ALERT when an assigned DNS/gateway value falls below the subnet 1st-percentile frequency

      // score newly-resolved domains from the redirected resolver with EXPOSURE prevalence/TTL features

      // corroborate with Windows Event ID 1042'
