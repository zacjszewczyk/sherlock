name: 'T1557.003: DHCP Spoofing'
id: 369d602c-859a-4afc-a1bc-27de1545ed51
description: 'This playbook helps an analyst investigate DHCP Spoofing (T1557.003), in which an adversary
  stands up a rogue DHCP server on the victim network to hand legitimate clients malicious network configuration
  -- most commonly attacker-controlled DNS (option 6) and default gateway (option 3) values -- in order
  to seize an Adversary-in-the-Middle (AiTM) position. From that vantage the actor can sniff and collect
  client communications, harvest credentials passed over insecure cleartext protocols (HTTP/FTP/SMB/NTLM),
  redirect DNS to attacker resolvers, and reroute traffic through attacker choke points; the same primitive
  can also be abused for DHCP starvation/exhaustion to knock out the authoritative server before inserting
  the rogue one. It spans Credential Access (detecting the rogue lease and L2/allow-list violations) and
  Collection (detecting the downstream payoff: cleartext credential capture, traffic rerouting, and DNS
  redirection). The hunt correlates Zeek dhcp/conn/dns/http/smb/ntlm/ftp logs, NetFlow/IPFIX, router/firewall
  logs, Windows DHCP-server events (1042, 1020, 1063, 1341, 1342) and Security events (4624, 4688, 5156),
  Linux syslog/dhclient, and macOS unified logs. Methods combine symbolic-logic rules (allow-list and
  trusted-port enforcement, multi-offer race detection, unauthorized next-hop and cleartext-credential
  detection), statistical baselining (rare DNS/gateway values, Seasonal-Hybrid ESD on offer/DISCOVER rates,
  percentile outliers, EXPOSURE/n-gram DNS scoring), and machine learning (Random Forest transaction scoring,
  DBSCAN/one-class novelty detection, autoencoders, graph community detection, and Prophet/ARIMA pool-exhaustion
  forecasting) so an analyst can confirm a rogue DHCP server and its AiTM consequences across endpoint,
  network, and infrastructure telemetry.'
type: technique
