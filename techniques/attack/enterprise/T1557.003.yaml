      \ JOIN windows_event(id=1042)\nWHERE msg_type IN (\"OFFER\",\"ACK\")\n  AND (server_ip, server_mac,\
      \ option54_server_identifier) NOT IN vlan_allowlist[vlan]\nALERT"
