questions:
- question: '[Credential Access] Correlate malicious DHCP assignments: Can you determine, using the "Correlate
    malicious DHCP assignments" (Symbolic Logic) approach, whether a DHCP Offer/ACK assigns a client a
    DNS (option 6) or gateway (option 3) IP that is TI-listed or not in the site''s approved resolver/gateway
    set, with Zeek dhcp.log and Windows lease/event telemetry showing the rogue server handed out the
    configuration. Per RFC 2131 a transaction should be answered by a single authorized server with approved
    option values.'
  context: 'Why this matters under the Credential Access tactic (TA0006): DHCP Spoofing places an attacker
    as a rogue DHCP server to hand clients malicious DNS/gateway configuration and seize an Adversary-in-the-Middle
    position. This evidence focuses on the condition that a DHCP Offer/ACK assigns a client a DNS (option
    6) or gateway (option 3) IP that is TI-listed or not in the site''s approved resolver/gateway set,
    with Zeek dhcp.log and Windows lease/event telemetry showing the rogue server handed out the configuration.
    Per RFC 2131 a transaction should be answered by a single authorized server with approved option values.
    This Symbolic Logic approach works as follows: Alert when Zeek dhcp.log Offer/Ack option-6 (DNS) or
    option-3 (router) values and Windows Event ID 1042 match TI-listed IPs OR fall outside the approved
    gateway/DNS allow-list defined by site policy ([RFC 2131](https://www.rfc-editor.org/rfc/rfc2131.txt)).
    Treat a DHCPv6 Reply/Advertise option-23 DNS from a non-approved DUID identically ([RFC 8415](https://www.rfc-editor.org/rfc/rfc8415.txt)).
    A positive result is a strong indicator of rogue-DHCP/AiTM activity -- pivot to the offending server
    IP/MAC/port, the affected client subnet, the assigned DNS/gateway values, and any downstream cleartext-credential,
    DNS-redirection, or traffic-reroute behavior. A negative result helps rule out this specific vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy or low-and-slow spoofing.'
  answer_sources:
  - Zeek dhcp.log
  - Windows Event ID 1042
  - 'NAI: Network segments containing client endpoints, Core network switch SPAN/TAP ports, DNS resolvers'
  range: Last 90 days
  queries:
  - technology: Zeek/SIEM rule pseudocode
    query: "// Correlate malicious DHCP assignments (Symbolic Logic)\nFROM zeek_dhcp.log JOIN windows_event(id=1042)\n\
      WHERE msg_type IN (\"OFFER\",\"ACK\")\n  AND ( option6_dns IN TI_list OR option3_router IN TI_list\n\
      \        OR option6_dns NOT IN approved_dns_allowlist\n        OR option3_router NOT IN approved_gateway_allowlist\
      \ )\n// also treat DHCPv6 Reply/Advertise option-23 DNS from a non-approved DUID identically\nALERT\
      \ with server_ip, server_mac, client_subnet, assigned_dns, assigned_gw"
- question: '[Credential Access] Enforce L2 trusted-port floor: Can you determine, using the "Enforce
    L2 trusted-port floor" (Symbolic Logic) approach, whether a DHCP Offer/ACK assigns a client a DNS
    (option 6) or gateway (option 3) IP that is TI-listed or not in the site''s approved resolver/gateway
    set, with Zeek dhcp.log and Windows lease/event telemetry showing the rogue server handed out the
