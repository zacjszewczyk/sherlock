name: 'T1059.004: Unix Shell'
id: 7f487585-a791-475c-af58-32a12b48e917
description: 'Investigate whether an adversary is abusing Unix shell environments (sh, bash, zsh, ash,
  BusyBox) to execute commands, scripts, and payloads across Linux, macOS, ESXi, network devices, and
  Windows hosts running the Windows Subsystem for Linux (WSL). Unix shells can control every aspect of
  a system and are commonly reached through interactive SSH sessions during initial access or lateral
  movement, embedded inside secondary interpreters, or dropped as persistence. This playbook helps an
  analyst hunt the full shell-abuse chain: high-risk or geographically anomalous interactive SSH logins
  that lead to command-and-control (C2) egress, scanning, or beaconing; brute-force precursors and rejected-connection
  failure-mode signals; ''curl|bash'' and ''wget|sh'' download-and-execute pipelines on both native Unix
  and WSL; shells spawned by unexpected parents (Office applications, browsers, PDF readers, web/app services);
  anomalous post-login traffic volume, port, and entropy deviations; periodic beaconing; provenance-graph
  and syscall-sequence anomalies of injected shells; and new or modified scripts in known Unix persistence
  locations (cron, systemd, rc.local, profile.d, dotfiles). Each question pairs deterministic symbolic-logic
  detection with statistical baselining and machine-learning approaches so that successful, evasive, and
  failed shell-execution attempts are all surfaced. Focus collection on DMZ and internal Linux/Unix servers,
  SSH jump boxes, VPN concentrators, ESXi hosts, network appliances, developer/CI-CD systems, and crown-jewel
  asset subnets.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
