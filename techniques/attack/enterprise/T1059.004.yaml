questions:
- question: Did a successful interactive SSH login from a high-risk source (non-corporate, uncategorized
    ASN, or known-malicious IP) get followed within five minutes by outbound connections from that same
    host to known C2 infrastructure?
  context: 'In the Execution tactic, an adversary who reaches a Unix shell over SSH frequently has the
    shell immediately call home to its C2 channel. Correlating successful Zeek ssh.log logins with conn/dns/http
    sessions in a tight five-minute window, and matching the destination IP or domain against C2 threat
    intelligence, catches the moment an interactive shell pivots from access to control. A positive result
    is a fresh SSH session whose host then egresses to a TI-listed destination, especially where the interactive
    shell child performs the immediate network activity; a negative result helps rule out remote-shell-driven
    C2 on that asset. Pivot on source IP, user, and destination to scope the intrusion. Authoritative
    references for this detection: [Atomic Red Team T1059.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.004/T1059.004.md);
    [MITRE ATT&CK T1059.004](https://attack.mitre.org/techniques/T1059/004/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: DMZ Web Servers, Internal Linux Application Servers, SSH Jump Boxes, VPN Concentrators, Crown
    Jewel Asset Subnets, Network Egress Points'
  range: Last 90 days; correlate SSH login and egress within a 5-minute window
  queries:
  - technology: Zeek/pseudocode
    query: 'success = ssh.log where auth_success=true

      join conn.log/http.log/dns.log on src_host where ts within +5m of login

      where dest_ip in TI_C2 or query/host in TI_C2_domains

      emit alert(src_ip, user, dest, delta_seconds, interactive=true)'
- question: Was a successful interactive SSH login preceded by a brute-force burst (more than 20 failed
    authentications in five minutes from the source) or followed by a spike in rejected/blocked connections
    (Zeek S0/REJ states) or NXDOMAIN responses?
  context: 'Failure modes are themselves signal during Execution. A successful login that follows a brute-force
    burst suggests credential guessing succeeded; a successful login followed by a surge of S0/REJ connection
    attempts or NXDOMAIN replies indicates the shell is scanning or attempting C2 resolution that is being
    blocked. Treating these failure precursors and aftermaths as distinct detections (per the Sandfly
    BPFDoor analysis) catches shell-driven scanning and C2 even when the C2 endpoint itself is unknown.
    A positive result is an authentication anomaly bracketing a successful login; investigate the user,
    source ASN, and the targets of the rejected attempts. Authoritative references for this detection:
    [Sandfly BPFDoor analysis](https://www.sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis/).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: DMZ Web Servers, Internal Linux Application Servers, SSH Jump Boxes, VPN Concentrators, Crown
    Jewel Asset Subnets, Network Egress Points'
  range: Last 90 days; evaluate ±15 minutes around each successful login
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for each successful_ssh_login(src, host, t0):\n  fails = count(auth.log failures from src\
      \ in [t0-5m, t0])\n  rejspike = ratio(conn.log state in (S0,REJ) for host in [t0, t0+15m])\n  nx\
      \ = count(dns.log rcode=NXDOMAIN for host in [t0, t0+15m])\n  if fails > 20 or rejspike > baseline_p95\
      \ or nx > baseline_p95: alert(host, src, fails, rejspike, nx)"
- question: After an SSH login, did the host's outbound traffic deviate from its own baseline, for example
    a one-hour session count above the 95th percentile, outbound volume above the per-host 99th percentile,
    or a destination-IP entropy spike greater than three standard deviations?
  context: 'Statistical per-entity baselining (Maxion and Townsend) separates routine administration from
    shell-driven abuse without relying on known-bad indicators. By learning each host''s normal outbound
    bytes/min, set of destination ports, and destination-IP entropy, an analyst can flag post-login sessions
    where volume, breadth, or randomness of destinations jumps sharply, consistent with bulk transfer,
    scanning, or C2 fan-out from an interactive shell. A positive result is a login followed by traffic
    that breaks the host''s own envelope; a negative result confirms the session stayed within normal
    bounds. Tune thresholds per asset class to control false positives on busy servers. Authoritative
    references for this detection: [Maxion and Townsend per-entity baselining](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: DMZ Web Servers, Internal Linux Application Servers, SSH Jump Boxes, VPN Concentrators, Crown
    Jewel Asset Subnets, Network Egress Points'
  range: Last 90 days for baselining; score the hour after each login
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per host: out_bytes_per_min, dport_set, dst_ip_entropy over 30d\nfor each post_login_window(host,\
      \ [t0, t0+1h]):\n  sess = count(conn.log sessions)\n  vol = sum(orig_bytes+resp_bytes)\n  ent =\
      \ shannon_entropy(distinct dst_ip)\n  if sess > p95(host) or vol > p99(host) or ent > mean+3*std:\
      \ alert(host, sess, vol, ent)"
- question: Do post-login source-destination connection pairs show periodic beaconing, that is low connection-interval
    dispersion and consistent byte sizes indicative of automated C2 check-ins?
  context: 'An interactive shell that installs or starts an implant produces regular, machine-timed callbacks.
    Applying FFT/regularity scoring (RITA, BAYWATCH) to connection start times and payload sizes for each
    source-destination pair after a login reveals strong periodicity that is robust to jitter, distinguishing
    C2 beacons from human-driven or bursty traffic. A positive result is a high regularity score with
    tight byte-size clustering toward a single destination following a suspicious login; a negative result
    lowers suspicion of installed C2. Correlate with the login source and any TI hits to prioritize. Authoritative
    references for this detection: [RITA](https://github.com/activecm/rita); [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: DMZ Web Servers, Internal Linux Application Servers, SSH Jump Boxes, VPN Concentrators, Crown
    Jewel Asset Subnets, Network Egress Points'
  range: Last 90 days; analyze 24+ hours of connections per pair after login
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each (src,dst) after login:\n  intervals = diff(sorted(conn.log ts))\n  score = fft_regularity(intervals)\
      \ // low dispersion -> high score\n  size_consistency = 1 - cv(orig_bytes)\n  if score > thresh\
      \ and size_consistency > thresh: alert(src, dst, period, score)"
- question: Does a host's post-login outbound data volume exceed the forecasted 99% prediction interval
    for more than ten minutes, and does the sshd -> shell -> network provenance chain rank as anomalous?
  context: 'Forecasting models (ARIMA/Prophet) trained per host on outbound volume per minute detect sustained
    egress anomalies that fixed thresholds miss, while provenance-graph scoring (KAIROS, ProvDetector)
    confirms the causal path from sshd to an interactive shell to network egress. Combining the two flags
    exfiltration or staging that follows a rogue shell session and explains why: the alert should surface
    the top-3 contributing features or graph edges (rare parent, rare destination, volume z-score). A
    positive result is sustained over-forecast egress tied to a rare sshd->shell->network chain; emit
    the contributing features for analyst triage. This guards against both novel C2 and bulk data theft
    in the Execution-to-exfil transition. Authoritative references for this detection: [KAIROS](https://tfjmp.org/publications/2024-sp.pdf);
    [ProvDetector](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Zeek conn.log
  - Zeek ssh.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: DMZ Web Servers, Internal Linux Application Servers, SSH Jump Boxes, VPN Concentrators, Crown
    Jewel Asset Subnets, Network Egress Points'
  range: Last 90 days for model training; score in near real time
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = ARIMA_or_Prophet(host.out_bytes_per_min, train=90d)\nif observed > model.predict_interval(0.99)\
      \ for > 10 consecutive minutes:\n  g = provenance_graph(sshd -> shell -> network)\n  score, top_edges\
      \ = anomaly_score(g)\n  if score high: alert(host, top3_features=top_edges)"
- question: Was a Unix shell process (wsl.exe, bash.exe, or native sh/bash/zsh) executed with command-line
    arguments matching download-and-execute pipelines such as 'curl ... | bash', 'wget ... | sh', 'bash
    -c ...base64', or a download into /tmp or /dev/shm followed by 'sh -c'?
  context: 'On Windows hosts with WSL, adversaries reach Unix shells via wsl.exe/bash.exe and use the
    same curl|bash idioms seen on native Linux to fetch and run remote payloads in one step. Regex scanning
    of command lines (mirroring the SigmaHQ curl/wget download-and-execute rule and Atomic Red Team T1059.004)
    catches this Execution behavior deterministically. A positive result is a shell command line containing
    a network-fetch piped directly into an interpreter or a staged drop into a world-writable directory;
    a negative result reduces concern about one-line droppers on that host. Capture CommandLine, ParentImage,
    and User for pivoting. Authoritative references for this detection: [SigmaHQ curl/wget download-and-execute
    rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_curl_wget_exec_tmp.yml);
    [Atomic Red Team T1059.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.004/T1059.004.md).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Developer Workstations, Administrator Workstations, Windows Servers with WSL enabled, Build
    and CI/CD Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (EventCode=4688, Sysmon EventCode=1)\nimg=lower(Image); cmd=lower(CommandLine)\n\
      where img matches '(wsl|bash|sh|zsh)\\.exe' or img endswith '/bash','/sh','/zsh'\nand ( cmd matches\
      \ 'curl .* \\| *(ba)?sh' or cmd matches 'wget .* \\| *sh'\n      or cmd matches 'bash -c .*base64'\n\
      \      or cmd matches '(/tmp/|/dev/shm/).* ; *sh -c' )\nemit alert(host, User, ParentImage, CommandLine)"
- question: Do wsl/bash shell command lines show outliers in command length, token entropy, or per-user
    command frequency exceeding the 98th percentile of historical baselines?
  context: 'Obfuscated or encoded one-liners and unusually long commands stand out statistically even
    when they evade signatures. Building explainable per-user profiles (Maxion and Townsend) of command
    length, token entropy, and command frequency lets an analyst flag shell invocations that break a user''s
    normal pattern, surfacing novel droppers and encoded payloads in the Execution tactic. A positive
    result is a shell command far outside a user''s distribution (long, high-entropy, or rare); a negative
    result indicates routine usage. Keep per-user baselines so a developer''s normal heavy CLI use does
    not mask an attacker on an admin''s account. Authoritative references for this detection: [Maxion
    and Townsend](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Developer Workstations, Administrator Workstations, Windows Servers with WSL enabled, Build
    and CI/CD Servers'
  range: Last 90 days for baselines; score new commands continuously
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user: cmd_len, token_entropy, cmd_freq over 90d\nfor each shell_proc(user, cmd):\n\
      \  if len(cmd) > p98(user.cmd_len) or entropy(cmd) > p98(user.token_entropy)\n     or rarity(cmd,\
      \ user) > p98: alert(user, cmd, metrics)"
- question: When classified by a token/n-gram and embedding model, do any wsl/bash command lines score
    as likely malicious based on features such as length, argument count, embedded URLs/IPs, and decode/exec
    keywords?
  context: 'A supervised, active-learning classifier (LOLAL; DistilBERT shell-session anomaly detection)
    generalizes beyond brittle regex by learning token, n-gram, and embedding features that characterize
    malicious shell usage, then flagging high-scoring command lines and surfacing the top-3 influential
    tokens for explainability. This catches obfuscated or previously unseen Execution attempts on WSL-enabled
    Windows hosts. A positive result is a high-confidence malicious score with interpretable contributing
    tokens (e.g., a base64 blob, a raw IP, an ''eval''/''exec'' keyword); a negative result keeps the
    command in the benign set. Feed analyst dispositions back into the model to keep it current. Authoritative
    references for this detection: [LOLAL active-learning LOLBin detection](https://arxiv.org/abs/2111.15039);
    [DistilBERT shell-session anomaly detection](https://arxiv.org/abs/2310.13247).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Developer Workstations, Administrator Workstations, Windows Servers with WSL enabled, Build
    and CI/CD Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = tokenize(cmd) + ngrams + embeddings + [len, argc, has_url, has_ip, decode_exec_kw]

      score, top_tokens = model.predict(features)

      if score > threshold: alert(host, user, cmd, top3_tokens=top_tokens)'
- question: Was a Unix shell (e.g., bash.exe/wsl.exe) spawned by a parent process that does not normally
    launch shells, such as a Microsoft Office application (WINWORD.EXE), a browser (chrome.exe), or a
    PDF reader (AcroRd32.exe)?
  context: 'Shells launched by Office apps, browsers, or document readers are a classic sign of exploitation
    or malicious-macro Execution. Maintaining an allowlist of legitimate shell/WSL parent-child relationships
    (explorer.exe->wsl.exe, sshd->bash) and alerting on off-list parents catches this. Process-tree invariants
    from the Sandfly BPFDoor analysis (argv[0] vs /proc/pid/exe mismatch, deleted-binary execution, re-parented
    orphan shells) strengthen the detection. A positive result is a shell child under a document/browser
    parent or a violated process-tree invariant; a negative result confirms expected parentage. Capture
    ParentImage, Image, CommandLine, and integrity level. Authoritative references for this detection:
    [Sandfly BPFDoor analysis](https://www.sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis/).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations (Windows), Virtual Desktop Infrastructure (VDI), Microsoft Office and Web
    Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'source IN (EventCode=4688, Sysmon EventCode=1)

      child=lower(Image); parent=lower(ParentImage)

      where child matches ''(bash|wsl|sh|zsh)\.exe'' or child endswith ''/bash'',''/sh''

      and (parent, child) NOT in allowlist

      or argv0 != /proc/pid/exe or image_deleted or reparented_orphan

      emit alert(host, ParentImage, Image, CommandLine)'
- question: Over a 30-day window, does a shell's parent-child relationship fall into the bottom 1% of
    observed frequencies, that is a rare conditional probability P(parent | shell)?
  context: 'Even without a curated allowlist, statistical scoring of parent-child frequencies (Maxion
    and Townsend) surfaces unusual ancestry for shells. Computing P(parent|shell) across the environment
    and flagging the bottom 1% catches shells launched by uncommon parents that an allowlist might miss,
    an important Execution signal for exploitation and lateral tooling. A positive result is a shell with
    a statistically rare parent; a negative result indicates common, expected parentage. Combine with
    asset class so a rare-but-legitimate parent on a build server is weighted appropriately. Authoritative
    references for this detection: [Maxion and Townsend per-entity baselining](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations (Windows), Virtual Desktop Infrastructure (VDI), Microsoft Office and Web
    Servers, Terminal Servers'
  range: Last 90 days; baseline over rolling 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'freq[parent,shell] = count over 30d

      P(parent|shell) = freq[parent,shell] / sum_over_parents(freq[*,shell])

      for each shell_proc: if P(parent|shell) <= p01: alert(host, parent, shell, prob)'
- question: Do the system-call sequences of spawned shells deviate from the learned normal short n-gram
    profile for that program, distinguishing benign admin shells from injected or payload shells?
  context: 'Injected or payload-bearing shells behave differently at the syscall level than interactive
    admin shells. Building per-program short system-call n-gram profiles of normal ''self'' (Forrest et
    al. ''A Sense of Self''; Warrender et al. HMM syscall models) and flagging deviations detects shells
    whose runtime behavior departs from baseline even when the binary and parent look normal. A positive
    result is a shell whose syscall sequence diverges from its learned profile; a negative result indicates
    behavior consistent with normal shells. This is most valuable on critical hosts with auditd/syscall
    telemetry. Authoritative references for this detection: [Forrest et al. A Sense of Self](https://www.cs.unm.edu/~forrest/publications/ieee-sp-96-unix.pdf);
    [Warrender et al. HMM syscall models](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations (Windows), Virtual Desktop Infrastructure (VDI), Microsoft Office and Web
    Servers, Terminal Servers'
  range: Last 90 days for profile training; score per process execution
  queries:
  - technology: SIEM/ML pseudocode
    query: "profile[prog] = set of normal short syscall n-grams (auditd execve+syscalls)\nfor each shell\
      \ exec:\n  seq = syscall_ngrams(pid)\n  anomaly = fraction(seq not in profile[prog]) // or HMM log-likelihood\n\
      \  if anomaly > threshold: alert(host, pid, prog, anomaly)"
- question: When execution provenance is modeled as a graph, do any shell spawns form isolated or rare
    execution chains, and what are the top-3 contributing nodes/edges (anomalous parent, rare child, rare
    destination)?
  context: 'Provenance-graph learning (ThreaTrace node-level GNN; KAIROS) scores nodes and edges to localize
    rare or isolated execution chains that represent suspicious shell spawns, then reports the top-3 contributing
    elements for triage. This catches multi-step Execution chains (exploit -> shell -> follow-on action)
    that look individually benign but are collectively anomalous. A positive result is a low-prevalence
    subgraph centered on a shell spawn with interpretable contributing nodes/edges; a negative result
    indicates the chain matches common, benign patterns. Use the surfaced nodes/edges to scope and pivot
    the investigation. Authoritative references for this detection: [ThreaTrace node-level GNN](https://arxiv.org/pdf/2111.04333);
    [KAIROS](https://tfjmp.org/publications/2024-sp.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: User Workstations (Windows), Virtual Desktop Infrastructure (VDI), Microsoft Office and Web
    Servers, Terminal Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: "g = build_provenance_graph(process_creation events)\nfor each node n where n.image is a shell:\n\
      \  score, contributors = gnn_anomaly(n, g) // node/edge level\n  if score > threshold: alert(host,\
      \ n, top3=contributors)"
- question: Did an interactive SSH login originate from a GeoIP location outside the organization's footprint
    or from an unapproved IP, and was it followed by dynamic DNS lookups or a netcat/perl/python/bash
    reverse-shell pattern (e.g., nc -e/-c plus a shell token, including $IFS evasion)?
  context: 'Enriching SSH logins with GeoIP/IP-reputation context and watching for reverse-shell command
    patterns (SigmaHQ netcat reverse-shell rule) catches the Execution moment when an out-of-footprint
    login establishes an interactive backchannel. Dynamic DNS lookups after such a login often precede
    C2 rendezvous. A positive result is a foreign/unapproved SSH login chained to a dynamic-DNS query
    or a reverse-shell invocation (including obfuscated forms using $IFS); a negative result reduces concern
    about reverse-shell C2 from that session. Pivot on source GeoIP/ASN, user, and the reverse-shell destination.
    Authoritative references for this detection: [SigmaHQ netcat reverse-shell rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_netcat_reverse_shell.yml);
    [MITRE ATT&CK T1059.004](https://attack.mitre.org/techniques/T1059/004/).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical Linux/Unix Servers (e.g., database, application), Network Egress Points, Authentication
    Servers, Internal Network Segments'
  range: Last 90 days; correlate within minutes of each login
  queries:
  - technology: Zeek/pseudocode
    query: "login = ssh.log auth_success=true enriched with geoip(src), ip_reputation(src)\nif geoip(src)\
      \ not in org_footprint or src not in approved_ips:\n  if dns.log within +5m has dynamic_dns(domain)\n\
      \     or proc shows 'nc -e|-c <shell>' (account for $IFS/escaping):\n       alert(host, src, geo,\
      \ indicator)"
- question: Did an SSH login occur outside the user's baseline login hours (±3σ) or from a new ASN, coinciding
    with a spike in rejected connections (S0/REJ) or a fan-out to many hosts on a single port?
  context: 'Per-user baselining of login hours and ASNs (Maxion and Townsend) plus connection failure-mode
    and fan-out analysis (BAYWATCH) detects rogue interactive sessions that lead to scanning. A login
    at an unusual hour or from a never-seen ASN that coincides with many blocked/rejected connections
    or one-port fan-out indicates shell-driven reconnaissance in the Execution-to-discovery transition.
    A positive result is a temporally/geographically anomalous login bracketing a scan signature; a negative
    result indicates normal login behavior. Confirm with the scanned subnet and destination port. Authoritative
    references for this detection: [Maxion and Townsend](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf);
    [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical Linux/Unix Servers (e.g., database, application), Network Egress Points, Authentication
    Servers, Internal Network Segments'
  range: Last 90 days for baselines; evaluate per login and the following hour
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline per user: login_hour_dist, known_ASNs\nfor each ssh_login(user, src, t0):\n  if hour(t0)\
      \ outside mean±3σ or asn(src) new:\n    rej = ratio(conn.log S0/REJ for host in [t0,t0+1h])\n  \
      \  fanout = max_count(distinct dst on same port)\n    if rej > p95 or fanout > thresh: alert(user,\
      \ src, rej, fanout)"
- question: After an anomalous login, do connection start times for any source-destination pair show a
    strong periodic FFT/regularity peak with consistent byte sizes, indicating beaconing?
  context: 'FFT/regularity scoring (RITA, BAYWATCH) of post-login connection timing flags automated beaconing
    that follows a suspicious interactive session, even when the destination is unknown. Consistent inter-arrival
    intervals plus uniform byte sizes toward a single host signal an installed C2 beacon during Execution.
    A positive result is a high regularity score with tight byte-size clustering after an anomalous login;
    a negative result lowers suspicion of installed C2. Correlate the beacon destination with TI and the
    originating login. Authoritative references for this detection: [RITA](https://github.com/activecm/rita);
    [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical Linux/Unix Servers (e.g., database, application), Network Egress Points, Authentication
    Servers, Internal Network Segments'
  range: Last 90 days; analyze 24+ hours of connections after the login
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each (src,dst) after anomalous_login:\n  intervals = diff(sorted(conn.log ts))\n  reg\
      \ = fft_regularity(intervals)\n  size_consistency = 1 - cv(orig_bytes)\n  if reg > thresh and size_consistency\
      \ > thresh: alert(src, dst, period, reg)"
- question: Do post-login command or log sequences deviate from learned normal templates in a way consistent
    with a discovery-then-C2 chain, and which specific commands/tokens are anomalous?
  context: 'Sequence models (DeepLog LSTM; DistilBERT shell-session anomaly detection) learn normal post-login
    command/log template sequences and flag deviations such as a discovery-then-C2 progression, emitting
    the specific anomalous commands/tokens for explainability. This catches multi-step shell behavior
    in the Execution tactic that no single command would reveal. A positive result is a low-probability
    sequence with identifiable anomalous steps; a negative result indicates the session followed normal
    operational patterns. Use the emitted tokens to drive host-level investigation. Authoritative references
    for this detection: [DeepLog](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [DistilBERT shell-session
    anomaly detection](https://arxiv.org/abs/2310.13247).'
  answer_sources:
  - Zeek ssh.log
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Critical Linux/Unix Servers (e.g., database, application), Network Egress Points, Authentication
    Servers, Internal Network Segments'
  range: Last 90 days for training; score sessions continuously
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = template_sequence(post_login commands/log keys)

      p, anomalous_steps = deeplog_or_transformer.predict_next(seq)

      if p(observed) < threshold: alert(host, session, anomalous_commands=anomalous_steps)'
- question: Did a host issue an HTTP request with a 'curl' or 'wget' user agent that downloaded a small
    text/x-sh file, then connect to a threat-intel-listed destination within 60 seconds (or stage the
    file in /tmp or /dev/shm and execute via 'sh -c')?
  context: 'Network-side detection of the curl-pipe-shell pattern correlates Zeek http.log requests (curl/wget
    user agents) with files.log MIME types (text/plain, application/x-sh) and subsequent egress, mirroring
    the SigmaHQ curl/wget download-and-execute rule and Atomic Red Team T1059.004. This catches Execution-stage
    payload fetch-and-run even when host telemetry is absent. A positive result is a small script download
    followed immediately by C2-bound traffic or staged execution; a negative result reduces concern about
    network droppers on that segment. Pivot on the downloading host, the source URL, and the follow-on
    destination. Authoritative references for this detection: [SigmaHQ curl/wget download-and-execute
    rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_curl_wget_exec_tmp.yml);
    [Atomic Red Team T1059.004](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.004/T1059.004.md).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments containing Linux/Unix systems, Developer and
    DevOps Subnets, Cloud VPC Flow Logs'
  range: Last 90 days; correlate download and follow-on within 60 seconds
  queries:
  - technology: Zeek/pseudocode
    query: "req = http.log where user_agent matches '(curl|wget)'\nfile = files.log join req where mime\
      \ in ('text/plain','application/x-sh') and small\nif conn.log from same host to TI_dest within +60s\n\
      \   or file staged in (/tmp,/dev/shm) then 'sh -c':\n     alert(host, url, dest, mime, bytes)"
- question: Is the time delta between an HTTP download and the subsequent outbound connection in the bottom
    1st percentile, with a small-script download size, a raw-IP Host header, or a preceding NXDOMAIN/404
    burst?
  context: 'Statistical timing and failure-mode analysis (Maxion and Townsend) flags curl-pipe-shell behavior
    without signatures. An unusually short gap between download and next outbound connection, a download
    size matching a small-script profile, a raw IP in the Host header, or a download that follows an NXDOMAIN/404
    burst (a failure-mode precursor) each indicate automated fetch-and-execute during Execution. A positive
    result is a download-then-egress with anomalously tight timing or these supporting signals; a negative
    result indicates human-paced or benign downloads. Baseline the delta per host to account for legitimate
    automation. Authoritative references for this detection: [Maxion and Townsend](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments containing Linux/Unix systems, Developer and
    DevOps Subnets, Cloud VPC Flow Logs'
  range: Last 90 days for baselines; evaluate each download event
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for each download(host, t_dl):\n  delta = t_next_outbound - t_dl\n  if delta <= p01(host.delta)\
      \ and size in small_script_range\n     and (host_header is raw_ip or preceded_by NXDOMAIN/404 burst):\n\
      \       alert(host, delta, size, signals)"
- question: Does a learned sequence model detect the DNS query -> HTTP GET -> small-script response ->
    outbound connection chain, and what are the top-3 rarest path elements?
  context: 'An HMM or rare-causal-path provenance model (Warrender et al. HMM syscall models; ProvDetector
    rare causal paths) trained on the DNS->HTTP->script->egress sequence detects the curl-pipe-shell exfil/execution
    chain as a whole and ranks the top-3 rarest path elements for triage. This catches the full network
    kill chain during Execution even when individual steps look ordinary. A positive result is a high-likelihood
    match to the malicious sequence with rare path elements surfaced; a negative result indicates the
    traffic does not form the chain. Use the rarest elements (domain, URL, destination) to prioritize.
    Authoritative references for this detection: [Warrender et al. HMM syscall models](https://ieeexplore.ieee.org/document/766910);
    [ProvDetector rare causal paths](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek files.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments containing Linux/Unix systems, Developer and
    DevOps Subnets, Cloud VPC Flow Logs'
  range: Last 90 days for training; score continuously
  queries:
  - technology: SIEM/ML pseudocode
    query: "model = HMM_or_provenance(states=[dns_query, http_get, small_script_resp, outbound_conn])\n\
      for each host_sequence:\n  if model.matches(sequence) and likelihood high:\n    alert(host, top3_rarest=rank_rarity(path_elements))"
- question: Was a script file created or modified under a known Unix persistence location (e.g., /etc/cron.d,
    /etc/systemd/system, /etc/profile.d, /etc/profile, /etc/bashrc, ~/.bashrc, ~/.zshrc) without being
    tied to a package manager (yum/apt) or an approved change ticket?
  context: 'Adversaries drop or edit shell scripts in cron, systemd, rc.local, profile.d, and dotfiles
    to persist and re-execute shells. Monitoring Sysmon-for-Linux Event IDs 11 and 1 and auditd PATH writes
    to these locations, and excluding changes attributable to package managers or change tickets (SigmaHQ
    Unix Shell Configuration Modification rule), catches persistence established through shell scripts.
    Although this manifests during Execution, it directly enables re-execution; a positive result is an
    unattributed write to a persistence path; a negative result confirms changes were legitimate. Capture
    the file path, writing process, and user for follow-up. Authoritative references for this detection:
    [SigmaHQ Unix Shell Configuration Modification rule](https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_unix_shell_configuration_modification.yml).'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Sysmon for Linux Event ID 1
  - 'NAI: System-level persistence locations on critical Linux servers (/etc/cron.d, /etc/init.d, /etc/rc.local,
    /etc/systemd/system, /etc/profile.d), User-specific persistence locations (~/.bashrc, ~/.profile,
    /var/spool/cron/)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "source IN (Sysmon-Linux EventCode=11 file_create/modify, EventCode=1 exec, auditd PATH write)\n\
      path in (/etc/cron.d/*, /etc/systemd/system/*, /etc/profile.d/*, /etc/profile,\n         /etc/bashrc,\
      \ ~/.bashrc, ~/.zshrc, /var/spool/cron/*)\nand writing_process not in (yum,apt,dpkg,rpm) and not\
      \ change_ticket(host,t)\nemit alert(host, path, process, user)"
- question: Do newly created scripts have Shannon entropy more than three standard deviations above baseline
    admin scripts, or contain long unbroken/base64 strings indicative of obfuscation?
  context: 'High entropy and long encoded strings distinguish obfuscated malicious scripts from routine
    administrative ones. Computing Shannon entropy for new scripts and comparing to a baseline of legitimate
    admin scripts (Maxion and Townsend), then flagging scores beyond 3σ or long base64/unbroken strings,
    treats obfuscation as a distinct Execution signal. A positive result is a persistence-location script
    whose entropy or string structure breaks from normal; a negative result indicates a plain, readable
    script. Combine with the creation-location and writing-process context to confirm intent. Authoritative
    references for this detection: [Maxion and Townsend baselining](https://www.cs.cmu.edu/~maxion/pubs/MaxionTownsend02.pdf).'
  answer_sources:
  - Sysmon for Linux Event ID 11
  - Sysmon for Linux Event ID 1
  - 'NAI: System-level persistence locations on critical Linux servers (/etc/cron.d, /etc/init.d, /etc/rc.local,
    /etc/systemd/system, /etc/profile.d), User-specific persistence locations (~/.bashrc, ~/.profile,
    /var/spool/cron/)'
  range: Last 90 days for baselines; score each new script
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = entropy distribution of known-good admin scripts\nfor each new_script(file):\n\
      \  H = shannon_entropy(content)\n  if H > mean+3*std or has_long_unbroken_or_base64(content):\n\
      \    alert(host, file, H)"
