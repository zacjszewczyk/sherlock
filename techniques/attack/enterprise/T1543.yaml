    query: ">-\nFOR each new_exe IN vulnerable_service_dirs (Sysmon EID11):\n  d = damerau_levenshtein(new_exe.name,\
      \ intended_binary.name)\nFLAG WHERE d <= 2 AND new_exe.name != intended_binary.name\nEMIT host,\
      \ new_exe, intended_binary, d"
