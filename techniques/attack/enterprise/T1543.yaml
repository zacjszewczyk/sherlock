    Isolation Forest for novel tools and emitting the top-3 contributing features. This captures the structural
    signature of escalation-via-service even for previously unseen tools, while the feature attribution
    explains why a given event was flagged. A high-confidence prediction where a non-admin user spawns
    a SYSTEM service from a user-writable LOLBAS path is a priority escalation lead.
