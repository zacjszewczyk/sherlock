- question: After a SYSTEM service is created, does the service process spawn a child process matching
    credential-dumping, discovery, or lateral-movement signatures within minutes?
  context: Escalation is usually followed by post-exploitation. After a SYSTEM service creation, monitor
    the service process for 5 minutes and alert if it spawns child processes whose names or command lines
    match credential-dumping/discovery signatures, treating services.exe/svchost.exe spawning shells as
    high-fidelity. This temporal correlation links the escalation primitive (a new SYSTEM service) to
    its purpose (dumping LSASS, enumerating the domain, or moving laterally), producing strong, actionable
    detections of active intrusion rather than isolated service noise.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 7045
  - Windows Event ID 4697
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nLET svc = events(EventID IN (7045,4697)) WHERE service_account == LocalSystem\nWATCH children\
      \ OF svc.process FOR 5m (EventID=4688 OR Sysmon=1)\nWHERE child_image|command_line MATCHES (mimikatz,\
      \ lsass_access, whoami, net group, psexec, wmic)\n   OR parent IN (services.exe, svchost.exe) AND\
      \ child IN shells\nEMIT alert(host, service, child, command_line)"
- question: Are the n-gram patterns of child command lines spawned by a new SYSTEM service rare compared
    to the benign baseline?
  context: Compare n-gram frequencies (n=2,3) of child command lines to benign baselines and alert on
    rare sequences (below 1%). Adversary tooling launched from an escalated service tends to produce command-line
    token sequences that are uncommon in normal operations. This statistical, signature-agnostic method
    catches novel post-escalation commands that exact credential-dumping or discovery signatures would
    miss, complementing the deterministic correlation rule above.
