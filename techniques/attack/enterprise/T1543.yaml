name: 'T1543: Create or Modify System Process'
id: 0b21369a-2311-4516-b3d8-975215d7b3fb
description: Investigate whether an adversary is establishing or maintaining persistence, or escalating
  privileges, by creating or modifying system-level processes (Windows services, Linux systemd units /
  init.d scripts / cron, macOS Launch Daemons and Launch Agents, and container init specs). This playbook
  helps an analyst hunt for newly installed or altered services whose binary name, hash, description,
  or signer matches threat intel or escalation tooling; service binaries dropped in user-writable or unusual
  paths or that are unsigned; misspelled / typosquatted service names and high-entropy or LOLBAS-laden
  command lines; service processes (services.exe, svchost.exe, systemd) spawning anomalous children or
  initiating suspicious egress; registry / unit-file edits to ImagePath, ServiceDll, FailureCommand, or
  ExecStart; and privilege-escalation patterns such as LocalSystem services created by non-admin users,
  unquoted-service-path file drops, DACL weakening followed by config edits, and SYSTEM services spawning
  credential-dumping or discovery tooling. It pairs deterministic symbolic-logic detections with statistical
  baselining and machine-learning models across endpoint, network, cloud, and container telemetry.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: When a new system service is installed (Windows EID 7045/4697), a Linux systemd unit is created,
    or a macOS Launch Daemon/Agent plist is written, does the service binary name, file path, description,
    or hash match a known-malicious threat-intel indicator?
  context: 'Persistence via a new service is one of the most common ways adversaries survive reboots and
    credential changes. Join the service-install events (7045/4697) with process-creation events (4688/Sysmon
    1) to recover the binary hash (Sysmon Hashes), the digital signer, and the creating account, then
    compare the service name, file, description, and hash against curated threat-intel IOCs. A match is
    high-fidelity: surface the matched IOC, the ImagePath, and the creator in the alert. Extend the same
    deterministic floor to Linux systemd unit creation and macOS launchd plist writes so cross-platform
    persistence is not missed. A positive result strongly indicates malicious persistence; a negative
    result still leaves room for the behavioral checks below.'
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: Domain Controllers, Application Servers, Critical Workstations, DNS Servers, Linux servers,
    macOS endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nLET svc = events WHERE EventID IN (7045,4697)\nJOIN proc = events WHERE EventID IN (4688)\
      \ OR (Sysmon EventID=1) ON Host, ImagePath/ServiceFileName\nLET ind = svc | proc ENRICH hash, signer,\
      \ creator_account\nWHERE ind.hash IN threat_intel.hashes\n   OR ind.service_name IN threat_intel.names\n\
      \   OR ind.image_path IN threat_intel.paths\n   OR ind.description IN threat_intel.descriptions\n\
      EMIT alert(matched_ioc, image_path, creator_account)"
  - technology: auditd/pseudocode
    query: '>-

      WATCH SYSCALL write|rename PATH IN (/etc/systemd/system/*, /etc/init.d/*)

      OR macos plist write IN (/Library/LaunchDaemons/*, ~/Library/LaunchAgents/*)

      ENRICH file_hash

      WHERE file_hash IN threat_intel.hashes OR exec_target IN threat_intel.paths

      EMIT alert(matched_ioc, unit_path, actor)'
- question: Do newly created service names or descriptions look anomalously dissimilar to the established
    benign baseline of service naming on the fleet?
  context: Adversaries frequently invent plausible-but-novel service names that do not match any legitimate
    product naming convention. Measure string similarity (Jaccard / Levenshtein) between each new service
    name and description and the benign baseline of known-good services, then flag those falling in the
    lowest 5th percentile of similarity. Outliers that bear no resemblance to anything previously seen
    warrant investigation, especially when paired with an unsigned or threat-intel-matched binary. This
    is a statistical complement to exact IOC matching and catches novel persistence that has no prior
    signature.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: Domain Controllers, Application Servers, Critical Workstations, DNS Servers, Linux servers,
    macOS endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nbaseline = DISTINCT service_name, description FROM events(EventID IN (7045,4697)) last\
      \ 90d\nFOR each new_svc:\n  sim = MAX(jaccard(new_svc.name, b.name) for b in baseline)\n  lev =\
      \ MIN(levenshtein(new_svc.name, b.name) for b in baseline)\nFLAG WHERE sim <= percentile(all_sims,\
      \ 5)\nEMIT new_svc.name, sim, host"
- question: Is the rate of new service installations on a host (or coordinated across the fleet) anomalously
    high, and are services failing to start shortly after install?
  context: A burst of new service installs on a single host, or a synchronized rollout across many hosts,
    can indicate scripted persistence or a worming campaign. Count new service installs (EID 7045) per
    host per day and flag with a robust median/MAD modified Z-score >3.5, which resists distortion from
    legitimate batch or package installs. Also run online change-point detection on the fleet-wide install
    series to catch coordinated rollouts. Separately track service-start failures (System 7000/7009/7011/7023
    following a 7045) as a distinct signal of broken or sacrificial persistence, which adversaries often
    leave behind. A positive result is a strong lead toward automated persistence activity.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: Domain Controllers, Application Servers, Critical Workstations, DNS Servers, Linux servers,
    macOS endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      series = COUNT(EventID=7045) BY host, day

      med = median(series); mad = median(|series-med|)

      mz = 0.6745*(series-med)/mad

      FLAG host,day WHERE mz > 3.5

      -- coordinated rollout

      fleet = COUNT(EventID=7045) BY day

      FLAG change_point(fleet)

      -- broken persistence

      JOIN start_fail = events(System EventID IN (7000,7009,7011,7023)) WITHIN 10m OF 7045 BY host EMIT
      alert'
- question: Does a machine-learning classifier score a newly created service as likely malicious based
    on its path, naming entropy, LOLBAS keywords, signer trust, and hash reputation, or does an unsupervised
    model flag it as novel?
  context: Many malicious services share learnable structural traits even when their exact IOCs are unknown.
    Train a Random Forest or gradient-boosted classifier on service features such as path depth, name/path
    Shannon entropy, LOLBAS keyword flags, signer trust, and hash reputation, and alert on high maliciousness
    scores. Pair it with an unsupervised Isolation Forest over the same features to surface novel services
    that the supervised model has never seen. Emit the top-3 contributing features (e.g., unsigned binary,
    temp path, high-entropy name) in the alert so an analyst can triage quickly. This blends signature-agnostic
    ML detection with explainability for persistence hunting.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: Domain Controllers, Application Servers, Critical Workstations, DNS Servers, Linux servers,
    macOS endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      features = [path_depth, name_entropy, path_entropy, lolbas_flag, signer_trust, hash_reputation]

      score = RandomForest.predict_proba(features)

      novelty = IsolationForest.score(features)

      FLAG WHERE score > 0.8 OR novelty anomalous

      EMIT service, score, top3_feature_attribution(features)'
- question: Does a newly created service's file name or its correlated command line contain LOLBAS execution
    patterns, encoded/base64 commands, or invoke an interpreter as the service binary?
  context: Adversaries often register services that run living-off-the-land binaries (rundll32, mshta,
    powershell, cscript) or encoded payloads instead of dropping obviously malicious executables. Apply
    regexes for LOLBAS patterns and encoded/base64 command strings against the Service File Name and the
    correlated 4688/Sysmon 1 command lines whenever a new service appears. Allowlist known-good service
    binaries, and treat any service whose binary is an interpreter or a signed LOLBin as high-priority
    using living-off-the-land parent-child analysis. A match suggests deliberately stealthy persistence
    designed to evade hash-based detection.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nLET svc = events(EventID IN (7045,4697))\nJOIN cmd = events(EventID=4688 OR Sysmon=1)\
      \ ON host, image\nWHERE regex(svc.service_file_name, LOLBAS_PATTERNS)\n   OR regex(cmd.command_line,\
      \ /-enc|FromBase64String|IEX|rundll32|mshta/i)\n   OR basename(svc.service_file_name) IN interpreters\n\
      AND svc.binary NOT IN allowlist\nEMIT alert(host, service, command_line)"
- question: Is the Shannon entropy of a new service's name or binary path anomalously high relative to
    the established baseline?
  context: Randomly generated or packed service names and paths exhibit high Shannon entropy compared
    to legitimate, human-readable service names. Compare the entropy of each new service name and path
    to the baseline distribution and alert when either exceeds the 95th percentile. High-entropy names
    are a hallmark of automated malware that generates pseudo-random identifiers. This statistical check
    is cheap to run and complements the LOLBAS regex detection above for catching obfuscated persistence.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nFOR each new_svc:\n  e_name = shannon_entropy(new_svc.name)\n  e_path = shannon_entropy(new_svc.image_path)\n\
      FLAG WHERE e_name > percentile(baseline_name_entropy, 95)\n        OR e_path > percentile(baseline_path_entropy,\
      \ 95)\nEMIT new_svc, e_name, e_path"
- question: Does the per-host sequence or count of service-control events deviate from the model's expectation,
    such as an unexpected event type or a spike in service-control activity?
  context: Service-control operations normally follow predictable sequences and volumes on a given host.
    Model the per-host service-control event sequence with an LSTM (DeepLog-style) that predicts the next
    expected event and flags deviations, and for raw counts use seasonal forecasting and flag spikes greater
    than 3 standard deviations. Surface the unexpected event keys and the deviation magnitude in the alert.
    A deviation may reveal persistence operations interleaved with normal administration, which static
    rules would miss. This is a behavioral, sequence-aware detection for stealthy service manipulation.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Critical Application Servers, Standard User Endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      seq = ordered_event_keys(service_control_events) BY host

      pred = DeepLog_LSTM.next(seq[:-1])

      FLAG WHERE seq[-1] NOT IN pred.topk

      counts = COUNT(service_control_events) BY host, hour

      forecast = seasonal_model(counts)

      FLAG WHERE counts > forecast + 3*sigma

      EMIT host, unexpected_key, deviation_magnitude'
- question: Is a new system process's service binary located in an uncommon or user-writable directory
    (e.g., C:\Users, C:\ProgramData, C:\Temp, /tmp, /home, /Library/LaunchAgents) or is the binary unsigned/untrusted?
  context: Legitimate services almost always run from protected system directories with trusted signatures.
    Alert when a new service creation uses an ImagePath under disallowed directories (C:\Users, C:\ProgramData,
    C:\Temp, C:\Windows\Temp) or when the binary is unsigned or has an untrusted signer (Sysmon EID 7).
    Apply the same logic to Linux systemd unit ExecStart and macOS plist ProgramArguments that point to
    user-writable paths. A service executing from a user-writable location is a strong persistence indicator
    because it lets a low-privilege actor control code that runs at boot or with elevated rights.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: All Windows Endpoints and Servers, Linux servers, macOS endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nLET svc = events(EventID IN (7045,4697))\nLET disallowed = [C:\\Users\\, C:\\ProgramData\\\
      , C:\\Temp\\, C:\\Windows\\Temp\\]\nWHERE startswith(svc.image_path, disallowed)\n   OR (Sysmon\
      \ EID7 signed=false OR signer NOT trusted)\nEMIT alert(host, service, image_path, signer)"
  - technology: auditd/pseudocode
    query: '>-

      WATCH systemd ExecStart OR plist ProgramArguments

      WHERE exec_target startswith (/tmp, /home, ~/Library/LaunchAgents, /Library/LaunchAgents)

      EMIT alert(host, unit, exec_target)'
- question: Is a new service binary running from a directory path that is statistically rare across the
    fleet or seen on only one or two hosts?
  context: Rare execution paths are a reliable weak signal for malicious persistence. Track directory-path
    frequency for service binaries over a 30-day window and flag paths that fall below the 1st percentile
    of frequency or that appear on only one or two hosts. Adversary-dropped binaries tend to live in unique,
    host-specific paths, whereas legitimate software shares common installation directories across many
    machines. A positive result narrows the hunt to anomalous services worth deeper inspection.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: All Windows Endpoints and Servers, Linux servers, macOS endpoints'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nfreq = COUNT_DISTINCT(host) BY directory_path FROM service_binaries last 30d\nglobal_freq\
      \ = COUNT(*) BY directory_path\nFLAG directory_path WHERE global_freq < percentile(all, 1)\n   OR\
      \ host_count <= 2\nEMIT directory_path, host_count, services"
- question: Does a machine-learning model score a new service's binary location as high-risk based on
    user-profile/temp path flags, signer trust, and path depth, or does an unsupervised model flag a novel
    path?
  context: Combine multiple location-based weak signals into a single risk score. Train a decision tree
    or gradient-boosted model using features such as a user-profile-path flag, temp-path flag, unsigned
    flag, signer trust, and path depth, and add an unsupervised Isolation Forest to surface novel paths
    the supervised model has not seen. Prioritize high-risk scores and list the top-3 contributing features
    in the alert. This gives the analyst an explainable, ranked queue of suspicious service locations
    rather than a flood of independent path alerts.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - auditd:SYSCALL
  - macos:unifiedlog
  - 'NAI: All Windows Endpoints and Servers, Linux servers, macOS endpoints'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      features = [user_profile_path, temp_path, unsigned, signer_trust, path_depth]

      risk = GradientBoost.predict_proba(features)

      novelty = IsolationForest.score(features)

      FLAG WHERE risk > 0.8 OR novelty anomalous

      EMIT service, risk, top3_feature_attribution(features)'
- question: Does a parent service process (services.exe, svchost.exe, or systemd) spawn a suspicious child
    process such as an interactive shell or interpreter, and does that child make an outbound connection
    to a rare or malicious destination?
  context: 'Legitimate service hosts rarely launch interactive shells or interpreters. Alert when services.exe/svchost.exe
    (or systemd) spawns suspicious children (cmd, powershell, cscript, wscript, rundll32, mshta, bash)
    and correlate with Zeek conn.log or Sysmon EID 3 within 60 seconds, boosting severity for outbound
    connections to rare or malicious IPs. Include connection state as an additional dimension: count failed/blocked
    egress (Zeek conn_state S0/REJ) and NXDOMAIN responses (Zeek dns.log) from the service as distinct
    C2-failure signals. This pattern is a classic indicator of a malicious service used for both persistence
    and command-and-control.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - auditd:SYSCALL
  - 'NAI: All Windows Endpoints and Servers, Linux servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nLET child = events(EventID=4688 OR Sysmon=1)\nWHERE parent_image IN (services.exe, svchost.exe,\
      \ systemd)\n  AND child_image IN (cmd,powershell,cscript,wscript,rundll32,mshta,bash)\nJOIN net\
      \ = (Sysmon EID3 OR zeek.conn) WITHIN 60s ON host, pid\nLET sev = base + (net.dest IN rare_or_malicious\
      \ ? boost : 0)\nEMIT alert(host, parent, child, net.dest, sev)"
  - technology: Zeek/pseudocode
    query: '>-

      from service-origin pids:

      COUNT conn WHERE conn_state IN (S0, REJ) AS failed_egress

      JOIN dns WHERE rcode_name == NXDOMAIN AS c2_dns_failures

      EMIT host, service, failed_egress, c2_dns_failures'
- question: Is a given service-process parent-child pair rare across the fleet, or is the child command-line
    length or per-service outbound byte volume anomalously large?
  context: Baseline the legitimate child image names and command-line length per parent across the fleet,
    then flag rare parent-child pairs (frequency below 1%) or command-line lengths above the 99th percentile,
    following outlier-parent frequency analysis. Additionally apply a robust median/MAD threshold to per-service
    outbound byte volume to catch data movement that deviates from a service's normal network footprint.
    Rare pairings and oversized command lines are reliable behavioral indicators of injected or hijacked
    service processes. This statistical layer catches anomalies that an exact-match rule would not.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - auditd:SYSCALL
  - 'NAI: All Windows Endpoints and Servers, Linux servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      pair_freq = COUNT(*) BY parent_image, child_image / total

      FLAG WHERE pair_freq < 0.01

      FLAG WHERE len(command_line) > percentile(per_parent_cmdlen, 99)

      -- outbound volume

      med = median(bytes_out BY service); mad = mad(bytes_out)

      FLAG WHERE 0.6745*(bytes_out-med)/mad > 3.5

      EMIT host, parent, child, pair_freq, bytes_out'
- question: Does a provenance/process-graph anomaly model surface a rare service parent-child or service-to-network
    edge worth investigating?
  context: Build a provenance/process graph from host and network telemetry and apply node- or edge-level
    anomaly detection to surface rare service parent-child and service-to-network edges. Return the implicated
    subgraph for triage so the analyst sees the full causal chain (service -> child -> network) rather
    than isolated events. Graph-based detection (ThreaTrace, KAIROS style) is especially good at catching
    multi-step persistence and C2 behavior that spans process and network boundaries. A flagged subgraph
    is a strong, context-rich lead for incident response.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Zeek conn.log
  - Zeek dns.log
  - auditd:SYSCALL
  - 'NAI: All Windows Endpoints and Servers, Linux servers, Network Egress Points'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: '>-

      G = build_provenance_graph(process_events, network_events)

      scores = graph_anomaly.edge_node_score(G)  # ThreaTrace/KAIROS

      FLAG service-parent-child and service->network edges WHERE score anomalous

      EMIT implicated_subgraph(host, edges)'
- question: Is an existing service's registry configuration (ImagePath, ServiceDll, or FailureCommand),
    or an existing Linux systemd unit / macOS launchd plist ExecStart, being modified by a non-allowlisted
    process or outside change-management windows?
  context: Hijacking an existing trusted service is stealthier than creating a new one. Alert on Event
    IDs 4657 / Sysmon 13 when ImagePath, ServiceDll, or FailureCommand under HKLM\SYSTEM\CurrentControlSet\Services\
    changes by a non-allowlisted process or outside approved change-management windows, and on auditd
    writes editing an existing systemd unit ExecStart or launchd plist. A modification redirecting a legitimate
    service to an adversary-controlled payload provides durable, well-disguised persistence (and often
    elevated execution). Correlating the change with the process and account that performed it, and with
    change-management schedules, sharply reduces false positives.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Windows Event ID 4697
  - auditd:SYSCALL
  - 'NAI: Domain Controllers, Application Servers, Critical Workstations, especially those with custom
    or legacy services'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nWATCH events(EventID=4657 OR Sysmon=13)\nWHERE reg_key MATCHES HKLM\\SYSTEM\\CurrentControlSet\\\
      Services\\*\\(ImagePath|ServiceDll|FailureCommand)\n  AND modifying_process NOT IN allowlist\n \
      \ AND event_time NOT IN change_mgmt_windows\nEMIT alert(host, service, value_name, modifying_process,\
      \ account)"
  - technology: auditd/pseudocode
    query: '>-

      WATCH SYSCALL write|rename ON existing systemd unit ExecStart OR launchd plist

      WHERE actor NOT IN allowlist

      EMIT alert(host, unit, actor)'
- question: Is a service's configuration changing at an anomalously high rate or exhibiting an abrupt
    level shift compared to its historical change cadence?
  context: Most service configurations are extremely stable over time. Hash each service configuration
    daily, track the change rate per service, and flag rates greater than 3 standard deviations above
    the mean or abrupt level shifts detected via change-point detection. A service that suddenly begins
    changing after months of stability may be under active manipulation. This statistical approach detects
    tampering even when the modifying process is allowlisted or the change occurs during a maintenance
    window, by focusing on the unusual cadence rather than the actor.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Windows Event ID 4697
  - auditd:SYSCALL
  - 'NAI: Domain Controllers, Application Servers, Critical Workstations, especially those with custom
    or legacy services'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\nFOR each service:\n  daily_hash = hash(config) BY day\n  change_rate = COUNT(distinct\
      \ daily_hash transitions) BY window\n  mean,std = stats(change_rate history)\nFLAG WHERE change_rate\
      \ > mean + 3*std OR change_point(daily_hash series)\nEMIT service, change_rate, host"
- question: Does a one-class anomaly model trained on known-good service configurations flag a live service
    modification as anomalous, and which config fields drove the score?
  context: Train a One-Class SVM (or Isolation Forest) on golden/known-good service configurations and
    flag live modifications as anomalies, listing which config fields (ImagePath, ServiceDll, account)
    drove the score. This learns the manifold of legitimate configurations and detects deviations without
    needing labeled malicious samples. The field-level attribution tells the analyst exactly what changed
    in an unexpected way, accelerating triage of potential service hijacking for persistence. A flagged
    config that points to a new binary or runs under a new account is a high-priority lead.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Windows Event ID 4697
  - auditd:SYSCALL
  - 'NAI: Domain Controllers, Application Servers, Critical Workstations, especially those with custom
    or legacy services'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\nmodel = OneClassSVM.fit(golden_service_configs)  # or IsolationForest\nFOR each live_modification:\n\
      \  score = model.decision_function(config_features)\nFLAG WHERE score anomalous\nEMIT service, score,\
      \ driving_fields(ImagePath, ServiceDll, account)"
- question: Is a new service created to run as LocalSystem whose binary name or hash matches a known privilege-escalation
    exploit or tool (e.g., JuicyPotato, BadPotato, PrintSpoofer)?
  context: Adversaries abuse service creation to gain SYSTEM execution from a lower-privilege foothold,
    often deploying well-known potato-family or token-abuse tools. Alert when Event IDs 7045/4697 show
    a LocalSystem service whose binary or hash matches known escalation tools from threat intel, and surface
    the matched tool, ImagePath, and creating account in the alert. A match is high-confidence privilege
    escalation and should trigger immediate response, since SYSTEM execution gives the adversary near-total
    control of the host. This is the deterministic floor for the privilege-escalation variant of T1543.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints and Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nLET svc = events(EventID IN (7045,4697)) WHERE service_account == LocalSystem\nJOIN proc\
      \ = events(EventID=4688 OR Sysmon=1) ON host, image ENRICH hash\nWHERE svc.binary_name IN escalation_tools\n\
      \   OR proc.hash IN escalation_tool_hashes  # JuicyPotato/BadPotato/PrintSpoofer\nEMIT alert(matched_tool,\
      \ image_path, creating_account)"
- question: Is a service-creation command line using a rare argument combination, such as binPath pointing
    to a LOLBAS plus obj=LocalSystem?
  context: Analyze command-line argument combinations for service creators (sc.exe, powershell.exe) and
    flag ones below the 1% frequency threshold, especially binPath= pointing to a LOLBAS together with
    obj=LocalSystem, using fleet-wide frequency baselining. This combination is uncommon in legitimate
    administration but characteristic of escalation tradecraft that registers a SYSTEM service running
    attacker-controlled or living-off-the-land code. A statistically rare argument set is a strong lead
    even when the binary itself is not in any IOC feed.
  answer_sources:
