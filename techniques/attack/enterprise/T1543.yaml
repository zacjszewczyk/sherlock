- question: Is a service created or modified to run with SYSTEM privileges by a user account that is not
    a member of any local or domain administrative group?
  context: Service creation is normally an administrative action. Alert when Event IDs 7045/4697 show
    a LocalSystem service created by a user whose account is not in admin groups, enriched with Active
    Directory group information, and surface the account, service, and binary in the alert. A non-admin
    user creating a SYSTEM-level service is a textbook privilege-escalation primitive (often via an abused
    service-control permission or vulnerable installer). This deterministic check, with AD enrichment,
    produces high-fidelity escalation alerts.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints and Servers, Authentication Logs from Domain Controllers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '>-

      LET svc = events(EventID IN (7045,4697)) WHERE service_account == LocalSystem

      ENRICH creator_account WITH AD_group_membership

      WHERE creator_account NOT IN (Administrators, Domain Admins, local admin groups)

      EMIT alert(account, service, binary, host)'
- question: Does a user's service-creation activity deviate from their baseline, such as a non-admin user
    creating any service or an admin user exceeding their normal creation rate?
  context: Baseline service-creation counts per user over 30 days with a robust median/MAD modified Z-score,
    and flag any non-admin user creating a service or admin users exceeding a modified Z-score of 3.5.
    Also track failed/access-denied service creates (4697 failures) as a distinct signal of attempted-but-blocked
    escalation. A standard user who has never created a service suddenly doing so, or an admin whose creation
    rate spikes, both warrant scrutiny. This statistical baseline catches escalation attempts that respect
    group membership rules but break behavioral norms.
  answer_sources:
  - Windows Event ID 7045
  - Windows Event ID 4697
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Sysmon Event ID 7
  - Sysmon Event ID 11
  - 'NAI: All Windows Endpoints and Servers, Authentication Logs from Domain Controllers'
  range: Last 30 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '>-

      per_user = COUNT(EventID IN (7045,4697)) BY user, day last 30d

      med = median(per_user); mad = mad(per_user)

      mz = 0.6745*(per_user-med)/mad

      FLAG WHERE (user NOT admin AND count > 0) OR (user admin AND mz > 3.5)

      JOIN denied = events(4697 failure/access denied) BY user EMIT alert(user, count, denied)'
- question: Does a user who normally behaves like a standard/dev user suddenly behave like a sysadmin
    by creating SYSTEM services (peer-group drift)?
  context: Cluster users by daily activity feature vectors and flag when a standard or developer cluster
    member behaves like a sysadmin (e.g., creates SYSTEM services), using an Isolation Forest to score
    deviation and listing the deviating features. Peer-group analytics detect privilege escalation as
    a behavioral shift relative to a user's normal role, catching cases where a compromised standard account
    is leveraged for SYSTEM-level service creation. The deviating-feature list tells the analyst exactly
    which sysadmin-like behaviors triggered the flag.
