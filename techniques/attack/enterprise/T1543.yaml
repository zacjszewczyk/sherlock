- question: Does a service have an unquoted ImagePath, and is a file being created in the exploitable
    path segment (e.g., C:\Program.exe) to hijack the service's execution?
  context: Unquoted service paths let an attacker plant an executable in an earlier path segment that
    Windows will run instead of the intended binary, yielding execution in the service's (often SYSTEM)
    context. Identify services with unquoted ImagePath values and monitor Sysmon Event ID 11 file creations
    in the exploitable segments (for example, watch for C:\Program.exe when a service path is C:\Program
    Files\...). A file appearing in such a segment is a direct sign of an unquoted-service-path privilege-escalation
    attempt and should be alerted immediately.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, particularly older systems or those with third-party software'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\nunquoted = services WHERE image_path has space AND NOT quoted\nFOR each unquoted svc:\n\
      \  exploit_paths = enumerate_segments(svc.image_path)  # e.g. C:\\Program.exe\nWATCH Sysmon EID11\
      \ file_create WHERE target IN exploit_paths\nEMIT alert(host, service, created_file)"
- question: Is a newly created executable in a vulnerable service directory a near-typosquat of the legitimate
    service binary name (Damerau-Levenshtein distance <= 2)?
  context: Scan directories under vulnerable services for new executables and alert when the Damerau-Levenshtein
    distance to the intended binary name is 2 or less. Attackers exploiting weak directory ACLs or unquoted
    paths often drop a file whose name closely resembles the real service binary to blend in and capture
    execution. A small edit distance to a legitimate service binary name in a writable service directory
    is a strong, low-false-positive indicator of a path-hijack escalation attempt.
  answer_sources:
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - Sysmon Event ID 11
  - Windows Event ID 4688
