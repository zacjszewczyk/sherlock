- question: Is an existing service's permissions (DACL) modified to grant a non-admin user write access,
    followed shortly by that same user modifying the service's configuration to execute elevated code?
  context: Chain Event ID 4670 permission grants with subsequent Sysmon 13 / Windows 4657 / 4697 modifications
    to the same service by the same non-admin user within 1 hour. This two-step pattern, weakening a service
    DACL and then editing its configuration, is a deliberate privilege-escalation sequence that turns
    a writable service into SYSTEM execution. Correlating the permission change with the follow-on config
    edit by the same low-privilege actor produces a high-confidence escalation alert that neither event
    alone would yield.
