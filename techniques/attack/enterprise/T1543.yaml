      \ COUNT(*) BY normalized_arg_combo / total\nFLAG WHERE combo_freq < 0.01\n   OR (binPath ~ LOLBAS\
      \ AND obj == LocalSystem)\nEMIT host, command_line, combo_freq"
- question: Does a machine-learning model classify a service creation as likely privilege escalation based
