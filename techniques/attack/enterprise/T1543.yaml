- question: Do association-rule mining or provenance-graph methods reveal high-confidence causal chains
    linking non-admin permission grants to subsequent service-config edits?
  context: Apply Apriori/FP-Growth to surface high-confidence rules linking non-admin permission grants
    to service-config edits, or model the DACL-change -> config-edit chain as a provenance subgraph and
    flag rare causal paths with edge-level scoring. Pattern-mining and graph methods generalize the deterministic
    4670->config-edit correlation, discovering escalation chains that vary in timing or intermediate steps.
    A surfaced rule or rare causal path gives the analyst a defensible, data-driven escalation lead with
    the full chain attached.
