      \ command_line, rare_grams"
- question: Does a sequence model flag the post-escalation chain (SYSTEM service -> interpreter -> encoded
    command -> C2) as an anomalous process/syscall sequence?
  context: Train an HMM on benign syscall/process sequences or an LSTM log-sequence model (DeepLog-style)
    and flag chains like SYSTEM service -> powershell -> encoded command -> C2 as anomalous, returning
    the unexpected step(s) in the alert. Sequence modeling captures the temporal ordering of an attack
    chain, detecting escalation-to-execution-to-C2 flows even when each individual step looks benign in
    isolation. The returned unexpected step pinpoints where the observed behavior diverged from normal,
    guiding triage.
