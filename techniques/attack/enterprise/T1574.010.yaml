name: 'T1574.010: Hijack Execution Flow: Services File Permissions Weakness'
id: 0a236478-7fd9-4e98-aee5-8ccdd36a7300
description: 'This playbook helps an analyst investigate whether an adversary has abused weak file or
  directory permissions on Windows service binaries to hijack execution flow (Services File Permissions
  Weakness), per MITRE technique T1574.010. The core abuse pattern: when the permissions on a service''s
  executable (the path defined in the Service Control Manager''s ImagePath registry value) or its containing
  directory are too permissive, an attacker can overwrite the legitimate binary with a malicious one using
  ordinary user rights; the Service Control Manager then executes the replacement when the service starts
  -- frequently as NT AUTHORITY\SYSTEM -- yielding both privilege escalation and persistence across reboots.
  The hunt covers the full kill-chain of this technique across the Stealth, Execution tactics: file writes
  to service ImagePath binaries that change the on-disk hash or match malicious-hash/CTI feeds; writes
  by untrusted writers (unsigned binaries, processes in AppData/Temp/Public, or anything off the patch-management
  allowlist such as msiexec.exe and TrustedInstaller.exe); the deterministic chain of a DACL permission
  change (Event ID 4670) followed by a file write (4663) and a service start/restart (7036/7045) by a
  non-privileged user; replacement of SYSTEM-run service binaries with privilege-escalation tooling; tampering
  with security-product (EDR/AV/logging) service binaries that invalidates their signatures; hijacked
  services spawning interactive shells or LoLBins (cmd.exe, powershell.exe, certutil.exe, msbuild.exe,
  cmstp.exe) for user creation, group modification, or credential access; and hijacked service processes
  initiating outbound command-and-control. Detection methods combine symbolic-logic correlation rules,
  statistical baselining (MAD-based modified z-scores, frequency/rarity profiling, section/command-line
  entropy, signature-state transitions), and machine-learning models (DeepLog/GRU sequence models, HMMs,
  XGBoost classifiers, isolation forests, and provenance-graph learners) applied to Windows Security and
  Sysmon events (4663, 4670, 4657, 4688, 7036, 7045; Sysmon 1/11/15), the Service Control Manager registry,
  file-integrity who-data, and Zeek conn/ssl/http/dns logs, so an analyst can corroborate suspected service-binary
  hijacking against file provenance, account behavior, process lineage, and downstream network activity.'
