- question: '[Stealth] Rare write deviation alert: Can you determine whether a file write operation is
    logged for a file path defined in a Windows service''s ImagePath registry key, and the resulting file
    is later executed by the service with a different hash, indicating the service binary was replaced
    or overwritten. -- specifically, using the ''Rare write deviation alert'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), adversaries hijack Windows service execution
    flow by exploiting weak file/directory permissions to overwrite a service''s binary, so the Service
    Control Manager runs attacker code -- often as SYSTEM -- for privilege escalation and persistence.
    This evidence focuses on the condition that a file write operation is logged for a file path defined
    in a Windows service''s ImagePath registry key, and the resulting file is later executed by the service
    with a different hash, indicating the service binary was replaced or overwritten. This Statistical
    Method approach works as follows: Track per-service-binary hashes and modification timestamps over
    180 days. On a changed hash, compute time-since-last-change and the per-binary write count and flag
    values exceeding the MAD-based modified z-score threshold (|score|>3.5) per modified z-score (https://www.detectionengineering.net/p/dew-145-modified-z-score-for-anomaly);
    in parallel compute section entropy of the new file and raise severity when any section exceeds 7.0,
    indicating packing per Lyda & Hamrock (https://ieeexplore.ieee.org/document/4140989). Derive the median/MAD
    per host class from a 90-180 day baseline and exclude approved maintenance windows. A positive result
    -- a rule match, statistical outlier, or model alert -- is a strong indicator that a service binary
    was replaced or that a hijacked service is executing attacker code; pivot to the responsible writer
    process and its parent lineage, the modifying account and its privilege level, the targeted service
    and its run-as identity, the before/after file hash and signature state, and any subsequent service
    start, child process, or outbound connection. A negative result helps rule out this particular vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, slow, or living-off-the-land variants of this technique.'
