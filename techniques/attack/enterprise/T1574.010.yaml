questions:
- question: '[Stealth] Service path hash correlation: Can you determine whether a file write operation
    is logged for a file path defined in a Windows service''s ImagePath registry key, and the resulting
    file is later executed by the service with a different hash, indicating the service binary was replaced
    or overwritten. -- specifically, using the ''Service path hash correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), adversaries hijack Windows service execution
    flow by exploiting weak file/directory permissions to overwrite a service''s binary, so the Service
    Control Manager runs attacker code -- often as SYSTEM -- for privilege escalation and persistence.
    This evidence focuses on the condition that a file write operation is logged for a file path defined
    in a Windows service''s ImagePath registry key, and the resulting file is later executed by the service
    with a different hash, indicating the service binary was replaced or overwritten. This Symbolic Logic
    approach works as follows: Alert when a write to a service ImagePath binary is logged (Windows Event
    ID 4663 / Sysmon EventID 11) and FIM who-data attributes the modifying user/process per Wazuh FIM
    (https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html) and osquery
    file_events (https://osquery.readthedocs.io/en/stable/deployment/file-integrity-monitoring/); hash
    the resulting file and compare to a malicious-hash feed, escalating immediately on any match. This
    is the deterministic floor for the binary-replacement pattern described in CrowdStrike''s DLL-hijack
    taxonomy (https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/). Validate with Atomic
    Red Team T1574.010 (https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1574.010/T1574.010.md).
    A positive result -- a rule match, statistical outlier, or model alert -- is a strong indicator that
    a service binary was replaced or that a hijacked service is executing attacker code; pivot to the
    responsible writer process and its parent lineage, the modifying account and its privilege level,
    the targeted service and its run-as identity, the before/after file hash and signature state, and
    any subsequent service start, child process, or outbound connection. A negative result helps rule
    out this particular vector but should be corroborated with the other questions in this playbook, since
    a single method can miss stealthy, slow, or living-off-the-land variants of this technique.'
