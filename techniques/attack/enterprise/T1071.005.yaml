    and flag hourly spikes above the 95th percentile; track CONNACK/SASL failure rates as a distinct brute-force
    signal. A positive result indicates pub/sub traffic that is inconsistent with sanctioned broker usage
    - matching known C2 infrastructure, carrying suspicious topic/client_id/JID metadata, beaconing with
    abnormal cadence or volume, or temporally tied to high-risk process execution - and warrants escalation;
    a negative result means the observed pub/sub activity aligns with approved brokers and historical
    baselines. Investigate the named area of interest (Enterprise network egress points (e.g., firewalls,
    proxies); Internal DNS resolvers) and pivot from any hit to the initiating host/process, broker endpoint
    and authentication state, subscribed topics, and any follow-on command execution or data movement.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek mqtt.log
  - Zeek xmpp.log
  - 'NAI: Enterprise network egress points (e.g., firewalls, proxies); Internal DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "// Statistical baselining for: CTI hourly pivot scoring\nWINDOW = 1h   // also maintain 30/90-day\
      \ per-host & peer-group baselines\nFOR EACH host (and src->broker pair):\n  pubs_per_min   = count(publishes)/minutes\n\
      \  byte_vol/ratio = sum(orig_bytes), sum(resp_bytes), orig/resp\n  duration       = session_duration\n\
      \  topic_entropy  = shannon_entropy(topic|client_id|payload_meta)\n  topic_card     = distinct(topics);\
      \ first_time_topic = topic NOT IN host_history\n  auth_fail_rate = count(CONNACK 4/5 | SASL fail)/count(connects)\n\
      \  prevalence     = 30d_count(dst)\nCOMPUTE per-host/per-peer baseline (mean,sigma,percentiles)\n\
      ALERT WHEN pubs_per_min|byte_vol|duration > p95/p99\n  OR topic_entropy > p98 OR first_time_topic\n\
      \  OR prevalence < p5 OR auth_fail_rate >> baseline"
