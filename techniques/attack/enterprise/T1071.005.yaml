questions:
- question: 'Using deterministic rule logic, can you determine whether ''CTI pub/sub correlation'' indicates
    adversary use of publish-subscribe protocols for command and control? Specifically: Correlate Zeek
    conn.log/dns.log destinations on broker ports 1883/8883/5222/5269/5671/5672 against a high-confidence
    CTI feed of known pub/sub C2 brokers (e.g., MQTT brokers/topics from [WailingCrab, IBM X-Force](https://securityintelligence.com/x-force/wailingcrab-sophisticated-multifunctional-backdoor/))
    and alert on any match; enrich with the initiating process and broker auth state. Prioritize plaintext
    MQTT (1883) to external ASNs.'
  context: 'Tactic context (Command and Control / TA0011): adversaries abuse publish/subscribe application-layer
    protocols (MQTT, XMPP, AMQP, STOMP) to blend C2 traffic in with legitimate message-broker traffic,
    embedding commands and results within protocol fields and routing through a centralized broker to
    mask the true endpoint. Evidence under investigation: An internal host establishes a network connection
    using a pub/sub protocol (e.g., MQTT, XMPP, AMQP) to an external IP address or domain present on a
    high-confidence threat intelligence feed of known C2 infrastructure. Approach (CTI pub/sub correlation):
    Correlate Zeek conn.log/dns.log destinations on broker ports 1883/8883/5222/5269/5671/5672 against
    a high-confidence CTI feed of known pub/sub C2 brokers (e.g., MQTT brokers/topics from [WailingCrab,
    IBM X-Force](https://securityintelligence.com/x-force/wailingcrab-sophisticated-multifunctional-backdoor/))
    and alert on any match; enrich with the initiating process and broker auth state. Prioritize plaintext
    MQTT (1883) to external ASNs. A positive result indicates pub/sub traffic that is inconsistent with
    sanctioned broker usage - matching known C2 infrastructure, carrying suspicious topic/client_id/JID
    metadata, beaconing with abnormal cadence or volume, or temporally tied to high-risk process execution
    - and warrants escalation; a negative result means the observed pub/sub activity aligns with approved
    brokers and historical baselines. Investigate the named area of interest (Enterprise network egress
    points (e.g., firewalls, proxies); Internal DNS resolvers) and pivot from any hit to the initiating
    host/process, broker endpoint and authentication state, subscribed topics, and any follow-on command
    execution or data movement.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek mqtt.log
  - Zeek xmpp.log
  - 'NAI: Enterprise network egress points (e.g., firewalls, proxies); Internal DNS resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: CTI pub/sub correlation\n// Pub/sub broker ports: MQTT 1883/8883,\
      \ XMPP 5222/5269, AMQP 5671/5672, STOMP 61613\nMATCH pubsub_events (zeek mqtt.log/xmpp.log/amqp.log/conn.log,\
      \ sysmon EID 3/22, EID 4688)\nWHERE dst_port IN [1883,8883,5222,5269,5671,5672,61613]\n  AND ( dst\
      \ IN cti_pubsub_c2_feed              // known broker C2\n        OR dst NOT IN approved_broker_allowlist\
      \ // unsanctioned destination\n        OR topic|client_id|username|jid MATCHES /(cmd|upload|exec|shell|beacon|result)|[A-Fa-f0-9]{16,}|base64/\n\
      \        OR connection_duration > 24h OR sessions_per_hour > 1000\n        OR followed_within_30s_by(process\
      \ IN ['powershell','cmd','rundll32','python'] OR non_standard_path) )\nENRICH initiating_process(EID\
      \ 4688), broker_auth_state(CONNACK/SASL), domain_age, reputation\nTHEN alert(severity='high')"
- question: 'Using statistical baselining, can you determine whether ''CTI hourly pivot scoring'' indicates
    adversary use of publish-subscribe protocols for command and control? Specifically: Count unique source-destination
    pairs and total orig/resp bytes per hour for CTI-matching pub/sub flows, baseline over 90 days per
    [BAYWATCH](https://research.ibm.com/publications/baywatch-robust-beaconing-detection-to-identify-infected-hosts-in-large-scale-enterprise-networks),
    and flag hourly spikes above the 95th percentile; track CONNACK/SASL failure rates as a distinct brute-force
    signal.'
  context: 'Tactic context (Command and Control / TA0011): adversaries abuse publish/subscribe application-layer
