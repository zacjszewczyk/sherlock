name: 'T1071.005: Publish-Subscribe Protocols'
id: fdbc514d-ac2c-49aa-ad3c-f07bb72d175f
description: 'This playbook helps an analyst determine whether an adversary is abusing publish/subscribe
  (pub/sub) application-layer protocols - MQTT, XMPP, AMQP, and STOMP - for command and control (T1071.005).
  Adversaries route C2 through a centralized message broker, embedding commands and results within protocol
  fields to blend in with legitimate broker traffic and evade network filtering. The playbook correlates
  network telemetry (Zeek conn.log/dns.log/mqtt.log/xmpp.log/amqp.log on broker ports 1883/8883, 5222/5269,
  5671/5672, 61613) with endpoint process telemetry (Windows Event ID 4688, Sysmon EID 3/22, auditd execve,
  macOS unified log/osquery socket events). Investigative angles include: connections to CTI-listed pub/sub
  C2 brokers; suspicious topic/client_id/username/JID metadata (long hex, GUIDs, Base64, command keywords);
  deviations from per-host or peer-group baselines in volume, duration, and frequency; connections to
  non-allowlisted, newly registered, or low-reputation brokers; statistically rare or high-entropy topics;
  broker authentication failures (MQTT CONNACK 4/5, SASL); and pub/sub connections temporally followed
  by high-risk process execution. Detection blends symbolic-logic rules, statistical baselining (percentiles,
  Shannon entropy, prevalence, beaconing cadence), and machine learning (gradient boosting, Isolation
  Forest/one-class SVM, autoencoders, LDA topic modeling, LSTM/CT-HMM sequence models) with SHAP-based
  explainability to produce evasion-resistant, defensible alerts for the Command and Control tactic.'
type: technique
related:
- tactic_id: TA0011
  tactic_name: Command and Control
