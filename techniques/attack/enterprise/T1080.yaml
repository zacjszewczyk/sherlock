name: 'T1080: Taint Shared Content'
id: 43e61be5-b365-44bb-bef3-7f35e8ece42b
description: 'This playbook helps an analyst determine whether an adversary is using Taint Shared Content
  (T1080) to move laterally by planting or modifying malicious content in shared storage locations such
  as SMB/NFS file shares, internal code or deployment repositories, SharePoint/document management systems,
  and cloud-shared folders (Google Drive, Microsoft 365). It correlates file-write telemetry on shares
  (Sysmon Event ID 11, Windows Event ID 4663/5140/5145, Zeek files.log/smb_files.log, auditd, macOS fsevents/unified
  log, and cloud audit logs) with subsequent process execution from those share paths to surface the writer->executor
  lateral movement edge. Investigative angles include: matching newly written share files against known-bad
  hashes, AV verdicts, and YARA/Sigma rules; detecting trojanized binaries (unsigned PE, high section
  byte-entropy, OEP/entry-point changes from append/prepend binary infection); spotting lure filename
  patterns (double extensions like .docx.exe/.pdf.scr, high filename entropy, rare extensions for the
  writing user); scanning .lnk/.ps1/.vbs/.bat files for obfuscation and suspicious targets (scripting
  engines, hidden/UNC paths); baselining per-user/per-share write volume, breadth of tree touched, and
  write-content entropy to catch directory-share pivots and binary infectors; profiling access-denied/failed-write
  bursts as a distinct enumeration signal; and correlating cross-host execution from UNC/share paths shortly
  after a write by a different user/host. Detection blends symbolic-logic rules, statistical baselining
  (MAD, 3-sigma, change-point/CUSUM), and machine learning (gradient-boosted PE/script classifiers, LSTM/autoencoder
  log models, UEBA graph models, and whole-system provenance tracing) to produce evasion-resistant, explainable
  alerts for the Lateral Movement tactic.'
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
