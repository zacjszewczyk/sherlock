questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match tainted share files to
    malicious indicators'' indicates adversaries tainting shared content for lateral movement? Specifically:
    Alert when a new file written to a network share (Sysmon Event ID 11, Windows Event ID 4663/5145,
    Zeek files.log) matches known-bad hashes, an AV verdict, or content/YARA rules from a curated rule
    base, and capture the writing host, user, and process for containment before downstream execution
    ([Neo23x0 signature-base YARA rules](https://github.com/Neo23x0/signature-base), [SigmaHQ Detection
    Rules Repository](https://github.com/SigmaHQ/sigma)). For PE files, deterministically flag unsigned/invalid-signature
    binaries AND any section whose byte-entropy histogram exceeds 7.0 (packing indicator; legitimate code
    typically 5.0-6.5) ([EMBER: An Open Dataset for Training Static PE Malware ML Models](https://arxiv.org/abs/1804.04637)).
    Failure-mode signal: separately count AV scan failures, quarantine-failed, and access-denied (4663
    failure) events on the same path, since an actor disabling/evading scanning or probing files is itself
    suspicious.'
  context: 'Tactic context (Lateral Movement / Lateral Movement): adversaries plant or modify content
    in shared storage so that when another user or host opens or executes it, the adversary''s code runs
    on a remote system, enabling lateral movement and broader, often higher-privileged, access. Evidence
    under investigation: A file written to a network share is a malicious executable, script, shortcut,
    or trojanized document based on its hash, signer, or structural features, or it uses a filename pattern
    intended to lure another user into executing tainted shared content. Approach (Match tainted share
    files to malicious indicators): Alert when a new file written to a network share (Sysmon Event ID
    11, Windows Event ID 4663/5145, Zeek files.log) matches known-bad hashes, an AV verdict, or content/YARA
    rules from a curated rule base, and capture the writing host, user, and process for containment before
    downstream execution ([Neo23x0 signature-base YARA rules](https://github.com/Neo23x0/signature-base),
    [SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma)). For PE files, deterministically
    flag unsigned/invalid-signature binaries AND any section whose byte-entropy histogram exceeds 7.0
    (packing indicator; legitimate code typically 5.0-6.5) ([EMBER: An Open Dataset for Training Static
    PE Malware ML Models](https://arxiv.org/abs/1804.04637)). Failure-mode signal: separately count AV
    scan failures, quarantine-failed, and access-denied (4663 failure) events on the same path, since
    an actor disabling/evading scanning or probing files is itself suspicious. A positive result means
    content on a shared location was planted or modified to execute the adversary''s code when another
    user or host accesses it (e.g., a malicious/unsigned or high-entropy binary, an obfuscated script
    or trojanized .lnk, an anomalous write-volume burst, or a cross-host execution from a share shortly
    after a different user wrote the file); a negative result means the observed share activity matches
    expected baselines for that repository, user, and tooling. Investigate the named area of interest
    (Enterprise file shares (e.g., SMB, NFS), document management systems (e.g., SharePoint), and departmental
    or public-access network drives.) and pivot from any hit to the writing host/user/process, the tainted
    file, and any downstream execution or lateral spread to additional hosts and accounts.'
  answer_sources:
  - Sysmon Event ID 11
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek files.log
  - Antivirus Detection Logs
  - 'NAI: Enterprise file shares (e.g., SMB, NFS), document management systems (e.g., SharePoint), and
    departmental or public-access network drives.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Match tainted share files to malicious indicators\nFOR EACH\
      \ new_file_write ON network_share  // Sysmon EID 11, WinEID 4663/5145, Zeek files.log\n  IF sha256\
      \ IN known_bad_hashes OR av_verdict == 'malicious'\n     OR yara_match(file, curated_rules)\n  \
      \   OR (is_PE(file) AND (signature INVALID OR UNSIGNED)\n         AND max_section_byte_entropy(file)\
      \ > 7.0)\n  THEN alert(sev='high', writer_host, writer_user, writer_process, path)\n// failure-mode\
      \ signal:\nCOUNT av_scan_failed, quarantine_failed, 4663_access_denied BY path,user\n  WHEN burst\
      \ THEN alert('scan-evasion/probe')"
- question: 'Using statistical baselining, can you determine whether ''Flag rare lure naming on shared
