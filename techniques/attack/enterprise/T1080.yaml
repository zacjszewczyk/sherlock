    (User write-volume deviation): Baseline per-user and per-host file write/rename counts (files/min),
    bytes written, fraction of the directory tree touched, and write-content entropy on each share ([ShieldFS:
    A Self-healing, Ransomware-aware Filesystem](https://conand.me/publications/continella-shieldfs-2016.pdf)).
    Alert when any metric exceeds a robust threshold computed with Median Absolute Deviation (e.g., >
    median + 6*MAD) rather than mean+σ, since MAD resists the masking effect of bursty writers ([An Unsupervised
    Multi-Detector Approach for Identifying Malicious Lateral Movement](https://www.perform.illinois.edu/Papers/USAN_papers/17BOH01.pdf)).
    High write count combined with high write-entropy and broad tree coverage is the strongest taint/infection
    signal. A positive result means content on a shared location was planted or modified to execute the
    adversary''s code when another user or host accesses it (e.g., a malicious/unsigned or high-entropy
    binary, an obfuscated script or trojanized .lnk, an anomalous write-volume burst, or a cross-host
    execution from a share shortly after a different user wrote the file); a negative result means the
    observed share activity matches expected baselines for that repository, user, and tooling. Investigate
    the named area of interest (Critical file servers hosting intellectual property, financial records,
    or PII. Also includes application servers with shared configuration files and backup storage locations.)
    and pivot from any hit to the writing host/user/process, the tainted file, and any downstream execution
    or lateral spread to additional hosts and accounts.'
