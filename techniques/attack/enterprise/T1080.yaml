- question: 'Using statistical baselining, can you determine whether ''User write-volume deviation'' indicates
    adversaries tainting shared content for lateral movement? Specifically: Baseline per-user and per-host
    file write/rename counts (files/min), bytes written, fraction of the directory tree touched, and write-content
    entropy on each share ([ShieldFS: A Self-healing, Ransomware-aware Filesystem](https://conand.me/publications/continella-shieldfs-2016.pdf)).
    Alert when any metric exceeds a robust threshold computed with Median Absolute Deviation (e.g., >
    median + 6*MAD) rather than mean+σ, since MAD resists the masking effect of bursty writers ([An Unsupervised
    Multi-Detector Approach for Identifying Malicious Lateral Movement](https://www.perform.illinois.edu/Papers/USAN_papers/17BOH01.pdf)).
    High write count combined with high write-entropy and broad tree coverage is the strongest taint/infection
    signal.'
