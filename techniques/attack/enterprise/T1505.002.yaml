name: 'T1505.002: Transport Agent'
id: ed87d781-b91e-4f5a-ad0e-172598c33230
description: 'This playbook helps an analyst investigate whether an adversary is maintaining persistent
  access to a Microsoft Exchange (or Linux MTA) environment by abusing the mail transport pipeline, as
  seen in the Turla LightNeuron campaign, under the Persistence tactic. A malicious transport agent is
  a .NET assembly (Windows/Exchange) or a milter/filter/transport script (Linux Postfix, Sendmail, Exim)
  that is registered with the mail server so adversary code executes for every message passing through
  the pipeline, enabling the attacker to block, modify, copy, or exfiltrate email and run commands. The
  hunt spans several behavioral angles: creation of new or statistically rare DLLs / .NET assemblies in
  the Exchange transport agent directory and their classification against threat intelligence, hash prevalence,
  PE structure, and static-feature ML models; execution of Install-TransportAgent / Enable-TransportAgent
  / New-TransportRule cmdlets and corresponding registry changes that register a new agent, correlated
  as a multi-step provenance chain and scored with PowerShell ML models; suspicious file writes by edgetransport.exe
  / MSExchangeTransport to non-standard staging directories (C:\Temp, user profiles, web-accessible paths)
  indicating payload drops or on-disk data staging; anomalous outbound network connections from the transport
  process matched to TI, DNS/beaconing failure states, and statistical/ML egress profiling; and measurable
  anomalies in email flow such as inbound delivery troughs for targeted mailboxes (interception), outbound
  spikes of encrypted/archive attachments (exfiltration), and high subject-line/attachment-name entropy.
  Detection methods combine symbolic-logic rules, statistical baselining/forecasting, and machine-learning
  models applied to Windows Security/Sysmon/PowerShell events, auditd, the Exchange Application log, and
  Zeek SMTP/conn/dns/files telemetry so the analyst can corroborate suspected transport-agent persistence
  across file, registry, process, network, and mail-flow evidence.'
type: technique
