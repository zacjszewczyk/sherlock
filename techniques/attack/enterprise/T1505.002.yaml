questions:
- question: '[Persistence] Alert on DLL creations in agent directories vs approved baseline: Using the
    ''Alert on DLL creations in agent directories vs approved baseline'' (Symbolic Logic) approach, can
    you determine whether a new DLL file is created in a Microsoft Exchange Server transport agent directory,
    and the file''s hash is either present on a threat intelligence feed or is statistically rare within
    the enterprise?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the Microsoft
    Exchange / mail transport pipeline by registering a malicious transport agent so their code runs for
    every email and survives reboots, credential changes, and patching. This evidence focuses on the condition
    that a new DLL file is created in a Microsoft Exchange Server transport agent directory, and the file''s
    hash is either present on a threat intelligence feed or is statistically rare within the enterprise.
    This Symbolic Logic approach works as follows: Monitor Sysmon 11 / 4663 for DLL (.dll/.NET assembly)
    creations or modifications under %ExchangeInstallPath%TransportRoles\agents\, diff against an approved-assembly
    file-integrity baseline (snapshot of names+hashes), and alert on any new/changed file; also alert
    when Get-TransportAgent shows an assembly path outside %ExchangeInstallPath% or a name not on the
    approved list, and when the file hash matches high-confidence TI. This baseline-diff approach for
    malicious server software components follows [Mitigating Web Shells, NSA and ASD](https://github.com/nsacyber/Mitigating-Web-Shells)
    and the documented LightNeuron drop path in [Turla LightNeuron, Faou (ESET)](https://www.welivesecurity.com/2019/05/07/turla-lightneuron-email-too-far/);
    legitimate agent paths/names are defined in [Transport Agents in Exchange Server, Microsoft](https://learn.microsoft.com/en-us/exchange/transport-agents-exchange-2013-help).
    A positive result -- a rule match, statistical outlier, or model alert -- is consistent with adversary
    transport-agent persistence (e.g., LightNeuron-style block/modify/exfiltrate behavior) and should
    prompt the analyst to pivot to the responsible assembly/agent, its registration provenance, the operator
    account and time of day, the transport process lineage, and any staged files or outbound mail/network
    flows. A negative result helps reduce confidence in this specific vector but should be corroborated
    with the other questions in this playbook, since a stealthy, criteria-triggered transport agent can
    evade any single detection method.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: File systems of Microsoft Exchange Servers, specifically the transport agent directories (e.g.,
    %ExchangeInstallPath%TransportRoles\agents\).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Alert on DLL creations in agent directories vs approved baseline\nsource IN [Windows Event\
      \ ID 4663, Sysmon Event ID 11]\n| filter on transport-agent indicators (agent dir DLL writes, Install/Enable-TransportAgent,\n\
      \  edgetransport.exe writes/connections, or anomalous SMTP flow)\n| join approved-baseline / threat-intel\
      \ / known-good agent list\n| where event NOT IN baseline OR matches TI\n| correlate multi-step chain\
      \ (registration -> new DLL -> module load -> service restart)\n| alert"
- question: '[Persistence] Flag statistically rare DLL hashes and high-entropy PE structure: Using the
    ''Flag statistically rare DLL hashes and high-entropy PE structure'' (Statistical Method) approach,
    can you determine whether a new DLL file is created in a Microsoft Exchange Server transport agent
    directory, and the file''s hash is either present on a threat intelligence feed or is statistically
    rare within the enterprise?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses the Microsoft
    Exchange / mail transport pipeline by registering a malicious transport agent so their code runs for
    every email and survives reboots, credential changes, and patching. This evidence focuses on the condition
    that a new DLL file is created in a Microsoft Exchange Server transport agent directory, and the file''s
    hash is either present on a threat intelligence feed or is statistically rare within the enterprise.
    This Statistical Method approach works as follows: Compute hash prevalence across the fleet over 30
    days and flag DLLs appearing only once or in the bottom 1st percentile; additionally score per-section
    entropy, section count, and import-table anomalies (packer/structure statistics rather than whole-file
    entropy) per [PE-Probe, Shafiq et al.](https://web.cs.ucdavis.edu/~zubair/files/vb09-zubair.pdf),
    and rank singleton/rare assemblies with isolation-based scoring per [Isolation Forest, Liu, Ting &
    Zhou](https://ieeexplore.ieee.org/document/4781136). Derive thresholds from your own assembly-deployment
    cadence (legitimate agent DLLs change rarely). A positive result -- a rule match, statistical outlier,
    or model alert -- is consistent with adversary transport-agent persistence (e.g., LightNeuron-style
    block/modify/exfiltrate behavior) and should prompt the analyst to pivot to the responsible assembly/agent,
    its registration provenance, the operator account and time of day, the transport process lineage,
    and any staged files or outbound mail/network flows. A negative result helps reduce confidence in
    this specific vector but should be corroborated with the other questions in this playbook, since a
    stealthy, criteria-triggered transport agent can evade any single detection method.'
  answer_sources:
  - Windows Event ID 4663
  - Sysmon Event ID 11
  - 'NAI: File systems of Microsoft Exchange Servers, specifically the transport agent directories (e.g.,
    %ExchangeInstallPath%TransportRoles\agents\).'
