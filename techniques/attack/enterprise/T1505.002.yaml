    hash is either present on a threat intelligence feed or is statistically rare within the enterprise.
    This Machine Learning approach works as follows: Score new/changed assemblies with a gradient-boosted
    static-feature model (byte/entropy histograms, imports, sections, header fields) per [EMBER, Anderson
    & Roth](https://arxiv.org/abs/1804.04637), optionally augmented by runtime API-call-sequence modeling
