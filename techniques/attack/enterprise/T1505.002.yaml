  queries:
  - technology: SIEM/Stats pseudocode
    query: "# Flag statistically rare DLL hashes and high-entropy PE structure\nsource IN [Windows Event\
      \ ID 4663, Sysmon Event ID 11]\n| summarize per-server/per-user baselines over 30-90d\n  (hash prevalence,\
      \ entropy/length, (path,extension) freq, bytes, mail volume)\n| compute mean(mu), stddev(sigma),\
      \ percentiles\n| where value > mu+3*sigma OR value in bottom/top 1st percentile\n  OR outside SARIMA\
      \ prediction interval\n| alert"
- question: '[Persistence] Classify DLLs via static PE ML model with feature attribution: Using the ''Classify
