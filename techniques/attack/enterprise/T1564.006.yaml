    a rule match, statistical outlier, or model alert -- indicates a probable hidden virtual instance;
    pivot to the responsible host, user, and process lineage, any dropped VM image and configuration (.vmx/.wsb)
    files, the un-inventoried virtualization MAC/IP, and any guest-to-host shared folders or outbound
    channels. A negative result helps rule out this particular hidden-VM vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy or living-off-the-land
