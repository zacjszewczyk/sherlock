      alert if score high; emit top-3 contributing tokens + nearest benign exemplar'
- question: '[Stealth] Detect virtual disk creation outside approved locations: Can you determine whether
    a new file is created with a common virtual disk extension (e.g., .vmdk, .vhd, .vhdx, .vdi, .qcow2)
    in a non-standard or suspicious directory, such as a user''s temporary folder (%TEMP%), a web-accessible
    directory, or a public share. -- specifically, using the ''Detect virtual disk creation outside approved
    locations'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that a new file is created with a common virtual disk extension (e.g., .vmdk, .vhd,
    .vhdx, .vdi, .qcow2) in a non-standard or suspicious directory, such as a user''s temporary folder
    (%TEMP%), a web-accessible directory, or a public share. This Symbolic Logic approach works as follows:
    From file creation logs (Sysmon EID 11 / auditd), alert when TargetFilename ends in ''.vmdk'',''.vhd'',''.vhdx'',''.vdi'',''.qcow2'',''.img'',''.ova'',''.wsb''
    and the path is not on the approved-storage allowlist and is instead high-risk (contains ''C:\Users\'',''C:\ProgramData\'',''C:\inetpub\wwwroot\'',''%TEMP%'',''/tmp'',''/dev/shm'').
    Keep this deterministic allowlist as the floor; tune it. Portable file-event matching per [SigmaHQ](https://github.com/SigmaHQ/sigma).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable hidden
    virtual instance; pivot to the responsible host, user, and process lineage, any dropped VM image and
    configuration (.vmx/.wsb) files, the un-inventoried virtualization MAC/IP, and any guest-to-host shared
    folders or outbound channels. A negative result helps rule out this particular hidden-VM vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy
    or living-off-the-land virtualization activity.'
  answer_sources:
  - Sysmon Event ID 11
  - 'NAI: File servers, Standard user endpoints, Web servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "exts = [\".vmdk\",\".vhd\",\".vhdx\",\".vdi\",\".qcow2\",\".img\",\".ova\",\".wsb\"]\nhighrisk\
      \ = [\"C:\\\\Users\\\\\",\"C:\\\\ProgramData\\\\\",\"C:\\\\inetpub\\\\wwwroot\\\\\",\"%TEMP%\",\"\
      /tmp\",\"/dev/shm\"]\nfrom Sysmon EID 11 / auditd: alert if ext(TargetFilename) in exts AND path\
      \ not in approved_allowlist\n   AND path startswith any highrisk"
