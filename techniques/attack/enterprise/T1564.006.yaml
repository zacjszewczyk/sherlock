questions:
- question: '[Stealth] Alert when virtualization MAC OUIs lack inventory records: Can you determine whether
    network traffic is observed from a MAC address whose Organizationally Unique Identifier (OUI) corresponds
    to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels), but this MAC address is not
    registered in the corporate asset management database (CMDB), indicating an untracked virtual instance.
    -- specifically, using the ''Alert when virtualization MAC OUIs lack inventory records'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that network traffic is observed from a MAC address whose Organizationally Unique
    Identifier (OUI) corresponds to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels),
    but this MAC address is not registered in the corporate asset management database (CMDB), indicating
    an untracked virtual instance. This Symbolic Logic approach works as follows: Maintain a watchlist
    of virtualization vendor OUIs (e.g., 00:05:69, 00:0C:29, 00:50:56 for VMware; 08:00:27 for VirtualBox;
    52:54:00 for QEMU/KVM; 00:1C:42 for Parallels). Join Zeek conn.log with dhcp.log on IP to resolve
    MAC, then join to the asset inventory (CMDB) on MAC. Alert if a MAC''s OUI is on the watchlist but
    the MAC is absent from inventory. This is the deterministic floor; keep it even after layering ML.
    Pattern follows portable deterministic matching as in the [SigmaHQ Detection Rules Repository](https://github.com/SigmaHQ/sigma).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable hidden
    virtual instance; pivot to the responsible host, user, and process lineage, any dropped VM image and
    configuration (.vmx/.wsb) files, the un-inventoried virtualization MAC/IP, and any guest-to-host shared
    folders or outbound channels. A negative result helps rule out this particular hidden-VM vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy
    or living-off-the-land virtualization activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Internet gateway/firewall, Core network switches, DHCP servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'watchlist_oui = ["00:05:69","00:0C:29","00:50:56","08:00:27","52:54:00","00:1C:42"]

      resolve MAC per IP = join(conn.log, dhcp.log, on=ip)

      join resolved with CMDB on mac

      alert if oui(mac) in watchlist_oui AND mac not in CMDB'
  - technology: Zeek/pseudocode
    query: 'for c in conn.log: mac = lookup_dhcp(c.orig_h)

      if oui(mac) in virtualization_ouis and mac not in inventory: emit ALERT(mac, c.orig_h)'
- question: '[Stealth] Profile failed/blocked network state for new virtualization MACs: Can you determine
    whether network traffic is observed from a MAC address whose Organizationally Unique Identifier (OUI)
    corresponds to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels), but this MAC address
    is not registered in the corporate asset management database (CMDB), indicating an untracked virtual
    instance. -- specifically, using the ''Profile failed/blocked network state for new virtualization
    MACs'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that network traffic is observed from a MAC address whose Organizationally Unique
    Identifier (OUI) corresponds to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels),
    but this MAC address is not registered in the corporate asset management database (CMDB), indicating
    an untracked virtual instance. This Symbolic Logic approach works as follows: For any newly observed
    virtualization-OUI MAC, treat error-state events as distinct signals: count firewall-blocked/denied
    connections, DHCP NAKs, ARP conflicts, and NXDOMAIN responses attributed to its IP over the first
    hour. Alert if blocked-connection count >= 5 or NXDOMAIN count >= 10, which often accompanies a freshly
    staged bridged VM beaconing to attacker infrastructure. Failure-rate profiling rationale follows [Real-Time
    Detection of DNS Exfiltration and Tunneling from Enterprise Networks, Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable hidden
    virtual instance; pivot to the responsible host, user, and process lineage, any dropped VM image and
    configuration (.vmx/.wsb) files, the un-inventoried virtualization MAC/IP, and any guest-to-host shared
    folders or outbound channels. A negative result helps rule out this particular hidden-VM vector but
    should be corroborated with the other questions in this playbook, since a single method can miss stealthy
    or living-off-the-land virtualization activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Internet gateway/firewall, Core network switches, DHCP servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "for new_mac with oui in virtualization_ouis (first_seen within 1h):\n  blocked = count(firewall_denied[ip(new_mac)])\n\
      \  nak = count(dhcp_NAK[new_mac]); arp_conf = count(arp_conflict[ip]); nx = count(dns_NXDOMAIN[ip])\n\
      alert if blocked >= 5 OR nx >= 10"
- question: '[Stealth] Flag high-entropy, high-volume traffic for new virtualization MACs: Can you determine
    whether network traffic is observed from a MAC address whose Organizationally Unique Identifier (OUI)
    corresponds to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels), but this MAC address
    is not registered in the corporate asset management database (CMDB), indicating an untracked virtual
    instance. -- specifically, using the ''Flag high-entropy, high-volume traffic for new virtualization
    MACs'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that network traffic is observed from a MAC address whose Organizationally Unique
    Identifier (OUI) corresponds to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels),
    but this MAC address is not registered in the corporate asset management database (CMDB), indicating
    an untracked virtual instance. This Statistical Method approach works as follows: For each newly observed
    virtualization-OUI MAC (from dhcp.log), measure over the next 24h from conn.log: total bytes_out/bytes_in
    (Volume), connections/min (Frequency), Shannon entropy of destination ports, and count of distinct
    destination IPs. Alert if any metric exceeds the 95th percentile for newly added devices on that segment.
    Derive segment-specific thresholds from a 30-day baseline. Entropy + distinct-volume scoring with
    Isolation Forest follows [Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
    Alert text must list the top-3 metrics that breached threshold. A positive result -- a rule match,
    statistical outlier, or model alert -- indicates a probable hidden virtual instance; pivot to the
    responsible host, user, and process lineage, any dropped VM image and configuration (.vmx/.wsb) files,
    the un-inventoried virtualization MAC/IP, and any guest-to-host shared folders or outbound channels.
    A negative result helps rule out this particular hidden-VM vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy or living-off-the-land
    virtualization activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Internet gateway/firewall, Core network switches, DHCP servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = 30d percentiles of {bytes,conn_per_min,port_entropy,distinct_dst} per segment for\
      \ new devices\nfor new virtualization-OUI mac over next 24h:\n  vol=sum(bytes_out+bytes_in); freq=conn/min;\
      \ ent=shannon(dst_ports); fan=distinct(dst_ip)\nalert if any metric > p95(baseline[segment]); list\
      \ top-3 breaching metrics"
- question: '[Stealth] Score rogue virtualization MACs with an online autoencoder ensemble: Can you determine
    whether network traffic is observed from a MAC address whose Organizationally Unique Identifier (OUI)
    corresponds to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels), but this MAC address
    is not registered in the corporate asset management database (CMDB), indicating an untracked virtual
    instance. -- specifically, using the ''Score rogue virtualization MACs with an online autoencoder
    ensemble'' (Machine Learning) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that network traffic is observed from a MAC address whose Organizationally Unique
    Identifier (OUI) corresponds to a known virtualization vendor (e.g., VMware, VirtualBox, Parallels),
    but this MAC address is not registered in the corporate asset management database (CMDB), indicating
    an untracked virtual instance. This Machine Learning approach works as follows: Train an online autoencoder
    ensemble on host-level flow features (bytes_out, bytes_in, connection_count, packet jitter, unique_ports
    per time-window) for all inventoried assets, scoring deviation by reconstruction error (RMSE) as in
    [Kitsune: An Ensemble of Autoencoders for Online Network Intrusion Detection, Mirsky et al](https://arxiv.org/abs/1802.09089)
    ([Kitsune-py](https://github.com/ymirsky/Kitsune-py)). Feed the un-inventoried virtualization MAC''s
    traffic; alert on high RMSE versus the learned host baseline and emit the top-3 feature subspaces
    driving the error for analyst triage. A positive result -- a rule match, statistical outlier, or model
    alert -- indicates a probable hidden virtual instance; pivot to the responsible host, user, and process
    lineage, any dropped VM image and configuration (.vmx/.wsb) files, the un-inventoried virtualization
    MAC/IP, and any guest-to-host shared folders or outbound channels. A negative result helps rule out
    this particular hidden-VM vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy or living-off-the-land virtualization activity.'
  answer_sources:
  - Zeek conn.log
  - Zeek dhcp.log
  - 'NAI: Internet gateway/firewall, Core network switches, DHCP servers'
  range: Last 90 days
  queries:
  - technology: ML/pseudocode (Kitsune autoencoder ensemble)
    query: 'features = [bytes_out,bytes_in,conn_count,packet_jitter,unique_ports] per time-window per
      host

      model = KitNET.train(inventoried_assets_flows)

      rmse = model.score(uninventoried_vm_mac_flows)

      alert if rmse > learned_host_threshold; emit top-3 feature subspaces'
- question: '[Stealth] Alert on virtualization binaries with evasive flags: Can you determine whether
    execution of a virtualization command-line utility (e.g., VBoxManage.exe, vmrun.exe, qemu-system-x86_64.exe)
    with arguments indicating headless, silent, or non-interactive operation (e.g., ''--type headless'',
    ''-nogui'', ''-silent'', ''setextradata global GUI/SuppressMessages''). -- specifically, using the
    ''Alert on virtualization binaries with evasive flags'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that execution of a virtualization command-line utility (e.g., VBoxManage.exe, vmrun.exe,
    qemu-system-x86_64.exe) with arguments indicating headless, silent, or non-interactive operation (e.g.,
    ''--type headless'', ''-nogui'', ''-silent'', ''setextradata global GUI/SuppressMessages''). This
    Symbolic Logic approach works as follows: From process creation logs (Sysmon EID 1 / Windows EID 4688),
    match process names ''VBoxManage.exe'',''VBoxHeadless.exe'',''vmrun.exe'',''vmware-vmx*'',''qemu-system-*'',''vmwp.exe'',''vmcompute.exe''
    and alert if the command line contains evasion arguments such as ''--type headless'',''-nogui'',''-nographic'',''-snapshot'',''-display
    none'',''GUI/SuppressMessages'', or (for Windows Sandbox) a ''.wsb'' config with ''<LogonCommand>''/''<MappedFolder>''.
    This deterministic floor mirrors flag allow/deny-list matching in [Suspicious Windows Command Shell
    Arguments, Elastic](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/)
    and [SigmaHQ](https://github.com/SigmaHQ/sigma). Tune the allowlist; do not delete it. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates a probable hidden virtual
    instance; pivot to the responsible host, user, and process lineage, any dropped VM image and configuration
    (.vmx/.wsb) files, the un-inventoried virtualization MAC/IP, and any guest-to-host shared folders
    or outbound channels. A negative result helps rule out this particular hidden-VM vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy
    or living-off-the-land virtualization activity.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Standard user endpoints, Developer workstations, Server infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "procs = [\"VBoxManage.exe\",\"VBoxHeadless.exe\",\"vmrun.exe\",\"vmware-vmx*\",\"qemu-system-*\"\
      ,\"vmwp.exe\",\"vmcompute.exe\"]\nevasive = [\"--type headless\",\"-nogui\",\"-nographic\",\"-snapshot\"\
      ,\"-display none\",\"GUI/SuppressMessages\"]\nfrom EID 4688 / Sysmon EID 1: alert if proc_name in\
      \ procs AND (cmdline matches any evasive\n   OR (proc=Windows Sandbox AND .wsb contains <LogonCommand>\
      \ or <MappedFolder>))"
- question: '[Stealth] Score command-line rarity and entropy: Can you determine whether execution of a
    virtualization command-line utility (e.g., VBoxManage.exe, vmrun.exe, qemu-system-x86_64.exe) with
    arguments indicating headless, silent, or non-interactive operation (e.g., ''--type headless'', ''-nogui'',
    ''-silent'', ''setextradata global GUI/SuppressMessages''). -- specifically, using the ''Score command-line
    rarity and entropy'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that execution of a virtualization command-line utility (e.g., VBoxManage.exe, vmrun.exe,
    qemu-system-x86_64.exe) with arguments indicating headless, silent, or non-interactive operation (e.g.,
    ''--type headless'', ''-nogui'', ''-silent'', ''setextradata global GUI/SuppressMessages''). This
    Statistical Method approach works as follows: Build an enterprise inverse-frequency table of arguments
    used with virtualization processes; for each execution compute a rarity score (sum of -log frequency
    of tokens) and the Shannon entropy of the command line. Alert if rarity exceeds the 99th percentile
    or entropy exceeds a learned per-process threshold, as in [High Command Line Entropy Detected for
    Privileged Commands, Elastic](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html).
    Interpretable features (entropy, special-char ratio, token-length) follow [Obfuscated Command Line
    Detection Using Machine Learning, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/).
    Surface the rarest 3 tokens in the alert. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a probable hidden virtual instance; pivot to the responsible host, user,
    and process lineage, any dropped VM image and configuration (.vmx/.wsb) files, the un-inventoried
    virtualization MAC/IP, and any guest-to-host shared folders or outbound channels. A negative result
    helps rule out this particular hidden-VM vector but should be corroborated with the other questions
    in this playbook, since a single method can miss stealthy or living-off-the-land virtualization activity.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Standard user endpoints, Developer workstations, Server infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'build inverse_freq table of tokens used with virtualization processes (enterprise-wide)

      for each exec: rarity = sum(-log freq(token)); ent = shannon(cmdline)

      alert if rarity > p99 OR ent > learned_per_process_threshold; surface rarest-3 tokens'
- question: '[Stealth] Profile failed/headless launch state: Can you determine whether execution of a
    virtualization command-line utility (e.g., VBoxManage.exe, vmrun.exe, qemu-system-x86_64.exe) with
    arguments indicating headless, silent, or non-interactive operation (e.g., ''--type headless'', ''-nogui'',
    ''-silent'', ''setextradata global GUI/SuppressMessages''). -- specifically, using the ''Profile failed/headless
    launch state'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic, an adversary runs malicious operations inside
    a virtual instance so host- and network-based defenses cannot observe the activity, hiding artifacts
    from security tools and obscuring the origin of VM-generated network traffic. This evidence focuses
    on the condition that execution of a virtualization command-line utility (e.g., VBoxManage.exe, vmrun.exe,
    qemu-system-x86_64.exe) with arguments indicating headless, silent, or non-interactive operation (e.g.,
    ''--type headless'', ''-nogui'', ''-silent'', ''setextradata global GUI/SuppressMessages''). This
    Symbolic Logic approach works as follows: Track execution state as a distinct signal: correlate the
    launch with absence of an interactive GUI window/session (headless), non-zero exit codes, and immediately
    following failed VM boots in hypervisor logs. A virtualization binary launched in session 0 or by
    a non-interactive token with a headless flag is higher-fidelity than the flag alone. Deterministic
    correlation pattern per [SigmaHQ](https://github.com/SigmaHQ/sigma). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates a probable hidden virtual instance; pivot to the
    responsible host, user, and process lineage, any dropped VM image and configuration (.vmx/.wsb) files,
    the un-inventoried virtualization MAC/IP, and any guest-to-host shared folders or outbound channels.
    A negative result helps rule out this particular hidden-VM vector but should be corroborated with
    the other questions in this playbook, since a single method can miss stealthy or living-off-the-land
    virtualization activity.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Standard user endpoints, Developer workstations, Server infrastructure'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "for virtualization proc exec: state = correlate(headless_flag, no_interactive_window,\n  \
      \ non_zero_exit, following_failed_vm_boot in hypervisor_log)\nalert if (session==0 OR non_interactive_token)\
      \ AND headless_flag present"
