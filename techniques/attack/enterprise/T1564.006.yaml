name: 'T1564.006: Hide Artifacts: Run Virtual Instance'
id: 00ec5796-0825-4f7c-bb17-e6ef3e59f431
description: 'This playbook helps an analyst investigate whether an adversary has deployed or executed
  a virtual instance (Run Virtual Instance) to hide malicious activity from host- and network-based defenses
  as part of the Stealth tactic. By running code inside a guest VM -- using native virtualization (Hyper-V,
  Windows Sandbox), lightweight emulators (QEMU/KVM), or dropped binaries (VirtualBox, VMware) -- adversaries
  conceal artifacts from tools that cannot see inside the guest, and bridged networking can make VM-generated
  traffic difficult to attribute to the compromised host. On ESXi, rogue VMs can be started directly with
  /bin/vmx and persisted via rc.local.d/local.sh so they never appear in vCenter inventory. The hunt spans
  Windows, Linux, macOS, and ESXi telemetry and pursues several angles: network traffic from MAC addresses
  bearing virtualization-vendor OUIs that are absent from the asset inventory (CMDB); execution of virtualization
  command-line utilities with headless/silent/non-interactive flags; creation of virtual-disk image files
  (.vmdk, .vhd(x), .vdi, .qcow2) in non-standard or high-risk directories; virtualization binaries spawned
  by unexpected parent processes; and correlated multi-stage sequences (evasive process launch -> large
  disk drop -> new rogue VM network channel) that reveal a deliberately hidden-VM workflow. Detection
  methods combine symbolic-logic rules, statistical baselining/rarity/entropy scoring, and machine-learning
  models (autoencoder ensembles, command-line embeddings, provenance-graph and sequence learning) applied
  to Zeek conn/dhcp logs, Windows Event ID 4688, Sysmon EID 1/11, auditd, macOS unified logs, and ESXi
  hostd/vmkernel logs, so the analyst can corroborate suspected hidden virtual instances across network,
  process, file, and lineage evidence.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
