name: 'T1222.001: File and Directory Permissions Modification: Windows Permissions'
id: 96abe993-f6d1-49cb-844e-5cbc0d1752e4
description: 'This playbook helps an analyst investigate whether an adversary is modifying Windows file
  or directory permissions (Discretionary Access Control Lists, DACLs) to evade access control lists,
  access protected files, or enable persistence and follow-on execution as part of the Defense Impairment
  tactic. It guides a multi-stage hunt across the DACL-manipulation behavioral chain: execution of built-in
  permission-modifying utilities (icacls.exe, cacls.exe, takeown.exe, attrib.exe) and PowerShell Set-Acl
  cmdlets matched to malicious or suspicious administrative patterns (/grant, /deny, /T, /inheritance:r,
  takeown /f); broad rights such as FullControl or Modify granted to permissive principals (Everyone,
  Authenticated Users, Users) on system binaries, service configs, and sensitive directories (C:\Windows\System32,
  C:\Windows\SysWOW64, C:\ProgramData); DACL modifications (Windows Event ID 4670) on persistence-relevant
  objects such as accessibility binaries (sethc.exe, Utilman.exe, magnify.exe, osk.exe), logon/startup
  scripts, and scheduled-task or service binaries; bursts of rapid scripted ACL changes from a single
  user or process; and correlated tamper-to-execution-to-network chains where a directory ACL change is
  followed by process launch from that directory and outbound connectivity. Detection methods combine
  symbolic-logic correlation rules, statistical baselining and change-point detection, and machine-learning
  classifiers, anomaly detectors, and provenance-graph models applied to Windows Security events (4688,
  4670, 4663, 4656), PowerShell script-block logs (4104), Sysmon process and network telemetry (Event
  IDs 1, 3), and Zeek conn.log, so the analyst can corroborate suspected permission tampering against
  the modifying account, process lineage, target object sensitivity, change cadence, and execution/egress
  context.'
type: technique
