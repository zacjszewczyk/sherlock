questions:
- question: '[Defense Impairment] Correlate ACL-modifying commands with resulting DACL changes (Symbolic
    Logic): Can you determine whether a process-creation event or PowerShell script block shows `icacls`,
    `cacls`, `takeown`, `attrib`, or `Set-Acl` being used against a sensitive Windows object, and the
    command or script hash matches a known-malicious indicator or suspicious administrative pattern. --
    specifically using the ''Correlate ACL-modifying commands with resulting DACL changes'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies Windows
    file or directory permissions (DACLs) to evade access control lists, reach protected files, or set
    up durable execution paths, leaving traces in process-creation, PowerShell, file-access, ACL-change,
    and network telemetry. This evidence focuses on the condition that a process-creation event or PowerShell
    script block shows `icacls`, `cacls`, `takeown`, `attrib`, or `Set-Acl` being used against a sensitive
    Windows object, and the command or script hash matches a known-malicious indicator or suspicious administrative
    pattern. This Symbolic Logic approach works as follows: Hash each `icacls`, `cacls`, `takeown`, `attrib`,
    or `Set-Acl` execution from Windows Event ID 4688 and PowerShell Event ID 4104, then join those events
    to Windows Event ID 4670 on the same object within 60 seconds. Match command lines against deterministic
    patterns for permission grants/denials such as `/grant`, `/deny`, `/T`, `/inheritance:r`, `takeown
    /f`, and `Set-Acl` per the [Sigma icacls/ACL rules](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_icacls_deny/).
    Enable the SACL/Audit Authorization Policy Change auditing described in [Microsoft Event 4670 documentation](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4670)
    so the modifying account, process, and original/new SDDL are captured; require [SwiftOnSecurity Sysmon](https://github.com/SwiftOnSecurity/sysmon-config)
    Event ID 1 process lineage as first-party corroboration. Alert when the command both matches a malicious
    signature and changes the DACL on a sensitive object. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates that a Windows permission change is occurring in a way that deviates
    from sanctioned administrative workflows and benign maintenance, and that it may be weakening defenses
    or enabling persistence; pivot to the modifying account and process lineage, the original and new
    SDDL on the object, the target object''s sensitivity and role, and any subsequent file access, execution,
    or outbound connectivity. A negative result helps rule out this permission-tampering vector but should
    be corroborated with the other questions in this playbook, since a single method can miss stealthy,
    low-and-slow, or living-off-the-land ACL manipulation.'
  answer_sources:
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Windows Event ID 4670
  - 'NAI: All Windows endpoints and servers, with a focus on Domain Controllers, authentication servers,
    critical application servers, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# Correlate ACL-modifying commands with resulting DACL changes\nsource IN [Windows Event ID\
      \ 4688, PowerShell Event ID 4104, Windows Event ID 4670]\n| filter command_line MATCHES /(icacls|cacls|takeown|attrib|Set-Acl)/i\n\
      \  AND (args MATCHES /\\/grant|\\/deny|\\/T|\\/inheritance:r|takeown \\/f|FullControl|Modify/i\n\
      \       OR principal IN [Everyone, 'Authenticated Users', Users])\n| join EventID=4670 ON object_name\
      \ WITHIN 60s   # confirm DACL actually changed\n| where object_name IN sensitive_watchlist\n| alert"
- question: '[Defense Impairment] Measure how unusual the permission-change command is for the operator
    (Statistical Method): Can you determine whether a process-creation event or PowerShell script block
    shows `icacls`, `cacls`, `takeown`, `attrib`, or `Set-Acl` being used against a sensitive Windows
    object, and the command or script hash matches a known-malicious indicator or suspicious administrative
    pattern. -- specifically using the ''Measure how unusual the permission-change command is for the
    operator'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies Windows
    file or directory permissions (DACLs) to evade access control lists, reach protected files, or set
    up durable execution paths, leaving traces in process-creation, PowerShell, file-access, ACL-change,
    and network telemetry. This evidence focuses on the condition that a process-creation event or PowerShell
    script block shows `icacls`, `cacls`, `takeown`, `attrib`, or `Set-Acl` being used against a sensitive
    Windows object, and the command or script hash matches a known-malicious indicator or suspicious administrative
    pattern. This Statistical Method approach works as follows: Baseline per user-role the volume (count
    of 4670/min and number of distinct objects touched), frequency (changes/hour), and command-line token
    entropy over a rolling 30-day window, applying change-point detection (CUSUM/PELT) per [Aminikhanghahi
    and Cook](https://pmc.ncbi.nlm.nih.gov/articles/PMC5464762/) to detect abrupt rate shifts. Alert when
    entropy exceeds the user''s 95th percentile, when a change-point fires, or when the target is a first-seen
    sensitive directory for that user or host. Track the success/failure state by joining failed access
    attempts (4663 with access-denied / 5145) so blocked permission edits are profiled as a distinct signal.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates that a Windows
    permission change is occurring in a way that deviates from sanctioned administrative workflows and
    benign maintenance, and that it may be weakening defenses or enabling persistence; pivot to the modifying
    account and process lineage, the original and new SDDL on the object, the target object''s sensitivity
    and role, and any subsequent file access, execution, or outbound connectivity. A negative result helps
    rule out this permission-tampering vector but should be corroborated with the other questions in this
    playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land ACL manipulation.'
  answer_sources:
  - Windows Event ID 4688
  - PowerShell Event ID 4104
  - Windows Event ID 4670
  - 'NAI: All Windows endpoints and servers, with a focus on Domain Controllers, authentication servers,
    critical application servers, and file servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '# Measure how unusual the permission-change command is for the operator

      source IN [Windows Event ID 4688, PowerShell Event ID 4104, Windows Event ID 4670]

      | bin span=1h | stats count AS changes, dc(object_name) AS objs BY user, host, role

      | eval z = (changes - mean_by_role) / stdev_by_role

      | append changepoint(changes) AS cp   # CUSUM/PELT over 30-90d rolling baseline

      | where z > 3.0 OR cp == true OR object_name == first_seen_for(user)

      | eval denied = count(EventID=4663 AND status=access_denied)  # profile blocked attempts

      | alert'
