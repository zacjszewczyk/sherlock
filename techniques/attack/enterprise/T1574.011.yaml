name: 'T1574.011: Hijack Execution Flow: Services Registry Permissions Weakness'
id: 82ac9eea-446f-4a7a-8672-292981a81a13
description: 'This playbook helps an analyst investigate whether an adversary is hijacking the execution
  flow of Windows services by exploiting weak permissions on service Registry keys under HKLM\SYSTEM\CurrentControlSet\Services
  (T1574.011). It guides the hunt across the full set of service-key abuse primitives: redirecting a service''s
  ImagePath/binPath to an attacker-controlled or statistically rare executable, installing new services
  with high-entropy names or anomalous binary locations, pointing ImagePath to user-writable/temp/ProgramData
  directories, creating or modifying Performance/Parameters/ServiceDll keys to load malicious DLLs, populating
  FailureCommand to run elevated recovery payloads, using LOLBAS (rundll32, mshta, powershell) as service
  binaries with encoded or download cradles, and masquerading service DisplayName/Description as legitimate
  services. It also covers tamper of critical security-service keys (Defender, Sysmon, EDR) by flipping
  Start to disabled, anomalous modifying processes (browsers/office apps writing service keys), the full
  permission-change -> value-modify -> service-start escalation sequence (4670 -> 4657 -> 7045/7036/4688),
  and beaconing from services.exe-spawned processes. Detection methods combine symbolic-logic correlation
  rules, statistical baselining/rarity scoring (modified Z-score, entropy/KL-divergence, prevalence percentiles,
  beacon periodicity), and machine-learning models (classifiers, isolation forest/one-class SVM, clustering,
  and provenance-graph learning) applied to Windows Security events (4657, 4670, 4688, 4697), System events
  (7045, 7036, 7040), Sysmon (EID 1, 3, 13), and Zeek conn/dns logs, so the analyst can corroborate suspected
  service-Registry hijacking against process lineage, account privilege, registry value provenance, service
  execution, and downstream network behavior.'
