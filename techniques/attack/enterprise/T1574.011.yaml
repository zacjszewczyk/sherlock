questions:
- question: '[Stealth] ImagePath threat correlation: Can you determine whether a service''s ''ImagePath''
    or ''binPath'' registry value is modified to an executable or script whose path, name, or hash is
    statistically rare, points to a non-standard directory, or matches known threat intelligence, consistent
    with a service start under attacker control. -- specifically, using the ''ImagePath threat correlation''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary abuses weak permissions
    on service Registry keys under HKLM\SYSTEM\CurrentControlSet\Services to redirect a service''s execution
    (via ImagePath/binPath, FailureCommand, Performance/Parameters/ServiceDll, or service install/metadata)
    so adversary-controlled code runs when the service starts -- establishing persistence and/or privilege
    escalation into the service''s account context (SYSTEM, LocalService, NetworkService, or a domain
    account). This evidence focuses on the condition that a service''s ''ImagePath'' or ''binPath'' registry
    value is modified to an executable or script whose path, name, or hash is statistically rare, points
    to a non-standard directory, or matches known threat intelligence, consistent with a service start
    under attacker control. This Symbolic Logic approach works as follows: Alert on Windows Event ID 4657
    / Sysmon EID 13 writes to `\REGISTRY\MACHINE\SYSTEM\CurrentControlSet\Services\*\ImagePath` or `binPath`
    (the canonical key path per MITRE ATT&CK T1574.011 (https://attack.mitre.org/techniques/T1574/011/)
    and exercised by the Atomic Red Team atomics (https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1574.011/T1574.011.md));
    enrich the new path with a hash and compare it to threat intelligence for known malicious binaries.
    Use the SigmaHQ service registry rules (https://github.com/SigmaHQ/sigma/tree/master/rules/windows/registry/registry_set)
    allowlist pattern (svchost, TrustedInstaller, poqexec) to suppress legitimate installers. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable hijacking of service
    execution flow via Registry tampering; pivot to the modifying process and its parent lineage, the
    acting account and its privilege level, the targeted service key and its prior/new values, the resulting
    service-spawned process, and any subsequent network or follow-on activity. A negative result helps
    rule out this particular vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, living-off-the-land, or low-and-slow activity.'
