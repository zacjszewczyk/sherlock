name: 'T1213: Data from Information Repositories'
id: 526aa0a5-a7bc-4473-b6ce-bcb51e5c278c
description: 'Investigate adversary collection of sensitive data from information repositories such as
  SharePoint, Confluence, network file shares, code repositories, messaging platforms (Slack, Microsoft
  Teams), and cloud/IaaS databases. This playbook helps an analyst hunt for and triage abnormal repository
  access and data mining: correlation of repository access with outbound connections to known-malicious
  infrastructure, bursts of access-denied events that signal permission probing and breadth enumeration,
  access to never-before-seen ASNs/countries after repository access, anomalous execution of database-dump
  and data-transfer utilities (sqlcmd, mysqldump, pg_dump, bcp, rclone) under unusual parents, individual
  users exceeding their access baselines or accessing repositories outside their department/AD-group,
  mass file reads followed by compression and staging, and bulk or low-and-slow egress from repository
  hosts. It combines deterministic (symbolic-logic) rules, statistical baselining, and machine-learning
  methods so a SOC analyst can distinguish legitimate collaboration and backup activity from theft of
  policies, diagrams, credentials, source code, PII, and financial records.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did a host that accessed a sensitive information repository (SharePoint, Confluence, or a
    network share) make an outbound connection to a known-malicious IP or domain within 15 minutes of
    that access?
  context: In the Collection phase an adversary who has mined a repository often immediately moves data
    toward attacker-controlled infrastructure. By correlating repository-access events (Windows 4663/5145)
    with Zeek conn.log/dns.log and matching the outbound destination against a high-confidence threat-intelligence
    feed inside a tight 15-minute window, the analyst can catch the hand-off from collection to staging/exfiltration.
    First allow-list expected host->egress relationships so that normal proxies, update servers, and SaaS
    endpoints do not generate noise. A positive result (repository access tightly followed by a malicious-feed
    destination from the same host) is high-fidelity and warrants immediate triage of the user session
    and captured connection context; a negative result helps scope that no known-bad egress accompanied
    the access.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: SharePoint sites, Confluence spaces, and network file shares containing sensitive data (e.g.,
    PII, financial, IP); Active Directory Federation Services (ADFS) servers; network egress points and
    DNS resolvers.'
  range: Last 90 days; event-centered +/-15 minutes around repository access
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'repo_access = events where EventCode in (4663,5145) and object_path in SENSITIVE_REPOS

      egress = zeek_conn join zeek_dns

      join repo_access to egress on src_host within 15m

      where egress.dest in THREATINTEL_MALICIOUS and (src_host->egress.dest) not in ALLOWLIST

      emit alert with user, host, repo_path, dest_ip, domain, bytes'
- question: Is a single source account or host generating a burst of access-denied repository events (failed
    Windows 4663, SharePoint/Confluence 403, CloudTrail AccessDenied) exceeding roughly 20 in 10 minutes?
  context: Explicitly profiling the failure state exposes enumeration and permission-probing against repositories,
    where an adversary systematically tests what they can reach. A short, dense burst of denied accesses
    from one principal indicates probing rather than normal use. Count the access-denied events per account/host
    in a sliding 10-minute window and alert when they exceed a tuned threshold (~20). Rather than a fixed
    number, tune the count per environment using the median-absolute-deviation / modified Z-score method
    so noisy service accounts do not dominate. A positive result is a strong lead for credential misuse
    or insider reconnaissance; benign causes include broken permissions after a migration, which the analyst
    can confirm by checking whether denials cluster on a single newly changed path.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: SharePoint sites, Confluence spaces, and network file shares containing sensitive data (e.g.,
    PII, financial, IP); Active Directory Federation Services (ADFS) servers; network egress points and
    DNS resolvers.'
  range: Last 90 days; sliding 10-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'denied = events where (EventCode=4663 and AccessResult=Failed) or status in (403) or CloudTrail.errorCode=AccessDenied

      bucket by account, host, 10m window

      count_denied = count(*)

      thr = median(count_denied) + 3.5*MAD-based modified_z

      alert when count_denied > max(20, thr)'
- question: After accessing a sensitive repository, did a user connect to an ASN or country never previously
    seen for that user (especially commodity hosting providers)?
  context: Baselining each principal's historical set of destination ASNs and countries lets the analyst
    flag first-seen egress that follows repository access, a pattern consistent with exfiltration to attacker-rented
    infrastructure. Maintain a per-user lookback of observed ASNs/countries; when a post-repository-access
    connection resolves to a never-before-seen ASN/country, record the ASN and raise the event for review.
    Commodity/VPS hosting ASNs newly appearing for a user who just touched sensitive data are especially
    suspicious in the Collection->Exfiltration transition. A positive result is a trend-worthy lead (track
    the ASN across users); a negative result confirms egress stayed within known providers. Expect legitimate
    first-seen hits from travel, new SaaS, or VPNs, which the analyst dispositions via reputation and
    context.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: SharePoint sites, Confluence spaces, and network file shares containing sensitive data (e.g.,
    PII, financial, IP); Active Directory Federation Services (ADFS) servers; network egress points and
    DNS resolvers.'
  range: Last 90 days (per-principal lookback for baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline[user] = set(ASN,country) over prior 90d\nfor conn following repo_access(user) within\
      \ 1h:\n  if (conn.ASN,conn.country) not in baseline[user]:\n    enrich is_hosting=lookup(ASN)\n\
      \    alert first_seen_asn with user, ASN, country, is_hosting"
- question: When sessions involving repository access are risk-scored with a gradient-boosting model,
    which sessions rank highest and what features drive the score?
  context: A supervised gradient-boosting model can combine many weak signals into a single, prioritized
    session-risk score, helping the analyst focus on the riskiest Collection activity. Features include
    time-to-egress after repository access, outbound volume (orig_bytes), destination reputation, ASN
    newness, domain newness, and the sensitivity of the accessed repository. Persist the score and surface
    the top-3 contributing features (e.g., bytes, new-ASN, repository sensitivity) directly in the alert
    text so the analyst understands why a session scored high. A high score with explanatory features
    like large bytes to a new ASN after high-sensitivity access is a strong exfiltration candidate; low
    scores deprioritize routine sessions. The model requires periodic retraining and validation against
    labeled incidents to remain calibrated.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Windows Event ID 4624
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: SharePoint sites, Confluence spaces, and network file shares containing sensitive data (e.g.,
    PII, financial, IP); Active Directory Federation Services (ADFS) servers; network egress points and
    DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = [time_to_egress, orig_bytes, dest_reputation, asn_newness, domain_newness, repo_sensitivity]

      score = GradientBoosting.predict_proba(features)

      explain = SHAP(features); top3 = top_features(explain,3)

      persist score; alert when score > 0.8 with top3'
- question: Did a database-dump or data-transfer utility (sqlcmd, bcp, mysqldump, pg_dump, rclone) run
    under an unexpected parent process (e.g., w3wp.exe, tomcat.exe) or redirect output to a user/temp
    staging directory?
  context: Adversaries who reach a database server often use built-in or living-off-the-land tools to
    dump data, but they frequently launch them from non-interactive contexts such as a compromised web
    application worker (w3wp.exe, tomcat.exe) or write the output to unusual staging paths. By alerting
    when these utilities appear with non-approved parents or with command lines redirecting to temp/user
    directories, the analyst catches automated/scripted collection from repositories and databases. Maintain
    an allow-list of legitimate parent->utility relationships (e.g., scheduled backup jobs). A positive
    result, like mysqldump spawned by tomcat writing to C:\Users\Public, strongly suggests webshell-driven
    data theft; a negative result shows the utility ran under expected, sanctioned parents.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Production and development database servers (e.g., SQL, Oracle, PostgreSQL); web servers with
    database connectivity; endpoints of DBAs, developers, and system administrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "proc = events where EventCode=4688 and image in (sqlcmd.exe,bcp.exe,mysqldump.exe,pg_dump.exe,rclone.exe)\n\
      alert when parent_image in (w3wp.exe,tomcat.exe,php-cgi.exe,java.exe)\n   or cmdline matches output\
      \ to (\\Temp\\,\\Users\\,/tmp/)\nand (parent_image->image) not in ALLOWLIST"
- question: Does the command line of a database/transfer utility deviate strongly from how this user normally
    invokes that same utility?
  context: Legitimate operators tend to run the same tools with consistent argument patterns. By computing
    the Jaccard similarity of command-line tokens for each user-utility pair against their historical
    norm and flagging scores below 0.5, the analyst surfaces unusual invocations that may indicate misuse
    or an attacker reusing a tool in a novel way. Pair this with a robust modified Z-score (|z|>3.5) on
    rare-token frequency so a single odd argument does not over-trigger. A positive result (low similarity
    plus rare tokens such as an unfamiliar output path or remote target) merits review of the full session;
    a negative result indicates the invocation matches the user's established pattern. This statistical
    approach complements the parent/redirection rule by catching abuse that uses approved parents.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Production and development database servers (e.g., SQL, Oracle, PostgreSQL); web servers with
    database connectivity; endpoints of DBAs, developers, and system administrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'tokens = tokenize(cmdline)

      sim = jaccard(tokens, baseline_tokens[user,utility])

      rare_z = modified_zscore(rare_token_freq)

      alert when sim < 0.5 and abs(rare_z) > 3.5'
- question: When command lines are embedded with a language model and scored for anomaly, which data-mining/dump
    commands are the rarest outliers and what tokens make them anomalous?
  context: Token-similarity rules can miss semantically novel commands. Embedding command lines with a
    BERT-style model and applying unsupervised outlier detection (Isolation Forest, COPOD, or an autoencoder)
    lets the analyst find rare data-mining and dump commands even when individual tokens look ordinary.
    Surface the most anomalous tokens (e.g., a target FQDN or unusual output path) as the explanation
    so triage is fast. A high anomaly score on a sqlcmd/rclone command pointing at an unfamiliar destination
    is a strong collection/exfiltration lead; common, repetitive operational commands score low. The model
    is unsupervised, so the analyst validates flagged outliers against context and feeds dispositions
    back to reduce drift.
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - 'NAI: Production and development database servers (e.g., SQL, Oracle, PostgreSQL); web servers with
    database connectivity; endpoints of DBAs, developers, and system administrators.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'emb = BERT_encode(cmdline)

      score = IsolationForest/COPOD.decision_function(emb)

      anom_tokens = saliency(emb -> tokens)

      alert when score in top 1% with anom_tokens (FQDN,output_path)'
- question: Did a user access a repository path or site reserved for a different AD group/department,
    or trigger unusual external sharing of sensitive documents?
  context: Repositories are typically partitioned by department and sensitivity (Finance, HR, Engineering-SourceCode).
    When a user accesses a path or SharePoint site reserved for an AD group they do not belong to, or
    initiates external sharing of sensitive documents, it can indicate scoping/collection beyond their
    role or abuse of external-sharing features (akin to transferring data to a cloud account). Implement
    this as a deterministic access-matrix policy mapping AD-group membership to authorized repository
    segments and alert on violations and anomalous external shares. A positive result is a clear policy
    breach worth investigating for insider activity or compromised credentials; a negative result confirms
    access stayed within entitled segments. Tune by keeping the AD-group-to-path mapping current as projects
    and teams change.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek http.log
  - 'NAI: SharePoint Online tenant, Confluence server, network file shares categorized by data sensitivity
    and departmental ownership (e.g., ''Finance'', ''HR'', ''Engineering-SourceCode'').'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "access = events where EventCode in (4663,5145) or m365 SharePoint access\nowner_group = lookup_department(object_path)\n\
      alert when owner_group not in ad_groups(user)\n   or sharing_action=external and doc_sensitivity\
      \ in (Confidential,Restricted)"
- question: Is a single account producing repeated permission-denied events across many distinct repository
    paths within 15 minutes?
  context: 'Whereas a burst of denials on one path may be a permissions glitch, denials spread across
    many distinct repository paths from one account within a short window indicate breadth-enumeration:
    the user/attacker is sweeping repositories to map what is reachable. Count distinct denied paths (failed
    4663/5145, SharePoint 403) per account in a 15-minute window and alert when the breadth exceeds an
    environment-tuned threshold derived via the modified Z-score. A positive result is a strong reconnaissance
    signal in the Collection phase; benign causes are uncommon for wide path breadth but can include misconfigured
    automation, which the analyst checks by reviewing the account type and the paths touched.'
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek http.log
  - 'NAI: SharePoint Online tenant, Confluence server, network file shares categorized by data sensitivity
    and departmental ownership (e.g., ''Finance'', ''HR'', ''Engineering-SourceCode'').'
  range: Last 90 days; sliding 15-minute windows
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'denied = events where access_failed across repo paths (4663 failed,5145 failed,403)

      bucket by account, 15m window

      distinct_paths = dcount(object_path)

      thr = robust modified_z over baseline distinct_paths

      alert when distinct_paths > thr'
- question: Did a user's daily count of unique files/pages accessed from a repository exceed their 98th-percentile
    30-day baseline?
  context: Mass collection often shows up as a sudden spike in the breadth of distinct objects a user
    touches. Baseline each user's daily unique repository access count over 30 days and flag days exceeding
    the 98th percentile or a robust modified Z-score above 3.5. Using the modified (MAD-based) Z-score
    resists distortion from occasional legitimate batch jobs. A positive result, a user reading far more
    distinct files than ever before, is a leading indicator of staging for exfiltration; a negative result
    indicates volume within normal bounds. The analyst dispositions spikes by checking for legitimate
    triggers (audits, migrations, new role) versus unexplained bulk access to sensitive segments.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek http.log
  - 'NAI: SharePoint Online tenant, Confluence server, network file shares categorized by data sensitivity
    and departmental ownership (e.g., ''Finance'', ''HR'', ''Engineering-SourceCode'').'
  range: Last 90 days (30-day baseline window)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'daily_unique[user,day] = dcount(object) where access events

      p98 = percentile(daily_unique[user], 98)

      mz = modified_zscore(daily_unique[user])

      alert when today > p98 or mz > 3.5'
- question: Does a user's repository access deviate significantly from that of their peer group (similar
    role/department)?
  context: Peer-group analytics catch users whose behavior diverges from colleagues doing similar work,
    even when their own history looks unremarkable. Build per-user peer groups (by role/department/AD
    group) and score deviation from peers using cosine/centroid distance beyond the 95th percentile, via
    UEBA peer-group analytics or graph embeddings. Surface the top-3 contributing features (e.g., access
    to a new site, breadth of files, off-hours activity) so triage is explainable. A positive result (a
    user far from their peer centroid on sensitive-access features) flags potential insider collection
    or compromised credentials; a negative result indicates the user behaves like peers. Effective peer
    grouping depends on accurate role/department metadata, which the analyst should verify.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek http.log
  - 'NAI: SharePoint Online tenant, Confluence server, network file shares categorized by data sensitivity
    and departmental ownership (e.g., ''Finance'', ''HR'', ''Engineering-SourceCode'').'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'peers = group_users_by(role,department,ad_group)

      vec[user] = feature_vector(sites,breadth,offhours,sensitivity)

      dist = cosine_distance(vec[user], centroid(peers))

      alert when dist > p95(peer_distances) with SHAP top3'
- question: When each user's daily repository/file activity is scored by an online deep model, which users
    are most anomalous and which activity categories (file, logon, http) explain it?
  context: An online RNN/DNN can model each user's normal daily activity and decompose anomalies into
    contributing categories (file access, logon, http) for analyst-readable explanations. This insider-threat-oriented
    approach surfaces users whose combined file/logon/http behavior is unusual day-over-day and tells
    the analyst which dimension drove the alert. A high anomaly score dominated by the 'file' category
    for a user touching sensitive repositories suggests collection; a logon-dominated anomaly may point
    elsewhere. The model is trained/validated on insider-threat datasets and runs online so it adapts
    over time; the analyst uses the per-category decomposition to prioritize and to choose the next investigative
    pivot.
  answer_sources:
  - Windows Event ID 4663
  - Windows Event ID 5145
  - Zeek http.log
  - 'NAI: SharePoint Online tenant, Confluence server, network file shares categorized by data sensitivity
    and departmental ownership (e.g., ''Finance'', ''HR'', ''Engineering-SourceCode'').'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'daily_features[user] = {file:..., logon:..., http:...}

      score, contrib = OnlineRNN.score(daily_features[user])

      alert when score anomalous; show contrib by category (file/logon/http)'
- question: Did a (user, host) pair perform a high volume of reads (>1000) from a sensitive share within
    30 minutes and then launch a compression tool (7z.exe, rar.exe) within 5 minutes?
  context: A classic collection-to-staging sequence is bulk reading from a sensitive share followed quickly
    by archiving the data for exfiltration. Alert when a (user, host) pair logs more than ~1000 read events
    (Windows 5145/4663) from a designated sensitive share within 30 minutes and then creates a compression
    process (7z.exe, rar.exe) within 5 minutes. Allow-list legitimate backup/archival parents so scheduled
    jobs do not trigger. A positive result is a high-fidelity staging indicator warranting immediate containment
    review of the archive output and the host; a negative result shows reads were not chained to compression.
    The analyst should locate and inspect the resulting archive file and check for subsequent egress.
  answer_sources:
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Network file shares containing intellectual property, PII, or financial records; user endpoints,
    particularly for privileged users, executives, and finance personnel.'
  range: Last 90 days; 30-minute read window + 5-minute compression follow-on
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'reads = events where EventCode in (5145,4663) and share in SENSITIVE_SHARES

      count_reads = count by (user,host) over 30m

      comp = events where EventCode=4688 and image in (7z.exe,rar.exe,winrar.exe)

      alert when count_reads>1000 then comp within 5m and parent not in BACKUP_ALLOWLIST'
- question: Has a user-host's read/write ratio spiked far above its baseline (e.g., >100:1 with read counts
    at |z|>3.5)?
  context: 'Data collection is read-heavy: an attacker or insider gathering files generates many reads
    relative to writes. Track the read/write ratio per user-host and flag spikes above ~100:1 where the
    read count also exceeds a robust modified Z-score of 3.5 over the user''s baseline. Using the MAD-based
    Z-score keeps the threshold robust against bursty but legitimate activity. A positive result (an unusually
    lopsided read-heavy session on sensitive shares) suggests bulk collection even without an immediate
    compression event; a negative result indicates balanced or normal I/O. The analyst correlates spikes
    with the share''s sensitivity and the user''s role to disposition.'
  answer_sources:
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Network file shares containing intellectual property, PII, or financial records; user endpoints,
    particularly for privileged users, executives, and finance personnel.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'reads = count(read events); writes = count(write events) by (user,host) window=1h

      ratio = reads / max(writes,1)

      rz = modified_zscore(reads vs baseline[user,host])

      alert when ratio > 100 and rz > 3.5'
- question: When normal per-host repository/file access sequences are modeled with an LSTM, do any sessions
    show an out-of-order or unexpected 'mass-read -> compression -> egress' pattern?
  context: Sequence models learn the normal ordering of access log keys per host; the malicious staging
    chain (mass file read, then compression, then egress) is an out-of-sequence pattern they can flag.
    Train an LSTM (DeepLog-style) on normal log-key sequences and alert when a host produces an unexpected
    ordering consistent with collection-and-stage. Retain a legacy HMM transition model ('Mass File Read'
    -> 'Data Compression') in parallel to catch high-probability malicious transitions and provide a simpler
    corroborating signal. A positive result is a strong staging indicator with sequence context for the
    analyst; a negative result indicates activity followed learned-normal patterns. The model needs sufficient
    clean training data per host class to avoid false positives on rare-but-benign workflows.
  answer_sources:
  - Windows Event ID 5145
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Network file shares containing intellectual property, PII, or financial records; user endpoints,
    particularly for privileged users, executives, and finance personnel.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'seq = ordered_log_keys(host)

      pred = LSTM.next_key(seq); anomaly = observed not in top_k(pred)

      hmm = HMM.transition_prob(''MassFileRead''->''DataCompression'')

      alert when anomaly or hmm high for mass-read->compression->egress'
- question: Did a host resolve a blocklisted domain and then make a high-volume (>100MB) connection within
    1 hour of accessing a sensitive repository, or show repeated NXDOMAIN/blocked connections suggesting
    beaconing?
  context: 'Correlating repository access with DNS and connection logs catches the exfiltration tail of
    a collection operation. Alert when a host accesses a sensitive repository, then resolves a blocklisted
    domain and makes a matching high-volume (>100MB) connection within an hour. Also profile the failure
    state: repeated NXDOMAIN or blocked connection attempts can indicate command-and-control beaconing
    or DGA behavior even when no large transfer succeeds. A positive result (repository access followed
    by blocklisted-domain resolution and a large transfer) is high-fidelity exfiltration evidence; the
    beaconing failure pattern is a separate lead for C2. The analyst confirms by reviewing the destination
    reputation and the volume/timing of the connection.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5145
  - 'NAI: Network egress points (firewalls, proxies), DNS resolvers, and the information repositories
    themselves (network shares, SharePoint servers) to enable correlation.'
  range: Last 90 days; 1-hour correlation window after repository access
  queries:
  - technology: Zeek/pseudocode
    query: 'repo = win5145 access to sensitive shares/SharePoint

      dns = dns.log where query in BLOCKLIST or answer=NXDOMAIN

      conn = conn.log where orig_bytes > 100MB

      alert when repo then (dns blocklist + conn>100MB) within 1h

      also alert when repeated NXDOMAIN/blocked from same host (beaconing)'
- question: Did an endpoint's hourly outbound volume to a single external IP exceed its 30-day baseline
    by more than 3 standard deviations (or modified Z>3.5) shortly after accessing a sensitive repository?
  context: Bulk exfiltration manifests as an anomalous spike in outbound bytes to a single destination.
    Baseline 30-day hourly orig_bytes per host and alert when an hour exceeds mu+3sigma (or a robust modified
    Z-score above 3.5), highlighting any prior sensitive-repository access from the same host within the
    window. The MAD-based threshold keeps detection robust to legitimate bursty backups. A positive result,
    a large egress spike to one external IP after repository access, is a strong exfiltration indicator;
    a negative result confirms egress stayed within normal hourly volumes. The analyst dispositions by
    checking whether the destination is a sanctioned backup/cloud endpoint and whether the volume matches
    expected transfers.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5145
  - 'NAI: Network egress points (firewalls, proxies), DNS resolvers, and the information repositories
    themselves (network shares, SharePoint servers) to enable correlation.'
  range: Last 90 days (30-day hourly baseline)
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'hourly[host,dest] = sum(orig_bytes) per hour from conn.log

      mu,sigma = baseline(hourly[host], 30d); mz=modified_zscore(hourly[host])

      alert when hourly > mu+3*sigma or mz>3.5 and prior repo_access within window'
- question: Are there signs of low-and-slow exfiltration, e.g., steady per-destination query volume, high
    payload entropy, and regular timing that evade volume thresholds?
  context: Sophisticated actors throttle exfiltration to stay under volume alarms, often tunneling data
    over DNS or other channels. Profile per-destination query volume, payload entropy, and timing regularity
    and use behavioral features with an Isolation Forest to detect stealthy low-throughput leakage. High-entropy
    payloads, unusually steady inter-arrival timing, and sustained query volume to one destination are
    hallmarks of covert channels. A positive result is a lead for DNS-tunneling or slow exfiltration that
    the volume-spike detector would miss; a negative result reduces suspicion of covert channels. The
    analyst pivots to the destination domain's registration/reputation and inspects sample payloads to
    confirm encoding.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5145
  - 'NAI: Network egress points (firewalls, proxies), DNS resolvers, and the information repositories
    themselves (network shares, SharePoint servers) to enable correlation.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'per_dest = features(query_volume, mean_payload_entropy, timing_regularity, subdomain_len)

      score = IsolationForest.decision_function(per_dest)

      alert when score anomalous (low-and-slow / DNS tunneling profile)'
- question: When bulk egress from repository hosts is scored in real time by an online autoencoder ensemble,
    which flows are most anomalous and what flow features explain them?
  context: An unsupervised online autoencoder ensemble (Kitsune-style) over flow volume/timing features
    can score anomalous bulk egress from repository hosts as it happens, complementing batch baselines.
    High reconstruction error on flows from a repository host indicates volume/timing behavior the model
    has not seen. Surface the top-3 contributing flow features (e.g., bytes, duration, packet timing)
    for explainability, and retain Seasonal-Hybrid ESD/Prophet on 5-minute intervals in parallel to catch
    seasonal anomalies. A positive result (high reconstruction error with bytes/duration as drivers from
    a sensitive host) is a real-time exfiltration lead; a negative result indicates flows match learned
    norms. As an online model, it adapts continuously, so the analyst should account for concept drift
