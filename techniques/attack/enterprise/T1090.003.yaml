questions:
- question: 'Using deterministic rule logic, can you determine whether ''Match exit node intelligence''
    indicates multi-hop proxy command-and-control activity? Specifically: Correlate the destination IP
    (id.resp_h) from Zeek conn.log and the resolved IP from Zeek dns.log against (1) the public Tor directory
    consensus relay/exit/guard IP list (collector.torproject.org) and (2) proxy/C2 threat-intel feeds,
    and alert on any match. Also alert on any attempted resolution of a `.onion` name in dns.log, which
    is anomalous inside an enterprise ([Tor: The Second-Generation Onion Router](https://svn.torproject.org/svn/projects/design-paper/tor-design.pdf);
    [ORB Proxy Networks](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies)).'
  context: 'Tactic context (Command and Control / Command and Control): the adversary is trying to communicate
    with compromised systems by routing C2 through chained proxies (Tor/onion routing, ORB networks, P2P,
    or compromised network devices) to hide the true source. Evidence under investigation: An outbound
    TCP/UDP connection from an internal asset to an external IP address or domain known to be associated
    with Tor, public proxies, or adversary-controlled proxy infrastructure based on threat intelligence.
    Approach (Match exit node intelligence): Correlate the destination IP (id.resp_h) from Zeek conn.log
    and the resolved IP from Zeek dns.log against (1) the public Tor directory consensus relay/exit/guard
    IP list (collector.torproject.org) and (2) proxy/C2 threat-intel feeds, and alert on any match. Also
    alert on any attempted resolution of a `.onion` name in dns.log, which is anomalous inside an enterprise
    ([Tor: The Second-Generation Onion Router](https://svn.torproject.org/svn/projects/design-paper/tor-design.pdf);
    [ORB Proxy Networks](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies)).
    A positive result means traffic is being relayed/anonymized through multi-hop proxy infrastructure
    in a way inconsistent with sanctioned VPN/relay activity; a negative result means the observed behavior
    matches expected baselines and allowlisted relays. Investigate the named area of interest (Network
    Egress Points, Centralized DNS Resolvers, Endpoint Devices) and pivot from any hit to the originating
    host, process, and account, then trace the relay chain hop-by-hop and correlate with downstream C2,
    lateral movement, and data-staging activity tied to the Command and Control tactic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points, Centralized DNS Resolvers, Endpoint Devices'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Rule: Match exit node intelligence (Tor/proxy/C2 TI)\nLOAD tor_consensus = feed('collector.torproject.org')\
      \  // relay/guard/exit IPs\nLOAD proxy_c2_ti  = threatintel_feed(['proxy','c2','orb'])\nFOR conn\
      \ IN zeek.conn.log, dns IN zeek.dns.log:\n  IF conn.id.resp_h IN (tor_consensus UNION proxy_c2_ti)\n\
      \     OR dns.answers IN (tor_consensus UNION proxy_c2_ti)\n     OR dns.query ENDSWITH '.onion'\n\
      \  THEN alert(high, host=conn.id.orig_h, dst=conn.id.resp_h, reason='proxy/Tor TI match')"
- question: 'Using statistical baselining, can you determine whether ''Detect rare ASN/country destinations''
    indicates multi-hop proxy command-and-control activity? Specifically: For all outbound connections,
    compute the historical rarity of the destination ASN and country. Flag connections to an ASN in the
    bottom 5th percentile of the org''s observed ASNs or to a country with no business nexus. Because
    ORB networks rotate short-lived residential/VPS exit IPs, prioritize destinations that are both rare
    AND newly observed (first-seen within 24h), and derive percentile cutoffs per egress point from a
    30-day baseline ([ORB Proxy Networks](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies)).'
