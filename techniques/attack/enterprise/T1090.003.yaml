    contributing features per alert ([Isolation Forest vs. Autoencoders, Ramaswamy & Palanisamy](https://ieeexplore.ieee.org/document/10143005/);
    [SHAP for IDS](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full)).
    A positive result means traffic is being relayed/anonymized through multi-hop proxy infrastructure
    in a way inconsistent with sanctioned VPN/relay activity; a negative result means the observed behavior
    matches expected baselines and allowlisted relays. Investigate the named area of interest (Network
    Infrastructure Segments (Routers, Switches), DNS Servers, Network Egress Points) and pivot from any
    hit to the originating host, process, and account, then trace the relay chain hop-by-hop and correlate
    with downstream C2, lateral movement, and data-staging activity tied to the Command and Control tactic.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
