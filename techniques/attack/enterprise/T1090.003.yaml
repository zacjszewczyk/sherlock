  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Rule: Match proxy/C2 JA3/JA4 + suspicious certs\nLOAD ja_watchlist = fingerprints(['tor','meek','psiphon','cobaltstrike'])\n\
      FOR ssl IN zeek.ssl.log, cert IN zeek.x509.log:\n  IF ssl.ja3 IN ja_watchlist OR ssl.ja3s IN ja_watchlist\
