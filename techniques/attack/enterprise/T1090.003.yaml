- question: 'Using statistical baselining, can you determine whether ''Flag high-entropy certificates''
    indicates multi-hop proxy command-and-control activity? Specifically: For each new X.509 certificate
    in x509.log, compute the Shannon entropy of the subject and issuer common-name fields; flag entropy
    > 3.5 (algorithmically generated names common in C2/proxy frameworks). Derive the threshold from the
    99th percentile of your own cert corpus to avoid CDN false positives ([Real-Time DNS Exfiltration
    Detection, Nadler et al.](https://arxiv.org/abs/1709.08395)).'
