- question: 'Using statistical baselining, can you determine whether ''Profile blocked/failed egress to
    anonymizers'' indicates multi-hop proxy command-and-control activity? Specifically: Treat failure
    as signal. Count per-host firewall-blocked outbound connections and NXDOMAIN/SERVFAIL responses for
    `.onion` or proxy domains over a sliding 1-hour window; a host generating a burst of blocked egress
    or failed anonymizer resolutions (e.g., >10/hour above its baseline) indicates a client repeatedly
    attempting to reach proxy infrastructure ([ORB Proxy Networks](https://cloud.google.com/blog/topics/threat-intelligence/orb-proxy-networks-defense-strategies)).'
