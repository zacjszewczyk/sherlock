name: 'T1090.003: Multi-hop Proxy'
id: b229388f-742d-4d03-b5b4-9e1595ecdfc1
description: 'This playbook helps an analyst investigate Multi-hop Proxy (T1090.003): adversaries chaining
  multiple proxies (Tor/onion routing, ORB networks of VPS/IoT/end-of-life routers, P2P/blockchain infrastructure,
  or compromised network devices implementing onion routing) to disguise the true source of command-and-control
  traffic. It guides the analyst across complementary investigative angles: matching outbound connections
  and DNS resolutions against Tor consensus relays/exit nodes and proxy/C2 threat-intel (including anomalous
  .onion resolution); profiling rare and newly-observed destination ASNs/countries characteristic of rotating
  ORB exit IPs; fingerprinting proxy/C2 TLS stacks via JA3/JA4 and suspicious X.509 certificates (self-signed,
  short-lived, high-entropy names); detecting stepping-stone/pivot behavior through fan-in/fan-out funnels,
  ON/OFF timing correlation, and learned flow correlation of relay legs; spotting low-jitter beaconing
  and periodic C2 via coefficient-of-variation and FFT analysis; and surfacing protocol tunneling such
  as oversized ICMP payloads, high-entropy/long DNS queries, and encrypted sessions to non-management
  network devices. Detection blends symbolic-logic rules, statistical baselining (percentiles, entropy,
  timing variance, failure-rate profiling), and machine learning (Random Forest, one-class SVM/autoencoder,
  graph anomaly detection, CNN flow correlation) to produce evasion-resistant, explainable alerts supporting
  the Command and Control tactic.'
type: technique
