- question: 'Using deterministic rule logic, can you determine whether ''Match proxy JA3 fingerprints''
    indicates multi-hop proxy command-and-control activity? Specifically: Scan Zeek ssl.log for JA3/JA3S
    (and version-resilient JA4+) hashes matching a watchlist for Tor, meek, Psiphon, or Cobalt Strike
    client stacks, independent of destination IP. Also flag x509.log certificates that are self-signed
    (issuer==subject) or have validity < 90 days. Alert on any match ([JA3](https://github.com/salesforce/ja3);
    [JA4+](https://github.com/FoxIO-LLC/ja4); [Tor design](https://svn.torproject.org/svn/projects/design-paper/tor-design.pdf)).'
