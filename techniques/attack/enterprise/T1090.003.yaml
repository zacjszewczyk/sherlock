- question: 'Using statistical baselining, can you determine whether ''Detect Tor cell-padding signature''
    indicates multi-hop proxy command-and-control activity? Specifically: Tor multiplexes traffic in fixed-size
    512-byte cells, producing an unusually low-variance packet-size distribution and constant-rate flows.
    For each long-lived TLS flow compute the standard deviation of packet sizes and the modal packet size;
    flag flows whose packet-size variance is far below the egress baseline (machine-like padding) toward
    a non-allowlisted destination ([Tor design](https://svn.torproject.org/svn/projects/design-paper/tor-design.pdf);
    [ISCXTor2016, Lashkari et al.](https://www.unb.ca/cic/datasets/tor.html)).'
