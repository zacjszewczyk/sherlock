questions:
- question: '[Collection] IOC hash/AV match for audio capture: Can you determine whether a process, identified
    by its hash or name, is created that matches a known indicator of compromise (IOC) for audio capture
    malware. -- specifically, using the ''IOC hash/AV match for audio capture'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary leverages a host''s microphone,
    webcam, or call applications to record audio and stage it for later exfiltration, leaving traces in
    process-execution, device-access, file-write, and network telemetry. This evidence focuses on the
    condition that a process, identified by its hash or name, is created that matches a known indicator
    of compromise (IOC) for audio capture malware. This Symbolic Logic approach looks for the following
    signal: Query Windows Event ID 4688/Sysmon Event ID 1 (and linux:Sysmon 1 / macos:unifiedlog) for
    process hashes/names in CTI feeds and correlate with Defender Event IDs 1116/1117 for audio capture
    threat names; seed with known audio-capture tooling such as Attor''s waveInOpen/waveInStart recorder
    plugin and its stage-then-Tor-exfil chain [ESET discovers Attor, a spy platform](https://www.welivesecurity.com/2019/10/10/eset-discovers-attor-spy-platform/).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests a process on the
    host is accessing audio input devices or recording audio in a way that deviates from sanctioned collaboration
    software and normal user behavior; pivot to the responsible process, its parent lineage, the user/device
    context, any audio files written to disk, and subsequent outbound transfers. A negative result helps
    rule out this audio-capture vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, context-triggered, or living-off-the-land recording.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Defender Event ID 1116
  - Windows Defender Event ID 1117
  - 'NAI: User workstations, laptops, conference room systems, and executive endpoints.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# IOC hash/AV match for audio capture

      source IN [Windows Event ID 4688, Sysmon Event ID 1, Windows Defender Event ID 1116, Windows Defender
      Event ID 1117]

      | WHERE matches_action_criteria("IOC hash/AV match for audio capture")

      // Query Windows Event ID 4688/Sysmon Event ID 1 (and linux:Sysmon 1 / macos:unifiedlog) for process
      hashes/names in CTI feeds and correlate wi

      | ALERT enrich(host, user, process, parent, file, dest)'
