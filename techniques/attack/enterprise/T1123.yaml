name: 'T1123: Audio Capture'
id: 2df78446-aafe-49f3-967d-871f386605c7
description: 'This playbook helps an analyst investigate whether an adversary is capturing audio from
  endpoint devices (microphones, webcams, or voice/video call applications) to eavesdrop on sensitive
  conversations as part of the Collection tactic. It guides the hunt across several behavioral angles
  spanning Windows, Linux, and macOS: execution of known audio-capture malware or tooling matched by hash/name/AV
  detection (e.g., Attor''s recorder plugin); command-line and script-block invocations of audio-recording
  utilities and APIs (ffmpeg -f alsa/pulse/avfoundation, arecord, parecord, sox, SoundRecorder, mciSendString,
  waveInOpen, System.Media.SoundPlayer, Get-AudioDevice, osascript-driven QuickTime); audio-capable applications
  launched by unusual parents or spawning suspicious children, plus microphone consent/device-active tracking
  via Windows CapabilityAccessManager registry writes and macOS TCC/CoreAudio events; creation of audio-format
  files (.wav/.mp3/.m4a/.aiff/.ogg/.flac) and periodic, near-linear write behavior to temp/user-writable
  staging directories; and outbound transfers of audio-like data to rare or blocked destinations shortly
  after an audio file is written. Detection methods combine symbolic-logic rules, statistical baselining/forecasting,
  and machine-learning models applied to Windows Security/Sysmon/Defender events, PowerShell script-block
  logs, auditd, macOS unified/TCC logs, and Zeek/Sysmon network telemetry, so the analyst can corroborate
  suspected audio capture against process lineage, device-access consent, write volume, and exfiltration
  context.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
