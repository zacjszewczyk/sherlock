    as potential C2, per [Kitsune/KitNET](https://arxiv.org/abs/1802.09089); detect high-jitter beacons
    that defeat fixed CV/FFT thresholds with LSTM/transformer time-series models per [Gupta et al. (ARES
    2025)](https://link.springer.com/chapter/10.1007/978-3-032-00627-1_20), and report the top-3 contributing
    features in alerts via [SHAP](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).
    A positive result -- a deterministic IOC/rule match, a statistical outlier, or a model alert -- indicates
    an internal host is likely communicating with adversary-acquired infrastructure; pivot to the responsible
    host and process, the destination IP/domain/ASN and its registration and certificate/JA3-JA4 fingerprint,
    the byte volume, success/failure pattern, and cadence of the sessions, and any preceding delivery
    or execution activity, then scope how many hosts touched the same infrastructure. A negative result
    helps rule out this particular C2/infrastructure channel but should be corroborated with the other
    questions in this playbook, since a single method can miss freshly staged, sinkholed, low-and-slow,
    domain-fronted, or TLS-1.3-obscured infrastructure.'
