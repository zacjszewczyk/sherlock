name: 'T1583: Acquire Infrastructure'
id: ed8257ea-5d26-4910-9a2d-f4f57ec96556
description: 'This playbook helps an analyst investigate whether an adversary is leveraging newly acquired,
  rented, leased, or fingerprinted infrastructure -- physical or cloud servers, domains, botnets, or third-party
  web services -- to support command-and-control and other operations against the network (MITRE ATT&CK
  T1583, Acquire Infrastructure). Because such infrastructure is often anonymized, rapidly provisioned,
  and chosen to blend in with normal web traffic (including residential and third-party proxies), the
  hunt is pursued during observable lifecycle stages where an internal host actually contacts the resource,
  and approaches the behavior from several complementary angles: matching outbound connections, resolved
  domains, and TLS certificate/JA3-JA4/JARM fingerprints against curated threat-intelligence and internet-scan-derived
  C2 indicators; escalating widespread or high-volume IOC activity across many internal hosts; profiling
  failed/blocked/RST connections and DNS NXDOMAIN bursts that betray not-yet-live or sinkholed infrastructure;
  detecting malicious JA3/JA3S/JA4 fingerprints and default/Malleable-C2 certificate artifacts; enriching
  and baselining newly registered domains (NRDs) and fast-flux hosting; flagging high-entropy/DGA-style
  domain labels; and correlating periodic low-jitter ''beacon'' connections from non-browser processes
  on endpoints. Detection methods combine deterministic symbolic-logic rules (threat-intel IOC and JA3/JA4
  watchlists, WHOIS/NRD enrichment, Sigma C2 signatures, process-to-connection correlation), statistical
  baselining (distinct-host and byte percentiles, failure-rate and NXDOMAIN standard-deviation thresholds,
  fingerprint entropy drift, FFT/coefficient-of-variation beacon cadence analysis), and machine learning
  (connection risk classifiers, DBSCAN TLS clustering, ARIMA/Prophet NRD forecasting, and autoencoder/LSTM
  session anomaly scoring with SHAP feature attribution), applied across Zeek conn/dns/ssl/x509 logs,
  Windows Event IDs 4688 and 5156, and DNS/WHOIS and internet-scan enrichment, so the analyst can corroborate
  suspected adversary infrastructure across reputation, registration, fingerprint, volume, failure mode,
  and cadence.'
type: technique
related:
- tactic_id: TA0042
  tactic_name: Resource Development
