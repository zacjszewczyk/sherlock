questions:
- question: '[Resource Development] Match malicious infrastructure IOCs: Can you determine whether a network
    connection from an internal host to an external destination (IP address, domain) or involving an SSL/TLS
    certificate hash has a direct match in a high-confidence threat intelligence feed tracking adversary
    infrastructure, OR an unusually high rate of blocked/RST/failed connection attempts targets such destinations.
    -- specifically, using the ''Match malicious infrastructure IOCs'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Resource Development tactic (TA0042), an adversary buys, leases,
    rents, or otherwise obtains infrastructure -- physical or cloud servers, domains, botnets, or third-party
    web services -- to stage, launch, and execute operations, frequently using rapidly provisioned, anonymized
    infrastructure to host command-and-control and to blend malicious traffic into normal-looking web
    activity. Detecting use of acquired infrastructure against your network is best pursued during the
    later, observable stages of the adversary lifecycle (e.g., Command and Control), when an internal
    host actually contacts the adversary''s resource. This evidence focuses on the condition that a network
    connection from an internal host to an external destination (IP address, domain) or involving an SSL/TLS
    certificate hash has a direct match in a high-confidence threat intelligence feed tracking adversary
    infrastructure, OR an unusually high rate of blocked/RST/failed connection attempts targets such destinations.
    This Symbolic Logic approach works as follows: Continuously match destination IPs from Zeek conn.log,
    resolved domains from Zeek dns.log, and certificate SHA1 hashes from Zeek ssl.log against a curated
    deny-list of known malicious infrastructure IOCs (threat-intel feeds plus internet-scan-derived C2
    fingerprints such as default certificates, JARM hashes, and listening-service banners per [SCANdalous](https://www.mandiant.com/resources/blog/scandalous-external-detection-using-network-scan-data-and-automation)
    and community [Sigma](https://github.com/SigmaHQ/sigma) rules), generating a high-priority alert on
    any hit. Keep this deterministic floor regardless of any ML layer. A positive result -- a deterministic
    IOC/rule match, a statistical outlier, or a model alert -- indicates an internal host is likely communicating
    with adversary-acquired infrastructure; pivot to the responsible host and process, the destination
    IP/domain/ASN and its registration and certificate/JA3-JA4 fingerprint, the byte volume, success/failure
    pattern, and cadence of the sessions, and any preceding delivery or execution activity, then scope
    how many hosts touched the same infrastructure. A negative result helps rule out this particular C2/infrastructure
    channel but should be corroborated with the other questions in this playbook, since a single method
    can miss freshly staged, sinkholed, low-and-slow, domain-fronted, or TLS-1.3-obscured infrastructure.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek ssl.log
  - Zeek x509.log
  - 'NAI: Enterprise network egress points (Firewalls, Proxies), Internal DNS resolvers and forwarders,
    VPN concentrators, Cloud IaaS/PaaS VPC egress gateways'
  range: Last 90 days (correlate event-centered windows of +/- 24 hours around the connection)
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Match malicious infrastructure IOCs (Symbolic Logic)

      source IN [Zeek conn.log, Zeek dns.log, Zeek ssl.log, Zeek x509.log]

      | approach: Continuously match destination IPs from Zeek conn.log, resolved domains from Zeek dns.log,
      and certificate SHA1 hashes from Zeek ssl.log against a curated deny-list of known malicious infrastructure
      IOCs (threat-intel feeds plus internet-scan-derived C2 fingerprints such as default certificates,
      JAR

      | correlate over NAI: Enterprise network egress points (Firewalls, Proxies), Internal DNS resolvers
      and forwarders, VPN concentrators, Cloud IaaS/PaaS VPC egress gateways

      | emit alert with contributing fields and entity context (host, process, dest IP/domain/ASN, cert/JA3/JA4,
      bytes, conn_state, cadence)'
  - technology: Zeek/pseudocode
    query: '# Match malicious infrastructure IOCs (Zeek view)

      watch conn.log/dns.log/ssl.log/x509.log for connections to acquired-infrastructure indicators

      | match dest IP/resolved domain/cert-hash/JA3-JA4 against threat-intel and scan-derived C2 fingerprints

      | evaluate orig:resp byte ratio, conn_state (RST/REJ), NXDOMAIN, domain age, inter-arrival cadence

      | emit candidate C2 sessions with host, dest, ASN, bytes, fingerprint'
