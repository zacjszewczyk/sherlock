  - Windows Event ID 4624
  - Windows Event ID 4672
  - Windows Event ID 4688
  - Windows Event ID 4104
  - Windows WinRM/Operational Event ID 6
  - 'NAI: Authentication, privilege assignment, and process creation logs on all critical servers (Domain
    Controllers, Certificate Authorities, database servers) and privileged administrative workstations.'
  range: Last 90 days, with per-user/host n-gram baselines.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'seqs = NGRAM(commands,2..3) PER user,host FROM (Event4688,Event4104)

      ALERT session WHERE ANY ngram.freq < 0.01

      disc = COUNT(whoami,net user,ipconfig,nltest); errs = COUNT(error_returning_cmds)

      ALERT WHERE disc > p99(user) OR errs > p99(user)'
- question: Does a WinRM session (per Logon ID) cluster as a DBSCAN noise point that fits no normal behavioural
    cluster?
  context: 'Per Logon ID (from 4624), build a feature vector — session duration, total process count,
    average command entropy, byte-volume of transferred output, error/failure count, and counts of command
    categories (discovery, execution, defense evasion) — and cluster with DBSCAN, flagging noise points
    that fit no normal cluster. Outlier sessions that resemble no established behavioural group are prime
    candidates for malicious lateral movement because attacker sessions differ holistically from routine
    administration. The alert must surface the top-3 features driving the outlier classification so the
    analyst can interpret why it stands out. A noise-point session warrants full investigation; sessions
    falling within dense normal clusters are expected. This unsupervised multi-feature layer captures
    anomalous WinRM behaviour that single-metric rules miss in the post-authentication Lateral Movement
    phase. Sources: [An Unsupervised Multi-Detector Approach, Bohara et al](https://doi.org/10.1109/SRDS.2017.31);
    [Uncovering Lateral Movement Using Authentication Logs, Bian et al](https://rboutaba.cs.uwaterloo.ca/Papers/Journals/2021/BianTNSM21.pdf).'
