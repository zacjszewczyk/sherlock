- question: 'Using deterministic rule logic, can you determine whether ‘High-privileged parent-child alert’
    reveals token impersonation/theft activity on Windows hosts? Specifically: Create a high-severity
    rule for Windows Event ID 4688 / Sysmon Event ID 1 where ParentProcessName is in (''lsass.exe'',''services.exe'',''winlogon.exe'',''csrss.exe'')
