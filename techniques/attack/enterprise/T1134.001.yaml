questions:
- question: 'Using deterministic rule logic, can you determine whether ‘Command-line indicator matching’
    reveals token impersonation/theft activity on Windows hosts? Specifically: Create a SIEM rule that
    scans the Process CommandLine field in Windows Event ID 4688 (and Sysmon Event ID 1) for case-insensitive
    matches of known token-manipulation tool strings (''incognito'', ''steal_token'', ''make_token'',
    ''runas /savecred'', ''Invoke-TokenManipulation''), then correlate within 60s with the same host''s
    4624 (logon success) and 4672 (special privileges assigned). Profile the State dimension: a match
    accompanied by 4625 failed logons or no preceding interactive logon for the impersonated account raises
    severity. Rule logic ported from the [SigmaHQ corpus](https://github.com/SigmaHQ/sigma).'
  context: 'Tactic context (Stealth / Has the adversary escalated privileges using token impersonation/theft?):
    T1134.001 lets an adversary duplicate and impersonate another user''s access token to operate under
    a different, usually higher-privileged, security context — supporting both privilege escalation and
    stealthy blending into legitimate activity. Evidence under investigation: The command line of a created
    process contains substrings associated with known token manipulation tools or their functions, such
    as ''incognito'', ''steal_token'', ''make_token'', or ''runas /savecred'', and the surrounding logon
    context shows the process is operating outside the user''s normal privilege boundary. Approach (Command-line
    indicator matching): Create a SIEM rule that scans the Process CommandLine field in Windows Event
    ID 4688 (and Sysmon Event ID 1) for case-insensitive matches of known token-manipulation tool strings
    (''incognito'', ''steal_token'', ''make_token'', ''runas /savecred'', ''Invoke-TokenManipulation''),
    then correlate within 60s with the same host''s 4624 (logon success) and 4672 (special privileges
    assigned). Profile the State dimension: a match accompanied by 4625 failed logons or no preceding
    interactive logon for the impersonated account raises severity. Rule logic ported from the [SigmaHQ
    corpus](https://github.com/SigmaHQ/sigma). A positive result indicates a process or account assuming
    a security context it should not hold (e.g., token-tool command lines, anomalous lsass handle access,
    a privileged token assignment followed by sensitive object access or lateral movement); a negative
    result means the observed behavior matches the established benign baseline. Investigate the named
    area of interest (Endpoint devices (workstations), Critical application servers, Windows Server fleet)
    and pivot from any hit to the source image, parent process, logon session (LogonId/4624/4672), impersonated
    account, and downstream credential-access or lateral-movement activity.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: Endpoint devices (workstations), Critical application servers, Windows Server fleet'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "// Deterministic detection for: Command-line indicator matching\n// MATCH win_events e\nWHERE\
      \ e.EventID IN [4688,4696,4656,4663,5156] OR e.sysmon_id IN [1,10]\n  AND <action-specific predicate\
      \ from approach above>\nCORRELATE within 60s ON Host, ProcessId, LogonId\n  WITH 4624(logon)/4672(special\
      \ privileges)\nEMIT alert WITH host, user, parent_image, image, cmdline, access_mask, severity"
- question: 'Using statistical baselining, can you determine whether ‘Command-line entropy and frequency
    scoring’ reveals token impersonation/theft activity on Windows hosts? Specifically: For each process
    name, baseline Shannon entropy and length of command-line strings and flag instances above the 99th
    percentile to catch obfuscated invocations; in parallel track Frequency (token-tool-pattern executions
    per host per 5 min) and alert above 3 standard deviations of the 30-day mean, using hybrid text/token
    features as in [Fang et al](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099).'
