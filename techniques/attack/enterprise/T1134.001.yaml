- question: 'Using deterministic rule logic, can you determine whether ‘Critical handle access correlation’
    reveals token impersonation/theft activity on Windows hosts? Specifically: After enabling object-access
    auditing on lsass.exe, monitor Windows Event ID 4656 and Sysmon Event ID 10 for handle requests whose
    access mask includes PROCESS_DUP_HANDLE (0x40) or TOKEN_DUPLICATE where the source image is not on
    an approved security/management allowlist; interpret GrantedAccess/CallTrace per the [Sysmon Community
    Guide](https://github.com/trustedsec/SysmonCommunityGuide/blob/master/chapters/process-access.md)
    and access-rights semantics per [DuplicateTokenEx](https://learn.microsoft.com/en-us/windows/win32/api/securitybaseapi/nf-securitybaseapi-duplicatetokenex).
    Treat failed/denied 4656 (audit-failure) handle attempts as a distinct, higher-suspicion State signal.'
