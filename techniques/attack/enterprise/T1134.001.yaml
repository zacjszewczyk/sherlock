    lsass.exe should never spawn children per [Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/)
    and the expected-parent mapping in the [Elastic Unusual Parent-Child rule](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/).'
  context: 'Tactic context (Stealth / Has the adversary escalated privileges using token impersonation/theft?):
