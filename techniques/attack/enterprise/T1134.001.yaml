name: 'T1134.001: Access Token Manipulation: Token Impersonation/Theft'
id: 9dfd5d55-7053-419d-82a4-dc8bef8e3bd0
description: 'This playbook helps an analyst determine whether an adversary has performed Access Token
  Manipulation: Token Impersonation/Theft (T1134.001) on Windows hosts to escalate privileges, bypass
  access controls, and blend in with legitimate activity. Adversaries duplicate an existing user''s token
  (DuplicateToken/DuplicateTokenEx) and impersonate it (ImpersonateLoggedOnUser, SetThreadToken) to assume
  another security context. Investigative angles include: command-line indicators of token-manipulation
  tooling (incognito, steal_token, make_token, runas /savecred, Invoke-TokenManipulation) and Mimikatz
  pass-the-hash (sekurlsa::pth) in Windows Event ID 4688 / Sysmon Event ID 1; anomalous high-privileged
  parent-child process lineage (e.g., lsass.exe, services.exe, winlogon.exe, csrss.exe spawning cmd.exe/powershell.exe);
  suspicious handle requests to lsass.exe carrying PROCESS_DUP_HANDLE (0x40) or TOKEN_DUPLICATE rights
  (Event ID 4656 / Sysmon Event ID 10); new primary token assignments (Event ID 4696) followed by sensitive
  object access (Event ID 4663) or lateral admin connections (Event ID 5156, Zeek conn.log) to SMB/RDP/WinRM;
  runas.exe abuse and user-facing applications running under SYSTEM (S-1-5-18). Detection blends symbolic-logic
  correlation rules, statistical baselining (entropy, frequency, rarity, volume, and fan-out percentiles),
  and machine learning (supervised classifiers, Isolation Forest/One-Class SVM, HMM/LSTM sequence models,
  and provenance-graph GNNs) to produce evasion-resistant, explainable alerts for the Privilege Escalation
  and Stealth tactics.'
type: technique
