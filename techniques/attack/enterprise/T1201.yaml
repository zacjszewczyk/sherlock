questions:
- question: '[Discovery] hash ti match: Can you determine whether a process creation event is observed
    where the executable''s file hash is present on a threat intelligence feed of tools known for discovery,
    such as PowerSploit or BloodHound components, or the binary is environmentally rare and runs with
    password-policy-related command-line arguments. -- specifically, using the ''hash ti match'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Discovery tactic (TA0007), an adversary reads the environment''s
    password policy (minimum length, complexity, history, and lockout thresholds) so that subsequent credential
    attacks such as brute force, password spraying, and dictionary guessing can be tuned to succeed without
    tripping account lockouts. This evidence focuses on the condition that a process creation event is
    observed where the executable''s file hash is present on a threat intelligence feed of tools known
    for discovery, such as PowerSploit or BloodHound components, or the binary is environmentally rare
    and runs with password-policy-related command-line arguments. This Symbolic Logic approach looks for
    the following signal: Create a real-time rule to compare the SHA256 or MD5 hash from every process
    creation event (Sysmon Event ID 1, Windows Event ID 4688) against a continuously updated threat intelligence
    feed of malicious hashes. Generate a critical alert for any match and trigger an automated host quarantine
    playbook. Pair hash matching with deterministic command-line rules so renamed/recompiled tools are
    still caught by behavior, per the LOLBin guidance in [Misbehaving binaries: How to detect LOLBins
    abuse in the wild](https://redcanary.com/blog/blog/lolbins-abuse/) and the ATT&CK-tagged rules in
    [SigmaHQ](https://github.com/SigmaHQ/sigma). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a principal, host, or API caller queried password-policy settings in a
    way that deviates from sanctioned administrative activity; pivot to the responsible user/service account,
    the parent process or source IP, the host or tenant, the time-of-day and rarity context, and any follow-on
    Discovery or Credential Access actions by the same actor within a short window. A negative result
    helps rule out this discovery vector but should be corroborated with the other questions in this playbook,
    since a single method can miss stealthy, renamed, or living-off-the-land policy lookups.'
  answer_sources: &id001
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# hash ti match\nsource IN [Windows Event ID 4688, Sysmon Event ID 1]\n| WHERE matches_action_criteria(\"\
      hash ti match\")\n// Create a real-time rule to compare the SHA256 or MD5 hash from every process\
      \ creation event (Sysmon Event ID 1, Windows \n| ALERT enrich(principal, host, process, parent,\
      \ source_ip, command)"
- question: '[Discovery] prevalence rarity: Can you determine whether a process creation event is observed
