name: 'T1201: Password Policy Discovery'
id: dfba86fb-6c77-44a1-98a3-a2569c0e14d9
description: 'This playbook helps an analyst investigate whether an adversary is attempting to discover
  the password policy of an enterprise network or cloud environment as part of the Discovery tactic, behavior
  that typically precedes policy-aware brute force, password spraying, or dictionary attacks (knowing
  minimum length, complexity, and lockout thresholds lets an attacker tune guesses and avoid account lockouts).
  It guides the hunt across every platform the technique touches: Windows hosts and Domain Controllers
  (net accounts /domain, Get-ADDefaultDomainPasswordPolicy, secedit /export, 4662 directory reads); Linux
  and macOS endpoints (chage -l, cat/grep of /etc/pam.d/common-password, /etc/security/pwquality.conf,
  /etc/login.defs, pwpolicy getaccountpolicies); network devices (show aaa, show aaa common-criteria policy
  all via syslog/command accounting); and cloud/identity surfaces (AWS GetAccountPasswordPolicy, Entra/Azure
  password and authentication policy reads, M365 Get-OrganizationConfig). Detection methods combine symbolic-logic
  rules (hash/CTI matching, regex command matching, parent denylists, stateful cross-tactic chaining,
  API allowlists), statistical baselining (environmental prevalence, per-user/peer-group frequency, time-of-day
  z-scores, technique transition probabilities, first-seen and failure-rate profiling, time-series forecasting),
  and machine-learning models (XGBoost classification, DBSCAN command clustering, isolation-forest session
  scoring, LSTM sequence modeling) applied to Windows Security/Sysmon/PowerShell logs, auditd, macOS unified
  logs, network-device syslog, Zeek, and cloud/IdP audit trails. Used together, the questions let an analyst
  corroborate a suspected password-policy lookup against the executing principal, process lineage, time
  and rarity context, and any follow-on Discovery or Credential Access activity by the same actor.'
type: technique
related:
- tactic_id: TA0007
  tactic_name: Discovery
