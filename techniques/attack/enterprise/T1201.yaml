    and runs with password-policy-related command-line arguments. This Statistical Method approach looks
    for the following signal: For every executed file hash not on an allowlist, calculate its environmental
    prevalence (percentage of hosts where it has executed) over the last 30 days, following the fleet-wide
    frequency methodology in [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).
    Investigate processes with prevalence < 1% of hosts that also carry suspicious command-line tokens
    (''policy'',''password'',''net accounts'',''/domain''). Track Volume (distinct hosts), Frequency (executions/hour),
    and State (process exit code / non-zero failures) so a rare binary that repeatedly fails is escalated
    as a distinct signal. A positive result -- a rule match, statistical outlier, or model alert -- indicates
