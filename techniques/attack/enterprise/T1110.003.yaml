name: 'T1110.003: Password Spraying'
id: fb454bbd-0c08-4707-b745-74af96e69e38
description: 'This playbook helps an analyst determine whether an adversary is attempting to acquire valid
  account credentials through Password Spraying (T1110.003): trying a single password or a small list
  of common passwords (e.g., ''Password01'', ''Welcome2023'') against many different accounts to avoid
  the account lockouts that single-account brute forcing would trigger. It supports the Credential Access
  tactic by correlating authentication telemetry across endpoints (Windows Event IDs 4625, 4771, 4768,
  4624, 4648), Linux/macOS auth logs, network sensors (Zeek conn.log/http.log), network-device AAA/TACACS
  logs, cloud and SSO sign-in logs (Azure AD/Entra, Okta/SaaS), Microsoft 365/Exchange mailbox auth, and
  Kubernetes/container API logs. Investigative angles include: a single source IP producing failures against
  many distinct accounts within a short window with a high unique-account-to-attempt ratio (each account
  tried only once or twice); the bad-password vs unknown-user failure-code mix (4625 SubStatus 0xC000006A
  vs 0xC0000064; Kerberos 4771 Failure Code 0x18) that distinguishes spray against valid accounts from
  noise; low-and-slow Kerberos and LDAP channels adversaries prefer to evade high-visibility SMB 4625
  events; correlation with threat-intelligence-listed source IPs and spraying-tool User-Agent strings
  (MailSniper, SprayingToolkit, kerbrute); the success-after-spray pattern (a 4624 success from an IP
  that just failed against many accounts) with impossible-travel feasibility checks; and aggregate volumetric
  spikes in authentication failures versus a seasonality-aware baseline. Detection blends symbolic-logic
  thresholds, statistical baselining (percentiles, change-point detection, forecasting), and machine learning
  (Isolation Forest, DBSCAN clustering, HMM/LSTM sequence models) to produce explainable, evasion-resistant
  alerts for SOC triage.'
type: technique
