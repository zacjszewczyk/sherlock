  - technology: SIEM/Rule pseudocode
    query: "// CTI spray correlation\nENRICH auth_events(4625,4771) AND zeek(conn.log,http.log) WITH cti_ip_feed,\
      \ spray_tool_ua_list\n  // spray_tool_ua_list = ['MailSniper','SprayingToolkit','kerbrute',...]\n\
      FILTER src_ip IN cti_malicious_ip OR user_agent IN spray_tool_ua_list\nGROUP BY src_ip OVER 15m\n\
      HAVING distinct(target_account) >= 5\nTHEN alert(severity='high', enrich=[matched_cti, distinct_accounts,\
      \ bad_pw_share])"
- question: 'Using statistical baselining, can you determine whether ''Failure-code and fan-out scoring''
    indicates password spraying credential-access activity? Specifically: Per source IP over 15 minutes
    compute distinct-account count, attempt volume, success/failure state ratio, and the share of bad-password
    failures (4625 SubStatus 0xC000006A) vs unknown-user (0xC0000064); flag sources whose distinct-account
    count and bad-password share both exceed the 95th percentile of the per-IP baseline, treating high
    bad-password-across-valid-accounts with near-zero success as the spray signature, per [Hunting for
    Low and Slow Password Sprays, Microsoft Sentinel](https://techcommunity.microsoft.com/blog/microsoftsentinelblog/hunting-for-low-and-slow-password-sprays-using-machine-learning/3592052).'
