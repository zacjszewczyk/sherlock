questions:
- question: 'Using deterministic rule logic, can you determine whether ''CTI spray correlation'' indicates
    password spraying credential-access activity? Specifically: Correlate Windows 4625/4771 and Zeek conn/http
    logs with CTI-listed malicious IPs or spraying-tool User-Agent strings; alert on any match accompanied
    by failures against >=5 distinct destination accounts within 15 minutes (frequency + fan-out), per
    [Detecting Password Spraying Attacks, Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    and indicator set in [Password Spray Attacks - Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).'
  context: 'Tactic context (Credential Access / TA0006): the adversary is trying to steal account names
    and passwords. Password spraying tests a small set of common passwords across many accounts to obtain
    valid credentials while staying under per-account lockout thresholds, giving the adversary legitimate
    access that is harder to detect. Evidence under investigation: Authentication failures (Windows Event
    ID 4625, 4771) or connection attempts (Zeek conn.log) from a source IP on a high-confidence threat-intelligence
    feed, or web authentication attempts (Zeek http.log) carrying a User-Agent string associated with
    known spraying tools (e.g., MailSniper, SprayingToolkit, kerbrute). Failure-mode focus: count distinct
    destination accounts and the bad-password vs unknown-user failure mix from the source. Approach (CTI
    spray correlation): Correlate Windows 4625/4771 and Zeek conn/http logs with CTI-listed malicious
    IPs or spraying-tool User-Agent strings; alert on any match accompanied by failures against >=5 distinct
    destination accounts within 15 minutes (frequency + fan-out), per [Detecting Password Spraying Attacks,
    Splunk Threat Research](https://www.splunk.com/en_us/blog/security/detecting-password-spraying-attacks-threat-research-release-may-2021.html)
    and indicator set in [Password Spray Attacks - Detection and Mitigation Strategies, ASD](https://www.cyber.gov.au/sites/default/files/2023-02/2019-130%20Password%20Spray%20Attacks%20-%20Detection%20and%20Mitigation%20Strategies%20-%2020190831.pdf).
    A positive result means a single source (or distributed set) is testing a common password against
    many distinct accounts with overwhelmingly failed authentications, a high unique-account-to-attempt
    ratio, and a tell-tale bad-password failure-code mix - the spray signature; a negative result means
    the observed failures fit normal per-entity and peer-group baselines (e.g., expired passwords, a single
    fat-fingered user, service-account churn). Investigate the named area of interest (Internet gateway,
    Externally-facing web applications, Domain Controllers, VPN concentrators, Cloud Authentication Services
    (e.g., Azure AD, Okta)) and pivot from any hit to the source IP/ASN, the targeted accounts, and any
    subsequent successful logon (4624/4768) to confirm compromise and track the account''s onward access.'
