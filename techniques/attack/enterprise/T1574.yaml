questions:
- question: Within the Stealth tactic (TA0005), does a deterministic detection rule surface activity that
    would match file writes to known hijack hashes and planted-then-loaded pairs? Specifically, hunt for
    the condition where a file creation event is observed for a DLL or executable in a directory within
    a defined execution search path, and the file is either unsigned, has a hash matching a known-malicious
    indicator, or has a name commonly associated with DLL hijacking (e.g., version.dll) that could be
    resolved before the legitimate binary.
  context: 'Information requirement: Is the adversary maintaining persistence by hijacking execution flow?
    This question maps to MITRE ATT&CK T1574 (Hijack Execution Flow) under the Stealth tactic. Evidence
    under investigation: A file creation event is observed for a DLL or executable in a directory within
    a defined execution search path, and the file is either unsigned, has a hash matching a known-malicious
    indicator, or has a name commonly associated with DLL hijacking (e.g., version.dll) that could be
    resolved before the legitimate binary. A positive result is a strong indicator that an adversary has
    poisoned the way the OS locates programs, libraries, or resources in order to run their own payload
    for persistence, privilege escalation, or defense evasion; a negative result helps rule out this hijack
    vector for the inspected hosts and window. Detection approach (Symbolic Logic): Join file creation
    events (Sysmon Event ID 11) with a threat-intel feed of T1574 file hashes and alert (high) on any
    match in a sensitive directory (e.g., `C:\Windows\System32`); mirror on Zeek `files.log` transfers.
    Independently, correlate a DLL write with a subsequent module load of that same path within 10 minutes
    as a confirmed plant-then-load hijack, the floor signal recommended by [4 Ways Adversaries Hijack
    DLLs](https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/) and the path-anomaly
    logic in [Suspicious DLL Loaded From Temp Or Suspicious Location, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_dll_susp_load_from_temp.yml).
    Triage by confirming the binary/module signer, path legitimacy, and resulting execution, and correlate
    with adjacent file/registry writes, module loads, anomalous process lineage, and any subsequent network
    egress to establish or refute the hijack chain.'
  answer_sources:
  - Sysmon Event ID 11 (File Create)
  - Sysmon Event ID 1 (Process Creation)
  - Zeek files.log
  - 'NAI: Endpoint and server file systems, specifically: application installation directories (`C:\Program
    Files`), user profile directories (`%APPDATA%`), and core system folders (`%SystemRoot%\System32`).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'FileCreate(EventID=11) AS f JOIN ThreatIntel(ti) ON f.Hashes IN ti.t1574_hashes

      WHERE f.TargetFilename MATCHES (''*\\System32\\*'',''*\\Program Files*'',''%APPDATA%*'') -> ALERT
      high

      // plant-then-load: FileCreate(f) THEN ModuleLoad(EventID=7, ImageLoaded=f.TargetFilename) WITHIN
      10m -> confirmed hijack

      // mirror file transfers on Zeek files.log by mime/hash'
