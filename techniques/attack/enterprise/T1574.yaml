name: 'T1574: Hijack Execution Flow'
id: f06af4af-15be-49a9-8f79-485b16628061
description: 'Investigate whether an adversary has hijacked the operating system''s normal execution flow
  to gain persistence, escalate privileges, or evade defenses under MITRE ATT&CK T1574 (Hijack Execution
  Flow). This playbook helps an analyst hunt across the full chain of execution-flow hijack techniques:
  planted or side-loaded DLLs and executables in directories that sit early in the search order; service
  ImagePath / FailureCommand tampering; global injection keys such as AppInit_DLLs/LoadAppInit_DLLs; Image
  File Execution Options (IFEO) Debugger and SilentProcessExit abuse; phantom/ghost DLLs dropped into
  user-writable paths that privileged services load insecurely; trusted system processes (lsass.exe, services.exe,
  svchost.exe, explorer.exe) loading unsigned or low-prevalence modules from abnormal paths; low/medium-integrity
  writes into protected system directories; Microsoft-signed system binaries losing their trusted signature;
  tampering with security-tool binaries; anomalous parent-child process lineages that follow a hijack-indicative
  write; and core system processes initiating unexpected external network connections indicative of post-hijack
  C2. For each phenomenon the playbook supplies deterministic (symbolic-logic) detections as the floor,
  statistical baselining/rarity signals, and machine-learning approaches, spanning Windows (Sysmon/Security
  event logs), Linux (auditd), macOS (unified log), and network telemetry (Zeek, PCAP).'
type: technique
