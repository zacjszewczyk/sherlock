    both the fleet-wide prevalence of each new filename/hash and its filename entropy. Alert when a newly
    created DLL is seen on <1% of hosts (rarity prior per [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365))
