    on a threat intelligence feed of known malicious or dual-use container images (e.g., public cryptominers,
    C2 frameworks, or penetration testing distributions). This Statistical Method approach works as follows:
    Maintain a 30-day rolling histogram of observed image names/digests; flag any new image below the
    5th-percentile frequency (or never seen), because adversaries launch unique/newly built tags to evade
    detection. Derive site-specific percentile cutoffs from labeled deploy telemetry such as [A Kubernetes
    Dataset for Misuse Detection](https://www.itu.int/dms_pub/itu-s/opb/jnl/S-JNL-VOL4.ISSUE2-2023-A26-PDF-E.pdf).
    Track image-pull failures/registry errors as a distinct signal. A positive result -- a rule match,
