questions:
- question: '[Execution] Image name IOC and allow-list match (Symbolic Logic): Considering the scenario
    that a container is deployed using an image name or tag that matches an entry on a threat intelligence
    feed of known malicious or dual-use container images (e.g., public cryptominers, C2 frameworks, or
    penetration testing distributions). can you determine, using the ''Image name IOC and allow-list match''
    approach, whether this is occurring in your environment and which container deployment(s), principal(s),
    image(s), and host/namespace(s) are involved?'
  context: 'Why this matters: Under the Execution tactic (TA0002), an adversary deploys a container into
    the environment to run adversary-controlled code or to evade defenses (MITRE ATT&CK T1610, Deploy
    Container). In Kubernetes and Docker environments this can mean launching a malicious or misconfigured
    container to execute payloads, bypass segmentation, or stage an escape to the host. This evidence
    focuses on the condition that a container is deployed using an image name or tag that matches an entry
    on a threat intelligence feed of known malicious or dual-use container images (e.g., public cryptominers,
    C2 frameworks, or penetration testing distributions). This Symbolic Logic approach works as follows:
    Parse container deployment events (Windows Event ID 4688, Zeek docker.log, docker:daemon container_create,
    or Kubernetes audit create verbs) to extract the image name/tag used by docker run, kubectl apply,
    or ctr run and alert if it matches a curated malicious-image threat-intel list OR is NOT on the approved-image
    allow-list of trusted/signed images from approved registries, OR uses a mutable '':latest'' tag or
    an untrusted public registry. This deterministic allow-list/admission floor follows [NIST SP 800-190](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-190.pdf)
    and can be enforced preventively (deny+audit) via [OPA Gatekeeper](https://www.cncf.io/blog/2023/10/09/secure-your-kubernetes-environment-with-opa-and-gatekeeper/).
    Keep concrete deny-list entries (public cryptominers, C2 frameworks, pentest distros) intact and tune
    the allow-list rather than removing rules. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates a probable malicious or unauthorized container deployment; pivot to the
    deploying principal and credentials, the source registry and image name/digest, the runtime flags
    and mounts, the target host/node and namespace, and the container''s first process executions and
    network connections to scope intent and blast radius. A negative result helps rule out this specific
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss novel images, low-and-slow activity, or living-off-the-land use of legitimate orchestration
    tooling.'
