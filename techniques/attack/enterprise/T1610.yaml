name: 'T1610: Deploy Container'
id: 28103ea7-b12d-430d-9cdb-7af106b61cb0
description: 'This playbook helps an analyst investigate whether an adversary has deployed a container
  to execute adversary-controlled code or to evade defenses (MITRE ATT&CK T1610, Deploy Container). Adversaries
  deploy containers via Docker create/start APIs, the Kubernetes dashboard/API, Kubeflow, or workloads
  such as ReplicaSets/DaemonSets -- using malicious or dual-use images, or benign images that pull and
  run payloads at runtime, and frequently with risky runtime attributes (--privileged, host PID/NET/IPC
  namespaces, sensitive host mounts like /var/run/docker.sock, capability adds) to bypass segmentation
  or stage an Escape to Host. The hunt spans Docker hosts, Kubernetes control and worker nodes, container
  registries, CI/CD pipelines, and network egress, and pursues the behavior from several complementary
  angles: deployments of images that match malicious threat-intel or violate an approved-image allow-list
  (or use mutable :latest tags / untrusted registries); deployments carrying vulnerable (high/critical
  CVE) images; suspicious entrypoint arguments and host-namespace/privileged flags or sensitive mounts;
  deployments by unauthorized principals or service accounts from interactive logons; post-deploy C2 beaconing,
  cloud-metadata-service credential theft, and horizontal scanning; non-standard network modes and port
  exposure; and runtime behavior that diverges from the image/workload baseline or sibling replicas (unexpected
  shells, downloaders, miners). Detection methods combine deterministic symbolic-logic rules (image IOC/allow-list
  and CVE matching, argument/flag/mount regex, RBAC and identity checks, metadata-access and C2 IOC correlation,
  runtime tripwires via Falco/Tetragon and admission control via OPA Gatekeeper), statistical baselining
  (rare-image and rare-config frequency, command-line entropy, beacon jitter/volume, CUSUM CVE-surface
  monitoring, unique-destination scanning percentiles, user-host deploy baselines, bag-of-system-calls
  divergence), and machine learning (random forest/gradient-boosting image and config classifiers, one-class
  SVM/Isolation Forest deploy outliers, STL/Prophet time-series and periodicity anomaly detection, graph-based
  fan-out detection, and per-class/replica autoencoders over syscall vectors), applied across Windows
  Event ID 4688/4624, Docker daemon events, Kubernetes audit logs, eBPF syscalls, container runtime telemetry,
  and Zeek conn/dns/http/docker logs, so the analyst can corroborate a suspected malicious deployment
  against identity, image provenance, runtime configuration, and post-deploy behavior.'
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
