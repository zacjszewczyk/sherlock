questions:
- question: '[Defense Impairment] Malware hash + image-integrity correlation: Can you determine whether
    a file transfer via TFTP, FTP, SCP, or HTTP/S to a network device containing a system image file (e.g.,
    .bin, .img, .swi) whose file hash or filename matches a known malicious indicator from threat intelligence.
    -- specifically, using the ''Malware hash + image-integrity correlation'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies the
    system image of an embedded network device to weaken its security controls and add covert capabilities,
    undermining defenders'' ability to see or trust what the device is doing. This evidence focuses on
    the condition that a file transfer via TFTP, FTP, SCP, or HTTP/S to a network device containing a
    system image file (e.g., .bin, .img, .swi) whose file hash or filename matches a known malicious indicator
    from threat intelligence. This Symbolic Logic approach works as follows: Extract file hashes from
    Zeek files.log for any .bin/.img/.swi/.tar transferred to a network device and (a) alert on any match
    to TI of malicious firmware hashes, and (b) alert when the hash does NOT match the vendor-published
    known-good hash / digital signature for that platform+version, per [Cisco IOS Software Integrity Assurance](https://sec.cloudapps.cisco.com/security/center/resources/integrity_assurance.html)
    and the Root-of-Trust-for-Detection model in [NIST SP 800-193](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-193.pdf).
    Flag image-size invariance with hash mismatch (overwrite-in-place implant) per [SYNful Knock](https://cloud.google.com/blog/topics/threat-intelligence/synful-knock-acis/).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates a probable system-image
    modification; pivot to the device and its boot/startup configuration, the transferred image file (hash,
    size, vendor signature), the operator host and account that initiated the session, the source IP and
    management protocol used, the change-management record (or absence of one), and the device''s subsequent
    outbound behavior to scope intent and impact, and where feasible trigger out-of-band remote attestation
    of the running image. A negative result helps rule out this particular vector but should be corroborated
    with the other questions in this playbook, since a single method can miss live in-memory-only implants,
    signed-but-malicious images, or low-and-slow staged transfers.'
