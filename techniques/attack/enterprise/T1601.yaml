name: 'T1601: Modify System Image'
id: 4e99ef50-4129-4e68-91a3-dcca43fffac1
description: 'This playbook helps an analyst investigate whether an adversary has modified the operating
  system image of an embedded network device (router, switch, firewall) to weaken its defenses or add
  covert capabilities (MITRE ATT&CK T1601, Modify System Image). On such devices the OS is typically a
  single monolithic image file (.bin/.img/.swi/.tar), so an adversary need only replace or patch that
  one file -- either live in running memory for immediate effect or in flash storage to take effect on
  the next reload -- to subvert the platform. Because legitimate firmware updates look superficially similar,
  the hunt pursues the behavior from several complementary angles: file transfers of system-image files
  to network devices whose hash or filename matches threat intelligence or fails vendor known-good/signature
  validation; administrative hosts that run file-transfer clients (tftp/scp/curl/wget/pscp) referencing
  firmware files and then immediately connect to a device management port; firmware transfers whose byte
  volume is anomalous or that occur outside an authorized change-management maintenance window; management
  sessions (SSH/HTTPS) to devices from source IPs not on the administrative allow-list or with non-approved
  TLS/SSH (JA3/JA4/HASSH) client fingerprints; and post-modification behavioral drift where a device begins
  beaconing to new external IPs, using non-standard protocols/ports, or issuing anomalous DNS queries
  consistent with a firmware implant (e.g., SYNful Knock covert backdoor-auth ''knock'' patterns). Detection
  methods combine deterministic symbolic-logic rules (TI hash matching, vendor signature/known-good verification
  per Cisco IOS Software Integrity Assurance and NIST SP 800-193, maintenance-window and boot-variable
  enforcement, allow-list and JA3/JA4/HASSH fingerprint checks, post-event C2/covert-knock monitoring),
  statistical baselining (filename-entropy and byte-volume MAD/IQR outliers, new-edge source-IP and failed-logon
  precursors, chi-squared baseline deviation and RITA-style beaconing analysis), and machine learning
  (Isolation Forest / One-Class SVM transfer and session scoring with SHAP attribution, DeepLog/LSTM and
  HMM sequence modeling, ARIMA/SARIMA volume-and-reload forecasting, and Kitsune/KitNET online autoencoder
  anomaly detection), corroborated where possible by out-of-band remote attestation (SWATT/VRASED) of
  the device image. Telemetry spans Zeek network logs (files, ftp, http, ssh, conn, notice, dns, software),
  Windows process-creation events (Event ID 4688) from administrative hosts, and network-device CLI/config
  logs, so the analyst can corroborate a suspected image modification across the transfer, the operator
  host, the management session, and the device''s subsequent behavior.'
type: technique
related:
