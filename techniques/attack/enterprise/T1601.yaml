- question: '[Defense Impairment] Filename entropy outlier detection: Can you determine whether a file
    transfer via TFTP, FTP, SCP, or HTTP/S to a network device containing a system image file (e.g., .bin,
    .img, .swi) whose file hash or filename matches a known malicious indicator from threat intelligence.
    -- specifically, using the ''Filename entropy outlier detection'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), an adversary modifies the
    system image of an embedded network device to weaken its security controls and add covert capabilities,
    undermining defenders'' ability to see or trust what the device is doing. This evidence focuses on
