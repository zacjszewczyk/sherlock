- question: Does a 4688 event show Creator Process Name (e.g., WINWORD.EXE/EXCEL.EXE/CHROME.EXE, an Office
    app or browser) != Parent Process Name where the reported parent is a common trusted process (explorer.exe/svchost.exe)?
  context: 'This is the canonical Office-to-explorer.exe spoof: a malicious document or browser exploit
    spawns a child but forges explorer.exe as the parent to evade detections that block processes spawning
    directly from Office. Trigger when the creator is an Office app or browser, the reported parent is
    a common trusted process, and the two differ. A match strongly indicates spearphishing-driven execution
    hiding its true origin. In the context of the Privilege Escalation tactic, a positive result supports
    the information requirement: Has the adversary used Parent PID Spoofing for privilege escalation?
    Method (Symbolic Logic): Trigger on 4688 where ''Creator Process Name'' != ''Parent Process Name'',
    AND ''Creator Process Name'' is an Office app or browser, AND ''Parent Process Name'' is explorer.exe/svchost.exe
    - the Office-to-explorer.exe spoof in [Detecting Parent PID (PPID) Spoofing](https://www.countercept.com/blog/detecting-parent-pid-spoofing/).'
