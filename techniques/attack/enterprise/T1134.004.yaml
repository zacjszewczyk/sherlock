name: 'T1134.004: Access Token Manipulation: Parent PID Spoofing'
id: ab2b83f4-2602-47c2-be7f-985201552649
description: 'This playbook helps an analyst investigate Access Token Manipulation: Parent PID Spoofing
  (T1134.004), where an adversary forges the parent process identifier of a new process using EXTENDED_STARTUPINFO_PRESENT
  + UpdateProcThreadAttribute(PROC_THREAD_ATTRIBUTE_PARENT_PROCESS) via CreateProcess. It addresses two
  objectives: stealth/defense evasion (forging a trusted parent such as explorer.exe to hide an Office-
  or LOLBAS-launched child) and privilege escalation (assigning a SYSTEM-level parent such as lsass.exe
  or services.exe to inherit an elevated token). The questions compare the kernel-observed TRUE creating
  process (ETW Microsoft-Windows-Kernel-Process) against the reported parent in Sysmon Event ID 1 / Windows
  Event ID 4688, profile rare parent-child lineages and creator/parent tuples, correlate logon (4624)
  and special-privilege (4672) context, inspect UAC elevation paths and explorer.exe security context,
  hash NewProcessName against PPID-spoofing tooling IOCs, and apply statistical baselining and machine-learning
  anomaly/classification models. The dominant benign source is legitimate UAC elevation (consent.exe/svchost.exe),
  which must be excluded.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
- tactic_id: TA0004
  tactic_name: Privilege Escalation
contributors:
- Zachary Szewczyk
