- question: When process-creation tuples (creator, spoofed parent, child, user context, integrity, logon
    type) are clustered with an unsupervised model, which records land as noise or in tiny isolated clusters?
  context: 'Train an unsupervised Isolation Forest / DBSCAN model on process-creation features. Benign
    activity forms dense clusters; spoofed lineage tends to be isolated as noise or in tiny clusters because
    its feature combination (rare creator, privileged/trusted reported parent, anomalous integrity) is
    unlike the majority. Surface the top-3 features (creator image, reported parent, child command-line
    token) for triage. This catches novel spoofing variants that signature rules miss. In the context
    of the Privilege Escalation tactic, a positive result supports the information requirement: Has the
    adversary used Parent PID Spoofing for privilege escalation? Method (Machine Learning): Cluster process-creation
    features (creator, spoofed parent, child, user context, integrity) with DBSCAN/Isolation Forest per
    [Isolation Forest](https://doi.org/10.1145/2133360.2133363); events classified as noise or in tiny
    isolated clusters are likely malicious PPID spoofing - emit the top-3 features.'
  answer_sources:
  - Windows Event ID 4688
  - etw:Microsoft-Windows-Kernel-Process
  - 'NAI: All Windows endpoints and servers with enhanced process creation logging enabled (including
    command line and creator process).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = [creator,reported_parent,child,user_ctx,integrity,logon_type]
      model = IsolationForest()/DBSCAN()
      alert WHERE anomaly_score high OR cluster_size tiny/noise
        emit top3_features
- question: Does any 4688 parent-child relationship originate from a privileged system process that is
    not on the allowlist of expected privileged chains (services.exe->svchost.exe, wininit.exe->services.exe,
    smss.exe->csrss.exe), especially an interactive shell, script host, or LOLBin child?
  context: 'Maintain a tight allowlist of legitimate privileged chains and alert on any privileged-parent
    relationship outside it, weighting heavily when the child is an interactive shell, script host, or
    LOLBin, or when child integrity is High/System. High-privilege system processes have an extremely
    constrained legitimate child set, so a deviation strongly suggests an adversary forged the parent
    to escalate privileges via token inheritance. In the context of the Privilege Escalation tactic, a
    positive result supports the information requirement: Has the adversary used Parent PID Spoofing for
    privilege escalation? Method (Symbolic Logic): Define known-good high-privilege parent-child relationships
    (services.exe->svchost.exe, wininit.exe->services.exe); alert on any high-privilege parent-child relationship
    not on the allowlist, especially when child integrity is High/System. Allowlist from [Unusual Parent-Child
    Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)
    and [Non services.exe Spawn of svchost.exe](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Critical infrastructure servers (Domain Controllers, Certificate Authorities) and administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      allow = {services.exe->svchost.exe, wininit.exe->services.exe, smss.exe->csrss.exe}
      WHERE parent_image IN privileged_sys_bins
        AND (parent_image,child_image) NOT IN allow
        AND (child IN shells|script_hosts|lolbins OR child_integrity IN High,System)
      => alert
- question: Over a 30-day baseline of parent-child pairs by host role, which new pairs or pairs with a
    z-score above 3 (especially with a high-privilege parent) should be alerted?
  context: 'Build a per-host-role baseline of parent-child pair frequencies and compute a z-score/rarity
    score per pair, deriving thresholds from each server class''s own distribution. New pairs or those
    with z>3 indicate statistically anomalous lineage. When the parent is a high-privilege binary and
    the child is newly elevated, the anomaly is consistent with PPID spoofing for privilege escalation
    on critical infrastructure. In the context of the Privilege Escalation tactic, a positive result supports
    the information requirement: Has the adversary used Parent PID Spoofing for privilege escalation?
    Method (Statistical Method): Build a 30-day baseline of parent-child frequencies; for new processes
    with a high-privilege parent compute the z-score against the baseline and alert on z>3 or entirely
    new pairs, per [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
