- question: When a normally common parent (explorer.exe/svchost.exe) launches a process, is the child
    command line above the 95th percentile of Shannon entropy/length for the host baseline, indicating
    an obfuscated payload?
  context: 'Compute Shannon entropy and length (Volume) of each command line and the rarity of each parent-child
    pair (Frequency) over 30 days. Alert when a normally benign parent launches a child whose command
    line exceeds the 95th-percentile entropy/length for the host baseline. High-entropy command lines
    under a trusted, possibly spoofed parent indicate an encoded/obfuscated payload hiding behind a benign-looking
    lineage. In the context of the Privilege Escalation tactic, a positive result supports the information
    requirement: Has the adversary used Parent PID Spoofing for privilege escalation? Method (Statistical
    Method): Compute Shannon entropy/length (Volume) of each new process command line; flag values above
    the 95th percentile combined with a common parent (explorer.exe, svchost.exe) indicating an obfuscated
    payload, per [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
