    carries anomalous attributes (SYSTEM parent context) yielding high reconstruction error, with top-3
    deviating attributes surfaced. Provenance rationale per [Tactical Provenance-based Detection (ProvDetector)](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
