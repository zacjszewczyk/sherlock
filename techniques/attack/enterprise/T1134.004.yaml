    Logic): For each 4688 event, hash the ''NewProcessName'' file and compare against a continuously updated
    list of known-malicious hashes tagged ''T1134.004''/''PPID Spoofing'' (e.g., SelectMyParent and derivatives,
    [SelectMyParent](https://blog.didierstevens.com/2009/11/22/quickpost-selectmyparent-or-playing-with-the-windows-process-tree/)).
    Generate a high-severity alert on match. Treat hashing first-party against internal hash inventory;
    external lookups are optional enrichment only.'
