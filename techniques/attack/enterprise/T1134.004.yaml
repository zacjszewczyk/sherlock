- question: Does an LSTM-autoencoder over per-host process-creation order produce high reconstruction
    error for a tree where a privileged parent launches an unusual child, and what are the top-3 deviating
    steps?
  context: 'Train a sequence anomaly model (LSTM autoencoder) on per-host process-creation order to learn
    expected boot/service/admin sequences. A spoofed lineage breaks the learned order (e.g., a SYSTEM-level
    parent launching an unexpected child mid-session), yielding high reconstruction error. Surfacing the
    top-3 deviating steps helps the analyst see exactly where the chain departs from normal, supporting
    detection of stealthy escalation. In the context of the Privilege Escalation tactic, a positive result
    supports the information requirement: Has the adversary used Parent PID Spoofing for privilege escalation?
    Method (Machine Learning): Train an LSTM-autoencoder on per-host process-creation sequences; a rare
    high-privilege parent-child pair yielding high reconstruction error indicates deviation, with top-3
    deviating steps surfaced. Graph rationale per [Tactical Provenance-based Detection (ProvDetector)](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Critical infrastructure servers (Domain Controllers, Certificate Authorities) and administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      seq = ordered process_creations per host
      recon_err = LSTM_autoencoder.reconstruct(seq)
      alert WHERE recon_err > threshold
        emit top3_deviating_steps
- question: Does an elevated 4688 process creation follow a 4624/4672 logon but originate from something
    other than consent.exe (or carry Token Elevation Type 1/2 without consent.exe as parent), indicating
    UAC bypass via PPID spoofing?
  context: 'Legitimate interactive elevation flows through consent.exe (the UAC prompt). Alert when an
    elevated process tied to an admin account follows a logon but does not originate from consent.exe
    or an approved administrative workflow, or when Token Elevation Type is Type 1/Type 2 yet the parent
    is not consent.exe. This catches the SYSTEM-token-inheritance escalation path where an adversary assigns
    a SYSTEM parent to gain an elevated token while skipping the standard UAC prompt. In the context of
    the Privilege Escalation tactic, a positive result supports the information requirement: Has the adversary
    used Parent PID Spoofing for privilege escalation? Method (Symbolic Logic): Trigger on 4688 when ''Token
    Elevation Type'' is Type 1 or Type 2 AND ''Parent Process Name'' is NOT consent.exe, targeting elevation
    that skips the standard UAC prompt. Legitimate UAC PPID assignment and its abuse described in [Detecting
    Parent PID (PPID) Spoofing](https://www.countercept.com/blog/detecting-parent-pid-spoofing/).'
