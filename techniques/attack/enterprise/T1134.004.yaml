    forging lineage to obtain elevated tokens. In the context of the Privilege Escalation tactic, a positive
    result supports the information requirement: Has the adversary used Parent PID Spoofing for privilege
    escalation? Method (Statistical Method): Baseline common reported parents for elevation (consent.exe,
    explorer.exe); compute entropy of the per-user parent distribution and flag sudden drops or rare parents
    (svchost.exe). Also profile failed elevation/denied-UAC counts as a distinct State signal, per [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
