    image, child command-line token) so an analyst can validate the chain quickly. In the context of the
    Privilege Escalation tactic, a positive result supports the information requirement: Has the adversary
    used Parent PID Spoofing for privilege escalation? Method (Machine Learning): Build per-host process
    provenance graphs using the kernel TRUE creator->child edge, and score the rarity of each causal path
    with TF-IDF + doc2vec + Local Outlier Factor as in [Tactical Provenance-based Detection (ProvDetector)](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).
    A spoofed lineage produces a rare path (e.g., Office/script-host creator yielding a child whose reported
    parent is explorer.exe or a SYSTEM process). Alert text must surface the top-3 contributing edges/features
    (true creator image, reported parent image, child command-line token) driving the outlier score.'
  answer_sources:
