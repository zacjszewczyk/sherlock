    forging lineage to evade process-monitoring defenses. In the context of the Privilege Escalation tactic,
    a positive result supports the information requirement: Has the adversary used Parent PID Spoofing
    for privilege escalation? Method (Statistical Method): Count creator!=reported-parent mismatch events
    per host per day. Establish a 30-day baseline (legitimate UAC elevations are the dominant benign source);
    alert when the per-host daily count exceeds the host-role mean + 3 sigma, or when any single mismatch
    involves a non-UAC creator. Track the rate of such API-path events as a Frequency metric rather than
    relying on a single observation, following the rarity-scoring approach of [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - etw:Microsoft-Windows-Kernel-Process
  - Windows Event ID 4688
  - Sysmon Event ID 1
