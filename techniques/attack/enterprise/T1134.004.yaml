- question: Does the kernel-observed true creating process for any new process differ from the parent
    process ID reported by Sysmon/Security 4688 for the same new ProcessGuid, outside the documented UAC
    elevation path?
  context: 'This is the highest-fidelity, lowest-false-positive primitive for Parent PID Spoofing. The
    Windows kernel (ETW Microsoft-Windows-Kernel-Process) records the TRUE caller of CreateProcess, while
    an attacker using EXTENDED_STARTUPINFO_PRESENT + UpdateProcThreadAttribute(PROC_THREAD_ATTRIBUTE_PARENT_PROCESS)
    forces a different reported PPID into Sysmon Event ID 1 / Security 4688. Join the two records on the
    new ProcessGuid and deterministically alert when the kernel creator PID/image != the reported parent
    PID/image. The only common benign source is the UAC path (consent.exe/svchost.exe assigning the PPID
    after a SYSTEM-spawned elevation), which must be excluded. A positive result is near-certain evidence
    of deliberate lineage forgery. In the context of the Privilege Escalation tactic, a positive result
    supports the information requirement: Has the adversary used Parent PID Spoofing for privilege escalation?
    Method (Symbolic Logic): Join each process-start from ETW Microsoft-Windows-Kernel-Process (which
    records the true creating ProcessId) to the corresponding Sysmon Event ID 1 / Windows Event ID 4688
    record (reported ParentProcessId). Alert deterministically whenever the kernel-observed creator PID/image
    does not equal the reported parent PID/image for the same new ProcessGuid, excluding the documented
    UAC path (consent.exe/svchost.exe assigning PPID after a SYSTEM-spawned elevation). This is the definitive
    PPID-spoofing primitive per [Detecting Parent PID (PPID) Spoofing](https://www.countercept.com/blog/detecting-parent-pid-spoofing/)
    and the original [SelectMyParent](https://blog.didierstevens.com/2009/11/22/quickpost-selectmyparent-or-playing-with-the-windows-process-tree/)
    PoC.'
  answer_sources:
  - etw:Microsoft-Windows-Kernel-Process
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, administrative workstations, and critical application servers with ETW kernel-process
    tracing and Sysmon enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      JOIN etw_kernel_process AS k ON proc_start (true_creator_pid)
        WITH (sysmon_id1 OR sec_4688) AS r ON new_process_guid
      WHERE k.true_creator_pid != r.reported_parent_pid
         OR lower(k.true_creator_image) != lower(r.reported_parent_image)
      AND NOT (r.reported_parent_image IN ('consent.exe','svchost.exe') AND uac_elevation_context)
      => alert severity=high
- question: How many creator-not-equal-reported-parent mismatch events occur per host per day, and does
