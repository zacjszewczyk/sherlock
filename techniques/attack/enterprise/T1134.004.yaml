  context: 'Hash the NewProcessName for each 4688 event and correlate against internal known-bad/defense-evasion
    hash lists, raising a high-severity alert on match. Pay special attention when the reported parent
    is a trusted process (explorer.exe, svchost.exe), as this combines a malicious binary with a forged
    trusted lineage to masquerade its origin - a clear stealth/defense-evasion pattern. In the context
    of the Privilege Escalation tactic, a positive result supports the information requirement: Has the
    adversary used Parent PID Spoofing for privilege escalation? Method (Symbolic Logic): Hash the ''NewProcessName''
    for each 4688 event and correlate against internal known-bad/defense-evasion hash lists; alert high-severity
    on match, especially when the reported parent is explorer.exe or svchost.exe (masquerading origin).
    Trusted-parent abuse per [Process Injection - Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).'
