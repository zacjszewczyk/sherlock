    This complements signature matching by catching novel/unknown spoofing utilities. In the context of
    the Privilege Escalation tactic, a positive result supports the information requirement: Has the adversary
    used Parent PID Spoofing for privilege escalation? Method (Statistical Method): Profile enterprise-wide
    prevalence of all executable hashes; flag hashes seen on < 5 machines or below the 1st prevalence
    percentile not tied to a known deployment/patch, per [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
