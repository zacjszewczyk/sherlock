- question: Is a LOLBAS (powershell.exe, rundll32.exe, mshta.exe) executed where the Creator Process Name
    is an Office app/browser but the Parent Process Name is explorer.exe, and does pivoting on its ProcessGUID
    into Zeek conn.log reveal connections to uncategorized/known-malicious destinations?
  context: 'Combine trusted-parent spoofing with first-party network corroboration. Flag a LOLBAS whose
    creator is an Office app/browser but whose reported parent is explorer.exe, then use the ProcessGUID
