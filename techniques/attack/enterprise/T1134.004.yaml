- question: Does any process have explorer.exe as its reported parent while that parent's Subject User
    Name is NT AUTHORITY\SYSTEM or its Session ID is 0?
  context: 'Interactive explorer.exe always runs in a user context with a non-zero session. Alert on any
    child whose reported parent is explorer.exe but whose parent context is NT AUTHORITY\SYSTEM or Session
    0. This precisely catches a SYSTEM-parented spoof used to inherit a SYSTEM token while masquerading
    as benign desktop activity - a hallmark of the ''becoming SYSTEM'' escalation technique. In the context
    of the Privilege Escalation tactic, a positive result supports the information requirement: Has the
    adversary used Parent PID Spoofing for privilege escalation? Method (Symbolic Logic): Alert when ''Parent
    Process Name'' is explorer.exe BUT the parent''s ''Subject User Name'' is NT AUTHORITY\SYSTEM or ''Session
    ID'' is 0; interactive explorer.exe runs in user context with non-zero session - the SYSTEM-parented
    escalation in [Becoming SYSTEM](https://blog.xpnsec.com/becoming-system/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Remote Desktop Session Hosts, Citrix servers, and other multi-user or remote access servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      WHERE parent_process_name = 'explorer.exe'
        AND (parent_subject_user = 'NT AUTHORITY\\SYSTEM' OR parent_session_id = 0)
      => alert severity=high
