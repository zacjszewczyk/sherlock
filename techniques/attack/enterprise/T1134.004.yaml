questions:
- question: Does the kernel-observed true creating process for any new process differ from the parent
    process ID reported by Sysmon/Security 4688 for the same new ProcessGuid, outside the documented UAC
    elevation path?
  context: 'This is the highest-fidelity, lowest-false-positive primitive for Parent PID Spoofing. The
    Windows kernel (ETW Microsoft-Windows-Kernel-Process) records the TRUE caller of CreateProcess, while
    an attacker using EXTENDED_STARTUPINFO_PRESENT + UpdateProcThreadAttribute(PROC_THREAD_ATTRIBUTE_PARENT_PROCESS)
    forces a different reported PPID into Sysmon Event ID 1 / Security 4688. Join the two records on the
    new ProcessGuid and deterministically alert when the kernel creator PID/image != the reported parent
    PID/image. The only common benign source is the UAC path (consent.exe/svchost.exe assigning the PPID
    after a SYSTEM-spawned elevation), which must be excluded. A positive result is near-certain evidence
    of deliberate lineage forgery. In the context of the Stealth tactic, a positive result supports the
    information requirement: Has the adversary used Parent PID Spoofing for privilege escalation? Method
    (Symbolic Logic): Join each process-start from ETW Microsoft-Windows-Kernel-Process (which records
    the true creating ProcessId) to the corresponding Sysmon Event ID 1 / Windows Event ID 4688 record
    (reported ParentProcessId). Alert deterministically whenever the kernel-observed creator PID/image
    does not equal the reported parent PID/image for the same new ProcessGuid, excluding the documented
    UAC path (consent.exe/svchost.exe assigning PPID after a SYSTEM-spawned elevation). This is the definitive
    PPID-spoofing primitive per [Detecting Parent PID (PPID) Spoofing](https://www.countercept.com/blog/detecting-parent-pid-spoofing/)
    and the original [SelectMyParent](https://blog.didierstevens.com/2009/11/22/quickpost-selectmyparent-or-playing-with-the-windows-process-tree/)
    PoC.'
  answer_sources:
  - etw:Microsoft-Windows-Kernel-Process
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, administrative workstations, and critical application servers with ETW kernel-process
    tracing and Sysmon enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      JOIN etw_kernel_process AS k ON proc_start (true_creator_pid)
        WITH (sysmon_id1 OR sec_4688) AS r ON new_process_guid
      WHERE k.true_creator_pid != r.reported_parent_pid
         OR lower(k.true_creator_image) != lower(r.reported_parent_image)
      AND NOT (r.reported_parent_image IN ('consent.exe','svchost.exe') AND uac_elevation_context)
      => alert severity=high
- question: How many creator-not-equal-reported-parent mismatch events occur per host per day, and does
    any host exceed its role baseline (mean + 3 sigma) or involve a non-UAC creator?
  context: 'Rather than relying on a single observation, this models the RATE of PPID-spoofing API-path
    events as a frequency metric. Legitimate UAC elevations are the dominant benign source, so a 30-day
    per-host baseline lets you alert when daily mismatch counts exceed the host-role mean + 3 sigma, or
    whenever any single mismatch involves a non-UAC creator (Office app, script host, LOLBin). A spike
    in mismatches on a host that normally has none is a strong stealth signal that an adversary is repeatedly
    forging lineage to evade process-monitoring defenses. In the context of the Stealth tactic, a positive
    result supports the information requirement: Has the adversary used Parent PID Spoofing for privilege
    escalation? Method (Statistical Method): Count creator!=reported-parent mismatch events per host per
    day. Establish a 30-day baseline (legitimate UAC elevations are the dominant benign source); alert
    when the per-host daily count exceeds the host-role mean + 3 sigma, or when any single mismatch involves
    a non-UAC creator. Track the rate of such API-path events as a Frequency metric rather than relying
    on a single observation, following the rarity-scoring approach of [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - etw:Microsoft-Windows-Kernel-Process
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, administrative workstations, and critical application servers with ETW kernel-process
    tracing and Sysmon enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      base = stats count AS c BY host, day WHERE creator != reported_parent
             eval mean=avg(c), sd=stdev(c) BY host_role over 30d
      alert WHERE today.c > mean + 3*sd
         OR (creator NOT IN uac_creators)
- question: When per-host process provenance graphs are built from the kernel TRUE creator->child edge,
    which causal paths score as rare outliers (e.g., an Office/script-host creator yielding a child whose
    reported parent is explorer.exe or a SYSTEM process)?
  context: 'This ML approach (ProvDetector-style: TF-IDF + doc2vec + Local Outlier Factor) builds provenance
    graphs using the kernel-observed true creator edge, not the spoofed reported parent, then scores the
    rarity of each causal path. A spoofed lineage shows up as a rare path because the true origin (Office
    macro, mshta, wscript) is preserved in the graph even though the reported parent was forged to look
    benign. Alerts must surface the top-3 contributing edges/features (true creator image, reported parent
    image, child command-line token) so an analyst can validate the chain quickly. In the context of the
    Stealth tactic, a positive result supports the information requirement: Has the adversary used Parent
    PID Spoofing for privilege escalation? Method (Machine Learning): Build per-host process provenance
    graphs using the kernel TRUE creator->child edge, and score the rarity of each causal path with TF-IDF
    + doc2vec + Local Outlier Factor as in [Tactical Provenance-based Detection (ProvDetector)](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).
    A spoofed lineage produces a rare path (e.g., Office/script-host creator yielding a child whose reported
    parent is explorer.exe or a SYSTEM process). Alert text must surface the top-3 contributing edges/features
    (true creator image, reported parent image, child command-line token) driving the outlier score.'
  answer_sources:
  - etw:Microsoft-Windows-Kernel-Process
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - 'NAI: Domain Controllers, administrative workstations, and critical application servers with ETW kernel-process
    tracing and Sysmon enabled.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      build graph edges = (true_creator_image -> child_image) per host
      vectorize paths via TF-IDF + doc2vec
      score = LocalOutlierFactor(path_vectors)
      alert WHERE score in top rare percentile
        emit top3_features(true_creator, reported_parent, child_cmdline_token)
- question: For a 4688 child reporting a privileged system binary as its parent, does the surrounding
    logon (4624) and special-privilege (4672) context fail to match a documented service start, UAC elevation,
    or scheduled-task pattern?
  context: 'Correlate each 4688 with the most recent 4624 (logon) and 4672 (special privileges) for the
    same host/account, plus the ETW true creator where available. A child claiming a privileged parent
    (lsass.exe, services.exe, wininit.exe) is suspicious only when the launch context does not support
    a legitimate elevation/service path. Use a legitimate-lineage allowlist to suppress known-good chains.
    A mismatch where the logon/privilege context cannot explain a privileged parent indicates the adversary
    forged lineage to ride an elevated token or hide origin. In the context of the Stealth tactic, a positive
    result supports the information requirement: Has the adversary used Parent PID Spoofing for privilege
    escalation? Method (Symbolic Logic): Correlate Windows Event ID 4688 with the most recent 4624 (logon)
    and 4672 (special privileges) records for the same host and account, and where available the ETW true
    creator. Alert when a child reports a privileged system binary as parent but the launch context does
    not match a documented service start, UAC elevation, or scheduled-task pattern. Use the legitimate-lineage
    allowlist from [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)
    and the creator-vs-parent mismatch logic of [Detecting Parent PID (PPID) Spoofing](https://www.countercept.com/blog/detecting-parent-pid-spoofing/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - etw:Microsoft-Windows-Kernel-Process
  - 'NAI: Domain Controllers, administrative workstations, and critical application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      FOR each 4688 child:
        join latest 4624,4672 BY host,logon_id
        if reported_parent IN privileged_sys_bins
           AND lineage NOT IN legit_allowlist
           AND not(service_start OR uac OR sched_task)
        => alert
- question: Which parent-child process pairs (by host role and user context) fall below the 1st percentile
    of frequency or are entirely new over a 30-day baseline, especially where the reported parent is lsass.exe,
    services.exe, or wininit.exe?
  context: 'Profile parent-child pairs by host role and user context over 30 days and flag rare/new lineages,
    weighting heavily when the reported parent is a high-privilege binary that should never spawn arbitrary
    children. Also profile the token-elevation outcome (success/failure) of the surrounding logon as a
    State signal. A first-seen lineage with a SYSTEM-level reported parent is a strong indicator of spoofing
    for privilege escalation, since such parents have a tightly constrained legitimate child set. In the
    context of the Stealth tactic, a positive result supports the information requirement: Has the adversary
    used Parent PID Spoofing for privilege escalation? Method (Statistical Method): Profile parent-child
    process pairs by host role and user context over a 30-day baseline. Flag any lineage whose frequency
    falls below the 1st percentile or is entirely new, especially when the reported parent is lsass.exe,
    services.exe, or wininit.exe. Track State by also profiling the success/failure (token elevation outcome)
    of the surrounding logon, per the rarity methodology of [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - etw:Microsoft-Windows-Kernel-Process
  - 'NAI: Domain Controllers, administrative workstations, and critical application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline pair_freq = count BY (parent_image,child_image,host_role,user_ctx) over 30d
      alert WHERE pair_freq < p1 OR first_seen
         AND parent_image IN ('lsass.exe','services.exe','wininit.exe')
- question: Does a supervised classifier trained on 4688 lineage features score a process tree as inconsistent
    with normal elevation, and what are the top-3 contributing features?
  context: 'Train a supervised model (ProblemChild-style) on 4688 lineage features: parent image, child
    image, logon type, account type, integrity level, command-line length/entropy, and time-of-day. The
    model learns the shape of legitimate elevation and service-launch trees, then scores deviations. Spoofed
    lineages used for privilege escalation present anomalous feature combinations (e.g., interactive logon
    yet SYSTEM-parented child). Emitting the top-3 contributing features gives the analyst immediate triage
    context. In the context of the Stealth tactic, a positive result supports the information requirement:
    Has the adversary used Parent PID Spoofing for privilege escalation? Method (Machine Learning): Train
    a supervised classifier on 4688 lineage features (parent image, child image, logon type, account type,
    integrity level, command-line length/entropy, time-of-day) as in [ProblemChild](https://ar5iv.labs.arxiv.org/html/2008.04676).
    Score process trees inconsistent with normal elevation and emit the top-3 contributing features in
    the alert for analyst triage.'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - etw:Microsoft-Windows-Kernel-Process
  - 'NAI: Domain Controllers, administrative workstations, and critical application servers.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      features = [parent_img,child_img,logon_type,acct_type,integrity,cmd_len,cmd_entropy,hour]
      score = classifier.predict_proba(features)
      alert WHERE score > threshold
        emit top3_feature_attribution
- question: Does a 4688/ETW record show a creator process that does not match the reported parent where
    that reported parent is on a watchlist of privileged system processes (lsass.exe, services.exe, wininit.exe,
    smss.exe), excluding the UAC consent path?
  context: 'Deterministic rule: alert when creator != reported parent AND the reported parent is a high-privilege
    system process that, by invariant, never legitimately spawns arbitrary children (lsass.exe never spawns;
    services.exe spawns only svchost.exe and known services). Exclude documented Windows management paths
    such as consent.exe spawning an elevated child. A match means an adversary forged a SYSTEM-level parent
    to inherit its token or to hide the real origin of the new process. In the context of the Stealth
    tactic, a positive result supports the information requirement: Has the adversary used Parent PID
    Spoofing for privilege escalation? Method (Symbolic Logic): Trigger when Windows Event ID 4688 (or
    ETW) records a creator process that does not match the reported parent and the parent is on a watchlist
    of privileged system processes (lsass.exe, services.exe, wininit.exe, smss.exe). Exclude known Windows
    management paths such as consent.exe spawning an elevated child for UAC. Invariant basis: [Non services.exe
    Spawn of svchost.exe](https://research.splunk.com/endpoint/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/)
    and lsass-never-spawns guidance in [Process Injection - Red Canary](https://redcanary.com/threat-detection-report/techniques/process-injection/).'
  answer_sources:
  - Windows Event ID 4688
  - etw:Microsoft-Windows-Kernel-Process
  - 'NAI: All Windows endpoints and servers with enhanced process creation logging enabled (including
    command line and creator process).'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      WHERE creator_process_name != parent_process_name
        AND parent_process_name IN ('lsass.exe','services.exe','wininit.exe','smss.exe')
        AND NOT uac_consent_path
      => alert severity=high
- question: For each mismatched creator-parent tuple, which tuples fall below the 5th percentile of frequency
    over a 30-day baseline or are first-seen on that host role, particularly tuples involving Office,
    script hosts, or LOLBins?
  context: 'For every creator!=parent mismatch, compute the frequency of the (creator,parent) tuple over
    30 days and flag rare (sub-5th-percentile) or first-seen tuples. This separates rare malicious spoofs
    from the common, repetitive benign UAC pattern. Newly observed tuples where the creator is an Office
    app, script host, or LOLBin are especially suspicious because they represent an unusual binary forging
    a privileged or trusted parent. In the context of the Stealth tactic, a positive result supports the
    information requirement: Has the adversary used Parent PID Spoofing for privilege escalation? Method
    (Statistical Method): For each mismatched creator-parent tuple, compute frequency over a 30-day baseline
    and alert on tuples below the 5th percentile or first-seen on that host role. Treat newly observed
    tuples involving Office, script hosts, or LOLBins as especially suspicious, following the rare-tuple
    scoring of [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - etw:Microsoft-Windows-Kernel-Process
  - 'NAI: All Windows endpoints and servers with enhanced process creation logging enabled (including
    command line and creator process).'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      tuple_freq = count BY (creator_image,parent_image) over 30d WHERE creator!=parent
      alert WHERE tuple_freq < p5 OR first_seen_on_host_role
        flag if creator IN office|script_hosts|lolbins
- question: When process-creation tuples (creator, spoofed parent, child, user context, integrity, logon
    type) are clustered with an unsupervised model, which records land as noise or in tiny isolated clusters?
  context: 'Train an unsupervised Isolation Forest / DBSCAN model on process-creation features. Benign
    activity forms dense clusters; spoofed lineage tends to be isolated as noise or in tiny clusters because
    its feature combination (rare creator, privileged/trusted reported parent, anomalous integrity) is
    unlike the majority. Surface the top-3 features (creator image, reported parent, child command-line
    token) for triage. This catches novel spoofing variants that signature rules miss. In the context
    of the Stealth tactic, a positive result supports the information requirement: Has the adversary used
    Parent PID Spoofing for privilege escalation? Method (Machine Learning): Train an unsupervised Isolation
    Forest / clustering model on process-creation tuples, user context, integrity, and logon type per
    [Isolation Forest](https://doi.org/10.1145/2133360.2133363). Records landing as noise or in a tiny
    isolated cluster are likely spoofed lineage; surface the top-3 features (creator image, reported parent,
    child command-line token) in the alert.'
  answer_sources:
  - Windows Event ID 4688
  - etw:Microsoft-Windows-Kernel-Process
  - 'NAI: All Windows endpoints and servers with enhanced process creation logging enabled (including
    command line and creator process).'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      X = [creator,reported_parent,child,user_ctx,integrity,logon_type]
      model = IsolationForest()/DBSCAN()
      alert WHERE anomaly_score high OR cluster_size tiny/noise
        emit top3_features
- question: Does any 4688 parent-child relationship originate from a privileged system process that is
    not on the allowlist of expected privileged chains (services.exe->svchost.exe, wininit.exe->services.exe,
    smss.exe->csrss.exe), especially an interactive shell, script host, or LOLBin child?
  context: 'Maintain a tight allowlist of legitimate privileged chains and alert on any privileged-parent
    relationship outside it, weighting heavily when the child is an interactive shell, script host, or
    LOLBin, or when child integrity is High/System. High-privilege system processes have an extremely
    constrained legitimate child set, so a deviation strongly suggests an adversary forged the parent
    to escalate privileges via token inheritance. In the context of the Stealth tactic, a positive result
    supports the information requirement: Has the adversary used Parent PID Spoofing for privilege escalation?
    Method (Symbolic Logic): Maintain an allowlist of expected privileged chains (services.exe->svchost.exe,
    wininit.exe->services.exe, smss.exe->csrss.exe). Alert on any 4688 parent-child relationship from
    a privileged system process not on the allowlist, especially an interactive shell, script host, or
    LOLBin child. Allowlist derived from [Unusual Parent-Child Relationship](https://detection.fyi/elastic/detection-rules/windows/privilege_escalation_unusual_parentchild_relationship/)
    and [Sigma parent-child rules](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_parent_explorer.yml).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Critical infrastructure servers (Domain Controllers, Certificate Authorities) and administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      allow = {services.exe->svchost.exe, wininit.exe->services.exe, smss.exe->csrss.exe}
      WHERE parent_image IN privileged_sys_bins
        AND (parent_image,child_image) NOT IN allow
        AND (child IN shells|script_hosts|lolbins OR child_integrity IN High,System)
      => alert
- question: Over a 30-day baseline of parent-child pairs by host role, which new pairs or pairs with a
    z-score above 3 (especially with a high-privilege parent) should be alerted?
  context: 'Build a per-host-role baseline of parent-child pair frequencies and compute a z-score/rarity
    score per pair, deriving thresholds from each server class''s own distribution. New pairs or those
    with z>3 indicate statistically anomalous lineage. When the parent is a high-privilege binary and
    the child is newly elevated, the anomaly is consistent with PPID spoofing for privilege escalation
    on critical infrastructure. In the context of the Stealth tactic, a positive result supports the information
    requirement: Has the adversary used Parent PID Spoofing for privilege escalation? Method (Statistical
    Method): Build a 30-day baseline of parent-child pairs by host role and compute a z-score/rarity score
    per pair; alert on new pairs or z>3. Derive dataset-specific thresholds from each server class''s
    own distribution, per [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Critical infrastructure servers (Domain Controllers, Certificate Authorities) and administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline = freq BY (parent_image,child_image,host_role) over 30d
      z = (obs - mean)/sd
      alert WHERE z > 3 OR pair is new
        prioritize parent_image IN privileged_sys_bins
- question: Does an LSTM-autoencoder over per-host process-creation order produce high reconstruction
    error for a tree where a privileged parent launches an unusual child, and what are the top-3 deviating
    steps?
  context: 'Train a sequence anomaly model (LSTM autoencoder) on per-host process-creation order to learn
    expected boot/service/admin sequences. A spoofed lineage breaks the learned order (e.g., a SYSTEM-level
    parent launching an unexpected child mid-session), yielding high reconstruction error. Surfacing the
    top-3 deviating steps helps the analyst see exactly where the chain departs from normal, supporting
    detection of stealthy escalation. In the context of the Stealth tactic, a positive result supports
    the information requirement: Has the adversary used Parent PID Spoofing for privilege escalation?
    Method (Machine Learning): Use a sequence anomaly model (e.g., LSTM autoencoder) on per-host process-creation
    order to learn expected boot/service/admin sequences; flag trees with high reconstruction error when
    a privileged parent launches an unusual child, surfacing the top-3 deviating steps. Graph-context
    approach mirrors [Tactical Provenance-based Detection (ProvDetector)](https://www.ndss-symposium.org/wp-content/uploads/2020/02/24046-paper.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: Critical infrastructure servers (Domain Controllers, Certificate Authorities) and administrative
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: |-
      seq = ordered process_creations per host
      recon_err = LSTM_autoencoder.reconstruct(seq)
      alert WHERE recon_err > threshold
        emit top3_deviating_steps
- question: Does an elevated 4688 process creation follow a 4624/4672 logon but originate from something
    other than consent.exe (or carry Token Elevation Type 1/2 without consent.exe as parent), indicating
    UAC bypass via PPID spoofing?
  context: 'Legitimate interactive elevation flows through consent.exe (the UAC prompt). Alert when an
    elevated process tied to an admin account follows a logon but does not originate from consent.exe
    or an approved administrative workflow, or when Token Elevation Type is Type 1/Type 2 yet the parent
    is not consent.exe. This catches the SYSTEM-token-inheritance escalation path where an adversary assigns
    a SYSTEM parent to gain an elevated token while skipping the standard UAC prompt. In the context of
    the Stealth tactic, a positive result supports the information requirement: Has the adversary used
    Parent PID Spoofing for privilege escalation? Method (Symbolic Logic): Alert when a 4688 process creation
    tied to an elevated account follows a 4624/4672 logon but does not originate from consent.exe or an
    approved administrative workflow. The SYSTEM-token-inheritance escalation path is documented in [Becoming
    SYSTEM via Parent Process Token Inheritance](https://blog.xpnsec.com/becoming-system/); legitimate
    UAC PPID assignment is described in [Detecting Parent PID (PPID) Spoofing](https://www.countercept.com/blog/detecting-parent-pid-spoofing/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: User workstations, particularly for users with administrative privileges.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: |-
      WHERE 4688.elevated_token AND preceding 4624/4672 for acct
        AND parent_process_name != 'consent.exe'
        AND token_elevation_type IN (Type1,Type2)
        AND NOT approved_admin_workflow
      => alert
- question: Does the distribution of reported parent processes for elevation-related launches per user/host
    shift sharply (e.g., a new appearance of svchost.exe or lsass.exe as parent), and does the failure
    rate of nearby elevation attempts change?
  context: 'Baseline the per-user/host distribution of reported parents for elevation events (normally
    consent.exe, explorer.exe). Compute entropy and flag sudden drops or the appearance of rare parents
    like svchost.exe/lsass.exe for user-launched elevation. Also profile the failure/denied rate of nearby
    4672 elevation attempts as a distinct State signal. A spike toward unusual parents indicates an adversary
    forging lineage to obtain elevated tokens. In the context of the Stealth tactic, a positive result
    supports the information requirement: Has the adversary used Parent PID Spoofing for privilege escalation?
    Method (Statistical Method): Baseline the distribution of reported parent processes for elevation-related
    launches per user/host. Flag a sharp shift such as a new appearance of svchost.exe or lsass.exe as
    the reported parent for user-launched elevation. Also profile the failure rate of nearby elevation
    attempts (denied/failed 4672) as a distinct State signal, extending [CAR-2014-11-002](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4624
  - Windows Event ID 4672
  - 'NAI: User workstations, particularly for users with administrative privileges.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: |-
      baseline parent_dist per (user,host) for elevation events
      entropy_now vs entropy_base
      alert WHERE entropy drop OR rare_parent IN ('svchost.exe','lsass.exe')
      also track denied_4672_rate as state
- question: Does a classifier trained on elevation events (creator image, reported parent, account type,
    session/integrity, time-of-day) separate routine elevation from bypass, and what are the top-3 contributing
    features?
  context: 'Train a decision-tree/gradient-boosted classifier (ProblemChild-style) on elevation features
