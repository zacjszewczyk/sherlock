questions:
- question: '[Stealth] Detect common delay primitives preceding suspicious execution: Can you determine
    whether a process or script performs explicit delay behavior (sleep, timeout, Start-Sleep, ping loops,
    deliberate idle loops) immediately before launching suspicious child processes or executing suspicious
    commands, consistent with evasion of sandbox and analyst triage time windows. -- specifically, using
    the ''Detect common delay primitives preceding suspicious execution'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary employs time-based methods
    to delay execution so that malicious activity falls outside sandbox and analyst triage windows and
    blends in with benign operations. This evidence focuses on the condition that a process or script
    performs explicit delay behavior (sleep, timeout, Start-Sleep, ping loops, deliberate idle loops)
    immediately before launching suspicious child processes or executing suspicious commands, consistent
    with evasion of sandbox and analyst triage time windows. This Symbolic Logic approach works as follows:
    On process creation (Event ID 4688 / Sysmon EID 1) flag known delay primitives — powershell Start-Sleep/Sleep,
    cmd `timeout`, `choice /t`, `ping -n/-w` loops to loopback, shell `sleep`/`nanosleep` loops, AppleScript
    `delay` — that are followed within a bounded window (1–30 min) by a high-risk child (rundll32.exe,
    regsvr32.exe, mshta.exe, wscript.exe/cscript.exe, certutil.exe, bitsadmin.exe) or by execution from
    user-writable paths (Downloads/AppData/Temp/\tmp). These are the exact primitives catalogued in Atomic
    Red Team T1497.003 and the stalling/timing taxonomy of Afianian et al.. Correlate to near-term outbound
    sessions (Zeek conn.log) to rare destinations/uncommon ports for the same host. A positive result
    -- a rule match, statistical outlier, or model alert -- indicates probable delayed-execution evasion;
    pivot to the responsible process and its parent/child lineage, the command line and any delay primitive
    or scheduling artifact, the user and host, the time gap between the delay/logon/task-creation and
    the follow-on activity, and any subsequent outbound connections to rare destinations to scope what
    the delay was concealing. Profile the failure state explicitly: a delay or deferred-execution mechanism
    that expires with no follow-on child process or outbound connection is benign and should be suppressed.
    A negative result helps rule out this particular delay vector but should be corroborated with the
    other questions in this playbook, since a single method can miss stealthy, low-and-slow, or living-off-the-land
    timing evasion. Citations: [Atomic Red Team T1497.003](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1497.003/T1497.003.md);
    [Afianian et al.](https://arxiv.org/abs/1811.01190).'
