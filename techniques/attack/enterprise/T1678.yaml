  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary employs time-based methods
    to delay execution so that malicious activity falls outside sandbox and analyst triage windows and
    blends in with benign operations. This evidence focuses on the condition that a process or script
    performs explicit delay behavior (sleep, timeout, Start-Sleep, ping loops, deliberate idle loops)
    immediately before launching suspicious child processes or executing suspicious commands, consistent
    with evasion of sandbox and analyst triage time windows. This Statistical Method approach works as
    follows: Per host role, baseline (a) typical parent-child chains, (b) inter-process time gaps, and
    (c) rolling counts of identical/near-identical command lines (Volume/Frequency). Flag chains where
    the gap between an initial benign command and a subsequent high-risk executable exceeds the host''s
    99th percentile, or where repetition count of a trivial command (ping/sleep) per 5-min window exceeds
    the 99th percentile. Set thresholds from 30 days of per-role history; timing/sleep checks are among
    the most reused evasion families so base rates are stable enough to tune against (Maffia et al.).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable delayed-execution
    evasion; pivot to the responsible process and its parent/child lineage, the command line and any delay
    primitive or scheduling artifact, the user and host, the time gap between the delay/logon/task-creation
    and the follow-on activity, and any subsequent outbound connections to rare destinations to scope
    what the delay was concealing. Profile the failure state explicitly: a delay or deferred-execution
    mechanism that expires with no follow-on child process or outbound connection is benign and should
    be suppressed. A negative result helps rule out this particular delay vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land timing evasion. Citations: [Maffia et al.](https://arxiv.org/abs/2112.11289).'
