- question: '[Stealth] Detect ping-as-sleep chained to cleanup or staging: Can you determine whether a
    process or script performs explicit delay behavior (sleep, timeout, Start-Sleep, ping loops, deliberate
    idle loops) immediately before launching suspicious child processes or executing suspicious commands,
    consistent with evasion of sandbox and analyst triage time windows. -- specifically, using the ''Detect
    ping-as-sleep chained to cleanup or staging'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary employs time-based methods
    to delay execution so that malicious activity falls outside sandbox and analyst triage windows and
    blends in with benign operations. This evidence focuses on the condition that a process or script
    performs explicit delay behavior (sleep, timeout, Start-Sleep, ping loops, deliberate idle loops)
    immediately before launching suspicious child processes or executing suspicious commands, consistent
    with evasion of sandbox and analyst triage time windows. This Symbolic Logic approach works as follows:
    Match the deterministic ransomware delay floor `cmd /c ping 127.0.0.x -n N > /dev/null & (del|copy|<exe>)`
    — `ping -n` used as a portable ~N-second sleep before self-deletion or payload launch — per Suspicious
    Ping/Del, SigmaHQ. Alert on any command line containing `ping`, a `-n`/`-w` count >2, `Nul` redirection,
    and a chained `del /f /q`, `copy`, `move`, or executable invocation. Keep this hard rule even when
    ML is deployed. A positive result -- a rule match, statistical outlier, or model alert -- indicates
    probable delayed-execution evasion; pivot to the responsible process and its parent/child lineage,
    the command line and any delay primitive or scheduling artifact, the user and host, the time gap between
    the delay/logon/task-creation and the follow-on activity, and any subsequent outbound connections
    to rare destinations to scope what the delay was concealing. Profile the failure state explicitly:
    a delay or deferred-execution mechanism that expires with no follow-on child process or outbound connection
    is benign and should be suppressed. A negative result helps rule out this particular delay vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land timing evasion. Citations: [Suspicious Ping/Del, SigmaHQ](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_cmd_ping_del_combined_execution.yml).'
