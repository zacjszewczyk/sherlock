name: 'T1678: Delay Execution'
id: 3a01c6ae-50b6-4819-9424-67dd6c2219c6
description: 'This playbook helps an analyst investigate whether an adversary is deliberately delaying
  execution (MITRE ATT&CK T1678, Delay Execution) to evade detection and analysis under the Stealth tactic
  (TA0005). Adversaries use time-based methods -- programmatic sleep/Start-Sleep/timeout, ping or choice
  loops used as portable sleeps, AppleScript delay, nanosleep loops, Native API hammering, and near-future
  scheduled tasks/cron/at/launchd jobs -- to stall malicious activity past sandbox and analyst triage
  windows, blend into benign activity, and overload automated analysis. The hunt spans Windows, Linux,
  and macOS endpoints plus network egress telemetry and pursues the behavior from several complementary
  angles: delay primitives immediately preceding a high-risk child process or execution from user-writable
  paths; ping-as-sleep chained to self-deletion, copy/move, or payload launch; processes that start but
  only initiate their first outbound connection after a long dormant period (dormant-then-active beaconing);
  scheduling mechanisms created shortly after compromise to fire after a short delay; loops and needless
  repetition of benign commands (ping/sleep) or API hammering used as a delay stage before a payload stage;
  and suspicious execution that begins only after an atypically long offset from logon or host uptime.
  Detection methods combine deterministic symbolic-logic rules (delay-primitive-to-high-risk-child correlation,
  ping/del Sigma rules, scheduled-task creation rules, logon-to-execution correlation), statistical baselining
  (per-role inter-process time gaps, repetition volume/frequency percentiles, time-to-first-connection
  and beacon cadence via Fourier/CV analysis, task-creation-rate forecasting, time-from-logon-to-suspicious-process
  tails), and machine learning (LSTM/HMM sequence and log-key models, semi-supervised delayed-beacon ranking,
  Isolation Forest tail ranking, command-line/API-sequence clustering), applied across Windows Security
  and Sysmon events, auditd, macOS unified logs, and Zeek conn/dns/http/ssl logs, so the analyst can corroborate
  suspected delayed-execution evasion against process lineage, command lines, scheduling artifacts, logon
  timing, and outbound activity. Throughout, the failure state is profiled explicitly: a delay block or
  scheduled task whose timer expires with no follow-on child process or outbound connection is benign
  and should be suppressed.'
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
