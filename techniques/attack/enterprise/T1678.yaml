- question: '[Stealth] Risk scoring for delayed beaconing behavior: Can you determine whether a process
    exhibits long idle periods or delayed network beaconing where the first outbound connection occurs
    significantly after process start, suggesting timed execution intended to evade automated analysis
    and short-duration monitoring. -- specifically, using the ''Risk scoring for delayed beaconing behavior''
    (Machine Learning) approach?'
  context: 'Why this matters: Under the Stealth tactic (TA0005), an adversary employs time-based methods
    to delay execution so that malicious activity falls outside sandbox and analyst triage windows and
    blends in with benign operations. This evidence focuses on the condition that a process exhibits long
    idle periods or delayed network beaconing where the first outbound connection occurs significantly
    after process start, suggesting timed execution intended to evade automated analysis and short-duration
    monitoring. This Machine Learning approach works as follows: Train a semi-supervised ranker on per-process
    features (path reputation system vs user-writable, signer/trust category, parent process, command-line
    tokens, time-to-first-connection, byte volume/ratio of first sessions) and rank long-delay processes
    that later connect to uncommon domains/ASNs. Behavioral-differencing of endpoint vs expected/sandbox
    behavior ranks dormant-then-active samples (BareCloud, Kirat et al.); use Isolation Forest, Liu et
    al. for unsupervised tail ranking. Emit the top-3 features driving each score in the alert. A positive
    result -- a rule match, statistical outlier, or model alert -- indicates probable delayed-execution
    evasion; pivot to the responsible process and its parent/child lineage, the command line and any delay
    primitive or scheduling artifact, the user and host, the time gap between the delay/logon/task-creation
    and the follow-on activity, and any subsequent outbound connections to rare destinations to scope
    what the delay was concealing. Profile the failure state explicitly: a delay or deferred-execution
    mechanism that expires with no follow-on child process or outbound connection is benign and should
    be suppressed. A negative result helps rule out this particular delay vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land timing evasion. Citations: [BareCloud, Kirat et al.](https://www.usenix.org/conference/usenixsecurity14/technical-sessions/presentation/kirat);
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363).'
