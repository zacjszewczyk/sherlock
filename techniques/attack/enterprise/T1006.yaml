name: 'T1006: Direct Volume Access'
id: df5a5362-8c87-4883-9d4b-6365711f575b
description: Investigate possible Direct Volume Access (T1006), in which an adversary reads or writes
  files by opening raw handles to logical volumes or physical drives (e.g., \\.\C:, \\.\PhysicalDrive0)
  or harvests shadow copies and backups to bypass file access controls and file-system monitoring. This
  playbook helps a SOC analyst hunt for execution of known direct-volume tooling and LOLBins (Invoke-NinjaCopy,
  rawdd, vssadmin, esentutl, wbadmin), rare or obfuscated command lines and PowerShell script blocks invoking
  raw-disk APIs (CreateFileW, DeviceIoControl, NtCreateFile, System.IO.FileStream), non-allowlisted processes
  requesting handles to volume/drive objects with permissive access masks, and the full volume-access-to-staging-to-exfiltration
  kill chain. It pairs symbolic-logic detections with statistical baselining and machine-learning models
  across Windows endpoint, PowerShell, and network telemetry, and extends to network-device CLI raw-storage
  access.
type: technique
related:
- tactic_id: TA0005
  tactic_name: Stealth
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
