questions:
- question: 'Did a process or PowerShell script execute a known direct-volume-access or raw-disk tool
    (for example Invoke-NinjaCopy.ps1 opening a \\.\C: raw handle, or rawdd.exe) whose process name, command
    line, script text, or file hash matches a managed list of such utilities?'
  context: 'Direct volume access tooling lets an adversary read files straight off the disk, bypassing
    NTFS ACLs and most file-system monitoring (Stealth). Maintain curated allow/deny lists of known offensive
    utilities and their hashes and match Event ID 4688 process fields and Event ID 4104 script-block content
    against them. A hit on a critical server, admin workstation, or backup host is a high-confidence indicator
    of concealment-driven collection; validate detection coverage with Atomic Red Team T1006. A clean
    result lowers but does not eliminate suspicion, since custom tooling may not match known IOCs. Source
    references: [Invoke-NinjaCopy (PowerSploit)](https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Invoke-NinjaCopy.ps1);
    [Atomic Red Team T1006](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1006/T1006.md).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = WinEventLog(4688) OR WinEventLog(4104);\nmatch = events where (process_name in tool_list)\n\
      \  OR (command_line ~ /Invoke-NinjaCopy|rawdd|\\\\\\\\\\.\\\\[A-Z]:/i)\n  OR (file_hash in tool_hash_list)\n\
      \  OR (script_block ~ /NinjaCopy|raw handle/i);\nalert immediately on match; enrich with host role,\
      \ user, parent_process."
- question: On hosts in scope, is a rarely seen process or command-line token (using keywords like 'copy',
    'raw', 'disk', 'volume', or the device prefix \\.\) appearing on very few endpoints across the fleet,
    indicating low-prevalence and therefore suspicious activity?
  context: 'Adversary tooling for direct volume access is typically rare across an enterprise, so rarity
    itself is a useful malice prior (Stealth). Compute 30-day fleet prevalence per process name and command-line
    token; when a process appears on fewer than 5 hosts (or <0.1% of endpoints) and carries raw-disk keywords,
    raise the host risk score and alert when the aggregate crosses a threshold derived from the 99th percentile
    of daily distinct-host counts. High prevalence (common admin tools) argues for benign use; extreme
    rarity combined with raw-disk terms argues for investigation. Source reference: [Using Frequency Analysis
    to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'prev = stats dc(host) as hostcount by process_name, cmd_token over 30d;

      rare = prev where hostcount < 5 OR hostcount < 0.001*total_hosts;

      risky = rare where cmd_token in [''copy'',''raw'',''disk'',''volume'',''\\\\.\\''];

      thr = percentile(daily_distinct_host_counts, 99);

      boost host_risk; alert when host_risk > thr.'
- question: Does the command line of a suspect process show high Shannon entropy or an unusually high
    non-alphanumeric character ratio, suggesting obfuscation that conceals direct-volume tooling?
  context: 'Attackers obfuscate command lines to evade signature rules while still performing raw-disk
    access (Stealth). Compute Shannon entropy and the non-alphanumeric ratio of each command line and
    flag values above the host''s 98th percentile or an absolute entropy greater than 4.5 bits/char, mirroring
    packing/encryption entropy thresholds. High entropy on a process touching device paths strongly suggests
    deliberate concealment; normal, readable command lines reduce concern. Source reference: [Using Entropy
    Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for each proc: e = shannon_entropy(command_line);

      r = nonalnum_chars(command_line)/len(command_line);

      flag when e > p98(host_cmd_entropy) OR e > 4.5 OR r > p98(host_nonalnum_ratio);

      raise obfuscation signal; correlate with device-path keywords.'
- question: When the supervised process-execution classifier scores a new process creation, does it return
    high malicious confidence for direct-volume behavior, and which features drive that score?
  context: 'A trained model can catch direct-volume tooling that evades static IOCs (Stealth). Score new
    Event ID 4688 events with a Random Forest/XGBoost model using command-line TF-IDF tokens, entropy,
    parent process, and user context; alert on confidence >0.9 and surface the top-3 contributing features
    (e.g., ''\\.\ device path'', ''rare parent'', ''high entropy'') so analysts can quickly judge the
    verdict. High-confidence hits warrant immediate triage; the feature attributions distinguish true
    raw-disk access from benign rare tools. Source reference: [Comprehensive Evaluation of Mal-API-2019
    by Machine Learning](https://arxiv.org/abs/2403.02232).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: 'feat = tfidf(command_line) + [entropy, parent_process, user_ctx];

      score = rf_xgb_model.predict_proba(feat);

      alert when score > 0.90;

      include top3 = shap/feature_importance(feat) in alert text.'
- question: Was a legitimate system utility such as vssadmin.exe, esentutl.exe, or wbadmin.exe (or PowerShell)
    executed with parameters indicating shadow-copy creation, raw disk reads, or export of volume data
    to a staging location?
  context: 'These signed LOLBins are routinely abused to copy volume data while appearing benign (Stealth).
    Apply regex to Event ID 4688/4104 for commands like ''vssadmin create shadow'', ''esentutl.exe /y
    /vss'', ''wbadmin start backup'', or device paths (\\.\PhysicalDrive*, \\.\C:) and alert on matches,
    leveraging documented LOLBAS abuse and Sigma esentutl/VSS rules. Such commands on domain controllers
    (e.g., to extract NTDS.dit) or file/database servers are especially suspicious; legitimate backup
    software running on schedule provides benign context. Source references: [Esentutl (LOLBAS)](https://lolbas-project.github.io/lolbas/Binaries/Esentutl/);
    [Sigma esentutl/VSS rules](https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_esentutl_volume_shadow_copy.yml).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'events = WinEventLog(4688) OR WinEventLog(4104);

      alert when command_line ~ /vssadmin\s+create\s+shadow|esentutl(\.exe)?\s+\/y\s+\/vss|wbadmin\s+start\s+backup|\\\\\.\\(PhysicalDrive\d+|[A-Z]:)/i;

      enrich host_role, user, parent_process.'
- question: Do WMI-Activity logs show Win32_ShadowCopy.Create invocations that read volume data outside
    the scheduled backup window, correlated with the suspect process activity?
  context: 'Adversaries frequently create shadow copies via WMI to evade command-line-only detections
    (Stealth). Correlate process events with WMI-Activity Event IDs 5857-5861 for Win32_ShadowCopy.Create
    calls that occur outside approved backup windows. A shadow-copy creation via WMI off-schedule, especially
    on a DC or file server, indicates covert volume harvesting; activity inside the normal backup window
    aligned with the backup service account is likely benign. Source reference: [WMI vs WMI: Monitoring
    for Malicious Activity](https://www.mandiant.com/resources/blog/wmi-vs-wmi-monitoring-malicious-hacker-tools).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: SIEM correlation pseudocode
    query: 'wmi = WinEventLog(5857-5861) where operation ~ /Win32_ShadowCopy.*Create/;

      off = wmi where ts NOT in scheduled_backup_window;

      join off with process_events on host, time_window=5m;

      alert with initiating_process, user, namespace.'
- question: Is the per-host invocation frequency of vssadmin/esentutl/wbadmin spiking above its 30-day
    baseline, or is the utility running on a host that has almost never used it, including failed or access-denied
    attempts?
  context: 'Baselining utility usage detects abuse hidden among legitimate runs (Stealth). Track per-host
    count/min and daily invocation frequency for these tools; flag executions exceeding the rolling 30-day
    mean +3 sigma or occurring on hosts with fewer than 5 prior runs. Separately profile failed/aborted
    invocations (non-zero exit, access-denied) as a distinct probing signal. A sudden spike or first-ever
    use on a sensitive host suggests adversary activity; steady, expected cadence indicates routine operations.
    Source reference: [Beehive](https://doi.org/10.1145/2523649.2523670).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = stats mean(daily_runs) as mu, stdev(daily_runs) as sd by host, util over 30d;

      alert when today_runs > mu + 3*sd;

      alert when prior_runs(host,util) < 5;

      profile separately: runs where exit_code != 0 OR status=''access_denied''.'
- question: Are the command-line arguments passed to vssadmin/esentutl/wbadmin unusually complex or high
    entropy compared with this host's normal usage of those utilities?
  context: 'Even legitimate LOLBins get wrapped in obfuscated argument strings by attackers (Stealth).
    Baseline the entropy of command-line arguments for these utilities per host and flag executions above
    the host''s 95th percentile, indicating obfuscation or abnormal complexity. Elevated entropy on an
    otherwise predictable utility suggests evasion; typical, low-entropy arguments are benign. Source
    reference: [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for runs of {vssadmin,esentutl,wbadmin}: e = shannon_entropy(args);

      flag when e > p95(host_util_arg_entropy);

      raise obfuscation signal; correlate with util frequency anomaly.'
- question: Did an improbable execution sequence occur on a host or for a user (for example vssadmin ->
    7z -> powershell -enc within minutes) that an execution-sequence model rates as anomalous?
  context: 'Volume access is rarely a lone event; chaining shadow-copy creation with compression and encoded
    PowerShell reveals intent to collect and stage data covertly (Stealth). Train an HMM/Markov chain
    on typical legitimate execution sequences per user/host and alert when an improbable transition sequence
    occurs within minutes, including the contributing transition probabilities in the alert. A rare, tightly-timed
    sequence is a strong signal of staged collection; common, well-trodden sequences are likely benign
    administration. Source reference: [Detecting Intrusions Using System Calls: Alternative Data Models](https://ieeexplore.ieee.org/document/766910).'
  answer_sources:
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations,
    Backup Infrastructure Servers'
  range: Last 90 days, with event-centered sequence correlation (minutes-scale windows).
  queries:
  - technology: ML/Pseudocode
    query: 'model = HMM/Markov.fit(legit_exec_sequences per user,host);

      p = model.sequence_prob(observed_chain within 10m);

      alert when p < threshold AND chain contains {vssadmin,7z|rar|tar,powershell -enc};

      include low-prob transitions in alert.'
- question: Did a non-allowlisted process request a handle to a logical volume (\Device\HarddiskVolume*)
    or physical drive (\Device\Harddisk*) object, as captured by Windows Event ID 4656?
  context: 'Opening a raw handle to a volume or drive object is the core action of Direct Volume Access
    (Stealth). Alert when Event ID 4656 shows a process outside the approved allowlist requesting a handle
    to a HarddiskVolume or Harddisk object. Such a request from an unexpected binary on a critical server
    or admin workstation is highly suspicious; requests from known backup/imaging tools form the allowlist
    baseline. Requires object-handle auditing on the relevant SACLs. Source reference: [4656: A handle
    to an object was requested](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4656).'
  answer_sources:
  - Windows Event ID 4656
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "e = WinEventLog(4656);\nalert when object_name ~ /\\\\Device\\\\Harddisk(Volume)?\\d+/\n \
      \ AND process_name NOT in handle_allowlist;\nenrich access_mask, success_fail, user, host_role."
- question: Among allowlisted processes, is a rare Access Mask value or a high-privilege right (WRITE_DAC/WRITE_OWNER/GENERIC_ALL)
    being requested against a volume/drive object, or are there failed (access-denied) handle requests
    indicating probing?
  context: 'Even trusted processes can be hijacked, so the requested rights matter (Stealth). Baseline
    each allowlisted process''s Access Mask values for volume/drive objects and flag rare masks (<1% occurrence)
    or unusually permissive rights. Separately profile failed (F) handle requests as a distinct probing
    signal. Rare or overly-broad masks suggest abuse or injected code; repeated access-denied attempts
    suggest reconnaissance before a successful bypass. Source references: [4656 documentation](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4656);
    [Using Frequency Analysis to Defend Office 365](https://learn.microsoft.com/en-us/archive/blogs/office365security/using-frequency-analysis-to-defend-office-365).'
  answer_sources:
  - Windows Event ID 4656
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = stats count by process_name, access_mask over 30d;

      rare = base where freq(access_mask|process) < 0.01;

      alert when rare OR access_mask has WRITE_DAC|WRITE_OWNER|GENERIC_ALL;

      profile separately: 4656 where result=''failure''(F) as probing.'
- question: Does the unsupervised anomaly model flag an Event ID 4656 handle request as an outlier direct-volume
    attempt, and which features explain the anomaly?
  context: 'Unsupervised models catch novel direct-volume access patterns without prior labels (Stealth).
    Score Event ID 4656 features (Process Name, Object Name, Access Mask, success/fail) with an Isolation
    Forest or One-Class SVM and treat outliers as anomalous direct-volume attempts, surfacing the top-3
    contributing features via LIME. An outlier combining an unusual process with a volume object and permissive
    mask warrants triage; inliers reflect normal disk-handle operations. Source reference: [Robust IoT
    Security Using Isolation Forest and One-Class SVM](https://www.nature.com/articles/s41598-025-20445-4).'
  answer_sources:
  - Windows Event ID 4656
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: 'feat = encode(process_name, object_name, access_mask, success_fail);

      model = IsolationForest/OneClassSVM.fit(historical_4656);

      score = model.decision_function(feat);

      alert on outliers; explain via LIME top3 features.'
- question: Within a 30-minute window on one host, did a high-severity direct-volume-access alert occur,
    followed by a compression utility (7z/tar/rar) execution, and then a Zeek conn.log session sending
    more than 100MB to a new or rare destination?
  context: 'The complete attack chain — raw volume read, staging/compression, then exfiltration — is far
    more conclusive than any single stage (Stealth and downstream exfiltration). Alert when a host exhibits
    all three stages within 30 minutes: a direct-volume alert, a compression process, and a large outbound
    transfer to a new/rare destination. Hitting all three is a strong incident indicator; isolated stages
    may be benign (e.g., legitimate backup compression or normal egress). Source references: [Esentutl
    (LOLBAS)](https://lolbas-project.github.io/lolbas/Binaries/Esentutl/); [Invoke-NinjaCopy (PowerSploit)](https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Invoke-NinjaCopy.ps1).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Critical Servers (Domain Controllers, File Servers), Administrator Workstations, Network Egress
    Points'
  range: Last 90 days, with 30-minute event-centered chain correlation.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'stage1 = volume_access_alerts (high severity) by host;

      stage2 = process_events where image in [7z,tar,rar];

      stage3 = zeek_conn where bytes_out > 100MB AND dest in rare/new_destinations;

      alert when stage1 -> stage2 -> stage3 on same host within 30m.'
- question: After a T1006 alert on a host, did the host's outbound byte volume or connection rate exceed
    its rolling 30-day baseline for the same hour/day, including any blocked or failed egress?
  context: 'A post-alert traffic surge corroborates that volume access led to exfiltration (Stealth ->
    exfiltration). Compare the host''s 60-minute outbound bytes and connection count/min after a T1006
    alert to its rolling 30-day baseline for the same hour/day; escalate when traffic exceeds +3 sigma
    or the 99th percentile, and profile blocked/failed egress connections separately. A clear surge tied
    in time to the alert strengthens the incident; flat traffic suggests the access did not (yet) result
    in data movement. Source reference: [Beehive](https://doi.org/10.1145/2523649.2523670).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Critical Servers (Domain Controllers, File Servers), Administrator Workstations, Network Egress
    Points'
  range: Last 90 days, with 60-minute post-alert comparison windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'base = baseline(bytes_out, conn_per_min) by host, hour_of_day, day_of_week over 30d;

      post = measure(bytes_out, conn_per_min) for 60m after t1006_alert;

      escalate when post > base.mean + 3*base.sd OR post > p99(base);

      profile separately: blocked/failed egress connections.'
- question: Does a sequence model's most-likely path through a host's event stream traverse Benign ->
    VolumeAccess -> Staging -> Exfiltration, and does the exfil timing resemble beaconing?
  context: 'Modeling the whole kill chain probabilistically captures stealthy, multi-step operations (Stealth).
    Run a Hidden Markov Model (states: Benign, VolumeAccess, Staging, Exfiltration) over the host''s event
    stream and alert when the Viterbi path matches Benign -> VolumeAccess -> Staging -> Exfiltration;
    for the exfiltration leg, score beaconing/transfer timing with a CT-HMM. A Viterbi path through all
    attack states is a high-confidence detection; paths that stay in Benign indicate no chain. Source
    references: [Detecting Intrusions Using System Calls](https://ieeexplore.ieee.org/document/766910);
    [NetSpectra Sentinel: CT-HMM](https://www.sciencedirect.com/science/article/pii/S1084804525000244).'
  answer_sources:
  - Windows Event ID 4656
  - Windows Event ID 4688
  - Zeek conn.log
  - 'NAI: Critical Servers (Domain Controllers, File Servers), Administrator Workstations, Network Egress
    Points'
  range: Last 90 days, with event-centered sequence correlation.
  queries:
  - technology: ML/Pseudocode
    query: 'hmm = HMM(states=[Benign,VolumeAccess,Staging,Exfiltration]);

      path = hmm.viterbi(host_event_stream);

      alert when path contains Benign->VolumeAccess->Staging->Exfiltration;

      score exfil timing with CT-HMM (beaconing/transfer cadence).'
- question: Was a PowerShell script block logged (Event ID 4104) that contains raw-disk API keywords such
    as CreateFileW, DeviceIoControl, NtCreateFile, [System.IO.FileStream] on a \\.\ device path, or Marshal
    calls, and can it be tied to its parent process via Event ID 4688?
  context: 'Fileless direct-volume access is often implemented purely in PowerShell via direct Win32/.NET
    calls (Stealth). Match Event ID 4104 script blocks for raw-disk API keywords and associate them with
    the parent process from Event ID 4688, consistent with the raw-handle technique in Invoke-NinjaCopy.
    Script blocks invoking DeviceIoControl or FileStream against \\.\ paths are a direct indicator of
    raw volume I/O; ordinary file APIs on normal paths are benign. Source reference: [Invoke-NinjaCopy
    (PowerSploit)](https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Invoke-NinjaCopy.ps1).'
  answer_sources:
  - Windows PowerShell Event ID 4103
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'sb = WinEventLog(4104);

      alert when script_block ~ /CreateFileW|DeviceIoControl|NtCreateFile|\[System\.IO\.FileStream\]|Marshal/
      AND script_block ~ /\\\\\.\\/;

      join parent from WinEventLog(4688) on host, time; enrich user, host_role.'
- question: Do a script block's entropy and non-alphanumeric ratio both exceed this host's 98th-percentile
    baseline, indicating obfuscated PowerShell that may hide raw-disk access?
  context: 'Attackers obfuscate PowerShell to defeat keyword rules while still calling raw-disk APIs (Stealth).
    Baseline entropy and non-alphanumeric ratios of benign script blocks per host and flag scripts where
    both exceed the 98th percentile, using statistical obfuscation features and entropy thresholds. Dual
    exceedance strongly suggests deliberate obfuscation worth deeper inspection (e.g., AMSI-deobfuscated
    content); normal, readable scripts are low risk. Source references: [Revoke-Obfuscation](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf);
    [Using Entropy Analysis to Find Encrypted and Packed Malware](https://ieeexplore.ieee.org/document/4140989).'
  answer_sources:
  - Windows PowerShell Event ID 4103
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'for sb in WinEventLog(4104): e = shannon_entropy(sb); r = nonalnum(sb)/len(sb);

      flag when e > p98(host_sb_entropy) AND r > p98(host_sb_nonalnum);

      raise obfuscation signal; route to AMSI/deobfuscation review.'
- question: Does an AST-based classifier rate a PowerShell script block as malicious despite surface obfuscation,
    and which AST/token features drive the verdict?
  context: 'AST-based models resist cosmetic obfuscation that defeats regex (Stealth). Classify script
    blocks with an AST-based deep model (and hybrid token/AST XGBoost features) and surface the top-3
    AST/token features driving the score. A malicious verdict grounded in structural features (e.g., raw-handle
    call patterns) is robust to renaming/encoding tricks; benign structure lowers concern even for unusual-looking
    scripts. Source references: [AST-Based Deep Learning for Detecting Malicious PowerShell](https://dl.acm.org/doi/10.1145/3243734.3278496);
    [Effective Method for Detecting Malicious PowerShell](https://www.sciencedirect.com/science/article/abs/pii/S0925231221005099).'
  answer_sources:
  - Windows PowerShell Event ID 4103
  - Windows Event ID 4104
  - Windows Event ID 4688
  - 'NAI: Critical Servers (Domain Controllers, File Servers, Database Servers), Administrator Workstations'
  range: Last 90 days
  queries:
  - technology: ML/Pseudocode
    query: 'ast = parse_to_ast(script_block);

      feat = ast_embeddings + token_tfidf;

      score = ast_dl_model / xgboost.predict_proba(feat);

      alert when score high; surface top3 AST/token features.'
- question: Does a contextual-embedding classifier run over AMSI-captured (post-deobfuscation) script
    content return greater than 0.95 malicious confidence for a script related to raw-disk access?
  context: 'AMSI exposes the final, deobfuscated script content at runtime, the best vantage point for
    classification (Stealth). Run a contextual-embedding classifier over AMSI-captured script content
    and escalate scripts with >0.95 malicious confidence. Because AMSI sees post-deobfuscation code, a
    high-confidence verdict here is especially reliable for catching raw-disk PowerShell that evaded earlier
    stages; low confidence on clean deobfuscated content reduces concern. Source reference: [AMSI-Based
