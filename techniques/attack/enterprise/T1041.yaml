questions:
- question: 'Match known C2 indicators with asymmetric byte ratios: as part of investigating whether the
    adversary is exfiltrating data over an established C2 channel, can you match known C2 indicators with
    asymmetric byte ratios? In other words, given evidence that "A network connection to a destination
    matching a known C2 indicator (IP, domain, URL) shows a high outbound-to-inbound data ratio (e.g.,
    > 10:1) and a total outbound data volume significantly larger than typical beaconing traffic (e.g.,
    > 1 MB).", how do you operationalize this so an analyst can confirm or rule out exfiltration?'
  context: 'This question supports the Exfiltration tactic and the C2-channel exfiltration hypothesis.
    Evidence sought: A network connection to a destination matching a known C2 indicator (IP, domain,
    URL) shows a high outbound-to-inbound data ratio (e.g., > 10:1) and a total outbound data volume significantly
    larger than typical beaconing traffic (e.g., > 1 MB). Detection approach (Symbolic Logic): Search
    Zeek conn.log for outbound connections whose ''id.resp_h'' matches the current threat feed of C2 servers
    (and/or a malicious JA3/JA3S hash in ssl.log per [JA3 TLS fingerprinting](https://github.com/salesforce/ja3))
    and alert when any such session transfers more than 1 MB while maintaining an ''orig_bytes'' to ''resp_bytes''
    ratio above 10:1; exclude allowlisted backup/replication destinations. Mirror RITA''s long-connection
    and large-data-transfer logic from [RITA](https://github.com/activecm/rita). A positive result — a
    session (or host/destination pair) that matches this pattern and is not explained by sanctioned backup,
    replication, software-update, or CDN traffic — is a high-confidence indicator that data is leaving
    the environment over the C2 channel and should be escalated, with the host isolated and the destination
    blocked. A negative result reduces (but does not eliminate) the likelihood of exfiltration on this
    vector; pivot to the other questions in this playbook (low-and-slow channels, staging utilities, alternate
    ports) to avoid missing throttled or protocol-hopping exfiltration. Tune thresholds and allowlists
    to your environment to keep the signal defensible against benign automated egress.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet Gateway, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "LOAD threat_feed_c2 (ips, domains, urls), malicious_ja3_ja3s\nFROM zeek_conn JOIN zeek_ssl\
      \ ON conn.uid=ssl.uid\nWHERE conn.id_resp_h IN threat_feed_c2 OR ssl.ja3 IN malicious_ja3_ja3s\n\
      \  AND conn.orig_bytes > 1_000_000\n  AND (conn.orig_bytes / NULLIF(conn.resp_bytes,0)) > 10\n \
      \ AND conn.id_resp_h NOT IN allowlist_backup_replication\nEMIT alert(uid, src, dst, orig_bytes,\
      \ resp_bytes, ratio)"
- question: 'Profile connection-state and failure signals to the C2 indicator: as part of investigating
    whether the adversary is exfiltrating data over an established C2 channel, can you profile connection-state
    and failure signals to the C2 indicator? In other words, given evidence that "A network connection
    to a destination matching a known C2 indicator (IP, domain, URL) shows a high outbound-to-inbound
    data ratio (e.g., > 10:1) and a total outbound data volume significantly larger than typical beaconing
