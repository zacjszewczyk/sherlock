    URL) shows a high outbound-to-inbound data ratio (e.g., > 10:1) and a total outbound data volume significantly
    larger than typical beaconing traffic (e.g., > 1 MB). Detection approach (Symbolic Logic): For traffic
    to a matched C2 indicator, count Zeek conn.log ''conn_state'' values (S0/REJ/RSTO failed vs SF established)
    and any blocked-egress firewall denies in the same window; a burst of failed/blocked attempts immediately
    preceding a single large successful SF transfer is a distinct high-confidence exfil signal (failure-mode
    profiling). A positive result — a session (or host/destination pair) that matches this pattern and
    is not explained by sanctioned backup, replication, software-update, or CDN traffic — is a high-confidence
    indicator that data is leaving the environment over the C2 channel and should be escalated, with the
    host isolated and the destination blocked. A negative result reduces (but does not eliminate) the
    likelihood of exfiltration on this vector; pivot to the other questions in this playbook (low-and-slow
    channels, staging utilities, alternate ports) to avoid missing throttled or protocol-hopping exfiltration.
    Tune thresholds and allowlists to your environment to keep the signal defensible against benign automated
    egress.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - 'NAI: Internet Gateway, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_conn WHERE id_resp_h IN matched_c2_indicators\nWINDOW 1h PER (src, dst):\n  failed\
      \ = COUNT(conn_state IN {S0,REJ,RSTO})\n  fw_denies = COUNT(firewall_egress_deny same window)\n\
