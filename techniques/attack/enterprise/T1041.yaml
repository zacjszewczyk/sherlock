name: 'T1041: Exfiltration Over C2 Channel'
id: f26c0bc9-4440-4e1f-8086-0099307ecf30
description: 'Investigate potential exfiltration of data over an existing command-and-control (C2) channel,
  where stolen information is encoded into the same protocol the adversary uses for C2 communications
  (HTTPS, DNS, HTTP, or custom TCP/UDP). This playbook helps an analyst confirm or refute that an adversary
  is stealing sensitive data over an established channel by examining network telemetry and host activity
  across the enterprise edge, application servers, endpoints, and virtualization hosts. It guides the
  analyst through: matching outbound sessions against current C2 threat feeds and JA3/JA3S TLS fingerprints
  while looking for asymmetric, large outbound-to-inbound byte ratios; profiling connection-state and
  egress-failure signals that precede a single large successful transfer; baselining per-host, per-port,
  and per-indicator beaconing volumes to surface anomalously large or low-and-slow transfers; correlating
  HTTP/SSL metadata (User-Agent, URI, JA3/S) with known Malleable-C2 patterns; measuring payload entropy
  to detect encoded or compressed data; correlating staging/archiving utilities (7z, rar, tar, zip) with
  subsequent large egress; and applying statistical (percentile, ARIMA, sigma) and machine-learning (logistic
  regression, Random Forest, HMM, autoencoder, DBSCAN) methods with explainable feature attribution to
  classify and cluster suspicious sessions. The goal is to distinguish genuine exfiltration from benign
  backup, replication, and CDN traffic.'
type: technique
