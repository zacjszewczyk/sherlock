name: 'T1074.002: Remote Data Staging'
id: f9a42714-3967-4b42-b160-a2944c50395b
description: 'This playbook helps an analyst investigate Remote Data Staging (T1074.002), in which an
  adversary aggregates data collected from multiple systems into a central location on one host before
  exfiltration. It guides the hunt across Windows, Linux, macOS, ESXi, and cloud (IaaS) environments for
  the hub-and-spoke collection pattern: inbound file transfers or remote mounts (SMB, SCP, rsync, NFS,
  CopyObject) from many internal sources converging on a staging host, followed by archive creation (.zip/.rar/.7z/.tar/.gz)
  in common staging directories (%TEMP%, %PUBLIC%, C:\Perflogs, /mnt/staging, /var/tmp, /Users/Shared).
  Questions cover deterministic IOC and behavioral predicates, statistical baselining of archive-creation
  frequency/volume and inbound fan-in, and machine-learning models (classification, forecasting, autoencoders,
  graph/provenance analysis) to detect aggregation, multi-source copy commands, wide-ranging file reads,
  and the causal aggregation->archive->egress chain that signals data being staged for theft.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
