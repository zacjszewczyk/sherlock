questions:
- question: Has any process created an archive file (.zip/.rar/.7z/.tar/.gz) whose filename or SHA256
    hash matches a known-bad indicator from threat intelligence, particularly in a common staging directory?
  context: 'This is the deterministic floor for Remote Data Staging under the Collection tactic. Adversaries
    archive aggregated data before exfiltration, and reuse of tooling/output across victims means filenames
    and hashes sometimes match published IOCs. Monitor Windows EID 4663/4688 and Sysmon EID 11/1 for archive
    creation events, compute the SHA256, and match the hash and filename against your threat-intel feeds.
    A hit is high-confidence and should raise a high-severity alert with host/user/parent-process context.
    A negative result does not clear the host; pair it with the behavioral and statistical questions below.
    References: [MITRE ATT&CK T1074.002](https://attack.mitre.org/techniques/T1074/002/).'
  answer_sources: &id001
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: Common staging directories (%TEMP%, %PUBLIC%, C:\Perflogs), file servers, and domain controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search EID IN (4663,4688) OR Sysmon IN (1,11)

      | where file_extension IN (".zip",".rar",".7z",".tar",".gz")

      | eval sha256=hash(target_file)

      | lookup threat_intel_iocs sha256 OUTPUT verdict, OR filename=target_name

      | where verdict="known-bad"

      | table _time, host, user, parent_process, target_file, sha256'
- question: Is a non-allowlisted process creating archives, or is any archiving process exceeding its
    normal hourly archive-creation count for a given staging directory?
  context: 'Even without an IOC match, the rate and source of archive creation betrays staging. Baseline
    hourly archive-creation frequency per process name (7z.exe, WinRAR.exe, backup.exe, tar, etc.) and
    per staging directory. Alert when a non-allowlisted process creates an archive, or when any process
    exceeds its 95th-percentile or mean+3sigma count. Derive thresholds from CERT Insider Threat baselines
    using the sigma method of Dwyer and Truta. Name the deviating metric and the observed count in the
    alert so the analyst can judge severity quickly. References: [CERT Insider Threat dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/)
    [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EID IN (4663,4688)

      | where file_extension IN (".zip",".rar",".7z",".tar",".gz")

      | bin _time span=1h

      | stats count AS arch_ct by host, process_name, staging_dir, _time

      | eventstats avg(arch_ct) AS mu, stdev(arch_ct) AS sd by host, process_name, staging_dir

      | where (process_name NOT IN allowlist) OR arch_ct > mu+3*sd

      | table _time, host, process_name, staging_dir, arch_ct, mu, sd'
- question: Did a burst of access-denied or failed file-open events precede a successful large archive
    write by the same process or user?
  context: 'Adversaries probing for accessible data often trip access-denied events before landing on
    readable files and staging them. Track the rate of EID 4663 failure (access-denied) and failed file-open
    events per process/user as a distinct distribution, and flag a spike in failures immediately followed
    by a successful large write. This probing-then-staging signature, per Dwyer and Truta, distinguishes
    deliberate collection from normal access. A positive result is a process/user with an abnormal failure
    burst then a large archive creation in a short window. References: [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EID=4663

      | eval failed=if(access_result="denied",1,0)

      | bin _time span=10m

      | stats sum(failed) AS fails, sum(eval(action="write" AND bytes>50000000)) AS big_writes by host,
      user, _time

      | eventstats avg(fails) AS mu, stdev(fails) AS sd by host, user

      | where fails > mu+3*sd AND big_writes > 0

      | table _time, host, user, fails, big_writes'
- question: Does a supervised model classify an archive-creation event as malicious staging based on parent
    process, command-line entropy, extension, directory reputation, and write volume?
  context: 'A Random Forest trained on labeled file-creation/parent-process features can catch staging
    that rule logic misses. Features include parent process name, command-line entropy, file extension,
    directory reputation, and write byte-volume; entropy/character-count features follow Nadler et al.
    Flag events with model confidence above 0.9 and surface the top-3 contributing features in the alert
    so the analyst understands why it fired. Use it as an enrichment/triage layer over the deterministic
    and statistical questions, retraining periodically to limit drift and false positives. References:
    [Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = RandomForestClassifier()\nfeatures = [parent_name, cmdline_entropy, extension, dir_reputation,\
      \ write_bytes]\nfor event in archive_creation_events:\n    p = model.predict_proba(features(event))[malicious]\n\
      \    if p > 0.9:\n        alert(event, score=p, top_features=explain(event)[:3])"
- question: Did a non-allowlisted interpreter (powershell.exe, cmd.exe) create an archive inside a publicly-writable
    or sensitive staging directory such as C:\Users\Public, %TEMP%, C:\Windows\Temp, C:\Perflogs, or %APPDATA%?
  context: 'Staging frequently lands in publicly-writable or temporary directories created by ad-hoc interpreters
    rather than legitimate backup software. Alert when a non-allowlisted process (powershell.exe, cmd.exe)
    creates an archive within defined staging/sensitive directories. This publicly-writable-directory
    pattern is explicitly called out for T1074.002. A positive result is an interpreter writing a .zip/.rar/.7z
    into one of these paths; legitimate backups using approved tools and locations should be allowlisted
    to suppress noise. References: [MITRE ATT&CK T1074.002](https://attack.mitre.org/techniques/T1074/002/).'
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User workstations, publicly writable network shares, and web server directories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search EID IN (4663,4688) OR Sysmon EID=11

      | where file_extension IN (".zip",".rar",".7z",".tar",".gz")

      | where lower(target_dir) MATCH ("\\users\\public","\\temp","\\windows\\temp","\\perflogs","appdata")

      | where process_name IN ("powershell.exe","cmd.exe") AND process_name NOT IN allowlist

      | table _time, host, user, process_name, target_file'
- question: Is the probability of archive creation given the observed parent process abnormally low for
    this host?
  context: 'Different parents legitimately create archives (backup agents, installers); a powershell.exe
    or cmd.exe spawning an archive may be rare and suspicious. Compute P(archive creation | parent process)
    per host and flag events where the probability falls below a low threshold (e.g., 0.05), baselining
    the parent-child distribution per host using the rare-event/standard-deviation method of Dwyer and
    Truta. A low-probability parent-to-archive transition points to non-standard, possibly adversarial
    staging behavior that warrants pivoting to command-line and network context. References: [Dwyer and
    Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EID=4688

      | where file_extension IN (".zip",".rar",".7z")

      | stats count by host, parent_process

      | eventstats sum(count) AS tot by host

      | eval p = count/tot

      | where p < 0.05

      | table host, parent_process, count, p'
- question: Is the volume (count and total bytes) of archive creation in a sensitive directory exceeding
    its forecasted level for this hour?
  context: 'Sudden growth in archiving volume in staging directories indicates bulk collection. Use ARIMA/Prophet
    to model hourly archive-creation volume (count and total bytes) per directory type and alert when
    sensitive directories exceed forecasted volumes; report the forecast, observed value, and directory
    in the alert. Optionally layer unsupervised reconstruction-error scoring of write volume/fan-in per
    Kitsune (Mirsky et al). A positive result is an observed volume well above the predicted band, signaling
    a staging spike worth investigating against inbound transfer activity. References: [Kitsune, Mirsky
    et al](https://arxiv.org/pdf/1802.09089).'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "model = Prophet().fit(hourly_archive_volume[dir_type])\nforecast = model.predict(next_hour)\n\
      if observed_volume[dir_type] > forecast.yhat_upper:\n    alert(dir_type, observed=observed_volume,\
      \ forecast=forecast.yhat_upper)"
- question: Did a host receive inbound connections from more than 10 unique internal sources within 5
    minutes, followed by creation of a large archive (>100 MB) within 10 minutes?
  context: 'This is the hub-and-spoke aggregation signature of Remote Data Staging. Alert when Zeek conn.log
    shows a host receiving inbound from more than 10 unique internal sources in 5 minutes and a subsequent
    archive creation (>100 MB, EID 4663) occurs on that host within 10 minutes. Correlate inbound SMB/SSH
    sessions with local writes as causal staging paths (Hopper, Ho et al). A positive result strongly
    indicates a collection point gathering data from many hosts before exfiltration; verify the sources
    and the resulting archive. References: [MITRE ATT&CK T1074.002](https://attack.mitre.org/techniques/T1074/002/)
    [Hopper, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf).'
  answer_sources: &id003
  - Zeek conn.log
  - Windows Event ID 4663
  - Windows Event ID 4688
  - 'NAI: Internal network segments (core switches), critical servers (file servers, database servers),
    and the DMZ.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search source=zeek_conn

      | bin _time span=5m

      | stats dc(id.orig_h) AS uniq_src by id.resp_h, _time

      | where uniq_src > 10

      | join id.resp_h [search EID=4663 file_extension IN (".zip",".rar",".7z") bytes>100000000]

      | where archive_time - window_time < 10m

      | table _time, id.resp_h AS staging_host, uniq_src, archive_file'
- question: Are a host's inbound bytes or unique-source fan-in counts exceeding mean+3sigma over 15-minute
    windows, especially when followed by a large archive creation?
  context: 'Statistical baselining catches aggregation that falls below fixed thresholds. Baseline per-host
    inbound resp_bytes (volume) and unique source counts (fan-in frequency) over 15-minute windows and
    alert when metrics exceed mean+3sigma or the 99th percentile, escalating if followed by large archive
    creation (sigma baselining per Dwyer and Truta). Also profile the failed/blocked inbound connection
    ratio as a distinct State signal. Name the deviating metric and value in the alert; a positive result
    is anomalous fan-in toward a candidate collection node. References: [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search source=zeek_conn

      | bin _time span=15m

      | stats sum(resp_bytes) AS vol, dc(id.orig_h) AS fan_in, avg(eval(conn_state="REJ")) AS blocked_ratio
      by id.resp_h, _time

      | eventstats avg(vol) AS mu_v, stdev(vol) AS sd_v, avg(fan_in) AS mu_f, stdev(fan_in) AS sd_f by
      id.resp_h

      | where vol > mu_v+3*sd_v OR fan_in > mu_f+3*sd_f

      | table _time, id.resp_h, vol, fan_in, blocked_ratio'
- question: Which new inbound host-to-host connection edges toward a candidate collection node are statistically
    improbable given historical communication patterns?
  context: 'Aggregation creates connection edges that did not exist before. Use temporal link prediction
    to score the likelihood of each new inbound host->host edge and rank improbable fan-in toward the
    candidate collection node (Euler, King and Huang). Emit the lowest-probability source edges in the
    alert. A cluster of improbable new edges all pointing at one host is a strong indicator that the host
    is being used as a staging hub; pivot to file-write and archive activity on that node to confirm.
    References: [Euler, King and Huang](https://dl.acm.org/doi/10.1145/3588771).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "model = TemporalLinkPredictor().fit(historical_host_graph)\nfor edge in new_inbound_edges(window):\n\
      \    p = model.score(edge.src, edge.dst)\n    if p < threshold:\n        record(edge, p)\nalert(rank_by_lowest_p(candidate_node))"
- question: Do clustering or graph models surface an aggregator centroid (one destination drawing many
    sources and bytes) that correlates with local archiving commands?
  context: 'Apply DBSCAN to Zeek features (destination host, unique sources, bytes) to surface aggregator
    centroids, then cross-correlate with host EID 4688 archiving commands. For richer modeling, score
    anomalous internal aggregation flows with an autoencoder ensemble (Kitsune, Mirsky et al) or improbable
    inbound edges with an attention-GNN (CyberGraph, Bowman et al). Surface the top-3 contributing sources/features.
    A positive result is a dense cluster centered on one host that also shows archive creation, identifying
    the staging point and its feeder systems. References: [Kitsune, Mirsky et al](https://arxiv.org/pdf/1802.09089)
    [CyberGraph, Bowman et al](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf).'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "X = zeek_features[dest_host, uniq_sources, bytes]\nlabels = DBSCAN(eps, min_samples).fit_predict(X)\n\
      for centroid in aggregator_clusters(labels):\n    if host_has_archive_cmd(centroid.dest_host): \
      \ # EID 4688\n        alert(centroid.dest_host, top_sources=centroid.top(3))"
- question: Did a single command line (cmd.exe, powershell.exe, robocopy, xcopy, rsync) reference more
    than two distinct source directories or UNC paths copied to one archive/temp destination file?
  context: 'A hallmark of staging is one command pulling from many locations into a single output. Parse
    EID 4688 and Sysmon EID 1 command lines for copy verbs referencing more than two distinct source directories
    or UNC paths copied to one destination archive/temp file. These deterministic staging predicates follow
    Elastic''s suspicious command-shell research and T1074.002. A positive result is a multi-source-to-single-destination
    copy, especially to an archive or temp extension; inspect the sources for sensitive data and the destination
    for subsequent exfiltration. References: [Suspicious Windows Command Shell Arguments, Elastic](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/)
    [MITRE ATT&CK T1074.002](https://attack.mitre.org/techniques/T1074/002/).'
  answer_sources: &id004
  - Windows Event ID 4688
  - 'NAI: Domain Controllers, administrator workstations, and servers hosting development or source code
    repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search EID=4688 OR Sysmon EID=1

      | where process_name IN ("cmd.exe","powershell.exe","robocopy.exe","xcopy.exe","rsync")

      | where match(command_line, "copy|cp |robocopy|xcopy|rsync")

      | eval src_count = distinct_count(extract_sources(command_line))

      | where src_count > 2 AND match(dest, "\.(zip|rar|7z|tmp|tar|gz)$")

      | table _time, host, user, process_name, command_line'
- question: Are command lines containing file-manipulation keywords showing Shannon entropy or character
    counts above the 98th percentile for their process?
  context: 'Obfuscated or unusually long staging commands stand out lexically. Compute command-line Shannon
    entropy and character counts per process name and flag runs above the 98th percentile when file-manipulation
    keywords (copy, move, archive, compress) are present, using the lexical-feature approach of Nadler
    et al. A positive result is a high-entropy, keyword-bearing command that deviates from the process''s
    norm, often indicating scripted bulk copying or encoded staging logic worth decoding and correlating
    with file writes. References: [Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EID=4688

      | eval ent = shannon_entropy(command_line), len = length(command_line)

      | where match(command_line, "copy|move|compress|archive|7z|tar|rar")

      | eventstats perc98(ent) AS ent_p98, perc98(len) AS len_p98 by process_name

      | where ent > ent_p98 OR len > len_p98

      | table _time, host, process_name, ent, len, command_line'
- question: Does a sequence-to-sequence autoencoder flag a command line as anomalous (high reconstruction
    error) relative to benign arguments for that process?
  context: 'Train a seq2seq autoencoder on benign command-line arguments per process and alert when reconstruction
    error exceeds a dynamic threshold; pair with an Isolation Forest over entropy/length/source-count
    features (Nadler et al) and report the top contributing tokens/arguments. A positive result is a command
    whose structure the model cannot reconstruct well, indicating it differs from learned-benign usage.
    This catches novel staging commands that evade keyword and entropy rules; use it as a triage signal
    feeding analyst review. References: [Nadler et al](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "ae = Seq2SeqAutoencoder().fit(benign_cmdlines[process])\nfor cmd in command_events[process]:\n\
      \    err = ae.reconstruction_error(cmd)\n    if err > dynamic_threshold(process):\n        iso =\
      \ IsolationForest_score([entropy(cmd),len(cmd),src_count(cmd)])\n        alert(cmd, err=err, iso=iso,\
      \ top_tokens=contrib(cmd))"
- question: Are network-service processes (svchost.exe, httpd.exe, w3wp.exe) reading files from unexpected
    user/document directories under SACL auditing?
  context: 'Service accounts and network-facing processes should not be reading user documents; when they
    do, it suggests abnormal internal data collection. With SACL auditing enabled, alert when network-service
    processes (svchost.exe, httpd.exe, w3wp.exe) read files from unexpected directories such as C:\Users\*\Documents\*.
    A positive result is a service process touching sensitive user data outside its normal scope, consistent
    with collection feeding a staging operation. Confirm the file set and correlate with any subsequent
    archive creation or outbound transfer. References: [MITRE ATT&CK T1074.002](https://attack.mitre.org/techniques/T1074/002/).'
  answer_sources: &id005
  - Windows Event ID 4663
  - 'NAI: File shares containing PII, financial, or intellectual property data, user home directories,
    and code repositories.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'search EID=4663 access=read

      | where process_name IN ("svchost.exe","httpd.exe","w3wp.exe")

      | where match(object_name, "\\Users\\[^\\]+\\Documents\\")

      | table _time, host, process_name, user, object_name'
- question: Is a single user or process reading files across an abnormally high number of distinct directories
    within a 1-hour window compared to its baseline?
  context: 'Bulk collection touches many directories quickly. Baseline the number of unique directories
    read per user/process context over 1-hour windows and flag counts above the 99th percentile or mean+3sigma,
    profiling read volume and access-denied (failure) rate as separate State signals (Dwyer and Truta);
    derive thresholds from the CERT Insider Threat dataset. A positive result is a context fanning out
    across many directories far beyond its norm, a strong collection indicator for both external actors
    and insiders; pivot to what was read and whether it was then archived. References: [Dwyer and Truta](https://websites.nku.edu/~trutat1/papers/CollaborateCom13_dwyer.pdf)
    [CERT Insider Threat dataset](https://www.sei.cmu.edu/library/insider-threat-test-dataset/).'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'search EID=4663 access=read

      | bin _time span=1h

      | stats dc(directory) AS uniq_dirs, sum(bytes) AS read_vol, avg(eval(access_result="denied")) AS
      deny_rate by user, process_name, _time

      | eventstats avg(uniq_dirs) AS mu, stdev(uniq_dirs) AS sd by user, process_name

      | where uniq_dirs > mu+3*sd

      | table _time, user, process_name, uniq_dirs, read_vol, deny_rate'
- question: Does a process-file graph reveal a sudden hub-and-spoke pattern where one process reads many
    previously unassociated files?
  context: 'Build a bipartite process-file (or provenance) graph and use node-level graph anomaly detection
    to flag sudden hub-and-spoke patterns where one process reads many previously unassociated files (ThreaTrace,
    Wang et al); surface the contributing files/entities in the alert. A positive result is a process
    node that abruptly gains many new file edges, modeling the aggregation step of staging more robustly
    than counting alone. Use the surfaced files to scope what data was collected and whether it converged
    into an archive. References: [ThreaTrace, Wang et al](https://arxiv.org/pdf/2111.04333).'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "G = bipartite_graph(process_nodes, file_nodes, read_edges)\nscores = ThreaTrace.node_anomaly(G)\n\
      for p in process_nodes:\n    if scores[p] > threshold and new_file_edges(p) > k:\n        alert(p,\
      \ contributing_files=top_new_edges(p))"
- question: Does whole-system provenance modeling reveal a causal aggregation -> archive -> egress chain
    without relying on labels?
  context: 'Model whole-system provenance to detect the causal aggregation->archive->egress chain without
    labels and emit a compact, analyst-readable summary graph naming the top contributing events (KAIROS,
    Cheng et al). Self-supervised masked-graph (MAGIC, Jia et al) or snapshot-embedding (ProGrapher, Yang
    et al) variants provide drift-tolerant scoring; evaluate on DARPA OpTC. A positive result is a connected
    provenance path linking many file reads to an archive write and then an outbound transfer, which is
    the full Remote Data Staging story end to end and a high-priority finding. References: [KAIROS, Cheng
    et al](https://tfjmp.org/publications/2024-sp.pdf) [MAGIC, Jia et al](https://www.usenix.org/system/files/usenixsecurity24-jia-zian.pdf)
    [ProGrapher, Yang et al](https://www.usenix.org/system/files/usenixsecurity23-yang-fan.pdf) [DARPA
    OpTC](https://github.com/FiveDirections/OpTC-data).'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: ML/pseudocode
    query: "PG = build_provenance_graph(system_events)\nscores = KAIROS.score(PG)  # unsupervised\nfor\
      \ subgraph in anomalous_paths(PG, scores):\n    if path_matches(subgraph, [aggregate_reads, archive_write,\
      \ egress]):\n        alert(summary_graph(subgraph), top_events=subgraph.top())"
