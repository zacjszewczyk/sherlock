name: 'T1213.003: Code Repositories'
id: 89bfd4fa-d1d2-459b-9800-2dde2c23b06e
description: 'This playbook helps an analyst investigate whether an adversary is leveraging internal or
  private code repositories (self-hosted Git servers or SaaS platforms such as GitHub, GitLab, Bitbucket,
  and SourceForge) to collect proprietary source code or unsecured credentials as part of the Collection
  tactic. It guides the hunt across several complementary angles: outbound connections to known-malicious
  or rare repository infrastructure observed in Zeek conn/http/dns logs and threat-intelligence feeds;
  suspicious git.exe command-line invocations indicative of mass collection (clone --mirror, fetch --all,
  pull --all, bundle create) captured in Windows Event ID 4688; anomalous bulk transfer volumes to repository
  destinations in network flow logs; privileged or first-seen account access to repositories correlated
  against ACLs and crown-jewel/secret-bearing repos; git execution on non-developer assets such as Domain
  Controllers and HR/Finance workstations; and SaaS audit-log evidence of bulk cloning/downloading, first-seen
  actions or geographies, OAuth/PAT grants, and failed-access enumeration. Detection methods combine symbolic-logic
  rules, statistical baselining/forecasting and change-point analysis, and machine-learning models (sequence
  models, embeddings, peer-group/clustering, classifiers) applied to Zeek network telemetry, Windows authentication
  and process-creation events, and SaaS code-repository audit logs, so the analyst can corroborate suspected
  repository collection against host role, identity context, transfer volume, command lineage, and login
  anomalies.'
type: technique
related:
- tactic_id: TA0009
  tactic_name: Collection
contributors:
- Zachary Szewczyk
