questions:
- question: '[Collection] Malicious repository IOC monitoring: Can you determine whether an outbound network
    connection from an internal host matches a known malicious code repository URL, domain, or IP address
    listed in a threat intelligence feed. -- specifically, using the ''Malicious repository IOC monitoring''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary leverages access to internal
    or private code repositories to harvest proprietary source code and unsecured credentials, which can
    fuel exploit development and further access via valid accounts. This evidence focuses on the condition
    that an outbound network connection from an internal host matches a known malicious code repository
    URL, domain, or IP address listed in a threat intelligence feed. This Symbolic Logic approach looks
    for the following signal: Query Zeek conn.log, dns.log, and http.log destinations/URLs against threat
    intelligence feeds for known malicious code repositories and raise alerts immediately upon matches;
    also alert on first-party repo-visibility-change-to-public events using field-mapped audit signatures
    from [SigmaHQ](https://github.com/SigmaHQ/sigma) and [Elastic GitHub detection rules](https://github.com/elastic/detection-rules/tree/main/rules/integrations/github)
    ([Reviewing the audit log for your organization, GitHub](https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization)
    `repo.access`). A positive result -- a rule match, statistical outlier, or model alert -- suggests
    that a host, user, or principal is accessing or pulling code-repository data in a way that deviates
    from normal developer behavior and sanctioned workflows; pivot to the responsible account and host,
    the repositories and files touched, the parent process or login session, transfer volumes, and any
    subsequent staging or exfiltration. A negative result helps rule out this repository-collection vector
    but should be corroborated with the other questions in this playbook, since a single method can miss
    stealthy, low-and-slow, or living-off-the-land repository collection.'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, DNS Resolvers, Web Proxies'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '# Malicious repository IOC monitoring

      source IN [Zeek conn.log, Zeek http.log, Zeek dns.log]

      | WHERE matches_action_criteria("Malicious repository IOC monitoring")

      // Query Zeek conn.log, dns.log, and http.log destinations/URLs against threat intelligence feeds
      for known malic

      | ALERT enrich(host, user, principal, repo, file, dest)'
  - technology: Zeek/pseudocode
    query: '# Repository network correlation

      conn.log, http.log, dns.log

      | FILTER destinations matching code-repository infrastructure

      | AGG orig_bytes+resp_bytes, dest/TLD rarity, HTTP status, URL features per (id.orig_h)

      | flag malicious/rare/large/denied repository activity per action criteria'
- question: '[Collection] Rare TLD/registrar scoring: Can you determine whether an outbound network connection
    from an internal host matches a known malicious code repository URL, domain, or IP address listed
    in a threat intelligence feed. -- specifically, using the ''Rare TLD/registrar scoring'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Collection tactic (TA0009), an adversary leverages access to internal
    or private code repositories to harvest proprietary source code and unsecured credentials, which can
    fuel exploit development and further access via valid accounts. This evidence focuses on the condition
    that an outbound network connection from an internal host matches a known malicious code repository
    URL, domain, or IP address listed in a threat intelligence feed. This Statistical Method approach
    looks for the following signal: Baseline the 30-day frequency of TLDs and registrars observed in Zeek
    dns.log for repository domains, and alert when an observed repository sits below the 5th percentile
    of frequency on either dimension; treat any first-seen registrar/domain per environment as a distinct
    signal as in the first-seen approach of the [Netflix CloudTrail Anomaly Detector](https://github.com/Netflix-Skunkworks/cloudtrail-anomaly).
    A positive result -- a rule match, statistical outlier, or model alert -- suggests that a host, user,
    or principal is accessing or pulling code-repository data in a way that deviates from normal developer
    behavior and sanctioned workflows; pivot to the responsible account and host, the repositories and
    files touched, the parent process or login session, transfer volumes, and any subsequent staging or
    exfiltration. A negative result helps rule out this repository-collection vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, low-and-slow,
    or living-off-the-land repository collection.'
