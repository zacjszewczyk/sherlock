name: 'T1021.007: Cloud Services'
id: 4ce9cdeb-002d-4d49-b092-8c491fcd0b8b
description: Investigate whether an adversary leveraged federated or synchronized identities to pivot
  from an on-premises host into cloud services, and then used that cloud foothold to move laterally back
  to other on-premises systems. This playbook helps an analyst correlate on-premises network authentications
  (Windows Event ID 4624 Type 3, 4648 explicit-credential use, 4625 failures) with outbound connections
  to cloud-service-provider CIDRs, hunt for cloud CLI/API tooling executed on endpoints (az.exe, aws.exe,
  gcloud.cmd, Connect-AzAccount, Connect-MgGraph), spot bursts of cloud-API enumeration that precede internal
  pivots over lateral-movement ports (22/445/3389/5985/5986), detect identity-provider trust changes (new
  federation realms, token-signing certificates, service-principal credentials, illicit OAuth consent),
  and catch risky cloud network security configuration changes (e.g., 0.0.0.0/0 inbound rules to sensitive
  ports). It blends deterministic symbolic-logic rules, statistical baselining, and machine-learning detections
  so a SOC analyst can find both sophisticated external actors and routine credential abuse crossing the
  on-prem/cloud boundary.
type: technique
related:
- tactic_id: TA0008
  tactic_name: Lateral Movement
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.1'
tags: none
questions:
- question: Did a successful on-premises network logon (Windows Event ID 4624, Logon Type 3) from a host
    on the compromised-host watchlist precede, within five minutes, an outbound connection to a known
    cloud-service-provider IP range?
  context: 'This is the floor-of-determinism rule for spotting an on-prem-to-cloud pivot. Join successful
    Type 3 network authentications with Zeek conn.log on the source IP inside a five-minute window and
    alert when the authenticating host is on a compromised-host watchlist AND the Zeek destination falls
    inside a maintained cloud CIDR list (management.azure.com, *.amazonaws.com, *.googleapis.com). A positive
    result strongly suggests the adversary authenticated on-prem and immediately reached the cloud control
    plane as the logged-on user, the core of T1021.007 lateral movement. Keep this rule even while tuning
    the window; widening it trades fidelity for recall. References: [MITRE ATT&CK T1021.007](https://attack.mitre.org/techniques/T1021/007/).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Network Egress Points, Endpoint devices'
  range: Last 90 days, correlated within a 5-minute window per source IP.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "auth = FILTER Event4624 BY logon_type==3 AND status==success\nconn = Zeek_conn\nJOIN auth,\
      \ conn ON src_ip WITHIN 5min\nALERT WHERE auth.src_ip IN compromised_host_watchlist\n  AND conn.dest_ip\
      \ IN cloud_provider_cidr_list"
- question: Is there a credential-switch pivot path where one host's explicit-credential logons (Windows
    Event ID 4648) reach more than three distinct destinations within ten minutes and are then followed
    by a connection to a cloud CIDR?
  context: 'Reconstruct causal login paths from 4648 explicit-credential usage to detect a credential
    switch fanning out to atypical systems before pivoting to the cloud. Alert when a single host uses
    explicit credentials against more than three distinct destinations in ten minutes and then reaches
    a cloud provider range. This pattern, modeled on Hopper-style login-path analysis, distinguishes purposeful
    lateral spread from normal admin activity; a positive hit indicates an account is being walked across
    hosts en route to the cloud control plane. References: [Hopper, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf);
    [Azure Sentinel 4648 Hunting Query](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Hunting%20Queries/MultipleExplicitCredentialUsage4648Events.yaml).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Network Egress Points, Endpoint devices'
  range: Last 90 days, with 10-minute path-reconstruction windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'paths = FILTER Event4648 BY status==success

      GROUP paths BY src_host WITHIN 10min

      fanout = COUNT(DISTINCT dest_host) > 3

      cloud = Zeek_conn WHERE dest_ip IN cloud_provider_cidr_list

      ALERT WHERE fanout AND EXISTS cloud FROM same src_host AFTER path'
- question: Did a user successfully authenticate (4624 Type 3) from a source IP that falls below the 1st
    percentile of that user's 90-day source-IP history, immediately followed by cloud connections?
  context: 'Build a per-user 90-day baseline of source IPs used for successful Type 3 logons and flag
    authentications from IPs rarer than the 1st percentile of that user''s history when followed by a
    cloud connection. Strengthen confidence with volume and frequency gates: require at least 10 distinct
    cloud-API hostnames in the following hour (Zeek http.log) or more than 5 cloud connections per minute.
    Rare-IP-then-cloud sequences surface accounts being used from unfamiliar locations to reach the cloud,
    a hallmark of stolen federated credentials. Derive percentile and count thresholds from environment
    baselines (LANL, Unified Host and Network datasets). References: [LANL User-Computer Authentication
    Dataset](https://csr.lanl.gov/data/auth/); [Unified Host and Network Data Set, Turcotte et al](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Network Egress Points, Endpoint devices'
  range: Last 90 days for the baseline; evaluate the current logon plus the following hour.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = FOR each user: freq(src_ip) over 90d

      rare = current_auth WHERE percentile(src_ip_freq) < 1

      cloud_hosts = COUNT(DISTINCT http.host IN cloud) IN next 1h

      cloud_rate = cloud_conns_per_min

      ALERT WHERE rare AND (cloud_hosts>=10 OR cloud_rate>5)'
- question: Were five or more failed logons (Windows Event ID 4625 and Entra/Okta sign-in failures) for
    a user within ten minutes followed by a single success and then a connection to a cloud CIDR?
  context: 'This failure-mode signal catches password spray or brute force that finally succeeds and then
    pivots to the cloud. Count failed logons per user in a ten-minute window across on-prem (4625) and
    identity-provider sign-in logs; alert when five or more failures are followed by one success and a
    subsequent cloud-CIDR connection. The failed-then-success-then-cloud chain is a documented precursor
    to federated pivoting; a positive result indicates likely credential guessing that yielded working
    access. Score within peer-group baselines to suppress noisy service accounts. References: [Detecting
    M365/Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/);
    [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Network Egress Points, Endpoint devices'
  range: Last 90 days, with 10-minute failure-burst windows.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'fails = COUNT(Event4625 + idp_signin_failures) BY user WITHIN 10min

      success = first Event4624 success after fails

      cloud = Zeek_conn WHERE dest_ip IN cloud_provider_cidr_list

      ALERT WHERE fails>=5 AND success AND EXISTS cloud AFTER success'
- question: Does a supervised classifier flag an authentication-to-cloud event as suspicious with high
    confidence, and what features drove that decision?
  context: 'Train a Random Forest on authentication and network features (user, source-IP geolocation/ASN,
    time-of-day, destination cloud service, failed-logon count, distinct cloud hostnames) labeled from
    past incidents, and alert when an event is classified suspicious with confidence above 0.9. Complement
    with unsupervised authentication-edge probability scoring to catch novel user-to-host edges. Every
    alert must surface the top-3 contributing features via SHAP (e.g., rare ASN, novel user->host edge,
    failed-logon burst) so the analyst can validate the verdict instead of trusting a black box. This
    catches subtle pivots that no single rule covers. References: [CyberGraph, Bowman et al](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf);
    [Explainable AI in IDS, Frontiers 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Network Egress Points, Endpoint devices'
  range: Last 90 days for training; score events in near-real-time.
  queries:
  - technology: ML/pseudocode
    query: 'features = [user, src_geo, src_asn, hour, dest_cloud, fail_count, distinct_cloud_hosts]

      model = RandomForest.fit(historical_labeled)

      score = model.predict_proba(event)

      ALERT WHERE score[''suspicious'']>0.9 WITH shap_top3(event)'
- question: Was a cloud CLI tool (az.exe, aws.exe, gcloud.cmd, or PowerShell invoking Connect-AzAccount/Connect-MgGraph)
    created (Windows Event ID 4688) with high-risk command-line arguments, especially from a non-interactive
    parent process?
  context: 'Trigger on 4688 process creations where the new process is a cloud CLI and the command line
    contains high-risk keywords (run-command, get-session-token, compute ssh, Invoke-Command, auth login).
    Raise severity when the parent process is non-interactive (w3wp.exe, services.exe, a scheduled task),
    because legitimate admins rarely launch cloud CLIs from a web server or service host. A positive result
    indicates hands-on-keyboard or automated cloud control-plane activity from a possibly compromised
    endpoint, a direct T1021.007 action. Maintain the cloud-CLI set and keyword list as a tunable watchlist.
    References: [MITRE ATT&CK T1021.007](https://attack.mitre.org/techniques/T1021/007/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Management Servers, CI/CD Pipeline Servers, Developer Endpoints'
  range: Last 90 days.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE Event4688.NewProcessName IN cloud_cli_set\n  AND CommandLine CONTAINS_ANY ['run-command','get-session-token',\n\
      \      'compute ssh','Invoke-Command','auth login',\n      'Connect-AzAccount','Connect-MgGraph']\n\
      \  SEVERITY high IF ParentProcess IN ['w3wp.exe','services.exe','schtasks']"
- question: Do a cloud CLI process's command-line length, token count, or Shannon entropy exceed the 98th
    percentile of its 30-day baseline, or does its invocation count exceed three standard deviations above
    its hourly mean?
  context: 'Per cloud-CLI process name, baseline command-line length, token count, and Shannon entropy
    over 30 days, and alert when length or entropy crosses the 98th percentile. Add a frequency gate:
    alert if hourly invocation count for that tool exceeds three standard deviations above its mean. Long,
    high-entropy, or unusually frequent CLI invocations indicate encoded payloads, large parameter blobs,
    or scripted abuse rather than routine commands. Treat anomalous argument values as out-of-distribution;
    a positive result warrants pulling the full command line for review. References: [DeepLog, Du et al](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Management Servers, CI/CD Pipeline Servers, Developer Endpoints'
  range: Last 90 days, baselined over a rolling 30 days per CLI.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'baseline = FOR each cli: dist(len, tokens, entropy) over 30d

      ALERT WHERE len>p98 OR entropy>p98

      OR hourly_invocations(cli) > mean + 3*std'
- question: Were five or more cloud CLI authentication failures (non-zero exit codes or AADSTS/AccessDenied
    error strings) from a single host within ten minutes, immediately preceding a success?
  context: 'This failure-mode signal catches credential validation before pivoting. Count cloud-CLI authentication
    failures per host in ten minutes using non-zero exit codes and error strings such as AADSTS or AccessDenied
    found in 4688-correlated logs, and alert when five or more failures precede a success. Adversaries
    often test stolen or sprayed credentials against the cloud CLI before committing to a pivot; a failure
    burst followed by success on one host is a strong indicator that credential probing just worked. Tune
    for noisy automation that retries legitimately. References: [Detecting M365/Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Management Servers, CI/CD Pipeline Servers, Developer Endpoints'
  range: Last 90 days, with 10-minute failure-burst windows.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "fails = COUNT(cli_events WHERE exit!=0 OR msg CONTAINS_ANY ['AADSTS','AccessDenied'])\n  BY\
      \ host WITHIN 10min\nsuccess = first cli_auth_success after fails\nALERT WHERE fails>=5 AND success"
- question: Does a text classifier label a 4688 cloud-CLI command line as malicious_execution rather than
    benign_admin or recon, and which tokens drove the verdict?
  context: 'Train a logistic-regression or gradient-boosted classifier on TF-IDF vectors of historical
    cloud-CLI command lines to distinguish benign_admin, recon, and malicious_execution, and alert on
    malicious_execution. The alert must list the top-3 token/feature contributors via SHAP (e.g., run-command,
    a risky ASN, a non-interactive parent) so analysts immediately see why a command looked malicious.
    This generalizes beyond keyword lists, catching novel but semantically dangerous invocations while
    keeping the verdict explainable and defensible. References: [Explainable AI in IDS, Frontiers 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Windows Event ID 4688
  - 'NAI: User Workstations, Management Servers, CI/CD Pipeline Servers, Developer Endpoints'
  range: Last 90 days for training; score new 4688 cloud-CLI events as they arrive.
  queries:
  - technology: ML/pseudocode
    query: 'X = tfidf(historical_4688_cli_cmdlines)

      model = GradientBoost.fit(X, labels)

      pred = model.predict(new_cmdline)

      ALERT WHERE pred==''malicious_execution'' WITH shap_top3(new_cmdline)'
- question: Did a single on-premises source IP generate more than 50 unique HTTP URIs to cloud-API hostnames
    within ten minutes, followed within an hour by a connection to another internal host over a lateral-movement
    port (22/445/3389/5985/5986)?
  context: 'This stateful rule encodes the burst-then-pivot pattern central to T1021.007. If a source
    IP issues more than 50 unique HTTP URIs to known cloud-API hostnames (Zeek http.log) in ten minutes,
    watchlist it for one hour; if it then connects to another internal IP on a common lateral-movement
    port (Zeek conn.log), raise a high-severity alert. The cloud-API burst represents enumeration of cloud
    resources, and the subsequent internal connection represents the pivot back on-prem. A positive result
    captures the full enumerate-then-move-laterally sequence. References: [Hopper, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf);
    [MITRE ATT&CK T1021.007](https://attack.mitre.org/techniques/T1021/007/).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments (East-West traffic), DNS servers'
  range: Last 90 days, with a 10-minute burst window and 60-minute pivot watch.
  queries:
  - technology: Zeek/pseudocode
    query: "burst = COUNT(DISTINCT http.uri WHERE http.host IN cloud_api) BY src_ip WITHIN 10min\nWATCHLIST\
      \ src_ip FOR 1h WHERE burst>50\npivot = conn WHERE src_ip IN watchlist AND dest_ip IN internal\n\
      \  AND dest_port IN [22,445,3389,5985,5986]\nALERT high WHERE pivot"
- question: Did an internal source IP's hourly count of unique cloud-API URIs or its per-minute request
    rate exceed its 30-day baseline mean plus three standard deviations?
  context: 'Per internal source IP, maintain a 30-day rolling baseline (moving average plus standard deviation)
    of hourly unique cloud-API URIs (volume) and request rate per minute (frequency), and alert when an
    hour exceeds mean+3sigma. Use host-communication-graph volume/frequency/distinct-peer features with
    MAD thresholding to stay robust against outliers. A spike above baseline indicates abnormally heavy
    cloud-API interaction from a host that does not normally behave that way, which often accompanies
    resource discovery or scripted abuse. Derive sigma multipliers from enterprise baselines. References:
    [An Unsupervised Multi-Detector Approach, Bohara et al](https://www.perform.illinois.edu/Papers/USAN_papers/17BOH01.pdf);
    [Unified Host and Network Data Set, Turcotte et al](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments (East-West traffic), DNS servers'
  range: Last 90 days, baselined over a rolling 30 days per source IP.
  queries:
  - technology: Zeek/Stats pseudocode
    query: "baseline = FOR each src_ip: mean,std of hourly_unique_cloud_uris and req_per_min over 30d\n\
      ALERT WHERE hourly_unique_cloud_uris > mean+3*std\n  OR req_per_min > mean+3*std"
- question: Did cloud-API HTTP error responses (401/403/429) from a source IP exceed its baseline mean
    plus three standard deviations, or 30% of its requests within a 15-minute window?
  context: 'This failure-mode signal flags permission probing and credential mismatch. Track cloud-API
    HTTP response codes per source IP and alert when 401/403/429 responses exceed mean+3sigma or make
    up more than 30% of requests in a 15-minute window. A high ratio of denied/throttled cloud-API calls
    indicates an identity probing for accessible resources or hitting rate limits during aggressive enumeration.
    A positive result suggests an actor is testing the boundaries of compromised credentials rather than
    doing routine, mostly-successful API work. References: [IMDS Anomaly Hunting, Wiz](https://www.wiz.io/blog/imds-anomaly-hunting-zero-day).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments (East-West traffic), DNS servers'
  range: Last 90 days, with 15-minute error-ratio windows.
  queries:
  - technology: Zeek/Stats pseudocode
    query: 'errs = COUNT(http.status IN [401,403,429]) BY src_ip WITHIN 15min

      total = COUNT(http) BY src_ip WITHIN 15min

      ALERT WHERE errs > mean+3*std OR errs/total > 0.30'
- question: Does DBSCAN clustering of 15-minute cloud-API request windows mark a window as an outlier
    that is then followed within 60 minutes by internal connections on lateral-movement ports?
  context: 'Cluster 15-minute Zeek http.log windows on features (source IP, destination hostname, User-Agent,
    request count, error ratio) with DBSCAN; for outlier windows, query Zeek conn.log for subsequent internal
    connections (within 60 minutes) on lateral-movement ports and alert. The alert must surface the top-3
    features driving the outlier classification via SHAP. This unsupervised approach catches anomalous
    cloud-API behavior that does not match any known-good cluster and ties it to the on-prem pivot, finding
    novel enumerate-then-move patterns without predefined thresholds. References: [Explainable AI in IDS,
    Frontiers 2025](https://www.frontiersin.org/journals/artificial-intelligence/articles/10.3389/frai.2025.1526221/full).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments (East-West traffic), DNS servers'
  range: Last 90 days; cluster 15-minute windows and watch the following 60 minutes.
  queries:
  - technology: ML/pseudocode
    query: 'windows = bucket(http, 15min) WITH features[src_ip,host,ua,req_count,err_ratio]

      outliers = DBSCAN(windows).label == -1

      pivot = conn WHERE src_ip IN outliers AND dest_port IN [22,445,3389,5985,5986] WITHIN 60min

      ALERT WHERE pivot WITH shap_top3(window)'
- question: Does an LSTM log-sequence model flag an identity's cloud audit/API event chain as out-of-distribution
    (e.g., login -> ListResources -> AuthorizeSecurityGroupIngress)?
  context: 'Apply an LSTM sequence model to per-identity cloud audit/API event streams to flag chains
    that deviate from learned normal order, such as login followed by resource listing followed by a security-group
    ingress change. Out-of-distribution sequences capture multi-step abuse where each individual action
    looks benign but the ordering reveals intent (authenticate, enumerate, then expose). Train and evaluate
    on enterprise baselines so the model learns realistic operational sequences; a flagged chain warrants
    reviewing the full identity timeline for an enumerate-then-modify pattern. References: [DeepLog, Du
    et al](https://www.cs.utah.edu/~lifeifei/papers/deeplog.pdf); [Unified Host and Network Data Set,
    Turcotte et al](https://arxiv.org/abs/1708.07518).'
  answer_sources:
  - Zeek conn.log
  - Zeek http.log
  - Zeek dns.log
  - 'NAI: Network Egress Points, Internal network segments (East-West traffic), DNS servers'
  range: Last 90 days for training; score per-identity event chains continuously.
  queries:
  - technology: ML/pseudocode
    query: 'seqs = order_events_by_identity(cloud_audit)

      model = LSTM.fit(normal_sequences)

      ALERT WHERE model.surprise(seq) > threshold  # e.g. login->ListResources->AuthorizeSecurityGroupIngress'
- question: Did a successful federated logon occur from a (username, source_IP) pair never seen in the
    last 90 days, followed within 60 minutes by an inbound connection from a cloud-provider IP to a different
    internal host?
  context: 'Maintain a 90-day lookup table of (username, source_IP) pairs from successful 4624 authentications.
    When a new pair appears, flag the session for 60 minutes; if during that window an inbound connection
    from a cloud-provider CIDR (Zeek conn.log) reaches an internal IP other than the flagged source, alert.
    This mirrors novel-edge login-path detection and captures the signature cloud-to-on-prem return pivot:
    a user logs in from an unfamiliar IP and shortly after the cloud reaches back into a different internal
    system. A positive result is a strong lateral-movement lead. References: [Hopper, Ho et al](https://www.usenix.org/system/files/sec21-ho.pdf);
    [LANL User-Computer Authentication Dataset](https://csr.lanl.gov/data/auth/).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Bastion Hosts, Network Firewalls/Gateways'
  range: Last 90 days for the pair baseline; 60-minute correlation window.
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'known = SET of (user, src_ip) over 90d

      novel = Event4624 success WHERE (user,src_ip) NOT IN known

      FLAG session FOR 60min

      inbound = conn WHERE src_ip IN cloud_provider_cidr AND dest_ip IN internal

      ALERT WHERE inbound.dest_ip != novel.src_ip WITHIN 60min'
- question: Were any identity-provider trust changes made that enable forged federated logins, such as
    a new federation realm/domain, an added token-signing certificate, new service-principal credentials,
    or an illicit OAuth admin-consent grant?
  context: 'This failure-mode/abuse signal targets deterministic, high-fidelity precursors to cloud pivots.
    Alert on identity-provider changes that enable forged federated logins: a new federation realm or
    domain (Set-DomainAuthentication), an added token-signing certificate, new service-principal credentials,
    or illicit OAuth admin-consent grants. These changes let an adversary mint or accept tokens for arbitrary
    users, bypassing normal authentication, and are rarely legitimate outside planned identity projects.
    Any such event should be treated as high priority and tied back to the identity that made the change.
    References: [Detecting M365/Azure AD Backdoors, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/detecting-microsoft-365-azure-active-directory-backdoors/);
    [MITRE ATT&CK T1021.007](https://attack.mitre.org/techniques/T1021/007/).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Bastion Hosts, Network Firewalls/Gateways'
  range: Last 90 days; alert immediately on any matching change.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "ALERT WHERE idp_audit.action IN [\n  'Set-DomainAuthentication','New-FederationRealm',\n \
      \ 'Add-TokenSigningCertificate','New-ServicePrincipalCredential',\n  'Consent to application (admin)']\n\
      ENRICH WITH actor_identity, source_ip"
- question: Does a rarity-weighted risk score for a federated logon (source-IP rarity multiplied by destination-sensitivity)
    exceed threshold when a rare authentication is followed within 30 minutes by an inbound cloud-IP connection
    to a different internal host?
  context: 'Per user, compute source-IP rarity (score = 1/frequency) from 4624 history; when a rare authentication
    is followed within 30 minutes by an inbound cloud-IP connection to a different internal host (Zeek
    conn.log), multiply the rarity by a destination-sensitivity weight and alert above threshold. This
    blends how unusual the login was with how sensitive the targeted internal host is, prioritizing rare
    logons that lead to crown-jewel systems. Calibrate with peer-group baselining and blast-radius weighting;
    a high score focuses the analyst on the riskiest cloud-to-on-prem paths. References: [Microsoft Sentinel
    UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics);
    [LANL User-Computer Authentication Dataset](https://csr.lanl.gov/data/auth/).'
  answer_sources:
  - Windows Event ID 4624
  - Zeek conn.log
  - 'NAI: Domain Controllers, ADFS Servers, Bastion Hosts, Network Firewalls/Gateways'
  range: Last 90 days for rarity baselines; 30-minute correlation window.
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'rarity = 1 / freq(user, src_ip over 90d)

      inbound = conn WHERE src_ip IN cloud_provider_cidr AND dest_ip != login.src_ip WITHIN 30min

      score = rarity * dest_sensitivity_weight(inbound.dest_ip)

      ALERT WHERE inbound AND score > threshold'
- question: Does unsupervised graph-embedding edge-probability scoring surface a low-probability cloud-provider-to-on-prem
    authentication/connection path, and which edges contributed most?
  context: 'Build a heterogeneous graph of users, on-prem hosts, and cloud-provider IP ranges with authenticates_from
    and connects_to edges, then use unsupervised graph-embedding edge-probability scoring to surface improbable
    cloud-to-on-prem paths. Alerts must name the top-3 contributing edges/features via SHAP. Graph methods
    catch structurally anomalous movement that per-event rules miss, such as a cloud range suddenly connecting
    to an internal host it has never touched on behalf of a user who never logs in from there. A low-probability
    path is a candidate lateral-movement chain worth manual tracing. References: [CyberGraph, Bowman et
    al](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf); [An Unsupervised Multi-Detector
