name: 'T1003.006: DCSync'
id: d1df6de2-d7b3-4d6e-92d4-6a78d5b09b7c
description: Investigate possible abuse of the Windows Directory Replication Service (DRS) Remote Protocol
  via DCSync, in which an adversary with replication rights impersonates a Domain Controller to pull password
  hashes (including KRBTGT and Administrator) from Active Directory using the IDL_DRSGetNCChanges call.
  This playbook helps an analyst hunt for unauthorized replication-right access recorded in Domain Controller
  security logs (Event ID 4662 referencing DS-Replication-Get-Changes control-access-right GUIDs), DRSUAPI
  RPC sessions seen on the wire (interface UUID E3514235-4B06-11D1-AB04-00C04FC2DCD2) originating from
  hosts that are not Domain Controllers, DCSync tooling executed on workstations and member servers (lsadump::dcsync,
  secretsdump.py -just-dc), and Zeek notices that flag replication from a non-DC source. It combines symbolic-logic
  allowlist rules, statistical baselining of replication identities, transfer volumes, and denied attempts,
  and machine-learning graph/sequence models to separate sanctioned DC-to-DC replication and identity-management
  services from credential-replication abuse, and to corroborate findings across endpoint, authentication,
  and network telemetry.
type: technique
related:
- tactic_id: TA0006
  tactic_name: Credential Access
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any Domain Controller record an Event ID 4662 access to the DCSync replication control-access-rights
    (DS-Replication-Get-Changes 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2, DS-Replication-Get-Changes-All 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2,
    or DS-Replication-Get-Changes-In-Filtered-Set) from a security principal, workstation, or source IP
    that is NOT on the approved replication allowlist?
  context: DCSync abuse manifests as a replication request that only legitimate Domain Controller computer
    accounts and sanctioned identity-management services should ever make. Per [MS-DRSR], the IDL_DRSGetNCChanges
    operation requires the DS-Replication-Get-Changes / -All control-access rights, so an Event ID 4662
    referencing those object GUIDs from any account or host outside the DC and identity-management allowlist
    is a strong indicator of credential-replication abuse under the Credential Access tactic. The analyst
    should alert on these GUIDs, exclude known-good DC computer accounts and replication services, then
    correlate the same logon session to Event ID 4624 (interactive/network logon) and Event ID 4769 (Kerberos
    service ticket) to resolve the authenticating account, the source host, and the service-ticket context.
    A positive result (non-allowlisted principal requesting replication rights) strongly suggests a Mimikatz/secretsdump-style
    DCSync; a negative result is routine DC-to-DC replication.
  answer_sources:
  - Windows Event ID 4662
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Zeek dce_rpc.log
  - Zeek conn.log
  - 'NAI: All Domain Controllers within the enterprise.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "events = WinEventLog:Security EventCode=4662\nwhere Properties contains_any('1131f6aa-9c07-11d1-f79f-00c04fc2dcd2',\n\
      \  '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2', '89e95b76-444d-4c62-991a-0facbeda640c')\nand SubjectUserSid\
      \ not_in approved_replication_allowlist\nand Computer in domain_controllers\njoin WinEventLog:Security\
      \ EventCode in (4624,4769) on LogonId/SubjectUserSid\nalert => account, source_host, ticket_context"
- question: When we link Event ID 4662 replication-right access to its authenticating account and source
    host through an Active Directory log graph, does any path resolve to a source host that is not a Domain
    Controller?
  context: Raw 4662 events are hard to triage in isolation, so building a graph from 4662/4624/4768/4769/4672
    lets the analyst assert the chain replication-right -> authenticating account -> source host (the
    LogonTracer approach). Any path whose terminal source host is not a Domain Controller surfaces privileged-rights
    misuse directly, because legitimate replication should always originate from a DC. This graph-linking
    is valuable for the Credential Access tactic because it collapses scattered logon and object-access
    events into a single attributable story, showing exactly which non-DC workstation or server pulled
    replication rights and under which identity. A positive result is a replication edge anchored on a
    non-DC host; a negative result keeps all replication paths anchored on DCs.
  answer_sources:
  - Windows Event ID 4662
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Zeek dce_rpc.log
  - Zeek conn.log
  - 'NAI: All Domain Controllers within the enterprise.'
  range: Last 90 days
  queries:
  - technology: SIEM/Graph pseudocode
    query: "ingest EventCode in (4662,4624,4768,4769,4672)\nbuild_graph nodes={accounts, hosts, DCs}\n\
      edge replication_right -> account (from 4662)\nedge account -> source_host (from 4624/4769)\nfor\
      \ path in paths(replication_right -> account -> source_host):\n  if source_host not in domain_controllers:\
      \ flag(path)"
- question: Is replication-right access originating from endpoints outside the designated tier-0 administration
    enclave, even where delegated replication rights technically exist, and is it preceded by a recent
    interactive privileged login on a non-tier-0 host?
  context: Adversaries frequently relay credential theft into DCSync by first gaining a privileged interactive
    session on a normal workstation or jump box, then invoking replication. Per the Hopper lateral-movement
    model, the analyst should treat any replication-right use from outside the tier-0 enclave as suspicious
    regardless of nominal delegation, and tighten suspicion when a recent interactive privileged logon
    occurred on a non-tier-0 host shortly before the replication. This is tactic-specific to Credential
    Access because tier-0 segmentation exists precisely to confine credential-replication capability to
    a small, audited set of hosts; replication from outside that boundary is an authorization-model violation.
    A positive result is replication launched from a non-tier-0 host (especially after a privileged login
    chain); a negative result is replication confined to tier-0.
  answer_sources:
  - Windows Event ID 4662
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Zeek dce_rpc.log
  - Zeek conn.log
  - 'NAI: All Domain Controllers within the enterprise.'
  range: Last 90 days, correlating privileged interactive logins within 1 hour preceding the replication
    event.
  queries:
  - technology: SIEM/Rule pseudocode
    query: "repl = EventCode=4662 with replication_GUIDs\nwhere source_host not in tier0_enclave\npriv_login\
      \ = EventCode in (4624,4672) where LogonType in (2,10)\n  and host not in tier0_enclave and ts within\
      \ -60m of repl.ts\nalert when repl present (escalate if priv_login correlates)"
- question: Compared to a 60-90 day baseline, is the observed (account, source host, destination DC) replication
    relationship a first-seen edge, below the 1st percentile of historical frequency, or occurring off-hours
    with no approved change window?
  context: Legitimate replication forms a stable, predictable set of (account, source host, destination
    DC) triples and time-of-day patterns. By baselining replication-right frequency over 60-90 days, the
    analyst can trigger on a brand-new host->DC replication edge, on edges that fall under the 1st percentile
    of historical frequency, or on off-hours activity outside change windows. A calibrated Bayesian new-edge
    probability scores the 'first-time replication edge' likelihood, and triples absent from the learned
    normal login structure are rejected; thresholds can be derived from labeled red-team replication/lateral
    events in the LANL User-Computer Authentication dataset. This statistical lens supports Credential
    Access detection by catching novel or rare replication that signature rules miss. A positive result
    is a rare/novel/off-hours replication edge; a negative result is an established, frequent, in-window
    edge.
  answer_sources:
  - Windows Event ID 4662
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Zeek dce_rpc.log
  - Zeek conn.log
  - 'NAI: All Domain Controllers within the enterprise.'
  range: Last 90 days, with a 60-90 day rolling baseline of replication edges and time-of-day.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = freq_and_tod over 90d of (account, src_host, dst_DC) from 4662 repl events\nfor\
      \ e in current_repl_events:\n  new_edge = bayes_new_edge_prob(e.src_host, e.dst_DC)\n  if first_seen(e)\
      \ or freq(e) < p01(baseline) or off_hours(e.ts) and no_change_window(e):\n    score = new_edge;\
      \ alert(e, score)"
- question: Are there access-denied Event ID 4662 results or failed/blocked replication RPC binds from
    a single non-DC source, indicating privilege probing before a successful DCSync?
  context: 'A successful DCSync is often preceded by failed attempts as the adversary tests whether a
    compromised identity holds replication rights. Tracking access-denied 4662 outcomes and failed/blocked
    replication RPC binds per source treats reconnaissance as its own precursor signal: a burst of denied
    replication-right requests from a non-DC host indicates privilege probing and should escalate even
    when no successful 4662 ever appears. This is directly relevant to Credential Access because catching
    the probing phase enables intervention before credentials are exfiltrated. A positive result is a
    rising count of denied replication requests from one source; a negative result is the absence of denial
    bursts.'
  answer_sources:
  - Windows Event ID 4662
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Zeek dce_rpc.log
  - Zeek conn.log
  - 'NAI: All Domain Controllers within the enterprise.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'denied = EventCode=4662 where AccessMask indicates denied and replication_GUIDs

      agg count by SubjectUserSid, source_host over rolling 1h/24h

      alert when denied_count from non_DC source > threshold (burst of probing)'
- question: Does an unsupervised graph link-prediction model of accounts, hosts, and DCs with replication-right
    edges flag any improbable replication edge originating from a user workstation or non-tier-0 server?
  context: When normal replication structure is essentially DC-to-DC plus a few service accounts, an unsupervised
    graph neural network can learn that structure and assign low probability to edges that do not fit
    it. The analyst builds a graph of accounts/hosts/DCs with replication-right edges (CyberGraph approach),
    learns normal connectivity, and alerts on improbable edges from user workstations or non-tier-0 servers,
    surfacing the top-3 contributing features (new-edge flag, source tier, off-hours, fan-out) in the
    alert. This ML method strengthens Credential Access detection by generalizing beyond fixed allowlists
    to catch novel replication patterns; it can be benchmarked on the LANL dataset. A positive result
    is a low-probability replication edge from a non-privileged source; a negative result is an edge consistent
    with learned DC/service-account structure.
  answer_sources:
  - Windows Event ID 4662
  - Windows Event ID 4624
  - Windows Event ID 4769
  - Zeek dce_rpc.log
  - Zeek conn.log
  - 'NAI: All Domain Controllers within the enterprise.'
  range: Last 90 days, with model trained on 60-90 days of replication-graph history.
  queries:
  - technology: ML/Graph link-prediction pseudocode
    query: "G = graph(nodes=accounts+hosts+DCs, edges=replication_rights over 90d)\nmodel = unsupervised_GNN_link_prediction.fit(G)\n\
      for edge in current_repl_edges:\n  p = model.edge_prob(edge)\n  if p < tau and edge.src in {workstation,\
      \ non_tier0_server}:\n    alert(edge, top3_features=[new_edge, src_tier, off_hours, fan_out])"
- question: Is there any DRSUAPI RPC bind or call (interface UUID E3514235-4B06-11D1-AB04-00C04FC2DCD2,
    operation IDL_DRSGetNCChanges) in Zeek dce_rpc.log whose source IP is not in the Domain Controller
    or approved identity-management subnet allowlist?
  context: Even without endpoint logs, DCSync is visible on the wire as a DRSUAPI session. The analyst
    should alert on dce_rpc.log records carrying the DRSUAPI interface UUID and the IDL_DRSGetNCChanges
    operation where the source IP is outside the DC and approved identity-management subnet allowlist,
    escalating when a single source issues multiple RPC binds or reaches more than one DC via ephemeral
    high ports in a short window. This network view supports Credential Access detection because legitimate
    replication traffic should only flow between DCs (and a small set of sanctioned services); a non-DC
    source speaking DRSUAPI is almost always credential replication abuse. A positive result is a non-allowlisted
    source performing DRSUAPI calls; a negative result is DRSUAPI confined to DC peers.
  answer_sources:
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 5157
  - 'NAI: Network sensor monitoring traffic on internal network segments containing Domain Controllers,
    and at key network choke points.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "from dce_rpc.log\nwhere endpoint == 'drsuapi' (UUID E3514235-4B06-11D1-AB04-00C04FC2DCD2)\n\
      \  and operation == 'DRSGetNCChanges'\n  and id.orig_h not in (DC_subnets + identity_mgmt_allowlist)\n\
      alert; escalate if distinct(id.resp_h) > 1 or bind_count high within 15m"
- question: Do any non-DC sources show replication transfer profiles that exceed the 99th percentile of
    response bytes, contact more than one DC within 15 minutes, or exhibit abnormally short inter-request
    intervals compared to legitimate replication baselines?
  context: Credential replication transfers a large amount of directory data, so the size and shape of
    DRSUAPI sessions distinguish DCSync from routine admin activity. The analyst baselines per-session
    resp_bytes (Volume), request counts (Frequency), and DC fan-out for legitimate replication, then alerts
    when a non-DC source exceeds the 99th percentile transfer size, contacts more than one DC within 15
    minutes, or shows abnormally short inter-request intervals, scoring with unsupervised PCA/k-means/MAD
    methods and combining with the first-time (host->DC) edge probability. This is tactic-specific to
    Credential Access because the goal is to confirm the high-volume directory pull characteristic of
    DCSync. A positive result is an outlier transfer/fan-out profile from a non-DC host; a negative result
    is a transfer profile consistent with normal replication.
  answer_sources:
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 5157
  - 'NAI: Network sensor monitoring traffic on internal network segments containing Domain Controllers,
    and at key network choke points.'
  range: Last 90 days, with per-session baselines over 60-90 days.
  queries:
  - technology: Zeek/Stats pseudocode
    query: "sessions = join(dce_rpc.log drsuapi, conn.log) by uid\nfeatures = [resp_bytes, request_count,\
      \ dc_fanout_15m, inter_req_interval]\nbaseline legitimate replication; score = PCA/kmeans/MAD(features)\n\
      alert when src not DC and (resp_bytes > p99 or dc_fanout_15m > 1\n  or inter_req_interval < min_normal)\
      \ ; weight by bayes_new_edge_prob(src,dst)"
- question: Are there blocked DRSUAPI binds or Windows Filtering Platform deny events (Event ID 5157)
    from non-DC sources to DC RPC endpoints, and is the per-source blocked count rising over time?
  context: Blocked replication attempts are a precursor signal distinct from successful transfers. The
    analyst should treat blocked DRSUAPI binds and WFP deny events (Event ID 5157, complementing allow
    events in 5156) from non-DC sources to DC RPC endpoints as a failure-mode indicator; rising blocked-bind
    counts per source indicate reconnaissance toward replication abuse. For the Credential Access tactic
    this matters because it can reveal an adversary probing for a path to DCSync before any successful
    replication occurs, enabling earlier response. A positive result is an increasing trend of blocked
    DRSUAPI/RPC binds from a single non-DC source; a negative result is the absence of such blocked-bind
    trends.
  answer_sources:
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 5157
  - 'NAI: Network sensor monitoring traffic on internal network segments containing Domain Controllers,
    and at key network choke points.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: "deny = WinEventLog:Security EventCode=5157 where dest in DC_RPC_endpoints\n  and src not in\
      \ DC_subnets\nblocked_binds = zeek_dce_rpc where rpc bind failed/blocked, src non-DC\ntrend count\
      \ by source over rolling windows; alert on rising blocked-count"
- question: Does a scalable temporal link-prediction model over the authentication/communication graph
    score any source-destination pair as a rare replication edge or as a sequence resembling a DCSync
    transaction shape?
  context: 'DCSync has a recognizable temporal and structural footprint: a rare edge into a DC followed
    by a replication-shaped exchange. Using scalable temporal link prediction (the Euler approach) over
    the authentication/communication graph, the analyst scores each source-destination pair, alerting
    on rare replication edges and on sequences that resemble DCSync transaction shapes, and reports the
    top-3 drivers (edge novelty, byte percentile, fan-out). This ML method advances Credential Access
    detection by modeling time-evolving graph behavior rather than static thresholds, and can be benchmarked
    on the LANL dataset. A positive result is a high-scoring rare/replication-shaped edge into a DC; a
    negative result is edges consistent with the learned temporal graph.'
  answer_sources:
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 5156
  - Windows Event ID 5157
  - 'NAI: Network sensor monitoring traffic on internal network segments containing Domain Controllers,
    and at key network choke points.'
  range: Last 90 days, with temporal model over 60-90 days of graph history.
  queries:
  - technology: ML/Temporal link-prediction pseudocode
    query: "G_t = temporal_graph(auth + comm edges)\nmodel = euler_temporal_link_prediction.fit(G_t)\n\
      for (src,dst) in current_edges:\n  score = model.rarity(src,dst) + seq_match(dcsync_shape)\n  if\
      \ score > tau: alert(top3=[edge_novelty, byte_pct, fan_out])"
- question: Do any process-creation or script-block events (Event ID 4688, Sysmon Event ID 1, PowerShell
    4104) contain high-confidence DCSync tooling strings such as lsadump::dcsync, /dcsync, GetNCChanges,
    or secretsdump -just-dc / -just-dc-ntlm, especially on non-DC hosts or from temporary/user-writable
    paths?
  context: DCSync is commonly executed via Mimikatz (lsadump::dcsync) or Impacket secretsdump.py (-just-dc,
    -just-dc-ntlm), leaving distinctive command-line and script-block artifacts. The analyst applies regex/token
    rules to Event ID 4688, Sysmon Event ID 1, and PowerShell 4104 content for explicit DCSync indicators
    and raises severity when execution occurs on a non-DC host or from a temporary/user-writable path.
    This endpoint view directly supports Credential Access detection because it catches the tooling itself,
    providing high-confidence attribution to a process, user, and host. A positive result is a command
    line or script block bearing DCSync tokens; a negative result is the absence of such tooling strings.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: All workstations and member servers within the Active Directory environment, with heightened
    monitoring on systems used by administrators or those with network access to Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'proc = EventCode in (4688) OR Sysmon EventID=1 OR PowerShell EventID=4104

      where command_line ~ /lsadump::dcsync|\/dcsync|GetNCChanges|secretsdump.*(-just-dc|-just-dc-ntlm)/i

      alert; raise_severity if host not in DCs or image_path in user_writable/temp'
- question: Relative to a per-role baseline of admin command-line token frequency, are there first-seen
    token combinations involving replication keywords, command lines above the 98th percentile in length
    or entropy, or bursts of related commands within a single logon session?
  context: Adversaries may obfuscate or vary DCSync invocations to evade exact string matches, so statistical
    novelty detection complements signature rules. The analyst baselines admin command-line token frequency
    by user role and alerts on first-seen token combinations involving replication keywords, command lines
    exceeding the 98th percentile in length or entropy, and bursts of related commands within one logon
    session (the structurally-anomalous login approach). For Credential Access this matters because it
    catches obfuscated or novel DCSync execution that fixed regex misses. A positive result is a rare/long/high-entropy
    replication-related command line or a command burst; a negative result is command activity consistent
    with the role baseline.
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: All workstations and member servers within the Active Directory environment, with heightened
    monitoring on systems used by administrators or those with network access to Domain Controllers.'
  range: Last 90 days, with per-role command-line baselines over 60-90 days.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = token_freq by user_role over 90d\nfor cmd in proc_events:\n  novel = first_seen(tokens(cmd))\
      \ and tokens ~ replication_keywords\n  if novel or len(cmd) > p98 or entropy(cmd) > p98 or burst_in_session(cmd):\n\
      \    alert(cmd)"
- question: Does a whole-system provenance-graph model detect DCSync tooling at the node level (process
    spawn plus DRSUAPI network plus credential access) and trace the offending process or file node for
    triage?
  context: 'Provenance-graph learning ties a DCSync execution to its full causal context: the spawning
    process, the DRSUAPI network activity, and the resulting credential access. Using node-level detection
    over whole-system provenance graphs (ThreaTrace) the analyst can flag the offending process/file node
    and emit contributing nodes for explainability, then reconstruct the surrounding attack subgraph with
    a temporal graph autoencoder (KAIROS). This ML approach strengthens Credential Access investigation
    by giving the analyst a traceable subgraph rather than an isolated alert, accelerating scoping and
    root-cause analysis. A positive result is a DCSync-implicated node with a coherent attack subgraph;
    a negative result is benign provenance with no replication-linked node.'
  answer_sources:
  - Windows Event ID 4688
  - Sysmon Event ID 1
  - Windows Event ID 4104
  - 'NAI: All workstations and member servers within the Active Directory environment, with heightened
    monitoring on systems used by administrators or those with network access to Domain Controllers.'
  range: Last 90 days, with provenance graphs reconstructed around each candidate event.
  queries:
  - technology: ML/Provenance-graph pseudocode
    query: "P = whole_system_provenance(process_spawn + drsuapi_net + cred_access)\nnode_scores = threatrace.detect(P)\
      \  # node-level\nfor n in node_scores where score > tau:\n  subgraph = kairos_tgae.reconstruct(P,\
      \ n)\n  emit(offending_node=n, contributing_nodes, subgraph)"
- question: Did Zeek raise a DCSync::Replication_From_Non_DC or Mimikatz::DCSync_Transaction notice, and
    can it be auto-enriched with matching dce_rpc/conn records and DC logon context (Event ID 4624) from
    the same source and time window confirming the IDL_DRSGetNCChanges call came from a non-DC source?
  context: Purpose-built Zeek notices for DCSync are high-confidence detections that should be treated
    as such and immediately enriched. The analyst auto-correlates each DCSync::Replication_From_Non_DC
    and Mimikatz::DCSync_Transaction notice with the matching dce_rpc and conn records and with DC logon
    context (Event ID 4624) from the same source and time window, confirming the DRSUAPI IDL_DRSGetNCChanges
    call originated from a non-DC source. For Credential Access this matters because it converts a notice
    into a fully-contextualized, actionable incident with attributed source, account, and DC. A positive
    result is a corroborated non-DC replication notice; a negative result is a notice that enrichment
    shows to be benign or DC-originated.
  answer_sources:
  - Zeek notice.log
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network sensors monitoring traffic to and from Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'notice in (DCSync::Replication_From_Non_DC, Mimikatz::DCSync_Transaction)

      enrich with dce_rpc.log + conn.log by (src,dst,time_window)

      join WinEventLog:Security EventCode=4624 by src,time_window

      confirm operation==''DRSGetNCChanges'' and src not in DCs; escalate high-confidence'
- question: Over rolling windows, is a source's DCSync notice count, distinct destination DC count (spread),
    or recurrence above the 99th percentile, repeated across multiple DCs, or coming from a host with
    no historical replication?
  context: Beyond a single notice, the burst and spread of DCSync notices indicate active, aggressive
    credential replication. The analyst tracks notice count (Frequency), distinct destination DCs (spread),
    and recurrence per source over rolling windows, escalating above the 99th percentile, on multi-DC
    repetition, or when the source has no historical replication, weighting by first-time-edge probability
    and unsupervised rarity scoring. This statistical lens supports Credential Access detection by prioritizing
    the most anomalous and far-reaching replication behavior. A positive result is a high-volume, multi-DC,
    or novel-source notice pattern; a negative result is sparse, single-DC, historically-normal notice
    activity.
  answer_sources:
  - Zeek notice.log
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network sensors monitoring traffic to and from Domain Controllers.'
  range: Last 90 days, with rolling-window counts and 60-90 day edge history.
  queries:
  - technology: SIEM/Stats pseudocode
    query: "agg by source: notice_count, distinct(dst_DC), recurrence over rolling windows\nescalate when\
      \ notice_count > p99 or distinct(dst_DC) > 1\n  or no_historical_replication(source)\nweight = bayes_new_edge_prob(source)\
      \ + unsupervised_rarity_score"
- question: When we embed the surrounding user-operation log context in a heterogeneous graph and cluster
    it, does the DCSync notice co-occur with genuinely anomalous behavior rather than benign administration
    that merely triggered the notice?
  context: Not every DCSync notice is malicious; sanctioned administration or tooling can occasionally
    trip the signature. By embedding the surrounding user-operation log context in a heterogeneous graph
    and clustering (the Log2vec approach), the analyst can confirm whether the notice co-occurs with anomalous
    behavior or sits within a normal operational cluster, reducing false positives. For Credential Access
    this matters because it improves precision, ensuring scarce analyst time targets true replication
    abuse. A positive result is a notice embedded in an anomalous behavior cluster; a negative result
    is a notice falling within a benign administrative cluster.
  answer_sources:
  - Zeek notice.log
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network sensors monitoring traffic to and from Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/Graph-embedding pseudocode
    query: 'ctx = user_operation_logs around notice (auth, process, rpc)

      emb = log2vec.embed(heterogeneous_graph(ctx))

      cluster = cluster(emb)

      if notice in anomalous_cluster: confirm_true_positive

      else: suppress_as_benign_admin'
- question: Using ensemble risk scoring over notice metadata, source criticality, account privilege tier,
    destination DC sensitivity, and prior-compromise indicators, which DCSync investigations rank highest,
    and what are the top-3 contributing features?
  context: When multiple notices and signals compete for attention, ensemble risk scoring prioritizes
    the investigations most likely to be real and most damaging. The analyst ranks investigations using
    notice metadata, source criticality, account privilege tier, destination DC sensitivity, and prior-compromise
    indicators (the Hopper-style scoring), surfacing the top-3 contributing features in the alert text
    and suppressing low-context false positives. For Credential Access this matters because DCSync against
    a high-sensitivity DC by a tier-0 account on a previously-compromised host is far more urgent than
    an isolated low-context notice. A positive result is a high-ranked investigation with strong contributing
    features; a negative result is a low-ranked, low-context notice that can be suppressed.
  answer_sources:
  - Zeek notice.log
  - Zeek dce_rpc.log
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Network sensors monitoring traffic to and from Domain Controllers.'
  range: Last 90 days
  queries:
  - technology: ML/Ensemble risk-scoring pseudocode
    query: "features = [notice_meta, source_criticality, account_priv_tier,\n  dst_DC_sensitivity, prior_compromise]\n\
      risk = ensemble_model.score(features)\nrank investigations by risk desc; emit top3_features per\
      \ alert\nsuppress when risk < tau and low_context"
