name: 'T1599: Network Boundary Bridging'
id: 90de2763-ffe8-4f2f-bc27-2cbe26d493c7
description: 'Investigate potential Network Boundary Bridging (T1599), where an adversary compromises
  perimeter or internal segmentation devices (routers, firewalls, VPN concentrators, layer-3 switches)
  or multi-homed hosts to bypass traffic-routing restrictions that separate trusted and untrusted networks.
  This playbook helps an analyst hunt for: malicious access to boundary-device management interfaces (SSH/HTTPS/Telnet)
  from threat-intel or anomalous sources, brute-force-then-success logon sequences, creation or modification
  of network bridges and static routes on multi-homed hosts (e.g., netsh bridge commands, New-NetAdapter
  / New-NetIPRoute), host-level relay/forwarding where inbound traffic on one interface is promptly re-emitted
  from another into a different segment, connections that violate the segmentation policy/zone allow-matrix,
  and successful admin logins from off-list sources followed by policy-violating traffic. It combines
  symbolic-logic rules, statistical rarity and forecasting, and machine-learning detectors to surface
  configuration-change-then-anomalous-traffic chains indicative of an adversary bridging a trust boundary.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Are there connections to a network boundary device's management interface (SSH/22, Telnet/23,
    HTTPS/443, 8443, SNMP/161) originating from an IP address listed on a threat-intelligence feed, or
    matching a known vulnerability/exploit signature against that device?
  context: 'Network Boundary Bridging begins with the adversary gaining administrative reach to a perimeter
    or segmentation device. Maintain an authoritative inventory of boundary-device IPs and their management
    ports, then alert when a flow lands on one of those ports from a source that appears on a threat-intel
    feed, and correlate with any IDS/notice signature match against the same device to confirm exploitation.
    A positive result indicates an attacker is actively trying to authenticate to or exploit the device
    that enforces your trust boundary; a negative result reduces the likelihood of external credentialed/exploit
    access. This reflects the SSH/credentialed-access kill-chain in CISA AA22-158A. (Method: Symbolic
    Logic; tactic: Defense Impairment.)'
  answer_sources: &id001
  - Zeek conn.log
  - Zeek notice.log
  - networkdevice:syslog (AAA/auth)
  - 'NAI: Perimeter firewalls, VPN concentrators, Internal network segmentation gateways (e.g., routers,
    layer-3 switches)'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn | where id.resp_h in device_mgmt_list and id.resp_p in {22,23,443,8443,161}\n      and\
      \ id.orig_h in threat_intel_feed\n| join (notice | where id.resp_h in device_mgmt_list and note\
      \ in exploit_sigs) on id.resp_h\n| emit alert with orig_h, resp_h, resp_p, matched_signature"
  - technology: SIEM/Rule pseudocode
    query: 'source=networkdevice:syslog event=auth dest_ip IN device_mgmt_list

      | lookup threat_intel src_ip OUTPUT ti_match

      | where ti_match=true OR vuln_sig_match=true

      | alert'
- question: Is there a pattern of failed or blocked management-interface logon attempts against a boundary
    device from a single source, especially a burst of failures followed by a success (brute force preceding
    compromise)?
  context: 'Treat failure states as first-class signals. From device AAA/syslog and Zeek conn.log connection
    states (S0/REJ/RSTO), count failed/blocked management attempts per source over short windows (e.g.,
    5 minutes), and alert when failures are followed by a success from the same source IP. A failures-then-success
    transition strongly suggests a successful brute force or credential-stuffing attack against the device
    that gates your network boundary. This profiling of reject/failure rates is consistent with the credential-abuse
    chain in CISA AA22-158A. (Method: Symbolic Logic; tactic: Defense Impairment.)'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=(networkdevice:syslog OR zeek_conn) dest_ip IN device_mgmt_list

      | eval failed = (status in {fail,REJ,S0,RSTO})

      | bin _time span=5m

      | stats sum(failed) as fails, sum(success) as ok by src_ip, bin

      | where fails >= 5 AND ok >= 1

      | alert'
- question: For successful management connections to boundary devices, is the source ASN or country one
    that has never been seen before (or is extremely rare) for administering that device over the last
    90 days?
  context: 'Legitimate administration usually originates from a small, stable set of source ASNs and countries.
    Baseline source ASN and country per device over a rolling 90 days, compute per-(source,device) frequency,
    and alert when a successful connection uses a never-seen or bottom-5th-percentile ASN/country. Scoring
    the structural rarity of (source, device, hour) tuples surfaces logins that are statistically improbable
    for that device, a hallmark of stolen-credential or unexpected-geography access. Include the top-3
    rarest attributes in the alert so the analyst can quickly judge legitimacy. (Method: Statistical Method;
    tactic: Defense Impairment.)'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=mgmt_success dest_ip IN device_mgmt_list

      | iplocation src_ip (asn, country)

      | stats count by dest_ip, asn, country  // 90d baseline

      | eval freq_pct = percentile_rank(count)

      | where never_seen(asn,country) OR freq_pct < 5

      | emit alert with top3_rarest_attrs'
- question: Does the observed hourly volume of management connection attempts (or failed-attempt rate)
    to a boundary device exceed the forecast upper confidence bound, indicating automated scanning or
    brute force?
  context: 'Automated scanning and brute force produce volume spikes that deviate from normal administrative
    rhythms. Train a time-series forecaster (Prophet/SARIMA) on per-device hourly counts of management
    connection attempts and the failed-attempt rate, then alert when observed volume exceeds the 95% upper
    confidence bound. Exceedance implies an abnormal surge of access activity against the boundary device.
    Emit the forecast value, observed value, and the dominant contributing hour so analysts can confirm
    and pivot. (Method: Machine Learning; tactic: Defense Impairment.)'
  answer_sources: *id001
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=mgmt_attempts dest_ip IN device_mgmt_list

      | timechart span=1h count as obs by dest_ip

      | forecast model=SARIMA field=obs -> yhat, yhat_upper95

      | where obs > yhat_upper95

      | emit alert with obs, yhat, contributing_hour'
- question: Was a process created (Event ID 4688) or PowerShell script block logged (Event ID 4104) on
    a multi-homed host that creates or modifies a network bridge or static route (e.g., netsh bridge add
    adapter, New-NetAdapter/Set-NetAdapter bridging, New-NetIPRoute)?
  context: 'Routing/forwarding manipulation on a multi-homed host is the defining T1599 action: it stitches
    two otherwise-separated segments together. Alert on 4688 where ProcessName is netsh.exe and the command
    line contains ''bridge'', ''add'', and ''adapter'', plus a parallel 4104 rule matching New-NetAdapter/Set-NetAdapter
    bridging functions and New-NetIPRoute static-route additions. Derive the multi-homed host list from
    interface inventory and treat IP-forwarding registry enablement as a corroborating state signal. A
    match indicates a host is being configured to relay traffic across a trust boundary. (Method: Symbolic
    Logic; tactic: Defense Impairment.)'
  answer_sources: &id002
  - Windows Event ID 4688
  - Windows Event ID 4104
  - 'NAI: Multi-homed servers (e.g., web servers in a DMZ with an internal management interface), Developer
    workstations with multiple network adapters (e.g., physical and virtual)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventID=4688 ProcessName=*netsh.exe* CommandLine=*bridge* CommandLine=*add* CommandLine=*adapter*)

      OR (EventID=4104 ScriptBlock=(*New-NetAdapter* OR *Set-NetAdapter* OR *New-NetIPRoute*))

      | where Computer IN multihomed_host_list

      | alert'
- question: On known multi-homed hosts, are netsh.exe or networking-cmdlet invocations using command-line
    arguments that are in the top 1% of rarity across the fleet?
  context: 'Adversary bridging commands use argument combinations that rarely appear in normal administration.
    For known multi-homed hosts, baseline every command-line argument used with netsh.exe and networking
    cmdlets, compute TF-IDF per argument across the fleet, and alert when a command uses arguments in
    the top 1% rarity. Robust rarity scoring of host-command tuples surfaces unusual tokens that legitimate
    admins seldom use. List the top-3 rarest tokens in the alert to accelerate triage. (Method: Statistical
    Method; tactic: Defense Impairment.)'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '(EventID=4688 OR EventID=4104) Computer IN multihomed_host_list

      | tokenize CommandLine -> tokens

      | tfidf(tokens) across fleet -> token_rarity

      | eval max_rarity = max(token_rarity)

      | where max_rarity >= percentile(99)

      | emit alert with top3_rarest_tokens'
- question: Does a machine-learning classifier score a 4688/4104 command-line string as malicious bridging
    with confidence above 0.90?
  context: 'Some malicious bridging commands evade simple keyword rules through obfuscation or novel syntax.
    Train a classifier (logistic regression / gradient boosting) on labeled 4688/4104 command-line strings
    using tokenized arguments, length, and special-character features, and alert when malicious-bridging
    confidence exceeds 0.90. Surface the top-3 SHAP/coefficient feature contributions so analysts understand
    why the string scored high. Sequence deviation in the broader login->config->commit chain can be modeled
    with DeepLog as a complement. (Method: Machine Learning; tactic: Defense Impairment.)'
  answer_sources: *id002
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'features = tokenize+length+specialchar(CommandLine) for EventID in {4688,4104}

      score = bridging_classifier.predict_proba(features)

      | where score > 0.90

      | emit alert with top3_feature_contributions'
- question: On a multi-homed host, is an inbound connection on one interface promptly (within ~2 seconds)
    followed by a related outbound connection from a second interface to a different network segment that
    is not allowlisted?
  context: 'Relay forwarding is the host-level equivalent of device tunnel/route bridging: traffic arrives
    on one interface and is re-emitted from another into a separate segment. For each multi-homed host,
    match every inbound connection to an outbound connection from the same host within 2 seconds, and
    alert when the outbound destination subnet differs from the inbound source subnet and the (inbound
    port, outbound port, proto) tuple is not allowlisted. A match indicates the host is bridging traffic
    across a trust boundary, the core T1599 behavior described in CISA AA22-158A. (Method: Symbolic Logic;
    tactic: Defense Impairment.)'
  answer_sources: &id003
  - Zeek conn.log
  - 'NAI: Network taps monitoring traffic to/from DMZ segments, Core switch SPAN ports, Multi-homed servers'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "conn | where host in multihomed_host_list\n| self-join inbound(resp_h=host) with outbound(orig_h=host)\n\
      \      on host where abs(out.ts - in.ts) <= 2s\n| where subnet(out.resp_h) != subnet(in.orig_h)\n\
      \      and (in.resp_p, out.resp_p, proto) not in allowlist\n| emit alert"
- question: For interface pairs on multi-homed hosts, does a relaying session's byte ratio (orig_bytes/resp_bytes)
    or connections-per-minute exceed 3 robust standard deviations from the baseline for that interface
    pair and protocol?
  context: 'Relay sessions have characteristic byte and frequency profiles. For each interface pair on
    multi-homed hosts, baseline the orig_bytes/resp_bytes ratio (volume) and connections-per-minute (frequency)
    using robust mean/MAD, and alert when a relaying session exceeds 3 robust standard deviations for
    that interface pair and protocol. Deviations flag forwarding behavior that differs from normal host
    traffic. Include the deviating ratio and baseline in the alert so analysts can validate the magnitude
    of the anomaly. (Method: Statistical Method; tactic: Defense Impairment.)'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn | where host in multihomed_host_list

      | eval ratio = orig_bytes/resp_bytes

      | stats robust_mean(ratio) as mu, mad(ratio) as mad by iface_pair, proto

      | where abs(ratio - mu) > 3*1.4826*mad

      | emit alert with ratio, mu, mad'
- question: Do unsupervised anomaly detectors (Isolation Forest / Extended Isolation Forest, autoencoders,
    DBSCAN) flag forwarding sessions on multi-homed hosts as outliers relative to normal flow behavior?
  context: 'Bridging sessions may not match any single rule but stand out as multivariate outliers. Build
    feature vectors from Zeek conn.log for multi-homed hosts (resp_p, proto, duration, orig/resp bytes,
    byte ratio, subnet pair) and score with Isolation Forest / Extended Isolation Forest or online autoencoders
    (Kitsune-style); flag outliers as suspicious bridging and emit the top-3 contributing features. DBSCAN
    can complement by identifying dense normal-flow clusters so that points outside them are treated as
    anomalies. (Method: Machine Learning; tactic: Defense Impairment.)'
  answer_sources: *id003
  range: Last 90 days
  queries:
  - technology: Zeek/ML pseudocode
    query: "X = features(conn[host in multihomed_host_list]):\n    [resp_p, proto, duration, orig_bytes,\
      \ resp_bytes, byte_ratio, subnet_pair]\nscores = IsolationForest.fit_predict(X)\n| where scores\
      \ == outlier\n| emit alert with top3_contributing_features"
- question: Are there connections that violate the defined network segmentation policy, i.e., any (Source
    Zone, Destination Zone, Port, Protocol) tuple lacking an entry in the allow-matrix?
  context: 'Segmentation policy is expressed as an allow-matrix of permitted zone-to-zone communication.
    Define network zones and the allow-matrix, enrich Zeek conn.log with zone metadata, and alert on any
    connection lacking an allow entry. A violation (e.g., a workstation subnet talking directly to a database
    subnet that policy says must go via an application server) indicates a trust boundary is being crossed
    in a prohibited way, which is exactly what boundary bridging enables. This misuse-rule enforcement
    is corroborated by the cross-boundary routing abuse in CISA AA22-158A. (Method: Symbolic Logic; tactic:
    Defense Impairment.)'
  answer_sources: &id004
  - Zeek conn.log
  - 'NAI: Network segmentation boundaries (e.g., between PCI and corporate LANs), DMZ perimeter, Internet
    egress/ingress points'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: 'conn | lookup zone(id.orig_h) as src_zone, zone(id.resp_h) as dst_zone

      | where (src_zone, dst_zone, id.resp_p, proto) not in allow_matrix

      | emit alert with src_zone, dst_zone, id.resp_p, proto'
- question: Across inter-zone paths, does a source reach an unusually high number of unique destinations
    per hour, or are there never-before-seen (source, destination) edges crossing zones?
  context: 'Boundary bridging often manifests as a source suddenly reaching new destinations across zones.
    For each inter-zone path, compute the 99th percentile of unique destinations reached per hour per
    source and alert on exceedance (path misuse). Additionally score never-before-seen (source, destination)
    cross-zone edges with a Bayesian new-edge model that separates benign new edges from anomalous ones.
    Report the rarity score and contributing edge so analysts can distinguish routine growth from suspicious
    cross-boundary expansion. (Method: Statistical Method; tactic: Defense Impairment.)'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'conn | enrich zones | where src_zone != dst_zone

      | bin _time span=1h | stats dc(id.resp_h) as uniq_dst by id.orig_h, path, bin

      | where uniq_dst > p99(uniq_dst by path)

      | union (new_edge_model(src,dst crossing zones) where p_new > threshold)

      | emit alert with rarity_score, edge'
- question: Has the hourly volume of denied/blocked connections at a critical boundary fallen below the
    forecast lower confidence bound for more than 15 minutes, implying a segmentation rule was disabled
    or bypassed?
  context: 'A drop in denials is a failure-mode signal: if a boundary normally blocks a steady stream
    of traffic and that stream of denials suddenly disappears, a rule may have been removed or bypassed.
    Forecast the hourly volume of denied/blocked connections at critical boundaries with SARIMA and alert
    when observed denials fall below the lower confidence bound for over 15 minutes. Combine with graph
    link-prediction over the host-communication graph to rank improbable new inter-zone connections. Surface
    the missing-denial baseline and the top improbable edges for the analyst. (Method: Machine Learning;
    tactic: Defense Impairment.)'
  answer_sources: *id004
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=boundary_logs action=denied

      | timechart span=1h count as denials by boundary

      | forecast model=SARIMA field=denials -> yhat, yhat_lower

      | where denials < yhat_lower for > 15m

      | emit alert with denials, yhat, top_improbable_edges'
- question: Did a successful administrative login to a boundary device occur from a source not on the
    approved admin IP/subnet list, and was it followed within 60 minutes by traffic that violates the
    device's segmentation policy?
  context: 'The documented T1599 chain is stolen-credential -> config-change -> policy-violating traffic.
    Maintain an approved IP/subnet list for device administration; alert on a successful login (Event
    ID 4624 or device syslog/AAA) from an off-list source, and trigger a related policy-violation check
    on the same device for the next 60 minutes. Correlating an unauthorized admin login with subsequent
    segmentation violations confirms the adversary used administrative access to bridge the boundary.
    The correlation-plus-rarity gating mirrors Hopper. (Method: Symbolic Logic; tactic: Defense Impairment.)'
  answer_sources: &id005
  - Zeek conn.log
  - Windows Event ID 4624
  - 'NAI: Firewall management interfaces, Router and switch management interfaces, Configuration management
    servers, Network taps at segmentation boundaries'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '(EventID=4624 OR networkdevice:syslog auth=success) dest IN boundary_devices

      | where src_ip not in approved_admin_list

      | join (policy_violation on same device within 60m)

      | emit alert'
- question: Is a successful admin session to a boundary device anomalous against the account's historical
    profile of source geolocation, ASN, and login hour-of-day (above the 95th percentile of rarity), and
    is it followed by policy-violating traffic?
  context: 'Stolen admin credentials are often used from unfamiliar geographies, ASNs, or at unusual hours.
    Build a historical profile of source geolocation, ASN, and login hour-of-day per admin account, score
    new sessions by percentile rarity, flag those above the 95th percentile, and concurrently query subsequent
    device traffic for policy violations. Also profile the failed-login rate per source as a distinct
    state signal. List the top-3 rarest attributes in the alert so analysts can judge whether the session
    is plausibly legitimate. (Method: Statistical Method; tactic: Defense Impairment.)'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'source=admin_success dest IN boundary_devices

      | iplocation src_ip (asn, country) | eval hod=hour(_time)

      | score rarity(account, asn, country, hod) -> pct

      | where pct > 95

      | join (policy_violation on same device within 60m)

      | emit alert with top3_rarest_attrs'
- question: Does an autoencoder trained on legitimate admin-session features flag a boundary-device admin
    session with high reconstruction error, and does the login->config-mode->commit event sequence deviate
    from the learned DeepLog model?
  context: 'Subtle deviations in admin-session behavior can indicate misuse even when individual attributes
    look plausible. Train an autoencoder on legitimate admin-session features (geolocation, time, day,
    duration, command count) from device syslog, flag sessions whose reconstruction error exceeds a tuned
    threshold, and model the login->config-mode->commit event sequence with DeepLog to catch out-of-order
    or unexpected command sequences. Escalate with a linked traffic check for policy violations and emit
    the top-3 highest-error features for SOC triage. (Method: Machine Learning; tactic: Defense Impairment.)'
  answer_sources: *id005
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'X = session_features(geo, time, day, duration, cmd_count) from device_syslog

      err = autoencoder.reconstruction_error(X)

      seq_anom = deeplog.score(login->config->commit sequence)

      | where err > threshold OR seq_anom

      | join (policy_violation on same device within 60m)

      | emit alert with top3_highest_error_features'
