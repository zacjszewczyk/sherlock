questions:
- question: '[Defense Impairment] Hash IOC correlation for audit tools: Can you determine whether A file
    transfer or local execution event on a Linux host indicates tooling used to stop or tamper with auditd,
    and the associated hash, path, or command line matches known audit-suppression tooling. -- specifically,
    using the ''Hash IOC correlation for audit tools'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the mission question is "Has
    the adversary attempted to disable or modify the Linux audit system?" Adversaries disable or modify
    auditd to blind defenders and erase evidence of their activity, so detecting tampering with the audit
    system is essential to preserving visibility. This evidence focuses on the condition that A file transfer
    or local execution event on a Linux host indicates tooling used to stop or tamper with auditd, and
    the associated hash, path, or command line matches known audit-suppression tooling. This Symbolic
    Logic approach works as follows: Match hashes from Zeek files.log and auditd EXECVE records against
    threat intelligence for auditd-tampering tools (e.g., skidmap/Ebury-style log suppressors), enriching
    with Zeek conn.log session details (src/dst, bytes, duration). First-party rule fires on hash match
    alone; external TI is enrichment only, not required. Surface the matched hash, file path, and prior
    command line in the alert. A positive result -- a rule match, statistical outlier, or model alert
    -- indicates probable tampering with the Linux audit system; pivot to the responsible host, the user/source
    IP and session, the process lineage and command line, the affected auditd service or configuration
    files, and the timing relative to any authentication or remote-access event to scope what activity
    may have been hidden. A negative result helps rule out this particular evasion vector but should be
    corroborated with the other questions in this playbook, since a single method can miss stealthy, encrypted,
    or low-and-slow activity.'
  answer_sources:
  - auditd EXECVE
  - auditd SYSCALL
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points, DMZ, and connections between workstations and the Linux server environment.'
  range: Last 90 days (correlate events within a 5-minute window of authentication/remote-access events)
  queries:
  - technology: SIEM/Rule pseudocode
    query: 'INDEX auditd:EXECVE, zeek:files OVER last 90d

      | EVAL h = coalesce(file.sha256, exe.sha256)

      | WHERE h IN (ti_lookup(''auditd_tamper_tools''))  // first-party match fires alone

      | JOIN zeek:conn ON uid  // enrich src,dst,bytes,duration

      | TABLE host,h,file_path,command_line,src,dst,bytes,duration

      | ALERT ''audit-suppression tool hash match'''
- question: '[Defense Impairment] High-entropy and volume transfer scoring: Can you determine whether
    A file transfer or local execution event on a Linux host indicates tooling used to stop or tamper
    with auditd, and the associated hash, path, or command line matches known audit-suppression tooling.
    -- specifically, using the ''High-entropy and volume transfer scoring'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the mission question is "Has
    the adversary attempted to disable or modify the Linux audit system?" Adversaries disable or modify
    auditd to blind defenders and erase evidence of their activity, so detecting tampering with the audit
    system is essential to preserving visibility. This evidence focuses on the condition that A file transfer
    or local execution event on a Linux host indicates tooling used to stop or tamper with auditd, and
    the associated hash, path, or command line matches known audit-suppression tooling. This Statistical
    Method approach works as follows: Flag executable/script transfers whose Shannon entropy is in the
    98th percentile for the asset type AND whose byte count deviates from the per-host baseline, following
    the stateless entropy/size feature approach of [Nadler et al.](https://www2.ee.unsw.edu.au/~hhabibi/pubs/conf/19im.pdf).
    Track transfer success/fail state and blocked-connection counts as distinct higher-severity signals;
    report entropy, size, and rate as the contributing features. A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable tampering with the Linux audit system; pivot to the
    responsible host, the user/source IP and session, the process lineage and command line, the affected
    auditd service or configuration files, and the timing relative to any authentication or remote-access
    event to scope what activity may have been hidden. A negative result helps rule out this particular
    evasion vector but should be corroborated with the other questions in this playbook, since a single
    method can miss stealthy, encrypted, or low-and-slow activity.'
  answer_sources:
  - auditd EXECVE
  - auditd SYSCALL
  - Zeek files.log
  - Zeek conn.log
  - 'NAI: Network egress points, DMZ, and connections between workstations and the Linux server environment.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'INDEX zeek:files WHERE mime_type IN (''application/x-executable'',''text/x-shellscript'')

      | EVAL ent = shannon_entropy(payload), pct = percentile(ent, by=asset_type)

      | EVAL z = (total_bytes - baseline_mean[host]) / baseline_std[host]

      | WHERE pct >= 98 AND abs(z) > 3

      | EVAL sev = if(transfer_state=''blocked'' OR transfer_state=''fail'', ''high'', ''med'')

      | TABLE host,ent,pct,total_bytes,rate,transfer_state,sev'
