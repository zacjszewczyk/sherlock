name: 'T1685.004: Disable or Modify Tools: Disable or Modify Linux Audit System Log'
id: 583564e0-69fa-4978-8653-0993c4a1ae79
description: 'This playbook helps an analyst investigate whether an adversary has attempted to disable
  or modify the Linux audit system (auditd) to hide malicious activity and evade detection (MITRE ATT&CK
  T1685.004, Disable or Modify Linux Audit System Log). With root privileges, adversaries can suppress
  kernel-level audit logging by killing or stopping the auditd daemon (kill/killall, systemctl stop|mask|disable
  auditd, service auditd stop), clearing or disabling rules (auditctl -D, auditctl -e 0), tampering with
  the rule and configuration files (/etc/audit/audit.rules, /etc/audit/auditd.conf, /etc/audit/rules.d/*),
  or hooking audit library functions. Under the Defense Impairment tactic, this hunt spans Linux servers
  (web, database, authentication), Linux administrator workstations and jump hosts, Windows management
  workstations and Domain Controllers with remote-access tooling, and the syslog/SIEM collectors and network
  paths between them. It pursues the behavior from several complementary angles: hash/IOC matching of
  audit-suppression tooling transferred or executed on hosts; regex detection of remote and local commands
  that stop, mask, disable, or reconfigure auditd; detection of writes/deletes to audit config files;
  and correlation of authenticated remote sessions with sudden, sustained gaps in audit/syslog forwarding
  while the host remains reachable. Detection methods combine deterministic symbolic-logic rules (hash
  matches, command and file-path regex, SSH-to-log-silence correlation), statistical baselining (entropy/size
  scoring, rarity percentiles, 3-sigma and change-point/CUSUM detection, leverage thresholding) and machine
  learning (Isolation/Random Forest transfer scoring, LSTM/Transformer command-sequence models, ARIMA/Prophet
  volume forecasting, provenance/graph models), applied across auditd EXECVE/SYSCALL/FILE, Linux syslog,
  Windows Event ID 4688, Zeek ssh/conn/files logs, and SIEM ingestion metrics.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
