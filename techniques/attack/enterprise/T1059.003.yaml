name: 'T1059.003: Windows Command Shell'
id: fe488cb3-7c60-4f47-b7d7-0ee175108470
description: 'Investigate Windows command shell activity that may represent adversary execution, post-exploitation,
  staging, reconnaissance, or command-and-control. This playbook focuses on IOC-bearing `cmd.exe` command
  lines, DOSfuscation and string-building behavior, bursty discovery commands, unusual parent-child relationships,
  suspicious outbound network use, rapid batch-file staging from writable paths, and broader deviations
  in command-line length, entropy, and network context.

  '
type: technique
related:
- tactic_id: TA0002
  tactic_name: Execution
contributors:
- Zachary Szewczyk
created: '2026-02-18'
modified: '2026-05-31'
version: '1.2'
tags: none
questions:
- question: 'Is any `cmd.exe` command line matching a high-confidence IOC and also backed by DNS or connection
    telemetry from the same host within 10 minutes?

    '
  context: 'The goal is to separate a noisy string hit from a defensible malicious execution event. Extract
    IPs, domains, hashes, and other IOC-like tokens from `cmd.exe` process creation, then require matching
    Zeek DNS or connection activity from the same host in a tight time window. Preserve the parent process,
    matched IOC, network destination, and timestamps so the analyst can quickly determine whether the
    shell was used to retrieve or contact known malicious infrastructure. References: [SigmaHQ Command
    Line Execution with Suspicious URL and AppData Strings](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_http_appdata/).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days, with priority on IOC-to-network joins within 10 minutes of the observed `cmd.exe`
    event.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'cmd = process_events where image=''cmd.exe''; extract_iocs(cmd.command_line); net = dns_or_conn
      where host=cmd.host and ts between cmd.ts and cmd.ts+10m; alert when ioc in threat_intel and correlated_net=true;
      output ioc, parent, command_line, destination, timestamps.

      '
- question: 'Are users launching `cmd.exe` with download or staging tokens and contacting a destination
    that is new for that host?

    '
  context: 'This question targets command-driven retrieval and staging. Focus on `/c` or `/k` command
    lines that include tokens such as `certutil`, `bitsadmin`, `curl`, `wget`, `ftp`, or encoded PowerShell,
    then determine whether the resulting external destination is first-seen for the host in its 30-day
    baseline. New outbound infrastructure combined with shell-based retrieval is a strong sign that the
    shell is being used for payload delivery instead of ordinary administration. References: [Elastic
    Suspicious Windows Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/)
    and [Splunk CMD Carry Out String Command Parameter](https://research.splunk.com/endpoint/54a6ed00-3256-11ec-b031-acde48001122/).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days, with a 30-day first-seen baseline and immediate review of the triggering execution.
  queries:
  - technology: SIEM rule pseudocode
    query: 'cmd = process_events where image=''cmd.exe'' and command_line has_any [''/c'',''/k'',''powershell
      -enc'',''certutil -urlcache'',''bitsadmin'',''curl'',''wget'',''ftp'']; conn = zeek_conn where host=cmd.host
      and dst_ip is_external; alert when conn.dst_ip is new_for_host_30d; output user, parent, command_line,
      dst_ip, first_seen_status.

      '
- question: 'Which domains extracted from `cmd.exe` activity are globally rare, new to the host, and associated
    with elevated NXDOMAIN or connection-failure rates?

    '
  context: 'Rare domains referenced by `cmd.exe` can indicate staging servers, dead beacon infrastructure,
    or domain-generation behavior. Build a 30-day enterprise prevalence model and a 7-day host prevalence
    model, then prioritize domains in the bottom percentile that are first-seen for the host. Add DNS
    failure and connection-refused profiling because failed communication is often part of the adversary
    pattern, not a reason to discard the event. References: [Microsoft Sentinel Time Series Anomaly for
    Process Executions](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days, using 30-day enterprise frequency, 7-day host history, and 1-hour DNS failure windows.
  queries:
  - technology: SIEM statistics pseudocode
    query: 'domains = extract_domains_from_cmd(process_events); stats = summarize domains by domain with
      enterprise_hosts_30d, host_seen_7d, nxdomain_rate_1h, conn_fail_rate_1h; alert where enterprise_rank<=p1
      and host_seen_7d=0 and (nxdomain_rate_1h>0.20 or conn_fail_rate_1h high).

      '
- question: 'Has a user or host recently exceeded its normal rate of IOC-bearing `cmd.exe` commands?

    '
  context: 'A single IOC-bearing command can be important, but a short-term surge is even more indicative
    of active operator behavior or malware automation. Build rolling daily counts of `cmd.exe` executions
    that contain validated IOC material, compare them to 60-day user and host-role baselines, and flag
    entities operating above the normal percentile threshold. This helps distinguish one-off administrative
    noise from a concentrated malicious execution campaign. References: [Microsoft Sentinel UEBA peer
    group anomaly detection](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days, with a 60-day rolling baseline and 24-hour surge scoring.
  queries:
  - technology: SIEM baseline pseudocode
    query: 'ioc_cmd = cmd_events with validated_ioc=true; daily = count ioc_cmd by user, host_role, day;
      threshold = max(percentile(daily,95),3); alert when current_24h_count > threshold; output baseline_horizon,
      current_count, threshold, sample_commands.

      '
- question: 'Does an explainable command-line classifier rate this `cmd.exe` execution as high risk based
    on token, length, parent, and special-character features?

    '
  context: 'Use a supervised model to catch malicious command lines that do not cleanly match known IOCs.
    The model should score `cmd.exe` executions using n-grams, command length, argument count, special-character
    ratio, download-related tokens, and parent process category, while always exposing top feature drivers
    so the analyst can validate why the event scored highly. This acts as a parallel detection path, not
    a replacement for deterministic IOC correlation. References: [Mandiant Obfuscated Command Line Detection
    Using Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/)
    and [Malware classification using XGBoost](https://www.researchgate.net/publication/346773159_Malware_classification_using_XGboost-Gradient_Boosted_Decision_Tree);
    train with labeled samples from [OTRF Security Datasets](https://github.com/UraSecTeam/mordor) and
    [Atomic Red Team T1059.003 test cases](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.003/T1059.003.md).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days for scoring, with retraining cadence defined locally.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = featurize_cmd(command_line, parent_image, arg_count, length, special_char_ratio,
      download_tokens); score = xgboost.predict_proba(features); explain = shap_top3(features); alert
      when score >= risk_threshold; output score, explain, command_line, parent.

      '
- question: 'Do any `cmd.exe` command lines contain multiple DOSfuscation techniques or one advanced encoding
    method that strongly suggests deliberate obfuscation?

    '
  context: 'Regular expression coverage should look for the classic DOSfuscation patterns: repeated carets,
    embedded quotes, delayed expansion, substring indexing, `SET`/`CALL` chains, and `FOR`-based value
    extraction. A single advanced encoding pattern or the coexistence of multiple obfuscation methods
    in one command line is a meaningful escalation point because benign administration rarely needs these
    techniques. Retain the exact tokens that matched so responders can judge whether the line is a copy-paste
    artifact or true adversarial string hiding. References: [DOSfuscation: Exploring the Depths of Cmd.exe
    Obfuscation and Detection Techniques](https://i.blackhat.com/briefings/asia/2018/asia-18-bohannon-invoke_dosfuscation_techniques_for_fin_style_dos_level_cmd_obfuscation-wp.pdf)
    and [Invoke-DOSfuscation test harness](https://github.com/danielbohannon/Invoke-DOSfuscation).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, particularly those with administrative or developer tools
    installed.'
  range: Last 90 days, with immediate triage on newly observed obfuscated strings.
  queries:
  - technology: SIEM regex pseudocode
    query: 'cmd = process_events where image=''cmd.exe''; patterns = match_regex_library(cmd.command_line,
      [''carets'',''embedded_quotes'',''delayed_expansion'',''substring_indexing'',''set_call'',''for_loop'',''/V'']);
      alert when pattern_count>=2 or advanced_encoding=true; output command_line, matched_patterns, parent,
      user.

      '
- question: 'Are there `cmd.exe` commands building strings through repeated `SET`/`CALL` expansion or
    reversal loops before execution?

    '
  context: 'This question focuses on string-concatenation behavior that tries to hide the final command
    until runtime. Flag sequences with multiple `SET` assignments followed by `CALL` expansion, plus `FOR
    /L` reversal logic that reconstructs a hidden payload character by character. These patterns are much
    more suspicious than a generic long command line because they show deliberate string assembly inside
    the Windows shell itself. References: [Elastic Suspicious Windows Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/)
    and [SigmaHQ DOSfuscation coverage request](https://github.com/SigmaHQ/sigma/issues/1010).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, particularly those with administrative or developer tools
    installed.'
  range: Last 90 days.
  queries:
  - technology: SIEM rule pseudocode
    query: 'alert from cmd_events where command_line matches set_call_chain or reversal_for_loop or set_to_exec_ratio
      > 3 and set_assignment_count >= 3; output command_line, set_assignment_count, parent, host.

      '
- question: 'Which `cmd.exe` commands exceed both normal entropy and special-character density, especially
    when they are unusually long?

    '
  context: 'Obfuscated shell commands often cannot hide both their complexity and their size. Measure
    Shannon entropy and special-character density for each command line, then compare the result to host-role
    baselines. Very long commands that also exceed the 95th percentile for entropy or metacharacter density
    deserve elevated review because padding tactics still leave a detectable length and structure footprint.
    References: [Elastic High Command Line Entropy Detected for Privileged Commands](https://www.elastic.co/guide/en/security/8.19/high-command-line-entropy-detected-for-privileged-commands.html)
    and [DOSfuscation character frequency analysis](https://cloud.google.com/blog/topics/threat-intelligence/dosfuscation-exploring-obfuscation-and-detection-techniques/).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, particularly those with administrative or developer tools
    installed.'
  range: Last 90 days, with 30-day host-role baselines.
  queries:
  - technology: SIEM statistics pseudocode
    query: 'metrics = calc_entropy_and_density(cmd_events.command_line); baseline = percentile_by_host_role(metrics,95);
      alert when entropy>p95 and special_density>p95 or (length>500 and entropy>p95); output metrics,
      host_role, baseline, command_line.

      '
- question: 'Has any host sharply increased its weekly rate of obfuscated `cmd.exe` usage relative to
    its peer group?

    '
  context: 'A rare obfuscated shell on a normally quiet workstation is often more important than the same
    event on a malware-analysis box. Track regex-confirmed obfuscated commands by peer group and alert
    on hosts above the 99th percentile of weekly activity. If a host has no historical obfuscation, even
    one event should be reviewed because the baseline itself is meaningful. References: [Microsoft Sentinel
    UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics)
    and [Anomaly Based Unknown Intrusion Detection in Endpoint Environments](https://www.mdpi.com/2079-9292/9/6/1022).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, particularly those with administrative or developer tools
    installed.'
  range: Last 90 days, with weekly rate comparisons across peer groups.
  queries:
  - technology: SIEM peer-group pseudocode
    query: 'obf = cmd_events where regex_obfuscation_hit=true; weekly = count obf by host, peer_group,
      week; alert when weekly_count > percentile(peer_group,99) or (historical_count=0 and weekly_count>=1);
      output host, peer_group, weekly_count.

      '
- question: 'Does a character-level obfuscation model identify novel or weakly matched DOSfuscated command
    lines that the regex library misses?

    '
  context: 'Deterministic patterns are necessary but incomplete. Score each `cmd.exe` line with an obfuscation
    model built from character distribution, length, keyword patterns, and special-character features
    so that new or adversarial variants are still surfaced. Analysts should always see the probability
    score and the top features that drove it, allowing them to decide whether the event is genuinely hidden
    logic or an administrative edge case. References: [Mandiant Obfuscated Command Line Detection Using
    Machine Learning](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/),
    [Invoke-DOSfuscation](https://github.com/danielbohannon/Invoke-DOSfuscation), and [Command-line Obfuscation
    Detection using Small Language Models](https://arxiv.org/html/2408.02637v1).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, particularly those with administrative or developer tools
    installed.'
  range: Last 90 days for scoring, with model drift monitoring over time.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = char_level_features(cmd.command_line); score = obfuscation_model.predict_proba(features);
      explain = top_features(features); alert when score >= threshold; output score, explain, command_line,
      regex_hits.

      '
- question: 'Is one parent process spawning several distinct reconnaissance-oriented `cmd.exe` children
    inside a five-minute window?

    '
  context: 'This pattern is a strong sign that the shell is being used immediately after execution for
    scripted discovery. Correlate `cmd.exe` children by stable parent identifier and logon session, then
    look for rapid sequences of commands such as `whoami`, `systeminfo`, `tasklist`, `ipconfig`, `net`,
    `nltest`, or `dsquery`. Include failed invocations because blocked or partially broken reconnaissance
    still exposes adversary intent. References: [Splunk Detect Prohibited Applications Spawning cmd.exe](https://research.splunk.com/endpoint/dcfd6b40-42f9-469d-a433-2e53f7486664/)
    and [Atomic Red Team T1059.003](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.003/T1059.003.md).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and critical application servers
    where reconnaissance is most impactful.'
  range: Last 90 days, evaluated in 5-minute windows per parent and logon session.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'recon = cmd_events where command matches discovery_list; grouped = group recon by parent_guid_or_pid,
      logon_session, window=5m; alert when distinct_commands >= 3; output parent, logon_session, command_list,
      timestamps, exit_codes.

      '
- question: 'Are analysts seeing chained one-liner `cmd.exe` reconnaissance commands joined by shell operators
    in a single command line?

    '
  context: 'One-line chains often compress several reconnaissance steps into a single execution to reduce
    process noise and speed up triage or lateral activity. Split command lines on shell operators such
    as `&`, `&&`, `||`, `|`, and `;`, then determine whether multiple discovery actions are present in
    the same execution. This is especially useful when the attacker performs fast host survey actions
    without spawning many separate child processes. References: [MITRE CAR-2014-11-002: Outlier Parents
    of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/) and [Red Canary Windows Command Shell Detection](https://redcanary.com/threat-detection-report/techniques/windows-command-shell/).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and critical application servers
    where reconnaissance is most impactful.'
  range: Last 90 days.
  queries:
  - technology: SIEM parsing pseudocode
    query: 'tokens = split_shell_operators(cmd.command_line); recon_hits = count tokens matching discovery_list;
      alert when recon_hits >= 2; output command_line, recon_tokens, parent, user.

      '
- question: 'Is a discovery burst appearing for a user role or host type that almost never performs this
    behavior?

    '
  context: 'A discovery burst on a finance workstation is operationally different from the same burst
    on an administrator jump box. Build 30-day baselines for discovery bursts by user role and host type,
    and treat unseen or bottom-percentile bursts as strong anomalies. This turns a generic recon rule
    into an environment-aware question about whether the behavior belongs on the system where it occurred.
    References: [Microsoft Sentinel UEBA](https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and critical application servers
    where reconnaissance is most impactful.'
  range: Last 90 days, with a 30-day peer baseline.
  queries:
  - technology: SIEM baseline pseudocode
    query: 'bursts = detect_discovery_bursts(cmd_events); baseline = frequency_by_role_and_hosttype(bursts,30d);
      alert when current_burst is unseen_in_peer_group or frequency <= percentile(peer,1); output user_role,
      host_type, peer_baseline, commands.

      '
- question: 'Do the intervals between discovery commands suggest automation rather than manual operator
    input?

    '
  context: 'Scripted discovery usually produces very short and very regular command spacing. Measure inter-command
    intervals inside each burst and identify sessions with sub-two-second mean gaps or very low interval
    variance. This helps distinguish an administrator manually exploring a box from a tool or batch script
    executing a fixed discovery program. References: [Anomaly Based Unknown Intrusion Detection in Endpoint
    Environments](https://www.mdpi.com/2079-9292/9/6/1022).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and critical application servers
    where reconnaissance is most impactful.'
  range: Last 90 days, centered on each discovery burst.
  queries:
  - technology: SIEM timing pseudocode
    query: 'seq = discovery_cmds grouped by parent_guid_or_pid, session; intervals = diff(seq.timestamps);
      alert when mean(intervals) < 2s or stddev(intervals) < 0.5s; output commands, intervals, parent,
      session.

      '
- question: 'Does the full logon-session sequence look abnormal even if the reconnaissance burst itself
    is not on a static list?

    '
  context: 'Sequence modeling broadens coverage beyond a fixed discovery command dictionary. Encode process
    events by process name, parent, and command category, then score the session for next-event likelihood.
    Low-likelihood sessions that pivot quickly from `cmd.exe` into reconnaissance or other post-exploitation
    activity can reveal novel operator tradecraft that would otherwise blend in. References: [DeepLog:
    Anomaly Detection and Diagnosis from System Logs](https://dl.acm.org/doi/10.1145/3133956.3134015)
    and [PyTorch DeepLog implementation](https://github.com/Thijsvanede/DeepLog).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows Endpoints and Servers, especially Domain Controllers and critical application servers
    where reconnaissance is most impactful.'
  range: Last 90 days, scored per logon session.
  queries:
  - technology: ML sequence pseudocode
    query: 'seq = build_session_sequence([process_name,parent_name,command_category]); prob = deeplog.next_event_likelihood(seq);
      alert when prob < session_threshold; output session_id, anomalous_steps, cmd_context, sample_events.

      '
- question: 'Is `cmd.exe` being launched by a watchlisted parent such as Office, a browser, a PDF reader,
    or a web server process?

    '
  context: 'This question is meant to surface exploit-driven or user-manipulated execution chains. Parent
    processes such as `WINWORD.EXE`, `EXCEL.EXE`, `chrome.exe`, `AcroRd32.exe`, or web server workers
    should not commonly spawn `cmd.exe`, and if they do, the event usually warrants investigation. Record
    parent path, signature, user, and the child command line so the analyst can determine whether the
    event looks like a macro, exploit, shell upload, or known administrative helper. References: [SigmaHQ
    Unusual Parent Process For Cmd.EXE](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_unusual_parent/)
    and [SigmaHQ Suspicious Microsoft Office Child Process](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_office_susp_child_processes/).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows workstations, particularly those used by non-technical staff or in departments outside
    of IT and software development.'
  range: Last 90 days.
  queries:
  - technology: SIEM rule pseudocode
    query: 'alert from process_events where child_image=''cmd.exe'' and parent_image in watchlist and
      (command_line has_any [''/c'',''/k''] or parent_image in webserver_list); output parent_image, parent_path,
      signature_status, user, command_line.

      '
- question: 'Is an unusual parent launching `cmd.exe` with scripting, download, or LOLBin tokens that
    suggest an exploit chain?

    '
  context: 'Pairing a suspicious parent with a suspicious shell payload yields a much stronger signal
    than either condition alone. Focus on browser, document, and viewer parents whose child command lines
    reference PowerShell, `certutil`, `mshta`, `regsvr32`, `rundll32`, or similar utilities. Also watch
    for `cmd.exe` spawning a second `cmd.exe` from those parents, because multi-stage child shells are
    a common execution bridge after user-driven exploitation. References: [Elastic Suspicious Windows
    Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/)
    and [MITRE CAR-2021-02-002: Get System Elevation](https://car.mitre.org/analytics/CAR-2021-02-002/).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows workstations, particularly those used by non-technical staff or in departments outside
    of IT and software development.'
  range: Last 90 days.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'suspicious_parent = parent_image in office_browser_viewer_list; suspicious_child = command_line
      has_any [''powershell'',''certutil'',''bitsadmin'', ''mshta'',''wscript'',''cscript'',''regsvr32'',''rundll32'',''msiexec''];
      alert when child=''cmd.exe'' and suspicious_parent and (suspicious_child or child_spawns_second_cmd=true).

      '
- question: 'Is the observed parent-child-command combination new or extremely rare for this host class?

    '
  context: 'Parent-child rarity modeling helps prioritize events that are technically allowed but operationally
    foreign. Maintain a 90-day history of `(parent image, child image, command category)` triples by host
    role and highlight first-seen or bottom percentile combinations. Also weigh signer information, because
    unsigned parents spawning `cmd.exe` on systems where nearly all such parents are signed is an important
    anomaly even when the parent name itself looks familiar. References: [ProblemChild: Discovering Anomalous
    Patterns based on Parent-Child Process Relationships](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows workstations, particularly those used by non-technical staff or in departments outside
    of IT and software development.'
  range: Last 90 days, using host-role segmentation.
  queries:
  - technology: SIEM baseline pseudocode
    query: 'triples = summarize(parent_image, child_image, command_category, signer_status) by host_role
      over 90d; alert when triple is unseen or frequency <= percentile(host_role,1) or signer_status=''unsigned''
      and signed_parent_rate>0.99.

      '
- question: 'Is a user-facing application spawning `cmd.exe` outside normal departmental hours or failing
    more often than expected?

    '
  context: 'Exploit chains and malicious user actions often happen at odd hours and fail noisily before
    succeeding. Profile Office-, browser-, and viewer-spawned shell activity by department and time-of-day,
    then elevate events that occur outside the usual operating window. Add exit-code or stderr failure
    monitoring because failed launches can be just as informative as successful ones when a user-facing
    application should rarely create shells in the first place. References: [Microsoft Sentinel Time Series
    Anomaly](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows workstations, particularly those used by non-technical staff or in departments outside
    of IT and software development.'
  range: Last 90 days, with 99th-percentile departmental hour baselines.
  queries:
  - technology: SIEM anomaly pseudocode
    query: 'app_spawned = cmd_events where parent_image in user_facing_apps; alert when hour_of_day outside
      dept_expected_hours or exit_code != 0 or host_historical_failures=0 and current_failure=true; output
      department, hour, exit_code, command_line.

      '
- question: 'Does a parent-child risk model score this `cmd.exe` launch as abnormal because of the parent
    process, signer, path, time, or child content?

    '
  context: 'A risk-scoring model helps unify several weak indicators into one defensible alert. Score
    each event using parent identity, path depth, signature state, child entropy, token content, user
    role, and time bucket, then expose the top SHAP drivers so the analyst sees why the launch is risky.
    This is particularly useful for borderline cases where the parent process is unusual but not strictly
    watchlisted. References: [ProblemChild framework](https://ar5iv.labs.arxiv.org/html/2008.04676) and
    [Malware classification using XGBoost](https://www.researchgate.net/publication/346773159_Malware_classification_using_XGboost-Gradient_Boosted_Decision_Tree);
    train on labeled events including [Atomic Red Team](https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.003/T1059.003.md)
    and [OTRF Security Datasets](https://github.com/UraSecTeam/mordor).'
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - 'NAI: All Windows workstations, particularly those used by non-technical staff or in departments outside
    of IT and software development.'
  range: Last 90 days for scoring and ongoing retraining.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = build_parent_child_features(parent_image,parent_path,parent_signed, signer_name,child_length,child_entropy,suspicious_token_count,user_role,time_bucket);
      score = xgboost.predict_proba(features); explain = shap_top3(features); alert when score >= p95_risk;
      output score, explain, parent, child_command_line.

      '
- question: 'Is `cmd.exe` directly tied to an unusual outbound external connection, either because the
    command line contains retrieval utilities or because no browser explains the traffic?

    '
  context: 'Process-to-network correlation is one of the strongest ways to validate that a shell is doing
    more than local administration. Join `cmd.exe` process creation to host network telemetry and Zeek
    flows, then flag external destinations not on an allowlist when the shell contains download utilities
    or there is no nearby browser connection to explain the same destination. This helps distinguish scripted
    staging, payload download, and C2 from routine user browsing. References: [Elastic Suspicious Windows
    Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., firewalls, proxies) and hosts generating network traffic (endpoints,
    servers).'
  range: Last 90 days, with near-real-time process-to-connection correlation.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'cmd = process_events where image=''cmd.exe''; net = join_sysmon3_or_5156(cmd); alert when
      net.dst_ip is_external and not allowlisted and (command_line has_any [''certutil'',''bitsadmin'',''curl'',''wget'',''Invoke-WebRequest'']
      or no_browser_conn_same_dst_within_1m=true).

      '
- question: 'Is `cmd.exe` contacting a newly observed domain for the host and also showing a high failure
    rate to that destination?

    '
  context: 'First-seen destinations deserve scrutiny on their own, but pairing them with repeated connection
    failure is especially valuable because beaconing and abandoned infrastructure often generate resets,
    timeouts, or NXDOMAINs. Review recent shell network activity against the host''s 30-day history and
    profile per-destination failure outcomes over 1-hour windows. This keeps failed C2 attempts in scope
    instead of filtering them away as noise. References: [CAR-2014-11-002: Outlier Parents of Cmd](https://car.mitre.org/analytics/CAR-2014-11-002/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., firewalls, proxies) and hosts generating network traffic (endpoints,
    servers).'
  range: Last 90 days, with 24-hour first-seen checks and 1-hour failure profiling.
  queries:
  - technology: SIEM statistics pseudocode
    query: 'shell_net = cmd_network_events joined with dns_history; fail_rate = summarize failures by
      host,destination,1h; alert when destination first_seen_for_host_24h=true and no_prior_conn_30d=true
      and fail_rate > 0.30.

      '
- question: 'Are `cmd.exe` connections reaching new or globally rare destination ASNs, or moving unusually
    large amounts of data to new infrastructure?

    '
  context: 'ASN novelty helps expose command-driven access to infrastructure that looks ordinary at the
    IP level but is still foreign to the host. Enrich Zeek connections with ASN and GeoIP context, compare
    the destination ASN to the host''s 30-day baseline, and prioritize new ASNs that are also infrequent
    enterprise-wide. Any high-volume transfer to new infrastructure should be reviewed even if the ASN
    is not rare, because the data movement itself is operationally significant. References: [ProblemChild
    parent-child anomaly scoring](https://ar5iv.labs.arxiv.org/html/2008.04676).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., firewalls, proxies) and hosts generating network traffic (endpoints,
    servers).'
  range: Last 90 days, with a 30-day ASN baseline.
  queries:
  - technology: SIEM enrichment pseudocode
    query: 'enrich shell_net with asn, geoip; baseline = destination_asns_by_host over 30d; alert when
      (asn new_for_host and asn_frequency <= percentile(global,5)) or bytes_transferred > 10MB to new_destination=true.

      '
- question: 'Has a host''s `cmd.exe` traffic volume or byte directionality become abnormal over the last
    day?

    '
  context: 'Shell-driven network abuse often changes both how much data moves and in which direction it
    moves. Track daily `orig_bytes + resp_bytes` for `cmd.exe`-linked connections and compare the totals
    to host baselines, then compute outbound-to- inbound ratios to separate probable exfiltration from
    oversized downloads. Either extreme can be important because command shells are not generally expected
    to carry large sustained data flows. References: [Anomaly Based Unknown Intrusion Detection in Endpoint
    Environments](https://www.mdpi.com/2079-9292/9/6/1022).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., firewalls, proxies) and hosts generating network traffic (endpoints,
    servers).'
  range: Last 90 days, with 24-hour volume comparisons.
  queries:
  - technology: SIEM statistics pseudocode
    query: 'vol = summarize shell_net by host,day with outbound_bytes,inbound_bytes,total_bytes; ratio
      = outbound_bytes / max(inbound_bytes,1); alert when total_bytes > percentile(host,95) or ratio >
      10 or ratio < 0.1; output host, totals, ratio, top_destinations.

      '
- question: 'Does a time-series model detect sustained or sudden increases in `cmd.exe`-linked outbound
    activity that exceed the host forecast?

    '
  context: 'Forecasting complements fixed thresholds by highlighting spikes relative to a host''s normal
    rhythm. Aggregate connection counts and outbound bytes into five-minute windows, model expected activity,
    and alert on sustained deviations above the confidence band. This is most useful for hosts whose shell
    traffic is usually low-volume but occasionally noisy enough that percentile-only thresholds lose sensitivity.
    References: [Microsoft Sentinel Time Series Anomaly for Process Executions](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Analytic%20Rules/TimeSeriesAnomaly-ProcessExecutions.yaml).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 3
  - Windows Event ID 4688
  - Windows Event ID 5156
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: Network egress points (e.g., firewalls, proxies) and hosts generating network traffic (endpoints,
    servers).'
  range: Last 90 days, with 14+ days of historical data and 5-minute scoring windows.
  queries:
  - technology: Time-series pseudocode
    query: 'series = aggregate shell_net by host,5m with conn_count,orig_bytes; forecast = prophet_or_sarima(series);
      alert when observed > upper_band for >=2 windows or residual > 3sigma for >30m; output observed,
      forecast, residuals, host.

      '
- question: 'Was a `.bat` or `.cmd` file created in a risky writable path and then executed by `cmd.exe`
    within five minutes?

    '
  context: 'Malware staging frequently writes a batch file into `%TEMP%`, `C:\Users\Public`, `C:\ProgramData`,
    or another writable directory and then executes it immediately. Correlate file creation to subsequent
    shell execution by path, user, and logon session so the analyst can see the writer process, the execution
    command line, and the creation-to-execution delay. This captures a concrete staging sequence instead
    of only a suspicious file or only a suspicious process. References: [SigmaHQ Command Line Execution
    with Suspicious URL and AppData Strings](https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_cmd_http_appdata/)
    and [Splunk Detect Prohibited Applications Spawning cmd.exe](https://research.splunk.com/endpoint/dcfd6b40-42f9-469d-a433-2e53f7486664/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User profile directories, temporary file locations, and public folders on endpoints and servers;
    Shared network drives.'
  range: Last 90 days, with file-create to execution correlation inside 5 minutes.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'writes = file_create where extension in [''.bat'',''.cmd''] and path in risky_dirs; execs
      = cmd_process where command_line references writes.path; alert when same_user_or_session and exec_ts
      between write_ts and write_ts+5m; output writer_process, file_path, exec_command, delta_seconds.

      '
- question: 'Is a batch file from a writable location invoking network-retrieval or credential access
    tooling?

    '
  context: 'A staged batch file becomes more dangerous when its contents or invocation line reference
    tools such as `certutil`, `bitsadmin`, `net use`, `procdump`, or `reg save`. Even if full batch contents
    are unavailable, the execution command line can still indicate likely credential access or remote
    staging. Analysts should preserve the file path, token hits, and creating process so they can decide
    whether the file is a legitimate deployment script or a malicious launcher. References: [Elastic Suspicious
    Windows Command Shell Arguments](https://detection.fyi/elastic/detection-rules/windows/execution_windows_cmd_shell_susp_args/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User profile directories, temporary file locations, and public folders on endpoints and servers;
    Shared network drives.'
  range: Last 90 days.
  queries:
  - technology: SIEM rule pseudocode
    query: 'batch_exec = cmd_process where referenced_file in writable_dirs; alert when batch_content_or_command_line
      has_any [''certutil'',''bitsadmin'',''net use'',''net view'',''mimikatz'',''procdump'',''reg save''];
      output file_path, token_hits, creator, executor, command_line.

      '
- question: 'Are recently created temporary batch files showing randomly generated names or very short
    execution latency?

    '
  context: 'Staged malware scripts often use high-entropy or minimal filenames and are executed almost
    immediately after creation. Compare filename entropy and filename structure against 90-day administrative-script
    baselines, then prioritize files whose create-to-execute latency is under five minutes. Short or non-alphabetic
    names can be useful secondary signals when entropy alone is inconclusive. References: [DOSfuscation
    character analysis](https://cloud.google.com/blog/topics/threat-intelligence/dosfuscation-exploring-obfuscation-and-detection-techniques/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User profile directories, temporary file locations, and public folders on endpoints and servers;
    Shared network drives.'
  range: Last 90 days, with a 90-day filename baseline.
  queries:
  - technology: SIEM statistics pseudocode
    query: 'temp_batches = new_batch_files in writable_dirs; metrics = calc_filename_entropy_and_latency(temp_batches);
      alert when entropy > percentile(history,95) and latency < 5m or filename_len < 4 or no_alpha_chars=true;
      output file_path, entropy, latency.

      '
- question: 'Has a host started executing temporary-directory batch files more often than its role normally
    allows, or cleaning them up almost immediately?

    '
  context: 'Most non-IT workstations rarely execute batch files from writable directories at all. Track
    weekly counts by host role and highlight machines above the 95th percentile or hosts with zero historical
    baseline that suddenly perform a temp batch execution. Add create-execute-delete chains under 60 seconds
    because fast cleanup is a common staging pattern and provides strong investigative context. References:
    [Anomaly Based Unknown Intrusion Detection in Endpoint Environments](https://www.mdpi.com/2079-9292/9/6/1022).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Windows Event ID 4663
  - 'NAI: User profile directories, temporary file locations, and public folders on endpoints and servers;
    Shared network drives.'
  range: Last 90 days, with weekly host-role baselines.
  queries:
  - technology: SIEM baseline pseudocode
    query: 'weekly = count temp_batch_exec by host,host_role,week; cleanup = correlate create_exec_delete
      within 60s; alert when weekly_count > percentile(host_role,95) or (historical_count=0 and weekly_count>=1)
      or cleanup=true.

      '
- question: 'Does a batch-execution risk model score this writable-path batch file as suspicious because
    of its path, name, timing, writer, or content?

    '
  context: 'A classifier helps combine weak staging indicators into one prioritized result. Score each
    writable-path batch file using path tokens, filename entropy and length, creation-to-execution delay,
    file size, writer category, prior directory history, and available content features such as obfuscation
    or credential-related tokens. Analysts should receive the top contributing features so they can validate
    whether the file resembles deployment automation or malicious staging. References: [Malware classification
    using XGBoost](https://www.researchgate.net/publication/346773159_Malware_classification_using_XGboost-Gradient_Boosted_Decision_Tree)
    and [DeepCASE: Semi-Supervised Contextual Analysis of Security Events](https://research.utwente.nl/en/publications/deepcase-semi-supervised-contextual-analysis-of-security-events/).'
  answer_sources:
  - Sysmon Event ID 1
  - Sysmon Event ID 11
  - Windows Event ID 4688
  - Windows Event ID 4663
