    Shared network drives.'
  range: Last 90 days for scoring and periodic retraining.
  queries:
  - technology: ML pipeline pseudocode
    query: 'features = batch_features(path_tokens,filename_entropy,filename_length, create_to_exec_latency,creator_category,file_size,dir_history,content_tokens);
      score = xgboost.predict_proba(features); explain = shap_top3(features); alert when score >= risk_threshold;
