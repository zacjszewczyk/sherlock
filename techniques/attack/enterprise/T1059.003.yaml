- question: 'Do `cmd.exe` executions align with malicious network destinations identified by threat intelligence
    when host, identity, process, and network context are reviewed together?

    '
  context: 'This question is a broader symbolic correlation problem rather than a single IOC hit. Join
    process, identity, and network telemetry around suspicious shell use and require corroborating conditions
    such as threat-intel destination matches, allowlist bypasses, and coherent event ordering before escalating.
    Analysts should inspect the full sequence, not just the final destination, to determine whether the
    command shell drove the connection or merely co-occurred with it.

    '
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days, focused on the event-centered correlation window.
  queries:
  - technology: SIEM correlation pseudocode
    query: 'seq = correlate host_identity_process_network around cmd_event; alert when intel_match=true
      and allowlisted=false and ordered_context valid; output entities, matched_conditions, event_sequence.

      '
- question: 'Are command-line length and entropy drifting away from established norms for this host, user,
    or peer group?

    '
  context: 'Some malicious shell behavior shows up as structural drift rather than explicit obfuscation.
    Build rolling baselines for command length, entropy, and other command shape features, then score
    percentile, z-score, and change-point deviations. The purpose is to identify persistent or compounding
    outliers that look unlike the user''s historical command behavior even when the exact text is new.

    '
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days, with rolling baselines and event-time comparisons.
  queries:
  - technology: SIEM baseline pseudocode
    query: 'features = summarize cmd_events by user,host with arg_length,entropy,token_count; deltas =
      compare_to_rolling_baseline(features); alert when percentile_outlier=true or zscore high or changepoint
      detected; output baseline_horizon, feature_deltas, composite_risk.

      '
- question: 'Is a user''s current `cmd.exe` activity meaningfully different from their usual command profile?

    '
  context: 'User-account profiling is valuable when the raw command text looks plausible but the actor
    is using the shell in a new way. Model each user''s shell frequency, timing, and magnitude patterns,
    then prioritize persistent deviations and compound anomalies rather than one-off spikes alone. This
    helps identify compromised users who suddenly begin issuing administrative or malware-like commands
    outside their normal behavior.

    '
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days, with rolling user baselines.
  queries:
  - technology: SIEM profiling pseudocode
    query: 'profile = build_user_cmd_profile(frequency,timing,magnitude); current = summarize current_user_cmd_activity(24h);
      alert when profile_deviation persistent=true and risk_score above threshold; output user, deltas,
      peer_context, sample_commands.

      '
- question: 'Do unsupervised clusters show a `cmd.exe` execution pattern that falls outside the environment''s
    normal command-shell behavior?

    '
  context: 'Clustering can surface rare combinations of process, timing, network, and command-line features
    without needing labeled training data. Normalize the relevant telemetry, score the event against learned
    clusters, and expose the dimensions that made it stand apart. Deterministic rules should remain active
    in parallel so analysts still receive a resilient floor even if the clustering model drifts.

    '
  answer_sources:
  - Sysmon Event ID 1
  - Windows Event ID 4688
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: All Windows Endpoints and Servers; DNS and Web Proxy logs; Threat Intelligence Platform feeds.'
  range: Last 90 days for feature extraction and clustering.
  queries:
  - technology: ML clustering pseudocode
    query: 'features = normalize_cmd_behavior(process,identity,network,command_line); cluster = anomaly_cluster_model.score(features);
      explain = top_feature_contributors(features); alert when cluster.is_outlier=true; output cluster_score,
