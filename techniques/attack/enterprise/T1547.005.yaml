name: 'T1547.005: Security Support Provider'
id: 561ed162-f596-4c59-9ab3-bf98c0d21db1
description: 'This playbook helps an analyst investigate whether an adversary is abusing Windows Security
  Support Providers (SSPs) to load malicious DLLs into the Local Security Authority (LSASS) process at
  boot, both to maintain persistence (TA0003) and to escalate privilege and harvest credentials (TA0004).
  Once loaded into LSASS, an SSP DLL can access encrypted and plaintext passwords, smart-card PINs, and
  domain credentials. The SSP configuration lives in two registry keys -- HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Security
  Packages and HKLM\SYSTEM\CurrentControlSet\Control\Lsa\OSConfig\Security Packages -- so this playbook
  hunts across several behavioral angles: registry writes that add a DLL not on the Microsoft built-in
  SSP allowlist; unsigned, rare, or non-System32 DLLs loaded into lsass.exe; anomalous outbound network
  connections initiated by lsass.exe (especially after a reboot); command-line and tooling artifacts of
  SSP abuse (e.g., Mimikatz misc::memssp, Install-SSP, AddSecurityPackage, reg add against Security Packages);
  SSP registry modifications traced back to non-administrative logon sessions; and anomalous SYSTEM-context
  process execution after a reboot that follows a suspicious SSP change. Detection methods combine symbolic-logic
  rules, statistical baselining, and machine-learning models applied to Windows Security events (4657,
  4688, 4624, 4625, 6005), Sysmon (Event IDs 1, 3, 7, 13), and Zeek conn.log, so the analyst can corroborate
  suspected SSP abuse against registry changes, LSASS module loads, network egress, command lineage, and
  session/privilege context.'
type: technique
