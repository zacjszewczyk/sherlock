questions:
- question: '[Persistence] SSP add allowlist enforcement: Can you determine whether a modification to
    the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Security Packages'' or ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\OSConfig\Security
    Packages'' registry keys adds a DLL name that is not on an established enterprise-wide allowlist of
    legitimate SSPs. -- specifically, using the ''SSP add allowlist enforcement'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses Windows Security
    Support Providers to run attacker DLLs inside the LSASS process at boot, gaining persistent, privileged
    access to credentials and the ability to survive reboots and credential changes. This evidence focuses
    on the condition that a modification to the ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Security Packages''
    or ''HKLM\SYSTEM\CurrentControlSet\Control\Lsa\OSConfig\Security Packages'' registry keys adds a DLL
    name that is not on an established enterprise-wide allowlist of legitimate SSPs. This Symbolic Logic
    approach looks for the following signal: Alert when Sysmon 13 / Windows 4657 writes to `...\Control\Lsa\Security
    Packages` or `...\Lsa\OSConfig\Security Packages` and the resulting value contains any DLL name NOT
    on the Microsoft built-in allowlist (kerberos, msv1_0, schannel, wdigest, tspkg, pku2u, negoexts,
    cloudAP) per [SSP Packages Provided by Microsoft](https://learn.microsoft.com/en-us/windows/win32/secauthn/ssp-packages-provided-by-microsoft)
    and the supported registration paths in [Restrictions around Registering a Security Package](https://learn.microsoft.com/en-us/windows/win32/secauthn/restrictions-around-registering-and-installing-a-security-package);
    this is the canonical rule from [Sigma SSP Added to LSA Configuration](https://detection.fyi/sigmahq/sigma/windows/registry/registry_event/registry_event_ssp_added_lsa_config/)
    and [Elastic Installation of Security Support Provider](https://www.elastic.co/guide/en/security/current/installation-of-security-support-provider.html).
    Exclude only signed installer writers (msiexec.exe) and known patch processes; do not delete the allowlist
    floor. A positive result -- a rule match, statistical outlier, or model alert -- suggests an SSP has
    been added or a malicious DLL is executing within LSASS in a way that deviates from sanctioned configuration
    and normal host behavior; pivot to the writing/loading process, its parent lineage, the originating
    logon session and SID, the specific DLL and its signer/path, the registry value written, and any subsequent
    LSASS network egress or SYSTEM-context child processes. A negative result helps rule out this SSP-abuse
    vector but should be corroborated with the other questions in this playbook, since a single method
    can miss stealthy, signed, or living-off-the-land techniques.'
  answer_sources: &id001
  - Windows Event ID 4657
  - Sysmon Event ID 13
  - 'NAI: Registry hives on all Windows endpoints, especially Domain Controllers and privileged access
    workstations.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "# SSP add allowlist enforcement\nsource IN [Windows Event ID 4657, Sysmon Event ID 13]\n|\
      \ WHERE matches_action_criteria(\"SSP add allowlist enforcement\")\n// Alert when Sysmon 13 / Windows\
      \ 4657 writes to `...\\Control\\Lsa\\Security Packages` or `...\\Lsa\\OSConfig\\Security Packages`\
      \ and the \n| ALERT enrich(host, user, process, parent, registry_value, image_loaded, dest)"
