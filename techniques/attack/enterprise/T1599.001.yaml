    on benign fused stun.log/conn.log features (source port, transaction-ID entropy, request frequency,
    duration, bytes), flag sessions with high anomaly scores as outliers, and surface the top-3 features
    that drove the isolation score in the alert. A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable NAT traversal / boundary bridging; pivot to the responsible internal
    host and process, the boundary device and the account/source that changed its configuration, the external
    peer and its reputation, and the volume, duration, and timing of the resulting flows to scope what
    segments were bridged and what data may have crossed. A negative result helps reduce confidence in
