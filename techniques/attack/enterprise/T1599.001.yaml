  answer_sources:
  - Zeek conn.log
  - Zeek stun.log
  - 'NAI: Internal Network Segments (e.g., Server VLANs, User Subnets)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FEATURES = fuse(stun, conn)[src_port, txn_id_entropy, req_freq, duration, bytes]

      MODEL = IsolationForest.fit(benign_sessions)

      score = MODEL.anomaly_score(session)

      ALERT WHEN score high WITH top3_contributing_features'
- question: '[Defense Impairment] Correlate unauthorized SSDP messages: With respect to the observation
    that an SSDP (UDP port 1900) M-SEARCH or NOTIFY message from an internal host not on the UPnP-authorized
    allowlist results in a new, externally-accessible port mapping. can you investigate this using the
    ''Correlate unauthorized SSDP messages'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: An SSDP
    (UDP port 1900) M-SEARCH or NOTIFY message from an internal host not on the UPnP-authorized allowlist
    results in a new, externally-accessible port mapping. Approach (Symbolic Logic): Trigger when Zeek
    ssdp.log observes an M-SEARCH or NOTIFY on UDP 1900 (or a PCP/NAT-PMP request on UDP 5351) from a
    host not on the UPnP/PCP allowlist and correlate with subsequent inbound connections from external
    IPs to the newly mapped port to confirm an unauthorized port mapping was created, per [RFC 6887](https://datatracker.ietf.org/doc/html/rfc6887)
    ([MITRE T1599.001](https://attack.mitre.org/techniques/T1599/001/)). A positive result -- a rule match,
    statistical outlier, or model alert -- indicates probable NAT traversal / boundary bridging; pivot
    to the responsible internal host and process, the boundary device and the account/source that changed
    its configuration, the external peer and its reputation, and the volume, duration, and timing of the
    resulting flows to scope what segments were bridged and what data may have crossed. A negative result
    helps reduce confidence in this specific vector but should be corroborated with the other questions
    in this playbook, since NAT traversal can be split across protocols, devices, and low-and-slow timing
    that any single method may miss.'
  answer_sources:
  - Zeek conn.log
  - Zeek notice.log
  - Zeek ssdp.log
  - 'NAI: Network Gateway Devices and Internal Host Subnets'
  range: 'Last 90 days (correlate events within their stated short windows: STUN-to-session <=5 min, hole-punching
    <=60 s, endpoint/egress join <=1 min)'
  queries:
  - technology: SIEM/Rule pseudocode
    query: "e1 = zeek_ssdp WHERE method IN ('M-SEARCH','NOTIFY') AND port==1900\n     OR pcp/nat-pmp request\
      \ ON udp 5351\n     AND src_host NOT IN upnp_pcp_allowlist\ne2 = zeek_conn inbound_from_external\
      \ TO newly_mapped_port\nALERT WHEN e1 FOLLOWED_BY e2 'Unauthorized port mapping created'"
