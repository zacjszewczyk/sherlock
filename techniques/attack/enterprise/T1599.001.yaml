  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: An add,
    modify, or delete of a NAT/PAT translation rule on a router or firewall is observed in network-device
    configuration-change or AAA command-accounting logs, and the resulting translation connects two network
    segments that policy designates as isolated (e.g., bridges an internal RFC1918 zone to an untrusted
    zone) or is made outside an approved change window. Approach (Statistical Method): Baseline each device''s
    daily count of NAT/PAT rule changes and total active translations, alert when changes exceed the device''s
    99th percentile over 30 days or the active-translation count steps to a new sustained level, and profile
    rejected/failed configuration commits as a distinct failure-mode signal ([Beehive](https://doi.org/10.1145/2523649.2523670)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable NAT traversal
    / boundary bridging; pivot to the responsible internal host and process, the boundary device and the
    account/source that changed its configuration, the external peer and its reputation, and the volume,
    duration, and timing of the resulting flows to scope what segments were bridged and what data may
    have crossed. A negative result helps reduce confidence in this specific vector but should be corroborated
    with the other questions in this playbook, since NAT traversal can be split across protocols, devices,
    and low-and-slow timing that any single method may miss.'
  answer_sources:
  - networkdevice:config (NAT table modification)
  - AAA/TACACS+ command accounting
  - NSM:Flow
  - 'NAI: Network Boundary Devices (Routers, Firewalls)'
  range: 'Last 90 days (correlate events within their stated short windows: STUN-to-session <=5 min, hole-punching
    <=60 s, endpoint/egress join <=1 min)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: "PER device DAILY\nchanges = COUNT(nat_pat_rule_changes); active = COUNT(active_translations)\n\
      failed = COUNT(rejected_config_commits)\nALERT WHEN changes > P99(device,30d)\n  OR active steps\
      \ to new sustained level OR failed profiled"
