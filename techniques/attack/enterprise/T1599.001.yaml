- question: '[Defense Impairment] Correlate STUN/TURN to long sessions: With respect to the observation
    that a temporal correlation is observed between STUN/TURN protocol usage from an internal host and
    a subsequent, long-duration (>1 hour) UDP or TCP connection between the same internal host and a new,
    non-CDN external IP address. can you investigate this using the ''Correlate STUN/TURN to long sessions''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: A temporal
    correlation is observed between STUN/TURN protocol usage from an internal host and a subsequent, long-duration
    (>1 hour) UDP or TCP connection between the same internal host and a new, non-CDN external IP address.
    Approach (Symbolic Logic): Identify hosts using STUN/TURN via stun.log ([RFC 8489](https://datatracker.ietf.org/doc/html/rfc8489))
    and alert when the same host then initiates a long-duration (>1 hour) TCP/UDP connection to a new
    external IP not recognized as a CDN or approved STUN/TURN server, using tunable long-connection thresholds
    ([RITA](https://github.com/activecm/rita)). A positive result -- a rule match, statistical outlier,
    or model alert -- indicates probable NAT traversal / boundary bridging; pivot to the responsible internal
