questions:
- question: '[Defense Impairment] Rule for malicious NAT traversal destinations: With respect to the observation
    that a network connection is established from an internal host to an external IP address and port
    combination that is present on a threat intelligence feed and categorized as a malicious STUN, TURN,
    or NAT traversal service. can you investigate this using the ''Rule for malicious NAT traversal destinations''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: A network
    connection is established from an internal host to an external IP address and port combination that
    is present on a threat intelligence feed and categorized as a malicious STUN, TURN, or NAT traversal
    service. Approach (Symbolic Logic): Query Zeek conn.log and Windows Event ID 5156 for destination
    IPs present on a ''NAT-Traversal'' or ''Malicious Infrastructure'' feed, prioritizing STUN/TURN service
    ports 3478 and 5349 (TLS/DTLS) defined in [RFC 8489](https://datatracker.ietf.org/doc/html/rfc8489),
    and alert on any match to highlight potentially relayed/tunneled traffic bridging the boundary ([MITRE
    T1599.001](https://attack.mitre.org/techniques/T1599/001/)). A positive result -- a rule match, statistical
    outlier, or model alert -- indicates probable NAT traversal / boundary bridging; pivot to the responsible
    internal host and process, the boundary device and the account/source that changed its configuration,
    the external peer and its reputation, and the volume, duration, and timing of the resulting flows
    to scope what segments were bridged and what data may have crossed. A negative result helps reduce
    confidence in this specific vector but should be corroborated with the other questions in this playbook,
    since NAT traversal can be split across protocols, devices, and low-and-slow timing that any single
    method may miss.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Firewalls, Routers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "LOAD ti_feed = feeds[category in ('NAT-Traversal','Malicious Infrastructure')]\nFROM zeek_conn,\
      \ win_5156\nWHERE dest_ip IN ti_feed\n  AND (dest_port IN (3478,5349) OR proto IN ('udp','tcp'))\n\
      ALERT 'Connection to malicious NAT-traversal/STUN-TURN destination'\n  ENRICH src_host, dest_ip,\
      \ dest_port, ti_category"
- question: '[Defense Impairment] Flag hosts with elevated malicious NAT ratios: With respect to the observation
    that a network connection is established from an internal host to an external IP address and port
    combination that is present on a threat intelligence feed and categorized as a malicious STUN, TURN,
    or NAT traversal service. can you investigate this using the ''Flag hosts with elevated malicious
    NAT ratios'' (Statistical Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: A network
    connection is established from an internal host to an external IP address and port combination that
    is present on a threat intelligence feed and categorized as a malicious STUN, TURN, or NAT traversal
    service. Approach (Statistical Method): For each host compute a 24-hour rolling ratio of connections
    to malicious NAT-traversal IPs versus total external connections, compare it to peer-group baselines,
    and alert when it exceeds the 95th percentile for its grouping; separately profile the count of blocked/failed
    connections to those IPs as a distinct failure-mode signal (peer-group statistical mining per [Beehive](https://doi.org/10.1145/2523649.2523670)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable NAT traversal
    / boundary bridging; pivot to the responsible internal host and process, the boundary device and the
    account/source that changed its configuration, the external peer and its reputation, and the volume,
    duration, and timing of the resulting flows to scope what segments were bridged and what data may
    have crossed. A negative result helps reduce confidence in this specific vector but should be corroborated
    with the other questions in this playbook, since NAT traversal can be split across protocols, devices,
    and low-and-slow timing that any single method may miss.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Firewalls, Routers)'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_conn, win_5156 OVER rolling_window=24h PER src_host

      mal = COUNT(dest_ip IN nat_traversal_feed)

      tot = COUNT(external_conn)

      ratio = mal / tot

      failed = COUNT(dest_ip IN feed AND conn_state IN (''REJ'',''S0''))

      BASELINE ratio BY peer_group

      ALERT WHEN ratio > P95(peer_group) OR failed spikes'
- question: '[Defense Impairment] Classify NAT traversal attempts: With respect to the observation that
    a network connection is established from an internal host to an external IP address and port combination
    that is present on a threat intelligence feed and categorized as a malicious STUN, TURN, or NAT traversal
    service. can you investigate this using the ''Classify NAT traversal attempts'' (Machine Learning)
    approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: A network
    connection is established from an internal host to an external IP address and port combination that
    is present on a threat intelligence feed and categorized as a malicious STUN, TURN, or NAT traversal
    service. Approach (Machine Learning): Train a Random Forest on Zeek conn.log and Windows Event ID
    5156 features (dest port, protocol, byte volume, duration, packets/sec) using port-/payload-agnostic
    single-flow temporal features ([Koumar et al.](https://dl.acm.org/doi/abs/10.5555/3581644.3581681))
    enriched with threat-intelligence labels, score new connections, alert when malicious-NAT-traversal
    probability crosses a tuned threshold, and include the top-3 contributing features in the alert text.
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable NAT traversal
    / boundary bridging; pivot to the responsible internal host and process, the boundary device and the
    account/source that changed its configuration, the external peer and its reputation, and the volume,
    duration, and timing of the resulting flows to scope what segments were bridged and what data may
    have crossed. A negative result helps reduce confidence in this specific vector but should be corroborated
    with the other questions in this playbook, since NAT traversal can be split across protocols, devices,
    and low-and-slow timing that any single method may miss.'
  answer_sources:
  - Zeek conn.log
  - Windows Event ID 5156
  - 'NAI: Network Egress Points (e.g., Firewalls, Routers)'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: 'FEATURES = [dest_port, proto, orig_bytes+resp_bytes, duration, pkts_per_sec]

      LABELS from ti_feed (malicious-nat / benign)

      MODEL = RandomForest.fit(train_flows)

      p = MODEL.predict_proba(new_flow)

      ALERT WHEN p > tuned_threshold WITH top3_feature_importances'
- question: '[Defense Impairment] Detect unauthorized STUN magic cookie use: With respect to the observation
    that the presence of STUN protocol messages, identified by the magic cookie 0x2112A442 in the UDP
    payload, is observed in network traffic originating from assets not authorized for WebRTC or VoIP
    services, such as database servers. can you investigate this using the ''Detect unauthorized STUN
    magic cookie use'' (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: The
    presence of STUN protocol messages, identified by the magic cookie 0x2112A442 in the UDP payload,
    is observed in network traffic originating from assets not authorized for WebRTC or VoIP services,
    such as database servers. Approach (Symbolic Logic): Inspect Zeek stun.log (or UDP/TCP payloads) for
    the fixed STUN magic cookie 0x2112A442 in the message header, per [RFC 8489](https://datatracker.ietf.org/doc/html/rfc8489),
    and alert when an unauthorized asset (e.g., database server or restricted subnet) emits a STUN binding
    request, indicating NAT-mapping discovery from a host with no WebRTC/VoIP role ([MITRE T1599.001](https://attack.mitre.org/techniques/T1599/001/)).
    A positive result -- a rule match, statistical outlier, or model alert -- indicates probable NAT traversal
    / boundary bridging; pivot to the responsible internal host and process, the boundary device and the
    account/source that changed its configuration, the external peer and its reputation, and the volume,
    duration, and timing of the resulting flows to scope what segments were bridged and what data may
    have crossed. A negative result helps reduce confidence in this specific vector but should be corroborated
    with the other questions in this playbook, since NAT traversal can be split across protocols, devices,
    and low-and-slow timing that any single method may miss.'
  answer_sources:
  - Zeek conn.log
  - Zeek stun.log
  - 'NAI: Internal Network Segments (e.g., Server VLANs, User Subnets)'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: "FROM zeek_stun OR udp/tcp_payload\nWHERE payload_header_magic_cookie == 0x2112A442\n  AND\
      \ msg_type == 'BindingRequest'\n  AND src_host NOT IN webrtc_voip_allowlist\nALERT 'Unauthorized\
      \ STUN NAT-discovery from non-VoIP asset'"
- question: '[Defense Impairment] Alert on STUN rate spikes: With respect to the observation that the
    presence of STUN protocol messages, identified by the magic cookie 0x2112A442 in the UDP payload,
    is observed in network traffic originating from assets not authorized for WebRTC or VoIP services,
    such as database servers. can you investigate this using the ''Alert on STUN rate spikes'' (Statistical
    Method) approach?'
  context: 'Why this matters: Under the Defense Impairment tactic (TA0112), the information requirement
    is: Is the adversary using network address translation traversal to evade defenses and access restricted
    network segments? (PIR) An adversary who controls a network boundary device (router/firewall) can
    alter NAT/PAT configuration or abuse NAT-traversal protocols (STUN/TURN, UPnP/SSDP, PCP/NAT-PMP, UDP
    hole punching) to bridge otherwise-isolated trusted and untrusted networks, reach protected systems,
    or obscure the true source/path of traffic so monitoring is harder. This evidence centers on: The
    presence of STUN protocol messages, identified by the magic cookie 0x2112A442 in the UDP payload,
    is observed in network traffic originating from assets not authorized for WebRTC or VoIP services,
    such as database servers. Approach (Statistical Method): For each host compute the 1-hour moving average
    and standard deviation of STUN message counts from stun.log and signal when activity exceeds 3 standard
    deviations (Z-score > 3) above the moving average; baseline per peer group so normal VoIP/WebRTC hosts
    are not flagged ([Beehive](https://doi.org/10.1145/2523649.2523670)). A positive result -- a rule
    match, statistical outlier, or model alert -- indicates probable NAT traversal / boundary bridging;
    pivot to the responsible internal host and process, the boundary device and the account/source that
    changed its configuration, the external peer and its reputation, and the volume, duration, and timing
    of the resulting flows to scope what segments were bridged and what data may have crossed. A negative
    result helps reduce confidence in this specific vector but should be corroborated with the other questions
    in this playbook, since NAT traversal can be split across protocols, devices, and low-and-slow timing
    that any single method may miss.'
  answer_sources:
  - Zeek conn.log
  - Zeek stun.log
  - 'NAI: Internal Network Segments (e.g., Server VLANs, User Subnets)'
  range: 'Last 90 days (correlate events within their stated short windows: STUN-to-session <=5 min, hole-punching
    <=60 s, endpoint/egress join <=1 min)'
  queries:
  - technology: SIEM/Stats pseudocode
    query: 'FROM zeek_stun PER src_host OVER window=1h

      mu = MOVING_AVG(stun_count); sd = MOVING_STD(stun_count)

      z = (stun_count - mu) / sd

      BASELINE BY peer_group

      ALERT WHEN z > 3 AND host NOT normal_voip_peer'
- question: '[Defense Impairment] Isolate anomalous STUN sessions: With respect to the observation that
    the presence of STUN protocol messages, identified by the magic cookie 0x2112A442 in the UDP payload,
    is observed in network traffic originating from assets not authorized for WebRTC or VoIP services,
    such as database servers. can you investigate this using the ''Isolate anomalous STUN sessions'' (Machine
    Learning) approach?'
