name: 'T1599.001: Network Boundary Bridging: Network Address Translation Traversal'
id: 026d62fd-5b15-4b6a-9a10-430a8fd2300f
description: 'This playbook helps an analyst investigate whether an adversary is bridging network boundaries
  by abusing Network Address Translation traversal (MITRE ATT&CK T1599.001, Network Boundary Bridging:
  Network Address Translation Traversal). By gaining control of a boundary device or by abusing NAT-traversal
  protocols, an adversary can route traffic between segments that policy designates as isolated, reach
  protected systems behind a border device, or obscure the true source and path of their traffic to frustrate
  monitoring. The hunt spans network-device configuration and AAA command-accounting logs, network security
  monitoring (Zeek conn/stun/ssdp/notice logs, NSM flow), and endpoint network-connection telemetry (Windows
  Event ID 5156), pursuing the behavior from several complementary angles: connections to threat-intel-listed
  malicious NAT-traversal/STUN/TURN infrastructure; unauthorized STUN magic-cookie (0x2112A442) NAT-mapping
  discovery from assets with no WebRTC/VoIP role; unauthorized UPnP/SSDP/PCP/NAT-PMP port mappings; STUN/TURN
  usage followed by long-duration sessions to new non-CDN external IPs; endpoint-observed external connections
  that never appear at the designated egress (routing/NAT policy violations); UDP hole-punching port bursts;
  and out-of-policy NAT/PAT rule changes that bridge isolated zones or occur outside approved change windows.
  Detection methods combine deterministic symbolic-logic rules (threat-intel watchlists, protocol/magic-cookie
  inspection, allowlist correlation, reachability/isolation invariant checks via VeriFlow/Header Space
  Analysis, endpoint-to-egress joins), statistical baselining (peer-group ratio mining, Z-score and moving-average
  spikes, port entropy, percentile thresholds, perimeter-coverage and failure-mode profiling), and machine
  learning (Random Forest, Isolation Forest, One-Class SVM, DBSCAN, ARIMA/online autoencoder forecasting,
  learned egress-path and LSTM/DeepLog config-sequence models), so the analyst can corroborate suspected
  NAT traversal across configuration changes, network flows, protocol artifacts, and endpoint-versus-perimeter
  telemetry.'
type: technique
related:
- tactic_id: TA0112
  tactic_name: Defense Impairment
