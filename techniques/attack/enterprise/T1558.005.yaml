- question: '[Credential Access] Apply an unsupervised clustering algorithm like DBSCAN or HDBSCAN to
    authentication data (Windows Event ID -- using the ''Machine Learning'' approach. Specifically: can
    you determine whether a Kerberos service ticket request (Windows Event ID 4769) or subsequent logon
    (Windows Event ID 4624) occurs from a source IP, to a destination service, or at a time that is anomalous
    for the associated user account, suggesting a stolen ticket is being used.'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), adversaries steal or misuse
    Kerberos credential cache (ccache) files -- which hold active TGTs and service tickets -- to authenticate
    as another user without their password, enabling Pass-the-Ticket, privilege escalation, and lateral
    movement (including converting Linux/macOS ccache material to Windows .kirbi). This evidence focuses
    on the condition: A Kerberos service ticket request (Windows Event ID 4769) or subsequent logon (Windows
    Event ID 4624) occurs from a source IP, to a destination service, or at a time that is anomalous for
    the associated user account, suggesting a stolen ticket is being used. The Machine Learning approach
    works as follows: Treat ticket reuse as anomalous-edge detection on the authentication graph. Score
    first-time (user, destination/SPN) edges and credential switches with rarity-based path scoring ([Hopper:
    Modeling and Detecting Lateral Movement](https://www.usenix.org/system/files/sec21-ho.pdf)), node2vec
    + logistic-regression link prediction with link-level explanations ([Detecting Lateral Movement in
    Enterprise Computer Networks with Unsupervised Graph AI](https://www2.seas.gwu.edu/~howie/publications/CyberGraph-RAID20.pdf)),
    or GNN+recurrent temporal link prediction over graph snapshots ([Euler](https://dev.ndss-symposium.org/wp-content/uploads/2022-107A-paper.pdf));
    train/validate on labeled enterprise auth data ([LANL Cyber-Security Events](https://csr.lanl.gov/data/cyber1/)).
    Alternatively cluster (HDBSCAN) over user/source-IP(GeoIP,ASN)/SPN/cyclical-time features and treat
    noise points as anomalous logons. A positive result indicates probable theft, staging, conversion,
    or replay of Kerberos ticket material -- pivot to the responsible process and its parent lineage,
    the owning versus acting user, the targeted ccache (path or API:{uuid}), the destination of any transfer,
    and any follow-on Kerberos authentication or logon on that session. A negative result helps rule out
    this specific vector but should be corroborated with the other questions in this playbook, since a
    single method can miss stealthy, living-off-the-land, or in-memory ccache abuse.'
