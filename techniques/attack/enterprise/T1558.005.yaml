questions:
- question: '[Credential Access] Audit non-owner reads of ccache files via auditd watch -- using the ''Symbolic
    Logic'' approach. Specifically: can you determine whether on Linux/macOS, a Kerberos credential cache
    is read, copied, modified, or exported by a process that is not the owning user (acting auid/uid !=
    cache owner) or is not a standard Kerberos/SSSD component. Covers FILE caches (/tmp/krb5cc_%UID%,
    krb5.ccache), DIR/KEYRING/KCM caches, the macOS in-memory API:{uuid} cache, and setting/relocating
    KRB5CCNAME.'
  context: 'Why this matters: Under the Credential Access tactic (TA0006), adversaries steal or misuse
    Kerberos credential cache (ccache) files -- which hold active TGTs and service tickets -- to authenticate
    as another user without their password, enabling Pass-the-Ticket, privilege escalation, and lateral
    movement (including converting Linux/macOS ccache material to Windows .kirbi). This evidence focuses
    on the condition: On Linux/macOS, a Kerberos credential cache is read, copied, modified, or exported
    by a process that is not the owning user (acting auid/uid != cache owner) or is not a standard Kerberos/SSSD
    component. Covers FILE caches (/tmp/krb5cc_%UID%, krb5.ccache), DIR/KEYRING/KCM caches, the macOS
    in-memory API:{uuid} cache, and setting/relocating KRB5CCNAME. The Symbolic Logic approach works as
    follows: Configure Linux audit watches on the cache namespace (`auditctl -w /tmp -p rwa -k krb5ccache`)
    and syscall rules on open/openat for paths matching `krb5cc_*`, `krb5.ccache`, the directories named
    by `default_ccache_name` in `/etc/krb5.conf`, and `/etc/krb5.conf` itself ([auditctl(8)](https://man7.org/linux/man-pages/man8/auditctl.8.html),
    [MIT Kerberos Credential Cache](https://web.mit.edu/kerberos/krb5-latest/doc/basic/ccache_def.html)).
    Alert when the audit record''s `auid`/`uid` differs from the file owner''s UID embedded in `krb5cc_%UID%`,
    or when `exe=` is not on an allowlist of Kerberos/SSSD components (kinit, klist, sssd, sssd_kcm, gssproxy,
    sshd) ([Linux Audit Documentation](https://github.com/linux-audit/audit-documentation/wiki/SPEC-Audit-Event-Enrichment)).
    Additionally alert on `cp`/`tar`/`base64`/scp of any krb5cc path and on conversion tooling (impacket,
    Kekeo) per known Linux red-team tradecraft ([Kerberos Tickets on Linux Red Teams](https://www.binarydefense.com/resources/blog/kerberos-tickets-on-linux-red-teams/)).
    A positive result indicates probable theft, staging, conversion, or replay of Kerberos ticket material
    -- pivot to the responsible process and its parent lineage, the owning versus acting user, the targeted
    ccache (path or API:{uuid}), the destination of any transfer, and any follow-on Kerberos authentication
    or logon on that session. A negative result helps rule out this specific vector but should be corroborated
    with the other questions in this playbook, since a single method can miss stealthy, living-off-the-land,
    or in-memory ccache abuse.'
  answer_sources:
  - Linux auditd logs
  - osquery file_events
  - macos:unifiedlog
  - macos:endpointsecurity
  - 'NAI: Linux servers and developer workstations realm-joined via SSSD, bastion/jump hosts, macOS endpoints
    with Kerberos SSO, /tmp and custom KRB5CCNAME directories'
  range: Last 90 days
  queries:
  - technology: auditd/pseudocode
    query: "WATCH /tmp -p rwa -k krb5ccache AND syscall open|openat path=~/krb5cc_*|krb5.ccache|/etc/krb5.conf\n\
      FROM auditd:SYSCALL WHERE key='krb5ccache'\nLET owner_uid = parse_uid(path /krb5cc_(%UID%)/)\nALERT\
      \ IF auid != owner_uid OR uid != owner_uid\n      OR exe NOT IN allowlist[kinit,klist,sssd,sssd_kcm,gssproxy,sshd]\n\
      \      OR exe IN [cp,tar,base64,scp,impacket,kekeo]"
