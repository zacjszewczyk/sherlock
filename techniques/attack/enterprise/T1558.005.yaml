name: 'T1558.005: Ccache Files'
id: 70ab0acf-a6bb-4e56-adc7-a74a8b46ac12
description: 'This playbook helps an analyst investigate whether an adversary is stealing or misusing
  Kerberos credential cache (ccache) files to gain credential access on Linux and macOS, and to detect
  downstream reuse of that stolen ticket material on Windows Active Directory infrastructure. Ccache files
  hold a user''s active Kerberos session tickets (the TGT and service tickets) so services can be accessed
  without re-entering a password; on Linux they live as FILE caches such as /tmp/krb5cc_%UID% or krb5.ccache
  (and as DIR/KEYRING/KCM caches) governed by /etc/krb5.conf and the KRB5CCNAME environment variable,
  while on macOS they default to an in-memory API:{uuid} cache. An adversary who reads, copies, modifies,
  or exports another user''s ccache can perform Pass-the-Ticket, impersonate privileged users, and pivot
  laterally -- often converting Linux/macOS ccache material into Windows .kirbi format with tooling such
  as Kekeo, Rubeus, Mimikatz ports, or impacket. The playbook guides the analyst across several complementary
  angles: auditing non-owner and non-standard process reads of ccache files via auditd watches and osquery
  FIM; monitoring macOS Endpoint Security / unified logs for non-standard processes that link the GSS/Heimdal
  Kerberos framework (the Bifrost technique); baselining the processes and volume of ccache access; hunting
  process command lines and argv for ccache/ticket manipulation keywords and base64-encoded ticket blobs;
  detecting anomalous network transfer of files matching ccache naming conventions across Zeek files/ftp/smb
  logs; correlating suspicious Windows NewCredentials (Logon Type 9) logons and credential-tool process
  creation with follow-on Kerberos activity (4768/4769/4672); stateful and N-gram sequence detection over
  klist/kinit -> compression/encoding -> outbound transfer chains; and profiling Kerberos service-ticket
  requests (4769 / Zeek kerberos.log) for stolen-ticket misuse such as TGS-REQ without a preceding TGT,
  RC4 downgrade in an AES domain, excessive ticket lifetimes, and anomalous source/SPN/time. Detection
  methods combine symbolic-logic rules, statistical baselining, and machine-learning models (sequence/LSTM,
  isolation forest/VAE, and graph anomaly detection) applied to Linux auditd, osquery file_events, macOS
  unified logs and Endpoint Security, Windows Security events, and Zeek network logs, supporting the Credential
  Access tactic.'
type: technique
