    a local account gives durable, credentialed access that persists across reboots and credential changes
    without leaving obvious remote-access tooling behind. Evidence under investigation: A Windows Event
    ID 4720 (User Account Created) is immediately followed, within a 60-second window on the same host,
    by a Windows Event ID 4732 (A member was added to a security-enabled local group). The `TargetUserName`
    in event 4720 matches the `MemberName` in event 4732, and the `GroupName` in event 4732 corresponds
    to a privileged group (e.g., ''Administrators'', ''Remote Desktop Users''). Approach (Privileged group
    correlation): Trigger when Event 4720 and 4732 for the same TargetUserName occur on one host within
    60 seconds and GroupName is privileged (Administrators, Remote Desktop Users, Power Users, Backup
    Operators), including host/creator context in the alert, matching [Elastic Security Detection Rules](https://github.com/elastic/detection-rules)
    privileged-group-change logic. A positive result means the account-creation activity matches a known-malicious
    or anomalous pattern (unauthorized creator, off-hours scripted creation, immediate privilege escalation,
    remote first logon, reconnaissance, or anomalous post-creation egress) and warrants escalation; a
    negative result means the activity is consistent with sanctioned administration or configuration management.
    Investigate the named area of interest (Domain Controllers, Member Servers, Privileged Access Workstations)
    and pivot from any hit to the responsible creator account/process, the new account, any privileged-group
    additions, and downstream logon or network behavior tied to persistence.'
  answer_sources:
  - Windows Event ID 4720
  - Windows Event ID 4732
  - 'NAI: Domain Controllers, Member Servers, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// 4720 -> 4732 privileged group within 60s

      JOIN 4720 e1, 4732 e2 ON host, e1.TargetUserName==e2.MemberName

      WHERE e2.ts - e1.ts <= 60s

      AND e2.GroupName IN [''Administrators'',''Remote Desktop Users'',''Power Users'',''Backup Operators'']

      ALERT ; EMIT host, creator, account, group'
