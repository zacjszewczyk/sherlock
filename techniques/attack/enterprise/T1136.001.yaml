questions:
- question: 'Using deterministic rule logic, can you determine whether ''Creator allowlist + intel correlation''
    reveals adversary creation of a local account for persistence on the persistence pathway? Specifically:
    Filter Windows Event ID 4720 (AccountType==User) and leftanti-join the SubjectUserName/SubjectDomainName
    against an allowlist of authorized account-creators, alerting on any unauthorized creator, per the
    production [Azure Sentinel: User Created by Unauthorized User](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Hunting%20Queries/UserCreatedByUnauthorizedUser.yaml)
    KQL pattern and cross-platform rules in [Elastic Security Detection Rules](https://github.com/elastic/detection-rules).
    Then join the host''s Zeek conn.log/dns.log over the preceding 24h and raise severity when the host
    communicated with a high-confidence malicious destination before the creation event; enrich with the
    responsible creator account.'
  context: 'Tactic context (Persistence): the adversary is trying to maintain their foothold, and creating
    a local account gives durable, credentialed access that persists across reboots and credential changes
    without leaving obvious remote-access tooling behind. Evidence under investigation: A Windows Event
    ID 4720 (User Account Created) is observed on a host, and within the preceding 24 hours the same host
    shows rare outbound DNS or connection activity that suggests the newly created account is part of
    staging or persistence rather than routine administration. Approach (Creator allowlist + intel correlation):
    Filter Windows Event ID 4720 (AccountType==User) and leftanti-join the SubjectUserName/SubjectDomainName
    against an allowlist of authorized account-creators, alerting on any unauthorized creator, per the
    production [Azure Sentinel: User Created by Unauthorized User](https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Security%20Events/Hunting%20Queries/UserCreatedByUnauthorizedUser.yaml)
    KQL pattern and cross-platform rules in [Elastic Security Detection Rules](https://github.com/elastic/detection-rules).
    Then join the host''s Zeek conn.log/dns.log over the preceding 24h and raise severity when the host
    communicated with a high-confidence malicious destination before the creation event; enrich with the
    responsible creator account. A positive result means the account-creation activity matches a known-malicious
    or anomalous pattern (unauthorized creator, off-hours scripted creation, immediate privilege escalation,
    remote first logon, reconnaissance, or anomalous post-creation egress) and warrants escalation; a
    negative result means the activity is consistent with sanctioned administration or configuration management.
    Investigate the named area of interest (User Workstations, Member Servers, Internet Gateway, DNS Resolvers)
    and pivot from any hit to the responsible creator account/process, the new account, any privileged-group
    additions, and downstream logon or network behavior tied to persistence.'
  answer_sources:
  - Windows Event ID 4720
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Member Servers, Internet Gateway, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Unauthorized creator + threat-intel correlation

      FILTER WinEventLog:Security WHERE EventCode==4720 AND AccountType=="User"

      LEFTANTI JOIN authorized_creators ON SubjectUserName, SubjectDomainName

      JOIN zeek_conn, zeek_dns ON host WHERE conn.ts BETWEEN 4720.ts-24h AND 4720.ts

      RAISE severity WHEN dest IN threat_intel_ioc

      EMIT host, new_account=TargetUserName, creator=SubjectUserName, matched_ioc'
