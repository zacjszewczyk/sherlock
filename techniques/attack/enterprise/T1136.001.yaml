  answer_sources:
  - Windows Event ID 4720
  - Zeek conn.log
  - Zeek dns.log
  - 'NAI: User Workstations, Member Servers, Internet Gateway, DNS Resolvers'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: '// Per-host creation-rate baseline + change-point

      baseline = ROLLING_30d count(4720) PER host, peer_group

