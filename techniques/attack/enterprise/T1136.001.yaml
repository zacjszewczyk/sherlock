- question: 'Using deterministic rule logic, can you determine whether ''Privileged group correlation''
    reveals adversary creation of a local account for persistence on the persistence pathway? Specifically:
    Trigger when Event 4720 and 4732 for the same TargetUserName occur on one host within 60 seconds and
    GroupName is privileged (Administrators, Remote Desktop Users, Power Users, Backup Operators), including
    host/creator context in the alert, matching [Elastic Security Detection Rules](https://github.com/elastic/detection-rules)
    privileged-group-change logic.'
