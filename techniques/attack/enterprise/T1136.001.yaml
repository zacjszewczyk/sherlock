- question: 'Using deterministic rule logic, can you determine whether ''Local admin combo detection''
    reveals adversary creation of a local account for persistence on the persistence pathway? Specifically:
    Apply a regex like `/(?=.*net(1)?\.exe\s+user\s+.*\/add)(?=.*net(1)?\.exe\s+localgroup\s+(Administrators|Remote
    Desktop Users)\s+.*\/add)/i` to the CommandLine of Event ID 4688 (and 4720+4732 correlation) and alert
    when account creation and privileged group addition appear in one process invocation, consistent with
    rules in [Elastic Security Detection Rules](https://github.com/elastic/detection-rules).'
  context: 'Tactic context (Persistence): the adversary is trying to maintain their foothold, and creating
    a local account gives durable, credentialed access that persists across reboots and credential changes
    without leaving obvious remote-access tooling behind. Evidence under investigation: A single command-line
    execution, captured in a Windows Event ID 4688, contains substrings for both local user creation (`net
    user ... /add`) and the addition of that user to a privileged local group (`net localgroup Administrators
    ... /add`), often chained with ''&&''. Approach (Local admin combo detection): Apply a regex like
    `/(?=.*net(1)?\.exe\s+user\s+.*\/add)(?=.*net(1)?\.exe\s+localgroup\s+(Administrators|Remote Desktop
    Users)\s+.*\/add)/i` to the CommandLine of Event ID 4688 (and 4720+4732 correlation) and alert when
    account creation and privileged group addition appear in one process invocation, consistent with rules
    in [Elastic Security Detection Rules](https://github.com/elastic/detection-rules). A positive result
    means the account-creation activity matches a known-malicious or anomalous pattern (unauthorized creator,
    off-hours scripted creation, immediate privilege escalation, remote first logon, reconnaissance, or
    anomalous post-creation egress) and warrants escalation; a negative result means the activity is consistent
    with sanctioned administration or configuration management. Investigate the named area of interest
    (Domain Controllers, Member Servers, User Workstations, Privileged Access Workstations) and pivot
    from any hit to the responsible creator account/process, the new account, any privileged-group additions,
    and downstream logon or network behavior tied to persistence.'
  answer_sources:
