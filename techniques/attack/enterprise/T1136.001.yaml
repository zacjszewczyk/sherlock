name: 'T1136.001: Local Account'
id: 77631b14-0efa-4afc-8ee8-8ca98fc6c9ba
description: This playbook helps an analyst determine whether an adversary is creating local accounts
  to maintain persistent access to victim systems (T1136.001). Local accounts created with tools such
  as Windows 'net user /add' or PowerShell, Linux 'useradd'/'adduser' or direct edits to /etc/passwd and
  /etc/shadow, macOS 'dscl -create', ESXi 'esxcli system account add', network-device 'username' commands,
  Kubernetes service-account/RBAC objects, or container-internal account changes give an attacker secondary
  credentialed access that survives reboots and credential resets without deploying additional remote-access
  tooling. The playbook correlates account-creation telemetry (Windows Event ID 4720, auditd execve, macOS
  unified logs, AAA/syslog, Kubernetes audit logs, and eBPF/Falco runtime events) with privileged-group
  additions (Event ID 4732, usermod -aG sudo/wheel), the new account's first logon and process behavior
  (Event IDs 4624/4688, reconnaissance commands), and post-creation network egress (Zeek conn.log/dns.log/ssl.log).
  Investigative angles include creator allowlisting and threat-intel correlation, account-creation rate
  baselining and change-point detection, command-line entropy and combination detection, privileged-escalation
  timing, first-logon watchlists, and machine-learning classifiers/anomaly models. Detection blends symbolic-logic
  rules, statistical baselining, and machine learning to produce explainable, evasion-resistant alerts
  for the Persistence tactic across Windows, Linux, macOS, ESXi, Network Devices, and Containers.
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
