  - 'NAI: Domain Controllers, Member Servers, User Workstations, Privileged Access Workstations'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: '// Account-create + privileged-group-add in one command

      FILTER WinEventLog:Security WHERE EventCode==4688

      MATCH CommandLine =~ /(?=.*net1?\.exe\s+user\s+.*\/add)(?=.*net1?\.exe\s+localgroup\s+(Administrators|Remote
      Desktop Users)\s+.*\/add)/i

      OR CORRELATE 4720 + 4732 same host within 60s

      ALERT ; EMIT host, account, group'
