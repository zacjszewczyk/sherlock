name: 'T1590: Gather Victim Network Information'
id: bbdb57f1-8b03-448d-a01c-42fd8930fc55
description: 'Investigate evidence that an external adversary is gathering information about the organization''s
  networks (IP ranges, domain names, topology, and operations) as a precursor to targeting. This playbook
  helps an analyst hunt for active network reconnaissance against the external perimeter: inbound connections
  from known scanner or threat-intelligence-flagged IPs, traffic bearing reconnaissance-tool fingerprints
  (Nmap, Masscan, Nuclei, gobuster, ffuf) via User-Agent and JA3/JA4/JA4H signatures, horizontal and vertical
  port/host scanning, web content-discovery (forced browsing) marked by elevated 4xx-to-2xx ratios and
  hits on sensitive non-public paths, and DNS reconnaissance such as unauthorized AXFR/IXFR zone transfers
  and subdomain enumeration indicated by high NXDOMAIN rates. Each question pairs deterministic signature/threshold
  logic with statistical baselining and machine-learning anomaly detection so that both known tooling
  and novel reconnaissance surface for triage.'
type: technique
related:
- tactic_id: TA0043
  tactic_name: Reconnaissance
contributors:
- Zachary Szewczyk
created: '2026-05-31'
modified: '2026-05-31'
version: '1.0'
tags: none
questions:
- question: Did any external source IP that appears on a high-confidence threat-intelligence or known-scanner
    feed initiate connections to an asset inside our registered external network ranges?
  context: Reconnaissance often begins with infrastructure already catalogued on threat-intelligence feeds.
    By ingesting high-confidence TI/known-scanner lists and matching the source IP of every inbound connection
    in Zeek conn.log against them, the analyst gets a deterministic, low-effort floor signal that a known-bad
    host is probing the perimeter. A positive match against any registered external asset warrants immediate
    review of what that host touched and whether it advanced toward exploitation; a negative result does
    not clear the host (novel infrastructure won't be listed), so keep this rule alongside the statistical
    and ML detections. Deploy SigmaHQ Zeek rules for known scanner infrastructure to broaden coverage.
    This supports the Reconnaissance question of whether an adversary is actively mapping our external
    perimeter.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Threat Intelligence Feeds
  - 'NAI: Network perimeter firewalls, cloud security groups, web application firewalls, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ti = load_feed(high_confidence_scanner_and_malicious_ips)\nfor c in conn.log where c.id.resp_h\
      \ in registered_external_ranges:\n    if c.id.orig_h in ti: alert(src=c.id.orig_h, dst=c.id.resp_h,\
      \ feed=ti[c.id.orig_h].category)"
- question: Are any inbound TLS handshakes to external-facing assets matching JA3/JA3S or JA4/JA4H fingerprints
    of known scanning and exploitation tooling (Nmap NSE, Nuclei, masscan-tls)?
  context: 'Even when a scanner rotates IPs, its TLS client stack tends to produce a stable fingerprint.
    Matching JA3/JA3S hashes from Zeek ssl.log and GREASE-resilient JA4/JA4H fingerprints against deny-lists
    of scanner/tooling hashes flags reconnaissance clients regardless of source address. A match touching
    an external asset is a strong indicator of automated probing. Note the failure mode: browser-extension
    randomization fragments JA3, so corroborate any hit with the more robust JA4 fingerprint and connection
    context (fan-out, failed states) before escalating. This deterministic fingerprint match complements
    TI-based and behavioral detection for the Reconnaissance question.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Threat Intelligence Feeds
  - 'NAI: Network perimeter firewalls, cloud security groups, web application firewalls, and VPN concentrators.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "scanner_fp = load_denylist(ja3_ja3s_ja4_ja4h_of_recon_tools)\nfor s in ssl.log where s.id.resp_h\
      \ in registered_external_ranges:\n    if s.ja3 in scanner_fp or s.ja4 in scanner_fp:\n        alert(src=s.id.orig_h,\
      \ fp=coalesce(s.ja4, s.ja3), corroborate_with=conn_context)"
- question: Which external source IPs exhibit abnormally high destination-host/port fan-out or an elevated
    ratio of failed to established connections over a one-hour window against our perimeter?
  context: 'Scanning produces a behavioral signature distinct from legitimate clients: many unique destination
    hosts and ports, high connection rates, and a large share of failed connection states (S0/REJ/RSTO)
    relative to established (SF). Per external source IP over a 1-hour window, compute volume/frequency
    (unique destination host and port counts, connections/min) and the failure-state ratio from Zeek conn.log
    conn_state. Flag IPs above the 95th percentile for connection diversity OR with a high failure ratio
    per the sequential-failure logic of Threshold Random Walk (Jung et al.). Derive percentile cutoffs
    from 30 days of local perimeter data so legitimate automated clients set the baseline. A flagged IP
    is a probable scanner; correlate with TI and fingerprint hits to confirm. This directly answers whether
    reconnaissance is underway.'
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Threat Intelligence Feeds
  - 'NAI: Network perimeter firewalls, cloud security groups, web application firewalls, and VPN concentrators.'
  range: Last 90 days; evaluate per 1-hour window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "baseline = percentile_cutoffs(conn.log, lookback=30d)\ngroup conn.log by src_ip over window=1h:\n\
      \    uniq_hosts=dcount(resp_h); uniq_ports=dcount(resp_p); rate=count/60\n    fail_ratio = count(conn_state\
      \ in [S0,REJ,RSTO]) / max(count(conn_state==SF),1)\n    if uniq_hosts>baseline.p95 or uniq_ports>baseline.p95\
      \ or fail_ratio>baseline.trw_threshold:\n        alert(src_ip, uniq_hosts, uniq_ports, fail_ratio)"
- question: When scored by a machine-learning model on connection metadata, which external source IPs
    are classified as scanning or rank as outliers against benign perimeter traffic?
  context: Signatures and fixed thresholds miss novel tooling. Train a supervised classifier (Random Forest/Logistic
    Regression) on connection metadata (host/port fan-out, S0/REJ ratio, packet/byte counts, byte ratio,
    TI category) using labeled scan flows from CIC-IDS2017, or run an unsupervised Extended Isolation
    Forest on the same features trained on benign traffic. High classifier probability or a strong anomaly
    score surfaces probable reconnaissance even without a known signature. To keep alerts actionable and
    defensible, surface the top-3 contributing features (e.g., destination fan-out, failed-connection
    ratio, byte ratio) via SHAP/LIME. Treat ML output as additive to the deterministic TI and fingerprint
    floors when answering the Reconnaissance question.
  answer_sources:
  - Zeek conn.log
  - Zeek dns.log
  - Zeek http.log
  - Threat Intelligence Feeds
  - 'NAI: Network perimeter firewalls, cloud security groups, web application firewalls, and VPN concentrators.'
  range: Last 90 days; retrain on rolling benign baseline
  queries:
  - technology: ML/pseudocode
    query: "features = [host_fanout, port_fanout, s0_rej_ratio, pkts, bytes, byte_ratio, ti_category]\n\
      model = RandomForest.fit(CIC_IDS2017_labeled) OR ExtendedIsolationForest.fit(benign_perimeter)\n\
      for src_ip in conn.log_features:\n    score = model.predict(src_ip)\n    if score > threshold: alert(src_ip,\
      \ score, top3=SHAP(src_ip))"
- question: Do any external source IPs send traffic carrying recognized reconnaissance-tool signatures
    such as scanner User-Agents or tool JA3/JA4H fingerprints to internet-facing web servers?
  context: Reconnaissance tools leave recognizable artifacts in HTTP and TLS. Deploy signatures for known
    scanner User-Agents (e.g., 'Mozilla/5.0 (compatible; Nmap Scripting Engine)') and tool JA3 hashes
    over Zeek http.log/ssl.log, plus SigmaHQ recon rules. Because User-Agents are trivially spoofed, add
    GREASE-resilient JA4/JA4H HTTP header-order fingerprints to catch scanner HTTP clients (Nuclei, gobuster,
    ffuf) even when the User-Agent is faked. A match against an internet-facing web server, load balancer,
    or reverse proxy indicates active probing of web infrastructure. ZMap documents the stateless probing
    artifacts these signatures key on. This deterministic match is the floor for the Reconnaissance question
    on web-tier scanning.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - Zeek ssl.log
  - 'NAI: Internet-facing web servers, application load balancers, and reverse proxies.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "ua_sigs = load(scanner_user_agents); fp_sigs = load(tool_ja3_ja4h)\nfor r in http.log:\n \
      \   if r.user_agent matches ua_sigs or r.ja4h in fp_sigs:\n        alert(src=r.id.orig_h, host=r.host,\
      \ sig=matched)\nfor s in ssl.log where s.ja3 in fp_sigs: alert(src=s.id.orig_h, fp=s.ja3)"
- question: Which external source IPs show a high ratio of scanner-like signatures to total requests and
    rotate through multiple distinct tool signatures?
  context: A single scanner often generates a request stream dominated by tool signatures and may rotate
    tooling to evade single-signature rules. Per source IP compute the ratio of scanner-like signatures
    to total requests and the count of distinct signatures (tool rotation); flag IPs with ratio > 0.5
    using multiple distinct signatures. Combine with destination/port entropy per Lakhina et al. to confirm
    dispersed probing rather than a single targeted request. Tune the ratio against a baseline of legitimate
    automated clients (monitoring agents, uptime checks) so benign automation does not trip the rule.
    A high-ratio, multi-signature source strongly suggests deliberate reconnaissance.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - Zeek ssl.log
  - 'NAI: Internet-facing web servers, application load balancers, and reverse proxies.'
  range: Last 90 days; evaluate per source over rolling window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group http.log by src_ip:\n    sig_ratio = count(req matches scanner_sig)/count(req)\n   \
      \ distinct_sigs = dcount(matched_signature)\n    dst_entropy = shannon(distinct resp_h, resp_p)\n\
      \    if sig_ratio>0.5 and distinct_sigs>1 and dst_entropy>baseline:\n        alert(src_ip, sig_ratio,\
      \ distinct_sigs)"
- question: Are there anomalous spikes in scanner-signature volume or per-source outliers that indicate
    novel scanning tooling without a known signature?
  context: To catch both surges of known tooling and entirely new scanners, forecast scanner-signature
    volume with Seasonal ARIMA/LSTM and alert on spikes beyond the upper confidence bound; in parallel,
    score per-source feature vectors with an Extended Isolation Forest so novel tooling without a known
    signature still surfaces as an outlier. The time-series model catches coordinated bursts; the outlier
    model catches stealthier individual sources. Emit the top-3 driving features (signature diversity,
    request rate, JA4H rarity) in the alert via SHAP so analysts can quickly judge whether a spike reflects
    reconnaissance or a benign traffic shift. This extends the Reconnaissance question to previously unseen
    web-scanning behavior.
  answer_sources:
  - Zeek http.log
  - Zeek conn.log
  - Zeek notice.log
  - Zeek ssl.log
  - 'NAI: Internet-facing web servers, application load balancers, and reverse proxies.'
  range: Last 90 days; forecast on seasonal baseline
  queries:
  - technology: ML/pseudocode
    query: 'ts = timeseries(count scanner_signatures per interval)

      forecast = SARIMA_or_LSTM(ts); if observed > forecast.upper_ci: alert(spike, interval)

      feats = [signature_diversity, request_rate, ja4h_rarity]

      eif = ExtendedIsolationForest.fit(benign_sources)

      for src in per_source_feats: if eif.score(src)>thr: alert(src, top3=SHAP(src))'
- question: Does any single external source IP perform a horizontal scan (>20 unique hosts on one port
    in under a minute) or a vertical scan (>50 unique ports on one host in under a minute) against our
    network boundaries?
  context: Port and host scanning is the clearest behavioral marker of active reconnaissance. Use Zeek's
    built-in scan detection, or filter Zeek conn.log for a source IP touching >20 unique destination IPs
    on one port (horizontal) or >50 unique ports on one host (vertical) within one minute, weighting connections
    with failed conn_state (S0/REJ) since scans generate many unanswered probes. Pair with SigmaHQ scan
    rules. Preserve these hard thresholds but tune the counts to local traffic rather than removing them,
    so legitimate sweeps (vulnerability scanners, monitoring) are allowlisted. A confirmed scan against
    egress/ingress points, cloud VPC boundaries, or DMZ segments directly answers whether an adversary
    is mapping the perimeter.
  answer_sources:
  - Zeek conn.log
  - Zeek scan.log
  - 'NAI: All network egress and ingress points, including physical datacenter firewalls, cloud network
    boundaries (e.g., VPCs), and DMZ segments.'
  range: Last 90 days; evaluate per 1-minute window
  queries:
  - technology: Zeek/pseudocode
    query: "group conn.log by src_ip over window=1m:\n    horiz = max_over_port(dcount(resp_h))  # unique\
      \ hosts per single port\n    vert  = max_over_host(dcount(resp_p))  # unique ports per single host\n\
      \    fails = count(conn_state in [S0,REJ])\n    if horiz>20 or vert>50: alert(src_ip, type=(horizontal|vertical),\
      \ fails)"
- question: Do destination IP/port entropy or a sequential first-contact failure test identify any external
    source as a scanner, including low-and-slow probing?
  context: Entropy and hypothesis testing detect scans that evade fixed counts. Compute Shannon entropy
    of destination IPs and ports per source IP per Lakhina et al. — horizontal scans show high destination-IP/low
    destination-port entropy, vertical scans the reverse. Layer the Threshold Random Walk (Jung et al.)
    sequential hypothesis test on first-contact success/failure outcomes to flag scanners in as few as
    4-5 connection attempts, catching slow scanners that never trip volume thresholds. Flag IPs whose
    entropy profile or TRW likelihood ratio exceeds the benign baseline. A positive result identifies
    probable reconnaissance even when probe rates are deliberately throttled.
  answer_sources:
  - Zeek conn.log
  - Zeek scan.log
  - 'NAI: All network egress and ingress points, including physical datacenter firewalls, cloud network
    boundaries (e.g., VPCs), and DMZ segments.'
  range: Last 90 days; per-source sequential evaluation
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group conn.log by src_ip:\n    H_ip = shannon(resp_h); H_port = shannon(resp_p)\n    trw =\
      \ sequential_likelihood(first_contact_outcomes)  # success vs S0/REJ\n    if (H_ip high and H_port\
      \ low) or (H_port high and H_ip low) or trw>upper_threshold:\n        alert(src_ip, H_ip, H_port,\
      \ trw)"
- question: When connection tuples are clustered or scored by an outlier model, which external sources
    form dense automated-scan clusters or rank as anomalies against benign flows?
  context: Unsupervised learning isolates automated scanning patterns without predefined thresholds. Feature-engineer
    connection tuples (src_ip, dst_ip, dst_port, time, conn_state) and apply DBSCAN to isolate dense automated-scan
    clusters, or score per-source vectors with an Extended Isolation Forest trained on benign flows (features
    informed by the CIC-IDS2017 PortScan class). Dense clusters of similar high-fan-out connections, or
    high anomaly scores, indicate machine-driven scanning. Report the top-3 contributing features (host
    fan-out, port fan-out, failure ratio) per SHAP so analysts can validate the finding. This catches
    scan variants the deterministic and statistical layers miss for the Reconnaissance question.
  answer_sources:
  - Zeek conn.log
  - Zeek scan.log
  - 'NAI: All network egress and ingress points, including physical datacenter firewalls, cloud network
    boundaries (e.g., VPCs), and DMZ segments.'
  range: Last 90 days; retrain on rolling benign baseline
  queries:
  - technology: ML/pseudocode
    query: "tuples = features(src_ip, dst_ip, dst_port, time, conn_state)\nclusters = DBSCAN(tuples) \
      \ # dense automated-scan clusters\neif = ExtendedIsolationForest.fit(benign_flows)\nfor src in per_source_vectors:\n\
      \    if in_dense_cluster(src) or eif.score(src)>thr:\n        alert(src, top3=SHAP([host_fanout,\
      \ port_fanout, failure_ratio]))"
- question: Are external source IPs requesting sensitive non-public paths (e.g., /admin, /.git, /backup,
    /.env) and receiving 404/403 responses, indicating content discovery?
  context: Forced browsing probes for hidden or sensitive resources. Maintain a watchlist of sensitive
    non-public paths (e.g., /admin, /.git, /backup, /.env) and alert on external requests to them returning
    404/403, using SigmaHQ web rules over Zeek http.log. Add JA4H HTTP fingerprints of content-discovery
    tools (gobuster, ffuf, dirb) to catch enumeration even when wordlists are randomized and individual
    paths vary. A burst of 403/404 responses to watchlisted paths from one source is a strong indicator
    that an adversary is enumerating web content for footholds. This deterministic match anchors the Reconnaissance
    question for the web tier.
  answer_sources:
  - Zeek http.log
  - 'NAI: Internet-facing web servers, APIs, and content delivery networks (CDNs).'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "watch = [/admin, /.git, /backup, /.env, ...]\nfor r in http.log where r.id.orig_h external:\n\
      \    if r.uri in watch and r.status_code in [403,404]:\n        alert(src=r.id.orig_h, uri=r.uri,\
      \ status=r.status_code)\n    if r.ja4h in content_discovery_tool_fps: alert(src=r.id.orig_h, tool_fp=r.ja4h)"
- question: Which external source IPs generate an abnormally high ratio of HTTP 4xx client errors to 2xx
    successes with high absolute 404 volume, indicative of forced browsing?
  context: A high client-error rate is an explicit failure-mode signal of content discovery. Per source
    IP compute the ratio of 4xx client errors to 2xx successes and the absolute 404 count; flag IPs with
    ratio > 5:1 and >100 requests in 10 minutes (404 count in the 99th percentile). Derive the percentile
    from local web-server logs so legitimate crawlers and health-checks set the baseline. A source that
    requests far more missing/forbidden resources than valid ones is almost certainly enumerating directories
    and files rather than browsing normally. Correlate hits with the sensitive-path watchlist and JA4H
    tool fingerprints to confirm reconnaissance intent.
  answer_sources:
  - Zeek http.log
  - 'NAI: Internet-facing web servers, APIs, and content delivery networks (CDNs).'
  range: Last 90 days; evaluate per 10-minute window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group http.log by src_ip over window=10m:\n    r4 = count(status_code in 4xx); r2 = count(status_code\
      \ in 2xx)\n    ratio = r4/max(r2,1); c404 = count(status_code==404)\n    if ratio>5 and count(req)>100\
      \ and c404>=baseline.p99:\n        alert(src_ip, ratio, c404)"
- question: Are there anomalous spikes in 4xx volume or per-source request outliers that indicate web
    content-discovery activity beyond fixed thresholds?
  context: To catch forced browsing that hides under fixed thresholds, forecast time-series 4xx volume
    with Prophet and alert when observed volume breaches the upper bound; in parallel, score per-source
    request features (4xx/2xx ratio, unique-URI count, request rate, JA4H) with an Extended Isolation
    Forest. The forecast catches aggregate surges; the outlier model isolates individual aggressive enumerators.
    Surface the top-3 contributing features (4xx ratio, unique-URI fan-out, request rate) in the alert
    via SHAP/LIME so analysts can quickly distinguish a misbehaving client or crawler from deliberate
    content discovery. This extends the Reconnaissance question to novel and distributed forced-browsing
    patterns.
  answer_sources:
  - Zeek http.log
  - 'NAI: Internet-facing web servers, APIs, and content delivery networks (CDNs).'
  range: Last 90 days; forecast on local baseline
  queries:
  - technology: ML/pseudocode
    query: 'ts = timeseries(count 4xx per interval); fc = Prophet(ts)

      if observed > fc.upper: alert(spike, interval)

      feats = [4xx_2xx_ratio, unique_uri_count, request_rate, ja4h]

      eif = ExtendedIsolationForest.fit(benign_sources)

      for src in per_source_feats: if eif.score(src)>thr: alert(src, top3=SHAP(src))'
- question: Did any external source IP not on the authorized allowlist issue a DNS zone-transfer request
    (AXFR or IXFR) against our DNS servers?
  context: 'An unauthorized zone transfer can hand an adversary the full contents of a DNS zone — every
    host and subdomain — in a single request, a high-value reconnaissance prize. Alert immediately on
    any DNS query with qtype AXFR or IXFR in Zeek dns.log sourced from an IP not on the authorized zone-transfer
    allowlist, backed by SigmaHQ DNS rules. Legitimate transfers come only from known secondary servers,
    so any other source is suspicious by definition. Keep this deterministic rule as the floor: a single
    hit warrants immediate investigation of the requesting IP and the targeted authoritative server. This
    directly answers the Reconnaissance question for DNS-based network mapping.'
  answer_sources:
  - Zeek dns.log
  - 'NAI: Authoritative external and internal DNS servers, and recursive DNS resolvers.'
  range: Last 90 days
  queries:
  - technology: Zeek/pseudocode
    query: "allowlist = authorized_secondary_servers\nfor q in dns.log where q.qtype in [AXFR, IXFR]:\n\
      \    if q.id.orig_h not in allowlist:\n        alert(src=q.id.orig_h, zone=q.query, server=q.id.resp_h)"
- question: Which external source IPs generate an elevated rate of NXDOMAIN responses or query large numbers
    of unique, rare names per zone, indicating subdomain enumeration?
  context: Subdomain enumeration brute-forces candidate names, producing a flood of NXDOMAIN responses
    for names that do not exist. Monitor per-source NXDOMAIN (rcode) rate and unique-qname count per zone
    in Zeek dns.log — elevated NXDOMAIN is the explicit failure signal of subdomain enumeration per Nadler
    et al. Flag IPs exceeding the 99th percentile or >100 NXDOMAIN in 5 minutes; add EXPOSURE prevalence/lexical
    features to score enumeration of rare names. Tune thresholds from local resolver baselines so legitimate
    misconfigurations and chatty clients do not dominate. A source generating many failed lookups for
    diverse rare names against one zone is almost certainly enumerating subdomains.
  answer_sources:
  - Zeek dns.log
  - 'NAI: Authoritative external and internal DNS servers, and recursive DNS resolvers.'
  range: Last 90 days; evaluate per 5-minute window
  queries:
  - technology: SIEM/Stats pseudocode
    query: "group dns.log by src_ip over window=5m:\n    nx = count(rcode==NXDOMAIN); uq = dcount(query\
      \ per zone)\n    rare = lexical_prevalence_score(queries)\n    if nx>=baseline.p99 or nx>100 or\
      \ rare>threshold:\n        alert(src_ip, nx, uq, rare)"
- question: When DNS query behavior is scored by an outlier model on lexical and volumetric features,
    which external sources rank as anomalous subdomain enumerators?
  context: Lexical and volumetric modeling catches enumeration that static thresholds miss. Train an Isolation
    Forest/Extended Isolation Forest on DNS query features (qtype, qname length and n-gram entropy, NXDOMAIN
    rate, unique-qname rate) per the stateless lexical approach of Nadler et al., trained on benign traffic.
    High-entropy, high-NXDOMAIN, high-unique-qname sources surface as outliers even with throttled or
    novel enumeration patterns. Surface the top-3 contributing features (NXDOMAIN rate, unique-qname count,
    qname entropy) in alert text via SHAP/LIME so analysts can validate the finding against benign automation.
    This rounds out the Reconnaissance question for DNS-based network information gathering.
  answer_sources:
  - Zeek dns.log
  - 'NAI: Authoritative external and internal DNS servers, and recursive DNS resolvers.'
  range: Last 90 days; retrain on benign DNS baseline
  queries:
  - technology: ML/pseudocode
    query: "feats = [qtype, qname_len, ngram_entropy, nxdomain_rate, unique_qname_rate]\nif = IsolationForest.fit(benign_dns)\n\
      for src in per_source_dns_feats:\n    if if.score(src)>thr:\n        alert(src, top3=SHAP([nxdomain_rate,\
      \ unique_qname_count, qname_entropy]))"
