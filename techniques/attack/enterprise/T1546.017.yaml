- question: '[Privilege Escalation] Can a fine-tuned transformer or BERT-embedding nearest-neighbor model
    classify a udev RUN+= command''s intent as privilege-escalation (vs device-setup/logging) -- using
    the ''Embedding/text classification of command intent'' (Machine Learning) approach?'
