- question: '[Privilege Escalation] Do root systemd-udevd children score as outliers under an Isolation
    Forest, or does a provenance-graph detector flag the rule-modify->root-spawn->credential-write/egress
    subgraph -- using the ''Isolation Forest / provenance modeling of root udevd behavior'' (Machine Learning)
    approach?'
  context: 'Why this matters: The privesc kill chain (rule modify, root process spawn, credential write
    or egress) forms a recognizable structure that outlier- and graph-based models detect. Train an Isolation
    Forest on behavioral feature vectors of legitimate root systemd-udevd children (counts of file writes,
    network connects, failed connects, children spawned; one-hot syscall histogram; command-line entropy)
    and score new processes, listing the top-3 contributing features per anomaly. Complement with a provenance-graph
    detector (KAIROS/MAGIC) that flags the rule-modify->root-spawn->credential-write/egress subgraph.
    A positive result surfaces a behaviorally or structurally anomalous root udev child for deep investigation;
    a negative result indicates root udevd behavior matches learned-normal patterns. This is the highest-context
    confirmation of udev-driven privilege escalation. Citations: [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363)
    [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf) [MAGIC, Jia et al.](https://www.usenix.org/conference/usenixsecurity24/presentation/jia-zian)'
