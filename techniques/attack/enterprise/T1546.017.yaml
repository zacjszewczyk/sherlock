- question: '[Privilege Escalation] Does any udev RUN+=/IMPORT{program} directive execute a file located
    in a world-writable or transient path (/tmp, /var/tmp, /dev/shm, $HOME) or via a relative path --
    using the ''Detect world-writable RUN targets'' (Symbolic Logic) approach?'
  context: 'Why this matters: Legitimate udev rules invoke binaries from system paths; a rule that runs
    an executable out of a world-writable or transient directory is a classic privilege-escalation setup
    because any local user can replace the payload that root will execute. Parse the executable path inside
    each RUN+=/IMPORT{program} directive and alert when it resides in a world-writable/transient path
    (/tmp/, /var/tmp/, /dev/shm/, $HOME) or references a relative path. Cross-check the target file''s
    mode at detection time and escalate if it is world-writable (other-write bit set) or has the SUID
    bit. A positive result is a high-confidence privesc indicator -- the writable target lets unprivileged
    users control root execution; a negative result indicates RUN targets reside in protected system locations.
    Pair with the privilege-string regex for full coverage of the privesc setup. Citations: [udev(7) Linux
    manual page](https://man7.org/linux/man-pages/man7/udev.7.html) [Unveiling sedexp, Reichert](https://www.aon.com/en/insights/cyber-labs/unveiling-sedexp)
