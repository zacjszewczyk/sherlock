- question: '[Privilege Escalation] Is there a strong short-lag (<5 min) positive correlation between
    a file-create spike in world-writable directories and a udev rule modification spike on the same host
    -- using the ''Cross-correlate staging and rule modification'' (Machine Learning) approach?'
  context: 'Why this matters: Payload staging followed quickly by rule modification is a recognizable
    privesc/persistence workflow. Build two time series per host: (1) file-create rate in world-writable
    directories and (2) udev rule modification rate. Use cross-correlation or forecast-residual analysis;
    a strong positive correlation at short lag (<5 minutes) between a staging spike and a rule-mod spike
    indicates payload staging plus persistence/privilege-escalation setup. Report the correlated event
    pair and lag in the alert. A positive result links payload drop to rule modification in time, raising
    confidence that the two are part of one attack; a negative result indicates no temporally coupled
    staging-and-modification pattern. This temporal correlation adds context beyond static rule inspection.
    Citations: [Online Forecasting and Anomaly Detection Based on ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194)'
