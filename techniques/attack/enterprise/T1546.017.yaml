- question: '[Privilege Escalation] Do root processes spawned by systemd-udevd produce improbable syscall
    n-grams -- especially trigrams combining socket/connect with execve of shells or writes to credential
    files -- using the ''Detect anomalous syscall n-grams'' (Statistical Method) approach?'
  context: 'Why this matters: Legitimate root device-setup operations exhibit a stable syscall profile,
    so improbable sequences expose reverse shells and credential tampering. For root processes spawned
    by systemd-udevd, capture auditd syscall sequences and score n-grams (trigrams) against a baseline
    of legitimate device-setup operations, alerting on improbable n-grams -- especially those combining
    socket/connect with execve of shells or writes to credential files. A positive result flags a root
    udev child whose syscall behavior diverges from device-setup norms toward egress or credential modification;
    a negative result means the child''s syscall sequence matches the legitimate baseline. This catches
    behavioral abuse that command-line inspection alone may miss. Citations: [A Sense of Self for Unix
    Processes, Forrest et al.](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes)
    [Anomaly Detection Using HMMs with System Call and Call Stack Information, Gao et al.](https://link.springer.com/chapter/10.1007/11596981_47)'
