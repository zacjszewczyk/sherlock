    vocabulary. Alert when a new or modified rule contains rare (high-IDF) tokens that also intersect
    a privilege-escalation watchlist -- i.e., a sensitive term (shadow, sudoers, setcap, setuid) that
    is unusually prominent in that rule. Surface the rare tokens that fired. A positive result flags a
    rule whose vocabulary deviates toward privilege escalation; a negative result indicates the rule''s
    tokens are common device-setup terms. This catches privesc phrasing that exact regex patterns might
    not enumerate. Citations: [Revoke-Obfuscation, Bohannon and Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)
