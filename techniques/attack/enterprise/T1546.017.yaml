- question: '[Privilege Escalation] When systemd-udevd spawns a child with effective uid=0, does that
    child perform high-impact follow-on actions -- writes under /etc, /boot, /root/.ssh; execve of useradd/usermod/passwd/visudo/setcap/chmod;
    or outbound network connections (including failed privileged writes) -- using the ''Track root systemd-udevd
    children'' (Symbolic Logic) approach?'
  context: 'Why this matters: A root-context process spawned by systemd-udevd is the moment a udev rule
    converts into actual privilege escalation. Implement a stateful rule: when a process is created with
    ParentImage=systemd-udevd and effective uid=0, track the child PID for high-impact follow-on -- FileCreate/modify
    (Sysmon ID 11 / auditd) under /etc/, /boot/, /root/.ssh/; execve of useradd, usermod, passwd, visudo,
    setcap, or chmod; or outbound NetworkConnect (Sysmon ID 3 / Zeek conn.log). Also emit failure-state
    signals such as failed privileged writes (EACCES/EPERM) which indicate attempts. A positive result
    confirms a root udev child taking privilege-impacting actions -- a critical, actionable finding; a
    negative result indicates root udev children stayed within benign device-setup behavior. This ties
    rule content and provenance to concrete impact. Citations: [Linux Threat Hunting for Persistence,
    Berba](https://pberba.github.io/security/2021/11/22/linux-threat-hunting-for-persistence-sysmon-auditd-webshell/)
    [Unveiling sedexp, Reichert](https://www.aon.com/en/insights/cyber-labs/unveiling-sedexp)'
