- question: '[Privilege Escalation] Does a udev RUN target have a statistically rare attribute combination
    (e.g., other-writable AND non-standard path AND recently created) versus baselined legitimate targets
    -- using the ''Flag rare permission/path combinations'' (Statistical Method) approach?'
  context: 'Why this matters: Subtle privesc setups may not match a fixed path list but stand out as rare
    combinations of file attributes. Baseline the permission mode and parent-directory of executables
    legitimately referenced by udev rules, then alert when a RUN target has a statistically rare attribute
    combination -- for example, other-writable AND non-standard path AND recently created. Score rarity
    with a modified z-score (median + 3.5*MAD) on per-attribute frequency to avoid mean/variance distortion
    from sparse data. A positive result flags a RUN target whose attribute profile deviates from legitimate
    references and warrants inspection; a negative result indicates the target''s permissions and location
    match established norms. This generalizes the world-writable rule to catch unusual-but-not-listed
    cases. Citations: [Modified Z-Score, NIST](https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm)'
