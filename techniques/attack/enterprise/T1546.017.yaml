questions:
- question: '[Persistence] Are any udev rule files in the standard rule directories being created or modified
    to contain RUN+= or IMPORT{program} directives that invoke interpreters, network tools, process-detachment
    helpers, or world-writable paths -- using the ''Regex detection of suspicious RUN/IMPORT directives''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Under the Persistence tactic (TA0003), an adversary abuses udev by binding
    a malicious command to a hardware or pseudo-device event so it re-executes automatically across reboots.
    Legitimate udev rules per the udev(7) specification rarely shell out, so any RUN+= or IMPORT{program}
    that launches an interpreter (bash -i, sh -c, python, perl), a network tool (nc, ncat, curl, wget),
    or uses detachment primitives (setsid, nohup, disown, trailing &, daemon) to escape the short-lived
    systemd-udevd sandbox is high-signal. Also look for rules matching constantly accessed pseudo-devices
    via ENV{MAJOR}=="1" with ENV{MINOR}=="3|5|8|9" (/dev/null,/dev/zero,/dev/random,/dev/urandom) as seen
    in the sedexp malware, and weight high-priority filenames (digit prefix >= 90-). Trigger on any file
    create/modify within the udev rule directories and scan the content for these abuse primitives. A
    positive hit means a rule was crafted to run attacker code on device events -- pivot to the writing
    process, its lineage, and the referenced binary. A negative result helps rule out content-based udev
    persistence but should be corroborated with the provenance and behavioral questions in this playbook.
    Citations: [Unveiling sedexp, Reichert](https://www.aon.com/en/insights/cyber-labs/unveiling-sedexp)
    [udev(7) Linux manual page](https://man7.org/linux/man-pages/man7/udev.7.html) [SigmaHQ](https://github.com/SigmaHQ/sigma)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Zeek files.log
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: Linux servers (web, database, application), Linux workstations, CI/CD pipeline servers, and
    container hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  # Suspicious RUN/IMPORT in udev rules\n  index=auditd OR sysmon_linux EventID=11\n \
      \ file_path IN (\"/etc/udev/rules.d/*\",\"/run/udev/rules.d/*\",\"/usr/lib/udev/rules.d/*\",\"/usr/local/lib/udev/rules.d/*\"\
      ,\"/lib/udev/rules.d/*\")\n  AND new_content MATCH /(RUN\\s*\\+=|IMPORT\\{program\\})/\n  AND new_content\
      \ MATCH /(bash -i|sh -c|\\bnc\\b|ncat|/bin/python|perl|curl|wget|setsid|nohup|disown|&\\s*\"|/tmp/|/var/tmp/|/dev/shm/)/\n\
      \  OR new_content MATCH /ENV\\{MAJOR\\}==\"1\".*ENV\\{MINOR\\}==\"(3|5|8|9)\"/\n  | eval prio=regex_capture(file_name,'^(\\\
      d+)-')\n  | where prio>=90\n  | table host,file_path,writer_comm,new_content -> alert(high)"
- question: '[Persistence] Are there denied or anomalous write attempts (EACCES/EPERM) or successful non-root
    writes to the udev rule directories -- using the ''Failure-mode: denied/anomalous write attempts''
    (Symbolic Logic) approach?'
  context: 'Why this matters: Profiling the failure state of the persistence surface catches adversaries
    probing or attempting to write udev rules without sufficient privilege. From auditd SYSCALL records
    on the udev rule directories, alert on write/open-for-write attempts that return EACCES/EPERM (exit=-13/-1)
    by non-root accounts -- these indicate reconnaissance of the persistence surface -- and on successful
    writes (success=yes) by any auid whose UID is not 0, since legitimate rule changes come from root
    via package managers. Establish auditd watches such as ''-w /etc/udev/rules.d/ -p wa -k udev_persist''
    (repeat per directory). A positive result of denied writes shows attempted but failed persistence;
    a positive result of an unauthorized successful write is a strong persistence signal. A negative result
    indicates no out-of-policy write activity against the udev surface during the window. Citations: [Linux
    Threat Hunting for Persistence, Berba](https://pberba.github.io/security/2021/11/22/linux-threat-hunting-for-persistence-sysmon-auditd-webshell/)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Zeek files.log
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: Linux servers (web, database, application), Linux workstations, CI/CD pipeline servers, and
    container hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  # auditd watch: -w /etc/udev/rules.d/ -p wa -k udev_persist (per dir)\n  index=auditd\
      \ key=udev_persist syscall IN (open,openat,write,creat)\n  | eval denied = (exit=-13 OR exit=-1)\n\
      \  | where (denied AND auid_uid!=0) OR (success=\"yes\" AND auid_uid!=0)\n  | table host,auid,syscall,exit,success,file_path\
      \ -> alert"
- question: '[Persistence] Do any RUN+= or IMPORT command strings in udev rules show unusually high Shannon
    entropy or non-alphanumeric/base64 character-class ratios relative to package-installed rules -- using
    the ''Entropy and character-class scoring of RUN commands'' (Statistical Method) approach?'
  context: 'Why this matters: Adversaries often obfuscate or encode the commands embedded in udev RUN+=
    directives to evade simple keyword matching. For each RUN+=/IMPORT command string, compute volume
    (string length, argument count), Shannon entropy, and character-class ratios (non-alphanumeric %,
    digit %, base64-charset %). Baseline these against commands found in package-manager-installed rules
    and alert when entropy or non-alphanumeric ratio exceeds the 95th percentile, using a robust threshold
    (median + 3.5*MAD) to resist contamination from a few outliers. Surface the offending command and
    which feature breached the threshold. A positive result flags likely obfuscation/encoding worthy of
    decoding and triage; a negative result means observed RUN commands look like ordinary device-setup
    vocabulary. This complements the regex method by catching obfuscation that signatures miss. Citations:
    [Revoke-Obfuscation, Bohannon and Holmes](https://blackhat.com/docs/us-17/thursday/us-17-Bohannon-Revoke-Obfuscation-PowerShell-Obfuscation-Detection-And%20Evasion-Using-Science-wp.pdf)
    [Modified Z-Score, NIST](https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Zeek files.log
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: Linux servers (web, database, application), Linux workstations, CI/CD pipeline servers, and
    container hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  # Entropy / char-class scoring of RUN commands\n  base = udev_rules where source=package_manager\
      \ | extract run_cmd\n  feats(cmd) = {len, argc, shannon_entropy(cmd), nonalnum_ratio(cmd), digit_ratio,\
      \ b64_charset_ratio}\n  thr = median(base.entropy)+3.5*MAD(base.entropy); thr2 = p95(base.nonalnum_ratio)\n\
      \  new udev RUN cmd: if entropy>thr OR nonalnum_ratio>thr2 -> alert(cmd, breached_feature)"
- question: '[Persistence] Is the rate of udev rule modifications (per host and environment-wide) exceeding
    the forecasted prediction interval, suggesting mass persistence deployment -- using the ''Forecast
    modification-rate spikes'' (Machine Learning) approach?'
  context: 'Why this matters: Legitimate udev rule changes are driven largely by package updates and are
    highly seasonal, so a sudden, unexplained spike in modification rate can indicate an adversary deploying
    persistence across many hosts at once. Model the frequency of udev rule modifications (count/hour/host
    and environment-wide) with an ARIMA or Seasonal-Hybrid-ESD forecaster trained on at least 30 days
    of data, and alert when observed counts exceed the prediction interval. The alert should list the
    top-3 contributors (host, writing process, delta over forecast) so analysts can act quickly. A positive
    result points to coordinated or anomalous rule-writing activity to investigate; a negative result
    indicates modification volume is within the expected seasonal envelope. Pair this with the per-user/per-host
    scoring question to localize the anomaly. Citations: [Online Forecasting and Anomaly Detection Based
    on ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Zeek files.log
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: Linux servers (web, database, application), Linux workstations, CI/CD pipeline servers, and
    container hosts.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  # Forecast udev modification rate\n  series = count(udev_rule_modify) by host,hour over\
      \ >=30d\n  model = ARIMA_or_SHESD(series, seasonality=weekly)\n  if observed > pred_interval_upper:\
      \ alert(top3_contributors=[host,writer_proc,delta])"
- question: '[Persistence] Are udev rule directories being written by a process that is NOT on an allowlist
    of package managers or configuration-management agents -- using the ''Allowlist authorized modifiers''
    (Symbolic Logic) approach?'
  context: 'Why this matters: On well-managed Linux hosts, udev rule files are changed almost exclusively
    by package managers (dpkg, rpm, yum, dnf, apt, apt-get, zypper) or configuration-management agents
    (ansible, puppet, chef-client, salt-minion). Any other process writing into a udev rule directory
    is suspicious. On any udev-rule-directory write (auditd SYSCALL / Sysmon for Linux Event ID 11), alert
    when the initiating comm/Image is not on the allowlist, and resolve the writer through process lineage
    (parent/grandparent) to catch interactive shells dropped by systemd-udevd or by a webshell. A positive
    result identifies an unauthorized modifier to investigate immediately; a negative result confirms
    changes came from expected automation. This provenance check pairs with the content-scanning questions
    to separate benign package activity from hands-on-keyboard persistence. Citations: [Linux Threat Hunting
    for Persistence, Berba](https://pberba.github.io/security/2021/11/22/linux-threat-hunting-for-persistence-sysmon-auditd-webshell/)
    [SigmaHQ](https://github.com/SigmaHQ/sigma)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: Linux servers, Linux workstations, especially those managed by configuration management tools.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  # Allowlist authorized udev modifiers\n  ALLOW = {dpkg,rpm,yum,dnf,apt,apt-get,zypper,ansible,puppet,chef-client,salt-minion}\n\
      \  index=auditd OR sysmon_linux EventID=11 file_path IN (udev_rule_dirs)\n  | resolve lineage(writer,\
      \ parent, grandparent)\n  | where writer_comm NOT IN ALLOW AND parent_comm NOT IN ALLOW\n  | table\
      \ host,writer_comm,parent_comm,file_path -> alert"
- question: '[Persistence] Does any user (auid) or host show an anomalous spike or a 0->positive transition
    in udev rule modification counts versus its own and peer-group baseline -- using the ''Score per-user/per-host
    modification spikes'' (Statistical Method) approach?'
  context: 'Why this matters: Most users never modify udev rules, so even a single modification by a non-admin
    user is notable. Maintain a rolling 30-day count of udev rule modifications per auid and per host
    (tracking success/fail state of the write). Because the baseline is mostly zero, use a robust modified
    z-score (median + 3.5*MAD) rather than mean/standard deviation, and alert on any 0->positive transition
    for non-admin users or any count exceeding the robust threshold relative to the user''s own history
    and peer group. A positive result highlights a user or host newly engaging in udev modification --
    a behavioral break worth triage; a negative result indicates modification activity matches established
    baselines. This localizes anomalies that the environment-wide forecast may average out. Citations:
    [Modified Z-Score, NIST](https://www.itl.nist.gov/div898/handbook/eda/section3/eda35h.htm) [Online
    Forecasting and Anomaly Detection Based on ARIMA, Pena et al.](https://www.mdpi.com/2076-3417/11/7/3194)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: Linux servers, Linux workstations, especially those managed by configuration management tools.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  # Robust per-user/per-host spike scoring (30d rolling)\n  cnt = count(udev_rule_modify)\
      \ by auid,host over 30d\n  mz = 0.6745*(x - median)/MAD\n  alert if (prev=0 AND now>0 AND auid not\
      \ in admins) OR mz>3.5 vs self/peer baseline"
- question: '[Persistence] Can a supervised classifier label a udev rule modification event as benign
    vs suspicious based on writer/parent process, auid, tty, timing, rule prefix, RUN-present, and command-line
    entropy -- using the ''Explainable classification of modification events'' (Machine Learning) approach?'
  context: 'Why this matters: A single signal is often ambiguous, but the combination of features around
    a modification event can reliably separate routine automation from hands-on persistence. Train a gradient-boosted
    or Random-Forest classifier (benign vs suspicious) on first-party event features: writing process_name,
    parent_process_name, auid, interactive-tty flag, time-of-day/day-of-week, rule digit-prefix, RUN-present
    boolean, and command-line entropy. Emit the top-3 feature contributions (SHAP/gain) in the alert text
    so analysts see why an event scored suspicious (e.g., ''parent=bash, tty=yes, prefix=99''), and route
    ''suspicious'' events to triage. A positive (suspicious) classification with explanatory features
    accelerates investigation; a negative result indicates the event resembles known-good modifications.
    Use alongside the allowlist rule for higher-confidence decisions. Citations: [Obfuscated Command Line
    Detection Using Machine Learning, Mandiant](https://cloud.google.com/blog/topics/threat-intelligence/obfuscated-command-line-detection-using-machine-learning/)
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: Linux servers, Linux workstations, especially those managed by configuration management tools.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  # Explainable classifier of modification events\n  X = [process_name,parent_process_name,auid,tty_interactive,hour,dow,rule_prefix,run_present,cmd_entropy]\n\
      \  model = GradientBoosted/RandomForest(benign vs suspicious)\n  p = model.predict(X); if p==suspicious:\
      \ alert(top3=SHAP(X)) -> triage"
- question: '[Persistence] Is systemd-udevd parenting an interpreter or network tool, or is a udevd child
    making an outbound network connection -- using the ''Detect interpreters/egress from udevd'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: The udev(7) specification states RUN programs are short-lived and the systemd-udevd
    sandbox blocks network and filesystem access, so a detached or long-running child under systemd-udevd
    -- especially an interpreter or one that reaches the network -- is itself anomalous and characteristic
    of sedexp-style abuse. Alert when a process is created (Sysmon for Linux Event ID 1 / auditd execve)
    with ParentImage ending /systemd-udevd and the child is an interpreter (/bin/bash, /bin/sh, /usr/bin/python*,
    perl, ruby) or a network tool, OR when that child PID subsequently makes an outbound connection (Sysmon
    Event ID 3 / Zeek conn.log). Enrich destinations against threat-intel blocklists but do not require
    external lookups for the base alert. A positive result strongly indicates active udev-triggered code
    execution and possible C2; a negative result indicates udevd is only spawning expected short-lived
    helpers. This is the runtime confirmation of the rule-content findings. Citations: [udev(7) Linux
    manual page](https://man7.org/linux/man-pages/man7/udev.7.html) [Unveiling sedexp, Reichert](https://www.aon.com/en/insights/cyber-labs/unveiling-sedexp)'
  answer_sources:
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: All Linux hosts; Network egress points and internal network sensors for Zeek data correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  # Interpreters/egress from udevd\n  index=sysmon_linux EventID=1 OR auditd execve\n\
      \  ParentImage ENDSWITH \"/systemd-udevd\"\n  AND (Image IN (/bin/bash,/bin/sh,/usr/bin/python*,perl,ruby)\
      \ OR Image IN net_tools)\n  | join child_pid (EventID=3 outbound) -> alert"
  - technology: Zeek/pseudocode
    query: ">-\n  # conn.log: outbound from udevd-spawned PID host\n  conn.log | where orig_h in udevd_child_hosts\
      \ AND conn_state in (S1,SF,OTH) AND resp_p not in allowlist\n  | enrich resp_h with intel; alert"
- question: '[Persistence] Are systemd-udevd spawning child process names/args outside the normal top-99%
    baseline, or producing improbable syscall n-grams such as socket,connect,execve -- using the ''Flag
    rare children and improbable syscall n-grams'' (Statistical Method) approach?'
  context: 'Why this matters: A frequency baseline of what systemd-udevd legitimately spawns is narrow,
    so rare children or unusual argument patterns reveal abuse. Build a frequency baseline of child process
    names/args spawned by systemd-udevd and alert on names outside the top 99% and on low Jaccard similarity
    of args versus known-good. For deeper signal, capture syscall sequences and score short n-grams (e.g.,
    trigrams like socket,connect,execve) against a normal ''self'' profile, alerting on improbable sequences
    that indicate reverse shells or egress. A positive result flags an anomalous udevd child to investigate;
    a negative result means udevd behavior matches its established self-profile. This statistical view
    catches living-off-the-land children that an allowlist of names alone might miss. Citations: [A Sense
    of Self for Unix Processes, Forrest et al.](https://asu.pure.elsevier.com/en/publications/sense-of-self-for-unix-processes)
    [Anomaly Detection Using HMMs with System Call and Call Stack Information, Gao et al.](https://link.springer.com/chapter/10.1007/11596981_47)'
  answer_sources:
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: All Linux hosts; Network egress points and internal network sensors for Zeek data correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/Stats pseudocode
    query: ">-\n  # Rare udevd children + syscall n-grams\n  base_children = freq(child_name,args) parented_by\
      \ systemd-udevd\n  alert if child_name not in top99% OR jaccard(args, knowngood)<thr\n  ngram =\
      \ trigrams(syscall_seq); alert if p(ngram|self_profile) < eps  # e.g. socket,connect,execve"
- question: '[Persistence] Do systemd-udevd-parented executions score as outliers under an Isolation Forest,
    or does a log-sequence/provenance model flag the file-write->udev-reload->udevd-spawn->egress chain
    -- using the ''Outlier/provenance modeling of udevd executions'' (Machine Learning) approach?'
  context: 'Why this matters: The full attack leaves a structured trail (rule write, udev reload, udevd-spawned
    process, network egress) that sequence- and graph-based models detect even when individual events
    look benign. Score systemd-udevd-parented executions with an Isolation Forest over volume/frequency/state
    features (child count, file-write count, network-connect count plus failed-conn count, command-line
    entropy, dst-port category, dst-ip rarity) and flag outliers with the top-3 contributing features.
    In parallel, run an LSTM log-sequence model (DeepLog) over the auditd/udev event stream and/or a provenance-graph
    detector (KAIROS/MAGIC) to catch the file-write->udev-reload->udevd-spawn->egress chain as anomalous
    structure. A positive result surfaces structurally anomalous udev activity for deep investigation;
    a negative result indicates udevd execution provenance matches learned-normal patterns. Citations:
    [Isolation Forest, Liu et al.](https://doi.org/10.1145/2133360.2133363) [DeepLog, Du et al.](https://doi.org/10.1145/3133956.3134015)
    [KAIROS, Cheng et al.](https://tfjmp.org/publications/2024-sp.pdf) [MAGIC, Jia et al.](https://www.usenix.org/conference/usenixsecurity24/presentation/jia-zian)'
  answer_sources:
  - Sysmon for Linux Event ID 1 (ProcessCreate)
  - Sysmon Event ID 3 (Network Connection)
  - Zeek conn.log
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: All Linux hosts; Network egress points and internal network sensors for Zeek data correlation.'
  range: Last 90 days
  queries:
  - technology: SIEM/ML pseudocode
    query: ">-\n  # Isolation Forest + sequence/provenance on udevd execs\n  X=[child_cnt,file_write_cnt,net_conn_cnt,failed_conn_cnt,cmd_entropy,dstport_cat,dstip_rarity]\n\
      \  iso = IsolationForest(); if iso.score(X)<thr: alert(top3_features)\n  DeepLog(auditd_event_seq)\
      \ / KAIROS|MAGIC(provenance_graph): flag write->reload->spawn->egress chain"
- question: '[Privilege Escalation] Do any udev rule files contain RUN+= or IMPORT directives with privilege-escalation
    strings such as chmod u+s/4755, setcap, /etc/passwd, /etc/shadow, /etc/sudoers, NOPASSWD:, useradd/usermod,
    or authorized_keys appends -- using the ''YARA/regex detection of privilege RUN commands'' (Symbolic
    Logic) approach?'
  context: 'Why this matters: Under the Privilege Escalation tactic (TA0004), an adversary uses a root-context
    udev RUN+= command to grant themselves elevated access. Scan the content of modified udev rule files
    for RUN+=/IMPORT directives containing high-confidence privesc strings: chmod with SUID/SGID modes
    (u+s, 4755, 6755, or octal modes setting setuid/setgid), setcap, references to /etc/passwd, /etc/shadow,
    /etc/sudoers, NOPASSWD:, user-management commands (useradd, usermod, adduser), copies into /etc/,
    or appends to authorized_keys. Trigger a critical alert on match because udev rules legitimately never
    perform these actions. A positive result is a strong, actionable privilege-escalation indicator --
    preserve the rule and the target file and investigate the writer; a negative result helps rule out
    content-based udev privesc but should be paired with the world-writable-target and behavioral questions
    below. Citations: [Unveiling sedexp, Reichert](https://www.aon.com/en/insights/cyber-labs/unveiling-sedexp)
    [udev(7) Linux manual page](https://man7.org/linux/man-pages/man7/udev.7.html) [SigmaHQ](https://github.com/SigmaHQ/sigma)'
  answer_sources:
  - Sysmon for Linux Event ID 11 (FileCreate)
  - auditd SYSCALL/CONFIG_CHANGE
  - 'NAI: All Linux hosts, with a focus on multi-user systems and servers hosting sensitive applications
    or data.'
  range: Last 90 days
  queries:
  - technology: SIEM/Rule pseudocode
    query: ">-\n  # Privesc strings in udev RUN/IMPORT\n  udev_rule_modify where new_content MATCH /(RUN\\\
      s*\\+=|IMPORT)/\n  AND new_content MATCH /(chmod\\s+(u\\+s|4755|6755|[0-7]*[4-7][0-7]{3})|setcap|\\\
      /etc\\/passwd|\\/etc\\/shadow|\\/etc\\/sudoers|NOPASSWD:|useradd|usermod|adduser|cp .* \\/etc\\\
      /|authorized_keys)/\n  -> alert(critical)"
- question: '[Privilege Escalation] Does any new or modified udev rule contain rare (high-IDF) command
    tokens that also intersect a privilege-escalation watchlist -- using the ''TF-IDF/token-rarity scoring
    of RUN tokens'' (Statistical Method) approach?'
  context: 'Why this matters: Normal udev RUN commands draw from a small, repetitive vocabulary of device-setup
