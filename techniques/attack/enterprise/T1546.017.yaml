name: 'T1546.017: Udev Rules'
id: 2ce17989-af69-4fdc-8a47-975921fc65a7
description: 'This playbook helps an analyst investigate whether an adversary is abusing the Linux udev
  subsystem (T1546.017) to establish persistence and/or escalate privileges by creating or modifying udev
  rule files. udev rules live in /etc/udev/rules.d/, /run/udev/rules.d/, /usr/lib/udev/rules.d/, /usr/local/lib/udev/rules.d/,
  and /lib/udev/rules.d/, and use match keys plus action keys (notably RUN+= and IMPORT{program}) to trigger
  commands on hardware or pseudo-device events. Adversaries (e.g., the sedexp malware) bind a malicious
  RUN+= command to a constantly accessed pseudo-device such as /dev/random so their payload runs repeatedly,
  and they use setsid/nohup/disown to detach the process and escape the short-lived systemd-udevd sandbox
  that otherwise blocks network and filesystem access. The playbook guides the hunt across several behavioral
  angles: file create/modify events in udev rule directories scanned for suspicious RUN+=/IMPORT directives
  (interpreters, network tools, detachment, world-writable paths, privilege-escalation strings such as
  chmod u+s, /etc/passwd, /etc/shadow, /etc/sudoers, NOPASSWD:, authorized_keys); failed and unauthorized
  write attempts to those directories; modifications initiated by processes outside an allowlist of package
  managers and configuration management agents; and process executions parented by systemd-udevd that
  spawn interpreters, write to system configuration files, create users, or initiate outbound network
  connections. Detection methods combine symbolic-logic rules, statistical baselining (entropy and character-class
  scoring, TF-IDF/token rarity, robust modified z-score, syscall n-grams, cross-correlation) and machine
  learning (ARIMA/S-H-ESD forecasting, gradient-boosted/Random-Forest classification, transformer/BERT
  command-intent classification, Isolation Forest, and DeepLog/KAIROS/MAGIC provenance modeling) applied
  to auditd SYSCALL/CONFIG_CHANGE, Sysmon for Linux Event IDs 1/11, Sysmon Event ID 3, and Zeek conn.log/files.log
  so the analyst can corroborate suspected udev abuse against rule content, writer provenance, process
  lineage, and egress context.'
type: technique
related:
- tactic_id: TA0003
  tactic_name: Persistence
- tactic_id: TA0004
  tactic_name: Privilege Escalation
